version: "2"

run:
  timeout: 5m
  go: "1.26"

# The layer dependency firewall (kernel → core → service → pkg/v1) is now
# enforced by Bazel visibility rules in the per-layer BUILD.bazel files.
# golangci-lint keeps running the remaining code-quality checks below —
# it stays useful as a second-opinion lint even though Bazel is the
# primary build/test system.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
