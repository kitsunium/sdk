# ═══════════════════════════════════════════════════════════════════════════════
# KTN-Linter configuration — kitsunium/sdk
# ═══════════════════════════════════════════════════════════════════════════════
#
# The defaults are strict (see `ktn-linter config --generate` for the full
# reference). This file only overrides what conflicts with the SDK's design
# choices; every other rule runs with its default behaviour.
#
# Every override below has a brief justification so future readers (and
# code reviewers) can challenge the exception instead of rubber-stamping it.
# ═══════════════════════════════════════════════════════════════════════════════

version: 1

# ── Vocabulary (per kodflow/ktn-linter#337) ───────────────────────────────────
# Project-declared adapter-role interfaces exempt from KTN-INTERFACE-ERNAME.
#
# Resolution order at the rule (per PR #337):
#   1. exact FQN match against adapter_role_interfaces
#   2. PascalCase HasSuffix scan against adapter_role_suffixes
#   3. otherwise → rule fires
#
# Both lists default to empty; behaviour is strictly additive.
vocabulary:
  # Project-wide suffix family — every single-method interface whose name
  # ends in one of these is exempt from the -er requirement. Provider /
  # Acceptor / Source / Sink are the canonical adapter-role idioms used by
  # codec adapter contracts (mirrors crypto.{Decrypter,Signer}-style naming
  # but for nominal-role interfaces rather than verb-er interfaces).
  adapter_role_suffixes:
    - Provider
    - Acceptor
    - Source
    - Sink

# ── Global options ────────────────────────────────────────────────────────────

# Full strict mode stays off so test files / testdata keep their ergonomic
# exemptions (mocks, table-driven assertions, etc.).
strict_mode: false

# Phase 8 (`tests`) is opt-in; the default active set is {1..7}.
# Use `phases.enabled` / `phases.disabled` to override (mutually exclusive).
# phases:
#   enabled: [1, 2, 3, 4, 5, 6, 7]

# Respect `// Code generated …` markers so generated files are skipped.
skip_generated: true

# Tags recognised by KTN-STRUCT-JSONTAG. Extend as we ship more codecs so the
# audit keeps recognising legitimate struct-tag annotations.
serialization_tags:
  - json
  - xml
  - yaml
  - toml
  - protobuf
  - msgpack
  - cbor
  - bson

# ── Global file exclusions ────────────────────────────────────────────────────
# Skip any path that matches one of the glob patterns below, for every rule.
# Use this list for third-party / generated / non-source trees only.
exclude:
  # Vendored third-party code — never our convention to enforce.
  - "vendor/**"
  # Build-time tools (single-purpose scripts under tools/) — per the
  # Rule 8 exemption in /workspace/CLAUDE.md, these are tooling, not
  # library code, and stay out of the per-package doc-style gates.
  - "tools/**"
  # Go module cache occasionally shows up in IDE-driven scans.
  - "**/.cache/**"
  # Protocol Buffers and gRPC generated code.
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/*_grpc.pb.go"
  # FlatBuffers / Cap'n Proto generated code.
  - "**/*.capnp.go"
  - "**/*_generated.go"
  # Generic `*.gen.go` / `*_gen.go` marker used by stringer, mockgen, etc.
  - "**/*.gen.go"
  - "**/*_gen.go"
  # Mock files produced by mockgen / moq / counterfeiter.
  - "**/mocks/**"
  - "**/*_mock.go"
  - "**/mock_*.go"
  # Stringer output.
  - "**/*_string.go"
  # Jennifer / go-jet / go-swagger generated trees.
  - "**/generated/**"
  - "**/gen/**"
  # WebAssembly / CGO stubs we don't audit.
  - "**/*.wasm.go"
  # Test coverage artifacts and profile output.
  - "**/coverage.out"
  - "**/*.test"
  - "**/*.prof"

# ═══════════════════════════════════════════════════════════════════════════════
# RULE OVERRIDES
# ═══════════════════════════════════════════════════════════════════════════════
# Keep this list small on purpose — every entry here is a design choice we
# committed to, not "this warning is annoying".
# ═══════════════════════════════════════════════════════════════════════════════

rules:
  # KTN-INTERFACE-ANYUSE (info) — "prefer specific interface".
  #
  # Scoped exception: the codec packages implement a universal Codec
  # interface whose Marshal/Unmarshal signatures REQUIRE `any` (the whole
  # point of a universal codec is that the user's struct type is not known
  # to the codec). The auto-exemptions documented in the rule (type switch,
  # map storage) do not fire on concrete methods that simply delegate to
  # `encoding/json`, `encoding/xml`, etc.
  #
  # Disable ONLY inside the codec tree AND the logger Value union. Every
  # other Go package in the SDK must still avoid `any` except where the
  # Codec contract requires it (codec) or the slog-style discriminated
  # Value union demands it for Time / Group / Any payloads (logger).
  KTN-INTERFACE-ANYUSE:
    exclude:
      - "**/internal/core/codec/**"
      - "**/internal/service/codec/**"
      - "**/pkg/v1/codec/**"
      - "**/internal/core/logger/**"
      - "**/internal/service/logger/**"
      - "**/pkg/v1/logger/**"

  # (Removed) KTN-VAR-MAKEAPPEND + KTN-VAR-SLICECAP ring exclusion: the
  # generic fixed-length-storage false positive it covered was fixed upstream
  # in ktn-linter (append-reachability gating, kodflow/ktn-linter#183) and is
  # no longer reproducible on v1.34.0 — verified by lint-with-exclusion-removed.
  # Re-add a scoped exclusion only if a future binary regresses the heuristic.

  # KTN-TEST-SUFFIX + KTN-TEST-TABLE — scoped exception for the codec
  # benchmark file. Normally Test* functions must live in
  # _internal_test.go / _external_test.go (TEST-SUFFIX) and follow the
  # table-driven pattern (TEST-TABLE). pkg/v1/codec/codec_bench_test.go
  # hosts a single `TestGenerateBenchMD` whose only job is to drive the
  # full bench matrix (via testing.Benchmark on the same package-local
  # make<Op>Bench helpers used by every Benchmark* function in the file)
  # and write pkg/v1/codec/BENCH.md. Moving the Test out would either
  # duplicate the helpers or expose them across files; a single-shot
  # report generator is also a poor fit for the table-driven pattern.
  KTN-TEST-SUFFIX:
    exclude:
      - "**/pkg/v1/codec/codec_bench_test.go"
  KTN-TEST-TABLE:
    exclude:
      - "**/pkg/v1/codec/codec_bench_test.go"

  # KTN-STRUCT-ROLE + KTN-STRUCT-ROLE-STUTTER — narrow exclude for CappedRecycler
  # ONLY (one file). recycler is internal/kernel plumbing, never re-exported in
  # pkg/v1, so the interface-for-consumers convention does not apply; the
  # primitives are concrete structs per ADR 0010 (avoids an interface dispatch
  # on the Get/Put hot path).
  #
  # Recycler[T] needs NO exclude: the PNPT per-declaration fix
  # (kodflow/ktn-linter#356, PR #357) makes a package-named primitive exempt
  # regardless of siblings. CappedRecycler[T] is a cap-bounded variant of the
  # same primitive, but its name is not an exact PNPT match (recycler !=
  # cappedrecycler), so STRUCT-ROLE + the info-level STUTTER still flag it.
  # That compound-variant case is filed as kodflow/ktn-linter#359 (proposal:
  # extend PNPT to a trailing-component match, or adopt #285 additional_suffixes).
  #
  # REQUIRES a ktn-linter build that includes #356 (on the linter's main branch
  # today; cut a release > v1.34.0, or pin the devcontainer to it). Under the
  # plain v1.34.0 release Recycler ALSO flags and this one-file exclude is
  # insufficient — widen back to "**/internal/kernel/recycler/**" in that case.
  #
  # TODO(remove entirely once #359 lands OR #285 additional_suffixes ships in a
  # release: then add `KTN-STRUCT-ROLE.additional_suffixes: [Recycler]` and drop
  # this block).
  KTN-STRUCT-ROLE:
    exclude:
      - "**/internal/kernel/recycler/capped.go"
  KTN-STRUCT-ROLE-STUTTER:
    exclude:
      - "**/internal/kernel/recycler/capped.go"

  # KTN-FUNC-NOINIT stays ACTIVE everywhere — no exclusion.
  # Go 1.26 convention is to avoid init() in favour of explicit constructors,
  # sync.Once for lazy init, or package-level var initialisers. The codec
  # registry will follow that: each codec subpackage registers itself via
  # `var Codec codec.Codec = codec.Register(&fooCodec{})` (named singleton,
  # not init()), or via an explicit constructor the facade invokes.
