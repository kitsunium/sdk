  KTN-STRUCT-ACCESSOR:
    exclude:
      # TEMPORARY — kodflow/ktn-linter#693: STRUCT-ACCESSOR fires on Unwrap and
      # promoted methods (false positive).
      # Temporaire, à retirer quand l'issue est corrigée. Scoped to the
      # framework module only.
      - "framework/**"
      - "**/framework/**"
      # TEMPORARY — the same kodflow/ktn-linter#693, on service/sql.Withheld.
      # Its Unwrap returns the driver's error it holds, and the rule asks for
      # it to be renamed Cause; but Unwrap is the errors package's protocol,
