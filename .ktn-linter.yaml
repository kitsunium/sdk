# ═══════════════════════════════════════════════════════════════════════════════
# KTN-Linter configuration — kitsunium/sdk
# ═══════════════════════════════════════════════════════════════════════════════
#
# The defaults are strict (see `ktn-linter config --generate` for the full
# reference). This file only overrides what conflicts with the SDK's design
# choices; every other rule runs with its default behaviour.
#
# Every override below has a brief justification so future readers (and
# code reviewers) can challenge the exception instead of rubber-stamping it.
# ═══════════════════════════════════════════════════════════════════════════════

version: 1

# ── Vocabulary (per kodflow/ktn-linter#337) ───────────────────────────────────
# Project-declared adapter-role interfaces exempt from KTN-INTERFACE-ERNAME.
#
# Resolution order at the rule (per PR #337):
#   1. exact FQN match against adapter_role_interfaces
#   2. PascalCase HasSuffix scan against adapter_role_suffixes
#   3. otherwise → rule fires
#
# Both lists default to empty; behaviour is strictly additive.
vocabulary:
  # Project-wide suffix family — every single-method interface whose name
  # ends in one of these is exempt from the -er requirement. Provider /
  # Acceptor / Source / Sink are the canonical adapter-role idioms used by
  # codec adapter contracts (mirrors crypto.{Decrypter,Signer}-style naming
  # but for nominal-role interfaces rather than verb-er interfaces).
  adapter_role_suffixes:
    - Provider
    - Acceptor
    - Source
    - Sink

  # Exact-FQN exemptions for nominal-role interfaces whose domain name is the
  # documentation. Renaming core/net.Policy to "Allower" would lose the word the
  # whole feature is discussed in ("the read-only policy"), and the -er form
  # describes the method rather than the role the type plays.
  adapter_role_interfaces:
    - github.com/kitsunium/sdk/internal/core/net.Policy
    # core/entitlement.BoundProver is ALREADY a verb-er interface — "a prover,
    # bound" — and the rule's mechanical <Method>+er derivation asks for
    # "ProvePossessionForrer", which is not a word in any language. The
    # method's name is fixed by the port it extends: coreent.Identity declares
    # ProvePossession, so the sibling's method has to say what it adds to that
    # verb rather than rename it (ADR 0092). Renaming the interface to match
    # the derivation would lose the word the whole feature is discussed in —
    # "the bound proof" — which is the same argument net.Policy is exempt on.
    #
    # This package has already paid for the rule once, in the other direction:
    # svcent.BearerFetch is a FUNC TYPE and its doc comment says so — "naming
    # it as a single-method interface would also force the -er form of
    # GetWithBearer, which is not a word". A func type is not available here,
    # because the engine reaches this contract by type assertion on a value it
    # holds as an Identity.
    - github.com/kitsunium/sdk/framework/internal/core/entitlement.BoundProver
    # core/mail.Transport and core/mail.BatchSender (ADR 0064). "Transport" is a
    # NOMINAL role, the word this domain is discussed in — "the SMTP transport",
    # "the in-memory transport" — and the -er form the rule would impose,
    # "Sender", names the verb the port happens to expose today instead of the
    # thing the type IS. It is also the word a provider connector under
    # third-party/ would have to reuse. Same argument as core/net.Policy above.
    # BatchSender's -er form would be "SendBatcher", which is not a word; the
    # type already ends in -er and names its role, exactly as EntryFetcher does
    # below. Outbox is not listed: it has two methods, so the rule does not fire.
    - github.com/kitsunium/sdk/internal/core/mail.Transport
    - github.com/kitsunium/sdk/internal/core/mail.BatchSender
    # ConnHandler / PacketHandler follow the stdlib's own precedent: http.Handler
    # is a single-method interface named <Noun>Handler, and "Handler" names the
    # role the type plays rather than its method. The -er forms the rule would
    # impose here ("ServeConner", "ServePacketter") are not words.
    # BoundedDecompressor is the optional widening of core/transform.Compressor,
    # which it embeds; "Decompressor" names the role exactly as "Compressor"
    # does two lines above it in the same file, and the two read as the pair
    # they are. The -er form the rule would impose is "DecompressBoundedder",
    # which is not a word in any reading. Same argument as core/mail.Transport.
    - github.com/kitsunium/sdk/internal/core/transform.BoundedDecompressor
    - github.com/kitsunium/sdk/internal/core/net.ConnHandler
    - github.com/kitsunium/sdk/internal/core/net.PacketHandler
    # EntryFetcher and Tagger are ADR 0039 siblings of the frozen core/cache.Store
    # port, and the -er forms the rule would impose — "FetchEntrier" and
    # "InvalidateTagger" — are not words. Both name the ROLE a store plays rather
    # than its method: a tier that can hand back its whole entry, and a store that
    # indexes by tag. The family (Store / EntryFetcher / Tagger / Loader) says at a
    # glance which capability a type assertion is asking for, which is the entire
    # ergonomics of a port that grows by siblings. Same argument as UpDownMeter
    # below. Loader is NOT listed: its method is Load, so it satisfies the rule
    # natively — the exemption is only for the two the rule cannot spell.
    - github.com/kitsunium/sdk/internal/core/cache.EntryFetcher
    - github.com/kitsunium/sdk/internal/core/cache.Tagger
    # core/sql.Transactor and core/sql.Preparer (ADR 0055). The -er forms the rule
    # would impose are "Transacter" and "PrepareContexter", neither of which is a
    # word. Both name the ROLE the type plays, which is how the domain is
    # discussed end to end — "the transactor owns the transaction", "assert for
    # Preparer" — and Transactor is additionally the industry's own term for the
    # role (Spring's PlatformTransactionManager, the Go ecosystem's Transactor).
    # Preparer is an ADR 0039 sibling of the frozen Executor port, exactly the
    # EntryFetcher/Tagger case above: the family name says at a glance which
    # capability a type assertion is asking for.
    - github.com/kitsunium/sdk/internal/core/sql.Transactor
    - github.com/kitsunium/sdk/internal/core/sql.Preparer
    # UpDownMeter is the ADR 0039 sibling of the frozen core/observe/metrics.Meter port,
    # and "Meter" is the OpenTelemetry vocabulary for an instrument factory —
    # the word the whole domain is discussed in. The -er form the rule would
    # impose, "UpDownCounterrer", is not a word; and naming the sibling after
    # its method rather than its role would break the Meter / UpDownMeter /
    # AsyncMeter / FullMeter family that says, at a glance, which capabilities a
    # parameter requires. Same argument as ConnHandler above.
    - github.com/kitsunium/sdk/internal/core/observe/metrics.UpDownMeter
    # core/observe/trace.Tracer is OpenTelemetry's own vocabulary for the type that
    # starts spans — the word the entire domain, the specification and every
    # backend are discussed in — exactly as Meter is for the type that mints
    # instruments. The -er form the rule would impose, "Starter", names the
    # METHOD rather than the role, and it collides with the ordinary English
    # meaning of the word in a domain full of things that start. Same argument
    # as UpDownMeter above and ConnHandler further up.
    - github.com/kitsunium/sdk/internal/core/observe/trace.Tracer
    # AtomicWriter is the ADR 0039 capability sibling of the frozen core/vfs
    # WritableFS port, and the -er form the rule would impose —
    # "WriteAtomiccer" — is not a word. The name already ENDS in -er: it names
    # the role a filesystem plays (one that can publish a whole file
    # indivisibly) rather than restating its method, exactly as EntryFetcher
    # and UpDownMeter do above. The family (FS / WritableFS / AtomicWriter /
    # FullFS) is what tells a reader at a glance which capability a type
    # assertion is asking for.
    - github.com/kitsunium/sdk/internal/core/vfs.AtomicWriter
    # DeadLetterReader and LeaseExtender are the ADR 0039 capability siblings of
    # the frozen core/queue.Broker port, and they are the EntryFetcher/Tagger
    # case again. The -er forms the rule would impose are "DeadLetterser",
    # which is not a word, and "Extender", which drops the noun that says WHAT
    # is being extended — a lease, not a deadline, not a batch, not a queue.
    # Both name the ROLE a broker plays rather than its method: one can hand
    # back the messages it gave up on, the other can renew a claim a handler is
    # still working under. The family (Broker / DeadLetterReader /
    # LeaseExtender) is what tells a reader at a glance which capability a type
    # assertion is asking for, which is the whole ergonomics of a port that
    # grows by siblings.
    - github.com/kitsunium/sdk/internal/core/queue.DeadLetterReader
    - github.com/kitsunium/sdk/internal/core/queue.LeaseExtender
    # KeyLister is the ADR 0063 sibling of the frozen core/i18n.Catalog port,
    # and the -er form the rule would impose — "Keyser" — is not a word. The
    # name already ENDS in -er and names the ROLE a catalogue plays: one that
    # can enumerate what it holds, so a consumer's own test can compare a
    # language's key set against the fallback's and fail the build on a missing
    # translation. Same argument as EntryFetcher and AtomicWriter above; the
    # family (Catalog / KeyLister / Fallbacker) is what tells a reader at a
    # glance which capability a type assertion is asking for. Fallbacker is NOT
    # listed: its method is Fallback, so it satisfies the rule natively.
    - github.com/kitsunium/sdk/internal/core/i18n.KeyLister
    # core/cli.Executor (ADR 0065). The -er form the rule would impose,
    # "Executer", is not a word: the English agent noun for something that
    # executes is "executor", which is why the SDK already spells
    # internal/core/sql.Executor that way. The rule does not fire there only
    # because that interface carries three methods; this one is FROZEN at one
    # by ADR 0039, so the same word trips a rule the same word survived
    # elsewhere. Renaming for the rule would give the SDK two spellings of one
    # concept — the exact confusion the naming rule exists to prevent. Same
    # class as Transactor and Tracer above: the name is the domain's own word.
    - github.com/kitsunium/sdk/internal/core/cli.Executor

# ── Global options ────────────────────────────────────────────────────────────

# Full strict mode stays off so test files / testdata keep their ergonomic
# exemptions (mocks, table-driven assertions, etc.).
strict_mode: false

# Phase 8 (`tests`) is opt-in; the default active set is {1..7}.
# Use `phases.enabled` / `phases.disabled` to override (mutually exclusive).
# phases:
#   enabled: [1, 2, 3, 4, 5, 6, 7]

# Respect `// Code generated …` markers so generated files are skipped.
skip_generated: true

# Tags recognised by KTN-STRUCT-JSONTAG. Extend as we ship more codecs so the
# audit keeps recognising legitimate struct-tag annotations.
serialization_tags:
  - json
  - xml
  - yaml
  - toml
  - protobuf
  - msgpack
  - cbor
  - bson
  # framework/kit's request binding (ADR 0147): a field of an endpoint's
  # request is read from the route's wildcard, the query, a header or a cookie
  # by these tags, exactly as encoding/json reads a member by `json`.
  - path
  - query
  - header
  - cookie

# ── Global file exclusions ────────────────────────────────────────────────────
# Skip any path that matches one of the glob patterns below, for every rule.
# Use this list for third-party / generated / non-source trees only.
exclude:
  # Vendored third-party code — never our convention to enforce.
  - "vendor/**"
  #
  # tools/** and e2e/** used to sit here, exempted as "tooling, not library
  # code". Both are now clean at `--phases all` and are gated like everything
  # else: the rules turned out to apply perfectly well to a build script and to
  # a conformance harness, and the exemption was mostly hiding missing tests.
  # Do not re-add them — fix the finding instead.
  # Go module cache occasionally shows up in IDE-driven scans.
  - "**/.cache/**"
  # Protocol Buffers and gRPC generated code.
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  - "**/*_grpc.pb.go"
  # FlatBuffers / Cap'n Proto generated code.
  - "**/*.capnp.go"
  - "**/*_generated.go"
  # Generic `*.gen.go` / `*_gen.go` marker used by stringer, mockgen, etc.
  - "**/*.gen.go"
  - "**/*_gen.go"
  # Mock files produced by mockgen / moq / counterfeiter.
  - "**/mocks/**"
  - "**/*_mock.go"
  - "**/mock_*.go"
  # Stringer output.
  - "**/*_string.go"
  # Jennifer / go-jet / go-swagger generated trees.
  - "**/generated/**"
  - "**/gen/**"
  # WebAssembly / CGO stubs we don't audit.
  - "**/*.wasm.go"
  # Test coverage artifacts and profile output.
  - "**/coverage.out"
  - "**/*.test"
  - "**/*.prof"

# ═══════════════════════════════════════════════════════════════════════════════
# RULE OVERRIDES
# ═══════════════════════════════════════════════════════════════════════════════
# Keep this list small on purpose — every entry here is a design choice we
# committed to, not "this warning is annoying".
#
# Every repository path below is written TWICE — "**/internal/x.go" and
# "internal/x.go" — and neither line is redundant. The releases this file was
# written against applied the "**/" form (the tree linted clean with it
# alone). v1.45.4, the published minimum since, matches an exclude against the
# path RELATIVE TO THIS FILE's directory, where a leading "**/" needs at least
# one segment in front of it: every "**/"-only pattern silently stopped
# matching and 41 excluded findings came back. Measured, not inferred: a
# byte-identical copy of this file outside the repository applies them, this
# one does not, and "third-party/transform/s2.go" written bare does. CI pins an
# older release than a workstation is allowed to run, so both spellings stay
# until the two agree — and a new entry is written in both.
# ═══════════════════════════════════════════════════════════════════════════════

rules:
  # KTN-INTERFACE-ANYUSE (info) — "prefer specific interface".
  #
  # Scoped exception: the codec packages implement a universal Codec
  # interface whose Marshal/Unmarshal signatures REQUIRE `any` (the whole
  # point of a universal codec is that the user's struct type is not known
  # to the codec). The auto-exemptions documented in the rule (type switch,
  # map storage) do not fire on concrete methods that simply delegate to
  # `encoding/json`, `encoding/xml`, etc.
  #
  # Disable ONLY inside the codec tree AND the logger Value union. Every
  # other Go package in the SDK must still avoid `any` except where the
  # Codec contract requires it (codec) or the slog-style discriminated
  # Value union demands it for Time / Group / Any payloads (logger).
  # KTN-VAR-STRMAP (phase 4) — the keys are the INPUT, not an enum.
  #
  # core/sql's dialectByName and refusedDialects are the two halves of
  # ParseDialect: they turn a configuration STRING a human wrote ("postgres",
  # "mariadb", "sqlserver") into a Dialect or into a refusal that says why. An
  # int-keyed map cannot do that — the string is what is being looked up, and
  # there is no integer to key on until after the lookup has succeeded. The
  # rule reads "constant string keys" and infers an enum; here the constants
  # are the accepted VOCABULARY, which is the opposite direction.
  #
  # Scoped to the one file that owns both tables.
  # KTN-STRUCT-COHESION (phase 6) — "this file holds unrelated groups; split it".
  #
  # Scoped to the pkg/v1 facade layer, where the finding describes the design
  # instead of a defect. A facade package is ONE file by convention — cache.go,
  # scheduler.go, lifecycle.go, vfs.go, events.go, clock.go — holding the
  # package doc comment plus every type alias the domain publishes. The
  # declarations are "unrelated" to each other by construction: they are a
  # domain's whole vocabulary re-exported side by side, and pkg/v1/observe/trace.go is
  # reported as 62 unrelated groups precisely because tracing has 62 public
  # names.
  #
  # Splitting them would break a rule this repository enforces mechanically:
  # ADR 0008 / CLAUDE.md rule 10 generate each README.md from the package doc
  # comment, gomarkdoc reads it from the single facade file, and
  # scripts/pre-commit/check-readme-drift.sh fails the build when the result
  # stops matching. The layer below is where cohesion is a real question, and
  # the rule still runs there.
  # The exclusion names the five facade FILES rather than recursing over
  # `pkg/v1/**`: a recursive pattern would also silence packages that are more
  # than aliases — `logger/slogbridge` carries a real `slog.Handler` — and a
  # facade that grows past the threshold later should be flagged and added here
  # deliberately rather than covered in advance.
  KTN-STRUCT-COHESION:
    exclude:
      - "**/pkg/v1/security/authz/authz.go"
      - "pkg/v1/security/authz/authz.go"
      - "**/pkg/v1/i18n/i18n.go"
      - "pkg/v1/i18n/i18n.go"
      - "**/pkg/v1/net/server/server.go"
      - "pkg/v1/net/server/server.go"
      - "**/pkg/v1/net/websocket/websocket.go"
      - "pkg/v1/net/websocket/websocket.go"
      - "**/pkg/v1/observe/trace/trace.go"
      - "pkg/v1/observe/trace/trace.go"

  # KTN-VAR-MINLEN (phase 4) — "a one or two letter name only reads while its
  # declaration is still on screen".
  #
  # The rule is right about abbreviations and wrong about proper nouns. `S2` is
  # not a shortened word: it is the NAME of the compression format, exactly as
  # `Zstd` is, and the registry key it is built from is the string "s2" (ADR
  # 0066). Lengthening it would invent a name no specification, no
  # `Content-Encoding` and no caller uses — and it is an EXPORTED symbol of the
  # third-party/transform module (ADR 0157), documented in its CLAUDE.md, so the
  # rename would be a breaking change to a published surface bought with
  # nothing.
  #
  # Scoped to the one file that declares it; every other package-scope name in
  # the SDK still has to earn its length.
  KTN-VAR-MINLEN:
    exclude:
      - "**/third-party/transform/s2.go"
      - "third-party/transform/s2.go"

  KTN-VAR-STRMAP:
    exclude:
      - "**/internal/core/sql/sql_dialect.go"
      - "internal/core/sql/sql_dialect.go"
      # The i18n domain (ADR 0063) is the same direction as sql_dialect.go, in
      # two places and for two reasons.
      #
      # service/i18n's rulesByTag turns a BCP 47 tag a REQUEST or a FILENAME
      # carried ("pl", "pt-PT", "fr-CA") into that language's CLDR plural rule
      # or into a refusal naming the supported set. The string is what is being
      # looked up; there is no integer to key on until after the lookup has
      # succeeded, and the constants are the accepted VOCABULARY.
      #
      # The catalogue maps are stronger still: `map[string]string` from a CLDR
      # category NAME ("zero", "one", "few", "many") to a pattern is the shape
      # a catalogue FILE has, decoded through the codec domain. The names are
      # Unicode's, not the SDK's enum, and an int-keyed map cannot be decoded
      # from a JSON object.
      - "**/internal/core/i18n/**"
      - "internal/core/i18n/**"
      - "**/internal/service/i18n/**"
      - "internal/service/i18n/**"

  KTN-INTERFACE-ANYUSE:
    exclude:
      # internal/service/sql — `arg any` is database/sql's OWN bind-parameter
      # type. (*sql.Tx).ExecContext, QueryContext and QueryRowContext are all
      # `args ...any` in the standard library, and driver.Value is defined as a
      # closed set the DRIVER narrows, not the caller. The three flagged sites
      # (tryLockSQL / unlockSQL / tryOnce) each carry exactly one advisory-lock
      # key — an int64 on PostgreSQL, a string on MySQL — straight to that
      # stdlib signature. Any interface narrower than `any` would have to be
      # widened again at the call, and inventing one here is the first step of
      # the ORM ADR 0055 D1 refuses to become: once the bind type is ours,
      # conversion is ours.
      - "**/internal/service/sql/**"
      - "internal/service/sql/**"
      - "**/internal/core/codec/**"
      - "internal/core/codec/**"
      - "**/internal/service/codec/**"
      - "internal/service/codec/**"
      # The full yaml.v3 codec (the opt-in "yaml-full" Format) implements the
      # same Codec, Encoder and Decoder contracts as the in-tree codecs and
      # streams documents into a `v any` for the same reason; it lives under
      # third-party/ only because of the library it wraps.
      - "**/third-party/codec/yaml/**"
      - "third-party/codec/yaml/**"
      - "**/pkg/v1/codec/**"
      - "pkg/v1/codec/**"
      # The logger's subtree is listed part by part, in core and in service:
      # since ADR 0155 the writers (logger/writer) and the logfile helper
      # (logger/internal/logfile) sit beneath it, and this exclusion has never
      # covered them — a logger-wide "**" would have widened it in a rename.
      - "**/internal/core/observe/logger/*.go"
      - "internal/core/observe/logger/*.go"
      - "**/internal/core/observe/logger/level/**"
      - "internal/core/observe/logger/level/**"
      - "**/internal/service/observe/logger/*.go"
      - "internal/service/observe/logger/*.go"
      - "**/internal/service/observe/logger/encoder/**"
      - "internal/service/observe/logger/encoder/**"
      - "**/internal/service/observe/logger/middleware/**"
      - "internal/service/observe/logger/middleware/**"
      - "**/internal/service/observe/logger/sink/**"
      - "internal/service/observe/logger/sink/**"
      - "**/pkg/v1/observe/logger/**"
      - "pkg/v1/observe/logger/**"
      # kernel/concur/singleflight carries a recovered PANIC value across a goroutine
      # boundary. recover() is defined by the language to return `any`, and the
      # payload really can be anything a panic() call was given — so `any` is not
      # a missing abstraction here, it is the only type the value HAS. Narrowing
      # it would either drop payloads (the rule's suggestion, an interface with
      # String()) or silently change what a caller recovers, which is exactly
      # what PanicValue.Raised exists to preserve verbatim.
      - "**/internal/kernel/concur/singleflight/**"
      - "internal/kernel/concur/singleflight/**"
      # kernel/concur/group carries a recovered panic out of a TASK goroutine for the
      # identical reason, and the two PanicValue types are deliberately
      # separate so the message a crash prints names the primitive that was
      # running the code which failed. Same rule limitation, same justification.
      - "**/internal/kernel/concur/group/**"
      - "internal/kernel/concur/group/**"
      # The events domain (ADR 0053) is an in-process bus carrying MANY event
      # types on one Bus. Go methods cannot take type parameters, so a
      # `Subscribe[E]` method cannot be written and a `Bus[E]` would carry
      # exactly one event type — a typed channel, not a bus. The port is
      # therefore erased (`Listener func(ctx, any) error`) and the typing is
      # restored by the package-level generic `On[E]`, which asserts on
      # delivery at a measured 2.4 ns (internal/service/events/BENCH.md). The
      # rule's suggestion — a specific interface — would mean every event type
      # in every downstream application had to implement an SDK interface, which
      # is the framework this SDK is not. `any` here is the language's answer,
      # not a missing abstraction, exactly as it is for a recovered panic above.
      - "**/internal/core/events/**"
      - "internal/core/events/**"
      - "**/internal/service/events/**"
      - "internal/service/events/**"
      - "**/pkg/v1/events/**"
      - "pkg/v1/events/**"
      # The view domain renders an arbitrary caller MODEL. core/view.Renderer's
      # Render(ctx, name string, data any) fixes the parameter — the whole point
      # of a template engine is that the user's struct type is not known to it,
      # exactly as for codec's Marshal. The concrete engine and its internal
      # helpers implement that contract, so narrowing the parameter breaks
      # interface satisfaction (ADR 0058 §D3).
      - "**/internal/core/view/**"
      - "internal/core/view/**"
      - "**/internal/service/view/**"
      - "internal/service/view/**"
      - "**/pkg/v1/view/**"
      - "pkg/v1/view/**"
      # service/i18n decodes a catalogue FILE through the codec domain, and a
      # catalogue entry is legitimately one of two shapes — a pattern string or
      # a map of CLDR forms. `map[string]any` is what every codec produces for
      # a nested object and is the only shape both entry forms can land on;
      # entryFrom then type-switches on it, which is the rule's own documented
      # auto-exemption. A typed struct would need per-format tags and still
      # could not hold both shapes in one field. Same argument as codec's
      # Marshal and view's Render above (ADR 0063 §D5).
      - "**/internal/service/i18n/**"
      - "internal/service/i18n/**"
      # service/cli.flagValue extracts a parsed flag's value for the
      # configuration layer FlagSource yields (ADR 0065 §D6). Its return type is
      # fixed at BOTH ends and by neither of this domain's choices:
      # flag.Getter.Get() is declared `Get() any` in the standard library, and
      # core/config.Source.Load returns map[string]any. The whole function is
      # the bridge between those two `any`s. A "specific interface" here could
      # only be one every int, bool, string, time.Duration and caller-defined
      # flag.Value already satisfies — which is `any` with extra steps — and it
      # would have to be widened again one line later to enter the map. Same
      # class as the recovered-panic entries above: `any` is the type the value
      # HAS, not a missing abstraction.
      - "**/internal/service/cli/**"
      - "internal/service/cli/**"

  # KTN-API-MINIF (info) — "prefer the narrowest interface for this parameter".
  #
  # TEMPORARY false-positive exception — kodflow/ktn-linter#385. The rule is not
  # interface-aware: it flags an AEAD scheme's `Seal/Open` `key crypto.Key`
  # parameter and suggests `interface{ Bytes() []byte }`, but those methods
  # IMPLEMENT the core/crypto.AEAD contract, whose signatures fix the parameter
  # to the concrete redacting `Key`. Narrowing the param breaks interface
  # satisfaction (compile error), so the suggestion is unactionable. This is the
  # same class of contract-required-type FP that #366 fixed for snapshot.Value.
  #
  # Every entry below is the SAME false positive: a parameter whose type is fixed
  # by a contract the function implements, so narrowing it breaks interface
  # satisfaction. The AEAD Key is the original case; tlsid.Identity, the net
  # engines and the slog bridge's slog.Value are the others, each justified at
  # its own entry. RETIRE the whole block once #385 ships interface-awareness
  # (mirror the 2026-05-28 retirement below) — one condition covers them all,
  # because one rule limitation causes them all.
  KTN-API-MINIF:
    exclude:
      # internal/service/cli and internal/core/cli — this is the sql entry's
      # argument, and here it is the domain's DEFINING decision rather than an
      # incidental one. ADR 0065 §D1: a cli.Binder receives the standard
      # library's own *flag.FlagSet, unwrapped, exactly as core/vfs takes
      # io/fs unchanged (ADR 0056). The rule suggests replacing it with
      # `interface{ VisitAll(func(*flag.Flag)) }` and `interface{ Int(string,
      # int, string) *int }` — two synthetic types that mention flag.Flag in
      # their own signatures, that no caller's existing flag.Value could reach,
      # and that would have to grow a method every time somebody used a
      # different FooVar helper. The concrete type is the whole point: it is
      # what lets every stdlib flag helper and every flag.Value a consumer
      # already owns work here with no adapter.
      #
      # help.go's writeUsage takes a corecli.CommandValue for the second
      # reason the sql entry gives: it is the domain's published declaration
      # value (pkg/v1/cli.Command aliases it), the help renderer reads its
      # Name, Summary, Description AND Commands, and the suggested
      # `interface{ IsGroup() bool }` would keep exactly one of the four.
      - "**/internal/core/cli/**"
      - "internal/core/cli/**"
      - "**/internal/service/cli/**"
      - "internal/service/cli/**"
      # internal/service/sql — the SAME class, and here it is the domain's
      # central decision rather than an incidental one. ADR 0055 D1: the sql
      # ports speak *sql.DB, *sql.Conn, *sql.Rows and sql.Result — the standard
      # library's own types, deliberately NOT re-declared equivalents — because
      # re-declaring them is the first step of the ORM this domain exists to
      # refuse. Once Rows is ours, scanning is ours; once scanning is ours,
      # mapping is one refactor away. The rule's suggestions here ("interface
      # dB with SetConnMaxIdleTime", "interface rows with Scan") would replace
      # the stdlib type a consumer already knows with a synthetic one that
      # exists only to satisfy a linter.
      #
      # internal/core/i18n and internal/service/i18n — the same #385 limitation
      # on a domain built out of VALUES. TagValue, CountValue and MessageValue
      # are comparable domain values published through pkg/v1/i18n, and the
      # rule's suggestions ("interface tagValue with IsZero() bool", "interface
      # countValue with IntegerPart() uint64") would replace a map key with an
      # interface — TagValue is used as a map key in three places, which an
      # interface cannot be safely, and CountValue is the parameter of the
      # frozen core/i18n.PluralRule func port, so narrowing it breaks every
      # rule's signature at once.
      - "**/internal/core/i18n/**"
      - "internal/core/i18n/**"
      - "**/internal/service/i18n/**"
      - "internal/service/i18n/**"
      # sql.TxOptionsValue is the same contract-required-value case as
      # tlsid.Identity below: it is core/sql's single per-transaction option
      # type, published as pkg/v1/sql.TxOptions and frozen by ADR 0039.
      # Narrowing it to `interface{ IsZero() bool }` would hide that the
      # isolation level and the read-only flag travel with it.
      - "**/internal/service/sql/**"
      - "internal/service/sql/**"
      # core/sql.Dialect is the same VALUE case since it spells its engine's
      # vocabulary itself — Placeholder, QuoteIdent, ForUpdate and
      # ForUpdateSkipLocked. The SQL renderers of docstore and queue take the
      # dialect their store or broker was configured with, and the rule now
      # suggests `interface{ Placeholder(int) string }` or
      # `interface{ QuoteIdent(string) string }` for them. Dialect is a CLOSED
      # set, refused at construction when unset or unknown (ADR 0055 §D4,
      # ADR 0031): an interface over its vocabulary would let any type pretend
      # to be an engine — the one thing the type exists to make impossible —
      # and the same renderers compare it against the three constants. Scoped
      # to the two renderers.
      - "**/internal/service/docstore/sql_dialect.go"
      - "internal/service/docstore/sql_dialect.go"
      - "**/internal/service/queue/sql_dialect.go"
      - "internal/service/queue/sql_dialect.go"
      # The view engine's helpers take *html/template.Template, and here the
      # suggestion is not merely unactionable but actively dangerous: the rule
      # proposes `interface{ Execute(wr io.Writer, data any) error }`, which
      # text/template.Template satisfies exactly. That substitution compiles,
      # passes every test that does not assert on escaped output, and ships
      # stored XSS — it is the one thing ADR 0058 §D2 and the domain's AST audit
      # exist to make impossible. The concrete type IS the guarantee.
      - "**/internal/service/view/**"
      - "internal/service/view/**"
      # The tlsid handshake test takes two Identity values and uses BOTH halves
      # of the type (ServerConfig on one, ClientConfig on the other). Narrowing
      # each parameter to a one-method interface would replace the single domain
      # type with two synthetic ones and obscure that both are the same thing.
      - "**/pkg/v1/net/tlsid/**"
      - "pkg/v1/net/tlsid/**"
      # Same false positive again, on the authz evaluators. Check, evaluateRBAC
      # and lookupAttr all take `request coreauthz.RequestValue`, and that type
      # is fixed by the FUNC ports they implement — coreauthz.Policy is
      # `func(context.Context, RequestValue) (Decision, error)` and
      # coreauthz.Condition is `func(RequestValue) (bool, error)`. Narrowing the
      # parameter to the suggested one-method interface makes the function stop
      # satisfying the port, which is a compile error, so the suggestion is
      # unactionable. The suggestion is also wrong on the merits here: a policy
      # that took `interface{ Action() string }` could no longer read the
      # attributes, which is the half of the request ABAC exists for.
      - "**/internal/service/security/authz/**"
      - "internal/service/security/authz/**"
      # New takes a tlsid.Identity, the domain's single TLS value type. Narrowing
      # it to a one-method interface would hide that the client and the server
      # consume the very same identity, which is the point of sharing it.
      - "**/internal/service/net/client/**"
      - "internal/service/net/client/**"
      # The server engine takes a tlsid.Identity for the same reason the client
      # does: it is the domain's single TLS value type, and narrowing it to a
      # one-method interface would hide that both ends share it.
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"
      # Stream.Send takes a core/net.SSEEventValue, the domain's event-stream
      # frame. The suggested `interface{ AppendTo([]byte) ([]byte, error) }`
      # would let any caller append arbitrary bytes to an open stream, which is
      # precisely what the value type exists to prevent: it validates that no
      # single-line field carries a terminator before a byte reaches the wire.
      # Narrowing the parameter would move that guarantee from the type system
      # to a convention.
      - "**/internal/service/net/sse/**"
      - "internal/service/net/sse/**"
      # The slog bridge converts a stdlib slog.Value, whose type is fixed by the
      # slog.Handler contract it implements — the same contract-required-type
      # class as the AEAD Key below. The suggested `interface{ Any() any }` is
      # actively wrong here: the function's whole job is to switch on Kind() and
      # preserve the payload's type across the bridge, so narrowing to Any()
      # would erase exactly what the package exists to keep (ADR 0032).
      - "**/pkg/v1/observe/logger/slogbridge/**"
      - "pkg/v1/observe/logger/slogbridge/**"
      # The vfs domain is the same contract-required class, and its two cases
      # are the clearest examples in this file of a suggestion that does not
      # compile. ValidatePerm takes an fs.FileMode and the rule suggests
      # `interface{ String() string }` — but the function's entire body is
      # `perm == 0 || perm&^fs.ModePerm != 0`, two operations no interface has;
      # the parameter is a BIT SET, and the suggested interface is every type in
      # Go that can print itself. syncDirHandle takes the *os.File that
      # os.Root.Open returned, and it means one specific thing: fsync(2) on a
      # DIRECTORY descriptor. Narrowing it to `interface{ Sync() error }` would
      # advertise that any Syncer will do, which is false — and the testing seam
      # the suggestion is reaching for already exists one level up, as the
      # injectable atomicOps.syncDir that publish() drives.
      - "**/internal/core/vfs/**"
      - "internal/core/vfs/**"
      - "**/internal/service/vfs/**"
      - "internal/service/vfs/**"

      - "**/internal/service/crypto/**"
      - "internal/service/crypto/**"
      - "**/third-party/x-crypto/**"
      - "third-party/x-crypto/**"
      # The token domain is the same class, three times over. Its parameters
      # are core/security/token.ClaimsValue (the redacting claim set), jwk.KeyValue,
      # core/crypto.Key and core/security/token.Algorithm — every one of them fixed by a
      # contract the function implements or by the value type the domain is
      # ABOUT. The suggestion for Algorithm is the clearest tell: a uint8 enum
      # would become `interface{ String() string }`, which is every type in Go
      # that can print itself, and the comparison it feeds exists precisely to
      # be against a closed set (ADR 0042 §Algorithm confusion).
      - "**/internal/core/security/token/**"
      - "internal/core/security/token/**"
      - "**/internal/service/security/token/**"
      - "internal/service/security/token/**"
      - "**/pkg/v1/security/token/**"
      - "pkg/v1/security/token/**"
      # The session stores' lookup helpers take a core/security/session.ID and the rule
      # suggests `interface{ Digest() string }`. That is the contract-required
      # class in its most dangerous form: ID is an OPAQUE BEARER SECRET whose
      # whole value is that no other type can stand in for it. The suggested
      # interface would be satisfied by any type carrying a Digest method — a
      # caller's own string wrapper included — which is exactly the substitution
      # the opaque type exists to make impossible; and it would discard Equal
      # (the crypto/subtle comparison every lookup path ends in) and IsZero (the
      # guard that keeps an unnamed session off the filesystem). Same reasoning
      # as the AEAD Key above: the parameter's type IS the security boundary
      # (ADR 0045 §D3).
      - "**/internal/core/security/session/**"
      - "internal/core/security/session/**"
      - "**/internal/service/security/session/**"
      - "internal/service/security/session/**"
      - "**/pkg/v1/security/session/**"
      - "pkg/v1/security/session/**"
      # The trace domain is the same class as the token one above. The OTLP
      # encoder's helpers take core/observe/trace.StatusValue, SpanValue, LinkValue and
      # SpanContextValue — the domain's own immutable value types, each fixed by
      # the OTLP payload it renders. The suggestion for StatusValue is the
      # clearest tell: `interface{ Resolved() trace.StatusValue }` mentions the
      # very type it proposes to remove, so it cannot be written at all.
      - "**/internal/core/observe/trace/**"
      - "internal/core/observe/trace/**"
      - "**/internal/service/observe/trace/**"
      - "internal/service/observe/trace/**"
      - "**/pkg/v1/observe/trace/**"
      - "pkg/v1/observe/trace/**"
      # The health domain is the token/Algorithm case above, four times over —
      # and here the suggestion does not even compile. shortCircuit and unknown
      # take a core/health.Probe and STORE it in ReportValue.Probe, a field
      # typed Probe; statusCode and notifyState take a core/health.Status, and
      # notifyState assigns it to health.lastNotified, a field typed Status.
      # Replacing either parameter with the proposed one-method interface
      # (`interface{ String() string }` / `interface{ Serving() bool }`) means
      # the value can no longer reach the field it exists to reach without a
      # type assertion back to the type that was just removed.
      #
      # Both are closed enums whose ZERO VALUE is load-bearing: Status's zero is
      # Unhealthy so that a forgotten assignment reads as "not serving", and
      # Probe's zero is deliberately unclaimed so that an unset probe is refused
      # rather than answered. An interface parameter trades both for a nil no
      # caller can be stopped from passing.
      - "**/internal/service/health/handler.go"
      - "internal/service/health/handler.go"
      - "**/internal/service/health/notify.go"
      - "internal/service/health/notify.go"
      - "**/internal/service/health/probe.go"
      - "internal/service/health/probe.go"
      # The health suite's probeUnderClock takes the SDK's own
      # *clock.ManualClock and uses BOTH halves of it: BlockUntil to prove the
      # budget timer exists BEFORE the clock is moved, then Advance to move it.
      # The rule's suggested interface carries only Advance, so adopting it
      # would drop the very call that makes every timeout assertion in this
      # suite deterministic instead of a race between the test and the engine.
      # Same both-halves-of-the-type case as the pkg/v1/net/tlsid handshake test
      # above.
      - "**/internal/service/health/harness_external_test.go"
      - "internal/service/health/harness_external_test.go"
      # The entitlement verifier's two single-method roster readers —
      # VerifyCI (ci.go) and matchSubject (service.go). Same class as the
      # session ID above, in the same dangerous form: the parameter is the
      # VENDOR-SIGNED ROSTER, and it is the only document in the domain
      # carrying the vendor's signature. The suggested `interface{
      # CIEntitlementFor(...) }` and `interface{ SubjectFor(...) }` would be
      # satisfied by any type with that method — including one supplied by the
      # party being checked, which is precisely the substitution a signed
      # document exists to make impossible. The rule reaches only these two of
      # the six functions taking *coreent.RosterValue, and only because they
      # happen to read ONE method; ciSeat, authorise, ciRefusalIsFinal and
      # rememberRoster cross the same boundary and are not flagged.
      - "**/framework/internal/service/entitlement/ci.go"
      - "framework/internal/service/entitlement/ci.go"
      - "**/framework/internal/service/entitlement/service.go"
      - "framework/internal/service/entitlement/service.go"
      # The enrolment writer, GenerateKeyPair (framework/connectors/ssh). It
      # reads one method off the product, and the suggested `interface{
      # Label() string }` would silently DELETE a documented contract: every
      # ProductValue method tolerates a nil receiver, so GenerateKeyPair(nil,
      # dir, subject) works today and returns the "entitlement" fallback,
      # whereas the same call through an interface panics on a nil interface
      # value before any method runs. That contract has its own regression
      # test (TestGenerateKeyPairOnANilProduct) because a review found the
      # panic; narrowing the type would reintroduce it under a different
      # spelling. The sibling call in the same flow, IssueURL, keeps the same
      # parameter and is not flagged only because it reads a FIELD.
      - "**/framework/connectors/ssh/enroll.go"
      - "framework/connectors/ssh/enroll.go"

  # KTN-VAR-NILSLICE (info) — "prefer a nil slice to an empty one".
  #
  # Inverted-semantics exception: os.StartProcess inherits the PARENT environment
  # exactly when os.ProcAttr.Env is nil. The proc port guarantees Spec.Env is
  # "explicit, never inherited", so a nil Spec.Env MUST be mapped to a non-nil
  # zero-length slice before reaching StartProcess — a nil slice would leak the
  # supervisor's environment (secrets included) into the child. Here the
  # lint-preferred nil is the security bug, so the non-nil empty slice is
  # deliberate. Scoped to the spawn implementation ONLY.
  # KTN-VAR-SLICECAP / KTN-VAR-MAKEAPPEND / KTN-VAR-SYNCPOOL (phase 4) —
  # the datagram read path allocates by LENGTH on purpose.
  #
  # newSlots and multiReader.wire build fixed-size arrays that are then INDEXED
  # in lockstep — never appended to. The length is the batch size, and the
  # buffers are wired into the kernel's mmsghdr array once and reused for the
  # life of the socket, which is exactly what makes a batched read allocate
  # nothing. Rebuilding them with make([]T, 0, n)+append would break the
  # lockstep the kernel relies on; routing them through a sync.Pool would hand
  # the kernel a buffer that another goroutine may reclaim mid-read.
  KTN-VAR-SLICECAP:
    exclude:
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"
  KTN-VAR-MAKEAPPEND:
    exclude:
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"
  KTN-VAR-SYNCPOOL:
    exclude:
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"

  # KTN-GOROUTINE-RWOVERMU — following this rule here would REOPEN a defect that
  # was measured, fixed and mutation-tested. fileStore.withLock guards a
  # read-modify-write cycle whose write happens inside the fn it calls, so the
  # rule's heuristic sees no field assignment in the method body and concludes
  # the access is read-only. It is not: Load slides the idle window and
  # therefore writes. An RLock would admit concurrent holders into exactly the
  # cycle the mutex exists to serialise — which is the bug
  # TestWithLockExcludesGoroutines pins, and which the rule would restore.
  KTN-GOROUTINE-RWOVERMU:
    exclude:
      - "**/internal/service/security/session/**"
      - "internal/service/security/session/**"
      #
      # service/observe/trace/recorder.go — the rule's advice here is CORRECT about the
      # code and WRONG about the workload, and the difference was measured
      # rather than argued. Recorder.Len and Recorder.Dropped really are
      # read-only, so the heuristic fires accurately; what it cannot see is that
      # they run ONCE PER COLLECTION INTERVAL while Recorder.record takes the
      # exclusive side once per span from every request goroutine — and that
      # Collect, the call an export actually makes, takes the exclusive side
      # too, so the shared side was serving nothing else.
      #
      # This field DID hold a sync.RWMutex, on exactly the reasoning the rule
      # states. internal/service/observe/trace/BENCH.md §2 prices it: 1.27x-1.65x slower
      # on record with no reader at all, and 2.7x-9.0x slower in the mixed shape
      # the RWMutex's own field comment named — spans arriving while an operator
      # polls Len — because a writer's Lock must drain the in-flight reader and
      # pays a park/unpark round trip on every acquisition. Every figure is a
      # median of fifteen samples across five processes, and reproduces with the
      # two locks' roles swapped.
      #
      # What following the rule would cost is stated rather than hidden: with
      # FOUR OR MORE goroutines doing nothing but polling Len, the RWMutex is
      # 1.20x-1.23x faster. That scenario is one this type's contract excludes —
      # Collect DRAINS, so a Recorder has exactly one reader — and at that one
      # reader the Mutex is marginally faster anyway.
      #
      # TestRecorderTakesAnExclusiveLockOnEveryPath pins the choice through
      # reflect, so this exclusion cannot quietly become permission to drift
      # back. Scoped to the one file that holds the lock.
      - "**/internal/service/observe/trace/recorder.go"
      - "internal/service/observe/trace/recorder.go"

  # KTN-GOROUTINE-DOUBLECLOSE (error) — the guard the rule asks for would
  # SILENCE the defect it exists to catch.
  #
  # service/health.perform closes inflight.done, and exactly one goroutine per
  # inflight ever reaches that line: entry.claim publishes the run and returns
  # `mine` to a single caller under the entry's own lock, and perform is called
  # only for that caller. A second inflight is a different channel. The rule
  # sees `close(<field>)` and cannot see the claim protocol one file over — the
  # same blind spot the session RWOVERMU entry above records, in the other
  # direction.
  #
  # A sync.Once here would not make the code safer. It would make a BROKEN
  # claim protocol silent: "two goroutines were handed the same run" would stop
  # being an immediate panic naming the line and become a second measurement
  # quietly dropped, with every waiter served the first one. The panic IS the
  # detector for that invariant; TestConcurrentProbesShareOneMeasurement and
  # TestAWedgedCheckCostsOneGoroutineNotOnePerPoll pin the invariant itself.
  # Scoped to the one file that closes it.
  KTN-GOROUTINE-DOUBLECLOSE:
    exclude:
      - "**/internal/service/health/runner.go"
      - "internal/service/health/runner.go"

  # KTN-STRUCT-FLAGS (info) — the suggested bitfield would create a data race
  # in one case and delete a test's own vocabulary in the other.
  #
  # service/health.entry carries nonCritical, latching and passed, and they are
  # NOT three flags of one kind. nonCritical and latching are written once at
  # registration and read afterwards WITHOUT the entry's mutex — entry.verdict
  # runs on the measuring goroutine, outside every critical section, which is
  # what keeps the lock off the path a check body blocks on. passed is written
  # under that mutex by entry.finish. Packing them into one integer would make
  # setting passed a read-modify-write of the whole word, racing the lock-free
  # reads of nonCritical: a genuine, race-detector-visible data race introduced
  # by adopting a readability suggestion.
  #
  # The second entry is a table-driven test whose case struct carries
  # nonCritical, alsoFail and wantServing. A mask would replace three named
  # columns with a number, which is precisely the readability a table test
  # exists for — and wantServing cannot be folded into want, because deriving
  # it would assert Status.Serving() against itself instead of pinning that
  # Degraded serves.
  KTN-STRUCT-FLAGS:
    exclude:
      - "**/internal/service/health/entry.go"
      - "internal/service/health/entry.go"
      - "**/internal/service/health/probe_external_test.go"
      - "internal/service/health/probe_external_test.go"

  # KTN-ERROR-DISCARD (error) — the one seam where "log or propagate" is not
  # available at all.
  #
  # service/health's ServeHTTP ends in `_, _ = w.Write(body)`. It cannot
  # PROPAGATE: http.Handler.ServeHTTP returns nothing, and the status line and
  # Content-Length are already on the wire by the time Write can fail. It
  # cannot LOG: ADR 0030 forbids the SDK writing to stdout, this domain extends
  # that to stderr, and the handler deliberately holds a core/health.Health and
  # not the Config that carries the caller's hooks — a route must not be able
  # to reach the registry's internals. The only failure Write can report here
  # is a client that hung up mid-response, which is the client's news and not
  # the server's; net/http discards the body of a HEAD on this same path for
  # the same reason. Writing `_, _ =` says that out loud instead of leaving a
  # bare call for a reader to wonder about. Scoped to the one file.
  KTN-ERROR-DISCARD:
    exclude:
      - "**/internal/service/health/handler.go"
      - "internal/service/health/handler.go"
      # service/cli's writeHelp ends in `_, _ = e.errOut.Write(...)`, and it is
      # the health/handler.go case with one extra reason.
      #
      # It cannot PROPAGATE usefully: writeHelp is called from the two paths
      # that are ALREADY returning a verdict — UNKNOWN_COMMAND and
      # INVALID_FLAGS — and from the -h path, which returns nil because asking
      # for help is not a failure (ADR 0065 §D4). Replacing "that sub-command
      # does not exist" with "the diagnostic stream is broken" would report the
      # less actionable of the two facts and change the exit status the caller
      # routes on. It cannot LOG: ADR 0030 forbids the SDK writing to stdout,
      # this domain writes only to the two writers its Config was given, and
      # the one that just failed IS the diagnostic writer.
      #
      # The only failure a Write can report here is a caller-supplied io.Writer
      # that broke, which is the caller's news about the caller's own object.
      # Writing `_, _ =` says that out loud instead of leaving a bare call for
      # a reader to wonder about. Scoped to the one file.
      - "**/internal/service/cli/help.go"
      - "internal/service/cli/help.go"

  # KTN-FUNC-EMPTYSENTINEL (phase 5) — "" is a domain value here, not a sentinel.
  #
  # zoneOf returns the IPv6 zone, where "" is the correct net.UDPAddr.Zone for a
  # datagram with no scope — the overwhelming majority. batchDegradation returns
  # the reason a listener fell back, where "" means "it did not". Pairing either
  # with a bool would force every caller to discard it.
  KTN-FUNC-EMPTYSENTINEL:
    exclude:
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"

  # KTN-STRUCT-CTOR (phase 4) — Effective Go's own naming rule wins.
  #
  # The rule wants a struct named Client to be built by NewClient(). This package
  # produces one main type, and Go's convention for that case is a constructor
  # called New, used qualified as client.New(). Renaming it to client.NewClient()
  # would stutter, which the same linter's own naming rules discourage elsewhere.
  KTN-STRUCT-CTOR:
    exclude:
      # kernel/plugin.Registry's zero value IS the empty registry, ready to
      # use, as sync.Mutex's is an unlocked mutex: every registry is a
      # package-level `var registry plugin.Registry[...]`, initialised before
      # the first RegisterX at import. A NewRegistry() could only return that
      # same zero value behind a pointer — a second way in that adds a heap
      # allocation and nothing else.
      - "**/internal/kernel/plugin/registry.go"
      - "internal/kernel/plugin/registry.go"
      # service/mail/spool.Spool is the one main type of package spool, so
      # Go's convention names its constructor New — spool.New, as server.New
      # below. NewSpool would stutter at every call site (spool.NewSpool),
      # which the same linter's naming rules discourage elsewhere (ADR 0111).
      - "**/internal/service/mail/spool/spool.go"
      - "internal/service/mail/spool/spool.go"
      # service/docstore.Store is built by Open, as os.Open and sql.Open build
      # theirs: the constructor LOADS — the snapshot read, the overlay
      # replayed, the indexes rebuilt — and "open" is what that is called. A
      # NewStore beside it would be a second way in, one that either loads too
      # or builds a store over files it never read (ADR 0110).
      - "**/internal/service/docstore/docstore.go"
      - "internal/service/docstore/docstore.go"
      # service/docstore.SQLStore is built by OpenSQL, the same engine family's
      # constructor under the same verb as Store's Open. A NewSQLStore beside it
      # would be a second way in that skips the configuration's refusals — a
      # transactor that cannot join, a table name that is not safe to
      # interpolate — which OpenSQL decides before the store exists (ADR 0139).
      - "**/internal/service/docstore/sql_store.go"
      - "internal/service/docstore/sql_store.go"
      # service/proc/childwait.Claim is MINTED by Spawn, under the ledger's
      # spawning gate, and by nothing else (ADR 0093): the gate is what keeps a
      # sweep from taking the child for an orphan between the fork and the
      # claim. A NewClaim would be a second way in that builds a claim no
      # ledger holds — one no sweep could ever fill, so its owner would report
      # a clean exit as lost. Spawn is the constructor; the rule cannot see it
      # because it also forks.
      - "**/internal/service/proc/childwait/childwait.go"
      - "internal/service/proc/childwait/childwait.go"
      # The cli domain hits the same broken suggestion the jwk / metrics /
      # singleflight entries below record — "constructor NewNewInvocationValue()"
      # and "NewNewFlagSourceValue()", neither of which is a name anything could
      # satisfy — and it hits it for the two opposite reasons already on file.
      #
      # core/cli.InvocationValue is MINTED BY THE ENGINE and by nothing else:
      # every field is filled by service/cli.dispatch from a resolution that has
      # already happened, so a from-parts constructor would be a second way in
      # that produces an invocation no command line ever produced. It stays an
      # exported struct because an Action receives one and a test double
      # legitimately writes one — the adapter is written to tolerate exactly
      # that (a nil FlagSet is skipped rather than dereferenced).
      #
      # service/cli.FlagSourceValue DOES have a constructor: FlagSource. The
      # rule wants it spelled NewFlagSourceValue, which would stutter at the
      # call site the domain is designed around — `cli.FlagSource(invocation)`
      # as the last argument of a config.Load — and would read as a second
      # constructor beside the one pkg/v1/cli publishes under its own name.
      - "**/internal/core/cli/**"
      - "internal/core/cli/**"
      - "**/internal/service/cli/**"
      - "internal/service/cli/**"
      - "**/internal/service/net/client/**"
      - "internal/service/net/client/**"
      # Same rule, same reason: these packages each produce one main type, and
      # Go's convention for that case is a constructor called New, used
      # qualified as server.New(). NewServer()/NewStreamGroup() would stutter,
      # and StreamGroup is not constructed directly at all — Server.Group mints
      # it, so a public constructor would be a second, worse way in.
      - "**/internal/service/net/server/**"
      - "internal/service/net/server/**"
      # Same again for the event-stream package: sse.New(w, r) is the Go
      # convention for a package producing one main type, and the rule's own
      # message here reads "constructor NewNewStream()", which is not a name
      # anything could satisfy — the same broken suggestion the jwk entry below
      # records.
      - "**/internal/service/net/sse/**"
      - "internal/service/net/sse/**"
      # crypto/key/jwk.KeyValue has no from-parts constructor ON PURPOSE. Every
      # KeyValue comes out of Parse or a From* bridge, and each of those
      # validates the material — coordinates at the curve's fixed length, the
      # point actually on the curve, "d" actually deriving the declared "x"/"y".
      # A NewKeyValue(kty, crv, x, y, d) would be a second way in that skips all
      # of it, i.e. exactly the "poorly initialized struct" the rule exists to
      # prevent. (The rule's own message here reads "constructor
      # NewNewKeyValue()", which is not a name anything could satisfy.)
      - "**/internal/service/crypto/key/jwk/**"
      - "internal/service/crypto/key/jwk/**"
      # core/observe/otel.AttrValue is built by FOUR kind-specific constructors —
      # String / Bool / Int64 / Float64 — and by nothing else: the value payload
      # is unexported precisely so a struct literal cannot produce an attribute
      # whose kind and payload disagree. A NewAttrValue(key, kind, num, str)
      # would be exactly the "poorly initialized struct" the rule exists to
      # prevent, reachable in one call. (The rule's own message here reads
      # "constructor NewNewAttrValue()", which is not a name anything could
      # satisfy — the same broken suggestion the jwk entry above records.) It
      # was declared in core/observe/metrics until the shared OTel model moved to
      # core/observe/otel (ADR 0051 §Decision 2); the exclusion moved with the type.
      - "**/internal/core/observe/otel/**"
      - "internal/core/observe/otel/**"
      # The i18n values (ADR 0063) are the jwk and metrics case again: every
      # one comes out of a constructor that VALIDATES, and each is named for
      # what it does rather than for the type it returns. TagValue comes from
      # ParseTag, which refuses everything outside the BCP 47 subset BY NAME;
      # CountValue comes from Int or Decimal, which are the two ways CLDR's
      # operands can be derived and which say at the call site which one the
      # caller means; MessageValue comes from NewMessage or NewPluralMessage,
      # which parse the placeholders once so no render ever parses. A
      # NewTagValue / NewCountValue / NewMessageValue would each be a second
      # way in that skips the validation — exactly the "poorly initialized
      # struct" the rule exists to prevent. (Same broken "NewNewTagValue()"
      # suggestion the entries above record.)
      #
      # service/i18n.PluralValue is stronger still: a caller never constructs
      # one. Its only instances are the thirteen entries of the hand-written
      # CLDR rule table, and a public constructor would let a consumer mint a
      # language whose declared categories and whose rule disagree — which is
      # the one inconsistency the load-time completeness check assumes away,
      # and which TestEveryRuleOnlyEverReturnsACategoryItDeclares pins for the
      # entries that do exist.
      - "**/internal/core/i18n/**"
      - "internal/core/i18n/**"
      - "**/internal/service/i18n/**"
      - "internal/service/i18n/**"
      # kernel/concur/singleflight.Group has NO constructor on purpose: its zero value
      # is usable, exactly as sync.Mutex, sync.WaitGroup and sync.Map are, and
      # the map it lazily builds is the only state it owns. A NewGroup() would
      # be a second way in that adds nothing and makes `var g Group[K,V]` look
      # wrong when it is the intended spelling. (The rule's own message here
      # reads "constructor NewNewGroup()", which is not a name anything could
      # satisfy — the same broken suggestion the jwk and metrics entries record.)
      - "**/internal/kernel/concur/singleflight/**"
      - "internal/kernel/concur/singleflight/**"
      # The two primitives added alongside it hit the SAME broken suggestion:
      # kernel/concur/group.Group and kernel/collections/heap.Heap DO have constructors, named
      # New, because each package produces one main type and Go's convention
      # for that case is group.New() / heap.New(). NewGroup() and NewHeap()
      # would stutter, which the same linter's naming rules discourage
      # elsewhere — the net/client entry above records the very same trade.
      # (The rule's own messages here read "constructor NewNewGroup()" and
      # "NewNewHeap()", neither of which is a name anything could satisfy.)
      - "**/internal/kernel/concur/group/**"
      - "internal/kernel/concur/group/**"
      - "**/internal/kernel/collections/heap/**"
      - "internal/kernel/collections/heap/**"
      # core/observe/trace.StateValue is the parsed W3C `tracestate` list, and it has no
      # from-parts constructor ON PURPOSE: every instance comes out of
      # ParseTraceState or Insert, each of which validates the key against
      # `simple-key`/`multi-tenant-key` and the value against `value = 0*255(chr)
      # nblk-chr` before an entry reaches the list. A NewStateValue(entries)
      # would be a second way in that skips all of it and produces a header the
      # next hop is required to discard — exactly the "poorly initialized
      # struct" the rule exists to prevent. (The rule's own message here reads
      # "constructor NewNewStateValue()", which is not a name anything could
      # satisfy — the same broken suggestion the jwk and metrics entries record.)
      - "**/internal/core/observe/trace/**"
      - "internal/core/observe/trace/**"
      # core/security/authz.AttrValue has FOUR constructors on purpose — AttrString,
      # AttrInt64, AttrBool and AttrStrings — one per kind, each taking only
      # the payload its kind can hold. That is what makes the kind part of the
      # attribute's identity instead of a field somebody can forget to set, and
      # it is why the zero AttrValue is KindInvalid and gets DROPPED by
      # NewRequestValue rather than stored as a fact nothing can read. The
      # single NewAttrValue(key, kind, text, number, flag, list) the rule asks
      # for would take all four payloads plus a kind and let any combination of
      # them through — precisely the "poorly initialized struct" the rule
      # exists to prevent, same shape as the jwk.KeyValue entry above. (The
      # message here likewise reads "constructor NewNewAttrValue()".)
      - "**/internal/core/security/authz/**"
      - "internal/core/security/authz/**"
      # service/codec/toml.LocalDateTime is a VALUE of exported fields — a
      # LocalDate and a LocalTime, embedded — written as a composite literal,
      # exactly as the LocalDate and LocalTime it is made of (which the rule
      # does not flag), as time.Date's components are, and as the
      # github.com/pelletier/go-toml/v2 type it replaces was: that library had
      # no constructor either, and a type switch moving from one to the other
      # must change its import and nothing else. NewLocalDateTime(date, clock)
      # would be a second spelling of the literal with nothing to validate:
      # the decoder fills it from a date and a time it has already checked.
      - "**/internal/service/codec/toml/localtime.go"
      - "internal/service/codec/toml/localtime.go"

  # KTN-GOROUTINE-SYNCMAP / KTN-GOROUTINE-ATOMICVAL (phase 4) — the suggested
  # replacements cannot express what this map is for.
  #
  # kernel/concur/singleflight.Group holds `map[K]*call[V]` under an RWMutex, and the
  # RWMutex exists for exactly one read-only method (InFlight); every other path
  # mutates. Neither suggestion works here:
  #   - sync.Map is for read-heavy, insert-once maps. Join must, ATOMICALLY,
  #     look the key up, increment a refcount, insert on absence and spawn the
  #     goroutine — a read-modify-write across two objects that sync.Map's
  #     LoadOrStore cannot serialise. Racing it would either duplicate the very
  #     execution the package exists to deduplicate, or cancel a call whose
  #     refcount was read stale.
  #   - atomic.Value replaces a field a writer REPLACES wholesale. This map is
  #     mutated in place under the same lock that guards the refcounts, and
  #     copy-on-write per call would make every Do allocate the whole map.
  # The rules fire on the SHAPE (RWMutex + one map field), which this genuinely
  # is; they cannot see that the workload is write-heavy by construction.
  KTN-GOROUTINE-SYNCMAP:
    exclude:
      - "**/internal/kernel/concur/singleflight/**"
      - "internal/kernel/concur/singleflight/**"
      # service/vfs.memFS is the same shape and the same answer. Its RWMutex
      # guards `map[string]*memNode`, and the map is a FILESYSTEM TREE: MkdirAll
      # inserts a whole chain of parents, RemoveAll deletes a node and every
      # descendant, and WriteFile must observe "is there a non-directory in the
      # way" and insert under one lock. Those are multi-key transactions, and
      # sync.Map has no way to serialise them — a concurrent RemoveAll and
      # MkdirAll racing through LoadOrStore would leave a child whose parent no
      # longer exists, which is a tree state the type exists to make
      # unreachable. The workload is write-heavy by construction too: the
      # RWMutex earns its keep on the read side, and the read side is the half
      # sync.Map would not be helping.
      - "**/internal/service/vfs/**"
      - "internal/service/vfs/**"
  KTN-GOROUTINE-ATOMICVAL:
    exclude:
      - "**/internal/kernel/concur/singleflight/**"
      - "internal/kernel/concur/singleflight/**"
      # Same struct, same reason, plus one of its own: atomic.Value replaces a
      # field a writer swaps WHOLESALE, and memFS mutates its map in place under
      # the lock that also orders the compound operations above. Copy-on-write
      # would make every WriteFile clone the entire tree.
      - "**/internal/service/vfs/**"
      - "internal/service/vfs/**"

  # KTN-STRUCT-ROLE-STUTTER (phase 4) — the package name IS the signal's name.
  #
  # `trace.Tracer` and `trace.TracerConfig` read as stutters because the package
  # is named after the SIGNAL (a trace) and the type after the thing that
  # produces it (a Tracer) — which is OpenTelemetry's own vocabulary, the word
  # every backend, dashboard and specification section uses, and the exact pair
  # `metrics.Meter` / `metrics.MeterConfig` would be if the metrics package were
  # named `metric`. Renaming either would cost the reader the word the whole
  # domain is discussed in to save two characters at a call site; renaming the
  # PACKAGE to `tracing` would break the symmetry with `logger` and `metrics`
  # and would still stutter against `tracing.Tracer`. Scoped to the service
  # implementation, which is the only place a concrete struct carries the name.
  KTN-STRUCT-ROLE-STUTTER:
    exclude:
      - "**/internal/service/observe/trace/**"
      - "internal/service/observe/trace/**"

  # KTN-STRUCT-ROLE (info) — "every exported struct declares its role by a
  # suffix". The suffixes the rule accepts (Value, State, Config, Spec, Event)
  # each name something service/proc/childwait.Claim is not. It is not a Value:
  # it has IDENTITY — the ledger compares claims by pointer to decide whether a
  # recycled pid's newer claim replaced this one — so two equal Claims are not
  # interchangeable. It is not a State or a Config either. "Claim" is the word
  # ADR 0093 decides in ("the spawner claims its child before any sweep can
  # take it"), and a compatibility alias to satisfy the rule is itself a
  # finding (KTN-STRUCT-ROLE-COMPATALIAS). Scoped to the one file.
  KTN-STRUCT-ROLE:
    exclude:
      - "**/internal/service/proc/childwait/childwait.go"
      - "internal/service/proc/childwait/childwait.go"
      # service/docstore.Store is the word the SDK's storage ports already use
      # — core/security/session.Store, core/cache.Store, core/security/secret.Store — and the
      # rule only spares them because they are interfaces. The concrete
      # document store is the same role under the same name; the suffix the
      # rule infers ("Service") would read docstore.StoreService and name the
      # one engine differently from every port it sits beside (ADR 0110).
      - "**/internal/service/docstore/docstore.go"
      - "internal/service/docstore/docstore.go"
      # service/docstore.SQLStore is the same role over a database: the store,
      # named as its sibling engine is, prefixed by what it keeps its documents
      # in. "SQLStoreService" would name the second engine differently from the
      # first, and from every storage port beside them (ADR 0139).
      - "**/internal/service/docstore/sql_store.go"
      - "internal/service/docstore/sql_store.go"
      # kernel/plugin.Registry is the word every registrar in the SDK is
      # discussed in — "the exporter registry", "the codec registry",
      # RegisterExporter — and the table those registrars now share. None of
      # the accepted suffixes names it: it is not a Value (it has identity:
      # each registrar's package-level table is THE table), nor a State, a
      # Config, a Spec or an Event, and "RegistryState" would name the one
      # generic table differently from every registry built on it.
      - "**/internal/kernel/plugin/registry.go"
      - "internal/kernel/plugin/registry.go"
      # service/codec/bson's value types — Binary, Regex, DBPointer,
      # CodeWithScope, Timestamp, E, MinKey, MaxKey, Undefined, Null — are the
      # names of the BSON types they stand for (bsonspec.org), and the names
      # every MongoDB-shaped document is spoken in: a caller type-switches on
      # bson.Binary exactly as it did on the driver's primitive.Binary, and on
      # bson.Binary in the driver's own v2. A suffix ("BinaryValue",
      # "TimestampValue") would rename the vocabulary to satisfy a rule, and a
      # compatibility alias to dodge it is itself a finding
      # (KTN-STRUCT-ROLE-COMPATALIAS). Scoped to the one file.
      - "**/internal/service/codec/bson/types.go"
      - "internal/service/codec/bson/types.go"
      # service/codec/toml's LocalDate, LocalTime and LocalDateTime are the
      # names of the three TOML kinds they hold — TOML v1.0.0 §Local Date,
      # §Local Time, §Local Date-Time — and the names the
      # github.com/pelletier/go-toml/v2 types they replace had, so that code
      # type-switching on a decoded map[string]any moves from one to the
      # other by changing its import alone. The suffix the rule infers
      # ("Service") would name a value a service, and "LocalDateValue" would
      # break that one-line migration for every consumer.
      - "**/internal/service/codec/toml/localtime.go"
      - "internal/service/codec/toml/localtime.go"

  # KTN-GOROUTINE-LOCKSCOPE (warning) — "move unrelated statements outside the
  # critical section". In service/proc/childwait's spawn, the statement the
  # rule calls unrelated is the FORK, and it is the reason the section exists
  # (ADR 0093): the spawning gate is held shared from before the fork until the
  # child is claimed, so a sweep that collects a pid nobody claims waits out
  # every spawn that may have forked that pid without claiming it yet. Moving
  # the fork out reopens exactly the window the package was written to close —
  # a clean exit reported as WAIT_FAILED. Scoped to the one file.
  KTN-GOROUTINE-LOCKSCOPE:
    exclude:
      - "**/internal/service/proc/childwait/childwait.go"
      - "internal/service/proc/childwait/childwait.go"

  KTN-VAR-NILSLICE:
    exclude:
      - "**/internal/service/proc/exec/**"
      - "internal/service/proc/exec/**"

  # KTN-VAR-BIGSTRUCT (phase 4, warning) — contract-required value type.
  #
  # The pkg/v1/proc/process facade's exported entry point is, by ADR 0016 design,
  # `func Start(ctx, spec Spec)` where Spec is a TYPE ALIAS of the core port's
  # immutable coreproc.Spec (176 bytes). The public surface is deliberately an
  # alias of the port value type — pointers would (a) diverge the public API
  # from the port, (b) let a caller mutate the spec after Start, defeating the
  # "immutable spawn specification" guarantee. The single by-value copy happens
  # once per spawn, immediately before a fork/exec that dwarfs it, so the
  # performance concern the rule guards is moot here. This is the same
  # contract-required-type class as the retired snapshot.Value / AEAD Key cases.
  # Scoped to the process facade ONLY; the service layer consumes Spec by value
  # too but is not flagged (it is not a pure forwarder).
  KTN-VAR-BIGSTRUCT:
    exclude:
      # core/cli.CommandValue is 88 bytes — Name + Summary + Description (16
      # each) + Flags + Run (8 each) + Commands (24) — and none of the six is
      # removable: they are the whole declaration. Value semantics are the
      # contract, exactly as for pkg/v1/proc/process.Spec below: a command tree is
      # written as a nested composite LITERAL at a call site, so
      # `cli.New(cfg, cli.Command{…})` is the spelling the domain is designed
      # around, and taking *Command would force every child in every
      # []cli.Command to be addressable — turning a declaration into a variable
      # graph. It would also let a caller mutate a tree AFTER New validated it,
      # defeating the whole-tree validation that is ADR 0065 §D5's point.
      #
      # The copy happens once per command per PROCESS, during a construction
      # measured at 52 µs for a 27-command tree — 2.6 % of the 1.99 ms it takes
      # to start a Go binary that does nothing (internal/service/cli/BENCH.md).
      # The performance concern the rule guards is not merely moot here, it is
      # below the noise floor of process startup.
      #
      # pkg/v1/cli is included because its three functions are pure forwarders
      # of the same alias; excluding only the core layer would leave findings on
      # bodies whose entire content is `return svccli.New(cfg, root)`.
      - "**/internal/core/cli/**"
      - "internal/core/cli/**"
      - "**/pkg/v1/cli/**"
      - "pkg/v1/cli/**"
      - "**/pkg/v1/proc/process/**"
      - "pkg/v1/proc/process/**"
      # service/sql.Config is 72 bytes — eight over the threshold — and the
      # eight are not removable: *sql.DB (8) + Dialect (1, padded to 8) +
      # PoolConfig (32) + clock.Timed (16) + CheckTimeout (8). Every field is
      # 8-aligned, so there is no padding hole for the Dialect byte and no
      # field ordering that lands under 64. Shrinking would mean deleting a
      # field or boxing PoolConfig behind a pointer, which trades eight bytes
      # once per PORT for a nil check on every read.
      #
      # Value semantics are the contract, exactly as for pkg/v1/proc/process.Spec
      # above: a constructor must not be able to observe a later mutation of
      # the caller's struct, and taking *Config would let a caller change the
      # dialect or the pool ceiling after NewTransactor returned. The copy
      # happens ONCE per port — three times in the life of a process, next to
      # a BeginTx that costs a network round trip — so the performance concern
      # the rule guards is not merely moot here, it is unmeasurable
      # (internal/service/sql/BENCH.md).
      #
      # pkg/v1/sql is included because its constructors are pure forwarders of
      # the same alias; excluding only the service layer would leave three
      # findings on functions whose entire body is `return svcsql.New…(cfg)`.
      - "**/internal/service/sql/**"
      - "internal/service/sql/**"
      - "**/pkg/v1/sql/**"
      - "pkg/v1/sql/**"
      # service/security/secret.RotatorConfig is 96 bytes — Store and Clock and Locker
      # (16 each, interfaces), Name (16), PolicySpec (24: Every, Keep and the
      # generator func) and OnRotate (8) — and every field is a collaborator a
      # rotator needs or an option a caller must be able to omit. Value
      # semantics are the contract, as for sql.Config above: NewRotator
      # validates the struct it was given, and taking *RotatorConfig would let a
      # caller change the policy after validation passed. The copy happens once
      # per rotator — one or two in the life of a process, next to a store read
      # that costs a system call — so the performance concern the rule guards is
      # not measurable here.
      #
      # pkg/v1/security/secret is included because NewRotator there is a pure forwarder
      # of the same alias; its whole body is `return svcsecret.NewRotator(cfg)`.
      - "**/internal/service/security/secret/**"
      - "internal/service/security/secret/**"
      - "**/pkg/v1/security/secret/**"
      - "pkg/v1/security/secret/**"
      # service/docstore.Config is 80 bytes and SQLConfig 88 since ADR 0143
      # gave both Versions (8), Clock (16, an interface) and Held (8): the key
      # function (8), the filesystem (16) and the path (16), or the transactor
      # (16), IndexKey (8), the table (16) and the dialect (8), were already 48
      # and 56. Every field is a collaborator or an option a caller must be able
      # to omit. Value semantics are the contract, as for sql.Config above: Open
      # and OpenSQL validate the struct they were given — a negative Versions, a
      # Held without Versions — and taking a pointer would let a caller change
      # Versions or the key function after validation passed. The copy happens
      # once per store, next to a load that reads every file or a transactor
      # that opened a pool, so the performance concern the rule guards is not
      # measurable here.
      #
      # pkg/v1/docstore is included because Open and OpenSQL there are pure
      # forwarders of the same aliases.
      - "**/internal/service/docstore/**"
      - "internal/service/docstore/**"
      - "**/pkg/v1/docstore/**"
      - "pkg/v1/docstore/**"
      # service/queue.FileConfig is 72 bytes and SQLConfig 96 since ADR 0151
      # gave core/queue.PolicyValue MaxRetryDelay (8), taking it to 40: the
      # clock (16, an interface) and the directory (16), or the transactor and
      # the clock (16 each), the table (16) and the dialect (8), were already
      # 32 and 56 beside it. Every field is a collaborator or a policy knob a
      # caller must be able to omit. Value semantics are the contract, as for
      # sql.Config above: NewFile and NewSQL validate the struct they were
      # given — a policy, a directory, a table — and taking a pointer would let
      # a caller change the policy or the table after validation passed. The
      # copy happens once per broker, next to a directory check or a
      # transactor that opened a pool, so the performance concern the rule
      # guards is not measurable here.
      #
      # pkg/v1/queue is included because NewFile and NewSQL there are pure
      # forwarders of the same aliases.
      - "**/internal/service/queue/**"
      - "internal/service/queue/**"
      - "**/pkg/v1/queue/**"
      - "pkg/v1/queue/**"
      # core/net — value semantics ARE the contract, for three types:
      #
      #   IdentityValue (96 B) is the opaque, redacting TLS identity. It copies
      #   the crypto.Key / writer.CredentialValue precedent, where the value
      #   receiver is what makes String()/GoString() redaction unavoidable. A
      #   pointer receiver would (a) add a nil case to every method, (b) let a
      #   caller mutate an identity AFTER it was validated at construction,
      #   defeating the guarantee the type exists to provide.
      #
      #   IdentityParams (152 B) is copied exactly once per identity, at
      #   startup, immediately before certificate parsing that dwarfs it.
      #
      #   RequestValue (80 B) is handed to a Policy that judges it. Passing a
      #   pointer would let a policy mutate the very request it is authorising —
      #   a real bug found in a consumer's hand-rolled version, which took a
      #   *url.URL. Immutability here is a security property, not a style.
      - "**/internal/core/net/**"
      - "internal/core/net/**"
      # The tlsid loader and facade forward the same value types unchanged; a
      # pointer here would diverge the public API from the port it aliases,
      # exactly as ADR 0016 avoids for process.Spec above.
      - "**/internal/service/net/tlsid/**"
      - "internal/service/net/tlsid/**"
      - "**/pkg/v1/net/tlsid/**"
      - "pkg/v1/net/tlsid/**"
      # The outbound client forwards the same value types. Config (72 B) is
      # taken and returned BY VALUE by withDefaults precisely so filling the
      # defaults cannot mutate the Config its caller still holds, and New copies
      # it exactly once per client, at construction.
      - "**/internal/service/net/client/**"
      - "internal/service/net/client/**"
      - "**/pkg/v1/net/client/**"
      - "pkg/v1/net/client/**"
      # The mail domain — value semantics ARE the contract (ADR 0064).
      # MessageValue is 264 B because a mail HAS eleven fields: four address
      # lists, two bodies, an attachment slice, a header slice, a subject, a
      # date and a message id. There is no field ordering that lands under 64
      # and nothing to box that would not add a nil check to every guard.
      #
      # The port takes it by value on purpose. Transport.Send(ctx, msg) must not
      # be able to observe a caller mutating the message after the call — a
      # transport that composed a *different* subject from the one the caller
      # validated is the exact class of defect this domain exists to prevent —
      # and AttachmentValue (72 B) is copied for the same reason one level down.
      # The single copy happens once per SEND, immediately before a MIME
      # composition measured at 12 microseconds and a network round trip
      # measured in milliseconds (internal/service/mail/BENCH.md), so the
      # performance concern the rule guards is unmeasurable here.
      #
      # pkg/v1/mail is included because its Compose/Validate helpers are pure
      # forwarders of the same alias; excluding only core would leave findings
      # on functions whose entire body is `return coremail.Validate(msg)`.
      - "**/internal/core/mail/**"
      - "internal/core/mail/**"
      - "**/internal/service/mail/**"
      - "internal/service/mail/**"
      - "**/pkg/v1/mail/**"
      - "pkg/v1/mail/**"
      # The trace domain — value semantics ARE the contract, for four types
      # (ADR 0051). SpanValue (296 B) is a FINISHED span handed to a SpanSink,
      # and SpansValue (80 B) is a batch handed to a SpanExporter: both are
      # published, immutable, and may be delivered to more than one consumer.
      # A pointer would let one sink mutate the span another is about to read —
      # the same immutability-is-a-security-property argument core/net makes for
      # RequestValue, one signal up. LinkValue (88 B) carries a whole
      # SpanContextValue on purpose, so that a link's own sampled bit and
      # tracestate travel with it; SpanParams is the caller's literal at a Start
      # call site, copied once per span immediately before work that dwarfs it.
      # The exporter port's Export(SpansValue) mirrors core/observe/metrics.Exporter's
      # Export(SnapshotValue) exactly, and diverging the two signals' ports
      # would be a worse cost than one copy per export.
      - "**/internal/core/observe/trace/**"
      - "internal/core/observe/trace/**"
      - "**/internal/service/observe/trace/**"
      - "internal/service/observe/trace/**"
      - "**/pkg/v1/observe/trace/**"
      - "pkg/v1/observe/trace/**"
      # StateValue (96 B) is returned by value so a caller can hold, log or
      # compare a snapshot without racing the server that produced it. A
      # pointer would hand out a view that mutates underneath the reader.
      - "**/pkg/v1/net/server/**"
      - "pkg/v1/net/server/**"
      # authz.AttrValue (80 B) — all nine findings in the authz tree are this
      # one type; RequestValue is 56 B and is not flagged. Three reasons, and
      # the third is measured rather than argued.
      #
      #   1. Contract. An AttrValue is a fact a Policy JUDGES. A pointer would
      #      let a policy mutate the attribute it is authorising against — the
      #      same argument core/net.RequestValue is excluded under, one layer
      #      down. Immutability here is a security property, not a style.
      #
      #   2. Mechanics. The attributes live in a map[string]AttrValue, and Go
      #      map values are NOT ADDRESSABLE: r.attrs[k].Contains(x) does not
      #      compile with a pointer receiver. A pointer receiver would force a
      #      copy into a local at every call site — the exact copy the rule is
      #      trying to remove, plus a name. Making the map hold *AttrValue
      #      instead trades one hot-path copy for one heap allocation PER
      #      ATTRIBUTE on the per-request construction path, which is already
      #      the allocating half of the domain.
      #
      #   3. Measurement. The obvious shrink was tried and does not pay.
      #      Folding the bool into the int64 payload and reordering takes the
      #      struct to 72 B — still over the 64 B threshold, so it would not
      #      silence the rule either way — and it is a TRADE rather than a win:
      #      7-15 % SLOWER on every allocation-free evaluation benchmark (the
      #      only tight ones: CheckAllow 210 -> 225, ABACAllow 117 -> 135),
      #      ~9 % faster and 128 B smaller on construction, and within noise
      #      end to end. 80 is five whole 16-byte moves and 72 is not, so the
      #      memmove out of the map gets slower despite copying less. Reverted;
      #      the numbers, the spreads and a first measurement that was WRONG
      #      are in internal/service/security/authz/BENCH.md §"The 80-byte AttrValue was
      #      measured, and the first answer was wrong".
      #
      # Getting under 64 B would mean deleting the `key` member, which is what
      # lets the caller write one flat NewRequest(subj, act, res, attrs...)
      # list instead of building a map at the call site. Not worth it: the
      # evaluation path allocates ZERO as it stands.
      - "**/internal/core/security/authz/**"
      - "internal/core/security/authz/**"
      # The pkg/v1 facade forwards the same value types unchanged; a pointer
      # here would diverge the public API from the port it aliases, exactly as
      # ADR 0016 avoids for process.Spec above.
      - "**/pkg/v1/security/authz/**"
      - "pkg/v1/security/authz/**"
      # crypto/key/jwk.KeyValue (176 B) — the value receiver is the security
      # mechanism, not a style choice, and it is the SAME precedent as
      # core/net.IdentityValue and core/crypto.Key above.
      #
      # MarshalJSON MUST be on a value receiver: it is what makes plain
      # json.Marshal (and a struct field, and a []KeyValue) render the PUBLIC
      # JWK. Move the method set to pointers and a non-pointer KeyValue silently
      # stops going through it — the safe default the package exists to provide
      # would be reachable only by callers who already knew to take an address.
      # The same argument covers String/GoString: redaction that only fires on a
      # pointer is redaction that does not fire. And immutability is the second
      # half — a *KeyValue would let a holder mutate a key AFTER its coordinates
      # were validated against the curve.
      #
      # The type is 176 B because a JWK genuinely carries three strings of
      # metadata plus three octet slices; shrinking it under the 64 B threshold
      # would mean dropping members the format defines.
      - "**/internal/service/crypto/key/jwk/**"
      - "internal/service/crypto/key/jwk/**"
      # The token domain, for the same two reasons as jwk and core/net above.
      #
      # ClaimsValue (152 B) is immutable by construction: the With* setters
      # copy, the accessors clone out, and String/GoString redact. All three
      # properties need a VALUE receiver — redaction that only fires on a
      # pointer is redaction that does not fire, and a *ClaimsValue would let a
      # holder mutate a claim set after a verifier had judged it. 152 B is what
      # seven registered claims honestly cost (four strings, three time.Time, a
      # slice and a map); nothing can be dropped to get under 64.
      #
      # IssuerConfig / VerifierConfig / Paseto*Config (80-160 B) are copied
      # exactly once, at construction, immediately before key parsing and
      # policy validation that dwarf the copy — and by value so that filling in
      # the defaults cannot mutate the config the caller still holds. Same
      # argument as net/client.Config above.
      - "**/internal/core/security/token/**"
      - "internal/core/security/token/**"
      - "**/internal/service/security/token/**"
      - "internal/service/security/token/**"
      - "**/pkg/v1/security/token/**"
      - "pkg/v1/security/token/**"
      # The session domain, for the same two reasons as token and jwk above.
      #
      # SessionValue (144 B) is immutable by construction: Set/Delete copy,
      # Data clones out, and String/GoString render the SHAPE and never the
      # subject, the identifier or the payload. All three properties need a
      # VALUE receiver — redaction that only fires on a pointer is redaction
      # that does not fire, and a *SessionValue would let a holder mutate a
      # session after a store had validated it, which is precisely the mutation
      # the fixation guard exists to refuse (ADR 0045 §D2). 144 B is what an
      # identifier, a subject, three instants and a payload honestly cost;
      # nothing can be dropped to get under 64.
      #
      # StateValue (144 B) is the exported description a third-party Store
      # builds a SessionValue from — a pointer would let the store mutate the
      # description its caller still holds.
      #
      # The service layer's internal `record` (112 B) and `window` (32 B + the
      # record params it takes) are pure functions over a value: slide, rotate,
      # deadline and build take a record and return a modified COPY, which is
      # what makes "a store never mutates a record another goroutine holds"
      # true by construction rather than by discipline. The copy happens a few
      # times per request, immediately beside an AEAD seal and an fsync that
      # dwarf it — the same argument ADR 0016's process.Spec makes above.
      #
      # Config / FileConfig (72-144 B) are copied exactly once, at
      # construction, and by value so that filling in the defaults cannot
      # mutate the config the caller still holds. Same argument as
      # net/client.Config above; taking a pointer here would also diverge from
      # every other SDK constructor (`logger.NewText(Config)`,
      # `scheduler.New(Config)`).
      - "**/internal/core/security/session/**"
      - "internal/core/security/session/**"
      - "**/internal/service/security/session/**"
      - "internal/service/security/session/**"
      - "**/pkg/v1/security/session/**"
      - "pkg/v1/security/session/**"
      # The metrics domain, for the two reasons already established above.
      # SnapshotValue (128 B) is the payload an Exporter receives, and
      # `Exporter.Export(snap SnapshotValue) error` is a PUBLISHED port —
      # pkg/v1/observe/metrics.Exporter is a type alias to it, so changing the parameter
      # to a pointer breaks every downstream implementer at compile time with no
      # deprecation window (ADR 0039). By value is also the safer half: the
      # Attrs slices inside a snapshot ALIAS the meter's own copies, so handing
      # an exporter a pointer would invite it to rewrite the identity of series
      # the meter is still serving. It grew past 64 B when it took on the OTel
      # payload hierarchy — Resource, Scope and the collection window, each
      # carried once per payload rather than once per point, which is the whole
      # reason those concepts exist. The copy happens once per export,
      # immediately before formatting work that dwarfs it.
      # MeterConfig (88 B) is taken and returned BY VALUE by resolve precisely
      # so filling in the defaults cannot mutate the config its caller still
      # holds, and newMemMeter copies it exactly once, at construction. Same
      # argument as net/client.Config above.
      - "**/internal/core/observe/metrics/**"
      - "internal/core/observe/metrics/**"
      - "**/internal/service/observe/metrics/**"
      - "internal/service/observe/metrics/**"
      - "**/pkg/v1/observe/metrics/**"
      - "pkg/v1/observe/metrics/**"
      # core/health.ResultValue (72 B) is one check's ANSWER, and value
      # semantics are the contract for the same two reasons core/net and
      # core/security/session give above. It is PUBLISHED — pkg/v1/health.Result is a
      # type alias to it — it is handed to Config.OnReport, which is a caller's
      # own hook, and it is carried in ReportValue.Results, which the handler
      # renders while that hook still holds it. Age is a pure accessor on that
      # answer; a pointer receiver would make the SDK's one immutable
      # measurement type the only core value in the tree with a mutable method
      # set, in a domain whose entire discipline is that a recorded verdict is
      # not edited after the fact.
      #
      # 72 B is what a name, a verdict, three flags, an instant, a duration and
      # an error honestly cost; nothing can be dropped to get under 64. The one
      # copy per rendered check happens immediately beside the json.Marshal
      # that dwarfs it.
      - "**/internal/core/health/**"
      - "internal/core/health/**"
      # TEMPORARY — kodflow/ktn-linter#694: BIGSTRUCT fires on aliases of external
      # types in framework/internal/kit (false positive).
      # Temporaire, à retirer quand l'issue est corrigée. Scoped to the
      # framework module only.
      - "framework/**"
      - "**/framework/**"

  # KTN-RECEIVER-MIXPTR / KTN-VAR-RECVCONS / KTN-STRUCT-RECVTYPE (phase 4)
  # — encoding/json forces the asymmetry on core/net.DurationValue, and on
  # core/security/secret.Value (ADR 0096).
  #
  # MarshalJSON MUST take a value receiver, or a non-pointer struct field of
  # this type will not marshal through it. UnmarshalJSON MUST take a pointer
  # receiver, or it cannot assign. There is no receiver set that satisfies both
  # the rule and encoding/json; the standard library's time.Time carries exactly
  # the same asymmetry for exactly the same reason.
  #
  # For secret.Value the value receivers are not merely required, they are the
  # security property: every rendering method — String, GoString, Format,
  # MarshalJSON, MarshalText — must be in the method set of the VALUE, or a
  # Value held in a non-addressable place (a map entry, a struct returned by
  # value) would be printed by reflection instead of redacted. UnmarshalJSON and
  # UnmarshalText are the only two that assign. Scoped to the two packages.
  #
  # service/codec/toml's LocalDate, LocalTime and LocalDateTime are the same
  # case under encoding.TextMarshaler: String, MarshalText and AsTime must be
  # VALUE methods, or a local value held in a map[string]any — where every
  # decode into an untyped target puts it — would not render through them;
  # UnmarshalText assigns and must take a pointer. time.Time, which they sit
  # beside, has exactly this method set. Scoped to the one file.
  #
  # framework/internal/kit's sealedDoc (seal_store.go) is the same case as
  # the two above: the SDK's document store encodes a sealing store's records
  # BY VALUE — json.Marshal(v) in internal/service/docstore/write.go:123 —, so its
  # MarshalJSON — the record as it rests — must be a value method, while its
  # UnmarshalJSON keeps what it reads and must take a pointer. Scoped to the
  # one file.
  KTN-RECEIVER-MIXPTR:
    exclude:
      - "**/internal/core/net/**"
      - "internal/core/net/**"
      - "**/internal/core/security/secret/**"
      - "internal/core/security/secret/**"
      - "**/internal/service/codec/toml/localtime.go"
      - "internal/service/codec/toml/localtime.go"
  #
  # service/codec/bson's DateTime, ObjectID and Decimal128 are the same case:
  # their MarshalJSON / MarshalText — and their String, Hex, IsZero, which a
  # value held in a map entry or an interface must answer — take a value
  # receiver, and UnmarshalJSON / UnmarshalText, which assign, a pointer one,
  # exactly as on the driver types they replace and on time.Time. Scoped to
  # the three files.
  KTN-VAR-RECVCONS:
    exclude:
      - "**/internal/core/net/**"
      - "internal/core/net/**"
      - "**/internal/core/security/secret/**"
      - "internal/core/security/secret/**"
      - "**/internal/service/codec/toml/localtime.go"
      - "internal/service/codec/toml/localtime.go"
      - "**/framework/internal/kit/seal_store.go"
      - "framework/internal/kit/seal_store.go"
      - "**/internal/service/codec/bson/types.go"
      - "internal/service/codec/bson/types.go"
      - "**/internal/service/codec/bson/objectid.go"
      - "internal/service/codec/bson/objectid.go"
      - "**/internal/service/codec/bson/decimal.go"
      - "internal/service/codec/bson/decimal.go"
  KTN-STRUCT-RECVTYPE:
    exclude:
      - "**/internal/core/net/**"
      - "internal/core/net/**"
      - "**/internal/core/security/secret/**"
      - "internal/core/security/secret/**"
      - "**/internal/service/codec/bson/types.go"
      - "internal/service/codec/bson/types.go"
      - "**/internal/service/codec/bson/objectid.go"
      - "internal/service/codec/bson/objectid.go"
      - "**/internal/service/codec/bson/decimal.go"
      - "internal/service/codec/bson/decimal.go"
      - "**/internal/service/codec/toml/localtime.go"
      - "internal/service/codec/toml/localtime.go"

  # KTN-TEST-PARALLEL (phase 8) — genuine false positive, fix pending upstream.
  #
  # console_external_test.go redirects the process-global os.Stdout / os.Stderr
  # FD via a helper: captureStream(t, &os.Stdout, fn) performs `*target = wr`.
  # These two tests (TestConsoleOpen_Write / TestConsoleOpen_WriteStderr) MUST
  # stay serial — t.Parallel() would race concurrent FD swaps across sibling
  # capture tests. The #379 "safe serial mutator" detection only recognises a
  # DIRECT `os.Stdout = x` selector write in the test body; it does not see the
  # global mutated through `&os.Stdout` passed to a helper, so it wrongly
  # requires t.Parallel(). Filed kodflow/ktn-linter#388 proposing the heuristic
  # be extended to exempt a test that lets `&<package-scope var>` escape into a
  # call. RETIRE this block once #388 ships (mirror the 2026-05-28 retirements).
  KTN-TEST-PARALLEL:
    exclude:
      - "**/internal/service/observe/logger/writer/console/console_external_test.go"
      - "internal/service/observe/logger/writer/console/console_external_test.go"

  # KTN-FUNC-DEADCODE / KTN-CONST-UNUSED (error) — build-tag blind spot.
  #
  # TEMPORARY false-positive exception. The linter analyses ONE build
  # configuration: the host's. On a non-Linux host every *_linux.go is excluded
  # by its build constraint, so a helper that lives in an untagged file and is
  # called only from the Linux backend looks uncalled and the rules fire. Each
  # of the four below is called exactly once, from a *_linux.go:
  #
  #   • applyOptions          (proc/cgroup/option.go)  ← cgroup_linux.go
  #   • wrapCgroupUnavailable (proc/exec/wrap.go)      ← cgroup_placement_linux.go
  #   • parsePayload          (proc/systemd/notify/…)  ← listen_linux.go
  #   • exitNoPerm            (proc/systemd/notify/…)  ← listen_linux.go
  #
  # Without this block `make lint` cannot pass on macOS at all, on a pristine
  # tree, so the repo is only developable from Linux. Moving
  # the helpers under //go:build linux would silence the rules but is the wrong
  # shape: parsePayload is pure string parsing with a portable test, and a
  # tagged copy would drop that coverage everywhere but Linux.
  #
  # Scoped to the three platform-split proc files ONLY — real dead code anywhere
  # else in the SDK still fails the gate. RETIRE this block once the rules
  # resolve references across every build configuration rather than the host's
  # alone (mirror the 2026-05-28 retirements).
  KTN-FUNC-DEADCODE:
    exclude:
      - "**/internal/service/proc/cgroup/option.go"
      - "internal/service/proc/cgroup/option.go"
      - "**/internal/service/proc/exec/wrap.go"
      - "internal/service/proc/exec/wrap.go"
      - "**/internal/service/proc/systemd/notify/sdnotify.go"
      - "internal/service/proc/systemd/notify/sdnotify.go"
      # TEMPORARY — kodflow/ktn-linter#691: DEADCODE fires on methods of generic
      # receivers and on promoted methods (false positive).
      # Temporaire, à retirer quand l'issue est corrigée. Scoped to the
      # framework module only.
      - "framework/**"
      - "**/framework/**"

  KTN-CONST-UNUSED:
    exclude:
      - "**/internal/service/proc/systemd/notify/sdnotify.go"
      - "internal/service/proc/systemd/notify/sdnotify.go"

  # KTN-FUNC-BLANKPARAM (info) — same build-tag blind spot, other direction.
  #
  # cgroup_other.go is the degrade stub for platforms with no control-group
  # facility, so createGroup(_ string, _ ...Option) discards both parameters by
  # design: there is nothing to create and nothing to configure. The rule's own
  # message ("not required by any interface") is the giveaway — the signature is
  # fixed by the //go:build seam that pairs it with cgroup_linux.go, which the
  # rule cannot see from a non-Linux host. Naming the parameters would only
  # trade this for an unused-parameter complaint.
  #
  # Scoped to that one stub. RETIRE alongside the block above.
  #
  # The second entry is the same class on a different seam. service/cache's
  # memory store implements core/cache.Store, whose methods take a context
  # because a REMOTE tier can block. This one cannot: every operation is an
  # in-process map access under a mutex, so there is no point at which a
  # cancellation could be honoured, and a ctx.Err() check would be a branch that
  # can only ever pass. Writing `_` says that IN THE SIGNATURE; naming the
  # parameter and ignoring it would say nothing at all. The rule's own message
  # is again the giveaway — the implementing type is unexported and NewMemory
  # returns the port, so the only satisfaction evidence is the `var _ Store[…] =
  # (*memoryStore[…])(nil)` block in cache_compliance.go, which the rule does
  # not read.
  # The third entry is the same class on a FUNC port rather than an interface.
  # AlwaysSample, NeverSample and discardSpan have their signatures fixed by
  # core/observe/trace.Sampler and core/observe/trace.SpanSink, both of which are func types
  # (ADR 0041) precisely so a published port cannot grow a method at all. The
  # rule looks for an INTERFACE that requires the parameter and finds none,
  # because there is no interface to find — the signature is no less required
  # for it. AlwaysSample and NeverSample genuinely do not read their input;
  # that is what makes them the two NAMED endpoints of the sampling policy, and
  # naming the parameter would suggest the answer depends on it.
  KTN-FUNC-BLANKPARAM:
    exclude:
      - "**/internal/service/proc/cgroup/cgroup_other.go"
      - "internal/service/proc/cgroup/cgroup_other.go"
      - "**/internal/service/cache/**"
      - "internal/service/cache/**"
      - "**/internal/service/observe/trace/**"
      - "internal/service/observe/trace/**"
      # savepointSQL(_ coresql.Dialect, name string) discards its dialect BY
      # DESIGN, and the discard is the documentation. All three supported
      # engines spell SAVEPOINT / ROLLBACK TO SAVEPOINT / RELEASE SAVEPOINT
      # identically, and that uniformity is the SELECTION CRITERION for the
      # supported set rather than a coincidence (ADR 0055 D4) — the engines
      # that spell nesting differently are refused BY NAME at ParseDialect.
      # The parameter is kept so that adding a fourth engine cannot be done by
      # forgetting this file; naming it would only trade this finding for an
      # unused-parameter one, and using it would mean writing an unreachable
      # branch that returns empty SQL. Scoped to the one file.
      - "**/internal/service/sql/dialect_sql.go"
      - "internal/service/sql/dialect_sql.go"
      # The trace class again, on the native MessagePack codec's FUNC port.
      # Every encoder there has the signature of its encodeFunc type,
      # func(b []byte, v reflect.Value, depth int), because one plan cached
      # per Go type has to call a string's encoder and a struct's the same
      # way. depth is what a container, a pointer or an interface checks
      # before going one level deeper (the CWE-674 bound); a bool, a number,
      # a string, a time or a marshaler method nests nothing and has no level
      # to check, and `_` says so in the signature. The element writers of
      # the direct map[string]V encoders, and the omitempty test of a kind
      # that is never empty, follow the same ports. Naming the parameter
      # would trade this finding for an unused-parameter one.
      - "**/internal/service/codec/msgpack/**"
      - "internal/service/codec/msgpack/**"

  # KTN-ITER-YIELD / KTN-STRUCT-ACCESSOR — false positives in the framework
  # module (kodflow/ktn-linter#692, #693). TEMPORARY.
  KTN-ITER-YIELD:
    exclude:
      # TEMPORARY — kodflow/ktn-linter#692: ITER-YIELD fires on a one-bool yield
      # (false positive).
      # Temporaire, à retirer quand l'issue est corrigée. Scoped to the
