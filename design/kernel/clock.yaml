apiVersion: kit.kitsunium/design/v2
domain: kernel/clock
packages:
  - doc: |-
      Package clock abstracts the passage of time so higher layers can inject a
      deterministic time source in tests instead of coupling to the wall clock.

      The package carries two independent capabilities behind two independent
      interfaces, and that separation is the load-bearing design decision:

        - [Clock] READS time (Now, Since). It is frozen at two methods on purpose.
          It is reachable from the published pkg/v1 surface — pkg/v1/data/cache.Config is a
          type alias whose Clock field has this type — so every method added to it
          would break every hand-written double downstream, at compile time, with
          no deprecation window.
        - [Waiter] WAITS for time (After, NewTimer, NewTicker, Sleep). Code that
          only stamps records keeps asking for a Clock; code that schedules,
          retries, or times out asks for a [Timed], the union of the two.

      [System] is the production value: a Timed delegating to package time.
      [ManualClock] is the test double: a Timed whose time moves only when the
      test moves it, so a timeout, a retry backoff, or a ticker cadence can be
      asserted exactly, without sleeping and without a wall-clock tolerance.

      # Non-positive durations

      After, NewTimer and Sleep accept a non-positive delay and read it as
      "already elapsed": the value is delivered at once, Sleep returns at once.
      That is the stdlib contract, it is total, and it is the only sensible
      reading of a delay that has no future — a clamp needing no explanation
      (ADR 0031).

      NewTicker and Ticker.Reset REFUSE a non-positive period and panic. A ticker
      has no meaningful zero period, and any positive value this package invented
      instead would be arbitrary — the other half of ADR 0031. The panic is raised
      HERE, by requirePositivePeriod, with a message naming this package and the
      offending duration, and it is raised identically by [System] and by
      [ManualClock]: time.NewTicker's own panic never reaches a caller, so the two
      implementations stay interchangeable at the boundary that matters most.

      # Relationship to testing/synctest

      The stdlib's testing/synctest replaces package time inside a bubble, so
      [System] already observes fake time there — the two mechanisms are
      complementary, not redundant. Which one to reach for is documented in
      CLAUDE.md §"clock vs testing/synctest", and both halves of that comparison
      are pinned by synctest_external_test.go rather than asserted in prose.

      Package clock — hosts compile-time interface assertions
      — keeping them out of the production
      source so the runtime binary carries no diagnostic-only declarations.

      Package clock — hosts ManualClock, the deterministic [Timed] whose instant
      only moves when a caller moves it.

      Package clock — hosts manualTicker, the [Ticker] handle a [ManualClock]
      hands out for a repeating wait.

      Package clock — hosts manualTimer, the [Timer] handle a [ManualClock] hands
      out for a one-shot wait.

      Package clock — hosts manualWait, the record a [ManualClock] keeps for one
      armed wait, plus the three lock-free helpers that operate on it.

      Package clock — hosts the production implementation of the time port:
      systemClock, a zero-sized value delegating every method to package time, and
      the [System] singleton every consumer defaults to.

      Package clock — hosts the [Ticker] contract, the handle a [Waiter] returns
      for a repeating wake-up.

      Package clock — hosts the [Timer] contract, the handle a [Waiter] returns
      for a one-shot wake-up.

      Package clock — hosts the waiting half of the time port: the [Waiter]
      contract, plus the single guard both implementations funnel their
      non-positive-period refusal through.
    functions:
      - doc: |-
          NewManualClock returns a ManualClock reading start. Any instant is legal —
          before the Unix epoch, after 2038, in any location — which is the point:
          unlike testing/synctest's bubble clock, the origin is the caller's choice.
        in:
          - name: start
            type: time.Time
        name: NewManualClock
        out:
          - type: "*ManualClock"
    path: github.com/kitsunium/sdk/internal/kernel/clock
    types:
      - doc: |-
          Clock produces timestamps and durations.
          Implementations must be safe for concurrent use by multiple goroutines.

          This interface is DELIBERATELY not extended: see the package comment. New
          time capabilities land on [Waiter] and are consumed through [Timed].
        interface:
          methods:
            - doc: Now returns the current instant.
              name: Now
              out:
                - type: time.Time
            - doc: Since returns the elapsed duration between the given instant and Now.
              in:
                - name: t
                  type: time.Time
              name: Since
              out:
                - type: time.Duration
        name: Clock
      - doc: |-
          Timed is a [Clock] that also drives waiting. It is the interface production
          code asks for when it needs both halves — a scheduler, a timeout, a retry
          backoff — and the one both [System] and [ManualClock] satisfy.
        interface:
          embeds:
            - Clock
            - Waiter
        name: Timed
      - doc: |-
          ManualClock is a [Timed] whose instant moves ONLY when the caller moves it,
          with [ManualClock.Advance] or [ManualClock.Set]. Every wait it hands out —
          After, NewTimer, NewTicker, Sleep — is due at an absolute instant on this
          clock, and fires exactly when the caller drives the clock past that instant.
          No wall-clock time passes, so a test asserts cadence and ordering instead of
          sleeping and hoping.

          It is a concrete struct, not an interface, for the same reason
          recycler.Pool and snapshot.Value are: there is one implementation, and a
          single-impl interface would be over-abstraction. Always used behind the
          pointer returned by [NewManualClock] — the embedded mutex and cond must not
          be copied.

          Safe for concurrent use: every field is guarded by mu, and each wait's
          channel is created once at registration and never reassigned.

          Two hazards, both inherent to a clock that only a caller can move:

            - [ManualClock.Sleep] blocks until ANOTHER goroutine advances the clock.
              A test that sleeps on its own goroutine with nobody to advance hangs
              until the test binary's timeout. Sleep on the code under test, advance
              from the test.
            - Advance wakes a waiter but does not schedule it. When the assertion
              depends on the woken goroutine having run, synchronise on something the
              goroutine itself signals; [ManualClock.BlockUntil] closes the mirror
              race (advancing before the goroutine has registered its wait).
        methods:
          - doc: Now returns the clock's current instant.
            name: Now
            out:
              - type: time.Time
            recv: pointer
          - doc: |-
              Since returns the duration between t and the clock's current instant. It can
              be negative when t is in the clock's future, exactly like time.Since.
            in:
              - name: t
                type: time.Time
            name: Since
            out:
              - type: time.Duration
            recv: pointer
          - doc: |-
              After returns a channel delivering the fire instant once d has elapsed on
              this clock. A non-positive d delivers before After returns.
            in:
              - name: d
                type: time.Duration
            name: After
            out:
              - type: <-chan time.Time
            recv: pointer
          - doc: |-
              NewTimer returns a one-shot [Timer] due d from the clock's current instant.
              A non-positive d is already elapsed and fires before NewTimer returns.
            in:
              - name: d
                type: time.Duration
            name: NewTimer
            out:
              - type: Timer
            recv: pointer
          - doc: |-
              NewTicker returns a repeating [Ticker] of period d, panicking on a
              non-positive d with the same message [System] uses.
            in:
              - name: d
                type: time.Duration
            name: NewTicker
            out:
              - type: Ticker
            recv: pointer
          - doc: |-
              Sleep blocks the calling goroutine until d has elapsed on this clock — which
              means until another goroutine advances it. A non-positive d returns at once.
            in:
              - name: d
                type: time.Duration
            name: Sleep
            recv: pointer
          - doc: |-
              Advance moves the clock forward by d, firing every wait that comes due, in
              deadline order. It panics on a negative d: rewinding is [ManualClock.Set]'s
              job and would otherwise silently mean "un-fire the timers I already fired".

              Each fired wait receives its own deadline, not the post-advance instant, so
              a receiver reads the moment it was scheduled for. A ticker delivers AT MOST
              ONE tick per Advance and re-arms past the new instant: the delivery channel
              holds one tick anyway, and the alternative — one send per elapsed period —
              makes Advance(time.Hour) on a nanosecond ticker an unbounded loop. To
              observe N ticks, call Advance(period) N times, draining between calls.
            in:
              - name: d
                type: time.Duration
            name: Advance
            recv: pointer
          - doc: |-
              Set moves the clock to t. Forward, it behaves exactly like Advance and fires
              every wait that comes due. Backward, it moves the instant and fires nothing:
              deadlines are absolute, so a rewound clock re-reaches them and the waits fire
              then. That models a wall-clock jump — an NTP step, a VM restore — which is
              something testing/synctest's monotonic bubble clock cannot express.
            in:
              - name: t
                type: time.Time
            name: Set
            recv: pointer
          - doc: |-
              Pending returns the number of armed waits. A fired one-shot timer is no
              longer pending; a stopped timer or ticker is not pending; a live ticker is.
            name: Pending
            out:
              - type: int
            recv: pointer
          - doc: |-
              BlockUntil blocks until at least n waits are armed. It closes the race a
              manual clock otherwise has with the code it drives: the test would advance
              before the goroutine under test had registered its timer, and the wake would
              be lost. It is the manual counterpart of synctest.Wait — coarser, because it
              counts registrations instead of detecting durable blocking, but usable in a
              plain parallel test.

              It blocks forever if the count is never reached; bound the test with the
              binary's own timeout rather than an arbitrary one here.
            in:
              - name: "n"
                type: int
            name: BlockUntil
            recv: pointer
        name: ManualClock
        struct:
          unexported: true
      - doc: |-
          Ticker is a repeating wake-up scheduled on some clock. It mirrors the usable
          surface of *time.Ticker — including its drop-on-slow-receiver contract: the
          delivery channel holds at most one pending tick, and ticks that cannot be
          delivered are discarded rather than queued.

          Implementations must be safe for concurrent use by multiple goroutines.
        interface:
          methods:
            - doc: |-
                C returns the channel on which each tick instant is delivered. The same
                channel is returned by every call; it is never closed.
              name: C
              out:
                - type: <-chan time.Time
            - doc: |-
                Stop halts the Ticker. It does NOT close the channel, so a concurrent
                receiver never sees a spurious zero value, and after Stop returns no
                tick from before the call is received — the guarantee time.Ticker.Stop
                makes since Go 1.23, whose channel is synchronous.
              name: Stop
            - doc: |-
                Reset halts the Ticker and restarts it with period d: no tick from
                before the call is received after it, and the next arrives once d has
                elapsed. It PANICS on a non-positive d; see the package comment.
              in:
                - name: d
                  type: time.Duration
              name: Reset
        name: Ticker
      - doc: |-
          Timer is a one-shot wake-up scheduled on some clock. It mirrors the usable
          surface of *time.Timer, with one unavoidable difference: the stdlib exposes
          the delivery channel as a FIELD (t.C), and no interface can require a field,
          so it is a method here.

          Implementations must be safe for concurrent use by multiple goroutines.
        interface:
          methods:
            - doc: |-
                C returns the channel on which the fire instant is delivered. The same
                channel is returned by every call; it is never closed.
              name: C
              out:
                - type: <-chan time.Time
            - doc: |-
                Stop prevents a not-yet-fired Timer from firing and reports whether the
                Timer was still armed. After Stop returns, no value from a previous
                arming is left pending on C.
              name: Stop
              out:
                - type: bool
            - doc: |-
                Reset re-arms the Timer to fire d from the clock's current instant and
                reports whether it was still armed. After Reset returns, no value from a
                previous arming is left pending on C. A non-positive d fires at once.
              in:
                - name: d
                  type: time.Duration
              name: Reset
              out:
                - type: bool
        name: Timer
      - doc: |-
          Waiter suspends a caller until a duration has elapsed on some clock. It is
          the half of the time abstraction that [Clock] deliberately does not carry.

          Implementations must be safe for concurrent use by multiple goroutines.
        interface:
          methods:
            - doc: |-
                After returns a channel that delivers the fire instant once d has
                elapsed. A non-positive d delivers at once.
              in:
                - name: d
                  type: time.Duration
              name: After
              out:
                - type: <-chan time.Time
            - doc: |-
                NewTimer returns a one-shot [Timer] due d from now. A non-positive d
                fires at once.
              in:
                - name: d
                  type: time.Duration
              name: NewTimer
              out:
                - type: Timer
            - doc: |-
                NewTicker returns a repeating [Ticker] of period d. It PANICS on a
                non-positive d; see the package comment.
              in:
                - name: d
                  type: time.Duration
              name: NewTicker
              out:
                - type: Ticker
            - doc: |-
                Sleep blocks the calling goroutine until d has elapsed on this clock.
                A non-positive d returns at once.
              in:
                - name: d
                  type: time.Duration
              name: Sleep
        name: Waiter
    variables:
      - doc: |-
          System is the default Timed using the package time wall clock. It is typed
          [Timed] rather than [Clock] so callers that need to wait do not have to
          type-assert; assigning it to a Clock field still compiles unchanged.
        name: System
        type: Timed
  - doc: |-
      Package clock is the public facade for the SDK's time port: the interfaces a
      caller injects a time source through, the production clock, and the manual
      clock a test drives by hand.

      # Why this package exists

      These types were already part of the public API before this package existed
      — they just could not be used. Every SDK configuration that takes a time
      source is a type alias onto an internal struct whose Clock field is typed
      [Clock] or [Timed], so the compiler has always named them at a consumer's
      call site:

      	cannot use &myClock{} (value of type *myClock) as clock.Timed value in
      	struct literal: *myClock does not implement clock.Timed
      	(wrong type for method NewTicker)
      	        have NewTicker(time.Duration) *myTicker
      	        want NewTicker(time.Duration) clock.Ticker

      The NewTimer and NewTicker methods of [Waiter] return [Timer] and
      [Ticker], and Go requires type identity — not an identical method set — in
      a method signature. A locally declared interface with the very same methods
      is a different named type, and the package declaring the real one sits
      behind the internal/ firewall. So [Timed] was a field every caller could
      see, that no caller outside this module could satisfy, and whose only
      reachable value was the wall clock.

      This package is aliases and nothing else. It adds no behaviour, changes no
      behaviour, and exists so that naming what the compiler already names is
      possible (ADR 0090).

      # Two interfaces, because there are two jobs

        - [Clock] READS time — Now, Since. Code that stamps a record asks for this
          and nothing more.
        - [Waiter] WAITS for time — After, NewTimer, NewTicker, Sleep.
        - [Timed] is the union, and what a scheduler, a timeout, a retry backoff or
          a lease keepalive asks for.

      The split is why a two-method double still works where only timestamps are
      read: [Clock] is frozen at two methods, so a struct with Now and Since
      satisfies every SDK field typed that way, forever.

      # Two implementations

      [System] is the production value, a [Timed] delegating to package time. It
      is what every SDK configuration falls back to when its Clock field is left
      nil, so you never have to name it to get the normal behaviour.

      [ManualClock] is the test double: time moves only when you move it. It is
      how a timeout, a cron cadence or a lease expiry is asserted exactly, with no
      sleeping and no wall-clock tolerance.

      	mc := clock.NewManualClock(time.Date(2026, 1, 1, 0, 0, 0, 0, time.UTC))

      	sched := scheduler.New(scheduler.Config{Clock: mc})
      	_ = sched.Add(scheduler.Entry{Name: "hourly", Schedule: every, Job: job})
      	go sched.Run(ctx)

      	mc.BlockUntil(1)        // the engine has armed its wait — no race, no sleep
      	mc.Advance(time.Hour)   // the hour passes instantly
      	<-fired                 // the job ran

      BlockUntil is the half that makes this deterministic rather than merely
      fast: it waits until n waits are armed, closing the race where a test
      advances the clock before the code under test has asked to be woken.

      # Zero and negative durations

      After, NewTimer and Sleep read a non-positive delay as "already elapsed" and
      deliver at once. That is the stdlib contract and it is total.

      NewTicker and Ticker.Reset REFUSE a non-positive period and panic, because
      a ticker has no meaningful zero period and any value the SDK substituted
      would be arbitrary (ADR 0031). [System] and [ManualClock] panic identically,
      with the same message, so the two stay interchangeable.

      # The method sets do not grow

      [Clock], [Waiter], [Timed], [Timer] and [Ticker] are frozen. Under ADR 0039
      a published interface is extended by a SIBLING interface discovered by type
      assertion, never by widening — Go interfaces are structural, so one added
      method breaks every hand-written double downstream at compile time with no
      deprecation window. Writing a double against these five is safe.

      [ManualClock] is a concrete type and carries no exported field, so it can
      only be built through [NewManualClock] and driven through its methods. That
      is deliberate: it means a future field costs no consumer anything, which is
      the expensive half of ADR 0040.

      # Relationship to testing/synctest

      The stdlib's testing/synctest replaces package time inside a bubble, so
      [System] already observes fake time there. The two mechanisms are
      complementary: synctest fakes time for everything in the bubble, while a
      [ManualClock] fakes it for exactly the component you handed it to, from an
      origin you chose. Reach for synctest when the code under test uses package
      time directly; reach for [ManualClock] when it takes a [Timed].
    facade:
      - alias:
          - doc: |-
              Clock produces timestamps and durations. It is FROZEN at two methods: a
              struct with Now and Since satisfies every SDK field typed this way, and will
              keep satisfying it (ADR 0039).

              Implementations must be safe for concurrent use by multiple goroutines.
            name: Clock
            target: kclock.Clock
      - alias:
          - doc: |-
              Waiter suspends a caller until a duration has elapsed. It is the half of the
              time port [Clock] deliberately does not carry, so code that only stamps
              records never has to implement it.

              Implementations must be safe for concurrent use by multiple goroutines.
            name: Waiter
            target: kclock.Waiter
      - alias:
          - doc: |-
              Timed is a [Clock] that also drives waiting — the union of [Clock] and
              [Waiter], and the type SDK configurations use when they schedule, time out
              or back off. Both [System] and [ManualClock] satisfy it.
            name: Timed
            target: kclock.Timed
      - alias:
          - doc: |-
              Timer is a one-shot wake-up scheduled on some clock. It mirrors the usable
              surface of *time.Timer, with one unavoidable difference: the stdlib exposes
              the delivery channel as a FIELD (t.C) and no interface can require a field,
              so C is a method here.

              Implementations must be safe for concurrent use by multiple goroutines.
            name: Timer
            target: kclock.Timer
      - alias:
          - doc: |-
              Ticker is a repeating wake-up scheduled on some clock. It mirrors the usable
              surface of *time.Ticker, including its drop-on-slow-receiver contract: the
              channel holds at most one pending tick and undeliverable ticks are discarded
              rather than queued.

              Implementations must be safe for concurrent use by multiple goroutines.
            name: Ticker
            target: kclock.Ticker
      - alias:
          - doc: |-
              ManualClock is the deterministic test double: a [Timed] whose time moves
              only when the caller moves it, through Advance or Set, and which reports its
              armed waits through Pending and BlockUntil.

              It carries no exported field and must not be copied — build it with
              [NewManualClock] and pass the pointer.

              Two hazards are inherent to a clock only a caller can move, and both are
              documented rather than prevented:

                - Sleep blocks until ANOTHER goroutine advances the clock. A test that
                  sleeps on its own goroutine with nobody to advance hangs until the test
                  binary times out. Sleep on the code under test, advance from the test.
                - Advance wakes a waiter but does not schedule it. When an assertion
                  depends on the woken goroutine having run, synchronise on something that
                  goroutine itself signals; BlockUntil closes the mirror race, where a test
                  advances before the code has registered its wait.
            name: ManualClock
            target: kclock.ManualClock
      - var:
          - doc: |-
              System is the production [Timed], delegating every method to package time.

              It is the value every SDK configuration falls back to when its Clock field
              is nil, so it rarely needs naming — reach for it when a field is required,
              or to make the production choice explicit beside a test that injects another.

              System is a VALUE, not a hook: assigning to this variable rebinds this
              package's name and changes nothing inside the SDK, which reads its own
              default directly. To give a component a different clock, set that
              component's Clock field.
            name: System
            reexport: kclock.System
            type: Timed
            typed: true
      - func:
          doc: |-
            NewManualClock returns a [ManualClock] reading start. Any instant is legal —
            before the Unix epoch, after 2038, in any location — which is the point:
            unlike testing/synctest's bubble clock, the origin is the caller's choice.
          forward: kclock.NewManualClock
          in:
            - name: start
              type: time.Time
          name: NewManualClock
          out:
            - type: "*ManualClock"
    imports:
      kclock: github.com/kitsunium/sdk/internal/kernel/clock
    path: github.com/kitsunium/sdk/pkg/v1/clock
