apiVersion: kit.kitsunium/design/v2
domain: kernel/fs
packages:
  - constants:
      - build: "!(linux || darwin || freebsd || openbsd || netbsd || dragonfly || windows)"
        doc: |-
          Native reports that this GOOS has no file lock. A caller reads it and
          refuses where it is wired, rather than at the first contended section.
        name: Native
        type: bool
        value: "false"
      - build: linux || darwin || freebsd || openbsd || netbsd || dragonfly
        doc: "Native reports that this GOOS has a file lock: flock(2), here."
        name: Native
        type: bool
        value: "true"
      - build: windows
        doc: "Native reports that this GOOS has a file lock: LockFileEx, here."
        name: Native
        type: bool
        value: "true"
    doc: |-
      Package flock takes an exclusive lock on a whole file WITHOUT waiting for it,
      and gives it back: flock(2) on the Unix kernels that have it, LockFileEx over
      every byte of the file on Windows (ADR 0081, ADR 0159).

      # Never a blocking call

      [TryLock] answers at once — held, held elsewhere, or a failure of the call —
      and there is no blocking variant. That is the point of the package rather
      than a gap in it. A blocking flock(2), and a LockFileEx without
      LOCKFILE_FAIL_IMMEDIATELY, park the calling thread inside a syscall no
      context cancellation can reach: a caller whose deadline expired would keep
      waiting for a lock it no longer wants, and its goroutine would not come back
      until some other process let go. A caller that must wait polls TryLock on a
      clock of its own, which is how every file lock in the SDK waits (ADR 0052,
      ADR 0073).

      # One contract over two primitives, and the row where they are opposites

      Both kernels give the same answer where exclusion between PROCESSES is
      decided: a second open description of the file — another process, or a
      second os.OpenFile of the same path in this one — is refused while the first
      holds the lock, and the holder's death releases it. They give OPPOSITE
      answers to a second lock taken through the SAME description: flock(2)
      converts it and returns at once, LockFileEx refuses it. So neither kernel
      excludes the goroutines of one process that share a descriptor in a way a
      caller could rely on everywhere, and this package does not pretend to: a
      caller that shares one descriptor between goroutines puts a gate of its own
      in front of TryLock. TestTheSameDescriptionIsConvertedOnUnixAndRefusedOnWindows
      pins both answers.

      The Windows lock is also MANDATORY where flock(2) is advisory, and it covers
      a byte range — here every byte of the file. flock_windows.go states each
      difference and what it was measured on; what a caller builds on them is the
      caller's to say.

      # Where neither exists

      [Native] is false on every GOOS with neither primitive — js, wasip1, plan9,
      aix, solaris, illumos — and there TryLock and Unlock return
      errors.ErrUnsupported. A caller reads Native where it is wired and refuses
      there, under its own code (ADR 0018 §(a)); the package compiles on every
      GOOS so that the refusal can be written at all.

      # What it returns

      The kernel's own answer. Contention is (false, nil), never an error; any
      other failure is the errno itself, unwrapped, so a caller wraps it once in
      its own vocabulary — the convention pathchain set for this family. The
      package owns no error code.

      Package flock — the honest answer on the platforms with no file lock at all
      (ADR 0018 §(a): a uniform typed answer where a platform has no native
      mechanic, never a silent drop and never a build break).

      This set used to include Windows, on the argument that LockFileEx is not
      flock(2): it locks a byte range rather than a file, its locks are mandatory
      rather than advisory, and its rules for a second lock inside one process
      differ again. All three are true, and all three are measured on a real
      Windows kernel rather than recited. What was wrong was the conclusion — that
      a primitive behaving *almost* like flock is worth less than none. One whose
      every difference is measured, written down, and pinned by a test that fails
      when it changes is not an approximation; it is a second implementation of the
      same contract, and it is flock_windows.go (ADR 0081).

      What is left here is the set of GOOS values with no equivalent primitive in
      Go's syscall package — js, wasip1, plan9, aix, solaris and illumos. They get
      errors.ErrUnsupported from every call, and a caller that read [Native] at
      construction never makes one.

      Package flock — flock(2), on the kernels that have it.

      flock(2) is not POSIX. It exists on Linux and on every BSD (macOS included)
      with the same shape, and the tag set above is exactly where Go's syscall
      package declares it — android and ios reach this file through the linux and
      darwin tags. The lock belongs to the open file DESCRIPTION: a dup(2)'d
      descriptor shares it, a second open(2) of the same path does not, and the
      kernel drops it when the last descriptor on the description closes — which a
      process's death does. It is ADVISORY: it binds every process that takes it,
      and nothing else.

      Package flock — LockFileEx, on the kernel that has no flock(2) (ADR 0081).

      LockFileEx is the nearest primitive and it is genuinely a different one, so
      this file states every difference rather than smoothing it over. A lock is
      the one primitive whose failures are invisible at the moment they happen and
      expensive at every later moment, and an emulation that behaves almost like
      flock(2) is worth less than none, because its caller stops looking. Each row
      was measured on a real windows-latest kernel before the first backend over it
      was written (ADR 0081):

      	                                       flock(2)                 LockFileEx
      	two separate opens, one process        excludes                 excludes
      	the SAME description locked again      succeeds — a conversion  refused — ERROR_LOCK_VIOLATION
      	another process while held             excludes                 excludes
      	enforced against unrelated I/O         no — advisory            yes — mandatory
      	scope                                  the whole file           a byte range: here, every byte

      # It locks a byte RANGE, so the range is the whole file

      Offset zero, 2^64-1 bytes, spelled MAXDWORD in both length halves — the
      documented idiom for "everything", and legal past end-of-file ("Locking a
      region that goes beyond the current end-of-file position is not an error").
      Any smaller range leaves the bytes outside it readable and writable by every
      other handle while the lock is held, which is a decision about the file's
      contents and so the caller's, not this package's.

      # Its locks are MANDATORY, not advisory

      The kernel enforces them against ordinary reads and writes: while the lock
      is held, another handle's read or write of the file fails with
      ERROR_LOCK_VIOLATION — a foreign `type` of a held file included. The holder
      is exempt: the documented rule is per HANDLE, and the handle that placed the
      lock keeps full access to the range, so the holder reads and writes the file
      through the very descriptor that carries the lock.

      # A second lock through the same handle is REFUSED, where flock(2) CONVERTS

      This is the row where the two kernels are opposites. flock(LOCK_EX) on a
      description that already holds LOCK_EX succeeds immediately; LockFileEx on a
      range an overlapping lock already covers is refused, whichever handle asks
      and whichever process owns it. Exclusion between the goroutines of one
      process therefore falls out of the kernel here and does not on Unix, and a
      caller that wants the same behaviour on both keeps a gate of its own.
    functions:
      - doc: |-
          TryLock takes an exclusive lock on the whole of file without waiting.

          It reports (true, nil) when the lock is now held through file, (false, nil)
          when another open description holds it, and (false, err) when the call
          itself failed: the kernel's errno, or errors.ErrUnsupported where [Native] is
          false. Contention is an answer and never an error, so a caller cannot mistake
          a busy lock for a broken one, nor the reverse.
        in:
          - name: file
            type: "*os.File"
        name: TryLock
        out:
          - name: held
            type: bool
          - name: err
            type: error
      - doc: |-
          Unlock releases the lock [TryLock] took through file.

          Closing the descriptor would release it too. Unlocking explicitly first
          keeps the two events apart on purpose: the lock is given up while the
          descriptor is still valid, so a failure to release is reportable rather than
          hidden behind a close that "worked".
        in:
          - name: file
            type: "*os.File"
        name: Unlock
        out:
          - type: error
    path: github.com/kitsunium/sdk/internal/kernel/fs/flock
  - doc: |-
      Package pathchain resolves a path one component at a time and reports what
      each component IS, instead of only what the whole path finally names.

      # The question os.Stat cannot be asked

      os.Stat answers "what is at the end of this path". os.Lstat answers the same
      question without following the LAST component. Neither can say whether the
      path arrived where it did by going through somebody else's redirection, and
      that is the question a program asks when the path names a resource whose
      identity is a security property — a lock file, a state directory, a socket.

      O_NOFOLLOW has the same limit and it is a kernel limit, not a Go one: it
      governs the final component only. A link planted at a PARENT component is
      traversed by every open, whatever flags it carries.

      # What this package does instead

      [Resolve] walks the path from the filesystem root, holding an open directory
      handle at every step, and asks each component's own directory what that
      component is — lstat relative to a descriptor, never a fresh lookup of a
      path string. It returns one [StepValue] per component, in order, each
      carrying the mode of the directory it was found in.

      It does not refuse anything. A refusal needs a policy, a policy needs a
      domain, and this package has neither; what it has is the measurement a
      policy cannot be written without. The two callers this was built for want
      opposite verdicts on the same shape — /var/run being a symbolic link is a
      distribution's decision, /tmp/myapp being one may be an attack — and the
      difference is in StepValue.Container, not in the link.

      # What it rests on, and what that costs

      The directory handles are [os.Root], whose Unix implementation is
      openat(dirfd, name, O_NOFOLLOW|O_CLOEXEC|O_DIRECTORY) and whose Windows
      implementation passes O_NOFOLLOW_ANY — read in go1.27's src/os/root_unix.go
      and src/os/root_windows.go rather than assumed. That matters because
      syscall.Openat, the obvious primitive, exists in go1.27's syscall package
      for linux, aix and wasip1 ONLY: darwin reaches the kernel through libc
      trampolines that are internal to the standard library and does not even
      define SYS_OPENAT, so a hand-rolled walk would have served five kernels and
      silently skipped the sixth. os.Root is the standard library's own openat
      walk and it is available on every platform the SDK builds for.

      The cost of borrowing it is that os.Root resolves a symbolic link whose
      target stays inside the root and refuses one whose target leaves it, and
      neither behaviour is what a walk wants. So this package never asks os.Root
      to traverse an indirection: it detects one with Lstat, reads it with
      Readlink, and restarts the walk itself at the target. os.Root is used for
      exactly one thing — descending into a component already known to be a real
      directory.

      Package pathchain — the walk's POSITION: one open directory handle per
      component already entered, so every question is asked of a descriptor this
      process holds rather than of a path string that could resolve elsewhere.

      Package pathchain — one COMPONENT of a resolved path, described rather than
      traversed, with the mode of the directory it was found in beside it.
    functions:
      - doc: |-
          Resolve walks path from the filesystem root and returns one [StepValue] per
          component, in the order they were traversed.

          A relative path is made absolute against the working directory first, so the
          chain always starts at a root and a caller never has to.

          # It stops where the path stops existing, and that is not an error

          A component that does not exist ends the walk and returns the steps taken so
          far with a nil error. That is deliberate: the caller this was built for
          audits a directory it is ABOUT to create, and "the last two components are
          not there yet" is the ordinary case rather than a fault. Every other
          failure — a permission denied, a component that is not a directory, an
          indirection loop — is returned as the *os.PathError the filesystem produced,
          unwrapped, so the caller's own error vocabulary can wrap it once.

          # The chain describes where resolution WENT

          A step's Path reflects the indirections already followed. Given
          /pub/app -> /srv/app and a walk of /pub/app/locks, the third step's Path is
          /srv/app/locks and not /pub/app/locks, because the third component genuinely
          lives in /srv/app and a caller deciding who could have replaced it must ask
          about that directory.
        in:
          - name: path
            type: string
        name: Resolve
        out:
          - name: steps
            type: "[]StepValue"
          - name: err
            type: error
    imports:
      fs: io/fs
    path: github.com/kitsunium/sdk/internal/kernel/fs/pathchain
    types:
      - doc: |-
          StepValue describes one component of a resolved path: what that component
          IS, and who could have put it there.

          The second half is the reason this type exists. Knowing that a component is
          a symbolic link answers almost nothing on its own, because the answer is
          "yes" for /tmp on macOS, for /var/run on most Linux distributions, and for
          C:\Users\All Users on Windows — all of them legitimate, all of them planted
          by the operating system's installer. What separates those from an attack is
          not the link, it is the DIRECTORY THE LINK LIVES IN: a link in a directory
          only root can write was put there by root, and a link in a world-writable
          directory was put there by anybody at all.

          So every step carries Container, the mode of the directory the component was
          looked up in, read by fstat on a handle this package held open rather than
          by a second path lookup that could resolve somewhere else.
        name: StepValue
        struct:
          fields:
            - doc: |-
                Path is the path as resolved up to and including this component. It
                reflects the indirections already followed, so it is where the component
                actually lives rather than what the caller typed.
              name: Path
              type: string
            - doc: Name is this component alone, with no separator.
              name: Name
              type: string
            - doc: |-
                Container is the mode of the directory this component was looked up in.

                On Unix its permission bits answer "who could have created this entry".
                On Windows os.Stat synthesises the bits from one read-only attribute, so
                they answer nothing there and a caller needing that answer must get it
                from the platform's own access-control model. This package reports what
                it read and takes no position on what it means.
              name: Container
              type: fs.FileMode
            - doc: |-
                Mode is the mode of the component itself, as lstat reports it: an
                indirection is described here, never traversed to describe its target.
              name: Mode
              type: fs.FileMode
            - doc: |-
                Info is the whole of that lstat answer — Mode is Info.Mode() — for what
                a mode does not say. On Unix, Info.Sys() is the *syscall.Stat_t naming
                the component's OWNER, which is how a policy tells a component this
                account or root created from one another account did. It is read the
                way Container is, relative to the handle of the directory the component
                was found in, never by a second lookup of Path; and like Mode it
                describes an indirection itself, never its target.
              name: Info
              type: fs.FileInfo
            - doc: |-
                Target is where the indirection points, exactly as the filesystem stores
                it — relative or absolute, unresolved. It is empty unless Indirect.
              name: Target
              type: string
            - doc: |-
                Indirect records that this component is a symbolic link on Unix or a
                reparse point on Windows, so resolving the path CONTINUED somewhere the
                component's own name does not say.
              name: Indirect
              type: bool
  - codes:
      - const:
          - doc: CodeDamaged identifies a log whose segments hold damage that is not a torn tail.
            name: CodeDamaged
            note: "range: 0.1.8.0 - 0.1.8.255"
            value: "0x00_01_08_01"
          - doc: CodeVersionUnsupported identifies a record a newer layout wrote.
            name: CodeVersionUnsupported
            value: "0x00_01_08_02"
          - doc: CodeOutOfSequence identifies an Append whose index is not the log's next.
            name: CodeOutOfSequence
            value: "0x00_01_08_03"
          - doc: CodeDropped identifies a read below the log's first index.
            name: CodeDropped
            value: "0x00_01_08_04"
          - doc: CodeOutOfRange identifies a read at or past the log's next index.
            name: CodeOutOfRange
            value: "0x00_01_08_05"
          - doc: CodeFailed identifies a write, a sync or a read the filesystem refused.
            name: CodeFailed
            value: "0x00_01_08_06"
          - doc: CodeClosed identifies a call on a closed log.
            name: CodeClosed
            value: "0x00_01_08_07"
          - doc: CodeTooLarge identifies a payload larger than one record carries.
            name: CodeTooLarge
            value: "0x00_01_08_08"
        type: errs.Code
    constants:
      - doc: |-
          DefaultSegmentBytes is a segment's size when Open is given none: 64 MiB, the
          consensus log's.
        name: DefaultSegmentBytes
        type: int64
        value: 64 << 20
    doc: |-
      Package seglog is a durable, append-only log of records addressed by a
      contiguous uint64 index, kept in a directory of fixed-size, zero-filled
      segment files: the segmented log the consensus file log wrote for itself
      (ADR 0152 D4), extracted without its vocabulary so that any engine needing
      an ordered, crash-recovering sequence of byte payloads builds on it rather
      than rewriting it (ADR 0159, ADR 0230).

      # The record

      Every record is 8-byte aligned and little-endian:

      	length u32 | crc32c u32 | version u8 | kind u8 | end u8 | tag u8 |
      	batch u64 | index u64 | payload | zero padding

      length counts the bytes after the crc, padding excluded, and the crc is the
      CRC-32C of those bytes. The tag is the caller's kind byte, stored and given
      back, never read. Every segment opens with a checkpoint record — the index its
      first entry takes, the log's first index and its batch sequence number — and
      a full segment is closed by a seal record before the next one is published.

      # One batch, two syncs

      [Log.Append] only buffers. [Log.Sync] writes the pending batch, its last
      record flagged end-of-batch, in two steps: every record but the last, made
      durable, then the last one, made durable. A valid end record therefore proves
      its whole batch was durable before it, and batch k+1 is written only once
      batch k is, so a valid record of a later batch proves every earlier one. A
      failed write or sync is final: the log refuses every later call with Failed,
      because what a failed fsync left on the disk is not knowable.

      # Recovery classifies before it repairs

      [Open] reads every segment and classifies every hole BEFORE it changes a byte.
      A hole in the last segment whose batch never completed — no valid end record,
      no valid record of a later batch after it — is a torn tail: never synced, so
      never acknowledged; it is zeroed and synced, and the log continues before it.
      Any other hole is damage to synced data and Open refuses with Damaged, the
      files left as they were; a record a newer layout wrote is refused with
      VersionUnsupported, never skipped. What a damaged log means — quarantine,
      repair, a rebuild from elsewhere — is the caller's decision.

      # Dropping a prefix

      [Log.DropBefore] records the log's new first index durably, then unlinks the
      whole sealed segments that hold only entries below it and syncs the
      directory. Nothing is rewritten: retention is by whole segments, and an entry
      below the first index that still sits in a retained segment is unreadable.

      # What it is not

      It holds one directory exclusively and takes no lock on it: a caller that may
      be started twice over the same directory locks it first (flock). It knows
      nothing of terms, votes, offsets in a partition or consumers; those are its
      callers' (ADR 0230). One writer at a time, any number of readers: an appended
      entry is readable before it is synced.
    functions:
      - doc: |-
          Open opens, and recovers, the log kept in dir, creating the directory (mode
          0700) and its first segment when there is none. segBytes is the size of a
          segment, DefaultSegmentBytes when it is zero or negative; a batch larger
          than a segment gets a segment of its own size. Open refuses with Damaged or
          VersionUnsupported a log it cannot trust, having changed nothing, and with
          Failed a directory the filesystem refuses; a torn tail it repairs. Before it
          returns, every segment and the directory are synced, so nothing it reports
          rests on pages a disk did not hold.
        in:
          - name: dir
            type: string
          - name: segBytes
            type: int64
        name: Open
        out:
          - type: "*Log"
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/kernel/fs/seglog
    sentinels:
      - var:
          - code: CodeDamaged
            doc: |-
              Damaged is returned by Open for a log whose segments hold damage that is
              not a torn tail — a hole before a valid record of a later batch, a bad
              record inside a batch whose end record is valid, a hole in an earlier
              segment, a checkpoint that does not continue the log — and by a read whose
              record no longer matches what the log recorded. Its fields name the
              segment, the offset and why; nothing was changed.
            name: Damaged
            private: "internal/kernel/fs/seglog: a hole or a record recovery cannot classify as a torn tail"
            public: The log holds damage that is not a torn tail
            reason: DAMAGED
          - code: CodeVersionUnsupported
            doc: |-
              VersionUnsupported is returned by Open for a record whose crc holds but
              whose version or kind this build does not read: a newer build wrote it,
              synced it and may have acknowledged it, so it is never taken for a hole.
            name: VersionUnsupported
            private: "internal/kernel/fs/seglog: a sealed record of a version or kind this build does not read"
            public: The log holds a record of a newer layout
            reason: VERSION_UNSUPPORTED
          - code: CodeOutOfSequence
            doc: |-
              OutOfSequence is returned by Append for an index that is not the log's next:
              the log's indexes are contiguous.
            name: OutOfSequence
            private: "internal/kernel/fs/seglog: Append of an index other than the next"
            public: The record's index does not follow the log's last
            reason: OUT_OF_SEQUENCE
          - code: CodeDropped
            doc: Dropped is returned by Read, Range and Kind for an index below the log's first.
            name: Dropped
            private: "internal/kernel/fs/seglog: a read below the first index"
            public: The record was dropped from the log
            reason: DROPPED
          - code: CodeOutOfRange
            doc: OutOfRange is returned by Read, Range and Kind for an index at or past the log's next.
            name: OutOfRange
            private: "internal/kernel/fs/seglog: a read at or past the next index"
            public: The record is past the end of the log
            reason: OUT_OF_RANGE
          - code: CodeFailed
            doc: |-
              Failed is returned when the filesystem refused a write, a sync, a read or a
              directory operation; its fields name the operation and the cause. After a
              failed write or sync the log refuses every later call with it.
            name: Failed
            private: "internal/kernel/fs/seglog: the filesystem refused an operation"
            public: The log's storage failed
            reason: FAILED
          - code: CodeClosed
            doc: Closed is returned by every call on a log after Close.
            name: Closed
            private: "internal/kernel/fs/seglog: a call after Close"
            public: The log is closed
            reason: CLOSED
          - code: CodeTooLarge
            doc: TooLarge is returned by Append for a payload above 1 GiB less a record's header.
            name: TooLarge
            private: "internal/kernel/fs/seglog: Append of a payload above the record bound"
            public: The record is too large for the log
            reason: TOO_LARGE
    types:
      - doc: |-
          Log is a segmented log opened by Open. One writer at a time — Append, Sync,
          DropBefore and Close serialise — and any number of readers, which never wait
          for a sync's disk I/O. The zero value is NOT usable.
        methods:
          - doc: |-
              Append adds a record to the pending batch: payload, copied, at index, with
              the caller's kind byte. index must be the log's next (OutOfSequence
              otherwise) and payload at most 1 GiB less a record's header (TooLarge). The
              record is readable at once and durable only once Sync returns nil.
            in:
              - name: index
                type: uint64
              - name: kind
                type: uint8
              - name: payload
                type: "[]byte"
            name: Append
            out:
              - type: error
            recv: pointer
          - doc: |-
              Sync makes the pending batch durable: written after the log's last record,
              every record but the last synced, then the last one, flagged end-of-batch,
              synced. A full segment is sealed and the next one published between two
              batches, never inside one. Whole segments a DropBefore left behind are then
              unlinked. A failure is final: the log refuses every later call. With nothing
              pending it returns at once.
            name: Sync
            out:
              - type: error
            recv: pointer
          - doc: |-
              Read returns a copy of the payload at index: Dropped below the first index,
              OutOfRange at or past the next, Damaged when the record on disk no longer
              matches the one the log recorded.
            in:
              - name: index
                type: uint64
            name: Read
            out:
              - type: "[]byte"
              - type: error
            recv: pointer
          - doc: |-
              Range appends to dst the payloads at lo up to hi excluded, and returns it:
              always the first, then as long as the payloads appended stay within
              maxBytes. Contiguous records of one segment are read with one read. The
              payloads are the caller's and may share one backing array. Errors are
              Read's, for lo and hi; an empty range returns dst.
            in:
              - name: lo
                type: uint64
              - name: hi
                type: uint64
              - name: maxBytes
                type: int
              - name: dst
                type: "[][]byte"
            name: Range
            out:
              - type: "[][]byte"
              - type: error
            recv: pointer
          - doc: |-
              Kind returns the caller's kind byte of the record at index, from memory,
              with Read's errors for an index outside the log.
            in:
              - name: index
                type: uint64
            name: Kind
            out:
              - type: uint8
              - type: error
            recv: pointer
          - doc: |-
              DropBefore makes index the log's first: the records below it become
              unreadable at once, a drop record is added to the pending batch and the batch
              is synced, as Sync syncs it, after which the sealed segments that hold only
              records below index are unlinked and the directory synced. An index past
              the next empties the log and makes it the next too, so the next Append
              takes it. An index at or below the first changes nothing.
            in:
              - name: index
                type: uint64
            name: DropBefore
            out:
              - type: error
            recv: pointer
          - doc: |-
              Bounds returns the log's first index and its next: the records held are
              first through next-1, none when they are equal. A fresh log holds none at
              index 0.
            name: Bounds
            out:
              - name: first
                type: uint64
              - name: next
                type: uint64
            recv: pointer
          - doc: |-
              Close closes every segment and reports the first failure; a batch still
              pending is discarded, never written. Every later call returns Closed; a
              second Close returns nil.
            name: Close
            out:
              - type: error
            recv: pointer
        name: Log
        struct:
          unexported: true
  - constants:
      - blockDoc: |-
          Access rights (winnt.h), in the vocabulary GrantsAnyone takes. Each carries
