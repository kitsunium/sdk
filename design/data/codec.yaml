apiVersion: kit.kitsunium/design/v2
domain: data/codec
packages:
  - codes:
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies an init-time collision on the codec
              registry; two codecs tried to claim the same Name.
            name: CodeDuplicateRegistration
            note: "range: 0.2.2.0 - 0.2.2.255"
            value: "0x00_02_02_01"
        type: errs.Code
      - const:
          - doc: CodeEmptyInput identifies Unmarshal being called with a zero-byte slice.
            name: CodeEmptyInput
            value: "0x00_02_02_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeTargetInvalid identifies Unmarshal being called with a target that is
              not a non-nil pointer to a storable value.
            name: CodeTargetInvalid
            value: "0x00_02_02_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeValueInvalid identifies Marshal being called on a value the codec
              cannot serialise (channel, function, unsupported map key).
            name: CodeValueInvalid
            value: "0x00_02_02_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCodecNil identifies a Register call made with a nil Codec — a
              nil-argument programmer error distinct from a duplicate registration.
              Surfaced via panic at boot (see registry.go), mirroring writer.CodeWriterNil.
            name: CodeCodecNil
            value: "0x00_02_02_05"
        type: errs.Code
    functions:
      - in:
          - name: c
            type: Codec
        name: Register
        out:
          - type: Codec
      - in:
          - name: f
            type: Format
        name: Lookup
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - in:
          - name: raw
            type: string
        name: LookupMIME
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - in:
          - name: ext
            type: string
        name: LookupExt
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - name: Available
        out:
          - type: "[]Format"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec
    ports:
      - doc: |-
          Appender is the optional extension implemented by codecs that can encode
          directly into a caller-supplied byte slice instead of allocating their own.
          Hot paths (logger record formatting, NDJSON streams, batch sinks) consume
          this interface to avoid the buffer-copy cost imposed by Marshal.

          Implementations MUST:
            - Append the encoded representation of v onto dst (typically via the
              standard append(dst, …) idiom).
            - Return the (possibly re-allocated) buffer back to the caller.
            - Be safe for concurrent use by multiple goroutines.

          The returned buffer's length grows by the number of bytes written; the
          underlying array MAY be a fresh allocation when dst's capacity is too
          small. Callers retain ownership of dst and SHOULD reuse it across calls.
        embeds:
          - Codec
        methods:
          - doc: |-
              Append encodes v and appends the bytes onto dst. The returned slice
              MUST contain the prior contents of dst followed by the encoded form.
            in:
              - name: dst
                type: "[]byte"
              - name: v
                type: any
            name: Append
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: Appender
      - doc: |-
          Codec is the minimum contract every format codec satisfies. Instances MUST
          be safe for concurrent use; format-specific options are supplied via the
          codec's constructor, not via the Codec interface.
        methods:
          - name: Name
            out:
              - type: string
          - name: MIMETypes
            out:
              - type: "[]string"
          - name: Extensions
            out:
              - type: "[]string"
          - in:
              - name: v
                type: any
            name: Marshal
            out:
              - name: data
                type: "[]byte"
              - name: err
                type: error
          - in:
              - name: data
                type: "[]byte"
              - name: v
                type: any
            name: Unmarshal
            out:
              - name: err
                type: error
        name: Codec
      - doc: |-
          StreamingCodec is the optional extension for formats that support
          incremental encode/decode over io.Writer / io.Reader. Codecs that CAN
          stream SHOULD implement it; consumers detect support with a type assertion.
        embeds:
          - Codec
        methods:
          - in:
              - name: w
                type: io.Writer
            name: NewEncoder
            out:
              - type: Encoder
          - in:
              - name: r
                type: io.Reader
            name: NewDecoder
            out:
              - type: Decoder
        name: StreamingCodec
      - doc: Encoder writes one or more values to the wrapped writer.
        methods:
          - in:
              - name: v
                type: any
            name: Encode
            out:
              - name: err
                type: error
          - name: Close
            out:
              - name: err
                type: error
        name: Encoder
      - doc: Decoder reads one or more values from the wrapped reader.
        methods:
          - in:
              - name: v
                type: any
            name: Decode
            out:
              - name: err
                type: error
          - name: More
            out:
              - name: ok
                type: bool
        name: Decoder
    sentinels:
      - var:
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the conflict Register refuses at boot: a distinct
              codec already holds the Format name, MIME type or extension a second one
              claims. It is never returned — Register panics with conflictText of it, so
              the panic carries the dotted-quad header AND the key that collided.
            name: DuplicateRegistration
            private: "core/data/codec.Register: a distinct codec already holds this Format name, MIME type or extension"
            public: A codec is already registered under that name, MIME type or extension
            reason: DUPLICATE_REGISTRATION
    types:
      - methods:
          - name: Known
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: Format
        underlying: string
  - constants:
      - name: Any
        type: Kind
        value: "0"
      - name: Object
        type: Kind
        value: "1"
      - name: Array
        type: Kind
        value: "2"
      - name: Map
        type: Kind
        value: "3"
      - name: String
        type: Kind
        value: "4"
      - name: Integer
        type: Kind
        value: "5"
      - name: Number
        type: Kind
        value: "6"
      - name: Boolean
        type: Kind
        value: "7"
      - name: Unsupported
        type: Kind
        value: "8"
    functions:
      - in:
          - name: t
            type: reflect.Type
        name: Of
        out:
          - type: "*ShapeValue"
      - name: For
        out:
          - type: "*ShapeValue"
        typeParams:
          - constraint: any
            name: T
    path: github.com/kitsunium/sdk/internal/service/data/codec/jsonshape
    types:
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: MarshalText
            out:
              - type: "[]byte"
              - type: error
            recv: value
        name: Kind
        underlying: uint8
      - name: ShapeValue
        struct:
          fields:
            - name: Kind
              tag: json:"kind"
              type: Kind
            - name: Name
              tag: json:"name,omitempty"
              type: string
            - name: Format
              tag: json:"format,omitempty"
              type: string
            - name: Nullable
              tag: json:"nullable,omitempty"
              type: bool
            - name: Fields
              tag: json:"fields,omitempty"
              type: "[]FieldValue"
            - name: Items
              tag: json:"items,omitempty"
              type: "*ShapeValue"
            - name: Values
              tag: json:"values,omitempty"
              type: "*ShapeValue"
            - name: Ref
              tag: json:"ref,omitempty"
              type: string
      - name: FieldValue
        struct:
          fields:
            - name: Name
              tag: json:"name"
              type: string
            - name: Shape
              tag: json:"shape"
              type: "*ShapeValue"
            - name: Optional
              tag: json:"optional,omitempty"
              type: bool
            - name: Quoted
              tag: json:"quoted,omitempty"
              type: bool
            - name: Rules
              tag: json:"rules,omitempty"
              type: string
            - name: GoName
              tag: json:"-"
              type: string
            - name: Tag
              tag: json:"-"
              type: reflect.StructTag
            - name: Index
              tag: json:"-"
              type: "[]int"
  - codes:
      - const:
          - doc: CodeUnknownFormat fires when a Format is not registered in the registry.
            name: CodeUnknownFormat
            note: "range: 1.2.0.0 - 1.2.0.255"
            value: "0x01_02_00_01"
        type: v1errs.Code
      - const:
          - doc: |-
              CodeCodecUnavailable fires when a codec entry exists but is unusable
              (e.g., blank import missing or build tag not active).
            name: CodeCodecUnavailable
            value: "0x01_02_00_02"
        type: v1errs.Code
      - const:
          - doc: |-
              CodeStreamingUnsupported fires when NewEncoder / NewDecoder is called on
              a codec that does not implement StreamingCodec.
            name: CodeStreamingUnsupported
            value: "0x01_02_00_03"
        type: v1errs.Code
      - const:
          - doc: |-
              CodePromoteFailed fires when the facade's JSON-bridge promotion path
              cannot serve the request (unknown Format with no promotion strategy,
              or a malformed container after the codec populated it).
            name: CodePromoteFailed
            value: "0x01_02_00_04"
        type: v1errs.Code
    constants:
      - name: JSON
        type: Format
        value: "\"json\""
      - name: NDJSON
        type: Format
        value: "\"ndjson\""
      - name: XML
        type: Format
        value: "\"xml\""
      - name: CSV
        type: Format
        value: "\"csv\""
      - name: Form
        type: Format
        value: "\"form\""
      - name: ASN1DER
        type: Format
        value: "\"asn1-der\""
      - name: PEM
        type: Format
        value: "\"pem\""
      - name: YAML
        type: Format
        value: "\"yaml\""
      - name: TOML
        type: Format
        value: "\"toml\""
      - name: CBOR
        type: Format
        value: "\"cbor\""
      - name: MsgPack
        type: Format
        value: "\"msgpack\""
      - name: TLV
        type: Format
        value: "\"tlv\""
      - name: FlatBuffers
        type: Format
        value: "\"flatbuffers\""
      - name: Base64
        type: Format
        value: "\"base64\""
      - name: Base64URL
        type: Format
        value: "\"base64url\""
      - name: Base32
        type: Format
        value: "\"base32\""
      - name: Base16
        type: Format
        value: "\"base16\""
      - name: Hex
        type: Format
        value: "\"hex\""
      - name: ASCII85
        type: Format
        value: "\"ascii85\""
      - name: Base45
        type: Format
        value: "\"base45\""
      - name: Base58
        type: Format
        value: "\"base58\""
      - name: Base62
        type: Format
        value: "\"base62\""
      - name: BSON
        type: Format
        value: "\"bson\""
      - name: Multipart
        type: Format
        value: "\"multipart\""
      - name: Gzip
        type: CompressAlgorithm
        value: "\"gzip\""
      - name: Flate
        type: CompressAlgorithm
        value: "\"flate\""
    facade:
      - alias:
          - doc: Format re-exports core/data/codec.Format so consumers only depend on pkg/v1.
            name: Format
            target: corecodec.Format
      - alias:
          - doc: Codec re-exports core/data/codec.Codec for consumers who want direct access.
            name: Codec
            target: corecodec.Codec
      - alias:
          - doc: Encoder re-exports core/data/codec.Encoder for streaming callers.
            name: Encoder
            target: corecodec.Encoder
      - alias:
          - doc: Decoder re-exports core/data/codec.Decoder for streaming callers.
            name: Decoder
            target: corecodec.Decoder
      - func:
          doc: Available returns the sorted list of registered formats.
          forward: corecodec.Available
          name: Available
          out:
            - type: "[]Format"
      - alias:
          - doc: |-
              CompressAlgorithm is the transform package's Algorithm, so consumers name a
              compressor without importing internal/*. Use the Gzip / Flate constants.
            name: CompressAlgorithm
            target: transform.Algorithm
      - alias:
          - doc: |-
              MultipartForm is the native Go shape of the [Multipart] format: a whole
              multipart/form-data body — its RFC 2046 boundary and its parts, in wire
              order. Marshal one to build an upload; Unmarshal into a *MultipartForm to
              read one. An empty Boundary asks Marshal to generate a delimiter; Unmarshal
              always fills it with the one it recovered, so a decode → encode round trip
              keeps the original delimiter — and reproduces the whole body byte for byte
              only for a body this codec encoded, since a part header other than the name,
              filename and media type is not carried through, and a filename is decoded to
              its last path element.
            name: MultipartForm
            target: multipart.Form
      - alias:
          - doc: |-
              MultipartPart is one section of a [MultipartForm]: a named field, optionally
              a filename and a media type, and the bytes themselves — a file upload is a
              part with FileName and ContentType set. Marshal also accepts a single
              MultipartPart or a []MultipartPart.

              Name is required. Name, FileName and ContentType are written into the part's
              header block, so a CR, an LF or a NUL in any of them is refused — never
              escaped — with the codec's VALUE_INVALID naming the field. A UTF-8 filename
              is written as-is (RFC 7578 §4.2).

              Decoding keeps only a filename's last path element, reading both '/' and '\'
              as separators on every operating system — RFC 7578 §4.2 has the receiver
              drop the directory information a sender may include, and the sender writes
              it with its own separator. `C:\Users\ada\cv.pdf` decodes to `cv.pdf` on
              Linux exactly as on Windows. Nothing else is removed, so a caller turning
              FileName into a path still validates it first.
            name: MultipartPart
            target: multipart.Part
      - func:
          doc: |-
            MultipartContentType returns the Content-Type header value —
            "multipart/form-data; boundary=…", quoted when the boundary needs it — for a
            body Marshal(Multipart, …) returned. Send it alongside the bytes: the
            boundary is announced in that header, and since the Codec contract has
            nowhere to hand one back, it is read off the body's first delimiter line. A
            body with no recoverable delimiter is refused with the codec's
            BOUNDARY_INVALID.

            A caller streaming through NewEncoder(Multipart, w) must set the header
            before the first byte instead: the Encoder returned has a Boundary() string
            method, and mime.FormatMediaType builds the same value from it.
          forward: multipart.ContentType
          in:
            - name: body
              type: "[]byte"
          name: MultipartContentType
          out:
            - name: value
              type: string
            - name: err
              type: error
    functions:
      - in:
          - name: f
            type: Format
          - name: v
            type: any
        name: Marshal
        out:
          - name: encoded
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: f
            type: Format
          - name: data
            type: "[]byte"
          - name: v
            type: any
        name: Unmarshal
        out:
          - type: error
      - in:
          - name: v
            type: any
          - name: formats
            type: Format
        name: MarshalMany
        out:
          - name: encodedByFormat
            type: map[Format][]byte
          - name: err
            type: error
        variadic: true
      - in:
          - name: f
            type: Format
          - name: w
            type: io.Writer
        name: NewEncoder
        out:
          - name: enc
            type: Encoder
          - name: err
            type: error
      - in:
          - name: f
            type: Format
          - name: r
            type: io.Reader
        name: NewDecoder
        out:
          - name: dec
            type: Decoder
          - name: err
            type: error
      - in:
          - name: mime
            type: string
        name: FromMIME
        out:
          - name: f
            type: Format
          - name: ok
            type: bool
      - in:
          - name: ext
            type: string
        name: FromExtension
        out:
          - name: f
            type: Format
          - name: ok
            type: bool
      - in:
          - name: f
            type: Format
          - name: algo
            type: CompressAlgorithm
          - name: v
            type: any
        name: MarshalCompressed
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: box
            type: "[]byte"
          - name: v
            type: any
        name: UnmarshalCompressed
        out:
          - type: error
    imports:
      corecodec: github.com/kitsunium/sdk/internal/core/data/codec
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      multipart: github.com/kitsunium/sdk/pkg/v1/data/codec/multipart
      transform: github.com/kitsunium/sdk/pkg/v1/data/transform
      v1errs: github.com/kitsunium/sdk/pkg/v1/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec
    sentinels:
      - var:
          - code: CodeUnknownFormat
            doc: |-
              UnknownFormat is returned when Marshal / Unmarshal / NewEncoder /
              NewDecoder receives a Format that no codec has registered.
            name: UnknownFormat
            private: "pkg/v1/data/codec: Lookup returned false for the requested Format"
            public: codec format is not registered
            reason: UNKNOWN_FORMAT
          - code: CodeCodecUnavailable
            doc: |-
              CodecUnavailable is returned when the registry entry exists but the
              codec itself cannot be used (reserved for future gating).
            name: CodecUnavailable
            private: "pkg/v1/data/codec: registered codec cannot serve the request"
            public: codec is registered but unavailable
            reason: CODEC_UNAVAILABLE
          - code: CodeStreamingUnsupported
            doc: |-
              StreamingUnsupported is returned when NewEncoder / NewDecoder is
              called on a codec that does not implement StreamingCodec.
            name: StreamingUnsupported
            private: "pkg/v1/data/codec: target codec is not a core/data/codec.StreamingCodec"
            public: codec does not support streaming
            reason: STREAMING_UNSUPPORTED
          - code: CodePromoteFailed
            doc: |-
              PromoteFailed is returned when the facade's JSON-bridge promotion
              cannot serve the request — either the Format has no promotion
              strategy registered, or the codec populated a container whose
              shape no longer matches what the wrap stage produced.
            name: PromoteFailed
            private: "pkg/v1/data/codec: JSON-bridge promotion path could not serve the request"
            public: codec promotion failed
            reason: PROMOTE_FAILED
  - facade:
      - alias:
          - doc: |-
              Kind is the JSON kind a value takes on the wire; its zero value is Any. It
              encodes as its lower-case name.
            name: Kind
            target: svcjsonshape.Kind
      - alias:
          - doc: Shape describes the values of one Go type on the wire.
            name: Shape
            target: svcjsonshape.ShapeValue
      - alias:
          - doc: Field is one member of an Object, and the Go field behind it.
            name: Field
            target: svcjsonshape.FieldValue
      - const:
          - doc: |-
              Any is a value whose kind the type does not decide: an interface, a
              json.RawMessage, a type that writes its own JSON.
            name: Any
            reexport: svcjsonshape.Any
            type: Kind
            typed: true
            value: "0"
      - const:
          - doc: "Object is a JSON object whose members are Shape.Fields: a struct."
            name: Object
            reexport: svcjsonshape.Object
            type: Kind
            typed: true
            value: "1"
      - const:
          - doc: Array is a JSON array whose elements are Shape.Items.
            name: Array
            reexport: svcjsonshape.Array
            type: Kind
            typed: true
            value: "2"
      - const:
          - doc: |-
              Map is a JSON object keyed by a Go map's keys, whose values are
              Shape.Values.
            name: Map
            reexport: svcjsonshape.Map
            type: Kind
            typed: true
            value: "3"
      - const:
          - doc: String is a JSON string.
            name: String
            reexport: svcjsonshape.String
            type: Kind
            typed: true
            value: "4"
      - const:
          - doc: |-
              Integer is a JSON number the type holds as an integer; Format names the Go
              kind.
            name: Integer
            reexport: svcjsonshape.Integer
            type: Kind
            typed: true
            value: "5"
      - const:
          - doc: Number is a JSON number the type holds as a float, or json.Number.
            name: Number
            reexport: svcjsonshape.Number
            type: Kind
            typed: true
            value: "6"
      - const:
          - doc: Boolean is true or false.
            name: Boolean
            reexport: svcjsonshape.Boolean
            type: Kind
            typed: true
            value: "7"
      - const:
          - doc: |-
              Unsupported is a type encoding/json refuses to encode; a value holding one
              is refused whole.
            name: Unsupported
            reexport: svcjsonshape.Unsupported
            type: Kind
            typed: true
            value: "8"
      - func:
          doc: |-
            Of describes the values of t on the wire. A nil t is Any. It never fails, and
            every call returns a new tree the caller may keep and change.
          forward: svcjsonshape.Of
          in:
            - name: t
              type: reflect.Type
          name: Of
          out:
            - type: "*Shape"
      - func:
          doc: "For describes the values of T on the wire: Of(reflect.TypeFor[T]())."
          forward: svcjsonshape.For[T]
          name: For
          out:
            - type: "*Shape"
          typeParams:
            - constraint: any
              name: T
    imports:
      svcjsonshape: github.com/kitsunium/sdk/internal/service/data/codec/jsonshape
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/jsonshape
