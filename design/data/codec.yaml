apiVersion: kit.kitsunium/design/v2
domain: data/codec
packages:
  - codes:
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies an init-time collision on the codec
              registry; two codecs tried to claim the same Name.
            name: CodeDuplicateRegistration
            note: "range: 0.2.2.0 - 0.2.2.255"
            value: "0x00_02_02_01"
        type: errs.Code
      - const:
          - doc: CodeEmptyInput identifies Unmarshal being called with a zero-byte slice.
            name: CodeEmptyInput
            value: "0x00_02_02_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeTargetInvalid identifies Unmarshal being called with a target that is
              not a non-nil pointer to a storable value.
            name: CodeTargetInvalid
            value: "0x00_02_02_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeValueInvalid identifies Marshal being called on a value the codec
              cannot serialise (channel, function, unsupported map key).
            name: CodeValueInvalid
            value: "0x00_02_02_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCodecNil identifies a Register call made with a nil Codec — a
              nil-argument programmer error distinct from a duplicate registration.
              Surfaced via panic at boot (see registry.go), mirroring writer.CodeWriterNil.
            name: CodeCodecNil
            value: "0x00_02_02_05"
        type: errs.Code
    doc: |-
      Package codec — declares the optional Appender extension that
      hot-path encoders (NDJSON, JSON, text) implement so callers can write into
      a caller-supplied buffer without paying for an intermediate allocation.

      Codecs that satisfy Codec but do NOT implement Appender remain valid; the
      logger and other consumers detect support with a runtime type assertion
      and fall back to Marshal + copy when the optional interface is absent.

      Package codec declares the domain contracts every format codec in the SDK
      implements. Consumers interact with codecs through the pkg/v1/data/codec facade;
      concrete implementations live in internal/service/data/codec/<format>/.

      This package is interface-only: no runtime state, no registrations, no
      format-specific knowledge. Codecs register themselves via the registry in
      registry.go when their service subpackage is imported.

      Package codec — range 0.2.2.* (ADR 0005 core/data/codec block).

      Package codec — declares the registry's boot-time sentinel. Its var name
      equals its errs.Define Reason in SCREAMING_SNAKE form.

      Package codec — declares the typed Format string and its helpers.
      The zero Format ("") is invalid — consumers obtain a Format via the
      pkg/v1/data/codec constants or via the FromMIME / FromExtension helpers.

      Package codec — holds the process-wide Codec registry.
      Service-level codec packages register themselves via package-level var
      initialisers when the package is imported.
    functions:
      - doc: |-
          Register inserts c into the registry and returns it so callers can bind
          the singleton to a typed package-level variable like
          `var Codec codec.Codec = codec.Register(&jsonCodec{})`. Panics on nil
          argument or duplicate Name / MIME / extension.

          IFACE-PLUGIN: the registry hands plug-in codec instances back to callers
          so each domain can keep its concrete codec type unexported; the only
          stable contract is the Codec interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: c
            type: Codec
        name: Register
        out:
          - type: Codec
      - doc: |-
          Lookup returns the codec registered under f.

          IFACE-PLUGIN: the registry stores plug-in codec instances behind the Codec
          interface — concrete types are intentionally unexported per-format.
        in:
          - name: f
            type: Format
        name: Lookup
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - doc: |-
          LookupMIME returns the codec whose MIME list matches. MIME parameters
          (e.g. "; charset=utf-8") are stripped before the index lookup so that
          "application/json; charset=utf-8" resolves like "application/json".

          IFACE-PLUGIN: the registry stores plug-in codec instances behind the Codec
          interface — concrete types are intentionally unexported per-format.
        in:
          - name: raw
            type: string
        name: LookupMIME
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - doc: |-
          LookupExt returns the codec whose extension list contains ext.

          IFACE-PLUGIN: the registry stores plug-in codec instances behind the Codec
          interface — concrete types are intentionally unexported per-format.
        in:
          - name: ext
            type: string
        name: LookupExt
        out:
          - name: c
            type: Codec
          - name: ok
            type: bool
      - doc: |-
          Available returns the sorted list of registered Formats, or nil before any
          Register.
        name: Available
        out:
          - type: "[]Format"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec
    ports:
      - doc: |-
          Appender is the optional extension implemented by codecs that can encode
          directly into a caller-supplied byte slice instead of allocating their own.
          Hot paths (logger record formatting, NDJSON streams, batch sinks) consume
          this interface to avoid the buffer-copy cost imposed by Marshal.

          Implementations MUST:
            - Append the encoded representation of v onto dst (typically via the
              standard append(dst, …) idiom).
            - Return the (possibly re-allocated) buffer back to the caller.
            - Be safe for concurrent use by multiple goroutines.

          The returned buffer's length grows by the number of bytes written; the
          underlying array MAY be a fresh allocation when dst's capacity is too
          small. Callers retain ownership of dst and SHOULD reuse it across calls.
        embeds:
          - Codec
        methods:
          - doc: |-
              Append encodes v and appends the bytes onto dst. The returned slice
              MUST contain the prior contents of dst followed by the encoded form.
            in:
              - name: dst
                type: "[]byte"
              - name: v
                type: any
            name: Append
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: Appender
      - doc: |-
          Codec is the minimum contract every format codec satisfies. Instances MUST
          be safe for concurrent use; format-specific options are supplied via the
          codec's constructor, not via the Codec interface.
        methods:
          - name: Name
            out:
              - type: string
          - name: MIMETypes
            out:
              - type: "[]string"
          - name: Extensions
            out:
              - type: "[]string"
          - in:
              - name: v
                type: any
            name: Marshal
            out:
              - name: data
                type: "[]byte"
              - name: err
                type: error
          - in:
              - name: data
                type: "[]byte"
              - name: v
                type: any
            name: Unmarshal
            out:
              - name: err
                type: error
        name: Codec
      - doc: |-
          StreamingCodec is the optional extension for formats that support
          incremental encode/decode over io.Writer / io.Reader. Codecs that CAN
          stream SHOULD implement it; consumers detect support with a type assertion.
        embeds:
          - Codec
        methods:
          - in:
              - name: w
                type: io.Writer
            name: NewEncoder
            out:
              - type: Encoder
          - in:
              - name: r
                type: io.Reader
            name: NewDecoder
            out:
              - type: Decoder
        name: StreamingCodec
      - doc: Encoder writes one or more values to the wrapped writer.
        methods:
          - in:
              - name: v
                type: any
            name: Encode
            out:
              - name: err
                type: error
          - name: Close
            out:
              - name: err
                type: error
        name: Encoder
      - doc: Decoder reads one or more values from the wrapped reader.
        methods:
          - in:
              - name: v
                type: any
            name: Decode
            out:
              - name: err
                type: error
          - name: More
            out:
              - name: ok
                type: bool
        name: Decoder
    sentinels:
      - var:
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the conflict Register refuses at boot: a distinct
              codec already holds the Format name, MIME type or extension a second one
              claims. It is never returned — Register panics with conflictText of it, so
              the panic carries the dotted-quad header AND the key that collided.
            name: DuplicateRegistration
            private: "core/data/codec.Register: a distinct codec already holds this Format name, MIME type or extension"
            public: A codec is already registered under that name, MIME type or extension
            reason: DUPLICATE_REGISTRATION
    types:
      - decl: true
        doc: Format is the typed string identifier of a codec.
        methods:
          - doc: Known reports whether f has been registered in the codec registry.
            name: Known
            out:
              - type: bool
            recv: value
          - doc: String implements fmt.Stringer and returns the raw identifier.
            name: String
            out:
              - type: string
            recv: value
        name: Format
        underlying: string
  - constants:
      - doc: |-
          Any is a value whose kind the type does not decide: an interface, a
          json.RawMessage, a type that writes its own JSON.
        name: Any
        type: Kind
        value: "0"
      - doc: "Object is a JSON object whose members are Fields: a struct."
        name: Object
        type: Kind
        value: "1"
      - doc: "Array is a JSON array whose elements are Items: a slice or an array."
        name: Array
        type: Kind
        value: "2"
      - doc: |-
          Map is a JSON object whose member names are keys and whose values are
          Values: a Go map.
        name: Map
        type: Kind
        value: "3"
      - doc: |-
          String is a JSON string: a string, a []byte in base64, a text
          marshaler, a time.Time.
        name: String
        type: Kind
        value: "4"
      - doc: Integer is a JSON number the type holds as an integer.
        name: Integer
        type: Kind
        value: "5"
      - doc: Number is a JSON number the type holds as a float, or json.Number.
        name: Number
        type: Kind
        value: "6"
      - doc: Boolean is true or false.
        name: Boolean
        type: Kind
        value: "7"
      - doc: |-
          Unsupported is a type encoding/json refuses to encode: a channel, a
          function, a complex number, an unsafe pointer, a map whose key it
          cannot write as a member name. A value holding one is refused whole.
        name: Unsupported
        type: Kind
        value: "8"
    doc: |-
      Package jsonshape — the members encoding/json writes for a struct, resolved
      by its own rules: json/v2's field walk under the v1 options Go 1.27's
      encoding/json runs with.

      Package jsonshape — which methods make encoding/json hand a type's encoding
      over to the type itself.

      Package jsonshape describes how values of a Go type look on the wire under
      encoding/json: which JSON kind each value takes, which members an object
      has and under which names, which may be missing and which may be null
      (ADR 0133).

      The description follows the encoding/json of the toolchain the SDK is built
      with — Go 1.27, whose encoding/json runs on the json/v2 engine with the v1
      options — and it is a description of ENCODING: encoding/json decodes any
      member as absent, so Optional says what an encoded value may omit, never
      what a decoder requires.

      Struct members are resolved as encoding/json resolves them: embedded
      structs promoted one level at a time, through a pointer, an unexported
      embedded struct's exported fields included; for one name, the shallowest
      field wins, a single tagged one breaks a tie at that depth, and a tie that
      remains writes neither — nor any deeper field of that name. A field keeps
      access to the Go field behind it: its struct tag, its Go name, and its index
      path for reflect.Value.FieldByIndex, so a framework can read its own tags
      beside encoding/json's.

      A type that writes its own JSON — json.Marshaler, or json/v2's MarshalerTo —
      is opaque: Any, whatever it writes. One that writes text — an
      encoding.TextMarshaler or TextAppender — is a String. A pointer receiver's
      method counts only where encoding/json calls it: on an addressable value.
      Of(T) describes a T encoded by value — json.Marshal(v) — whose root is not
      addressable, and neither are the fields and array elements under it; a
      pointer's and a slice's elements are, and a map's values never are. Describe
      *T for json.Marshal(&v).
      time.Time is described by what its method writes — a date-time string — and
      json.Number by what encoding/json writes for it — a number.

      Package jsonshape — a struct field's json tag, read with the grammar the
      json/v2 engine reads it with.

      Package jsonshape — the walk from a Go type to its shape.
    functions:
      - doc: |-
          Of describes the values of t on the wire. A nil t — the type of a nil
          interface — is Any. Of never fails: what encoding/json refuses is described
          as Unsupported where it occurs. Every call returns a new tree, which the
          caller may keep and change.
        in:
          - name: t
            type: reflect.Type
        name: Of
        out:
          - type: "*ShapeValue"
      - doc: "For describes the values of T on the wire: Of(reflect.TypeFor[T]())."
        name: For
        out:
          - type: "*ShapeValue"
        typeParams:
          - constraint: any
            name: T
    path: github.com/kitsunium/sdk/internal/service/data/codec/jsonshape
    types:
      - doc: Kind is the JSON kind a value takes on the wire. The zero Kind is Any.
        methods:
          - doc: "String returns the kind's lower-case name: \"object\", \"integer\", \"any\"."
            name: String
            out:
              - type: string
            recv: value
          - doc: MarshalText writes the kind's name, so a shape encodes as readable JSON.
            name: MarshalText
            out:
              - type: "[]byte"
              - type: error
            recv: value
        name: Kind
        underlying: uint8
      - doc: |-
          ShapeValue describes the values of one Go type on the wire: the JSON kind
          they take and, for a container, the shape of what it holds. It encodes as
          readable JSON; the Go-only parts of its fields are left out.
        name: ShapeValue
        struct:
          fields:
            - doc: Kind is the JSON kind the values take.
              name: Kind
              tag: json:"kind"
              type: Kind
            - doc: |-
                Name is the qualified Go type name — "time.Time",
                "example.com/shop.Order" — for a named type from a package, and empty
                otherwise.
              name: Name
              tag: json:"name,omitempty"
              type: string
            - doc: |-
                Format refines a kind: the Go kind of a number ("int64", "uint8",
                "float32"), "base64" for bytes written as a string, "date-time" for a
                time.Time, "duration-ns" for a time.Duration's integer nanoseconds.
              name: Format
              tag: json:"format,omitempty"
              type: string
            - doc: |-
                Nullable reports that a value of the type can be written as null: a
                nil pointer, slice, map or interface.
              name: Nullable
              tag: json:"nullable,omitempty"
              type: bool
            - doc: Fields are an Object's members, in the order encoding/json writes them.
              name: Fields
              tag: json:"fields,omitempty"
              type: "[]FieldValue"
            - doc: Items is an Array's element shape.
              name: Items
              tag: json:"items,omitempty"
              type: "*ShapeValue"
            - doc: |-
                Values is a Map's value shape — and, on an Object, the shape of the
                members an embedded map adds beyond Fields (json/v2's embed option).
              name: Values
              tag: json:"values,omitempty"
              type: "*ShapeValue"
            - doc: |-
                Ref is set, to Name, on the shape of a type already being described
                further up: the description stops there instead of recursing. A
                recursive type is always a named one, so Ref names an ancestor.
              name: Ref
              tag: json:"ref,omitempty"
              type: string
      - doc: |-
          FieldValue is one member of an Object: its wire name and shape, what the
          encoder may do with it, and the Go field it is written from — which a
          framework reads its own tags from.
        name: FieldValue
        struct:
          fields:
            - doc: Name is the member name on the wire.
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                Shape describes the member's value. When Quoted, the value travels
                inside a JSON string.
              name: Shape
              tag: json:"shape"
              type: "*ShapeValue"
            - doc: |-
                Optional reports that an encoded object may lack the member: its tag
                says omitempty on a kind that can be empty, or omitzero, or the field
                is promoted through an embedded pointer that may be nil.
              name: Optional
              tag: json:"optional,omitempty"
              type: bool
            - doc: |-
                Quoted reports the ",string" option taking effect: the value is written
                as a JSON string holding its own encoding — "42" for 42.
              name: Quoted
              tag: json:"quoted,omitempty"
              type: bool
            - doc: Rules is the field's validate tag as written, for a reader to show.
              name: Rules
              tag: json:"rules,omitempty"
              type: string
            - doc: GoName is the Go field's name.
              name: GoName
              tag: json:"-"
              type: string
            - doc: |-
                Tag is the Go field's whole struct tag, so a framework can read tags of
                its own — where a request field is read from — beside encoding/json's.
              name: Tag
              tag: json:"-"
              type: reflect.StructTag
            - doc: |-
                Index is the path to the Go field from the described struct, through
                every embedding, for reflect.Type.FieldByIndex and
                reflect.Value.FieldByIndex.
              name: Index
              tag: json:"-"
              type: "[]int"
  - codes:
      - const:
          - doc: CodeUnknownFormat fires when a Format is not registered in the registry.
            name: CodeUnknownFormat
            note: "range: 1.2.0.0 - 1.2.0.255"
            value: "0x01_02_00_01"
        type: v1errs.Code
      - const:
          - doc: |-
              CodeCodecUnavailable fires when a codec entry exists but is unusable
              (e.g., blank import missing or build tag not active).
            name: CodeCodecUnavailable
            value: "0x01_02_00_02"
        type: v1errs.Code
      - const:
          - doc: |-
              CodeStreamingUnsupported fires when NewEncoder / NewDecoder is called on
              a codec that does not implement StreamingCodec.
            name: CodeStreamingUnsupported
            value: "0x01_02_00_03"
        type: v1errs.Code
      - const:
          - doc: |-
              CodePromoteFailed fires when the facade's JSON-bridge promotion path
              cannot serve the request (unknown Format with no promotion strategy,
              or a malformed container after the codec populated it).
            name: CodePromoteFailed
            value: "0x01_02_00_04"
        type: v1errs.Code
