    doc: |-
      Package codec is the universal encoder/decoder dispatch facade.

      One verb, twenty-four formats. [Marshal] and [Unmarshal] reach every
      encoding the SDK ships — JSON, YAML, CBOR, MessagePack, BSON, NDJSON,
      XML, TOML, CSV, urlencoded forms, multipart/form-data, ASN.1 DER, PEM,
      TLV, FlatBuffers,
      plus the nine base-N variants (base64, base64url, base32, base16,
      base45, base58, base62, hex, ascii85). Format-swap at runtime is a
      single string change.

      # Goals

        - One verb, many formats. codec.Marshal(f, v) reaches every
          registered wire format — your call site doesn't change when
          you swap JSON for CBOR.
        - Stable Format strings. Once registered, a Format string is
          frozen across minor versions. Code that compiles today keeps
          compiling.
        - Streaming when it pays. Codecs that implement StreamingCodec
          get NewEncoder / NewDecoder automatically — no need to buffer
          megabytes.
        - Zero registration code. Blank-import the package; the 16
          codecs register themselves as Go initialises them. No Register()
          calls in consumer code. A program that needs one format imports
          that format's package beneath this one instead, and links it alone.
        - Append for hot paths. Codecs implementing Appender let you
          reuse a []byte buffer across calls — handy in tight loops.
        - Broadcast marshal. MarshalMany(v, formats...) serialises the
          same value to N formats at once — content negotiation, replication,
          multi-protocol message buses.

      # What's shipped — all 24 formats

      Single blank import (`import _ "github.com/kitsunium/sdk/pkg/v1/data/codec"`)
      activates the entire list. The Streaming column marks codecs that
      implement core/data/codec.StreamingCodec and unlock NewEncoder /
      NewDecoder. Every codec implements core/data/codec.Appender.

      	| Format       | Go constant       | MIME                       | Extension           | Streaming | Best for |
      	|--------------|-------------------|----------------------------|---------------------|:---------:|----------|
      	| json         | codec.JSON        | application/json           | .json               | yes       | API responses, public configs |
      	| ndjson       | codec.NDJSON      | application/x-ndjson       | .ndjson / .jsonl    | —         | streaming logs, line-oriented batches |
      	| xml          | codec.XML         | application/xml            | .xml                | yes       | legacy integrations |
      	| csv          | codec.CSV         | text/csv                   | .csv                | —         | tabular exports |
      	| form         | codec.Form        | application/x-www-form-urlencoded | .form / .urlencoded | —  | HTML form bodies, query strings |
      	| asn1-der     | codec.ASN1DER     | application/pkix-cert      | .der / .cer         | —         | crypto / X.509 artefacts |
      	| pem          | codec.PEM         | application/x-pem-file     | .pem / .crt / .key  | —         | block-wrapped DER (certs, keys) |
      	| yaml         | codec.YAML        | application/yaml           | .yaml / .yml        | yes       | human-edited configs |
      	| toml         | codec.TOML        | application/toml           | .toml               | yes       | app configs (strict typing) |
      	| cbor         | codec.CBOR        | application/cbor           | .cbor               | yes       | IoT / mobile (RFC 8949) |
      	| msgpack      | codec.MsgPack     | application/msgpack        | .msgpack / .mpk     | yes       | RPC payloads |
      	| bson         | codec.BSON        | application/bson           | .bson               | —         | MongoDB documents (top level must be a document) |
      	| multipart    | codec.Multipart   | multipart/form-data        | —                   | yes       | uploads / form posts (native shape codec.MultipartForm) |
      	| tlv          | codec.TLV         | application/x-tlv          | .tlv                | yes       | custom binary streams, self-describing |
      	| flatbuffers  | codec.FlatBuffers | application/x-flatbuffers  | .fbs / .bin         | —         | zero-copy passthrough |
      	| base64       | codec.Base64      | application/base64         | .b64 / .base64      | yes       | text-safe wrap (JSON → base-N) |
      	| base64url    | codec.Base64URL   | application/base64url      | .b64url             | yes       | URL-safe base64 |
      	| base32       | codec.Base32      | application/base32         | .b32                | yes       | larger alphabet for human-typed tokens |
      	| base16       | codec.Base16      | application/base16         | .b16                | yes       | hex-like text (uppercase) |
      	| base45       | codec.Base45      | application/base45         | .b45                | yes       | QR-code alphanumeric payloads (RFC 9285) |
      	| base58       | codec.Base58      | application/base58         | .b58                | yes       | Bitcoin-style short IDs (4 KiB input cap) |
      	| base62       | codec.Base62      | application/base62         | .b62                | yes       | alphanumeric short IDs (4 KiB input cap) |
      	| hex          | codec.Hex         | application/hex            | .hex                | yes       | classic hex pair encoding (lowercase) |
      	| ascii85      | codec.ASCII85     | application/ascii85        | .a85                | yes       | 4-byte to 5-char text packing |

      Runtime introspection: codec.Available() returns the live registry
      list, codec.FromMIME and codec.FromExtension resolve from external
      metadata.

      # Quick start

      	package main

      	import (
      	    "fmt"

      	    "github.com/kitsunium/sdk/pkg/v1/data/codec"
      	)

      	type User struct {
      	    Name string `json:"name" cbor:"name" yaml:"name"`
      	    Age  int    `json:"age"  cbor:"age"  yaml:"age"`
      	}

      	func main() {
      	    u := User{Name: "Ada", Age: 36}
      	    for _, f := range []codec.Format{codec.JSON, codec.CBOR, codec.YAML, codec.MsgPack, codec.Base64} {
      	        data, _ := codec.Marshal(f, u)
      	        var back User
      	        _ = codec.Unmarshal(f, data, &back)
      	        fmt.Printf("%-10s %d bytes  → %#v\n", f, len(data), back)
      	    }
      	}

      # Activation

      A single blank import activates the full registry:

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec"

      The package is the aggregate of the sixteen per-format packages beneath it
      — asn1, baseenc, bson, cbor, csv, flatbuffers, form, json, msgpack,
      multipart, ndjson, pem, tlv, toml, xml and yaml — and blank-imports each.
      Every one of them imports its codec, which registers itself in the registry
      as Go initialises it, once however many packages import it. Consumers never
      call a Register() function — registration is a side-effect. Importing one
      of those packages instead registers its format alone, links nothing of the
      others, and names that format's error codes (ADR 0134).

      # Extension interfaces

      A registered codec MAY implement one or both of these optional
      interfaces (assert at the call site):

      	// Append into a caller-supplied buffer — drops the fresh-slice
      	// allocation Marshal returns (see BENCH.md for per-codec numbers;
      	// the remaining allocs are the encoder's, not the facade's).
      	type Appender interface {
      	    Append(dst []byte, v any) ([]byte, error)
      	}

      	// Streaming — open Encoder/Decoder around an io.Writer/io.Reader.
      	type StreamingCodec interface {
      	    NewEncoder(w io.Writer) Encoder
      	    NewDecoder(r io.Reader) Decoder
      	}

      [StreamingUnsupported] is returned from [NewEncoder] / [NewDecoder]
      when the resolved codec does not satisfy StreamingCodec.

      # Errors

      Dispatch failures carry typed dotted-quad codes under range 1.2.0.*:

        - 1.2.0.1 — [CodeUnknownFormat]: Available() does not list the requested Format.
        - 1.2.0.2 — [CodeCodecUnavailable]: reserved for future build-tag gating.
        - 1.2.0.3 — [CodeStreamingUnsupported]: NewEncoder / NewDecoder called on a non-streaming codec.

      Per-codec failures carry the codec's own range (0.3.* for service
      codecs), which each per-format package names — cbor.CodeUnmarshalFailed,
      yaml.CodeAnchorRefused. Inspect with the accessors in
      github.com/kitsunium/sdk/pkg/v1/errs:

      	if errs.HasCode(err, codec.CodeUnknownFormat) { … }
      	if errs.HasReason(err, "UNKNOWN_FORMAT")       { … }

      Package codec — range 1.2.0.* (ADR 0005 pkg/v1/data/codec block).

      Package codec — compressed-frame verbs (ADR 0014 D1). MarshalCompressed and
      UnmarshalCompressed wrap the universal codec dispatch in a self-describing,
      version-tagged compression frame, so any value can be compressed in any
      registered Format without a parallel API. Compression is a parallel transform
      registry, never a codec Format (ADR 0014 §Why-not), so the algorithm is named
      separately from the wire Format.

      Package codec — declares the sentinel *errs.Error values the
      facade emits when dispatch fails.

      Package codec — the multipart/form-data value types, and the one helper a
      consumer needs to send what Marshal(Multipart, …) returns. The format is a
      container whose delimiter lives in the Content-Type header, which the Codec
      contract cannot carry, so the facade publishes the two shapes the codec
      speaks natively and the function that recovers that header from the body —
      the multipart package's own Form, Part and ContentType, under the names this
      package has always given them.

      Package codec — JSON-bridge promotion path for codecs whose runtime
      preconditions reject the public Marshal(F, any) / Unmarshal(F, *,
      any) contract. Six of the twenty-four registered codecs constrain
      their input shape: csv expects [][]string, ndjson expects []T, pem
      expects *pem.Block, flatbuffers expects []byte or BytesProvider,
      form expects url.Values, tlv's decoder cannot project composites
      into typed targets. Without promotion the facade's "format-swap is
      a single string change" promise is a lie for 6/24. Promotion
      intercepts the VALUE_INVALID / FLATBUFFERS_BAD_* / UNMARSHAL_FAILED
      responses, encodes the value to JSON, wraps the bytes in a
      codec-specific container the codec will accept, and reverses the
      pipeline on Unmarshal. The fast (native-shape) path is untouched so
      existing callers see zero overhead. See
      TestUniversalRoundtripAllCodecs for the contract pin.
    facade:
      - alias:
          - doc: Format re-exports core/data/codec.Format so consumers only depend on pkg/v1.
            name: Format
            target: corecodec.Format
      - alias:
          - doc: Codec re-exports core/data/codec.Codec for consumers who want direct access.
            name: Codec
            target: corecodec.Codec
      - alias:
          - doc: Encoder re-exports core/data/codec.Encoder for streaming callers.
            name: Encoder
            target: corecodec.Encoder
      - alias:
          - doc: Decoder re-exports core/data/codec.Decoder for streaming callers.
            name: Decoder
            target: corecodec.Decoder
      - func:
          doc: Available returns the sorted list of registered formats.
          forward: corecodec.Available
          name: Available
          out:
            - type: "[]Format"
      - alias:
          - doc: |-
              CompressAlgorithm is the transform package's Algorithm, so consumers name a
              compressor without importing internal/*. Use the Gzip / Flate constants.
            name: CompressAlgorithm
            target: transform.Algorithm
      - alias:
          - doc: |-
              MultipartForm is the native Go shape of the [Multipart] format: a whole
              multipart/form-data body — its RFC 2046 boundary and its parts, in wire
              order. Marshal one to build an upload; Unmarshal into a *MultipartForm to
              read one. An empty Boundary asks Marshal to generate a delimiter; Unmarshal
              always fills it with the one it recovered, so a decode → encode round trip
              keeps the original delimiter — and reproduces the whole body byte for byte
              only for a body this codec encoded, since a part header other than the name,
              filename and media type is not carried through, and a filename is decoded to
              its last path element.
            name: MultipartForm
            target: multipart.Form
      - alias:
          - doc: |-
              MultipartPart is one section of a [MultipartForm]: a named field, optionally
              a filename and a media type, and the bytes themselves — a file upload is a
              part with FileName and ContentType set. Marshal also accepts a single
              MultipartPart or a []MultipartPart.

              Name is required. Name, FileName and ContentType are written into the part's
              header block, so a CR, an LF or a NUL in any of them is refused — never
              escaped — with the codec's VALUE_INVALID naming the field. A UTF-8 filename
              is written as-is (RFC 7578 §4.2).

              Decoding keeps only a filename's last path element, reading both '/' and '\'
              as separators on every operating system — RFC 7578 §4.2 has the receiver
              drop the directory information a sender may include, and the sender writes
              it with its own separator. `C:\Users\ada\cv.pdf` decodes to `cv.pdf` on
              Linux exactly as on Windows. Nothing else is removed, so a caller turning
              FileName into a path still validates it first.
            name: MultipartPart
            target: multipart.Part
      - func:
          doc: |-
            MultipartContentType returns the Content-Type header value —
            "multipart/form-data; boundary=…", quoted when the boundary needs it — for a
            body Marshal(Multipart, …) returned. Send it alongside the bytes: the
            boundary is announced in that header, and since the Codec contract has
            nowhere to hand one back, it is read off the body's first delimiter line. A
            body with no recoverable delimiter is refused with the codec's
            BOUNDARY_INVALID.

            A caller streaming through NewEncoder(Multipart, w) must set the header
            before the first byte instead: the Encoder returned has a Boundary() string
            method, and mime.FormatMediaType builds the same value from it.
          forward: multipart.ContentType
          in:
            - name: body
              type: "[]byte"
          name: MultipartContentType
          out:
            - name: value
              type: string
            - name: err
              type: error
    functions:
      - doc: |-
          Marshal serialises v using the codec registered under f. The codec's
          native input shape is tried first (fast path, zero overhead); if the
          codec rejects v as the wrong shape (csv requires [][]string, pem
          requires *pem.Block, etc.) the facade promotes v via json-encode +
          codec-specific wrap so every Format accepts any Go value — see
          promote.go for the per-format strategies and the uniform-contract
          rationale.
        in:
          - name: f
            type: Format
          - name: v
            type: any
        name: Marshal
        out:
          - name: encoded
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Unmarshal parses data into v using the codec registered under f. As
          with Marshal, the codec's native target shape is tried first; on
          shape mismatch the facade promotes via JSON-bridge so every Format
          can decode into any Go target.
        in:
          - name: f
            type: Format
          - name: data
            type: "[]byte"
          - name: v
            type: any
        name: Unmarshal
        out:
          - type: error
      - doc: |-
          MarshalMany serialises v into every format in formats and returns a
          map keyed by Format with the encoded bytes. The same logical value
          goes out in N different wire encodings — handy for HTTP content
          negotiation, multi-protocol message buses, archival doubling, or
          cross-region replication where each region speaks a different
          codec.

          Per-format errors are joined under [errors.Join] and returned as a
          single error; partial results stay in the returned map so callers
          can decide whether to ship the formats that succeeded or fail the
          whole batch. An unknown Format in the list surfaces
          [UnknownFormat] / [CodeUnknownFormat] inside that joined error
          (and leaves no entry in the map for that Format).

          Calling with formats == nil (or empty) returns an empty map and no
          error — the no-op semantics mirror calling Marshal zero times.

          	out, err := codec.MarshalMany(payload, codec.JSON, codec.CBOR, codec.MsgPack)
          	// out[codec.JSON], out[codec.CBOR], out[codec.MsgPack] all populated
          	// when err == nil.
        in:
          - name: v
            type: any
          - name: formats
            type: Format
        name: MarshalMany
        out:
          - name: encodedByFormat
            type: map[Format][]byte
          - name: err
            type: error
        variadic: true
      - doc: NewEncoder returns a streaming encoder for the codec registered under f.
        in:
          - name: f
            type: Format
          - name: w
            type: io.Writer
        name: NewEncoder
        out:
          - name: enc
            type: Encoder
          - name: err
            type: error
      - doc: NewDecoder returns a streaming decoder for the codec registered under f.
        in:
          - name: f
            type: Format
          - name: r
            type: io.Reader
        name: NewDecoder
        out:
          - name: dec
            type: Decoder
          - name: err
            type: error
      - doc: FromMIME resolves a MIME string to its registered Format.
        in:
          - name: mime
            type: string
        name: FromMIME
        out:
          - name: f
            type: Format
          - name: ok
            type: bool
      - doc: FromExtension resolves a file extension to its registered Format.
        in:
          - name: ext
            type: string
        name: FromExtension
        out:
          - name: f
            type: Format
          - name: ok
            type: bool
      - doc: |-
          MarshalCompressed serialises v with the codec registered under f, compresses
          the result with the transform registered under algo, and wraps both in a
          self-describing frame so UnmarshalCompressed needs no Format or Algorithm
          argument. It returns UnknownCompressor when algo has no frame id or no
          registered body, CompressedFrameInvalid when f exceeds the addressable length,
          and forwards any codec / compressor error untouched (origin wins).
        in:
          - name: f
            type: Format
          - name: algo
            type: CompressAlgorithm
          - name: v
            type: any
        name: MarshalCompressed
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          UnmarshalCompressed parses a frame produced by MarshalCompressed, decompresses
          the payload under a bomb guard, and decodes it into v using the inner Format
          the frame records. A malformed frame, an unknown algorithm id, or a payload
          that decompresses past the bomb guard returns CompressedFrameInvalid; codec
          and compressor faults are forwarded untouched.
        in:
          - name: box
            type: "[]byte"
          - name: v
            type: any
        name: UnmarshalCompressed
        out:
          - type: error
    imports:
      corecodec: github.com/kitsunium/sdk/internal/core/data/codec
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      multipart: github.com/kitsunium/sdk/pkg/v1/data/codec/multipart
      transform: github.com/kitsunium/sdk/pkg/v1/data/transform
      v1errs: github.com/kitsunium/sdk/pkg/v1/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec
    sentinels:
      - var:
          - code: CodeUnknownFormat
            doc: |-
              UnknownFormat is returned when Marshal / Unmarshal / NewEncoder /
              NewDecoder receives a Format that no codec has registered.
            name: UnknownFormat
            private: "pkg/v1/data/codec: Lookup returned false for the requested Format"
            public: codec format is not registered
            reason: UNKNOWN_FORMAT
          - code: CodeCodecUnavailable
            doc: |-
              CodecUnavailable is returned when the registry entry exists but the
              codec itself cannot be used (reserved for future gating).
            name: CodecUnavailable
            private: "pkg/v1/data/codec: registered codec cannot serve the request"
            public: codec is registered but unavailable
            reason: CODEC_UNAVAILABLE
          - code: CodeStreamingUnsupported
            doc: |-
              StreamingUnsupported is returned when NewEncoder / NewDecoder is
              called on a codec that does not implement StreamingCodec.
            name: StreamingUnsupported
            private: "pkg/v1/data/codec: target codec is not a core/data/codec.StreamingCodec"
            public: codec does not support streaming
            reason: STREAMING_UNSUPPORTED
          - code: CodePromoteFailed
            doc: |-
              PromoteFailed is returned when the facade's JSON-bridge promotion
              cannot serve the request — either the Format has no promotion
              strategy registered, or the codec populated a container whose
              shape no longer matches what the wrap stage produced.
            name: PromoteFailed
            private: "pkg/v1/data/codec: JSON-bridge promotion path could not serve the request"
            public: codec promotion failed
            reason: PROMOTE_FAILED
  - doc: |-
      Package jsonshape describes how values of a Go type look on the wire under
      encoding/json — the JSON kind each value takes, the members an object has
      and under which names, which may be missing and which may be null — for a
      reader to show: an API's documentation, a developer console, a schema
      generator (ADR 0133).

      # The whole thing

      	shape := jsonshape.For[Order]()
      	for _, field := range shape.Fields {
      		fmt.Println(field.Name, field.Shape.Kind, field.Optional)
      	}

      # What it follows

      The description follows the encoding/json of the toolchain the SDK is built
      with — Go 1.27, whose encoding/json runs on the json/v2 engine with the v1
      options — and describes ENCODING: encoding/json decodes any member as
      absent, so [Field].Optional says what an encoded value may omit, never what
      a decoder requires.

      Struct members are resolved exactly as encoding/json resolves them:
      embedded structs promoted one level at a time, through a pointer, an
      unexported embedded struct's exported fields included; for one name, the
      shallowest field wins, a single tagged one breaks a tie at that depth, and a
      tie that remains writes neither — nor any deeper field of that name. A
      field promoted through an embedded pointer is Optional, since a nil one
      drops it. Tag names are read as the engine reads them, and json/v2's embed
      option is honoured: a named struct field carrying it is promoted, and an
      embedded map takes the members no field names ([Shape].Values on an
      Object).

      # What a type decides for itself

      A type that writes its own JSON — json.Marshaler, or json/v2's MarshalerTo
      — is opaque: [Any], whatever it writes. One that writes text — an
      encoding.TextMarshaler or TextAppender — is a [String]. A struct that
      embeds time.Time gains its MarshalJSON and is opaque too.

      A method with a POINTER receiver counts only where encoding/json calls it:
      on an addressable value. [Of](T) describes a T encoded by value —
      json.Marshal(v) — whose root is not addressable, and neither are the fields
      and array elements under it; a pointer's and a slice's elements are, and a
      map's values never are. For json.Marshal(&v), describe *T.

      Three types are described by what is written rather than by their kind:
      time.Time is a String with Format "date-time", time.Duration an Integer
      with Format "duration-ns", json.Number a Number.

      A nil pointer, slice, map or interface is written as null, so their shapes
      are Nullable; an array never is. A []byte is a base64 String; a byte ARRAY
      is an Array of integers. A map whose key encoding/json cannot write as a
      member name — a bool, a struct — is [Unsupported], as are channels,
      functions and complex numbers: encoding/json refuses the whole value.

      # Recursion

      A type that reaches itself is described once; further down, its shape is a
      reference ([Shape].Ref, the type's qualified name) with no members. A type
      used twice side by side is described twice.

      # The Go field behind each member

      [Field].Tag, [Field].GoName and [Field].Index give access to the Go field a
      member is written from, promoted fields included: a framework can read its
      own tags — where a request field is read from, whether it is secret —
      beside encoding/json's, and reach the value with reflect.Value.FieldByIndex.
      A field encoding/json never writes (json:"-", unexported) has no member; a
      framework that needs it finds it with reflect.VisibleFields and matches the
      two by index path.
    facade:
      - alias:
          - doc: |-
              Kind is the JSON kind a value takes on the wire; its zero value is Any. It
              encodes as its lower-case name.
            name: Kind
            target: svcjsonshape.Kind
      - alias:
          - doc: Shape describes the values of one Go type on the wire.
            name: Shape
            target: svcjsonshape.ShapeValue
      - alias:
          - doc: Field is one member of an Object, and the Go field behind it.
            name: Field
            target: svcjsonshape.FieldValue
      - const:
          - doc: |-
              Any is a value whose kind the type does not decide: an interface, a
              json.RawMessage, a type that writes its own JSON.
            name: Any
            reexport: svcjsonshape.Any
            type: Kind
            typed: true
            value: "0"
      - const:
          - doc: "Object is a JSON object whose members are Shape.Fields: a struct."
            name: Object
            reexport: svcjsonshape.Object
            type: Kind
            typed: true
            value: "1"
      - const:
          - doc: Array is a JSON array whose elements are Shape.Items.
            name: Array
            reexport: svcjsonshape.Array
            type: Kind
            typed: true
            value: "2"
      - const:
          - doc: |-
              Map is a JSON object keyed by a Go map's keys, whose values are
              Shape.Values.
            name: Map
            reexport: svcjsonshape.Map
            type: Kind
            typed: true
            value: "3"
      - const:
          - doc: String is a JSON string.
            name: String
            reexport: svcjsonshape.String
            type: Kind
            typed: true
            value: "4"
      - const:
          - doc: |-
              Integer is a JSON number the type holds as an integer; Format names the Go
              kind.
            name: Integer
            reexport: svcjsonshape.Integer
            type: Kind
            typed: true
            value: "5"
      - const:
          - doc: Number is a JSON number the type holds as a float, or json.Number.
            name: Number
            reexport: svcjsonshape.Number
            type: Kind
            typed: true
            value: "6"
      - const:
          - doc: Boolean is true or false.
            name: Boolean
            reexport: svcjsonshape.Boolean
            type: Kind
            typed: true
            value: "7"
      - const:
          - doc: |-
              Unsupported is a type encoding/json refuses to encode; a value holding one
              is refused whole.
            name: Unsupported
            reexport: svcjsonshape.Unsupported
            type: Kind
            typed: true
            value: "8"
      - func:
          doc: |-
            Of describes the values of t on the wire. A nil t is Any. It never fails, and
            every call returns a new tree the caller may keep and change.
          forward: svcjsonshape.Of
          in:
            - name: t
              type: reflect.Type
          name: Of
          out:
            - type: "*Shape"
      - func:
          doc: "For describes the values of T on the wire: Of(reflect.TypeFor[T]())."
          forward: svcjsonshape.For[T]
          name: For
          out:
            - type: "*Shape"
          typeParams:
            - constraint: any
              name: T
    imports:
      svcjsonshape: github.com/kitsunium/sdk/internal/service/data/codec/jsonshape
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/jsonshape
