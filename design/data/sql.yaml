apiVersion: kit.kitsunium/design/v2
domain: data/sql
packages:
  - codes:
      - const:
          - doc: CodeUnknownDialect identifies a dialect name this SDK has never heard of.
            name: CodeUnknownDialect
            note: "range: 0.2.24.0 - 0.2.24.255"
            value: "0x00_02_18_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDialectRefused identifies a dialect this SDK RECOGNISES and declines,
              because its savepoint grammar is a different algorithm rather than a
              different string. The reason travels in a field.
            name: CodeDialectRefused
            value: "0x00_02_18_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeNestedIsolation identifies a nested Transact that asked for an
              isolation level or read-only-ness a savepoint cannot provide.
            name: CodeNestedIsolation
            value: "0x00_02_18_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidMigration identifies a migration that could never run: version
              zero, an empty name, a nil Up, or a nil Down.
            name: CodeInvalidMigration
            value: "0x00_02_18_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationIrreversible identifies a Down refused because the caller
              declared the migration irreversible with the Irreversible step.
            name: CodeMigrationIrreversible
            value: "0x00_02_18_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigInvalid identifies a constructor refused because the Config could
              never produce a working port: a nil *sql.DB or an unusable Dialect.
            name: CodeConfigInvalid
            note: |-
              range: 0.3.54.0 - 0.3.54.255 — the run outcomes of the transaction manager,
              the health probe and the migration runner, allocated by the service layer
              (LL = 3) and declared here since ADR 0160: a code keeps the value its layer
              allocated when its declaration moves.
            value: "0x00_03_36_01"
        type: errs.Code
      - const:
          - doc: |-
              CodePoolMisconfigured identifies a pool policy the SDK refuses to apply
              because the value database/sql would read is not the one the caller meant.
            name: CodePoolMisconfigured
            value: "0x00_03_36_02"
        type: errs.Code
      - const:
          - doc: CodeBeginFailed identifies a transaction the driver would not open.
            name: CodeBeginFailed
            value: "0x00_03_36_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCommitFailed identifies a transaction whose COMMIT was rejected. The
              unit of work did NOT take effect.
            name: CodeCommitFailed
            value: "0x00_03_36_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeRollbackFailed identifies a ROLLBACK the driver refused. It travels
              alongside the error that triggered the rollback, never instead of it.
            name: CodeRollbackFailed
            value: "0x00_03_36_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeSavepointFailed identifies a SAVEPOINT, RELEASE SAVEPOINT or ROLLBACK
              TO SAVEPOINT statement the engine rejected.
            name: CodeSavepointFailed
            value: "0x00_03_36_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeTxPoisoned identifies an operation refused because the transaction can
              no longer be trusted: its savepoint rollback failed, so the engine's state
              is unknown and nothing more may be committed on it.
            name: CodeTxPoisoned
            value: "0x00_03_36_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeTxClosed identifies an Executor used after the scope that lent it
              returned.
            name: CodeTxClosed
            value: "0x00_03_36_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeHealthCheckFailed identifies a liveness probe the database answered
              with an error.
            name: CodeHealthCheckFailed
            value: "0x00_03_36_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeHealthCheckTimeout identifies a liveness probe that did not answer
              within its budget.
            name: CodeHealthCheckTimeout
            value: "0x00_03_36_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationFailed identifies a migration step, or its version-table
              bookkeeping, that failed. The transaction was rolled back.
            name: CodeMigrationFailed
            value: "0x00_03_36_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationOutOfOrder identifies a pending migration whose version is
              lower than one already applied — the two-branches-merged hazard.
            name: CodeMigrationOutOfOrder
            value: "0x00_03_36_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationLockUnsupported identifies a Migrator refused at construction
              because the dialect offers no lock that dies with its holder. No dialect the
              SDK speaks answers it since ADR 0140.
            name: CodeMigrationLockUnsupported
            value: "0x00_03_36_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationLockTimeout identifies a migration run abandoned because
              another holder kept the lock for the whole budget.
            name: CodeMigrationLockTimeout
            value: "0x00_03_36_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationUnknownVersion identifies a version recorded in the database
              that this binary carries no migration for — so it cannot be reversed.
            name: CodeMigrationUnknownVersion
            value: "0x00_03_36_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionTableInvalid identifies a version-table name that cannot be
              interpolated into SQL safely. Identifiers cannot be bound as parameters.
            name: CodeVersionTableInvalid
            value: "0x00_03_36_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateMigration identifies two migrations declaring the same
              version.
            name: CodeDuplicateMigration
            value: "0x00_03_36_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationChanged identifies an applied migration whose declared
              checksum is not the one its version row recorded: its statements were
              edited after they ran.
            name: CodeMigrationChanged
            value: "0x00_03_36_12"
        type: errs.Code
      - const:
          - doc: |-
              CodeTxRetriesExhausted identifies a retrying transactor that ran a
              transaction as many times as it may, each attempt failing on an error its
              Transient called transient.
            name: CodeTxRetriesExhausted
            value: "0x00_03_36_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeStatementTimedOut identifies a statement cut by the transactor's
              statement budget.
            name: CodeStatementTimedOut
            value: "0x00_03_36_14"
        type: errs.Code
    constants:
      - doc: DialectUnknown is the unusable zero value.
        name: DialectUnknown
        type: Dialect
        value: "0"
      - doc: |-
          DialectPostgres is PostgreSQL 9.1+ (and wire-compatible engines that
          implement pg_advisory_lock, e.g. CockroachDB advertises the function
          but the caller must verify it is a real lock before claiming this).
        name: DialectPostgres
        type: Dialect
        value: "1"
      - doc: DialectMySQL is MySQL 5.7+ / MariaDB 10.x with InnoDB.
        name: DialectMySQL
        type: Dialect
        value: "2"
      - doc: DialectSQLite is SQLite 3.6.8+.
        name: DialectSQLite
        type: Dialect
        value: "3"
      - doc: StatementExec is a statement that returns no rows.
        name: StatementExec
        type: StatementKind
        value: "1"
      - doc: StatementQuery is a statement that returns rows; its rows are counted.
        name: StatementQuery
        type: StatementKind
        value: "2"
      - doc: StatementPrepare is a statement compiled for repeated execution.
        name: StatementPrepare
        type: StatementKind
        value: "3"
      - doc: StatementBegin is a transaction opened.
        name: StatementBegin
        type: StatementKind
        value: "4"
      - doc: StatementCommit is a transaction committed.
        name: StatementCommit
        type: StatementKind
        value: "5"
      - doc: StatementRollback is a transaction rolled back.
        name: StatementRollback
        type: StatementKind
        value: "6"
    doc: |-
      Package sql — range 0.2.24.* (ADR 0055 core/data/sql block), and the
      transaction manager's, health probe's and migration runner's 0.3.54.* (ADR
      0055 service/data/sql block, declared here since ADR 0160).

      Package sql — declares the sentinel *errs.Error port outcomes, and the run
      outcomes of the transaction manager, the health probe and the migration
      runner in internal/service/data/sql (ADR 0160: every code is declared in the
      core, at the service's path). Each var's name equals its errs.Define Reason
      in SCREAMING_SNAKE form.

      # Public never carries infrastructure

      Driver errors are the SDK's worst leak risk: a failed connection reports the
      host, the port, the user and sometimes the password; a failed statement
      reports the statement. Every Public below is a fixed literal that names the
      CLASS of failure and nothing else, and no call site in this domain ever puts
      a DSN or a SQL fragment into one. Where the detail matters it goes in a
      Private or a field, both of which are log-only; and the run outcomes the
      service emits travel beside the driver's own error under errors.Join —
      reachable from a log, never from errs.PublicOf (ADR 0055 §D9).

      Package sql declares the SDK's relational-database domain: a small set of
      PORTS above database/sql. It is deliberately NOT an ORM, and that refusal is
      the design, not an omission — see ADR 0055.

      # What this domain is

      Four things, and nothing else:

        - [Executor] — the read/write surface a query runs against. *sql.DB,
          *sql.Tx and *sql.Conn all satisfy it AS THEY ARE, with no adapter.
        - [Transactor] — the transaction manager: it owns Begin, Commit and
          Rollback, and it never hands any of the three to the code running
          inside the transaction.
        - [Checker] — a bounded liveness probe.
        - [Migrator] — an ordered, versioned, mutually-exclusive schema runner.

      # What this domain refuses to be

      No entity mapping, no query builder, no lazy loading, no identity map, no
      change tracking, no repository generation, no schema reflection. A framework
      that needs those integrates a library that provides them; it does not grow
      them (ADR 0055 §D1). The SDK's job here is the part every application needs
      and nobody enjoys writing correctly: transaction ownership, savepoints,
      pool policy, and a migration runner that two processes can start at once.

      It also ships NO DRIVER. pgx, go-sql-driver/mysql and the sqlite bindings
      are connectors to a third-party system, so they belong under third-party/
      by the same rule that put the AWS writers there (ADR 0012). The consumer
      imports the driver it wants and hands this domain a *sql.DB.

      # The ports do not hide database/sql

      [Executor] speaks *sql.Rows, *sql.Row and sql.Result — the stdlib's own
      types, not re-declared equivalents. Re-declaring them would be the first
      step of the ORM this domain refuses to become: once Rows is ours, scanning
      is ours, and once scanning is ours, mapping is a small step. Organising the
      stdlib is the whole ambition.

      # There is no registry

      Like proc (ADR 0016), resilience (ADR 0026), net (ADR 0029), scheduler
      (ADR 0041), token (ADR 0042), session (ADR 0045) and lifecycle (ADR 0050),
      this domain has no name->implementation registry. There is one Transactor
      and one Migrator; a registry would have one entry and would add a way to
      select a database engine from a configuration string — which is precisely
      the mistake [Dialect] exists to prevent, since a dialect the SDK cannot
      spell must be refused at construction and not resolved at runtime.

      Package sql — hosts Dialect, the closed set of SQL engines this domain can
      spell, the vocabulary each one spells statements with, and the two refusals
      that keep the set closed.

      Package sql — hosts the four ports themselves. Kept apart from sql.go so
      the package's contract is one file: what a caller may implement, and what
      the SDK promises to accept.

      Package sql — hosts MigrationValue and the Step both of its halves are.

      Package sql — hosts TxOptionsValue, the per-transaction options a
      Transactor honours.
    functions:
      - doc: |-
          ParseDialect resolves a dialect name. It never guesses.

          A name in the accepted set resolves. A name in the refused set returns
          [DialectRefused] carrying WHY, so the caller learns their engine is known
          and declined rather than unrecognised. Anything else returns
          [UnknownDialect].
        in:
          - name: name
            type: string
        name: ParseDialect
        out:
          - name: dialect
            type: Dialect
          - name: err
            type: error
      - doc: |-
          Irreversible is the [Step] a caller assigns to [MigrationValue.Down] to
          declare that the migration cannot be reversed. It always fails, with a typed
          error naming the version.

          It is a value rather than a nil convention so the claim appears in the diff
          and in the version-table review, and so `Down` reports a refusal the caller
          wrote rather than a nil dereference the SDK discovered.
        in:
          - name: ctx
            type: context.Context
          - name: ex
            type: Executor
        name: Irreversible
        out:
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      stdsql: database/sql
    path: github.com/kitsunium/sdk/internal/core/data/sql
    ports:
      - doc: |-
          Executor is the surface a statement runs against: a pool, a connection, or
          a transaction. Implementations MUST be safe for concurrent use, with the
          documented exception of a transaction-scoped executor, which is confined to
          its scope (see internal/service/data/sql).

          The method set is a strict SUBSET of what *sql.DB, *sql.Tx and *sql.Conn
          already expose, so all three satisfy this port with no adapter. That is the
          point: the SDK is not wrapping database/sql, it is naming the part of it a
          caller should be allowed to reach.

          It is FROZEN at three methods. pkg/v1/data/sql aliases it, so under ADR 0039 a
          fourth method would break every downstream double at compile time with no
          deprecation window. New capabilities arrive as SIBLING interfaces the
          implementation is type-asserted for — [Preparer] is the first.

          # What is deliberately absent

          There is no Commit, no Rollback and no Begin. A function that receives an
          Executor therefore CANNOT end the transaction it was handed: the method does
          not exist, so the mistake does not compile. Ownership of a transaction stays
          with the [Transactor] that opened it (ADR 0055 §D3).
        methods:
          - doc: ExecContext runs a statement that returns no rows.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: ExecContext
            out:
              - type: stdsql.Result
              - type: error
            variadic: true
          - doc: QueryContext runs a statement that returns rows. The caller closes them.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: QueryContext
            out:
              - type: "*stdsql.Rows"
              - type: error
            variadic: true
          - doc: QueryRowContext runs a statement expected to return at most one row.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: QueryRowContext
            out:
              - type: "*stdsql.Row"
            variadic: true
        name: Executor
      - doc: |-
          Preparer is the first ADR 0039 sibling of [Executor]: an executor that can
          also prepare a statement for repeated execution. Discover it by type
          assertion rather than by widening Executor.

          *sql.DB, *sql.Tx and *sql.Conn all satisfy it; a transaction-scoped executor
          does too, and the prepared statement it returns is bound to that
          transaction and dies with it.
        methods:
          - doc: PrepareContext compiles a statement. The caller closes it.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
            name: PrepareContext
            out:
              - type: "*stdsql.Stmt"
              - type: error
        name: Preparer
      - doc: |-
          Transactor owns transactions. Implementations MUST be safe for concurrent
          use.

          It is FROZEN at one method, and the options travel in a struct rather than
          as a second method, precisely so the port never needs a sibling for
          "Transact, but read-only" (ADR 0039).

          IFACE-PLUGIN: the concrete manager stays unexported behind its constructor
          in internal/service/data/sql.
        methods:
          - doc: |-
              Transact runs fn inside a transaction and commits when fn returns nil.

              If ctx already carries a transaction opened by THIS Transactor, fn runs
              inside a SAVEPOINT of that transaction instead of a new one, and opts
              must be the zero value — a savepoint cannot change isolation or
              read-only-ness, so asking for either is refused with [NestedIsolation]
              rather than silently ignored (ADR 0055 §D5).

              A panic inside fn is NOT recovered: the deferred rollback still runs,
              and the panic reaches the caller with its original stack.
            in:
              - name: ctx
                type: context.Context
              - name: opts
                type: TxOptionsValue
              - name: fn
                type: TxFunc
            name: Transact
            out:
              - type: error
        name: Transactor
      - doc: |-
          Joiner is an ADR 0039 sibling of [Transactor]: a transactor that says where
          a statement issued under a context runs. Discover it by type assertion; the
          SDK's own transactor implements it.

          It is what lets a callee JOIN the transaction its caller opened instead of
          opening a second one. A second transaction takes a second connection, does
          not see the caller's uncommitted writes, and under a pool of one waits
          forever for the connection its own caller holds (ADR 0139).
        methods:
          - doc: |-
              Join returns the executor a statement issued under ctx runs on.

              When ctx carries a transaction THIS transactor opened, that is the
              executor of the innermost scope ctx names, and inTx is true. It is
              valid only while that scope runs and refuses afterwards: a context
              that outlived its transaction must not fall back to the pool, where
              its statements would run outside the transaction they were written
              for.

              When ctx carries none — no transaction, or only another transactor's —
              it is the pool, outside any transaction, and inTx is false.
            in:
              - name: ctx
                type: context.Context
            name: Join
            out:
              - name: ex
                type: Executor
              - name: inTx
                type: bool
        name: Joiner
      - doc: |-
          Router is an ADR 0039 sibling of [Transactor]: a transactor that routes a
          read to a read replica. Discover it by type assertion; the SDK's own
          transactor implements it, and routes there only when it was given a
          replica's pool.

          A transaction asked for read-only — [TxOptionsValue].ReadOnly — opens on
          the replica, and every statement inside it runs there; Reader is the same
          routing for a read outside any transaction. A write sent through either is
          the replica's, or the driver's, to refuse: the SDK parses no SQL to tell a
          read from a write (ADR 0055 §D1).
        methods:
          - doc: |-
              Reader returns the executor a read issued under ctx runs on: the
              innermost scope of the transaction ctx carries for THIS transactor, as
              [Joiner].Join answers it — on the replica when that transaction is
              read-only —, else the replica's pool, else the primary's when no replica
              is configured.
            in:
              - name: ctx
                type: context.Context
            name: Reader
            out:
              - type: Executor
        name: Router
      - doc: |-
          StatementObserver watches the statements a pool sends: told when each
          begins, it answers the function told when it ends. It is what a slow-query
          log, a span per statement or a count of statements per transaction is
          built on (internal/service/data/sql's Observe installs it under a pool).

          It sees the statement's SQL text as the caller wrote it, bounded, and its
          kind, and never an argument or a row: a bound argument is where a password,
          a token or an e-mail address travels (ADR 0005's Public/Private rule). It
          never refuses a statement — it has no way to.

          Implementations MUST be safe for concurrent use: a pool's connections run
          at once.
        methods:
          - doc: |-
              Begin is told that a statement of kind is about to run under ctx, and
              returns end, which is told exactly once when it ended: rows is the
              count a query's rows read before they closed, or an exec's rows
              affected when the driver reports it, else 0; err is the driver's own
              error, nil on success. end is never nil.
            in:
              - name: ctx
                type: context.Context
              - name: kind
                type: StatementKind
              - name: query
                type: string
            name: Begin
            out:
              - name: end
                type: func(rows int64, err error)
        name: StatementObserver
      - doc: |-
          Deferrer is an ADR 0039 sibling of [Transactor]: a transactor that holds a
          function until the transaction a context carries has committed. Discover it
          by type assertion; the SDK's own transactor implements it.

          It is how an effect that must not happen for work that is rolled back — a
          store's write hooks, a message, a mail — waits for the commit (ADR 0139).
        methods:
          - doc: |-
              Defer holds fn until the transaction ctx carries for this transactor
              commits, and reports true.

              The held functions run once, in the order they were held, on the
              goroutine that commits, after the commit and before the outermost
              Transact returns. A rollback drops them, and so does the rollback of
              the savepoint they were held in; a savepoint that is released hands
              them to the scope around it. A panic in one reaches the caller of the
              outermost Transact after the commit stood, and the functions held after
              it do not run.

              Defer reports false and holds nothing when ctx carries no open
              transaction of this transactor. There is no commit to wait for, so fn
              is the caller's again, usually to run at once. A nil fn holds nothing
              and gets the same answer.
            in:
              - name: ctx
                type: context.Context
              - name: fn
                type: func()
            name: Defer
            out:
              - name: held
                type: bool
        name: Deferrer
      - doc: |-
          Aborter is an ADR 0039 sibling of [Transactor], and the complement of
          [Deferrer]: a transactor that holds a function until the work a context
          carries is undone. Discover it by type assertion; the SDK's own transactor
          implements it.

          It is how a callee that announced something BEFORE the commit — a
          registration a later delivery waits on, a resource reserved for the
          commit — takes it back when the commit never comes, since a function held
          with Defer is then dropped without a word (ADR 0139, amended 2026-10-14).
        methods:
          - doc: |-
              OnAbort holds fn until the work of the scope ctx carries for this
              transactor is undone, and reports true.

              The work is undone when the scope's savepoint rolls back, or when any
              scope around it does, the root included: the root's unit of work
              returned an error or panicked, its commit was refused — a poisoned
              transaction — or the COMMIT itself failed, which [CommitFailed] reports
              as a unit of work that had no effect. A savepoint that is released
              hands what it held to the scope around it, which decides in turn; a
              commit that stands drops every function still held, unrun.

              The held functions run once, newest first, on the goroutine that ends
              the scope, after its ROLLBACK or ROLLBACK TO SAVEPOINT and before that
              scope's Transact returns — or before its panic continues. Each is
              handed ctx without its cancellation or deadline: a function that
              cleans up after a rollback must not die of the cancellation that
              caused it. It must not panic, and it must not open a transaction on
              ctx, which is over.

              For a function held with OnAbort and another with Defer under the same
              scope, exactly one of the two runs, unless a function held with Defer
              before it panics.

              OnAbort reports false and holds nothing when ctx carries no open
              transaction of this transactor. There is nothing to undo, so fn is the
              caller's again. A nil fn holds nothing and gets the same answer.
            in:
              - name: ctx
                type: context.Context
              - name: fn
                type: func(ctx context.Context)
            name: OnAbort
            out:
              - name: held
                type: bool
        name: Aborter
      - doc: |-
          Checker reports whether the database is reachable. Implementations MUST be
          safe for concurrent use.
        methods:
          - doc: |-
              Check probes the database under a bounded budget and returns nil when
              it answered. A non-nil error is always typed and never carries the
              connection string.
            in:
              - name: ctx
                type: context.Context
            name: Check
            out:
              - type: error
        name: Checker
      - doc: |-
          Migrator applies an ordered, versioned set of [MigrationValue] to a schema,
          under mutual exclusion. Implementations MUST be safe for concurrent use, and
          MUST be safe against a SECOND PROCESS running the same migrations at the
          same instant.

          IFACE-PLUGIN: the concrete runner stays unexported behind its constructor in
          internal/service/data/sql.
        methods:
          - doc: |-
              Plan reports what Up would apply, in the order it would apply it,
              WITHOUT applying anything and without taking the migration lock. It is
              the dry run: a read of the version table and a set difference.
            in:
              - name: ctx
                type: context.Context
            name: Plan
            out:
              - type: "[]MigrationValue"
              - type: error
          - doc: |-
              Up applies every pending migration in ascending version order, each in
              its own transaction, under the migration lock.
            in:
              - name: ctx
                type: context.Context
            name: Up
            out:
              - type: error
          - doc: |-
              Down reverses every applied migration whose version is STRICTLY GREATER
              than target, in descending order, each in its own transaction, under the
              migration lock. Down(ctx, 0) reverses everything.
            in:
              - name: ctx
                type: context.Context
              - name: target
                type: uint64
            name: Down
            out:
              - type: error
        name: Migrator
    sentinels:
      - var:
          - code: CodeUnknownDialect
            doc: |-
              UnknownDialect is returned by ParseDialect for a name that is in
              neither the accepted nor the refused set.
            exit: CONFIG
            name: UnknownDialect
            private: "core/data/sql: dialect name is not in the accepted set (postgres, mysql, sqlite); the field carries the name"
            public: The SQL dialect is not one this SDK supports
            reason: UNKNOWN_DIALECT
          - code: CodeDialectRefused
            doc: |-
              DialectRefused is returned by ParseDialect for an engine this SDK
              recognises and declines. It is a DIFFERENT answer from UnknownDialect:
              a caller debugging a refusal needs to know whether their engine is
              unheard-of or known-and-declined, because only the second one comes
              with a reason they can evaluate.
            exit: CONFIG
            name: DialectRefused
            private: "core/data/sql: the engine's savepoint grammar is a different algorithm, not a different string; the reason field says which"
            public: That SQL engine is recognised and deliberately not supported
            reason: DIALECT_REFUSED
          - code: CodeNestedIsolation
            doc: |-
              NestedIsolation is returned when a nested Transact asks for non-zero
              options. A nested scope is a SAVEPOINT inside an already-open
              transaction, and a savepoint changes neither the isolation level nor
              the read-only-ness of that transaction. Honouring the request is
              impossible; ignoring it would hand the caller a weaker transaction than
              the one they asked for, under a nil error.
            exit: CONFIG
            name: NestedIsolation
            private: "core/data/sql: a nested scope is a savepoint; open the outer transaction with the options instead"
            public: A nested transaction cannot change isolation or read-only mode
            reason: NESTED_ISOLATION
          - code: CodeInvalidMigration
            doc: |-
              InvalidMigration is returned for a migration that could never run. The
              "missing" field names which half is absent.
            exit: CONFIG
            name: InvalidMigration
            private: "core/data/sql: migration has version 0, an empty name, a nil Up or a nil Down; the missing field names which"
            public: The migration is not runnable and was refused
            reason: INVALID_MIGRATION
          - code: CodeMigrationIrreversible
            doc: |-
              MigrationIrreversible is what the Irreversible step returns. It is the
              caller's own declaration coming back at them, not a defect the SDK
              found — which is why it reads as a statement about the migration rather
              than about the runner.
            exit: CONFIG
            name: MigrationIrreversible
            private: "core/data/sql: Down is the Irreversible step; reversing it requires a new forward migration"
            public: That migration was declared irreversible and cannot be rolled back
            reason: MIGRATION_IRREVERSIBLE
          - code: CodeConfigInvalid
            doc: |-
              ConfigInvalid is returned by every constructor in
              internal/service/data/sql for a Config that could never produce a
              working port.
            exit: CONFIG
            name: ConfigInvalid
            private: "service/data/sql: Config has a nil DB or an unusable Dialect; the missing field names which"
            public: The SQL configuration is incomplete and was refused
            reason: CONFIG_INVALID
          - code: CodePoolMisconfigured
            doc: |-
              PoolMisconfigured is returned when a pool field's zero value would be
              read by database/sql as a policy nobody chose. MaxOpen is the case that
              matters: database/sql reads 0 as UNLIMITED, and "as many connections as
              the application happens to want" is a decision made by forgetting a
              line, not by taking one (ADR 0031's refusal side).
            exit: CONFIG
            name: PoolMisconfigured
            private: "service/data/sql: a non-positive MaxOpen means unlimited in database/sql; state the ceiling explicitly"
            public: The connection-pool policy is not one this SDK will apply
            reason: POOL_MISCONFIGURED
          - code: CodeBeginFailed
            doc: |-
              BeginFailed is joined with the driver's error when a transaction could
              not be opened. Nothing ran.
            exit: TEMPFAIL
            http: 503
            name: BeginFailed
            private: "service/data/sql: BeginTx failed; the driver error travels beside this one under errors.Join"
            public: The database refused to open a transaction
            reason: BEGIN_FAILED
          - code: CodeCommitFailed
            doc: |-
              CommitFailed is joined with the driver's error when COMMIT was
              rejected. It says the unit of work did NOT take effect, which is the
              one fact a caller must not have to infer.
            exit: TEMPFAIL
            http: 503
            name: CommitFailed
            private: "service/data/sql: COMMIT was rejected; the driver error travels beside this one under errors.Join"
            public: The transaction could not be committed and had no effect
            reason: COMMIT_FAILED
          - code: CodeRollbackFailed
            doc: |-
              RollbackFailed travels ALONGSIDE the error that triggered the rollback,
              never instead of it. A teardown that also breaks is a second defect,
              and reporting only it would hide the first — the rule ADR 0050 wrote
              for UnwindFailed, applied to the same shape one layer down.
            exit: TEMPFAIL
            name: RollbackFailed
            private: "service/data/sql: ROLLBACK was rejected; the connection is discarded by database/sql"
            public: Rolling the transaction back did not complete cleanly
            reason: ROLLBACK_FAILED
          - code: CodeSavepointFailed
            doc: |-
              SavepointFailed is returned when SAVEPOINT, RELEASE SAVEPOINT or
              ROLLBACK TO SAVEPOINT is rejected. The "statement" field names which of
              the three, because the consequences differ: a failed SAVEPOINT means
              the nested scope never started, while a failed ROLLBACK TO means the
              engine's state is unknown and the transaction is poisoned.
            exit: TEMPFAIL
            name: SavepointFailed
            private: "service/data/sql: the statement field names which of SAVEPOINT / RELEASE / ROLLBACK TO failed"
            public: A savepoint statement was rejected by the database
            reason: SAVEPOINT_FAILED
          - code: CodeTxPoisoned
            doc: |-
              TxPoisoned refuses every further operation on a transaction whose
              savepoint rollback failed.

              This is the answer to "does a failed sub-transaction condemn the outer
              one?". Normally NO: ROLLBACK TO SAVEPOINT is precisely the statement
              that clears PostgreSQL's aborted state, so a caught inner failure
              leaves a usable transaction. But when that statement ITSELF fails, the
              engine's state is no longer known, and continuing would commit a
              transaction containing work the SDK believes it undid.
            exit: TEMPFAIL
            name: TxPoisoned
            private: "service/data/sql: a savepoint rollback failed, so the engine state is unknown; the whole transaction is abandoned"
            public: The transaction is no longer usable and will not be committed
            reason: TX_POISONED
          - code: CodeTxClosed
            doc: |-
              TxClosed is returned when an Executor is used after the scope that lent
              it returned. database/sql would answer ErrTxDone for a finished
              transaction and would EXECUTE for a nested scope whose outer
              transaction is still open — the second case is the one worth catching.
            exit: CONFIG
            name: TxClosed
            private: "service/data/sql: the Executor outlived its Transact scope; it is valid only for the duration of the call"
            public: That transaction handle is no longer valid
            reason: TX_CLOSED
          - code: CodeHealthCheckFailed
            doc: |-
              HealthCheckFailed is joined with the driver's error when the probe was
              answered with a failure.
            exit: TEMPFAIL
            http: 503
            name: HealthCheckFailed
            private: "service/data/sql: PingContext returned an error; the driver error travels beside this one under errors.Join"
            public: The database is not reachable
            reason: HEALTH_CHECK_FAILED
          - code: CodeHealthCheckTimeout
            doc: |-
              HealthCheckTimeout is returned when the probe did not answer inside its
              budget. It is a separate code from HealthCheckFailed because a database
              that refuses is a different operational fact from one that hangs, and a
              readiness endpoint routes on the difference.
            exit: TEMPFAIL
            http: 503
            name: HealthCheckTimeout
            private: "service/data/sql: the probe budget expired; the ping goroutine is abandoned, never killed"
            public: The database did not answer the health check in time
            reason: HEALTH_CHECK_TIMEOUT
          - code: CodeMigrationFailed
            doc: |-
              MigrationFailed is joined with the step's own error when a migration or
              its bookkeeping row fails. The transaction was rolled back, so neither
              the schema change nor the version row took effect — except on engines
              with non-transactional DDL, which is stated in the package doc rather
              than papered over.
            exit: TEMPFAIL
            name: MigrationFailed
            private: "service/data/sql: version+direction fields; step error joined; on MySQL DDL commits implicitly, so a failed step can leave the schema change applied WITHOUT its version row (ADR 0055 D8)"
            public: A migration did not apply and was rolled back
            reason: MIGRATION_FAILED
          - code: CodeMigrationOutOfOrder
            doc: |-
              MigrationOutOfOrder refuses a pending migration whose version is lower
              than one already applied. It is the two-branches-merged hazard: both
              branches numbered from the same base, one shipped first, and the other
              would now apply UNDER it — producing a schema that matches neither
              branch's expectation and a version table that cannot express what
              happened.
            exit: CONFIG
            name: MigrationOutOfOrder
            private: "service/data/sql: renumber the migration above the highest applied version; the fields carry both"
            public: A pending migration is older than one already applied
            reason: MIGRATION_OUT_OF_ORDER
          - code: CodeMigrationLockUnsupported
            doc: |-
              MigrationLockUnsupported is the refusal of a Migrator over a dialect
              that offers no lock dying with its holder — never a run without one: a
              runner that silently drops mutual exclusion is at its most dangerous
              exactly when two instances start together, which is the case it exists
              for.

              No dialect the SDK speaks answers it since ADR 0140: PostgreSQL and
              MySQL serialise on the session's advisory lock, SQLite on the database
              file's write lock. It stays defined because it is published, and a
              caller matching it would otherwise stop compiling.
            exit: CONFIG
            name: MigrationLockUnsupported
            private: "service/data/sql: the dialect offers neither a session-scoped advisory lock nor a database-file lock; wire your own exclusion"
            public: That dialect has no advisory lock, so migrations cannot be serialised
            reason: MIGRATION_LOCK_UNSUPPORTED
          - code: CodeMigrationLockTimeout
            doc: |-
              MigrationLockTimeout is returned when another holder kept the migration
              lock for the whole budget. Nothing was applied.
            exit: TEMPFAIL
            name: MigrationLockTimeout
            private: "service/data/sql: the advisory lock was held throughout the budget; no migration was applied"
            public: Another process is running migrations and did not finish in time
            reason: MIGRATION_LOCK_TIMEOUT
          - code: CodeMigrationUnknownVersion
            doc: |-
              MigrationUnknownVersion refuses a Down over a version the running
              binary has no migration for. The database is ahead of the code, and
              reversing a change whose Down is not present would be guessing.
            exit: CONFIG
            name: MigrationUnknownVersion
            private: "service/data/sql: Down cannot reverse a version with no Step; deploy the build that owns it"
            public: The database records a migration this build does not carry
            reason: MIGRATION_UNKNOWN_VERSION
          - code: CodeVersionTableInvalid
            doc: |-
              VersionTableInvalid refuses a version-table name that is not a bare SQL
              identifier. A table name cannot be a bound parameter, so it is
              interpolated — which makes validating it the only thing between a
              configuration string and an injection.
            exit: CONFIG
            name: VersionTableInvalid
            private: "service/data/sql: an identifier cannot be bound as a parameter, so only [A-Za-z_][A-Za-z0-9_]* is accepted"
            public: The version-table name is not a plain SQL identifier
            reason: VERSION_TABLE_INVALID
          - code: CodeDuplicateMigration
            doc: |-
              DuplicateMigration refuses two migrations declaring the same version.
              The version IS the identity, so a duplicate makes "has this been
              applied?" unanswerable.
            exit: CONFIG
            name: DuplicateMigration
            private: "service/data/sql: a version identifies a migration; the field carries the duplicated value"
            public: Two migrations declare the same version
            reason: DUPLICATE_MIGRATION
          - code: CodeMigrationChanged
            doc: |-
              MigrationChanged refuses a run over a migration whose statements were
              edited after they were applied: the checksum it declares is not the one
              its version row recorded. Nothing was applied. The fields name the
              version and the direction, never the text — a schema and a code that
              disagree are found at start-up rather than at the first query that
              fails.
            exit: CONFIG
            name: MigrationChanged
            private: "service/data/sql: the declared checksum differs from the recorded one; restore the applied text or add a new migration"
            public: A migration already applied was edited after it ran
            reason: MIGRATION_CHANGED
          - code: CodeTxRetriesExhausted
            doc: |-
              TxRetriesExhausted is joined with the last attempt's error when a
              retrying transactor ran a transaction as many times as its budget
              allows and every attempt failed on an error its Transient classified
              as transient. Each attempt rolled back. The "attempts" field says how
              many ran.
            exit: TEMPFAIL
            http: 503
            name: TxRetriesExhausted
            private: "service/data/sql: every attempt failed on a transient error; the last one travels beside this one under errors.Join"
            public: The transaction kept conflicting with others and was given up
            reason: TX_RETRIES_EXHAUSTED
          - code: CodeStatementTimedOut
            doc: |-
              StatementTimedOut is joined with the driver's error when a statement
              outlived the transactor's statement budget and was cut. The "operation"
              field names the call — exec, query or prepare — never the statement.
            exit: TEMPFAIL
            http: 503
            name: StatementTimedOut
            private: "service/data/sql: the statement outlived Config.StatementTimeout and its context was cancelled; the driver error travels beside this one"
            public: A database statement did not complete within its time budget
            reason: STATEMENT_TIMED_OUT
    types:
      - doc: |-
          TxFunc is the unit of work a [Transactor] runs inside a transaction.

          It is a FUNCTION port, the shape internal/core/CLAUDE.md already admits for
          resilience.Operation, scheduler.Job and lifecycle.Start: one behaviour, so a
          named func IS the contract. ADR 0039 is satisfied structurally — a func type
          cannot grow a method at all.

          ctx is the transaction-scoped context. Passing it on is what lets a callee
          join THIS transaction rather than open a second one, and what lets a nested
          [Transactor.Transact] become a savepoint instead of a deadlock against the
          transaction its own caller is holding.

          Returning nil commits (or releases the savepoint). Returning an error rolls
          back (or rolls back to the savepoint) and the error is returned to the
          caller VERBATIM, so errors.Is keeps working across the boundary.

          ex is valid ONLY for the duration of the call. Using it afterwards is
          refused with a typed error rather than left to database/sql's ErrTxDone.
        name: TxFunc
        underlying: func(ctx context.Context, ex Executor) error
      - doc: |-
          Transient is the verdict on a failed transaction: true when the database is
          saying "run it again" — a serialization failure, a deadlock, a lock another
          writer held past its timeout — so the whole unit of work may run again from
          its BEGIN; false for everything else.

          A FUNCTION port, for the reason [TxFunc] is one: one behaviour, so a named
          func IS the contract (ADR 0039). The SDK ships no driver, so it reads a
          driver's error only through the methods drivers expose, and
          internal/service/data/sql's Classify is that reading; a connector that
          knows its driver's error type writes its own and composes the two.

          A context's end is never transient: the caller stopped waiting, and running
          the work again would outlive the caller who asked for it.
        name: Transient
        underlying: func(err error) bool
      - doc: |-
          Dialect names a SQL engine whose savepoint grammar, placeholder syntax,
          identifier quoting, row-lock clauses and advisory-lock mechanism this SDK
          knows exactly.

          The set is CLOSED and small on purpose. Every feature this domain adds — a
          savepoint, a `CREATE TABLE IF NOT EXISTS`, an advisory lock — is spelled
          differently by each engine, and there is no portable subset that covers all
          three. So the domain refuses a dialect it cannot spell AT CONSTRUCTION,
          by name, rather than generating SQL that will fail at the first savepoint of
          the first nested transaction on a production database (ADR 0055 §D4).

          The zero value is [DialectUnknown] and is not usable: it is what an unset
          configuration field looks like, and reading it as "probably Postgres" is how
          a MySQL deployment discovers the difference in production (ADR 0031).
        methods:
          - doc: String returns the dialect's canonical lowercase name.
            name: String
            out:
              - type: string
            recv: value
          - doc: Valid reports whether d is a dialect this domain can actually spell.
            name: Valid
            out:
              - type: bool
            recv: value
          - doc: |-
              SupportsAdvisoryLock reports whether the engine offers a SESSION-SCOPED
              advisory lock — one the server releases when the connection holding it
              drops.

              SQLite does not: it has no advisory-lock function, only the file lock that
              serialises writers. That distinction decides HOW [Migrator] promises mutual
              exclusion across processes, so it is a property of the dialect and not a
              runtime discovery (ADR 0055 §D7). On SQLite the runner holds the database
              file's write lock for the whole run instead, which the operating system
              releases when its holder dies, as a server releases an advisory lock
              (ADR 0140).
            name: SupportsAdvisoryLock
            out:
              - type: bool
            recv: value
          - doc: |-
              Placeholder renders the bind marker of a statement's n-th argument, counted
              from 1.

              This is the divergence that makes a "portable" hand-written query a fiction:
              PostgreSQL numbers its markers — $1, $2 — while MySQL and SQLite share the
              positional ?, whose position is the argument's order. Every statement the SDK
              binds an argument to takes its markers from here, so a fourth engine is
              spelled in one place or not at all.

              A dialect that is not [Dialect.Valid] — an unset field — has no marker and
              renders the empty string, so a statement built from it parses on no engine
              rather than on whichever one a guess favoured (ADR 0031).
            in:
              - name: "n"
                type: int
            name: Placeholder
            out:
              - type: string
            recv: value
          - doc: |-
              QuoteIdent renders name as an identifier of the dialect: delimited, so a
              table called "order" or "user" is a name rather than a keyword, and with the
              delimiter doubled wherever the name holds it, which is how every engine
              spells a delimiter inside a delimited identifier. MySQL delimits with
              backticks, whatever its ANSI_QUOTES mode says; PostgreSQL and SQLite with
              the standard's double quotes.

              It validates nothing. An identifier cannot be a bound argument, so the SDK
              interpolates only names it validated at construction, and that check is the
              whole defence: what a name may hold, and how long it may be — PostgreSQL
              TRUNCATES a longer one, into what may be another table's name — is the
              caller's to refuse before quoting it. A dialect that is not [Dialect.Valid]
              renders the empty string, for the reason [Dialect.Placeholder] gives.
            in:
              - name: name
                type: string
            name: QuoteIdent
            out:
              - type: string
            recv: value
          - doc: |-
              ForUpdate renders the clause that ends a read by locking the rows it returns
              until the transaction ends, leading space included: " FOR UPDATE" on
              PostgreSQL and MySQL. On MySQL it is also a locking read, which reads the
              latest committed rows rather than a REPEATABLE READ transaction's snapshot.

              SQLite has no row lock and no such clause, and renders the empty string: a
              SQLite transaction excludes every other writer with the database's one write
              lock, which it takes at its first WRITE, so a transaction that must read
              under exclusion writes first (ADR 0140). A dialect that is not
              [Dialect.Valid] renders the clause: an engine without one refuses the
              statement, which is louder than a lock dropped in silence.
            name: ForUpdate
            out:
              - type: string
            recv: value
          - doc: |-
              ForUpdateSkipLocked renders the clause that ends a read by locking the rows
              it returns and SKIPPING those another transaction holds, leading space
              included: " FOR UPDATE SKIP LOCKED" on PostgreSQL and MySQL. Two readers
              then never wait on each other's rows and never take the same one.

              It needs PostgreSQL 9.5, MySQL 8.0.1 or MariaDB 10.6 — later than the
              floors [DialectPostgres] and [DialectMySQL] name — and an older server
              refuses the statement. SQLite renders the empty string and a dialect that is
              not [Dialect.Valid] the clause, for the reasons [Dialect.ForUpdate] gives: a
              SQLite transaction that has written holds the database's only write lock,
              so no row it reads is held by anybody else.
            name: ForUpdateSkipLocked
            out:
              - type: string
            recv: value
        name: Dialect
        underlying: uint8
      - doc: |-
          Step is one direction of a migration: the statements that move the schema.

          A FUNCTION port, for the same reason [TxFunc] is: one behaviour, so a named
          func IS the contract, and a func type cannot grow a method (ADR 0039).

          It receives the SAME [Executor] the surrounding transaction runs on, which
          is what makes a migration and its version-table row commit together.
        name: Step
        underlying: func(ctx context.Context, ex Executor) error
      - doc: |-
          MigrationValue is one versioned schema change and its reversal.

          The SDK does NOT own a migration FILE FORMAT, a directory layout, or a
          naming convention, and it ships no example directory. A migration is a value
          the consumer constructs, because the moment the SDK reads a directory it has
          invented a convention every consumer must adopt and no consumer asked for
          (ADR 0055 §D8). Where the statements come from — a Go literal, an embed.FS,
          a generator — is the caller's decision and none of the SDK's business.

          The zero value is not runnable and is refused at construction.
        methods:
          - doc: |-
              Validate reports why the migration could never run, or nil.

              It is a method on the value rather than a check inside the runner so a
              caller can validate a set at start-up — before any connection exists —
              which is where a wiring fault should be found.
            name: Validate
            out:
              - type: error
            recv: value
        name: MigrationValue
        struct:
          fields:
            - doc: |-
                Version orders the migration. It must be non-zero and unique within one
                set: zero is reserved as "before every migration", the value Down takes
                to reverse everything.

                Any strictly-increasing scheme works; a UTC timestamp (20260910143000)
                is the conventional one because two branches developed in parallel then
                merge without colliding.
              name: Version
              type: uint64
            - doc: |-
                Name is the human label recorded in the version table. It must be
                non-empty: a schema history whose rows say only "42" is a schema
                history nobody can read during an incident.
              name: Name
              type: string
            - doc: Up applies the change. Required.
              name: Up
              type: Step
            - doc: |-
                Down reverses it. Required — and [Irreversible] is how a caller says
                "this one cannot be reversed" OUT LOUD.

                A nil Down is refused rather than accepted as "irreversible", because
                "I forgot the reversal" and "there is no reversal" are the same nil and
                only one of them is a defect. The same rule core/app/lifecycle applies to a
                nil Stop, for the same reason.
              name: Down
              type: Step
            - doc: |-
                Checksum is the fingerprint of the statements Up runs, recorded in the
                version table beside the version when the migration applies, so a
                later run notices that an applied migration's text was edited — the
                merge that rewrote a column type, the branch that renumbered — and
                refuses with [MigrationChanged] before applying anything, instead of
                calling it applied by its number alone.

                Empty means unverified: the migration is never compared, which is what
                a [Step] written as code rather than as statements must be, since a
                func is opaque (ADR 0055 §D12). A migration built with
                internal/service/data/sql's Statements sets it from the same
                statements with ChecksumOf. A version recorded before checksums
                existed is given this one by the next run that declares it.
              name: Checksum
              type: string
      - doc: |-
          TxOptionsValue parameterises ONE transaction. It is a value, not a manager
          setting, because isolation is a property of the unit of work and not of the
          pool it runs on.

          The zero value is a working configuration: the driver's default isolation
          level, read-write. That is the only non-arbitrary default available — every
          engine defines its own default level and picking one here would silently
          change the semantics of an existing application on migration (ADR 0031's
          clamp side, where the default needs no explanation because it is the
          database's own).

          It is deliberately a struct rather than two extra method parameters so
          [Transactor] stays frozen at one method: a new option is a new FIELD, which
          breaks nobody, where a new method breaks every downstream double (ADR 0039).
        methods:
          - doc: |-
              IsZero reports whether the options ask for nothing beyond the driver's
              defaults.

              It exists because a NESTED scope is a savepoint, and a savepoint can change
              neither the isolation level nor the read-only-ness of the transaction it
              sits inside. Non-zero options on a nested call are therefore refused with
              [NestedIsolation] rather than ignored — silently downgrading a caller's
              explicit `Serializable` to whatever the outer transaction happened to use is
              the kind of "helpful" behaviour that produces a data race nobody can find
              (ADR 0055 §D5).
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              StdOptions renders the value as the stdlib's own option struct, ready for
              (*sql.DB).BeginTx.
            name: StdOptions
            out:
              - type: "*stdsql.TxOptions"
            recv: value
        name: TxOptionsValue
        struct:
          fields:
            - doc: |-
                Isolation is the transaction isolation level. The zero value
                (sql.LevelDefault) defers to the driver.
              name: Isolation
              type: stdsql.IsolationLevel
            - doc: |-
                ReadOnly asks the engine to refuse writes. Not every driver enforces
                it; those that do not report an error at Begin rather than accepting
                writes silently, which is why this is passed through rather than
                emulated.
              name: ReadOnly
              type: bool
      - doc: |-
          StatementKind says what a [StatementObserver] is told about: an exec, a
          query, a prepare, or one of the three verbs that open and end a
          transaction. The zero value is no kind and is never reported.
        methods:
          - doc: String returns the kind's lowercase name, "unknown" for none.
            name: String
            out:
              - type: string
            recv: value
        name: StatementKind
        underlying: uint8
  - constants:
      - doc: |-
          DefaultMaxLifetime is the connection lifetime a non-positive
          [PoolConfig.MaxLifetime] clamps to.

          database/sql reads 0 as "reuse a connection forever", and a connection that
          lives forever survives a failover, a DNS change and a credential rotation —
          it keeps talking to a replica that has been demoted, and nothing in the
          application ever notices. The exact number matters far less than its being
          FINITE, so this is a clamp rather than a refusal (ADR 0031): thirty minutes
          is long enough to be invisible on the hot path and short enough that a
          topology change is picked up without a restart.
        name: DefaultMaxLifetime
        type: time.Duration
        value: "1800000000000"
      - doc: |-
          DefaultMaxIdle is the idle-connection ceiling a non-positive
          [PoolConfig.MaxIdle] clamps to — the same value database/sql itself uses, so
          the clamp changes nothing a caller could have observed.
        name: DefaultMaxIdle
        type: int
        value: "2"
      - doc: |-
          DefaultCheckTimeout is the liveness-probe budget a non-positive
          [Config.CheckTimeout] clamps to. A health check that can hang forever is
          not a health check.
        name: DefaultCheckTimeout
        type: time.Duration
        value: "5000000000"
      - doc: |-
          DefaultVersionTable is the table an empty [MigrateConfig.VersionTable]
          clamps to. The name matches the de-facto convention of every migration tool
          in the ecosystem, so an operator inspecting a database recognises it without
          being told.
        name: DefaultVersionTable
        type: string
        value: "\"schema_migrations\""
      - doc: |-
          DefaultLockTimeout is the migration-lock budget a non-positive
          [MigrateConfig.LockTimeout] clamps to.

          A migration run that waits forever for another holder is a deployment that
          hangs with no output, which is strictly worse than one that fails and says
          why. Two minutes is longer than almost every migration and shorter than
          every deployment timeout that would otherwise kill the pod first.
        name: DefaultLockTimeout
        type: time.Duration
        value: "120000000000"
      - doc: |-
          DefaultLockRetryInterval is how often a blocked runner retries the
          non-blocking lock acquisition. A non-positive
          [MigrateConfig.LockRetryInterval] clamps to it.
        name: DefaultLockRetryInterval
        type: time.Duration
        value: "250000000"
      - doc: |-
          MaxObservedQuery is how many bytes of a statement's SQL text a
          [coresql.StatementObserver] receives: a longer text is cut at the last
          whole UTF-8 character within it. A generated IN list or a bulk VALUES
          clause is no slower to log for being a megabyte long, and no more useful.
        name: MaxObservedQuery
        type: int
        value: "1024"
      - doc: |-
          DefaultRetryAttempts is how many times a retrying transactor runs a
          transaction when [RetryConfig.Attempts] is not positive: the first attempt
          and two more. A conflict that three attempts did not clear is contention
          the caller should hear about, not one a fourth will.
        name: DefaultRetryAttempts
        type: int
        value: "3"
      - doc: |-
          DefaultRetryDelay is the base of the wait between two attempts when
          [RetryConfig.Backoff] is the zero value, which then grows by 2 per attempt
          with full jitter: two transactions that deadlocked each other and retry
          on the same curve without jitter meet again at the same instant.
        name: DefaultRetryDelay
        type: time.Duration
        value: "25000000"
    doc: |-
      Package sql — hosts Config, the parameters every port in this package is
      built from, and the pool policy it applies.

      Package sql — hosts the only place in this domain that renders
      dialect-specific SQL. Every statement it sends is built here, spelled with
      the vocabulary core/data/sql's Dialect owns: the bind markers, the quoting and the
      row-lock clauses.

      Package sql — hosts the scope-bound Executor handed to a TxFunc, and the
      two guards that stand between a stale handle and a live transaction.

      Package sql — hosts the liveness probe and the budget that bounds it.

      Package sql — hosts the transactor's two ADR 0039 siblings: where a
      statement issued under a context runs, and what waits for a commit.

      Package sql — hosts the migration runner: the order, the version table, the
      dry run, and the two directions.

      Package sql — hosts MigrateConfig, the migration runner's parameters, and
      the validation that turns a caller's slice into an ordered plan.

      Package sql — hosts the migration lock of an engine with no advisory lock:
      SQLite's own write lock on the database file, held for the whole run.

      Package sql — hosts the migration lock: why it is the engine's own advisory
      lock, and why it lives on a connection of its own.

      Package sql — hosts the validated, sorted, clamped form of a MigrateConfig.

      Package sql — hosts the version table: its portable shape, the reads and
      the two writes that keep it in step with the schema.

      Package sql — hosts the validated, clamped form of a Config.

      Package sql — hosts the three rendered statements of one savepoint.

      Package sql — hosts the one context key this package stores under.

      Package sql implements the relational-database ports declared in
      internal/core/data/sql (ADR 0055): the transaction manager, the pool policy, the
      health check and the migration runner.

      It ships NO DRIVER and imports none. A driver is a connector to a
      third-party system, so pgx / go-sql-driver / the sqlite bindings belong
      under third-party/ by the rule that put the AWS writers there (ADR 0012).
      The caller opens its own *sql.DB and hands it over.

      It is also NOT an ORM, has no query builder, no entity mapping and no lazy
      loading, and never will (ADR 0055 §D1).

      # Transaction ownership is structural

      [NewTransactor] hands the unit of work a core/data/sql.Executor — three methods,
      none of which is Commit or Rollback. A function that receives a transaction
      therefore cannot end it: the mistake does not compile. The manager commits
      when the function returns nil and rolls back otherwise, and it is the only
      thing that ever does either.

      # Nesting is a savepoint, and the traps are handled rather than avoided

      database/sql has no nested transactions. A [core/data/sql.Transactor.Transact]
      whose context already carries a transaction from THIS manager opens a
      SAVEPOINT instead:

        - The savepoint NAME is generated by the SDK from a counter that never
          resets inside one transaction. It is never caller-supplied, because an
          identifier cannot be a bound parameter; and it is never reused, because
          a repeated name shadows rather than replaces, so RELEASE would release
          the wrong one.
        - The three statements are IDENTICAL on postgres, mysql and sqlite, which
          is why those three are the supported set. Engines that spell nesting
          differently are refused BY NAME at ParseDialect (ADR 0055 §D4).
        - Non-zero [core/data/sql.TxOptionsValue] on a nested call is REFUSED: a
          savepoint cannot change isolation or read-only mode, and silently
          downgrading a caller's Serializable is worse than saying no.

      # What a failed sub-transaction does

      It rolls back to its savepoint and returns the error to the caller of the
      inner Transact — verbatim, so errors.Is still answers. The OUTER
      transaction survives, and that is not optimism: ROLLBACK TO SAVEPOINT is
      exactly the statement that clears PostgreSQL's aborted state (SQLSTATE
      25P02), so a caller who CATCHES the inner error has a usable transaction to
      continue in. A caller who does not catch it propagates it, and the outer
      scope rolls back in turn — the common case, and the safe default.

      If the ROLLBACK TO SAVEPOINT statement itself fails, the transaction is
      POISONED: every later operation is refused with [coresql.TxPoisoned], the
      commit never happens, and the whole transaction is rolled back. The
      engine's state is unknown at that point, and committing work the SDK
      believes it undid is the one outcome worse than failing.

      # Joining a transaction, and holding what waits for its commit

      The manager is also a core/data/sql Joiner, Deferrer and Aborter (ADR 0139). Join answers
      the executor of the innermost scope of the transaction a context carries for
      THIS manager — a retired one, which refuses, when that scope has returned,
      and never the pool in its place — or the pool when the context carries none.
      Defer holds a function until that transaction commits; each held function
      carries the id of the scope that held it, a failed savepoint drops what was
      held at or above its own id, and the root runs what is left after its COMMIT.
      OnAbort is the complement: a failed savepoint runs, newest first, what was
      held for an abort at or above its own id once its ROLLBACK TO SAVEPOINT ran,
      a root that does not commit runs what is left after its ROLLBACK — a panic
      included —, and a root that commits drops it.

      # SQLite's migrations

      SQLite has no advisory lock, and its runner holds the database file's write
      lock instead (ADR 0140): the run is ONE transaction that takes the lock with
      a write that writes nothing, and each migration is a savepoint of it.

      # A partially applied migration, and what MySQL does to the guarantee

      Each migration runs in ITS OWN transaction, and the version-table row is
      written by that SAME transaction on that SAME executor. On PostgreSQL and
      SQLite — where DDL is transactional — that is a real guarantee: a migration
      that fails rolls back both halves, the database sits exactly at version
      n-1, and re-running is safe.

      On MySQL and MariaDB it is NOT, and the difference is not one this package
      can close. DDL causes an IMPLICIT COMMIT: the server has already committed
      the schema change before the runner's transaction reaches COMMIT. A
      migration whose second statement fails therefore leaves the first
      statement's ALTER TABLE applied and committed, while the version row — in
      the same transaction — is rolled back. The database is then in a state no
      version number describes.

      No client-side code can make MySQL's DDL transactional, so this package
      does three things instead of pretending: it says so (here, in the package
      CLAUDE.md, in pkg/v1/data/sql's doc and in MigrationFailed's Private), it stops
      at the first failure rather than continuing, and it reports the version and
      the direction so the migration to inspect by hand is named.

      The operational rule that follows is the CONSUMER's: one DDL statement per
      migration on MySQL, which makes the failure atomic by construction. This
      package cannot enforce it — it does not parse SQL — and does not pretend to.
      See ADR 0055 D8.

      # Nothing here waits on the wall clock

      Every budget — the health-check probe, the migration-lock retry — is read
      from an injected kernel/clock.Timed, so the suite advances a ManualClock
      instead of sleeping.

      Package sql — hosts Statements, the one helper that turns SQL text into a
      migration step.

      Package sql — hosts the transaction manager: the root transaction, the
      nested savepoint, and the single rule about who is allowed to commit.

      Package sql — hosts the per-context transaction chain: which transactor
      opened a transaction, and how a nested call finds its own.

      Package sql — hosts the per-transaction state every scope of one
      transaction shares, and the context chain that finds it.

      Package sql — hosts Withheld, a driver's error carried beside a verdict and
      kept out of every rendering.
    functions:
      - doc: |-
          Each iterates rows, scanning each with scan, and closes rows when the
          iteration ends — at the last row, at the first failure, or when the loop
          stops early. A failure — scan's, rows.Err's or the close's — is yielded
          once, as the last element, beside T's zero value:

          	rows, err := ex.QueryContext(ctx, "SELECT id, name FROM accounts")
          	if err != nil {
          		return err
          	}
          	for account, err := range sql.Each(rows, scanAccount) {
          		if err != nil {
          			return err
          		}
          		use(account)
          	}

          It is the Next/Scan/Err/Close loop every caller writes, written once; it
          scans nothing itself, since mapping a row is the caller's (ADR 0055 §D1).
          A nil rows yields nothing.
        in:
          - name: rows
            type: "*stdsql.Rows"
          - name: scan
            type: func(*stdsql.Rows) (T, error)
        name: Each
        out:
          - type: iter.Seq2[T, error]
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          FileLockSQL renders the statement that makes a SQLite transaction take the
          database file's write lock at once, where BEGIN — which database/sql sends
          as SQLite's deferred form — takes none.

          It is a DELETE that matches no row. SQLite starts the write transaction a
          write statement needs when the statement STARTS, before its WHERE clause is
          weighed, so the lock is taken and nothing is changed (ADR 0140). Two
          transactions take it: the migration runner's, naming its version table —
          the one table it knows exists at that point, since it creates it first in
          the same transaction — and the queue's lease, naming its queue's table
          before its first read, so the read cannot answer from a snapshot the update
          after it would be refused for.

          table is interpolated exactly as given — bare, as the runner's validated
          version table is, or already quoted, as the queue's is — and must have been
          validated at construction, which is the whole defence of an interpolated
          identifier.
        in:
          - name: table
            type: string
        name: FileLockSQL
        out:
          - type: string
      - doc: |-
          InsertRows inserts rows into into.Table, into.PerStatement rows per
          statement, on ex, and returns how many rows the statements report
          inserted.

          Each statement reads INSERT INTO table (cols) VALUES (…), (…), its bind
          markers spelled by d and numbered across the statement. into.Table and
          into.Columns are interpolated exactly as given — bare, or already quoted
          with [coresql.Dialect].QuoteIdent — and must have been validated by the
          caller, which is the whole defence of an interpolated identifier; the
          values are always bound.

          into.PerStatement is clamped to what d's engine binds in one statement —
          999 parameters on SQLite, the oldest ceiling it ships with, and 65535 on
          PostgreSQL and MySQL — divided by the number of columns; a non-positive
          one takes that ceiling. A row whose width is not the number of columns,
          no columns at all or a dialect that is not Valid is refused with
          [coresql.ConfigInvalid] before any statement runs. A statement's failure
          is returned verbatim, with the count of rows the statements before it
          inserted; run InsertRows in a transaction for all or none.
        in:
          - name: ctx
            type: context.Context
          - name: ex
            type: coresql.Executor
          - name: d
            type: coresql.Dialect
          - name: into
            type: InsertSpec
          - name: rows
            type: "[][]any"
        name: InsertRows
        out:
          - name: inserted
            type: int64
          - name: err
            type: error
      - doc: |-
          NewChecker returns a bounded liveness probe over cfg.DB.

          Like [NewTransactor] it applies cfg.Pool, so a process whose only SQL port
          is a health check still gets its pool policy installed.
        in:
          - name: cfg
            type: Config
        name: NewChecker
        out:
          - name: probe
            type: coresql.Checker
          - name: err
            type: error
      - doc: |-
          NewMigrator returns the migration runner for cfg.DB.

          Every run is mutually exclusive across processes, and the lock is one its
          holder's death releases: the session's advisory lock on PostgreSQL and
          MySQL (ADR 0055 §D7), the database file's write lock on SQLite (ADR 0140).
          Running unlocked is never offered as a fallback: a runner that silently
          drops mutual exclusion is at its most dangerous in exactly the situation it
          exists for — two instances of a deployment starting together.
        in:
          - name: cfg
            type: Config
          - name: mig
            type: MigrateConfig
        name: NewMigrator
        out:
          - name: runner
            type: coresql.Migrator
          - name: err
            type: error
      - doc: |-
          Observe returns c with obs told about every statement the connections it
          opens send: each Exec, Query and Prepare on a connection, each Exec and
          Query of a statement it prepared, and each transaction's BEGIN, COMMIT and
          ROLLBACK — savepoints included, which travel as statements. A caller opens
          its pool over it and hands that pool to this package as it always did:

          	pool := stdsql.OpenDB(sql.Observe(connector, sql.SlowQueries(time.Second, log, clock.System)))

          The observer receives the SQL text as written, cut to [MaxObservedQuery]
          bytes, and never an argument or a row. A query's end is told when its rows
          close, with how many were read. A call the driver skips with
          driver.ErrSkip — database/sql then prepares the statement, and the
          prepared calls are told in turn — ends with that error; the two observers
          this package ships ignore it.

          The connections keep every optional interface database/sql reads — a
          ping, a session reset, a validity check, a driver's own argument checker —
          answering as the driver's own do, and declining as database/sql's
          defaults would where the driver has none. A nil obs is no wrapper: c is
          returned as it is (ADR 0031).
        in:
          - name: c
            type: driver.Connector
          - name: obs
            type: coresql.StatementObserver
        name: Observe
        out:
          - type: driver.Connector
      - doc: |-
          SlowQueries returns an observer that logs, at Warn, each statement that
          took threshold or longer, timed on clk: its kind, its SQL text, its
          duration, the rows it read or affected, and — when it failed — the driver
          error's class as [Withheld] renders it, never its text. A statement under
          the threshold logs nothing, and costs one reading of the clock at each
          end. A non-positive threshold logs every statement; a nil clk is
          clock.System.
        in:
          - name: threshold
            type: time.Duration
          - name: log
            type: corelogger.Logger
          - name: clk
            type: clock.Clock
        name: SlowQueries
        out:
          - type: coresql.StatementObserver
      - doc: |-
          Traced returns an observer that opens one client span per statement under
          the span ctx carries, named "sql " and the kind, with the SQL text as
          db.query.text, and ends it when the statement ends, with the rows as
          db.response.returned_rows and an error status — the driver error's class
          as [Withheld] renders it — when it failed.
        in:
          - name: tracer
            type: coretrace.Tracer
        name: Traced
        out:
          - type: coresql.StatementObserver
      - doc: |-
          Classify is the SDK's [coresql.Transient]: true for a failure the database
          documents as "run the transaction again", read from the methods drivers
          expose rather than from a driver this package would have to import.

          A SQLSTATE of 40001 (serialization failure) or 40P01 (deadlock detected),
          read through a SQLState() string method — pgx's and lib/pq's errors offer
          one —, and a SQLite result code whose primary code is 5 (BUSY) or 6
          (LOCKED), extended forms such as 517 (BUSY_SNAPSHOT) included, read
          through a Code() int method — modernc.org/sqlite's errors offer one. Every
          error the chain joins or wraps is read, so a verdict joined beside the
          driver's error, or a [Withheld], still answers.

          A context's end is never transient, whatever else the chain carries.
          MySQL's deadlock (1213) and lock-wait timeout (1205) are not read here:
          go-sql-driver exposes them as fields, not methods, so a MySQL connector
          composes its own reading with this one.
        in:
          - name: err
            type: error
        name: Classify
        out:
          - type: bool
      - doc: |-
          NewRetrying returns a transactor that runs a ROOT transaction of tm again
          when it fails on an error cfg.Transient calls transient, up to
          cfg.Attempts runs, waiting cfg.Backoff's curve on cfg.Clock between two.

          Each attempt is a whole transaction of tm: a new BEGIN, the unit of work
          from its start, and the commit or the rollback tm decides — so what the
          unit of work held with Defer is dropped with each attempt that rolled back
          and runs once, after the commit that stood, and what it held with OnAbort
          runs after each rollback. The unit of work MUST therefore be safe to run
          more than once: its effects outside the transaction belong in Defer, as
          ADR 0055 asks of a retried transaction.

          A NESTED call — one whose context already carries a transaction of tm,
          opened through this transactor or through tm itself — joins it as tm
          does, and is never run again on its own: a savepoint cannot be retried
          without the transaction around it. A failure that is not transient, and
          a context that ended, return at once. When the budget is spent the last
          attempt's error is returned joined with [coresql.TxRetriesExhausted],
          whose "attempts" field says how many ran.

          The transactor offers [coresql.Joiner], [coresql.Deferrer] and
          [coresql.Aborter] exactly when tm offers all three, forwarding each to tm.
          A nil tm is refused with [coresql.ConfigInvalid].
        in:
          - name: tm
            type: coresql.Transactor
          - name: cfg
            type: RetryConfig
        name: NewRetrying
        out:
          - name: manager
            type: coresql.Transactor
          - name: err
            type: error
      - doc: |-
          ChecksumOf is the fingerprint [coresql.MigrationValue].Checksum records for
          a migration built from stmts: SHA-256 over the statements in order, each
          preceded by its length in bytes as an 8-byte big-endian unsigned integer,
          rendered as 64 lowercase hexadecimal digits.

          The length prefix is what makes the fingerprint the statements' and not
          their concatenation's: "CREATE TABLE a" then "(x INT)" and
          "CREATE TABLE a(x INT)" alone are different migrations and get different
          checksums. Write it beside the steps it describes, from the same
          statements, so the two cannot drift:

          	ddl := []string{"CREATE TABLE accounts (id BIGINT PRIMARY KEY)"}
          	m := sql.Migration{Version: 1, Name: "accounts",
          		Up: sql.Statements(ddl...), Down: sql.Statements("DROP TABLE accounts"),
          		Checksum: sql.ChecksumOf(ddl...)}
        in:
          - name: stmts
            type: string
        name: ChecksumOf
        out:
          - type: string
        variadic: true
      - doc: |-
          Statements returns a [coresql.Step] that runs stmts in order on the
          transaction's executor, stopping at the first failure.

          This is the smallest helper that is genuinely useful and deliberately not a
          file loader. Reading a directory would mean inventing a filename grammar
          (`0001_name.up.sql`? `V1__name.sql`?), a statement splitter, and a rule for
          what a `;` inside a string literal means — three conventions the SDK would
          impose on every consumer and none of them asked for (ADR 0055 §D8).

          Each statement is sent as its own Exec rather than as one semicolon-joined
          string, because multi-statement execution is a per-driver capability that
          several disable by default, and because a failure then names the statement
          that failed by its position in the slice.

          The text is the caller's own and is never bound: a migration's DDL cannot be
          parameterised on any engine. That is exactly why migrations must not be
          built from user input, and why this helper takes a variadic of literals
          rather than a template.
        in:
          - name: stmts
            type: string
        name: Statements
        out:
          - type: coresql.Step
        variadic: true
      - doc: |-
          NewTransactor returns the transaction manager for cfg.DB.

          It applies cfg.Pool to the caller's *sql.DB. That is a side effect on a
          value the caller owns, and it is deliberate: a pool policy that has to be
          installed by a second call is a pool policy someone will forget, and the
          consequence of forgetting it (unlimited connections, connections that live
          forever) lands on the database rather than on this process.
        in:
          - name: cfg
            type: Config
        name: NewTransactor
        out:
          - name: manager
            type: coresql.Transactor
          - name: err
            type: error
      - doc: |-
          NewWithheld returns cause withheld: reachable by errors.Is and errors.As,
          absent from Error().
        in:
          - name: cause
            type: error
        name: NewWithheld
        out:
          - type: Withheld
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      coresql: github.com/kitsunium/sdk/internal/core/data/sql
      coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
      driver: database/sql/driver
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
      stdsql: database/sql
    path: github.com/kitsunium/sdk/internal/service/data/sql
    types:
      - doc: |-
          PoolConfig is the connection-pool policy. It is applied to the caller's
          *sql.DB at construction, and it is a POLICY rather than a set of hints: a
          field whose zero value database/sql would read as a decision nobody made is
          either clamped or refused, never passed through (ADR 0031).
        name: PoolConfig
        struct:
          fields:
            - doc: |-
                MaxOpen is the hard ceiling on open connections. It is REQUIRED and
                must be positive.

                database/sql reads 0 as UNLIMITED. "As many connections as the
                application happens to want" is a decision made by forgetting a line,
                and the consequence lands on the database rather than on the process
                that forgot — every replica racing to exhaust one server's
                max_connections. No value the SDK could invent is defensible either,
                because the right one depends on the server's ceiling divided by the
                number of replicas, which the SDK cannot see. So this is the REFUSAL
                side of ADR 0031.
              name: MaxOpen
              type: int
            - doc: |-
                MaxIdle is the number of connections kept warm. A non-positive value
                clamps to [DefaultMaxIdle]; a value above MaxOpen clamps DOWN to
                MaxOpen, because database/sql does that reduction silently and a caller
                reading their own configuration back would otherwise be misled.
              name: MaxIdle
              type: int
            - doc: |-
                MaxLifetime is how long a connection may be reused. A non-positive
                value clamps to [DefaultMaxLifetime]; see that constant for why an
                unbounded lifetime is not an option.
              name: MaxLifetime
              type: time.Duration
            - doc: |-
                MaxIdleTime is how long an unused connection is kept. A non-positive
                value is passed through as "no idle deadline", and that is deliberate
                rather than an oversight: MaxLifetime is now always finite, so an idle
                connection is already retired on a bounded schedule, and a second
                timer would only decide how aggressively to shrink a warm pool — a
                tuning choice with no dangerous zero.
              name: MaxIdleTime
              type: time.Duration
      - doc: |-
          Config parameterises every constructor in this package: the caller's pool,
          the dialect whose grammar the SDK will speak to it, the pool policy applied
          at construction, the time source every budget is read from, and the health
          probe's budget.

          It is passed BY VALUE on purpose. A constructor must not be able to observe
          a later mutation of the caller's struct, and the copy happens once per port
          rather than once per statement.
        name: Config
        struct:
          fields:
            - doc: |-
                DB is the caller's pool. REQUIRED — this package never opens one,
                because opening one means importing a driver (ADR 0055 §D2).
              name: DB
              type: "*stdsql.DB"
            - doc: |-
                Dialect selects the SQL grammar. REQUIRED and must be a dialect this
                SDK can spell; resolve a configuration string through
                core/data/sql.ParseDialect, which refuses the engines it cannot support BY
                NAME instead of guessing.
              name: Dialect
              type: coresql.Dialect
            - doc: Pool is the connection-pool policy, applied to DB at construction.
              name: Pool
              type: PoolConfig
            - doc: |-
                Clock is the time source every budget in this package is read from. A
                nil Clock falls back to clock.System.

                clock.Timed rather than clock.Clock because this package both stamps
                (the version table's applied_at) and WAITS (the probe budget, the lock
                retry). Reading package time instead would make every budget assertion
                a sleep, and a sleep a tolerance, and a tolerance a flake.
              name: Clock
              type: clock.Timed
            - doc: |-
                CheckTimeout is the budget one [core/data/sql.Checker.Check] gets. A
                non-positive value clamps to [DefaultCheckTimeout].
              name: CheckTimeout
              type: time.Duration
            - doc: |-
                StatementTimeout bounds each statement the transactor's executors run —
                inside a transaction, and through Join or Reader on a pool — measured
                on Clock. Zero, or negative, is none: a statement then runs until the
                caller's context ends, as database/sql runs it.

                An Exec or a Prepare is bounded until it returns; a Query until its
                rows are read and closed, or the budget elapses, whichever comes first
                — the cut context lives until then, one timer per statement in
                flight. A cut answered by the call itself is joined with
                [core/data/sql.StatementTimedOut], its "operation" field naming exec,
                query or prepare; a cut met while reading rows surfaces from Next,
                Err or Scan as the context's own end. The migration runner never
                applies it: a migration's DDL runs as long as it takes, under the
                caller's context.
              name: StatementTimeout
              type: time.Duration
            - doc: |-
                ReadReplica is a second pool, on a replica of DB, that a read-only
                transaction and [core/data/sql.Router]'s Reader run on. Nil is none:
                every transaction opens on DB. Pool is applied to it as to DB, and the
                health probe pings both. It is the caller's, opened with its own
                driver, and this package never closes it.
              name: ReadReplica
              type: "*stdsql.DB"
      - doc: |-
          MigrateConfig parameterises [NewMigrator].

          It carries no directory, no file pattern and no naming convention, and the
          SDK ships no example migration tree. Migrations are values the consumer
          builds, because the moment the SDK reads a directory it has invented a
          convention every consumer must adopt (ADR 0055 §D8).
        name: MigrateConfig
        struct:
          fields:
            - doc: |-
                Migrations is the complete set this binary carries. Order does not
                matter — the runner sorts by Version — but every entry must be valid
                and no two may share a version.

                It is COPIED at construction, so a caller appending to their slice
                afterwards cannot change what the runner will apply.
              name: Migrations
              type: "[]coresql.MigrationValue"
            - doc: |-
                VersionTable names the bookkeeping table. Empty clamps to
                [DefaultVersionTable]; anything that is not a bare SQL identifier is
                REFUSED, because it is interpolated rather than bound.
              name: VersionTable
              type: string
            - doc: |-
                LockTimeout bounds the wait for the advisory lock. Non-positive clamps
                to [DefaultLockTimeout].
              name: LockTimeout
              type: time.Duration
            - doc: |-
                LockRetryInterval is how often the non-blocking acquisition is retried
                while another holder has the lock. Non-positive clamps to
                [DefaultLockRetryInterval].
              name: LockRetryInterval
              type: time.Duration
      - doc: |-
          InsertSpec is the statement [InsertRows] writes: the table, its columns
          in the order each row gives its values, and how many rows one statement
          carries at most.
        name: InsertSpec
        struct:
          fields:
            - doc: |-
                Table is the table the rows go into, interpolated as given — bare,
                or already quoted with [coresql.Dialect].QuoteIdent. Validate it
                first.
              name: Table
              type: string
            - doc: |-
                Columns are the table's columns each row gives a value for, in that
                order, interpolated as given like Table.
              name: Columns
              type: "[]string"
            - doc: |-
                PerStatement is how many rows one statement carries at most,
                clamped to the engine's bound-parameter ceiling divided by the
                number of columns; a non-positive one takes that ceiling.
              name: PerStatement
              type: int
      - doc: |-
          RetryConfig parameterises [NewRetrying]: how many times a root transaction
          may run, how long to wait between two runs, which failures earn another
          run, and the clock the waits are read from.

          Every field has a documented fallback (ADR 0031's clamp side): retrying a
          transaction the database asked to be run again has no dangerous zero.
        name: RetryConfig
        struct:
          fields:
            - doc: |-
                Attempts is how many times a root transaction may run in all, the
                first included: 1 runs it once and never again. A non-positive value
                clamps to [DefaultRetryAttempts].
              name: Attempts
              type: int
            - doc: |-
                Backoff is the curve of the waits between two attempts: the wait
                after the n-th failed attempt is Backoff.Delay(n). The zero value
                clamps to [DefaultRetryDelay] grown by 2 per attempt with full jitter;
                any other value is the caller's curve, as given — a BaseDelay of zero
                with a ceiling or a jitter is a caller's choice to retry at once.
              name: Backoff
              type: kbackoff.Value
            - doc: |-
                Transient decides which failures earn another attempt. A nil value
                clamps to [Classify]. A context's end never does, whatever Transient
                answers.
              name: Transient
              type: coresql.Transient
            - doc: |-
                Clock is the time source the waits are read from. A nil Clock falls
                back to clock.System; a test hands a ManualClock and advances it
                rather than sleeping.
              name: Clock
              type: clock.Timed
      - doc: |-
          Withheld carries a driver's error for errors.Is and errors.As while keeping
          its text out of Error().

          A driver describes the row a statement touched. PostgreSQL's unique
          violation says "Key (doc_key)=(…) already exists" and MySQL's says
          "Duplicate entry '…'": a document store's key is routinely an e-mail
          address, and a queue's row holds the caller's payload. So a package whose
          rows hold a caller's data joins the driver's error through Withheld, beside
          a verdict of its own — errors.Join, never errs.Wrap, so the verdict's code
          stays the origin (CLAUDE.md rule 6) — and no rendering of the joined error
          quotes a row (ADR 0139 §D7, ADR 0151 §D6). The cause stays one errors.As
          away for a caller who knows its driver, and what it may log.

          Error() says only what names no row: a context's end, in the context's own
          words; otherwise the driver error's Go type, with its SQLSTATE or its result
          code when a method offers one — a class of failure, never its subject.

          The verdict stays each package's own — docstore's STATEMENT_FAILED, queue's
          QUEUE_BACKEND_FAILED — since each package's errors are its own; what they
          share is only this rendering of somebody else's.
        methods:
          - doc: |-
              Error renders what can be said without the driver's words: a context's end
              in its own words, since those hold no data; otherwise the driver error's Go
              type, with its SQLSTATE or its result code when a method offers one.
            name: Error
            out:
              - type: string
            recv: value
          - doc: Unwrap hands errors.Is and errors.As the driver's own error.
            name: Unwrap
            out:
              - type: error
            recv: value
        name: Withheld
        struct:
          unexported: true
  - doc: |-
      Package sql is the public facade for the SDK's relational-database domain:
      transaction ownership, a pool policy, a health check and a migration runner,
      over the standard library's database/sql.

      It is NOT an ORM, and it never will be. There is no entity mapping, no query
      builder, no lazy loading and no repository generation — you write SQL, the
      SDK owns the transaction around it (ADR 0055).

      It also ships no driver. Import the one you want, open the pool yourself,
      and hand it over:

      	import _ "github.com/jackc/pgx/v5/stdlib"

      	pool, err := stdsql.Open("pgx", dsn)
      	dialect, err := sql.ParseDialect("postgres")

      	tm, err := sql.NewTransactor(sql.Config{
      		DB:      pool,
      		Dialect: dialect,
      		Pool:    sql.PoolConfig{MaxOpen: 20},
      	})

      # Who is allowed to commit

      Nobody but the manager. [Transact] hands your unit of work an [Executor] —
      Exec, Query, QueryRow, and deliberately nothing else. A helper that receives
      one CANNOT commit or roll back the transaction it was lent, because those
      methods do not exist on the type it was given:

      	err := sql.Transact(ctx, tm, func(ctx context.Context, ex sql.Executor) error {
      		if _, err := ex.ExecContext(ctx, "UPDATE accounts SET cents = cents - $1 WHERE id = $2", n, from); err != nil {
      			return err
      		}
      		return credit(ctx, ex, to, n) // credit cannot commit; it has no way to
      	})

      Returning nil commits. Returning an error rolls back and hands the error
      back to you unchanged, so errors.Is keeps working.

      # Nesting is a savepoint

      database/sql has no nested transactions. Call [Transact] with a context that
      already carries one and you get a SAVEPOINT of that transaction rather than
      a second connection deadlocking against the first:

      	_ = sql.Transact(ctx, tm, func(ctx context.Context, ex sql.Executor) error {
      		if err := mustHappen(ctx, ex); err != nil {
      			return err
      		}
      		// best-effort: if this fails, only ITS work is undone
      		if err := sql.Transact(ctx, tm, optional); err != nil {
      			log.Warn("optional step skipped", "err", err)
      		}
      		return nil
      	})

      Three consequences worth knowing before you rely on it:

        - Only postgres, mysql and sqlite are supported, because those three spell
          savepoints identically. SQL Server, Oracle and Db2 are refused BY NAME
          at [ParseDialect] — their nesting is a different algorithm, not a
          different string, and generating SQL that fails at the first nested
          transaction in production is not an option.
        - A failed nested scope does NOT condemn the outer transaction. ROLLBACK
          TO SAVEPOINT is precisely the statement that clears PostgreSQL's aborted
          state, so catching the inner error leaves you a usable transaction. If
          that statement itself fails, the transaction is poisoned: every later
          operation is refused and the commit never happens.
        - A nested call must pass the ZERO [TxOptions]. A savepoint cannot change
          isolation or read-only mode, and being handed a weaker transaction than
          you asked for under a nil error is worse than being told no.

      # Joining the caller's transaction, and waiting for its commit

      The transactor [NewTransactor] returns has three more capabilities, each an
      interface of its own beside [Transactor], found by type assertion (ADR 0139):

      	ex, inTx := tm.(sql.Joiner).Join(ctx)          // where a statement under ctx runs
      	held := tm.(sql.Deferrer).Defer(ctx, notify)    // notify runs once ctx's transaction commits
      	held = tm.(sql.Aborter).OnAbort(ctx, takeBack) // takeBack runs once ctx's work is undone

      [Joiner] answers the executor of the transaction ctx carries — so a
      repository called inside its caller's transaction reads what that
      transaction wrote — or the pool when it carries none. A context that
      outlived its transaction still names it, and its executor refuses rather
      than fall back to the pool. [Deferrer] holds a function until that
      transaction commits: a rollback drops it, and so does the rollback of the
      savepoint it was held in. It is how a message, a mail or a store's write
      hook waits for the work it announces to be committed. The SDK's document
      store over SQL is built on both. [Aborter] is the complement of [Deferrer]:
      it holds a function until that work is undone — the savepoint it was held
      in rolls back, or the transaction does not commit — and runs it then, on a
      context the rollback's cancellation does not reach; a commit drops it. It is
      how something announced before the commit is taken back when the commit
      never comes.

      # Migrations

      [NewMigrator] applies an ordered, versioned set under a lock that excludes
      every other runner and dies with its holder, so two instances starting
      together cannot apply the same migration twice and a runner killed mid-run
      leaves nothing held. On PostgreSQL and MySQL it is the session's advisory
      lock, which the server drops with the connection. On SQLite it is the
      database file's write lock (ADR 0140): the run is ONE transaction that takes
      it with its first statement, each migration a savepoint of it, and the
      operating system drops a dead process's file locks. A SQLite run needs a
      single connection, and a migration there cannot run what SQLite refuses
      inside a transaction — VACUUM, or PRAGMA journal_mode.

      Migrations are VALUES you build. The SDK ships no directory, no file format
      and no naming convention, because the moment it reads a directory it has
      invented one you did not choose:

      	m := sql.Migration{
      		Version: 20260910143000,
      		Name:    "create accounts",
      		Up:      sql.Statements("CREATE TABLE accounts (id BIGINT PRIMARY KEY, cents BIGINT NOT NULL)"),
      		Down:    sql.Statements("DROP TABLE accounts"),
      	}

      Each migration runs in its own transaction together with its version-table
      row, so on PostgreSQL and SQLite a failed migration rolls back BOTH halves
      and the database sits exactly at the previous version.

      On MySQL and MariaDB that guarantee does not hold, and it is not something
      this SDK can fix: DDL causes an IMPLICIT COMMIT, so a migration whose second
      statement fails leaves the first one applied while its version row is rolled
      back. Write ONE DDL statement per migration on MySQL and the failure is
      atomic by construction. See ADR 0055 D8.

      [Migrator].Plan is the dry run: it reports what [Migrator].Up would apply,
      applies nothing and takes no lock. [Irreversible] is how a migration says
      out loud that it cannot be rolled back — a nil Down is refused, because "I
      forgot the reversal" and "there is no reversal" are the same nil.

      # Errors

      Every failure is a typed SDK error joined with the driver's own, side by
      side, so neither question loses its answer:

      	errors.Is(err, sql.CommitFailed)              // the SDK's verdict
      	errs.HasCode(err, sql.CommitFailed.Code())    // the same, by code
      	errors.Is(err, driver.ErrBadConn)             // the driver's own

      The sentinels above are the matchable values; their Code() is the ADR 0005
      dotted quad. No Public message in this domain ever carries a connection
      string, a query or a bound argument.
    facade:
      - const:
          - doc: StatementExec is a statement that returns no rows.
            name: StatementExec
            reexport: coresql.StatementExec
            type: StatementKind
            typed: true
            value: "1"
          - doc: StatementQuery is a statement that returns rows.
            name: StatementQuery
            reexport: coresql.StatementQuery
            type: StatementKind
            typed: true
            value: "2"
          - doc: StatementPrepare is a statement compiled for repeated execution.
            name: StatementPrepare
            reexport: coresql.StatementPrepare
            type: StatementKind
            typed: true
            value: "3"
          - doc: StatementBegin is a transaction opened.
            name: StatementBegin
            reexport: coresql.StatementBegin
            type: StatementKind
            typed: true
            value: "4"
          - doc: StatementCommit is a transaction committed.
            name: StatementCommit
            reexport: coresql.StatementCommit
            type: StatementKind
            typed: true
            value: "5"
          - doc: StatementRollback is a transaction rolled back.
            name: StatementRollback
            reexport: coresql.StatementRollback
            type: StatementKind
            typed: true
            value: "6"
      - const:
          - doc: DialectPostgres is PostgreSQL 9.1+.
            name: DialectPostgres
            note: |-
              The three engines this SDK can spell. Each is re-exported individually
              rather than as one group: their values are FIXED by internal/core/data/sql and
              must equal it exactly, so an iota sequence here would be a second source of
              truth that silently diverges the day a dialect is inserted.
            reexport: coresql.DialectPostgres
            type: Dialect
            typed: true
            value: "1"
      - const:
          - doc: DialectMySQL is MySQL 5.7+ / MariaDB 10.x with InnoDB.
            name: DialectMySQL
            reexport: coresql.DialectMySQL
            type: Dialect
            typed: true
            value: "2"
      - const:
          - doc: |-
              DialectSQLite is SQLite 3.6.8+. It has no advisory lock, so [NewMigrator]
              serialises a run on the database file's write lock instead (ADR 0140).
            name: DialectSQLite
            reexport: coresql.DialectSQLite
            type: Dialect
            typed: true
            value: "3"
      - alias:
          - doc: |-
              Executor is the public alias for the read/write surface a statement runs
              against. *sql.DB, *sql.Tx and *sql.Conn all satisfy it with no adapter, and
              it deliberately carries no Commit, Rollback or Begin.
            name: Executor
            target: coresql.Executor
      - alias:
          - doc: |-
              Preparer is the public alias for the ADR 0039 sibling of [Executor]: an
              executor that can also prepare a statement. Discover it by type assertion.
            name: Preparer
            target: coresql.Preparer
      - alias:
          - doc: TxFunc is the public alias for a unit of work run inside a transaction.
            name: TxFunc
            target: coresql.TxFunc
      - alias:
          - doc: Transactor is the public alias for the transaction manager.
            name: Transactor
            target: coresql.Transactor
      - alias:
          - doc: |-
              Joiner is the public alias for the ADR 0039 sibling of [Transactor] that
              says where a statement issued under a context runs: in the transaction the
              context carries, or on the pool. Discover it by type assertion.
            name: Joiner
            target: coresql.Joiner
      - alias:
          - doc: |-
              Deferrer is the public alias for the ADR 0039 sibling of [Transactor] that
              holds a function until the transaction a context carries has committed, and
              drops it with a rollback. Discover it by type assertion.
            name: Deferrer
            target: coresql.Deferrer
      - alias:
          - doc: |-
              Aborter is the public alias for the ADR 0039 sibling of [Transactor] that
              holds a function until the work a context carries is undone — its
              savepoint or its transaction rolled back — and drops it with a commit: the
              complement of [Deferrer]. Discover it by type assertion.
            name: Aborter
            target: coresql.Aborter
      - alias:
          - doc: |-
              TxOptions is the public alias for one transaction's isolation and
              read-only-ness. The zero value defers to the driver.
            name: TxOptions
            target: coresql.TxOptionsValue
      - alias:
          - doc: Checker is the public alias for the bounded liveness probe.
            name: Checker
            target: coresql.Checker
      - alias:
          - doc: Migrator is the public alias for the schema-migration runner.
            name: Migrator
            target: coresql.Migrator
      - alias:
          - doc: |-
              Migration is the public alias for one versioned schema change and its
              reversal.
            name: Migration
            target: coresql.MigrationValue
      - alias:
          - doc: Step is the public alias for one direction of a migration.
            name: Step
            target: coresql.Step
      - alias:
          - doc: |-
              Dialect is the public alias for the closed set of SQL engines this SDK can
              spell. For SQL you write yourself, it spells the engine's vocabulary — the
              tokens the SDK's own statements are spelled with, never a statement:
              [Dialect].Placeholder renders a bind marker ($1 on PostgreSQL, ? on MySQL and
              SQLite), [Dialect].QuoteIdent a delimited name, its delimiter doubled
              inside, and [Dialect].ForUpdate and [Dialect].ForUpdateSkipLocked a row-lock
              clause, which SQLite — whose exclusion is its one write lock — renders as
              nothing. QuoteIdent validates nothing: check a name before you interpolate
              it. An unset Dialect renders no marker and no name, so a statement built
              from it fails rather than passing for another engine's.
            name: Dialect
            target: coresql.Dialect
      - alias:
          - doc: Config is the public alias for the parameters every port is built from.
            name: Config
            target: svcsql.Config
      - alias:
          - doc: PoolConfig is the public alias for the connection-pool policy.
            name: PoolConfig
            target: svcsql.PoolConfig
      - alias:
          - doc: MigrateConfig is the public alias for the migration runner's parameters.
            name: MigrateConfig
            target: svcsql.MigrateConfig
      - alias:
          - doc: |-
              Router is the public alias for the transactor's ADR 0039 sibling that
              routes a read — a read-only transaction, or a read outside one — to the
              read replica [Config].ReadReplica names.
            name: Router
            target: coresql.Router
      - alias:
          - doc: |-
              StatementObserver is the public alias for what watches the statements a
              pool sends: told when each begins, it answers the function told when it
              ends. It sees the SQL text, bounded, and never an argument or a row.
            name: StatementObserver
            target: coresql.StatementObserver
      - alias:
          - doc: StatementKind is the public alias for what a StatementObserver is told about.
            name: StatementKind
            target: coresql.StatementKind
      - alias:
          - doc: |-
              RetryConfig is the public alias for a retrying transactor's parameters:
              its attempts, its backoff curve, its classifier and its clock.
            name: RetryConfig
            target: svcsql.RetryConfig
      - alias:
          - doc: |-
              InsertSpec is the public alias for the statement InsertRows writes: the
              table, its columns, and how many rows one statement carries at most.
            name: InsertSpec
            target: svcsql.InsertSpec
      - alias:
          - doc: |-
              Transient is the public alias for the verdict on a failed transaction:
              true when the database asks for the whole transaction to run again.
            name: Transient
            target: coresql.Transient
      - alias:
          - doc: |-
              Backoff is the public alias for the exponential curve a retrying
              transactor waits on between two attempts (the SDK's one backoff curve,
              ADR 0103).
            name: Backoff
            target: kbackoff.Value
      - var:
          - doc: |-
              UnknownDialect is returned by ParseDialect for a name this SDK has
              never heard of.
            name: UnknownDialect
            reexport: coresql.UnknownDialect
            type: "*errs.Error"
          - doc: |-
              DialectRefused is returned by ParseDialect for an engine this SDK
              recognises and declines. The reason travels in a field.
            name: DialectRefused
            reexport: coresql.DialectRefused
            type: "*errs.Error"
          - doc: |-
              NestedIsolation is returned when a nested Transact asks for isolation
              or read-only mode a savepoint cannot provide.
            name: NestedIsolation
            reexport: coresql.NestedIsolation
            type: "*errs.Error"
          - doc: |-
              InvalidMigration is returned for a migration with version 0, an empty
              name, a nil Up or a nil Down.
            name: InvalidMigration
            reexport: coresql.InvalidMigration
            type: "*errs.Error"
          - doc: MigrationIrreversible is what the Irreversible step returns.
            name: MigrationIrreversible
            reexport: coresql.MigrationIrreversible
            type: "*errs.Error"
          - doc: |-
              ConfigInvalid is returned by every constructor for a Config that could
              never produce a working port.
            name: ConfigInvalid
            reexport: coresql.ConfigInvalid
            type: "*errs.Error"
          - doc: |-
              PoolMisconfigured refuses a pool policy whose zero value database/sql
              would read as a decision nobody made — a non-positive MaxOpen.
            name: PoolMisconfigured
            reexport: coresql.PoolMisconfigured
            type: "*errs.Error"
          - doc: BeginFailed reports a transaction the driver would not open.
            name: BeginFailed
            reexport: coresql.BeginFailed
            type: "*errs.Error"
          - doc: CommitFailed reports a transaction that had NO effect.
            name: CommitFailed
            reexport: coresql.CommitFailed
            type: "*errs.Error"
          - doc: RollbackFailed travels alongside the error that triggered the rollback.
            name: RollbackFailed
            reexport: coresql.RollbackFailed
            type: "*errs.Error"
          - doc: |-
              SavepointFailed reports a rejected savepoint statement; the "statement"
              field names which of the three.
            name: SavepointFailed
            reexport: coresql.SavepointFailed
            type: "*errs.Error"
          - doc: |-
              TxPoisoned refuses every operation on a transaction whose savepoint
              rollback failed. It is never committed.
            name: TxPoisoned
            reexport: coresql.TxPoisoned
            type: "*errs.Error"
          - doc: |-
              TxClosed reports an Executor used after the scope that lent it
              returned.
            name: TxClosed
            reexport: coresql.TxClosed
            type: "*errs.Error"
          - doc: |-
              HealthCheckFailed reports a database that answered the probe with an
              error.
            name: HealthCheckFailed
            reexport: coresql.HealthCheckFailed
            type: "*errs.Error"
          - doc: HealthCheckTimeout reports a database that did not answer in time.
            name: HealthCheckTimeout
            reexport: coresql.HealthCheckTimeout
            type: "*errs.Error"
          - doc: |-
              MigrationFailed reports a migration that did not apply; it was rolled
              back.
            name: MigrationFailed
            reexport: coresql.MigrationFailed
            type: "*errs.Error"
          - doc: |-
              MigrationOutOfOrder refuses a pending migration older than one already
              applied.
            name: MigrationOutOfOrder
            reexport: coresql.MigrationOutOfOrder
            type: "*errs.Error"
          - doc: |-
              MigrationLockUnsupported refuses a Migrator on a dialect with no lock
              that dies with its holder. No dialect this SDK speaks answers it since
              SQLite's runner serialises on its file's write lock (ADR 0140).
            name: MigrationLockUnsupported
            reexport: coresql.MigrationLockUnsupported
            type: "*errs.Error"
          - doc: |-
              MigrationLockTimeout reports another process holding the migration lock
              for the whole budget. Nothing was applied.
            name: MigrationLockTimeout
            reexport: coresql.MigrationLockTimeout
            type: "*errs.Error"
          - doc: |-
              MigrationUnknownVersion refuses a Down over a version this build does
              not carry.
            name: MigrationUnknownVersion
            reexport: coresql.MigrationUnknownVersion
            type: "*errs.Error"
          - doc: |-
              VersionTableInvalid refuses a version-table name that is not a plain
              SQL identifier.
            name: VersionTableInvalid
            reexport: coresql.VersionTableInvalid
            type: "*errs.Error"
          - doc: DuplicateMigration refuses two migrations declaring the same version.
            name: DuplicateMigration
            reexport: coresql.DuplicateMigration
            type: "*errs.Error"
          - doc: |-
              MigrationChanged refuses a run over an applied migration whose
              statements were edited after they ran. Nothing was applied.
            name: MigrationChanged
            reexport: coresql.MigrationChanged
            type: "*errs.Error"
          - doc: |-
              TxRetriesExhausted is joined with the last attempt's error when every
              attempt of a retrying transactor failed on a transient error.
            name: TxRetriesExhausted
            reexport: coresql.TxRetriesExhausted
            type: "*errs.Error"
          - doc: |-
              StatementTimedOut is joined with the driver's error when a statement
              outlived the transactor's statement budget.
            name: StatementTimedOut
            reexport: coresql.StatementTimedOut
            type: "*errs.Error"
      - func:
          doc: |-
            ParseDialect resolves a dialect name and never guesses. A recognised but
            unsupported engine returns [DialectRefused] carrying why; an unrecognised
            one returns [UnknownDialect].
          forward: coresql.ParseDialect
          in:
            - name: name
              type: string
          name: ParseDialect
          out:
            - name: dialect
              type: Dialect
            - name: err
              type: error
      - func:
          doc: |-
            Irreversible is the [Step] a migration assigns to Down to declare, out loud,
            that it cannot be reversed.
          forward: coresql.Irreversible
          in:
            - name: ctx
              type: context.Context
            - name: ex
              type: Executor
          name: Irreversible
          out:
            - type: error
      - func:
          doc: |-
            NewTransactor returns the transaction manager for cfg.DB, applying
            cfg.Pool to it.
          forward: svcsql.NewTransactor
          in:
            - name: cfg
              type: Config
          name: NewTransactor
          out:
            - name: manager
              type: Transactor
            - name: err
              type: error
      - func:
          doc: NewChecker returns a liveness probe bounded by cfg.CheckTimeout.
          forward: svcsql.NewChecker
          in:
            - name: cfg
              type: Config
          name: NewChecker
          out:
            - name: probe
              type: Checker
            - name: err
              type: error
      - func:
          doc: |-
            NewMigrator returns the migration runner. Every migration execution is
            serialised: on the session's advisory lock where the engine has one
            (PostgreSQL, MySQL), and on the database file's write lock on SQLite,
            which has none (ADR 0140). No dialect the SDK speaks is refused for the
            lock.
          forward: svcsql.NewMigrator
          in:
            - name: cfg
              type: Config
            - name: mig
              type: MigrateConfig
          name: NewMigrator
          out:
            - name: runner
              type: Migrator
            - name: err
              type: error
      - func:
          doc: |-
            Each iterates rows with scan and closes them when the iteration ends; a
            failure is yielded once, last. It is the Next/Scan/Err/Close loop, written
            once.
          forward: svcsql.Each
          in:
            - name: rows
              type: "*stdsql.Rows"
            - name: scan
              type: func(*stdsql.Rows) (T, error)
          name: Each
          out:
            - type: iter.Seq2[T, error]
          typeParams:
            - constraint: any
              name: T
      - func:
          doc: |-
            InsertRows inserts rows into into.Table in multi-row statements of at
            most into.PerStatement rows, clamped to the engine's bound-parameter
            ceiling, and returns how many rows were inserted. into.Table and
            into.Columns are interpolated as given: validate them first.
          forward: svcsql.InsertRows
          in:
            - name: ctx
              type: context.Context
            - name: ex
              type: Executor
            - name: d
              type: Dialect
            - name: into
              type: InsertSpec
            - name: rows
              type: "[][]any"
          name: InsertRows
          out:
            - name: inserted
              type: int64
            - name: err
              type: error
      - func:
          doc: |-
            Observe returns c with obs told about every statement its connections
            send — exec, query, prepare, BEGIN, COMMIT, ROLLBACK —, the SQL text
            bounded and never an argument. Open the pool over it:
            stdsql.OpenDB(sql.Observe(connector, obs)). A nil obs returns c.
          forward: svcsql.Observe
          in:
            - name: c
              type: driver.Connector
            - name: obs
              type: StatementObserver
          name: Observe
          out:
            - type: driver.Connector
      - func:
          doc: |-
            SlowQueries returns an observer that logs at Warn each statement that took
            threshold or longer on clk — its SQL text, duration and rows, never an
            argument.
          forward: svcsql.SlowQueries
          in:
            - name: threshold
              type: time.Duration
            - name: log
              type: corelogger.Logger
            - name: clk
              type: clock.Clock
          name: SlowQueries
          out:
            - type: StatementObserver
      - func:
          doc: |-
            Traced returns an observer that opens one client span per statement,
            its status following the statement's error.
          forward: svcsql.Traced
          in:
            - name: tracer
              type: coretrace.Tracer
          name: Traced
          out:
            - type: StatementObserver
      - func:
          doc: |-
            Classify reports whether err is a failure the database documents as "run
            the transaction again": SQLSTATE 40001 or 40P01, or SQLite's BUSY or
            LOCKED. A context's end never is.
          forward: svcsql.Classify
          in:
            - name: err
              type: error
          name: Classify
          out:
            - type: bool
      - func:
          doc: |-
            NewRetrying returns a transactor that runs a root transaction of tm again
            on a failure cfg.Transient calls transient, up to cfg.Attempts runs, on
            cfg.Backoff's curve. A nested call is never run again on its own. The
            unit of work must be safe to run more than once.
          forward: svcsql.NewRetrying
          in:
            - name: tm
              type: Transactor
            - name: cfg
              type: RetryConfig
          name: NewRetrying
          out:
            - name: manager
              type: Transactor
            - name: err
              type: error
      - func:
          doc: |-
            ChecksumOf is the fingerprint a [Migration] built from stmts records in its
            Checksum: SHA-256 over the statements, each length-prefixed, in lowercase
            hex. Set it from the same statements Up runs, and an applied migration
            edited afterwards is refused with [MigrationChanged] instead of being
            called applied by its number alone.
          forward: svcsql.ChecksumOf
          in:
            - name: stmts
              type: string
          name: ChecksumOf
          out:
            - type: string
          variadic: true
      - func:
          doc: |-
            Statements returns a [Step] that runs the given statements in order on the
            transaction's executor.

            It is the smallest useful helper and deliberately not a file loader: it
            invents no directory layout, no naming convention and no parser. Where the
            text comes from — a literal, an embed.FS, a generator — stays yours.
          forward: svcsql.Statements
          in:
            - name: stmts
              type: string
          name: Statements
          out:
            - type: Step
          variadic: true
    functions:
      - doc: |-
          Transact runs fn inside a transaction with the driver's default isolation.

          It is the ergonomic form of [Transactor].Transact for the common case. The
          port itself keeps the options parameter so it never needs a second method
          (ADR 0039); this helper keeps the call site short.
        in:
          - name: ctx
            type: context.Context
          - name: tm
            type: Transactor
          - name: fn
            type: TxFunc
        name: Transact
        out:
          - type: error
    imports:
      coresql: github.com/kitsunium/sdk/internal/core/data/sql
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
      driver: database/sql/driver
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
      stdsql: database/sql
      svcsql: github.com/kitsunium/sdk/internal/service/data/sql
    path: github.com/kitsunium/sdk/pkg/v1/data/sql
