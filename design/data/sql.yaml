apiVersion: kit.kitsunium/design/v2
domain: data/sql
packages:
  - codes:
      - const:
          - doc: CodeUnknownDialect identifies a dialect name this SDK has never heard of.
            name: CodeUnknownDialect
            note: "range: 0.2.24.0 - 0.2.24.255"
            value: "0x00_02_18_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDialectRefused identifies a dialect this SDK RECOGNISES and declines,
              because its savepoint grammar is a different algorithm rather than a
              different string. The reason travels in a field.
            name: CodeDialectRefused
            value: "0x00_02_18_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeNestedIsolation identifies a nested Transact that asked for an
              isolation level or read-only-ness a savepoint cannot provide.
            name: CodeNestedIsolation
            value: "0x00_02_18_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidMigration identifies a migration that could never run: version
              zero, an empty name, a nil Up, or a nil Down.
            name: CodeInvalidMigration
            value: "0x00_02_18_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationIrreversible identifies a Down refused because the caller
              declared the migration irreversible with the Irreversible step.
            name: CodeMigrationIrreversible
            value: "0x00_02_18_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigInvalid identifies a constructor refused because the Config could
              never produce a working port: a nil *sql.DB or an unusable Dialect.
            name: CodeConfigInvalid
            note: |-
              range: 0.3.54.0 - 0.3.54.255 — the run outcomes of the transaction manager,
              the health probe and the migration runner, allocated by the service layer
              (LL = 3) and declared here since ADR 0160: a code keeps the value its layer
              allocated when its declaration moves.
            value: "0x00_03_36_01"
        type: errs.Code
      - const:
          - doc: |-
              CodePoolMisconfigured identifies a pool policy the SDK refuses to apply
              because the value database/sql would read is not the one the caller meant.
            name: CodePoolMisconfigured
            value: "0x00_03_36_02"
        type: errs.Code
      - const:
          - doc: CodeBeginFailed identifies a transaction the driver would not open.
            name: CodeBeginFailed
            value: "0x00_03_36_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCommitFailed identifies a transaction whose COMMIT was rejected. The
              unit of work did NOT take effect.
            name: CodeCommitFailed
            value: "0x00_03_36_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeRollbackFailed identifies a ROLLBACK the driver refused. It travels
              alongside the error that triggered the rollback, never instead of it.
            name: CodeRollbackFailed
            value: "0x00_03_36_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeSavepointFailed identifies a SAVEPOINT, RELEASE SAVEPOINT or ROLLBACK
              TO SAVEPOINT statement the engine rejected.
            name: CodeSavepointFailed
            value: "0x00_03_36_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeTxPoisoned identifies an operation refused because the transaction can
              no longer be trusted: its savepoint rollback failed, so the engine's state
              is unknown and nothing more may be committed on it.
            name: CodeTxPoisoned
            value: "0x00_03_36_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeTxClosed identifies an Executor used after the scope that lent it
              returned.
            name: CodeTxClosed
            value: "0x00_03_36_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeHealthCheckFailed identifies a liveness probe the database answered
              with an error.
            name: CodeHealthCheckFailed
            value: "0x00_03_36_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeHealthCheckTimeout identifies a liveness probe that did not answer
              within its budget.
            name: CodeHealthCheckTimeout
            value: "0x00_03_36_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationFailed identifies a migration step, or its version-table
              bookkeeping, that failed. The transaction was rolled back.
            name: CodeMigrationFailed
            value: "0x00_03_36_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationOutOfOrder identifies a pending migration whose version is
              lower than one already applied — the two-branches-merged hazard.
            name: CodeMigrationOutOfOrder
            value: "0x00_03_36_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationLockUnsupported identifies a Migrator refused at construction
              because the dialect offers no lock that dies with its holder. No dialect the
              SDK speaks answers it since ADR 0140.
            name: CodeMigrationLockUnsupported
            value: "0x00_03_36_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationLockTimeout identifies a migration run abandoned because
              another holder kept the lock for the whole budget.
            name: CodeMigrationLockTimeout
            value: "0x00_03_36_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeMigrationUnknownVersion identifies a version recorded in the database
              that this binary carries no migration for — so it cannot be reversed.
            name: CodeMigrationUnknownVersion
            value: "0x00_03_36_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionTableInvalid identifies a version-table name that cannot be
              interpolated into SQL safely. Identifiers cannot be bound as parameters.
            name: CodeVersionTableInvalid
            value: "0x00_03_36_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateMigration identifies two migrations declaring the same
              version.
            name: CodeDuplicateMigration
            value: "0x00_03_36_11"
        type: errs.Code
    constants:
      - name: DialectUnknown
        type: Dialect
        value: "0"
      - name: DialectPostgres
        type: Dialect
        value: "1"
      - name: DialectMySQL
        type: Dialect
        value: "2"
      - name: DialectSQLite
        type: Dialect
        value: "3"
    functions:
      - in:
          - name: name
            type: string
        name: ParseDialect
        out:
          - name: dialect
            type: Dialect
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: ex
            type: Executor
        name: Irreversible
        out:
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      stdsql: database/sql
    path: github.com/kitsunium/sdk/internal/core/data/sql
    ports:
      - doc: |-
          Executor is the surface a statement runs against: a pool, a connection, or
          a transaction. Implementations MUST be safe for concurrent use, with the
          documented exception of a transaction-scoped executor, which is confined to
          its scope (see internal/service/data/sql).

          The method set is a strict SUBSET of what *sql.DB, *sql.Tx and *sql.Conn
          already expose, so all three satisfy this port with no adapter. That is the
          point: the SDK is not wrapping database/sql, it is naming the part of it a
          caller should be allowed to reach.

          It is FROZEN at three methods. pkg/v1/data/sql aliases it, so under ADR 0039 a
          fourth method would break every downstream double at compile time with no
          deprecation window. New capabilities arrive as SIBLING interfaces the
          implementation is type-asserted for — [Preparer] is the first.

          # What is deliberately absent

          There is no Commit, no Rollback and no Begin. A function that receives an
          Executor therefore CANNOT end the transaction it was handed: the method does
          not exist, so the mistake does not compile. Ownership of a transaction stays
          with the [Transactor] that opened it (ADR 0055 §D3).
        methods:
          - doc: ExecContext runs a statement that returns no rows.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: ExecContext
            out:
              - type: stdsql.Result
              - type: error
            variadic: true
          - doc: QueryContext runs a statement that returns rows. The caller closes them.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: QueryContext
            out:
              - type: "*stdsql.Rows"
              - type: error
            variadic: true
          - doc: QueryRowContext runs a statement expected to return at most one row.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
              - name: args
                type: any
            name: QueryRowContext
            out:
              - type: "*stdsql.Row"
            variadic: true
        name: Executor
      - doc: |-
          Preparer is the first ADR 0039 sibling of [Executor]: an executor that can
          also prepare a statement for repeated execution. Discover it by type
          assertion rather than by widening Executor.

          *sql.DB, *sql.Tx and *sql.Conn all satisfy it; a transaction-scoped executor
          does too, and the prepared statement it returns is bound to that
          transaction and dies with it.
        methods:
          - doc: PrepareContext compiles a statement. The caller closes it.
            in:
              - name: ctx
                type: context.Context
              - name: query
                type: string
            name: PrepareContext
            out:
              - type: "*stdsql.Stmt"
              - type: error
        name: Preparer
      - doc: |-
          Transactor owns transactions. Implementations MUST be safe for concurrent
          use.

          It is FROZEN at one method, and the options travel in a struct rather than
          as a second method, precisely so the port never needs a sibling for
          "Transact, but read-only" (ADR 0039).

          IFACE-PLUGIN: the concrete manager stays unexported behind its constructor
          in internal/service/data/sql.
        methods:
          - doc: |-
              Transact runs fn inside a transaction and commits when fn returns nil.

              If ctx already carries a transaction opened by THIS Transactor, fn runs
              inside a SAVEPOINT of that transaction instead of a new one, and opts
              must be the zero value — a savepoint cannot change isolation or
              read-only-ness, so asking for either is refused with [NestedIsolation]
              rather than silently ignored (ADR 0055 §D5).

              A panic inside fn is NOT recovered: the deferred rollback still runs,
              and the panic reaches the caller with its original stack.
            in:
              - name: ctx
                type: context.Context
              - name: opts
                type: TxOptionsValue
              - name: fn
                type: TxFunc
            name: Transact
            out:
              - type: error
        name: Transactor
      - doc: |-
          Joiner is an ADR 0039 sibling of [Transactor]: a transactor that says where
          a statement issued under a context runs. Discover it by type assertion; the
          SDK's own transactor implements it.

          It is what lets a callee JOIN the transaction its caller opened instead of
          opening a second one. A second transaction takes a second connection, does
          not see the caller's uncommitted writes, and under a pool of one waits
          forever for the connection its own caller holds (ADR 0139).
        methods:
          - doc: |-
              Join returns the executor a statement issued under ctx runs on.

              When ctx carries a transaction THIS transactor opened, that is the
              executor of the innermost scope ctx names, and inTx is true. It is
              valid only while that scope runs and refuses afterwards: a context
              that outlived its transaction must not fall back to the pool, where
              its statements would run outside the transaction they were written
              for.

              When ctx carries none — no transaction, or only another transactor's —
              it is the pool, outside any transaction, and inTx is false.
            in:
              - name: ctx
                type: context.Context
            name: Join
            out:
              - name: ex
                type: Executor
              - name: inTx
                type: bool
        name: Joiner
      - doc: |-
          Deferrer is an ADR 0039 sibling of [Transactor]: a transactor that holds a
          function until the transaction a context carries has committed. Discover it
          by type assertion; the SDK's own transactor implements it.

          It is how an effect that must not happen for work that is rolled back — a
          store's write hooks, a message, a mail — waits for the commit (ADR 0139).
        methods:
          - doc: |-
              Defer holds fn until the transaction ctx carries for this transactor
              commits, and reports true.

              The held functions run once, in the order they were held, on the
              goroutine that commits, after the commit and before the outermost
              Transact returns. A rollback drops them, and so does the rollback of
              the savepoint they were held in; a savepoint that is released hands
              them to the scope around it. A panic in one reaches the caller of the
              outermost Transact after the commit stood, and the functions held after
              it do not run.

              Defer reports false and holds nothing when ctx carries no open
              transaction of this transactor. There is no commit to wait for, so fn
              is the caller's again, usually to run at once. A nil fn holds nothing
              and gets the same answer.
            in:
              - name: ctx
                type: context.Context
              - name: fn
                type: func()
            name: Defer
            out:
              - name: held
                type: bool
        name: Deferrer
      - doc: |-
          Checker reports whether the database is reachable. Implementations MUST be
          safe for concurrent use.
        methods:
          - doc: |-
              Check probes the database under a bounded budget and returns nil when
              it answered. A non-nil error is always typed and never carries the
              connection string.
            in:
              - name: ctx
                type: context.Context
            name: Check
            out:
              - type: error
        name: Checker
      - doc: |-
          Migrator applies an ordered, versioned set of [MigrationValue] to a schema,
          under mutual exclusion. Implementations MUST be safe for concurrent use, and
          MUST be safe against a SECOND PROCESS running the same migrations at the
          same instant.

          IFACE-PLUGIN: the concrete runner stays unexported behind its constructor in
          internal/service/data/sql.
        methods:
          - doc: |-
              Plan reports what Up would apply, in the order it would apply it,
              WITHOUT applying anything and without taking the migration lock. It is
              the dry run: a read of the version table and a set difference.
            in:
              - name: ctx
                type: context.Context
            name: Plan
            out:
              - type: "[]MigrationValue"
              - type: error
          - doc: |-
              Up applies every pending migration in ascending version order, each in
              its own transaction, under the migration lock.
            in:
              - name: ctx
                type: context.Context
            name: Up
            out:
              - type: error
          - doc: |-
              Down reverses every applied migration whose version is STRICTLY GREATER
              than target, in descending order, each in its own transaction, under the
              migration lock. Down(ctx, 0) reverses everything.
            in:
              - name: ctx
                type: context.Context
              - name: target
                type: uint64
            name: Down
            out:
              - type: error
        name: Migrator
    sentinels:
      - var:
          - code: CodeUnknownDialect
            doc: |-
              UnknownDialect is returned by ParseDialect for a name that is in
              neither the accepted nor the refused set.
            name: UnknownDialect
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/sql: dialect name is not in the accepted set (postgres, mysql, sqlite); the field carries the name"
            public: The SQL dialect is not one this SDK supports
            reason: UNKNOWN_DIALECT
          - code: CodeDialectRefused
            doc: |-
              DialectRefused is returned by ParseDialect for an engine this SDK
              recognises and declines. It is a DIFFERENT answer from UnknownDialect:
              a caller debugging a refusal needs to know whether their engine is
              unheard-of or known-and-declined, because only the second one comes
              with a reason they can evaluate.
            name: DialectRefused
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/sql: the engine's savepoint grammar is a different algorithm, not a different string; the reason field says which"
            public: That SQL engine is recognised and deliberately not supported
            reason: DIALECT_REFUSED
          - code: CodeNestedIsolation
            doc: |-
              NestedIsolation is returned when a nested Transact asks for non-zero
              options. A nested scope is a SAVEPOINT inside an already-open
              transaction, and a savepoint changes neither the isolation level nor
              the read-only-ness of that transaction. Honouring the request is
              impossible; ignoring it would hand the caller a weaker transaction than
              the one they asked for, under a nil error.
            name: NestedIsolation
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/sql: a nested scope is a savepoint; open the outer transaction with the options instead"
            public: A nested transaction cannot change isolation or read-only mode
            reason: NESTED_ISOLATION
          - code: CodeInvalidMigration
            doc: |-
              InvalidMigration is returned for a migration that could never run. The
              "missing" field names which half is absent.
            name: InvalidMigration
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/sql: migration has version 0, an empty name, a nil Up or a nil Down; the missing field names which"
            public: The migration is not runnable and was refused
            reason: INVALID_MIGRATION
          - code: CodeMigrationIrreversible
            doc: |-
              MigrationIrreversible is what the Irreversible step returns. It is the
              caller's own declaration coming back at them, not a defect the SDK
              found — which is why it reads as a statement about the migration rather
              than about the runner.
            name: MigrationIrreversible
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/sql: Down is the Irreversible step; reversing it requires a new forward migration"
            public: That migration was declared irreversible and cannot be rolled back
            reason: MIGRATION_IRREVERSIBLE
          - code: CodeConfigInvalid
            doc: |-
              ConfigInvalid is returned by every constructor in
              internal/service/data/sql for a Config that could never produce a
              working port.
            name: ConfigInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: Config has a nil DB or an unusable Dialect; the missing field names which"
            public: The SQL configuration is incomplete and was refused
            reason: CONFIG_INVALID
          - code: CodePoolMisconfigured
            doc: |-
              PoolMisconfigured is returned when a pool field's zero value would be
              read by database/sql as a policy nobody chose. MaxOpen is the case that
              matters: database/sql reads 0 as UNLIMITED, and "as many connections as
              the application happens to want" is a decision made by forgetting a
              line, not by taking one (ADR 0031's refusal side).
            name: PoolMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: a non-positive MaxOpen means unlimited in database/sql; state the ceiling explicitly"
            public: The connection-pool policy is not one this SDK will apply
            reason: POOL_MISCONFIGURED
          - code: CodeBeginFailed
            doc: |-
              BeginFailed is joined with the driver's error when a transaction could
              not be opened. Nothing ran.
            name: BeginFailed
            options:
              - errs.WithExitCode(exitTempFail)
              - errs.WithHTTPStatus(httpUnavailable)
            private: "service/data/sql: BeginTx failed; the driver error travels beside this one under errors.Join"
            public: The database refused to open a transaction
            reason: BEGIN_FAILED
          - code: CodeCommitFailed
            doc: |-
              CommitFailed is joined with the driver's error when COMMIT was
              rejected. It says the unit of work did NOT take effect, which is the
              one fact a caller must not have to infer.
            name: CommitFailed
            options:
              - errs.WithExitCode(exitTempFail)
              - errs.WithHTTPStatus(httpUnavailable)
            private: "service/data/sql: COMMIT was rejected; the driver error travels beside this one under errors.Join"
            public: The transaction could not be committed and had no effect
            reason: COMMIT_FAILED
          - code: CodeRollbackFailed
            doc: |-
              RollbackFailed travels ALONGSIDE the error that triggered the rollback,
              never instead of it. A teardown that also breaks is a second defect,
              and reporting only it would hide the first — the rule ADR 0050 wrote
              for UnwindFailed, applied to the same shape one layer down.
            name: RollbackFailed
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/data/sql: ROLLBACK was rejected; the connection is discarded by database/sql"
            public: Rolling the transaction back did not complete cleanly
            reason: ROLLBACK_FAILED
          - code: CodeSavepointFailed
            doc: |-
              SavepointFailed is returned when SAVEPOINT, RELEASE SAVEPOINT or
              ROLLBACK TO SAVEPOINT is rejected. The "statement" field names which of
              the three, because the consequences differ: a failed SAVEPOINT means
              the nested scope never started, while a failed ROLLBACK TO means the
              engine's state is unknown and the transaction is poisoned.
            name: SavepointFailed
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/data/sql: the statement field names which of SAVEPOINT / RELEASE / ROLLBACK TO failed"
            public: A savepoint statement was rejected by the database
            reason: SAVEPOINT_FAILED
          - code: CodeTxPoisoned
            doc: |-
              TxPoisoned refuses every further operation on a transaction whose
              savepoint rollback failed.

              This is the answer to "does a failed sub-transaction condemn the outer
              one?". Normally NO: ROLLBACK TO SAVEPOINT is precisely the statement
              that clears PostgreSQL's aborted state, so a caught inner failure
              leaves a usable transaction. But when that statement ITSELF fails, the
              engine's state is no longer known, and continuing would commit a
              transaction containing work the SDK believes it undid.
            name: TxPoisoned
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/data/sql: a savepoint rollback failed, so the engine state is unknown; the whole transaction is abandoned"
            public: The transaction is no longer usable and will not be committed
            reason: TX_POISONED
          - code: CodeTxClosed
            doc: |-
              TxClosed is returned when an Executor is used after the scope that lent
              it returned. database/sql would answer ErrTxDone for a finished
              transaction and would EXECUTE for a nested scope whose outer
              transaction is still open — the second case is the one worth catching.
            name: TxClosed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: the Executor outlived its Transact scope; it is valid only for the duration of the call"
            public: That transaction handle is no longer valid
            reason: TX_CLOSED
          - code: CodeHealthCheckFailed
            doc: |-
              HealthCheckFailed is joined with the driver's error when the probe was
              answered with a failure.
            name: HealthCheckFailed
            options:
              - errs.WithExitCode(exitTempFail)
              - errs.WithHTTPStatus(httpUnavailable)
            private: "service/data/sql: PingContext returned an error; the driver error travels beside this one under errors.Join"
            public: The database is not reachable
            reason: HEALTH_CHECK_FAILED
          - code: CodeHealthCheckTimeout
            doc: |-
              HealthCheckTimeout is returned when the probe did not answer inside its
              budget. It is a separate code from HealthCheckFailed because a database
              that refuses is a different operational fact from one that hangs, and a
              readiness endpoint routes on the difference.
            name: HealthCheckTimeout
            options:
              - errs.WithExitCode(exitTempFail)
              - errs.WithHTTPStatus(httpUnavailable)
            private: "service/data/sql: the probe budget expired; the ping goroutine is abandoned, never killed"
            public: The database did not answer the health check in time
            reason: HEALTH_CHECK_TIMEOUT
          - code: CodeMigrationFailed
            doc: |-
              MigrationFailed is joined with the step's own error when a migration or
              its bookkeeping row fails. The transaction was rolled back, so neither
              the schema change nor the version row took effect — except on engines
              with non-transactional DDL, which is stated in the package doc rather
              than papered over.
            name: MigrationFailed
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/data/sql: version+direction fields; step error joined; on MySQL DDL commits implicitly, so a failed step can leave the schema change applied WITHOUT its version row (ADR 0055 D8)"
            public: A migration did not apply and was rolled back
            reason: MIGRATION_FAILED
          - code: CodeMigrationOutOfOrder
            doc: |-
              MigrationOutOfOrder refuses a pending migration whose version is lower
              than one already applied. It is the two-branches-merged hazard: both
              branches numbered from the same base, one shipped first, and the other
              would now apply UNDER it — producing a schema that matches neither
              branch's expectation and a version table that cannot express what
              happened.
            name: MigrationOutOfOrder
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: renumber the migration above the highest applied version; the fields carry both"
            public: A pending migration is older than one already applied
            reason: MIGRATION_OUT_OF_ORDER
          - code: CodeMigrationLockUnsupported
            doc: |-
              MigrationLockUnsupported is the refusal of a Migrator over a dialect
              that offers no lock dying with its holder — never a run without one: a
              runner that silently drops mutual exclusion is at its most dangerous
              exactly when two instances start together, which is the case it exists
              for.

              No dialect the SDK speaks answers it since ADR 0140: PostgreSQL and
              MySQL serialise on the session's advisory lock, SQLite on the database
              file's write lock. It stays defined because it is published, and a
              caller matching it would otherwise stop compiling.
            name: MigrationLockUnsupported
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: the dialect offers neither a session-scoped advisory lock nor a database-file lock; wire your own exclusion"
            public: That dialect has no advisory lock, so migrations cannot be serialised
            reason: MIGRATION_LOCK_UNSUPPORTED
          - code: CodeMigrationLockTimeout
            doc: |-
              MigrationLockTimeout is returned when another holder kept the migration
              lock for the whole budget. Nothing was applied.
            name: MigrationLockTimeout
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/data/sql: the advisory lock was held throughout the budget; no migration was applied"
            public: Another process is running migrations and did not finish in time
            reason: MIGRATION_LOCK_TIMEOUT
          - code: CodeMigrationUnknownVersion
            doc: |-
              MigrationUnknownVersion refuses a Down over a version the running
              binary has no migration for. The database is ahead of the code, and
              reversing a change whose Down is not present would be guessing.
            name: MigrationUnknownVersion
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: Down cannot reverse a version with no Step; deploy the build that owns it"
            public: The database records a migration this build does not carry
            reason: MIGRATION_UNKNOWN_VERSION
          - code: CodeVersionTableInvalid
            doc: |-
              VersionTableInvalid refuses a version-table name that is not a bare SQL
              identifier. A table name cannot be a bound parameter, so it is
              interpolated — which makes validating it the only thing between a
              configuration string and an injection.
            name: VersionTableInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: an identifier cannot be bound as a parameter, so only [A-Za-z_][A-Za-z0-9_]* is accepted"
            public: The version-table name is not a plain SQL identifier
            reason: VERSION_TABLE_INVALID
          - code: CodeDuplicateMigration
            doc: |-
              DuplicateMigration refuses two migrations declaring the same version.
              The version IS the identity, so a duplicate makes "has this been
              applied?" unanswerable.
            name: DuplicateMigration
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/sql: a version identifies a migration; the field carries the duplicated value"
            public: Two migrations declare the same version
            reason: DUPLICATE_MIGRATION
