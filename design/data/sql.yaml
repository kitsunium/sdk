        struct:
          fields:
            - name: MaxOpen
              type: int
            - name: MaxIdle
              type: int
            - name: MaxLifetime
              type: time.Duration
            - name: MaxIdleTime
              type: time.Duration
      - name: Config
        struct:
          fields:
            - name: DB
              type: "*stdsql.DB"
            - name: Dialect
              type: coresql.Dialect
            - name: Pool
              type: PoolConfig
            - name: Clock
              type: clock.Timed
            - name: CheckTimeout
              type: time.Duration
      - name: MigrateConfig
        struct:
          fields:
            - name: Migrations
              type: "[]coresql.MigrationValue"
            - name: VersionTable
              type: string
            - name: LockTimeout
              type: time.Duration
            - name: LockRetryInterval
              type: time.Duration
      - methods:
          - name: Error
            out:
              - type: string
            recv: value
          - name: Unwrap
            out:
              - type: error
            recv: value
        name: Withheld
        struct:
          unexported: true
