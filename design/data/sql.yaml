      - name: CodeMigrationLockTimeout
        type: errs.Code
        value: "0x00_03_36_0E"
      - name: CodeMigrationUnknownVersion
        type: errs.Code
        value: "0x00_03_36_0F"
      - name: CodeVersionTableInvalid
        type: errs.Code
        value: "0x00_03_36_10"
      - name: CodeDuplicateMigration
        type: errs.Code
        value: "0x00_03_36_11"
      - name: DialectUnknown
        type: Dialect
        value: "0"
      - name: DialectPostgres
        type: Dialect
