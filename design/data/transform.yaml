apiVersion: kit.kitsunium/design/v2
domain: data/transform
packages:
  - codes:
      - const:
          - doc: |-
              CodeUnknownCompressor identifies a Lookup/Decompress call naming an Algorithm
              that no imported package has registered. It is also surfaced via panic at
              boot on a duplicate registration (see registry.go), not only as a sentinel.
            name: CodeUnknownCompressor
            note: "range: 0.2.5.0 - 0.2.5.255"
            value: "0x00_02_05_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCompressionFailed identifies a Compress call whose underlying compressor
              returned an error — typically a writer fault while flushing the stream.
            name: CodeCompressionFailed
            value: "0x00_02_05_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecompressionFailed identifies a Decompress call whose underlying
              decompressor returned an error — malformed input or a truncated stream.
            name: CodeDecompressionFailed
            value: "0x00_02_05_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCompressedFrameInvalid identifies a malformed compressed frame OR a
              tripped decompression-bomb guard (max output size / max expansion ratio). It
              is owned by the pkg/v1/data/codec frame layer (a later commit); declared here so
              the 0.2.5.* block is allocated in one place per ADR 0014.
            name: CodeCompressedFrameInvalid
            value: "0x00_02_05_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies a boot-time collision on the Compressor
              registry: a nil scheme, or a distinct scheme claiming an already-registered
              Algorithm. It is surfaced via panic at boot (see registry.go). Its reason is
              DUPLICATE_REGISTRATION so the bracket header "[<code> <REASON>]" stays a valid
              (code,reason) pairing per ADR 0005 §Semantics — mirroring the codec registry's
              CodeDuplicateRegistration (0.2.2.1).
            name: CodeDuplicateRegistration
            value: "0x00_02_05_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecompressedTooLarge identifies a stream whose plaintext exceeded the
              ceiling the CALLER supplied to BoundedDecompressor.DecompressBounded. It is
              distinct from the scheme sentinels (GZIP_FAILED and friends) on purpose: a
              corrupt body and a body that is merely too big are different facts, and a
              caller that imposed the ceiling is the only one able to say which of the two
              its own limit produced. Collapsing them would force that caller to report a
              malformed stream for one whose only established fault is its size.
            name: CodeDecompressedTooLarge
            value: "0x00_02_05_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeGzipFailed identifies a failure inside compress/gzip during either a
              Compress (writer) or Decompress (reader) operation; the wrap trail and the
              COMPRESSION_FAILED / DECOMPRESSION_FAILED sentinels distinguish the
              direction.
            name: CodeGzipFailed
            note: |-
              range: 0.3.26.0 - 0.3.26.255 (0x1a) — the stdlib schemes' codes, allocated by
              the service layer (LL = 3) and declared here since ADR 0160: a code keeps the
              value its layer allocated when its declaration moves.
            value: "0x00_03_1A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeFlateFailed identifies a failure inside compress/flate during either a
              Compress (writer) or Decompress (reader) operation.
            name: CodeFlateFailed
            value: "0x00_03_1A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeZlibFailed identifies a failure inside compress/zlib during either a
              Compress (writer) or Decompress (reader) operation. It is distinct from
              CodeFlateFailed because the zlib envelope (RFC 1950) is a distinct wire format
              from the raw DEFLATE stream (RFC 1951): a stream rejected under one scheme is
              routinely valid under the other, so the two must be told apart at the code.
            name: CodeZlibFailed
            value: "0x00_03_1A_03"
        type: errs.Code
    functions:
      - in:
          - name: c
            type: Compressor
        name: Register
        out:
          - type: Compressor
      - in:
          - name: name
            type: Algorithm
        name: Lookup
        out:
          - name: c
            type: Compressor
          - name: ok
            type: bool
      - name: Available
        out:
          - type: "[]Algorithm"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/transform
    ports:
      - doc: |-
          Compressor is the contract every byte-transform scheme satisfies. Instances
          MUST be safe for concurrent use; scheme-specific options are supplied via the
          scheme's constructor, not via the Compressor interface. Compress and
          Decompress follow the append-to-dst convention of the stdlib (dst may be nil)
          so callers can reuse buffers on the hot path.

          src must not overlap dst's spare capacity, dst[len(dst):cap(dst)]: every
          scheme writes its output there while it is still reading src, so an aliased
          src is overwritten mid-read and the output is corrupt. Reusing one buffer
          means passing buf[:0] as dst and a DIFFERENT buffer as src — the same rule
          as copy-free encoders across the stdlib, stated here because no scheme can
          check it cheaply.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind this
          interface — concrete scheme types stay unexported per package.
        methods:
          - name: Algorithm
            out:
              - type: Algorithm
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Compress
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Decompress
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: Compressor
      - doc: |-
          BoundedDecompressor is the optional extension for schemes that can be told
          how much plaintext they are allowed to materialise. Consumers detect support
          with a type assertion, exactly as they do for the codec layer's Appender.

          It exists because a caller that enforces a TIGHTER ceiling than the scheme's
          own backstop otherwise has no way to say so, and must instead let the scheme
          materialise everything and then judge the result. Judging afterwards is a
          correct verdict reached by doing the attacker's work first: a frame layer
          capping output at 64 MiB but calling plain Decompress still lets a few
          hundred kilobytes of crafted input drive the scheme's full 256 MiB backstop
          before the answer is known.

          max is a ceiling, never a promise: a scheme MAY refuse a stream below it for
          its own reasons, and MUST NOT return more than max bytes. A ceiling of zero
          is a real ceiling — it admits an empty stream and nothing else — and a
          negative one is clamped to zero rather than given a third meaning, so the
          bound is monotone in max. A stream that would exceed max fails with
          DecompressedTooLarge rather than being silently truncated: a short read that
          looked like success would turn a bomb into a parsing bug further up.

          DecompressedTooLarge and NOT the scheme's own sentinel, because the two
          answer different questions, and because the implementation cannot honestly
          give the scheme's: it stops reading at the ceiling, short of the trailer the
          scheme would need to pronounce on the stream at all.
        embeds:
          - Compressor
        methods:
          - in:
              - name: dst
              - name: src
                type: "[]byte"
              - name: max
                type: int64
            name: DecompressBounded
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: BoundedDecompressor
    sentinels:
      - var:
          - code: CodeUnknownCompressor
            doc: |-
              UnknownCompressor is returned when no Compressor is registered under the
              requested Algorithm — typically a missing blank-import of the scheme.
            name: UnknownCompressor
            private: "core/data/transform.Lookup: algorithm absent from registry; blank-import the scheme's package to register it"
            public: No compressor is registered under that algorithm
            reason: UNKNOWN_COMPRESSOR
          - code: CodeCompressionFailed
            doc: |-
              CompressionFailed wraps a failure from a compressor's underlying writer
              (e.g. compress/gzip or compress/flate) while encoding the payload.
            name: CompressionFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.Compress: the underlying compressor returned an error"
            public: Compression failed
            reason: COMPRESSION_FAILED
          - code: CodeDecompressionFailed
            doc: |-
              DecompressionFailed wraps a failure from a decompressor's underlying
              reader while decoding the payload — malformed or truncated input.
            name: DecompressionFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.Decompress: the underlying decompressor returned an error"
            public: Decompression failed
            reason: DECOMPRESSION_FAILED
          - code: CodeCompressedFrameInvalid
            doc: |-
              CompressedFrameInvalid is returned for a malformed compressed frame or a
              tripped decompression-bomb guard. The pkg/v1/data/codec frame layer (a later
              commit) is its emitter; defined here so the 0.2.5.* block lands in one place.
            name: CompressedFrameInvalid
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform: compressed-frame header is malformed or the decompression-bomb guard tripped"
            public: Compressed frame is malformed or exceeds the safety bound
            reason: COMPRESSED_FRAME_INVALID
          - code: CodeDecompressedTooLarge
            doc: |-
              DecompressedTooLarge reports that a stream's plaintext exceeded the
              ceiling its caller passed to DecompressBounded. It establishes exactly
              that and nothing more: more than max plaintext bytes were produced. It
              does NOT report a well-formed stream — the decode stops at the ceiling,
              so the trailer is never reached and the bytes past it are never read.
              Claiming well-formedness here would be claiming the result of work this
              error exists to avoid doing.
            name: DecompressedTooLarge
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.DecompressBounded: plaintext exceeded the caller-supplied max"
            public: Decompressed payload exceeds the caller's ceiling
            reason: DECOMPRESSED_TOO_LARGE
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the boot-time panic sentinel for the Compressor
              registry: a nil scheme or a distinct scheme claiming a taken Algorithm. Its
              reason matches the bracket-header word so code 0.2.5.5 resolves to
              DUPLICATE_REGISTRATION — never the unrelated UNKNOWN_COMPRESSOR (0.2.5.1).
            name: DuplicateRegistration
            private: "core/data/transform.Register: a distinct scheme already claims this algorithm, or a nil scheme was supplied"
            public: A compressor is already registered under that algorithm
            reason: DUPLICATE_REGISTRATION
          - code: CodeGzipFailed
            doc: GzipFailed wraps a failure from compress/gzip (Compress or Decompress).
            name: GzipFailed
            private: "service/data/transform: compress/gzip returned an error"
            public: gzip transform failed
            reason: GZIP_FAILED
          - code: CodeFlateFailed
            doc: FlateFailed wraps a failure from compress/flate (Compress or Decompress).
            name: FlateFailed
            private: "service/data/transform: compress/flate returned an error"
            public: flate transform failed
            reason: FLATE_FAILED
          - code: CodeZlibFailed
            doc: |-
              ZlibFailed wraps a failure from compress/zlib (Compress or Decompress),
              including a failed Adler-32 check the raw-DEFLATE scheme cannot detect.
            name: ZlibFailed
            private: "service/data/transform: compress/zlib returned an error"
            public: zlib transform failed
            reason: ZLIB_FAILED
    types:
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: Known
            out:
              - type: bool
            recv: value
        name: Algorithm
        underlying: string
  - functions:
      - in:
          - name: level
            type: int
        name: NewZlibCompressor
        out:
          - type: coretransform.Compressor
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
    path: github.com/kitsunium/sdk/internal/service/data/transform
    variables:
      - name: FlateCompressor
        type: coretransform.Compressor
      - name: GzipCompressor
        type: coretransform.Compressor
      - name: ZlibCompressor
        type: coretransform.Compressor
  - constants:
      - name: Gzip
        type: Algorithm
        value: "\"gzip\""
      - name: Flate
        type: Algorithm
        value: "\"flate\""
      - name: Zlib
        type: Algorithm
        value: "\"zlib\""
    facade:
      - const:
          - doc: |-
              CodeUnknownCompressor identifies an Algorithm no imported package has
              registered (0.2.5.1).
            name: CodeUnknownCompressor
            reexport: coretransform.CodeUnknownCompressor
            type: errs.Code
            typed: true
            value: "0x00_02_05_01"
          - doc: |-
              CodeCompressedFrameInvalid identifies a malformed compressed frame of the
              codec package, or a frame its decompression-bomb guard refused (0.2.5.4).
            name: CodeCompressedFrameInvalid
            reexport: coretransform.CodeCompressedFrameInvalid
            type: errs.Code
            typed: true
            value: "0x00_02_05_04"
          - doc: |-
              CodeDecompressedTooLarge identifies a stream whose plaintext would exceed
              the ceiling its caller gave (0.2.5.6).
            name: CodeDecompressedTooLarge
            reexport: coretransform.CodeDecompressedTooLarge
            type: errs.Code
            typed: true
            value: "0x00_02_05_06"
          - doc: |-
              CodeGzipFailed identifies a stream compress/gzip refused, compressing or
              decompressing (0.3.26.1).
            name: CodeGzipFailed
            reexport: coretransform.CodeGzipFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_01"
          - doc: CodeFlateFailed identifies a stream compress/flate refused (0.3.26.2).
            name: CodeFlateFailed
            reexport: coretransform.CodeFlateFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_02"
          - doc: |-
              CodeZlibFailed identifies a stream compress/zlib refused (0.3.26.3): the
              RFC 1950 envelope, told apart from raw DEFLATE because a stream one of
              them refuses is often valid under the other.
            name: CodeZlibFailed
            reexport: coretransform.CodeZlibFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_03"
        doc: The error codes, ranges 0.2.5.* and 0.3.26.*, declared in the core.
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: |-
              UnknownCompressor is the sentinel of [CodeUnknownCompressor], returned
              as is.
            name: UnknownCompressor
            reexport: coretransform.UnknownCompressor
            type: "*errs.Error"
          - doc: CompressedFrameInvalid is the sentinel of [CodeCompressedFrameInvalid].
            name: CompressedFrameInvalid
            reexport: coretransform.CompressedFrameInvalid
            type: "*errs.Error"
          - doc: |-
              DecompressedTooLarge is the sentinel of [CodeDecompressedTooLarge],
              returned as is.
            name: DecompressedTooLarge
            reexport: coretransform.DecompressedTooLarge
            type: "*errs.Error"
          - doc: |-
              GzipFailed is the sentinel of [CodeGzipFailed]; the stdlib's error is
              kept beneath it.
            name: GzipFailed
            reexport: coretransform.GzipFailed
            type: "*errs.Error"
          - doc: FlateFailed is the sentinel of [CodeFlateFailed].
            name: FlateFailed
            reexport: coretransform.FlateFailed
            type: "*errs.Error"
          - doc: ZlibFailed is the sentinel of [CodeZlibFailed].
            name: ZlibFailed
            reexport: coretransform.ZlibFailed
            type: "*errs.Error"
      - alias:
          - doc: |-
              Algorithm is the name a Compressor registers under. The zero value is
              reserved as invalid.
            name: Algorithm
            target: coretransform.Algorithm
      - alias:
          - doc: |-
              Compressor is one compression scheme: Compress and Decompress append to dst.
              Implementations are safe for concurrent use.
            name: Compressor
            target: coretransform.Compressor
      - alias:
          - doc: |-
              BoundedDecompressor is the optional extension of a Compressor that can be
              told how much plaintext it may produce; DecompressBounded uses it when the
              scheme has it.
            name: BoundedDecompressor
            target: coretransform.BoundedDecompressor
      - func:
          doc: Lookup returns the Compressor registered under algo.
          forward: coretransform.Lookup
          in:
            - name: algo
              type: Algorithm
          name: Lookup
          out:
            - name: c
              type: Compressor
            - name: ok
              type: bool
      - func:
          doc: Available returns the registered Algorithms, sorted.
          forward: coretransform.Available
          name: Available
          out:
            - type: "[]Algorithm"
    functions:
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Compress
        out:
          - name: encoded
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Decompress
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
          - name: limit
            type: int64
        name: DecompressBounded
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/transform
