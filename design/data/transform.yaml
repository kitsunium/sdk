apiVersion: kit.kitsunium/design/v2
domain: data/transform
packages:
  - constants:
      - name: CodeUnknownCompressor
        type: errs.Code
        value: "0x00_02_05_01"
      - name: CodeCompressionFailed
        type: errs.Code
        value: "0x00_02_05_02"
      - name: CodeDecompressionFailed
        type: errs.Code
        value: "0x00_02_05_03"
      - name: CodeCompressedFrameInvalid
        type: errs.Code
        value: "0x00_02_05_04"
      - name: CodeDuplicateRegistration
        type: errs.Code
        value: "0x00_02_05_05"
      - name: CodeDecompressedTooLarge
        type: errs.Code
        value: "0x00_02_05_06"
      - name: CodeGzipFailed
        type: errs.Code
        value: "0x00_03_1A_01"
      - name: CodeFlateFailed
        type: errs.Code
        value: "0x00_03_1A_02"
      - name: CodeZlibFailed
        type: errs.Code
        value: "0x00_03_1A_03"
    functions:
      - in:
          - name: c
            type: Compressor
        name: Register
        out:
          - type: Compressor
      - in:
          - name: name
            type: Algorithm
        name: Lookup
        out:
          - name: c
            type: Compressor
          - name: ok
            type: bool
      - name: Available
        out:
          - type: "[]Algorithm"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/transform
    types:
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: Known
            out:
              - type: bool
            recv: value
        name: Algorithm
        underlying: string
      - interface:
          methods:
            - name: Algorithm
              out:
                - type: Algorithm
            - in:
                - name: dst
                - name: src
                  type: "[]byte"
              name: Compress
              out:
                - name: out
                  type: "[]byte"
                - name: err
                  type: error
            - in:
                - name: dst
                - name: src
                  type: "[]byte"
              name: Decompress
              out:
                - name: out
                  type: "[]byte"
                - name: err
                  type: error
        name: Compressor
      - interface:
          embeds:
            - Compressor
          methods:
            - in:
                - name: dst
                - name: src
                  type: "[]byte"
                - name: max
                  type: int64
              name: DecompressBounded
              out:
                - name: out
                  type: "[]byte"
                - name: err
                  type: error
        name: BoundedDecompressor
    variables:
      - name: UnknownCompressor
        type: "*errs.Error"
      - name: CompressionFailed
        type: "*errs.Error"
      - name: DecompressionFailed
        type: "*errs.Error"
      - name: CompressedFrameInvalid
        type: "*errs.Error"
      - name: DecompressedTooLarge
        type: "*errs.Error"
      - name: DuplicateRegistration
        type: "*errs.Error"
      - name: GzipFailed
        type: "*errs.Error"
      - name: FlateFailed
        type: "*errs.Error"
      - name: ZlibFailed
        type: "*errs.Error"
  - functions:
      - in:
          - name: level
            type: int
        name: NewZlibCompressor
        out:
          - type: coretransform.Compressor
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
    path: github.com/kitsunium/sdk/internal/service/data/transform
    variables:
      - name: FlateCompressor
        type: coretransform.Compressor
      - name: GzipCompressor
        type: coretransform.Compressor
      - name: ZlibCompressor
        type: coretransform.Compressor
  - aliases:
      - name: Algorithm
        target: coretransform.Algorithm
      - name: Compressor
        target: coretransform.Compressor
      - name: BoundedDecompressor
        target: coretransform.BoundedDecompressor
    constants:
      - name: Gzip
        type: Algorithm
        value: "\"gzip\""
      - name: Flate
        type: Algorithm
        value: "\"flate\""
      - name: Zlib
        type: Algorithm
        value: "\"zlib\""
      - name: CodeUnknownCompressor
        type: errs.Code
        value: "0x00_02_05_01"
      - name: CodeCompressedFrameInvalid
        type: errs.Code
        value: "0x00_02_05_04"
      - name: CodeDecompressedTooLarge
        type: errs.Code
        value: "0x00_02_05_06"
      - name: CodeGzipFailed
        type: errs.Code
        value: "0x00_03_1A_01"
      - name: CodeFlateFailed
        type: errs.Code
        value: "0x00_03_1A_02"
      - name: CodeZlibFailed
        type: errs.Code
        value: "0x00_03_1A_03"
    functions:
      - in:
          - name: algo
            type: Algorithm
        name: Lookup
        out:
          - name: c
            type: Compressor
          - name: ok
            type: bool
      - name: Available
        out:
          - type: "[]Algorithm"
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Compress
        out:
          - name: encoded
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Decompress
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
          - name: limit
            type: int64
        name: DecompressBounded
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/transform
    variables:
      - name: UnknownCompressor
        type: "*errs.Error"
      - name: CompressedFrameInvalid
        type: "*errs.Error"
      - name: DecompressedTooLarge
        type: "*errs.Error"
      - name: GzipFailed
        type: "*errs.Error"
      - name: FlateFailed
        type: "*errs.Error"
      - name: ZlibFailed
        type: "*errs.Error"
