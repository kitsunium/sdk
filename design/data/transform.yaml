apiVersion: kit.kitsunium/design/v2
domain: data/transform
packages:
  - codes:
      - const:
          - doc: |-
              CodeUnknownCompressor identifies a Lookup/Decompress call naming an Algorithm
              that no imported package has registered. It is also surfaced via panic at
              boot on a duplicate registration (see registry.go), not only as a sentinel.
            name: CodeUnknownCompressor
            note: "range: 0.2.5.0 - 0.2.5.255"
            value: "0x00_02_05_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCompressionFailed identifies a Compress call whose underlying compressor
              returned an error — typically a writer fault while flushing the stream.
            name: CodeCompressionFailed
            value: "0x00_02_05_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecompressionFailed identifies a Decompress call whose underlying
              decompressor returned an error — malformed input or a truncated stream.
            name: CodeDecompressionFailed
            value: "0x00_02_05_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCompressedFrameInvalid identifies a malformed compressed frame OR a
              tripped decompression-bomb guard (max output size / max expansion ratio). It
              is owned by the pkg/v1/data/codec frame layer (a later commit); declared here so
              the 0.2.5.* block is allocated in one place per ADR 0014.
            name: CodeCompressedFrameInvalid
            value: "0x00_02_05_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies a boot-time collision on the Compressor
              registry: a nil scheme, or a distinct scheme claiming an already-registered
              Algorithm. It is surfaced via panic at boot (see registry.go). Its reason is
              DUPLICATE_REGISTRATION so the bracket header "[<code> <REASON>]" stays a valid
              (code,reason) pairing per ADR 0005 §Semantics — mirroring the codec registry's
              CodeDuplicateRegistration (0.2.2.1).
            name: CodeDuplicateRegistration
            value: "0x00_02_05_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecompressedTooLarge identifies a stream whose plaintext exceeded the
              ceiling the CALLER supplied to BoundedDecompressor.DecompressBounded. It is
              distinct from the scheme sentinels (GZIP_FAILED and friends) on purpose: a
              corrupt body and a body that is merely too big are different facts, and a
              caller that imposed the ceiling is the only one able to say which of the two
              its own limit produced. Collapsing them would force that caller to report a
              malformed stream for one whose only established fault is its size.
            name: CodeDecompressedTooLarge
            value: "0x00_02_05_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeGzipFailed identifies a failure inside compress/gzip during either a
              Compress (writer) or Decompress (reader) operation; the wrap trail and the
              COMPRESSION_FAILED / DECOMPRESSION_FAILED sentinels distinguish the
              direction.
            name: CodeGzipFailed
            note: |-
              range: 0.3.26.0 - 0.3.26.255 (0x1a) — the stdlib schemes' codes, allocated by
              the service layer (LL = 3) and declared here since ADR 0160: a code keeps the
              value its layer allocated when its declaration moves.
            value: "0x00_03_1A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeFlateFailed identifies a failure inside compress/flate during either a
              Compress (writer) or Decompress (reader) operation.
            name: CodeFlateFailed
            value: "0x00_03_1A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeZlibFailed identifies a failure inside compress/zlib during either a
              Compress (writer) or Decompress (reader) operation. It is distinct from
              CodeFlateFailed because the zlib envelope (RFC 1950) is a distinct wire format
              from the raw DEFLATE stream (RFC 1951): a stream rejected under one scheme is
              routinely valid under the other, so the two must be told apart at the code.
            name: CodeZlibFailed
            value: "0x00_03_1A_03"
        type: errs.Code
    doc: |-
      Package transform — range 0.2.5.* (ADR 0014 core/data/transform block), and
      the stdlib schemes' 0.3.26.* (ADR 0014 service/data/transform block, declared
      here since ADR 0160).

      Package transform — declares the sentinels returned by the Compressor
      facade, and the three the stdlib schemes in internal/service/data/transform
      wrap a compress/* failure in (ADR 0160: every code is declared in the core,
      at the service's path). Each var's name equals its errs.Define Reason in
      SCREAMING_SNAKE form. CodeUnknownCompressor is also surfaced via panic at
      boot on a duplicate registration (see registry.go), not only as an *Error
      sentinel.

      Package transform — holds the process-wide Compressor registry. Service-level
      scheme packages register themselves via package-level var initialisers when
      imported (no init()), mirroring core/data/codec and core/crypto.

      Package transform declares the byte-transform port of the SDK: the
      Compressor contract and the typed Algorithm string under which a compressor
      registers. It is the fifth core sibling beside codec, writer, crypto, and
      logger (ADR 0014 D1) and mirrors codec exactly — the registry resolves an
      Algorithm to a Compressor the way codec resolves a Format to a Codec.

      No algorithm bodies and no vendor types live here; concrete compressors live
      under internal/service/data/transform/ (stdlib gzip/flate/zlib today) and
      self-register via a package-level var initialiser when imported — no init().
    functions:
      - doc: |-
          Register inserts c into the registry under c.Algorithm() and returns it so
          callers can bind the singleton to a typed package-level variable like
          `var GzipCompressor = transform.Register(gzipCompressor{})`. Panics on a nil
          scheme or when a distinct scheme already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in Compressor instances back to callers
          so each scheme keeps its concrete type unexported; the stable contract is the
          Compressor interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: c
            type: Compressor
        name: Register
        out:
          - type: Compressor
      - doc: |-
          Lookup returns the Compressor registered under name.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind the
          Compressor interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: Lookup
        out:
          - name: c
            type: Compressor
          - name: ok
            type: bool
      - doc: |-
          Available returns the sorted list of registered Algorithms, or nil before
          any Register.
        name: Available
        out:
          - type: "[]Algorithm"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/transform
    ports:
      - doc: |-
          Compressor is the contract every byte-transform scheme satisfies. Instances
          MUST be safe for concurrent use; scheme-specific options are supplied via the
          scheme's constructor, not via the Compressor interface. Compress and
          Decompress follow the append-to-dst convention of the stdlib (dst may be nil)
          so callers can reuse buffers on the hot path.

          src must not overlap dst's spare capacity, dst[len(dst):cap(dst)]: every
          scheme writes its output there while it is still reading src, so an aliased
          src is overwritten mid-read and the output is corrupt. Reusing one buffer
          means passing buf[:0] as dst and a DIFFERENT buffer as src — the same rule
          as copy-free encoders across the stdlib, stated here because no scheme can
          check it cheaply.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind this
          interface — concrete scheme types stay unexported per package.
        methods:
          - name: Algorithm
            out:
              - type: Algorithm
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Compress
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Decompress
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: Compressor
      - doc: |-
          BoundedDecompressor is the optional extension for schemes that can be told
          how much plaintext they are allowed to materialise. Consumers detect support
          with a type assertion, exactly as they do for the codec layer's Appender.

          It exists because a caller that enforces a TIGHTER ceiling than the scheme's
          own backstop otherwise has no way to say so, and must instead let the scheme
          materialise everything and then judge the result. Judging afterwards is a
          correct verdict reached by doing the attacker's work first: a frame layer
          capping output at 64 MiB but calling plain Decompress still lets a few
          hundred kilobytes of crafted input drive the scheme's full 256 MiB backstop
          before the answer is known.

          max is a ceiling, never a promise: a scheme MAY refuse a stream below it for
          its own reasons, and MUST NOT return more than max bytes. A ceiling of zero
          is a real ceiling — it admits an empty stream and nothing else — and a
          negative one is clamped to zero rather than given a third meaning, so the
          bound is monotone in max. A stream that would exceed max fails with
          DecompressedTooLarge rather than being silently truncated: a short read that
          looked like success would turn a bomb into a parsing bug further up.

          DecompressedTooLarge and NOT the scheme's own sentinel, because the two
          answer different questions, and because the implementation cannot honestly
          give the scheme's: it stops reading at the ceiling, short of the trailer the
          scheme would need to pronounce on the stream at all.
        embeds:
          - Compressor
        methods:
          - in:
              - name: dst
              - name: src
                type: "[]byte"
              - name: max
                type: int64
            name: DecompressBounded
            out:
              - name: out
                type: "[]byte"
              - name: err
                type: error
        name: BoundedDecompressor
    sentinels:
      - var:
          - code: CodeUnknownCompressor
            doc: |-
              UnknownCompressor is returned when no Compressor is registered under the
              requested Algorithm — typically a missing blank-import of the scheme.
            name: UnknownCompressor
            private: "core/data/transform.Lookup: algorithm absent from registry; blank-import the scheme's package to register it"
            public: No compressor is registered under that algorithm
            reason: UNKNOWN_COMPRESSOR
          - code: CodeCompressionFailed
            doc: |-
              CompressionFailed wraps a failure from a compressor's underlying writer
              (e.g. compress/gzip or compress/flate) while encoding the payload.
            name: CompressionFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.Compress: the underlying compressor returned an error"
            public: Compression failed
            reason: COMPRESSION_FAILED
          - code: CodeDecompressionFailed
            doc: |-
              DecompressionFailed wraps a failure from a decompressor's underlying
              reader while decoding the payload — malformed or truncated input.
            name: DecompressionFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.Decompress: the underlying decompressor returned an error"
            public: Decompression failed
            reason: DECOMPRESSION_FAILED
          - code: CodeCompressedFrameInvalid
            doc: |-
              CompressedFrameInvalid is returned for a malformed compressed frame or a
              tripped decompression-bomb guard. The pkg/v1/data/codec frame layer (a later
              commit) is its emitter; defined here so the 0.2.5.* block lands in one place.
            name: CompressedFrameInvalid
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform: compressed-frame header is malformed or the decompression-bomb guard tripped"
            public: Compressed frame is malformed or exceeds the safety bound
            reason: COMPRESSED_FRAME_INVALID
          - code: CodeDecompressedTooLarge
            doc: |-
              DecompressedTooLarge reports that a stream's plaintext exceeded the
              ceiling its caller passed to DecompressBounded. It establishes exactly
              that and nothing more: more than max plaintext bytes were produced. It
              does NOT report a well-formed stream — the decode stops at the ceiling,
              so the trailer is never reached and the bytes past it are never read.
              Claiming well-formedness here would be claiming the result of work this
              error exists to avoid doing.
            name: DecompressedTooLarge
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/transform.DecompressBounded: plaintext exceeded the caller-supplied max"
            public: Decompressed payload exceeds the caller's ceiling
            reason: DECOMPRESSED_TOO_LARGE
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the boot-time panic sentinel for the Compressor
              registry: a nil scheme or a distinct scheme claiming a taken Algorithm. Its
              reason matches the bracket-header word so code 0.2.5.5 resolves to
              DUPLICATE_REGISTRATION — never the unrelated UNKNOWN_COMPRESSOR (0.2.5.1).
            name: DuplicateRegistration
            private: "core/data/transform.Register: a distinct scheme already claims this algorithm, or a nil scheme was supplied"
            public: A compressor is already registered under that algorithm
            reason: DUPLICATE_REGISTRATION
          - code: CodeGzipFailed
            doc: GzipFailed wraps a failure from compress/gzip (Compress or Decompress).
            name: GzipFailed
            private: "service/data/transform: compress/gzip returned an error"
            public: gzip transform failed
            reason: GZIP_FAILED
          - code: CodeFlateFailed
            doc: FlateFailed wraps a failure from compress/flate (Compress or Decompress).
            name: FlateFailed
            private: "service/data/transform: compress/flate returned an error"
            public: flate transform failed
            reason: FLATE_FAILED
          - code: CodeZlibFailed
            doc: |-
              ZlibFailed wraps a failure from compress/zlib (Compress or Decompress),
              including a failed Adler-32 check the raw-DEFLATE scheme cannot detect.
            name: ZlibFailed
            private: "service/data/transform: compress/zlib returned an error"
            public: zlib transform failed
            reason: ZLIB_FAILED
    types:
      - decl: true
        doc: |-
          Algorithm is the typed key under which a Compressor registers (e.g. "gzip",
          "flate", "zlib"). The zero value Algorithm("") is reserved invalid, mirroring
          codec.Format and crypto.Algorithm. Note that "flate" is the raw DEFLATE
          stream of RFC 1951 and "zlib" is the RFC 1950 envelope HTTP misnames
          "deflate" — distinct Algorithms, not aliases.
        methods:
          - doc: String implements fmt.Stringer and returns the raw identifier.
            name: String
            out:
              - type: string
            recv: value
          - doc: Known reports whether a has been registered in the Compressor registry.
            name: Known
            out:
              - type: bool
            recv: value
        name: Algorithm
        underlying: string
  - doc: |-
      Package transform — shared decompression bound for the stdlib gzip, flate and
      zlib schemes. Each Decompress reads through an io.LimitReader so a malformed or
      hostile stream cannot drive an unbounded allocation at this layer. The full
      self-describing decompression-bomb guard (max output size + max expansion
      ratio keyed to the frame header) lives in the pkg/v1/data/codec frame layer (a
      later commit, CodeCompressedFrameInvalid); this is the conservative
      layer-local backstop ADR 0014 D1 asks for.

      Package transform — the flate (raw DEFLATE) Compressor over compress/flate.
      Shares the package with the gzip scheme; both self-register at import.

      Package transform wraps the stdlib compress/gzip and compress/flate codecs as
      core/data/transform.Compressor implementations. Blank-importing this package is
      enough to make "gzip" and "flate" resolvable via the core/data/transform registry.

      Package transform — the recycled stdlib codecs behind Compress and
      Decompress. Neither direction's stdlib object is small: at the default level
      an encoder carries two hash tables and a 320 KiB history window, and a
      decoder carries a 32 KiB dictionary window. Constructing one per call put
      compress/flate at 99 % of the bytes a 256-byte gzip allocated and
      runtime.memclrNoHeapPointers at 18.7 % of its CPU — zeroing tables the call
      was about to overwrite. Recycling moves that off the per-call path; the
      before/after medians are in BENCH.md.

      A pooled object is reachable until the next take on the same P or the next
      GC, whichever comes first, and it is large. That is why the two directions
      unbind differently, and the line is what the SDK created versus what the
      caller lent us: an encoder is rebound to io.Discard before it goes back,
      because it would otherwise pin the output buffer this package built and
      handed to the caller as exclusively theirs; a decoder is not rebound,
      because what it holds is the caller's own compressed input, which the caller
      passed in and still has — and because every decoder Reset re-reads a header
      and so returns an error that an unbind would have to discard, while every
      encoder Reset returns nothing at all.

      Every take checks the pooled decoder rather than trusting it, and the check
      is in two parts because one of them cannot do the job alone: a type assertion
      establishes the Reset CAPABILITY, and a tag on the box establishes the
      SCHEME. readerScheme carries the measurement that forces the split — the
      flate and zlib Resetter interfaces declare the identical method, so each
      pool's assertion accepts the other pool's decoder and detects nothing.

      A box holding another scheme's decoder is a corrupted pool, which is this
      package's own defect and not the caller's stream: nobody who called
      Decompress could have caused it and nobody could act on being told. So it is
      never an error. It fails the same condition an empty box fails, takes the
      same constructor path, and the fresh decoder overwrites the foreign one — so
      the fault costs exactly the allocation the pool exists to avoid, once, and
      does not outlive the take that found it.

      Package transform — the WrapParams the three schemes attach to a stdlib
      cause. Each mirrors its sentinel — GzipFailed, FlateFailed, ZlibFailed,
      declared with their codes in internal/core/data/transform (ADR 0160) — so a
      wrapped compress/* failure carries the same Code/Reason/Public on the wire as
      the bare sentinel.

      Package transform — the zlib Compressor over compress/zlib (RFC 1950): a
      two-byte header, a raw DEFLATE body, and an Adler-32 trailer. This is NOT the
      `flate` scheme: `flate` is the bare DEFLATE stream of RFC 1951, with no header
      and no checksum, so the two are not wire-compatible in either direction.
      HTTP's `Content-Encoding: deflate` (RFC 9110 §8.4.1) names the zlib envelope,
      so this scheme — not `flate` — is the one that interoperates with it. Shares
      the package with the gzip and flate schemes; all three self-register at
      import.
    functions:
      - doc: |-
          NewZlibCompressor returns a zlib Compressor encoding at level, which may be
          zlib.DefaultCompression, zlib.HuffmanOnly, or any value from zlib.BestSpeed to
          zlib.BestCompression. Anything else — including zlib.NoCompression, which the
          stdlib accepts but which stores the payload verbatim — is clamped to
          zlib.DefaultCompression, so no configuration can hand back a compressor that
          silently does not compress (ADR 0031). The result is NOT registered; the
          registry entry is the default-level ZlibCompressor singleton.
        in:
          - name: level
            type: int
        name: NewZlibCompressor
        out:
          - type: coretransform.Compressor
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
    path: github.com/kitsunium/sdk/internal/service/data/transform
    variables:
      - doc: |-
          FlateCompressor is the flate (raw DEFLATE) singleton, registered with
          core/data/transform at package load. Binding the registration result to a named
          var keeps us clear of init().
        name: FlateCompressor
        type: coretransform.Compressor
      - doc: |-
          GzipCompressor is the gzip singleton, registered with core/data/transform at
          package load. Binding the registration result to a named var is idiomatic and
          keeps us clear of init().
        name: GzipCompressor
        type: coretransform.Compressor
      - doc: |-
          ZlibCompressor is the zlib singleton, registered with core/data/transform at
          package load at the stdlib default level. Binding the registration result to a
          named var is idiomatic and keeps us clear of init().
        name: ZlibCompressor
        type: coretransform.Compressor
  - constants:
      - blockDoc: The Algorithms registered by importing this package.
        doc: "Gzip is RFC 1952: a DEFLATE stream in a gzip envelope with a CRC-32."
        name: Gzip
        type: Algorithm
        value: "\"gzip\""
      - blockDoc: The Algorithms registered by importing this package.
        doc: Flate is the raw DEFLATE stream of RFC 1951, with no envelope.
        name: Flate
        type: Algorithm
        value: "\"flate\""
      - blockDoc: The Algorithms registered by importing this package.
        doc: |-
          Zlib is the RFC 1950 envelope with an Adler-32 — what HTTP calls
          "deflate".
        name: Zlib
        type: Algorithm
        value: "\"zlib\""
    doc: |-
      Package transform compresses and decompresses bytes with the SDK's
      compressors, without the codec package (ADR 0014). Importing it registers
      three, which the standard library implements:

      	box, err := transform.Compress(transform.Gzip, nil, payload)
      	plain, err := transform.DecompressBounded(transform.Gzip, nil, box, 1<<20)

      # Algorithms

      An [Algorithm] names a [Compressor] in a registry of its own — compression
      is a transform of bytes, never a codec Format. [Gzip] is RFC 1952, [Flate]
      the raw DEFLATE stream of RFC 1951, and [Zlib] the RFC 1950 envelope HTTP
      misnames "deflate": three wire formats, not aliases of one another. A
      compressor another package registers — the module
      github.com/kitsunium/sdk/third-party/transform adds zstd and s2 — is reached
      by its Algorithm the same way once that package is imported; [Available]
      lists what is registered.

      Every function appends to dst, which may be nil, and src must not overlap
      dst's spare capacity: a scheme writes there while it still reads src.

      # Bounds

      [Decompress] is bounded by the scheme's own backstop — 256 MiB for the three
      registered here — so a bomb cannot exhaust memory, but it is the scheme's
      number, not the caller's. [DecompressBounded] takes the caller's ceiling: a
      scheme implementing [BoundedDecompressor] stops at it, so the ceiling bounds
      the work and not only the verdict; a scheme that does not is decompressed
      under its own backstop and judged afterwards. Either way no more than limit
      bytes are returned, and a stream that would exceed it is refused with
      [DecompressedTooLarge] rather than cut short — a truncated success would
      turn a bomb into a parsing bug further up.

      # Errors

      Match them with errs.HasCode, or the sentinels with errors.Is:

      	CodeUnknownCompressor       0.2.5.1   no compressor is registered under the Algorithm
      	CodeCompressedFrameInvalid  0.2.5.4   the codec package's compressed frame is malformed, or its bomb guard tripped
      	CodeDecompressedTooLarge    0.2.5.6   the plaintext would exceed DecompressBounded's ceiling
      	CodeGzipFailed              0.3.26.1  compress/gzip refused the stream, compressing or decompressing
      	CodeFlateFailed             0.3.26.2  compress/flate refused the stream
      	CodeZlibFailed              0.3.26.3  compress/zlib refused the stream

      A malformed stream is the scheme's own refusal, with the scheme's code:
      [GzipFailed], [FlateFailed] or [ZlibFailed] for the three registered here,
      the stdlib's own error kept in the chain beneath it.
    facade:
      - const:
          - doc: |-
              CodeUnknownCompressor identifies an Algorithm no imported package has
              registered (0.2.5.1).
            name: CodeUnknownCompressor
            reexport: coretransform.CodeUnknownCompressor
            type: errs.Code
            typed: true
            value: "0x00_02_05_01"
          - doc: |-
              CodeCompressedFrameInvalid identifies a malformed compressed frame of the
              codec package, or a frame its decompression-bomb guard refused (0.2.5.4).
            name: CodeCompressedFrameInvalid
            reexport: coretransform.CodeCompressedFrameInvalid
            type: errs.Code
            typed: true
            value: "0x00_02_05_04"
          - doc: |-
              CodeDecompressedTooLarge identifies a stream whose plaintext would exceed
              the ceiling its caller gave (0.2.5.6).
            name: CodeDecompressedTooLarge
            reexport: coretransform.CodeDecompressedTooLarge
            type: errs.Code
            typed: true
            value: "0x00_02_05_06"
          - doc: |-
              CodeGzipFailed identifies a stream compress/gzip refused, compressing or
              decompressing (0.3.26.1).
            name: CodeGzipFailed
            reexport: coretransform.CodeGzipFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_01"
          - doc: CodeFlateFailed identifies a stream compress/flate refused (0.3.26.2).
            name: CodeFlateFailed
            reexport: coretransform.CodeFlateFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_02"
          - doc: |-
              CodeZlibFailed identifies a stream compress/zlib refused (0.3.26.3): the
              RFC 1950 envelope, told apart from raw DEFLATE because a stream one of
              them refuses is often valid under the other.
            name: CodeZlibFailed
            reexport: coretransform.CodeZlibFailed
            type: errs.Code
            typed: true
            value: "0x00_03_1A_03"
        doc: The error codes, ranges 0.2.5.* and 0.3.26.*, declared in the core.
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: |-
              UnknownCompressor is the sentinel of [CodeUnknownCompressor], returned
              as is.
            name: UnknownCompressor
            reexport: coretransform.UnknownCompressor
            type: "*errs.Error"
          - doc: CompressedFrameInvalid is the sentinel of [CodeCompressedFrameInvalid].
            name: CompressedFrameInvalid
            reexport: coretransform.CompressedFrameInvalid
            type: "*errs.Error"
          - doc: |-
              DecompressedTooLarge is the sentinel of [CodeDecompressedTooLarge],
              returned as is.
            name: DecompressedTooLarge
            reexport: coretransform.DecompressedTooLarge
            type: "*errs.Error"
          - doc: |-
              GzipFailed is the sentinel of [CodeGzipFailed]; the stdlib's error is
              kept beneath it.
            name: GzipFailed
            reexport: coretransform.GzipFailed
            type: "*errs.Error"
          - doc: FlateFailed is the sentinel of [CodeFlateFailed].
            name: FlateFailed
            reexport: coretransform.FlateFailed
            type: "*errs.Error"
          - doc: ZlibFailed is the sentinel of [CodeZlibFailed].
            name: ZlibFailed
            reexport: coretransform.ZlibFailed
            type: "*errs.Error"
      - alias:
          - doc: |-
              Algorithm is the name a Compressor registers under. The zero value is
              reserved as invalid.
            name: Algorithm
            target: coretransform.Algorithm
      - alias:
          - doc: |-
              Compressor is one compression scheme: Compress and Decompress append to dst.
              Implementations are safe for concurrent use.
            name: Compressor
            target: coretransform.Compressor
      - alias:
          - doc: |-
              BoundedDecompressor is the optional extension of a Compressor that can be
              told how much plaintext it may produce; DecompressBounded uses it when the
              scheme has it.
            name: BoundedDecompressor
            target: coretransform.BoundedDecompressor
      - func:
          doc: Lookup returns the Compressor registered under algo.
          forward: coretransform.Lookup
          in:
            - name: algo
              type: Algorithm
          name: Lookup
          out:
            - name: c
              type: Compressor
            - name: ok
              type: bool
      - func:
          doc: Available returns the registered Algorithms, sorted.
          forward: coretransform.Available
          name: Available
          out:
            - type: "[]Algorithm"
    functions:
      - doc: |-
          Compress compresses src with the scheme registered under algo and appends
          the result to dst. An unregistered algo is refused with UnknownCompressor
          and dst comes back as it was.
        in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Compress
        out:
          - name: encoded
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Decompress decompresses src with the scheme registered under algo and
          appends the result to dst, bounded by the scheme's own backstop. To bound
          it by a number of your own, call DecompressBounded. An unregistered algo is
          refused with UnknownCompressor and dst comes back as it was.
        in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
        name: Decompress
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          DecompressBounded decompresses src with the scheme registered under algo
          and appends the result to dst, producing at most limit bytes of plaintext:
          a stream that would produce more is refused with DecompressedTooLarge and
          dst comes back as it was. A limit of zero admits an empty stream and nothing
          else, and a negative limit is read as zero rather than given a meaning of
          its own.

          A scheme implementing BoundedDecompressor stops at limit, so the work is
          bounded too. A scheme that does not — a consumer's own, or one of the
          third-party module's — is decompressed under its own backstop and judged
          afterwards: declining to tighten the work can never change the verdict,
          only the bytes touched reaching it.
        in:
          - name: algo
            type: Algorithm
          - name: dst
          - name: src
            type: "[]byte"
          - name: limit
            type: int64
        name: DecompressBounded
        out:
          - name: decoded
            type: "[]byte"
          - name: err
            type: error
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/transform
