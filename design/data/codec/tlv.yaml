apiVersion: kit.kitsunium/design/v2
domain: data/codec/tlv
packages:
  - codes:
      - const:
          - doc: |-
              CodeTLVMarshalFailed identifies an encode-side failure (reflection
              dispatch, unsupported value, writer error during streaming encode).
            name: CodeTLVMarshalFailed
            note: "range: 0.3.22.0 - 0.3.22.255"
            value: "0x00_03_16_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVUnmarshalFailed identifies a decode-side failure (malformed
              record, type mismatch, reader error during streaming decode).
            name: CodeTLVUnmarshalFailed
            value: "0x00_03_16_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVUnsupportedType identifies a value whose reflect.Kind cannot be
              TLV-encoded (chan, func, complex*, unsafe.Pointer).
            name: CodeTLVUnsupportedType
            value: "0x00_03_16_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVDepthExceeded identifies a nested value whose depth exceeds the
              hard cap of 32 levels (CWE-674 stack-exhaustion defence).
            name: CodeTLVDepthExceeded
            value: "0x00_03_16_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVSizeExceeded identifies an Unmarshal input whose length exceeds
              the 10 MiB hard cap (CWE-400 memory-exhaustion defence).
            name: CodeTLVSizeExceeded
            value: "0x00_03_16_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVTruncated identifies a buffer that ends mid-record (length
              declared but value bytes missing, or varint declared but bytes missing).
            name: CodeTLVTruncated
            value: "0x00_03_16_06"
        type: errs.Code
    doc: |-
      Package tlv declares the error codes and the sentinels of the TLV codec,
      internal/service/data/codec/tlv — range 0.3.22.* (ADR 0006
      service/data/codec/tlv block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package tlv — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/tlv
    sentinels:
      - var:
          - code: CodeTLVMarshalFailed
            doc: MarshalFailed wraps an encode-side failure in the TLV codec.
            name: MarshalFailed
            private: "service/data/codec/tlv: Marshal/Append/Encode failed during reflection-driven encode"
            public: TLV encoding failed
            reason: MARSHAL_FAILED
          - code: CodeTLVUnmarshalFailed
            doc: UnmarshalFailed wraps a decode-side failure in the TLV codec.
            name: UnmarshalFailed
            private: "service/data/codec/tlv: Unmarshal/Decode failed (malformed record, type mismatch, reader error)"
            public: TLV decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeTLVUnsupportedType
            doc: |-
              UnsupportedType fires for values the TLV format cannot represent
              (chan, func, complex*, unsafe.Pointer).
            name: UnsupportedType
            private: "service/data/codec/tlv: reflect.Kind is not representable in the TLV wire format"
            public: TLV codec cannot encode this type
            reason: UNSUPPORTED_TYPE
          - code: CodeTLVDepthExceeded
            doc: DepthExceeded fires when a nested value exceeds the 32-level cap.
            name: DepthExceeded
            private: "service/data/codec/tlv: nesting depth > maxTLVDepth (CWE-674 defence)"
            public: TLV nesting depth exceeds limit
            reason: DEPTH_EXCEEDED
          - code: CodeTLVSizeExceeded
            doc: SizeExceeded fires when an Unmarshal input exceeds the 10 MiB cap.
            name: SizeExceeded
            private: "service/data/codec/tlv: len(data) exceeds maxTLVBytes (CWE-400 defence)"
            public: TLV input exceeds size limit
            reason: SIZE_EXCEEDED
          - code: CodeTLVTruncated
            doc: Truncated fires when a buffer ends mid-record.
            name: Truncated
            private: "service/data/codec/tlv: buffer ended before the declared record length was satisfied"
            public: TLV buffer truncated
            reason: TRUNCATED
  - doc: |-
      Package tlv implements a self-describing Type-Length-Value codec.
      Every value is encoded as a 1-byte tag, an unsigned LEB128 length, and
      a tag-specific value payload. Composite tags (slice/map/struct) recurse
      into nested TLV records. Reflection drives both directions so arbitrary
      Go values fit through the same Marshal/Unmarshal interface.

      The codec is registered under Name "tlv" and the canonical
      "application/x-tlv" MIME type at package import time.

      Package tlv — reflection-driven decoder shared by Unmarshal and the
      streaming Decoder. Every helper returns the residual byte slice plus a
      wrapped *errs.Error on failure.

      Package tlv — target-aware decode fast path.

      The default decoder (decoder.go) produces an untyped value tree
      (map[string]any for structs, []any for slices, map[any]any for maps)
      then projects it onto the caller's typed target. For typed-struct
      targets this pays two costs: the outer map[string]any allocation +
      per-field string keys, AND a second walk through projectMapToStruct.

      decodeStructInto walks the wire ONCE, locating each field by name
      in the cached structTypeInfo and assigning into target.Field(i)
      directly. The result is byte-identical to the untyped path on
      roundtrip; only the in-flight allocation profile changes.

      Scope: top-level *struct targets only. Nested struct fields still
      fall through the untyped decodeValue + convertValue helpers so
      cross-shape narrowings (e.g. map[string]any field on a typed
      struct) remain compatible. Extending the fast path to nested
      structs is a follow-up that reuses the same primitives.

      Package tlv — reflection-driven encoder shared by Marshal, Append, and
      the streaming Encoder. Every helper returns the (possibly re-allocated)
      destination slice plus a wrapped *errs.Error on failure.

      Package tlv — shared reflection helpers used by both encoder and decoder.

      reflectView is the local wrapper that lets package-internal helpers
      accept reflect values without exposing the concrete reflect.Value type
      across the encode/decode boundary. bytesFromReflectValue is the only
      reflection helper currently shared by both sides — the decoder uses
      the slice fast-path when reconstructing []byte targets, the encoder
      uses the array fallback when emitting `tagBytes` from an array source.

      Package tlv — type metadata cache shared by encoder and decoder.

      Reflection-driven codecs pay reflect.Type.NumField + reflect.Type.Field
      on every encode and every decode. For hot-path payloads with repeated
      types those calls dominate the ns/op budget. structTypeInfoCache
      memoises the (field name, index, type, kind) tuples per reflect.Type
      pointer so subsequent encodes/decodes of the same struct skip the
      reflect walk entirely and reuse the cached metadata.

      The cache is global, write-once-per-type, lock-free on the read path
      (sync.Map's read-mostly fast path). reflect.Type pointers are stable
      for the life of the process, so cache invalidation is unnecessary.

      Package tlv — wire-format tag constants and shared limits for the TLV
      (Type-Length-Value) codec.

      Wire layout (each record):

      	tag(1B) length(varint) value(...)

      length is unsigned LEB128 (1-10 bytes); value layout depends on the tag.
    functions:
      - doc: New returns the TLV codec singleton.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/tlv
    types:
      - doc: Tag is the 1-byte type discriminator that opens every TLV record.
        name: Tag
        underlying: uint8
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton plus the hoisted MIME /
          extension tables.
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name TLV is registered under. It is an untyped constant, so it
          goes wherever a format name is taken — the codec package's Marshal,
          config.FSSource's string, i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"tlv\""
    doc: |-
      Package tlv registers the TLV codec with the SDK's codec registry — and no
      other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/tlv"

      The codec is the SDK's self-describing Type-Length-Value binary: every
      value carries its kind and its length, so a document decodes without a
      schema, into a typed target or into an interface. Structs, maps, slices
      and the scalar kinds are written by reflection. Input is bounded in size
      and depth. It streams.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.22.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.22.1  the value could not be encoded, or the writer failed
      	CodeUnmarshalFailed  0.3.22.2  a malformed record, a type mismatch, or the reader failed
      	CodeUnsupportedType  0.3.22.3  a channel, a function, a complex number, an unsafe pointer
      	CodeDepthExceeded    0.3.22.4  nesting past 32 levels
      	CodeSizeExceeded     0.3.22.5  an input past 10 MiB
      	CodeTruncated        0.3.22.6  the input ends inside a record

      No error message quotes the input.
    facade:
      - const:
          - doc: |-
              CodeMarshalFailed is 0.3.22.1: the value could not be encoded, or the
              writer failed.
            name: CodeMarshalFailed
            reexport: coretlv.CodeTLVMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_16_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.22.2: a malformed record, a type mismatch, or
              the reader failed.
            name: CodeUnmarshalFailed
            reexport: coretlv.CodeTLVUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_16_02"
          - doc: |-
              CodeUnsupportedType is 0.3.22.3: a channel, a function, a complex
              number, an unsafe pointer.
            name: CodeUnsupportedType
            reexport: coretlv.CodeTLVUnsupportedType
            type: errs.Code
            typed: true
            value: "0x00_03_16_03"
          - doc: "CodeDepthExceeded is 0.3.22.4: nesting past 32 levels."
            name: CodeDepthExceeded
            reexport: coretlv.CodeTLVDepthExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_16_04"
          - doc: "CodeSizeExceeded is 0.3.22.5: an input past 10 MiB."
            name: CodeSizeExceeded
            reexport: coretlv.CodeTLVSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_16_05"
          - doc: "CodeTruncated is 0.3.22.6: the input ends inside a record."
            name: CodeTruncated
            reexport: coretlv.CodeTLVTruncated
            type: errs.Code
            typed: true
            value: "0x00_03_16_06"
        doc: The error codes, range 0.3.22.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: coretlv.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: coretlv.UnmarshalFailed
            type: "*errs.Error"
          - doc: UnsupportedType is the sentinel of [CodeUnsupportedType].
            name: UnsupportedType
            reexport: coretlv.UnsupportedType
            type: "*errs.Error"
          - doc: DepthExceeded is the sentinel of [CodeDepthExceeded].
            name: DepthExceeded
            reexport: coretlv.DepthExceeded
            type: "*errs.Error"
          - doc: SizeExceeded is the sentinel of [CodeSizeExceeded].
            name: SizeExceeded
            reexport: coretlv.SizeExceeded
            type: "*errs.Error"
          - doc: Truncated is the sentinel of [CodeTruncated].
            name: Truncated
            reexport: coretlv.Truncated
            type: "*errs.Error"
    imports:
      coretlv: github.com/kitsunium/sdk/internal/core/data/codec/tlv
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/tlv
