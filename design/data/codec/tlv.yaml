apiVersion: kit.kitsunium/design/v2
domain: data/codec/tlv
packages:
  - codes:
      - const:
          - doc: |-
              CodeTLVMarshalFailed identifies an encode-side failure (reflection
              dispatch, unsupported value, writer error during streaming encode).
            name: CodeTLVMarshalFailed
            note: "range: 0.3.22.0 - 0.3.22.255"
            value: "0x00_03_16_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVUnmarshalFailed identifies a decode-side failure (malformed
              record, type mismatch, reader error during streaming decode).
            name: CodeTLVUnmarshalFailed
            value: "0x00_03_16_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVUnsupportedType identifies a value whose reflect.Kind cannot be
              TLV-encoded (chan, func, complex*, unsafe.Pointer).
            name: CodeTLVUnsupportedType
            value: "0x00_03_16_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVDepthExceeded identifies a nested value whose depth exceeds the
              hard cap of 32 levels (CWE-674 stack-exhaustion defence).
            name: CodeTLVDepthExceeded
            value: "0x00_03_16_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVSizeExceeded identifies an Unmarshal input whose length exceeds
              the 10 MiB hard cap (CWE-400 memory-exhaustion defence).
            name: CodeTLVSizeExceeded
            value: "0x00_03_16_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLVTruncated identifies a buffer that ends mid-record (length
              declared but value bytes missing, or varint declared but bytes missing).
            name: CodeTLVTruncated
            value: "0x00_03_16_06"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/tlv
    sentinels:
      - var:
          - code: CodeTLVMarshalFailed
            doc: MarshalFailed wraps an encode-side failure in the TLV codec.
            name: MarshalFailed
            private: "service/data/codec/tlv: Marshal/Append/Encode failed during reflection-driven encode"
            public: TLV encoding failed
            reason: MARSHAL_FAILED
          - code: CodeTLVUnmarshalFailed
            doc: UnmarshalFailed wraps a decode-side failure in the TLV codec.
            name: UnmarshalFailed
            private: "service/data/codec/tlv: Unmarshal/Decode failed (malformed record, type mismatch, reader error)"
            public: TLV decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeTLVUnsupportedType
            doc: |-
              UnsupportedType fires for values the TLV format cannot represent
              (chan, func, complex*, unsafe.Pointer).
            name: UnsupportedType
            private: "service/data/codec/tlv: reflect.Kind is not representable in the TLV wire format"
            public: TLV codec cannot encode this type
            reason: UNSUPPORTED_TYPE
          - code: CodeTLVDepthExceeded
            doc: DepthExceeded fires when a nested value exceeds the 32-level cap.
            name: DepthExceeded
            private: "service/data/codec/tlv: nesting depth > maxTLVDepth (CWE-674 defence)"
            public: TLV nesting depth exceeds limit
            reason: DEPTH_EXCEEDED
          - code: CodeTLVSizeExceeded
            doc: SizeExceeded fires when an Unmarshal input exceeds the 10 MiB cap.
            name: SizeExceeded
            private: "service/data/codec/tlv: len(data) exceeds maxTLVBytes (CWE-400 defence)"
            public: TLV input exceeds size limit
            reason: SIZE_EXCEEDED
          - code: CodeTLVTruncated
            doc: Truncated fires when a buffer ends mid-record.
            name: Truncated
            private: "service/data/codec/tlv: buffer ended before the declared record length was satisfied"
            public: TLV buffer truncated
            reason: TRUNCATED
  - functions:
      - name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/tlv
    types:
      - name: Tag
        underlying: uint8
    variables:
      - name: Codec
        type: codec.Codec
  - constants:
      - name: Format
        value: "\"tlv\""
    facade:
      - const:
          - doc: |-
              CodeMarshalFailed is 0.3.22.1: the value could not be encoded, or the
              writer failed.
            name: CodeMarshalFailed
            reexport: coretlv.CodeTLVMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_16_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.22.2: a malformed record, a type mismatch, or
              the reader failed.
            name: CodeUnmarshalFailed
            reexport: coretlv.CodeTLVUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_16_02"
          - doc: |-
              CodeUnsupportedType is 0.3.22.3: a channel, a function, a complex
              number, an unsafe pointer.
            name: CodeUnsupportedType
            reexport: coretlv.CodeTLVUnsupportedType
            type: errs.Code
            typed: true
            value: "0x00_03_16_03"
          - doc: "CodeDepthExceeded is 0.3.22.4: nesting past 32 levels."
            name: CodeDepthExceeded
            reexport: coretlv.CodeTLVDepthExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_16_04"
          - doc: "CodeSizeExceeded is 0.3.22.5: an input past 10 MiB."
            name: CodeSizeExceeded
            reexport: coretlv.CodeTLVSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_16_05"
          - doc: "CodeTruncated is 0.3.22.6: the input ends inside a record."
            name: CodeTruncated
            reexport: coretlv.CodeTLVTruncated
            type: errs.Code
            typed: true
            value: "0x00_03_16_06"
        doc: The error codes, range 0.3.22.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: coretlv.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: coretlv.UnmarshalFailed
            type: "*errs.Error"
          - doc: UnsupportedType is the sentinel of [CodeUnsupportedType].
            name: UnsupportedType
            reexport: coretlv.UnsupportedType
            type: "*errs.Error"
          - doc: DepthExceeded is the sentinel of [CodeDepthExceeded].
            name: DepthExceeded
            reexport: coretlv.DepthExceeded
            type: "*errs.Error"
          - doc: SizeExceeded is the sentinel of [CodeSizeExceeded].
            name: SizeExceeded
            reexport: coretlv.SizeExceeded
            type: "*errs.Error"
          - doc: Truncated is the sentinel of [CodeTruncated].
            name: Truncated
            reexport: coretlv.Truncated
            type: "*errs.Error"
    imports:
      coretlv: github.com/kitsunium/sdk/internal/core/data/codec/tlv
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/tlv
