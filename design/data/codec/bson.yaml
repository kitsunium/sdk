      - in:
          - name: s
            type: string
        name: ParseDecimal128
        out:
          - type: Decimal128
          - type: error
      - in:
          - name: s
            type: string
        name: ObjectIDFromHex
        out:
          - type: ObjectID
          - type: error
      - in:
          - name: t
            type: time.Time
        name: NewDateTimeFromTime
        out:
          - type: DateTime
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/bson
    types:
      - methods:
          - name: GetBytes
            out:
              - name: high
              - name: low
                type: uint64
            recv: value
          - name: IsNaN
            out:
              - type: bool
            recv: value
          - name: IsInf
            out:
              - type: int
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: Decimal128
        struct:
          unexported: true
      - methods:
          - name: Hex
            out:
              - type: string
            recv: value
          - name: String
            out:
              - type: string
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - name: Timestamp
            out:
              - type: time.Time
            recv: value
          - name: MarshalText
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: text
                type: "[]byte"
            name: UnmarshalText
            out:
              - type: error
            recv: pointer
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: ObjectID
        underlying: "[objectIDSize]byte"
      - name: D
        underlying: "[]E"
      - name: E
        struct:
          fields:
            - name: Key
              type: string
            - name: Value
              type: any
      - name: M
        underlying: map[string]any
      - name: A
        underlying: "[]any"
      - methods:
          - in:
              - name: other
                type: Binary
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: Binary
        struct:
          fields:
            - name: Subtype
              type: byte
            - name: Data
              type: "[]byte"
      - name: Undefined
        struct: {}
      - name: "Null"
        struct: {}
      - name: MinKey
        struct: {}
      - name: MaxKey
        struct: {}
      - methods:
          - name: Time
            out:
              - type: time.Time
            recv: value
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: DateTime
        underlying: int64
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - in:
              - name: other
                type: Regex
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: Regex
        struct:
          fields:
            - name: Pattern
              type: string
            - name: Options
              type: string
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - in:
              - name: other
                type: DBPointer
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: DBPointer
        struct:
          fields:
            - name: DB
              type: string
            - name: Pointer
              type: ObjectID
      - name: JavaScript
        underlying: string
      - name: Symbol
        underlying: string
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: CodeWithScope
        struct:
          fields:
            - name: Code
              type: JavaScript
            - name: Scope
              type: any
      - methods:
          - in:
              - name: other
                type: Timestamp
            name: After
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Before
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Compare
            out:
              - type: int
            recv: value
        name: Timestamp
        struct:
          fields:
            - name: T
              type: uint32
            - name: I
              type: uint32
