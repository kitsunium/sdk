apiVersion: kit.kitsunium/design/v2
domain: data/codec/bson
packages:
  - codes:
      - const:
          - doc: |-
              CodeBSONMarshalFailed identifies a value Marshal or Append cannot encode: a
              top level that is not a document, a type BSON has no representation for, a
              string that is not UTF-8, a key holding a NUL, or an error a MarshalBSON
              method returned.
            name: CodeBSONMarshalFailed
            note: "range: 0.3.36.0 - 0.3.36.255"
            value: "0x00_03_24_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeBSONUnmarshalFailed identifies input Unmarshal refuses: bytes that are
              not one well-formed BSON document, or a value the target cannot hold.
            name: CodeBSONUnmarshalFailed
            value: "0x00_03_24_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeBSONSizeExceeded identifies an Unmarshal input whose length exceeds the
              10 MiB hard cap (CWE-400 memory-exhaustion defence before any byte is read).
            name: CodeBSONSizeExceeded
            value: "0x00_03_24_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeBSONDepthExceeded identifies a document or value nested deeper than
              maxBSONNestedLevels, in either direction (CWE-674 stack-exhaustion defence;
              on the encode side it is also what a cyclic value runs into).
            name: CodeBSONDepthExceeded
            value: "0x00_03_24_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeBSONValueInvalid identifies a BSON value type that cannot be built from
              what it was given: a malformed ObjectID hex string, a decimal128 string that
              is not a number or not exactly representable, a JSON form of either that is
              neither of the shapes accepted.
            name: CodeBSONValueInvalid
            value: "0x00_03_24_05"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/bson
    sentinels:
      - var:
          - code: CodeBSONMarshalFailed
            doc: MarshalFailed marks a value Marshal or Append cannot encode.
            name: MarshalFailed
            private: "service/data/codec/bson: the value has no BSON encoding"
            public: BSON encoding failed
            reason: BSON_MARSHAL_FAILED
          - code: CodeBSONUnmarshalFailed
            doc: UnmarshalFailed marks input Unmarshal refuses.
            name: UnmarshalFailed
            private: "service/data/codec/bson: the input is not a well-formed BSON document the target can hold"
            public: BSON decoding failed
            reason: BSON_UNMARSHAL_FAILED
          - code: CodeBSONSizeExceeded
            doc: SizeExceeded marks an Unmarshal input over the 10 MiB hard cap.
            name: SizeExceeded
            private: "service/data/codec/bson: len(data) exceeds maxBSONBytes"
            public: BSON input exceeds size limit
            reason: BSON_SIZE_EXCEEDED
          - code: CodeBSONDepthExceeded
            doc: |-
              DepthExceeded marks a document or value nested deeper than the codec
              reads or writes.
            name: DepthExceeded
            private: "service/data/codec/bson: nesting exceeds maxBSONNestedLevels"
            public: BSON nesting depth exceeds limit
            reason: BSON_DEPTH_EXCEEDED
          - code: CodeBSONValueInvalid
            doc: ValueInvalid marks a BSON value type that cannot be built from its input.
            name: ValueInvalid
            private: "service/data/codec/bson: the input does not describe a value of this BSON type"
            public: BSON value is invalid
            reason: BSON_VALUE_INVALID
  - constants:
      - name: BinaryGeneric
        type: byte
        value: "0x00"
      - name: BinaryFunction
        type: byte
        value: "0x01"
      - name: BinaryOld
        type: byte
        value: "0x02"
      - name: BinaryUUIDOld
        type: byte
        value: "0x03"
      - name: BinaryUUID
        type: byte
        value: "0x04"
      - name: BinaryMD5
        type: byte
        value: "0x05"
      - name: BinaryEncrypted
        type: byte
        value: "0x06"
      - name: BinaryColumn
        type: byte
        value: "0x07"
      - name: BinarySensitive
        type: byte
        value: "0x08"
      - name: BinaryVector
        type: byte
        value: "0x09"
      - name: BinaryUserDefined
        type: byte
        value: "0x80"
    functions:
      - name: New
        out:
          - type: codec.Codec
      - in:
          - name: high
          - name: low
            type: uint64
        name: NewDecimal128
        out:
          - type: Decimal128
      - in:
          - name: s
            type: string
        name: ParseDecimal128
        out:
          - type: Decimal128
          - type: error
      - in:
          - name: s
            type: string
        name: ObjectIDFromHex
        out:
          - type: ObjectID
          - type: error
      - in:
          - name: t
            type: time.Time
        name: NewDateTimeFromTime
        out:
          - type: DateTime
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/bson
    types:
      - methods:
          - name: GetBytes
            out:
              - name: high
              - name: low
                type: uint64
            recv: value
          - name: IsNaN
            out:
              - type: bool
            recv: value
          - name: IsInf
            out:
              - type: int
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: Decimal128
        struct:
          unexported: true
      - methods:
          - name: Hex
            out:
              - type: string
            recv: value
          - name: String
            out:
              - type: string
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - name: Timestamp
            out:
              - type: time.Time
            recv: value
          - name: MarshalText
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: text
                type: "[]byte"
            name: UnmarshalText
            out:
              - type: error
            recv: pointer
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: ObjectID
        underlying: "[objectIDSize]byte"
      - name: D
        underlying: "[]E"
      - name: E
        struct:
          fields:
            - name: Key
              type: string
            - name: Value
              type: any
      - name: M
        underlying: map[string]any
      - name: A
        underlying: "[]any"
      - methods:
          - in:
              - name: other
                type: Binary
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: Binary
        struct:
          fields:
            - name: Subtype
              type: byte
            - name: Data
              type: "[]byte"
      - name: Undefined
        struct: {}
      - name: "Null"
        struct: {}
      - name: MinKey
        struct: {}
      - name: MaxKey
        struct: {}
      - methods:
          - name: Time
            out:
              - type: time.Time
            recv: value
          - name: MarshalJSON
            out:
              - type: "[]byte"
              - type: error
            recv: value
          - in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: DateTime
        underlying: int64
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - in:
              - name: other
                type: Regex
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: Regex
        struct:
          fields:
            - name: Pattern
              type: string
            - name: Options
              type: string
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - in:
              - name: other
                type: DBPointer
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: DBPointer
        struct:
          fields:
            - name: DB
              type: string
            - name: Pointer
              type: ObjectID
      - name: JavaScript
        underlying: string
      - name: Symbol
        underlying: string
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: CodeWithScope
        struct:
          fields:
            - name: Code
              type: JavaScript
            - name: Scope
              type: any
      - methods:
          - in:
              - name: other
                type: Timestamp
            name: After
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Before
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Equal
            out:
              - type: bool
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - in:
              - name: other
                type: Timestamp
            name: Compare
            out:
              - type: int
            recv: value
        name: Timestamp
        struct:
          fields:
            - name: T
              type: uint32
            - name: I
              type: uint32
    variables:
      - name: Codec
        type: codec.Codec
      - name: NilObjectID
        type: ObjectID
  - constants:
      - name: Format
        value: "\"bson\""
    facade:
      - const:
          - doc: BinaryGeneric is the default subtype, the one a []byte is written as.
            name: BinaryGeneric
            reexport: svcbson.BinaryGeneric
            type: byte
            typed: true
            value: "0x00"
          - doc: BinaryFunction marks a function.
            name: BinaryFunction
            reexport: svcbson.BinaryFunction
            type: byte
            typed: true
            value: "0x01"
          - doc: BinaryOld is the deprecated generic subtype, with an inner length.
            name: BinaryOld
            reexport: svcbson.BinaryOld
            type: byte
            typed: true
            value: "0x02"
          - doc: BinaryUUIDOld is the deprecated, byte-order-ambiguous UUID subtype.
            name: BinaryUUIDOld
            reexport: svcbson.BinaryUUIDOld
            type: byte
            typed: true
            value: "0x03"
          - doc: BinaryUUID is an RFC 9562 UUID.
            name: BinaryUUID
            reexport: svcbson.BinaryUUID
            type: byte
            typed: true
            value: "0x04"
          - doc: BinaryMD5 is an MD5 digest.
            name: BinaryMD5
            reexport: svcbson.BinaryMD5
            type: byte
            typed: true
            value: "0x05"
          - doc: BinaryEncrypted is a client-side encrypted value.
            name: BinaryEncrypted
            reexport: svcbson.BinaryEncrypted
            type: byte
            typed: true
            value: "0x06"
          - doc: BinaryColumn is a compressed time-series column.
            name: BinaryColumn
            reexport: svcbson.BinaryColumn
            type: byte
            typed: true
            value: "0x07"
          - doc: BinarySensitive marks data a server must not log.
            name: BinarySensitive
            reexport: svcbson.BinarySensitive
            type: byte
            typed: true
            value: "0x08"
          - doc: BinaryVector is a packed numeric vector.
            name: BinaryVector
            reexport: svcbson.BinaryVector
            type: byte
            typed: true
            value: "0x09"
          - doc: BinaryUserDefined is the first subtype reserved for applications.
            name: BinaryUserDefined
            reexport: svcbson.BinaryUserDefined
            type: byte
            typed: true
            value: "0x80"
        doc: The binary subtypes.
      - const:
          - doc: CodeMarshalFailed identifies a value Marshal or Append cannot encode.
            name: CodeMarshalFailed
            reexport: corebson.CodeBSONMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_24_01"
          - doc: CodeUnmarshalFailed identifies input Unmarshal refuses.
            name: CodeUnmarshalFailed
            reexport: corebson.CodeBSONUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_24_02"
          - doc: CodeSizeExceeded identifies an Unmarshal input past 10 MiB.
            name: CodeSizeExceeded
            reexport: corebson.CodeBSONSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_24_03"
          - doc: CodeDepthExceeded identifies nesting past 100 levels.
            name: CodeDepthExceeded
            reexport: corebson.CodeBSONDepthExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_24_04"
          - doc: |-
              CodeValueInvalid identifies a value type's constructor or parser
              refusing its input.
            name: CodeValueInvalid
            reexport: corebson.CodeBSONValueInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_24_05"
        doc: The error codes, range 0.3.36.*.
      - alias:
          - doc: D is a document whose element order matters.
            name: D
            target: svcbson.D
          - doc: E is one element of a D.
            name: E
            target: svcbson.E
          - doc: M is a document whose element order does not; its keys are written sorted.
            name: M
            target: svcbson.M
          - doc: A is an array.
            name: A
            target: svcbson.A
          - doc: |-
              ObjectID is the twelve-byte identifier; its text and JSON forms are 24
              hexadecimal digits.
            name: ObjectID
            target: svcbson.ObjectID
          - doc: DateTime is milliseconds since the Unix epoch, UTC.
            name: DateTime
            target: svcbson.DateTime
          - doc: |-
              Decimal128 is an IEEE 754-2008 128-bit decimal, converted exactly or
              not at all.
            name: Decimal128
            target: svcbson.Decimal128
          - doc: Binary is bytes and the subtype naming what they are.
            name: Binary
            target: svcbson.Binary
          - doc: Regex is a pattern and its options.
            name: Regex
            target: svcbson.Regex
          - doc: "Timestamp is the replication timestamp: seconds and an increment."
            name: Timestamp
            target: svcbson.Timestamp
          - doc: DBPointer is the deprecated namespace-and-ObjectID pointer.
            name: DBPointer
            target: svcbson.DBPointer
          - doc: JavaScript is JavaScript code.
            name: JavaScript
            target: svcbson.JavaScript
          - doc: Symbol is the deprecated symbol.
            name: Symbol
            target: svcbson.Symbol
          - doc: CodeWithScope is the deprecated JavaScript with its scope document.
            name: CodeWithScope
            target: svcbson.CodeWithScope
          - doc: MinKey sorts lower than every other value.
            name: MinKey
            target: svcbson.MinKey
          - doc: MaxKey sorts higher than every other value.
            name: MaxKey
            target: svcbson.MaxKey
          - doc: Undefined is the deprecated undefined value.
            name: Undefined
            target: svcbson.Undefined
          - doc: Null is an explicit null, for a D.
            name: "Null"
            target: svcbson.Null
        doc: The value types. Each is the BSON type of the same name.
      - func:
          doc: |-
            ObjectIDFromHex parses the 24-digit hexadecimal form of an ObjectID, in
            either case.
          forward: svcbson.ObjectIDFromHex
          in:
            - name: s
              type: string
          name: ObjectIDFromHex
          out:
            - type: ObjectID
            - type: error
      - func:
          doc: |-
            NewDateTimeFromTime returns the DateTime t falls in, truncated to the
            millisecond.
          forward: svcbson.NewDateTimeFromTime
          in:
            - name: t
              type: time.Time
          name: NewDateTimeFromTime
          out:
            - type: DateTime
      - func:
          doc: |-
            NewDecimal128 returns the decimal whose BID encoding is high (the first
            eight bytes) and low (the last eight).
          forward: svcbson.NewDecimal128
          in:
            - name: high
            - name: low
              type: uint64
          name: NewDecimal128
          out:
            - type: Decimal128
      - func:
          doc: |-
            ParseDecimal128 parses a decimal's string form — "1.23", "-4E+5", "NaN",
            "Infinity" — refusing one a decimal128 cannot hold exactly.
          forward: svcbson.ParseDecimal128
          in:
            - name: s
              type: string
          name: ParseDecimal128
          out:
            - type: Decimal128
            - type: error
    functions:
      - in:
          - name: v
            type: any
        name: Marshal
        out:
          - type: "[]byte"
          - type: error
      - in:
          - name: dst
            type: "[]byte"
          - name: v
            type: any
        name: Append
        out:
          - type: "[]byte"
          - type: error
      - in:
          - name: data
            type: "[]byte"
          - name: v
            type: any
        name: Unmarshal
        out:
          - type: error
    imports:
      corebson: github.com/kitsunium/sdk/internal/core/data/codec/bson
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcbson: github.com/kitsunium/sdk/internal/service/data/codec/bson
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/bson
    variables:
      - name: MarshalFailed
        type: "*errs.Error"
      - name: UnmarshalFailed
        type: "*errs.Error"
      - name: SizeExceeded
        type: "*errs.Error"
      - name: DepthExceeded
        type: "*errs.Error"
      - name: ValueInvalid
        type: "*errs.Error"
      - name: NilObjectID
        type: ObjectID
