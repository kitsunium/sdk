apiVersion: kit.kitsunium/design/v2
domain: data/codec/json
packages:
  - codes:
      - const:
          - doc: CodeJSONMarshalFailed identifies a failure inside encoding/json.Marshal.
            name: CodeJSONMarshalFailed
            note: "range: 0.3.2.0 - 0.3.2.255"
            value: "0x00_03_02_01"
        type: errs.Code
      - const:
          - doc: CodeJSONUnmarshalFailed identifies a failure inside encoding/json.Unmarshal.
            name: CodeJSONUnmarshalFailed
            value: "0x00_03_02_02"
        type: errs.Code
    doc: |-
      Package json declares the error codes and the sentinels of the JSON codec,
      internal/service/data/codec/json — range 0.3.2.* (ADR 0005
      service/data/codec/json block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package json — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/json
    sentinels:
      - var:
          - code: CodeJSONMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/json.Marshal.
            name: MarshalFailed
            private: "service/data/codec/json: encoding/json.Marshal returned an error"
            public: JSON encoding failed
            reason: MARSHAL_FAILED
          - code: CodeJSONUnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/json.Unmarshal.
            name: UnmarshalFailed
            private: "service/data/codec/json: encoding/json.Unmarshal returned an error"
            public: JSON decoding failed
            reason: UNMARSHAL_FAILED
  - doc: |-
      Package json wraps encoding/json as a codec.Codec implementation
      registered under Format("json"). Blank-importing this package is enough
      to make JSON resolvable via the core/data/codec registry.

      Package json — adapts *encoding/json.Decoder to codec.Decoder.

      Package json — adapts *encoding/json.Encoder to codec.Encoder.
    functions:
      - doc: New returns the JSON codec singleton.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/json
    variables:
      - doc: |-
          Codec is the JSON singleton, registered with core/data/codec at package
          load. Binding the registration result to a named var is more idiomatic
          than `var _ = codec.Register(...)` and keeps us clear of init().
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name JSON is registered under. It is an untyped constant, so
          it goes wherever a format name is taken — config.FSSource's string,
          i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"json\""
    doc: |-
      Package json registers the JSON codec with the SDK's codec registry — and
      no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/json"

      Everything that dispatches through the registry by format name then reads
      and writes JSON: config.FileSource and config.FSSource, i18n.LoadFS, and
      the codec package's Marshal and Unmarshal. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every format the SDK
      ships — BSON, CBOR, MessagePack and the rest — which
      a program that only reads JSON does not need to link. This package links
      the JSON codec, the core package declaring its codes and the standard
      library's encoding/json, and nothing else.

      Importing both packages is harmless: a format is registered by the package
      that implements it, which Go initialises once however many packages import
      it.

      # Errors

      Failures carry the range 0.3.2.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.2.1  encoding/json could not encode the value
      	CodeUnmarshalFailed  0.3.2.2  the input is not JSON the target can hold
    facade:
      - const:
          - doc: CodeMarshalFailed identifies a value encoding/json could not encode (0.3.2.1).
            name: CodeMarshalFailed
            reexport: corejson.CodeJSONMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_02_01"
          - doc: CodeUnmarshalFailed identifies input that is not JSON the target can hold (0.3.2.2).
            name: CodeUnmarshalFailed
            reexport: corejson.CodeJSONUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_02_02"
        doc: The error codes, range 0.3.2.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corejson.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corejson.UnmarshalFailed
            type: "*errs.Error"
    imports:
      corejson: github.com/kitsunium/sdk/internal/core/data/codec/json
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/json
