apiVersion: kit.kitsunium/design/v2
domain: data/codec/xml
packages:
  - codes:
      - const:
          - doc: CodeXMLMarshalFailed identifies a failure inside encoding/xml.Marshal.
            name: CodeXMLMarshalFailed
            note: "range: 0.3.3.0 - 0.3.3.255"
            value: "0x00_03_03_01"
        type: errs.Code
      - const:
          - doc: CodeXMLUnmarshalFailed identifies a failure inside encoding/xml.Unmarshal.
            name: CodeXMLUnmarshalFailed
            value: "0x00_03_03_02"
        type: errs.Code
    doc: |-
      Package xml declares the error codes and the sentinels of the XML codec,
      internal/service/data/codec/xml — range 0.3.3.* (ADR 0005
      service/data/codec/xml block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package xml — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/xml
    sentinels:
      - var:
          - code: CodeXMLMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/xml.Marshal.
            name: MarshalFailed
            private: "service/data/codec/xml: encoding/xml.Marshal returned an error"
            public: XML encoding failed
            reason: MARSHAL_FAILED
          - code: CodeXMLUnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/xml.Unmarshal.
            name: UnmarshalFailed
            private: "service/data/codec/xml: encoding/xml.Unmarshal returned an error"
            public: XML decoding failed
            reason: UNMARSHAL_FAILED
  - doc: |-
      Package xml wraps encoding/xml as a codec.Codec implementation registered
      under Format("xml"). Blank-importing this package is enough to make XML
      resolvable via the core/data/codec registry.

      Package xml — adapts *encoding/xml.Decoder to codec.Decoder.

      Package xml — adapts *encoding/xml.Encoder to codec.Encoder.
    functions:
      - doc: New returns an XML codec instance.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/xml
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton plus the hoisted MIME /
          extension tables.
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name XML is registered under. It is an untyped constant, so it
          goes wherever a format name is taken — the codec package's Marshal,
          config.FSSource's string, i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"xml\""
    doc: |-
      Package xml registers the XML codec with the SDK's codec registry — and no
      other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/xml"

      The codec is the standard library's encoding/xml, with its struct tags and
      its rules: a value marshals as an element, a struct names it with an
      XMLName field or its type name. It streams, one element per Encode or
      Decode.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.3.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.3.1  encoding/xml could not encode the value
      	CodeUnmarshalFailed  0.3.3.2  the input is not XML the target can hold

      No error message quotes the input.
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.3.1: encoding/xml could not encode the value."
            name: CodeMarshalFailed
            reexport: corexml.CodeXMLMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_03_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.3.2: the input is not XML the target can
              hold.
            name: CodeUnmarshalFailed
            reexport: corexml.CodeXMLUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_03_02"
        doc: The error codes, range 0.3.3.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corexml.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corexml.UnmarshalFailed
            type: "*errs.Error"
    imports:
      corexml: github.com/kitsunium/sdk/internal/core/data/codec/xml
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/xml
