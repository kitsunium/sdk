apiVersion: kit.kitsunium/design/v2
domain: data/codec/xml
packages:
  - codes:
      - const:
          - doc: CodeXMLMarshalFailed identifies a failure inside encoding/xml.Marshal.
            name: CodeXMLMarshalFailed
            note: "range: 0.3.3.0 - 0.3.3.255"
            value: "0x00_03_03_01"
        type: errs.Code
      - const:
          - doc: CodeXMLUnmarshalFailed identifies a failure inside encoding/xml.Unmarshal.
            name: CodeXMLUnmarshalFailed
            value: "0x00_03_03_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/xml
    sentinels:
      - var:
          - code: CodeXMLMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/xml.Marshal.
            name: MarshalFailed
            private: "service/data/codec/xml: encoding/xml.Marshal returned an error"
            public: XML encoding failed
            reason: MARSHAL_FAILED
          - code: CodeXMLUnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/xml.Unmarshal.
            name: UnmarshalFailed
            private: "service/data/codec/xml: encoding/xml.Unmarshal returned an error"
            public: XML decoding failed
            reason: UNMARSHAL_FAILED
  - functions:
      - name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/xml
    variables:
      - name: Codec
        type: codec.Codec
  - constants:
      - name: Format
        value: "\"xml\""
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.3.1: encoding/xml could not encode the value."
            name: CodeMarshalFailed
            reexport: corexml.CodeXMLMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_03_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.3.2: the input is not XML the target can
              hold.
            name: CodeUnmarshalFailed
            reexport: corexml.CodeXMLUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_03_02"
        doc: The error codes, range 0.3.3.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corexml.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corexml.UnmarshalFailed
            type: "*errs.Error"
    imports:
      corexml: github.com/kitsunium/sdk/internal/core/data/codec/xml
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/xml
