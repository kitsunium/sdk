apiVersion: kit.kitsunium/design/v2
domain: data/codec/ndjson
packages:
  - codes:
      - const:
          - doc: |-
              CodeNDJSONMarshalFailed identifies a failure inside encoding/json.Marshal
              when encoding a single NDJSON record.
            name: CodeNDJSONMarshalFailed
            note: "range: 0.3.11.0 - 0.3.11.255"
            value: "0x00_03_0B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeNDJSONUnmarshalFailed identifies a failure inside encoding/json.Unmarshal
              when decoding a single NDJSON record.
            name: CodeNDJSONUnmarshalFailed
            value: "0x00_03_0B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeNDJSONValueInvalid identifies a Marshal / Unmarshal call whose target is
              not a slice (NDJSON models a stream of records).
            name: CodeNDJSONValueInvalid
            value: "0x00_03_0B_03"
        type: errs.Code
    doc: |-
      Package ndjson declares the error codes and the sentinels of the NDJSON
      codec, internal/service/data/codec/ndjson — range 0.3.11.* (ADR 0005
      service/data/codec/ndjson block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package ndjson — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/ndjson
    sentinels:
      - var:
          - code: CodeNDJSONMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/json.Marshal on a single record.
            name: MarshalFailed
            private: "service/data/codec/ndjson: encoding/json.Marshal returned an error on a record"
            public: NDJSON encoding failed
            reason: MARSHAL_FAILED
          - code: CodeNDJSONUnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/json.Unmarshal on a single record.
            name: UnmarshalFailed
            private: "service/data/codec/ndjson: encoding/json.Unmarshal returned an error on a record"
            public: NDJSON decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeNDJSONValueInvalid
            doc: ValueInvalid fires when the caller does not pass a slice target.
            name: ValueInvalid
            private: "service/data/codec/ndjson: Marshal/Unmarshal called with a non-slice argument"
            public: NDJSON codec requires a slice target
            reason: VALUE_INVALID
  - doc: |-
      Package ndjson implements newline-delimited JSON as a codec.Codec.
      Each record is a JSON value followed by a single '\n' — the format is
      intentionally line-oriented so that partial reads remain parseable.
      The codec accepts slice values: Marshal emits one record per element,
      Unmarshal splits on '\n' and decodes each non-empty line into a new
      slice element.
    functions:
      - doc: New returns an NDJSON codec instance.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/ndjson
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton plus the hoisted MIME /
          extension tables (hoisted).
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name newline-delimited JSON is registered under. It is an
          untyped constant, so it goes wherever a format name is taken — the codec
          package's Marshal, config.FSSource's string, i18n.LoadFS's codec.Format —
          without a conversion.
        name: Format
        value: "\"ndjson\""
    doc: |-
      Package ndjson registers the NDJSON codec with the SDK's codec registry —
      and no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/ndjson"

      The codec writes and reads newline-delimited JSON: one encoding/json value
      per line, a stream of records. Its native value is a slice, one element per
      line; through the codec package's Marshal any other value is carried as a
      one-record stream. Its extensions are .ndjson and .jsonl.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.11.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.11.1  a record has no JSON encoding
      	CodeUnmarshalFailed  0.3.11.2  a line is not JSON its element can hold
      	CodeValueInvalid     0.3.11.3  the value or the target is not a slice

      No error message quotes the input.
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.11.1: a record has no JSON encoding."
            name: CodeMarshalFailed
            reexport: corendjson.CodeNDJSONMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0B_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.11.2: a line is not JSON its element can
              hold.
            name: CodeUnmarshalFailed
            reexport: corendjson.CodeNDJSONUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0B_02"
          - doc: "CodeValueInvalid is 0.3.11.3: the value or the target is not a slice."
            name: CodeValueInvalid
            reexport: corendjson.CodeNDJSONValueInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_0B_03"
        doc: The error codes, range 0.3.11.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corendjson.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corendjson.UnmarshalFailed
            type: "*errs.Error"
          - doc: ValueInvalid is the sentinel of [CodeValueInvalid].
            name: ValueInvalid
            reexport: corendjson.ValueInvalid
            type: "*errs.Error"
    imports:
      corendjson: github.com/kitsunium/sdk/internal/core/data/codec/ndjson
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/ndjson
