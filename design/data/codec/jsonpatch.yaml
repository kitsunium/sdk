apiVersion: kit.kitsunium/design/v2
domain: data/codec/jsonpatch
packages:
  - codes:
      - const:
          - doc: |-
              CodeNotJSON identifies a document to compare that is not exactly one JSON
              value, read strictly: a syntax error, a truncation, trailing data, a
              duplicated member name, invalid UTF-8, or nesting past the reader's bound.
            name: CodeNotJSON
            note: "range: 0.3.90.0 - 0.3.90.255"
            value: "0x00_03_5A_01"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/jsonpatch
    sentinels:
      - var:
          - code: CodeNotJSON
            doc: |-
              NotJSON refuses a document that is not exactly one JSON value. The fields
              name which document — "from" or "to" — and the byte offset where reading
              stopped, never what the document held.
            name: NotJSON
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/jsonpatch: a document is not exactly one well-formed JSON value; the fields name the document and the offset, never its content"
            public: A document to compare is not a JSON value
            reason: NOT_JSON
  - constants:
      - name: Add
        type: Op
        value: "\"add\""
      - name: Remove
        type: Op
        value: "\"remove\""
      - name: Replace
        type: Op
        value: "\"replace\""
    functions:
      - in:
          - name: from
          - name: to
            type: "[]byte"
        name: Diff
        out:
          - type: "[]EditValue"
          - type: error
    imports:
      json: encoding/json
    path: github.com/kitsunium/sdk/internal/service/data/codec/jsonpatch
    types:
      - name: Op
        underlying: string
      - name: EditValue
        struct:
          fields:
            - name: Op
              tag: json:"op"
              type: Op
            - name: Path
              tag: json:"path"
              type: string
            - name: Value
              tag: json:"value,omitempty"
              type: json.RawMessage
            - name: Old
              tag: json:"old,omitempty"
              type: json.RawMessage
  - aliases:
      - name: Op
        target: svcjsonpatch.Op
      - name: Edit
        target: svcjsonpatch.EditValue
    constants:
      - name: Add
        type: Op
        value: "\"add\""
      - name: Remove
        type: Op
        value: "\"remove\""
      - name: Replace
        type: Op
        value: "\"replace\""
      - name: CodeNotJSON
        type: errs.Code
        value: "0x00_03_5A_01"
    functions:
      - in:
          - name: from
          - name: to
            type: "[]byte"
        name: Diff
        out:
          - type: "[]Edit"
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcjsonpatch: github.com/kitsunium/sdk/internal/service/data/codec/jsonpatch
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/jsonpatch
    variables:
      - name: NotJSON
        type: "*errs.Error"
