apiVersion: kit.kitsunium/design/v2
domain: data/codec/flatbuffers
packages:
  - codes:
      - const:
          - doc: |-
              CodeFlatbuffersBadType identifies a Marshal call whose value is neither
              []byte nor an implementation of BytesProvider.
            name: CodeFlatbuffersBadType
            note: "range: 0.3.23.0 - 0.3.23.255"
            value: "0x00_03_17_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeFlatbuffersBadTarget identifies an Unmarshal call whose target is
              neither *[]byte nor an implementation of BytesAcceptor.
            name: CodeFlatbuffersBadTarget
            value: "0x00_03_17_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeFlatbuffersTruncated identifies a buffer shorter than the 4-byte
              root-offset header required by the FlatBuffers wire format, or larger
              than the package-level CWE-400 ceiling.
            name: CodeFlatbuffersTruncated
            value: "0x00_03_17_03"
        type: errs.Code
    doc: |-
      Package flatbuffers declares the error codes and the sentinels of the
      FlatBuffers passthrough codec, internal/service/data/codec/flatbuffers —
      range 0.3.23.* (ADR 0006 service/data/codec/flatbuffers block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package flatbuffers — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/flatbuffers
    sentinels:
      - var:
          - code: CodeFlatbuffersBadType
            doc: |-
              FlatbuffersBadType fires when Marshal cannot extract a byte payload
              from the argument (not []byte, not a BytesProvider).
            name: FlatbuffersBadType
            private: "service/data/codec/flatbuffers: Marshal argument is not []byte and does not implement BytesProvider"
            public: FlatBuffers codec requires []byte or a BytesProvider value
            reason: FLATBUFFERS_BAD_TYPE
          - code: CodeFlatbuffersBadTarget
            doc: |-
              FlatbuffersBadTarget fires when Unmarshal cannot publish the payload
              through the target (not *[]byte, not a BytesAcceptor).
            name: FlatbuffersBadTarget
            private: "service/data/codec/flatbuffers: Unmarshal target is not *[]byte and does not implement BytesAcceptor"
            public: FlatBuffers codec requires a *[]byte or BytesAcceptor target
            reason: FLATBUFFERS_BAD_TARGET
          - code: CodeFlatbuffersTruncated
            doc: |-
              FlatbuffersTruncated fires when the buffer is shorter than the
              4-byte root-offset header mandated by the FlatBuffers wire format
              or larger than the package-level CWE-400 ceiling.
            name: FlatbuffersTruncated
            private: "service/data/codec/flatbuffers: buffer length is invalid for the FlatBuffers wire format"
            public: FlatBuffers buffer is truncated
            reason: FLATBUFFERS_TRUNCATED
  - constants:
      - doc: |-
          PromotionMagic is the synthetic little-endian uint32 header stamped by
          the facade promotion path in pkg/v1/data/codec/promote.go when it wraps a
          non-FlatBuffer value in flatbuffers-shaped bytes. 0x80000001 is a
          deliberately invalid root offset (a real root offset points INTO the
          buffer, never past it AND never the high bit set), so a flatc-
          generated reader fails predictably on these bytes — only the SDK
          itself recognises and unwraps them.

          Exported so promote.go can stamp the same value without a duplicated
          magic-number constant.
        name: PromotionMagic
        type: uint32
        value: "0x80000001"
    doc: |-
      Package flatbuffers implements a thin passthrough codec for already-encoded
      FlatBuffer payloads. The universal Codec contract speaks `any`, but
      FlatBuffers is a schema-driven format whose typed access lives in caller
      code (generated by `flatc`). This package therefore registers a codec that
      round-trips raw FlatBuffer bytes — Marshal hands back the buffer the caller
      already has; Unmarshal publishes the buffer to the caller's target without
      parsing it. Real schema-typed reads stay in the caller's generated
      accessors.

      The codec uses no third-party dependency. The only validation is the
      4-byte root-offset header required by the FlatBuffers wire format.

      Package flatbuffers — small adapter interfaces that let strongly-typed
      FlatBuffers wrappers participate in the universal codec contract without
      reaching into schema-generated structs from this package.
    functions:
      - doc: New returns the FlatBuffers passthrough codec singleton.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/flatbuffers
    types:
      - decl: true
        doc: |-
          BytesProvider is the optional source interface a Marshal argument may
          satisfy to hand the codec its already-encoded FlatBuffer payload. The
          returned slice MUST remain valid for the lifetime of the codec call;
          the codec performs no copy and treats the buffer as read-only.

          `Provider`/`Acceptor` suffixes are registered as legitimate adapter-role
          vocabulary in `/workspace/.ktn-linter.yaml` (per kodflow/ktn-linter#337),
          so `KTN-INTERFACE-ERNAME` does not fire here.
        interface:
          methods:
            - name: Bytes
              out:
                - type: "[]byte"
        name: BytesProvider
      - decl: true
        doc: |-
          BytesAcceptor is the optional sink interface an Unmarshal target may
          satisfy to receive the decoded FlatBuffer payload. The codec passes the
          caller's data slice by reference; implementations that need ownership
          MUST copy the slice themselves.
        interface:
          methods:
            - in:
                - name: data
                  type: "[]byte"
              name: SetBytes
        name: BytesAcceptor
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton plus the hoisted MIME /
          extension tables.
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name FlatBuffers is registered under. It is an untyped
          constant, so it goes wherever a format name is taken — the codec package's
          Marshal, config.FSSource's string, i18n.LoadFS's codec.Format — without a
          conversion.
        name: Format
        value: "\"flatbuffers\""
    doc: |-
      Package flatbuffers registers the FlatBuffers codec with the SDK's codec
      registry — and no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/flatbuffers"

      The codec is a passthrough for payloads flatc-generated code already
      encoded: Marshal takes a []byte or a [BytesProvider] and hands the bytes
      back, Unmarshal fills a *[]byte or a [BytesAcceptor]. Reading the fields of
      a buffer stays in the generated accessors; the codec checks only that the
      buffer is long enough to hold a root offset and short enough to be read.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.23.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeBadType    0.3.23.1  Marshal was given neither a []byte nor a BytesProvider
      	CodeBadTarget  0.3.23.2  Unmarshal was given neither a *[]byte nor a BytesAcceptor
      	CodeTruncated  0.3.23.3  the buffer is shorter than its root offset, or past 64 MiB

      No error message quotes the input.
    facade:
      - const:
          - doc: |-
              CodeBadType is 0.3.23.1: Marshal was given neither a []byte nor a
              BytesProvider.
            name: CodeBadType
            reexport: coreflatbuffers.CodeFlatbuffersBadType
            type: errs.Code
            typed: true
            value: "0x00_03_17_01"
          - doc: |-
              CodeBadTarget is 0.3.23.2: Unmarshal was given neither a *[]byte nor a
              BytesAcceptor.
            name: CodeBadTarget
            reexport: coreflatbuffers.CodeFlatbuffersBadTarget
            type: errs.Code
            typed: true
            value: "0x00_03_17_02"
          - doc: |-
              CodeTruncated is 0.3.23.3: the buffer is shorter than its root offset,
              or past 64 MiB.
            name: CodeTruncated
            reexport: coreflatbuffers.CodeFlatbuffersTruncated
            type: errs.Code
            typed: true
            value: "0x00_03_17_03"
        doc: The error codes, range 0.3.23.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: BadType is the sentinel of [CodeBadType].
            name: BadType
            reexport: coreflatbuffers.FlatbuffersBadType
            type: "*errs.Error"
          - doc: BadTarget is the sentinel of [CodeBadTarget].
            name: BadTarget
            reexport: coreflatbuffers.FlatbuffersBadTarget
            type: "*errs.Error"
          - doc: Truncated is the sentinel of [CodeTruncated].
            name: Truncated
            reexport: coreflatbuffers.FlatbuffersTruncated
            type: "*errs.Error"
      - alias:
          - doc: |-
              BytesProvider is what a Marshal argument may implement to hand the codec
              its already-encoded FlatBuffer: the bytes are read, never copied, for the
              length of the call.
            name: BytesProvider
            target: svcflatbuffers.BytesProvider
      - alias:
          - doc: |-
              BytesAcceptor is what an Unmarshal target may implement to receive the
              buffer. The slice is the caller's input, passed by reference: an
              implementation that keeps it copies it.
            name: BytesAcceptor
            target: svcflatbuffers.BytesAcceptor
    imports:
      coreflatbuffers: github.com/kitsunium/sdk/internal/core/data/codec/flatbuffers
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcflatbuffers: github.com/kitsunium/sdk/internal/service/data/codec/flatbuffers
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/flatbuffers
