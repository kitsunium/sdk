apiVersion: kit.kitsunium/design/v2
domain: data/codec/yaml
packages:
  - codes:
      - const:
          - doc: |-
              CodeYAMLMarshalFailed identifies a value the encoder cannot write as YAML:
              an unsupported Go kind, a string that is not UTF-8, a key that is not a
              scalar, nesting past the bound, a MarshalYAML hook that failed, or a stream
              whose writer failed.
            name: CodeYAMLMarshalFailed
            note: "range: 0.3.4.0 - 0.3.4.255"
            value: "0x00_03_04_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLUnmarshalFailed identifies a document the decoder cannot read: a
              syntax error, input past a bound, or a value its Go target cannot hold.
              Every refusal below carries it in its trail, so errs.HasCode answers for
              all of them.
            name: CodeYAMLUnmarshalFailed
            value: "0x00_03_04_02"
        type: errs.Code
      - const:
          - doc: "CodeYAMLAnchorRefused identifies an anchor (&name): outside the subset."
            name: CodeYAMLAnchorRefused
            value: "0x00_03_04_03"
        type: errs.Code
      - const:
          - doc: "CodeYAMLAliasRefused identifies an alias (*name): outside the subset."
            name: CodeYAMLAliasRefused
            value: "0x00_03_04_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLTagRefused identifies an explicit tag (!local, !!str, !<uri>):
              outside the subset.
            name: CodeYAMLTagRefused
            value: "0x00_03_04_05"
        type: errs.Code
      - const:
          - doc: "CodeYAMLMergeKeyRefused identifies a merge key (<<): outside the subset."
            name: CodeYAMLMergeKeyRefused
            value: "0x00_03_04_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLMultiDocRefused identifies a second document where one was
              expected.
            name: CodeYAMLMultiDocRefused
            value: "0x00_03_04_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLComplexKeyRefused identifies a complex mapping key (the ? indicator,
              or a collection used as a key): outside the subset.
            name: CodeYAMLComplexKeyRefused
            value: "0x00_03_04_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLDirectiveRefused identifies a directive (%YAML, %TAG): outside the
              subset.
            name: CodeYAMLDirectiveRefused
            value: "0x00_03_04_09"
        type: errs.Code
      - const:
          - doc: CodeYAMLDuplicateKey identifies a mapping that holds the same key twice.
            name: CodeYAMLDuplicateKey
            value: "0x00_03_04_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLLeadingZeroRefused identifies an integer written with a leading zero
              read into a target whose value depends on it: YAML 1.1 reads 0644 as octal
              420, YAML 1.2 as decimal 644.
            name: CodeYAMLLeadingZeroRefused
            value: "0x00_03_04_0B"
        type: errs.Code
    doc: |-
      Package yaml declares the error codes and the sentinels of the YAML codec,
      internal/service/data/codec/yaml — range 0.3.4.* (ADR 0005
      service/data/codec/yaml block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package yaml — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/yaml
    sentinels:
      - var:
          - code: CodeYAMLMarshalFailed
            doc: MarshalFailed marks a value the encoder cannot write as YAML.
            name: MarshalFailed
            private: "service/data/codec/yaml: the value cannot be written in the supported YAML subset"
            public: YAML encoding failed
            reason: MARSHAL_FAILED
          - code: CodeYAMLUnmarshalFailed
            doc: UnmarshalFailed marks a document the decoder cannot read into its target.
            name: UnmarshalFailed
            private: "service/data/codec/yaml: not YAML of the supported subset, past a bound, or a value its target cannot hold"
            public: YAML decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeYAMLAnchorRefused
            doc: AnchorRefused marks an anchor, refused by name.
            name: AnchorRefused
            private: "service/data/codec/yaml: an anchor names a node for an alias to repeat; the subset has neither"
            public: YAML anchors (&) are outside the supported subset
            reason: ANCHOR_REFUSED
          - code: CodeYAMLAliasRefused
            doc: AliasRefused marks an alias, refused by name.
            name: AliasRefused
            private: "service/data/codec/yaml: an alias repeats an anchored node; refused, so no document expands past its size"
            public: YAML aliases (*) are outside the supported subset
            reason: ALIAS_REFUSED
          - code: CodeYAMLTagRefused
            doc: TagRefused marks an explicit tag, refused by name.
            name: TagRefused
            private: "service/data/codec/yaml: a tag overrides the core schema; the subset resolves every scalar by the core schema alone"
            public: YAML tags (! and !!) are outside the supported subset
            reason: TAG_REFUSED
          - code: CodeYAMLMergeKeyRefused
            doc: MergeKeyRefused marks a merge key, refused by name.
            name: MergeKeyRefused
            private: "service/data/codec/yaml: a merge key is a YAML 1.1 type that copies another mapping; quote it to mean the text <<"
            public: YAML merge keys (<<) are outside the supported subset
            reason: MERGE_KEY_REFUSED
          - code: CodeYAMLMultiDocRefused
            doc: MultipleDocumentsRefused marks a second document in a single-document read.
            name: MultipleDocumentsRefused
            private: "service/data/codec/yaml: Unmarshal reads exactly one document; a stream of documents is read with NewDecoder"
            public: YAML input holds more than one document
            reason: MULTIPLE_DOCUMENTS_REFUSED
          - code: CodeYAMLComplexKeyRefused
            doc: ComplexKeyRefused marks a complex mapping key, refused by name.
            name: ComplexKeyRefused
            private: "service/data/codec/yaml: a mapping key must be a scalar on one line; ? and collection keys are refused"
            public: YAML complex keys (?) are outside the supported subset
            reason: COMPLEX_KEY_REFUSED
          - code: CodeYAMLDirectiveRefused
            doc: DirectiveRefused marks a directive, refused by name.
            name: DirectiveRefused
            private: "service/data/codec/yaml: the subset is YAML 1.2.2 with no tag handle, so a directive has nothing to declare"
            public: YAML directives (%YAML, %TAG) are outside the supported subset
            reason: DIRECTIVE_REFUSED
          - code: CodeYAMLDuplicateKey
            doc: DuplicateKey marks a mapping that holds the same key twice.
            name: DuplicateKey
            private: "service/data/codec/yaml: two keys of one mapping read the same; neither is chosen over the other"
            public: YAML mapping holds the same key twice
            reason: DUPLICATE_KEY
          - code: CodeYAMLLeadingZeroRefused
            doc: |-
              LeadingZeroRefused marks an integer whose leading zero changes its value
              between YAML versions.
            name: LeadingZeroRefused
            private: "service/data/codec/yaml: write 0o644 for octal, 644 for decimal, or quote the text"
            public: YAML integer with a leading zero is octal in YAML 1.1 and decimal in 1.2
            reason: LEADING_ZERO_REFUSED
  - doc: |-
      Package yaml — the block structure: mappings, sequences, keys and values.

      Package yaml is the SDK's YAML codec: a native, standard-library-only
      reader and writer of a NAMED SUBSET of YAML 1.2.2, sized for configuration.

      # The subset

      Read: block mappings and sequences (by indentation, including a sequence
      at its key's own indentation and the compact "- key: value" form), flow
      mappings and sequences across lines, plain, single-quoted and double-quoted
      scalars with every YAML escape, literal (|) and folded (>) block scalars
      with their chomping and indentation indicators, comments, and one document
      with an optional "---" start and "..." end. Plain scalars resolve by the
      YAML 1.2 core schema: null and ~, true and false — never yes, no, on or off
      — decimal, 0o octal and 0x hexadecimal integers, floats with .inf and .nan.

      Refused BY NAME, each with its own code and the line and column it starts
      at: anchors (&), aliases (*), tags (! and !!), merge keys (<<), a second
      document, complex keys (?, or a collection as a key), directives (%YAML,
      %TAG), and a mapping holding the same key twice. An integer written with a
      leading zero (0644) is octal to YAML 1.1 and decimal to YAML 1.2; it reads
      as text into a string, and is refused by name wherever its value matters.

      A refusal never quotes the document: it carries a line, a column, a
      constant detail and, for a value its Go target cannot hold, the Go type.

      # Bounds

      A document holds at most 10 MiB, 1 048 576 nodes and 100 levels of nesting;
      an implicit key at most 1024 characters, as YAML itself bounds it. Nothing
      the decoder is given can make it panic.

      # Go values

      Struct fields use the yaml tag as gopkg.in/yaml.v3 does: a field's key is
      its tag's name or its own name in lower case, "-" leaves it out, and the
      flags are omitempty, flow (write the collection inline) and inline (merge a
      struct's fields, or collect the remaining keys into a map with string
      keys). An unknown key is ignored. A type may implement MarshalYAML() (any,
      error), UnmarshalYAML(func(any) error) error, encoding.TextMarshaler and
      encoding.TextUnmarshaler; time.Time and time.Duration are written and read
      as text. An untyped target receives nil, bool, int, int64 or uint64,
      float64, string, []any and map[string]any — a mapping keyed by each key's
      text.

      # Writing

      The encoder writes deterministic block style, indented by two spaces: struct
      fields in declaration order, map keys sorted. A string is written plain only
      when every YAML reader — the core schema, YAML 1.1, a timestamp parser —
      reads it back as the same string; otherwise it is double-quoted, and a
      multi-line string is a literal block. A float always carries its dot.

      # Streams

      Unmarshal reads exactly one document and refuses a second by name, where
      gopkg.in/yaml.v3 silently ignored it. NewDecoder reads a stream of
      "---"-separated documents, each one read by the same subset and bounded at
      10 MiB; NewEncoder writes one.

      The whole of YAML — every construct this package refuses — remains
      available through the opt-in third-party/codec/yaml package, registered as
      "yaml-full".

      Package yaml — the streaming decoder: one document per Decode.

      Package yaml — the streaming encoder: one document per Encode.

      Package yaml — how a refusal is built: the position every decoding refusal
      carries, a syntax error at it, a construct refused by name, and an encoding
      failure. The codes (range 0.3.4.*) and the sentinels are declared in
      internal/core/data/codec/yaml (ADR 0160).

      Package yaml — flow collections: [a, b] and {k: v}, across lines.

      Package yaml — the hooks a Go type implements, read once per type.

      Package yaml — the hooks a Go type may implement to choose its YAML.

      Package yaml — encoding: Go values resolved, then written in block style.

      Package yaml — encoding: the block layout of mappings, sequences and keys.

      Package yaml — encoding: collections in flow style, for the flow tag.

      Package yaml — encoding: how a scalar is written so every reader reads it back.

      Package yaml — the parsed document: an arena of nodes and the bounds on it.

      Package yaml — the parser: its state, its cursor, and one document.

      Package yaml — the YAML 1.2 core schema: what a plain scalar means.

      Package yaml — scalars: plain, single-quoted, double-quoted, and block.

      Package yaml — what a struct's yaml tags say, read once per type.

      Package yaml — decoding: the source checked, the document parsed, values built.

      Package yaml — decoding into typed targets, by reflection.
    functions:
      - doc: New returns a YAML codec instance.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/yaml
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton plus the hoisted MIME and
          extension tables.
        doc: Codec is the registered YAML singleton.
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name YAML is registered under. It is an untyped constant, so
          it goes wherever a format name is taken — config.FSSource's string,
          i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"yaml\""
    doc: |-
      Package yaml registers the YAML codec with the SDK's codec registry — and
      no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/yaml"

      Everything that dispatches through the registry by format name then reads
      and writes YAML: config.FileSource and config.FSSource, i18n.LoadFS, and
      the codec package's Marshal and Unmarshal. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every format the SDK
      ships — BSON, CBOR, MessagePack and the rest — which
      a program that only reads YAML does not need to link. This package links
      the YAML codec and nothing else: the codec is the SDK's own, written on the
      standard library alone.

      # A named subset of YAML 1.2.2

      The codec reads the YAML a configuration file is written in: block
      mappings and sequences, flow collections, plain, single- and double-quoted
      scalars, literal (|) and folded (>) blocks, comments, and one document with
      an optional "---" and "...". Plain scalars resolve by the YAML 1.2 core
      schema: true and false are the booleans — yes, no, on and off are text —
      and 0o and 0x prefix octal and hexadecimal integers.

      It refuses BY NAME, each with its own error code and the line and column
      it starts at, what a configuration does not need and what two YAML readers
      read differently: anchors and aliases, tags, merge keys, complex keys,
      directives, a second document, a mapping holding a key twice, and an
      integer written with a leading zero (0644 is octal to YAML 1.1 and decimal
      to YAML 1.2) wherever its value matters. A refusal never quotes the
      document. A document is bounded at 10 MiB, a million nodes and a hundred
      levels of nesting.

      Writing is deterministic block style, and a string is written plain only
      when every YAML reader reads it back as the same string.

      The whole of YAML stays available, opt-in, through the module
      github.com/kitsunium/sdk/third-party/codec/yaml, which registers
      gopkg.in/yaml.v3 as the Format "yaml-full"; it claims no extension, so
      ".yaml" keeps meaning this codec.

      Importing both this package and pkg/v1/data/codec is harmless: a format is
      registered by the package that implements it, which Go initialises once
      however many packages import it.

      # Errors

      Failures carry the range 0.3.4.*; match them with errs.HasCode, or the
      sentinels with errors.Is. Every refusal by name also carries
      CodeUnmarshalFailed in its trail, so testing for that code answers for all
      of them:

      	CodeMarshalFailed          0.3.4.1   a value the encoder cannot write in the subset
      	CodeUnmarshalFailed        0.3.4.2   not YAML of the subset, past a bound, or a value its target cannot hold
      	CodeAnchorRefused          0.3.4.3   an anchor, &name
      	CodeAliasRefused           0.3.4.4   an alias, *name
      	CodeTagRefused             0.3.4.5   a tag, !x, !!str, !<uri>
      	CodeMergeKeyRefused        0.3.4.6   a merge key, <<
      	CodeMultiDocRefused        0.3.4.7   a second document where one was expected
      	CodeComplexKeyRefused      0.3.4.8   a complex key, ? k, or a collection as a key
      	CodeDirectiveRefused       0.3.4.9   a directive, %YAML, %TAG
      	CodeDuplicateKey           0.3.4.10  a mapping holding one key twice
      	CodeLeadingZeroRefused     0.3.4.11  an integer written with a leading zero where its value matters
    facade:
      - const:
          - doc: CodeMarshalFailed identifies a value the encoder cannot write (0.3.4.1).
            name: CodeMarshalFailed
            reexport: coreyaml.CodeYAMLMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_04_01"
          - doc: |-
              CodeUnmarshalFailed identifies a document the decoder cannot read into
              its target (0.3.4.2); every refusal below carries it in its trail.
            name: CodeUnmarshalFailed
            reexport: coreyaml.CodeYAMLUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_04_02"
          - doc: CodeAnchorRefused identifies an anchor (0.3.4.3).
            name: CodeAnchorRefused
            reexport: coreyaml.CodeYAMLAnchorRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_03"
          - doc: CodeAliasRefused identifies an alias (0.3.4.4).
            name: CodeAliasRefused
            reexport: coreyaml.CodeYAMLAliasRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_04"
          - doc: CodeTagRefused identifies an explicit tag (0.3.4.5).
            name: CodeTagRefused
            reexport: coreyaml.CodeYAMLTagRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_05"
          - doc: CodeMergeKeyRefused identifies a merge key (0.3.4.6).
            name: CodeMergeKeyRefused
            reexport: coreyaml.CodeYAMLMergeKeyRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_06"
          - doc: CodeMultiDocRefused identifies a second document (0.3.4.7).
            name: CodeMultiDocRefused
            reexport: coreyaml.CodeYAMLMultiDocRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_07"
          - doc: CodeComplexKeyRefused identifies a complex mapping key (0.3.4.8).
            name: CodeComplexKeyRefused
            reexport: coreyaml.CodeYAMLComplexKeyRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_08"
          - doc: CodeDirectiveRefused identifies a directive (0.3.4.9).
            name: CodeDirectiveRefused
            reexport: coreyaml.CodeYAMLDirectiveRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_09"
          - doc: CodeDuplicateKey identifies a mapping holding one key twice (0.3.4.10).
            name: CodeDuplicateKey
            reexport: coreyaml.CodeYAMLDuplicateKey
            type: errs.Code
            typed: true
            value: "0x00_03_04_0A"
          - doc: |-
              CodeLeadingZeroRefused identifies an integer with a leading zero where
              its value matters (0.3.4.11).
            name: CodeLeadingZeroRefused
            reexport: coreyaml.CodeYAMLLeadingZeroRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_0B"
        doc: The error codes, range 0.3.4.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: coreyaml.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: coreyaml.UnmarshalFailed
            type: "*errs.Error"
          - doc: AnchorRefused is the sentinel of [CodeAnchorRefused].
            name: AnchorRefused
            reexport: coreyaml.AnchorRefused
            type: "*errs.Error"
          - doc: AliasRefused is the sentinel of [CodeAliasRefused].
            name: AliasRefused
            reexport: coreyaml.AliasRefused
            type: "*errs.Error"
          - doc: TagRefused is the sentinel of [CodeTagRefused].
            name: TagRefused
            reexport: coreyaml.TagRefused
            type: "*errs.Error"
          - doc: MergeKeyRefused is the sentinel of [CodeMergeKeyRefused].
            name: MergeKeyRefused
            reexport: coreyaml.MergeKeyRefused
            type: "*errs.Error"
          - doc: MultipleDocumentsRefused is the sentinel of [CodeMultiDocRefused].
            name: MultipleDocumentsRefused
            reexport: coreyaml.MultipleDocumentsRefused
            type: "*errs.Error"
          - doc: ComplexKeyRefused is the sentinel of [CodeComplexKeyRefused].
            name: ComplexKeyRefused
            reexport: coreyaml.ComplexKeyRefused
            type: "*errs.Error"
          - doc: DirectiveRefused is the sentinel of [CodeDirectiveRefused].
            name: DirectiveRefused
            reexport: coreyaml.DirectiveRefused
            type: "*errs.Error"
          - doc: DuplicateKey is the sentinel of [CodeDuplicateKey].
            name: DuplicateKey
            reexport: coreyaml.DuplicateKey
            type: "*errs.Error"
          - doc: LeadingZeroRefused is the sentinel of [CodeLeadingZeroRefused].
            name: LeadingZeroRefused
            reexport: coreyaml.LeadingZeroRefused
            type: "*errs.Error"
    imports:
      coreyaml: github.com/kitsunium/sdk/internal/core/data/codec/yaml
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/yaml
