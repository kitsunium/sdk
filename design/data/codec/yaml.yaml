apiVersion: kit.kitsunium/design/v2
domain: data/codec/yaml
packages:
  - codes:
      - const:
          - doc: |-
              CodeYAMLMarshalFailed identifies a value the encoder cannot write as YAML:
              an unsupported Go kind, a string that is not UTF-8, a key that is not a
              scalar, nesting past the bound, a MarshalYAML hook that failed, or a stream
              whose writer failed.
            name: CodeYAMLMarshalFailed
            note: "range: 0.3.4.0 - 0.3.4.255"
            value: "0x00_03_04_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLUnmarshalFailed identifies a document the decoder cannot read: a
              syntax error, input past a bound, or a value its Go target cannot hold.
              Every refusal below carries it in its trail, so errs.HasCode answers for
              all of them.
            name: CodeYAMLUnmarshalFailed
            value: "0x00_03_04_02"
        type: errs.Code
      - const:
          - doc: "CodeYAMLAnchorRefused identifies an anchor (&name): outside the subset."
            name: CodeYAMLAnchorRefused
            value: "0x00_03_04_03"
        type: errs.Code
      - const:
          - doc: "CodeYAMLAliasRefused identifies an alias (*name): outside the subset."
            name: CodeYAMLAliasRefused
            value: "0x00_03_04_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLTagRefused identifies an explicit tag (!local, !!str, !<uri>):
              outside the subset.
            name: CodeYAMLTagRefused
            value: "0x00_03_04_05"
        type: errs.Code
      - const:
          - doc: "CodeYAMLMergeKeyRefused identifies a merge key (<<): outside the subset."
            name: CodeYAMLMergeKeyRefused
            value: "0x00_03_04_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLMultiDocRefused identifies a second document where one was
              expected.
            name: CodeYAMLMultiDocRefused
            value: "0x00_03_04_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLComplexKeyRefused identifies a complex mapping key (the ? indicator,
              or a collection used as a key): outside the subset.
            name: CodeYAMLComplexKeyRefused
            value: "0x00_03_04_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLDirectiveRefused identifies a directive (%YAML, %TAG): outside the
              subset.
            name: CodeYAMLDirectiveRefused
            value: "0x00_03_04_09"
        type: errs.Code
      - const:
          - doc: CodeYAMLDuplicateKey identifies a mapping that holds the same key twice.
            name: CodeYAMLDuplicateKey
            value: "0x00_03_04_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLLeadingZeroRefused identifies an integer written with a leading zero
              read into a target whose value depends on it: YAML 1.1 reads 0644 as octal
              420, YAML 1.2 as decimal 644.
            name: CodeYAMLLeadingZeroRefused
            value: "0x00_03_04_0B"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/yaml
    sentinels:
      - var:
          - code: CodeYAMLMarshalFailed
            doc: MarshalFailed marks a value the encoder cannot write as YAML.
            name: MarshalFailed
            private: "service/data/codec/yaml: the value cannot be written in the supported YAML subset"
            public: YAML encoding failed
            reason: MARSHAL_FAILED
          - code: CodeYAMLUnmarshalFailed
            doc: UnmarshalFailed marks a document the decoder cannot read into its target.
            name: UnmarshalFailed
            private: "service/data/codec/yaml: not YAML of the supported subset, past a bound, or a value its target cannot hold"
            public: YAML decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeYAMLAnchorRefused
            doc: AnchorRefused marks an anchor, refused by name.
            name: AnchorRefused
            private: "service/data/codec/yaml: an anchor names a node for an alias to repeat; the subset has neither"
            public: YAML anchors (&) are outside the supported subset
            reason: ANCHOR_REFUSED
          - code: CodeYAMLAliasRefused
            doc: AliasRefused marks an alias, refused by name.
            name: AliasRefused
            private: "service/data/codec/yaml: an alias repeats an anchored node; refused, so no document expands past its size"
            public: YAML aliases (*) are outside the supported subset
            reason: ALIAS_REFUSED
          - code: CodeYAMLTagRefused
            doc: TagRefused marks an explicit tag, refused by name.
            name: TagRefused
            private: "service/data/codec/yaml: a tag overrides the core schema; the subset resolves every scalar by the core schema alone"
            public: YAML tags (! and !!) are outside the supported subset
            reason: TAG_REFUSED
          - code: CodeYAMLMergeKeyRefused
            doc: MergeKeyRefused marks a merge key, refused by name.
            name: MergeKeyRefused
            private: "service/data/codec/yaml: a merge key is a YAML 1.1 type that copies another mapping; quote it to mean the text <<"
            public: YAML merge keys (<<) are outside the supported subset
            reason: MERGE_KEY_REFUSED
          - code: CodeYAMLMultiDocRefused
            doc: MultipleDocumentsRefused marks a second document in a single-document read.
            name: MultipleDocumentsRefused
            private: "service/data/codec/yaml: Unmarshal reads exactly one document; a stream of documents is read with NewDecoder"
            public: YAML input holds more than one document
            reason: MULTIPLE_DOCUMENTS_REFUSED
          - code: CodeYAMLComplexKeyRefused
            doc: ComplexKeyRefused marks a complex mapping key, refused by name.
            name: ComplexKeyRefused
            private: "service/data/codec/yaml: a mapping key must be a scalar on one line; ? and collection keys are refused"
            public: YAML complex keys (?) are outside the supported subset
            reason: COMPLEX_KEY_REFUSED
          - code: CodeYAMLDirectiveRefused
            doc: DirectiveRefused marks a directive, refused by name.
            name: DirectiveRefused
            private: "service/data/codec/yaml: the subset is YAML 1.2.2 with no tag handle, so a directive has nothing to declare"
            public: YAML directives (%YAML, %TAG) are outside the supported subset
            reason: DIRECTIVE_REFUSED
          - code: CodeYAMLDuplicateKey
            doc: DuplicateKey marks a mapping that holds the same key twice.
            name: DuplicateKey
            private: "service/data/codec/yaml: two keys of one mapping read the same; neither is chosen over the other"
            public: YAML mapping holds the same key twice
            reason: DUPLICATE_KEY
          - code: CodeYAMLLeadingZeroRefused
            doc: |-
              LeadingZeroRefused marks an integer whose leading zero changes its value
              between YAML versions.
            name: LeadingZeroRefused
            private: "service/data/codec/yaml: write 0o644 for octal, 644 for decimal, or quote the text"
            public: YAML integer with a leading zero is octal in YAML 1.1 and decimal in 1.2
            reason: LEADING_ZERO_REFUSED
  - functions:
      - name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/yaml
    variables:
      - name: Codec
        type: codec.Codec
  - constants:
      - name: Format
        value: "\"yaml\""
    facade:
      - const:
          - doc: CodeMarshalFailed identifies a value the encoder cannot write (0.3.4.1).
            name: CodeMarshalFailed
            reexport: coreyaml.CodeYAMLMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_04_01"
          - doc: |-
              CodeUnmarshalFailed identifies a document the decoder cannot read into
              its target (0.3.4.2); every refusal below carries it in its trail.
            name: CodeUnmarshalFailed
            reexport: coreyaml.CodeYAMLUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_04_02"
          - doc: CodeAnchorRefused identifies an anchor (0.3.4.3).
            name: CodeAnchorRefused
            reexport: coreyaml.CodeYAMLAnchorRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_03"
          - doc: CodeAliasRefused identifies an alias (0.3.4.4).
            name: CodeAliasRefused
            reexport: coreyaml.CodeYAMLAliasRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_04"
          - doc: CodeTagRefused identifies an explicit tag (0.3.4.5).
            name: CodeTagRefused
            reexport: coreyaml.CodeYAMLTagRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_05"
          - doc: CodeMergeKeyRefused identifies a merge key (0.3.4.6).
            name: CodeMergeKeyRefused
            reexport: coreyaml.CodeYAMLMergeKeyRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_06"
          - doc: CodeMultiDocRefused identifies a second document (0.3.4.7).
            name: CodeMultiDocRefused
            reexport: coreyaml.CodeYAMLMultiDocRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_07"
          - doc: CodeComplexKeyRefused identifies a complex mapping key (0.3.4.8).
            name: CodeComplexKeyRefused
            reexport: coreyaml.CodeYAMLComplexKeyRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_08"
          - doc: CodeDirectiveRefused identifies a directive (0.3.4.9).
            name: CodeDirectiveRefused
            reexport: coreyaml.CodeYAMLDirectiveRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_09"
          - doc: CodeDuplicateKey identifies a mapping holding one key twice (0.3.4.10).
            name: CodeDuplicateKey
            reexport: coreyaml.CodeYAMLDuplicateKey
            type: errs.Code
            typed: true
            value: "0x00_03_04_0A"
          - doc: |-
              CodeLeadingZeroRefused identifies an integer with a leading zero where
              its value matters (0.3.4.11).
            name: CodeLeadingZeroRefused
            reexport: coreyaml.CodeYAMLLeadingZeroRefused
            type: errs.Code
            typed: true
            value: "0x00_03_04_0B"
        doc: The error codes, range 0.3.4.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: coreyaml.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: coreyaml.UnmarshalFailed
            type: "*errs.Error"
          - doc: AnchorRefused is the sentinel of [CodeAnchorRefused].
            name: AnchorRefused
            reexport: coreyaml.AnchorRefused
            type: "*errs.Error"
          - doc: AliasRefused is the sentinel of [CodeAliasRefused].
            name: AliasRefused
            reexport: coreyaml.AliasRefused
            type: "*errs.Error"
          - doc: TagRefused is the sentinel of [CodeTagRefused].
            name: TagRefused
            reexport: coreyaml.TagRefused
            type: "*errs.Error"
          - doc: MergeKeyRefused is the sentinel of [CodeMergeKeyRefused].
            name: MergeKeyRefused
            reexport: coreyaml.MergeKeyRefused
            type: "*errs.Error"
          - doc: MultipleDocumentsRefused is the sentinel of [CodeMultiDocRefused].
            name: MultipleDocumentsRefused
            reexport: coreyaml.MultipleDocumentsRefused
            type: "*errs.Error"
          - doc: ComplexKeyRefused is the sentinel of [CodeComplexKeyRefused].
            name: ComplexKeyRefused
            reexport: coreyaml.ComplexKeyRefused
            type: "*errs.Error"
          - doc: DirectiveRefused is the sentinel of [CodeDirectiveRefused].
            name: DirectiveRefused
            reexport: coreyaml.DirectiveRefused
            type: "*errs.Error"
          - doc: DuplicateKey is the sentinel of [CodeDuplicateKey].
            name: DuplicateKey
            reexport: coreyaml.DuplicateKey
            type: "*errs.Error"
          - doc: LeadingZeroRefused is the sentinel of [CodeLeadingZeroRefused].
            name: LeadingZeroRefused
            reexport: coreyaml.LeadingZeroRefused
            type: "*errs.Error"
    imports:
      coreyaml: github.com/kitsunium/sdk/internal/core/data/codec/yaml
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/yaml
