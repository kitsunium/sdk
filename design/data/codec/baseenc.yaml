    doc: |-
      Package baseenc registers the base-N codec with the SDK's codec registry —
      and no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/baseenc"

      It registers nine Formats, one per alphabet, all through one pipeline: a
      value is encoded as JSON and the JSON text as base-N, and decoding runs the
      two steps backwards — so every alphabet carries any Go value encoding/json
      can, and swapping one alphabet for another is a change of Format name.
      Every Format streams.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.24.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.24.1  the value has no JSON encoding
      	CodeUnmarshalFailed  0.3.24.2  the decoded text is not JSON the target can hold
      	CodeDecodeFailed     0.3.24.3  the input is not text of the Format's alphabet
      	CodeSizeExceeded     0.3.24.4  an input past its bound — 10 MiB, 4 KiB for base58 and base62

      No error message quotes the input.
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.24.1: the value has no JSON encoding."
            name: CodeMarshalFailed
            reexport: corebaseenc.CodeBaseEncMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.24.2: the decoded text is not JSON the target
              can hold.
            name: CodeUnmarshalFailed
            reexport: corebaseenc.CodeBaseEncUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_02"
          - doc: |-
              CodeDecodeFailed is 0.3.24.3: the input is not text of the Format's
              alphabet.
            name: CodeDecodeFailed
            reexport: corebaseenc.CodeBaseEncDecodeFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_03"
          - doc: |-
              CodeSizeExceeded is 0.3.24.4: an input past its bound — 10 MiB, 4 KiB
              for base58 and base62.
            name: CodeSizeExceeded
            reexport: corebaseenc.CodeBaseEncSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_18_04"
        doc: The error codes, range 0.3.24.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corebaseenc.BaseEncMarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corebaseenc.BaseEncUnmarshalFailed
            type: "*errs.Error"
          - doc: DecodeFailed is the sentinel of [CodeDecodeFailed].
            name: DecodeFailed
            reexport: corebaseenc.BaseEncDecodeFailed
            type: "*errs.Error"
          - doc: SizeExceeded is the sentinel of [CodeSizeExceeded].
            name: SizeExceeded
            reexport: corebaseenc.BaseEncSizeExceeded
            type: "*errs.Error"
    imports:
