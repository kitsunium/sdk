apiVersion: kit.kitsunium/design/v2
domain: data/codec/baseenc
packages:
  - codes:
      - const:
          - doc: |-
              CodeBaseEncMarshalFailed identifies a JSON-encode failure that happens
              before the base-N step in the universal "flatten to JSON, then base-N"
              pipeline.
            name: CodeBaseEncMarshalFailed
            note: "range: 0.3.24.0 - 0.3.24.255"
            value: "0x00_03_18_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncUnmarshalFailed identifies a JSON-decode failure that happens
              after the base-N step in the universal "base-N decode, then JSON" pipeline.
            name: CodeBaseEncUnmarshalFailed
            value: "0x00_03_18_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncDecodeFailed identifies a base-N decode failure (malformed
              input rejected by the stdlib encoding/{hex,base32,base64,ascii85}
              decoders).
            name: CodeBaseEncDecodeFailed
            value: "0x00_03_18_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncSizeExceeded identifies an Unmarshal input whose length
              exceeds the 10 MiB hard cap (CWE-400 memory-exhaustion defence).
            name: CodeBaseEncSizeExceeded
            value: "0x00_03_18_04"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/baseenc
    sentinels:
      - var:
          - code: CodeBaseEncMarshalFailed
            doc: BaseEncMarshalFailed wraps a JSON-side failure before base-N encoding.
            name: BaseEncMarshalFailed
            private: "service/data/codec/baseenc: encoding/json.Marshal returned an error before the base-N step"
            public: base-N encoding failed
            reason: BASE_ENC_MARSHAL_FAILED
          - code: CodeBaseEncUnmarshalFailed
            doc: BaseEncUnmarshalFailed wraps a JSON-side failure after base-N decoding.
            name: BaseEncUnmarshalFailed
            private: "service/data/codec/baseenc: encoding/json.Unmarshal returned an error after the base-N step"
            public: base-N decoding failed
            reason: BASE_ENC_UNMARSHAL_FAILED
          - code: CodeBaseEncDecodeFailed
            doc: |-
              BaseEncDecodeFailed wraps a malformed base-N input rejected by the
              stdlib decoder.
            name: BaseEncDecodeFailed
            private: "service/data/codec/baseenc: stdlib base-N decoder rejected the input bytes"
            public: base-N decoding failed
            reason: BASE_ENC_DECODE_FAILED
          - code: CodeBaseEncSizeExceeded
            doc: BaseEncSizeExceeded fires when an Unmarshal input exceeds the 10 MiB cap.
            name: BaseEncSizeExceeded
            private: "service/data/codec/baseenc: len(data) exceeds maxBaseEncBytes (CWE-400 defence)"
            public: base-N input exceeds size limit
            reason: BASE_ENC_SIZE_EXCEEDED
  - imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/baseenc
    variables:
      - name: Base64
        type: codec.Codec
      - name: Base64URL
        type: codec.Codec
      - name: Base32
        type: codec.Codec
      - name: Base16
        type: codec.Codec
      - name: Hex
        type: codec.Codec
      - name: ASCII85
        type: codec.Codec
      - name: Base45
        type: codec.Codec
      - name: Base58
        type: codec.Codec
      - name: Base62
        type: codec.Codec
  - constants:
      - name: Base64
        value: "\"base64\""
      - name: Base64URL
        value: "\"base64url\""
      - name: Base32
        value: "\"base32\""
      - name: Base16
        value: "\"base16\""
      - name: Hex
        value: "\"hex\""
      - name: ASCII85
        value: "\"ascii85\""
      - name: Base45
        value: "\"base45\""
      - name: Base58
        value: "\"base58\""
      - name: Base62
        value: "\"base62\""
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.24.1: the value has no JSON encoding."
            name: CodeMarshalFailed
            reexport: corebaseenc.CodeBaseEncMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.24.2: the decoded text is not JSON the target
              can hold.
            name: CodeUnmarshalFailed
            reexport: corebaseenc.CodeBaseEncUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_02"
          - doc: |-
              CodeDecodeFailed is 0.3.24.3: the input is not text of the Format's
              alphabet.
            name: CodeDecodeFailed
            reexport: corebaseenc.CodeBaseEncDecodeFailed
            type: errs.Code
            typed: true
            value: "0x00_03_18_03"
          - doc: |-
              CodeSizeExceeded is 0.3.24.4: an input past its bound — 10 MiB, 4 KiB
              for base58 and base62.
            name: CodeSizeExceeded
            reexport: corebaseenc.CodeBaseEncSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_18_04"
        doc: The error codes, range 0.3.24.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corebaseenc.BaseEncMarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corebaseenc.BaseEncUnmarshalFailed
            type: "*errs.Error"
          - doc: DecodeFailed is the sentinel of [CodeDecodeFailed].
            name: DecodeFailed
            reexport: corebaseenc.BaseEncDecodeFailed
            type: "*errs.Error"
          - doc: SizeExceeded is the sentinel of [CodeSizeExceeded].
            name: SizeExceeded
            reexport: corebaseenc.BaseEncSizeExceeded
            type: "*errs.Error"
    imports:
      corebaseenc: github.com/kitsunium/sdk/internal/core/data/codec/baseenc
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/baseenc
