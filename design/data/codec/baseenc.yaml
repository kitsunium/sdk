apiVersion: kit.kitsunium/design/v2
domain: data/codec/baseenc
packages:
  - codes:
      - const:
          - doc: |-
              CodeBaseEncMarshalFailed identifies a JSON-encode failure that happens
              before the base-N step in the universal "flatten to JSON, then base-N"
              pipeline.
            name: CodeBaseEncMarshalFailed
            note: "range: 0.3.24.0 - 0.3.24.255"
            value: "0x00_03_18_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncUnmarshalFailed identifies a JSON-decode failure that happens
              after the base-N step in the universal "base-N decode, then JSON" pipeline.
            name: CodeBaseEncUnmarshalFailed
            value: "0x00_03_18_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncDecodeFailed identifies a base-N decode failure (malformed
              input rejected by the stdlib encoding/{hex,base32,base64,ascii85}
              decoders).
            name: CodeBaseEncDecodeFailed
            value: "0x00_03_18_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeBaseEncSizeExceeded identifies an Unmarshal input whose length
              exceeds the 10 MiB hard cap (CWE-400 memory-exhaustion defence).
            name: CodeBaseEncSizeExceeded
            value: "0x00_03_18_04"
        type: errs.Code
    doc: |-
      Package baseenc declares the error codes and the sentinels of the base-N
      codec family (base64, base64url, base32, base16, hex, ascii85, base45,
      base58, base62), internal/service/data/codec/baseenc — range 0.3.24.* (ADR
      0006 service/data/codec/baseenc block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package baseenc — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/baseenc
    sentinels:
      - var:
          - code: CodeBaseEncMarshalFailed
            doc: BaseEncMarshalFailed wraps a JSON-side failure before base-N encoding.
            name: BaseEncMarshalFailed
            private: "service/data/codec/baseenc: encoding/json.Marshal returned an error before the base-N step"
            public: base-N encoding failed
            reason: BASE_ENC_MARSHAL_FAILED
          - code: CodeBaseEncUnmarshalFailed
            doc: BaseEncUnmarshalFailed wraps a JSON-side failure after base-N decoding.
            name: BaseEncUnmarshalFailed
            private: "service/data/codec/baseenc: encoding/json.Unmarshal returned an error after the base-N step"
            public: base-N decoding failed
            reason: BASE_ENC_UNMARSHAL_FAILED
          - code: CodeBaseEncDecodeFailed
            doc: |-
              BaseEncDecodeFailed wraps a malformed base-N input rejected by the
              stdlib decoder.
            name: BaseEncDecodeFailed
            private: "service/data/codec/baseenc: stdlib base-N decoder rejected the input bytes"
            public: base-N decoding failed
            reason: BASE_ENC_DECODE_FAILED
          - code: CodeBaseEncSizeExceeded
            doc: BaseEncSizeExceeded fires when an Unmarshal input exceeds the 10 MiB cap.
            name: BaseEncSizeExceeded
            private: "service/data/codec/baseenc: len(data) exceeds maxBaseEncBytes (CWE-400 defence)"
            public: base-N input exceeds size limit
            reason: BASE_ENC_SIZE_EXCEEDED
  - doc: |-
      Package baseenc — Base45 (RFC 9285) alphabet codec. Unlike base16/32/64
      and ascii85, the stdlib ships no base45 encoder, so the encode/decode
      transforms live here. Base45 is a block encoding (base45PairBytes input
      bytes → base45GroupChars output chars; a trailing byte → base45TailChars
      chars), hence O(n) — safe to share the 10 MiB maxBaseEncBytes cap with
      the stdlib-backed variants.

      Package baseenc — Base58 (Bitcoin alphabet) base-conversion codec.

      Package baseenc — Base62 (0-9A-Za-z) base-conversion codec.

      Package baseenc — big-endian base-conversion arithmetic shared by the
      Base58 and Base62 variants. Unlike the block encodings, these treat the
      whole input as one integer and divide it down by the radix, so the
      transforms are O(n²) — callers MUST cap input at maxConvBytes first.

      Package baseenc — buffered writer used by variants whose stdlib has no
      streaming encoder (base16 uppercase). Held in its own file so the
      KTN-STRUCT-ONEFILE rule sees exactly one exported-shape struct per file.

      Package baseenc implements a family of codec.Codec wrappers around the
      stdlib byte encodings (base16 / base32 / base64 / ascii85). Each variant
      registers itself with the core/data/codec registry under a distinct Name —
      the variant discriminator is the registered Format, not a tagged enum.

      Universal Marshal flow: encode v with encoding/json, then base-N encode
      the resulting bytes. Unmarshal reverses the pipeline. The JSON layer is
      intentional — base-N alphabets are structureless, so flattening through
      JSON gives consumers a single Marshal/Unmarshal contract over any value.

      Blank-importing this package registers all six variants at process start
      via package-level var initialisers; no init() function involved.

      Package baseenc — buffered decode reader for variants whose stdlib has
      no streaming decoder (Base45). Held in its own file so KTN-STRUCT-ONEFILE
      sees exactly one struct per file.

      Package baseenc — adapts the base-N stream-reader pipeline to
      codec.Decoder. Each Decode call drives a stdlib json.Decoder over the
      base-N decoded byte stream wrapped around the caller's io.Reader.

      Package baseenc — adapts the base-N stream-writer pipeline to
      codec.Encoder. Each Encode call serialises one JSON value into the
      underlying base-N WriteCloser, which writes the encoded bytes onto the
      caller's io.Writer.

      Package baseenc — IO adapters used by the streaming pipeline.

      Package baseenc — per-variant identity table.
