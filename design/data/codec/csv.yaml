apiVersion: kit.kitsunium/design/v2
domain: data/codec/csv
packages:
  - codes:
      - const:
          - doc: CodeCSVMarshalFailed identifies a failure inside encoding/csv.Writer.
            name: CodeCSVMarshalFailed
            note: "range: 0.3.8.0 - 0.3.8.255"
            value: "0x00_03_08_01"
        type: errs.Code
      - const:
          - doc: CodeCSVUnmarshalFailed identifies a failure inside encoding/csv.Reader.
            name: CodeCSVUnmarshalFailed
            value: "0x00_03_08_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCSVValueInvalid identifies a Marshal / Unmarshal call whose target is
              not a *[][]string (CSV only serialises a records matrix).
            name: CodeCSVValueInvalid
            value: "0x00_03_08_03"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/csv
    sentinels:
      - var:
          - code: CodeCSVMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/csv.Writer.Write(All).
            name: MarshalFailed
            private: "service/data/codec/csv: encoding/csv.Writer.WriteAll returned an error"
            public: CSV encoding failed
            reason: MARSHAL_FAILED
          - code: CodeCSVUnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/csv.Reader.ReadAll.
            name: UnmarshalFailed
            private: "service/data/codec/csv: encoding/csv.Reader.ReadAll returned an error"
            public: CSV decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeCSVValueInvalid
            doc: ValueInvalid fires when the caller does not pass a *[][]string.
            name: ValueInvalid
            private: "service/data/codec/csv: Marshal/Unmarshal called with non-[][]string argument"
            public: CSV codec requires a [][]string value
            reason: VALUE_INVALID
  - functions:
      - name: New
        out:
          - type: codec.Codec
      - in:
          - name: escape
            type: bool
        name: NewWithEscape
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/csv
    variables:
      - name: Codec
        type: codec.Codec
  - constants:
      - name: Format
        value: "\"csv\""
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.8.1: encoding/csv refused to write the records."
            name: CodeMarshalFailed
            reexport: corecsv.CodeCSVMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_08_01"
          - doc: "CodeUnmarshalFailed is 0.3.8.2: the input is not CSV encoding/csv reads."
            name: CodeUnmarshalFailed
            reexport: corecsv.CodeCSVUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_08_02"
          - doc: |-
              CodeValueInvalid is 0.3.8.3: the value or the target is not a
              [][]string.
            name: CodeValueInvalid
            reexport: corecsv.CodeCSVValueInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_08_03"
        doc: The error codes, range 0.3.8.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corecsv.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corecsv.UnmarshalFailed
            type: "*errs.Error"
          - doc: ValueInvalid is the sentinel of [CodeValueInvalid].
            name: ValueInvalid
            reexport: corecsv.ValueInvalid
            type: "*errs.Error"
    imports:
      corecsv: github.com/kitsunium/sdk/internal/core/data/codec/csv
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/csv
