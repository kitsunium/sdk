apiVersion: kit.kitsunium/design/v2
domain: data/codec/cbor
packages:
  - codes:
      - const:
          - doc: |-
              CodeCBORMarshalFailed identifies an encoding failure: a value of a type
              CBOR cannot carry, a string that is not UTF-8, a nesting deeper than the
              decoder accepts, a failing writer, MarshalBinary or MarshalCBOR.
            name: CodeCBORMarshalFailed
            note: "range: 0.3.6.0 - 0.3.6.255"
            value: "0x00_03_06_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORUnmarshalFailed identifies a decoding failure: input that is not
              one well-formed, valid data item, a bound exceeded, or an item the target
              cannot hold.
            name: CodeCBORUnmarshalFailed
            value: "0x00_03_06_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORDuplicateKey identifies a document NewStrict's instance refused
              because one of its maps repeats a key.
            name: CodeCBORDuplicateKey
            value: "0x00_03_06_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORUnknownMember identifies a document NewStrict's instance refused
              because it carries a member no field of the target struct claims.
            name: CodeCBORUnknownMember
            value: "0x00_03_06_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORNotDeterministic identifies a document NewDeterministic's
              instance refused because it is not in the core deterministic encoding
              of RFC 8949 §4.2.1: a head or a float longer than it needs, an
              indefinite length, a NaN other than 0xf97e00, or map keys out of the
              bytewise order of their encodings.
            name: CodeCBORNotDeterministic
            value: "0x00_03_06_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORSizeExceeded identifies input refused for a size bound: an array, map or chunked string past its 1 048 576-entry bound,
              or a data item longer than NewBoundedDecoder's byte ceiling (#891).
              Its reason is the family's SIZE_EXCEEDED (#894).
            name: CodeCBORSizeExceeded
            value: "0x00_03_06_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeCBORDepthExceeded identifies input refused for a depth bound: arrays, maps and tags nested past 32 levels.
              Its reason is the family's DEPTH_EXCEEDED (#894).
            name: CodeCBORDepthExceeded
            value: "0x00_03_06_07"
        type: errs.Code
    doc: |-
      Package cbor declares the error codes and the sentinels of the CBOR codec,
      internal/service/data/codec/cbor — range 0.3.6.* (ADR 0005
      service/data/codec/cbor block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package cbor — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/cbor
    sentinels:
      - doc: Sentinels, matched with errors.Is or errs.HasCode / errs.HasReason.
        var:
          - code: CodeCBORMarshalFailed
            doc: |-
              MarshalFailed is the sentinel every encoding failure matches: a value
              CBOR cannot carry, a string that is not UTF-8, a nesting deeper than
              the decoder accepts, a failing writer, MarshalBinary or MarshalCBOR.
            name: MarshalFailed
            private: "service/data/codec/cbor: a value could not be encoded as CBOR"
            public: CBOR encoding failed
            reason: MARSHAL_FAILED
          - code: CodeCBORUnmarshalFailed
            doc: |-
              UnmarshalFailed is the sentinel every decoding failure matches: input
              that is not one well-formed, valid data item, a bound exceeded, or an
              item the target cannot hold.
            name: UnmarshalFailed
            private: "service/data/codec/cbor: the input could not be decoded as CBOR"
            public: CBOR decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodeCBORDuplicateKey
            doc: DuplicateKey is the strict refusal of a map that repeats a key.
            name: DuplicateKey
            private: "service/data/codec/cbor: NewStrict refused a map holding two equal keys"
            public: CBOR document repeats a map key
            reason: DUPLICATE_KEY
          - code: CodeCBORUnknownMember
            doc: UnknownMember is the strict refusal of a member no struct field claims.
            name: UnknownMember
            private: "service/data/codec/cbor: NewStrict refused a member no field of the struct claims"
            public: CBOR document carries an unknown member
            reason: UNKNOWN_MEMBER
          - code: CodeCBORNotDeterministic
            doc: |-
              NotDeterministic is the refusal of a document NewDeterministic's
              instance does not read: one not in RFC 8949 §4.2.1's core
              deterministic encoding.
            name: NotDeterministic
            private: "service/data/codec/cbor: NewDeterministic refused a document not in core deterministic encoding"
            public: CBOR document is not in deterministic encoding
            reason: NOT_DETERMINISTIC
          - code: CodeCBORSizeExceeded
            doc: |-
              SizeExceeded is the refusal of input past a size bound: an array, map or
              chunked string past its 1 048 576-entry bound, or an item past
              NewBoundedDecoder's ceiling.
            name: SizeExceeded
            private: "service/data/codec/cbor: the input exceeds a size bound"
            public: CBOR input exceeds a size limit
            reason: SIZE_EXCEEDED
          - code: CodeCBORDepthExceeded
            doc: "DepthExceeded is the refusal of input past a depth bound: arrays, maps and tags nested past 32 levels."
            name: DepthExceeded
            private: "service/data/codec/cbor: the input exceeds a depth bound"
            public: CBOR input nests too deeply
            reason: DEPTH_EXCEEDED
  - doc: |-
      Package cbor is the SDK's CBOR codec (RFC 8949), written on the standard
      library alone. It encodes any Go value the reflection rules below can
      read, decodes into any Go value they can fill, and streams one data item
      per Encode or Decode.

      # What is written

      Integers, lengths and tag numbers take their shortest head; a float64 is a
      double and a float32 a single, NaN is written 0xf97e00 and the infinities
      as half-precision floats; a string is a text string, a []byte or [N]byte a
      byte string; a nil slice, map, pointer or interface is null; a struct is a
      map keyed by field (or an array with toarray); a time.Time is its integer
      Unix seconds, null when zero; a big.Int an integer or a bignum (tag 2 or 3).
      Map pairs are sorted by encoded key (RFC 8949 §4.2.1), so equal values
      encode to equal bytes. Nothing is written that the decoder would refuse:
      not a string that is not UTF-8, not a map with two keys that encode alike,
      nothing nested deeper than 32 arrays, maps and tags.

      # What is read

      Exactly one well-formed, valid data item — definite and indefinite
      lengths, half, single and double floats, every major type — checked in
      full, against the bounds (a million elements per array or pairs per map,
      thirty-two levels, a million chunks per string), before anything is
      decoded: malformed input never touches the target. A text string must be
      UTF-8 wherever it sits; tags 0 to 3 must enclose the type RFC 8949 gives
      them. A tag the codec does not interpret is transparent, except to a Tag,
      which receives its number and its content.

      # Struct tags

      A field's key is the name in its `cbor` tag, or in its `json` tag when it
      has no `cbor` tag, or its Go name; the options are omitempty, omitzero and
      keyasint, and a blank field `_ struct{}` tagged `cbor:",toarray"` encodes
      a struct as an array. Embedded structs follow encoding/json's rules. A
      time.Time field tagged `cbor:",time=tag1"` is written as tag 1: integer
      seconds when it holds no fraction, float seconds when a double carries it
      to the nanosecond, and otherwise as tag 0, its RFC 3339 text to the
      nanosecond, so the instant is never rounded; `cbor:",time=tag0"` always
      writes tag 0. Either reads back the same instant. A type implementing
      encoding.BinaryMarshaler is written as a byte string, and one implementing
      encoding.BinaryUnmarshaler reads one; a type with MarshalCBOR or
      UnmarshalCBOR writes or reads its own item.

      # Tags and determinism

      A Tag writes its number and its content, for an application's own tags —
      COSE (RFC 9052) and CWT (RFC 8392) among them; one numbered 0 to 3 must
      enclose the type RFC 8949 gives the number. NewDeterministic returns a
      fresh instance writing RFC 8949 §4.2.1's core deterministic encoding —
      the registered codec's, every float in the shortest of half, single and
      double that holds it exactly — and reading only that encoding, every tag
      but a bignum decoded into an interface as a Tag, so a document decodes and
      encodes back to its own bytes.

      Package cbor — the decoder's walk over input the validator has accepted.

      Because the item was validated first, every length, count and offset the
      walk reads is already known to fit the input and the bounds, so nothing is
      allocated on the word of an unchecked count. The walk still checks every
      read against the input: an inconsistency is an error, never a panic.

      An item the target cannot hold — a string for an int, an integer that
      overflows its field — does not stop the walk: the first such failure is
      kept, the item is skipped, and the rest is decoded, as fxamacker/cbor and
      encoding/json both do.

      Package cbor — decoding into an untyped target. Each data item becomes its
      default Go value, built without reflection:

      	unsigned integer          uint64
      	negative integer          int64, or big.Int below math.MinInt64
      	byte string               []byte
      	text string               string
      	array                     []any
      	map, every key text       map[string]any
      	map, any other key        map[any]any
      	true, false               bool
      	null, undefined           nil
      	half, single, double      float64
      	tag 0 or 1                time.Time
      	tag 2 or 3 (bignum)       big.Int
      	any other tag             its content, as though untagged

      NewDeterministic's instance keeps every tag but a bignum: a Tag holding
      its number and its content, decoded by the same rules.

      An unassigned simple value has no Go value and is refused, as RFC 8949
      §5.4 allows a decoder to; so is a map key Go cannot hash — a byte string,
      an array, a map or a bignum — since it cannot be a key of a map[any]any.

      Package cbor — decoding into byte slices and arrays, slices, arrays and
      maps. A slice is resized to the array it receives and the elements it
      reuses are zeroed first, so nothing of its previous content survives; an
      array keeps its length, dropping extra elements and zeroing missing ones;
      a map keeps its entries and gains the decoded ones.

      Package cbor — decode plans: how a data item is stored into a value of one
      Go type, resolved once per type and cached, the mirror of encode plans.

      Package cbor — decoding into scalar targets: booleans, integers of every
      width, floats, strings, time.Time and big.Int. An integer is stored where
      it fits and refused where it would overflow; a bignum (tag 2 or 3) counts
      as an integer; a float is never stored into an integer.

      Package cbor — decoding into structs. A map's text keys find their field
      exactly, then ignoring case; its integer keys find a keyasint field; a key
      no field has is skipped with its value, and a key seen twice keeps its
      first value — fxamacker/cbor's rules. A toarray struct takes an array of
      exactly as many elements as it has fields.

      Package cbor — the streaming decoder: one data item per Decode, read from
      the stream as it arrives. The validator keeps its place across reads, so
      each byte is validated once however the item is split, and an item is only
      decoded once it has arrived whole and passed. The decoder buffers one item
      at a time; bound the reader (io.LimitReader) when its peer is untrusted.

      Package cbor — the encoder's entry point and its scalars. Encoding appends
      to a byte slice and never builds an intermediate value: the common
      dynamic types an untyped document holds are matched by a type switch, and
      every other type goes through the plan resolved once for it.

      What the encoder writes is fixed: integers, lengths and tag numbers in
      their shortest head; a float64 as a double, a float32 as a single, NaN as
      0xf97e00 and the infinities as half-precision; a time.Time as its integer
      Unix seconds (null when zero); a nil slice, map or pointer as null; map
      pairs in the bytewise order of their encoded keys (RFC 8949 §4.2.1), so
      equal values encode to equal bytes. It writes nothing its own decoder would
      refuse: no string that is not UTF-8, no two equal keys in a map, nothing
      nested deeper than maxCBORNestedLevels.

      Package cbor — the kind encoders of pointers, interfaces, byte strings,
      arrays and the types CBOR cannot carry.

      Package cbor — maps on the encoding side. Pairs are written in the bytewise
      lexicographic order of their encoded keys, the order RFC 8949 §4.2.1 gives
      deterministic encoding, so a map encodes to the same bytes on every run;
      two keys that encode alike — 1 and uint(1) in a map[any]any, two NaNs —
      are refused rather than written as an invalid map.

      Package cbor — encode plans: how the values of one Go type are encoded,
      resolved once per type and cached. A plan holds the kind encoder that
      writes a value and answers omitempty, the omitzero question, and the plans
      of the types it is made of — so walking a value is a chain of direct calls
      with no lookup.

      Package cbor — the kind encoders of the scalars: booleans, integers of
      every width, floats and strings, each answering omitempty for its kind.

      Package cbor — the kind encoders of the types with an encoding of their
      own: time.Time as Unix seconds — or as tag 1 or tag 0 under the time
      option —, a Tag as its number and content, a type's MarshalCBOR verbatim
      once checked, and a BinaryMarshaler as a byte string.

      Package cbor — the deterministic instance: RFC 8949 §4.2.1's core
      deterministic encoding written, every float in its shortest exact form,
      and the same encoding required of what is read, checked in one walk over
      the validated item before anything is decoded.

      Package cbor — structs on the encoding side: a map keyed by field name (or
      by integer, keyasint), or an array (toarray); omitempty and omitzero.

      Package cbor — the streaming encoder: one data item per Encode, written in
      one Write once it is completely encoded, so a value that cannot be encoded
      writes nothing.

      Package cbor — the constructors every failure goes through. Each one
      carries one of the two codes internal/core/data/codec/cbor declares for
      this package (ADR 0160) and its reason, and a Private line that says what
      was refused — a type, a bound, an offset — and never a value read from the
      input.

      Package cbor — struct fields: which fields of a struct are on the wire,
      under which key, and in which order. The visibility and embedding rules
      are encoding/json's; the key comes from the `cbor` tag, or from the `json`
      tag when a field has no `cbor` tag — the same resolution fxamacker/cbor
      applied, so a struct keeps its encoding across the change of engine.

      Package cbor — hosts the compile-time interface assertions, keeping them
      out of the production source so the runtime binary carries no
      diagnostic-only declarations.

      Package cbor — the validator: one pass over the bytes, before anything is
      decoded, that accepts exactly one well-formed and valid data item within
      the bounds. A document it refuses never touches the caller's value, and no
      length, count or depth read from the input is acted on until it has passed.

      Package cbor — the RFC 8949 vocabulary: the eight major types, the
      additional information of an initial byte, the head every data item opens
      with, and the IEEE 754 half-precision float a decoder must read.
    functions:
      - doc: New returns a CBOR codec instance.
        name: New
        out:
          - type: codec.Codec
      - doc: |-
          NewStrict returns a fresh CBOR codec, not registered, whose Unmarshal and
          Decode read a document somebody else wrote one way or not at all (ADR
          0102): a map that repeats a key — two keys that decode to the same Go key,
          whatever form each was written in — is refused with DUPLICATE_KEY before
          anything is decoded, and a member no field of the target struct claims
          with UNKNOWN_MEMBER. The registered codec keeps last-wins and skips unknown
          members. Encoding is the registered codec's.
        name: NewStrict
        out:
          - type: codec.Codec
      - doc: |-
          NewDeterministic returns a fresh CBOR codec, not registered, for bytes that
          are signed or hashed: it writes RFC 8949 §4.2.1's core deterministic
          encoding — the registered codec's, every float in the shortest of half,
          single and double that holds it exactly — and its Unmarshal and Decode
          refuse with NOT_DETERMINISTIC a document not in that encoding: a head or a
          float longer than it needs, an indefinite length, a NaN other than
          0xf97e00, or map keys out of the bytewise order of their encodings. Into
          an interface it decodes every tag but a bignum as a Tag, so a document
          decodes and encodes back to its own bytes.
        name: NewDeterministic
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/cbor
    types:
      - doc: |-
          TagValue is a CBOR tag (RFC 8949 §3.4): a number and the data item it encloses,
          for the tags an application defines — COSE's 16 to 18 and 96 to 98, CWT's
          61. Encoding one writes its number then its Content as any value is
          written; a tag numbered 0 to 3 must enclose the type RFC 8949 gives it.
          Decoding into a TagValue takes any tag, its content decoded as into an
          interface; an untagged item does not fit one.
        name: TagValue
        struct:
          fields:
            - doc: Number is the tag number.
              name: Number
              type: uint64
            - doc: Content is the enclosed data item.
              name: Content
              type: any
    variables:
      - blockDoc: |-
          The registered singleton. Its aliases are literals in MIMETypes and
          Extensions, not package tables: Register reads them through the Codec
          interface, which orders no table before this initialiser (see
          core/data/codec.Register).
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name CBOR is registered under. It is an untyped constant, so
          it goes wherever a format name is taken — the codec package's Marshal,
          config.FSSource's string, i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"cbor\""
    doc: |-
      Package cbor registers the CBOR codec with the SDK's codec registry — and no
      other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/cbor"

      The codec is RFC 8949 written on the standard library: maps, arrays, the
      integers and floats, text and byte strings, tags 0 to 3 for times and big
      numbers and any other as a Tag, struct fields by their cbor tag or their
      json tag. Map pairs are written sorted by their encoded key, the
      deterministic encoding of RFC 8949 §4.2.1, so one value always encodes to
      the same bytes; NewDeterministic adds the shortest floats and reads only
      that encoding, for bytes that are signed. A time.Duration is an integer of
      int64 nanoseconds, the rule of every binary format (#1126): no standard tag
      carries a duration. Input is checked whole — well-formed, valid, within its
      bounds — before the target is written. It streams.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.6.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.6.1  a value CBOR cannot carry, invalid UTF-8, nesting past the bound
      	CodeUnmarshalFailed  0.3.6.2  input that is not one well-formed item, or an item the target cannot hold
      	CodeDuplicateKey     0.3.6.3  NewStrict: a map repeats a key
      	CodeUnknownMember    0.3.6.4  NewStrict: a member no struct field claims
      	CodeNotDeterministic 0.3.6.5  NewDeterministic: a document not in core deterministic encoding

      No error message quotes the input.
    facade:
      - const:
          - doc: |-
              CodeMarshalFailed is 0.3.6.1: a value CBOR cannot carry, invalid UTF-8,
              nesting past the bound.
            name: CodeMarshalFailed
            reexport: corecbor.CodeCBORMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_06_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.6.2: input that is not one well-formed item,
              or an item the target cannot hold.
            name: CodeUnmarshalFailed
            reexport: corecbor.CodeCBORUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_06_02"
          - doc: |-
              CodeDuplicateKey is 0.3.6.3: NewStrict's instance found a map that
              repeats a key.
            name: CodeDuplicateKey
            reexport: corecbor.CodeCBORDuplicateKey
            type: errs.Code
            typed: true
            value: "0x00_03_06_03"
          - doc: |-
              CodeUnknownMember is 0.3.6.4: NewStrict's instance found a member
              no struct field claims.
            name: CodeUnknownMember
            reexport: corecbor.CodeCBORUnknownMember
            type: errs.Code
            typed: true
            value: "0x00_03_06_04"
          - doc: |-
              CodeNotDeterministic is 0.3.6.5: NewDeterministic's instance found a
              document not in core deterministic encoding.
            name: CodeNotDeterministic
            reexport: corecbor.CodeCBORNotDeterministic
            type: errs.Code
            typed: true
            value: "0x00_03_06_05"
          - doc: "CodeSizeExceeded is 0.3.6.6: an array, map or chunked string past its 1 048 576-entry bound, or an item past NewBoundedDecoder's ceiling."
            name: CodeSizeExceeded
            reexport: corecbor.CodeCBORSizeExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_06_06"
          - doc: "CodeDepthExceeded is 0.3.6.7: arrays, maps and tags nested past 32 levels."
            name: CodeDepthExceeded
            reexport: corecbor.CodeCBORDepthExceeded
            type: errs.Code
            typed: true
            value: "0x00_03_06_07"
        doc: The error codes, range 0.3.6.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corecbor.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corecbor.UnmarshalFailed
            type: "*errs.Error"
          - doc: DuplicateKey is the sentinel of [CodeDuplicateKey].
            name: DuplicateKey
            reexport: corecbor.DuplicateKey
            type: "*errs.Error"
          - doc: UnknownMember is the sentinel of [CodeUnknownMember].
            name: UnknownMember
            reexport: corecbor.UnknownMember
            type: "*errs.Error"
          - doc: NotDeterministic is the sentinel of [CodeNotDeterministic].
            name: NotDeterministic
            reexport: corecbor.NotDeterministic
            type: "*errs.Error"
          - doc: SizeExceeded is the sentinel of [CodeSizeExceeded].
            name: SizeExceeded
            reexport: corecbor.SizeExceeded
            type: "*errs.Error"
          - doc: DepthExceeded is the sentinel of [CodeDepthExceeded].
            name: DepthExceeded
            reexport: corecbor.DepthExceeded
            type: "*errs.Error"
      - func:
          doc: |-
            NewStrict returns a fresh CBOR codec, not registered, that reads a
            document one way or not at all: a map repeating a key is refused with
            CodeDuplicateKey, a member no struct field claims with CodeUnknownMember.
            The registered format keeps last-wins and skips unknown members.
          forward: svccbor.NewStrict
          name: NewStrict
          out:
            - type: codec.Codec
      - func:
          doc: |-
            NewDeterministic returns a fresh CBOR codec, not registered, for bytes
            that are signed or hashed: it writes RFC 8949's core deterministic
            encoding — every float in its shortest exact form — and refuses with
            CodeNotDeterministic a document not in it. Into an interface it decodes
            every tag but a bignum as a Tag, so a document round-trips to its bytes.
          forward: svccbor.NewDeterministic
          name: NewDeterministic
          out:
            - type: codec.Codec
      - alias:
          - doc: |-
              Tag is a CBOR tag: a number and the item it encloses, for an
              application's own tags — COSE, CWT.
            name: Tag
            target: svccbor.TagValue
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      corecbor: github.com/kitsunium/sdk/internal/core/data/codec/cbor
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svccbor: github.com/kitsunium/sdk/internal/service/data/codec/cbor
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/cbor
