apiVersion: kit.kitsunium/design/v2
domain: data/codec/strictjson
packages:
  - codes:
      - const:
          - doc: |-
              CodeDocumentTooLarge identifies a JSON document longer than the bound the
              caller gave.
            name: CodeDocumentTooLarge
            note: "range: 0.3.72.0 - 0.3.72.255"
            value: "0x00_03_48_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentEmpty identifies a JSON document of zero bytes: no value at all,
              which a caller may read as "no body" rather than as a malformed one.
            name: CodeDocumentEmpty
            value: "0x00_03_48_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentMalformed identifies a document that is not exactly one
              well-formed JSON value: a syntax error, a truncation, trailing data, a
              duplicated member name, or invalid UTF-8.
            name: CodeDocumentMalformed
            value: "0x00_03_48_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeMemberUnknown identifies an object member the target type does not
              declare.
            name: CodeMemberUnknown
            value: "0x00_03_48_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeValueMismatched identifies a well-formed value the target cannot hold:
              the wrong JSON kind, a number out of the field's range, a value a field's
              own unmarshaler refused.
            name: CodeValueMismatched
            value: "0x00_03_48_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeMediaTypeUnsupported identifies a request body whose Content-Type is not
              application/json or a +json structured-syntax type.
            name: CodeMediaTypeUnsupported
            value: "0x00_03_48_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentUnreadable identifies a reader that failed before the document
              ended — a connection reset, a cancelled request.
            name: CodeDocumentUnreadable
            value: "0x00_03_48_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecodeMisconfigured identifies a call the decoder refuses before
              reading anything: a non-positive bound, or a target that is not a non-nil
              pointer.
            name: CodeDecodeMisconfigured
            value: "0x00_03_48_08"
        type: errs.Code
    doc: |-
      Package strictjson declares the error codes and the sentinels of the strict
      JSON decoder (not a codec), internal/service/data/codec/strictjson — range
      0.3.72.* (ADR 0102 service/data/codec/strictjson block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package strictjson — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.

      Every Public and every Private below is a fixed sentence. None of them can
      carry a byte of the document, because the document is what a caller least
      controls and an error message is where input classically leaks back out —
      into a response, into a log someone else reads.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/strictjson
    sentinels:
      - var:
          - code: CodeDocumentTooLarge
            doc: |-
              DocumentTooLarge refuses a document longer than the caller's bound,
              whatever the bytes beyond it would have said.
            name: DocumentTooLarge
            options:
              - errs.WithHTTPStatus(httpContentTooLarge)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: more bytes arrived than the bound allows; the limit field is the bound"
            public: The JSON document is larger than the limit
            reason: DOCUMENT_TOO_LARGE
          - code: CodeDocumentEmpty
            doc: |-
              DocumentEmpty reports a document of zero bytes. It is its own code so a
              caller for whom a body is optional can tell "no body" from "a broken
              one" without reading the input again.
            name: DocumentEmpty
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: the reader ended before the first byte"
            public: The JSON document is empty
            reason: DOCUMENT_EMPTY
          - code: CodeDocumentMalformed
            doc: |-
              DocumentMalformed refuses a document that is not exactly one
              well-formed JSON value.
            name: DocumentMalformed
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: a syntax error, a truncation, trailing data, a duplicate name or invalid UTF-8; the offset field locates it"
            public: The JSON document is not well-formed
            reason: DOCUMENT_MALFORMED
          - code: CodeMemberUnknown
            doc: |-
              MemberUnknown refuses an object member the target does not declare,
              including one that differs from a declared name only by case.
            name: MemberUnknown
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: an object member matches no field of the target; PointerOf locates it"
            public: The JSON document has a member the target does not accept
            reason: MEMBER_UNKNOWN
          - code: CodeValueMismatched
            doc: ValueMismatched refuses a well-formed value the target cannot hold.
            name: ValueMismatched
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: a value does not fit the field it maps to; PointerOf locates it"
            public: The JSON document has a value of the wrong type or out of range
            reason: VALUE_MISMATCHED
          - code: CodeMediaTypeUnsupported
            doc: |-
              MediaTypeUnsupported refuses a request body that does not declare itself
              JSON.
            name: MediaTypeUnsupported
            options:
              - errs.WithHTTPStatus(httpUnsupportedMediaType)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: the Content-Type is absent, unparsable, or names another media type"
            public: The request body must be application/json or a +json media type
            reason: MEDIA_TYPE_UNSUPPORTED
          - code: CodeDocumentUnreadable
            doc: |-
              DocumentUnreadable wraps a reader that failed before the document
              ended. The reader's own error stays in the chain.
            name: DocumentUnreadable
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitIOErr)
            private: "service/data/codec/strictjson: the reader returned an error other than end-of-input"
            public: The JSON document could not be read
            reason: DOCUMENT_UNREADABLE
          - code: CodeDecodeMisconfigured
            doc: |-
              DecodeMisconfigured refuses a call the decoder can never honour: a
              non-positive bound — whose two readings, "unbounded" and "nothing", are
              opposites (ADR 0031) — or a target that is not a non-nil pointer.
            name: DecodeMisconfigured
            options:
              - errs.WithExitCode(exitSoftware)
            private: "service/data/codec/strictjson: the field names the argument: a non-positive bound or a target that is not a non-nil pointer"
            public: The JSON decoder was called with an argument it cannot use
            reason: DECODE_MISCONFIGURED
  - constants:
      - doc: |-
          MaxPointerBytes bounds the JSON Pointer a refusal carries. A pointer is
          built from the document's member names, so its length is the document's
          to choose; past the bound it is cut back to the deepest ancestor that fits,
          which still points at the right place, just less precisely.
        name: MaxPointerBytes
        type: int
        value: "256"
    doc: |-
      Package strictjson — the reader that bounds a document and remembers why
      it stopped.

      Package strictjson decodes exactly one JSON document into a Go value,
      refusing everything the permissive decoder lets through, within a byte
      bound, with errors that never quote the input.

      The universal codec's json format is encoding/json with its defaults: no
      size limit, unknown members silently dropped, a member matched to a field
      case-insensitively, a duplicated name resolved by whichever came last, and
      trailing data after the value ignored. Each of those is a way for one
      document to be read two ways — by this program and by whatever else parsed
      it first — and none of them fails. This package is the other decoder, built
      on encoding/json/v2 whose defaults already refuse most of them:

        - a document longer than the bound is refused before it is buffered past
          the bound;
        - an object member the target does not declare is refused, and so is one
          that differs from a declared name only by case;
        - a duplicated member name, invalid UTF-8, and anything after the one
          value are refused;
        - a number out of the field's range is refused rather than wrapped.

      Every refusal is a typed error whose text is a fixed sentence: the
      document's bytes appear in no Public, no Private and no wrapped cause.
      Where the document failed is available through PointerOf, as a JSON
      Pointer built from the document's own member names — a location, never a
      value.
    functions:
      - doc: |-
          Unreadable is the refusal of a reader that failed before the document
          ended: DocumentUnreadable, the origin, carrying the failure's TYPE as its
          cause field and never its message, which a reader may have built from the
          bytes it read. The HTTP form uses it for a body whose first read failed.
        in:
          - name: failure
            type: error
        name: Unreadable
        out:
          - type: error
      - doc: |-
          Decode reads exactly one JSON value from r into v, which must be a non-nil
          pointer, reading at most maxBytes bytes of it.

          It refuses — with DocumentTooLarge, DocumentEmpty, DocumentMalformed,
          MemberUnknown, ValueMismatched or DocumentUnreadable — every document the
          package comment lists, and DecodeMisconfigured when maxBytes is not
          positive, v is not a non-nil pointer, or r is nil. On a refusal v may have
          been partly written; a caller that keeps v after an error keeps a
          half-decoded value.

          A document longer than maxBytes is refused whatever the decoder made of the
          part it read: the truncation, not the prefix, is the finding. The reader is
          never read past maxBytes + 1 bytes.
        in:
          - name: r
            type: io.Reader
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: Decode
        out:
          - type: error
      - doc: |-
          CheckArguments refuses the two calls no input can make succeed — a
          non-positive bound, and a v that is not a non-nil pointer — with
          DecodeMisconfigured naming the argument, and returns nil otherwise. Decode
          runs it first; a caller reading from something other than a plain reader
          (the HTTP form in the httpbody package) runs it before touching its input,
          so the same call is refused the same way through every door.
        in:
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: CheckArguments
        out:
          - type: error
      - doc: |-
          DecodeChecked reads and decodes one bounded document from r into v, for a
          caller that has already refused what CheckArguments refuses and holds a
          non-nil reader. oversize recognises a read error that is itself a size
          refusal — http.MaxBytesError, for a request body — so it is reported as
          DocumentTooLarge rather than as a failed read; nil recognises none.

          It is how the HTTP form reuses this decoder without this package naming
          net/http: the recogniser is the caller's, and so is the import.
        in:
          - name: r
            type: io.Reader
          - name: v
            type: any
          - name: maxBytes
            type: int64
          - name: oversize
            type: func(error) bool
        name: DecodeChecked
        out:
          - type: error
      - doc: |-
          PointerOf returns where a document Decode refused went wrong — or one the
          httpbody package's DecodeRequest refused — as a JSON Pointer (RFC 6901),
          "" being the document itself, and reports whether err carries one.

          The pointer is built from the document's own member names and array
          indices, so it is the input's text, bounded to MaxPointerBytes: a location,
          never a value. Render it as untrusted — escape it in HTML, quote it in a log.
        in:
          - name: err
            type: error
        name: PointerOf
        out:
          - name: pointer
            type: string
          - name: ok
            type: bool
      - doc: |-
          Misconfigured refuses a call before anything is read: DecodeMisconfigured,
          with the argument's name — never its value — as a field.
        in:
          - name: argument
            type: string
        name: Misconfigured
        out:
          - type: error
    path: github.com/kitsunium/sdk/internal/service/data/codec/strictjson
  - doc: |-
      Package httpbody decodes the JSON body of an HTTP request with the strict
      decoder of its parent package, adding the three things only an HTTP body
      has: a bound net/http enforces too, an empty body settled before anything
      else, and a media type that must declare JSON.

      It is a package of its own so that the decoder alone links no net/http: a
      program that reads JSON documents from files, queues or sockets imports
      strictjson and nothing of HTTP, and only a server that reads request bodies
      imports this package and the net/http it needs anyway.
    functions:
      - doc: |-
          DecodeRequest decodes the JSON body of req into v, which must be a non-nil
          pointer, exactly as strictjson.Decode does, reading at most maxBytes bytes.

          Around that decoder it adds the three things only an HTTP body has:

            - the body is read through http.MaxBytesReader, so a body past the bound
              is DocumentTooLarge (413) AND net/http is told to close the connection
              rather than drain what the client keeps sending;
            - an empty body is DocumentEmpty before anything else is looked at,
              whatever the Content-Type says — a caller for whom the body is optional
              treats that code as "no body", one for whom it is required answers 400;
            - a non-empty body must declare application/json or a +json type (RFC
              6839), or it is MediaTypeUnsupported (415) and is not parsed at all.

          w is used only to tell net/http to close the connection; nil is accepted.
        in:
          - name: w
            type: http.ResponseWriter
          - name: req
            type: "*http.Request"
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: DecodeRequest
        out:
          - type: error
    imports:
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/data/codec/strictjson/httpbody
  - doc: |-
      Package strictjson decodes exactly one JSON document into a Go value,
      within a byte bound, refusing what a permissive decoder lets through — and
      no refusal ever repeats a byte of the document.

      	var in CreateItem
      	if err := strictjson.Decode(file, &in, 1<<20); err != nil {
      		return err // DOCUMENT_TOO_LARGE, MEMBER_UNKNOWN, VALUE_MISMATCHED…
      	}

      # Why a second JSON decoder

      The codec package's json format is encoding/json with its defaults, which
      is the right thing for data this program wrote. For a document somebody
      else wrote it is five ways for one document to be read two ways, none of
      which fails: no size limit, unknown members silently dropped, a member
      matched to a field case-insensitively, a duplicated name won by whichever
      came last, and data after the value ignored. This package refuses all five,
      plus invalid UTF-8 and a number out of its field's range. It is built on
      encoding/json/v2, whose defaults already refuse most of them.

      # The refusals

      Each is a typed error with a fixed sentence and an HTTP status, matched with
      errs.HasCode:

      	CodeDocumentTooLarge      413  longer than the bound — the part read is not decoded as if it were whole
      	CodeDocumentEmpty         400  zero bytes: "no body", which a caller may accept
      	CodeDocumentMalformed     400  syntax, truncation, trailing data, a duplicate name, invalid UTF-8
      	CodeMemberUnknown         400  a member the target does not declare, including a case-only variant
      	CodeValueMismatched       400  the wrong kind, a number out of range, a field's own unmarshaler refused
      	CodeMediaTypeUnsupported  415  a request body (httpbody) that does not declare application/json or +json
      	CodeDocumentUnreadable    400  the reader failed before the document ended
      	CodeDecodeMisconfigured   500  a non-positive bound, or a target that is not a non-nil pointer

      A zero bound is refused rather than read as "unlimited": the two readings of
      zero are opposites, and the unlimited one is a memory-exhaustion bug.

      # Never the input

      No Public, no Private and no field of a refusal carries a value from the
      document, and the decoder's own error — whose text quotes the offending
      member name and, for a field's own unmarshaler, the offending value — is not
      kept in the chain. Where the document failed is available separately, from
      PointerOf, as a JSON Pointer ("/items/1/price") built from the document's own
      member names and indices and bounded to MaxPointerBytes: a location, never
      a value, and still the document's text, so render it as untrusted.

      # Request bodies

      The JSON body of an HTTP request is decoded by the package beneath this one,
      github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson/httpbody, whose
      DecodeRequest adds what only an HTTP body has — a bound net/http enforces
      too, an empty body settled first, a media type that must declare JSON — and
      refuses with this package's codes. It is a package of its own so that this
      one links no net/http: a program decoding documents from files, queues or
      sockets does not carry an HTTP stack it never serves.
    facade:
      - const:
          - doc: |-
              MaxPointerBytes bounds the JSON Pointer PointerOf returns; a longer one is
              cut back to the deepest ancestor that fits.
            name: MaxPointerBytes
            reexport: svcstrict.MaxPointerBytes
            type: int
            typed: true
            value: "256"
      - const:
          - doc: CodeDocumentTooLarge identifies a document longer than the bound (413).
            name: CodeDocumentTooLarge
            reexport: corestrictjson.CodeDocumentTooLarge
            type: errs.Code
            typed: true
            value: "0x00_03_48_01"
      - const:
          - doc: CodeDocumentEmpty identifies a document of zero bytes (400).
            name: CodeDocumentEmpty
            reexport: corestrictjson.CodeDocumentEmpty
            type: errs.Code
            typed: true
            value: "0x00_03_48_02"
      - const:
          - doc: |-
              CodeDocumentMalformed identifies a document that is not exactly one
              well-formed JSON value (400).
            name: CodeDocumentMalformed
            reexport: corestrictjson.CodeDocumentMalformed
            type: errs.Code
            typed: true
            value: "0x00_03_48_03"
      - const:
          - doc: CodeMemberUnknown identifies a member the target does not declare (400).
            name: CodeMemberUnknown
            reexport: corestrictjson.CodeMemberUnknown
            type: errs.Code
            typed: true
            value: "0x00_03_48_04"
      - const:
          - doc: CodeValueMismatched identifies a value the target cannot hold (400).
            name: CodeValueMismatched
            reexport: corestrictjson.CodeValueMismatched
            type: errs.Code
            typed: true
            value: "0x00_03_48_05"
      - const:
          - doc: |-
              CodeMediaTypeUnsupported identifies a request body that does not declare
              JSON (415).
            name: CodeMediaTypeUnsupported
            reexport: corestrictjson.CodeMediaTypeUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_48_06"
      - const:
          - doc: |-
              CodeDocumentUnreadable identifies a reader that failed before the document
              ended (400).
            name: CodeDocumentUnreadable
            reexport: corestrictjson.CodeDocumentUnreadable
            type: errs.Code
            typed: true
            value: "0x00_03_48_07"
      - const:
          - doc: |-
              CodeDecodeMisconfigured identifies a call no input can satisfy: a
              non-positive bound, or a target that is not a non-nil pointer.
            name: CodeDecodeMisconfigured
            reexport: corestrictjson.CodeDecodeMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_03_48_08"
      - var:
          - doc: DocumentTooLarge refuses a document longer than the bound.
            name: DocumentTooLarge
            reexport: corestrictjson.DocumentTooLarge
            type: "*errs.Error"
          - doc: DocumentEmpty reports a document of zero bytes.
            name: DocumentEmpty
            reexport: corestrictjson.DocumentEmpty
            type: "*errs.Error"
          - doc: DocumentMalformed refuses a document that is not one well-formed value.
            name: DocumentMalformed
            reexport: corestrictjson.DocumentMalformed
            type: "*errs.Error"
          - doc: MemberUnknown refuses a member the target does not declare.
            name: MemberUnknown
            reexport: corestrictjson.MemberUnknown
            type: "*errs.Error"
          - doc: ValueMismatched refuses a value the target cannot hold.
            name: ValueMismatched
            reexport: corestrictjson.ValueMismatched
            type: "*errs.Error"
          - doc: MediaTypeUnsupported refuses a request body that does not declare JSON.
            name: MediaTypeUnsupported
            reexport: corestrictjson.MediaTypeUnsupported
            type: "*errs.Error"
          - doc: DocumentUnreadable wraps a reader that failed before the document ended.
            name: DocumentUnreadable
            reexport: corestrictjson.DocumentUnreadable
            type: "*errs.Error"
          - doc: DecodeMisconfigured refuses a call no input can satisfy.
            name: DecodeMisconfigured
            reexport: corestrictjson.DecodeMisconfigured
            type: "*errs.Error"
      - func:
          doc: |-
            Decode reads exactly one JSON value from r into v, a non-nil pointer,
            reading at most maxBytes bytes of it — the bound plus the one byte that
            proves it was exceeded, never more. On a refusal v may be partly written.
          forward: svcstrict.Decode
          in:
            - name: r
              type: io.Reader
            - name: v
              type: any
            - name: maxBytes
              type: int64
          name: Decode
          out:
            - type: error
      - func:
          doc: |-
            PointerOf returns where a refused document went wrong, as a JSON Pointer
            ("" is the document itself), and whether err carries one. It is the
            document's own member names and indices, bounded to MaxPointerBytes — render
            it as untrusted text.
          forward: svcstrict.PointerOf
          in:
            - name: err
              type: error
          name: PointerOf
          out:
            - name: pointer
              type: string
            - name: ok
              type: bool
    imports:
      corestrictjson: github.com/kitsunium/sdk/internal/core/data/codec/strictjson
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcstrict: github.com/kitsunium/sdk/internal/service/data/codec/strictjson
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson
  - doc: |-
      Package httpbody decodes the JSON body of an HTTP request with the strict
      decoder of github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson, adding
      what only an HTTP body has.

      	var in CreateItem
      	if err := httpbody.DecodeRequest(w, r, &in, 1<<20); err != nil {
      		http.Error(w, errs.PublicOf(err), errs.HTTPStatusOf(err)) // 400, 413 or 415
      		return
      	}

      # What a request body adds

      The body is read through http.MaxBytesReader, so a body past the bound also
      tells net/http to close the connection instead of draining what the client
      keeps sending. An empty body is strictjson's CodeDocumentEmpty before its
      Content-Type is looked at — treat that code as "no body" where the body is
      optional. A non-empty body must declare application/json or a
      structured-syntax +json type (RFC 6839), or it is strictjson's
      CodeMediaTypeUnsupported (415) and is not parsed at all.

      Everything else is strictjson's: the bound, the refusals and their codes —
      match them with errs.HasCode and the strictjson constants — and PointerOf,
      which locates a refused body as it locates any refused document.

      # Why a package of its own

      So that strictjson links no net/http. A program decoding documents from
      files, queues or sockets imports strictjson alone; a server imports this
      package too, and the net/http it serves with anyway.
    facade:
      - func:
          doc: |-
            DecodeRequest decodes the JSON body of req into v, a non-nil pointer, as
            strictjson's Decode does, through http.MaxBytesReader, after refusing an
            empty body (CodeDocumentEmpty) and a body that does not declare JSON
            (CodeMediaTypeUnsupported). w is used only to have net/http close the
            connection after an oversized body; nil is accepted.
          forward: svchttpbody.DecodeRequest
          in:
            - name: w
              type: http.ResponseWriter
            - name: req
              type: "*http.Request"
            - name: v
              type: any
            - name: maxBytes
              type: int64
          name: DecodeRequest
          out:
            - type: error
    imports:
      http: net/http
      svchttpbody: github.com/kitsunium/sdk/internal/service/data/codec/strictjson/httpbody
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson/httpbody
