apiVersion: kit.kitsunium/design/v2
domain: data/codec/strictjson
packages:
  - codes:
      - const:
          - doc: |-
              CodeDocumentTooLarge identifies a JSON document longer than the bound the
              caller gave.
            name: CodeDocumentTooLarge
            note: "range: 0.3.72.0 - 0.3.72.255"
            value: "0x00_03_48_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentEmpty identifies a JSON document of zero bytes: no value at all,
              which a caller may read as "no body" rather than as a malformed one.
            name: CodeDocumentEmpty
            value: "0x00_03_48_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentMalformed identifies a document that is not exactly one
              well-formed JSON value: a syntax error, a truncation, trailing data, a
              duplicated member name, or invalid UTF-8.
            name: CodeDocumentMalformed
            value: "0x00_03_48_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeMemberUnknown identifies an object member the target type does not
              declare.
            name: CodeMemberUnknown
            value: "0x00_03_48_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeValueMismatched identifies a well-formed value the target cannot hold:
              the wrong JSON kind, a number out of the field's range, a value a field's
              own unmarshaler refused.
            name: CodeValueMismatched
            value: "0x00_03_48_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeMediaTypeUnsupported identifies a request body whose Content-Type is not
              application/json or a +json structured-syntax type.
            name: CodeMediaTypeUnsupported
            value: "0x00_03_48_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentUnreadable identifies a reader that failed before the document
              ended — a connection reset, a cancelled request.
            name: CodeDocumentUnreadable
            value: "0x00_03_48_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecodeMisconfigured identifies a call the decoder refuses before
              reading anything: a non-positive bound, or a target that is not a non-nil
              pointer.
            name: CodeDecodeMisconfigured
            value: "0x00_03_48_08"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/strictjson
    sentinels:
      - var:
          - code: CodeDocumentTooLarge
            doc: |-
              DocumentTooLarge refuses a document longer than the caller's bound,
              whatever the bytes beyond it would have said.
            name: DocumentTooLarge
            options:
              - errs.WithHTTPStatus(httpContentTooLarge)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: more bytes arrived than the bound allows; the limit field is the bound"
            public: The JSON document is larger than the limit
            reason: DOCUMENT_TOO_LARGE
          - code: CodeDocumentEmpty
            doc: |-
              DocumentEmpty reports a document of zero bytes. It is its own code so a
              caller for whom a body is optional can tell "no body" from "a broken
              one" without reading the input again.
            name: DocumentEmpty
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: the reader ended before the first byte"
            public: The JSON document is empty
            reason: DOCUMENT_EMPTY
          - code: CodeDocumentMalformed
            doc: |-
              DocumentMalformed refuses a document that is not exactly one
              well-formed JSON value.
            name: DocumentMalformed
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: a syntax error, a truncation, trailing data, a duplicate name or invalid UTF-8; the offset field locates it"
            public: The JSON document is not well-formed
            reason: DOCUMENT_MALFORMED
          - code: CodeMemberUnknown
            doc: |-
              MemberUnknown refuses an object member the target does not declare,
              including one that differs from a declared name only by case.
            name: MemberUnknown
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: an object member matches no field of the target; PointerOf locates it"
            public: The JSON document has a member the target does not accept
            reason: MEMBER_UNKNOWN
          - code: CodeValueMismatched
            doc: ValueMismatched refuses a well-formed value the target cannot hold.
            name: ValueMismatched
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: a value does not fit the field it maps to; PointerOf locates it"
            public: The JSON document has a value of the wrong type or out of range
            reason: VALUE_MISMATCHED
          - code: CodeMediaTypeUnsupported
            doc: |-
              MediaTypeUnsupported refuses a request body that does not declare itself
              JSON.
            name: MediaTypeUnsupported
            options:
              - errs.WithHTTPStatus(httpUnsupportedMediaType)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/codec/strictjson: the Content-Type is absent, unparsable, or names another media type"
            public: The request body must be application/json or a +json media type
            reason: MEDIA_TYPE_UNSUPPORTED
          - code: CodeDocumentUnreadable
            doc: |-
              DocumentUnreadable wraps a reader that failed before the document
              ended. The reader's own error stays in the chain.
            name: DocumentUnreadable
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitIOErr)
            private: "service/data/codec/strictjson: the reader returned an error other than end-of-input"
            public: The JSON document could not be read
            reason: DOCUMENT_UNREADABLE
          - code: CodeDecodeMisconfigured
            doc: |-
              DecodeMisconfigured refuses a call the decoder can never honour: a
              non-positive bound — whose two readings, "unbounded" and "nothing", are
              opposites (ADR 0031) — or a target that is not a non-nil pointer.
            name: DecodeMisconfigured
            options:
              - errs.WithExitCode(exitSoftware)
            private: "service/data/codec/strictjson: the field names the argument: a non-positive bound or a target that is not a non-nil pointer"
            public: The JSON decoder was called with an argument it cannot use
            reason: DECODE_MISCONFIGURED
  - constants:
      - name: MaxPointerBytes
        type: int
        value: "256"
    functions:
      - in:
          - name: failure
            type: error
        name: Unreadable
        out:
          - type: error
      - in:
          - name: r
            type: io.Reader
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: Decode
        out:
          - type: error
      - in:
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: CheckArguments
        out:
          - type: error
      - in:
          - name: r
            type: io.Reader
          - name: v
            type: any
          - name: maxBytes
            type: int64
          - name: oversize
            type: func(error) bool
        name: DecodeChecked
        out:
          - type: error
      - in:
          - name: err
            type: error
        name: PointerOf
        out:
          - name: pointer
            type: string
          - name: ok
            type: bool
      - in:
          - name: argument
            type: string
        name: Misconfigured
        out:
          - type: error
    path: github.com/kitsunium/sdk/internal/service/data/codec/strictjson
  - functions:
      - in:
          - name: w
            type: http.ResponseWriter
          - name: req
            type: "*http.Request"
          - name: v
            type: any
          - name: maxBytes
            type: int64
        name: DecodeRequest
        out:
          - type: error
    imports:
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/data/codec/strictjson/httpbody
  - facade:
      - const:
          - doc: |-
              MaxPointerBytes bounds the JSON Pointer PointerOf returns; a longer one is
              cut back to the deepest ancestor that fits.
            name: MaxPointerBytes
            reexport: svcstrict.MaxPointerBytes
            type: int
            typed: true
            value: "256"
      - const:
          - doc: CodeDocumentTooLarge identifies a document longer than the bound (413).
            name: CodeDocumentTooLarge
            reexport: corestrictjson.CodeDocumentTooLarge
            type: errs.Code
            typed: true
            value: "0x00_03_48_01"
      - const:
          - doc: CodeDocumentEmpty identifies a document of zero bytes (400).
            name: CodeDocumentEmpty
            reexport: corestrictjson.CodeDocumentEmpty
            type: errs.Code
            typed: true
            value: "0x00_03_48_02"
      - const:
          - doc: |-
              CodeDocumentMalformed identifies a document that is not exactly one
              well-formed JSON value (400).
            name: CodeDocumentMalformed
            reexport: corestrictjson.CodeDocumentMalformed
            type: errs.Code
            typed: true
            value: "0x00_03_48_03"
      - const:
          - doc: CodeMemberUnknown identifies a member the target does not declare (400).
            name: CodeMemberUnknown
            reexport: corestrictjson.CodeMemberUnknown
            type: errs.Code
            typed: true
            value: "0x00_03_48_04"
      - const:
          - doc: CodeValueMismatched identifies a value the target cannot hold (400).
            name: CodeValueMismatched
            reexport: corestrictjson.CodeValueMismatched
            type: errs.Code
            typed: true
            value: "0x00_03_48_05"
      - const:
          - doc: |-
              CodeMediaTypeUnsupported identifies a request body that does not declare
              JSON (415).
            name: CodeMediaTypeUnsupported
            reexport: corestrictjson.CodeMediaTypeUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_48_06"
      - const:
          - doc: |-
              CodeDocumentUnreadable identifies a reader that failed before the document
              ended (400).
            name: CodeDocumentUnreadable
            reexport: corestrictjson.CodeDocumentUnreadable
            type: errs.Code
            typed: true
            value: "0x00_03_48_07"
      - const:
          - doc: |-
              CodeDecodeMisconfigured identifies a call no input can satisfy: a
              non-positive bound, or a target that is not a non-nil pointer.
            name: CodeDecodeMisconfigured
            reexport: corestrictjson.CodeDecodeMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_03_48_08"
      - var:
          - doc: DocumentTooLarge refuses a document longer than the bound.
            name: DocumentTooLarge
            reexport: corestrictjson.DocumentTooLarge
            type: "*errs.Error"
          - doc: DocumentEmpty reports a document of zero bytes.
            name: DocumentEmpty
            reexport: corestrictjson.DocumentEmpty
            type: "*errs.Error"
          - doc: DocumentMalformed refuses a document that is not one well-formed value.
            name: DocumentMalformed
            reexport: corestrictjson.DocumentMalformed
            type: "*errs.Error"
          - doc: MemberUnknown refuses a member the target does not declare.
            name: MemberUnknown
            reexport: corestrictjson.MemberUnknown
            type: "*errs.Error"
          - doc: ValueMismatched refuses a value the target cannot hold.
            name: ValueMismatched
            reexport: corestrictjson.ValueMismatched
            type: "*errs.Error"
          - doc: MediaTypeUnsupported refuses a request body that does not declare JSON.
            name: MediaTypeUnsupported
            reexport: corestrictjson.MediaTypeUnsupported
            type: "*errs.Error"
          - doc: DocumentUnreadable wraps a reader that failed before the document ended.
            name: DocumentUnreadable
            reexport: corestrictjson.DocumentUnreadable
            type: "*errs.Error"
          - doc: DecodeMisconfigured refuses a call no input can satisfy.
            name: DecodeMisconfigured
            reexport: corestrictjson.DecodeMisconfigured
            type: "*errs.Error"
      - func:
          doc: |-
            Decode reads exactly one JSON value from r into v, a non-nil pointer,
            reading at most maxBytes bytes of it — the bound plus the one byte that
            proves it was exceeded, never more. On a refusal v may be partly written.
          forward: svcstrict.Decode
          in:
            - name: r
              type: io.Reader
            - name: v
              type: any
            - name: maxBytes
              type: int64
          name: Decode
          out:
            - type: error
      - func:
          doc: |-
            PointerOf returns where a refused document went wrong, as a JSON Pointer
            ("" is the document itself), and whether err carries one. It is the
            document's own member names and indices, bounded to MaxPointerBytes — render
            it as untrusted text.
          forward: svcstrict.PointerOf
          in:
            - name: err
              type: error
          name: PointerOf
          out:
            - name: pointer
              type: string
            - name: ok
              type: bool
    imports:
      corestrictjson: github.com/kitsunium/sdk/internal/core/data/codec/strictjson
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcstrict: github.com/kitsunium/sdk/internal/service/data/codec/strictjson
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson
  - facade:
      - func:
          doc: |-
            DecodeRequest decodes the JSON body of req into v, a non-nil pointer, as
            strictjson's Decode does, through http.MaxBytesReader, after refusing an
            empty body (CodeDocumentEmpty) and a body that does not declare JSON
            (CodeMediaTypeUnsupported). w is used only to have net/http close the
            connection after an oversized body; nil is accepted.
          forward: svchttpbody.DecodeRequest
          in:
            - name: w
              type: http.ResponseWriter
            - name: req
              type: "*http.Request"
            - name: v
              type: any
            - name: maxBytes
              type: int64
          name: DecodeRequest
          out:
            - type: error
    imports:
      http: net/http
      svchttpbody: github.com/kitsunium/sdk/internal/service/data/codec/strictjson/httpbody
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/strictjson/httpbody
