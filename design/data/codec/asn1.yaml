apiVersion: kit.kitsunium/design/v2
domain: data/codec/asn1
packages:
  - codes:
      - const:
          - doc: CodeASN1MarshalFailed identifies a failure inside encoding/asn1.Marshal.
            name: CodeASN1MarshalFailed
            note: "range: 0.3.9.0 - 0.3.9.255"
            value: "0x00_03_09_01"
        type: errs.Code
      - const:
          - doc: CodeASN1UnmarshalFailed identifies a failure inside encoding/asn1.Unmarshal.
            name: CodeASN1UnmarshalFailed
            value: "0x00_03_09_02"
        type: errs.Code
    doc: |-
      Package asn1 declares the error codes and the sentinels of the ASN.1 DER
      codec, internal/service/data/codec/asn1 — range 0.3.9.* (ADR 0005
      service/data/codec/asn1 block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package asn1 — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/asn1
    sentinels:
      - var:
          - code: CodeASN1MarshalFailed
            doc: MarshalFailed wraps a failure from encoding/asn1.Marshal.
            name: MarshalFailed
            private: "service/data/codec/asn1: encoding/asn1.Marshal returned an error"
            public: ASN.1 DER encoding failed
            reason: MARSHAL_FAILED
          - code: CodeASN1UnmarshalFailed
            doc: UnmarshalFailed wraps a failure from encoding/asn1.Unmarshal.
            name: UnmarshalFailed
            private: "service/data/codec/asn1: encoding/asn1.Unmarshal returned an error"
            public: ASN.1 DER decoding failed
            reason: UNMARSHAL_FAILED
  - doc: |-
      Package asn1 wraps encoding/asn1 as a codec.Codec implementation.
      Only DER (Distinguished Encoding Rules) is emitted because the stdlib
      produces DER exclusively; BER parsing is still accepted on Unmarshal.
    functions:
      - doc: New returns an ASN.1 DER codec instance.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
    path: github.com/kitsunium/sdk/internal/service/data/codec/asn1
    variables:
      - doc: |-
          Codec is the ASN.1 DER singleton, registered with core/data/codec at package load.
          Binding the registration result to a named var is more idiomatic than
          `var _ = codec.Register(...)` and keeps us clear of init().
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name ASN.1 DER is registered under. It is an untyped constant,
          so it goes wherever a format name is taken — the codec package's Marshal,
          config.FSSource's string, i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"asn1-der\""
    doc: |-
      Package asn1 registers the ASN.1 DER codec with the SDK's codec registry —
      and no other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/asn1"

      The codec is the standard library's encoding/asn1: Marshal writes DER — the
      only encoding that package produces — and Unmarshal also accepts BER. The
      value is whatever encoding/asn1 maps: a struct of exported fields, an
      integer, a string, a time, a []byte, an asn1.ObjectIdentifier. Its MIME
      type is application/pkix-cert and its extensions .der and .cer.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.9.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.9.1  encoding/asn1 could not encode the value
      	CodeUnmarshalFailed  0.3.9.2  the input is not DER or BER the target can hold

      No error message quotes the input.
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.9.1: encoding/asn1 could not encode the value."
            name: CodeMarshalFailed
            reexport: coreasn1.CodeASN1MarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_09_01"
          - doc: |-
              CodeUnmarshalFailed is 0.3.9.2: the input is not DER or BER the target
              can hold.
            name: CodeUnmarshalFailed
            reexport: coreasn1.CodeASN1UnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_09_02"
        doc: The error codes, range 0.3.9.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: coreasn1.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: coreasn1.UnmarshalFailed
            type: "*errs.Error"
    imports:
      coreasn1: github.com/kitsunium/sdk/internal/core/data/codec/asn1
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/asn1
