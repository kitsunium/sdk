apiVersion: kit.kitsunium/design/v2
domain: data/codec/pem
packages:
  - codes:
      - const:
          - doc: CodePEMMarshalFailed identifies a failure inside encoding/pem.Encode.
            name: CodePEMMarshalFailed
            note: "range: 0.3.10.0 - 0.3.10.255"
            value: "0x00_03_0A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodePEMUnmarshalFailed identifies a failure inside encoding/pem.Decode
              (no PEM block found in input).
            name: CodePEMUnmarshalFailed
            value: "0x00_03_0A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodePEMValueInvalid identifies a Marshal call that did not receive a *pem.Block
              or an Unmarshal call whose target is not a **pem.Block.
            name: CodePEMValueInvalid
            value: "0x00_03_0A_03"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/pem
    sentinels:
      - var:
          - code: CodePEMMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/pem.Encode.
            name: MarshalFailed
            private: "service/data/codec/pem: encoding/pem.Encode returned an error"
            public: PEM encoding failed
            reason: MARSHAL_FAILED
          - code: CodePEMUnmarshalFailed
            doc: UnmarshalFailed fires when no PEM block could be decoded from the input.
            name: UnmarshalFailed
            private: "service/data/codec/pem: encoding/pem.Decode returned no block"
            public: PEM decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodePEMValueInvalid
            doc: ValueInvalid fires when the caller does not pass a *pem.Block / **pem.Block.
            name: ValueInvalid
            private: "service/data/codec/pem: Marshal/Unmarshal argument is not *pem.Block"
            public: PEM codec requires a *pem.Block value
            reason: VALUE_INVALID
  - aliases:
      - name: Block
        target: stdpem.Block
    functions:
      - name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      stdpem: encoding/pem
    path: github.com/kitsunium/sdk/internal/service/data/codec/pem
    variables:
      - name: Codec
        type: codec.Codec
  - constants:
      - name: Format
        value: "\"pem\""
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.10.1: encoding/pem refused to write the block."
            name: CodeMarshalFailed
            reexport: corepem.CodePEMMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0A_01"
          - doc: "CodeUnmarshalFailed is 0.3.10.2: no PEM block in the input."
            name: CodeUnmarshalFailed
            reexport: corepem.CodePEMUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0A_02"
          - doc: |-
              CodeValueInvalid is 0.3.10.3: the value is not a *pem.Block, or the
              target a **pem.Block.
            name: CodeValueInvalid
            reexport: corepem.CodePEMValueInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_0A_03"
        doc: The error codes, range 0.3.10.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corepem.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corepem.UnmarshalFailed
            type: "*errs.Error"
          - doc: ValueInvalid is the sentinel of [CodeValueInvalid].
            name: ValueInvalid
            reexport: corepem.ValueInvalid
            type: "*errs.Error"
    imports:
      corepem: github.com/kitsunium/sdk/internal/core/data/codec/pem
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/pem
