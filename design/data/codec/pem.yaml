apiVersion: kit.kitsunium/design/v2
domain: data/codec/pem
packages:
  - codes:
      - const:
          - doc: CodePEMMarshalFailed identifies a failure inside encoding/pem.Encode.
            name: CodePEMMarshalFailed
            note: "range: 0.3.10.0 - 0.3.10.255"
            value: "0x00_03_0A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodePEMUnmarshalFailed identifies a failure inside encoding/pem.Decode
              (no PEM block found in input).
            name: CodePEMUnmarshalFailed
            value: "0x00_03_0A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodePEMValueInvalid identifies a Marshal call that did not receive a *pem.Block
              or an Unmarshal call whose target is not a **pem.Block.
            name: CodePEMValueInvalid
            value: "0x00_03_0A_03"
        type: errs.Code
    doc: |-
      Package pem declares the error codes and the sentinels of the PEM codec,
      internal/service/data/codec/pem — range 0.3.10.* (ADR 0005
      service/data/codec/pem block).

      The codes live in the core at the path that mirrors the package emitting
      them (ADR 0160 §2) and keep the values they were allocated with: the LL
      byte 3 records the layer that allocated the range, not the directory that
      declares it today (ADR 0160 §3). Nothing here encodes or decodes — the
      mechanism, and the constructors that attach a failure's detail, stay in
      the service package.

      Package pem — the sentinel *errs.Error values, one per code. Each
      Reason derives from its var name or from its Code constant (ADR 0020);
      the Public and Private texts are the ones the service package always
      emitted, so moving the declaration changed no rendering.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/codec/pem
    sentinels:
      - var:
          - code: CodePEMMarshalFailed
            doc: MarshalFailed wraps a failure from encoding/pem.Encode.
            name: MarshalFailed
            private: "service/data/codec/pem: encoding/pem.Encode returned an error"
            public: PEM encoding failed
            reason: MARSHAL_FAILED
          - code: CodePEMUnmarshalFailed
            doc: UnmarshalFailed fires when no PEM block could be decoded from the input.
            name: UnmarshalFailed
            private: "service/data/codec/pem: encoding/pem.Decode returned no block"
            public: PEM decoding failed
            reason: UNMARSHAL_FAILED
          - code: CodePEMValueInvalid
            doc: ValueInvalid fires when the caller does not pass a *pem.Block / **pem.Block.
            name: ValueInvalid
            private: "service/data/codec/pem: Marshal/Unmarshal argument is not *pem.Block"
            public: PEM codec requires a *pem.Block value
            reason: VALUE_INVALID
  - aliases:
      - doc: |-
          Block re-exports encoding/pem.Block so consumers do not need to import
          the stdlib package directly.
        name: Block
        target: stdpem.Block
    doc: |-
      Package pem wraps encoding/pem as a codec.Codec implementation.
      PEM is block-structured: each wire message is a typed block ("CERTIFICATE",
      "PRIVATE KEY", etc.), so the codec operates on *pem.Block values.
    functions:
      - doc: New returns a PEM codec instance.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      stdpem: encoding/pem
    path: github.com/kitsunium/sdk/internal/service/data/codec/pem
    variables:
      - blockDoc: |-
          Package-level state: the codec singleton, MIME/extension tables, the
          cached promotion fast-path markers, and the Marshal-buffer pool.
        doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
  - constants:
      - doc: |-
          Format is the name PEM is registered under. It is an untyped constant, so it
          goes wherever a format name is taken — the codec package's Marshal,
          config.FSSource's string, i18n.LoadFS's codec.Format — without a conversion.
        name: Format
        value: "\"pem\""
    doc: |-
      Package pem registers the PEM codec with the SDK's codec registry — and no
      other codec — when it is imported (ADR 0134):

      	import _ "github.com/kitsunium/sdk/pkg/v1/data/codec/pem"

      The codec is the standard library's encoding/pem, RFC 7468's textual
      armour: its native value is a *pem.Block — a type, headers and the bytes —
      and an Unmarshal target is a **pem.Block. Through the codec package's
      Marshal any other value is carried as the bytes of one JSON-typed block.

      Everything that dispatches through the registry by format name then
      reads and writes it: the codec package's Marshal and Unmarshal,
      config.FSSource and i18n.LoadFS. Importing
      github.com/kitsunium/sdk/pkg/v1/data/codec instead registers every
      format the SDK ships; this package links this one codec, the core
      package declaring its codes and the standard library, and nothing else.
      Importing both is harmless: a format is registered by the package that
      implements it, which Go initialises once however many packages import it.

      # Errors

      Failures carry the range 0.3.10.*; match them with errs.HasCode, or the
      sentinels with errors.Is:

      	CodeMarshalFailed    0.3.10.1  encoding/pem refused to write the block
      	CodeUnmarshalFailed  0.3.10.2  no PEM block in the input
      	CodeValueInvalid     0.3.10.3  the value is not a *pem.Block, or the target a **pem.Block

      No error message quotes the input.
    facade:
      - const:
          - doc: "CodeMarshalFailed is 0.3.10.1: encoding/pem refused to write the block."
            name: CodeMarshalFailed
            reexport: corepem.CodePEMMarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0A_01"
          - doc: "CodeUnmarshalFailed is 0.3.10.2: no PEM block in the input."
            name: CodeUnmarshalFailed
            reexport: corepem.CodePEMUnmarshalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_0A_02"
          - doc: |-
              CodeValueInvalid is 0.3.10.3: the value is not a *pem.Block, or the
              target a **pem.Block.
            name: CodeValueInvalid
            reexport: corepem.CodePEMValueInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_0A_03"
        doc: The error codes, range 0.3.10.*, declared in the core (ADR 0160).
      - doc: "The sentinels, for errors.Is: each carries the code of the same name."
        var:
          - doc: MarshalFailed is the sentinel of [CodeMarshalFailed].
            name: MarshalFailed
            reexport: corepem.MarshalFailed
            type: "*errs.Error"
          - doc: UnmarshalFailed is the sentinel of [CodeUnmarshalFailed].
            name: UnmarshalFailed
            reexport: corepem.UnmarshalFailed
            type: "*errs.Error"
          - doc: ValueInvalid is the sentinel of [CodeValueInvalid].
            name: ValueInvalid
            reexport: corepem.ValueInvalid
            type: "*errs.Error"
    imports:
      corepem: github.com/kitsunium/sdk/internal/core/data/codec/pem
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/data/codec/pem
