apiVersion: kit.kitsunium/design/v2
domain: data/cache
packages:
  - codes:
      - const:
          - doc: |-
              CodeCacheMisconfigured identifies a store refused AT CONSTRUCTION because
              its configuration cannot be honoured — a non-positive capacity, a negative
              default TTL. It is never an operational outcome: no entry was ever stored.
            name: CodeCacheMisconfigured
            note: "range: 0.2.18.0 - 0.2.18.255"
            value: "0x00_02_12_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheBackendFailed identifies a store that could not serve an operation
              for a reason of its own — the transport, the medium, the process it depends
              on. A plain MISS is not this: a cache that does not hold something has done
              nothing wrong and reports (zero, false, nil).
            name: CodeCacheBackendFailed
            value: "0x00_02_12_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheFillFailed identifies a Loader.Load whose caller-supplied fill
              returned an error. NOTHING was stored: a failed fill must not be cached, or
              one bad minute at the origin becomes a TTL's worth of bad answers.

              It applies only when the fill's error carries no SDK code of its own. One
              that does propagates untouched, because relabelling it would discard the
              origin's own diagnosis (ADR 0005 §origin wins).
            name: CodeCacheFillFailed
            value: "0x00_02_12_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheEntryRejected identifies an entry a store refuses to store: an
              empty key, an empty tag, or a negative TTL that is not cache.NoExpiry.

              Each of the three is a value that has no meaning rather than an unusual one,
              and storing it would produce an entry the caller can never deliberately
              fetch, invalidate or replace.
            name: CodeCacheEntryRejected
            value: "0x00_02_12_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheAbsent marks a fill's failure as an answer to cache: the key does
              not exist at the origin. Absent puts it on the wrap trail of the fill's own
              error, and a store's Load then keeps a negative entry for the lifetime the
              mark carries.
            name: CodeCacheAbsent
            value: "0x00_02_12_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheChainMisconfigured identifies a NewChain refused AT CONSTRUCTION:
              fewer than two tiers, a nil tier, or a tier that cannot answer the whole
              contract a tier must answer (see the errors.go sentinel for why that is
              checked once, up front, rather than discovered per call).
            name: CodeCacheChainMisconfigured
            note: |-
              range: 0.3.48.0 - 0.3.48.255 — the chained store's own codes, allocated by
              the service layer (LL = 3) and declared here since ADR 0160: a code keeps the
              value its layer allocated when its declaration moves.
            value: "0x00_03_30_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheTierFailed identifies a chained operation that failed inside one
              specific tier.

              It is distinct from CACHE_BACKEND_FAILED because a chain has more than one
              backend, and "the cache is broken" and "the far tier is broken" are
              different incidents with different responses: the first is an outage, the
              second is a degradation the near tier is still absorbing.
            name: CodeCacheTierFailed
            value: "0x00_03_30_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCacheLeaseFailed identifies a LoadLeased whose locker could not
              answer: the cross-process lease on a key could be neither taken nor
              given up (#830).
            name: CodeCacheLeaseFailed
            value: "0x00_03_30_03"
        type: errs.Code
    constants:
      - doc: |-
          NoExpiry is the [EntryValue.TTL] that stores an entry with no deadline.

          It is a distinct value from the zero TTL, which means "use the store's
          default". A cache with a one-minute default holding one entry that must
          never expire is a real combination, and reading both meanings out of 0 would
          make it unspellable — the caller would have to know the default and restate
          it, which stops being true the day the default changes.
        name: NoExpiry
        type: time.Duration
        value: "-1"
    doc: |-
      Package cache declares the SDK's cache DOMAIN: the [Store] port that owns a
      set of keyed entries, the [EntryValue] a caller hands it, and the three
      sibling interfaces through which a store advertises what else it can do.
      A core sibling admitted by ADR 0049, which amends ADR 0025.

      # This is not internal/kernel/collections/cache

      [github.com/kitsunium/sdk/internal/kernel/collections/cache] is a PRIMITIVE: a generic
      LRU + TTL map with no port, no error surface and no vocabulary. It stays
      exactly what it is, and the concrete store in internal/service/data/cache is
      built on top of it.

      This package is the DOMAIN: an interface a caller can hold without naming an
      implementation, plus the three things a primitive deliberately does not
      have — invalidation by tag, protection against a stampede of concurrent
      misses, and the ability to put one store in front of another.

      # A read is not free, and the port says so

      The read verb is [Store.Fetch], not Get, and the name is load-bearing. A hit
      promotes the entry in the store's recency order and moves its counters; in
      the concrete memory store it takes a WRITE lock for exactly that reason. Two
      concurrent Fetches of one key are therefore not interchangeable with one,
      and a Fetch is not something to sprinkle through a function that must not
      mutate. ADR 0025 named the primitive's method Fetch for this reason; the
      port keeps the name so the honesty survives the layer boundary.

      # There is no registry

      Like proc (ADR 0016), resilience (ADR 0026), net (ADR 0029), scheduler
      (ADR 0041), token (ADR 0042), session (ADR 0045) and validation (ADR 0046),
      this domain has no name-to-implementation registry.

      The domain reason is session's: the set of backends is closed and small, and
      picking one is a deployment decision made in code. Resolving it from a
      configuration string would let a typo silently downgrade a shared cache to a
      per-process one — and unlike a downgraded logger, a downgraded cache still
      answers every call correctly, so nothing would ever surface.

      The mechanical reason is decisive on its own: [Store] is generic in V, and
      Go has no map from a name to Store[V] for an open V. A registry here would
      have to erase the type and hand it back as any, which is precisely the
      unchecked cast the typed port exists to remove.

      # Keys are strings, values are not

      [Store] fixes the key type to string while leaving V generic. The primitive
      is generic in both, and the domain deliberately narrows one half: a domain
      key appears in a tag bucket, in an error field and in a log line, and a
      generic K would need a formatting rule for each of those before it could.
      A caller with a non-string key formats it once, at the edge, where the
      encoding is a decision rather than a default.

      Package cache — the sibling interfaces a store advertises by type assertion
      (ADR 0039), kept out of cache.go so the FROZEN port stands alone in the file
      that names the package.

      Package cache — range 0.2.18.* (ADR 0049 core/data/cache block), and the
      chained store's 0.3.48.* (ADR 0049 service/data/cache block, declared here
      since ADR 0160).

      Package cache — the immutable value a caller hands to a Store.

      Package cache — declares the sentinel *errs.Error port outcomes, and the
      two the chained store in internal/service/data/cache emits (ADR 0160: every
      code is declared in the core, at the service's path). Each var's name equals
      its errs.Define Reason in SCREAMING_SNAKE form.
    functions:
      - doc: |-
          Absent marks a fill's failure as an ANSWER to cache: the key does not exist
          at the origin, and asking again before ttl has passed would get the same
          answer. A store whose Load receives it stores a negative entry for ttl;
          until it expires, Load returns this same error — errors.Is still finds
          cause — and calls no fill, while Fetch reports a miss and a Set replaces
          it.

          	row, err := db.Get(ctx, id)
          	if errors.Is(err, sql.ErrNoRows) {
          		return cache.EntryValue[Row]{}, cache.Absent(err, time.Minute)
          	}

          The mark is an errs.Wrap onto cause: an SDK cause keeps its own Code,
          Reason and Public, [CodeCacheAbsent] joins its wrap trail and the lifetime
          rides as a field; any other cause records [CacheAbsent] itself. A ttl that
          is not positive caches nothing: the failure is returned as any other.
        in:
          - name: cause
            type: error
          - name: ttl
            type: time.Duration
        name: Absent
        out:
          - type: error
      - doc: |-
          AbsentTTLOf returns the lifetime [Absent] put on err, and whether it put
          one. When err was marked more than once, the outermost mark's lifetime is
          returned.
        in:
          - name: err
            type: error
        name: AbsentTTLOf
        out:
          - name: ttl
            type: time.Duration
          - name: marked
            type: bool
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      lock: github.com/kitsunium/sdk/internal/core/app/lock
    path: github.com/kitsunium/sdk/internal/core/data/cache
    ports:
      - doc: |-
          Store is the cache port. Implementations MUST be safe for concurrent use.

          The method set is deliberately three operations wide and is FROZEN: pkg/v1
          aliases this interface, so under ADR 0039 a fourth method would break every
          downstream implementer at compile time with no deprecation window. New
          capabilities arrive as SIBLING interfaces discovered by type assertion —
          [EntryFetcher], [Tagger] and [Loader] are the three that ship, and the model
          is codec's Appender (ADR 0037).

          IFACE-PLUGIN: the concrete stores stay unexported behind their constructors
          in internal/service/data/cache.
        methods:
          - doc: |-
              Fetch returns the value stored under key and whether it was present and
              unexpired. It MUTATES the store — recency, counters, lazy expiry — which
              is why it is not called Get. A miss is (zero, false, nil), never an
              error: a cache that does not hold something has done nothing wrong.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Fetch
            out:
              - type: V
              - type: bool
              - type: error
          - doc: |-
              Set stores entry under key, replacing whatever was there. An empty key,
              an empty tag, or a negative TTL that is not [NoExpiry] is refused with
              [CacheEntryRejected] rather than stored.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: entry
                type: EntryValue[V]
            name: Set
            out:
              - type: error
          - doc: |-
              Delete removes key. It is idempotent: deleting a key that names nothing
              reports nil, because a caller who wanted it gone has got what they asked
              for.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Delete
            out:
              - type: error
        name: Store
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          EntryFetcher is the sibling that returns the whole entry rather than only
          its value (ADR 0039). It exists because promotion between tiers has to carry
          TTL and tags: a value promoted into a near tier without its tags is a value
          that [Tagger.InvalidateTag] can no longer reach, and an invalidation that
          silently misses one copy is worse than one that is not offered at all.
        methods:
          - doc: |-
              FetchEntry is [Store.Fetch] returning the stored entry — value, remaining
              TTL and tags. It mutates the store for the same reasons Fetch does.

              The TTL it reports is the REMAINING time, not the one originally
              supplied: promoting an entry with its original TTL would extend its life
              every time it moved between tiers.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: FetchEntry
            out:
              - type: EntryValue[V]
              - type: bool
              - type: error
        name: EntryFetcher
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          Tagger is the sibling for stores that index entries by tag (ADR 0039).

          Tagging exists because the thing a caller wants to invalidate is usually not
          a key. "Every entry derived from user 42" is a set whose members are known
          to the writer and not to the invalidator, and without a tag the invalidator's
          only options are to guess the key shape or to purge everything.
        methods:
          - doc: |-
              InvalidateTag removes every entry carrying tag and reports how many it
              removed. A tag that names nothing removes zero and reports nil.

              The cost is proportional to the number of entries carrying the tag, NOT
              to the size of the store — see internal/service/data/cache/BENCH.md, which
              measures it at two store sizes for exactly this claim.
            in:
              - name: ctx
                type: context.Context
              - name: tag
                type: string
            name: InvalidateTag
            out:
              - name: removed
                type: int
              - name: err
                type: error
        name: Tagger
      - doc: |-
          Loader is the sibling for stores that can fill a miss while ensuring that
          concurrent misses on ONE key run the fill ONCE (ADR 0039).

          # What it protects against, and what it does not

          A cache stampede is what happens when a hot key expires: every request that
          was being served from it misses at the same instant and every one of them
          calls the origin. The origin sees, in one moment, the traffic the cache was
          hiding — which is the load the cache was bought to prevent, arriving when
          the system is least able to absorb it.

          [Loader.Load] collapses those calls into one WITHIN ONE PROCESS. It does
          NOT coordinate across replicas: N instances of a service each running this
          still produce N concurrent fills. Cross-process collapsing needs a shared
          lease, which is a distributed system and not something a cache port can
          promise. A reader who takes "stampede protection" to mean "my origin sees
          one request" would be wrong by a factor of N, so the limit is stated here,
          in the port, and again in every document that mentions the feature.
          [Leaser] is the sibling that takes such a lease, from a lock.Locker the
          processes share, and says what it can and cannot promise.
        methods:
          - doc: |-
              Load returns the value for key, calling fill exactly once across all
              concurrent callers of this key in this process if the cache does not
              hold it. A fill that fails stores nothing and returns
              [CacheFillFailed] — unless the failure already carries an SDK code, in
              which case it propagates untouched (ADR 0005 §origin wins).

              fill does NOT receive ctx. It receives the shared call's context: the
              first caller's values with every deadline removed, cancelled only once
              every waiting caller has gone. A caller whose own ctx ends while it
              waits gets its own ctx.Err() and leaves the fill running for the others.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fill
                type: Fill[V]
            name: Load
            out:
              - type: V
              - type: error
        name: Loader
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          Expirer is the sibling for stores that can remove their expired entries on
          demand (ADR 0039, #1059). Expiry is otherwise lazy: an entry past its TTL
          is reaped by a read of its own key or by an eviction, and until then it
          holds capacity, a place in the tag index and — for a value that must not
          outlive its TTL — memory. The store starts no goroutine: the caller sweeps
          on its own ticker or scheduler, which is the cadence ADR 0049 left to it.
        methods:
          - doc: |-
              Expire removes every entry whose deadline has passed and reports how many
              it removed. A chain sweeps every tier that can, far to near, and reports
              the total of removals, as InvalidateTag counts them.
            in:
              - name: ctx
                type: context.Context
            name: Expire
            out:
              - name: removed
                type: int
              - name: err
                type: error
        name: Expirer
      - doc: |-
          BulkFetcher is the sibling that reads many keys in one call (ADR 0039,
          #840): one lock acquisition per stripe on a memory store, one pass per tier
          on a chain, one round trip on a remote tier — where N calls of Fetch pay N.
        methods:
          - doc: |-
              FetchMany returns the values of the keys the store holds, and no entry for
              a key it does not. It mutates the store as Fetch does. Duplicate keys
              are read once.
            in:
              - name: ctx
                type: context.Context
              - name: keys
                type: "[]string"
            name: FetchMany
            out:
              - type: map[string]V
              - type: error
        name: BulkFetcher
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          BulkSetter is the sibling that stores many entries in one call (ADR 0039,
          #840).
        methods:
          - doc: |-
              SetMany stores every entry under its key. Every entry is validated before
              any is stored: one a store refuses — an empty key or tag, a TTL Set would
              refuse — fails the call with [CacheEntryRejected] and stores nothing.
            in:
              - name: ctx
                type: context.Context
              - name: entries
                type: map[string]EntryValue[V]
            name: SetMany
            out:
              - type: error
        name: BulkSetter
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          Refresher is the sibling that refreshes a hot entry BEFORE it expires
          (ADR 0039, #838): stale-while-revalidate. A Load collapses the stampede at
          expiry; it does not hide the latency, since every reader of that instant
          waits for the origin. LoadRefreshing answers from the cache and refills in
          the background while the entry is still valid.
        methods:
          - doc: |-
              LoadRefreshing is Load, except on a hit whose remaining lifetime is below
              before: the value is returned at once and ONE background fill per key
              starts, on the caller's context values without its cancellation, bounded
              by the entry's remaining lifetime; what it returns replaces the entry, and
              a failure leaves the entry to expire. A hit outside that window starts
              nothing. A before that is not positive is refused with
              [CacheMisconfigured].
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fill
                type: Fill[V]
              - name: before
                type: time.Duration
            name: LoadRefreshing
            out:
              - type: V
              - type: error
        name: Refresher
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          Leaser is the sibling that carries stampede protection across PROCESSES
          (ADR 0039, #830). [Loader.Load] collapses concurrent misses within one
          process; LoadLeased also takes a named lease, on a miss, from a
          lock.Locker the processes share — the lock domain's file locker on one
          machine, whose lease dies with the process holding it — so that one
          process at a time fills a key.

          What the others then get depends on what they share. A chain whose far
          tier every process reaches answers the waiting ones with the value the
          holder stored: the origin sees ONE fill. A memory store alone shares no
          value: the lease then only takes turns — one fill at a time, never two at
          once, each process filling its own copy once the holder has finished.
        methods:
          - doc: |-
              LoadLeased is Load with a lease named "cache:" + key taken from locker
              on a miss, after the in-process collapse. The holder reads the store
              again, fills, stores and releases. A process that finds the lease held
              fills nothing: it reads the store again every poll step of the store's
              clock until the holder's value lands or its own ctx ends — or until the
              lease comes free without a value (the holder failed, died, or let a lease
              that can expire lapse), when it takes the lease and reads once more
              before filling. A nil locker makes it Load. A locker that cannot answer
              fails the call with [CacheLeaseFailed]. A lease that can expire is not
              renewed during the fill: its lifetime must outlast the fill.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fill
                type: Fill[V]
              - name: locker
                type: lock.Locker
            name: LoadLeased
            out:
              - type: V
              - type: error
        name: Leaser
        typeParams:
          - constraint: any
            name: V
    sentinels:
      - var:
          - code: CodeCacheMisconfigured
            doc: |-
              CacheMisconfigured is returned by a store CONSTRUCTOR whose
              configuration it cannot honour.

              It is ADR 0031's refuse half. A capacity is the caller's intent and any
              number the SDK picked would be arbitrary, so a non-positive one is
              refused rather than clamped — and refusing at construction is what keeps
              the other outcome off the table: a cache built with an unusable
              configuration still answers every call correctly, it just never HOLDS
              anything, and nothing downstream can tell the difference between that
              and a genuinely cold workload.
            exit: CONFIG
            name: CacheMisconfigured
            private: "core/data/cache: a store constructor received a capacity or a default TTL it cannot honour; the fields name the option and the value"
            public: The cache cannot be built from the given configuration
            reason: CACHE_MISCONFIGURED
          - code: CodeCacheBackendFailed
            doc: |-
              CacheBackendFailed is returned when the store itself could not serve the
              operation. A miss is NOT this — a miss is (zero, false, nil).
            name: CacheBackendFailed
            private: "core/data/cache: a store failed for a reason of its own rather than reporting a miss; the fields name the operation and the key"
            public: The cache backend could not serve the operation
            reason: CACHE_BACKEND_FAILED
          - code: CodeCacheFillFailed
            doc: |-
              CacheFillFailed is returned by Loader.Load when the caller's fill fails
              and its error carries no SDK code of its own.

              Nothing is stored. Caching a failure would turn one bad minute at the
              origin into a full TTL of bad answers, served confidently, to every
              caller — the failure mode a cache is least able to explain afterwards.
            name: CacheFillFailed
            private: "core/data/cache: a Loader.Load fill returned an error carrying no SDK code; the fields name the key"
            public: The cache fill function failed and nothing was stored
            reason: CACHE_FILL_FAILED
          - code: CodeCacheEntryRejected
            doc: |-
              CacheEntryRejected is returned by Set for an entry the store refuses:
              an empty key, an empty tag, or a negative TTL other than NoExpiry.

              Refusing is the point. An empty key is fetchable only by another empty
              key, an empty tag names a set nobody can ask for, and a negative TTL
              would be read by the underlying primitive as "no expiry" — so the three
              silent outcomes of accepting them are an entry nobody meant to write, an
              entry nobody can invalidate, and an entry that never goes away.
            exit: DATAERR
            name: CacheEntryRejected
            private: "core/data/cache: Set received an empty key, an empty tag, or a negative TTL that is not cache.NoExpiry; the fields name the offending part"
            public: The cache entry is not storable as given
            reason: CACHE_ENTRY_REJECTED
          - code: CodeCacheAbsent
            doc: |-
              CacheAbsent is what [Absent] records for a cause that carries no SDK code
              of its own: the key does not exist at the origin, and the store keeps that
              answer for the lifetime the mark carries.
            exit: DATAERR
            name: CacheAbsent
            private: "core/data/cache: a fill answered that the key does not exist at the origin; the store keeps a negative entry for the absent_ttl_ns field's lifetime"
            public: The requested entry does not exist
            reason: CACHE_ABSENT
          - code: CodeCacheChainMisconfigured
            doc: |-
              CacheChainMisconfigured is returned by NewChain for a tier set it cannot
              honour.

              The interesting refusal is the third one. Every tier must implement
              [EntryFetcher] and [Tagger], and that is checked ONCE, at construction,
              rather than per call. The reason is the whole point of tagging:
              promoting a value into a nearer tier WITHOUT its tags produces a copy
              that InvalidateTag can no longer reach, so the invalidation reports
              success, the far tier forgets the entry, and the near tier keeps
              serving it until its TTL runs out. A tag invalidation that silently
              misses one copy is worse than one that was never offered — so the chain
              refuses to be built rather than degrade at the moment nobody is looking.
            exit: CONFIG
            name: CacheChainMisconfigured
            private: "service/data/cache: NewChain received fewer than two tiers, a nil tier, or a tier that does not implement EntryFetcher and Tagger; the fields name the position and the missing capability"
            public: The cache chain cannot be built from the given tiers
            reason: CACHE_CHAIN_MISCONFIGURED
          - code: CodeCacheTierFailed
            doc: |-
              CacheTierFailed is returned when a chained operation failed inside one
              tier. Its fields name the tier's position and the operation, because a
              chain's caller holds one Store and would otherwise have no way to tell
              which of two backends broke.
            name: CacheTierFailed
            private: "service/data/cache: one tier of a chained store returned an error; the fields name the tier position, the operation and the key"
            public: A tier of the cache chain could not serve the operation
            reason: CACHE_TIER_FAILED
          - code: CodeCacheLeaseFailed
            doc: |-
              CacheLeaseFailed is returned by LoadLeased when its locker could not
              answer — the lease on the key could be neither taken nor given up. The
              locker's own error is kept: errors.Is still finds it.
            name: CacheLeaseFailed
            private: "service/data/cache: the locker handed to LoadLeased returned an error; the fields name the operation (acquire or release) and the key"
            public: The cache could not coordinate the fill with other processes
            reason: CACHE_LEASE_FAILED
    types:
      - doc: |-
          Fill computes the entry for a key that the cache does not hold. It is the
          caller's code: a database query, an HTTP call, a derivation.

          It is a FUNC port rather than a one-method interface, the shape
          internal/core already admits for resilience.Operation, scheduler.Job and
          validation.Constraint — and, per ADR 0039, a func type satisfies the
          no-widening rule structurally, because it cannot grow a method at all.
        name: Fill
        typeParams:
          - constraint: any
            name: V
        underlying: func(ctx context.Context) (EntryValue[V], error)
      - doc: |-
          EntryValue is what a caller stores: the value, how long it should live, and
          the tags by which it can later be invalidated in bulk.

          It is a VALUE — a store copies what it needs and never retains the slice the
          caller passed, so a caller may reuse or mutate its Tags slice afterwards.
        name: EntryValue
        struct:
          fields:
            - doc: Value is the payload.
              name: Value
              type: V
            - doc: |-
                TTL is how long the entry stays fetchable.

                  > 0        this exact lifetime
                  0          the store's configured default
                  [NoExpiry] no deadline at all

                Any other negative value is a mistake, not a third meaning, and is
                refused with [CacheEntryRejected] rather than reinterpreted.
              name: TTL
              type: time.Duration
            - doc: |-
                Tags label the entry for bulk invalidation. Order is not significant and
                duplicates are collapsed. An empty tag is refused: it names a set nobody
                can ask for, so accepting it would index the entry under a key that can
                only ever be reached by accident.

                Tags cost memory in the store's reverse index — see
                internal/service/data/cache/CLAUDE.md, which states the per-pair cost and
                measures it.
              name: Tags
              type: "[]string"
        typeParams:
          - constraint: any
            name: V
  - doc: |-
      Package cache — hosts the compile-time interface assertions, keeping them
      out of the production source so the runtime binary carries no
      diagnostic-only declarations.

      Package cache — the L1/L2 chain.

      Package cache — the NewChain constructor configuration.

      Package cache provides the concrete cache stores implementing
      internal/core/data/cache: a tagged, stampede-protected memory store over the
      kernel LRU+TTL primitive, and the chain that puts one store in front of
      another. Stdlib-only, cross-OS. ADR 0049.

      Package cache — the tagged, stampede-protected in-memory store.

      Package cache — what the underlying primitive actually stores.

      Package cache — the refusals every store shares, and the wrapping rule for
      a caller's fill error.

      Package cache — the two-way tag index behind InvalidateTag.

      Package cache — one level of a chained store.
    functions:
      - doc: |-
          NewChain puts each store in front of the next: tiers[0] is the nearest and
          is consulted first, the last is the authority.

          Every tier MUST implement [corecache.EntryFetcher] and [corecache.Tagger].
          That is checked here, once, and refused with
          [corecache.CacheChainMisconfigured] rather than discovered per call — see
          that sentinel for the reasoning.

          The returned value is a [corecache.Store] and also implements
          [corecache.EntryFetcher], [corecache.Tagger], [corecache.Loader],
          [corecache.Expirer], [corecache.BulkFetcher], [corecache.BulkSetter],
          [corecache.Refresher] and [corecache.Leaser]. A negative LeasePoll is
          refused with [corecache.CacheMisconfigured].

          IFACE-PLUGIN: the concrete chain stays unexported behind this constructor.
        in:
          - name: cfg
            type: ChainConfig
          - name: stores
            type: corecache.Store[V]
        name: NewChain
        out:
          - name: chain
            type: corecache.Store[V]
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: V
        variadic: true
      - doc: |-
          NewMemory builds an in-process cache store from cfg.

          The returned value is a [corecache.Store]. It also implements
          [corecache.EntryFetcher], [corecache.Tagger], [corecache.Loader],
          [corecache.Expirer], [corecache.BulkFetcher], [corecache.BulkSetter],
          [corecache.Refresher] and [corecache.Leaser]; reach them by type
          assertion, which is the ADR 0039 way a port grows without breaking anyone
          who implemented it.

          A non-positive MaxEntries is REFUSED, not defaulted. ADR 0031 splits on
          whether the SDK can supply a value without inventing the caller's
          requirement, and a cache capacity is the requirement: it is the whole
          statement of how much memory the caller is willing to spend. Worse, the
          value the primitive gives a zero — unbounded — is the dangerous reading, and
          it is dangerous twice over here, because an unbounded store also grows an
          unbounded tag index.

          IFACE-PLUGIN: the concrete store stays unexported behind this constructor.
        in:
          - name: cfg
            type: MemoryConfig
        name: NewMemory
        out:
          - name: store
            type: corecache.Store[V]
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: V
      - doc: |-
          NewWeighedMemory builds an in-process cache store bounded by MaxBytes as
          well as MaxEntries, each value measured by weigh when it is stored (#839).
          It is [NewMemory] in every other respect. A nil weigh, or a MaxBytes that is
          not positive, is refused with [corecache.CacheMisconfigured]: a weigher with
          no budget, or a budget with nothing to measure it, is a half-stated bound.
        in:
          - name: cfg
            type: MemoryConfig
          - name: weigh
            type: func(value V) int64
        name: NewWeighedMemory
        out:
          - name: store
            type: corecache.Store[V]
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: V
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corecache: github.com/kitsunium/sdk/internal/core/data/cache
      kcache: github.com/kitsunium/sdk/internal/kernel/collections/cache
    path: github.com/kitsunium/sdk/internal/service/data/cache
    types:
      - doc: |-
          ChainConfig parameterises [NewChain]. Its zero value builds a working chain:
          an observation hook, and the clock and step LoadLeased waits on.
        name: ChainConfig
        struct:
          fields:
            - doc: |-
                OnPromoteError, if non-nil, is called when a value served from a FAR
                tier could not be written into a nearer one.

                A failed promotion is not a failed read: the caller already has the
                value, and failing the call would turn a degraded cache into a degraded
                service. But it is also not nothing — a near tier that rejects every
                promotion is a tier that will never be used again, and with this hook nil
                that is completely invisible. Wire it.
              name: OnPromoteError
              type: func(key string, err error)
            - doc: |-
                Clock is what LoadLeased waits on between two reads while another
                process holds a key's lease. nil means clock.System. Nothing else in
                the chain reads time: every tier keeps its own clock.
              name: Clock
              type: clock.Timed
            - doc: |-
                LeasePoll is how often LoadLeased reads the chain again while another
                process holds a key's lease. 0 means 25ms, the file locker's own poll;
                negative is refused.
              name: LeasePoll
              type: time.Duration
      - doc: |-
          MemoryConfig parameterises [NewMemory].

          Its zero value is deliberately NOT a working cache: MaxEntries must be
          stated. See [NewMemory] for why that refusal, and not a default, is the
          right ADR 0031 half here.
        name: MemoryConfig
        struct:
          fields:
            - doc: |-
                MaxEntries caps the live entry count; the least-recently-used entry is
                evicted above it. It MUST be positive.
              name: MaxEntries
              type: int
            - doc: |-
                DefaultTTL applies to every entry whose own TTL is zero. Zero means the
                default is "no deadline", so entries leave only by eviction, by Delete,
                or by tag invalidation. Negative is refused.
              name: DefaultTTL
              type: time.Duration
            - doc: |-
                Clock is the time source, injectable so TTL is testable. nil means
                clock.System. Only the reading half of the port is required — a cache
                reads time (ADR 0039); LoadLeased alone waits, on Clock when it can wait
                (clock.System, a clock.ManualClock) and on clock.System otherwise. A
                clock.CoarseClock makes a TTL'd hit's clock read an atomic load, and
                every expiry late by up to its resolution.
              name: Clock
              type: clock.Clock
            - doc: |-
                Stripes splits the store into independent stripes, each with its own
                lock, its own share of MaxEntries and MaxBytes and its own tag index, so
                goroutines working on keys of different stripes never wait for one
                another. 0 means 1, one store as before; above MaxEntries (or a positive
                MaxBytes) it is held there, and above 1024 at 1024. Negative is refused.
              name: Stripes
              type: int
            - doc: |-
                MaxBytes bounds the summed weight of the live values, as measured by the
                weigher handed to [NewWeighedMemory]; entries are evicted above it as
                above MaxEntries, both bounds applying. 0 means no byte bound. An entry
                heavier than one stripe's share of it is refused with
                CACHE_ENTRY_REJECTED at Set. Negative is refused, and so is a positive
                MaxBytes given to [NewMemory], which has no weigher to measure it with.
              name: MaxBytes
              type: int64
            - doc: |-
                Policy is the eviction policy: least recently used (the zero), or
                S3-FIFO, which keeps a hot set through a scan.
              name: Policy
              type: kcache.Policy
            - doc: |-
                LeasePoll is how often LoadLeased reads the store again while another
                process holds a key's lease. 0 means 25ms, the file locker's own poll;
                negative is refused.
              name: LeasePoll
              type: time.Duration
  - doc: |-
      Package cache is the public facade for the SDK's caching, and it offers two
      surfaces because there are two different jobs.

      # The primitive: Cache[K,V]

      [Cache] is a generic LRU + TTL map — construct it, Set, Fetch, done. No
      port, no error surface, no vocabulary. Reach for it when you want a bounded
      map with expiry inside one component.

      	c := cache.New[string, int](cache.Config[string, int]{MaxEntries: 1024, DefaultTTL: time.Minute})
      	c.Set("answer", 42)
      	v, ok := c.Fetch("answer") // 42, true

      # The domain: Store[V]

      [Store] is the cache as an INTERFACE, with the three things a primitive
      deliberately does not have: invalidation by tag, protection against a
      stampede of concurrent misses, and the ability to put one store in front of
      another. Reach for it when a cache is part of your architecture rather than
      an implementation detail — when something else has to be able to invalidate
      what you cached, or when the thing behind the cache must not be hit N times
      the instant a hot key expires.

      	store, err := cache.NewMemory[Profile](cache.MemoryConfig{
      	    MaxEntries: 10_000,       // refused if zero — a capacity is your decision
      	    DefaultTTL: time.Minute,
      	})

      	loader, _ := store.(cache.Loader[Profile])
      	profile, err := loader.Load(ctx, key, func(ctx context.Context) (cache.Entry[Profile], error) {
      	    p, err := db.Profile(ctx, id)
      	    return cache.Entry[Profile]{Value: p, TTL: time.Minute, Tags: []string{"user:" + id}}, err
      	})

      	tagger, _ := store.(cache.Tagger)
      	removed, err := tagger.InvalidateTag(ctx, "user:"+id) // every entry derived from that user

      The two do not compete: the domain store is BUILT on the primitive, and
      [Cache] stays exactly what it was.

      # Fetch, not Get — on both surfaces

      A hit promotes the entry in the recency order and moves the counters, so a
      read MUTATES. Naming it Get would promise a purity neither surface offers,
      and in the domain store it takes a write lock for precisely that reason.

      # Stampede protection stops at the process boundary

      [Loader].Load guarantees ONE fill per key across every goroutine in THIS
      process. It does not coordinate across replicas. Ten instances of a service
      each running this still send ten concurrent requests to the origin when a
      hot key expires — so a fleet's worst-case origin load falls by the
      concurrency factor within an instance, not to one. Cross-process collapsing
      needs a shared lease, which is a distributed system and not something a
      cache can promise. Size the origin against the number of replicas, not
      against the number of requests.

      [Leaser].LoadLeased takes that lease, from a lock.Locker the processes
      share — the lock domain's file locker on one machine. Over a chain whose far
      tier every process reaches, the origin then sees one fill per key; over a
      memory store alone, which shares no value, the processes only take turns,
      one fill at a time.

      # Nothing across tiers is atomic

      [NewChain] is two independent stores, and there is no transaction between
      them. Every multi-tier operation has a window in which they disagree; the
      package chooses which side of that window is safer and says so, rather than
      implying a consistency it cannot deliver. See internal/service/data/cache's
      CLAUDE.md for each choice and its reason.
    facade:
      - const:
          - doc: |-
              NoExpiry is the [Entry].TTL that stores an entry with no deadline.

              It is deliberately distinct from the zero TTL, which means "use the store's
              default". A store with a one-minute default holding one entry that must
              never expire is a real combination, and reading both meanings out of 0 would
              make the second one unsayable.
            name: NoExpiry
            reexport: corecache.NoExpiry
            type: time.Duration
            typed: true
            value: "-1"
      - alias:
          - doc: Cache is the public alias for the generic LRU+TTL primitive.
            name: Cache
            target: kcache.Cache[K, V]
            typeParams:
              - constraint: comparable
                name: K
              - constraint: any
                name: V
      - alias:
          - doc: Config is the public alias for the primitive's constructor configuration.
            name: Config
            target: kcache.Config[K, V]
            typeParams:
              - constraint: comparable
                name: K
              - constraint: any
                name: V
      - alias:
          - doc: Stats is the public alias for the primitive's counters snapshot.
            name: Stats
            target: kcache.StatsValue
      - func:
          doc: New builds a [Cache] from cfg. A nil cfg.Clock defaults to the system clock.
          forward: kcache.NewCache
          in:
            - name: cfg
              type: Config[K, V]
          name: New
          out:
            - type: "*Cache[K, V]"
          typeParams:
            - constraint: comparable
              name: K
            - constraint: any
              name: V
      - alias:
          - doc: |-
              Entry is what a caller stores: the value, its lifetime, and the tags by
              which it can later be invalidated in bulk.
            name: Entry
            target: corecache.EntryValue[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Store is the cache port: Fetch, Set, Delete.

              The method set is FROZEN at three. New capabilities arrive as SIBLING
              interfaces you reach by type assertion — [EntryFetcher], [Tagger] and
              [Loader] — because this alias publishes the interface, Go interfaces are
              structural, and a fourth method would break every downstream implementer at
              compile time with no deprecation window.
            name: Store
            target: corecache.Store[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              EntryFetcher is the sibling that returns the whole entry — value, REMAINING
              TTL, tags — rather than only the value. Both stores built here implement it.
            name: EntryFetcher
            target: corecache.EntryFetcher[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Tagger is the sibling for invalidating every entry carrying a tag.

              The cost is proportional to the entries carrying the tag, not to the size of
              the store — measured in internal/service/data/cache/BENCH.md at two store sizes.
            name: Tagger
            target: corecache.Tagger
      - alias:
          - doc: |-
              Fill computes the entry for a key the cache does not hold: a query, a
              request, a derivation. It is your code.
            name: Fill
            target: corecache.Fill[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Loader is the sibling that fills a miss while collapsing concurrent misses
              on one key into a single fill — within one process, and not across replicas.
              See the package documentation before sizing an origin against it.
            name: Loader
            target: corecache.Loader[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Expirer is the sibling that removes a store's expired entries on demand.
              Expiry is otherwise lazy; the store starts no goroutine, so call Expire on
              your own ticker or scheduler.
            name: Expirer
            target: corecache.Expirer
      - alias:
          - doc: |-
              BulkFetcher is the sibling that reads many keys in one call — one lock per
              stripe, one pass per tier.
            name: BulkFetcher
            target: corecache.BulkFetcher[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              BulkSetter is the sibling that stores many entries in one call, validating
              every entry before storing any.
            name: BulkSetter
            target: corecache.BulkSetter[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Refresher is the sibling that refreshes a hot entry before it expires:
              the value is served from the cache while one background fill replaces it.
            name: Refresher
            target: corecache.Refresher[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Leaser is the sibling that carries stampede protection across
              processes: on a miss it takes a lease named after the key from a
              lock.Locker the processes share, so one of them fills while the others
              wait for its value. A memory store alone shares no value: there the
              lease only takes turns, one fill at a time.
            name: Leaser
            target: corecache.Leaser[V]
            typeParams:
              - constraint: any
                name: V
      - alias:
          - doc: |-
              Policy chooses the entry a full cache evicts: [PolicyLRU], the zero, or
              [PolicyS3FIFO].
            name: Policy
            target: kcache.Policy
      - const:
          - doc: PolicyLRU evicts the least-recently-used entry. It is the zero Policy.
            name: PolicyLRU
            reexport: kcache.PolicyLRU
            type: Policy
            typed: true
            value: "0"
          - doc: |-
              PolicyS3FIFO admits new keys into a small probationary queue and keeps
              the ones hit there in a main one, so a one-time scan does not flush the
              hot set.
            name: PolicyS3FIFO
            reexport: kcache.PolicyS3FIFO
            type: Policy
            typed: true
            value: "1"
      - alias:
          - doc: |-
              Striped spreads keys over independent [Cache]s, each behind its own lock,
              dividing the bounds between them.
            name: Striped
            target: kcache.Striped[K, V]
            typeParams:
              - constraint: comparable
                name: K
              - constraint: any
                name: V
      - func:
          doc: |-
            NewStriped builds a [Striped] of the given number of stripes (below 1 is
            1) from cfg, whose bounds it divides between them. A nil hash uses
            hash/maphash over a seed of its own.
          forward: kcache.NewStriped
          in:
            - name: cfg
              type: Config[K, V]
            - name: stripes
              type: int
            - name: hash
              type: func(key K) uint64
          name: NewStriped
          out:
            - type: "*Striped[K, V]"
          typeParams:
            - constraint: comparable
              name: K
            - constraint: any
              name: V
      - func:
          doc: |-
            Absent marks a fill's failure as an answer to cache: the key does not exist
            at the origin. A store's Load keeps a negative entry for ttl and returns the
            same error — errors.Is still finds cause — without calling the fill again.
            A ttl that is not positive caches nothing.
          forward: corecache.Absent
          in:
            - name: cause
              type: error
            - name: ttl
              type: time.Duration
          name: Absent
          out:
            - type: error
      - func:
          doc: AbsentTTLOf returns the lifetime [Absent] put on err, and whether it put one.
          forward: corecache.AbsentTTLOf
          in:
            - name: err
              type: error
          name: AbsentTTLOf
          out:
            - name: ttl
              type: time.Duration
            - name: marked
              type: bool
      - alias:
          - doc: |-
              MemoryConfig parameterises [NewMemory]. Its zero value is NOT a working
              cache — MaxEntries must be stated, and is refused rather than defaulted.
            name: MemoryConfig
            target: svccache.MemoryConfig
      - alias:
          - doc: ChainConfig parameterises [NewChain].
            name: ChainConfig
            target: svccache.ChainConfig
      - func:
          doc: |-
            NewMemory builds an in-process store: an LRU with TTL, a tag index, and
            stampede protection on Load.

            The returned [Store] also implements [EntryFetcher], [Tagger] and [Loader].

            A non-positive MaxEntries is REFUSED, not defaulted. A capacity is the whole
            statement of how much memory you are willing to spend, so any number chosen
            for you would be arbitrary — and the value a zero would naturally mean,
            unbounded, is the dangerous one.
          forward: svccache.NewMemory[V]
          in:
            - name: cfg
              type: MemoryConfig
          name: NewMemory
          out:
            - name: store
              type: Store[V]
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: V
      - func:
          doc: |-
            NewWeighedMemory builds an in-process store bounded by MaxBytes as well as
            MaxEntries, each value measured by weigh when it is stored. An entry
            heavier than a stripe's share of MaxBytes is refused at Set.
          forward: svccache.NewWeighedMemory[V]
          in:
            - name: cfg
              type: MemoryConfig
            - name: weigh
              type: func(value V) int64
          name: NewWeighedMemory
          out:
            - name: store
              type: Store[V]
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: V
      - func:
          doc: |-
            NewChain puts each store in front of the next: tiers[0] is consulted first,
            the last is the authority. A hit in a far tier is promoted into every nearer
            one, carrying its REMAINING TTL and its tags.

            Every tier must implement [EntryFetcher] and [Tagger], checked here and
            refused rather than discovered per call: a value promoted without its tags
            is one [Tagger] can no longer reach, so an invalidation would report success
            while a nearer tier kept serving the entry.
          forward: svccache.NewChain
          in:
            - name: cfg
              type: ChainConfig
            - name: tiers
              type: Store[V]
          name: NewChain
          out:
            - name: store
              type: Store[V]
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: V
          variadic: true
      - var:
          - doc: |-
              Misconfigured is returned by a store constructor whose configuration it
              cannot honour — a non-positive capacity, a negative default TTL.
            name: Misconfigured
            reexport: corecache.CacheMisconfigured
            type: "*errs.Error"
          - doc: |-
              BackendFailed is returned when a store could not serve an operation. A
              MISS is not this: a miss is (zero, false, nil).
            name: BackendFailed
            reexport: corecache.CacheBackendFailed
            type: "*errs.Error"
          - doc: |-
              FillFailed is returned by Load when your fill fails and its error
              carries no SDK code of its own. Nothing is stored: caching a failure
              turns one bad minute at the origin into a full TTL of confident wrong
              answers.
            name: FillFailed
            reexport: corecache.CacheFillFailed
            type: "*errs.Error"
          - doc: |-
              EntryRejected is returned by Set for an entry no store can represent —
              an empty key, an empty tag, or a negative TTL other than [NoExpiry].
            name: EntryRejected
            reexport: corecache.CacheEntryRejected
            type: "*errs.Error"
          - doc: |-
              ChainMisconfigured is returned by [NewChain] for a tier set it cannot
              honour.
            name: ChainMisconfigured
            reexport: corecache.CacheChainMisconfigured
            type: "*errs.Error"
          - doc: |-
              TierFailed is returned when a chained operation failed inside one tier.
              Its fields name the position, because a chain's caller holds one Store
              and would otherwise have no way to tell which backend broke.
            name: TierFailed
            reexport: corecache.CacheTierFailed
            type: "*errs.Error"
          - doc: |-
              LeaseFailed is returned by LoadLeased when its locker could not answer:
              the lease on the key could be neither taken nor given up.
            name: LeaseFailed
            reexport: corecache.CacheLeaseFailed
            type: "*errs.Error"
    imports:
      corecache: github.com/kitsunium/sdk/internal/core/data/cache
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      kcache: github.com/kitsunium/sdk/internal/kernel/collections/cache
      svccache: github.com/kitsunium/sdk/internal/service/data/cache
    path: github.com/kitsunium/sdk/pkg/v1/data/cache
