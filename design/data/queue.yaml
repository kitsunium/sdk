apiVersion: kit.kitsunium/design/v2
domain: data/queue
packages:
  - codes:
      - const:
          - doc: |-
              CodeQueueMisconfigured identifies a PolicyValue field a broker cannot
              honour, refused at construction rather than at first use.
            name: CodeQueueMisconfigured
            note: "range: 0.2.23.0 - 0.2.23.255"
            value: "0x00_02_17_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeMessageTooLarge identifies a Publish whose payload exceeds
              PolicyValue.MaxMessageBytes.
            name: CodeMessageTooLarge
            value: "0x00_02_17_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownReceipt identifies an Ack, Nack or Extend naming a lease this
              broker never issued, or a receipt it cannot parse.
            name: CodeUnknownReceipt
            value: "0x00_02_17_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLeaseExpired identifies an Ack, Nack or Extend on a lease that has
              lapsed. The call changed nothing and the message is elsewhere.
            name: CodeLeaseExpired
            value: "0x00_02_17_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidBatchSize identifies a Receive or DeadLetters asked for a
              non-positive number of messages.
            name: CodeInvalidBatchSize
            value: "0x00_02_17_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotRetryable identifies a handler's failure no retry can fix. DoNotRetry
              adds it to the wrap trail of the handler's own cause, so errs.HasCode finds
              it while the cause stays the origin a dead letter records (ADR 0151).
            name: CodeNotRetryable
            value: "0x00_02_17_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeDeadLetterNotFound identifies a replay or a deletion naming a dead
              letter the store does not hold.
            name: CodeDeadLetterNotFound
            value: "0x00_02_17_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeQueueBackendFailed identifies an operation a durable broker depends on
              that its storage refused: a filesystem call the operating system refused,
              or a statement the SQL broker's database did not complete.
            name: CodeQueueBackendFailed
            note: |-
              range: 0.3.53.0 - 0.3.53.255 — the brokers' and the consumer engine's own
              codes, allocated by the service layer (LL = 3) and declared here since ADR
              0160: a code keeps the value its layer allocated when its declaration moves.
            value: "0x00_03_35_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeQueueDirectoryUnusable identifies a queue directory that cannot be
              prepared, is not a directory, or is writable by accounts that must not be
              able to inject or remove messages.
            name: CodeQueueDirectoryUnusable
            value: "0x00_03_35_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeConsumerMisconfigured identifies a ConsumerConfig the engine refuses:
              no Handler, or a Handler whose author has not asserted that it is
              idempotent under at-least-once delivery.
            name: CodeConsumerMisconfigured
            value: "0x00_03_35_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerPanicked identifies a handler whose call panicked; the engine
              recovered it, nacked the message, and kept consuming.

              There is deliberately no companion CodeHandlerFailed. A handler that merely
              returns an error hands that error to Nack UNMODIFIED — see Consume's guard
              — because the destination is a dead-letter record whose structured fields
              already say "a handler failed", and an engine verdict wrapped around the
              cause would displace the reason an investigator needs.
            name: CodeHandlerPanicked
            value: "0x00_03_35_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeSQLQueueMisconfigured identifies an SQLConfig the SQL broker refuses at
              construction: no transactor, one it cannot join a transaction of, a dialect
              it cannot spell, or a table name it cannot interpolate safely (ADR 0151).
            name: CodeSQLQueueMisconfigured
            value: "0x00_03_35_05"
        type: errs.Code
    constants:
      - doc: |-
          DefaultMaxMessageBytes bounds a payload when [PolicyValue.MaxMessageBytes]
          is left at zero. One mebibyte is the value the industry converged on —
          NATS's default, Kafka's default `message.max.bytes`, four times SQS's
          maximum — and the reason it is a CLAMP rather than a refusal is that its
          zero has exactly one sensible reading and the wrong answer is survivable:
          too small is a refused publish at the call site that made the mistake, and
          the alternative to any bound at all is one producer filling a disk.
        name: DefaultMaxMessageBytes
        type: int
        value: 1 << 20
      - doc: |-
          MaxDeadlineOffset is the furthest ahead of now a deadline built from a
          policy may lie: the ceiling on [PolicyValue.VisibilityTimeout] and
          [PolicyValue.RetryDelay], REFUSED above it rather than clamped.

          It is not a judgement about how long a lease should last — ADR 0054 argues
          against even an hour. It is the representable range, with a margin. Every
          deadline is now plus one of these durations, and a durable broker records it
          as Unix nanoseconds in an int64 — that is the form a filename carries, and
          time.Time.UnixNano's own range — which ends on 2262-04-11. Past that instant
          the number wraps negative, and a name carrying it cannot be read back: the
          message it names is never reclaimed and never delivered, and its receipt
          reads [UnknownReceipt]. math.MaxInt64, the value somebody reaches for to
          mean "never", is 292 years, so it wraps a deadline set today.

          A century keeps every deadline representable for any clock reading before
          2162, and no lease or retry delay has a reading anywhere near it. Validate
          has no clock, so a fixed ceiling is the only bound it can check; an
          implementation that computes a deadline from its own clock at runtime — a
          lease extension, whose duration Validate never sees — checks the instant
          itself.
        name: MaxDeadlineOffset
        type: time.Duration
        value: "3153600000000000000"
    doc: |-
      Package queue — the ADR 0039 capability siblings of the frozen [Broker]
      port, and the dead-letter record one of them returns.

      Package queue — range 0.2.23.* (ADR 0054 core/data/queue block), and the
      brokers' and the consumer engine's 0.3.53.* (ADR 0054 service/data/queue
      block, declared here since ADR 0160).

      Package queue — the two ADR 0039 siblings that act on the dead-letter store:
      sending a message there at once, and deciding what becomes of one there.

      Package queue — declares the sentinel *errs.Error port outcomes, and the
      implementation outcomes of the brokers and the consumer engine in
      internal/service/data/queue (ADR 0160: every code is declared in the core,
      at the service's path). Each var's name equals its errs.Define Reason in
      SCREAMING_SNAKE form.

      Package queue — hosts the three values that travel between a producer, a
      broker and a consumer: the message, the lease, and the delivery that pairs
      them.

      Package queue — hosts the delivery policy every broker is configured with,
      and the guard both implementations run so that the two refuse identical
      inputs identically.

      Package queue declares the SDK's ASYNCHRONOUS, DURABLE message queue port:
      the [Broker] a producer publishes into and a consumer leases from, the
      [Handler] that processes one delivery, and the values that carry a message,
      its lease and its eventual dead letter. A core sibling admitted by ADR 0054.

      # queue is not events, and the line was drawn before this package existed

      ADR 0053 §D1 wrote the frontier down while queue was still hypothetical,
      precisely so it could not be renegotiated by whoever wrote it. This package
      is the right-hand column, on every axis:

      	                     | events                   | queue (this package)
      	---------------------|--------------------------|--------------------------
      	Scope                | one process              | many processes
      	Timing               | synchronous              | asynchronous
      	Goroutine            | the publisher's          | a consumer's
      	Transaction          | the publisher's          | its own
      	Durability           | none                     | the point of it
      	Retries / DLQ        | none                     | the point of it
      	Process dies in      | the event never happened | the message is still
      	flight               |                          | there

      A caller who wants "several things happen right now, on my goroutine,
      inside my transaction" wants internal/core/app/events. This package will not
      give them a faster version of it: [Broker.Publish] costs a disk flush,
      because that flush IS the guarantee.

      # A publication may join the publisher's transaction; the handler never does

      The Transaction row is about where the WORK runs, and a handler always runs
      in a transaction of its own, on a consumer's goroutine. What a broker over
      the publisher's own database may do is make the MESSAGE part of the
      publisher's transaction (ADR 0151): published inside it, the message exists
      if and only if that transaction commits — the transactional outbox, and the
      only way a message and the write that caused it are never one without the
      other. That moves no row of the table: the handler still runs later,
      elsewhere, and in its own transaction.

      # The delivery guarantee is AT-LEAST-ONCE, and the type says so

      Exactly-once delivery does not exist over a transport. What exists is
      at-least-once delivery plus an idempotent consumer, and every system that
      advertises the first is selling the second with the consumer's half left as
      an exercise. This port therefore promises at-least-once and puts the
      consequence in the signature rather than in a paragraph:
      [DeliveryValue.Deliveries] is a field of every delivery, it counts from 1,
      and a value greater than 1 means this consumer — or another one, in another
      process — has already seen these bytes.

      A message is removed at ACKNOWLEDGEMENT, never at read. [Broker.Receive]
      LEASES a message: it becomes invisible to every other consumer until
      [PolicyValue.VisibilityTimeout] elapses. If the consumer acknowledges, the
      message is gone. If the consumer dies — SIGKILL, a power cut, an OOM — it
      never acknowledges, the lease lapses, and the message is delivered again
      with Deliveries incremented. That is the entire mechanism, and it is why
      the guarantee is at-least-once and not at-most-once.

      # What this port does NOT guarantee

        - **Exactly-once.** See above. Make the handler idempotent; the SDK's
          consumer engine (internal/service/data/queue.Consume) makes you assert that
          in code.
        - **Order under retry.** A queue with one consumer and no failures
          delivers in publication order. A retried message becomes visible again
          LATER than messages published after it, so a single failure reorders
          the stream — and more than one consumer removes ordering entirely.
          There is no per-key ordering here; see the ADR's Deferred section.
        - **Durability beyond what fsync actually does.** An implementation that
          flushes has done everything a process can do; a lying disk cache, a
          virtualised host that acknowledges early, or a filesystem mounted with
          barriers off will still lose an acknowledged write, and no library can
          detect that.

      # Layers

      The three concrete brokers — one in memory, one on the filesystem, one in a
      SQL database — the consumer engine, and the dead-letter record live in
      internal/service/data/queue. This package owns the contract, the domain values,
      the policy and its guard, and the typed sentinels a refusal carries.

      Package queue — the failure a handler reports when no retry can fix it.

      Package queue — the ADR 0039 sibling that lets a consumer sleep until there
      may be work, and the value it answers with (ADR 0104).
    functions:
      - doc: |-
          DoNotRetry marks cause as a failure no retry can fix, so the consumer engine
          dead-letters the message at once instead of handing it back for another
          attempt (ADR 0151).

          	var order Order
          	if err := json.Unmarshal(d.Message.Payload, &order); err != nil {
          		return queue.DoNotRetry(err) // the same bytes will never decode
          	}

          It is for a failure that belongs to the MESSAGE — a payload that does not
          decode, a reference to something since deleted, a request the handler will
          refuse however often it is asked — and never to the moment: a downstream
          that is down, a lock that is held, a deadline that passed are what retries
          are for. Retrying the first kind spends [PolicyValue.MaxDeliveries] leases
          and retry delays on an outcome already known, and keeps the dead letter an
          operator needs to see out of the store for as long.

          The mark is an errs.Wrap onto cause, so what a dead letter records of the
          failure is unchanged: an SDK error keeps its own Reason, Code and Public —
          origin wins, and [CodeNotRetryable] joins only its wrap trail — while a
          cause that is not an SDK error, or no cause at all, records [NotRetryable]
          itself, whose Public says what happened. Recognise the mark with
          errs.HasCode(err, CodeNotRetryable); errors.Is(err, NotRetryable) answers
          only where NotRetryable is the origin.

          The engine reaches the broker's [Rejecter] for it. A broker without that
          sibling is nacked as before, so the message is retried until
          MaxDeliveries and dead-lettered with the same cause: the shortcut is lost,
          never the message. A panic is never read as the mark — the recovered value
          travels as a field of the engine's own verdict, not as its origin.
        in:
          - name: cause
            type: error
        name: DoNotRetry
        out:
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/queue
    ports:
      - doc: |-
          DeadLetterReader reads the messages a broker gave up on.

          It is a SIBLING of [Broker] reached by type assertion, never a fifth method
          on it, because reading the dead letters back is a capability and not every
          broker has one: a connector onto a third-party system usually dead-letters
          into a second queue that is read with the same [Broker] interface, and one
          that dead-letters into an operator's console cannot return anything at all.
          The three brokers in internal/service/data/queue implement it.

          	if reader, ok := broker.(queue.DeadLetterReader); ok {
          		dead, err := reader.DeadLetters(ctx, 100)
          	}
        methods:
          - doc: |-
              DeadLetters returns up to max dead letters, oldest first. It does NOT
              remove them: a dead letter is evidence, and a read that consumed it
              would make the second investigator's job impossible. Removing one is a
              decision, and [DeadLetterManager] is where it is made.

              max must be positive ([InvalidBatchSize]).
            in:
              - name: ctx
                type: context.Context
              - name: max
                type: int
            name: DeadLetters
            out:
              - type: "[]DeadLetterValue"
              - type: error
        name: DeadLetterReader
      - doc: |-
          LeaseExtender renews a lease a handler is still working under.

          It is the honest answer to the one question [PolicyValue.VisibilityTimeout]
          cannot settle: the timeout must be longer than the slowest handler, and the
          slowest handler is not known in advance. Rather than inviting a caller to
          set an hour-long visibility timeout — which turns every consumer crash into
          an hour of silence — a handler that legitimately needs longer says so.

          It is a sibling for the same reason [DeadLetterReader] is: a broker over a
          transport with no renewal verb cannot implement it, and the assertion is
          how a caller finds that out. The three brokers in internal/service/data/queue
          implement it.
        methods:
          - doc: |-
              Extend renews the lease named by receipt for a further by, measured
              from now, and returns the lease that replaces it.

              It returns a NEW [LeaseValue] — a new receipt included — and the old
              receipt is void from that moment. That is not ceremony: an
              implementation whose lease deadline lives in a durable name can only
              change it by replacing the name, and a receipt that silently kept
              meaning something after the thing it named had moved would be the one
              bug this whole domain is built to avoid.

              A lapsed lease is [LeaseExpired] and is NOT renewed, even when no
              other consumer has taken the message yet: expiry is a deadline, not
              "until somebody else wants it". The handler that asks and is refused
              has learnt that its work is now a duplicate, which is exactly when it
              needed to know.

              A non-positive by is [QueueMisconfigured]: the two readings of zero —
              "lapse now" and "never lapse" — are opposites and both harmful. So is a
              by whose deadline reaches past what a durable implementation can record
              (2262, Unix nanoseconds): it is refused before anything moves, and the
              lease the caller holds stays valid. Validate never sees this duration,
              so [MaxDeadlineOffset] cannot bound it; the instant itself is checked.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: by
                type: time.Duration
            name: Extend
            out:
              - type: LeaseValue
              - type: error
        name: LeaseExtender
      - doc: |-
          Rejecter dead-letters a leased message at once, with the cause that
          condemned it, whatever its delivery count.

          It is the broker's half of a handler saying "do not retry" — [DoNotRetry]
          is the handler's — and internal/service/data/queue.Consume joins the two: a
          handler whose failure carries [CodeNotRetryable] is rejected rather than
          nacked, so a payload that will never decode reaches the dead-letter store
          on its first failure instead of its MaxDeliveries-th, and an operator sees
          it one lease and no retry delay later.

          It is a sibling of [Broker] for the reason [DeadLetterReader] is: a
          connector onto a system with no in-band dead-letter move cannot implement
          it, and the engine falls back to Nack for such a broker — the message is
          then retried until MaxDeliveries and dead-lettered with the same cause, so
          the shortcut is lost and never the message. The three brokers in
          internal/service/data/queue implement it.
        methods:
          - doc: |-
              Reject moves the leased message named by receipt to the dead-letter
              store with cause, recorded as [Broker.Nack] records the cause of a
              message that ran out of attempts: its Reason, its dotted-quad Code and
              its wire-safe Public half, never the Private one. The dead letter's
              Deliveries is the count the message had, which may be below
              [PolicyValue.MaxDeliveries].

              A lapsed receipt is [LeaseExpired] and one this broker cannot read is
              [UnknownReceipt], exactly as [Broker.Ack] refuses them; neither moves
              anything.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: cause
                type: error
            name: Reject
            out:
              - type: error
        name: Rejecter
      - doc: |-
          DeadLetterManager puts a dead letter back into its queue, or deletes it.

          Reading the store ([DeadLetterReader]) is evidence and never changes it;
          these two calls are the decisions an operator takes after reading it — the
          failure was fixed downstream, so the message is replayed; the message is
          obsolete, so it is deleted. They take the dead letter's [MessageValue].ID,
          the identifier DeadLetters returned and the failing consumer logged.

          A sibling of [Broker] for the reason [DeadLetterReader] is. The three
          brokers in internal/service/data/queue implement it.

          	if manager, ok := broker.(queue.DeadLetterManager); ok {
          		err := manager.ReplayDeadLetter(ctx, dead.Message.ID)
          	}
        methods:
          - doc: |-
              ReplayDeadLetter moves the dead letter id back into the queue, visible
              at once, with its delivery count reset: its next delivery counts 1 and
              it gets [PolicyValue.MaxDeliveries] attempts again. It keeps its ID, its
              payload and its EnqueuedAt, so the log lines of both its lives join on
              one identifier; the dead-letter record, its cause included, is gone once
              the message is queued again — log it first if it matters.

              An id the store does not hold is [DeadLetterNotFound], and nothing is
              queued. Two replays of one dead letter racing each other may both
              queue it on a broker that cannot tell them apart, which is a duplicate
              the at-least-once guarantee already permits; the brokers say which
              they are.
            in:
              - name: ctx
                type: context.Context
              - name: id
                type: string
            name: ReplayDeadLetter
            out:
              - type: error
          - doc: |-
              DeleteDeadLetter removes the dead letter id for good, payload, cause
              and all. It is the only call in the domain that destroys a message
              without its consumer's acknowledgement, and it is never made by the
              SDK itself. An id the store does not hold is [DeadLetterNotFound].
            in:
              - name: ctx
                type: context.Context
              - name: id
                type: string
            name: DeleteDeadLetter
            out:
              - type: error
        name: DeadLetterManager
      - doc: |-
          Broker is one named queue: producers publish into it, consumers lease from
          it, and it — not the consumer — owns the delivery count and the decision to
          dead-letter. Implementations MUST be safe for concurrent use by multiple
          goroutines AND, where the implementation is durable, by multiple processes.

          IFACE-PLUGIN: the concrete brokers stay unexported behind their
          constructors in internal/service/data/queue.

          The interface is FROZEN at these four methods. pkg/v1/data/queue aliases it, Go
          interfaces are structural, and a fifth method would break every downstream
          implementation at compile time with no deprecation window (ADR 0039). A new
          capability arrives as a sibling interface reached by type assertion —
          [DeadLetterReader], [LeaseExtender], [Waker], [Rejecter] and
          [DeadLetterManager] are the ones that ship.

          # Why the BROKER owns the delivery count

          Because the consumer is the thing that dies. A count held by the consumer
          engine is lost by exactly the event the count exists to survive, so a
          process that crashes on every third message would retry forever and never
          dead-letter. The count travels with the message, in whatever the
          implementation's durable representation is, and the broker compares it
          against [PolicyValue.MaxDeliveries] on every [Broker.Nack] and on every
          lapsed lease.
        methods:
          - doc: |-
              Publish appends payload to the queue and returns the message the
              broker minted for it.

              It takes BYTES and not a [MessageValue] on purpose: the identifier and
              the enqueue instant are the broker's to assign, and a struct with
              fields the caller must leave blank is a struct that will eventually be
              filled in.

              When it returns nil, a durable implementation has flushed the message
              to its device: a crash one instruction later does not lose it. That
              flush is most of what the call costs — see the domain's BENCH.md. An
              implementation that joins the transaction ctx carries (ADR 0151) has
              instead made the message part of that transaction: it is durable, and
              receivable, once the transaction commits, and it never existed if the
              transaction rolls back.

              A payload larger than [PolicyValue.MaxMessageBytes] is
              [MessageTooLarge]; an empty payload is legitimate, because a message
              whose whole meaning is its arrival is a normal thing to send.
            in:
              - name: ctx
                type: context.Context
              - name: payload
                type: "[]byte"
            name: Publish
            out:
              - type: MessageValue
              - type: error
          - doc: |-
              Receive leases up to max messages and returns them. It does NOT block
              waiting for work: an empty queue yields an empty slice and a nil
              error, and polling is the caller's (see internal/service/data/queue.Consume,
              which does it for you).

              Each returned message is invisible to every other consumer until its
              [DeliveryValue.Lease] expires. A consumer that finishes acknowledges
              with [Broker.Ack]; a consumer that fails reports it with [Broker.Nack];
              a consumer that DIES does neither, and the lapsed lease is what makes
              the message reappear.

              max must be positive: [InvalidBatchSize] otherwise, rather than an
              empty slice forever from a consumer loop that spins and processes
              nothing.
            in:
              - name: ctx
                type: context.Context
              - name: max
                type: int
            name: Receive
            out:
              - type: "[]DeliveryValue"
              - type: error
          - doc: |-
              Ack removes the leased message permanently. It is the only call that
              does.

              A receipt whose lease has already lapsed is [LeaseExpired] and removes
              NOTHING: the message is back in the queue, or in the dead-letter
              store, and another consumer may already hold it. Reporting that is the
              same decision core/app/lock makes for a lapsed lease — a holder that lost
              its claim must not be able to end somebody else's turn, and must find
              out that it lost it.

              A receipt this broker never issued, or one it cannot parse, is
              [UnknownReceipt].
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
            name: Ack
            out:
              - type: error
          - doc: |-
              Nack reports that processing failed and hands the message back.

              The broker decides what happens next and reports it: the message
              becomes visible again after [PolicyValue.RetryDelay] — grown by
              [PolicyValue.MaxRetryDelay] when the policy asks for it — or, when it
              has now been delivered [PolicyValue.MaxDeliveries] times, it is moved to
              the dead-letter store together with cause. See [NackValue]. A failure
              no retry can fix is not nacked but rejected ([Rejecter]).

              cause is recorded. What is kept of it is the implementation's to
              document, and the rule this domain follows is CLAUDE.md rule 4: the
              wire-safe Public half and the dotted-quad code travel with the dead
              letter, the Private half stays in the failing process's log, and the
              message identifier is the join key between them. A nil cause is
              accepted and recorded as an unexplained failure, because a consumer
              that knows only "this did not work" must still be able to say so.

              A lapsed or unknown receipt is refused exactly as [Broker.Ack] refuses
              it.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: cause
                type: error
            name: Nack
            out:
              - type: NackValue
              - type: error
        name: Broker
      - doc: |-
          Waker tells an idle consumer when to look at a broker again, so it can
          sleep until there may be work instead of polling on a fixed cadence.

          It is a SIBLING of [Broker] for the reason [DeadLetterReader] is: waking is
          a capability, and a broker over a transport that cannot see its own
          publications — or one whose state lives in another process — has no honest
          answer to give. The consumer engine asks by type assertion and polls when
          the answer is no, so an implementation that omits it loses latency, never
          correctness.

          A wake is a HINT, in both directions. A signal may arrive with nothing to
          receive — another consumer took it — and work may appear with no signal at
          all: a durable broker cannot see a publication made by another process. So
          a consumer that uses it still polls, at whatever cadence bounds the second
          case, and treats the first as a cheap empty Receive.
        methods:
          - doc: |-
              Wake returns what an idle consumer should wait on. Call it BEFORE the
              Receive that may come back empty: a publication landing between that
              Receive and the wait closes the channel already handed out, so it is
              not missed.
            name: Wake
            out:
              - type: WakeValue
        name: Waker
    sentinels:
      - var:
          - code: CodeQueueMisconfigured
            doc: |-
              QueueMisconfigured refuses a PolicyValue a broker cannot honour — a
              zero with opposite readings, or a duration past MaxDeadlineOffset — and
              an Extend duration that is non-positive or reaches past what a durable
              broker can record. The "field" field names which value.

              It is a refusal and not a clamp for the fields whose zero has two
              opposite readings — see PolicyValue's documentation, which also names
              the two fields this sentinel deliberately does NOT guard.
            name: QueueMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: a policy field has no usable value and no default the SDK could invent; the field names which"
            public: The queue policy is not one this broker can honour
            reason: QUEUE_MISCONFIGURED
          - code: CodeMessageTooLarge
            doc: |-
              MessageTooLarge refuses a Publish whose payload exceeds the policy's
              bound. It is refused at the producer, because that is the only place
              the payload can still be made smaller — a consumer discovering it
              cannot do anything about it, and a broker accepting it lets one
              producer fill a device every other producer shares.

              Its fields carry the two SIZES and never the payload.
            name: MessageTooLarge
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: payload larger than PolicyValue.MaxMessageBytes; the fields carry both sizes, never the bytes"
            public: The message payload exceeds the queue's configured maximum size
            reason: MESSAGE_TOO_LARGE
          - code: CodeUnknownReceipt
            doc: |-
              UnknownReceipt refuses an acknowledgement naming a lease this broker
              never issued, or one whose encoding it cannot read.

              It is distinct from LeaseExpired on purpose. "This was yours and you
              were too slow" and "this was never yours" are different bugs: the
              first is a visibility timeout too short for the handler, the second is
              a receipt built by hand, kept across a restart of an in-memory broker,
              or handed to the wrong queue. Collapsing them would send every reader
              looking for the wrong one half the time.
            name: UnknownReceipt
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: receipt unparseable or never issued by this broker; the field carries no payload"
            public: The receipt does not name a lease this queue issued
            reason: UNKNOWN_RECEIPT
          - code: CodeLeaseExpired
            doc: |-
              LeaseExpired reports an Ack, Nack or Extend whose lease had already
              lapsed. NOTHING happened: the message is back in the queue or in the
              dead-letter store, and another consumer may already hold it.

              Reporting it beats returning nil, for the reason core/app/lock gives about
              releasing a lock one no longer holds: a holder that lost its claim must
              not be able to end somebody else's turn, and must find out that it lost
              it. A consumer that gets this has produced a duplicate — which the
              at-least-once guarantee permits — and the one thing it must not do is
              believe the work is finished.
            name: LeaseExpired
            options:
              - errs.WithExitCode(exitTempFail)
            private: "core/data/queue: visibility timeout elapsed before Ack/Nack/Extend; the message is queued again or dead-lettered"
            public: The lease on that message has expired and the acknowledgement was ignored
            reason: LEASE_EXPIRED
          - code: CodeInvalidBatchSize
            doc: |-
              InvalidBatchSize refuses a Receive or DeadLetters asked for a
              non-positive count.

              Returning an empty slice instead would be ADR 0031's inert policy: a
              consumer loop asking for zero messages spins forever, processes
              nothing, reports no error, and looks exactly like an idle queue.
            name: InvalidBatchSize
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: Receive/DeadLetters called with max <= 0, which would poll forever and deliver nothing"
            public: A batch size must be positive
            reason: INVALID_BATCH_SIZE
          - code: CodeNotRetryable
            doc: |-
              NotRetryable is the failure a handler reports when no retry can fix it:
              returned as it is, or — the usual form — added by DoNotRetry to the
              handler's own cause. The consumer engine recognises its code with
              errs.HasCode and dead-letters the message at once through a broker's
              Rejecter, instead of spending MaxDeliveries leases on an outcome
              already known.

              Returned bare, it is the cause the dead letter records. Added by
              DoNotRetry to an SDK error it is only a mark in the wrap trail, and the
              error's own Reason, Code and Public are what the dead letter keeps:
              origin wins (CLAUDE.md rule 6), which is the reason an investigator
              needs.
            name: NotRetryable
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/queue: a handler declared a failure no retry can fix; the engine dead-letters the message at once with the handler's own cause"
            public: The message cannot be processed and was dead-lettered without a retry
            reason: NOT_RETRYABLE
          - code: CodeDeadLetterNotFound
            doc: |-
              DeadLetterNotFound refuses a replay or a deletion naming a dead letter
              the store does not hold: one that never died, or was already replayed
              or deleted — by this caller or, concurrently, by another. Nothing moved.
            name: DeadLetterNotFound
            options:
              - errs.WithExitCode(exitNoInput)
              - errs.WithHTTPStatus(httpNotFound)
            private: "core/data/queue: the dead-letter store holds no message under the identifier; nothing was replayed or deleted"
            public: No dead letter has that identifier
            reason: DEAD_LETTER_NOT_FOUND
          - code: CodeQueueBackendFailed
            doc: |-
              QueueBackendFailed reports a refusal from a durable broker's storage:
              for the file broker the operating system's — an open, a rename, an
              unlink, a directory read or a flush — and for the SQL broker a
              statement its database did not complete.

              The cause stays in the chain, so a caller may still ask
              errors.Is(err, fs.ErrNotExist), reach the *fs.PathError, or reach a
              driver's own error with errors.As. Its fields name the operation and,
              where it is not the payload, the path or the table — never the message
              bytes; and the SQL broker WITHHOLDS the driver's text from every
              rendering, because a driver quotes the row a statement touched.
            name: QueueBackendFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/data/queue: a filesystem call or a SQL statement failed; the fields name the operation and where, never the payload"
            public: The queue's storage refused an operation
            reason: QUEUE_BACKEND_FAILED
          - code: CodeSQLQueueMisconfigured
            doc: |-
              SQLQueueMisconfigured refuses, at construction, an SQLConfig no SQL
              broker could run: a nil Transactor, one that is not a core/data/sql Joiner
              and Deferrer — without which a publication could neither join the
              caller's transaction nor wake a consumer after its commit — a dialect
              the SDK does not speak, or a table name that is not a lower-case SQL
              identifier the broker can interpolate safely. The "setting" and
              "problem" fields name which (ADR 0151).
            name: SQLQueueMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: the SQL broker's transactor, dialect or table is unusable; the fields name the setting and the problem"
            public: The SQL queue's configuration cannot be used
            reason: SQL_QUEUE_MISCONFIGURED
          - code: CodeQueueDirectoryUnusable
            doc: |-
              QueueDirectoryUnusable refuses a queue directory at CONSTRUCTION.

              A durable queue whose directory any account may write is a queue any
              account may inject work into or silently drain, and the failure is
              invisible: messages simply stop arriving. It is the same refusal
              service/app/lock makes about its lock directory, and it is made at wiring
              time for the same reason — at first use it would be a mystery, at
              construction it names the directory.
            name: QueueDirectoryUnusable
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: the queue directory is missing, is not a directory, or is writable by other accounts"
            public: The queue directory cannot be used safely
            reason: QUEUE_DIRECTORY_UNUSABLE
          - code: CodeConsumerMisconfigured
            doc: |-
              ConsumerMisconfigured refuses a ConsumerConfig the engine cannot run.

              It is the sentinel behind the domain's one mandatory assertion. This
              queue delivers AT LEAST ONCE, so a handler will be called twice for
              one message — after a crash, after a lease expiry, after a slow
              downstream. The SDK cannot detect whether that is safe, so it makes
              the caller say so in code: ConsumerConfig.HandlerIsIdempotent, whose
              zero value is false and is refused. That is exactly
              resilience.HedgeConfig.Idempotent's instrument, for exactly its reason
              — a precondition the SDK cannot check becomes a required, greppable
              assertion instead of a comment nobody reads.
            name: ConsumerMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: Handler is nil, or HandlerIsIdempotent is false under an at-least-once queue; the field names which"
            public: The consumer configuration is not runnable and was refused
            reason: CONSUMER_MISCONFIGURED
          - code: CodeHandlerPanicked
            doc: |-
              HandlerPanicked is the failure of a handler whose call panicked.

              The engine recovers it rather than letting it reach the runtime: a
              panic escaping one handler would kill the consumer PROCESS, abandoning
              every other in-flight lease — which then has to time out, one
              visibility timeout at a time, before anything moves again. Recovered,
              it becomes an ordinary nack: this message is retried and eventually
              dead-lettered, and its siblings are untouched.

              The recovered value and the panicking goroutine's stack travel as
              FIELDS, never as the wrap origin, so a panic carrying an *errs.Error
              cannot hijack this code.
              A handler that merely RETURNS an error gets no sentinel of its own:
              Consume hands that error to Broker.Nack unmodified. service/app/events
              joins its ListenerFailed verdict beside the listener's cause because
              Publish returns the aggregate to a caller who must be able to ask "did
              anything fail?"; here the aggregate's destination is a dead-letter
              record, which already says that by existing and has structured fields
              for the rest. A verdict around the cause would displace the reason an
              investigator needs, and TestAFailingHandlerIsRetriedAndThenDeadLettered
              pins that it does not.
            name: HandlerPanicked
            private: "service/data/queue: handler panicked; the fields carry the message id, the panic value and the stack"
            public: The queue handler panicked and was recovered
            reason: HANDLER_PANICKED
    types:
      - decl: true
        doc: |-
          DeadLetterValue is one message the broker gave up on, together with why.

          A dead letter without its cause is an investigation nobody can run, so the
          cause is part of the record rather than a line in whatever log has since
          rotated away. What is kept of the cause is CLAUDE.md rule 4's split, and
          the split is deliberate: the wire-safe Public half and the dotted-quad code
          go to the store, the Private half stays in the log of the process that
          failed, and [MessageValue.ID] joins the two. A dead-letter store is read by
          whoever is investigating — frequently not the process, the host or the
          trust domain that produced the failure — so it is the wrong place for the
          half of an error the SDK defines as log-only.
        name: DeadLetterValue
        struct:
          fields:
            - doc: FailedAt is when the last attempt failed and the message was moved.
              name: FailedAt
              type: time.Time
            - doc: |-
                Reason is the SCREAMING_SNAKE identifier of the failure — the
                errs.Error Reason of the cause, NOT_RETRYABLE for a handler's
                [DoNotRetry] around an error that carried none, or LEASE_EXPIRED when
                the message died by exhausting its deliveries without any consumer ever
                reporting anything.
              name: Reason
              type: string
            - doc: |-
                Cause is the wire-safe Public half of the last failure, or an empty
                string when the consumer reported no cause at all. It never carries
                the message payload, which is a security property this domain shares
                with the rest of the SDK: a queue moves bytes a consumer must not
                leak, and an error message is the classic place they leak from.
              name: Cause
              type: string
            - doc: |-
                Message is the work, unmodified, with the identifier it was published
                under.
              name: Message
              type: MessageValue
            - doc: |-
                Code is the dotted-quad errs.Code of the last failure, or 0 when the
                cause carried none. It is a uint32 rather than an errs.Code so that
                this package's values stay free of the kernel's error type in a shape
                a consumer may serialise; errs.Code(dl.Code) converts.
              name: Code
              type: uint32
            - doc: |-
                Deliveries is how many times the message was delivered before it was
                abandoned. It equals [PolicyValue.MaxDeliveries] for every dead letter
                this SDK's brokers produce by running out of attempts, and is the count
                the message had for one a handler rejected ([Rejecter]).
              name: Deliveries
              type: int
      - decl: true
        doc: |-
          MessageValue is one unit of work as the broker minted it. Every field is
          assigned by [Broker.Publish]; a caller never fills one in, which is why
          Publish takes a payload rather than one of these.
        name: MessageValue
        struct:
          fields:
            - doc: |-
                EnqueuedAt is when the broker accepted the message. It is the ordering
                key a FIFO implementation sorts on, and it is the broker's clock, not
                the producer's.
              name: EnqueuedAt
              type: time.Time
            - doc: |-
                ID identifies the message for the life of the queue and beyond it: a
                dead letter carries the same value, so the log line the failing
                consumer wrote and the record left on disk can be joined without either
                one carrying the other's half of the story (CLAUDE.md rule 4).

                It is opaque. Its shape is the implementation's, it is unique within
                one queue, and nothing outside the broker that minted it may parse it.
              name: ID
              type: string
            - doc: |-
                Payload is the caller's bytes, unmodified and uninterpreted. This
                domain does not encode: pick a codec, marshal, publish the bytes.

                The slice belongs to the receiver — a durable broker read it from a
                device, and an in-memory one copies before handing it over, so a
                handler may keep it, mutate it, or hold it past the acknowledgement
                without corrupting a redelivery.
              name: Payload
              type: "[]byte"
      - decl: true
        doc: |-
          ReceiptValue is the handle to ONE lease: the only thing [Broker.Ack],
          [Broker.Nack] and [LeaseExtender.Extend] accept, and the only proof that
          this consumer is the one currently holding the message.

          It is opaque and it is NOT the message identifier. Two deliveries of the
          same message carry the same [MessageValue.ID] and different receipts, which
          is what lets a broker refuse an acknowledgement from a consumer whose lease
          has already lapsed and been taken by somebody else. Do not parse it, do not
          construct one, and do not store one past the lease it names.

          It is a defined string rather than a struct with an unexported field
          because a receipt has to survive being handed to a goroutine, put in a map
          and printed in a log, and because it is not a secret: it names a lease on a
          queue the holder can already read. What it must not be is FORGEABLE into
          somebody else's lease, and that is a property of how the implementation
          mints it, not of the type.
        name: ReceiptValue
        underlying: string
      - decl: true
        doc: |-
          LeaseValue is a consumer's exclusive claim on one message: the receipt that
          proves it and the instant it lapses.

          The two travel together because neither is usable alone. A receipt without
          a deadline cannot tell a long-running handler whether it still owns the
          work; a deadline without a receipt cannot acknowledge anything.
        name: LeaseValue
        struct:
          fields:
            - doc: |-
                ExpiresAt is when the claim lapses and the message becomes eligible for
                redelivery. It is the broker's clock.

                It is a promise about VISIBILITY and not about mutual exclusion: after
                this instant another consumer may hold the same message while this one
                is still running. A handler that is still working past it is producing
                a duplicate, which the at-least-once guarantee already permits — see
                [LeaseExtender] for the way to avoid producing one on purpose.
              name: ExpiresAt
              type: time.Time
            - doc: Receipt names this lease to [Broker.Ack] and [Broker.Nack].
              name: Receipt
              type: ReceiptValue
      - decl: true
        doc: |-
          DeliveryValue is one message handed to one consumer, with everything the
          consumer needs to decide what to do about it.
        name: DeliveryValue
        struct:
          fields:
            - doc: Lease is the claim this delivery grants and the receipt that ends it.
              name: Lease
              type: LeaseValue
            - doc: Message is the work.
              name: Message
              type: MessageValue
            - doc: |-
                Deliveries counts how many times this message has been handed to a
                consumer, INCLUDING this one. It is 1 on the first delivery.

                It is a field of the port rather than a note in the documentation
                because it is the at-least-once guarantee made unignorable: a consumer
                cannot read a delivery without reading the number that says this may
                not be the first time. A value above 1 means a previous consumer
                failed, timed out, or died — the three are indistinguishable from
                here, deliberately, since none of them changes what the handler must
                do.

                It is also the number [PolicyValue.MaxDeliveries] is compared against:
                a delivery whose count already equals the maximum is the last one this
                message gets before the dead-letter store.
              name: Deliveries
              type: int
      - decl: true
        doc: |-
          PolicyValue is the delivery discipline a broker enforces: how long a lease
          lasts, how many attempts a message gets, how long a failure waits, and how
          large a payload may be.

          # Its zero value is REFUSED, and that is the decision

          ADR 0031 gives two branches — clamp where a working default needs no
          explanation, refuse where any value the SDK invented would be arbitrary —
          and this one struct uses both, which is why they are worth reading side by
          side.

            - [PolicyValue.VisibilityTimeout] and [PolicyValue.MaxDeliveries] are
              REFUSED at zero. Each has two natural readings that are OPPOSITES, and
              in each case one of them silently destroys the guarantee: a zero
              visibility timeout is either "redeliver immediately", which is a
              delivery storm, or "never redeliver", which is a lost message; zero
              deliveries is either "unlimited", which lets one poison message loop
              forever and the dead-letter store stay empty, or "none", which is a
              queue that delivers nothing. This is core/app/lock's argument for refusing
              a zero TTL, and it is the same argument because it is the same class of
              value: a lifetime belongs to the work being protected, and only the
              caller knows what that is.
            - [PolicyValue.RetryDelay] and [PolicyValue.MaxMessageBytes] are CLAMPED.
              A zero retry delay means "as soon as the lease lapses", which is one
              reading, is harmless, and is what a caller who has not thought about
              backoff wants. A zero size bound means [DefaultMaxMessageBytes].
            - [PolicyValue.MaxRetryDelay] is neither: its zero is the behaviour the
              struct had before the field existed — a retry delay that does not grow —
              which is one reading and the only backward-compatible one.

          Both branches in one struct is the point. A domain in which every zero is
          refused teaches a reader nothing except that the author was nervous.

          The three durations are bounded from ABOVE as well, by [MaxDeadlineOffset],
          and that refusal is about arithmetic rather than about readings: a deadline
          further out than that cannot be recorded by a durable broker at all.
        methods:
          - doc: |-
              Validate reports whether the policy is one a broker can honour, and refuses
              it BY FIELD when it is not.

              It lives in core so that the memory, file and SQL brokers refuse identical
              inputs identically — the property that makes the first usable as a test
              double for the other two. It is the same instrument core/data/vfs's ValidatePath
              and ValidatePerm are, for the same reason.
            name: Validate
            out:
              - type: error
            recv: value
          - doc: |-
              Normalized returns the policy with its clamped fields resolved, so that
              every implementation reads the same numbers rather than each remembering to
              apply the same default.

              It does NOT validate: call [PolicyValue.Validate] first, at construction,
              where the refusal reaches the caller who wrote the mistake.
            name: Normalized
            out:
              - type: PolicyValue
            recv: value
        name: PolicyValue
        struct:
          fields:
            - doc: |-
                VisibilityTimeout is how long a [Broker.Receive] hides a message from
                every other consumer. It is the deadline the consumer is racing, and
                it must be longer than the slowest run of the handler — or the handler
                must renew it through [LeaseExtender].

                It is the single knob that sets how quickly a dead consumer's work is
                picked up: a message held by a process that has been SIGKILLed
                reappears exactly this long after it was leased, and not before.

                A non-positive value is refused ([QueueMisconfigured]), and so is one
                above [MaxDeadlineOffset].
              name: VisibilityTimeout
              type: time.Duration
            - doc: |-
                RetryDelay is how long a NACKED message stays invisible before it
                becomes eligible again, measured from the nack.

                It does NOT apply to a lease that simply lapsed: that message has
                already been invisible for a whole visibility timeout, and charging it
                a second wait would punish a crashed consumer more than a failing one.

                Zero is a working value and means "eligible as soon as the nack
                returns". Negative is read as zero. Above [MaxDeadlineOffset] it is
                refused ([QueueMisconfigured]).

                It is the same wait after every failure unless [PolicyValue]
                .MaxRetryDelay makes it grow.
              name: RetryDelay
              type: time.Duration
            - doc: |-
                MaxRetryDelay makes the retry delay GROW, and is where the growth
                stops. When it is positive, a message nacked on its n-th delivery waits
                RetryDelay × 2^(n−1), held at MaxRetryDelay — the SDK's one backoff
                curve (kernel/backoff, ADR 0103), keyed on the delivery that failed,
                so a downstream that is down is asked less and less often instead of at
                a fixed cadence it is already failing to keep up with (ADR 0151).

                Zero keeps RetryDelay constant, which is what every policy did before
                this field existed: a policy that does not name it behaves exactly as
                it did. That is the zero's one reading — a ceiling nobody set is not a
                request for unbounded growth, which could not be recorded anyway.

                A negative value is refused, because it is not a ceiling and the caller
                who wrote it meant something; so is one above [MaxDeadlineOffset],
                whose deadline a durable broker could not record; so is a ceiling with
                no RetryDelay to grow from, which would leave every retry at zero while
                reading like a backoff; and so is a ceiling below RetryDelay, which
                would silently shorten every wait the caller asked for
                ([QueueMisconfigured], naming the field).
              name: MaxRetryDelay
              type: time.Duration
            - doc: |-
                MaxDeliveries is how many times one message may be handed to a
                consumer before the broker gives up and dead-letters it. It is
                compared against [DeliveryValue.Deliveries], which counts from 1, so a
                value of 1 means "one attempt, then the dead-letter store" and is a
                legitimate configuration rather than an off-by-one.

                A non-positive value is refused ([QueueMisconfigured]).
              name: MaxDeliveries
              type: int
            - doc: |-
                MaxMessageBytes bounds one payload. A larger payload is refused at
                [Broker.Publish] with [MessageTooLarge], at the call site that built
                it, rather than accepted and discovered by a consumer that cannot read
                it back.

                Zero means [DefaultMaxMessageBytes]. Negative is refused, because it
                is not a bound at all and the caller who wrote it meant something.
              name: MaxMessageBytes
              type: int
      - decl: true
        doc: |-
          Handler processes one delivery. It is the port a consumer implements, and
          it is a FUNCTION type rather than an interface — the shape
          internal/core/CLAUDE.md already admits for resilience.Operation,
          scheduler.Job, lifecycle.Start and events.Listener. ADR 0039's rule is that
          a published port must not grow a method; a func type satisfies it
          structurally, because it cannot grow one at all.

          It receives the whole [DeliveryValue] and not just the payload, so that
          [DeliveryValue.Deliveries] is in front of whoever writes the handler. A
          handler WILL be called more than once for the same message — that is the
          guarantee, not a malfunction — and the count is the only thing that lets it
          say so in a log.

          Returning nil acknowledges. Returning an error nacks: the message is
          retried, or dead-lettered once it has exhausted
          [PolicyValue.MaxDeliveries]. Returning [DoNotRetry](err) says no retry can
          fix it, and the message is dead-lettered at once, with err, through a
          broker's [Rejecter]. ctx is the consumer's and IS honoured: unlike
          events.Listener, a handler that outlives its context is holding a lease it
          is about to lose, so abandoning the work is the correct response and the
          message will simply be redelivered.
        name: Handler
        underlying: func(ctx context.Context, delivery DeliveryValue) error
      - decl: true
        doc: |-
          NackValue is what [Broker.Nack] decided.

          It exists because "I reported the failure" and "that message is now dead"
          are different facts, and a consumer that cannot tell them apart cannot log
          the one that matters. Every field is a scalar: a nack is on the failure
          path, but it is on the failure path of a queue that is expected to retry,
          so it is not rare enough to allocate on.
        name: NackValue
        struct:
          fields:
            - doc: |-
                Deliveries is how many times the message had been delivered when it
                failed, counting from 1.
              name: Deliveries
              type: int
            - doc: |-
                VisibleAt is when the message becomes available again. It is the zero
                Time when DeadLettered is true.
              name: VisibleAt
              type: time.Time
            - doc: |-
                DeadLettered reports that the message exhausted
                [PolicyValue.MaxDeliveries] and was moved to the dead-letter store
                with its cause. It will not be delivered again, unless somebody replays
                it ([DeadLetterManager]).
              name: DeadLettered
              type: bool
      - decl: true
        doc: |-
          WakeValue is what an idle consumer waits on: an event, or an instant the
          broker already knows about.
        name: WakeValue
        struct:
          fields:
            - doc: |-
                Signal is closed by the next event that may make a message receivable
                through this broker in this process: a Publish, or a Nack that hands a
                message back. It is never nil, and it is never closed by a publication
                made in another process.
              name: Signal
              type: <-chan struct{}
            - doc: |-
                In is how long, measured on the broker's own clock at the moment Wake
                was called, until a message the broker already holds becomes
                receivable with no further event: a retry delay ending, or a lease
                lapsing because its consumer died. It is meaningful only when
                Scheduled is true; zero or less means now.

                It is a duration and not an instant so that a consumer whose clock is
                not the broker's still waits the right length of time rather than
                comparing two clocks that disagree.
              name: In
              type: time.Duration
            - doc: |-
                Scheduled reports that In names such a moment. It is false when the
                broker holds nothing that will become receivable on its own.
              name: Scheduled
              type: bool
  - constants:
      - doc: |-
          DefaultPollInterval is how long an idle worker waits before asking again,
          when [ConsumerConfig.PollInterval] is left at zero.

          It is a CLAMP and not a refusal (ADR 0031): its zero has one reading — "you
          did not think about polling" — and 100 ms is defensible for every queue,
          because it bounds idle latency at a tenth of a second while costing one
          directory read per worker per tenth of a second. A caller who cares picks
          their own.

          Every broker in this package is a [corequeue.Waker], so for them it bounds
          only what a wake cannot see — a publication made by ANOTHER process into a
          durable queue — and a caller that has no such producer can raise it a
          hundredfold. It stays at 100 ms because a zero must keep meaning what it
          always meant for a broker that cannot wake anyone.
        name: DefaultPollInterval
        type: time.Duration
        value: "100000000"
      - doc: |-
          MaxSQLTableLen is the longest table name [NewSQL] and [SQLMigration] accept,
          in bytes: PostgreSQL's identifier limit. The broker derives no table from
          it, so the whole limit is the caller's.
        name: MaxSQLTableLen
        type: int
        value: "63"
    doc: |-
      Package queue — the consumer engine: the pull loop that runs a Handler on a
      CONSUMER'S goroutine, which is the third axis of ADR 0053's frontier.

      Package queue — the consumer engine's configuration, its one mandatory
      assertion, and the clamps that make every other field safe to omit.

      Package queue — who else can write a queue directory, asked of the mode bits:
      the whole answer on Unix, where a directory's other-write bit and its sticky
      bit are exactly the two facts the question needs.

      Package queue — who else can write a queue directory, asked of Windows in the
      only vocabulary it has for it: the directory's DACL, read by the one reader
      this repository has (internal/kernel/fs/winacl — the lock domain's reader,
      ADR 0084/0086, moved to the kernel so that the queue no longer reaches into
      another service for it; ADR 0159).

      # Why the mode rule cannot run here

      os.Stat SYNTHESISES a mode from FILE_ATTRIBUTE_READONLY on Windows, so every
      writable directory reports 0777 with no sticky bit, and the Unix rule refused
      every queue directory a caller could name — as QUEUE_DIRECTORY_UNUSABLE, an
      error that blames the deployment for the platform (ADR 0018 §(a)'s failure
      mode). The first Windows run of the whole suite found it: every /file case.

      # The same two questions, asked of the DACL

      The root is refused when an identifier meaning anybody may take away an
      entry it did not create — winacl.ReplaceRights, the Windows spelling of
      "world-writable and not sticky". A state is refused when such an identifier
      may put an entry there at all — a file (a planted message) or a directory
      or junction — or take one away, or alter a file created there through what
      that file would inherit: on Unix a message is written 0600 whatever the
      directory allows, here it inherits the directory's list.

      # Where it does not reach

      The broker cannot yet RUN here: internal/service/data/vfs refuses Windows by
      design (no flushable directory handle, a mode that is not an ACL), so NewFile
      returns UNSUPPORTED_PLATFORM once these checks pass. They run anyway, so the
      refusal a caller meets on Windows is the platform's rather than a false
      verdict on their directory — and so the rules are right on the day vfs gains
      a Windows backend.

      Package queue — the durable broker: one directory, three subdirectories,
      and rename(2) as the only thing that changes a fact.

      Package queue — the durable broker's configuration, and the directory
      checks it runs before anything is opened.

      Package queue — the durable broker's failure path: handing a message back,
      renewing a lease, and the record left behind for whoever investigates.

      Package queue — the durable queue's state machine is a NAME. This file is
      its grammar: what a queued, an in-flight and an abandoned message are
      called, and how a name is read back into the facts it carries.

      Package queue — the durable broker's read path: reclaiming the leases of
      consumers that died, and leasing what is visible.

      Package queue — the durable broker's dead-letter decisions: putting a dead
      letter back into the queue, or deleting it.

      Package queue — one entry in the in-memory broker's lease-deadline heap.

      Package queue — the record the in-memory broker keeps about one message.

      Package queue — the in-memory broker: the double a consumer's own tests run
      against, and the control the durability measurements are read against.

      Package queue — the in-memory broker's configuration.

      Package queue implements the asynchronous, durable message queue declared
      in internal/core/data/queue (ADR 0054): three brokers — one in the heap, one on
      the filesystem, one in a table of the caller's own SQL database (ADR 0151) —
      the consumer engine that drives a [corequeue.Handler] against any of them,
      and the dead-letter record they all write.

      # Three brokers, one set of refusals

      [NewMemory] exists so a consumer can test its own code without a directory
      or a database, and that is only worth something if the brokers answer
      identically. They therefore share the core policy guard
      (corequeue.PolicyValue.Validate), the retry delay (retryDelay), the same
      typed sentinels, and a table-driven conformance suite that runs the SAME
      cases against all three. Where they cannot be identical — surviving a
      restart, crossing a process boundary, joining the caller's transaction, what
      a flush costs — the difference is named rather than discovered by a reader.

      # The one thing the SQL broker does that neither other can

      [NewSQL] keeps the queue in one table of the database the application
      already writes, and every call runs on the transaction its context carries.
      So a message published inside the caller's transaction exists if and only if
      that transaction commits: the transactional outbox, which no broker whose
      publication is durable on its own can offer.

      # The one thing the file broker does that the memory broker cannot

      It survives the consumer. Every piece of state the durable queue keeps —
      which messages are queued, which are leased, when each lease lapses, how
      many times each has been delivered — lives in a DIRECTORY ENTRY, not in
      this process's heap. A consumer that is SIGKILLed mid-handler leaves an
      entry whose deadline is in the past, and the next consumer to look, in any
      process on that machine, renames it back and delivers it again.
      TestAKilledConsumerLosesItsLeaseAndTheMessageComesBack does exactly that,
      with a real subprocess and a real SIGKILL, because a test that calls Nack
      proves only that Nack works.

      # Why the durable broker holds no long-lived handle

      There is no Close in this package and no descriptor kept between calls.
      Every operation opens what it needs, moves what it must, and returns. That
      costs a syscall or two per call and buys the property the domain is for: a
      process that dies leaves nothing half-open, nothing to recover, and no
      state that only it could have interpreted. It is also what makes the
      broker genuinely inter-process — two brokers in two processes over one
      directory are the same queue, with no coordination beyond the filesystem.

      # Why there is no lock file

      Exclusion between consumers is [os.Rename], not a lock. Renaming a queued
      message into the in-flight directory is atomic and it FAILS for the loser,
      so two consumers reaching for the same message resolve it in the kernel
      with no lock, no lease and no polling — and it resolves the same way for
      two goroutines in one process as for two processes, which ADR 0052
      measured that flock(2) emphatically does not.

      Package queue — how long a nacked message waits, the same way in all three
      brokers.

      Package queue — the SQL broker: the queue in one table of the caller's own
      database, every call on the transaction its context carries (ADR 0151).

      Package queue — the SQL broker's construction parameters, and the refusals
      a configuration no SQL broker could run gets.

      Package queue — the SQL broker's dead letters: burying one a handler
      rejected, reading them back, and the two decisions an operator takes.

      Package queue — the only place the SQL broker renders SQL. Every statement
      it sends is built here, once, at NewSQL, for its dialect and its table; the
      two whose length depends on a batch are rendered per call from the same
      parts. Every one is spelled with the vocabulary core/data/sql's Dialect owns: the
      bind markers, the quoting and the row lock.

      Package queue — the SQL broker's table, as a migration the caller runs under
      its own version table.

      Package queue — the SQL broker's read path: leasing what is due, and
      burying the leases whose consumers died with no attempt left.

      Package queue — waking an idle consumer: the broadcast every broker closes on
      a publication, and the table that lets two durable brokers over one queue —
      one directory, or one database and table — in one process wake each other's
      consumers.
    functions:
      - doc: |-
          Consume runs cfg.Handler against broker until ctx is done.

          It is the third column of ADR 0053's frontier made concrete: the handler
          runs on a goroutine this function owns, not on the publisher's, and it runs
          in a different process from the publisher whenever the broker is a durable
          one. Publish returned long ago and knows nothing about any of this.

          It returns nil when ctx ends — a cancelled consumer is a stopped consumer,
          not a failed one — and returns the broker's error when the BROKER fails,
          because a queue whose storage has stopped answering is not something a
          consumer can poll its way out of. A HANDLER's error is never returned: it
          is nacked, retried, and eventually dead-lettered, which is the entire point
          of the domain.

          Every worker returns before Consume does, so a caller that cancels and
          waits knows no handler is still running.
        in:
          - name: ctx
            type: context.Context
          - name: broker
            type: corequeue.Broker
          - name: cfg
            type: ConsumerConfig
        name: Consume
        out:
          - type: error
      - doc: |-
          NewFile returns a broker whose messages survive the process that published
          them.

          # Why internal/service/data/vfs, and where it stops

          The durable publication of a message is exactly what corevfs.AtomicWriter
          promises: a temporary in the same directory, the payload, an fsync of the
          FILE, a rename, an fsync of the DIRECTORY — five steps whose failure paths
          ADR 0056 tested by injecting a failure at each one and comparing the
          destination's hash. Rewriting that here would be eighty lines of subtle
          code duplicating something the SDK merged, measured and proved, and the
          first thing to rot would be the failure paths, which are the only part that
          matters.

          It stops at corevfs.WritableFS, which has WriteFile, MkdirAll, Remove and
          RemoveAll and NO RENAME. That is not an oversight in vfs and it is not
          worked around here: the port is FROZEN (ADR 0039), so adding a fifth method
          to carry this domain's state machine would break every downstream
          implementation at compile time. The state transitions therefore go through
          os.Root directly, which confines them to the queue directory by the same
          mechanism vfs itself uses, and the boundary between the two is exactly the
          boundary between "publish a whole file" and "move one".

          It refuses, at construction rather than at first use: a policy it cannot
          honour ([corequeue.QueueMisconfigured]), a directory it cannot use safely
          ([corequeue.QueueDirectoryUnusable]), and a platform with no atomic replace
          or no flushable directory handle — core/proc.UnsupportedPlatform, raised by
          internal/service/data/vfs.NewOS and passed through unmodified (ADR 0018).
        in:
          - name: cfg
            type: FileConfig
        name: NewFile
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - doc: |-
          NewMemory returns an in-process broker holding its messages in the heap.

          It refuses a policy it cannot honour at CONSTRUCTION rather than at first
          use, through the same core/data/queue.PolicyValue.Validate the file broker runs
          — which is what makes this an honest double for it.
        in:
          - name: cfg
            type: MemoryConfig
        name: NewMemory
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - doc: |-
          NewSQL returns a broker whose queue is one table of the caller's database,
          created by [SQLMigration]. It sends no statement: everything decidable
          without a database is decided here.

          It refuses, at construction rather than at first use, a policy it cannot
          honour (core/data/queue.QueueMisconfigured) and a transactor, dialect or table it
          cannot use ([corequeue.SQLQueueMisconfigured]).
        in:
          - name: cfg
            type: SQLConfig
        name: NewSQL
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - doc: |-
          SQLMigration returns the migration that creates the one table an SQL queue
          named table keeps on dialect, as a core/data/sql MigrationValue numbered version,
          for the caller's Migrator to run under the caller's version table. Its Down
          drops the table, and every message in it — queued, leased and dead.

          The SDK numbers nothing: a migration is a value its consumer constructs
          (ADR 0055 §D12), and only the consumer knows where the queue's table sits in
          its own history. Its one statement does nothing when the table already
          exists — or is already gone — so applying it over a table a previous
          deployment made changes nothing (ADR 0151).
        in:
          - name: dialect
            type: coresql.Dialect
          - name: table
            type: string
          - name: version
            type: uint64
        name: SQLMigration
        out:
          - type: coresql.MigrationValue
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corequeue: github.com/kitsunium/sdk/internal/core/data/queue
      coresql: github.com/kitsunium/sdk/internal/core/data/sql
    path: github.com/kitsunium/sdk/internal/service/data/queue
    types:
      - doc: |-
          ConsumerConfig configures [Consume]: what to run, how many of it, how often
          to look, and the one thing about the handler the SDK cannot check for
          itself.

          Every field except Handler and HandlerIsIdempotent is CLAMPED, so a caller
          with no opinion writes two fields and gets a correct consumer.
        name: ConsumerConfig
        struct:
          fields:
            - doc: Handler processes one delivery. It must be non-nil.
              name: Handler
              type: corequeue.Handler
            - doc: |-
                Clock drives the idle wait. Nil means clock.System.

                Nothing in this package calls time.Sleep; an idle worker waits through
                Waiter.After and a cancelled context wakes it immediately.
              name: Clock
              type: clock.Timed
            - doc: |-
                PollInterval is how long a worker waits after finding the queue empty.
                Zero means [DefaultPollInterval]; negative is read as zero.

                When the broker is a [corequeue.Waker] — every broker in this package
                is — it is an upper bound and not a cadence: a Publish or a Nack in
                this process wakes the worker at once, and a retry delay ending or a
                lease lapsing wakes it at that instant. What is left for the poll to
                find is a publication another process made into a durable queue, so set
                it to how late such a message may be noticed — seconds, not
                milliseconds, is the usual answer — and an idle consumer then costs
                nothing between polls.
              name: PollInterval
              type: time.Duration
            - doc: |-
                Parallelism is how many independent workers run. Each one polls, leases
                and processes on its OWN goroutine, which is what makes this the
                consumer's goroutine rather than the publisher's.

                Non-positive is clamped to 1: one worker is what a caller who did not
                think about concurrency wants, it is never wrong, and there is nothing
                here for the SDK to invent.

                Above 1 there is NO ordering left, in any sense.
              name: Parallelism
              type: int
            - doc: |-
                BatchSize is how many messages one worker leases per poll. Non-positive
                is clamped to 1.

                Above 1 a worker processes its batch SEQUENTIALLY, so the extra
                messages are held under a lease they are not yet being worked on: a
                batch of 50 with a 30-second visibility timeout gives the last message
                30 seconds minus the other 49's processing time. Batch for throughput
                against a durable broker, where one poll is a directory read; do not
                batch to get parallelism, which is what Parallelism is.
              name: BatchSize
              type: int
            - doc: |-
                HandlerIsIdempotent asserts, IN CODE, that Handler is safe to run more
                than once for the same message.

                It must be true. Its zero value is false and is REFUSED
                ([corequeue.ConsumerMisconfigured]), and that refusal is the domain's
                one piece of deliberate ceremony.

                The reason is that this queue delivers AT LEAST ONCE and cannot do
                otherwise. A consumer that dies between finishing the work and
                acknowledging it has done the work and not said so, and the message
                comes back — that is not a bug to be fixed, it is the only honest
                behaviour available to a queue whose consumers can die. Exactly-once
                delivery does not exist over a transport; what exists is at-least-once
                plus an idempotent consumer, and the second half is the caller's.

                The SDK cannot check it, so it makes the caller assert it where a
                reviewer will see it. It is precisely
                resilience.HedgeConfig.Idempotent's instrument, for precisely its
                reason, and it has the same useful side effect:
                `grep -rn HandlerIsIdempotent` enumerates every place in a codebase
                where somebody promised this.
              name: HandlerIsIdempotent
              type: bool
      - doc: |-
          FileConfig configures [NewFile]: which directory holds the queue, which
          clock reads its deadlines, and what delivery discipline it enforces.

          Its Policy's zero value is refused at construction — see
          core/data/queue.PolicyValue — and so is a directory whose entries any account
          could replace.
        name: FileConfig
        struct:
          fields:
            - doc: |-
                Clock reads time. It is the narrow half of kernel/clock because this
                broker never waits: a lapsed lease is noticed by the next Receive, not
                by a timer.

                Injecting a ManualClock makes every deadline in a SINGLE-process test
                instant. It cannot make a cross-process test instant, and that
                asymmetry is not an oversight: a lease deadline is a wall-clock instant
                written into a filename precisely so that another process can read it,
                and another process does not share this one's fake clock. The
                consumer-death test therefore waits on the real clock, and says so.

                Nil means clock.System.
              name: Clock
              type: clock.Clock
            - doc: |-
                Dir is the queue directory. It is created owner-only when absent, and
                refused when it exists and any account outside the owner and group
                could replace its entries. Its three state directories are held to the
                same rule — created owner-only, checked when somebody else made them —
                and refused besides when one is a symlink or not a directory at all.
                On Windows "owner-only" is not something a mode can say: a directory
                inherits its parent's access control list, and the rule reads that list
                instead (dirtrust_windows.go).

                Two brokers over one Dir — in one process or in two — are ONE queue.
                That is the domain's inter-process claim, and it is the whole reason
                the directory is the configuration rather than an implementation
                detail.
              name: Dir
              type: string
            - doc: |-
                Policy is the delivery discipline. Its zero value is refused; see
                core/data/queue.PolicyValue.
              name: Policy
              type: corequeue.PolicyValue
      - doc: |-
          MemoryConfig configures [NewMemory]: which clock reads its deadlines, and
          what delivery discipline it enforces.

          Its Policy's zero value is refused at construction through the SAME guard
          [NewFile] runs, which is what makes this broker an honest double for that
          one.
        name: MemoryConfig
        struct:
          fields:
            - doc: |-
                Clock reads time. A memory broker never WAITS — expiry is noticed on
                the next Receive — so it asks for the narrow half of kernel/clock and
                a test can drive every deadline in this package with a ManualClock and
                no sleeping at all.

                Nil means clock.System.
              name: Clock
              type: clock.Clock
            - doc: |-
                Policy is the delivery discipline. Its zero value is refused; see
                core/data/queue.PolicyValue.
              name: Policy
              type: corequeue.PolicyValue
      - doc: |-
          SQLConfig configures [NewSQL]: the database the queue lives in, its table,
          which clock stamps its instants, and what delivery discipline it enforces.
          Transactor, Dialect and Table are required, and Policy's zero value is
          refused as it is for every broker.
        name: SQLConfig
        struct:
          fields:
            - doc: |-
                Transactor is the transaction manager of the database the queue lives
                in — the one the caller's own transactions are opened with, so a call
                made under one of them joins it. It must also be a core/data/sql Joiner and
                Deferrer, which the SDK's own transactor is: the first is how a
                publication joins the caller's transaction, the second how it wakes a
                consumer only once that transaction has committed.
              name: Transactor
              type: coresql.Transactor
            - doc: |-
                Clock stamps every instant the broker writes — a message's visibility,
                a lease's deadline, a dead letter's failure — and reads the instant a
                lease is judged against. Nil means clock.System.

                The instants are the BROKER's, never the database's NOW(): a test
                drives every deadline with a ManualClock, as it does the other two
                brokers'. Brokers in several processes over one table compare
                instants their own clocks wrote, so those clocks must agree to within
                the precision a lease needs — as they must for the file broker.
              name: Clock
              type: clock.Clock
            - doc: |-
                Table names the queue's one table, which [SQLMigration] creates. It is
                a lower-case SQL identifier of at most [MaxSQLTableLen] bytes, holds no
                three underscores in a row — docstore's derived tables do — and does
                not start with "sqlite_".

                Two brokers over one database and one Table — in one process or in
                twenty — are ONE queue, as two file brokers over one directory are.
              name: Table
              type: string
            - doc: |-
                Policy is the delivery discipline. Its zero value is refused; see
                core/data/queue.PolicyValue.
              name: Policy
              type: corequeue.PolicyValue
            - doc: |-
                Dialect is the engine's, and must be the Transactor's own: the SQL the
                broker speaks to it.
              name: Dialect
              type: coresql.Dialect
  - doc: |-
      Package queue is the public facade for the SDK's ASYNCHRONOUS, DURABLE
      message queue: one process publishes work, another process picks it up
      later, and a crash in between loses nothing.

      	broker, err := queue.NewFile(queue.FileConfig{
      		Dir: "/var/lib/myapp/jobs",
      		Policy: queue.Policy{
      			VisibilityTimeout: 30 * time.Second, // longer than the slowest handler
      			MaxDeliveries:     5,                // then the dead-letter store
      			RetryDelay:        2 * time.Second,
      		},
      	})

      	// …in the producer, possibly in another process entirely:
      	msg, err := broker.Publish(ctx, payload)

      	// …in the consumer:
      	err = queue.Consume(ctx, broker, queue.ConsumerConfig{
      		Handler: func(ctx context.Context, d queue.Delivery) error {
      			return process(ctx, d.Message.Payload) // d.Deliveries says if this is a retry
      		},
      		HandlerIsIdempotent: true, // required; see below
      		Parallelism:         4,
      	})

      # This is not an event bus, and the difference is the whole design

      Read this before anything else in the package. pkg/v1/app/events and this
      package are described with the same words — publish, handler, message — and
      they guarantee opposite things:

      	                | events                     | queue (this package)
      	----------------|----------------------------|---------------------------
      	Scope           | one process                | many processes
      	Timing          | synchronous                | asynchronous
      	Goroutine       | the publisher's            | a consumer's
      	Transaction     | the publisher's            | its own
      	Durability      | none                       | the point of it
      	Retries / DLQ   | none                       | the point of it
      	If the process  | the event never happened   | the message is still
      	dies mid-flight |                            | there

      If you want several things to happen right now, on your goroutine, inside
      your transaction, you want events and this package will be slower and
      harder for no benefit: [Broker].Publish on a durable broker costs a disk
      flush, because that flush IS the guarantee.

      The Transaction row is about where the WORK runs, and a handler always runs
      in its own. What [NewSQL] adds is that the MESSAGE can be part of yours: see
      "A queue in your own database" below.

      # Delivery is AT LEAST ONCE, and you must handle duplicates

      Exactly-once delivery does not exist over a transport. What exists is
      at-least-once delivery plus an idempotent consumer, and any library that
      advertises the first is selling you the second with your half left as an
      exercise. This one says so instead — in three places you cannot miss:

        - [Delivery].Deliveries is a field of every delivery. It counts from 1,
          and a value above 1 means these bytes have been handled before, by you
          or by a consumer in another process.
        - [ConsumerConfig].HandlerIsIdempotent must be set to true. Its zero
          value is refused, so a handler cannot acquire the promise by omission,
          and `grep -rn HandlerIsIdempotent` enumerates every place in your
          codebase where somebody made it.
        - A message is removed at ACKNOWLEDGEMENT, never at read. That is what
          makes redelivery possible, and it is not negotiable: a consumer that
          dies after doing the work and before acknowledging it has done the work
          and not said so, and the queue has no way to tell that from a consumer
          that died before doing anything.

      # Ordering is NOT guaranteed, and a single retry is enough to lose it

      One consumer, no failures, one durable broker: messages arrive in
      publication order. Change any of the three and they do not.

      The one people discover in production is the retry. A message that fails is
      made visible again LATER, so messages published after it are delivered
      before it is retried. There is no per-key ordering here and no ordered
      mode; if two messages must be processed in order, they are one message.

      # What a crash actually costs

      A consumer that is SIGKILLed mid-handler holds a lease it will never
      release. Nothing is lost: the lease lapses after
      [Policy].VisibilityTimeout and the next consumer to look — in any process
      on that machine — picks the message up with [Delivery].Deliveries
      incremented. That timeout is therefore how long a dead consumer's work sits
      idle, and it is the one number worth thinking about when you wire this.

      A message whose consumers keep dying is dead-lettered like any other, by
      the same [Policy].MaxDeliveries count, so a payload that crashes the
      process cannot loop forever taking every consumer with it.

      # The dead-letter store keeps the cause

      After [Policy].MaxDeliveries attempts the message is moved to the
      dead-letter store together with why: the failure's reason, its dotted-quad
      code, and its wire-safe Public half. The log-only Private half is NOT kept
      — a dead-letter store is read by whoever is investigating, often not the
      process or even the trust domain that failed — and [Message].ID is the join
      key back to the log line that has it.

      Read them with the [DeadLetterReader] capability, which every broker here
      implements. Reading does not remove them; evidence that a read consumes is
      evidence the second investigator does not get.

      	if reader, ok := broker.(queue.DeadLetterReader); ok {
      		dead, err := reader.DeadLetters(ctx, 100)
      	}

      What becomes of one is then a decision, and [DeadLetterManager] is where it
      is taken: ReplayDeadLetter queues it again — same ID, same payload, its
      count reset, so it has every attempt again — once the downstream is fixed,
      and DeleteDeadLetter removes it for good. An ID the store does not hold is
      [DeadLetterNotFound].

      	if manager, ok := broker.(queue.DeadLetterManager); ok {
      		err := manager.ReplayDeadLetter(ctx, dead[0].Message.ID)
      	}

      # A failure no retry can fix is dead-lettered at once

      A payload that does not decode will not decode on the fifth attempt either.
      Return [DoNotRetry] around the error and [Consume] dead-letters the message
      on its FIRST failure, through the broker's [Rejecter], with your error as
      the cause the dead letter records:

      	var order Order
      	if err := json.Unmarshal(d.Message.Payload, &order); err != nil {
      		return queue.DoNotRetry(err)
      	}

      Keep it for failures that belong to the message. A downstream that is down,
      a lock that is held, a deadline that passed are what retries are for. The
      mark is recognised with errs.HasCode(err, queue.CodeNotRetryable); a broker
      of your own without [Rejecter] is nacked as before, and the message then
      reaches the dead-letter store after its last attempt with the same cause.

      # A retry delay that grows

      [Policy].RetryDelay is the same wait after every failure. Set
      [Policy].MaxRetryDelay and it grows instead — RetryDelay after the first
      failure, doubling, never more than the ceiling — so a downstream that is
      down is asked less and less often:

      	queue.Policy{
      		VisibilityTimeout: 30 * time.Second,
      		MaxDeliveries:     10,
      		RetryDelay:        time.Second,     // 1 s, 2 s, 4 s, …
      		MaxRetryDelay:     5 * time.Minute, // … never more than five minutes
      	}

      Zero keeps the constant delay every policy had before the field existed. A
      ceiling with no RetryDelay to grow from, or one below it, is refused.

      # Zero values are safe or refused, never inert

      [Policy].VisibilityTimeout and [Policy].MaxDeliveries are REFUSED at zero,
      because each has two natural readings that are opposites and one of each
      pair silently destroys the guarantee — "redeliver instantly" against "never
      redeliver", "unlimited attempts" against "no attempts". Any value the SDK
      invented would be arbitrary, and a lease lifetime belongs to the work being
      protected.

      [Policy].RetryDelay and [Policy].MaxMessageBytes are CLAMPED, because their
      zeros have one reading each and it is harmless: no extra delay, and
      [DefaultMaxMessageBytes].

      The three durations are also bounded from ABOVE by [MaxDeadlineOffset], a
      century, and refused past it — not as a judgement about leases but because
      the durable brokers write every deadline as Unix nanoseconds, into a file
      name or a 64-bit column, which end in 2262. A deadline past that could not
      be read back, and the message it names would never be delivered again. The
      math.MaxInt64 somebody reaches for to mean "never" is 292 years, so it is
      refused rather than stranding the message; an extension that would reach
      past 2262 is refused by every broker for the same reason.

      # An idle consumer sleeps until there is work

      Every broker here implements [Waker], and [Consume] waits on it: a Publish,
      a Nack or a replay in this process wakes an idle worker at once, and a retry
      delay ending or a lease lapsing wakes it at that instant. [ConsumerConfig]
      .PollInterval is then an upper bound rather than a cadence — what is left
      for it to find is a message ANOTHER process published into a durable queue —
      so an idle consumer costs nothing between polls and a poll of a few seconds
      loses no latency inside one process:

      	queue.Consume(ctx, broker, queue.ConsumerConfig{
      		Handler:             handle,
      		HandlerIsIdempotent: true,
      		PollInterval:        5 * time.Second, // bounds only a publication from another process
      	})

      Two durable brokers over one directory — or one database and table — in one
      process share their wake, as they share everything else: they are one queue.

      # A queue in your own database, joined to your transaction

      [NewSQL] keeps the queue in one table of the PostgreSQL, MySQL or SQLite
      database your application already writes, handed over as the [sql.Transactor]
      you open your own transactions with. Every call runs on the transaction its
      context carries — a savepoint of it — so a message published inside yours
      exists if and only if yours commits. That is the transactional outbox: the
      write and the message that announces it are never one without the other,
      and a process that dies between your commit and a publication loses
      nothing, because there is no between.

      	create, err := queue.SQLMigration(sql.DialectPostgres, "app__jobs", 20260930120000) // run by your Migrator
      	jobs, err := queue.NewSQL(queue.SQLConfig{
      		Transactor: tm, Dialect: sql.DialectPostgres, Table: "app__jobs",
      		Policy: queue.Policy{VisibilityTimeout: 30 * time.Second, MaxDeliveries: 5},
      	})
      	err = sql.Transact(ctx, tm, func(ctx context.Context, _ sql.Executor) error {
      		if err := orders.Insert(ctx, order); err != nil {
      			return err // no message either
      		}
      		_, err := jobs.Publish(ctx, payload) // joins this transaction
      		return err
      	})

      Idle consumers are woken once the publication's transaction commits, never
      for one rolled back. An idle Receive is one indexed read and takes no lock;
      a Receive that leases locks the rows it takes and skips those another
      consumer holds (FOR UPDATE SKIP LOCKED — MySQL 8.0.1, MariaDB 10.6) or, on
      SQLite, takes the one write lock. A failure of the database is
      [QueueBackendFailed], with the driver's error reachable through errors.As
      and its text — which quotes rows — withheld; it ends [Consume], as a storage
      failure always has, and a database fails transiently where a directory
      rarely does — so run a consumer over it under lifecycle's supervisor, and
      open SQLite with a busy timeout.

      # Three brokers

      [NewFile] and [NewSQL] are the real ones. [NewFile]'s state is a directory,
      it survives the process, and two brokers over one directory — in one process
      or in twenty — are one queue. [NewSQL]'s state is a table, with the same
      guarantees, and the one property a directory cannot give: a publication
      inside your database transaction.

      [NewMemory] is the test double. It gives your own tests the port's full
      semantics with no directory and no flush, which is what makes them fast
      enough to run on every save. It is one process and it holds nothing on a
      device, so a restart is a total loss: using it in production buys the
      asynchrony and throws away the durability, which is the exact confusion the
      frontier table above exists to prevent.
    facade:
      - const:
          - doc: |-
              DefaultMaxMessageBytes is the payload bound applied when
              [Policy].MaxMessageBytes is left at zero: one mebibyte.
            name: DefaultMaxMessageBytes
            reexport: corequeue.DefaultMaxMessageBytes
            type: int
            typed: true
            value: 1 << 20
      - const:
          - doc: |-
              MaxDeadlineOffset is the ceiling on [Policy].VisibilityTimeout and
              [Policy].RetryDelay: a century, refused above it rather than clamped,
              because a deadline past 2262 cannot be written into the durable broker's
              file names and read back.
            name: MaxDeadlineOffset
            reexport: corequeue.MaxDeadlineOffset
            type: time.Duration
            typed: true
            value: "3153600000000000000"
      - const:
          - doc: |-
              DefaultPollInterval is how long an idle worker waits before asking again
              when [ConsumerConfig].PollInterval is left at zero. With a [Waker] broker it
              bounds only how late another process's publication is noticed.
            name: DefaultPollInterval
            reexport: svcqueue.DefaultPollInterval
            type: time.Duration
            typed: true
            value: "100000000"
      - const:
          - doc: |-
              MaxSQLTableLen is the longest table name [NewSQL] and [SQLMigration] accept,
              in bytes: PostgreSQL's identifier limit.
            name: MaxSQLTableLen
            reexport: svcqueue.MaxSQLTableLen
            type: int
            typed: true
            value: "63"
      - const:
          - doc: |-
              CodeNotRetryable is the code [DoNotRetry] adds to a failure's wrap
              trail: errs.HasCode(err, CodeNotRetryable) recognises the mark, where
              errors.Is(err, NotRetryable) sees only an origin.
            name: CodeNotRetryable
            reexport: corequeue.CodeNotRetryable
            type: errs.Code
            typed: true
            value: "0x00_02_17_06"
          - doc: CodeDeadLetterNotFound is [DeadLetterNotFound]'s code.
            name: CodeDeadLetterNotFound
            reexport: corequeue.CodeDeadLetterNotFound
            type: errs.Code
            typed: true
            value: "0x00_02_17_07"
          - doc: CodeSQLQueueMisconfigured is [SQLQueueMisconfigured]'s code.
            name: CodeSQLQueueMisconfigured
            reexport: corequeue.CodeSQLQueueMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_03_35_05"
        doc: The codes of the sentinels ADR 0151 added, for errs.HasCode.
      - alias:
          - doc: |-
              Broker is the public alias for the queue contract. It is FROZEN at four
              methods; capabilities arrive as siblings ([DeadLetterReader],
              [LeaseExtender], [Waker], [Rejecter], [DeadLetterManager]) reached by type
              assertion.
            name: Broker
            target: corequeue.Broker
      - alias:
          - doc: Handler is the public alias for the function that processes one delivery.
            name: Handler
            target: corequeue.Handler
      - alias:
          - doc: Message is the public alias for one unit of work as the broker minted it.
            name: Message
            target: corequeue.MessageValue
      - alias:
          - doc: |-
              Delivery is the public alias for one message handed to one consumer,
              carrying the lease that proves the claim and the count that says whether
              this is a retry.
            name: Delivery
            target: corequeue.DeliveryValue
      - alias:
          - doc: Lease is the public alias for a consumer's exclusive claim on one message.
            name: Lease
            target: corequeue.LeaseValue
      - alias:
          - doc: |-
              Receipt is the public alias for the opaque handle to one lease. Do not
              parse it and do not construct one.
            name: Receipt
            target: corequeue.ReceiptValue
      - alias:
          - doc: |-
              Nack is the public alias for what [Broker].Nack decided: retried, or
              dead-lettered.
            name: Nack
            target: corequeue.NackValue
      - alias:
          - doc: Policy is the public alias for the delivery discipline a broker enforces.
            name: Policy
            target: corequeue.PolicyValue
      - alias:
          - doc: DeadLetter is the public alias for one abandoned message and its cause.
            name: DeadLetter
            target: corequeue.DeadLetterValue
      - alias:
          - doc: |-
              DeadLetterReader is the public alias for the capability of reading the
              dead-letter store back. Every broker here implements it.
            name: DeadLetterReader
            target: corequeue.DeadLetterReader
      - alias:
          - doc: |-
              LeaseExtender is the public alias for the capability of renewing a lease a
              handler is still working under. Every broker here implements it.
            name: LeaseExtender
            target: corequeue.LeaseExtender
      - alias:
          - doc: |-
              Waker is the public alias for the capability of telling an idle consumer
              when to look again. Every broker here implements it, and Consume uses it; a
              broker of your own that omits it is simply polled.
            name: Waker
            target: corequeue.Waker
      - alias:
          - doc: |-
              Wake is the public alias for what an idle consumer waits on: a signal the
              next Publish or Nack in this process closes, and how long until something
              the broker holds becomes receivable on its own.
            name: Wake
            target: corequeue.WakeValue
      - alias:
          - doc: |-
              Rejecter is the public alias for the capability of dead-lettering a leased
              message at once, with the cause that condemned it. Every broker here
              implements it, and Consume uses it for a [DoNotRetry] failure.
            name: Rejecter
            target: corequeue.Rejecter
      - alias:
          - doc: |-
              DeadLetterManager is the public alias for the capability of replaying a
              dead letter into its queue, its count reset, or deleting it. Every broker
              here implements it.
            name: DeadLetterManager
            target: corequeue.DeadLetterManager
      - alias:
          - doc: |-
              SQLConfig is the public alias for [NewSQL]'s configuration: Transactor,
              Dialect and Table (required), Policy, and Clock.
            name: SQLConfig
            target: svcqueue.SQLConfig
      - alias:
          - doc: FileConfig is the public alias for [NewFile]'s configuration.
            name: FileConfig
            target: svcqueue.FileConfig
      - alias:
          - doc: MemoryConfig is the public alias for [NewMemory]'s configuration.
            name: MemoryConfig
            target: svcqueue.MemoryConfig
      - alias:
          - doc: ConsumerConfig is the public alias for [Consume]'s configuration.
            name: ConsumerConfig
            target: svcqueue.ConsumerConfig
      - var:
          - doc: QueueMisconfigured refuses a Policy field the broker cannot honour.
            name: QueueMisconfigured
            reexport: corequeue.QueueMisconfigured
            type: "*errs.Error"
          - doc: |-
              MessageTooLarge refuses a payload above the policy's bound, at the
              producer, where it can still be made smaller.
            name: MessageTooLarge
            reexport: corequeue.MessageTooLarge
            type: "*errs.Error"
          - doc: |-
              UnknownReceipt refuses an acknowledgement naming a lease this queue
              never issued.
            name: UnknownReceipt
            reexport: corequeue.UnknownReceipt
            type: "*errs.Error"
          - doc: |-
              LeaseExpired reports an acknowledgement whose lease had already lapsed.
              Nothing happened, and the message is elsewhere.
            name: LeaseExpired
            reexport: corequeue.LeaseExpired
            type: "*errs.Error"
          - doc: InvalidBatchSize refuses a non-positive batch size.
            name: InvalidBatchSize
            reexport: corequeue.InvalidBatchSize
            type: "*errs.Error"
          - doc: |-
              NotRetryable is the failure no retry can fix: what a dead letter
              records when [DoNotRetry] marked an error with no public words of its
              own, or none at all.
            name: NotRetryable
            reexport: corequeue.NotRetryable
            type: "*errs.Error"
          - doc: |-
              DeadLetterNotFound refuses a replay or a deletion naming a dead letter
              the store does not hold.
            name: DeadLetterNotFound
            reexport: corequeue.DeadLetterNotFound
            type: "*errs.Error"
          - doc: |-
              SQLQueueMisconfigured refuses an SQLConfig no SQL broker could run: no
              transactor, one it cannot join a transaction of, a dialect it cannot
              spell, or a table name it cannot use.
            name: SQLQueueMisconfigured
            reexport: corequeue.SQLQueueMisconfigured
            type: "*errs.Error"
          - doc: |-
              QueueBackendFailed reports a refusal from a durable broker's storage:
              the filesystem's, or a statement the SQL broker's database did not
              complete.
            name: QueueBackendFailed
            reexport: corequeue.QueueBackendFailed
            type: "*errs.Error"
          - doc: |-
              QueueDirectoryUnusable refuses a queue directory that is missing, is
              not a directory, or is writable by accounts that must not be able to
              inject or drain messages.
            name: QueueDirectoryUnusable
            reexport: corequeue.QueueDirectoryUnusable
            type: "*errs.Error"
          - doc: |-
              ConsumerMisconfigured refuses a consumer with no Handler, or one whose
              author has not asserted HandlerIsIdempotent.
            name: ConsumerMisconfigured
            reexport: corequeue.ConsumerMisconfigured
            type: "*errs.Error"
          - doc: |-
              HandlerPanicked reports a recovered handler panic. The message was
              nacked and the consumer kept running.

              There is deliberately no HandlerFailed beside it: a handler that
              returns an error has its error recorded in the dead letter unmodified,
              because a verdict wrapped around it would displace the reason whoever
              reads that record actually needs.
            name: HandlerPanicked
            reexport: corequeue.HandlerPanicked
            type: "*errs.Error"
      - func:
          doc: |-
            NewFile returns the durable broker: its whole state is the directory in
            cfg.Dir, so it survives the process that published into it and two brokers
            over one directory are one queue.

            It refuses at construction — never at first use — a policy it cannot
            honour, a directory it cannot use safely, and a platform with no atomic
            replace or no flushable directory handle. Windows is such a platform: after
            the directory checks — which read its access control lists there — NewFile
            returns the SDK's UNSUPPORTED_PLATFORM, matched with
            errors.Is(err, proc.UnsupportedPlatform).

            The broker holds two directory descriptors and additionally implements
            io.Closer, which releases them — reached by type assertion, as the session
            file store's is, so Broker grows no method:

            	if closer, ok := broker.(io.Closer); ok { defer closer.Close() }

            The messages stay on disk; every call after Close fails.
          forward: svcqueue.NewFile
          in:
            - name: cfg
              type: FileConfig
          name: NewFile
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            NewSQL returns a durable broker whose queue is one table of the caller's
            database, created by [SQLMigration]. Every call runs on the transaction its
            context carries for cfg.Transactor, so a message published inside that
            transaction exists if and only if it commits. It sends no statement.

            It refuses at construction — never at first use — a policy it cannot honour
            and a transactor, dialect or table it cannot use ([SQLQueueMisconfigured]).
            The transactor must be the SDK's, or another core/data/sql Joiner and Deferrer.
          forward: svcqueue.NewSQL
          in:
            - name: cfg
              type: SQLConfig
          name: NewSQL
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            SQLMigration returns the migration that creates the one table an SQL queue
            named table keeps on dialect, numbered version for the caller's own version
            table. Its Down drops the table, and every message in it. Its statement does
            nothing when the table exists.
          forward: svcqueue.SQLMigration
          in:
            - name: dialect
              type: sql.Dialect
            - name: table
              type: string
            - name: version
              type: uint64
          name: SQLMigration
          out:
            - type: sql.Migration
            - type: error
      - func:
          doc: |-
            DoNotRetry marks cause as a failure no retry can fix: returned from a
            [Handler], it makes [Consume] dead-letter the message at once, with cause,
            instead of handing it back for another attempt. An SDK error keeps its own
            reason, code and public words in the dead letter; any other error, or none,
            is recorded as [NotRetryable].
          forward: corequeue.DoNotRetry
          in:
            - name: cause
              type: error
          name: DoNotRetry
          out:
            - type: error
      - func:
          doc: |-
            NewMemory returns the in-process test double: the port's full semantics,
            no directory, no flush, and nothing that survives the process.

            It refuses the same policies [NewFile] refuses, through the same guard,
            which is what makes it an honest double.
          forward: svcqueue.NewMemory
          in:
            - name: cfg
              type: MemoryConfig
          name: NewMemory
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            Consume runs cfg.Handler against broker until ctx is done, on
            cfg.Parallelism goroutines it owns.

            It returns nil when ctx ends — a cancelled consumer is a stopped consumer,
            not a failed one — and returns the broker's error when the STORAGE fails. A
            handler's error is never returned: it is nacked, retried, and eventually
            dead-lettered, which is the entire point of the domain.

            cfg.HandlerIsIdempotent must be true; see the package documentation.
          forward: svcqueue.Consume
          in:
            - name: ctx
              type: context.Context
            - name: broker
              type: Broker
            - name: cfg
              type: ConsumerConfig
          name: Consume
          out:
            - type: error
    imports:
      corequeue: github.com/kitsunium/sdk/internal/core/data/queue
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      sql: github.com/kitsunium/sdk/pkg/v1/data/sql
      svcqueue: github.com/kitsunium/sdk/internal/service/data/queue
    path: github.com/kitsunium/sdk/pkg/v1/data/queue
