              type: time.Duration
            - name: RetryDelay
              type: time.Duration
            - name: MaxRetryDelay
              type: time.Duration
            - name: MaxDeliveries
              type: int
            - name: MaxMessageBytes
              type: int
      - name: Handler
        underlying: func(ctx context.Context, delivery DeliveryValue) error
      - name: NackValue
        struct:
          fields:
            - name: Deliveries
              type: int
            - name: VisibleAt
              type: time.Time
            - name: DeadLettered
              type: bool
      - name: WakeValue
        struct:
          fields:
            - name: Signal
              type: <-chan struct{}
            - name: In
              type: time.Duration
            - name: Scheduled
              type: bool
    variables:
      - name: QueueMisconfigured
        type: "*errs.Error"
      - name: MessageTooLarge
