apiVersion: kit.kitsunium/design/v2
domain: data/queue
packages:
  - codes:
      - const:
          - doc: |-
              CodeQueueMisconfigured identifies a PolicyValue field a broker cannot
              honour, refused at construction rather than at first use.
            name: CodeQueueMisconfigured
            note: "range: 0.2.23.0 - 0.2.23.255"
            value: "0x00_02_17_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeMessageTooLarge identifies a Publish whose payload exceeds
              PolicyValue.MaxMessageBytes.
            name: CodeMessageTooLarge
            value: "0x00_02_17_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownReceipt identifies an Ack, Nack or Extend naming a lease this
              broker never issued, or a receipt it cannot parse.
            name: CodeUnknownReceipt
            value: "0x00_02_17_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLeaseExpired identifies an Ack, Nack or Extend on a lease that has
              lapsed. The call changed nothing and the message is elsewhere.
            name: CodeLeaseExpired
            value: "0x00_02_17_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidBatchSize identifies a Receive or DeadLetters asked for a
              non-positive number of messages.
            name: CodeInvalidBatchSize
            value: "0x00_02_17_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotRetryable identifies a handler's failure no retry can fix. DoNotRetry
              adds it to the wrap trail of the handler's own cause, so errs.HasCode finds
              it while the cause stays the origin a dead letter records (ADR 0151).
            name: CodeNotRetryable
            value: "0x00_02_17_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeDeadLetterNotFound identifies a replay or a deletion naming a dead
              letter the store does not hold.
            name: CodeDeadLetterNotFound
            value: "0x00_02_17_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeQueueBackendFailed identifies an operation a durable broker depends on
              that its storage refused: a filesystem call the operating system refused,
              or a statement the SQL broker's database did not complete.
            name: CodeQueueBackendFailed
            note: |-
              range: 0.3.53.0 - 0.3.53.255 — the brokers' and the consumer engine's own
              codes, allocated by the service layer (LL = 3) and declared here since ADR
              0160: a code keeps the value its layer allocated when its declaration moves.
            value: "0x00_03_35_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeQueueDirectoryUnusable identifies a queue directory that cannot be
              prepared, is not a directory, or is writable by accounts that must not be
              able to inject or remove messages.
            name: CodeQueueDirectoryUnusable
            value: "0x00_03_35_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeConsumerMisconfigured identifies a ConsumerConfig the engine refuses:
              no Handler, or a Handler whose author has not asserted that it is
              idempotent under at-least-once delivery.
            name: CodeConsumerMisconfigured
            value: "0x00_03_35_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerPanicked identifies a handler whose call panicked; the engine
              recovered it, nacked the message, and kept consuming.

              There is deliberately no companion CodeHandlerFailed. A handler that merely
              returns an error hands that error to Nack UNMODIFIED — see Consume's guard
              — because the destination is a dead-letter record whose structured fields
              already say "a handler failed", and an engine verdict wrapped around the
              cause would displace the reason an investigator needs.
            name: CodeHandlerPanicked
            value: "0x00_03_35_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeSQLQueueMisconfigured identifies an SQLConfig the SQL broker refuses at
              construction: no transactor, one it cannot join a transaction of, a dialect
              it cannot spell, or a table name it cannot interpolate safely (ADR 0151).
            name: CodeSQLQueueMisconfigured
            value: "0x00_03_35_05"
        type: errs.Code
    constants:
      - name: DefaultMaxMessageBytes
        type: int
        value: 1 << 20
      - name: MaxDeadlineOffset
        type: time.Duration
        value: "3153600000000000000"
    functions:
      - in:
          - name: cause
            type: error
        name: DoNotRetry
        out:
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/data/queue
    ports:
      - doc: |-
          DeadLetterReader reads the messages a broker gave up on.

          It is a SIBLING of [Broker] reached by type assertion, never a fifth method
          on it, because reading the dead letters back is a capability and not every
          broker has one: a connector onto a third-party system usually dead-letters
          into a second queue that is read with the same [Broker] interface, and one
          that dead-letters into an operator's console cannot return anything at all.
          The three brokers in internal/service/data/queue implement it.

          	if reader, ok := broker.(queue.DeadLetterReader); ok {
          		dead, err := reader.DeadLetters(ctx, 100)
          	}
        methods:
          - doc: |-
              DeadLetters returns up to max dead letters, oldest first. It does NOT
              remove them: a dead letter is evidence, and a read that consumed it
              would make the second investigator's job impossible. Removing one is a
              decision, and [DeadLetterManager] is where it is made.

              max must be positive ([InvalidBatchSize]).
            in:
              - name: ctx
                type: context.Context
              - name: max
                type: int
            name: DeadLetters
            out:
              - type: "[]DeadLetterValue"
              - type: error
        name: DeadLetterReader
      - doc: |-
          LeaseExtender renews a lease a handler is still working under.

          It is the honest answer to the one question [PolicyValue.VisibilityTimeout]
          cannot settle: the timeout must be longer than the slowest handler, and the
          slowest handler is not known in advance. Rather than inviting a caller to
          set an hour-long visibility timeout — which turns every consumer crash into
          an hour of silence — a handler that legitimately needs longer says so.

          It is a sibling for the same reason [DeadLetterReader] is: a broker over a
          transport with no renewal verb cannot implement it, and the assertion is
          how a caller finds that out. The three brokers in internal/service/data/queue
          implement it.
        methods:
          - doc: |-
              Extend renews the lease named by receipt for a further by, measured
              from now, and returns the lease that replaces it.

              It returns a NEW [LeaseValue] — a new receipt included — and the old
              receipt is void from that moment. That is not ceremony: an
              implementation whose lease deadline lives in a durable name can only
              change it by replacing the name, and a receipt that silently kept
              meaning something after the thing it named had moved would be the one
              bug this whole domain is built to avoid.

              A lapsed lease is [LeaseExpired] and is NOT renewed, even when no
              other consumer has taken the message yet: expiry is a deadline, not
              "until somebody else wants it". The handler that asks and is refused
              has learnt that its work is now a duplicate, which is exactly when it
              needed to know.

              A non-positive by is [QueueMisconfigured]: the two readings of zero —
              "lapse now" and "never lapse" — are opposites and both harmful. So is a
              by whose deadline reaches past what a durable implementation can record
              (2262, Unix nanoseconds): it is refused before anything moves, and the
              lease the caller holds stays valid. Validate never sees this duration,
              so [MaxDeadlineOffset] cannot bound it; the instant itself is checked.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: by
                type: time.Duration
            name: Extend
            out:
              - type: LeaseValue
              - type: error
        name: LeaseExtender
      - doc: |-
          Rejecter dead-letters a leased message at once, with the cause that
          condemned it, whatever its delivery count.

          It is the broker's half of a handler saying "do not retry" — [DoNotRetry]
          is the handler's — and internal/service/data/queue.Consume joins the two: a
          handler whose failure carries [CodeNotRetryable] is rejected rather than
          nacked, so a payload that will never decode reaches the dead-letter store
          on its first failure instead of its MaxDeliveries-th, and an operator sees
          it one lease and no retry delay later.

          It is a sibling of [Broker] for the reason [DeadLetterReader] is: a
          connector onto a system with no in-band dead-letter move cannot implement
          it, and the engine falls back to Nack for such a broker — the message is
          then retried until MaxDeliveries and dead-lettered with the same cause, so
          the shortcut is lost and never the message. The three brokers in
          internal/service/data/queue implement it.
        methods:
          - doc: |-
              Reject moves the leased message named by receipt to the dead-letter
              store with cause, recorded as [Broker.Nack] records the cause of a
              message that ran out of attempts: its Reason, its dotted-quad Code and
              its wire-safe Public half, never the Private one. The dead letter's
              Deliveries is the count the message had, which may be below
              [PolicyValue.MaxDeliveries].

              A lapsed receipt is [LeaseExpired] and one this broker cannot read is
              [UnknownReceipt], exactly as [Broker.Ack] refuses them; neither moves
              anything.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: cause
                type: error
            name: Reject
            out:
              - type: error
        name: Rejecter
      - doc: |-
          DeadLetterManager puts a dead letter back into its queue, or deletes it.

          Reading the store ([DeadLetterReader]) is evidence and never changes it;
          these two calls are the decisions an operator takes after reading it — the
          failure was fixed downstream, so the message is replayed; the message is
          obsolete, so it is deleted. They take the dead letter's [MessageValue].ID,
          the identifier DeadLetters returned and the failing consumer logged.

          A sibling of [Broker] for the reason [DeadLetterReader] is. The three
          brokers in internal/service/data/queue implement it.

          	if manager, ok := broker.(queue.DeadLetterManager); ok {
          		err := manager.ReplayDeadLetter(ctx, dead.Message.ID)
          	}
        methods:
          - doc: |-
              ReplayDeadLetter moves the dead letter id back into the queue, visible
              at once, with its delivery count reset: its next delivery counts 1 and
              it gets [PolicyValue.MaxDeliveries] attempts again. It keeps its ID, its
              payload and its EnqueuedAt, so the log lines of both its lives join on
              one identifier; the dead-letter record, its cause included, is gone once
              the message is queued again — log it first if it matters.

              An id the store does not hold is [DeadLetterNotFound], and nothing is
              queued. Two replays of one dead letter racing each other may both
              queue it on a broker that cannot tell them apart, which is a duplicate
              the at-least-once guarantee already permits; the brokers say which
              they are.
            in:
              - name: ctx
                type: context.Context
              - name: id
                type: string
            name: ReplayDeadLetter
            out:
              - type: error
          - doc: |-
              DeleteDeadLetter removes the dead letter id for good, payload, cause
              and all. It is the only call in the domain that destroys a message
              without its consumer's acknowledgement, and it is never made by the
              SDK itself. An id the store does not hold is [DeadLetterNotFound].
            in:
              - name: ctx
                type: context.Context
              - name: id
                type: string
            name: DeleteDeadLetter
            out:
              - type: error
        name: DeadLetterManager
      - doc: |-
          Broker is one named queue: producers publish into it, consumers lease from
          it, and it — not the consumer — owns the delivery count and the decision to
          dead-letter. Implementations MUST be safe for concurrent use by multiple
          goroutines AND, where the implementation is durable, by multiple processes.

          IFACE-PLUGIN: the concrete brokers stay unexported behind their
          constructors in internal/service/data/queue.

          The interface is FROZEN at these four methods. pkg/v1/data/queue aliases it, Go
          interfaces are structural, and a fifth method would break every downstream
          implementation at compile time with no deprecation window (ADR 0039). A new
          capability arrives as a sibling interface reached by type assertion —
          [DeadLetterReader], [LeaseExtender], [Waker], [Rejecter] and
          [DeadLetterManager] are the ones that ship.

          # Why the BROKER owns the delivery count

          Because the consumer is the thing that dies. A count held by the consumer
          engine is lost by exactly the event the count exists to survive, so a
          process that crashes on every third message would retry forever and never
          dead-letter. The count travels with the message, in whatever the
          implementation's durable representation is, and the broker compares it
          against [PolicyValue.MaxDeliveries] on every [Broker.Nack] and on every
          lapsed lease.
        methods:
          - doc: |-
              Publish appends payload to the queue and returns the message the
              broker minted for it.

              It takes BYTES and not a [MessageValue] on purpose: the identifier and
              the enqueue instant are the broker's to assign, and a struct with
              fields the caller must leave blank is a struct that will eventually be
              filled in.

              When it returns nil, a durable implementation has flushed the message
              to its device: a crash one instruction later does not lose it. That
              flush is most of what the call costs — see the domain's BENCH.md. An
              implementation that joins the transaction ctx carries (ADR 0151) has
              instead made the message part of that transaction: it is durable, and
              receivable, once the transaction commits, and it never existed if the
              transaction rolls back.

              A payload larger than [PolicyValue.MaxMessageBytes] is
              [MessageTooLarge]; an empty payload is legitimate, because a message
              whose whole meaning is its arrival is a normal thing to send.
            in:
              - name: ctx
                type: context.Context
              - name: payload
                type: "[]byte"
            name: Publish
            out:
              - type: MessageValue
              - type: error
          - doc: |-
              Receive leases up to max messages and returns them. It does NOT block
              waiting for work: an empty queue yields an empty slice and a nil
              error, and polling is the caller's (see internal/service/data/queue.Consume,
              which does it for you).

              Each returned message is invisible to every other consumer until its
              [DeliveryValue.Lease] expires. A consumer that finishes acknowledges
              with [Broker.Ack]; a consumer that fails reports it with [Broker.Nack];
              a consumer that DIES does neither, and the lapsed lease is what makes
              the message reappear.

              max must be positive: [InvalidBatchSize] otherwise, rather than an
              empty slice forever from a consumer loop that spins and processes
              nothing.
            in:
              - name: ctx
                type: context.Context
              - name: max
                type: int
            name: Receive
            out:
              - type: "[]DeliveryValue"
              - type: error
          - doc: |-
              Ack removes the leased message permanently. It is the only call that
              does.

              A receipt whose lease has already lapsed is [LeaseExpired] and removes
              NOTHING: the message is back in the queue, or in the dead-letter
              store, and another consumer may already hold it. Reporting that is the
              same decision core/app/lock makes for a lapsed lease — a holder that lost
              its claim must not be able to end somebody else's turn, and must find
              out that it lost it.

              A receipt this broker never issued, or one it cannot parse, is
              [UnknownReceipt].
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
            name: Ack
            out:
              - type: error
          - doc: |-
              Nack reports that processing failed and hands the message back.

              The broker decides what happens next and reports it: the message
              becomes visible again after [PolicyValue.RetryDelay] — grown by
              [PolicyValue.MaxRetryDelay] when the policy asks for it — or, when it
              has now been delivered [PolicyValue.MaxDeliveries] times, it is moved to
              the dead-letter store together with cause. See [NackValue]. A failure
              no retry can fix is not nacked but rejected ([Rejecter]).

              cause is recorded. What is kept of it is the implementation's to
              document, and the rule this domain follows is CLAUDE.md rule 4: the
              wire-safe Public half and the dotted-quad code travel with the dead
              letter, the Private half stays in the failing process's log, and the
              message identifier is the join key between them. A nil cause is
              accepted and recorded as an unexplained failure, because a consumer
              that knows only "this did not work" must still be able to say so.

              A lapsed or unknown receipt is refused exactly as [Broker.Ack] refuses
              it.
            in:
              - name: ctx
                type: context.Context
              - name: receipt
                type: ReceiptValue
              - name: cause
                type: error
            name: Nack
            out:
              - type: NackValue
              - type: error
        name: Broker
      - doc: |-
          Waker tells an idle consumer when to look at a broker again, so it can
          sleep until there may be work instead of polling on a fixed cadence.

          It is a SIBLING of [Broker] for the reason [DeadLetterReader] is: waking is
          a capability, and a broker over a transport that cannot see its own
          publications — or one whose state lives in another process — has no honest
          answer to give. The consumer engine asks by type assertion and polls when
          the answer is no, so an implementation that omits it loses latency, never
          correctness.

          A wake is a HINT, in both directions. A signal may arrive with nothing to
          receive — another consumer took it — and work may appear with no signal at
          all: a durable broker cannot see a publication made by another process. So
          a consumer that uses it still polls, at whatever cadence bounds the second
          case, and treats the first as a cheap empty Receive.
        methods:
          - doc: |-
              Wake returns what an idle consumer should wait on. Call it BEFORE the
              Receive that may come back empty: a publication landing between that
              Receive and the wait closes the channel already handed out, so it is
              not missed.
            name: Wake
            out:
              - type: WakeValue
        name: Waker
    sentinels:
      - var:
          - code: CodeQueueMisconfigured
            doc: |-
              QueueMisconfigured refuses a PolicyValue a broker cannot honour — a
              zero with opposite readings, or a duration past MaxDeadlineOffset — and
              an Extend duration that is non-positive or reaches past what a durable
              broker can record. The "field" field names which value.

              It is a refusal and not a clamp for the fields whose zero has two
              opposite readings — see PolicyValue's documentation, which also names
              the two fields this sentinel deliberately does NOT guard.
            name: QueueMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: a policy field has no usable value and no default the SDK could invent; the field names which"
            public: The queue policy is not one this broker can honour
            reason: QUEUE_MISCONFIGURED
          - code: CodeMessageTooLarge
            doc: |-
              MessageTooLarge refuses a Publish whose payload exceeds the policy's
              bound. It is refused at the producer, because that is the only place
              the payload can still be made smaller — a consumer discovering it
              cannot do anything about it, and a broker accepting it lets one
              producer fill a device every other producer shares.

              Its fields carry the two SIZES and never the payload.
            name: MessageTooLarge
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: payload larger than PolicyValue.MaxMessageBytes; the fields carry both sizes, never the bytes"
            public: The message payload exceeds the queue's configured maximum size
            reason: MESSAGE_TOO_LARGE
          - code: CodeUnknownReceipt
            doc: |-
              UnknownReceipt refuses an acknowledgement naming a lease this broker
              never issued, or one whose encoding it cannot read.

              It is distinct from LeaseExpired on purpose. "This was yours and you
              were too slow" and "this was never yours" are different bugs: the
              first is a visibility timeout too short for the handler, the second is
              a receipt built by hand, kept across a restart of an in-memory broker,
              or handed to the wrong queue. Collapsing them would send every reader
              looking for the wrong one half the time.
            name: UnknownReceipt
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: receipt unparseable or never issued by this broker; the field carries no payload"
            public: The receipt does not name a lease this queue issued
            reason: UNKNOWN_RECEIPT
          - code: CodeLeaseExpired
            doc: |-
              LeaseExpired reports an Ack, Nack or Extend whose lease had already
              lapsed. NOTHING happened: the message is back in the queue or in the
              dead-letter store, and another consumer may already hold it.

              Reporting it beats returning nil, for the reason core/app/lock gives about
              releasing a lock one no longer holds: a holder that lost its claim must
              not be able to end somebody else's turn, and must find out that it lost
              it. A consumer that gets this has produced a duplicate — which the
              at-least-once guarantee permits — and the one thing it must not do is
              believe the work is finished.
            name: LeaseExpired
            options:
              - errs.WithExitCode(exitTempFail)
            private: "core/data/queue: visibility timeout elapsed before Ack/Nack/Extend; the message is queued again or dead-lettered"
            public: The lease on that message has expired and the acknowledgement was ignored
            reason: LEASE_EXPIRED
          - code: CodeInvalidBatchSize
            doc: |-
              InvalidBatchSize refuses a Receive or DeadLetters asked for a
              non-positive count.

              Returning an empty slice instead would be ADR 0031's inert policy: a
              consumer loop asking for zero messages spins forever, processes
              nothing, reports no error, and looks exactly like an idle queue.
            name: InvalidBatchSize
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/data/queue: Receive/DeadLetters called with max <= 0, which would poll forever and deliver nothing"
            public: A batch size must be positive
            reason: INVALID_BATCH_SIZE
          - code: CodeNotRetryable
            doc: |-
              NotRetryable is the failure a handler reports when no retry can fix it:
              returned as it is, or — the usual form — added by DoNotRetry to the
              handler's own cause. The consumer engine recognises its code with
              errs.HasCode and dead-letters the message at once through a broker's
              Rejecter, instead of spending MaxDeliveries leases on an outcome
              already known.

              Returned bare, it is the cause the dead letter records. Added by
              DoNotRetry to an SDK error it is only a mark in the wrap trail, and the
              error's own Reason, Code and Public are what the dead letter keeps:
              origin wins (CLAUDE.md rule 6), which is the reason an investigator
              needs.
            name: NotRetryable
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/data/queue: a handler declared a failure no retry can fix; the engine dead-letters the message at once with the handler's own cause"
            public: The message cannot be processed and was dead-lettered without a retry
            reason: NOT_RETRYABLE
          - code: CodeDeadLetterNotFound
            doc: |-
              DeadLetterNotFound refuses a replay or a deletion naming a dead letter
              the store does not hold: one that never died, or was already replayed
              or deleted — by this caller or, concurrently, by another. Nothing moved.
            name: DeadLetterNotFound
            options:
              - errs.WithExitCode(exitNoInput)
              - errs.WithHTTPStatus(httpNotFound)
            private: "core/data/queue: the dead-letter store holds no message under the identifier; nothing was replayed or deleted"
            public: No dead letter has that identifier
            reason: DEAD_LETTER_NOT_FOUND
          - code: CodeQueueBackendFailed
            doc: |-
              QueueBackendFailed reports a refusal from a durable broker's storage:
              for the file broker the operating system's — an open, a rename, an
              unlink, a directory read or a flush — and for the SQL broker a
              statement its database did not complete.

              The cause stays in the chain, so a caller may still ask
              errors.Is(err, fs.ErrNotExist), reach the *fs.PathError, or reach a
              driver's own error with errors.As. Its fields name the operation and,
              where it is not the payload, the path or the table — never the message
              bytes; and the SQL broker WITHHOLDS the driver's text from every
              rendering, because a driver quotes the row a statement touched.
            name: QueueBackendFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/data/queue: a filesystem call or a SQL statement failed; the fields name the operation and where, never the payload"
            public: The queue's storage refused an operation
            reason: QUEUE_BACKEND_FAILED
          - code: CodeSQLQueueMisconfigured
            doc: |-
              SQLQueueMisconfigured refuses, at construction, an SQLConfig no SQL
              broker could run: a nil Transactor, one that is not a core/data/sql Joiner
              and Deferrer — without which a publication could neither join the
              caller's transaction nor wake a consumer after its commit — a dialect
              the SDK does not speak, or a table name that is not a lower-case SQL
              identifier the broker can interpolate safely. The "setting" and
              "problem" fields name which (ADR 0151).
            name: SQLQueueMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: the SQL broker's transactor, dialect or table is unusable; the fields name the setting and the problem"
            public: The SQL queue's configuration cannot be used
            reason: SQL_QUEUE_MISCONFIGURED
          - code: CodeQueueDirectoryUnusable
            doc: |-
              QueueDirectoryUnusable refuses a queue directory at CONSTRUCTION.

              A durable queue whose directory any account may write is a queue any
              account may inject work into or silently drain, and the failure is
              invisible: messages simply stop arriving. It is the same refusal
              service/app/lock makes about its lock directory, and it is made at wiring
              time for the same reason — at first use it would be a mystery, at
              construction it names the directory.
            name: QueueDirectoryUnusable
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: the queue directory is missing, is not a directory, or is writable by other accounts"
            public: The queue directory cannot be used safely
            reason: QUEUE_DIRECTORY_UNUSABLE
          - code: CodeConsumerMisconfigured
            doc: |-
              ConsumerMisconfigured refuses a ConsumerConfig the engine cannot run.

              It is the sentinel behind the domain's one mandatory assertion. This
              queue delivers AT LEAST ONCE, so a handler will be called twice for
              one message — after a crash, after a lease expiry, after a slow
              downstream. The SDK cannot detect whether that is safe, so it makes
              the caller say so in code: ConsumerConfig.HandlerIsIdempotent, whose
              zero value is false and is refused. That is exactly
              resilience.HedgeConfig.Idempotent's instrument, for exactly its reason
              — a precondition the SDK cannot check becomes a required, greppable
              assertion instead of a comment nobody reads.
            name: ConsumerMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/queue: Handler is nil, or HandlerIsIdempotent is false under an at-least-once queue; the field names which"
            public: The consumer configuration is not runnable and was refused
            reason: CONSUMER_MISCONFIGURED
          - code: CodeHandlerPanicked
            doc: |-
              HandlerPanicked is the failure of a handler whose call panicked.

              The engine recovers it rather than letting it reach the runtime: a
              panic escaping one handler would kill the consumer PROCESS, abandoning
              every other in-flight lease — which then has to time out, one
              visibility timeout at a time, before anything moves again. Recovered,
              it becomes an ordinary nack: this message is retried and eventually
              dead-lettered, and its siblings are untouched.

              The recovered value and the panicking goroutine's stack travel as
              FIELDS, never as the wrap origin, so a panic carrying an *errs.Error
              cannot hijack this code.
              A handler that merely RETURNS an error gets no sentinel of its own:
              Consume hands that error to Broker.Nack unmodified. service/app/events
              joins its ListenerFailed verdict beside the listener's cause because
              Publish returns the aggregate to a caller who must be able to ask "did
              anything fail?"; here the aggregate's destination is a dead-letter
              record, which already says that by existing and has structured fields
              for the rest. A verdict around the cause would displace the reason an
              investigator needs, and TestAFailingHandlerIsRetriedAndThenDeadLettered
              pins that it does not.
            name: HandlerPanicked
            private: "service/data/queue: handler panicked; the fields carry the message id, the panic value and the stack"
            public: The queue handler panicked and was recovered
            reason: HANDLER_PANICKED
    types:
      - name: DeadLetterValue
        struct:
          fields:
            - name: FailedAt
              type: time.Time
            - name: Reason
              type: string
            - name: Cause
              type: string
            - name: Message
              type: MessageValue
            - name: Code
              type: uint32
            - name: Deliveries
              type: int
      - name: MessageValue
        struct:
          fields:
            - name: EnqueuedAt
              type: time.Time
            - name: ID
              type: string
            - name: Payload
              type: "[]byte"
      - name: ReceiptValue
        underlying: string
      - name: LeaseValue
        struct:
          fields:
            - name: ExpiresAt
              type: time.Time
            - name: Receipt
              type: ReceiptValue
      - name: DeliveryValue
        struct:
          fields:
            - name: Lease
              type: LeaseValue
            - name: Message
              type: MessageValue
            - name: Deliveries
              type: int
      - methods:
          - name: Validate
            out:
              - type: error
            recv: value
          - name: Normalized
            out:
              - type: PolicyValue
            recv: value
        name: PolicyValue
        struct:
          fields:
            - name: VisibilityTimeout
              type: time.Duration
            - name: RetryDelay
              type: time.Duration
            - name: MaxRetryDelay
              type: time.Duration
            - name: MaxDeliveries
              type: int
            - name: MaxMessageBytes
              type: int
      - name: Handler
        underlying: func(ctx context.Context, delivery DeliveryValue) error
      - name: NackValue
        struct:
          fields:
            - name: Deliveries
              type: int
            - name: VisibleAt
              type: time.Time
            - name: DeadLettered
              type: bool
      - name: WakeValue
        struct:
          fields:
            - name: Signal
              type: <-chan struct{}
            - name: In
              type: time.Duration
            - name: Scheduled
              type: bool
  - constants:
      - name: DefaultPollInterval
        type: time.Duration
        value: "100000000"
      - name: MaxSQLTableLen
        type: int
        value: "63"
    functions:
      - in:
          - name: ctx
            type: context.Context
          - name: broker
            type: corequeue.Broker
          - name: cfg
            type: ConsumerConfig
        name: Consume
        out:
          - type: error
      - in:
          - name: cfg
            type: FileConfig
        name: NewFile
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - in:
          - name: cfg
            type: MemoryConfig
        name: NewMemory
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - in:
          - name: cfg
            type: SQLConfig
        name: NewSQL
        out:
          - name: broker
            type: corequeue.Broker
          - name: err
            type: error
      - in:
          - name: dialect
            type: coresql.Dialect
          - name: table
            type: string
          - name: version
            type: uint64
        name: SQLMigration
        out:
          - type: coresql.MigrationValue
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corequeue: github.com/kitsunium/sdk/internal/core/data/queue
      coresql: github.com/kitsunium/sdk/internal/core/data/sql
    path: github.com/kitsunium/sdk/internal/service/data/queue
    types:
      - name: ConsumerConfig
        struct:
          fields:
            - name: Handler
              type: corequeue.Handler
            - name: Clock
              type: clock.Timed
            - name: PollInterval
              type: time.Duration
            - name: Parallelism
              type: int
            - name: BatchSize
              type: int
            - name: HandlerIsIdempotent
              type: bool
      - name: FileConfig
        struct:
          fields:
            - name: Clock
              type: clock.Clock
            - name: Dir
              type: string
            - name: Policy
              type: corequeue.PolicyValue
      - name: MemoryConfig
        struct:
          fields:
            - name: Clock
              type: clock.Clock
            - name: Policy
              type: corequeue.PolicyValue
      - name: SQLConfig
        struct:
          fields:
            - name: Transactor
              type: coresql.Transactor
            - name: Clock
              type: clock.Clock
            - name: Table
              type: string
            - name: Policy
              type: corequeue.PolicyValue
            - name: Dialect
              type: coresql.Dialect
  - facade:
      - const:
          - doc: |-
              DefaultMaxMessageBytes is the payload bound applied when
              [Policy].MaxMessageBytes is left at zero: one mebibyte.
            name: DefaultMaxMessageBytes
            reexport: corequeue.DefaultMaxMessageBytes
            type: int
            typed: true
            value: 1 << 20
      - const:
          - doc: |-
              MaxDeadlineOffset is the ceiling on [Policy].VisibilityTimeout and
              [Policy].RetryDelay: a century, refused above it rather than clamped,
              because a deadline past 2262 cannot be written into the durable broker's
              file names and read back.
            name: MaxDeadlineOffset
            reexport: corequeue.MaxDeadlineOffset
            type: time.Duration
            typed: true
            value: "3153600000000000000"
      - const:
          - doc: |-
              DefaultPollInterval is how long an idle worker waits before asking again
              when [ConsumerConfig].PollInterval is left at zero. With a [Waker] broker it
              bounds only how late another process's publication is noticed.
            name: DefaultPollInterval
            reexport: svcqueue.DefaultPollInterval
            type: time.Duration
            typed: true
            value: "100000000"
      - const:
          - doc: |-
              MaxSQLTableLen is the longest table name [NewSQL] and [SQLMigration] accept,
              in bytes: PostgreSQL's identifier limit.
            name: MaxSQLTableLen
            reexport: svcqueue.MaxSQLTableLen
            type: int
            typed: true
            value: "63"
      - const:
          - doc: |-
              CodeNotRetryable is the code [DoNotRetry] adds to a failure's wrap
              trail: errs.HasCode(err, CodeNotRetryable) recognises the mark, where
              errors.Is(err, NotRetryable) sees only an origin.
            name: CodeNotRetryable
            reexport: corequeue.CodeNotRetryable
            type: errs.Code
            typed: true
            value: "0x00_02_17_06"
          - doc: CodeDeadLetterNotFound is [DeadLetterNotFound]'s code.
            name: CodeDeadLetterNotFound
            reexport: corequeue.CodeDeadLetterNotFound
            type: errs.Code
            typed: true
            value: "0x00_02_17_07"
          - doc: CodeSQLQueueMisconfigured is [SQLQueueMisconfigured]'s code.
            name: CodeSQLQueueMisconfigured
            reexport: corequeue.CodeSQLQueueMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_03_35_05"
        doc: The codes of the sentinels ADR 0151 added, for errs.HasCode.
      - alias:
          - doc: |-
              Broker is the public alias for the queue contract. It is FROZEN at four
              methods; capabilities arrive as siblings ([DeadLetterReader],
              [LeaseExtender], [Waker], [Rejecter], [DeadLetterManager]) reached by type
              assertion.
            name: Broker
            target: corequeue.Broker
      - alias:
          - doc: Handler is the public alias for the function that processes one delivery.
            name: Handler
            target: corequeue.Handler
      - alias:
          - doc: Message is the public alias for one unit of work as the broker minted it.
            name: Message
            target: corequeue.MessageValue
      - alias:
          - doc: |-
              Delivery is the public alias for one message handed to one consumer,
              carrying the lease that proves the claim and the count that says whether
              this is a retry.
            name: Delivery
            target: corequeue.DeliveryValue
      - alias:
          - doc: Lease is the public alias for a consumer's exclusive claim on one message.
            name: Lease
            target: corequeue.LeaseValue
      - alias:
          - doc: |-
              Receipt is the public alias for the opaque handle to one lease. Do not
              parse it and do not construct one.
            name: Receipt
            target: corequeue.ReceiptValue
      - alias:
          - doc: |-
              Nack is the public alias for what [Broker].Nack decided: retried, or
              dead-lettered.
            name: Nack
            target: corequeue.NackValue
      - alias:
          - doc: Policy is the public alias for the delivery discipline a broker enforces.
            name: Policy
            target: corequeue.PolicyValue
      - alias:
          - doc: DeadLetter is the public alias for one abandoned message and its cause.
            name: DeadLetter
            target: corequeue.DeadLetterValue
      - alias:
          - doc: |-
              DeadLetterReader is the public alias for the capability of reading the
              dead-letter store back. Every broker here implements it.
            name: DeadLetterReader
            target: corequeue.DeadLetterReader
      - alias:
          - doc: |-
              LeaseExtender is the public alias for the capability of renewing a lease a
              handler is still working under. Every broker here implements it.
            name: LeaseExtender
            target: corequeue.LeaseExtender
      - alias:
          - doc: |-
              Waker is the public alias for the capability of telling an idle consumer
              when to look again. Every broker here implements it, and Consume uses it; a
              broker of your own that omits it is simply polled.
            name: Waker
            target: corequeue.Waker
      - alias:
          - doc: |-
              Wake is the public alias for what an idle consumer waits on: a signal the
              next Publish or Nack in this process closes, and how long until something
              the broker holds becomes receivable on its own.
            name: Wake
            target: corequeue.WakeValue
      - alias:
          - doc: |-
              Rejecter is the public alias for the capability of dead-lettering a leased
              message at once, with the cause that condemned it. Every broker here
              implements it, and Consume uses it for a [DoNotRetry] failure.
            name: Rejecter
            target: corequeue.Rejecter
      - alias:
          - doc: |-
              DeadLetterManager is the public alias for the capability of replaying a
              dead letter into its queue, its count reset, or deleting it. Every broker
              here implements it.
            name: DeadLetterManager
            target: corequeue.DeadLetterManager
      - alias:
          - doc: |-
              SQLConfig is the public alias for [NewSQL]'s configuration: Transactor,
              Dialect and Table (required), Policy, and Clock.
            name: SQLConfig
            target: svcqueue.SQLConfig
      - alias:
          - doc: FileConfig is the public alias for [NewFile]'s configuration.
            name: FileConfig
            target: svcqueue.FileConfig
      - alias:
          - doc: MemoryConfig is the public alias for [NewMemory]'s configuration.
            name: MemoryConfig
            target: svcqueue.MemoryConfig
      - alias:
          - doc: ConsumerConfig is the public alias for [Consume]'s configuration.
            name: ConsumerConfig
            target: svcqueue.ConsumerConfig
      - var:
          - doc: QueueMisconfigured refuses a Policy field the broker cannot honour.
            name: QueueMisconfigured
            reexport: corequeue.QueueMisconfigured
            type: "*errs.Error"
          - doc: |-
              MessageTooLarge refuses a payload above the policy's bound, at the
              producer, where it can still be made smaller.
            name: MessageTooLarge
            reexport: corequeue.MessageTooLarge
            type: "*errs.Error"
          - doc: |-
              UnknownReceipt refuses an acknowledgement naming a lease this queue
              never issued.
            name: UnknownReceipt
            reexport: corequeue.UnknownReceipt
            type: "*errs.Error"
          - doc: |-
              LeaseExpired reports an acknowledgement whose lease had already lapsed.
              Nothing happened, and the message is elsewhere.
            name: LeaseExpired
            reexport: corequeue.LeaseExpired
            type: "*errs.Error"
          - doc: InvalidBatchSize refuses a non-positive batch size.
            name: InvalidBatchSize
            reexport: corequeue.InvalidBatchSize
            type: "*errs.Error"
          - doc: |-
              NotRetryable is the failure no retry can fix: what a dead letter
              records when [DoNotRetry] marked an error with no public words of its
              own, or none at all.
            name: NotRetryable
            reexport: corequeue.NotRetryable
            type: "*errs.Error"
          - doc: |-
              DeadLetterNotFound refuses a replay or a deletion naming a dead letter
              the store does not hold.
            name: DeadLetterNotFound
            reexport: corequeue.DeadLetterNotFound
            type: "*errs.Error"
          - doc: |-
              SQLQueueMisconfigured refuses an SQLConfig no SQL broker could run: no
              transactor, one it cannot join a transaction of, a dialect it cannot
              spell, or a table name it cannot use.
            name: SQLQueueMisconfigured
            reexport: corequeue.SQLQueueMisconfigured
            type: "*errs.Error"
          - doc: |-
              QueueBackendFailed reports a refusal from a durable broker's storage:
              the filesystem's, or a statement the SQL broker's database did not
              complete.
            name: QueueBackendFailed
            reexport: corequeue.QueueBackendFailed
            type: "*errs.Error"
          - doc: |-
              QueueDirectoryUnusable refuses a queue directory that is missing, is
              not a directory, or is writable by accounts that must not be able to
              inject or drain messages.
            name: QueueDirectoryUnusable
            reexport: corequeue.QueueDirectoryUnusable
            type: "*errs.Error"
          - doc: |-
              ConsumerMisconfigured refuses a consumer with no Handler, or one whose
              author has not asserted HandlerIsIdempotent.
            name: ConsumerMisconfigured
            reexport: corequeue.ConsumerMisconfigured
            type: "*errs.Error"
          - doc: |-
              HandlerPanicked reports a recovered handler panic. The message was
              nacked and the consumer kept running.

              There is deliberately no HandlerFailed beside it: a handler that
              returns an error has its error recorded in the dead letter unmodified,
              because a verdict wrapped around it would displace the reason whoever
              reads that record actually needs.
            name: HandlerPanicked
            reexport: corequeue.HandlerPanicked
            type: "*errs.Error"
      - func:
          doc: |-
            NewFile returns the durable broker: its whole state is the directory in
            cfg.Dir, so it survives the process that published into it and two brokers
            over one directory are one queue.

            It refuses at construction — never at first use — a policy it cannot
            honour, a directory it cannot use safely, and a platform with no atomic
            replace or no flushable directory handle. Windows is such a platform: after
            the directory checks — which read its access control lists there — NewFile
            returns the SDK's UNSUPPORTED_PLATFORM, matched with
            errors.Is(err, proc.UnsupportedPlatform).

            The broker holds two directory descriptors and additionally implements
            io.Closer, which releases them — reached by type assertion, as the session
            file store's is, so Broker grows no method:

            	if closer, ok := broker.(io.Closer); ok { defer closer.Close() }

            The messages stay on disk; every call after Close fails.
          forward: svcqueue.NewFile
          in:
            - name: cfg
              type: FileConfig
          name: NewFile
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            NewSQL returns a durable broker whose queue is one table of the caller's
            database, created by [SQLMigration]. Every call runs on the transaction its
            context carries for cfg.Transactor, so a message published inside that
            transaction exists if and only if it commits. It sends no statement.

            It refuses at construction — never at first use — a policy it cannot honour
            and a transactor, dialect or table it cannot use ([SQLQueueMisconfigured]).
            The transactor must be the SDK's, or another core/data/sql Joiner and Deferrer.
          forward: svcqueue.NewSQL
          in:
            - name: cfg
              type: SQLConfig
          name: NewSQL
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            SQLMigration returns the migration that creates the one table an SQL queue
            named table keeps on dialect, numbered version for the caller's own version
            table. Its Down drops the table, and every message in it. Its statement does
            nothing when the table exists.
          forward: svcqueue.SQLMigration
          in:
            - name: dialect
              type: sql.Dialect
            - name: table
              type: string
            - name: version
              type: uint64
          name: SQLMigration
          out:
            - type: sql.Migration
            - type: error
      - func:
          doc: |-
            DoNotRetry marks cause as a failure no retry can fix: returned from a
            [Handler], it makes [Consume] dead-letter the message at once, with cause,
            instead of handing it back for another attempt. An SDK error keeps its own
            reason, code and public words in the dead letter; any other error, or none,
            is recorded as [NotRetryable].
          forward: corequeue.DoNotRetry
          in:
            - name: cause
              type: error
          name: DoNotRetry
          out:
            - type: error
      - func:
          doc: |-
            NewMemory returns the in-process test double: the port's full semantics,
            no directory, no flush, and nothing that survives the process.

            It refuses the same policies [NewFile] refuses, through the same guard,
            which is what makes it an honest double.
          forward: svcqueue.NewMemory
          in:
            - name: cfg
              type: MemoryConfig
          name: NewMemory
          out:
            - name: broker
              type: Broker
            - name: err
              type: error
      - func:
          doc: |-
            Consume runs cfg.Handler against broker until ctx is done, on
            cfg.Parallelism goroutines it owns.

            It returns nil when ctx ends — a cancelled consumer is a stopped consumer,
            not a failed one — and returns the broker's error when the STORAGE fails. A
            handler's error is never returned: it is nacked, retried, and eventually
            dead-lettered, which is the entire point of the domain.

            cfg.HandlerIsIdempotent must be true; see the package documentation.
          forward: svcqueue.Consume
          in:
            - name: ctx
              type: context.Context
            - name: broker
              type: Broker
            - name: cfg
              type: ConsumerConfig
          name: Consume
          out:
            - type: error
    imports:
      corequeue: github.com/kitsunium/sdk/internal/core/data/queue
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      sql: github.com/kitsunium/sdk/pkg/v1/data/sql
      svcqueue: github.com/kitsunium/sdk/internal/service/data/queue
    path: github.com/kitsunium/sdk/pkg/v1/data/queue
