            reexport: coredocstore.CodePersistFailed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0A"
          - doc: "CodeLoadFailed: the store's files cannot be read or are not a store's."
            name: CodeLoadFailed
            reexport: coredocstore.CodeLoadFailed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0B"
          - doc: "CodeIndexBroken: the stored documents break a unique index."
            name: CodeIndexBroken
            reexport: coredocstore.CodeIndexBroken
            type: errs.Code
            typed: true
            value: "0x00_03_50_0C"
          - doc: "CodeStoreClosed: a call after Close."
            name: CodeStoreClosed
            reexport: coredocstore.CodeStoreClosed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0D"
          - doc: "CodeStoreMisconfigured: Open refused its configuration."
