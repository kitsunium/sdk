            type: errs.Code
            typed: true
            value: "0x00_03_50_04"
          - doc: "CodeDocumentKeyChanged: an Update's function changed the key."
            name: CodeDocumentKeyChanged
            reexport: coredocstore.CodeDocumentKeyChanged
            type: errs.Code
            typed: true
            value: "0x00_03_50_05"
          - doc: "CodeIndexUnknown: a read named an index the store never declared."
            name: CodeIndexUnknown
            reexport: coredocstore.CodeIndexUnknown
            type: errs.Code
            typed: true
            value: "0x00_03_50_06"
          - doc: "CodeIndexNotUnique: Lookup on a multi-valued index."
            name: CodeIndexNotUnique
            reexport: coredocstore.CodeIndexNotUnique
            type: errs.Code
            typed: true
            value: "0x00_03_50_07"
          - doc: "CodeDocumentUndecodable: a stored document no longer fits the type."
            name: CodeDocumentUndecodable
            reexport: coredocstore.CodeDocumentUndecodable
            type: errs.Code
            typed: true
            value: "0x00_03_50_08"
          - doc: "CodeDocumentUnencodable: encoding/json refused the value."
