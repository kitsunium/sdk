apiVersion: kit.kitsunium/design/v2
domain: data/docstore
packages:
  - codes:
      - const:
          - doc: |-
              CodeDocumentNotFound identifies a read, an update, a replacement or a
              deletion of a key the store holds no document under, and a unique-index
              lookup that finds nobody.
            name: CodeDocumentNotFound
            note: "range: 0.3.80.0 - 0.3.80.255"
            value: "0x00_03_50_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentExists identifies an insertion under a key the store already
              holds a document under.
            name: CodeDocumentExists
            value: "0x00_03_50_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUniqueKeyTaken identifies a write a unique index refuses: another
              document already holds one of its keys in that index.
            name: CodeUniqueKeyTaken
            value: "0x00_03_50_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentKeyEmpty identifies a document whose key function returned the
              empty string.
            name: CodeDocumentKeyEmpty
            value: "0x00_03_50_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentKeyChanged identifies an update whose function changed the key
              of the document it was given.
            name: CodeDocumentKeyChanged
            value: "0x00_03_50_05"
        type: errs.Code
      - const:
          - doc: CodeIndexUnknown identifies a lookup in an index the store never declared.
            name: CodeIndexUnknown
            value: "0x00_03_50_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeIndexNotUnique identifies a single-document lookup in an index that may
              file several documents under one key.
            name: CodeIndexNotUnique
            value: "0x00_03_50_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeDocumentUndecodable identifies a stored document that no longer decodes
              into the store's type.
            name: CodeDocumentUndecodable
            value: "0x00_03_50_08"
        type: errs.Code
      - const:
          - doc: CodeDocumentUnencodable identifies a value encoding/json cannot encode.
            name: CodeDocumentUnencodable
            value: "0x00_03_50_09"
        type: errs.Code
      - const:
          - doc: CodePersistFailed identifies a write the filesystem did not make durable.
            name: CodePersistFailed
            value: "0x00_03_50_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoadFailed identifies a store whose files could not be read or are not
              a store's files.
            name: CodeLoadFailed
            value: "0x00_03_50_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeIndexBroken identifies stored documents that break a unique index, or
              an index key function that panicked while the store was opening.
            name: CodeIndexBroken
            value: "0x00_03_50_0C"
        type: errs.Code
      - const:
          - doc: CodeStoreClosed identifies a call on a store that has been closed.
            name: CodeStoreClosed
            value: "0x00_03_50_0D"
        type: errs.Code
      - const:
          - doc: CodeStoreMisconfigured identifies a configuration no store could honour.
            name: CodeStoreMisconfigured
            value: "0x00_03_50_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeWriteUnconfirmed identifies a write the filesystem published but could
              not confirm durable: the directory flush after the rename failed. The write
              took effect — every reader of the files sees it, and so does the store.
            name: CodeWriteUnconfirmed
            value: "0x00_03_50_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeStatementFailed identifies a call the SQL store's database did not
              complete: it could not be reached, or it refused a statement for a reason
              that is not one of the store's own refusals. The driver's error travels
              beside it, withheld from its text.
            name: CodeStatementFailed
            value: "0x00_03_50_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyTooLong identifies a write whose store key, or one of whose index
              keys, is longer than the SQL store's key columns hold.
            name: CodeKeyTooLong
            value: "0x00_03_50_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionsNotKept identifies a call on a document's versions to a store
              that keeps none: its configuration's Versions is zero.
            name: CodeVersionsNotKept
            value: "0x00_03_50_12"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionNotFound identifies a read of a version its document does not
              keep: never made, or pruned.
            name: CodeVersionNotFound
            value: "0x00_03_50_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionsRewriteRefused identifies a rewrite of a document's versions
              whose function returned what a rewrite may not: a version it was not given,
              out of order, with another instant, or that is not JSON.
            name: CodeVersionsRewriteRefused
            value: "0x00_03_50_14"
        type: errs.Code
    doc: |-
      Package docstore — range 0.3.80.* (ADR 0110 service/data/docstore block;
      ADR 0139 added 16 and 17, ADR 0143 18 to 20). Both engines answer every one
      of them alike, and the range keeps the LL = 3 its engine allocated it under
      now that it is declared here (ADR 0160).

      Package docstore declares the document-store domain: typed, keyed JSON
      documents with unique and multi-valued secondary indexes, kept by two
      engines under one contract — the file engine in memory or through
      core/data/vfs (ADR 0110), the SQL engine in a database the caller owns
      (ADR 0139), both keeping a document's versions in its own write when asked
      (ADR 0143).

      It holds what the two engines share and nothing only one of them has:

        - the ports. [Collection] is a store whose calls take no context, which
          the file engine is; [CollectionContext] is the same calls, each taking
          a context first, which the SQL engine is. [Versioned] and
          [VersionedContext] are their siblings for a document's versions, and
          [Announcer] is the pair of hooks both engines answer exactly as they
          are;
        - the values both engines read and return — [EntryValue], [VersionValue],
          [StampValue] — and [IndexSpec], the declaration both take, with its two
          constructors [Unique] and [Index];
        - the codes of the 0.3.80.* range and their sentinels: both engines answer
          the same refusals under the same codes (ADR 0160).

      There are two ports and not one because the engines differ on the one
      thing a single interface would have to fix: the file engine waits on
      nothing a caller could abandon and takes no context (ADR 0110 §D6), while
      every call of the SQL engine waits on a database and takes one. A single
      port would give the file engine a context it cannot honour, or take the SQL
      engine's away (ADR 0139 §D2). So each port is the contract of one shape of
      call, with the same methods, the same documents and the same refusals.

      The engines, their configurations, the file engine's statistics and every
      statement live in internal/service/data/docstore.

      Package docstore — the siblings of Collection (ADR 0039): a document's
      versions, and the same two ports with a context on every call, which the SQL
      engine implements.

      Package docstore — declares the sentinel *errs.Error outcomes both engines
      answer. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.

      No Public and no Private below carries a key or a document. A store key is
      routinely an e-mail address or the hash of a token, and an index key is
      usually exactly the value a caller must not learn back from a refusal: the
      fields name the index and the operation, never what was looked up.

      The HTTP statuses are spelled as the integers errs.WithHTTPStatus takes,
      each named after its status: the core imports no net/http to read five
      numbers (ADR 0160).

      Package docstore — the declaration of a secondary index, which both engines
      take at construction and file by the same rule.

      Package docstore — the values both engines read and return: a stored
      document as JSON, one version of a document, and what a write says about the
      version it makes.
    functions:
      - doc: |-
          Unique declares a unique index over the one key key returns: no two
          documents may share it, and a write that would is refused with
          [UniqueKeyTaken]. An empty key is not indexed, so any number of documents
          may have none.
        in:
          - name: name
            type: string
          - name: key
            type: func(T) string
        name: Unique
        out:
          - type: IndexSpec[T]
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Index declares an index where a document may have several keys and a key
          several documents — the members a task is shared with. Find reads it.
        in:
          - name: name
            type: string
          - name: keys
            type: func(T) []string
        name: Index
        out:
          - type: IndexSpec[T]
        typeParams:
          - constraint: any
            name: T
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      json: encoding/json
    path: github.com/kitsunium/sdk/internal/core/data/docstore
    ports:
      - doc: |-
          Announcer is the pair of hooks a document store answers: both engines
          implement it exactly as it is. A registered function is told the key of
          every document a write stored or a deletion removed once that write stands —
          durable for the file engine, committed for the SQL engine, and never for a
          write rolled back — on the writer's goroutine and outside every lock of the
          store.
        methods:
          - doc: |-
              OnWrite registers fn to be told the key of every document Put, Insert,
              Replace or Update stored, and returns the function that removes the
              registration. A nil fn registers nothing. A panic in fn reaches the
              writer after its write stood.
            in:
              - name: fn
                type: func(key string)
            name: OnWrite
            out:
              - name: remove
                type: func()
          - doc: |-
              OnDelete registers fn to be told the key of every document Delete
              removed, on the same terms as OnWrite.
            in:
              - name: fn
                type: func(key string)
            name: OnDelete
            out:
              - name: remove
                type: func()
        name: Announcer
      - doc: |-
          Collection is a typed, keyed collection of JSON documents with secondary
          indexes whose calls take no context — the port the file engine,
          internal/service/data/docstore.Store, implements. Every read returns a
          copy and every write stores one: a document is kept as its JSON encoding,
          so what a caller holds never aliases what the store holds. No refusal
          quotes a key.

          The versions of a document are [Versioned], its sibling; the file engine's
          Stats, Fold and Close are the engine's own, because a double of the port has
          no files to fold.
        embeds:
          - Announcer
        methods:
          - doc: Get returns the document stored under key, or DOCUMENT_NOT_FOUND.
            in:
              - name: key
                type: string
            name: Get
            out:
              - type: T
              - type: error
          - doc: List returns every document, in key order.
            name: List
            out:
              - type: "[]T"
              - type: error
          - doc: |-
              Filter returns the documents keep accepts, in key order. It decodes
              every document; an index is the way not to.
            in:
              - name: keep
                type: func(T) bool
            name: Filter
            out:
              - type: "[]T"
              - type: error
          - doc: |-
              Entries returns up to limit stored documents as JSON, in key order —
              every one when limit is not positive — each a copy the caller owns.
            in:
              - name: limit
                type: int
            name: Entries
            out:
              - type: "[]EntryValue"
              - type: error
          - doc: |-
              Lookup returns the document holding key in the unique index named
              index: DOCUMENT_NOT_FOUND when none does, INDEX_UNKNOWN for an index the
              store never declared, INDEX_NOT_UNIQUE for one that may file several.
            in:
              - name: index
              - name: key
                type: string
            name: Lookup
            out:
              - type: T
              - type: error
          - doc: |-
              Find returns the documents filed under key in the index named index, in
              store-key order. It reads any index, unique or not, and no document is
              an empty slice, not an error.
            in:
              - name: index
              - name: key
                type: string
            name: Find
            out:
              - type: "[]T"
              - type: error
          - doc: Put stores v under its key, creating it or replacing whatever was there.
            in:
              - name: v
                type: T
            name: Put
            out:
              - type: error
          - doc: |-
              Insert stores v, which must be new: DOCUMENT_EXISTS when its key is
              taken.
            in:
              - name: v
                type: T
            name: Insert
            out:
              - type: error
          - doc: |-
              Replace stores v over the document already under its key:
              DOCUMENT_NOT_FOUND when there is none, so a document deleted meanwhile
              is never brought back.
            in:
              - name: v
                type: T
            name: Replace
            out:
              - type: error
          - doc: |-
              Update applies fn to a copy of the document stored under key and stores
              the result, atomically with respect to every other write, and returns
              it. An error from fn is returned as it is and changes nothing, and so
              does a result whose key is not key (DOCUMENT_KEY_CHANGED). fn may read
              the store and must not write to it.
            in:
              - name: key
                type: string
              - name: fn
                type: func(*T) error
            name: Update
            out:
              - type: T
              - type: error
          - doc: |-
              Delete removes the document stored under key, or returns
              DOCUMENT_NOT_FOUND. Its versions go with it.
            in:
              - name: key
                type: string
            name: Delete
            out:
              - type: error
        name: Collection
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Versioned is a document's versions, on a store whose calls take no context:
          the sibling of [Collection] the file engine implements beside it (ADR 0143).
          A store that keeps no versions answers every call with VERSIONS_NOT_KEPT,
          except the Stamped writes, which then store as their plain forms do.
        methods:
          - doc: PutStamped is Put, with what the write says about the version it makes.
            in:
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: PutStamped
            out:
              - type: error
          - doc: |-
              InsertStamped is Insert, with what the write says about the version it
              makes: version 1, whatever stamp.InPlace says.
            in:
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: InsertStamped
            out:
              - type: error
          - doc: |-
              ReplaceStamped is Replace, with what the write says about the version it
              makes.
            in:
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: ReplaceStamped
            out:
              - type: error
          - doc: |-
              UpdateStamped is Update, with what the write says about the version it
              makes.
            in:
              - name: key
                type: string
              - name: stamp
                type: StampValue
              - name: fn
                type: func(*T) error
            name: UpdateStamped
            out:
              - type: T
              - type: error
          - doc: |-
              Versions returns the versions kept of the document stored under key,
              newest first: the current one — the document as it is now — then the
              former ones. DOCUMENT_NOT_FOUND when no document is stored under key.
            in:
              - name: key
                type: string
            name: Versions
            out:
              - type: "[]VersionValue"
              - type: error
          - doc: |-
              Version returns the version numbered number of the document stored
              under key: VERSION_NOT_FOUND when the document keeps none of that
              number — never made, or pruned.
            in:
              - name: key
                type: string
              - name: number
                type: uint64
            name: Version
            out:
              - type: VersionValue
              - type: error
          - doc: |-
              RewriteVersions rewrites the former versions of the document stored
              under key in one durable write: fn receives copies of them, newest
              first, and returns those to keep, in the same order. It may drop a
              version and change what one holds and what its writer said, and nothing
              else — VERSIONS_REWRITE_REFUSED otherwise. An error from fn is returned
              as it is and changes nothing. It calls no hook: the document did not
              change.
            in:
              - name: key
                type: string
              - name: fn
                type: func(former []VersionValue) ([]VersionValue, error)
            name: RewriteVersions
            out:
              - type: error
        name: Versioned
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          CollectionContext is [Collection] with a context on every call — the port
          the SQL engine, internal/service/data/docstore.SQLStore, implements. A call
          runs on the transaction its context carries for the store's database, and on
          the pool otherwise; a write is atomic on its own either way, and its hooks
          run once the transaction that holds it has committed (ADR 0139). Every
          method answers as its Collection counterpart does, and may also fail as a
          database fails.

          The SQL engine's Count and Reindex are the engine's own: a double of the
          port has no tables to count or to file again.
        embeds:
          - Announcer
        methods:
          - doc: Get is Collection.Get under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Get
            out:
              - type: T
              - type: error
          - doc: List is Collection.List under ctx.
            in:
              - name: ctx
                type: context.Context
            name: List
            out:
              - type: "[]T"
              - type: error
          - doc: Filter is Collection.Filter under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: keep
                type: func(T) bool
            name: Filter
            out:
              - type: "[]T"
              - type: error
          - doc: Entries is Collection.Entries under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: limit
                type: int
            name: Entries
            out:
              - type: "[]EntryValue"
              - type: error
          - doc: Lookup is Collection.Lookup under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Lookup
            out:
              - type: T
              - type: error
          - doc: Find is Collection.Find under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Find
            out:
              - type: "[]T"
              - type: error
          - doc: Put is Collection.Put under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Put
            out:
              - type: error
          - doc: Insert is Collection.Insert under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Insert
            out:
              - type: error
          - doc: Replace is Collection.Replace under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Replace
            out:
              - type: error
          - doc: |-
              Update is Collection.Update under ctx: fn runs inside the write's
              transaction, and must not write the document it updates.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fn
                type: func(*T) error
            name: Update
            out:
              - type: T
              - type: error
          - doc: Delete is Collection.Delete under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Delete
            out:
              - type: error
        name: CollectionContext
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          VersionedContext is [Versioned] with a context on every call: the sibling of
          [CollectionContext] the SQL engine implements beside it. A write's version
          rows travel in that write's own transaction.
        methods:
          - doc: PutStamped is Versioned.PutStamped under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: PutStamped
            out:
              - type: error
          - doc: InsertStamped is Versioned.InsertStamped under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: InsertStamped
            out:
              - type: error
          - doc: ReplaceStamped is Versioned.ReplaceStamped under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: StampValue
            name: ReplaceStamped
            out:
              - type: error
          - doc: UpdateStamped is Versioned.UpdateStamped under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: stamp
                type: StampValue
              - name: fn
                type: func(*T) error
            name: UpdateStamped
            out:
              - type: T
              - type: error
          - doc: Versions is Versioned.Versions under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Versions
            out:
              - type: "[]VersionValue"
              - type: error
          - doc: Version is Versioned.Version under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: number
                type: uint64
            name: Version
            out:
              - type: VersionValue
              - type: error
          - doc: RewriteVersions is Versioned.RewriteVersions under ctx.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fn
                type: func(former []VersionValue) ([]VersionValue, error)
            name: RewriteVersions
            out:
              - type: error
        name: VersionedContext
        typeParams:
          - constraint: any
            name: T
    sentinels:
      - var:
          - code: CodeDocumentNotFound
            doc: |-
              DocumentNotFound is a miss: no document under that key, or no document
              holding that key in a unique index.
            name: DocumentNotFound
            options:
              - errs.WithHTTPStatus(httpNotFound)
            private: "service/data/docstore: the store holds no document under the key, or the unique index files nobody under it; the fields name the store and the index, never the key"
            public: No document has this key
            reason: DOCUMENT_NOT_FOUND
          - code: CodeDocumentExists
            doc: DocumentExists refuses an insertion under a key already taken.
            name: DocumentExists
            options:
              - errs.WithHTTPStatus(httpConflict)
            private: "service/data/docstore: Insert refuses a key the store already holds; Put replaces, Insert never does"
            public: A document already has this key
            reason: DOCUMENT_EXISTS
          - code: CodeUniqueKeyTaken
            doc: |-
              UniqueKeyTaken refuses a write a unique index cannot file: another
              document already holds one of its keys in that index. Nothing changed.
            name: UniqueKeyTaken
            options:
              - errs.WithHTTPStatus(httpConflict)
            private: "service/data/docstore: the write was refused before anything changed; the index field names the unique index, never the key"
            public: Another document already has this key in a unique index
            reason: UNIQUE_KEY_TAKEN
          - code: CodeDocumentKeyEmpty
            doc: DocumentKeyEmpty refuses a document whose key is the empty string.
            name: DocumentKeyEmpty
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: the store's key function returned the empty string"
            public: A document's key cannot be empty
            reason: DOCUMENT_KEY_EMPTY
          - code: CodeDocumentKeyChanged
            doc: |-
              DocumentKeyChanged refuses an update whose function changed the key of
              the document it was handed. Nothing changed.
            name: DocumentKeyChanged
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: the update function returned a document whose key differs from the one it was given; delete and insert to rename"
            public: An update cannot change a document's key
            reason: DOCUMENT_KEY_CHANGED
          - code: CodeIndexUnknown
            doc: IndexUnknown refuses a lookup in an index the store never declared.
            name: IndexUnknown
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: Lookup or Find named an index absent from the store's Config; the index field names it"
            public: The store has no index of this name
            reason: INDEX_UNKNOWN
          - code: CodeIndexNotUnique
            doc: |-
              IndexNotUnique refuses a single-document lookup in an index that may
              file several documents under one key.
            name: IndexNotUnique
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: Lookup returns one document and was given a multi-valued index; the index field names it"
            public: "The index is not unique: read it with Find"
            reason: INDEX_NOT_UNIQUE
          - code: CodeDocumentUndecodable
            doc: |-
              DocumentUndecodable reports a stored document that no longer fits the
              store's type — the type changed under data an older program wrote. The
              decoder's own error travels as a field, never as the origin.
            name: DocumentUndecodable
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/docstore: encoding/json could not decode a stored document into the store's type; the fields name the store and the cause"
            public: A stored document does not match its type
            reason: DOCUMENT_UNDECODABLE
          - code: CodeDocumentUnencodable
            doc: |-
              DocumentUnencodable refuses a value encoding/json cannot encode — a
              channel, a function, a cycle. Nothing changed.
            name: DocumentUnencodable
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
            private: "service/data/docstore: encoding/json refused the value; the fields name the store and the cause"
            public: The document cannot be encoded
            reason: DOCUMENT_UNENCODABLE
          - code: CodePersistFailed
            doc: |-
              PersistFailed reports a write the filesystem did not make durable. The
              store is unchanged: memory and disk still agree on the previous state.
            name: PersistFailed
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
              - errs.WithExitCode(exitIOErr)
            private: "service/data/docstore: the filesystem refused a publication; nothing changed in memory, and the fields name the store and the step"
            public: The document could not be written to storage
            reason: PERSIST_FAILED
          - code: CodeWriteUnconfirmed
            doc: |-
              WriteUnconfirmed reports a write the filesystem published but could
              not confirm durable — vfs's DirectorySyncFailed: the rename happened,
              the flush of the directory that records it did not. It is not
              PersistFailed, because the write TOOK EFFECT: the file shows it, so the
              store applies it too rather than disagree with its own files. What is
              in doubt is only whether it survives a power loss.
            name: WriteUnconfirmed
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
              - errs.WithExitCode(exitIOErr)
            private: "service/data/docstore: the publication's rename succeeded and the directory flush failed; the write stands in memory and on disk, and may not survive a power loss"
            public: The document was stored, but its durability could not be confirmed
            reason: WRITE_UNCONFIRMED
          - code: CodeLoadFailed
            doc: |-
              LoadFailed refuses to open a store whose files cannot be read, are not
              a store's files, or keep versions the store was not opened to keep.
            name: LoadFailed
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/docstore: Open could not read or parse the snapshot, the versions file or an overlay entry, or found versions it does not keep; the fields name the file and the problem"
            public: The store's files could not be loaded
            reason: LOAD_FAILED
          - code: CodeIndexBroken
            doc: |-
              IndexBroken refuses to open a store whose documents break a unique
              index — the index was added after the data, or a file was edited — or
              whose index key function panicked. A unique index that does not hold
              would be a lie every Lookup tells.
            name: IndexBroken
            options:
              - errs.WithHTTPStatus(httpInternalServerError)
              - errs.WithExitCode(exitDataErr)
            private: "service/data/docstore: two stored documents share a key in a unique index, or a key function panicked while the indexes were rebuilt; the fields name the index"
            public: The stored documents break a unique index
            reason: INDEX_BROKEN
          - code: CodeStoreClosed
            doc: StoreClosed refuses a call on a store that has been closed.
            name: StoreClosed
            options:
              - errs.WithHTTPStatus(httpServiceUnavailable)
            private: "service/data/docstore: Close was called; open the store again to use it"
            public: The store is closed
            reason: STORE_CLOSED
          - code: CodeStoreMisconfigured
            doc: |-
              StoreMisconfigured refuses a configuration no store could honour: no
              key function, an index without a name, a function or a unique one, a
              filesystem without a path, a negative Versions, a Held without
              Versions; for the SQL store, a transactor that cannot join or defer, an
              unknown dialect, a table name that is not one.
            name: StoreMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/data/docstore: Open or OpenSQL refused its Config; the fields name the setting and the problem"
            public: The document store cannot be opened as configured
            reason: STORE_MISCONFIGURED
          - code: CodeStatementFailed
            doc: |-
              StatementFailed reports a call the SQL store's database did not
              complete: it could not be reached, its context ended, or it refused a
              statement for a reason that is none of the store's own refusals. What
              the call was writing did not take effect.

              The driver's error travels beside it under errors.Join, reachable by
              errors.Is and errors.As — a context's deadline included — and WITHHELD
              from its text: a driver quotes the row a constraint refused, and that
              row holds a key (ADR 0139).
            name: StatementFailed
            options:
              - errs.WithHTTPStatus(httpServiceUnavailable)
              - errs.WithExitCode(exitTempFail)
            private: "service/data/docstore: a SQL statement failed; the driver's error is joined beside this one, its text withheld, and the fields name the table and the step"
            public: The store's database did not complete the request
            reason: STATEMENT_FAILED
          - code: CodeKeyTooLong
            doc: |-
              KeyTooLong refuses a write to the SQL store whose store key, or one of
              whose index keys, is longer than its key columns hold. It is refused
              before any statement, because MySQL outside strict mode would truncate
              the key rather than refuse it — and a truncated key is another key.
            name: KeyTooLong
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: a store key or an index key exceeds MaxSQLKeyLen bytes; the fields name the store, the index and the limit, never the key"
            public: A key is longer than the store can keep
            reason: KEY_TOO_LONG
          - code: CodeVersionsNotKept
            doc: |-
              VersionsNotKept refuses a call on a document's versions — Versions,
              Version, RewriteVersions — to a store whose configuration keeps none.
              Answering the current document as its only version would tell the
              caller a history exists and is empty, which is not what happened.
            name: VersionsNotKept
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: the store was opened with Versions zero, so it records no version and reads none; the fields name the store"
            public: This store keeps no versions
            reason: VERSIONS_NOT_KEPT
          - code: CodeVersionNotFound
            doc: |-
              VersionNotFound is a miss on a version: the document holds no version of
              that number — it was never made, or a write pruned it.
            name: VersionNotFound
            options:
              - errs.WithHTTPStatus(httpNotFound)
            private: "service/data/docstore: the document exists and keeps no version of the number asked for, never made or pruned; the fields name the store and the number, never the key"
            public: The document keeps no version of this number
            reason: VERSION_NOT_FOUND
          - code: CodeVersionsRewriteRefused
            doc: |-
              VersionsRewriteRefused refuses what a rewrite's function returned: a
              rewrite may drop a former version and change what one holds and what
              its writer said, never add one, reorder them or change when one was
              made. Nothing changed.
            name: VersionsRewriteRefused
            options:
              - errs.WithHTTPStatus(httpBadRequest)
            private: "service/data/docstore: the rewrite function returned a version it was not given, out of order, with another instant, or that is not JSON; the fields name the store and the problem"
            public: A rewrite of versions may only drop or rewrite the versions it was given
            reason: VERSIONS_REWRITE_REFUSED
    types:
      - decl: true
        doc: |-
          IndexSpec declares one secondary index: a name to read it by, whether it is
          unique, and the function that gives a document its keys in it. Build one
          with [Unique] or [Index], and give it to an engine's constructor — Open or
          OpenSQL in internal/service/data/docstore, which refuse the same
          declarations alike. The file engine rebuilds its indexes when the store
          opens; both keep them in step with every write.
        name: IndexSpec
        struct:
          fields:
            - doc: |-
                Keys returns a document's keys in the index. Empty keys are not
                indexed, and a key listed twice is filed once.
              name: Keys
              type: func(T) []string
            - doc: Name reads the index in Lookup and Find, and names it in a refusal.
              name: Name
              type: string
            - doc: Unique refuses a write that would file two documents under one key.
              name: Unique
              type: bool
        typeParams:
          - constraint: any
            name: T
      - decl: true
        doc: |-
          EntryValue is one stored document as the store holds it: its key and its
          JSON, for a caller that shows documents rather than decoding them.
        name: EntryValue
        struct:
          fields:
            - doc: Key is the document's key.
              name: Key
              type: string
            - doc: JSON is the document, a copy the caller owns.
              name: JSON
              type: json.RawMessage
      - decl: true
        doc: |-
          VersionValue is one version of a document: its number, when the write that
          made it ran, what that write's caller said about it, and the document as the
          version holds it.
        name: VersionValue
        struct:
          fields:
            - doc: |-
                At is when the write that made the version ran, in UTC, read from the
                store's clock and kept to the nanosecond — by the file engine for the
                years 0 to 9999, which RFC 3339 writes, and by the SQL engine for any
                instant. It is zero for the first version of a document the store held
                before it kept versions: when that one was written is not known.
              name: At
              type: time.Time
            - doc: |-
                Meta is what the write's caller said about it — who made it, which
                command — as its [StampValue] gave it; nil when it said nothing. The
                store keeps it and never reads it.
              name: Meta
              type: map[string]string
            - doc: |-
                JSON is the document as the version holds it, compact, a copy the
                caller owns. The newest version's is the document itself.
              name: JSON
              type: json.RawMessage
            - doc: |-
                Number counts a document's versions from 1. No number is given twice
                while the document exists, pruning included; a document deleted and
                written again is a new document, and starts again at 1.
              name: Number
              type: uint64
      - decl: true
        doc: |-
          StampValue is what a write says about the version it makes, for the
          Stamped writes. Its zero value is what Put, Insert, Replace and Update say:
          nothing, and a new version.
        name: StampValue
        struct:
          fields:
            - doc: |-
                Meta is kept with the version the write makes — who made it, which
                command — and read back with it. The store copies it and never reads
                it.
              name: Meta
              type: map[string]string
            - doc: |-
                InPlace makes the write change the document without making a version:
                the current version keeps its number, its instant and its Meta, and
                holds the new document. A framework stamps so a workflow's transition,
                which its journal already records. A creation is version 1 all the
                same.
              name: InPlace
              type: bool
  - constants:
      - doc: |-
          DefaultFoldAt is the least number of overlay entries that folds the overlay
          into the snapshot, when [Config].FoldAt is zero.

          A fold rewrites the whole snapshot, so how often it runs decides what a
          write costs on average. Folding once the overlay holds as many entries as
          the store holds documents keeps that average a constant — one fold of N
          documents per N writes — and the floor keeps a small store from rewriting
          its snapshot every few writes for nothing: a thousand small files in one
          directory is not a cost worth avoiding.
        name: DefaultFoldAt
        type: int
        value: "1024"
      - doc: |-
          MaxSQLTableLen is the longest table name a SQL store accepts, in bytes:
          PostgreSQL's identifier limit of 63, less the five bytes of the longest names
          the store derives from it — its index table, the name followed by "___ix",
          and its versions table, followed by "___vs".
          A caller whose names can be longer shortens them, with a digest, before
          they reach the store.
        name: MaxSQLTableLen
        type: int
        value: "58"
      - doc: |-
          MaxSQLKeyLen is the longest store key, and the longest index key as it
          reaches the table, in bytes. An index row carries an index key and a store
          key in one primary key, and MySQL's InnoDB caps an index entry at 3072
          bytes: two keys of this length and an index name fit in it, with room left.
        name: MaxSQLKeyLen
        type: int
        value: "1024"
      - doc: |-
          MaxSQLIndexNameLen is the longest index name a SQL store accepts, in bytes.
          An index's name is stored in every one of its rows, beside its keys.
        name: MaxSQLIndexNameLen
        type: int
        value: "64"
    doc: |-
      Package docstore — the store's construction parameters, and the refusals a
      configuration no store could honour gets, the index declarations' included:
      an IndexSpec is core/data/docstore's, which both engines take (ADR 0160).

      Package docstore is a typed, keyed store of JSON documents with secondary
      indexes, kept in memory and, when given a filesystem, persisted to it —
      every write durable before it returns. ADR 0110.

      # What it is

      A Store[T] holds documents of one Go type, each under the key a function of
      the document returns. Every read returns a copy and every write stores one:
      a document is kept as its JSON encoding, so what a caller holds can never
      alias what the store holds, and the memory and file backends behave alike.
      Writes come in three modes — Put creates or replaces, Insert refuses an
      existing key, Replace refuses a missing one and never resurrects a deleted
      document — plus Update, a read-modify-write, and Delete.

      Secondary indexes are declared at Open: Unique files at most one document
      per key and refuses a write that would file a second, Index files any
      number. Lookup reads a unique index, Find reads any index, Filter reads
      every document. The indexes are rebuilt when the store opens, and a load
      whose documents break a unique index is refused rather than served. So is
      a load holding a document the type no longer decodes, or one stored under
      another key than its own Key gives: a store opens only over documents it
      can serve.

      # How it persists, and what that costs

      The resting state is ONE file, the snapshot: a JSON object mapping each key
      to its document. A write does not rewrite it. It publishes one small file —
      an overlay entry, named by the SHA-256 of the key, holding the key and its
      document or its deletion — atomically, through vfs.AtomicWriter, before it
      returns. A write therefore costs what one document costs, whatever the
      store holds. When the overlay holds as many entries as the store holds
      documents (at least DefaultFoldAt), the write that reaches that count folds
      it: the snapshot is rewritten once and the entries it now contains are
      removed. Folding N documents once per N writes keeps the average write a
      constant. Close folds, so a store that was closed rests as a single
      snapshot a person can read.

      Loading reads the snapshot and replays the overlay on top of it. Replay
      order does not matter — one entry per key, each holding that key's whole
      latest state — and an entry the last fold already folded holds exactly what
      the snapshot holds, so a crash anywhere in a fold, or between a fold and
      the removals that follow it, loads the same documents.

      # Concurrency

      Readers never wait for a disk. Writers are serialised by one lock and do
      their filesystem work under it alone; the documents and the indexes are
      changed only once the write is durable, under a second lock readers share.
      A reader sees the state before the write or after it, never a document and
      an index that disagree.

      # What it is not

      One process. The store detects no second process opening the same files,
      and two would each believe their own memory. It keeps every document in
      memory and sorts the keys for every List. It has no transaction across
      documents. It is a store for the documents a service owns, not a database.

      # The same store over SQL

      OpenSQL builds the second engine, SQLStore, for when a store must outgrow
      that: the same documents, keys, index declarations, write modes, hooks and
      refusals, kept in two tables of a PostgreSQL, MySQL or SQLite database the
      caller owns and hands over as a core/data/sql Transactor. Every call takes a
      context and runs on the transaction it carries — a write in a savepoint of
      it, its hooks after its commit — and nothing is held in memory. ADR 0139.

      Package docstore — hosts the compile-time interface assertions, keeping them
      out of the production source so the runtime binary carries no
      diagnostic-only declarations.

      Package docstore — the functions told about a write or a deletion once it
      is durable, outside every lock.

      Package docstore — the secondary indexes, kept beside the documents under
      the store's own locks.

      An index is rebuilt from the documents when the store opens, and every
      write — Put, Insert, Replace, Update, Delete — maintains it in the same
      critical section that changes the document. A reader therefore never sees a
      document and an index that disagree, and a write a unique index refuses
      leaves both exactly as they were.

      Package docstore — opening a persistent store: the snapshot and the
      versions file read, the overlay replayed on top, and the resting state
      restored.

      Package docstore — opening a store: the configuration checked, the indexes
      declared, and a persistent store loaded.

      Package docstore — the files: one snapshot at rest, and an overlay of one
      entry per key written since, folded back into the snapshot.

      Package docstore — the SQL store's construction parameters, and the
      refusals a configuration no SQL store could honour gets.

      Package docstore — the only place the SQL store renders SQL. Every statement
      it sends is built here, once, at OpenSQL, for its dialect and its tables,
      spelled with the vocabulary core/data/sql's Dialect owns: the bind markers, the
      quoting and the row lock.

      Package docstore — the SQL store's tables, as a migration the caller runs
      under its own version table.

      Package docstore — the SQL store's index rows rebuilt from its documents,
      for when the declarations that filed them changed.

      Package docstore — the SQL store: the same documents, keys, indexes and
      refusals as Store, kept in a database the caller owns, each call on the
      transaction its context carries (ADR 0139).

      Package docstore — the SQL store's versions: a third table, written by the
      statements of the write that stores the document, in its transaction
      (ADR 0143).

      Package docstore — the SQL store's writes: each one atomic on its own, in a
      transaction of the store's or a savepoint of the caller's, and announced
      once the transaction that holds it has committed.

      Package docstore — a document's versions: the current one, which is the
      document itself, and the former ones kept beside it, recorded and pruned in
      the write that stores the document (ADR 0143).

      Package docstore — the writes: prepared outside every lock, checked and
      persisted under the writers' lock, applied under both.
    functions:
      - doc: |-
          Open builds a store from cfg, with the secondary indexes given: in memory
          without a filesystem, otherwise loaded from it — the snapshot, the overlay
          replayed on top, the indexes rebuilt, and the overlay folded when it holds
          anything. It creates the directories the store lives in, 0700, and writes
          its files 0600. An open it refuses writes no data: the fold comes after
          every check, so the files an operator must repair are left as they were.

          	accounts, err := docstore.Open(
          	    docstore.Config[Account]{Key: Account.ID, FS: data, Path: "members/accounts.json"},
          	    coredocstore.Unique("email", func(a Account) string { return a.Email }),
          	    coredocstore.Index("team", func(a Account) []string { return a.Teams }),
          	)
        in:
          - name: cfg
            type: Config[T]
          - name: indexes
            type: coredocstore.IndexSpec[T]
        name: Open
        out:
          - type: "*Store[T]"
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - doc: |-
          SQLMigration returns the migration that creates the two tables a SQL store
          named table keeps on dialect — its documents' and its index rows' — as a
          core/data/sql MigrationValue numbered version, for the caller's Migrator to run
          under the caller's version table. Its Down drops both tables, and every
          document in them.

          The SDK numbers nothing: a migration is a value its consumer constructs
          (ADR 0055 §D12), and only the consumer knows where the store's tables sit
          in its own history.

          Every statement does nothing when its table already exists — or is already
          gone — so a run MySQL's implicit commit stopped halfway completes when it
          runs again, and applying the migration over tables a previous deployment
          made changes nothing (ADR 0139).
        in:
          - name: dialect
            type: coresql.Dialect
          - name: table
            type: string
          - name: version
            type: uint64
        name: SQLMigration
        out:
          - type: coresql.MigrationValue
          - type: error
      - doc: |-
          SQLVersionsMigration returns the migration that creates the table a SQL
          store named table keeps its versions in on dialect — <table>___vs, one row
          per version — as a core/data/sql MigrationValue numbered version, beside the one
          [SQLMigration] returns. A store opened with SQLConfig.Versions needs it; one
          without never touches it. Its Down drops the table, and every version in it:
          run it to turn versions off for good (ADR 0143).

          Its one statement does nothing when the table already exists, or is already
          gone, as SQLMigration's do.
        in:
          - name: dialect
            type: coresql.Dialect
          - name: table
            type: string
          - name: version
            type: uint64
        name: SQLVersionsMigration
        out:
          - type: coresql.MigrationValue
          - type: error
      - doc: |-
          OpenSQL builds a SQL store from cfg, with the secondary indexes given. It
          sends no statement: its tables are [SQLMigration]'s, run before the store
          is used.

          	cases, err := docstore.OpenSQL(
          	    docstore.SQLConfig[Case]{Key: Case.Key, Transactor: tm, Dialect: sql.DialectPostgres, Table: "moderation_intake__cases"},
          	    coredocstore.Unique("reference", func(c Case) string { return c.Reference }),
          	)
        in:
          - name: cfg
            type: SQLConfig[T]
          - name: indexes
            type: coredocstore.IndexSpec[T]
        name: OpenSQL
        out:
          - type: "*SQLStore[T]"
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coredocstore: github.com/kitsunium/sdk/internal/core/data/docstore
      coresql: github.com/kitsunium/sdk/internal/core/data/sql
      corevfs: github.com/kitsunium/sdk/internal/core/data/vfs
      json: encoding/json
    path: github.com/kitsunium/sdk/internal/service/data/docstore
    types:
      - decl: true
        doc: |-
          Config configures [Open]. Key is required; every other field is optional,
          and leaving all of them empty opens a working store kept in memory. The
          secondary indexes are Open's other arguments.
        name: Config
        struct:
          fields:
            - doc: |-
                Key returns the key a document is stored under. It must be a pure
                function of the document: the store calls it to file every write and
                compares its answers to refuse an update that would rename a document.
              name: Key
              type: func(T) string
            - doc: |-
                FS is where the store persists, and Path is the snapshot's name inside
                it — an io/fs name such as "shop/items.json". The overlay lives beside
                the snapshot, in the directory Path + ".d". A nil FS keeps the store in
                memory: nothing survives the process, and nothing is written anywhere.
              name: FS
              type: corevfs.FullFS
            - doc: |-
                Clock stamps each version with the instant of the write that made it.
                Nil is the system clock.
              name: Clock
              type: clock.Clock
            - doc: |-
                Held reports whether the document stored under key is held — a legal
                hold — so that no write prunes its versions: they pile up beyond
                Versions until a write finds the document released, and that write
                prunes them. It is called with the document's key by a write that would
                prune, under the writers' lock, so it may read this store and must not
                write to it; a panic in it reaches the writer, and nothing is written.
                Nil holds nothing. It is refused without Versions.
              name: Held
              type: func(key string) bool
            - doc: |-
                Path is the snapshot's name inside FS. It is required with FS and
                refused without it, because a path with nowhere to be written is a
                store that would silently keep nothing.
              name: Path
              type: string
            - doc: |-
                FoldAt is how many overlay entries fold the overlay into the snapshot
                on the write that reaches it. Zero is the default rule: as many entries
                as the store holds documents, and at least [DefaultFoldAt]. A negative
                value never folds on a write; Fold, Open and Close still do.
              name: FoldAt
              type: int
            - doc: |-
                Versions is how many former versions each document keeps beside its
                current one, the newest: a write that changes a document makes a new
                version, and prunes the oldest beyond Versions in the same durable
                write. Zero keeps no versions — the store writes exactly the files it
                wrote before versions existed — and a negative value is refused. A
                persistent store keeps them in the file Path + ".versions" once a fold
                ran, and a store opened with zero over files that keep versions is
                refused rather than left to drop or corrupt them (ADR 0143).
              name: Versions
              type: int
        typeParams:
          - constraint: any
            name: T
      - decl: true
        doc: |-
          Store is a typed, keyed collection of JSON documents with secondary
          indexes. Build one with [Open]. It is safe for concurrent use.
        methods:
          - doc: Get returns the document stored under key, or DocumentNotFound.
            in:
              - name: key
                type: string
            name: Get
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: List returns every document, in key order.
            name: List
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Filter returns the documents keep accepts, in key order. It decodes every
              document; an index is the way not to.
            in:
              - name: keep
                type: func(T) bool
            name: Filter
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Entries returns up to limit stored documents as JSON, in key order — every
              one when limit is not positive — for a caller that shows documents rather
              than decoding them. Each JSON is the caller's own copy.
            in:
              - name: limit
                type: int
            name: Entries
            out:
              - type: "[]coredocstore.EntryValue"
              - type: error
            recv: pointer
          - doc: |-
              Lookup returns the document holding key in the unique index named index,
              DocumentNotFound when none does, IndexUnknown for an undeclared index and
              IndexNotUnique for an index that may hold several: read that one with Find.
            in:
              - name: index
              - name: key
                type: string
            name: Lookup
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Find returns the documents filed under key in the index named index, in
              store-key order. It reads any index, unique or not, and no document is an
              empty slice, not an error.
            in:
              - name: index
              - name: key
                type: string
            name: Find
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Stats reports what the store holds and where its overlay stands. It answers
              after Close too, with the state the store closed in.
            name: Stats
            out:
              - type: StatsValue
            recv: pointer
          - doc: |-
              OnWrite registers fn to be told the key of every document Put, Insert,
              Replace or Update stored, once the write is durable, on the writer's
              goroutine and outside every lock. It returns the function that removes the
              registration. A panic in fn reaches the writer after its write stood.
            in:
              - name: fn
                type: func(key string)
            name: OnWrite
            out:
              - name: remove
                type: func()
            recv: pointer
          - doc: |-
              OnDelete registers fn to be told the key of every document Delete removed,
              on the same terms as OnWrite.
            in:
              - name: fn
                type: func(key string)
            name: OnDelete
            out:
              - name: remove
                type: func()
            recv: pointer
          - doc: |-
              Fold rewrites the snapshot with every document and removes the overlay
              entries it now contains. A write folds by itself when the overlay has grown
              enough, and Open and Close fold; Fold is for a caller that wants the
              resting state now — before a backup, say. A memory store has nothing to
              fold.
            name: Fold
            out:
              - type: error
            recv: pointer
          - doc: |-
              Close folds the overlay and closes the store: every later call is
              StoreClosed, except Stats and Close, which returns nil. A fold that fails
              leaves its entries where they are — the next Open replays them — and is
              returned; the store closes either way.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: PutStamped is Put, with what the write says about the version it makes.
            in:
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: PutStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              InsertStamped is Insert, with what the write says about the version it
              makes: version 1, whatever stamp.InPlace says.
            in:
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: InsertStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              ReplaceStamped is Replace, with what the write says about the version it
              makes.
            in:
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: ReplaceStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              UpdateStamped is Update, with what the write says about the version it
              makes.
            in:
              - name: key
                type: string
              - name: stamp
                type: coredocstore.StampValue
              - name: fn
                type: func(*T) error
            name: UpdateStamped
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Versions returns the versions the store keeps of the document stored under
              key, newest first: the current one — the document as it is now — then the
              former ones. It returns DocumentNotFound when no document is stored under
              key, and VersionsNotKept when the store keeps no versions.
            in:
              - name: key
                type: string
            name: Versions
            out:
              - type: "[]coredocstore.VersionValue"
              - type: error
            recv: pointer
          - doc: |-
              Version returns the version numbered number of the document stored under
              key, VersionNotFound when the document keeps none of that number — never
              made, or pruned — and what Versions returns otherwise.
            in:
              - name: key
                type: string
              - name: number
                type: uint64
            name: Version
            out:
              - type: coredocstore.VersionValue
              - type: error
            recv: pointer
          - doc: |-
              RewriteVersions rewrites the former versions of the document stored under
              key — every version but the current one, which is the document and which
              only a write changes — in one durable write, under the writers' lock. fn
              receives copies of them, newest first, and returns those to keep, in the
              same order: it may drop a version, and change the document one holds and
              what its writer said, and nothing else — VersionsRewriteRefused for a
              version it was not given, out of order, made at another instant or that is
              not JSON. An error from fn is returned as it is and changes nothing. It
              calls no hook: the document did not change.

              It is what an erasure needs: the former versions cleared as the document
              is, or dropped. fn runs under the writers' lock, like Update's.
            in:
              - name: key
                type: string
              - name: fn
                type: func(former []coredocstore.VersionValue) ([]coredocstore.VersionValue, error)
            name: RewriteVersions
            out:
              - type: error
            recv: pointer
          - doc: |-
              Put stores v under its key, creating it or replacing whatever was there.
              On a store that keeps versions, it makes one, stamped with nothing.
            in:
              - name: v
                type: T
            name: Put
            out:
              - type: error
            recv: pointer
          - doc: "Insert stores v, which must be new: DocumentExists when its key is taken."
            in:
              - name: v
                type: T
            name: Insert
            out:
              - type: error
            recv: pointer
          - doc: |-
              Replace stores v over the document already under its key: DocumentNotFound
              when there is none, so a document deleted meanwhile is never brought back.
            in:
              - name: v
                type: T
            name: Replace
            out:
              - type: error
            recv: pointer
          - doc: |-
              Update applies fn to a copy of the document stored under key and stores the
              result, atomically with respect to every other write. An error from fn is
              returned as it is and changes nothing, and so does a result whose key is not
              key (DocumentKeyChanged). It returns the stored result.

              fn runs under the writers' lock: it may read this store, and must not write
              to it — the write would wait for the lock fn holds, forever.
            in:
              - name: key
                type: string
              - name: fn
                type: func(*T) error
            name: Update
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Delete removes the document stored under key, or returns DocumentNotFound.
              Its versions go with it.
            in:
              - name: key
                type: string
            name: Delete
            out:
              - type: error
            recv: pointer
        name: Store
        struct:
          fields:
            - doc: key is the configured key function.
              name: key
              type: func(T) string
            - doc: fs is where the store persists; nil in memory.
              name: fs
              type: corevfs.FullFS
            - doc: |-
                byName finds an index by its name. It and indexes never change after
                Open.
              name: byName
              type: map[string]*index[T]
            - doc: |-
                docs holds each document's JSON under its key — the snapshot's own
                shape, so a fold encodes it as it is.
              name: docs
              type: map[string]json.RawMessage
            - doc: |-
                versions holds each document's versions under its key, when the store
                keeps them, and is nil otherwise. A document stored before the store
                kept versions, and not versioned since, has none here. A record is
                never changed once stored: a write stores a new one.
              name: versions
              type: map[string]*versionsRecord
            - doc: pending names the overlay entries the snapshot does not contain yet.
              name: pending
              type: map[string]struct{}
            - doc: clock stamps each version.
              name: clock
              type: clock.Clock
            - doc: |-
                held reports a document whose versions no write may prune; nil holds
                nothing.
              name: held
              type: func(key string) bool
            - doc: foldErr is the last automatic fold's failure, until a fold succeeds.
              name: foldErr
              type: error
            - doc: |-
                path is the snapshot's name, overlay the overlay directory's, and
                versionsPath the versions file's.
              name: path
            - doc: |-
                path is the snapshot's name, overlay the overlay directory's, and
                versionsPath the versions file's.
              name: overlay
            - doc: |-
                path is the snapshot's name, overlay the overlay directory's, and
                versionsPath the versions file's.
              name: versionsPath
              type: string
            - doc: indexes are the secondary indexes, in declaration order.
              name: indexes
              type: "[]*index[T]"
            - doc: onWrite and onDelete are the hooks called after a write or a deletion.
              name: onWrite
            - doc: onWrite and onDelete are the hooks called after a write or a deletion.
              name: onDelete
              type: hooks
            - doc: |-
                writing serialises writers, folds and Close; they hold it across the
                filesystem work.
              name: writing
              type: sync.Mutex
            - doc: |-
                mu guards docs, versions, pending, the index maps, closed, folds and
                foldErr: changed under writing AND mu, read under either.
              name: mu
              type: sync.RWMutex
            - doc: foldAt is the configured fold threshold.
              name: foldAt
              type: int
            - doc: |-
                keep is how many former versions each document keeps; zero keeps no
                versions at all.
              name: keep
              type: int
            - doc: folds counts the folds since Open.
              name: folds
              type: int
            - doc: closed refuses every call once Close ran.
              name: closed
              type: bool
        typeParams:
          - constraint: any
            name: T
      - decl: true
        doc: |-
          StatsValue is what a store can say about itself: how many documents it
          holds, how far its overlay has grown, and how its folds have gone.
        name: StatsValue
        struct:
          fields:
            - doc: |-
                FoldError is the last automatic fold's failure, nil once a fold
                succeeds. The write that triggered the fold succeeded either way — its
                own entry was already durable — and the entries stay until a fold works.
              name: FoldError
              type: error
            - doc: Documents is how many documents the store holds.
              name: Documents
              type: int
            - doc: |-
                Pending is how many overlay entries the snapshot does not contain yet:
                zero in memory, and after a fold.
              name: Pending
              type: int
            - doc: Folds is how many folds ran since the store opened, Open's own included.
              name: Folds
              type: int
      - decl: true
        doc: |-
          SQLConfig configures [OpenSQL]. Key, Transactor, Dialect and Table are
          required. The secondary indexes are OpenSQL's other arguments, declared
          with [coredocstore.Unique] and [coredocstore.Index] exactly as for [Open].
        name: SQLConfig
        struct:
          fields:
            - doc: |-
                Key returns the key a document is stored under, as for [Open]: a pure
                function of the document, compared byte for byte.
              name: Key
              type: func(T) string
            - doc: |-
                Clock stamps each version with the instant of the write that made it.
                Nil is the system clock.
              name: Clock
              type: clock.Clock
            - doc: |-
                Held reports whether the document stored under key is held — a legal
                hold — so that no write prunes its versions, as for [Open]. It is
                called by a write that would prune, inside that write's transaction
                and with its context, so a read it makes through the same transactor
                joins it. Nil holds nothing. It is refused without Versions.
              name: Held
              type: func(ctx context.Context, key string) bool
            - doc: |-
                Transactor is the transaction manager of the database the store lives
                in — the one the caller's own transactions are opened with, so a call
                made under one of them joins it. It must also be a core/data/sql Joiner and
                Deferrer, which the SDK's own transactor is.
              name: Transactor
              type: coresql.Transactor
            - doc: |-
                IndexKey, when set, transforms every index key before it reaches the
                database — on a write, and on every Lookup and Find — so a table holds
                what it returns and never the key itself. An index is an equality
                lookup, which a keyed hash keeps: a framework passes an HMAC under a key
                of its own, and an e-mail address never reaches a table. It is called
                with the index's name and a non-empty key; an empty answer files
                nothing, as an empty key does. Nil stores index keys as they are.
              name: IndexKey
              type: func(index, key string) []byte
            - doc: |-
                Table names the documents' table. The store derives its index table's
                name from it by appending "___ix". It is a lower-case SQL identifier of
                at most [MaxSQLTableLen] bytes, holds no three underscores in a row,
                and does not start with "sqlite_". [SQLMigration] creates both tables.
              name: Table
              type: string
            - doc: |-
                Dialect is the engine's: the SQL the store speaks to it. It must be the
                Transactor's own.
              name: Dialect
              type: coresql.Dialect
            - doc: |-
                Versions is how many former versions each document keeps beside its
                current one, as for [Open]: a write that changes a document makes a
                new version and prunes the oldest beyond Versions, in its own
                transaction. They live in a third table, <Table>___vs, which
                [SQLVersionsMigration] creates. Zero keeps no versions and sends
                exactly the statements the store sent before versions existed; a
                negative value is refused. The store cannot see a versions table it was
                told nothing about: turned off, it leaves the table as it is, and a
                document deleted and written again meanwhile would find the rows of the
                one it replaced — so drop the table with the migration's Down (ADR 0143).
              name: Versions
              type: int
        typeParams:
          - constraint: any
            name: T
      - decl: true
        doc: |-
          SQLStore is a typed, keyed collection of JSON documents with secondary
          indexes, kept in two tables of a SQL database. Build one with [OpenSQL]. It
          is safe for concurrent use, and holds nothing but its configuration: the
          database is the source of truth, and every call is a round trip.

          Every call takes a context, and runs on the transaction that context
          carries for the store's transactor, else on the pool. A write runs in a
          transaction of its own — a savepoint inside the caller's — so it is atomic
          on its own either way, and its hooks run once the transaction that holds it
          has committed.
        methods:
          - doc: |-
              Reindex rebuilds every index row from the stored documents, in one
              transaction — a savepoint of the caller's when ctx carries one.

              The SQL store keeps its index rows, where the memory and file store rebuild
              theirs at every Open. So a change to the declarations — an index added, a
              key function or IndexKey changed, an index made unique — files nothing for
              the documents already stored until Reindex runs. It drops every row,
              including those of an index no longer declared, reads the documents in key
              order a page at a time, and files each one's keys again.

              Documents that break a unique index refuse the rebuild with INDEX_BROKEN,
              naming the index and never the key, and so does a key function that panics;
              a document the type no longer fits is DOCUMENT_UNDECODABLE. Nothing changes
              then. Run it when no write to the store runs beside it: a write in flight
              files its keys under whichever rows it finds.
            in:
              - name: ctx
                type: context.Context
            name: Reindex
            out:
              - type: error
            recv: pointer
          - doc: Get returns the document stored under key, or DocumentNotFound.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Get
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              List returns every document, in key order — byte order, as Go compares
              strings.
            in:
              - name: ctx
                type: context.Context
            name: List
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Filter returns the documents keep accepts, in key order. It reads every
              document; an index is the way not to.
            in:
              - name: ctx
                type: context.Context
              - name: keep
                type: func(T) bool
            name: Filter
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Entries returns up to limit stored documents as JSON, in key order — every
              one when limit is not positive — for a caller that shows documents rather
              than decoding them. Each JSON is the bytes the store wrote.
            in:
              - name: ctx
                type: context.Context
              - name: limit
                type: int
            name: Entries
            out:
              - name: entries
                type: "[]coredocstore.EntryValue"
              - name: err
                type: error
            recv: pointer
          - doc: Count returns how many documents the store holds.
            in:
              - name: ctx
                type: context.Context
            name: Count
            out:
              - type: int
              - type: error
            recv: pointer
          - doc: |-
              Lookup returns the document holding key in the unique index named index,
              DocumentNotFound when none does, IndexUnknown for an undeclared index and
              IndexNotUnique for an index that may hold several: read that one with Find.
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Lookup
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Find returns the documents filed under key in the index named index, in
              store-key order. It reads any index, unique or not, and no document is an
              empty slice, not an error.
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Find
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              OnWrite registers fn to be told the key of every document Put, Insert,
              Replace or Update stored, once the transaction that holds the write has
              committed — never for a write that is rolled back — on the goroutine that
              committed it, outside every lock. It returns the function that removes the
              registration.
            in:
              - name: fn
                type: func(key string)
            name: OnWrite
            out:
              - name: remove
                type: func()
            recv: pointer
          - doc: |-
              OnDelete registers fn to be told the key of every document Delete removed,
              on the same terms as OnWrite.
            in:
              - name: fn
                type: func(key string)
            name: OnDelete
            out:
              - name: remove
                type: func()
            recv: pointer
          - doc: PutStamped is Put, with what the write says about the version it makes.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: PutStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              InsertStamped is Insert, with what the write says about the version it
              makes: version 1, whatever stamp.InPlace says.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: InsertStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              ReplaceStamped is Replace, with what the write says about the version it
              makes.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
              - name: stamp
                type: coredocstore.StampValue
            name: ReplaceStamped
            out:
              - type: error
            recv: pointer
          - doc: |-
              Versions returns the versions the store keeps of the document stored under
              key, newest first: the current one — the document as it is now — then the
              former ones, read in one statement on the transaction ctx carries.
              DocumentNotFound when no document is stored under key, VersionsNotKept when
              the store keeps no versions.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Versions
            out:
              - name: versions
                type: "[]coredocstore.VersionValue"
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Version returns the version numbered number of the document stored under
              key, VersionNotFound when the document keeps none of that number — never
              made, or pruned — and what Versions returns otherwise.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: number
                type: uint64
            name: Version
            out:
              - type: coredocstore.VersionValue
              - type: error
            recv: pointer
          - doc: |-
              RewriteVersions rewrites the former versions of the document stored under
              key — every version but the current one, which is the document and which
              only a write changes — in one transaction, a savepoint of the caller's when
              ctx carries one, the document locked as a write locks it. fn receives copies
              of them, newest first, and returns those to keep, in the same order, under
              the rules of [Store].RewriteVersions: VersionsRewriteRefused otherwise, and
              fn's own error returned as it is, nothing changed either way. It calls no
              hook: the document did not change.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fn
                type: func(former []coredocstore.VersionValue) ([]coredocstore.VersionValue, error)
            name: RewriteVersions
            out:
              - type: error
            recv: pointer
          - doc: |-
              Put stores v under its key, creating it or replacing whatever was there.
              On a store that keeps versions, it makes one, stamped with nothing.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Put
            out:
              - type: error
            recv: pointer
          - doc: "Insert stores v, which must be new: DocumentExists when its key is taken."
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Insert
            out:
              - type: error
            recv: pointer
          - doc: |-
              Replace stores v over the document already under its key: DocumentNotFound
              when there is none, so a document deleted meanwhile is never brought back.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Replace
            out:
              - type: error
            recv: pointer
          - doc: |-
              Update applies fn to a copy of the document stored under key and stores the
              result, atomically: the document is locked from the read to the write — its
              row on PostgreSQL and MySQL, the database's write lock on SQLite — so no
              other write lands between them. An error from fn changes nothing and is
              returned for errors.Is to find, and a result whose key is not key is
              DocumentKeyChanged. It returns the stored result.

              fn runs inside the write's transaction. It may read the store; a read under
              a context carrying no transaction runs on the pool, and so needs a second
              connection. It must not write the document it updates, which is locked by
              the very write that is waiting for fn.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fn
                type: func(*T) error
            name: Update
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              UpdateStamped is Update, with what the write says about the version it
              makes.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: stamp
                type: coredocstore.StampValue
              - name: fn
                type: func(*T) error
            name: UpdateStamped
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Delete removes the document stored under key, or returns DocumentNotFound.
              Its versions go with it, in the same transaction.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Delete
            out:
              - type: error
            recv: pointer
        name: SQLStore
        struct:
          fields:
            - doc: key is the configured key function.
              name: key
              type: func(T) string
            - doc: tm opens the store's own transactions, and savepoints in the caller's.
              name: tm
              type: coresql.Transactor
            - doc: tx says where a statement runs, and holds hooks until a commit.
              name: tx
              type: txParts
            - doc: |-
                indexKey transforms an index key before it reaches the database; nil
                keeps it as it is.
              name: indexKey
              type: func(index, key string) []byte
            - doc: clock stamps each version.
              name: clock
              type: clock.Clock
            - doc: |-
                held reports a document whose versions no write may prune; nil holds
                nothing.
              name: held
              type: func(ctx context.Context, key string) bool
            - doc: |-
                byName finds an index by its name. It and indexes never change after
                OpenSQL.
              name: byName
              type: map[string]coredocstore.IndexSpec[T]
            - doc: table is the documents' table, which every refusal names.
              name: table
              type: string
            - doc: stmts are the rendered statements.
              name: stmts
              type: sqlStatements
            - doc: indexes are the secondary indexes, in declaration order.
              name: indexes
              type: "[]coredocstore.IndexSpec[T]"
            - doc: onWrite and onDelete are the hooks called after a write or a deletion.
              name: onWrite
            - doc: onWrite and onDelete are the hooks called after a write or a deletion.
              name: onDelete
              type: hooks
            - doc: own are the options of a transaction the store opens itself.
              name: own
              type: coresql.TxOptionsValue
            - doc: |-
                keep is how many former versions each document keeps; zero keeps no
                versions, and touches no versions table.
              name: keep
              type: int
        typeParams:
          - constraint: any
            name: T
  - doc: |-
      Package docstore is the public facade for the SDK's document store: typed,
      keyed JSON documents with unique and multi-valued secondary indexes, kept in
      memory or persisted to a filesystem, every write durable before it returns.

      	type Account struct {
      	    ID    string   `json:"id"`
      	    Email string   `json:"email"`
      	    Teams []string `json:"teams"`
      	}

      	data, err := vfs.NewOS("/var/lib/app") // or vfs.NewMem(), or nil FS for memory
      	accounts, err := docstore.Open(
      	    docstore.Config[Account]{
      	        Key:  func(a Account) string { return a.ID },
      	        FS:   data,
      	        Path: "members/accounts.json",
      	    },
      	    docstore.Unique("email", func(a Account) string { return a.Email }),
      	    docstore.Index("team", func(a Account) []string { return a.Teams }),
      	)
      	defer accounts.Close()

      	err = accounts.Insert(Account{ID: "acc_1", Email: "ada@example.com"})
      	ada, err := accounts.Lookup("email", "ada@example.com")
      	red, err := accounts.Find("team", "red")

      # Documents, keys and the write modes

      A document is kept as its JSON encoding, so every read returns a copy and a
      caller can never alias what the store holds. Its key is what [Config].Key
      returns; an empty key is refused. Put creates or replaces; Insert refuses a
      key that is taken (DocumentExists); Replace refuses a key that is not
      (DocumentNotFound), so a document deleted meanwhile is never brought back.
      Update applies a function to a copy and stores the result atomically with
      respect to every other write — its function may read the store, and must not
      write to it. Delete removes.

      # Indexes

      [Unique] files at most one document per key: a write that would file a
      second is refused with UniqueKeyTaken and changes nothing. [Index] files any
      number. Empty keys are not indexed. Lookup reads a unique index; Find reads
      any index, in store-key order, and answers an empty slice rather than an
      error; Filter reads every document. The indexes are rebuilt when the store
      opens, and documents that break a unique index refuse the open
      (IndexBroken) rather than answer lies.

      No refusal ever quotes a key: a store key is routinely an e-mail address, an
      index key the hash of a token.

      # How it persists, and what a write costs

      At rest the store is ONE file, the snapshot — a JSON object from key to
      document, the file a person can open. A write publishes one small file
      beside it, in the directory Path + ".d", atomically, before it returns — so
      a write costs one document, whatever the store holds. When that overlay
      holds as many entries as the store holds documents (at least
      [DefaultFoldAt]), the write that got it there folds it back into the
      snapshot: one rewrite per N writes, a constant on average. Close folds too.
      Opening replays the overlay over the snapshot, and a crash at any point of a
      fold loads the same documents. BENCH.md in internal/service/data/docstore has the
      numbers: a write at 100 000 documents costs what it costs at 100, where
      rewriting the whole file costs 70 ms.

      A publication that fails is PersistFailed and changes nothing. One whose
      rename happened but whose directory flush failed is WriteUnconfirmed: the
      write stands — the file shows it, and so does the store — and only its
      survival across a power loss is in doubt.

      # Concurrency, and what it is not

      A Store is safe for concurrent use, and a reader never waits for a disk:
      writers are serialised among themselves and do their filesystem work alone,
      and the documents change only once a write is durable. OnWrite and OnDelete
      tell a caller about each write once it is durable, outside every lock.

      It is one process's store: a second process opening the same files is not
      detected. It keeps every document in memory. It has no transaction across
      documents. It is a store for the documents a service owns, not a database.

      # The same store over SQL

      [OpenSQL] keeps the same documents — the same keys, indexes, write modes,
      hooks and refusals, the same codes — in two tables of a PostgreSQL, MySQL or
      SQLite database the caller opened and hands over as a [sql.Transactor].
      Nothing is held in memory: the database is the source of truth, and every
      call is a round trip that takes a context (ADR 0139).

      	tm, err := sql.NewTransactor(sql.Config{DB: pool, Dialect: sql.DialectPostgres, Pool: sql.PoolConfig{MaxOpen: 10}})
      	create, err := docstore.SQLMigration(sql.DialectPostgres, "members__accounts", 20260927120000) // run by your Migrator
      	accounts, err := docstore.OpenSQL(
      	    docstore.SQLConfig[Account]{Key: func(a Account) string { return a.ID },
      	        Transactor: tm, Dialect: sql.DialectPostgres, Table: "members__accounts"},
      	    docstore.Unique("email", func(a Account) string { return a.Email }),
      	)
      	err = sql.Transact(ctx, tm, func(ctx context.Context, _ sql.Executor) error {
      	    return accounts.Insert(ctx, Account{ID: "acc_1", Email: "ada@example.com"}) // joins this transaction
      	})

      A call runs on the transaction its context carries for that transactor, and
      on the pool otherwise. A write runs in a savepoint of the caller's
      transaction — or a transaction of its own — so it is atomic on its own, and
      a refused or failed one leaves the caller's transaction usable. Its hooks run
      once the transaction that holds it has committed, and never for one rolled
      back.

      The document is kept as the bytes the store encoded, never as the engine's
      JSON type, which reorders members and respells numbers, so it reads back
      byte for byte. Keys are compared as bytes — binary key columns, no
      collation — so "a", "A" and "a " are three keys, as they are in Go. A key
      longer than [MaxSQLKeyLen] bytes is refused with KeyTooLong. Index keys may
      reach the table hashed: [SQLConfig].IndexKey transforms every one at a write
      and at every Lookup and Find, and an index is an equality lookup, which a
      keyed hash keeps. Index rows are kept, not rebuilt at every open: after a
      declaration changes, [SQLStore].Reindex files the stored documents again.

      A failure of the database is StatementFailed, which a caller answers with a
      503: the driver's error is joined beside it for errors.Is and errors.As,
      and withheld from its text, because a driver quotes the row a constraint
      refused and that row holds a key.

      # The ports, for a double

      [Store] and [SQLStore] are engines. A caller that must stand a double in for
      one depends instead on the port it implements: [Collection] and [Versioned]
      for a [Store], whose calls take no context, [CollectionContext] and
      [VersionedContext] for a [SQLStore], whose every call takes one, and
      [Announcer] — OnWrite and OnDelete — for either. Each pair carries the same
      methods, the same documents and the same refusals; there is no single port
      over both, because the file engine waits on nothing a context could abandon
      while the SQL engine waits on a database (ADR 0160).

      # Versions

      A store opened with [Config].Versions — or [SQLConfig].Versions — keeps the
      last versions of each document, as a content system keeps a page's
      revisions (ADR 0143):

      	pages, err := docstore.Open(docstore.Config[Page]{Key: Page.Key, FS: data, Path: "cms/pages.json", Versions: 20})
      	err = pages.PutStamped(page, docstore.Stamp{Meta: map[string]string{"by": userID, "command": "pages.Edit"}})
      	revisions, err := pages.Versions(page.ID) // newest first: the page as it is, then the 20 before it
      	third, err := pages.Version(page.ID, revisions[3].Number)

      A creation is version 1, and every write that changes the document makes
      the next one, stamped with the instant of [Config].Clock and the metadata
      the Stamped writes carry — who, which command; the plain writes carry none.
      A number is never given twice while the document exists. A write storing
      the JSON already stored makes no version, and neither does one stamped
      InPlace: the document changes and its current version keeps its number. The
      former versions beyond Versions are pruned by the write that makes a newer
      one, in the same durable write as the document — the same overlay entry, the
      same transaction — so no crash ever leaves the versions ahead of or behind
      their document. [Config].Held keeps a document's versions from pruning, for
      a legal hold, until a write finds it released. RewriteVersions rewrites a
      document's former versions under the writers' lock, for an erasure: it may
      clear or drop them, never renumber or add one. A deletion takes every
      version with it. Versions are never indexed: Lookup and Find read the
      current version.

      The file store keeps them in memory, in each write's overlay entry and, at
      rest, in the file Path + ".versions"; a store opened without versions over
      files that keep them is refused, rather than left to drop them. The SQL
      store keeps them in a third table, which [SQLVersionsMigration] creates.
      [Version].JSON is compact JSON; a version predating a change of the type
      may no longer decode into it, which is why it is JSON and not a T.
    facade:
      - const:
          - doc: |-
              DefaultFoldAt is the least number of overlay entries that folds the overlay
              into the snapshot when [Config].FoldAt is zero.
            name: DefaultFoldAt
            reexport: svcdocstore.DefaultFoldAt
            type: int
            typed: true
            value: "1024"
      - const:
          - doc: |-
              MaxSQLTableLen is the longest table name [OpenSQL] and [SQLMigration]
              accept, in bytes: PostgreSQL's limit of 63, less what the store appends to
              derive its index table's name.
            name: MaxSQLTableLen
            reexport: svcdocstore.MaxSQLTableLen
            type: int
            typed: true
            value: "58"
      - const:
          - doc: |-
              MaxSQLKeyLen is the longest store key, and the longest index key as it
              reaches the table, a SQL store accepts, in bytes.
            name: MaxSQLKeyLen
            reexport: svcdocstore.MaxSQLKeyLen
            type: int
            typed: true
            value: "1024"
      - const:
          - doc: MaxSQLIndexNameLen is the longest index name a SQL store accepts, in bytes.
            name: MaxSQLIndexNameLen
            reexport: svcdocstore.MaxSQLIndexNameLen
            type: int
            typed: true
            value: "64"
      - const:
          - doc: |-
              CodeDocumentNotFound: no document under the key, or nobody holds the
              key in a unique index.
            name: CodeDocumentNotFound
            reexport: coredocstore.CodeDocumentNotFound
            type: errs.Code
            typed: true
            value: "0x00_03_50_01"
          - doc: "CodeDocumentExists: Insert over a taken key."
            name: CodeDocumentExists
            reexport: coredocstore.CodeDocumentExists
            type: errs.Code
            typed: true
            value: "0x00_03_50_02"
          - doc: "CodeUniqueKeyTaken: a unique index refused the write."
            name: CodeUniqueKeyTaken
            reexport: coredocstore.CodeUniqueKeyTaken
            type: errs.Code
            typed: true
            value: "0x00_03_50_03"
          - doc: "CodeDocumentKeyEmpty: the key function returned the empty string."
            name: CodeDocumentKeyEmpty
            reexport: coredocstore.CodeDocumentKeyEmpty
            type: errs.Code
            typed: true
            value: "0x00_03_50_04"
          - doc: "CodeDocumentKeyChanged: an Update's function changed the key."
            name: CodeDocumentKeyChanged
            reexport: coredocstore.CodeDocumentKeyChanged
            type: errs.Code
            typed: true
            value: "0x00_03_50_05"
          - doc: "CodeIndexUnknown: a read named an index the store never declared."
            name: CodeIndexUnknown
            reexport: coredocstore.CodeIndexUnknown
            type: errs.Code
            typed: true
            value: "0x00_03_50_06"
          - doc: "CodeIndexNotUnique: Lookup on a multi-valued index."
            name: CodeIndexNotUnique
            reexport: coredocstore.CodeIndexNotUnique
            type: errs.Code
            typed: true
            value: "0x00_03_50_07"
          - doc: "CodeDocumentUndecodable: a stored document no longer fits the type."
            name: CodeDocumentUndecodable
            reexport: coredocstore.CodeDocumentUndecodable
            type: errs.Code
            typed: true
            value: "0x00_03_50_08"
          - doc: "CodeDocumentUnencodable: encoding/json refused the value."
            name: CodeDocumentUnencodable
            reexport: coredocstore.CodeDocumentUnencodable
            type: errs.Code
            typed: true
            value: "0x00_03_50_09"
          - doc: "CodePersistFailed: the filesystem refused the write; nothing changed."
            name: CodePersistFailed
            reexport: coredocstore.CodePersistFailed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0A"
          - doc: "CodeLoadFailed: the store's files cannot be read or are not a store's."
            name: CodeLoadFailed
            reexport: coredocstore.CodeLoadFailed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0B"
          - doc: "CodeIndexBroken: the stored documents break a unique index."
            name: CodeIndexBroken
            reexport: coredocstore.CodeIndexBroken
            type: errs.Code
            typed: true
            value: "0x00_03_50_0C"
          - doc: "CodeStoreClosed: a call after Close."
            name: CodeStoreClosed
            reexport: coredocstore.CodeStoreClosed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0D"
          - doc: "CodeStoreMisconfigured: Open refused its configuration."
            name: CodeStoreMisconfigured
            reexport: coredocstore.CodeStoreMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_03_50_0E"
          - doc: "CodeWriteUnconfirmed: the write stands, its durability is in doubt."
            name: CodeWriteUnconfirmed
            reexport: coredocstore.CodeWriteUnconfirmed
            type: errs.Code
            typed: true
            value: "0x00_03_50_0F"
          - doc: "CodeStatementFailed: the SQL store's database did not complete a call."
            name: CodeStatementFailed
            reexport: coredocstore.CodeStatementFailed
            type: errs.Code
            typed: true
            value: "0x00_03_50_10"
          - doc: "CodeKeyTooLong: a key is longer than the SQL store's key columns hold."
            name: CodeKeyTooLong
            reexport: coredocstore.CodeKeyTooLong
            type: errs.Code
            typed: true
            value: "0x00_03_50_11"
          - doc: "CodeVersionsNotKept: a call on versions to a store that keeps none."
            name: CodeVersionsNotKept
            reexport: coredocstore.CodeVersionsNotKept
            type: errs.Code
            typed: true
            value: "0x00_03_50_12"
          - doc: "CodeVersionNotFound: the document keeps no version of that number."
            name: CodeVersionNotFound
            reexport: coredocstore.CodeVersionNotFound
            type: errs.Code
            typed: true
            value: "0x00_03_50_13"
          - doc: "CodeVersionsRewriteRefused: a rewrite returned what a rewrite may not."
            name: CodeVersionsRewriteRefused
            reexport: coredocstore.CodeVersionsRewriteRefused
            type: errs.Code
            typed: true
            value: "0x00_03_50_14"
        doc: The codes of the store's refusals (0.3.80.*), for errs.HasCode.
      - doc: The store's sentinels, for errors.Is.
        var:
          - doc: DocumentNotFound is a miss.
            name: DocumentNotFound
            reexport: coredocstore.DocumentNotFound
            type: "*errs.Error"
          - doc: DocumentExists refuses an insertion over a taken key.
            name: DocumentExists
            reexport: coredocstore.DocumentExists
            type: "*errs.Error"
          - doc: UniqueKeyTaken refuses a write a unique index cannot file.
            name: UniqueKeyTaken
            reexport: coredocstore.UniqueKeyTaken
            type: "*errs.Error"
          - doc: DocumentKeyEmpty refuses a document whose key is empty.
            name: DocumentKeyEmpty
            reexport: coredocstore.DocumentKeyEmpty
            type: "*errs.Error"
          - doc: DocumentKeyChanged refuses an update that renames.
            name: DocumentKeyChanged
            reexport: coredocstore.DocumentKeyChanged
            type: "*errs.Error"
          - doc: IndexUnknown refuses a read of an undeclared index.
            name: IndexUnknown
            reexport: coredocstore.IndexUnknown
            type: "*errs.Error"
          - doc: IndexNotUnique refuses a Lookup on a multi-valued index.
            name: IndexNotUnique
            reexport: coredocstore.IndexNotUnique
            type: "*errs.Error"
          - doc: DocumentUndecodable reports a stored document the type no longer fits.
            name: DocumentUndecodable
            reexport: coredocstore.DocumentUndecodable
            type: "*errs.Error"
          - doc: DocumentUnencodable refuses a value encoding/json cannot encode.
            name: DocumentUnencodable
            reexport: coredocstore.DocumentUnencodable
            type: "*errs.Error"
          - doc: PersistFailed reports a write the filesystem refused.
            name: PersistFailed
            reexport: coredocstore.PersistFailed
            type: "*errs.Error"
          - doc: LoadFailed refuses files that are not a store's.
            name: LoadFailed
            reexport: coredocstore.LoadFailed
            type: "*errs.Error"
          - doc: IndexBroken refuses documents that break a unique index.
            name: IndexBroken
            reexport: coredocstore.IndexBroken
            type: "*errs.Error"
          - doc: StoreClosed refuses a call after Close.
            name: StoreClosed
            reexport: coredocstore.StoreClosed
            type: "*errs.Error"
          - doc: StoreMisconfigured refuses a configuration no store could honour.
            name: StoreMisconfigured
            reexport: coredocstore.StoreMisconfigured
            type: "*errs.Error"
          - doc: |-
              WriteUnconfirmed reports a write that stands but may not survive a
              power loss.
            name: WriteUnconfirmed
            reexport: coredocstore.WriteUnconfirmed
            type: "*errs.Error"
          - doc: |-
              StatementFailed reports a call the SQL store's database did not
              complete; the driver's error is joined beside it, its text withheld.
            name: StatementFailed
            reexport: coredocstore.StatementFailed
            type: "*errs.Error"
          - doc: KeyTooLong refuses a key longer than the SQL store's key columns hold.
            name: KeyTooLong
            reexport: coredocstore.KeyTooLong
            type: "*errs.Error"
          - doc: VersionsNotKept refuses a call on versions to a store that keeps none.
            name: VersionsNotKept
            reexport: coredocstore.VersionsNotKept
            type: "*errs.Error"
          - doc: "VersionNotFound is a miss on a version: never made, or pruned."
            name: VersionNotFound
            reexport: coredocstore.VersionNotFound
            type: "*errs.Error"
          - doc: VersionsRewriteRefused refuses what a rewrite's function returned.
            name: VersionsRewriteRefused
            reexport: coredocstore.VersionsRewriteRefused
            type: "*errs.Error"
      - alias:
          - doc: |-
              Store is the public alias for the document store: Get, List, Filter,
              Entries, Lookup, Find and Stats read; Put, Insert, Replace, Update and
              Delete write, and their Stamped forms say what the version they make
              records; Versions and Version read a document's versions, RewriteVersions
              rewrites its former ones; OnWrite and OnDelete announce; Fold and Close
              bring it to rest.
            name: Store
            target: svcdocstore.Store[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              Config is the public alias for a store's configuration: Key (required), FS
              and Path (both, or neither for a memory store), FoldAt, and Versions with
              its Clock and Held.
            name: Config
            target: svcdocstore.Config[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              Version is the public alias for one version of a document: its Number from
              1, the instant At the write that made it ran, the Meta that write carried,
              and the document as JSON.
            name: Version
            target: coredocstore.VersionValue
      - alias:
          - doc: |-
              Stamp is the public alias for what a Stamped write says about the version
              it makes: the Meta the version records, or InPlace — no version.
            name: Stamp
            target: coredocstore.StampValue
      - alias:
          - doc: |-
              IndexSpec is the public alias for one secondary index's declaration, built
              by [Unique] or [Index] and given to [Open].
            name: IndexSpec
            target: coredocstore.IndexSpec[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: Entry is the public alias for one stored document as JSON, with its key.
            name: Entry
            target: coredocstore.EntryValue
      - alias:
          - doc: |-
              Stats is the public alias for what a store says about itself: documents,
              pending overlay entries, folds, and the last automatic fold's failure.
            name: Stats
            target: svcdocstore.StatsValue
      - alias:
          - doc: |-
              SQLStore is the public alias for the document store over SQL: Get, List,
              Filter, Entries, Count, Lookup and Find read; Put, Insert, Replace, Update
              and Delete write, and their Stamped forms say what the version they make
              records; Versions, Version and RewriteVersions as for [Store]; OnWrite and
              OnDelete announce once the write's transaction commits; Reindex files the
              stored documents again. Every call takes a context.
            name: SQLStore
            target: svcdocstore.SQLStore[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              SQLConfig is the public alias for a SQL store's configuration: Key,
              Transactor, Dialect and Table (required), IndexKey, and Versions with its
              Clock and Held.
            name: SQLConfig
            target: svcdocstore.SQLConfig[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              Collection is the public alias for the port of a store whose calls take no
              context, which [Store] implements: Get, List, Filter, Entries, Lookup and
              Find; Put, Insert, Replace, Update and Delete; OnWrite and OnDelete. It is
              what a caller depends on to stand a double in for a [Store]; Stats, Fold
              and Close are the engine's own.
            name: Collection
            target: coredocstore.Collection[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              Versioned is the public alias for the sibling of [Collection] that reads and
              writes a document's versions without a context, which [Store] implements:
              the four Stamped writes, Versions, Version and RewriteVersions.
            name: Versioned
            target: coredocstore.Versioned[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              CollectionContext is the public alias for [Collection] with a context on
              every call, which [SQLStore] implements; Count and Reindex are the engine's
              own.
            name: CollectionContext
            target: coredocstore.CollectionContext[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              VersionedContext is the public alias for [Versioned] with a context on every
              call, which [SQLStore] implements beside [CollectionContext].
            name: VersionedContext
            target: coredocstore.VersionedContext[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              Announcer is the public alias for the pair of hooks both engines answer
              exactly as they are: OnWrite and OnDelete.
            name: Announcer
            target: coredocstore.Announcer
      - func:
          doc: |-
            Open builds a store from cfg with the secondary indexes given: in memory
            without a filesystem, otherwise loaded from it — the snapshot, the overlay
            replayed on top, the indexes rebuilt. It creates the directories the store
            lives in, 0700, and writes its files 0600.
          forward: svcdocstore.Open
          in:
            - name: cfg
              type: Config[T]
            - name: indexes
              type: IndexSpec[T]
          name: Open
          out:
            - type: "*Store[T]"
            - type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            OpenSQL builds a store over SQL from cfg with the secondary indexes given,
            declared as for [Open]. It sends no statement: its tables are
            [SQLMigration]'s, run by the caller's Migrator before the store is used.
          forward: svcdocstore.OpenSQL
          in:
            - name: cfg
              type: SQLConfig[T]
            - name: indexes
              type: IndexSpec[T]
          name: OpenSQL
          out:
            - type: "*SQLStore[T]"
            - type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            SQLMigration returns the migration that creates the two tables a SQL store
            named table keeps on dialect, numbered version for the caller's own version
            table. Its Down drops both, and every document in them. Every statement does
            nothing when its table exists, so a run MySQL's implicit commit stopped
            halfway completes when it runs again.
          forward: svcdocstore.SQLMigration
          in:
            - name: dialect
              type: sql.Dialect
            - name: table
              type: string
            - name: version
              type: uint64
          name: SQLMigration
          out:
            - type: sql.Migration
            - type: error
      - func:
          doc: |-
            SQLVersionsMigration returns the migration that creates the table a SQL
            store named table keeps its versions in on dialect, numbered version for the
            caller's own version table, beside [SQLMigration]'s. A store opened with
            [SQLConfig].Versions needs it. Its Down drops the table, and every version
            in it: run it to turn versions off for good.
          forward: svcdocstore.SQLVersionsMigration
          in:
            - name: dialect
              type: sql.Dialect
            - name: table
              type: string
            - name: version
              type: uint64
          name: SQLVersionsMigration
          out:
            - type: sql.Migration
            - type: error
      - func:
          doc: |-
            Unique declares a unique index over the one key key returns. An empty key is
            not indexed, so any number of documents may have none.
          forward: coredocstore.Unique
          in:
            - name: name
              type: string
            - name: key
              type: func(T) string
          name: Unique
          out:
            - type: IndexSpec[T]
          typeParams:
            - constraint: any
              name: T
      - func:
          doc: |-
            Index declares an index where a document may have several keys and a key
            several documents. Empty keys are not indexed.
          forward: coredocstore.Index
          in:
            - name: name
              type: string
            - name: keys
              type: func(T) []string
          name: Index
          out:
            - type: IndexSpec[T]
          typeParams:
            - constraint: any
              name: T
    imports:
      coredocstore: github.com/kitsunium/sdk/internal/core/data/docstore
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      sql: github.com/kitsunium/sdk/pkg/v1/data/sql
      svcdocstore: github.com/kitsunium/sdk/internal/service/data/docstore
    path: github.com/kitsunium/sdk/pkg/v1/data/docstore
