apiVersion: kit.kitsunium/design/v2
domain: app/health
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidCheck identifies a registration refused because the check could
              never run: an empty name or a nil body.
            name: CodeInvalidCheck
            note: "range: 0.2.29.0 - 0.2.29.255"
            value: "0x00_02_1D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateCheck identifies a registration refused because the name is
              already taken on that probe.
            name: CodeDuplicateCheck
            value: "0x00_02_1D_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownProbe identifies a Probe value this package never mints,
              including the zero value.
            name: CodeUnknownProbe
            value: "0x00_02_1D_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckPanicked identifies a check whose body panicked; the engine
              recovered it and turned it into that check's failure.
            name: CodeCheckPanicked
            value: "0x00_02_1D_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckFailed identifies a check that returned an error. It is the code
              the registry wraps a PLAIN cause with; an *errs.Error cause keeps its own
              code, reason and Public through origin-wins, which is how a caller's own
              wire-safe message reaches a probe body and a driver's does not.
            name: CodeCheckFailed
            note: |-
              range: 0.3.59.0 - 0.3.59.255

              The engine's verdicts on a probe and on the loopback Ask. The range was
              allocated to internal/service/app/health, which raises these codes, and it
              is declared here with the registration refusals so that every code of the
              domain is in one place (ADR 0160). A code keeps the value its allocation
              gave it whichever layer declares it, so the layer byte still reads 3.
            value: "0x00_03_3B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckTimeout identifies a check that had not answered when its budget
              expired. Its context was cancelled and the registry stopped waiting; the
              goroutine was not killed and nothing it holds was closed on its behalf.
            name: CodeCheckTimeout
            value: "0x00_03_3B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeStaleCacheWindow identifies a readiness registration refused because its
              MaxAge exceeds the MaxCacheAge ceiling internal/service/app/health enforces.
            name: CodeStaleCacheWindow
            value: "0x00_03_3B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeStartupPending identifies a readiness probe answered while the process
              is still starting. No readiness check was run.
            name: CodeStartupPending
            value: "0x00_03_3B_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDraining identifies a readiness probe answered after Drain. No readiness
              check was run, and no later probe will report anything else.
            name: CodeDraining
            value: "0x00_03_3B_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotifyFailed identifies an opt-in sd_notify datagram that could not be
              delivered.
            name: CodeNotifyFailed
            value: "0x00_03_3B_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskMisconfigured identifies an Ask refused before anything was dialled:
              an address with no usable port, a path that is not absolute, a negative
              timeout (ADR 0131).
            name: CodeAskMisconfigured
            value: "0x00_03_3B_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskUnreachable identifies an Ask that got no answer because the
              connection or the request failed: refused, reset, no route, a name that does
              not resolve.
            name: CodeAskUnreachable
            value: "0x00_03_3B_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskTimeout identifies an Ask whose budget, or whose caller's context,
              ended before the process answered.
            name: CodeAskTimeout
            value: "0x00_03_3B_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskNotReady identifies an Ask the process answered with a status other
              than 200 — a redirect included, since none is followed.
            name: CodeAskNotReady
            value: "0x00_03_3B_0A"
        type: errs.Code
    constants:
      - doc: |-
          ProbeStartup asks "is this process still coming up?". While it answers
          no, the orchestrator must neither route to the replica nor restart it.

          The run starts at iota+1, not at iota: the zero is left unclaimed on
          purpose, so a Probe nobody set is a value this package never mints
          rather than the startup question answered by default.
        name: ProbeStartup
        type: Probe
        value: "1"
      - doc: |-
          ProbeReadiness asks "can this replica take traffic right now?". A no
          removes it from routing and never restarts it. Dependency checks belong
          here, and only here.
        name: ProbeReadiness
        type: Probe
        value: "2"
      - doc: |-
          ProbeLiveness asks "is this process irrecoverable?". A no restarts the
          replica, so only process-local evidence may contribute to it.
        name: ProbeLiveness
        type: Probe
        value: "3"
      - doc: |-
          StatusUnhealthy is a failing critical check, or a probe with one. The
          replica must not take traffic (readiness) or is irrecoverable
          (liveness). It is the ZERO VALUE; see the type comment.
        name: StatusUnhealthy
        type: Status
        value: "0"
      - doc: |-
          StatusDegraded is a failing NON-critical check, or a probe with one and
          no critical failure. It is a SERVING state: the replica keeps taking
          traffic. A degraded replica that stopped serving would make
          "non-critical" mean nothing.
        name: StatusDegraded
        type: Status
        value: "1"
      - doc: |-
          StatusHealthy is every check passing — including the case where there
          are no checks at all (ADR 0031: an empty registry is legitimate, and
          the process answering the probe is the evidence).
        name: StatusHealthy
        type: Status
        value: "2"
    doc: |-
      Package health — ranges 0.2.29.* (ADR 0060 core/app/health block) and
      0.3.59.* (ADR 0060 service/app/health block, declared here since ADR 0160).

      Package health — declares the sentinel *errs.Error outcomes of the domain:
      the registration refusals, and the engine's verdicts on a probe and on the
      loopback Ask. Each var's name equals its errs.Define Reason in
      SCREAMING_SNAKE form.

      Every Public of an engine verdict is written to be READ BY A STRANGER. A
      probe endpoint is routinely exposed more widely than whoever added it
      expected — a mesh sidecar, a load balancer health page, an uptime checker —
      so these strings name a condition and never a cause, a host, a port or a
      query.

      Package health declares the SDK's process-health port: the three probes an
      orchestrator asks — startup, readiness, liveness — and the checks that
      answer them. A core sibling admitted by ADR 0060.

      # Liveness and readiness are not the same signal

      This package exists because confusing them causes a cascade. A saturated
      service is not a dead service. If a liveness probe fails because a
      dependency is slow, the orchestrator KILLS the replica; the traffic it was
      carrying moves to the replicas that remain, which are now closer to the same
      saturation, and fail the same probe. The cause of the outage is the probe.

      So the distinction is STRUCTURAL here, not documentary. The three probes do
      not take the same registration type, and the liveness one cannot express a
      dependency call:

        - [StartupCheckValue] and [ReadinessCheckValue] carry a [Check], which
          takes a context.Context — the argument every dependency API asks for
          (sql.DB.PingContext, net.Dialer.DialContext, http.NewRequestWithContext).
        - [LivenessCheckValue] carries a [SelfCheck], which takes NOTHING. The two
          function types are not assignable in either direction, so
          health.LivenessCheckValue{Check: db.PingContext} does not compile.

      A liveness check answers one question — "is this process irrecoverable, so
      that only a restart can fix it?" — and nothing outside the process can
      contribute to that answer.

      # The three states

        - Startup: the process is coming up. Do not kill it, do not route to it.
          While any registered startup check has yet to pass, the liveness probe
          reports healthy WITHOUT running anything and the readiness probe reports
          not-ready without running anything.
        - Readiness: can this replica take traffic right now? Dependency checks
          live here. A failure removes the replica from routing; it never restarts
          it.
        - Liveness: is the process irrecoverable? Process-local evidence only. A
          failure restarts the replica.

      # Draining

      [Health.Drain] makes readiness report not-ready permanently while liveness
      keeps answering. That ordering is the point: an orchestrator removes the
      replica from routing BEFORE the drain begins, so in-flight work finishes
      against a socket nothing new arrives on — and the process is not killed
      while it does it. Drain is ONE-WAY; see its doc comment.

      The engine, the per-check budget, the bounded result cache, the HTTP
      handlers and the opt-in lifecycle and sd_notify wiring are concrete and live
      in internal/service/app/health.

      Package health — hosts StartupCheckValue, and the table that says what each
      of the three registrations is allowed to express. They are three types and
      not one with a Probe field, because a field is set by distraction and a type
      is not.

      Package health — hosts LivenessCheckValue, the registration a dependency
      cannot be written into. See health_check.go for the table of what each of
      the three may say.

      Package health — hosts ReadinessCheckValue, the only registration that can
      express a dependency. See health_check.go for the table of what each of the
      three may say.

      Package health — hosts Probe, the three questions an orchestrator asks.

      Package health — hosts ResultValue and ReportValue, what a probe answers
      with.

      Package health — hosts Status, the verdict a check and a probe both carry,
      and the aggregation rule that turns the first into the second.
    functions:
      - doc: |-
          Worst returns the more severe of two statuses, which is the SDK's whole
          aggregation rule: a set is as healthy as its least healthy member.

          It exists as a named function rather than an inline min so the rule has one
          definition and one test, and so a reader looking for "how does one failing
          check affect the whole probe" finds a function rather than an idiom.

          A value outside the three ranks with Unhealthy. Status is ordered
          worst-first, so a plain min would rank a cast value like Status(42) ABOVE
          Healthy and let Worst(Healthy, Status(42)) answer Healthy — the fail-open
          Serving already refuses for the same value.
        in:
          - name: a
          - name: b
            type: Status
        name: Worst
        impl: worst
        out:
          - type: Status
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/health
    ports:
      - doc: |-
          Health owns the registered checks and answers the three probes.
          Implementations MUST be safe for concurrent use: probes arrive from an
          orchestrator on their own schedule, concurrently with each other and with
          the application's own shutdown.

          IFACE-PLUGIN: the concrete registry stays unexported behind its constructor
          in internal/service/app/health.
        methods:
          - doc: |-
              AddStartup registers a check that gates the startup probe. It is
              refused on an empty name or a nil body ([InvalidCheck]), and on a name
              already registered for the startup probe ([DuplicateCheck]).
            in:
              - name: check
                type: StartupCheckValue
            name: AddStartup
            out:
              - type: error
          - doc: |-
              AddReadiness registers a check that gates routing. The same refusals,
              over the readiness namespace.
            in:
              - name: check
                type: ReadinessCheckValue
            name: AddReadiness
            out:
              - type: error
          - doc: |-
              AddLiveness registers process-local evidence that the process is not
              irrecoverable. The same refusals, over the liveness namespace.
            in:
              - name: check
                type: LivenessCheckValue
            name: AddLiveness
            out:
              - type: error
          - doc: |-
              Probe answers one probe. It never returns an error: a probe that could
              not be answered IS an answer, and the answer is the report's Status
              (see [ReportValue]). A Probe value this package never mints reports
              StatusUnhealthy carrying one [UnknownProbe] result, rather than
              defaulting to a verdict nobody asked for.
            in:
              - name: ctx
                type: context.Context
              - name: probe
                type: Probe
            name: Probe
            out:
              - type: ReportValue
          - doc: |-
              Drain marks the process as going away: readiness reports not-ready from
              here on, without running a single check, while liveness keeps answering
              normally so a draining process is not killed mid-drain.

              It is idempotent and it is ONE-WAY. There is deliberately no Undrain: a
              process that has announced its departure has already had its endpoints
              withdrawn, and a flap would return live traffic to a process that is
              closing the very dependencies that traffic needs.
            name: Drain
        name: Health
    sentinels:
      - var:
          - code: CodeInvalidCheck
            doc: |-
              InvalidCheck is returned by every Add for a check that could never run.
              The "missing" field names which half is absent.
            name: InvalidCheck
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: check has an empty name or a nil body; the field names which"
            public: The health check is not runnable and was refused
            reason: INVALID_CHECK
          - code: CodeDuplicateCheck
            doc: |-
              DuplicateCheck is returned by an Add whose name is already registered
              on that probe. Names are how a result and an error identify a check, so
              two checks sharing one would make every report ambiguous.

              The namespace is PER PROBE: the same name may appear once on readiness
              and once on liveness, because they are different questions about
              different evidence and an operator reading "cache" on both is reading
              two answers, not a collision.
            name: DuplicateCheck
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: check names are unique per probe; the fields carry the name and the probe"
            public: A health check is already registered under that name
            reason: DUPLICATE_CHECK
          - code: CodeUnknownProbe
            doc: |-
              UnknownProbe is the result carried by a report for a Probe value this
              package never mints. The probe answers StatusUnhealthy rather than
              guessing: picking liveness for a caller who did not say what they
              wanted is how a dependency outage becomes a restart loop.
            name: UnknownProbe
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: probe must be ProbeStartup, ProbeReadiness or ProbeLiveness; the field carries the value"
            public: The requested health probe does not exist
            reason: UNKNOWN_PROBE
          - code: CodeCheckPanicked
            doc: |-
              CheckPanicked is the failure of a check whose body panicked. The engine
              recovers it rather than letting it reach the runtime, because a panic
              escaping a probe would take the whole process down over a health
              question — the health endpoint becoming the outage.

              The recovered value travels as a FIELD, never as the wrap origin, so a
              panic carrying an *errs.Error cannot hijack this code, and the panic
              text — which routinely carries an address or a query — cannot reach an
              HTTP body through the Public of an error it did not write.
            name: CheckPanicked
            private: "core/app/health: check panicked; the fields carry its name, its probe, and the panic value"
            public: The health check panicked and was recovered
            reason: CHECK_PANICKED
          - code: CodeCheckFailed
            doc: |-
              CheckFailed is the code a PLAIN error from a check is wrapped with. An
              *errs.Error cause keeps its own identity through origin-wins, so a
              caller who already writes typed errors sees their own Public in the
              probe body and everyone else sees this one.
            name: CheckFailed
            note: |-
              The engine's verdicts, raised by internal/service/app/health as it runs a
              probe, drains, notifies and asks. They are declared here, with the
              registration refusals, so that the domain's codes and sentinels are in one
              place (ADR 0160).
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: check returned a non-nil error; the fields carry its name and probe"
            public: A health check reported a failure
            reason: CHECK_FAILED
          - code: CodeCheckTimeout
            doc: |-
              CheckTimeout reports a check that had not answered when its budget
              expired.

              It is a FAILURE and not an "unknown", and that is a decision (ADR 0060
              §D4). A probe exists to answer a question within a bounded time, and
              "I could not answer" is operationally the same as "no" for the caller
              who has to decide whether to route traffic. An "unknown" that
              aggregated as healthy would make a wedged dependency invisible — the
              exact failure probes exist to catch — and one that aggregated as
              unhealthy would just be a second spelling of this. What IS preserved is
              the distinction: ResultValue.TimedOut separates "the dependency said
              no" from "the dependency said nothing".
            name: CheckTimeout
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: check exceeded its timeout; the fields carry its name, probe and budget"
            public: A health check did not answer within its budget
            reason: CHECK_TIMEOUT
          - code: CodeStaleCacheWindow
            doc: |-
              StaleCacheWindow is returned by AddReadiness for a MaxAge above the
              MaxCacheAge ceiling internal/service/app/health enforces. Refused rather
              than clamped: see MaxCacheAge there.
            name: StaleCacheWindow
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/health: MaxAge exceeds MaxCacheAge; the fields carry both"
            public: The health check cache window is longer than the SDK will vouch for
            reason: STALE_CACHE_WINDOW
          - code: CodeStartupPending
            doc: |-
              StartupPending is the synthetic result of a readiness probe answered
              while a startup check has yet to pass. No readiness check was run,
              because "not yet started" already answers the routing question and
              dialling a dependency to reconfirm it would only add load.
            name: StartupPending
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: readiness short-circuited; a startup check has not passed"
            public: The process is still starting and is not accepting traffic yet
            reason: STARTUP_PENDING
          - code: CodeDraining
            doc: |-
              Draining is the synthetic result of a readiness probe answered after
              Drain. It is what lets an orchestrator withdraw the replica from
              routing BEFORE the shutdown sequence starts closing anything.

              Liveness deliberately keeps answering normally while this is true: a
              draining process that gets killed for failing liveness loses exactly
              the in-flight work the drain existed to finish.
            name: Draining
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: readiness short-circuited; Drain has been called and is one-way"
            public: The process is shutting down and is no longer accepting traffic
            reason: DRAINING
          - code: CodeNotifyFailed
            doc: |-
              NotifyFailed is handed to Config.OnNotifyError when an opt-in sd_notify
              datagram could not be delivered. With $NOTIFY_SOCKET unset the notifier
              is a no-op that succeeds, so this means a socket was configured and did
              not take the message.
            name: NotifyFailed
            private: "service/app/health: sd_notify send failed; the field carries the state that was being sent"
            public: The readiness notification could not be delivered
            reason: NOTIFY_FAILED
          - code: CodeAskMisconfigured
            doc: |-
              AskMisconfigured refuses an Ask that could never get an answer: the
              address has no host:port shape or no port in 1–65535, the path is not
              absolute, or the timeout is negative. Nothing is dialled; the argument
              field names which.
            name: AskMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/health: Ask refused its configuration before dialling; the argument field names what"
            public: The readiness probe was given an address, path or timeout it cannot use
            reason: ASK_MISCONFIGURED
          - code: CodeAskUnreachable
            doc: |-
              AskUnreachable reports an Ask that got no answer because the connection
              or the request failed. The transport's own error is the cause.
            name: AskUnreachable
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the connection or the request failed before any answer; the cause is the transport's"
            public: The process could not be reached
            reason: ASK_UNREACHABLE
          - code: CodeAskTimeout
            doc: |-
              AskTimeout reports an Ask with no answer when its budget ran out. A
              caller whose own context ended first gets the same code, with the
              context's error in the chain — the precedent CheckTimeout set for a
              departed caller.
            name: AskTimeout
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the budget or the caller's context ended before an answer arrived"
            public: The process did not answer the readiness probe in time
            reason: ASK_TIMEOUT
          - code: CodeAskNotReady
            doc: |-
              AskNotReady reports an Ask the process answered with a status other than
              200. The status field carries it; the body was drained and discarded and
              no byte of it is in the error.
            name: AskNotReady
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the process answered a status other than 200; the status field carries it"
            public: The process answered that it is not ready
            reason: ASK_NOT_READY
    types:
      - decl: true
        doc: |-
          Check is the body of a startup or readiness check: work that may reach
          outside the process, bounded by the context it is given.

          It MUST honour ctx. The engine cancels it when the check's own budget
          expires, and a check that ignores that cancellation turns a probe endpoint
          into a place the process can hang — the failure a health domain exists to
          prevent, not to cause.

          A nil error means the check passed. Any non-nil error means it failed; the
          error travels verbatim into the report, and only its errs Public half is
          ever rendered into an HTTP body.
        name: Check
        underlying: func(ctx context.Context) error
      - decl: true
        doc: |-
          SelfCheck is the body of a LIVENESS check: process-local evidence that this
          process can still do its job.

          It takes no context ON PURPOSE. Every API that talks to something outside
          this process wants one, so a SelfCheck cannot hold a dependency call without
          a closure that visibly throws the deadline away — which is a decision
          somebody has to write down, not a slip.

          What belongs here: a supervised goroutine that stopped reporting, a queue
          that has not drained in an hour, a deadlock detector, a broken in-memory
          invariant. What does NOT belong here, ever: a database, a cache, a broker,
          an HTTP dependency, a DNS lookup, or a mutex whose holder is waiting on one
          of those.

          A nil error means the process is alive.
        name: SelfCheck
        underlying: func() error
      - decl: true
        doc: |-
          StartupCheckValue registers a check that gates the startup probe: a
          migration that must have run, a warm cache that must have filled, a
          configuration that must have been fetched.

          A startup check runs until it PASSES ONCE, and is then never run again. That
          latch is per-check, so an expensive one-shot is not repeated because a
          cheaper sibling was still failing.

          The zero value is not registrable and is refused by AddStartup
          ([InvalidCheck]) rather than accepted and silently skipped.
        name: StartupCheckValue
        struct:
          fields:
            - doc: |-
                Name identifies the check in the report and in every error field. It
                must be non-empty and unique among startup checks.
              name: Name
              type: string
            - doc: |-
                Check is the body. It may reach outside the process; it is given a
                context carrying its own budget and MUST honour it.
              name: Check
              type: Check
            - doc: |-
                Timeout is this check's budget. A non-positive value is an unset field
                and CLAMPS to the registry's configured default — never to zero, which
                would turn a forgotten line into a check that fails before it runs
                (ADR 0031).

                A startup check is the one place a long budget is normal: a migration
                is allowed to take a minute, and the startup probe is precisely the
                signal that tells the orchestrator to keep waiting.
              name: Timeout
              type: time.Duration
      - decl: true
        doc: |-
          LivenessCheckValue registers PROCESS-LOCAL evidence that this process is not
          irrecoverable. A liveness failure restarts the replica.

          Its body is a [SelfCheck] — a func() error, with no context — and that is
          the whole mechanism by which a dependency check cannot land here: every API
          that talks to something outside this process takes a context, and a
          SelfCheck has none to give it. `LivenessCheckValue{Check: db.PingContext}`
          does not compile, and neither does any assignment or conversion between the
          two function types.

          What a closure can still do, the type cannot prevent — but wrapping a
          dependency call in `func() error { return db.Ping() }`, inside a literal
          spelled Liveness, is a decision in the diff rather than a slip.

          The zero value is not registrable and is refused by AddLiveness
          ([InvalidCheck]).
        name: LivenessCheckValue
        struct:
          fields:
            - doc: |-
                Name identifies the check in the report and in every error field. It
                must be non-empty and unique among liveness checks.
              name: Name
              type: string
            - doc: "Check is the body: process-local evidence only."
              name: Check
              type: SelfCheck
            - doc: |-
                Timeout is this check's budget, clamped exactly as
                [StartupCheckValue.Timeout] is.

                A SelfCheck cannot be cancelled — it has no context to cancel — so the
                budget bounds the WAIT and not the work: the engine stops waiting,
                reports the check as timed out, and does not start it again until the
                abandoned run finally returns. A liveness check that can outlive a
                budget is itself evidence worth reporting.
              name: Timeout
              type: time.Duration
      - decl: true
        doc: |-
          ReadinessCheckValue registers a check that gates ROUTING: the datastore, the
          broker, the cache, the downstream API. This is where every dependency check
          belongs, and the only registration that can express one.

          A readiness failure removes the replica from routing. It never restarts it,
          which is what stops a slow dependency from becoming a restart loop.

          The zero value is not registrable and is refused by AddReadiness
          ([InvalidCheck]).
        name: ReadinessCheckValue
        struct:
          fields:
            - doc: |-
                Name identifies the check in the report and in every error field. It
                must be non-empty and unique among readiness checks.
              name: Name
              type: string
            - doc: |-
                Check is the body. It is given a context carrying its own budget and
                MUST honour it: a readiness endpoint that blocks is a second outage on
                top of the one it was trying to report.
              name: Check
              type: Check
            - doc: |-
                Timeout is this check's budget, clamped exactly as
                [StartupCheckValue.Timeout] is.
              name: Timeout
              type: time.Duration
            - doc: |-
                NonCritical downgrades this check's failure from unhealthy to degraded,
                so the replica KEEPS taking traffic while the check fails.

                The field is negative — NonCritical rather than Critical — so that its
                zero value is the strict reading. A `Critical bool` would have made
                every check somebody forgot to mark into one that can never take a
                replica out of rotation, which is the failure worth making impossible.

                Use it for a dependency whose absence degrades the response rather than
                preventing it: a recommendation service, a metrics sink, a warm cache
                in front of a datastore that also answers directly.
              name: NonCritical
              type: bool
            - doc: |-
                MaxAge caches this check's LAST SUCCESSFUL result for up to that long,
                so an expensive check is not paid for on every poll.

                Zero means no cache — every probe runs the check — because a probe that
                silently reports a measurement nobody asked it to keep is the more
                surprising of the two behaviours.

                A value above the registry's ceiling is REFUSED at registration
                (the service's StaleCacheWindow) rather than clamped: the caller asked for a
                staleness the SDK will not vouch for, and quietly serving a different
                number is the same lie in a smaller size.

                Only SUCCESSES are cached. A failure is re-measured on every probe,
                because the answer an operator needs promptly is the one that says the
                outage ended.
              name: MaxAge
              type: time.Duration
      - decl: true
        doc: |-
          Probe names which of the three questions is being asked. It is a closed set
          of three, and the three are not interchangeable — see the package comment.

          The zero value is deliberately not one of them. A Probe is chosen by the
          caller at every call site, and there is no defensible default: answering
          "liveness" to a caller who forgot to say what they wanted is how a
          dependency outage becomes a restart loop.
        methods:
          - doc: |-
              String renders the probe for a log line. An out-of-range value renders as
              "unknown" rather than a number, because a Probe reaching a log with a value
              this package never mints is a defect worth reading as one.
            name: String
            out:
              - type: string
            recv: value
        name: Probe
        underlying: uint8
      - decl: true
        doc: |-
          ResultValue is one check's answer.

          It reports DECISIONS, not only outcomes. A check abandoned at its budget
          produces one, with TimedOut set — a report that only carried the checks that
          returned would make a wedged dependency look exactly like one that was never
          registered.
        methods:
          - doc: |-
              Age returns how stale this answer is as of now, which is zero for anything
              measured during the probe that reported it.

              It takes the instant rather than reading a clock so that the value type
              keeps no time source of its own: the engine already has an injected one, and
              a second, hidden, wall-clock read inside a domain value is exactly the thing
              that makes a staleness assertion untestable.
            in:
              - name: now
                type: time.Time
            name: Age
            out:
              - type: time.Duration
            recv: value
        name: ResultValue
        struct:
          fields:
            - doc: Name is the check's registered name.
              name: Name
              type: string
            - doc: |-
                Status is this check's verdict. A failing check is StatusUnhealthy, or
                StatusDegraded when it was registered NonCritical.
              name: Status
              type: Status
            - doc: |-
                TimedOut reports that the check had not answered when its budget
                expired. It is a FAILURE, not an unknown — see the package README and
                ADR 0060 §D4 — and this flag is what distinguishes "the dependency said
                no" from "the dependency said nothing".
              name: TimedOut
              type: bool
            - doc: |-
                Cached reports that this answer was not measured during this probe: it
                is a previous success replayed within the check's MaxAge window. Age
                says how old it is.
              name: Cached
              type: bool
            - doc: |-
                At is the instant the answer was MEASURED, read from the injected
                clock. On a cached result that is when the original run finished, not
                when the probe was served — reporting the probe's own instant would
                erase the very staleness the cache introduced.
              name: At
              type: time.Time
            - doc: |-
                Took is how long the measurement took. On an abandoned check it is the
                budget, because the engine does not know when the check eventually
                returned and reporting a guess would be worse than reporting the fact.
              name: Took
              type: time.Duration
            - doc: |-
                Err is what the check returned, VERBATIM, so the caller's errors.Is
                keeps working and an observation hook can log its Private half.

                It is never rendered into an HTTP body as-is. A handler renders the
                deepest errs Public it can find and a fixed SDK string otherwise, so a
                driver message carrying a host, a port or a query never reaches a probe
                response. See internal/service/app/health §"what the handler hides".
              name: Err
              type: error
      - decl: true
        doc: |-
          ReportValue is one probe's whole answer: the aggregate, and every check that
          contributed to it.

          Results is empty for a probe that short-circuited — a readiness probe while
          the process is starting or draining, a liveness probe while it is starting.
          That emptiness is the honest report: those probes deliberately ran nothing,
          and listing checks with stale verdicts would suggest otherwise.
        name: ReportValue
        struct:
          fields:
            - doc: Probe says which question was asked.
              name: Probe
              type: Probe
            - doc: |-
                Status is the aggregate: the worst of Results, or the short-circuit
                verdict when Results is empty. A probe with no checks at all is
                StatusHealthy — the process answering IS the evidence (ADR 0031).
              name: Status
              type: Status
            - doc: At is the instant the probe was answered, read from the injected clock.
              name: At
              type: time.Time
            - doc: |-
                Results carries one entry per check that contributed, in registration
                order — never in completion order, which would make two identical
                probes render differently and a diff of two responses unreadable.
              name: Results
              type: "[]ResultValue"
      - decl: true
        doc: |-
          Status is the verdict of one check or of a whole probe. It is a CLOSED set
          of three, ordered worst-first so that aggregating a set is `min` and the
          zero value is the conservative answer.

          That ordering is deliberate and load-bearing (ADR 0031). A Status is
          reachable as a struct field, and if StatusHealthy were the zero value then a
          forgotten assignment — anywhere, in the SDK or in a caller's own reporting —
          would read as "everything is fine". A forgotten assignment now reads as
          "unhealthy", which is wrong in the direction that gets noticed.
        methods:
          - doc: |-
              String renders the status for a log line and for an HTTP body. The three
              spellings are lowercase and stable: an operator greps them and a dashboard
              parses them, so they are part of the contract, not a formatting detail.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Serving reports whether a probe carrying this status should keep receiving
              traffic — which is exactly the question an HTTP status code answers.

              Degraded serves. That is the whole meaning of marking a check non-critical:
              if a degraded replica were removed from routing, a "non-critical" cache
              outage would take the fleet down just as thoroughly as a critical one.

              A Status outside the three does NOT serve — String already calls it
              "unknown", and a verdict nobody minted is the one that must not authorise
              routing (the zero-value rule of the type comment, applied to every other
              value nobody assigned on purpose).
            name: Serving
            impl: serving
            out:
              - type: bool
            recv: value
        name: Status
        underlying: uint8
  - constants:
      - doc: |-
          DefaultAskTimeout is the budget an Ask gets when [AskConfig.Timeout] is zero.

          Three seconds sits far above what a readiness endpoint answering from
          memory needs, and an order of magnitude under Docker's own HEALTHCHECK
          timeout of thirty seconds: a probe that cannot get an answer reports why,
          with its own code, before the supervisor gives up on the command itself.
        name: DefaultAskTimeout
        type: time.Duration
        value: "3000000000"
      - doc: |-
          MaxAskDrainBytes is how much of a response body Ask reads before closing it.

          Reading a short answer to its end lets the server finish writing instead of
          meeting a reset on every probe; the bound stops an endless or hostile body
          from holding the probe once the status, which is the whole answer, is in.
        name: MaxAskDrainBytes
        type: int64
        value: 64 << 10
      - doc: |-
          DefaultCheckTimeout is the per-check budget a non-positive Timeout clamps
          to.

          One second, and the number is defensible rather than round. A probe is
          polled on a period an orchestrator owns — Kubernetes defaults to
          periodSeconds 10 with timeoutSeconds 1 — and the SDK's own budget has to sit
          UNDER the orchestrator's, or the orchestrator gives up first and the caller
          gets no body, no attribution and no idea which check was slow.

          A check that legitimately needs longer than a second is a check that should
          carry a [corehealth.ReadinessCheckValue.MaxAge] and be measured off the
          probe path, not one that should be given a longer budget on it.
        name: DefaultCheckTimeout
        type: time.Duration
        value: "1000000000"
      - doc: |-
          MaxCacheAge is the ceiling on [corehealth.ReadinessCheckValue.MaxAge]. A
          registration above it is REFUSED ([corehealth.StaleCacheWindow]), never clamped.

          Thirty seconds is three conventional poll periods. Past that, at most three
          consecutive probes could replay one measurement — which is already longer
          than an operator watching a probe recover would wait before concluding it
          had not. A cached answer is a dated statement; beyond this bound it is
          simply a claim the SDK cannot support, and quietly serving 30s to a caller
          who asked for five minutes would be the same lie in a smaller size.
        name: MaxCacheAge
        type: time.Duration
        value: "30000000000"
    doc: |-
      Package health — hosts Ask, the client half of a readiness probe: the
      question a container's HEALTHCHECK asks a running process, from an image
      that has no shell and no curl to ask it with (ADR 0131).

      Package health — hosts the wire shape of a probe response: the body, and the
      one check inside it. The two live together because the pair IS the document,
      and because keeping them in one file keeps the list of what may leave this
      process on one screen.

      Package health — hosts the lifecycle wiring: the one registration that makes
      "not ready" precede a drain instead of following it.

      Package health — hosts Config, the registry's construction parameters, and
      the two bounds the SDK will not let a caller past.

      Package health — hosts the registered check: what the registry remembers
      about it between probes, and the three accesses that read and move that
      memory.

      Package health — hosts the three HTTP handlers. There are three because a
      single handler that read the probe out of the URL would let a routing
      mistake serve liveness on the readiness path — which is the domain's central
      failure wearing a different hat.

      Package health — hosts HandlerConfig, the one knob the three handlers take.

      Package health implements the SDK's process-health domain: the registry
      behind core/app/health.Health, the per-check budget, the bounded result cache,
      the three HTTP handlers, and the opt-in lifecycle and sd_notify wiring.
      Admitted by ADR 0060.

      # What the handler hides

      A probe endpoint is exposed more widely than whoever added it expected. The
      body therefore never carries a check's raw error: a handler renders the
      deepest errs Public it can find, and a fixed SDK string when there is none.
      A caller's own typed error keeps its identity through origin-wins, so a
      Public they wrote — already validated wire-safe by errs — is what a stranger
      reads, while `dial tcp 10.0.3.14:5432: connect: connection refused` is
      replaced wholesale rather than trimmed. The full error goes to
      Config.OnReport, which is the caller's own log.

      # What a budget expiring means

      Exactly three things: the run's context is cancelled (an announcement), the
      registry stops waiting, and a [corehealth.CheckTimeout] result is recorded. No
      goroutine is killed — Go cannot — and nothing the check holds is closed on
      its behalf. A check that outlives its budget keeps ONE goroutine until it
      returns, and the next probe joins that same run instead of starting another;
      see [inflight].

      Package health — hosts the single-flight run that keeps a wedged check from
      becoming a goroutine factory.

      Package health — hosts the opt-in sd_notify wiring. It WIRES the notifier
      the SDK already ships; it does not reimplement one.

      Package health — hosts the probe answers: the phase the process is in, the
      three short-circuits that make the phases mean something, and the
      aggregation rule.

      Package health — hosts the execution of one check: its budget, its panic
      recovery, and the wrapping that decides what a stranger reading the probe
      body is allowed to learn.
    functions:
      - doc: |-
          Ask asks the process listening on cfg.Addr whether it is ready, as a
          container's HEALTHCHECK does: one GET of cfg.Path over plain HTTP. It
          returns the status the process answered — zero when no whole answer arrived
          within the bound — and a nil error exactly when that status is 200.

          Otherwise the error says why, by code:

            - [corehealth.AskMisconfigured]: cfg cannot reach anything; nothing was dialled.
            - [corehealth.AskUnreachable]: the connection or the request failed; the
              transport's error is the cause.
            - [corehealth.AskTimeout]: the budget, or the caller's context, ended before an
              answer — or while its body was still arriving: a process that sends
              200 and then stalls has not answered within the bound. A caller's own
              context error stays in the chain.
            - [corehealth.AskNotReady]: the process answered another status, carried by the
              status field. A redirect is such an answer: none is followed, so a
              probe cannot be sent elsewhere.

          The exchange never goes through a proxy, whatever the environment says, and
          keeps no connection alive. At most [MaxAskDrainBytes] of the body are read,
          then the body is closed; no byte of it ever reaches an error.
        in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: AskConfig
        name: Ask
        out:
          - name: status
            type: int
          - name: err
            type: error
      - doc: |-
          Component adapts a registry to core/app/lifecycle: its Start runs the startup
          checks, and its Stop marks the process draining.

          # Add it LAST

          One rule, and it happens to be right in both directions, because a
          Lifecycle's stop order is the exact reverse of its Add order (ADR 0050):

            - Added last, it STARTS last — so its startup checks run after every
              component they might depend on is already up, which is the only order in
              which "the migration ran" is a question worth asking.
            - Added last, it STOPS first — so readiness flips to not-ready before a
              single other component begins closing. That is the whole point: an
              orchestrator observes the 503, withdraws the replica from routing, and
              the drain then runs against a socket nothing new arrives on.

          Get that order wrong and the drain begins while the load balancer is still
          sending traffic — the connections the drain is waiting for keep being
          created, and the shutdown budget expires against work that never stops
          arriving.

          Liveness deliberately keeps answering through the whole shutdown, so the
          orchestrator withdraws the replica rather than killing it.
        in:
          - name: registry
            type: corehealth.Health
          - name: name
            type: string
        name: Component
        out:
          - type: corelc.ComponentValue
      - doc: |-
          NewStartupHandler serves the startup probe: 200 once every startup check has
          passed, 503 while any has not.
        in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewStartupHandler
        out:
          - type: http.Handler
      - doc: |-
          NewReadinessHandler serves the readiness probe: 200 while the replica can
          take traffic (healthy OR degraded), 503 otherwise — including while starting
          and after Drain.
        in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewReadinessHandler
        out:
          - type: http.Handler
      - doc: |-
          NewLivenessHandler serves the liveness probe: 200 unless the process is
          irrecoverable.

          Nothing outside the process can make this return 503, because nothing
          outside the process can be registered on it — see core/app/health.SelfCheck.
        in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewLivenessHandler
        out:
          - type: http.Handler
      - doc: |-
          New returns a Health built from cfg. It cannot fail: a nil Clock falls back
          to clock.System, a non-positive DefaultTimeout to [DefaultCheckTimeout], and
          nil hooks to no observation — all working configurations rather than inert
          ones (ADR 0031). What CAN fail — an unrunnable check, a duplicate name, a
          cache window the SDK will not vouch for — fails at registration, where the
          caller made the mistake.

          A registry with no checks is legitimate and answers every probe healthy: the
          process replying IS the evidence that it is running.
        in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: corehealth.Health
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/app/health
    types:
      - decl: true
        doc: |-
          AskConfig says where a process listens and which path answers whether it is
          ready. Addr and Path are required; Timeout and Clock have working zeros.
        name: AskConfig
        struct:
          fields:
            - doc: |-
                Addr is the address the process LISTENS on, spelled as its listener was
                given it: ":4000", "0.0.0.0:4000", "[::]:4000", "127.0.0.1:4000",
                "localhost:4000". An unspecified host is not an address one can dial,
                so it becomes this machine's loopback of the same family: an empty host
                and 0.0.0.0 dial 127.0.0.1, :: dials ::1. Any other host is dialled as
                written. The port must be a number from 1 to 65535.
              name: Addr
              type: string
            - doc: |-
                Path is the readiness endpoint, absolute and with an optional query:
                "/readyz", "/_kit/health/ready".
              name: Path
              type: string
            - doc: |-
                Timeout bounds the whole exchange: dial, request, answer and drained
                body. Zero is [DefaultAskTimeout]; a negative value is refused. The
                caller's context bounds the exchange too, and whichever ends first ends
                it.
              name: Timeout
              type: time.Duration
            - doc: |-
                Clock is the time source the budget is armed on; nil is clock.System. A
                manual clock makes the timeout a test can reach without waiting.
              name: Clock
              type: clock.Timed
      - decl: true
        doc: |-
          Config parameterises [New]. Every field is optional and the zero value
          builds a working registry — one that runs on the wall clock, gives each
          check [DefaultCheckTimeout], observes nothing and notifies nobody.

          A registry with no checks at all is a legitimate registry (ADR 0031): every
          probe answers healthy, because the process answering IS the evidence that it
          is running.
        name: Config
        struct:
          fields:
            - doc: |-
                Clock is the time source the registry reads AND waits on. A nil Clock
                falls back to clock.System.

                It is clock.Timed rather than clock.Clock because this engine does both
                halves: it stamps every result and it waits out every check budget.
                Reading package time directly instead would make every timeout
                assertion in the suite a sleep, a sleep a tolerance, and a tolerance a
                flake somebody eventually deletes — taking the guard on "a slow
                dependency must not restart the process" with it.
              name: Clock
              type: clock.Timed
            - doc: |-
                DefaultTimeout is the budget a check gets when its own Timeout is
                non-positive. A non-positive value here clamps in turn to
                [DefaultCheckTimeout].

                It CLAMPS rather than refuses because the fallback is not arbitrary: it
                is a documented, exported constant tied to a stated argument about poll
                periods. What must never happen is the third reading — that a zero
                means "no time at all" — which would turn a forgotten line into a probe
                where every check fails before it runs (ADR 0031).
              name: DefaultTimeout
              type: time.Duration
            - doc: |-
                OnReport observes every probe the registry answers, after the verdict
                is computed and before it is returned.

                Calls are SERIALISED: the hook need not be safe for concurrent use, and
                in exchange a hook that blocks blocks the probe. Keep it short; hand
                off to a logger or a channel rather than doing work in it.

                This is where a check's FULL error belongs — its Private half, its
                fields, the driver's own message. None of that ever reaches an HTTP
                body; the split is the whole point (ADR 0060 §D6).

                A nil hook is a working configuration. It does mean the reports go
                NOWHERE — the SDK will not write them to stderr on the caller's behalf,
                and never to stdout at all (ADR 0030).
              name: OnReport
              type: func(corehealth.ReportValue)
            - doc: |-
                Notify asks for the systemd sd_notify(3) readiness protocol: READY=1
                the first time a READINESS probe reports a serving status, and STATUS=
                on every aggregate change after that.

                It is deliberately driven by readiness and not by startup. "Every
                component constructed" and "this replica can serve a request" are two
                different claims, and a supervisor that acts on the first while the
                second is false starts routing to a process that cannot answer.
                lifecycle.RunConfig.Notify makes the earlier claim; use one or the
                other, not both.

                It is safe to set on a process that may not be supervised: with
                $NOTIFY_SOCKET unset every notifier call is a documented no-op that
                returns nil, so an unsupervised binary stays silent rather than
                failing.
              name: Notify
              type: bool
            - doc: |-
                OnNotifyError receives a [corehealth.NotifyFailed] when an opt-in sd_notify
                datagram could not be delivered.

                It is a second hook rather than a second argument to OnReport because
                the two have different audiences: a probe verdict is for whatever
                watches the service, and a supervisor datagram that did not arrive is
                for whoever wired the unit file. Folding them together would make every
                observer switch on which of the two it had been handed.

                A nil hook drops the error, for the same ADR 0030 reason OnReport does:
                the SDK writes nothing anywhere on the caller's behalf.
              name: OnNotifyError
              type: func(error)
      - decl: true
        doc: |-
          HandlerConfig parameterises the three handlers. Its zero value serves the
          aggregate and NOTHING else.
        name: HandlerConfig
        struct:
          fields:
            - doc: |-
                Detail adds the per-check breakdown to the body.

                It is off by default because the default reader of a probe body is an
                orchestrator that only looks at the status code, while the default
                REACHER of a probe endpoint is more or less anyone on the network. Even
                with it on, a check contributes its name, its status, its timing and an
                errs Public — never a raw error, never a Private, never a field.
              name: Detail
              type: bool
  - doc: |-
      Package health is the public facade for the SDK's process-health domain:
      the three probes an orchestrator asks, and the checks that answer them.

      	h := health.New(health.Config{})

      	// a dependency. It can only be registered here.
      	_ = h.AddReadiness(health.ReadinessCheck{Name: "db", Check: db.PingContext})

      	// process-local evidence. It takes no context, so a dependency cannot
      	// reach it: `health.LivenessCheck{Check: db.PingContext}` does not compile.
      	_ = h.AddLiveness(health.LivenessCheck{Name: "workers", Check: pool.Alive})

      	mux.Handle("/healthz", health.NewLivenessHandler(h, health.HandlerConfig{}))
      	mux.Handle("/readyz", health.NewReadinessHandler(h, health.HandlerConfig{}))

      # Liveness and readiness are not the same signal

      A saturated service is not a dead service. When a liveness probe fails
      because a dependency is slow, the orchestrator KILLS the replica; its
      traffic moves to the replicas that remain, which are now nearer the same
      saturation, and fail the same probe. That is a cascading outage whose cause
      is the probe, and it is the reason this package exists.

      So the rule is structural, not documentary. A dependency check cannot be
      registered on liveness:

        - [ReadinessCheck] and [StartupCheck] carry a [Check] — func(ctx) error —
          which is the shape every dependency API in Go wants.
        - [LivenessCheck] carries a [SelfCheck] — func() error — with no context
          to hand a dependency call at all. The two function types are not
          assignable in either direction, so the mistake does not compile.

      Two further absences say the same thing: [LivenessCheck] has no NonCritical
      field, because "somewhat irrecoverable" restarts nothing; and no MaxAge,
      because a cached liveness answer means a dead process can keep replaying the
      "alive" it recorded before it died.

      # The three states

      Startup is not a third flavour of readiness. It is the state in which the
      process must be neither killed nor routed to:

        - While a [StartupCheck] has yet to pass, the liveness probe reports
          healthy WITHOUT running anything, and readiness reports not-ready
          without running anything. A slow start therefore cannot become a restart
          loop. The price is stated: a process wedged during startup is never
          killed by liveness, and the startup probe's own failure is the signal an
          orchestrator must act on.
        - A startup check runs until it passes ONCE and is then never run again.
        - After [Health].Drain, readiness reports not-ready permanently while
          liveness keeps answering — so the replica is withdrawn from routing
          rather than killed while it finishes its work.

      # What a timeout means

      Every check has a budget, and a check that has not answered by then is a
      FAILURE, not an unknown. A probe exists to answer within a bounded time, and
      "I could not answer" is operationally the same as "no" for whoever must
      decide about routing. What is preserved is the distinction: the result
      carries TimedOut, which separates "the dependency said no" from "the
      dependency said nothing".

      A non-positive [StartupCheck].Timeout clamps to [Config].DefaultTimeout, and
      a non-positive one there clamps to [DefaultCheckTimeout] (1s). Zero is never
      read as "no time at all": that would turn a forgotten line into a probe
      where every check fails before it runs.

      The budget bounds the WAIT. Nothing kills a check's goroutine — Go cannot —
      and nothing it holds is closed on its behalf. A check that outlives its
      budget keeps exactly ONE goroutine until it returns, because the next probe
      joins that same run instead of starting a second: an endpoint polled every
      ten seconds against a dependency call with no deadline must not accumulate a
      goroutine every ten seconds.

      # What a cached answer means

      [ReadinessCheck].MaxAge replays the last SUCCESS for up to that long, so an
      expensive check is not paid for on every poll. Three bounds keep it from
      becoming a lie:

        - It is OFF by default. A probe that silently replays a measurement nobody
          asked it to keep is the more surprising of the two behaviours.
        - A value above [MaxCacheAge] (30s) is REFUSED at registration, never
          clamped. Serving 30s to a caller who asked for five minutes is the same
          lie in a smaller size.
        - Only successes are cached. A failure is re-measured on every probe,
          because the answer an operator needs promptly is the one that says the
          outage ended.

      Every result carries the instant it was measured, so a replayed answer is a
      dated statement rather than a current one.

      # Aggregation

      A probe is as healthy as its least healthy check, and criticality decides
      how bad a failure is. A failing check is [StatusUnhealthy], or
      [StatusDegraded] when it was registered NonCritical. Degraded SERVES — the
      handler returns 200 — because a degraded replica removed from rotation would
      make "non-critical" mean nothing. Degraded never masks unhealthy.

      The field is spelled NonCritical rather than Critical so that its zero value
      is the strict reading: a check somebody forgot to mark must not be one that
      can never take a replica out of rotation.

      A registry with NO checks is legitimate and answers healthy. The process
      replying is the evidence.

      # What the handler exposes, and what it hides

      The body is `{"status":"healthy"}` and nothing else unless
      [HandlerConfig].Detail is set. Even then, a check contributes its name, its
      status, its timing and a reason drawn from the errs Public half — never a
      raw error, never a Private, never a field. A caller's own typed error keeps
      its identity through origin-wins, so a wire-safe message they wrote is what
      a stranger reads; a plain error such as `dial tcp 10.0.3.14:5432: connect:
      connection refused` is replaced wholesale rather than trimmed. The full
      error goes to [Config].OnReport, which is the caller's own log.

      The handlers write to the ResponseWriter and nowhere else — never stdout,
      which may be the process's protocol channel (ADR 0030). Responses carry
      Cache-Control: no-store, only GET and HEAD are answered, and the query
      string is never read.

      There are three handler constructors rather than one that reads the probe
      from the URL, because a routing mistake must not be able to serve liveness
      on the readiness path.

      # Wiring it to a lifecycle

      [Component] adapts a registry to pkg/v1/app/lifecycle. Add it LAST: added last
      it starts last, so its startup checks run after everything they depend on is
      up; and added last it stops FIRST, so readiness flips to not-ready before a
      single component begins closing. That ordering is what lets an orchestrator
      withdraw the replica from routing before the drain begins, instead of
      draining against traffic that keeps arriving.

      # Asking a running process

      [Ask] is the other end: the question a container's HEALTHCHECK asks, from a
      binary that ships in an image with no shell and no curl to ask it with. The
      same executable answers it as a subcommand:

      	status, err := health.Ask(ctx, health.AskConfig{Addr: ":4000", Path: "/readyz"})
      	if err != nil {
      		fmt.Fprintln(os.Stderr, err) // why: ASK_UNREACHABLE, ASK_TIMEOUT, ASK_NOT_READY
      		os.Exit(1)
      	}

      Addr is the address the process LISTENS on, spelled as its listener was
      given it; a host that names no particular address — empty, 0.0.0.0, :: — is
      dialled on this machine's loopback of the same family, since no connection
      can be made to an unspecified address. Ready means one thing: the process
      answered 200. The exchange is bounded by [DefaultAskTimeout] (or
      [AskConfig].Timeout) and by the caller's context, follows no redirect, goes
      through no proxy whatever the environment says, reads at most
      [MaxAskDrainBytes] of the body and closes it, and no byte of that body ever
      reaches an error: [AskNotReady] carries the status alone. The body is part of
      the answer: a process that sends 200 and then stalls until the bound ends
      has not answered within it, and gets [AskTimeout].
    facade:
      - const:
          - doc: |-
              StatusUnhealthy is a failing critical check, or a probe with one. It is
              the ZERO value of Status on purpose: a forgotten assignment must read
              as "not serving", never as "everything is fine".
            name: StatusUnhealthy
            reexport: corehealth.StatusUnhealthy
            type: Status
            typed: true
            value: "0"
          - doc: |-
              StatusDegraded is a failing NON-critical check. It is a serving state:
              the handler returns 200.
            name: StatusDegraded
            reexport: corehealth.StatusDegraded
            type: Status
            typed: true
            value: "1"
          - doc: |-
              StatusHealthy is every check passing — including a probe with no checks
              registered at all.
            name: StatusHealthy
            reexport: corehealth.StatusHealthy
            type: Status
            typed: true
            value: "2"
          - doc: ProbeStartup asks "is this process still coming up?".
            name: ProbeStartup
            reexport: corehealth.ProbeStartup
            type: Probe
            typed: true
            value: "1"
          - doc: ProbeReadiness asks "can this replica take traffic right now?".
            name: ProbeReadiness
            reexport: corehealth.ProbeReadiness
            type: Probe
            typed: true
            value: "2"
          - doc: ProbeLiveness asks "is this process irrecoverable?".
            name: ProbeLiveness
            reexport: corehealth.ProbeLiveness
            type: Probe
            typed: true
            value: "3"
          - doc: |-
              DefaultCheckTimeout is the per-check budget a non-positive Timeout
              clamps to.
            name: DefaultCheckTimeout
            reexport: svchealth.DefaultCheckTimeout
            type: time.Duration
            typed: true
            value: "1000000000"
          - doc: |-
              MaxCacheAge is the ceiling on ReadinessCheck.MaxAge. Above it, a
              registration is refused rather than clamped.
            name: MaxCacheAge
            reexport: svchealth.MaxCacheAge
            type: time.Duration
            typed: true
            value: "30000000000"
          - doc: |-
              DefaultAskTimeout is the budget an Ask gets when AskConfig.Timeout is
              zero: three seconds, an order of magnitude under Docker's own
              HEALTHCHECK timeout, so a probe that gets no answer says why first.
            name: DefaultAskTimeout
            reexport: svchealth.DefaultAskTimeout
            type: time.Duration
            typed: true
            value: "3000000000"
          - doc: |-
              MaxAskDrainBytes is how much of a response body Ask reads before it
              closes the connection: enough for any readiness answer to end politely,
              and a bound on one that never ends.
            name: MaxAskDrainBytes
            reexport: svchealth.MaxAskDrainBytes
            type: int64
            typed: true
            value: 64 << 10
      - alias:
          - doc: |-
              Check is the public alias for the ctx-aware body of a startup or readiness
              check. It is the shape a dependency call has.
            name: Check
            target: corehealth.Check
      - alias:
          - doc: |-
              SelfCheck is the public alias for the body of a LIVENESS check. It takes no
              context, which is what keeps a dependency call out of the probe that
              restarts the process.
            name: SelfCheck
            target: corehealth.SelfCheck
      - alias:
          - doc: Health is the public alias for the registry contract.
            name: Health
            target: corehealth.Health
      - alias:
          - doc: Status is the public alias for a check's or a probe's verdict.
            name: Status
            target: corehealth.Status
      - alias:
          - doc: Probe is the public alias for which of the three questions is being asked.
            name: Probe
            target: corehealth.Probe
      - alias:
          - doc: StartupCheck is the public alias for a check that gates startup.
            name: StartupCheck
            target: corehealth.StartupCheckValue
      - alias:
          - doc: |-
              ReadinessCheck is the public alias for a check that gates routing. Every
              dependency check belongs here.
            name: ReadinessCheck
            target: corehealth.ReadinessCheckValue
      - alias:
          - doc: |-
              LivenessCheck is the public alias for process-local evidence that the
              process is not irrecoverable.
            name: LivenessCheck
            target: corehealth.LivenessCheckValue
      - alias:
          - doc: Result is the public alias for one check's answer.
            name: Result
            target: corehealth.ResultValue
      - alias:
          - doc: Report is the public alias for one probe's whole answer.
            name: Report
            target: corehealth.ReportValue
      - alias:
          - doc: Config is the public alias for the registry's construction parameters.
            name: Config
            target: svchealth.Config
      - alias:
          - doc: HandlerConfig is the public alias for a handler's body verbosity.
            name: HandlerConfig
            target: svchealth.HandlerConfig
      - alias:
          - doc: |-
              AskConfig is the public alias for where a process listens and which path
              answers whether it is ready: Addr and Path are required, Timeout and Clock
              have working zeros.
            name: AskConfig
            target: svchealth.AskConfig
      - var:
          - doc: |-
              InvalidCheck is returned by every Add for a check that could never run
              — an empty Name or a nil Check. The "missing" field names which.
            name: InvalidCheck
            reexport: corehealth.InvalidCheck
            type: "*errs.Error"
          - doc: |-
              DuplicateCheck is returned by an Add whose name is already registered
              on that probe. The namespace is per probe, so the same name may appear
              once on readiness and once on liveness.
            name: DuplicateCheck
            reexport: corehealth.DuplicateCheck
            type: "*errs.Error"
          - doc: |-
              UnknownProbe is carried by a report for a Probe value the SDK never
              mints, including the zero value.
            name: UnknownProbe
            reexport: corehealth.UnknownProbe
            type: "*errs.Error"
          - doc: |-
              CheckPanicked is the failure of a check whose body panicked. It was
              recovered; the panic value travels as a field and never reaches a body.
            name: CheckPanicked
            reexport: corehealth.CheckPanicked
            type: "*errs.Error"
          - doc: |-
              CheckFailed is the identity a PLAIN error from a check is given. An
              error that already carries an SDK Code keeps its own.
            name: CheckFailed
            reexport: corehealth.CheckFailed
            type: "*errs.Error"
          - doc: |-
              CheckTimeout reports a check that had not answered when its budget
              expired. A failure, not an unknown — Result.TimedOut is what
              distinguishes it.
            name: CheckTimeout
            reexport: corehealth.CheckTimeout
            type: "*errs.Error"
          - doc: |-
              StaleCacheWindow is returned by AddReadiness for a MaxAge above
              MaxCacheAge.
            name: StaleCacheWindow
            reexport: corehealth.StaleCacheWindow
            type: "*errs.Error"
          - doc: |-
              StartupPending is the synthetic result of a readiness probe answered
              while the process is still starting. No readiness check was run.
            name: StartupPending
            reexport: corehealth.StartupPending
            type: "*errs.Error"
          - doc: |-
              Draining is the synthetic result of a readiness probe answered after
              Drain. No readiness check was run, and no later probe will say anything
              else.
            name: Draining
            reexport: corehealth.Draining
            type: "*errs.Error"
          - doc: |-
              NotifyFailed reaches Config.OnNotifyError when an opt-in sd_notify
              datagram could not be delivered.
            name: NotifyFailed
            reexport: corehealth.NotifyFailed
            type: "*errs.Error"
          - doc: |-
              AskMisconfigured refuses an Ask no answer could satisfy — an address
              with no usable port, a path that is not absolute, a negative timeout —
              before anything is dialled. The "argument" field names which.
            name: AskMisconfigured
            reexport: corehealth.AskMisconfigured
            type: "*errs.Error"
          - doc: |-
              AskUnreachable reports an Ask the process never answered because the
              connection or the request failed; the transport's error is the cause.
            name: AskUnreachable
            reexport: corehealth.AskUnreachable
            type: "*errs.Error"
          - doc: |-
              AskTimeout reports an Ask with no answer when its budget, or the
              caller's context, ended. A caller's own context error stays in the
              chain, so errors.Is answers context.Canceled or DeadlineExceeded too.
            name: AskTimeout
            reexport: corehealth.AskTimeout
            type: "*errs.Error"
          - doc: |-
              AskNotReady reports an Ask the process answered with a status other
              than 200 — a redirect included, since none is followed. The "status"
              field carries it; the body never does.
            name: AskNotReady
            reexport: corehealth.AskNotReady
            type: "*errs.Error"
      - func:
          doc: |-
            New returns a Health. It cannot fail: a nil cfg.Clock falls back to the wall
            clock, a non-positive cfg.DefaultTimeout to DefaultCheckTimeout, and nil
            hooks to no observation. What can fail fails at registration.
          forward: svchealth.New
          in:
            - name: cfg
              type: Config
          name: New
          out:
            - type: Health
      - func:
          doc: |-
            Worst returns the more severe of two statuses — the SDK's whole aggregation
            rule, exported so a caller composing several registries applies the same one.
          forward: corehealth.Worst
          in:
            - name: a
            - name: b
              type: Status
          name: Worst
          out:
            - type: Status
      - func:
          doc: |-
            Component adapts a registry to pkg/v1/app/lifecycle: its Start runs the startup
            checks, its Stop marks the process draining. The returned value IS a
            lifecycle.Component.

            Add it LAST — see the package documentation for why one rule covers both
            directions.
          forward: svchealth.Component
          in:
            - name: registry
              type: Health
            - name: name
              type: string
          name: Component
          out:
            - type: corelc.ComponentValue
      - func:
          doc: |-
            NewStartupHandler serves the startup probe: 200 once every startup check has
            passed, 503 while any has not.
          forward: svchealth.NewStartupHandler
          in:
            - name: registry
              type: Health
            - name: cfg
              type: HandlerConfig
          name: NewStartupHandler
          out:
            - type: http.Handler
      - func:
          doc: |-
            NewReadinessHandler serves the readiness probe: 200 while the replica can
            take traffic (healthy OR degraded), 503 otherwise — including while starting
            and after Drain.
          forward: svchealth.NewReadinessHandler
          in:
            - name: registry
              type: Health
            - name: cfg
              type: HandlerConfig
          name: NewReadinessHandler
          out:
            - type: http.Handler
      - func:
          doc: |-
            NewLivenessHandler serves the liveness probe: 200 unless the process is
            irrecoverable. Nothing outside the process can make it return 503, because
            nothing outside the process can be registered on it.
          forward: svchealth.NewLivenessHandler
          in:
            - name: registry
              type: Health
            - name: cfg
              type: HandlerConfig
          name: NewLivenessHandler
          out:
            - type: http.Handler
      - func:
          doc: |-
            Ask asks the process listening on cfg.Addr whether it is ready: one GET of
            cfg.Path over plain HTTP, the question a container's HEALTHCHECK asks. It
            returns the status the process answered — zero when no whole answer, body
            included, arrived within the bound — and a nil error exactly when that
            status is 200; otherwise the error is
            AskMisconfigured, AskUnreachable, AskTimeout or AskNotReady. See the package
            documentation for what the exchange refuses to do.
          forward: svchealth.Ask
          in:
            - name: ctx
              type: context.Context
            - name: cfg
              type: AskConfig
          name: Ask
          out:
            - name: status
              type: int
            - name: err
              type: error
    imports:
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      svchealth: github.com/kitsunium/sdk/internal/service/app/health
    path: github.com/kitsunium/sdk/pkg/v1/app/health
