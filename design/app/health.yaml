apiVersion: kit.kitsunium/design/v2
domain: app/health
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidCheck identifies a registration refused because the check could
              never run: an empty name or a nil body.
            name: CodeInvalidCheck
            note: "range: 0.2.29.0 - 0.2.29.255"
            value: "0x00_02_1D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateCheck identifies a registration refused because the name is
              already taken on that probe.
            name: CodeDuplicateCheck
            value: "0x00_02_1D_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownProbe identifies a Probe value this package never mints,
              including the zero value.
            name: CodeUnknownProbe
            value: "0x00_02_1D_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckPanicked identifies a check whose body panicked; the engine
              recovered it and turned it into that check's failure.
            name: CodeCheckPanicked
            value: "0x00_02_1D_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckFailed identifies a check that returned an error. It is the code
              the registry wraps a PLAIN cause with; an *errs.Error cause keeps its own
              code, reason and Public through origin-wins, which is how a caller's own
              wire-safe message reaches a probe body and a driver's does not.
            name: CodeCheckFailed
            note: |-
              range: 0.3.59.0 - 0.3.59.255

              The engine's verdicts on a probe and on the loopback Ask. The range was
              allocated to internal/service/app/health, which raises these codes, and it
              is declared here with the registration refusals so that every code of the
              domain is in one place (ADR 0160). A code keeps the value its allocation
              gave it whichever layer declares it, so the layer byte still reads 3.
            value: "0x00_03_3B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCheckTimeout identifies a check that had not answered when its budget
              expired. Its context was cancelled and the registry stopped waiting; the
              goroutine was not killed and nothing it holds was closed on its behalf.
            name: CodeCheckTimeout
            value: "0x00_03_3B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeStaleCacheWindow identifies a readiness registration refused because its
              MaxAge exceeds the MaxCacheAge ceiling internal/service/app/health enforces.
            name: CodeStaleCacheWindow
            value: "0x00_03_3B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeStartupPending identifies a readiness probe answered while the process
              is still starting. No readiness check was run.
            name: CodeStartupPending
            value: "0x00_03_3B_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDraining identifies a readiness probe answered after Drain. No readiness
              check was run, and no later probe will report anything else.
            name: CodeDraining
            value: "0x00_03_3B_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotifyFailed identifies an opt-in sd_notify datagram that could not be
              delivered.
            name: CodeNotifyFailed
            value: "0x00_03_3B_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskMisconfigured identifies an Ask refused before anything was dialled:
              an address with no usable port, a path that is not absolute, a negative
              timeout (ADR 0131).
            name: CodeAskMisconfigured
            value: "0x00_03_3B_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskUnreachable identifies an Ask that got no answer because the
              connection or the request failed: refused, reset, no route, a name that does
              not resolve.
            name: CodeAskUnreachable
            value: "0x00_03_3B_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskTimeout identifies an Ask whose budget, or whose caller's context,
              ended before the process answered.
            name: CodeAskTimeout
            value: "0x00_03_3B_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeAskNotReady identifies an Ask the process answered with a status other
              than 200 — a redirect included, since none is followed.
            name: CodeAskNotReady
            value: "0x00_03_3B_0A"
        type: errs.Code
    constants:
      - name: ProbeStartup
        type: Probe
        value: "1"
      - name: ProbeReadiness
        type: Probe
        value: "2"
      - name: ProbeLiveness
        type: Probe
        value: "3"
      - name: StatusUnhealthy
        type: Status
        value: "0"
      - name: StatusDegraded
        type: Status
        value: "1"
      - name: StatusHealthy
        type: Status
        value: "2"
    functions:
      - in:
          - name: a
          - name: b
            type: Status
        name: Worst
        out:
          - type: Status
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/health
    ports:
      - doc: |-
          Health owns the registered checks and answers the three probes.
          Implementations MUST be safe for concurrent use: probes arrive from an
          orchestrator on their own schedule, concurrently with each other and with
          the application's own shutdown.

          IFACE-PLUGIN: the concrete registry stays unexported behind its constructor
          in internal/service/app/health.
        methods:
          - doc: |-
              AddStartup registers a check that gates the startup probe. It is
              refused on an empty name or a nil body ([InvalidCheck]), and on a name
              already registered for the startup probe ([DuplicateCheck]).
            in:
              - name: check
                type: StartupCheckValue
            name: AddStartup
            out:
              - type: error
          - doc: |-
              AddReadiness registers a check that gates routing. The same refusals,
              over the readiness namespace.
            in:
              - name: check
                type: ReadinessCheckValue
            name: AddReadiness
            out:
              - type: error
          - doc: |-
              AddLiveness registers process-local evidence that the process is not
              irrecoverable. The same refusals, over the liveness namespace.
            in:
              - name: check
                type: LivenessCheckValue
            name: AddLiveness
            out:
              - type: error
          - doc: |-
              Probe answers one probe. It never returns an error: a probe that could
              not be answered IS an answer, and the answer is the report's Status
              (see [ReportValue]). A Probe value this package never mints reports
              StatusUnhealthy carrying one [UnknownProbe] result, rather than
              defaulting to a verdict nobody asked for.
            in:
              - name: ctx
                type: context.Context
              - name: probe
                type: Probe
            name: Probe
            out:
              - type: ReportValue
          - doc: |-
              Drain marks the process as going away: readiness reports not-ready from
              here on, without running a single check, while liveness keeps answering
              normally so a draining process is not killed mid-drain.

              It is idempotent and it is ONE-WAY. There is deliberately no Undrain: a
              process that has announced its departure has already had its endpoints
              withdrawn, and a flap would return live traffic to a process that is
              closing the very dependencies that traffic needs.
            name: Drain
        name: Health
    sentinels:
      - var:
          - code: CodeInvalidCheck
            doc: |-
              InvalidCheck is returned by every Add for a check that could never run.
              The "missing" field names which half is absent.
            name: InvalidCheck
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: check has an empty name or a nil body; the field names which"
            public: The health check is not runnable and was refused
            reason: INVALID_CHECK
          - code: CodeDuplicateCheck
            doc: |-
              DuplicateCheck is returned by an Add whose name is already registered
              on that probe. Names are how a result and an error identify a check, so
              two checks sharing one would make every report ambiguous.

              The namespace is PER PROBE: the same name may appear once on readiness
              and once on liveness, because they are different questions about
              different evidence and an operator reading "cache" on both is reading
              two answers, not a collision.
            name: DuplicateCheck
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: check names are unique per probe; the fields carry the name and the probe"
            public: A health check is already registered under that name
            reason: DUPLICATE_CHECK
          - code: CodeUnknownProbe
            doc: |-
              UnknownProbe is the result carried by a report for a Probe value this
              package never mints. The probe answers StatusUnhealthy rather than
              guessing: picking liveness for a caller who did not say what they
              wanted is how a dependency outage becomes a restart loop.
            name: UnknownProbe
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/health: probe must be ProbeStartup, ProbeReadiness or ProbeLiveness; the field carries the value"
            public: The requested health probe does not exist
            reason: UNKNOWN_PROBE
          - code: CodeCheckPanicked
            doc: |-
              CheckPanicked is the failure of a check whose body panicked. The engine
              recovers it rather than letting it reach the runtime, because a panic
              escaping a probe would take the whole process down over a health
              question — the health endpoint becoming the outage.

              The recovered value travels as a FIELD, never as the wrap origin, so a
              panic carrying an *errs.Error cannot hijack this code, and the panic
              text — which routinely carries an address or a query — cannot reach an
              HTTP body through the Public of an error it did not write.
            name: CheckPanicked
            private: "core/app/health: check panicked; the fields carry its name, its probe, and the panic value"
            public: The health check panicked and was recovered
            reason: CHECK_PANICKED
          - code: CodeCheckFailed
            doc: |-
              CheckFailed is the code a PLAIN error from a check is wrapped with. An
              *errs.Error cause keeps its own identity through origin-wins, so a
              caller who already writes typed errors sees their own Public in the
              probe body and everyone else sees this one.
            name: CheckFailed
            note: |-
              The engine's verdicts, raised by internal/service/app/health as it runs a
              probe, drains, notifies and asks. They are declared here, with the
              registration refusals, so that the domain's codes and sentinels are in one
              place (ADR 0160).
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: check returned a non-nil error; the fields carry its name and probe"
            public: A health check reported a failure
            reason: CHECK_FAILED
          - code: CodeCheckTimeout
            doc: |-
              CheckTimeout reports a check that had not answered when its budget
              expired.

              It is a FAILURE and not an "unknown", and that is a decision (ADR 0060
              §D4). A probe exists to answer a question within a bounded time, and
              "I could not answer" is operationally the same as "no" for the caller
              who has to decide whether to route traffic. An "unknown" that
              aggregated as healthy would make a wedged dependency invisible — the
              exact failure probes exist to catch — and one that aggregated as
              unhealthy would just be a second spelling of this. What IS preserved is
              the distinction: ResultValue.TimedOut separates "the dependency said
              no" from "the dependency said nothing".
            name: CheckTimeout
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: check exceeded its timeout; the fields carry its name, probe and budget"
            public: A health check did not answer within its budget
            reason: CHECK_TIMEOUT
          - code: CodeStaleCacheWindow
            doc: |-
              StaleCacheWindow is returned by AddReadiness for a MaxAge above the
              MaxCacheAge ceiling internal/service/app/health enforces. Refused rather
              than clamped: see MaxCacheAge there.
            name: StaleCacheWindow
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/health: MaxAge exceeds MaxCacheAge; the fields carry both"
            public: The health check cache window is longer than the SDK will vouch for
            reason: STALE_CACHE_WINDOW
          - code: CodeStartupPending
            doc: |-
              StartupPending is the synthetic result of a readiness probe answered
              while a startup check has yet to pass. No readiness check was run,
              because "not yet started" already answers the routing question and
              dialling a dependency to reconfirm it would only add load.
            name: StartupPending
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: readiness short-circuited; a startup check has not passed"
            public: The process is still starting and is not accepting traffic yet
            reason: STARTUP_PENDING
          - code: CodeDraining
            doc: |-
              Draining is the synthetic result of a readiness probe answered after
              Drain. It is what lets an orchestrator withdraw the replica from
              routing BEFORE the shutdown sequence starts closing anything.

              Liveness deliberately keeps answering normally while this is true: a
              draining process that gets killed for failing liveness loses exactly
              the in-flight work the drain existed to finish.
            name: Draining
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: readiness short-circuited; Drain has been called and is one-way"
            public: The process is shutting down and is no longer accepting traffic
            reason: DRAINING
          - code: CodeNotifyFailed
            doc: |-
              NotifyFailed is handed to Config.OnNotifyError when an opt-in sd_notify
              datagram could not be delivered. With $NOTIFY_SOCKET unset the notifier
              is a no-op that succeeds, so this means a socket was configured and did
              not take the message.
            name: NotifyFailed
            private: "service/app/health: sd_notify send failed; the field carries the state that was being sent"
            public: The readiness notification could not be delivered
            reason: NOTIFY_FAILED
          - code: CodeAskMisconfigured
            doc: |-
              AskMisconfigured refuses an Ask that could never get an answer: the
              address has no host:port shape or no port in 1–65535, the path is not
              absolute, or the timeout is negative. Nothing is dialled; the argument
              field names which.
            name: AskMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/health: Ask refused its configuration before dialling; the argument field names what"
            public: The readiness probe was given an address, path or timeout it cannot use
            reason: ASK_MISCONFIGURED
          - code: CodeAskUnreachable
            doc: |-
              AskUnreachable reports an Ask that got no answer because the connection
              or the request failed. The transport's own error is the cause.
            name: AskUnreachable
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the connection or the request failed before any answer; the cause is the transport's"
            public: The process could not be reached
            reason: ASK_UNREACHABLE
          - code: CodeAskTimeout
            doc: |-
              AskTimeout reports an Ask with no answer when its budget ran out. A
              caller whose own context ended first gets the same code, with the
              context's error in the chain — the precedent CheckTimeout set for a
              departed caller.
            name: AskTimeout
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the budget or the caller's context ended before an answer arrived"
            public: The process did not answer the readiness probe in time
            reason: ASK_TIMEOUT
          - code: CodeAskNotReady
            doc: |-
              AskNotReady reports an Ask the process answered with a status other than
              200. The status field carries it; the body was drained and discarded and
              no byte of it is in the error.
            name: AskNotReady
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "service/app/health: the process answered a status other than 200; the status field carries it"
            public: The process answered that it is not ready
            reason: ASK_NOT_READY
    types:
      - name: Check
        underlying: func(ctx context.Context) error
      - name: SelfCheck
        underlying: func() error
      - name: StartupCheckValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Check
              type: Check
            - name: Timeout
              type: time.Duration
      - name: LivenessCheckValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Check
              type: SelfCheck
            - name: Timeout
              type: time.Duration
      - name: ReadinessCheckValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Check
              type: Check
            - name: Timeout
              type: time.Duration
            - name: NonCritical
              type: bool
            - name: MaxAge
              type: time.Duration
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: Probe
        underlying: uint8
      - methods:
          - in:
              - name: now
                type: time.Time
            name: Age
            out:
              - type: time.Duration
            recv: value
        name: ResultValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Status
              type: Status
            - name: TimedOut
              type: bool
            - name: Cached
              type: bool
            - name: At
              type: time.Time
            - name: Took
              type: time.Duration
            - name: Err
              type: error
      - name: ReportValue
        struct:
          fields:
            - name: Probe
              type: Probe
            - name: Status
              type: Status
            - name: At
              type: time.Time
            - name: Results
              type: "[]ResultValue"
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: Serving
            out:
              - type: bool
            recv: value
        name: Status
        underlying: uint8
  - constants:
      - name: DefaultAskTimeout
        type: time.Duration
        value: "3000000000"
      - name: MaxAskDrainBytes
        type: int64
        value: 64 << 10
      - name: DefaultCheckTimeout
        type: time.Duration
        value: "1000000000"
      - name: MaxCacheAge
        type: time.Duration
        value: "30000000000"
    functions:
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: AskConfig
        name: Ask
        out:
          - name: status
            type: int
          - name: err
            type: error
      - in:
          - name: registry
            type: corehealth.Health
          - name: name
            type: string
        name: Component
        out:
          - type: corelc.ComponentValue
      - in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewStartupHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewReadinessHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: corehealth.Health
          - name: cfg
            type: HandlerConfig
        name: NewLivenessHandler
        out:
          - type: http.Handler
      - in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: corehealth.Health
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/app/health
    types:
      - name: AskConfig
        struct:
          fields:
            - name: Addr
              type: string
            - name: Path
              type: string
            - name: Timeout
              type: time.Duration
            - name: Clock
              type: clock.Timed
      - name: Config
        struct:
          fields:
            - name: Clock
              type: clock.Timed
            - name: DefaultTimeout
              type: time.Duration
            - name: OnReport
              type: func(corehealth.ReportValue)
            - name: Notify
              type: bool
            - name: OnNotifyError
              type: func(error)
      - name: HandlerConfig
        struct:
          fields:
            - name: Detail
              type: bool
  - aliases:
      - name: Check
        target: corehealth.Check
      - name: SelfCheck
        target: corehealth.SelfCheck
      - name: Health
        target: corehealth.Health
      - name: Status
        target: corehealth.Status
      - name: Probe
        target: corehealth.Probe
      - name: StartupCheck
        target: corehealth.StartupCheckValue
      - name: ReadinessCheck
        target: corehealth.ReadinessCheckValue
      - name: LivenessCheck
        target: corehealth.LivenessCheckValue
      - name: Result
        target: corehealth.ResultValue
      - name: Report
        target: corehealth.ReportValue
      - name: Config
        target: svchealth.Config
      - name: HandlerConfig
        target: svchealth.HandlerConfig
      - name: AskConfig
        target: svchealth.AskConfig
    constants:
      - name: StatusUnhealthy
        type: Status
        value: "0"
      - name: StatusDegraded
        type: Status
        value: "1"
      - name: StatusHealthy
        type: Status
        value: "2"
      - name: ProbeStartup
        type: Probe
        value: "1"
      - name: ProbeReadiness
        type: Probe
        value: "2"
      - name: ProbeLiveness
        type: Probe
        value: "3"
      - name: DefaultCheckTimeout
        type: time.Duration
        value: "1000000000"
      - name: MaxCacheAge
        type: time.Duration
        value: "30000000000"
      - name: DefaultAskTimeout
        type: time.Duration
        value: "3000000000"
      - name: MaxAskDrainBytes
        type: int64
        value: 64 << 10
    functions:
      - in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: Health
      - in:
          - name: a
          - name: b
            type: Status
        name: Worst
        out:
          - type: Status
      - in:
          - name: registry
            type: Health
          - name: name
            type: string
        name: Component
        out:
          - type: corelc.ComponentValue
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewStartupHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewReadinessHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewLivenessHandler
        out:
          - type: http.Handler
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: AskConfig
        name: Ask
        out:
          - name: status
            type: int
          - name: err
            type: error
    imports:
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      svchealth: github.com/kitsunium/sdk/internal/service/app/health
    path: github.com/kitsunium/sdk/pkg/v1/app/health
    variables:
      - name: InvalidCheck
        type: "*errs.Error"
      - name: DuplicateCheck
        type: "*errs.Error"
      - name: UnknownProbe
        type: "*errs.Error"
      - name: CheckPanicked
        type: "*errs.Error"
      - name: CheckFailed
        type: "*errs.Error"
      - name: CheckTimeout
        type: "*errs.Error"
      - name: StaleCacheWindow
        type: "*errs.Error"
      - name: StartupPending
        type: "*errs.Error"
      - name: Draining
        type: "*errs.Error"
      - name: NotifyFailed
        type: "*errs.Error"
      - name: AskMisconfigured
        type: "*errs.Error"
      - name: AskUnreachable
        type: "*errs.Error"
      - name: AskTimeout
        type: "*errs.Error"
      - name: AskNotReady
        type: "*errs.Error"
