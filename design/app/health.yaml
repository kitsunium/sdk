        type: Status
        value: "0"
      - name: StatusDegraded
        type: Status
        value: "1"
      - name: StatusHealthy
        type: Status
        value: "2"
      - name: ProbeStartup
        type: Probe
        value: "1"
      - name: ProbeReadiness
        type: Probe
        value: "2"
      - name: ProbeLiveness
        type: Probe
        value: "3"
      - name: DefaultCheckTimeout
        type: time.Duration
        value: "1000000000"
      - name: MaxCacheAge
        type: time.Duration
        value: "30000000000"
      - name: DefaultAskTimeout
        type: time.Duration
        value: "3000000000"
      - name: MaxAskDrainBytes
        type: int64
        value: 64 << 10
    functions:
      - in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: Health
      - in:
          - name: a
          - name: b
            type: Status
        name: Worst
        out:
          - type: Status
      - in:
          - name: registry
            type: Health
          - name: name
            type: string
        name: Component
        out:
          - type: corelc.ComponentValue
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewStartupHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewReadinessHandler
        out:
          - type: http.Handler
      - in:
          - name: registry
            type: Health
          - name: cfg
            type: HandlerConfig
        name: NewLivenessHandler
        out:
          - type: http.Handler
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: AskConfig
        name: Ask
        out:
          - name: status
            type: int
          - name: err
            type: error
    imports:
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
