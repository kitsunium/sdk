apiVersion: kit.kitsunium/design/v2
domain: app/id
packages:
  - codes:
      - const:
          - doc: |-
              CodeUnknownScheme identifies a New/Lookup call naming a Scheme that no
              imported package has registered (a missing blank-import of the scheme).
            name: CodeUnknownScheme
            note: "range: 0.2.7.0 - 0.2.7.255"
            value: "0x00_02_07_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies a boot-time collision on the Generator
              registry: a nil scheme, or a distinct generator claiming an already-registered
              Scheme. Surfaced via panic at boot (see registry.go). Reason
              DUPLICATE_REGISTRATION keeps the bracket header a valid (code,reason) pairing
              per ADR 0005, mirroring codec/transform (0.2.2.1 / 0.2.5.5).
            name: CodeDuplicateRegistration
            value: "0x00_02_07_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDEntropyFailed identified a crypto/rand.Read failure while drawing the
              random bytes of an identifier. Nothing returns it since Go 1.24, whose
              crypto/rand.Read cannot fail; the code stays allocated and published.
            name: CodeIDEntropyFailed
            note: |-
              range: 0.3.39.0 - 0.3.39.255

              The generators' outcomes. The range was allocated to internal/service/app/id,
              whose schemes raise these codes, and it is declared here with the registry's
              so that every code of the domain is in one place (ADR 0160). A code keeps
              the value its allocation gave it whichever layer declares it, so the layer
              byte still reads 3.
            value: "0x00_03_27_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDClockBackwards identifies a snowflake generation where the monotonic
              clock moved backwards past the last-issued timestamp beyond the recoverable
              same-millisecond sequence space.
            name: CodeIDClockBackwards
            value: "0x00_03_27_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDClockStalled identifies a snowflake same-millisecond overflow wait that
              gave up because the clock stopped advancing. Distinct from ClockBackwards: the
              clock did not regress, it simply never ticked, so the wait could not complete.
            name: CodeIDClockStalled
            value: "0x00_03_27_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDInvalidSize identifies a NanoID constructor call naming a non-positive
              identifier length. A zero-length identifier identifies nothing, so the
              constructor refuses rather than hand back a generator that mints "" forever
              (ADR 0031).
            name: CodeIDInvalidSize
            value: "0x00_03_27_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDInvalidPrefix identifies a TypeID constructor or parse call whose type
              prefix is empty or breaks the lowercase-ASCII shape. The prefix IS the value
              of the scheme — an identifier that cannot name its own type is the degraded
              identifier ADR 0031 forbids minting silently.
            name: CodeIDInvalidPrefix
            value: "0x00_03_27_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDMalformed identifies a parse that rejected its input: a wrong length, a
              symbol outside the scheme's alphabet, or a magnitude past what the scheme's
              fixed width can represent. Carries a "rule" field naming which of the three
              fired; never echoes the input.
            name: CodeIDMalformed
            value: "0x00_03_27_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeIDTimestampRange identifies a generation where the clock sits outside the
              window the scheme's timestamp field can represent — the KSUID 32-bit second
              counter, whose epoch starts in 2014 and saturates in 2150. Encoding it anyway
              would wrap the prefix and destroy the sortability the format exists for.
            name: CodeIDTimestampRange
            value: "0x00_03_27_07"
        type: errs.Code
    doc: |-
      Package id — ranges 0.2.7.* (ADR 0024 core/app/id block) and 0.3.39.*
      (ADR 0024 service/app/id block, declared here since ADR 0160).

      Package id — declares the sentinels of the domain: those the Generator
      facade returns, and those the concrete schemes raise. A registry sentinel's
      name equals its errs.Define Reason in SCREAMING_SNAKE form; a scheme
      sentinel's Reason is its Code constant's name, minus Code, in the same form
      (ADR 0020's namespaced derivation: CodeIDMalformed → ID_MALFORMED).

      Package id declares the identifier-generation port of the SDK: the Generator
      contract and the typed Scheme string under which a generator registers. It is
      a core sibling beside codec, writer, crypto, logger, transform, and proc
      (ADR 0024) and mirrors transform exactly — the registry resolves a Scheme to
      a Generator the way transform resolves an Algorithm to a Compressor.

      No generation bodies live here; concrete generators (UUIDv4/UUIDv7/ULID/
      snowflake/NanoID/KSUID) live under internal/service/app/id/ and self-register via
      a package-level var initialiser when imported — no init(). TypeID lives there
      too but is NOT registered: it carries a caller-chosen type prefix, and there
      is no prefix the SDK could invent on their behalf, so New("typeid") returns
      UnknownScheme by design. The canonical external form of every identifier is
      its string rendering, so Generator.New returns a string (UUIDs dashed-hex,
      ULID Crockford base32, snowflake decimal, KSUID base62, NanoID URL-safe).

      Package id — holds the process-wide Generator registry. Service-level scheme
      packages register themselves via package-level var initialisers when imported
      (no init()), mirroring core/data/codec, core/crypto, and core/data/transform.
    functions:
      - doc: |-
          Available returns the sorted list of registered Schemes, or nil before any
          Register.
        impl: available
        name: Available
        out:
          - type: "[]Scheme"
      - doc: |-
          New generates a fresh identifier using the Generator registered under scheme.
          A scheme with no registered generator returns UnknownScheme (blank-import the
          scheme's package to register it); a generator entropy/clock fault propagates
          unchanged with the scheme's own service-layer code.
        in:
          - name: scheme
            type: Scheme
        name: New
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: |-
          Register inserts g under g.Scheme() and returns it so callers can bind the
          singleton to a typed package-level variable like
          `var UUIDv4 = id.Register(uuidv4Gen{})`. Panics on a nil generator or when a
          distinct generator already claims the same Scheme.

          IFACE-PLUGIN: the registry hands plug-in Generator instances back to callers
          so each scheme keeps its concrete type unexported; the contract is the
          Generator interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: g
            type: Generator
        name: Register
        out:
          - type: Generator
      - doc: |-
          Lookup returns the Generator registered under name.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind the
          Generator interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Scheme
        name: Lookup
        out:
          - name: g
            type: Generator
          - name: ok
            type: bool
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/id
    ports:
      - doc: |-
          Generator is the contract every identifier scheme satisfies. Instances MUST
          be safe for concurrent use (New is called from many goroutines). Scheme-
          specific options (snowflake node id, etc.) are supplied via the scheme's
          constructor, not via this interface.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind this
          interface — concrete scheme types stay unexported per package.
        methods:
          - name: Scheme
            out:
              - type: Scheme
          - name: New
            out:
              - name: newID
                type: string
              - name: err
                type: error
        name: Generator
    sentinels:
      - var:
          - code: CodeUnknownScheme
            doc: |-
              UnknownScheme is returned when no Generator is registered under the
              requested Scheme — typically a missing blank-import of the scheme.
            name: UnknownScheme
            private: "core/app/id.New: scheme absent from registry; blank-import the scheme's package to register it"
            public: No identifier generator is registered under that scheme
            reason: UNKNOWN_SCHEME
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the boot-time panic sentinel for the Generator
              registry: a nil generator or a distinct generator claiming a taken Scheme.
            name: DuplicateRegistration
            private: "core/app/id.Register: a distinct generator already claims this scheme, or a nil generator was supplied"
            public: A generator is already registered under that scheme
            reason: DUPLICATE_REGISTRATION
          - code: CodeIDEntropyFailed
            doc: |-
              EntropyFailed was the wrap of a crypto/rand.Read failure while drawing id
              bytes. Nothing returns it since Go 1.24, whose crypto/rand.Read never
              fails (a failing source crashes the program); it stays published with its
              value, so a consumer matching it keeps compiling.
            name: EntropyFailed
            note: |-
              The schemes' outcomes, raised by internal/service/app/id. They are declared
              here, with the registry's, so that the domain's codes and sentinels are in
              one place (ADR 0160).
            private: "service/app/id: crypto/rand.Read returned an error"
            public: Identifier generation failed to read secure random bytes
            reason: ID_ENTROPY_FAILED
          - code: CodeIDClockBackwards
            doc: |-
              ClockBackwards is returned when the snowflake clock regressed past the
              recoverable sequence window.
            name: ClockBackwards
            private: "service/app/id: snowflake clock regressed beyond the same-millisecond sequence space"
            public: Identifier generation observed the clock moving backwards
            reason: ID_CLOCK_BACKWARDS
          - code: CodeIDClockStalled
            doc: |-
              ClockStalled is returned when the snowflake same-millisecond overflow wait
              gave up because the clock stopped advancing.
            name: ClockStalled
            private: "service/app/id: snowflake overflow wait exceeded its spin budget without the clock ticking"
            public: Identifier generation gave up waiting for the clock to advance
            reason: ID_CLOCK_STALLED
          - code: CodeIDInvalidSize
            doc: |-
              InvalidSize is returned by NewNanoID when the requested identifier length
              is not positive. Carries a "size" field.
            name: InvalidSize
            private: "service/app/id: NewNanoID received a size <= 0; a zero-length identifier identifies nothing"
            public: Identifier generation requires a positive identifier length
            reason: ID_INVALID_SIZE
          - code: CodeIDInvalidPrefix
            doc: |-
              InvalidPrefix is returned by NewTypeID/FormatTypeID/ParseTypeID when the
              type prefix is empty or breaks the lowercase-ASCII shape. Carries a "rule"
              field naming the clause that failed, and never echoes the prefix.
            name: InvalidPrefix
            private: "service/app/id: a TypeID prefix is 1..63 chars of [a-z], with '_' allowed only between two letters"
            public: Identifier generation requires a valid lowercase type prefix
            reason: ID_INVALID_PREFIX
          - code: CodeIDMalformed
            doc: |-
              Malformed is returned by ParseKSUID/ParseTypeID/FormatTypeID when the
              input is not a well-formed rendering. Carries a "rule" field naming which
              check fired (length / alphabet / overflow), never the input itself.
            name: Malformed
            private: "service/app/id: a parse rejected the input's length, alphabet, or magnitude"
            public: The identifier is not well formed for its scheme
            reason: ID_MALFORMED
          - code: CodeIDTimestampRange
            doc: |-
              TimestampRange is returned when the clock sits outside the window a
              scheme's timestamp field can represent (KSUID: 2014-05-13 .. 2150-06-19).
            name: TimestampRange
            private: "service/app/id: the KSUID 32-bit second counter cannot represent this clock reading"
            public: Identifier generation observed a clock outside the scheme's timestamp range
            reason: ID_TIMESTAMP_RANGE
    types:
      - decl: true
        doc: |-
          Scheme is the typed key under which a Generator registers (e.g. "uuidv4",
          "uuidv7", "ulid", "snowflake", "nanoid", "ksuid"). The zero value Scheme("")
          is reserved invalid, mirroring codec.Format and transform.Algorithm.
        methods:
          - doc: String implements fmt.Stringer and returns the raw identifier.
            name: String
            out:
              - type: string
            recv: value
          - doc: Known reports whether s has been registered in the Generator registry.
            name: Known
            out:
              - type: bool
            recv: value
        name: Scheme
        underlying: string
  - doc: |-
      Package id wraps stdlib crypto/rand + the kernel clock as core/app/id.Generator
      implementations (UUIDv4, UUIDv7, ULID, snowflake, NanoID, KSUID, TypeID).
      Blank-importing this package self-registers every scheme that needs no
      configuration; snowflake, NanoID and TypeID also offer explicit constructors.
      No init() — registration is package-level var.

      Randomness is read with crypto/rand.Read, which since Go 1.24 never returns
      an error and always fills its buffer — a failing source crashes the program
      instead — so no generator here fails for want of entropy. EntropyFailed stays
      declared, and published, but nothing returns it.

      Package id — KSUID generator (32-bit second prefix + 128-bit payload, base62).

      Package id — NanoID generator (URL-safe alphabet, configurable length).

      Package id — snowflake (Twitter-style) stateful generator.

      Package id — TypeID generator (type prefix + UUIDv7 in lowercase base32).

      Package id — ULID generator (48-bit time + 80-bit random, Crockford base32).

      Package id — UUIDv4 (random) generator (RFC 9562 §5.4).

      Package id — UUIDv7 (time-ordered) generator (RFC 9562 §5.7).
    functions:
      - doc: |-
          ParseKSUID decodes the canonical 27-character rendering s, returning the
          instant the identifier was issued (second resolution, UTC) and its 16-byte
          random payload. It is the inverse of what KSUID.New renders.
        in:
          - name: s
            type: string
        name: ParseKSUID
        out:
          - name: issued
            type: time.Time
          - name: payload
            type: "[ksuidPayloadBytes]byte"
          - name: err
            type: error
      - doc: |-
          NewNanoID returns a NanoID Generator producing size characters. It is NOT
          added to the global registry — bind it to your own variable.

          A non-positive size is REFUSED rather than clamped (ADR 0031): a zero-length
          identifier identifies nothing, and any length chosen on the caller's behalf
          here would be the SDK substituting its judgement for the one decision this
          constructor exists to take. Callers who want the canonical length say so by
          not passing one — that is what the registered NanoID singleton is.
        in:
          - name: size
            type: int
        name: NewNanoID
        out:
          - name: g
            type: coreid.Generator
          - name: err
            type: error
      - doc: |-
          NewSnowflake returns a snowflake Generator bound to node (reduced into the
          10-bit node space). It is NOT added to the global registry — bind it to your
          own variable.
        in:
          - name: node
            type: int64
        name: NewSnowflake
        out:
          - type: coreid.Generator
      - doc: |-
          NewTypeID returns a TypeID Generator stamping prefix on every identifier. It
          is NOT added to the global registry — bind it to your own variable.

          prefix is validated strictly and an invalid one is REFUSED at construction
          (ADR 0031): the prefix is the entire value of the scheme, so a generator
          built from a bad one would mint identifiers that fail to parse everywhere
          else, one per call, with nothing to point at.
        in:
          - name: prefix
            type: string
        name: NewTypeID
        out:
          - name: g
            type: coreid.Generator
          - name: err
            type: error
      - doc: |-
          FormatTypeID renders prefix and the canonical dashed-hex UUID uuid as a
          TypeID. It is the migration entry point: an existing UUID column becomes a
          typed identifier without reissuing anything.

          The UUID version is deliberately NOT enforced. New only ever mints v7, but
          refusing to label a v4 that already exists in a caller's database would make
          this function useless for the one job it has.
        in:
          - name: prefix
          - name: uuid
            type: string
        name: FormatTypeID
        out:
          - name: typeID
            type: string
          - name: err
            type: error
      - doc: |-
          ParseTypeID splits the canonical TypeID s into its type prefix and the
          dashed-hex UUID its suffix encodes. Together with FormatTypeID it round-trips
          in both directions.
        in:
          - name: s
            type: string
        name: ParseTypeID
        out:
          - name: prefix
          - name: uuid
            type: string
          - name: err
            type: error
    imports:
      coreid: github.com/kitsunium/sdk/internal/core/app/id
    path: github.com/kitsunium/sdk/internal/service/app/id
    variables:
      - blockDoc: |-
          KSUID is the registered KSUID generator: a 32-bit second-resolution timestamp
          followed by 128 random bits, rendered as 27 base62 characters that sort by
          creation time as plain strings.
        doc: KSUID is the registered generator.
        name: KSUID
        type: coreid.Generator
      - doc: |-
          NanoID is the registered default-size NanoID generator: nanoIDDefaultSize
          URL-safe characters drawn uniformly from a CSPRNG. Use NewNanoID for an
          explicit length.
        name: NanoID
        type: coreid.Generator
      - doc: |-
          Snowflake is the default-node snowflake generator, registered for the
          "snowflake" scheme. Its node id is derived from the hostname+pid so distinct
          processes rarely collide; use NewSnowflake for an explicit node assignment.
        name: Snowflake
        type: coreid.Generator
      - doc: |-
          ULID is the registered ULID generator: a 48-bit ms timestamp + 80 random bits
          rendered as 26 Crockford-base32 chars, lexically sortable by time.
        name: ULID
        type: coreid.Generator
      - doc: UUIDv4 is the registered random UUIDv4 generator (RFC 9562 §5.4).
        name: UUIDv4
        type: coreid.Generator
      - doc: |-
          UUIDv7 is the registered time-ordered UUIDv7 generator (RFC 9562 §5.7): a
          48-bit Unix-millisecond prefix makes successive ids k-sortable.
        name: UUIDv7
        type: coreid.Generator
  - constants:
      - doc: UUIDv4Scheme is the random-UUID scheme key.
        name: UUIDv4Scheme
        type: Scheme
        value: "\"uuidv4\""
      - doc: UUIDv7Scheme is the time-ordered UUID scheme key.
        name: UUIDv7Scheme
        type: Scheme
        value: "\"uuidv7\""
      - doc: ULIDScheme is the ULID scheme key.
        name: ULIDScheme
        type: Scheme
        value: "\"ulid\""
      - doc: SnowflakeScheme is the snowflake scheme key.
        name: SnowflakeScheme
        type: Scheme
        value: "\"snowflake\""
      - doc: NanoIDScheme is the NanoID scheme key.
        name: NanoIDScheme
        type: Scheme
        value: "\"nanoid\""
      - doc: KSUIDScheme is the KSUID scheme key.
        name: KSUIDScheme
        type: Scheme
        value: "\"ksuid\""
      - doc: |-
          TypeIDScheme is the TypeID scheme key. It is the only scheme key New
          cannot resolve: a TypeID needs a type prefix, and there is no
          non-arbitrary prefix the SDK could choose on a caller's behalf, so no
          generator is registered under it. New(TypeIDScheme) returns
          UnknownScheme by design — build one with NewTypeID instead. The key is
          exported because Generator.Scheme() reports it.
        name: TypeIDScheme
        type: Scheme
        value: "\"typeid\""
    doc: |-
      Package id is the public facade for SDK identifier generation. One verb,
      seven schemes: [New] dispatches by [Scheme] string, and the named helpers
      [UUIDv4]/[UUIDv7]/[ULID]/[Snowflake]/[NanoID]/[KSUID] return the canonical
      string form directly.

      Pick by what you need the identifier to carry:

        - [UUIDv4] — 122 random bits, unguessable, unordered.

        - [UUIDv7] and [ULID] — a millisecond prefix makes them k-sortable; ULID
          renders in 26 Crockford base32 characters instead of 36.

        - [Snowflake] — 41-bit timestamp + 10-bit node + 12-bit sequence, for
          coordinated per-node issuance.

        - [NanoID] — 21 URL-safe characters, the shortest of the set, no timestamp.

        - [KSUID] — 27 base62 characters, sortable to the second, and decodable:
          [ParseKSUID] recovers when an identifier was issued.

        - TypeID — a type prefix plus a UUIDv7, "user_01h2xcejqtf2nbrexx3vqjhp41".
          An identifier that names its own entity cannot be pasted into the wrong
          column unnoticed. Built with [NewTypeID], read with [ParseTypeID], and
          [FormatTypeID] relabels UUIDs a caller already stores.

      In practice:

      	uid, _ := id.UUIDv7()        // "0190b3c0-...-...."
      	sortable, _ := id.ULID()     // "01J8...": lexically time-sortable
      	short, _ := id.NanoID()      // "V1StGXR8_Z5jdHi6B-myT"
      	sf := id.NewSnowflake(7)     // explicit node id
      	s, _ := sf.New()
      	users, _ := id.NewTypeID("user")
      	u, _ := users.New()          // "user_01h2xcejqtf2nbrexx3vqjhp41"

      Activation is automatic: importing this package registers every scheme that
      needs no configuration. NanoID and TypeID also take explicit constructors,
      and those REFUSE a length of zero or an invalid type prefix rather than hand
      back a generator that mints degraded identifiers (ADR 0031).
    facade:
      - alias:
          - doc: Scheme is the public alias for the identifier-scheme key.
            name: Scheme
            target: coreid.Scheme
      - alias:
          - doc: Generator is the public alias for the identifier-generator contract.
            name: Generator
            target: coreid.Generator
      - var:
          - doc: |-
              UnknownScheme is returned by New when no generator is registered under the
              requested Scheme. Matchable via errs.HasReason(err, "UNKNOWN_SCHEME").
            name: UnknownScheme
            reexport: coreid.UnknownScheme
            type: "*errs.Error"
          - doc: |-
              EntropyFailed is kept for code that matches it: nothing returns it since
              Go 1.24, whose crypto/rand.Read never fails.
            name: EntropyFailed
            reexport: coreid.EntropyFailed
            type: "*errs.Error"
          - doc: ClockBackwards is returned when a snowflake observes a backwards clock.
            name: ClockBackwards
            reexport: coreid.ClockBackwards
            type: "*errs.Error"
          - doc: InvalidSize is returned by NewNanoID for a non-positive identifier length.
            name: InvalidSize
            reexport: coreid.InvalidSize
            type: "*errs.Error"
          - doc: |-
              InvalidPrefix is returned by NewTypeID, ParseTypeID and FormatTypeID for a
              type prefix that is empty or outside lowercase ASCII.
            name: InvalidPrefix
            reexport: coreid.InvalidPrefix
            type: "*errs.Error"
          - doc: |-
              Malformed is returned by ParseKSUID, ParseTypeID and FormatTypeID when the
              input is not a well-formed rendering for its scheme.
            name: Malformed
            reexport: coreid.Malformed
            type: "*errs.Error"
          - doc: |-
              TimestampRange is returned when the clock sits outside the window a
              scheme's timestamp field can represent.
            name: TimestampRange
            reexport: coreid.TimestampRange
            type: "*errs.Error"
      - func:
          doc: New generates a fresh identifier using the generator registered under scheme.
          forward: coreid.New
          in:
            - name: scheme
              type: Scheme
          name: New
          out:
            - name: newID
              type: string
            - name: err
              type: error
      - func:
          doc: |-
            NewSnowflake returns a snowflake Generator bound to an explicit node id
            (reduced into the 10-bit node space). Not added to the global registry.
          forward: svcid.NewSnowflake
          in:
            - name: node
              type: int64
          name: NewSnowflake
          out:
            - type: Generator
      - func:
          doc: |-
            NewNanoID returns a NanoID Generator producing size characters, and refuses a
            non-positive size rather than return one that mints empty strings. Not added
            to the global registry — the registered NanoID singleton is the 21-character
            default.
          forward: svcid.NewNanoID
          in:
            - name: size
              type: int
          name: NewNanoID
          out:
            - name: g
              type: Generator
            - name: err
              type: error
      - func:
          doc: |-
            NewTypeID returns a TypeID Generator stamping prefix on every identifier —
            "user_01h2xcejqtf2nbrexx3vqjhp41". prefix must be 1 to 63 lowercase ASCII
            letters, with '_' allowed only between two letters; anything else is refused
            here rather than at every call. Not added to the global registry, because no
            prefix would be a defensible default (see TypeIDScheme).
          forward: svcid.NewTypeID
          in:
            - name: prefix
              type: string
          name: NewTypeID
          out:
            - name: g
              type: Generator
            - name: err
              type: error
      - func:
          doc: |-
            ParseKSUID decodes a canonical 27-character KSUID, returning the instant it
            was issued (second resolution, UTC) and its 16-byte random payload.
          forward: svcid.ParseKSUID
          in:
            - name: ksuid
              type: string
          name: ParseKSUID
          out:
            - name: issued
              type: time.Time
            - name: payload
              type: "[ksuidPayloadBytes]byte"
            - name: err
              type: error
      - func:
          doc: |-
            ParseTypeID splits a canonical TypeID into its type prefix and the dashed-hex
            UUID its suffix encodes. It is the exact inverse of FormatTypeID.
          forward: svcid.ParseTypeID
          in:
            - name: typeID
              type: string
          name: ParseTypeID
          out:
            - name: prefix
            - name: uuid
              type: string
            - name: err
              type: error
      - func:
          doc: |-
            FormatTypeID renders prefix and a canonical dashed-hex UUID as a TypeID. It
            is the migration path: an existing UUID column becomes typed without
            reissuing anything, so the UUID version is not enforced.
          forward: svcid.FormatTypeID
          in:
            - name: prefix
            - name: uuid
              type: string
          name: FormatTypeID
          out:
            - name: typeID
              type: string
            - name: err
              type: error
      - func:
          doc: Available returns the sorted list of registered Schemes.
          forward: coreid.Available
          name: Available
          out:
            - type: "[]Scheme"
    functions:
      - doc: UUIDv4 returns a fresh random UUIDv4 in canonical dashed-hex form.
        name: UUIDv4
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: UUIDv7 returns a fresh time-ordered UUIDv7 (k-sortable by creation time).
        name: UUIDv7
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: ULID returns a fresh ULID (26-char Crockford base32, lexically time-sortable).
        name: ULID
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: Snowflake returns a fresh id from the default-node snowflake generator.
        name: Snowflake
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: |-
          NanoID returns a fresh 21-character NanoID over the URL-safe alphabet. The
          characters are drawn by rejection sampling, so every symbol is equally
          likely; 21 of them carry 126 bits, slightly more than a UUIDv4.
        name: NanoID
        out:
          - name: newID
            type: string
          - name: err
            type: error
      - doc: |-
          KSUID returns a fresh KSUID: 27 base62 characters that sort by creation time
          as plain strings. Feed the result to ParseKSUID to recover that time.
        name: KSUID
        out:
          - name: newID
            type: string
          - name: err
            type: error
