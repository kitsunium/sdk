apiVersion: kit.kitsunium/design/v2
domain: app/lifecycle
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidComponent identifies an Add refused because the component could
              never run: an empty name, a nil Start, or a nil Stop.
            name: CodeInvalidComponent
            note: "range: 0.2.19.0 - 0.2.19.255"
            value: "0x00_02_13_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateComponent identifies an Add refused because the component's
              name is already registered on this Lifecycle.
            name: CodeDuplicateComponent
            value: "0x00_02_13_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeLifecycleRunning identifies an Add or a second Start refused because
              the Lifecycle is already started.
            name: CodeLifecycleRunning
            value: "0x00_02_13_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeComponentPanicked identifies a component whose Start or Stop panicked;
              the Lifecycle recovered it and turned it into this component's failure.
            name: CodeComponentPanicked
            value: "0x00_02_13_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeStartFailed identifies a Start aborted by one component's failure. The
              components already up have been stopped in reverse order by the time this
              is returned.
            name: CodeStartFailed
            note: |-
              range: 0.3.49.0 - 0.3.49.255

              The engine's and the supervisor's outcomes. The range was allocated to
              internal/service/app/lifecycle, which raises these codes while it starts,
              stops and supervises, and it is declared here with the registration refusals
              so that every code of the domain is in one place (ADR 0160). A code keeps
              the value its allocation gave it whichever layer declares it, so the layer
              byte still reads 3.
            value: "0x00_03_31_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeStopFailed identifies a component whose Stop returned an error during
              an ordinary shutdown. The remaining components were still stopped.
            name: CodeStopFailed
            value: "0x00_03_31_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeStopTimeout identifies a component whose Stop had not returned when its
              budget expired. Its context was cancelled and the engine moved on; nothing
              was severed and the goroutine was not killed.
            name: CodeStopTimeout
            value: "0x00_03_31_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnwindFailed identifies a failure DURING the cleanup of a partial
              start. It travels alongside the start failure that triggered the unwind, so
              a broken teardown can never hide the reason startup aborted.
            name: CodeUnwindFailed
            value: "0x00_03_31_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeReadinessFailed identifies an opt-in sd_notify readiness or stopping
              datagram that could not be delivered.
            name: CodeReadinessFailed
            value: "0x00_03_31_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeRunPanicked identifies a supervised run that panicked; the supervisor
              recovered it, counted it as a failure, and restarts the run after its
              backoff.
            name: CodeRunPanicked
            value: "0x00_03_31_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeSupervisorMisconfigured identifies a supervisor refused at
              construction: no name, or no function to run.
            name: CodeSupervisorMisconfigured
            value: "0x00_03_31_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeSupervisorRunning identifies a Start refused because the supervisor is
              already supervising.
            name: CodeSupervisorRunning
            value: "0x00_03_31_08"
        type: errs.Code
    constants:
      - name: PhaseStart
        type: Phase
        value: "1"
      - name: PhaseStop
        type: Phase
        value: "2"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/lifecycle
    ports:
      - doc: |-
          Lifecycle owns an ordered set of [ComponentValue] and drives it up and down.
          Implementations MUST be safe for concurrent use.

          IFACE-PLUGIN: the concrete engine stays unexported behind its constructor in
          internal/service/app/lifecycle.
        methods:
          - doc: |-
              Add registers a component at the end of the order. It is refused while
              the Lifecycle is started ([LifecycleRunning]), on a name already
              registered ([DuplicateComponent]), and on a component that could never
              run — empty name, nil Start, nil Stop ([InvalidComponent]).
            in:
              - name: component
                type: ComponentValue
            name: Add
            out:
              - type: error
          - doc: |-
              Start runs every registered Start in registration order and returns nil
              once all of them have. On the first failure it stops the components
              already up, in reverse order, and reports the failure; the Lifecycle is
              then back in its not-started state, so a caller may fix the cause, Add,
              and Start again.
            in:
              - name: ctx
                type: context.Context
            name: Start
            out:
              - type: error
          - doc: |-
              Stop runs the Stop of every component that started, in reverse of the
              order they started in, and reports what failed. It is idempotent: a
              Lifecycle that never started, or that has already stopped, returns nil
              without calling anything.
            in:
              - name: ctx
                type: context.Context
            name: Stop
            out:
              - type: error
        name: Lifecycle
    sentinels:
      - var:
          - code: CodeInvalidComponent
            doc: |-
              InvalidComponent is returned by Add for a component that could never
              run. The "missing" field names which half is absent.
            name: InvalidComponent
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/lifecycle: component has an empty name, a nil Start or a nil Stop; the field names which"
            public: The lifecycle component is not runnable and was refused
            reason: INVALID_COMPONENT
          - code: CodeDuplicateComponent
            doc: |-
              DuplicateComponent is returned by Add when the name is already taken.
              Names are how a transition and an error identify a component, so two
              components sharing one would make every report ambiguous.
            name: DuplicateComponent
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/lifecycle: component names are unique per Lifecycle; the field carries the name"
            public: A component is already registered under that name
            reason: DUPLICATE_COMPONENT
          - code: CodeLifecycleRunning
            doc: |-
              LifecycleRunning is returned by Add, and by a second Start, while the
              Lifecycle is started. The order is frozen for the duration of a run:
              appending to it mid-flight would give the new component a start
              position it never had, and no defensible place in the reverse order.
            name: LifecycleRunning
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/lifecycle: the component order is frozen once Start begins; add before Start, or after Stop returns"
            public: The lifecycle is already started
            reason: LIFECYCLE_RUNNING
          - code: CodeComponentPanicked
            doc: |-
              ComponentPanicked is the failure of a component whose Start or Stop
              panicked. The Lifecycle recovers it rather than letting it reach the
              runtime, because a panic escaping a Start would skip the unwind
              entirely and leak every component already up — the exact failure this
              domain exists to make impossible. The recovered value travels as a
              field; it is never the wrap origin, so a panic carrying an *errs.Error
              cannot hijack this code.
            name: ComponentPanicked
            private: "core/app/lifecycle: component panicked; the fields carry its name, the phase, and the panic value"
            public: The lifecycle component panicked and was recovered
            reason: COMPONENT_PANICKED
          - code: CodeStartFailed
            doc: |-
              StartFailed is joined with the component's own error when a Start
              aborts the sequence. It is a SEPARATE error in an errors.Join rather
              than a wrapper around the component's error on purpose: errs.Wrap would
              hit the origin-wins rule (CLAUDE.md rule 6) and inherit the component's
              code, so the caller could no longer ask "did startup fail?" without
              knowing every code a component might produce. Side by side, both
              errs.HasCode(err, CodeStartFailed) and the caller's own errors.Is
              answer.
            name: StartFailed
            note: |-
              The engine's and the supervisor's verdicts on a run, raised by
              internal/service/app/lifecycle. They are declared here, with the
              registration refusals, so that the domain's codes and sentinels are in one
              place (ADR 0160).
            private: "service/app/lifecycle: Start aborted; the fields name the component and how many were unwound"
            public: A component failed to start and the started components were stopped
            reason: START_FAILED
          - code: CodeStopFailed
            doc: |-
              StopFailed is joined with the component's own error when its Stop
              returns one. The shutdown continues: a component that cannot close
              cleanly must not prevent the ones before it in the order from trying.
            name: StopFailed
            private: "service/app/lifecycle: Stop returned an error; the field names the component and the shutdown continued"
            public: A component reported an error while stopping
            reason: STOP_FAILED
          - code: CodeStopTimeout
            doc: |-
              StopTimeout is returned for a component whose Stop had not returned
              when its budget expired. The engine cancels the context it handed that
              Stop — an announcement — and stops WAITING; it does not kill the
              goroutine, which Go cannot do, and it closes nothing on the component's
              behalf, which is what severed sockets under live handlers before ADR
              0043. Every component after it in the reverse order still gets its own
              full budget.
            name: StopTimeout
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/app/lifecycle: the per-component stop budget expired; the goroutine was abandoned, not killed"
            public: A component did not stop within its budget and was abandoned
            reason: STOP_TIMEOUT
          - code: CodeUnwindFailed
            doc: |-
              UnwindFailed marks a failure that happened while cleaning up a partial
              start. It is joined with — never substituted for — the start failure
              that triggered the unwind: a teardown that also breaks is a second
              defect, and reporting only it would hide the first.
            name: UnwindFailed
            private: "service/app/lifecycle: one or more components failed to stop during the partial-start unwind"
            public: Cleaning up after a failed start did not complete cleanly
            reason: UNWIND_FAILED
          - code: CodeReadinessFailed
            doc: |-
              ReadinessFailed is returned when the opt-in sd_notify datagram could
              not be delivered. It is only ever reachable when the caller asked for
              the notification: with NOTIFY_SOCKET unset every notifier call is a
              documented no-op that returns nil, so an unsupervised binary never sees
              this.
            name: ReadinessFailed
            private: "service/app/lifecycle: sd_notify was requested and failed; the field names the state that was not delivered"
            public: The readiness notification could not be delivered
            reason: READINESS_FAILED
          - code: CodeRunPanicked
            doc: |-
              RunPanicked is the failure of a supervised run that panicked. The
              supervisor recovers it on the run's goroutine, because a panic escaping
              there would take the process down with every other goroutine in it;
              the recovered value and the stack travel as FIELDS, never as the
              origin, so a panic carrying an *errs.Error cannot hijack this code —
              and never in the Public text, which a status page may show.
            name: RunPanicked
            private: "service/app/lifecycle: a supervised run panicked; the fields carry the supervisor's name, the panic value and the stack, and the run is restarted after its backoff"
            public: The supervised function panicked and was recovered
            reason: RUN_PANICKED
          - code: CodeSupervisorMisconfigured
            doc: SupervisorMisconfigured refuses a supervisor that could never run.
            name: SupervisorMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/lifecycle: NewSupervisor needs a Name and a Run; the field names which is missing"
            public: The supervisor cannot run as configured
            reason: SUPERVISOR_MISCONFIGURED
          - code: CodeSupervisorRunning
            doc: |-
              SupervisorRunning refuses a second Start while the first supervision
              is still running: two loops over one function would be two owners of
              whatever it drives.
            name: SupervisorRunning
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/lifecycle: Start was called while a supervision is running; Stop it first"
            public: The supervisor is already running
            reason: SUPERVISOR_RUNNING
    types:
      - name: Start
        underlying: func(ctx context.Context) error
      - name: Stop
        underlying: func(ctx context.Context) error
      - name: ComponentValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Start
              type: Start
            - name: Stop
              type: Stop
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: Phase
        underlying: uint8
      - name: TransitionValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Phase
              type: Phase
            - name: Begun
              type: time.Time
            - name: Ended
              type: time.Time
            - name: TimedOut
              type: bool
            - name: Err
              type: error
  - constants:
      - name: DefaultStopTimeout
        type: time.Duration
        value: "30000000000"
      - name: DefaultRestartBase
        type: time.Duration
        value: "1000000000"
      - name: DefaultRestartMax
        type: time.Duration
        value: "60000000000"
      - name: DefaultHealthyRun
        type: time.Duration
        value: "60000000000"
      - name: SupervisionRunStarted
        type: SupervisionPhase
        value: "1"
      - name: SupervisionRunEnded
        type: SupervisionPhase
        value: "2"
      - name: SupervisionRestarting
        type: SupervisionPhase
        value: "3"
      - name: SupervisionStopped
        type: SupervisionPhase
        value: "4"
    functions:
      - in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: corelc.Lifecycle
      - in:
          - name: ctx
            type: context.Context
          - name: lc
            type: corelc.Lifecycle
          - name: cfg
            type: RunConfig
        name: Run
        out:
          - type: error
      - in:
          - name: name
            type: string
          - name: run
            type: func(ctx context.Context) error
          - name: cfg
            type: SupervisorConfig
        name: NewSupervisor
        out:
          - type: "*Supervisor"
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
    path: github.com/kitsunium/sdk/internal/service/app/lifecycle
    types:
      - name: Config
        struct:
          fields:
            - name: Clock
              type: clock.Timed
            - name: StopTimeout
              type: time.Duration
            - name: OnTransition
              type: func(corelc.TransitionValue)
      - name: RunConfig
        struct:
          fields:
            - name: Signals
              type: "[]coreproc.Signal"
            - name: Notify
              type: bool
      - methods:
          - in:
              - name: ctx
                type: context.Context
            name: Start
            out:
              - type: error
            recv: pointer
          - in:
              - name: ctx
                type: context.Context
            name: Stop
            out:
              - type: error
            recv: pointer
          - name: Component
            out:
              - type: corelc.ComponentValue
            recv: pointer
        name: Supervisor
        struct:
          unexported: true
      - name: SupervisorConfig
        struct:
          fields:
            - name: Clock
              type: clock.Timed
            - name: Observe
              type: func(SupervisionEventValue)
            - name: Backoff
              type: kbackoff.Value
            - name: HealthyAfter
              type: time.Duration
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: SupervisionPhase
        underlying: uint8
      - name: SupervisionEventValue
        struct:
          fields:
            - name: Err
              type: error
            - name: At
              type: time.Time
            - name: Name
              type: string
            - name: Duration
              type: time.Duration
            - name: Delay
              type: time.Duration
            - name: Run
              type: int
            - name: Failures
              type: int
            - name: Phase
              type: SupervisionPhase
            - name: Stopping
              type: bool
  - facade:
      - const:
          - doc: PhaseStart reports a call to a component's Start.
            name: PhaseStart
            reexport: corelc.PhaseStart
            type: Phase
            typed: true
            value: "1"
          - doc: PhaseStop reports a call to a component's Stop.
            name: PhaseStop
            reexport: corelc.PhaseStop
            type: Phase
            typed: true
            value: "2"
          - doc: |-
              DefaultStopTimeout is the per-component budget a non-positive
              Config.StopTimeout clamps to.
            name: DefaultStopTimeout
            reexport: svclc.DefaultStopTimeout
            type: time.Duration
            typed: true
            value: "30000000000"
          - doc: |-
              DefaultRestartBase is the supervisor's first restart backoff when
              SupervisorConfig.Backoff is zero, or sets no BaseDelay; it doubles from
              there.
            name: DefaultRestartBase
            reexport: svclc.DefaultRestartBase
            type: time.Duration
            typed: true
            value: "1000000000"
          - doc: |-
              DefaultRestartMax is the supervisor's longest restart backoff when
              SupervisorConfig.Backoff is zero.
            name: DefaultRestartMax
            reexport: svclc.DefaultRestartMax
            type: time.Duration
            typed: true
            value: "60000000000"
          - doc: |-
              DefaultHealthyRun is how long a supervised run must last, when
              SupervisorConfig.HealthyAfter is not positive, for its end to count as
              a first failure again.
            name: DefaultHealthyRun
            reexport: svclc.DefaultHealthyRun
            type: time.Duration
            typed: true
            value: "60000000000"
          - doc: SupervisionRunStarted reports a run of the supervised function beginning.
            name: SupervisionRunStarted
            reexport: svclc.SupervisionRunStarted
            type: SupervisionPhase
            typed: true
            value: "1"
          - doc: SupervisionRunEnded reports a run returning, or panicking.
            name: SupervisionRunEnded
            reexport: svclc.SupervisionRunEnded
            type: SupervisionPhase
            typed: true
            value: "2"
          - doc: SupervisionRestarting reports a restart scheduled after Delay.
            name: SupervisionRestarting
            reexport: svclc.SupervisionRestarting
            type: SupervisionPhase
            typed: true
            value: "3"
          - doc: SupervisionStopped reports the end of the supervision.
            name: SupervisionStopped
            reexport: svclc.SupervisionStopped
            type: SupervisionPhase
            typed: true
            value: "4"
      - alias:
          - doc: Start is the public alias for the ctx-aware bring-up half of a component.
            name: Start
            target: corelc.Start
      - alias:
          - doc: Stop is the public alias for the ctx-aware teardown half of a component.
            name: Stop
            target: corelc.Stop
      - alias:
          - doc: Lifecycle is the public alias for the ordered start/stop contract.
            name: Lifecycle
            target: corelc.Lifecycle
      - alias:
          - doc: Component is the public alias for one named Start/Stop registration.
            name: Component
            target: corelc.ComponentValue
      - alias:
          - doc: Transition is the public alias for one reported component move.
            name: Transition
            target: corelc.TransitionValue
      - alias:
          - doc: |-
              Phase is the public alias for which half of a component a Transition
              reports.
            name: Phase
            target: corelc.Phase
      - alias:
          - doc: |-
              Signal is the public alias for a typed OS signal, re-exported here so a
              caller wiring RunConfig.Signals needs no second import.
            name: Signal
            target: coreproc.Signal
      - alias:
          - doc: Config is the public alias for the engine's construction parameters.
            name: Config
            target: svclc.Config
      - alias:
          - doc: RunConfig is the public alias for Run's opt-in supervision wiring.
            name: RunConfig
            target: svclc.RunConfig
      - alias:
          - doc: |-
              Supervisor is the public alias for a function run until stopped and
              restarted after every early end: Start, Stop, Component.
            name: Supervisor
            target: svclc.Supervisor
      - alias:
          - doc: |-
              SupervisorConfig is the public alias for a supervisor's optional tuning:
              Clock, Observe, Backoff, HealthyAfter.
            name: SupervisorConfig
            target: svclc.SupervisorConfig
      - alias:
          - doc: |-
              SupervisionEvent is the public alias for one thing a supervisor did, as
              its observer is told.
            name: SupervisionEvent
            target: svclc.SupervisionEventValue
      - alias:
          - doc: SupervisionPhase is the public alias for what a SupervisionEvent reports.
            name: SupervisionPhase
            target: svclc.SupervisionPhase
      - var:
          - doc: |-
              InvalidComponent is returned by Add for a component that could never
              run — an empty Name, a nil Start, a nil Stop. The "missing" field names
              which.
            name: InvalidComponent
            reexport: corelc.InvalidComponent
            type: "*errs.Error"
          - doc: DuplicateComponent is returned by Add when the name is already taken.
            name: DuplicateComponent
            reexport: corelc.DuplicateComponent
            type: "*errs.Error"
          - doc: |-
              LifecycleRunning is returned by Add, and by a second Start, while the
              Lifecycle is started. Add before Start, or after Stop returns.
            name: LifecycleRunning
            reexport: corelc.LifecycleRunning
            type: "*errs.Error"
          - doc: |-
              ComponentPanicked is the failure of a component whose Start or Stop
              panicked. It was recovered; the panic value travels as a field.
            name: ComponentPanicked
            reexport: corelc.ComponentPanicked
            type: "*errs.Error"
          - doc: |-
              StartFailed is joined with the component's own error when a Start
              aborts the sequence. The components already up were stopped first.
            name: StartFailed
            reexport: corelc.StartFailed
            type: "*errs.Error"
          - doc: |-
              StopFailed is joined with the component's own error when its Stop
              returns one. The shutdown continued with the remaining components.
            name: StopFailed
            reexport: corelc.StopFailed
            type: "*errs.Error"
          - doc: |-
              StopTimeout reports a component whose Stop had not returned when its
              budget expired. Its context was cancelled and it was abandoned — never
              killed, and nothing it owns was closed on its behalf.
            name: StopTimeout
            reexport: corelc.StopTimeout
            type: "*errs.Error"
          - doc: |-
              UnwindFailed marks a failure DURING the cleanup of a partial start. It
              travels alongside the start failure, never instead of it.
            name: UnwindFailed
            reexport: corelc.UnwindFailed
            type: "*errs.Error"
          - doc: |-
              ReadinessFailed is returned when an opt-in sd_notify datagram could not
              be delivered.
            name: ReadinessFailed
            reexport: corelc.ReadinessFailed
            type: "*errs.Error"
          - doc: |-
              RunPanicked is the failure of a supervised run that panicked. It was
              recovered and the run restarted; the panic value and the stack travel
              as fields, never in the Public text.
            name: RunPanicked
            reexport: corelc.RunPanicked
            type: "*errs.Error"
          - doc: |-
              SupervisorMisconfigured refuses a supervisor without a name or a
              function.
            name: SupervisorMisconfigured
            reexport: corelc.SupervisorMisconfigured
            type: "*errs.Error"
          - doc: SupervisorRunning refuses a second Start while a supervision runs.
            name: SupervisorRunning
            reexport: corelc.SupervisorRunning
            type: "*errs.Error"
      - func:
          doc: |-
            New returns a Lifecycle. It cannot fail: a nil cfg.Clock falls back to the
            wall clock, a non-positive cfg.StopTimeout to DefaultStopTimeout, and a nil
            cfg.OnTransition to no observation. What can fail fails at Add.
          forward: svclc.New
          in:
            - name: cfg
              type: Config
          name: New
          out:
            - type: Lifecycle
      - func:
          doc: |-
            Run starts every component, waits for ctx or one of cfg.Signals, then stops
            them in reverse order. See the package documentation for what the opt-in
            fields wire, and what the zero RunConfig deliberately does not.
          forward: svclc.Run
          in:
            - name: ctx
              type: context.Context
            - name: lc
              type: Lifecycle
            - name: cfg
              type: RunConfig
          name: Run
          out:
            - type: error
      - func:
          doc: |-
            NewSupervisor builds a supervisor named name over run, tuned by cfg — whose
            zero value is a working supervisor. run must return when its context ends;
            returning earlier, or panicking, restarts it after the backoff. It starts
            nothing: Start does, or the Lifecycle it is a Component of.
          forward: svclc.NewSupervisor
          in:
            - name: name
              type: string
            - name: run
              type: func(ctx context.Context) error
            - name: cfg
              type: SupervisorConfig
          name: NewSupervisor
          out:
            - type: "*Supervisor"
            - type: error
    imports:
      corelc: github.com/kitsunium/sdk/internal/core/app/lifecycle
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svclc: github.com/kitsunium/sdk/internal/service/app/lifecycle
    path: github.com/kitsunium/sdk/pkg/v1/app/lifecycle
