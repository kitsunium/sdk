apiVersion: kit.kitsunium/design/v2
domain: app/resilience
packages:
  - codes:
      - const:
          - doc: |-
              CodeRetryExhausted identifies a retry policy that used its whole attempt
              budget without a success (the last attempt's error is the wrap cause).
            name: CodeRetryExhausted
            note: "range: 0.2.8.0 - 0.2.8.255"
            value: "0x00_02_08_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCircuitOpen identifies a call rejected fast because the circuit breaker is
              in the Open state (the downstream is presumed unhealthy).
            name: CodeCircuitOpen
            value: "0x00_02_08_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeRateLimited identifies a call rejected because the rate limiter had
              no token available, at once or within its MaxWait.
            name: CodeRateLimited
            value: "0x00_02_08_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeBulkheadFull identifies a call rejected because the bulkhead's concurrency
              slots were all occupied — and, for a bulkhead that queues, its queue
              was full or no slot freed within its MaxWait.
            name: CodeBulkheadFull
            value: "0x00_02_08_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeTimeoutExceeded identifies an operation that did not complete within the
              timeout policy's deadline.
            name: CodeTimeoutExceeded
            value: "0x00_02_08_05"
        type: errs.Code
      - const:
          - doc: |-
              CodePolicyMisconfigured identifies a policy built with a configuration it
              cannot honour, whose every call is refused without running the operation.
            name: CodePolicyMisconfigured
            value: "0x00_02_08_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeFallbackFailed identifies a fallback policy whose primary AND secondary
              operations both failed on a live context (both errors travel as fields —
              neither is dropped). A cancellation is reported as ctx.Err() instead.
            name: CodeFallbackFailed
            value: "0x00_02_08_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeRetryBudgetExceeded identifies a retry policy that stopped before its
              attempt budget because the shared retry budget refused the next attempt
              (the last attempt's error is the wrap cause).
            name: CodeRetryBudgetExceeded
            value: "0x00_02_08_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeThrottled identifies a call the adaptive throttle refused on the
              client side, without sending it: the dependency had been refusing more
              than its share of the calls recently sent to it.
            name: CodeThrottled
            value: "0x00_02_08_09"
        type: errs.Code
    constants:
      - doc: |-
          BreakerClosed is a breaker that admits every call and counts their
          outcomes. The run starts at iota+1: the zero is left unclaimed, so a
          BreakerPhase nobody set reads "unknown", never "closed" — a forgotten
          assignment must not read as a healthy dependency (ADR 0031).
        name: BreakerClosed
        type: BreakerPhase
        value: "1"
      - doc: |-
          BreakerOpen is a breaker that rejects every call fast with CircuitOpen:
          until its cooldown elapses after a trip, or until Reset after Isolate.
        name: BreakerOpen
        type: BreakerPhase
        value: "2"
      - doc: |-
          BreakerHalfOpen is a breaker whose cooldown elapsed: it admits ONE trial
          call at a time, whose success closes it and whose failure opens it again.
        name: BreakerHalfOpen
        type: BreakerPhase
        value: "3"
    doc: |-
      Package resilience — range 0.2.8.* (ADR 0026 core/app/resilience block).

      Package resilience — declares the sentinel *errs.Error policy outcomes. Each
      var's name equals its errs.Define Reason in SCREAMING_SNAKE form.

      Package resilience declares the reliability port of the SDK: the context-aware
      Operation an executor guards and the composable Runner interface every policy
      (retry, circuit-breaker, rate-limit, bulkhead, timeout, fallback, hedging)
      satisfies. A core sibling admitted by ADR 0026 (Phase-B wave). Policies are
      concrete and live in internal/service/app/resilience; this package owns only the
      contract + the typed outcome sentinels, so policies compose by wrapping:
      Retry(Breaker(Timeout(op))).
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/resilience
    ports:
      - doc: |-
          Runner executes an Operation under a reliability policy and returns the
          operation's error, a policy sentinel (RetryExhausted, RetryBudgetExceeded,
          CircuitOpen, RateLimited, BulkheadFull, TimeoutExceeded, FallbackFailed,
          Throttled), or ctx.Err().
          Implementations MUST be safe for concurrent use. Runners compose: a Runner
          may itself invoke an inner Runner inside its Operation.

          IFACE-PLUGIN: concrete policies (retry/breaker/...) implement this interface;
          their concrete types stay unexported behind their constructors.
        methods:
          - in:
              - name: ctx
                type: context.Context
              - name: op
                type: Operation
            name: Run
            out:
              - type: error
        name: Runner
      - doc: |-
          RetryBudget bounds the extra attempts — retries and hedged duplicates —
          that the policies sharing it may issue, so that during an outage every
          call stops being multiplied by its attempt count. A call's FIRST attempt
          never asks it: a budget throttles amplification, never traffic.

          A sibling of Runner rather than a widening of it (ADR 0039): a budget is
          not a policy that runs an Operation, it is a counter several policies
          consult. NewRetryBudget is the SDK's implementation, the token bucket of
          gRPC's retry throttling; a caller may supply their own.

          Implementations MUST be safe for concurrent use, and SHOULD not allocate:
          AllowRetry and the two Record methods run on the retry's hot path.
        methods:
          - doc: |-
              AllowRetry reports whether one more attempt beyond a call's first may
              be issued now. It is a query: it spends nothing, and a policy that
              asks it and then issues no attempt owes it nothing.
            name: AllowRetry
            out:
              - type: bool
          - doc: RecordSuccess records an attempt that succeeded, which replenishes the budget.
            name: RecordSuccess
          - doc: |-
              RecordFailure records an attempt that failed in a way worth retrying,
              which drains the budget. A deterministic failure, and a caller who left,
              are not recorded.
            name: RecordFailure
        name: RetryBudget
      - doc: |-
          BreakerState is what a circuit breaker says about itself and what an
          operator may do to it: read its state, isolate it, reset it. The
          breaker NewCircuitBreaker returns implements it beside Runner; a caller
          reaches it with a type assertion on that Runner.

          A sibling of Runner rather than a widening of it (ADR 0039): a Runner
          runs Operations, and six of the seven policies have no state an
          operator could read or force.

          Implementations MUST be safe for concurrent use with Run.
        methods:
          - doc: |-
              State reports the breaker's phase and the counts it decides on, as of
              the call. It changes nothing: an Open breaker whose cooldown has
              elapsed reads Open, with OpenUntil in the past, until the next call
              is admitted as its HalfOpen trial.
            name: State
            out:
              - type: BreakerStateValue
          - doc: |-
              Isolate opens the breaker by hand: every call is rejected with
              CircuitOpen, with no cooldown and no trial, until Reset. The outcome
              of a call admitted before it is ignored.
            name: Isolate
          - doc: |-
              Reset closes the breaker and clears its counts, isolated or not. The
              outcome of a call admitted before it is ignored, and an increasing
              open duration starts over.
            name: Reset
        name: BreakerState
    sentinels:
      - var:
          - code: CodeRetryExhausted
            doc: RetryExhausted wraps the final attempt's error after the retry budget ran out.
            exit: TEMPFAIL
            name: RetryExhausted
            private: "service/app/resilience: retry budget exhausted; the wrap cause is the last attempt's error"
            public: The operation failed after exhausting all retries
            reason: RETRY_EXHAUSTED
          - code: CodeRetryBudgetExceeded
            doc: |-
              RetryBudgetExceeded wraps the last attempt's error when the shared retry
              budget refused the next attempt: the dependency is failing for enough
              callers that retrying would only multiply its load.
            exit: TEMPFAIL
            name: RetryBudgetExceeded
            private: "service/app/resilience: retry budget below half its tokens; the wrap cause is the last attempt's error"
            public: The operation failed and the retry budget refused another attempt
            reason: RETRY_BUDGET_EXCEEDED
          - code: CodeCircuitOpen
            doc: CircuitOpen is returned when the breaker is Open and the call is rejected fast.
            exit: TEMPFAIL
            http: 503
            name: CircuitOpen
            private: "service/app/resilience: breaker in Open state — downstream presumed unhealthy"
            public: The circuit breaker is open; the call was rejected
            reason: CIRCUIT_OPEN
          - code: CodeRateLimited
            doc: |-
              RateLimited is returned when no token was available, at once or within
              the limiter's MaxWait. A rejection by the SDK's limiters carries, as the field
              retry_after_seconds, how long the bucket needs to earn the next token.
            exit: TEMPFAIL
            http: 429
            name: RateLimited
            private: "service/app/resilience: no rate-limit token available"
            public: The call was rejected by the rate limiter
            reason: RATE_LIMITED
          - code: CodeBulkheadFull
            doc: |-
              BulkheadFull is returned when every concurrency slot is occupied, and,
              for a bulkhead that queues, when its queue is full or no slot freed
              within its MaxWait.
            exit: TEMPFAIL
            http: 503
            name: BulkheadFull
            private: "service/app/resilience: all bulkhead concurrency slots occupied"
            public: The call was rejected because the bulkhead is full
            reason: BULKHEAD_FULL
          - code: CodePolicyMisconfigured
            doc: |-
              PolicyMisconfigured is returned by every call to a policy that was built
              with a configuration it cannot honour, in place of running the operation.
              Unlike its siblings it is permanent, not transient (ADR 0031): the fix is
              a code change at the construction site, never a retry.
            exit: CONFIG
            name: PolicyMisconfigured
            private: "service/app/resilience: policy built with a configuration it cannot honour; the fields name the policy and the knob"
            public: The reliability policy was misconfigured and refused the call
            reason: POLICY_MISCONFIGURED
          - code: CodeTimeoutExceeded
            doc: TimeoutExceeded is returned when the operation outran the timeout deadline.
            exit: TEMPFAIL
            http: 504
            name: TimeoutExceeded
            private: "service/app/resilience: operation did not complete before the deadline"
            public: The operation exceeded its timeout
            reason: TIMEOUT_EXCEEDED
          - code: CodeFallbackFailed
            doc: |-
              FallbackFailed is returned when the primary operation AND the fallback
              both failed. It is the policy's own outcome rather than either half's
              error, so that neither can be dropped and neither can hijack the code:
              both messages travel as the "primary" and "fallback" fields.
            exit: TEMPFAIL
            name: FallbackFailed
            private: "service/app/resilience: primary and fallback both failed; the fields carry both messages"
            public: The operation and its fallback both failed
            reason: FALLBACK_FAILED
          - code: CodeThrottled
            doc: |-
              Throttled is returned when the adaptive throttle refused the call on
              the client side, without sending it, because the dependency had been
              refusing more than its share of the recent calls (Google SRE's
              client-side throttling). It is transient: the probability of a refusal
              falls as the dependency accepts again.
            exit: TEMPFAIL
            http: 503
            name: Throttled
            private: "service/app/resilience: refused client-side by the adaptive throttle; the dependency rejected too many recent calls"
            public: The call was throttled on the client side
            reason: THROTTLED
    types:
      - doc: |-
          BreakerPhase is where a circuit breaker stands: BreakerClosed,
          BreakerOpen or BreakerHalfOpen. The zero value is none of them.
        methods:
          - doc: |-
              String renders the phase for a log line, a readiness body or a metric
              label: "closed", "open", "half-open". The spellings are stable — a
              dashboard parses them — and a value this package never mints renders
              "unknown".
            name: String
            out:
              - type: string
            recv: value
        name: BreakerPhase
        underlying: uint8
      - doc: |-
          BreakerStateValue is a circuit breaker's state as BreakerState.State
          reports it: its phase and the counts that phase is decided on.
        name: BreakerStateValue
        struct:
          fields:
            - doc: Phase is where the breaker stands.
              name: Phase
              type: BreakerPhase
            - doc: |-
                Isolated reports a breaker opened by Isolate: its Phase is
                BreakerOpen, and it stays so until Reset, whatever the clock says.
              name: Isolated
              type: bool
            - doc: |-
                Calls is how many calls the breaker's sliding window holds — the
                successes and failures recorded within it while Closed. A breaker
                without a window keeps no such count, and reports zero.
              name: Calls
              type: int
            - doc: |-
                Failures is, with a sliding window, how many of Calls failed; without
                one, how many failures followed one another since the last success,
                the count FailureThreshold is compared to.
              name: Failures
              type: int
            - doc: |-
                SlowCalls is how many of Calls lasted at least the window's
                SlowAfter, failed or not. Zero without a window.
              name: SlowCalls
              type: int
            - doc: |-
                Trips counts the times the breaker opened on its own since it was
                built — from Closed on its threshold, or from HalfOpen on a failed
                trial. Isolate is not a trip.
              name: Trips
              type: uint64
            - doc: |-
                OpenUntil is when an Open breaker admits its next HalfOpen trial. It
                is zero unless Phase is BreakerOpen, and zero for an isolated one,
                which admits nothing until Reset.
              name: OpenUntil
              type: time.Time
      - doc: |-
          Operation is the unit of work a Runner guards. It MUST honour ctx
          cancellation (return promptly when ctx.Done fires) so timeout/cancellation
          propagate; a non-cancellable op caps a Timeout's precision at op granularity.

          The port says nothing about idempotence, because most policies do not need
          it: retry replays an Operation only after it has failed, and every other
          policy runs it at most once. The hedging policy is the exception — it runs
          copies CONCURRENTLY, so a non-idempotent Operation produces a double effect
          (a double charge, a double insert) rather than a slow one. The SDK cannot
          detect idempotence, so the hedging config makes the caller assert it in code
          (HedgeConfig.Idempotent) instead of trusting a doc comment.
        name: Operation
        underlying: func(ctx context.Context) error
  - aliases:
      - doc: |-
          BackoffValue is an exponential backoff: the wait after the n-th consecutive
          failure is BaseDelay × Multiplier^(n−1), held at MaxDelay when one is set and
          widened by Jitter when one is asked for. Delay(attempt) never returns a
          negative duration, however large attempt is (ADR 0103).

          It is the policy NewRetry has always applied between attempts, published so
          a loop that retries on its own terms — a supervised goroutine, an outbox, a
          state machine's failed transition — computes the same curve instead of
          writing a fourth copy of it. RetryConfig keeps its four fields of the same
          names; NewRetry builds its waits from the same two halves.

          It is an alias of kernel/backoff.Value, the layer that OWNS the curve (ADR
          0074): the curve names no policy and no domain, so the domains that only
          need the curve import the kernel directly instead of this package.
        name: BackoffValue
        target: kbackoff.Value
    doc: |-
      Package resilience — the exponential backoff every waiting policy computes,
      re-exported from the kernel package that owns it.

      Package resilience — circuit-breaker policy.

      Package resilience — circuit-breaker configuration.

      Package resilience — circuit-breaker state machine values.

      Package resilience — the circuit breaker's sliding window: time slots on
      the breaker's clock, the oldest dropped as time moves past it.

      Package resilience — what the circuit breaker reports, what an operator
      forces on it, and the changes of phase it delivers outside its lock.

      Package resilience — bulkhead (bounded-concurrency) policy.

      Package resilience — the bulkhead that queues: a bounded number of calls
      wait a bounded time, on an injected clock, for a slot to free.

      Package resilience — the adaptive throttle: Google SRE's client-side
      throttling, a call refused locally with the probability the dependency's
      recent refusals give it.

      Package resilience — adaptive throttle configuration.

      Package resilience — the adaptive throttle's window: requests and accepts
      counted in time slots on the throttle's clock.

      Package resilience — fallback (secondary-operation) policy.

      Package resilience — fallback policy configuration.

      Package resilience — hedging (duplicate-request racing) policy.

      Package resilience — hedging policy configuration.

      Package resilience — what one hedged attempt reports back to the race.

      Package resilience — the per-call bookkeeping of a hedged race.

      Package resilience — the keyed rate limiter: one token bucket per caller,
      with the set of callers bounded and idle ones forgotten.

      Package resilience — keyed rate-limiter configuration.

      Package resilience — the Runner returned when a policy cannot be honoured.

      Package resilience — token-bucket rate-limit policy.

      Package resilience — token-bucket rate-limiter configuration.

      Package resilience — retry-with-exponential-backoff policy.

      Package resilience — retry policy configuration.

      Package resilience — shared retryable-error classification helper.

      Package resilience provides the concrete reliability policies (retry,
      circuit-breaker, rate-limit, bulkhead, timeout, fallback, hedging)
      implementing core/app/resilience.Runner. Each constructor returns a Runner;
      policies compose by nesting. ADR 0026. Cross-OS: 100% portable (context,
      time, sync, atomic).

      Hedging is the one policy that runs the Operation CONCURRENTLY with itself,
      so it is correct only on an idempotent Operation; HedgeConfig.Idempotent
      makes the caller say so in code (ADR 0031's rule applied to a precondition
      the SDK cannot check).

      Package resilience — shared sentinel-wrapping helper.
    functions:
      - doc: |-
          NewCircuitBreaker returns a Runner guarding op with a Closed→Open→HalfOpen
          breaker. Open calls return CircuitOpen until OpenDuration elapses; a
          non-positive OpenDuration clamps to defaultOpenDuration, because a breaker
          whose cooldown is zero admits the next call immediately and therefore
          protects nothing (ADR 0031). An error rejected by cfg.Retryable is returned
          verbatim and left out of the state machine entirely, so deterministic
          failures cannot trip the breaker. Once the cooldown elapses ONE HalfOpen
          trial runs at a time and every other call returns CircuitOpen until it
          settles; cfg.HalfOpenTrials successful trials in a row close the
          breaker, and any failed one opens it again. The outcome of a call
          admitted before the breaker last opened is ignored: its success cannot
          close the breaker and its failure cannot restart the cooldown.

          A call that ends in context.Canceled once the caller's own context is
          closed is neutral — neither a success nor a failure — because the caller
          left, not the dependency: a wave of client disconnects cannot open the
          breaker on a healthy dependency, and a HalfOpen trial abandoned that way
          frees the slot for the next call. context.DeadlineExceeded stays a
          failure: a dependency too slow for the caller's deadline is a slow
          dependency.

          With a nil cfg.Window the breaker opens on FailureThreshold consecutive
          failures. With one, it opens on the rate of failures, or of slow calls,
          among the calls of a sliding time window on cfg.Clock, once that window
          holds at least MinCalls of them; a HalfOpen trial that lasts SlowAfter
          or longer counts as failed. A Window or an OpenBackoff with a value it
          cannot honour is refused: every call returns PolicyMisconfigured,
          naming the field, and the Runner returned is not a BreakerState.

          The Runner returned otherwise implements BreakerState: State reports
          the phase and its counts, Isolate opens the breaker until Reset, and
          Reset closes it. cfg.OnStateChange hears every change of phase.
        in:
          - name: cfg
            type: BreakerConfig
        name: NewCircuitBreaker
        out:
          - type: coreres.Runner
      - doc: |-
          NewBulkhead returns a Runner that admits at most maxConcurrent simultaneous
          operations (clamped to >= 1). Excess calls return BulkheadFull immediately
          (reject mode — no queuing).
        in:
          - name: maxConcurrent
            type: int
        name: NewBulkhead
        out:
          - type: coreres.Runner
      - doc: |-
          NewBulkheadWait returns a Runner that admits at most cfg.Max simultaneous
          operations (clamped to >= 1) and lets up to cfg.Queue more calls wait, each
          at most cfg.MaxWait on cfg.Clock, for a slot to free — Polly's
          ConcurrencyLimiter(permitLimit, queueLimit), failsafe-go's bulkhead
          WithMaxWaitTime. A call that finds the queue full, or whose wait runs out,
          returns BulkheadFull; one whose context ends while it waits returns
          ctx.Err() and frees its place in the queue.

          A non-positive Queue or MaxWait is no waiting at all: the call is
          rejected at once, as NewBulkhead rejects it, so the zero
          BulkheadWaitConfig is NewBulkhead(1). Waiters take the freed slots in
          the order they started waiting, as far as the Go runtime's channel
          queues keep it.

          A call that finds a slot free pays what NewBulkhead's does and
          allocates nothing; a call that waits arms one timer on cfg.Clock.
        in:
          - name: cfg
            type: BulkheadWaitConfig
        name: NewBulkheadWait
        out:
          - type: coreres.Runner
      - doc: |-
          NewAdaptiveThrottle returns a Runner that refuses calls on the client
          side, before sending them, when the dependency has been refusing more
          than its share: the adaptive throttling of Google's SRE book ("Handling
          Overload"). Over the last cfg.Window it counts requests — every call
          Run was asked to make, the ones it refused included — and accepts —
          the calls the dependency answered without refusing them — and refuses
          each new call with probability

          	max(0, (requests − K × accepts) / (requests + 1))

          returning Throttled without running the operation. While the
          dependency accepts at least one call in K, nothing is refused; past
          that, the refusals grow with the excess. A dependency that refuses
          everything still receives a trickle of calls — the traffic that tells
          it, and us, when it has recovered — and the refusals fade as its
          accepts come back into the window.

          A call's error is a refusal when cfg.Rejected says so — every error
          when it is nil —; a nil error is an accept, and so is a call that
          ended in context.Canceled once the caller's own context was closed: a
          caller who left says nothing about the dependency. The refusal is drawn
          from cfg.Random, so a test decides it.

          A K below 1 or not a number, a negative Window, more than 1000
          Buckets, or a Window too short to split into its Buckets, is refused:
          every call returns PolicyMisconfigured, naming the field. A call that
          is not refused costs one lock and no allocation.
        in:
          - name: cfg
            type: AdaptiveThrottleConfig
        name: NewAdaptiveThrottle
        out:
          - type: coreres.Runner
      - doc: |-
          NewFallback returns a Runner that runs cfg.Fallback when the Operation passed
          to Run fails, and returns nil when the fallback succeeds — that masking IS
          the policy. When both fail the result is FallbackFailed, carrying both
          messages as fields so neither failure is lost.

          A cancelled context is reported as itself, never as FallbackFailed: when it
          is already dead after the primary the fallback does not run at all, and when
          it dies WHILE the fallback runs, a failed fallback returns ctx.Err(). A
          fallback that succeeds despite a late cancellation still returns nil — the
          work was done.

          A nil cfg.Fallback is refused: every call returns PolicyMisconfigured without
          running the operation (ADR 0031). A fallback policy with no fallback would
          run the primary and pass its error through unchanged — indistinguishable
          from no policy at all, while the caller believes their plan B is in place.

          The primary error is NOT surfaced when the fallback succeeds; that is what a
          fallback is for. A caller who needs to know how often plan B fires
          instruments the fallback Operation itself, which is an ordinary closure.
        in:
          - name: cfg
            type: FallbackConfig
        name: NewFallback
        out:
          - type: coreres.Runner
      - doc: |-
          NewHedge returns a Runner that guards tail latency by DUPLICATING a slow
          Operation: when the first attempt has been outstanding for cfg.Delay, a
          second copy starts, and so on every cfg.Delay up to cfg.MaxHedges extra
          copies. The first attempt to succeed wins and Run returns nil; the losers'
          context is cancelled on the way out and their results are discarded.

          # The Operation MUST be idempotent

          Every other policy here runs the Operation at most once at a time; this one
          runs copies CONCURRENTLY, so a non-idempotent Operation is not made slow by
          hedging, it is made WRONG — two charges, two inserts, two outbound messages,
          with the policy reporting one clean success. The SDK cannot detect
          idempotence, so cfg.Idempotent is a mandatory in-code assertion rather than a
          warning in prose: its zero value refuses the policy (ADR 0031).

          # Hedging acts on latency, never on failure

          An attempt that FAILS before cfg.Delay elapses ends the call with that error,
          verbatim; no duplicate is issued. Reacting to a failure by launching another
          attempt is retrying, and this package already has NewRetry — compose
          NewRetry(NewHedge(op)) to get both. Keeping them separate is also what keeps
          the duplication bounded by latency rather than by failure: a dependency that
          is failing fast gets no extra traffic from this policy, only a slow one does.

          # Load

          cfg.MaxInFlight caps the duplicates in flight across all calls, so a
          dependency that has gone slow cannot make every caller hedge at once. When
          the cap is reached the duplicate is simply not issued and the call proceeds
          on its first attempt alone — degrading to no-hedging, never to a rejection.

          # A panic reaches the caller, with its original value

          This is the one policy that runs the Operation on goroutines of its own, and
          a panic that reaches the top of any goroutine ends the process — where under
          every other policy the same panic reaches the caller's goroutine and is
          contained by net/http or by the caller's own recover. So a copy's panic is
          recovered on that copy's goroutine and re-raised from Run, on the caller's
          goroutine, with the Operation's ORIGINAL value: the caller's recover compares
          equal to exactly what was panicked with, and http.ErrAbortHandler still
          aborts a handler silently instead of being logged as a crash.

          What does NOT survive is the stack. The re-raised panic's stack is the
          re-raise site inside Run, not the Operation's frame: a value re-raised on
          another goroutine cannot carry the panicking goroutine's stack without being
          wrapped, and wrapping it would break both http.ErrAbortHandler and value
          equality. A copy that panics after Run has returned — a loser, once a winner
          was found or the caller went away — is recovered and dropped; it never
          reaches the caller and never ends the process.

          The delay is measured on cfg.Clock — the wall clock when nil — so a test
          issues a duplicate by advancing a clock.ManualClock past cfg.Delay.

          Run costs one goroutine per attempt (including the first, so the delay stays
          observable) and one ticker per call: this is the one policy in the package
          that is not allocation-trivial, which is the price of racing. Neither cost
          grows with cfg.MaxHedges, which bounds how many duplicates a call may issue
          and nothing else.

          A false cfg.Idempotent, a non-positive cfg.Delay, or a non-positive
          cfg.MaxInFlight is refused: every call returns PolicyMisconfigured without
          running the operation (ADR 0031). A cfg.MaxHedges below one clamps to one.

          With a cfg.Budget, a duplicate the budget refuses is not issued — the
          call proceeds on the attempts already running, as when MaxInFlight is
          reached — and each call's outcome is recorded in it: a success, or a
          failure on a live context. A cfg.Budget NewRetryBudget refused makes
          every call return PolicyMisconfigured.
        in:
          - name: cfg
            type: HedgeConfig
        name: NewHedge
        out:
          - type: coreres.Runner
      - doc: |-
          NewKeyedRateLimiter returns a Runner admitting at most cfg.Rate calls per
          second, with a cfg.Burst allowance, PER KEY — the key being whatever cfg.Key
          names for the call's context. A call whose bucket is empty is rejected with
          RateLimited; the others are not.

          At most cfg.MaxKeys keys are held: a new key beyond that forgets the least
          recently used one. A key unused for cfg.IdleTimeout is forgotten too. A
          forgotten key's next call starts over with a full bucket.

          A Rate that is not a finite positive number, a nil Key, and a non-positive
          MaxKeys or IdleTimeout are each refused: every call returns
          PolicyMisconfigured, naming the field, without running the operation.
        in:
          - name: cfg
            type: KeyedRateLimiterConfig
        name: NewKeyedRateLimiter
        out:
          - type: coreres.Runner
      - doc: |-
          NewRateLimiter returns a Runner that admits at most Rate calls/sec (with a
          Burst allowance), rejecting excess calls with RateLimited. A Rate that is not
          a finite positive number — zero, negative, NaN or infinite — is refused
          rather than defaulted: every call returns PolicyMisconfigured without running
          the operation (ADR 0031).

          With a positive cfg.MaxWait, a call whose token is due within MaxWait
          reserves it and waits for it on cfg.Clock instead of being rejected; a
          call whose context ends while it waits returns ctx.Err() and hands its
          token back. A cfg.Clock that cannot wait — a clock.Clock that is not a
          clock.Timed — is refused when MaxWait is positive, naming Clock.
        in:
          - name: cfg
            type: RateLimiterConfig
        name: NewRateLimiter
        out:
          - type: coreres.Runner
      - doc: |-
          NewRetry returns a Runner that retries op up to cfg.MaxAttempts times,
          sleeping an exponentially-growing (capped) delay between attempts and aborting
          early on ctx cancellation. The final attempt's error wraps as RetryExhausted.
          An error rejected by cfg.Retryable ends the loop at once and is returned
          verbatim, so a deterministic failure neither spends the budget nor hides
          behind RetryExhausted. When cfg.Delay reads a wait from the failure — a
          Retry-After, a RateLimited rejection — that wait replaces the backoff,
          held at cfg.MaxDelay. cfg.JitterMode chooses how the backoff is
          randomised: added Jitter (the zero), full, or decorrelated from the
          previous wait of the same call.

          With a cfg.Budget, every success and every retryable failure is recorded
          in it, and a retry it refuses ends the loop with RetryBudgetExceeded
          wrapping the last error. cfg.OnRetry hears each retry before its wait. A
          cfg.Budget NewRetryBudget refused makes every call return
          PolicyMisconfigured.
        in:
          - name: cfg
            type: RetryConfig
        name: NewRetry
        out:
          - type: coreres.Runner
      - doc: |-
          NewTimeout returns a Runner that fails an Operation with TimeoutExceeded if it
          does not finish within d. The Operation MUST honour ctx for the deadline to
          fire promptly (a ctx-ignoring op caps precision at op granularity).

          A non-positive d is refused: every call returns PolicyMisconfigured without
          running the operation (ADR 0031). context.WithTimeout(ctx, 0) yields an
          already-expired context, so the previous behaviour failed even an
          instantaneous operation with TimeoutExceeded — a policy that could never
          admit anything, reporting it with the error it uses when it is working.

          Only this policy's own deadline is reported as TimeoutExceeded. When the
          caller's context is already finished — cancelled, or past a deadline of
          its own — the call returns that context's error instead: the caller
          left or ran out of time, and the policy did not time anything out.

          The deadline runs on the wall clock; NewTimeoutWith takes a clock.
        in:
          - name: d
            type: time.Duration
        name: NewTimeout
        out:
          - type: coreres.Runner
      - doc: |-
          NewTimeoutWith is NewTimeout with the deadline measured on cfg.Clock, so
          a test expires it by advancing a clock.ManualClock past cfg.Duration
          instead of sleeping through it (ADR 0090). A nil cfg.Clock, or
          clock.System, is NewTimeout(cfg.Duration) exactly.

          Under any other clock the Operation's context reports
          context.DeadlineExceeded once the clock passes the deadline, and its
          Deadline method reports the caller's deadline, not this one: a deadline
          on a clock that is not the wall clock is not a time a socket can be
          given. A non-positive cfg.Duration is refused like NewTimeout's.
        in:
          - name: cfg
            type: TimeoutConfig
        name: NewTimeoutWith
        out:
          - type: coreres.Runner
      - doc: |-
          RetryAfter reports the delay err says to wait before the next attempt,
          and whether it says one. It reads the retry_after_seconds field of the
          outermost *errs.Error in err's chain — a number of seconds, whole or
          fractional — and reports false when there is none, or when it is not a
          finite positive number.

          Three producers in the SDK set it: the OTLP/HTTP exporters on a
          retryable answer whose Retry-After header holds delta-seconds, the
          guarded HTTP client (net/client) on a 429 or a 503 whose Retry-After
          does the same, and RateLimited from NewRateLimiter and
          NewKeyedRateLimiter, with the time the bucket needs to earn its next
          token. An HTTP-date Retry-After is not read: converting it compares the
          peer's clock to ours. Any other error sets the same field with
          errs.Int or errs.Float to take part.

          Its shape is RetryConfig.Delay's, so honouring the delay is one line:

          	Delay: func(_ int, err error) (time.Duration, bool) { return RetryAfter(err) }

          A delay too long for a time.Duration reports the longest one.
        in:
          - name: err
            type: error
        name: RetryAfter
        out:
          - type: time.Duration
          - type: bool
      - doc: |-
          NewRetryBudget returns the token-bucket RetryBudget of gRPC's retry
          throttling (gRFC A6), to share between the NewRetry and NewHedge policies
          that call one dependency. It starts full, at cfg.MaxTokens tokens; each
          recorded failure costs one token, each recorded success returns
          cfg.TokenRatio of one, never past cfg.MaxTokens; and AllowRetry is true
          only while more than half of cfg.MaxTokens remain. The first attempt of a
          call is never refused, so a dependency that recovers is seen to recover:
          its successes refill the bucket.

          The bucket drains while recorded failures exceed TokenRatio times the
          recorded successes — with 0.1, more than one failure per ten successes —
          and retries stop once it has lost half its tokens; it refills, and
          retries resume, when failures fall back below that ratio. 0.1 is the
          order of the per-client retry budget Google's SRE book recommends (10%)
          and of the AWS SDKs' retry quota.

          A non-positive cfg.MaxTokens, and a cfg.TokenRatio that is not a finite
          number of at least one thousandth, are refused (ADR 0031): the budget
          returned allows no retry, and NewRetry or NewHedge given it refuses
          every call with PolicyMisconfigured, naming the field. The counts are
          kept in thousandths of a token, as gRPC does, without a lock and without
          allocating.
        in:
          - name: cfg
            type: RetryBudgetConfig
        name: NewRetryBudget
        out:
          - type: coreres.RetryBudget
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreres: github.com/kitsunium/sdk/internal/core/app/resilience
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
    path: github.com/kitsunium/sdk/internal/service/app/resilience
    types:
      - doc: |-
          AdaptiveThrottleConfig parameterises NewAdaptiveThrottle, in the terms
          of Google's SRE book: the multiplier K, the window the requests and
          accepts are counted over, and what counts as a refusal. Every field
          has a default; a value out of range is refused with
          PolicyMisconfigured, naming the field (ADR 0031).
        name: AdaptiveThrottleConfig
        struct:
          fields:
            - doc: |-
                K is how many requests per accept the throttle lets through before
                it starts refusing: a call is refused with probability
                max(0, (requests − K × accepts) / (requests + 1)). Zero is 2, the
                SRE book's value. A lower K refuses sooner and wastes less of the
                dependency's capacity on calls it will refuse; a higher one refuses
                later and keeps more traffic flowing. A K below 1 would refuse calls
                to a dependency accepting every one of them, and is refused, as is
                one that is not a finite number.
              name: K
              type: float64
            - doc: |-
                Window is how far back the requests and accepts are counted. Zero
                is two minutes, the SRE book's history. A negative Window is
                refused.
              name: Window
              type: time.Duration
            - doc: |-
                Buckets is how many slots the window is kept in: a slot leaves the
                window whole, so it reaches back between Window − Window/Buckets
                and Window. Zero is 10; more than 1000 is refused, as is a Window
                too short to give each slot a nanosecond.
              name: Buckets
              type: int
            - doc: |-
                Rejected classifies a non-nil error of the operation: true is a
                refusal by the dependency — overload, quota, unavailability —,
                false an answer it gave, which counts as an accept however
                unwelcome. Nil counts every error as a refusal. It is not
                consulted for a context.Canceled returned once the caller's
                context is closed: that call counts as an accept.
              name: Rejected
              type: func(error) bool
            - doc: Clock is what the window is kept on. Nil means clock.System.
              name: Clock
              type: clock.Clock
            - doc: |-
                Random returns a number in [0, 1) each time a call might be
                refused; the call is refused when it is below the probability.
                Nil is math/rand/v2's Float64. A test hands it a sequence to
                decide each refusal.
              name: Random
              type: func() float64
      - doc: |-
          BreakerConfig parameterises NewCircuitBreaker. A non-positive FailureThreshold
          defaults to 5; a non-positive OpenDuration defaults to 30s; a nil Clock
          defaults to clock.System; a nil Retryable counts every error as a failure;
          a nil Window opens on consecutive failures; a nil OnStateChange hears
          nothing; a nil OpenBackoff keeps every opening at OpenDuration; a
          non-positive HalfOpenTrials closes on one successful trial.
        name: BreakerConfig
        struct:
          fields:
            - doc: |-
                FailureThreshold is how many consecutive failures open a breaker
                without a Window. A non-positive value defaults to 5. It is not read
                when Window is set.
              name: FailureThreshold
              type: int
            - doc: |-
                OpenDuration is how long an Open breaker rejects calls before admitting
                one HalfOpen trial. A non-positive value clamps to 30s: a zero cooldown
                would let the very next call through, which is a breaker that never
                rejects anything and so protects nothing while the caller believes it
                does (ADR 0031).
              name: OpenDuration
              type: time.Duration
            - name: Clock
              type: clock.Clock
            - doc: |-
                Retryable classifies a non-nil operation error as a dependency failure
                worth counting against the breaker's health. false means the error is
                deterministic — the caller's own fault, not the dependency's — so it is
                returned verbatim and folded into neither the failure count nor the
                success path: a stream of HTTP 400s can no longer trip the breaker, and
                one of them cannot close a HalfOpen breaker either. A nil predicate
                counts every error as a failure, which is the pre-classifier behaviour.
                It is not consulted for a context.Canceled returned once the caller's
                context is closed: that call is neutral whatever the predicate says.
                Shares its shape with RetryConfig.Retryable so one classifier serves a
                nested Retry(Breaker(op)) stack.
              name: Retryable
              type: func(error) bool
            - doc: |-
                Window, when set, opens the breaker on a RATE rather than a streak:
                of failures, or of slow calls, among the calls a sliding time window
                holds. Nil — the zero value — is the consecutive-failure breaker,
                exactly as it was before the field existed.

                A streak misses a dependency that fails every other call: S, F, S,
                F never reaches a threshold of five, and neither does a dependency
                that answers every call, eventually, a minute late. A rate over a
                window sees both. The window's fields have defaults of their own,
                taken from Polly and resilience4j — see BreakerWindowValue.
              name: Window
              type: "*BreakerWindowValue"
            - doc: |-
                OnStateChange, when set, is called on every change of phase, with the
                phase left and the phase entered: Closed to Open on a trip, Open to
                HalfOpen when a call is admitted as the trial, HalfOpen to Closed or
                Open on its outcome, and whatever Isolate and Reset change.

                It is called outside the breaker's lock, one call at a time and in
                the order the changes happened, on the goroutine of the call that
                made the change — or of one already delivering an earlier change,
                which then delivers this one too. It may call State, Isolate or
                Reset. It must not block: a call that changed the phase waits for
                it. Nil hears nothing.
              name: OnStateChange
              type: func(from coreres.BreakerPhase, to coreres.BreakerPhase)
            - doc: |-
                OpenBackoff, when set, makes each opening last longer than the one
                before while the dependency keeps failing its trials: the n-th
                opening since the breaker last closed lasts OpenBackoff.Delay(n),
                in place of OpenDuration. The count starts over when a trial closes
                the breaker, and on Reset.

                Its BaseDelay and its MaxDelay are both required — a zero base is
                a cooldown of nothing, and a zero ceiling one that may grow to
                centuries — and are refused when not positive, with
                PolicyMisconfigured naming the field. Its Multiplier, Jitter and
                JitterMode read as BackoffValue reads them. Nil keeps every opening
                at OpenDuration.
              name: OpenBackoff
              type: "*BackoffValue"
            - doc: |-
                HalfOpenTrials is how many trials in a row must succeed before a
                HalfOpen breaker closes. The trials still run one at a time, and
                any one that fails opens the breaker again. Zero, or less, is one:
                the first successful trial closes it, as before the field existed.

                One success is thin evidence that a dependency has recovered — the
                trial may have reached the one healthy replica, or a cache — and a
                breaker that closes on it and trips again at once doubles the load
                it meant to spare. A few trials in a row cost a few more cooldowns'
                worth of latency to the first callers after recovery, which is what
                resilience4j's permittedNumberOfCallsInHalfOpenState buys too.
              name: HalfOpenTrials
              type: int
      - doc: |-
          BreakerWindowValue is a circuit breaker's sliding window: the calls of the
          last Size, kept in Buckets slots of Size/Buckets each on the breaker's
          clock, the oldest slot dropped as time moves past it. The breaker opens
          when the window holds at least MinCalls calls and either FailureRatio of
          them failed or SlowRatio of them lasted SlowAfter or longer.

          A zero field takes its default, each one a published library's own:
          Size 30s, Buckets 10, MinCalls 100 and FailureRatio 0.1 are Polly v8's
          SamplingDuration, its ten sampling windows, MinimumThroughput and
          FailureRatio; SlowAfter 60s and SlowRatio 1 are resilience4j's
          slowCallDurationThreshold and slowCallRateThreshold. A negative value,
          a ratio above 1 or not a number, more than 1000 Buckets, or a Size too
          short to split into Buckets, is refused: every call returns
          PolicyMisconfigured, naming the field.

          A call is counted when it ends, in the slot of its end, if the breaker
          is still Closed and it was not admitted before the breaker last opened. A
          deterministic error and a caller who left are not counted at all. The
          window is emptied each time the breaker changes phase.
        name: BreakerWindowValue
        struct:
          fields:
            - doc: Size is how far back the window reaches. Zero is 30 seconds.
              name: Size
              type: time.Duration
            - doc: |-
                Buckets is how many slots the window is kept in: a slot leaves the
                window whole, so the window reaches back between Size − Size/Buckets
                and Size. Zero is 10; more than 1000 is refused, the memory of a
                breaker being one slot each.
              name: Buckets
              type: int
            - doc: |-
                MinCalls is how many calls the window must hold before a ratio is
                read at all: below it, a single failure would be a rate of 100%.
                Zero is 100.
              name: MinCalls
              type: int
            - doc: |-
                FailureRatio is the share of failed calls, in (0, 1], at or above
                which the breaker opens. Zero is 0.1.
              name: FailureRatio
              type: float64
            - doc: |-
                SlowAfter is the duration, measured on the breaker's clock from
                admission to return, at or above which a call is slow, whether it
                succeeded or failed. Zero is 60 seconds.
              name: SlowAfter
              type: time.Duration
            - doc: |-
                SlowRatio is the share of slow calls, in (0, 1], at or above which
                the breaker opens. Zero is 1: only a window where every call was
                slow opens it.
              name: SlowRatio
              type: float64
      - doc: |-
          BulkheadWaitConfig parameterises NewBulkheadWait: how many calls run at
          once, how many more may wait for a slot, for how long, and on which
          clock. Its zero value is NewBulkhead(1) — one slot and no waiting —:
          each field's zero is the reject-at-once bulkhead the SDK has always
          had, never a queue nobody sized (ADR 0031).
        name: BulkheadWaitConfig
        struct:
          fields:
            - doc: |-
                Max is how many operations run at once. A non-positive Max is 1,
                as NewBulkhead's limit is.
              name: Max
              type: int
            - doc: |-
                Queue is how many calls may wait for a slot beyond the Max
                running; a call that finds the queue full is rejected at once with
                BulkheadFull. Zero, or less, is no queue. It bounds the memory
                and the goroutines a saturated dependency can pin, which an
                unbounded queue would not.
              name: Queue
              type: int
            - doc: |-
                MaxWait is how long a queued call waits for a slot before it is
                rejected with BulkheadFull. Zero, or less, is no wait. Size it
                below the caller's own deadline: a wait the caller cannot afford
                only moves the timeout from this policy to the caller.
              name: MaxWait
              type: time.Duration
            - doc: |-
                Clock is what MaxWait is measured on. Nil means clock.System; a
                ManualClock lets a test run the wait out without sleeping.
              name: Clock
              type: clock.Timed
      - doc: |-
          FallbackConfig parameterises NewFallback. A nil Fallback is refused (there is
          no defensible SDK-side substitute for the caller's own plan B); a nil
          Retryable falls back on every primary failure.
        name: FallbackConfig
        struct:
          fields:
            - doc: |-
                Fallback is the secondary Operation run when the primary one fails. It
                has no default: a nil Fallback makes NewFallback return a policy that
                refuses every call with PolicyMisconfigured (ADR 0031). The two values
                the SDK could invent are both worse than a refusal — running the primary
                and passing its error through is a policy that silently does nothing
                while the caller believes their plan B is wired up, and a no-op fallback
                that returns nil would report success for work that never happened.

                It is an Operation, not a func(ctx, primaryErr) error, so that the whole
                policy vocabulary composes on the fallback side too: the plan B can
                itself be a Runner stack (NewRetry(...).Run, a second region's client
                behind its own breaker) with no adapter. What the fallback would have
                learned from the primary error is decided ahead of it, by Retryable.

                The port carries no result value, so a "fallback VALUE" is expressed as
                a closure assigning the default into the caller's own variable:

                	var page []byte
                	cfg := FallbackConfig{Fallback: func(context.Context) error {
                		page = cachedPage
                		return nil
                	}}
              name: Fallback
              type: coreres.Operation
            - doc: |-
                Retryable classifies a non-nil PRIMARY error as one worth falling back
                on. false returns that error verbatim without running the fallback: a
                deterministic failure — a malformed request, an authorisation refusal,
                a policy misconfiguration — is the caller's own, and serving a cached
                answer for it hides a bug behind a stale success. A nil predicate falls
                back on every failure. It shares its shape with RetryConfig.Retryable
                and BreakerConfig.Retryable, so one classifier serves a nested
                Fallback(Retry(Breaker(op))) stack.
              name: Retryable
              type: func(error) bool
      - doc: |-
          HedgeConfig parameterises NewHedge. Three of its four knobs have no default:
          Idempotent, Delay and MaxInFlight are refused when unset, because every value
          the SDK could pick for them is either a guess at the caller's requirement or
          a licence to duplicate load the caller never agreed to (ADR 0031). MaxHedges
          is the one with an obvious floor and clamps to 1. A nil Clock measures the
          delay on the wall clock, and a nil Budget never refuses a duplicate.
        name: HedgeConfig
        struct:
          fields:
            - doc: |-
                Idempotent asserts that the guarded Operation is safe to run more than
                once, concurrently, with at most one of the copies being observed. It
                has no default: false — the zero value — makes NewHedge return a policy
                that refuses every call with PolicyMisconfigured.

                This is the one precondition in the package that is a property of the
                CALLER'S CODE rather than of a number, and the SDK has no way to detect
                it: a hedged non-idempotent Operation does not fail, it succeeds twice —
                a double charge, a double insert, a duplicate outbound message — and
                nothing in the policy or its errors will ever mention it. A doc comment
                is the wrong instrument for a hazard whose symptom is silent success, so
                the claim is made in code, at the construction site, where review sees
                it and `grep -r 'Idempotent:'` enumerates every hedged call path in a
                codebase. Requiring it (rather than defaulting it to true) also means a
                caller cannot arrive at hedging by copying a config and deleting the
                field.
              name: Idempotent
              type: bool
            - doc: |-
                Delay is how long the policy waits for an outstanding attempt before
                issuing a duplicate. It has no default: a non-positive Delay makes
                NewHedge return a policy that refuses every call with
                PolicyMisconfigured.

                Zero is the value that matters, because it is what forgetting the field
                yields, and a zero-delay hedge duplicates EVERY call the instant it
                starts — a load amplifier wearing a resilience policy's name, doing the
                exact opposite of its job on the dependency it is supposed to protect.
                It is refused rather than clamped for the same reason as
                RateLimiterConfig.Rate: the useful value is the caller's own latency
                distribution (a p95/p99 they measured), and an SDK-chosen one would
                either hedge constantly or never.
              name: Delay
              type: time.Duration
            - doc: |-
                MaxHedges is how many DUPLICATE attempts a single call may issue beyond
                the first, one per Delay elapsed. It clamps to 1: a hedging policy that
                may issue no duplicate is inert — it would run the primary attempt and
                nothing else while claiming a tail-latency protection it does not
                provide — and "issue at least one duplicate" is exactly the kind of
                obvious floor that ADR 0031 clamps rather than refuses (cf. Burst,
                NewBulkhead's limit).

                There is no ceiling, because none is needed: the budget bounds how many
                duplicates a call may issue and nothing else — no per-call allocation
                grows with it. math.MaxInt therefore means "as many as the Delay and
                MaxInFlight allow".
              name: MaxHedges
              type: int
            - doc: |-
                MaxInFlight bounds how many duplicate attempts this Runner may have
                running at once, across all concurrent calls. It has no default: a
                non-positive MaxInFlight makes NewHedge return a policy that refuses
                every call with PolicyMisconfigured.

                It is the answer to hedging's second hazard: a dependency that has gone
                slow makes every in-flight call hedge at the same moment, so the policy
                adds load precisely when the dependency has least to spare and deepens
                the outage it was meant to hide. The cap counts duplicates only — the
                first attempt of every call always runs, so reaching the cap degrades
                the policy to no-hedging rather than rejecting the call. A caller who
                wants rejection under saturation composes NewBulkhead, whose job that
                is.

                It is refused rather than defaulted because both directions of a guess
                are harmful in this specific knob, which is the rarer case where neither
                clamping nor defaulting has a safe side: a conservative SDK default
                silently stops hedging under exactly the load the caller bought hedging
                for (inert, ADR 0031's own failure mode), and a generous one hands back
                the amplifier. The number is a capacity decision about the caller's
                downstream, and only they hold it.
              name: MaxInFlight
              type: int
            - doc: |-
                Clock is what Delay is measured on. Nil means clock.System.

                It exists so a test drives the race with a ManualClock — advancing past
                Delay to issue the duplicate instead of sleeping through it, and
                asserting that no duplicate is issued a nanosecond earlier. The retry,
                the breaker and the rate limiters already take one; the hedge, the other
                policy that measures a wait, did not.
              name: Clock
              type: clock.Timed
            - doc: |-
                Budget, when set, is asked before each duplicate: a refusal issues
                none, and the call proceeds on the attempts already running, as when
                MaxInFlight is reached. Each call's outcome is recorded in it — a
                success, or a failure on a live context — so a hedge and a retry
                sharing one budget stop amplifying a failing dependency together, as
                gRPC's retry throttling covers hedging. Nil is the hedge without a
                budget.
              name: Budget
              type: coreres.RetryBudget
      - doc: |-
          KeyedRateLimiterConfig parameterises NewKeyedRateLimiter: a token bucket per
          key, at most MaxKeys of them, each forgotten after IdleTimeout without a
          call.

          Four fields have no default and a zero in any of them is refused with
          PolicyMisconfigured on every call (ADR 0031): Rate for the reason
          RateLimiterConfig.Rate gives, and the three below because each of their
          zeros has two readings and one of them silently disarms the limiter.
        name: KeyedRateLimiterConfig
        struct:
          fields:
            - doc: |-
                Key names who a call is charged to — the authenticated user, the
                client's address, a tenant. Calls whose keys differ never share a
                bucket, which is the whole point: one client emptying its bucket is
                refused while the others are not, so a single client cannot lock
                everybody out of a sign-in endpoint the way one shared bucket lets it.

                It is called once per Run, with the Run's context. It is required: a
                limiter with nothing to key on is NewRateLimiter.
              name: Key
              type: func(ctx context.Context) string
            - doc: |-
                Clock reads time for every bucket and for idleness. Nil means
                clock.System.
              name: Clock
              type: clock.Clock
            - doc: |-
                Rate is each key's sustained admission rate, in tokens per second. It
                has no default, exactly as RateLimiterConfig.Rate has none.
              name: Rate
              type: float64
            - doc: Burst is each key's bucket capacity, clamped to at least 1.
              name: Burst
              type: int
            - doc: |-
                MaxKeys bounds how many keys are tracked at once; beyond it the least
                recently used key is forgotten. It is required: its zero reads either
                as "unbounded", which lets a stream of distinct keys grow the process
                without limit, or as "none", which admits nothing. Size it above the
                number of clients active within IdleTimeout — a key pushed out by
                capacity comes back with a FULL bucket, so a flood of new keys buys
                every evicted client a fresh burst.
              name: MaxKeys
              type: int
            - doc: |-
                IdleTimeout is how long a key may go without a call before it is
                forgotten; its next call starts over with a full bucket. It slides: a
                key in use is never forgotten for idleness. It is required: its zero
                reads either as "forget at once", which gives every call a full bucket
                and so limits nothing, or as "never".

                Forgetting a key is observable only when IdleTimeout is shorter than the
                time the bucket takes to refill (Burst / Rate): below that, a key that
                comes back is admitted a burst it would not yet have earned.
              name: IdleTimeout
              type: time.Duration
      - doc: |-
          RateLimiterConfig parameterises NewRateLimiter. Burst is the bucket capacity
          (clamped to >= 1); a nil Clock defaults to System; a zero MaxWait
          rejects at once a call that finds no token.
        name: RateLimiterConfig
        struct:
          fields:
            - doc: |-
                Rate is the sustained admission rate in tokens per second. It has no
                default: a Rate that is not a finite positive number — zero, negative,
                NaN or infinite — makes NewRateLimiter return a policy that refuses
                every call with PolicyMisconfigured. Any rate the SDK picked on
                the caller's behalf would be a guess at their requirement, and a caller
                who silently received one would believe they were limited at the rate
                they intended (ADR 0031). Contrast Burst, which does have an obvious
                floor — admit at least one call — and is therefore clamped.
              name: Rate
              type: float64
            - name: Burst
              type: int
            - name: Clock
              type: clock.Clock
            - doc: |-
                MaxWait is how long a call may wait for its token instead of being
                rejected: a call whose token is due within MaxWait reserves it at
                once — later calls queue behind the reservation — and waits for
                it on Clock. Zero, or less, rejects at once with RateLimited, as
                the limiter always has. A call whose token is due later than
                MaxWait is rejected at once, saying when it would have been due.

                Waiting needs a clock that can wait: with a positive MaxWait, a
                Clock that is not a clock.Timed is refused with
                PolicyMisconfigured, naming Clock. A nil Clock waits on the wall
                clock.
              name: MaxWait
              type: time.Duration
      - doc: |-
          RetryConfig parameterises NewRetry. A non-positive MaxAttempts clamps to 1; a
          Multiplier of 1 or below (or NaN) defaults to 2; a zero MaxDelay means no
          cap; a nil Retryable replays every error; a zero Jitter backs off
          deterministically, and a zero JitterMode is that additive Jitter; a nil
          Clock waits on the wall clock; a nil Delay
          always waits the backoff curve; a nil Budget never refuses a retry; a nil
          OnRetry hears nothing.

          BaseDelay, MaxDelay, Multiplier, Jitter and JitterMode are the five
          fields of BackoffValue, under the same names and with the same meaning:
          NewRetry builds its curve from them, so a loop that retries on its own
          terms and a Retry policy configured alike wait alike — save that a
          decorrelated retry draws each wait from the one it actually waited
          before, which the memoryless BackoffValue.Delay cannot know.
        name: RetryConfig
        struct:
          fields:
            - name: MaxAttempts
              type: int
            - name: BaseDelay
              type: time.Duration
            - name: MaxDelay
              type: time.Duration
            - name: Multiplier
              type: float64
            - doc: |-
                Retryable classifies a non-nil operation error as replayable. It is
                consulted once per failed attempt: false returns that error verbatim —
                no backoff, no further attempt, no RetryExhausted relabel — so a
                deterministic failure (policy refusal, HTTP 400, invalid input) surfaces
                as itself at the first attempt instead of costing the whole budget. A
                nil predicate replays every error, which is the pre-classifier
                behaviour. BreakerConfig accepts the same shape, so one classifier
                serves a nested Retry(Breaker(op)) stack.
              name: Retryable
              type: func(error) bool
            - doc: |-
                Jitter widens each backoff by a random fraction of itself, drawn
                uniformly from [0, Jitter) and ADDED to the computed delay. 0 — the zero
                value — is the deterministic backoff this policy has always had, so an
                existing caller's timing is unchanged. 0.5 is the common choice: it
                desynchronises callers that failed together without letting the average
                wait stop growing monotonically. Values outside [0, 1] clamp into it.

                It exists because deterministic backoff SYNCHRONISES the very callers it
                is meant to spread. N clients that fail against one dependency at the
                same instant retry at the same instant, N times over, and every retry
                round lands as one burst on a dependency that is already struggling.
                Jitter is what turns those bursts back into a distribution.

                It applies AFTER the MaxDelay cap, deliberately: the cap bounds the
                growth, and jitter spreads callers around the bound rather than being
                squeezed flat against it. The consequence is worth stating — WHEN a cap is
                configured, the effective ceiling on one wait becomes MaxDelay * (1 +
                Jitter), not MaxDelay. A zero MaxDelay is no cap at all, so there is no
                ceiling to raise: the backoff grows geometrically and the jitter widens
                whatever it reaches, bounded only by what a time.Duration can represent.

                It is read only under the zero JitterMode.
              name: Jitter
              type: float64
            - doc: |-
                JitterMode is how the backoff is randomised. The zero,
                JitterAdditive, adds Jitter as above. JitterFull waits a uniform
                draw from [0, the capped curve]; JitterDecorrelated draws each wait
                from [BaseDelay, 3 × the previous wait of this call], held at
                MaxDelay. Both are the AWS Builders' Library's variants and ignore
                Jitter; a wait the failure imposed through Delay is not randomised
                and is not the previous wait a decorrelated draw starts from.

                Full jitter spreads callers that failed together the most, at the
                cost of sometimes retrying almost at once; decorrelated jitter
                keeps the waits growing while drifting each caller off the others'
                curve. With a zero MaxDelay a decorrelated wait is bounded only by
                what a time.Duration can represent.
              name: JitterMode
              type: kbackoff.JitterMode
            - doc: |-
                Clock is what the backoff waits on. Nil means clock.System.

                It exists so a test drives the whole retry loop with a ManualClock —
                advancing past each backoff instead of sleeping through it, and asserting
                the exact wait rather than a wall-clock tolerance. The breaker and the
                rate limiter have taken a clock since they shipped; the retry, which is
                the one policy here that actually WAITS, did not.
              name: Clock
              type: clock.Timed
            - doc: |-
                Delay decides the wait before a retry when the failure itself says how
                long to wait. It is called once per retry, with the retry's number —
                1 before the second attempt — and the error of the attempt that just
                failed; a true second result makes its duration the wait, in place of
                the backoff curve and without Jitter. A false one, and a nil Delay,
                wait the curve, which is the behaviour before the field existed.

                The wait it returns is held at MaxDelay when one is set, and a
                negative one is no wait. A server's hint longer than the caller is
                prepared to wait is therefore cut to MaxDelay, never followed past
                it; a caller who would rather give up classifies that error as not
                retryable instead.

                RetryAfter has its shape, so honouring a Retry-After, an OTLP
                collector's throttling or a RateLimited rejection is one line:

                	Delay: func(_ int, err error) (time.Duration, bool) { return resilience.RetryAfter(err) }
              name: Delay
              type: func(attempt int, err error) (time.Duration, bool)
            - doc: |-
                Budget, when set, bounds the retries of every policy sharing it: each
                success and each retryable failure is recorded in it, and before
                every retry it is asked whether one may run. A refusal ends the loop
                with RetryBudgetExceeded wrapping the last error, without waiting. A
                deterministic error and a cancelled context record nothing.

                Nil — the zero value — is the policy without a budget, as it was
                before the field existed. Share one budget per dependency, between
                its retry and its hedge: that is what stops a failing dependency from
                receiving every call times MaxAttempts. A Retry(Hedge(op)) whose two
                policies share a budget records a failed call at both levels, which
                drains and refills it twice as fast and leaves its threshold where it
                was.
              name: Budget
              type: coreres.RetryBudget
            - doc: |-
                OnRetry, when set, is called before each retry's wait, on the
                calling goroutine, with the retry's number — 1 before the second
                attempt —, the error that caused it and the wait about to start. It
                is how a caller counts retries in their own metrics without this
                package depending on one. It is not called for the first attempt,
                nor for a retry the budget refused. It must not block: the retry
                waits for it.
              name: OnRetry
              type: func(attempt int, err error, delay time.Duration)
      - doc: |-
          RetryBudgetConfig parameterises NewRetryBudget, in the terms of gRPC's
          retryThrottling: the bucket's size and what a success puts back. Neither
          has a default; both are refused when unusable (ADR 0031).
        name: RetryBudgetConfig
        struct:
          fields:
            - doc: |-
                MaxTokens is the bucket's size and its starting content. Retries are
                allowed while more than MaxTokens/2 remain, so the budget absorbs
                about MaxTokens/2 more failures than its successes repay before it
                starts refusing. A non-positive MaxTokens is refused; values above
                2^40 are held there.
              name: MaxTokens
              type: int
            - doc: |-
                TokenRatio is what a recorded success puts back, in tokens, a
                failure costing one. It is read to a thousandth, as gRPC reads it: a
                value that is not finite, or that rounds below 0.001, is refused —
                its zero would be a budget that, once drained, never refills.
              name: TokenRatio
              type: float64
      - doc: |-
          TimeoutConfig parameterises NewTimeoutWith: the deadline and the clock it
          is measured on. Duration has no default and is refused when not positive
          (ADR 0031); a nil Clock is the wall clock.
        name: TimeoutConfig
        struct:
          fields:
            - doc: |-
                Duration is how long the Operation may run. A non-positive Duration
                makes NewTimeoutWith return a policy that refuses every call with
                PolicyMisconfigured, exactly as NewTimeout refuses a non-positive d.
              name: Duration
              type: time.Duration
            - doc: |-
                Clock is what Duration is measured on. Nil means clock.System, under
                which the policy is NewTimeout's: a context.WithTimeout whose
                deadline the Operation can read.
              name: Clock
              type: clock.Timed
  - doc: |-
      Package resilience is the public facade for the SDK's reliability policies:
      retry, circuit-breaker, rate-limit, bulkhead, timeout, fallback, and hedging.
      Each constructor returns a [Runner] that guards an [Operation] (a ctx-aware
      func); policies compose by nesting.

      	r := resilience.NewRetry(resilience.RetryConfig{MaxAttempts: 3})
      	b := resilience.NewCircuitBreaker(resilience.BreakerConfig{FailureThreshold: 5, OpenDuration: time.Second})
      	err := r.Run(ctx, func(ctx context.Context) error {
      	    return b.Run(ctx, callDownstream) // Retry(Breaker(op))
      	})

      Rejections surface typed sentinels (RetryExhausted / RetryBudgetExceeded /
      CircuitOpen / RateLimited / BulkheadFull / TimeoutExceeded / FallbackFailed /
      Throttled) matchable via
      errs.HasReason / errs.HasCode.

      # Classifying deterministic failures

      Retry and the circuit-breaker act on transient failures. A deterministic one —
      a policy refusal, an HTTP 400, invalid input — gains nothing from a replay and
      says nothing about a dependency's health, yet by default both policies treat
      every non-nil error as transient: the retry spends its whole budget on it and
      hides it behind RetryExhausted, and the breaker counts it towards tripping.
      Set the Retryable predicate on either config to tell the two apart. It takes
      the same shape in both, so a nested Retry(Breaker(op)) shares one classifier.
      The sentinel is the caller's own — this package exports none to classify
      against, because only the caller knows which of their failures are
      deterministic:

      	var ErrBadRequest = errors.New("bad request") // declared by the caller

      	transient := func(err error) bool { return !errors.Is(err, ErrBadRequest) }
      	r := resilience.NewRetry(resilience.RetryConfig{MaxAttempts: 3, Retryable: transient})
      	b := resilience.NewCircuitBreaker(resilience.BreakerConfig{FailureThreshold: 5, Retryable: transient})

      A rejected error comes back verbatim: the retry stops at that attempt without
      backoff and without the RetryExhausted relabel, and the breaker leaves its
      state machine untouched. A nil predicate keeps the historical behaviour.
      [FallbackConfig] takes the same predicate, where it decides whether a primary
      failure is worth serving a substitute answer for.

      # Falling back

      [NewFallback] runs a second Operation when the first one fails, and reports
      success when it works — that masking is the policy. The port carries no
      result value, so a "fallback VALUE" is a closure assigning the caller's own
      default:

      	var page []byte
      	f := resilience.NewFallback(resilience.FallbackConfig{
      	    Fallback: func(context.Context) error { page = cachedPage; return nil },
      	})
      	err := f.Run(ctx, func(ctx context.Context) error { return fetchLive(ctx, &page) })

      When BOTH halves fail, the result is FallbackFailed carrying both messages as
      fields — never one of the two errors alone. Reporting only the fallback's
      failure would never say what it was covering for, and reporting only the
      primary's would never say that plan B was tried and also broke; either way
      the outcome stops being diagnosable. A nil Fallback is refused (ADR 0031).

      A cancelled context is the one exception, and it is reported as itself: when
      it is already dead after the primary the fallback does not run at all, and
      when it dies while the fallback runs, a failed fallback returns ctx.Err()
      rather than FallbackFailed — neither dependency was at fault. A fallback that
      succeeds despite a late cancellation still returns nil: the work was done.

      # Hedging — for IDEMPOTENT operations only

      [NewHedge] guards tail latency by duplicating a slow call: when an attempt
      has been outstanding for Delay, a second copy starts, and the first to
      succeed wins.

      	h := resilience.NewHedge(resilience.HedgeConfig{
      	    Idempotent:  true,               // asserted, not assumed — see below
      	    Delay:       80 * time.Millisecond,
      	    MaxHedges:   1,
      	    MaxInFlight: 32,                 // duplicates in flight, all calls
      	})

      This is the only policy here that runs an Operation CONCURRENTLY with itself,
      which makes it the only one that can corrupt rather than merely delay: a
      non-idempotent Operation hedged is a double charge, a double insert, a
      duplicate outbound message — and the policy reports one clean success. The
      SDK cannot detect idempotence, so [HedgeConfig].Idempotent makes the claim
      mandatory and in code: its zero value refuses the policy, so hedging is never
      reached by copying a config and dropping a field, and `grep -r 'Idempotent:'`
      enumerates every hedged call path in a codebase.

      The second hazard is load. A dependency that has gone slow makes every
      in-flight call want a duplicate at the same instant, so hedging can deepen
      the outage it was meant to hide. Delay and MaxInFlight are both refused when
      unset for that reason — a zero Delay duplicates every call, and an unbounded
      MaxInFlight lets the duplicates scale with the outage. Reaching MaxInFlight
      degrades the policy to no-hedging (the call proceeds on its first attempt);
      it never turns into a rejection. Hedging also fires on latency ONLY: an
      attempt that fails before Delay elapses ends the call with that error, since
      replaying a failure is [NewRetry]'s job, and composing NewRetry(NewHedge(op))
      is how you get both.

      # Limiting per caller

      [NewRateLimiter] is one bucket for every caller, which is right for a
      dependency and wrong for an endpoint: one client guessing passwords empties
      it and locks everybody out. [NewKeyedRateLimiter] keeps a bucket per key —
      the authenticated user, the client's address — so one client is refused and
      the others are not:

      	limiter := resilience.NewKeyedRateLimiter(resilience.KeyedRateLimiterConfig{
      	    Rate: 1, Burst: 5,                  // per key
      	    Key:  func(ctx context.Context) string { return clientOf(ctx) },
      	    MaxKeys:     10_000,                // keys held at once, least recently used forgotten
      	    IdleTimeout: 10 * time.Minute,      // a key left alone this long starts over full
      	})

      The set of keys is bounded because the keys come from outside: a stream of
      distinct addresses would otherwise grow the process without limit. Both
      bounds are enforced on the calling goroutine — there is no sweeper. Key,
      MaxKeys and IdleTimeout have no defaults and are refused at zero, since each
      zero has a reading that disarms the limiter while every call keeps
      succeeding. A key pushed out by capacity comes back with a full bucket, so
      size MaxKeys above the number of clients active within IdleTimeout.

      # Backing off on your own terms

      [Backoff] is the curve [NewRetry] waits between attempts, published for the
      loops that retry on their own terms — a supervised goroutine restarting
      after a failure, an outbox rescheduling a delivery:

      	wait := resilience.Backoff{BaseDelay: time.Second, MaxDelay: time.Minute}.Delay(failures)

      Delay(n) is BaseDelay × Multiplier^(n−1), held at MaxDelay; a Multiplier of 1
      or below doubles, and the growth stops at the ceiling — or at the longest
      time.Duration — instead of wrapping negative, however large n is.

      # Driving the retry, the hedge and the timeout with a test clock

      [RetryConfig].Clock is the time source the retry backs off on,
      [HedgeConfig].Clock the one the hedge measures its delay on, and
      [TimeoutConfig].Clock the one [NewTimeoutWith] measures its deadline on.
      Leave them nil in production; in a test, hand them a ManualClock from
      pkg/v1/clock and move it past each backoff, the hedge delay or the
      deadline, instead of sleeping through it.

      # Waiting as long as the other side asked

      A collector shedding load, an HTTP server answering 429, a rate limiter
      refusing a call: each knows when the next attempt may succeed, and a retry
      that ignores it either hammers too early or waits too long.
      [RetryConfig].Delay lets the failure decide the wait, and [RetryAfter] reads
      the delay the SDK's own producers attach to their errors:

      	r := resilience.NewRetry(resilience.RetryConfig{
      	    MaxAttempts: 5, BaseDelay: 100 * time.Millisecond, MaxDelay: 30 * time.Second,
      	    Delay: func(_ int, err error) (time.Duration, bool) { return resilience.RetryAfter(err) },
      	})

      A failure that names no delay waits the backoff curve, and the named one is
      held at MaxDelay.

      # A retry budget per dependency

      A retry multiplies traffic exactly when the dependency can least take it:
      during an outage every call becomes MaxAttempts calls, and stacked layers
      multiply again. [NewRetryBudget] is the token bucket of gRPC's retry
      throttling — a failure costs a token, a success returns TokenRatio of one,
      and extra attempts stop once half the tokens are gone. Share one per
      dependency between its retry and its hedge; the first attempt of a call is
      never refused:

      	budget := resilience.NewRetryBudget(resilience.RetryBudgetConfig{MaxTokens: 10, TokenRatio: 0.1})
      	r := resilience.NewRetry(resilience.RetryConfig{
      	    MaxAttempts: 3, BaseDelay: 50 * time.Millisecond, Budget: budget,
      	    OnRetry: func(attempt int, err error, wait time.Duration) { retries.Add(1) },
      	})

      A retry the budget refuses ends the call with [RetryBudgetExceeded]; a
      duplicate it refuses is simply not issued. [RetryConfig].OnRetry hears every
      retry before its wait, synchronously, so retries are counted without this
      package depending on a metrics library.

      # A caller who leaves is not a failing dependency

      A call that ends in context.Canceled once the caller's own context is
      closed is neutral to the circuit breaker — a wave of disconnecting clients
      cannot open it on a healthy dependency — and the timeout reports the
      caller's own context error rather than TimeoutExceeded when the caller's
      context finished first. A context.DeadlineExceeded from the dependency
      stays a failure.

      # A breaker that opens on a rate, and says where it stands

      A breaker counting CONSECUTIVE failures never opens on a dependency that
      fails every other call, nor on one that answers every call a minute late.
      [BreakerConfig].Window opens it on a rate instead — of failures, or of slow
      calls — over a sliding window on the breaker's clock, once enough calls
      were seen for a rate to mean something:

      	b := resilience.NewCircuitBreaker(resilience.BreakerConfig{
      	    Window: &resilience.BreakerWindowValue{
      	        Size: 30 * time.Second, MinCalls: 20, FailureRatio: 0.5,
      	        SlowAfter: 2 * time.Second, SlowRatio: 0.8,
      	    },
      	    OnStateChange: func(from, to resilience.BreakerPhase) { log.Info("breaker", "from", from, "to", to) },
      	})
      	state := b.(resilience.BreakerState)
      	ready := state.State().Phase != resilience.BreakerOpen // a readiness check

      A nil Window is the consecutive-failure breaker, unchanged. The Runner is a
      [BreakerState]: State reports the phase and its counts, Isolate opens it by
      hand until Reset, and [BreakerConfig].OnStateChange hears each change of
      phase in order, outside the breaker's lock. [BreakerConfig].OpenBackoff
      lengthens each opening while the trials keep failing, and
      [BreakerConfig].HalfOpenTrials asks for several successful trials in a row
      before the breaker closes.

      # Waiting a bounded time for a slot or a token

      [NewBulkhead] and [NewRateLimiter] reject at once a call they cannot admit.
      [NewBulkheadWait] lets a bounded queue of calls wait a bounded time for a
      slot, and [RateLimiterConfig].MaxWait lets a call wait for a token due
      soon enough — both on an injected clock, both rejecting as before when
      their wait is zero:

      	b := resilience.NewBulkheadWait(resilience.BulkheadWaitConfig{
      	    Max: 16, Queue: 64, MaxWait: 50 * time.Millisecond,
      	})
      	l := resilience.NewRateLimiter(resilience.RateLimiterConfig{
      	    Rate: 100, Burst: 10, MaxWait: 20 * time.Millisecond,
      	})

      # How the backoff is randomised

      [RetryConfig].JitterMode, like [Backoff].JitterMode, chooses between the
      AWS Builders' Library's three jitters: [JitterAdditive], the zero and the
      Jitter fraction added to the curve; [JitterFull], a uniform draw below the
      curve; and [JitterDecorrelated], each wait drawn from the one before.

      # Throttling on the client side

      [NewAdaptiveThrottle] is the adaptive throttling of Google's SRE book: it
      counts, over a window, the calls it was asked to make and the calls the
      dependency accepted, and refuses a new call locally — with [Throttled],
      without sending it — with probability max(0, (requests − K × accepts) /
      (requests + 1)). A dependency that refuses most of its traffic is no
      longer sent most of it, and the refusals fade as it accepts again:

      	t := resilience.NewAdaptiveThrottle(resilience.AdaptiveThrottleConfig{
      	    Rejected: isOverload, // the caller's own: a 429, a 503, a RESOURCE_EXHAUSTED
      	})
    facade:
      - alias:
          - doc: Operation is the public alias for the ctx-aware unit of guarded work.
            name: Operation
            target: coreres.Operation
      - alias:
          - doc: Runner is the public alias for the composable policy-executor contract.
            name: Runner
            target: coreres.Runner
      - alias:
          - doc: RetryConfig is the public alias for the retry policy configuration.
            name: RetryConfig
            target: svcres.RetryConfig
      - alias:
          - doc: BreakerConfig is the public alias for the circuit-breaker configuration.
            name: BreakerConfig
            target: svcres.BreakerConfig
      - alias:
          - doc: |-
              BreakerWindowValue is the public alias for a circuit breaker's sliding
              window: the rate of failures, or of slow calls, that opens it.
            name: BreakerWindowValue
            target: svcres.BreakerWindowValue
      - alias:
          - doc: |-
              BreakerState is the public alias for what a circuit breaker says about
              itself and what an operator may force on it — State, Isolate, Reset.
              The Runner NewCircuitBreaker returns implements it.
            name: BreakerState
            target: coreres.BreakerState
      - alias:
          - doc: BreakerStateValue is the public alias for a circuit breaker's reported state.
            name: BreakerStateValue
            target: coreres.BreakerStateValue
      - alias:
          - doc: BreakerPhase is the public alias for where a circuit breaker stands.
            name: BreakerPhase
            target: coreres.BreakerPhase
      - alias:
          - doc: RateLimiterConfig is the public alias for the rate-limiter configuration.
            name: RateLimiterConfig
            target: svcres.RateLimiterConfig
      - alias:
          - doc: FallbackConfig is the public alias for the fallback policy configuration.
            name: FallbackConfig
            target: svcres.FallbackConfig
      - alias:
          - doc: HedgeConfig is the public alias for the hedging policy configuration.
            name: HedgeConfig
            target: svcres.HedgeConfig
      - alias:
          - doc: |-
              KeyedRateLimiterConfig is the public alias for the keyed rate-limiter
              configuration: a token bucket per key, bounded in number and forgotten when
              idle.
            name: KeyedRateLimiterConfig
            target: svcres.KeyedRateLimiterConfig
      - alias:
          - doc: |-
              RetryBudget is the public alias for the retry-budget port: what a retry
              and a hedge sharing it ask before an extra attempt, and record after
              one.
            name: RetryBudget
            target: coreres.RetryBudget
      - alias:
          - doc: RetryBudgetConfig is the public alias for the token-bucket retry budget's configuration.
            name: RetryBudgetConfig
            target: svcres.RetryBudgetConfig
      - alias:
          - doc: |-
              TimeoutConfig is the public alias for the timeout policy configuration
              NewTimeoutWith takes: the deadline and the clock it is measured on.
            name: TimeoutConfig
            target: svcres.TimeoutConfig
      - alias:
          - doc: |-
              Backoff is the public alias for the exponential backoff curve NewRetry waits
              between attempts, for a loop that backs off on its own terms.
            name: Backoff
            target: kbackoff.Value
      - alias:
          - doc: |-
              JitterMode is the public alias for how a Backoff, and a retry, randomise
              their waits: additive (the zero), full, or decorrelated.
            name: JitterMode
            target: kbackoff.JitterMode
      - alias:
          - doc: |-
              BulkheadWaitConfig is the public alias for the configuration of the
              bulkhead that queues: Max, Queue, MaxWait, Clock.
            name: BulkheadWaitConfig
            target: svcres.BulkheadWaitConfig
      - alias:
          - doc: |-
              AdaptiveThrottleConfig is the public alias for the adaptive throttle's
              configuration: K, Window, Buckets, Rejected, Clock, Random.
            name: AdaptiveThrottleConfig
            target: svcres.AdaptiveThrottleConfig
      - const:
          - doc: |-
              BreakerClosed is a breaker admitting every call. The zero BreakerPhase
              is not it: a phase nobody set reads "unknown".
            name: BreakerClosed
            reexport: coreres.BreakerClosed
            type: BreakerPhase
            typed: true
            value: "1"
          - doc: BreakerOpen is a breaker rejecting every call fast with CircuitOpen.
            name: BreakerOpen
            reexport: coreres.BreakerOpen
            type: BreakerPhase
            typed: true
            value: "2"
          - doc: BreakerHalfOpen is a breaker admitting one trial call at a time.
            name: BreakerHalfOpen
            reexport: coreres.BreakerHalfOpen
            type: BreakerPhase
            typed: true
            value: "3"
          - doc: |-
              JitterAdditive adds a random fraction of each wait, drawn from
              [0, Jitter). It is the zero JitterMode.
            name: JitterAdditive
            reexport: kbackoff.JitterAdditive
            type: JitterMode
            typed: true
            value: "0"
          - doc: JitterFull draws each wait uniformly from [0, the capped curve].
            name: JitterFull
            reexport: kbackoff.JitterFull
            type: JitterMode
            typed: true
            value: "1"
          - doc: |-
              JitterDecorrelated draws each wait from [BaseDelay, 3 × the previous
              wait], held at MaxDelay.
            name: JitterDecorrelated
            reexport: kbackoff.JitterDecorrelated
            type: JitterMode
            typed: true
            value: "2"
      - var:
          - doc: RetryExhausted is returned when the retry budget is spent.
            name: RetryExhausted
            reexport: coreres.RetryExhausted
            type: "*errs.Error"
          - doc: |-
              RetryBudgetExceeded is returned when the shared retry budget refused the
              next attempt; the last attempt's error is its cause.
            name: RetryBudgetExceeded
            reexport: coreres.RetryBudgetExceeded
            type: "*errs.Error"
          - doc: |-
              CircuitOpen is returned when the breaker rejects a call fast. It carries
              HTTP 503 (errs.HTTPStatusOf): the dependency cannot take the call now.
            name: CircuitOpen
            reexport: coreres.CircuitOpen
            type: "*errs.Error"
          - doc: |-
              RateLimited is returned when no rate-limit token is available. It
              carries HTTP 429: the client should slow down. A rejection by
              NewRateLimiter or NewKeyedRateLimiter also says by how much:
              RetryAfter reads the time the bucket needs to earn its next token.
            name: RateLimited
            reexport: coreres.RateLimited
            type: "*errs.Error"
          - doc: |-
              BulkheadFull is returned when every concurrency slot is occupied — and,
              for NewBulkheadWait, when the queue is full or no slot freed within
              MaxWait. It carries HTTP 503.
            name: BulkheadFull
            reexport: coreres.BulkheadFull
            type: "*errs.Error"
          - doc: |-
              TimeoutExceeded is returned when an operation outruns its deadline. It
              carries HTTP 504: the call was made and its answer did not arrive in
              time.
            name: TimeoutExceeded
            reexport: coreres.TimeoutExceeded
            type: "*errs.Error"
          - doc: |-
              FallbackFailed is returned when the primary operation AND its fallback
              both failed. Both messages travel as the "primary" and "fallback"
              fields, so neither half of a double failure is lost and neither can
              hijack the policy's own code.
            name: FallbackFailed
            reexport: coreres.FallbackFailed
            type: "*errs.Error"
          - doc: |-
              Throttled is returned when NewAdaptiveThrottle refused the call on the
              client side, without sending it. It carries HTTP 503.
            name: Throttled
            reexport: coreres.Throttled
            type: "*errs.Error"
          - doc: |-
              PolicyMisconfigured is returned by every call to a policy that was built
              with a configuration it cannot honour — a non-positive RateLimiterConfig
              .Rate, a non-positive NewTimeout duration, a nil FallbackConfig.Fallback,
              an unasserted HedgeConfig.Idempotent, a non-positive HedgeConfig.Delay or
              MaxInFlight, a KeyedRateLimiterConfig without a Key, a MaxKeys or an
              IdleTimeout, a retry budget built with an unusable MaxTokens or
              TokenRatio, a BreakerConfig.Window or OpenBackoff with a field out of
              range, a RateLimiterConfig.Clock that cannot wait for a positive
              MaxWait, an AdaptiveThrottleConfig field out of range. The operation
              is not run. Unlike the sentinels above it is
              permanent, not transient: the fix is at the construction site, never a
              retry (ADR 0031).
            name: PolicyMisconfigured
            reexport: coreres.PolicyMisconfigured
            type: "*errs.Error"
      - func:
          doc: |-
            NewRetry returns a retry-with-backoff Runner. An error rejected by
            cfg.Retryable ends the loop at once and is returned verbatim.
          forward: svcres.NewRetry
          in:
            - name: cfg
              type: RetryConfig
          name: NewRetry
          out:
            - type: Runner
      - func:
          doc: |-
            NewCircuitBreaker returns a circuit-breaker Runner. An error rejected by
            cfg.Retryable is returned verbatim and left out of the state machine.
            HalfOpen runs one trial at a time, and the outcome of a call admitted
            before the breaker last opened is ignored. A context.Canceled returned
            once the caller's context is closed counts neither way: the caller
            left, not the dependency.

            A nil cfg.Window opens on FailureThreshold consecutive failures; a
            Window opens on a rate of failures or of slow calls over a sliding
            time window. The Runner returned is a BreakerState — State, Isolate,
            Reset — unless cfg was refused with PolicyMisconfigured.
          forward: svcres.NewCircuitBreaker
          in:
            - name: cfg
              type: BreakerConfig
          name: NewCircuitBreaker
          out:
            - type: Runner
      - func:
          doc: |-
            NewRateLimiter returns a token-bucket rate-limiter Runner. A non-positive
            cfg.Rate is refused: every call returns PolicyMisconfigured without running
            the operation, because any rate chosen for the caller would be a guess.
            A positive cfg.MaxWait lets a call wait for a token due within it
            instead of being rejected.
          forward: svcres.NewRateLimiter
          in:
            - name: cfg
              type: RateLimiterConfig
          name: NewRateLimiter
          out:
            - type: Runner
      - func:
          doc: |-
            NewKeyedRateLimiter returns a Runner holding one token bucket per key — the
            key cfg.Key names for each call's context — so a caller who empties its
            bucket is refused while every other caller is not. At most cfg.MaxKeys keys
            are held, the least recently used forgotten first, and a key unused for
            cfg.IdleTimeout is forgotten too; a forgotten key starts over with a full
            bucket. A non-finite or non-positive cfg.Rate, a nil cfg.Key and a
            non-positive cfg.MaxKeys or cfg.IdleTimeout are each refused: every call
            returns PolicyMisconfigured, naming the field.
          forward: svcres.NewKeyedRateLimiter
          in:
            - name: cfg
              type: KeyedRateLimiterConfig
          name: NewKeyedRateLimiter
          out:
            - type: Runner
      - func:
          doc: NewBulkhead returns a bounded-concurrency Runner (reject mode).
          forward: svcres.NewBulkhead
          in:
            - name: maxConcurrent
              type: int
          name: NewBulkhead
          out:
            - type: Runner
      - func:
          doc: |-
            NewBulkheadWait returns a bounded-concurrency Runner whose excess calls
            wait in a bounded queue, each at most cfg.MaxWait on cfg.Clock, for a
            slot; a full queue or a wait run out is BulkheadFull. Its zero
            configuration is NewBulkhead(1).
          forward: svcres.NewBulkheadWait
          in:
            - name: cfg
              type: BulkheadWaitConfig
          name: NewBulkheadWait
          out:
            - type: Runner
      - func:
          doc: |-
            NewAdaptiveThrottle returns a Runner that refuses calls on the client
            side with Throttled, with probability max(0, (requests − K × accepts) /
            (requests + 1)) over a sliding window — the adaptive throttling of
            Google's SRE book. A field out of range is refused with
            PolicyMisconfigured.
          forward: svcres.NewAdaptiveThrottle
          in:
            - name: cfg
              type: AdaptiveThrottleConfig
          name: NewAdaptiveThrottle
          out:
            - type: Runner
      - func:
          doc: |-
            NewTimeout returns a deadline-enforcing Runner. A non-positive d is refused:
            every call returns PolicyMisconfigured without running the operation, since
            any deadline chosen for the caller would be a guess (ADR 0031). Only its own
            deadline is reported as TimeoutExceeded: when the caller's context is
            already finished, the call returns that context's error instead.
          forward: svcres.NewTimeout
          in:
            - name: d
              type: time.Duration
          name: NewTimeout
          out:
            - type: Runner
      - func:
          doc: |-
            NewTimeoutWith is NewTimeout with the deadline measured on cfg.Clock, so a
            test expires it by advancing a ManualClock instead of sleeping. A nil
            cfg.Clock is NewTimeout(cfg.Duration) exactly; a non-positive
            cfg.Duration is refused.
          forward: svcres.NewTimeoutWith
          in:
            - name: cfg
              type: TimeoutConfig
          name: NewTimeoutWith
          out:
            - type: Runner
      - func:
          doc: |-
            RetryAfter reports the delay err says to wait before the next attempt — the
            retry_after_seconds field an OTLP exporter, the guarded HTTP client on a 429
            or 503, and RateLimited set — and whether it says one. Its shape is
            RetryConfig.Delay's.
          forward: svcres.RetryAfter
          in:
            - name: err
              type: error
          name: RetryAfter
          out:
            - type: time.Duration
            - type: bool
      - func:
          doc: |-
            NewRetryBudget returns the token-bucket RetryBudget of gRPC's retry
            throttling, to share between the retry and the hedge of one dependency:
            full at cfg.MaxTokens, a failure costs one token, a success returns
            cfg.TokenRatio, and extra attempts are allowed while more than half
            remain. A non-positive cfg.MaxTokens or an unusable cfg.TokenRatio is
            refused: the policies given it return PolicyMisconfigured.
          forward: svcres.NewRetryBudget
          in:
            - name: cfg
              type: RetryBudgetConfig
          name: NewRetryBudget
          out:
            - type: RetryBudget
      - func:
          doc: |-
            NewFallback returns a Runner that runs cfg.Fallback when the guarded
            Operation fails, reporting success when it works. When both fail the result
            is FallbackFailed, carrying both messages — unless the context was cancelled,
            which is reported as ctx.Err(). A nil cfg.Fallback is refused.
          forward: svcres.NewFallback
          in:
            - name: cfg
              type: FallbackConfig
          name: NewFallback
          out:
            - type: Runner
      - func:
          doc: |-
            NewHedge returns a tail-latency Runner that DUPLICATES an Operation still
            outstanding after cfg.Delay and takes the first success. Correct only on an
            idempotent Operation, which cfg.Idempotent makes the caller assert: that
            field, cfg.Delay and cfg.MaxInFlight are all refused when unset (ADR 0031).

            Each copy runs on a goroutine of its own, so a panic in one is recovered
            there and re-raised by Run on the caller's goroutine with the ORIGINAL value
            — a recover comparing against http.ErrAbortHandler still matches — but with
            the stack of the re-raise site; the copy's own stack is the price of not
            ending the process. A losing copy's late panic is recovered and dropped.
          forward: svcres.NewHedge
          in:
            - name: cfg
              type: HedgeConfig
          name: NewHedge
          out:
            - type: Runner
    imports:
      coreres: github.com/kitsunium/sdk/internal/core/app/resilience
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
      svcres: github.com/kitsunium/sdk/internal/service/app/resilience
    path: github.com/kitsunium/sdk/pkg/v1/app/resilience
