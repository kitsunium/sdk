apiVersion: kit.kitsunium/design/v2
domain: app/config
packages:
  - codes:
      - const:
          - doc: |-
              CodeConfigSourceFailed identifies a Source.Load that failed to read its backing
              store (missing file, unreadable env, etc.).
            name: CodeConfigSourceFailed
            note: "range: 0.2.10.0 - 0.2.10.255"
            value: "0x00_02_0A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigDecodeFailed identifies a merged-map → target-struct decode failure (type
              mismatch, malformed value).
            name: CodeConfigDecodeFailed
            value: "0x00_02_0A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigValidationFailed identifies a decoded config whose Validate() returned an
              error (the wrap cause is the validation error).
            name: CodeConfigValidationFailed
            value: "0x00_02_0A_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigWatchFailed identifies a Watcher that could not observe its source (stat
              failure, unsupported target).
            name: CodeConfigWatchFailed
            value: "0x00_02_0A_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigSchemaInvalid identifies a Schema refused AT CONSTRUCTION: a
              malformed key, a key that names nothing in the target type, a duplicate key,
              a default value that cannot travel through the loader's JSON round trip, or a
              default that violates the very constraint the schema declares for its own key.
              It is never a load outcome — no source was ever read.
            name: CodeConfigSchemaInvalid
            value: "0x00_02_0A_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigKeyMissing identifies a load in which the schema declared a key
              REQUIRED and no source supplied it. It is a load outcome, not a construction
              one: the schema was well-formed, the deployment was not. Every missing key is
              named in one error — an operator who restarts a service to discover the next
              one is the failure a report prevents.
            name: CodeConfigKeyMissing
            value: "0x00_02_0A_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeConfigUnknownKey identifies a load in which a source supplied a key the
              target type cannot address. The default is to REFUSE it, because the usual
              cause is a typo in an environment variable and the usual symptom of ignoring
              it is a production incident in which a setting silently never applied.
            name: CodeConfigUnknownKey
            value: "0x00_02_0A_07"
        type: errs.Code
    constants:
      - name: LayerDefault
        type: string
        value: "\"default\""
      - name: LayerFile
        type: string
        value: "\"file\""
      - name: LayerEnv
        type: string
        value: "\"env\""
      - name: LayerSource
        type: string
        value: "\"source\""
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/config
    ports:
      - doc: |-
          Describer is the optional sibling (ADR 0039) a [Source] implements to say
          where its values come from. [Source] is frozen at one method, so the loader
          discovers this capability by type assertion; a Source that does not
          implement it is reported as [LayerSource] with its position.

          Implementations MUST be safe for concurrent use and MUST NOT return a value
          in detail — a variable NAME, a file PATH, an endpoint, never what it holds.
        methods:
          - doc: |-
              Describe reports the kind of layer this source contributes and, for one
              dotted key it supplied in its last Load, the detail an operator acts on.
            in:
              - name: key
                type: string
            name: Describe
            out:
              - name: layer
              - name: detail
                type: string
        name: Describer
      - doc: |-
          Source yields a configuration layer as a flat map (later sources override
          earlier ones in a Load). Implementations MUST be safe for concurrent Load.
        methods:
          - doc: Load reads the source and returns its key→value map (nil map = empty layer).
            name: Load
            out:
              - name: values
                type: map[string]any
              - name: err
                type: error
        name: Source
      - doc: |-
          Validator is implemented by a decoded config struct that wants to self-check
          after Load. A non-nil return aborts the Load with CONFIG_VALIDATION_FAILED.
        methods:
          - doc: Validate reports whether the decoded configuration is internally consistent.
            name: Validate
            out:
              - type: error
        name: Validator
      - doc: |-
          Watcher observes a Source for change and invokes onChange (cross-OS poll in
          the default implementation). Watch blocks until ctx is cancelled.
        methods:
          - doc: Watch calls onChange whenever the underlying source changes, until ctx ends.
            in:
              - name: ctx
                type: context.Context
              - name: onChange
                type: func()
            name: Watch
            out:
              - type: error
        name: Watcher
    sentinels:
      - var:
          - code: CodeConfigSourceFailed
            doc: ConfigSourceFailed wraps a Source.Load read failure.
            name: ConfigSourceFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: a Source.Load failed to read its backing store"
            public: A configuration source could not be read
            reason: CONFIG_SOURCE_FAILED
          - code: CodeConfigDecodeFailed
            doc: ConfigDecodeFailed wraps a merged-map → struct decode failure.
            name: ConfigDecodeFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: merged map did not decode into the target struct"
            public: The configuration could not be decoded into the target
            reason: CONFIG_DECODE_FAILED
          - code: CodeConfigValidationFailed
            doc: ConfigValidationFailed wraps a decoded config's Validate() error.
            name: ConfigValidationFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: the decoded config's Validate() returned an error"
            public: The configuration failed validation
            reason: CONFIG_VALIDATION_FAILED
          - code: CodeConfigWatchFailed
            doc: ConfigWatchFailed wraps a Watcher observation failure.
            name: ConfigWatchFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: the poll watcher failed to stat its target"
            public: The configuration watcher could not observe its source
            reason: CONFIG_WATCH_FAILED
          - code: CodeConfigSchemaInvalid
            doc: |-
              ConfigSchemaInvalid is returned by the Schema CONSTRUCTOR, never by a
              load: the schema itself contradicts the type it declares, or contradicts
              itself. Its fields name the key and the clause that failed and NEVER the
              value, because a default may be a credential the author wrote in source.

              It is the ADR 0031 half that must not be confused with the other: a
              configuration with NO schema is legitimate and loads, while a schema that
              declares a default outside the bounds it also declares would silently
              produce an invalid configuration whenever the operator omitted the key —
              a failure that appears only on the deployment where nobody set it.
            name: ConfigSchemaInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: a Schema was refused at construction; the fields name the key and the clause that failed"
            public: The configuration schema cannot be built as declared
            reason: CONFIG_SCHEMA_INVALID
          - code: CodeConfigKeyMissing
            doc: |-
              ConfigKeyMissing is returned by a LOAD when the schema declares a key
              required and no source supplied it. Its fields name every missing key —
              all of them, in one error — and the count. It never names a value,
              because a missing key has none and a neighbouring one may be a secret.

              It is distinct from the validation domain's `required` rule on purpose,
              and the difference is the one this domain exists to keep: this sentinel
              answers "was the KEY supplied?", decided on the merged map while the key
              is still a key; validation's `required` answers "is the VALUE non-zero?",
              decided after the decode, where an absent key and an explicit zero are
              the same bytes. `port = 0` satisfies this one and fails that one.
            name: ConfigKeyMissing
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: a schema declared keys required and no source supplied them"
            public: The configuration is missing required keys
            reason: CONFIG_KEY_MISSING
          - code: CodeConfigUnknownKey
            doc: |-
              ConfigUnknownKey is returned by a LOAD when a source supplied a key the
              target type cannot address, and the schema did not opt out of the check.

              Refusing is the default because the alternative has a name: a typo in an
              environment variable that passes silently. `APP_PORTT=9090` decodes into
              nothing, the process starts on the old port, and the only evidence is the
              absence of an effect. A schema is the statement "these are the keys I
              read", so a key outside it is either a mistake or a deliberate one the
              author opts into by name.
            name: ConfigUnknownKey
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/config: a source supplied keys no field of the target addresses"
            public: The configuration carries keys the target does not define
            reason: CONFIG_UNKNOWN_KEY
    types:
      - name: OriginValue
        struct:
          fields:
            - name: Key
              type: string
            - name: Layer
              type: string
            - name: Detail
              type: string
            - name: Secret
              type: bool
      - name: DeclaredValue
        struct:
          fields:
            - name: Key
              type: string
            - name: Value
              type: any
  - functions:
      - in:
          - name: prefix
            type: string
        name: EnvSource
        out:
          - type: coreconfig.Source
      - in:
          - name: format
            type: codec.Format
          - name: path
            type: string
        name: FileSource
        out:
          - type: coreconfig.Source
      - in:
          - name: fsys
            type: fs.FS
          - name: format
            type: codec.Format
          - name: path
            type: string
        name: FSSource
        out:
          - type: coreconfig.Source
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: coreconfig.Source
        name: Load
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*SchemaValue[T]"
          - name: sources
            type: coreconfig.Source
        name: LoadSchema
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: coreconfig.Source
        name: LoadWithOrigins
        out:
          - name: origins
            type: "[]coreconfig.OriginValue"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*SchemaValue[T]"
          - name: sources
            type: coreconfig.Source
        name: LoadSchemaWithOrigins
        out:
          - name: origins
            type: "[]coreconfig.OriginValue"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: path
            type: string
          - name: interval
            type: time.Duration
        name: PollWatcher
        out:
          - type: coreconfig.Watcher
      - in:
          - name: spec
            type: SchemaSpec[T]
        name: NewSchemaValue
        out:
          - name: schema
            type: "*SchemaValue[T]"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      coreconfig: github.com/kitsunium/sdk/internal/core/app/config
      corevalidation: github.com/kitsunium/sdk/internal/core/app/validation
      fs: io/fs
    path: github.com/kitsunium/sdk/internal/service/app/config
    types:
      - methods:
          - name: Source
            out:
              - type: coreconfig.Source
            recv: pointer
          - in:
              - name: value
                type: T
            name: Check
            out:
              - type: corevalidation.ReportValue
            recv: pointer
        name: SchemaValue
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - name: SchemaSpec
        struct:
          fields:
            - name: Required
              type: "[]string"
            - name: Defaults
              type: "[]coreconfig.DeclaredValue"
            - name: AllowUnknownKeys
              type: bool
            - name: Rule
              type: corevalidation.Constraint[T]
        typeParams:
          - constraint: any
            name: T
  - facade:
      - const:
          - doc: LayerDefault is a schema default.
            name: LayerDefault
            reexport: coreconfig.LayerDefault
            type: string
            typed: true
            value: "\"default\""
          - doc: LayerFile is a FileSource; the detail is the path.
            name: LayerFile
            reexport: coreconfig.LayerFile
            type: string
            typed: true
            value: "\"file\""
          - doc: LayerEnv is an EnvSource; the detail is the variable.
            name: LayerEnv
            reexport: coreconfig.LayerEnv
            type: string
            typed: true
            value: "\"env\""
          - doc: |-
              LayerSource is a Source that does not describe itself; the detail is
              its position in the sources given to the load, counting from 0.
            name: LayerSource
            reexport: coreconfig.LayerSource
            type: string
            typed: true
            value: "\"source\""
        doc: The layer names a traced load reports.
      - alias:
          - doc: Source is the public alias for a configuration layer producer.
            name: Source
            target: coreconfig.Source
      - alias:
          - doc: Validator is the public alias for a decoded config's self-check.
            name: Validator
            target: coreconfig.Validator
      - alias:
          - doc: Watcher is the public alias for a change observer.
            name: Watcher
            target: coreconfig.Watcher
      - alias:
          - doc: |-
              Default is the public alias for one declared key and the typed value it
              takes when NO source supplied it. A defaulted key is never also required.
            name: Default
            target: coreconfig.DeclaredValue
      - alias:
          - doc: |-
              Origin is the public alias for one key's provenance in a traced load: the
              layer that supplied its final value, the detail an operator acts on, and
              whether the key holds a secret. It never carries the value.
            name: Origin
            target: coreconfig.OriginValue
      - alias:
          - doc: |-
              Describer is the public alias for the optional sibling of [Source] through
              which a source names its layer and, per key, the detail behind it.
              EnvSource, FileSource, FSSource and Schema.Source implement it.
            name: Describer
            target: coreconfig.Describer
      - alias:
          - doc: |-
              Schema is the public alias for a compiled configuration shape: the default
              layer it contributes, the keys it requires, the vocabulary it accepts, and
              the constraints it enforces. Build one with [NewSchema].
            name: Schema
            target: svcconfig.SchemaValue[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: |-
              SchemaSpec is the public alias for a schema declaration. Its zero value is a
              legitimate schema: nothing required, nothing defaulted, no extra rule — but
              the `validate` tags of T still apply and an unknown key is still refused.
            name: SchemaSpec
            target: svcconfig.SchemaSpec[T]
            typeParams:
              - constraint: any
                name: T
      - var:
          - doc: SourceFailed is returned when a source cannot be read.
            name: SourceFailed
            reexport: coreconfig.ConfigSourceFailed
            type: "*errs.Error"
          - doc: DecodeFailed is returned when the merged config cannot decode into the target.
            name: DecodeFailed
            reexport: coreconfig.ConfigDecodeFailed
            type: "*errs.Error"
          - doc: ValidationFailed is returned when the decoded config fails Validate().
            name: ValidationFailed
            reexport: coreconfig.ConfigValidationFailed
            type: "*errs.Error"
          - doc: WatchFailed is returned when the watcher cannot observe its source.
            name: WatchFailed
            reexport: coreconfig.ConfigWatchFailed
            type: "*errs.Error"
          - doc: |-
              SchemaInvalid is returned by NewSchema when the schema contradicts the
              type it describes, or itself. It is never a load outcome.
            name: SchemaInvalid
            reexport: coreconfig.ConfigSchemaInvalid
            type: "*errs.Error"
          - doc: |-
              KeyMissing is returned by LoadSchema when the schema requires keys no
              source supplied. Its fields name every one of them.
            name: KeyMissing
            reexport: coreconfig.ConfigKeyMissing
            type: "*errs.Error"
          - doc: |-
              UnknownKey is returned by LoadSchema when a source supplied keys the
              target type cannot address and the schema did not opt out.
            name: UnknownKey
            reexport: coreconfig.ConfigUnknownKey
            type: "*errs.Error"
      - func:
          doc: |-
            Load merges sources into target (later overrides earlier), decodes, and
            validates (when target implements Validator).

            It declares no schema: nothing is required, nothing is defaulted, and a key
            the target cannot address is dropped exactly as encoding/json drops it. Use
            [LoadSchema] to have those caught.
          forward: svcconfig.Load
          in:
            - name: target
              type: "*T"
            - name: sources
              type: Source
          name: Load
          out:
            - type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            NewSchema compiles spec into a [Schema], refusing at construction every
            declaration that could not work: a malformed key, a key naming no field of T,
            a duplicate, a key declared both required and with a default, a default the
            decode cannot carry, and — the one that matters — a default that violates the
            constraint the schema itself declares for that key. A tag the validation
            engine refuses surfaces THAT engine's error, whose fields already name the
            field, the rule and the clause.
          forward: svcconfig.NewSchemaValue[T]
          in:
            - name: spec
              type: SchemaSpec[T]
          name: NewSchema
          out:
            - name: schema
              type: "*Schema[T]"
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: T
      - func:
          doc: |-
            LoadSchema is [Load] with a compiled [Schema]: the schema's typed defaults are
            merged UNDER every source, its required keys and its vocabulary are checked
            against the merged map before anything is decoded, and its constraints run
            over the decoded result before the target's own Validate — which is still
            called, never replaced.

            The layer order is default < file < env < any later source. A missing
            required key and an unaddressable key are reported together, each naming all
            of its keys, so one restart tells the whole truth. A nil schema is refused by
            name rather than silently loading nothing.
          forward: svcconfig.LoadSchema
          in:
            - name: target
              type: "*T"
            - name: schema
              type: "*Schema[T]"
            - name: sources
              type: Source
          name: LoadSchema
          out:
            - type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            LoadWithOrigins is [Load], and it also returns one [Origin] per leaf key of
            T, sorted by key: which layer supplied the key's final value and the detail
            behind it — never the value itself. On a failure no origin is returned.
          forward: svcconfig.LoadWithOrigins
          in:
            - name: target
              type: "*T"
            - name: sources
              type: Source
          name: LoadWithOrigins
          out:
            - name: origins
              type: "[]Origin"
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            LoadSchemaWithOrigins is [LoadSchema] with the origins [LoadWithOrigins]
            returns; a key the schema defaulted is reported as [LayerDefault].
          forward: svcconfig.LoadSchemaWithOrigins
          in:
            - name: target
              type: "*T"
            - name: schema
              type: "*Schema[T]"
            - name: sources
              type: Source
          name: LoadSchemaWithOrigins
          out:
            - name: origins
              type: "[]Origin"
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            EnvSource returns a Source reading "PREFIX_KEY" env vars (empty prefix = all).

            The key a field must match is the variable name with the prefix removed and
            lower-cased, underscores kept: under EnvSource("APP"), the variable
            APP_SDM_SERVER_NAME feeds a field tagged `json:"sdm_server_name"`. The
            separating underscore belongs to the Source, and a trailing one on prefix is
            absorbed, so EnvSource("APP") and EnvSource("APP_") name the same namespace.

            A value is coerced to a typed Go value only when the WHOLE value is one
            complete JSON document — "8080" becomes an int64, "true" a bool. Anything
            else keeps its exact string, so identifiers that merely start like numbers
            ("0A0A01", "1500ms", "10.45.0.0/16", "2026-09-03") arrive intact.

            An EMPTY prefix reads the whole process environment, so pairing it with a
            schema that refuses unknown keys refuses PATH, HOME and everything else the
            shell exported. That is a fact about the source, not about the schema: give
            the source a prefix, or set [SchemaSpec].AllowUnknownKeys.
          forward: svcconfig.EnvSource
          in:
            - name: prefix
              type: string
          name: EnvSource
          out:
            - type: Source
      - func:
          doc: PollWatcher returns a cross-OS Watcher that polls path every interval.
          forward: svcconfig.PollWatcher
          in:
            - name: path
              type: string
            - name: interval
              type: time.Duration
          name: PollWatcher
          out:
            - type: Watcher
    functions:
      - in:
          - name: format
          - name: path
            type: string
        name: FileSource
        out:
          - type: Source
      - in:
          - name: fsys
            type: fs.FS
          - name: format
          - name: path
            type: string
        name: FSSource
        out:
          - type: Source
    imports:
      coreconfig: github.com/kitsunium/sdk/internal/core/app/config
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      svcconfig: github.com/kitsunium/sdk/internal/service/app/config
    path: github.com/kitsunium/sdk/pkg/v1/app/config
