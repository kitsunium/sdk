      codec: github.com/kitsunium/sdk/internal/core/data/codec
      coreconfig: github.com/kitsunium/sdk/internal/core/app/config
      corevalidation: github.com/kitsunium/sdk/internal/core/app/validation
      fs: io/fs
    path: github.com/kitsunium/sdk/internal/service/app/config
    types:
      - methods:
          - name: Source
            out:
              - type: coreconfig.Source
            recv: pointer
          - in:
              - name: value
                type: T
            name: Check
            out:
              - type: corevalidation.ReportValue
            recv: pointer
        name: SchemaValue
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - name: SchemaSpec
        struct:
          fields:
            - name: Required
              type: "[]string"
            - name: Defaults
              type: "[]coreconfig.DeclaredValue"
            - name: AllowUnknownKeys
              type: bool
            - name: Rule
              type: corevalidation.Constraint[T]
        typeParams:
          - constraint: any
            name: T
  - aliases:
      - name: Source
        target: coreconfig.Source
      - name: Validator
        target: coreconfig.Validator
      - name: Watcher
        target: coreconfig.Watcher
      - name: Default
        target: coreconfig.DeclaredValue
      - name: Origin
        target: coreconfig.OriginValue
      - name: Describer
        target: coreconfig.Describer
      - name: Schema
        target: svcconfig.SchemaValue[T]
        typeParams:
          - constraint: any
            name: T
      - name: SchemaSpec
        target: svcconfig.SchemaSpec[T]
        typeParams:
          - constraint: any
            name: T
    constants:
      - name: LayerDefault
        type: string
        value: "\"default\""
      - name: LayerFile
        type: string
        value: "\"file\""
      - name: LayerEnv
        type: string
        value: "\"env\""
      - name: LayerSource
        type: string
        value: "\"source\""
    functions:
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: Source
        name: Load
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: spec
            type: SchemaSpec[T]
        name: NewSchema
        out:
          - name: schema
            type: "*Schema[T]"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*Schema[T]"
          - name: sources
            type: Source
        name: LoadSchema
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: Source
        name: LoadWithOrigins
        out:
          - name: origins
            type: "[]Origin"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*Schema[T]"
          - name: sources
            type: Source
        name: LoadSchemaWithOrigins
        out:
          - name: origins
            type: "[]Origin"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: prefix
            type: string
        name: EnvSource
        out:
          - type: Source
      - in:
          - name: format
          - name: path
            type: string
        name: FileSource
        out:
          - type: Source
      - in:
          - name: fsys
            type: fs.FS
          - name: format
          - name: path
            type: string
        name: FSSource
        out:
          - type: Source
      - in:
          - name: path
            type: string
          - name: interval
            type: time.Duration
        name: PollWatcher
        out:
          - type: Watcher
    imports:
      coreconfig: github.com/kitsunium/sdk/internal/core/app/config
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      svcconfig: github.com/kitsunium/sdk/internal/service/app/config
    path: github.com/kitsunium/sdk/pkg/v1/app/config
    variables:
      - name: SourceFailed
        type: "*errs.Error"
      - name: DecodeFailed
        type: "*errs.Error"
      - name: ValidationFailed
        type: "*errs.Error"
      - name: WatchFailed
        type: "*errs.Error"
      - name: SchemaInvalid
        type: "*errs.Error"
      - name: KeyMissing
        type: "*errs.Error"
      - name: UnknownKey
        type: "*errs.Error"
