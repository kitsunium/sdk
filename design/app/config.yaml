apiVersion: kit.kitsunium/design/v2
domain: app/config
packages:
  - constants:
      - name: CodeConfigSourceFailed
        type: errs.Code
        value: "0x00_02_0A_01"
      - name: CodeConfigDecodeFailed
        type: errs.Code
        value: "0x00_02_0A_02"
      - name: CodeConfigValidationFailed
        type: errs.Code
        value: "0x00_02_0A_03"
      - name: CodeConfigWatchFailed
        type: errs.Code
        value: "0x00_02_0A_04"
      - name: CodeConfigSchemaInvalid
        type: errs.Code
        value: "0x00_02_0A_05"
      - name: CodeConfigKeyMissing
        type: errs.Code
        value: "0x00_02_0A_06"
      - name: CodeConfigUnknownKey
        type: errs.Code
        value: "0x00_02_0A_07"
      - name: LayerDefault
        type: string
        value: "\"default\""
      - name: LayerFile
        type: string
        value: "\"file\""
      - name: LayerEnv
        type: string
        value: "\"env\""
      - name: LayerSource
        type: string
        value: "\"source\""
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/config
    types:
      - name: OriginValue
        struct:
          fields:
            - name: Key
              type: string
            - name: Layer
              type: string
            - name: Detail
              type: string
            - name: Secret
              type: bool
      - interface:
          methods:
            - in:
                - name: key
                  type: string
              name: Describe
              out:
                - name: layer
                - name: detail
                  type: string
        name: Describer
      - name: DeclaredValue
        struct:
          fields:
            - name: Key
              type: string
            - name: Value
              type: any
      - interface:
          methods:
            - name: Load
              out:
                - name: values
                  type: map[string]any
                - name: err
                  type: error
        name: Source
      - interface:
          methods:
            - name: Validate
              out:
                - type: error
        name: Validator
      - interface:
          methods:
            - in:
                - name: ctx
                  type: context.Context
                - name: onChange
                  type: func()
              name: Watch
              out:
                - type: error
        name: Watcher
    variables:
      - name: ConfigSourceFailed
        type: "*errs.Error"
      - name: ConfigDecodeFailed
        type: "*errs.Error"
      - name: ConfigValidationFailed
        type: "*errs.Error"
      - name: ConfigWatchFailed
        type: "*errs.Error"
      - name: ConfigSchemaInvalid
        type: "*errs.Error"
      - name: ConfigKeyMissing
        type: "*errs.Error"
      - name: ConfigUnknownKey
        type: "*errs.Error"
  - functions:
      - in:
          - name: prefix
            type: string
        name: EnvSource
        out:
          - type: coreconfig.Source
      - in:
          - name: format
            type: codec.Format
          - name: path
            type: string
        name: FileSource
        out:
          - type: coreconfig.Source
      - in:
          - name: fsys
            type: fs.FS
          - name: format
            type: codec.Format
          - name: path
            type: string
        name: FSSource
        out:
          - type: coreconfig.Source
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: coreconfig.Source
        name: Load
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*SchemaValue[T]"
          - name: sources
            type: coreconfig.Source
        name: LoadSchema
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: sources
            type: coreconfig.Source
        name: LoadWithOrigins
        out:
          - name: origins
            type: "[]coreconfig.OriginValue"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: target
            type: "*T"
          - name: schema
            type: "*SchemaValue[T]"
          - name: sources
            type: coreconfig.Source
        name: LoadSchemaWithOrigins
        out:
          - name: origins
            type: "[]coreconfig.OriginValue"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - in:
          - name: path
            type: string
          - name: interval
            type: time.Duration
        name: PollWatcher
        out:
          - type: coreconfig.Watcher
      - in:
          - name: spec
            type: SchemaSpec[T]
        name: NewSchemaValue
        out:
          - name: schema
            type: "*SchemaValue[T]"
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
