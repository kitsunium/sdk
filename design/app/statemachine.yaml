apiVersion: kit.kitsunium/design/v2
domain: app/statemachine
packages:
  - codes:
      - const:
          - doc: CodeTriggerUnknown identifies a name ParseTrigger does not know.
            name: CodeTriggerUnknown
            note: "range: 0.2.56.0 - 0.2.56.255"
            value: "0x00_02_38_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeTransitionRefused identifies an event no declared transition takes from
              the entity's current state.
            name: CodeTransitionRefused
            note: |-
              range: 0.3.88.0 - 0.3.88.255

              The engine's outcomes. The range was allocated to
              internal/service/app/statemachine, which raises these codes, and it is
              declared here with the contract's own so that every code of the domain is
              in one place (ADR 0160). A code keeps the value its allocation gave it
              whichever layer declares it, so the layer byte still reads 3.
            value: "0x00_03_58_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntityMissing identifies a key the store holds no entity under — never
              there, or deleted while a transition ran.
            name: CodeEntityMissing
            value: "0x00_03_58_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntityExists identifies a Start whose entity's key the store already
              holds.
            name: CodeEntityExists
            value: "0x00_03_58_03"
        type: errs.Code
      - const:
          - doc: CodeKeyEmpty identifies an entity handed to Start whose key is empty.
            name: CodeKeyEmpty
            value: "0x00_03_58_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeHookFailed identifies a hook that returned an error: an OnEnter hook's
              error fails its transition, an OnTransition hook's is reported.
            name: CodeHookFailed
            value: "0x00_03_58_05"
        type: errs.Code
      - const:
          - doc: CodeHookPanicked identifies a hook that panicked, recovered as an error.
            name: CodeHookPanicked
            value: "0x00_03_58_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeHookChangedState identifies an OnEnter hook that changed the state of
              the entity it was entering.
            name: CodeHookChangedState
            value: "0x00_03_58_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeHookChangedKey identifies an OnEnter hook that changed the key of the
              entity it was entering.
            name: CodeHookChangedKey
            value: "0x00_03_58_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeReentrant identifies a transition asked for, through the context an
              OnEnter hook was given, on the machine running that hook.
            name: CodeReentrant
            value: "0x00_03_58_09"
        type: errs.Code
      - const:
          - doc: CodeStoreFailed identifies a Store method that returned an error.
            name: CodeStoreFailed
            value: "0x00_03_58_0A"
        type: errs.Code
      - const:
          - doc: CodeJournalFailed identifies a Journal method that returned an error.
            name: CodeJournalFailed
            value: "0x00_03_58_0B"
        type: errs.Code
      - const:
          - doc: CodeLoopRunning identifies a Run or a Step asked for while another is going.
            name: CodeLoopRunning
            value: "0x00_03_58_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeFunctionPanicked identifies a guard or an instant function that panicked
              while the loop asked it whether a transition was due.
            name: CodeFunctionPanicked
            value: "0x00_03_58_0D"
        type: errs.Code
      - const:
          - doc: CodeInitialMissing identifies a definition with no initial state.
            name: CodeInitialMissing
            value: "0x00_03_58_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeEventInvalid identifies a transition declared with an empty event name,
              or with the name reserved for a creation.
            name: CodeEventInvalid
            value: "0x00_03_58_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeTransitionDuplicate identifies a second transition declared for one
              event from one state.
            name: CodeTransitionDuplicate
            value: "0x00_03_58_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeDelayInvalid identifies a timer transition declared with a duration
              that is not positive.
            name: CodeDelayInvalid
            value: "0x00_03_58_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeFunctionMissing identifies a nil function where a definition needs one:
              the state accessor, a guard, an instant function, a hook — or a nil
              definition.
            name: CodeFunctionMissing
            value: "0x00_03_58_12"
        type: errs.Code
      - const:
          - doc: CodeStoreMissing identifies a configuration with no store.
            name: CodeStoreMissing
            value: "0x00_03_58_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeWaitAbandoned identifies a caller whose context ended while it waited
              for another transition of the same entity to finish.
            name: CodeWaitAbandoned
            value: "0x00_03_58_14"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopPanicked identifies a panic the loop recovered from the caller's own
              code while looking at an entity: a store method, a journal, an observer.
            name: CodeLoopPanicked
            value: "0x00_03_58_15"
        type: errs.Code
    constants:
      - doc: |-
          CreateEvent is the event name of the step that brings a new entity into its
          initial state. No declared transition may take it, so a history can always
          tell a creation from an event.
        name: CreateEvent
        type: string
        value: "\"create\""
      - doc: |-
          TriggerStart is the creation of an entity: the step into its initial
          state.
        name: TriggerStart
        type: Trigger
        value: "1"
      - doc: TriggerEvent is an event transition, fired by a caller.
        name: TriggerEvent
        type: Trigger
        value: "2"
      - doc: |-
          TriggerDelay is a timer transition due once an entity has spent a
          declared duration in its state.
        name: TriggerDelay
        type: Trigger
        value: "3"
      - doc: |-
          TriggerDeadline is a timer transition due at an instant the entity
          itself carries — a due date, an expiry.
        name: TriggerDeadline
        type: Trigger
        value: "4"
      - doc: |-
          TriggerGuard is a transition due as soon as a condition on the entity
          holds.
        name: TriggerGuard
        type: Trigger
        value: "5"
    doc: |-
      Package statemachine — ranges 0.2.56.* (ADR 0120 core/app/statemachine
      block) and 0.3.88.* (ADR 0120 service/app/statemachine block, declared here
      since ADR 0160).

      Package statemachine — declares the sentinel *errs.Error outcomes of the
      domain: the contract's one refusal, and the engine's outcomes. Each var's
      name equals its errs.Define Reason in SCREAMING_SNAKE form.

      No Public text names a key, an event or a state: those travel as log-only
      fields, because a key is often an identifier a caller would rather not see
      echoed, and the fields are where an operator looks anyway.

      Package statemachine — hosts the values the Journal port speaks: a record of
      one entity and the steps of its history.

      Package statemachine declares the ports of the state-machine domain (ADR
      0120): the [Store] a machine reads and writes the entities it drives through,
      the [Journal] that keeps beside them what a store does not — when each entity
      entered its state, and the transitions that brought it there — and the
      values those two ports speak ([RecordValue], [StepValue], [Trigger]). The
      engine — declarations, transitions, hooks, the agenda of timers and the loop
      that fires them — lives in internal/service/app/statemachine; this package owns
      only the contract.

      # The store stays the single source of truth

      An entity's state is a field of the entity, and the entity lives in the
      caller's store, not in the machine. A machine never keeps a second copy of an
      entity: it reads it through [Store.Get], writes it through [Store.Insert] or
      [Store.Replace], and forgets it the moment the caller says it was deleted.
      What the machine does keep — the instant an entity entered its state and a
      bounded history — is not something the entity carries, and it lives in a
      [Journal] so a restart does not reset every timer.

      # Missing and existing are answers, not errors

      [Store.Get] reports an absent entity with found == false, [Store.Insert] a
      taken key with inserted == false, and [Store.Replace] a vanished entity with
      replaced == false. A store therefore never has to produce a code of this
      domain to say something ordinary, and the machine decides what each answer
      means: a transition refused, an entity that does not exist, a creation that
      collided. An error from a port method is a store that FAILED, nothing else.

      # There is no registry

      A store is a caller's collection and a journal is where that caller keeps
      its bookkeeping: neither has a name the SDK could resolve, so, like lock
      (ADR 0052) and secret (ADR 0096), the domain has no name->implementation
      table.

      Package statemachine — hosts Trigger, the closed set of things that fire a
      transition, with its text form. Its one refusal, TriggerUnknown, is
      declared in errors.go with the domain's other sentinels.
    functions:
      - doc: |-
          ParseTrigger reads a trigger's name, as String writes it. Anything else —
          an empty name included — is refused with [TriggerUnknown], which does not
          repeat the name.
        in:
          - name: name
            type: string
        name: ParseTrigger
        out:
          - type: Trigger
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/statemachine
    ports:
      - doc: |-
          Store is the port through which a machine reads and writes the entities
          whose state it drives. The caller implements it over its own collection — a
          document store, a table, a map — and hands it to the engine.

          Implementations MUST be safe for concurrent use: the engine calls them from
          the goroutine firing a transition and from its own loop at once.

          The method set is FROZEN at five (ADR 0039): pkg/v1/app/statemachine aliases this
          interface, so a sixth method would break every downstream implementation at
          compile time. A new capability arrives as a sibling interface reached by
          type assertion.
        methods:
          - doc: |-
              Key returns the key entity is stored under. It must be a pure function
              of the entity: the engine locks, records and schedules by it, and a
              transition never changes it.
            in:
              - name: entity
                type: E
            name: Key
            out:
              - name: key
                type: string
          - doc: |-
              Get returns the entity stored under key, and found == false — with a
              nil error — when there is none.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Get
            out:
              - name: entity
                type: E
              - name: found
                type: bool
              - name: err
                type: error
          - doc: |-
              Insert stores entity under a key no entity holds. When one does, it
              stores nothing and reports inserted == false with a nil error.
            in:
              - name: ctx
                type: context.Context
              - name: entity
                type: E
            name: Insert
            out:
              - name: inserted
                type: bool
              - name: err
                type: error
          - doc: |-
              Replace stores entity over the entity holding its key. When none does
              — it was deleted while a transition ran — it stores nothing and reports
              replaced == false with a nil error: a transition never brings back an
              entity somebody deleted.
            in:
              - name: ctx
                type: context.Context
              - name: entity
                type: E
            name: Replace
            out:
              - name: replaced
                type: bool
              - name: err
                type: error
          - doc: |-
              All yields every entity, then stops; an error ends the sequence. The
              engine ranges over it once, when a machine opens, to reconcile its
              journal and build its agenda.
            in:
              - name: ctx
                type: context.Context
            name: All
            out:
              - type: iter.Seq2[E, error]
        name: Store
        typeParams:
          - constraint: any
            name: E
      - doc: |-
          Journal keeps, beside the store, what a machine knows about each entity and
          the entity does not carry: the instant it entered its state and the
          transitions that brought it there. Without one the machine keeps it in
          memory, and after a restart every entity re-enters its state at the moment
          the machine opens — which resets every After timer.

          Implementations MUST be safe for concurrent use. The engine calls them with
          no lock of its bookkeeping held, one call at a time PER KEY: two writes of
          one key arrive in the order the machine made them, and writes of different
          keys may arrive at once — an implementation that rewrites one file orders
          those itself. A journal may read the machine, its census or its records; it
          must not tell it anything — Changed, Deleted, Start or Fire from inside a
          journal call waits for itself.

          Save and Delete take several records at once because a machine that opens
          reconciles every entity in one pass; a journal that rewrites a whole file
          then does it once rather than once per entity.

          The method set is FROZEN at three (ADR 0039).
        methods:
          - doc: |-
              Load returns every record the journal holds. The engine calls it once,
              when a machine opens.
            in:
              - name: ctx
                type: context.Context
            name: Load
            out:
              - name: records
                type: "[]RecordValue[S]"
              - name: err
                type: error
          - doc: Save stores each record, replacing any record of the same key.
            in:
              - name: ctx
                type: context.Context
              - name: records
                type: RecordValue[S]
            name: Save
            out:
              - type: error
            variadic: true
          - doc: |-
              Delete forgets the records of keys; a key it does not hold is not an
              error.
            in:
              - name: ctx
                type: context.Context
              - name: keys
                type: string
            name: Delete
            out:
              - type: error
            variadic: true
        name: Journal
        typeParams:
          - constraint: comparable
            name: S
    sentinels:
      - var:
          - code: CodeTriggerUnknown
            doc: |-
              TriggerUnknown refuses a name that is not one of the five triggers: a
              journal written by something else, or damaged. The refused name is never
              repeated — a journal is the caller's data.
            name: TriggerUnknown
            private: "core/app/statemachine: a trigger is start, event, delay, deadline or guard; the name given is none of them"
            public: That is not a state-machine trigger
            reason: TRIGGER_UNKNOWN
          - code: CodeTransitionRefused
            doc: |-
              TransitionRefused is returned by Fire for an event no declared
              transition takes from the entity's current state — including an event
              that exists but leaves another state, and a timer or guard transition,
              which only the machine's own loop fires. The entity is returned beside
              it, so the caller can read the state that refused.
            name: TransitionRefused
            note: |-
              The engine's outcomes, raised by internal/service/app/statemachine. They
              are declared here, with the contract's refusal, so that the domain's
              codes and sentinels are in one place (ADR 0160).
            options:
              - errs.WithHTTPStatus(httpConflict)
            private: "service/app/statemachine: no event transition by that name leaves the entity's state; the fields name the event and the state"
            public: That transition is not possible from the current state
            reason: TRANSITION_REFUSED
          - code: CodeEntityMissing
            doc: |-
              EntityMissing is returned when the store holds no entity under the key:
              by Fire for a key never stored, and by any transition whose entity was
              deleted while it ran — the store's Replace reported it gone, and the
              transition stored nothing rather than bring it back.
            name: EntityMissing
            options:
              - errs.WithHTTPStatus(httpNotFound)
            private: "service/app/statemachine: the store holds no entity under the key, or it was deleted while the transition ran; the key field names it"
            public: No such entity
            reason: ENTITY_MISSING
          - code: CodeEntityExists
            doc: |-
              EntityExists is returned by Start when the store already holds an
              entity under the new one's key. Nothing was stored and no hook ran
              after the refusal.
            name: EntityExists
            options:
              - errs.WithHTTPStatus(httpConflict)
            private: "service/app/statemachine: the store's Insert reported the key taken; the key field names it"
            public: An entity with that key already exists
            reason: ENTITY_EXISTS
          - code: CodeKeyEmpty
            doc: |-
              KeyEmpty is returned by Start for an entity whose key is empty. The
              engine locks, records and schedules by key, so an empty one would make
              every such entity the same entity.
            name: KeyEmpty
            private: "service/app/statemachine: Store.Key returned an empty key for the entity handed to Start"
            public: The entity has no key
            reason: KEY_EMPTY
          - code: CodeHookFailed
            doc: |-
              HookFailed accompanies the error a hook returned, joined with it so
              both errors.Is and errs.HasCode answer: an OnEnter hook's failure fails
              its transition and is returned; an OnTransition hook's is reported
              through Config.Report and the transition stands.
            name: HookFailed
            private: "service/app/statemachine: a hook returned an error, joined beside this one; the fields name the hook, the event and the state"
            public: A state-machine hook failed
            reason: HOOK_FAILED
          - code: CodeHookPanicked
            doc: |-
              HookPanicked is a hook that panicked. The panic is recovered where the
              hook ran, so an OnEnter hook fails its transition — and the entity's
              lock is released on the way out, which is what kept a panicking hook
              from leaving the machine locked for good. The recovered value and the
              stack travel as log-only fields.
            name: HookPanicked
            private: "service/app/statemachine: a hook panicked and was recovered; the fields carry the hook, the event, the value and the stack"
            public: A state-machine hook panicked
            reason: HOOK_PANICKED
          - code: CodeHookChangedState
            doc: |-
              HookChangedState refuses a transition whose OnEnter hook changed the
              entity's state. A hook may change the entity, not where it is going:
              the history would record one state and the store hold another.
            name: HookChangedState
            private: "service/app/statemachine: after the OnEnter hooks the entity's state was no longer the transition's target; nothing was stored"
            public: A state-machine hook changed the state it was entering
            reason: HOOK_CHANGED_STATE
          - code: CodeHookChangedKey
            doc: |-
              HookChangedKey refuses a transition whose OnEnter hook changed the
              entity's key: storing it would replace, or create, another entity.
            name: HookChangedKey
            private: "service/app/statemachine: after the OnEnter hooks Store.Key no longer returned the entity's key; nothing was stored"
            public: A state-machine hook changed the key of its entity
            reason: HOOK_CHANGED_KEY
          - code: CodeReentrant
            doc: |-
              Reentrant refuses a Start or a Fire made, through the context an
              OnEnter hook was given, on the machine running that hook. The hook runs
              while the machine holds its entity's lock, so the call would wait for
              itself; it is refused instead of deadlocking. Fire from an
              OnTransition hook, which runs once the lock is released.
            name: Reentrant
            private: "service/app/statemachine: Start or Fire was called with a context an OnEnter hook of the same machine was given; fire from OnTransition instead"
            public: A state-machine hook cannot fire its own machine
            reason: REENTRANT
          - code: CodeStoreFailed
            doc: |-
              StoreFailed wraps an error a Store method returned. When the store's
              error is itself an SDK error its code is kept and this one joins the
              trail, so both errs.HasCode checks answer.
            name: StoreFailed
            private: "service/app/statemachine: a Store method returned an error; the fields name the operation"
            public: The state machine's store failed
            reason: STORE_FAILED
          - code: CodeJournalFailed
            doc: |-
              JournalFailed wraps an error a Journal method returned. Load failing
              fails the machine's opening; Save and Delete failing are reported and
              the transition stands, since the store is the source of truth and a
              lost record only costs a timer its origin after a restart.
            name: JournalFailed
            private: "service/app/statemachine: a Journal method returned an error; the fields name the operation"
            public: The state machine's journal failed
            reason: JOURNAL_FAILED
          - code: CodeLoopRunning
            doc: |-
              LoopRunning refuses a Run or a Step while another Run or Step of the
              same machine is going: one loop at a time, so an entity takes at most
              one automatic transition per run.
            name: LoopRunning
            private: "service/app/statemachine: Run or Step was called while another Run or Step of this machine had not returned"
            public: The state machine's loop is already running
            reason: LOOP_RUNNING
          - code: CodeFunctionPanicked
            doc: |-
              FunctionPanicked is a guard or an instant function that panicked while
              the loop asked whether a transition was due. The entity is retried
              after a backoff; the value and the stack travel as log-only fields.
            name: FunctionPanicked
            private: "service/app/statemachine: a guard or an instant function panicked and was recovered; the fields carry the event, the value and the stack"
            public: A state-machine guard or deadline function panicked
            reason: FUNCTION_PANICKED
          - code: CodeInitialMissing
            doc: |-
              InitialMissing refuses a definition that never called Initial: Start
              would have no state to put a new entity in.
            name: InitialMissing
            private: "service/app/statemachine: the definition never called Initial"
            public: The state machine has no initial state
            reason: INITIAL_MISSING
          - code: CodeEventInvalid
            doc: |-
              EventInvalid refuses a transition declared with an empty event name or
              with the name a creation's history step takes.
            name: EventInvalid
            private: "service/app/statemachine: a transition was declared with an empty event name or with core/app/statemachine.CreateEvent"
            public: A transition needs a name, other than the reserved one
            reason: EVENT_INVALID
          - code: CodeTransitionDuplicate
            doc: |-
              TransitionDuplicate refuses a second transition for one event from one
              state: Fire, and the loop's first-declared rule, would have two answers.
            name: TransitionDuplicate
            private: "service/app/statemachine: a transition was declared twice for one event from one state; the fields name them"
            public: That event already leaves that state
            reason: TRANSITION_DUPLICATE
          - code: CodeDelayInvalid
            doc: |-
              DelayInvalid refuses an After with a duration that is not positive: a
              timer due the instant its state is entered is a guard that always
              holds, and reads as a mistake.
            name: DelayInvalid
            private: "service/app/statemachine: After was declared with a duration of zero or less; the event field names it"
            public: A timer transition needs a positive duration
            reason: DELAY_INVALID
          - code: CodeFunctionMissing
            doc: |-
              FunctionMissing refuses a nil function a definition needs: the state
              accessor, a guard, an instant function or a hook — and a nil
              definition handed to NewStateMachine.
            name: FunctionMissing
            private: "service/app/statemachine: a nil state accessor, guard, instant function, hook or definition; the fields say which"
            public: The state machine was given no function where it needs one
            reason: FUNCTION_MISSING
          - code: CodeStoreMissing
            doc: |-
              StoreMissing refuses a configuration with no store: a machine's
              entities have to live somewhere.
            name: StoreMissing
            private: "service/app/statemachine: Config.Store is nil"
            public: The state machine has no store
            reason: STORE_MISSING
          - code: CodeLoopPanicked
            doc: |-
              LoopPanicked is a panic the loop recovered from the caller's own code —
              a store method, a journal, an observer — while it looked at one
              entity. When the panic interrupted the entity's pass, the entity is
              retried after its backoff; when it came from the observer's end, the
              transition was stored already and stands — call=observe-end says so.
              Either way the loop goes on. Start and Fire, which run on the caller's
              goroutine, let such a panic through, with the entity's lock released.
              The value and the stack travel as log-only fields.
            name: LoopPanicked
            private: "service/app/statemachine: a store, journal or observer call panicked in the loop; the fields carry the key, the value, the stack and, for the observer's end, call"
            public: The state machine's loop recovered a panic
            reason: LOOP_PANICKED
          - code: CodeWaitAbandoned
            doc: |-
              WaitAbandoned is returned when the caller's context ended while it
              waited for another transition of the same entity to finish. Nothing was
              read or stored.
            name: WaitAbandoned
            options:
              - errs.WithHTTPStatus(httpUnavailable)
            private: "service/app/statemachine: the context ended before the entity's lock was free; the cause is the context's error"
            public: The request ended while the entity was busy
            reason: WAIT_ABANDONED
    types:
      - decl: true
        doc: |-
          RecordValue is what a machine keeps about one entity beside the store: the
          state it is in, since when, and the transitions that brought it there,
          oldest first and bounded by the machine's history length.

          State and Entered describe the entity as the machine last saw it. When an
          entity's state changes behind the machine's back — a write that did not go
          through a transition — the machine records the new state with Entered set
          to the moment it learned of it, and adds no step: it knows the state, not a
          transition.
        name: RecordValue
        struct:
          fields:
            - doc: Key is the entity's key in the store.
              name: Key
              tag: json:"key"
              type: string
            - doc: State is the state the entity is in.
              name: State
              tag: json:"state"
              type: S
            - doc: Entered is when the entity entered State.
              name: Entered
              tag: json:"entered"
              type: time.Time
            - doc: History holds the latest transitions, oldest first.
              name: History
              tag: json:"history,omitempty"
              type: "[]StepValue[S]"
        typeParams:
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          StepValue is one transition in a record's history: which, from where to
          where, what fired it, who asked, and when it was stored.
        name: StepValue
        struct:
          fields:
            - doc: Event is the transition's name; [CreateEvent] for a creation.
              name: Event
              tag: json:"event"
              type: string
            - doc: "From is the state left: the zero S for a creation."
              name: From
              tag: json:"from"
              type: S
            - doc: To is the state entered.
              name: To
              tag: json:"to"
              type: S
            - doc: Trigger says what fired the transition.
              name: Trigger
              tag: json:"trigger"
              type: Trigger
            - doc: |-
                Actor says who fired it when a caller did, as the machine's
                configuration reads it from the caller's context; empty when the
                machine's own loop fired it or nobody said.
              name: Actor
              tag: json:"actor,omitempty"
              type: string
            - doc: At is when the transition was stored.
              name: At
              tag: json:"at"
              type: time.Time
        typeParams:
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          Trigger says what fired a transition. The set is closed: every transition a
          machine can take is declared one of these ways, and a history names which.

          The values are STABLE — a journal may store them as numbers, and none is
          ever renumbered — and the zero value is not a trigger, so a step read from
          a journal that lost the field names no trigger rather than some default.
          String and ParseTrigger give the text form.
        methods:
          - doc: |-
              String returns the trigger's name — "start", "event", "delay", "deadline"
              or "guard" — or "" for a value outside the set, which is how a caller tells
              a trigger from one that is not.
            name: String
            out:
              - type: string
            recv: value
        name: Trigger
        underlying: uint8
  - constants:
      - doc: |-
          DefaultMinGap is the least time between the end of one run of a machine's
          loop and the start of the next, when Config.MinGap is not positive: a burst
          of writes is one run, and a transition chain advances one step per run.
        name: DefaultMinGap
        type: time.Duration
        value: "1000000000"
      - doc: |-
          DefaultMaxHistory is how many transitions a record keeps when
          Config.MaxHistory is not positive.
        name: DefaultMaxHistory
        type: int
        value: "20"
      - doc: WakeStart is the first run, when Run starts.
        name: WakeStart
        type: Wake
        value: "1"
      - doc: "WakeDue is a run the loop woke for by itself: a transition fell due."
        name: WakeDue
        type: Wake
        value: "2"
      - doc: WakeChange is a run a write woke the loop for.
        name: WakeChange
        type: Wake
        value: "3"
      - doc: "LoopRunStarted reports a run starting: Wake and Started are set."
        name: LoopRunStarted
        type: LoopEventKind
        value: "1"
      - doc: "LoopRunEnded reports a run ending: every field is set."
        name: LoopRunEnded
        type: LoopEventKind
        value: "2"
      - doc: |-
          LoopWaiting reports the loop re-armed to wake earlier, at Next, because
          a write arrived while it slept.
        name: LoopWaiting
        type: LoopEventKind
        value: "3"
    doc: |-
      Package statemachine — hosts the agenda: when each entity's next automatic
      transition falls due, the entities written since the loop last looked, and
      the backoff of those whose transition failed.

      Package statemachine — hosts the blueprint: a definition frozen for one
      machine, indexed for the lookups a transition makes, and the evaluation of
      what is due for an entity.

      Package statemachine — hosts the book: what a machine keeps beside the
      store — one record per entity, the census per state, the entities held by a
      read or a transition — and its writes through the Journal, one key at a
      time.

      Package statemachine — hosts Config, a machine's construction parameters,
      and the defaults its zero fields resolve to.

      Package statemachine — hosts MachineSpec, the declaration of a machine: its
      states, its transitions and its hooks, and what a caller reads back from it.

      Package statemachine — hosts the per-entity locks that serialise the
      transitions of one entity, and the context mark that tells a hook's own
      machine apart.

      Package statemachine — hosts the machine's own loop: Step, one pass over
      what is due; Run, which paces the passes and sleeps until the next
      transition due or a write, never polling; and what OnLoop is told.

      Package statemachine is the state-machine engine over stored entities (ADR
      0120): a [MachineSpec] declares the states an entity goes through and the
      transitions between them — events a caller fires, timers after a duration in
      a state, deadlines the entity carries, guards on the entity — with hooks on
      the way; a [StateMachine] runs it over the caller's store, keeps a record of each
      entity beside it, and fires the timers and guards from its own loop, which
      sleeps until the next transition due and wakes on a write. The ports it is
      given — the Store, the Journal — are internal/core/app/statemachine's.

      # One entity, one transition at a time

      A transition takes its entity's lock, reads it again, runs the OnEnter hooks
      of the state entered, writes it — an insert for a creation, a replace
      otherwise, and a replace never brings back an entity deleted meanwhile —
      records the step, releases the lock, and only then runs the OnTransition
      hooks. A hook that panics fails what it was part of and never leaves an
      entity locked. Transitions of different entities run concurrently.

      # The agenda

      Each entity in a state that a timer or a guard leaves has ONE entry on a
      heap: the instant its earliest automatic transition falls due. The loop
      pops what is due, evaluates only those entities and the ones written since
      it last looked, and sleeps until the heap's top — so finding the next
      transition due costs O(log N), where re-reading the whole store on every
      wake costs O(N). BENCH.md measures both.

      Package statemachine — hosts what a store's owner tells a machine about
      writes it did not make, and how the machine brings its records and its
      agenda in line with them.

      Package statemachine — hosts the transitions a caller asks for (Start,
      Fire) and the part every transition shares: the hooks, the write, the step
      recorded, and the lock released before the OnTransition hooks.
    functions:
      - doc: |-
          NewMachineSpec starts the declaration of a machine over entities of type E.
          state returns a pointer to the entity's state field: the engine reads the
          state through it and writes the new state through it, so the store stays
          the single source of truth.
        in:
          - name: state
            type: func(*E) *S
        name: NewMachineSpec
        out:
          - type: "*MachineSpec[E, S]"
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: |-
          NewStateMachine checks def and cfg, then opens a machine over cfg.Store: it
          reads the journal, reads every entity once, reconciles the two — an entity
          the journal does not know, or whose state differs, enters its state now; a
          record whose entity is gone is dropped — and schedules what is due. It is
          the only moment the machine reads the whole store.

          A definition with problems is refused with every problem joined, a missing
          Initial as [corestm.InitialMissing]; a nil or storeless cfg with [corestm.StoreMissing]; a
          journal that cannot be loaded, or a store that cannot be read, with
          [corestm.JournalFailed] or [corestm.StoreFailed]. The machine keeps its own copy of def,
          and reads cfg once.
        in:
          - name: ctx
            type: context.Context
          - name: def
            type: "*MachineSpec[E, S]"
          - name: cfg
            type: "*Config[E, S]"
        name: NewStateMachine
        out:
          - type: "*StateMachine[E, S]"
          - type: error
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
    imports:
      atomic: sync/atomic
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corestm: github.com/kitsunium/sdk/internal/core/app/statemachine
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
    path: github.com/kitsunium/sdk/internal/service/app/statemachine
    types:
      - decl: true
        doc: |-
          FiringValue is a transition the machine's own loop is about to fire, as
          Config.Observe is told it.
        name: FiringValue
        struct:
          fields:
            - doc: Key is the entity's key.
              name: Key
              type: string
            - doc: Event is the transition's name.
              name: Event
              type: string
            - doc: From is the state the entity is in.
              name: From
              type: S
            - doc: To is the state it is about to enter.
              name: To
              type: S
            - doc: "Trigger is a delay, a deadline or a guard: the loop fires nothing else."
              name: Trigger
              type: corestm.Trigger
        typeParams:
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          Config parameterises NewStateMachine. Only Store is required; every other zero
          field resolves to a working default.
        name: Config
        struct:
          fields:
            - doc: Store holds the entities. Required.
              name: Store
              type: corestm.Store[E]
            - doc: |-
                Journal keeps each entity's record beside the store. Nil keeps the
                records in memory: after a restart every entity re-enters its state
                when the machine opens, which restarts every After timer.
              name: Journal
              type: corestm.Journal[S]
            - doc: |-
                Clock is what the machine stamps and waits on. Nil is clock.System; a
                clock.ManualClock drives every timer of a test.
              name: Clock
              type: clock.Timed
            - doc: |-
                Actor reads, from the context a caller hands Start or Fire, who fired
                the transition; the result lands in the record's history and in the
                change hooks receive. Never called for a transition the loop fires.
                Nil records nobody.
              name: Actor
              type: func(ctx context.Context) string
            - doc: |-
                Observe brackets every transition the machine's OWN loop fires — the
                ones no caller can wrap: it is called before the transition with the
                loop's context, returns the context the transition's hooks and store
                calls run under — a tracer puts its span there — and a function the
                engine calls with the outcome once the OnTransition hooks have run and
                the loop has recorded it: a panic there is reported as LoopPanicked and
                changes nothing, the transition stands. A caller wraps its own Start and
                Fire itself. It is called while the loop holds the entity, so it must
                not fire that entity. Nil observes nothing.
              name: Observe
              type: func(ctx context.Context, firing FiringValue[S]) (context.Context, func(err error))
            - doc: |-
                Report receives every error no caller's return value carries: an
                OnTransition hook's failure, a Journal write that failed, and each
                transition the loop could not fire. It is called with no lock of the
                machine held, so it may read the machine — its census, a record — or
                fire it. Nil drops them — the SDK does not write to stderr on the
                caller's behalf (ADR 0030) — so wire it.
              name: Report
              type: func(ctx context.Context, err error)
            - doc: |-
                OnLoop is told what Run does: a run starting, a run ending with what
                it fired and when the loop wakes next, and the loop re-arming earlier
                because a write arrived. Called on the loop's goroutine; keep it short.
                Nil observes nothing.
              name: OnLoop
              type: func(event LoopEvent)
            - doc: |-
                MinGap is the least time between the end of one run of the loop and
                the start of the next. Not positive means DefaultMinGap.
              name: MinGap
              type: time.Duration
            - doc: |-
                Backoff is how long an entity whose automatic transition failed waits
                before it is tried again, by consecutive failures. A zero BaseDelay
                means 1s doubling to a minute.
              name: Backoff
              type: kbackoff.Value
            - doc: |-
                MaxHistory is how many transitions each record keeps. Not positive
                means DefaultMaxHistory.
              name: MaxHistory
              type: int
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          MachineSpec declares a state machine over entities of type E whose state is
          an S: the state a new entity enters, the transitions between states and how
          each is fired, and the hooks that run on the way.

          A MachineSpec is DATA. Every transition is declared before a machine runs,
          which is what lets a caller draw the machine exactly — [MachineSpec.States]
          and [MachineSpec.Transitions] read it back — and what lets the engine know,
          for any state, which timers and guards can move an entity out of it.

          Four kinds of transitions:

            - On: an event, fired by a caller with [StateMachine.Fire];
            - After: a duration spent in a state, fired by the machine's loop;
            - At: an instant the entity carries — a due date, a deadline — fired by
              the loop once it has come;
            - When: a guard on the entity, fired by the loop as soon as it holds. A
              guard sees the entity only and is asked again each time the entity is
              written; a condition on the time is an instant, declared with At.

          When several automatic transitions leave a state and more than one is due,
          the one declared FIRST fires.

          A mistake — a duplicate, an empty event name, a nil function, a duration
          that is not positive — is recorded rather than panicked on, read back with
          [MachineSpec.Problems], and refused by NewStateMachine. Build a MachineSpec on one
          goroutine; once a machine is built from it, the machine keeps its own copy
          and later declarations do not reach it.
        methods:
          - doc: |-
              Initial sets the state a new entity enters with [StateMachine.Start]. A second
              call replaces the first.
            in:
              - name: state
                type: S
            name: Initial
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              On declares an event transition: [StateMachine.Fire] with event moves an entity
              in state from to state to. One event may leave several states, but only one
              transition per event and state.
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
            name: "On"
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              After declares a timer transition: an entity that has spent delay in state
              from moves to state to, fired by the machine's loop. The time is counted
              from when the entity entered the state, which the machine's journal keeps
              across restarts.
            in:
              - name: event
                type: string
              - name: delay
                type: time.Duration
              - name: from
              - name: to
                type: S
            name: After
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              At declares a timer transition at an instant the entity carries: an entity
              in state from moves to state to once the instant instant returns has come;
              false means no instant for now. The engine asks again each time the entity
              is written, and its loop sleeps until the earliest instant.
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
              - name: instant
                type: func(E) (time.Time, bool)
            name: At
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              When declares a guard transition: an entity in state from moves to state to
              as soon as guard holds. The guard sees the entity only and is asked each time
              the entity is written, never on a clock.
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
              - name: guard
                type: func(E) bool
            name: When
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              OnEnter adds a hook run when an entity enters state, before it is stored.
              Hooks of one state run in declaration order.

              An error cancels the transition, and so does a panic — recovered as
              [corestm.HookPanicked], with the entity's lock released on the way out. A hook may
              change the entity but not its state nor its key ([corestm.HookChangedState],
              [corestm.HookChangedKey]), and must not fire its own machine: it runs under the
              entity's lock, so the call is refused with [corestm.Reentrant] rather than waiting
              for itself.
            in:
              - name: state
                type: S
              - name: hook
                type: func(context.Context, *E) error
            name: OnEnter
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              OnTransition adds a hook run after every stored transition, whoever fired
              it — the natural place to publish it. Hooks run in declaration order, once
              the entity's lock is released, so a hook may fire the machine again. An
              error or a panic is reported through Config.Report; the transition stands
              and the next hooks still run.
            in:
              - name: hook
                type: func(context.Context, ChangeValue[E, S]) error
            name: OnTransition
            out:
              - type: "*MachineSpec[E, S]"
            recv: pointer
          - doc: |-
              Problems returns the declaration's mistakes so far, in the order they were
              made, each an error carrying a code of this package and log-only fields
              naming the event, the state or the function concerned. A missing Initial is
              not among them — it is only a mistake once the declaration is complete, and
              NewStateMachine reports it as [corestm.InitialMissing].
            name: Problems
            out:
              - type: "[]error"
            recv: pointer
          - doc: |-
              States returns every state the declaration names, in the order each was
              first mentioned: the initial state, the ends of each transition, the states
              that have hooks.
            name: States
            out:
              - type: "[]S"
            recv: pointer
          - doc: Transitions returns the declared transitions in declaration order.
            name: Transitions
            out:
              - type: "[]TransitionValue[S]"
            recv: pointer
          - doc: |-
              InitialState returns the state a new entity enters, and whether Initial
              was called.
            name: InitialState
            out:
              - name: state
                type: S
              - name: set
                type: bool
            recv: pointer
          - doc: |-
              Can reports whether [StateMachine.Fire] with event would move entity: an event
              transition by that name leaves its current state. It is a function of the
              declaration alone and needs no running machine.
            in:
              - name: entity
                type: E
              - name: event
                type: string
            name: Can
            out:
              - type: bool
            recv: pointer
        name: MachineSpec
        struct:
          fields:
            - doc: state returns a pointer to the entity's state field.
              name: state
              type: func(*E) *S
            - doc: enter holds the OnEnter hooks, per state, in declaration order.
              name: enter
              type: map[S][]func(context.Context, *E) error
            - doc: initial is the state a new entity enters.
              name: initial
              type: S
            - doc: order lists every state the declaration names, first mention first.
              name: order
              type: "[]S"
            - doc: arrows lists the transitions in declaration order.
              name: arrows
              type: "[]arrow[E, S]"
            - doc: after holds the OnTransition hooks in declaration order.
              name: after
              type: "[]func(context.Context, ChangeValue[E, S]) error"
            - doc: problems lists the declaration's mistakes in the order they were made.
              name: problems
              type: "[]error"
            - doc: hasInitial says Initial was called.
              name: hasInitial
              type: bool
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          TransitionValue is one declared transition, as [MachineSpec.Transitions]
          reads it back.
        name: TransitionValue
        struct:
          fields:
            - doc: Event is the transition's name.
              name: Event
              type: string
            - doc: From is the state it leaves.
              name: From
              type: S
            - doc: To is the state it enters.
              name: To
              type: S
            - doc: "Trigger says how it fires: an event, a delay, a deadline or a guard."
              name: Trigger
              type: corestm.Trigger
            - doc: Delay is After's duration; zero for every other trigger.
              name: Delay
              type: time.Duration
        typeParams:
          - constraint: comparable
            name: S
      - decl: true
        doc: |-
          ChangeValue describes one stored transition, as an OnTransition hook
          receives it.
        name: ChangeValue
        struct:
          fields:
            - doc: Entity is the entity as stored after the transition.
              name: Entity
              type: E
            - doc: At is when the transition was stored.
              name: At
              type: time.Time
            - doc: Key is the entity's key in the store.
              name: Key
              type: string
            - doc: |-
                Event is the transition's name; core/app/statemachine.CreateEvent for a
                creation.
              name: Event
              type: string
            - doc: |-
                Actor is who fired it, as Config.Actor read it from the caller's
                context; empty when the machine's loop fired it.
              name: Actor
              type: string
            - doc: "From is the state left: the zero S for a creation."
              name: From
              type: S
            - doc: To is the state entered.
              name: To
              type: S
            - doc: Trigger says what fired it.
              name: Trigger
              type: corestm.Trigger
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - decl: true
        doc: Wake says why a run of the loop started.
        methods:
          - doc: String returns "start", "due" or "change"; "" outside the set.
            name: String
            out:
              - type: string
            recv: value
        name: Wake
        underlying: uint8
      - decl: true
        doc: LoopEventKind says what a [LoopEvent] reports.
        methods:
          - doc: String returns "run-started", "run-ended" or "waiting"; "" outside the set.
            name: String
            out:
              - type: string
            recv: value
        name: LoopEventKind
        underlying: uint8
      - decl: true
        doc: |-
          LoopEvent is what Config.OnLoop is told about [StateMachine.Run]. Which fields
          are set depends on Kind.
        name: LoopEvent
        struct:
          fields:
            - doc: Err joins what failed in the run; nil when nothing did.
              name: Err
              type: error
            - doc: Started is when the run started.
              name: Started
              type: time.Time
            - doc: Ended is when the run ended.
              name: Ended
              type: time.Time
            - doc: |-
                Next is when the loop wakes by itself next — never sooner than
                Config.MinGap after the run ended; zero when only a write will wake it.
              name: Next
              type: time.Time
            - doc: Fired counts the transitions the run stored.
              name: Fired
              type: int
            - doc: Failed counts the transitions the run could not fire.
              name: Failed
              type: int
            - doc: Kind says what is reported.
              name: Kind
              type: LoopEventKind
            - doc: Wake says why the run started.
              name: Wake
              type: Wake
      - decl: true
        doc: |-
          StateMachine runs a [MachineSpec] over the entities of a [corestm.Store]: it
          creates them in their initial state, moves them along event transitions when
          a caller fires one, and — while [StateMachine.Run] goes — along the timers and
          guards that are due. It is safe for concurrent use.

          Transitions of one entity run one at a time; transitions of different
          entities run concurrently. Beside the store the machine keeps one record per
          entity — its state, since when, its latest transitions — in memory and in
          the configured journal, plus the census of entities per state.

          The store may be written by others. Tell the machine through
          [StateMachine.Changed] and [StateMachine.Deleted]: a write can move a deadline or
          make a guard hold, and a state changed behind the machine's back re-enters
          its state at the moment the machine learns of it.
        methods:
          - doc: |-
              Run is the machine's own loop: it fires the timer and guard transitions as
              they fall due, until ctx ends, and returns nil then. It returns
              [corestm.LoopRunning] at once when another Run or a Step of this machine is going.

              It never polls. A run fires what is due — per entity, the first declared
              transition due, one per entity per run — and the loop then sleeps until the
              next transition due or until a write wakes it: [StateMachine.Changed], or a
              transition stored by Start or Fire. No run starts sooner than
              Config.MinGap after the previous one ended, so a burst of writes is one
              run. A machine with no timer and no guard never runs, and Run just waits for
              ctx.

              An entity whose transition failed is tried again after Config.Backoff,
              counted per entity: one failing entity delays nobody else. Everything runs
              on the calling goroutine, so a caller's pprof labels cover every hook the
              loop runs.
            in:
              - name: ctx
                type: context.Context
            name: Run
            out:
              - type: error
            recv: pointer
          - doc: |-
              Step makes one pass over what is due now: every entity written since the
              last pass is evaluated, and every entity whose transition is due fires it
              — the first declared one due, one transition per entity. It returns when
              the loop should look again by itself: the current instant when entities
              wait to be evaluated, the earliest due instant otherwise, the zero time when
              nothing is scheduled; and the failures joined.

              It is for a caller that drives the machine itself instead of Run — a test,
              another scheduler. It returns [corestm.LoopRunning] when Run or another Step is
              going.
            in:
              - name: ctx
                type: context.Context
            name: Step
            out:
              - type: time.Time
              - type: error
            recv: pointer
          - doc: |-
              Census counts the entities per state. Every declared state is present, at
              zero when no entity is in it; an undeclared state found in the store is
              present while an entity is in it.
            name: Census
            out:
              - type: map[S]int
            recv: pointer
          - doc: |-
              Record returns what the machine keeps about the entity under key, and false
              when it knows none.
            in:
              - name: key
                type: string
            name: Record
            out:
              - type: corestm.RecordValue[S]
              - type: bool
            recv: pointer
          - doc: Records returns every record, the most recently entered state first.
            name: Records
            out:
              - type: "[]corestm.RecordValue[S]"
            recv: pointer
          - doc: |-
              Changed tells the machine the entity under key was written by something
              other than the machine — call it after the write is visible to Store.Get.
              The machine reads the entity: a state that changed behind its back enters
              its record as of now, and when a timer or a guard leaves the entity's state
              the loop is woken to ask again what is due — a write can move a deadline or
              make a guard hold. An entity the store no longer holds is forgotten, as by
              [StateMachine.Deleted].

              Calling it for the machine's own writes is harmless. When a transition of
              the entity is in flight — which is where a store that notifies on every
              write calls it from — it returns at once and the transition reads the
              entity again before it lets go of it. Call it OUTSIDE any lock of the
              store: it may wait for the entity's lock while the loop, holding it, reads
              the store.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Changed
            out:
              - type: error
            recv: pointer
          - doc: |-
              Deleted tells the machine the entity under key was deleted: its record
              leaves the census, the journal and the agenda. A read or a transition of the
              entity in progress will not record it again. It returns the journal's
              failure, if any; the record is dropped either way.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Deleted
            out:
              - type: error
            recv: pointer
          - doc: |-
              Start enters a new entity into the machine: it sets the initial state, runs
              the initial state's OnEnter hooks and inserts the entity, then runs the
              OnTransition hooks. The step recorded is core/app/statemachine.CreateEvent.

              It returns the entity as stored. It refuses an entity whose key is empty
              ([corestm.KeyEmpty]) or already taken ([corestm.EntityExists]), and a call made through the
              context an OnEnter hook of this machine was given ([corestm.Reentrant]).
            in:
              - name: ctx
                type: context.Context
              - name: entity
                type: E
            name: Start
            out:
              - type: E
              - type: error
            recv: pointer
          - doc: |-
              Fire moves the entity under key along the event transition by that name
              leaving its current state, and returns it as stored.

              It refuses a key the store does not hold ([corestm.EntityMissing]), an event no
              transition takes from the entity's state ([corestm.TransitionRefused] — returned
              with the entity, whose state says why), and a call made through the context
              an OnEnter hook of this machine was given ([corestm.Reentrant]). On any other
              failure — a hook, the store — it returns the entity as it was read.
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: event
                type: string
            name: Fire
            out:
              - type: E
              - type: error
            recv: pointer
        name: StateMachine
        struct:
          fields:
            - name: store
              type: corestm.Store[E]
            - name: plan
              type: "*blueprint[E, S]"
            - name: book
              type: "*book[S]"
            - name: agenda
              type: "*agenda"
            - name: locks
              type: "*keyLocks"
            - name: cfg
              type: settings[E, S]
            - doc: running is held by a Run or a Step while it goes.
              name: running
              type: atomic.Bool
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
  - doc: |-
      Package statemachine is a state-machine engine over stored entities (ADR
      0120): declare the states an entity goes through and the transitions between
      them, hand the engine your store, and it moves entities along — on the
      events you fire, and by itself on timers, deadlines and guards.

      	def := statemachine.Define(func(o *Order) *Status { return &o.Status }).
      	    Initial(Pending).
      	    On("pay", Pending, Paid).
      	    After("abandon", 24*time.Hour, Pending, Cancelled).    // a duration in the state
      	    At("expire", Paid, Expired, func(o Order) (time.Time, bool) { return o.ShipBy, !o.ShipBy.IsZero() }).
      	    When("ready", Paid, Shipping, func(o Order) bool { return o.Packed }).
      	    OnEnter(Paid, chargeCard).                               // before the store: an error cancels
      	    OnTransition(publish)                                    // after the store: an error is reported

      	m, err := statemachine.New(ctx, def, &statemachine.Config[Order, Status]{
      	    Store: orders, Journal: records,
      	    Report: func(ctx context.Context, err error) { log.Print(err) }, // what no return value carries
      	})
      	go func() {
      	    if err := m.Run(ctx); err != nil {                       // LoopRunning: another loop is going
      	        log.Print(err)
      	    }
      	}()                                                          // fires timers, deadlines and guards
      	o, err := m.Start(ctx, Order{ID: "o-1"})                     // Pending, inserted
      	o, err = m.Fire(ctx, "o-1", "pay")                           // Paid, replaced

      # Your store is the source of truth

      The state is a field of your entity and the entity lives in your [Store]:
      the engine reads it with Get, creates with Insert and moves with Replace — a
      Replace that finds the entity gone stores nothing, so a transition never
      brings back an entity deleted meanwhile. Beside the store the machine keeps
      one [Record] per entity — its state, since when, its latest transitions — in
      memory and in the [Journal] you give it, which is what keeps an After timer
      counting across a restart. Tell the machine about writes it did not make
      with Machine.Changed and Machine.Deleted: a write can move a deadline or
      make a guard hold, and a state changed behind its back enters its record as
      of the moment the machine learns of it.

      # Transitions

      Transitions of one entity run one at a time, transitions of different
      entities concurrently. A transition runs the OnEnter hooks of the state
      entered, stores the entity, records the step, releases the entity and then
      runs the OnTransition hooks. A hook that panics fails what it was part of —
      an OnEnter hook its transition, an OnTransition hook only itself — and never
      leaves an entity locked. An OnEnter hook may change the entity but not its
      state or key, and must not fire its own machine (Reentrant); an
      OnTransition hook may.

      # The loop never polls

      Machine.Run keeps an agenda: each entity in a state a timer or a guard
      leaves has one entry, the instant its earliest automatic transition falls
      due, on a heap. The loop fires what is due — per entity, the first declared
      transition due — and sleeps until the next one or until a write wakes it,
      never sooner than Config.MinGap after its last run, so a burst of writes is
      one run. Finding the next transition due costs O(log N) where a loop that
      re-reads the store on every wake pays O(N); BENCH.md in the engine measures
      both. An entity whose transition fails is retried after Config.Backoff,
      counted per entity. Give the machine a clock.ManualClock (pkg/v1/clock) and
      a test drives every timer.

      # What it does not do

      It is not a durable workflow runtime: there is no replay, no activity, no
      compensation, and nothing survives a crash but what your store and your
      journal hold. A write to an entity that does not go through the machine can
      race with a transition of it; the store's Replace is the arbiter.
    facade:
      - const:
          - doc: |-
              CreateEvent is the event name of the step that brings a new entity into its
              initial state; no declared transition may take it.
            name: CreateEvent
            reexport: corestm.CreateEvent
            type: string
            typed: true
            value: "\"create\""
      - const:
          - doc: |-
              DefaultMinGap is the least time between two runs of the loop when
              Config.MinGap is not positive.
            name: DefaultMinGap
            reexport: svcstm.DefaultMinGap
            type: time.Duration
            typed: true
            value: "1000000000"
      - const:
          - doc: |-
              DefaultMaxHistory is how many transitions a Record keeps when
              Config.MaxHistory is not positive.
            name: DefaultMaxHistory
            reexport: svcstm.DefaultMaxHistory
            type: int
            typed: true
            value: "20"
      - const:
          - doc: "TriggerStart is a Start: the entity entered its initial state."
            name: TriggerStart
            reexport: corestm.TriggerStart
            type: Trigger
            typed: true
            value: "1"
      - const:
          - doc: TriggerEvent is an event a caller fired.
            name: TriggerEvent
            reexport: corestm.TriggerEvent
            type: Trigger
            typed: true
            value: "2"
      - const:
          - doc: TriggerDelay is a duration the entity spent in its state (Definition.After).
            name: TriggerDelay
            reexport: corestm.TriggerDelay
            type: Trigger
            typed: true
            value: "3"
      - const:
          - doc: |-
              TriggerDeadline is the arrival of an instant the entity carries
              (Definition.At).
            name: TriggerDeadline
            reexport: corestm.TriggerDeadline
            type: Trigger
            typed: true
            value: "4"
      - const:
          - doc: |-
              TriggerGuard is a guard on the entity that held after a write
              (Definition.When).
            name: TriggerGuard
            reexport: corestm.TriggerGuard
            type: Trigger
            typed: true
            value: "5"
      - const:
          - doc: WakeStart is the first run, when Run starts.
            name: WakeStart
            reexport: svcstm.WakeStart
            type: Wake
            typed: true
            value: "1"
      - const:
          - doc: "WakeDue is a run the loop woke for by itself: a transition fell due."
            name: WakeDue
            reexport: svcstm.WakeDue
            type: Wake
            typed: true
            value: "2"
      - const:
          - doc: WakeChange is a run a write woke the loop for.
            name: WakeChange
            reexport: svcstm.WakeChange
            type: Wake
            typed: true
            value: "3"
      - const:
          - doc: "LoopRunStarted reports a run starting: Wake and Started are set."
            name: LoopRunStarted
            reexport: svcstm.LoopRunStarted
            type: LoopEventKind
            typed: true
            value: "1"
      - const:
          - doc: "LoopRunEnded reports a run ending: every field is set."
            name: LoopRunEnded
            reexport: svcstm.LoopRunEnded
            type: LoopEventKind
            typed: true
            value: "2"
      - const:
          - doc: |-
              LoopWaiting reports the loop re-armed to wake earlier, at Next, because a
              write arrived while it slept.
            name: LoopWaiting
            reexport: svcstm.LoopWaiting
            type: LoopEventKind
            typed: true
            value: "3"
      - const:
          - doc: CodeTriggerUnknown identifies a name ParseTrigger does not know (0.2.56.1).
            name: CodeTriggerUnknown
            reexport: corestm.CodeTriggerUnknown
            type: errs.Code
            typed: true
            value: "0x00_02_38_01"
      - const:
          - doc: |-
              CodeTransitionRefused identifies an event no declared transition takes from
              the entity's state (0.3.88.1).
            name: CodeTransitionRefused
            reexport: corestm.CodeTransitionRefused
            type: errs.Code
            typed: true
            value: "0x00_03_58_01"
      - const:
          - doc: |-
              CodeEntityMissing identifies a key the store holds no entity under — never
              there, or deleted while a transition ran (0.3.88.2).
            name: CodeEntityMissing
            reexport: corestm.CodeEntityMissing
            type: errs.Code
            typed: true
            value: "0x00_03_58_02"
      - const:
          - doc: |-
              CodeEntityExists identifies a Start whose entity's key the store already
              holds (0.3.88.3).
            name: CodeEntityExists
            reexport: corestm.CodeEntityExists
            type: errs.Code
            typed: true
            value: "0x00_03_58_03"
      - const:
          - doc: |-
              CodeKeyEmpty identifies an entity handed to Start whose key is empty
              (0.3.88.4).
            name: CodeKeyEmpty
            reexport: corestm.CodeKeyEmpty
            type: errs.Code
            typed: true
            value: "0x00_03_58_04"
      - const:
          - doc: CodeHookFailed identifies a hook that returned an error (0.3.88.5).
            name: CodeHookFailed
            reexport: corestm.CodeHookFailed
            type: errs.Code
            typed: true
            value: "0x00_03_58_05"
      - const:
          - doc: |-
              CodeHookPanicked identifies a hook that panicked, recovered as an error
              (0.3.88.6).
            name: CodeHookPanicked
            reexport: corestm.CodeHookPanicked
            type: errs.Code
            typed: true
            value: "0x00_03_58_06"
      - const:
          - doc: |-
              CodeHookChangedState identifies an OnEnter hook that changed the state it
              was entering (0.3.88.7).
            name: CodeHookChangedState
            reexport: corestm.CodeHookChangedState
            type: errs.Code
            typed: true
            value: "0x00_03_58_07"
      - const:
          - doc: |-
              CodeHookChangedKey identifies an OnEnter hook that changed its entity's key
              (0.3.88.8).
            name: CodeHookChangedKey
            reexport: corestm.CodeHookChangedKey
            type: errs.Code
            typed: true
            value: "0x00_03_58_08"
      - const:
          - doc: |-
              CodeReentrant identifies a Start or Fire through the context an OnEnter hook
              of the same machine was given (0.3.88.9).
            name: CodeReentrant
            reexport: corestm.CodeReentrant
            type: errs.Code
            typed: true
            value: "0x00_03_58_09"
      - const:
          - doc: |-
              CodeStoreFailed identifies a Store method that returned an error
              (0.3.88.10).
            name: CodeStoreFailed
            reexport: corestm.CodeStoreFailed
            type: errs.Code
            typed: true
            value: "0x00_03_58_0A"
      - const:
          - doc: |-
              CodeJournalFailed identifies a Journal method that returned an error
              (0.3.88.11).
            name: CodeJournalFailed
            reexport: corestm.CodeJournalFailed
            type: errs.Code
            typed: true
            value: "0x00_03_58_0B"
      - const:
          - doc: |-
              CodeLoopRunning identifies a Run or a Step asked for while another is going
              (0.3.88.12).
            name: CodeLoopRunning
            reexport: corestm.CodeLoopRunning
            type: errs.Code
            typed: true
            value: "0x00_03_58_0C"
      - const:
          - doc: |-
              CodeFunctionPanicked identifies a guard or an instant function that panicked
              (0.3.88.13).
            name: CodeFunctionPanicked
            reexport: corestm.CodeFunctionPanicked
            type: errs.Code
            typed: true
            value: "0x00_03_58_0D"
      - const:
          - doc: |-
              CodeInitialMissing identifies a definition with no initial state
              (0.3.88.14).
            name: CodeInitialMissing
            reexport: corestm.CodeInitialMissing
            type: errs.Code
            typed: true
            value: "0x00_03_58_0E"
      - const:
          - doc: |-
              CodeEventInvalid identifies a transition declared with an empty event name,
              or CreateEvent (0.3.88.15).
            name: CodeEventInvalid
            reexport: corestm.CodeEventInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_58_0F"
      - const:
          - doc: |-
              CodeTransitionDuplicate identifies a second transition declared for one
              event from one state (0.3.88.16).
            name: CodeTransitionDuplicate
            reexport: corestm.CodeTransitionDuplicate
            type: errs.Code
            typed: true
            value: "0x00_03_58_10"
      - const:
          - doc: |-
              CodeDelayInvalid identifies an After with a duration that is not positive
              (0.3.88.17).
            name: CodeDelayInvalid
            reexport: corestm.CodeDelayInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_58_11"
      - const:
          - doc: |-
              CodeFunctionMissing identifies a nil accessor, guard, instant function, hook
              or definition (0.3.88.18).
            name: CodeFunctionMissing
            reexport: corestm.CodeFunctionMissing
            type: errs.Code
            typed: true
            value: "0x00_03_58_12"
      - const:
          - doc: CodeStoreMissing identifies a configuration with no store (0.3.88.19).
            name: CodeStoreMissing
            reexport: corestm.CodeStoreMissing
            type: errs.Code
            typed: true
            value: "0x00_03_58_13"
      - const:
          - doc: |-
              CodeWaitAbandoned identifies a caller whose context ended while the entity
              was busy (0.3.88.20).
            name: CodeWaitAbandoned
            reexport: corestm.CodeWaitAbandoned
            type: errs.Code
            typed: true
            value: "0x00_03_58_14"
      - const:
          - doc: |-
              CodeLoopPanicked identifies a panic the loop recovered from a store, journal
              or observer call (0.3.88.21).
            name: CodeLoopPanicked
            reexport: corestm.CodeLoopPanicked
            type: errs.Code
            typed: true
            value: "0x00_03_58_15"
      - var:
          - doc: TriggerUnknown refuses a trigger name outside the five.
            name: TriggerUnknown
            reexport: corestm.TriggerUnknown
            type: "*errs.Error"
          - blank: true
            doc: |-
              TransitionRefused is returned when no transition by that event leaves the
              entity's state (409); the entity comes back with it.
            name: TransitionRefused
            reexport: corestm.TransitionRefused
            type: "*errs.Error"
          - blank: true
            doc: |-
              EntityMissing is returned for a key the store holds no entity under, or one
              deleted while the transition ran (404).
            name: EntityMissing
            reexport: corestm.EntityMissing
            type: "*errs.Error"
          - blank: true
            doc: EntityExists is returned by a Start over a key already taken (409).
            name: EntityExists
            reexport: corestm.EntityExists
            type: "*errs.Error"
          - blank: true
            doc: KeyEmpty is returned by a Start with an entity whose key is empty.
            name: KeyEmpty
            reexport: corestm.KeyEmpty
            type: "*errs.Error"
          - blank: true
            doc: HookFailed accompanies a hook's own error, joined beside it.
            name: HookFailed
            reexport: corestm.HookFailed
            type: "*errs.Error"
          - blank: true
            doc: |-
              HookPanicked is a hook that panicked and was recovered; the value and the
              stack are log-only fields.
            name: HookPanicked
            reexport: corestm.HookPanicked
            type: "*errs.Error"
          - blank: true
            doc: HookChangedState is an OnEnter hook that changed the state it was entering.
            name: HookChangedState
            reexport: corestm.HookChangedState
            type: "*errs.Error"
          - blank: true
            doc: HookChangedKey is an OnEnter hook that changed its entity's key.
            name: HookChangedKey
            reexport: corestm.HookChangedKey
            type: "*errs.Error"
          - blank: true
            doc: |-
              Reentrant is a Start or Fire through the context an OnEnter hook of the same
              machine was given: refused, not deadlocked.
            name: Reentrant
            reexport: corestm.Reentrant
            type: "*errs.Error"
          - blank: true
            doc: StoreFailed wraps an error a Store method returned.
            name: StoreFailed
            reexport: corestm.StoreFailed
            type: "*errs.Error"
          - blank: true
            doc: JournalFailed wraps an error a Journal method returned.
            name: JournalFailed
            reexport: corestm.JournalFailed
            type: "*errs.Error"
          - blank: true
            doc: LoopRunning is returned by Run or Step while another is going.
            name: LoopRunning
            reexport: corestm.LoopRunning
            type: "*errs.Error"
          - blank: true
            doc: |-
              FunctionPanicked is a guard or an instant function that panicked; the entity
              is retried after its backoff.
            name: FunctionPanicked
            reexport: corestm.FunctionPanicked
            type: "*errs.Error"
          - blank: true
            doc: |-
              InitialMissing is returned by New for a definition that never called
              Initial.
            name: InitialMissing
            reexport: corestm.InitialMissing
            type: "*errs.Error"
          - blank: true
            doc: |-
              EventInvalid is a transition declared with an empty event name, or
              CreateEvent.
            name: EventInvalid
            reexport: corestm.EventInvalid
            type: "*errs.Error"
          - blank: true
            doc: TransitionDuplicate is one event declared twice from one state.
            name: TransitionDuplicate
            reexport: corestm.TransitionDuplicate
            type: "*errs.Error"
          - blank: true
            doc: DelayInvalid is an After with a duration that is not positive.
            name: DelayInvalid
            reexport: corestm.DelayInvalid
            type: "*errs.Error"
          - blank: true
            doc: |-
              FunctionMissing is a nil accessor, guard, instant function, hook or
              definition.
            name: FunctionMissing
            reexport: corestm.FunctionMissing
            type: "*errs.Error"
          - blank: true
            doc: StoreMissing is returned by New when Config.Store is nil.
            name: StoreMissing
            reexport: corestm.StoreMissing
            type: "*errs.Error"
          - blank: true
            doc: |-
              WaitAbandoned is returned when the context ended while the entity was busy
              (503); errors.Is still finds the context's error.
            name: WaitAbandoned
            reexport: corestm.WaitAbandoned
            type: "*errs.Error"
          - blank: true
            doc: |-
              LoopPanicked is a panic the loop recovered from a store, journal or observer
              call: the entity is retried after its backoff, unless it came from the
              observer's end, once the transition was stored.
            name: LoopPanicked
            reexport: corestm.LoopPanicked
            type: "*errs.Error"
      - alias:
          - doc: |-
              Store is the port your entities are read and written through. It is frozen
              at five methods.
            name: Store
            target: corestm.Store[E]
            typeParams:
              - constraint: any
                name: E
      - alias:
          - doc: |-
              Journal is the port the machine keeps its records in, beside your store.
              It is frozen at three methods.
            name: Journal
            target: corestm.Journal[S]
            typeParams:
              - constraint: comparable
                name: S
      - alias:
          - doc: |-
              Record is what the machine keeps about one entity: its state, since when,
              and its latest transitions.
            name: Record
            target: corestm.RecordValue[S]
            typeParams:
              - constraint: comparable
                name: S
      - alias:
          - doc: Step is one transition in a Record's history.
            name: Step
            target: corestm.StepValue[S]
            typeParams:
              - constraint: comparable
                name: S
      - alias:
          - doc: |-
              Trigger says what fired a transition: a start, an event, a delay, a
              deadline or a guard.
            name: Trigger
            target: corestm.Trigger
      - alias:
          - doc: "Definition declares a machine: its states, transitions and hooks."
            name: Definition
            target: svcstm.MachineSpec[E, S]
            typeParams:
              - constraint: any
                name: E
              - constraint: comparable
                name: S
      - alias:
          - doc: Transition is a declared transition, as Definition.Transitions reads it back.
            name: Transition
            target: svcstm.TransitionValue[S]
            typeParams:
              - constraint: comparable
                name: S
      - alias:
          - doc: Change is a stored transition, as an OnTransition hook receives it.
            name: Change
            target: svcstm.ChangeValue[E, S]
            typeParams:
              - constraint: any
                name: E
              - constraint: comparable
                name: S
      - alias:
          - doc: Config parameterises New. Only Store is required.
            name: Config
            target: svcstm.Config[E, S]
            typeParams:
              - constraint: any
                name: E
              - constraint: comparable
                name: S
      - alias:
          - doc: |-
              Firing is a transition the machine's own loop is about to fire, as
              Config.Observe is told it.
            name: Firing
            target: svcstm.FiringValue[S]
            typeParams:
              - constraint: comparable
                name: S
      - alias:
          - doc: Machine runs a Definition over a Store. It is safe for concurrent use.
            name: Machine
            target: svcstm.StateMachine[E, S]
            typeParams:
              - constraint: any
                name: E
              - constraint: comparable
                name: S
      - alias:
          - doc: Wake says why a run of the loop started.
            name: Wake
            target: svcstm.Wake
      - alias:
          - doc: LoopEvent is what Config.OnLoop is told about Run.
            name: LoopEvent
            target: svcstm.LoopEvent
      - alias:
          - doc: LoopEventKind says what a LoopEvent reports.
            name: LoopEventKind
            target: svcstm.LoopEventKind
      - func:
          doc: |-
            Define starts the declaration of a machine over entities of type E. state
            returns a pointer to the entity's state field.
          forward: svcstm.NewMachineSpec
          in:
            - name: state
              type: func(*E) *S
          name: Define
          out:
            - type: "*Definition[E, S]"
          typeParams:
            - constraint: any
              name: E
            - constraint: comparable
              name: S
      - func:
          doc: |-
            New checks def and cfg and opens a machine over cfg.Store: it reads the
            journal and every entity once, reconciles them and schedules what is due.
            Every problem of the declaration is returned at once, joined.
          forward: svcstm.NewStateMachine
          in:
            - name: ctx
              type: context.Context
            - name: def
              type: "*Definition[E, S]"
            - name: cfg
              type: "*Config[E, S]"
          name: New
          out:
            - type: "*Machine[E, S]"
            - type: error
          typeParams:
            - constraint: any
              name: E
            - constraint: comparable
              name: S
      - func:
          doc: |-
            ParseTrigger reads a trigger's name — "start", "event", "delay", "deadline"
            or "guard" — as Trigger.String writes it.
          forward: corestm.ParseTrigger
          in:
            - name: name
              type: string
          name: ParseTrigger
          out:
            - type: Trigger
            - type: error
    imports:
      corestm: github.com/kitsunium/sdk/internal/core/app/statemachine
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcstm: github.com/kitsunium/sdk/internal/service/app/statemachine
    path: github.com/kitsunium/sdk/pkg/v1/app/statemachine
