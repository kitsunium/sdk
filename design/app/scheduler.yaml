apiVersion: kit.kitsunium/design/v2
domain: app/scheduler
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidEntry identifies an Add refused because the entry could never
              run: an empty name, a nil Job, or a nil Schedule.
            name: CodeInvalidEntry
            note: "range: 0.2.12.0 - 0.2.12.255"
            value: "0x00_02_0C_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateJob identifies an Add refused because the entry's name is
              already registered on this Scheduler.
            name: CodeDuplicateJob
            value: "0x00_02_0C_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeSchedulerRunning identifies an Add or a second Run refused because the
              Scheduler is already running.
            name: CodeSchedulerRunning
            value: "0x00_02_0C_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeJobPanicked identifies a Job that panicked; the scheduler recovered,
              reported it as this entry's result, and kept running.
            name: CodeJobPanicked
            value: "0x00_02_0C_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidExpression identifies a cron expression this parser understands
              the shape of but cannot accept: a malformed field, a value outside its
              field's range, an inverted range, a non-positive step.
            name: CodeInvalidExpression
            note: |-
              range: 0.3.43.0 - 0.3.43.255

              The parser's refusals of a schedule. The range was allocated to
              internal/service/app/scheduler, which raises these codes while it parses a
              cron expression or an interval, and it is declared here with the
              registration refusals so that every code of the domain is in one place
              (ADR 0160). A code keeps the value its allocation gave it whichever layer
              declares it, so the layer byte still reads 3.
            value: "0x00_03_2B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedSyntax identifies a cron construct that exists in some other
              dialect and that this parser refuses BY NAME rather than by guessing: a
              six-field (seconds) expression, @reboot, @every, and the Quartz L / W / # /
              ? operators.
            name: CodeUnsupportedSyntax
            value: "0x00_03_2B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnreachableSchedule identifies a syntactically valid expression that
              matches no instant on the calendar — "31 April", "30 February" — and is
              therefore refused at construction rather than registered as a job that would
              never run.
            name: CodeUnreachableSchedule
            value: "0x00_03_2B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidLocation identifies a nil *time.Location handed to
              ParseInLocation, which is what an unchecked time.LoadLocation looks like.
            name: CodeInvalidLocation
            value: "0x00_03_2B_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidInterval identifies a non-positive duration handed to Every,
              which would be a schedule due infinitely often.
            name: CodeInvalidInterval
            value: "0x00_03_2B_05"
        type: errs.Code
    doc: |-
      Package scheduler — ranges 0.2.12.* (ADR 0041 core/app/scheduler block) and
      0.3.43.* (ADR 0041 service/app/scheduler block, declared here since ADR 0160).

      Package scheduler — declares the sentinel *errs.Error outcomes of the
      domain: the registration refusals, and the parser's refusals of a schedule.
      Each var's name equals its errs.Define Reason in SCREAMING_SNAKE form.

      Package scheduler declares the time-driven execution port of the SDK: the
      [Job] that runs, the [Schedule] that says when, and the [Scheduler] that
      owns the pairing and fires it. A core sibling admitted by ADR 0041.

      Both halves of the contract are FUNCTION ports rather than interfaces — the
      shape internal/core/CLAUDE.md already admits for resilience.Operation. Each
      is a single behaviour, so a named func IS the contract and needs no adapter
      at the call site; it is also the narrowest thing pkg/v1 can publish. ADR
      0039's lesson is that a published port cannot grow a method without breaking
      every downstream implementer at compile time, and a func type cannot grow
      one at all.

      The concrete schedules (a POSIX cron expression, a fixed interval) and the
      engine that drives them live in internal/service/app/scheduler; this package
      owns only the contract, the two domain values, and the typed sentinels the
      engine emits. Cron vocabulary deliberately does not appear here: the port
      knows about instants, not about expressions.

      Package scheduler — hosts EntryValue, the registration a Scheduler owns.

      Package scheduler — hosts ResultValue, the record of one scheduling decision.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/scheduler
    ports:
      - doc: |-
          Scheduler owns a set of named [EntryValue] pairings and fires them.
          Implementations MUST be safe for concurrent use.

          IFACE-PLUGIN: the concrete engine stays unexported behind its constructor in
          internal/service/app/scheduler.
        methods:
          - doc: |-
              Add registers an entry. It is refused while Run is executing
              ([SchedulerRunning]), on a name already registered ([DuplicateJob]), and
              on an entry that is not runnable — empty name, nil Job, nil Schedule
              ([InvalidEntry]).
            in:
              - name: entry
                type: EntryValue
            name: Add
            out:
              - type: error
          - doc: |-
              Run drives the registered entries until ctx is cancelled, then waits for
              every in-flight job to return and reports nil. A Scheduler with no entry
              is legitimate and simply waits for ctx: only an unrunnable ENTRY is
              refused, never an empty entry set. Run is itself refused with
              [SchedulerRunning] while already running; once it returns, the Scheduler
              may be added to and run again.
            in:
              - name: ctx
                type: context.Context
            name: Run
            out:
              - type: error
        name: Scheduler
    sentinels:
      - var:
          - code: CodeInvalidEntry
            doc: InvalidEntry is returned by Add for an entry that could never run.
            name: InvalidEntry
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/scheduler: entry has an empty name, a nil Job or a nil Schedule; the field names which"
            public: The scheduler entry is not runnable and was refused
            reason: INVALID_ENTRY
          - code: CodeDuplicateJob
            doc: DuplicateJob is returned by Add when the entry's name is already taken.
            name: DuplicateJob
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/scheduler: entry names are unique per Scheduler; the field carries the name"
            public: A job is already registered under that name
            reason: DUPLICATE_JOB
          - code: CodeSchedulerRunning
            doc: |-
              SchedulerRunning is returned by Add, and by a second Run, while the
              Scheduler is running. The entry set is fixed for the duration of a Run
              so the loop needs no wake-up channel and no lock on its hot path; adding
              between runs is allowed.
            name: SchedulerRunning
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/scheduler: the entry set is frozen for the duration of a Run; add before Run, or after it returns"
            public: The scheduler is already running
            reason: SCHEDULER_RUNNING
          - code: CodeJobPanicked
            doc: |-
              JobPanicked is the result Err for a Job that panicked. The scheduler
              recovers it rather than letting it reach the runtime, because one job's
              bug must not take the process — and every other job — down with it. The
              recovered value travels as a field; it is never the wrap origin, so a
              panicking job cannot hijack this code.
            name: JobPanicked
            private: "core/app/scheduler: job panicked; the scheduler recovered and kept running — the fields carry the job name and the panic value"
            public: The scheduled job panicked and was recovered
            reason: JOB_PANICKED
          - code: CodeInvalidExpression
            doc: |-
              InvalidExpression is returned by Parse for a malformed or out-of-range
              cron field.
            name: InvalidExpression
            note: |-
              The parser's refusals of a schedule the caller wrote down, raised by
              internal/service/app/scheduler. They are declared here, with the
              registration refusals, so that the domain's codes and sentinels are in one
              place (ADR 0160).
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/scheduler: cron field malformed or out of range; the fields name the field, the item and the accepted range"
            public: The cron expression is not valid
            reason: INVALID_EXPRESSION
          - code: CodeUnsupportedSyntax
            doc: |-
              UnsupportedSyntax is returned by Parse for a construct this subset
              refuses by name instead of interpreting. Refusing loudly is the whole
              point: a parser that silently ignores a Quartz "L" would run a job on
              the wrong day and report success.
            name: UnsupportedSyntax
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/scheduler: five-field POSIX cron plus @yearly/@monthly/@weekly/@daily/@hourly only; the fields name what was rejected"
            public: That cron syntax is outside the accepted subset
            reason: UNSUPPORTED_SYNTAX
          - code: CodeUnreachableSchedule
            doc: |-
              UnreachableSchedule is returned by Parse for a valid expression that
              matches no instant within the search horizon.
            name: UnreachableSchedule
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/scheduler: expression parsed but no instant matches within the horizon — e.g. day 31 of a 30-day month"
            public: The cron expression matches no date on the calendar
            reason: UNREACHABLE_SCHEDULE
          - code: CodeInvalidLocation
            doc: InvalidLocation is returned by ParseInLocation for a nil location.
            name: InvalidLocation
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/scheduler: ParseInLocation needs a non-nil *time.Location; use Parse for UTC"
            public: A time zone is required and none was given
            reason: INVALID_LOCATION
          - code: CodeInvalidInterval
            doc: InvalidInterval is returned by Every for a non-positive duration.
            name: InvalidInterval
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/scheduler: Every needs a positive period; a non-positive one is due infinitely often"
            public: The interval must be greater than zero
            reason: INVALID_INTERVAL
    types:
      - doc: |-
          Job is the unit of work a [Scheduler] fires. It MUST honour ctx: the
          scheduler passes the context Run was called with, so cancelling that context
          is how a shutdown reaches a running job. A Job that ignores ctx delays Run's
          return by its own duration — the scheduler waits for it rather than
          abandoning it, because a job still running after the caller believes the
          scheduler stopped is worse than a slow shutdown.

          A Job's error is reported through [ResultValue] and is otherwise ignored: a
          failing job never stops the scheduler and never affects another entry.
        name: Job
        underlying: func(ctx context.Context) error
      - doc: |-
          Schedule reports the first instant STRICTLY after `after` at which a job is
          due, and whether such an instant exists at all. A false second return means
          the schedule will never fire again; the scheduler disarms that entry and
          keeps running the others.

          Implementations MUST be pure — the same `after` always yields the same
          answer — and MUST be safe for concurrent use. The scheduler calls Next
          repeatedly, including several times in one pass when fires were missed, and
          a Schedule returning a value that is not strictly after its argument would
          make that loop spin forever.
        name: Schedule
        underlying: func(after time.Time) (next time.Time, ok bool)
      - doc: |-
          EntryValue is one registered pairing of a [Schedule] with a [Job], under a
          name that identifies it in every [ResultValue] and every error field.

          The zero value is not runnable and is refused by Add ([InvalidEntry]) rather
          than accepted and silently never fired.
        name: EntryValue
        struct:
          fields:
            - doc: |-
                Name identifies the entry in results and errors. It must be non-empty
                and unique within one Scheduler.
              name: Name
              type: string
            - doc: Schedule decides when the Job is due.
              name: Schedule
              type: Schedule
            - doc: Job is the work to run.
              name: Job
              type: Job
            - doc: |-
                AllowOverlap permits a fire while the previous run of THIS entry has not
                returned. The zero value (false) skips that fire and reports it as
                [ResultValue.Skipped] — the safe default, because the SDK cannot know
                whether two concurrent copies of a Job are safe and the symptom of
                getting it wrong is a duplicated side effect rather than an error.
                Setting it is the caller's in-code assertion that concurrent copies are
                safe, the same instrument resilience.HedgeConfig.Idempotent uses for the
                same class of claim (ADR 0031).
              name: AllowOverlap
              type: bool
      - doc: |-
          ResultValue is what a [Scheduler] reports for every decision it takes about
          an entry — a run that happened, and a fire that was deliberately not run.
          Reporting the second is the point: a scheduler that only reports runs makes
          a permanently-skipped entry indistinguishable from an entry that is doing
          its job.

          It is also the SDK's own test instrument. Because every decision emits one,
          a test can WAIT for the decision it expects instead of sleeping to prove a
          negative — which is what lets the scheduler suite assert cadences, missed
          deadlines and overlap without a single time.Sleep.

          This is a published concrete shape (pkg/v1/app/scheduler.Result is an alias), so
          ADR 0040 applies: it may still gain or change a field while the module is
          v0, loudly and in the commit message, and not after v1.
        name: ResultValue
        struct:
          fields:
            - doc: Name is the entry's registered name.
              name: Name
              type: string
            - doc: |-
                Scheduled is the due instant this decision stands for. When fires were
                missed it is the LATEST due instant at or before the wake-up, never the
                oldest: the scheduler skips rather than catches up, so the run that
                happens is the current one and the stale ones are what got dropped.
              name: Scheduled
              type: time.Time
            - doc: Started is when the Job was invoked. Zero when Skipped.
              name: Started
              type: time.Time
            - doc: Finished is when the Job returned. Zero when Skipped.
              name: Finished
              type: time.Time
            - doc: |-
                Missed counts the due instants that were dropped because they had
                already passed when the scheduler woke — a machine that slept, a
                timer that overran, a job that held the slot. It never causes extra
                runs; it exists so "skip" is not the same thing as "silently drop".

                It counts only instants missed WITHIN one Run: the scheduler keeps no
                state across restarts, so fires missed while the process was down are
                not visible to it and are not counted here.
              name: Missed
              type: int
            - doc: |-
                Skipped reports that the fire was not run because the previous run of
                this entry had not returned and AllowOverlap is false.
              name: Skipped
              type: bool
            - doc: |-
                Err is the Job's own error, verbatim and unwrapped, so errors.Is against
                the caller's own sentinels keeps working. It is [JobPanicked] when the
                Job panicked and the scheduler recovered.
              name: Err
              type: error
  - doc: |-
      Package scheduler — hosts Config, the engine's construction parameters.

      Package scheduler provides the concrete half of the scheduling domain: a
      five-field POSIX cron parser, a fixed-interval schedule, and the engine that
      fires core/app/scheduler.Job values through core/app/scheduler.Schedule. ADR 0041.

      The engine depends on internal/kernel/clock.Timed, never on package time
      directly, so a test drives cadence, missed deadlines and overlap by moving a
      ManualClock instead of sleeping (ADR 0039).

      Cross-OS: 100% portable Go (time, context, sync, sync/atomic, strconv,
      strings). Cron's finest field is the minute, which is deliberately coarser
      than any platform's timer resolution — see CLAUDE.md §What is guaranteed.

      Package scheduler — hosts the calendar cursor the cron walk advances.

      Package scheduler — hosts entry, the engine's per-registration state.

      Package scheduler — hosts Every, the fixed-interval Schedule.

      Package scheduler — hosts fieldSpec, the description of one cron field and
      the parser that turns its text into a membership set.

      Package scheduler — the parser's refusal helpers. Every rejection names what
      was wrong in structured fields; the Public message stays a fixed literal.

      Package scheduler — hosts the run loop: waiting, firing, and draining.

      Package scheduler — hosts the engine: registration, and the state Run needs.
    functions:
      - doc: |-
          Parse compiles a five-field POSIX cron expression, evaluated in UTC.

          UTC is the default rather than time.Local because time.Local depends on TZ
          and on the host: the same expression would mean different instants on two
          machines in one fleet, and the difference would surface as a job that ran an
          hour early on one node. A caller who wants local time says so, with
          ParseInLocation(expr, time.Local).

          Accepted: five space-separated fields — minute (0-59), hour (0-23),
          day-of-month (1-31), month (1-12 or JAN-DEC), day-of-week (0-6 or SUN-SAT,
          Sunday = 0) — each of which may be "*", a value, an "a-b" range, a
          comma-separated list, or a "*/n" / "a-b/n" step. Names are
          case-insensitive. The macros @yearly, @annually, @monthly, @weekly, @daily,
          @midnight and @hourly expand to the expressions above.

          Refused, by name rather than by guessing: six- and seven-field expressions
          (seconds / year), @reboot, @every, the Quartz operators L, W, # and ?, a
          step written over a single value, an inverted range, 7 for Sunday, and a
          valid expression that matches no date on the calendar.

          When both day fields are restricted, POSIX makes them an OR: "0 0 13 * FRI"
          fires on every 13th AND on every Friday, not only on Friday the 13th.
        in:
          - name: expr
            type: string
        name: Parse
        out:
          - name: schedule
            type: coresched.Schedule
          - name: err
            type: error
      - doc: |-
          ParseInLocation compiles a cron expression evaluated in loc.

          A nil loc is REFUSED, not read as UTC: nil is what an unchecked
          time.LoadLocation returns on failure, so accepting it would turn a missing
          tzdata into a schedule that silently runs on a different clock. Parse is the
          way to ask for UTC.

          Around a DST transition in loc the semantics are exact and are not
          negotiable per caller:

            - Spring forward. A wall-clock time that does not exist that day does not
              fire. "0 2 * * *" in a zone that skips 02:00-03:00 skips that day
              entirely; it is not shifted to 01:00 or 03:00, because both of those are
              instants the expression does not name.
            - Fall back. A wall-clock time that happens twice fires ONCE, at the first
              occurrence. The schedule is strictly increasing by contract, and the
              second occurrence is behind the instant already returned.
        in:
          - name: expr
            type: string
          - name: loc
            type: "*time.Location"
        name: ParseInLocation
        out:
          - name: parsed
            type: coresched.Schedule
          - name: err
            type: error
      - doc: |-
          Every returns a [coresched.Schedule] due one period after each previous due
          instant. It exists because @every is refused by the cron parser: an interval
          is not a calendar expression, and pretending it is confuses two different
          ideas — "every 30 seconds" has no month, no weekday and no DST question,
          while "0 2 * * *" has all three.

          The period is measured from the previous DUE instant, not from the previous
          completion, so a slow job does not shift the cadence. When a run overruns
          its period the next fire is already late; the scheduler then applies the
          domain's missed-deadline rule (skip and count) rather than queueing.

          A non-positive period is refused ([coresched.InvalidInterval]) rather than clamped: a
          schedule due infinitely often is not a slow schedule, it is a busy loop, and
          no substitute value would be anything but a guess at the caller's intent
          (ADR 0031). Sub-minute periods are accepted here — unlike cron, which stops
          at the minute — but the timing guarantee is the domain's: not early, and
          late by however much the platform's timers and the machine's load impose.
        in:
          - name: period
            type: time.Duration
        name: Every
        out:
          - name: schedule
            type: coresched.Schedule
          - name: err
            type: error
      - doc: |-
          New returns a Scheduler built from cfg. It cannot fail: a nil Clock falls
          back to clock.System and a nil OnResult to no observation, both of which are
          working configurations rather than inert ones (ADR 0031). What CAN fail —
          an unrunnable entry, an unparseable expression — fails at Add and at Parse,
          where the caller made the mistake.
        in:
          - name: cfg
            type: Config
        name: New
        out:
          - type: coresched.Scheduler
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coresched: github.com/kitsunium/sdk/internal/core/app/scheduler
    path: github.com/kitsunium/sdk/internal/service/app/scheduler
    types:
      - doc: |-
          Config parameterises [New]. Both fields are optional and the zero value
          builds a working scheduler — one that runs on the wall clock and reports
          nothing.
        name: Config
        struct:
          fields:
            - doc: |-
                Clock is the time source the engine reads AND waits on. A nil Clock
                falls back to clock.System.

                It is clock.Timed rather than clock.Clock because this engine does both
                halves: it stamps results and it waits for deadlines. Depending on
                package time directly instead would make every cadence assertion in the
                test suite a sleep, which is the claim ADR 0039 exists to make true.
              name: Clock
              type: clock.Timed
            - doc: |-
                OnResult observes every decision the scheduler takes — each run, with
                the job's own error, and each fire skipped for overlap.

                Calls are SERIALISED: the hook need not be safe for concurrent use, and
                in exchange a hook that blocks blocks the scheduler. Keep it short; hand
                off to a logger or a channel rather than doing work in it.

                A nil hook is a working configuration, not a refusal: a caller whose
                jobs log their own failures has nothing to observe here. It does mean
                the job's error goes NOWHERE — the SDK will not write it to stderr on
                the caller's behalf (ADR 0030) — so a caller who wants to know their
                jobs are failing must wire this.
              name: OnResult
              type: func(coresched.ResultValue)
  - doc: |-
      Package scheduler is the public facade for the SDK's time-driven execution
      domain: a five-field POSIX cron parser, a fixed-interval schedule, and an
      engine that fires jobs on either.

      	sched := scheduler.New(scheduler.Config{
      	    OnResult: func(r scheduler.Result) { log.Info("job", "name", r.Name, "err", r.Err) },
      	})

      	nightly, err := scheduler.Parse("0 2 * * *") // 02:00 UTC, every day
      	if err != nil {
      	    return err // an unusable expression is refused HERE, not at 02:00
      	}
      	if err := sched.Add(scheduler.Entry{Name: "rollup", Schedule: nightly, Job: rollup}); err != nil {
      	    return err
      	}
      	err = sched.Run(ctx) // blocks until ctx is cancelled, then drains

      # What is refused, and when

      A [Scheduler] with no entries is legitimate — it runs empty and waits for
      its context, which is what a service with every job behind a feature flag
      looks like. An unusable ENTRY is not: an empty name, a nil Job or a nil
      Schedule is refused by [Scheduler].Add, and an unusable cron expression is
      refused by [Parse]. The two are different questions and the SDK answers them
      differently on purpose (ADR 0031).

      [Parse] refuses by name rather than by guessing. Six- and seven-field
      expressions (the seconds and year dialects), @reboot, @every, the Quartz
      operators L, W, # and ?, a step written over a single value, an inverted
      range, 7 for Sunday, and any expression that matches no date on the calendar
      — "0 0 30 2 *" — all come back as a typed error at construction. Fixed
      intervals are [Every], which is a different idea from a calendar expression
      and has a different name for that reason.

      # Time zones

      [Parse] evaluates in UTC. [ParseInLocation] takes any *time.Location, and
      refuses a nil one — nil is what an unchecked time.LoadLocation leaves you
      with, and reading it as UTC would silently run the job on a different clock.
      A named location needs the host's tz database or a blank import of
      time/tzdata in your binary; the SDK does not import it for you.

      Around a DST transition the rules are fixed and documented rather than
      emergent:

        - Spring forward — a wall-clock time that does not exist that day does not
          fire. "0 2 * * *" in a zone that skips 02:00-03:00 skips that day. It is
          not shifted to 01:00 or 03:00: those are instants the expression does
          not name.
        - Fall back — a wall-clock time that happens twice fires once, at the
          first occurrence.

      # Missed deadlines, and overlap

      The scheduler SKIPS and COUNTS. When the machine sleeps, or a run holds its
      slot past the next deadline, the job runs once for the most recent due
      instant and [Result].Missed reports how many older ones were dropped. It
      never replays them: a process that was down for a day would come back to a
      burst of stale work at the worst possible moment. Fires missed while the
      process was not running are invisible — this scheduler keeps no state across
      restarts.

      When a run has not returned by the next deadline, the default is to SKIP
      that fire and report it as [Result].Skipped. Queueing grows without bound
      behind a persistently slow job; running copies in parallel duplicates a side
      effect the SDK cannot know is safe. A caller who knows concurrent copies are
      safe says so with [Entry].AllowOverlap — an in-code assertion, like
      resilience.HedgeConfig.Idempotent, whose zero value is the safe answer.

      # What is guaranteed

      A job is never fired EARLY. Lateness has no upper bound: it is whatever the
      platform's timer resolution, the machine's load and the OS's scheduling
      impose, and on a machine that suspends it is unbounded. This is why cron's
      finest field here is the minute and why a seconds field is refused — a
      six-field expression would promise a resolution no GOOS in the SDK's support
      matrix delivers uniformly (ADR 0018).

      A failing job never stops the scheduler and never affects another entry. A
      PANICKING job is recovered, reported as [JobPanicked] in [Result].Err, and
      the scheduler keeps running — one job's bug must not take the process down.
      The [Config].OnResult hook is the caller's own code and is deliberately NOT
      recovered.
    facade:
      - alias:
          - doc: Job is the public alias for the ctx-aware unit of scheduled work.
            name: Job
            target: coresched.Job
      - alias:
          - doc: Schedule is the public alias for the "when is this next due" port.
            name: Schedule
            target: coresched.Schedule
      - alias:
          - doc: Scheduler is the public alias for the engine contract.
            name: Scheduler
            target: coresched.Scheduler
      - alias:
          - doc: Entry is the public alias for one named Schedule/Job registration.
            name: Entry
            target: coresched.EntryValue
      - alias:
          - doc: Result is the public alias for one reported scheduling decision.
            name: Result
            target: coresched.ResultValue
      - alias:
          - doc: Config is the public alias for the engine's construction parameters.
            name: Config
            target: svcsched.Config
      - var:
          - doc: |-
              InvalidEntry is returned by Add for an entry that could never run — an
              empty Name, a nil Schedule, a nil Job. The "missing" field names which.
            name: InvalidEntry
            reexport: coresched.InvalidEntry
            type: "*errs.Error"
          - doc: DuplicateJob is returned by Add when the name is already registered.
            name: DuplicateJob
            reexport: coresched.DuplicateJob
            type: "*errs.Error"
          - doc: |-
              SchedulerRunning is returned by Add, and by a second Run, while a Run is
              in progress. The entry set is frozen for the duration of a Run; add
              before it starts or after it returns.
            name: SchedulerRunning
            reexport: coresched.SchedulerRunning
            type: "*errs.Error"
          - doc: |-
              JobPanicked is the Result.Err of a job that panicked. The scheduler
              recovered it and kept running; the panic value travels as a field.
            name: JobPanicked
            reexport: coresched.JobPanicked
            type: "*errs.Error"
          - doc: |-
              InvalidExpression is returned by Parse for a malformed or out-of-range
              cron field.
            name: InvalidExpression
            reexport: coresched.InvalidExpression
            type: "*errs.Error"
          - doc: |-
              UnsupportedSyntax is returned by Parse for a construct from another cron
              dialect — a seconds field, @reboot, @every, L / W / # / ?.
            name: UnsupportedSyntax
            reexport: coresched.UnsupportedSyntax
            type: "*errs.Error"
          - doc: |-
              UnreachableSchedule is returned by Parse for a valid expression that
              matches no date on the calendar, such as "0 0 30 2 *".
            name: UnreachableSchedule
            reexport: coresched.UnreachableSchedule
            type: "*errs.Error"
          - doc: InvalidLocation is returned by ParseInLocation for a nil location.
            name: InvalidLocation
            reexport: coresched.InvalidLocation
            type: "*errs.Error"
          - doc: InvalidInterval is returned by Every for a non-positive period.
            name: InvalidInterval
            reexport: coresched.InvalidInterval
            type: "*errs.Error"
      - func:
          doc: |-
            New returns a Scheduler. It cannot fail: a nil cfg.Clock falls back to the
            wall clock and a nil cfg.OnResult to no observation, both of which are
            working configurations. What can fail fails at Add and at Parse.
          forward: svcsched.New
          in:
            - name: cfg
              type: Config
          name: New
          out:
            - type: Scheduler
      - func:
          doc: |-
            Parse compiles a five-field POSIX cron expression, evaluated in UTC. See the
            package documentation for the accepted subset and for what is refused.
          forward: svcsched.Parse
          in:
            - name: expr
              type: string
          name: Parse
          out:
            - name: schedule
              type: Schedule
            - name: err
              type: error
      - func:
          doc: |-
            ParseInLocation compiles a cron expression evaluated in loc. A nil loc is
            refused rather than read as UTC; use Parse to ask for UTC.
          forward: svcsched.ParseInLocation
          in:
            - name: expr
              type: string
            - name: loc
              type: "*time.Location"
          name: ParseInLocation
          out:
            - name: schedule
              type: Schedule
            - name: err
              type: error
      - func:
          doc: |-
            Every returns a Schedule due one period after each previous due instant. A
            non-positive period is refused. It is deliberately not spelled "@every":
            an interval is not a calendar expression.
          forward: svcsched.Every
          in:
            - name: period
              type: time.Duration
          name: Every
          out:
            - name: schedule
              type: Schedule
            - name: err
              type: error
    imports:
      coresched: github.com/kitsunium/sdk/internal/core/app/scheduler
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcsched: github.com/kitsunium/sdk/internal/service/app/scheduler
    path: github.com/kitsunium/sdk/pkg/v1/app/scheduler
