apiVersion: kit.kitsunium/design/v2
domain: app/view
packages:
  - aliases:
      - doc: |-
          TrustedHTML is an HTML fragment that the engine writes WITHOUT escaping.

          It is deliberately an ALIAS of html/template.HTML rather than a defined type
          of its own. That is not a convenience: html/template recognises its trust
          types by an exact type switch, so a `type TrustedHTML string` would be
          escaped like any other string — measured, it renders <b>hi</b> as
          &lt;b&gt;hi&lt;/b&gt; — and a trust type that does not actually confer trust
          is worse than none, because callers stop looking for the reason their markup
          disappeared.

          The alias has a consequence that is stated rather than hidden: because
          TrustedHTML and html/template.HTML are the same type, the engine cannot tell
          a fragment marked through [TrustHTML] from one a caller converted directly.
          What the SDK buys is therefore precise, and it is worth naming exactly:

            - Six of html/template's seven trust types — CSS, HTMLAttr, JS, JSStr,
              URL and Srcset — are REFUSED outright when they appear in render data,
              with the path that carries them named in the error. Those six have no
              SDK spelling at all.
            - The seventh has one canonical, greppable spelling, [TrustHTML], so
              "where does this codebase decide to trust markup?" is one grep with one
              answer rather than a hunt through an import list.

          A build-time ban on the raw conversion in CONSUMER code belongs in
          tools/sdkguard (ADR 0033), which already reads consumer source for exactly
          this class of rule. It is not shipped here.
        name: TrustedHTML
        target: template.HTML
    codes:
      - const:
          - doc: |-
              CodeViewMisconfigured identifies a Renderer refused AT CONSTRUCTION because
              its [Config] cannot be honoured — most importantly a nil FS.

              Every permanent fault a template tree can carry is discovered here, on
              purpose: a tree that does not parse, or a template html/template cannot
              contextually escape, will fail identically on every request forever, and a
              deploy that refuses to come up is a cheaper way to learn that than a 500 on
              the one page nobody smoke-tests.
            name: CodeViewMisconfigured
            note: "range: 0.2.27.0 - 0.2.27.255"
            value: "0x00_02_1B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeTemplateNotFound identifies a Render for a name the engine does not hold.

              It is a normal, expected verdict rather than a broken renderer: a Renderer
              built over an empty tree is legitimate and refuses everything by name
              (ADR 0031). The name asked for is a Field, never the Public — a template name
              is part of the application's routing surface.
            name: CodeTemplateNotFound
            value: "0x00_02_1B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeRenderFailed identifies a template that started executing and stopped —
              a nil pointer in a field chain, a method that returned an error, a range over
              the wrong type.

              The engine's diagnostic for this is the single most leak-prone string in the
              domain. html/template renders it as, verbatim,
              `template: /srv/app/web/admin/page.html:1:7: executing "…" at <.User.Name>:
              nil pointer evaluating interface {}.Name` — an absolute filesystem path, a
              line and column, a fragment of the template's own source, and a Go type name.
              All of it is reconnaissance, all of it is Private.
            name: CodeRenderFailed
            value: "0x00_02_1B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeRenderTooLarge identifies a render stopped at [Config.MaxBytes].

              It is a denial-of-service guard, not a formatting complaint. A {{range}} over
              a collection an attacker can grow has no recursion depth, so the stdlib's own
              100000-frame limit never fires; the byte cap is the only thing between that
              template and the machine's memory. The partial output is discarded, never
              returned.
            name: CodeRenderTooLarge
            value: "0x00_02_1B_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsafeValue identifies render data carrying one of the six html/template
              trust types the domain refuses: CSS, HTMLAttr, JS, JSStr, URL or Srcset.

              Each of them disables contextual escaping for the value it wraps, and each
              has a working exploit that plain strings do not: measured,
              template.URL("javascript:alert(1)") reaches the browser as
              href="javascript:alert%281%29" and executes, while the same string
              unconverted is rewritten to the inert "#ZgotmplZ".
            name: CodeUnsafeValue
            value: "0x00_02_1B_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeEngineUnknown identifies an [Open] for an [Engine] no factory has
              registered — usually a name resolved from configuration with a typo in it,
              or an engine whose package was never imported.
            name: CodeEngineUnknown
            value: "0x00_02_1B_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeEngineInvalid identifies a boot-time [Register] of a nil Factory or one
              claiming the empty [Engine] name. It panics: a broken registration is a
              programming error that must be visible at import, not a value to thread
              through a call chain nobody is executing yet.
            name: CodeEngineInvalid
            value: "0x00_02_1B_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateEngine identifies two distinct factories claiming one [Engine]
              name. It panics for the same boot-time reason as [CodeEngineInvalid], and it
              matters more here than in a codec registry: silently letting the second
              registration win could swap the engine that escapes for one that does not.
            name: CodeDuplicateEngine
            value: "0x00_02_1B_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeTemplateSourceFailed identifies a template tree that could not be READ:
              a walk that failed, a file that could not be opened.

              It is kept distinct from a parse failure because the two have different
              operators and different fixes. A source failure is usually a packaging bug —
              an embed pattern that matched nothing, an os.DirFS pointed at a path that
              does not exist in the container — and it is answered by looking at the
              build, not at the template.
            name: CodeTemplateSourceFailed
            note: |-
              range: 0.3.57.0 - 0.3.57.255

              The html/template engine's construction failures. The range was allocated to
              internal/service/app/view, which raises these codes while it reads and
              parses a template tree, and it is declared here with the port's so that
              every code of the domain is in one place (ADR 0160). A code keeps the value
              its allocation gave it whichever layer declares it, so the layer byte still
              reads 3.
            value: "0x00_03_39_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeTemplateParseFailed identifies a template file html/template refused to
              parse, or one it could not resolve a contextual escaping plan for.

              Both are construction-time on purpose. html/template resolves escaping
              lazily, at a template's first execution, so an {{if}} whose branches end in
              different contexts or a {{template}} naming something absent would otherwise
              surface as a 500 on whichever request first reached that page.
            name: CodeTemplateParseFailed
            value: "0x00_03_39_02"
        type: errs.Code
    constants:
      - doc: |-
          DefaultMaxBytes is the ceiling [Config.MaxBytes] clamps to when it is not
          positive: 8 MiB.

          A rendered HTML document larger than this is a defect or an attack. The value
          is generous by an order of magnitude for a page a browser is meant to parse,
          and it is a CLAMP rather than a refusal because — unlike a lock's TTL, whose
          two readings are opposites (ADR 0031, ADR 0052) — there is a defensible
          universal answer here, and refusing view.Config{FS: templates} would make the
          obvious spelling unusable for no safety gain.
        name: DefaultMaxBytes
        type: int
        value: 8 << 20
      - doc: |-
          MaxPooledBytes is the largest scratch buffer the engine keeps for reuse.

          A single 8 MiB render must not leave 8 MiB pinned in a pool for the life of
          the process; anything above this is returned to the collector instead.
        name: MaxPooledBytes
        type: int
        value: 1 << 20
      - doc: |-
          HTML is the [Engine] name of the stdlib html/template implementation in
          internal/service/app/view. It is the only engine the SDK ships.
        name: HTML
        type: Engine
        value: "\"html\""
      - doc: |-
          ContentTypeHTML is the value an HTML [Renderer] reports from ContentType.

          The charset is not decoration. A response whose Content-Type carries no
          charset is sniffed by the browser, and a document sniffed as UTF-7 or as a
          legacy multi-byte encoding can smuggle markup past an escaper that judged
          the bytes as UTF-8.
        name: ContentTypeHTML
        type: string
        value: "\"text/html; charset=utf-8\""
    doc: |-
      Package view — ranges 0.2.27.* (ADR 0058 core/app/view block) and 0.3.57.*
      (ADR 0058 service/app/view block, declared here since ADR 0160).

      Package view — the engine-neutral construction parameters.

      Package view — declares the sentinel *errs.Error outcomes of the domain: the
      port's, and the html/template engine's construction failures. Each var's
      name equals its errs.Define Reason in SCREAMING_SNAKE form.

      No Public string in this package names a template, a path, a line, a data key
      or a fragment of template source. A Public is written to third parties, and
      everything a template engine handles is either the application's internal
      structure or somebody's data. What an operator needs travels in Fields and in
      Private; what a browser gets is one sentence with nothing in it.

      Package view — the plug-in contract an engine implements to enter the
      registry.

      Package view — holds the process-wide [Factory] registry. Engine packages
      register themselves through package-level var initialisers when imported (no
      init()), mirroring core/data/codec and core/observe/logger/writer.

      Package view — the one trust type this domain admits, and the only spelling
      the SDK offers for it.

      Package view declares the SDK's server-side rendering DOMAIN: the [Renderer]
      port that turns a named template plus a data value into bytes, the [Engine]
      registry that resolves one implementation by name, and the single trust type
      through which a caller can deliberately bypass escaping. A core sibling
      admitted by ADR 0058.

      # The domain is HTML, and that is a security boundary rather than a scope note

      html/template's entire value is that it escapes ACCORDING TO CONTEXT: the
      same value is escaped one way between two tags, another way inside an
      attribute, another inside a URL, and another inside a <script> block.
      text/template does none of that — it is string concatenation with a syntax —
      and the two packages are API-compatible, so swapping one import for the
      other compiles, passes every test, and ships stored XSS.

      This domain therefore has no text/template representation at all. Not an
      [Engine] name, not a Factory, not a constructor, not an import: a named AST
      audit in internal/service/app/view fails the build if the identifier appears
      anywhere in the domain's three packages. The distinction is structural
      because a documented one is a distinction that survives exactly until the
      afternoon someone needs to render an email body.

      Plain-text templating is out of scope, by name. If it is ever wanted it
      arrives as its own domain with its own port — never as a second [Engine] in
      this registry, because a registry exists to make its members interchangeable
      and an escaping engine is not interchangeable with a non-escaping one.

      # Rendering is all-or-nothing, and the signature is what enforces it

      [Renderer.Render] returns a []byte. It does NOT take an io.Writer, and that
      is the decision this port is shaped by.

      Template execution writes incrementally and can fail halfway: a nil pointer
      in a field chain, a method returning an error, a range over the wrong type.
      Handed an http.ResponseWriter, html/template will have flushed the status
      line, the headers and part of the body before it reports the failure —
      measured at seventeen bytes of a valid-looking page for a template failing on
      its second action — and at that point 500 is no longer sendable and the
      browser renders a truncated document. A caller cannot avoid this by being
      careful; it can only avoid it by not being given the opportunity.

      So the engine renders into a bounded buffer it owns and hands back the
      complete bytes or nothing at all. The caller's destination is never touched
      on a failed render, because the caller's destination is never passed in.

      # Nothing here writes anywhere, which is how ADR 0030 is satisfied

      ADR 0030 forbids an SDK default that writes to os.Stdout, because stdout may
      be the process's protocol channel. This domain does not satisfy that rule by
      choosing stderr; it satisfies it by having no destination in the port at all.
      A Renderer holds no writer, opens no file and knows no stream.

      # Where this domain stops

      The SDK ships the extension point and one implementation of it. It does not
      ship a template LANGUAGE: layouts, block inheritance, helper libraries,
      in-template i18n, asset pipelines and distributed compilation caches are all
      framework opinions, and a domain that held them would be a rendering
      framework wearing a port's name. Template composition is whatever the chosen
      engine's own syntax already provides — for html/template that is {{define}}
      and {{template}}, which this package neither extends nor conventionalises.
    functions:
      - doc: |-
          Register inserts f under f.Engine() and returns it, so an engine package can
          bind the singleton to a typed package-level variable:

          	var Engine = view.Register(htmlFactory{})

          It panics on a nil factory, on the empty [Engine] name, and when a DISTINCT
          factory already claims the name. Re-registering the same factory is a no-op.

          IFACE-PLUGIN: the registry hands plug-in Factory instances back to callers so
          each engine keeps its concrete type unexported; the stable contract is the
          Factory interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: f
            type: Factory
        name: Register
        out:
          - type: Factory
      - doc: |-
          Lookup returns the [Factory] registered under name.

          IFACE-PLUGIN: the registry hands plug-in Factory instances back to callers so
          each engine keeps its concrete type unexported; the stable contract is the
          Factory interface itself.
        in:
          - name: name
            type: Engine
        name: Lookup
        out:
          - name: factory
            type: Factory
          - name: found
            type: bool
      - doc: |-
          Available returns every registered [Engine], sorted, so a caller can print
          what its imports actually wired up. It is nil before any Register.
        name: Available
        out:
          - type: "[]Engine"
      - doc: |-
          Open resolves name and builds a [Renderer] from cfg.

          It is the config-driven entry point, and it fails loudly on a name nobody
          claims — [EngineUnknown] carrying the registered names — rather than falling
          back to a default. A fallback here would mean a typo in a configuration file
          silently choosing how every value in the program is escaped.

          IFACE-PLUGIN: the engine's concrete Renderer stays unexported in
          internal/service/app/view; the stable contract is the Renderer interface.
        in:
          - name: name
            type: Engine
          - name: cfg
            type: Config
        name: Open
        out:
          - name: renderer
            type: Renderer
          - name: err
            type: error
      - doc: |-
          TrustHTML marks s as HTML that is already safe to write unescaped.

          Every call is an assertion that s was produced by the server and sanitised —
          a Markdown renderer's output, a fragment from a template the same program
          authored. It is never correct to hand it a string that arrived from a
          request, a database field a user controls, or a third-party API.

          The function exists because the conversion it performs needs a NAME. A
          reviewer scanning a diff for `template.HTML(` has to know that identifier
          matters; a reviewer scanning for `TrustHTML` is reading the word "trust" in
          the SDK's own vocabulary, at the call site where the decision was actually
          made.
        in:
          - name: s
            type: string
        name: TrustHTML
        out:
          - type: TrustedHTML
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      template: html/template
    path: github.com/kitsunium/sdk/internal/core/app/view
    ports:
      - doc: |-
          Factory builds a [Renderer] of one engine from a [Config].

          Two methods, and the registry hands instances back to callers so each engine
          keeps its concrete type unexported — the stable contract is this interface.

          # What an engine undertakes by registering

          Registration is not merely a name binding; it is a promise the security model
          rests on. An engine in this registry MUST:

            - Contextually escape every value it renders, for the media type its
              [Renderer.ContentType] reports. An engine that does not escape may not
              report an HTML content type.
            - Render into its own buffer and return complete bytes or none.
            - Honour [Config.MaxBytes], clamping a non-positive value to
              [DefaultMaxBytes].
            - Refuse at construction a [Config] it cannot honour, and refuse at render
              time — by name, with [TemplateNotFound] — a template it does not hold.
            - Name every template by its SLASH PATH within [Config.FS].

          That last one looks cosmetic and is not. html/template's own ParseFS names
          templates by filepath.Base, so a tree holding admin/page.html and
          user/page.html ends up with ONE template called "page.html" — measured, the
          second parse silently wins and every request for the admin page renders the
          user page. Full-path naming is the SDK refusing to inherit that.
        methods:
          - doc: |-
              Engine returns the registry key this factory claims. It must be stable
              and non-empty.
            name: Engine
            out:
              - type: Engine
          - doc: |-
              New builds a Renderer from cfg, parsing the whole template tree eagerly.

              Eager parsing is the point: a template that cannot be parsed, or cannot
              be contextually escaped, will fail identically forever, so the failure
              belongs in the process's first second — a deploy that does not come up —
              rather than in the first request that happens to reach that page.
            in:
              - name: cfg
                type: Config
            name: New
            out:
              - type: Renderer
              - type: error
        name: Factory
      - doc: |-
          Renderer turns a named template and a data value into a complete document.

          The method set is FROZEN at two. This interface is aliased by pkg/v1/app/view,
          Go interfaces are structural, and a third method would break every
          downstream implementation at compile time with no deprecation window
          (ADR 0039). New capabilities arrive as SIBLING interfaces reached by type
          assertion — the model is codec's Appender (ADR 0037).
        methods:
          - doc: |-
              Render executes the template registered under name against data and
              returns the complete document.

              It returns ([]byte, error) rather than writing to an io.Writer so that a
              failure mid-execution cannot leave a half-written response behind — see
              the package documentation. On any error the returned slice is nil.

              ctx is checked before the work starts and is otherwise not consulted:
              text/template's Execute takes no context and cannot be interrupted, so a
              runaway template is bounded by BYTES, not by time. That is the reason
              Config.MaxBytes exists and the reason it has no "unlimited" spelling.

              name is looked up exactly. A name the engine does not hold is
              [TemplateNotFound] — a Renderer built over an empty template set is a
              legitimate Renderer that refuses everything by name, which is a loud
              behaviour rather than an inert one (ADR 0031).
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
              - name: data
                type: any
            name: Render
            out:
              - type: "[]byte"
              - type: error
          - doc: |-
              ContentType returns the media type the bytes from Render carry, ready to
              be written as a Content-Type header — [ContentTypeHTML] for every engine
              registered today.

              It is a method rather than a package constant because it is the promise
              an engine makes about the escaping it performs. An engine that does not
              contextually escape HTML may not report an HTML content type, so a
              framework that writes this header verbatim (with X-Content-Type-Options:
              nosniff, which is the framework's job and not the SDK's) never labels
              unescaped output as a document the browser will parse as HTML.
            name: ContentType
            out:
              - type: string
        name: Renderer
    sentinels:
      - var:
          - code: CodeViewMisconfigured
            doc: |-
              ViewMisconfigured is returned by a [Factory]'s New for a [Config] it
              cannot honour: a nil FS, a template tree that does not parse, or a
              template html/template cannot contextually escape.

              The escaping half is the one worth naming. html/template resolves a
              template's escaping context lazily, at its FIRST execution, and reports
              three classes of failure there — a template that ends inside an
              unterminated tag, an {{if}} whose branches end in different contexts, and
              a {{template}} naming something that does not exist. Left alone, all
              three are 500s on a live request. The engine therefore forces escaping at
              construction and turns them into this.
            name: ViewMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/view: a Factory received a nil FS, a template that does not parse, or one html/template cannot contextually escape; the fields name the template and the private message carries the engine's own diagnostic"
            public: The view renderer cannot be built from the given configuration
            reason: VIEW_MISCONFIGURED
          - code: CodeTemplateNotFound
            doc: |-
              TemplateNotFound is returned by Render for a name the engine does not
              hold, including the empty name.

              It is deliberately not a construction-time concern: a Renderer over an
              empty tree is legitimate and refuses everything by name. That is ADR
              0031's shape — the configuration nobody filled in produces a loud,
              typed refusal on every call rather than an inert renderer that returns
              empty pages.
            name: TemplateNotFound
            options:
              - errs.WithHTTPStatus(httpInternal)
            private: "core/app/view: Render was called with a name absent from the parsed set; the fields carry the name asked for and the number of templates the renderer holds"
            public: The requested view does not exist
            reason: TEMPLATE_NOT_FOUND
          - code: CodeRenderFailed
            doc: |-
              RenderFailed is returned when execution started and could not finish.

              Nothing is returned alongside it. The bytes produced before the failure
              are discarded inside the engine, which is the whole reason Render returns
              a slice instead of taking a writer: handed an http.ResponseWriter, the
              same failure would have flushed the status line, the headers and a
              plausible-looking prefix of the page before it was detectable — measured
              at 17 bytes for a template that fails on its second action.
            name: RenderFailed
            options:
              - errs.WithExitCode(exitSoftware)
              - errs.WithHTTPStatus(httpInternal)
            private: "core/app/view: template execution failed after it began; the private message carries html/template's own diagnostic, which names the file path, the line, the column and a fragment of template source and must never be shown to a caller"
            public: The page could not be rendered
            reason: RENDER_FAILED
          - code: CodeRenderTooLarge
            doc: |-
              RenderTooLarge is returned when a render reached [Config.MaxBytes].

              The engine stops at the ceiling rather than after it: the limit is
              enforced by the writer html/template is executing into, so the bytes are
              never accumulated in the first place and the process does not have to
              survive the allocation in order to reject it.
            name: RenderTooLarge
            options:
              - errs.WithHTTPStatus(httpInternal)
            private: "core/app/view: rendering reached Config.MaxBytes and was stopped at the ceiling; the fields carry the limit and the template name"
            public: The page could not be rendered
            reason: RENDER_TOO_LARGE
          - code: CodeUnsafeValue
            doc: |-
              UnsafeValue is returned when render data carries one of the six refused
              html/template trust types.

              It is a programming error surfaced as a runtime verdict, and it is
              refused BEFORE the template runs so no partial page exists to reason
              about. The field naming the location is a path — data.Items[3].Body,
              built from GO field names because that is the vocabulary a template
              author reads and a developer greps — because "an unsafe value is
              somewhere in your model" is not something a developer can act on at
              three in the morning.
            name: UnsafeValue
            options:
              - errs.WithExitCode(exitSoftware)
              - errs.WithHTTPStatus(httpInternal)
            private: "core/app/view: render data carries an html/template trust type that disables contextual escaping (CSS, HTMLAttr, JS, JSStr, URL or Srcset); the fields name the path and the type, and view.TrustHTML is the only trusted spelling the SDK offers"
            public: The page could not be rendered
            reason: UNSAFE_VALUE
          - code: CodeEngineUnknown
            doc: |-
              EngineUnknown is returned by [Open] for a name no factory claims.

              It carries the registered names in a Field so the usual cause — an engine
              package that was never imported, so its registration never ran — is
              answerable from one log line.
            name: EngineUnknown
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/view: Open received an Engine no Factory has registered; the fields carry the requested name and the registered ones, and the usual cause is an unimported engine package"
            public: No view engine is registered under that name
            reason: ENGINE_UNKNOWN
          - code: CodeEngineInvalid
            doc: |-
              EngineInvalid is the boot-time panic for a nil Factory or an empty
              [Engine] name.
            name: EngineInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/view: Register received a nil Factory or one claiming the empty Engine name; the empty name is what an uninitialised variable holds and is refused at boot so it can never reach Lookup"
            public: The view engine registration is not usable
            reason: ENGINE_INVALID
          - code: CodeDuplicateEngine
            doc: |-
              DuplicateEngine is the boot-time panic for two distinct factories under
              one [Engine] name.

              Re-registering the SAME factory is idempotent and silent; two different
              ones are a hard conflict, because last-write-wins in THIS registry can
              mean the engine that escapes was replaced by one that does not, at import
              time, with no call site to blame.
            name: DuplicateEngine
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/view: a second, distinct Factory registered under an Engine name already taken; refused at boot rather than resolved, since one of the two would silently decide how every value in the program is escaped"
            public: Two view engines claim the same name
            reason: DUPLICATE_ENGINE
          - code: CodeTemplateSourceFailed
            doc: |-
              TemplateSourceFailed is returned by the constructor when the template FS
              could not be read.
            name: TemplateSourceFailed
            note: |-
              The html/template engine's construction failures, raised by
              internal/service/app/view. They are declared here, with the port's, so that
              the domain's codes and sentinels are in one place (ADR 0160). Each carries
              exitConfig: a tree that will not parse is refused forever, and the fix is an
              edit to a template, never a retry.
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/view: walking or reading Config.FS failed; the fields carry the path that failed and the underlying error, and the usual cause is an embed pattern that matched nothing"
            public: The view templates could not be read
            reason: TEMPLATE_SOURCE_FAILED
          - code: CodeTemplateParseFailed
            doc: |-
              TemplateParseFailed is returned by the constructor for a file
              html/template refused to parse or could not build an escaping plan for.
            name: TemplateParseFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/view: html/template refused a template at parse time or could not resolve its contextual escaping context; the fields carry the template name and the engine's own diagnostic"
            public: A view template is not valid
            reason: TEMPLATE_PARSE_FAILED
    types:
      - decl: true
        doc: |-
          Config parameterises every [Factory]. It is deliberately small: this domain
          ships an extension point, not a template language.
        name: Config
        struct:
          fields:
            - doc: |-
                FS is the tree the templates are read from. Required.

                It is an fs.FS rather than a directory path so that embed.FS, os.DirFS
                and fstest.MapFS are all first-class, and so that the domain never
                touches the filesystem API. It also removes path traversal from the
                problem statement: fs.ValidPath rejects "..", so no template name can
                address a file outside the tree the caller handed over.

                Every regular file under FS is parsed, and each template is named by its
                SLASH PATH relative to the root — "admin/page.html", not "page.html".
                See [Factory] for why that is not a cosmetic choice.
              name: FS
              type: fs.FS
            - doc: |-
                Ext optionally restricts which files are parsed, by extension including
                the dot (".html", ".gohtml").

                Empty means every regular file in FS, which is the honest default: the
                caller already chose the tree, and second-guessing its contents is the
                SDK inventing a naming convention. Set it when templates share a
                directory with assets.
              name: Ext
              type: "[]string"
            - doc: |-
                MaxBytes caps a single render's output. Not positive clamps to
                [DefaultMaxBytes]; there is deliberately no spelling for "unlimited".

                The cap is the only bound that exists. text/template's Execute takes no
                context, so a render cannot be cancelled, and the stdlib's own guard is a
                recursion DEPTH limit (100000 frames) that says nothing about output
                size: a {{range}} over an attacker-influenced collection has no depth at
                all and will write until the machine stops. The same "no unbounded
                setting" reasoning applies here as to the WebSocket ceilings in ADR 0047.
              name: MaxBytes
              type: int
      - decl: true
        doc: |-
          Engine names a registered template engine.

          The zero value is the reserved invalid name: [Register] refuses it at boot,
          so it can never reach [Lookup], [Open] or [Available].
        name: Engine
        underlying: string
  - doc: |-
      Package view — the cycle detection the trust-type scan needs, kept in its own
      file so scan.go holds the walk and nothing else.

      Package view — the one helper through which every core/app/view sentinel is
      raised. The domain's codes and sentinels — the port's, and this engine's
      construction failures — are declared in internal/core/app/view (ADR 0160).

      No Public string the engine raises names a template, a path, a line or a
      fragment of template source. html/template's diagnostics are unusually rich
      — a parse failure carries the file path and the offending function name, an
      escaping failure carries the escaper's internal state machine, and an
      execution failure carries the path, the line, the column, a fragment of the
      template's own source and a Go type name. Every one of those is useful to an
      operator and every one of them is reconnaissance to a stranger, so all of it
      travels as Fields and Private and none of it reaches a Public.

      Package view implements the ADR 0058 rendering port over the stdlib's
      html/template: one [coreview.Factory], registered under [coreview.HTML], that
      parses a whole template tree eagerly and renders each request into a bounded
      buffer it owns.

      # Why html/template and nothing else

      html/template is not "the stdlib option". It is the only template engine in
      the Go ecosystem that escapes ACCORDING TO CONTEXT — a value between two
      tags, the same value inside an attribute, inside a URL and inside a <script>
      block are four different escapings, and it tracks which one applies by
      parsing the surrounding HTML. text/template, pongo2, quicktemplate and jet
      all escape uniformly or not at all, which is why they are extension-point
      candidates rather than SDK defaults.

      The package therefore never imports text/template, and does not merely
      promise not to: TestDomainNeverReachesTextTemplate parses the source of all
      three view packages and fails the build on the import. The two packages are
      API-compatible, so the substitution compiles, passes every test and ships
      stored XSS — a documented rule would not have survived the first afternoon
      somebody needed to render an email body.

      # What lands where

        - html.go   — the Factory, its registration, and the two constructors.
        - parse.go  — the FS walk, full-path naming, and the escaping probe that
          turns a lazily-detected escaping failure into a refused construction.
        - render.go — the renderer type and the bounded, all-or-nothing render.
        - limit.go  — the writer that stops execution AT the ceiling.
        - scan.go   — the trust-type scan that runs before the template does.
        - cycles.go — the pointer bookkeeping that stops a self-referential model.

      Package view — the writer that stops a render AT its ceiling rather than
      after it.

      Package view — construction: the FS walk, full-path template naming, the
      MaxBytes clamp, and the escaping probe that moves a lazily-detected failure
      to boot time.

      Package view — the bounded, all-or-nothing render.

      Package view — the trust-type scan that runs BEFORE the template does.
    functions:
      - doc: |-
          NewHTML builds an html/template [coreview.Renderer] directly, without going
          through the registry. It is what pkg/v1/app/view.New calls.

          Both paths exist on purpose. A program that knows it renders HTML says so in
          code and gets a compile-time answer; a program that resolves the engine from
          configuration goes through [coreview.Open] and gets [coreview.EngineUnknown]
          for a name nobody claims. The registry is the extension point, not a
          mandatory indirection.
        in:
          - name: cfg
            type: coreview.Config
        name: NewHTML
        out:
          - name: renderer
            type: coreview.Renderer
          - name: err
            type: error
    imports:
      coreview: github.com/kitsunium/sdk/internal/core/app/view
    path: github.com/kitsunium/sdk/internal/service/app/view
    variables:
      - doc: |-
          HTML is the registered html/template [coreview.Factory].

          It registers through a package-level var initialiser rather than an init(),
          mirroring core/data/codec and core/observe/logger/writer: importing this package is what wires
          the engine, and the binding is a value a caller can hold.

          Registration arms nothing. Unlike ADR 0048's OTLP/HTTP emitter — which is
          deliberately NOT registered, because an import that arms a network client is
          worse than the stdout hazard ADR 0030 refuses — a Factory holds no file, no
          socket and no stream. It cannot act until someone calls New.
        name: HTML
        type: coreview.Factory
  - doc: |-
      Package view is the public facade for the SDK's server-side rendering: a
      named template plus a data value become a complete HTML document, escaped
      according to the context each value lands in.

      	//go:embed web
      	var web embed.FS

      	renderer, err := view.New(view.Config{FS: web, Ext: []string{".html"}})
      	if err != nil { return err }

      	document, err := renderer.Render(ctx, "web/admin/page.html", model)
      	if err != nil { return err }            // nothing has been written yet
      	w.Header().Set("Content-Type", renderer.ContentType())
      	w.Write(document)

      # The engine is html/template, and that is the decision, not a default

      This package does not implement a template engine. It builds a CONTRACT on
      top of the standard library's html/template, which is the only engine in the
      Go ecosystem that escapes according to CONTEXT: the same value is escaped
      one way between two tags, another inside an attribute, another inside a URL
      and another inside a <script> block, and it decides which by parsing the
      surrounding HTML.

      Re-implementing that would be a security regression rather than a gain.
      html/template is one of the most heavily audited packages in the standard
      library, and a hand-written escaper would become the source of exactly the
      cross-site scripting this domain exists to prevent. It is also already
      "total control with no dependency" — it is the stdlib.

      text/template has NO representation here. Not a name, not a Factory, not an
      import: the two packages are API-compatible, so swapping one for the other
      compiles, passes every test and ships stored XSS, and a named AST audit
      fails the build if the identifier appears anywhere in the domain's three
      packages.

      # What the SDK adds that the stdlib does not have

        - A [Renderer] port a framework can be wired to, with one registered
          engine and room for others ([Register], [Open]).
        - Templates named by their full SLASH PATH. html/template's own ParseFS
          names them by filepath.Base, so a tree holding admin/page.html and
          user/page.html ends up with ONE template called "page.html" — the second
          parse silently wins, and every request for the admin page renders the
          user page.
        - Typed SDK errors instead of text/template's strings, with the engine's
          leak-prone diagnostic kept out of the wire-safe half.
        - Eager parsing AND an escaping probe at construction, so a broken tree is
          a deploy that does not come up rather than a 500 on the one page nobody
          smoke-tested.
        - A byte ceiling, because text/template's Execute takes no context and
          cannot be cancelled.

      # Read this before calling TrustHTML

      [TrustHTML] is the one place escaping can be bypassed, and it is the only
      spelling the SDK offers for it. Six of html/template's seven trust types —
      CSS, HTMLAttr, JS, JSStr, URL and Srcset — are REFUSED when they appear in
      render data, with the path that carries them named in the error.

      What that buys is precise, and the limit is worth reading twice:
      [TrustedHTML] is a type ALIAS of html/template.HTML, because html/template
      recognises its trust types by an exact type switch and a distinct type would
      simply be escaped like any other string. The engine therefore CANNOT tell a
      fragment marked through [TrustHTML] from one a caller converted directly.

      So the SDK does not prevent a bad trust decision — it cannot see one. What
      it prevents is an ACCIDENTAL one, and what it provides is a single greppable
      word for the deliberate one. Every call is an assertion that the string was
      produced by the server and sanitised. It is never correct to hand it a
      string that arrived from a request, from a user-controlled database field,
      or from a third-party API.

      # Rendering is all-or-nothing

      [Renderer].Render returns a []byte. It does not take an io.Writer, and that
      is what the port is shaped by: template execution writes incrementally and
      can fail halfway, so handed an http.ResponseWriter it would have flushed the
      status line, the headers and a plausible prefix of the page before reporting
      the failure — at which point 500 is no longer sendable and the browser
      renders a truncated document. The engine renders into a bounded buffer it
      owns and hands back the complete bytes or nothing at all.

      # Parse once. This is the one performance rule the domain has.

      Build the [Renderer] at start-up and keep it. It is immutable after
      construction, safe for concurrent use, and holds no writer, no file and no
      stream. Constructing one per request re-parses the whole tree and re-runs
      the escaping analysis on every request; measured on a forty-two-template
      tree, that is 34 times the time and 34 times the bytes of reusing one, and
      the ratio grows with the tree — see internal/service/app/view/BENCH.md.
      There is deliberately no reload, no lazy parse and no cache, because each of
      them would put a mutex on the read path to solve a problem that a package
      variable already solves.

      # Scope

      The SDK ships the extension point and one implementation of it. It does not
      ship a template LANGUAGE: layouts, block inheritance, helper libraries,
      in-template i18n and asset pipelines are framework opinions. Template
      composition is whatever the engine's own syntax already provides — for
      html/template that is {{define}} and {{template}}, which this package
      neither extends nor conventionalises.
    facade:
      - const:
          - doc: |-
              HTML is the [Engine] name of the stdlib html/template implementation. It
              is the only engine the SDK ships.
            name: HTML
            reexport: coreview.HTML
            type: Engine
            typed: true
            value: "\"html\""
          - blank: true
            doc: |-
              ContentTypeHTML is the media type an HTML [Renderer] reports, charset
              included — a response with no charset is sniffed, and a document sniffed
              as UTF-7 can smuggle markup past an escaper that judged the bytes as
              UTF-8.
            name: ContentTypeHTML
            reexport: coreview.ContentTypeHTML
            type: string
            typed: true
            value: "\"text/html; charset=utf-8\""
          - blank: true
            doc: |-
              DefaultMaxBytes is the ceiling [Config].MaxBytes clamps to when it is not
              positive: 8 MiB. There is deliberately no spelling for "unlimited".
            name: DefaultMaxBytes
            reexport: coreview.DefaultMaxBytes
            type: int
            typed: true
            value: 8 << 20
      - alias:
          - doc: |-
              Renderer turns a named template and a data value into a complete document:
              Render and ContentType.

              The method set is FROZEN at two. New capabilities arrive as SIBLING
              interfaces reached by type assertion, because this alias publishes the
              interface, Go interfaces are structural, and a third method would break
              every downstream implementer at compile time with no deprecation window
              (ADR 0039).
            name: Renderer
            target: coreview.Renderer
      - alias:
          - doc: |-
              Config parameterises every engine. FS is required; everything else has a
              defensible default.
            name: Config
            target: coreview.Config
      - alias:
          - doc: |-
              Factory is the plug-in contract an engine implements to enter the registry.
              Registering is a promise the security model rests on — see [Register].
            name: Factory
            target: coreview.Factory
      - alias:
          - doc: |-
              Engine names a registered template engine. The zero value is the reserved
              invalid name.
            name: Engine
            target: coreview.Engine
      - alias:
          - doc: |-
              TrustedHTML is an HTML fragment written WITHOUT escaping.

              It is an ALIAS of html/template.HTML, and that has a consequence stated
              rather than hidden: the engine cannot tell a fragment marked through
              [TrustHTML] from one a caller converted directly. See the package
              documentation.
            name: TrustedHTML
            target: coreview.TrustedHTML
      - doc: The sentinels a caller matches with errors.Is or errs.HasCode.
        var:
          - doc: |-
              ViewMisconfigured is returned by a constructor for a Config it cannot
              honour: a nil FS, a tree that does not parse, or a template
              html/template cannot contextually escape.
            name: ViewMisconfigured
            reexport: coreview.ViewMisconfigured
            type: "*errs.Error"
          - blank: true
            doc: |-
              TemplateNotFound is returned by Render for a name the engine does not
              hold, including the empty name. A Renderer over an empty tree is
              legitimate and refuses everything by name.
            name: TemplateNotFound
            reexport: coreview.TemplateNotFound
            type: "*errs.Error"
          - blank: true
            doc: |-
              RenderFailed is returned when execution started and could not finish.
              Nothing is returned alongside it: the partial bytes are discarded
              inside the engine.
            name: RenderFailed
            reexport: coreview.RenderFailed
            type: "*errs.Error"
          - blank: true
            doc: |-
              RenderTooLarge is returned when a render reached Config.MaxBytes. It is
              a denial-of-service guard, not a formatting complaint.
            name: RenderTooLarge
            reexport: coreview.RenderTooLarge
            type: "*errs.Error"
          - blank: true
            doc: |-
              UnsafeValue is returned when render data carries one of the six refused
              html/template trust types. The fields name the path and the type, never
              the value.
            name: UnsafeValue
            reexport: coreview.UnsafeValue
            type: "*errs.Error"
          - blank: true
            doc: |-
              EngineUnknown is returned by [Open] for a name no factory claims —
              usually an engine package that was never imported.
            name: EngineUnknown
            reexport: coreview.EngineUnknown
            type: "*errs.Error"
          - blank: true
            doc: |-
              EngineInvalid is the boot-time panic for a nil Factory or one claiming
              the empty Engine name.
            name: EngineInvalid
            reexport: coreview.EngineInvalid
            type: "*errs.Error"
          - blank: true
            doc: |-
              DuplicateEngine is the boot-time panic for two distinct factories under
              one Engine name. It is refused rather than resolved, because one of the
              two would silently decide how every value in the program is escaped.
            name: DuplicateEngine
            reexport: coreview.DuplicateEngine
            type: "*errs.Error"
          - blank: true
            doc: |-
              TemplateSourceFailed is returned when the template FS could not be READ
              — usually an embed pattern that matched nothing.
            name: TemplateSourceFailed
            reexport: coreview.TemplateSourceFailed
            type: "*errs.Error"
          - blank: true
            doc: |-
              TemplateParseFailed is returned for a file html/template refused to
              parse or could not build an escaping plan for.
            name: TemplateParseFailed
            reexport: coreview.TemplateParseFailed
            type: "*errs.Error"
      - func:
          doc: |-
            TrustHTML marks s as HTML that is already safe to write unescaped.

            It is the one bypass the SDK offers and the only spelling it has, so "where
            does this codebase decide to trust markup?" is one grep with one answer.
            Read the package documentation before using it: the SDK cannot verify the
            assertion this call makes.
          forward: coreview.TrustHTML
          in:
            - name: s
              type: string
          name: TrustHTML
          out:
            - type: TrustedHTML
      - func:
          doc: |-
            New builds the stdlib html/template [Renderer] over cfg.FS, parsing the
            whole tree eagerly.

            Call it once, at start-up, and keep the result: see the package
            documentation's parse-once rule. A nil FS, a file that does not parse and a
            template whose escaping context cannot be resolved are all refused here, so
            a broken tree is a deploy that does not come up.

            An EMPTY tree is not an error. It produces a Renderer that refuses every
            name with [TemplateNotFound] — loud rather than inert (ADR 0031).
          forward: svcview.NewHTML
          in:
            - name: cfg
              type: Config
          name: New
          out:
            - name: renderer
              type: Renderer
            - name: err
              type: error
      - func:
          doc: |-
            Open resolves an [Engine] by name and builds a [Renderer] from cfg. It is
            the configuration-driven counterpart to [New].

            It fails loudly on a name nobody claims — [EngineUnknown] — rather than
            falling back to a default, because a fallback here would let a typo in a
            configuration file silently choose how every value in the program is
            escaped.
          forward: coreview.Open
          in:
            - name: name
              type: Engine
            - name: cfg
              type: Config
          name: Open
          out:
            - name: renderer
              type: Renderer
            - name: err
              type: error
      - func:
          doc: |-
            Register inserts f under f.Engine() and returns it, so a third-party engine
            can bind the singleton to a package-level variable.

            Registration is not merely a name binding. An engine in this registry MUST
            contextually escape every value it renders for the media type its
            ContentType reports, render into its own buffer and return complete bytes or
            none, honour Config.MaxBytes, refuse at construction a Config it cannot
            honour, and name every template by its slash path within Config.FS.

            It panics on a nil factory, on the empty [Engine] name, and when a DISTINCT
            factory already claims the name — at import, where the offender is visible.
          forward: coreview.Register
          in:
            - name: f
              type: Factory
          name: Register
          out:
            - type: Factory
      - func:
          doc: |-
            Available returns every registered [Engine], sorted, so a program can print
            what its imports actually wired up.
          forward: coreview.Available
          name: Available
          out:
            - type: "[]Engine"
    imports:
      coreview: github.com/kitsunium/sdk/internal/core/app/view
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcview: github.com/kitsunium/sdk/internal/service/app/view
    path: github.com/kitsunium/sdk/pkg/v1/app/view
