apiVersion: kit.kitsunium/design/v2
domain: app/cli
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidCommand identifies a declaration refused because the command
              could never be reached or could never run: a blank name, a name carrying a
              space or leading "-", a child with no summary, or neither a Run nor any
              Commands.
            name: CodeInvalidCommand
            note: "range: 0.2.32.0 - 0.2.32.255"
            value: "0x00_02_20_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeAmbiguousCommand identifies a declaration refused for carrying BOTH a
              Run and Commands, where the meaning of an existing command line would change
              the day a child is added.
            name: CodeAmbiguousCommand
            value: "0x00_02_20_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateCommand identifies a declaration refused because two children
              of one group share a name, so the resolver could only ever reach one of
              them.
            name: CodeDuplicateCommand
            value: "0x00_02_20_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeReservedFlag identifies a declaration refused because its Binder bound
              "h" or "help", the two names the domain answers itself.
            name: CodeReservedFlag
            value: "0x00_02_20_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownCommand identifies an argument vector naming a sub-command the
              group does not declare. The group's help — which lists every name it DOES
              declare — has been written to the diagnostic stream by the time this is
              returned.
            name: CodeUnknownCommand
            note: |-
              range: 0.3.62.0 - 0.3.62.255

              The engine's outcomes. The range was allocated to internal/service/app/cli,
              which raises these codes while it resolves and runs a command line, and it
              is declared here with the declaration refusals so that every code of the
              domain is in one place (ADR 0160). A code keeps the value its allocation
              gave it whichever layer declares it, so the layer byte still reads 3.
            value: "0x00_03_3E_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeMissingCommand identifies a group invoked with no sub-command at all. A
              group has no action of its own, so this is an incomplete command line and
              never a successful no-op.
            name: CodeMissingCommand
            value: "0x00_03_3E_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidFlags identifies a flag vector package flag refused: an unknown
              flag, a missing value, or a value its flag.Value could not parse. flag's own
              text is preserved in Private, never in Public, because it quotes the
              operator's value verbatim.
            name: CodeInvalidFlags
            value: "0x00_03_3E_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeCommandPanicked identifies an Action whose goroutine panicked; the
              engine recovered it, captured the originating stack, and turned it into this
              command's failure so main still gets a typed exit status instead of the
              runtime's 2.
            name: CodeCommandPanicked
            value: "0x00_03_3E_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeHelpWriteFailed identifies a help request (-h) whose answer the
              diagnostic stream did not take: a closed pipe, a full disk, a writer that
              accepted only part of the page. Asking a question is not a failure, but an
              answer nobody received is, so this is EX_IOERR and not the 0 a delivered
              help earns.
            name: CodeHelpWriteFailed
            value: "0x00_03_3E_05"
        type: errs.Code
    doc: |-
      Package cli declares the command-line port of the SDK: the [Action] one
      command runs, the [Binder] that declares its flags, and the [Executor] that
      resolves an argument vector against a tree of [CommandValue] and dispatches
      it. A core sibling admitted by ADR 0065.

      # What this domain adds to package flag, and what it does not touch

      The stdlib's flag package parses flags. It does that well and this domain
      does not reimplement one byte of it: the flag SYNTAX, the [flag.Value]
      interface, the -x=v / -x v / --x forms, the "stop at the first non-flag
      argument" rule and the rendering of the defaults table all stay flag's. A
      [Binder] receives the stdlib's own *[flag.FlagSet], unchanged and
      unwrapped — the same shape internal/core/data/vfs takes for io/fs, and for the
      same reason: a wrapper around a stdlib contract is a second contract to
      learn, to keep in sync, and to get subtly wrong.

      What flag does NOT have is exactly what this domain adds, and nothing else:

        - sub-commands, to arbitrary depth;
        - one help text GENERATED from the declarations, so it cannot lie;
        - a typed exit status, carried by the SDK's own errs codes;
        - a seam to the rest of the SDK — the flags an operator actually typed can
          become the top layer of a config load.

      # Nothing here can end the process

      flag's own answer to a bad argument is [flag.ExitOnError], which calls
      os.Exit from inside a library. That is refused by name: it makes the parse
      untestable, it skips every deferred function in the program, and it takes a
      decision — whether this process should still be alive — that belongs to
      main and to nobody else. Every failure in this domain is a returned
      *errs.Error carrying an exit status; main is the only place that may act on
      it. TestPackageNeverEndsTheProcess in internal/service/app/cli is the executable
      form of that claim.

      The engine that walks the tree, the help renderer and the config adapter
      live in internal/service/app/cli; this package owns the contract, the two domain
      values, and the sentinels a malformed declaration is refused with.

      Package cli — the declared command: a name, what it says about itself, its
      flags, and EITHER what it does OR what it contains.

      Package cli — what a resolved command line looks like by the time an
      [Action] sees it.

      Package cli — ranges 0.2.32.* (ADR 0065 core/app/cli block) and 0.3.62.*
      (ADR 0065 service/app/cli block, declared here since ADR 0160).

      Package cli — declares the sentinel *errs.Error outcomes of the domain: the
      refused declarations, and the engine's verdicts on a command line. Each
      var's name equals its errs.Define Reason in SCREAMING_SNAKE form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/cli
    ports:
      - doc: |-
          Executor resolves an argument vector against a command tree and runs the
          command it names.

          IFACE-PLUGIN: the concrete engine stays unexported behind its constructor in
          internal/service/app/cli.
        methods:
          - doc: |-
              Execute resolves args against the tree and runs the command it names.
              args is the vector WITHOUT the program name — os.Args[1:] at a call
              site — because a library that reads os.Args itself cannot be tested and
              cannot be embedded.

              It returns nil when the command succeeded AND when help was requested,
              because asking for help is not a failure. Every other outcome is an
              *errs.Error whose exit status the caller reads with errs.ExitCodeOf.
            in:
              - name: ctx
                type: context.Context
              - name: args
                type: "[]string"
            name: Execute
            out:
              - type: error
        name: Executor
    sentinels:
      - var:
          - code: CodeInvalidCommand
            doc: |-
              InvalidCommand is returned by the constructor for a command that could
              never be reached or could never run. The fields name the path and the
              clause that failed.

              "Neither Run nor Commands" is the case worth naming: it is the inert
              declaration ADR 0031 refuses. A name an operator can type that does
              nothing looks configured, reports success, and is discovered only by
              somebody wondering why the tool did not do the thing.
            name: InvalidCommand
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/cli: blank or unreachable name, missing summary, or neither Run nor Commands; the fields name the path and the clause"
            public: The command declaration is not runnable and was refused
            reason: INVALID_COMMAND
          - code: CodeAmbiguousCommand
            doc: |-
              AmbiguousCommand is returned by the constructor for a command carrying
              both a Run and Commands.

              The refusal is not fastidiousness. With both, `tool db migrate` means
              "run db with the positional argument migrate" — until somebody adds a
              child named migrate, at which point the identical command line means
              something else, in a release that changed no line of db's own code. A
              declaration whose meaning depends on which siblings exist today is the
              same class of failure as prefix matching, and it is refused for the same
              reason.
            name: AmbiguousCommand
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/cli: Run and Commands are both set; adding a child would silently change what an existing command line means"
            public: A command may declare an action or sub-commands, not both
            reason: AMBIGUOUS_COMMAND
          - code: CodeDuplicateCommand
            doc: |-
              DuplicateCommand is returned by the constructor when two children of one
              group share a name. The resolver stops at the first match, so the second
              declaration would be unreachable code that looks reachable.
            name: DuplicateCommand
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/cli: sibling names are unique per group; the fields carry the parent path and the repeated name"
            public: Two sub-commands are declared under the same name
            reason: DUPLICATE_COMMAND
          - code: CodeReservedFlag
            doc: |-
              ReservedFlag is returned by the constructor when a Binder bound "h" or
              "help".

              The domain answers both names itself, and it must: package flag reports
              an undefined -h as flag.ErrHelp rather than as a parse failure, and that
              is the ONLY signal distinguishing "the operator asked for help" (exit 0)
              from "the operator got it wrong" (exit 64). A command that binds -h
              takes that signal away, and the engine would report a successful parse
              where an operator expected a help page.
            name: ReservedFlag
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/cli: a Binder bound h or help; the engine needs flag.ErrHelp to tell a help request from a usage error"
            public: The flag names -h and -help are answered by the SDK
            reason: RESERVED_FLAG
          - code: CodeUnknownCommand
            doc: |-
              UnknownCommand is returned when a token does not name any child of the
              group that was reached.

              There is deliberately no "did you mean …?". The group's help has already
              been written, and it lists every name that WOULD have worked — which is
              the complete answer, cannot be wrong, and costs no edit-distance table
              to keep correct. A suggestion is a second answer that can differ from
              the first.
            name: UnknownCommand
            note: |-
              The engine's verdicts on a command line, raised by internal/service/app/cli
              as it resolves an argument vector and runs the command it names. They are
              declared here, with the declaration refusals, so that the domain's codes and
              sentinels are in one place (ADR 0160).
            options:
              - errs.WithExitCode(exitUsage)
            private: "service/app/cli: the token names no child of this group; the fields carry the group path and the token"
            public: That sub-command does not exist
            reason: UNKNOWN_COMMAND
          - code: CodeMissingCommand
            doc: |-
              MissingCommand is returned when a group is invoked with nothing after
              its flags.

              It is a failure and not a quiet success on purpose: a group declares no
              action, so `tool db` did nothing, and a script that read exit status 0
              there would treat "I forgot the verb" as "the migration ran".
            name: MissingCommand
            options:
              - errs.WithExitCode(exitUsage)
            private: "service/app/cli: a group has no action of its own; the field carries the group path and its help was written"
            public: This command needs a sub-command
            reason: MISSING_COMMAND
          - code: CodeInvalidFlags
            doc: |-
              InvalidFlags is returned when package flag refuses the vector.

              flag's own message quotes the operator's value ("invalid value \"abc\"
              for flag -n"), so it lives in a field and in Private and never in
              Public, which is the wire-safe half.
            name: InvalidFlags
            options:
              - errs.WithExitCode(exitUsage)
            private: "service/app/cli: flag.FlagSet.Parse refused the vector; the fields carry the command path and flag's own text"
            public: The flags for this command could not be parsed
            reason: INVALID_FLAGS
          - code: CodeCommandPanicked
            doc: |-
              CommandPanicked is the failure of an Action that panicked.

              It is recovered rather than left to the runtime for one reason that is
              not "hiding the bug": a panicking Go program exits with status 2, which
              sysexits gives no meaning and which several supervisors read as a usage
              error. Nothing is lost — the recovered value AND the stack of the
              goroutine that actually failed both travel as fields — and what changes
              is that main, rather than the runtime, decides what the process does
              next. It keeps the default EX_SOFTWARE (70): the command line was fine.
            name: CommandPanicked
            private: "service/app/cli: the Action panicked; the fields carry the command path, the panic value and the originating stack"
            public: The command panicked and was recovered
            reason: COMMAND_PANICKED
          - code: CodeHelpWriteFailed
            doc: |-
              HelpWriteFailed is returned when -h asked for the help and the
              diagnostic stream did not take it.

              Only the -h path returns it. After a bad command line the usage error is
              the verdict and the help is the actionable half of it, so a failed write
              there does not replace the status the operator's mistake earned.
            name: HelpWriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/app/cli: the diagnostic stream refused the help -h asked for, or took part of it; the fields carry the command path"
            public: The help could not be written
            reason: HELP_WRITE_FAILED
    types:
      - decl: true
        doc: |-
          Action is what one command DOES. It receives the context [Executor.Execute]
          was called with — a cancelled context is how a caller aborts a running
          command — and the resolved [InvocationValue].

          Returning a non-nil error is how a command fails. If it is an *errs.Error
          the SDK's origin-wins rule (CLAUDE.md rule 6) preserves its Code and its
          exit status all the way out of Execute, so a command's own exit status is
          never overwritten by the framework that called it.
        name: Action
        underlying: func(ctx context.Context, invocation InvocationValue) error
      - decl: true
        doc: |-
          Binder declares one command's flags onto the set that will parse them.

          It is handed the stdlib's *[flag.FlagSet] deliberately: every flag type the
          stdlib ships, and every [flag.Value] a caller has already written, works
          here with no adapter. The set is fresh, its name is the command path, and
          its error handling is always [flag.ContinueOnError].

          A Binder MUST only touch the set it is given, and MUST be safe to call more
          than once: the engine runs it once at construction to validate the
          declaration and to render help, and once per invocation to parse.

          # What concurrency the SDK cannot give you

          The engine keeps no per-invocation state, so two concurrent
          [Executor.Execute] calls do not interfere. A Binder, however, usually writes
          into a variable the CALLER closed over — fs.IntVar(&port, …) — and that
          variable is the caller's, invisible to the SDK and written by every
          concurrent invocation. Concurrent execution is therefore safe only when the
          Binder allocates its destination per call (fs.Int, fs.String, …) and the
          [Action] reads it back through [InvocationValue.Flags]. That is what those
          sets are for. The alternative would be the SDK taking a lock around memory
          it does not own, for a duration it cannot know.
        name: Binder
        underlying: func(flags *flag.FlagSet)
      - decl: true
        doc: |-
          CommandValue declares one command. The tree it forms is the whole
          declaration: the engine walks it to resolve an argument vector, and the help
          renderer walks the SAME tree to render the text, so a command that exists
          and a command that is documented are one fact rather than two.

          A command is a LEAF or a GROUP, never both:

            - a leaf has [CommandValue.Run] and no [CommandValue.Commands];
            - a group has [CommandValue.Commands] and no Run.

          Both other combinations are refused at construction. Neither Run nor
          Commands is an inert command — a name an operator can type that does
          nothing, which is exactly the zero value ADR 0031 refuses. Both is worse: it
          makes `tool db migrate` mean "run db with the argument migrate" until
          somebody adds a child named migrate, at which point the same command line
          silently means something else. A declaration whose meaning changes when a
          SIBLING is added is not a declaration.

          CommandValue is a published concrete shape (pkg/v1/app/cli.Command aliases it),
          so ADR 0040 applies: it may still change while the module is v0, said out
          loud, and not after v1.
        methods:
          - doc: |-
              IsGroup reports whether this command dispatches to children rather than
              running an [Action]. It reads the declaration rather than a flag set at
              construction, so it answers the same on a CommandValue the caller has just
              written and on one the engine has already validated.
            name: IsGroup
            out:
              - type: bool
            recv: value
        name: CommandValue
        struct:
          fields:
            - doc: |-
                Name is the single token an operator types to reach this command. It is
                compared by exact byte equality — there is deliberately no abbreviation
                matching and no case folding, because both make the meaning of an
                existing command line depend on which siblings exist today.

                It must be non-empty, must contain no space, and must not begin with
                "-": a name beginning with "-" could never be typed, since the parent's
                flag parse would consume it as a flag and stop before it.
              name: Name
              type: string
            - doc: |-
                Summary is the one-line description listed beside this command in its
                parent's help. It is required for a child, because a command listed with
                no summary is a name an operator has to guess at.
              name: Summary
              type: string
            - doc: |-
                Description is the optional long form shown in this command's OWN help,
                under the usage line. It may span several lines; it is written verbatim.
              name: Description
              type: string
            - doc: |-
                Flags declares this command's flags. A nil Binder is a working
                declaration and means "this command takes no flags" — unlike a nil Run,
                which is a real absence, a command with no flags is an ordinary command.
              name: Flags
              type: Binder
            - doc: Run is what a LEAF does. Exactly one of Run and Commands is set.
              name: Run
              type: Action
            - doc: |-
                Commands are a GROUP's children, in the order the help lists them. Two
                children may not share a Name.
              name: Commands
              type: "[]CommandValue"
      - decl: true
        doc: |-
          InvocationValue is one resolved command line: which command was reached,
          what was left over after its flags were parsed, the sets that parsed them,
          and the writer the command may print to.

          InvocationValue is a published concrete shape (pkg/v1/app/cli.Invocation aliases
          it), so ADR 0040 applies: it may still change while the module is v0, said
          out loud, and not after v1.
        methods:
          - doc: |-
              Leaf returns the flag set of the command that is actually running — the last
              element of [InvocationValue.Flags] — or nil when the command declared no
              flags anywhere on its path.

              It exists so a caller reading its own flags does not index a slice whose
              length is a property of how deep the command happens to sit in the tree.
            name: Leaf
            out:
              - type: "*flag.FlagSet"
            recv: value
        name: InvocationValue
        struct:
          fields:
            - doc: |-
                Path is the resolved command path, root first — {"tool", "db",
                "migrate"}. It is what the help and every error message name the command
                by, so a message and a shell prompt spell the same thing.
              name: Path
              type: "[]string"
            - doc: |-
                Args are the positional arguments left after the LEAF's flags were
                parsed: flag.FlagSet.Args of the last set in Flags.

                It is nil when there were none, which is Go's ordinary spelling — len
                and range answer identically for a nil and an empty slice, and manufacturing
                an empty one would only hide that distinction from a caller who does not
                need it.
              name: Args
              type: "[]string"
            - doc: |-
                Flags are the flag sets that parsed this invocation, root first, one per
                element of Path; the leaf's own set is the last. A group's flags are
                parsed by the group's set before its child's name is even read, which is
                why they are separate sets and not one merged one.

                The stdlib's set is handed over unchanged rather than wrapped, so
                Lookup, Visit, VisitAll, NFlag and Arg all work exactly as their
                documentation says. Calling Parse on one again is not defended against:
                the engine has already parsed it, and re-parsing it is a caller's bug
                the SDK cannot distinguish from a caller's intent.
              name: Flags
              type: "[]*flag.FlagSet"
            - doc: |-
                Output is the writer this command may print to. It is never nil.

                It is NOT os.Stdout unless the caller said so: ADR 0030 makes stdout a
                protocol channel that no SDK default may claim, so the zero
                configuration resolves this to os.Stderr and a tool whose output IS a
                protocol sets it explicitly, in main, on one visible line. An Action is
                handed the writer precisely so it never has to reach for a stream
                itself.
              name: Output
              type: io.Writer
  - doc: |-
      Package cli is the command-line engine: it validates a whole command tree
      once, resolves an argument vector against it, renders the help the tree
      implies, and returns a typed error carrying an exit status. It never ends
      the process.

      Package cli — the engine's configuration: two writers, and deliberately
      nothing else.

      Package cli — the one error the engine builds rather than declares. The
      domain's codes and sentinels are declared in internal/core/app/cli
      (ADR 0160); this file holds only the WrapParams that raise
      HELP_WRITE_FAILED over the writer's own error.

      Package cli — resolution and dispatch: the loop that turns an argument
      vector into one [corecli.InvocationValue] and one [corecli.Action] call.

      Package cli — the one seam between this domain and internal/core/app/config.

      Package cli — the help, generated from the declarations and from nowhere
      else.
    functions:
      - doc: |-
          New validates a command tree and returns the [corecli.Executor] that runs it.

          The WHOLE tree is validated here, not the branch an invocation happens to
          take. A declaration is a wiring fact, and a wiring fault discovered by the
          operator who typed the one command nobody had tried is a fault discovered in
          production: `tool db migrate` being unreachable must fail on the first run
          of the binary, not on the first run of the migration.

          Every refusal is one of internal/core/app/cli's sentinels and carries EX_CONFIG
          (78). A [corecli.Binder] is CALLED here, once, on a throwaway set — that is
          what proves it binds no reserved name — so a Binder must be safe to call
          more than once. A Binder that panics is deliberately not recovered: it runs
          inside the caller's own main, on the line that wrote it, and a recovered
          panic there would replace a stack pointing at the bug with a sentence about
          a tree.
        in:
          - name: cfg
            type: Config
          - name: root
            type: corecli.CommandValue
        name: New
        out:
          - name: runner
            type: corecli.Executor
          - name: err
            type: error
      - doc: |-
          FlagSource snapshots the flags an operator ACTUALLY TYPED on one invocation
          and returns them as a configuration layer.

          # Only what was set

          It walks flag.FlagSet.Visit and never VisitAll. That one word is the whole
          value of this adapter: VisitAll yields every DECLARED flag, including the
          ones nobody passed, carrying their Go defaults — so a flag with a zero
          default would override the file and the environment on every single run, and
          a configuration file would appear to be ignored for reasons nothing reports.
          Visit yields only what the command line actually carried, which is exactly
          what "the flags are the highest-precedence layer" is supposed to mean.

          # The flag name IS the config key

          No transformation: no camelCase to snake_case, no "-" to "_", no automatic
          prefixing. Every such rule is a second grammar a reader has to learn and a
          generator has to reproduce, and its failure mode is a key nobody typed
          silently not matching a field. A flag that feeds `database.max_conns`
          declares itself as "database.max_conns" — package flag accepts a dot in a
          name and parses -database.max_conns=5 without help. And when the name is
          wrong, the config schema (ADR 0061) REFUSES an unaddressed key rather than
          ignoring it, so the mistake is loud at startup.

          # What this is not

          It is not a configuration loader. It reads no file, no environment variable
          and no default; it does no layering, no decoding and no validation. Those
          are the config domain, they already exist, and a CLI carrying its own copy
          would be a second one to disagree with. The intended shape is one line:

          	err := config.LoadSchema(&cfg, schema,
          		config.FileSource("toml", "/etc/tool.toml"),
          		config.EnvSource("TOOL_"),
          		cli.FlagSource(invocation)) // last wins

          # Precedence inside one invocation

          The sets are visited root first, so a leaf flag overrides an ancestor flag
          of the same name — the same "later wins" direction config.Load already uses
          between sources, rather than a second rule to remember.
        in:
          - name: invocation
            type: corecli.InvocationValue
        name: FlagSource
        out:
          - type: "*FlagSourceValue"
    imports:
      corecli: github.com/kitsunium/sdk/internal/core/app/cli
    path: github.com/kitsunium/sdk/internal/service/app/cli
    types:
      - doc: |-
          Config configures one [New]. Its zero value is a working configuration.

          It carries two writers and nothing else. There is no Signals field, no
          shutdown budget, no logger, no config source and no env prefix: every one of
          those is a domain the SDK already ships, and a CLI that grew its own copy
          would be a second, weaker one that the first would eventually disagree with.
          ADR 0065 §D6 lists what this domain composes and what it refuses to redo.

          Config is a published concrete shape (pkg/v1/app/cli.Config aliases it), so ADR
          0040 applies: it may still change while the module is v0, said out loud, and
          not after v1.
        name: Config
        struct:
          fields:
            - doc: |-
                Output is where a command's OWN output goes. It reaches a [corecli.Action] as
                InvocationValue.Output, so a command never has to reach for a process
                stream itself.

                The zero value resolves to os.Stderr, NOT os.Stdout. ADR 0030 makes
                stdout a protocol channel that no SDK default may claim: a tool whose
                output is a JSON document on a pipe sets Output: os.Stdout in main,
                which is one visible line at the one place that can honestly make the
                choice. A zero value is what somebody who has not yet learned the
                question exists chose, so it must not be the dangerous one.
              name: Output
              type: io.Writer
            - doc: |-
                ErrOutput is where the generated help, and the usage that follows a bad
                command line, are written. The zero value resolves to os.Stderr.

                It is a SECOND writer rather than the same one so that setting Output to
                os.Stdout for a machine-readable tool does not put a help page in the
                middle of the document a consumer is parsing.

                What is deliberately NOT written here is the error itself. The engine
                owns the help — it is generated from the declarations and only the SDK
                can render it — and the caller owns how an error is presented, because a
                caller may want it as a line on stderr, as a log record, or as JSON. Two
                voices printing one failure is how a CLI ends up saying it twice.
              name: ErrOutput
              type: io.Writer
      - doc: |-
          FlagSourceValue is one invocation's flags, shaped as the flat key→value
          layer internal/core/app/config.Source yields. It is the whole of what this
          domain contributes to configuration, and everything it deliberately is not
          is listed in [FlagSource].

          FlagSourceValue is a published concrete shape (pkg/v1/app/cli.FlagSource returns
          it), so ADR 0040 applies: it may still change while the module is v0, said
          out loud, and not after v1.
        methods:
          - doc: Load returns the layer. It satisfies internal/core/app/config.Source.
            name: Load
            out:
              - name: values
                type: map[string]any
              - name: err
                type: error
            recv: pointer
        name: FlagSourceValue
        struct:
          unexported: true
  - constants:
      - doc: Success is the process exit status of a command that did what it was asked.
        name: Success
        type: int
        value: "0"
    doc: |-
      Package cli is the public facade for the SDK's command-line domain: the
      sub-commands, the generated help and the typed exit status that the stdlib's
      flag package deliberately does not have.

      	root := cli.Command{
      		Name:    "tool",
      		Summary: "does the thing",
      		Commands: []cli.Command{{
      			Name:    "serve",
      			Summary: "run the HTTP server",
      			Flags:   func(fs *flag.FlagSet) { fs.IntVar(&port, "port", 8080, "listen `port`") },
      			Run: func(ctx context.Context, in cli.Invocation) error {
      				return serve(ctx, port)
      			},
      		}},
      	}

      	func main() {
      		app, err := cli.New(cli.Config{}, root)
      		if err != nil {
      			fmt.Fprintln(os.Stderr, err)
      			os.Exit(cli.Status(err))
      		}
      		err = app.Execute(context.Background(), os.Args[1:])
      		if err != nil {
      			fmt.Fprintln(os.Stderr, err)
      		}
      		os.Exit(cli.Status(err))
      	}

      # What it adds to package flag, and what it leaves alone

      It adds four things and nothing else: sub-commands to arbitrary depth, one
      help text generated from the declarations, a typed exit status, and a seam
      to the rest of the SDK.

      It leaves the whole of flag alone. A [Binder] receives the stdlib's own
      *[flag.FlagSet]: the flag syntax, the [flag.Value] interface, every
      FooVar helper you already use, the "-x=v / -x v" forms and the rendering of
      the defaults table are flag's, unchanged and unwrapped. There is no
      cobra, no pflag, no third-party dependency of any kind — an argument parser
      is a mechanism, not a connector to somebody else's system, and this SDK
      writes its mechanisms.

      # Nothing here can end your process

      flag's own answer to a bad argument is [flag.ExitOnError], which calls
      os.Exit from inside a library: it makes the parse untestable, it skips every
      deferred function in the program, and it decides on your behalf whether the
      process should still be alive. This domain uses [flag.ContinueOnError] and
      returns an error. There is no os.Exit, no log.Fatal and no panic in the
      path — pinned by an AST audit over the production sources AND the suite, not
      by a comment.

      # The exit status

      The status is carried by the SDK's existing error model and NOT by a second
      convention: a sentinel declares it with errs.WithExitCode and a caller reads
      it with errs.ExitCodeOf. [Status] is the single guard on top of that, and it
      exists for one sharp reason: errs.ExitCodeOf(nil) is 70, because it answers
      "what status does this error map to" and nil is not an error. Passing a
      successful Execute straight into it would exit 70 on every success.

      	| outcome                          | status | who chose it              |
      	|----------------------------------|--------|---------------------------|
      	| the command succeeded            | 0      | Status                    |
      	| -h / -help was asked for         | 0      | Execute returns nil       |
      	| the command line was wrong       | 64     | service/app/cli (EX_USAGE)    |
      	| the tree is wired wrong          | 78     | core/app/cli (EX_CONFIG)      |
      	| the command failed               | its own errs code, or 70   | the command   |

      The last row is the one worth stating: an [Action] returning an *errs.Error
      keeps its own code AND its own exit status all the way out, because the
      error is returned VERBATIM and never relabelled by the framework that called
      it.

      # Help

      The help is generated from the same declarations the resolver walks — the
      summaries, the sub-command list, and flag's own PrintDefaults over the set
      the Binder filled. It is never written by hand, because a help maintained
      beside the declarations eventually describes a flag that was renamed, and an
      operator acts on what the help says.

      Asking for it is not a failure: -h writes the help and Execute returns nil.
      A bad command line writes the SAME help and returns an EX_USAGE error, so
      the exit status is what distinguishes them and the text does not have to.

      # Where the output goes

      [Config].Output (a command's own output) and [Config].ErrOutput (help and
      usage) both default to os.Stderr, and neither defaults to os.Stdout. ADR
      0030 makes stdout a protocol channel that no SDK default may claim; a tool
      that emits a document sets Output: os.Stdout in main, on one visible line,
      and its help still stays on stderr where it cannot corrupt the document.

      # What it composes rather than reimplements

        - config — [FlagSource] turns the flags an operator ACTUALLY TYPED into
          the top layer of a config load. It uses flag.FlagSet.Visit and never
          VisitAll, so an unset flag's Go default never overrides a file. There is
          no env reading, no file reading, no layering and no validation here:
          that is the config domain, and it already exists.
        - lifecycle — nothing. There is no Signals field and no shutdown budget:
          signals are a process-wide side effect and lifecycle.Run already makes
          them opt-in for that reason. A long-running command composes it inside
          its own Action, where the context it needs already is.
        - errs — the whole error model, including the exit status. This domain
          defines no status convention of its own.

      # Deliberately absent

      No "did you mean …?": the help that has just been written already lists
      every name that would have worked, which is the complete answer and cannot
      be wrong. No prefix or abbreviation matching, and no case folding: both make
      what an existing command line MEANS depend on which siblings exist in
      today's release. No shell-completion generator, no colour, no interactive
      prompting, no environment-variable fallback per flag.

      Package cli — hosts the compile-time interface assertions, keeping them out
      of the production source so the runtime binary carries no diagnostic-only
      declarations.
    facade:
      - alias:
          - doc: Action is what one command does — see [Command].
            name: Action
            target: corecli.Action
      - alias:
          - doc: Binder declares one command's flags onto the stdlib set that parses them.
            name: Binder
            target: corecli.Binder
      - alias:
          - doc: Executor resolves an argument vector against a command tree and runs it.
            name: Executor
            target: corecli.Executor
      - alias:
          - doc: |-
              Command is one declared command: a name, what it says about itself, its
              flags, and EITHER an [Action] OR sub-commands.
            name: Command
            target: corecli.CommandValue
      - alias:
          - doc: Invocation is one resolved command line as an [Action] sees it.
            name: Invocation
            target: corecli.InvocationValue
      - alias:
          - doc: Config configures [New] — two writers, and deliberately nothing else.
            name: Config
            target: svccli.Config
      - alias:
          - doc: FlagSourceValue is one invocation's typed flags as a config layer.
            name: FlagSourceValue
            target: svccli.FlagSourceValue
      - var:
          - doc: |-
              InvalidCommand refuses a declaration that could never be reached or
              could never run: a blank name, a name that would be parsed as a flag, a
              child with no summary, or neither an Action nor sub-commands.
            name: InvalidCommand
            reexport: corecli.InvalidCommand
            type: "*kerrs.Error"
          - doc: |-
              AmbiguousCommand refuses a command carrying BOTH an Action and
              sub-commands, where adding a child would silently change what an
              existing command line means.
            name: AmbiguousCommand
            reexport: corecli.AmbiguousCommand
            type: "*kerrs.Error"
          - doc: DuplicateCommand refuses two sub-commands of one group sharing a name.
            name: DuplicateCommand
            reexport: corecli.DuplicateCommand
            type: "*kerrs.Error"
          - doc: |-
              ReservedFlag refuses a Binder that bound -h or -help, the two names the
              SDK answers itself.
            name: ReservedFlag
            reexport: corecli.ReservedFlag
            type: "*kerrs.Error"
          - blank: true
            doc: |-
              UnknownCommand is returned when a token names no sub-command of the
              group it was typed under. EX_USAGE (64).
            name: UnknownCommand
            reexport: corecli.UnknownCommand
            type: "*kerrs.Error"
          - doc: |-
              MissingCommand is returned when a group is invoked with no sub-command.
              EX_USAGE (64).
            name: MissingCommand
            reexport: corecli.MissingCommand
            type: "*kerrs.Error"
          - doc: |-
              InvalidFlags is returned when package flag refused the vector. EX_USAGE
              (64).
            name: InvalidFlags
            reexport: corecli.InvalidFlags
            type: "*kerrs.Error"
          - doc: |-
              CommandPanicked is returned when an [Action] panicked. The recovered
              value and the originating stack travel as fields; the status stays
              EX_SOFTWARE (70).
            name: CommandPanicked
            reexport: corecli.CommandPanicked
            type: "*kerrs.Error"
          - doc: |-
              HelpWriteFailed is returned when -h asked for the help and the stream it
              goes to did not take the page — a closed pipe, a full disk. The
              stream's own error stays matchable beneath it, or rides in a field when
              it is itself an SDK error, so the code and EX_IOERR (74) are always this
              one's. A bad command line keeps its EX_USAGE even when its help could
              not be written.
            name: HelpWriteFailed
            reexport: corecli.HelpWriteFailed
            type: "*kerrs.Error"
      - func:
          doc: |-
            New validates a whole command tree and returns the [Executor] that runs it.

            The WHOLE tree is checked, not the branch an invocation happens to take, so
            a mis-wired `tool db migrate` fails on the first run of the binary rather
            than on the first run of the migration. Every refusal carries EX_CONFIG
            (78).

            Each [Binder] is CALLED once here, on a throwaway flag set, which is what
            proves it binds no reserved name — so a Binder must be safe to call more
            than once and must touch only the set it is given.
          forward: svccli.New
          in:
            - name: cfg
              type: Config
            - name: root
              type: Command
          name: New
          out:
            - name: runner
              type: Executor
            - name: err
              type: error
      - func:
          doc: |-
            FlagSource turns the flags an operator ACTUALLY TYPED on one invocation into
            a config layer, for use as the LAST source of a config.Load or
            config.LoadSchema — the position that makes a flag win over a file and over
            the environment.

            It walks flag.FlagSet.Visit and never VisitAll: an unset flag contributes
            NOTHING, so a flag whose default is the Go zero cannot silently override the
            configuration file on every run. The flag name is the config key verbatim,
            with no case or separator transformation, because a rename rule is a second
            grammar whose failure mode is a key that quietly matches nothing.
          forward: svccli.FlagSource
          in:
            - name: invocation
              type: Invocation
          name: FlagSource
          out:
            - type: "*FlagSourceValue"
    functions:
      - doc: |-
          Status is the process exit status for what [Executor].Execute returned: 0
          when err is nil, and errs.ExitCodeOf(err) otherwise.

          It is a guard on the SDK's existing convention and not a second one.
          errs.ExitCodeOf answers "what status does THIS ERROR map to", so it returns
          the EX_SOFTWARE default (70) for a nil it was never meant to be handed —
          which is correct for an accessor and catastrophic at a CLI boundary, where
          success is the common case. This is the one place in the SDK where nil has
          to mean 0, so this is where the guard lives.

          	os.Exit(cli.Status(app.Execute(ctx, os.Args[1:])))
        in:
          - name: err
            type: error
        name: Status
        out:
          - type: int
      - doc: |-
          Execute is the one-line form of [New] followed by [Executor].Execute. It
          returns the same errors both would: a construction refusal carries EX_CONFIG
          (78), so a caller that only wants a status can pass the result straight to
          [Status].
        in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: Config
          - name: root
            type: Command
          - name: args
            type: "[]string"
        name: Execute
        out:
          - type: error
    imports:
      corecli: github.com/kitsunium/sdk/internal/core/app/cli
      kerrs: github.com/kitsunium/sdk/internal/kernel/errs
      svccli: github.com/kitsunium/sdk/internal/service/app/cli
    path: github.com/kitsunium/sdk/pkg/v1/app/cli
