apiVersion: kit.kitsunium/design/v2
domain: app/validation
packages:
  - codes:
      - const:
          - doc: |-
              CodeValidationFailed identifies the aggregate error a non-empty ReportValue
              converts to. It is the code an error-typed contract sees; the individual
              rules keep their own codes inside the report.
            name: CodeValidationFailed
            note: "range: 0.2.15.0 - 0.2.15.255"
            value: "0x00_02_0F_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeConstraintMisconfigured identifies a constraint refused AT CONSTRUCTION
              because its configuration cannot be honoured — an inverted numeric range, a
              negative length bound, an empty allowed set, an uncompilable pattern. It is
              never a validation outcome: the value was never reached.
            name: CodeConstraintMisconfigured
            value: "0x00_02_0F_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeRequired identifies a value that is absent where presence was required.
              It is a VIOLATION code — it travels on a ViolationValue, not on an error.
            name: CodeRequired
            note: |-
              range: 0.3.47.0 - 0.3.47.255

              The rules' violation codes and the tag compiler's refusals. The range was
              allocated to internal/service/app/validation, whose constraints and tag
              compiler use these codes, and it is declared here with the port's so that
              every code of the domain is in one place (ADR 0160). A code keeps the value
              its allocation gave it whichever layer declares it, so the layer byte still
              reads 3.
            value: "0x00_03_2F_01"
        type: errs.Code
      - const:
          - doc: CodeOutOfRange identifies an ordered value outside its allowed bounds.
            name: CodeOutOfRange
            value: "0x00_03_2F_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeLengthOutOfRange identifies a string, slice or array whose SIZE is
              outside its allowed bounds. It is distinct from CodeOutOfRange because
              "between 3 and 10" and "3 to 10 characters long" are different rules with
              different fixes, and a caller routing on the code should not have to guess
              which one fired.
            name: CodeLengthOutOfRange
            value: "0x00_03_2F_03"
        type: errs.Code
      - const:
          - doc: CodeNotInSet identifies a value absent from the constraint's allowed set.
            name: CodeNotInSet
            value: "0x00_03_2F_04"
        type: errs.Code
      - const:
          - doc: CodePatternMismatch identifies a string that did not match its pattern.
            name: CodePatternMismatch
            value: "0x00_03_2F_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidRule identifies a struct tag refused at COMPILE time: an unknown
              rule, a malformed argument, a rule applied to a kind it cannot check, or a
              construct this dialect refuses by name. It is an error, never a violation —
              the value was never reached.
            name: CodeInvalidRule
            value: "0x00_03_2F_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedTarget identifies a Struct[T] whose T the tag engine cannot
              walk — anything that is not a struct type.
            name: CodeUnsupportedTarget
            value: "0x00_03_2F_07"
        type: errs.Code
    constants:
      - doc: |-
          RootPath is the path of the value handed to a validator, before any descent.
          A violation reported at RootPath is about the value as a whole — a
          cross-field rule with no single culpable member.
        name: RootPath
        type: string
        value: "\"\""
    doc: |-
      Package validation — ranges 0.2.15.* (ADR 0046 core/app/validation block)
      and 0.3.47.* (ADR 0046 service/app/validation block, declared here since
      ADR 0160).

      Package validation — declares the sentinel *errs.Error outcomes of the
      domain: the port's, and those the struct-tag compiler emits. Each var's name
      equals its errs.Define Reason in SCREAMING_SNAKE form.

      The VIOLATION codes (0.3.47.1 - 0.3.47.5) deliberately have no sentinel: a
      violation is a ViolationValue, not an error, and minting five unused
      *errs.Error values to mirror them would invite exactly the confusion ADR 0046
      §Violations are not errors exists to prevent.

      Package validation — defines the path grammar every ViolationValue speaks.

      Package validation — hosts ReportValue, the ordered collection of everything
      one validation found wrong.

      Package validation declares the SDK's value-checking port: the [Constraint]
      that inspects one value, the [ViolationValue] it reports when that value is
      not acceptable, and the [ReportValue] that collects them. A core sibling
      admitted by ADR 0046.

      The port is a FUNCTION type rather than an interface — the shape
      internal/core/CLAUDE.md already admits for resilience.Operation and
      scheduler.Job/Schedule. ADR 0039's rule is that a published port must not
      grow a method, because pkg/v1 aliases publish the shape and Go interfaces are
      structural; a func type satisfies that rule structurally, since it cannot
      grow a method at all.

      # What this package is not

      It is not internal/core/app/config.Validator. That port is a decoded config
      struct's SELF-check — `Validate() error`, one boolean answer, called once by
      config.Load. This package is the engine that answers it: a struct implements
      config.Validator by running its constraints and returning ReportValue.Err().
      The two compose; neither replaces the other.

      The concrete constraints (presence, bounds, length, set membership, pattern),
      the combinators that descend into fields and elements, and the struct-tag
      front end live in internal/service/app/validation. This package owns the
      contract, the two domain values, the path grammar, and the typed sentinels.

      Package validation — hosts ViolationValue, the located statement that one
      value failed one rule.
    functions:
      - doc: |-
          JoinField extends base with a struct member, producing the dotted form the
          grammar defines:

          	JoinField(RootPath, "user")        == "user"
          	JoinField("user", "address")       == "user.address"
          	JoinField("user.addresses[2]", "zip") == "user.addresses[2].zip"

          name is whatever the calling front end names the member. The struct-tag
          front end passes the json tag's name when the field has one, else the Go
          field name (ADR 0046): the SDK's own config.Load decodes every format through
          a JSON round trip, so the json name is the key the operator actually wrote.
          The programmatic Field takes the name as an argument, so there the caller
          decides.

          The grammar does not quote. A member name that itself contains '.', '[' or
          ']' — json:"log.level" is legal — yields a path indistinguishable from a
          nested or indexed one. The quoted segment that would disambiguate it is the
          same one map descent needs, and ADR 0046 §Deferred defers both together
          rather than growing the grammar for one of them.
        in:
          - name: base
          - name: name
            type: string
        name: JoinField
        out:
          - type: string
      - doc: |-
          JoinIndex extends base with an element position, producing the bracketed
          form the grammar defines:

          	JoinIndex("addresses", 2) == "addresses[2]"

          The bracket binds tighter than the dot: "a.b[0].c" is element 0 of a.b, and
          there is never a dot before an opening bracket.
        in:
          - name: base
            type: string
          - name: index
            type: int
        name: JoinIndex
        out:
          - type: string
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/validation
    sentinels:
      - var:
          - code: CodeValidationFailed
            doc: |-
              ValidationFailed is what ReportValue.Err returns for a non-empty report.
              Its fields carry the violation count, the first rule, and the list of
              paths — never a message and never a value. The full report stays the
              ReportValue; this error is the shape an error-typed contract can hold.
            name: ValidationFailed
            options:
              - errs.WithHTTPStatus(httpUnprocessable)
            private: "core/app/validation: a ReportValue was converted to an error; the fields carry the violation count and the offending paths"
            public: One or more values did not satisfy their constraints
            reason: VALIDATION_FAILED
          - code: CodeConstraintMisconfigured
            doc: |-
              ConstraintMisconfigured is returned by a constraint CONSTRUCTOR whose
              arguments it cannot honour: a minimum above its maximum, a negative
              length, an empty allowed set, an uncompilable pattern.

              It is the ADR 0031 half that must not be confused with the other: a
              validator with NO constraint is legitimate and passes, while a
              constraint that could never be satisfied — or never be evaluated — is
              refused before it can quietly reject, or quietly accept, everything.
            name: ConstraintMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/validation: a constraint constructor received bounds or arguments it cannot honour; the fields name the rule and the clause that failed"
            public: The constraint cannot be built from the given configuration
            reason: CONSTRAINT_MISCONFIGURED
          - code: CodeInvalidRule
            doc: |-
              InvalidRule is returned by Struct when a validate tag cannot be
              compiled. The fields name the field, the rule and the clause that
              failed; the message never guesses at what was meant, it names what was
              refused — an unsupported dialect construct is refused BY NAME so the fix
              is one word, not an investigation.
            name: InvalidRule
            note: |-
              The struct-tag compiler's refusals, raised by internal/service/app/validation.
              They are declared here, with the port's, so that the domain's codes and
              sentinels are in one place (ADR 0160).
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/validation: a validate tag names an unknown rule, a malformed argument, or a rule the field's kind cannot answer; the fields carry the field name, the rule and the clause"
            public: The validate struct tag could not be compiled
            reason: INVALID_RULE
          - code: CodeUnsupportedTarget
            doc: |-
              UnsupportedTarget is returned by Struct when T is not a struct type.
              The tag engine walks fields; there is nothing to walk on a scalar, a
              slice or a pointer, and inventing a meaning for those would be a
              different feature wearing this one's name.
            name: UnsupportedTarget
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/validation: Struct[T] was instantiated with a non-struct T; the field carries the kind that was seen"
            public: Struct tag validation requires a struct type
            reason: UNSUPPORTED_TARGET
    types:
      - doc: |-
          ReportValue is every violation one validation found, in the order the
          constraints reported them. It is a SLICE rather than a struct so that the
          zero value — nil — is a passing report: a validator with no constraint
          passes, which is ADR 0046's first invariant and ADR 0031's "an empty
          configuration is not the same thing as a broken one".

          Composition is therefore plain append, and the accepting path allocates
          nothing at all.

          ReportValue is a published concrete shape (pkg/v1/app/validation.Report aliases
          it), so ADR 0040 applies: it may still change while the module is v0, said
          out loud, and not after v1.
        methods:
          - doc: |-
              OK reports whether the value satisfied every constraint. It is the question
              to ask; comparing len(report) to zero says the same thing less clearly.
            name: OK
            out:
              - type: bool
            recv: value
          - doc: |-
              First returns the earliest violation and whether there was one. Constraints
              report in the order they were composed, so "first" is the outermost rule on
              the earliest field — the one a stop-at-first caller wants.
            name: First
            out:
              - name: violation
                type: ViolationValue
              - name: ok
                type: bool
            recv: value
          - doc: |-
              Paths returns the located path of every violation, in report order. It is
              the shape an HTTP layer wants when it maps a report onto a form: the caller
              already knows its own field names, and needs the SDK to say which ones.
            name: Paths
            out:
              - type: "[]string"
            recv: value
          - doc: |-
              Err converts the report to the SDK error model, so a validation result can
              satisfy an error-typed contract — principally core/app/config.Validator's
              Validate() error, which is how a decoded config struct self-checks.

              It returns a genuine nil interface when the report is OK. That is why
              ReportValue does not implement error itself: a value type implementing error
              and returned by value makes `if err != nil` true for a PASSING validation,
              the typed-nil trap errs.Wrap has an explicit case for.

              The error carries the violation COUNT and the list of paths, never the
              messages and never the values: the full report is the report. A caller that
              needs every message keeps the ReportValue; the error is the interop shape.
            name: Err
            out:
              - type: error
            recv: value
        name: ReportValue
        underlying: "[]ViolationValue"
      - doc: |-
          Constraint reports what is wrong with value, at the path by which value was
          reached. A value it accepts yields a nil [ReportValue] — the acceptance path
          therefore allocates nothing, which matters because it is the path taken on
          every field of every valid request.

          path is the position of value inside the structure being validated, in the
          grammar [JoinField] / [JoinIndex] define; [RootPath] means "the value itself".
          A Constraint MUST propagate that path into every ViolationValue it reports,
          and MUST NOT invent a different grammar — the path is the whole reason a
          violation is actionable on a nested structure.

          Implementations MUST be pure and safe for concurrent use: the same value at
          the same path always yields the same report, and one compiled Constraint is
          shared by every goroutine validating that type.

          A Constraint MUST NOT copy the VALUE it rejected into the report. It names
          the rule and the bound; the value may be a password, a token or a national
          identifier, and a validation message is the one error message in a service
          that is designed to reach the end user. See [ViolationValue].
        name: Constraint
        typeParams:
          - constraint: any
            name: T
        underlying: func(path string, value T) ReportValue
      - doc: |-
          ViolationValue is one located failure: WHERE it happened, WHICH rule it
          broke, a wire-safe explanation, and a routable [errs.Code].

          It is deliberately NOT an error. A validation normally produces several of
          them, and errors.Join of five would render five bracket headers, lose the
          ordering and bury the paths — while a single error would have to pick one
          violation to be about. The aggregate that IS convertible to an error is
          [ReportValue]; see its Err method.

          The zero value is not meaningful; constraints build one per failure.
        name: ViolationValue
        struct:
          fields:
            - doc: |-
                Path locates the offending value inside the structure that was
                validated, in the grammar of [JoinField] / [JoinIndex] —
                "user.addresses[2].zip". [RootPath] (the empty string) means the value
                as a whole, which is what a cross-field rule reports when no single
                field is at fault.
              name: Path
              type: string
            - doc: |-
                Rule names the constraint that refused, in lower case —
                "required", "between", "length", "one_of", "pattern". It is the stable
                identifier a caller switches on when the Code granularity is too coarse,
                and the key an application uses to look up its own translated message.
              name: Rule
              type: string
            - doc: |-
                Message explains the rule in one wire-safe line: no newline, no private
                data, and — the part that is a security property rather than a style
                choice — NEVER the rejected value itself. A validation message is the
                one error message in a service designed to reach the end user, so a
                message that echoed the value would exfiltrate whatever the caller was
                unwise enough to validate: a password, a token, a card number. It names
                the rule and the bound instead ("must be between 8 and 64 characters").
              name: Message
              type: string
            - doc: |-
                Code is the dotted-quad identity of the rule that refused, so a caller
                routes on it with errs.HasCode / errs.NewPrefixMatcher instead of
                string-matching Rule. The built-in constraints own 0.3.47.*; a
                consumer-written Constraint SHOULD carry a Code in the third-party
                Major range (ADR 0019, 0x40-0x7F).
              name: Code
              type: errs.Code
  - constants:
      - doc: |-
          Unbounded is the upper bound that means "no ceiling". It is spelled rather
          than implied by a negative number so a reader of Length(8, Unbounded) does
          not have to know the convention to understand the line.
        name: Unbounded
        type: int
        value: "-1"
    doc: |-
      Package validation — the ordered-value bounds constraints.

      Package validation — the struct-tag compiler. Everything here runs once per
      type, at construction; nothing here runs during a validation.

      Package validation — the descent combinators. These are what make a
      violation LOCATED on a nested structure, and they do it with an accessor
      function rather than reflection: the programmatic path never imports
      reflect, so a hot validator is a chain of direct field reads the compiler
      can inline.

      Package validation — compiling the `dive` descent.

      Descent is EXPLICIT. A nested struct is walked only when its field says
      dive, never automatically: automatic recursion would walk into time.Time,
      net.IP and every other struct that happens to be a field, and a rule engine
      that silently reaches places the author did not name is a rule engine whose
      report cannot be trusted.

      Package validation — hosts elementPlan, the rule set one element of a dived
      slice or array is checked against.

      Package validation — one embedded struct encoding/json descends into.

      Package validation — which field a JSON key actually decodes into.

      Package validation — the regular-expression constraint.

      Package validation — the compiled struct-tag plan and its per-type cache.

      A plan is compiled ONCE per (type, mode) and reused by every validation of
      that type. Parsing a struct tag on every request would put string splitting
      and reflect.StructField lookups on the hot path of every field of every
      request — which is exactly the shape of the "we added validation and the p99
      moved" post-mortem. See BENCH.md for what the cache is worth.

      Package validation — hosts planKey, the identity of a compiled plan.

      Package validation — the presence constraint.

      Package validation — a field the plan puts rules on, located for the reach
      check.

      Package validation — the refusal helpers. Every refusal names what was
      wrong in structured fields; the Public message stays a fixed literal.

      Package validation — the closed set of built-in rule names. A rule name is
      part of the published contract: it is what a ViolationValue.Rule carries,
      what an application keys its own translated messages on, and what a validate
      struct tag spells. Adding one is a decision the SDK maintains forever.

      Package validation — the tag dialect: what a rule item may say, and what it
      is refused for saying.

      Package validation — the kind-bound halves of the tag dialect. Each builder
      resolves the field's kind ONCE, at compile time, and returns a closure that
      reads the value through the one accessor that kind supports. A validation
      therefore performs no type dispatch at all.

      Package validation — the tag half of set membership.

      Package validation — the set-membership constraint.

      Package validation — the size constraints: how long a string is, and how
      many elements a slice holds. Two rules rather than one, because "at most 30
      characters" and "at most 30 entries" are different requirements with
      different fixes, and Go's type system cannot spell len over both anyway.

      Package validation — the struct-tag front end.

      Package validation implements the SDK's constraint engine over the
      internal/core/app/validation port: a small, closed set of built-in constraints,
      the combinators that compose them and descend into nested structures, and a
      struct-tag front end that compiles a cached plan per type (ADR 0046).

      Two entry shapes, one contract. The PROGRAMMATIC path is generic and uses no
      reflection at all — Field and Each take an accessor function, so every
      descent is a direct field read the compiler can inline. The TAG path trades
      that for ergonomics and is measured rather than assumed; see BENCH.md.

      Both produce a core/app/validation.Constraint, so they compose with each other:
      a struct-tag validator and a hand-written cross-field rule can be handed to
      All and appear in one report.

      Collecting EVERY violation is the default and First is the opt-in. A form
      that reports one error at a time makes the user submit it five times.

      Package validation — the single place a ViolationValue is minted, so every
      built-in constraint reports the same shape.
    functions:
      - doc: |-
          AtLeast refuses a value below lo. The bound is inclusive: lo itself passes.
          It is the programmatic spelling of the `min=` struct tag; the name avoids
          shadowing Go's `min` builtin at every call site that dot-imports nothing.

          It cannot be misconfigured — every value of an ordered type is a legitimate
          floor — so it returns a Constraint directly.
        in:
          - name: lo
            type: T
        name: AtLeast
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: cmp.Ordered
            name: T
      - doc: |-
          AtMost refuses a value above hi. The bound is inclusive: hi itself passes.
          It is the programmatic spelling of the `max=` struct tag.

          It cannot be misconfigured, for the same reason as [AtLeast].
        in:
          - name: hi
            type: T
        name: AtMost
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: cmp.Ordered
            name: T
      - doc: |-
          Between refuses a value outside the closed interval [lo, hi].

          It REFUSES lo > hi at construction rather than validating in silence. An
          inverted interval is satisfied by nothing, so the alternative is a validator
          that rejects every value it is ever shown while reporting a plausible
          per-field message — the ADR 0031 failure mode, in its rejecting form. The
          caller who wrote Between(10, 1) meant Between(1, 10), and finds out now
          rather than from a support ticket.

          lo == hi is NOT a misconfiguration: an interval of exactly one value is a
          coherent requirement, and refusing it would be the SDK second-guessing a
          legitimate intent.
        in:
          - name: lo
          - name: hi
            type: T
        name: Between
        out:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        typeParams:
          - constraint: cmp.Ordered
            name: T
      - doc: |-
          Field applies constraints to a member of T reached through get, reporting
          every violation at the parent path extended by name.

          name is the member's name as the CALLER wants it to appear in a path; the
          SDK does not read it off the type, because the programmatic path never
          touches reflection. [Struct] derives it from the json tag instead.

          A nil get is REFUSED at construction. It is not a missing rule — the rules
          are right there — it is a missing way to reach the value they are about, so
          carrying it would produce a validator that runs, reports nothing, and looks
          exactly like a passing one. That is the ADR 0031 trap in its accepting form,
          which is the more dangerous of the two. An empty name is refused for the
          neighbouring reason: a violation whose path silently points at the parent is
          a violation that is not located.
        in:
          - name: name
            type: string
          - name: get
            type: func(T) F
          - name: constraints
            type: corevalidation.Constraint[F]
        name: Field
        out:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        typeParams:
          - name: T
          - constraint: any
            name: F
        variadic: true
      - doc: |-
          Each applies constraints to EVERY element of a slice member of T reached
          through get, reporting each element's violations at the parent path extended
          by name and the element's index — "addresses[2]".

          Every element is visited, including those after the first failing one: an
          import that reports row 3 and stops makes the operator run the import six
          times. The elements are visited in slice order, so the report is stable
          across runs, which is what makes two reports diffable.

          A nil slice contributes nothing — it holds no element to be wrong about.
          Requiring at least one element is [Count], a different question asked at the
          member itself.

          A nil get, or an empty name, is refused at construction for the reasons
          [Field] gives.
        in:
          - name: name
            type: string
          - name: get
            type: func(T) []E
          - name: constraints
            type: corevalidation.Constraint[E]
        name: Each
        out:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        typeParams:
          - name: T
          - constraint: any
            name: E
        variadic: true
      - doc: |-
          Must returns constraint, panicking when err is non-nil. It is the
          regexp.MustCompile / template.Must idiom, for the same situation: a
          constraint built from source literals at package initialisation, where the
          only possible error is a defect the binary must not start with.

          Use it for a package-level var. Do NOT use it on a bound that comes from
          configuration — there the error is a real runtime condition and must be
          returned, which is why every fallible constructor hands one back.
        in:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        name: Must
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Matches refuses a string that the pattern does not match anywhere. Anchor it
          with ^ and $ when the whole string must match — that is regexp's own
          convention and inventing a different one here would surprise everyone who
          already knows it.

          The pattern is COMPILED AT CONSTRUCTION and an uncompilable one is refused
          (ADR 0031). A pattern compiled lazily on first use would turn a typo in a
          rarely-exercised rule into a failure at the worst possible moment; compiling
          now means a bad pattern cannot reach production at all.

          # Why this is safe against the input

          Go's regexp is RE2: no backtracking, linear time in the length of the input.
          A pattern cannot be turned into a denial of service by the value it is shown,
          which is what makes it acceptable to run one on untrusted input at all. It
          also means the SDK does NOT need — and does not impose — an input length cap
          here; cap the length with [Length] if the field has one, for its own reasons.

          Matches is deliberately absent from the struct-tag dialect. See [Struct].
        in:
          - name: pattern
            type: string
        name: Matches
        out:
          - name: constraint
            type: corevalidation.Constraint[string]
          - name: err
            type: error
      - doc: |-
          Required refuses the zero value of T.

          # What "absent" means here, and what it cannot mean

          A Go value type has no representation for "not supplied": the zero value is
          what a decoder leaves behind for a field the input never mentioned AND for a
          field the input explicitly set to 0, "" or false. Required therefore refuses
          BOTH, and it cannot tell them apart — no constraint operating on T can.

          This is stated rather than hidden because it changes designs: a caller who
          must distinguish "the operator did not configure a timeout" from "the
          operator configured a timeout of zero" declares the field as a POINTER, and
          Required on *time.Duration then means exactly "was supplied". The SDK will
          not guess which of the two a bare zero meant.

          Required needs no configuration and therefore cannot be misconfigured, which
          is why it returns a Constraint directly rather than a (Constraint, error).

          It is constrained to comparable T because presence is "differs from the zero
          value", and a slice is not comparable. Presence of a slice is its element
          count: use Count(1, Unbounded).
        name: Required
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: comparable
            name: T
      - doc: |-
          OneOf refuses a value absent from allowed.

          It REFUSES an empty allowed set at construction. An empty set is satisfied
          by nothing, so the alternative is a constraint that rejects every value it
          is ever shown while looking like a working rule — the ADR 0031 failure mode
          in its rejecting form. "No allowed values" is not a permissive rule, it is a
          forgotten argument.

          Duplicates in allowed are accepted and collapse: repeating a value does not
          change the set it denotes, and refusing a duplicate would turn a harmless
          copy-paste in a generated list into a start-up failure.
        in:
          - name: allowed
            type: T
        name: OneOf
        out:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        typeParams:
          - constraint: comparable
            name: T
        variadic: true
      - doc: |-
          Length refuses a string whose RUNE count falls outside [min, max].

          It counts runes, not bytes: "at most 30 characters" is what a form says, and
          counting bytes would refuse a perfectly ordinary accented name at 16
          characters. It does not count grapheme clusters — an emoji built from a
          zero-width-joiner sequence counts as several runes — because clustering
          needs a Unicode table the SDK does not carry, and claiming otherwise would
          be worse than saying so.

          max may be [Unbounded]. A negative min, or min > max when max is bounded, is
          refused at construction (ADR 0031).
        in:
          - name: minRunes
          - name: maxRunes
            type: int
        name: Length
        out:
          - name: constraint
            type: corevalidation.Constraint[string]
          - name: err
            type: error
      - doc: |-
          Count refuses a slice whose ELEMENT count falls outside [min, max]. It is
          also how presence is expressed for a slice, which [Required] cannot cover
          because a slice is not comparable: Count(1, Unbounded).

          max may be [Unbounded]. The bound rules are those of [Length].
        in:
          - name: minLen
          - name: maxLen
            type: int
        name: Count
        out:
          - name: constraint
            type: corevalidation.Constraint[[]E]
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: E
      - doc: |-
          Struct compiles the `validate` struct tags of T into a Constraint. The plan
          is compiled once per (type, mode) and cached, so calling Struct again for
          the same T is one map read — which is what makes it usable inside a
          core/app/config.Validator's Validate method:

          	func (c Conf) Validate() error {
          	    rules, err := validation.Struct[Conf](validation.StructConfig{})
          	    if err != nil {
          	        return err
          	    }
          	    return validation.Check(c, rules)
          	}

          The result IS a Constraint, so tags and hand-written rules compose into one
          report: All(tagRules, crossFieldRule).

          # A type with no validate tag is legitimate

          It compiles to an empty plan and accepts everything. "No rules" is a rule
          set, and refusing it would make it impossible to add validation to a type
          incrementally. What is refused is a tag that cannot be honoured — and it is
          refused HERE, at compile time, never at the first request (ADR 0031).

          # The dialect is a strict subset of the programmatic API, on purpose

          Accepted: required, min, max (numbers), minlen, maxlen (string runes),
          mincount, maxcount (slice/array elements), oneof=a|b|c, dive.

          Refused BY NAME, each with a message that says what to do instead: pattern
          and regex (a regular expression cannot live in a comma-separated tag without
          inventing an escape dialect, and a SILENTLY TRUNCATED pattern is the exact
          class of failure this SDK refuses — compose Matches in code); email, url and
          uuid (see ADR 0046 §What is refused); dive on a map; any unknown rule.
        in:
          - name: cfg
            type: StructConfig
        name: Struct
        out:
          - name: constraint
            type: corevalidation.Constraint[T]
          - name: err
            type: error
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          All runs every constraint and returns everything they found, in composition
          order. It is the default shape of the engine: a caller who wanted one answer
          can take the first violation, but a caller who needed all of them cannot
          recover the ones a short-circuit never computed.

          All with no constraint is legitimate and accepts everything — a validator
          without rules is not a broken validator (ADR 0031). What is refused is a
          constraint that could never be satisfied, and that is refused by its own
          constructor, before it can be composed.
        in:
          - name: constraints
            type: corevalidation.Constraint[T]
        name: All
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - doc: |-
          First runs the constraints in order and stops at the one that refuses,
          returning only its violations. It is a REAL short-circuit — the constraints
          after the first failure are never evaluated — so it is honest to reach for
          when a later check is expensive or would be meaningless.

          It is deliberately a combinator rather than a mode flag on a runner. A flag
          that truncated the report after the fact would claim a saving it did not
          make; a combinator that stops really stops, and the caller can see where.
        in:
          - name: constraints
            type: corevalidation.Constraint[T]
        name: First
        out:
          - type: corevalidation.Constraint[T]
        typeParams:
          - constraint: any
            name: T
        variadic: true
      - doc: |-
          Check runs constraints against value at the root path and converts the
          result to the SDK error model. It is the one-line bridge to an error-typed
          contract — principally core/app/config.Validator's Validate() error, which is
          how a decoded config struct self-checks after config.Load.

          It returns a genuine nil interface when nothing was found wrong.
        in:
          - name: value
            type: T
          - name: constraints
            type: corevalidation.Constraint[T]
        name: Check
        out:
          - type: error
        typeParams:
          - constraint: any
            name: T
        variadic: true
    imports:
      corevalidation: github.com/kitsunium/sdk/internal/core/app/validation
    path: github.com/kitsunium/sdk/internal/service/app/validation
    types:
      - doc: StructConfig tunes a compiled struct validator.
        name: StructConfig
        struct:
          fields:
            - doc: |-
                StopAtFirst compiles a plan that stops at the first violation instead of
                collecting every one. The zero value collects everything, because a form
                that reports one error at a time makes the user submit it five times.

                It is compiled INTO the plan, nested plans included, so a stop-at-first
                validator really does stop: the later fields are never read and the
                later rules never run. It is not a filter applied to a full report.
              name: StopAtFirst
              type: bool
  - doc: |-
      Package validation is the public facade for the SDK's value-checking
      domain: a small set of constraints, the combinators that compose them, and a
      struct-tag front end — all producing one [Report] that says WHERE each
      failure is and WHY.

      	type Address struct {
      	    Zip string `json:"zip" validate:"required,minlen=4,maxlen=10"`
      	}
      	type User struct {
      	    Name      string    `json:"name"      validate:"required,maxlen=64"`
      	    Age       int       `json:"age"       validate:"min=0,max=130"`
      	    Addresses []Address `json:"addresses" validate:"mincount=1,dive"`
      	}

      	rules, err := validation.Struct[User](validation.StructConfig{})
      	if err != nil {
      	    return err // a tag that cannot be honoured is refused HERE, not at the first request
      	}
      	report := rules(validation.RootPath, user)
      	for _, v := range report {
      	    log.Warn("invalid", "path", v.Path, "rule", v.Rule, "why", v.Message)
      	}
      	// path == "addresses[2].zip"

      # A violation says where

      Every [Violation] carries a Violation.Path in one grammar: members joined
      by ".", elements by "[n]" — "user.addresses[2].zip". [RootPath] (the empty
      string) is the value as a whole, which is what a cross-field rule reports.
      Build child paths with [JoinField] and [JoinIndex]; never concatenate by
      hand, or the grammar stops being one.

      Member names come from the json tag when the field has one, else the Go
      field name. That is not a preference: the SDK's own config.Load decodes
      every format — TOML, YAML, env, JSON — through a JSON round trip, so the
      json name is literally the key the operator wrote. For the same reason an
      embedded struct with no json name adds no segment of its own: encoding/json
      promotes its fields into the enclosing object, so an untagged Common
      embedding reports "zip", not "Common.zip". And a rule on a field
      encoding/json never decodes a key into — hidden by a shallower field of the
      same name, or tied with another at its depth, which JSON resolves to
      neither — is refused when the type compiles, since no input could ever set
      the value it judges.

      # Everything, not the first thing

      The default collects EVERY violation, in a stable order. A form that reports
      one error at a time makes the user submit it five times. [First] opts into
      stopping, and StructConfig.StopAtFirst does the same for a tag validator —
      both really stop, rather than filtering a full report afterwards.

      # A violation is not an error, and a report is not an error either

      A [Violation] is a value: a validation normally produces several, and
      errors.Join of five would render five bracket headers and bury the paths.
      A [Report] is a slice of them — its zero value, nil, is a PASSING report.
      It does not implement error, because a value type that implements error and
      is returned by value makes `if err != nil` true for a passing validation.
      Report.Err converts on demand and returns a genuine nil interface when
      there is nothing wrong; that error carries the count and the paths, never
      the messages and never the values. The full report is the report.

      # A message never contains the value

      This is a security property, not a style rule. A validation message is the
      one error message in a service designed to reach the end user, so a message
      that echoed the value would exfiltrate whatever was validated — a password,
      a token, a card number. Every built-in message names the rule and the bound.

      # Feeding config.Validator

      This package is the engine; config.Validator is the contract a decoded
      config struct implements to self-check after config.Load. They compose:

      	func (c Conf) Validate() error {
      	    rules, err := validation.Struct[Conf](validation.StructConfig{})
      	    if err != nil {
      	        return err
      	    }
      	    return validation.Check(c, rules)
      	}

      # No constraint is legitimate; a broken constraint is not

      A validator with no rules passes, and a type with no validate tag compiles
      to an empty plan that accepts everything — adding validation to a type has
      to be possible one field at a time. What is refused is a constraint that
      could never be honoured: an inverted interval ([Between]), an empty allowed
      set ([OneOf]), an uncompilable pattern ([Matches]), a tag rule the field's
      kind cannot answer. All of them are refused at CONSTRUCTION (ADR 0031).
    facade:
      - const:
          - doc: |-
              RootPath is the path of the value handed to a validator, before any
              descent. A violation reported there is about the value as a whole.
            name: RootPath
            reexport: corevalidation.RootPath
            type: string
            typed: true
            value: "\"\""
          - doc: Unbounded is the [Length] / [Count] upper bound that means "no ceiling".
            name: Unbounded
            reexport: svcvalidation.Unbounded
            type: int
            typed: true
            value: "-1"
          - doc: CodeRequired identifies an absent value.
            name: CodeRequired
            reexport: corevalidation.CodeRequired
            type: errs.Code
            typed: true
            value: "0x00_03_2F_01"
          - doc: CodeOutOfRange identifies an ordered value outside its bounds.
            name: CodeOutOfRange
            reexport: corevalidation.CodeOutOfRange
            type: errs.Code
            typed: true
            value: "0x00_03_2F_02"
          - doc: CodeLengthOutOfRange identifies a size outside its bounds.
            name: CodeLengthOutOfRange
            reexport: corevalidation.CodeLengthOutOfRange
            type: errs.Code
            typed: true
            value: "0x00_03_2F_03"
          - doc: CodeNotInSet identifies a value outside its allowed set.
            name: CodeNotInSet
            reexport: corevalidation.CodeNotInSet
            type: errs.Code
            typed: true
            value: "0x00_03_2F_04"
          - doc: CodePatternMismatch identifies a string that did not match its pattern.
            name: CodePatternMismatch
            reexport: corevalidation.CodePatternMismatch
            type: errs.Code
            typed: true
            value: "0x00_03_2F_05"
      - var:
          - doc: |-
              Failed is the error a non-empty Report converts to. Its HTTP status is
              422: the request was syntactically fine and semantically wrong, which is
              what a failed validation is — not a 500.
            name: Failed
            reexport: corevalidation.ValidationFailed
            type: "*errs.Error"
          - doc: |-
              Misconfigured is returned by a constraint CONSTRUCTOR whose arguments it
              cannot honour — an inverted interval, an empty set, a bad pattern.
            name: Misconfigured
            reexport: corevalidation.ConstraintMisconfigured
            type: "*errs.Error"
          - doc: InvalidRule is returned by Struct when a validate tag cannot be compiled.
            name: InvalidRule
            reexport: corevalidation.InvalidRule
            type: "*errs.Error"
          - doc: UnsupportedTarget is returned by Struct when T is not a struct type.
            name: UnsupportedTarget
            reexport: corevalidation.UnsupportedTarget
            type: "*errs.Error"
      - alias:
          - doc: |-
              Constraint is the public alias for the value-checking port. It is a FUNC
              type, so it cannot grow a method and break a downstream implementer
              (ADR 0039).
            name: Constraint
            target: corevalidation.Constraint[T]
            typeParams:
              - constraint: any
                name: T
      - alias:
          - doc: Violation is the public alias for one located failure.
            name: Violation
            target: corevalidation.ViolationValue
      - alias:
          - doc: |-
              Report is the public alias for everything one validation found wrong. Its
              zero value — nil — is a passing report.
            name: Report
            target: corevalidation.ReportValue
      - alias:
          - doc: StructConfig is the public alias for a compiled struct validator's options.
            name: StructConfig
            target: svcvalidation.StructConfig
      - func:
          doc: |-
            JoinField extends a path with a member name — JoinField("user", "zip") is
            "user.zip". The grammar does not quote, so a member name that itself
            contains '.', '[' or ']' yields a path indistinguishable from a nested or
            indexed one.
          forward: corevalidation.JoinField
          in:
            - name: base
            - name: name
              type: string
          name: JoinField
          out:
            - type: string
      - func:
          doc: |-
            JoinIndex extends a path with an element position — JoinIndex("a", 2) is
            "a[2]".
          forward: corevalidation.JoinIndex
          in:
            - name: base
              type: string
            - name: index
              type: int
          name: JoinIndex
          out:
            - type: string
      - func:
          doc: |-
            All runs every constraint and reports everything they found. It is the
            default shape of the engine; All with no constraint accepts everything.
          forward: svcvalidation.All
          in:
            - name: constraints
              type: Constraint[T]
          name: All
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            First runs the constraints in order and stops at the one that refuses. It is
            a real short-circuit, not a filtered report.
          forward: svcvalidation.First
          in:
            - name: constraints
              type: Constraint[T]
          name: First
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            Check runs constraints against value at the root path and converts the
            result to the SDK error model — the one-line bridge to config.Validator.
          forward: svcvalidation.Check
          in:
            - name: value
              type: T
            - name: constraints
              type: Constraint[T]
          name: Check
          out:
            - type: error
          typeParams:
            - constraint: any
              name: T
          variadic: true
      - func:
          doc: |-
            Must returns constraint, panicking when err is non-nil. It is the
            regexp.MustCompile idiom, for a package-level validator built from literals
            at init. Do NOT use it on a bound that comes from configuration.
          forward: svcvalidation.Must
          in:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          name: Must
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: any
              name: T
      - func:
          doc: |-
            Field applies constraints to a member of T reached through get, locating
            every violation at the parent path extended by name. It uses no reflection.
          forward: svcvalidation.Field
          in:
            - name: name
              type: string
            - name: get
              type: func(T) F
            - name: constraints
              type: Constraint[F]
          name: Field
          out:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          typeParams:
            - name: T
            - constraint: any
              name: F
          variadic: true
      - func:
          doc: |-
            Each applies constraints to every element of a slice member of T reached
            through get, locating each element's violations at "name[i]".
          forward: svcvalidation.Each
          in:
            - name: name
              type: string
            - name: get
              type: func(T) []E
            - name: constraints
              type: Constraint[E]
          name: Each
          out:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          typeParams:
            - name: T
            - constraint: any
              name: E
          variadic: true
      - func:
          doc: |-
            Required refuses the zero value of T. It cannot distinguish "not supplied"
            from "supplied as zero" — declare the field as a pointer when that matters.
          forward: svcvalidation.Required[T]
          name: Required
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: comparable
              name: T
      - func:
          doc: |-
            AtLeast refuses a value below lo; the bound is inclusive. It is the
            programmatic spelling of the `min=` struct tag, and both report the rule
            "min".
          forward: svcvalidation.AtLeast
          in:
            - name: lo
              type: T
          name: AtLeast
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: cmp.Ordered
              name: T
      - func:
          doc: |-
            AtMost refuses a value above hi; the bound is inclusive. It is the
            programmatic spelling of the `max=` struct tag.
          forward: svcvalidation.AtMost
          in:
            - name: hi
              type: T
          name: AtMost
          out:
            - type: Constraint[T]
          typeParams:
            - constraint: cmp.Ordered
              name: T
      - func:
          doc: |-
            Between refuses a value outside [lo, hi]. lo > hi is refused at
            construction: an inverted interval is satisfied by nothing.
          forward: svcvalidation.Between
          in:
            - name: lo
            - name: hi
              type: T
          name: Between
          out:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          typeParams:
            - constraint: cmp.Ordered
              name: T
      - func:
          doc: |-
            Length refuses a string whose RUNE count falls outside [min, max]. max may
            be [Unbounded]. It counts runes, not grapheme clusters.
          forward: svcvalidation.Length
          in:
            - name: minRunes
            - name: maxRunes
              type: int
          name: Length
          out:
            - name: constraint
              type: Constraint[string]
            - name: err
              type: error
      - func:
          doc: |-
            Count refuses a slice whose element count falls outside [min, max]. max may
            be [Unbounded]. Count(1, Unbounded) is how presence is expressed for a slice.
          forward: svcvalidation.Count[E]
          in:
            - name: minLen
            - name: maxLen
              type: int
          name: Count
          out:
            - name: constraint
              type: Constraint[[]E]
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: E
      - func:
          doc: |-
            OneOf refuses a value absent from allowed. An empty allowed set is refused
            at construction: it is a forgotten argument, not a permissive rule.
          forward: svcvalidation.OneOf
          in:
            - name: allowed
              type: T
          name: OneOf
          out:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          typeParams:
            - constraint: comparable
              name: T
          variadic: true
      - func:
          doc: |-
            Matches refuses a string the pattern does not match. The pattern is compiled
            at construction, and Go's RE2 has no backtracking — a pattern cannot be
            turned into a denial of service by the value it is shown.
          forward: svcvalidation.Matches
          in:
            - name: pattern
              type: string
          name: Matches
          out:
            - name: constraint
              type: Constraint[string]
            - name: err
              type: error
      - func:
          doc: |-
            Struct compiles the `validate` tags of T into a Constraint, caching the plan
            per (type, mode).

            Accepted: required, min, max, minlen, maxlen, mincount, maxcount,
            oneof=a|b|c, dive. Refused BY NAME, each saying what to do instead: pattern
            / regex (a regexp cannot live in a comma-separated tag), email, url, uuid,
            dive into a map, and any unknown rule.
          forward: svcvalidation.Struct[T]
          in:
            - name: cfg
              type: StructConfig
          name: Struct
          out:
            - name: constraint
              type: Constraint[T]
            - name: err
              type: error
          typeParams:
            - constraint: any
              name: T
    imports:
      corevalidation: github.com/kitsunium/sdk/internal/core/app/validation
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcvalidation: github.com/kitsunium/sdk/internal/service/app/validation
    path: github.com/kitsunium/sdk/pkg/v1/app/validation
