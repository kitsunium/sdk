apiVersion: kit.kitsunium/design/v2
domain: app/consensus
packages:
  - codes:
      - const:
          - doc: |-
              CodeConsensusMisconfigured identifies a node refused at construction: a bound
              missing or out of range, a timing rule broken, a lease without a drift.
            name: CodeConsensusMisconfigured
            value: "0x00_02_39_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotLeader identifies a proposal that was certainly NOT appended, because
              this node is not the leader and could not forward it.
            name: CodeNotLeader
            value: "0x00_02_39_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeOutcomeUnknown identifies a proposal that was appended, or possibly
              delivered, and whose answer was lost. It may still commit.
            name: CodeOutcomeUnknown
            value: "0x00_02_39_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLeadershipUnconfirmed identifies a barrier whose confirmation round did
              not reach a majority in time.
            name: CodeLeadershipUnconfirmed
            value: "0x00_02_39_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeMembershipChangePending identifies a second membership change proposed
              while one is still uncommitted.
            name: CodeMembershipChangePending
            value: "0x00_02_39_05"
        type: errs.Code
      - const:
          - doc: CodeMembershipInvalid identifies a membership change refused on its merits.
            name: CodeMembershipInvalid
            value: "0x00_02_39_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeTransferFailed identifies a leadership transfer whose target did not win
              within one election timeout.
            name: CodeTransferFailed
            value: "0x00_02_39_07"
        type: errs.Code
      - const:
          - doc: CodeEntryTooLarge identifies a command above MaxEntryBytes.
            name: CodeEntryTooLarge
            value: "0x00_02_39_08"
        type: errs.Code
      - const:
          - doc: CodeCompacted identifies an index below the first retained one.
            name: CodeCompacted
            value: "0x00_02_39_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeStateMachineFailed identifies a node whose Apply panicked or could not
              complete. The entry IS committed.
            name: CodeStateMachineFailed
            value: "0x00_02_39_0A"
        type: errs.Code
      - const:
          - doc: CodeNodeStopped identifies a call on a node that was closed or stopped itself.
            name: CodeNodeStopped
            value: "0x00_02_39_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntrySuperseded identifies a proposal whose position holds a COMMITTED
              entry of another term: certainly not committed.
            name: CodeEntrySuperseded
            value: "0x00_02_39_0C"
        type: errs.Code
      - const:
          - doc: CodeOverloaded identifies a proposal refused before append.
            name: CodeOverloaded
            value: "0x00_02_39_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeVersionUnsupported identifies an entry kind, record, frame or snapshot
              version this node does not know.
            name: CodeVersionUnsupported
            value: "0x00_02_39_0F"
        type: errs.Code
      - const:
          - doc: CodeNodeIDRetired identifies a removed NodeID offered again.
            name: CodeNodeIDRetired
            value: "0x00_02_39_10"
        type: errs.Code
      - const:
          - doc: CodeNoSpace identifies a write refused while the no-space alarm is raised.
            name: CodeNoSpace
            value: "0x00_02_39_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeResultTypeMismatch identifies an Apply result of another type than the
              one ProposeAs asked for. The entry IS committed.
            name: CodeResultTypeMismatch
            value: "0x00_02_39_12"
        type: errs.Code
      - const:
          - doc: |-
              CodePayloadVersionRefused identifies a proposal whose payload version is
              above what some member announced.
            name: CodePayloadVersionRefused
            value: "0x00_02_39_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeLineageMismatch identifies a position, outbox identity or fence from
              another LogIdentity lineage.
            name: CodeLineageMismatch
            value: "0x00_02_39_14"
        type: errs.Code
      - const:
          - doc: |-
              CodeAdminPreconditionFailed identifies an administrative operation that
              named an alarm, version or contract that is not the current one.
            name: CodeAdminPreconditionFailed
            value: "0x00_02_39_19"
        type: errs.Code
      - const:
          - doc: CodeLogCorrupt identifies damage to the log that is not a torn tail.
            name: CodeLogCorrupt
            value: "0x00_03_5C_01"
        type: errs.Code
      - const:
          - doc: CodeHardStateCorrupt identifies an unreadable hard-state record.
            name: CodeHardStateCorrupt
            value: "0x00_03_5C_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeSnapshotCorrupt identifies a snapshot whose digest or size does not match
              its metadata.
            name: CodeSnapshotCorrupt
            value: "0x00_03_5C_03"
        type: errs.Code
      - const:
          - doc: CodeStorageFailed identifies a failed write, sync or read.
            name: CodeStorageFailed
            value: "0x00_03_5C_04"
        type: errs.Code
      - const:
          - doc: CodeDataDirLocked identifies a data directory another process holds.
            name: CodeDataDirLocked
            value: "0x00_03_5C_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeDataDirMismatch identifies a stamp naming another cluster, node or
              incarnation.
            name: CodeDataDirMismatch
            value: "0x00_03_5C_06"
        type: errs.Code
      - const:
          - doc: CodePeerRejected identifies a peer whose certificate or key is not admitted.
            name: CodePeerRejected
            value: "0x00_03_5C_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeClusterMismatch identifies a peer's first frame naming another cluster
              or group.
            name: CodeClusterMismatch
            value: "0x00_03_5C_08"
        type: errs.Code
      - const:
          - doc: CodeFrameInvalid identifies a frame that does not parse or is too large.
            name: CodeFrameInvalid
            value: "0x00_03_5C_09"
        type: errs.Code
      - const:
          - doc: CodeSnapshotTooLarge identifies an announced snapshot above MaxSnapshotBytes.
            name: CodeSnapshotTooLarge
            value: "0x00_03_5C_0A"
        type: errs.Code
      - const:
          - doc: CodeBootstrapRefused identifies a bootstrap against a conflicting history.
            name: CodeBootstrapRefused
            value: "0x00_03_5C_0B"
        type: errs.Code
      - const:
          - doc: CodeTransportMisconfigured identifies a transport refused at construction.
            name: CodeTransportMisconfigured
            value: "0x00_03_5C_0C"
        type: errs.Code
      - const:
          - doc: CodeRecoverRefused identifies a Recover whose preconditions do not hold.
            name: CodeRecoverRefused
            value: "0x00_03_5C_0D"
        type: errs.Code
      - const:
          - doc: CodeLogQuarantined identifies a data directory carrying a quarantine marker.
            name: CodeLogQuarantined
            value: "0x00_03_5C_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeRestoreRefused identifies a RestoreSnapshot whose preconditions do not
              hold.
            name: CodeRestoreRefused
            value: "0x00_03_5C_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeDataDirInUse identifies an offline operation on a directory a live node
              holds.
            name: CodeDataDirInUse
            value: "0x00_03_5C_10"
        type: errs.Code
      - const:
          - doc: CodeJoinRefused identifies a pre-admission JOIN that was refused.
            name: CodeJoinRefused
            value: "0x00_03_5C_11"
        type: errs.Code
      - const:
          - doc: CodeStopMarkerPresent identifies a node refused at start by a stop marker.
            name: CodeStopMarkerPresent
            value: "0x00_03_5C_12"
        type: errs.Code
    constants:
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryCommand is a caller's command, handed to StateMachine.Apply.
        name: EntryCommand
        type: EntryKind
        value: "1"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: |-
          EntryNoOp is the empty entry a new leader commits in its term before it
          serves a read or accepts a membership change.
        name: EntryNoOp
        type: EntryKind
        value: "2"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: |-
          EntryMembership carries a whole new Membership and the change that
          produced it. It takes effect when APPENDED.
        name: EntryMembership
        type: EntryKind
        value: "3"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryTimingContract carries a new committed timing contract.
        name: EntryTimingContract
        type: EntryKind
        value: "4"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryClusterVersion raises the protocol version every member must speak.
        name: EntryClusterVersion
        type: EntryKind
        value: "5"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryNoSpaceRaise raises the replicated no-space alarm.
        name: EntryNoSpaceRaise
        type: EntryKind
        value: "6"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryNoSpaceClear clears the no-space alarm it names.
        name: EntryNoSpaceClear
        type: EntryKind
        value: "7"
      - blockDoc: |-
          The entry kinds of protocol version 1. The range 0x80-0x8F is reserved for
          ADR 0173 and refused until the cluster version enables it.
        doc: EntryTransfer records a leadership transfer and its operator.
        name: EntryTransfer
        type: EntryKind
        value: "8"
      - blockDoc: The message kinds of protocol version 1.
        doc: |-
          MsgPreVote asks whether the sender COULD win at Term, without raising
          anybody's term.
        name: MsgPreVote
        type: MessageKind
        value: "0x01"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgPreVoteResp answers a MsgPreVote.
        name: MsgPreVoteResp
        type: MessageKind
        value: "0x02"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgVote asks for a vote at Term.
        name: MsgVote
        type: MessageKind
        value: "0x03"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgVoteResp answers a MsgVote.
        name: MsgVoteResp
        type: MessageKind
        value: "0x04"
      - blockDoc: The message kinds of protocol version 1.
        doc: |-
          MsgHeartbeat confirms the leader and carries a commit index clamped to
          the follower's match.
        name: MsgHeartbeat
        type: MessageKind
        value: "0x05"
      - blockDoc: The message kinds of protocol version 1.
        doc: |-
          MsgHeartbeatResp answers a heartbeat and carries the applied contract
          generation.
        name: MsgHeartbeatResp
        type: MessageKind
        value: "0x06"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgTimeoutNow tells the transfer target to campaign at once.
        name: MsgTimeoutNow
        type: MessageKind
        value: "0x07"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgReadIndex asks the leader for a confirmed read index.
        name: MsgReadIndex
        type: MessageKind
        value: "0x08"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgReadIndexResp answers a MsgReadIndex.
        name: MsgReadIndexResp
        type: MessageKind
        value: "0x09"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgForwardAdmin forwards an administrative operation to the leader.
        name: MsgForwardAdmin
        type: MessageKind
        value: "0x0A"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgForwardAdminResp answers a MsgForwardAdmin.
        name: MsgForwardAdminResp
        type: MessageKind
        value: "0x0B"
      - blockDoc: The message kinds of protocol version 1.
        doc: |-
          MsgLeaderRecord, of protocol version 2, tells a member that campaigns
          behind the sender's commit the member record of the leader the sender
          follows, read from the sender's committed configuration: a voter that
          was down while that leader was admitted pins it provisionally, for
          replication only, and learns its configuration from it (ADR 0152 D4,
          #542). Its one entry's data is that record, as AppendMembership
          encodes a configuration of one member.
        name: MsgLeaderRecord
        type: MessageKind
        value: "0x0C"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgApp appends entries after (LogTerm, Index).
        name: MsgApp
        type: MessageKind
        value: "0x41"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgAppResp acknowledges, or refuses, a MsgApp.
        name: MsgAppResp
        type: MessageKind
        value: "0x42"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgForward forwards a proposal to the leader under a submission id.
        name: MsgForward
        type: MessageKind
        value: "0x43"
      - blockDoc: The message kinds of protocol version 1.
        doc: MsgForwardResp answers a MsgForward with the position it appended at.
        name: MsgForwardResp
        type: MessageKind
        value: "0x44"
      - blockDoc: The flags.
        doc: |-
          FlagTransfer marks a vote request of a leadership transfer. It lifts the
          live-leader refusal for ONE campaign, never the election restriction.
        name: FlagTransfer
        type: MessageFlags
        value: "1"
      - blockDoc: The flags.
        doc: |-
          FlagNeedSnapshot marks an append rejection from a node that holds no
          usable snapshot and asks for one.
        name: FlagNeedSnapshot
        type: MessageFlags
        value: "2"
      - blockDoc: The flags.
        doc: |-
          FlagNoLease marks a read the follower wants confirmed by a round, never
          by a lease.
        name: FlagNoLease
        type: MessageFlags
        value: "4"
      - blockDoc: The flags.
        doc: |-
          FlagTruncated marks an append rejection from a node that truncated
          acknowledged entries through TruncateAndStaySilent: the leader lowers
          its match to the node's log, the one exception to "match only grows".
        name: FlagTruncated
        type: MessageFlags
        value: "8"
      - blockDoc: The flags.
        doc: |-
          FlagProtocol2 marks a frame from a node that speaks protocol version
          2. It is the announcement D18 asks for: a node of protocol 1 tests
          the bits it names only and ignores it, and a leader refuses to raise
          the cluster version to 2 while a member's last frame of the term
          lacks it.
        name: FlagProtocol2
        type: MessageFlags
        value: "16"
      - blockDoc: The flags.
        doc: |-
          FlagProtocol3 marks a frame from a node that speaks protocol version
          3, which sets FlagProtocol2 beside it. A node of protocol 2 or below
          tests the bits it names only and ignores it, and a leader refuses to
          raise the cluster version to 3 while a member's last frame of the term
          lacks it.
        name: FlagProtocol3
        type: MessageFlags
        value: "32"
      - blockDoc: The states of a stamp.
        doc: |-
          StampJoining is a directory Init prepared: it may join as an empty
          learner, never vote or acknowledge until it is admitted.
        name: StampJoining
        type: StampState
        value: "1"
      - blockDoc: The states of a stamp.
        doc: |-
          StampBootstrapPending is a founding in progress: Bootstrap wrote it
          before it wrote the founding configuration.
        name: StampBootstrapPending
        type: StampState
        value: "2"
      - blockDoc: The states of a stamp.
        doc: StampMember is a directory that belongs to a cluster.
        name: StampMember
        type: StampState
        value: "3"
      - blockDoc: The roles.
        doc: RoleFollower follows a leader, or waits for one.
        name: RoleFollower
        type: Role
        value: "1"
      - blockDoc: The roles.
        doc: RolePreCandidate asks whether it COULD win, without raising its term.
        name: RolePreCandidate
        type: Role
        value: "2"
      - blockDoc: The roles.
        doc: RoleCandidate campaigns at a raised term.
        name: RoleCandidate
        type: Role
        value: "3"
      - blockDoc: The roles.
        doc: RoleLeader leads its term.
        name: RoleLeader
        type: Role
        value: "4"
      - blockDoc: The roles.
        doc: RoleLearner receives the log and votes when asked, but never campaigns.
        name: RoleLearner
        type: Role
        value: "5"
      - blockDoc: The lanes.
        doc: LaneControl carries votes, heartbeats, their replies and TimeoutNow.
        name: LaneControl
        type: FrameLane
        value: "0"
      - blockDoc: The lanes.
        doc: LaneData carries entries, their acknowledgements and forwarded proposals.
        name: LaneData
        type: FrameLane
        value: "1"
      - blockDoc: The lanes.
        doc: LaneSnapshot carries snapshot streams.
        name: LaneSnapshot
        type: FrameLane
        value: "2"
    doc: |-
      Package consensus — ranges 0.2.57.* (ADR 0152, the domain's outcomes) and
      0.3.92.* (ADR 0152, the shipped storage and transport's outcomes, declared
      here since ADR 0160).

      Package consensus declares the SDK's consensus DOMAIN: agreement of several
      machines on the order of their writes. It holds every value a port speaks —
      node and cluster identities, positions, entries, messages, snapshots,
      membership — and the frozen ports themselves: [Replicated], the consumer's
      algorithm-neutral port, [StateMachine] and its siblings, and the storage and
      transport ports [LogStore], [SnapshotStore] and [Transport], which speak
      Raft's terms (ADR 0152 D1).

      # A write is committed when a majority holds it on disk

      An entry is committed once a majority of the voters have made it durable.
      Every port in this package exists to keep that sentence true across crashes,
      partitions, restarts, recoveries and upgrades: [LogStore.Sync] and
      [LogStore.WriteStamp] carry the safety of the whole domain, and a failed
      sync stops the node rather than being retried.

      # This is not ADR 0120's state machine

      [StateMachine] is HOW a deterministic program is replicated: a pure
      transition applied in log order on every node. The statemachine domain
      decides WHAT state an entity is in and moves it on a timer. The two share a
      textbook name and nothing else.

      The engine, its storage and its transport live in
      internal/service/app/consensus; the facade is pkg/v1/app/consensus.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/consensus
    ports:
      - doc: |-
          Replicated is the consumer's port, and the only algorithm-neutral one:
          propose a command, wait for a linearizable read point, wait for a position,
          read the node's status. FROZEN under ADR 0039.
        methods:
          - doc: |-
              Propose replicates data and returns, once the entry is applied
              locally, its lineage-scoped token and the value Apply returned.
              NOT_LEADER means certainly not appended; OUTCOME_UNKNOWN means it may
              still commit, and the caller must read the state before deciding.
            in:
              - name: ctx
                type: context.Context
              - name: data
                type: "[]byte"
            name: Propose
            out:
              - type: TokenValue
              - type: any
              - type: error
          - doc: |-
              Barrier returns once the local state machine reflects every write
              committed before the call, with the token of the applied index.
            in:
              - name: ctx
                type: context.Context
            name: Barrier
            out:
              - type: TokenValue
              - type: error
          - doc: |-
              WaitApplied returns once the local node has applied t, the entry of
              t's term at t's index. A token of another lineage is
              LINEAGE_MISMATCH. A token whose index holds an entry of another term
              is ENTRY_SUPERSEDED, or LINEAGE_MISMATCH when it is one of the
              predecessor's within the index Recover kept, as is a token of the
              predecessor's whose term the node can no longer read there.
            in:
              - name: ctx
                type: context.Context
              - name: t
                type: TokenValue
            name: WaitApplied
            out:
              - type: error
          - doc: Status returns the node's view after its last turn.
            name: Status
            out:
              - type: StatusValue
        name: Replicated
      - doc: |-
          StateMachine is the caller's replicated program. Apply is a PURE transition
          of state the state machine owns: no side effect outside that state, no
          precondition that can differ between nodes. It is called for every committed
          command, in log order, on one goroutine, and must be deterministic. A
          refusal is an answer carried in the result; an Apply that cannot complete
          must panic, and the node stops with STATE_MACHINE_FAILED — the entry IS
          committed. FROZEN under ADR 0039.
        methods:
          - doc: |-
              Apply applies one committed command and returns its result, delivered
              to the Propose that created it on the node that created it.
            in:
              - name: e
                type: EntryValue
            name: Apply
            out:
              - type: any
          - doc: |-
              Snapshot captures a point-in-time view of the state, cheaply: it is
              called on the apply goroutine.
            name: Snapshot
            out:
              - type: Snapshot
              - type: error
          - doc: |-
              Restore replaces the state with a snapshot's. It is serialised with
              Apply. An error coded VERSION_UNSUPPORTED says the snapshot is of a
              format this build does not read: the node stops, as for an entry
              kind it does not know, and a restart over that snapshot is refused
              (D18). Any other error refuses that one install, and the leader
              offers a snapshot again.
            in:
              - name: r
                type: io.Reader
              - name: meta
                type: SnapshotMetaValue
            name: Restore
            out:
              - type: error
        name: StateMachine
      - doc: |-
          Snapshot is a point-in-time view a StateMachine captured. WriteTo runs on
          the snapshot goroutine while Apply continues; Release frees the view.
        methods:
          - doc: WriteTo writes the view's state.
            in:
              - name: w
                type: io.Writer
            name: WriteTo
            out:
              - type: int64
              - type: error
          - doc: Release frees the view.
            name: Release
        name: Snapshot
      - doc: |-
          DurableStateMachine is the sibling of a state machine that keeps its state
          on disk: it persists the applied position atomically with the state that
          entry produced, and the engine resumes after it.
        embeds:
          - StateMachine
        methods:
          - doc: |-
              AppliedPosition returns the log identity and the position of the last
              entry whose effects are durable.
            name: AppliedPosition
            out:
              - type: LogIdentityValue
              - type: PositionValue
              - type: error
        name: DurableStateMachine
      - doc: |-
          BatchingStateMachine is the sibling of a state machine that applies
          committed commands in batches, one result slot per entry.
        embeds:
          - StateMachine
        methods:
          - doc: ApplyBatch applies es in order and writes each result into results.
            in:
              - name: es
                type: "[]EntryValue"
              - name: results
                type: "[]any"
            name: ApplyBatch
        name: BatchingStateMachine
      - doc: |-
          LogReader reads the log. Expected outcomes are answers, not failures: an
          index below the first retained one is COMPACTED.
        methods:
          - doc: |-
              Entries returns entries in [lo, hi), at most maxBytes, and always at
              least one entry when lo < hi, even above maxBytes. lo below first is
              COMPACTED.
            in:
              - name: lo
              - name: hi
                type: uint64
              - name: maxBytes
                type: int
              - name: dst
                type: "[]EntryValue"
            name: Entries
            out:
              - type: "[]EntryValue"
              - type: error
          - doc: Term answers for first-1 too, from the term kept at compaction.
            in:
              - name: index
                type: uint64
            name: Term
            out:
              - type: uint64
              - type: error
          - doc: Bounds of an empty log after a snapshot at s are (s+1, s).
            name: Bounds
            out:
              - name: first
              - name: last
                type: uint64
        name: LogReader
      - doc: |-
          LogStore is the durable log. Term, vote and entries travel in one Append
          and become durable under one Sync; readers see appended entries before they
          are synced. One writer, many readers. When Sync and WriteStamp return nil,
          what they cover survives a power loss: the safety of the whole domain rests
          on it. FROZEN under ADR 0039.
        embeds:
          - LogReader
        methods:
          - doc: |-
              Append buffers entries and, when hs is not nil, a hard state, in ONE
              record batch.
            in:
              - name: entries
                type: "[]EntryValue"
              - name: hs
                type: "*HardState"
            name: Append
            out:
              - type: error
          - doc: Sync makes everything appended so far durable.
            name: Sync
            out:
              - type: error
          - doc: |-
              TruncateSuffix writes ONE durable truncate record removing every entry
              from index from on, and nothing else.
            in:
              - name: from
                type: uint64
            name: TruncateSuffix
            out:
              - type: error
          - doc: CompactPrefix drops what a snapshot covers, through index through.
            in:
              - name: through
                type: uint64
            name: CompactPrefix
            out:
              - type: error
          - doc: HardState returns the last hard state appended.
            name: HardState
            out:
              - type: HardState
              - type: error
          - doc: Stamp returns the directory's stamp.
            name: Stamp
            out:
              - type: StampValue
              - type: error
          - doc: WriteStamp writes the stamp, durable on return.
            in:
              - type: StampValue
            name: WriteStamp
            out:
              - type: error
          - doc: Close releases the store.
            name: Close
            out:
              - type: error
        name: LogStore
      - doc: |-
          SnapshotSink receives the ENCODED chunks of one snapshot and checks each
          chunk's integrity as it arrives.
        embeds:
          - io.Writer
        methods:
          - doc: |-
              Commit publishes the snapshot; final carries the SHA-256 the engine
              computed over the DECODED stream.
            in:
              - name: final
                type: SnapshotMetaValue
            name: Commit
            out:
              - type: error
          - doc: Abort drops the spool.
            name: Abort
            out:
              - type: error
        name: SnapshotSink
      - doc: SnapshotHandle is a published snapshot, pinned until Close.
        embeds:
          - io.ReaderAt
        methods:
          - doc: Meta describes the snapshot.
            name: Meta
            out:
              - type: SnapshotMetaValue
          - doc: Close unpins it.
            name: Close
            out:
              - type: error
        name: SnapshotHandle
      - doc: SnapshotStore holds snapshots. FROZEN under ADR 0039.
        methods:
          - doc: |-
              Create opens the spool of id. When a spool of that id exists, it is
              returned with the ENCODED offset durably spooled so far.
            in:
              - name: id
                type: string
              - name: meta
                type: SnapshotMetaValue
            name: Create
            out:
              - name: sink
                type: SnapshotSink
              - name: spooled
                type: int64
              - name: err
                type: error
          - doc: List returns the complete snapshots, newest first.
            name: List
            out:
              - type: "[]SnapshotMetaValue"
              - type: error
          - doc: Open pins a snapshot until the handle is closed.
            in:
              - name: id
                type: string
            name: Open
            out:
              - type: SnapshotHandle
              - type: error
          - doc: Remove deletes a snapshot; refused while a handle is open.
            in:
              - name: id
                type: string
            name: Remove
            out:
              - type: error
        name: SnapshotStore
      - doc: |-
          Transport carries ENCODED frames between the nodes of a group. FROZEN under
          ADR 0039.
        methods:
          - doc: |-
              Send hands over an encoded frame. It never blocks and may drop; the
              transport owns frame after the call.
            in:
              - name: to
                type: NodeID
              - name: frame
                type: "[]byte"
            name: Send
          - doc: |-
              Stream sends a snapshot from the offset the receiver accepted; open
              returns a reader at an encoded offset on a chunk boundary, which
              Stream closes.
            in:
              - name: ctx
                type: context.Context
              - name: to
                type: NodeID
              - name: offer
                type: InstallOfferValue
              - name: open
                type: func(offset int64) (io.ReadCloser, error)
            name: Stream
            out:
              - type: error
          - doc: |-
              Bind registers the group's callbacks. deliver gets the frame and the
              peer TLS authenticated, valid until deliver returns; offer is judged
              on the event loop and its spool then positioned off it, and the
              shipped transport reads its answer under JoinTimeout; join is
              answered off the loop, under a deadline.
            in:
              - name: group
                type: GroupID
              - name: deliver
                type: func(from AuthenticatedPeerValue, frame []byte)
              - name: offer
                type: func(from AuthenticatedPeerValue, o InstallOfferValue) InstallAcceptValue
              - name: install
                type: func(InstallParams) error
              - name: join
                type: func(ctx context.Context, from AuthenticatedPeerValue, r JoinRequestValue) (PositionValue, errs.Code)
            name: Bind
            out:
              - type: error
          - doc: |-
              SetMembership pushes the group's admitted members; the transport
              computes the union over its groups.
            in:
              - name: group
                type: GroupID
              - name: admitted
                type: "[]MemberValue"
            name: SetMembership
        name: Transport
      - doc: |-
          UnreachableReporter is the sibling of a transport that reports a peer it
          could not reach, so that the leader moves its progress to probe.
        methods:
          - doc: Unreachable registers the callback.
            in:
              - type: func(NodeID)
            name: Unreachable
        name: UnreachableReporter
      - doc: Joiner is the sibling a transport implements to carry a pre-admission JOIN.
        methods:
          - doc: |-
              Join sends the JOIN and returns the position its AddLearner was
              appended at.
            in:
              - name: ctx
                type: context.Context
              - name: cfg
                type: JoinConfig
            name: Join
            out:
              - type: PositionValue
              - type: error
        name: Joiner
      - doc: |-
          JoinAuthorizer is the PRODUCT's port: a member calls it before it turns a
          JOIN into an AddLearner. It decides whether the slot's previous member is
          fenced, which only the product can know, and returns the Operator to record.
        methods:
          - doc: Authorize accepts or refuses the request.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: JoinRequestValue
            name: Authorize
            out:
              - type: Operator
              - type: error
        name: JoinAuthorizer
      - doc: LeadershipWatcher is the sibling of a node that notifies leadership changes.
        methods:
          - doc: |-
              Watch returns its OWN channel, of capacity one, holding the latest
              status; it is unsubscribed and closed when ctx ends or the node closes.
            in:
              - name: ctx
                type: context.Context
            name: Watch
            out:
              - type: <-chan StatusValue
        name: LeadershipWatcher
      - doc: |-
          JoinReasonBinder is the sibling of a transport that carries the reason of
          a refused JOIN back to the joiner. A node that finds it binds this join
          callback in place of Bind's: the reason is what the JoinAuthorizer chose
          to say, sanitized and bounded, or the engine's own refusal, never more.
        methods:
          - doc: |-
              BindJoinReason registers the group's JOIN callback that also returns
              the refusal's reason, empty for none.
            in:
              - name: group
                type: GroupID
              - name: join
                type: func(ctx context.Context, from AuthenticatedPeerValue, r JoinRequestValue) (PositionValue, errs.Code, string)
            name: BindJoinReason
        name: JoinReasonBinder
    sentinels:
      - var:
          - code: CodeConsensusMisconfigured
            doc: |-
              ConsensusMisconfigured is returned by a constructor whose configuration
              it cannot honour: a bound out of range, a heartbeat not below a fifth of
              the minimum election timeout, a lease without a stated clock drift, a
              durability that disagrees with the state machine.
            exit: CONFIG
            name: ConsensusMisconfigured
            private: "core/app/consensus: a configuration field is missing, out of range, or contradicts another; the fields name it"
            public: The consensus node cannot be built from the given configuration
            reason: CONSENSUS_MISCONFIGURED
          - code: CodeNotLeader
            doc: |-
              NotLeader is returned when a proposal was certainly NOT appended. It is
              safe to retry; LeaderHint reads the known leader from its fields.
            exit: TEMPFAIL
            name: NotLeader
            private: "core/app/consensus: the proposal was refused before append because this node does not lead and could not forward it"
            public: This node is not the leader; the proposal was not appended
            reason: NOT_LEADER
          - code: CodeOutcomeUnknown
            doc: |-
              OutcomeUnknown is returned when a proposal was appended, or possibly
              delivered, and its answer was lost. The entry may still commit: never
              retry blindly, read the state through Barrier first.
            exit: TEMPFAIL
            name: OutcomeUnknown
            private: "core/app/consensus: the proposal was appended or possibly delivered, then the answer was lost to a leadership change, a context's end or a broken connection"
            public: The proposal may or may not have been committed
            reason: OUTCOME_UNKNOWN
          - code: CodeLeadershipUnconfirmed
            doc: |-
              LeadershipUnconfirmed is returned by Barrier when its round did not reach
              a majority in time.
            exit: TEMPFAIL
            name: LeadershipUnconfirmed
            private: "core/app/consensus: a read barrier's heartbeat round did not reach a majority of the configuration in time"
            public: The leader could not confirm its leadership
            reason: LEADERSHIP_UNCONFIRMED
          - code: CodeMembershipChangePending
            doc: |-
              MembershipChangePending is returned while another membership change is
              still uncommitted: one change at a time.
            exit: TEMPFAIL
            name: MembershipChangePending
            private: "core/app/consensus: a membership change was proposed while a previous one is uncommitted"
            public: Another membership change is still pending
            reason: MEMBERSHIP_CHANGE_PENDING
          - code: CodeMembershipInvalid
            doc: |-
              MembershipInvalid is returned for a change refused on its merits: an
              unknown node, the last voter, a removal below MinVoters, a promotion
              without durable progress, a change without a reachable majority.
            exit: DATAERR
            name: MembershipInvalid
            private: "core/app/consensus: the membership change names an unknown node, leaves too few voters, or would leave no reachable majority"
            public: The membership change is not allowed
            reason: MEMBERSHIP_INVALID
          - code: CodeTransferFailed
            doc: |-
              TransferFailed is returned when a leadership transfer's target did not
              win within one election timeout. The old leader resumes, without its
              lease for the rest of the term.
            exit: TEMPFAIL
            name: TransferFailed
            private: "core/app/consensus: the transfer target did not win an election within one election timeout"
            public: The leadership transfer did not complete
            reason: TRANSFER_FAILED
          - code: CodeEntryTooLarge
            doc: EntryTooLarge is returned for a command above MaxEntryBytes.
            exit: DATAERR
            name: EntryTooLarge
            private: "core/app/consensus: the command exceeds MaxEntryBytes"
            public: The proposed entry is too large
            reason: ENTRY_TOO_LARGE
          - code: CodeCompacted
            doc: |-
              Compacted is the answer for an index below the first retained one. It is
              an expected outcome the engine acts on, never a failure.
            exit: TEMPFAIL
            name: Compacted
            private: "core/app/consensus: the index is below the first index the log retains"
            public: The requested log position has been compacted
            reason: COMPACTED
          - code: CodeStateMachineFailed
            doc: |-
              StateMachineFailed stops the node when Apply panics or cannot complete.
              The entry IS committed: this never means "not written".
            exit: UNAVAILABLE
            name: StateMachineFailed
            private: "core/app/consensus: Apply panicked or could not complete; the entry is committed and the node stopped applying"
            public: The replicated state machine failed and the node stopped
            reason: STATE_MACHINE_FAILED
          - code: CodeNodeStopped
            doc: |-
              NodeStopped is returned by a call on a node that was closed or stopped
              itself.
            exit: TEMPFAIL
            name: NodeStopped
            private: "core/app/consensus: the node was closed, or stopped itself; its StopReason says why"
            public: The consensus node is stopped
            reason: NODE_STOPPED
          - code: CodeEntrySuperseded
            doc: |-
              EntrySuperseded is returned when a COMMITTED entry at the proposal's
              index has another term: the proposal certainly did not commit.
            exit: TEMPFAIL
            name: EntrySuperseded
            private: "core/app/consensus: the entry committed at the proposal's index carries another term"
            public: Another entry was committed at the proposal's position
            reason: ENTRY_SUPERSEDED
          - code: CodeOverloaded
            doc: |-
              Overloaded is returned when a proposal is refused before append: pending
              bytes or apply lag over their bound. It is safe to retry.
            exit: TEMPFAIL
            name: Overloaded
            private: "core/app/consensus: pending proposal bytes or apply lag are over their bound; nothing was appended"
            public: The cluster is overloaded; the proposal was not appended
            reason: OVERLOADED
          - code: CodeVersionUnsupported
            doc: |-
              VersionUnsupported stops the node on an entry kind, record, frame or
              snapshot version it does not know. Skipping one would be a fork.
            exit: PROTOCOL
            name: VersionUnsupported
            private: "core/app/consensus: an entry kind, log record, frame or snapshot version is unknown to this node, which stops"
            public: A version this node does not support was met
            reason: VERSION_UNSUPPORTED
          - code: CodeNodeIDRetired
            doc: NodeIDRetired is returned when a removed NodeID is offered again.
            exit: DATAERR
            name: NodeIDRetired
            private: "core/app/consensus: the NodeID is in the replicated retired set"
            public: The node ID has been retired and cannot be used again
            reason: NODE_ID_RETIRED
          - code: CodeNoSpace
            doc: |-
              NoSpace is returned for an ordinary proposal while the replicated
              no-space alarm is raised.
            exit: TEMPFAIL
            name: NoSpace
            private: "core/app/consensus: the replicated no-space alarm is raised; only the alarm, its clearing and administrative entries are admitted"
            public: Writes are refused until the no-space alarm is cleared
            reason: NO_SPACE
          - code: CodeResultTypeMismatch
            doc: |-
              ResultTypeMismatch is returned by ProposeAs for an Apply result of
              another type. The entry IS committed; TokenOf reads its token.
            exit: DATAERR
            name: ResultTypeMismatch
            private: "core/app/consensus: ProposeAs got an Apply result of another dynamic type; the entry is committed"
            public: The entry was committed but its result has an unexpected type
            reason: RESULT_TYPE_MISMATCH
          - code: CodePayloadVersionRefused
            doc: |-
              PayloadVersionRefused is returned for a proposal whose payload version is
              above what some member announced; retryable after the upgrade.
            exit: TEMPFAIL
            name: PayloadVersionRefused
            private: "core/app/consensus: the proposal's payload version exceeds the cluster's committed floor; nothing was appended"
            public: The payload version is not yet supported by every member
            reason: PAYLOAD_VERSION_REFUSED
          - code: CodeLineageMismatch
            doc: |-
              LineageMismatch is returned for a position, outbox identity or fence
              from another LogIdentity lineage.
            exit: DATAERR
            name: LineageMismatch
            private: "core/app/consensus: a token or precondition names another ClusterID or log epoch than this log's"
            public: The position belongs to another log lineage
            reason: LINEAGE_MISMATCH
          - code: CodeAdminPreconditionFailed
            doc: |-
              AdminPreconditionFailed is returned when a clearing or raising
              operation names an alarm, version or contract that is not current.
            exit: TEMPFAIL
            name: AdminPreconditionFailed
            private: "core/app/consensus: the precondition names an alarm, contract or version generation that is not the current one"
            public: The administrative operation's precondition no longer holds
            reason: ADMIN_PRECONDITION_FAILED
          - code: CodeLogCorrupt
            doc: |-
              LogCorrupt is a CRC failure that is not a torn tail, or a gap in the
              effective log. It is never repaired.
            exit: DATAERR
            name: LogCorrupt
            private: "core/app/consensus: a log record failed its checksum outside a torn tail, or the effective indexes have a gap"
            public: The consensus log is corrupt
            reason: LOG_CORRUPT
          - code: CodeHardStateCorrupt
            doc: |-
              HardStateCorrupt is an unreadable hard-state record or checkpoint; it is
              never defaulted.
            exit: DATAERR
            name: HardStateCorrupt
            private: "core/app/consensus: the hard-state record or the checkpoint holding it is unreadable"
            public: The consensus hard state is corrupt
            reason: HARD_STATE_CORRUPT
          - code: CodeSnapshotCorrupt
            doc: |-
              SnapshotCorrupt is a snapshot whose SHA-256 or size does not match its
              metadata.
            exit: DATAERR
            name: SnapshotCorrupt
            private: "core/app/consensus: a snapshot's digest, chunk checksum or size does not match its metadata"
            public: The snapshot is corrupt
            reason: SNAPSHOT_CORRUPT
          - code: CodeStorageFailed
            doc: |-
              StorageFailed stops the node on a failed write, sync or read. It is
              never retried: a retried fsync can report success over lost pages.
            exit: IOERR
            name: StorageFailed
            private: "core/app/consensus: a write, fsync or read failed; the node stops and refuses to start again until the machine reboots"
            public: The consensus storage failed and the node stopped
            reason: STORAGE_FAILED
          - code: CodeDataDirLocked
            doc: DataDirLocked is returned when another process holds the data directory.
            exit: TEMPFAIL
            name: DataDirLocked
            private: "core/app/consensus: the data directory lock is held by another process"
            public: The data directory is held by another process
            reason: DATA_DIR_LOCKED
          - code: CodeDataDirMismatch
            doc: |-
              DataDirMismatch is returned when the stamp names another cluster, node
              or incarnation, or an applied position cannot be trusted.
            exit: CONFIG
            name: DataDirMismatch
            private: "core/app/consensus: the stamp or the applied position names another cluster, node, incarnation or lineage"
            public: The data directory belongs to another node or cluster
            reason: DATA_DIR_MISMATCH
          - code: CodePeerRejected
            doc: |-
              PeerRejected is returned when a peer's certificate is not canonical,
              names another cluster or slot, or carries a key that is not pinned.
            exit: TEMPFAIL
            name: PeerRejected
            private: "core/app/consensus: the peer certificate's URI SAN is not canonical, names another cluster or slot, or its key is not admitted"
            public: The peer was rejected
            reason: PEER_REJECTED
          - code: CodeClusterMismatch
            doc: |-
              ClusterMismatch is returned when a peer's first frame names another
              cluster or group.
            exit: CONFIG
            name: ClusterMismatch
            private: "core/app/consensus: the first frame names another cluster or group"
            public: The peer belongs to another cluster
            reason: CLUSTER_MISMATCH
          - code: CodeFrameInvalid
            doc: |-
              FrameInvalid is a frame that does not parse or exceeds MaxFrameBytes;
              the connection closes.
            exit: DATAERR
            name: FrameInvalid
            private: "core/app/consensus: a frame does not parse, or its length exceeds the frame cap"
            public: A malformed frame was received
            reason: FRAME_INVALID
          - code: CodeSnapshotTooLarge
            doc: |-
              SnapshotTooLarge is an announced snapshot above the local
              MaxSnapshotBytes, refused before anything is spooled.
            exit: DATAERR
            name: SnapshotTooLarge
            private: "core/app/consensus: the announced snapshot size exceeds MaxSnapshotBytes"
            public: The snapshot is larger than this node accepts
            reason: SNAPSHOT_TOO_LARGE
          - code: CodeBootstrapRefused
            doc: |-
              BootstrapRefused is returned when a listed peer already holds a history,
              or the founding member lists differ.
            exit: CONFIG
            name: BootstrapRefused
            private: "core/app/consensus: the data directory already holds log entries, or a bootstrap with another member list is pending"
            public: The cluster cannot be bootstrapped
            reason: BOOTSTRAP_REFUSED
          - code: CodeTransportMisconfigured
            doc: |-
              TransportMisconfigured is returned when the transport cannot be built
              from its configuration.
            exit: CONFIG
            name: TransportMisconfigured
            private: "core/app/consensus: an identity without roots, a listener without client-certificate verification, or a limit out of range"
            public: The consensus transport cannot be built from the given configuration
            reason: TRANSPORT_MISCONFIGURED
          - code: CodeRecoverRefused
            doc: RecoverRefused is returned when Recover's preconditions do not hold.
            exit: CONFIG
            name: RecoverRefused
            private: "core/app/consensus: Recover needs a stopped, locked directory, a new ClusterID, the typed confirmation and a signed fence for every old voter"
            public: The recovery was refused
            reason: RECOVER_REFUSED
          - code: CodeLogQuarantined
            doc: |-
              LogQuarantined is returned at start while the data directory carries a
              quarantine marker; only ClearQuarantine lifts it.
            exit: DATAERR
            name: LogQuarantined
            private: "core/app/consensus: the data directory carries a quarantine marker from a LOG_CORRUPT; an operator must clear it"
            public: The consensus log is quarantined
            reason: LOG_QUARANTINED
          - code: CodeRestoreRefused
            doc: |-
              RestoreRefused is returned when RestoreSnapshot's preconditions do not
              hold.
            exit: CONFIG
            name: RestoreRefused
            private: "core/app/consensus: RestoreSnapshot needs an empty directory, a non-zero expected digest that matches, and the typed confirmation"
            public: The snapshot restore was refused
            reason: RESTORE_REFUSED
          - code: CodeDataDirInUse
            doc: |-
              DataDirInUse is returned by an offline operation on a directory a live
              node holds.
            exit: TEMPFAIL
            name: DataDirInUse
            private: "core/app/consensus: Close, Recover or Inspect was called while a live Node holds the directory"
            public: The data directory is in use by a running node
            reason: DATA_DIR_IN_USE
          - code: CodeJoinRefused
            doc: JoinRefused is returned to a pre-admission JOIN that was refused.
            exit: TEMPFAIL
            name: JoinRefused
            private: "core/app/consensus: the JOIN names a slot whose member is not fenced, exceeds its rate, or reuses a retired id"
            public: The join request was refused
            reason: JOIN_REFUSED
          - code: CodeStopMarkerPresent
            doc: StopMarkerPresent is returned by NewRaft when a stop marker applies.
            exit: DATAERR
            name: StopMarkerPresent
            private: "core/app/consensus: a stop marker is present; STORAGE_FAILED clears at reboot, the others by an operator"
            public: The node refuses to start until its stop marker is cleared
            reason: STOP_MARKER_PRESENT
    types:
      - doc: |-
          EntryKind says what a log entry carries. Only [EntryCommand] reaches the
          state machine; every other kind is the engine's own replicated state. A kind
          a node does not know stops it with VERSION_UNSUPPORTED: it is never skipped.
        methods:
          - doc: Known reports whether the kind is one protocol version 1 defines.
            name: Known
            out:
              - type: bool
            recv: value
        name: EntryKind
        underlying: uint8
      - doc: |-
          EntryValue is one record of the replicated log. Data is immutable once appended:
          the store and the engine never write into it, and a caller that hands bytes
          to Propose gives up their ownership.
        name: EntryValue
        struct:
          fields:
            - doc: Position is the entry's term and index.
              name: Position
              type: PositionValue
            - doc: Kind says what Data carries.
              name: Kind
              type: EntryKind
            - doc: |-
                Version is the payload version the proposer set; it selects the frozen
                code path that applies the entry.
              name: Version
              type: uint32
            - doc: BodySum is the CRC-32C of Data, computed by the proposer.
              name: BodySum
              type: uint32
            - doc: |-
                ChainSum chains the previous entry's header: computed by the LEADER at
                its serialized append point, verified at append and before Apply.
              name: ChainSum
              type: uint32
            - doc: |-
                Data is the payload: a command for EntryCommand, the engine's encoding
                for the other kinds.
              name: Data
              type: "[]byte"
            - doc: |-
                Token is the entry's lineage-scoped command identity, set in memory by
                the engine before Apply and never encoded in the log.
              name: Token
              type: TokenValue
      - doc: |-
          HardState is what a node must never forget: its term, its vote in that term
          and the commit index it knows of. Term and vote are durable before any reply
          depends on them; the commit index is written lazily, never above the last
          synced index.
        name: HardState
        struct:
          fields:
            - doc: Term is the node's current term.
              name: Term
              type: uint64
            - doc: Vote is the candidate voted for in Term, 0 for none.
              name: Vote
              type: NodeID
            - doc: Commit is the highest index known committed.
              name: Commit
              type: uint64
      - doc: |-
          NodeID names one member of a group for its whole life. It is a random 64-bit
          value drawn at Init, never 0 and never reused: a node whose disk was lost
          rejoins under a NEW id, because one that rejoined under its old id could vote
          twice in one term.
        methods:
          - doc: String renders the id in decimal, the form an operator types back.
            name: String
            out:
              - type: string
            recv: value
        name: NodeID
        underlying: uint64
      - doc: |-
          Incarnation is a random 128-bit value drawn when a data directory is first
          stamped. A wiped machine that kept its certificate and its NodeID is still
          a different incarnation, and is refused. It is an identifier, not a secret.
        methods:
          - doc: String renders the incarnation in lowercase hex.
            name: String
            out:
              - type: string
            recv: value
          - doc: IsZero reports whether no incarnation was drawn.
            name: IsZero
            out:
              - type: bool
            recv: value
        name: Incarnation
        underlying: "[16]byte"
      - doc: |-
          ClusterID names one cluster: the founding, or a Recover or RestoreSnapshot
          that started a new history. It is 16 bytes everywhere it is encoded, the URI
          SAN included, where it is spelt in hex (see String).
        methods:
          - doc: |-
              String renders the cluster id in lowercase hex, the form the certificate's
              URI SAN carries.
            name: String
            out:
              - type: string
            recv: value
          - doc: IsZero reports whether the cluster id was never set.
            name: IsZero
            out:
              - type: bool
            recv: value
        name: ClusterID
        underlying: "[16]byte"
      - doc: |-
          LogIdentityValue scopes positions: the ClusterID and a log epoch that Recover and
          RestoreSnapshot bump, and the predecessor this history descends from with the
          last index it kept. A position or a token from another identity is not
          comparable with this log's.
        methods:
          - doc: |-
              Same reports whether two identities name the same history (cluster and
              epoch), whatever lineage they record.
            in:
              - name: o
                type: LogIdentityValue
            name: Same
            out:
              - type: bool
            recv: value
        name: LogIdentityValue
        struct:
          fields:
            - doc: Cluster is the cluster the log belongs to.
              name: Cluster
              type: ClusterID
            - doc: "Epoch counts the histories of this cluster id: 1 at founding."
              name: Epoch
              type: uint64
            - doc: |-
                Predecessor is the cluster of the history this one was recovered from,
                zero for a founding.
              name: Predecessor
              type: ClusterID
            - doc: PredecessorEpoch is the predecessor's epoch.
              name: PredecessorEpoch
              type: uint64
            - doc: |-
                KeptIndex is the last index Recover kept from the predecessor. An
                applied position of the predecessor at or below it is still trusted
                when its term is the one kept there: Recover adopts the verified
                suffix past the commit the survivor persisted, which may hold
                another term than the write the old cluster acknowledged.
                Every node of the history applies the entries at or below it under the
                predecessor's token: one admitted after the Recover learns it from the
                snapshot it installs, never from an append.
              name: KeptIndex
              type: uint64
            - doc: |-
                AdoptedFrom is the last index of the kept range the predecessor had
                committed when Recover read it: the commit the survivor persisted,
                or the snapshot a restore started from. An entry at or below it is
                the one every node of the predecessor holds (Log Matching), so a
                predecessor's token at or below it is trusted by its index once its
                term can no longer be read; the adopted range above it, up to
                KeptIndex, is not. 0 records nothing, and nothing is trusted that
                way. It is recorded only in a cluster at protocol version 2, in the
                stamp of the node Recover or RestoreSnapshot ran on: a snapshot does
                not carry it, so a node that learns the lineage from one trusts
                nothing that way (#509).
              name: AdoptedFrom
              type: uint64
      - doc: |-
          TokenValue is a lineage-scoped position: the cluster, the log epoch, the term and
          the index. It is comparable, and its encoding is fixed at 41 bytes: a version
          byte, the 16-byte ClusterID, then epoch, term and index as big-endian uint64
          (see AppendToken in the service's wire package).
        methods:
          - doc: Position returns the token's position, without its lineage.
            name: Position
            out:
              - type: PositionValue
            recv: value
        name: TokenValue
        struct:
          fields:
            - doc: Cluster is the cluster of the log that committed the entry.
              name: Cluster
              type: ClusterID
            - doc: Epoch is that log's epoch.
              name: Epoch
              type: uint64
            - doc: Term is the entry's term.
              name: Term
              type: uint64
            - doc: Index is the entry's index.
              name: Index
              type: uint64
      - doc: |-
          Operator is the opaque identity an administrative operation is performed
          under. The product vouches for it and the SDK records it in the entry,
          never authenticating it. It is printable ASCII 0x21-0x7E, at most 128 bytes,
          and must not carry personal data: the log is replicated and kept.
        methods:
          - doc: Valid reports whether the operator satisfies the format rules.
            name: Valid
            out:
              - type: bool
            recv: value
        name: Operator
        underlying: string
      - doc: |-
          AlarmID names an alarm by the index of the entry that raised it, so that a
          clearing operation names the alarm it means to clear.
        name: AlarmID
        underlying: uint64
      - doc: |-
          PreconditionSpec is what a clearing or raising operation expects to act on: the
          log identity it was read in, and the alarm or the contract or cluster-version
          generation it expects to replace. Apply refuses a mismatch with
          ADMIN_PRECONDITION_FAILED, so a stale page cannot clear an alarm raised since.
        name: PreconditionSpec
        struct:
          fields:
            - doc: Log is the identity the precondition was read in.
              name: Log
              type: LogIdentityValue
            - doc: Alarm is the alarm a clearing operation names.
              name: Alarm
              type: AlarmID
            - doc: |-
                Generation is the contract or cluster-version generation an operation
                expects to replace.
              name: Generation
              type: uint64
      - doc: |-
          MemberValue is one node of the membership: its identity, the key it is pinned
          to, where it listens, and whether it votes.
        name: MemberValue
        struct:
          fields:
            - doc: ID is the node.
              name: ID
              type: NodeID
            - doc: Incarnation is the node's data-directory incarnation.
              name: Incarnation
              type: Incarnation
            - doc: Slot is the placement slot its certificate names.
              name: Slot
              type: string
            - doc: |-
                SPKI is the SHA-256 of its certificate's SubjectPublicKeyInfo. A zero
                pin admits nobody: it is what DenyPin leaves.
              name: SPKI
              type: "[32]byte"
            - doc: Address is where its transport listens.
              name: Address
              type: string
            - doc: Voter is true for a voter, false for a learner.
              name: Voter
              type: bool
            - doc: Joining marks an empty learner admitted before it holds any log.
              name: Joining
              type: bool
            - doc: |-
                PayloadMax is the highest payload version its state machine supports; 0
                means only the lowest.
              name: PayloadMax
              type: uint32
            - doc: MaxSnapshotBytes is the largest snapshot it accepts, 0 when unknown.
              name: MaxSnapshotBytes
              type: int64
      - doc: |-
          MembershipValue is the configuration at a position: its members, the set of
          retired IDs, which is never reused, and from protocol 3 the set of retired
          keys, which is never admitted again.
        methods:
          - doc: Member returns the member with that id.
            in:
              - name: id
                type: NodeID
            name: Member
            out:
              - type: MemberValue
              - type: bool
            recv: value
          - doc: IsRetired reports whether the id was removed.
            in:
              - name: id
                type: NodeID
            name: IsRetired
            out:
              - type: bool
            recv: value
          - doc: |-
              IsRetiredKey reports whether the key was retired with a member removed, or
              with a pin denied.
            in:
              - name: spki
                type: "[32]byte"
            name: IsRetiredKey
            out:
              - type: bool
            recv: value
          - doc: Voters returns the ids of the voters, in membership order.
            name: Voters
            out:
              - type: "[]NodeID"
            recv: value
          - doc: |-
              Clone returns a deep copy, so that a membership handed out cannot be changed
              under the engine.
            name: Clone
            out:
              - type: MembershipValue
            recv: value
        name: MembershipValue
        struct:
          fields:
            - doc: Index is the index of the entry that produced it, 0 at founding.
              name: Index
              type: uint64
            - doc: Members lists every voter and learner.
              name: Members
              type: "[]MemberValue"
            - doc: Retired lists every removed NodeID.
              name: Retired
              type: "[]NodeID"
            - doc: |-
                RetiredKeys lists the SPKI pin of every member removed, and every pin
                DenyPin withdrew, since the cluster version is 3: a key held once is
                never admitted again under another id. Empty below version 3.
              name: RetiredKeys
              type: "[][32]byte"
      - doc: |-
          MessageKind says what a Message is. The two high bits are its lane, so that
          the frame header alone routes it (ADR 0152 D18).
        methods:
          - doc: Lane returns the connection the kind belongs on.
            name: Lane
            out:
              - type: FrameLane
            recv: value
          - doc: Known reports whether protocol version 1 or 2 defines the kind.
            name: Known
            out:
              - type: bool
            recv: value
        name: MessageKind
        underlying: uint8
      - doc: MessageFlags are a message's boolean qualifiers.
        name: MessageFlags
        underlying: uint8
      - doc: |-
          GroupID names a consensus group. v1 runs exactly one group, 1, and every
          frame carries it so that a later version can multiplex groups without
          changing the wire.
        name: GroupID
        underlying: uint64
      - doc: |-
          MessageValue is one protocol message: a plain value, encoded by the service's
          AppendMessage and decoded by ParseMessage, never by a method. The engine
          trusts the transport's authenticated peer over From, and drops a message
          whose From differs from it.
        name: MessageValue
        struct:
          fields:
            - doc: Version is the frame layout version, 1.
              name: Version
              type: uint8
            - doc: Group is the consensus group, 1 in v1.
              name: Group
              type: GroupID
            - doc: Kind says what the message is.
              name: Kind
              type: MessageKind
            - doc: Flags qualify it.
              name: Flags
              type: MessageFlags
            - doc: From is the sender, as the sender wrote it.
              name: From
              type: NodeID
            - doc: To is the receiver.
              name: To
              type: NodeID
            - doc: Term is the sender's term.
              name: Term
              type: uint64
            - doc: |-
                LogTerm is the term of the entry at Index: the previous entry of an
                append, the last entry of a vote request.
              name: LogTerm
              type: uint64
            - doc: |-
                Index is the previous index of an append, the last index of a vote
                request, the verified prefix of an acknowledgement, a read index.
              name: Index
              type: uint64
            - doc: Commit is the commit index the sender lets the receiver advance to.
              name: Commit
              type: uint64
            - doc: Reject marks a refusal.
              name: Reject
              type: bool
            - doc: RejectHint is the receiver's last index, a hint where to probe from.
              name: RejectHint
              type: uint64
            - doc: |-
                Context correlates a reply with its request: a heartbeat round, a read
                request, a submission sequence.
              name: Context
              type: uint64
            - doc: TransferIssuer is the leader that issued a transfer flag.
              name: TransferIssuer
              type: NodeID
            - doc: TransferTerm is the term the transfer flag was issued in.
              name: TransferTerm
              type: uint64
            - doc: Contract is the committed contract generation the sender has applied.
              name: Contract
              type: uint64
            - doc: Code is a refusal's error code, 0 for none.
              name: Code
              type: errs.Code
            - doc: |-
                Entries are the entries an append carries, or the proposal a forward
                carries with a zero position.
              name: Entries
              type: "[]EntryValue"
      - doc: |-
          PositionValue is an entry's place in the log: the term it was created in and its
          index. The index is a fencing token: unique, strictly increasing over the
          group's life and identical on every node. The term says WHICH command, never
          who may act on it now (ADR 0152 D10).
        name: PositionValue
        struct:
          fields:
            - doc: Term is the leader term the entry was appended in.
              name: Term
              type: uint64
            - doc: Index is the entry's place in the log, from 1.
              name: Index
              type: uint64
      - doc: |-
          SnapshotMetaValue describes one snapshot: where it cuts the log, the engine state
          it carries, and what its bytes must hash to. It is versioned; a version a
          node does not know is refused cleanly.
        name: SnapshotMetaValue
        struct:
          fields:
            - doc: ID names the snapshot, the same in a spool, an offer and a handle.
              name: ID
              type: string
            - doc: Version is the snapshot format version, 1.
              name: Version
              type: uint8
            - doc: Position is the last entry the snapshot covers.
              name: Position
              type: PositionValue
            - doc: Log is the identity of the log the snapshot was cut from.
              name: Log
              type: LogIdentityValue
            - doc: Membership is the configuration valid at Position, never a later one.
              name: Membership
              type: MembershipValue
            - doc: |-
                ChainTip is the authenticated chain value at Position: the chain is
                carried across the boundary, never reseeded.
              name: ChainTip
              type: uint32
            - doc: "Codec names the compression of the chunks: \"flate\" or \"gzip\"."
              name: Codec
              type: string
            - doc: EncodedSize is the size of the encoded stream, chunk headers included.
              name: EncodedSize
              type: int64
            - doc: DecodedSize is the size of the decoded stream.
              name: DecodedSize
              type: int64
            - doc: ChunkSize is the largest decoded chunk.
              name: ChunkSize
              type: int64
            - doc: SHA256 is the digest of the DECODED stream, computed by the engine.
              name: SHA256
              type: "[32]byte"
            - doc: Timing is the committed timing contract at Position.
              name: Timing
              type: TimingContractSpec
            - doc: ClusterVersion is the committed cluster version at Position.
              name: ClusterVersion
              type: uint32
            - doc: ClusterGeneration counts its raises.
              name: ClusterGeneration
              type: uint64
            - doc: NoSpace is the no-space alarm raised at Position, 0 for none.
              name: NoSpace
              type: AlarmID
            - doc: Reserved is carried uninterpreted for ADR 0173.
              name: Reserved
              type: "[]byte"
      - doc: |-
          InstallOfferValue is what a leader sends before streaming a snapshot: the whole
          metadata first, so the receiver refuses a snapshot too large, of another
          version or already covered before a single byte of it is spooled (D7).
        name: InstallOfferValue
        struct:
          fields:
            - doc: Term is the sender's term.
              name: Term
              type: uint64
            - doc: SnapshotID equals Meta.ID.
              name: SnapshotID
              type: string
            - doc: Meta describes the snapshot.
              name: Meta
              type: SnapshotMetaValue
      - doc: |-
          InstallAcceptValue is the receiver's answer to an offer. The RECEIVER chooses the
          offset to resume from, from what it has durably spooled, so a resumed stream
          never appends to bytes the receiver did not keep (D7, R8-21).
        name: InstallAcceptValue
        struct:
          fields:
            - doc: SnapshotID is the snapshot answered.
              name: SnapshotID
              type: string
            - doc: |-
                Offset is the chunk-aligned ENCODED offset to resume from, 0 for a
                fresh spool.
              name: Offset
              type: int64
            - doc: Refused is zero, or why the offer is refused.
              name: Refused
              type: errs.Code
            - doc: |-
                Held reports that the receiver already holds the snapshot: an
                idempotent success.
              name: Held
              type: bool
      - doc: |-
          InstallParams is what the transport hands the engine once bytes flow, after
          the offer was accepted. Body ends with the connection: a stream cut short is a
          short read, and the spool keeps its last whole chunk for the next offer.
        name: InstallParams
        struct:
          fields:
            - doc: Ctx ends with the connection.
              name: Ctx
              type: context.Context
            - doc: From is the peer TLS authenticated.
              name: From
              type: AuthenticatedPeerValue
            - doc: Offer is the accepted offer.
              name: Offer
              type: InstallOfferValue
            - doc: Offset is the accepted offset.
              name: Offset
              type: int64
            - doc: Body is the encoded stream from Offset, ending with the connection.
              name: Body
              type: io.Reader
      - doc: |-
          AuthenticatedPeerValue is what the TLS handshake proved, never what a frame
          claims. The certificate proves the slot and the key; the ID and the
          incarnation are the member the transport admitted on that key. A peer that is
          not yet a member, during a JOIN, has ID 0 and only Slot and SPKI set.
        name: AuthenticatedPeerValue
        struct:
          fields:
            - doc: ID is the admitted member, 0 for a joiner.
              name: ID
              type: NodeID
            - doc: Incarnation is that member's incarnation.
              name: Incarnation
              type: Incarnation
            - doc: Slot is the slot the certificate's URI SAN names.
              name: Slot
              type: string
            - doc: SPKI is the SHA-256 of the certificate's SubjectPublicKeyInfo.
              name: SPKI
              type: "[32]byte"
      - doc: |-
          JoinRequestValue is a pre-admission JOIN as a member received it: the slot and
          the key from TLS, the new node's id and incarnation from its frame.
        name: JoinRequestValue
        struct:
          fields:
            - doc: Cluster is the cluster the joiner claims.
              name: Cluster
              type: ClusterID
            - doc: ID is the joiner's new NodeID.
              name: ID
              type: NodeID
            - doc: Incarnation is the joiner's incarnation.
              name: Incarnation
              type: Incarnation
            - doc: Slot is the slot its certificate names.
              name: Slot
              type: string
            - doc: SPKI is its key, from the handshake.
              name: SPKI
              type: "[32]byte"
            - doc: Address is where it listens.
              name: Address
              type: string
            - doc: |-
                MaxSnapshotBytes is the largest snapshot the joiner accepts, as it
                announced it; 0 when it announced none, as a joiner that predates
                the announcement does.
              name: MaxSnapshotBytes
              type: int64
      - doc: |-
          FencedAttestationValue is the operator's statement that an old voter was fenced
          before a Recover: the voter, the method that fenced it, and one signed
          receipt per witness (one per NAS).
        name: FencedAttestationValue
        struct:
          fields:
            - doc: Voter is the old voter.
              name: Voter
              type: NodeID
            - doc: "Method is how it was fenced: \"stopped\", \"powered-off\" or \"cut\"."
              name: Method
              type: string
            - doc: |-
                Receipts are Ed25519 signatures, one per witness key, over the old
                cluster id, the new cluster id and the voter.
              name: Receipts
              type: "[][]byte"
      - doc: StampState says how far a data directory has come.
        name: StampState
        underlying: uint8
      - doc: |-
          StampValue binds a data directory to one node of one cluster: written by
          LogStore.WriteStamp, durable on return, and verified at every start. A
          mismatch is DATA_DIR_MISMATCH.
        name: StampValue
        struct:
          fields:
            - doc: Log is the log identity the directory belongs to.
              name: Log
              type: LogIdentityValue
            - doc: ID is the node.
              name: ID
              type: NodeID
            - doc: Incarnation is drawn when the stamp is first written.
              name: Incarnation
              type: Incarnation
            - doc: Slot is the placement slot the node's certificate names.
              name: Slot
              type: string
            - doc: State is how far the directory has come.
              name: State
              type: StampState
            - doc: |-
                Founding is the digest of the founding member list while a bootstrap
                is pending, so that a rerun with another list is refused.
              name: Founding
              type: "[32]byte"
      - doc: |-
          JoinConfig is what a joining node needs to send its JOIN: where to reach the
          members, and the stamp Init wrote, whose id and incarnation the member it
          reaches proposes as a learner.
        name: JoinConfig
        struct:
          fields:
            - doc: Addresses are the members to try, in order.
              name: Addresses
              type: "[]string"
            - doc: Stamp is the joiner's stamp, from Init.
              name: Stamp
              type: StampValue
            - doc: Address is where the joiner listens.
              name: Address
              type: string
            - doc: |-
                Pins are the SPKIs of the members the joiner trusts, from the
                operator. An answer counts only from a peer presenting one of them,
                and only when the membership it returns lists that peer under that
                key; an empty list refuses the JOIN.
              name: Pins
              type: "[][32]byte"
            - doc: |-
                MaxSnapshotBytes is the joiner's own MaxSnapshotBytes, announced in
                the JOIN so the members hold their cuts to it (R2-30); 0 announces
                nothing, and the JOIN is the one a member that predates the
                announcement reads.
              name: MaxSnapshotBytes
              type: int64
      - doc: Role is a node's part in its group.
        methods:
          - doc: String names the role.
            name: String
            out:
              - type: string
            recv: value
        name: Role
        underlying: uint8
      - doc: |-
          FrameLane is the connection a frame belongs on: control, data or snapshot.
          It is carried in the two high bits of the frame's type byte, so a transport
          routes a frame of a type it does not parse.
        name: FrameLane
        underlying: uint8
      - doc: |-
          StatusValue is a node's view of its group after one turn of its event loop. It is a
          copy taken on the loop, never a live view, so every field in it describes the
          same instant.
        methods:
          - doc: |-
              Precondition returns the precondition an operation clearing the current
              alarm, or replacing the current contract, would carry.
            name: Precondition
            out:
              - type: PreconditionSpec
            recv: pointer
        name: StatusValue
        struct:
          fields:
            - doc: ID is this node.
              name: ID
              type: NodeID
            - doc: Role is its role.
              name: Role
              type: Role
            - doc: Term is its current term.
              name: Term
              type: uint64
            - doc: Leader is the leader it knows of in Term, 0 for none.
              name: Leader
              type: NodeID
            - doc: Commit is the highest index it knows committed.
              name: Commit
              type: uint64
            - doc: Applied is the highest index its state machine applied.
              name: Applied
              type: uint64
            - doc: Log is the identity of its log.
              name: Log
              type: LogIdentityValue
            - doc: Versions are its capabilities and the committed cluster version.
              name: Versions
              type: VersionsValue
            - doc: Timing is the committed timing contract.
              name: Timing
              type: TimingContractSpec
            - doc: NoSpace is the raised no-space alarm, 0 when none.
              name: NoSpace
              type: AlarmID
      - doc: |-
          VersionsValue are a node's capabilities: the protocol range it speaks, the
          payload versions its state machine supports, and the committed cluster
          version.
        name: VersionsValue
        struct:
          fields:
            - doc: ProtocolMin is the lowest protocol version it speaks.
              name: ProtocolMin
              type: uint32
            - doc: ProtocolMax is the highest.
              name: ProtocolMax
              type: uint32
            - doc: PayloadMax is the highest payload version it applies.
              name: PayloadMax
              type: uint32
            - doc: Cluster is the committed cluster version.
              name: Cluster
              type: uint32
            - doc: ClusterGeneration counts cluster-version raises.
              name: ClusterGeneration
              type: uint64
      - doc: |-
          StopReasonValue says why a node stopped itself. Err carries the sentinel of the
          stop; ExitCode is the process exit status the product should use.
        methods:
          - doc: |-
              ExitCode returns errs.ExitCodeOf of the stop's error, or 73 for a storage
              failure whose marker could not be written (ADR 0152 D4).
            name: ExitCode
            out:
              - type: int
            recv: value
        name: StopReasonValue
        struct:
          fields:
            - doc: Err is the stop's error, built on its sentinel.
              name: Err
              type: error
            - doc: |-
                Unmarked is set when a STORAGE_FAILED stop could write its marker
                nowhere: the exit code is then 73.
              name: Unmarked
              type: bool
      - doc: |-
          TimingContractSpec is the set of timings every member must agree on for leases
          and vote refusals to be sound. The committed contract entry is its ONLY
          authority; a node's own configuration is merely the proposal used at
          Bootstrap.
        name: TimingContractSpec
        struct:
          fields:
            - doc: Generation counts the committed contracts, 1 at founding.
              name: Generation
              type: uint64
            - doc: HeartbeatInterval is how often the leader confirms itself.
              name: HeartbeatInterval
              type: time.Duration
            - doc: |-
                ElectionTimeoutMin is the lower bound of the randomized election
                timeout, and the vote-refusal window.
              name: ElectionTimeoutMin
              type: time.Duration
            - doc: ElectionTimeoutMax is its upper bound, exclusive.
              name: ElectionTimeoutMax
              type: time.Duration
            - doc: |-
                MaxClockDrift is the largest rate difference between two clocks, as a
                fraction in (0, 1). Zero refuses lease reads.
              name: MaxClockDrift
              type: float64
  - constants:
      - doc: |-
          ReadIndex confirms every read by a heartbeat round started after it
          arrived. It is the zero value and the default.
        name: ReadIndex
        type: ReadMode
        value: "0"
      - doc: |-
          ReadLease serves reads under the leader lease, sound only under the
          four conditions of D9; it requires InitialTiming.MaxClockDrift.
        name: ReadLease
        type: ReadMode
        value: "1"
      - doc: "DurabilityUnset is refused: the caller states it."
        name: DurabilityUnset
        type: Durability
        value: "0"
      - doc: |-
          DurabilityVolatile is a state machine held in memory, rebuilt from the
          latest snapshot and the log at every start.
        name: DurabilityVolatile
        type: Durability
        value: "1"
      - doc: |-
          DurabilityDurable is a DurableStateMachine that persists its applied
          position with its state.
        name: DurabilityDurable
        type: Durability
        value: "2"
      - doc: MaxJoinReasonBytes bounds the reason a JOIN refusal carries to the joiner.
        name: MaxJoinReasonBytes
        type: int
        value: "256"
      - blockDoc: |-
          The shipped log (D4) is a directory of fixed-size, zero-filled segment
          files. Every record is 8-byte aligned:

          	length u32 | crc u32 | version u8 | kind u8 | end u8 | 0 u8 | batch u64 |
          	term u64 | index u64 | entry kind u8 | 0 0 0 | entry version u32 |
          	body sum u32 | chain u32 | payload | zero padding

          little-endian; length counts the bytes after the crc field, padding
          excluded, and the crc is the CRC-32C of those bytes. Records are written
          in batches: every record of a batch carries its sequence number, the last
          one the end-of-batch flag, and batch k+1 is written only after batch k was
          synced, so any valid record of batch k+1 proves batch k durable
          (R7-12, R8-01 to R8-04).
        doc: DefaultSegmentBytes is a segment's fixed size (provisional).
        name: DefaultSegmentBytes
        type: int64
        value: 64 << 20
      - blockDoc: The facts a PeerHealthValue carries.
        doc: PeerVoter is set for a voter, clear for a learner.
        name: PeerVoter
        type: PeerFlags
        value: "1"
      - blockDoc: The facts a PeerHealthValue carries.
        doc: |-
          PeerUnreachable is set when the transport failed to reach the peer
          since it last answered, or it has not answered within the minimum
          election timeout.
        name: PeerUnreachable
        type: PeerFlags
        value: "2"
      - blockDoc: The facts a PeerHealthValue carries.
        doc: PeerSnapshot is set while a snapshot is being sent to the peer.
        name: PeerSnapshot
        type: PeerFlags
        value: "4"
      - blockDoc: The answers a HealthValue carries.
        doc: |-
          HealthReady is the readiness answer: running, a leader known,
          everything known committed applied, and not refusing the current
          leader's chain (D4).
        name: HealthReady
        type: HealthFlags
        value: "1"
      - blockDoc: The answers a HealthValue carries.
        doc: HealthHasLeader is set when a leader is known in the current term.
        name: HealthHasLeader
        type: HealthFlags
        value: "2"
      - blockDoc: The answers a HealthValue carries.
        doc: |-
          HealthQuorumReachable is set on a leader a majority answered within
          the minimum election timeout; never elsewhere.
        name: HealthQuorumReachable
        type: HealthFlags
        value: "4"
      - blockDoc: The answers a HealthValue carries.
        doc: HealthStopped is set once the node stopped itself or was closed.
        name: HealthStopped
        type: HealthFlags
        value: "8"
      - blockDoc: The answers a HealthValue carries.
        doc: |-
          HealthSnapshotNearLimit is set when the newest snapshot has reached
          four fifths of SnapshotLimit: the cuts are about to be refused
          SNAPSHOT_TOO_LARGE (R2-30). Readiness does not depend on it.
        name: HealthSnapshotNearLimit
        type: HealthFlags
        value: "16"
      - doc: |-
          WipeAndRejoin wipes the directory; the operator then Removes the old
          NodeID and Inits under a NEW one (R4-03). A voter's incarnation is
          never swapped in place. A wipe that does not finish leaves the stop
          marker STOP-WIPE, which refuses a start, Init, Redraw, Recover,
          RestoreSnapshot and TruncateAndStaySilent until WipeAndRejoin runs
          again and completes it.
        name: WipeAndRejoin
        type: QuarantineExit
        value: "1"
      - doc: |-
          TruncateAndStaySilent truncates at the damage and persists a silence
          condition (R4-03).
        name: TruncateAndStaySilent
        type: QuarantineExit
        value: "2"
    doc: |-
      Package consensus is the Raft engine of ADR 0152 and everything it ships
      around the step function of package raft: the event loop that drives it,
      the storage actor that makes a write durable before any reply that depends
      on it leaves, the apply goroutine, and snapshots cut, sent and installed in
      checksummed chunks.

      A [Node] is built by [NewNode] over a [Config]: a state machine, a log, a
      snapshot store and a transport. The shipped storage is a [DataDir] — a
      lock, a stamp, the segmented [fileLog], the [fileSnapshots] and the stop
      markers — and the shipped transport is the mutual-TLS [TCPTransport];
      [MemoryLog], [MemorySnapshots] and [MemoryNetwork] stand in for them in
      tests.

      A failed write or sync stops the node with STORAGE_FAILED and is never
      retried (D4). The offline operations [Init], [Recover], [RestoreSnapshot],
      [Inspect] and [ClearQuarantine] work on a stopped node's directory only.
    functions:
      - doc: |-
          Bootstrap founds a cluster on one founding node's log, in phases that are
          each idempotent: a bootstrap-pending stamp naming the founding list, the
          founding configuration as entry 1, then the member stamp. Every founder
          runs it with the IDENTICAL list (D8, R2-24, R3-02, R9-04). It never runs
          inside NewNode. Entry 1 carries the generation 1 contract, cfg's
          InitialTiming completed and refused as NewNode completes and refuses it:
          the contract that rules every node is the one NewNode validates.
        in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: "*Config"
          - name: members
            type: "[]coreconsensus.MemberValue"
        name: Bootstrap
        out:
          - type: error
      - doc: TimingDefaults are D5's defaults for the RTT matrix of the three sites.
        name: TimingDefaults
        out:
          - type: coreconsensus.TimingContractSpec
      - doc: |-
          NewDataDir takes the directory lock FIRST, then reads, scans and repairs
          (D11). A second process fails at once with DATA_DIR_LOCKED.
        in:
          - name: dir
            type: string
        name: NewDataDir
        out:
          - type: DataDir
          - type: error
      - doc: NewDataDirWith is NewDataDir with options.
        in:
          - name: dir
            type: string
          - name: opts
            type: DataDirOptions
        name: NewDataDirWith
        out:
          - type: DataDir
          - type: error
      - doc: LeaderHint reads the known leader from a NOT_LEADER's field (R7-10).
        in:
          - name: err
            type: error
        name: LeaderHint
        out:
          - type: coreconsensus.NodeID
          - type: bool
      - doc: TokenOf reads the committed token an error carries (R7-10).
        in:
          - name: err
            type: error
        name: TokenOf
        out:
          - type: coreconsensus.TokenValue
          - type: bool
      - doc: |-
          JoinRefusalReason reads the reason a refused JOIN carried back to the
          joiner: what the member's JoinAuthorizer chose to say, or the engine's
          rule. false when the refusal carried none.
        in:
          - name: err
            type: error
        name: JoinRefusalReason
        out:
          - type: string
          - type: bool
      - doc: |-
          InitLog prepares a joining log purely offline: a random NodeID, a joining
          stamp, and the pair returned. It is idempotent: a log already joining for
          that cluster and slot returns its pair (D8, R3-02, R8-10).
        in:
          - name: log
            type: coreconsensus.LogStore
          - name: cluster
            type: coreconsensus.ClusterID
          - name: slot
            type: string
        name: InitLog
        out:
          - type: coreconsensus.NodeID
          - type: coreconsensus.Incarnation
          - type: error
      - doc: |-
          RedrawLog draws a new NodeID, only while the stamp is joining and the log
          is empty (R8-10).
        in:
          - name: log
            type: coreconsensus.LogStore
        name: RedrawLog
        out:
          - type: coreconsensus.NodeID
          - type: error
      - doc: NewMemoryLog returns an empty in-memory log.
        name: NewMemoryLog
        out:
          - type: "*MemoryLog"
      - doc: NewMemorySnapshots returns an empty store.
        name: NewMemorySnapshots
        out:
          - type: "*MemorySnapshots"
      - doc: NewMemoryNetwork returns an empty network.
        name: NewMemoryNetwork
        out:
          - type: "*MemoryNetwork"
      - doc: |-
          NewMemoryTransport returns the end of the network n that node id sends and
          receives through: created on the first call for that id, the same one on
          every later call, so a node restarted on the network keeps its links.
        in:
          - name: "n"
            type: "*MemoryNetwork"
          - name: id
            type: coreconsensus.NodeID
        name: NewMemoryTransport
        out:
          - type: "*MemoryTransport"
      - doc: MemorySPKI returns the key the memory transport authenticates id with.
        in:
          - name: id
            type: coreconsensus.NodeID
        name: MemorySPKI
        out:
          - type: "[32]byte"
      - doc: |-
          NewNode opens a node over what an offline tool founded or initialised. It
          never bootstraps (D8). The start sequence is fixed (D14): the stamp, the
          latest snapshot whose checksums pass, the log to its end, then serve.
        in:
          - name: cfg
            type: Config
        name: NewNode
        out:
          - type: "*Node"
          - type: error
      - doc: |-
          Init prepares a joining node purely offline: a random NodeID, a joining
          stamp, and the pair the operator or the JOIN gives to AddLearner. It is
          idempotent (R3-02, R7-41, R8-10).
        in:
          - name: d
            type: DataDir
          - name: cluster
            type: coreconsensus.ClusterID
          - name: slot
            type: string
        name: Init
        out:
          - type: coreconsensus.NodeID
          - type: coreconsensus.Incarnation
          - type: error
      - doc: |-
          Redraw draws a new id, only while the stamp is joining and the log empty,
          after a JOIN_REFUSED for a reused or retired id (R8-10).
        in:
          - name: d
            type: DataDir
        name: Redraw
        out:
          - type: coreconsensus.NodeID
          - type: error
      - doc: Inspect reads a data directory without changing it.
        in:
          - name: d
            type: DataDir
        name: Inspect
        out:
          - type: ReportValue
          - type: error
      - doc: |-
          ClearQuarantine clears a quarantined, or stopped, directory through one of
          the two exits. There is no third exit that keeps the damaged node voting.
        in:
          - name: d
            type: DataDir
          - name: exit
            type: QuarantineExit
          - name: op
            type: coreconsensus.Operator
        name: ClearQuarantine
        out:
          - type: error
      - doc: ReceiptMessage returns the bytes a witness signs to attest a fenced voter.
        in:
          - name: old
          - name: next
            type: coreconsensus.ClusterID
          - name: voter
            type: coreconsensus.NodeID
        name: ReceiptMessage
        out:
          - type: "[]byte"
      - doc: |-
          Recover starts a NEW history from this node's log — run it on the
          survivor whose report from Inspect holds the highest (LastTerm, Last):
          every entry up to its
          persisted commit, then the contiguous entries past it whose body and chain
          checksums verify and whose term does not decrease, cut at the first that
          fails, so no write the old cluster acknowledged is lost;
          a new cluster id that records its predecessor and the last index it kept;
          and a forced configuration. The audit file records how many entries past
          the persisted commit were adopted. Every old voter but this node must be
          attested fenced by every witness, whatever the new members name, and no
          other member may carry the ID of an old or retired member, or of another
          member; without witness keys it fails closed.
          A stop marker, STOP-RECOVER, is durable before the forced entry and
          removed once the new stamp is: a Recover interrupted between the two
          refuses a start, and is completed by running Recover again to the same
          new cluster, which resumes from the index the first one kept; one to
          another cluster is refused. A silence condition TruncateAndStaySilent
          left is removed before the marker: the new history is closed to the
          terms it guarded, and a silent node never campaigns. An install a crash
          interrupted after its snapshot was published is finished first, before
          the marker: the new history keeps that snapshot's index, and the forced
          entry follows it.
        in:
          - name: d
            type: DataDir
          - name: newCluster
            type: coreconsensus.ClusterID
          - name: members
            type: "[]coreconsensus.MemberValue"
          - name: opt
            type: "*RecoverOptions"
        name: Recover
        out:
          - type: error
      - doc: |-
          RestoreSnapshot starts a new history from a saved snapshot on an empty,
          joining directory, without a Node (R3-15).
        in:
          - name: d
            type: DataDir
          - name: r
            type: io.Reader
          - name: newCluster
            type: coreconsensus.ClusterID
          - name: members
            type: "[]coreconsensus.MemberValue"
          - name: opt
            type: "*RestoreOptions"
        name: RestoreSnapshot
        out:
          - type: coreconsensus.SnapshotMetaValue
          - type: error
      - doc: |-
          OpenSnapshot reads a saved snapshot's encoded stream, as SaveSnapshot
          wrote it, without a node: the reader returns the decoded stream, checks
          each chunk as it decodes it, bounds the total by opt.MaxDecoded, and
          answers SNAPSHOT_CORRUPT instead of io.EOF when the sizes or the SHA-256
          differ from opt.Expected's. opt.Codec is, when nil, the codec
          opt.Expected names, flate when it names none.
        in:
          - name: r
            type: io.Reader
          - name: opt
            type: "*RestoreOptions"
        name: OpenSnapshot
        out:
          - type: io.Reader
          - type: error
      - doc: |-
          ImportObserved starts a new history on an empty, joining directory from
          a saved snapshot and the committed tail an observer read after it: the
          tail is checked against the snapshot (consecutive indexes from its
          position, terms that never decrease, each payload's BodySum and the
          ChainSum chained from the snapshot's ChainTip), replayed through
          p.Machine from the snapshot, and the state it reaches is restored as
          RestoreSnapshot does, its last entry the index the new history kept. An
          empty tail is RestoreSnapshot itself. opt.Expected is the snapshot's
          metadata.

          A tail that raises the cluster version, changes the timing contract or
          the no-space alarm is refused: the restored metadata could not carry it;
          import from a snapshot cut after it. Membership entries are checked and
          passed over: the new history has its own members.
        in:
          - name: d
            type: DataDir
          - name: p
            type: "*ImportParams"
          - name: newCluster
            type: coreconsensus.ClusterID
          - name: members
            type: "[]coreconsensus.MemberValue"
          - name: opt
            type: "*RestoreOptions"
        name: ImportObserved
        out:
          - type: coreconsensus.SnapshotMetaValue
          - type: error
      - doc: |-
          ProposeAs types the Apply result. A result of another dynamic type is
          RESULT_TYPE_MISMATCH carrying the committed token: the entry IS committed.
          A nil result is the zero R.
        in:
          - name: ctx
            type: context.Context
          - name: r
            type: coreconsensus.Replicated
          - name: data
            type: "[]byte"
        name: ProposeAs
        out:
          - type: coreconsensus.TokenValue
          - type: R
          - type: error
        typeParams:
          - constraint: any
            name: R
      - doc: |-
          NewPEMIdentity reads the files once and returns the identity; Roots is
          the CA pool to pass as TransportConfig.Roots.
        in:
          - name: certFile
          - name: keyFile
          - name: caFile
            type: string
        name: NewPEMIdentity
        out:
          - type: "*PEMIdentity"
          - type: error
      - doc: |-
          NewTCPTransportFromPEM builds the shipped transport from PEM files, over
          the reloadable identity, its roots included.

          cfg is read, never written: the identity and the defaults go into a copy.
        in:
          - name: certFile
          - name: keyFile
          - name: caFile
            type: string
          - name: cfgIn
            type: "*TransportConfig"
        name: NewTCPTransportFromPEM
        out:
          - type: "*TCPTransport"
          - type: error
      - doc: Latest opens the newest complete snapshot of a store (R7-07).
        in:
          - name: s
            type: coreconsensus.SnapshotStore
        name: Latest
        out:
          - type: coreconsensus.SnapshotHandle
          - type: error
      - doc: SAN returns the canonical URI SAN of a node certificate.
        in:
          - name: cluster
            type: coreconsensus.ClusterID
          - name: slot
            type: string
        name: SAN
        out:
          - type: "*url.URL"
      - doc: |-
          SPKIOf returns the pin of a certificate: the SHA-256 of its
          SubjectPublicKeyInfo.
        in:
          - name: c
            type: "*x509.Certificate"
        name: SPKIOf
        out:
          - type: "[32]byte"
      - doc: |-
          NewTCPTransport validates the configuration, reads the cluster and slot
          from the certificate, and listens (D4, R3-24). It launches the background
          accept goroutine, which Close stops with every connection goroutine. cfg
          is read, never written: the defaults are applied to a copy.
        in:
          - name: cfg
            type: "*TransportConfig"
        name: NewTCPTransport
        out:
          - type: "*TCPTransport"
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreconsensus: github.com/kitsunium/sdk/internal/core/app/consensus
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
      coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
      ed25519: crypto/ed25519
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      tls: crypto/tls
      url: net/url
      x509: crypto/x509
    path: github.com/kitsunium/sdk/internal/service/app/consensus
    types:
      - doc: ReadMode selects how Barrier confirms leadership (D9).
        name: ReadMode
        underlying: uint8
      - doc: Durability says where the state machine's state lives (D3).
        name: Durability
        underlying: uint8
      - doc: |-
          Config builds a Node. Every bound has a default and a validation (D14): a
          zero bound is clamped to its default, and a combination that contradicts
          itself is refused with CONSENSUS_MISCONFIGURED.
        methods:
          - doc: |-
              MemoryBudget is the node's memory budget with two peers, the sum of its
              bounds (D14).
            in:
              - name: peers
                type: int
            name: MemoryBudget
            out:
              - type: int64
            recv: pointer
        name: Config
        struct:
          fields:
            - doc: Cluster is the cluster the node belongs to; it must match the stamp.
              name: Cluster
              type: coreconsensus.ClusterID
            - doc: Group is the consensus group, 1 in v1; 0 is clamped to 1.
              name: Group
              type: coreconsensus.GroupID
            - doc: ID is the node; 0 takes the stamp's, any other value must match it.
              name: ID
              type: coreconsensus.NodeID
            - doc: Machine is the replicated program.
              name: Machine
              type: coreconsensus.StateMachine
            - doc: Durability must agree with Machine's siblings.
              name: Durability
              type: Durability
            - doc: |-
                Log, Snapshots and Transport are the node's ports; the caller owns
                them and closes them after the node.
              name: Log
              type: coreconsensus.LogStore
            - name: Snapshots
              type: coreconsensus.SnapshotStore
            - name: Transport
              type: coreconsensus.Transport
            - doc: Clock drives every timer; nil is clock.System.
              name: Clock
              type: clock.Timed
            - doc: |-
                InitialTiming is proposed at Bootstrap only; the committed contract
                rules.
              name: InitialTiming
              type: coreconsensus.TimingContractSpec
            - name: MaxBatchBytes
            - name: MaxInflight
            - name: MaxInflightBytes
            - name: MaxEntryBytes
              type: int
            - name: MaxPendingBytes
            - name: MaxApplyLagBytes
            - name: RecentEntriesBytes
              type: int64
            - name: SnapshotEvery
            - name: SnapshotTrailing
            - name: PromoteLag
              type: uint64
            - name: SnapshotEveryBytes
            - name: MaxSnapshotBytes
            - name: MaxLogBytes
              type: int64
            - name: LogReserveBytes
              type: int64
            - doc: SnapshotCodec compresses snapshot chunks; nil is flate.
              name: SnapshotCodec
              type: coretransform.BoundedDecompressor
            - doc: SnapshotPausesApply says the state machine cannot cut cheaply.
              name: SnapshotPausesApply
              type: bool
            - doc: MinVoters is the floor a Remove may not cross.
              name: MinVoters
              type: int
            - doc: JoinAuthorizer decides a JOIN; without it every JOIN is refused.
              name: JoinAuthorizer
              type: coreconsensus.JoinAuthorizer
            - doc: HardCloseTimeout bounds HardClose.
              name: HardCloseTimeout
              type: time.Duration
            - doc: Reads selects the read mode.
              name: Reads
              type: ReadMode
            - doc: |-
                PreferredLeaders are the nodes a leader transfers to after an
                election when it is not one of them.
              name: PreferredLeaders
              type: "[]coreconsensus.NodeID"
            - doc: Seed draws the election timeouts; 0 draws one.
              name: Seed
              type: uint64
            - doc: |-
                Meter, Tracer and Logger receive D13's metrics, one span per Propose
                and the role, membership, snapshot and truncation events; nil turns
                each off. None of them changes a decision.
              name: Meter
              type: coremetrics.Meter
            - name: Tracer
              type: coretrace.Tracer
            - name: Logger
              type: corelogger.Logger
      - doc: |-
          DataDirOptions tunes NewDataDirWith: the size of a log segment and the
          boot-scoped directory of the second STORAGE_FAILED marker.
        name: DataDirOptions
        struct:
          fields:
            - doc: SegmentBytes is the fixed size of a log segment; 0 is 64 MiB.
              name: SegmentBytes
              type: int64
            - doc: |-
                RuntimeDir is the boot-scoped directory of the second STORAGE_FAILED
                marker (R9-05); empty is /run/kitsunium-consensus on Linux, and
                kitsunium-consensus in the temporary directory elsewhere. It must
                outlive the process within the boot and be gone at the next one: a
                host tmpfs, or systemd's RuntimeDirectory= with
                RuntimeDirectoryPreserve=yes. The process must be able to create it
                and write in it: NewDataDirWith refuses CONSENSUS_MISCONFIGURED
                otherwise, naming the path.
              name: RuntimeDir
              type: string
      - doc: |-
          DataDir is the shipped layout: a lock, a stamp, the segmented log, the
          snapshots and the markers. A DataDir value wraps a pointer, so copies
          share one lock and one Close (R4-29).
        methods:
          - doc: Dir returns the directory.
            name: Dir
            out:
              - type: string
            recv: value
          - doc: Log returns the directory's LogStore.
            name: Log
            out:
              - type: coreconsensus.LogStore
            recv: value
          - doc: Snapshots returns the directory's SnapshotStore.
            name: Snapshots
            out:
              - type: coreconsensus.SnapshotStore
            recv: value
          - doc: |-
              Close releases the lock; idempotent, and refused while a Node built on it
              is open (R3-18).
            name: Close
            out:
              - type: error
            recv: value
        name: DataDir
        struct:
          unexported: true
      - doc: |-
          PeerHealthValue is the leader's view of one peer (D13), one line of
          HealthValue.Peers. It is taken on the event loop and stale at the next
          turn.
        name: PeerHealthValue
        struct:
          fields:
            - doc: ID is the peer.
              name: ID
              type: coreconsensus.NodeID
            - doc: |-
                Flags are the peer's yes/no facts: PeerVoter, PeerUnreachable,
                PeerSnapshot.
              name: Flags
              type: PeerFlags
            - doc: Match is the highest index the peer holds durably, as acknowledged.
              name: Match
              type: uint64
            - doc: Lag is how far Match is behind the leader's last index.
              name: Lag
              type: uint64
            - doc: Inflight counts the appends in flight to it.
              name: Inflight
              type: int
            - doc: |-
                LastContact is how long ago it last answered; negative when it never
                answered in this term.
              name: LastContact
              type: time.Duration
      - doc: |-
          PeerFlags are a peer's yes/no facts in a health verdict, one bit each,
          read with Has.
        methods:
          - doc: Has reports whether every fact of x is set.
            in:
              - name: x
                type: PeerFlags
            name: Has
            out:
              - type: bool
            recv: value
        name: PeerFlags
        underlying: uint8
      - doc: HealthFlags are a verdict's yes/no answers, one bit each, read with Has.
        methods:
          - doc: Has reports whether every answer of x is set.
            in:
              - name: x
                type: HealthFlags
            name: Has
            out:
              - type: bool
            recv: value
        name: HealthFlags
        underlying: uint8
      - doc: |-
          HealthValue is a node's verdict for an orchestrator's probe (D13).
          HealthReady in Flags is the readiness answer; the other fields say why, and
          Peers is filled only on the leader.
        name: HealthValue
        struct:
          fields:
            - doc: Status is the node's view after its last turn.
              name: Status
              type: coreconsensus.StatusValue
            - doc: |-
                Flags are the verdict's yes/no answers: HealthReady, HealthHasLeader,
                HealthQuorumReachable, HealthStopped, HealthSnapshotNearLimit.
              name: Flags
              type: HealthFlags
            - doc: |-
                FailureTolerance is how many voters can fail now with a majority
                left. Only the leader knows it: -1 elsewhere.
              name: FailureTolerance
              type: int
            - doc: ApplyLagEntries is commit minus applied.
              name: ApplyLagEntries
              type: uint64
            - doc: Peers is the leader's view of every peer, nil elsewhere.
              name: Peers
              type: "[]PeerHealthValue"
            - doc: |-
                ChainRefusals counts identical chain refusals of this follower at
                ChainRefusalIndex from ChainRefusalLeader; the node reports itself
                unready while it refuses (D4, R6-05).
              name: ChainRefusals
              type: int
            - name: ChainRefusalIndex
              type: uint64
            - name: ChainRefusalLeader
              type: coreconsensus.NodeID
            - doc: StopReason says why the node stopped itself.
              name: StopReason
              type: coreconsensus.StopReasonValue
            - doc: |-
                DroppedFrames counts frames whose From differed from the
                authenticated peer (R7-05).
              name: DroppedFrames
              type: int64
            - doc: |-
                LongTurns counts the loop turns longer than the drift budget, each of
                which dropped the lease (D9, R7-20).
              name: LongTurns
              type: int64
            - doc: JoinsRateLimited counts JOINs refused by the one-per-slot rate.
              name: JoinsRateLimited
              type: int64
            - doc: |-
                SnapshotBytes is the size of the newest snapshot this node holds,
                the larger of its encoded and decoded sizes; 0 with none.
              name: SnapshotBytes
              type: int64
            - doc: |-
                SnapshotLimit is the size a cut is held to now: this node's
                MaxSnapshotBytes, or the smallest a member announces when lower
                (R2-30).
              name: SnapshotLimit
              type: int64
      - doc: |-
          MemoryLog is the in-memory LogStore double (D2): every port contract
          except durability, which it has none of. Sync can be made to fail, so a
          test drives STORAGE_FAILED.
        methods:
          - doc: Entries implements LogReader.
            in:
              - name: lo
              - name: hi
                type: uint64
              - name: maxBytes
                type: int
              - name: dst
                type: "[]coreconsensus.EntryValue"
            name: Entries
            out:
              - type: "[]coreconsensus.EntryValue"
              - type: error
            recv: pointer
          - doc: Term implements LogReader.
            in:
              - name: index
                type: uint64
            name: Term
            out:
              - type: uint64
              - type: error
            recv: pointer
          - doc: Bounds implements LogReader.
            name: Bounds
            out:
              - name: first
              - name: last
                type: uint64
            recv: pointer
          - doc: Append implements LogStore.
            in:
              - name: entries
                type: "[]coreconsensus.EntryValue"
              - name: hs
                type: "*coreconsensus.HardState"
            name: Append
            out:
              - type: error
            recv: pointer
          - doc: Sync implements LogStore.
            name: Sync
            out:
              - type: error
            recv: pointer
          - doc: FailSync makes every later Sync return err.
            in:
              - name: err
                type: error
            name: FailSync
            recv: pointer
          - doc: TruncateSuffix implements LogStore.
            in:
              - name: from
                type: uint64
            name: TruncateSuffix
            out:
              - type: error
            recv: pointer
          - doc: |-
              CompactPrefix implements LogStore; compacting past the end leaves an
              empty log at (through+1, through).
            in:
              - name: through
                type: uint64
            name: CompactPrefix
            out:
              - type: error
            recv: pointer
          - doc: HardState implements LogStore.
            name: HardState
            out:
              - type: coreconsensus.HardState
              - type: error
            recv: pointer
          - doc: Stamp implements LogStore.
            name: Stamp
            out:
              - type: coreconsensus.StampValue
              - type: error
            recv: pointer
          - doc: WriteStamp implements LogStore.
            in:
              - name: s
                type: coreconsensus.StampValue
            name: WriteStamp
            out:
              - type: error
            recv: pointer
          - doc: Close implements LogStore.
            name: Close
            out:
              - type: error
            recv: pointer
        name: MemoryLog
        struct:
          unexported: true
      - doc: |-
          MemorySnapshots is the in-memory SnapshotStore double. It keeps the
          shipped store's contract — a resumable spool, publication at Commit, a
          Remove refused while a handle is open — and none of its durability.
        methods:
          - doc: |-
              Create implements SnapshotStore: an existing spool resumes from its last
              whole chunk.
            in:
              - name: id
                type: string
              - name: meta
                type: coreconsensus.SnapshotMetaValue
            name: Create
            out:
              - type: coreconsensus.SnapshotSink
              - type: int64
              - type: error
            recv: pointer
          - doc: List implements SnapshotStore.
            name: List
            out:
              - type: "[]coreconsensus.SnapshotMetaValue"
              - type: error
            recv: pointer
          - doc: Open implements SnapshotStore.
            in:
              - name: id
                type: string
            name: Open
            out:
              - type: coreconsensus.SnapshotHandle
              - type: error
            recv: pointer
          - doc: Remove implements SnapshotStore; refused while a handle is open.
            in:
              - name: id
                type: string
            name: Remove
            out:
              - type: error
            recv: pointer
        name: MemorySnapshots
        struct:
          unexported: true
      - doc: |-
          MemoryNetwork connects in-memory transports, the double of D2: frames are
          copied, delivered on per-lane queues that drop when full, and links can be
          cut in either direction.
        methods:
          - doc: Cut cuts, or restores, the link from a to b.
            in:
              - name: a
              - name: b
                type: coreconsensus.NodeID
              - name: cut
                type: bool
            name: Cut
            recv: pointer
          - doc: Isolate cuts, or restores, every link of id in both directions.
            in:
              - name: id
                type: coreconsensus.NodeID
              - name: cut
                type: bool
            name: Isolate
            recv: pointer
        name: MemoryNetwork
        struct:
          unexported: true
      - doc: |-
          MemoryTransport is one node's end of a MemoryNetwork, the in-memory
          double of D2. NewMemoryTransport returns it; Close stops its delivery
          until the next Bind.
        methods:
          - doc: |-
              Send implements Transport: it never blocks and drops when the queue is
              full.
            in:
              - name: to
                type: coreconsensus.NodeID
              - name: frame
                type: "[]byte"
            name: Send
            recv: pointer
          - doc: |-
              Stream implements Transport: offer, accept, then the stream from the
              accepted offset.
            in:
              - name: ctx
                type: context.Context
              - name: to
                type: coreconsensus.NodeID
              - name: offer
                type: coreconsensus.InstallOfferValue
              - name: open
                type: func(int64) (io.ReadCloser, error)
            name: Stream
            out:
              - type: error
            recv: pointer
          - doc: |-
              Bind implements Transport. The first Bind after construction or Close
              launches the background delivery goroutine of its own run, which ends
              when Close stops that run; a later Bind launches a new one.
            in:
              - name: group
                type: coreconsensus.GroupID
              - name: deliver
                type: func(coreconsensus.AuthenticatedPeerValue, []byte)
              - name: offer
                type: func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue
              - name: install
                type: func(coreconsensus.InstallParams) error
              - name: join
                type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code)
            name: Bind
            out:
              - type: error
            recv: pointer
          - doc: BindJoinReason implements JoinReasonBinder.
            in:
              - name: _
                type: coreconsensus.GroupID
              - name: join
                type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
            name: BindJoinReason
            recv: pointer
          - doc: |-
              SetMembership implements Transport: the admitted members are the union
              over the groups, as the TCP transport computes them.
            in:
              - name: group
                type: coreconsensus.GroupID
              - name: admitted
                type: "[]coreconsensus.MemberValue"
            name: SetMembership
            recv: pointer
          - doc: Join implements Joiner over the network, as the TCP transport does.
            in:
              - name: ctx
                type: context.Context
              - name: cfg
                type: coreconsensus.JoinConfig
            name: Join
            out:
              - type: coreconsensus.PositionValue
              - type: error
            recv: pointer
          - doc: |-
              Close stops delivery; a later Bind starts it again, as a restarted node
              does.
            name: Close
            out:
              - type: error
            recv: pointer
        name: MemoryTransport
        struct:
          unexported: true
      - doc: |-
          Node is one member of a consensus group: the event loop that owns the step
          function, its storage actor, its apply goroutine and its snapshot
          goroutines (D5b). A Node never closes what it was handed.
        methods:
          - doc: Health returns the node's verdict, computed on the event loop.
            name: Health
            out:
              - type: HealthValue
            recv: pointer
          - doc: StopReason returns why the node stopped itself, if it did.
            name: StopReason
            out:
              - type: coreconsensus.StopReasonValue
              - type: bool
            recv: pointer
          - doc: |-
              Close transfers leadership first, then stops every goroutine after the
              storage actor's final sync (R2-38). It is idempotent.
            in:
              - name: ctx
                type: context.Context
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: |-
              HardClose stops now: no transfer, no final sync, bounded by
              HardCloseTimeout (R7-11). It launches one goroutine that waits for the
              node's goroutines; when the timeout fires first, that waiter is abandoned
              with them and the data directory stays held until the process exits.
            name: HardClose
            out:
              - type: error
            recv: pointer
          - doc: Status returns the node's view after its last turn.
            name: Status
            out:
              - type: coreconsensus.StatusValue
            recv: pointer
          - doc: |-
              Watch implements LeadershipWatcher. Each call launches one goroutine that
              closes the returned channel and ends when ctx ends or the node's event
              loop stops.
            in:
              - name: ctx
                type: context.Context
            name: Watch
            out:
              - type: <-chan coreconsensus.StatusValue
            recv: pointer
          - doc: Membership returns the configuration the node last appended.
            name: Membership
            out:
              - type: coreconsensus.MembershipValue
            recv: pointer
          - doc: |-
              Propose replicates data and returns, once the entry is applied locally,
              its token and the value Apply returned. NOT_LEADER means certainly not
              appended; OUTCOME_UNKNOWN means it may still commit: read the state through
              Barrier before deciding, never retry blindly (D6, R1-04).
            in:
              - name: ctx
                type: context.Context
              - name: data
                type: "[]byte"
            name: Propose
            out:
              - type: coreconsensus.TokenValue
              - type: any
              - type: error
            recv: pointer
          - doc: |-
              Barrier returns once the local state machine reflects every write
              committed before the call (D9).
            in:
              - name: ctx
                type: context.Context
            name: Barrier
            out:
              - type: coreconsensus.TokenValue
              - type: error
            recv: pointer
          - doc: |-
              WaitApplied returns once the local node has applied t, the entry of t's
              term at t's index. A token of another lineage is LINEAGE_MISMATCH. A token
              whose index holds an entry of another term is ENTRY_SUPERSEDED, carrying
              the token of the entry applied there, or LINEAGE_MISMATCH when it is one of
              the predecessor's within the index Recover kept, as is a token of the
              predecessor's whose term this node can no longer read there.
            in:
              - name: ctx
                type: context.Context
              - name: t
                type: coreconsensus.TokenValue
            name: WaitApplied
            out:
              - type: error
            recv: pointer
          - doc: AddLearner adds a non-voting member that receives the log (D8).
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: m
                type: coreconsensus.MemberValue
            name: AddLearner
            out:
              - type: error
            recv: pointer
          - doc: Promote makes a caught-up learner a voter (D8).
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: id
                type: coreconsensus.NodeID
            name: Promote
            out:
              - type: error
            recv: pointer
          - doc: |-
              Remove removes a member and retires its id; removing the leader first
              transfers leadership (D8).
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: id
                type: coreconsensus.NodeID
            name: Remove
            out:
              - type: error
            recv: pointer
          - doc: UpdateAddress changes where a member listens.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: id
                type: coreconsensus.NodeID
              - name: addr
                type: string
            name: UpdateAddress
            out:
              - type: error
            recv: pointer
          - doc: |-
              DenyPin withdraws a member's SPKI pin (R9-18). The transport refuses the
              member once the change commits. It is refused MEMBERSHIP_INVALID for the
              leader itself, and while the voters that answer the leader, the target
              left out, are not a majority (R2-27).
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: id
                type: coreconsensus.NodeID
            name: DenyPin
            out:
              - type: error
            recv: pointer
          - doc: ProposeTimingContract proposes a new timing contract.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: pre
                type: coreconsensus.PreconditionSpec
              - name: c
                type: coreconsensus.TimingContractSpec
            name: ProposeTimingContract
            out:
              - type: error
            recv: pointer
          - doc: RaiseClusterVersion raises the protocol version every member must speak.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: pre
                type: coreconsensus.PreconditionSpec
              - name: v
                type: uint32
            name: RaiseClusterVersion
            out:
              - type: error
            recv: pointer
          - doc: ClearNoSpace clears the no-space alarm the precondition names.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: pre
                type: coreconsensus.PreconditionSpec
            name: ClearNoSpace
            out:
              - type: error
            recv: pointer
          - doc: |-
              TransferLeadership moves leadership to a voter (D8). It records the
              operator in an entry, then waits until the target leads or twice the
              maximum election timeout passes.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: to
                type: coreconsensus.NodeID
            name: TransferLeadership
            out:
              - type: error
            recv: pointer
          - doc: |-
              SaveSnapshot cuts a snapshot now and copies its encoded stream to w, on a
              goroutine of its own: once ctx is done it returns, the copy stops at its
              next read, and only a write to w already begun may end after the return;
              one that blocks keeps that goroutine, and the snapshot pinned, until w
              returns.
            in:
              - name: ctx
                type: context.Context
              - name: op
                type: coreconsensus.Operator
              - name: w
                type: io.Writer
            name: SaveSnapshot
            out:
              - type: coreconsensus.SnapshotMetaValue
              - type: error
            recv: pointer
          - doc: |-
              ReadCommitted returns the committed entries [from, to], to clamped to
              what this node's log store holds as committed (its own commit, or the
              last entry applied from it), never to the commit the event loop knows
              of alone, at most maxBytes of them but always one when any is due.
              from below the first entry the log keeps is COMPACTED: the reader
              starts again from a snapshot. It reads the log store concurrently
              with the writer, as every reader does, and never waits on the loop.
            in:
              - name: ctx
                type: context.Context
              - name: from
              - name: to
                type: uint64
              - name: maxBytes
                type: int
            name: ReadCommitted
            out:
              - type: "[]coreconsensus.EntryValue"
              - type: error
            recv: pointer
        name: Node
        struct:
          unexported: true
      - doc: |-
          ReportValue is what Inspect reads, read-only: the stamp, the hard state
          and bounds of the log, the complete snapshots, and the markers that would
          refuse a start.
        name: ReportValue
        struct:
          fields:
            - name: Stamp
              type: coreconsensus.StampValue
            - name: HardState
              type: coreconsensus.HardState
            - name: First
              type: uint64
            - doc: |-
                Last is the last index the directory holds: the log's, or the
                newest snapshot's when an install a crash interrupted published it
                past the log's end.
              name: Last
              type: uint64
            - doc: |-
                LastTerm is the term of the entry at Last, or of the snapshot that
                holds Last. With Last it is the key a Recover's survivor is chosen
                by: the highest (LastTerm, Last), compared in that order, never Last
                alone nor HardState.Term, the term of the last vote.
              name: LastTerm
              type: uint64
            - name: Snapshots
              type: "[]coreconsensus.SnapshotMetaValue"
            - name: Quarantine
              type: string
            - name: Markers
              type: "[]string"
      - doc: QuarantineExit is one of the two exits ClearQuarantine allows (R3-09).
        name: QuarantineExit
        underlying: uint8
      - doc: |-
          RecoverOptions are Recover's preconditions (R2-25, R3-02, R4-04, R9-08).
          Recover refuses, before it writes anything, an invalid operator, a
          confirmation that does not name the new cluster, no witness key, an old
          voter other than this node without a receipt from every witness, and
          another member under the ID of an old or retired member.
        name: RecoverOptions
        struct:
          fields:
            - doc: "Confirm must equal the new cluster id in hex: a typed confirmation."
              name: Confirm
              type: string
            - doc: Operator is recorded in the audit file.
              name: Operator
              type: coreconsensus.Operator
            - doc: Fenced attests every old voter but this node, whether the new members list it or not.
              name: Fenced
              type: "[]coreconsensus.FencedAttestationValue"
            - doc: "WitnessKeys verify the receipts: one per witness, each must sign."
              name: WitnessKeys
              type: "[]ed25519.PublicKey"
      - doc: |-
          RestoreOptions are RestoreSnapshot's preconditions (R3-15). Expected and
          both bounds are required; the stream is refused when its size or digest
          differs from Expected.
        name: RestoreOptions
        struct:
          fields:
            - doc: "Expected is the snapshot's metadata, from SaveSnapshot: non-zero."
              name: Expected
              type: coreconsensus.SnapshotMetaValue
            - doc: Confirm must equal the new cluster id in hex.
              name: Confirm
              type: string
            - doc: Operator is recorded in the audit file.
              name: Operator
              type: coreconsensus.Operator
            - doc: MaxEncoded and MaxDecoded bound what is read.
              name: MaxEncoded
            - doc: MaxEncoded and MaxDecoded bound what is read.
              name: MaxDecoded
              type: int64
            - doc: |-
                Codec decodes the chunks; nil is the codec Expected names, flate
                when it names none.
              name: Codec
              type: coretransform.BoundedDecompressor
      - doc: |-
          ImportParams are what ImportObserved rebuilds a state from: the
          snapshot an observer saved, the committed tail it read after it, and the
          state machine that replays the one over the other. Snapshot and Machine
          are required.
        name: ImportParams
        struct:
          fields:
            - doc: Snapshot is the saved snapshot's encoded stream, as SaveSnapshot wrote it.
              name: Snapshot
              type: io.Reader
            - doc: Tail is the committed entries read after the snapshot, in log order.
              name: Tail
              type: "[]coreconsensus.EntryValue"
            - doc: Machine is a fresh state machine; the snapshot is restored into it and the tail applied.
              name: Machine
              type: coreconsensus.StateMachine
      - doc: |-
          PEMIdentity is a node identity read from PEM files: the certificate (its
          chain may follow it), the key, and the consensus CA. It is the
          net/tlsid reloadable identity of ADR 0174 D1: GetCertificate rereads the
          files when they change, and keeps the old identity when the new one
          fails, does not match its key, or carries another key or SAN — a renewal
          reuses the key, so the members' pins hold (R8-07). A new CA file is added
          to the trusted roots, so a rollover trusts the union.
        methods:
          - doc: |-
              Roots returns the trusted CA pool the identity was read with, the union of
              every CA file seen so far, to pass as TransportConfig.Roots.
            name: Roots
            out:
              - type: "*x509.CertPool"
            recv: pointer
          - doc: |-
              GetCertificate returns the current certificate, reloading it in place when
              its files changed.
            name: GetCertificate
            out:
              - type: "*tls.Certificate"
              - type: error
            recv: pointer
          - doc: ReloadFailures counts the reloads refused so far.
            name: ReloadFailures
            out:
              - type: int
            recv: pointer
        name: PEMIdentity
        struct:
          fields:
            - name: CertFile
            - name: KeyFile
            - name: CAFile
              type: string
          unexported: true
      - doc: |-
          TransportConfig builds the shipped mTLS transport (D4, D14). A zero bound
          is clamped to its default; nil Roots, no certificate, a HandshakeTimeout
          above one second, a control frame bound not below the data bound, or a
          peer queue below the data bound is refused.
        name: TransportConfig
        struct:
          fields:
            - doc: |-
                Certificate is the node's certificate and key. It carries exactly one
                URI SAN, kitsunium-consensus://<cluster>/slot/<slot>, and both
                serverAuth and clientAuth; the transport takes its cluster and slot
                from it. GetCertificate, when set, is asked at every handshake instead,
                so a renewed certificate over the same key is picked up in place.
              name: Certificate
              type: "*tls.Certificate"
            - name: GetCertificate
              type: func() (*tls.Certificate, error)
            - doc: Roots is the consensus intermediate, trusted as RootCAs and ClientCAs.
              name: Roots
              type: "*x509.CertPool"
            - doc: ListenAddress is bound as given, e.g. a private interface (R2-37).
              name: ListenAddress
              type: string
            - doc: |-
                Seeds are addresses for the first contact; the committed membership's
                addresses rule afterwards.
              name: Seeds
              type: map[coreconsensus.NodeID]string
            - doc: |-
                MaxUnauthenticatedPerIP caps the connections an IPv4 address, or an
                IPv6 /64, may hold before their handshake completes; the addresses
                the admitted members' addresses resolve to get ReservedMemberSlots
                instead, so a flood never locks a member out (R2-22). It runs before
                any TLS byte is read.
              name: MaxUnauthenticatedPerIP
              type: int
            - name: ReservedMemberSlots
              type: int
            - name: MaxFrameBytes
              type: int
            - name: MaxControlFrameBytes
              type: int
            - name: HandshakeTimeout
              type: time.Duration
            - name: PeerQueueBytes
              type: int64
            - name: MaxConnectionAge
              type: time.Duration
            - name: WriteTimeout
              type: time.Duration
            - name: JoinTimeout
              type: time.Duration
      - doc: |-
          TCPTransport is the shipped transport: TLS 1.3 with mutual
          authentication, a pinned SPKI per member, three connections per peer and
          direction, length-prefixed frames bounded before allocation.
        methods:
          - doc: Addr returns the bound address.
            name: Addr
            out:
              - type: string
            recv: pointer
          - doc: Cluster returns the cluster the certificate names.
            name: Cluster
            out:
              - type: coreconsensus.ClusterID
            recv: pointer
          - doc: Slot returns the slot the certificate names.
            name: Slot
            out:
              - type: string
            recv: pointer
          - doc: |-
              Send implements Transport: it never blocks, and drops when the peer's
              queue is full (D4). The first frame to a peer and lane launches that
              lane's background sender goroutine, which ends when Close is called.
            in:
              - name: to
                type: coreconsensus.NodeID
              - name: frame
                type: "[]byte"
            name: Send
            recv: pointer
          - doc: Unreachable implements UnreachableReporter.
            in:
              - name: f
                type: func(coreconsensus.NodeID)
            name: Unreachable
            recv: pointer
          - doc: Bind implements Transport.
            in:
              - name: _
                type: coreconsensus.GroupID
              - name: deliver
                type: func(coreconsensus.AuthenticatedPeerValue, []byte)
              - name: offer
                type: func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue
              - name: install
                type: func(coreconsensus.InstallParams) error
              - name: join
                type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code)
            name: Bind
            out:
              - type: error
            recv: pointer
          - doc: |-
              SetMembership implements Transport: the admitted set is the union over
              the groups; a member that left has its connections cut and its
              handshakes refused from then on (D4).
            in:
              - name: group
                type: coreconsensus.GroupID
              - name: admitted
                type: "[]coreconsensus.MemberValue"
            name: SetMembership
            recv: pointer
          - doc: Close stops the transport and joins its goroutines.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: Stream implements Transport.
            in:
              - name: ctx
                type: context.Context
              - name: to
                type: coreconsensus.NodeID
              - name: offer
                type: coreconsensus.InstallOfferValue
              - name: open
                type: func(int64) (io.ReadCloser, error)
            name: Stream
            out:
              - type: error
            recv: pointer
          - doc: |-
              Join implements Joiner: the JOIN goes to each address in turn until one
              member answers JOIN_ACK with the position its AddLearner was appended at.
            in:
              - name: ctx
                type: context.Context
              - name: cfg
                type: coreconsensus.JoinConfig
            name: Join
            out:
              - type: coreconsensus.PositionValue
              - type: error
            recv: pointer
          - doc: |-
              BindJoinReason implements JoinReasonBinder: the JOIN callback that also
              says why it refused.
            in:
              - name: _
                type: coreconsensus.GroupID
              - name: join
                type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
            name: BindJoinReason
            recv: pointer
          - doc: |-
              RefusedBeforeHandshake counts the connections refused by the
              pre-handshake admission.
            name: RefusedBeforeHandshake
            out:
              - type: int64
            recv: pointer
          - doc: CertExpiry returns when the transport's own certificate expires.
            name: CertExpiry
            out:
              - type: time.Time
            recv: pointer
          - doc: |-
              PeerCertExpiry returns when each admitted peer's last-seen certificate
              expires.
            name: PeerCertExpiry
            out:
              - type: map[coreconsensus.NodeID]time.Time
            recv: pointer
          - doc: ReloadFailures counts the refused reloads of a PEM identity, 0 without one.
            name: ReloadFailures
            out:
              - type: int
            recv: pointer
        name: TCPTransport
        struct:
          unexported: true
  - constants:
      - blockDoc: The facts a PeerStatValue carries.
        doc: StatVoter is set for a voter, clear for a learner.
        name: StatVoter
        type: PeerStatFlags
        value: "1"
      - blockDoc: The facts a PeerStatValue carries.
        doc: |-
          StatHeard is set once the peer answered in this term; LastHeard is
          meaningful only then.
        name: StatHeard
        type: PeerStatFlags
        value: "2"
      - blockDoc: The facts a PeerStatValue carries.
        doc: StatProbing is set while the leader probes for the peer's match.
        name: StatProbing
        type: PeerStatFlags
        value: "4"
      - blockDoc: The facts a PeerStatValue carries.
        doc: StatSnapshot is set while a snapshot is being sent to the peer.
        name: StatSnapshot
        type: PeerStatFlags
        value: "8"
      - blockDoc: The facts a PeerStatValue carries.
        doc: |-
          StatProtocol3 is set while the peer's last message of the term
          announced protocol 3.
        name: StatProtocol3
        type: PeerStatFlags
        value: "16"
      - doc: |-
          ProtocolMax is the highest protocol version this engine speaks: a cluster
          version above it is refused, and stops a node that finds it committed.
          Version 2 adds the snapshot metadata's checksum, the admin payload's
          Origin and the log identity's AdoptedFrom, each written only once the
          committed cluster version is 2 (lot S3). Version 3 adds the retired keys
          of the configuration, written only once it is 3 (#648).
        name: ProtocolMax
        type: uint32
        value: "3"
      - doc: |-
          Protocol2 is the protocol version whose formats a node writes once the
          cluster version is raised to it.
        name: Protocol2
        type: uint32
        value: "2"
      - doc: |-
          Protocol3 is the protocol version from which a configuration keeps the
          key of every member removed, and of every pin denied, and refuses it to
          any new member (#648).
        name: Protocol3
        type: uint32
        value: "3"
    doc: |-
      Package raft is the consensus engine's step function (ADR 0152 D15): a
      value with no goroutine, no I/O and no clock. Every decision of the
      protocol is taken here — PreVote, elections and the election restriction,
      CheckQuorum, the vote refusals, the leader lease and ReadIndex, log
      replication and commit, leadership transfer, single-server membership
      changes through learners, the snapshot offer — and every effect leaves
      through [Raft.Ready] for a driver to perform.

      Instants come in with each input, taken by the driver from its injected
      clock, and are compared with Sub only, never rounded, so the lease keeps
      Go's monotonic reading (D9, R7-20). Randomness comes from a seed in
      [Config], so a run is a pure function of its inputs (D15).

      Durability is an input, never an assumption (D5b): a write the step
      function asks for is counted only once the driver reports it with
      [Raft.StorageDone], and the replies that depend on it leave in
      [ReadyValue.AfterSync], which the driver sends only once that write is durable.
    functions:
      - doc: NewRaft builds the step function over the loaded state.
        in:
          - name: cfg
            type: "*Config"
          - name: st
            type: "*StartState"
        name: NewRaft
        out:
          - type: "*Raft"
    imports:
      core: github.com/kitsunium/sdk/internal/core/app/consensus
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/service/app/consensus/raft
    types:
      - doc: |-
          PeerStatValue is the leader's view of one peer, for Health (D13). Flags
          say whether it votes, answered in this term, is probed, is being sent a
          snapshot or last announced protocol 3; LastHeard is meaningful only once
          StatHeard is set.
        name: PeerStatValue
        struct:
          fields:
            - name: ID
              type: core.NodeID
            - name: Flags
              type: PeerStatFlags
            - name: Match
              type: uint64
            - name: Next
              type: uint64
            - name: Inflight
              type: int
            - name: LastHeard
              type: time.Time
      - doc: |-
          PeerStatFlags are a peer's yes/no facts in the leader's view, one bit
          each, read with Has.
        methods:
          - doc: Has reports whether every fact of x is set.
            in:
              - name: x
                type: PeerStatFlags
            name: Has
            out:
              - type: bool
            recv: value
        name: PeerStatFlags
        underlying: uint8
      - doc: |-
          Config is what the step function needs from its driver. Every bound is
          already clamped and validated by the engine.
        name: Config
        struct:
          fields:
            - doc: ID is this node.
              name: ID
              type: core.NodeID
            - doc: Group is the consensus group.
              name: Group
              type: core.GroupID
            - doc: Log is the identity of the log, checked against an admin precondition.
              name: Log
              type: core.LogIdentityValue
            - doc: Seed draws the randomized election timeouts.
              name: Seed
              type: uint64
            - doc: Timing is the committed timing contract at start.
              name: Timing
              type: core.TimingContractSpec
            - doc: MaxInflight bounds the appends in flight per peer.
              name: MaxInflight
              type: int
            - doc: MaxInflightBytes bounds their bytes.
              name: MaxInflightBytes
              type: int
            - doc: MaxBatchBytes bounds one append.
              name: MaxBatchBytes
              type: int
            - doc: MinVoters is the floor a Remove may not cross.
              name: MinVoters
              type: int
            - doc: PromoteLag is how far behind the commit a learner may be promoted.
              name: PromoteLag
              type: uint64
            - doc: Lease turns on lease reads.
              name: Lease
              type: bool
            - doc: |-
                CanVote is false while the directory is joining or silent: such a
                node neither votes nor acknowledges.
              name: CanVote
              type: bool
            - doc: MaxChainRefusals is N of D4's "no silent loop".
              name: MaxChainRefusals
              type: int
            - doc: |-
                NoTable is set while the node holds no usable snapshot: it votes and
                stores the log but never campaigns, and asks for a snapshot (R7-18).
              name: NoTable
              type: bool
            - doc: |-
                SilentTerm and SilentIndex are the silence condition
                TruncateAndStaySilent persisted (R3-09, R4-03): while SilentIndex is
                not 0 the node grants no vote and acknowledges no append, until a
                leader of a term at least SilentTerm has rewritten its log past
                SilentIndex and committed an entry of its own term, in an append the
                node accepted. Under a leader of SilentTerm itself, the node must
                also hold that leader's commit (#636). An index the start's snapshot
                covers is raised past it.
              name: SilentTerm
            - doc: |-
                SilentTerm and SilentIndex are the silence condition
                TruncateAndStaySilent persisted (R3-09, R4-03): while SilentIndex is
                not 0 the node grants no vote and acknowledges no append, until a
                leader of a term at least SilentTerm has rewritten its log past
                SilentIndex and committed an entry of its own term, in an append the
                node accepted. Under a leader of SilentTerm itself, the node must
                also hold that leader's commit (#636). An index the start's snapshot
                covers is raised past it.
              name: SilentIndex
              type: uint64
            - doc: |-
                RecentEntriesBytes bounds the payloads held in memory; 0 holds them
                all. Older ones are fetched from the store when a peer needs them, and
                read back from it by the driver when apply reaches them.
              name: RecentEntriesBytes
              type: int64
            - doc: |-
                MaxApplyLagBytes bounds the payload bytes Ready hands apply past what
                the driver reports applied (SetApplyLag): one entry is handed when
                nothing is outstanding, whatever its size, and entries whose payloads
                were evicted are handed by index, for the driver to read from the
                store (D6, #664). 0 does not bound them.
              name: MaxApplyLagBytes
              type: int64
            - doc: |-
                MaxEntryBytes bounds a forwarded command's payload as the driver
                bounds a local one; 0 does not bound it.
              name: MaxEntryBytes
              type: int
            - doc: |-
                MaxForwardBytes bounds the payload bytes of forwarded commands this
                leader appended and has not committed yet; 0 does not bound them.
              name: MaxForwardBytes
              type: int64
          unexported: true
      - doc: |-
          StartState is the durable state the driver loaded from its store at
          boot. NewRaft rebuilds the step function from it alone, so a restart
          depends on nothing held in memory.
        name: StartState
        struct:
          fields:
            - doc: HardState is the last hard state on disk.
              name: HardState
              type: core.HardState
            - doc: Snapshot is the base the log continues, zero for none.
              name: Snapshot
              type: core.SnapshotMetaValue
            - doc: |-
                Entries are the durable entries after the snapshot. NewRaft keeps
                them as its log, with the room past them: the caller hands them over
                and no longer uses them.
              name: Entries
              type: "[]core.EntryValue"
            - doc: |-
                Evicted is the last index the driver loaded without its payload, 0
                when it loaded every one: each command after the snapshot through it
                carries none and is read back from the store when applied, every other
                entry keeps its own. Only a committed entry may be loaded so (#663).
              name: Evicted
              type: uint64
            - doc: |-
                Applied is where the state machine resumes, at least the snapshot.
                Above HardState.Commit, NewRaft takes it as committed while the log
                holds it (#707): the caller passes such an index only when the log
                holds there the entry the machine applied, or does not hold it.
              name: Applied
              type: uint64
            - doc: "Now is the start instant: the restart vote-refusal window opens here."
              name: Now
              type: time.Time
      - doc: |-
          ReadState answers a read: once applied reaches Index, the read is
          linearizable. A non-zero Code refuses it.
        name: ReadState
        struct:
          fields:
            - name: Context
              type: uint64
            - name: Index
              type: uint64
            - name: Code
              type: errs.Code
      - doc: |-
          TransferResult ends a leadership transfer this node started. A zero Code
          means TimeoutNow was sent to To; TRANSFER_FAILED means it was not, before
          the deadline or before leadership was lost.
        name: TransferResult
        struct:
          fields:
            - name: To
              type: core.NodeID
            - name: Code
              type: errs.Code
      - doc: |-
          ReadyValue is what the driver must do after a turn: write, then send.
          Nothing in AfterSync leaves before the write numbered Seq is durable
          (D5b).
        methods:
          - doc: NeedsWrite reports whether the Ready asks the storage actor for anything.
            name: NeedsWrite
            out:
              - type: bool
            recv: pointer
        name: ReadyValue
        struct:
          fields:
            - doc: Seq names the write when there is one; completions carry it.
              name: Seq
              type: uint64
            - doc: |-
                HardState is set when the term or the vote changed: it is durable
                before anything in AfterSync leaves.
              name: HardState
              type: "*core.HardState"
            - doc: Commit is the new commit index, written lazily, 0 when unchanged.
              name: Commit
              type: uint64
            - doc: TruncateFrom removes every entry from that index on, before Entries.
              name: TruncateFrom
              type: uint64
            - doc: Entries are appended after the truncation.
              name: Entries
              type: "[]core.EntryValue"
            - doc: Messages leave at once.
              name: Messages
              type: "[]core.MessageValue"
            - doc: AfterSync leave once this write is durable.
              name: AfterSync
              type: "[]core.MessageValue"
            - doc: Apply are committed, locally durable entries, in order.
              name: Apply
              type: "[]core.EntryValue"
            - doc: |-
                ApplyRead names committed, locally durable entries the step function
                holds without their payloads: the driver reads them from its store
                and applies them, in order, before Apply. Its Lo is 0 when there are
                none (D6, #664).
              name: ApplyRead
              type: ReadBackSpec
            - doc: SendSnapshot names the peers that need a snapshot.
              name: SendSnapshot
              type: "[]core.NodeID"
            - doc: ReadStates answer reads.
              name: ReadStates
              type: "[]ReadState"
            - doc: Forwarded are answers to this node's forwarded proposals.
              name: Forwarded
              type: "[]core.MessageValue"
            - doc: Transfers end transfers.
              name: Transfers
              type: "[]TransferResult"
            - doc: |-
                Compact drops the log's prefix through that index, which a durable
                snapshot covers.
              name: Compact
              type: uint64
            - doc: |-
                SilenceEnded is set once the silence condition held: the driver
                removes it durably.
              name: SilenceEnded
              type: bool
            - doc: |-
                LeaderUnheard is set when this node, which may not campaign (a
                learner, a silent voter, one with no table), heard no leader for
                askElectionTimeouts maximum election timeouts and asked its members
                for the leader's record: the driver of a joining node sends its JOIN
                again (#632, #639, #718).
              name: LeaderUnheard
              type: bool
            - doc: |-
                Fetch asks the driver to read entries the step function no longer
                holds, off the event loop, and hand them back with Fetched.
              name: Fetch
              type: "[]FetchSpec"
            - doc: Membership is set when the admitted set changed.
              name: Membership
              type: "[]core.MemberValue"
            - doc: |-
                MembershipAt is the index Membership is as of: the latest
                configuration's, or the commit a member's record was read at while
                that record gives the leader's address (#724). A joining node's
                transport ranks it against its JOIN answer's position (#742).
              name: MembershipAt
              type: uint64
            - doc: |-
                LeaderHint is the leader a member vouched for in a MsgLeaderRecord,
                admitted provisionally in Membership, for the driver to log (#542).
              name: LeaderHint
              type: core.MemberValue
            - doc: |-
                LeaderAddress is the leader this node follows and could not reach,
                listed in its configuration under the key a member's MsgLeaderRecord
                names: dialled at the address that record gives, the committed one,
                in Membership until this node's configuration catches up, for the
                driver to log (#724).
              name: LeaderAddress
              type: core.MemberValue
            - doc: |-
                Unsupported names an entry whose kind this version does not know:
                the driver stops the node with VERSION_UNSUPPORTED.
              name: Unsupported
              type: UnsupportedEntryValue
            - doc: |-
                ChainRefusedBy names, once per refusal, the leader whose append this
                follower refused for a broken chain, for D13's
                consensus_chain_refusals_total.
              name: ChainRefusedBy
              type: "[]core.NodeID"
      - doc: |-
          UnsupportedEntryValue is an entry a leader sent that this version cannot
          apply; Index is 0 when there is none.
        name: UnsupportedEntryValue
        struct:
          fields:
            - name: Index
              type: uint64
            - name: Kind
              type: core.EntryKind
      - doc: |-
          ReadBackSpec names the committed entries [Lo, Hi) the driver reads back
          from its store to apply them: the step function holds them without
          their payloads (ReadyValue.ApplyRead).
        name: ReadBackSpec
        struct:
          fields:
            - name: Lo
            - name: Hi
              type: uint64
      - doc: |-
          FetchSpec asks for the entries [Lo, Hi) of the store for a peer, whose
          payloads the step function evicted. The driver reads them off the event
          loop and hands them back with Fetched.
        name: FetchSpec
        struct:
          fields:
            - name: To
              type: core.NodeID
            - name: Lo
            - name: Hi
              type: uint64
      - doc: |-
          Raft is the step function. It is not safe for concurrent use: one event
          loop owns it.
        methods:
          - doc: Debug renders the step function's state for a failing test's log.
            name: Debug
            out:
              - type: string
            recv: pointer
          - doc: |-
              Fetched hands back entries read for a peer. Anything stale — another
              role, another next, a term the log no longer has at that index — is
              dropped, and a compacted read moves the peer to the snapshot path.
            in:
              - name: to
                type: core.NodeID
              - name: lo
                type: uint64
              - name: ents
                type: "[]core.EntryValue"
              - name: compacted
                type: bool
            name: Fetched
            recv: pointer
          - doc: |-
              Propose appends entries at the leader. Kind, Version, BodySum and Data are
              the proposer's; positions and chain values are assigned here. A refusal
              appends nothing.
            in:
              - name: now
                type: time.Time
              - name: es
                type: "[]core.EntryValue"
            name: Propose
            out:
              - type: "[]core.PositionValue"
              - type: errs.Code
            recv: pointer
          - doc: |-
              ReadIndex asks for a linearizable read point under ctx. noLease forces a
              confirmation round.
            in:
              - name: now
                type: time.Time
              - name: ctx
                type: uint64
              - name: noLease
                type: bool
            name: ReadIndex
            recv: pointer
          - doc: |-
              TransferLeadership starts a transfer to a voter (D8). It refuses new
              proposals from now on and drops the lease for the rest of the term (D9 c).
            in:
              - name: now
                type: time.Time
              - name: to
                type: core.NodeID
            name: TransferLeadership
            out:
              - type: errs.Code
            recv: pointer
          - doc: |-
              CheckOffer answers an install offer on the event loop, which alone knows
              the term, the leader and the commit index (R8-21). needTable exempts a
              node that holds no usable snapshot from the freshness rule (R7-18).
            in:
              - name: from
                type: core.NodeID
              - name: o
                type: core.InstallOfferValue
              - name: needTable
                type: bool
            name: CheckOffer
            out:
              - type: errs.Code
            recv: pointer
          - doc: |-
              InstallSnapshot moves the log onto a snapshot the driver has published and
              restored. The suffix after it is kept only when the boundary entry matches
              (D7).
            in:
              - name: meta
                type: core.SnapshotMetaValue
            name: InstallSnapshot
            recv: pointer
          - doc: |-
              SetOverloaded tells the state machine whether the driver refuses new
              commands for apply backpressure (D6): forwarded ones are refused too.
            in:
              - name: "on"
                type: bool
            name: SetOverloaded
            recv: pointer
          - doc: |-
              SetApplyLag tells the step function what the apply goroutine has not
              applied yet of what Ready handed it: the payload bytes of the entries it
              holds, and whether it still reads back entries handed by index. Ready
              hands nothing in memory past MaxApplyLagBytes of them, nor while it reads
              (D6, #664).
            in:
              - name: bytes
                type: int64
              - name: reading
                type: bool
            name: SetApplyLag
            recv: pointer
          - doc: |-
              SetApplyStalled tells the step function whether the driver holds its
              apply stalled: while it does, a TimeoutNow does not make this node
              campaign. A leader whose apply makes no progress hands its leadership
              over (#554), and a transfer back to it, the watch of PreferredLeaders' or
              an operator's, handed it the leadership it would hand over again; the
              driver holds it stalled from that hand-over until its apply moves (#674).
              An election is untouched.
            in:
              - name: "on"
                type: bool
            name: SetApplyStalled
            recv: pointer
          - doc: |-
              ApplyHeld reports whether committed, durable entries wait to be handed to
              apply, held back by MaxApplyLagBytes: the gap between commit and applied
              is at its bound, and the driver refuses new commands meanwhile (D6).
            name: ApplyHeld
            out:
              - type: bool
            recv: pointer
          - doc: Tick advances the timers to now.
            in:
              - name: now
                type: time.Time
            name: Tick
            recv: pointer
          - doc: StorageDone reports that the write seq is durable through (index, term).
            in:
              - name: seq
              - name: index
              - name: term
                type: uint64
            name: StorageDone
            recv: pointer
          - doc: |-
              ReportUnreachable tells the step function that the transport could not
              reach a peer: a leader moves it to probe, and a node that follows it as
              its leader asks its members for that leader's record (#724).
            in:
              - name: id
                type: core.NodeID
            name: ReportUnreachable
            recv: pointer
          - doc: |-
              SnapshotDone ends a snapshot transfer to a peer; index is the snapshot
              the driver sent.
            in:
              - name: to
                type: core.NodeID
              - name: index
                type: uint64
              - name: ok
                type: bool
            name: SnapshotDone
            recv: pointer
          - doc: |-
              Compact forgets the entries through index, which a durable snapshot
              covers, and asks the store to drop them, even at or below the base.
            in:
              - name: index
                type: uint64
            name: Compact
            recv: pointer
          - doc: NoTable reports whether the node still waits for a snapshot install.
            name: NoTable
            out:
              - type: bool
            recv: pointer
          - doc: |-
              SetCanVote changes whether the node may vote: a joining directory may once
              its admission is appended.
            in:
              - name: v
                type: bool
            name: SetCanVote
            recv: pointer
          - doc: SnapshotIndex returns the base of the in-memory log.
            name: SnapshotIndex
            out:
              - type: uint64
            recv: pointer
          - doc: Entry returns the entry at i, if the step function holds it.
            in:
              - name: i
                type: uint64
            name: Entry
            out:
              - type: core.EntryValue
              - type: bool
            recv: pointer
          - doc: ConfAt returns the membership valid at index i.
            in:
              - name: i
                type: uint64
            name: ConfAt
            out:
              - type: core.MembershipValue
            recv: pointer
          - doc: ChainAt returns the chain value at i.
            in:
              - name: i
                type: uint64
            name: ChainAt
            out:
              - type: uint32
            recv: pointer
          - doc: |-
              EngineAt returns the engine's own replicated state as the committed
              entries through index i left it: the state a snapshot cut at i carries,
              never one an engine entry committed past i set (#402). An index at or
              below the log's base answers the state at the base.
            in:
              - name: i
                type: uint64
            name: EngineAt
            out:
              - type: EngineValue
            recv: pointer
          - doc: TermAt returns the term at i.
            in:
              - name: i
                type: uint64
            name: TermAt
            out:
              - type: uint64
              - type: bool
            recv: pointer
          - doc: Status returns the step function's view.
            name: Status
            out:
              - type: StatusValue
            recv: pointer
          - doc: Progress returns the leader's match index of a peer.
            in:
              - name: id
                type: core.NodeID
            name: Progress
            out:
              - name: match
                type: uint64
              - name: lastHeard
                type: time.Time
              - name: ok
                type: bool
            recv: pointer
          - doc: LeaseValid reports whether the leader's lease holds at now (D9).
            in:
              - name: now
                type: time.Time
            name: LeaseValid
            out:
              - type: bool
            recv: pointer
          - doc: |-
              DropLease drops the lease for the rest of the term: a loop turn longer than
              the drift budget (D9).
            name: DropLease
            recv: pointer
          - doc: HasReady reports whether a turn left work for the driver.
            name: HasReady
            out:
              - type: bool
            recv: pointer
          - doc: Ready returns the work of the turns since the last call and resets it.
            name: Ready
            out:
              - type: ReadyValue
            recv: pointer
          - doc: |-
              PeerStats returns the leader's view of every peer, in configuration
              order; nil off the leader.
            name: PeerStats
            out:
              - type: "[]PeerStatValue"
            recv: pointer
          - doc: |-
              FailureTolerance is how many voters can fail now with a majority left:
              the voters heard within the minimum election timeout, less a quorum. Only
              the leader knows it; elsewhere it is -1.
            in:
              - name: now
                type: time.Time
            name: FailureTolerance
            out:
              - type: int
            recv: pointer
          - doc: |-
              QuorumActive reports whether a majority answered the leader within the
              minimum election timeout.
            in:
              - name: now
                type: time.Time
            name: QuorumActive
            out:
              - type: bool
            recv: pointer
          - doc: |-
              ChainRefusal names the leader and the index this follower refuses, and
              how many times, while it lasts (D4, R6-05).
            name: ChainRefusal
            out:
              - type: core.NodeID
              - type: uint64
              - type: int
            recv: pointer
          - doc: |-
              Step handles one message. The driver has already checked that m.From is
              the peer the transport authenticated (R7-05).
            in:
              - name: now
                type: time.Time
              - name: m
                type: core.MessageValue
            name: Step
            recv: pointer
        name: Raft
        struct:
          unexported: true
      - doc: |-
          StatusValue is the step function's part of a node's status. It is a copy:
          its memberships are cloned, so the caller may keep it.
        name: StatusValue
        struct:
          fields:
            - name: Role
              type: core.Role
            - name: Term
              type: uint64
            - name: Lead
              type: core.NodeID
            - name: Commit
              type: uint64
            - name: Last
              type: uint64
            - name: Stable
              type: uint64
            - name: Timing
              type: core.TimingContractSpec
            - name: Cluster
              type: uint32
            - name: ClusterG
              type: uint64
            - name: NoSpace
              type: core.AlarmID
            - name: Conf
              type: core.MembershipValue
            - name: Committed
              type: core.MembershipValue
            - name: Transfer
              type: core.NodeID
            - doc: |-
                HandedBy is, while the node leads, the leader whose TimeoutNow made it
                campaign for this term, 0 for a term it won by an election.
              name: HandedBy
              type: core.NodeID
      - doc: |-
          EngineValue is the engine's own replicated state: the timing contract, the
          cluster version and its generation, and the no-space alarm.
        name: EngineValue
        struct:
          fields:
            - name: Timing
              type: core.TimingContractSpec
            - name: Cluster
              type: uint32
            - name: ClusterG
              type: uint64
            - name: NoSpace
              type: core.AlarmID
  - constants:
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeFounding is the founding configuration Bootstrap writes.
        name: ChangeFounding
        type: uint8
        value: "1"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeAddLearner adds a learner.
        name: ChangeAddLearner
        type: uint8
        value: "2"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangePromote makes a learner a voter.
        name: ChangePromote
        type: uint8
        value: "3"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeRemove removes a member and retires its id.
        name: ChangeRemove
        type: uint8
        value: "4"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeUpdateAddress changes a member's address.
        name: ChangeUpdateAddress
        type: uint8
        value: "5"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeDenyPin withdraws a member's SPKI pin.
        name: ChangeDenyPin
        type: uint8
        value: "6"
      - blockDoc: The membership changes an EntryMembership records.
        doc: ChangeForced is the configuration Recover or RestoreSnapshot forces.
        name: ChangeForced
        type: uint8
        value: "7"
      - blockDoc: The membership changes an EntryMembership records.
        doc: |-
          ChangeSnapshotLimit records the MaxSnapshotBytes a member runs with,
          on that member's word alone: Target and the one member the change
          carries name it, and the leader admits it from that member only.
        name: ChangeSnapshotLimit
        type: uint8
        value: "8"
      - doc: |-
          AdminVersion2 is the payload version of an engine entry whose admin
          carries Origin. A leader writes it once the committed cluster version is
          2, never before: a node of protocol 1 reads version 0 only (D18, #561).
        name: AdminVersion2
        type: uint32
        value: "2"
      - doc: |-
          AdminVersion3 is the payload version of an engine entry whose admin
          carries, after version 2's Origin, the retired keys of its membership. A
          leader writes it once the committed cluster version is 3, never before: a
          node of protocol 2 reads versions 0 and 2 only (D18, #648).
        name: AdminVersion3
        type: uint32
        value: "3"
    doc: |-
      Package wire holds the consensus domain's hand-written fixed layouts: the
      frame of a Message, the 41-byte Token, SnapshotMeta, Membership and the
      timing contract, and the CRC-32C checksums of an entry's body and chain
      (ADR 0152 D4, D18). They are not codec formats: two nodes configured with
      different format strings would write different bytes for one entry, which
      is a fork.
    functions:
      - doc: |-
          AppendAdmin appends the encoding of an engine entry's payload of version
          0, which carries no Origin.
        in:
          - name: dst
            type: "[]byte"
          - name: a
            type: "*AdminValue"
        name: AppendAdmin
        out:
          - type: "[]byte"
      - doc: |-
          AppendAdminAt appends the encoding of an engine entry's payload of
          version v: version 0's fields, then Origin from AdminVersion2, then the
          membership's retired keys from AdminVersion3. Another version is not
          written: the encoding of version 0 is returned for it.
        in:
          - name: dst
            type: "[]byte"
          - name: v
            type: uint32
          - name: a
            type: "*AdminValue"
        name: AppendAdminAt
        out:
          - type: "[]byte"
      - doc: ParseAdmin decodes an engine entry's payload of version 0.
        in:
          - name: b
            type: "[]byte"
        name: ParseAdmin
        out:
          - type: AdminValue
          - type: error
      - doc: |-
          ParseAdminAt decodes an engine entry's payload of version v, which the
          entry's Version names. A version this node does not know is
          VERSION_UNSUPPORTED, never read as another one.
        in:
          - name: v
            type: uint32
          - name: b
            type: "[]byte"
        name: ParseAdminAt
        out:
          - type: AdminValue
          - type: error
      - doc: |-
          BodySum returns the CRC-32C of an entry's payload, the checksum a proposer
          computes.
        in:
          - name: data
            type: "[]byte"
        name: BodySum
        out:
          - type: uint32
      - doc: |-
          ChainSum returns the chain value of an entry: the CRC-32C of the previous
          entry's chain value and of this entry's header fields. The LEADER computes
          it at its serialized append point; followers verify it.
        in:
          - name: prev
            type: uint32
          - name: e
            type: "*coreconsensus.EntryValue"
        name: ChainSum
        out:
          - type: uint32
      - doc: |-
          Lane reads the lane of an encoded frame from its frozen header alone, so a
          transport routes a frame of a type or a version it does not parse.
        in:
          - name: frame
            type: "[]byte"
        name: Lane
        out:
          - type: coreconsensus.FrameLane
          - type: error
      - doc: AppendMessage appends m's encoding, frame header included, to dst.
        in:
          - name: dst
            type: "[]byte"
          - name: m
            type: "*coreconsensus.MessageValue"
        name: AppendMessage
        out:
          - type: "[]byte"
      - doc: |-
          EntryLen returns the length of e's encoding in an append message: its
          fixed header, then its payload. A batch counted by its payloads alone
          outgrows its frame by this header per entry (#683).
        in:
          - name: e
            type: "*coreconsensus.EntryValue"
        name: EntryLen
        out:
          - type: int
      - doc: |-
          ParseMessage decodes one frame into m, reusing m.Entries' capacity. Entry
          data aliases frame: it is valid while frame is. A frame that does not parse
          is FRAME_INVALID; a frame version this node does not know is
          VERSION_UNSUPPORTED.
        in:
          - name: frame
            type: "[]byte"
          - name: m
            type: "*coreconsensus.MessageValue"
        name: ParseMessage
        out:
          - type: error
      - doc: |-
          AppendToken appends the 41-byte encoding of t: a version byte, the
          ClusterID, then epoch, term and index as big-endian uint64.
        in:
          - name: dst
            type: "[]byte"
          - name: t
            type: coreconsensus.TokenValue
        name: AppendToken
        out:
          - type: "[]byte"
      - doc: ParseToken decodes a token; another length or version is FRAME_INVALID.
        in:
          - name: b
            type: "[]byte"
        name: ParseToken
        out:
          - type: coreconsensus.TokenValue
          - type: error
      - doc: |-
          AppendSnapshotMeta appends the versioned encoding of m. The version
          follows the cluster version m carries: a meta of a cluster below protocol
          version 2 is written in version 1, one of a cluster at 2 in version 2,
          checksummed, which the release before already reads (D18, #546), and one
          of a cluster at 3 or above in version 3, which adds the retired keys of
          its configuration (#648). Only a cluster whose every member announced a
          protocol reaches its version.
        in:
          - name: dst
            type: "[]byte"
          - name: m
            type: "*coreconsensus.SnapshotMetaValue"
        name: AppendSnapshotMeta
        out:
          - type: "[]byte"
      - doc: |-
          ParseSnapshotMeta decodes a SnapshotMeta, copying every byte it keeps:
          version 1, or version 2 or 3 once its trailing CRC-32C holds. Another
          version is VERSION_UNSUPPORTED, a version 2 or 3 whose sum fails
          FRAME_INVALID.
        in:
          - name: b
            type: "[]byte"
          - name: m
            type: "*coreconsensus.SnapshotMetaValue"
        name: ParseSnapshotMeta
        out:
          - type: error
      - doc: |-
          AppendMembership appends the encoding of a membership, the payload of an
          EntryMembership and a part of SnapshotMeta.
        in:
          - name: dst
            type: "[]byte"
          - name: m
            type: "*coreconsensus.MembershipValue"
        name: AppendMembership
        out:
          - type: "[]byte"
      - doc: ParseMembership decodes a membership encoded by AppendMembership.
        in:
          - name: b
            type: "[]byte"
        name: ParseMembership
        out:
          - type: coreconsensus.MembershipValue
          - type: error
      - doc: AppendTimingContract appends the encoding of a timing contract.
        in:
          - name: dst
            type: "[]byte"
          - name: c
            type: coreconsensus.TimingContractSpec
        name: AppendTimingContract
        out:
          - type: "[]byte"
      - doc: ParseTimingContract decodes a timing contract.
        in:
          - name: b
            type: "[]byte"
        name: ParseTimingContract
        out:
          - type: coreconsensus.TimingContractSpec
          - type: error
    imports:
      coreconsensus: github.com/kitsunium/sdk/internal/core/app/consensus
    path: github.com/kitsunium/sdk/internal/service/app/consensus/wire
    types:
      - doc: |-
          AdminValue is the payload of every engine entry kind: who asked, what it expects
          to act on, and what it changes. Each kind reads the fields it needs.
        name: AdminValue
        struct:
          fields:
            - doc: Operator is the identity the caller vouched for.
              name: Operator
              type: string
            - doc: Change is the membership change of an EntryMembership.
              name: Change
              type: uint8
            - doc: Target is the node a change or a transfer names.
              name: Target
              type: coreconsensus.NodeID
            - doc: Pre is the precondition of a clearing or raising operation.
              name: Pre
              type: coreconsensus.PreconditionSpec
            - doc: Membership is the whole configuration after a membership change.
              name: Membership
              type: coreconsensus.MembershipValue
            - doc: Contract is the timing contract of an EntryTimingContract.
              name: Contract
              type: coreconsensus.TimingContractSpec
            - doc: ClusterVersion is the version an EntryClusterVersion raises to.
              name: ClusterVersion
              type: uint32
            - doc: |-
                Origin is the authenticated node the leader received the operation
                from: the member that forwarded it, or the leader itself. The leader
                writes it, overwriting whatever the proposer wrote, and only in an
                entry of payload version AdminVersion2 or AdminVersion3 (ADR 0152 D8,
                #561).
              name: Origin
              type: coreconsensus.NodeID
  - doc: |-
      Package consensus is the public facade of the SDK's consensus domain
      (ADR 0152): agreement of several machines on the order of their writes.
      A write is committed when a majority holds it on disk.

      	id, inc, _ := consensus.Init(dir, cluster, "fra")      // offline, every founder
      	_ = consensus.Bootstrap(ctx, &cfg, members)             // offline, identical list
      	node, _ := consensus.NewNode(cfg)                       // never bootstraps
      	tok, result, err := node.Propose(ctx, command)

      # After OUTCOME_UNKNOWN, never retry blindly

      NOT_LEADER means the proposal was certainly NOT appended and is safe to
      retry. OUTCOME_UNKNOWN means it was appended, or possibly delivered, and the
      answer was lost: it may still commit. Read the state through Barrier and
      decide, or carry a per-key revision in the command, because a replayed
      compare-and-swap is not harmless under ABA (D6, R1-04).

      # Reads

      Barrier returns once the local state machine reflects every write
      committed before the call: ReadIndex by default, confirmed by a heartbeat
      round started after the read arrived. ReadLease is opt-in and sound only
      under the four conditions of D9; a leader paused after its lease check
      serves a stale read, which ReadIndex never does.

      # Apply is a pure transition

      StateMachine.Apply is called for every committed command, in log order, on
      one goroutine, and must be deterministic. An Apply that cannot complete
      must panic: the node stops with STATE_MACHINE_FAILED, and the entry IS
      committed.
    facade:
      - alias:
          - name: NodeID
            target: coreconsensus.NodeID
          - name: Incarnation
            target: coreconsensus.Incarnation
          - name: ClusterID
            target: coreconsensus.ClusterID
          - name: LogIdentityValue
            target: coreconsensus.LogIdentityValue
          - name: GroupID
            target: coreconsensus.GroupID
          - name: PositionValue
            target: coreconsensus.PositionValue
          - name: EntryValue
            target: coreconsensus.EntryValue
          - name: TokenValue
            target: coreconsensus.TokenValue
          - name: EntryKind
            target: coreconsensus.EntryKind
          - name: HardState
            target: coreconsensus.HardState
          - name: StampValue
            target: coreconsensus.StampValue
          - name: StampState
            target: coreconsensus.StampState
          - name: MessageValue
            target: coreconsensus.MessageValue
          - name: MessageKind
            target: coreconsensus.MessageKind
          - name: FrameLane
            target: coreconsensus.FrameLane
          - name: AuthenticatedPeerValue
            target: coreconsensus.AuthenticatedPeerValue
          - name: InstallOfferValue
            target: coreconsensus.InstallOfferValue
          - name: InstallAcceptValue
            target: coreconsensus.InstallAcceptValue
          - name: InstallParams
            target: coreconsensus.InstallParams
          - name: StopReasonValue
            target: coreconsensus.StopReasonValue
          - name: JoinConfig
            target: coreconsensus.JoinConfig
          - name: JoinRequestValue
            target: coreconsensus.JoinRequestValue
          - name: Joiner
            target: coreconsensus.Joiner
          - name: JoinAuthorizer
            target: coreconsensus.JoinAuthorizer
          - name: FencedAttestationValue
            target: coreconsensus.FencedAttestationValue
          - name: SnapshotMetaValue
            target: coreconsensus.SnapshotMetaValue
          - name: SnapshotSink
            target: coreconsensus.SnapshotSink
          - name: SnapshotHandle
            target: coreconsensus.SnapshotHandle
          - name: TimingContractSpec
            target: coreconsensus.TimingContractSpec
          - name: VersionsValue
            target: coreconsensus.VersionsValue
          - name: MemberValue
            target: coreconsensus.MemberValue
          - name: MembershipValue
            target: coreconsensus.MembershipValue
          - name: Operator
            target: coreconsensus.Operator
          - name: StatusValue
            target: coreconsensus.StatusValue
          - name: Role
            target: coreconsensus.Role
          - name: AlarmID
            target: coreconsensus.AlarmID
          - name: PreconditionSpec
            target: coreconsensus.PreconditionSpec
          - blank: true
            name: Replicated
            target: coreconsensus.Replicated
          - name: StateMachine
            target: coreconsensus.StateMachine
          - name: DurableStateMachine
            target: coreconsensus.DurableStateMachine
          - name: BatchingStateMachine
            target: coreconsensus.BatchingStateMachine
          - name: Snapshot
            target: coreconsensus.Snapshot
          - name: LogReader
            target: coreconsensus.LogReader
          - name: LogStore
            target: coreconsensus.LogStore
          - name: SnapshotStore
            target: coreconsensus.SnapshotStore
          - name: Transport
            target: coreconsensus.Transport
          - name: UnreachableReporter
            target: coreconsensus.UnreachableReporter
          - name: LeadershipWatcher
            target: coreconsensus.LeadershipWatcher
          - blank: true
            name: HealthValue
            target: svcconsensus.HealthValue
          - name: PeerHealthValue
            target: svcconsensus.PeerHealthValue
          - name: HealthFlags
            target: svcconsensus.HealthFlags
          - name: PeerFlags
            target: svcconsensus.PeerFlags
          - name: ReadMode
            target: svcconsensus.ReadMode
          - name: Durability
            target: svcconsensus.Durability
          - name: Config
            target: svcconsensus.Config
          - name: Node
            target: svcconsensus.Node
          - name: MemoryLog
            target: svcconsensus.MemoryLog
          - name: MemorySnapshots
            target: svcconsensus.MemorySnapshots
          - name: MemoryNetwork
            target: svcconsensus.MemoryNetwork
          - name: MemoryTransport
            target: svcconsensus.MemoryTransport
          - blank: true
            name: DataDir
            target: svcconsensus.DataDir
          - name: DataDirOptions
            target: svcconsensus.DataDirOptions
          - name: ReportValue
            target: svcconsensus.ReportValue
          - name: QuarantineExit
            target: svcconsensus.QuarantineExit
          - name: RecoverOptions
            target: svcconsensus.RecoverOptions
          - name: RestoreOptions
            target: svcconsensus.RestoreOptions
          - name: ImportParams
            target: svcconsensus.ImportParams
          - name: TransportConfig
            target: svcconsensus.TransportConfig
          - name: TCPTransport
            target: svcconsensus.TCPTransport
          - name: PEMIdentity
            target: svcconsensus.PEMIdentity
        doc: Every type needed to implement a published port is aliased here (R2-32).
      - const:
          - name: WipeAndRejoin
            reexport: svcconsensus.WipeAndRejoin
            type: svcconsensus.QuarantineExit
            value: "1"
          - name: TruncateAndStaySilent
            reexport: svcconsensus.TruncateAndStaySilent
            type: svcconsensus.QuarantineExit
            value: "2"
        doc: The two exits of ClearQuarantine.
      - func:
          doc: NewDataDir takes the directory lock first, then recovers the log.
          forward: svcconsensus.NewDataDir
          in:
            - name: dir
              type: string
          name: NewDataDir
          out:
            - type: DataDir
            - type: error
      - func:
          doc: NewDataDirWith is OpenDataDir with options.
          forward: svcconsensus.NewDataDirWith
          in:
            - name: dir
              type: string
            - name: opts
              type: DataDirOptions
          name: NewDataDirWith
          out:
            - type: DataDir
            - type: error
      - func:
          doc: "Init prepares a joining node offline: a random NodeID and a joining stamp."
          forward: svcconsensus.Init
          in:
            - name: d
              type: DataDir
            - name: cluster
              type: ClusterID
            - name: slot
              type: string
          name: Init
          out:
            - type: NodeID
            - type: Incarnation
            - type: error
      - func:
          doc: Redraw draws a new id on an empty joining directory.
          forward: svcconsensus.Redraw
          in:
            - name: d
              type: DataDir
          name: Redraw
          out:
            - type: NodeID
            - type: error
      - func:
          doc: Inspect reads a stopped node's directory without changing it.
          forward: svcconsensus.Inspect
          in:
            - name: d
              type: DataDir
          name: Inspect
          out:
            - type: ReportValue
            - type: error
      - func:
          doc: |-
            ClearQuarantine clears a quarantined or stopped directory by one of its
            two exits.
          forward: svcconsensus.ClearQuarantine
          in:
            - name: d
              type: DataDir
            - name: exit
              type: QuarantineExit
            - name: op
              type: Operator
          name: ClearQuarantine
          out:
            - type: error
      - func:
          doc: |-
            Recover starts a new history from this node's committed log and the
            contiguous entries past it whose body and chain checksums verify and whose
            term does not decrease, every other old voter attested fenced by every
            witness and no other member under an old member's ID. An interrupted Recover leaves the stop marker STOP-RECOVER, which
            refuses a start until Recover runs again to the same new cluster. It
            removes the silence condition TruncateAndStaySilent left, and first
            finishes an install a crash interrupted after its snapshot was
            published, so the forced entry follows that snapshot.
          forward: svcconsensus.Recover
          in:
            - name: d
              type: DataDir
            - name: newCluster
              type: ClusterID
            - name: members
              type: "[]MemberValue"
            - name: opt
              type: "*RecoverOptions"
          name: Recover
          out:
            - type: error
      - func:
          doc: ReceiptMessage returns the bytes a witness signs to attest a fenced voter.
          forward: svcconsensus.ReceiptMessage
          in:
            - name: old
            - name: next
              type: ClusterID
            - name: voter
              type: NodeID
          name: ReceiptMessage
          out:
            - type: "[]byte"
      - func:
          doc: RestoreSnapshot starts a new history from a saved snapshot, offline.
          forward: svcconsensus.RestoreSnapshot
          in:
            - name: d
              type: DataDir
            - name: r
              type: io.Reader
            - name: newCluster
              type: ClusterID
            - name: members
              type: "[]MemberValue"
            - name: opt
              type: "*RestoreOptions"
          name: RestoreSnapshot
          out:
            - type: SnapshotMetaValue
            - type: error
      - func:
          doc: OpenSnapshot reads a saved snapshot's stream without a node, checked to its digest.
          forward: svcconsensus.OpenSnapshot
          in:
            - name: r
              type: io.Reader
            - name: opt
              type: "*RestoreOptions"
          name: OpenSnapshot
          out:
            - type: io.Reader
            - type: error
      - func:
          doc: ImportObserved starts a new history from a saved snapshot and the verified tail an observer read after it, offline.
          forward: svcconsensus.ImportObserved
          in:
            - name: d
              type: DataDir
            - name: p
              type: "*ImportParams"
            - name: newCluster
              type: ClusterID
            - name: members
              type: "[]MemberValue"
            - name: opt
              type: "*RestoreOptions"
          name: ImportObserved
          out:
            - type: SnapshotMetaValue
            - type: error
      - func:
          doc: NewTCPTransport builds the shipped mTLS transport; it is also a Joiner.
          forward: svcconsensus.NewTCPTransport
          in:
            - name: cfg
              type: "*TransportConfig"
          name: NewTCPTransport
          out:
            - type: "*TCPTransport"
            - type: error
      - func:
          doc: |-
            NewTCPTransportFromPEM builds it from a certificate, a key and the
            consensus CA, as PEM files reloaded in place on renewal.
          forward: svcconsensus.NewTCPTransportFromPEM
          in:
            - name: certFile
            - name: keyFile
            - name: caFile
              type: string
            - name: cfg
              type: "*TransportConfig"
          name: NewTCPTransportFromPEM
          out:
            - type: "*TCPTransport"
            - type: error
      - func:
          doc: |-
            NewPEMIdentity reads a node identity from PEM files; its Roots method is
            the CA pool to pass as TransportConfig.Roots.
          forward: svcconsensus.NewPEMIdentity
          in:
            - name: certFile
            - name: keyFile
            - name: caFile
              type: string
          name: NewPEMIdentity
          out:
            - type: "*PEMIdentity"
            - type: error
      - func:
          doc: SAN returns the canonical URI SAN a node certificate must carry.
          forward: svcconsensus.SAN
          in:
            - name: cluster
              type: ClusterID
            - name: slot
              type: string
          name: SAN
          out:
            - type: "*url.URL"
      - func:
          doc: "SPKIOf returns a certificate's pin: the SHA-256 of its public key info."
          forward: svcconsensus.SPKIOf
          in:
            - name: c
              type: "*x509.Certificate"
          name: SPKIOf
          out:
            - type: "[32]byte"
      - const:
          - name: RoleFollower
            reexport: coreconsensus.RoleFollower
            type: coreconsensus.Role
            value: "1"
          - name: RolePreCandidate
            reexport: coreconsensus.RolePreCandidate
            type: coreconsensus.Role
            value: "2"
          - name: RoleCandidate
            reexport: coreconsensus.RoleCandidate
            type: coreconsensus.Role
            value: "3"
          - name: RoleLeader
            reexport: coreconsensus.RoleLeader
            type: coreconsensus.Role
            value: "4"
          - name: RoleLearner
            reexport: coreconsensus.RoleLearner
            type: coreconsensus.Role
            value: "5"
        doc: The roles a Status reports.
      - const:
          - name: HealthReady
            reexport: svcconsensus.HealthReady
            type: svcconsensus.HealthFlags
            value: "1"
          - name: HealthHasLeader
            reexport: svcconsensus.HealthHasLeader
            type: svcconsensus.HealthFlags
            value: "2"
          - name: HealthQuorumReachable
            reexport: svcconsensus.HealthQuorumReachable
            type: svcconsensus.HealthFlags
            value: "4"
          - name: HealthStopped
            reexport: svcconsensus.HealthStopped
            type: svcconsensus.HealthFlags
            value: "8"
          - name: HealthSnapshotNearLimit
            reexport: svcconsensus.HealthSnapshotNearLimit
            type: svcconsensus.HealthFlags
            value: "16"
        doc: The answers a HealthValue carries, read with HealthFlags.Has.
      - const:
          - name: PeerVoter
            reexport: svcconsensus.PeerVoter
            type: svcconsensus.PeerFlags
            value: "1"
          - name: PeerUnreachable
            reexport: svcconsensus.PeerUnreachable
            type: svcconsensus.PeerFlags
            value: "2"
          - name: PeerSnapshot
            reexport: svcconsensus.PeerSnapshot
            type: svcconsensus.PeerFlags
            value: "4"
        doc: The facts a PeerHealthValue carries, read with PeerFlags.Has.
      - const:
          - name: ReadIndex
            reexport: svcconsensus.ReadIndex
            type: svcconsensus.ReadMode
            value: "0"
          - name: ReadLease
            reexport: svcconsensus.ReadLease
            type: svcconsensus.ReadMode
            value: "1"
          - name: DurabilityVolatile
            reexport: svcconsensus.DurabilityVolatile
            type: svcconsensus.Durability
            value: "1"
          - name: DurabilityDurable
            reexport: svcconsensus.DurabilityDurable
            type: svcconsensus.Durability
            value: "2"
          - name: EntryCommand
            reexport: coreconsensus.EntryCommand
            type: coreconsensus.EntryKind
            value: "1"
          - name: LaneControl
            reexport: coreconsensus.LaneControl
            type: coreconsensus.FrameLane
            value: "0"
          - name: LaneData
            reexport: coreconsensus.LaneData
            type: coreconsensus.FrameLane
            value: "1"
          - name: LaneSnapshot
            reexport: coreconsensus.LaneSnapshot
            type: coreconsensus.FrameLane
            value: "2"
          - name: StampJoining
            reexport: coreconsensus.StampJoining
            type: coreconsensus.StampState
            value: "1"
          - name: StampMember
            reexport: coreconsensus.StampMember
            type: coreconsensus.StampState
            value: "3"
          - name: StampBootstrapPending
            reexport: coreconsensus.StampBootstrapPending
            type: coreconsensus.StampState
            value: "2"
          - name: FlagTransfer
            reexport: coreconsensus.FlagTransfer
            type: coreconsensus.MessageFlags
            value: "1"
          - name: FlagNoLease
            reexport: coreconsensus.FlagNoLease
            type: coreconsensus.MessageFlags
            value: "4"
          - name: FlagNeedSnapshot
            reexport: coreconsensus.FlagNeedSnapshot
            type: coreconsensus.MessageFlags
            value: "2"
          - name: FlagTruncated
            reexport: coreconsensus.FlagTruncated
            type: coreconsensus.MessageFlags
            value: "8"
          - name: FlagProtocol2
            reexport: coreconsensus.FlagProtocol2
            type: coreconsensus.MessageFlags
            value: "16"
          - name: FlagProtocol3
            reexport: coreconsensus.FlagProtocol3
            type: coreconsensus.MessageFlags
            value: "32"
          - name: MsgForward
            reexport: coreconsensus.MsgForward
            type: coreconsensus.MessageKind
            value: "0x43"
          - name: MsgApp
            reexport: coreconsensus.MsgApp
            type: coreconsensus.MessageKind
            value: "0x41"
          - name: MsgHeartbeat
            reexport: coreconsensus.MsgHeartbeat
            type: coreconsensus.MessageKind
            value: "0x05"
          - name: MsgVote
            reexport: coreconsensus.MsgVote
            type: coreconsensus.MessageKind
            value: "0x03"
          - name: MsgPreVote
            reexport: coreconsensus.MsgPreVote
            type: coreconsensus.MessageKind
            value: "0x01"
          - name: MsgTimeoutNow
            reexport: coreconsensus.MsgTimeoutNow
            type: coreconsensus.MessageKind
            value: "0x07"
          - name: MsgReadIndex
            reexport: coreconsensus.MsgReadIndex
            type: coreconsensus.MessageKind
            value: "0x08"
          - name: MsgForwardAdmin
            reexport: coreconsensus.MsgForwardAdmin
            type: coreconsensus.MessageKind
            value: "0x0A"
          - name: MsgAppResp
            reexport: coreconsensus.MsgAppResp
            type: coreconsensus.MessageKind
            value: "0x42"
          - name: MsgVoteResp
            reexport: coreconsensus.MsgVoteResp
            type: coreconsensus.MessageKind
            value: "0x04"
          - name: MsgPreVoteResp
            reexport: coreconsensus.MsgPreVoteResp
            type: coreconsensus.MessageKind
            value: "0x02"
          - name: MsgHeartbeatResp
            reexport: coreconsensus.MsgHeartbeatResp
            type: coreconsensus.MessageKind
            value: "0x06"
          - name: MsgReadIndexResp
            reexport: coreconsensus.MsgReadIndexResp
            type: coreconsensus.MessageKind
            value: "0x09"
          - name: MsgForwardResp
            reexport: coreconsensus.MsgForwardResp
            type: coreconsensus.MessageKind
            value: "0x44"
          - name: MsgForwardAdminResp
            reexport: coreconsensus.MsgForwardAdminResp
            type: coreconsensus.MessageKind
            value: "0x0B"
          - name: MsgLeaderRecord
            reexport: coreconsensus.MsgLeaderRecord
            type: coreconsensus.MessageKind
            value: "0x0C"
        doc: The read modes and durabilities.
      - func:
          doc: |-
            NewNode opens a node over what Init and Bootstrap prepared. It never
            bootstraps.
          forward: svcconsensus.NewNode
          in:
            - name: cfg
              type: Config
          name: NewNode
          out:
            - type: "*Node"
            - type: error
      - func:
          doc: |-
            Bootstrap founds a cluster on one founding node, with the IDENTICAL member
            list on every founder. Idempotent and resumable. Its InitialTiming is
            completed and refused as NewNode's is, and rules every node once founded.
          forward: svcconsensus.Bootstrap
          in:
            - name: ctx
              type: context.Context
            - name: cfg
              type: "*Config"
            - name: members
              type: "[]MemberValue"
          name: Bootstrap
          out:
            - type: error
      - func:
          doc: |-
            InitLog prepares a joining log on any LogStore: a random NodeID and a
            joining stamp. Init does the same on the shipped data directory.
          forward: svcconsensus.InitLog
          in:
            - name: log
              type: LogStore
            - name: cluster
              type: ClusterID
            - name: slot
              type: string
          name: InitLog
          out:
            - type: NodeID
            - type: Incarnation
            - type: error
      - func:
          doc: RedrawLog draws a new id on an empty joining log.
          forward: svcconsensus.RedrawLog
          in:
            - name: log
              type: LogStore
          name: RedrawLog
          out:
            - type: NodeID
            - type: error
      - func:
          doc: |-
            ProposeAs types the Apply result. A result of another dynamic type is
            RESULT_TYPE_MISMATCH carrying the committed token: the entry IS committed.
          forward: svcconsensus.ProposeAs[R]
          in:
            - name: ctx
              type: context.Context
            - name: r
              type: Replicated
            - name: data
              type: "[]byte"
          name: ProposeAs
          out:
            - type: TokenValue
            - type: R
            - type: error
          typeParams:
            - constraint: any
              name: R
      - func:
          doc: TimingDefaults are the default timings for the three-site RTT matrix.
          forward: svcconsensus.TimingDefaults
          name: TimingDefaults
          out:
            - type: TimingContractSpec
      - func:
          doc: Latest opens the newest complete snapshot of a store.
          forward: svcconsensus.Latest
          in:
            - name: s
              type: SnapshotStore
          name: Latest
          out:
            - type: SnapshotHandle
            - type: error
      - func:
          doc: Lane reads the lane of an encoded frame from its frozen header alone.
          forward: wire.Lane
          in:
            - name: frame
              type: "[]byte"
          name: Lane
          out:
            - type: FrameLane
            - type: error
      - func:
          doc: NewMemoryLog returns the in-memory LogStore double.
          forward: svcconsensus.NewMemoryLog
          name: NewMemoryLog
          out:
            - type: "*MemoryLog"
      - func:
          doc: NewMemorySnapshots returns the in-memory SnapshotStore double.
          forward: svcconsensus.NewMemorySnapshots
          name: NewMemorySnapshots
          out:
            - type: "*MemorySnapshots"
      - func:
          doc: NewMemoryNetwork returns an in-memory network of transports.
          forward: svcconsensus.NewMemoryNetwork
          name: NewMemoryNetwork
          out:
            - type: "*MemoryNetwork"
      - func:
          doc: |-
            NewMemoryTransport returns the end of the network n that node id sends and
            receives through, the same one on every call for that id.
          forward: svcconsensus.NewMemoryTransport
          in:
            - name: "n"
              type: "*MemoryNetwork"
            - name: id
              type: NodeID
          name: NewMemoryTransport
          out:
            - type: "*MemoryTransport"
      - func:
          doc: MemorySPKI is the key the memory transport authenticates a node with.
          forward: svcconsensus.MemorySPKI
          in:
            - name: id
              type: NodeID
          name: MemorySPKI
          out:
            - type: "[32]byte"
      - func:
          doc: LeaderHint reads the known leader from a NOT_LEADER (R7-10).
          forward: svcconsensus.LeaderHint
          in:
            - name: err
              type: error
          name: LeaderHint
          out:
            - type: NodeID
            - type: bool
      - func:
          doc: TokenOf reads the committed token an error carries (R7-10).
          forward: svcconsensus.TokenOf
          in:
            - name: err
              type: error
          name: TokenOf
          out:
            - type: TokenValue
            - type: bool
      - func:
          doc: AppendMessage appends m's frame to dst.
          forward: wire.AppendMessage
          in:
            - name: dst
              type: "[]byte"
            - name: m
              type: "*MessageValue"
          name: AppendMessage
          out:
            - type: "[]byte"
        note: The wire codecs are the service's, re-exported (R7-05).
      - func:
          doc: "ParseMessage decodes a frame: FRAME_INVALID, VERSION_UNSUPPORTED."
          forward: wire.ParseMessage
          in:
            - name: frame
              type: "[]byte"
            - name: m
              type: "*MessageValue"
          name: ParseMessage
          out:
            - type: error
      - func:
          doc: AppendSnapshotMeta appends the encoding of m.
          forward: wire.AppendSnapshotMeta
          in:
            - name: dst
              type: "[]byte"
            - name: m
              type: "*SnapshotMetaValue"
          name: AppendSnapshotMeta
          out:
            - type: "[]byte"
      - func:
          doc: |-
            ParseSnapshotMeta decodes a SnapshotMeta: version 1, or version 2 or
            3 once its trailing CRC-32C holds.
          forward: wire.ParseSnapshotMeta
          in:
            - name: b
              type: "[]byte"
            - name: m
              type: "*SnapshotMetaValue"
          name: ParseSnapshotMeta
          out:
            - type: error
      - func:
          doc: AppendToken appends the 41-byte encoding of t.
          forward: wire.AppendToken
          in:
            - name: dst
              type: "[]byte"
            - name: t
              type: TokenValue
          name: AppendToken
          out:
            - type: "[]byte"
      - func:
          doc: ParseToken decodes a token.
          forward: wire.ParseToken
          in:
            - name: b
              type: "[]byte"
          name: ParseToken
          out:
            - type: TokenValue
            - type: error
      - doc: The sentinels a caller matches with errors.Is or errs.HasCode.
        var:
          - name: ConsensusMisconfigured
            reexport: coreconsensus.ConsensusMisconfigured
            type: "*errs.Error"
          - name: NotLeader
            reexport: coreconsensus.NotLeader
            type: "*errs.Error"
          - name: OutcomeUnknown
            reexport: coreconsensus.OutcomeUnknown
            type: "*errs.Error"
          - name: LeadershipUnconfirmed
            reexport: coreconsensus.LeadershipUnconfirmed
            type: "*errs.Error"
          - name: MembershipChangePending
            reexport: coreconsensus.MembershipChangePending
            type: "*errs.Error"
          - name: MembershipInvalid
            reexport: coreconsensus.MembershipInvalid
            type: "*errs.Error"
          - name: TransferFailed
            reexport: coreconsensus.TransferFailed
            type: "*errs.Error"
          - name: EntryTooLarge
            reexport: coreconsensus.EntryTooLarge
            type: "*errs.Error"
          - name: Compacted
            reexport: coreconsensus.Compacted
            type: "*errs.Error"
          - name: StateMachineFailed
            reexport: coreconsensus.StateMachineFailed
            type: "*errs.Error"
          - name: NodeStopped
            reexport: coreconsensus.NodeStopped
            type: "*errs.Error"
          - name: EntrySuperseded
            reexport: coreconsensus.EntrySuperseded
            type: "*errs.Error"
          - name: Overloaded
            reexport: coreconsensus.Overloaded
            type: "*errs.Error"
          - name: VersionUnsupported
            reexport: coreconsensus.VersionUnsupported
            type: "*errs.Error"
          - name: NodeIDRetired
            reexport: coreconsensus.NodeIDRetired
            type: "*errs.Error"
          - name: NoSpace
            reexport: coreconsensus.NoSpace
            type: "*errs.Error"
          - name: ResultTypeMismatch
            reexport: coreconsensus.ResultTypeMismatch
            type: "*errs.Error"
          - name: PayloadVersionRefused
            reexport: coreconsensus.PayloadVersionRefused
            type: "*errs.Error"
          - name: LineageMismatch
            reexport: coreconsensus.LineageMismatch
            type: "*errs.Error"
          - name: AdminPreconditionFailed
            reexport: coreconsensus.AdminPreconditionFailed
            type: "*errs.Error"
          - name: LogCorrupt
            reexport: coreconsensus.LogCorrupt
            type: "*errs.Error"
          - name: HardStateCorrupt
            reexport: coreconsensus.HardStateCorrupt
            type: "*errs.Error"
          - name: SnapshotCorrupt
            reexport: coreconsensus.SnapshotCorrupt
            type: "*errs.Error"
          - name: StorageFailed
            reexport: coreconsensus.StorageFailed
            type: "*errs.Error"
          - name: DataDirLocked
            reexport: coreconsensus.DataDirLocked
            type: "*errs.Error"
          - name: DataDirMismatch
            reexport: coreconsensus.DataDirMismatch
            type: "*errs.Error"
          - name: PeerRejected
            reexport: coreconsensus.PeerRejected
            type: "*errs.Error"
          - name: ClusterMismatch
            reexport: coreconsensus.ClusterMismatch
            type: "*errs.Error"
          - name: FrameInvalid
            reexport: coreconsensus.FrameInvalid
            type: "*errs.Error"
          - name: SnapshotTooLarge
            reexport: coreconsensus.SnapshotTooLarge
            type: "*errs.Error"
          - name: BootstrapRefused
            reexport: coreconsensus.BootstrapRefused
            type: "*errs.Error"
          - name: TransportMisconfigured
            reexport: coreconsensus.TransportMisconfigured
            type: "*errs.Error"
          - name: RecoverRefused
            reexport: coreconsensus.RecoverRefused
            type: "*errs.Error"
          - name: LogQuarantined
            reexport: coreconsensus.LogQuarantined
            type: "*errs.Error"
          - name: RestoreRefused
            reexport: coreconsensus.RestoreRefused
            type: "*errs.Error"
          - name: DataDirInUse
            reexport: coreconsensus.DataDirInUse
            type: "*errs.Error"
          - name: JoinRefused
            reexport: coreconsensus.JoinRefused
            type: "*errs.Error"
          - name: StopMarkerPresent
            reexport: coreconsensus.StopMarkerPresent
            type: "*errs.Error"
      - alias:
          - doc: |-
              JoinReasonBinder is the sibling of a transport that carries a refused
              JOIN's reason back to the joiner.
            name: JoinReasonBinder
            target: coreconsensus.JoinReasonBinder
      - const:
          - doc: MaxJoinReasonBytes bounds the reason a JOIN refusal carries.
            name: MaxJoinReasonBytes
            reexport: svcconsensus.MaxJoinReasonBytes
            type: int
            value: "256"
      - func:
          doc: |-
            JoinRefusalReason reads the reason a refused JOIN carried back to the
            joiner: what the member's JoinAuthorizer chose to say, sanitized and at
            most MaxJoinReasonBytes, or the engine's rule. false when there is none.
          forward: svcconsensus.JoinRefusalReason
          in:
            - name: err
              type: error
          name: JoinRefusalReason
          out:
            - type: string
            - type: bool
