apiVersion: kit.kitsunium/design/v2
domain: app/i18n
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidTag identifies a language tag this domain will not resolve: the
              empty string, a subtag of an illegal length, a non-alphanumeric character,
              or a shape outside the `language[-Script][-REGION]` subset the domain
              implements. The BCP 47 constructs outside that subset — extensions,
              private-use, variants, grandfathered tags — are refused here BY NAME rather
              than parsed and dropped, because a dropped subtag changes which language
              answers without changing anything a reader can see.
            name: CodeInvalidTag
            note: "range: 0.2.30.0 - 0.2.30.255"
            value: "0x00_02_1E_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKey identifies a message key that is empty or carries a control
              character. A key is a program identifier, not prose: it is compared by byte
              equality, it appears in error fields, and — when a translation is missing —
              it is what the renderer shows on screen.
            name: CodeInvalidKey
            value: "0x00_02_1E_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidPattern identifies a message pattern the parser refuses: an
              unclosed "{", a "}" with no opening brace, an empty placeholder name, or a
              name outside [A-Za-z_][A-Za-z0-9_]*.

              It is a CONSTRUCTION-time refusal on purpose. A pattern is parsed once, when
              the catalogue is built, so a malformed translation fails at startup rather
              than on the one request that happens to reach that key.
            name: CodeInvalidPattern
            value: "0x00_02_1E_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeArgumentMissing identifies a render whose [Args] does not carry a
              placeholder the pattern names. The error names the KEY and the PLACEHOLDER
              and never a value — there is no value, and the neighbouring arguments that
              were supplied are not named either.
            name: CodeArgumentMissing
            value: "0x00_02_1E_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeMessageNotFound identifies a key no language in the resolution chain
              holds. It is an error AND the renderer still returns a string — the key
              itself — because a blank is a defect nobody reports and a key on screen is
              one everybody does. See ADR 0063 §D4.
            name: CodeMessageNotFound
            value: "0x00_02_1E_05"
        type: errs.Code
      - const:
          - doc: |-
              CodePluralFormMissing identifies a [MessageValue] asked for a CLDR category it
              does not carry. A catalogue built through internal/service/app/i18n cannot
              produce it: completeness against the language's own rules is checked when
              the catalogue is built. It remains reachable for a Message assembled by
              hand, and it is a refusal rather than a silent fall back to `other`, which
              would render a wrong sentence in a language nobody on the team reads.
            name: CodePluralFormMissing
            value: "0x00_02_1E_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidCount identifies a quantity whose CLDR operands cannot be
              derived: a negative or excessive fraction-digit count, or a value that is
              NaN or infinite.
            name: CodeInvalidCount
            value: "0x00_02_1E_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidForm identifies a CLDR category name outside the six the
              specification defines. An unknown name in a catalogue file is refused rather
              than ignored: a typo of "other" that is dropped leaves the message with no
              fallback form at all.
            name: CodeInvalidForm
            value: "0x00_02_1E_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedLanguage identifies a language this SDK has no reviewed CLDR
              plural rule for.

              It is the domain's central refusal. The alternative — falling back to
              English's `one`/`other` rules — produces a grammatically wrong sentence in
              every Slavic and Semitic language, on every page, with no symptom any test
              or monitor can see. See ADR 0063 §D1.
            name: CodeUnsupportedLanguage
            note: |-
              range: 0.3.60.0 - 0.3.60.255

              The outcomes a CONCRETE catalogue can produce and an abstract one cannot.
              The range was allocated to internal/service/app/i18n, which raises these
              codes while it builds a store, and it is declared here with the port's own
              verdicts so that every code of the domain is in one place (ADR 0160). A code
              keeps the value its allocation gave it whichever layer declares it, so the
              layer byte still reads 3.
            value: "0x00_03_3C_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCatalogInvalid identifies a catalogue that cannot be compiled: a
              duplicate tag, an entry that is neither a pattern nor a map of patterns, an
              unknown CLDR category name, or a fallback language the catalogue does not
              itself hold.
            name: CodeCatalogInvalid
            value: "0x00_03_3C_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCatalogLoadFailed identifies a catalogue directory that could not be
              read or decoded: an absent directory, an unreadable file, an unregistered
              codec format, or bytes the codec refused.
            name: CodeCatalogLoadFailed
            value: "0x00_03_3C_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeTranslationIncomplete identifies a plural message that does not carry
              every CLDR category the language it was registered under can produce — a
              Polish entry with only `one` and `other`, when Polish rules also produce
              `few` and `many`.

              It has its own code, separate from [CodeCatalogInvalid], because it is the
              one catalogue defect a reviewer cannot see by reading the file: the entry
              looks complete, and it is only incomplete relative to a rule table stored
              somewhere else.
            name: CodeTranslationIncomplete
            value: "0x00_03_3C_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeNegotiationEmpty identifies a call to build a renderer with no
              supported tags at all. It is a wiring fault: a negotiation over an empty set
              can only ever return the default, so the caller has built something that
              cannot do its job.
            name: CodeNegotiationEmpty
            value: "0x00_03_3C_05"
        type: errs.Code
    constants:
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: |-
          FormOther is the catch-all category. Every language defines it and
          every message is required to carry it.
        name: FormOther
        type: Form
        value: "0"
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: |-
          FormZero is used by languages with a distinct form for nought — Arabic
          and Latvian among them. Most languages do not have it.
        name: FormZero
        type: Form
        value: "1"
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: FormOne is the singular of languages that have one.
        name: FormOne
        type: Form
        value: "2"
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: FormTwo is the dual — Arabic, Slovenian, Welsh.
        name: FormTwo
        type: Form
        value: "3"
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: FormFew is the small-plural of the Slavic and Semitic families.
        name: FormFew
        type: Form
        value: "4"
      - blockDoc: The six categories, `other` first so it is the zero value.
        doc: |-
          FormMany is the large-plural, and in several Romance languages the
          compact-decimal form ("1 million").
        name: FormMany
        type: Form
        value: "5"
    doc: |-
      Package i18n — ranges 0.2.30.* (ADR 0063 core/app/i18n block) and 0.3.60.*
      (ADR 0063 service/app/i18n block, declared here since ADR 0160).

      Package i18n — the CLDR plural operands of a quantity.

      Package i18n — declares the sentinel *errs.Error outcomes of the domain: the
      port's own verdicts — a malformed tag, a malformed pattern, a missing
      argument, a missing key — and the outcomes only a concrete catalogue can
      produce. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.

      Package i18n — the six CLDR plural categories.

      Package i18n declares the SDK's message-translation port: the [Catalog] a
      translated message is read from, the [TagValue] that names a language, the
      [MessageValue] a translator wrote, the CLDR plural [Form] a quantity falls
      in and the [CountValue] that decides which. A core sibling admitted by
      ADR 0063.

      # What this domain is, and the four things it is not

      It renders a message a developer wrote, in the language a request asked for,
      with the plural form the quantity requires. That is the whole subject.

      It does NOT format numbers, dates, times, currencies or units; it does not
      collate, case-map, normalise or transliterate. Those are the rest of CLDR
      and they are refused BY NAME rather than half-shipped — see ADR 0063
      §"Refused by name". [Args] is therefore map[string]string: a caller
      substitutes a number by formatting it, and the SDK never pretends the
      formatting was locale-aware when it was not. An Args of `any` would apply Go
      verbs to a French quantity and print "1234.5", which is a bug that looks
      like a feature until it reaches Europe.

      # The plural rules follow the MESSAGE, not the request

      This is the decision the domain exists to get right. When a request asks for
      Polish and the key was never translated into Polish, the renderer serves the
      message it does have — say the English one. The plural form must then be
      selected with ENGLISH rules, because the English message carries `one` and
      `other` and nothing else. Selecting with Polish rules would ask that message
      for `few`, which it does not have, and the caller would get either a crash,
      a blank, or — worst — the `other` form silently standing in for `few`, which
      is a grammatically wrong sentence in a language nobody on the team reads.

      So the rules are a property of the language that ANSWERED. See ADR 0063 §D3.

      # A message is complete for its language, or it is refused at load time

      A catalogue entry for a language whose rules can produce `few` and does not
      carry a `few` pattern is refused when the catalogue is BUILT, naming the key
      and the form. It is not repaired at render time by falling back to `other`,
      because that repair produces a wrong sentence that nothing observes: the
      page renders, the tests pass, and a Polish reader sees a number agreement
      error on every page. Startup is the only place the fault is cheap.

      # Where the pieces live

      This package owns the values, the ports and the typed refusals. The plural
      rule TABLE, the concrete catalogue, the Accept-Language negotiation and the
      renderer live in internal/service/app/i18n, because a table of thirteen
      languages is a fact about the world rather than a contract — and so do the
      parser of a written tag and the compiler of a pattern's text, because
      reading a format is a mechanism (ADR 0160). What they produce is assembled
      here, by [NewTag], [NewPattern] and [NewCompiledMessage], which hold every
      value to its own invariants whoever builds it.

      Package i18n — the message-source port and its two ADR 0039 siblings.

      Package i18n — the message key, the compiled message, and its rendering.

      Package i18n — a compiled message body, and the placeholder-name grammar it
      holds its spans to.

      Package i18n — the language tag, and the BCP 47 subset it admits.
    functions:
      - doc: |-
          Int returns the [CountValue] of an exact integer, displayed with no fraction
          digits. It cannot fail.

          The sign is discarded, because CLDR's operands are defined on the absolute
          value. It is discarded here rather than in each of thirteen rules, so a rule
          cannot forget.
        in:
          - name: "n"
            type: int64
        name: Int
        out:
          - type: CountValue
      - doc: |-
          Decimal returns the [CountValue] of value displayed with exactly
          fractionDigits fraction digits, or [InvalidCount].

          fractionDigits is the DISPLAY precision, not a property of value: passing
          (1, 2) describes "1.00", which is `other` in English, while passing (1, 0)
          describes "1", which is `one`. That is the operand v, and it is the caller's
          to state because only the caller knows how the number will be written.

          Rounding carries, exactly as a formatter's would: Decimal(0.999, 2)
          describes "1.00" and reports an integer part of 1, not 0. Getting that wrong
          would make the SDK disagree with the string beside it on the page.
        in:
          - name: value
            type: float64
          - name: fractionDigits
            type: int
        name: Decimal
        out:
          - name: count
            type: CountValue
          - name: err
            type: error
      - doc: |-
          ParseForm returns the [Form] named by the CLDR spelling in name, or
          [InvalidForm].

          An unknown name is REFUSED rather than ignored. A catalogue entry that
          spells "otehr" and is dropped leaves the message with no `other` pattern at
          all — and `other` is the one form every message must carry, so the typo
          would surface as a missing translation in a language that was translated.
        in:
          - name: name
            type: string
        name: ParseForm
        out:
          - name: form
            type: Form
          - name: err
            type: error
      - doc: |-
          ValidateKey reports whether key is usable, and returns [InvalidKey] when it
          is not.

          The rule is deliberately thin — non-empty, no ASCII control characters — and
          it does not impose a dotted grammar, a namespace or a case convention.
          Those are the application's spelling, and an SDK that imposed one would make
          half the catalogues in existence unloadable to buy nothing. What it does
          close is the pair of characters that make a key unsafe to SHOW: a newline
          splits a log line in two, and a terminal escape rewrites the line above it.
        in:
          - name: key
            type: Key
        name: ValidateKey
        out:
          - type: error
      - doc: |-
          NewCompiledMessage assembles a [MessageValue] from bodies already compiled,
          or returns [PluralFormMissing] or [InvalidForm].

          other is the [FormOther] body every message carries — a message whose
          other was never compiled is refused, because `other` is the category every
          language defines and the only one a message is required to carry. plural
          holds the remaining categories, ascending and distinct, and is empty for a
          message with no plural forms. plural is RETAINED, not copied, like the
          spans [NewPattern] keeps.

          It compiles nothing: reading a pattern's text is the compiler's, in
          internal/service/app/i18n, whose NewMessage and NewPluralMessage call this
          (ADR 0160: a wire format is a mechanism). And it does NOT check the
          categories against a language's rules — it does not know the language.
          Completeness against the rules of the language a catalogue registers the
          message under is checked by internal/service/app/i18n.NewStore, which does.
        in:
          - name: other
            type: PatternValue
          - name: plural
            type: "[]FormPatternValue"
        name: NewCompiledMessage
        out:
          - name: message
            type: MessageValue
          - name: err
            type: error
      - doc: |-
          NewPattern assembles a compiled body from its spans, or returns
          [InvalidPattern].

          It parses nothing. Reading a pattern's TEXT — the braces, the "{{" and "}}"
          escapes, and every construct the syntax refuses by name — is the compiler's,
          in internal/service/app/i18n (ADR 0160: a wire format is a mechanism). What
          is checked here is what makes a list of spans a pattern at all: every span
          is literal text or a placeholder and never both, and every placeholder name
          is one [ValidPlaceholder] accepts, so a render never meets a name no caller
          could have supplied.

          parts is RETAINED, not copied: the caller hands it over and does not modify
          it afterwards. The compiler builds a fresh list per pattern, and a copy would
          cost an allocation per message at every catalogue load.
        in:
          - name: parts
            type: "[]PartValue"
        name: NewPattern
        out:
          - name: body
            type: PatternValue
          - name: err
            type: error
      - doc: |-
          ValidPlaceholder reports whether name matches [A-Za-z_][A-Za-z0-9_]*.

          The grammar is narrow on purpose. It is the set of names that can be written
          in every catalogue format the codec domain speaks without quoting, that can
          appear in an error field without escaping, and that cannot be confused with
          a format specifier — so a translator who writes "{count:02d}" is told the
          name is invalid rather than handed a placeholder literally called
          "count:02d" that no caller will ever supply. It is the compiler's test for a
          name, and [NewPattern]'s for a span.
        in:
          - name: name
            type: string
        name: ValidPlaceholder
        out:
          - type: bool
      - doc: |-
          NewTag assembles a [TagValue] from its subtags, or returns [InvalidTag].

          language is mandatory: 2 or 3 ASCII letters. script is empty or 4 ASCII
          letters; region is empty, 2 ASCII letters or 3 ASCII digits. That is exactly
          the `language[-Script][-REGION]` shape this domain admits, and the case is
          normalised — lowercase language, Titlecase script, UPPERCASE alpha region —
          because a tag differing only in case is the same language, and two tags for
          one language would split a catalogue in half.

          It reads no text. Splitting a written tag into its subtags, and refusing BY
          NAME everything BCP 47 or RFC 4647 can spell outside the subset — the POSIX
          spelling, extensions, variants, private use, ranges — is the parser's,
          internal/service/app/i18n's ParseTag (ADR 0160: a wire format is a
          mechanism). What is checked here is what makes a TagValue a tag at all,
          whoever assembles it, so no path into the type skips it.
        in:
          - name: language
          - name: script
          - name: region
            type: string
        name: NewTag
        out:
          - name: tag
            type: TagValue
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/i18n
    ports:
      - doc: |-
          Catalog is a source of translated messages, FROZEN at two methods
          (ADR 0039). pkg/v1/app/i18n aliases it, Go interfaces are structural, and adding
          a third method would break every downstream two-method double at compile
          time with no deprecation window.

          # Lookup is EXACT and does nothing clever

          It answers for the pair it was handed and performs no fallback, no parent
          truncation ("fr-CA" does not become "fr") and no plural selection. Every one
          of those is a policy: which language stands in for which, and whether a
          missing translation is an error or a silent substitution. A Catalog that
          decided them would decide them for every caller, and the decision would be
          invisible at the call site.

          The walk therefore lives in exactly one place — internal/service/app/i18n's
          renderer — which knows which tag actually answered and can pick that
          language's plural rules. See the package comment.

          Implementations MUST be safe for concurrent use and MUST NOT mutate after
          construction: one Catalog is shared by every goroutine serving a request.
        methods:
          - doc: |-
              Lookup returns the message registered for exactly (tag, key), and
              reports whether there was one.
            in:
              - name: tag
                type: TagValue
              - name: key
                type: Key
            name: Lookup
            out:
              - name: message
                type: MessageValue
              - name: ok
                type: bool
          - doc: |-
              Tags reports every tag this catalog can answer for, sorted by their
              canonical string so the order is stable across runs.
            name: Tags
            out:
              - type: "[]TagValue"
        name: Catalog
      - doc: |-
          KeyLister is an ADR 0039 sibling: a [Catalog] that can enumerate the keys it
          holds for a tag. It is discovered by type assertion, exactly as codec's
          Appender and cache's Tagger are, so [Catalog] stays frozen at two methods.

          It exists for one job, and that job is a test rather than a request: a
          caller compares the key set of its fallback language against the key set of
          every other, and fails its own suite when a translation is missing. That
          moves "this string was never translated" from a report a user writes to a
          build that does not go out — which is the only place the SDK can help,
          because at render time the string is already missing and something has to be
          shown.
        embeds:
          - Catalog
        methods:
          - doc: |-
              Keys reports the keys held for tag, sorted, or nil when the catalog
              does not know the tag at all.
            in:
              - name: tag
                type: TagValue
            name: Keys
            out:
              - type: "[]Key"
        name: KeyLister
      - doc: |-
          Fallbacker is an ADR 0039 sibling: a [Catalog] that names the language it
          falls back to when a key is absent from the one requested.

          It is a sibling and not a [Catalog] method because a catalog that has no
          fallback is a legitimate, useful thing — a bundle for one language, or a
          test double — and the absence of the method is how a renderer finds out,
          rather than a zero [TagValue] it would have to interpret. That is ADR 0039's
          shape and ADR 0052's lesson: the in-process lease implements Deadliner and
          the file lease does not, and the absence IS the answer.
        embeds:
          - Catalog
        methods:
          - doc: |-
              Fallback reports the tag this catalog falls back to. It is never the
              zero TagValue: a catalog that has no fallback does not implement this
              interface.
            name: Fallback
            out:
              - type: TagValue
        name: Fallbacker
    sentinels:
      - doc: |-
          The Publics below name the KEY, the PLACEHOLDER, the FORM and the TAG — the
          developer's own identifiers, which appear in the catalogue file the
          developer wrote — and never an [Args] VALUE.

          That asymmetry is the security property, and it is the same one
          internal/core/app/validation, internal/core/security/authz and internal/service/app/view each
          state for themselves. A value is the untrusted half: a username, a filename,
          an account number, a token someone pasted into a form. An identifier is the
          trusted half and is useless to an attacker who can already read the binary.

          TestNoErrorEverNamesAnArgumentValue is the executable guard: it drives every
          error path in this package with a recognisable secret as an argument value
          and asserts the secret appears in neither Error(), Public(), Private(), nor
          any field.
        var:
          - code: CodeInvalidTag
            doc: |-
              InvalidTag is returned for a tag outside the subset this domain
              resolves: by [NewTag] for a subtag of the wrong shape, and by the parser
              of a written tag, internal/service/app/i18n's ParseTag, for everything
              BCP 47 can spell outside `language[-Script][-REGION]`.

              It is deliberately NOT what an unparsable Accept-Language element
              produces. That header is written by a stranger, and RFC 4647 §3.4
              prescribes exactly one response to a malformed range — ignore it — so
              internal/service/app/i18n's negotiation skips the element and never
              surfaces an error. Failing a request because a browser sent a peculiar
              header is the mistake ADR 0051 already refused for `traceparent`.
            name: InvalidTag
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: ParseTag refused a tag outside the language[-Script][-REGION] subset; the fields carry the tag and the reason"
            public: The language tag is not one this SDK resolves
            reason: INVALID_TAG
          - code: CodeInvalidKey
            doc: |-
              InvalidKey is returned when a message key is empty or carries a control
              character.
            name: InvalidKey
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: a message key must be non-empty and free of control characters — it is compared by byte equality and is shown on screen when a translation is missing"
            public: The message key is empty or contains a control character
            reason: INVALID_KEY
          - code: CodeInvalidPattern
            doc: |-
              InvalidPattern is returned for a pattern the placeholder parser refuses
              — by the compiler behind internal/service/app/i18n's NewMessage and
              NewPluralMessage — and by [NewPattern] for spans that are not a pattern.
            name: InvalidPattern
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: the pattern carries an unclosed brace, an unmatched closing brace, an empty placeholder or a placeholder name outside [A-Za-z_][A-Za-z0-9_]*"
            public: The message pattern is malformed and was refused
            reason: INVALID_PATTERN
          - code: CodeArgumentMissing
            doc: |-
              ArgumentMissing is returned by [MessageValue.Format] when [Args] does not
              carry a placeholder the pattern names.

              It is an error rather than an empty substitution because an empty
              substitution renders "Welcome, " and ships. The name of the absent
              placeholder travels as a field; no other argument is named, and no
              value is.
            name: ArgumentMissing
            private: "core/app/i18n: Format found a placeholder with no matching entry in Args; the fields carry the placeholder name and never any argument value"
            public: A placeholder the message names was not supplied
            reason: ARGUMENT_MISSING
          - code: CodeMessageNotFound
            doc: |-
              MessageNotFound is returned when no language in the resolution chain
              holds the key.

              The renderer returns it ALONGSIDE a non-empty string — the key. A
              caller that checks the error fails the render; a caller that ignores it
              ships "checkout.button.pay" to the screen, which is visible, greppable
              and obviously wrong. The alternative, an empty string, is a blank space
              nobody files a bug about.
            name: MessageNotFound
            private: "core/app/i18n: the key was absent from the requested language, from its parents and from the fallback; the fields carry the key and the tags tried"
            public: No translation exists for this message key
            reason: MESSAGE_NOT_FOUND
          - code: CodePluralFormMissing
            doc: |-
              PluralFormMissing is returned by [MessageValue.Format] for a CLDR category
              the message does not carry.
            name: PluralFormMissing
            private: "core/app/i18n: Format was asked for a CLDR category the message has no pattern for; a catalogue built by internal/service/app/i18n cannot produce this — completeness is checked at load"
            public: The message does not carry the plural form this quantity requires
            reason: PLURAL_FORM_MISSING
          - code: CodeInvalidCount
            doc: |-
              InvalidCount is returned by [Decimal] for a quantity whose CLDR
              operands cannot be derived.
            name: InvalidCount
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: Decimal received a NaN, an infinity, or a fraction-digit count outside 0..maxFractionDigits"
            public: The quantity cannot be described by CLDR plural operands
            reason: INVALID_COUNT
          - code: CodeInvalidForm
            doc: |-
              InvalidForm is returned by [ParseForm] for a category name outside the
              six CLDR defines.
            name: InvalidForm
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: ParseForm accepts exactly zero, one, two, few, many and other — an unknown name is refused rather than ignored, since a typo of other leaves no fallback form"
            public: The plural category name is not one of the six CLDR defines
            reason: INVALID_FORM
          - code: CodeUnsupportedLanguage
            doc: |-
              UnsupportedLanguage is returned when a catalogue registers a language
              this SDK has no reviewed CLDR plural rule for.

              It is a CONSTRUCTION-time refusal and it is the point of the domain.
              The tempting alternative is to fall back to English's two categories,
              which "works" — the page renders, the tests pass, nothing is logged —
              and puts a number-agreement error into every Polish, Russian and Arabic
              sentence the application will ever print. Nobody on an English-speaking
              team can see that reading the diff, and the users who can see it have
              no way to report it that reaches the right file.

              So the language is named, the supported set is named beside it, and the
              program does not start. Adding a language is a rule plus its CLDR
              citation plus its table test, in one change — see
              internal/service/app/i18n/CLAUDE.md §Adding a language.
            name: UnsupportedLanguage
            note: |-
              The outcomes a CONCRETE catalogue can produce and an abstract one cannot,
              raised by internal/service/app/i18n while a store is being BUILT. Every one
              carries exitConfig: the same files will be refused forever, and the fix is
              an edit to a catalogue or to the rule table, never a retry. They are
              declared here, with the port's verdicts, so that the domain's codes and
              sentinels are in one place (ADR 0160).
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the language has no entry in the hand-written CLDR rule table; the fields carry the tag and the supported set — a silent fall back to English rules would render a wrong sentence in every language with few or many"
            public: No reviewed plural rule exists for this language
            reason: UNSUPPORTED_LANGUAGE
          - code: CodeCatalogInvalid
            doc: |-
              CatalogInvalid is returned by NewStore for a catalogue it cannot
              compile. The fields name the tag, the key and what was wrong.
            name: CatalogInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: NewStore received a catalogue with a duplicate tag, an entry of the wrong shape, an unknown CLDR category, or a fallback language it does not itself hold"
            public: The message catalogue is not usable and was refused
            reason: CATALOG_INVALID
          - code: CodeCatalogLoadFailed
            doc: |-
              CatalogLoadFailed is returned by LoadFS when the catalogue directory
              cannot be read or its bytes cannot be decoded.

              The cause is wrapped rather than replaced, so errors.Is against
              fs.ErrNotExist and fs.ErrPermission keeps answering — the same
              discipline internal/service/data/vfs applies to its read failures.
            name: CatalogLoadFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: LoadFS could not list the directory, read a file, resolve the codec format, or decode a catalogue file; the fields carry the path and the cause"
            public: The message catalogue could not be read or decoded
            reason: CATALOG_LOAD_FAILED
          - code: CodeTranslationIncomplete
            doc: |-
              TranslationIncomplete is returned by NewStore for a plural message that
              does not carry every CLDR category its language can produce.

              This is the check a translator cannot perform by reading their own
              file: a Polish entry with `one` and `other` looks finished, and is
              incomplete only against a rule table stored elsewhere. Deferring it to
              render time would mean discovering it on the request that first needed
              `few` — in production, in a language the on-call engineer does not
              read — and the only repair available there is to show something wrong.
            name: TranslationIncomplete
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the message does not carry every CLDR category the registered language's rules can produce; the fields carry the tag, the key and the missing form"
            public: A plural message is missing a form its language requires
            reason: TRANSLATION_INCOMPLETE
          - code: CodeNegotiationEmpty
            doc: |-
              NegotiationEmpty is returned when a negotiation is set up over no
              supported tags at all.

              ADR 0031's refuse half: an empty set is not "accept anything" and it is
              not "always the default" — it is an unfinished wiring, and both
              readings would hide it behind a working-looking program.
            name: NegotiationEmpty
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the supported set was empty, so every negotiation could only return the default — a wiring fault, refused rather than honoured"
            public: Language negotiation was set up with no supported languages
            reason: NEGOTIATION_EMPTY
    types:
      - doc: |-
          CountValue is a quantity described by the CLDR plural operands, which is
          what a plural rule actually reads — never the Go number the caller started
          with. pkg/v1/app/i18n publishes it as `Count`.

          # Why the caller states the DISPLAY precision

          CLDR's rules distinguish 1 from 1.0. In English "1 file" is `one` and
          "1.0 files" is `other`, because the operand v — the number of fraction
          digits VISIBLE to the reader — is 0 in the first and 1 in the second. A
          float64 cannot carry that difference: 1.0 and 1 are the same bits. So the
          caller supplies it, and [Int] is the shorthand for "no fraction digits".

          # The four operands implemented, and the four refused BY NAME

          Implemented: n (the absolute value), i (its integer part), v (the count of
          visible fraction digits) and f (those digits as an integer). Together they
          decide every rule of every language in this domain's supported set, which is
          a checkable claim rather than a hope — see internal/service/app/i18n.

          Refused by name: w and t (the fraction digits with trailing zeros removed)
          and c/e (the compact-decimal exponent). No rule in the supported set reads
          w or t. c and e are refused for a harder reason: they exist to describe
          "1M" and "1,2 mln", and this domain ships no compact-decimal formatter, so
          an exponent could only ever be 0 here. The Romance `many` category, whose
          CLDR clause is written in terms of e, is therefore implemented at e = 0 —
          see internal/service/app/i18n's rule table, which says so at each of the four
          call sites.

          The zero CountValue is the quantity zero with no fraction digits, which is a
          perfectly good quantity: "0 files" is a sentence, and refusing to describe
          it would make the zero value an obstacle rather than a hazard.
        methods:
          - doc: |-
              IntegerPart returns CLDR operand i: the integer digits of the absolute
              value.
            name: IntegerPart
            out:
              - type: uint64
            recv: value
          - doc: |-
              FractionValue returns CLDR operand f: the visible fraction digits read as an
              integer, trailing zeros included. Decimal(1.50, 2) reports 50.
            name: FractionValue
            out:
              - type: uint64
            recv: value
          - doc: |-
              VisibleFractionDigits returns CLDR operand v: how many fraction digits the
              reader sees. Decimal(1, 2) reports 2 even though the value is an integer.
            name: VisibleFractionDigits
            out:
              - type: int
            recv: value
          - doc: |-
              IsIntegerValued reports whether operand n equals operand i — that is,
              whether the visible fraction digits are all zero.

              It is the shape every "n = k" and "n % k = a..b" CLDR clause needs, and
              having it here means no rule computes a float. Decimal(1.0, 1) is integer
              valued (n is 1, v is 1), which is precisely why v and f are separate
              operands.
            name: IsIntegerValued
            out:
              - type: bool
            recv: value
        name: CountValue
        struct:
          unexported: true
      - doc: |-
          Form is a CLDR plural category: one of the six names the Unicode plural
          rules assign a quantity to.

          [FormOther] is the ZERO value, and that is ADR 0031's "the zero value is the
          safe one" rather than an accident of ordering. CLDR guarantees every
          language defines `other`; it is the only category that is always present, so
          a [PluralRule] that forgets to set a result names the one form every message
          is required to carry — instead of naming `zero`, which most languages do not
          have and which would turn a forgotten return into a lookup miss.
        methods:
          - doc: |-
              String returns the CLDR spelling of the category, or "invalid" for a value
              outside the six.

              "invalid" rather than a number, and never a silent "other": a corrupt Form
              reaching a log must not read as if it were a category, which is the same
              rule internal/core/security/authz applies to a corrupt Decision.
            name: String
            out:
              - type: string
            recv: value
          - doc: Valid reports whether f is one of the six categories CLDR defines.
            name: Valid
            out:
              - type: bool
            recv: value
        name: Form
        underlying: uint8
      - doc: |-
          PluralRule reports which CLDR category a quantity falls in for ONE language.

          It is a FUNC port rather than an interface, which satisfies ADR 0039
          structurally: a func type cannot grow a method at all, so publishing it
          through pkg/v1/app/i18n cannot break a downstream implementation later. It is
          the shape internal/core already uses for resilience.Operation,
          scheduler.Job, lifecycle.Start, validation.Constraint and authz.Policy.

          A rule MUST be total: every [CountValue] maps to a category, and the
          category is [FormOther] whenever no other clause matches. CLDR guarantees
          `other` exists in every language, which is why [FormOther] is the zero
          [Form] — ADR 0031's "the zero value is the safe one" applied to a port with
          no constructor to refuse in.
        name: PluralRule
        underlying: func(count CountValue) Form
      - doc: |-
          Args binds placeholder names to the text that replaces them.

          It is map[string]string and deliberately not map[string]any. The values are
          substituted verbatim, so a caller that wants a number formatted for a locale
          must format it — and discovers, at the call site, that this SDK does not
          ship a locale-aware number formatter. An `any` here would call Go's default
          formatting instead and produce "1234.5" for a French reader, which is the
          same bug with the discovery removed.

          # Where the values may come from, and where the PATTERNS may not

          A value is untrusted: it is a username, a filename, a count. It is inserted
          literally and is never parsed, so a value containing "{other}" produces the
          six characters and no second substitution. That is a property with a test.

          A message PATTERN is trusted input — it comes from a catalogue file the
          developer ships, next to the code. A pattern assembled from user input would
          let that user name a placeholder the caller happens to pass and read its
          value; the domain cannot detect that and does not try. See ADR 0063
          §"What is NOT guaranteed".

          # Nothing here escapes anything

          A rendered message is a string, never a trusted-HTML type. Placing it in a
          page goes through internal/service/app/view (ADR 0058), whose contextual
          escaping is aware of where the cursor is; escaping here as well would
          double-escape every apostrophe in every French sentence in the catalogue.
        name: Args
        underlying: map[string]string
      - doc: |-
          Key names a message inside a catalogue. It is a program identifier the
          developer chooses — "checkout.button.pay" — and never prose: it is compared
          by byte equality, it travels in error fields, and it is what the renderer
          puts on screen when the translation is missing. That last use is why an
          empty key is refused: a blank on screen is a defect nobody reports.
        name: Key
        underlying: string
      - doc: |-
          MessageValue is one translated message, compiled: its placeholders are
          parsed once, when the catalogue is built, so a malformed pattern fails at
          startup and a render never parses anything. pkg/v1/app/i18n publishes it as
          `Message`.

          A MessageValue ALWAYS carries the [FormOther] pattern — the one category
          CLDR guarantees in every language — and carries the other five only when the
          translator supplied them. The zero MessageValue carries nothing and reports
          [PluralFormMissing] from [MessageValue.Format]; it is not an empty
          translation.

          A MessageValue does not know which language it is written in. That is
          deliberate: the renderer walks the fallback chain and therefore already
          knows which language answered, and storing the tag here would put a second
          copy of that fact where nothing checks it against the first. See the package
          comment on why the plural rules follow the message.
        methods:
          - doc: |-
              Format renders the pattern registered for form, substituting args.

              It returns [PluralFormMissing] when the message does not carry form, and
              [ArgumentMissing] when a placeholder the pattern names is absent from args.
              Neither error names an argument value.

              A SURPLUS argument is ignored, deliberately and asymmetrically. One Args map
              is handed to every language in turn, and languages legitimately use
              different subsets of the placeholders a message offers: French may need a
              gender argument English does not, and refusing the extra would make the
              English render fail for a reason that lives in the French catalogue. A
              MISSING argument is the opposite — it is a hole in the sentence being
              rendered right now — so it is an error.

              Substitution is literal and single-pass: a value containing "{name}"
              produces those six characters and is never rescanned. Nothing is escaped
              here; see [Args].
            in:
              - name: form
                type: Form
              - name: args
                type: Args
            name: Format
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: value
          - doc: |-
              HasForm reports whether the message carries a pattern for form.

              It is what internal/service/app/i18n's load-time completeness check reads: for
              each category the registered language's rules can produce, the message must
              answer true, or the catalogue is refused naming the key and the category.
            in:
              - name: form
                type: Form
            name: HasForm
            out:
              - type: bool
            recv: value
          - doc: |-
              IsPlural reports whether the message carries any category beyond
              [FormOther].
            name: IsPlural
            out:
              - type: bool
            recv: value
        name: MessageValue
        struct:
          unexported: true
      - doc: |-
          FormPatternValue pairs a CLDR category with the compiled body that spells
          it, as a plural message carries it.

          It is a slice element rather than a map entry because a message carries at
          most five of these: a linear scan over five values in one cache line beats a
          hash, and it allocates nothing on the render path.
        name: FormPatternValue
        struct:
          fields:
            - doc: |-
                Form is the category. [FormOther] is never one of these: a message
                carries its `other` body out of line, and [NewCompiledMessage] refuses
                it here.
              name: Form
              type: Form
            - doc: Body is the compiled pattern for the category.
              name: Body
              type: PatternValue
      - doc: |-
          PartValue is one span of a compiled pattern: literal Text, or the Name of a
          placeholder. Exactly one of the two is set — [NewPattern] refuses a span
          that sets both or neither.

          The two are told apart by which field is EMPTY rather than by a kind tag:
          a placeholder name can never be empty, and a literal span never carries
          one. One less byte per span and one less branch per render.
        name: PartValue
        struct:
          fields:
            - doc: Text is the literal span. It is empty for a placeholder.
              name: Text
              type: string
            - doc: Name is the placeholder name. It is empty for a literal span.
              name: Name
              type: string
      - doc: |-
          PatternValue is one compiled message body: the spans a pattern's text was
          parsed into, in order.

          Its zero value is a pattern that was NEVER compiled, and it is not an empty
          one: a [MessageValue] holding it reports [PluralFormMissing] rather than
          rendering "" and looking like a translation. NewPattern(nil) is the empty
          pattern, compiled.
        name: PatternValue
        struct:
          unexported: true
      - doc: |-
          TagValue is a language, optionally narrowed by a script and a region:
          exactly the `language[-Script][-REGION]` shape of BCP 47 and deliberately
          nothing else. pkg/v1/app/i18n publishes it as `Tag`.

          It is a comparable struct, so it is a map key and an == operand, and it
          holds its canonical spelling, so [TagValue.String] allocates nothing. The
          zero TagValue is the absence of a tag: [TagValue.IsZero] reports it and
          [TagValue.String] renders "". ADR 0031 is honoured by REFUSAL rather than by
          a default — no constructor in this domain reads a zero tag as "use English",
          because the SDK choosing a language for an application is exactly the silent
          wrong answer the domain exists to prevent.
        methods:
          - doc: |-
              String returns the canonical spelling, or "" for the zero tag. It allocates
              nothing: the canonical form is what the tag holds.
            name: String
            out:
              - type: string
            recv: value
          - doc: IsZero reports whether t names no language.
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              Language returns the lowercase language subtag, or "" for the zero tag.

              It is the key CLDR plural rules are resolved on — the rules of "fr-CA" are
              the rules of "fr" — with the handful of region-specific exceptions CLDR
              defines handled by an exact-tag entry in internal/service/app/i18n's table.
            name: Language
            out:
              - type: string
            recv: value
          - doc: Script returns the Titlecase script subtag, or "" when the tag carries none.
            name: Script
            out:
              - type: string
            recv: value
          - doc: |-
              Region returns the UPPERCASE alpha-2 or numeric region subtag, or "" when
              the tag carries none.
            name: Region
            out:
              - type: string
            recv: value
          - doc: |-
              Parent removes the most specific subtag and reports whether one was removed:
              "fr-Latn-CA" → "fr-Latn" → "fr" → (zero tag, false).

              It is the truncation RFC 4647 §3.4 Lookup performs, and it is a value
              operation rather than a negotiation policy, so it lives here. It allocates
              nothing: the parent's canonical form is a prefix of the child's.

              RFC 4647 §3.4 also says a single-character subtag is skipped rather than
              used as a lookup key, because a lone "u" or "x" is an extension singleton
              and not a language. This subset admits no single-character subtag at all, so
              the rule is satisfied by the grammar and there is nothing to skip — stated
              here because a reader comparing this code to the RFC will look for it.
            name: Parent
            out:
              - name: parent
                type: TagValue
              - name: ok
                type: bool
            recv: value
        name: TagValue
        struct:
          unexported: true
  - doc: |-
      Package i18n — the RFC 9110 Accept-Language header parser.

      Package i18n — a catalogue entry, in the two shapes a catalogue file has.

      Package i18n — the one error this package builds rather than declares. The
      domain's codes and sentinels — the port's verdicts and the outcomes only a
      concrete catalogue can produce — are declared in internal/core/app/i18n
      (ADR 0160); this file holds failLoad, which raises CATALOG_LOAD_FAILED over
      the filesystem's or the codec's own error.

      Package i18n — loading a catalogue directory through the codec domain.

      Package i18n — a message compiled from the text a translator wrote.

      Package i18n — Accept-Language negotiation: RFC 9110 parsing over RFC 4647
      matching.

      Package i18n — the language negotiator a server builds once and uses on
      every request.

      Package i18n — the placeholder syntax, compiled once at catalogue load.

      Package i18n — the placeholder parser, run once per catalogue entry.

      Package i18n — the hand-written CLDR plural rules, and the languages this
      SDK will speak.

      Package i18n — one language's CLDR plural specification.

      Package i18n — the renderer: one language, one resolution chain.

      Package i18n — the resolution chain a [Printer] walks.

      Package i18n — the concrete catalogue, and everything it refuses at load.

      Package i18n — the compile-time proof that [Store] satisfies the port and
      both of its ADR 0039 siblings.

      The assertions live in their own file rather than beside the type because a
      port change must fail the build HERE, at a declaration whose only purpose is
      to say what Store claims to be, rather than at whichever call site happened
      to pass one first.

      Package i18n — the parser of a written language tag: the BCP 47 subset this
      domain admits, and everything outside it refused BY NAME.
    functions:
      - doc: Plain returns an uncounted [EntryValue].
        in:
          - name: text
            type: string
        name: Plain
        out:
          - type: EntryValue
      - doc: |-
          PluralForms returns a counted [EntryValue] whose patterns are keyed by CLDR
          category name.

          A non-nil, EMPTY map still marks the entry counted, and is refused at load
          for missing `other` — which is the honest answer to a translator who wrote
          `"cart.items": {}`.
        in:
          - name: forms
            type: map[string]string
        name: PluralForms
        out:
          - type: EntryValue
      - doc: |-
          LoadFS reads one catalogue file per language from dir and returns a [Store].

          # It invents no file format

          The bytes are decoded by the codec domain — [codec.Lookup] on the format the
          caller names — so a catalogue is JSON, YAML, TOML, CBOR, MessagePack or any
          of the other formats internal/service/data/codec registers, and this package
          contains no parser. The codec must be registered: blank-import pkg/v1/data/codec,
          exactly as internal/service/app/config.FileSource requires. An unregistered
          format is [corei18n.CatalogLoadFailed] rather than a panic or a silent empty
          catalogue.

          # It invents no filesystem either

          fsys is io/fs.FS, which is internal/core/data/vfs.FS unchanged — the ADR 0056
          alias — so an embed.FS, an os.DirFS, a vfs.NewOS root and a vfs.NewMem all
          work here with no adapter and this package imports neither vfs nor os. A
          catalogue compiled into the binary and a catalogue on disk are the same
          call.

          # The tag comes from the file NAME

          "en.json" is English, "pt-PT.yaml" is European Portuguese. The base name
          minus its extension is parsed by [ParseTag], so the whole refusal
          list of that function applies to filenames: "fr_FR.json" is refused, because
          accepting it would mint a second Tag for French and split the catalogue.
          Subdirectories are ignored rather than walked — a nested layout is a
          convention this package does not own, and walking one would silently pick up
          files nobody meant as catalogues.

          Two files that canonicalise to one tag ("EN.json" and "en.json") are
          [corei18n.CatalogInvalid]: one would win, the choice would depend on directory order,
          and half the strings would vanish.
        in:
          - name: fsys
            type: fs.FS
          - name: dir
            type: string
          - name: format
            type: codec.Format
          - name: fallback
            type: corei18n.TagValue
        name: LoadFS
        out:
          - name: store
            type: "*Store"
          - name: err
            type: error
      - doc: |-
          NewMessage compiles a message with no plural forms, or returns
          [corei18n.InvalidPattern].

          The pattern is text with named placeholders: "Welcome back, {name}". A
          literal brace is written "{{" or "}}". Everything else about the syntax is
          refused BY NAME — see compilePattern.
        in:
          - name: text
            type: string
        name: NewMessage
        out:
          - name: message
            type: corei18n.MessageValue
          - name: err
            type: error
      - doc: |-
          NewPluralMessage compiles a message with one pattern per CLDR category, or
          returns [corei18n.InvalidPattern], [corei18n.InvalidForm] or
          [corei18n.PluralFormMissing].

          forms MUST contain [corei18n.FormOther]: it is the category every language
          defines and the only one a message is required to carry. A map without it
          is refused here rather than at render time, because at render time the
          caller is a request and the only available repair is to show something
          wrong.

          This constructor does NOT check the map against a language's rules — it does
          not know the language. Completeness against the rules of the language a
          catalogue registers the message under is checked by [NewStore], which does.
          Both checks are at load time; neither is at render time.
        in:
          - name: forms
            type: map[corei18n.Form]string
        name: NewPluralMessage
        out:
          - name: message
            type: corei18n.MessageValue
          - name: err
            type: error
      - doc: |-
          NewNegotiator returns a [Negotiator] over supported, falling back to
          fallback, or refuses.

          Refused: an empty supported set ([corei18n.NegotiationEmpty] — ADR 0031's refuse
          half, since an empty set is an unfinished wiring rather than "accept
          anything"), a zero fallback ([corei18n.CatalogInvalid] — the SDK does not pick a
          language), and a fallback outside the supported set ([corei18n.CatalogInvalid] —
          otherwise every unmatched request resolves to a language the caller declared
          it does not serve).
        in:
          - name: supported
            type: "[]corei18n.TagValue"
          - name: fallback
            type: corei18n.TagValue
        name: NewNegotiator
        out:
          - name: negotiator
            type: "*Negotiator"
          - name: err
            type: error
      - doc: |-
          Rules returns the CLDR plural specification for tag, and reports whether the
          SDK has one.

          It resolves the exact canonical tag first and the bare language subtag
          second, so a region or script narrowing that CLDR does not distinguish
          inherits its language's rules — "fr-CA", "de-AT" and "zh-Hant" all do — and
          one that CLDR DOES distinguish gets its own, which today is "pt-PT".
        in:
          - name: tag
            type: corei18n.TagValue
        name: Rules
        out:
          - name: plural
            type: PluralValue
          - name: ok
            type: bool
      - doc: |-
          SupportedTags returns every tag [Rules] resolves exactly, sorted.

          It is what [corei18n.UnsupportedLanguage] names beside the refused tag, so the
          message a maintainer reads is "pl is not supported; ar de en es fr it ja nl
          pt pt-PT ru zh are" rather than a bare refusal.
        name: SupportedTags
        out:
          - type: "[]corei18n.TagValue"
      - doc: |-
          NewPrinter returns a [Printer] rendering tag out of catalog, or refuses.

          Refused: a zero tag ([corei18n.CatalogInvalid]) and a language with no reviewed CLDR
          rule ([corei18n.UnsupportedLanguage]). Both are wiring faults — a request never
          reaches here with an arbitrary tag, because negotiation returns one of the
          supported set — so refusing at construction costs a startup failure and buys
          a render path with no language it cannot plural.

          The chain is the requested tag, then its parents ("fr-CA" → "fr"), then —
          when catalog implements [corei18n.Fallbacker] — the fallback and its
          parents. A catalog with no fallback simply has a shorter chain, which is
          ADR 0039's absence-is-the-answer shape rather than a nil tag to interpret.
        in:
          - name: catalog
            type: corei18n.Catalog
          - name: tag
            type: corei18n.TagValue
        name: NewPrinter
        out:
          - name: printer
            type: "*Printer"
          - name: err
            type: error
      - doc: |-
          NewStore compiles catalogues into a [Store], or refuses.

          # Everything it refuses, and why each is refused HERE

            - A zero fallback [corei18n.TagValue] — [corei18n.CatalogInvalid]. ADR 0031's
              refuse half: there is no language the SDK could pick, and picking
              English would mean a Japanese-only product silently shipping English.
            - A fallback the catalogues do not hold — [corei18n.CatalogInvalid]. A fallback
              that resolves to nothing is not a fallback; every miss would return the
              key, and the misconfiguration would look exactly like a missing
              translation.
            - A language with no reviewed CLDR rule — [corei18n.UnsupportedLanguage].
            - An empty or control-bearing key — [corei18n.InvalidKey].
            - A malformed pattern — [corei18n.InvalidPattern].
            - An unknown CLDR category name — [corei18n.InvalidForm].
            - A counted message missing a category its language can produce —
              [corei18n.TranslationIncomplete].

          Every one of them is a startup failure. That is the whole design: at startup
          a human is present, the catalogue file is in front of them, and the fix is
          an edit. At render time the caller is a request, and the only repairs
          available are to show something wrong or to show nothing.
        in:
          - name: fallback
            type: corei18n.TagValue
          - name: catalogues
            type: map[corei18n.TagValue]Catalogue
        name: NewStore
        out:
          - name: store
            type: "*Store"
          - name: err
            type: error
      - doc: |-
          ParseTag canonicalises text into a [corei18n.TagValue], or returns
          [corei18n.InvalidTag].

          # The subset, and everything refused BY NAME

          Accepted: a 2- or 3-letter language, an optional 4-letter script, and an
          optional 2-letter or 3-digit region, separated by "-". Case is normalised —
          "FR-latn-ca" and "fr-Latn-CA" are the same tag — because a tag differing
          only in case is the same language and two tags for one language would split
          a catalogue in half.

          Refused, each by name rather than parsed and dropped:

            - The POSIX locale spelling ("fr_FR", "en_US.UTF-8"). Accepting a second
              separator would mint a second tag for one language, and the two would
              index different halves of the same catalogue.
            - Extended language subtags ("zh-cmn-Hans"), deprecated by BCP 47 itself.
            - Variants ("de-CH-1901", "sl-rozaj"), 5-to-8-character subtags.
            - Extension sequences ("de-DE-u-co-phonebk", "-t-", any singleton).
            - Private use ("x-pig-latin", "en-x-custom").
            - Grandfathered and irregular tags ("i-klingon", "zh-min-nan").
            - The language ranges of RFC 4647 — "*" and "de-*-DE". A range is not a
              tag; this package's negotiation is where ranges are read.

          Dropping any of them silently would change which language answers without
          changing anything a reader can see: "de-DE-u-co-phonebk" would quietly
          become "de-DE", and the difference would surface as a sort order nobody can
          explain. The domain does not implement collation, so the honest answer is to
          refuse the tag that asked for one.

          The parser lives here and not beside the value (ADR 0160: a wire format is a
          mechanism): it splits the text and places each subtag, and
          corei18n.NewTag — the one constructor of the value — checks each subtag's
          shape and canonicalises its case.
        in:
          - name: text
            type: string
        name: ParseTag
        out:
          - name: tag
            type: corei18n.TagValue
          - name: err
            type: error
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      corei18n: github.com/kitsunium/sdk/internal/core/app/i18n
      fs: io/fs
    path: github.com/kitsunium/sdk/internal/service/app/i18n
    types:
      - doc: |-
          EntryValue is one catalogue entry before it is compiled: either a plain
          pattern, or one pattern per CLDR category. pkg/v1/app/i18n publishes it as
          `Entry`.

          The two shapes are what a catalogue FILE carries — a string, or a map from
          category name to string — so this type is the file's shape given a name, and
          the decode from any of the codec domain's formats lands on it without a
          format-specific struct tag anywhere.

          Which shape was used is not cosmetic: a Forms entry DECLARES the message is
          counted, and a counted message is checked at load against every category its
          language can produce. An entry written as a plain string is not counted and
          is not checked, because "Welcome back" needs no plural form in any language.
        name: EntryValue
        struct:
          fields:
            - doc: |-
                Pattern is the message body when the entry is not counted. It is
                ignored when Forms is non-nil.
              name: Pattern
              type: string
            - doc: |-
                Forms maps CLDR category names — "zero", "one", "two", "few", "many",
                "other" — to patterns. A non-nil Forms marks the entry counted, even
                when it holds a single category.
              name: Forms
              type: map[string]string
      - doc: Catalogue is one language's entries, keyed by message key.
        name: Catalogue
        underlying: map[corei18n.Key]EntryValue
      - doc: |-
          Negotiator resolves an Accept-Language header to one of a fixed set of
          languages.

          It is built once, at wiring time, and used on every request. That split is
          the point: everything that can be wrong — an empty supported set, an unset
          default, a default that is not itself supported — is refused HERE, so
          [Negotiator.Negotiate] has no failure mode at all and never has to decide
          what to do about a header it dislikes.
        methods:
          - doc: Supported returns the set this negotiator may return, as a copy.
            name: Supported
            out:
              - type: "[]corei18n.TagValue"
            recv: pointer
          - doc: |-
              Negotiate resolves an RFC 9110 Accept-Language header to a supported tag.
              It NEVER fails and never returns the zero [corei18n.TagValue].

              # A malformed header is not an error

              The header is written by a stranger. RFC 4647 §3.4 prescribes exactly one
              response to a range it cannot use — skip it — and returning an error would
              invite a caller to fail the request, which is how a peculiar browser
              setting becomes a 400 nobody can reproduce. So an unparsable element is
              skipped, an unparsable q is skipped with its element, an empty header
              resolves to the fallback, and a header of pure garbage resolves to the
              fallback. Each of those is a named test. It is the same call ADR 0051 made
              for a malformed `traceparent`.

              # What is implemented, and what is refused BY NAME

                - RFC 4647 §3.4 **Lookup** decides which tag is SELECTED. The range is
                  truncated one subtag at a time and the longest supported tag that
                  equals a truncation wins. This is exactly the algorithm, including its
                  consequence: a range of "en" does NOT select a supported "en-GB",
                  because Lookup truncates the range and never extends it. Name the
                  catalogue file after the base language and add a region variant only
                  when it really differs.
                - RFC 4647 §3.3.1 **Basic Filtering** decides which tags a "q=0" element
                  REFUSES. "en;q=0" refuses "en", "en-GB" and "en-Latn-GB", because that
                  is what a client saying "not English" means. This is the one place the
                  two RFC 4647 mechanisms coexist, and they are on opposite sides of the
                  match on purpose.
                - RFC 4647 §3.3.2 **Extended Filtering** is refused by name. Its wildcards
                  sit INSIDE a range ("de-*-DE"), no such range can match anything here,
                  and implementing it would mean a matcher with its own grammar for a
                  syntax no client sends.
                - The wildcard range "*" is SKIPPED during selection, which is what §3.4
                  requires. "*;q=0" — "nothing but what I listed" — therefore changes
                  nothing: this function always returns a tag, because a page has to
                  render, and RFC 9110 §12.5.4 itself discourages answering 406 to an
                  Accept-Language a server cannot satisfy.
                - An element with any parameter other than "q" is skipped whole. RFC 9110
                  defines no other parameter for this header, and guessing at one is how
                  an extension becomes a security surface.
            in:
              - name: header
                type: string
            name: Negotiate
            out:
              - type: corei18n.TagValue
            recv: pointer
        name: Negotiator
        struct:
          unexported: true
      - doc: |-
          PluralValue is the CLDR plural specification of ONE language: the categories its
          rules can produce, and the rule that picks between them.

          # Why this table is written by hand, and is short

          CLDR's plural data covers about 200 locales. Vendoring it means shipping
          tens of thousands of generated lines nobody on the team has read, to answer
          a question about languages the product does not have a single string in. So
          this table holds the languages the SDK will actually be asked for, each rule
          transcribed from the CLDR cardinal chart with its clause in the comment
          above it, each pinned by a table test that walks the boundary values.

          The consequence is stated plainly and is not a defect: a language absent
          from the table is REFUSED at catalogue construction, by name, with the
          supported set beside it. It does not silently borrow English's rules. See
          ADR 0063 §D1 and [corei18n.UnsupportedLanguage].

          # The one operand that is not implemented

          Four of these rules — French, Spanish, Italian and Portuguese — have a
          `many` clause CLDR writes as "e = 0 and i != 0 and i % 1000000 = 0 and v = 0
          or e != 0..5". The operand e is the compact-decimal exponent, and this
          domain ships no compact-decimal formatter, so e is 0 for every quantity that
          can reach these rules. The clause is therefore implemented at e = 0: the
          first half exactly, the second half never firing. That is not an
          approximation of the rule, it is the rule restricted to the inputs the
          domain can produce — and it is written out at all four sites rather than
          once here, because a reader checking one rule against CLDR must not have to
          find this paragraph to know it is right.
        methods:
          - doc: |-
              Forms returns the CLDR categories this language can produce, ascending. The
              returned slice is shared and MUST NOT be modified: it is read on the load
              path by every catalogue in the process.
            name: Forms
            out:
              - type: "[]corei18n.Form"
            recv: value
          - doc: |-
              Select returns the CLDR category count falls in for this language.

              A language with no plural distinction carries no rule and every quantity is
              `other`; so does the zero PluralValue, which is ADR 0031's "the zero value
              is the safe one" — `other` is the one category every language defines and
              every message is required to carry.
            in:
              - name: count
                type: corei18n.CountValue
            name: Select
            out:
              - type: corei18n.Form
            recv: value
          - doc: |-
              Valid reports whether p describes a language.

              It reads the category SET rather than the rule, because Japanese and Chinese
              legitimately carry no rule and are nonetheless perfectly valid entries. The
              zero PluralValue describes nothing, and it is the only value this reports
              false for.
            name: Valid
            out:
              - type: bool
            recv: value
        name: PluralValue
        struct:
          unexported: true
      - doc: |-
          Printer renders messages in one language.

          It holds a resolution CHAIN — the requested tag, its parents, then the
          catalogue's fallback and its parents — and each step carries its own plural
          rules. A render walks the chain, takes the first language that holds the
          key, and selects the plural form with that language's rules.

          # Build one per language, not one per request

          [NewPrinter] resolves the chain and allocates; [Printer.Render] walks it and
          does not. A server negotiates a language per request and then wants a
          Printer for it, so the shape that pays off is a map from tag to Printer
          built at startup:

          	printers := map[i18n.Tag]*i18n.Printer{}
          	for _, tag := range store.Tags() {
          		p, err := i18n.NewPrinter(store, tag)
          		…
          		printers[tag] = p
          	}
          	// per request
          	p := printers[negotiator.Negotiate(r.Header.Get("Accept-Language"))]

          BENCH.md reports both costs so the difference is a number rather than
          advice.

          A Printer is immutable and safe for concurrent use.
        methods:
          - doc: |-
              Tag returns the language this printer was built for — the value a caller
              puts in Content-Language or an html lang attribute.

              It is the language REQUESTED, not the one that answered a particular render.
              The two differ exactly when a key was missing and the chain fell back, and
              the SDK deliberately does not report that per call: see [Printer.Render] and
              [Store.Missing].
            name: Tag
            out:
              - type: corei18n.TagValue
            recv: pointer
          - doc: |-
              Render renders the uncounted message registered under key.

              # A missing key returns the KEY, and an error

              The string is never empty. A caller that checks the error fails the render;
              a caller that ignores it ships "checkout.button.pay" to the screen, which is
              visible, greppable, and gets reported within the hour. The alternative — an
              empty string — is a blank space in a layout that still looks finished, and
              it is the failure mode this domain most wants to make impossible to ship
              quietly. See ADR 0063 §D4.

              The key is a developer identifier, never user data, so putting it on screen
              discloses nothing an attacker could not read in the JavaScript bundle.

              # What it does not tell you

              It does not report which language actually answered. When a key is present
              in the fallback and absent from the requested language, the render succeeds
              with the fallback's text and no signal. That is deliberate: a per-call
              signal would be checked by nobody and would put a branch on the hot path,
              while the same question is answered exhaustively and at build time by
              [Store.Missing]. A caller who needs Content-Language to be exact asserts
              there that the gap is empty.
            in:
              - name: key
                type: corei18n.Key
              - name: args
                type: corei18n.Args
            name: Render
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: pointer
          - doc: |-
              RenderCount renders the counted message registered under key, selecting the
              CLDR plural form for count.

              The form is selected with the plural rules of the language that ANSWERED,
              not of the language that was requested. When the requested language does not
              hold the key and the fallback does, the fallback's rules apply — because the
              fallback's message is the one being rendered and it carries the fallback's
              categories. Selecting with the requested language's rules would ask an
              English message for `few`. See ADR 0063 §D3.

              A missing key behaves exactly as in [Printer.Render].
            in:
              - name: key
                type: corei18n.Key
              - name: count
                type: corei18n.CountValue
              - name: args
                type: corei18n.Args
            name: RenderCount
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: pointer
        name: Printer
        struct:
          unexported: true
      - doc: |-
          Store is an immutable, concurrent-safe [corei18n.Catalog] built from one
          catalogue per language.

          It implements the two ADR 0039 siblings as well: [corei18n.KeyLister], so a
          caller's own test can assert no translation is missing, and
          [corei18n.Fallbacker], so a renderer can find the language that stands in
          without the fallback being a second constructor argument everywhere.

          Nothing mutates after [NewStore] returns. There is no Add, no Reload and no
          Set: a catalogue that can change under a request is a catalogue where two
          paragraphs of one page can come from two different versions of the text, and
          reloading translations is a process restart or a second Store swapped in by
          the caller — both of which the caller can already do, and neither of which
          needs a lock on the render path.
        methods:
          - doc: |-
              Lookup returns the message registered for exactly (tag, key). It performs no
              fallback and no plural selection — see [corei18n.Catalog].
            in:
              - name: tag
                type: corei18n.TagValue
              - name: key
                type: corei18n.Key
            name: Lookup
            out:
              - name: message
                type: corei18n.MessageValue
              - name: ok
                type: bool
            recv: pointer
          - doc: |-
              Tags returns every language the store answers for, sorted, as a copy.

              A copy because the internal slice is read by every renderer in the process
              and a caller that sorted it in place would reorder them all. It is a startup
              path — a renderer resolves a tag once, not per request — so the allocation
              is paid where it is not measured.
            name: Tags
            out:
              - type: "[]corei18n.TagValue"
            recv: pointer
          - doc: |-
              Keys returns the keys held for tag, sorted, as a copy, or nil when the store
              does not hold the language at all.

              It is the [corei18n.KeyLister] sibling, and its purpose is a test rather
              than a request: compare a language's keys against the fallback's and fail
              the build when one is missing. See [Store.Missing], which does exactly that.
            in:
              - name: tag
                type: corei18n.TagValue
            name: Keys
            out:
              - type: "[]corei18n.Key"
            recv: pointer
          - doc: |-
              Fallback returns the language a key is looked for in when the requested one
              does not hold it. It is the [corei18n.Fallbacker] sibling and is never the
              zero tag.
            name: Fallback
            out:
              - type: corei18n.TagValue
            recv: pointer
          - doc: |-
              Missing returns the keys the fallback language holds and tag does not,
              sorted.

              This is the SDK's answer to "which strings were never translated", and it is
              deliberately a QUERY rather than a render-time behaviour. At render time a
              missing translation has already happened and something has to be shown; in a
              test it is a build that does not go out:

              	for _, tag := range store.Tags() {
              		if gaps := store.Missing(tag); len(gaps) != 0 {
              			t.Errorf("%s is missing %d keys: %v", tag, len(gaps), gaps)
              		}
              	}

              It also answers the question the renderer deliberately does not: a render
              that fell back does not report which language answered, so a caller who
              needs Content-Language to be exact proves the gap is empty here instead.
            in:
              - name: tag
                type: corei18n.TagValue
            name: Missing
            out:
              - type: "[]corei18n.Key"
            recv: pointer
        name: Store
        struct:
          unexported: true
  - doc: |-
      Package i18n is the public facade for the SDK's message-translation domain:
      a catalogue of translated messages, CLDR plural forms that are right in
      Polish and Arabic and not only in English, and Accept-Language negotiation
      that never fails a request.

      	english, err := i18n.ParseTag("en")
      	if err != nil {
      		return err
      	}

      	store, err := i18n.LoadFS(os.DirFS("locales"), ".", "json", english)
      	if err != nil {
      		return err // a missing plural form is a startup failure, not a wrong page
      	}

      	polish, err := i18n.ParseTag("pl")
      	if err != nil {
      		return err
      	}

      	printer, err := i18n.NewPrinter(store, polish)
      	if err != nil {
      		return err
      	}

      	text, err := printer.RenderCount("cart.items", i18n.Int(5), i18n.Args{"n": "5"})
      	// "5 produktów" — `many`, which English does not have

      # The decision this package exists to get right

      Polish has four plural categories, Russian four, Arabic six. English has
      two. An i18n library that resolves an unknown language by falling back to
      English's rules renders a grammatically wrong sentence on every page of the
      Polish site, and nothing observes it: the page renders, the tests pass,
      nothing is logged, and the only people who can see it have no way to report
      it that reaches the right file.

      So this package REFUSES what it cannot do correctly. A language with no
      reviewed CLDR rule is [UnsupportedLanguage] at construction, naming the
      language and the supported set beside it. A counted message missing a
      category its language can produce is [TranslationIncomplete] at
      construction, naming the file, the key and the form. Both are startup
      failures, where a human is present and the fix is an edit.

      # Supported languages

      Thirteen entries, transcribed by hand from the CLDR cardinal chart with each
      clause cited in the code: `ar`, `de`, `en`, `es`, `fr`, `it`, `ja`, `nl`,
      `pl`, `pt`, `pt-PT`, `ru`, `zh`. Between them they cover every one of the six
      CLDR categories and every rule shape — no distinction (ja, zh), one/other
      (de, en, nl), one/many/other (es, fr, it, pt), one/few/many/other (pl, ru)
      and all six (ar). A region narrowing CLDR does not distinguish inherits its
      language: "fr-CA", "de-AT" and "zh-Hant" all work. "pt-PT" has its own
      entry, because CLDR gives European Portuguese a different singular from
      Brazilian.

      [SupportedTags] is the list at runtime. Adding a language is a rule, its
      CLDR citation and its boundary-value test, in one change.

      # What this package deliberately is not

      It renders a message. It does NOT format numbers, dates, times, currencies
      or units, does not collate, case-map, normalise or transliterate, and has no
      opinion about text direction. Those are the rest of CLDR, and shipping a
      half-correct version of any of them is worse than not shipping it: [Args] is
      map[string]string, so a caller who wants "1 234,50 €" formats it and
      discovers at the call site that this is their job.

      It is also not a template engine. The syntax is literal text with named
      placeholders — "Welcome back, {name}" — and a literal brace is "{{".
      Positional arguments, format specifiers, ICU MessageFormat's nested plural
      and select constructs, and filter calls are each refused by name, because
      each of them is a parser living inside a translation file.

      # Escaping is not done here

      A rendered message is a plain string. Putting it in a page goes through
      pkg/v1/app/view, whose contextual escaping knows where in the HTML the cursor
      is. Escaping here as well would double-escape every apostrophe in every
      French sentence in the catalogue.

      Message patterns are trusted input — they come from catalogue files the
      developer ships. Argument values are not, and are substituted literally and
      never rescanned. A pattern assembled from user input would let that user
      name a placeholder the caller happens to pass and read its value; this
      package cannot detect that and does not try.
    facade:
      - const:
          - doc: |-
              FormOther is the catch-all. Every language defines it and every message must
              carry it.
            name: FormOther
            note: |-
              The six CLDR plural categories, aliased from internal/core/app/i18n. FormOther
              is the zero Form, because it is the only category every language defines.

              They are declared one per const rather than as a group: their VALUES are the
              core package's, so an iota here would restate an ordering this package does
              not own and would silently diverge the day the core enum is reordered.
            reexport: corei18n.FormOther
            type: Form
            typed: true
            value: "0"
      - const:
          - doc: FormZero is the distinct nought of Arabic and Latvian.
            name: FormZero
            reexport: corei18n.FormZero
            type: Form
            typed: true
            value: "1"
      - const:
          - doc: FormOne is the singular of languages that have one.
            name: FormOne
            reexport: corei18n.FormOne
            type: Form
            typed: true
            value: "2"
      - const:
          - doc: FormTwo is the dual.
            name: FormTwo
            reexport: corei18n.FormTwo
            type: Form
            typed: true
            value: "3"
      - const:
          - doc: FormFew is the small plural of the Slavic and Semitic families.
            name: FormFew
            reexport: corei18n.FormFew
            type: Form
            typed: true
            value: "4"
      - const:
          - doc: |-
              FormMany is the large plural, and the compact-decimal form in several
              Romance languages.
            name: FormMany
            reexport: corei18n.FormMany
            type: Form
            typed: true
            value: "5"
      - alias:
          - doc: |-
              Tag is a language, optionally narrowed by a script and a region:
              `language[-Script][-REGION]` and deliberately nothing else. It is
              comparable, so it is a map key, and it holds its canonical spelling, so
              [Tag].String allocates nothing.
            name: Tag
            target: corei18n.TagValue
      - alias:
          - doc: |-
              Key names a message inside a catalogue. It is a developer identifier —
              "checkout.button.pay" — and it is what a render puts on screen when the
              translation is missing.
            name: Key
            target: corei18n.Key
      - alias:
          - doc: |-
              Message is one compiled translation. Its placeholders are parsed when the
              catalogue is built, so a malformed pattern fails at startup and a render
              never parses.
            name: Message
            target: corei18n.MessageValue
      - alias:
          - doc: |-
              Form is a CLDR plural category. [FormOther] is the zero value, because it is
              the only category every language defines.
            name: Form
            target: corei18n.Form
      - alias:
          - doc: |-
              Count is a quantity described by the CLDR plural operands. It carries the
              DISPLAY precision, because a quantity of one shown with a decimal is a different category
              in English and a float64 cannot tell them apart.
            name: Count
            target: corei18n.CountValue
      - alias:
          - doc: |-
              Args binds placeholder names to the text that replaces them. It is
              map[string]string on purpose — see the package comment.
            name: Args
            target: corei18n.Args
      - alias:
          - doc: |-
              Catalog is the message-source port, frozen at two methods (ADR 0039).
              [Store] implements it.
            name: Catalog
            target: corei18n.Catalog
      - alias:
          - doc: |-
              KeyLister is the ADR 0039 sibling that enumerates a catalog's keys, reached
              by type assertion. [Store].Missing is what it exists for.
            name: KeyLister
            target: corei18n.KeyLister
      - alias:
          - doc: |-
              Fallbacker is the ADR 0039 sibling that names a catalog's fallback language.
              A catalog with no fallback does not implement it, and the absence is the
              answer.
            name: Fallbacker
            target: corei18n.Fallbacker
      - alias:
          - doc: |-
              PluralRule reports which CLDR category a quantity falls in for one language.
              It is a func type, which satisfies ADR 0039 structurally.
            name: PluralRule
            target: corei18n.PluralRule
      - alias:
          - doc: |-
              Entry is one catalogue entry before it is compiled: a plain pattern
              ([Plain]) or one pattern per CLDR category ([PluralForms]).
            name: Entry
            target: svci18n.EntryValue
      - alias:
          - doc: Catalogue is one language's entries, keyed by message key.
            name: Catalogue
            target: svci18n.Catalogue
      - alias:
          - doc: |-
              Store is the concrete, immutable catalogue. It implements [Catalog],
              [KeyLister] and [Fallbacker].
            name: Store
            target: svci18n.Store
      - alias:
          - doc: |-
              Printer renders messages in one language. Build one per language at startup,
              not one per request — see [NewPrinter].
            name: Printer
            target: svci18n.Printer
      - alias:
          - doc: |-
              Negotiator resolves an Accept-Language header to one of a fixed set of
              languages. Everything that can be wrong is refused when it is built, so
              [Negotiator].Negotiate has no failure mode.
            name: Negotiator
            target: svci18n.Negotiator
      - alias:
          - doc: |-
              Plural is one language's CLDR plural specification: the categories it can
              produce, and the rule that picks between them.
            name: Plural
            target: svci18n.PluralValue
      - var:
          - doc: |-
              InvalidTag is returned by [ParseTag] for a tag outside the
              `language[-Script][-REGION]` subset. It is NOT what a peculiar
              Accept-Language header produces: [Negotiator].Negotiate skips an
              element it cannot use and never fails.
            name: InvalidTag
            reexport: corei18n.InvalidTag
            type: "*errs.Error"
          - doc: |-
              InvalidKey is returned for an empty message key, or one carrying a
              control character.
            name: InvalidKey
            reexport: corei18n.InvalidKey
            type: "*errs.Error"
          - doc: |-
              InvalidPattern is returned for a malformed pattern: an unclosed brace,
              an unmatched closing brace, or a placeholder name outside
              [A-Za-z_][A-Za-z0-9_]*.
            name: InvalidPattern
            reexport: corei18n.InvalidPattern
            type: "*errs.Error"
          - doc: |-
              ArgumentMissing is returned when [Args] does not carry a placeholder
              the pattern names. It names the placeholder and never a value.
            name: ArgumentMissing
            reexport: corei18n.ArgumentMissing
            type: "*errs.Error"
          - doc: |-
              MessageNotFound is returned when no language in the chain holds the
              key. The render still returns a non-empty string — the key itself.
            name: MessageNotFound
            reexport: corei18n.MessageNotFound
            type: "*errs.Error"
          - doc: |-
              PluralFormMissing is returned when a message is asked for a category it
              does not carry. A catalogue built by [NewStore] cannot produce it.
            name: PluralFormMissing
            reexport: corei18n.PluralFormMissing
            type: "*errs.Error"
          - doc: |-
              InvalidCount is returned by [Decimal] for a NaN, an infinity, or a
              fraction-digit count outside 0..9.
            name: InvalidCount
            reexport: corei18n.InvalidCount
            type: "*errs.Error"
          - doc: |-
              InvalidForm is returned by [ParseForm] for a name outside the six CLDR
              categories.
            name: InvalidForm
            reexport: corei18n.InvalidForm
            type: "*errs.Error"
          - doc: |-
              UnsupportedLanguage is returned when a catalogue or a printer names a
              language this SDK has no reviewed CLDR plural rule for. It is the
              domain's central refusal — see the package comment.
            name: UnsupportedLanguage
            reexport: corei18n.UnsupportedLanguage
            type: "*errs.Error"
          - doc: |-
              CatalogInvalid is returned for a catalogue that cannot be compiled: an
              unset or unserved fallback, a duplicate tag, or an entry of the wrong
              shape.
            name: CatalogInvalid
            reexport: corei18n.CatalogInvalid
            type: "*errs.Error"
          - doc: |-
              CatalogLoadFailed is returned when a catalogue directory cannot be read
              or its bytes cannot be decoded. The cause stays in the chain, so
              errors.Is(err, fs.ErrNotExist) still answers.
            name: CatalogLoadFailed
            reexport: corei18n.CatalogLoadFailed
            type: "*errs.Error"
          - doc: |-
              TranslationIncomplete is returned for a counted message missing a
              category its language can produce — the one catalogue defect a
              translator cannot see by reading their own file.
            name: TranslationIncomplete
            reexport: corei18n.TranslationIncomplete
            type: "*errs.Error"
          - doc: |-
              NegotiationEmpty is returned by [NewNegotiator] for an empty supported
              set, which is an unfinished wiring rather than "accept anything".
            name: NegotiationEmpty
            reexport: corei18n.NegotiationEmpty
            type: "*errs.Error"
      - func:
          doc: |-
            ParseTag canonicalises text into a [Tag], or returns [InvalidTag].

            "FR-latn-ca" and "fr-Latn-CA" are the same Tag. The POSIX spelling
            ("fr_FR"), extensions, variants, private use and grandfathered tags are each
            refused by name rather than parsed and dropped — a dropped subtag changes
            which language answers without changing anything a reader can see.
          forward: svci18n.ParseTag
          in:
            - name: text
              type: string
          name: ParseTag
          out:
            - name: tag
              type: Tag
            - name: err
              type: error
      - func:
          doc: |-
            ParseForm returns the [Form] named by a CLDR category spelling — "zero",
            "one", "two", "few", "many", "other" — or [InvalidForm].
          forward: corei18n.ParseForm
          in:
            - name: name
              type: string
          name: ParseForm
          out:
            - name: form
              type: Form
            - name: err
              type: error
      - func:
          doc: |-
            Int returns the [Count] of an exact integer displayed with no fraction
            digits. The sign is discarded, because CLDR's operands are defined on the
            absolute value.
          forward: corei18n.Int
          in:
            - name: "n"
              type: int64
          name: Int
          out:
            - type: Count
      - func:
          doc: |-
            Decimal returns the [Count] of value displayed with exactly fractionDigits
            fraction digits, or [InvalidCount].

            The second argument is the DISPLAY precision, not a property of the value:
            Decimal(1, 2) describes "1.00", which is `other` in English, while
            [Int](1) describes "1", which is `one`.
          forward: corei18n.Decimal
          in:
            - name: value
              type: float64
            - name: fractionDigits
              type: int
          name: Decimal
          out:
            - name: count
              type: Count
            - name: err
              type: error
      - func:
          doc: |-
            ValidateKey reports whether key is usable, and returns [InvalidKey] when it
            is not: empty, or carrying a control character.
          forward: corei18n.ValidateKey
          in:
            - name: key
              type: Key
          name: ValidateKey
          out:
            - type: error
      - func:
          doc: NewMessage compiles an uncounted message, or returns [InvalidPattern].
          forward: svci18n.NewMessage
          in:
            - name: text
              type: string
          name: NewMessage
          out:
            - name: message
              type: Message
            - name: err
              type: error
      - func:
          doc: |-
            NewPluralMessage compiles a counted message from one pattern per category,
            or returns [InvalidPattern], [InvalidForm] or [PluralFormMissing]. The map
            MUST contain [FormOther].

            It does not check the map against any language's rules — it does not know
            the language. [NewStore] does, and refuses there.
          forward: svci18n.NewPluralMessage
          in:
            - name: forms
              type: map[Form]string
          name: NewPluralMessage
          out:
            - name: message
              type: Message
            - name: err
              type: error
      - func:
          doc: Plain returns an uncounted [Entry].
          forward: svci18n.Plain
          in:
            - name: text
              type: string
          name: Plain
          out:
            - type: Entry
      - func:
          doc: |-
            PluralForms returns a counted [Entry] whose patterns are keyed by CLDR
            category name. A counted entry is checked at load against every category its
            language can produce.
          forward: svci18n.PluralForms
          in:
            - name: forms
              type: map[string]string
          name: PluralForms
          out:
            - type: Entry
      - func:
          doc: |-
            NewStore compiles catalogues into a [Store], or refuses.

            Every check is here, and every failure is a startup failure:
            [UnsupportedLanguage] for a language with no reviewed rule,
            [TranslationIncomplete] for a counted message missing one of its language's
            categories, [CatalogInvalid] for an unset or unserved fallback, and the core
            refusals for a bad key, pattern or category name.
          forward: svci18n.NewStore
          in:
            - name: fallback
              type: Tag
            - name: catalogues
              type: map[Tag]Catalogue
          name: NewStore
          out:
            - name: store
              type: "*Store"
            - name: err
              type: error
      - func:
          doc: |-
            LoadFS reads one catalogue file per language from dir and returns a [Store].

            The bytes are decoded by the codec domain, so a catalogue is JSON, YAML,
            TOML or any other registered format and this package contains no parser —
            blank-import pkg/v1/data/codec to register one. fsys is io/fs.FS, so an embed.FS,
            an os.DirFS and a pkg/v1/data/vfs filesystem all work here unchanged.

            The language comes from the file NAME: "en.json", "pt-PT.yaml".
            Subdirectories are ignored rather than walked, and two files that
            canonicalise to one tag are [CatalogInvalid].
          forward: svci18n.LoadFS
          in:
            - name: fsys
              type: fs.FS
            - name: dir
              type: string
            - name: format
              type: codec.Format
            - name: fallback
              type: Tag
          name: LoadFS
          out:
            - name: store
              type: "*Store"
            - name: err
              type: error
      - func:
          doc: |-
            NewPrinter returns a [Printer] rendering tag out of catalog, or refuses.

            It resolves the chain and allocates; [Printer].Render walks it and does not.
            Build one per language at startup and index them by [Tag] — a request then
            costs a map lookup, not a construction.
          forward: svci18n.NewPrinter
          in:
            - name: catalog
              type: Catalog
            - name: tag
              type: Tag
          name: NewPrinter
          out:
            - name: printer
              type: "*Printer"
            - name: err
              type: error
      - func:
          doc: |-
            NewNegotiator returns a [Negotiator] over supported, falling back to
            fallback, or refuses: an empty supported set is [NegotiationEmpty], an unset
            or unsupported fallback is [CatalogInvalid].
          forward: svci18n.NewNegotiator
          in:
            - name: supported
              type: "[]Tag"
            - name: fallback
              type: Tag
          name: NewNegotiator
          out:
            - name: negotiator
              type: "*Negotiator"
            - name: err
              type: error
      - func:
          doc: |-
            Rules returns the CLDR plural specification for tag, and reports whether the
            SDK has one. It resolves the exact tag first and the bare language second,
            so "pt-PT" gets its own rule and "fr-CA" inherits French's.
          forward: svci18n.Rules
          in:
            - name: tag
              type: Tag
          name: Rules
          out:
            - name: plural
              type: Plural
            - name: ok
              type: bool
      - func:
          doc: |-
            SupportedTags returns every language this SDK has a reviewed CLDR plural
            rule for, sorted. It is what [UnsupportedLanguage] names beside a refused
            tag.
          forward: svci18n.SupportedTags
          name: SupportedTags
          out:
            - type: "[]Tag"
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      corei18n: github.com/kitsunium/sdk/internal/core/app/i18n
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      svci18n: github.com/kitsunium/sdk/internal/service/app/i18n
    path: github.com/kitsunium/sdk/pkg/v1/app/i18n
