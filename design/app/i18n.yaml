apiVersion: kit.kitsunium/design/v2
domain: app/i18n
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidTag identifies a language tag this domain will not resolve: the
              empty string, a subtag of an illegal length, a non-alphanumeric character,
              or a shape outside the `language[-Script][-REGION]` subset the domain
              implements. The BCP 47 constructs outside that subset — extensions,
              private-use, variants, grandfathered tags — are refused here BY NAME rather
              than parsed and dropped, because a dropped subtag changes which language
              answers without changing anything a reader can see.
            name: CodeInvalidTag
            note: "range: 0.2.30.0 - 0.2.30.255"
            value: "0x00_02_1E_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKey identifies a message key that is empty or carries a control
              character. A key is a program identifier, not prose: it is compared by byte
              equality, it appears in error fields, and — when a translation is missing —
              it is what the renderer shows on screen.
            name: CodeInvalidKey
            value: "0x00_02_1E_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidPattern identifies a message pattern the parser refuses: an
              unclosed "{", a "}" with no opening brace, an empty placeholder name, or a
              name outside [A-Za-z_][A-Za-z0-9_]*.

              It is a CONSTRUCTION-time refusal on purpose. A pattern is parsed once, when
              the catalogue is built, so a malformed translation fails at startup rather
              than on the one request that happens to reach that key.
            name: CodeInvalidPattern
            value: "0x00_02_1E_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeArgumentMissing identifies a render whose [Args] does not carry a
              placeholder the pattern names. The error names the KEY and the PLACEHOLDER
              and never a value — there is no value, and the neighbouring arguments that
              were supplied are not named either.
            name: CodeArgumentMissing
            value: "0x00_02_1E_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeMessageNotFound identifies a key no language in the resolution chain
              holds. It is an error AND the renderer still returns a string — the key
              itself — because a blank is a defect nobody reports and a key on screen is
              one everybody does. See ADR 0063 §D4.
            name: CodeMessageNotFound
            value: "0x00_02_1E_05"
        type: errs.Code
      - const:
          - doc: |-
              CodePluralFormMissing identifies a [MessageValue] asked for a CLDR category it
              does not carry. A catalogue built through internal/service/app/i18n cannot
              produce it: completeness against the language's own rules is checked when
              the catalogue is built. It remains reachable for a Message assembled by
              hand, and it is a refusal rather than a silent fall back to `other`, which
              would render a wrong sentence in a language nobody on the team reads.
            name: CodePluralFormMissing
            value: "0x00_02_1E_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidCount identifies a quantity whose CLDR operands cannot be
              derived: a negative or excessive fraction-digit count, or a value that is
              NaN or infinite.
            name: CodeInvalidCount
            value: "0x00_02_1E_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidForm identifies a CLDR category name outside the six the
              specification defines. An unknown name in a catalogue file is refused rather
              than ignored: a typo of "other" that is dropped leaves the message with no
              fallback form at all.
            name: CodeInvalidForm
            value: "0x00_02_1E_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedLanguage identifies a language this SDK has no reviewed CLDR
              plural rule for.

              It is the domain's central refusal. The alternative — falling back to
              English's `one`/`other` rules — produces a grammatically wrong sentence in
              every Slavic and Semitic language, on every page, with no symptom any test
              or monitor can see. See ADR 0063 §D1.
            name: CodeUnsupportedLanguage
            note: |-
              range: 0.3.60.0 - 0.3.60.255

              The outcomes a CONCRETE catalogue can produce and an abstract one cannot.
              The range was allocated to internal/service/app/i18n, which raises these
              codes while it builds a store, and it is declared here with the port's own
              verdicts so that every code of the domain is in one place (ADR 0160). A code
              keeps the value its allocation gave it whichever layer declares it, so the
              layer byte still reads 3.
            value: "0x00_03_3C_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCatalogInvalid identifies a catalogue that cannot be compiled: a
              duplicate tag, an entry that is neither a pattern nor a map of patterns, an
              unknown CLDR category name, or a fallback language the catalogue does not
              itself hold.
            name: CodeCatalogInvalid
            value: "0x00_03_3C_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeCatalogLoadFailed identifies a catalogue directory that could not be
              read or decoded: an absent directory, an unreadable file, an unregistered
              codec format, or bytes the codec refused.
            name: CodeCatalogLoadFailed
            value: "0x00_03_3C_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeTranslationIncomplete identifies a plural message that does not carry
              every CLDR category the language it was registered under can produce — a
              Polish entry with only `one` and `other`, when Polish rules also produce
              `few` and `many`.

              It has its own code, separate from [CodeCatalogInvalid], because it is the
              one catalogue defect a reviewer cannot see by reading the file: the entry
              looks complete, and it is only incomplete relative to a rule table stored
              somewhere else.
            name: CodeTranslationIncomplete
            value: "0x00_03_3C_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeNegotiationEmpty identifies a call to build a renderer with no
              supported tags at all. It is a wiring fault: a negotiation over an empty set
              can only ever return the default, so the caller has built something that
              cannot do its job.
            name: CodeNegotiationEmpty
            value: "0x00_03_3C_05"
        type: errs.Code
    constants:
      - name: FormOther
        type: Form
        value: "0"
      - name: FormZero
        type: Form
        value: "1"
      - name: FormOne
        type: Form
        value: "2"
      - name: FormTwo
        type: Form
        value: "3"
      - name: FormFew
        type: Form
        value: "4"
      - name: FormMany
        type: Form
        value: "5"
    functions:
      - in:
          - name: "n"
            type: int64
        name: Int
        out:
          - type: CountValue
      - in:
          - name: value
            type: float64
          - name: fractionDigits
            type: int
        name: Decimal
        out:
          - name: count
            type: CountValue
          - name: err
            type: error
      - in:
          - name: name
            type: string
        name: ParseForm
        out:
          - name: form
            type: Form
          - name: err
            type: error
      - in:
          - name: key
            type: Key
        name: ValidateKey
        out:
          - type: error
      - in:
          - name: other
            type: PatternValue
          - name: plural
            type: "[]FormPatternValue"
        name: NewCompiledMessage
        out:
          - name: message
            type: MessageValue
          - name: err
            type: error
      - in:
          - name: parts
            type: "[]PartValue"
        name: NewPattern
        out:
          - name: body
            type: PatternValue
          - name: err
            type: error
      - in:
          - name: name
            type: string
        name: ValidPlaceholder
        out:
          - type: bool
      - in:
          - name: language
          - name: script
          - name: region
            type: string
        name: NewTag
        out:
          - name: tag
            type: TagValue
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/i18n
    ports:
      - doc: |-
          Catalog is a source of translated messages, FROZEN at two methods
          (ADR 0039). pkg/v1/app/i18n aliases it, Go interfaces are structural, and adding
          a third method would break every downstream two-method double at compile
          time with no deprecation window.

          # Lookup is EXACT and does nothing clever

          It answers for the pair it was handed and performs no fallback, no parent
          truncation ("fr-CA" does not become "fr") and no plural selection. Every one
          of those is a policy: which language stands in for which, and whether a
          missing translation is an error or a silent substitution. A Catalog that
          decided them would decide them for every caller, and the decision would be
          invisible at the call site.

          The walk therefore lives in exactly one place — internal/service/app/i18n's
          renderer — which knows which tag actually answered and can pick that
          language's plural rules. See the package comment.

          Implementations MUST be safe for concurrent use and MUST NOT mutate after
          construction: one Catalog is shared by every goroutine serving a request.
        methods:
          - doc: |-
              Lookup returns the message registered for exactly (tag, key), and
              reports whether there was one.
            in:
              - name: tag
                type: TagValue
              - name: key
                type: Key
            name: Lookup
            out:
              - name: message
                type: MessageValue
              - name: ok
                type: bool
          - doc: |-
              Tags reports every tag this catalog can answer for, sorted by their
              canonical string so the order is stable across runs.
            name: Tags
            out:
              - type: "[]TagValue"
        name: Catalog
      - doc: |-
          KeyLister is an ADR 0039 sibling: a [Catalog] that can enumerate the keys it
          holds for a tag. It is discovered by type assertion, exactly as codec's
          Appender and cache's Tagger are, so [Catalog] stays frozen at two methods.

          It exists for one job, and that job is a test rather than a request: a
          caller compares the key set of its fallback language against the key set of
          every other, and fails its own suite when a translation is missing. That
          moves "this string was never translated" from a report a user writes to a
          build that does not go out — which is the only place the SDK can help,
          because at render time the string is already missing and something has to be
          shown.
        embeds:
          - Catalog
        methods:
          - doc: |-
              Keys reports the keys held for tag, sorted, or nil when the catalog
              does not know the tag at all.
            in:
              - name: tag
                type: TagValue
            name: Keys
            out:
              - type: "[]Key"
        name: KeyLister
      - doc: |-
          Fallbacker is an ADR 0039 sibling: a [Catalog] that names the language it
          falls back to when a key is absent from the one requested.

          It is a sibling and not a [Catalog] method because a catalog that has no
          fallback is a legitimate, useful thing — a bundle for one language, or a
          test double — and the absence of the method is how a renderer finds out,
          rather than a zero [TagValue] it would have to interpret. That is ADR 0039's
          shape and ADR 0052's lesson: the in-process lease implements Deadliner and
          the file lease does not, and the absence IS the answer.
        embeds:
          - Catalog
        methods:
          - doc: |-
              Fallback reports the tag this catalog falls back to. It is never the
              zero TagValue: a catalog that has no fallback does not implement this
              interface.
            name: Fallback
            out:
              - type: TagValue
        name: Fallbacker
    sentinels:
      - doc: |-
          The Publics below name the KEY, the PLACEHOLDER, the FORM and the TAG — the
          developer's own identifiers, which appear in the catalogue file the
          developer wrote — and never an [Args] VALUE.

          That asymmetry is the security property, and it is the same one
          internal/core/app/validation, internal/core/security/authz and internal/service/app/view each
          state for themselves. A value is the untrusted half: a username, a filename,
          an account number, a token someone pasted into a form. An identifier is the
          trusted half and is useless to an attacker who can already read the binary.

          TestNoErrorEverNamesAnArgumentValue is the executable guard: it drives every
          error path in this package with a recognisable secret as an argument value
          and asserts the secret appears in neither Error(), Public(), Private(), nor
          any field.
        var:
          - code: CodeInvalidTag
            doc: |-
              InvalidTag is returned for a tag outside the subset this domain
              resolves: by [NewTag] for a subtag of the wrong shape, and by the parser
              of a written tag, internal/service/app/i18n's ParseTag, for everything
              BCP 47 can spell outside `language[-Script][-REGION]`.

              It is deliberately NOT what an unparsable Accept-Language element
              produces. That header is written by a stranger, and RFC 4647 §3.4
              prescribes exactly one response to a malformed range — ignore it — so
              internal/service/app/i18n's negotiation skips the element and never
              surfaces an error. Failing a request because a browser sent a peculiar
              header is the mistake ADR 0051 already refused for `traceparent`.
            name: InvalidTag
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: ParseTag refused a tag outside the language[-Script][-REGION] subset; the fields carry the tag and the reason"
            public: The language tag is not one this SDK resolves
            reason: INVALID_TAG
          - code: CodeInvalidKey
            doc: |-
              InvalidKey is returned when a message key is empty or carries a control
              character.
            name: InvalidKey
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: a message key must be non-empty and free of control characters — it is compared by byte equality and is shown on screen when a translation is missing"
            public: The message key is empty or contains a control character
            reason: INVALID_KEY
          - code: CodeInvalidPattern
            doc: |-
              InvalidPattern is returned for a pattern the placeholder parser refuses
              — by the compiler behind internal/service/app/i18n's NewMessage and
              NewPluralMessage — and by [NewPattern] for spans that are not a pattern.
            name: InvalidPattern
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: the pattern carries an unclosed brace, an unmatched closing brace, an empty placeholder or a placeholder name outside [A-Za-z_][A-Za-z0-9_]*"
            public: The message pattern is malformed and was refused
            reason: INVALID_PATTERN
          - code: CodeArgumentMissing
            doc: |-
              ArgumentMissing is returned by [MessageValue.Format] when [Args] does not
              carry a placeholder the pattern names.

              It is an error rather than an empty substitution because an empty
              substitution renders "Welcome, " and ships. The name of the absent
              placeholder travels as a field; no other argument is named, and no
              value is.
            name: ArgumentMissing
            private: "core/app/i18n: Format found a placeholder with no matching entry in Args; the fields carry the placeholder name and never any argument value"
            public: A placeholder the message names was not supplied
            reason: ARGUMENT_MISSING
          - code: CodeMessageNotFound
            doc: |-
              MessageNotFound is returned when no language in the resolution chain
              holds the key.

              The renderer returns it ALONGSIDE a non-empty string — the key. A
              caller that checks the error fails the render; a caller that ignores it
              ships "checkout.button.pay" to the screen, which is visible, greppable
              and obviously wrong. The alternative, an empty string, is a blank space
              nobody files a bug about.
            name: MessageNotFound
            private: "core/app/i18n: the key was absent from the requested language, from its parents and from the fallback; the fields carry the key and the tags tried"
            public: No translation exists for this message key
            reason: MESSAGE_NOT_FOUND
          - code: CodePluralFormMissing
            doc: |-
              PluralFormMissing is returned by [MessageValue.Format] for a CLDR category
              the message does not carry.
            name: PluralFormMissing
            private: "core/app/i18n: Format was asked for a CLDR category the message has no pattern for; a catalogue built by internal/service/app/i18n cannot produce this — completeness is checked at load"
            public: The message does not carry the plural form this quantity requires
            reason: PLURAL_FORM_MISSING
          - code: CodeInvalidCount
            doc: |-
              InvalidCount is returned by [Decimal] for a quantity whose CLDR
              operands cannot be derived.
            name: InvalidCount
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: Decimal received a NaN, an infinity, or a fraction-digit count outside 0..maxFractionDigits"
            public: The quantity cannot be described by CLDR plural operands
            reason: INVALID_COUNT
          - code: CodeInvalidForm
            doc: |-
              InvalidForm is returned by [ParseForm] for a category name outside the
              six CLDR defines.
            name: InvalidForm
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/i18n: ParseForm accepts exactly zero, one, two, few, many and other — an unknown name is refused rather than ignored, since a typo of other leaves no fallback form"
            public: The plural category name is not one of the six CLDR defines
            reason: INVALID_FORM
          - code: CodeUnsupportedLanguage
            doc: |-
              UnsupportedLanguage is returned when a catalogue registers a language
              this SDK has no reviewed CLDR plural rule for.

              It is a CONSTRUCTION-time refusal and it is the point of the domain.
              The tempting alternative is to fall back to English's two categories,
              which "works" — the page renders, the tests pass, nothing is logged —
              and puts a number-agreement error into every Polish, Russian and Arabic
              sentence the application will ever print. Nobody on an English-speaking
              team can see that reading the diff, and the users who can see it have
              no way to report it that reaches the right file.

              So the language is named, the supported set is named beside it, and the
              program does not start. Adding a language is a rule plus its CLDR
              citation plus its table test, in one change — see
              internal/service/app/i18n/CLAUDE.md §Adding a language.
            name: UnsupportedLanguage
            note: |-
              The outcomes a CONCRETE catalogue can produce and an abstract one cannot,
              raised by internal/service/app/i18n while a store is being BUILT. Every one
              carries exitConfig: the same files will be refused forever, and the fix is
              an edit to a catalogue or to the rule table, never a retry. They are
              declared here, with the port's verdicts, so that the domain's codes and
              sentinels are in one place (ADR 0160).
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the language has no entry in the hand-written CLDR rule table; the fields carry the tag and the supported set — a silent fall back to English rules would render a wrong sentence in every language with few or many"
            public: No reviewed plural rule exists for this language
            reason: UNSUPPORTED_LANGUAGE
          - code: CodeCatalogInvalid
            doc: |-
              CatalogInvalid is returned by NewStore for a catalogue it cannot
              compile. The fields name the tag, the key and what was wrong.
            name: CatalogInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: NewStore received a catalogue with a duplicate tag, an entry of the wrong shape, an unknown CLDR category, or a fallback language it does not itself hold"
            public: The message catalogue is not usable and was refused
            reason: CATALOG_INVALID
          - code: CodeCatalogLoadFailed
            doc: |-
              CatalogLoadFailed is returned by LoadFS when the catalogue directory
              cannot be read or its bytes cannot be decoded.

              The cause is wrapped rather than replaced, so errors.Is against
              fs.ErrNotExist and fs.ErrPermission keeps answering — the same
              discipline internal/service/data/vfs applies to its read failures.
            name: CatalogLoadFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: LoadFS could not list the directory, read a file, resolve the codec format, or decode a catalogue file; the fields carry the path and the cause"
            public: The message catalogue could not be read or decoded
            reason: CATALOG_LOAD_FAILED
          - code: CodeTranslationIncomplete
            doc: |-
              TranslationIncomplete is returned by NewStore for a plural message that
              does not carry every CLDR category its language can produce.

              This is the check a translator cannot perform by reading their own
              file: a Polish entry with `one` and `other` looks finished, and is
              incomplete only against a rule table stored elsewhere. Deferring it to
              render time would mean discovering it on the request that first needed
              `few` — in production, in a language the on-call engineer does not
              read — and the only repair available there is to show something wrong.
            name: TranslationIncomplete
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the message does not carry every CLDR category the registered language's rules can produce; the fields carry the tag, the key and the missing form"
            public: A plural message is missing a form its language requires
            reason: TRANSLATION_INCOMPLETE
          - code: CodeNegotiationEmpty
            doc: |-
              NegotiationEmpty is returned when a negotiation is set up over no
              supported tags at all.

              ADR 0031's refuse half: an empty set is not "accept anything" and it is
              not "always the default" — it is an unfinished wiring, and both
              readings would hide it behind a working-looking program.
            name: NegotiationEmpty
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/i18n: the supported set was empty, so every negotiation could only return the default — a wiring fault, refused rather than honoured"
            public: Language negotiation was set up with no supported languages
            reason: NEGOTIATION_EMPTY
    types:
      - methods:
          - name: IntegerPart
            out:
              - type: uint64
            recv: value
          - name: FractionValue
            out:
              - type: uint64
            recv: value
          - name: VisibleFractionDigits
            out:
              - type: int
            recv: value
          - name: IsIntegerValued
            out:
              - type: bool
            recv: value
        name: CountValue
        struct:
          unexported: true
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: Valid
            out:
              - type: bool
            recv: value
        name: Form
        underlying: uint8
      - name: PluralRule
        underlying: func(count CountValue) Form
      - name: Args
        underlying: map[string]string
      - name: Key
        underlying: string
      - methods:
          - in:
              - name: form
                type: Form
              - name: args
                type: Args
            name: Format
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: value
          - in:
              - name: form
                type: Form
            name: HasForm
            out:
              - type: bool
            recv: value
          - name: IsPlural
            out:
              - type: bool
            recv: value
        name: MessageValue
        struct:
          unexported: true
      - name: FormPatternValue
        struct:
          fields:
            - name: Form
              type: Form
            - name: Body
              type: PatternValue
      - name: PartValue
        struct:
          fields:
            - name: Text
              type: string
            - name: Name
              type: string
      - name: PatternValue
        struct:
          unexported: true
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: IsZero
            out:
              - type: bool
            recv: value
          - name: Language
            out:
              - type: string
            recv: value
          - name: Script
            out:
              - type: string
            recv: value
          - name: Region
            out:
              - type: string
            recv: value
          - name: Parent
            out:
              - name: parent
                type: TagValue
              - name: ok
                type: bool
            recv: value
        name: TagValue
        struct:
          unexported: true
  - functions:
      - in:
          - name: text
            type: string
        name: Plain
        out:
          - type: EntryValue
      - in:
          - name: forms
            type: map[string]string
        name: PluralForms
        out:
          - type: EntryValue
      - in:
          - name: fsys
            type: fs.FS
          - name: dir
            type: string
          - name: format
            type: codec.Format
          - name: fallback
            type: corei18n.TagValue
        name: LoadFS
        out:
          - name: store
            type: "*Store"
          - name: err
            type: error
      - in:
          - name: text
            type: string
        name: NewMessage
        out:
          - name: message
            type: corei18n.MessageValue
          - name: err
            type: error
      - in:
          - name: forms
            type: map[corei18n.Form]string
        name: NewPluralMessage
        out:
          - name: message
            type: corei18n.MessageValue
          - name: err
            type: error
      - in:
          - name: supported
            type: "[]corei18n.TagValue"
          - name: fallback
            type: corei18n.TagValue
        name: NewNegotiator
        out:
          - name: negotiator
            type: "*Negotiator"
          - name: err
            type: error
      - in:
          - name: tag
            type: corei18n.TagValue
        name: Rules
        out:
          - name: plural
            type: PluralValue
          - name: ok
            type: bool
      - name: SupportedTags
        out:
          - type: "[]corei18n.TagValue"
      - in:
          - name: catalog
            type: corei18n.Catalog
          - name: tag
            type: corei18n.TagValue
        name: NewPrinter
        out:
          - name: printer
            type: "*Printer"
          - name: err
            type: error
      - in:
          - name: fallback
            type: corei18n.TagValue
          - name: catalogues
            type: map[corei18n.TagValue]Catalogue
        name: NewStore
        out:
          - name: store
            type: "*Store"
          - name: err
            type: error
      - in:
          - name: text
            type: string
        name: ParseTag
        out:
          - name: tag
            type: corei18n.TagValue
          - name: err
            type: error
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      corei18n: github.com/kitsunium/sdk/internal/core/app/i18n
      fs: io/fs
    path: github.com/kitsunium/sdk/internal/service/app/i18n
    types:
      - name: EntryValue
        struct:
          fields:
            - name: Pattern
              type: string
            - name: Forms
              type: map[string]string
      - name: Catalogue
        underlying: map[corei18n.Key]EntryValue
      - methods:
          - name: Supported
            out:
              - type: "[]corei18n.TagValue"
            recv: pointer
          - in:
              - name: header
                type: string
            name: Negotiate
            out:
              - type: corei18n.TagValue
            recv: pointer
        name: Negotiator
        struct:
          unexported: true
      - methods:
          - name: Forms
            out:
              - type: "[]corei18n.Form"
            recv: value
          - in:
              - name: count
                type: corei18n.CountValue
            name: Select
            out:
              - type: corei18n.Form
            recv: value
          - name: Valid
            out:
              - type: bool
            recv: value
        name: PluralValue
        struct:
          unexported: true
      - methods:
          - name: Tag
            out:
              - type: corei18n.TagValue
            recv: pointer
          - in:
              - name: key
                type: corei18n.Key
              - name: args
                type: corei18n.Args
            name: Render
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: pointer
          - in:
              - name: key
                type: corei18n.Key
              - name: count
                type: corei18n.CountValue
              - name: args
                type: corei18n.Args
            name: RenderCount
            out:
              - name: rendered
                type: string
              - name: err
                type: error
            recv: pointer
        name: Printer
        struct:
          unexported: true
      - methods:
          - in:
              - name: tag
                type: corei18n.TagValue
              - name: key
                type: corei18n.Key
            name: Lookup
            out:
              - name: message
                type: corei18n.MessageValue
              - name: ok
                type: bool
            recv: pointer
          - name: Tags
            out:
              - type: "[]corei18n.TagValue"
            recv: pointer
          - in:
              - name: tag
                type: corei18n.TagValue
            name: Keys
            out:
              - type: "[]corei18n.Key"
            recv: pointer
          - name: Fallback
            out:
              - type: corei18n.TagValue
            recv: pointer
          - in:
              - name: tag
                type: corei18n.TagValue
            name: Missing
            out:
              - type: "[]corei18n.Key"
            recv: pointer
        name: Store
        struct:
          unexported: true
  - facade:
      - const:
          - doc: |-
              FormOther is the catch-all. Every language defines it and every message must
              carry it.
            name: FormOther
            note: |-
              The six CLDR plural categories, aliased from internal/core/app/i18n. FormOther
              is the zero Form, because it is the only category every language defines.

              They are declared one per const rather than as a group: their VALUES are the
              core package's, so an iota here would restate an ordering this package does
              not own and would silently diverge the day the core enum is reordered.
            reexport: corei18n.FormOther
            type: Form
            typed: true
            value: "0"
      - const:
          - doc: FormZero is the distinct nought of Arabic and Latvian.
            name: FormZero
            reexport: corei18n.FormZero
            type: Form
            typed: true
            value: "1"
      - const:
          - doc: FormOne is the singular of languages that have one.
            name: FormOne
            reexport: corei18n.FormOne
            type: Form
            typed: true
            value: "2"
      - const:
          - doc: FormTwo is the dual.
            name: FormTwo
            reexport: corei18n.FormTwo
            type: Form
            typed: true
            value: "3"
      - const:
          - doc: FormFew is the small plural of the Slavic and Semitic families.
            name: FormFew
            reexport: corei18n.FormFew
            type: Form
            typed: true
            value: "4"
      - const:
          - doc: |-
              FormMany is the large plural, and the compact-decimal form in several
              Romance languages.
            name: FormMany
            reexport: corei18n.FormMany
            type: Form
            typed: true
            value: "5"
      - alias:
          - doc: |-
              Tag is a language, optionally narrowed by a script and a region:
              `language[-Script][-REGION]` and deliberately nothing else. It is
              comparable, so it is a map key, and it holds its canonical spelling, so
              [Tag].String allocates nothing.
            name: Tag
            target: corei18n.TagValue
      - alias:
          - doc: |-
              Key names a message inside a catalogue. It is a developer identifier —
              "checkout.button.pay" — and it is what a render puts on screen when the
              translation is missing.
            name: Key
            target: corei18n.Key
      - alias:
          - doc: |-
              Message is one compiled translation. Its placeholders are parsed when the
              catalogue is built, so a malformed pattern fails at startup and a render
              never parses.
            name: Message
            target: corei18n.MessageValue
      - alias:
          - doc: |-
              Form is a CLDR plural category. [FormOther] is the zero value, because it is
              the only category every language defines.
            name: Form
            target: corei18n.Form
      - alias:
          - doc: |-
              Count is a quantity described by the CLDR plural operands. It carries the
              DISPLAY precision, because a quantity of one shown with a decimal is a different category
              in English and a float64 cannot tell them apart.
            name: Count
            target: corei18n.CountValue
      - alias:
          - doc: |-
              Args binds placeholder names to the text that replaces them. It is
              map[string]string on purpose — see the package comment.
            name: Args
            target: corei18n.Args
      - alias:
          - doc: |-
              Catalog is the message-source port, frozen at two methods (ADR 0039).
              [Store] implements it.
            name: Catalog
            target: corei18n.Catalog
      - alias:
          - doc: |-
              KeyLister is the ADR 0039 sibling that enumerates a catalog's keys, reached
              by type assertion. [Store].Missing is what it exists for.
            name: KeyLister
            target: corei18n.KeyLister
      - alias:
          - doc: |-
              Fallbacker is the ADR 0039 sibling that names a catalog's fallback language.
              A catalog with no fallback does not implement it, and the absence is the
              answer.
            name: Fallbacker
            target: corei18n.Fallbacker
      - alias:
          - doc: |-
              PluralRule reports which CLDR category a quantity falls in for one language.
              It is a func type, which satisfies ADR 0039 structurally.
            name: PluralRule
            target: corei18n.PluralRule
      - alias:
          - doc: |-
              Entry is one catalogue entry before it is compiled: a plain pattern
              ([Plain]) or one pattern per CLDR category ([PluralForms]).
            name: Entry
            target: svci18n.EntryValue
      - alias:
          - doc: Catalogue is one language's entries, keyed by message key.
            name: Catalogue
            target: svci18n.Catalogue
      - alias:
          - doc: |-
              Store is the concrete, immutable catalogue. It implements [Catalog],
              [KeyLister] and [Fallbacker].
            name: Store
            target: svci18n.Store
      - alias:
          - doc: |-
              Printer renders messages in one language. Build one per language at startup,
              not one per request — see [NewPrinter].
            name: Printer
            target: svci18n.Printer
      - alias:
          - doc: |-
              Negotiator resolves an Accept-Language header to one of a fixed set of
              languages. Everything that can be wrong is refused when it is built, so
              [Negotiator].Negotiate has no failure mode.
            name: Negotiator
            target: svci18n.Negotiator
      - alias:
          - doc: |-
              Plural is one language's CLDR plural specification: the categories it can
              produce, and the rule that picks between them.
            name: Plural
            target: svci18n.PluralValue
      - var:
          - doc: |-
              InvalidTag is returned by [ParseTag] for a tag outside the
              `language[-Script][-REGION]` subset. It is NOT what a peculiar
              Accept-Language header produces: [Negotiator].Negotiate skips an
              element it cannot use and never fails.
            name: InvalidTag
            reexport: corei18n.InvalidTag
            type: "*errs.Error"
          - doc: |-
              InvalidKey is returned for an empty message key, or one carrying a
              control character.
            name: InvalidKey
            reexport: corei18n.InvalidKey
            type: "*errs.Error"
          - doc: |-
              InvalidPattern is returned for a malformed pattern: an unclosed brace,
              an unmatched closing brace, or a placeholder name outside
              [A-Za-z_][A-Za-z0-9_]*.
            name: InvalidPattern
            reexport: corei18n.InvalidPattern
            type: "*errs.Error"
          - doc: |-
              ArgumentMissing is returned when [Args] does not carry a placeholder
              the pattern names. It names the placeholder and never a value.
            name: ArgumentMissing
            reexport: corei18n.ArgumentMissing
            type: "*errs.Error"
          - doc: |-
              MessageNotFound is returned when no language in the chain holds the
              key. The render still returns a non-empty string — the key itself.
            name: MessageNotFound
            reexport: corei18n.MessageNotFound
            type: "*errs.Error"
          - doc: |-
              PluralFormMissing is returned when a message is asked for a category it
              does not carry. A catalogue built by [NewStore] cannot produce it.
            name: PluralFormMissing
            reexport: corei18n.PluralFormMissing
            type: "*errs.Error"
          - doc: |-
              InvalidCount is returned by [Decimal] for a NaN, an infinity, or a
              fraction-digit count outside 0..9.
            name: InvalidCount
            reexport: corei18n.InvalidCount
            type: "*errs.Error"
          - doc: |-
              InvalidForm is returned by [ParseForm] for a name outside the six CLDR
              categories.
            name: InvalidForm
            reexport: corei18n.InvalidForm
            type: "*errs.Error"
          - doc: |-
              UnsupportedLanguage is returned when a catalogue or a printer names a
              language this SDK has no reviewed CLDR plural rule for. It is the
              domain's central refusal — see the package comment.
            name: UnsupportedLanguage
            reexport: corei18n.UnsupportedLanguage
            type: "*errs.Error"
          - doc: |-
              CatalogInvalid is returned for a catalogue that cannot be compiled: an
              unset or unserved fallback, a duplicate tag, or an entry of the wrong
              shape.
            name: CatalogInvalid
            reexport: corei18n.CatalogInvalid
            type: "*errs.Error"
          - doc: |-
              CatalogLoadFailed is returned when a catalogue directory cannot be read
              or its bytes cannot be decoded. The cause stays in the chain, so
              errors.Is(err, fs.ErrNotExist) still answers.
            name: CatalogLoadFailed
            reexport: corei18n.CatalogLoadFailed
            type: "*errs.Error"
          - doc: |-
              TranslationIncomplete is returned for a counted message missing a
              category its language can produce — the one catalogue defect a
              translator cannot see by reading their own file.
            name: TranslationIncomplete
            reexport: corei18n.TranslationIncomplete
            type: "*errs.Error"
          - doc: |-
              NegotiationEmpty is returned by [NewNegotiator] for an empty supported
              set, which is an unfinished wiring rather than "accept anything".
            name: NegotiationEmpty
            reexport: corei18n.NegotiationEmpty
            type: "*errs.Error"
      - func:
          doc: |-
            ParseTag canonicalises text into a [Tag], or returns [InvalidTag].

            "FR-latn-ca" and "fr-Latn-CA" are the same Tag. The POSIX spelling
            ("fr_FR"), extensions, variants, private use and grandfathered tags are each
            refused by name rather than parsed and dropped — a dropped subtag changes
            which language answers without changing anything a reader can see.
          forward: svci18n.ParseTag
          in:
            - name: text
              type: string
          name: ParseTag
          out:
            - name: tag
              type: Tag
            - name: err
              type: error
      - func:
          doc: |-
            ParseForm returns the [Form] named by a CLDR category spelling — "zero",
            "one", "two", "few", "many", "other" — or [InvalidForm].
          forward: corei18n.ParseForm
          in:
            - name: name
              type: string
          name: ParseForm
          out:
            - name: form
              type: Form
            - name: err
              type: error
      - func:
          doc: |-
            Int returns the [Count] of an exact integer displayed with no fraction
            digits. The sign is discarded, because CLDR's operands are defined on the
            absolute value.
          forward: corei18n.Int
          in:
            - name: "n"
              type: int64
          name: Int
          out:
            - type: Count
      - func:
          doc: |-
            Decimal returns the [Count] of value displayed with exactly fractionDigits
            fraction digits, or [InvalidCount].

            The second argument is the DISPLAY precision, not a property of the value:
            Decimal(1, 2) describes "1.00", which is `other` in English, while
            [Int](1) describes "1", which is `one`.
          forward: corei18n.Decimal
          in:
            - name: value
              type: float64
            - name: fractionDigits
              type: int
          name: Decimal
          out:
            - name: count
              type: Count
            - name: err
              type: error
      - func:
          doc: |-
            ValidateKey reports whether key is usable, and returns [InvalidKey] when it
            is not: empty, or carrying a control character.
          forward: corei18n.ValidateKey
          in:
            - name: key
              type: Key
          name: ValidateKey
          out:
            - type: error
      - func:
          doc: NewMessage compiles an uncounted message, or returns [InvalidPattern].
          forward: svci18n.NewMessage
          in:
            - name: text
              type: string
          name: NewMessage
          out:
            - name: message
              type: Message
            - name: err
              type: error
      - func:
          doc: |-
            NewPluralMessage compiles a counted message from one pattern per category,
            or returns [InvalidPattern], [InvalidForm] or [PluralFormMissing]. The map
            MUST contain [FormOther].

            It does not check the map against any language's rules — it does not know
            the language. [NewStore] does, and refuses there.
          forward: svci18n.NewPluralMessage
          in:
            - name: forms
              type: map[Form]string
          name: NewPluralMessage
          out:
            - name: message
              type: Message
            - name: err
              type: error
      - func:
          doc: Plain returns an uncounted [Entry].
          forward: svci18n.Plain
          in:
            - name: text
              type: string
          name: Plain
          out:
            - type: Entry
      - func:
          doc: |-
            PluralForms returns a counted [Entry] whose patterns are keyed by CLDR
            category name. A counted entry is checked at load against every category its
            language can produce.
          forward: svci18n.PluralForms
          in:
            - name: forms
              type: map[string]string
          name: PluralForms
          out:
            - type: Entry
      - func:
          doc: |-
            NewStore compiles catalogues into a [Store], or refuses.

            Every check is here, and every failure is a startup failure:
            [UnsupportedLanguage] for a language with no reviewed rule,
            [TranslationIncomplete] for a counted message missing one of its language's
            categories, [CatalogInvalid] for an unset or unserved fallback, and the core
            refusals for a bad key, pattern or category name.
          forward: svci18n.NewStore
          in:
            - name: fallback
              type: Tag
            - name: catalogues
              type: map[Tag]Catalogue
          name: NewStore
          out:
            - name: store
              type: "*Store"
            - name: err
              type: error
      - func:
          doc: |-
            LoadFS reads one catalogue file per language from dir and returns a [Store].

            The bytes are decoded by the codec domain, so a catalogue is JSON, YAML,
            TOML or any other registered format and this package contains no parser —
            blank-import pkg/v1/data/codec to register one. fsys is io/fs.FS, so an embed.FS,
            an os.DirFS and a pkg/v1/data/vfs filesystem all work here unchanged.

            The language comes from the file NAME: "en.json", "pt-PT.yaml".
            Subdirectories are ignored rather than walked, and two files that
            canonicalise to one tag are [CatalogInvalid].
          forward: svci18n.LoadFS
          in:
            - name: fsys
              type: fs.FS
            - name: dir
              type: string
            - name: format
              type: codec.Format
            - name: fallback
              type: Tag
          name: LoadFS
          out:
            - name: store
              type: "*Store"
            - name: err
              type: error
      - func:
          doc: |-
            NewPrinter returns a [Printer] rendering tag out of catalog, or refuses.

            It resolves the chain and allocates; [Printer].Render walks it and does not.
            Build one per language at startup and index them by [Tag] — a request then
            costs a map lookup, not a construction.
          forward: svci18n.NewPrinter
          in:
            - name: catalog
              type: Catalog
            - name: tag
              type: Tag
          name: NewPrinter
          out:
            - name: printer
              type: "*Printer"
            - name: err
              type: error
      - func:
          doc: |-
            NewNegotiator returns a [Negotiator] over supported, falling back to
            fallback, or refuses: an empty supported set is [NegotiationEmpty], an unset
            or unsupported fallback is [CatalogInvalid].
          forward: svci18n.NewNegotiator
          in:
            - name: supported
              type: "[]Tag"
            - name: fallback
              type: Tag
          name: NewNegotiator
          out:
            - name: negotiator
              type: "*Negotiator"
            - name: err
              type: error
      - func:
          doc: |-
            Rules returns the CLDR plural specification for tag, and reports whether the
            SDK has one. It resolves the exact tag first and the bare language second,
            so "pt-PT" gets its own rule and "fr-CA" inherits French's.
          forward: svci18n.Rules
          in:
            - name: tag
              type: Tag
          name: Rules
          out:
            - name: plural
              type: Plural
            - name: ok
              type: bool
      - func:
          doc: |-
            SupportedTags returns every language this SDK has a reviewed CLDR plural
            rule for, sorted. It is what [UnsupportedLanguage] names beside a refused
            tag.
          forward: svci18n.SupportedTags
          name: SupportedTags
          out:
            - type: "[]Tag"
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      corei18n: github.com/kitsunium/sdk/internal/core/app/i18n
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      svci18n: github.com/kitsunium/sdk/internal/service/app/i18n
    path: github.com/kitsunium/sdk/pkg/v1/app/i18n
