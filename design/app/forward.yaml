apiVersion: kit.kitsunium/design/v2
domain: app/forward
packages:
  - codes:
      - const:
          - doc: |-
              CodeForwardMisconfigured identifies a forwarder refused at construction —
              no broker, no sender, no classification, a negative bound or timeout,
              an unknown full policy — or an adapter built over no forwarder.
            name: CodeForwardMisconfigured
            note: |-
              range: 0.3.93.0 - 0.3.93.255

              The range was allocated to internal/service/app/forward, which raises
              these codes, and it is declared here, in the core mirror of that
              package's path, so that a domain's codes are never in the service
              layer (ADR 0160, ADR 0185).
            value: "0x00_03_5D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeForwardFull identifies a batch the forwarder did not keep because
              its queue held its bound of batches or bytes, under DropNewest, under
              Block once BlockTimeout ran out, or under DropOldest when nothing older
              could be taken out.
            name: CodeForwardFull
            value: "0x00_03_5D_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeBatchTooLarge identifies a batch larger on its own than the
              forwarder's MaxBytes, which no policy can make room for.
            name: CodeBatchTooLarge
            value: "0x00_03_5D_03"
        type: errs.Code
    doc: |-
      Package forward — range 0.3.93.* (ADR 0185 service/app/forward block,
      declared in the core per ADR 0160).

      Package forward — declares the sentinel *errs.Error outcomes of the
      store-and-forward export queue. Each var's name equals its errs.Define
      Reason in SCREAMING_SNAKE form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/forward
    sentinels:
      - var:
          - code: CodeForwardMisconfigured
            doc: ForwardMisconfigured refuses a forwarder that could never forward.
            exit: CONFIG
            name: ForwardMisconfigured
            private: "service/app/forward: New refused its Config, or an adapter was built over a nil forwarder; the fields name the setting and the problem"
            public: The export forwarder cannot run as configured
            reason: FORWARD_MISCONFIGURED
          - code: CodeForwardFull
            doc: |-
              ForwardFull refuses a batch the forwarder's queue had no room for. The
              batch is counted Dropped; a caller in front — a trace BatchSink —
              counts it failed as it did a collector that was down.
            http: 503
            name: ForwardFull
            private: "service/app/forward: the queue held MaxBatches batches or MaxBytes bytes and the full policy kept the older batches; the fields name the policy"
            public: The export queue is full
            reason: FORWARD_FULL
          - code: CodeBatchTooLarge
            doc: |-
              BatchTooLarge refuses a batch larger than the forwarder's MaxBytes on
              its own. It is counted Dropped. The fields name its size and the bound,
              never its bytes.
            http: 413
            name: BatchTooLarge
            private: "service/app/forward: a batch is larger than Config.MaxBytes on its own; the fields carry its size and the bound"
            public: The export batch is larger than the queue may hold
            reason: BATCH_TOO_LARGE
  - constants:
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultMaxBatches bounds the batches a forwarder holds when
          Config.MaxBatches is zero — the order of magnitude of the OpenTelemetry
          Collector's sending_queue.
        name: DefaultMaxBatches
        type: int
        value: "10_000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultMaxBytes bounds the bytes a forwarder holds when Config.MaxBytes
          is zero — Vector's smallest disk buffer.
        name: DefaultMaxBytes
        type: int64
        value: 256 << 20
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultBlockTimeout is how long Enqueue waits for room under Block when
          Config.BlockTimeout is zero.
        name: DefaultBlockTimeout
        type: time.Duration
        value: "5000000000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultSendTimeout bounds one attempt when Config.SendTimeout is zero —
          the OTLP specification's default OTEL_EXPORTER_OTLP_TIMEOUT.
        name: DefaultSendTimeout
        type: time.Duration
        value: "10000000000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultMaxAge is how long after the queue accepted it a batch may still
          be sent when Config.MaxAge is zero.
        name: DefaultMaxAge
        type: time.Duration
        value: "86400000000000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultRetryBase and DefaultRetryMax bound the wait between attempts
          when Config.Backoff is zero: five seconds, growing to thirty — the
          Collector's retry_on_failure numbers.
        name: DefaultRetryBase
        type: time.Duration
        value: "5000000000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: DefaultRetryMax is the ceiling of the default backoff.
        name: DefaultRetryMax
        type: time.Duration
        value: "30000000000"
      - blockDoc: |-
          The defaults a zero field clamps to (ADR 0031: each zero has one reading —
          "not thought about" — and the value below is the one that needs no
          explanation).
        doc: |-
          DefaultRecountInterval is how long the counts may go without the queue
          being counted again when Config.RecountInterval is zero: a backlog
          another process changed is said within a minute of a read.
        name: DefaultRecountInterval
        type: time.Duration
        value: "60000000000"
      - blockDoc: The three full policies. The zero is DropOldest.
        doc: |-
          DropOldest takes the oldest batches the consumer is not sending out of
          the queue, each counted Dropped, until the new one fits; when none can
          be taken it refuses the new one as DropNewest does.
        name: DropOldest
        type: FullPolicy
        value: "0"
      - blockDoc: The three full policies. The zero is DropOldest.
        doc: DropNewest refuses the new batch with ForwardFull, counted Dropped.
        name: DropNewest
        type: FullPolicy
        value: "1"
      - blockDoc: The three full policies. The zero is DropOldest.
        doc: |-
          Block waits for room up to Config.BlockTimeout, then refuses the new
          batch with ForwardFull, counted Dropped.
        name: Block
        type: FullPolicy
        value: "2"
    doc: |-
      Package forward is the store-and-forward engine (ADR 0185): a batch kept in
      a durable queue by Enqueue, sent later by Run through the caller's Sender,
      retried by resilience's retry on the injected clock — the delay a collector
      imposes honoured in full, the backoff otherwise, the batch's age as the
      budget —, dead-lettered when the sender refuses it for good, and counted at
      every step. The queue is bounded in batches and bytes, and a full one drops
      its oldest batch, refuses the newest, or makes the producer wait a bounded
      time. NewSpanExporter and NewMetricExporter put a signal's batch in, encoded
      once as the OTLP/JSON request its OTLP/HTTP exporter posts.

      Code range 0.3.93.*, declared in internal/core/app/forward (ADR 0160).
    functions:
      - doc: |-
          New builds a forwarder over cfg.Broker. It starts nothing: Run sends. When
          the broker is a queue.MessageReader — every broker of the SDK is — New
          counts the backlog a previous process left, so the bounds hold across a
          restart, and Run counts it again once Config.RecountInterval has passed,
          so they hold against what another process changes in it; ctx bounds the
          first count.
        in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: Config
        name: New
        out:
          - type: "*Forwarder"
          - type: error
      - doc: |-
          NewSpanExporter returns a trace ContextSpanExporter that encodes each
          batch as an OTLP/JSON ExportTraceServiceRequest and keeps it in forwarder,
          returning once it is durable — behind a trace BatchSink, an export costs
          one publication instead of a round trip to the collector. The forwarder's
          Send is the OTLP/HTTP exporter's ExportDocument. A nil forwarder is
          refused with ForwardMisconfigured.
        in:
          - name: name
            type: coretrace.ExporterName
          - name: forwarder
            type: "*Forwarder"
        name: NewSpanExporter
        out:
          - type: coretrace.ContextSpanExporter
          - type: error
      - doc: |-
          NewMetricExporter returns a metrics ContextExporter that encodes each
          snapshot as an OTLP/JSON ExportMetricsServiceRequest and keeps it in
          forwarder, returning once it is durable. The forwarder's Send is the
          OTLP/HTTP exporter's ExportDocument. A nil forwarder is refused with
          ForwardMisconfigured.
        in:
          - name: name
            type: coremetrics.ExporterName
          - name: forwarder
            type: "*Forwarder"
        name: NewMetricExporter
        out:
          - type: coremetrics.ContextExporter
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
      corequeue: github.com/kitsunium/sdk/internal/core/data/queue
      coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
      kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
    path: github.com/kitsunium/sdk/internal/service/app/forward
    types:
      - doc: |-
          Sender ships one batch, as the forwarder stored it, and returns the
          verdict the forwarder classifies with Config.Retryable. It is called on the
          forwarder's consumer, under a context bounded by Config.SendTimeout, and
          may be called again with the same bytes — after a retryable failure, or
          after a crash between its success and the acknowledgement.

          An OTLP/HTTP exporter's ExportDocument has its shape (trace and metrics
          DocumentExporter).
        name: Sender
        underlying: func(ctx context.Context, batch []byte) error
      - doc: FullPolicy says what Enqueue does with a batch the queue has no room for.
        methods:
          - doc: |-
              String renders the policy for a log line; a value this package never mints
              renders as "unknown".
            name: String
            out:
              - type: string
            recv: value
        name: FullPolicy
        underlying: uint8
      - doc: |-
          Config configures [New]. Broker, Send and Retryable are required; every
          other field is optional.
        name: Config
        struct:
          fields:
            - doc: |-
                Broker is the queue the forwarder holds its batches in: a directory
                (queue.NewFile) for a backlog that outlives the process, a table
                (queue.NewSQL), or memory. One queue per signal. Build it with a
                VisibilityTimeout above SendTimeout, a MaxDeliveries no outage reaches
                — MaxAge is the forwarder's budget — and a MaxMessageBytes that holds
                a batch. The forwarder neither sets its policy nor closes it.
              name: Broker
              type: corequeue.Broker
            - doc: |-
                Send ships one stored batch: an OTLP/HTTP exporter's ExportDocument,
                or any function of that shape.
              name: Send
              type: Sender
            - doc: |-
                Retryable classifies a failure of Send as one a later attempt may cure
                — trace.OTLPRetryable, metrics.OTLPRetryable. It is REQUIRED: nil reads
                as "retry everything" or as "retry nothing", two opposites. A failure
                it calls permanent is dead-lettered at once.
              name: Retryable
              type: func(error) bool
            - doc: |-
                Clock paces every retry, bounds every attempt and the wait of Block,
                and ages every batch. Nil means clock.System; a clock.ManualClock drives
                a test without a sleep. It must be the broker's: a batch's age is read
                from the instant the broker stamped.
              name: Clock
              type: clock.Timed
            - doc: |-
                MaxBatches bounds the batches the forwarder holds. Zero means
                DefaultMaxBatches; negative is refused.
              name: MaxBatches
              type: int
            - doc: |-
                MaxBytes bounds the bytes the forwarder holds. Zero means
                DefaultMaxBytes; negative is refused. A batch larger on its own is
                refused with BatchTooLarge.
              name: MaxBytes
              type: int64
            - doc: |-
                WhenFull is what Enqueue does when either bound is reached. The zero
                is DropOldest.
              name: WhenFull
              type: FullPolicy
            - doc: |-
                BlockTimeout bounds the wait of Block. Zero means DefaultBlockTimeout;
                negative is refused.
              name: BlockTimeout
              type: time.Duration
            - doc: |-
                SendTimeout bounds one attempt, on Clock. Zero means
                DefaultSendTimeout; negative is refused.
              name: SendTimeout
              type: time.Duration
            - doc: |-
                MaxAge is how long after the queue accepted it a batch may still be
                sent: one delivered older is dropped unsent, one whose retryable
                failure finds it older is not retried; either is acknowledged and
                counted Expired. A Retry-After is honoured in full, but never past it.
                Zero means DefaultMaxAge; negative is refused.
              name: MaxAge
              type: time.Duration
            - doc: |-
                Backoff is the wait before each retry when the failure imposes none:
                Backoff.Delay(attempt). The zero value is the
                DefaultRetryBase–DefaultRetryMax curve, and a curve without a positive
                BaseDelay starts from DefaultRetryBase under its own ceiling: a failed
                batch is never retried at once.
              name: Backoff
              type: kbackoff.Value
            - doc: |-
                Parallelism is how many consumers send at once. Non-positive is one,
                which keeps the queue's order while nothing fails and sends one request
                at a time to a collector that is down; above one there is no order.
              name: Parallelism
              type: int
            - doc: |-
                PollInterval is how late a batch another PROCESS queued may be
                noticed; one Enqueue queued in this process is sent at once. Zero is
                the queue's own default.
              name: PollInterval
              type: time.Duration
            - doc: |-
                DrainTimeout is how long the batch being sent when Run's context ends
                may still run. Zero stops it at once; it is then handed back uncounted
                and sent by the next process.
              name: DrainTimeout
              type: time.Duration
            - doc: |-
                SettleTimeout bounds each acknowledgement and hand-back once Run's
                context has ended. Zero is the queue's own default.
              name: SettleTimeout
              type: time.Duration
            - doc: |-
                RecountInterval is how long the counts go before the queue is counted
                again, over a broker that lists its messages: a read of Stats, or a
                batch leaving the queue, once it has passed has Run list the queue and
                count what another process changed in it — a dead letter replayed into
                it, a batch another consumer took. The delivery of a batch the
                forwarder did not count has it counted at once. A count reads every
                live batch, its payload included, on Run's goroutine and never on
                Enqueue's: it costs what the backlog weighs. Zero means
                DefaultRecountInterval; negative is refused.
              name: RecountInterval
              type: time.Duration
      - doc: |-
          Forwarder holds batches in a durable queue and sends each one later,
          retried while its failure is retryable and its age allows, dead-lettered
          when the sender refuses it for good, and counted at every step. Enqueue
          keeps a batch; Run sends; Stats reads the counters. It is safe for
          concurrent use.
        methods:
          - doc: |-
              Enqueue keeps batch in the queue, durably once it returns nil, for Run to
              send. An empty batch is kept nowhere. A batch larger than MaxBytes is
              refused with BatchTooLarge; one the queue has no room for is handled by
              Config.WhenFull — older batches dropped, or ForwardFull, or a bounded wait
              — and every batch lost to a bound is counted Dropped. ctx bounds the
              publication and the wait.
            in:
              - name: ctx
                type: context.Context
              - name: batch
                type: "[]byte"
            name: Enqueue
            out:
              - type: error
            recv: pointer
          - doc: |-
              Stats returns the forwarder's counters, read at once. A read once
              Config.RecountInterval has passed since the queue was last counted asks
              Run to count it again, and returns the counts as they stand.
            name: Stats
            out:
              - type: StatsValue
            recv: pointer
          - doc: |-
              Run sends the queued batches until ctx ends, one consumer per
              Config.Parallelism, and returns what the queue's consumer returns. The
              batch being sent when ctx ends may finish within Config.DrainTimeout; one
              cut short is handed back uncounted and sent by the next process. Over a
              broker that lists its messages, Run also counts the queue again when
              asked: by a read of Stats or a batch leaving the queue once
              Config.RecountInterval has passed, and at once by the delivery of a batch
              this forwarder did not count.

              Goroutine lifecycle: one counts the queue when asked, until the consumer
              returns; Run waits for it before it returns.
            in:
              - name: ctx
                type: context.Context
            name: Run
            out:
              - type: error
            recv: pointer
        name: Forwarder
        struct:
          unexported: true
      - doc: |-
          StatsValue is what a forwarder holds, has done and has lost, read at once
          by [Forwarder.Stats]. The counters count since New; Pending and
          PendingBytes start from the backlog New found in the queue, and follow
          it: what the forwarder keeps and settles at once, what another process
          changed in it at the next count (Config.RecountInterval).
        name: StatsValue
        struct:
          fields:
            - doc: |-
                LastRetryAfterAt is when a collector last imposed a delay; zero when
                none has.
              name: LastRetryAfterAt
              type: time.Time
            - doc: PendingBytes is the bytes of the batches the forwarder holds.
              name: PendingBytes
              type: int64
            - doc: |-
                LastRetryAfter is the last delay a collector imposed — a Retry-After
                — as the failure carried it.
              name: LastRetryAfter
              type: time.Duration
            - doc: |-
                Pending is the batches the forwarder holds: queued, waiting or being
                sent.
              name: Pending
              type: int
            - doc: Enqueued counts the batches Enqueue kept.
              name: Enqueued
              type: uint64
            - doc: Sent counts the batches the sender accepted.
              name: Sent
              type: uint64
            - doc: Retries counts the attempts made after a retryable failure.
              name: Retries
              type: uint64
            - doc: |-
                Dropped counts the batches lost to a bound: refused by a full queue or
                as too large, or taken out of it by DropOldest.
              name: Dropped
              type: uint64
            - doc: Expired counts the batches dropped because they outlived MaxAge.
              name: Expired
              type: uint64
            - doc: |-
                DeadLettered counts the batches the sender refused for good, kept in
                the broker's dead-letter store.
              name: DeadLettered
              type: uint64
  - doc: |-
      Package forward is the public facade for store and forward: an export that
      waits on disk while the collector it is meant for is down, and a count of
      what it held, sent and lost (ADR 0185).

      A [Forwarder] holds each batch as one message of a queue (package
      [github.com/kitsunium/sdk/pkg/v1/data/queue]: a directory or a table, which
      outlive the process, or memory, which does not) and sends it later through a
      [Sender] its caller supplies. [Forwarder].Enqueue returns once the queue holds
      the batch — durably, and across a restart, only on a directory or a table;
      [Forwarder].Run sends, one batch at a time by
      default, each retried on the forwarder's clock while [Config].Retryable calls its
      failure retryable and the batch is younger than [Config].MaxAge — waiting the
      delay a collector imposes (a Retry-After) in full, otherwise a backoff from
      five to thirty seconds. A batch the sender refuses for good is dead-lettered in
      the queue; one that outlives its age is dropped. The queue is bounded in
      batches and in bytes, and [Config].WhenFull says what happens at the bound:
      [DropOldest] (the zero), [DropNewest], or [Block] for a bounded time.
      [Forwarder].Stats counts what is pending, sent, retried, dropped, expired and
      dead-lettered, and the last delay a collector imposed.

      For telemetry, the producer is an adapter put where the network exporter was,
      and the sender is the network exporter's DocumentExporter:

      	otlp, err := trace.NewOTLPHTTPExporter("otlp", trace.OTLPHTTPConfig{Endpoint: endpoint})
      	document, _ := otlp.(trace.DocumentExporter)
      	broker, err := queue.NewFile(queue.FileConfig{Dir: "/var/lib/app/spans", Policy: policy})
      	fw, err := forward.New(ctx, forward.Config{
      		Broker:    broker,
      		Send:      document.ExportDocument,
      		Retryable: trace.OTLPRetryable,
      	})
      	go fw.Run(ctx) // or under lifecycle.NewSupervisor
      	spans, err := forward.NewSpanExporter("otlp-durable", fw) // behind a trace.BatchSink

      One queue per signal: metrics take their own forwarder, through
      [NewMetricExporter] and the metrics exporter's DocumentExporter.

      A batch the forwarder keeps until a send — one no full queue dropped and no
      MaxAge expired, counted Dropped or Expired otherwise — is sent at least once:
      a process that dies between the collector's acceptance and the
      acknowledgement sends it again. A trace backend sees a duplicate span; a
      cumulative metric point repeats a value; a DELTA metric point is counted
      twice. A product exporting delta temporality through a forwarder accepts
      that, or exports cumulative.
    facade:
      - const:
          - doc: |-
              DefaultMaxBatches bounds the batches a forwarder holds when
              Config.MaxBatches is zero.
            name: DefaultMaxBatches
            reexport: svcforward.DefaultMaxBatches
            type: int
            typed: true
            value: "10_000"
          - doc: |-
              DefaultMaxBytes bounds the bytes a forwarder holds when Config.MaxBytes
              is zero.
            name: DefaultMaxBytes
            reexport: svcforward.DefaultMaxBytes
            type: int64
            typed: true
            value: 256 << 20
          - doc: |-
              DefaultBlockTimeout bounds the wait of Block when Config.BlockTimeout is
              zero.
            name: DefaultBlockTimeout
            reexport: svcforward.DefaultBlockTimeout
            type: time.Duration
            typed: true
            value: "5000000000"
          - doc: DefaultSendTimeout bounds one attempt when Config.SendTimeout is zero.
            name: DefaultSendTimeout
            reexport: svcforward.DefaultSendTimeout
            type: time.Duration
            typed: true
            value: "10000000000"
          - doc: |-
              DefaultMaxAge is how old a batch may be and still be sent when
              Config.MaxAge is zero.
            name: DefaultMaxAge
            reexport: svcforward.DefaultMaxAge
            type: time.Duration
            typed: true
            value: "86400000000000"
          - doc: |-
              DefaultRetryBase and DefaultRetryMax bound the wait between attempts
              when Config.Backoff is zero; DefaultRetryBase is also the first wait of
              a curve that sets no BaseDelay.
            name: DefaultRetryBase
            reexport: svcforward.DefaultRetryBase
            type: time.Duration
            typed: true
            value: "5000000000"
          - name: DefaultRetryMax
            reexport: svcforward.DefaultRetryMax
            type: time.Duration
            typed: true
            value: "30000000000"
          - doc: |-
              DefaultRecountInterval is how long the counts may go without the queue
              being counted again when Config.RecountInterval is zero.
            name: DefaultRecountInterval
            reexport: svcforward.DefaultRecountInterval
            type: time.Duration
            typed: true
            value: "60000000000"
        doc: "The forwarder's defaults: each zero field of Config takes one."
      - const:
          - doc: |-
              DropOldest, the zero: the oldest batches not being sent are taken out,
              counted Dropped, until the new one fits.
            name: DropOldest
            reexport: svcforward.DropOldest
            type: FullPolicy
            typed: true
            value: "0"
          - doc: "DropNewest: the new batch is refused with Full, counted Dropped."
            name: DropNewest
            reexport: svcforward.DropNewest
            type: FullPolicy
            typed: true
            value: "1"
          - doc: |-
              Block: the producer waits for room up to Config.BlockTimeout, then the
              batch is refused with Full, counted Dropped.
            name: Block
            reexport: svcforward.Block
            type: FullPolicy
            typed: true
            value: "2"
        doc: What Enqueue does with a batch the queue has no room for.
      - alias:
          - doc: |-
              Forwarder is the public alias for the store-and-forward queue: Enqueue,
              Run, Stats.
            name: Forwarder
            target: svcforward.Forwarder
      - alias:
          - doc: |-
              Config is the public alias for a forwarder's configuration: Broker, Send
              and Retryable required; Clock, MaxBatches, MaxBytes, WhenFull,
              BlockTimeout, SendTimeout, MaxAge, Backoff, Parallelism, PollInterval,
              DrainTimeout, SettleTimeout and RecountInterval optional.
            name: Config
            target: svcforward.Config
      - alias:
          - doc: |-
              FullPolicy is the public alias for what Enqueue does when the queue is
              full.
            name: FullPolicy
            target: svcforward.FullPolicy
      - alias:
          - doc: |-
              Stats is the public alias for what a forwarder holds, has sent and has
              lost.
            name: Stats
            target: svcforward.StatsValue
      - alias:
          - doc: |-
              Sender is the public alias for the function that ships one stored batch —
              an OTLP/HTTP exporter's ExportDocument.
            name: Sender
            target: svcforward.Sender
      - doc: |-
          The forwarder's sentinels (0.3.93.*). errors.Is matches one, and
          errs.CodeOf reads its code.
        var:
          - doc: |-
              Misconfigured refuses a forwarder that could never forward, and an
              adapter over no forwarder.
            name: Misconfigured
            reexport: coreforward.ForwardMisconfigured
            type: "*errs.Error"
            typed: true
          - doc: Full refuses a batch the queue had no room for.
            name: Full
            reexport: coreforward.ForwardFull
            type: "*errs.Error"
            typed: true
          - doc: BatchTooLarge refuses a batch larger than Config.MaxBytes on its own.
            name: BatchTooLarge
            reexport: coreforward.BatchTooLarge
            type: "*errs.Error"
            typed: true
      - func:
          doc: |-
            New builds a forwarder over cfg.Broker, counting the backlog a previous
            process left in it; Run counts it again once Config.RecountInterval has
            passed. It starts nothing: Run sends.
          forward: svcforward.New
          in:
            - name: ctx
              type: context.Context
            - name: cfg
              type: Config
          name: New
          out:
            - type: "*Forwarder"
            - type: error
      - func:
          doc: |-
            NewSpanExporter returns a trace ContextSpanExporter that encodes each batch
            as OTLP/JSON and keeps it in forwarder — the exporter to put behind a
            trace BatchSink.
          forward: svcforward.NewSpanExporter
          in:
            - name: name
              type: coretrace.ExporterName
            - name: forwarder
              type: "*Forwarder"
          name: NewSpanExporter
          out:
            - type: coretrace.ContextSpanExporter
            - type: error
      - func:
          doc: |-
            NewMetricExporter returns a metrics ContextExporter that encodes each
            snapshot as OTLP/JSON and keeps it in forwarder.
          forward: svcforward.NewMetricExporter
          in:
            - name: name
              type: coremetrics.ExporterName
            - name: forwarder
              type: "*Forwarder"
          name: NewMetricExporter
          out:
            - type: coremetrics.ContextExporter
            - type: error
    imports:
      coreforward: github.com/kitsunium/sdk/internal/core/app/forward
      coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
      coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcforward: github.com/kitsunium/sdk/internal/service/app/forward
    path: github.com/kitsunium/sdk/pkg/v1/app/forward
