apiVersion: kit.kitsunium/design/v2
domain: app/lock
packages:
  - codes:
      - const:
          - doc: |-
              CodeLockMisconfigured identifies a locker refused AT CONSTRUCTION because
              its configuration cannot be honoured — most importantly a lease TTL that is
              not positive.

              A zero TTL is refused rather than read as "expires immediately" or as "never
              expires". Both readings are defensible and they are opposites, so whichever
              the SDK picked would be wrong for half its callers, and wrong SILENTLY: a
              lock granted with an already-elapsed lease reports success on every call and
              excludes nobody. This is ADR 0031's refuse half at its sharpest.
            name: CodeLockMisconfigured
            note: "range: 0.2.21.0 - 0.2.21.255"
            value: "0x00_02_15_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockNotHeld identifies an Extend or a Release from a holder that no
              longer owns the lock — its lease expired and someone else took it.

              It is never a cosmetic outcome. On Extend it means the caller is inside a
              section another holder also believes it owns. On Release it means the call
              released nothing, deliberately: releasing under a name that now belongs to
              someone else would unlock THEIR critical section.
            name: CodeLockNotHeld
            value: "0x00_02_15_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockBackendFailed identifies a locker that could not answer at all — the
              medium, the filesystem, the process it depends on.

              A lock simply being HELD is not this: TryAcquire reports that as
              (nil, false, nil), because a caller that offered to give up immediately has
              had its offer accepted and nothing went wrong.
            name: CodeLockBackendFailed
            value: "0x00_02_15_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockNameRejected identifies a lock name a locker refuses: the empty
              string, or one longer than the backend can represent.

              An empty name is refused rather than accepted as a legitimate key, because
              it is what an uninitialised variable produces: accepting it would silently
              serialise every unrelated caller in the program through one lock, which
              looks like a mysterious performance collapse and never like a bug.
            name: CodeLockNameRejected
            value: "0x00_02_15_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockFenceCorrupt identifies a fence ledger no further token can be
              issued from: its contents are not a decimal counter (`condition=unparseable`)
              or they are the one counter with no successor (`condition=exhausted`).

              It is refused rather than repaired. "Repairing" it means restarting the
              counter, and a restarted fencing token is not a fencing token at all: the
              numbers it issues have already been seen by the protected resource, so the
              resource accepts a stale holder's write believing it to be current. A lock
              that cannot prove monotonicity says so instead of issuing numbers that look
              fine.

              The two conditions share a code because they share that remedy exactly: stop,
              and have a human look at the ledger. Splitting them would ask every caller to
              learn a second code for the same instruction.
            name: CodeLockFenceCorrupt
            note: |-
              range: 0.3.51.0 - 0.3.51.255

              The concrete lockers' outcomes. The range was allocated to
              internal/service/app/lock, whose lockers raise these codes, and it is
              declared here with the port's so that every code of the domain is in one
              place (ADR 0160). A code keeps the value its allocation gave it whichever
              layer declares it, so the layer byte still reads 3.
            value: "0x00_03_33_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockDirectoryUnsafe identifies a lock directory that is world-writable
              without the sticky bit.

              The exposure is not the counter — it is the inode. Anyone able to unlink the
              lock file can replace it with a fresh one, after which a new process flocks
              the NEW inode while the old holder still flocks the old one, and the two
              hold "the same" lock simultaneously. The sticky bit is what makes a shared
              directory such as /tmp safe, so it is accepted; its absence is not.
            name: CodeLockDirectoryUnsafe
            value: "0x00_03_33_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockKeepaliveLost identifies a background renewal that failed.

              It marks the point at which the caller stopped holding the lock while still
              running inside the section it protects. It is carried as a context CAUSE
              rather than a return value, because the whole purpose of a keepalive is to
              tell work that is already in progress — and the only channel that reaches
              in-progress work is its context.
            name: CodeLockKeepaliveLost
            value: "0x00_03_33_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockPathRedirected identifies a lock path that is not a file but an
              indirection to one: a symbolic link on Unix, a reparse point on Windows.

              The lock filename is the SHA-256 of the lock name, which makes it
              derived from no caller-supplied string, and in the same stroke PREDICTABLE —
              and predictable is what the attack needs.
              An indirection planted there sends the flock and the fencing ledger to a
              file the attacker chose, so the victim's lock and the attacker's own lock
              cover different inodes while both report success: two processes inside one
              section, neither blocked, nothing logged. It also hands the attacker the
              fencing token, since the ledger the victim increments is the attacker's file.

              It is NOT the core's LOCK_BACKEND_FAILED. Nothing failed — a deliberate
              substitution succeeded, and reading it as a medium fault invites the one
              response that is wrong here, a retry. It is its own code for the same reason
              [CodeLockDirectoryUnsafe] is: the remedy is a human looking at the directory.
            name: CodeLockPathRedirected
            value: "0x00_03_33_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeLockFileReplaced identifies a held lock whose FILE is no longer the one
              its name leads to: the entry was unlinked, or replaced by a different file,
              while this holder still had it open and locked.

              The exclusion is gone at that moment, silently. The holder's flock still
              covers an inode nothing names, so the next process to acquire creates a
              fresh file, locks THAT, reads a fence ledger that starts again at zero, and
              is told it holds the lock — while the first holder is still inside the
              section believing the same thing. Measured: two holders, two inodes, both
              reporting fence 1.

              It is separate from [CodeLockDirectoryUnsafe] because it is a different
              question asked at a different time. That code refuses a directory at
              construction on its mode; this one reports a lock that WAS taken and is no
              longer exclusive, in a directory whose mode the rule accepts — 0777|sticky,
              which is what /tmp is, lets the entry's own owner unlink it.

              It is reported and never repaired. Re-acquiring would hand the caller a
              second lease over the new file while the old one is still locked, which is
              the split-brain spelled deliberately.
            name: CodeLockFileReplaced
            value: "0x00_03_33_05"
        type: errs.Code
    doc: |-
      Package lock — ranges 0.2.21.* (ADR 0052 core/app/lock block) and 0.3.51.*
      (ADR 0052 service/app/lock block, declared here since ADR 0160).

      Package lock — declares the sentinel *errs.Error outcomes of the domain: the
      port's, and those the concrete lockers emit. Each var's name equals its
      errs.Define Reason in SCREAMING_SNAKE form.

      Package lock declares the SDK's mutual-exclusion DOMAIN: the [Locker] port
      that hands out named exclusive leases, the [Lease] a holder gets back, and
      the sibling interface through which a lease says whether it can expire at
      all. A core sibling admitted by ADR 0052.

      # A lock that lies is worse than no lock

      Every decision in this package follows from one observation: a caller who
      believes they hold a critical section behaves differently from a caller who
      knows they do not. A lock that reports success it cannot back removes the
      second behaviour and leaves nothing in its place, so the failure is silent,
      unreproducible, and discovered as data corruption rather than as an error.
      ADR 0031's refuse-rather-than-default rule is therefore not a style choice
      here: a lease TTL of zero is refused AT CONSTRUCTION rather than read as
      "expires immediately", because a lock that expires the instant it is granted
      is exactly the shape of a lock that lies.

      # Expiring a lease does not stop its old holder

      This is the trap the domain is built around, and it is worth stating in
      full. Suppose A holds a lease with a five-second TTL, and A's goroutine
      stalls — a long GC pause, a blocked syscall, a descheduled thread. Five
      seconds pass. B acquires the same lock, correctly, because the lease has
      expired. A resumes. A has no idea anything happened: nothing interrupted it,
      nothing told it, and its next write lands inside a section B believes it
      owns alone.

      No lock service anywhere fixes this by itself, because the lock is not
      holding A — A's own belief is. Three things follow, and this domain decides
      all three rather than leaving them emergent:

       1. OWNERSHIP IS TOKEN-CHECKED. A [Lease] identifies its holder, and
          [Lease.Release] releases only a lock this holder still holds. A lease
          that was taken over releases NOTHING and reports [LockNotHeld] — because
          the alternative, "release whatever is under that name", is A politely
          unlocking B's critical section.
       2. A LEASE CAN BE RENEWED. [Lease.Extend] pushes the deadline out for work
          that outlives its TTL. Without it, a TTL is a bet that the work finishes
          in time, and the losing side of that bet is silent. A FAILED Extend is
          not a warning: it is the holder being told it has already lost the lock,
          and the only correct response is to stop.
       3. A FENCING TOKEN IS ISSUED. [Lease.Fence] returns a uint64 that strictly
          increases with every acquisition of that name. Handed to the protected
          resource and compared there, it turns the scenario above from silent
          corruption into a rejected write: A carries fence 7, B carries 8, the
          resource has seen 8, so A's write is refused.

      # What this domain does NOT guarantee

      Issuing a fencing token is not the same as enforcing one. The SDK can only
      hand the number to the caller; the RESOURCE has to compare it and refuse the
      lower one, and most resources — a file, an HTTP endpoint, a table without a
      version column — cannot. Where the fence is not checked, mutual exclusion is
      not guaranteed against a stalled holder: a long GC pause, a SIGSTOP, or a
      descheduled thread can put two holders inside one section, and neither will
      observe it.

      That is a limitation, stated here rather than buried, because a reader who
      assumes otherwise will build on a guarantee that does not exist. If the
      protected resource cannot check a fence, do not rely on a lease TTL for
      correctness — use a backend whose lock does not expire at all
      (internal/service/app/lock's file store is one; see its CLAUDE.md) and accept a
      hung holder blocking its waiters, which is a liveness failure you can see
      instead of a safety failure you cannot.

      # There is no registry

      Like proc (ADR 0016), resilience (ADR 0026), net (ADR 0029), scheduler
      (ADR 0041), token (ADR 0042), session (ADR 0045), validation (ADR 0046) and
      cache (ADR 0049), this domain has no name-to-implementation registry.

      The reason is specific to locking and it is not taste. The two backends
      differ in the one property a caller must know — whether a lease can be
      taken away from a live holder — and resolving one of them from a
      configuration string would let a typo swap a lock that never expires for a
      lock that does, silently, with no failure at the moment of the swap. Every
      call would still succeed. The difference would surface only as the rarest
      class of production bug there is.

      # Distributed locks are out of scope

      A lock over Redis, etcd, ZooKeeper or Consul is a connector to a third-party
      system and belongs under third-party/, not here. This domain covers exactly
      two scopes: one process (goroutines) and one machine (processes sharing a
      filesystem). It never implies a third.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/lock
    ports:
      - doc: |-
          Lease is a held lock. It is what [Locker.Acquire] returns and the ONLY
          handle through which the lock can be renewed or released.

          The method set is FROZEN at three under ADR 0039, for the same reason
          [Locker] is: pkg/v1 aliases it, Go interfaces are structural, and a fourth
          method would break every downstream double at compile time. [Deadliner] is
          the sibling that ships.

          A Lease is safe for concurrent use, but it is not a value to pass around
          casually: it carries the holder's identity, and whoever holds it can release
          the lock.
        methods:
          - doc: |-
              Fence returns this acquisition's fencing token: a uint64 that strictly
              increases with every successful acquisition of the same name, whoever
              acquires it.

              It is the only mechanism in this domain that survives a stalled holder,
              and it only works if the PROTECTED RESOURCE compares it and refuses the
              lower one. Handing it to a resource that ignores it buys nothing; see
              the package comment for what is and is not guaranteed as a result.

              Fence never returns 0 for a live lease. Zero is the "no acquisition"
              value, so a caller that forgets to plumb the token through cannot have
              it silently compare equal to a legitimate one.
            name: Fence
            out:
              - type: uint64
          - doc: |-
              Extend renews the lease for another full lifetime, starting now.

              It returns [LockNotHeld] when this holder no longer owns the lock —
              which is not a warning to log and continue past. It means another holder
              is, or soon will be, inside the section this caller believes it owns.
              The only correct response is to stop the protected work.

              On an implementation whose leases cannot expire, Extend re-asserts
              ownership and succeeds; it is never a silent no-op that hides a lost
              lock, because there is no way for such a lock to be lost while held.
            in:
              - name: ctx
                type: context.Context
            name: Extend
            out:
              - type: error
          - doc: |-
              Release gives the lock up. It releases ONLY a lock this holder still
              holds: a lease that was taken over after expiring releases nothing and
              reports [LockNotHeld], because unlocking a section another holder is
              inside would be worse than leaking the lock.

              Releasing a lease this holder already released is not an error — the
              caller's intent is satisfied — so `defer lease.Release(ctx)` next to an
              explicit release is safe.
            in:
              - name: ctx
                type: context.Context
            name: Release
            out:
              - type: error
        name: Lease
      - doc: |-
          Deadliner is the sibling interface (ADR 0039) implemented by a [Lease] that
          CAN expire. Reach it by type assertion:

          	if d, ok := lease.(lock.Deadliner); ok {
          	    // this lease has a deadline, and can be taken from us at it
          	}

          The assertion is the answer to the only question that changes how a caller
          must be written. A lease that implements Deadliner can be taken away from a
          live holder, so its work must either finish before the deadline, renew, or
          carry the fence through to the resource. A lease that does NOT implement it
          cannot be taken away at all, so none of that is needed — and a caller can
          tell which world it is in without naming an implementation.

          This is deliberately not a Deadline method on [Lease] returning a zero time
          for "never". A zero time.Time is a value someone will compare against
          time.Now and lose to; an absent interface is not.
        methods:
          - doc: |-
              Deadline returns the instant at which this lease stops being held
              unless it is renewed first. It moves forward on every successful
              [Lease.Extend].
            name: Deadline
            out:
              - type: time.Time
        name: Deadliner
      - doc: |-
          Locker hands out named, exclusive leases. Implementations MUST be safe for
          concurrent use by multiple goroutines.

          The method set is deliberately two operations wide and is FROZEN: pkg/v1
          aliases this interface, so under ADR 0039 a third method would break every
          downstream implementer at compile time with no deprecation window. New
          capabilities arrive as SIBLING interfaces discovered by type assertion —
          [Deadliner] on the lease is the one that ships, and the model is codec's
          Appender (ADR 0037).

          There is no TTL parameter on either method, and its absence is the design.
          A lease lifetime belongs to the WORK being protected, which is known where a
          Locker is wired, not at the call site — and a per-call duration would create
          exactly one place where a zero can be typed by accident, in a hot path,
          under time pressure, and be read as a lock that has already expired. The TTL
          lives in the implementation's configuration and is refused there if it is
          not positive (ADR 0031, ADR 0052).

          IFACE-PLUGIN: the concrete lockers stay unexported behind their constructors
          in internal/service/app/lock.
        methods:
          - doc: |-
              Acquire blocks until the named lock is held by this caller or ctx ends.
              On success it returns a [Lease] that MUST eventually be released.

              A cancelled or expired ctx returns the context's own error, not an SDK
              sentinel: the caller supplied the deadline and already knows what it
              means. An empty name is refused with [LockNameRejected].
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
            name: Acquire
            out:
              - type: Lease
              - type: error
          - doc: |-
              TryAcquire attempts the acquisition once and never waits for another
              holder. It reports (lease, true, nil) on success and (nil, false, nil)
              when the lock is held elsewhere.

              "Held elsewhere" is NOT an error: a caller that offered to give up
              immediately has had its offer accepted, and nothing went wrong. An error
              return means the backend could not answer the question at all.
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
            name: TryAcquire
            out:
              - type: Lease
              - type: bool
              - type: error
        name: Locker
    sentinels:
      - var:
          - code: CodeLockMisconfigured
            doc: |-
              LockMisconfigured is returned by a locker CONSTRUCTOR whose
              configuration it cannot honour.

              The load-bearing case is a non-positive lease TTL, and it is refused
              rather than defaulted for a reason that does not apply to most policies:
              the two natural readings of a zero TTL — "already expired" and "never
              expires" — are exact opposites, and a locker built on the first one
              still answers every call successfully while excluding nobody at all.
              Nothing downstream can tell that apart from a lock nobody contends.

              Refusing at CONSTRUCTION rather than at the first Acquire is the other
              half: it puts the failure where the program is wired, in the process's
              first second, instead of in the middle of the first contended section.
            name: LockMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/lock: a locker constructor received a TTL, a directory or a poll interval it cannot honour; the fields name the option and the value"
            public: The lock cannot be built from the given configuration
            reason: LOCK_MISCONFIGURED
          - code: CodeLockNotHeld
            doc: |-
              LockNotHeld is returned by Extend or Release when the caller's lease has
              been taken over by another holder.

              From Extend it is the single most important error this domain can
              produce: it is the SDK telling a caller that it is executing inside a
              critical section someone else also believes they own. It must abort the
              protected work, not log and continue — the lock cannot be re-taken
              "quickly" to fix it, because the other holder is already inside.

              From Release it means the call deliberately released NOTHING. The
              alternative — unlocking whatever currently sits under that name — would
              have this caller end another caller's critical section on its way out.
            name: LockNotHeld
            private: "core/app/lock: Extend or Release ran against a lease whose lock has since been acquired by another holder; the fields name the lock and the fencing tokens involved"
            public: The lease is no longer held by this caller
            reason: LOCK_NOT_HELD
          - code: CodeLockBackendFailed
            doc: |-
              LockBackendFailed is returned when the locker itself could not serve the
              operation. A lock being HELD is not this — TryAcquire reports that as
              (nil, false, nil).
            name: LockBackendFailed
            private: "core/app/lock: a locker failed for a reason of its own rather than reporting the lock as held; the fields name the operation and the lock"
            public: The lock backend could not serve the operation
            reason: LOCK_BACKEND_FAILED
          - code: CodeLockNameRejected
            doc: |-
              LockNameRejected is returned for a name the locker refuses.

              The empty string is the case that matters, and it is refused because it
              is what an uninitialised variable holds. Accepting it would funnel every
              caller that forgot to set a name through one shared lock — correct-looking,
              silent, and indistinguishable from contention nobody can explain.
            name: LockNameRejected
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/lock: Acquire or TryAcquire received an empty name or one the backend cannot represent; the fields name the offending part"
            public: The lock name is not usable as given
            reason: LOCK_NAME_REJECTED
          - code: CodeLockFenceCorrupt
            doc: |-
              LockFenceCorrupt is returned when the on-disk fence ledger cannot yield
              the next token: it does not read as a decimal counter, or it reads as
              the one counter that has no successor.

              Nothing is repaired and no lease is granted. Restarting the counter
              would hand out numbers the protected resource has already accepted,
              which turns the one mechanism that survives a stalled holder into a
              mechanism that endorses one. A counter allowed to wrap does the same
              thing, silently and in order.
            name: LockFenceCorrupt
            note: |-
              The outcomes the concrete lockers emit — the in-process locker and the file
              locker of internal/service/app/lock. They are declared here, with the
              port's, so that the domain's codes and sentinels are in one place
              (ADR 0160).
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/app/lock: the lock file's contents are not a decimal fencing counter, or are the one counter that cannot be advanced without wrapping; the fields name the path, the offending bytes' length and which of the two conditions it is"
            public: The lock's fencing ledger is not readable
            reason: LOCK_FENCE_CORRUPT
          - code: CodeLockDirectoryUnsafe
            doc: |-
              LockDirectoryUnsafe is returned by NewFileLocker for a directory that is
              world-writable without the sticky bit.

              Such a directory lets any account unlink the lock file and create a new
              one in its place. The next process flocks a different inode from the one
              the current holder is flocking, both are told they hold the lock, and
              neither can observe the other — the exact failure this domain exists to
              prevent, reachable without any race at all.
            name: LockDirectoryUnsafe
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/lock: the directory is world-writable and not sticky, so its lock files can be replaced by any account; the fields name the path and the mode"
            public: The lock directory's permissions do not protect the lock files
            reason: LOCK_DIRECTORY_UNSAFE
          - code: CodeLockKeepaliveLost
            doc: |-
              LockKeepaliveLost is the context CAUSE published by the Keepalive of
              internal/service/app/lock when a renewal fails.

              It is deliberately not a return value. A keepalive exists to inform work
              that has ALREADY STARTED, and the only channel that reaches such work is
              its context — so the loss arrives as a cancellation the protected
              operation is already selecting on, and `context.Cause` says why.
            name: LockKeepaliveLost
            private: "service/app/lock: a background Extend failed, so the derived context was cancelled with this cause; the fields name the lock and the fencing token that was lost"
            public: The lease could not be renewed and is no longer held
            reason: LOCK_KEEPALIVE_LOST
          - code: CodeLockPathRedirected
            doc: |-
              LockPathRedirected is returned by the file locker when the lock path is
              an indirection rather than a file: a symbolic link on Unix, a reparse
              point on Windows.

              The substitution merges two locks into one or splits one into two, with
              no error on any path: the victim's lock lands on the attacker's target,
              the attacker's own lock lands on the real name, and both processes are
              told they hold it. The fencing token goes with it — the ledger the
              victim increments is the attacker's file, so the number handed to the
              protected resource is a number the attacker chose.

              The directory rule does not reach this. [LockDirectoryUnsafe] refuses a
              directory in which an existing entry can be UNLINKED by anyone; this
              attack creates an entry at a name nobody has taken yet, which the sticky
              bit permits and 0777|sticky — what /tmp is — explicitly accepts.
            name: LockPathRedirected
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/lock: a symbolic link or reparse point occupies the lock file's path, so the lock and its fencing ledger would land on a file chosen by whoever planted it; the fields name the path, the kind of indirection and what the kernel reported"
            public: The lock path is a link rather than a file
            reason: LOCK_PATH_REDIRECTED
          - code: CodeLockFileReplaced
            doc: |-
              LockFileReplaced is returned when the file a lease holds is no longer
              the file its name leads to.

              It is the one exposure of the file locker that is DETECTED rather than
              prevented, and the doc comment on internal/service/app/lock's identity.go
              says so at length. In a world-writable sticky directory the account that
              created the lock file owns that entry, so it may unlink it — including
              while another process holds the lock. No flag on the open stops that:
              the descriptor outlives the name by design, on every kernel.

              What ships instead is that the holder finds out. Acquire refuses a lock
              whose file was swapped between the open and the flock, and Extend
              refuses once the swap has happened — so a Keepalive cancels the
              protected work's context with this cause rather than letting it run on
              inside a section it no longer owns.
            name: LockFileReplaced
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/lock: the lock file this lease holds was unlinked or replaced while it was held, so the next acquisition locks a different inode and a fresh fencing ledger; the fields name the path, the lock, the fencing token and which of the two conditions was observed"
            public: The lock file is no longer the file its name leads to
            reason: LOCK_FILE_REPLACED
  - doc: |-
      Package lock — the kernel lock the file locker stands on, and what each
      kernel's version of it means for THIS domain.

      The lock itself is internal/kernel/fs/flock: flock(2) on the Unix kernels,
      LockFileEx over every byte of the file on Windows (ADR 0081), and never a
      blocking call — Acquire polls it on the locker's own clock, so its context
      means something. That package states how the two kernels differ. What
      follows is what each difference costs or buys the file locker, which no
      primitive can say on its behalf.

      # The gate: load-bearing on Unix, kept on Windows for other reasons

      A second lock through the same descriptor is a CONVERSION under flock(2) and
      a REFUSAL under LockFileEx (ADR 0052 §D7 is about the first). So on Windows
      the in-process gate ([nameGate]) is not load-bearing for exclusion — the
      kernel already refuses a second goroutine — and it stays for everything
      else: it keeps one process's goroutines QUEUED on a channel rather than
      polling a range their own process holds; it makes the package behave the
      same on both kernels, so a suite that passes on Linux means something there;
      and it keeps the natural "one handle for the locker's lifetime" refactor
      from turning a silent no-op on Unix into a hard failure on Windows.

      # The fencing ledger is inside the locked range

      The Windows lock is a byte range, and the kernel primitive takes the whole
      file. That is the choice this domain needs: the ledger lives at offset 0 of
      the very file carrying the lock, and a range that skipped it — one byte at
      an offset nothing will ever occupy — would leave the counter writable by
      every non-holder; TestAHighOffsetRangeLeavesTheLedgerUnprotected measures
      what that alternative gives up. Because the lock is MANDATORY there, the
      ledger is strictly better protected than under flock(2), where nothing stops
      a non-holder from rewriting it, and the holder is exempt per HANDLE, so
      [readFence] and [writeFence] work through the descriptor that placed the
      lock (TestTheLedgerSurfaceWorksThroughTheLockingHandle). The price: a
      foreign `type` of a HELD lock file fails with ERROR_LOCK_VIOLATION, so the
      decimal ledger fence.go writes is readable during an incident only while
      nobody holds the lock — which is the incident it is wanted in, since a
      holder that crashed is a holder whose lock the kernel already released.

      # A platform gains the lock and its hardening together, or neither

      The lock path is a file, never a link to one (ADR 0082), and that is
      nofollow_*.go's to enforce. A platform with the kernel lock and without the
      hardened open would build a locker any planted link could redirect, so the
      gate below needs both halves, and TestTheLockAndItsHardeningShareAPlatform
      fails the day the kernel's tag set and nofollow_*.go's stop agreeing.

      Where neither exists — js, wasip1, plan9, aix, solaris, illumos — the
      constructor returns the typed proc.UnsupportedPlatform and the caller picks
      the in-process locker, an external coordinator, or another host (ADR 0018
      §(a)). The gap is listed in this package's CLAUDE.md §Platform matrix
      rather than left to be discovered.

      Package lock — the other half of "the lock path is a file, never a link to
      one": the components ABOVE the lock file.

      # O_NOFOLLOW stops at the last component, and that is a kernel limit

      [openLockFile] refuses an indirection planted at the lock file's own name.
      It cannot refuse one planted at a PARENT component, because O_NOFOLLOW
      governs the final component only — measured, and recorded in ADR 0082
      §Deferred as the half that stayed open. The whole lock directory moves:

      	Dir demandé  = …/pub/myapp/locks
      	composant planté = …/pub/myapp -> …/elsewhere
      	construction ACCEPTÉE
      	acquisition sur parent planté : err=<nil>
      	SUIVI : le verrou a atterri sur …/elsewhere/locks/a4d268….lock

      # A link at a parent is not evidence of anything on its own

      The obvious remedy — refuse a link anywhere in the path — is wrong, and it
      is wrong on a platform this repository tests on. That is measured rather
      than recited: on the macos-arm64 job of e2e-cross every t.TempDir() resolves
      through /var -> /private/var, which Apple ships. /var/run is one to /run on
      most Linux distributions; C:\Users\All Users is a junction to
      C:\ProgramData. A blanket refusal would turn every lock directory under any
      of them into LOCK_PATH_REDIRECTED, which is ADR 0018 §(a)'s failure mode
      wearing an error that blames the deployment for the operating system's own
      layout.

      What separates those from an attack is not the link, it is the directory the
      link LIVES IN. A link in a directory only root can write was put there by
      root. A link in a world-writable directory was put there by anybody at all.
      So the rule is the one ADR 0082 already argued for the final component,
      applied to every component: an indirection is refused when anyone could have
      created it, and the STICKY BIT DOES NOT EXEMPT IT — sticky governs unlinking
      an entry that exists, and planting a component creates one at a name nobody
      has taken.

      That is deliberately a different rule from [checkDir]'s, which accepts
      0777|sticky, and the difference is the same one ADR 0082 turns on:
      checkDir asks who can REPLACE the lock file, this asks who can CREATE a
      component of its path.

      Package lock provides the concrete lockers implementing internal/core/app/lock:
      an in-process locker whose leases really expire, and a file locker whose
      leases really do not. Stdlib-only. ADR 0052.

      Package lock — the lock directory's safety verdict where a directory's mode
      bits say who may replace its entries (ADR 0081).

      Package lock — the lock directory's safety verdict on Windows, where the
      question the POSIX rule asks has no answer and the attack it prevents has no
      mechanism (ADR 0081).

      # Two questions, three masks, one reader

      Both rules here ask the kernel's DACL reader (internal/kernel/fs/winacl, the
      reader this package wrote for ADR 0084 and that the queue now shares from
      there), and they ask it different things — exactly as the POSIX pair differ
      over the sticky bit, and drawn finer, because Windows spells create and
      delete as separate bits rather than one sticky flag (ADR 0086):

        - [checkDir] asks winacl.ReplaceRights of the lock directory — can a
          stranger take away the entry a holder created? — and
          winacl.ContentRights of what the lock FILES created there inherit;
        - [plantable] asks winacl.CreateRights of the directory holding a path
          component — can a stranger put a directory at a name nobody has taken?

      The reader measures and never decides. What this domain decides on an
      inspection that could not run is to ACCEPT, and to log that it did (see
      [checkDir], [noteUninspected]) — where the queue, asking the same reader,
      refuses (ADR 0095).

      Package lock — the on-disk fencing ledger: the one piece of state the file
      locker keeps, and the reason its tokens survive a restart.

      Package lock — the file locker: exclusion between PROCESSES on one machine,
      composed with the in-process gate because flock(2) alone provides none
      between goroutines.

      Package lock — the file locker's configuration and the two ADR 0031 halves
      it contains: one clamp and one refusal, in one struct, for contrast.

      Package lock — the lease handed out by the file locker. It carries no
      deadline, deliberately: see [fileLocker] for why its locks do not expire.

      Package lock — the in-process gate the file locker takes BEFORE flock(2),
      because flock alone excludes nothing between goroutines.

      Package lock — one live acquisition of one name, in the in-process locker.

      Package lock — the lock file's IDENTITY, and the exposure that is detectable
      rather than preventable.

      # What was reproduced

      In a 0777|sticky directory — /tmp's mode, and a row [checkDir] accepts by
      name — the account that created the lock file OWNS that entry, so the sticky
      bit permits them to unlink it. Not when the lock is free: WHILE THE VICTIM
      HOLDS IT.

      	victime détient le verrou : fence=1 inode=69831
      	2e verrou AVANT l'échange : held=false err=<nil> (attendu false)
      	entrée désliée pendant que la victime la détient
      	2e verrou APRÈS l'échange : held=true err=<nil> inode=69832
      	SPLIT : deux détenteurs, fences 1 et 1, inodes 69831 et 69832
      	Extend de la victime : <nil>

      Two holders, two inodes, and the fence RESET rather than advanced — both
      report 1. The last line is the one that matters: the victim asked whether it
      still held the lock and was told yes.

      # It is detectable, NOT preventable, and the difference is the point

      No flag on the open prevents this. The entry is unlinked after the open, by
      an account the directory's permissions genuinely allow to unlink it, and the
      victim's descriptor keeps working because a descriptor outlives its name.
      Three remedies were considered and two of them prevent nothing:

        - An OWNER check on the lock file was rejected in ADR 0082 §Deferred and
          is still rejected, for the reason given there: it breaks the shared-group
          arrangement [checkDir] deliberately accepts, where the entry belongs to
          the OTHER account by design.
        - O_EXCL on creation plus a recorded identity prevents nothing either, and
          that was checked rather than assumed. O_EXCL says whether THIS process
          created the file. It says nothing about who unlinks it afterwards, which
          is the entire attack — the unlink happens minutes later, on a descriptor
          that has already been opened and locked.
        - Comparing the descriptor's identity against the path DETECTS it, which
          is what ships. The victim finds out at its next [fileLease.Extend], and
          a Keepalive turns that into a cancelled context for the work inside the
          section.

      So the guarantee is stated as exactly what it is: the lock is not kept, the
      split is not prevented, and the holder is TOLD. A holder that learns it no
      longer holds the lock can stop; a holder that is told it still does cannot.
      The only prevention is a lock directory no other account can write, which is
      what NewFileLocker creates (0700) when the directory is absent.

      # Where the check runs, and why not everywhere

      At acquisition, between the flock and the fence, because the window between
      the open and the flock is real and closing it is two syscalls. And at
      Extend, because that is the only call a holder makes DURING the section.

      Not at Release: releasing is closing a descriptor this lease owns, it
      succeeds whatever the name now points at, and a Release that returned an
      error would break `defer lease.Release(ctx)` at the one moment a caller is
      unwinding.

      Package lock — the background renewal, and the only channel through which a
      lost lease can reach work that has already started.

      Package lock — hosts the compile-time interface assertions, keeping them out
      of the production source so the runtime binary carries no diagnostic-only
      declarations.

      Package lock — the in-process locker: real leases, real expiry, real
      takeover, and therefore the backend where fencing actually matters.

      Package lock — the lease handed out by the in-process locker. It is the
      only backend whose leases satisfy corelock.Deadliner, because it is the only
      one whose leases can be taken from a live holder.

      Package lock — the lock path must name a FILE, never an indirection to one.

      # What this closes

      [fileLocker.pathFor] derives the lock file's name from the SHA-256 of the
      lock name, so an attacker cannot choose it — but it is derived, which means
      it is PREDICTABLE, and predictable is all the attacker needs. Create the
      directory first, compute the digest of a lock name the victim will use, and
      plant a symbolic link there. The victim's open follows it, the flock and the
      fencing ledger land on a file of the attacker's choosing, and every layer
      above reports success.

      Two locks then become one, or one becomes two, with no error anywhere:

        - The victim's lock lands on the attacker's target while the attacker's own
          lock lands on the real path. Both processes are inside the section, both
          hold a lease, neither is blocked, and nothing logs.
        - The redirected ledger is the attacker's file, so the fencing token the
          victim hands to the protected resource is a number the attacker CHOSE.
          Measured: a symlink to a file containing "48213\n" — a pidfile is exactly
          that shape — made Acquire return fence 48214 and rewrite the pidfile with
          it.

      [checkDir] exists to prevent precisely this substitution, and it does not
      reach it: its rule is about UNLINKING an entry that already exists, while
      this attack creates one at a name nobody has taken yet. The sticky bit is no
      help for the same reason — it stops you removing someone else's entry, and
      the attacker owns the symlink they created. `0777|sticky` is a mode the rule
      explicitly ACCEPTS, and it is what /tmp is.

      # It is one gap with two spellings, so it closes on both kernels

      The refusal is the same sentinel everywhere, [corelock.LockPathRedirected], but the
      mechanism is not, because the two kernels refuse in opposite places:

        - Unix asks the kernel not to traverse, and the OPEN fails —
          see nofollow_unix.go.
        - Windows asks the kernel to open the LINK ITSELF, the open SUCCEEDS, and
          the handle is then rejected — see nofollow_windows.go.

      Closing it on one platform only was the previous answer and it was the wrong
      one: the same deployment would succeed on Linux and fail on Windows for a
      reason the error could not explain (ADR 0081 §Deferred, now closed).

      Package lock — the plain open on the platforms that have no file lock at all
      (ADR 0018 §(a)).

      js, wasip1, plan9, aix, solaris and illumos reach this file. [NewFileLocker]
      refuses them at CONSTRUCTION through platformNative, so nothing here is
      reachable; it exists because the package must COMPILE on every GOOS, which
      is ADR 0018's build bar, and because the build-tag set is the one the
      kernel's file lock uses for its own refusal (internal/kernel/fs/flock's
      flock_other.go) rather than a fourth shape invented here.

      Solaris does have O_NOFOLLOW and is nevertheless served by this file. That
      is deliberate: giving it the Unix open would mean the kernel lock's tag sets
      and nofollow_*.go's disagree, which is how a platform ends up with one half
      of a pair. A platform gains both or neither, and it gains them by acquiring
      a working file lock first — TestTheLockAndItsHardeningShareAPlatform fails
      the day the two sets part.

      Package lock — the Unix half of "do not follow an indirection at the lock
      path": O_NOFOLLOW, and a refusal that does not depend on which errno the
      kernel chose to spell it with.

      Package lock — the Windows half of "do not follow an indirection at the lock
      path".

      # CreateFileW followed reparse points, and that was read rather than assumed

      os.OpenFile reaches CreateFileW through syscall.Open, and syscall.Open sets
      FILE_FLAG_OPEN_REPARSE_POINT for exactly ONE createmode: CREATE_NEW, which
      is O_CREAT|O_EXCL. This locker opens O_CREATE|O_RDWR, which is OPEN_ALWAYS,
      which does not get the flag — so before this change the open followed a
      symbolic link or a junction planted at the lock path, the same defect the
      Unix side was measured to have. Read in the toolchain this repository pins
      (go1.27.0, src/syscall/syscall_windows.go), not inferred from behaviour.

      # The flag OPENS the link, it does not refuse it — so the check is the pair

      FILE_FLAG_OPEN_REPARSE_POINT means "give me a handle to the reparse point
      itself" rather than "fail if there is one". Used alone it fixes the
      redirection — the flock and the ledger stop landing on the attacker's file —
      and leaves the lock sitting on a link the attacker still owns and can
      retarget. So the flag is paired with GetFileInformationByHandle: any handle
      whose attributes carry FILE_ATTRIBUTE_REPARSE_POINT is closed and refused.
      The flag is what makes the check possible (without it the handle is the
      TARGET, which has no reparse attribute and nothing to notice); the check is
      what turns a redirect into a refusal.

      # No new dependency, and no hand-rolled CreateFile

      golang.org/x/sys is banned SDK-wide, and ADR 0081 bound LockFileEx from
      kernel32 with syscall.NewLazyDLL rather than importing it. Nothing of the
      kind is needed here: go1.27's syscall.Open passes the high 12 bits of its
      flag word through to CreateFileW's dwFlagsAndAttributes, and
      FILE_FLAG_OPEN_REPARSE_POINT is in its validFileFlagsMask — so the flag
      rides the ordinary os.OpenFile call.

      That matters beyond tidiness. ADR 0081 §D5 accepts every directory on
      Windows on the strength of one sentence: "os.OpenFile reaches CreateFileW
      WITHOUT FILE_SHARE_DELETE, so a held lock file can be neither deleted nor
      renamed whatever the ACL says". A hand-rolled CreateFile would have had to
      restate that share mode — and a hand-rolled share mode that drifts is how
      the Windows directory rule silently stops being justified. The open stays
      os.OpenFile, so the sentence stays literally true.
    functions:
      - doc: |-
          NewFileLocker returns a [corelock.Locker] whose locks exclude every process
          using the same directory on the same machine.

          It refuses, at construction rather than at first use: a configuration it
          cannot honour ([corelock.LockMisconfigured]), a platform without flock(2)
          ([coreproc.UnsupportedPlatform]), and a directory whose lock files any
          account could replace ([corelock.LockDirectoryUnsafe]).
        in:
          - name: cfg
            type: FileConfig
        name: NewFileLocker
        out:
          - name: locker
            type: corelock.Locker
          - name: err
            type: error
      - doc: |-
          Keepalive renews lease in the background and returns a context that is
          CANCELLED the instant the lease stops being held.

          # Why the loss arrives as a cancellation

          [corelock.Lease.Extend] returning an error is only useful to a caller that
          is currently calling it. The caller that needs the news is the one already
          running inside the critical section — and the only channel that reaches
          work in progress is its context. So a failed renewal cancels the derived
          context with [corelock.LockKeepaliveLost] as its cause, and the protected operation
          finds out through the mechanism it is already selecting on.

          This is the opposite of the drain signal in ADR 0043, and deliberately so.
          A drain is an invitation to finish, so cancelling would be wrong. Losing a
          lock is not an invitation: continuing means writing into a section another
          holder believes it owns, and the correct response is to stop.

          	ctx, stop, err := lock.Keepalive(ctx, lease, lock.KeepaliveConfig{Every: ttl / 3})
          	if err != nil { return err }
          	defer stop()
          	// ctx is now cancelled if the lease is lost; context.Cause(ctx) says so.

          The returned stop function releases the renewal goroutine and cancels the
          derived context. It does NOT release the lease — that stays the caller's
          job, because a helper that released on the way out would make the lifetime
          of the lock depend on the lifetime of a convenience.

          Goroutine lifecycle: exactly one goroutine is started, and it ends when the
          derived context ends — which happens on stop(), on the parent context
          ending, or on the first failed renewal. There is no path on which it
          outlives the returned stop function, so a caller that defers stop() leaks
          nothing.
        in:
          - name: ctx
            type: context.Context
          - name: lease
            type: corelock.Lease
          - name: cfg
            type: KeepaliveConfig
        name: Keepalive
        out:
          - name: guarded
            type: context.Context
          - name: stop
            type: context.CancelFunc
          - name: err
            type: error
      - doc: |-
          NewMemory returns a [corelock.Locker] whose leases live in this process.

          It refuses a non-positive cfg.TTL at CONSTRUCTION rather than picking a
          default. Both readings of a zero TTL are defensible and they are opposites:
          "already expired" makes every Acquire succeed while excluding nobody, and
          "never expires" turns a leaked goroutine into a permanent deadlock. An SDK
          that guessed would be silently wrong for half its callers, so it does not
          guess (ADR 0031).
        in:
          - name: cfg
            type: MemoryConfig
        name: NewMemory
        out:
          - name: locker
            type: corelock.Locker
          - name: err
            type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelock: github.com/kitsunium/sdk/internal/core/app/lock
    path: github.com/kitsunium/sdk/internal/service/app/lock
    types:
      - decl: true
        doc: |-
          MemoryConfig parameterises [NewMemory].

          Its zero value is deliberately NOT a working locker: TTL must be stated.
          See [NewMemory] for why refusing, rather than defaulting, is the only
          defensible ADR 0031 half for a lease lifetime.
        name: MemoryConfig
        struct:
          fields:
            - doc: |-
                TTL is how long a lease is held before it can be taken by another
                caller. It MUST be positive; zero and negative are refused at
                construction, never reinterpreted.
              name: TTL
              type: time.Duration
            - doc: |-
                Clock is the time source, injectable so expiry and waiting are testable
                without sleeping. nil means clock.System.

                The whole port is needed, not just the reading half: this locker WAITS
                for a holder's deadline rather than polling for it, so it needs
                clock.Waiter as well as clock.Clock — which is what clock.Timed is
                (ADR 0039).
              name: Clock
              type: clock.Timed
      - decl: true
        doc: |-
          FileConfig parameterises [NewFileLocker].

          Its zero value is deliberately NOT a working locker: Dir must be stated,
          because the directory IS the lock's scope. Poll, by contrast, has a
          defensible default and is clamped — the two ADR 0031 halves, side by side.
        name: FileConfig
        struct:
          fields:
            - doc: |-
                Dir holds one lock file per name. It is created 0700 if absent, and
                CHECKED if it already exists: a world-writable directory without the
                sticky bit is refused, because anyone able to unlink a lock file can
                replace its inode and split one lock into two.

                It MUST be set. There is no default: a temporary directory would make
                the lock's SCOPE — which processes it excludes — depend on a value
                nobody chose.
              name: Dir
              type: string
            - doc: |-
                Poll is the interval between attempts while another process holds the
                lock. Zero means [defaultPoll]; negative is refused.
              name: Poll
              type: time.Duration
            - doc: |-
                Clock is the time source the poll waits on, injectable so contention is
                testable without sleeping. nil means clock.System.
              name: Clock
              type: clock.Timed
      - decl: true
        doc: |-
          KeepaliveConfig parameterises [Keepalive].

          Its zero value is deliberately NOT a working keepalive: Every must be
          stated, because a renewal cadence the SDK invented would be right only by
          accident against a lease lifetime it cannot see.
        name: KeepaliveConfig
        struct:
          fields:
            - doc: |-
                Every is the renewal period. It MUST be positive, and it MUST be
                comfortably shorter than the lease TTL — a renewal that lands at the
                deadline has already lost every race it could lose. A third of the TTL
                leaves room for two consecutive failures.

                It is refused at zero rather than derived from the lease, because a
                Lease deliberately does not expose its TTL: the port's job is to say
                whether it can expire at all ([corelock.Deadliner]), not to let a helper
                reconstruct a schedule the caller never chose.
              name: Every
              type: time.Duration
            - doc: |-
                Clock is the time source the renewal ticks on. nil means clock.System.

                A caller testing expiry MUST pass the SAME clock the locker was built
                with, or the renewals and the deadline will run on two different
                timelines.
              name: Clock
              type: clock.Timed
  - doc: |-
      Package lock is the public facade for the SDK's mutual exclusion: named,
      exclusive, fenced leases over one process or over one machine.

      	locker, err := lock.NewMemory(lock.MemoryConfig{TTL: 30 * time.Second})
      	if err != nil { return err }

      	lease, err := locker.Acquire(ctx, "rebuild:index")
      	if err != nil { return err }
      	defer lease.Release(ctx)

      # Read this before relying on a lease

      A lock that reports success it cannot back is worse than no lock at all: a
      caller who believes they hold a critical section behaves differently from
      one who knows they do not, and a lie removes the second behaviour without
      putting anything in its place. Three consequences shape this whole package.

      FIRST — a zero TTL is REFUSED at construction. It is not read as "expires
      immediately" and not as "never expires". Both are defensible, they are
      opposites, and a locker built on the first grants every Acquire while
      excluding nobody — indistinguishable, from outside, from a lock nobody
      contends (ADR 0031).

      SECOND — expiring a lease does not stop its old holder. If A's goroutine
      stalls for longer than the TTL and B acquires the lock, A resumes with no
      idea anything happened. So [Lease].Release releases only a lock this holder
      STILL holds — a lease that was taken over releases nothing and reports
      [LockNotHeld] — and [Lease].Extend renews a lease for work that outlives its
      TTL. A failed Extend is not a warning to log past: it is the SDK telling a
      caller it is already inside someone else's section.

      THIRD — every acquisition carries a FENCING TOKEN. [Lease].Fence returns a
      uint64 that strictly increases with every acquisition of that name. Pass it
      to the protected resource and have the resource refuse the lower one, and
      the scenario above turns from silent corruption into a rejected write.

      # What this package does not guarantee

      Issuing a fencing token is not enforcing one. The SDK can hand you the
      number; only the RESOURCE can compare it, and many cannot — a plain file, an
      HTTP endpoint, a table with no version column. Where the fence is not
      checked, mutual exclusion is NOT guaranteed against a stalled holder: a long
      GC pause, a SIGSTOP or a descheduled thread can put two holders inside one
      section, and neither will notice.

      If the protected resource cannot check a fence, do not rely on a TTL for
      correctness. Use [NewFileLocker], whose leases never expire, and accept that
      a hung holder blocks its waiters — a liveness failure you can see, instead
      of a safety failure you cannot.

      # Two backends, and the difference is not performance

        - [NewMemory] excludes the GOROUTINES of one process. Its leases expire,
          because nothing notices a goroutine that stopped, so without a TTL one
          leak deadlocks a name for the life of the process. Its leases implement
          [Deadliner].

        - [NewFileLocker] excludes the PROCESSES sharing one directory on one
          machine, through flock(2) on Unix and LockFileEx on Windows. Its leases
          do NOT expire: a lock is held until it is released or until the holder's
          process dies, at which point the kernel releases it. Nothing can take it
          from a live holder, so its leases do NOT implement [Deadliner] — and
          that absence is how you find out, from the API rather than from this
          paragraph.

      Which world you are in is one type assertion away:

      	if d, ok := lease.(lock.Deadliner); ok {
      	    // this lease CAN be taken from you; renew it or carry the fence
      	}

      The file locker takes an in-process gate before its kernel lock, because
      flock(2) is per open file description: re-locking a description that already
      holds it is a no-op, so a shared descriptor gives ZERO exclusion between
      goroutines while working perfectly between processes. That was measured, not
      assumed — see internal/service/app/lock's CLAUDE.md.

      # What differs on Windows, and what does not

      The contract does not differ: same Locker, same Lease, same sentinels, and a
      file lease still does not implement [Deadliner]. The primitive underneath
      does. LockFileEx locks a byte RANGE rather than a file — this backend takes
      the whole file, because the fencing counter lives in it — and its locks are
      MANDATORY rather than advisory, so one thing a caller can observe changes:
      while a lock is HELD, a process that does not hold it cannot read the lock
      file. On Unix it can. Every other difference is absorbed below the port and
      measured on a real Windows kernel; ADR 0081 lists them.

      One more is worth knowing before you rely on a directory's permissions. The
      lock directory is checked for being one any account can REPLACE an entry in,
      and the two platforms answer that in their own vocabulary: a
      world-writable-and-not-sticky mode on Unix, and on Windows a discretionary
      entry letting Everyone, Authenticated Users or BUILTIN\Users unlink somebody
      else's entry — or write the lock files created there, which is a question
      Unix never has to ask, because a lock file there is created 0600 whatever
      the directory's mode says (ADR 0084, ADR 0086).

      Windows does have the sticky directory's shape; it spells it in two bits
      rather than one, as "may add an entry" without "may delete a child".
      %ProgramData% is one, which is why a lock directory under it is accepted and
      a junction planted beside it is not.

      # A lock path is a file, never a link to one

      [NewFileLocker] names its lock files hex(sha256(lockName)) + ".lock" inside
      the directory you gave it. That keeps every caller-supplied string off the
      filesystem and, in the same stroke, makes the name PREDICTABLE — and an indirection planted at a predictable name is
      enough to move your lock somewhere you did not choose.

      So a symbolic link (Unix) or a reparse point (Windows) at the lock path is
      REFUSED with [LockPathRedirected]. It is not followed, and it is not read as
      a backend failure, because nothing failed: the substitution worked, and a
      retry is the one response that would make it worse.

      This is a REFUSAL WHERE THERE USED TO BE SUCCESS. If your deployment
      deliberately symlinks a lock file — onto a tmpfs, say — it now fails at
      Acquire. There is no flag to restore the old behaviour: it would be a flag
      to restore a lock that lands somewhere the locker did not report (ADR 0082).

      The PARENT components are governed too, and by a different rule, because a
      symbolic link at a parent is not evidence of anything on its own: /tmp is
      one on macOS and /var/run is one on most Linux distributions. An
      indirection above the lock file is refused only when the directory holding
      it is world-writable — when anybody could have planted it. On Windows the
      same rule runs over the same question, answered by the directory's DACL
      rather than by a synthesised mode (ADR 0083, ADR 0084) — and it asks for a
      different right from the lock directory's own rule, because a component is
      a DIRECTORY, so what plants one is "may add a subdirectory" (ADR 0086).

      # A held lock can lose its file, and you are told

      [LockFileReplaced] is the one exposure this package DETECTS rather than
      prevents. See its own documentation; the short version is that Extend is
      where you find out, and finding out is the whole of what is offered.

      # Scope

      One process, or one machine. There is deliberately no distributed backend
      here: a lock over Redis, etcd, ZooKeeper or Consul is a connector to a
      third-party system and belongs under third-party/. Nothing in this package
      implies coordination beyond the filesystem it was given.
    facade:
      - alias:
          - doc: |-
              Locker hands out named, exclusive leases: Acquire and TryAcquire.

              The method set is FROZEN at two. New capabilities arrive as SIBLING
              interfaces you reach by type assertion, because this alias publishes the
              interface, Go interfaces are structural, and a third method would break
              every downstream implementer at compile time with no deprecation window
              (ADR 0039).
            name: Locker
            target: corelock.Locker
      - alias:
          - doc: |-
              Lease is a held lock: Fence, Extend, Release. FROZEN at three, for the same
              reason [Locker] is frozen at two.
            name: Lease
            target: corelock.Lease
      - alias:
          - doc: |-
              Deadliner is the sibling implemented by a [Lease] that CAN expire — i.e. one
              that can be taken from you while you are still running.

              Its presence is the only question that changes how a caller must be written.
              A memory lease implements it; a file lease does not, because a file lock has
              no deadline at all. It is deliberately not a Deadline method on [Lease]
              returning a zero time for "never": a zero time.Time is a value someone will
              compare against time.Now and lose to, and an absent interface is not.
            name: Deadliner
            target: corelock.Deadliner
      - alias:
          - doc: MemoryConfig parameterises [NewMemory]. TTL must be positive.
            name: MemoryConfig
            target: svclock.MemoryConfig
      - alias:
          - doc: FileConfig parameterises [NewFileLocker]. Dir must be set; Poll defaults.
            name: FileConfig
            target: svclock.FileConfig
      - alias:
          - doc: |-
              KeepaliveConfig parameterises [Keepalive]. Every must be positive and should
              be comfortably shorter than the lease TTL — a third of it leaves room for
              two consecutive failed renewals.
            name: KeepaliveConfig
            target: svclock.KeepaliveConfig
      - doc: The sentinels a caller matches with errors.Is or errs.HasCode.
        var:
          - doc: |-
              LockMisconfigured is returned by a constructor whose configuration
              cannot be honoured — most importantly a TTL that is not positive.
            name: LockMisconfigured
            reexport: corelock.LockMisconfigured
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockNotHeld is returned by Extend or Release when this caller's lease
              has been taken over. From Extend it means you are inside a section
              someone else owns; stop the protected work.
            name: LockNotHeld
            reexport: corelock.LockNotHeld
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockBackendFailed is returned when the locker could not serve the
              operation at all. A lock merely being HELD is not this — TryAcquire
              reports that as (nil, false, nil).
            name: LockBackendFailed
            reexport: corelock.LockBackendFailed
            type: "*errs.Error"
          - blank: true
            doc: LockNameRejected is returned for an empty or unusable lock name.
            name: LockNameRejected
            reexport: corelock.LockNameRejected
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockFenceCorrupt is returned by the file locker when no further token
              can be issued from the on-disk fencing ledger — it is not a decimal
              counter, or it is the one counter with no successor. Nothing is
              repaired: a restarted counter, or a wrapped one, reissues numbers the
              protected resource has already accepted.
            name: LockFenceCorrupt
            reexport: corelock.LockFenceCorrupt
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockDirectoryUnsafe is returned by [NewFileLocker] for a world-writable,
              non-sticky directory, whose lock files any account could replace with a
              fresh inode — splitting one lock into two.
            name: LockDirectoryUnsafe
            reexport: corelock.LockDirectoryUnsafe
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockKeepaliveLost is the context CAUSE published by [Keepalive] when a
              renewal fails.
            name: LockKeepaliveLost
            reexport: corelock.LockKeepaliveLost
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockPathRedirected is returned by [NewFileLocker] when the lock path is
              an indirection rather than a file — a symbolic link on Unix, a reparse
              point on Windows. The lock and its fencing ledger would land on a file
              chosen by whoever planted it, so two processes would hold "the same"
              lock over different inodes with nothing reported on either side.
            name: LockPathRedirected
            reexport: corelock.LockPathRedirected
            type: "*errs.Error"
          - blank: true
            doc: |-
              LockFileReplaced is returned by Acquire, and by a held lease's Extend,
              when the lock file is no longer the file its name leads to: the entry
              was unlinked, or replaced, while it was held.

              It is the one exposure here that is DETECTED rather than prevented. In
              a world-writable sticky directory — /tmp's mode, which the directory
              rule accepts by name — the account that created the lock file owns that
              entry and may unlink it, including while you hold the lock. Your
              descriptor keeps working, because a descriptor outlives its name, and
              the next process creates a different file and locks that instead.

              When Extend returns it, you are inside a section you no longer own.
              Stop the protected work; re-acquiring would give you a second lease
              over the new file while the old one is still locked. The prevention is
              a lock directory no other account can write, which is what
              [NewFileLocker] creates when the directory is absent.
            name: LockFileReplaced
            reexport: corelock.LockFileReplaced
            type: "*errs.Error"
      - func:
          doc: |-
            NewMemory returns a [Locker] whose leases live in this process and DO
            expire.

            cfg.TTL must be positive; a zero or negative TTL is refused here rather than
            defaulted, because the two natural readings of zero are opposites and either
            choice would be silently wrong for half of its callers (ADR 0031).
          forward: svclock.NewMemory
          in:
            - name: cfg
              type: MemoryConfig
          name: NewMemory
          out:
            - name: locker
              type: Locker
            - name: err
              type: error
      - func:
          doc: |-
            NewFileLocker returns a [Locker] that excludes every process using the same
            directory on the same machine, and whose leases do NOT expire.

            It refuses at construction: a missing directory setting, a negative poll
            interval, a lock directory any account could put an entry into, and a
            platform with no file-range lock at all, where it returns the SDK-wide
            UnsupportedPlatform rather than a locker that would report success and
            exclude nothing (ADR 0018). Windows is no longer in that last set: it is
            served by LockFileEx (ADR 0081).

            The third refusal is one rule with two vocabularies, because the two
            platforms answer "who can replace an entry here" differently. On Unix it is
            a mode: world-writable without the sticky bit. On Windows it is the
            directory's DACL: an entry letting Everyone (S-1-1-0), Authenticated Users
            (S-1-5-11) or BUILTIN\Users (S-1-5-32-545) unlink somebody else's entry, or
            write the lock files the directory will create (ADR 0084, ADR 0086).

            Creating an entry at a free name is NOT that right, on either platform: it
            is what the sticky bit permits, and what Windows spells as "may add a file"
            without "may delete a child". What it costs is a lock file planted before
            any holder exists, which is a denial of service rather than a lost
            exclusion.
          forward: svclock.NewFileLocker
          in:
            - name: cfg
              type: FileConfig
          name: NewFileLocker
          out:
            - name: locker
              type: Locker
            - name: err
              type: error
      - func:
          doc: |-
            Keepalive renews lease in the background and returns a context that is
            CANCELLED the instant the lease stops being held, plus the function that
            ends the renewal.

            The loss arrives as a cancellation because [Lease].Extend returning an error
            only helps a caller currently calling it — and the caller that needs the
            news is the one already inside the critical section. context.Cause names it.

            	guarded, stop, err := lock.Keepalive(ctx, lease, lock.KeepaliveConfig{Every: ttl / 3})
            	if err != nil { return err }
            	defer stop()
            	// hand `guarded` to the protected work; it ends if the lease is lost

            stop does NOT release the lease: the lifetime of a lock must not depend on
            the lifetime of a convenience.
          forward: svclock.Keepalive
          in:
            - name: ctx
              type: context.Context
            - name: lease
              type: Lease
            - name: cfg
              type: KeepaliveConfig
          name: Keepalive
          out:
            - name: guarded
              type: context.Context
            - name: stop
              type: context.CancelFunc
            - name: err
              type: error
    imports:
      corelock: github.com/kitsunium/sdk/internal/core/app/lock
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svclock: github.com/kitsunium/sdk/internal/service/app/lock
    path: github.com/kitsunium/sdk/pkg/v1/app/lock
