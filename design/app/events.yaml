apiVersion: kit.kitsunium/design/v2
domain: app/events
packages:
  - aliases:
      - doc: |-
          EventType identifies the events a subscription reacts to by their concrete
          Go TYPE. It is an alias for reflect.Type, so a caller never converts.

          The key is the type and not a name because a name is unchecked: two
          packages can both pick "user.created", a rename silently unhooks every
          listener, and nothing fails until production is quiet. A Go type is minted
          by the compiler, cannot collide across packages, and is renamed by the same
          tool that renames its uses. The price is that an event crossing a process
          boundary has no identity here — which is the frontier in the package
          documentation, not a limitation to work around.

          A subscription's EventType MUST be a CONCRETE type. [Bus.Publish] resolves
          an event's type with reflect.TypeOf, which returns the value's DYNAMIC type
          and never an interface type, so a listener registered on an interface could
          never fire. That registration is refused rather than accepted and silently
          starved — see [InvalidEventType].
        name: EventType
        target: reflect.Type
    codes:
      - const:
          - doc: |-
              CodeInvalidSubscription identifies a Subscribe refused because the
              subscription could never run: an empty name or a nil Listener.
            name: CodeInvalidSubscription
            note: "range: 0.2.22.0 - 0.2.22.255"
            value: "0x00_02_16_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateListener identifies a Subscribe refused because a listener is
              already registered under that name for that event type.
            name: CodeDuplicateListener
            value: "0x00_02_16_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownListener identifies an Unsubscribe naming a listener that is not
              registered for that event type.
            name: CodeUnknownListener
            value: "0x00_02_16_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidEventType identifies an event type a dispatch could never match:
              a nil or interface type at Subscribe, or a nil event at Publish.
            name: CodeInvalidEventType
            value: "0x00_02_16_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeListenerPanicked identifies a listener whose call panicked; the bus
              recovered it, turned it into this listener's failure, and carried on with
              the remaining listeners.
            name: CodeListenerPanicked
            value: "0x00_02_16_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeHalt identifies the control sentinel a listener returns to stop the
              dispatch. It is the one code in this range that never reaches a caller: the
              bus consumes it and reports the halt through DispatchValue instead.
            name: CodeHalt
            value: "0x00_02_16_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeListenerFailed identifies the bus's own verdict on a listener that
              returned an error. It travels ALONGSIDE that error, never around it.
            name: CodeListenerFailed
            note: |-
              range: 0.3.52.0 - 0.3.52.255

              The bus's verdicts on a dispatch. The range was allocated to
              internal/service/app/events, which raises these codes while it publishes,
              and it is declared here with the registration refusals so that every code
              of the domain is in one place (ADR 0160). A code keeps the value its
              allocation gave it whichever layer declares it, so the layer byte still
              reads 3.
            value: "0x00_03_34_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeHaltNotPermitted identifies a listener that returned the Halt control
              sentinel without having declared MayHalt at registration. The dispatch was
              NOT stopped and the refusal was collected.
            name: CodeHaltNotPermitted
            value: "0x00_03_34_02"
        type: errs.Code
    constants:
      - doc: |-
          PriorityNormal is the zero [Priority] and the value a caller with no
          opinion about ordering should leave in place. Negative priorities run
          before it, positive ones after.
        name: PriorityNormal
        type: Priority
        value: "0"
    doc: |-
      Package events — ranges 0.2.22.* (ADR 0053 core/app/events block) and
      0.3.52.* (ADR 0053 service/app/events block, declared here since ADR 0160).

      Package events — declares the sentinel *errs.Error outcomes of the domain:
      the registration refusals, the control sentinel, and the bus's verdicts on
      a dispatch. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.

      Package events declares the SDK's IN-PROCESS event bus port: the [Listener]
      that reacts to one event, the [SubscriptionValue] that registers it at a
      priority, and the [Bus] that dispatches a published event to all of them.
      A core sibling admitted by ADR 0053.

      # events is not a queue

      This is the frontier the whole domain rests on, and it is stated first
      because getting it wrong produces a bus that guarantees neither half:

        - events is IN-PROCESS, SYNCHRONOUS and SAME-GOROUTINE. Publish returns
          when every listener has returned. There is no durability, no retry, no
          dead-letter queue and no delivery beyond this process. If the process
          dies mid-dispatch, the event never happened as far as anything outside
          memory is concerned.
        - A queue is INTER-PROCESS, ASYNCHRONOUS and DURABLE, with retries and a
          dead-letter path.

      A caller who wants "asynchronous but reliable" is asking for a queue, and
      must be sent to one rather than served half of it here. Handing them a
      goroutine per listener would give them asynchrony without durability, which
      is the worst of both: work that can be lost and no record that it was.

      # What the bus is for

      One fact, several independent consequences, all inside the caller's
      transaction. "The order was placed" is one fact; writing the audit row,
      invalidating the cache and stamping the metric are three consequences that
      have nothing to say to each other. Without a bus the publisher imports all
      three; with one it imports none.

      # The port

      [Listener] is a FUNCTION type rather than an interface — the shape
      internal/core/CLAUDE.md already admits for resilience.Operation,
      scheduler.Job and lifecycle.Start. ADR 0039's rule is that a published port
      must not grow a method, because pkg/v1 aliases publish the shape and Go
      interfaces are structural; a func type satisfies that rule structurally,
      since it cannot grow a method at all.

      The engine, the priority ordering, the panic guard and the TYPED
      registration front end live in internal/service/app/events; this package owns
      the contract, the three domain values, and the typed sentinels a
      registration refuses with.

      Package events — hosts DispatchValue, the report of one Publish.

      Package events — hosts SubscriptionValue and the Priority that orders it.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/events
    ports:
      - doc: |-
          Bus dispatches a published event to the listeners registered for its type,
          in priority order, on the publisher's goroutine. Implementations MUST be
          safe for concurrent use.

          IFACE-PLUGIN: the concrete engine stays unexported behind its constructor
          in internal/service/app/events.

          The interface is FROZEN at these three methods. pkg/v1/app/events aliases it,
          so adding a fourth would break every downstream implementer at compile time
          with no deprecation window (ADR 0039); a new capability gets a sibling
          interface reached by type assertion.
        methods:
          - doc: |-
              Subscribe registers sub against eventType. It is refused on a
              subscription that could never run — empty name, nil Listener
              ([InvalidSubscription]) — on a name already registered for that type
              ([DuplicateListener]), and on a nil or interface eventType, which
              Publish could never match ([InvalidEventType]).
            in:
              - name: eventType
                type: EventType
              - name: sub
                type: SubscriptionValue
            name: Subscribe
            out:
              - type: error
          - doc: |-
              Unsubscribe removes the listener registered under name for eventType.
              A name that is not registered is [UnknownListener] rather than a silent
              success: "I removed it" and "there was nothing to remove" are different
              answers, and only one of them means the caller's mental model is right.
            in:
              - name: eventType
                type: EventType
              - name: name
                type: string
            name: Unsubscribe
            out:
              - type: error
          - doc: |-
              Publish calls every listener registered for the event's dynamic type,
              in ascending [Priority] and then registration order, and returns what
              happened.

              A bus with no listener for this type is LEGITIMATE (ADR 0031):
              publishing is a no-op that returns a zero [DispatchValue] and a nil
              error. A publisher must not have to know whether anybody is listening —
              that is the entire point of publishing.

              The error aggregates what the listeners returned, with errors.Join. A
              [Halt] is NOT part of it: stopping the dispatch is a decision, not a
              failure, and it is reported through [DispatchValue.Halted].
            in:
              - name: ctx
                type: context.Context
              - name: event
                type: any
            name: Publish
            out:
              - type: DispatchValue
              - type: error
        name: Bus
    sentinels:
      - var:
          - code: CodeInvalidSubscription
            doc: |-
              InvalidSubscription is returned by Subscribe for a subscription that
              could never run. The "missing" field names which half is absent.
            name: InvalidSubscription
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/events: subscription has an empty name or a nil Listener; the field names which"
            public: The event subscription is not runnable and was refused
            reason: INVALID_SUBSCRIPTION
          - code: CodeDuplicateListener
            doc: |-
              DuplicateListener is returned by Subscribe when the name is already
              taken for that event type. Names are how an error and an Unsubscribe
              identify a listener, so two listeners sharing one would make every
              report ambiguous and every removal a coin toss.
            name: DuplicateListener
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/events: listener names are unique per event type; the fields carry the name and the type"
            public: A listener is already registered under that name for this event
            reason: DUPLICATE_LISTENER
          - code: CodeUnknownListener
            doc: |-
              UnknownListener is returned by Unsubscribe for a name that is not
              registered. Reporting it beats returning nil: "removed" and "there was
              nothing to remove" are different answers, and a caller who gets the
              second while expecting the first has a bug that silence would hide
              until the listener they meant to remove fired again.
            name: UnknownListener
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/events: Unsubscribe named a listener this bus does not hold; the fields carry the name and the type"
            public: No listener is registered under that name for this event
            reason: UNKNOWN_LISTENER
          - code: CodeInvalidEventType
            doc: |-
              InvalidEventType is returned by Subscribe for a nil or interface event
              type, and by Publish for a nil event.

              The interface case is the one worth refusing loudly. Publish resolves
              an event's type with reflect.TypeOf, which yields the value's DYNAMIC
              type and never an interface type, so a subscription keyed on an
              interface would be registered, reported by every introspection, and
              never called once. That is the exact shape ADR 0031 removes from this
              SDK: a registration that looks installed and is inert.
            name: InvalidEventType
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/app/events: event types must be concrete; a nil or interface type would never match a published value"
            public: The event type is not a concrete type and could never be dispatched
            reason: INVALID_EVENT_TYPE
          - code: CodeListenerPanicked
            doc: |-
              ListenerPanicked is the failure of a listener whose call panicked. The
              bus recovers it rather than letting it reach the runtime, because a
              panic escaping a listener would kill the PUBLISHER — code that did
              nothing wrong and, in the synchronous contract this domain promises, is
              usually the caller's request or transaction. The recovered value and
              the panicking goroutine's stack travel as fields; the value is never
              the wrap origin, so a panic carrying an *errs.Error cannot hijack this
              code.
            name: ListenerPanicked
            private: "core/app/events: listener panicked; the fields carry its name, the event type, the value and the stack"
            public: The event listener panicked and was recovered
            reason: LISTENER_PANICKED
          - code: CodeHalt
            doc: |-
              Halt is the control sentinel a listener returns to stop the dispatch:
              the listeners after it in priority order are not called.

              It is an error VALUE rather than a second return parameter because the
              error slot is already in the signature, and widening a published FUNC
              port to (bool, error) would break every listener ever written against
              it — ADR 0039's rule, applied to the shape rather than to a method set.
              The stdlib's own io.EOF is the same instrument: a sentinel that means
              "stop", matched with errors.Is, never rendered to a user.

              Only a subscription with MayHalt set may return it. From any other
              listener it is a [HaltNotPermitted] failure and the dispatch continues.
            name: Halt
            private: "core/app/events: control sentinel consumed by the bus and reported through DispatchValue; never returned to a publisher"
            public: A listener stopped the event dispatch
            reason: HALT
          - code: CodeListenerFailed
            doc: |-
              ListenerFailed is joined with the listener's own error when that
              listener returns one. It is a SEPARATE error in an errors.Join rather
              than a wrapper around the listener's error on purpose: errs.Wrap would
              hit the origin-wins rule (CLAUDE.md rule 6) and inherit the listener's
              code, so a caller could no longer ask "did any listener fail?" without
              first knowing every code any listener might produce. Side by side, both
              errs.HasCode(err, CodeListenerFailed) and the caller's own errors.Is
              answer — the shape service/app/lifecycle already uses for the same reason.
            name: ListenerFailed
            note: |-
              The bus's verdicts on a dispatch, raised by internal/service/app/events as it
              publishes. They are declared here, with the registration refusals, so that
              the domain's codes and sentinels are in one place (ADR 0160).
            private: "service/app/events: listener returned an error and the dispatch continued; the fields name the listener and the event type"
            public: An event listener reported an error
            reason: LISTENER_FAILED
          - code: CodeHaltNotPermitted
            doc: |-
              HaltNotPermitted is returned for a listener that returned the Halt
              control sentinel without SubscriptionValue.MayHalt.

              The dispatch is NOT stopped. Honouring the halt anyway would make the
              permission decorative, and silently swallowing it would leave a
              listener convinced it had vetoed an event that every one of its
              siblings then saw — the more expensive of the two silences, because it
              is invisible until the consequences diverge.
            name: HaltNotPermitted
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/events: listener returned Halt but its subscription has MayHalt false; propagation continued"
            public: A listener tried to stop the dispatch without the authority to
            reason: HALT_NOT_PERMITTED
    types:
      - decl: true
        doc: |-
          Listener reacts to one published event. The dynamic type of event is
          exactly the [EventType] the subscription was registered for, so a listener
          may assert it unconditionally — internal/service/app/events.On does that for
          the caller and is the only registration path most code needs.

          Delivery is SYNCHRONOUS on the publisher's goroutine: a Listener that
          blocks blocks the publisher, and a Listener that takes a lock takes it in
          the publisher's lock order. Keep it short, or hand off to something that
          owns its own goroutine — and if what you actually need is "return now,
          finish later, reliably", see the package documentation's frontier.

          Returning [Halt] stops the dispatch: the listeners after this one in
          priority order are not called. Only a subscription that declared
          [SubscriptionValue.MayHalt] can do that; from any other listener it is a
          HALT_NOT_PERMITTED failure and the dispatch continues.

          Returning any other non-nil error is COLLECTED and the dispatch CONTINUES.
          The other listeners are independent consequences of the same fact; making
          their delivery depend on this one's disk being full would reintroduce
          exactly the coupling a bus exists to remove.

          ctx is the publisher's context, passed through untouched. The bus never
          inspects it: an event is a fact that has already happened, and cancelling
          half of its consequences produces the partial state the synchronous
          contract exists to prevent. A Listener that must honour cancellation holds
          the context and can.
        name: Listener
        underlying: func(ctx context.Context, event any) error
      - decl: true
        doc: |-
          DispatchValue reports what one [Bus.Publish] did: how many listeners ran,
          whether one of them stopped the dispatch and which, how many never ran
          because of that, and how many failed.

          Every field is a scalar, deliberately. A per-listener slice would allocate
          on every publish — including the overwhelmingly common publish in which
          nothing goes wrong — and the per-listener detail already exists where it
          belongs: each collected error carries the listener's name and the event's
          type as fields. The report answers "what happened to this dispatch"; the
          errors answer "to whom".
        name: DispatchValue
        struct:
          fields:
            - doc: |-
                Delivered counts the listeners that ran and returned. A listener that
                returned an error is delivered — it saw the event — and is also
                counted in Failed. A listener that panicked is NOT delivered.
              name: Delivered
              type: int
            - doc: |-
                Failed counts the listeners that returned a non-nil error other than
                [Halt], plus the listeners that panicked, plus a [Halt] returned
                without [SubscriptionValue.MayHalt].
              name: Failed
              type: int
            - doc: |-
                Halted reports that a listener returned [Halt] and the dispatch stopped
                there. It is not a failure: [Bus.Publish] returns a nil error for a
                dispatch whose only remarkable event was a halt.
              name: Halted
              type: bool
            - doc: |-
                HaltedBy names the listener that halted, and is empty when Halted is
                false. It is the whole answer to "why did the last three listeners not
                run", which is otherwise a question only a debugger can settle.
              name: HaltedBy
              type: string
            - doc: |-
                Skipped counts the listeners that were registered for this event type
                and never ran because the dispatch was halted before reaching them.
              name: Skipped
              type: int
      - decl: true
        doc: |-
          Priority orders the listeners registered for one event type. LOWER RUNS
          FIRST, as with every ordering comparator in the stdlib, so a listener that
          must observe the event before the others is registered at a negative
          priority and one that must clean up after them at a positive one.

          Two subscriptions at the SAME priority run in REGISTRATION order — the
          order their Subscribe calls returned in. That is a promise, not an
          implementation detail: a bus whose ties resolved by map iteration would
          produce a different order on every run of the same program, and a listener
          set that works on Tuesday would be the same code that fails on Wednesday.

          Every value is usable and none is reserved, so there is nothing here for
          [Bus.Subscribe] to refuse (ADR 0031: the zero value is the safe default,
          and the refusals this domain does make are in [InvalidSubscription]).
        name: Priority
        underlying: int
      - decl: true
        doc: |-
          SubscriptionValue is one named listener's registration against one event
          type: what it is called, when it runs relative to its siblings, whether it
          is allowed to stop the dispatch, and what it does.

          The zero value is not runnable and is refused by [Bus.Subscribe]
          ([InvalidSubscription]) rather than accepted and silently skipped.
        name: SubscriptionValue
        struct:
          fields:
            - doc: |-
                Name identifies the listener in every error field and is the handle
                [Bus.Unsubscribe] removes it by. It must be non-empty and unique among
                the subscriptions registered for the same event type.
              name: Name
              type: string
            - doc: |-
                Priority orders this listener among the others registered for the same
                event type. Its zero value, [PriorityNormal], is a working default.
              name: Priority
              type: Priority
            - doc: |-
                MayHalt authorises this listener to stop the dispatch by returning
                [Halt]. Its zero value — false — is the conservative reading: a
                listener cannot silently prevent its siblings from ever seeing the
                event.

                It is a FIELD rather than a capability every listener has because a veto
                is an authority, and an authority that is not written down is one nobody
                reviews. Spelled here it is in the diff, in the review and in grep, at
                the wiring site where the reader is already asking who does what — the
                same instrument ADR 0031 applies to resilience.HedgeConfig.Idempotent,
                for the same reason: a precondition the SDK cannot check becomes a
                required, greppable assertion instead of a comment.

                A listener that returns [Halt] without this set does NOT stop the
                dispatch; the refusal is reported as HALT_NOT_PERMITTED and collected
                with the other listener errors.
              name: MayHalt
              type: bool
            - doc: Listener is the reaction itself. It must be non-nil.
              name: Listener
              type: Listener
  - doc: |-
      Package events — hosts the engine: registration, removal, and the
      copy-on-write membership the dispatch reads.

      Package events — hosts the TYPED registration front end: the generic
      functions that hide the erasure the heterogeneous bus is built on.

      Package events — hosts the dispatch: the ordered walk, the halt, the panic
      guard, and the aggregate.

      Package events — one published version of the bus membership, and the two
      rewrites that produce the next one.
    functions:
      - doc: |-
          New returns an empty in-process event bus.

          It takes no configuration, and that is a decision rather than an omission.
          Every knob considered was a CONTRACT and not a setting — whether a listener
          error stops the dispatch, whether a cancelled context abandons it, who may
          halt it — and a bus whose semantics vary by construction is a bus no call
          site can be read against. A Config today would be an empty struct, which
          CLAUDE.md rule 5 refuses; if a genuine knob ever appears it arrives as a
          sibling constructor, which is what ADR 0039 prescribes for a published
          signature that cannot grow.
        name: New
        out:
          - type: corev.Bus
      - doc: |-
          On registers a typed listener for the event type E.

          It is a package-level FUNCTION and not a method on Bus because Go methods
          cannot take type parameters of their own. That is not a workaround, it is
          the whole design constraint: a method-based Subscribe[E] would force the
          type parameter onto the Bus itself, and a Bus[E] carries exactly one event
          type — which is a channel, not a bus. See ADR 0053 §D3.

          	err := events.On(bus, events.Handler[OrderPlaced]{
          		Name:     "audit",
          		Priority: -10,
          		Handle:   func(ctx context.Context, e OrderPlaced) error { return audit.Write(ctx, e) },
          	})

          E MUST be a concrete type. An interface E is refused here rather than
          registered and never called: Publish resolves an event's type with
          reflect.TypeOf, which never yields an interface type (ADR 0031).
        in:
          - name: bus
            type: corev.Bus
          - name: handler
            type: Handler[E]
        name: "On"
        out:
          - type: error
        typeParams:
          - constraint: any
            name: E
      - doc: |-
          Off removes the listener registered under name for the event type E.

          It exists so that removing a listener is spelled with the same type
          parameter that registered it. Without it a caller would have to write
          reflect.TypeFor[E]() by hand — the one place reflection would have leaked
          out of this package and into application code.
        in:
          - name: bus
            type: corev.Bus
          - name: name
            type: string
        name: "Off"
        out:
          - type: error
        typeParams:
          - constraint: any
            name: E
    imports:
      corev: github.com/kitsunium/sdk/internal/core/app/events
    path: github.com/kitsunium/sdk/internal/service/app/events
    types:
      - decl: true
        doc: |-
          Handler is one typed listener's registration: the [On] argument.

          It is the typed front of core/app/events.SubscriptionValue, field for field.
          The duplication is the layer: core owns the ERASED contract a bus can
          actually dispatch, and this owns the shape a caller writes. Collapsing them
          would mean either putting a type parameter in the core port — which would
          make the bus hold exactly one event type — or making every caller write
          their own assertion.
        name: Handler
        struct:
          fields:
            - doc: |-
                Name identifies the listener in every error field and is the handle
                [Off] removes it by. It must be non-empty and unique among the
                listeners registered for E.
              name: Name
              type: string
            - doc: |-
                Priority orders this listener among the others registered for E. Lower
                runs first; equal priorities run in registration order. Its zero value,
                core/app/events.PriorityNormal, is a working default.
              name: Priority
              type: corev.Priority
            - doc: |-
                MayHalt authorises Handle to stop the dispatch by returning
                core/app/events.Halt. False — the zero value — means it cannot.
              name: MayHalt
              type: bool
            - doc: |-
                Handle is the reaction. It receives the event ALREADY TYPED. It must be
                non-nil.
              name: Handle
              type: func(ctx context.Context, event E) error
        typeParams:
          - constraint: any
            name: E
  - doc: |-
      Package events is the public facade for the SDK's IN-PROCESS event bus: one
      fact is published, and every listener registered for that fact's type reacts
      to it, in an order you choose, on your goroutine, before Publish returns.

      	bus := events.New()

      	_ = events.On(bus, events.Handler[OrderPlaced]{
      		Name:     "audit",
      		Priority: -10, // runs before the default-priority listeners
      		Handle:   func(ctx context.Context, e OrderPlaced) error { return audit.Write(ctx, e) },
      	})
      	_ = events.On(bus, events.Handler[OrderPlaced]{
      		Name:   "cache",
      		Handle: func(ctx context.Context, e OrderPlaced) error { return cache.InvalidateTag(ctx, e.CustomerID) },
      	})

      	report, err := bus.Publish(ctx, OrderPlaced{ID: 42, CustomerID: "c-7"})

      # This is not a queue, and the difference is the whole design

      Read this before anything else in the package. The two are confused
      constantly, and a bus that tries to be both guarantees neither.

      	                | events (this package)      | a queue
      	----------------|----------------------------|---------------------------
      	Scope           | one process                | many processes
      	Timing          | synchronous                | asynchronous
      	Goroutine       | the publisher's            | a consumer's
      	Transaction     | the publisher's            | its own
      	Durability      | none                       | the point of it
      	Retries / DLQ   | none                       | the point of it
      	If the process  | the event never happened   | the event is still there
      	dies mid-flight |                            |

      If you need "return now, finish later, and do not lose it", you need a
      queue. This package will not give you a worse version of one: there is no
      option to dispatch on another goroutine, because that would buy you
      asynchrony while quietly removing durability — work that can vanish with no
      record that it existed. Publish an event AND enqueue a job; they are
      different statements about different guarantees.

      What this package is for is the other case, which is far more common: one
      fact with several INDEPENDENT consequences that all belong to the caller's
      transaction. Writing the audit row, invalidating the cache and stamping the
      metric have nothing to say to each other, and the code that placed the order
      should not have to import all three.

      # Ordering

      Listeners for one event type run in ascending [Handler].Priority — lower
      first, as with every stdlib comparator — and listeners at the SAME priority
      run in registration order. Both halves are promises. A bus whose ties
      resolved by map iteration would run the same program in a different order
      every time, and a listener set that works today would be the same code that
      fails tomorrow.

      # Stopping the dispatch

      A listener stops the remaining listeners by returning [Halt]. Only a
      listener whose registration set [Handler].MayHalt may do so; from any other
      listener the attempt is refused as [HaltNotPermitted], the dispatch
      CONTINUES, and the refusal is reported.

      The permission is a field at the registration site rather than a power every
      listener has, because a veto is an authority and an authority nobody wrote
      down is one nobody reviews. `MayHalt: true` is in the diff, in the review
      and in grep, next to the name of the listener that holds it.

      A halt is not a failure. [Bus].Publish returns a nil error for a dispatch
      whose only remarkable event was a halt, and reports it through
      [Dispatch].Halted, [Dispatch].HaltedBy and [Dispatch].Skipped.

      # Typing

      Go has no covariance and its methods cannot take type parameters, so a
      typed listener registers on a multi-type bus through the package-level
      generic [On] rather than through a method:

      	events.On(bus, events.Handler[OrderPlaced]{…})

      [On] derives the routing key from E and wraps your typed function in the
      erased one the bus dispatches. Your listener never sees an `any`. The event
      type must be CONCRETE: an interface is refused at registration
      ([InvalidEventType]), because Publish routes on a value's dynamic type and a
      listener keyed on an interface would be registered and never called.

      # Errors and panics

      A listener error does NOT stop the dispatch. The listeners are independent
      consequences of one fact, and making the third one's delivery depend on the
      second one's disk being full is the coupling a bus exists to remove.
      Everything that failed is aggregated with errors.Join, carrying
      [ListenerFailed] and the listener's own error side by side — so
      errs.HasCode(err, CodeListenerFailed) and your own errors.Is both answer on
      the same value.

      A listener that PANICS does not take the publisher down and does not
      silence the listeners after it. The panic is recovered, reported as
      [ListenerPanicked] with the listener's name, the panic value and the
      originating stack in fields, and the dispatch continues.

      # Cancellation

      The bus passes ctx to every listener and never inspects it. An event is a
      fact that has already happened; abandoning half of its consequences because
      the publisher's deadline expired produces exactly the partial state the
      synchronous contract exists to prevent. A listener that must honour
      cancellation holds the context and can.
    facade:
      - const:
          - doc: |-
              PriorityNormal is the zero Priority: negative values run before it,
              positive values after.
            name: PriorityNormal
            reexport: corev.PriorityNormal
            type: Priority
            typed: true
            value: "0"
      - alias:
          - doc: Bus is the public alias for the in-process dispatch contract.
            name: Bus
            target: corev.Bus
      - alias:
          - doc: |-
              Listener is the public alias for the ERASED reaction the bus dispatches.
              Most code never names it — [On] builds one from a typed function.
            name: Listener
            target: corev.Listener
      - alias:
          - doc: |-
              EventType is the public alias for the concrete Go type a subscription is
              keyed on. It is reflect.Type; [On] and [Off] derive it for you.
            name: EventType
            target: corev.EventType
      - alias:
          - doc: |-
              Priority is the public alias for a listener's position in the dispatch
              order. Lower runs first.
            name: Priority
            target: corev.Priority
      - alias:
          - doc: |-
              Subscription is the public alias for one ERASED registration. Prefer
              [Handler] with [On]; this is the shape a caller who has already erased the
              type themselves registers.
            name: Subscription
            target: corev.SubscriptionValue
      - alias:
          - doc: Dispatch is the public alias for the report one Publish returns.
            name: Dispatch
            target: corev.DispatchValue
      - alias:
          - doc: Handler is the public alias for one TYPED listener's registration.
            name: Handler
            target: svcev.Handler[E]
            typeParams:
              - constraint: any
                name: E
      - var:
          - doc: |-
              Halt is the control sentinel a listener returns to stop the dispatch.
              Only a listener registered with MayHalt may use it.
            name: Halt
            reexport: corev.Halt
            type: "*errs.Error"
          - doc: InvalidSubscription refuses a registration with no name or no listener.
            name: InvalidSubscription
            reexport: corev.InvalidSubscription
            type: "*errs.Error"
          - doc: DuplicateListener refuses a name already registered for that type.
            name: DuplicateListener
            reexport: corev.DuplicateListener
            type: "*errs.Error"
          - doc: UnknownListener reports an Unsubscribe naming nobody.
            name: UnknownListener
            reexport: corev.UnknownListener
            type: "*errs.Error"
          - doc: InvalidEventType refuses a type no dispatch could ever match.
            name: InvalidEventType
            reexport: corev.InvalidEventType
            type: "*errs.Error"
          - doc: ListenerPanicked reports a recovered listener panic.
            name: ListenerPanicked
            reexport: corev.ListenerPanicked
            type: "*errs.Error"
          - doc: |-
              ListenerFailed is the bus's verdict on a listener that returned an
              error; it travels beside that error, never around it.
            name: ListenerFailed
            reexport: corev.ListenerFailed
            type: "*errs.Error"
          - doc: |-
              HaltNotPermitted reports a Halt from a listener without MayHalt. The
              dispatch continued.
            name: HaltNotPermitted
            reexport: corev.HaltNotPermitted
            type: "*errs.Error"
      - func:
          doc: |-
            New returns an empty in-process event bus. It cannot fail and takes no
            configuration: every knob considered was a contract rather than a setting,
            and a bus whose semantics vary by construction cannot be read at the call
            site.
          forward: svcev.New
          name: New
          out:
            - type: Bus
      - func:
          doc: |-
            On registers a typed listener for the event type E.

            It is a function rather than a method because Go methods cannot take type
            parameters — and a Bus[E] would carry exactly one event type, which is a
            channel and not a bus.

            E must be a concrete type; an interface is refused with [InvalidEventType].
          forward: svcev.On
          in:
            - name: bus
              type: Bus
            - name: handler
              type: Handler[E]
          name: "On"
          out:
            - type: error
          typeParams:
            - constraint: any
              name: E
      - func:
          doc: |-
            Off removes the listener registered under name for the event type E. A name
            that is not registered is [UnknownListener], never a silent success.
          forward: svcev.Off[E]
          in:
            - name: bus
              type: Bus
            - name: name
              type: string
          name: "Off"
          out:
            - type: error
          typeParams:
            - constraint: any
              name: E
    imports:
      corev: github.com/kitsunium/sdk/internal/core/app/events
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcev: github.com/kitsunium/sdk/internal/service/app/events
    path: github.com/kitsunium/sdk/pkg/v1/app/events
