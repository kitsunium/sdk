apiVersion: kit.kitsunium/design/v2
domain: app/mail
packages:
  - codes:
      - const:
          - doc: |-
              CodeHeaderInjection identifies a header name or value carrying CR, LF or
              NUL. It is THE failure of this domain: RFC 5322 §2.2 terminates a field with
              CRLF, so those two octets do not corrupt a header, they end it and begin one
              the caller never wrote.
            name: CodeHeaderInjection
            note: "range: 0.2.31.0 - 0.2.31.255"
            value: "0x00_02_1F_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidAddress identifies an addr-spec outside the dot-atom subset of
              RFC 5322 §3.4.1 that this domain accepts: empty, missing or repeating "@",
              carrying a space or an angle bracket, or exceeding the RFC 5321 §4.5.3.1
              octet limits.
            name: CodeInvalidAddress
            value: "0x00_02_1F_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeMissingSender identifies a Message with no From mailbox. RFC 5322 §3.6
              makes the originator field mandatory, and an empty From is what an unfilled
              struct looks like.
            name: CodeMissingSender
            value: "0x00_02_1F_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeNoRecipients identifies a Message whose To, Cc and Bcc are all empty.
              SMTP has no RCPT TO to issue, so the send could only ever fail — it fails
              here instead, before a socket is opened.
            name: CodeNoRecipients
            value: "0x00_02_1F_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeEmptyBody identifies a Message with no text, no HTML and no attachment.
              A zero body is not "send an empty mail", it is a struct nobody filled in.
            name: CodeEmptyBody
            value: "0x00_02_1F_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeReservedHeader identifies an extra header whose name the composer owns.
              Letting one through would either emit the field twice — RFC 5322 §3.6 allows
              exactly one From, Date or Subject — or let a caller spell Bcc by hand, which
              is the injection attack with the SDK's own cooperation.
            name: CodeReservedHeader
            value: "0x00_02_1F_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidAttachment identifies an attachment the composer cannot render:
              no filename, an unparseable media type, an inline part with no body to be
              referenced from, or a Content-ID outside the addr-spec grammar RFC 2392 §2
              borrows for cid: URLs.
            name: CodeInvalidAttachment
            value: "0x00_02_1F_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeHeaderTooLong identifies a header line that cannot be folded under the
              RFC 5322 §2.1.1 hard limit of 998 octets. Folding is only legal at existing
              whitespace (§2.2.3), so a single token longer than the limit has no legal
              fold point and is refused rather than cut.
            name: CodeHeaderTooLong
            value: "0x00_02_1F_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedAddress identifies a syntactically plausible address this
              domain deliberately does not carry: a non-ASCII addr-spec (RFC 6531
              SMTPUTF8) or a quoted local-part. Both are legal mail and neither is
              supported, so they are named rather than mangled into something deliverable
              to the wrong mailbox.
            name: CodeUnsupportedAddress
            value: "0x00_02_1F_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeComposeFailed identifies a MIME body the composer could not assemble:
              an encoder that refused a byte, or a media type mime.ParseMediaType would
              not accept.
            name: CodeComposeFailed
            note: |-
              range: 0.3.61.0 - 0.3.61.255

              The outcomes of composition and of the SMTP session. The range was allocated
              to internal/service/app/mail, which raises these codes, and it is declared
              here with the message refusals so that every code of the domain is in one
              place (ADR 0160). A code keeps the value its allocation gave it whichever
              layer declares it, so the layer byte still reads 3.
            value: "0x00_03_3D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidConfig identifies an SMTP transport that cannot be constructed as
              written: no host, a port outside 1-65535, or — the one that matters — a
              TLSMode left at its zero value.
            name: CodeInvalidConfig
            value: "0x00_03_3D_02"
        type: errs.Code
      - const:
          - doc: CodeDialFailed identifies a TCP connection that was never established.
            name: CodeDialFailed
            value: "0x00_03_3D_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeGreetingFailed identifies a server that answered the connection but not
              the SMTP conversation: a refused greeting, a refused EHLO, or a QUIT the
              server never acknowledged.
            name: CodeGreetingFailed
            value: "0x00_03_3D_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLSRequired identifies a session that could not be encrypted because the
              server never offered STARTTLS. It is a REFUSAL and never a downgrade.
            name: CodeTLSRequired
            value: "0x00_03_3D_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLSFailed identifies a TLS handshake or STARTTLS command the server or
              the certificate chain refused.
            name: CodeTLSFailed
            value: "0x00_03_3D_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeAuthInsecure identifies credentials that would have travelled over an
              unencrypted session. The refusal happens BEFORE the AUTH command is written.
            name: CodeAuthInsecure
            value: "0x00_03_3D_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeAuthFailed identifies credentials the server rejected, or a server that
              advertised no AUTH mechanism at all.
            name: CodeAuthFailed
            value: "0x00_03_3D_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeSendRefused identifies a MAIL, RCPT or DATA command the server answered
              with a failure reply.
            name: CodeSendRefused
            value: "0x00_03_3D_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidURL identifies an SMTP URL ParseURL could not read: not a URL, a
              scheme other than smtp or smtps, a path, a fragment, an unknown or repeated
              parameter, a tls mode it does not know, no host, or a port out of range.
            name: CodeInvalidURL
            value: "0x00_03_3D_0A"
        type: errs.Code
    constants:
      - name: DefaultAttachmentType
        type: string
        value: "\"application/octet-stream\""
      - name: HeaderFrom
        type: string
        value: "\"From\""
      - name: HeaderTo
        type: string
        value: "\"To\""
      - name: HeaderCc
        type: string
        value: "\"Cc\""
      - name: HeaderBcc
        type: string
        value: "\"Bcc\""
      - name: HeaderReplyTo
        type: string
        value: "\"Reply-To\""
      - name: HeaderSubject
        type: string
        value: "\"Subject\""
      - name: HeaderDate
        type: string
        value: "\"Date\""
      - name: HeaderMessageID
        type: string
        value: "\"Message-ID\""
      - name: HeaderMIMEVersion
        type: string
        value: "\"MIME-Version\""
      - name: HeaderContentType
        type: string
        value: "\"Content-Type\""
      - name: HeaderContentTransferEncoding
        type: string
        value: "\"Content-Transfer-Encoding\""
      - name: HeaderContentDisposition
        type: string
        value: "\"Content-Disposition\""
      - name: HeaderContentID
        type: string
        value: "\"Content-ID\""
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/mail
    ports:
      - doc: |-
          Transport carries a message to whatever will deliver it. It is FROZEN at one
          method.

          One method, because "send this mail" is the only thing every transport can
          do. A capability that some transports have arrives as a SIBLING interface
          reached by type assertion, never as a second method (ADR 0039): pkg/v1/app/mail
          aliases this type, Go interfaces are structural, and a second method would
          break every downstream implementation at compile time with no deprecation
          window.

          Implementations MUST be safe for concurrent use.

          What a Transport does NOT promise is as important as what it does. A nil
          error means the message was ACCEPTED by the next hop — nothing more. It is
          not a promise of delivery, of inbox placement, or of the recipient existing:
          SMTP accepts responsibility hop by hop (RFC 5321 §6.1), and the hop that
          eventually refuses reports it in a bounce message hours later, to the
          envelope's return path, over a channel this port has no access to.

          It is named for the ROLE it plays rather than for its one method: "the SMTP
          transport" and "the in-memory transport" are the words this domain is
          discussed in, and a Sender would name the verb instead.

          IFACE-PLUGIN: the concrete transports stay unexported behind their
          constructors in internal/service/app/mail.
        methods:
          - doc: |-
              Send composes msg and hands it to the next hop.

              It validates before it dials: a message that cannot be composed is
              refused without opening a socket, so a header-injection attempt never
              reaches a server and never costs a connection.

              ctx bounds the whole attempt. A transport that cannot honour a deadline
              natively must still stop when ctx does — by severing its own connection
              if that is the only mechanism available — because a Send that outlives
              its context is a goroutine the caller believes it has cancelled.
            in:
              - name: ctx
                type: context.Context
              - name: msg
                type: MessageValue
            name: Send
            out:
              - type: error
        name: Transport
      - doc: |-
          BatchSender sends several messages over ONE session. It is the ADR 0039
          sibling of [Transport], reached by type assertion:

          	if batch, ok := transport.(mail.BatchSender); ok {
          		err = batch.SendBatch(ctx, notifications)
          	}

          It is a capability and not a method, because it is not one for every
          transport: an HTTP provider API has no session to reuse, and a transport
          that implemented it by looping would be advertising an optimisation it does
          not perform.

          The semantics of a partial failure are the reason this is not just a loop in
          the caller: SendBatch sends every message it can and returns the failures
          AGGREGATED with errors.Join, rather than stopping at the first. One bad
          recipient in a batch of five hundred must not silence the other four hundred
          and ninety-nine, and the caller still learns about it — errs.HasCode walks
          Unwrap() []error, so a joined error answers the same questions a single one
          does.
        methods:
          - doc: |-
              SendBatch sends every message in msgs and returns the joined failures.
              A nil error means every message was accepted.
            in:
              - name: ctx
                type: context.Context
              - name: msgs
                type: "[]MessageValue"
            name: SendBatch
            out:
              - type: error
        name: BatchSender
      - doc: |-
          Outbox exposes what a transport has been asked to send. It is the ADR 0039
          sibling that makes a test double a double rather than a stub:

          	if box, ok := transport.(mail.Outbox); ok {
          		sent := box.Sent()
          	}

          Only an in-memory transport implements it, and that is the point — a
          consumer's test asserts against this interface without importing the SDK's
          service layer, and a production transport that started implementing it would
          be a transport keeping every message it ever sent in memory.
        methods:
          - doc: |-
              Sent returns the deliveries recorded so far, oldest first. The returned
              slice and every byte slice in it are the caller's own copy.
            name: Sent
            out:
              - type: "[]DeliveryValue"
          - doc: Reset discards the record, so one test's messages are not another's.
            name: Reset
        name: Outbox
      - doc: |-
          FullTransport is the union the SDK's in-memory transport returns: a
          [Transport] that also batches and records.

          It exists for the same reason core/data/vfs.FullFS and core/observe/metrics.FullMeter do —
          the port stays frozen and the capabilities stay assertable for a THIRD-PARTY
          transport that has neither, while a caller wiring one of the SDK's own does
          not have to type-assert for a feature it just constructed. A parameter should
          still ask for the narrowest thing it uses.
        embeds:
          - Transport
          - BatchSender
          - Outbox
        name: FullTransport
    sentinels:
      - var:
          - code: CodeHeaderInjection
            doc: |-
              HeaderInjection is returned when a header name or value carries CR, LF
              or NUL.

              It is a REFUSAL and never a repair. mime.QEncoding.Encode would turn the
              CRLF into "=0D=0A" and mime.FormatMediaType would percent-escape it —
              both produce a deliverable message that is not the one the caller wrote,
              and both report success. A caller who learns nothing cannot fix the
              input, and the next message carries the same payload.

              The Public names no value. "Subject" is safe to say; the string an
              attacker put in it is not.
            name: HeaderInjection
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "core/app/mail: header name or value contains CR, LF or NUL — RFC 5322 §2.2 ends a field at CRLF, so the remainder would become headers the caller never wrote; refused, never sanitised"
            public: A message header contains a line break and was refused
            reason: HEADER_INJECTION
          - code: CodeInvalidAddress
            doc: |-
              InvalidAddress is returned for an addr-spec outside the dot-atom subset
              of RFC 5322 §3.4.1 this domain accepts, or outside the RFC 5321 §4.5.3.1
              octet limits (64 for the local part, 255 for the domain).
            name: InvalidAddress
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: addr-spec is empty, has no single @, carries a space, angle bracket or control byte, or exceeds the RFC 5321 §4.5.3.1 length limits"
            public: A mail address in that message is not usable
            reason: INVALID_ADDRESS
          - code: CodeMissingSender
            doc: MissingSender is returned for a Message whose From carries no address.
            name: MissingSender
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Message.From is the zero Address; RFC 5322 §3.6 makes the originator field mandatory and there is no defensible default"
            public: A message must name the mailbox it is from
            reason: MISSING_SENDER
          - code: CodeNoRecipients
            doc: |-
              NoRecipients is returned when To, Cc and Bcc are all empty.

              The refusal happens before any socket is opened. An SMTP session with no
              RCPT TO cannot succeed, so the only thing dialling first would buy is a
              slower, less specific failure.
            name: NoRecipients
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: To, Cc and Bcc are all empty, so the SMTP session would have no RCPT TO to issue"
            public: A message must name at least one recipient
            reason: NO_RECIPIENTS
          - code: CodeEmptyBody
            doc: |-
              EmptyBody is returned for a Message with no text, no HTML and no
              attachment — ADR 0031's refusing half, applied to content.
            name: EmptyBody
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Text, HTML and Attachments are all empty; a zero body is an unfilled struct rather than a decision to send nothing"
            public: A message must carry text, HTML or an attachment
            reason: EMPTY_BODY
          - code: CodeReservedHeader
            doc: |-
              ReservedHeader is returned when Message.Headers names a field the
              composer owns.

              Two different failures share this refusal. Emitting From, Date or Subject
              twice violates RFC 5322 §3.6, which permits exactly one of each, and
              leaves every receiver free to pick a different one. And spelling "Bcc"
              by hand is the injection this domain exists to stop, arriving through the
              front door instead.
            name: ReservedHeader
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Headers names a composer-owned field (From, To, Cc, Bcc, Reply-To, Subject, Date, Message-ID, MIME-Version or a Content-* field)"
            public: That header is set by the mail composer and cannot be overridden
            reason: RESERVED_HEADER
          - code: CodeInvalidAttachment
            doc: |-
              InvalidAttachment is returned for an attachment the composer cannot
              render: no filename, an unparseable media type, a malformed Content-ID,
              or an inline part in a message with no body for its cid: to be
              referenced from.
            name: InvalidAttachment
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: attachment has no filename, an unparseable media type, a Content-ID outside the RFC 2392 §2 grammar, or is inline in a message with no text or HTML body to reference it"
            public: An attachment on that message is not usable
            reason: INVALID_ATTACHMENT
          - code: CodeHeaderTooLong
            doc: |-
              HeaderTooLong is returned when a header line cannot be folded under the
              RFC 5322 §2.1.1 hard limit of 998 octets.

              Folding inserts CRLF before existing whitespace (§2.2.3) — unfolding
              removes the CRLF and keeps the whitespace, so the value survives exactly.
              A token with no whitespace in it has no legal fold point, and truncating
              it would deliver a different value while reporting success.
            name: HeaderTooLong
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: a header line exceeds the RFC 5322 §2.1.1 limit of 998 octets and contains no whitespace to fold at; refused rather than truncated"
            public: A message header is too long to fold and was refused
            reason: HEADER_TOO_LONG
          - code: CodeUnsupportedAddress
            doc: |-
              UnsupportedAddress is returned for a non-ASCII addr-spec (RFC 6531
              SMTPUTF8) or a quoted local-part.

              Both are legal mail. Neither is carried here, and saying so BY NAME is
              the point: SMTPUTF8 must be negotiated with the server, net/smtp does
              not negotiate it, and the alternative to refusing is punycoding a domain
              or dropping accents from a local part — which delivers, silently, to a
              different mailbox.
            name: UnsupportedAddress
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "core/app/mail: non-ASCII addr-spec (RFC 6531 SMTPUTF8) or quoted local-part; refused by name rather than transliterated into a deliverable but different address"
            public: That address form is not supported by this mail transport
            reason: UNSUPPORTED_ADDRESS
          - code: CodeComposeFailed
            doc: |-
              ComposeFailed is returned when the MIME body could not be assembled.

              It is deliberately rare: everything a caller can get wrong is refused by
              the message guards with a specific verdict, so reaching this one means
              an encoder or a media-type parser refused something those guards
              accepted — which is a defect in the composer, not in the caller's
              message.
            name: ComposeFailed
            note: |-
              The outcomes of composition and of the SMTP session, raised by
              internal/service/app/mail. They are declared here, with the message
              refusals, so that the domain's codes and sentinels are in one place
              (ADR 0160). A server's reply text is third-party data of unbounded length
              that this SDK did not write; it travels as a log-only field and never into
              a message a caller might render.
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/app/mail: a MIME encoder, a multipart writer or mime.ParseMediaType refused input the core/app/mail guards accepted — the cause travels as a field"
            public: The message could not be assembled into a MIME body
            reason: COMPOSE_FAILED
          - code: CodeInvalidConfig
            doc: |-
              InvalidConfig is returned by the SMTP constructor for a configuration
              that cannot be honoured as written.

              The zero TLSMode is the interesting member. It is REFUSED rather than
              read as a default, because both candidate defaults are wrong: choosing
              encryption silently breaks every caller pointing at a plaintext relay on
              a private network, and choosing none silently ships credentials in the
              clear for everyone else. ADR 0031's refusing half, applied where the
              SDK genuinely cannot know.
            name: InvalidConfig
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/mail: empty Host, Port outside 1-65535, or TLS left at its zero value — the zero is refused because neither 'encrypt' nor 'do not' is a safe guess (ADR 0031)"
            public: The SMTP transport configuration is not usable as written
            reason: INVALID_CONFIG
          - code: CodeDialFailed
            doc: |-
              DialFailed is returned when the TCP connection was never established, or
              was severed by the caller's context before the greeting.
            name: DialFailed
            options:
              - errs.WithExitCode(exitNoHost)
            private: "service/app/mail: TCP dial failed, timed out, or the context was cancelled before the SMTP greeting; the dial error travels as a field"
            public: The mail server could not be reached
            reason: DIAL_FAILED
          - code: CodeGreetingFailed
            doc: |-
              GreetingFailed is returned when the connection opened and the SMTP
              conversation did not: a refused greeting, a refused EHLO, a QUIT the
              server never acknowledged.
            name: GreetingFailed
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/app/mail: the 220 greeting, the EHLO/HELO exchange or the closing QUIT was refused or malformed; the server reply travels as a field"
            public: The mail server did not accept the SMTP conversation
            reason: GREETING_FAILED
          - code: CodeTLSRequired
            doc: |-
              TLSRequired is returned when the transport is configured for STARTTLS
              and the server never advertised it.

              This is the defect the domain refuses to have. "Opportunistic STARTTLS"
              — encrypt if offered, continue in the clear if not — is the shape almost
              every mail library ships, and it means an active attacker strips the
              advertisement and reads everything, including the credentials, while the
              caller's logs show a successful send. There is no configuration here
              that produces that behaviour, and adding one is not a feature request.
            name: TLSRequired
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: TLSStartTLS was configured and the EHLO response advertised no STARTTLS extension; refused, never downgraded to cleartext"
            public: The mail server did not offer the encryption this transport requires
            reason: TLS_REQUIRED
          - code: CodeTLSFailed
            doc: |-
              TLSFailed is returned when STARTTLS or the implicit handshake was
              attempted and did not complete: a refused command, an untrusted chain, a
              name that does not match.
            name: TLSFailed
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: the STARTTLS command was refused, or the TLS handshake failed on trust, name or version; the handshake error travels as a field"
            public: The connection to the mail server could not be encrypted
            reason: TLS_FAILED
          - code: CodeAuthInsecure
            doc: |-
              AuthInsecure is returned when credentials were configured for a session
              that is not encrypted — at CONSTRUCTION when TLS is disabled outright,
              and again before the AUTH command when the session turned out not to be
              encrypted after all.

              The second check is not redundant, and net/smtp is the reason. Its
              PlainAuth carves out an exception for a server named localhost —
              "isLocalhost(server.Name)" — and sends the password in the clear to it.
              That is defensible for the stdlib's audience and indefensible for a
              transport in a container, where the relay one hop away IS 127.0.0.1 and
              the network between them is a bridge somebody else can join.
            name: AuthInsecure
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: Username is set on a session that is not encrypted; refused before the AUTH command is written, including for a localhost relay where net/smtp.PlainAuth would have sent it"
            public: Credentials cannot be sent over an unencrypted mail session
            reason: AUTH_INSECURE
          - code: CodeAuthFailed
            doc: |-
              AuthFailed is returned when the server rejected the credentials, or
              advertised no AUTH mechanism to offer them through.
            name: AuthFailed
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: the AUTH exchange was refused, or the EHLO response advertised no AUTH extension; the server reply travels as a field and the credential never leaves this process's memory"
            public: The mail server rejected the credentials
            reason: AUTH_FAILED
          - code: CodeSendRefused
            doc: |-
              SendRefused is returned when MAIL, RCPT or DATA was answered with a
              failure reply.

              It carries the SMTP reply as a log-only field, never as Public: a reply
              is third-party text of unbounded length that may name a recipient, and
              Public is the half that travels to strangers.
            name: SendRefused
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/app/mail: MAIL FROM, RCPT TO or DATA was answered with a failure reply; the command and the server's reply travel as log-only fields"
            public: The mail server refused the message
            reason: SEND_REFUSED
          - code: CodeInvalidURL
            doc: |-
              InvalidURL is returned by ParseURL for a URL it cannot read. It names the
              clause that failed and NEVER the URL: an SMTP URL carries the password
              in its userinfo, and every part of it — the host, the port, a parameter
              name — is quoted by no refusal, because a URL that failed to parse is
              exactly the one whose parts are not where they should be.
            name: InvalidURL
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/mail: ParseURL refused the URL; the problem field names the clause, and the URL itself is never repeated because it carries the password"
            public: The SMTP URL is not usable as written
            reason: INVALID_URL
    types:
      - methods:
          - name: IsZero
            out:
              - type: bool
            recv: value
        name: AddressValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Addr
              type: string
      - methods:
          - name: Inline
            out:
              - type: bool
            recv: pointer
        name: AttachmentValue
        struct:
          fields:
            - name: Filename
              type: string
            - name: ContentType
              type: string
            - name: ContentID
              type: string
            - name: Content
              type: "[]byte"
      - name: HeaderFieldValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Value
              type: string
      - name: MessageValue
        struct:
          fields:
            - name: Date
              type: time.Time
            - name: From
              type: AddressValue
            - name: Subject
              type: string
            - name: MessageID
              type: string
            - name: ReplyTo
              type: "[]AddressValue"
            - name: To
              type: "[]AddressValue"
            - name: Cc
              type: "[]AddressValue"
            - name: Bcc
              type: "[]AddressValue"
            - name: Headers
              type: "[]HeaderFieldValue"
            - name: Text
              type: string
            - name: HTML
              type: string
            - name: Attachments
              type: "[]AttachmentValue"
      - name: DeliveryValue
        struct:
          fields:
            - name: Envelope
              type: EnvelopeValue
            - name: Raw
              type: "[]byte"
      - name: EnvelopeValue
        struct:
          fields:
            - name: From
              type: string
            - name: To
              type: "[]string"
  - constants:
      - name: DefaultCaptureKeep
        type: int
        value: "200"
      - name: TLSUnset
        type: TLSMode
        value: "0"
      - name: TLSStartTLS
        type: TLSMode
        value: "1"
      - name: TLSImplicit
        type: TLSMode
        value: "2"
      - name: TLSDisabled
        type: TLSMode
        value: "3"
    functions:
      - in:
          - name: field
            type: string
          - name: a
            type: coremail.AddressValue
        name: ValidateAddress
        out:
          - type: error
      - in:
          - name: s
            type: string
        name: IsDotAtom
        out:
          - type: bool
      - in:
          - name: name
            type: string
        name: NeedsQuotedDisplayName
        out:
          - type: bool
      - in:
          - name: field
            type: string
          - name: a
            type: "*coremail.AttachmentValue"
        name: ValidateAttachment
        out:
          - type: error
      - in:
          - name: cfg
            type: ComposerConfig
        name: NewComposer
        out:
          - type: "*Composer"
      - in:
          - name: m
            type: coremail.MessageValue
        name: Envelope
        out:
          - name: envelope
            type: coremail.EnvelopeValue
          - name: err
            type: error
      - in:
          - name: name
            type: string
        name: IsReservedHeader
        out:
          - type: bool
      - in:
          - name: name
            type: string
        name: ValidateHeaderName
        out:
          - type: error
      - in:
          - name: name
          - name: value
            type: string
        name: ValidateHeaderValue
        out:
          - type: error
      - in:
          - name: field
            type: coremail.HeaderFieldValue
        name: ValidateHeader
        out:
          - type: error
      - name: NewMemory
        out:
          - type: coremail.FullTransport
      - in:
          - name: keep
            type: int
        name: NewCapture
        out:
          - type: coremail.FullTransport
      - in:
          - name: cfg
            type: SMTPConfig
        name: NewSMTP
        out:
          - name: transport
            type: coremail.Transport
          - name: err
            type: error
      - in:
          - name: raw
            type: string
        name: ParseURL
        out:
          - name: cfg
            type: SMTPConfig
          - name: err
            type: error
      - in:
          - name: m
            type: coremail.MessageValue
        name: Validate
        out:
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coremail: github.com/kitsunium/sdk/internal/core/app/mail
      corenet: github.com/kitsunium/sdk/internal/core/net
    path: github.com/kitsunium/sdk/internal/service/app/mail
    types:
      - methods:
          - in:
              - name: msg
                type: coremail.MessageValue
            name: Compose
            out:
              - name: raw
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
        name: Composer
        struct:
          unexported: true
      - name: ComposerConfig
        struct:
          fields:
            - name: Clock
              type: clock.Clock
            - name: Rand
              type: io.Reader
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: TLSMode
        underlying: uint8
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: GoString
            out:
              - type: string
            recv: value
          - in:
              - name: state
                type: fmt.State
              - name: verb
                type: rune
            name: Format
            recv: value
          - name: MarshalJSON
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: value
        name: SMTPConfig
        struct:
          fields:
            - name: Host
              type: string
            - name: Port
              type: int
            - name: TLS
              type: TLSMode
            - name: Identity
              type: corenet.IdentityValue
            - name: Username
              type: string
            - name: Password
              type: string
            - name: LocalName
              type: string
            - name: DialTimeout
              type: time.Duration
  - facade:
      - const:
          - doc: |-
              TLSUnset is the zero value and is refused at construction — neither
              "encrypt" nor "do not" is a guess this SDK is entitled to make for a caller.
            name: TLSUnset
            reexport: svcmail.TLSUnset
            type: TLSMode
            typed: true
            value: "0"
      - const:
          - doc: |-
              TLSStartTLS requires the server to advertise STARTTLS (RFC 3207) and refuses
              the session when it does not. The port-587 shape.

              There is deliberately no opportunistic variant: a transport that encrypts
              when the server offers it and continues in the clear when it does not is one
              stripped EHLO line away from handing an attacker the whole session.
            name: TLSStartTLS
            reexport: svcmail.TLSStartTLS
            type: TLSMode
            typed: true
            value: "1"
      - const:
          - doc: |-
              TLSImplicit negotiates TLS before the greeting, which RFC 8314 §3.3 prefers
              because there is no plaintext phase to interfere with. The port-465 shape.
            name: TLSImplicit
            reexport: svcmail.TLSImplicit
            type: TLSMode
            typed: true
            value: "2"
      - const:
          - doc: |-
              TLSDisabled sends in the clear and must be spelled out loud. Credentials are
              refused with it, at construction.
            name: TLSDisabled
            reexport: svcmail.TLSDisabled
            type: TLSMode
            typed: true
            value: "3"
      - const:
          - doc: |-
              DefaultCaptureKeep is how many deliveries NewCapture keeps when given a
              non-positive number.
            name: DefaultCaptureKeep
            reexport: svcmail.DefaultCaptureKeep
            type: int
            typed: true
            value: "200"
      - alias:
          - doc: Message is the public alias for one mail, as a value.
            name: Message
            target: coremail.MessageValue
      - alias:
          - doc: Address is the public alias for one RFC 5322 mailbox.
            name: Address
            target: coremail.AddressValue
      - alias:
          - doc: |-
              Attachment is the public alias for one file or inline part. A non-empty
              ContentID makes it inline.
            name: Attachment
            target: coremail.AttachmentValue
      - alias:
          - doc: |-
              HeaderField is the public alias for one additional header. It is a slice
              element rather than a map entry so a composed message is deterministic and so
              a field may legitimately repeat.
            name: HeaderField
            target: coremail.HeaderFieldValue
      - alias:
          - doc: |-
              Envelope is the public alias for the SMTP envelope: one MAIL FROM and every
              RCPT TO, Bcc included.
            name: Envelope
            target: coremail.EnvelopeValue
      - alias:
          - doc: |-
              Delivery is the public alias for one record of what a transport put on the
              wire: the envelope, and the composed bytes.
            name: Delivery
            target: coremail.DeliveryValue
      - alias:
          - doc: |-
              Transport is the public alias for the frozen port. A new capability arrives
              as a sibling interface reached by type assertion, never as a second method
              (ADR 0039).
            name: Transport
            target: coremail.Transport
      - alias:
          - doc: |-
              BatchSender is the public alias for the sibling that sends several messages
              over one session.
            name: BatchSender
            target: coremail.BatchSender
      - alias:
          - doc: |-
              Outbox is the public alias for the sibling that exposes what was sent. Only
              the in-memory transport implements it.
            name: Outbox
            target: coremail.Outbox
      - alias:
          - doc: |-
              FullTransport is the public alias for the union [NewMemory] returns. A
              parameter should still ask for the narrowest thing it uses.
            name: FullTransport
            target: coremail.FullTransport
      - alias:
          - doc: SMTPConfig is the public alias for the SMTP transport's configuration.
            name: SMTPConfig
            target: svcmail.SMTPConfig
      - alias:
          - doc: TLSMode is the public alias for the encryption mode. Its zero value is refused.
            name: TLSMode
            target: svcmail.TLSMode
      - alias:
          - doc: |-
              ComposerConfig is the public alias for the composer's optional clock and
              randomness source. Both clamp rather than refuse.
            name: ComposerConfig
            target: svcmail.ComposerConfig
      - alias:
          - doc: |-
              Composer is the public alias for the type that turns a [Message] into
              the RFC 5322 wire form without sending anything.
            name: Composer
            target: svcmail.Composer
      - var:
          - doc: |-
              HeaderInjection is returned when a header name or value carries CR, LF or
              NUL. It is a refusal and never a repair, and it names the field rather
              than the value.
            name: HeaderInjection
            reexport: coremail.HeaderInjection
            type: "*errs.Error"
          - doc: |-
              InvalidAddress is returned for an addr-spec outside the dot-atom subset
              of RFC 5322 §3.4.1 this domain accepts, or outside the RFC 5321 §4.5.3.1
              length limits.
            name: InvalidAddress
            reexport: coremail.InvalidAddress
            type: "*errs.Error"
          - doc: |-
              UnsupportedAddress is returned for a non-ASCII addr-spec (RFC 6531
              SMTPUTF8) or a quoted local part — both legal mail, both refused by name
              rather than transliterated into a deliverable but different address.
            name: UnsupportedAddress
            reexport: coremail.UnsupportedAddress
            type: "*errs.Error"
          - doc: MissingSender is returned for a message with no From mailbox.
            name: MissingSender
            reexport: coremail.MissingSender
            type: "*errs.Error"
          - doc: |-
              NoRecipients is returned when To, Cc and Bcc are all empty, before any
              socket is opened.
            name: NoRecipients
            reexport: coremail.NoRecipients
            type: "*errs.Error"
          - doc: |-
              EmptyBody is returned for a message with no text, no HTML and no
              attachment.
            name: EmptyBody
            reexport: coremail.EmptyBody
            type: "*errs.Error"
          - doc: |-
              ReservedHeader is returned when Headers names a field the composer owns —
              including Bcc, which is the injection arriving through the front door.
            name: ReservedHeader
            reexport: coremail.ReservedHeader
            type: "*errs.Error"
          - doc: |-
              InvalidAttachment is returned for an attachment with no filename, an
              unparseable media type, a malformed Content-ID, or an inline part in a
              message with no body to reference it.
            name: InvalidAttachment
            reexport: coremail.InvalidAttachment
            type: "*errs.Error"
          - doc: |-
              HeaderTooLong is returned when a header line exceeds the RFC 5322 §2.1.1
              limit of 998 octets and offers no whitespace to fold at. It is refused
              rather than truncated.
            name: HeaderTooLong
            reexport: coremail.HeaderTooLong
            type: "*errs.Error"
          - doc: ComposeFailed is returned when the MIME body could not be assembled.
            name: ComposeFailed
            reexport: coremail.ComposeFailed
            type: "*errs.Error"
          - doc: |-
              InvalidConfig is returned by [NewSMTP] for a configuration that cannot be
              honoured as written — including a [TLSUnset] mode.
            name: InvalidConfig
            reexport: coremail.InvalidConfig
            type: "*errs.Error"
          - doc: |-
              DialFailed is returned when the server could not be reached, or the
              context ended before the greeting.
            name: DialFailed
            reexport: coremail.DialFailed
            type: "*errs.Error"
          - doc: |-
              GreetingFailed is returned when the connection opened and the SMTP
              conversation did not.
            name: GreetingFailed
            reexport: coremail.GreetingFailed
            type: "*errs.Error"
          - doc: |-
              TLSRequired is returned when STARTTLS was required and the server never
              offered it. The session is ended, never downgraded.
            name: TLSRequired
            reexport: coremail.TLSRequired
            type: "*errs.Error"
          - doc: TLSFailed is returned when the handshake or the STARTTLS command failed.
            name: TLSFailed
            reexport: coremail.TLSFailed
            type: "*errs.Error"
          - doc: |-
              AuthInsecure is returned when credentials would have travelled over an
              unencrypted session — at construction, and again before AUTH.
            name: AuthInsecure
            reexport: coremail.AuthInsecure
            type: "*errs.Error"
          - doc: |-
              AuthFailed is returned when the server rejected the credentials or
              advertised no AUTH mechanism.
            name: AuthFailed
            reexport: coremail.AuthFailed
            type: "*errs.Error"
          - doc: |-
              SendRefused is returned when MAIL, RCPT or DATA was answered with a
              failure reply. The server's own text travels as a log-only field.
            name: SendRefused
            reexport: coremail.SendRefused
            type: "*errs.Error"
          - doc: |-
              InvalidURL is returned by [ParseURL] for a URL it cannot read. It names
              the clause and never the URL, which carries the password.
            name: InvalidURL
            reexport: coremail.InvalidURL
            type: "*errs.Error"
      - func:
          doc: |-
            NewCapture returns NewMemory's double keeping only the last keep deliveries
            — DefaultCaptureKeep when keep is not positive: the transport a development
            server and a test deliver through.
          forward: svcmail.NewCapture
          in:
            - name: keep
              type: int
          name: NewCapture
          out:
            - type: FullTransport
      - func:
          doc: |-
            ParseURL reads smtp://user:password@host:port?tls=starttls|implicit|none, or
            smtps://…, into an [SMTPConfig] that [NewSMTP] accepts; see the package
            documentation for the grammar and its defaults. On a refusal it returns the
            zero SMTPConfig and an error that never quotes the URL.
          forward: svcmail.ParseURL
          in:
            - name: raw
              type: string
          name: ParseURL
          out:
            - name: cfg
              type: SMTPConfig
            - name: err
              type: error
      - func:
          doc: |-
            NewSMTP returns a transport that delivers over SMTP, refusing at construction
            any configuration it could not honour — an unset TLS mode, an out-of-range
            port, or credentials it would have to send in the clear.

            It holds no pooled connection: it dials per send, and a caller that wants one
            session for many messages asks for it through [BatchSender].
          forward: svcmail.NewSMTP
          in:
            - name: cfg
              type: SMTPConfig
          name: NewSMTP
          out:
            - name: transport
              type: Transport
            - name: err
              type: error
      - func:
          doc: |-
            NewMemory returns a transport that composes every message and records the
            result instead of dialling anything — the double a consumer's tests wire in
            place of [NewSMTP].

            It takes no arguments on purpose: every knob it could offer is one a test has
            to set before it can assert anything, and the value of a double is that it
            costs one line.
          forward: svcmail.NewMemory
          name: NewMemory
          out:
            - type: FullTransport
      - func:
          doc: |-
            NewComposer returns a composer that renders a [Message] to the RFC 5322 wire form
            without sending it — for a caller that hands the bytes to something this SDK
            does not implement, or that wants a golden test over its own templates.

            A [ComposerConfig] with a fixed clock and a fixed randomness source makes
            composition byte-deterministic.
          forward: svcmail.NewComposer
          in:
            - name: cfg
              type: ComposerConfig
          name: NewComposer
          out:
            - type: "*Composer"
      - func:
          doc: |-
            Validate reports whether msg can be composed and sent, returning the first
            typed refusal it finds.

            It is exported so a caller can reject a message at the edge — where a form
            was submitted — rather than at the transport, and get the same verdict either
            way.
          forward: svcmail.Validate
          in:
            - name: msg
              type: Message
          name: Validate
          out:
            - type: error
      - func:
          doc: |-
            EnvelopeOf validates msg and derives the SMTP envelope a transport would
            issue for it: the From addr-spec as the return path, and every recipient —
            To, then Cc, then Bcc — as a RCPT TO. A blind recipient reaches the envelope
            and no header; that is the whole of Bcc in this package.

            It returns the first typed refusal [Validate] would, and the zero [Envelope]
            with it: an envelope built from an unvalidated message is a list of strings
            that may each carry a CRLF.
          forward: svcmail.Envelope
          in:
            - name: msg
              type: Message
          name: EnvelopeOf
          out:
            - name: envelope
              type: Envelope
            - name: err
              type: error
    functions:
      - in:
          - name: msg
            type: Message
        name: Compose
        out:
          - name: raw
            type: "[]byte"
          - name: err
            type: error
    imports:
      coremail: github.com/kitsunium/sdk/internal/core/app/mail
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcmail: github.com/kitsunium/sdk/internal/service/app/mail
    path: github.com/kitsunium/sdk/pkg/v1/app/mail
