    doc: |-
      Package mail — the mailbox value.

      Package mail — one file or inline part, as a value.

      Package mail — ranges 0.2.31.* (ADR 0064 core/app/mail block) and 0.3.61.*
      (ADR 0064 service/app/mail block, declared here since ADR 0160).

      Package mail — declares the sentinel *errs.Error outcomes of the domain: the
      refusals of a message, and the outcomes of composition and of the SMTP
      session. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.

      No Public string here carries a header VALUE, an address, a subject, an
      attachment's bytes, a credential or a server reply. A Public is read by third parties — it lands in an HTTP
      body, a queue's dead-letter record, a support ticket — and the values this
      domain refuses are, by construction, exactly the ones an attacker chose. The
      field NAME travels in Public where it helps; the value travels only as a
      log-only field, reachable through errs.FieldsOf.

      Package mail — the names of the header fields the composer owns, and one
      additional header as a value.

      Package mail declares the electronic-mail port: the message as a VALUE, the
      envelope derived from it, and the [Transport] that carries one.

      The domain's whole security posture is one sentence: a header that contains
      a carriage return or a line feed is REFUSED, never repaired. RFC 5322 §2.2
      makes a header field a name, a colon and a value terminated by CRLF, so a
      CRLF inside the value does not corrupt the field — it ENDS it and starts
      another one the caller never wrote. "Bcc: attacker@example.com" is then a
      perfectly well-formed header, and the mail is delivered to a party the sender
      cannot see in what it composed.

      Sanitising is the tempting answer and it is the wrong one. The standard
      library will do it silently for you — mime.QEncoding.Encode turns a CRLF into
      "=0D=0A", mime.FormatMediaType percent-escapes it — and in both cases the
      message that goes out is not the message the caller wrote, while the caller
      is told everything succeeded. This domain refuses instead, with a typed error
      that names the FIELD and never the value.

      The guards that enforce it — Validate and the per-field checks it runs —
      live in internal/service/app/mail with the composition of the MIME body and
      the SMTP transport that delivers it: checking a header, an address or an
      attachment against its grammar is a mechanism (ADR 0160). This package holds
      the values, the port, the header names and the refusals. Nothing here
      writes a byte to a socket.

      Code range: 0.2.31.* (ADR 0064).

      Package mail — the message as a value, and the envelope derived from it.

      Package mail — the transport port and its ADR 0039 capability siblings.

      They live apart from the value types because a port and a value change for
      different reasons: the port is FROZEN and the values are not.

      Package mail — one record of what a transport put on the wire.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/app/mail
    ports:
      - doc: |-
          Transport carries a message to whatever will deliver it. It is FROZEN at one
          method.

          One method, because "send this mail" is the only thing every transport can
          do. A capability that some transports have arrives as a SIBLING interface
          reached by type assertion, never as a second method (ADR 0039): pkg/v1/app/mail
          aliases this type, Go interfaces are structural, and a second method would
          break every downstream implementation at compile time with no deprecation
          window.

          Implementations MUST be safe for concurrent use.

          What a Transport does NOT promise is as important as what it does. A nil
          error means the message was ACCEPTED by the next hop — nothing more. It is
          not a promise of delivery, of inbox placement, or of the recipient existing:
          SMTP accepts responsibility hop by hop (RFC 5321 §6.1), and the hop that
          eventually refuses reports it in a bounce message hours later, to the
          envelope's return path, over a channel this port has no access to.

          It is named for the ROLE it plays rather than for its one method: "the SMTP
          transport" and "the in-memory transport" are the words this domain is
          discussed in, and a Sender would name the verb instead.

          IFACE-PLUGIN: the concrete transports stay unexported behind their
          constructors in internal/service/app/mail.
        methods:
          - doc: |-
              Send composes msg and hands it to the next hop.

              It validates before it dials: a message that cannot be composed is
              refused without opening a socket, so a header-injection attempt never
              reaches a server and never costs a connection.

              ctx bounds the whole attempt. A transport that cannot honour a deadline
              natively must still stop when ctx does — by severing its own connection
              if that is the only mechanism available — because a Send that outlives
              its context is a goroutine the caller believes it has cancelled.
            in:
              - name: ctx
                type: context.Context
              - name: msg
                type: MessageValue
            name: Send
            out:
              - type: error
        name: Transport
      - doc: |-
          BatchSender sends several messages over ONE session. It is the ADR 0039
          sibling of [Transport], reached by type assertion:

          	if batch, ok := transport.(mail.BatchSender); ok {
          		err = batch.SendBatch(ctx, notifications)
          	}

          It is a capability and not a method, because it is not one for every
          transport: an HTTP provider API has no session to reuse, and a transport
          that implemented it by looping would be advertising an optimisation it does
          not perform.

          The semantics of a partial failure are the reason this is not just a loop in
          the caller: SendBatch sends every message it can and returns the failures
          AGGREGATED with errors.Join, rather than stopping at the first. One bad
          recipient in a batch of five hundred must not silence the other four hundred
          and ninety-nine, and the caller still learns about it — errs.HasCode walks
          Unwrap() []error, so a joined error answers the same questions a single one
          does.
        methods:
          - doc: |-
              SendBatch sends every message in msgs and returns the joined failures.
              A nil error means every message was accepted.
            in:
              - name: ctx
                type: context.Context
              - name: msgs
                type: "[]MessageValue"
            name: SendBatch
            out:
              - type: error
        name: BatchSender
      - doc: |-
          Outbox exposes what a transport has been asked to send. It is the ADR 0039
          sibling that makes a test double a double rather than a stub:

          	if box, ok := transport.(mail.Outbox); ok {
          		sent := box.Sent()
          	}

          Only an in-memory transport implements it, and that is the point — a
          consumer's test asserts against this interface without importing the SDK's
          service layer, and a production transport that started implementing it would
          be a transport keeping every message it ever sent in memory.
        methods:
          - doc: |-
              Sent returns the deliveries recorded so far, oldest first. The returned
              slice and every byte slice in it are the caller's own copy.
            name: Sent
            out:
              - type: "[]DeliveryValue"
          - doc: Reset discards the record, so one test's messages are not another's.
            name: Reset
        name: Outbox
      - doc: |-
          FullTransport is the union the SDK's in-memory transport returns: a
          [Transport] that also batches and records.

          It exists for the same reason core/data/vfs.FullFS and core/observe/metrics.FullMeter do —
          the port stays frozen and the capabilities stay assertable for a THIRD-PARTY
          transport that has neither, while a caller wiring one of the SDK's own does
          not have to type-assert for a feature it just constructed. A parameter should
          still ask for the narrowest thing it uses.
        embeds:
          - Transport
          - BatchSender
          - Outbox
        name: FullTransport
    sentinels:
      - var:
          - code: CodeHeaderInjection
            doc: |-
              HeaderInjection is returned when a header name or value carries CR, LF
              or NUL.

              It is a REFUSAL and never a repair. mime.QEncoding.Encode would turn the
              CRLF into "=0D=0A" and mime.FormatMediaType would percent-escape it —
              both produce a deliverable message that is not the one the caller wrote,
              and both report success. A caller who learns nothing cannot fix the
              input, and the next message carries the same payload.

              The Public names no value. "Subject" is safe to say; the string an
              attacker put in it is not.
            name: HeaderInjection
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "core/app/mail: header name or value contains CR, LF or NUL — RFC 5322 §2.2 ends a field at CRLF, so the remainder would become headers the caller never wrote; refused, never sanitised"
            public: A message header contains a line break and was refused
            reason: HEADER_INJECTION
          - code: CodeInvalidAddress
            doc: |-
              InvalidAddress is returned for an addr-spec outside the dot-atom subset
              of RFC 5322 §3.4.1 this domain accepts, or outside the RFC 5321 §4.5.3.1
              octet limits (64 for the local part, 255 for the domain).
            name: InvalidAddress
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: addr-spec is empty, has no single @, carries a space, angle bracket or control byte, or exceeds the RFC 5321 §4.5.3.1 length limits"
            public: A mail address in that message is not usable
            reason: INVALID_ADDRESS
          - code: CodeMissingSender
            doc: MissingSender is returned for a Message whose From carries no address.
            name: MissingSender
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Message.From is the zero Address; RFC 5322 §3.6 makes the originator field mandatory and there is no defensible default"
            public: A message must name the mailbox it is from
            reason: MISSING_SENDER
          - code: CodeNoRecipients
            doc: |-
              NoRecipients is returned when To, Cc and Bcc are all empty.

              The refusal happens before any socket is opened. An SMTP session with no
              RCPT TO cannot succeed, so the only thing dialling first would buy is a
              slower, less specific failure.
            name: NoRecipients
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: To, Cc and Bcc are all empty, so the SMTP session would have no RCPT TO to issue"
            public: A message must name at least one recipient
            reason: NO_RECIPIENTS
          - code: CodeEmptyBody
            doc: |-
              EmptyBody is returned for a Message with no text, no HTML and no
              attachment — ADR 0031's refusing half, applied to content.
            name: EmptyBody
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Text, HTML and Attachments are all empty; a zero body is an unfilled struct rather than a decision to send nothing"
            public: A message must carry text, HTML or an attachment
            reason: EMPTY_BODY
          - code: CodeReservedHeader
            doc: |-
              ReservedHeader is returned when Message.Headers names a field the
              composer owns.

              Two different failures share this refusal. Emitting From, Date or Subject
              twice violates RFC 5322 §3.6, which permits exactly one of each, and
              leaves every receiver free to pick a different one. And spelling "Bcc"
              by hand is the injection this domain exists to stop, arriving through the
              front door instead.
            name: ReservedHeader
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: Headers names a composer-owned field (From, To, Cc, Bcc, Reply-To, Subject, Date, Message-ID, MIME-Version or a Content-* field)"
            public: That header is set by the mail composer and cannot be overridden
            reason: RESERVED_HEADER
          - code: CodeInvalidAttachment
            doc: |-
              InvalidAttachment is returned for an attachment the composer cannot
              render: no filename, an unparseable media type, a malformed Content-ID,
              or an inline part in a message with no body for its cid: to be
              referenced from.
            name: InvalidAttachment
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: attachment has no filename, an unparseable media type, a Content-ID outside the RFC 2392 §2 grammar, or is inline in a message with no text or HTML body to reference it"
            public: An attachment on that message is not usable
            reason: INVALID_ATTACHMENT
          - code: CodeHeaderTooLong
            doc: |-
              HeaderTooLong is returned when a header line cannot be folded under the
              RFC 5322 §2.1.1 hard limit of 998 octets.

              Folding inserts CRLF before existing whitespace (§2.2.3) — unfolding
              removes the CRLF and keeps the whitespace, so the value survives exactly.
              A token with no whitespace in it has no legal fold point, and truncating
              it would deliver a different value while reporting success.
            name: HeaderTooLong
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/app/mail: a header line exceeds the RFC 5322 §2.1.1 limit of 998 octets and contains no whitespace to fold at; refused rather than truncated"
            public: A message header is too long to fold and was refused
            reason: HEADER_TOO_LONG
          - code: CodeUnsupportedAddress
            doc: |-
              UnsupportedAddress is returned for a non-ASCII addr-spec (RFC 6531
              SMTPUTF8) or a quoted local-part.

              Both are legal mail. Neither is carried here, and saying so BY NAME is
              the point: SMTPUTF8 must be negotiated with the server, net/smtp does
              not negotiate it, and the alternative to refusing is punycoding a domain
              or dropping accents from a local part — which delivers, silently, to a
              different mailbox.
            name: UnsupportedAddress
            options:
              - errs.WithExitCode(exitUnavailable)
            private: "core/app/mail: non-ASCII addr-spec (RFC 6531 SMTPUTF8) or quoted local-part; refused by name rather than transliterated into a deliverable but different address"
            public: That address form is not supported by this mail transport
            reason: UNSUPPORTED_ADDRESS
          - code: CodeComposeFailed
            doc: |-
              ComposeFailed is returned when the MIME body could not be assembled.

              It is deliberately rare: everything a caller can get wrong is refused by
              the message guards with a specific verdict, so reaching this one means
              an encoder or a media-type parser refused something those guards
              accepted — which is a defect in the composer, not in the caller's
              message.
            name: ComposeFailed
            note: |-
              The outcomes of composition and of the SMTP session, raised by
              internal/service/app/mail. They are declared here, with the message
              refusals, so that the domain's codes and sentinels are in one place
              (ADR 0160). A server's reply text is third-party data of unbounded length
              that this SDK did not write; it travels as a log-only field and never into
              a message a caller might render.
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/app/mail: a MIME encoder, a multipart writer or mime.ParseMediaType refused input the core/app/mail guards accepted — the cause travels as a field"
            public: The message could not be assembled into a MIME body
            reason: COMPOSE_FAILED
          - code: CodeInvalidConfig
            doc: |-
              InvalidConfig is returned by the SMTP constructor for a configuration
              that cannot be honoured as written.

              The zero TLSMode is the interesting member. It is REFUSED rather than
              read as a default, because both candidate defaults are wrong: choosing
              encryption silently breaks every caller pointing at a plaintext relay on
              a private network, and choosing none silently ships credentials in the
              clear for everyone else. ADR 0031's refusing half, applied where the
              SDK genuinely cannot know.
            name: InvalidConfig
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/mail: empty Host, Port outside 1-65535, or TLS left at its zero value — the zero is refused because neither 'encrypt' nor 'do not' is a safe guess (ADR 0031)"
            public: The SMTP transport configuration is not usable as written
            reason: INVALID_CONFIG
          - code: CodeDialFailed
            doc: |-
              DialFailed is returned when the TCP connection was never established, or
              was severed by the caller's context before the greeting.
            name: DialFailed
            options:
              - errs.WithExitCode(exitNoHost)
            private: "service/app/mail: TCP dial failed, timed out, or the context was cancelled before the SMTP greeting; the dial error travels as a field"
            public: The mail server could not be reached
            reason: DIAL_FAILED
          - code: CodeGreetingFailed
            doc: |-
              GreetingFailed is returned when the connection opened and the SMTP
              conversation did not: a refused greeting, a refused EHLO, a QUIT the
              server never acknowledged.
            name: GreetingFailed
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/app/mail: the 220 greeting, the EHLO/HELO exchange or the closing QUIT was refused or malformed; the server reply travels as a field"
            public: The mail server did not accept the SMTP conversation
            reason: GREETING_FAILED
          - code: CodeTLSRequired
            doc: |-
              TLSRequired is returned when the transport is configured for STARTTLS
              and the server never advertised it.

              This is the defect the domain refuses to have. "Opportunistic STARTTLS"
              — encrypt if offered, continue in the clear if not — is the shape almost
              every mail library ships, and it means an active attacker strips the
              advertisement and reads everything, including the credentials, while the
              caller's logs show a successful send. There is no configuration here
              that produces that behaviour, and adding one is not a feature request.
            name: TLSRequired
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: TLSStartTLS was configured and the EHLO response advertised no STARTTLS extension; refused, never downgraded to cleartext"
            public: The mail server did not offer the encryption this transport requires
            reason: TLS_REQUIRED
          - code: CodeTLSFailed
            doc: |-
              TLSFailed is returned when STARTTLS or the implicit handshake was
              attempted and did not complete: a refused command, an untrusted chain, a
              name that does not match.
            name: TLSFailed
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: the STARTTLS command was refused, or the TLS handshake failed on trust, name or version; the handshake error travels as a field"
            public: The connection to the mail server could not be encrypted
            reason: TLS_FAILED
          - code: CodeAuthInsecure
            doc: |-
              AuthInsecure is returned when credentials were configured for a session
              that is not encrypted — at CONSTRUCTION when TLS is disabled outright,
              and again before the AUTH command when the session turned out not to be
              encrypted after all.

              The second check is not redundant, and net/smtp is the reason. Its
              PlainAuth carves out an exception for a server named localhost —
              "isLocalhost(server.Name)" — and sends the password in the clear to it.
              That is defensible for the stdlib's audience and indefensible for a
              transport in a container, where the relay one hop away IS 127.0.0.1 and
              the network between them is a bridge somebody else can join.
            name: AuthInsecure
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: Username is set on a session that is not encrypted; refused before the AUTH command is written, including for a localhost relay where net/smtp.PlainAuth would have sent it"
            public: Credentials cannot be sent over an unencrypted mail session
            reason: AUTH_INSECURE
          - code: CodeAuthFailed
            doc: |-
              AuthFailed is returned when the server rejected the credentials, or
              advertised no AUTH mechanism to offer them through.
            name: AuthFailed
            options:
              - errs.WithExitCode(exitNoPerm)
            private: "service/app/mail: the AUTH exchange was refused, or the EHLO response advertised no AUTH extension; the server reply travels as a field and the credential never leaves this process's memory"
            public: The mail server rejected the credentials
            reason: AUTH_FAILED
          - code: CodeSendRefused
            doc: |-
              SendRefused is returned when MAIL, RCPT or DATA was answered with a
              failure reply.

              It carries the SMTP reply as a log-only field, never as Public: a reply
              is third-party text of unbounded length that may name a recipient, and
              Public is the half that travels to strangers.
            name: SendRefused
            options:
              - errs.WithExitCode(exitTempFail)
            private: "service/app/mail: MAIL FROM, RCPT TO or DATA was answered with a failure reply; the command and the server's reply travel as log-only fields"
            public: The mail server refused the message
            reason: SEND_REFUSED
          - code: CodeInvalidURL
            doc: |-
              InvalidURL is returned by ParseURL for a URL it cannot read. It names the
              clause that failed and NEVER the URL: an SMTP URL carries the password
              in its userinfo, and every part of it — the host, the port, a parameter
              name — is quoted by no refusal, because a URL that failed to parse is
              exactly the one whose parts are not where they should be.
            name: InvalidURL
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/app/mail: ParseURL refused the URL; the problem field names the clause, and the URL itself is never repeated because it carries the password"
            public: The SMTP URL is not usable as written
            reason: INVALID_URL
    types:
      - decl: true
        doc: |-
          AddressValue is one RFC 5322 mailbox: an addr-spec and an optional display
          name.

          It is deliberately NOT net/mail.Address, and the reason is measurable rather
          than aesthetic. net/mail.Address.String() emits its Address field verbatim:

          	mail.Address{Name: "ok", Address: "u@exa\r\nmple.com"}.String()
          	  == "\"ok\" <u@exa\r\nmple.com>"

          The CRLF survives into the header, which is the injection this whole domain
          exists to refuse. The display name is protected there (it is RFC 2047
          encoded, so a CRLF becomes "=0D=0A") and the address is not — so a caller who
          reached for the obvious stdlib helper would be protected on the field an
          attacker rarely controls and exposed on the one they usually do.
        methods:
          - doc: |-
              IsZero reports whether the address carries no addr-spec at all, which is the
              zero value a caller gets from an unfilled struct field.
            name: IsZero
            out:
              - type: bool
            recv: value
        name: AddressValue
        struct:
          fields:
            - doc: |-
                Name is the optional display name. It may hold any printable text,
                including non-ASCII, which is RFC 2047 encoded at composition. CR, LF and
                NUL are refused.
              name: Name
              type: string
            - doc: |-
                Addr is the addr-spec: "local@domain", ASCII, in the dot-atom form of
                RFC 5322 §3.4.1. Angle brackets are added by the composer and must not
                appear here.
              name: Addr
              type: string
      - decl: true
        doc: |-
          AttachmentValue is one MIME body part carrying a file.

          The distinction between an attachment and an inline image is ONE field.
          A non-empty ContentID makes the part inline: it is placed in a
          multipart/related alongside the body (RFC 2387) and referenced from the HTML
          as cid:<ContentID> (RFC 2392 §2). An empty one makes it a regular attachment
          in a multipart/mixed (RFC 2046 §5.1.3).

          That is why there is no Disposition field to set wrongly. The disposition and
          the enclosing multipart subtype are two halves of one decision, and letting a
          caller spell them separately is letting them disagree — which is exactly the
          message that renders as a broken image in one client and a stray attachment
          in another.
        methods:
          - doc: |-
              Inline reports whether this part is referenced from the body rather than
              listed as a file.
            impl: inline
            name: Inline
            out:
              - type: bool
            recv: pointer
        name: AttachmentValue
        struct:
          fields:
            - doc: |-
                Filename is the name presented to the recipient. It is required: an
                attachment with no name is a part a client shows as "noname", and the
                SDK will not invent one.
              name: Filename
              type: string
            - doc: |-
                ContentType is the media type. Empty selects the type implied by the
                filename's extension, and [DefaultAttachmentType] when there is none.
              name: ContentType
              type: string
            - doc: |-
                ContentID, when non-empty, makes this part INLINE and referenceable as
                cid:<ContentID>. It is an addr-spec-shaped token (RFC 2045 §7), written
                without angle brackets — the composer adds them.
              name: ContentID
              type: string
            - doc: |-
                Content is the part's bytes, base64 encoded at composition (RFC 2045
                §6.8). An empty slice is a legal zero-length attachment.
              name: Content
              type: "[]byte"
      - decl: true
        doc: |-
          HeaderFieldValue is one additional header: a name and a value.

          It is a slice element rather than a map entry for two reasons that both
          matter: a map iterates in a random order, so the same message would compose
          to different bytes on different runs and no golden test could exist; and
          some fields legitimately repeat (Received, References), which a map cannot
          express at all.
        name: HeaderFieldValue
        struct:
          fields:
            - doc: |-
                Name is the field name — printable US-ASCII without a colon
                (RFC 5322 §3.6.8).
              name: Name
              type: string
            - doc: |-
                Value is the unstructured field value. It is encoded per RFC 2047 when it
                carries non-ASCII, folded to the RFC 5322 §2.1.1 line limits, and refused
                outright when it carries CR, LF or NUL.
              name: Value
              type: string
      - decl: true
        doc: |-
          MessageValue is one mail, as a value. It is deliberately a struct and not an
          interface: a message has no behaviour worth abstracting, it is data, and a
          value can be built in a literal, compared field by field in a test, and
          carried across a goroutine without a lock.

          Nothing here is a wire format. The MIME structure the fields imply is chosen
          by the composer in internal/service/app/mail, and which parts appear is a pure
          function of which fields are populated — see that package's CLAUDE.md for
          the table.

          Every string field that reaches a header is validated by the guards in
          internal/service/app/mail, which every transport runs before composing. The
          slices are never mutated by this package.
        name: MessageValue
        struct:
          fields:
            - doc: |-
                Date is the origination date (RFC 5322 §3.6.1), which is REQUIRED in a
                message. A zero Date is stamped by the composer from its clock rather
                than refused: unlike a file mode, there is exactly one defensible value
                and it is "now" (ADR 0031's clamping half).
              name: Date
              type: time.Time
            - doc: |-
                From is the author mailbox (RFC 5322 §3.6.2). Exactly one is supported;
                the multi-author form requires a Sender header to disambiguate and no
                caller has ever wanted it by accident.
              name: From
              type: AddressValue
            - doc: |-
                Subject is the unstructured subject field (RFC 5322 §3.6.5). Non-ASCII
                content is encoded per RFC 2047 at composition; a CR or LF here is
                [HeaderInjection].
              name: Subject
              type: string
            - doc: |-
                MessageID is the optional Message-ID (RFC 5322 §3.6.4), angle brackets
                included or omitted at the caller's choice — the composer adds them.

                An empty MessageID emits NO header. RFC 6409 §8.2 makes adding one the
                submission server's job when it is absent, and generating one here would
                mean inventing both entropy and a domain the SDK does not own.
              name: MessageID
              type: string
            - doc: ReplyTo is the optional Reply-To mailbox list (RFC 5322 §3.6.2).
              name: ReplyTo
              type: "[]AddressValue"
            - doc: To is the primary recipient list (RFC 5322 §3.6.3).
              name: To
              type: "[]AddressValue"
            - doc: Cc is the carbon-copy recipient list (RFC 5322 §3.6.3).
              name: Cc
              type: "[]AddressValue"
            - doc: |-
                Bcc is the blind carbon-copy list. It reaches the ENVELOPE — the
                [EnvelopeValue] internal/service/app/mail derives — and never a header.
              name: Bcc
              type: "[]AddressValue"
            - doc: |-
                Headers are additional fields, emitted in slice order so a composed
                message is byte-deterministic. A name the composer owns is
                [ReservedHeader].
              name: Headers
              type: "[]HeaderFieldValue"
            - doc: Text is the text/plain body.
              name: Text
              type: string
            - doc: |-
                HTML is the text/html body. With Text it becomes a multipart/alternative
                in which the plain part comes FIRST — RFC 2046 §5.1.4 orders alternatives
                by increasing preference, so the last one is the one a client shows.
              name: HTML
              type: string
            - doc: |-
                Attachments are the file parts. One carrying a ContentID is INLINE and is
                referenced from the HTML body as cid:<ContentID> (RFC 2392 §2).
              name: Attachments
              type: "[]AttachmentValue"
      - decl: true
        doc: |-
          DeliveryValue is one record of what a transport actually put on the wire.

          It carries the composed BYTES and not the message, because those are two
          different assertions. A test that checks the message checks what it itself
          built a moment earlier; a test that checks Raw checks what the composer
          produced — the encoded subject, the multipart structure, the absence of a
          Bcc header — which is the only half that can be wrong.
        name: DeliveryValue
        struct:
          fields:
            - doc: Envelope is the MAIL FROM and the RCPT TO list the session would issue.
              name: Envelope
              type: EnvelopeValue
            - doc: |-
                Raw is the RFC 5322 message: headers, blank line, MIME body, CRLF line
                endings throughout.
              name: Raw
              type: "[]byte"
      - decl: true
        doc: |-
          EnvelopeValue is what an SMTP session actually carries: one MAIL FROM and one
          or more RCPT TO (RFC 5321 §3.3). It is NOT the header block, and the
          difference is the whole reason this type exists.

          A receiving MTA routes on the envelope and never on the headers. To, Cc and
          Bcc are text a client renders; the envelope is the delivery instruction. They
          agree by convention and not by protocol, which is how a Bcc can exist at all
          — and how a forwarding rule can deliver a message to somebody who appears in
          no header.
        name: EnvelopeValue
        struct:
          fields:
            - doc: |-
                From is the return path (RFC 5321 §4.1.1.2): where a bounce goes. It is
                the message's From addr-spec.
              name: From
              type: string
            - doc: |-
                To is every RCPT TO the session will issue, in To, Cc, Bcc order. Bcc
                recipients appear HERE and in no header.
              name: To
              type: "[]string"
  - constants:
      - doc: |-
          DefaultCaptureKeep is how many deliveries [NewCapture] keeps when it is
          given a non-positive number: enough for a person to scroll a mailbox, and a
          bound on the memory a development server holds for mail nobody will read.
        name: DefaultCaptureKeep
        type: int
        value: "200"
      - doc: TLSUnset is the zero value and is refused at construction.
        name: TLSUnset
        type: TLSMode
        value: "0"
      - doc: |-
          TLSStartTLS connects in the clear, sends EHLO, and REQUIRES the server
          to advertise STARTTLS (RFC 3207). A server that does not is refused with
          [coremail.TLSRequired] — the session is never continued unencrypted. This is the
          submission port 587 shape.
        name: TLSStartTLS
        type: TLSMode
        value: "1"
      - doc: |-
          TLSImplicit negotiates TLS before the SMTP greeting, which RFC 8314 §3.3
          recommends over STARTTLS because there is no plaintext phase for an
          attacker to interfere with. This is the submissions port 465 shape.
        name: TLSImplicit
        type: TLSMode
        value: "2"
      - doc: |-
          TLSDisabled sends everything in the clear, and must be spelled out loud.
          It exists for a relay on a loopback or a private segment where TLS is
          somebody else's layer. Credentials are REFUSED with it at construction:
          there is no combination of settings in this package that sends a
          password over an unencrypted socket.
        name: TLSDisabled
        type: TLSMode
        value: "3"
    doc: |-
      Package mail — the addr-spec subset this domain accepts, and the display-name
      rule the composer depends on.

      Package mail — the attachment guards.

      Package mail — the composition helpers: media types, part construction, and
      the size estimate that keeps the output buffer to one allocation.

      Package mail — the composer: a message value in, RFC 5322 wire bytes out.

      Package mail — the composer's optional wiring.

      Package mail — the per-message build state, and the MIME structure it
      assembles.

      Package mail — the MIME entity tree and the writer that renders it.

      The renderer emits the multipart delimiters itself rather than using
      mime/multipart.Writer, and the reason is one measured line of that package:
      Writer.CreatePart formats header values VERBATIM, so a Content-Disposition
      carrying "a\r\nBcc: x@y" is emitted with the injected header intact. Every
      header written here goes through writeHeader, which runs the injection gate
      at the point of writing.

      The parser is the standard library's and always will be — mime/multipart's
      Reader is what the tests reparse composed messages with, because a test that
      decodes with the same code that encoded preserves exactly the bug it exists
      to catch.

      Package mail — the SMTP envelope, derived from a message after validating it.

      Package mail — the one helper through which this package raises a sentinel
      over a cause. The domain's codes and sentinels — the message refusals, and
      the outcomes of composition and of the SMTP session — are declared in
      internal/core/app/mail (ADR 0160).

      Package mail — the header grammar, and the injection gate every writer in
      this domain runs before a byte reaches a buffer.

      Package mail — RFC 2047 encoding and RFC 5322 folding for header lines.

      Package mail — the fixed-width line breaker every base64 body streams
      through.

      Package mail — the in-memory transport, which is a DOUBLE and not a stub.

      Package mail — one open SMTP conversation.

      Package mail — the SMTP transport.

      It is built ON net/smtp and does not reimplement RFC 5321. The package is
      FROZEN upstream — its own documentation says "The smtp package is frozen and
      is not accepting new features" — which is a statement about features and not
      about maintenance: it still receives security fixes, and the protocol it
      implements has not gained a feature this domain wants since RFC 3207.

      What this package therefore commits to maintaining is the POLICY above it,
      which is where every decision that matters lives: that a required STARTTLS
      is refused rather than downgraded, that credentials never travel over an
      unencrypted session, that the verified TLS name is set (net/smtp does not set
      it), and that a context actually stops a send (net/smtp has no context at
      all). If net/smtp is ever deprecated rather than frozen, the client is
      replaced here and [coremail.Transport] does not change — which is the reason
      the port has one method and no session on it.

      Package mail — compile-time port conformance for the two transports.

      These assertions live apart from the implementations because a failure here
      is a statement about the PORT, not about a function.

      Package mail — the SMTP transport's configuration, and its zero value.

      Package mail — how an SMTPConfig renders: every rendering the password could
      leak through writes the placeholder instead.

      Package mail — reading an SMTP URL into an SMTPConfig.

      Package mail — the one whole-message guard both transports run.
    functions:
      - doc: |-
          ValidateAddress reports whether a is a mailbox this domain will carry, and
          returns a typed refusal naming field — "From", "To[1]", "Cc[0]" — when it is
          not.

          The accepted grammar is a deliberate SUBSET of RFC 5322 §3.4.1: an ASCII
          dot-atom local part, one "@", and an ASCII dot-atom domain, inside the
          RFC 5321 §4.5.3.1 length limits. Two legal forms are refused BY NAME rather
          than mangled:

            - A quoted local part (`"john doe"@example.com`) is legal RFC 5322 and is
              refused, because quoting and unquoting it correctly through a display
              name, an envelope and a log line is four chances to get it wrong for a
              form essentially nobody uses.
            - A non-ASCII addr-spec (RFC 6531 SMTPUTF8) is refused because SMTPUTF8
              must be negotiated with the server and net/smtp does not negotiate it.
              The alternatives are worse than a refusal: punycoding the domain or
              stripping accents from the local part both produce an address that
              delivers, to somebody else.
        in:
          - name: field
            type: string
          - name: a
            type: coremail.AddressValue
        name: ValidateAddress
        out:
          - type: error
      - doc: |-
          IsDotAtom reports whether s is an RFC 5322 §3.2.3 dot-atom-text: one or more
          atoms of atext separated by single dots, with no leading, trailing or
          doubled dot. atext is printable ASCII that is neither a special nor a space,
          so a CR, an LF, a NUL, a non-ASCII byte and an invalid UTF-8 sequence all
          fall outside it.

          It is exported because the grammar is not the address's alone: the left
          half of a Message-ID (RFC 5322 §3.6.4, id-left) is written in it too, and the
          spool, which builds one from an identifier, checks the identifier here — the
          grammar's one home (ADR 0141, ADR 0160).
        in:
          - name: s
            type: string
        name: IsDotAtom
        out:
          - type: bool
      - doc: |-
          NeedsQuotedDisplayName reports whether name must be emitted as an RFC 5322
          §3.2.4 quoted-string rather than as a bare sequence of atoms.

          It is a property of the GRAMMAR, not of the writer, so it sits with the
          address guards rather than inside the composer. Getting it wrong is the
          classic address bug: an unquoted "Doe, John" makes the comma a list
          separator, so a message to one person is parsed as a message to two, one of
          which is not an address at all.
        in:
          - name: name
            type: string
        name: NeedsQuotedDisplayName
        out:
          - type: bool
      - doc: |-
          ValidateAttachment reports whether a can be composed into a body part, and
          returns [coremail.InvalidAttachment] naming the position when it cannot.

          The filename faces the injection gate like any other header value, because
          it lands in Content-Disposition. mime.FormatMediaType would silently
          percent-escape a CRLF there — the same "repair the caller never hears about"
          this domain refuses everywhere else.
        in:
          - name: field
            type: string
          - name: a
            type: "*coremail.AttachmentValue"
        name: ValidateAttachment
        out:
          - type: error
      - doc: NewComposer returns a composer wired from cfg.
        in:
          - name: cfg
            type: ComposerConfig
        name: NewComposer
        out:
          - type: "*Composer"
      - doc: |-
          Envelope derives the SMTP envelope from the message, after validating it.

          Bcc is the point. RFC 5322 §3.6.3 describes three permissible treatments of
          a Bcc field, and this domain takes the one that cannot leak: the addresses
          reach RCPT TO and the header is never written. The other two — sending each
          Bcc recipient their own copy carrying only their own Bcc line, or sending the
          header intact to everyone — are either N messages the caller did not ask for
          or a disclosure RFC 5321 §7.2 warns about explicitly.

          The recipient order is To, then Cc, then Bcc, and it is deterministic so a
          test can assert on it. Duplicates are NOT removed: an address listed in both
          To and Cc is two RCPT TO commands, which every MTA collapses into one
          delivery, and removing them here would mean deciding that two addresses that
          differ only in case are the same mailbox — a judgement only the receiving
          domain is entitled to make.
        in:
          - name: m
            type: coremail.MessageValue
        name: Envelope
        out:
          - name: envelope
            type: coremail.EnvelopeValue
          - name: err
            type: error
      - doc: |-
          IsReservedHeader reports whether name is a field the composer emits itself,
          comparing case-insensitively, as RFC 5322 requires of a field name.
        in:
          - name: name
            type: string
        name: IsReservedHeader
        out:
          - type: bool
      - doc: |-
          ValidateHeaderName reports whether name is a usable field name and returns a
          typed refusal when it is not.

          RFC 5322 §3.6.8 defines a field name as one or more printable US-ASCII
          characters other than the colon. Anything else — a space, a control byte, a
          non-ASCII rune, an embedded colon — would produce a line no receiver parses
          as the caller intended, and an embedded CRLF would produce two fields.
        in:
          - name: name
            type: string
        name: ValidateHeaderName
        out:
          - type: error
      - doc: |-
          ValidateHeaderValue reports whether value may be emitted under the field
          called name, and returns [coremail.HeaderInjection] when it may not.

          This is the gate the whole domain rests on. A header field ends at CRLF
          (RFC 5322 §2.2), so a CR or an LF inside a value does not corrupt the field
          — it TERMINATES it, and every octet after it becomes new header lines. A
          subject of "Hi\r\nBcc: attacker@example.com" is not a malformed subject; it
          is a well-formed subject followed by a well-formed blind-copy field, and the
          message is delivered to a party the sender never saw.

          A bare CR and a bare LF are refused as well as the pair, because receivers
          disagree about them — some normalise a lone LF to CRLF, which reconstructs
          the attack downstream from an input that looked survivable here.

          The refusal names the FIELD and never the value. The value is, by
          construction, the string an attacker chose, and a Public message travels
          places the SDK does not control.
        in:
          - name: name
          - name: value
            type: string
        name: ValidateHeaderValue
        out:
          - type: error
      - doc: |-
          ValidateHeader runs [ValidateHeaderName] and [ValidateHeaderValue] over one
          caller-supplied field and refuses a name the composer owns.
        in:
          - name: field
            type: coremail.HeaderFieldValue
        name: ValidateHeader
        out:
          - type: error
      - doc: |-
          NewMemory returns a transport that composes every message and keeps the
          result instead of dialling anything.

          It COMPOSES, and that is the whole design. A stub that recorded the Message
          value would accept a subject carrying a CRLF, an inline attachment with no
          body, a Bcc the caller expected in a header — every refusal the SMTP
          transport makes, made nowhere — and a consumer's test suite would pass right
          up until production. Because this transport runs the same composer, a message
          refused in production is refused in the test that was supposed to catch it,
          with the same typed error.

          It takes no arguments for the same reason core/data/vfs.NewMem does: every knob it
          could offer is one a consumer's test must set before it can assert anything,
          and the value of a double is that it costs one line.

          Safe for concurrent use.
        name: NewMemory
        out:
          - type: coremail.FullTransport
      - doc: |-
          NewCapture returns the transport a development server and a test deliver
          through: NewMemory's double — it composes every message, refuses what SMTP
          refuses, dials nothing — keeping only the last keep deliveries, the oldest
          dropped first. Sent reads them, raw bytes included, for a mailbox to show or
          a test to read a link from; Reset empties it.

          NewMemory keeps everything, which is what a test that sends three messages
          wants; a server that runs for days and captures every mail it would have
          sent needs a bound. A non-positive keep is [DefaultCaptureKeep]: its zero
          has one reading, "I did not think about it", and a mailbox of the last two
          hundred is the answer that needs no explanation (ADR 0031).
        in:
          - name: keep
            type: int
        name: NewCapture
        out:
          - type: coremail.FullTransport
      - doc: |-
          NewSMTP returns a transport that delivers over SMTP, refusing at
          CONSTRUCTION any configuration it could not honour.

          Construction-time refusal is the point. A transport whose TLS mode is unset,
          or that carries a password it may not send, is a misconfiguration whose
          symptom would otherwise be a failed send at three in the morning — while the
          fix is one line in the wiring, where this error is raised.

          It deliberately holds NO pooled connection. An SMTP session is stateful, a
          pooled one must be revalidated with a NOOP before every reuse (a server may
          have closed it minutes ago and the socket will not say so until a write
          fails), and the caller that wants one session for many messages already has
          a supported way to ask: [coremail.BatchSender].
        in:
          - name: cfg
            type: SMTPConfig
        name: NewSMTP
        out:
          - name: transport
            type: coremail.Transport
          - name: err
            type: error
      - doc: |-
          ParseURL reads an SMTP URL into an SMTPConfig that [NewSMTP] accepts:

          	smtp://user:password@host:587?tls=starttls|implicit|none
          	smtps://user:password@host:465

          The scheme sets the default mode — smtp:// is STARTTLS, the direction that
          fails loudly (TLS_REQUIRED) against a server that cannot encrypt rather than
          sending in the clear; smtps:// is implicit TLS — and the tls parameter
          overrides it, except that smtps:// may only repeat "implicit": a URL that
          says both is a contradiction, refused rather than resolved. A plaintext
          session must be spelled tls=none. The port defaults by mode (587, 465, 25)
          and must be 1–65535. The userinfo is optional and percent-decoded, so a
          password with reserved characters is written %40 for "@".

          The result is checked exactly as NewSMTP checks a configuration, so a URL
          with credentials and tls=none fails here with [coremail.AuthInsecure] rather than at
          construction. On any failure it returns the zero SMTPConfig.

          A refusal is [coremail.InvalidURL] with a clause, and it NEVER quotes the URL or any
          part of it — the userinfo is the password, and a URL that failed to parse is
          the one whose parts are not where they should be. url.Parse's own message
          quotes its input and is therefore dropped.
        in:
          - name: raw
            type: string
        name: ParseURL
        out:
          - name: cfg
            type: SMTPConfig
          - name: err
            type: error
      - doc: |-
          Validate reports whether m can be composed and sent, and returns the first
          typed refusal it finds.

          It is the one guard BOTH transports run, and that is what makes the
          in-memory one a faithful double: a message the SMTP transport would refuse is
          refused identically by the memory transport, in a test, before anybody
          deploys. It is exported because the spool runs it at Send, and the facade
          publishes it for a caller that refuses a message at the edge.

          It stops at the FIRST problem rather than collecting every one. That is the
          opposite of what the validation domain does (ADR 0046) and it is deliberate:
          a validation report describes a form a human will fix field by field, while
          this is a security gate, and a gate that keeps evaluating a message it has
          already decided to refuse is a gate doing work an attacker chose for it.
        in:
          - name: m
            type: coremail.MessageValue
        name: Validate
        out:
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coremail: github.com/kitsunium/sdk/internal/core/app/mail
      corenet: github.com/kitsunium/sdk/internal/core/net
    path: github.com/kitsunium/sdk/internal/service/app/mail
    types:
      - decl: true
        doc: |-
          Composer turns a [coremail.MessageValue] into the wire bytes a transport
          sends. It is safe for concurrent use and holds no state between messages.
        methods:
          - doc: |-
              Compose validates msg and renders it as one RFC 5322 message: the header
              block, an empty line, and the MIME body.

              The MIME structure is a pure function of which fields are populated, and
              picking it wrongly is how a message renders as raw HTML in one client and as
              an empty body in another:

              	text only                      → text/plain
              	HTML only                      → text/html
              	text + HTML                    → multipart/alternative(plain, html)
              	body + inline parts            → multipart/related(body, inline…)
              	body + attachments             → multipart/mixed(body, attachment…)
              	body + inline + attachments    → multipart/mixed(multipart/related(…), attachment…)

              No container is emitted for a single child. A multipart/alternative with one
              alternative and a multipart/mixed with one part are both legal and both are
              noise, and the second one makes some clients show a paperclip on a message
              with no attachment.

              Inside multipart/alternative the PLAIN part comes first. RFC 2046 §5.1.4
              orders alternatives "in increasing order of preference" and tells a receiver
              to display the last one it understands — so a composer that writes HTML
              first has just asked every client to show the plain text.
            in:
              - name: msg
                type: coremail.MessageValue
            name: Compose
            out:
              - name: raw
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
        name: Composer
        struct:
          fields:
            - name: clock
              type: clock.Clock
            - name: random
              type: io.Reader
      - decl: true
        doc: |-
          ComposerConfig configures a [Composer].

          Both fields are optional and both CLAMP rather than refuse, because unlike a
          TLS mode there is exactly one defensible value for each (ADR 0031's clamping
          half): the system clock, and crypto/rand.
        name: ComposerConfig
        struct:
          fields:
            - doc: |-
                Clock supplies the Date header for a message that carries no explicit
                one. Nil selects the system clock; a ManualClock makes composition
                byte-deterministic, which is what the golden tests use.
              name: Clock
              type: clock.Clock
            - doc: |-
                Rand supplies the randomness behind multipart boundaries. Nil selects
                crypto/rand.
              name: Rand
              type: io.Reader
      - decl: true
        doc: |-
          TLSMode selects how the session is encrypted. Its ZERO VALUE IS REFUSED.

          That refusal is the security decision of this package. Every other choice
          would be wrong for somebody: defaulting to encryption breaks the caller
          pointing at a plaintext relay inside a private network, and defaulting to
          none ships every other caller's credentials in the clear. ADR 0031 admits a
          clamp where one value needs no explanation and demands a refusal where any
          SDK-chosen value would be arbitrary; this is unambiguously the second.

          There is deliberately NO opportunistic mode — "encrypt if the server offers
          it, continue in the clear if it does not". It is the shape most mail
          libraries ship and it means an active attacker who strips one line from the
          EHLO response reads the whole session, credentials included, while the
          sender's logs show a successful delivery. It cannot be configured here
          because it is not implemented, not because it is off by default.
        methods:
          - doc: String renders the mode for a log or an error field.
            name: String
            out:
              - type: string
            recv: value
        name: TLSMode
        underlying: uint8
      - decl: true
        doc: |-
          SMTPConfig configures the SMTP transport.

          Everything refusable about it is refused by [NewSMTP] at CONSTRUCTION rather
          than at send time: an unset TLS mode, a port outside the protocol's range, or
          credentials the transport would have to send in the clear. The fix for each
          is one line in the wiring, which is where the error is raised.
        methods:
          - doc: |-
              String renders the configuration with field names and the password
              redacted — the %+v form.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              GoString renders the configuration in Go syntax with the password redacted,
              named as the type it is.
            name: GoString
            out:
              - type: string
            recv: value
          - doc: |-
              Format implements fmt.Formatter, so EVERY verb — %v, %+v, %#v, %s, %q, %x —
              formats the redacted view with the flags and width it was given. Without it,
              %+v of an SMTPConfig printed the password: String and GoString are consulted
              by only some verbs, and a struct with neither prints every field.
            in:
              - name: state
                type: fmt.State
              - name: verb
                type: rune
            name: Format
            recv: value
          - doc: |-
              MarshalJSON implements json.Marshaler with the password redacted, so a
              configuration dumped as JSON — a --show-config flag, a diagnostics page —
              does not carry it. The shape is otherwise the one encoding/json produced
              before this method existed: the same field names, the same types.
            name: MarshalJSON
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: value
        name: SMTPConfig
        struct:
          fields:
            - doc: |-
                Host is the server's name. It is also the name TLS verifies the
                certificate against, and the name EHLO is answered by — so it is not
                interchangeable with an IP address.
              name: Host
              type: string
            - doc: |-
                Port is the TCP port: 587 for submission with STARTTLS, 465 for
                submissions with implicit TLS (RFC 8314 §3.1), 25 for a relay.
              name: Port
              type: int
            - doc: TLS selects the encryption mode. The zero value is refused.
              name: TLS
              type: TLSMode
            - doc: |-
                Identity carries the trust anchors, the client certificate for mutual
                TLS, and the minimum protocol version. It is core/net's opaque identity,
                reused rather than twinned: a mail server's TLS is the same TLS every
                other outbound connection in this SDK uses, and a second configuration
                type would be a second place for a minimum version to be wrong.

                Its zero value is usable and means "the platform trust store, TLS 1.3
                minimum". [SMTPConfig.Host] is used as the verified name when the
                identity names none.
              name: Identity
              type: corenet.IdentityValue
            - doc: |-
                Username is the SASL authentication identity. Empty means no AUTH
                command is issued at all.
              name: Username
              type: string
            - doc: |-
                Password is the secret for Username. It never appears in an error, a
                field or a log line emitted by this package.
              name: Password
              type: string
            - doc: |-
                LocalName is the domain given in EHLO. Empty selects "localhost", which
                is what net/smtp uses and what a submission server ignores.
              name: LocalName
              type: string
            - doc: |-
                DialTimeout bounds the TCP connection. Non-positive clamps to
                [defaultDialTimeout]; a shorter context deadline still wins.
              name: DialTimeout
              type: time.Duration
  - doc: |-
      Package mail is the public facade for the SDK's electronic-mail domain:
      build a message as a value, and hand it to a transport that refuses to lie
      about what it sent.

      	transport, err := mail.NewSMTP(mail.SMTPConfig{
      		Host: "smtp.example.com",
      		Port: 587,
      		TLS:  mail.TLSStartTLS, // the zero value is refused, on purpose
      		Username: "postmaster@example.com",
      		Password: secret,
      	})
      	if err != nil {
      		return err
      	}

      	err = transport.Send(ctx, mail.Message{
      		From:    mail.Address{Name: "Ops", Addr: "ops@example.com"},
      		To:      []mail.Address{{Addr: "user@example.net"}},
      		Bcc:     []mail.Address{{Addr: "audit@example.com"}}, // envelope only
      		Subject: "Réunion à 9h",                              // encoded per RFC 2047
      		Text:    "Bonjour,",
      		HTML:    "<p>Bonjour,</p>",                           // → multipart/alternative
      	})

      # Header injection is refused, never repaired

      A header field ends at CRLF (RFC 5322 §2.2). So a carriage return inside a
      subject, a display name or a filename does not corrupt that field — it ENDS
      it, and everything after it becomes headers the caller never wrote. "Bcc:
      attacker@example.com" is one of them, and the message is then delivered to
      somebody the sender cannot see in what it composed.

      This package REFUSES such a value with [HeaderInjection]. It does not clean
      it up, and the reason is that the standard library will: mime.QEncoding
      turns the CRLF into "=0D=0A", mime.FormatMediaType percent-escapes it, and
      net/mail.Address.String() passes it through untouched inside the address. Two
      of those produce a message that is not the one the caller wrote while
      reporting success, and the third produces the injection itself.

      The error names the FIELD and never the value — the value is by construction
      the string an attacker chose, and a Public message travels to strangers. The
      diagnosis lives in the log-only fields.

      # Bcc reaches the envelope and never a header

      RFC 5322 §3.6.3 permits three treatments of a Bcc field. This package takes
      the only one that cannot leak: the addresses become RCPT TO commands and no
      header names them. [EnvelopeOf] is where that happens, and the composed
      bytes are asserted not to contain a blind recipient.

      # The MIME structure follows from the fields

      	text only                    → text/plain
      	HTML only                    → text/html
      	text + HTML                  → multipart/alternative(plain, html)
      	body + inline parts          → multipart/related(body, inline…)
      	body + attachments           → multipart/mixed(body, attachment…)
      	body + inline + attachments  → multipart/mixed(multipart/related(…), attachment…)

      An [Attachment] carrying a ContentID is inline and referenceable from the
      HTML as cid:<ContentID> (RFC 2392 §2); one without is a file. Inside
      multipart/alternative the plain part comes FIRST, because RFC 2046 §5.1.4
      orders alternatives by increasing preference — writing HTML first asks every
      client to display the plain text.

      # TLS is a decision, and its zero value is refused

      [SMTPConfig].TLS has no default. Choosing encryption silently would break
      every caller pointing at a plaintext relay on a private segment; choosing
      none silently would ship everyone else's credentials in the clear. So the
      zero value returns [InvalidConfig] at construction and the caller writes
      [TLSStartTLS], [TLSImplicit] or [TLSDisabled].

      There is deliberately no opportunistic mode. A transport that encrypts when
      the server offers it and continues in the clear when it does not is one
      stripped EHLO line away from handing an attacker the whole session — so a
      server that does not advertise STARTTLS gets [TLSRequired] and no message.

      Credentials never travel unencrypted. [TLSDisabled] with a Username is
      refused at construction, and an unencrypted session is refused again before
      the AUTH command — which is not redundant, because net/smtp's own PlainAuth
      sends the password in the clear whenever the server is called localhost, and
      in a container that is every relay one hop away.

      # A configuration from one URL, and a password nothing prints

      [ParseURL] reads the form a deployment hands over in one variable:

      	cfg, err := mail.ParseURL(os.Getenv("SMTP_URL"))
      	// smtp://user:pass@relay.example:587?tls=starttls|implicit|none
      	// smtps://user:pass@relay.example        (implicit TLS, port 465)

      smtp:// is STARTTLS unless the tls parameter says otherwise, smtps:// is
      implicit TLS and may only say so again, and a plaintext session is spelled
      tls=none. The port defaults by mode (587, 465, 25). The result is checked as
      [NewSMTP] checks it, so credentials with tls=none fail here with
      [AuthInsecure]. A refusal is [InvalidURL] with a clause, and it never quotes
      the URL — its userinfo is the password.

      An [SMTPConfig] never renders its password: every fmt verb (it implements
      Format), String, GoString and its JSON write "<redacted>" where the password
      is, and the empty string where none is set.

      # What this package does NOT promise

      A nil error from [Transport].Send means the next hop ACCEPTED the message.
      It is not delivery: SMTP accepts responsibility hop by hop (RFC 5321 §6.1),
      and the hop that eventually refuses says so in a bounce, hours later, to the
      envelope's return path.

      It is not deliverability either. Whether a message reaches an inbox rather
      than a spam folder depends on SPF, DKIM and DMARC — records in DNS and a
      signing key — which are infrastructure decisions with an operational
      lifetime, not a library call. This package signs nothing and will not
      pretend the absence of a signature is a detail.

      And it is not rendering. Whether a client displays the HTML, the plain text,
      or an inline image at all is that client's decision; what this package
      guarantees is that the structure is the one the RFCs prescribe for the
      content supplied.

      # A durable outbox

      A transport sends once, synchronously, and a relay that is down makes that
      the caller's problem. The outbox that retries on a backoff, dead-letters
      with the last failure and keeps a Message-ID stable across retries is
      package [github.com/kitsunium/sdk/pkg/v1/app/mail/spool]: it stands on the
      queue domain, so a program that only composes and sends links none of it.

      # Testing

      [NewMemory] returns a transport that COMPOSES every message and records the
      bytes instead of dialling. It is a double rather than a stub: it runs the
      same composer and the same guards, so a message production would refuse is
      refused in the test that exists to catch it.

      	box := mail.NewMemory()
      	_ = service.Notify(ctx, box)      // the code under test
      	sent := box.Sent()                // envelope + composed the RFC 5322 wire form

      [NewCapture] is the same double keeping only the last N deliveries — the
      transport a development server delivers through, where NewMemory would keep
      every mail for as long as the server runs.
    facade:
      - const:
          - doc: |-
              TLSUnset is the zero value and is refused at construction — neither
              "encrypt" nor "do not" is a guess this SDK is entitled to make for a caller.
            name: TLSUnset
            reexport: svcmail.TLSUnset
            type: TLSMode
            typed: true
            value: "0"
      - const:
          - doc: |-
              TLSStartTLS requires the server to advertise STARTTLS (RFC 3207) and refuses
              the session when it does not. The port-587 shape.

              There is deliberately no opportunistic variant: a transport that encrypts
              when the server offers it and continues in the clear when it does not is one
              stripped EHLO line away from handing an attacker the whole session.
            name: TLSStartTLS
            reexport: svcmail.TLSStartTLS
            type: TLSMode
            typed: true
            value: "1"
      - const:
          - doc: |-
              TLSImplicit negotiates TLS before the greeting, which RFC 8314 §3.3 prefers
              because there is no plaintext phase to interfere with. The port-465 shape.
            name: TLSImplicit
            reexport: svcmail.TLSImplicit
            type: TLSMode
            typed: true
            value: "2"
      - const:
          - doc: |-
              TLSDisabled sends in the clear and must be spelled out loud. Credentials are
              refused with it, at construction.
            name: TLSDisabled
            reexport: svcmail.TLSDisabled
            type: TLSMode
            typed: true
            value: "3"
      - const:
          - doc: |-
              DefaultCaptureKeep is how many deliveries NewCapture keeps when given a
              non-positive number.
            name: DefaultCaptureKeep
            reexport: svcmail.DefaultCaptureKeep
            type: int
            typed: true
            value: "200"
      - alias:
          - doc: Message is the public alias for one mail, as a value.
            name: Message
            target: coremail.MessageValue
      - alias:
          - doc: Address is the public alias for one RFC 5322 mailbox.
            name: Address
            target: coremail.AddressValue
      - alias:
          - doc: |-
              Attachment is the public alias for one file or inline part. A non-empty
              ContentID makes it inline.
            name: Attachment
            target: coremail.AttachmentValue
      - alias:
          - doc: |-
              HeaderField is the public alias for one additional header. It is a slice
              element rather than a map entry so a composed message is deterministic and so
              a field may legitimately repeat.
            name: HeaderField
            target: coremail.HeaderFieldValue
      - alias:
          - doc: |-
              Envelope is the public alias for the SMTP envelope: one MAIL FROM and every
              RCPT TO, Bcc included.
            name: Envelope
            target: coremail.EnvelopeValue
      - alias:
          - doc: |-
              Delivery is the public alias for one record of what a transport put on the
              wire: the envelope, and the composed bytes.
            name: Delivery
            target: coremail.DeliveryValue
      - alias:
          - doc: |-
              Transport is the public alias for the frozen port. A new capability arrives
              as a sibling interface reached by type assertion, never as a second method
              (ADR 0039).
            name: Transport
            target: coremail.Transport
      - alias:
          - doc: |-
              BatchSender is the public alias for the sibling that sends several messages
              over one session.
            name: BatchSender
            target: coremail.BatchSender
      - alias:
          - doc: |-
              Outbox is the public alias for the sibling that exposes what was sent. Only
              the in-memory transport implements it.
            name: Outbox
            target: coremail.Outbox
      - alias:
          - doc: |-
              FullTransport is the public alias for the union [NewMemory] returns. A
              parameter should still ask for the narrowest thing it uses.
            name: FullTransport
            target: coremail.FullTransport
      - alias:
          - doc: SMTPConfig is the public alias for the SMTP transport's configuration.
            name: SMTPConfig
            target: svcmail.SMTPConfig
      - alias:
          - doc: TLSMode is the public alias for the encryption mode. Its zero value is refused.
            name: TLSMode
            target: svcmail.TLSMode
      - alias:
          - doc: |-
              ComposerConfig is the public alias for the composer's optional clock and
              randomness source. Both clamp rather than refuse.
            name: ComposerConfig
            target: svcmail.ComposerConfig
      - alias:
          - doc: |-
              Composer is the public alias for the type that turns a [Message] into
              the RFC 5322 wire form without sending anything.
            name: Composer
            target: svcmail.Composer
      - var:
          - doc: |-
              HeaderInjection is returned when a header name or value carries CR, LF or
              NUL. It is a refusal and never a repair, and it names the field rather
              than the value.
            name: HeaderInjection
            reexport: coremail.HeaderInjection
            type: "*errs.Error"
          - doc: |-
              InvalidAddress is returned for an addr-spec outside the dot-atom subset
              of RFC 5322 §3.4.1 this domain accepts, or outside the RFC 5321 §4.5.3.1
              length limits.
            name: InvalidAddress
            reexport: coremail.InvalidAddress
            type: "*errs.Error"
          - doc: |-
              UnsupportedAddress is returned for a non-ASCII addr-spec (RFC 6531
              SMTPUTF8) or a quoted local part — both legal mail, both refused by name
              rather than transliterated into a deliverable but different address.
            name: UnsupportedAddress
            reexport: coremail.UnsupportedAddress
            type: "*errs.Error"
          - doc: MissingSender is returned for a message with no From mailbox.
            name: MissingSender
            reexport: coremail.MissingSender
            type: "*errs.Error"
          - doc: |-
              NoRecipients is returned when To, Cc and Bcc are all empty, before any
              socket is opened.
            name: NoRecipients
            reexport: coremail.NoRecipients
            type: "*errs.Error"
          - doc: |-
              EmptyBody is returned for a message with no text, no HTML and no
              attachment.
            name: EmptyBody
            reexport: coremail.EmptyBody
            type: "*errs.Error"
          - doc: |-
              ReservedHeader is returned when Headers names a field the composer owns —
              including Bcc, which is the injection arriving through the front door.
            name: ReservedHeader
            reexport: coremail.ReservedHeader
            type: "*errs.Error"
          - doc: |-
              InvalidAttachment is returned for an attachment with no filename, an
              unparseable media type, a malformed Content-ID, or an inline part in a
              message with no body to reference it.
            name: InvalidAttachment
            reexport: coremail.InvalidAttachment
            type: "*errs.Error"
          - doc: |-
              HeaderTooLong is returned when a header line exceeds the RFC 5322 §2.1.1
              limit of 998 octets and offers no whitespace to fold at. It is refused
              rather than truncated.
            name: HeaderTooLong
            reexport: coremail.HeaderTooLong
            type: "*errs.Error"
          - doc: ComposeFailed is returned when the MIME body could not be assembled.
            name: ComposeFailed
            reexport: coremail.ComposeFailed
            type: "*errs.Error"
          - doc: |-
              InvalidConfig is returned by [NewSMTP] for a configuration that cannot be
              honoured as written — including a [TLSUnset] mode.
            name: InvalidConfig
            reexport: coremail.InvalidConfig
            type: "*errs.Error"
          - doc: |-
              DialFailed is returned when the server could not be reached, or the
              context ended before the greeting.
            name: DialFailed
            reexport: coremail.DialFailed
            type: "*errs.Error"
          - doc: |-
              GreetingFailed is returned when the connection opened and the SMTP
              conversation did not.
            name: GreetingFailed
            reexport: coremail.GreetingFailed
            type: "*errs.Error"
          - doc: |-
              TLSRequired is returned when STARTTLS was required and the server never
              offered it. The session is ended, never downgraded.
            name: TLSRequired
            reexport: coremail.TLSRequired
            type: "*errs.Error"
          - doc: TLSFailed is returned when the handshake or the STARTTLS command failed.
            name: TLSFailed
            reexport: coremail.TLSFailed
            type: "*errs.Error"
          - doc: |-
              AuthInsecure is returned when credentials would have travelled over an
              unencrypted session — at construction, and again before AUTH.
            name: AuthInsecure
            reexport: coremail.AuthInsecure
            type: "*errs.Error"
          - doc: |-
              AuthFailed is returned when the server rejected the credentials or
              advertised no AUTH mechanism.
            name: AuthFailed
            reexport: coremail.AuthFailed
            type: "*errs.Error"
          - doc: |-
              SendRefused is returned when MAIL, RCPT or DATA was answered with a
              failure reply. The server's own text travels as a log-only field.
            name: SendRefused
            reexport: coremail.SendRefused
            type: "*errs.Error"
          - doc: |-
              InvalidURL is returned by [ParseURL] for a URL it cannot read. It names
              the clause and never the URL, which carries the password.
            name: InvalidURL
            reexport: coremail.InvalidURL
            type: "*errs.Error"
      - func:
          doc: |-
            NewCapture returns NewMemory's double keeping only the last keep deliveries
            — DefaultCaptureKeep when keep is not positive: the transport a development
            server and a test deliver through.
          forward: svcmail.NewCapture
          in:
            - name: keep
              type: int
          name: NewCapture
          out:
            - type: FullTransport
      - func:
          doc: |-
            ParseURL reads smtp://user:password@host:port?tls=starttls|implicit|none, or
            smtps://…, into an [SMTPConfig] that [NewSMTP] accepts; see the package
            documentation for the grammar and its defaults. On a refusal it returns the
            zero SMTPConfig and an error that never quotes the URL.
          forward: svcmail.ParseURL
          in:
            - name: raw
              type: string
          name: ParseURL
          out:
            - name: cfg
              type: SMTPConfig
            - name: err
              type: error
      - func:
          doc: |-
            NewSMTP returns a transport that delivers over SMTP, refusing at construction
            any configuration it could not honour — an unset TLS mode, an out-of-range
            port, or credentials it would have to send in the clear.

            It holds no pooled connection: it dials per send, and a caller that wants one
            session for many messages asks for it through [BatchSender].
          forward: svcmail.NewSMTP
          in:
            - name: cfg
              type: SMTPConfig
          name: NewSMTP
          out:
            - name: transport
              type: Transport
            - name: err
              type: error
      - func:
          doc: |-
            NewMemory returns a transport that composes every message and records the
            result instead of dialling anything — the double a consumer's tests wire in
            place of [NewSMTP].

            It takes no arguments on purpose: every knob it could offer is one a test has
            to set before it can assert anything, and the value of a double is that it
            costs one line.
          forward: svcmail.NewMemory
          name: NewMemory
          out:
            - type: FullTransport
      - func:
          doc: |-
            NewComposer returns a composer that renders a [Message] to the RFC 5322 wire form
            without sending it — for a caller that hands the bytes to something this SDK
            does not implement, or that wants a golden test over its own templates.

            A [ComposerConfig] with a fixed clock and a fixed randomness source makes
            composition byte-deterministic.
          forward: svcmail.NewComposer
          in:
            - name: cfg
              type: ComposerConfig
          name: NewComposer
          out:
            - type: "*Composer"
      - func:
          doc: |-
            Validate reports whether msg can be composed and sent, returning the first
            typed refusal it finds.

            It is exported so a caller can reject a message at the edge — where a form
            was submitted — rather than at the transport, and get the same verdict either
            way.
          forward: svcmail.Validate
          in:
            - name: msg
              type: Message
          name: Validate
          out:
            - type: error
      - func:
          doc: |-
            EnvelopeOf validates msg and derives the SMTP envelope a transport would
            issue for it: the From addr-spec as the return path, and every recipient —
            To, then Cc, then Bcc — as a RCPT TO. A blind recipient reaches the envelope
            and no header; that is the whole of Bcc in this package.

            It returns the first typed refusal [Validate] would, and the zero [Envelope]
            with it: an envelope built from an unvalidated message is a list of strings
            that may each carry a CRLF.
          forward: svcmail.Envelope
          in:
            - name: msg
              type: Message
          name: EnvelopeOf
          out:
            - name: envelope
              type: Envelope
            - name: err
              type: error
    functions:
      - doc: |-
          Compose renders msg to the RFC 5322 wire form using the system clock and
          crypto/rand. It is the one-line form of [NewComposer].
        in:
          - name: msg
            type: Message
        name: Compose
        out:
          - name: raw
            type: "[]byte"
          - name: err
            type: error
    imports:
      coremail: github.com/kitsunium/sdk/internal/core/app/mail
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcmail: github.com/kitsunium/sdk/internal/service/app/mail
    path: github.com/kitsunium/sdk/pkg/v1/app/mail
