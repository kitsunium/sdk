                type: time.Time
            name: Expired
            out:
              - type: bool
            recv: pointer
        name: GrantValue
        struct:
          fields:
            - name: Subject
              type: string
            - name: VerifiedAt
              type: time.Time
            - name: NotAfter
              type: time.Time
            - name: Offline
              type: bool
      - name: OriginValue
        struct:
          fields:
            - name: Name
              type: string
            - name: BundleURL
              type: string
      - methods:
          - in:
              - name: accountID
                type: string
              - name: now
                type: time.Time
            name: CIEntitlementFor
            out:
              - name: entitlement
                type: CIEntitlementValue
              - name: err
                type: error
            recv: pointer
          - in:
              - name: uuid
                type: string
            name: SubjectFor
            out:
              - name: subject
                type: SubjectValue
              - name: err
                type: error
            recv: pointer
        name: RosterValue
        struct:
          fields:
            - name: IssuedAt
              tag: json:"iat"
              type: time.Time
            - name: ExpiresAt
              tag: json:"exp"
              type: time.Time
            - name: Subjects
              tag: json:"subjects"
              type: map[string]SubjectValue
            - name: RequiredVersion
              tag: json:"minv,omitempty"
              type: string
            - name: CIAccounts
              tag: json:"ci,omitempty"
              type: map[string]CIEntitlementValue
            - name: CIRelaxed
              tag: json:"cilax,omitempty"
              type: bool
      - name: CIEntitlementValue
        struct:
          fields:
            - name: ExpiresAt
              tag: json:"exp"
              type: time.Time
      - name: SubjectValue
        struct:
          fields:
            - name: Fingerprint
              tag: json:"fp"
              type: string
            - name: ExpiresAt
              tag: json:"exp"
              type: time.Time
  - codes:
      - const:
          - doc: |-
              CodeCacheUnwritable identifies an offline cache that could not be replaced.

              It is never a refusal. The verification that produced the bundle already
              succeeded, and what is lost is the next start-up's ability to answer without
              the network — which is why rememberRoster logs it and carries on rather than
              returning it. The code exists so that line has something to name, and so the
              step that failed (mkdir, create, write, close, rename) travels as a field
              instead of as prose.
            name: CodeCacheUnwritable
            note: "range: 0.3.67.0 - 0.3.67.255"
            value: "0x00_03_43_01"
        type: errs.Code
    constants:
      - name: ActionsJWKSURL
        type: string
        value: "\"https://token.actions.githubusercontent.com/.well-known/jwks\""
      - name: ActionsIssuer
        type: string
        value: "\"https://token.actions.githubusercontent.com\""
      - name: DefaultActionsAudience
        type: string
        value: "\"kitsunium-sdk-entitlement\""
    functions:
      - in:
          - name: raw
            type: "[]byte"
          - name: vendor
            type: ed25519.PublicKey
          - name: now
            type: time.Time
        name: ParseBundle
