  - codes:
      - const:
          - doc: CodeNoLicence identifies a machine with no entitlement key at all.
            name: CodeNoLicence
            note: "range: 0.2.35.0 - 0.2.35.255"
            value: "0x00_02_23_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeRosterUnsigned identifies a roster carrying no valid vendor signature.
              It is the spoofing signal: a substituted endpoint cannot produce one.
            name: CodeRosterUnsigned
            value: "0x00_02_23_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeRosterStale identifies a roster that verified but whose validity window
              has closed.
            name: CodeRosterStale
            value: "0x00_02_23_03"
        type: errs.Code
      - const:
          - doc: CodeRevoked identifies a subject absent from a roster that was itself valid.
            name: CodeRevoked
            value: "0x00_02_23_04"
        type: errs.Code
      - const:
          - doc: CodeLicenceExpired identifies a subject whose own validity window has closed.
            name: CodeLicenceExpired
            value: "0x00_02_23_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyMismatch identifies a local key that does not match the fingerprint
              the roster publishes for this subject.
            name: CodeKeyMismatch
            value: "0x00_02_23_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeRosterUnreachable identifies a fetch that could not decide either way.
              It reports "cannot decide", never "no" — the distinction is the whole point.
            name: CodeRosterUnreachable
            value: "0x00_02_23_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeAmbiguousLicence identifies more than one entitlement identity on one
              machine, which no automatic choice can resolve safely.
            name: CodeAmbiguousLicence
            value: "0x00_02_23_08"
        type: errs.Code
      - const:
          - doc: CodeCIUnverifiable identifies a CI run whose provenance could not be proven.
            name: CodeCIUnverifiable
            value: "0x00_02_23_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeCIUnknownKey identifies a CI token signed by a key the issuer does not
              publish.
            name: CodeCIUnknownKey
            value: "0x00_02_23_0A"
        type: errs.Code
      - const:
          - doc: CodeCINotEntitled identifies a CI account the roster does not cover.
            name: CodeCINotEntitled
            value: "0x00_02_23_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeNoPossession identifies a holder who could not prove possession of the
              private half of the published key.
            name: CodeNoPossession
            value: "0x00_02_23_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeClockRegressed identifies a machine whose clock is behind the last signed
              document it verified — the anti-rollback ratchet.
            name: CodeClockRegressed
            value: "0x00_02_23_0D"
        type: errs.Code
      - const:
          - doc: CodeUpdateRequired identifies a build below the floor the roster mandates.
            name: CodeUpdateRequired
            value: "0x00_02_23_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeProductInvalid identifies a ProductValue whose origin list could not
              survive the day it is needed — see ProductValue.Validate.
            name: CodeProductInvalid
            value: "0x00_02_23_0F"
        type: errs.Code
    constants:
      - name: RosterLifetime
        type: time.Duration
