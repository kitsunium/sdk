    constants:
      - doc: |-
          RosterLifetime bounds how long a verified grant survives without a fresh
          fetch. It is the single dial of the whole scheme: it caps both how long a
          revoked subject keeps working and how long a hostile endpoint can replay a
          genuine roster.
        name: RosterLifetime
        type: time.Duration
        value: "86400000000000"
    doc: |-
      Package entitlement — the error-code range this domain owns (framework/connectors/ssh block).

      Package entitlement is the contract for machine entitlement: turning local
      key material plus a vendor-signed roster into a grant, or a typed refusal.

      The trust model has exactly one SIGNER: the vendor. What a consuming binary
      links in is that signer's ed25519 public key — or, while a signing key is
      being rotated, an ordered list of the keys it will accept, which is a property
      of the verifier and lives in framework/internal/service/entitlement. Several accepted
      keys are still one signer: authentication establishes that the vendor issued
      these bytes and nothing more, so no quorum is being taken. Everything else —
      the roster, the per-subject keys, the host serving them — is untrusted input. A
      hostile endpoint can serve whatever it likes; it cannot forge a signature made
      with the vendor's private half.

      What that anchor cannot do is survive a patched binary. A check running on
      someone else's machine is removable by definition. This domain stops casual
      sharing and makes revocation real for cooperative installs; it is not a wall
      against a determined attacker, and is deliberately not built as if it were.

      # Why Identity is a port

      Proving possession needs key material the user already has, in a format the
      standard library cannot parse — OpenSSH, via golang.org/x/crypto/ssh, which
      brings golang.org/x/sys and is banned SDK-wide (ADR 0078). Naming the
      capability as a port keeps the MECHANISM here, stdlib-only, and puts the one
      implementation that needs a vendor dependency where a vendor dependency is
      allowed: the framework's connector module framework/connectors/ssh, which a
      consumer opts into (ADR 0158).

      A consumer that does not want that dependency supplies its own Identity. That
      is not a theoretical escape hatch — the product this was versed from does
      exactly that, keeping its 327 lines of SSH handling rather than pulling the
      connector's graph for them.

      There is **no registry**. A registry's key would name an identity scheme, and
      the whole trust chain is anchored to one vendor for one product.

      Package entitlement — the sentinels every implementation of this domain
      returns.

      Each names a distinct operator situation rather than a generic failure,
      because callers map them to exit codes and an operator acts on the
      difference: a revoked subject, an expired window and an unreachable roster
      need three different responses.

      Package entitlement - the record of a verification that succeeded. A daemon
      ages against it: memory of a past check must not outlive the roster window,
      otherwise revocation would never reach a long-running process.

      Package entitlement - where the roster is fetched from. Authority comes from
      the vendor signature, never from the origin that served the bytes, so the
      binary is free to ask several places and keep whichever answers.

      Package entitlement - the signed roster: the only statement the binary trusts,
      and only because the vendor signed it. Origin is irrelevant here; a
      substituted endpoint can serve any bytes but cannot forge the signature.
    functions:
      - doc: |-
          GrantDeadline computes NotAfter from the verification's own lifetime and
          however many further bounds the caller can name.

          A zero expiry means "not recorded" throughout this package — an absent
          subject term, or a roster field a predecessor never wrote — and must never
          be read as "already expired". Zero values are therefore skipped rather than
          minimised over: otherwise the earliest bound would always be the zero time
          and every grant would be born dead.

          # Why the bounds are variadic

          Because "a grant may not outlive the document that authorised it" is a rule
          about however many documents there were, and the CI path has three. It was
          written as two fixed parameters — the roster's window and the subject's term —
          which are exactly the two a DEVICE grant rests on. A CI seat rests on a third:
          the Actions token that proved the run is real, whose own expiry GitHub sets
          minutes out. ciseat.go therefore bounded the seat by the roster and the
          account's term and by nothing else, so a grant established by a 30-minute proof
          survived it by up to a day — the invariant NotAfter's own comment states,
          contradicted by the one caller that had a document the signature said the least
          about.

          Variadic rather than a fourth parameter so the two existing call sites compile
          unchanged and read unchanged; a caller with nothing extra to name passes
          nothing extra.

          # No skew here, deliberately

          checkTiming allows clockSkew when ADMITTING an Actions token, which is the
          permissive direction and the right one there: refusing a genuine token over two
          minutes of drift would break a working runner. Adding the same allowance to a
          BOUND would run the opposite way — it would extend the grant past the proof —
          so the bound is the claim as written.
        in:
          - name: verifiedAt
            type: time.Time
          - name: bounds
            type: time.Time
        name: GrantDeadline
        out:
          - type: time.Time
        variadic: true
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/framework/internal/core/entitlement
    sentinels:
      - doc: |-
          Sentinel errors distinguishing why authorization failed. Callers map them
          to exit codes, so each one names a distinct operator situation rather than
          a generic failure.
        var:
          - code: CodeNoLicence
            doc: |-
              ErrNoLicense reports that no licence key was found on this machine.
              The caller has never enrolled, or the key was removed.
            name: ErrNoLicense
            private: "core/entitlement: no key material for any subject"
            public: no entitlement key was found on this machine
            reason: NO_LICENCE
          - code: CodeRosterUnsigned
            doc: |-
              ErrRosterUnsigned reports that the roster carried no valid vendor
              signature. This is the spoofing signal: a substituted endpoint cannot
              produce one.
            name: ErrRosterUnsigned
            private: "core/entitlement: the roster signature did not verify against the vendor key"
            public: the roster is not signed by the expected vendor
            reason: ROSTER_UNSIGNED
          - code: CodeRosterStale
            doc: |-
              ErrRosterStale reports that the roster verified but no longer
              authorises anything. It bounds how long a revoked client keeps working
              offline, and how long a hostile endpoint can replay a genuine roster.

              Those are the same bound, and cache.go is what finally made the first
              half of that sentence describe something: an offline client re-reads
              the last bundle it authenticated and is refused HERE the moment that
              bundle's window closes — at most RosterLifetime after it was signed,
              whoever is replaying it and from wherever.

              TWO conditions reach it, and the second is the other half of that
              replay bound rather than a separate situation. A window that has
              CLOSED is the absolute one. A roster SUPERSEDED by a newer signed
              decision this machine has already accepted is the relative one: its
              own window may be wide open, and it is still the replay of a statement
              the vendor has since replaced. Only the `condition` field says which,
              because the resolving action does not differ — publish, or fetch, a
              current roster.
            name: ErrRosterStale
            private: "core/entitlement: the roster verified but no longer authorises — its own window has closed, or a newer signed decision has superseded it"
            public: the roster has expired
            reason: ROSTER_STALE
          - code: CodeRevoked
            doc: |-
              ErrRevoked reports that the licence UUID is absent from a roster that
              was itself valid — the subject was removed upstream.
            name: ErrRevoked
            private: "core/entitlement: the subject is absent from a roster that was itself valid"
            public: this entitlement has been revoked
            reason: REVOKED
          - code: CodeLicenceExpired
            doc: |-
              ErrLicenseExpired reports that the subject's own validity window has
              closed, even though the roster itself is fresh and still lists them.
              Distinct from ErrRosterStale (the whole roster's signing freshness)
              and from ErrRevoked (removed from the roster entirely): renewal, not
              rotation or re-enrolment, is what resolves this one.
            name: ErrLicenseExpired
            private: "core/entitlement: the subject's own validity window has closed"
            public: this entitlement has expired
            reason: LICENCE_EXPIRED
          - code: CodeKeyMismatch
            doc: |-
              ErrKeyMismatch reports that the local key does not match the
              fingerprint the roster records for this UUID, which is what a copied
              .pub file looks like: the public half is published, so possession of
              it proves nothing.
            name: ErrKeyMismatch
            private: "core/entitlement: the local key fingerprint differs from the roster's"
            public: the local key does not match the published fingerprint
            reason: KEY_MISMATCH
          - code: CodeRosterUnreachable
            doc: |-
              ErrRosterUnreachable reports that no origin could be reached AND no
              usable bundle was cached, so no authorization decision could be made at
              all. It is deliberately distinct from a refusal: the caller knows
              nothing, rather than knowing the answer is no.

              It names the NETWORK even when the cache is what failed last. The cache
              is a fallback nobody configured and most operators have never heard of;
              pointing them at it would send them to fix the wrong thing, when what
              happened is that every publication point was unreachable.
            name: ErrRosterUnreachable
            private: "core/entitlement: no origin answered and nothing was cached — cannot decide, which is not the same as no"
            public: the roster could not be reached
            reason: ROSTER_UNREACHABLE
          - code: CodeAmbiguousLicence
            doc: |-
              ErrAmbiguousLicense reports that the key directory holds more than one
              usable licence identity, so which one this machine presents cannot be
              decided here. It is deliberately distinct from ErrNoLicense: the
              machine is enrolled, possibly several times over, and the fix is to
              remove the identities that do not belong rather than to enrol.

              Guessing was the previous behaviour — the lexicographically first UUID
              won — which let a stray .pub decide which licence got verified, which
              one a rotation overwrote, and which one `license status` reported.
            name: ErrAmbiguousLicense
            private: "core/entitlement: several subjects are enrolled and no automatic choice is safe"
            public: more than one entitlement identity is present on this machine
            reason: AMBIGUOUS_LICENCE
          - code: CodeCIUnverifiable
            doc: |-
              ErrCIUnverifiable reports that a claim of running inside CI could not
              be authenticated: no token, a malformed one, a bad signature, or one
              minted for someone else. It never means "not in CI" — it means the
              claim was not provable, and the caller falls back to the ordinary
              device path rather than granting a free seat.
            name: ErrCIUnverifiable
            private: "core/entitlement: the CI provenance token was absent or unverifiable"
            public: this run could not be proven to be a CI run
            reason: CI_UNVERIFIABLE
          - code: CodeCIUnknownKey
            doc: |-
              ErrCIUnknownKey reports that the token names a signing key the fetched
              key set does not publish — a key rotated out from under a token still in
              flight, or a forgery. Distinct from ErrCIUnverifiable because the two
              send an operator to different places: this one says the issuer's key set
              and the token disagree, which is the issuer's side of the exchange.

              It used to promise a remedy the client applies itself — "refresh the key
              set once, since GitHub rotates keys, then refuse if it still does not
              appear". No implementation does that and none is expected to: the
              verifier holds no key-set cache, so it already fetches the published set
              fresh on every verification and a rotation is picked up by the next one.
              A second fetch inside one verification would re-read a URL it read
              seconds earlier, which cannot make an endpoint publish a kid it does not
              publish. See the service's publishedJWKS for the argument in full; a
              sentinel must not advertise a mechanism nobody implements.
            name: ErrCIUnknownKey
            private: "core/entitlement: no JWKS entry matched the token's kid"
            public: the CI token is signed by a key the issuer does not publish
            reason: CI_UNKNOWN_KEY
          - code: CodeCINotEntitled
            doc: |-
              ErrCINotEntitled reports that the CI run authenticated, but the account
              it belongs to is not one the roster covers. The token is genuine; the
              licence simply does not extend to it.
            name: ErrCINotEntitled
            private: "core/entitlement: the roster carries no CI seat for this account"
            public: this CI account is not covered by an entitlement
            reason: CI_NOT_ENTITLED
          - code: CodeNoPossession
            doc: |-
              ErrNoPossession reports that the private half could not be exercised,
              so holding the public key was never turned into proof of ownership.
            name: ErrNoPossession
            private: "core/entitlement: the possession challenge was not answered correctly"
            public: possession of the private key could not be proven
            reason: NO_POSSESSION
          - code: CodeClockRegressed
            doc: |-
              ErrClockRegressed reports that this machine's clock reads EARLIER than
              the newest vendor-signed instant it has ever authenticated.

              It is the one statement about time this package can make without the
              network, and it is worth making because the alternative is to believe a
              clock the holder controls. A roster is signed evidence that time was at
              least its IssuedAt; a clock that has since moved backwards past that
              point is either broken or being moved, and both are the holder's to fix.

              What it does NOT catch is a FROZEN clock: parked exactly on the mark,
              nothing local can tell that time has passed. Nor does it survive
              deletion — the mark lives on a disk its holder owns. It bounds the
              careless case and the casual one, which is this package's whole remit.
            name: ErrClockRegressed
            private: "core/entitlement: the anti-rollback ratchet refused a clock earlier than the recorded high-water mark"
            public: this machine's clock is behind the last signed document it verified
            reason: CLOCK_REGRESSED
          - code: CodeUpdateRequired
            doc: |-
              ErrUpdateRequired reports that the roster demands a newer binary than
              this one. It is NOT a licence failure — the subject is perfectly
              entitled — so it carries its own sentinel and its own exit code: the
              resolving action is an upgrade, and telling somebody their licence is
              broken when it is not would send them to the wrong place entirely.
            name: ErrUpdateRequired
            private: "core/entitlement: the running build is below the floor the roster mandates"
            public: a newer version is required
            reason: UPDATE_REQUIRED
    types:
      - decl: true
        doc: |-
          Identity is the machine's half of the proof: which subject this machine
          claims to be, and evidence that it holds the private key the roster publishes
          a fingerprint for.

          It is FROZEN at three methods, and the split is what makes the refusals
          distinguishable. Discover answers "who are we", Fingerprint answers "what do
          we present", ProvePossession answers "can we back it up" — and a caller that
          fails the third after passing the second has key material it cannot use,
          which is a different operator situation from having none at all.

          Frozen means frozen: it is reachable through a pkg/v1 type alias, so ADR 0039
          binds and ADR 0040 §4 removes the v0 licence from it — the version does not
          matter, because structural satisfaction breaks downstream implementations at
          any version. It is extended by a SIBLING, and BoundProver below is the first
          one.
        interface:
          methods:
            - doc: |-
                Discover returns the subject identifier this machine is enrolled as.

                It refuses rather than choosing when more than one identity is present:
                picking one silently would make revocation unverifiable, since the
                operator could not tell which identity was checked.
              name: Discover
              out:
                - name: subject
                  type: string
                - name: err
                  type: error
            - doc: |-
                Fingerprint returns the published fingerprint of the subject's public
                key, in whatever spelling the roster uses. It is compared by byte
                equality against the roster's entry and never parsed.
              in:
                - name: subject
                  type: string
              name: Fingerprint
              out:
                - name: fingerprint
                  type: string
                - name: err
                  type: error
            - doc: |-
                ProvePossession demonstrates that this machine holds the private half of
                the key whose fingerprint Fingerprint returned. A nil error is the proof;
                there is deliberately no value to inspect, because anything returned here
                would be a second thing to verify.

                It proves possession of whatever material this implementation holds NOW,
                which is not the same claim as "possession of the key the roster
                authorised" — nothing the roster said reaches this method. BoundProver is
                the sibling that carries the missing half; an implementation that can make
                the stronger claim implements it, and the engine prefers it when present.
              in:
                - name: subject
                  type: string
              name: ProvePossession
              out:
                - type: error
        name: Identity
      - decl: true
        doc: |-
          BoundProver is Identity's sibling for the one claim the three methods cannot
          make: possession of the key the ROSTER authorised, rather than of whatever
          this machine holds at the moment it is asked.

          # The gap it closes

          The verification engine asks Fingerprint what this machine presents, compares
          the answer ITSELF against the roster's entry, and then asks ProvePossession
          for a proof. The authorised fingerprint never traverses the port, so an
          implementation cannot bind the proof to it: between the two calls the material
          may be replaced — a rotation, a mounted volume remounted, a deliberate swap —
          and the implementation signs with what it finds on the second call. A consumer
          can DETECT that by remembering the key object across the two calls and
          refusing a proof with nothing remembered, which is as far as the three methods
          reach; it cannot be told which key it was supposed to be holding.

          # Why a sibling and not a fourth parameter

          Identity is reachable through a pkg/v1 type alias, so ADR 0039's rule binds
          and ADR 0040 §4 says the version does not matter: a published interface is
          extended by a sibling, never by widening, because Go satisfies interfaces
          STRUCTURALLY and every downstream implementation breaks at compile time with
          no deprecation window. Widening ProvePossession would be worse than adding a
          method — it invalidates a method implementers have already written — and it
          would not even buy the guarantee that tempts it: an implementation can satisfy
          a two-parameter signature and ignore the second argument, so binding is the
          implementation's choice under either shape. The sibling buys the same real
          property and breaks nobody.

          # What its ABSENCE means, stated rather than left to be discovered

          An Identity that does not implement this keeps the three-method behaviour
          exactly: the engine falls back to ProvePossession and the window between the
          two calls stays open. That is not a mechanism this package can close from
          here, and pretending otherwise would be the claim that outruns the code.
        interface:
          methods:
            - doc: |-
                ProvePossessionFor demonstrates that this machine holds the private half
                of the key whose PUBLISHED fingerprint is authorised — the value the
                roster records for this subject, in the roster's own spelling.

                A nil error is the proof, for the same reason it is on ProvePossession.
                An implementation that finds it holds different material refuses with
                ErrKeyMismatch: that is what "a local key that does not match the
                published fingerprint" means, so the refusal taxonomy does not grow.

                authorised is compared however the implementation compares fingerprints —
                byte equality, in the roster's spelling, is what Fingerprint's own
                contract already requires.
              in:
                - name: subject
                - name: authorised
                  type: string
              name: ProvePossessionFor
              out:
                - type: error
        name: BoundProver
      - decl: true
        doc: |-
          GrantValue records a verification that succeeded, and how long that
          verification may be remembered.

          The timestamp alone is not enough to age against, which is the defect this
          type carried until NotAfter existed. A grant used to expire at
          VerifiedAt+RosterLifetime and nothing else, so a daemon that happened to
          verify late in a roster's window kept serving for a further 24 hours after
          that window closed — up to 47 hours after the vendor last signed anything,
          in a scheme whose single dial is a 24-hour bound. It outlived the subject's
          OWN term too: a licence expiring at noon left a daemon that verified at
          11:59 serving until the following day.
        methods:
          - doc: |-
              Deadline reports the instant this grant stops authorising anything — the
              EFFECTIVE one, which is not always the NotAfter field.

              # Why the field is not enough

              NotAfter's zero value means "no deadline was computed", and Expired then ages
              the grant against VerifiedAt+RosterLifetime instead. That fallback lived
              inside Expired and nowhere else, so a caller reading the FIELD to schedule its
              next check read the zero instant and had no way to derive the deadline the SDK
              would actually apply. Its only remaining option was to poll — which is
              precisely how a grant that expires a second after a check keeps authorising
              until the next tick, whatever the tick is.

              With the effective instant readable, a consumer can wake AT the deadline
              rather than sometime after it: arm a timer on Deadline(), or pass it to a
              context. That is the SDK's whole contribution to the problem, and the rest is
              stated in Expired's own comment.

              Expired is defined in terms of this method rather than repeating the fallback,
              because two copies of one rule is how a field and a method come to disagree
              about when a grant died.

              A POINTER receiver for the same reason Expired has one — see there.
            name: Deadline
            out:
              - type: time.Time
            recv: pointer
          - doc: |-
              Expired reports whether a grant may no longer be relied on. A daemon that
              cannot refresh must stop trusting its own memory eventually, otherwise
              revocation would never reach it.

              # Honouring the deadline is the CONSUMER's job, and nothing here enforces it

              This is a value type. Verify computes a grant, hands it back and keeps no
              reference to it: there is no goroutine, no timer and no callback anywhere in
              this SDK that revokes anything when Deadline passes, and a process holding an
              expired grant is not interrupted. Whatever gates work on a grant has to ask.

              So a grant expiring a second after a check keeps authorising until the
              consumer looks again, and how long that is, is the consumer's tick — not a
              property of this domain. What the domain owes is a deadline that can be acted
              on WITHOUT polling, which is what Deadline is for: schedule on it, and the
              question is asked when the answer changes rather than on a cadence.

              Said here rather than only in an ADR, because a consumer reading this method
              is exactly the reader who might otherwise assume something upstream is
              watching the clock for them.

              A POINTER receiver on a read-only method, which is unusual and deliberate:
              the struct outgrew KTN-VAR-BIGSTRUCT's by-value threshold when Offline was
              added, and every caller passes this as a METHOD VALUE
              (`licenseStillValidFrom(svc, refusal, grant.Expired)`) that would otherwise
              copy the whole struct into the closure on every watchdog tick.

              It is a method-set change and therefore a source-level API change, named here
              rather than left to be discovered: Expired is no longer in GrantValue's VALUE
              method set, so a NON-ADDRESSABLE grant — a map entry, a composite literal
              used inline — stops compiling against it. Every caller in this repository
              holds an addressable grant, and pkg/license has no consumer outside the
              module, which is what makes the trade payable; a released SDK would not.
            in:
              - name: now
                type: time.Time
            name: Expired
            out:
              - type: bool
            recv: pointer
        name: GrantValue
        struct:
          fields:
            - doc: Subject is the client UUID that was verified.
              name: Subject
              type: string
            - doc: VerifiedAt is when the roster was last successfully authenticated.
              name: VerifiedAt
              type: time.Time
            - doc: |-
                NotAfter is the instant this grant stops authorising anything: the
                EARLIEST of the verification's own lifetime and every document the
                verification rested on — the roster's expiry, the subject's term, and
                for a CI seat the expiry of the Actions token that proved the run.
                Each bounds something different, so the tightest is the only correct
                answer — a grant may not outlive the document that authorised it.

                The zero value means "no deadline was computed", which is how a grant
                seeded from a bare timestamp behaves: serve.go does exactly that at
                start-up, from the root gate's verification, with no roster in scope.
                The fallback is the verification's own lifetime rather than reading a
                zero deadline as already-past, which would refuse a daemon at the very
                instant it starts.

                Which is why a caller that wants to ACT on the deadline should read
                Deadline() and not this field: the method resolves that fallback and the
                field cannot. Honouring either is the consumer's job — nothing in this
                SDK revokes anything when the instant passes. See Expired.
              name: NotAfter
              type: time.Time
            - doc: |-
                Offline records that no origin answered and the decision rested on the
                last bundle this machine authenticated.

                It changes nothing about the grant's authority: an offline roster
                passed the identical signature and window checks, and NotAfter above
                already bounds it by that roster's own expiry. It exists so the fact can
                be SAID. A binary quietly running on a copy of a document it can no
                longer fetch is the one state where "it worked" and "it is still true"
                come apart, and the operator is the only party who can act on that.
              name: Offline
              type: bool
      - decl: true
        doc: |-
          OriginValue is one publication point for the roster pair.

          It carries no trust of its own: the vendor signature over the bytes is
          what authorises anything, so an origin is only ever an availability
          choice. That is precisely why the list can be extended freely — a hostile
          entry gains nothing, and a dead one is skipped.
        name: OriginValue
        struct:
          fields:
            - doc: |-
                Name identifies the origin in diagnostics. It is not part of the
                trust decision — nothing here is — but an operator staring at a
                refusal needs to know which endpoints were tried.
              name: Name
              type: string
            - doc: |-
                BundleURL serves the signed bundle: roster and signature in one
                document. ONE url, not two, because two objects cannot be fetched
                atomically — see BundleValue for the five-minute cache window that made
                a correct client refuse a correct roster.
              name: BundleURL
              type: string
      - decl: true
        doc: |-
          RosterValue is the signed statement of who may run the linter. It carries
          no secret: every field is publishable, which is why it can live in a public
          repository. Authority comes from the detached signature, never from the
          origin that served the bytes.
        methods:
          - doc: |-
              CIEntitlementFor returns what the roster grants an account's CI runs.

              Absence is not an error worth distinguishing from a refusal here: either
              way the caller falls back to the device path, which is what an
              unentitled CI run should do.

              All four refusals render the SAME sentence, which is deliberate: a refusal
              naming the account it refused hands the party being kept out a way to read
              the roster one probe at a time. Which account, and which deadline, travel as
              FIELDS — errs.FieldsOf reaches them, err.Error() does not — and the condition
              field is what keeps "no roster at all" distinguishable from "this account has
              no seat" for the operator who is entitled to the difference.
            in:
              - name: accountID
                type: string
              - name: now
                type: time.Time
            name: CIEntitlementFor
            out:
              - name: entitlement
                type: CIEntitlementValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              SubjectFor returns the roster's record for a subject. A missing entry
              reports ErrRevoked, but the roster is a stateless snapshot with no
              history: absence is exactly how a withdrawn licence looks, and it is
              indistinguishable here from a subject whose enrolment was never approved
              in the first place. Callers surfacing this to a human must name both
              possibilities rather than assert the more alarming one as fact.

              The refused subject travels as a FIELD and not in the sentence. A revocation
              that quotes back the uuid it refused confirms that uuid to whoever presented
              it, which is a thing a refusal has no business doing; errs.FieldsOf still
              hands it to the operator's log.

              It is total on a nil receiver, which its sibling CIEntitlementFor has always
              been. Reachable through the Roster alias in framework/entitlement, where a
              consumer holding a nil roster got a panic from one method and a refusal from
              the other.
            in:
              - name: uuid
                type: string
            name: SubjectFor
            out:
              - name: subject
                type: SubjectValue
              - name: err
                type: error
            recv: pointer
        name: RosterValue
        struct:
          fields:
            - doc: IssuedAt is when the vendor signed this roster.
              name: IssuedAt
              tag: json:"iat"
              type: time.Time
            - doc: |-
                ExpiresAt closes the roster's own signing-freshness window. Past it
                the roster is refused even though its signature still verifies. This
                bounds replay and revocation latency for the roster as a whole; it is
                independent of any one subject's ExpiresAt below.
              name: ExpiresAt
              tag: json:"exp"
              type: time.Time
            - doc: Subjects maps a client UUID to what the roster records for it.
              name: Subjects
              tag: json:"subjects"
              type: map[string]SubjectValue
            - doc: |-
                RequiredVersion is the lowest binary version allowed to run, as a
                SemVer tag ("v1.5.14"). Empty means no floor, which is how a roster
                published before this field existed behaves — absence must not lock
                out every client that predates it.

                It lives HERE, in the signed roster, rather than being read from a
                release API, and that placement is the whole design. The roster is
                already fetched on every cold start and already authenticated against
                the compiled-in anchor, so a mandatory update inherits both properties
                for free: it cannot be skipped by staying offline (the fetch is
                mandatory), and it cannot be forged by redirecting the endpoint (the
                signature is checked first). A version read from an unauthenticated
                API would be defeated by one line in /etc/hosts.
              name: RequiredVersion
              tag: json:"minv,omitempty"
              type: string
            - doc: |-
                CIAccounts maps a GitHub account's NUMERIC id to what the roster grants
                its CI runs. A run inside that account's Actions may be authorised
                without spending one of the licence's device seats.

                Keyed by id and never by login: a login can be renamed, and a released
                one can be claimed by somebody else, so matching on the name would turn
                a freed handle into a way in.

                Absent for a roster that grants no CI entitlement, which is also how
                every roster published before this field existed behaves — absence must
                not be read as anything but "no CI seat".
              name: CIAccounts
              tag: json:"ci,omitempty"
              type: map[string]CIEntitlementValue
            - doc: |-
                CIRelaxed restores the historical fall-through: inside GitHub Actions a
                failed CI seat stops being a refusal and the device path answers next.

                The DEFAULT is the strict direction, which is the inversion this field
                records. A CI seat used to be tried first and every failure swallowed,
                so a device key dropped onto a runner bought unlimited CI without any CI
                entitlement — the one hole a licence scheme aimed at CI cannot leave
                open. Requiring the seat is now what happens unless this says otherwise.

                It lives in the signed roster, and that placement is the whole design.
                "A run in Actions need not prove it is one" is a statement only the
                vendor is entitled to make, and it has to travel somewhere the party
                being checked cannot rewrite — a flag or an environment variable would
                be set by that very party. Note the direction: this field can only
                RELAX, so forging it is the one thing an attacker would want and the one
                thing the signature prevents; absence, which is what any tampering
                produces, is the strict reading.

                The strictness applies only when InCI reports both runner variables
                present. A laptop never had a seat to prove, and refusing one would be a
                far worse defect than the hole this closes.
              name: CIRelaxed
              tag: json:"cilax,omitempty"
              type: bool
      - decl: true
        doc: CIEntitlementValue is what the roster grants one account's CI.
        name: CIEntitlementValue
        struct:
          fields:
            - doc: |-
                ExpiresAt closes the entitlement, and is the licence's own term so CI
                stops exactly when the devices do. The zero value means no term was
                recorded, treated as no expiry rather than an instantly-closed one —
                the same rule SubjectValue follows, for the same reason.
              name: ExpiresAt
              tag: json:"exp"
              type: time.Time
      - decl: true
        doc: |-
          SubjectValue is one enrolled client's entry: the fingerprint that proves
          which key is theirs, and the date past which their own entitlement closes
          regardless of how fresh the roster itself is.
        name: SubjectValue
        struct:
          fields:
            - doc: |-
                Fingerprint is the SHA256 fingerprint of the subject's public key.
                Recording the fingerprint rather than the key itself keeps the roster
                small and makes the comparison exact.
              name: Fingerprint
              tag: json:"fp"
              type: string
            - doc: |-
                ExpiresAt closes this subject's individual term. The zero value means
                no term was recorded, which is treated as no expiry rather than an
                instantly-closed one — a subject published before this field existed
                must not be locked out by its mere absence.
              name: ExpiresAt
              tag: json:"exp"
              type: time.Time
  - codes:
      - const:
          - doc: |-
              CodeCacheUnwritable identifies an offline cache that could not be replaced.

              It is never a refusal. The verification that produced the bundle already
              succeeded, and what is lost is the next start-up's ability to answer without
              the network — which is why rememberRoster logs it and carries on rather than
              returning it. The code exists so that line has something to name, and so the
              step that failed (mkdir, create, write, close, rename) travels as a field
              instead of as prose.
            name: CodeCacheUnwritable
            note: "range: 0.3.67.0 - 0.3.67.255"
            value: "0x00_03_43_01"
        type: errs.Code
    constants:
      - doc: |-
          ActionsJWKSURL is where GitHub publishes the keys. Fixed, https, and never
          taken from a token: letting the thing being verified choose its own key
          source is the whole trust decision handed to the attacker.
        name: ActionsJWKSURL
        type: string
        value: "\"https://token.actions.githubusercontent.com/.well-known/jwks\""
      - doc: ActionsIssuer is the only issuer whose tokens mean anything here.
        name: ActionsIssuer
        type: string
        value: "\"https://token.actions.githubusercontent.com\""
      - doc: |-
          DefaultActionsAudience is the audience a product that names none falls back
          to. A product SHOULD set its own: an audience shared between products lets a
          token minted for one satisfy the other's gate.

          A dedicated audience matters: a token minted for some other service — a
          cloud provider, a registry — must not be replayable here, and `aud` is what
          keeps the two apart. It is chosen by us, not by the caller, precisely so a
          workflow cannot request a token this verifier will accept for a purpose it
          never agreed to.
        name: DefaultActionsAudience
        type: string
        value: "\"kitsunium-sdk-entitlement\""
    doc: |-
      Package entitlement — the trust anchors this verifier accepts, and why there
      is more than one of them.

      # The rotation that had no in-band path

      One anchor is one key with no way out. An installation whose anchor must
      change — because the vendor's signing key is being retired, or because it was
      compromised — had no path in band: rosters signed by a new key B are refused
      against the anchor A the binary links in, BEFORE anything reads the version
      floor that would have told it to upgrade; and a release signed by B is refused
      by the very installation that needs it. Blocked from both sides, with the only
      remaining route out of band — an operator fetching a binary by hand.

      Accepting an ORDERED LIST of anchors is what opens that path: publish B, and
      the installations carrying {A, B} take it while those carrying only {A} keep
      reading A's rosters until they are updated. Neither side has to be updated
      first, which is the whole of what rotation needs.

      # The tension, stated rather than hidden

      Every anchor on the list is a key whose compromise is ACCEPTED for as long as
      it stays there. A list is therefore strictly more surface than a single key,
      and the mitigation is not a mechanism — it is that the list is ORDERED, BOUNDED
      at maxAnchors, and decided at BUILD time. Nothing at runtime can add to it: no
      roster field, no environment variable, no cache file. A compromised key leaves
      the list the way it entered — by shipping a build without it — and the bound is
      what keeps that a decision somebody has to make rather than a slot that is
      always free.

      Package entitlement - the published bundle: roster and signature in ONE
      document, because two documents cannot be fetched atomically.

      Package entitlement - the offline fallback: re-presenting a roster this machine
      already authenticated, under exactly the freshness rules that would apply to
      the same bytes coming off the wire.

      This reverses half of a documented decision, so it states which half.
      Service used to hold no cache at all, on the grounds that "a disk cache able
      to authorize would let a frozen file (or a frozen clock) keep a revoked
      subject running forever". The frozen FILE is answered here and was never the
      risk it looked like: the cached bytes are the vendor's own signed bundle,
      they go back through ParseBundle on every read, and coreent.ParseRoster refuses a
      window wider than coreent.RosterLifetime, one that has not opened, and one that has
      closed. A frozen file therefore stops authorising at its own ExpiresAt —
      which is the bound errors.go already advertises for coreent.ErrRosterStale ("it
      bounds how long a revoked client keeps working offline"), a sentence that
      described nothing until this file existed.

      The frozen CLOCK is NOT answered, and no local mechanism can answer it. Every
      source of time an offline process can read — the system clock, file mtimes,
      a monotonic counter that dies at reboot — belongs to the party being checked.
      It was not answered before this file either: a captured bundle served from a
      local origin, behind a trust store the holder controls, with the clock parked
      inside its window, ran the binary indefinitely without any cache. What this
      file changes for such a holder is the effort, not the outcome; what it
      changes for an honest one is that a laptop off the network keeps working
      until the last roster it saw expires.

      Package entitlement - exclusion over the cache directory, which is the one
      thing write-then-rename does not provide.

      Renaming a staged file over an installed one is atomic for a READER: nobody
      ever observes half a bundle at the name they look for. It says nothing about
      two WRITERS, and the ratchet is not a write — it is a read, a comparison and
      a write, and the comparison is only worth anything if nothing moves between
      it and the write it guards.

      The exclusion is also what lets a refresh land on Windows. There, replacing
      a file another handle holds open is refused, and every file Go opens is held
      that way: syscall.Open asks for FILE_SHARE_READ|FILE_SHARE_WRITE and never
      FILE_SHARE_DELETE. Keeping readers and the writer off the bundle at the same
      time removes the collision rather than retrying past it. Sharing DELETE from
      the read side is NOT an alternative: measured on windows-latest, MoveFileEx
      still refuses a destination held with FILE_SHARE_DELETE — see
      Test_windowsRenameOverAnOpenDestination, which asserts all three share modes
      on a real kernel, and ADR 0079's Deferred section for what is still open.

      Package entitlement - the read side of the cache guard where the kernel
      already provides what the guard would buy.

      Package entitlement - the read side of the cache guard where the kernel
      does not provide it, and a reader is what breaks a writer.

      Package entitlement - obtaining the proof that a run is CI.

      The token itself is fetched from the runner, which means the URL and the
      bearer credential both arrive as environment variables — attacker-controlled
      input by the same standard as everything else this package reads. They are
      validated before use rather than trusted because of where they came from.

      Package entitlement - authorising a CI run instead of a device.

      A proven CI run costs no device seat, so it is tried before the device path.
      Every failure here is silent and falls through: not being in CI, having no
      token, not being covered are all ordinary situations, and the device check
      is what answers next. Only a device failure is ever reported to a human,
      because only a device failure is something they can act on.

      Package entitlement — the crypto domain's operations this engine uses: a
      signature check and two digests, asked through pkg/v1 rather than crypto/*
      (ADR 0158 §2). RS256, which the crypto domain has no scheme for, is not here:
      it is oidc.go's, and its doc comment says why it stays local.

      Package entitlement — the one error code this IMPLEMENTATION owns and the
      sentinel that carries it, as opposed to the fifteen the CONTRACT declares in
      framework/internal/core/entitlement.

      The split is the same one ADR 0079 drew through the domain: core names the
      operator situations every implementation of the port must be able to report —
      revoked, expired, unreachable, no possession — and this range names the
      failures that exist only because this engine has a cache, a network and a
      filesystem. A caller matching on the contract's codes is unaffected by
      anything declared here.

      The code and its sentinel share a file rather than the codes.go / errors.go
      pair the larger service packages use: with exactly one of each, splitting
      them puts a two-member group across two files and nothing else in either,
      which is what KTN-STRUCT-PARTITION is for.

      Registered in design/sdk.yaml's codes.ranges, which kit writes into
      codeRangeOwners (ADR 0035, ADR 0164), and in //:audit_sources, so a
      code declared here that reaches into another package's range fails the build
      rather than passing quietly.

      The Public below is wire-safe and names no path: the public half is the one
      documented safe to put in a response body, and every input this package has
      is a publication endpoint, an untrusted document or a directory on somebody's
      disk. Where it happened lives in Private and in Fields, and diagnose renders
      them for the one place here that is a log rather than a wire.

      Package entitlement - refusing a JSON document that names one member twice.

      encoding/json accepts {"a":1,"a":2} and keeps the LAST value, silently. The
      roster's signature covers the RAW bytes and is verified before any decoding,
      so this is not a forgery a third party can mount: what it is, is a divergence
      between the party that PUBLISHED a document and the party that READS it. Two
      readers of one byte-identical, correctly signed payload — one keeping the
      first member, one keeping the last — hold different rosters and can both
      prove the vendor signed what they hold.

      Refusing is the only reading that cannot contradict anybody. RFC 8725 §2.6
      states the same rule for the JWT case.

      It is not pkg/v1/data/codec/strictjson, although ADR 0158 §2 sends JSON there and
      strictjson refuses a duplicate name too. strictjson also refuses every member
      its target does not declare — ADR 0102's one reading, with no mode to relax
      it — and the four documents read here must ignore one: RFC 7517 §4 for a JWK
      member, RFC 7519 §4 for a claim, and a signed roster an older client still
      has to read once the vendor adds a field. Measured: a JWK carrying a member
      its decoding type does not declare is refused MEMBER_UNKNOWN by strictjson.

      Package entitlement - the published keys GitHub signs its OIDC tokens with.

      Unlike the roster, this set carries no vendor signature: it is authenticated
      by TLS to a fixed host and nothing else. That is weaker, and it is why a
      token verified against it grants only a free CI seat — never a licence. The
      worst a substituted JWKS can do is hand out seats it should not; it cannot
      make an unlicensed machine licensed, because the device path does not
      consult it at all.

      Package entitlement - proving a run is CI, rather than taking its word for it.

      A CI seat is free, so "am I in CI?" becomes a question worth lying about.
      Every environment variable that answers it — CI, GITHUB_ACTIONS, the absence
      of a TTY, the hostname — is one `export` away from being whatever the caller
      wants, so granting anything on that basis makes the device quota decorative.

      GitHub Actions can answer it properly. A workflow granted `id-token: write`
      can exchange two runner-injected values for a JWT signed by GitHub, whose
      claims name the repository and its owner. The request token is an ephemeral
      runner secret: someone outside Actions cannot obtain one, and nobody can
      forge the signature without GitHub's private key.

      What this does NOT prove is that the process holding the token is the job it
      was minted for. A token exfiltrated from a legitimate run stays usable off-CI
      until it expires. Closing that needs a server-side nonce, which the offline
      verification model rules out, so the residue is accepted and stated.

      Stated as what it IS, which is not what this comment used to claim. "The
      exposure is one free seat" was never demonstrated and is not true. A short
      token bounds the DURATION a stolen proof keeps working; it says nothing about
      the NUMBER of processes that can present it at once. Nothing ties a token to a
      consumer: VerifyActionsToken is pure and offline, it keeps no record of what it
      has already admitted, and two verifiers could not share one if it did. So one
      leaked token satisfies every verifier it reaches, all of them at the same time,
      for as long as it is valid.

      The honest bound is ONE FREE SEAT PER VERIFIER FOR UP TO 32 MINUTES:
      maxTokenLifetime (30 min) is the widest window a token may claim, clockSkew
      (2 min) is what checkTiming allows on top when admitting one, and their sum is
      how long after minting a stolen token still verifies. What makes that a bound
      rather than a sentence is ciseat.go handing the token's own expiry to
      coreent.GrantDeadline — without it the GRANT outlived the proof by up to a day,
      and the duration this paragraph names described nothing at all.

      Package entitlement — the product: which vendor's roster this binary trusts,
      and the names its artefacts carry.

      Package entitlement — parsing and authenticating a published roster.

      The signature check lives HERE rather than with the value it produces: core
      declares what a roster IS, and verifying one is a mechanism with a
      cryptographic dependency and a freshness policy.

      Package entitlement - Roughtime: an Ed25519-signed statement of the current time,
      bound to a nonce this process just drew.

      What it is FOR, stated narrowly because the honest scope is narrow. The clock
      ratchet in cache.go catches a clock moving backwards past vendor-signed
      evidence; it cannot catch a clock that is simply wrong in a direction the
      ratchet never sees, and its resolution is the roster's publication interval.
      A signed timestamp bound to a fresh nonce answers both, and it is the only
      shape that does: an unsigned source (an NTP reply, an HTTPS Date header) is
      forged by anyone on the path, and a signed source without a nonce is replayed
      from a capture.

      What it is NOT. It needs the network, so it contributes nothing in the case
      the offline grace window exists for — and an adversary who can substitute an
      origin can also drop UDP to a nonstandard port, which is the entire cost of
      evading it. It is therefore ADVISORY: unreachable or unverifiable means no
      signal and the verification proceeds, because refusing a legitimate user
      whose network blocks port 2002 would trade a real cost for a defence that
      attacker never has to face.

      It also never advances the ratchet, and that restriction is load-bearing. A
      response this package accepted in error could otherwise pin the high-water
      mark into the future and refuse the machine permanently. The only thing a
      Roughtime answer can do is refuse a clock that disagrees with it NOW.

      # Interoperability is unverified

      The constants below are taken from the Roughtime draft, and this client has
      never completed a handshake with a live server: UDP/2002 is filtered on the
      network this was written on, and three independent servers were probed with
      both protocol variants for a total of zero replies. The verifier is tested
      against a server fixture in this package, which proves it is self-consistent
      and NOT that it speaks the same dialect as Cloudflare or Netnod.

      RoughtimeServers is empty in committed source for exactly that reason, in the
      same spirit as vendorPublicKeyB64: the mechanism ships, the anchor does not.
      Populating it is a deliberate act by somebody who has watched this client
      verify a real response, and until then every path here is inert.

      Package entitlement - verifying a Roughtime answer.

      Three signatures and a proof, in an order chosen so nothing downstream runs
      on bytes upstream has not vouched for: the long-term key signs a delegation,
      the delegated key signs the response, the response commits to a Merkle root,
      and the root is shown to contain the nonce this process drew a moment ago.
      Drop any one of the four and the answer becomes replayable, forgeable, or
      about somebody else's request.

      Package entitlement - the Roughtime tagged-message encoding.

      Split from roughtime.go because it is pure parsing of untrusted bytes and
      nothing else: every function here reads a length or an offset that a hostile
      server chose, so every one of them bounds-checks before it indexes. Keeping
      that apart from the signature checks makes it possible to read either half
      without holding the other in your head.

      Package entitlement - orchestration: turn local key material plus a signed
      roster into a grant, or refuse. The fetch is attempted on every cold
      verification and the only thing on disk allowed to stand in for it is a
      bundle this machine already authenticated, read back through the same
      signature and freshness checks — never a decision, always the same document.

      Package entitlement - the mandatory-update floor. The roster says which
      version is the lowest allowed to run; this decides whether the binary
      asking is above it.

      Package entitlement — the three shapes every error in this package is built
      with, so the choice at a call site is which sentinel rather than which
      spelling.

      The split between the first two is whether this package DECIDED the failure
      or was TOLD about one. A decision has no cause to carry — nothing failed, a
      rule was applied to a document — and the sentinel itself is the whole of it.
      A report from outside has a cause that must survive, because
      errors.Is(err, fs.ErrNotExist) and the text the operating system wrote are
      the two things a wrapper most often destroys.

      The third, annotate, adds a field to an error whose identity belongs to
      somebody else.
    functions:
      - doc: |-
          ParseBundle decodes a published bundle and authenticates the roster inside
          it. It is the only entry point production uses; ParseRoster remains for
          callers that already hold the two byte slices.
        in:
          - name: raw
            type: "[]byte"
          - name: vendor
            type: ed25519.PublicKey
          - name: now
            type: time.Time
        name: ParseBundle
        out:
          - name: roster
            type: "*coreent.RosterValue"
          - name: err
            type: error
      - doc: |-
          InCI reports whether this process can even attempt to prove it is a CI run.

          It is deliberately NOT an entitlement check: both variables being present
          means only that a token could be requested. Anyone can set them, which is
          exactly why proving anything requires the signature that follows.
        name: InCI
        out:
          - type: bool
      - doc: |-
          RequestActionsToken exchanges the runner's credentials for an OIDC token.

          The audience is ours and is set here rather than taken from anywhere: a
          workflow must not be able to ask for a token this verifier will then accept
          for a purpose it never agreed to.
        in:
          - name: get
            type: BearerFetch
          - name: audience
            type: string
        name: RequestActionsToken
        out:
          - name: token
            type: string
          - name: err
            type: error
      - doc: |-
          DefaultBearerFetch is the transport the mint request should use.

          It refuses redirects outright. checkTokenURL vouches for the URL it is
          GIVEN, and a redirect is a second destination nobody checked: Go's default
          client decides whether to forward an Authorization header by comparing
          HOSTS, not schemes, so a same-host https→http redirect would put the
          runner's credential on the wire in plaintext. There is no legitimate
          redirect on this endpoint, so the safe answer and the correct one coincide.

          It builds a net/http client over http.DefaultTransport rather than reaching
          for pkg/v1/net/client: the guarded transport ignores HTTP(S)_PROXY, which a
          self-hosted runner may depend on, and its configuration documents no way to
          follow no redirect at all — a zero MaxRedirects is its default of three.
        in:
          - name: url
          - name: bearer
            type: string
        name: DefaultBearerFetch
        out:
          - name: resp
            type: "*http.Response"
          - name: err
            type: error
      - doc: |-
          VerifyCI proves this run is CI for an entitled account, or explains why not.

          keys are the published JWKS entries; roster is the already-authenticated
          roster. Both are passed in so this stays a pure decision: the caller owns
          the fetching, and every refusal here is a property of the token or of the
          roster rather than of the network.

          audience is the product's own OIDC audience. It is a parameter rather than a
          constant because an audience shared between two products lets a token minted
          for one satisfy the other's gate — see ProductValue.CIAudience.
        in:
          - name: get
            type: BearerFetch
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: roster
            type: "*coreent.RosterValue"
          - name: audience
            type: string
          - name: now
            type: time.Time
        name: VerifyCI
        out:
          - name: claims
            type: "*ActionsClaimsValue"
          - name: err
            type: error
      - doc: |-
          ParseJWKS decodes a key set and builds the usable RSA keys from it.

          Unusable entries are skipped rather than fatal: GitHub may publish a key
          type or use this package does not verify, and refusing the whole set over
          one of them would take down every CI seat for a reason unrelated to any of
          them. A set with NO usable key is an error, because that is
          indistinguishable from having no keys at all.
        in:
          - name: raw
            type: "[]byte"
        name: ParseJWKS
        out:
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: err
            type: error
      - doc: |-
          VerifyActionsToken authenticates a GitHub Actions OIDC token and returns what
          it asserts.

          keys are the JWKS entries fetched from GitHub. Passing them in rather than
          fetching here keeps this function offline and total: every refusal below is
          a property of the token, so a test can cover them without a network, and the
          fetch's own failure modes stay where the other network code lives.

          The order is deliberate: structure, then algorithm, then signature, then
          claims. Nothing about the payload is trusted until the signature over it has
          verified — reading a claim first and acting on it is how a forged token gets
          to choose what it is checked against.
        in:
          - name: raw
            type: string
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: audience
            type: string
          - name: now
            type: time.Time
        name: VerifyActionsToken
        out:
          - name: claims
            type: "*ActionsClaimsValue"
          - name: err
            type: error
      - doc: |-
          ParseRoster decodes and authenticates a roster. Signature verification runs
          before any field is trusted, and `now` is passed in rather than read from
          the clock so callers can test the boundary.
        in:
          - name: raw
          - name: sig
            type: "[]byte"
          - name: vendor
            type: ed25519.PublicKey
          - name: now
            type: time.Time
        name: ParseRoster
        out:
          - name: roster
            type: "*coreent.RosterValue"
          - name: err
            type: error
      - doc: |-
          QueryRoughtime asks one server what time it is and verifies the answer.

          The nonce is drawn here rather than taken from the caller: freshness is the
          only thing separating this from a replayed capture, and a caller that could
          supply the nonce could supply yesterday's.
        in:
          - name: server
            type: RoughtimeServerValue
        name: QueryRoughtime
        out:
          - name: midpoint
            type: time.Time
          - name: radius
            type: time.Duration
          - name: err
            type: error
      - doc: |-
          NewService builds a verifier over the caller's ssh directory.

          One anchor, which is the single-key form every caller had before rotation was
          possible: it is the one-element list and not a second representation, so no
          path in this package can disagree with the multi-anchor one about what a
          single key means.
        in:
          - name: identity
            type: coreent.Identity
          - name: vendor
            type: "[]byte"
          - name: product
            type: "*ProductValue"
        name: NewService
        impl: newService
        out:
          - type: "*Service"
      - doc: |-
          NewServiceWithAnchors builds a verifier that accepts several vendor keys, in
          the order given.

          This is what a build in the middle of a key rotation links in: the key being
          retired and the key replacing it, so rosters signed by either are authentic
          here while installations carrying only one of them keep working. See anchors.go
          for the rotation this opens and for the surface it costs.
        in:
          - name: identity
            type: coreent.Identity
          - name: anchors
            type: "[][]byte"
          - name: product
            type: "*ProductValue"
        name: NewServiceWithAnchors
        out:
          - type: "*Service"
      - doc: NewServiceWithGetter builds a verifier over an injected getter.
        in:
          - name: client
            type: Getter
          - name: identity
            type: coreent.Identity
          - name: vendor
            type: "[]byte"
          - name: product
            type: "*ProductValue"
        name: NewServiceWithGetter
        out:
          - type: "*Service"
      - doc: |-
          NewServiceWithOrigins builds a verifier over an injected getter and an
          explicit origin list, so a test can exercise the fallback order — which
          origin wins, and what happens when the first few are unusable — without
          naming production endpoints.
        in:
          - name: client
            type: Getter
          - name: identity
            type: coreent.Identity
          - name: vendor
            type: "[]byte"
          - name: origins
            type: "[]coreent.OriginValue"
        name: NewServiceWithOrigins
        out:
          - type: "*Service"
      - doc: |-
          RequiresUpdate reports whether `current` is below the roster's floor.

          The comparison is SemVer, not string ordering: "v1.5.9" sorts after
          "v1.5.14" lexically, which would let exactly the builds a floor is meant
          to retire keep running.

          Two cases deliberately do NOT require an update:

            - No floor recorded. A roster published before this field existed must
              not lock out every client that predates it.
            - A binary NEWER than the floor. A release candidate under test, or a
              mirror that was rolled back, must keep working — the updater only ever
              moves forward, so refusing a newer build would leave it with no way
              out at all.

          "Cannot be ordered" is NOT one case but two, and they fail in OPPOSITE
          directions. Treating them alike is what made the floor optional:

            - An unparseable FLOOR fails OPEN. A typo in the roster is the vendor's
              mistake, and bricking every client in the field over it would be far
              worse than a missed upgrade prompt. The licence check itself is
              unaffected.
            - An unparseable, absent or unstamped CURRENT fails CLOSED. "dev" used to
              pass here on the grounds that a source build "carries no anchor either"
              — true of the ordinary developer loop, and irrelevant to the case that
              matters: a build that DOES carry an anchor and reports "dev" satisfied
              the licence check while ignoring the floor entirely. The same held for
              a caller that simply never called WithVersion, which is one forgotten
              method call away and was already true of `license status`.

          The asymmetry is the point. A binary cannot demonstrate it is at or above
          a bar it cannot name, and the action that resolves it — install a published
          build — is precisely what coreent.ErrUpdateRequired already asks for. The cost is
          stated where it is paid: an anchored build whose version stamp failed is
          refused, and the ordinary unanchored developer loop never reaches this
          function at all because enforceLicense returns before Verify is called.
        in:
          - name: current
          - name: floor
            type: string
        name: RequiresUpdate
        out:
          - type: bool
      - doc: UpdateRefusal builds the error a caller reports when the floor is not met.
        in:
          - name: current
          - name: floor
            type: string
        name: UpdateRefusal
        impl: updateRefusal
        out:
          - type: error
    imports:
      coreent: github.com/kitsunium/sdk/framework/internal/core/entitlement
      ed25519: crypto/ed25519
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      lock: github.com/kitsunium/sdk/pkg/v1/app/lock
      rsa: crypto/rsa
    path: github.com/kitsunium/sdk/framework/internal/service/entitlement
    sentinels:
      - var:
          - code: CodeCacheUnwritable
            doc: |-
              CacheUnwritable is returned when the offline bundle cannot be replaced.

              It is deliberately NOT a refusal, and nothing upstream treats it as
              one: the verification that produced these bytes has already succeeded,
              and a cache nobody can write costs the offline fallback and nothing
              else. rememberRoster logs it and carries on, which is the whole of its
              reachability — pinned by
              Test_rememberRoster_keepsWhatItCanAndSurvivesWhatItCannot.
            name: CacheUnwritable
            private: "service/entitlement: staging or installing the cached bundle failed; the fields name the step and the path"
            public: the offline entitlement cache could not be written
            reason: CACHE_UNWRITABLE
    types:
      - decl: true
        doc: |-
          BundleValue is what a publication point actually serves: the roster's exact
          bytes and the vendor's signature over them, in a single object.

          It exists because the roster and its detached signature used to be two
          files, and two files cannot be fetched atomically. raw.githubusercontent.com
          caches each object independently with max-age=300, so for up to five minutes
          after every re-signature a client could receive a NEW signature over an OLD
          roster — measured on the live endpoints, not hypothesised. That mismatch is
          indistinguishable from forgery, so the client refused with the most alarming
          error the scheme has (coreent.ErrRosterUnsigned, the spoofing case) while nothing
          was wrong. With hourly signing that is roughly 8% of all wall-clock time.

          One object cannot desynchronise with itself. It also halves the cold-start
          cost, since there is now one round trip instead of two.
        name: BundleValue
        struct:
          fields:
            - doc: |-
                Payload is the roster document, base64. Carrying the bytes rather than
                a nested object is what keeps the signature verifiable: it covers this
                exact byte sequence, and re-serialising a decoded struct would not
                reproduce it.
              name: Payload
              tag: json:"payload"
              type: string
            - doc: |-
                Signature is the vendor's detached ed25519 signature over the decoded
                payload, base64.
              name: Signature
              tag: json:"sig"
              type: string
      - decl: true
        doc: |-
          JWKValue is one published signing key, in the JWK shape.

          Only the fields needed to rebuild an RSA public key and to decide whether it
          may verify a signature are declared. Anything else GitHub publishes is
          ignored on purpose: a field that is not read cannot be relied on by
          accident.
        name: JWKValue
        struct:
          fields:
            - doc: KeyType must be RSA for anything this package can verify.
              name: KeyType
              tag: json:"kty"
              type: string
            - doc: KeyID is what a token's `kid` header selects.
              name: KeyID
              tag: json:"kid"
              type: string
            - doc: |-
                Use, when present, must be "sig": a key published for encryption is
                being repurposed if it verifies signatures.
              name: Use
              tag: json:"use"
              type: string
            - doc: Algorithm, when present, must be RS256.
              name: Algorithm
              tag: json:"alg"
              type: string
            - doc: Modulus is the RSA modulus, base64url, minimally encoded.
              name: Modulus
              tag: json:"n"
              type: string
            - doc: Exponent is the RSA public exponent, base64url, minimally encoded.
              name: Exponent
              tag: json:"e"
              type: string
      - decl: true
        doc: JWKSValue is a published key set.
        name: JWKSValue
        struct:
          fields:
            - doc: Keys are the published signing keys.
              name: Keys
              tag: json:"keys"
              type: "[]JWKValue"
      - decl: true
        doc: |-
          ActionsClaimsValue is what a verified GitHub Actions token asserts.

          Only the claims this package acts on are decoded. Everything else GitHub
          puts in the token is deliberately ignored: a field that is not read cannot
          be relied on by accident.
        name: ActionsClaimsValue
        struct:
          fields:
            - doc: |-
                Issuer must be ActionsIssuer; anything else is another identity
                provider entirely.
              name: Issuer
              tag: json:"iss"
              type: string
            - doc: |-
                Subject identifies the workflow context. It is recorded for diagnostics
                and policy, never parsed for ownership: its format varies with
                environments, customisation and GitHub's immutable-subject rollout, so
                reading an owner out of it would break silently.
              name: Subject
              tag: json:"sub"
              type: string
            - doc: |-
                Audience is who the token was minted for. GitHub emits a single string;
                the JWT spec allows an array, so both are accepted on decode.
              name: Audience
              tag: json:"aud"
              type: audienceClaim
            - doc: |-
                RepositoryOwnerID is the entitlement key: the account id, which survives
                renames and cannot be reused. RepositoryOwner is the display name for
                the same account and must never be what a licence matches on — a freed
                handle can be claimed by someone else.

                GitHub sends a decimal string and nothing here VALIDATES that: the only
                check is that it is non-empty, and the value is compared to the roster's
                keys by string equality. "Numeric" therefore describes what the issuer
                emits, not a property this package enforces — and it does not need to,
                because a value that is not one of the roster's keys is not entitled
                whatever its shape. A decimal check would be a second syntax for a
                comparison that is already exact.
              name: RepositoryOwnerID
              tag: json:"repository_owner_id"
              type: string
            - doc: RepositoryOwner is the account's current login, for diagnostics only.
              name: RepositoryOwner
              tag: json:"repository_owner"
              type: string
            - doc: Repository is "owner/name", for diagnostics and optional narrowing.
              name: Repository
              tag: json:"repository"
              type: string
            - doc: |-
                EventName is the workflow trigger, DECODED AND READ BY NOTHING. It is
                carried so a diagnostic can print it and so a future policy would not
                have to change the wire shape to see it.

                It used to say pull_request_target "runs with the base repository's
                identity while potentially executing code from a fork, so a policy may
                want to refuse it" — which is true of Actions and describes no
                behaviour of this package. Four lines above, this type's own doc
                comment says a field that is not read cannot be relied on by accident;
                a field whose comment describes a policy is exactly how that gets
                relied on. Test_VerifyActionsToken_ignoresTheClaimsNothingReads makes
                the silence mechanical.
              name: EventName
              tag: json:"event_name"
              type: string
            - doc: |-
                RunnerEnvironment distinguishes "github-hosted" from "self-hosted",
                DECODED AND READ BY NOTHING, for the same reason and with the same
                warning as EventName above.
              name: RunnerEnvironment
              tag: json:"runner_environment"
              type: string
            - doc: ExpiresAt, IssuedAt and NotBefore are NumericDate seconds.
              name: ExpiresAt
              tag: json:"exp"
              type: int64
            - doc: IssuedAt is when GitHub minted the token.
              name: IssuedAt
              tag: json:"iat"
              type: int64
            - doc: NotBefore is when the token becomes usable.
              name: NotBefore
              tag: json:"nbf"
              type: int64
      - decl: true
        doc: |-
          ProductValue names the product whose entitlement is being verified, and where
          its roster is published.

          It is the whole of what the source implementation kept as package constants:
          the publication origins, the cache directory name, the OIDC audience, and the
          enrolment issue URL. Every one is a property of one vendor's distribution
          rather than of the verification mechanism, and together they are the only
          reason a correct implementation served exactly one binary.

          The zero value is usable and inert in the safe direction: no origins means
          nothing to fetch, so Verify refuses with RosterUnreachable rather than
          silently trusting anything.
        methods:
          - doc: |-
              DefaultCacheDir returns where the last authenticated roster is kept.

              An empty string means "no cache", which disables the offline fallback
              entirely rather than guessing at a location. That is the safe direction: a
              machine that cannot say where its cache lives falls back to requiring the
              network, which is the behaviour this package had before the cache existed.
            name: DefaultCacheDir
            out:
              - type: string
            recv: pointer
          - doc: |-
              Label is the name this product is known by, falling back to the package name
              when no product was configured.

              The receiver is a pointer on every method here because ProductValue is 72
              bytes — four strings and a slice header — and copying all of it to read one
              field is what KTN-VAR-BIGSTRUCT exists to catch. Hold the product in a
              variable and call on that.

              It tolerates a nil receiver, as every method here does: the one code path
              that runs when nothing else is working must not be the one that panics.

              It returns the product's name, or "entitlement" when there is none.
            name: Label
            impl: label
            out:
              - type: string
            recv: pointer
          - doc: |-
              PublishedOrigins returns the places this product's roster is published,
              tolerating a nil receiver as every accessor here does.

              It exists because the FIELD cannot: reading p.Origins off a nil product
              panics, and the two constructors did exactly that while the package
              documented the opposite. A nil product publishes nowhere, which is a
              verifier that will refuse with RosterUnreachable — the documented fallback,
              and a very different outcome from a panic at construction.

              It returns the product's publication points, or nil when there is no
              product.
            name: PublishedOrigins
            impl: publishedOrigins
            out:
              - type: "[]coreent.OriginValue"
            recv: pointer
          - doc: |-
              Validate reports the ways a product's origin list would fail it when it
              matters, which is the one moment nobody is watching: the day the roster
              cannot be fetched.

              The source implementation asserted these as a test over its own shipped
              constants. Moving the origins to the caller would have moved the property out
              of reach with them, so the assertions become a method any consumer can call —
              at construction, or in its own suite.

              Four things are checked, and the last is the one that is easy to get wrong:

                - no empty Name or BundleURL, since an origin that cannot be named cannot
                  be reported when it fails;
                - no duplicate name;
                - no duplicate URL, because two entries at one URL are one origin listed
                  twice rather than a fallback;
                - at least two DISTINCT hosts. Independent publication paths within one
                  repository do count — that is what survives a ruleset refusing the
                  signing bot's push to the default branch — but they must not all resolve
                  to the same host.

              It returns a joined error naming every failure rather than the first, because
              a caller fixing an origin list wants the whole list.
            name: Validate
            out:
              - type: error
            recv: pointer
        name: ProductValue
        struct:
          fields:
            - doc: |-
                Name is the product's binary name. It scopes the cache directory and
                labels generated key material.
              name: Name
              type: string
            - doc: |-
                Origins are the roster publication locations, tried in order. The first
                that answers with an authentic bundle wins.
              name: Origins
              type: "[]coreent.OriginValue"
            - doc: |-
                CIAudience is the OIDC audience a CI provenance token must carry. It must
                be unique to this product: a token minted for one audience must not
                satisfy another's gate.
              name: CIAudience
              type: string
            - doc: |-
                EnrolURL is where a new subject is directed to request enrolment. Empty
                means the product offers no self-service path.
              name: EnrolURL
              type: string
      - decl: true
        doc: |-
          RoughtimeServerValue is one server this client will ask, and the key it must
          answer with.

          The public key is the whole trust decision: a server is not trusted because
          of where it is, it is trusted because a statement carries its signature. That
          is the same rule the roster follows, with a different anchor.
        name: RoughtimeServerValue
        struct:
          fields:
            - doc: Name identifies the server in diagnostics.
              name: Name
              type: string
            - doc: Address is "host:port", reached over UDP.
              name: Address
              type: string
            - doc: |-
                PublicKey is the server's long-term ed25519 public half, which signs
                the delegation that in turn signs each response.
              name: PublicKey
              type: ed25519.PublicKey
      - decl: true
        doc: |-
          Getter performs the roster HTTP GETs. Injected so tests exercise the
          admission logic without a network.
        interface:
          methods:
            - doc: Get retrieves a URL.
              in:
                - name: url
                  type: string
              name: Get
              out:
                - type: "*http.Response"
                - type: error
        name: Getter
      - decl: true
        doc: |-
          BearerFetch performs the one request in this package that carries a
          credential.

          A function rather than an interface: only this request needs an
          Authorization header, and widening Getter would put a bearer parameter on
          the roster fetch, which must never send one. Naming it as a single-method
          interface would also force the -er form of GetWithBearer, which is not a
          word.
        name: BearerFetch
        underlying: func(url, bearer string) (resp *http.Response, err error)
      - decl: true
        doc: |-
          Service verifies entitlement.

          It DOES keep the last bundle it authenticated, which reverses half of an
          earlier decision — "it holds no cached roster on purpose: a disk cache able
          to authorize would let a frozen file (or a frozen clock) keep a revoked
          subject running forever". The frozen file is answered: the cached bytes go
          back through ParseBundle on every read, so a frozen copy stops authorising
          at its own ExpiresAt, at most coreent.RosterLifetime after it was signed. The frozen
          clock is not answered and cannot be, here or anywhere else in an offline
          binary — it was not answered before the cache existed either. cache.go
          carries the full argument, next to the code it justifies.
        methods:
          - doc: |-
              WithCache points the offline fallback at a directory, or disables it with "".

              Only NewService sets this in production, and only the test constructors leave
              it empty: a Service built with an injected getter must not touch a real
              filesystem unless the test asked it to.
            in:
              - name: dir
                type: string
            name: WithCache
            impl: withCache
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithTimeServers points the clock corroboration at a set of Roughtime servers,
              or disables it with an empty list.

              Separate from the constructor because it is off by default and because the
              list is a trust decision — each entry pins a public key — that belongs to
              whoever assembled the binary rather than to this package.
            in:
              - name: servers
                type: "[]RoughtimeServerValue"
            name: WithTimeServers
            impl: withTimeServers
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithBearerFetch replaces the transport used for the Actions token mint.

              Only a test should need this. The default refuses redirects, which is what
              keeps the runner's credential from being forwarded to a destination
              checkTokenURL never vouched for.
            in:
              - name: fetch
                type: BearerFetch
            name: WithBearerFetch
            impl: withBearerFetch
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithOrigins replaces the publication points this verifier will try.

              It changes WHERE the roster is looked for and nothing about whether the
              answer is believed: authority comes from the vendor signature, never from the
              origin that served the bytes, so pointing this at a hostile endpoint gains
              that endpoint nothing — it can serve whatever it likes and still cannot forge
              the anchor. That is what makes the setter safe to expose at all.

              An empty list is a construction error rather than a way to disable the fetch,
              and currentRoster says so rather than reporting an unreachable roster nobody
              asked for.
            in:
              - name: origins
                type: "[]coreent.OriginValue"
            name: WithOrigins
            impl: withOrigins
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithVersion records the binary's own version so Verify can apply the
              roster's mandatory-update floor.

              It is a separate call rather than a constructor parameter because
              pkg/license must not import the command package that owns the version
              string, and because a caller with nothing to declare — a test, a tool
              embedding the check — should not have to invent one.
            in:
              - name: version
                type: string
            name: WithVersion
            impl: withVersion
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithAnchors replaces the vendor keys this verifier accepts.

              It takes the full ORDERED list and does not add to what the constructor
              recorded: an additive setter would make the order depend on the call sequence,
              and the order is the build's statement of which anchor is current. The list
              the caller passes is the list, and the constructor's key is not implicitly
              first in it.

              A separate call rather than a parameter on every constructor because the
              single-key form is the common one and must keep reading as it does; this is
              what a test, or a build assembling its anchors from somewhere other than a
              constant, reaches for. NewServiceWithAnchors is the production spelling.

              An empty list is not a way to disable authentication: parseBundleAnyAnchor
              refuses every document with coreent.ErrRosterUnsigned, because with no anchor
              no signature can be valid.
            in:
              - name: anchors
                type: "[][]byte"
            name: WithAnchors
            impl: withAnchors
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              Verify performs a full cold verification: fetch, authenticate, match, and
              prove possession. Every call reaches for the network first — this is the
              path a fresh process takes — and when no origin answers it falls back to the
              last bundle this machine authenticated, which is refused by the same
              signature and window rules that would refuse it over HTTPS. A machine that
              has never fetched one successfully still cannot start.

              The ORDER below is load-bearing, and neither the offline fallback nor the
              clock ratchet disturbs it. The ratchet runs FIRST, before anything reads a
              date: a function that is about to compare four deadlines against the local
              clock should establish that the clock has not been moved before it starts,
              not after. The
              mandatory-update floor runs BEFORE the subject is looked up on purpose: an
              out-of-date binary must be told to upgrade whether or not its licence is
              also in order, and the upgrade path is the same either way. Because the
              cached roster is substituted inside currentRoster rather than around it,
              that floor applies to a cached document exactly as it does to a fetched one
              — which is what stops an out-of-date binary from skipping it by going
              offline, including by going offline with a copy in hand.
            in:
              - name: now
                type: time.Time
            name: Verify
            out:
              - name: grant
                type: coreent.GrantValue
              - name: err
                type: error
            recv: pointer
        name: Service
        struct:
          fields:
            - doc: client performs the roster fetches.
              name: client
              type: Getter
            - doc: |-
                identity is how this machine proves who it is. A port, because the one
                implementation that reads ssh key material needs a vendor dependency
                this module bans — see core/entitlement's package comment.
              name: identity
              type: coreent.Identity
            - doc: |-
                anchors are the vendor keys this verifier accepts, in the order the
                build declared them. A roster is authentic when it verifies against ANY
                of them, which is what gives a key rotation a path in band; the list is
                bounded and nothing at runtime can extend it, which is what keeps the
                surface it costs a decision rather than a default. anchors.go carries
                the argument, next to the code that applies it.
              name: anchors
              type: "[][]byte"
            - doc: |-
                origins is where the roster is looked for, in order. Held on the
                Service rather than read from the package global so a test can point
                it at a stub server without touching process-wide state.
              name: origins
              type: "[]coreent.OriginValue"
            - doc: |-
                product names the vendor whose roster this Service trusts, and scopes
                the cache, the CI audience and the enrolment URL. It carries what the
                source implementation kept as package constants.
              name: product
              type: "*ProductValue"
            - doc: |-
                version is this binary's own version, compared against the roster's
                mandatory-update floor. Empty disables the check, which is what a
                caller that has no version to declare gets.
              name: version
              type: string
            - doc: |-
                bearerFetch performs the one request that carries a credential: the
                Actions token mint. Held on the Service so a test can exercise the CI
                path without a network, and so the redirect-refusing default is what
                production gets without every caller having to remember it.
              name: bearerFetch
              type: BearerFetch
            - doc: |-
                cacheDir is where the last authenticated bundle is kept, or "" to
                disable the offline fallback entirely. Only NewService fills it: a
                Service built around an injected getter must not reach a real
                filesystem unless a test says so.
              name: cacheDir
              type: string
            - doc: |-
                cacheLockMu serialises the construction of cacheLock, which several
                goroutines can reach at once through the first verification.
              name: cacheLockMu
              type: sync.Mutex
            - doc: |-
                cacheLockFor is the directory cacheLock was built for, so retargeting a
                Service with WithCache rebuilds the guard instead of keeping one scoped
                to a directory nobody is using. The empty string means "never built".
              name: cacheLockFor
              type: string
            - doc: |-
                cacheLock serialises the cache directory against every other goroutine
                here and every other process on this machine, or is nil when no such
                lock is available. See cache_lock.go for what nil costs.
              name: cacheLock
              type: lock.Locker
            - doc: |-
                markFloorMu guards markFloor. Separate from cacheLockMu because the two
                are held for different reasons and one of them wraps a constructor.
              name: markFloorMu
              type: sync.Mutex
            - doc: |-
                markFloor is the newest document THIS PROCESS has authenticated, whether
                or not it managed to install it. The cached bundle is still the durable
                mark; this bounds it from below for as long as the process lives,
                because an install that stood down or failed does not un-authenticate
                the bytes that got it here. See raiseMarkFloor.

                A full markRecord and not an instant: the digest is what separates two
                statements signed at the same moment, and without it the floor could
                only refuse a document that is strictly older — leaving the case the
                disk comparison already refuses unrefused here.
              name: markFloor
              type: markRecord
            - doc: |-
                timeServers are the Roughtime servers consulted to corroborate the
                local clock. Empty disables the check, which is what committed source
                ships and what every test constructor gets: a Service must not reach
                the network for time unless somebody asked it to.
              name: timeServers
              type: "[]RoughtimeServerValue"
      - decl: true
        doc: |-
          UpdateRequiredError is the refusal raised when a binary sits below the
          roster's floor. It carries both versions as FIELDS, not just in its
          message, because the caller has to act on the floor and not merely print
          it: after upgrading it must check that the newly installed build actually
          clears the bar.

          Without that, a floor the published release cannot satisfy — a roster
          asking for v9.9.9 while the mirror still serves v1.5.10 — makes the gate
          upgrade to no effect, re-execute, refuse again, and loop forever. That is
          not hypothetical: it is what the end-to-end test did before this type
          existed.
        methods:
          - doc: |-
              Error renders both versions: "from what, to what" is the only question
              anyone asks at that point.
            name: Error
            out:
              - type: string
            recv: pointer
          - doc: |-
              Unwrap ties the typed error to the sentinel so errors.Is keeps working
              through the exit-code dispatch.
            name: Unwrap
            impl: unwrap
            out:
              - type: error
            recv: pointer
        name: UpdateRequiredError
        struct:
          fields:
            - doc: Current is the version of the binary that was refused.
              name: Current
              type: string
            - doc: Required is the lowest version the roster accepts.
              name: Required
              type: string
    variables:
      - doc: |-
          RoughtimeServers is the list this client queries, EMPTY in committed source.

          Empty means the network-time check does nothing, which is the correct state
          until somebody has watched this client verify a live response: an entry added
          on the strength of an untested implementation would either be inert anyway or
          — worse — start refusing machines over a parsing bug. Adding one is the same
          kind of decision as stamping the vendor anchor, and belongs to whoever can
          confirm it works.
        name: RoughtimeServers
        type: "[]RoughtimeServerValue"
