            type: "*http.Response"
          - name: err
            type: error
      - in:
          - name: get
            type: BearerFetch
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: roster
            type: "*coreent.RosterValue"
          - name: audience
            type: string
          - name: now
            type: time.Time
        name: VerifyCI
        out:
          - name: claims
            type: "*ActionsClaimsValue"
          - name: err
            type: error
      - in:
          - name: raw
            type: "[]byte"
        name: ParseJWKS
        out:
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: err
            type: error
      - in:
          - name: raw
            type: string
          - name: keys
            type: map[string]*rsa.PublicKey
          - name: audience
            type: string
          - name: now
            type: time.Time
        name: VerifyActionsToken
