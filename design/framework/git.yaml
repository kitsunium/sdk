apiVersion: kit.kitsunium/design/v2
domain: framework/git
packages:
  - aliases:
      - name: ChangedSet
        target: coregit.ChangedSet
      - name: LineRange
        target: coregit.LineRangeValue
      - name: Resolution
        target: coregit.ResolutionValue
      - name: Config
        target: svcgit.Config
      - name: Include
        target: svcgit.IncludeFunc
      - name: HeadState
        target: svcgit.HeadValue
    constants:
      - name: CodeRepositoryUnresolved
        type: errs.Code
        value: "0x00_02_21_01"
      - name: CodeCommandFailed
        type: errs.Code
        value: "0x00_02_21_02"
      - name: CodePathAbsent
        type: errs.Code
        value: "0x00_02_21_03"
    functions:
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: Config
        name: Resolve
        out:
          - type: Resolution
      - in:
          - name: ctx
            type: context.Context
          - name: root
            type: string
        name: GitDir
        out:
          - name: gitDir
            type: string
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: dir
            type: string
        name: Head
        out:
          - name: head
            type: HeadState
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: repoRoot
          - name: sha
          - name: relPath
            type: string
        name: ShowFile
        out:
          - name: content
            type: string
          - name: err
            type: error
    imports:
      coregit: github.com/kitsunium/sdk/framework/internal/core/git
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcgit: github.com/kitsunium/sdk/framework/internal/service/git
    path: github.com/kitsunium/sdk/framework/git
  - codes:
      - const:
          - doc: |-
              CodeRepositoryUnresolved identifies a path that is not inside a repository the
              implementation can read, or a repository probe that failed outright.
            name: CodeRepositoryUnresolved
            value: "0x00_02_21_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCommandFailed identifies a version-control command that exited non-zero.
              The stderr tail travels in Private, never in Public.
            name: CodeCommandFailed
            value: "0x00_02_21_02"
        type: errs.Code
      - const:
          - doc: |-
              CodePathAbsent identifies a path that does not exist at the requested commit,
              which is distinct from a path that exists and is empty.
            name: CodePathAbsent
            value: "0x00_02_21_03"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/framework/internal/core/git
    sentinels:
      - var:
          - code: CodeRepositoryUnresolved
            doc: |-
              RepositoryUnresolved is returned when a path is not inside a readable
              repository, or when the probe that would have told us failed.
            name: RepositoryUnresolved
            private: "core/git: the repository probe failed or the path lies outside any repository"
            public: the path is not inside a readable repository
            reason: REPOSITORY_UNRESOLVED
          - code: CodeCommandFailed
            doc: |-
              CommandFailed is returned when a version-control command exits non-zero.
              The command line and its stderr are attached as Private: they can name
              branches, paths and remotes, none of which belongs on a wire-safe surface.
            name: CommandFailed
            private: "core/git: the version-control command exited non-zero"
            public: the version-control command failed
            reason: COMMAND_FAILED
          - code: CodePathAbsent
            doc: |-
              PathAbsent is returned when a path does not exist at the requested commit.
              It is deliberately distinct from a successful read of an empty file: a
              caller reconstructing history has to tell "deleted" from "emptied".
            name: PathAbsent
            private: "core/git: the requested path is absent from the requested commit's tree"
            public: the path does not exist at that commit
            reason: PATH_ABSENT
    types:
      - interface:
          methods:
            - in:
                - name: absFile
                  type: string
                - name: line
                  type: int
              name: ContainsLine
              out:
                - type: bool
            - in:
                - name: absFile
                  type: string
              name: ContainsFile
              out:
                - type: bool
            - in:
                - name: absDir
                  type: string
              name: ContainsDir
              out:
                - type: bool
            - name: IsEmpty
              out:
                - type: bool
        name: ChangedSet
      - methods:
          - name: Degraded
            out:
              - type: bool
            recv: pointer
        name: ResolutionValue
        struct:
          fields:
            - name: Set
              type: ChangedSet
            - name: BaseRef
              type: string
            - name: BaseSHA
              type: string
            - name: HeadSHA
              type: string
            - name: FullFallback
              type: bool
            - name: Reason
              type: string
      - methods:
          - in:
              - name: line
                type: int
            name: Contains
            out:
              - type: bool
            recv: value
        name: LineRangeValue
        struct:
          fields:
            - name: Start
              type: int
            - name: End
              type: int
  - functions:
      - in:
          - name: repoRoot
            type: string
        name: NewChangedSetValue
        out:
          - type: "*ChangedSetValue"
      - in:
          - name: ctx
            type: context.Context
          - name: root
            type: string
        name: GitDir
        out:
          - name: gitDir
            type: string
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: dir
            type: string
        name: Head
        out:
          - name: head
            type: HeadValue
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: Config
        name: Resolve
        out:
          - type: coregit.ResolutionValue
      - in:
          - name: ctx
            type: context.Context
          - name: repoRoot
          - name: sha
          - name: relPath
            type: string
        name: ShowFile
        out:
          - name: content
            type: string
          - name: err
            type: error
    imports:
      coregit: github.com/kitsunium/sdk/framework/internal/core/git
    path: github.com/kitsunium/sdk/framework/internal/service/git
    types:
      - methods:
          - in:
              - name: absFile
                type: string
              - name: line
                type: int
            name: ContainsLine
            out:
              - type: bool
            recv: pointer
          - in:
              - name: absFile
                type: string
            name: ContainsFile
            out:
              - type: bool
            recv: pointer
          - in:
              - name: absDir
                type: string
            name: ContainsDir
            out:
              - type: bool
            recv: pointer
          - name: IsEmpty
            out:
              - type: bool
            recv: pointer
        name: ChangedSetValue
        struct:
          unexported: true
      - name: Config
        struct:
          fields:
            - name: Root
              type: string
            - name: Include
              type: IncludeFunc
      - name: IncludeFunc
        underlying: func(absPath string) bool
      - name: HeadValue
        struct:
          fields:
            - name: Time
              type: time.Time
            - name: Revision
              type: string
            - name: Modified
              type: bool
