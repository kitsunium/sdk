    doc: |-
      Package model is the Product Graph: the one data shape every part of the
      framework agrees on. The runtime serves it, a static analyzer produces it,
      a CLI prints it, a Studio draws it, and an AI agent or an editor extension
      reads it.

      A graph is a projection: of the code for what runs, and — since the
      platform's ADR 0010 — of the design (a product's design/ directory) for
      what its structure must be. The design, not the graph, is authoritative on
      structure; the graph shows what the code is and where it differs from the
      design. Every node says where it was declared ([Source]) and every edge
      says how it is known: declared by construction ([Edge].Declared), found in
      a handler body by a static analyzer ([Edge].Static), or seen at runtime
      ([Edge].Observed). A diagram that cannot say why an arrow exists is a
      drawing; this one can.

      # Identity

      Every node has an ID, and the grammar of IDs is written here once — as
      patterns a schema generator can read ([IDPattern], [SegmentPattern],
      [NamePattern]) and as a parser ([ParseID]):

      	todos                              a service
      	moderation.intake                  a module's service
      	todos/endpoint/Create              a node of a service
      	todos/endpoint/GET /todos/{id}     an endpoint named by its route
      	binary:statusline                  a binary
      	binary:statusline/role/daemon      one of its process roles
      	library:textwidth                  a library shared between components
      	external                           the world outside the product

      The runtime, the analyzer, the design files and the generator derive names
      with the same functions ([NodeID], [QualifiedService], [RoleID]), so two
      sides never disagree about what a declaration is called.

      # A contract

      The JSON shape is a contract: [Version] is bumped on any change an older
      reader would misread.
    functions:
      - doc: IsEngine reports whether backend names an engine a database runs on.
        in:
          - name: backend
            type: string
        name: IsEngine
        out:
          - type: bool
      - doc: |-
          ConnectorCatalog is every connector kit ships, sorted by ID: what a
          product may plug into.
        name: ConnectorCatalog
        out:
          - type: "[]ConnectorInfo"
      - doc: |-
          ConnectorsOf derives the connectors a product uses from its nodes: an
          endpoint, a frontend or an auth handler means HTTP, a mailer mail, a store
          stores — and a database when one keeps it —, a topic, a subscription or
          a queued command queues. Sorted by ID.
        in:
          - name: nodes
            type: "[]Node"
        name: ConnectorsOf
        out:
          - type: "[]Connector"
      - doc: |-
          SplitDoc splits a description into its default text and its translations.

          A product documents a building block once, in Go, in its default language;
          a paragraph that starts with a language tag and a colon — "fr: Le cycle
          de vie d'un compte…" — is the same description in that language, until
          the next tag or the end:

          	// AccountLifecycle is the life of an account…
          	//
          	// fr: AccountLifecycle est la vie d'un compte…

          It keeps Go's convention (the comment still starts with the name) and
          go doc prints both. Each text is joined into one line. A description whose
          only tagged paragraph is "en" uses it as the default.
        in:
          - name: text
            type: string
        name: SplitDoc
        out:
          - type: string
          - type: map[string]string
      - doc: |-
          NodeID builds the ID of a node declared in a service. A service's own ID is
          its name.
        in:
          - name: service
            type: string
          - name: kind
            type: NodeKind
          - name: name
            type: string
        name: NodeID
        out:
          - type: string
      - doc: |-
          EdgeID builds the ID of an edge. The label is part of the identity: two
          transitions of one workflow fired from one endpoint are two edges.
        in:
          - name: from
            type: string
          - name: kind
            type: EdgeKind
          - name: to
          - name: label
            type: string
        name: EdgeID
        out:
          - type: string
      - doc: CompareSource orders sources by root, file, then line.
        in:
          - name: a
          - name: b
            type: Source
        name: CompareSource
        out:
          - type: int
      - doc: |-
          Merge enriches a graph with what another description of the same product
          knows. base is authoritative on which nodes exist — a runtime graph describes
          what the process actually serves —, on the modules it mounts, on what each
          of its ports calls and on which stores feed each of its watches: the app
          chose them when it started, where the analysis only reads the same rules
          over the whole module. extra, typically
          the static analysis, contributes documentation, handler ranges — an
          authorization function's too —, transition callers and the edges it
          found. Nodes only extra knows about are dropped: code that is compiled but
          not mounted in this app is not part of this product — save a node of a
          module's service the base mounts, which a package the binary does not link
          declares: a warning says so.
        in:
          - name: base
          - name: extra
            type: "*Graph"
        name: Merge
        out:
          - type: "*Graph"
      - doc: ServiceOf returns the service part of a node ID.
        in:
          - name: id
            type: string
        name: ServiceOf
        out:
          - type: string
      - doc: |-
          ValidSegment reports whether s is a legal service, module, binary, role or
          library name.
        in:
          - name: s
            type: string
        name: ValidSegment
        out:
          - type: bool
      - doc: |-
          ValidName reports whether s is a legal node name. An endpoint named by its
          route is legal as an ID but is not a name a declaration may give.
        in:
          - name: s
            type: string
        name: ValidName
        out:
          - type: bool
      - doc: "ValidContract reports whether s names a versioned contract: \"render/v1\"."
        in:
          - name: s
            type: string
        name: ValidContract
        out:
          - type: bool
      - doc: |-
          ParseID reads an ID. It refuses anything [IDPattern] does not match, with
          [InvalidID]; the refusal never quotes the input, which may be anything a
          caller sent.
        in:
          - name: s
            type: string
        name: ParseID
        out:
          - type: ID
          - type: error
      - doc: BinaryID is the ID of a binary.
        in:
          - name: binary
            type: string
        name: BinaryID
        out:
          - type: string
      - doc: RoleID is the ID of one process role of a binary.
        in:
          - name: binary
          - name: role
            type: string
        name: RoleID
        out:
          - type: string
      - doc: LibraryID is the ID of a library.
        in:
          - name: library
            type: string
        name: LibraryID
        out:
          - type: string
      - doc: |-
          Mermaid renders the architecture of a graph as a Mermaid flowchart: one
          subgraph per service — a module's inside the module's own, ADR 0008 —, one
          arrow per edge. GitHub renders it in Markdown, which makes a product's
          README carry its own, always regenerable, diagram.

          Each kind has its shape: an endpoint a box (marked "auth" when it asks for
          a user; an implementation of a port by its name), a store a cylinder, a
          topic a flag, a subscription a parallelogram (a watch, ADR 0008, marked
          with the mark it watches — its stores' arrows say where from), a
          workflow a hexagon, a job a
          stadium, the auth handler a trapezoid — a gate —, a mailer a subroutine
          box, a declared loop a circle, a hand-written loop a double circle, a
          port an inverted trapezoid — a socket, UML's required interface —, a
          command a parallelogram leaning back — a subscription's leans forward —,
          marked "queued" when it waits in its queue, and a query a rhombus, a
          question. An arrow is solid when it exists by construction or was
          observed, dotted when only the code says so — or when it is a port's
          binding to its own fallback, the default the app may replace, as the
          Studio draws it.
        in:
          - name: g
            type: "*Graph"
        name: Mermaid
        out:
          - type: string
      - doc: |-
          QualifiedService is the name a module gives a service it lists: the
          module's own name for the service named like it, "<module>.<service>"
          otherwise. The runtime and the analyzer both qualify with it.
        in:
          - name: module
          - name: service
            type: string
        name: QualifiedService
        out:
          - type: string
      - doc: "ModulePrefix is a module's default mount prefix: \"/<name>/\"."
        in:
          - name: name
            type: string
        name: ModulePrefix
        out:
          - type: string
      - doc: |-
          UnderPrefix is a route declared at path, served under a module's mount
          prefix: "/reports" under "/moderation/" is "/moderation/reports", and
          under "/" it stays "/reports".
        in:
          - name: prefix
          - name: path
            type: string
        name: UnderPrefix
        out:
          - type: string
      - doc: |-
          TableName is the table a database keeps a kit table in (ADR 0004): the
          service's name — qualified, for a module's —, two underscores and the
          node's name, then suffix, '-' and '.' written '_', lower case —
          "moderation.intake"'s store "cases" is moderation_intake__cases. A name
          the rule cannot keep as it is — upper case, longer than MaxTableLen,
          three underscores in a row, SQLite's own prefix — is cut and ends with a
          digest of the whole, so it stays one table's. The runtime and the
          analyzer name tables with it.
        in:
          - name: service
          - name: node
          - name: suffix
            type: string
        name: TableName
        out:
          - type: string
