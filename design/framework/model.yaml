        value: "\"library\""
      - blockDoc: "Loop provenances: who wrote the code that loops."
        doc: |-
          ProvenanceKit loops are written by kit for a declaration: a workflow's
          sweep, a declared loop's wake cycle.
        name: ProvenanceKit
        value: "\"kit\""
      - blockDoc: "Loop provenances: who wrote the code that loops."
        doc: "ProvenanceProduct loops are written by hand in the product: Service.Go."
        name: ProvenanceProduct
        value: "\"product\""
      - blockDoc: Loop states.
        name: LoopWaiting
        value: "\"waiting\""
      - blockDoc: Loop states.
        name: LoopRunning
        value: "\"running\""
      - blockDoc: Loop states.
        name: LoopRestarting
        value: "\"restarting\""
      - blockDoc: Loop states.
        name: LoopStopped
        value: "\"stopped\""
      - blockDoc: Span operations.
        name: OpRequest
        value: "\"request\""
      - blockDoc: Span operations.
        name: OpCall
        value: "\"call\""
      - blockDoc: Span operations.
        name: OpRead
        value: "\"read\""
      - blockDoc: Span operations.
        name: OpWrite
        value: "\"write\""
      - blockDoc: Span operations.
        name: OpPublish
        value: "\"publish\""
      - blockDoc: Span operations.
        name: OpDeliver
        value: "\"deliver\""
      - blockDoc: Span operations.
        name: OpTransition
        value: "\"transition\""
      - blockDoc: Span operations.
        name: OpRun
        value: "\"run\""
      - blockDoc: Span operations.
        name: OpAuth
        value: "\"auth\""
      - blockDoc: Span operations.
        name: OpSend
        value: "\"send\""
      - blockDoc: Span operations.
        name: OpDeliverMail
        value: "\"deliver-mail\""
      - blockDoc: Span operations.
        name: OpSecret
        value: "\"secret\""
      - blockDoc: Span operations.
        name: OpDispatch
        value: "\"dispatch\""
      - blockDoc: Span operations.
        name: OpAsk
        value: "\"ask\""
      - blockDoc: Span operations.
        name: OpHandle
        value: "\"handle\""
      - blockDoc: Span operations.
        name: OpConnect
        value: "\"connect\""
      - blockDoc: Span operations.
        name: OpCLI
        value: "\"cli\""
      - blockDoc: Span operations.
        doc: |-
          OpTransaction is a unit of work (kit.Transact, a command's, a
          workflow's transition): its attrs say the database it belongs to —
          "database", and "backend" as a store says it —, its "outcome", the
          effects it held ("effects"), and "savepoint" for one nested in
          another.
        name: OpTransaction
        value: "\"transaction\""
      - blockDoc: The outcomes of a transaction, as its span's "outcome" attribute says them.
        doc: "OutcomeCommit is a transaction that committed: its effects left."
        name: OutcomeCommit
        value: "\"commit\""
      - blockDoc: The outcomes of a transaction, as its span's "outcome" attribute says them.
        doc: |-
          OutcomeRollback is a transaction whose writes were undone: its effects
          were dropped.
        name: OutcomeRollback
        value: "\"rollback\""
      - blockDoc: Span statuses.
        name: StatusOK
        value: "\"ok\""
      - blockDoc: Span statuses.
        name: StatusError
        value: "\"error\""
      - doc: |-
          MaxTableLen is the longest table name a store on a database takes, in
          bytes: the SDK's document store over SQL keeps its index rows in the table
          named after it with "___ix", within PostgreSQL's 63.
        name: MaxTableLen
        type: int
        value: "58"
    doc: |-
      Package core is the Product Graph under the names the role rule asks for:
      every struct carries its role (NodeEntity, GraphMessage, EndpointSpec, …).
      framework/model is its public face — an alias per type under the graph's
      own names (Node, Graph, EndpointInfo, …), its constants and its functions —
      and the one package a caller imports.
    functions:
      - doc: IsEngine reports whether backend names an engine a database runs on.
        in:
          - name: backend
            type: string
        name: IsEngine
        out:
          - type: bool
      - doc: |-
          ConnectorCatalog is every connector kit ships, sorted by ID: what a
          product may plug into.
        name: ConnectorCatalog
        out:
          - type: "[]ConnectorSpec"
      - doc: |-
          ConnectorsOf derives the connectors a product uses from its nodes: an
          endpoint, a frontend or an auth handler means HTTP, a mailer mail, a store
          stores — and a database when one keeps it —, a topic, a subscription or
          a queued command queues. Sorted by ID.
        in:
          - name: nodes
            type: "[]NodeEntity"
        name: ConnectorsOf
        out:
          - type: "[]ConnectorMessage"
      - doc: |-
          SplitDoc splits a description into its default text and its translations.

          A product documents a building block once, in Go, in its default language;
          a paragraph that starts with a language tag and a colon — "fr: Le cycle
          de vie d'un compte…" — is the same description in that language, until
          the next tag or the end:

          	// AccountLifecycle is the life of an account…
          	//
          	// fr: AccountLifecycle est la vie d'un compte…

          It keeps Go's convention (the comment still starts with the name) and
          go doc prints both. Each text is joined into one line. A description whose
          only tagged paragraph is "en" uses it as the default.
        in:
          - name: text
            type: string
        name: SplitDoc
        out:
          - type: string
          - type: map[string]string
      - doc: |-
          NodeID builds the ID of a node declared in a service. A service's own ID is
          its name.
        in:
          - name: service
            type: string
          - name: kind
            type: NodeKind
          - name: name
            type: string
        name: NodeID
        out:
          - type: string
      - doc: |-
          EdgeID builds the ID of an edge. The label is part of the identity: two
          transitions of one workflow fired from one endpoint are two edges.
        in:
          - name: from
            type: string
          - name: kind
            type: EdgeKind
          - name: to
          - name: label
            type: string
        name: EdgeID
        out:
          - type: string
      - doc: CompareSource orders sources by root, file, then line.
        in:
          - name: a
          - name: b
            type: SourceMessage
        name: CompareSource
        out:
          - type: int
      - doc: |-
          Merge enriches a graph with what another description of the same product
          knows. base is authoritative on which nodes exist — a runtime graph describes
          what the process actually serves —, on the modules it mounts, on what each
          of its ports calls and on which stores feed each of its watches: the app
          chose them when it started, where the analysis only reads the same rules
          over the whole module. extra, typically
          the static analysis, contributes documentation, handler ranges — an
          authorization function's too —, transition callers and the edges it
          found. Nodes only extra knows about are dropped: code that is compiled but
          not mounted in this app is not part of this product — save a node of a
          module's service the base mounts, which a package the binary does not link
          declares: a warning says so.
        in:
          - name: base
          - name: extra
            type: "*GraphMessage"
        name: Merge
        out:
          - type: "*GraphMessage"
      - doc: ServiceOf returns the service part of a node ID.
        in:
          - name: id
            type: string
        name: ServiceOf
        out:
          - type: string
      - doc: |-
          ValidSegment reports whether s is a legal service, module, binary, role or
          library name.
        in:
          - name: s
            type: string
        name: ValidSegment
        out:
          - type: bool
      - doc: |-
          ValidName reports whether s is a legal node name. An endpoint named by its
          route is legal as an ID but is not a name a declaration may give.
        in:
          - name: s
            type: string
        name: ValidName
        out:
          - type: bool
      - doc: "ValidContract reports whether s names a versioned contract: \"render/v1\"."
        in:
          - name: s
            type: string
        name: ValidContract
        out:
          - type: bool
      - doc: |-
          ParseID reads an ID. It refuses anything [IDPattern] does not match, with
          [InvalidID]; the refusal never quotes the input, which may be anything a
          caller sent.
        in:
          - name: s
            type: string
        name: ParseID
        out:
          - type: IDValue
          - type: error
      - doc: BinaryID is the ID of a binary.
        in:
          - name: binary
            type: string
        name: BinaryID
        out:
          - type: string
      - doc: RoleID is the ID of one process role of a binary.
        in:
          - name: binary
          - name: role
            type: string
        name: RoleID
        out:
          - type: string
      - doc: LibraryID is the ID of a library.
        in:
          - name: library
            type: string
        name: LibraryID
        out:
          - type: string
      - doc: |-
          Mermaid renders the architecture of a graph as a Mermaid flowchart: one
          subgraph per service — a module's inside the module's own, ADR 0008 —, one
          arrow per edge. GitHub renders it in Markdown, which makes a product's
          README carry its own, always regenerable, diagram.

          Each kind has its shape: an endpoint a box (marked "auth" when it asks for
          a user; an implementation of a port by its name), a store a cylinder, a
          topic a flag, a subscription a parallelogram (a watch, ADR 0008, marked
          with the mark it watches — its stores' arrows say where from), a
          workflow a hexagon, a job a
          stadium, the auth handler a trapezoid — a gate —, a mailer a subroutine
          box, a declared loop a circle, a hand-written loop a double circle, a
          port an inverted trapezoid — a socket, UML's required interface —, a
          command a parallelogram leaning back — a subscription's leans forward —,
          marked "queued" when it waits in its queue, and a query a rhombus, a
          question. An arrow is solid when it exists by construction or was
          observed, dotted when only the code says so — or when it is a port's
          binding to its own fallback, the default the app may replace, as the
          Studio draws it.
        in:
          - name: g
            type: "*GraphMessage"
        name: Mermaid
        out:
          - type: string
      - doc: |-
          QualifiedService is the name a module gives a service it lists: the
          module's own name for the service named like it, "<module>.<service>"
          otherwise. The runtime and the analyzer both qualify with it.
        in:
          - name: module
          - name: service
            type: string
        name: QualifiedService
        out:
          - type: string
      - doc: "ModulePrefix is a module's default mount prefix: \"/<name>/\"."
        in:
          - name: name
            type: string
        name: ModulePrefix
        out:
          - type: string
      - doc: |-
          UnderPrefix is a route declared at path, served under a module's mount
          prefix: "/reports" under "/moderation/" is "/moderation/reports", and
          under "/" it stays "/reports".
        in:
          - name: prefix
          - name: path
            type: string
        name: UnderPrefix
        out:
          - type: string
      - doc: |-
          TableName is the table a database keeps a kit table in (ADR 0004): the
          service's name — qualified, for a module's —, two underscores and the
          node's name, then suffix, '-' and '.' written '_', lower case —
          "moderation.intake"'s store "cases" is moderation_intake__cases. A name
          the rule cannot keep as it is — upper case, longer than MaxTableLen,
          three underscores in a row, SQLite's own prefix — is cut and ends with a
          digest of the whole, so it stays one table's. The runtime and the
          analyzer name tables with it.
        in:
          - name: service
          - name: node
          - name: suffix
            type: string
        name: TableName
        out:
          - type: string
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      json: encoding/json
    path: github.com/kitsunium/sdk/framework/model/internal/core
    sentinels:
      - var:
          - code: CodeInvalidID
            doc: |-
              InvalidID is returned by [ParseID] for a string the ID grammar does not
              match. Its "part" field names what failed — the kind, the service name, the
              node name —, never the input.
            name: InvalidID
            options:
              - errs.WithHTTPStatus(http.StatusBadRequest)
            private: "framework/model.ParseID: the input does not match IDPattern; the part field names the failing component"
            public: The node identifier is not valid
            reason: INVALID_ID
    types:
      - decl: true
        doc: |-
          ArchitectureMessage is the product at the two outer levels of the C4 model.

          Context (level 1) is the product as one box, the people who use it and the
          systems it depends on. Containers (level 2) is what the product is
          deployed as: the process, the frontend its browser runs, the volume its
          data lives on. Components (level 3) are the nodes, grouped by service; code
          (level 4) is each node's [CodeResult].

          kit derives all of it from the declarations — a frontend implies a person
          with a browser, a mailer an SMTP relay, a data directory a volume, a
          database its own container — so it is exactly as true as the rest of the
          graph.
        name: ArchitectureMessage
        struct:
          fields:
            - doc: People are the humans the product serves.
              name: People
              tag: json:"people"
              type: "[]PersonMessage"
            - doc: |-
                Systems are the software systems outside the product it talks to, or
                that talk to it.
              name: Systems
              tag: json:"systems"
              type: "[]SystemMessage"
            - doc: Containers are the product's runnable and storage units.
              name: Containers
              tag: json:"containers"
              type: "[]ContainerMessage"
            - doc: Links are the relationships between people, systems and containers.
              name: Links
              tag: json:"links"
              type: "[]LinkMessage"
      - decl: true
        doc: |-
          PersonMessage is a human user of the product.
          It is drawn at the edge of the C4 context view, outside every container.
        name: PersonMessage
        struct:
          fields:
            - doc: "ID is unique in the architecture: \"person:user\"."
              name: ID
              tag: json:"id"
              type: string
            - doc: "Name is what the diagram prints: \"User\"."
              name: Name
              tag: json:"name"
              type: string
            - doc: Doc says who they are and what they do with the product.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
      - decl: true
        doc: |-
          SystemMessage is a software system outside the product.
          Nodes are the product's nodes that talk to it; Technology says what it runs
          on.
        name: SystemMessage
        struct:
          fields:
            - doc: "ID is unique in the architecture: \"system:smtp\"."
              name: ID
              tag: json:"id"
              type: string
            - doc: "Name is what the diagram prints: \"SMTP relay\"."
              name: Name
              tag: json:"name"
              type: string
            - doc: Doc says what it is to the product.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - doc: "Technology names how it is reached: \"SMTP · STARTTLS\"."
              name: Technology
              tag: json:"technology,omitempty"
              type: string
            - doc: "Location says where, when it is known and not secret: \"smtp.example.com:587\"."
              name: Location
              tag: json:"location,omitempty"
              type: string
            - doc: Nodes are the nodes of the product that talk to it.
              name: Nodes
              tag: json:"nodes,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          ContainerMessage is one runnable or storage unit of the product.
          Its ID starts with "container:"; Nodes are the nodes that live in it.
        name: ContainerMessage
        struct:
          fields:
            - doc: "ID is unique in the architecture: \"container:process\"."
              name: ID
              tag: json:"id"
              type: string
            - doc: Name is what the diagram prints.
              name: Name
              tag: json:"name"
              type: string
            - doc: Kind is one of the Container constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: "Technology names what it is built with: \"Go 1.27 · kit · net/http\"."
              name: Technology
              tag: json:"technology,omitempty"
              type: string
            - doc: Doc says what it does.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - doc: |-
                Location is where it runs or lives: the listen address, the data
                directory. Present in dev only.
              name: Location
              tag: json:"location,omitempty"
              type: string
            - doc: |-
                Nodes are the nodes it hosts: services for the process, stores and
                subscriptions for the volume, frontends for an SPA.
              name: Nodes
              tag: json:"nodes,omitempty"
              type: "[]string"
            - doc: Ports are what the process listens on, and whose each port is.
              name: Ports
              tag: json:"ports,omitempty"
              type: "[]PortMessage"
            - doc: |-
                Settings are the settings that configure it: KIT_DATA_DIR for the
                data directory; a database's URL and tuning variables for a database.
              name: Settings
              tag: json:"settings,omitempty"
              type: "[]string"
            - doc: "Engine is a database's engine: \"postgres\", \"mysql\", \"sqlite\"."
              name: Engine
              tag: json:"engine,omitempty"
              type: string
            - doc: |-
                Source is where the code declares the container, when it does: the
                app for the process, a frontend for its SPA, kit.Database for a
                database. [GraphMessage.Files] allows it.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          PortMessage is an address a process listens on.
          Owner is the container that listens on it; Serves names what is reached
          through it.
        name: PortMessage
        struct:
          fields:
            - doc: |-
                Address is the listen address: "127.0.0.1:4000", ":4000". Present in
                dev only, like every location.
              name: Address
              tag: json:"address,omitempty"
              type: string
            - doc: Owner is [PortOwnerKit], or the ID of the connector that opened it.
              name: Owner
              tag: json:"owner"
              type: string
            - doc: "Serves says what it answers: the Serves constants."
              name: Serves
              tag: json:"serves"
              type: "[]string"
            - doc: Settings are the settings that configure it.
              name: Settings
              tag: json:"settings,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          LinkMessage is a relationship between two elements of the architecture. The
          process's link to a database, "Reads and writes", carries the database
          connector, and the store connector once stores live on it.
        name: LinkMessage
        struct:
          fields:
            - doc: From is the ID of a person, system or container.
              name: From
              tag: json:"from"
              type: string
            - doc: To is the ID of a person, system or container.
              name: To
              tag: json:"to"
              type: string
            - doc: "Label says what the relationship is: \"Reads and writes\"."
              name: Label
              tag: json:"label"
              type: string
            - doc: "Technology says how: \"JSON over HTTP\", \"SMTP\", \"file I/O\"."
              name: Technology
              tag: json:"technology,omitempty"
              type: string
            - doc: Nodes are the nodes whose edges make the link true.
              name: Nodes
              tag: json:"nodes,omitempty"
              type: "[]string"
            - doc: |-
                Connectors are the connectors the link is made of: one link from the
                process to the data directory carries the stores, the queues and the
                mail outbox.
              name: Connectors
              tag: json:"connectors,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          CodeResult is the code a node runs, as the static analysis read it: the
          fourth and innermost level of the C4 model. The entry is the function the
          node runs — an endpoint's handler, a subscription's, a loop's — and Funcs
          are the functions of the module it reaches, each with what it calls and
          what it does to other nodes.
        name: CodeResult
        struct:
          fields:
            - doc: Entry is the qualified name of the function the node runs first.
              name: Entry
              tag: json:"entry,omitempty"
              type: string
            - doc: |-
                Funcs are the module's functions reachable from the entry, entry
                first, then in the order the walk met them.
              name: Funcs
              tag: json:"funcs,omitempty"
              type: "[]CodeFuncMessage"
            - doc: |-
                Uses are the SDK functions the code calls: the mechanics it composes
                rather than implements.
              name: Uses
              tag: json:"uses,omitempty"
              type: "[]CodeUseMessage"
            - doc: Truncated is set when the walk stopped at its depth or size bound.
              name: Truncated
              tag: json:"truncated,omitempty"
              type: bool
      - decl: true
        doc: |-
          CodeFuncMessage is one function of the module a node's code reaches.
          Its steps are listed in the order they run, under the blocks that guard
          them.
        name: CodeFuncMessage
        struct:
          fields:
            - doc: "Func is the qualified name: \"github.com/kitsunium/todo/tasks.Create\"."
              name: Func
              tag: json:"func"
              type: string
            - doc: "Name is the short name a developer reads: \"Create\", \"(*Store).visible\"."
              name: Name
              tag: json:"name"
              type: string
            - doc: Source is the function's range.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
            - doc: |-
                Calls are the qualified names of the module functions it calls, in
                source order, deduplicated.
              name: Calls
              tag: json:"calls,omitempty"
              type: "[]string"
            - doc: Effects are its calls on building blocks, in source order.
              name: Effects
              tag: json:"effects,omitempty"
              type: "[]CodeEffectMessage"
            - doc: |-
                Steps are what it does, in the order it does it: its calls to module
                functions, on building blocks and into the SDK, arguments before the
                call they are passed to. A sequence diagram is drawn from them.
              name: Steps
              tag: json:"steps,omitempty"
              type: "[]CodeStepMessage"
            - doc: |-
                Blocks are its blocks that decide whether, or how many times, the
                steps under them run: an if's branches, a switch's cases, a loop.
              name: Blocks
              tag: json:"blocks,omitempty"
              type: "[]CodeBlockMessage"
      - decl: true
        doc: |-
          CodeStepMessage is one thing a function does: a call to another function of the
          module, a call on a building block, or a call into the SDK — under the
          innermost block that guards it.
        name: CodeStepMessage
        struct:
          fields:
            - doc: Line is the 1-based line of the call, in the function's file.
              name: Line
              tag: json:"line"
              type: int
            - doc: Call is the qualified name of the module function it calls.
              name: Call
              tag: json:"call,omitempty"
              type: string
            - doc: "Effect is its call on a building block: the index in Effects, plus one."
              name: Effect
              tag: json:"effect,omitempty"
              type: int
            - doc: |-
                Use is the SDK function it calls, from the SDK's version directory:
                "crypto/password.Hash".
              name: Use
              tag: json:"use,omitempty"
              type: string
            - doc: |-
                Block is the innermost block guarding it: the index in Blocks, plus
                one; 0 for the function's body.
              name: Block
              tag: json:"block,omitempty"
              type: int
      - decl: true
        doc: |-
          CodeBlockMessage is a block of a function that decides whether, or how many
          times, the steps under it run.
        name: CodeBlockMessage
        struct:
          fields:
            - doc: Kind is one of the Block constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: |-
                Label is the condition or the clause, as written: "err != nil",
                `case "done"`, "range ids"; bounded.
              name: Label
              tag: json:"label,omitempty"
              type: string
            - doc: Line is the 1-based line where the block starts.
              name: Line
              tag: json:"line"
              type: int
            - doc: |-
                Group is the line of the statement the block is a branch of: an
                if/else chain, a switch, a select. Blocks with one group are its
                alternatives.
              name: Group
              tag: json:"group,omitempty"
              type: int
            - doc: |-
                Parent is the enclosing block: its index in Blocks, plus one; 0 for
                the function's body.
              name: Parent
              tag: json:"parent,omitempty"
              type: int
      - decl: true
        doc: |-
          CodeEffectMessage is one call on a building block, inside a function.
          It names the node it reaches and the edge kind that call draws.
        name: CodeEffectMessage
        struct:
          fields:
            - doc: "Kind is the edge the call makes: reads, writes, publishes…"
              name: Kind
              tag: json:"kind"
              type: EdgeKind
            - doc: Target is the node the call reaches.
              name: Target
              tag: json:"target"
              type: string
            - doc: "Label refines Kind like an edge's label: the event of a transition."
              name: Label
              tag: json:"label,omitempty"
              type: string
            - doc: "Op is the method called: \"Get\", \"Insert\", \"Fire\", \"Send\"."
              name: Op
              tag: json:"op"
              type: string
            - doc: Line is the 1-based line of the call, in the function's file.
              name: Line
              tag: json:"line"
              type: int
      - decl: true
        doc: |-
          CodeUseMessage is one SDK function a node's code calls.
          Sites are where the node's code calls it, so a reader sees what it leans
          on.
        name: CodeUseMessage
        struct:
          fields:
            - doc: "Package is the SDK package: \"github.com/kitsunium/sdk/pkg/v1/crypto/password\"."
              name: Package
              tag: json:"package"
              type: string
            - doc: "Func is the function or method: \"Hash\", \"(*Composer).Compose\"."
              name: Func
              tag: json:"func"
              type: string
            - doc: Sites are the call sites, sorted.
              name: Sites
              tag: json:"sites,omitempty"
              type: "[]SourceMessage"
      - decl: true
        doc: |-
          ConnectorMessage is something a product plugs into, as the product declares it:
          how it is reached, what it reaches out to, where it keeps its data. The
          Studio shows a connector's pages and widgets only when the product has
          one: a command-line tool has no requests to list, a service without a
          mailer no mailbox.

          A connector says what the code declares, never what an environment
          supplies. The relay a mailer delivers through, the directory a store
          writes to, the address kit listens on are facts of the running
          environment — [MailerSpec], [StoreSpec], the [ArchitectureMessage] and [RuntimeMessage]
          carry those. So a connector is a pure function of the nodes
          ([ConnectorsOf]), and never moves a graph's revision.
        name: ConnectorMessage
        struct:
          fields:
            - doc: |-
                ID names the connector: [ConnectorHTTP], [ConnectorMail],
                [ConnectorStore], [ConnectorQueue], [ConnectorDatabase].
              name: ID
              tag: json:"id"
              type: string
            - doc: |-
                Kind groups connectors by what they are for; kept for older readers,
                Roles says more.
              name: Kind
              tag: json:"kind"
              type: ConnectorKind
            - doc: |-
                Roles place it against the process boundary: [RoleInbound] (the
                product is reached through it), [RoleOutbound] (the product reaches out
                through it), [RoleStorage] (the product keeps data in it). kit's
                built-in queues run inside the process: storage only.
              name: Roles
              tag: json:"roles,omitempty"
              type: "[]string"
            - doc: "Protocol is the wire protocol the code fixes, when it does: \"http\"."
              name: Protocol
              tag: json:"protocol,omitempty"
              type: string
            - doc: |-
                Detail is what the product uses, in kit's words: the stores'
                backends, the mail transport, the queues' brokers.
              name: Detail
              tag: json:"detail,omitempty"
              type: string
            - doc: |-
                Settings are the settings the connector owns — the ones its page shows
                with their value. A setting of a resource it uses (the data directory,
                kit's port) belongs to that resource: [ContainerMessage].
              name: Settings
              tag: json:"settings,omitempty"
              type: "[]string"
            - doc: Nodes are the nodes the connector brings to the graph, sorted.
              name: Nodes
              tag: json:"nodes"
              type: "[]string"
      - decl: true
        doc: ConnectorKind groups connectors by what they are for.
        name: ConnectorKind
        underlying: string
      - decl: true
        doc: |-
          ConnectorSpec is a connector kit can plug a product into, whether the
          product uses it or not: what it is, and the building blocks that bring it.
        name: ConnectorSpec
        struct:
          fields:
            - doc: "ID is the connector's: [ConnectorHTTP]…"
              name: ID
              tag: json:"id"
              type: string
            - doc: Kind groups it, as [ConnectorMessage.Kind].
              name: Kind
              tag: json:"kind"
              type: ConnectorKind
            - doc: Roles place it against the process boundary.
              name: Roles
              tag: json:"roles"
              type: "[]string"
            - doc: Protocol is the wire protocol the code fixes, when it does.
              name: Protocol
              tag: json:"protocol,omitempty"
              type: string
            - doc: Settings are the settings it owns.
              name: Settings
              tag: json:"settings,omitempty"
              type: "[]string"
            - doc: |-
                Declares are the building blocks whose declaration brings it: a
                command brings the queue connector only when it is queued.
              name: Declares
              tag: json:"declares"
              type: "[]NodeKind"
            - doc: |-
                Adapters are the modules a product imports to plug it into what it
                reaches: the engines of the database connector.
              name: Adapters
              tag: json:"adapters,omitempty"
              type: "[]AdapterMessage"
            - doc: |-
                brings narrows Declares: a node of a declared kind brings the
                connector only when it holds. nil: every such node does.
              name: brings
              type: func(*NodeEntity) bool
            - doc: "detail is what a node that brings it says of it; nil: nothing."
              name: detail
              type: func(*NodeEntity) string
      - decl: true
        doc: |-
          AdapterMessage is a module a connector plugs a product in through: an engine,
          imported by the product's main to reach a database, and the only code of
          the product that imports its driver.
        name: AdapterMessage
        struct:
          fields:
            - doc: "ID names it as the graph does: \"postgres\"."
              name: ID
              tag: json:"id"
              type: string
            - doc: "Name is what a reader calls what it reaches: \"PostgreSQL\"."
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                Import is the package the product's main imports:
                "github.com/kitsunium/sdk/framework/connectors/postgres".
              name: Import
              tag: json:"import"
              type: string
            - doc: "Driver is the Go driver it links: \"github.com/jackc/pgx/v5\"."
              name: Driver
              tag: json:"driver,omitempty"
              type: string
      - decl: true
        doc: |-
          MailMessage is a whole captured mail, for the Studio's mailbox.
          It is kept by the capture transport of dev and tests only, never in
          production.
        name: MailMessage
        struct:
          fields:
            - embedded: true
              type: MailSummary
            - doc: Text is the plain text body.
              name: Text
              tag: json:"text,omitempty"
              type: string
            - doc: |-
                HTML is the HTML body. The Studio renders it in a sandboxed frame
                that runs no script.
              name: HTML
              tag: json:"html,omitempty"
              type: string
            - doc: Headers are the extra headers, rendered.
              name: Headers
              tag: json:"headers,omitempty"
              type: map[string]string
            - doc: Raw is the composed message, as the transport received it.
              name: Raw
              tag: json:"raw,omitempty"
              type: string
      - decl: true
        doc: |-
          EdgeKind says how two nodes relate.
          It is a wire format — the graph's JSON and the Studio's TypeScript unions
          carry these names —, so it stays a string.
        name: EdgeKind
        underlying: string
      - decl: true
        doc: |-
          EventType names the kind of a live event.
          It is a wire format — the graph's JSON and the Studio's TypeScript unions
          carry these names —, so it stays a string.
        name: EventType
        underlying: string
      - decl: true
        doc: |-
          StoreHistoryMessage is what a store remembers of its records.
          Fields names the fields it keeps former values of; Kept and Bytes weigh
          them.
        name: StoreHistoryMessage
        struct:
          fields:
            - doc: |-
                Revisions is how many former versions each record keeps
                (kit.Revisions, ADR 0007 §3); zero when it keeps none.
              name: Revisions
              tag: json:"revisions,omitempty"
              type: int
            - doc: |-
                Fields are the JSON pointers of the fields that keep their former
                values: tagged history=N — the schema's Field.History says how many —
                or read by a password policy that refuses former passwords.
              name: Fields
              tag: json:"fields,omitempty"
              type: "[]string"
            - doc: Passwords are the store's password policies.
              name: Passwords
              tag: json:"passwords,omitempty"
              type: "[]PasswordPolicyMessage"
            - doc: |-
                Kept is how many former values the store keeps, and Bytes what its
                histories weigh, on a runtime graph.
              name: Kept
              tag: json:"kept,omitempty"
              type: "*int"
            - name: Bytes
              tag: json:"bytes,omitempty"
              type: "*int64"
      - decl: true
        doc: |-
          PasswordPolicyMessage is the policy of one secret field that holds a password's
          hash (Store.Passwords).
        name: PasswordPolicyMessage
        struct:
          fields:
            - doc: "Field is the field's JSON pointer: \"/password\"."
              name: Field
              tag: json:"field"
              type: string
            - doc: MinLength is the fewest characters a password may have.
              name: MinLength
              tag: json:"minLength"
              type: int
            - doc: |-
                NotReused is how many former passwords it refuses; zero when it
                refuses none.
              name: NotReused
              tag: json:"notReused,omitempty"
              type: int
            - doc: |-
                NotCommon says it refuses the most common passwords (kit.NotCommon),
                as every policy does.
              name: NotCommon
              tag: json:"notCommon,omitempty"
              type: bool
            - doc: Source is where the policy is declared.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          FormerMessage is one former value of a field that keeps its history: what it
          was, until when, and who replaced it.
        name: FormerMessage
        struct:
          fields:
            - doc: |-
                Value is the field's value then, as JSON; absent for a secret field,
                whose former values are never given.
              name: Value
              tag: json:"value,omitempty" kit:"personal"
              type: json.RawMessage
            - doc: Until is when it was replaced, on the app's clock.
              name: Until
              tag: json:"until"
              type: time.Time
            - doc: |-
                By is the user who replaced it — kit.UserID —, empty for a write
                with no user: a job's, a loop's, kit's own.
              name: By
              tag: json:"by,omitempty"
              type: string
      - decl: true
        doc: |-
          RecordHistoryMessage is what kit remembers of one record, as the Studio's data
          view shows it (GET /_kit/api/former): each field's former values, newest
          first, by the field's JSON pointer — a secret field's without their
          values, a personal or special one's redacted.
        name: RecordHistoryMessage
        struct:
          fields:
            - name: Fields
              tag: json:"fields"
              type: map[string][]FormerMessage
      - decl: true
        doc: |-
          RecordVersionMessage is one version of a record whose store keeps
          revisions (ADR 0007 §3): its number — from 1, never given twice while the
          record exists —, when the write that made it ran — zero for a record
          stored before its store kept revisions —, who made it and which command,
          and the record as it was.
        name: RecordVersionMessage
        struct:
          fields:
            - name: Number
              tag: json:"number"
              type: uint64
            - doc: At is when the write that made it ran, on the app's clock.
              name: At
              tag: json:"at,omitzero"
              type: time.Time
            - doc: |-
                By is the user who made it — kit.UserID —, empty for a write with no
                user.
              name: By
              tag: json:"by,omitempty"
              type: string
            - doc: |-
                Command is the node ID of the command that made it, empty outside
                one.
              name: Command
              tag: json:"command,omitempty"
              type: string
            - doc: |-
                Value is the record as it was: in an export, its secret members left
                out; in the Studio, as the data browser shows a record.
              name: Value
              tag: json:"value,omitempty" kit:"personal"
              type: json.RawMessage
      - decl: true
        doc: |-
          EditMessage is one change between two versions of a record, in RFC 6902's
          words: Op is add, remove or replace, Path the RFC 6901 JSON pointer of the
          member it changes, From its value before and To its value after, as JSON.
          A member whose value is not given — a secret's, or in the Studio a
          personal or special one — says it changed, never what: From and To are
          absent.
        name: EditMessage
        struct:
          fields:
            - name: Op
              tag: json:"op"
              type: string
            - name: Path
              tag: json:"path"
              type: string
            - name: From
              tag: json:"from,omitempty" kit:"personal"
              type: json.RawMessage
            - name: To
              tag: json:"to,omitempty" kit:"personal"
              type: json.RawMessage
      - decl: true
        doc: |-
          RecordVersionsMessage is a record's versions as the Studio's data view
          shows them (GET /_kit/api/revisions): newest first, each as the data
          browser shows a record — a member sealed at rest sealed, a personal,
          special or secret one redacted —, and, when two were asked for, what
          changed from one to the other, a value given only where the data browser
          would show it.
        name: RecordVersionsMessage
        struct:
          fields:
            - name: Versions
              tag: json:"versions"
              type: "[]RecordVersionMessage"
            - doc: |-
                From and To are the two versions compared, when asked for; Edits what
                changed between them.
              name: From
              tag: json:"from,omitempty"
              type: uint64
            - name: To
              tag: json:"to,omitempty"
              type: uint64
            - name: Edits
              tag: json:"edits,omitempty"
              type: "[]EditMessage"
      - decl: true
        doc: |-
          IDValue is a node's identity, parsed: the one grammar of [IDPattern]. Its
          String is the ID it was parsed from.
        methods:
          - doc: |-
              QualifiedServiceName is the service's ID segment: the qualification
              [QualifiedService] applies.
            name: QualifiedServiceName
            out:
              - type: string
            recv: pointer
          - doc: |-
              String renders the ID; ParseID(id.String()) is id for every ID ParseID
              returned.
            name: String
            out:
              - type: string
            recv: pointer
        name: IDValue
        struct:
          fields:
            - doc: |-
                Module qualifies Service when a module lists it; empty for the
                product's own services, and for a module's service named like it.
              name: Module
              type: string
            - doc: |-
                Service is the service's own name, unqualified; empty for a binary, a
                role, a library and [ExternalID].
              name: Service
              type: string
            - doc: |-
                Scope is the name of the binary of a binary or a role, or of the
                library of a library; empty otherwise.
              name: Scope
              type: string
            - doc: Kind is the node's kind.
              name: Kind
              type: NodeKind
            - doc: |-
                Name is the node's name: the service's for a service, the binary's for
                a binary.
              name: Name
              type: string
      - decl: true
        doc: |-
          GraphMessage is the whole product.
          It is the JSON document the runtime serves and the analyzer writes; Version
          names its shape.
        methods:
          - doc: Node returns the node with the given ID, or nil.
            in:
              - name: id
                type: string
            name: Node
            out:
              - type: "*NodeEntity"
            recv: pointer
          - doc: Edge returns the edge with the given ID, or nil.
            in:
              - name: id
                type: string
            name: Edge
            out:
              - type: "*EdgeMessage"
            recv: pointer
          - doc: |-
              Files returns every file the graph points at, each with its root — the
              product's module, or another Go module: a module's (ADR 0008), a
              library's —, sorted and deduplicated. It is the complete list of files a
              reader of this graph may legitimately ask to see, and the source endpoint
              serves nothing else.
            name: Files
            out:
              - type: "[]FileMessage"
            recv: pointer
          - doc: |-
              Normalize sorts nodes, edges and call sites into their canonical order,
              fills each workflow transition's callers from the edges, derives the
              connectors from the nodes, and recomputes Revision. Two graphs describing the same structure normalize to
              the same bytes, whatever order they were built in.
            name: Normalize
            recv: pointer
          - doc: ModuleOf returns the module named name, or nil.
            in:
              - name: name
                type: string
            name: ModuleOf
            out:
              - type: "*ModuleMessage"
            recv: pointer
        name: GraphMessage
        struct:
          fields:
            - doc: Version is always [Version] for a document this package produced.
              name: Version
              tag: json:"version"
              type: int
            - doc: |-
                Revision changes whenever the structure changes (nodes, edges, sources),
                never when only observed statistics move. A reader caches layout on it.
              name: Revision
              tag: json:"revision"
              type: string
            - doc: App identifies the product.
              name: App
              tag: json:"app"
              type: AppMessage
            - doc: Nodes are sorted by ID.
              name: Nodes
              tag: json:"nodes"
              type: "[]NodeEntity"
            - doc: Edges are sorted by ID.
              name: Edges
              tag: json:"edges"
              type: "[]EdgeMessage"
            - doc: Catalog lists the generic mechanics this kit version offers.
              name: Catalog
              tag: json:"catalog,omitempty"
              type: "[]MechanicMessage"
            - doc: Diagnostics are problems found while building the graph.
              name: Diagnostics
              tag: json:"diagnostics,omitempty"
              type: "[]DiagnosticMessage"
            - doc: Runtime is present when a running process describes itself.
              name: Runtime
              tag: json:"runtime,omitempty"
              type: "*RuntimeMessage"
            - doc: Analysis reports the static analysis that enriched this graph.
              name: Analysis
              tag: json:"analysis,omitempty"
              type: "*AnalysisResult"
            - doc: |-
                Architecture is the product at C4's two outer levels: who uses it and
                what it depends on, and what it is deployed as.
              name: Architecture
              tag: json:"architecture,omitempty"
              type: "*ArchitectureMessage"
            - doc: |-
                Connectors are what the product plugs into, derived from its nodes by
                [GraphMessage.Normalize]: the Studio shows their pages and widgets only.
              name: Connectors
              tag: json:"connectors,omitempty"
              type: "[]ConnectorMessage"
            - doc: |-
                ConnectorCatalog is every connector this kit version ships, used or
                not: what the product may plug into, and what brings each.
              name: ConnectorCatalog
              tag: json:"connectorCatalog,omitempty"
              type: "[]ConnectorSpec"
            - doc: Modules are the modules the app mounts (ADR 0008), sorted by name.
              name: Modules
              tag: json:"modules,omitempty"
              type: "[]ModuleMessage"
      - decl: true
        doc: |-
          AppMessage identifies the product and the machine that described it.
          It names the module, the environment and the build the graph was taken
          from.
        name: AppMessage
        struct:
          fields:
            - doc: Name is the product name given to kit.NewApp.
              name: Name
              tag: json:"name"
              type: string
            - doc: Module is the Go module path of the product.
              name: Module
              tag: json:"module,omitempty"
              type: string
            - doc: |-
                Root is the absolute module root on the machine that produced the
                graph. Present in dev only: it is what an editor link needs, and what a
                production graph must not leak.
              name: Root
              tag: json:"root,omitempty"
              type: string
            - doc: Env is "dev" or "production".
              name: Env
              tag: json:"env,omitempty"
              type: string
            - doc: Kit is the kit version that produced the graph.
              name: Kit
              tag: json:"kit,omitempty"
              type: string
            - doc: Go is the Go version the product was built with.
              name: Go
              tag: json:"go,omitempty"
              type: string
            - doc: StartedAt is when the process started, for a runtime graph.
              name: StartedAt
              tag: json:"startedAt,omitempty"
              type: "*time.Time"
            - doc: |-
                Build says what the binary was built from: the product, kit and the
                SDK kit depends on.
              name: Build
              tag: json:"build,omitempty"
              type: "*BuildMessage"
      - decl: true
        doc: |-
          BuildMessage is what a binary was built from, at its three levels.
          Its three levels are the Go toolchain, the main module and the modules it
          depends on.
        name: BuildMessage
        struct:
          fields:
            - doc: Product is the product's own module.
              name: Product
              tag: json:"product"
              type: ModuleVersionMessage
            - doc: |-
                Kit is the framework: since ADR 0162 the SDK module,
                github.com/kitsunium/sdk, which holds it.
              name: Kit
              tag: json:"kit"
              type: ModuleVersionMessage
            - doc: |-
                SDK is the SDK the framework is built on — the same module as Kit
                since ADR 0162, so the two say the same version.
              name: SDK
              tag: json:"sdk"
              type: ModuleVersionMessage
      - decl: true
        doc: |-
          ModuleVersionMessage identifies one module of a build.
          Local and Modified say when the code that ran is not the published version.
        name: ModuleVersionMessage
        struct:
          fields:
            - doc: Module is the module path.
              name: Module
              tag: json:"module"
              type: string
            - doc: |-
                Version is the published module version, "v0.4.6"; empty for a local
                directory or a build without module version.
              name: Version
              tag: json:"version,omitempty"
              type: string
            - doc: Revision is the VCS commit the module was built from, when known.
              name: Revision
              tag: json:"revision,omitempty"
              type: string
            - doc: Time is that commit's time.
              name: Time
              tag: json:"time,omitempty"
              type: "*time.Time"
            - doc: Modified is set when the build included uncommitted changes.
              name: Modified
              tag: json:"modified,omitempty"
              type: bool
            - doc: |-
                Local is set when the module came from a local directory (a replace
                or a workspace) rather than a published version.
              name: Local
              tag: json:"local,omitempty"
              type: bool
      - decl: true
        doc: |-
          SourceMessage locates code.
          File is relative to its module's root; Line and EndLine bound the
          declaration.
        name: SourceMessage
        struct:
          fields:
            - doc: |-
                File is relative to App.Root, slash-separated — or, when GoModule is
                set, to the root of that Go module.
              name: File
              tag: json:"file"
              type: string
            - doc: Line is 1-based.
              name: Line
              tag: json:"line"
              type: int
            - doc: EndLine, when set, closes the range [Line, EndLine].
              name: EndLine
              tag: json:"endLine,omitempty"
              type: int
            - doc: Func is the qualified Go function, when the range is a function.
              name: Func
              tag: json:"func,omitempty"
              type: string
            - doc: |-
                GoModule is set on a position outside the product's Go module — a
                module's (ADR 0008), a library's —: that Go module, "path@version", or
                its path alone when it is built from a local directory.
              name: GoModule
              tag: json:"goModule,omitempty"
              type: string
      - decl: true
        doc: |-
          EdgeMessage is one relation, with the evidence for it.
          Declared, Static and Observed say whether construction, the code or the
          runtime knows it.
        name: EdgeMessage
        struct:
          fields:
            - doc: ID is "<from>|<kind>|<to>" or "<from>|<kind>|<to>|<label>".
              name: ID
              tag: json:"id"
              type: string
            - doc: From is the source node ID.
              name: From
              tag: json:"from"
              type: string
            - doc: To is the target node ID.
              name: To
              tag: json:"to"
              type: string
            - doc: Kind says how the two relate.
              name: Kind
              tag: json:"kind"
              type: EdgeKind
            - doc: |-
                Label refines the kind: the event of a transition ("create" for a new
                instance), or "direct" for a call that bypasses an endpoint.
              name: Label
              tag: json:"label,omitempty"
              type: string
            - doc: |-
                Contract names the versioned contract of an [EdgeContracts] edge:
                "<name>/v<major>", "render/v1".
              name: Contract
              tag: json:"contract,omitempty"
              type: string
            - doc: Declared is set when the edge exists by construction.
              name: Declared
              tag: json:"declared,omitempty"
              type: bool
            - doc: Static lists the call sites the analyzer found, sorted.
              name: Static
              tag: json:"static,omitempty"
              type: "[]SourceMessage"
            - doc: Observed is present once the edge was seen at runtime.
              name: Observed
              tag: json:"observed,omitempty"
              type: "*StatsMessage"
      - decl: true
        doc: |-
          StatsMessage are observed counters for a node or an edge.
          They are counters: they never move a graph's revision.
        name: StatsMessage
        struct:
          fields:
            - doc: Count is how many times it ran.
              name: Count
              tag: json:"count"
              type: int64
            - doc: Errors is how many of those failed.
              name: Errors
              tag: json:"errors"
              type: int64
            - doc: LastAt is when it last ran.
              name: LastAt
              tag: json:"lastAt,omitempty"
              type: "*time.Time"
            - doc: AvgMs is the mean duration in milliseconds.
              name: AvgMs
              tag: json:"avgMs"
              type: float64
            - doc: MaxMs is the longest duration in milliseconds.
              name: MaxMs
              tag: json:"maxMs"
              type: float64
      - decl: true
        doc: |-
          DiagnosticMessage is a problem found while building the graph.
          It names the node or the file it is about, and how serious it is.
        name: DiagnosticMessage
        struct:
          fields:
            - doc: Severity is "error" or "warning". An error refuses to start the app.
              name: Severity
              tag: json:"severity"
              type: string
            - doc: Message says what is wrong and how to fix it, in English.
              name: Message
              tag: json:"message"
              type: string
            - doc: |-
                Texts is the message in each language kit speaks, by language: "en",
                "fr". The Studio shows its reader's.
              name: Texts
              tag: json:"texts,omitempty"
              type: map[string]string
            - doc: Node is the node concerned, when there is one.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: Source is where the problem is.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          AnalysisResult reports the status of static analysis.
          It says whether the analyzer ran, how long it took, and the error that
          stopped it.
        name: AnalysisResult
        struct:
          fields:
            - doc: Status is "pending", "running", "ok", "failed" or "unavailable".
              name: Status
              tag: json:"status"
              type: string
            - doc: Error explains a failed or unavailable analysis.
              name: Error
              tag: json:"error,omitempty"
              type: string
            - doc: At is when the analysis finished.
              name: At
              tag: json:"at,omitempty"
              type: "*time.Time"
            - doc: Packages is how many packages were analyzed.
              name: Packages
              tag: json:"packages,omitempty"
              type: int
            - doc: TookMs is how long it took.
              name: TookMs
              tag: json:"tookMs,omitempty"
              type: float64
      - decl: true
        doc: |-
          ModuleMessage is a module the app mounts: a Go module's services, released and
          mounted together like a bundle (ADR 0008). Everything a module declares is
          qualified with its name: its services are "<module>.<service>" — the one
          named like the module is "<module>" —, so its nodes are
          "<module>.<service>/<kind>/<name>" and carry [NodeEntity.Module].
        name: ModuleMessage
        struct:
          fields:
            - doc: Name is the name kit.NewModule gives it.
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                Doc is its description in the product's default language; Docs the
                same in other languages, by tag, as a node's.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - name: Docs
              tag: json:"docs,omitempty"
              type: map[string]string
            - doc: "Package is the Go package that declares it: the one a product imports."
              name: Package
              tag: json:"package,omitempty"
              type: string
            - doc: Build is the Go module it comes from, and its version.
              name: Build
              tag: json:"build,omitempty"
              type: "*ModuleVersionMessage"
            - doc: Services are its services' IDs, in the order it lists them.
              name: Services
              tag: json:"services"
              type: "[]string"
            - doc: Requires are the modules it requires (kit.Requires), by name.
              name: Requires
              tag: json:"requires,omitempty"
              type: "[]string"
            - doc: RequiredBy are the mounted modules that require it, by name, sorted.
              name: RequiredBy
              tag: json:"requiredBy,omitempty"
              type: "[]string"
            - doc: |-
                Prefix is where its routes are served: "/<name>/" unless the mount
                says otherwise (kit.Prefix); "/" shares the product's route space.
              name: Prefix
              tag: json:"prefix"
              type: string
            - doc: Source is where kit.NewModule declares it.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
            - doc: |-
                Mount is where the app mounts it — App.With or kit.Mount —; absent
                when only another module's kit.Requires mounted it, at its defaults.
              name: Mount
              tag: json:"mount,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          FileMessage is one file a graph points at: its path, relative to its root — the
          product's module, or the Go module [SourceMessage.GoModule] names.
        name: FileMessage
        struct:
          fields:
            - doc: GoModule is empty for a file of the product's own module.
              name: GoModule
              tag: json:"goModule,omitempty"
              type: string
            - name: File
              tag: json:"file"
              type: string
      - decl: true
        doc: |-
          NodeEntity is one building block.
          Its ID is its identity; exactly one of the kind-specific fields matching
          Kind is set.
        name: NodeEntity
        struct:
          fields:
            - doc: |-
                ID is "<service>/<kind>/<name>", "<service>" for a service,
                "binary:<name>" for a binary, "binary:<binary>/role/<name>" for a
                role, "library:<name>" for a library, or [ExternalID]: the grammar of
                [IDValue].
              name: ID
              tag: json:"id"
              type: string
            - doc: Kind says which building block this is.
              name: Kind
              tag: json:"kind"
              type: NodeKind
            - doc: Name is unique among the nodes of one kind in one service.
              name: Name
              tag: json:"name"
              type: string
            - doc: Service is the owning service ID. Empty for services and external.
              name: Service
              tag: json:"service,omitempty"
              type: string
            - doc: |-
                Module is the module the node belongs to — a module's service and
                every node of it —; empty for the product's own.
              name: Module
              tag: json:"module,omitempty"
              type: string
            - doc: |-
                Doc is the Go doc comment of the declaration or of its handler, in
                the product's default language.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - doc: |-
                Docs are the same description in other languages, by tag ("fr"),
                from the comment's tagged paragraphs: see [SplitDoc].
              name: Docs
              tag: json:"docs,omitempty"
              type: map[string]string
            - doc: Source is where the node is declared.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
            - doc: Handler is the body of the function the node runs, when it has one.
              name: Handler
              tag: json:"handler,omitempty"
              type: "*SourceMessage"
            - name: Endpoint
              tag: json:"endpoint,omitempty"
              type: "*EndpointSpec"
            - name: Store
              tag: json:"store,omitempty"
              type: "*StoreSpec"
            - name: Topic
              tag: json:"topic,omitempty"
              type: "*TopicSpec"
            - name: Subscription
              tag: json:"subscription,omitempty"
              type: "*SubscriptionSpec"
            - name: Workflow
              tag: json:"workflow,omitempty"
              type: "*WorkflowSpec"
            - name: Job
              tag: json:"job,omitempty"
              type: "*JobSpec"
            - name: Frontend
              tag: json:"frontend,omitempty"
              type: "*FrontendSpec"
            - name: Auth
              tag: json:"auth,omitempty"
              type: "*AuthSpec"
            - name: Mailer
              tag: json:"mailer,omitempty"
              type: "*MailerSpec"
            - name: Loop
              tag: json:"loop,omitempty"
              type: "*LoopSpec"
            - name: Secret
              tag: json:"secret,omitempty"
              type: "*SecretSpec"
            - name: Port
              tag: json:"port,omitempty"
              type: "*PortSpec"
            - name: Command
              tag: json:"command,omitempty"
              type: "*CommandSpec"
            - name: Query
              tag: json:"query,omitempty"
              type: "*QuerySpec"
            - name: Binary
              tag: json:"binary,omitempty"
              type: "*BinarySpec"
            - name: Role
              tag: json:"role,omitempty"
              type: "*RoleSpec"
            - name: CLI
              tag: json:"cli,omitempty"
              type: "*CLISpec"
            - name: Listener
              tag: json:"listener,omitempty"
              type: "*ListenerSpec"
            - name: Library
              tag: json:"library,omitempty"
              type: "*LibrarySpec"
            - name: Presentation
              tag: json:"presentation,omitempty"
              type: "*PresentationSpec"
            - doc: |-
                Code is the code the node runs, as the static analysis read it: C4's
                code level.
              name: Code
              tag: json:"code,omitempty"
              type: "*CodeResult"
            - doc: Stats are runtime counters, present on a runtime graph.
              name: Stats
              tag: json:"stats,omitempty"
              type: "*StatsMessage"
      - decl: true
        doc: |-
          EndpointSpec describes an HTTP endpoint, or the implementation of a port.
          It carries the method and path, the request and response schemas, and its
          auth.
        name: EndpointSpec
        struct:
          fields:
            - doc: Method is the HTTP method, upper case; empty for an implementation.
              name: Method
              tag: json:"method"
              type: string
            - doc: |-
                Path is the route pattern, with {wildcards}; empty for an
                implementation.
              name: Path
              tag: json:"path"
              type: string
            - doc: Expose is [ExposePublic] or [ExposePrivate].
              name: Expose
              tag: json:"expose"
              type: string
            - doc: |-
                Auth is [AuthRequired], [AuthOptional], or empty when the endpoint
                ignores authentication.
              name: Auth
              tag: json:"auth,omitempty"
              type: string
            - doc: Request is the input type.
              name: Request
              tag: json:"request,omitempty"
              type: "*SchemaMessage"
            - doc: Response is the output type.
              name: Response
              tag: json:"response,omitempty"
              type: "*SchemaMessage"
            - doc: |-
                Pipeline lists the mechanics a request goes through before the
                handler, in order.
              name: Pipeline
              tag: json:"pipeline,omitempty"
              type: "[]MechanicMessage"
            - doc: |-
                Implements is the node ID of the port this endpoint implements
                (Service.Implement): an endpoint with no route, reached through the
                port.
              name: Implements
              tag: json:"implements,omitempty"
              type: string
            - doc: |-
                Exposes is the node ID of the command this endpoint dispatches, or of
                the query it asks (Command.Expose, Query.Expose): its authentication
                is the operation's, and the rest of its pipeline — validation, key,
                authorization — the operation's own.
              name: Exposes
              tag: json:"exposes,omitempty"
              type: string
            - doc: |-
                Access is how an exposure says its operation is open on purpose —
                [AccessAnyone] or [AccessAnyUser] —; empty when the operation says who
                may run it (a permission, a rule), and on any other endpoint.
              name: Access
              tag: json:"access,omitempty"
              type: string
      - decl: true
        doc: |-
          PortSpec describes a port: an operation a service needs and another
          implements.
        name: PortSpec
        struct:
          fields:
            - doc: Request is the type the port is called with.
              name: Request
              tag: json:"request,omitempty"
              type: "*SchemaMessage"
            - doc: Response is the type it answers.
              name: Response
              tag: json:"response,omitempty"
              type: "*SchemaMessage"
            - doc: |-
                Fallback is the node ID of the operation the port declares for when
                the app binds nothing else (kit.Fallback).
              name: Fallback
              tag: json:"fallback,omitempty"
              type: string
            - doc: |-
                Bound is the node ID of the operation the port calls, as the start
                chose it — on a static graph, as the analysis reads the same rule;
                empty when nothing is bound or a test replaced the port. The graph
                draws it as a declared edge from the port.
              name: Bound
              tag: json:"bound,omitempty"
              type: string
            - doc: "Via is how it was chosen: one of the Via constants."
              name: Via
              tag: json:"via,omitempty"
              type: string
      - decl: true
        doc: |-
          CommandSpec describes a command: an operation that changes something.
          It carries its input and result schemas, its handler, its queue and who may
          dispatch it.
        name: CommandSpec
        struct:
          fields:
            - doc: Input is the type it is dispatched with.
              name: Input
              tag: json:"input,omitempty"
              type: "*SchemaMessage"
            - doc: Result is the type it answers; Empty for a queued command.
              name: Result
              tag: json:"result,omitempty"
              type: "*SchemaMessage"
            - doc: Mode is [ModeSync] or [ModeQueued].
              name: Mode
              tag: json:"mode"
              type: string
            - doc: |-
                Auth is [AuthRequired] — implied by a permission —, [AuthOptional],
                or empty when the command ignores authentication.
              name: Auth
              tag: json:"auth,omitempty"
              type: string
            - doc: |-
                Pipeline lists the mechanics a dispatch goes through before the
                handler, in the order they run.
              name: Pipeline
              tag: json:"pipeline,omitempty"
              type: "[]MechanicMessage"
            - doc: Permissions are the permissions a caller needs (Allow).
              name: Permissions
              tag: json:"permissions,omitempty"
              type: "[]PermissionMessage"
            - doc: |-
                Authorize locates the function of its Authorize: a rule that needs
                the data.
              name: Authorize
              tag: json:"authorize,omitempty"
              type: "*SourceMessage"
            - doc: |-
                Key is set when the command names the entity it is about (Key): two
                runs with one key never overlap.
              name: Key
              tag: json:"key,omitempty"
              type: bool
            - doc: |-
                MaxDeliveries is how many attempts a queued command gets before it is
                dead-lettered.
              name: MaxDeliveries
              tag: json:"maxDeliveries,omitempty"
              type: int
            - doc: |-
                Parallelism is how many dispatches of a queued command are handled at
                once.
              name: Parallelism
              tag: json:"parallelism,omitempty"
              type: int
            - doc: "Queue is \"memory\" or \"file\": where a queued command waits."
              name: Queue
              tag: json:"queue,omitempty"
              type: string
            - doc: |-
                DeadLetters is how many dispatches of a queued command were
                abandoned, on a runtime graph.
              name: DeadLetters
              tag: json:"deadLetters,omitempty"
              type: "*int"
      - decl: true
        doc: |-
          QuerySpec describes a query: an operation that reads and changes
          nothing.
        name: QuerySpec
        struct:
          fields:
            - doc: Input is the type it is asked with.
              name: Input
              tag: json:"input,omitempty"
              type: "*SchemaMessage"
            - doc: Result is the type it answers.
              name: Result
              tag: json:"result,omitempty"
              type: "*SchemaMessage"
            - doc: |-
                Auth is [AuthRequired] — implied by a permission —, [AuthOptional],
                or empty when the query ignores authentication.
              name: Auth
              tag: json:"auth,omitempty"
              type: string
            - doc: |-
                Pipeline lists the mechanics a question goes through before the
                handler, in the order they run.
              name: Pipeline
              tag: json:"pipeline,omitempty"
              type: "[]MechanicMessage"
            - doc: Permissions are the permissions a caller needs (Allow).
              name: Permissions
              tag: json:"permissions,omitempty"
              type: "[]PermissionMessage"
            - doc: |-
                Authorize locates the function of its Authorize: a rule that needs
                the data.
              name: Authorize
              tag: json:"authorize,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          PermissionMessage is what a caller needs to dispatch a command or to ask a
          query: that the app's policy lets it do Action to Resource (Allow).
        name: PermissionMessage
        struct:
          fields:
            - doc: "Action is what the caller does: \"place\"."
              name: Action
              tag: json:"action"
              type: string
            - doc: "Resource is the kind of thing it does it to: \"order\"."
              name: Resource
              tag: json:"resource"
              type: string
      - decl: true
        doc: |-
          StoreSpec describes a store.
          It carries the entity's schema, its backend, its indexes, its privacy and
          its history.
        name: StoreSpec
        struct:
          fields:
            - doc: Entity is the stored type.
              name: Entity
              tag: json:"entity,omitempty"
              type: "*SchemaMessage"
            - doc: |-
                Backend is where the store's data is: "memory", "file", or the engine
                of the database that keeps it (ADR 0004): "postgres", "mysql",
                "sqlite".
              name: Backend
              tag: json:"backend"
              type: string
            - doc: |-
                Location is where a file backend keeps its data, relative to the data
                directory.
              name: Location
              tag: json:"location,omitempty"
              type: string
            - doc: |-
                Database names the database that keeps the store, as the app declares
                it (kit.Database, kit.Keeps) — present even while the store's data
                stays in the data directory, in dev without the database's URL. Its
                container is "container:database:<name>".
              name: Database
              tag: json:"database,omitempty"
              type: string
            - doc: |-
                Table is the table the database keeps the store's entities in —
                "<service>__<store>", '-' and '.' written '_', a digest past the
                engine's limit —, beside its index rows in "<table>___ix". Present
                with Database.
              name: Table
              tag: json:"table,omitempty"
              type: string
            - doc: Count is how many entities the store holds, on a runtime graph.
              name: Count
              tag: json:"count,omitempty"
              type: "*int"
            - doc: |-
                Indexes are the secondary indexes the store maintains, in declaration
                order.
              name: Indexes
              tag: json:"indexes,omitempty"
              type: "[]IndexSpec"
            - doc: |-
                Privacy says what the store does with personal data (ADR 0006): whom
                its records are about, why it keeps them and for how long. Absent when
                its entity holds nothing personal and it declares no retention.
              name: Privacy
              tag: json:"privacy,omitempty"
              type: "*StorePrivacyMessage"
            - doc: |-
                History says what the store remembers of its records (ADR 0007): the
                fields that keep their former values, its password policies. Absent
                when it remembers nothing and has no policy.
              name: History
              tag: json:"history,omitempty"
              type: "*StoreHistoryMessage"
            - doc: |-
                ReadModel is set on a store derived from others (kit.ReadModel):
                written by projections — subscriptions —, read by queries.
              name: ReadModel
              tag: json:"readModel,omitempty"
              type: bool
      - decl: true
        doc: |-
          StorePrivacyMessage is what a store keeps of people: whom each record is about,
          why, for how long, and — on a runtime graph — what is held and due.
        name: StorePrivacyMessage
        struct:
          fields:
            - doc: |-
                Subject is the JSON pointer of the field that says whom each record is
                about: "/email". Empty when the entity has no subject field.
              name: Subject
              tag: json:"subject,omitempty"
              type: string
            - doc: Purpose is why the store keeps its records, as kit.Purpose says it.
              name: Purpose
              tag: json:"purpose,omitempty"
              type: string
            - doc: |-
                Erase says when kit clears a record's personal data; Delete when it
                removes the record.
              name: Erase
              tag: json:"erase,omitempty"
              type: "*RetentionSpec"
            - name: Delete
              tag: json:"delete,omitempty"
              type: "*RetentionSpec"
            - doc: |-
                ByProduct is set when the product keeps the store's retention itself
                (kit.RetentionByProduct): kit runs none — Erase and Delete are then
                absent — and asks for neither a retention nor a subject.
              name: ByProduct
              tag: json:"byProduct,omitempty"
              type: "*ProductRetentionSpec"
            - doc: |-
                HeldUntil holds each record until an instant it carries: the law's
                own retention (kit.HeldUntil).
              name: HeldUntil
              tag: json:"heldUntil,omitempty"
              type: "*HeldUntilSpec"
            - doc: |-
                Anonymise locates the function that says what an erased record keeps,
                generalised (kit.Anonymise).
              name: Anonymise
              tag: json:"anonymise,omitempty"
              type: "*SourceMessage"
            - doc: |-
                DeleteOnErasure: a person's erasure deletes the record instead of
                clearing it (kit.DeleteOnErasure).
              name: DeleteOnErasure
              tag: json:"deleteOnErasure,omitempty"
              type: bool
            - doc: Held is how many records a hold keeps, on a runtime graph.
              name: Held
              tag: json:"held,omitempty"
              type: "*int"
            - doc: |-
                Due is when the next record is due to be erased or deleted, on a
                runtime graph; absent when none is.
              name: Due
              tag: json:"due,omitempty"
              type: "*time.Time"
            - doc: |-
                Erased and Deleted count what this run erased and deleted, on a
                runtime graph.
              name: Erased
              tag: json:"erased,omitempty"
              type: "*int"
            - name: Deleted
              tag: json:"deleted,omitempty"
              type: "*int"
      - decl: true
        doc: |-
          ProductRetentionSpec is a retention the product keeps itself, as it says
          it.
        name: ProductRetentionSpec
        struct:
          fields:
            - doc: |-
                Limits says, in the product's words, how long the records keep their
                personal data and how they go — the register's time limits, GDPR
                art. 30(1)(f); empty when it gave none.
              name: Limits
              tag: json:"limits,omitempty"
              type: string
      - decl: true
        doc: |-
          RetentionSpec is when kit erases or deletes a record: after a delay counted
          from an instant the record carries (After or Setting, and Since), or at an
          instant a function gives (At).
        name: RetentionSpec
        struct:
          fields:
            - doc: |-
                After is the delay, as a Go duration: the declared one, or the
                setting's value when the graph describes a running app.
              name: After
              tag: json:"after,omitempty"
              type: string
            - doc: |-
                Setting names the setting of the store's service the delay is read
                from, when the environment gives it.
              name: Setting
              tag: json:"setting,omitempty"
              type: string
            - doc: |-
                Since locates the function that gives the instant the delay counts
                from: a record's closing, say.
              name: Since
              tag: json:"since,omitempty"
              type: "*SourceMessage"
            - doc: At locates the function that gives the instant itself.
              name: At
              tag: json:"at,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          HeldUntilSpec is the hold a store declares on each of its records, until an
          instant the record carries.
        name: HeldUntilSpec
        struct:
          fields:
            - doc: At locates the function that gives the instant.
              name: At
              tag: json:"at,omitempty"
              type: "*SourceMessage"
            - doc: |-
                Reason is the legal ground the declaration gives: "commercial code:
                10 years".
              name: Reason
              tag: json:"reason,omitempty"
              type: string
      - decl: true
        doc: |-
          IndexSpec is one secondary index of a store.
          Its name is unique in the store; Unique says whether two records may share
          a key.
        name: IndexSpec
        struct:
          fields:
            - doc: "Name is how code asks for the index: Store.Lookup(ctx, name, key)."
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                Unique is set when two entities may not share a key: a write that
                would is refused with a conflict.
              name: Unique
              tag: json:"unique,omitempty"
              type: bool
      - decl: true
        doc: |-
          TopicSpec describes a topic.
          It carries the message's schema; its subscriptions are the nodes it
          delivers to.
        name: TopicSpec
        struct:
          fields:
            - doc: Message is the published type.
              name: Message
              tag: json:"message,omitempty"
              type: "*SchemaMessage"
            - doc: "Delivery is the guarantee: \"at-least-once\"."
              name: Delivery
              tag: json:"delivery"
              type: string
            - doc: Broker is "memory" or "file".
              name: Broker
              tag: json:"broker,omitempty"
              type: string
      - decl: true
        doc: |-
          SubscriptionSpec describes a subscription — or a watch (ADR 0008), a
          subscription whose deliveries come from stores instead of a topic.
        name: SubscriptionSpec
        struct:
          fields:
            - doc: Topic is the node ID of the consumed topic; empty for a watch.
              name: Topic
              tag: json:"topic"
              type: string
            - doc: |-
                Mark is what a watch hears the writes of: "personal", "special" or
                "moderated", ADR 0006's marks. Empty for a subscription.
              name: Mark
              tag: json:"mark,omitempty"
              type: string
            - doc: |-
                OwnStores: the watch hears its own module's stores too — the
                product's own, for a watch of the product's (kit.OwnStores) —, never
                the writes its own handler makes.
              name: OwnStores
              tag: json:"ownStores,omitempty"
              type: bool
            - doc: |-
                Stores are the node IDs of the stores that feed a watch, sorted: those
                whose entity holds a field with its mark, but its own module's — the
                product's own, for a watch of the product's — unless OwnStores. Each
                draws a declared delivers edge to it.
              name: Stores
              tag: json:"stores,omitempty"
              type: "[]string"
            - doc: |-
                MaxDeliveries is how many attempts a message gets before it is
                dead-lettered.
              name: MaxDeliveries
              tag: json:"maxDeliveries,omitempty"
              type: int
            - doc: Parallelism is how many messages are handled concurrently.
              name: Parallelism
              tag: json:"parallelism,omitempty"
              type: int
            - doc: DeadLetters is how many messages were abandoned, on a runtime graph.
              name: DeadLetters
              tag: json:"deadLetters,omitempty"
              type: "*int"
      - decl: true
        doc: |-
          WorkflowSpec describes a state machine bound to a store.
          It carries the states and the transitions between them, and the store it
          lives in.
        name: WorkflowSpec
        struct:
          fields:
            - doc: Store is the node ID of the store holding the instances.
              name: Store
              tag: json:"store"
              type: string
            - doc: |-
                Field is the wire name of the entity field holding the state, when the
                state function points at a field of the entity.
              name: Field
              tag: json:"field,omitempty"
              type: string
            - doc: Initial is the state a new instance enters.
              name: Initial
              tag: json:"initial"
              type: string
            - doc: States are in declaration order.
              name: States
              tag: json:"states"
              type: "[]StateSpec"
            - doc: Transitions are in declaration order.
              name: Transitions
              tag: json:"transitions"
              type: "[]TransitionSpec"
      - decl: true
        doc: |-
          StateSpec is one state of a workflow.
          Terminal marks a state an instance stays in; Count is how many instances
          are in it.
        name: StateSpec
        struct:
          fields:
            - doc: Name is the state value, as text.
              name: Name
              tag: json:"name"
              type: string
            - doc: Terminal is set when no transition leaves the state.
              name: Terminal
              tag: json:"terminal,omitempty"
              type: bool
            - doc: Count is how many instances are in the state, on a runtime graph.
              name: Count
              tag: json:"count,omitempty"
              type: "*int"
            - doc: OnEnter lists the hooks run when an instance enters the state.
              name: OnEnter
              tag: json:"onEnter,omitempty"
              type: "[]SourceMessage"
      - decl: true
        doc: |-
          TransitionSpec is one arrow of a workflow.
          It names the event that fires it and the states it goes from and to.
        name: TransitionSpec
        struct:
          fields:
            - doc: Event names the transition. Timer and guard transitions have one too.
              name: Event
              tag: json:"event"
              type: string
            - doc: From is the source state.
              name: From
              tag: json:"from"
              type: string
            - doc: To is the target state.
              name: To
              tag: json:"to"
              type: string
            - doc: Trigger is [TriggerEvent], [TriggerTimer] or [TriggerGuard].
              name: Trigger
              tag: json:"trigger"
              type: string
            - doc: After is the delay of a timer transition, as a Go duration string.
              name: After
              tag: json:"after,omitempty"
              type: string
            - doc: |-
                Setting names the setting of the service the delay is read from, when
                the environment gives it: "archive-after".
              name: Setting
              tag: json:"setting,omitempty"
              type: string
            - doc: |-
                At locates the function that says when a timer transition declared at
                an instant is due — a due date, a deadline the entity carries.
              name: At
              tag: json:"at,omitempty"
              type: "*SourceMessage"
            - doc: Guard locates the condition of a guard transition.
              name: Guard
              tag: json:"guard,omitempty"
              type: "*SourceMessage"
            - doc: Source is where the transition is declared.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
            - doc: Callers are the node IDs found to fire this event.
              name: Callers
              tag: json:"callers,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          JobSpec describes a scheduled job.
          It carries the fixed interval or the cron expression that schedules it.
        name: JobSpec
        struct:
          fields:
            - doc: Schedule is "every 10s" or a five-field cron expression.
              name: Schedule
              tag: json:"schedule"
              type: string
            - doc: Kind is "interval" or "cron".
              name: Kind
              tag: json:"kind"
              type: string
      - decl: true
        doc: |-
          FrontendSpec describes static assets served by the product.
          It carries the path the assets are served under and where they are read
          from.
        name: FrontendSpec
        struct:
          fields:
            - doc: Prefix is the URL path the assets are served under.
              name: Prefix
              tag: json:"prefix"
              type: string
            - doc: Files is how many files are served.
              name: Files
              tag: json:"files,omitempty"
              type: int
      - decl: true
        doc: |-
          AuthSpec describes the app's authentication handler.
          Credentials says what it reads from a request; Endpoints are the ones
          behind it.
        name: AuthSpec
        struct:
          fields:
            - doc: |-
                Credentials is the type the handler reads: its fields are tagged
                cookie:"…" or header:"…".
              name: Credentials
              tag: json:"credentials,omitempty"
              type: "*SchemaMessage"
            - doc: |-
                Data is the type of what the handler says about the caller, which
                endpoints read with kit.AuthData.
              name: Data
              tag: json:"data,omitempty"
              type: "*SchemaMessage"
            - doc: Endpoints counts the endpoints that ask for authentication.
              name: Endpoints
              tag: json:"endpoints"
              type: int
      - decl: true
        doc: |-
          MailerSpec describes outbound mail.
          It carries the transport that empties the outbox and the outbox's counters.
        name: MailerSpec
        struct:
          fields:
            - doc: Transport is [TransportSMTP] or [TransportCapture].
              name: Transport
              tag: json:"transport"
              type: string
            - doc: Server is the relay's host:port. Credentials never appear.
              name: Server
              tag: json:"server,omitempty"
              type: string
            - doc: TLS is "starttls", "implicit" or "none", for SMTP.
              name: TLS
              tag: json:"tls,omitempty"
              type: string
            - doc: From is the default sender.
              name: From
              tag: json:"from,omitempty"
              type: string
            - doc: |-
                MaxAttempts is how many deliveries a message gets before it is
                dead-lettered.
              name: MaxAttempts
              tag: json:"maxAttempts"
              type: int
            - doc: "Outbox is \"memory\" or \"file\": where queued messages wait."
              name: Outbox
              tag: json:"outbox,omitempty"
              type: string
            - doc: Queued is how many messages wait in the outbox, on a runtime graph.
              name: Queued
              tag: json:"queued,omitempty"
              type: "*int"
            - doc: Sent is how many messages the transport accepted, on a runtime graph.
              name: Sent
              tag: json:"sent,omitempty"
              type: "*int"
            - doc: DeadLetters is how many messages were abandoned, on a runtime graph.
              name: DeadLetters
              tag: json:"deadLetters,omitempty"
              type: "*int"
      - decl: true
        doc: |-
          SecretSpec describes a declared secret: how it is made, where it lives,
          its versions — never its value.
        name: SecretSpec
        struct:
          fields:
            - doc: Origin is [SecretProvided] or [SecretGenerated].
              name: Origin
              tag: json:"origin"
              type: string
            - doc: |-
                Variable is the environment variable that provides it, or — for a
                generated secret — pins it: TODO_SMTP_URL, or TODO_SMTP_URL_FILE naming
                a file.
              name: Variable
              tag: json:"variable"
              type: string
            - doc: Bytes is the size of each version of a generated secret.
              name: Bytes
              tag: json:"bytes,omitempty"
              type: int
            - doc: |-
                RotateEvery is how often kit makes a new version of a generated
                secret, as a Go duration.
              name: RotateEvery
              tag: json:"rotateEvery,omitempty"
              type: string
            - doc: Keep is how many versions a rotation leaves, the new one included.
              name: Keep
              tag: json:"keep,omitempty"
              type: int
            - doc: |-
                Optional: a provided secret the product can do without
                (kit.Optional) — found nowhere, it is absent, and the start goes on.
              name: Optional
              tag: json:"optional,omitempty"
              type: bool
            - doc: |-
                From is where the running app found it: one of the SecretFrom
                constants, on a runtime graph. Empty when it is found nowhere — for an
                optional secret, absent.
              name: From
              tag: json:"from,omitempty"
              type: string
            - doc: Version is the number of its current version, from 1.
              name: Version
              tag: json:"version,omitempty"
              type: int
            - doc: |-
                Created is when the current version was made; the environment does
                not say when a variable was set.
              name: Created
              tag: json:"created,omitempty"
              type: "*time.Time"
            - doc: Versions is how many versions are kept.
              name: Versions
              tag: json:"versions,omitempty"
              type: int
            - doc: |-
                NextRotation is when kit rotates it next. Absent when kit does not
                rotate it: provided, pinned by the environment, or in a store kit
                cannot write.
              name: NextRotation
              tag: json:"nextRotation,omitempty"
              type: "*time.Time"
            - doc: |-
                Pinned: a generated secret the environment provides — kit uses it and
                does not rotate it.
              name: Pinned
              tag: json:"pinned,omitempty"
              type: bool
            - doc: Rotations counts the rotations this process made.
              name: Rotations
              tag: json:"rotations,omitempty"
              type: int
            - doc: Problem says why it cannot be used, on a runtime graph.
              name: Problem
              tag: json:"problem,omitempty"
              type: string
      - decl: true
        doc: |-
          LoopSpec describes a loop node.
          Style says whether it is declared (kit owns the wait) or hand-written.
        name: LoopSpec
        struct:
          fields:
            - doc: Style is [LoopDeclared] or [LoopGoroutine].
              name: Style
              tag: json:"style"
              type: string
            - doc: Wakes are what wakes a declared loop.
              name: Wakes
              tag: json:"wakes,omitempty"
              type: "[]WakeSourceMessage"
            - doc: |-
                Selects are the cases of the select statements a hand-written loop
                waits in, as the static analysis read them.
              name: Selects
              tag: json:"selects,omitempty"
              type: "[]SelectCaseMessage"
            - doc: Restart is the supervision policy, as text.
              name: Restart
              tag: json:"restart,omitempty"
              type: string
      - decl: true
        doc: |-
          WakeSourceMessage is one thing that wakes a declared loop.
          Kind says whether a topic, a period (Every) or a function wakes the loop.
        name: WakeSourceMessage
        struct:
          fields:
            - doc: Kind is one of the Wake constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: Every is the period of an interval wake, as a Go duration.
              name: Every
              tag: json:"every,omitempty"
              type: string
            - doc: Topic is the node ID of a topic wake.
              name: Topic
              tag: json:"topic,omitempty"
              type: string
            - doc: Func locates the function computing a deadline wake.
              name: Func
              tag: json:"func,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          SelectCaseMessage is one case of a select statement in a hand-written loop.
          The analyzer reads it from the loop's body; Kind says what the case waits
          on.
        name: SelectCaseMessage
        struct:
          fields:
            - doc: "Text is the case as written: \"<-ticker.C\", \"job := <-jobs\"."
              name: Text
              tag: json:"text"
              type: string
            - doc: Kind is one of the Select constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: Source is where the case is.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
      - decl: true
        doc: |-
          MechanicMessage is a generic building block, backed by an SDK package, that a node
          composes. The catalog lists every mechanic kit offers; an endpoint's
          pipeline lists the ones it uses.
        name: MechanicMessage
        struct:
          fields:
            - doc: "Kind is the stable identifier: \"validate\", \"ratelimit\", \"timeout\"…"
              name: Kind
              tag: json:"kind"
              type: string
            - doc: "Label is a short human rendering of the configuration: \"5/s\"."
              name: Label
              tag: json:"label"
              type: string
            - doc: Package is the SDK package that implements it.
              name: Package
              tag: json:"package,omitempty"
              type: string
            - doc: Doc says what it does, for a catalog.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - doc: Snippet is the Go code that adds it, for a catalog.
              name: Snippet
              tag: json:"snippet,omitempty"
              type: string
            - doc: Config is the configuration, as text.
              name: Config
              tag: json:"config,omitempty"
              type: map[string]string
      - decl: true
        doc: |-
          SchemaMessage describes a Go type as it appears on the wire.
          It is a JSON-Schema-like shape: a kind, its fields or elements, and its Go
          type.
        name: SchemaMessage
        struct:
          fields:
            - doc: |-
                Type is "object", "array", "map", "string", "integer", "number",
                "boolean" or "any".
              name: Type
              tag: json:"type"
              type: string
            - doc: Name is the qualified Go type name, for named types.
              name: Name
              tag: json:"name,omitempty"
              type: string
            - doc: "Format refines a scalar: \"date-time\", \"duration\", \"int64\"…"
              name: Format
              tag: json:"format,omitempty"
              type: string
            - doc: Fields are the members of an object.
              name: Fields
              tag: json:"fields,omitempty"
              type: "[]FieldMessage"
            - doc: Items is the element type of an array.
              name: Items
              tag: json:"items,omitempty"
              type: "*SchemaMessage"
            - doc: Values is the value type of a map.
              name: Values
              tag: json:"values,omitempty"
              type: "*SchemaMessage"
            - doc: Enum lists the allowed values, when they are known.
              name: Enum
              tag: json:"enum,omitempty"
              type: "[]string"
            - doc: Ref names a type already described higher up, to break a cycle.
              name: Ref
              tag: json:"ref,omitempty"
              type: string
            - doc: |-
                Nullable says a nil value is written null: a pointer, a slice, a map,
                an interface — unless its member leaves it out (omitempty, omitzero).
              name: Nullable
              tag: json:"nullable,omitempty"
              type: bool
      - decl: true
        doc: |-
          FieldMessage is one member of an object schema.
          It carries the JSON name, the schema of its value and the classes of its
          data.
        name: FieldMessage
        struct:
          fields:
            - doc: Name is the wire name.
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                In is where a request field is read from: "body", "path", "query",
                "header" or "cookie". Empty outside requests.
              name: In
              tag: json:"in,omitempty"
              type: string
            - doc: Type is the member's schema.
              name: Type
              tag: json:"type"
              type: "*SchemaMessage"
            - doc: Optional is set when the member may be absent.
              name: Optional
              tag: json:"optional,omitempty"
              type: bool
            - doc: Rules are the validation rules, as written in the validate tag.
              name: Rules
              tag: json:"rules,omitempty"
              type: string
            - doc: Doc is the field's comment, when the analyzer found one.
              name: Doc
              tag: json:"doc,omitempty"
              type: string
            - doc: |-
                Class is what the field holds, as its kit tag says (ADR 0006): one of
                the Class constants, or empty when the field is unclassified. A
                subject field is personal unless it is special.
              name: Class
              tag: json:"class,omitempty"
              type: string
            - doc: Subject marks the field that says whom a record is about.
              name: Subject
              tag: json:"subject,omitempty"
              type: bool
            - doc: Moderated marks content others see and a moderator may act on.
              name: Moderated
              tag: json:"moderated,omitempty"
              type: bool
            - doc: |-
                Sealed is set when kit keeps the field sealed at rest (ADR 0006 §4):
                a personal, special or secret field, or the subject, not plain, of
                what kit keeps on disk — a store's entity, a topic's message, a queued
                command's input. A store in memory seals nothing.
              name: Sealed
              tag: json:"sealed,omitempty"
              type: bool
            - doc: Erased marks the time kit stamps when it erases the record.
              name: Erased
              tag: json:"erased,omitempty"
              type: bool
            - doc: History is how many former values kit keeps of the field (ADR 0007).
              name: History
              tag: json:"history,omitempty"
              type: int
      - decl: true
        doc: |-
          NodeKind is the closed set of building blocks a kit product is made of.
          It is a wire format — the graph's JSON and the Studio's TypeScript unions
          carry these names —, so it stays a string.
        name: NodeKind
        underlying: string
      - decl: true
        doc: |-
          BinarySpec is one executable the product ships: the [NodeEntity.Binary] of a
          [KindBinary] node, naming its roles.
        name: BinarySpec
        struct:
          fields:
            - doc: Package is the Go package of its main.
              name: Package
              tag: json:"package,omitempty"
              type: string
            - doc: |-
                Roles are the IDs of its process roles, in declaration order; the
                first is the one it runs with no role argument.
              name: Roles
              tag: json:"roles"
              type: "[]string"
      - decl: true
        doc: |-
          RoleSpec is one process role of a binary: the [NodeEntity.Role] of a
          [KindRole] node — its profile, arguments, singleton and idle stop.
        name: RoleSpec
        struct:
          fields:
            - doc: Binary is the ID of the binary that holds it.
              name: Binary
              tag: json:"binary"
              type: string
            - doc: Profile is one of the Profile constants.
              name: Profile
              tag: json:"profile"
              type: string
            - doc: |-
                Args are the leading arguments that select it — ["daemon"] for
                "statusline daemon" —; empty for the binary's default role.
              name: Args
              tag: json:"args,omitempty"
              type: "[]string"
            - doc: |-
                Singleton, when set, is the scope of the lock that keeps one process of
                this role alive at a time: what the lock's name is derived from.
              name: Singleton
              tag: json:"singleton,omitempty"
              type: string
            - doc: |-
                IdleMs is how long a daemon waits without a client before it stops
                itself; zero means it runs until stopped.
              name: IdleMs
              tag: json:"idleMs,omitempty"
              type: int64
      - decl: true
        doc: |-
          CLISpec is a short command-line command: the [NodeEntity.CLI] of a [KindCLI]
          node, the words that run it.
        name: CLISpec
        struct:
          fields:
            - doc: |-
                Path is the command's words after the binary's name: ["status"],
                ["daemon", "stop"].
              name: Path
              tag: json:"path"
              type: "[]string"
            - doc: Role is the ID of the role that runs it.
              name: Role
              tag: json:"role,omitempty"
              type: string
      - decl: true
        doc: |-
          ListenerSpec is a listener that is not HTTP: the [NodeEntity.Listener] of a
          [KindListener] node — its network, its contract, who may connect.
        name: ListenerSpec
        struct:
          fields:
            - doc: Network is one of the Network constants.
              name: Network
              tag: json:"network"
              type: string
            - doc: "Contract is the versioned contract spoken on it: \"render/v1\"."
              name: Contract
              tag: json:"contract"
              type: string
            - doc: |-
                Peer says who may connect: "owner" (the process's own user), or the
                declared list, never "anyone".
              name: Peer
              tag: json:"peer"
              type: string
            - doc: Role is the ID of the role that runs it.
              name: Role
              tag: json:"role,omitempty"
              type: string
      - decl: true
        doc: |-
          LibrarySpec is a package shared between components (D19): the
          [NodeEntity.Library] of a [KindLibrary] node.
        name: LibrarySpec
        struct:
          fields:
            - doc: Package is its Go import path.
              name: Package
              tag: json:"package"
              type: string
      - decl: true
        doc: |-
          PresentationSpec is what turns results into what a reader sees: the
          [NodeEntity.Presentation] of a [KindPresentation] node.
        name: PresentationSpec
        struct:
          fields:
            - doc: "Media is what it renders: \"text\", \"ansi\", \"html\", \"json\"."
              name: Media
              tag: json:"media"
              type: string
      - decl: true
        doc: |-
          PersonalDataMessage is a person's data as kit.Export gives it (GDPR art. 15 and
          20): their records, store by store, with what art. 15(1) asks beside them.
        name: PersonalDataMessage
        struct:
          fields:
            - doc: Stores are the stores that keep records about the person.
              name: Stores
              tag: json:"stores"
              type: "[]StoreDataMessage"
      - decl: true
        doc: |-
          StoreDataMessage is one store's records about a person.
          It is one part of what kit.Export gives a person about themselves.
        name: StoreDataMessage
        struct:
          fields:
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store"
              type: string
            - doc: Purpose is why the store keeps them.
              name: Purpose
              tag: json:"purpose,omitempty"
              type: string
            - doc: Retention says, in words, how long they keep their personal data.
              name: Retention
              tag: json:"retention,omitempty"
              type: string
            - doc: |-
                Recipients are who inside the product reads them, as far as the
                running app knows.
              name: Recipients
              tag: json:"recipients,omitempty"
              type: "[]string"
            - doc: |-
                Records are the records, their secret members left out. They hold the
                person's data, which the Studio and the logs never show.
              name: Records
              tag: json:"records" kit:"personal"
              type: "[]json.RawMessage"
            - doc: |-
                Former are the former values of the records' fields that keep them
                (ADR 0007), record by record; a secret field's are left out.
              name: Former
              tag: json:"former,omitempty" kit:"personal"
              type: "[]RecordFormerMessage"
            - doc: |-
                Versions are the versions of the records a store with revisions keeps
                (ADR 0007 §3), record by record, their secret members left out.
              name: Versions
              tag: json:"versions,omitempty" kit:"personal"
              type: "[]ExportedVersionsMessage"
      - decl: true
        doc: |-
          ExportedVersionsMessage are the versions of one exported record, as a
          StoreDataMessage carries them beside its records.
        name: ExportedVersionsMessage
        struct:
          fields:
            - doc: Record is the record's position in its StoreData's Records.
              name: Record
              tag: json:"record"
              type: int
            - doc: |-
                Versions are its versions, newest first — the record as it is now
                first —, each without its secret members.
              name: Versions
              tag: json:"versions"
              type: "[]RecordVersionMessage"
      - decl: true
        doc: |-
          ErasureMessage is what kit.Erase did, store by store.
          Stores lists, store by store, what the erasure did there.
        name: ErasureMessage
        struct:
          fields:
            - doc: Stores are the stores that kept records about the person.
              name: Stores
              tag: json:"stores"
              type: "[]StoreErasureMessage"
      - decl: true
        doc: |-
          StoreErasureMessage is one store's part of an erasure: the keys of the records
          erased, deleted, and held — left in place, as a legal hold asks. A key
          may be personal data, which the Studio and the logs never show.
        name: StoreErasureMessage
        struct:
          fields:
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store"
              type: string
            - doc: Erased are the records whose personal data was cleared.
              name: Erased
              tag: json:"erased,omitempty" kit:"personal"
              type: "[]string"
            - doc: Deleted are the records removed.
              name: Deleted
              tag: json:"deleted,omitempty" kit:"personal"
              type: "[]string"
            - doc: Held are the records a hold keeps, untouched.
              name: Held
              tag: json:"held,omitempty" kit:"personal"
              type: "[]string"
      - decl: true
        doc: |-
          PrivacyMessage is what a running app says of the personal data it keeps.
          It is the Privacy page's data: the register, the holds and the journal's
          state.
        name: PrivacyMessage
        struct:
          fields:
            - doc: "Retention is KIT_RETENTION: one of the Retention constants."
              name: Retention
              tag: json:"retention"
              type: string
            - doc: Register is the record of processing, as far as the code knows it.
              name: Register
              tag: json:"register"
              type: RegisterMessage
            - doc: Holds are the records a legal hold keeps, newest first.
              name: Holds
              tag: json:"holds,omitempty"
              type: "[]HoldEvent"
            - doc: Journal is the privacy journal's latest entries, newest first.
              name: Journal
              tag: json:"journal,omitempty"
              type: "[]JournalEntryEvent"
            - doc: Chain says whether the journal's chain holds.
              name: Chain
              tag: json:"chain"
              type: JournalCheckMessage
      - decl: true
        doc: |-
          RegisterMessage is the record of processing of GDPR art. 30(1), as far as the
          code knows it.
        name: RegisterMessage
        struct:
          fields:
            - doc: App is the product.
              name: App
              tag: json:"app"
              type: string
            - doc: |-
                ToComplete are the points the code cannot know, for a person to
                write: "a" (the controller and its representatives), "e" (the
                transfers).
              name: ToComplete
              tag: json:"toComplete,omitempty"
              type: "[]string"
            - doc: Stores are the stores that keep personal data, by node ID.
              name: Stores
              tag: json:"stores,omitempty"
              type: "[]RegisterStoreMessage"
      - decl: true
        doc: |-
          RegisterStoreMessage is one store's line in the register.
          It names the classes the store keeps, their purposes and their retention.
        name: RegisterStoreMessage
        struct:
          fields:
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store"
              type: string
            - doc: "Purpose is point (b): why the store keeps its records."
              name: Purpose
              tag: json:"purpose,omitempty"
              type: string
            - doc: |-
                Subject is point (c)'s category of data subjects: the pointer of the
                field that says whom each record is about.
              name: Subject
              tag: json:"subject,omitempty"
              type: string
            - doc: SubjectDoc is that field's comment, when the analyzer read it.
              name: SubjectDoc
              tag: json:"subjectDoc,omitempty"
              type: string
            - doc: |-
                Personal, Special and Secret are point (c)'s categories of personal
                data: the fields of each class, as JSON pointers. Special fields are
                art. 9 data; secret ones are credentials.
              name: Personal
              tag: json:"personal,omitempty"
              type: "[]string"
            - name: Special
              tag: json:"special,omitempty"
              type: "[]string"
            - name: Secret
              tag: json:"secret,omitempty"
              type: "[]string"
            - doc: |-
                Recipients are point (d) inside the product: the nodes the graph
                shows reading the store, and the connectors that carry its data out.
              name: Recipients
              tag: json:"recipients,omitempty"
              type: "[]string"
            - doc: Erase, Delete and HeldUntil are point (f), the time limits, in words.
              name: Erase
              tag: json:"erase,omitempty"
              type: string
            - name: Delete
              tag: json:"delete,omitempty"
              type: string
            - name: HeldUntil
              tag: json:"heldUntil,omitempty"
              type: string
            - doc: |-
                ByProduct is point (f) when the product keeps the store's retention
                itself (kit.RetentionByProduct), in its own words: no retention gap,
                and no subject gap either.
              name: ByProduct
              tag: json:"byProduct,omitempty"
              type: "*ProductRetentionSpec"
            - doc: "Security is point (g): the measures kit takes."
              name: Security
              tag: json:"security,omitempty"
              type: "[]string"
            - doc: Gaps are the Gap constants the store lacks.
              name: Gaps
              tag: json:"gaps,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          HoldEvent is one record a legal hold keeps. It carries references only: never
          the record's key, its subject's identity, or the hold's reason, which kit
          keeps apart.
        name: HoldEvent
        struct:
          fields:
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store"
              type: string
            - doc: Record is the record's reference.
              name: Record
              tag: json:"record"
              type: string
            - doc: |-
                Subject is the reference of the person the record is about, when it
                has one.
              name: Subject
              tag: json:"subject,omitempty"
              type: string
            - doc: "By is who placed it: a user's ID, \"cli\" or \"studio\"."
              name: By
              tag: json:"by"
              type: string
            - doc: At is when.
              name: At
              tag: json:"at"
              type: time.Time
      - decl: true
        doc: |-
          JournalEntryEvent is one operation of the privacy journal: what was done,
          where, by whom and when, with references only — never an identity, a
          value or a key. Each entry is chained to the previous one by SHA-256.
        name: JournalEntryEvent
        struct:
          fields:
            - doc: Seq numbers the entries from 1, with no gap.
              name: Seq
              tag: json:"seq"
              type: int64
            - doc: At is when, on the app's clock.
              name: At
              tag: json:"at"
              type: time.Time
            - doc: Op is one of the Journal constants.
              name: Op
              tag: json:"op"
              type: string
            - doc: |-
                DryRun marks what the retention would have done under
                KIT_RETENTION=dry-run: nothing changed.
              name: DryRun
              tag: json:"dryRun,omitempty"
              type: bool
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store,omitempty"
              type: string
            - doc: Record is the record's reference; Subject its subject's.
              name: Record
              tag: json:"record,omitempty"
              type: string
            - name: Subject
              tag: json:"subject,omitempty"
              type: string
            - doc: |-
                By is who: a user's ID, the node that called, "retention", "cli" or
                "studio".
              name: By
              tag: json:"by"
              type: string
            - doc: |-
                Hash is the entry's link in the chain: SHA-256 of the previous
                entry's hash and this entry.
              name: Hash
              tag: json:"hash"
              type: string
      - decl: true
        doc: |-
          JournalCheckMessage is what verifying the journal's chain found.
          A broken chain names the first entry whose hash does not follow.
        name: JournalCheckMessage
        struct:
          fields:
            - doc: Entries is how many entries the journal holds.
              name: Entries
              tag: json:"entries"
              type: int
            - doc: |-
                BrokenAt is the sequence number where the chain breaks: an entry
                changed, or one removed before it. Zero when the chain holds.
              name: BrokenAt
              tag: json:"brokenAt,omitempty"
              type: int64
      - decl: true
        doc: |-
          RecordFormerMessage is the former values of one exported record's fields.
          A personal or special field's former values are redacted, never exported in
          clear.
        name: RecordFormerMessage
        struct:
          fields:
            - doc: Record is the record's position in its StoreData's Records.
              name: Record
              tag: json:"record"
              type: int
            - doc: |-
                Fields are each field's former values, newest first, by the field's
                JSON pointer. A secret field's are left out.
              name: Fields
              tag: json:"fields"
              type: map[string][]FormerMessage
      - decl: true
        doc: |-
          ProfileResult is a pprof profile of the running product, folded onto its graph:
          every sample is attributed to the node whose code was running — through
          the pprof label kit puts on every handler, subscription, job and loop run,
          or, for the heap, which carries no label, through the node's code functions
          on the sample's stack.
        name: ProfileResult
        struct:
          fields:
            - doc: Kind is one of the Profile constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: At is when the profile ended.
              name: At
              tag: json:"at"
              type: time.Time
            - doc: DurationMs is how long a CPU profile sampled.
              name: DurationMs
              tag: json:"durationMs,omitempty"
              type: float64
            - doc: "Unit is what the values count: \"ms\" of CPU, \"bytes\" of heap."
              name: Unit
              tag: json:"unit"
              type: string
            - doc: Total is the sum of every sample.
              name: Total
              tag: json:"total"
              type: float64
            - doc: Nodes are the costs attributed to nodes, highest first.
              name: Nodes
              tag: json:"nodes"
              type: "[]NodeCostMessage"
            - doc: |-
                Unattributed is the cost outside any node's code: the runtime, the
                garbage collector, kit itself, idle loops.
              name: Unattributed
              tag: json:"unattributed"
              type: float64
            - doc: Top are the costliest functions, by flat cost.
              name: Top
              tag: json:"top"
              type: "[]FuncCostMessage"
            - doc: Flame is the call tree, root first, pruned below 0.5% of Total.
              name: Flame
              tag: json:"flame,omitempty"
              type: "*FlameNodeMessage"
      - decl: true
        doc: |-
          NodeCostMessage is what one node cost.
          It is the share of the profile's samples spent in the node's code.
        name: NodeCostMessage
        struct:
          fields:
            - doc: Node is the node ID.
              name: Node
              tag: json:"node"
              type: string
            - doc: Value is the cost, in the profile's unit.
              name: Value
              tag: json:"value"
              type: float64
            - doc: Share is Value over Total, from 0 to 1.
              name: Share
              tag: json:"share"
              type: float64
            - doc: Top are the node's costliest functions.
              name: Top
              tag: json:"top,omitempty"
              type: "[]FuncCostMessage"
      - decl: true
        doc: |-
          FuncCostMessage is what one function cost.
          It carries the flat and cumulative samples of the function and where it
          lives.
        name: FuncCostMessage
        struct:
          fields:
            - doc: Func is the qualified function name.
              name: Func
              tag: json:"func"
              type: string
            - doc: Source locates it, when it is in the product's module.
              name: Source
              tag: json:"source,omitempty"
              type: "*SourceMessage"
            - doc: Flat is the cost of the function's own code; Cum includes its callees.
              name: Flat
              tag: json:"flat"
              type: float64
            - name: Cum
              tag: json:"cum"
              type: float64
            - doc: Node is the node it was attributed to, when one.
              name: Node
              tag: json:"node,omitempty"
              type: string
      - decl: true
        doc: |-
          FlameNodeMessage is one frame of a flame graph.
          Its children are the frames it called; its value is the samples under it.
        name: FlameNodeMessage
        struct:
          fields:
            - doc: Name is the function.
              name: Name
              tag: json:"name"
              type: string
            - doc: Value is its cumulative cost.
              name: Value
              tag: json:"value"
              type: float64
            - doc: Node is the node the frame belongs to, when it is a node's code.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: Children are its callees, highest first.
              name: Children
              tag: json:"children,omitempty"
              type: "[]*FlameNodeMessage"
      - decl: true
        doc: |-
          GoroutinesResult is every goroutine of the process, grouped by what it runs.
          Each group names the node its stack runs in, when one does.
        name: GoroutinesResult
        struct:
          fields:
            - doc: At is when they were counted.
              name: At
              tag: json:"at"
              type: time.Time
            - doc: Total is how many goroutines exist.
              name: Total
              tag: json:"total"
              type: int
            - doc: |-
                Groups are goroutines sharing a node or loop, a state and a top frame,
                largest first.
              name: Groups
              tag: json:"groups"
              type: "[]GoroutineGroup"
      - decl: true
        doc: |-
          GoroutineGroup is goroutines doing the same thing.
          They share one stack; Count says how many run it.
        name: GoroutineGroup
        struct:
          fields:
            - doc: Node is the node they run for, from their pprof label, when any.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: "Loop is the loop they are, when kit knows: \"http accept\", a consumer."
              name: Loop
              tag: json:"loop,omitempty"
              type: string
            - doc: |-
                State is the runtime's word for what they wait on: "running",
                "select", "chan receive", "IO wait", "sleep", "semacquire"…
              name: State
              tag: json:"state"
              type: string
            - doc: Count is how many goroutines are in the group.
              name: Count
              tag: json:"count"
              type: int
            - doc: Top is the innermost frame that is not the runtime's.
              name: Top
              tag: json:"top"
              type: string
            - doc: Stack is the group's stack, innermost first, capped.
              name: Stack
              tag: json:"stack,omitempty"
              type: "[]string"
      - decl: true
        doc: |-
          RuntimeMessage is what a running process says about itself: the daemon's own state
          and its internal loop.
        name: RuntimeMessage
        struct:
          fields:
            - doc: Phase is one of the Phase constants.
              name: Phase
              tag: json:"phase"
              type: string
            - doc: StartedAt is when the process started.
              name: StartedAt
              tag: json:"startedAt"
              type: time.Time
            - doc: Components are the lifecycle components, in start order.
              name: Components
              tag: json:"components"
              type: "[]ComponentMessage"
            - doc: Loops are the recurring pieces of the internal loop.
              name: Loops
              tag: json:"loops"
              type: "[]LoopMessage"
            - doc: |-
                History lists the phases the process went through, oldest first: the
                daemon's own state machine, as it ran.
              name: History
              tag: json:"history,omitempty"
              type: "[]PhaseChangeEvent"
            - doc: Process is the Go process, sampled when the graph was built.
              name: Process
              tag: json:"process,omitempty"
              type: "*ProcessSpec"
            - doc: HTTP is the product's HTTP server.
              name: HTTP
              tag: json:"http,omitempty"
              type: "*HTTPServer"
            - doc: Mocks are the replacements a test gave the app (kit.Replace).
              name: Mocks
              tag: json:"mocks,omitempty"
              type: "[]MockMessage"
            - doc: Dev describes the build `kit dev` made of this process, when it did.
              name: Dev
              tag: json:"dev,omitempty"
              type: "*DevBuildMessage"
            - doc: |-
                Config is how the product was configured when it started: every
                setting kit read, the value it uses — never a secret's — and where
                that value came from.
              name: Config
              tag: json:"config,omitempty"
              type: "[]SettingMessage"
            - doc: |-
                Boot is what kit did to start the product, step by step, as it ran;
                the lifecycle components it then started are Components.
              name: Boot
              tag: json:"boot,omitempty"
              type: "[]BootStepMessage"
            - doc: |-
                Databases are the databases the app declares, as this run found them:
                each one's state, readiness, pool and migrations.
              name: Databases
              tag: json:"databases,omitempty"
              type: "[]DatabaseMessage"
      - decl: true
        doc: |-
          DatabaseMessage is one database the app declares (kit.Database), as the running
          process found it. Its URL is never shown: where it was found, the engine,
          the address and the TLS mode are.
        name: DatabaseMessage
        struct:
          fields:
            - doc: Name is the database's, as the app declares it.
              name: Name
              tag: json:"name"
              type: string
            - doc: "Engine is the engine it runs on: \"postgres\", \"mysql\", \"sqlite\"."
              name: Engine
              tag: json:"engine"
              type: string
            - doc: State is one of the Database constants.
              name: State
              tag: json:"state"
              type: string
            - doc: Ready says whether it answered its last check; CheckedAt says when.
              name: Ready
              tag: json:"ready"
              type: bool
            - name: CheckedAt
              tag: json:"checkedAt,omitempty"
              type: "*time.Time"
            - doc: |-
                Problem is the public text of its last failure: a start that failed,
                a check it did not answer.
              name: Problem
              tag: json:"problem,omitempty"
              type: string
            - doc: |-
                URLFrom is where its URL was found — a Setting constant: env, store,
                or default for a SQLite file beside the data —, empty when it is set
                nowhere.
              name: URLFrom
              tag: json:"urlFrom,omitempty"
              type: string
            - doc: |-
                TLS is the TLS mode its URL writes: "verify-full"; "none" when it is
                written off; empty when the URL leaves it to the driver, or when the
                database is a file.
              name: TLS
              tag: json:"tls,omitempty"
              type: string
            - doc: |-
                Pool is database/sql's own count of its connections, sampled when the
                graph was built.
              name: Pool
              tag: json:"pool,omitempty"
              type: "*Pool"
            - doc: |-
                Migrations are its sets of migrations, kit's first, as the start —
                or the last sample — found them.
              name: Migrations
              tag: json:"migrations,omitempty"
              type: "[]MigrationSetMessage"
      - decl: true
        doc: |-
          Pool is a database's connection pool, as database/sql counts it.
          It is sampled when the runtime state is read; its counters never move a
          revision.
        name: Pool
        struct:
          fields:
            - doc: MaxOpen is its ceiling.
              name: MaxOpen
              tag: json:"maxOpen"
              type: int
            - doc: "Open is how many connections are open: InUse and Idle."
              name: Open
              tag: json:"open"
              type: int
            - name: InUse
              tag: json:"inUse"
              type: int
            - name: Idle
              tag: json:"idle"
              type: int
            - doc: |-
                Waits counts the calls that waited for a connection, and WaitMs how
                long they waited in all.
              name: Waits
              tag: json:"waits"
              type: int64
            - name: WaitMs
              tag: json:"waitMs"
              type: float64
            - doc: |-
                Closed counts the connections closed for being idle too many, idle
                too long, or too old.
              name: Closed
              tag: json:"closed,omitempty"
              type: int64
      - decl: true
        doc: |-
          MigrationSetMessage is one set of migrations on a database — kit's own, the
          product's (kit.Migrations), a module's — with its own version table, and
          so its own lock.
        name: MigrationSetMessage
        struct:
          fields:
            - doc: "Name is the set's origin: \"kit\", \"product\", or a module's name."
              name: Name
              tag: json:"name"
              type: string
            - doc: "Table is its version table: \"kit_migrations\", \"schema_migrations\"."
              name: Table
              tag: json:"table"
              type: string
            - doc: |-
                Applied are the migrations the database records, and Pending those
                this build carries that it does not, oldest first.
              name: Applied
              tag: json:"applied,omitempty"
              type: "[]MigrationMessage"
            - name: Pending
              tag: json:"pending,omitempty"
              type: "[]MigrationMessage"
            - doc: Problem is why the set could not be read or applied.
              name: Problem
              tag: json:"problem,omitempty"
              type: string
      - decl: true
        doc: |-
          MigrationMessage is one versioned migration.
          Its Version orders it among the others; Name says what it does.
        name: MigrationMessage
        struct:
          fields:
            - doc: "Version orders it: a UTC timestamp by convention, 20260910143000."
              name: Version
              tag: json:"version"
              type: uint64
            - doc: Name says what it does; empty for a version this build does not carry.
              name: Name
              tag: json:"name,omitempty"
              type: string
      - decl: true
        doc: |-
          SettingMessage is one configuration value kit read when the product started:
          kit's own, or one a service of the product declares.
        name: SettingMessage
        struct:
          fields:
            - doc: |-
                Name is the environment variable that sets it: "KIT_ADDR",
                "TODO_BASE_URL".
              name: Name
              tag: json:"name"
              type: string
            - doc: "Value is what kit uses. A secret's is left out: Secret says so."
              name: Value
              tag: json:"value,omitempty"
              type: string
            - doc: From is one of the Setting constants.
              name: From
              tag: json:"from"
              type: string
            - doc: Service declared it; empty for kit's own.
              name: Service
              tag: json:"service,omitempty"
              type: string
            - doc: |-
                Key is a declared setting's name, its key in a configuration file:
                "base-url". A module's is qualified with the module's name,
                "moderation.tdb-url": kit.Set's key, and in a file "tdb-url" under
                "moderation:" (ADR 0008).
              name: Key
              tag: json:"key,omitempty"
              type: string
            - doc: |-
                Type is what a declared setting holds: text, bool, int, number,
                duration or list.
              name: Type
              tag: json:"type,omitempty"
              type: string
            - doc: |-
                Detail is the configuration file that gave the value, when From is
                SettingFile: "config/production.yaml".
              name: Detail
              tag: json:"detail,omitempty"
              type: string
            - doc: "Secret: the value is withheld."
              name: Secret
              tag: json:"secret,omitempty"
              type: bool
            - doc: |-
                Option is the AppOption that sets it in code, when there is one:
                "kit.Listen". Code wins over the environment.
              name: Option
              tag: json:"option,omitempty"
              type: string
            - doc: |-
                Flag is the kit dev flag that sets it in dev, when there is one:
                "-addr".
              name: Flag
              tag: json:"flag,omitempty"
              type: string
            - doc: |-
                Database is the database the setting configures, when kit declares it
                for one (kit.Database): its URL, its pool, its timeouts.
              name: Database
              tag: json:"database,omitempty"
              type: string
      - decl: true
        doc: |-
          BootStepMessage is one step of the start, as it ran.
          It carries when it began, how long it took and, when it failed, its error.
        name: BootStepMessage
        struct:
          fields:
            - doc: Name is one of the Boot constants.
              name: Name
              tag: json:"name"
              type: string
            - doc: |-
                Count is how many it went through: settings, warnings, services,
                routes, components.
              name: Count
              tag: json:"count,omitempty"
              type: int
            - doc: "Value is what it used: the data directory, in dev."
              name: Value
              tag: json:"value,omitempty"
              type: string
            - doc: Begun is when it began.
              name: Begun
              tag: json:"begun"
              type: time.Time
            - doc: TookMs is how long it took.
              name: TookMs
              tag: json:"tookMs"
              type: float64
            - doc: Error is the public message of a failure.
              name: Error
              tag: json:"error,omitempty"
              type: string
      - decl: true
        doc: |-
          DevBuildMessage is one build of `kit dev`: when, how long, and why.
          It lets the Studio say what changed and how long the reload took.
        name: DevBuildMessage
        struct:
          fields:
            - doc: BuiltAt is when the build finished.
              name: BuiltAt
              tag: json:"builtAt,omitempty"
              type: "*time.Time"
            - doc: BuildMs is how long it took.
              name: BuildMs
              tag: json:"buildMs,omitempty"
              type: float64
            - doc: |-
                Rebuilds counts the builds of this kit dev session, this one
                included: 1 is the first start.
              name: Rebuilds
              tag: json:"rebuilds,omitempty"
              type: int
            - doc: |-
                Changed are the files whose change triggered this build, relative to
                the module root, at most 20.
              name: Changed
              tag: json:"changed,omitempty"
              type: "[]string"
            - doc: More counts the changed files beyond Changed.
              name: More
              tag: json:"more,omitempty"
              type: int
      - decl: true
        doc: |-
          PhaseChangeEvent is one step of the daemon's life.
          It carries the phase entered, when it was entered, and why.
        name: PhaseChangeEvent
        struct:
          fields:
            - doc: "Phase is the phase entered: one of the Phase constants."
              name: Phase
              tag: json:"phase"
              type: string
            - doc: At is when.
              name: At
              tag: json:"at"
              type: time.Time
            - doc: |-
                Reason says why, when it is not the natural next step: "SIGTERM",
                "a component failed".
              name: Reason
              tag: json:"reason,omitempty"
              type: string
      - decl: true
        doc: |-
          ProcessSpec is the Go process a product runs in.
          It carries the runtime's figures — goroutines, heap, GC, CPU — taken at At.
        name: ProcessSpec
        struct:
          fields:
            - doc: PID is the process ID.
              name: PID
              tag: json:"pid"
              type: int
            - doc: Go is the Go version the binary was built with.
              name: Go
              tag: json:"go"
              type: string
            - doc: OS and Arch are GOOS and GOARCH.
              name: OS
              tag: json:"os"
              type: string
            - name: Arch
              tag: json:"arch"
              type: string
            - doc: MaxProcs is GOMAXPROCS; CPUs the logical CPUs the process sees.
              name: MaxProcs
              tag: json:"maxProcs"
              type: int
            - name: CPUs
              tag: json:"cpus"
              type: int
            - doc: Goroutines is how many goroutines exist.
              name: Goroutines
              tag: json:"goroutines"
              type: int
            - doc: HeapBytes is the live heap; HeapObjects its object count.
              name: HeapBytes
              tag: json:"heapBytes"
              type: uint64
            - name: HeapObjects
              tag: json:"heapObjects"
              type: uint64
            - doc: HeapGoalBytes is the heap size at which the next collection starts.
              name: HeapGoalBytes
              tag: json:"heapGoalBytes,omitempty"
              type: uint64
            - doc: |-
                MemoryBytes is all the memory the Go runtime holds from the system:
                the heap, the stacks, the runtime's own structures.
              name: MemoryBytes
              tag: json:"memoryBytes,omitempty"
              type: uint64
            - doc: TotalAllocBytes is every byte ever allocated on the heap.
              name: TotalAllocBytes
              tag: json:"totalAllocBytes"
              type: uint64
            - doc: GCCycles counts completed garbage collections.
              name: GCCycles
              tag: json:"gcCycles"
              type: uint64
            - doc: LastGC is when the last collection ended; absent before the first.
              name: LastGC
              tag: json:"lastGC,omitempty"
              type: "*time.Time"
            - doc: GCPauseP99Ms is the 99th percentile stop-the-world pause.
              name: GCPauseP99Ms
              tag: json:"gcPauseP99Ms"
              type: float64
            - doc: SchedLatencyP99Ms is the 99th percentile time a goroutine waited to run.
              name: SchedLatencyP99Ms
              tag: json:"schedLatencyP99Ms"
              type: float64
            - doc: CPUSeconds is the CPU time the process consumed, user and system.
              name: CPUSeconds
              tag: json:"cpuSeconds"
              type: float64
            - doc: UptimeMs is how long the process has run.
              name: UptimeMs
              tag: json:"uptimeMs"
              type: float64
            - doc: At is when the sample was taken.
              name: At
              tag: json:"at"
              type: time.Time
      - decl: true
        doc: |-
          HTTPServer is the product's HTTP server, and whose loop serves it.
          Its address is the one it listens on; its loop is the node that runs it.
        name: HTTPServer
        struct:
          fields:
            - doc: |-
                Library is the implementation: "sdk/v1/net/server" — the SDK's engine
                accepting and draining the connections, net/http speaking the protocol.
              name: Library
              tag: json:"library"
              type: string
            - doc: |-
                Loop says how it serves: one accept loop, one goroutine per
                connection, written by the library rather than the product.
              name: Loop
              tag: json:"loop"
              type: string
            - doc: Addr is the listening address.
              name: Addr
              tag: json:"addr,omitempty"
              type: string
            - doc: |-
                Middleware is the chain every request goes through before its route,
                outermost first.
              name: Middleware
              tag: json:"middleware,omitempty"
              type: "[]MechanicMessage"
            - doc: |-
                Timeouts are the server's timeouts, as Go durations: "readHeader",
                "read", "write", "idle".
              name: Timeouts
              tag: json:"timeouts,omitempty"
              type: map[string]string
            - doc: |-
                Conns counts connections: "active" now, "total" ever accepted,
                "rejected" by the listener's ceiling. Older graphs carry "new", "idle"
                and "hijacked" too.
              name: Conns
              tag: json:"conns,omitempty"
              type: map[string]int64
            - doc: InFlight is how many requests are being served.
              name: InFlight
              tag: json:"inFlight"
              type: int64
            - doc: Served counts the requests served since start.
              name: Served
              tag: json:"served"
              type: int64
      - decl: true
        doc: |-
          ComponentMessage is one lifecycle component: brought up in order, taken down in
          reverse.
        name: ComponentMessage
        struct:
          fields:
            - doc: "Name is the lifecycle name: \"store:todos/store/todos\", \"http\"…"
              name: Name
              tag: json:"name"
              type: string
            - doc: Node is the node the component belongs to, when there is one.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: State is one of the Component constants.
              name: State
              tag: json:"state"
              type: string
            - doc: Begun is when the last start or stop call began.
              name: Begun
              tag: json:"begun,omitempty"
              type: "*time.Time"
            - doc: TookMs is how long that call took.
              name: TookMs
              tag: json:"tookMs,omitempty"
              type: float64
            - doc: Error is the public message of a failure.
              name: Error
              tag: json:"error,omitempty"
              type: string
      - decl: true
        doc: |-
          LoopMessage is one recurring piece of the daemon's internal loop: a job, a
          workflow's timer sweep, a subscription's consumer, the HTTP accept loop, a
          declared or hand-written loop.
        name: LoopMessage
        struct:
          fields:
            - doc: Name identifies the loop.
              name: Name
              tag: json:"name"
              type: string
            - doc: Node is the node the loop drives.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: Kind is one of the Loop constants.
              name: Kind
              tag: json:"kind"
              type: string
            - doc: Provenance is one of the Provenance constants.
              name: Provenance
              tag: json:"provenance,omitempty"
              type: string
            - doc: |-
                Library names the code that loops, for a library or kit loop:
                "net/http", "sdk/v1/app/scheduler", "sdk/v1/data/queue",
                "sdk/v1/app/mail/spool", "sdk/v1/app/statemachine", "kit".
              name: Library
              tag: json:"library,omitempty"
              type: string
            - doc: State is one of the Loop state constants.
              name: State
              tag: json:"state,omitempty"
              type: string
            - doc: |-
                LastWake is why the last run started: "interval", "topic",
                "deadline", "manual", "start".
              name: LastWake
              tag: json:"lastWake,omitempty"
              type: string
            - doc: Restarts counts supervised restarts, for a hand-written loop.
              name: Restarts
              tag: json:"restarts,omitempty"
              type: int64
            - doc: "Schedule is human text: \"every 10s\", \"*/5 * * * *\", \"on publish · poll 5s\"."
              name: Schedule
              tag: json:"schedule"
              type: string
            - doc: Runs counts completed runs.
              name: Runs
              tag: json:"runs"
              type: int64
            - doc: Errors counts failed runs.
              name: Errors
              tag: json:"errors"
              type: int64
            - doc: Missed counts due instants dropped because they had already passed.
              name: Missed
              tag: json:"missed"
              type: int64
            - doc: Skipped counts fires skipped because the previous run was still going.
              name: Skipped
              tag: json:"skipped"
              type: int64
            - doc: LastRun is when the last run started.
              name: LastRun
              tag: json:"lastRun,omitempty"
              type: "*time.Time"
            - doc: LastMs is how long the last run took.
              name: LastMs
              tag: json:"lastMs,omitempty"
              type: float64
            - doc: NextRun is when the next run is due, when it is known.
              name: NextRun
              tag: json:"nextRun,omitempty"
              type: "*time.Time"
            - doc: LastError is the public message of the last failure.
              name: LastError
              tag: json:"lastError,omitempty"
              type: string
      - decl: true
        doc: |-
          Event is one live event. Exactly one of the payload fields matching Type is
          set.
        name: Event
        struct:
          fields:
            - doc: Seq increases strictly on one stream; a reader drops what it has seen.
              name: Seq
              tag: json:"seq"
              type: uint64
            - doc: Type selects the payload.
              name: Type
              tag: json:"type"
              type: EventType
            - doc: Time is when it happened.
              name: Time
              tag: json:"time"
              type: time.Time
            - doc: Revision is the graph revision, on hello and graph events.
              name: Revision
              tag: json:"revision,omitempty"
              type: string
            - doc: |-
                StartedAt is when the process's current run started, on hello: a new
                value means the process restarted, and what the reader knew of the
                previous run is stale.
              name: StartedAt
              tag: json:"startedAt,omitempty"
              type: "*time.Time"
            - doc: Phase is the process phase, on hello and lifecycle events.
              name: Phase
              tag: json:"phase,omitempty"
              type: string
            - name: Span
              tag: json:"span,omitempty"
              type: "*SpanMessage"
            - name: Transition
              tag: json:"transition,omitempty"
              type: "*TransitionEvent"
            - name: Lifecycle
              tag: json:"lifecycle,omitempty"
              type: "*ComponentMessage"
            - name: Loop
              tag: json:"loop,omitempty"
              type: "*LoopMessage"
            - name: Census
              tag: json:"census,omitempty"
              type: "*CensusMessage"
            - name: Log
              tag: json:"log,omitempty"
              type: "*LogRecordMessage"
            - name: Mail
              tag: json:"mail,omitempty"
              type: "*MailSummaryMessage"
      - decl: true
        doc: |-
          SpanMessage is a finished unit of work, attributed to a node. Only allow-listed,
          wire-safe fields travel: no URL, no query string, no private error text.
        name: SpanMessage
        struct:
          fields:
            - doc: TraceID groups the spans of one causal chain (W3C, hex).
              name: TraceID
              tag: json:"traceId"
              type: string
            - doc: SpanID identifies the span (W3C, hex).
              name: SpanID
              tag: json:"spanId"
              type: string
            - doc: ParentID is the parent span, absent on a root.
              name: ParentID
              tag: json:"parentId,omitempty"
              type: string
            - doc: Node is where the work happened.
              name: Node
              tag: json:"node"
              type: string
            - doc: "From is the node that caused it: the edge this span travelled."
              name: From
              tag: json:"from,omitempty"
              type: string
            - doc: Edge is the kind of the edge From → Node.
              name: Edge
              tag: json:"edge,omitempty"
              type: EdgeKind
            - doc: Label refines Edge, like the edge's own label.
              name: Label
              tag: json:"label,omitempty"
              type: string
            - doc: Op is one of the Op constants.
              name: Op
              tag: json:"op"
              type: string
            - doc: "Name is a low-cardinality operation name: a route pattern, \"Get\"."
              name: Name
              tag: json:"name"
              type: string
            - doc: Start is when the work began.
              name: Start
              tag: json:"start"
              type: time.Time
            - doc: Ms is how long it took.
              name: Ms
              tag: json:"ms"
              type: float64
            - doc: |-
                Status is StatusError when the product failed — what kit answers with
                a 5xx — and StatusOK otherwise, a refusal the caller has to fix (not
                found, invalid, conflict, rate limited…) included.
              name: Status
              tag: json:"status"
              type: string
            - doc: |-
                Code is the error code, when the work ended in one: a failure's, or a
                refusal's ("not_found").
              name: Code
              tag: json:"code,omitempty"
              type: string
            - doc: Error is the wire-safe public message of a failure; a refusal has none.
              name: Error
              tag: json:"error,omitempty"
              type: string
            - doc: "Attrs are allow-listed attributes: \"http.status\", \"instance\"…"
              name: Attrs
              tag: json:"attrs,omitempty"
              type: map[string]string
            - doc: User is the authenticated caller's ID, when there is one.
              name: User
              tag: json:"user,omitempty"
              type: string
            - doc: Payload is what went in and out, in dev only, with secrets redacted.
              name: Payload
              tag: json:"payload,omitempty"
              type: "*Payload"
      - decl: true
        doc: |-
          Payload is the request and the response of a span, as JSON, in dev only.
          Every member whose name says it is a secret — password, token, secret,
          authorization, cookie… — or whose Go field is tagged kit:"secret" is
          replaced by "[redacted]", and each side is cut at 8 KiB.
        name: Payload
        struct:
          fields:
            - doc: Request is the decoded request, or the message delivered.
              name: Request
              tag: json:"request,omitempty"
              type: json.RawMessage
            - doc: Response is the response.
              name: Response
              tag: json:"response,omitempty"
              type: json.RawMessage
            - doc: Truncated is set when a side was cut.
              name: Truncated
              tag: json:"truncated,omitempty"
              type: bool
      - decl: true
        doc: |-
          TransitionEvent is one workflow instance moving between states.
          It names the workflow, the entity, the event and the states it went from
          and to.
        name: TransitionEvent
        struct:
          fields:
            - doc: Workflow is the workflow node ID.
              name: Workflow
              tag: json:"workflow"
              type: string
            - doc: Instance is the entity key.
              name: Instance
              tag: json:"instance"
              type: string
            - doc: Event is the transition's event name.
              name: Event
              tag: json:"event"
              type: string
            - doc: From is the state left; empty on creation.
              name: From
              tag: json:"from"
              type: string
            - doc: To is the state entered.
              name: To
              tag: json:"to"
              type: string
            - doc: Trigger is one of the Trigger constants.
              name: Trigger
              tag: json:"trigger"
              type: string
            - doc: Caller is the node that fired it, when code did.
              name: Caller
              tag: json:"caller,omitempty"
              type: string
      - decl: true
        doc: |-
          CensusMessage is a workflow's population per state.
          It counts the instances in each state when the census was taken.
        name: CensusMessage
        struct:
          fields:
            - doc: Workflow is the workflow node ID.
              name: Workflow
              tag: json:"workflow"
              type: string
            - doc: Counts maps each state to its number of instances.
              name: Counts
              tag: json:"counts"
              type: map[string]int
      - decl: true
        doc: |-
          TraceMessage is the spans sharing one trace ID, root first.
          The root span is the one with no parent in the trace; the others follow it.
        name: TraceMessage
        struct:
          fields:
            - doc: TraceID identifies the trace.
              name: TraceID
              tag: json:"traceId"
              type: string
            - doc: Root is the node of the root span.
              name: Root
              tag: json:"root"
              type: string
            - doc: Name is the root span's name.
              name: Name
              tag: json:"name"
              type: string
            - doc: Start is when the root began.
              name: Start
              tag: json:"start"
              type: time.Time
            - doc: Ms spans from the first start to the last end.
              name: Ms
              tag: json:"ms"
              type: float64
            - doc: Status is StatusError when any span failed.
              name: Status
              tag: json:"status"
              type: string
            - doc: Spans are in start order.
              name: Spans
              tag: json:"spans"
              type: "[]SpanMessage"
      - decl: true
        doc: |-
          SnippetMessage is source code served to a reader of the graph.
          Focus and FocusEnd mark the lines a reader asked for, inside the lines
          served.
        name: SnippetMessage
        struct:
          fields:
            - doc: File is relative to App.Root.
              name: File
              tag: json:"file"
              type: string
            - doc: StartLine is the 1-based line of Lines[0].
              name: StartLine
              tag: json:"startLine"
              type: int
            - doc: Focus is the first line of the range asked for.
              name: Focus
              tag: json:"focus"
              type: int
            - doc: FocusEnd is the last line of the range asked for.
              name: FocusEnd
              tag: json:"focusEnd,omitempty"
              type: int
            - doc: Lines are the file's lines around the focus, without terminators.
              name: Lines
              tag: json:"lines"
              type: "[]string"
            - doc: "Language is the highlighter language: \"go\", \"javascript\"…"
              name: Language
              tag: json:"language"
              type: string
      - decl: true
        doc: |-
          InstanceMessage is one entity's journey through a workflow.
          It carries the entity's key, its current state and the steps that brought
          it there.
        name: InstanceMessage
        struct:
          fields:
            - doc: ID is the entity key.
              name: ID
              tag: json:"id"
              type: string
            - doc: State is the current state.
              name: State
              tag: json:"state"
              type: string
            - doc: EnteredAt is when the instance entered its current state.
              name: EnteredAt
              tag: json:"enteredAt"
              type: time.Time
            - doc: History lists the transitions, oldest first, capped.
              name: History
              tag: json:"history,omitempty"
              type: "[]StepEvent"
      - decl: true
        doc: |-
          StepEvent is one transition in an instance's history.
          It carries the event, the states it went from and to, and when it fired.
        name: StepEvent
        struct:
          fields:
            - doc: Event is the transition's event name.
              name: Event
              tag: json:"event"
              type: string
            - doc: From is the state left.
              name: From
              tag: json:"from"
              type: string
            - doc: To is the state entered.
              name: To
              tag: json:"to"
              type: string
            - doc: At is when it happened.
              name: At
              tag: json:"at"
              type: time.Time
            - doc: Trigger is one of the Trigger constants.
              name: Trigger
              tag: json:"trigger"
              type: string
            - doc: Caller is the node that fired it, when code did.
              name: Caller
              tag: json:"caller,omitempty"
              type: string
      - decl: true
        doc: |-
          LogRecordMessage is one log record written by product code through kit.Log, kept
          in dev so the Studio can show a request's logs beside its spans.
        name: LogRecordMessage
        struct:
          fields:
            - doc: Seq orders records; it only increases.
              name: Seq
              tag: json:"seq"
              type: uint64
            - doc: Time is when it was written.
              name: Time
              tag: json:"time"
              type: time.Time
            - doc: Level is "debug", "info", "warn" or "error".
              name: Level
              tag: json:"level"
              type: string
            - doc: Message is the record's message.
              name: Message
              tag: json:"message"
              type: string
            - doc: Node is the node whose code wrote it.
              name: Node
              tag: json:"node,omitempty"
              type: string
            - doc: TraceID and SpanID correlate it with a span.
              name: TraceID
              tag: json:"traceId,omitempty"
              type: string
            - name: SpanID
              tag: json:"spanId,omitempty"
              type: string
            - doc: Attrs are the record's attributes, as text, secrets redacted.
              name: Attrs
              tag: json:"attrs,omitempty"
              type: map[string]string
      - decl: true
        doc: |-
          MockMessage is the replacement a test gave the app ([MockReplace]).
          It is set by a test only; the Studio shows it and never sets one (D13).
        name: MockMessage
        struct:
          fields:
            - doc: "Node is the node it applies to: a port, a command or a query."
              name: Node
              tag: json:"node"
              type: string
            - doc: Mode is [MockReplace].
              name: Mode
              tag: json:"mode"
              type: string
            - doc: Hits counts the runs it changed.
              name: Hits
              tag: json:"hits"
              type: int64
      - decl: true
        doc: |-
          MailSummaryMessage is one mail as the outbox sees it.
          It carries no body: the Studio lists summaries and reads a whole mail on
          demand.
        name: MailSummaryMessage
        struct:
          fields:
            - doc: ID identifies the mail in the outbox.
              name: ID
              tag: json:"id"
              type: string
            - doc: Mailer is the mailer node.
              name: Mailer
              tag: json:"mailer"
              type: string
            - doc: From and To are addresses, rendered.
              name: From
              tag: json:"from"
              type: string
            - name: To
              tag: json:"to"
              type: "[]string"
            - doc: Subject is the subject.
              name: Subject
              tag: json:"subject"
              type: string
            - doc: Status is one of the Mail constants.
              name: Status
              tag: json:"status"
              type: string
            - doc: Attempts counts delivery attempts.
              name: Attempts
              tag: json:"attempts"
              type: int
            - doc: Error is the public message of the last failure.
              name: Error
              tag: json:"error,omitempty"
              type: string
            - doc: QueuedAt is when it entered the outbox; SentAt when it left.
              name: QueuedAt
              tag: json:"queuedAt"
              type: time.Time
            - name: SentAt
              tag: json:"sentAt,omitempty"
              type: "*time.Time"
            - doc: TraceID is the trace that queued it.
              name: TraceID
              tag: json:"traceId,omitempty"
              type: string
            - doc: Node is the node that queued it.
              name: Node
              tag: json:"node,omitempty"
              type: string
    variables:
      - doc: |-
          IDPattern is the whole grammar as one regular expression, anchored —
          the one the design files' JSON Schema publishes for an ID. Only an
          endpoint may be named by its route.
        name: IDPattern
        type: string
