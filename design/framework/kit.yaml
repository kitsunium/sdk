apiVersion: kit.kitsunium/design/v2
domain: framework/kit
packages:
  - aliases:
      - doc: |-
          Former is one former value of a field that keeps its history: what it was,
          until when, and who replaced it.
        name: Former
        target: model.Former
      - doc: Erasure is what kit.Erase did, store by store.
        name: Erasure
        target: model.Erasure
      - doc: PersonalData is a person's data as kit.Export gives it.
        name: PersonalData
        target: model.PersonalData
      - doc: |-
          Edit is one change between two versions of a record, in RFC 6902's words:
          Op is add, remove or replace, Path the RFC 6901 JSON pointer of the member
          it changes, From the value it had and To the value it has, as JSON. A
          secret member says it changed, never what: its From and To are empty.
        name: Edit
        target: model.Edit
    codes:
      - const:
          - comment: 0.4.2.58 — another process of the app holds its singleton lock
            doc: |-
              CodeSingletonHeld reports a start refused because another process of the
              app holds its singleton lock.
            name: CodeSingletonHeld
            value: "0x00_04_02_3A"
        type: errs.Code
      - const:
          - comment: 0.4.2.59 — a CLI command exited with a non-zero status
