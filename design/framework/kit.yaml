      - blockDoc: The environments.
        doc: "EnvProduction is the default: no Studio, no source, no analysis."
        name: EnvProduction
        value: "\"production\""
      - doc: |-
          DefaultMaxBody is the largest request body an endpoint reads, unless the
          endpoint says otherwise with [MaxBody].
        name: DefaultMaxBody
