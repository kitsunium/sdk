apiVersion: kit.kitsunium/design/v2
domain: framework/selfupdate
packages:
  - codes:
      - const:
          - doc: |-
              CodeNoVendorKey identifies an install attempted by a build that carries no
              vendor key, so nothing could have authenticated the release.
            name: CodeNoVendorKey
            value: "0x00_02_22_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureMissing identifies a release whose detached signature over the
              checksum manifest could not be fetched.
            name: CodeSignatureMissing
            value: "0x00_02_22_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureInvalid identifies a checksum manifest whose signature did not
              verify against the vendor key.
            name: CodeSignatureInvalid
            value: "0x00_02_22_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeChecksumMissing identifies an archive with no entry in the authenticated
              checksum manifest.
            name: CodeChecksumMissing
            value: "0x00_02_22_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeChecksumMismatch identifies an archive whose digest did not match its
              authenticated manifest entry.
            name: CodeChecksumMismatch
            value: "0x00_02_22_05"
        type: errs.Code
      - const:
          - doc: CodeArchiveTooLarge identifies a release archive exceeding the size cap.
            name: CodeArchiveTooLarge
            value: "0x00_02_22_06"
        type: errs.Code
      - const:
          - doc: CodeAPIBodyTooLarge identifies a release-metadata response exceeding its cap.
            name: CodeAPIBodyTooLarge
            value: "0x00_02_22_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeInsecureRedirect identifies a redirect leaving HTTPS, or exceeding the
              hop bound.
            name: CodeInsecureRedirect
            value: "0x00_02_22_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnexpectedStatus identifies a release host answering with a status the
              update path does not accept.
            name: CodeUnexpectedStatus
            value: "0x00_02_22_09"
        type: errs.Code
      - const:
          - doc: CodeDownloadFailed identifies a download that did not complete.
            name: CodeDownloadFailed
            value: "0x00_02_22_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeDevBuild identifies a version check on a build with no release version to
              compare against.
            name: CodeDevBuild
            value: "0x00_02_22_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeCandidateNotFound identifies a requested release candidate that does not
              exist.
            name: CodeCandidateNotFound
            value: "0x00_02_22_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotPrerelease identifies a tag requested as a candidate that the host
              reports as a stable release.
            name: CodeNotPrerelease
            value: "0x00_02_22_0D"
        type: errs.Code
      - const:
          - doc: CodeDraftRelease identifies a draft release, which has no downloadable asset.
            name: CodeDraftRelease
            value: "0x00_02_22_0E"
        type: errs.Code
      - const:
          - doc: CodeInvalidTag identifies a tag that is not a valid semantic version.
            name: CodeInvalidTag
            value: "0x00_02_22_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeBinaryNotInArchive identifies a verified archive that does not contain the
              expected binary.
            name: CodeBinaryNotInArchive
            value: "0x00_02_22_10"
        type: errs.Code
      - const:
          - doc: CodeUnknownArchive identifies an asset whose container format is not handled.
            name: CodeUnknownArchive
            value: "0x00_02_22_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeElevationNotAuthorised identifies a replacement needing privilege the
              operator did not opt into.
            name: CodeElevationNotAuthorised
            value: "0x00_02_22_12"
        type: errs.Code
    doc: |-
      Package selfupdate — the error-code range owned by this domain (ADR 0005 §Registry).

      Package selfupdate — the sentinels every implementation of this domain returns.

      The first five are the trust chain, and their ORDER is the contract: a build
      with no vendor key cannot install at all; a manifest with no signature is not
      authenticated; a signature that does not verify ends it; only then is the
      archive's digest compared against a manifest that is now trusted. A digest
      checked against an unauthenticated manifest proves nothing, which is why
      CodeChecksumMismatch can only be reached after CodeSignatureInvalid was not.

      Package selfupdate is the contract for a binary that replaces itself: the
      ports it needs from its environment, and the values it reports.

      The domain exists because the hard part of a self-update is not the download.
      It is the ORDER in which a candidate becomes trusted — a detached signature
      over a checksum manifest, then the archive's digest against that
      now-authenticated manifest, and only then anything touching the disk — and the
      fact that a process replacing its own executable has no second chance if it
      gets it wrong.

      Three ports, and each is a seam a test drives rather than an abstraction for
      its own sake: Getter is the network, FileSystem is the disk, Copier is the
      stream between them. There is **no registry**: a registry's key would name a
      release host, and the whole trust chain is anchored to a key pinned at build
      time for exactly one host.

      Package selfupdate — the three ports a self-update needs from its
      environment: the network, the disk, and the stream between them.

      Package selfupdate — the values a self-update reports.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
    path: github.com/kitsunium/sdk/framework/internal/core/selfupdate
    sentinels:
      - var:
          - code: CodeNoVendorKey
            doc: |-
              NoVendorKey is returned when the running build carries no vendor key. It
              is a REFUSAL, not a degradation: without a key nothing could have
              authenticated the release, so there is no weaker check to fall back to.
            name: NoVendorKey
            private: "core/selfupdate: no vendor public key was linked into this build"
            public: this build cannot verify a release and will not install one
            reason: NO_VENDOR_KEY
          - code: CodeSignatureMissing
            doc: |-
              SignatureMissing is returned when the detached signature over the checksum
              manifest could not be fetched.
            name: SignatureMissing
            private: "core/selfupdate: the detached signature over the checksum manifest was absent"
            public: the release is not signed
            reason: SIGNATURE_MISSING
          - code: CodeSignatureInvalid
            doc: |-
              SignatureInvalid is returned when the checksum manifest's signature does
              not verify against the vendor key.
            name: SignatureInvalid
            private: "core/selfupdate: the manifest signature failed ed25519 verification against the vendor key"
            public: the release signature did not verify
            reason: SIGNATURE_INVALID
          - code: CodeChecksumMissing
            doc: |-
              ChecksumMissing is returned when the authenticated manifest has no entry
              for the archive being installed.
            name: ChecksumMissing
            private: "core/selfupdate: the authenticated manifest carries no entry for the requested asset"
            public: the release has no checksum for this platform
            reason: CHECKSUM_MISSING
          - code: CodeChecksumMismatch
            doc: |-
              ChecksumMismatch is returned when the archive's digest does not match its
              authenticated manifest entry.
            name: ChecksumMismatch
            private: "core/selfupdate: the archive digest differs from its authenticated manifest entry"
            public: the release archive does not match its checksum
            reason: CHECKSUM_MISMATCH
          - code: CodeArchiveTooLarge
            doc: |-
              ArchiveTooLarge is returned when a release archive exceeds the size cap.
              The cap exists because the bytes are buffered in memory before anything
              has vouched for them.
            name: ArchiveTooLarge
            private: "core/selfupdate: the archive exceeded the in-memory size cap"
            public: the release archive is larger than this build accepts
            reason: ARCHIVE_TOO_LARGE
          - code: CodeAPIBodyTooLarge
            doc: |-
              APIBodyTooLarge is returned when a release-metadata response exceeds its
              cap.
            name: APIBodyTooLarge
            private: "core/selfupdate: the release API response exceeded its read cap"
            public: the release metadata is larger than this build accepts
            reason: API_BODY_TOO_LARGE
          - code: CodeInsecureRedirect
            doc: |-
              InsecureRedirect is returned when a redirect leaves HTTPS or exceeds the
              hop bound. Following it would hand the archive fetch to a plaintext hop.
            name: InsecureRedirect
            private: "core/selfupdate: a redirect left https or exceeded the hop bound"
            public: the release host redirected somewhere this build will not follow
            reason: INSECURE_REDIRECT
          - code: CodeUnexpectedStatus
            doc: |-
              UnexpectedStatus is returned when the release host answers with a status
              the update path does not accept.
            name: UnexpectedStatus
            private: "core/selfupdate: the release host returned a status the update path does not accept"
            public: the release host answered unexpectedly
            reason: UNEXPECTED_STATUS
          - code: CodeDownloadFailed
            doc: DownloadFailed is returned when a download does not complete.
            name: DownloadFailed
            private: "core/selfupdate: the release download did not complete"
            public: the release could not be downloaded
            reason: DOWNLOAD_FAILED
          - code: CodeDevBuild
            doc: |-
              DevBuild is returned when a version check runs on a build with no release
              version to compare against.
            name: DevBuild
            private: "core/selfupdate: the running build carries no release version"
            public: this build has no version to compare against a release
            reason: DEV_BUILD
          - code: CodeCandidateNotFound
            doc: |-
              CandidateNotFound is returned when a requested release candidate does not
              exist.
            name: CandidateNotFound
            private: "core/selfupdate: the requested candidate tag was not found on the release host"
            public: no such release candidate
            reason: CANDIDATE_NOT_FOUND
          - code: CodeNotPrerelease
            doc: |-
              NotPrerelease is returned when a tag requested as a candidate is reported
              as a stable release.
            name: NotPrerelease
            private: "core/selfupdate: the requested tag is not marked prerelease"
            public: that tag is a stable release, not a candidate
            reason: NOT_PRERELEASE
          - code: CodeDraftRelease
            doc: |-
              DraftRelease is returned for a draft release, which has no downloadable
              asset.
            name: DraftRelease
            private: "core/selfupdate: the requested release is a draft and exposes no asset"
            public: that release is still a draft
            reason: DRAFT_RELEASE
          - code: CodeInvalidTag
            doc: InvalidTag is returned for a tag that is not a valid semantic version.
            name: InvalidTag
            private: "core/selfupdate: the tag is not a valid semantic version"
            public: that is not a valid version tag
            reason: INVALID_TAG
          - code: CodeBinaryNotInArchive
            doc: |-
              BinaryNotInArchive is returned when a verified archive does not contain
              the expected binary. The archive is authentic; it is simply not what was
              expected, which is a packaging fault rather than an attack.
            name: BinaryNotInArchive
            private: "core/selfupdate: the verified archive holds no entry matching the binary name"
            public: the release archive does not contain the expected binary
            reason: BINARY_NOT_IN_ARCHIVE
          - code: CodeUnknownArchive
            doc: |-
              UnknownArchive is returned for an asset whose container format is not
              handled.
            name: UnknownArchive
            private: "core/selfupdate: the asset is neither a tar.gz nor a zip"
            public: the release archive format is not supported
            reason: UNKNOWN_ARCHIVE
          - code: CodeElevationNotAuthorised
            doc: |-
              ElevationNotAuthorised is returned when replacing the binary needs
              privilege the operator did not opt into. Escalating without being asked is
              the one thing an updater must never do quietly.
            name: ElevationNotAuthorised
            private: "core/selfupdate: the replacement required elevation and the opt-in was absent"
            public: replacing this binary needs privilege that was not authorised
            reason: ELEVATION_NOT_AUTHORISED
    types:
      - decl: true
        doc: |-
          Getter performs the HTTP GETs a self-update needs: the release metadata, the
          archive, the checksum manifest and its signature.

          It is one method because that is all the domain needs, and a caller supplying
          a policy-carrying client (timeouts, redirect rules, proxies) is supplying it
          once for all four.
        interface:
          methods:
            - doc: Get performs an HTTP GET request.
              in:
                - name: url
                  type: string
              name: Get
              out:
                - name: resp
                  type: "*http.Response"
                - name: err
                  type: error
        name: Getter
      - decl: true
        doc: |-
          FileSystem is the disk half of replacing a running binary.

          EvalSymlinks is not optional decoration: an executable reached through a
          symlink must be replaced at its REAL path, or the update writes over the link
          and the next run still executes the old binary.
        interface:
          methods:
            - doc: Executable returns the path of the current executable.
              name: Executable
              out:
                - name: path
                  type: string
                - name: err
                  type: error
            - doc: EvalSymlinks resolves symlinks in the given path.
              in:
                - name: path
                  type: string
              name: EvalSymlinks
              out:
                - name: resolved
                  type: string
                - name: err
                  type: error
            - doc: CreateTemp creates a temporary file.
              in:
                - name: dir
                - name: pattern
                  type: string
              name: CreateTemp
              out:
                - name: file
                  type: "*os.File"
                - name: err
                  type: error
            - doc: Chmod changes file permissions.
              in:
                - name: name
                  type: string
                - name: mode
                  type: os.FileMode
              name: Chmod
              out:
                - type: error
            - doc: |-
                Rename renames a file. It is the atomic half of the replacement and must
                happen on the same filesystem as the target.
              in:
                - name: oldpath
                - name: newpath
                  type: string
              name: Rename
              out:
                - type: error
            - doc: Remove removes a file.
              in:
                - name: name
                  type: string
              name: Remove
              out:
                - type: error
        name: FileSystem
      - decl: true
        doc: |-
          Copier streams the verified archive to its temporary destination. It is a port
          so a test can fail the copy midway — the case where a partially written binary
          must never be renamed into place.
        interface:
          methods:
            - doc: Copy copies from src to dst, returning the number of bytes written.
              in:
                - name: dst
                  type: io.Writer
                - name: src
                  type: io.Reader
              name: Copy
              out:
                - name: written
                  type: int64
                - name: err
                  type: error
        name: Copier
      - decl: true
        doc: |-
          UpdateValue is the outcome of a version check or an install: whether a newer
          release exists, and the two versions that were compared.

          Available is reported separately from a version comparison the caller could
          redo, because the comparison is semver-aware and a string compare of the two
          fields would disagree with it on a prerelease.
        name: UpdateValue
        struct:
          fields:
            - doc: CurrentVersion is the version of the running binary.
              name: CurrentVersion
              type: string
            - doc: |-
                LatestVersion is the version that was found, or the empty string when
                none was.
              name: LatestVersion
              type: string
            - doc: Available reports whether LatestVersion is newer than CurrentVersion.
              name: Available
              type: bool
      - decl: true
        doc: |-
          CandidateValue is one release candidate: a developer channel entry that is
          never what a stable check returns.

          All three fields are carried VERBATIM as the release host reported them. They
          are displayed to an operator choosing a candidate, never parsed and never
          compared — the ordering decision is made on Tag by semver, elsewhere.
        name: CandidateValue
        struct:
          fields:
            - doc: Tag is the release tag, e.g. "v1.9.0-rc.3".
              name: Tag
              type: string
            - doc: Name is the release's human title, which a host may leave empty.
              name: Name
              type: string
            - doc: CreatedAt is the RFC 3339 publication timestamp, as text.
              name: CreatedAt
              type: string
  - aliases:
      - doc: |-
          CandidateValue is one release candidate. It ALIASES the core value rather
          than redeclaring it, for the same reason UpdateValue does.
        name: CandidateValue
        target: coreupd.CandidateValue
      - doc: Getter performs the HTTP GETs a self-update needs. It aliases the core port.
        name: Getter
        target: coreupd.Getter
      - doc: |-
          FileSystem is the disk half of replacing a running binary. It aliases the
          core port.
        name: FileSystem
        target: coreupd.FileSystem
      - doc: |-
          Copier streams the verified archive to its destination. It aliases the core
          port.
        name: Copier
        target: coreupd.Copier
      - doc: |-
          UpdateValue is the outcome of a version check or an install. It ALIASES the
          core value rather than redeclaring it: a service-local copy of a value core
          owns compiles fine and drifts silently.
        name: UpdateValue
        target: coreupd.UpdateValue
    codes:
      - const:
          - doc: |-
              CodeCandidateTagRequired identifies a candidate install asked for without
              naming which candidate.
            name: CodeCandidateTagRequired
            note: "range: 0.3.66.0 - 0.3.66.255"
            value: "0x00_03_42_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeReleaseMetadataUnreadable identifies a release-API answer that arrived
              whole and did not decode as release metadata.
            name: CodeReleaseMetadataUnreadable
            value: "0x00_03_42_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeArchiveUnreadable identifies a release archive that could not be
              buffered or unpacked.

              It is deliberately NOT the domain's ChecksumMismatch: by the time anything
              here runs the archive has already been authenticated and its digest matched,
              so a container that will not open is a packaging or transfer fault and never
              a supply-chain signal. Reporting it as one would tell an operator not to
              install a release that is provably the vendor's.
            name: CodeArchiveUnreadable
            value: "0x00_03_42_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeExecutablePathUnresolved identifies an update that cannot name the file
              it would replace.
            name: CodeExecutablePathUnresolved
            value: "0x00_03_42_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeStagingFailed identifies a replacement that failed BEFORE the rename, so
              the running binary was never touched.

              The boundary between this and [CodeReplacementFailed] is the only thing an
              operator needs from these two, and it is the rename: everything under this
              code leaves the installed binary byte-for-byte as it was.
            name: CodeStagingFailed
            value: "0x00_03_42_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeReplacementFailed identifies a rename over the running executable that
              did not land.
            name: CodeReplacementFailed
            value: "0x00_03_42_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeElevationFailed identifies an escalation the operator DID authorise and
              that the system refused anyway.

              It is not the domain's ElevationNotAuthorised, and the difference is the
              whole remedy: that one is fixed by setting one environment variable, this one
              is not fixed by setting anything.
            name: CodeElevationFailed
            value: "0x00_03_42_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeProbeFailed identifies a replacement whose new binary did not answer the
              probe the product declared (ADR 0150). The fields say whether the previous
              binary, kept as <binary>.prev, was put back.
            name: CodeProbeFailed
            value: "0x00_03_42_08"
        type: errs.Code
    constants:
      - blockDoc: Service constants for GitHub API, versioning, and file operations.
        doc: CandidateListSentinel is the sentinel value for --candidate without a tag.
        name: CandidateListSentinel
        type: string
        value: "\"__list__\""
    doc: |-
      Package selfupdate replaces the running binary with a newer signed release.

      Package selfupdate replaces the running binary with a newer signed release.
      This file implements SHA-256 integrity verification of downloaded release
      archives against the checksums.txt manifest published by the release
      workflow (CWE-494 mitigation: download of code without integrity check).

      INTEGRITY ONLY. Nothing here establishes who published the manifest; that
      is signature.go's job, and matchArchiveDigest must never be reached with a
      manifest verifyArchive has not authenticated first.

      Package selfupdate — range 0.3.66.* (ADR 0005 §Registry, allocated in
      codeRangeOwners per ADR 0035).

      The domain's own range is 0.2.34.* and it holds every refusal the CONTRACT
      names: an unsigned release, a digest that does not match, a redirect this
      build will not follow. Those are the outcomes a caller of framework/selfupdate
      branches on, and none of them is redeclared here.

      What lives in this range is the other half — the failures an IMPLEMENTATION
      has and a contract does not: a JSON body that will not decode, a tar that
      will not open, a temp file that cannot be created next to the running
      binary. The core has no vocabulary for them because a different
      implementation of the same port would fail in different places.

      Package selfupdate — consent: whether a caller that did not ask to upgrade
      may nonetheless replace this binary, and the advice printed when it may not.
      Package updater — CONSENT for an upgrade nobody typed.

      An explicit `upgrade` command is a deliberate act and needs no permission: a
      it IS the permission. The licence gate is the opposite case. It fires from
      the root command's PersistentPreRun on every invocation, so a plain
      routine command that could reach a code path downloading an archive,
      chmods it 0755, moves it over the running executable and, where sudoers
      allows it, does that last step as root — none of which the person who
      typed `run` asked for. The gate's own comment already conceded the point:
      "this is the one moment a user is staring at a pause they did not ask for".

      A mandatory update that simply refuses is useless, so refusing is not what
      this does. It asks when someone is there to answer, takes an explicit
      out-of-band authorisation when nobody is (CI, devcontainers, hooks), and
      when it does decline it prints every way forward rather than leaving a
      dead end.

      Package selfupdate — The consent a product declares, and the escalation it forbids (ADR 0150).
      Both are properties of the Service a product builds rather than fields of
      SourceValue: a source says where releases come from, a Service how this
      binary treats them.

      Package selfupdate — the half of an error that never goes on a wire, made
      available to the one reader who is entitled to all of it.

      errs.Error.Error() renders "[<code> <REASON>] <public>" and deliberately
      nothing else: no private detail, no fields, and not one word from the cause.
      That is right for anything crossing a boundary, and it is exactly wrong for
      the person who just typed `upgrade` and is owed "no space left on device".

      So the split is not "throw the detail away", it is "send it somewhere else".
      This file is that somewhere else.

      Package selfupdate — privilege escalation: the second, separate opt-in that a
      replacement into a directory this user cannot write requires.
      Package updater — privilege escalation, and the explicit consent it now
      requires.

      finalizeReplacement falls back to `sudo -n mv` when the plain rename over
      the running executable is refused for permissions. That fallback used to
      fire unconditionally, which meant an ordinary gated command — a
      command nobody asked to install anything — could end up executing a
      privileged move of a file it had just downloaded. Where sudoers grants
      NOPASSWD (devcontainers, CI images, plenty of laptops) that completes
      silently and writes an attacker-chosen file into a root-owned directory.

      Escalation is now opt-in. Not asking is the default, and the refusal names
      the two ways forward so it is never a dead end.

      Package selfupdate — the sentinels this IMPLEMENTATION emits, as opposed to
      the ones the domain contract names.

      Each var's name equals its errs.Define Reason in SCREAMING_SNAKE form.

      Every Public here is wire-safe, so none of them names a path, a URL, a host,
      a tag or an asset. That is not squeamishness: the public half is the one
      documented safe to put in a response body, and this package's inputs are a
      release host and a filesystem — every particular it could name came from one
      of the two. What it says instead is the one thing an operator has to take
      away, which is whether the binary they are running was replaced.

      Where it happened and what the filesystem said live in Private and Fields.
      They are not lost to the operator: diagnose renders them and
      ExplainUpgradeFailure prints them under the sentence, because a terminal the
      operator owns is not a wire.

      Package selfupdate — the ports, aliased from core.

      They are ALIASES rather than a second declaration: a service-local copy of a
      contract the core layer owns compiles fine and drifts silently, and a caller
      holding one of each would find them interchangeable right up until a method
      is added to one of them.

      Package selfupdate — the vendor key list and the signature domain of ADR
      0150: several keys any of which verifies, and a manifest that names its tag
      and its expiry.

      Package selfupdate replaces the running binary with a newer signed release.

      Package selfupdate — the compile-time proof that osFileSystem still satisfies
      the core FileSystem port.
      Package updater — compile-time assertion for osFileSystem.

      Hoisted from osfilesystem.go per KTN-IFACE-ASSERT-PLACEMENT so the
      production source carries no purely verificational declarations.

      Package selfupdate — the probe of ADR 0150: the previous binary kept as
      <binary>.prev, the new one asked to answer, and put back when it does not.

      Package selfupdate replaces the running binary with a newer signed release.

      Package selfupdate — the one platform the replacement step refuses, and why
      the refusal comes before anything is downloaded.

      Package selfupdate — authenticity: the detached ed25519 signature over the
      checksum manifest, and the vendor key it is verified against.
      Package updater — release AUTHENTICITY, which is a different property from
      the integrity checksum.go already proves.

      checksums.txt establishes that the archive arrived intact. It cannot
      establish who published it: the manifest is fetched from the SAME release,
      on the SAME origin, with the same write credentials as the archive beside
      it (see fetchChecksums — it reuses `downloadURL` verbatim). Stable releases
      are additionally served from a public MIRROR repository, a second
      publishing origin entirely. Anyone able to write assets to that release
      replaces the archive and regenerates the manifest in the same breath, and
      every SHA-256 still matches. The digest defends against a corrupted
      download, never against a hostile publisher.

      This file supplies the missing half: a DETACHED ed25519 signature over
      checksums.txt, verified against the vendor public key linked into the
      binary at build time. It is deliberately the same primitive, the same
      algorithm and the same key that pkg/license already uses to authenticate
      the roster (pkg/license/bundle.go ParseBundle, anchored on
      linked in at build time by the consuming binary) — a second scheme would be a second thing
      to get wrong. Once the manifest is authenticated the origin stops
      mattering: a substituted mirror can serve any bytes it likes and cannot
      produce a signature over them.

      ABSENT SIGNATURE: FAIL CLOSED, NO TRANSITION WINDOW.

      A client that installs an unsigned release when the .sig asset is missing
      has no authenticity check at all — an attacker who can publish assets can
      also decline to publish one, so "accept it when it is absent" is exactly
      equivalent to "never require it". There is no grandfathering window and no
      environment variable that reopens one. The cost is bounded and known: an
      upgrade always moves FORWARD to a release published by the workflow that
      ships with this code, so the only refusals are `upgrade --candidate <tag>`
      against a pre-signing release candidate, which is a developer channel with
      a source checkout one command away.

      Package selfupdate — the release source: which project's releases this binary
      updates itself from, and what its artefacts are called.

      Package selfupdate replaces the running binary with a newer signed release.

      Package selfupdate — the compile-time proof that stdIOCopier still satisfies
      the core Copier port.
      Package updater — compile-time assertion for stdIOCopier.

      Hoisted from stdiocopier.go per KTN-IFACE-ASSERT-PLACEMENT so the
      production source carries no purely verificational declarations.

      Package selfupdate — the HTTP policy every real Service uses: bounded,
      https-only redirects and a cap on how much of a response is read.
      Package updater — the transport the release endpoints are reached over,
      and the bound on what they are allowed to make this process do.

      Everything here treats the GitHub API and the release CDN as untrusted
      input, because they are: stable releases resolve through a PUBLIC mirror
      repository (see repoForTag), which is a second publishing origin, and a
      redirect chain or a response body is chosen entirely by whatever answers.

      Package selfupdate replaces the running binary with a newer signed release.

      Package selfupdate replaces the running binary with a newer signed release.
      It checks GitHub releases for newer versions and downloads/replaces the binary.

      Package selfupdate — the two shapes every error in this package is built
      with, so the choice at a call site is which sentinel rather than which
      spelling.

      The split between them is whether this package DECIDED the failure or was
      TOLD about one. A decision has no cause to carry — nothing failed, a rule
      was applied — and the sentinel itself is the whole of it. A report from
      outside has a cause that must survive, because `errors.Is(err, os.ErrPermission)`
      and the text the operating system wrote are the two things a wrapper most
      often destroys.
    functions:
      - doc: |-
          StdinIsTerminal reports whether a human could answer a prompt on this
          process's standard input.

          Callers pass the result to AuthoriseUnattendedUpgrade rather than letting it
          detect its own terminal, so the decision stays testable without a pty.

          # What this can and cannot tell apart

          A pipe, a regular file and a closed descriptor are excluded by the mode: none
          is a character device. The null device IS one, and is excluded by identity —
          os.SameFile against /dev/null, which is stdlib and portable, rather than a
          path comparison a redirect would defeat.

          What remains indistinguishable, without a cgo or x/sys ioctl this module
          cannot take (x/sys is banned SDK-wide), is one character device from another:
          stdin redirected from /dev/zero or /dev/random reads as a terminal here. Both
          answer a prompt with bytes nobody typed, so a caller in that position should
          set the unattended opt-in rather than rely on detection. Said out loud because
          the alternative is a comment claiming a precision this does not have.
        name: StdinIsTerminal
        out:
          - type: bool
      - doc: |-
          NewService creates a new updater instance.

          The returned Service carries NO vendor key and therefore installs nothing:
          callers chain `.WithVendorKey(...)` with the build's linked-in anchor. That
          is deliberate — see WithVendorKey in signature.go.
        in:
          - name: version
            type: string
          - name: src
            type: SourceValue
        name: NewService
        out:
          - type: "*Service"
      - doc: |-
          NewUpdaterWithDeps creates an updater with custom dependencies for testing.

          A nil fs or copier is LEGAL and several callers rely on it: a test that only
          exercises the network path has nothing to inject for the filesystem, and the
          Service never reaches those fields on that path.

          This used to call validateDeps and discard its result — a validation whose
          answer nobody read, which is worse than none because the call site reads as a
          guarantee. The function is deleted rather than promoted to a panic or an
          error return: the nil callers are correct, so there is nothing to reject.
        in:
          - name: version
            type: string
          - name: src
            type: SourceValue
          - name: client
            type: Getter
          - name: fs
            type: FileSystem
          - name: copier
            type: Copier
        name: NewUpdaterWithDeps
        out:
          - type: "*Service"
    imports:
      clock: github.com/kitsunium/sdk/pkg/v1/clock
      coreupd: github.com/kitsunium/sdk/framework/internal/core/selfupdate
      ed25519: crypto/ed25519
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/framework/internal/service/selfupdate
    sentinels:
      - var:
          - code: CodeCandidateTagRequired
            doc: |-
              CandidateTagRequired is returned by DownloadCandidate for an empty tag.

              There is deliberately no "latest candidate" to fall back to. A
              prerelease channel has no ordering an updater may assume — rc.2 can be
              published after rc.3 is withdrawn — so resolving the empty tag would
              mean this package choosing which unreleased build to install over the
              running binary.
            name: CandidateTagRequired
            options:
              - errs.WithExitCode(exitUsage)
            private: "service/selfupdate: DownloadCandidate received an empty tag; errors.ErrUnsupported is kept as the cause, so anything that matched it before this sentinel existed still matches"
            public: a release candidate is installed by naming its tag, and no tag was named
            reason: CANDIDATE_TAG_REQUIRED
          - code: CodeReleaseMetadataUnreadable
            doc: |-
              ReleaseMetadataUnreadable is returned when the release API answers
              within its size cap and the body does not decode as release metadata.

              It is separate from the download sentinels on purpose: the bytes
              arrived, so no retry policy keyed on a transport failure applies, and
              the thing to look at is what the host actually sent.
            name: ReleaseMetadataUnreadable
            private: "service/selfupdate: a release API response decoded neither as a release nor as a list of them; the fields name the query and, where the query had one, the tag"
            public: the release host's answer could not be read as release metadata
            reason: RELEASE_METADATA_UNREADABLE
          - code: CodeArchiveUnreadable
            doc: |-
              ArchiveUnreadable is returned when the release archive cannot be
              buffered or unpacked.

              Everything under this sentinel happens AFTER the archive's signature
              and digest have both been verified, which is what makes it a packaging
              or transfer fault rather than a supply-chain one. Saying so matters:
              the documented response to an authenticity refusal is "do not install
              this by any means", and that is the wrong advice for a gzip stream that
              was truncated on the way in.
            name: ArchiveUnreadable
            private: "service/selfupdate: buffering or unpacking the verified archive failed; the fields name the stage and, for a zip entry, which entry"
            public: the release archive could not be read
            reason: ARCHIVE_UNREADABLE
          - code: CodeExecutablePathUnresolved
            doc: |-
              ExecutablePathUnresolved is returned when the process cannot work out
              which file on disk it is running from.

              Nothing is attempted after it. An updater that guesses its own path
              writes a downloaded binary somewhere nobody asked for.
            name: ExecutablePathUnresolved
            private: "service/selfupdate: os.Executable or the symlink resolution behind it failed; the fields name which of the two"
            public: the path of the running binary could not be resolved, so nothing was replaced
            reason: EXECUTABLE_PATH_UNRESOLVED
          - code: CodeStagingFailed
            doc: |-
              StagingFailed is returned when the replacement fails BEFORE the rename.

              The installed binary is byte-for-byte as it was, and the partial
              staging file has been removed. That is the whole content of this
              sentinel, and it is why it is not merged with ReplacementFailed: the
              two differ in exactly the fact an operator needs, which is whether the
              binary they are about to run is the old one or something in between.
            name: StagingFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: creating, writing, closing or chmod-ing the staging file failed; the fields name the step"
            public: the update could not be staged, and the running binary was left untouched
            reason: STAGING_FAILED
          - code: CodeReplacementFailed
            doc: |-
              ReplacementFailed is returned when the rename of the staged file over
              the running executable does not land.

              The rename is atomic, so this means the old binary is still in place —
              but unlike StagingFailed it is the step that would have changed it, and
              the remedy is about the install directory rather than about disk space.
            name: ReplacementFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: the rename of the staged file over the running executable failed; the fields name the step"
            public: the running binary could not be replaced
            reason: REPLACEMENT_FAILED
          - code: CodeElevationFailed
            doc: |-
              ElevationFailed is returned when an escalation the operator DID
              authorise is refused by the system.

              It is deliberately not ElevationNotAuthorised, and the gap between them
              is the remedy: that one is repaired by exporting one variable, and this
              one is not repaired by exporting anything. Merging them would send
              somebody who already set the variable to set it again.
            name: ElevationFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: `sudo -n mv` exited non-zero; the fields carry sudo's own output, which names the real blocker far better than the exec error does"
            public: the elevated replacement was authorised and the system refused it
            reason: ELEVATION_FAILED
          - code: CodeProbeFailed
            doc: |-
              ProbeFailed is returned when the replacement landed and the new binary
              did not answer the product's probe in time. The previous binary is put
              back from <binary>.prev when it was kept; rolled_back says whether it
              was.
            name: ProbeFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: the probe of the replaced binary failed or timed out; rolled_back says whether <binary>.prev was put back"
            public: the new binary did not answer its probe and was not kept
            reason: PROBE_FAILED
    types:
      - decl: true
        doc: |-
          SourceValue says where releases come from and what they are called.

          It is the whole of what the source implementation hard-coded. Every field is a
          property of one product's distribution, not of the update mechanism, so
          keeping them as constants is what made that implementation un-reusable.

          StableRepo and DevRepo can differ, and the reason is worth stating: a project
          whose source repository goes private still has to serve already-installed
          binaries their update path, which means a public mirror for stable releases
          while candidates stay in the source repository behind credentials the public
          binary does not carry. When DevRepo is empty, StableRepo serves both.
        methods:
          - doc: |-
              AuthoriseUnattendedUpgrade reports whether a caller that did not ask to
              upgrade may nonetheless replace this binary.

              out receives the prompt; in supplies the answer; interactive says whether
              there is a human on the other end (the caller decides — see
              StdinIsTerminal — so a test does not need a pty). The environment is read
              here rather than passed so every call site honours the same variable.

              The order is: an explicit authorisation decides, in EITHER direction;
              otherwise a human is asked; otherwise the answer is no.
            in:
              - name: out
                type: io.Writer
              - name: in
                type: io.Reader
              - name: interactive
                type: bool
            name: AuthoriseUnattendedUpgrade
            out:
              - type: bool
            recv: value
          - doc: |-
              ExplainUpgradeRefusal prints every way to get the required update
              installed after consent was declined or could not be obtained.

              It is deliberately exhaustive, including the sudo opt-in: the two
              authorisations are separate on purpose (one permits replacing the binary,
              the other permits doing it as root) and discovering the second one only
              after acting on the first is a bad afternoon.
            in:
              - name: out
                type: io.Writer
            name: ExplainUpgradeRefusal
            recv: value
          - doc: |-
              ExplainUpgradeFailure prints what a refused upgrade means and what, if
              anything, resolves it. `action` names the operation that failed, so the
              same advice serves the gate ("cannot apply the required update") and the
              deliberate command ("upgrade failed").

              It exists because exit.Code's message parameter only reaches the structured
              --debug log (pkg/exit's logEvent is a no-op unless --debug is set): without
              this, an upgrade against a forged or unsigned release printed
              "Checking for updates..." and then nothing, exiting non-zero with no reason
              given. For a network blip that is merely poor; for an authenticity refusal
              it hides the one signal that must not be missed, and invites the user to
              go and install the bad release by hand.

              It prints THREE things, in descending order of how far they may travel: the
              error's public sentence, which is wire-safe and says what happened; its
              diagnostic half — fields and the cause's own words — which says where and
              why and is for this terminal and the log, never for a response body; and the
              advice, which is what to do about it.
            in:
              - name: out
                type: io.Writer
              - name: action
                type: string
              - name: err
                type: error
            name: ExplainUpgradeFailure
            recv: value
          - doc: |-
              AutoUpgradeEnv is the variable authorising an upgrade the user did not ask
              for, e.g. MY_TOOL_AUTO_UPGRADE.
            name: AutoUpgradeEnv
            out:
              - type: string
            recv: value
          - doc: |-
              SudoOptInEnv is the variable authorising privilege escalation when the install
              directory is not writable, e.g. MY_TOOL_ALLOW_SUDO.
            name: SudoOptInEnv
            out:
              - type: string
            recv: value
        name: SourceValue
        struct:
          fields:
            - doc: Owner is the release host account, e.g. "kodflow".
              name: Owner
              type: string
            - doc: StableRepo is the repository serving stable releases.
              name: StableRepo
              type: string
            - doc: |-
                DevRepo is the repository serving release candidates. Empty means
                candidates come from StableRepo too.
              name: DevRepo
              type: string
            - doc: |-
                Product is the binary's name. It is both the archive-asset stem
                ("<product>_<goos>_<goarch>.tar.gz") and, uppercased, the environment
                variable prefix for the two opt-ins.
              name: Product
              type: string
      - decl: true
        doc: |-
          Service replaces the running binary with a newer signed release of the
          product its SourceValue names.
          It manages version checking via GitHub API and binary replacement.
          goos/goarch are captured at construction time so the per-platform asset
          resolution (`getBinaryName`, `getArchiveSuffix`, `innerBinaryName`) is
          stable per-instance — tests can construct a literal with explicit values
          instead of mutating package-level `runtimeGOOS`/`runtimeGOARCH` (which
          would race under t.Parallel).
        methods:
          - doc: ListCandidates returns all available release candidates.
            name: ListCandidates
            out:
              - name: candidates
                type: "[]CandidateValue"
              - name: listErr
                type: error
            recv: pointer
          - doc: DownloadCandidate downloads and installs a specific release candidate.
            in:
              - name: tag
                type: string
            name: DownloadCandidate
            out:
              - name: info
                type: UpdateValue
              - name: downloadErr
                type: error
            recv: pointer
          - doc: |-
              WithAutomaticConsent declares that the PRODUCT consents to unrequested
              upgrades — a status line that updates itself silently, its decision D11 —,
              so no environment variable has to grant it. An operator still refuses with
              <PREFIX>_AUTO_UPGRADE=0: an explicit answer always wins. It grants nothing
              else: escalation keeps its own, separate opt-in.
            name: WithAutomaticConsent
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithoutElevation forbids the privileged replacement outright, whatever
              <PREFIX>_ALLOW_SUDO says: a binary installed where its user cannot write is
              reported (ElevationNotAuthorised), never replaced through sudo.
            name: WithoutElevation
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              AuthoriseUnattendedUpgrade decides whether an upgrade nobody asked for may
              proceed for this Service: an explicit environment answer first, then the
              product's own consent (WithAutomaticConsent), then the source's prompt rule.
            in:
              - name: out
                type: io.Writer
              - name: in
                type: io.Reader
              - name: interactive
                type: bool
            name: AuthoriseUnattendedUpgrade
            out:
              - type: bool
            recv: pointer
          - doc: |-
              WithVendorKey pins the ed25519 public half every release must be signed
              with, and returns the Service so construction reads as one expression —
              the same chaining shape license.NewService(...).WithVersion(...) uses.

              A Service built WITHOUT this call authenticates nothing and therefore
              installs nothing: verifyArchive refuses with coreupd.NoVendorKey before a single
              byte is fetched. That default is deliberate. The alternative — treat an
              absent key as "verification not required" — would mean any construction
              site that forgot the call silently reverted to the unauthenticated
              behaviour this file exists to end, and nothing would ever fail to point it
              out.
            impl: withVendorKey
            in:
              - name: key
                type: "[]byte"
            name: WithVendorKey
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithVendorKeys links the keys a release may be signed with, in order: a
              release verifies when ANY of them verifies its manifest (ADR 0150). A key
              rotation publishes under the new key while builds carrying both accept it
              and builds carrying only the old one keep reading the old — neither side has
              to be updated first. Several keys are still ONE signer: no quorum is taken.
              A key of the wrong length is kept as it is and refused at verification,
              naming its length, exactly as a single wrong key always was.
            in:
              - name: keys
                type: "[]byte"
            name: WithVendorKeys
            out:
              - type: "*Service"
            recv: pointer
            variadic: true
          - doc: |-
              WithSignatureDomain makes every signature cover domain, a NUL byte and the
              manifest — never the manifest alone — so a key the vendor also signs other
              documents with (a roster, another product's releases) cannot have one of
              those signatures read as a release of this product. It also requires the
              manifest to say which release it is and until when it may be installed, in
              two header lines the signature therefore covers:

              	# tag v1.4.0
              	# expires 2026-12-31T00:00:00Z

              A manifest naming another tag is refused — the replay of an older, signed
              release under a newer name —, and so is one past its expiry — the freeze an
              attacker who can only replay can otherwise hold an installation in. Without
              a domain the historical form is verified unchanged.
            in:
              - name: domain
                type: string
            name: WithSignatureDomain
            out:
              - type: "*Service"
            recv: pointer
          - doc: |-
              WithProbe makes a replacement stand only once the NEW binary, run with args,
              exits 0 within timeout (zero: five seconds). Before the rename the previous
              binary is kept as <binary>.prev — a hard link, so the binary's own name is
              never absent —, and a probe that fails puts it back and reports ProbeFailed.
              A daemon that updates itself declares the argument its binary answers
              cheaply ("version", "--probe").
            in:
              - name: args
                type: "[]string"
              - name: timeout
                type: time.Duration
            name: WithProbe
            out:
              - type: "*Service"
            recv: pointer
          - doc: CheckForUpdate checks if an update is available.
            name: CheckForUpdate
            out:
              - name: info
                type: UpdateValue
              - name: checkErr
                type: error
            recv: pointer
          - doc: Upgrade downloads and applies the latest version.
            name: Upgrade
            out:
              - name: info
                type: UpdateValue
              - name: upgradeErr
                type: error
            recv: pointer
        name: Service
        struct:
          fields:
            - name: version
              type: string
            - name: goos
              type: string
            - name: goarch
              type: string
            - name: client
              type: Getter
            - name: fs
              type: FileSystem
            - name: copier
              type: Copier
            - doc: |-
                elevate replaces execPath with tmpPath when the plain rename in
                finalizeReplacement fails with a permission error — the same
                non-interactive sudo escalation the devcontainer installer scripts
                use for a root-owned install directory. Swappable so tests can
                exercise both outcomes without shelling out to a real sudo.

                The default is guardedSudoMove, NOT sudoMove: escalation requires an
                explicit opt-in (see elevation.go).
              name: elevate
              type: func(tmpPath, execPath string) error
            - doc: |-
                src says which project's releases this binary updates itself from. It
                carries what the source implementation kept as package constants, which
                is precisely what made that implementation serve exactly one product.
              name: src
              type: SourceValue
            - doc: |-
                vendorKey is the ed25519 public half every release must be signed
                with, set via WithVendorKey. Empty by default, and an empty key
                refuses every install rather than skipping verification — see
                signature.go for why that direction is the only safe one.
              name: vendorKey
              type: ed25519.PublicKey
            - doc: |-
                vendorKeys are the keys a release may be signed with, in order, the
                first of them vendorKey (keys.go, ADR 0150); domain is the signature
                domain; clock is what the signed expiry is read against — pkg/v1/clock's
                system clock when nil, a manual one in a suite (ADR 0158 §2).
              name: vendorKeys
              type: "[]ed25519.PublicKey"
            - name: domain
              type: string
            - name: clock
              type: clock.Clock
            - doc: probe is what a replacement must answer before it stands (probe.go).
              name: probe
              type: probeSpec
            - doc: automatic is WithAutomaticConsent's (consent_product.go).
              name: automatic
              type: bool
  - aliases:
      - doc: Getter performs the HTTP GETs a self-update needs. It aliases the core port.
        name: Getter
        target: coreupd.Getter
      - doc: |-
          FileSystem is the disk half of replacing a running binary. It aliases the core
          port.
        name: FileSystem
        target: coreupd.FileSystem
      - doc: |-
          Copier streams the verified archive to its destination. It aliases the core
          port.
        name: Copier
        target: coreupd.Copier
      - doc: |-
          Update is the outcome of a version check or an install. It aliases the core
          value type.
        name: Update
        target: svcupd.UpdateValue
      - doc: Candidate is one release candidate. It aliases the core value type.
        name: Candidate
        target: svcupd.CandidateValue
      - doc: |-
          Source says where releases come from and what they are called. It aliases the
          service type: these are one engine's construction parameters, which ADR 0074
          places with the engine rather than in the contract layer.
        name: Source
        target: svcupd.SourceValue
      - doc: |-
          Service replaces the running binary with a newer signed release. It aliases
          the service type — the engine handle, per ADR 0074.
        name: Service
        target: svcupd.Service
    constants:
      - doc: |-
          CodeNoVendorKey identifies an install attempted by a build carrying no vendor
          key. Match it with errs.HasCode: it is the one refusal a retry never fixes.
        name: CodeNoVendorKey
        type: errs.Code
        value: "0x00_02_22_01"
      - doc: CodeSignatureMissing identifies a release whose manifest signature was absent.
        name: CodeSignatureMissing
        type: errs.Code
        value: "0x00_02_22_02"
      - doc: |-
          CodeSignatureInvalid identifies a manifest signature that did not verify. With
          CodeSignatureMissing it is the supply-chain pair: no retry helps, and no manual
          install is safe.
        name: CodeSignatureInvalid
        type: errs.Code
        value: "0x00_02_22_03"
      - doc: |-
          CodeChecksumMissing identifies an archive with no entry in the authenticated
          manifest.
        name: CodeChecksumMissing
        type: errs.Code
        value: "0x00_02_22_04"
      - doc: |-
          CodeChecksumMismatch identifies an archive whose digest did not match its
          authenticated manifest entry.
        name: CodeChecksumMismatch
        type: errs.Code
        value: "0x00_02_22_05"
      - doc: CodeArchiveTooLarge identifies a release archive over the in-memory cap.
        name: CodeArchiveTooLarge
        type: errs.Code
        value: "0x00_02_22_06"
      - doc: CodeAPIBodyTooLarge identifies release metadata over its read cap.
        name: CodeAPIBodyTooLarge
        type: errs.Code
        value: "0x00_02_22_07"
      - doc: CodeInsecureRedirect identifies a redirect leaving HTTPS or over the hop bound.
        name: CodeInsecureRedirect
        type: errs.Code
        value: "0x00_02_22_08"
      - doc: CodeUnexpectedStatus identifies an unusable status from the release host.
        name: CodeUnexpectedStatus
        type: errs.Code
        value: "0x00_02_22_09"
      - doc: |-
          CodeDownloadFailed identifies a download that did not complete. It is the
          transient one: a retry is reasonable.
        name: CodeDownloadFailed
        type: errs.Code
        value: "0x00_02_22_0A"
      - doc: CodeDevBuild identifies a check on a build with no release version.
        name: CodeDevBuild
        type: errs.Code
        value: "0x00_02_22_0B"
      - doc: CodeCandidateNotFound identifies a requested candidate that does not exist.
        name: CodeCandidateNotFound
        type: errs.Code
        value: "0x00_02_22_0C"
      - doc: CodeNotPrerelease identifies a tag requested as a candidate that is stable.
        name: CodeNotPrerelease
        type: errs.Code
        value: "0x00_02_22_0D"
      - doc: CodeDraftRelease identifies a draft release, which exposes no asset.
        name: CodeDraftRelease
        type: errs.Code
        value: "0x00_02_22_0E"
      - doc: CodeInvalidTag identifies a tag that is not a valid semantic version.
        name: CodeInvalidTag
        type: errs.Code
        value: "0x00_02_22_0F"
      - doc: CodeBinaryNotInArchive identifies a verified archive missing the binary.
        name: CodeBinaryNotInArchive
        type: errs.Code
        value: "0x00_02_22_10"
      - doc: CodeUnknownArchive identifies an asset in an unhandled container format.
        name: CodeUnknownArchive
        type: errs.Code
        value: "0x00_02_22_11"
      - doc: |-
          CodeElevationNotAuthorised identifies a replacement needing privilege the
          operator did not opt into. Recoverable, but only through the opt-in.
        name: CodeElevationNotAuthorised
        type: errs.Code
        value: "0x00_02_22_12"
      - doc: |-
          CodeCandidateTagRequired identifies a candidate install asked for without
          naming which candidate. It wraps errors.ErrUnsupported, so a caller matching
          that instead still matches.
        name: CodeCandidateTagRequired
        type: errs.Code
        value: "0x00_03_42_01"
      - doc: |-
          CodeReleaseMetadataUnreadable identifies a release-API answer that arrived
          whole and did not decode. The bytes came, so no transport retry applies.
        name: CodeReleaseMetadataUnreadable
        type: errs.Code
        value: "0x00_03_42_02"
      - doc: |-
          CodeArchiveUnreadable identifies a release archive that would not unpack. It
          is raised only AFTER the signature and digest have both verified, so it is a
