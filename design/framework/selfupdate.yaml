apiVersion: kit.kitsunium/design/v2
domain: framework/selfupdate
packages:
  - codes:
      - const:
          - doc: |-
              CodeNoVendorKey identifies an install attempted by a build that carries no
              vendor key, so nothing could have authenticated the release.
            name: CodeNoVendorKey
            value: "0x00_02_22_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureMissing identifies a release whose detached signature over the
              checksum manifest could not be fetched.
            name: CodeSignatureMissing
            value: "0x00_02_22_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureInvalid identifies a checksum manifest whose signature did not
              verify against the vendor key.
            name: CodeSignatureInvalid
            value: "0x00_02_22_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeChecksumMissing identifies an archive with no entry in the authenticated
              checksum manifest.
            name: CodeChecksumMissing
            value: "0x00_02_22_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeChecksumMismatch identifies an archive whose digest did not match its
              authenticated manifest entry.
            name: CodeChecksumMismatch
            value: "0x00_02_22_05"
        type: errs.Code
      - const:
          - doc: CodeArchiveTooLarge identifies a release archive exceeding the size cap.
            name: CodeArchiveTooLarge
            value: "0x00_02_22_06"
        type: errs.Code
      - const:
          - doc: CodeAPIBodyTooLarge identifies a release-metadata response exceeding its cap.
            name: CodeAPIBodyTooLarge
            value: "0x00_02_22_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeInsecureRedirect identifies a redirect leaving HTTPS, or exceeding the
              hop bound.
            name: CodeInsecureRedirect
            value: "0x00_02_22_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnexpectedStatus identifies a release host answering with a status the
              update path does not accept.
            name: CodeUnexpectedStatus
            value: "0x00_02_22_09"
        type: errs.Code
      - const:
          - doc: CodeDownloadFailed identifies a download that did not complete.
            name: CodeDownloadFailed
            value: "0x00_02_22_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeDevBuild identifies a version check on a build with no release version to
              compare against.
            name: CodeDevBuild
            value: "0x00_02_22_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeCandidateNotFound identifies a requested release candidate that does not
              exist.
            name: CodeCandidateNotFound
            value: "0x00_02_22_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotPrerelease identifies a tag requested as a candidate that the host
              reports as a stable release.
            name: CodeNotPrerelease
            value: "0x00_02_22_0D"
        type: errs.Code
      - const:
          - doc: CodeDraftRelease identifies a draft release, which has no downloadable asset.
            name: CodeDraftRelease
            value: "0x00_02_22_0E"
        type: errs.Code
      - const:
          - doc: CodeInvalidTag identifies a tag that is not a valid semantic version.
            name: CodeInvalidTag
            value: "0x00_02_22_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeBinaryNotInArchive identifies a verified archive that does not contain the
              expected binary.
            name: CodeBinaryNotInArchive
            value: "0x00_02_22_10"
        type: errs.Code
      - const:
          - doc: CodeUnknownArchive identifies an asset whose container format is not handled.
            name: CodeUnknownArchive
            value: "0x00_02_22_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeElevationNotAuthorised identifies a replacement needing privilege the
              operator did not opt into.
            name: CodeElevationNotAuthorised
            value: "0x00_02_22_12"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
    path: github.com/kitsunium/sdk/framework/internal/core/selfupdate
    sentinels:
      - var:
          - code: CodeNoVendorKey
            doc: |-
              NoVendorKey is returned when the running build carries no vendor key. It
              is a REFUSAL, not a degradation: without a key nothing could have
              authenticated the release, so there is no weaker check to fall back to.
            name: NoVendorKey
            private: "core/selfupdate: no vendor public key was linked into this build"
            public: this build cannot verify a release and will not install one
            reason: NO_VENDOR_KEY
          - code: CodeSignatureMissing
            doc: |-
              SignatureMissing is returned when the detached signature over the checksum
              manifest could not be fetched.
            name: SignatureMissing
            private: "core/selfupdate: the detached signature over the checksum manifest was absent"
            public: the release is not signed
            reason: SIGNATURE_MISSING
          - code: CodeSignatureInvalid
            doc: |-
              SignatureInvalid is returned when the checksum manifest's signature does
              not verify against the vendor key.
            name: SignatureInvalid
            private: "core/selfupdate: the manifest signature failed ed25519 verification against the vendor key"
            public: the release signature did not verify
            reason: SIGNATURE_INVALID
          - code: CodeChecksumMissing
            doc: |-
              ChecksumMissing is returned when the authenticated manifest has no entry
              for the archive being installed.
            name: ChecksumMissing
            private: "core/selfupdate: the authenticated manifest carries no entry for the requested asset"
            public: the release has no checksum for this platform
            reason: CHECKSUM_MISSING
          - code: CodeChecksumMismatch
            doc: |-
              ChecksumMismatch is returned when the archive's digest does not match its
              authenticated manifest entry.
            name: ChecksumMismatch
            private: "core/selfupdate: the archive digest differs from its authenticated manifest entry"
            public: the release archive does not match its checksum
            reason: CHECKSUM_MISMATCH
          - code: CodeArchiveTooLarge
            doc: |-
              ArchiveTooLarge is returned when a release archive exceeds the size cap.
              The cap exists because the bytes are buffered in memory before anything
              has vouched for them.
            name: ArchiveTooLarge
            private: "core/selfupdate: the archive exceeded the in-memory size cap"
            public: the release archive is larger than this build accepts
            reason: ARCHIVE_TOO_LARGE
          - code: CodeAPIBodyTooLarge
            doc: |-
              APIBodyTooLarge is returned when a release-metadata response exceeds its
              cap.
            name: APIBodyTooLarge
            private: "core/selfupdate: the release API response exceeded its read cap"
            public: the release metadata is larger than this build accepts
            reason: API_BODY_TOO_LARGE
          - code: CodeInsecureRedirect
            doc: |-
              InsecureRedirect is returned when a redirect leaves HTTPS or exceeds the
              hop bound. Following it would hand the archive fetch to a plaintext hop.
            name: InsecureRedirect
            private: "core/selfupdate: a redirect left https or exceeded the hop bound"
            public: the release host redirected somewhere this build will not follow
            reason: INSECURE_REDIRECT
          - code: CodeUnexpectedStatus
            doc: |-
              UnexpectedStatus is returned when the release host answers with a status
              the update path does not accept.
            name: UnexpectedStatus
            private: "core/selfupdate: the release host returned a status the update path does not accept"
            public: the release host answered unexpectedly
            reason: UNEXPECTED_STATUS
          - code: CodeDownloadFailed
            doc: DownloadFailed is returned when a download does not complete.
            name: DownloadFailed
            private: "core/selfupdate: the release download did not complete"
            public: the release could not be downloaded
            reason: DOWNLOAD_FAILED
          - code: CodeDevBuild
            doc: |-
              DevBuild is returned when a version check runs on a build with no release
              version to compare against.
            name: DevBuild
            private: "core/selfupdate: the running build carries no release version"
            public: this build has no version to compare against a release
            reason: DEV_BUILD
          - code: CodeCandidateNotFound
            doc: |-
              CandidateNotFound is returned when a requested release candidate does not
              exist.
            name: CandidateNotFound
            private: "core/selfupdate: the requested candidate tag was not found on the release host"
            public: no such release candidate
            reason: CANDIDATE_NOT_FOUND
          - code: CodeNotPrerelease
            doc: |-
              NotPrerelease is returned when a tag requested as a candidate is reported
              as a stable release.
            name: NotPrerelease
            private: "core/selfupdate: the requested tag is not marked prerelease"
            public: that tag is a stable release, not a candidate
            reason: NOT_PRERELEASE
          - code: CodeDraftRelease
            doc: |-
              DraftRelease is returned for a draft release, which has no downloadable
              asset.
            name: DraftRelease
            private: "core/selfupdate: the requested release is a draft and exposes no asset"
            public: that release is still a draft
            reason: DRAFT_RELEASE
          - code: CodeInvalidTag
            doc: InvalidTag is returned for a tag that is not a valid semantic version.
            name: InvalidTag
            private: "core/selfupdate: the tag is not a valid semantic version"
            public: that is not a valid version tag
            reason: INVALID_TAG
          - code: CodeBinaryNotInArchive
            doc: |-
              BinaryNotInArchive is returned when a verified archive does not contain
              the expected binary. The archive is authentic; it is simply not what was
              expected, which is a packaging fault rather than an attack.
            name: BinaryNotInArchive
            private: "core/selfupdate: the verified archive holds no entry matching the binary name"
            public: the release archive does not contain the expected binary
            reason: BINARY_NOT_IN_ARCHIVE
          - code: CodeUnknownArchive
            doc: |-
              UnknownArchive is returned for an asset whose container format is not
              handled.
            name: UnknownArchive
            private: "core/selfupdate: the asset is neither a tar.gz nor a zip"
            public: the release archive format is not supported
            reason: UNKNOWN_ARCHIVE
          - code: CodeElevationNotAuthorised
            doc: |-
              ElevationNotAuthorised is returned when replacing the binary needs
              privilege the operator did not opt into. Escalating without being asked is
              the one thing an updater must never do quietly.
            name: ElevationNotAuthorised
            private: "core/selfupdate: the replacement required elevation and the opt-in was absent"
            public: replacing this binary needs privilege that was not authorised
            reason: ELEVATION_NOT_AUTHORISED
    types:
      - interface:
          methods:
            - in:
                - name: url
                  type: string
              name: Get
              out:
                - name: resp
                  type: "*http.Response"
                - name: err
                  type: error
        name: Getter
      - interface:
          methods:
            - name: Executable
              out:
                - name: path
                  type: string
                - name: err
                  type: error
            - in:
                - name: path
                  type: string
              name: EvalSymlinks
              out:
                - name: resolved
                  type: string
                - name: err
                  type: error
            - in:
                - name: dir
                - name: pattern
                  type: string
              name: CreateTemp
              out:
                - name: file
                  type: "*os.File"
                - name: err
                  type: error
            - in:
                - name: name
                  type: string
                - name: mode
                  type: os.FileMode
              name: Chmod
              out:
                - type: error
            - in:
                - name: oldpath
                - name: newpath
                  type: string
              name: Rename
              out:
                - type: error
            - in:
                - name: name
                  type: string
              name: Remove
              out:
                - type: error
        name: FileSystem
      - interface:
          methods:
            - in:
                - name: dst
                  type: io.Writer
                - name: src
                  type: io.Reader
              name: Copy
              out:
                - name: written
                  type: int64
                - name: err
                  type: error
        name: Copier
      - name: UpdateValue
        struct:
          fields:
            - name: CurrentVersion
              type: string
            - name: LatestVersion
              type: string
            - name: Available
              type: bool
      - name: CandidateValue
        struct:
          fields:
            - name: Tag
              type: string
            - name: Name
              type: string
            - name: CreatedAt
              type: string
  - aliases:
      - name: CandidateValue
        target: coreupd.CandidateValue
      - name: Getter
        target: coreupd.Getter
      - name: FileSystem
        target: coreupd.FileSystem
      - name: Copier
        target: coreupd.Copier
      - name: UpdateValue
        target: coreupd.UpdateValue
    codes:
      - const:
          - doc: |-
              CodeCandidateTagRequired identifies a candidate install asked for without
              naming which candidate.
            name: CodeCandidateTagRequired
            note: "range: 0.3.66.0 - 0.3.66.255"
            value: "0x00_03_42_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeReleaseMetadataUnreadable identifies a release-API answer that arrived
              whole and did not decode as release metadata.
            name: CodeReleaseMetadataUnreadable
            value: "0x00_03_42_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeArchiveUnreadable identifies a release archive that could not be
              buffered or unpacked.

              It is deliberately NOT the domain's ChecksumMismatch: by the time anything
              here runs the archive has already been authenticated and its digest matched,
              so a container that will not open is a packaging or transfer fault and never
              a supply-chain signal. Reporting it as one would tell an operator not to
              install a release that is provably the vendor's.
            name: CodeArchiveUnreadable
            value: "0x00_03_42_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeExecutablePathUnresolved identifies an update that cannot name the file
              it would replace.
            name: CodeExecutablePathUnresolved
            value: "0x00_03_42_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeStagingFailed identifies a replacement that failed BEFORE the rename, so
              the running binary was never touched.

              The boundary between this and [CodeReplacementFailed] is the only thing an
              operator needs from these two, and it is the rename: everything under this
              code leaves the installed binary byte-for-byte as it was.
            name: CodeStagingFailed
            value: "0x00_03_42_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeReplacementFailed identifies a rename over the running executable that
              did not land.
            name: CodeReplacementFailed
            value: "0x00_03_42_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeElevationFailed identifies an escalation the operator DID authorise and
              that the system refused anyway.

              It is not the domain's ElevationNotAuthorised, and the difference is the
              whole remedy: that one is fixed by setting one environment variable, this one
              is not fixed by setting anything.
            name: CodeElevationFailed
            value: "0x00_03_42_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeProbeFailed identifies a replacement whose new binary did not answer the
              probe the product declared (ADR 0150). The fields say whether the previous
              binary, kept as <binary>.prev, was put back.
            name: CodeProbeFailed
            value: "0x00_03_42_08"
        type: errs.Code
    constants:
      - name: CandidateListSentinel
        type: string
        value: "\"__list__\""
    functions:
      - name: StdinIsTerminal
        out:
          - type: bool
      - in:
          - name: version
            type: string
          - name: src
            type: SourceValue
        name: NewService
        out:
          - type: "*Service"
      - in:
          - name: version
            type: string
          - name: src
            type: SourceValue
          - name: client
            type: Getter
          - name: fs
            type: FileSystem
          - name: copier
            type: Copier
        name: NewUpdaterWithDeps
        out:
          - type: "*Service"
    imports:
      coreupd: github.com/kitsunium/sdk/framework/internal/core/selfupdate
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/framework/internal/service/selfupdate
    sentinels:
      - var:
          - code: CodeCandidateTagRequired
            doc: |-
              CandidateTagRequired is returned by DownloadCandidate for an empty tag.

              There is deliberately no "latest candidate" to fall back to. A
              prerelease channel has no ordering an updater may assume — rc.2 can be
              published after rc.3 is withdrawn — so resolving the empty tag would
              mean this package choosing which unreleased build to install over the
              running binary.
            name: CandidateTagRequired
            options:
              - errs.WithExitCode(exitUsage)
            private: "service/selfupdate: DownloadCandidate received an empty tag; errors.ErrUnsupported is kept as the cause, so anything that matched it before this sentinel existed still matches"
            public: a release candidate is installed by naming its tag, and no tag was named
            reason: CANDIDATE_TAG_REQUIRED
          - code: CodeReleaseMetadataUnreadable
            doc: |-
              ReleaseMetadataUnreadable is returned when the release API answers
              within its size cap and the body does not decode as release metadata.

              It is separate from the download sentinels on purpose: the bytes
              arrived, so no retry policy keyed on a transport failure applies, and
              the thing to look at is what the host actually sent.
            name: ReleaseMetadataUnreadable
            private: "service/selfupdate: a release API response decoded neither as a release nor as a list of them; the fields name the query and, where the query had one, the tag"
            public: the release host's answer could not be read as release metadata
            reason: RELEASE_METADATA_UNREADABLE
          - code: CodeArchiveUnreadable
            doc: |-
              ArchiveUnreadable is returned when the release archive cannot be
              buffered or unpacked.

              Everything under this sentinel happens AFTER the archive's signature
              and digest have both been verified, which is what makes it a packaging
              or transfer fault rather than a supply-chain one. Saying so matters:
              the documented response to an authenticity refusal is "do not install
              this by any means", and that is the wrong advice for a gzip stream that
              was truncated on the way in.
            name: ArchiveUnreadable
            private: "service/selfupdate: buffering or unpacking the verified archive failed; the fields name the stage and, for a zip entry, which entry"
            public: the release archive could not be read
            reason: ARCHIVE_UNREADABLE
          - code: CodeExecutablePathUnresolved
            doc: |-
              ExecutablePathUnresolved is returned when the process cannot work out
              which file on disk it is running from.

              Nothing is attempted after it. An updater that guesses its own path
              writes a downloaded binary somewhere nobody asked for.
            name: ExecutablePathUnresolved
            private: "service/selfupdate: os.Executable or the symlink resolution behind it failed; the fields name which of the two"
            public: the path of the running binary could not be resolved, so nothing was replaced
            reason: EXECUTABLE_PATH_UNRESOLVED
          - code: CodeStagingFailed
            doc: |-
              StagingFailed is returned when the replacement fails BEFORE the rename.

              The installed binary is byte-for-byte as it was, and the partial
              staging file has been removed. That is the whole content of this
              sentinel, and it is why it is not merged with ReplacementFailed: the
              two differ in exactly the fact an operator needs, which is whether the
              binary they are about to run is the old one or something in between.
            name: StagingFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: creating, writing, closing or chmod-ing the staging file failed; the fields name the step"
            public: the update could not be staged, and the running binary was left untouched
            reason: STAGING_FAILED
          - code: CodeReplacementFailed
            doc: |-
              ReplacementFailed is returned when the rename of the staged file over
              the running executable does not land.

              The rename is atomic, so this means the old binary is still in place —
              but unlike StagingFailed it is the step that would have changed it, and
              the remedy is about the install directory rather than about disk space.
            name: ReplacementFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: the rename of the staged file over the running executable failed; the fields name the step"
            public: the running binary could not be replaced
            reason: REPLACEMENT_FAILED
          - code: CodeElevationFailed
            doc: |-
              ElevationFailed is returned when an escalation the operator DID
              authorise is refused by the system.

              It is deliberately not ElevationNotAuthorised, and the gap between them
              is the remedy: that one is repaired by exporting one variable, and this
              one is not repaired by exporting anything. Merging them would send
              somebody who already set the variable to set it again.
            name: ElevationFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: `sudo -n mv` exited non-zero; the fields carry sudo's own output, which names the real blocker far better than the exec error does"
            public: the elevated replacement was authorised and the system refused it
            reason: ELEVATION_FAILED
          - code: CodeProbeFailed
            doc: |-
              ProbeFailed is returned when the replacement landed and the new binary
              did not answer the product's probe in time. The previous binary is put
              back from <binary>.prev when it was kept; rolled_back says whether it
              was.
            name: ProbeFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "service/selfupdate: the probe of the replaced binary failed or timed out; rolled_back says whether <binary>.prev was put back"
            public: the new binary did not answer its probe and was not kept
            reason: PROBE_FAILED
    types:
      - methods:
          - in:
              - name: out
                type: io.Writer
              - name: in
                type: io.Reader
              - name: interactive
                type: bool
            name: AuthoriseUnattendedUpgrade
            out:
              - type: bool
            recv: value
          - in:
              - name: out
                type: io.Writer
            name: ExplainUpgradeRefusal
            recv: value
          - in:
              - name: out
                type: io.Writer
              - name: action
                type: string
              - name: err
                type: error
            name: ExplainUpgradeFailure
            recv: value
          - name: AutoUpgradeEnv
            out:
              - type: string
            recv: value
          - name: SudoOptInEnv
            out:
              - type: string
            recv: value
        name: SourceValue
        struct:
          fields:
            - name: Owner
              type: string
            - name: StableRepo
              type: string
            - name: DevRepo
              type: string
            - name: Product
              type: string
      - methods:
          - name: ListCandidates
            out:
              - name: candidates
                type: "[]CandidateValue"
              - name: listErr
                type: error
            recv: pointer
          - in:
              - name: tag
                type: string
            name: DownloadCandidate
            out:
              - name: info
                type: UpdateValue
              - name: downloadErr
                type: error
            recv: pointer
          - name: WithAutomaticConsent
            out:
              - type: "*Service"
            recv: pointer
          - name: WithoutElevation
            out:
              - type: "*Service"
            recv: pointer
          - in:
              - name: out
                type: io.Writer
              - name: in
                type: io.Reader
              - name: interactive
                type: bool
            name: AuthoriseUnattendedUpgrade
            out:
              - type: bool
            recv: pointer
          - in:
              - name: keys
                type: "[]byte"
            name: WithVendorKeys
            out:
              - type: "*Service"
            recv: pointer
            variadic: true
          - in:
              - name: domain
                type: string
            name: WithSignatureDomain
            out:
              - type: "*Service"
            recv: pointer
          - in:
              - name: args
                type: "[]string"
              - name: timeout
                type: time.Duration
            name: WithProbe
            out:
              - type: "*Service"
            recv: pointer
          - in:
              - name: key
                type: "[]byte"
            name: WithVendorKey
            out:
              - type: "*Service"
            recv: pointer
          - name: CheckForUpdate
            out:
              - name: info
                type: UpdateValue
              - name: checkErr
                type: error
            recv: pointer
          - name: Upgrade
            out:
              - name: info
                type: UpdateValue
              - name: upgradeErr
                type: error
            recv: pointer
        name: Service
        struct:
          unexported: true
  - aliases:
      - name: Getter
        target: coreupd.Getter
      - name: FileSystem
        target: coreupd.FileSystem
      - name: Copier
        target: coreupd.Copier
      - name: Update
        target: svcupd.UpdateValue
      - name: Candidate
        target: svcupd.CandidateValue
      - name: Source
        target: svcupd.SourceValue
      - name: Service
        target: svcupd.Service
    constants:
      - name: CodeNoVendorKey
        type: errs.Code
        value: "0x00_02_22_01"
      - name: CodeSignatureMissing
        type: errs.Code
        value: "0x00_02_22_02"
      - name: CodeSignatureInvalid
        type: errs.Code
        value: "0x00_02_22_03"
      - name: CodeChecksumMissing
        type: errs.Code
        value: "0x00_02_22_04"
      - name: CodeChecksumMismatch
        type: errs.Code
        value: "0x00_02_22_05"
      - name: CodeArchiveTooLarge
        type: errs.Code
        value: "0x00_02_22_06"
      - name: CodeAPIBodyTooLarge
        type: errs.Code
        value: "0x00_02_22_07"
      - name: CodeInsecureRedirect
        type: errs.Code
        value: "0x00_02_22_08"
      - name: CodeUnexpectedStatus
        type: errs.Code
        value: "0x00_02_22_09"
      - name: CodeDownloadFailed
        type: errs.Code
        value: "0x00_02_22_0A"
      - name: CodeDevBuild
        type: errs.Code
        value: "0x00_02_22_0B"
      - name: CodeCandidateNotFound
        type: errs.Code
        value: "0x00_02_22_0C"
      - name: CodeNotPrerelease
        type: errs.Code
        value: "0x00_02_22_0D"
      - name: CodeDraftRelease
        type: errs.Code
        value: "0x00_02_22_0E"
      - name: CodeInvalidTag
        type: errs.Code
        value: "0x00_02_22_0F"
