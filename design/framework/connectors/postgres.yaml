apiVersion: kit.kitsunium/design/v2
domain: framework/connectors/postgres
packages:
  - codes:
      - block: true
        const:
          - doc: |-
              CodeURLMalformed identifies a URL the driver cannot read (ADR 0147: layer 4,
              one PP per connector).
            name: CodeURLMalformed
            value: "0x00_04_10_01"
        type: errs.Code
    functions:
      - name: Engine
        out:
          - type: kit.Engine
    imports:
      errs: github.com/kitsunium/sdk/pkg/v1/errs
      kit: github.com/kitsunium/sdk/framework/kit
    path: github.com/kitsunium/sdk/framework/connectors/postgres
