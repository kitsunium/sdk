apiVersion: kit.kitsunium/design/v2
domain: framework/connectors/ssh
packages:
  - codes:
      - const:
          - doc: |-
              CodeEnrolmentFailed identifies a key pair that could not be minted.

              It covers every step of GenerateKeyPair after the subject has been
              validated: creating the key directory, generating the pair, serialising
              either half, and writing either half. The fields name which.

              It is deliberately NOT CodeNoLicence. That one says "this machine is not
              enrolled", whose remedy is to enrol; this one says the attempt to enrol just
              failed, whose remedy is whatever the filesystem reported. Reporting the
              second as the first sends an operator to run the command that has already
              failed.
            name: CodeEnrolmentFailed
            note: "range: 0.3.65.0 - 0.3.65.255"
            value: "0x00_03_41_01"
        type: errs.Code
    functions:
      - in:
          - name: sshDir
            type: string
        name: DiscoverSubject
        out:
          - name: uuid
            type: string
          - name: err
            type: error
      - name: DefaultSSHDir
        out:
          - type: string
      - name: NewSubjectID
        out:
          - type: string
      - in:
          - name: product
            type: "*entitlement.Product"
          - name: sshDir
          - name: subject
            type: string
        name: GenerateKeyPair
        out:
          - name: publicKey
            type: string
          - name: err
            type: error
      - in:
          - name: product
            type: "*entitlement.Product"
          - name: subject
          - name: publicKey
            type: string
          - name: rotation
            type: bool
        name: IssueURL
        out:
          - type: string
      - in:
          - name: sshDir
          - name: uuid
            type: string
        name: PublicKeyPath
        out:
          - type: string
      - in:
          - name: sshDir
          - name: uuid
            type: string
        name: PrivateKeyPath
        out:
          - type: string
      - in:
          - name: sshDir
          - name: uuid
            type: string
        name: LoadPublicKey
        out:
          - name: pub
            type: ssh.PublicKey
          - name: err
            type: error
      - in:
          - name: pub
            type: ssh.PublicKey
        name: Fingerprint
        out:
          - type: string
      - in:
          - name: signer
            type: ssh.Signer
          - name: pub
            type: ssh.PublicKey
        name: ProvePossession
        out:
          - type: error
      - in:
          - name: sshDir
          - name: uuid
            type: string
        name: SignerFromFile
        out:
          - name: signer
            type: ssh.Signer
          - name: err
            type: error
      - in:
          - name: dir
            type: string
        name: NewSSHIdentity
        out:
          - type: "*SSHIdentity"
    imports:
      entitlement: github.com/kitsunium/sdk/framework/entitlement
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      ssh: golang.org/x/crypto/ssh
    path: github.com/kitsunium/sdk/framework/connectors/ssh
    sentinels:
      - var:
          - code: CodeEnrolmentFailed
            doc: |-
              EnrolmentFailed is returned when GenerateKeyPair cannot mint the pair.

              Nothing partial is left behind that a later run cannot overwrite, but
              the private half IS written before the public one, so a failure between
              the two leaves a key with no published half — which the next
              DiscoverSubject reads as an unusable identity rather than as an
              enrolled one, and which re-running enrolment replaces.
            name: EnrolmentFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "framework/connectors/ssh: a step of GenerateKeyPair failed; the fields name the step, the key directory and the subject"
            public: the entitlement key pair could not be created
            reason: ENROLMENT_FAILED
    types:
      - methods:
          - name: Discover
            out:
              - name: subject
                type: string
              - name: err
                type: error
            recv: pointer
          - in:
              - name: subject
                type: string
            name: Fingerprint
            out:
              - name: fingerprint
                type: string
              - name: err
                type: error
            recv: pointer
          - in:
              - name: subject
                type: string
            name: ProvePossession
            out:
              - type: error
            recv: pointer
          - in:
              - name: subject
              - name: authorised
                type: string
            name: ProvePossessionFor
            out:
              - type: error
            recv: pointer
        name: SSHIdentity
        struct:
          unexported: true
