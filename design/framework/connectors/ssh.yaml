apiVersion: kit.kitsunium/design/v2
domain: framework/connectors/ssh
packages:
  - codes:
      - const:
          - doc: |-
              CodeEnrolmentFailed identifies a key pair that could not be minted.

              It covers every step of GenerateKeyPair after the subject has been
              validated: creating the key directory, generating the pair, serialising
              either half, and writing either half. The fields name which.

              It is deliberately NOT CodeNoLicence. That one says "this machine is not
              enrolled", whose remedy is to enrol; this one says the attempt to enrol just
              failed, whose remedy is whatever the filesystem reported. Reporting the
              second as the first sends an operator to run the command that has already
              failed.
            name: CodeEnrolmentFailed
            note: "range: 0.3.65.0 - 0.3.65.255"
            value: "0x00_03_41_01"
        type: errs.Code
    doc: |-
      Package ssh — the one error-code range this package owns.

      Everything it says about VERIFICATION is said in the entitlement contract's
      vocabulary — framework/entitlement's sentinels, 0.2.35.*: a missing key, a
      mismatched fingerprint and an unproven possession are the contract's
      situations, and an ssh implementation reporting them in its own dialect would
      make every caller learn a second set for the same three answers.

      ENROLMENT is not in that contract. Minting a pair is something this package
      does and the port does not describe, so its failures have nowhere to borrow a
      code from, and they carried none at all until this range existed.

      Registered in design/sdk.yaml's codes.ranges, which kit writes into
      codeRangeOwners (ADR 0035, ADR 0164), and already listed in
      //:audit_sources.

      Package ssh — discovering which subject this machine is enrolled as,
      from the layout ssh keys actually have on disk.

      This is the half of the Identity port that depends on the ssh key FORMAT and
      the ~/.ssh convention, which is why it lives here rather than with the
      mechanism (kitsunium/sdk ADR 0078).

      Package ssh - enrolment: minting a subject identity locally and turning
      it into a request the vendor can act on. The private half never leaves the
      machine; what travels is the public half and the UUID naming it.

      Package ssh — the sentinel this package emits on its own account.

      Its Public names no path and no subject. A key directory is a location on
      somebody's disk and a subject is an identifier the vendor's roster keys on;
      both belong in Fields, which enrolFailed puts them in and which
      errs.FieldsOf reads back.

      Package ssh - local key material and the possession proof. The public
      halves are published by design, so reading one proves nothing; only a
      fresh signature over a per-call nonce establishes ownership.

      Package ssh - the unix half of the private-key permission gate. The
      mode bits mean what they say here, so they are worth refusing on.

      Package ssh - the windows half of the private-key permission gate.
      There are no POSIX mode bits to read here, so the gate is deliberately
      not applied rather than applied to a value that means nothing.

      Package ssh is the ssh implementation of the framework's entitlement
      Identity port, plus enrolment: minting a subject identity locally and turning
      it into a request the vendor can act on.

      It is a connector module of its own (ADR 0158), the shape the database
      engines have: the mechanism — roster, signature, offline cache, anti-rollback
      ratchet, CI seat, version floor — is the framework's entitlement package,
      which reaches no ssh code, while golang.org/x/crypto/ssh, and the
      golang.org/x/sys it brings, are required by this module and nothing else.

      	identity := ssh.NewSSHIdentity("") // the user's ~/.ssh
      	service := entitlement.New(identity, vendorKey, &product)
      	grant, err := service.Verify(time.Now())

      Possession is proven against key material the user ALREADY has, and every
      refusal is said in the entitlement contract's vocabulary (0.2.35.*); the one
      failure that contract has no word for, a failed enrolment, is this package's
      own CodeEnrolmentFailed (0.3.65.1).

      Package ssh — compile-time proof that the ssh implementation still
      satisfies the port it is written against.

      Package ssh — the three shapes every error here is built with, so the
      choice at a call site is which sentinel rather than which spelling.

      The split between the first two is whether this package DECIDED the failure
      or was TOLD about one. A decision has no cause to carry — nothing failed, a
      rule was applied to a filename or a mode — and the sentinel itself is the
      whole of it. A report from outside has a cause that must survive, because
      errors.Is(err, fs.ErrNotExist) and the text the operating system wrote are
      the two things a wrapper most often destroys.

      They are a copy of framework/internal/service/entitlement's, and deliberately not an
      import: that package is a separate Go module, so its unexported helpers are
      unreachable from here, and exporting them would put three wrapping shapes on
      the surface of a domain whose whole public API is a three-method port and a
      facade. Thirty lines duplicated across a module boundary is the smaller cost,
      and the two copies are pinned to the same behaviour by having the same tests
      on both sides.
    functions:
      - doc: |-
          DiscoverSubject finds the enrolled UUID by looking for a key named after
          one. Naming the file after the identifier is what removes the need for any
          local state file: the filesystem holds the binding.

          It refuses rather than guesses when several identities are present. Picking
          one would decide which licence gets verified, which one a rotation
          overwrites, and which one `license status` reports — none of which this
          function is entitled to decide on the caller's behalf.
        in:
          - name: sshDir
            type: string
        name: DiscoverSubject
        out:
          - name: uuid
            type: string
          - name: err
            type: error
      - doc: DefaultSSHDir returns the conventional key location for the current user.
        name: DefaultSSHDir
        out:
          - type: string
      - doc: |-
          NewSubjectID mints a version 4 identifier. It is drawn locally because the
          vendor never needs to allocate it: collisions are not a practical concern
          at 122 bits of entropy, and self-allocation keeps enrolment offline until
          the moment the user files the issue.

          The hand-rolled version this replaces set the same bits over the same 16
          bytes of crypto/rand and rendered the same canonical dashed form, so the
          identifiers are indistinguishable across the change. It returned an error
          only because it checked crypto/rand.Read, which since Go 1.24 cannot fail —
          it panics instead. That branch was already unreachable, and the test that
          asserted err == nil could not have failed either. Dropping the result is
          the visible half of the swap.
        name: NewSubjectID
        out:
          - type: string
      - doc: |-
          GenerateKeyPair writes a fresh ed25519 pair named after subject. ed25519
          over RSA is deliberate: shorter, faster, the current default in .ssh, and
          the same primitive the roster signature uses.

          The parameter is named subject rather than uuid because the stdlib package
          of that name is imported here.
        in:
          - name: product
            type: "*entitlement.Product"
          - name: sshDir
          - name: subject
            type: string
        name: GenerateKeyPair
        out:
          - name: publicKey
            type: string
          - name: err
            type: error
      - doc: |-
          IssueURL builds the prefilled enrolment request. The CLI never holds a
          GitHub token: it hands the user a link, and the account that opens the
          issue is the identity the workflow binds the UUID to.
        in:
          - name: product
            type: "*entitlement.Product"
          - name: subject
          - name: publicKey
            type: string
          - name: rotation
            type: bool
        name: IssueURL
        out:
          - type: string
      - doc: |-
          PublicKeyPath returns where a subject's public half lives. The file is named
          after the UUID so the lookup needs no index: the identifier IS the address.
        in:
          - name: sshDir
          - name: uuid
            type: string
        name: PublicKeyPath
        out:
          - type: string
      - doc: |-
          PrivateKeyPath returns where a subject's private half lives, alongside the
          public one and under the same UUID name.
        in:
          - name: sshDir
          - name: uuid
            type: string
        name: PrivateKeyPath
        out:
          - type: string
      - doc: LoadPublicKey reads and parses the local public half for a subject.
        in:
          - name: sshDir
          - name: uuid
            type: string
        name: LoadPublicKey
        out:
          - name: pub
            type: ssh.PublicKey
          - name: err
            type: error
      - doc: |-
          Fingerprint renders the SHA256 fingerprint the roster records. Comparing
          fingerprints rather than raw bytes keeps the roster small and the check
          exact.
        in:
          - name: pub
            type: ssh.PublicKey
        name: Fingerprint
        out:
          - type: string
      - doc: |-
          ProvePossession verifies that signer controls the private half matching pub.

          This is the step that makes publishing the public keys safe. The roster is
          world-readable by design, so anyone can copy a .pub and claim the matching
          UUID; only the holder of the private half can sign a fresh challenge. The
          nonce is generated per call, so a captured signature is worthless.
        in:
          - name: signer
            type: ssh.Signer
          - name: pub
            type: ssh.PublicKey
        name: ProvePossession
        out:
          - type: error
      - doc: |-
          SignerFromFile loads an unencrypted private key. Passphrase-protected keys
          deliberately fail here: the linter never prompts for a passphrase, they are
          meant to be exercised through ssh-agent instead.
        in:
          - name: sshDir
          - name: uuid
            type: string
        name: SignerFromFile
        out:
          - name: signer
            type: ssh.Signer
          - name: err
            type: error
      - doc: |-
          NewSSHIdentity returns an Identity reading from dir. An empty dir resolves to
          the user's conventional key directory.
        in:
          - name: dir
            type: string
        name: NewSSHIdentity
        out:
          - type: "*SSHIdentity"
    imports:
      entitlement: github.com/kitsunium/sdk/framework/entitlement
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      ssh: golang.org/x/crypto/ssh
    path: github.com/kitsunium/sdk/framework/connectors/ssh
    sentinels:
      - var:
          - code: CodeEnrolmentFailed
            doc: |-
              EnrolmentFailed is returned when GenerateKeyPair cannot mint the pair.

              Nothing partial is left behind that a later run cannot overwrite, but
              the private half IS written before the public one, so a failure between
              the two leaves a key with no published half — which the next
              DiscoverSubject reads as an unusable identity rather than as an
              enrolled one, and which re-running enrolment replaces.
            name: EnrolmentFailed
            options:
              - errs.WithExitCode(exitCantCreate)
            private: "framework/connectors/ssh: a step of GenerateKeyPair failed; the fields name the step, the key directory and the subject"
            public: the entitlement key pair could not be created
            reason: ENROLMENT_FAILED
    types:
      - decl: true
        doc: |-
          SSHIdentity proves a machine's identity from the ssh key material already in
          a user's key directory.

          It is a module of its own, framework/connectors/ssh, because
          golang.org/x/crypto/ssh brings golang.org/x/term and through it
          golang.org/x/sys, which the SDK and its framework ban (ADR 0078, ADR 0158). A
          consumer that wants it requires this module and its dependency graph; one
          that already handles its own key material implements the three-method port
          instead and inherits nothing.

          Why ssh key material rather than a keypair this package would mint: the whole
          point is that possession is proven against something the user ALREADY has and
          already protects. A file this package invented would need a lifecycle — where
          it lives, who may read it, what happens on rotation — that the user's own key
          directory already has.
        implements:
          - entitlement.Identity
          - entitlement.BoundProver
        methods:
          - doc: |-
              Discover returns the subject this machine is enrolled as, refusing rather
              than choosing when several identities are present.
            name: Discover
            out:
              - name: subject
                type: string
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Fingerprint returns the published fingerprint of the subject's public half,
              in the spelling the roster uses.
            in:
              - name: subject
                type: string
            name: Fingerprint
            out:
              - name: fingerprint
                type: string
              - name: err
                type: error
            recv: pointer
          - doc: |-
              ProvePossession answers the challenge with the subject's private half.

              A nil error IS the proof. There is deliberately nothing to inspect: anything
              returned here would be a second thing a caller had to verify.

              It proves possession of whatever is in the key directory when it is called,
              which is the only claim the three-method port can carry.
              ProvePossessionFor is the stronger one and is what the framework's engine
              reaches for; this method stays because the port is frozen at three methods
              and a caller holding a entitlement.Identity must keep working.
            in:
              - name: subject
                type: string
            name: ProvePossession
            out:
              - type: error
            recv: pointer
          - doc: |-
              ProvePossessionFor answers the challenge with the subject's private half, and
              refuses unless the published half is the one the roster AUTHORISED.

              This is entitlement.BoundProver, and the binding is the whole of what it adds. The
              engine's own comparison happens between its Fingerprint call and its proof
              call, so material replaced in that window was signed for and nothing noticed:
              a rotation mid-verification, a volume remounted, a `<uuid>.pub` swapped by
              anything that can write the key directory. Re-reading the directory HERE and
              comparing against the value the roster published closes it, because the
              comparison and the signature now happen against one read.

              It is not a second fingerprint POLICY. Fingerprint's contract is that the
              roster's spelling is compared by byte equality and never parsed, and this
              compares the identical rendering to the identical value. A refusal is
              ErrKeyMismatch — "a local key that does not match the published fingerprint",
              which is exactly what happened — so the taxonomy does not grow by one entry.
            in:
              - name: subject
              - name: authorised
                type: string
            name: ProvePossessionFor
            out:
              - type: error
            recv: pointer
        name: SSHIdentity
        struct:
          fields:
            - doc: dir is the key directory, conventionally ~/.ssh.
              name: dir
              type: string
