    doc: |-
      Package plug is where the framework's opt-in subsystems plug in: the HTTP engine, the
      frontends' file server and the process sampler of the runtime graph
      (framework/app/server), the Studio — the tool's variables, its routes and
      the framework's sentences in the languages after English (framework/app/studio) —, the
      stores and the databases (framework/app/store), the queues
      (framework/app/queue), the workflows (framework/app/workflow), the mailers
      (framework/app/mail), the jobs (framework/app/jobs). The framework reads
      what they registered through the hooks declared here, and imports none of
      the SDK packages behind them: a product that does not import a subsystem
      neither links nor initialises its packages.

      It is also the contract between the framework's core and the subsystems ADR 0179
      takes out of it, as database/sql/driver is between database/sql and a
      driver: the store subsystem's engine over documents, its siblings, the framework's
      scope on a database and its migrations ([Stores]), which framework/app/store
      sets; the refusals an engine says in the framework's terms ([Refusal]); what the framework's
      transactions offer an engine that takes part in them ([Transaction]); the
      queue subsystem's brokers and their consumer ([Queues]), which
      framework/app/queue sets; the workflow subsystem's engine and the ports
      it runs on ([Workflows]), which framework/app/workflow sets; the mail
      subsystem's outbox and transports ([Mail]), which framework/app/mail sets;
      the jobs subsystem's schedules and scheduler ([Jobs]), which
      framework/app/jobs sets; the framework's catalogues in the languages after
      English ([Words]), and the Studio's routes and the tool's variables
      ([Studio], ADR 0180 step 1), which framework/app/studio sets, the routes
      reading the running app through a [StudioHost] the framework gives.

      The package imports the standard library and the framework's model only,
      so that the framework and every subsystem can import it.
    functions:
      - doc: Refuse is err as a refusal of kind.
        in:
          - name: kind
            type: Refusal
          - name: err
            type: error
        name: Refuse
        out:
          - type: error
      - doc: Refused reports whether err, or an error it wraps, is a refusal of kind.
        in:
          - name: err
            type: error
          - name: kind
            type: Refusal
        name: Refused
        out:
          - type: bool
    imports:
      atomic: sync/atomic
      fs: io/fs
      http: net/http
      json: encoding/json
      model: github.com/kitsunium/sdk/framework/model
      sql: database/sql
      textproto: net/textproto
    path: github.com/kitsunium/sdk/framework/internal/app/plug
    types:
      - doc: |-
          JobDriverConfig is what framework/app/jobs plugs into kit: how a job's
          schedule is read from its declaration, and how the scheduler that fires
          the app's jobs opens.
        name: JobDriverConfig
        struct:
          fields:
            - doc: |-
                Every is the schedule of a job that runs every period, first one
                period after the scheduler starts; a period that is not positive is
                refused.
              name: Every
              type: func(period time.Duration) (JobScheduleFunc, error)
            - doc: |-
                Cron is the schedule of a five-field POSIX cron expression, in the
                process's local time zone; an expression it cannot read is refused.
              name: Cron
              type: func(expr string) (JobScheduleFunc, error)
            - doc: |-
                Open opens the scheduler the app's jobs run on, as cfg says, with no
                entry yet.
              name: Open
              type: func(cfg *JobSchedulerConfig) JobScheduler
      - doc: |-
          JobScheduleFunc says when a job runs next after an instant: the instant,
          and false when it never runs again.
        name: JobScheduleFunc
        underlying: func(after time.Time) (next time.Time, ok bool)
      - doc: |-
          JobSchedulerConfig is the scheduler the app's jobs run on: the app's clock
          and what the framework hears of each fire.
        name: JobSchedulerConfig
        struct:
          fields:
            - doc: Clock is the app's clock, which the scheduler stamps and waits on.
              name: Clock
              type: Clock
            - doc: |-
                OnResult hears every decision of the scheduler — each run, with the
                job's own error, and each fire skipped or missed —, one at a time.
              name: OnResult
              type: func(res JobResultValue)
      - doc: |-
          JobEntryValue is one job as the scheduler fires it: its name, its
          schedule, and the run.
        name: JobEntryValue
        struct:
          fields:
            - doc: Name names the job; the scheduler refuses a name it holds already.
              name: Name
              type: string
            - doc: Schedule says when the job runs next.
              name: Schedule
              type: JobScheduleFunc
            - doc: Run runs the job once; its error is the result's.
              name: Run
              type: func(ctx context.Context) error
            - doc: |-
                Overlap is what a fire does while the job's previous run goes, as the
                SDK scheduler's OverlapPolicy numbers it: 0 skips it — the zero —, 1
                runs it beside, 2 replaces the run; the scheduler refuses any other.
              name: Overlap
              type: uint8
            - doc: |-
                StartingDeadline bounds how late a fire may still start; zero is no
                bound.
              name: StartingDeadline
              type: time.Duration
      - doc: |-
          JobResultValue is one decision of the scheduler: a run of a job, or a fire
          it skipped.
        name: JobResultValue
        struct:
          fields:
            - doc: Name is the job's.
              name: Name
              type: string
            - doc: Scheduled is the instant the fire was due.
              name: Scheduled
              type: time.Time
            - doc: Started and Finished bound the run; zero for a fire that did not run.
              name: Started
            - doc: Started and Finished bound the run; zero for a fire that did not run.
              name: Finished
              type: time.Time
            - doc: |-
                Missed counts the fires that came due while the scheduler could not
                fire them, skipped rather than caught up.
              name: Missed
              type: int
            - doc: "Skipped says the fire did not run: a run of the same job was going."
              name: Skipped
              type: bool
            - doc: |-
                Expired says the fire did not run: the scheduler came to it more
                than the job's starting deadline after its instant.
              name: Expired
              type: bool
            - doc: |-
                Replaced says a newer fire of a job that replaces its runs cancelled
                this one — before it started when Started is zero.
              name: Replaced
              type: bool
            - doc: Err is the run's error.
              name: Err
              type: error
      - doc: |-
          JobScheduler fires the app's jobs, each on its schedule, on the app's
          clock: a fire due while the previous run of the same job is going is
          skipped, a missed one is counted, never caught up.
        interface:
          methods:
            - doc: |-
                Add registers a job; it is refused while the scheduler runs, for a
                name it holds already, and for an entry with no name, run or
                schedule.
              in:
                - name: entry
                  type: JobEntryValue
              name: Add
              out:
                - type: error
            - doc: Run fires the jobs until ctx ends, then waits for the runs going.
              in:
                - name: ctx
                  type: context.Context
              name: Run
              out:
                - type: error
        name: JobScheduler
      - doc: |-
          MailDriverConfig is what framework/app/mail plugs into kit: how a
          mailer's outbox opens, the SDK's verdict on a mail, the transports a
          mailer hands its mail to, and how the framework tells the spool's refusals apart.
        name: MailDriverConfig
        struct:
          fields:
            - doc: Open opens one mailer's outbox as cfg says, closed until it runs.
              name: Open
              type: func(cfg *MailSpoolConfig) (MailSpool, error)
            - doc: |-
                Validate is the SDK's verdict on a mail: nil when the outbox takes it,
                else what is wrong with it, in the SDK's public words.
              name: Validate
              type: func(msg MailValue) error
            - doc: |-
                Capture is a transport that delivers nothing and keeps the last
                message it composed (MailCaptureSource).
              name: Capture
              type: func() MailSink
            - doc: |-
                ParseSMTP reads an SMTP URL — smtp://user:password@host:port?tls=
                starttls|implicit|none, smtps:// for implicit TLS — as the SDK's
                SMTP transport would take it.
              name: ParseSMTP
              type: func(url string) (MailRelayValue, error)
            - doc: |-
                NewSMTP is the SDK's SMTP transport to relay, which dials nothing
                until a mail is sent.
              name: NewSMTP
              type: func(relay *MailRelayValue) (MailSink, error)
            - doc: |-
                Refused reports whether err, or an error it wraps, is the spool's or
                the URL's refusal of kind: the SDK's sentinels stay in the subsystem,
                and the error keeps the fields the SDK gave it.
              name: Refused
              type: func(err error, kind MailRefusal) bool
      - doc: MailRefusal is a refusal of the mail subsystem, as the framework words it.
        name: MailRefusal
        underlying: uint8
      - doc: MailEvent is what a spool reports of a mail.
        name: MailEvent
        underlying: uint8
      - doc: MailGiveUp is why a spool gave a mail up.
        name: MailGiveUp
        underlying: uint8
      - doc: |-
          MailSpoolConfig is one mailer's outbox: the transport each attempt runs,
          the app's clock, what the framework hears of its mails, its retries, and where it
          keeps them — a queue on the database that keeps the mailer's service, a
          directory, or memory.
        name: MailSpoolConfig
        struct:
          fields:
            - doc: |-
                Transport makes one delivery attempt of msg; the spool retries a
                failure, or dead-letters the mail after its last attempt.
              name: Transport
              type: func(ctx context.Context, msg MailValue, attempt MailAttemptValue) error
            - doc: Clock is the app's clock, which the spool stamps and waits on.
              name: Clock
              type: Clock
            - doc: Observe is told each event of each mail.
              name: Observe
              type: func(e *MailEventValue)
            - doc: |-
                Annotate is what the spool keeps of a Send for its deliveries, read
                from the Send's context.
              name: Annotate
              type: func(ctx context.Context) map[string]string
            - doc: NewID mints a mail's outbox ID.
              name: NewID
              type: func() (string, error)
            - doc: |-
                Outbox is the queue the spool keeps its mails in on a database —
                the queue subsystem's, sealed —, nil for a directory or memory.
              name: Outbox
              type: Broker
            - doc: |-
                Database is the database Outbox is on, whose transaction a mail sent
                in one joins; nil for none.
              name: Database
              type: Database
            - doc: |-
                From is the sender of every mail that names none: the SDK's
                mail.Address, held as any.
              name: From
              type: MailValue
            - doc: |-
                Dir is the directory the spool keeps its own queue in; with no Outbox
                and no Dir, the outbox is in memory.
              name: Dir
              type: string
            - doc: |-
                BackoffBase is the wait after a failed attempt, doubled after each,
                up to BackoffMax.
              name: BackoffBase
              type: time.Duration
            - doc: BackoffMax bounds the wait after a failed attempt.
              name: BackoffMax
              type: time.Duration
            - doc: SendTimeout bounds one attempt.
              name: SendTimeout
              type: time.Duration
            - doc: PollInterval bounds an idle wait.
              name: PollInterval
              type: time.Duration
            - doc: |-
                MaxAttempts is how many attempts a mail gets before it is
                dead-lettered.
              name: MaxAttempts
              type: int
            - doc: |-
                MaxMessageBytes bounds one mail in the spool's own queue; zero is the
                spool's own bound.
              name: MaxMessageBytes
              type: int
            - doc: |-
                MaxAge is how long after it was queued a mail may still be retried:
                an attempt that fails later gives it up; zero sets no age.
              name: MaxAge
              type: time.Duration
            - doc: |-
                RetryPermanent retries a mail the receiving server refused for good —
                an SMTP 5xx reply — like a temporary failure, instead of giving it up
                at once.
              name: RetryPermanent
              type: bool
      - doc: |-
          MailValue is a value of the SDK's mail package as it crosses the
          contract: a mail.Message, or a sender's mail.Address, held as any — the framework's
          core names the SDK's mail types, plug names none.
        name: MailValue
        struct:
          fields:
            - doc: Value is the SDK's mail value.
              name: Value
              type: any
      - doc: |-
          MailRelayValue is an SMTP relay as the SDK's transport takes it: its
          configuration, which holds the password and is handed to NewSMTP and never
          kept or printed, and what may be shown of it.
        name: MailRelayValue
        struct:
          fields:
            - doc: Config is the SDK's SMTP configuration, held as any.
              name: Config
              type: any
            - doc: Server is where it delivers, host:port.
              name: Server
              type: string
            - doc: "TLS is its TLS mode as the URL spells it: starttls, implicit or none."
              name: TLS
              type: string
      - doc: |-
          MailAttemptValue is one delivery attempt of a mail: its outbox ID, its
          number, when the mail was queued, and what the spool kept of its Send.
        name: MailAttemptValue
        struct:
          fields:
            - doc: QueuedAt is when the mail was put in the outbox.
              name: QueuedAt
              type: time.Time
            - doc: Meta is what Annotate kept of the Send.
              name: Meta
              type: map[string]string
            - doc: ID is the mail's outbox ID.
              name: ID
              type: string
            - doc: Attempt numbers the attempt, from 1.
              name: Attempt
              type: int
      - doc: |-
          MailDeadLetterValue is a mail an outbox gave up on, read back from its dead
          letters: what the mailbox of a later run shows of it, why it was given up
          included.
        name: MailDeadLetterValue
        struct:
          fields:
            - doc: Meta is what Annotate kept of the Send.
              name: Meta
              type: map[string]string
            - doc: FailedAt is when its last attempt failed.
              name: FailedAt
              type: time.Time
            - doc: QueuedAt is when the mail was put in the outbox.
              name: QueuedAt
              type: time.Time
            - doc: Message is the mail.
              name: Message
              type: MailValue
            - doc: |-
                ID is the mail's outbox ID; empty when its record did not decode, and
                QueueID then names it.
              name: ID
              type: string
            - doc: QueueID is the outbox queue's identifier for its record.
              name: QueueID
              type: string
            - doc: Cause is its last failure's public text, "" for none.
              name: Cause
              type: string
            - doc: Attempts counts its delivery attempts.
              name: Attempts
              type: int
            - doc: |-
                GivenUp is why it was given up, read from its last failure's code and
                trail as the outbox kept them.
              name: GivenUp
              type: MailGiveUp
      - doc: |-
          MailEventValue is what a spool reports of a mail: its kind, the mail and
          its outbox ID, the attempt, when, the failure of a failed attempt, and why
          a dead letter was given up.
        name: MailEventValue
        struct:
          fields:
            - doc: Err is a failed attempt's failure.
              name: Err
              type: error
            - doc: |-
                Reply is the SMTP reply the failure carries, nil for none: the
                receiving server's own words, never shown in a public message.
              name: Reply
              type: "*textproto.Error"
            - doc: Meta is what Annotate kept of the Send.
              name: Meta
              type: map[string]string
            - doc: At is when the event happened.
              name: At
              type: time.Time
            - doc: QueuedAt is when the mail was put in the outbox.
              name: QueuedAt
              type: time.Time
            - doc: Message is the mail.
              name: Message
              type: MailValue
            - doc: ID is the mail's outbox ID.
              name: ID
              type: string
            - doc: Attempt numbers the attempt the event is about.
              name: Attempt
              type: int
            - doc: Kind is what happened.
              name: Kind
              type: MailEvent
            - doc: GivenUp is why a dead letter was given up, for MailEventDeadLettered.
              name: GivenUp
              type: MailGiveUp
      - doc: |-
          MailSpool is one mailer's outbox as the framework's core uses it: a mail put in it
          at once or under an ID the framework minted, the loop that hands each mail to the
          transport, and its dead letters.
        interface:
          methods:
            - doc: |-
                Send puts msg in the outbox — in the transaction ctx carries for its
                database, when it lives on one — and returns its outbox ID.
              in:
                - name: ctx
                  type: context.Context
                - name: msg
                  type: MailValue
              name: Send
              out:
                - type: string
                - type: error
            - doc: SendWithID puts msg in the outbox under id, minted by the framework.
              in:
                - name: ctx
                  type: context.Context
                - name: id
                  type: string
                - name: msg
                  type: MailValue
              name: SendWithID
              out:
                - type: error
            - doc: |-
                DeadLetters returns up to maxLetters of the mails earlier runs gave up
                on, oldest first, each with why.
              in:
                - name: ctx
                  type: context.Context
                - name: maxLetters
                  type: int
              name: DeadLetters
              out:
                - type: "[]MailDeadLetterValue"
                - type: error
            - doc: Run hands each mail to the transport until ctx ends.
              in:
                - name: ctx
                  type: context.Context
              name: Run
              out:
                - type: error
            - doc: Close releases the outbox.
              name: Close
              out:
                - type: error
        name: MailSpool
      - doc: |-
          MailSink is what a mailer hands a mail to: the SDK's SMTP transport,
          or its capture transport, which delivers nothing. It grows by the sibling
          below.
        interface:
          methods:
            - doc: Send delivers msg.
              in:
                - name: ctx
                  type: context.Context
                - name: msg
                  type: MailValue
              name: Send
              out:
                - type: error
        name: MailSink
      - doc: |-
          MailCaptureSource is a transport that keeps what it composed: the capture
          transport, whose last message the Studio's mailbox shows. A sibling of
          [MailSink].
        interface:
          methods:
            - doc: Composed is the last message the transport composed, nil for none.
              name: Composed
              out:
                - type: "[]byte"
        name: MailCaptureSource
      - doc: |-
          HTTPConfig is what the framework asks of the HTTP engine: where to listen, its one
          socket, its bounds, and the handler.
        name: HTTPConfig
        struct:
          fields:
            - doc: Addr is where to listen, "host:port".
              name: Addr
              type: string
            - doc: Shards is how many sockets the engine opens on Addr.
              name: Shards
              type: int
            - doc: ReadHeader, Read, Write and Idle bound a request's phases.
              name: ReadHeader
            - doc: ReadHeader, Read, Write and Idle bound a request's phases.
              name: Read
            - doc: ReadHeader, Read, Write and Idle bound a request's phases.
              name: Write
            - doc: ReadHeader, Read, Write and Idle bound a request's phases.
              name: Idle
              type: time.Duration
            - doc: MaxHeaderBytes bounds a request's header.
              name: MaxHeaderBytes
              type: int
            - doc: Handler answers every request.
              name: Handler
              type: http.Handler
      - doc: |-
          HTTPState is what the HTTP engine says of itself once it runs: the
          address it bound, and its connections.
        name: HTTPState
        struct:
          fields:
            - doc: Addr is the address the engine bound, "" before it did.
              name: Addr
              type: string
            - doc: Listeners is how many sockets it listens on.
              name: Listeners
              type: int
            - doc: |-
                Active are the connections being served, Total those accepted since
                the start, Rejected those refused.
              name: Active
              type: int64
            - name: Total
            - name: Rejected
              type: uint64
      - doc: HTTPServer is the HTTP engine the framework starts, reads and stops.
        interface:
          methods:
            - doc: Start binds the address and serves, returning once bound.
              in:
                - name: ctx
                  type: context.Context
              name: Start
              out:
                - type: error
            - doc: State says what the engine binds and serves.
              name: State
              out:
                - type: HTTPState
            - doc: Shutdown drains the engine within ctx.
              in:
                - name: ctx
                  type: context.Context
              name: Shutdown
              out:
                - type: error
        name: HTTPServer
      - doc: |-
          QueueDriverConfig is what framework/app/queue plugs into kit: how a
          consumer's queue opens, the migrations that make its table on a database
          and add the column its dead letters' trails are kept in, and how a
          delivery's handler says that no retry can help.
        name: QueueDriverConfig
        struct:
          fields:
            - doc: |-
                Open opens one queue, as cfg places it: on a database, in a
                directory, or in memory.
              name: Open
              type: func(cfg QueueConfig) (Broker, error)
            - doc: |-
                OpenSDK opens one queue as cfg places it, and hands the SDK's
                queue.Broker itself, held as any: for a subsystem that drives the
                SDK's queue on its own — the OTLP export's forwarder (issue #537) —,
                with no consumer, no sealing and no test's wrapper.
              name: OpenSDK
              type: func(cfg QueueConfig) (any, error)
            - doc: |-
                TableMigration is the migration that makes the queue table on a
                database of the dialect named, at version.
              name: TableMigration
              type: func(dialect, table string, version uint64) (MigrationValue, error)
            - doc: |-
                TrailMigration is the migration that adds the column a dead letter's
                trail is kept in to a queue table an earlier release made on a
                database of the dialect named, at version; it does nothing on a table
                that has it, or that is not there yet.
              name: TrailMigration
              type: func(dialect, table string, version uint64) (MigrationValue, error)
            - doc: |-
                DoNotRetry is err as a delivery's handler returns it when no retry
                can help: its queue dead-letters the message at once.
              name: DoNotRetry
              type: func(err error) error
            - doc: |-
                NotRetryable reports whether err, a delivery's handler's, says that no
                retry can help: what DoNotRetry returned, the product's own included.
              name: NotRetryable
              type: func(err error) bool
      - doc: |-
          QueueConfig is what the framework asks of one queue: where it lies, its policy, the
          app's clock, and for a mailer's outbox the sealing of what it keeps.
        name: QueueConfig
        struct:
          fields:
            - doc: |-
                Name names the queue's node in a refusal: the consumer's or the
                mailer's node ID.
              name: Name
              type: string
            - doc: |-
                Dir is the directory a file queue lies in; with no Database and no
                Dir, the queue is in memory.
              name: Dir
              type: string
            - doc: |-
                Database keeps the queue, nil when Dir or memory does: a scope the
                store subsystem's Database opened, whose transaction a publication in
                it joins.
              name: Database
              type: Database
            - doc: Table is the queue's table on Database.
              name: Table
              type: string
            - doc: Policy is how the queue leases, retries and bounds its messages.
              name: Policy
              type: QueuePolicyValue
            - doc: Clock is the app's clock, which the queue stamps and waits on.
              name: Clock
              type: Clock
            - doc: |-
                Seal, when set, seals every payload on its way in — a mail's, in a
                mailer's outbox on a database —, and Unseal opens one on its way out;
                MaxPayload bounds a payload before it is sealed.
              name: Seal
              type: func(ctx context.Context, payload []byte) ([]byte, error)
            - doc: |-
                Unseal is the payload a box holds, the box as it lies when it does
                not open.
              name: Unseal
              type: func(ctx context.Context, box []byte) []byte
            - doc: MaxPayload bounds a payload Seal seals.
              name: MaxPayload
              type: int
            - doc: |-
                Wrap, when a test sets it, stands in front of the queue the subsystem
                opens: a func(queue.Broker) queue.Broker of the SDK's queue, which
                the framework's core does not name. Nil in every app a product builds.
              name: Wrap
              type: any
      - doc: |-
          QueuePolicyValue is how a queue leases, retries and bounds its messages:
          the SDK's queue policy, in the framework's terms.
        name: QueuePolicyValue
        struct:
          fields:
            - doc: VisibilityTimeout is how long a delivery is leased.
              name: VisibilityTimeout
              type: time.Duration
            - doc: |-
                RetryDelay is the wait after a message's first failure, doubled after
                each, up to MaxRetryDelay.
              name: RetryDelay
              type: time.Duration
            - doc: MaxRetryDelay bounds the wait before a retry; zero leaves it unbound.
              name: MaxRetryDelay
              type: time.Duration
            - doc: |-
                MaxDeliveries is how often a message is delivered before it is
                dead-lettered.
              name: MaxDeliveries
              type: int
            - doc: MaxMessageBytes bounds a message; zero is the queue's own bound.
              name: MaxMessageBytes
              type: int
      - doc: |-
          ConsumeConfig is how a queue's consumer runs: its handler, how long it
          waits idle, how many messages it handles at once and takes at a time, how
          it stops, whether it renews a running handler's lease, and when a handler
          asked to be retried.
        name: ConsumeConfig
        struct:
          fields:
            - doc: |-
                Handler handles one delivery: nil acknowledges it, an error has it
                retried or, through DoNotRetry, dead-lettered at once. Every handler
                the framework runs tolerates a redelivery.
              name: Handler
              type: func(ctx context.Context, d DeliveryValue) error
            - doc: PollInterval bounds an idle wait.
              name: PollInterval
              type: time.Duration
            - doc: Parallelism is how many deliveries are handled at once.
              name: Parallelism
              type: int
            - doc: BatchSize is how many messages the consumer takes at a time.
              name: BatchSize
              type: int
            - doc: |-
                DrainTimeout is how long the handler running when ctx ends may still
                run before its context is cancelled; zero cancels it at once.
              name: DrainTimeout
              type: time.Duration
            - doc: |-
                SettleTimeout bounds each outcome sent once ctx ended, and each lease
                renewal; zero is the queue's own bound.
              name: SettleTimeout
              type: time.Duration
            - doc: |-
                AutoExtend renews the lease of the message a handler runs for as long
                as it runs.
              name: AutoExtend
              type: bool
            - doc: |-
                RetryIn reads, from the error a delivery's handler returned, the delay
                it asked to be retried after: its queue hands the message back with
                that delay, the delivery counted. Nil, or false, keeps the queue's own
                retry delay.
              name: RetryIn
              type: func(err error) (delay time.Duration, asked bool)
      - doc: |-
          MessageValue is one message of a queue: its identifier, its payload as
          the framework encoded it, and when it was published.
        name: MessageValue
        struct:
          fields:
            - doc: EnqueuedAt is when the message was published.
              name: EnqueuedAt
              type: time.Time
            - doc: ID identifies the message in its queue.
              name: ID
              type: string
            - doc: Payload is the message as the framework encoded it.
              name: Payload
              type: "[]byte"
      - doc: |-
          DeliveryValue is one delivery of a message: the message, and how many
          times it has been delivered, this one included.
        name: DeliveryValue
        struct:
          fields:
            - doc: Message is what is delivered.
              name: Message
              type: MessageValue
            - doc: Deliveries counts the deliveries, this one included.
              name: Deliveries
              type: int
      - doc: |-
          LiveMessageValue is a message waiting in its queue, as it lies: when it
          is next visible, how many times it was delivered, and whether a consumer
          holds it.
        name: LiveMessageValue
        struct:
          fields:
            - doc: VisibleAt is when the message is next delivered.
              name: VisibleAt
              type: time.Time
            - doc: Message is the message.
              name: Message
              type: MessageValue
            - doc: Deliveries counts its deliveries so far.
              name: Deliveries
              type: int
            - doc: Leased reports whether a consumer holds it.
              name: Leased
              type: bool
      - doc: |-
          DeadLetterValue is a message its queue gave up on: when, why, and how
          many times it was delivered.
        name: DeadLetterValue
        struct:
          fields:
            - doc: FailedAt is when its last attempt failed.
              name: FailedAt
              type: time.Time
            - doc: Reason is the failure's identifier.
              name: Reason
              type: string
            - doc: Cause is the failure's public text, "" for none.
              name: Cause
              type: string
            - doc: Message is the message, unmodified.
              name: Message
              type: MessageValue
            - doc: |-
                Trail is the codes the failure gathered as it was wrapped, oldest
                first, nil for none.
              name: Trail
              type: "[]uint32"
            - doc: Code is the failure's error code, 0 for none.
              name: Code
              type: uint32
            - doc: Deliveries counts its deliveries.
              name: Deliveries
              type: int
      - doc: |-
          Broker is one queue as the framework's core uses it: a publication, the consumer
          that delivers it, and its dead letters. It grows by the siblings below.
        interface:
          methods:
            - doc: |-
                Publish puts payload in the queue: in the transaction ctx carries for
                its database, when it lives on one.
              in:
                - name: ctx
                  type: context.Context
                - name: payload
                  type: "[]byte"
              name: Publish
              out:
                - type: error
            - doc: |-
                Consume delivers the queue's messages to cfg's handler until ctx ends
                or the queue's storage fails.
              in:
                - name: ctx
                  type: context.Context
                - name: cfg
                  type: ConsumeConfig
              name: Consume
              out:
                - type: error
            - doc: |-
                DeadLetters are up to maxLetters of the queue's dead letters, oldest
                first.
              in:
                - name: ctx
                  type: context.Context
                - name: maxLetters
                  type: int
              name: DeadLetters
              out:
                - type: "[]DeadLetterValue"
                - type: error
        name: Broker
      - doc: |-
          MessageMover is a Broker whose messages a data copy reads and writes as
          they lie, without a lease, with their counts and their instants. A
          sibling of [Broker].
        interface:
          methods:
            - doc: |-
                Messages are up to maxMessages live messages after the identifier
                after, "" for the first, in their queue's order.
              in:
                - name: ctx
                  type: context.Context
                - name: after
                  type: string
                - name: maxMessages
                  type: int
              name: Messages
              out:
                - type: "[]LiveMessageValue"
                - type: error
            - doc: |-
                PutMessage writes live under an identifier of the queue's own, and
                returns it.
              in:
                - name: ctx
                  type: context.Context
                - name: live
                  type: LiveMessageValue
              name: PutMessage
              out:
                - type: string
                - type: error
            - doc: |-
                PutDeadLetter writes dead, with its cause, under an identifier of the
                queue's own, and returns it.
              in:
                - name: ctx
                  type: context.Context
                - name: dead
                  type: DeadLetterValue
              name: PutDeadLetter
              out:
                - type: string
                - type: error
        name: MessageMover
      - doc: |-
          LaterPublisher is a Broker that publishes a message for later, and once
          per key. A sibling of [Broker].
        interface:
          methods:
            - doc: |-
                PublishAt puts payload in the queue, received by no consumer before
                at: in the transaction ctx carries for its database, when it lives on
                one.
              in:
                - name: ctx
                  type: context.Context
                - name: payload
                  type: "[]byte"
                - name: at
                  type: time.Time
              name: PublishAt
              out:
                - type: error
            - doc: |-
                PublishOnce puts payload in the queue unless a publication under key
                was made within window, and reports whether it did.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
                - name: payload
                  type: "[]byte"
                - name: window
                  type: time.Duration
              name: PublishOnce
              out:
                - name: published
                  type: bool
                - name: err
                  type: error
        name: LaterPublisher
      - doc: |-
          Clock is the app's clock as a queue stamps and waits on it: the framework's core
          hands the one its app runs on, a test's manual clock included.
        interface:
          methods:
            - doc: Now is the clock's instant.
              name: Now
              out:
                - type: time.Time
            - doc: Since is how long ago t was, on the clock.
              in:
                - name: t
                  type: time.Time
              name: Since
              out:
                - type: time.Duration
            - doc: After is a channel that receives the clock's instant once d passed.
              in:
                - name: d
                  type: time.Duration
              name: After
              out:
                - type: <-chan time.Time
            - doc: NewTimer is a timer that fires once d passed.
              in:
                - name: d
                  type: time.Duration
              name: NewTimer
              out:
                - type: Timer
            - doc: NewTicker is a ticker that fires every d.
              in:
                - name: d
                  type: time.Duration
              name: NewTicker
              out:
                - type: Ticker
            - doc: Sleep waits until d passed.
              in:
                - name: d
                  type: time.Duration
              name: Sleep
        name: Clock
      - doc: Timer is a timer of a [Clock].
        interface:
          methods:
            - doc: C receives the clock's instant when the timer fires.
              name: C
              out:
                - type: <-chan time.Time
            - doc: Stop stops the timer, and reports whether it had not fired.
              name: Stop
              out:
                - type: bool
            - doc: |-
                Reset makes the timer fire once d passed, and reports whether it had
                not fired.
              in:
                - name: d
                  type: time.Duration
              name: Reset
              out:
                - type: bool
        name: Timer
      - doc: Ticker is a ticker of a [Clock].
        interface:
          methods:
            - doc: C receives the clock's instant at each tick.
              name: C
              out:
                - type: <-chan time.Time
            - doc: Stop stops the ticker.
              name: Stop
            - doc: Reset makes the ticker fire every d.
              in:
                - name: d
                  type: time.Duration
              name: Reset
        name: Ticker
      - doc: |-
          StoreDriverConfig is what framework/app/store plugs into kit: how a
          store's engine opens, how the framework opens its scope on a database, and the
          migration that makes one of the framework's tables.
        name: StoreDriverConfig
        struct:
          fields:
            - doc: |-
                Open opens the engine of one store, as cfg places it: loaded from the
                data directory, empty in memory, or on a database.
              name: Open
              type: func(cfg StoreConfig) (StoreEngine, error)
            - doc: Database opens the framework's scope on one database's pool.
              name: Database
              type: func(cfg DatabaseConfig) (Database, error)
            - doc: |-
                TableMigration is the migration that makes the table t on a database
                of the dialect named, at version.
              name: TableMigration
              type: func(dialect string, t TableSpec, version uint64) (MigrationValue, error)
            - doc: |-
                FormerTables are the tables of plan still under a former name on db —
                its former version table among them —, read from the database's
                catalogue, sorted: what RenameTables would move; none once moved.
              name: FormerTables
              type: func(ctx context.Context, db Database, plan RenameSpec) ([]string, error)
            - doc: |-
                RenameTables moves the tables of plan to their present names on db
                (ADR 0180 step 5), under the migration lock of plan's former version
                table and in the transaction that records the move there, and returns
                the tables it moved; none when nothing was left under a former name.
                A table whose present name is taken too is a [RefusalRenameTarget],
                and nothing moves.
              name: RenameTables
              type: func(ctx context.Context, db Database, plan RenameSpec) ([]string, error)
      - doc: |-
          RenameSpec is the framework's tables on a database moved to their present
          names (ADR 0180 step 5): each table — with the tables the document store
          derives from it, <table>___ix and <table>___vs —, the history of the
          former version table taken by the present one, and the names that
          history gives the tables' migrations.
        name: RenameSpec
        struct:
          fields:
            - doc: |-
                FormerVersions is the version table the framework's set had: the move
                holds its migration lock, is recorded there, and drops it once the
                history is the present table's.
              name: FormerVersions
              type: string
            - doc: Versions is the version table the framework's set has now.
              name: Versions
              type: string
            - doc: Name labels the move in FormerVersions, at Version.
              name: Name
              type: string
            - doc: |-
                Tables are the tables moved, each from its former name to its present
                one.
              name: Tables
              type: "[]RenameValue"
            - doc: |-
                Labels are the names of the tables' migrations in the history, each
                from what the former release recorded to what this one says.
              name: Labels
              type: "[]RenameValue"
            - doc: |-
                Version is the move's version in FormerVersions: above every version
                the framework gives.
              name: Version
              type: uint64
      - doc: |-
          RenameValue is one name replaced by another: a table's, or a migration's
          name in a version table.
        name: RenameValue
        struct:
          fields:
            - doc: From is the former name.
              name: From
              type: string
            - doc: To is the present one.
              name: To
              type: string
      - doc: |-
          DocumentValue is a record as a store's engine holds it (ADR 0179 §2):
          its JSON as it rests, byte for byte what the framework encodes, and the entity
          once decoded, kept beside it so that a read, an index or a privacy
          walk does not decode it twice.
        name: DocumentValue
        struct:
          fields:
            - doc: JSON is the record as it rests.
              name: JSON
              type: json.RawMessage
            - doc: |-
                Value is the entity decoded from JSON, nil until something decoded it;
                the store's typed facade asserts it to its type.
              name: Value
              type: any
      - doc: |-
          EntryValue is a record as it rests, with its key: what an engine lists
          for a reader that cannot key a record itself.
        name: EntryValue
        struct:
          fields:
            - doc: Key is the record's key.
              name: Key
              type: string
            - doc: JSON is the record as it rests.
              name: JSON
              type: json.RawMessage
      - doc: WriteMode says what a write expects to find under the document's key.
        name: WriteMode
        underlying: int
      - doc: |-
          IndexSpec declares one secondary index of a store, over documents: the
          product's index function on its type, wrapped once at the declaration.
        name: IndexSpec
        struct:
          fields:
            - doc: Name reads the index, and names it in a refusal.
              name: Name
              type: string
            - doc: Unique refuses a write that would file two documents under one key.
              name: Unique
              type: bool
            - doc: Keys are a document's keys in the index; an empty key is not indexed.
              name: Keys
              type: func(d DocumentValue) []string
      - doc: |-
          StoreConfig is what the framework asks of one store's engine: the store, its key and
          its indexes over documents, where it rests and what it keeps, and how its
          writes take part in the framework's transactions.
        name: StoreConfig
        struct:
          fields:
            - doc: Name is the store's, as a log line and a rollback name it.
              name: Name
              type: string
            - doc: |-
                Key is a document's key: the product's key function on its type,
                wrapped once at the declaration. It reads the document's Value, which
                the engine decodes first unless KeyAtRest gives the key.
              name: Key
              type: func(d DocumentValue) string
            - doc: |-
                KeyAtRest, when set, gives the key of a record as it rests, without
                decoding it; false when it cannot.
              name: KeyAtRest
              type: func(raw json.RawMessage) (string, bool)
            - doc: |-
                Decode is the entity a document's JSON holds, which the engine keeps
                as the document's Value.
              name: Decode
              type: func(raw json.RawMessage) (any, error)
            - doc: Indexes are the store's secondary indexes.
              name: Indexes
              type: "[]IndexSpec"
            - doc: |-
                Data is the data directory the store rests in — the SDK's writable
                file system, which the engine asserts — and Path its snapshot there;
                a nil Data and a nil Database keep the store in memory.
              name: Data
              type: fs.FS
            - doc: Path is the store's snapshot in Data.
              name: Path
              type: string
            - doc: |-
                Database keeps the store, nil when the data directory or memory does:
                a scope the store subsystem's Database opened.
              name: Database
              type: Database
            - doc: Table is the store's table on Database.
              name: Table
              type: string
            - doc: |-
                IndexKey is the key a table's index keys are hashed under, nil for
                none: an index key reaches the table as its keyed hash.
              name: IndexKey
              type: func(index, key string) []byte
            - doc: |-
                Call is the context one call of the engine on Database runs with: on
                the transaction ctx carries for it, else on the pool, within the
                database's timeout; done ends it.
              name: Call
              type: func(ctx context.Context, write bool) (call context.Context, done func(), err error)
            - doc: |-
                Versions is how many former versions of each record the engine keeps,
                none when zero; Clock stamps them.
              name: Versions
              type: int
            - doc: Clock is the app's clock, which stamps a version.
              name: Clock
              type: func() time.Time
            - doc: |-
                Held reports whether a record's versions are held, and no write may
                prune them: asked with the write's context, on a database inside its
                transaction.
              name: Held
              type: func(ctx context.Context, key string) bool
            - doc: Stamp is what a write under ctx says about the version it makes.
              name: Stamp
              type: func(ctx context.Context) StampValue
            - doc: |-
                Transaction is the framework's transaction, which the engine's writes take part
                in.
              name: Transaction
              type: Transaction
      - doc: |-
          StampValue is what a write says about the version it makes: who made it
          and which command, kept with the version; and whether it changes the
          document in place, without a version of its own.
        name: StampValue
        struct:
          fields:
            - doc: Meta is kept with the version the write makes.
              name: Meta
              type: map[string]string
            - doc: InPlace makes the write change the document without making a version.
              name: InPlace
              type: bool
      - doc: |-
          DatabaseConfig is one database a product declares, as the framework opened it: its
          pool, its dialect, its tuning and the timeout of each call.
        name: DatabaseConfig
        struct:
          fields:
            - doc: Name is the database's, as the product declared it.
              name: Name
              type: string
            - doc: DB is the pool app.Engine opened.
              name: DB
              type: "*sql.DB"
            - doc: |-
                Dialect is the engine's SQL dialect: "postgres", "mysql" or
                "sqlite".
              name: Dialect
              type: string
            - doc: Timeout bounds each call the framework makes on the database.
              name: Timeout
              type: time.Duration
            - doc: MaxOpen and MaxIdle bound the pool's connections.
              name: MaxOpen
            - doc: MaxOpen and MaxIdle bound the pool's connections.
              name: MaxIdle
              type: int
            - doc: MaxLifetime and MaxIdleTime bound a connection's life.
              name: MaxLifetime
            - doc: MaxLifetime and MaxIdleTime bound a connection's life.
              name: MaxIdleTime
              type: time.Duration
            - doc: CheckTimeout bounds a check of the database.
              name: CheckTimeout
              type: time.Duration
      - doc: |-
          TableSpec is one of the framework's tables on a database, as the store subsystem's
          migration makes it: a store's, or a store's versions beside the store's
          table VersionsOf. A consumer's queue's table is the queue subsystem's
          (QueueDriverConfig's TableMigration).
        name: TableSpec
        struct:
          fields:
            - doc: Name is the table's.
              name: Name
              type: string
            - doc: |-
                VersionsOf is, for a store's versions, the store's table, from which
                the versions' table is named.
              name: VersionsOf
              type: string
      - doc: |-
          MigrationValue is one versioned change of a database's schema and its
          reversal, as the core hands it to the store subsystem: a product's
          app.Migration, or one of the framework's own, its steps on the standard library's
          types.
        name: MigrationValue
        struct:
          fields:
            - doc: "Version orders the migration in its set: non-zero and unique."
              name: Version
              type: uint64
            - doc: Name labels it in the version table.
              name: Name
              type: string
            - doc: Up applies the change.
              name: Up
              type: Step
            - doc: Down reverses it.
              name: Down
              type: Step
      - doc: Step is one direction of a migration, run on ex.
        name: Step
        underlying: func(ctx context.Context, ex Executor) error
      - doc: |-
          VersionValue is one version of a record: its number, when the write
          that made it ran, what that write said about it, and the record as it
          held it.
        name: VersionValue
        struct:
          fields:
            - doc: Number counts a record's versions from 1.
              name: Number
              type: uint64
            - doc: At is when the write that made the version ran, in UTC.
              name: At
              type: time.Time
            - doc: "Meta is what the write said about it: who made it, which command."
              name: Meta
              type: map[string]string
            - doc: JSON is the record as the version holds it.
              name: JSON
              type: json.RawMessage
      - doc: |-
          VersionWeightValue is what a store keeps beyond the records it holds:
          its former versions and its trash, counted and weighed.
        name: VersionWeightValue
        struct:
          fields:
            - doc: Former is how many former versions the store keeps.
              name: Former
              type: int
            - doc: Trashed is how many records are in the trash.
              name: Trashed
              type: int
            - doc: Bytes is what the former versions and the trashed records weigh.
              name: Bytes
              type: int64
      - doc: |-
          TombstoneValue is one record in a store's trash: its key, and when it was
          trashed.
        name: TombstoneValue
        struct:
          fields:
            - doc: Key is the trashed record's key.
              name: Key
              type: string
            - doc: At is when the record was trashed, in UTC.
              name: At
              type: time.Time
      - doc: |-
          Database is the framework's scope on one database (ADR 0179 §2): the transactions
          app.Transact opens on it, their savepoints, and the functions held until
          their end. The core knows a database only through it; the store package
          implements it over the SDK's sql. It grows by the siblings below.
        interface:
          methods:
            - doc: |-
                Transact runs fn in a transaction of the database, or in a savepoint
                of the one ctx carries for it: nil commits or releases, an error
                rolls back.
              in:
                - name: ctx
                  type: context.Context
                - name: fn
                  type: func(ctx context.Context) error
              name: Transact
              out:
                - type: error
            - doc: |-
                InTransaction reports whether ctx carries a transaction of this
                database.
              in:
                - name: ctx
                  type: context.Context
              name: InTransaction
              out:
                - type: bool
            - doc: |-
                Defer holds fn until the transaction ctx carries for the database
                commits, and reports true; outside one it holds nothing and reports
                false.
              in:
                - name: ctx
                  type: context.Context
                - name: fn
                  type: func()
              name: Defer
              out:
                - type: bool
            - doc: |-
                OnAbort holds fn until the work of the scope ctx carries for the
                database is undone, and reports true; outside one it holds nothing
                and reports false.
              in:
                - name: ctx
                  type: context.Context
                - name: fn
                  type: func(ctx context.Context)
              name: OnAbort
              out:
                - type: bool
        name: Database
      - doc: |-
          Checker is a Database that says whether it answers. A sibling of
          [Database].
        interface:
          methods:
            - doc: Check asks the database whether it answers, within its check timeout.
              in:
                - name: ctx
                  type: context.Context
              name: Check
              out:
                - type: error
        name: Checker
      - doc: |-
          MigratorProvider is a Database that runs a set of migrations under a version
          table of its own, and so a lock of its own. A sibling of [Database].
        interface:
          methods:
            - doc: Migrator is the set ms, under the version table table.
              in:
                - name: table
                  type: string
                - name: ms
                  type: "[]MigrationValue"
              name: Migrator
              out:
                - type: Migrator
                - type: error
        name: MigratorProvider
      - doc: Migrator is one set of migrations on a database.
        interface:
          methods:
            - doc: Plan is the set's pending migrations, oldest first, applying nothing.
              in:
                - name: ctx
                  type: context.Context
              name: Plan
              out:
                - type: "[]MigrationValue"
                - type: error
            - doc: Up applies every pending migration, in order.
              in:
                - name: ctx
                  type: context.Context
              name: Up
              out:
                - type: error
            - doc: Down reverses the applied migrations above version, newest first.
              in:
                - name: ctx
                  type: context.Context
                - name: version
                  type: uint64
              name: Down
              out:
                - type: error
        name: Migrator
      - doc: |-
          Executor is what a migration's step runs its statements on: the
          transaction its migration runs in.
        interface:
          methods:
            - doc: ExecContext runs a statement that returns no rows.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: ExecContext
              out:
                - type: sql.Result
                - type: error
              variadic: true
            - doc: QueryContext runs a query that returns rows.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: QueryContext
              out:
                - type: "*sql.Rows"
                - type: error
              variadic: true
            - doc: QueryRowContext runs a query that returns at most one row.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: QueryRowContext
              out:
                - type: "*sql.Row"
              variadic: true
        name: Executor
      - doc: |-
          Transaction is the framework's transaction as a store's engine takes part in it
          (ADR 0139, ADR 0178): the core implements it, an engine calls it with its
          caller's context.
        interface:
          methods:
            - doc: |-
                Local reports whether ctx runs in a transaction that holds the data's
                writer turn: a write in the data directory or in memory then records
                what it replaces.
              in:
                - name: ctx
                  type: context.Context
              name: Local
              out:
                - type: bool
            - doc: |-
                Undo keeps restore, which a rollback of the transaction ctx carries
                runs; nothing outside one. store names the store in a log line.
              in:
                - name: ctx
                  type: context.Context
                - name: store
                  type: string
                - name: restore
                  type: func(ctx context.Context) error
              name: Undo
            - doc: |-
                AtCommit holds fn until the transaction ctx carries commits, and
                reports whether it did: false outside one, where the caller runs it
                now.
              in:
                - name: ctx
                  type: context.Context
                - name: fn
                  type: func()
              name: AtCommit
              out:
                - type: bool
            - doc: |-
                Retell keeps fn, which announces a write on a database again when the
                transaction ctx carries rolls it back.
              in:
                - name: ctx
                  type: context.Context
                - name: fn
                  type: func()
              name: Retell
        name: Transaction
      - doc: |-
          StoreEngine is what a store runs on, over documents (ADR 0179 §2): the
          non-generic engine under Store[T]. Its refusals are the framework's ([Refusal]): the
          engine translates the SDK's before they reach the core. Every call takes
          the caller's context, which carries the transaction the call joins. It
          grows by the sibling interfaces below, never by a method (the SDK's ADR
          0039).
        interface:
          methods:
            - doc: Get returns the document under key.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Get
              out:
                - type: DocumentValue
                - type: error
            - doc: List returns every document, in key order.
              in:
                - name: ctx
                  type: context.Context
              name: List
              out:
                - type: "[]DocumentValue"
                - type: error
            - doc: Filter returns the documents keep accepts, in key order.
              in:
                - name: ctx
                  type: context.Context
                - name: keep
                  type: func(d DocumentValue) bool
              name: Filter
              out:
                - type: "[]DocumentValue"
                - type: error
            - doc: Lookup returns the document a unique index files under key.
              in:
                - name: ctx
                  type: context.Context
                - name: index
                - name: key
                  type: string
              name: Lookup
              out:
                - type: DocumentValue
                - type: error
            - doc: Find returns the documents an index files under key, in key order.
              in:
                - name: ctx
                  type: context.Context
                - name: index
                - name: key
                  type: string
              name: Find
              out:
                - type: "[]DocumentValue"
                - type: error
            - doc: Count says how many documents the store holds.
              in:
                - name: ctx
                  type: context.Context
              name: Count
              out:
                - type: int
                - type: error
            - doc: Entries returns up to limit documents as they rest, in key order.
              in:
                - name: ctx
                  type: context.Context
                - name: limit
                  type: int
              name: Entries
              out:
                - type: "[]json.RawMessage"
                - type: error
            - doc: |-
                Write stores d as mode says. The document and its index keys are kept
                together, or neither.
              in:
                - name: ctx
                  type: context.Context
                - name: d
                  type: DocumentValue
                - name: mode
                  type: WriteMode
              name: Write
              out:
                - type: error
            - doc: |-
                Update applies fn to the document under key and stores the result,
                atomically with respect to every other write of the store.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
                - name: fn
                  type: func(d *DocumentValue) error
              name: Update
              out:
                - type: DocumentValue
                - type: error
            - doc: Delete removes the document under key.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Delete
              out:
                - type: error
            - doc: |-
                Watch registers the functions told the key of every document written
                and deleted, once the write stands.
              in:
                - name: onWrite
                - name: onDelete
                  type: func(key string)
              name: Watch
            - doc: Close releases the engine.
              name: Close
              out:
                - type: error
        name: StoreEngine
      - doc: |-
          Folder is an engine that keeps what its writes left beside its data, and
          can fold it in now. A sibling of [StoreEngine].
        interface:
          methods:
            - doc: Fold rewrites the store's data with only what it holds now.
              in:
                - name: ctx
                  type: context.Context
              name: Fold
              out:
                - type: error
        name: Folder
      - doc: |-
          Keyser is an engine that lists the keys of its documents, in key order,
          above after, without reading a document. A sibling of [StoreEngine].
        interface:
          methods:
            - doc: Keys yields the keys above after, in order, then its failure if any.
              in:
                - name: ctx
                  type: context.Context
                - name: after
                  type: string
              name: Keys
              out:
                - type: iter.Seq2[string, error]
        name: Keyser
      - doc: |-
          EntrySource is an engine that lists its records as they rest with their keys:
          what a sealing store reads its records by. A sibling of [StoreEngine].
        interface:
          methods:
            - doc: KeyedEntries returns up to limit records as they rest, in key order.
              in:
                - name: ctx
                  type: context.Context
                - name: limit
                  type: int
              name: KeyedEntries
              out:
                - type: "[]EntryValue"
                - type: error
        name: EntrySource
      - doc: |-
          Reindexer is an engine on a database that files its index rows again. A
          sibling of [StoreEngine].
        interface:
          methods:
            - doc: Reindex files every record's index rows again.
              in:
                - name: ctx
                  type: context.Context
              name: Reindex
              out:
                - type: error
        name: Reindexer
      - doc: |-
          VersionKeeper is an engine that keeps its records' versions. A sibling of
          [StoreEngine].
        interface:
          methods:
            - doc: |-
                StoredVersions are the versions of the record under key, newest
                first, the current one first.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: StoredVersions
              out:
                - type: "[]VersionValue"
                - type: error
            - doc: |-
                RewriteVersions rewrites the former versions of the record under key
                as fn returns them: fn may drop a version or change what one holds,
                never add or renumber one.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
                - name: fn
                  type: func(vs []VersionValue) ([]VersionValue, error)
              name: RewriteVersions
              out:
                - type: error
        name: VersionKeeper
      - doc: |-
          VersionWeighter is an engine that says what its records' versions weigh.
          A sibling of [StoreEngine].
        interface:
          methods:
            - doc: VersionWeight is what the store's versions and trash weigh.
              in:
                - name: ctx
                  type: context.Context
              name: VersionWeight
              out:
                - type: VersionWeightValue
                - type: error
        name: VersionWeighter
      - doc: Trasher is an engine that keeps a trash. A sibling of [StoreEngine].
        interface:
          methods:
            - doc: |-
                Trash moves the record under key to the trash: gone from every read,
                its index keys freed, its versions kept.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Trash
              out:
                - type: error
            - doc: Untrash brings the record trashed under key back as it was.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Untrash
              out:
                - type: error
            - doc: |-
                Purge empties the trash of the record trashed under key, its versions
                with it.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Purge
              out:
                - type: error
            - doc: Tombstones are every record in the trash, in key order.
              in:
                - name: ctx
                  type: context.Context
              name: Tombstones
              out:
                - type: "[]TombstoneValue"
                - type: error
        name: Trasher
      - doc: |-
          DocumentSource is an engine that says the document store it runs on: itself,
          or the one what it wraps runs on. A data copy reads and writes a store
          through it (ADR 0178 C7). A sibling of [StoreEngine].
        interface:
          methods:
            - doc: |-
                Documents is the document store the engine runs on, and whether there
                is one.
              name: Documents
              out:
                - type: Documents
                - type: bool
        name: DocumentSource
      - doc: Documents is a store's documents as they rest, as a data copy reads them.
        interface:
          methods:
            - doc: KeyList yields every key the store holds, in key order.
              in:
                - name: ctx
                  type: context.Context
              name: KeyList
              out:
                - type: iter.Seq2[string, error]
            - doc: |-
                TombstoneList is the trash, in key order: none when the store keeps
                no versions.
              in:
                - name: ctx
                  type: context.Context
              name: TombstoneList
              out:
                - type: "[]TombstoneValue"
                - type: error
            - doc: VersionList is the versions of the document key, newest first.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: VersionList
              out:
                - type: "[]VersionValue"
                - type: error
            - doc: Current is the document key as the store keeps it.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Current
              out:
                - type: json.RawMessage
                - type: error
            - doc: KeepsVersions reports whether the store keeps versions.
              name: KeepsVersions
              out:
                - type: bool
        name: Documents
      - doc: |-
          DocumentSink is a store's documents on the database a data copy writes. A
          sibling of [Documents].
        interface:
          methods:
            - doc: |-
                PutDocument writes the document key with its versions and its trash
                as they are given.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
                - name: versions
                  type: "[]VersionValue"
                - name: trashedAt
                  type: time.Time
              name: PutDocument
              out:
                - type: error
            - doc: |-
                InsertRaw writes a document of a store that keeps no versions, as it
                rests.
              in:
                - name: ctx
                  type: context.Context
                - name: raw
                  type: json.RawMessage
              name: InsertRaw
              out:
                - type: error
        name: DocumentSink
      - doc: |-
          Refusal is a kind of refusal of a store's engine or a database, as the framework
          words it.
        name: Refusal
        underlying: uint8
      - doc: |-
          RefusalError is an engine's refusal of one kind: the error it met, and
          the kind the framework words it by.
        methods:
          - doc: Error is what the engine met's.
            name: Error
            out:
              - type: string
            recv: pointer
          - doc: Unwrap is what the engine met.
            name: Unwrap
            out:
              - type: error
            recv: pointer
        name: RefusalError
        struct:
          fields:
            - doc: Err is what the engine met.
              name: Err
              type: error
            - doc: Kind is how the framework words it.
              name: Kind
              type: Refusal
      - doc: |-
          WorkflowDriverConfig is what framework/app/workflow plugs into kit: how a
          workflow's engine opens, and how the framework tells the engine's failures apart.
        name: WorkflowDriverConfig
        struct:
          fields:
            - doc: |-
                Open opens the engine of one workflow, as cfg declares it: it reads
                the journal and every entity of the store once.
              name: Open
              type: func(ctx context.Context, cfg *WorkflowConfig) (WorkflowEngine, error)
            - doc: |-
                Failed reports whether err, or an error it wraps, is the engine's
                failure of kind: the SDK's sentinels stay in the subsystem, and the
                error keeps the fields the engine gave it.
              name: Failed
              type: func(err error, kind WorkflowFailure) bool
      - doc: WorkflowTrigger is what fires a transition.
        name: WorkflowTrigger
        underlying: uint8
      - doc: WorkflowWake is why a run of a workflow's loop started.
        name: WorkflowWake
        underlying: uint8
      - doc: WorkflowLoopEvent is what a workflow's loop reports.
        name: WorkflowLoopEvent
        underlying: uint8
      - doc: WorkflowFailure is a failure of a workflow's engine, as the framework words it.
        name: WorkflowFailure
        underlying: uint8
      - doc: |-
          WorkflowConfig is one workflow as its engine runs it: its states and
          transitions, its hooks, the store and the journal it runs over, and how
          the app's loop, clock and spans see it.
        name: WorkflowConfig
        struct:
          fields:
            - doc: Store is the workflow's entities, as the engine reads and writes them.
              name: Store
              type: WorkflowStore
            - doc: |-
                Journal keeps what the engine knows of each entity — its state, since
                when, its latest transitions —; nil keeps it in memory alone.
              name: Journal
              type: WorkflowJournal
            - doc: Clock is the app's clock, which the engine stamps and waits on.
              name: Clock
              type: Clock
            - doc: |-
                Actor names, from the context of a transition someone fired, who
                fired it.
              name: Actor
              type: func(ctx context.Context) string
            - doc: |-
                Observe brackets each transition the loop fires: the context it runs
                with, and the function told how it ended.
              name: Observe
              type: func(ctx context.Context, f WorkflowFiringValue) (context.Context, func(err error))
            - doc: |-
                Report receives what the engine reports and no caller's return value
                carries: an OnTransition hook that failed, a panic, a journal's write
                that failed.
              name: Report
              type: func(ctx context.Context, err error)
            - doc: OnLoop is told each run of the loop, and each wait.
              name: OnLoop
              type: func(e WorkflowLoopEventValue)
            - doc: Initial is the state Start enters an entity in.
              name: Initial
              type: string
            - doc: Transitions are the declared transitions, in declaration order.
              name: Transitions
              type: "[]TransitionSpec"
            - doc: |-
                OnEnter are the hooks run as an entity enters a state, in
                declaration order.
              name: OnEnter
              type: "[]EnterHookSpec"
            - doc: |-
                OnTransition are the hooks run after every stored transition, in
                declaration order.
              name: OnTransition
              type: "[]func(ctx context.Context, c WorkflowChangeValue) error"
            - doc: MinGap is the least a wake for a due transition waits after a run.
              name: MinGap
              type: time.Duration
            - doc: |-
                BackoffBase is the wait after a run that failed, doubled after each,
                up to BackoffMax.
              name: BackoffBase
              type: time.Duration
            - doc: BackoffMax bounds the wait after a run that failed.
              name: BackoffMax
              type: time.Duration
            - doc: MaxHistory caps the transitions remembered per entity.
              name: MaxHistory
              type: int
      - doc: |-
          TransitionSpec declares one transition: an event's, a timer's after a
          delay or at an instant the entity carries, or a guard's.
        name: TransitionSpec
        struct:
          fields:
            - doc: |-
                Instant is when a deadline's transition comes due, false for no
                instant for now; set for WorkflowTriggerDeadline.
              name: Instant
              type: func(e WorkflowEntityValue) (time.Time, bool)
            - doc: |-
                Guard is the condition a guard's transition waits for; set for
                WorkflowTriggerGuard.
              name: Guard
              type: func(e WorkflowEntityValue) bool
            - doc: Event names the transition.
              name: Event
              type: string
            - doc: From is the state it leaves.
              name: From
              type: string
            - doc: To is the state it enters.
              name: To
              type: string
            - doc: Delay is how long a delay's transition waits in From.
              name: Delay
              type: time.Duration
            - doc: "Trigger is what fires it: an event, a delay, a deadline or a guard."
              name: Trigger
              type: WorkflowTrigger
      - doc: |-
          EnterHookSpec is one hook run as an entity enters a state, before it is
          stored: an error cancels the transition.
        name: EnterHookSpec
        struct:
          fields:
            - doc: |-
                Fn runs the hook; it may change the entity, not its state nor its
                key.
              name: Fn
              type: func(ctx context.Context, e *WorkflowEntityValue) error
            - doc: State is the state whose entering runs it.
              name: State
              type: string
      - doc: |-
          WorkflowEntityValue is one entity as a workflow's engine holds it: the
          product's, kept as any — the workflow's typed facade asserts it to its
          type —, and its state as the facade spells it, which the engine reads and
          sets.
        name: WorkflowEntityValue
        struct:
          fields:
            - doc: Value is the product's entity.
              name: Value
              type: any
            - doc: State is the entity's state, spelled.
              name: State
              type: string
      - doc: |-
          WorkflowChangeValue is one stored transition: the entity as stored after
          it, the states it left and entered, what fired it, who and when.
        name: WorkflowChangeValue
        struct:
          fields:
            - doc: At is when it happened.
              name: At
              type: time.Time
            - doc: Entity is the entity, as stored after the transition.
              name: Entity
              type: WorkflowEntityValue
            - doc: Key is the entity's key.
              name: Key
              type: string
            - doc: Event is the transition's name; WorkflowCreateEvent for Start.
              name: Event
              type: string
            - doc: From is the state left, "" on creation.
              name: From
              type: string
            - doc: To is the state entered.
              name: To
              type: string
            - doc: Actor is who fired it, "" for the loop.
              name: Actor
              type: string
            - doc: Trigger is what fired it.
              name: Trigger
              type: WorkflowTrigger
      - doc: |-
          WorkflowFiringValue is one transition the loop is about to fire: the
          entity's key, the event, the states it leaves and enters, and its trigger.
        name: WorkflowFiringValue
        struct:
          fields:
            - doc: Key is the entity's key.
              name: Key
              type: string
            - doc: Event is the transition's name.
              name: Event
              type: string
            - doc: From is the state it leaves.
              name: From
              type: string
            - doc: To is the state it enters.
              name: To
              type: string
            - doc: Trigger is what fires it.
              name: Trigger
              type: WorkflowTrigger
      - doc: |-
          WorkflowRecordValue is what a workflow's engine knows of one entity: its
          state, since when, and its latest transitions, oldest first.
        name: WorkflowRecordValue
        struct:
          fields:
            - doc: Entered is when the entity entered its state.
              name: Entered
              type: time.Time
            - doc: Key is the entity's key.
              name: Key
              type: string
            - doc: State is the entity's state.
              name: State
              type: string
            - doc: History are its latest transitions, oldest first.
              name: History
              type: "[]WorkflowStepValue"
      - doc: |-
          WorkflowStepValue is one transition of an entity's history: the event,
          the states it left and entered, what fired it, who and when.
        name: WorkflowStepValue
        struct:
          fields:
            - doc: At is when it happened.
              name: At
              type: time.Time
            - doc: Event is the transition's name.
              name: Event
              type: string
            - doc: From is the state left, "" on creation.
              name: From
              type: string
            - doc: To is the state entered.
              name: To
              type: string
            - doc: Actor is who fired it, "" for the loop.
              name: Actor
              type: string
            - doc: Trigger is what fired it.
              name: Trigger
              type: WorkflowTrigger
      - doc: |-
          WorkflowLoopEventValue is what a workflow's loop reports: a run started,
          a run ended, a wait.
        name: WorkflowLoopEventValue
        struct:
          fields:
            - doc: Err is what a run could not fire, nil for nothing.
              name: Err
              type: error
            - doc: Started is when the run started.
              name: Started
              type: time.Time
            - doc: Ended is when the run ended.
              name: Ended
              type: time.Time
            - doc: Next is when the loop wakes next, zero for no transition due.
              name: Next
              type: time.Time
            - doc: Kind is what the event reports.
              name: Kind
              type: WorkflowLoopEvent
            - doc: Wake is why the run started.
              name: Wake
              type: WorkflowWake
      - doc: |-
          WorkflowEngine is one workflow's engine as the framework's core uses it: the
          transitions code fires, what a write of the store tells it, what it
          counts and records, and its loop.
        interface:
          methods:
            - doc: |-
                Start enters e in the workflow, in the initial state: its OnEnter
                hooks run, then it is inserted in the store.
              in:
                - name: ctx
                  type: context.Context
                - name: e
                  type: WorkflowEntityValue
              name: Start
              out:
                - type: WorkflowEntityValue
                - type: error
            - doc: |-
                Fire moves the entity under key along the event's transition leaving
                its state.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                - name: event
                  type: string
              name: Fire
              out:
                - type: WorkflowEntityValue
                - type: error
            - doc: Changed tells the engine the entity under key was written.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Changed
              out:
                - type: error
            - doc: Deleted tells the engine the entity under key was deleted.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Deleted
              out:
                - type: error
            - doc: Census counts the entities per state.
              name: Census
              out:
                - type: map[string]int
            - doc: Records are what the engine knows of each entity.
              name: Records
              out:
                - type: "[]WorkflowRecordValue"
            - doc: |-
                Run runs the loop that fires the timers and the guards, until ctx
                ends.
              in:
                - name: ctx
                  type: context.Context
              name: Run
              out:
                - type: error
        name: WorkflowEngine
      - doc: |-
          WorkflowStore is the port a workflow's engine reads and writes its
          entities through: the workflow's store.
        interface:
          methods:
            - doc: Key is e's key.
              in:
                - name: e
                  type: WorkflowEntityValue
              name: Key
              out:
                - type: string
            - doc: Get reads the entity under key; false when there is none.
              in:
                - name: ctx
                  type: context.Context
                - name: key
                  type: string
              name: Get
              out:
                - type: WorkflowEntityValue
                - type: bool
                - type: error
            - doc: Insert writes e unless its key is taken; false when it was.
              in:
                - name: ctx
                  type: context.Context
                - name: e
                  type: WorkflowEntityValue
              name: Insert
              out:
                - type: bool
                - type: error
            - doc: |-
                Replace writes e over the entity of its key; false when there was
                none.
              in:
                - name: ctx
                  type: context.Context
                - name: e
                  type: WorkflowEntityValue
              name: Replace
              out:
                - type: bool
                - type: error
            - doc: All yields every entity of the store.
              in:
                - name: ctx
                  type: context.Context
              name: All
              out:
                - type: iter.Seq2[WorkflowEntityValue, error]
        name: WorkflowStore
      - doc: |-
          WorkflowJournal is the port a workflow's engine keeps what it knows of
          each entity in: the workflow's file under the data directory, or its
          table on the database that keeps its store.
        interface:
          methods:
            - doc: Load reads every record the journal kept.
              in:
                - name: ctx
                  type: context.Context
              name: Load
              out:
                - type: "[]WorkflowRecordValue"
                - type: error
            - doc: Save keeps records, in the transaction ctx carries for a database.
              in:
                - name: ctx
                  type: context.Context
                - name: records
                  type: WorkflowRecordValue
              name: Save
              out:
                - type: error
              variadic: true
            - doc: Delete forgets the records of keys; one already gone is no error.
              in:
                - name: ctx
                  type: context.Context
                - name: keys
                  type: string
              name: Delete
              out:
                - type: error
              variadic: true
        name: WorkflowJournal
      - doc: |-
          StudioDriverConfig is what framework/app/studio plugs into kit: how the
          tool's variables are read, and how the Studio's routes mount.
        name: StudioDriverConfig
        struct:
          fields:
            - doc: Env reads what the tool's variables ask of the Studio in this run.
              name: Env
              type: func(getenv func(string) string) StudioEnvValue
            - doc: |-
                Settings are the tool's variables as the settings of a run show them,
                in order, each with its value as the run resolved it and where it
                came from: the product's code, the environment, or the framework's default.
              name: Settings
              type: func(getenv func(string) string, state StudioStateValue) []model.Setting
            - doc: |-
                Forced are the variables kit dev says it set itself for this launch,
                as it names them; the framework labels only those it lets kit dev set.
              name: Forced
              type: func(getenv func(string) string) []string
            - doc: |-
                DevBuild is what kit dev said about the build it launched, nil when
                the process was not started by kit dev.
              name: DevBuild
              type: func(getenv func(string) string) *model.DevBuild
            - doc: |-
                Mount registers the Studio's routes on mux, each behind the Studio's
                guard, reading the running app through host.
              name: Mount
              type: func(mux *http.ServeMux, host StudioHost)
      - doc: |-
          StudioEnvValue is what the tool's variables ask of the Studio: their
          zero value is a run in which none is set.
        name: StudioEnvValue
        struct:
          fields:
            - doc: |-
                Studio is what the environment says of the Studio: on — which
                production refuses —, off, or empty when it says neither.
              name: Studio
              type: string
            - doc: "Remote: the Studio answers a client that is not on this machine."
              name: Remote
              type: bool
            - doc: "NoAnalysis: the environment turns the static analysis off."
              name: NoAnalysis
              type: bool
      - doc: |-
          StudioStateValue is what a run resolved of the Studio, and what the
          product's code chose of it: what the settings show of the tool's
          variables.
        name: StudioStateValue
        struct:
          fields:
            - doc: |-
                StudioOption and AnalyzeOption are the product's code's choice of the
                Studio and of the static analysis, which wins over the environment;
                nil when the code chose nothing.
              name: StudioOption
            - doc: |-
                StudioOption and AnalyzeOption are the product's code's choice of the
                Studio and of the static analysis, which wins over the environment;
                nil when the code chose nothing.
              name: AnalyzeOption
              type: "*bool"
            - doc: |-
                Studio, Remote and Analyze are the Studio's switches, as resolved and
                as the settings spell them: on or off.
              name: Studio
            - doc: |-
                Studio, Remote and Analyze are the Studio's switches, as resolved and
                as the settings spell them: on or off.
              name: Remote
            - doc: |-
                Studio, Remote and Analyze are the Studio's switches, as resolved and
                as the settings spell them: on or off.
              name: Analyze
              type: string
      - doc: |-
          StudioHost is the running app, as the Studio's routes read it and answer
          through it.
        interface:
          methods:
            - doc: |-
                Graph is the app's graph, as it is now.
              name: Graph
              out:
                - type: "*model.Graph"
            - doc: |-
                Phase is where the app is in its life, as the graph says it.
              name: Phase
              out:
                - type: string
            - doc: |-
                Now is the time on the app's clock.
              name: Now
              out:
                - type: time.Time
            - doc: |-
                Subscribe streams the app's live events until cancel is called.
              name: Subscribe
              out:
                - name: events
                  type: <-chan model.Event
                - name: cancel
                  type: func()
            - doc: |-
                Stopping is closed when the app ends its live streams.
              name: Stopping
              out:
                - type: <-chan struct{}
            - doc: |-
                Traces are the latest traces the app keeps, at most limit, those of
                root's trace or through node when either is given.
              in:
                - name: limit
                  type: int
                - name: root
                  type: string
                - name: node
                  type: string
              name: Traces
              out:
                - type: "[]model.Trace"
            - doc: |-
                Trace is one trace, while the app keeps it.
              in:
                - name: id
                  type: string
              name: Trace
              out:
                - type: model.Trace
                - type: bool
            - doc: |-
                Logs are the latest records the product logged, those of a trace or
                a node and from a level when given, at most limit — a default when
                it is empty; a level or a limit the app does not take is refused.
              in:
                - name: trace
                  type: string
                - name: node
                  type: string
                - name: level
                  type: string
                - name: limit
                  type: string
              name: Logs
              out:
                - type: "[]model.LogRecord"
                - type: error
            - doc: |-
                Instances are a workflow's entities and where each is; false for no
                such workflow.
              in:
                - name: workflow
                  type: string
              name: Instances
              out:
                - type: "[]model.Instance"
                - type: bool
            - doc: |-
                Items are a store's latest entities, redacted as payloads are; false
                for no such store.
              in:
                - name: store
                  type: string
              name: Items
              out:
                - type: "[]json.RawMessage"
                - type: bool
            - doc: |-
                Source is a file the graph names, of the product's Go module or of
                the one module names: a regular file within the bound, never a link;
                false for any other name.
              in:
                - name: ctx
                  type: context.Context
                - name: module
                  type: string
                - name: file
                  type: string
              name: Source
              out:
                - type: "[]byte"
                - type: bool
            - doc: |-
                Locate says where the function fn, at file:line, lies in the
                product's own module; nil anywhere else.
              in:
                - name: file
                  type: string
                - name: line
                  type: int
                - name: fn
                  type: string
              name: Locate
              out:
                - type: "*model.Source"
            - doc: |-
                Mails are every mailer's latest mails, at most limit of each.
              in:
                - name: limit
                  type: int
              name: Mails
              out:
                - type: "[]model.MailSummary"
            - doc: |-
                Mail is one mail, whole when its mailer keeps bodies; false when no
                mailer remembers it.
              in:
                - name: id
                  type: string
              name: Mail
              out:
                - type: model.MailMessage
                - type: bool
            - doc: |-
                Stores reports whether the app runs on the store subsystem: the
                Studio's routes on the stores and the databases are mounted only then.
              name: Stores
              out:
                - type: bool
            - doc: |-
                Databases are the app's databases, each checked and its migrations
                read again now.
              in:
                - name: ctx
                  type: context.Context
              name: Databases
              out:
                - type: "[]model.Database"
            - doc: |-
                Former are the former values of the record under key in store, as
                the Studio's data view shows them.
              in:
                - name: ctx
                  type: context.Context
                - name: store
                  type: string
                - name: key
                  type: string
              name: Former
              out:
                - type: model.RecordHistory
                - type: error
            - doc: |-
                Revisions are the versions of the record under key in store, and
                what changed from version from to version to when both are given.
              in:
                - name: ctx
                  type: context.Context
                - name: store
                  type: string
                - name: key
                  type: string
                - name: from
                  type: string
                - name: to
                  type: string
              name: Revisions
              out:
                - type: model.RecordVersions
                - type: error
            - doc: |-
                Trash is a page of store's trash, from offset and at most limit
                records — defaults when they are empty.
              in:
                - name: ctx
                  type: context.Context
                - name: store
                  type: string
                - name: offset
                  type: string
                - name: limit
                  type: string
              name: Trash
              out:
                - type: model.StoreTrash
                - type: error
            - doc: |-
                Privacy is what the Studio's Privacy page shows.
              in:
                - name: ctx
                  type: context.Context
              name: Privacy
              out:
                - type: model.Privacy
                - type: error
            - doc: |-
                Remote reports whether the Studio answers a client that is not on
                this machine.
              name: Remote
              out:
                - type: bool
            - doc: |-
                AllowedHost reports whether a request's Host, its port, brackets and
                case removed, may reach the Studio.
              in:
                - name: host
                  type: string
              name: AllowedHost
              out:
                - type: bool
            - doc: |-
                Reply answers r with body, a JSON document, or with err as the framework
                answers an error.
              in:
                - name: w
                  type: http.ResponseWriter
                - name: r
                  type: "*http.Request"
                - name: body
                  type: json.RawMessage
                - name: err
                  type: error
              name: Reply
            - doc: |-
                Forbid answers that the caller may not reach the Studio, saying
                message.
              in:
                - name: w
                  type: http.ResponseWriter
                - name: message
                  type: string
              name: Forbid
            - doc: |-
                Fail answers an internal error, saying message and nothing of the
                error.
              in:
                - name: w
                  type: http.ResponseWriter
                - name: message
                  type: string
              name: Fail
            - doc: |-
                NotFound is the framework's answer to a request for what does not exist,
                saying message.
              in:
                - name: message
                  type: string
              name: NotFound
              out:
                - type: error
            - doc: |-
                Invalid is the framework's answer to a request the caller must change, saying
                message.
              in:
                - name: message
                  type: string
              name: Invalid
              out:
                - type: error
            - doc: |-
                ProfileUnreadable is the framework's refusal of a profile the process could
                not read: public says which, cause why, for the logs.
              in:
                - name: public
                  type: string
                - name: cause
                  type: error
              name: ProfileUnreadable
              out:
                - type: error
            - doc: |-
                Debug logs, at the debug level, a failure nobody is told of.
              in:
                - name: ctx
                  type: context.Context
                - name: message
                  type: string
                - name: err
                  type: error
              name: Debug
        name: StudioHost
      - doc: |-
          WordsConfig is what framework/app/studio plugs into kit: how the framework's
          catalogues in the languages after English open.
        name: WordsConfig
        struct:
          fields:
            - doc: |-
                Open reads and compiles the catalogue of every language after
                English, each falling back to english — the framework's own sentences, by
                key, as its core holds them; a catalogue that does not decode or
                does not compile is refused.
              name: Open
              type: func(english map[string]string) (Translator, error)
      - doc: |-
          Translator says the framework's sentences in the languages after English, which
          only the Studio shows, in its reader's language.
        interface:
          methods:
            - doc: Languages are the languages it speaks after English, in order.
              name: Languages
              out:
                - type: "[]string"
            - doc: |-
                Keys are the keys of lang's catalogue, sorted; nil for a language
                it does not speak.
              in:
                - name: lang
                  type: string
              name: Keys
              out:
                - type: "[]string"
            - doc: |-
                Render is the sentence of key in lang, its placeholders filled from
                args by name; a key the catalogue lacks, or a name the sentence
                takes that args does not give, is an error.
              in:
                - name: lang
                  type: string
                - name: key
                  type: string
                - name: args
                  type: map[string]string
              name: Render
              out:
                - type: string
                - type: error
        name: Translator
      - doc: |-
          OTLPDriverConfig is what framework/app/otlp plugs into the framework: how
          an app's export opens.
        name: OTLPDriverConfig
        struct:
          fields:
            - doc: |-
                Open opens the export cfg describes: its two queues — read, the
                backlog a previous process left counted —, its senders and its
                meter. It sends nothing until OTLPExporter.Run.
              name: Open
              type: func(ctx context.Context, cfg *OTLPConfig) (OTLPExporter, error)
      - doc: |-
          OTLPConfig is what the framework asks of an export: who produces the
          telemetry, where it goes, where it waits, its bounds and the app's clock.
        name: OTLPConfig
        struct:
          fields:
            - doc: |-
                Clock is the app's clock: the queues stamp and age a batch on it, the
                retries and each attempt's bound wait on it, the metrics are
                collected on it.
              name: Clock
              type: Clock
            - doc: |-
                Headers ride on every request to the collector — an Authorization, a
                tenant —; they are the secret otlp-headers, never shown.
              name: Headers
              type: map[string]string
            - doc: |-
                Send, when set, ships a batch in place of the OTLP/HTTP exporters:
                the product's own sender. Retryable then classifies its failures.
              name: Send
              type: func(ctx context.Context, batch OTLPBatchValue) error
            - doc: |-
                Retryable classifies a failure of Send: a later attempt may cure it.
                Unused without Send: the OTLP/HTTP exporters classify their own.
              name: Retryable
              type: func(err error) bool
            - doc: |-
                OnError hears what the export could not keep — a batch of spans or a
                snapshot its queue refused — and what it could not close; the core
                logs it. The forwarder counts every batch it loses on its own.
              name: OnError
              type: func(err error)
            - doc: |-
                Service and Version name the producer: the resource's service.name
                and the instrumentation scope's version.
              name: Service
            - doc: |-
                Service and Version name the producer: the resource's service.name
                and the instrumentation scope's version.
              name: Version
              type: string
            - doc: |-
                Endpoint is the collector's base URL, "http://collector:4318": each
                signal's path is appended to it. Unused with Send.
              name: Endpoint
              type: string
            - doc: |-
                Dir is the directory the two queues lie in, one subdirectory per
                signal; "" keeps them in memory, lost at a stop. Unused with Database.
              name: Dir
              type: string
            - doc: |-
                Database keeps the two queues, one table each (Tables), nil when Dir
                or memory does: a scope the store subsystem's Database opened, on
                which the queue subsystem opens the SDK's SQL broker (OpenSDK).
              name: Database
              type: Database
            - doc: Tables are the queues' tables on Database, by signal.
              name: Tables
              type: map[string]string
            - doc: |-
                WhenFull is what a full queue does with a new batch: OTLPDropOldest,
                OTLPDropNewest or OTLPBlock.
              name: WhenFull
              type: string
            - doc: MaxBytes bounds the bytes each queue holds.
              name: MaxBytes
              type: int64
            - doc: MaxBatches bounds the batches each queue holds.
              name: MaxBatches
              type: int
            - doc: MaxAge is how long after it was queued a batch may still be sent.
              name: MaxAge
              type: time.Duration
            - doc: |-
                SendTimeout bounds one attempt, and the hand-over of the spans the
                batch sink exports to their queue.
              name: SendTimeout
              type: time.Duration
            - doc: Interval is how often the metrics are collected and queued.
              name: Interval
              type: time.Duration
            - doc: |-
                DrainTimeout is how long the batch being sent at a stop may still
                run; SettleTimeout bounds each acknowledgement once the stop began,
                and the flush of what the export still holds in memory.
              name: DrainTimeout
            - doc: |-
                DrainTimeout is how long the batch being sent at a stop may still
                run; SettleTimeout bounds each acknowledgement once the stop began,
                and the flush of what the export still holds in memory.
              name: SettleTimeout
              type: time.Duration
      - doc: |-
          OTLPSinkValue is the export's span sink: the SDK's trace.SpanSink held
          as any, as a MailValue holds a mail — plug names no SDK type, and the core,
          which names the SDK's trace, takes it back.
        name: OTLPSinkValue
        struct:
          fields:
            - doc: Sink is the SDK's trace.SpanSink.
              name: Sink
              type: any
      - doc: |-
          OTLPMeterValue is the product's own meter on the export: the SDK's
          metrics.FullMeter held as any, as OTLPSinkValue holds the span sink.
        name: OTLPMeterValue
        struct:
          fields:
            - doc: Meter is the SDK's metrics.FullMeter.
              name: Meter
              type: any
      - doc: |-
          OTLPBatchValue is one batch as the product's own sender receives it: its
          signal and its OTLP/JSON document, posted to a collector as it is.
        name: OTLPBatchValue
        struct:
          fields:
            - doc: Signal is OTLPTraces or OTLPMetrics.
              name: Signal
              type: string
            - doc: Document is the OTLP/JSON export request.
              name: Document
              type: "[]byte"
      - doc: |-
          OTLPStatsValue is what one signal's queue holds, has sent and has lost,
          with its bounds.
        name: OTLPStatsValue
        struct:
          fields:
            - doc: |-
                LastRetryAfterAt is when the collector last imposed a delay; zero
                when it never did.
              name: LastRetryAfterAt
              type: time.Time
            - doc: Signal is OTLPTraces or OTLPMetrics.
              name: Signal
              type: string
            - doc: PendingBytes and MaxBytes are the bytes the queue holds and may hold.
              name: PendingBytes
            - doc: PendingBytes and MaxBytes are the bytes the queue holds and may hold.
              name: MaxBytes
              type: int64
            - doc: LastRetryAfter is the last delay the collector imposed.
              name: LastRetryAfter
              type: time.Duration
            - doc: Pending and MaxBatches are the batches the queue holds and may hold.
              name: Pending
            - doc: Pending and MaxBatches are the batches the queue holds and may hold.
              name: MaxBatches
              type: int
            - doc: |-
                Enqueued, Sent and Retries count the batches kept, sent and the
                attempts made again.
              name: Enqueued
            - doc: |-
                Enqueued, Sent and Retries count the batches kept, sent and the
                attempts made again.
              name: Sent
            - doc: |-
                Enqueued, Sent and Retries count the batches kept, sent and the
                attempts made again.
              name: Retries
              type: uint64
            - doc: |-
                Dropped, Expired and DeadLettered count the batches lost to a bound,
                to their age and to a permanent refusal.
              name: Dropped
            - doc: |-
                Dropped, Expired and DeadLettered count the batches lost to a bound,
                to their age and to a permanent refusal.
              name: Expired
            - doc: |-
                Dropped, Expired and DeadLettered count the batches lost to a bound,
                to their age and to a permanent refusal.
              name: DeadLettered
              type: uint64
            - doc: |-
                Durable reports whether the queue outlives the process: false in
                memory — no directory, or a platform whose durable queue the SDK
                refuses.
              name: Durable
              type: bool
      - doc: |-
          OTLPExporter is an app's export, open: where the tracer hands its spans,
          what the framework records of each unit of work, the loop that sends, and
          what it counts.
        interface:
          methods:
            - doc: SpanSink is the sink the app's tracer ends its spans into.
              name: SpanSink
              out:
                - type: OTLPSinkValue
            - doc: |-
                Meter is the product's own meter, collected at each interval beside
                the framework's, into the same metrics queue, under the same resource
                and a scope named after the product.
              name: Meter
              out:
                - type: OTLPMeterValue
            - doc: |-
                Record counts one unit of work the framework observed on node: its
                operation, how long it took, and whether it failed.
              in:
                - name: node
                - name: op
                  type: string
                - name: took
                  type: time.Duration
                - name: failed
                  type: bool
              name: Record
            - doc: |-
                Run sends the queued batches and collects the metrics until ctx ends;
                then it flushes what it holds in memory into the queues, lets the
                batch being sent finish within the drain, and closes the queues.
              in:
                - name: ctx
                  type: context.Context
              name: Run
              out:
                - type: error
            - doc: Stats is what each signal's queue holds, has sent and has lost.
              name: Stats
              out:
                - type: "[]OTLPStatsValue"
        name: OTLPExporter
    variables:
      - doc: |-
          Jobs is the jobs subsystem: the schedules of the framework's jobs and the scheduler
          that fires them; nil until framework/app/jobs is imported. A product that
          declares a job without it is refused at the start (ADR 0179 §6).
        name: Jobs
        type: atomic.Pointer[JobDriverConfig]
      - doc: |-
          Mail is the mail subsystem: the outbox the framework's mailers keep and the
          transports that empty it; nil until framework/app/mail is imported. A
          product that declares a mailer without it is refused at the start (ADR
          0179 §6).
        name: Mail
        type: atomic.Pointer[MailDriverConfig]
      - doc: |-
          NewHTTPServer builds the HTTP engine an app in the server profile
          serves on; nil until framework/app/server is imported.
        name: NewHTTPServer
        type: atomic.Pointer[func(cfg HTTPConfig) HTTPServer]
      - doc: |-
          NewStaticFiles builds the file server of a frontend's tree; nil until
          framework/app/server is imported.
        name: NewStaticFiles
        type: atomic.Pointer[func(fsys fs.FS, csp string) (http.Handler, error)]
      - doc: |-
          SampleProcess samples the running process — its heap, goroutines,
          collections and CPU time — for the runtime graph a serving app answers;
          nil until framework/app/server is imported, and the graph then carries
          no process (ADR 0172).
        name: SampleProcess
        type: atomic.Pointer[func() *model.Process]
      - doc: |-
          Queues is the queue subsystem: the brokers the framework's consumers' queues run on
          and the migration of a queue's table on a database; nil until
          framework/app/queue is imported. A product that declares a topic, a
          subscription, a watch, a queued command or a mailer whose outbox is on a
          database without it is refused at the start (ADR 0179 §6).
        name: Queues
        type: atomic.Pointer[QueueDriverConfig]
      - doc: |-
          Stores is the store subsystem: the engines the framework's stores run on, the framework's
          scope on a database and the migrations of the framework's tables; nil until
          framework/app/store is imported. A product that declares a store or a
          database without it is refused at the start (ADR 0179 §6).
        name: Stores
        type: atomic.Pointer[StoreDriverConfig]
      - doc: |-
          Studio is the Studio subsystem: the tool's variables and the Studio's
          routes; nil until framework/app/studio is imported, and the framework then reads
          none of the tool's variables and serves no route of the Studio.
        name: Studio
        type: atomic.Pointer[StudioDriverConfig]
      - doc: |-
          Workflows is the workflow subsystem: the engine the framework's workflows run on;
          nil until framework/app/workflow is imported. A product that declares a
          workflow without it is refused at the start (ADR 0179 §6).
        name: Workflows
        type: atomic.Pointer[WorkflowDriverConfig]
      - doc: |-
          Words is the framework's sentences in the languages after English, the catalogues
          the Studio shows its reader's language from; nil until
          framework/app/studio is imported, and the framework then speaks English alone.
          The terminal, the logs and an error read English whatever a program
          imports (ADR 0179 Q6).
        name: Words
        type: atomic.Pointer[WordsConfig]
      - doc: |-
          OTLP is the OTLP export subsystem; nil until framework/app/otlp is
          imported. A product that declares app.OTLP without it is refused at the
          start (ADR 0179 §6).
        name: OTLP
        type: atomic.Pointer[OTLPDriverConfig]
  - doc: |-
      Package queueengine is what framework/app/queue plugs into kit: the brokers
      the framework's consumers' queues run on — the SDK's queue in memory, in the data
      directory and over SQL, a mailer's outbox on a database sealed in front of
      the SQL one —, the consumer that delivers them, and the migration of a
      queue's table (ADR 0179 §1, step 4). The framework's core imports none of the SDK's
      queue: it reaches it through plug, and a product that declares no topic,
      no subscription, no watch, no queued command and no outbox on a database
      links none of it.

      Package queueengine — the compile-time proof that the brokers are the framework's.
    functions:
      - doc: |-
          BrokerOf is the SDK's broker behind b, a queue this package opened: what a
          mailer's spool keeps its outbox in on a database (ADR 0179 step 6) — the
          sealed outbox, behind a test's wrapper when it set one —; false for a
          queue it did not open.
        in:
          - name: b
            type: plug.Broker
        name: BrokerOf
        out:
          - type: queue.Broker
          - type: bool
      - doc: |-
          Enable plugs the queues' brokers, their consumer and the migration of a
          queue's table into the framework.
        name: Enable
    imports:
      plug: github.com/kitsunium/sdk/framework/internal/app/plug
      queue: github.com/kitsunium/sdk/pkg/v1/data/queue
    path: github.com/kitsunium/sdk/framework/internal/app/queueengine
  - doc: |-
      Package serverengine is what framework/app/server plugs into kit: the HTTP
      engine an app in the server profile serves on (the SDK's net/server), the
      frontends' file server (the SDK's net/static), and the process sampler of
      the runtime graph a serving app answers (the SDK's proc/process, and through
      it runtime/metrics and the spawn engine). The framework imports none of them: a
      daemon or a CLI neither links nor initialises them (ADR 0172).

      Package serverengine — the compile-time proof that the engine is the framework's.
    functions:
      - doc: |-
          Enable plugs the HTTP engine, the frontends' file server and the process
          sampler into the framework.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/serverengine
  - doc: |-
      Package storeengine is what framework/app/store plugs into kit: the engines
      the framework's stores run on — the SDK's document store in memory, in the data
      directory and over SQL —, the framework's scope on a database — the SDK's
      transaction manager, its check and its migrator — and the migrations of
      the framework's tables (ADR 0179 §1). The framework's core imports neither the SDK's docstore
      nor its sql: it reaches them through plug, and a product that declares no
      store links none of them.

      Package storeengine — the compile-time proof that the engines are the framework's.
    functions:
      - doc: |-
          SQLOf is the SDK's transaction manager and dialect of db, a database this
          package opened: what the queues' SQL broker runs on, so that a
          publication joins the transaction its context carries (ADR 0179 step 4),
          and what a mailer's spool defers its announcements on (step 6); false for
          a database it did not open.
        in:
          - name: db
            type: plug.Database
        name: SQLOf
        out:
          - name: tm
            type: sql.Transactor
          - name: dialect
            type: sql.Dialect
          - name: ok
            type: bool
      - doc: |-
          Enable plugs the stores' engines, the framework's scope on a database and the
          migrations of the framework's tables into the framework.
        name: Enable
    imports:
      plug: github.com/kitsunium/sdk/framework/internal/app/plug
      sql: github.com/kitsunium/sdk/pkg/v1/data/sql
    path: github.com/kitsunium/sdk/framework/internal/app/storeengine
  - doc: |-
      Package studioengine is what framework/app/studio plugs into the framework (ADR 0179
      §1, step 8; ADR 0180 §4, step 1): the Studio's routes, their guard and
      their handlers — the graph, the live events as a Server-Sent Events
      stream (the SDK's net/sse), traces, source, instances, items, and the dev
      tools with the profiler (the SDK's profiling) —, the tool's variables the framework
      dev and the Studio set, and the framework's sentences in the languages after
      English — the catalogues the Studio shows its reader's language from,
      compiled by the SDK's i18n (Q6). The framework's core holds none of them: a product
      that does not import the Studio neither links nor initialises them, reads
      none of the tool's variables, and speaks English alone. The routes read
      the running app through the plug.StudioHost the framework's core gives.
    functions:
      - doc: |-
          Enable plugs the Studio into kit: the tool's variables, the Studio's
          routes — with its event stream and its profiler — and the framework's catalogues
          after English.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/studioengine
  - doc: |-
      Package workflowengine is what framework/app/workflow plugs into kit: the
      engine the framework's workflows run on — the SDK's statemachine, instantiated once,
      over the framework's entity and the state's spelling (ADR 0179 §1, step 5, Q3) —,
      its loop of timers and guards, and the conversions between the engine's
      values and plug's. The framework's core imports none of the SDK's statemachine: it
      reaches it through plug, and a product that declares no workflow links
      none of it.

      Package workflowengine — the compile-time proof that the engine is the framework's.
    functions:
      - doc: Enable plugs the workflows' engine into the framework.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/workflowengine
  - aliases:
      - doc: |-
          Principal is what the app's auth data says about the caller to the
          SDK's authz: the attributes [Command].Allow and [Query].Allow hand a
          policy — the caller's roles, its groups. Auth data that does not
          implement it gives none, and every Allow refuses: the start warns of it.

          	type Me struct{ Roles []string }

          	func (m Me) Attrs() []authz.Attr { return []authz.Attr{authz.AttrStrings("roles", m.Roles...)} }

          The framework calls the caller a principal: in the framework, a subject is the person
          personal data is about (ADR 0006).
        name: Principal
        target: iapp.AttrsProvider
      - doc: |-
          Activity is a declared activity of a service: a function that says
          whether the product is busy. A daemon's IdleStop waits until every
          activity of its mounted services says false AND no connection is open on
          its listeners.
        name: Activity
        target: iapp.ActivityHandler
      - doc: |-
          App is the whole product: the services it mounts, served by one process.
          The same services can be mounted by several apps — one binary per service,
          or all of them in one — and each app draws exactly what it runs.
        name: App
        target: iapp.App
      - doc: |-
          DiagnosticsError is returned by Start when declarations are wrong. It lists
          every problem at once, each with its position.
        name: DiagnosticsError
        target: iapp.DiagnosticsError
      - doc: |-
          AnalyzeFunc reads the product's source — the Go module rooted at dir, and
          the packages that declare the modules it mounts — into a graph the runtime
          merges into its own: the edges found in handler bodies, each function's
          steps. The framework links no analyzer (ADR 0147 §1): the platform's former runtime
          tool gives one, in dev, through [Analyzer].
        name: AnalyzeFunc
        target: iapp.AnalyzeFunc
      - doc: |-
          UID identifies an authenticated user. It is what the auth handler returns
          and what every endpoint reads with [UserID].
        name: UID
        target: iapp.UID
      - doc: |-
          Authenticator is the app's authentication handler: it turns the
          credentials of a request — a session cookie, a bearer token — into a user,
          in front of every endpoint declared with [Auth] or [AuthOptional]. An app
          has at most one.

          P is the credentials: a struct whose fields are tagged cookie:"…" or
          header:"…", decoded like an endpoint's request. D is what the handler says
          about the user; endpoints read it with [AuthData].
        name: Authenticator
        target: iapp.AuthenticatorHandler[P, D]
        typeParams:
          - name: P
          - constraint: any
            name: D
      - doc: |-
          Stdio is where a CLI command reads and writes: the process's own streams
          under Main, buffers in a test.
        name: Stdio
        target: iapp.StdioValue
      - doc: |-
          CLIFunc is a CLI command's body: its arguments after its name, and the
          streams; it returns the process exit status (0 success, 64 usage, 70
          software — the sysexits a shell script branches on).
        name: CLIFunc
        target: iapp.CLIFunc
      - doc: |-
          CLI is a short command-line command of the product: it runs once, in the
          CLI profile, and exits with its status. Main runs it when the process's
          first argument is its name.
        name: CLI
        target: iapp.CLI
      - doc: CLIOption tunes a CLI command.
        name: CLIOption
        target: iapp.CommandLineConfigurer
      - doc: |-
          Command changes something: a typed input, a typed result, and one handler
          — the one declared with it. Declare it with [Service].Command; dispatch it
          with [Command].Dispatch from any building block, which draws a dispatches
          edge from the caller; give it a route with [Command].Expose.

          A dispatch runs, in this order: the caller's user when the command asks
          for one ([Auth], implied by [Command].Allow) — an in-process dispatch
          carries its caller's and is not authenticated again —, the input's
          validate tags, the policies ([RateLimit], [RateLimitPerClient],
          [Timeout], [Bulkhead]), the key ([Command].Key), the authorization
          ([Command].Allow, then [Command].Authorize), then the handler. A queued
          command ([Queued]) is checked at its dispatch, as its caller — its
          validate tags, its authorization, its key —, and handled by its queue's
          consumer, the policies around the handling.

          ADR 0004's step 2 makes a command its unit of work: its authorization and
          its handler will run in one transaction, which holds its effects until
          the commit. Until then, a command's writes and effects are made as the
          handler makes them.
        name: Command
        target: iapp.Command[C, R]
        typeParams:
          - name: C
          - constraint: any
            name: R
      - doc: |-
          CommandOption configures a command: [Queued]; the options every operation
          takes — [Auth], [AuthOptional], [RateLimit], [RateLimitPerClient],
          [Timeout], [Bulkhead]; and, for a queued one, [MaxDeliveries] and
          [Parallelism].
        name: CommandOption
        target: iapp.CommandConfigurer
      - doc: AppOption configures an app. Options win over the environment.
        name: AppOption
        target: iapp.AppConfigurer
      - doc: |-
          Dialect is the SQL an [Engine] speaks: [DialectPostgres], [DialectMySQL] or
          [DialectSQLite], the framework's own names (ADR 0179 Q5) — the graph names the
          engine by it.
        name: Dialect
        target: iapp.Dialect
      - doc: |-
          DatabaseURL is what a database's URL points at, as its engine describes it
          for the graph, the Studio, the logs and every error: never a user, never a
          password, never a parameter.
        name: DatabaseURL
        target: iapp.DatabaseURLValue
      - doc: |-
          Engine is an SQL engine a database runs on. An engine module returns one —
          github.com/kitsunium/sdk/framework/connectors/postgres, …/mysql, …/sqlite —;
          the framework calls it when the database starts. Like an SDK port, it grows by
          sibling interfaces, never by a method.
        name: Engine
        target: iapp.Engine
      - doc: |-
          LockWaiter is an [Engine] whose connections wait a bounded time for a lock
          another connection holds — SQLite's busy timeout —, a sibling of Engine
          (ADR 0178 C2). The framework opens such an engine's pool with OpenWaiting instead
          of Open, and gives it a wait under <name>-timeout, so that a lost race on
          the lock comes back as the engine's refusal before the call's own
          deadline. An engine that does not implement it keeps its own wait.
        name: LockWaiter
        target: iapp.LockWaiter
      - doc: |-
          Migration is one versioned change of a database's schema and its
          reversal, the framework's own (ADR 0179 step 10): the shape the SDK's sql runs,
          which the store subsystem hands it.

          	app.Migration{
          		Version: 20261017120000,
          		Name:    "notes",
          		Up:      app.Statements("CREATE TABLE notes (id TEXT PRIMARY KEY, body TEXT)"),
          		Down:    app.Statements("DROP TABLE notes"),
          	}
        name: Migration
        target: iapp.MigrationValue
      - doc: |-
          MigrationStep is one direction of a [Migration], run on ex — the
          transaction its version row is written in, so that both commit
          together.
        name: MigrationStep
        target: iapp.MigrationStep
      - doc: |-
          MigrationExecutor is what a migration's step runs its statements on: a
          transaction, which a step cannot end.
        name: MigrationExecutor
        target: iapp.MigrationExecutor
      - doc: "DatabaseOption configures a database: [Keeps], [Migrations]."
        name: DatabaseOption
        target: iapp.DatabaseConfigurer
      - doc: |-
          Keepable is what a database keeps: a service — every store it declares —,
          a store, or a module (ADR 0008) — every store of its services.
        name: Keepable
        target: iapp.Keeper
      - doc: |-
          Empty is the request or the response of an endpoint that has none. An
          endpoint answering EmptyValue replies 204 No Content.
        name: Empty
        target: iapp.EmptyValue
      - doc: |-
          Endpoint is an HTTP endpoint with a typed request and a typed response.
          Declare it with [Service].Endpoint; call it from another service with
          [Endpoint].Call, which is how the diagram sees service-to-service calls.
        name: Endpoint
        target: iapp.EndpointService[Req, Resp]
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: EndpointOption configures an endpoint.
        name: EndpointOption
        target: iapp.EndpointConfigurer
      - doc: |-
          OperationOption configures an endpoint, a command or a query alike: the
          authentication it asks for ([Auth], [AuthOptional]) and the policies in
          front of its handler ([RateLimit], [RateLimitPerClient], [Timeout],
          [Bulkhead]).
        name: OperationOption
        target: iapp.OperationOption
      - doc: RateLimitOption configures a [RateLimit].
        name: RateLimitOption
        target: iapp.RateLimitConfigurer
      - doc: BulkheadOption configures a [Bulkhead].
        name: BulkheadOption
        target: iapp.BulkheadConfigurer
      - doc: WaitOption configures a [RateLimit] and a [Bulkhead] alike.
        name: WaitOption
        target: iapp.WaitConfigurer
      - doc: |-
          PortPolicyOption guards the calls a port makes: [Retry], [Budget],
          [Breaker], [Hedge], [Idempotent], [Throttle] and [Timeout], given to
          [Port].Guard.
        name: PortPolicyOption
        target: iapp.PortPolicyConfigurer
      - doc: |-
          TimeoutOption configures an endpoint, a command, a query and a port
          alike: [Timeout].
        name: TimeoutOption
        target: iapp.TimeoutConfigurer
      - doc: RetryOption configures a [Retry].
        name: RetryOption
        target: iapp.RetryConfigurer
      - doc: BreakerOption configures a [Breaker].
        name: BreakerOption
        target: iapp.BreakerConfigurer
      - doc: |-
          Error is an error a product returns to its callers. Message travels on the
          wire; the cause attached with [Error].Wrap is logged and never sent.

          Return one from a handler to choose the HTTP status and the message the
          caller reads. Any other error becomes a 500 whose body says nothing about
          it: an error message is the classic place a secret leaks from.
        name: Error
        target: iapp.Error
      - doc: |-
          Violation is one validation rule a request failed: where, which rule, and
          why — never the value.
        name: Violation
        target: iapp.ViolationMessage
      - doc: |-
          ExposeConfigurer configures an exposure ([Command].Expose, [Query].Expose):
          every [EndpointOption] — [Name], [MaxBody], [RateLimitPerClient]… — and
          the markers that say who may run an operation declaring no rule of its
          own: [Anyone], [AnyUser].
        name: ExposeOption
        target: iapp.ExposeConfigurer
      - doc: |-
          Former is one former value of a field that keeps its history: what it was,
          until when, and who replaced it.
        name: Former
        target: iapp.Former
      - doc: |-
          Job is scheduled work: a piece of the daemon's internal loop. It runs on
          the SDK scheduler, whose decisions about time are documented rather than
          emergent: a fire that is due while the previous run of the same job is
          still going is skipped and counted, and a missed deadline is skipped and
          counted, never caught up.
        name: Job
        target: iapp.Job
      - doc: |-
          ListenHandler serves one connection of a [Listener] until it returns; the
          connection is closed after it. conn.Peer says who connected, as the kernel
          says where it can (pkg/v1/proc/ipc).
        name: ListenHandler
        target: iapp.ListenHandler
      - doc: |-
          Listener is an inbound port that is not HTTP: a private socket on this
          machine — a Unix socket in a directory only the product's account can
          reach, the kernel naming the peer on Linux (ADR 0148) — speaking a
          versioned contract. It is how a daemon profile serves its clients, and how
          two process roles of one binary talk (D22): through the contract, never
          through each other's code.
        name: Listener
        target: iapp.Listener
      - doc: ListenerOption tunes a listener.
        name: ListenerOption
        target: iapp.ListenerConfigurer
      - doc: |-
          Loop is a declared loop of the daemon: the framework owns the wait, the product owns
          the work. Its wake sources — a period, a deadline the product computes, a
          topic — are data, so the diagram draws exactly what wakes it; the framework runs it on
          its own goroutine, one run at a time, observes every run, and restarts it
          after a panic.
        name: Loop
        target: iapp.Loop
      - doc: |-
          Wake says why a declared loop runs: the reason, the instant, and the
          topic that woke it when one did. Wakes that come while it runs, or while
          it backs off after a failure, are gathered into one run: Reasons and
          Topics say every one of them, and Reason the one that decides the run.
        name: Wake
        target: iapp.WakeEvent
      - doc: LoopOption configures a declared loop.
        name: LoopOption
        target: iapp.LoopConfigurer
      - doc: RoutineOption configures a hand-written loop ([Service].Go).
        name: RoutineOption
        target: iapp.RoutineConfigurer
      - doc: |-
          SupervisionOption configures what the framework restarts after a
          failure: a subscription's, a watch's or a queued command's consumer, a
          declared loop, a hand-written loop ([GiveUpAfter]).
        name: SupervisionOption
        target: iapp.SupervisionConfigurer
      - doc: |-
          JobOption configures a job ([Service].Every, [Service].Cron):
          [Overlap], [StartingDeadline].
        name: JobOption
        target: iapp.JobConfigurer
      - doc: |-
          OverlapPolicy is what a job's fire does while the job's previous run is
          still going: [OverlapSkip], [OverlapAllow] or [OverlapReplace]. It is
          the word of the job's setting <service>-job-<name>-overlap.
        name: OverlapPolicy
        target: iapp.OverlapPolicy
      - doc: |-
          Routine is a loop written by hand: a function that runs until its context
          ends. The framework starts it with the app, cancels its context on shutdown and waits
          for it, restarts it after an error or a panic — backing off from one second
          to one minute — and reads its select statements to draw what it waits on.
        name: Routine
        target: iapp.Routine
      - doc: |-
          Mailer is outbound mail: a durable outbox and the transport that empties
          it. [Mailer].Send only queues — it returns once the message is safely in
          the outbox — and the mailer's own loop hands each message to the transport,
          retrying a failure and dead-lettering a message after its last attempt.

          The transport is the SDK's mail package: SMTP when the mail connector's
          secret smtp-url is set — <PRODUCT>_SMTP_URL, smtp://user:password@host:587?tls=
          starttls|implicit|none — and otherwise the capture transport, which keeps
          every message for the Studio's mailbox and for tests ([Mailer].Captured)
          and delivers nothing. Outside dev, the capture transport is reported as a
          warning. The URL is read again before every delivery: replacing it where
          it lives — a new version in the store, a new file behind
          <PRODUCT>_SMTP_URL_FILE — takes effect at the next mail. The outbox and the
          transports are the SDK's, which the mail subsystem plugs in
          (framework/app/mail, ADR 0179 step 6).
        name: Mailer
        target: iapp.Mailer
      - doc: MailerOption configures a mailer.
        name: MailerOption
        target: iapp.MailerConfigurer
      - doc: |-
          Bounce is a mail its mailer gave up on: the receiving server refused it for
          good, it outlived its mailer's max-age, or its last attempt failed —
          GivenUp says which. It stays in the outbox as a dead letter.

          Reply is the receiving server's own answer: the hook may read it, log it or
          act on it, but the framework never puts it in a message it shows — the
          Studio's mailbox keeps its code alone.
        name: Bounce
        target: iapp.BounceEvent
      - doc: |-
          Module is a set of services a product mounts as one: [NewModule] declares
          it, [App].With or [Mount] mounts it.
        name: Module
        target: iapp.Module
      - doc: |-
          ModulePart is what a module is made of: its services, the modules it
          requires ([Requires]), and the migrations of the data it keeps outside
          the framework's stores ([Migrations]).
        name: ModulePart
        target: iapp.ModuleConfigurer
      - doc: "MountOption configures the mount of a module: [Prefix], [Bind], [Only]."
        name: MountOption
        target: iapp.MountConfigurer
      - doc: |-
          Operation takes a typed request and answers a typed response: an
          endpoint, a port — and, with ADR 0005, a command or a query. It is what
          [Fallback] and [Bind] give a port, and what [Replace] replaces in a test;
          a request or a response of other types does not compile. Its methods are
          unexported: only the framework implements it.

          Every operation is a node of the graph, and runs in a span of its own
          through its whole pipeline — authentication, validation, policies, the
          Studio's mocks — whoever calls it.
        name: Operation
        target: iapp.Operation[Req, Resp]
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          PasswordPolicy is the policy of one secret field that holds a password's
          hash: how long a password is at least, and how many former passwords it
          refuses. [Store].Passwords declares it; Set, Change and Verify apply it.
        name: PasswordPolicy
        target: iapp.PasswordPolicyService[T]
        typeParams:
          - constraint: any
            name: T
      - doc: "PasswordOption configures a password policy: [MinLength], [NotReused]."
        name: PasswordOption
        target: iapp.PasswordConfigurer
      - doc: |-
          Port is an operation a service needs and does not implement: a typed
          request, a typed response, a name. Declare it with [Service].Port, and
          call it with [Port].Call as an endpoint is called: validated, observed,
          drawn.

          What a port calls is decided when the app starts, by one rule the static
          analysis shares: the app's [Bind], else the one [Service].Implement among
          the services the app mounts, else the port's own [Fallback]. The start
          refuses a port it cannot bind, with every other problem at once.

          A port is how a service reaches what it cannot import — a module its
          host's content, a service another that imports it — the consumer owning
          the contract.
        name: Port
        target: iapp.PortService[Req, Resp]
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: "PortOption configures a port: [Fallback]."
        name: PortOption
        target: iapp.PortConfigurer[Req, Resp]
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: Erasure is what app.Erase did, store by store.
        name: Erasure
        target: iapp.Erasure
      - doc: PersonalData is a person's data as app.Export gives it.
        name: PersonalData
        target: iapp.PersonalData
      - doc: |-
          Query reads and changes nothing: a typed input, a typed result, and one
          handler — the one declared with it. Declare it with [Service].Query; ask it
          with [Query].Ask from any building block, which draws an asks edge from
          the caller; give it a route with [Query].Expose. The static analysis warns
          of a query whose code writes a store, fires a workflow, publishes, sends a
          mail or dispatches a command.

          A question runs, in this order: the caller's user when the query asks for
          one ([Auth], implied by [Query].Allow), the input's validate tags, the
          policies, the authorization ([Query].Allow, then [Query].Authorize), then
          the handler, on the caller's goroutine.
        name: Query
        target: iapp.Query[Q, R]
        typeParams:
          - name: Q
          - constraint: any
            name: R
      - doc: |-
          QueryOption configures a query: the options every operation takes —
          [Auth], [AuthOptional], [RateLimit], [RateLimitPerClient], [Timeout],
          [Bulkhead].
        name: QueryOption
        target: iapp.QueryConfigurer
      - doc: |-
          Records is one store's records without their type. Get returns a record
          without its secret members; Keys lists the records' keys, to a module that
          watches the store; EraseFields and Delete take a reason and are refused on a
          held record. Each call is a span on the store's node and an entry in the
          privacy journal.
        name: Records
        target: iapp.RecordsService
      - doc: |-
          Revision is one version of a record a store with [Revisions] keeps: its
          number — from 1, never given twice while the record exists —, when the
          write that made it ran, on the app's clock, zero for a record stored before
          its store kept revisions; who made it — the caller's [UserID], empty for a
          write with no user —; which command made it — its node ID, empty outside a
          command —; and the record as it was, its secret members zeroed.
        name: Revision
        target: iapp.RevisionEvent[T]
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Tombstone is one record in a store's trash: its key, when the product
          deleted it, on the app's clock, and when the framework purges it — its trash's
          length after the deletion, or sooner when its retention says so.
        name: Tombstone
        target: iapp.TombstoneEvent
      - doc: |-
          Edit is one change between two versions of a record, in RFC 6902's words:
          Op is add, remove or replace, Path the RFC 6901 JSON pointer of the member
          it changes, From the value it had and To the value it has, as JSON. A
          secret member says it changed, never what: its From and To are empty.
        name: Edit
        target: iapp.Edit
      - doc: |-
          Binary is one executable the product ships, made of process roles: a
          status line and its daemon are two roles of one binary, "statusline" and
          "statusline daemon". Each role is an App — its own services, its own
          profile — and two roles talk only through a declared, versioned contract
          (D22): a listener one serves and the other dials, never each other's code.

          	var Binary = app.NewBinary("statusline", "The status line of a Claude session.").
          		Role("render", RenderApp).                // statusline ...
          		Role("daemon", DaemonApp, "daemon").      // statusline daemon ...
          		Talks("render", "daemon", "render/v1")

          	func main() { os.Exit(Binary.Main(context.Background(), os.Args[1:])) }

          The package that declares a binary and its roles is wiring, generated from
          the design (D22).
        name: Binary
        target: iapp.Binary
      - doc: |-
          Scope is one part of a path computed at the start: the user, the
          executable, a configuration directory. Two processes share a singleton or
          a socket when every scope gives them the same value.
        name: Scope
        target: iapp.ScopeValue
      - doc: |-
          Secret is a secret the product declares: provided by the operator — an SMTP
          URL, an API token — or generated by the framework — a signing or sealing key — and
          rotated on its schedule.
        name: Secret
        target: iapp.Secret
      - doc: SecretOption configures a secret.
        name: SecretOption
        target: iapp.SecretConfigurer
      - doc: |-
          Service is a bounded context of the product: it owns its building blocks —
          endpoints, stores, topics, subscriptions, workflows, jobs, frontends — and
          is the unit an App mounts. Declare one per package, as a package-level
          variable, and declare its building blocks through its methods:

          	var Service = app.NewService("todos", "The todo list.")
          	var Todos = Service.Store("todos", func(t Todo) string { return t.ID })
          	var _ = Service.Endpoint("GET /todos", List)

          Declaring never fails: a mistake — a malformed route, a duplicate name — is
          recorded with its source position and reported, all at once, when the App
          starts. The diagram shows it too.
        name: Service
        target: iapp.Service
      - doc: |-
          Setting is a value the environment gives a service, declared with
          [Service].Setting.
        name: Setting
        target: iapp.SettingService[T]
        typeParams:
          - constraint: SettingValue
            name: T
      - doc: SettingValue is what a setting may hold.
        name: SettingValue
        target: iapp.SettingValue
      - doc: SettingOption configures a setting.
        name: SettingOption
        target: iapp.SettingConfigurer
      - doc: |-
          Frontend is static assets the product serves: a single page application,
          a documentation site. Requests the page makes to the product's endpoints
          are attributed to it in the diagram.
        name: Frontend
        target: iapp.Frontend
      - doc: StaticOption configures a frontend.
        name: StaticOption
        target: iapp.StaticConfigurer
      - doc: |-
          Store is a typed, keyed collection of entities. Every read returns a copy
          and every write stores one: an entity is kept as its JSON encoding, so what
          a handler holds can never alias what the store holds, and the memory and
          file backends behave identically.

          With a data directory (<PRODUCT>_DATA_DIR; ".app/data" in dev) the store persists
          every write before returning, atomically — a crash never leaves a torn
          file — and a write costs one entity, whatever the store holds. Without one,
          it lives in memory. A store is a port (ADR 0004): what it runs on is its
          engine (store_engine.go), today the SDK's document store (docstore); the framework
          makes it a node of the graph, observes every call, and speaks for its
          refusals.
        name: Store
        target: iapp.StoreService[T]
        typeParams:
          - constraint: any
            name: T
      - doc: StoreOption configures a store.
        name: StoreOption
        target: iapp.StoreConfigurer
      - doc: |-
          Topic is an asynchronous channel of messages of type T. Every subscription
          receives every message, at least once: a subscription's handler must
          tolerate a redelivery.
        name: Topic
        target: iapp.TopicService[T]
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Subscription consumes a topic: its handler runs once per message, at least
          once, retried on error, and dead-lettered after MaxDeliveries attempts.
        name: Subscription
        target: iapp.SubscriptionWorker[T]
        typeParams:
          - constraint: any
            name: T
      - doc: SubscriptionOption configures a subscription.
        name: SubscriptionOption
        target: iapp.SubscriptionConfigurer
      - doc: |-
          DeliveryOption configures a queue's deliveries: a subscription's, or a
          queued command's ([MaxDeliveries], [Parallelism]).
        name: DeliveryOption
        target: iapp.DeliveryOption
      - doc: |-
          Written is what a watch is told of a write: which store, which record, and
          whether it was deleted — never a value. The watch reads the record itself
          ([RecordsOf]): without its secret members, and journaled.
        name: Written
        target: iapp.WrittenEvent
      - doc: |-
          Watch is a subscription fed by stores instead of a topic: its handler is
          told of every write the framework confirms on a store whose entity holds a field
          with its mark. [Service].Watch declares one.
        name: Watch
        target: iapp.Watch
      - doc: |-
          Mark is what a module looks for in the product's fields: app.Personal,
          app.Special or app.Moderated. There is no mark for public or secret:
          there is nothing to find in the first, and nothing may watch the second.
        name: Mark
        target: iapp.Mark
      - doc: |-
          FieldRef is one field of one store that carries a mark: where the field
          is, and what its tag says of it.
        name: FieldRef
        target: iapp.FieldRefValue
      - doc: |-
          Workflow is a state machine over the entities of one store: the states an
          entity goes through, and the arrows between them. It is declared as data —
          which is why the diagram can draw it exactly — and it runs four kinds of
          transitions:

            - event transitions ([Workflow].On), fired by code with [Workflow].Fire;
            - timer transitions ([Workflow].After), fired by the workflow's own loop
              once an entity has spent a duration in a state;
            - timer transitions at an instant the entity carries ([Workflow].At) — a
              due date, a deadline — fired by the same loop when it comes;
            - guard transitions ([Workflow].When), fired by the same loop as soon as
              a condition on the entity holds.

          The SDK's state-machine engine runs it (statemachine). Its loop never
          polls: it keeps an agenda of the transitions due, sleeps until the
          earliest, and a write of the store — which may bring one forward — wakes
          it. A workflow with nothing due does not run at all. Transitions of one
          entity run one at a time, of different entities at once.

          The entity's state lives in the entity itself (the state function returns
          a pointer to it), so the store stays the single source of truth; the
          engine keeps, beside it, when each entity entered its state and the
          history of its transitions — in the workflow's file under the data
          directory, so a timer keeps counting across a restart.
        name: Workflow
        target: iapp.WorkflowService[E, S]
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: |-
          Delay is how long a timer transition waits: a duration, or a setting that
          holds one — read when the delay is needed, so each environment can give
          its own.
        name: Delay
        target: iapp.Delay
      - doc: |-
          Change describes one transition, for [Workflow].OnTransition hooks: the
          entity, the event, and the states it left and entered.
        name: Change
        target: iapp.ChangeEvent[E, S]
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: OTLPFullPolicy is what an export's full queue does with a new batch.
        name: OTLPFullPolicy
        target: iapp.OTLPFullPolicy
      - doc: |-
          OTLPBatch is one batch as the product's own sender receives it
          ([OTLPSender]): its signal, [OTLPTraces] or [OTLPMetrics], and its
          OTLP/JSON document, which a collector takes as it is.
        name: OTLPBatch
        target: iapp.OTLPBatchValue
      - doc: |-
          OTLPOption configures the app's export: [OTLPEndpoint], [OTLPBounds],
          [OTLPWhenFull], [OTLPMaxAge], [OTLPSendTimeout], [OTLPSampleRatio],
          [OTLPDatabase], [OTLPSender].
        name: OTLPOption
        target: iapp.OpenTelemetryConfigurer
