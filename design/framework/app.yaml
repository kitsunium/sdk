        doc: |-
          The framework's own failures carry SDK error codes in 0.4.2.* — layer 4 is
          the framework's, PP 2 this package (ADR 0147 §3) — so a product keeps
          the whole application range 0x40–0x7F for its own codes. Match them with
          errs.HasCode. Their Public text is the only part that may reach a caller;
          none of them is a 4xx, so a caller only ever reads "internal error".
        type: errs.Code
      - const:
          - doc: |-
              CodeProfileRead reports a profile of the process that could not be written
              or read back. It is in the framework's 0.4.2.* range.
            name: CodeProfileRead
            note: |-
              Profiles: the process's heap and goroutines, folded onto the graph. The
              SDK's profiling package captures, decodes, folds and groups them, in
              the Studio framework/app/studio plugs in (studioengine); kit says whose
              work each sample was. A heap sample is charged to the node
              whose code is on its stack. Dev only: the routes live behind the Studio's
              guard, which only an app that imports the Studio mounts.
            value: "0x00_04_02_30"
        type: errs.Code
      - const:
          - comment: 0.4.2.60 — a scope's value could not be read
            doc: |-
              CodeScopeUnknown reports a scope whose value could not be read at the
              start: no current user, no executable path, no configuration directory.
            name: CodeScopeUnknown
            value: "0x00_04_02_3C"
        type: errs.Code
      - const:
          - comment: "0.4.2.79 — the data copy command cannot do what it was asked: no such database, a product running, a table that holds rows"
            doc: |-
              CodeDataCopy refuses a data copy (ADR 0178 C7): a database the product
              does not declare or cannot open, data kept in memory, a product that
              answers on its address, a table of the database that already holds a
              row; or reports a copy done whose file queues could not be moved aside.
            name: CodeDataCopy
            value: "0x00_04_02_4F"
          - comment: "0.4.2.80 — a data copy's fingerprints differ: the copy is rolled back, the first key that differs named"
            doc: |-
              CodeDataCopyDiverged reports a data copy whose fingerprints differ on
              both sides of a table, or whose records do not open through the framework once
              copied: the copy's transaction is rolled back, and the first key that
              differs is named.
            name: CodeDataCopyDiverged
            value: "0x00_04_02_50"
        type: errs.Code
      - const:
          - comment: "0.4.2.83 — a declaration needs a subsystem whose registration package the program does not import"
            doc: |-
              CodeSubsystemMissing refuses a start whose declarations need a
              subsystem the program does not import (ADR 0179 §6): a store or a
              database without framework/app/store, a server without
              framework/app/server. The refusal is a [DiagnosticsError] naming
              every such declaration and the package to import, all at once; it
              carries this code, which errs.HasCode reads through it.
            name: CodeSubsystemMissing
            value: "0x00_04_02_53"
        type: errs.Code
      - const:
          - comment: "0.4.2.84 — a migration's Down is app.Irreversible: reversing it takes a new forward migration"
            doc: |-
              CodeMigrationIrreversible refuses the Down of a migration declared
              irreversible with [Irreversible] (ADR 0179 step 10): what it changed
              is undone by a new forward migration, never by migrate down.
            name: CodeMigrationIrreversible
            value: "0x00_04_02_54"
        type: errs.Code
      - const:
          - comment: "0.4.2.85 — a runtime name the framework no longer reads was met at the start: the name that replaces it is said"
            doc: |-
              CodeRenamed refuses a start that meets a runtime name the framework
              no longer reads (ADR 0180 §3, Q12): an operator's variable still
              named KIT_<NAME> where the framework reads <PRODUCT>_<NAME>, a
              struct field still tagged kit:"…" where it reads app:"…". Ignored,
              the first would start the product on a default — an empty data
              directory —, the second would store a personal field in clear. The
              refusal is a [DiagnosticsError] naming every old name met and the
              name that replaces it, all at once; it carries this code, which
              errs.HasCode reads through it. The refusal holds for two minors,
              then the old names are forgotten.
            name: CodeRenamed
            value: "0x00_04_02_55"
        type: errs.Code
      - const:
          - comment: "0.4.2.86 — a name at rest the framework moves to its present name is taken too: nothing is moved, both are named"
            doc: |-
              CodeRenameTarget refuses a start that meets what a former release
              kept under the tool's name — a table, the privacy service's
              directory, the dev data directory — while its present name is taken
              too (ADR 0180 step 5): the framework never replaces one with the
              other, so nothing is moved and both are named. What rests under the
              former name stays as it was, readable by the release that wrote it.
            name: CodeRenameTarget
            value: "0x00_04_02_56"
          - comment: "0.4.2.87 — a name at rest could not be moved to its present name: the former stays readable, the next start resumes"
            doc: |-
              CodeRenameFailed refuses a start whose move of a name at rest to its
              present name did not complete (ADR 0180 step 5): a directory the
              system would not rename, a statement the database did not run. What
              was not moved stays under its former name, readable as it was, and
              the next start resumes the move.
            name: CodeRenameFailed
            value: "0x00_04_02_57"
          - comment: "0.4.2.88 — a handler asked for its message to be retried after a delay of its own"
            doc: |-
              CodeRetryIn marks a failure a handler returned through [RetryIn]: the
              queue of the subscription, the watch or the queued command that ran
              it hands the message back with the delay it asked for, the delivery
              counted. It joins the trail of an SDK cause, whose own code a dead
              letter records; any other cause is recorded under it.
            name: CodeRetryIn
            value: "0x00_04_02_58"
          - comment: "0.4.2.89 — a supervised component failed too often and the framework gave it up"
            doc: |-
              CodeGaveUp marks a declared loop the framework stopped running: its
              runs failed more often than its [GiveUpAfter] allows, and the product
              is no longer live until the process restarts. A consumer and a
              hand-written loop give up through the SDK's supervisor, whose own
              code — lifecycle's SupervisorGaveUp — their liveness check answers.
            name: CodeGaveUp
            value: "0x00_04_02_59"
          - comment: 0.4.2.90 — the OTLP export could not be opened, or did not stop within its budget
            doc: |-
              CodeOTLPExport refuses a start whose OTLP export ([OTLP]) cannot be
              opened — its queue, its collector's endpoint, its headers —, and says
              a stop that did not let it flush within its budget.
            name: CodeOTLPExport
            value: "0x00_04_02_5A"
        type: errs.Code
    constants:
      - blockDoc: The environments.
        doc: |-
          EnvDev serves the Studio, analyzes the source and binds loopback. Only
          `kit dev` or an explicit <PRODUCT>_ENV=dev turns it on.
        name: EnvDev
        value: "\"dev\""
      - blockDoc: The environments.
        doc: "EnvProduction is the default: no Studio, no source, no analysis."
        name: EnvProduction
        value: "\"production\""
      - blockDoc: |-
          The SQL dialects an [Engine] speaks: the framework's own names (ADR 0179 Q5), which
