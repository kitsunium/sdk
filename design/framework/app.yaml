      - blockDoc: |-
          The wire codes a caller branches on: an [Error]'s Code, snake_case, kept
          byte-for-byte from the platform's former runtime (ADR 0147 §6). They are named Wire*,
          not Code*, because Code* names a dotted-quad errs.Code in the SDK and the
          registry audit holds every Code* constant to that.
        name: WireRateLimited
        value: "\"rate_limited\""
      - blockDoc: |-
          The wire codes a caller branches on: an [Error]'s Code, snake_case, kept
          byte-for-byte from the platform's former runtime (ADR 0147 §6). They are named Wire*,
          not Code*, because Code* names a dotted-quad errs.Code in the SDK and the
          registry audit holds every Code* constant to that.
        name: WireUnavailable
        value: "\"unavailable\""
      - blockDoc: |-
          The wire codes a caller branches on: an [Error]'s Code, snake_case, kept
          byte-for-byte from the platform's former runtime (ADR 0147 §6). They are named Wire*,
          not Code*, because Code* names a dotted-quad errs.Code in the SDK and the
          registry audit holds every Code* constant to that.
        name: WireTimeout
        value: "\"deadline_exceeded\""
      - blockDoc: |-
          The wire codes a caller branches on: an [Error]'s Code, snake_case, kept
          byte-for-byte from the platform's former runtime (ADR 0147 §6). They are named Wire*,
          not Code*, because Code* names a dotted-quad errs.Code in the SDK and the
          registry audit holds every Code* constant to that.
        name: WireCanceled
        value: "\"canceled\""
      - blockDoc: |-
          The wire codes a caller branches on: an [Error]'s Code, snake_case, kept
          byte-for-byte from the platform's former runtime (ADR 0147 §6). They are named Wire*,
          not Code*, because Code* names a dotted-quad errs.Code in the SDK and the
          registry audit holds every Code* constant to that.
        name: WireInternal
        value: "\"internal\""
      - blockDoc: The marks.
        doc: |-
          Personal marks a field that holds data about a person: personal,
          special, or a record's subject.
        name: Personal
        type: Mark
        value: "\"personal\""
      - blockDoc: The marks.
        doc: Special marks a field of GDPR art. 9(1) or art. 10.
        name: Special
        type: Mark
        value: "\"special\""
      - blockDoc: The marks.
        doc: Moderated marks content others see and a moderator may act on.
        name: Moderated
        type: Mark
        value: "\"moderated\""
      - blockDoc: The overlap policies.
        doc: |-
          OverlapSkip skips the fire, counted, the previous run going on: the
          default, since the framework cannot know that two runs of a job may
          run at once.
        name: OverlapSkip
        type: OverlapPolicy
        value: "\"skip\""
      - blockDoc: The overlap policies.
        doc: OverlapAllow runs the fire beside the previous run.
        name: OverlapAllow
        type: OverlapPolicy
        value: "\"allow\""
      - blockDoc: The overlap policies.
        doc: |-
          OverlapReplace cancels the previous run's context and runs the fire
          once that run returned: the newest fire wins, two runs never overlap.
        name: OverlapReplace
        type: OverlapPolicy
        value: "\"replace\""
      - blockDoc: The two signals an export forwards, as an [OTLPBatchValue] names them.
        doc: |-
          OTLPTraces names the trace signal: an OTLP/JSON
          ExportTraceServiceRequest.
        name: OTLPTraces
        type: string
        value: "\"traces\""
      - blockDoc: The two signals an export forwards, as an [OTLPBatchValue] names them.
        doc: |-
          OTLPMetrics names the metrics signal: an OTLP/JSON
          ExportMetricsServiceRequest.
        name: OTLPMetrics
        type: string
        value: "\"metrics\""
      - blockDoc: |-
          What an export's full queue does with a new batch: the setting
          otlp-when-full spells it.
        doc: |-
          OTLPDropOldest, the default: the oldest batches not being sent are
          taken out, counted dropped, until the new one fits.
        name: OTLPDropOldest
        type: OTLPFullPolicy
        value: "\"drop-oldest\""
      - blockDoc: |-
          What an export's full queue does with a new batch: the setting
          otlp-when-full spells it.
        doc: "OTLPDropNewest: the new batch is refused, counted dropped."
        name: OTLPDropNewest
        type: OTLPFullPolicy
        value: "\"drop-newest\""
      - blockDoc: |-
          What an export's full queue does with a new batch: the setting
          otlp-when-full spells it.
        doc: |-
          OTLPBlock: the span or the snapshot waits for room a few seconds, then
          is refused, counted dropped.
        name: OTLPBlock
        type: OTLPFullPolicy
        value: "\"block\""
    doc: |-
      Package app — who may call an operation: the principal, the rules and their
      checks.

      Package app — activities: what a daemon's idle stop waits for besides its
      connections, a notion of the product's own — sessions still open, work
      still queued.

      Package app — the App: the services a product mounts, served by one process.

      Package app — the static analysis a product can be given: the platform's
      analyzer, run in the background in dev (ADR 0147 §1).

      Package app — process profiles: what an app does with its process (ADR
      0147 §5) — serve, run as a daemon, or run one CLI command — and the
      singleton lock.

      Package app — the architecture the graph draws: where each store keeps its
      data.

      Package app — authentication: the handler that says who calls, and the user
      it names.

      Package app — the build a graph describes: the modules and versions it was
      made of.

      Package app — the catalog of the generic mechanics a node is built from.

      Package app — the app tag: the classes and words a field of personal data
      carries.

      Package app — the plan of a Go type's classified members, computed once per
      type.

      Package app — the walk of a value along its classification plan.

      Package app — the warnings for fields whose name suggests personal data left
      unclassified.

      Package app — CLI commands: a short command of the product that Main runs
      once, in the CLI profile, and whose status is the process's.

      Package app — commands: an operation that changes something, with one
      handler.

      Package app — the app's options and environments.

      Package app — the config command: every setting, its value and where it
      comes from.

      Package app — the consumer that drains a queue into its handler.

      Package app — the daemon: what a running app knows of itself beyond its
      nodes.

      Package app — the daemon's HTTP server as the Studio sees it: its loop,
      its counters, and the middleware every request goes through.

      Package app — the daemon's loops: their states, the scheduler that fires
      the jobs, and the goroutine labels that name them.

      Package app — databases: the SQL engines a store can be kept on.

      Package app — the start's judgement of the declared databases.

      Package app — the interfaces of databases: the engine a connector gives, and
      what the framework asks of it.

      Package app — the migrations a database runs, and their lock.

      Package app — the placement of each store: which database keeps its data.

      Package app — a database in a running app.

      Package app — the databases as the graph shows them.

      Package app — the decoding of a request into its typed value.

      Package app — the dev tools' routes of the Studio, read-only.

      Package app is the implementation of framework/app, the framework in which
      every product is its own diagram. A product imports framework/app, whose
      names alias and forward to this package's: here, the types carry the role
      their name says — StoreService, EndpointService, AppConfigurer — and the
      facade keeps the names a product writes — Store, Endpoint, AppOption.

      Package app — endpoints: an HTTP route and the operation it serves.

      Package app — the errors a product returns to its callers, and their wire
      mapping.

      Package app — exposures: an operation an endpoint serves over HTTP.

      Package app — what an exposure takes, and what it exposes.

      Package app — the Go modules of the running binary, read from its build
      info.

      Package app — the graph: the product as a diagram of what it mounts.

      Package app — history: the former values of the fields that keep them.

      Package app — the history's storage: former values kept beside each record.

      Package app — reading a record's former values.

      Package app — the history as the graph and the Studio show it.

      Package app — what the framework's own writes mean to the history.

      Package app — legal holds: records kept whatever their retention says.

      Package app — secondary indexes of a store.

      Package app — the Studio's read API: the graph, the events, the sources.

      Package app — what the source endpoint needs of the root it reads.

      Package app — how the source endpoint opens a file on Unix.

      Package app — how the source endpoint opens a file on Windows: the link
      itself, never its target.

      Package app — jobs: scheduled work run by the daemon's loop.

      Package app — the privacy journal: what the framework did to personal data, and why.

      Package app — idempotency keys and their leases.

      Package app — the compile-time proof of which roles each declaration plays:
      the interfaces the app reaches its nodes and options through.

      Package app — listeners: inbound ports that are not HTTP, a private socket
      speaking a versioned contract (ADR 0148).

      Package app — the compile-time proof that a listener is a starter.

      Package app — what a listener needs of the socket it accepts on.

      Package app — the product's logger and the logs the Studio shows.

      Package app — loops: work the daemon waits for, woken by time or by events.

      Package app — mailers: a durable outbox and the transport that empties it.

      Package app — what building an SMTP transport needs of its URL.

      Package app — Main: the whole main function of a product.

      Package app — the migrate command.

      Package app — modules: a set of services a product mounts as one.

      Package app — the start's checks of the modules an app mounts.

      Package app — what a module keeps: its stores and its migrations.

      Package app — the mount of a module: its prefix and its bindings.

      Package app — nodes: what every declaration shares, and its source position.

      Package app — the interfaces of nodes: what every declaration is, and the
      roles some play.

      Package app — observation: the spans and events of a running product.

      Package app — operations: a typed request answered by a typed response.

      Package app — the password policy of a store's fields.

      Package app — hashing and verifying passwords under their policy.

      Package app — the warnings for endpoints that set passwords outside a
      policy.

      Package app — ports: an operation a service needs and does not implement.

      Package app — privacy: the framework's own service for holds and the journal.

      Package app — erasure: a record's personal data removed as its retention
      would.

      Package app — export: a person's data as the framework gives it back.

      Package app — a store's personal data as the graph shows it.

      Package app — the keys that index personal data without revealing it.

      Package app — the Studio's privacy pages: the journal, the holds, the
      register.

      Package app — the privacy command.

      Package app — what the privacy command prints.

      Package app — `privacy seal`: a whole store sealed now.

      Package app — the process sample: what the running process uses.

      Package app — the Studio's profiler: the live heap and the goroutines,
      folded onto the graph.

      Package app — queries: an operation that reads and changes nothing.

      Package app — queued commands: a command run later, from its queue.

      Package app — rate limits on an endpoint, per client.

      Package app — records: the product's data as modules and the Studio reach
      it.

      Package app — redaction: what a value shows once its secrets are hidden.

      Package app — the register of processing: each store's line.

      Package app — replacements: a test's substitute for an operation.

      Package app — the HTTP request and response an endpoint can reach.

      Package app — retention: how long a store keeps its personal data.

      Package app — the retention of a store in a running app.

      Package app — one pass of retention: what is due is erased or deleted.

      Package app — record revisions: a store's previous versions of each record.

      Package app — what changed between two versions, and a version written back.

      Package app — where a store's versions are kept, engine by engine.

      Package app — what the privacy rules ask of a record's versions.

      Package app — a record's version written back.

      Package app — what the Studio sees of a record's versions.

      Package app — the revisions command: a version of a record written back.

      Package app — binaries and their process roles: one executable, several
      Apps, and the versioned contracts between them (D22).

      Package app — schemas: the JSON Schema of an operation's types.

      Package app — scopes: the parts of a singleton's lock or of a socket's
      path that are only known at the start — the user, the executable, a
      configuration directory —, so one declaration keeps one process per user,
      per installed copy or per configuration.

      Package app — the current user outside Windows: the process's UID, read
      from the kernel. os/user would ask libc through cgo — linking the program
      dynamically — or read /etc/passwd, for a number the kernel gives at once.

      Package app — the current user on Windows: its SID, from os/user, which
      reads the process token there without cgo.

      Package app — sealing at rest: members sealed where the framework keeps them.

      Package app — where the data keys are, against what they seal.

      Package app — cryptographic erasure: a data key destroyed.

      Package app — a document as it lies at rest, sealed member by member.

      Package app — messages at rest: a queue's members sealed.

      Package app — a store that seals: its records as they rest.

      Package app — a store that seals, as the framework's port sees it.

      Package app — secrets: the values the product declares and the operator
      provides.

      Package app — the secrets command.

      Package app — where the secrets are kept, per environment.

      Package app — services: a bounded context and the building blocks it owns.

      Package app — settings: a value the environment gives a service.

      Package app — the interfaces of settings: the values a setting holds, and
      what the framework reads of a declaration.

      Package app — frontends: static assets the product serves.

      Package app — stores: a typed, keyed collection of entities.

      Package app — the engines a store runs on: memory, files or a database.

      Package app — stores on SQL: the SDK's document store over a database.

      Package app — the framework's own migrations on a database.

      Package app — telemetry: the numbers a product reports, exported on a
      private socket when the deployment asks for them (ADR 0149).

      Package app — topics and subscriptions: asynchronous messages of one type.

      Package app — transactions: app.Transact and its levels.

      Package app — a transaction on a database, the database's own.

      Package app — the data's writer turn, where there are no transactions.

      Package app — a transaction writes one database: the dev warning.

      Package app — watches: how a module hears the writes of a product's marked
      fields.

      Package app — a watch in a running app: its queue and its consumer.

      Package app — the sentences the framework says: English from its own table, the
      languages after it from framework/app/studio's catalogues.

      Package app — workflows: a state machine over the entities of one store.

      Package app — the ports the workflow engine reaches a store through.
    functions:
      - doc: |-
          NewApp declares the product named name, made of services. A module's
          services come with the module: [App.With] mounts it.
        in:
          - name: name
            type: string
          - name: services
            type: "*Service"
        name: NewApp
        out:
          - type: "*App"
        variadic: true
      - doc: |-
          EnableServer makes an app in the server profile serve HTTP.
          framework/app/server calls it as it is imported; a product never does.
        name: EnableServer
      - doc: |-
          EnableStores makes the framework's own store code reachable: what the framework mounts, starts
          and answers for the stores and databases a product declares.
          framework/app/store calls it as it is imported; a product never does.
        name: EnableStores
      - doc: |-
          EnableOTLP makes the framework's own export code reachable: the settings,
          the component, the readiness and the stop of the OTLP export a product
          declares. framework/app/otlp calls it as it is imported; a product never
          does.
        name: EnableOTLP
      - doc: |-
          Analyzer runs fn in the background once the product serves, in dev and when
          KIT_ANALYZE allows it. Without one, the graph is the runtime's alone.
        in:
          - name: fn
            type: AnalyzeFunc
        name: Analyzer
        out:
          - type: AppConfigurer
      - doc: |-
          Profile selects the app's process profile: model.ProfileServer (the
          default), model.ProfileDaemon or model.ProfileCLI.
        in:
          - name: p
            type: string
        name: Profile
        out:
          - type: AppConfigurer
      - doc: |-
          IdleStop makes a daemon stop itself once, for d, no connection was open on
          any of its listeners and no activity of its services (Service.Activity)
          said it was busy: a daemon launched on demand by its clients ends when
          they stop coming. It is refused outside the daemon profile.
        in:
          - name: d
            type: time.Duration
        name: IdleStop
        out:
          - type: AppConfigurer
      - doc: |-
          Singleton keeps one process of the app alive per scope on this machine: the
          start takes an exclusive file lock named after scope in the app's runtime
          directory (pkg/v1/app/lock: flock, LockFileEx) and holds it until the process
          ends. A second process refuses to start with CodeSingletonHeld — for a
          daemon's client, the sign to talk to the one that runs. The kernel drops
          the lock with a dead process.
        in:
          - name: scope
            type: string
        name: Singleton
        out:
          - type: AppConfigurer
      - doc: |-
          SingletonPer keeps one process of the app alive per value of scopes on
          this machine — per user, per installed executable, per configuration
          directory ([PerUID], [PerExecutable], [PerConfigDir], [PerEnv]) —: the lock
          is named after the scopes' key ([ScopeKey]), computed at the start, and
          held as Singleton's is. A client that must find the process computes the
          same key from the same scopes.
        in:
          - name: scopes
            type: ScopeValue
        name: SingletonPer
        out:
          - type: AppConfigurer
        variadic: true
      - doc: |-
          Stop asks the app ctx runs in to end its run: Run returns as it does on a
          signal, its stop draining every component — a daemon told "stop" by its
          client, on its listener, ends itself so. It returns at once, before the
          stop; it reports false when ctx runs in no app — a handler's, a loop's, a
          command's context does — or the app does not run.
        in:
          - name: ctx
            type: context.Context
        name: Stop
        out:
          - type: bool
      - doc: |-
          Auth makes an endpoint require an authenticated caller: the app's auth
          handler runs first, and a request without valid credentials is answered
          401 before the handler runs. A command or a query that asks for one is
          refused 401 when its caller carries no user: an in-process dispatch
          carries its caller's, and is not authenticated again.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: Auth
        out:
          - type: OperationOption
      - doc: |-
          AuthOptional runs the app's auth handler when the request carries
          credentials, and serves anonymous callers too: [UserID] tells which.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: AuthOptional
        out:
          - type: OperationOption
      - doc: |-
          UserID returns the authenticated caller of the request ctx serves, and
          whether there is one. An in-process [EndpointService.Call] carries its caller's
          user along.
        in:
          - name: ctx
            type: context.Context
        name: UserID
        out:
          - type: UID
          - type: bool
      - doc: |-
          AuthData returns what the auth handler said about the caller, and whether
          there is a caller whose data has type D.
        in:
          - name: ctx
            type: context.Context
        name: AuthData
        out:
          - type: D
          - type: bool
        typeParams:
          - constraint: any
            name: D
      - doc: |-
          WithUser returns ctx acting as the given user, with data: what a job, a
          loop or a test uses to call an [Auth] endpoint in-process on someone's
          behalf.
        in:
          - name: ctx
            type: context.Context
          - name: uid
            type: UID
          - name: data
            type: D
        name: WithUser
        out:
          - type: context.Context
        typeParams:
          - constraint: any
            name: D
      - doc: |-
          Catalog lists the generic mechanics the framework offers: the building blocks a node
          composes rather than implements, each one backed by an SDK package. It is
          part of every graph, so the Studio — and an AI agent reading the graph —
          knows what can be added to a product and the exact code that adds it.
        name: Catalog
        out:
          - type: "[]model.Mechanic"
      - doc: |-
          NewID returns a new identifier with the given prefix: a TypeID, time
          ordered, like "todo_01k5zq7m3xe8tvbfg0s7zr4w6c". The prefix must be one to
          sixty-three lower-case letters, with '_' only between two letters; any
          other prefix is a programming error and panics.
        in:
          - name: prefix
            type: string
        name: NewID
        out:
          - type: string
      - doc: |-
          DefaultCommand makes the command Main's default: it runs with every
          argument when the first names no other command — neither one of the
          product's nor one of Main's (serve, help…) —, and with none when there
          is none. Main then never answers a usage error. One command of an app may
          be its default.

          IFACE-OPAQUE: CLIOption is sealed — its one method is unexported — so
          only this package makes one, and a caller only passes it to CLI.
        name: DefaultCommand
        out:
          - type: CommandLineConfigurer
      - doc: |-
          FailSafe makes the command's status always 0: a status line, a prompt
          hook, anything a shell runs on every keystroke must never fail the shell.
          A non-zero status, a start that fails and a panic are logged instead.

          IFACE-OPAQUE: CLIOption is sealed — its one method is unexported — so
          only this package makes one, and a caller only passes it to CLI.
        name: FailSafe
        out:
          - type: CommandLineConfigurer
      - doc: |-
          Queued sends a command to the background. Dispatch returns once the
          command's own queue accepted it — a file queue under the data directory,
          memory without one —, and a consumer handles it, [Parallelism] at a time,
          retried up to [MaxDeliveries] attempts (5) — half a second after the first
          failure, the wait doubling after each, never more than a minute —, then
          dead-lettered; a dispatch that does not decode is dead-lettered at its
          first failure, since no retry makes it decode. It answers nothing: its
          result is [EmptyValue], and exposed, it answers 202 Accepted.

          Delivery is at least once: Queued is the product's promise that the
          handler tolerates a redelivery, and a [Command.Key] narrows the duplicates
          without removing them. The handler runs in the dispatcher's trace, as the
          user who dispatched it ([UserID]); what the auth handler said about that
          user is not queued. A queued command's input is a contract with the
          messages already queued: add a field, never rename one.
        name: Queued
        out:
          - type: CommandConfigurer
      - doc: |-
          NoTransaction runs a command outside a transaction of its own: its
          writes land as its handler makes them, and its effects leave when made —
          a failed command may have written or announced something. On the data
          directory and in memory, where a writing command's transaction takes the
          writer turn, it lets such commands run side by side. Dispatched inside
          another command, it still runs in that one's transaction.
        name: NoTransaction
        out:
          - type: CommandConfigurer
      - doc: |-
          NewCommand is a command no service declares yet: [Service.Command] makes
          one and declares it, which is how a product gets one.
        name: NewCommand
        out:
          - type: "*Command[C, R]"
        typeParams:
          - name: C
          - constraint: any
            name: R
      - doc: Env selects the environment, instead of <PRODUCT>_ENV.
        in:
          - name: env
            type: string
        name: Env
        out:
          - type: AppConfigurer
      - doc: |-
          Listen sets the listening address, instead of <PRODUCT>_ADDR or PORT. ":0" picks
          a free port; App.URL tells which.
        in:
          - name: addr
            type: string
        name: Listen
        out:
          - type: AppConfigurer
      - doc: |-
          DataDir sets where stores and queues persist, instead of <PRODUCT>_DATA_DIR.
          Given to an app after [InMemory], it wins: the last of the two says where
          the data is — so a test helper that runs the product in memory runs it
          on disk with the one option its test gives (apptest.NewDisk).
        in:
          - name: dir
            type: string
        name: DataDir
        out:
          - type: AppConfigurer
      - doc: |-
          Studio switches the Studio on or off in dev. It is always off in
          production.
        in:
          - name: "on"
            type: bool
        name: Studio
        out:
          - type: AppConfigurer
      - doc: Analyze switches the in-process static analysis on or off in dev.
        in:
          - name: "on"
            type: bool
        name: Analyze
        out:
          - type: AppConfigurer
      - doc: Logs sends the app's logs to w instead of standard error.
        in:
          - name: w
            type: io.Writer
        name: Logs
        out:
          - type: AppConfigurer
      - doc: |-
          Clock makes the app read and wait on c instead of the system clock: a
          test drives timer transitions and jobs with a clock.ManualClock.
        in:
          - name: c
            type: clock.Timed
        name: Clock
        out:
          - type: AppConfigurer
      - doc: |-
          InMemory keeps data in memory. On an app, it overrides the data directory
          for every store and queue — <PRODUCT>_DATA_DIR, and a [DataDir] given before it:
          what a test wants. On a store, it keeps that store in memory even when the
          app has a data directory.
        name: InMemory
        out:
          - type: interface{StoreConfigurer; AppConfigurer}
      - doc: |-
          Keeps says what the database keeps: a service's stores, a store, a
          module's stores. The most precise wins: a store kept by name, then its
          service, then its module, then the default database — the one declared
          without Keeps —, then the data directory, then memory. [InMemory] wins
          over all of them, on the app as on a store. The framework's data keys never live on
          SQLite: Keeps(app.Privacy) there keeps its holds and its journal
          ([Privacy]).
        in:
          - name: things
            type: Keeper
        name: Keeps
        out:
          - type: DatabaseConfigurer
        variadic: true
      - doc: |-
          Migrations are migrations, the framework's own [MigrationValue]s (ADR 0179 step
          10), run when the database starts (<name>-migrate: start) or by
          `<product> migrate up`, the framework's own first, each set under its own version
          table — and so its own lock. On MySQL a DDL statement commits by itself:
          write one per migration. The store subsystem runs them: a program that
          declares a database imports framework/app/store, as its engine module
          does.

          Given to [Database], they are the product's, under schema_migrations.
          Given to [NewModule], they are the module's (ADR 0008), for the data it
          keeps outside the framework's stores: run on the database that keeps the module,
          under <module>_migrations.
        in:
          - name: m
            type: MigrationValue
        name: Migrations
        out:
          - type: interface{DatabaseConfigurer; ModuleConfigurer}
        variadic: true
      - doc: |-
          Statements is the [MigrationStep] that runs stmts in order on its
          executor, stopping at the first that fails — whose error it returns as
          the driver said it.
        in:
          - name: stmts
            type: string
        name: Statements
        out:
          - type: MigrationStep
        variadic: true
      - doc: |-
          Irreversible is the Down of a migration that cannot be reversed, said out
          loud rather than left nil: it refuses, with [CodeMigrationIrreversible],
          and `<product> migrate down` below its version stops there.
        in:
          - name: ctx
            type: context.Context
          - name: ex
            type: MigrationExecutor
        name: Irreversible
        out:
          - type: error
      - doc: |-
          Database declares a database the product keeps its stores in, named name,
          on engine — an engine module's, which the product's main imports:

          	import (
          		"github.com/kitsunium/sdk/framework/connectors/postgres"
          		"github.com/kitsunium/sdk/framework/connectors/sqlite"
          	)

          	var App = app.NewApp("vigie", intake.Service, desk.Service, audit.Service).With(
          		// Keeps every store no other database keeps.
          		app.Database("database", postgres.Engine()),
          		// The audit trail apart.
          		app.Database("archive", sqlite.Engine(), app.Keeps(audit.Service)),
          	)

          name is 1 to 49 lower-case letters, digits and dashes, not starting with
          "app-" nor "kit-", unique among the app's databases. It names the database's URL, the
          secret <name>-url — the variable <APP>_<NAME>_URL, or <APP>_<NAME>_URL_FILE
          naming a file that holds it, then the environment's secret store —, and
          its settings: <name>-max-open (10), <name>-max-idle (2), <name>-max-lifetime
          (30m), <name>-max-idle-time (0: none), <name>-timeout (5s), <name>-check-timeout
          (5s) and <name>-migrate (start, or manual). Outside dev the URL is
          required and writes its TLS mode; in dev a database without one leaves its
          stores in the data directory, and a SQLite database without one is the
          file <data>/<name>.sqlite. [InMemory] on the app opens none.
        in:
          - name: name
            type: string
          - name: engine
            type: Engine
          - name: opts
            type: DatabaseConfigurer
        name: Database
        out:
          - type: AppConfigurer
        variadic: true
      - doc: |-
          Name overrides the endpoint's name, which otherwise is its handler's
          function name, or its route when the handler is a function literal.
        in:
          - name: name
            type: string
        name: Name
        out:
          - type: EndpointConfigurer
      - doc: |-
          MaxBody bounds the request body the endpoint reads. The default is
          [DefaultMaxBody].
        in:
          - name: bytes
            type: int64
        name: MaxBody
        out:
          - type: EndpointConfigurer
      - doc: |-
          RateLimit puts a token bucket in front of the handler: perSecond tokens a
          second, up to burst at once. An empty bucket answers 429 at once — with
          Retry-After, the seconds the bucket needs to earn its next token —, or,
          given [MaxWait], once the token due within it did not come. It is the
          SDK's resilience rate limiter.

          The values are the defaults of the operation's settings
          <service>-<kind>-<operation>-rate, -burst and -rate-wait, which config/<env>.* and
          <PRODUCT>_<NAME> override; a rate that is not above zero or a burst below
          one stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: perSecond
            type: float64
          - name: burst
            type: int
          - name: opts
            type: RateLimitConfigurer
        name: RateLimit
        out:
          - type: OperationOption
        variadic: true
      - doc: |-
          Timeout cancels the handler's context after d and answers 504. A caller
          that leaves first is no timeout: its request is recorded as 499, logged as
          information, and nothing it could read is written. It is the SDK's
          resilience timeout, on the app's clock.

          Given to a port's [PortService.Guard], it is a deadline on each attempt of the port's
          call, the innermost of its policies: an attempt that outruns it fails with
          the SDK's TimeoutExceeded, which the port's breaker counts and its retry
          replays.

          d is the default of the operation's setting <service>-<kind>-<operation>-timeout
          — <service>-port-<name>-timeout for a port —, which config/<env>.* and
          <PRODUCT>_<NAME> override; one that is not positive stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: Timeout
        out:
          - type: TimeoutConfigurer
      - doc: |-
          Bulkhead caps how many requests the handler serves at once; the overflow
          answers 503 — at once, or, given [BulkheadQueue] and [MaxWait], once the
          queue is full or the wait ran out. It is the SDK's resilience bulkhead.

          The values are the defaults of the operation's settings
          <service>-<kind>-<operation>-bulkhead, -bulkhead-queue and -bulkhead-wait, which
          config/<env>.* and <PRODUCT>_<NAME> override; a bulkhead below one stops
          the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: maxConcurrent
            type: int
          - name: opts
            type: BulkheadConfigurer
        name: Bulkhead
        out:
          - type: OperationOption
        variadic: true
      - doc: |-
          MaxWait lets a call wait, at most d on the app's clock, instead of being
          refused at once: given to [RateLimit], for a token due within d — the
          calls after it queue behind it —; given to [Bulkhead], for a slot to free,
          in the queue [BulkheadQueue] sizes. A call still refused answers 429 or
          503 as before; a caller that leaves while it waits leaves the queue. Its
          default is no wait, and a negative one stops the start. It is the default
          of the operation's setting <service>-<kind>-<operation>-rate-wait or
          -bulkhead-wait, which config/<env>.* and <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its methods are unexported — so a
          caller only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: MaxWait
        out:
          - type: WaitConfigurer
      - doc: |-
          BulkheadQueue lets up to n calls beyond those a [Bulkhead] runs wait for a
          slot, each for its [MaxWait]: without a wait, or with n at 0, the overflow
          is refused at once, and a negative n stops the start. A call that finds the
          queue full answers 503. It is the default of the operation's setting
          <service>-<kind>-<operation>-bulkhead-queue, which config/<env>.* and
          <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: BulkheadQueue
        out:
          - type: BulkheadConfigurer
      - doc: |-
          Retry runs a port's call again when it fails for a reason of the
          dependency's — what the start answers as a 5xx, a 408 or a 429 —, up to
          maxAttempts attempts in all, waiting between them a backoff that starts at
          delay and doubles, with full jitter, up to [RetryMaxDelay] — 30 seconds
          unless the code says otherwise. A failure that says how long to wait — a
          Retry-After, a rate limiter's next token (the SDK's resilience.RetryAfter)
          — is waited that long instead, held at the longest delay, unless
          [NoRetryAfter]. A refusal of the caller's own is not retried, nor an open
          breaker, a throttle or another retry's exhaustion. It is the SDK's
          resilience retry, on the app's clock, sharing the port's retry budget
          ([Budget]) with its hedge.

          Each retry is an event on the port's span, which counts them, and a
          retry event on the telemetry port.

          The values are the defaults of the port's settings
          <service>-port-<name>-retry-attempts, -retry-delay, -retry-max-delay,
          -retry-jitter (full, decorrelated or none) and -retry-after (whether a
          failure's own delay is honoured), which config/<env>.* and
          <PRODUCT>_<NAME> override; fewer than one attempt, or a delay that is not
          positive, stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: maxAttempts
            type: int
          - name: delay
            type: time.Duration
          - name: opts
            type: RetryConfigurer
        name: Retry
        out:
          - type: PortPolicyConfigurer
        variadic: true
      - doc: |-
          RetryMaxDelay is the longest a [Retry] waits between two attempts: the
          backoff's cap, and the cap on a delay a failure asks for. It is the default
          of the port's setting <service>-port-<name>-retry-max-delay; one that is
          not positive stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: RetryMaxDelay
        out:
          - type: RetryConfigurer
      - doc: |-
          NoRetryAfter makes a [Retry] wait its backoff whatever a failure says: a
          Retry-After, a rate limiter's next token. It is the default of the port's
          setting <service>-port-<name>-retry-after, false, which config/<env>.* and
          <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: NoRetryAfter
        out:
          - type: RetryConfigurer
      - doc: |-
          Budget sizes the retry budget a port's [Retry] and [Hedge] share: a
          bucket of maxTokens tokens, a failure costing one and a success putting
          back tokenRatio; retries and duplicates are refused once half the tokens
          are spent, so a dependency that fails for every caller receives fewer
          extra calls, not every call times the attempts. A port that retries or
          hedges without it has 10 tokens and a ratio of 0.1, gRPC's example; a
          Budget on a port that does neither stops the start. It is the SDK's
          resilience retry budget, one per port and per start.

          The values are the defaults of the port's settings
          <service>-port-<name>-budget-tokens and -budget-ratio, which
          config/<env>.* and <PRODUCT>_<NAME> override; fewer than one token, or a
          ratio below a thousandth, stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: maxTokens
            type: int
          - name: tokenRatio
            type: float64
        name: Budget
        out:
          - type: PortPolicyConfigurer
      - doc: |-
          Breaker stops a port's calls from reaching a dependency that keeps
          failing: after failures failures of the dependency's in a row — or, given
          [BreakerWindow], a share of a window's calls — it opens, and every call
          fails at once with the SDK's CircuitOpen (503) for open; then it lets
          [HalfOpenTrials] trial calls through, one at a time, which close it or open
          it again, for longer each time under [OpenBackoff]. A refusal of the
          caller's own does not count, nor a caller that left, nor a throttle's
          refusal. It is the SDK's resilience circuit breaker, on the app's clock,
          one per port and per start.

          Its state is the product's: a readiness check, breaker:<port>, degraded —
          never unready — while it is not closed; each change of phase logged and
          put on the telemetry port. An operator opens it until reset with the
          product's `breaker isolate PORT` and closes it with `breaker reset PORT`,
          kept in the data directory: a start applies it, and so does a running
          product, within five seconds.

          The values are the defaults of the port's settings
          <service>-port-<name>-breaker-failures, -breaker-open, -breaker-open-max,
          -breaker-trials, -breaker-window, -breaker-window-calls and
          -breaker-window-ratio, which config/<env>.* and <PRODUCT>_<NAME> override;
          a value the breaker cannot run with stops the start, and so does a
          breaker the SDK refuses.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: failures
            type: int
          - name: open
            type: time.Duration
          - name: opts
            type: BreakerConfigurer
        name: Breaker
        out:
          - type: PortPolicyConfigurer
        variadic: true
      - doc: |-
          BreakerWindow makes a [Breaker] open on a rate rather than on failures in
          a row: once the last size of calls holds at least minCalls, a share of
          failures of failureRatio or more opens it. Its values are the defaults of
          the port's settings <service>-port-<name>-breaker-window,
          -breaker-window-calls and -breaker-window-ratio; a window of 0 is none, a
          ratio outside (0, 1] stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: size
            type: time.Duration
          - name: minCalls
            type: int
          - name: failureRatio
            type: float64
        name: BreakerWindow
        out:
          - type: BreakerConfigurer
      - doc: |-
          HalfOpenTrials is how many trial calls in a row must succeed to close a
          [Breaker] once its open time is over — one by default. It is the default
          of the port's setting <service>-port-<name>-breaker-trials; fewer than one
          stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: HalfOpenTrials
        out:
          - type: BreakerConfigurer
      - doc: |-
          OpenBackoff lengthens the open time of a [Breaker] that opens again
          without having closed: it doubles at each opening, from the breaker's open
          time up to max. It is the default of the port's setting
          <service>-port-<name>-breaker-open-max, 0 — the same open time every
          time — without it; a negative one stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: maxOpen
            type: time.Duration
        name: OpenBackoff
        out:
          - type: BreakerConfigurer
      - doc: |-
          Idempotent declares that the port's operation may run more than once for
          one call, concurrently, with no harm done: what a [Hedge] needs, which is
          refused on a port that does not say so. The graph draws it on the port.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: Idempotent
        out:
          - type: PortPolicyConfigurer
      - doc: |-
          Hedge races a port's slow call: an attempt that has not answered after
          delay is joined by a duplicate, and the first to succeed answers — the
          tail of a dependency's latency cut, at the price of more calls. At most
          inFlight duplicates run at once across every call, and the port's retry
          budget ([Budget]) refuses them while the dependency fails for many: then
          the call goes on with the attempts it has. Only a port declared
          [Idempotent] may hedge — the start refuses another. It is the SDK's
          resilience hedge, on the app's clock.

          The values are the defaults of the port's settings
          <service>-port-<name>-hedge-delay, -hedge-in-flight and -hedge-max — the
          duplicates one call may make, 1 —, which config/<env>.* and
          <PRODUCT>_<NAME> override; a delay that is not positive, or fewer than
          one, stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: delay
            type: time.Duration
          - name: inFlight
            type: int
        name: Hedge
        out:
          - type: PortPolicyConfigurer
      - doc: |-
          Throttle refuses, on the caller's side and without sending them, a share
          of a port's calls while the dependency refuses more than 1/k of the
          recent ones — the client-side throttling of Google's SRE book: a call is
          refused with probability (requests − k × accepts) / (requests + 1), over
          the last two minutes, with the SDK's Throttled (503). A refusal is a 5xx,
          a 408 or a 429 of the dependency's; a refusal of the caller's own is an
          accept. It is the SDK's resilience adaptive throttle, on the app's clock;
          2 is the book's k.

          k is the default of the port's setting <service>-port-<name>-throttle-k,
          which config/<env>.* and <PRODUCT>_<NAME> override; a k below 1 stops the
          start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: k
            type: float64
        name: Throttle
        out:
          - type: PortPolicyConfigurer
      - doc: |-
          NewEndpointService is an endpoint no service declares yet:
          [Service.Endpoint] makes one and declares it, which is how a product gets
          one.
        name: NewEndpointService
        out:
          - type: "*EndpointService[Req, Resp]"
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: Invalid reports a request the caller must change before retrying (400).
        in:
          - name: message
            type: string
        name: Invalid
        out:
          - type: "*Error"
      - doc: NotFound reports that the addressed resource does not exist (404).
        in:
          - name: message
            type: string
        name: NotFound
        out:
          - type: "*Error"
      - doc: Conflict reports a request the resource's current state refuses (409).
        in:
          - name: message
            type: string
        name: Conflict
        out:
          - type: "*Error"
      - doc: Unauthenticated reports a caller who did not prove who they are (401).
        in:
          - name: message
            type: string
        name: Unauthenticated
        out:
          - type: "*Error"
      - doc: Forbidden reports a caller who may not do this (403).
        in:
          - name: message
            type: string
        name: Forbidden
        out:
          - type: "*Error"
      - doc: Unavailable reports a transient failure worth retrying later (503).
        in:
          - name: message
            type: string
        name: Unavailable
        out:
          - type: "*Error"
      - doc: |-
          NewError is an error answered with the HTTP status, carrying the wire code
          and the message a caller reads.
        in:
          - name: status
            type: int
          - name: code
          - name: message
            type: string
        name: NewError
        out:
          - type: "*Error"
      - doc: |-
          Anyone says that an exposure is open to everyone, on purpose: its
          operation declares no permission and no rule, and whoever reaches the
          route may run it — a public form, say. It says so on the exposure's node,
          where the diagram and the API page read it. An exposure whose operation
          declares no rule refuses the start unless it says this, or [AnyUser].

          	var Report = Service.Command("report", file).Expose("POST /reports", app.Anyone())

          It adds no authentication: an operation that asks for a user ([Auth])
          takes [AnyUser] instead, and one with [AuthOptional] still knows the
          caller who signed in.
        name: Anyone
        out:
          - type: ExposeConfigurer
      - doc: |-
          AnyUser says that an exposure is open to any signed-in user, on purpose:
          its operation asks for a user ([Auth]) and declares no permission and no
          rule — its handler reads [UserID] and keeps to what that user owns.

          	var MyOrders = Service.Query("my-orders", myOrders, app.Auth()).Expose("GET /orders", app.AnyUser())

          It adds no authentication of its own: an exposure authenticates as its
          operation asks, so the operation declares [Auth].
        name: AnyUser
        out:
          - type: ExposeConfigurer
      - doc: |-
          HoldSubject places a legal hold on every record whose subject is one of
          ids, in every store of the app: an authority's request about a person.
          It holds the records they have now; a record written later is not held.
          reason is kept as Store.Hold keeps it.
        in:
          - name: ctx
            type: context.Context
          - name: reason
            type: string
          - name: ids
            type: string
        name: HoldSubject
        out:
          - type: error
        variadic: true
      - doc: |-
          Unique declares a unique index: no two entities may share a key, and a
          write that would is refused with a [Conflict] error. An empty key is not
          indexed. [StoreService.Lookup] reads it.

          	var Accounts = Service.Store("accounts", Account.Key,
          		app.Unique("email", func(a Account) string { return a.Email }))
        in:
          - name: name
            type: string
          - name: key
            type: func(T) string
        name: Unique
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Index declares an index where an entity may have several keys and a key
          several entities — the users a task is shared with. [StoreService.Find] reads it.
          Empty keys are not indexed.
        in:
          - name: name
            type: string
          - name: keys
            type: func(T) []string
        name: Index
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          EnableStudio makes a serving app in dev mount the Studio's routes, which
          framework/app/studio plugs in (plug.Studio), over a host of the app.
          framework/app/studio calls it as it is imported; a product never does.
        name: EnableStudio
      - doc: |-
          SocketPath places the listener's socket at path — absolute, at most 103
          bytes — instead of <runtime dir of the app>/<service>-<name>.sock.

          IFACE-OPAQUE: ListenerOption is sealed — its one method is unexported —
          so only this package makes one, and a caller only passes it to Listen.
        in:
          - name: path
            type: string
        name: SocketPath
        out:
          - type: ListenerConfigurer
      - doc: |-
          SocketPer names the listener's socket after the value of scopes in this
          process — <runtime dir of the app>/<service>-<name>-<key>.sock, the key
          being [ScopeKey]'s —: one daemon per user, per executable, per
          configuration directory. A client finds it with SocketPathIn or DialIn,
          which compute the same key from the same declaration.

          IFACE-OPAQUE: ListenerOption is sealed — its one method is unexported —
          so only this package makes one, and a caller only passes it to Listen.
        in:
          - name: scopes
            type: ScopeValue
        name: SocketPer
        out:
          - type: ListenerConfigurer
        variadic: true
      - doc: |-
          AllowPeers admits accounts besides the product's own: an on-call group
          declared at deployment. The kernel checks them where it names the peer; the
          socket's directory must still let them through, which is the deployment's
          to arrange.

          IFACE-OPAQUE: ListenerOption is sealed — its one method is unexported —
          so only this package makes one, and a caller only passes it to Listen.
        in:
          - name: uids
          - name: gids
            type: "[]int"
        name: AllowPeers
        out:
          - type: ListenerConfigurer
      - doc: |-
          SocketPathFor is the socket of the listener name of service in product —
          the binary's name for a role of one, else the app's —, placed by default
          and named after scopes (SocketPer): the one rule, for a client of another
          process role that does not import the daemon's declarations (D22) — it
          names the three words and the scopes its contract states. The service is
          its qualified name for a module's.
        in:
          - name: product
          - name: service
          - name: name
            type: string
          - name: scopes
            type: ScopeValue
        name: SocketPathFor
        out:
          - type: string
          - type: error
        variadic: true
      - doc: |-
          NewListener is a listener no service declares yet, speaking contract and
          served by handler: [Service.Listen] makes one and declares it, which is how
          a product gets one.
        in:
          - name: contract
            type: string
          - name: handler
            type: ListenHandler
        name: NewListener
        out:
          - type: "*Listener"
      - doc: |-
          WakeEvery wakes the loop every d.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: WakeEvery
        out:
          - type: LoopConfigurer
      - doc: |-
          WakeAt wakes the loop at the time next returns, asked again after every
          run; false means "no deadline for now". It is how a loop sleeps exactly
          until its next piece of work — the next reminder due — rather than polling.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: next
            type: func(context.Context) (time.Time, bool)
        name: WakeAt
        out:
          - type: LoopConfigurer
      - doc: |-
          WakeOn wakes the loop whenever a message is published on topic. It is a
          nudge, not a subscription: the loop is not handed the message and wakes
          once for a burst — it re-reads the state it works on.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: topic
            type: "*TopicService[T]"
        name: WakeOn
        out:
          - type: LoopConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          GiveUpAfter bounds how often the framework restarts what fails — a
          subscription's, a watch's or a queued command's consumer whose queue
          failed, a hand-written loop ([Service.Go]) that returned, a declared
          loop ([Service.Loop]) whose run failed or panicked —: once it failed
          more than restarts times within within, it is not restarted again, and
          the product is no longer live — its liveness check
          "supervised:<node>" fails, the problem names it — so that whatever
          watches its liveness — an orchestrator's probe — restarts the process; a
          product nothing probes keeps running without it, and says so in its log,
          its problems and its telemetry. It is Erlang's restart
          intensity, the SDK's lifecycle supervisor's GiveUpAfter.

          The default is 10 within 10 minutes: with the restarts' backoff — one
          second, doubling up to a minute — a component that fails at every start
          is given up about five minutes after its first failure, and one that
          fails once a minute or less often is restarted forever. A within of zero
          never gives up; a negative value stops the start.

          restarts and within are the defaults of the settings
          <service>-<kind>-<name>-give-up-restarts and -give-up-within, the kind
          subscription, command or loop, which config/<env>.* and <PRODUCT>_<NAME>
          override.

          IFACE-OPAQUE: the option is sealed — its methods are unexported — so a
          caller only hands it to the declaration it configures.
        in:
          - name: restarts
            type: int
          - name: within
            type: time.Duration
        name: GiveUpAfter
        out:
          - type: SupervisionConfigurer
      - doc: |-
          Overlap says what a fire of the job does while its previous run is still
          going: [OverlapSkip], the default, skips it and counts it; [OverlapAllow]
          runs it beside; [OverlapReplace] cancels the previous run's context and
          runs it once that run returned. Any other word stops the start.

          p is the default of the job's setting <service>-job-<name>-overlap, which
          config/<env>.* and <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: p
            type: OverlapPolicy
        name: Overlap
        out:
          - type: JobConfigurer
      - doc: |-
          StartingDeadline bounds how late a fire of the job may still start: a
          scheduler that comes to a fire more than d after its instant — a machine
          that slept, a run that held the slot — does not run it, and counts it
          missed, as Kubernetes' startingDeadlineSeconds does. The default, zero, is
          no bound: the latest fire missed runs however late, never more than one.
          A negative d stops the start.

          d is the default of the job's setting
          <service>-job-<name>-starting-deadline, which config/<env>.* and
          <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: StartingDeadline
        out:
          - type: JobConfigurer
      - doc: |-
          NewLoop is a loop no service declares yet, whose runs are run:
          [Service.Loop] makes one and declares it, which is how a product gets one.
        in:
          - name: run
            type: func(context.Context, WakeEvent) error
        name: NewLoop
        out:
          - type: "*Loop"
      - doc: |-
          From sets the sender of every message that names none.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: name
          - name: addr
            type: string
        name: From
        out:
          - type: MailerConfigurer
      - doc: |-
          MailAttempts is how many deliveries a message gets before it is
          dead-lettered. The default is 6, backing off from one second.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: MailAttempts
        out:
          - type: MailerConfigurer
      - doc: |-
          OnBounce replaces what the mailer does with a mail it gives up — by
          default, it logs it as an error naming why — with fn: mark an address
          undeliverable, tell an operator, send it another way. fn runs on a
          goroutine of its own once the mailbox is updated — the outbox goes on
          meanwhile, and fn may send mail —, with a context on the mailer's node that
          continues the trace of the Send; the mailer's stop waits for it. A panic in
          fn is logged and changes nothing else. A nil fn keeps the framework's own.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: fn
            type: func(ctx context.Context, b *BounceEvent)
        name: OnBounce
        out:
          - type: MailerConfigurer
      - doc: |-
          MailMaxAge is how long after it was queued a mail may still be retried: an
          attempt that fails later gives it up, as expired, whatever attempts it had
          left. It is the default of the mailer's setting <mailer>-max-age, which
          config/<env>.* and <PRODUCT>_<MAILER>_MAX_AGE override; 0 sets no age. The
          default is 5 days (RFC 5321 §4.5.4.1).

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: MailMaxAge
        out:
          - type: MailerConfigurer
      - doc: |-
          NewMailer is a mailer no service declares yet, with the default attempts:
          [Service.Mailer] makes one and declares it, which is how a product gets
          one.
        name: NewMailer
        out:
          - type: "*Mailer"
      - doc: |-
          NewModule declares a module named name — lower-case letters, digits and
          dashes, starting with a letter; "app", "kit", "external" and "schema" are the framework's — that doc
          describes, made of parts: its services, which it adopts, the modules it
          requires ([Requires]), and the migrations of the data it keeps outside
          the framework's stores ([Migrations]), run on the database that keeps it. Declare it
          as a package-level variable of the one package a product imports:

          	var Module = app.NewModule("moderation",
          		"Reports and moderation under the DSA.\n\nfr: Signalements et modération selon le DSA.",
          		intake.Service, desk.Service, app.Requires(identity.Module))

          A service a module lists is its own: what it declared so far is renamed,
          and what it declares later is born qualified. Listing a service links its
          package; a service is a module's only, and a module's services take
          declarations from the module's own Go module only.
        in:
          - name: name
          - name: doc
            type: string
          - name: parts
            type: ModuleConfigurer
        name: NewModule
        out:
          - type: "*Module"
        variadic: true
      - doc: |-
          Requires says the module needs other: an app that mounts the module and
          not other mounts other at its defaults, and starts it first. The Go import
          this takes makes a cycle impossible. A collaboration a module can do
          without is a port with a fallback instead ([Fallback]).
        in:
          - name: other
            type: "*Module"
        name: Requires
        out:
          - type: ModuleConfigurer
      - doc: |-
          Mount mounts module m with options: [Prefix] serves its routes elsewhere
          than "/<module>/", [Bind] chooses what one of its ports calls.

          	a := app.NewApp("vigie", identity.Service).
          		With(app.Mount(moderation.Module, app.Prefix("/"), app.Bind(moderation.Enforcer, posts.EnforceAPI)))

          A module is mounted once per app: mounted again, its prefix is the last
          one given, and its bindings join the others, the last of a port winning.
        in:
          - name: m
            type: "*Module"
          - name: opts
            type: MountConfigurer
        name: Mount
        out:
          - type: AppConfigurer
        variadic: true
      - doc: |-
          Prefix serves a module's routes under prefix — "/trust/" — instead of
          "/<module>/"; "/" shares the product's route space, where a route both
          declare is refused as any two are. A prefix starts and ends with '/', and
          never lies under /_app/, nor under /_kit/ while its probes answer there.
        in:
          - name: prefix
            type: string
        name: Prefix
        out:
          - type: MountConfigurer
      - doc: |-
          Only makes a mount hold in the environments envs names alone — the name
          <PRODUCT>_ENV or [Env] gives, lower-cased, "production" when neither does:

          	a := app.NewApp("vigie", identity.Service).
          		With(app.Mount(debugbar.Module, app.Only("dev", "staging")))

          Elsewhere the mount is as if it had not been given, its [Prefix] and its
          [Bind] with it; another mount of the module without Only still mounts it.
          Several Only on one mount add up. The start refuses an Only that names no
          environment, a name that cannot be one — lower-case letters, digits and
          dashes inside, 63 at most —, and a module a mounted module requires
          ([Requires]) that its mount leaves out, rather than mounting it at its
          defaults behind the product's back.
        in:
          - name: envs
            type: string
        name: Only
        out:
          - type: MountConfigurer
        variadic: true
      - doc: |-
          MinLength refuses a password shorter than n characters, counted as NIST
          counts them: one per Unicode code point. The default is 15, NIST's figure
          for a password used alone; 8 is the floor NIST allows with a second
          factor, and a smaller n is refused. There is no composition rule, ever:
          NIST says SHALL NOT.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: MinLength
        out:
          - type: PasswordConfigurer
      - doc: |-
          NotReused refuses a password that the current hash, or any of the n
          former ones, verifies — n from 1 to 100. It is a compliance policy, off by
          default: PCI DSS asks for it, OWASP ASVS 4.0.3 asks most products not to
          impose it. The framework keeps the field's last n hashes, so it implies history=n,
          and a tag whose history is smaller than n is refused.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: NotReused
        out:
          - type: PasswordConfigurer
      - doc: |-
          NotCommon refuses a password among the ten thousand most common ones —
          the SDK's password.IsCommon, which compares them without regard to case —:
          the blocklist NIST SP 800-63B-4 requires a verifier to check, beyond the
          three thousand OWASP ASVS 5.0 (6.2.4) asks for. Every policy checks it (ADR
          0007 §2: on by default once the SDK has the list); the option says so
          where a policy is declared. Beside NIST's fifteen characters the list has
          little left to refuse; beside a shorter MinLength, it matters.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: NotCommon
        out:
          - type: PasswordConfigurer
      - doc: |-
          Fallback gives a port an implementation from its own side, which it
          calls when the app binds nothing else: an endpoint — or, with ADR 0005, a
          command or a query — of the port's types. A port given here is refused
          when the app starts.

          	var Enforcer = Service.Port[Measure, Applied]("enforcer", app.Fallback(QueueAPI))

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: op
            type: Operation[Req, Resp]
        name: Fallback
        out:
          - type: PortConfigurer[Req, Resp]
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          Bind makes the app's port call op, whatever implements the port and
          whatever its fallback: an endpoint — or, with ADR 0005, a command or a
          query — of the port's types. A binding is code, the same in every
          environment; a binding to a port, or to a service the app does not mount,
          is refused when the app starts. Given twice for one port, the last wins.

          	a := app.NewApp("vigie", desk.Service, posts.Service).With(app.Bind(desk.Enforcer, posts.EnforceAPI))

          It is an option of [Mount] too, under the same name: there it binds a port
          of the module mounted, and another is refused.

          	a := app.NewApp("shop", posts.Service).With(app.Mount(moderation.Module, app.Bind(moderation.Enforcer, posts.EnforceAPI)))
        in:
          - name: port
            type: "*PortService[Req, Resp]"
          - name: op
            type: Operation[Req, Resp]
        name: Bind
        out:
          - type: interface{AppConfigurer; MountConfigurer}
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          NewPortService is a port no service declares yet: [Service.Port] makes
          one and declares it, which is how a product gets one.
        name: NewPortService
        out:
          - type: "*PortService[Req, Resp]"
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          Erase erases every record whose subject is one of ids, in every store of
          the app, as its retention would — or deletes it where the store says
          app.DeleteOnErasure — and folds the stores it wrote, so that what it
          overwrote leaves their files. A held record is left in place, and the
          result says so: it lists, per store, what was erased, deleted and held.
          Telling the recipients (GDPR art. 19) is the product's job; the register
          lists them. reason is journaled.

          What the framework seals at rest, it erases cryptographically too (ADR 0006 §4): a
          held record is moved under a data key of its own, then the data key of
          each identity, and every data key the erased records were sealed under,
          is destroyed — every copy of what they sealed stops opening: a store's
          former values, a dead letter, a backup. An erasure that failed in a store
          destroys nothing: its retry does.
        in:
          - name: ctx
            type: context.Context
          - name: reason
            type: string
          - name: ids
            type: string
        name: Erase
        out:
          - type: Erasure
          - type: error
        variadic: true
      - doc: |-
          Export returns every record whose subject is one of ids, in every store of
          the app: each without its secret members, with the former values its
          fields keep (ADR 0007) — never a secret field's — and the versions its
          store keeps of it, without their secret members, and per store what
          GDPR art. 15(1) asks beside the data — the purpose, the retention and the
          recipients inside the product. A held record is exported like any other.
          The result is JSON, structured and machine-readable (art. 20); keeping the
          month of art. 12(3) is the product's job, and so is deciding who may call
          it.

          A person known under several identities — a user's ID in one store, an
          e-mail address in another — is found by giving all of them. ctx must run
          inside the app: an endpoint's, a job's, a loop's.
        in:
          - name: ctx
            type: context.Context
          - name: ids
            type: string
        name: Export
        out:
          - type: PersonalData
          - type: error
        variadic: true
      - doc: |-
          NewQuery is a query no service declares yet: [Service.Query] makes one
          and declares it, which is how a product gets one.
        name: NewQuery
        out:
          - type: "*Query[Q, R]"
        typeParams:
          - name: Q
          - constraint: any
            name: R
      - doc: |-
          RateLimitPerClient gives every client of an endpoint a token bucket of its
          own: perSecond tokens a second, up to burst at once. A client is the
          authenticated user when there is one, and the client's address otherwise
          ([ClientIP]); in-process calls through [EndpointService.Call] share one bucket. One
          client emptying its bucket is answered 429, with Retry-After; the others
          are not — which is what a sign-in endpoint needs, where one shared bucket
          would let a single client lock everybody out.

          Buckets unused for ten minutes are forgotten, and at most 10 000 are kept:
          the least recently used goes first. It is the SDK's keyed rate limiter.

          The values are the defaults of the operation's settings
          <service>-<kind>-<operation>-client-rate and -client-burst, which config/<env>.*
          and <PRODUCT>_<NAME> override; a rate that is not above zero or a burst
          below one stops the start.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: perSecond
            type: float64
          - name: burst
            type: int
        name: RateLimitPerClient
        out:
          - type: OperationOption
      - doc: |-
          RecordsOf is [App.Records] for code the app runs and that does not hold
          it — a module's watch, its endpoints: the records port of the store whose
          node ID is store, in the app ctx runs in. Outside a running app it is an
          [Unavailable] error.

          	func Screen(ctx context.Context, w app.Written) error {
          		recs, err := app.RecordsOf(ctx, w.Store)
          		…
          		record, err := recs.Get(ctx, w.Key)
        in:
          - name: ctx
            type: context.Context
          - name: store
            type: string
        name: RecordsOf
        out:
          - type: RecordsService
          - type: error
      - doc: |-
          NewRecordsService is the records of the store port reaches: [App.Records]
          and [RecordsOf] make one for a store the app mounts.
        in:
          - name: port
            type: recordsPort
        name: NewRecordsService
        out:
          - type: RecordsService
      - doc: |-
          Replace runs fn in place of op's code, in the app it is given to: an
          endpoint's handler — or, with ADR 0005, a command's or a query's — or what
          a port calls. It replaces the code, not the mechanics: authentication,
          decoding, validation and the policies still run, and a replaced port needs
          no binding, so a module's tests run without a host. fn takes op's request
          and returns its response, or it does not compile.

          A replaced run's span carries mock: replace, and runtime.mocks lists the
          replacement. It is for tests: the start refuses it in a program go test
          did not build — neither a production binary nor kit dev can carry one.
          Given twice for one operation, the last wins.

          	app := App.With(app.Replace(apps.AppAPI, func(ctx context.Context, in apps.IDInput) (apps.Profile, error) {
          		return apps.Profile{ID: in.AppID}, nil
          	}))
        in:
          - name: op
            type: Operation[Req, Resp]
          - name: fn
            type: func(context.Context, Req) (Resp, error)
        name: Replace
        out:
          - type: AppConfigurer
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          SetCookie adds a Set-Cookie header to the HTTP response of the endpoint
          ctx serves. The framework fills what a cookie left zero with safe defaults — Path
          "/", HttpOnly, SameSite Lax, and Secure outside dev — so a session cookie
          is hardened unless the code says otherwise. In an in-process
          [EndpointService.Call] there is no response: the cookie is dropped.

          HttpOnly is always set, and Secure always outside dev (and in dev for
          SameSite=None, which browsers require): a boolean has no "unset" a default
          could fill, and the framework chooses the hardened reading. A cookie set more than
          once in one response keeps its last value, and cookies set before an error
          are sent with the error — clearing a stale session on a 401 works.
        in:
          - name: ctx
            type: context.Context
          - name: c
            type: "*http.Cookie"
        name: SetCookie
      - doc: ClearCookie tells the browser to forget the cookie called name.
        in:
          - name: ctx
            type: context.Context
          - name: name
            type: string
        name: ClearCookie
      - doc: |-
          ClientIP returns the address of the client of the request ctx serves: the
          connection's peer, or — only when <PRODUCT>_TRUST_PROXY=on — the last address of
          X-Forwarded-For, the one the trusted proxy appended. It is "" outside an HTTP request.
        in:
          - name: ctx
            type: context.Context
        name: ClientIP
        out:
          - type: string
      - doc: UserAgent returns the User-Agent of the request ctx serves, clipped.
        in:
          - name: ctx
            type: context.Context
        name: UserAgent
        out:
          - type: string
      - doc: |-
          Now returns the app's time: the system clock, or the clock a test gave
          with [Clock]. Product code that compares with a deadline reads it rather
          than time.Now, so that a test's manual clock reaches it.
        in:
          - name: ctx
            type: context.Context
        name: Now
        out:
          - type: time.Time
      - doc: |-
          NewTicker is a ticker of period d on the app's clock, for a loop written by
          hand ([Service.Go]): a test's manual clock drives it like every timer the framework
          runs itself, where a time.Ticker would tick on the wall clock whatever the
          test does. It panics on a non-positive d, as time.NewTicker does.
        in:
          - name: ctx
            type: context.Context
          - name: d
            type: time.Duration
        name: NewTicker
        out:
          - type: clock.Ticker
      - doc: After is time.After on the app's clock.
        in:
          - name: ctx
            type: context.Context
          - name: d
            type: time.Duration
        name: After
        out:
          - type: <-chan time.Time
      - doc: |-
          Log returns the app's logger, for the node ctx runs inside. In dev, every
          record it writes inside a span is also kept beside that span, so the
          Studio shows a request's logs with its trace.
        in:
          - name: ctx
            type: context.Context
        name: Log
        out:
          - type: logger.Logger
      - doc: |-
          EraseAfter erases a record's personal data delay after the instant since
          returns — its closing, say; false means "not yet": an open record is never
          due. delay is a duration, or a duration setting.
        in:
          - name: delay
            type: D
          - name: since
            type: func(T) (time.Time, bool)
        name: EraseAfter
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
          - constraint: Delay
            name: D
      - doc: |-
          EraseAt erases a record's personal data at the instant at returns: one the
          product computed and stored on the record — a retention in calendar
          months, one that depends on a tenant.
        in:
          - name: at
            type: func(T) (time.Time, bool)
        name: EraseAt
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: DeleteAfter deletes a record delay after the instant since returns.
        in:
          - name: delay
            type: D
          - name: since
            type: func(T) (time.Time, bool)
        name: DeleteAfter
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
          - constraint: Delay
            name: D
      - doc: DeleteAt deletes a record at the instant at returns.
        in:
          - name: at
            type: func(T) (time.Time, bool)
        name: DeleteAt
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Anonymise says what an erased record keeps: fn runs first, and generalises
          into unclassified fields — a birth date to its year, an address to its
          region; then the framework clears the rest. The framework cannot prove that what remains
          identifies no one: by declaring the function, the product asserts it.
        in:
          - name: fn
            type: func(*T)
        name: Anonymise
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          HeldUntil holds each record until the instant until returns: the law's own
          retention, such as an invoice kept ten years (GDPR art. 17(3)(b)). reason
          is the legal ground, for the register. A held record is exported and
          updated like any other, and neither erased nor deleted.
        in:
          - name: until
            type: func(T) (time.Time, bool)
          - name: reason
            type: string
        name: HeldUntil
        out:
          - type: StoreConfigurer
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Purpose says why the store keeps its records (GDPR art. 30(1)(b)): the
          register lists it, and a person's export carries it.
        in:
          - name: text
            type: string
        name: Purpose
        out:
          - type: StoreConfigurer
      - doc: |-
          DeleteOnErasure makes a person's erasure (app.Erase) delete the store's
          records instead of clearing them, as sessions and accounts want.
        name: DeleteOnErasure
        out:
          - type: StoreConfigurer
      - doc: |-
          RetentionByProduct says the product keeps the store's retention itself:
          its own code erases and deletes what it no longer needs — a record whose
          life the product's own rules end, a lifecycle the framework cannot read from the
          entity. limits says, in the product's words, for how long and how, which
          the register publishes as the store's time limits (GDPR art. 30(1)(f));
          "" says only that the product keeps them.

          The framework then runs no retention for the store, and warns of neither a missing
          retention nor a missing subject. Its classified fields keep every other
          promise: sealed at rest, never shown, exported with their person — when
          the store names one — and erased by app.Erase and Store.Erase. It goes
          with app.Purpose, app.HeldUntil, app.Anonymise and app.DeleteOnErasure;
          with app.EraseAfter, app.EraseAt, app.DeleteAfter or app.DeleteAt it is
          refused: a store's retention is the framework's or the product's, never both.
        in:
          - name: limits
            type: string
        name: RetentionByProduct
        out:
          - type: StoreConfigurer
      - doc: |-
          Revisions keeps the n previous versions of each record of the store, n
          from 1 to 100, as WordPress keeps a post's revisions: every write that
          changes a record makes a version, numbered from 1 and never renumbered,
          stamped with when it was made, the caller's user and the command that
          made it; the oldest beyond n are pruned by the write that makes a newer
          one, unless a legal hold keeps the record.

          	var Pages = Service.Store("pages", Page.Key, app.Revisions(20))

          	revs, err := Pages.Revisions(ctx, id)                            // newest first
          	edits, err := Pages.Diff(ctx, id, revs[3].Number, revs[0].Number)
          	page, err := Pages.Restore(ctx, id, revs[3].Number)              // a new version
          	page, err = Pages.Restore(ctx, id, revs[3].Number, "/title")     // the title only

          A store with Revisions(n) holds up to n+1 times its records: in memory
          with the store in the data directory, in the table <table>___vs on a
          database, which the framework's migrations create.
        in:
          - name: "n"
            type: int
        name: Revisions
        out:
          - type: StoreConfigurer
      - doc: NewBinary declares the binary named name.
        in:
          - name: name
          - name: doc
            type: string
        name: NewBinary
        out:
          - type: "*Binary"
      - doc: |-
          PerEnv is the environment variable name, else fallback when it is unset
          or empty; a leading "~/" in either is the user's home directory. The
          status line's is PerEnv("CLAUDE_CONFIG_DIR", "~/.claude"): one daemon per
          Claude configuration.
        in:
          - name: name
          - name: fallback
            type: string
        name: PerEnv
        out:
          - type: ScopeValue
      - doc: |-
          ScopeKey is the name the scopes give in this process: 16 hex digits of the
          SHA-256 of their values. A client computes the key the daemon computed
          from the same declaration, and so finds its lock or its socket.
        in:
          - name: scopes
            type: ScopeValue
        name: ScopeKey
        out:
          - type: string
          - type: error
        variadic: true
      - doc: |-
          Generated makes the secret the framework's to make: versions of bytes random bytes —
          32 for a key — the first made on the first start, a new one every 30 days,
          the last 3 kept, unless [RotateEvery] and [KeepVersions] say otherwise.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: bytes
            type: int
        name: Generated
        out:
          - type: SecretConfigurer
      - doc: |-
          Optional makes a provided secret one the product can do without — the key
          of a feature that stays off while nobody gives it. A start where it is set
          nowhere goes on; [Secret.Present] says whether it is set now, and a use of
          it while it is absent — [Secret.Value], Seal, Open, Sign or Verify —
          answers an error errs.HasCode matches with [CodeSecretMissing]. It is read
          where it lives at every use, as every provided secret is: given later —
          `secrets set` in the environment's store, a new content in the file its
          _FILE variable names —, it is found at its next use. A generated secret
          is the framework's to make and never absent: Optional with [Generated] is refused.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: Optional
        out:
          - type: SecretConfigurer
      - doc: |-
          RotateEvery is how often the framework makes a new version of a generated secret.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: RotateEvery
        out:
          - type: SecretConfigurer
      - doc: |-
          KeepVersions is how many versions of a generated secret a rotation leaves,
          the new one included: at least 2, so that what the version it replaces
          sealed or signed still opens and verifies. Cover the longest-lived box or
          signature in flight: its lifetime divided by the interval, plus one.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: KeepVersions
        out:
          - type: SecretConfigurer
      - doc: |-
          NewSecret is a secret no service declares yet, rotated and kept as by
          default: [Service.Secret] makes one and declares it, which is how a product
          gets one.
        name: NewSecret
        out:
          - type: "*Secret"
      - doc: |-
          SecretStore keeps the secrets in store instead of the environment's: a
          test gives a store holding what its provided secrets hold. The
          environment's variables are still read first.
        in:
          - name: store
            type: secret.Store
        name: SecretStore
        out:
          - type: AppConfigurer
      - doc: |-
          NewService declares a service. name must be lower-case letters, digits and
          dashes, starting with a letter; doc is one sentence saying what it owns.
        in:
          - name: name
          - name: doc
            type: string
        name: NewService
        out:
          - type: "*Service"
      - doc: |-
          Required drops a setting's default: a start without a value for it fails,
          saying where to give one.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        name: Required
        out:
          - type: SettingConfigurer
      - doc: |-
          Set gives the setting name a value in code, over the environment and the
          files: a value of the setting's type, or its text as a variable would
          hold it. It is for tests.
        in:
          - name: name
            type: string
          - name: value
            type: any
        name: Set
        out:
          - type: AppConfigurer
      - doc: |-
          ConfigFiles gives the framework the product's configuration files: config/config.<ext>,
          which every environment reads, and config/<env>.<ext>, the environment's
          own — <env> being <PRODUCT>_ENV as written, dev when kit dev runs the product —
          in JSON, YAML or TOML (json, yaml or yml, toml). A file maps the names of
          the settings to their values; it never holds a secret, and a key no
          service declares stops the start. The files belong in the binary:

          	//go:embed config
          	var configFiles embed.FS

          	a := app.NewApp("todo", ...).With(app.ConfigFiles(configFiles))
        in:
          - name: fsys
            type: fs.FS
        name: ConfigFiles
        out:
          - type: AppConfigurer
      - doc: |-
          RegisterConfigFormat lets configuration files of extension ext be read
          with the SDK codec format. framework/app/config/yaml and config/toml call
          it as they are imported; a product never does.
        in:
          - name: ext
          - name: format
            type: string
        name: RegisterConfigFormat
      - doc: |-
          NewSettingService is a setting no service declares yet, holding def until
          something sets it: [Service.Setting] makes one and declares it, which is
          how a product gets one.
        in:
          - name: def
            type: T
        name: NewSettingService
        out:
          - type: "*SettingService[T]"
        typeParams:
          - constraint: SettingValue
            name: T
      - doc: |-
          Root serves the sub-directory dir of the file system rather than its root —
          "assets" for a //go:embed assets directive.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: dir
            type: string
        name: Root
        out:
          - type: StaticConfigurer
      - doc: |-
          ReadModel marks a store as derived from others (ADR 0005): written by
          projections — the subscriptions that keep it from the write side's
          events —, read by queries. It changes nothing of how the store runs; the
          diagram draws it on its domain's read side, and the static analysis warns
          of a read model written by anything but a subscription. The framework's topics are
          queues, not logs: a read model cannot be replayed from its events, and one
          fed by a topic lags the commands that feed it — a query that must read its
          own writes reads the write side.

          	var Summaries = Service.Store("summaries", Summary.Key, app.ReadModel())
        name: ReadModel
        out:
          - type: StoreConfigurer
      - doc: |-
          NewStoreService is a store no service declares yet, keying its entities
          with key: [Service.Store] makes one and declares it, which is how a product
          gets one.
        in:
          - name: key
            type: func(T) string
        name: NewStoreService
        out:
          - type: "*StoreService[T]"
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Telemetry exports the app's telemetry on the private socket at path —
          absolute, and short enough for a Unix socket (pkg/v1/proc/ipc) — admitting the groups gids besides the
          product's own account. It wins over <PRODUCT>_TELEMETRY.
        in:
          - name: path
            type: string
          - name: gids
            type: int
        name: Telemetry
        out:
          - type: AppConfigurer
        variadic: true
      - doc: |-
          DesignDigest records the digest of the design the product's code was
          generated from — what the generated wiring passes —, so the telemetry
          handshake can say it and a tool attached to the product can tell a process
          built from another design.
        in:
          - name: digest
            type: string
        name: DesignDigest
        out:
          - type: AppConfigurer
      - doc: |-
          OwnStores lets a watch ([Service.Watch]) hear the stores of its own
          module too — the product's own, for a watch of the product's —, which a
          watch never hears by default. Such a watch never hears the writes its own
          handler makes, in its handler's context — a handler that writes what it
          watches, a screening that stamps the record it screened, would otherwise
          hear itself forever —; a write the handler only causes, later and
          elsewhere — a queued command's handling, a topic's delivery — is heard.
          A subscription to a topic refuses it: a topic has no stores.
        name: OwnStores
        out:
          - type: SubscriptionConfigurer
      - doc: |-
          MaxDeliveries is how many attempts a message gets before it is
          dead-lettered — a subscription's, or a queued command's. The default is
          5.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: MaxDeliveries
        out:
          - type: DeliveryOption
      - doc: |-
          Parallelism is how many messages are handled at once — a subscription's,
          or a queued command's. The default is 1.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: "n"
            type: int
        name: Parallelism
        out:
          - type: DeliveryOption
      - doc: |-
          Drain is how long the message a handler is running when the app stops may
          still run before its context is cancelled — a subscription's, a watch's, or
          a queued command's. A handler that finishes within it is acknowledged; one
          it cuts short is handed back uncounted, delivered again at the next start,
          and is no failure. The default is 5 seconds; zero cancels the handler at
          once, and a negative one stops the start. The app's stop gives each
          component the longest drain plus its settle ([Settle]), and tells every
          consumer at once, so that their drains overlap.

          d is the default of the consumer's setting <service>-<kind>-<name>-drain,
          the kind subscription or command, which config/<env>.* and
          <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: Drain
        out:
          - type: DeliveryOption
      - doc: |-
          Settle bounds each outcome a consumer sends once the app began to stop —
          an acknowledgement, a nack, a message handed back — and each renewal of a
          lease ([AutoExtend]): a queue that stopped answering cannot hold the stop.
          The default is 5 seconds; one that is not positive stops the start.

          d is the default of the consumer's setting <service>-<kind>-<name>-settle,
          which config/<env>.* and <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: Settle
        out:
          - type: DeliveryOption
      - doc: |-
          Lease is how long a delivered message is held by its consumer before the
          queue hands it to another — a subscription's, a watch's, or a queued
          command's. The default is 30 seconds; one that is not positive stops the
          start. With [AutoExtend], a handler that runs longer keeps it.

          d is the default of the consumer's setting <service>-<kind>-<name>-lease,
          which config/<env>.* and <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: Lease
        out:
          - type: DeliveryOption
      - doc: |-
          AutoExtend says whether the lease of the message a handler is running is
          renewed, a third of the lease after it was granted or last renewed, for as
          long as the handler runs — a subscription's, a watch's, or a queued
          command's. It is on by default: a slow handler keeps its message instead of
          seeing it delivered to another while it runs. Off, the handler is stopped a
          margin before its [Lease] ends. A renewal the queue refuses cancels the
          handler's context. A mailer's outbox never renews: the mail spool parks a
          mail by its own lease.

          on is the default of the consumer's setting
          <service>-<kind>-<name>-auto-extend, which config/<env>.* and
          <PRODUCT>_<NAME> override.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: on
            type: bool
        name: AutoExtend
        out:
          - type: DeliveryOption
      - doc: |-
          RetryIn marks cause as a failure to retry in d, no sooner: returned from
          the handler of a subscription, a watch or a queued command, it hands the
          message back to its queue with that delay, in place of the queue's own —
          half a second after a first failure, doubling, never more than a minute —:
          a downstream that answered with a Retry-After, a resource that frees at a
          known instant. The delivery counts as an attempt: a message that used its
          [MaxDeliveries] is dead-lettered with cause, the delay unused. A negative
          d is read as zero.

          	if resp.StatusCode == http.StatusTooManyRequests {
          		return app.RetryIn(30*time.Second, errThrottled)
          	}

          cause keeps its own code, reason and words — what a dead letter records —
          and [CodeRetryIn] joins its trail; a cause that is no error of the SDK's,
          or none, is recorded as CodeRetryIn itself. Outside a consumer's handler
          it is an error like any other.
        in:
          - name: d
            type: time.Duration
          - name: cause
            type: error
        name: RetryIn
        out:
          - type: error
      - doc: |-
          NewTopicService is a topic no service declares yet: [Service.Topic] makes
          one and declares it, which is how a product gets one.
        name: NewTopicService
        out:
          - type: "*TopicService[T]"
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          Transact runs fn in one transaction and returns fn's error: nil commits
          what fn wrote, an error undoes it — a panic too, which then continues.

          	err := app.Transact(ctx, func(ctx context.Context) error {
          		if _, err := Cases.Update(ctx, id, closeCase); err != nil {
          			return err // what this function wrote is undone
          		}
          		if err := Decisions.Insert(ctx, d); err != nil {
          			return err
          		}
          		return Changes.Publish(ctx, Closed{ID: id}) // held: queued at the commit
          	})

          A transaction belongs to one database: the one its first store call
          reaches — at its first call on a database, at its first write on the data
          directory, which counts as one, memory with it. Inside it, a store of
          another database is read as usual; writing one is refused ([Invalid],
          [CodeTransactionSpan]). A Transact inside another is a savepoint: its
          failure undoes its own writes, and the outer transaction goes on if its
          caller handles the error.

          What leaves the process waits for the outermost commit: a topic's
          publish, a queued command's dispatch, a mail — whose outbox ID [Mailer.Send]
          returns at once —, a watch's notice, the store's write hooks that wake
          workflows and loops, a workflow's OnTransition hooks. Each is checked when
          it is made, so a caller's mistake returns to the caller; a rollback drops
          them, and a savepoint's rollback its own. A publish, a dispatch, a mail or a
          notice whose queue lives on the transaction's database — the one that
          keeps the service of its subscription, command, mailer or watch, by a
          store's rules — is written in the transaction, just before it commits, a
          mail sealed under the framework's data-key: a queue that refuses
          it fails the transaction, every write undone, and Transact returns the
          refusal. Every other one leaves after the commit: one a queue refuses then
          is logged and reported, and the commit stands; a process that dies
          between the commit and the release loses what was held.

          On a database the transaction is the database's own, at its default
          isolation. On the data directory and in memory the framework keeps its own: it takes
          the data's writer turn — one transaction at a time; a write outside any
          waits for it, and such writes share the turn among themselves —, its
          writes land at once, and an error writes each entity's previous value
          back, newest first. It is atomic against an error, not against a crash,
          and a reader may see a write before its commit. A store kept in memory by
          [InMemory] — a cache — is in no transaction: its writes land and stay.

          A command's handler runs in one already ([NoTransaction] opts out), and
          so does a workflow's transition.
        in:
          - name: ctx
            type: context.Context
          - name: fn
            type: func(context.Context) error
        name: Transact
        out:
          - type: error
      - doc: |-
          NewWorkflowService is a workflow no service declares yet, over the
          entities of store whose state state reads: [Service.Workflow] makes one and
          declares it, which is how a product gets one.
        in:
          - name: store
            type: "*StoreService[E]"
          - name: state
            type: func(*E) *S
        name: NewWorkflowService
        out:
          - type: "*WorkflowService[E, S]"
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: |-
          OTLP declares that the app forwards its traces and the metrics the
          framework derives from them to an OpenTelemetry collector over OTLP/HTTP:
          the spans the framework starts — the share otlp-sample-ratio keeps —, and
          per node and operation its runs, failures and durations (app.node.runs,
          app.node.failures, app.node.duration), with what the export itself holds
          and lost (app.otlp.*) and the product's own instruments ([Meter]). The
          export is on once its endpoint is set — the setting
          otlp-endpoint, [OTLPEndpoint] its default — or once [OTLPSender] replaces
          the network; a CLI command never exports. A program that declares it
          imports framework/app/otlp, or its start is refused, naming the import:

          	import _ "github.com/kitsunium/sdk/framework/app/otlp"

          	var App = app.NewApp("shop", catalog.Service).With(
          		app.OTLP(app.OTLPEndpoint("http://collector:4318")),
          	)

          Every value given here is the default of the setting that tunes it, which
          config/<env>.* and <PRODUCT>_OTLP_<KNOB> override. Given twice, the last
          wins.
        in:
          - name: opts
            type: OpenTelemetryConfigurer
        name: OTLP
        out:
          - type: AppConfigurer
        variadic: true
      - doc: |-
          OTLPEndpoint is the collector's base URL — "http://collector:4318" —, each
          signal's path (/v1/traces, /v1/metrics) appended to it: the default of
          the setting otlp-endpoint. An absolute http or https URL with a host; the
          empty default leaves the export off.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: url
            type: string
        name: OTLPEndpoint
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPBounds bounds each signal's queue: at most maxBatches batches and
          maxBytes bytes — the defaults of the settings otlp-max-batches (10000)
          and otlp-max-bytes (256 MiB). A batch larger than maxBytes on its own is
          dropped.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: maxBatches
          - name: maxBytes
            type: int
        name: OTLPBounds
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPWhenFull is what a full queue does with a new batch — the default of
          the setting otlp-when-full: [OTLPDropOldest] (the default),
          [OTLPDropNewest] or [OTLPBlock].

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: p
            type: OTLPFullPolicy
        name: OTLPWhenFull
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPMaxAge is how long after it was queued a batch may still be sent — the
          default of the setting otlp-max-age (24h): one older is dropped unsent,
          counted expired. A collector's Retry-After is waited in full, but never
          past it.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: OTLPMaxAge
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPSendTimeout bounds one attempt to send a batch — the default of the
          setting otlp-send-timeout (10s, OTEL_EXPORTER_OTLP_TIMEOUT's).

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: d
            type: time.Duration
        name: OTLPSendTimeout
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPSender replaces the network: each batch is handed to send instead of
          being posted to a collector — the product's own sender, a bridge to
          another transport. The queue, its bounds, its age and its retries stay
          the framework's. A failure send returns is tried again on the backoff —
          after the delay it carries when it is a resilience.RetryAfter's —, but for
          a refusal the caller must fix, an [Error] of a 4xx other than 408 and 429,
          which dead-letters the batch. The export is then on whatever otlp-endpoint
          says. A nil send keeps the network.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: send
            type: func(ctx context.Context, batch OTLPBatchValue) error
        name: OTLPSender
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPSampleRatio is the share of the traces the app starts that the export
          keeps — the default of the setting otlp-sample-ratio (1, every one): from
          0, none, to 1, every one, decided on the trace's identifier, so every
          service that sees the same trace decides alike. A trace another process
          started is kept or not as that process decided, whatever the ratio: a span
          is never cut off from its parent. The metrics the framework derives count
          every unit of work, kept or not.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: ratio
            type: float64
        name: OTLPSampleRatio
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          OTLPDatabase keeps the export's queues on the database the app declares
          under name — the default of the setting otlp-database —, one table per
          signal (app_otlp__traces, app_otlp__metrics), made by the framework's own
          migrations: a backlog then outlives a restart with no data directory —
          a container with no volume — and on the platforms whose file queue the
          SDK refuses. It needs framework/app/queue, which the start names when the
          program does not import it; a name the app does not declare stops the
          start. The empty default keeps the queues in the data directory, else in
          memory.

          IFACE-OPAQUE: the option is sealed — its method is unexported — so a caller
          only hands it to the declaration it configures.
        in:
          - name: name
            type: string
        name: OTLPDatabase
        out:
          - type: OpenTelemetryConfigurer
      - doc: |-
          Meter is the product's own meter, for the app ctx runs inside: the
          counters, gauges and histograms it makes land in the OTLP export's
          metrics stream, under the app's resource and an instrumentation scope
          named after the app, collected every otlp-interval beside the framework's
          own. Without a running export — none declared, the export off, a CLI
          command, or outside an app — it is a meter that keeps nothing. An
          instrument is found again by its name and attributes, so a handler may
          ask for it at each call; its Collect is the export's.
        in:
          - name: ctx
            type: context.Context
        name: Meter
        out:
          - type: metrics.FullMeter
    imports:
      authz: github.com/kitsunium/sdk/pkg/v1/security/authz
      clock: github.com/kitsunium/sdk/pkg/v1/clock
      errs: github.com/kitsunium/sdk/pkg/v1/errs
      fs: io/fs
      http: net/http
      ipc: github.com/kitsunium/sdk/pkg/v1/proc/ipc
      json: encoding/json
      logger: github.com/kitsunium/sdk/pkg/v1/observe/logger
      mail: github.com/kitsunium/sdk/pkg/v1/app/mail
      metrics: github.com/kitsunium/sdk/pkg/v1/observe/metrics
      model: github.com/kitsunium/sdk/framework/model
      secret: github.com/kitsunium/sdk/pkg/v1/security/secret
      stdsql: database/sql
      textproto: net/textproto
    path: github.com/kitsunium/sdk/framework/internal/app
    types:
      - doc: |-
          AttrsProvider is what the app's auth data says about the caller to the
          SDK's authz: the attributes [Command.Allow] and [Query.Allow] hand a
          policy — the caller's roles, its groups. Auth data that does not
          implement it gives none, and every Allow refuses: the start warns of it.

          	type Me struct{ Roles []string }

          	func (m Me) Attrs() []authz.Attr { return []authz.Attr{authz.AttrStrings("roles", m.Roles...)} }

          The framework calls the caller a principal: in the framework, a subject is the person
          personal data is about (ADR 0006).
        interface:
          methods:
            - name: Attrs
              out:
                - type: "[]authz.Attr"
        name: AttrsProvider
      - doc: |-
          ActivityHandler is a declared activity of a service: a function that says
          whether the product is busy. A daemon's IdleStop waits until every
          activity of its mounted services says false AND no connection is open on
          its listeners.
        name: ActivityHandler
        struct:
          unexported: true
      - doc: |-
          App is the whole product: the services it mounts, served by one process.
          The same services can be mounted by several apps — one binary per service,
          or all of them in one — and each app draws exactly what it runs.
        methods:
          - doc: |-
              With returns a new app: the same product, with the options of a and then
              opts — a module among them is mounted. a itself is left as it was, so the
              options a test gives the product's App — an app.Set, an app.Replace — end
              with that test.
            in:
              - name: opts
                type: AppConfigurer
            name: With
            out:
              - type: "*App"
            recv: pointer
            variadic: true
          - doc: Name returns the product name.
            name: Name
            out:
              - type: string
            recv: pointer
          - doc: URL returns the base URL the app listens on, once started.
            name: URL
            out:
              - type: string
            recv: pointer
          - doc: "Handler returns the app's HTTP handler, once started: what httptest wraps."
            name: Handler
            out:
              - type: http.Handler
            recv: pointer
          - doc: |-
              Start brings the product up: it checks every declaration, opens the data
              directory, loads the stores, starts the consumers, the scheduler and the
              HTTP listener — in that order, through the SDK lifecycle, so a failure
              unwinds what already started. It returns once the product serves.
            in:
              - name: ctx
                type: context.Context
            name: Start
            out:
              - type: error
            recv: pointer
          - doc: |-
              Stop drains the product: readiness turns false, then the components stop in
              reverse order — the HTTP listener finishes its requests before the stores
              close.
            in:
              - name: ctx
                type: context.Context
            name: Stop
            out:
              - type: error
            recv: pointer
          - doc: |-
              Run starts the product, serves until ctx ends or the process receives
              SIGINT or SIGTERM, then drains it.

              Goroutine lifecycle: one goroutine turns a signal into the run's
              cancellation; it ends when a signal arrives or when the run returns, which
              cancels the context it also watches.
            in:
              - name: ctx
                type: context.Context
            name: Run
            out:
              - type: error
            recv: pointer
          - doc: |-
              Graph returns the product as a diagram: every node the app mounts with the
              position of its declaration, the edges that exist by construction, the
              edges observed at runtime with their counters, and — in dev, once the
              static analysis has run — the edges found in the handlers' code with their
              call sites. It is what the Studio draws and what `<app> graph` prints.
            name: Graph
            out:
              - type: "*model.Graph"
            recv: pointer
          - doc: |-
              Main is the whole main function of a product:

              	func main() { os.Exit(App.Main(context.Background(), os.Args[1:])) }

              It understands ten commands, so every binary of the framework can describe itself, be
              probed, say its configuration, manage its secrets, migrate its databases,
              answer for the personal data it keeps, replay what its watches hear and
              copy its data directory into a database without a shell or another tool in
              its image:

              	serve        run the product (the default)
              	graph        print the product graph: -format json|mermaid
              	healthcheck  exit 0 when the product running on <PRODUCT>_ADDR is ready
              	config       every setting: its value, never a secret's, and its origin
              	secrets      list the secrets, set one from standard input, rotate one
              	migrate      the databases' migrations: status, up, down SET VERSION
              	privacy      the register of processing, a person's export and erasure,
              	             the legal holds, the privacy journal, the retention
              	revisions    a record's version restored
              	watch        replay WATCH: one notice per record of each store that feeds it
              	data         the data directory copied into a database: data copy --to NAME,
              	             verified by fingerprints

              An app whose port declares a [Breaker] understands breaker too: list the
              breakers, isolate PORT — open its breaker until it is reset — and reset
              PORT, kept in the data directory for every start and a running product.

              A product's CLI command runs when the first argument names it. A command
              declared with DefaultCommand runs when the first argument names no command
              at all — with every argument —, and when there is none, in serve's place:
              Main then never answers a usage error.

              It returns the process exit status rather than exiting, so that deferred
              work runs and a test can call it.
            in:
              - name: ctx
                type: context.Context
              - name: args
                type: "[]string"
            name: Main
            out:
              - type: int
            recv: pointer
          - doc: |-
              Fields lists the fields of the app's stores that carry the mark, store by
              store in the order the app mounts them, each in its entity's order.
              Personal lists special fields too: they are personal data.
            in:
              - name: m
                type: Mark
            name: Fields
            out:
              - type: "[]FieldRefValue"
            recv: pointer
          - doc: |-
              Records returns the untyped port to the records of the store whose node ID
              is store: what the framework's export and erasure run on, and what a module reads
              and erases through. A store the app does not mount is a [NotFound] error.
            in:
              - name: store
                type: string
            name: Records
            out:
              - type: RecordsService
              - type: error
            recv: pointer
        name: App
        struct:
          unexported: true
      - doc: |-
          DiagnosticsError is returned by Start when declarations are wrong. It lists
          every problem at once, each with its position.
        methods:
          - doc: Error lists every problem the start found, one per line.
            name: Error
            out:
              - type: string
            recv: pointer
          - doc: |-
              Unwrap is what the refusal is, when the framework has a code for it: with
              packages in Missing, an error carrying [CodeSubsystemMissing] (ADR
              0179 §6); with names in Renamed, one carrying [CodeRenamed] (ADR 0180
              §3); both joined when the start found both. errs.HasCode reads either
              through the refusal; nil when it found neither.
            name: Unwrap
            out:
              - type: error
            recv: pointer
        name: DiagnosticsError
        struct:
          fields:
            - name: Diagnostics
              type: "[]model.Diagnostic"
            - doc: |-
                Missing are the registration packages the program does not import
                and a declaration needs (ADR 0179 §6), sorted; nil when none is.
              name: Missing
              type: "[]string"
            - doc: |-
                Renamed are the old runtime names the start met (ADR 0180 §3, Q12),
                each written "<old> -> <new>" — "KIT_DATA_DIR -> TODO_DATA_DIR",
                `shop.Report.Email kit:"personal" -> app:"personal"` —, sorted; nil
                when none was.
              name: Renamed
              type: "[]string"
      - doc: |-
          AnalyzeFunc reads the product's source — the Go module rooted at dir, and
          the packages that declare the modules it mounts — into a graph the runtime
          merges into its own: the edges found in handler bodies, each function's
          steps. The framework links no analyzer (ADR 0147 §1): the platform's former runtime
          tool gives one, in dev, through [Analyzer].
        name: AnalyzeFunc
        underlying: func(ctx context.Context, dir string, modules []string) (*model.Graph, error)
      - doc: |-
          UID identifies an authenticated user. It is what the auth handler returns
          and what every endpoint reads with [UserID].
        name: UID
        underlying: string
      - doc: |-
          AuthenticatorHandler is the app's authentication handler: it turns the
          credentials of a request — a session cookie, a bearer token — into a user,
          in front of every endpoint declared with [Auth] or [AuthOptional]. An app
          has at most one.

          P is the credentials: a struct whose fields are tagged cookie:"…" or
          header:"…", decoded like an endpoint's request. D is what the handler says
          about the user; endpoints read it with [AuthData].
        name: AuthenticatorHandler
        struct:
          unexported: true
        typeParams:
          - name: P
          - constraint: any
            name: D
      - doc: |-
          StdioValue is where a CLI command reads and writes: the process's own streams
          under Main, buffers in a test.
        name: StdioValue
        struct:
          fields:
            - doc: In is the command's standard input.
              name: In
              type: io.Reader
            - doc: Out and Err are its standard output and error.
              name: Out
            - doc: Out and Err are its standard output and error.
              name: Err
              type: io.Writer
            - doc: Interactive reports whether In is a terminal.
              name: Interactive
              type: bool
      - doc: |-
          CLIFunc is a CLI command's body: its arguments after its name, and the
          streams; it returns the process exit status (0 success, 64 usage, 70
          software — the sysexits a shell script branches on).
        name: CLIFunc
        underlying: func(ctx context.Context, args []string, std StdioValue) int
      - doc: |-
          CLI is a short command-line command of the product: it runs once, in the
          CLI profile, and exits with its status. Main runs it when the process's
          first argument is its name.
        name: CLI
        struct:
          unexported: true
      - doc: CommandLineConfigurer tunes a CLI command.
        interface:
          unexported: true
        name: CommandLineConfigurer
      - doc: |-
          Command changes something: a typed input, a typed result, and one handler
          — the one declared with it. Declare it with [Service.Command]; dispatch it
          with [Command.Dispatch] from any building block, which draws a dispatches
          edge from the caller; give it a route with [Command.Expose]. A command is
          internal until it is exposed: how one service has another change
          something.

          A dispatch runs, in this order: the caller's user when the command asks
          for one ([Auth], implied by [Command.Allow]) — an in-process dispatch
          carries its caller's and is not authenticated again —, the input's
          validate tags, the policies ([RateLimit], [RateLimitPerClient],
          [Timeout], [Bulkhead]), the key ([Command.Key]), the transaction, the
          authorization ([Command.Allow], then [Command.Authorize]), then the
          handler. A queued command ([Queued]) is checked at its dispatch, as its
          caller — its validate tags, its authorization, its key —, and handled by
          its queue's consumer, the policies around the handling, its key then its
          transaction around the handler.

          A command is its unit of work (ADR 0004): its authorization and its
          handler run in one transaction ([Transact]), opened once its key is held,
          which holds its effects — a publish, a mail, a queued command's dispatch
          — until the commit. A failed command changes nothing and announces
          nothing; one dispatched inside another runs in its transaction.
          [NoTransaction] opts a command out.
        methods:
          - doc: |-
              Allow makes the command need a permission, as data: the app's policy
              must let the caller — its user, with the attributes its auth data gives
              when it implements [AttrsProvider] — do action to resource. The SDK's authz
              decides, and closes toward refusal: a role with no grant abstains, and an
              abstention is refused. Allow implies [Auth]; given twice, both
              permissions are needed. The refusal is 403 permission_denied, one
              sentence whatever the cause.

              	var PlaceOrder = Service.Command("place-order", placeOrder).Allow(Policy, "place", "order")
            in:
              - name: policy
                type: authz.Policy
              - name: action
              - name: resource
                type: string
            name: Allow
            out:
              - type: "*Command[C, R]"
            recv: pointer
          - doc: |-
              Authorize gives the command a rule that needs the data — the ownership
              of what the input names, the membership of an organisation: fn sees the
              input and, through its context, the caller ([UserID], [AuthData]), and
              returns nil, [Forbidden], [NotFound] — to hide what exists — or an
              authz.Check of its own. It runs last before the handler, after
              [Command.Allow], under the command's key; its refusal is 403
              permission_denied, one sentence whatever the cause, and a NotFound or an
              Unauthenticated stays what it is. The static analysis reads fn as the
              command's code: the store it reads is the command's edge.
            in:
              - name: fn
                type: func(context.Context, C) error
            name: Authorize
            out:
              - type: "*Command[C, R]"
            recv: pointer
          - doc: |-
              Key names the entity the command is about: two runs of the command with
              one key never overlap — the second waits, within its context's deadline
              —, runs with different keys go at once, and a queued command whose key
              waits or runs is not queued again until it is handled or dead-lettered. A
              handler that dispatches its own command with its own key is refused
              ([CodeCommandReentrant]), never a deadlock. An input whose key is empty
              is refused. The key is the span's instance: the Studio filters the runs
              of one entity.

              It is the SDK's lock, in the process: across a restart or between
              processes, one key can run twice — a handler stays idempotent.
            in:
              - name: fn
                type: func(C) string
            name: Key
            out:
              - type: "*Command[C, R]"
            recv: pointer
          - doc: |-
              Expose declares an endpoint that dispatches the command, on route —
              "METHOD /path/{param}" — with the options an endpoint takes
              ([RateLimitPerClient], [MaxBody], [Name]). It is an endpoint, named after
              the command — [Name] for a second exposure —, its request decoded as
              strictly as any, authenticated when the command asks for a user; the rest
              — validation, key, authorization — is the command's, so an exposed
              dispatch and an in-process one are checked alike. It answers 200 with the
              result, 204 for [EmptyValue], 202 for a queued command.

              An exposed command says who may run it: a permission ([Command.Allow]), a
              rule ([Command.Authorize]), or, when it declares neither, a marker that
              it is open on purpose — [Anyone], or [AnyUser] for any signed-in user.
              The start refuses an exposure that says none of them. A command nobody
              exposes is internal: the code that needs it dispatches it.
            in:
              - name: route
                type: string
              - name: opts
                type: ExposeConfigurer
            name: Expose
            out:
              - type: "*Command[C, R]"
            recv: pointer
            variadic: true
          - doc: |-
              Dispatch runs the command for the node ctx runs inside — in a span on the
              command, its caller's dispatches edge —, through its whole pipeline, and
              returns its result; a queued command returns once its queue accepted it.
              The caller's user goes with it.
            in:
              - name: ctx
                type: context.Context
              - name: in
                type: C
            name: Dispatch
            out:
              - type: R
              - type: error
            recv: pointer
          - doc: |-
              DispatchAt queues a dispatch of the queued command that its consumer
              handles no sooner than at — a reminder, a trial that ends, an order
              cancelled if still unpaid —, checked now as [Command.Dispatch] checks it,
              as its caller: its validate tags, its authorization, its key. It returns
              once the command's queue accepted it; inside a transaction it is held to
              the commit as a dispatch is. A dispatch whose key ([Command.Key]) waits —
              for later too — or runs is not queued again. An instant already past is
              now. A command that is not queued refuses it: only a queue holds a
              dispatch until its instant. It is the SDK's queue.PublishAt.
            in:
              - name: ctx
                type: context.Context
              - name: in
                type: C
              - name: at
                type: time.Time
            name: DispatchAt
            out:
              - type: error
            recv: pointer
        name: Command
        struct:
          unexported: true
        typeParams:
          - name: C
          - constraint: any
            name: R
      - doc: |-
          CommandConfigurer configures a command: [Queued]; the options every operation
          takes — [Auth], [AuthOptional], [RateLimit], [RateLimitPerClient],
          [Timeout], [Bulkhead]; and, for a queued one, [MaxDeliveries] and
          [Parallelism].
        interface:
          unexported: true
        name: CommandConfigurer
      - doc: AppConfigurer configures an app. Options win over the environment.
        interface:
          unexported: true
        name: AppConfigurer
      - doc: |-
          DatabaseURLValue is what a database's URL points at, as its engine describes it
          for the graph, the Studio, the logs and every error: never a user, never a
          password, never a parameter.
        name: DatabaseURLValue
        struct:
          fields:
            - doc: "Driver is the Go driver the engine speaks through: \"pgx\"."
              name: Driver
              type: string
            - doc: |-
                Address is where the server listens, host:port; a local socket's
                path; empty for a file.
              name: Address
              type: string
            - doc: Database is the database on the server, or the file.
              name: Database
              type: string
            - doc: |-
                TLS is the TLS mode as the URL writes it — "verify-full", "true" —,
                empty when the URL leaves it to the driver.
              name: TLS
              type: string
            - doc: |-
                Plaintext says the mode the URL writes turns TLS off — sslmode=disable,
                tls=false —: accepted, for a private network, and drawn "no TLS".
              name: Plaintext
              type: bool
            - doc: |-
                Networked says the connection crosses a network, over TCP: outside
                dev, its URL must write its TLS mode.
              name: Networked
              type: bool
      - doc: |-
          Dialect is the SQL an [Engine] speaks: [DialectPostgres], [DialectMySQL] or
          [DialectSQLite], the framework's own names (ADR 0179 Q5) — the graph names the
          engine by it.
        name: Dialect
        underlying: string
      - doc: |-
          Engine is an SQL engine a database runs on. An engine module returns one —
          github.com/kitsunium/sdk/framework/connectors/postgres, …/mysql, …/sqlite —;
          the framework calls it when the database starts. Like an SDK port, it grows by
          sibling interfaces, never by a method.
        interface:
          methods:
            - doc: Dialect is the SQL it speaks.
              name: Dialect
              out:
                - type: Dialect
            - doc: |-
                Describe says what url points at — the driver, host and port, the
                database, the TLS mode as written — for the graph and the logs: never
                a user, never a password.
              in:
                - name: url
                  type: secret.Value
              name: Describe
              out:
                - type: DatabaseURLValue
                - type: error
            - doc: |-
                Open opens the pool url names. Before each new connection it asks
                current for the URL as it is now.
              in:
                - name: url
                  type: secret.Value
                - name: current
                  type: func(context.Context) (secret.Value, error)
              name: Open
              out:
                - type: "*stdsql.DB"
                - type: error
        name: Engine
      - doc: |-
          LockWaiter is an [Engine] whose connections wait a bounded time for a lock
          another connection holds — SQLite's busy timeout —, a sibling of Engine
          (ADR 0178 C2). The framework opens such an engine's pool with OpenWaiting instead
          of Open, and gives it a wait under <name>-timeout, so that a lost race on
          the lock comes back as the engine's refusal before the call's own
          deadline. An engine that does not implement it keeps its own wait.
        interface:
          methods:
            - doc: |-
                OpenWaiting opens the pool url names, as Open does, its connections
                waiting wait for a lock when url writes no wait of its own.
              in:
                - name: url
                  type: secret.Value
                - name: current
                  type: func(context.Context) (secret.Value, error)
                - name: wait
                  type: time.Duration
              name: OpenWaiting
              out:
                - type: "*stdsql.DB"
                - type: error
        name: LockWaiter
      - doc: "DatabaseConfigurer configures a database: [Keeps], [Migrations]."
        interface:
          unexported: true
        name: DatabaseConfigurer
      - doc: |-
          Keeper is what a database keeps: a service — every store it declares —,
          a store, or a module (ADR 0008) — every store of its services.
        interface:
          unexported: true
        name: Keeper
      - doc: |-
          MigrationValue is one versioned change of a database's schema and its
          reversal, the framework's own (ADR 0179 step 10): the shape the SDK's sql runs,
          which the store subsystem hands it.

          	app.Migration{
          		Version: 20261017120000,
          		Name:    "notes",
          		Up:      app.Statements("CREATE TABLE notes (id TEXT PRIMARY KEY, body TEXT)"),
          		Down:    app.Statements("DROP TABLE notes"),
          	}
        name: MigrationValue
        struct:
          fields:
            - doc: |-
                Version orders the migration in its set: non-zero and unique; a UTC
                timestamp is the convention, so that two branches do not collide.
              name: Version
              type: uint64
            - doc: Name labels it in the version table; required.
              name: Name
              type: string
            - doc: Up applies the change; required.
              name: Up
              type: MigrationStep
            - doc: |-
                Down reverses it; required — [Irreversible] says out loud that it
                cannot be reversed.
              name: Down
              type: MigrationStep
      - doc: |-
          MigrationStep is one direction of a migration, run on ex — the
          transaction its version row is written in, so that both commit
          together.
        name: MigrationStep
        underlying: func(ctx context.Context, ex MigrationExecutor) error
      - doc: |-
          MigrationExecutor is what a migration's step runs its statements on: a
          transaction, which a step cannot end.
        interface:
          methods:
            - doc: ExecContext runs a statement that returns no rows.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: ExecContext
              out:
                - type: stdsql.Result
                - type: error
              variadic: true
            - doc: QueryContext runs a query that returns rows; the caller closes them.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: QueryContext
              out:
                - type: "*stdsql.Rows"
                - type: error
              variadic: true
            - doc: QueryRowContext runs a query that returns at most one row.
              in:
                - name: ctx
                  type: context.Context
                - name: query
                  type: string
                - name: args
                  type: any
              name: QueryRowContext
              out:
                - type: "*stdsql.Row"
              variadic: true
        name: MigrationExecutor
      - doc: |-
          EmptyValue is the request or the response of an endpoint that has none. An
          endpoint answering EmptyValue replies 204 No Content.
        name: EmptyValue
        struct: {}
      - doc: |-
          EndpointService is an HTTP endpoint with a typed request and a typed response:
          what HTTP itself is about — a webhook a third party calls, say —, the
          exposure of a command or a query ([Command.Expose], [Query.Expose]), or
          the implementation of a port ([Service.Implement]). A business operation
          is a command or a query, which other code runs with [Command.Dispatch]
          and [Query.Ask] and HTTP reaches through its exposure.
        methods:
          - doc: |-
              Call runs the endpoint in-process, from another building block: the same
              validation, the same policies, the same handler, and a calls edge in the
              diagram from the caller to this endpoint. A port calls its implementation
              so. Services run each other's operations as commands and queries
              ([Command.Dispatch], [Query.Ask]); calling a handler function directly
              works, but the product cannot see it.
            in:
              - name: ctx
                type: context.Context
              - name: req
                type: Req
            name: Call
            out:
              - type: Resp
              - type: error
            recv: pointer
        name: EndpointService
        struct:
          unexported: true
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: EndpointConfigurer configures an endpoint; each is an [ExposeConfigurer] too.
        interface:
          embeds:
            - ExposeConfigurer
          unexported: true
        name: EndpointConfigurer
      - doc: |-
          OperationOption configures an endpoint, a command or a query alike: the
          authentication it asks for ([Auth], [AuthOptional]) and the policies in
          front of its handler ([RateLimit], [RateLimitPerClient], [Timeout],
          [Bulkhead]).
        interface:
          embeds:
            - EndpointConfigurer
            - CommandConfigurer
            - QueryConfigurer
        name: OperationOption
      - doc: RateLimitConfigurer configures a [RateLimit].
        interface:
          unexported: true
        name: RateLimitConfigurer
      - doc: BulkheadConfigurer configures a [Bulkhead].
        interface:
          unexported: true
        name: BulkheadConfigurer
      - doc: WaitConfigurer configures a [RateLimit] and a [Bulkhead] alike.
        interface:
          embeds:
            - RateLimitConfigurer
            - BulkheadConfigurer
        name: WaitConfigurer
      - doc: |-
          PortPolicyConfigurer guards the calls a port makes: [Retry], [Budget],
          [Breaker], [Hedge], [Idempotent], [Throttle] and [Timeout], given to
          [PortService.Guard].
        interface:
          unexported: true
        name: PortPolicyConfigurer
      - doc: |-
          TimeoutConfigurer configures an endpoint, a command, a query and a port
          alike: [Timeout].
        interface:
          embeds:
            - OperationOption
            - PortPolicyConfigurer
        name: TimeoutConfigurer
      - doc: RetryConfigurer configures a [Retry].
        interface:
          unexported: true
        name: RetryConfigurer
      - doc: BreakerConfigurer configures a [Breaker].
        interface:
          unexported: true
        name: BreakerConfigurer
      - doc: |-
          Error is an error a product returns to its callers. Message travels on the
          wire; the cause attached with [Error.Wrap] is logged and never sent.

          Return one from a handler to choose the HTTP status and the message the
          caller reads. Any other error becomes a 500 whose body says nothing about
          it: an error message is the classic place a secret leaks from.
        methods:
          - doc: Error renders the code and the message. It never renders the cause.
            name: Error
            out:
              - type: string
            recv: pointer
          - doc: Unwrap returns the cause, so errors.Is and errors.As see through an Error.
            name: Unwrap
            out:
              - type: error
            recv: pointer
          - doc: Wrap attaches the underlying cause, for the logs. It returns a copy.
            in:
              - name: cause
                type: error
            name: Wrap
            out:
              - type: "*Error"
            recv: pointer
        name: Error
        struct:
          fields:
            - doc: Status is the HTTP status.
              name: Status
              type: int
            - doc: Code is a stable, snake_case identifier a client can branch on.
              name: Code
              type: string
            - doc: Message is wire-safe text for the caller.
              name: Message
              type: string
            - doc: Violations detail an invalid request, one per failed rule.
              name: Violations
              type: "[]ViolationMessage"
          unexported: true
      - doc: |-
          ViolationMessage is one validation rule a request failed: where, which rule, and
          why — never the value.
        name: ViolationMessage
        struct:
          fields:
            - doc: "Path locates the value: \"title\", \"items[2].zip\"."
              name: Path
              tag: json:"path"
              type: string
            - doc: "Rule names the failed rule: \"required\", \"maxlen\"."
              name: Rule
              tag: json:"rule"
              type: string
            - doc: Message explains it without echoing the value.
              name: Message
              tag: json:"message"
              type: string
      - doc: |-
          ExposeConfigurer configures an exposure ([Command.Expose], [Query.Expose]):
          every [EndpointConfigurer] — [Name], [MaxBody], [RateLimitPerClient]… — and
          the markers that say who may run an operation declaring no rule of its
          own: [Anyone], [AnyUser].
        interface:
          unexported: true
        name: ExposeConfigurer
      - doc: |-
          Job is scheduled work: a piece of the daemon's internal loop. It runs on
          the SDK scheduler, whose decisions about time are documented rather than
          emergent: a fire that is due while the previous run of the same job is
          still going is skipped and counted, and a missed deadline is skipped and
          counted, never caught up.
        name: Job
        struct:
          unexported: true
      - doc: |-
          ListenHandler serves one connection of a [Listener] until it returns; the
          connection is closed after it. conn.Peer says who connected, as the kernel
          says where it can (pkg/v1/proc/ipc).
        name: ListenHandler
        underlying: func(ctx context.Context, conn *ipc.Conn) error
      - doc: |-
          Listener is an inbound port that is not HTTP: a private socket on this
          machine — a Unix socket in a directory only the product's account can
          reach, the kernel naming the peer on Linux (ADR 0148) — speaking a
          versioned contract. It is how a daemon profile serves its clients, and how
          two process roles of one binary talk (D22): through the contract, never
          through each other's code.
        methods:
          - doc: |-
              SocketPathIn is where the listener's socket lies in product — the
              binary's name for a role of one, else the app's —: its SocketPath, else
              <runtime dir of product>/<service>-<name>.sock, with SocketPer's key before
              the extension. A client of another process role computes the daemon's path
              with it.
            in:
              - name: product
                type: string
            name: SocketPathIn
            out:
              - type: string
              - type: error
            recv: pointer
          - doc: |-
              DialIn connects to the listener as run in product, from another process —
              a client role of the same binary —: the path SocketPathIn computes, the
              checks Dial makes.
            in:
              - name: ctx
                type: context.Context
              - name: product
                type: string
            name: DialIn
            out:
              - type: "*ipc.Conn"
              - type: error
            recv: pointer
          - doc: Path is where the listener listens while the app runs; "" otherwise.
            name: Path
            out:
              - type: string
            recv: pointer
          - doc: |-
              Dial connects to the listener as a client of the same account would: the
              same checks, from the same configuration. A test and a sibling role use it.
            in:
              - name: ctx
                type: context.Context
            name: Dial
            out:
              - type: "*ipc.Conn"
              - type: error
            recv: pointer
        name: Listener
        struct:
          unexported: true
      - doc: ListenerConfigurer tunes a listener.
        interface:
          unexported: true
        name: ListenerConfigurer
      - doc: |-
          Loop is a declared loop of the daemon: the framework owns the wait, the product owns
          the work. Its wake sources — a period, a deadline the product computes, a
          topic — are data, so the diagram draws exactly what wakes it; the framework runs it on
          its own goroutine, one run at a time, observes every run, and restarts it
          after a panic.
        methods:
          - doc: |-
              Nudge wakes the loop now, as if its deadline had come. The run's reason
              is model.WakeManual; a nudge also cuts short the backoff after a failure.
              It does nothing while the loop is not running.
            name: Nudge
            recv: pointer
        name: Loop
        struct:
          unexported: true
      - doc: |-
          WakeEvent says why a declared loop runs: the reason, the instant, and the
          topic that woke it when one did. Wakes that come while it runs, or while
          it backs off after a failure, are gathered into one run: Reasons and
          Topics say every one of them, and Reason the one that decides the run.
        name: WakeEvent
        struct:
          fields:
            - doc: |-
                Reason is model.WakeInterval, WakeDeadline, WakeTopic, WakeStart or
                WakeManual: WakeManual when a nudge is among the wakes the run
                gathers — the one wake that cuts a backoff short —, else the first
                that came.
              name: Reason
              type: string
            - doc: At is when the wake happened, on the app's clock.
              name: At
              type: time.Time
            - doc: |-
                Topic is the topic node whose publish woke the loop first, when a
                topic's did.
              name: Topic
              type: string
            - doc: |-
                Reasons are the reasons of every wake the run gathers, each once, in
                the order they came: Reason is among them.
              name: Reasons
              type: "[]string"
            - doc: |-
                Topics are the topic nodes whose publish woke the loop into this run,
                each once, in the order they came: Topic is the first.
              name: Topics
              type: "[]string"
      - doc: LoopConfigurer configures a declared loop.
        interface:
          unexported: true
        name: LoopConfigurer
      - doc: RoutineConfigurer configures a hand-written loop ([Service.Go]).
        interface:
          unexported: true
        name: RoutineConfigurer
      - doc: |-
          SupervisionConfigurer configures what the framework restarts after a
          failure: a subscription's, a watch's or a queued command's consumer, a
          declared loop, a hand-written loop ([GiveUpAfter]).
        interface:
          embeds:
            - DeliveryOption
            - LoopConfigurer
            - RoutineConfigurer
        name: SupervisionConfigurer
      - doc: |-
          JobConfigurer configures a job ([Service.Every], [Service.Cron]):
          [Overlap], [StartingDeadline].
        interface:
          unexported: true
        name: JobConfigurer
      - doc: |-
          OverlapPolicy is what a job's fire does while the job's previous run is
          still going: [OverlapSkip], [OverlapAllow] or [OverlapReplace]. It is
          the word of the job's setting <service>-job-<name>-overlap.
        name: OverlapPolicy
        underlying: string
      - doc: |-
          Routine is a loop written by hand: a function that runs until its context
          ends. The framework starts it with the app, cancels its context on shutdown and waits
          for it, restarts it after an error or a panic — backing off from one second
          to one minute — and reads its select statements to draw what it waits on.
        name: Routine
        struct:
          unexported: true
      - doc: |-
          Mailer is outbound mail: a durable outbox and the transport that empties
          it. [Mailer.Send] only queues — it returns once the message is safely in
          the outbox — and the mailer's own loop hands each message to the transport,
          retrying a failure and dead-lettering a message after its last attempt.

          The transport is the SDK's mail package: SMTP when the mail connector's
          secret smtp-url is set — <PRODUCT>_SMTP_URL, smtp://user:password@host:587?tls=
          starttls|implicit|none — and otherwise the capture transport, which keeps
          every message for the Studio's mailbox and for tests ([Mailer.Captured])
          and delivers nothing. Outside dev, the capture transport is reported as a
          warning. The URL is read again before every delivery: replacing it where
          it lives — a new version in the store, a new file behind
          <PRODUCT>_SMTP_URL_FILE — takes effect at the next mail. The outbox and the
          transports are the SDK's, which the mail subsystem plugs in
          (framework/app/mail, ADR 0179 step 6).
        methods:
          - doc: |-
              Send validates msg with the SDK's mail rules — a header carrying a line
              break, an unusable address, an empty body are refused here, not at
              delivery — and puts it in the outbox. It returns the message's outbox ID.
              Inside a transaction ([Transact], a command's) the mail waits for the
              commit — a rollback drops it —, and the ID returned at once is the one
              the mail keeps. When the outbox lives on the transaction's database —
              the one that keeps the mailer's service, by a store's rules — the mail
              is written in the transaction, sealed, just before it commits: it
              exists if and only if the transaction commits, the mailbox hears of it
              after the commit, and an outbox that refuses it fails the transaction.
              Elsewhere it is put in the outbox after the commit.

              A message without a sender gets the mailer's ([From]); without a date, the
              app's time; without a Message-ID, one made of its outbox ID, which every
              attempt keeps, so a receiver can tell a retried delivery from a new mail.
            in:
              - name: ctx
                type: context.Context
              - name: msg
                type: mail.Message
            name: Send
            out:
              - type: string
              - type: error
            recv: pointer
          - doc: |-
              Captured returns the messages the capture transport kept, oldest first:
              what a test reads a verification link from. It is empty with SMTP. A mail
              appears once the outbox has delivered it — shortly after Send.
            name: Captured
            out:
              - type: "[]model.MailMessage"
            recv: pointer
        name: Mailer
        struct:
          unexported: true
      - doc: MailerConfigurer configures a mailer.
        interface:
          unexported: true
        name: MailerConfigurer
      - doc: |-
          Module is a set of services a product mounts as one: [NewModule] declares
          it, [App.With] or [Mount] mounts it.
        methods:
          - doc: Name returns the module's name.
            name: Name
            out:
              - type: string
            recv: pointer
          - doc: |-
              Prefix is where the app running the module serves its routes — "/<name>/"
              unless the mount says otherwise — and its default before an app runs it.
              A module's user interface, built with relative URLs, finds its API there.
            name: Prefix
            out:
              - type: string
            recv: pointer
        name: Module
        struct:
          unexported: true
      - doc: |-
          ModuleConfigurer is what a module is made of: its services, the modules it
          requires ([Requires]), and the migrations of the data it keeps outside
          the framework's stores ([Migrations]).
        interface:
          unexported: true
        name: ModuleConfigurer
      - doc: "MountConfigurer configures the mount of a module: [Prefix], [Bind], [Only]."
        interface:
          unexported: true
        name: MountConfigurer
      - doc: |-
          Operation takes a typed request and answers a typed response: an
          endpoint, a port — and, with ADR 0005, a command or a query. It is what
          [Fallback] and [Bind] give a port, and what [Replace] replaces in a test;
          a request or a response of other types does not compile. Its methods are
          unexported: only the framework implements it.

          Every operation is a node of the graph, and runs in a span of its own
          through its whole pipeline — authentication, validation, policies, the
          Studio's mocks — whoever calls it.
        interface:
          embeds:
            - node
          unexported: true
        name: Operation
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          PasswordPolicyService is the policy of one secret field that holds a password's
          hash: how long a password is at least, and how many former passwords it
          refuses. [StoreService.Passwords] declares it; Set, Change and Verify apply it.
        methods:
          - doc: |-
              Set sets the password of the record under key — a reset flow, behind a
              reset token: it checks the policy — the length, the most common passwords,
              and with NotReused the former passwords —, hashes the password with the
              SDK's password.Hash and
              stores the hash; the hash it replaces goes to the field's history. A
              password the policy refuses is an [Invalid] error, which says it was used
              recently, never which one; a missing record is a [NotFound].
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: password
                type: "[]byte"
            name: Set
            out:
              - type: error
            recv: pointer
          - doc: |-
              Change changes the password of the record under key: it verifies the
              current password first, as Symfony's UserPassword does — a wrong one is
              an [Invalid] error —, then sets next as Set does.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: current
              - name: next
                type: "[]byte"
            name: Change
            out:
              - type: error
            recv: pointer
          - doc: |-
              Verify reports whether password is the one of the record under key, for
              a login, with the SDK's constant-time Verify. When the stored hash is
              weaker than the SDK's policy now (password.NeedsRehash), the framework stores it
              again, hashed anew: the same password, so no former value. A key with no
              record — or a record with no password yet — costs what a wrong password
              costs, and answers false.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: password
                type: "[]byte"
            name: Verify
            out:
              - type: bool
              - type: error
            recv: pointer
        name: PasswordPolicyService
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          PasswordConfigurer configures a password policy: [MinLength], [NotReused],
          [NotCommon].
        interface:
          unexported: true
        name: PasswordConfigurer
      - doc: |-
          PortService is an operation a service needs and does not implement: a typed
          request, a typed response, a name. Declare it with [Service.Port], and
          call it with [PortService.Call] as an endpoint is called: validated, observed,
          drawn.

          What a port calls is decided when the app starts, by one rule the static
          analysis shares: the app's [Bind], else the one [Service.Implement] among
          the services the app mounts, else the port's own [Fallback]. The start
          refuses a port it cannot bind, with every other problem at once.

          A port is how a service reaches what it cannot import — a module its
          host's content, a service another that imports it — the consumer owning
          the contract.
        methods:
          - doc: |-
              Call runs what the port is bound to: in a span on the port — the caller's
              calls edge — then, through the policies [PortService.Guard] put around it,
              in the bound operation's own span — one per attempt —, through its whole
              pipeline, carrying the caller's user as [EndpointService.Call] does.
            in:
              - name: ctx
                type: context.Context
              - name: req
                type: Req
            name: Call
            out:
              - type: Resp
              - type: error
            recv: pointer
          - doc: |-
              Guard puts policies around the calls the port makes — [Retry], [Budget],
              [Breaker], [Hedge] with [Idempotent], [Throttle], [Timeout] — and returns
              the port. Whatever the order they are given in, they compose the outermost
              first as Retry, Hedge, Breaker, Throttle, Timeout, around the operation
              the port is bound to; the retry and the hedge share the port's retry
              budget.

              Each declares, in the port's service, the settings that tune it, named
              <service>-port-<name>-<knob>: the code's value is the default, which
              config/<env>.* and <PRODUCT>_<NAME> override, and a value a policy cannot
              run with stops the start. A port is guarded once: a second Guard is
              refused.

              	var Quote = Service.Port[QuoteRequest, Price]("quote").
              		Guard(app.Timeout(2*time.Second), app.Retry(3, 100*time.Millisecond), app.Breaker(5, 30*time.Second))
            in:
              - name: opts
                type: PortPolicyConfigurer
            name: Guard
            out:
              - type: "*PortService[Req, Resp]"
            recv: pointer
            variadic: true
        name: PortService
        struct:
          unexported: true
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: "PortConfigurer configures a port: [Fallback]."
        interface:
          unexported: true
        name: PortConfigurer
        typeParams:
          - name: Req
          - constraint: any
            name: Resp
      - doc: |-
          Query reads and changes nothing: a typed input, a typed result, and one
          handler — the one declared with it. Declare it with [Service.Query]; ask it
          with [Query.Ask] from any building block, which draws an asks edge from
          the caller; give it a route with [Query.Expose]. A query is internal until
          it is exposed: how one service reads what another keeps. The static
          analysis warns of a query whose code writes a store, fires a workflow,
          publishes, sends a mail or dispatches a command.

          A question runs, in this order: the caller's user when the query asks for
          one ([Auth], implied by [Query.Allow]), the input's validate tags, the
          policies, the authorization ([Query.Allow], then [Query.Authorize]), then
          the handler, on the caller's goroutine.
        methods:
          - doc: |-
              Allow makes the query need a permission, as data: the app's policy must
              let the caller — its user, with the attributes its auth data gives when it
              implements [AttrsProvider] — do action to resource. It implies [Auth]; given
              twice, both permissions are needed. The refusal is 403
              permission_denied, one sentence whatever the cause.
            in:
              - name: policy
                type: authz.Policy
              - name: action
              - name: resource
                type: string
            name: Allow
            out:
              - type: "*Query[Q, R]"
            recv: pointer
          - doc: |-
              Authorize gives the query a rule that needs the data: fn sees the input
              and, through its context, the caller, and returns nil, [Forbidden],
              [NotFound] — to hide what exists — or an authz.Check of its own. It runs
              last before the handler, after [Query.Allow]; its refusal is 403
              permission_denied, one sentence whatever the cause, and a NotFound or an
              Unauthenticated stays what it is.
            in:
              - name: fn
                type: func(context.Context, Q) error
            name: Authorize
            out:
              - type: "*Query[Q, R]"
            recv: pointer
          - doc: |-
              Expose declares an endpoint that asks the query, on route, with the
              options an endpoint takes ([RateLimitPerClient], [MaxBody], [Name]): named
              after the query, authenticated when the query asks for a user, the rest
              of the pipeline the query's. It answers 200 with the result, 204 for
              [EmptyValue].

              An exposed query says who may ask it: a permission ([Query.Allow]), a rule
              ([Query.Authorize]), or, when it declares neither, a marker that it is
              open on purpose — [Anyone], or [AnyUser] for any signed-in user. The
              start refuses an exposure that says none of them. A query nobody exposes
              is internal: the code that needs it asks it.
            in:
              - name: route
                type: string
              - name: opts
                type: ExposeConfigurer
            name: Expose
            out:
              - type: "*Query[Q, R]"
            recv: pointer
            variadic: true
          - doc: |-
              Ask runs the query for the node ctx runs inside — in a span on the query,
              its caller's asks edge —, through its whole pipeline, and returns its
              result. The caller's user goes with it.
            in:
              - name: ctx
                type: context.Context
              - name: in
                type: Q
            name: Ask
            out:
              - type: R
              - type: error
            recv: pointer
        name: Query
        struct:
          unexported: true
        typeParams:
          - name: Q
          - constraint: any
            name: R
      - doc: |-
          QueryConfigurer configures a query: the options every operation takes —
          [Auth], [AuthOptional], [RateLimit], [RateLimitPerClient], [Timeout],
          [Bulkhead].
        interface:
          unexported: true
        name: QueryConfigurer
      - doc: |-
          RecordsService is one store's records without their type. Get returns a record
          without its secret members; Keys lists the records' keys, to a module that
          watches the store; EraseFields and Delete take a reason and are refused on a
          held record. Each call is a span on the store's node and an entry in the
          privacy journal.
        methods:
          - doc: Get returns the record under key as JSON, its secret members left out.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Get
            out:
              - type: json.RawMessage
              - type: error
            recv: value
          - doc: |-
              Keys yields the key of every record the store holds, in key order, and
              nothing of a record: what a watch reads to catch up on the writes it
              may have missed. It is offered only to a module one of whose watches
              the store feeds — any other caller, code outside a module's node
              included, is refused with a [Forbidden] error ([CodeRecordsKeys]) —,
              and each listing is one entry in the privacy journal, however many
              keys it yields. A record in the store's trash is not listed. A
              failure is yielded once, with an empty key, and ends the listing.
            in:
              - name: ctx
                type: context.Context
            name: Keys
            out:
              - type: iter.Seq2[string, error]
            recv: value
          - doc: |-
              EraseFields clears the fields at paths — pointers as [FieldRefValue] gives
              them — in the record under key: the final removal of a moderated field.
              A path that names no classified field is an [Invalid] error; a held
              record is a [Conflict].
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: reason
                type: string
              - name: paths
                type: string
            name: EraseFields
            out:
              - type: error
            recv: value
            variadic: true
          - doc: Delete removes the record under key; a held record is a [Conflict].
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: reason
                type: string
            name: Delete
            out:
              - type: error
            recv: value
        name: RecordsService
        struct:
          unexported: true
      - doc: |-
          RevisionEvent is one version of a record a store with [Revisions] keeps: its
          number — from 1, never given twice while the record exists —, when the
          write that made it ran, on the app's clock, zero for a record stored before
          its store kept revisions; who made it — the caller's [UserID], empty for a
          write with no user —; which command made it — its node ID, empty outside a
          command —; and the record as it was, its secret members zeroed.
        name: RevisionEvent
        struct:
          fields:
            - name: Number
              type: uint64
            - name: At
              type: time.Time
            - name: By
              type: string
            - name: Command
              type: string
            - name: Value
              type: T
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          BounceEvent is a mail its mailer gave up on: the receiving server refused it for
          good, it outlived its mailer's max-age, or its last attempt failed —
          GivenUp says which. It stays in the outbox as a dead letter.

          Reply is the receiving server's own answer: the hook may read it, log it or
          act on it, but the framework never puts it in a message it shows — the
          Studio's mailbox keeps its code alone.
        name: BounceEvent
        struct:
          fields:
            - doc: Err is the last attempt's failure.
              name: Err
              type: error
            - doc: |-
                Reply is the SMTP reply that failure carries, nil when the server
                answered none — a relay that could not be reached, a timeout.
              name: Reply
              type: "*textproto.Error"
            - doc: Message is the mail, as it was queued.
              name: Message
              type: mail.Message
            - doc: QueuedAt is when it entered the outbox.
              name: QueuedAt
              type: time.Time
            - doc: At is when it was given up, on the app's clock.
              name: At
              type: time.Time
            - doc: Mailer is the mailer's node ID.
              name: Mailer
              type: string
            - doc: ID is the mail's outbox ID.
              name: ID
              type: string
            - doc: |-
                GivenUp is why: model.MailRejected, model.MailExpired or
                model.MailExhausted.
              name: GivenUp
              type: string
            - doc: Attempts is how many deliveries it got.
              name: Attempts
              type: int
      - doc: |-
          TombstoneEvent is one record in a store's trash: its key, when the product
          deleted it, on the app's clock, and when the framework purges it — its trash's
          length after the deletion, or sooner when its retention says so.
        name: TombstoneEvent
        struct:
          fields:
            - name: Key
              type: string
            - name: At
              type: time.Time
            - name: PurgeAt
              type: time.Time
      - doc: |-
          Binary is one executable the product ships, made of process roles: a
          status line and its daemon are two roles of one binary, "statusline" and
          "statusline daemon". Each role is an App — its own services, its own
          profile — and two roles talk only through a declared, versioned contract
          (D22): a listener one serves and the other dials, never each other's code.

          	var Binary = app.NewBinary("statusline", "The status line of a Claude session.").
          		Role("render", RenderApp).                // statusline ...
          		Role("daemon", DaemonApp, "daemon").      // statusline daemon ...
          		Talks("render", "daemon", "render/v1")

          	func main() { os.Exit(Binary.Main(context.Background(), os.Args[1:])) }

          The package that declares a binary and its roles is wiring, generated from
          the design (D22).
        methods:
          - doc: |-
              Role adds a process role named name, run by app, selected when the
              process's first arguments are args; the role without args is the default.
              It returns b, so roles chain.
            in:
              - name: name
                type: string
              - name: app
                type: "*App"
              - name: args
                type: string
            name: Role
            out:
              - type: "*Binary"
            recv: pointer
            variadic: true
          - doc: |-
              Talks declares that role from talks to role to through contract —
              "<name>/v<major>". It is the only edge two roles may have.
            in:
              - name: from
              - name: to
              - name: contractName
                type: string
            name: Talks
            out:
              - type: "*Binary"
            recv: pointer
          - doc: |-
              Main runs the role the arguments select — the one whose args are the
              longest prefix of them, else the default role — with the rest of the
              arguments, through its App's Main. It returns the process exit status.
            in:
              - name: ctx
                type: context.Context
              - name: args
                type: "[]string"
            name: Main
            out:
              - type: int
            recv: pointer
        name: Binary
        struct:
          unexported: true
      - doc: |-
          ScopeValue is one part of a path computed at the start: the user, the
          executable, a configuration directory. Two processes share a singleton or
          a socket when every scope gives them the same value.
        name: ScopeValue
        struct:
          unexported: true
      - doc: |-
          Secret is a secret the product declares: provided by the operator — an SMTP
          URL, an API token — or generated by the framework — a signing or sealing key — and
          rotated on its schedule.
        methods:
          - doc: |-
              Value returns the secret's current version. A provided secret is read
              where it lives at every call.
            in:
              - name: ctx
                type: context.Context
            name: Value
            out:
              - type: secret.Value
              - type: error
            recv: pointer
          - doc: |-
              Present reports whether the secret is set now, where it lives: false, and
              no error, when an [Optional] secret is given nowhere — which the product
              answers by leaving off what needs it. An error says its store could not
              be read. A secret the start required is present, unless the operator took
              it back since.

              	if ok, err := OpenAIKey.Present(ctx); err != nil || !ok {
              		return Verdict{}, err // no key, no automatic screening
              	}
            in:
              - name: ctx
                type: context.Context
            name: Present
            out:
              - type: bool
              - type: error
            recv: pointer
          - doc: |-
              Seal encrypts plaintext under the secret's current version, binding aad:
              data that travels beside the box in the clear and must come back
              unchanged for the box to open.
            in:
              - name: ctx
                type: context.Context
              - name: plaintext
              - name: aad
                type: "[]byte"
            name: Seal
            out:
              - type: "[]byte"
              - type: error
            recv: pointer
          - doc: |-
              Open decrypts a box any kept version sealed, with the aad it was sealed
              with. A box no kept version opens — forged, altered, or sealed by a
              version pruned since — is refused with an error errors.Is matches with
              secret.SealInvalid.
            in:
              - name: ctx
                type: context.Context
              - name: box
              - name: aad
                type: "[]byte"
            name: Open
            out:
              - type: "[]byte"
              - type: error
            recv: pointer
          - doc: Sign signs message with the secret's current version.
            in:
              - name: ctx
                type: context.Context
              - name: message
                type: "[]byte"
            name: Sign
            out:
              - type: "[]byte"
              - type: error
            recv: pointer
          - doc: |-
              Verify reports whether a kept version signed message: nil when one did,
              and an error errors.Is matches with secret.SignatureInvalid when none did.
            in:
              - name: ctx
                type: context.Context
              - name: message
              - name: signature
                type: "[]byte"
            name: Verify
            out:
              - type: error
            recv: pointer
        name: Secret
        struct:
          unexported: true
      - doc: SecretConfigurer configures a secret.
        interface:
          unexported: true
        name: SecretConfigurer
      - doc: |-
          Service is a bounded context of the product: it owns its building blocks —
          endpoints, stores, topics, subscriptions, workflows, jobs, frontends — and
          is the unit an App mounts. Declare one per package, as a package-level
          variable, and declare its building blocks through its methods:

          	var Service = app.NewService("todos", "The todo list.")
          	var Todos = Service.Store("todos", func(t Todo) string { return t.ID })
          	var _ = Service.Endpoint("GET /todos", List)

          Declaring never fails: a mistake — a malformed route, a duplicate name — is
          recorded with its source position and reported, all at once, when the App
          starts. The diagram shows it too.
        methods:
          - doc: |-
              Activity declares that the service is busy while fn returns true: a daemon
              whose clients are sessions, not connections, stops once the last session
              ended rather than once the last connection closed. fn is called on the
              idle watch's tick, from one goroutine, and must answer quickly; a panic
              counts as busy, and is logged. The value is kept for the declaration:

              	var _ = Service.Activity(func(context.Context) bool { return sessions.Open() > 0 })
            in:
              - name: fn
                type: func(context.Context) bool
            name: Activity
            out:
              - type: "*ActivityHandler"
            recv: pointer
          - doc: |-
              AuthHandler declares the app's authentication handler. The handler returns
              the user's ID and data; an empty UID with a nil error means "no
              credentials", which [Auth] endpoints answer 401 and [AuthOptional]
              endpoints serve anonymously; an error — usually [Unauthenticated] — refuses
              the request.

              The handler runs only for a request that carries at least one of the
              credentials' cookies or headers; a request with none is anonymous without
              asking it.
            in:
              - name: name
                type: string
              - name: handler
                type: func(context.Context, P) (UID, D, error)
            name: AuthHandler
            out:
              - type: "*AuthenticatorHandler[P, D]"
            recv: pointer
            typeParams:
              - name: P
              - constraint: any
                name: D
          - doc: |-
              CLI declares a command named name, which Main runs when the process is
              called "<binary> <name> ...". doc is its one-line help.
            in:
              - name: name
              - name: doc
                type: string
              - name: fn
                type: CLIFunc
              - name: opts
                type: CommandLineConfigurer
            name: CLI
            out:
              - type: "*CLI"
            recv: pointer
            variadic: true
          - doc: |-
              Command declares a command of the service: an operation named name, run by
              handler, that changes something. Its node is "<service>/command/<name>".

              	var PlaceOrder = Service.Command("place-order", placeOrder).
              		Allow(Policy, "place", "order").
              		Expose("POST /orders")
            in:
              - name: name
                type: string
              - name: handler
                type: func(context.Context, C) (R, error)
              - name: opts
                type: CommandConfigurer
            name: Command
            out:
              - type: "*Command[C, R]"
            recv: pointer
            typeParams:
              - name: C
              - constraint: any
                name: R
            variadic: true
          - doc: |-
              Endpoint declares an HTTP endpoint on route — "METHOD /path/{param}" — run
              by handler. The request is decoded from the path, the query, the headers
              (fields tagged `path:"…"`, `query:"…"`, `header:"…"`) and the JSON body
              (every other field), then checked against its `validate` tags, then handed
              to the policies ([RateLimit], [Timeout], [Bulkhead]) and the handler. The
              response is JSON, or 204 No Content when it is [EmptyValue].

              An endpoint is for what HTTP itself is about — a webhook a third party
              calls. A business operation is a command or a query, exposed on its route
              ([Command.Expose], [Query.Expose]), and run in process by the code that
              needs it ([Command.Dispatch], [Query.Ask]).

              The endpoint's name, and so its node ID, is the handler's function name.
            in:
              - name: route
                type: string
              - name: handler
                type: func(context.Context, Req) (Resp, error)
              - name: opts
                type: EndpointConfigurer
            name: Endpoint
            out:
              - type: "*EndpointService[Req, Resp]"
            recv: pointer
            typeParams:
              - name: Req
              - constraint: any
                name: Resp
            variadic: true
          - doc: |-
              Implement declares that the service implements port: an endpoint of the
              service with no route, which only the port reaches, in process, when the
              app binds nothing else and this is the one implementation among the
              services it mounts. It runs as every endpoint does — the request's
              validate tags, the options' policies, the caller's user — and is named
              like one: its [Name], else its handler's name, else, for a function
              literal, the port's name. A handler whose request or response is not the
              port's does not compile. A host implements a module's port on its own
              service: it never adds a node to the module's.

              	var _ = posts.Service.Implement(desk.Enforcer, Enforce)
            in:
              - name: port
                type: "*PortService[Req, Resp]"
              - name: handler
                type: func(context.Context, Req) (Resp, error)
              - name: opts
                type: EndpointConfigurer
            name: Implement
            out:
              - type: "*EndpointService[Req, Resp]"
            recv: pointer
            typeParams:
              - name: Req
              - constraint: any
                name: Resp
            variadic: true
          - doc: |-
              Every declares a job that runs every period, first one period after the
              app starts. A fire due while its previous run still goes is skipped, and a
              late fire runs however late, unless [Overlap] and [StartingDeadline] say
              otherwise.
            in:
              - name: name
                type: string
              - name: period
                type: time.Duration
              - name: fn
                type: func(context.Context) error
              - name: opts
                type: JobConfigurer
            name: Every
            out:
              - type: "*Job"
            recv: pointer
            variadic: true
          - doc: |-
              Cron declares a job that runs on a five-field POSIX cron expression, in the
              process's local time zone. A fire due while its previous run still goes is
              skipped, and a late fire runs however late, unless [Overlap] and
              [StartingDeadline] say otherwise.
            in:
              - name: name
              - name: expr
                type: string
              - name: fn
                type: func(context.Context) error
              - name: opts
                type: JobConfigurer
            name: Cron
            out:
              - type: "*Job"
            recv: pointer
            variadic: true
          - doc: |-
              Listen declares a listener named name speaking contract — "<name>/v<major>",
              "render/v1" — whose connections handler serves, one goroutine each.
            in:
              - name: name
              - name: contract
                type: string
              - name: handler
                type: ListenHandler
              - name: opts
                type: ListenerConfigurer
            name: Listen
            out:
              - type: "*Listener"
            recv: pointer
            variadic: true
          - doc: |-
              Loop declares a loop run by kit: run is called once at start, then on
              every wake.

              Runs never overlap: wakes that come while the function runs are gathered
              into one run after it. A run that fails or panics is counted, and the next
              one waits a backoff — one second, doubling up to a minute — unless it is
              a [Loop.Nudge]. A deadline already past wakes the loop at once, but never
              sooner than a second after the previous run: a WakeAt that keeps answering
              the past costs a run a second, not a spinning core. A loop whose runs
              failed more than ten times within ten minutes stops, and the product is no
              longer live ([GiveUpAfter]).
            in:
              - name: name
                type: string
              - name: run
                type: func(context.Context, WakeEvent) error
              - name: opts
                type: LoopConfigurer
            name: Loop
            out:
              - type: "*Loop"
            recv: pointer
            variadic: true
          - doc: |-
              Go declares a hand-written loop. run must return when ctx ends; returning
              earlier, with or without an error, restarts it after a backoff — more than
              ten times within ten minutes, and it is not restarted again: the product
              is no longer live ([GiveUpAfter]).

              Everything run does is drawn from the loop's node: a store it reads, a
              topic it publishes on. The framework has no span around it — a run lasts as long as
              the app — so each of those calls starts a trace of its own.
            in:
              - name: name
                type: string
              - name: run
                type: func(context.Context) error
              - name: opts
                type: RoutineConfigurer
            name: Go
            out:
              - type: "*Routine"
            recv: pointer
            variadic: true
          - doc: Mailer declares outbound mail.
            in:
              - name: name
                type: string
              - name: opts
                type: MailerConfigurer
            name: Mailer
            out:
              - type: "*Mailer"
            recv: pointer
            variadic: true
          - doc: |-
              Port declares a port of the service: an operation it needs, named name,
              taking Req and answering Resp, which another service implements
              ([Service.Implement]) or the app binds ([Bind]). Its node is
              "<service>/port/<name>"; its doc is its declaration's doc comment.
            in:
              - name: name
                type: string
              - name: opts
                type: PortConfigurer[Req, Resp]
            name: Port
            out:
              - type: "*PortService[Req, Resp]"
            recv: pointer
            typeParams:
              - name: Req
              - constraint: any
                name: Resp
            variadic: true
          - doc: |-
              Query declares a query of the service: an operation named name, run by
              handler, that reads and changes nothing. Its node is
              "<service>/query/<name>".

              	var MyOrders = Service.Query("my-orders", myOrders, app.Auth()).Expose("GET /orders", app.AnyUser())
            in:
              - name: name
                type: string
              - name: handler
                type: func(context.Context, Q) (R, error)
              - name: opts
                type: QueryConfigurer
            name: Query
            out:
              - type: "*Query[Q, R]"
            recv: pointer
            typeParams:
              - name: Q
              - constraint: any
                name: R
            variadic: true
          - doc: |-
              Secret declares a secret the product needs.

              Without an option it is provided: the operator gives it in the
              environment — the variable <APP>_<NAME>, TODO_STRIPE_KEY for the secret
              "stripe-key" of the app "todo", or TODO_STRIPE_KEY_FILE naming a file that
              holds it, the Docker and Kubernetes way — or in the environment's store,
              with `the framework secrets set`. It is read at every use, so replacing it where it
              lives takes effect without a restart, and a start without it fails, naming
              the variable to set.

              With [Optional], a start without it goes on: the product asks
              [Secret.Present] before it uses the secret.

              With [Generated], the framework makes it: version 1 on the first start, a new version
              on its schedule, the previous ones kept so that what they sealed or signed
              still opens and verifies. It lives in the store the environment keeps — an
              encrypted file store in dev, <PRODUCT>_SECRETS elsewhere. Its variable pins it:
              the framework then uses the value as it is and does not rotate it.

              name is 1 to 63 lower-case letters, digits and dashes, starting and ending
              with a letter or a digit — one grammar for a file name and a variable — and
              unique in the app.
            in:
              - name: name
                type: string
              - name: opts
                type: SecretConfigurer
            name: Secret
            out:
              - type: "*Secret"
            recv: pointer
            variadic: true
          - doc: |-
              Name returns the service name, which is also its node ID: qualified with
              its module's, "moderation.intake", when a module lists it.
            name: Name
            out:
              - type: string
            recv: pointer
          - doc: |-
              Setting declares a setting of the service: name holds def unless the
              environment says otherwise — the variable <APP>_<NAME>, TODO_BASE_URL for
              the setting "base-url" of the app "todo", or the key name in the product's
              configuration files. [SettingService.Get] reads it.

              name follows the secrets' grammar — 1 to 63 lower-case letters, digits and
              dashes, starting and ending with a letter or a digit — and is unique in the
              app, among its settings and its secrets: the two share their variables.
            in:
              - name: name
                type: string
              - name: def
                type: T
              - name: opts
                type: SettingConfigurer
            name: Setting
            out:
              - type: "*SettingService[T]"
            recv: pointer
            typeParams:
              - constraint: SettingValue
                name: T
            variadic: true
          - doc: |-
              Static declares a frontend serving fsys under prefix, which must end with
              '/'. A path with no file extension that matches no file serves index.html,
              so client-side routing works; a missing file with an extension — a script,
              a stylesheet — stays a 404. A directory is never listed. The SDK's static
              handler serves it; the framework draws it and observes every request.
            in:
              - name: name
              - name: prefix
                type: string
              - name: fsys
                type: fs.FS
              - name: opts
                type: StaticConfigurer
            name: Static
            out:
              - type: "*Frontend"
            recv: pointer
            variadic: true
          - doc: Store declares a store of entities of type T, keyed by key.
            in:
              - name: name
                type: string
              - name: key
                type: func(T) string
              - name: opts
                type: StoreConfigurer
            name: Store
            out:
              - type: "*StoreService[T]"
            recv: pointer
            typeParams:
              - constraint: any
                name: T
            variadic: true
          - doc: Topic declares a topic carrying messages of type T.
            in:
              - name: name
                type: string
            name: Topic
            out:
              - type: "*TopicService[T]"
            recv: pointer
            typeParams:
              - constraint: any
                name: T
          - doc: |-
              Subscribe declares a subscription of the service to topic. Delivery is at
              least once: handler must be idempotent, which is the one thing the SDK's
              queue cannot check and the framework therefore asks you to promise here.
            in:
              - name: name
                type: string
              - name: topic
                type: "*TopicService[T]"
              - name: handler
                type: func(context.Context, T) error
              - name: opts
                type: SubscriptionConfigurer
            name: Subscribe
            out:
              - type: "*SubscriptionWorker[T]"
            recv: pointer
            typeParams:
              - constraint: any
                name: T
            variadic: true
          - doc: |-
              Watch declares a watch of the service: handler is told of every write the framework
              confirms on a store whose entity holds a field that carries mark — the
              product's stores and the other modules', never those of the module the
              service belongs to (for a service of the product's, never the product's
              own) unless [OwnStores] says so. The notice says which store, which
              record and whether it was deleted; the handler reads the record itself
              ([RecordsOf]). Delivery is at least once and in no set order, retried and
              dead-lettered after [MaxDeliveries] attempts: handler must be idempotent,
              and it hears the writes it makes itself on another's store — with
              OwnStores, never a write its own handler makes. After a stop that was
              not clean — the process died with the watch running —, its next start
              queues a notice for every record of every store that feeds it, so that
              no write a crash took the notice of goes unheard; a deletion whose
              notice was lost is not among them. The mark that says a watch runs is
              kept in the data directory: an app without one does not catch up (ADR
              0178 C6).

              	var Content = Service.Watch("content", app.Moderated, Screen)
              	var Posts = Service.Watch("posts", app.Moderated, Stamp, app.OwnStores())
            in:
              - name: name
                type: string
              - name: mark
                type: Mark
              - name: handler
                type: func(context.Context, WrittenEvent) error
              - name: opts
                type: SubscriptionConfigurer
            name: Watch
            out:
              - type: "*Watch"
            recv: pointer
            variadic: true
          - doc: |-
              Workflow declares a state machine over the entities of store. state returns
              a pointer to the entity's state field.
            in:
              - name: name
                type: string
              - name: store
                type: "*StoreService[E]"
              - name: state
                type: func(*E) *S
            name: Workflow
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
            typeParams:
              - constraint: any
                name: E
              - constraint: comparable
                name: S
        name: Service
        struct:
          unexported: true
      - doc: |-
          SettingService is a value the environment gives a service, declared with
          [Service.Setting].
        methods:
          - doc: |-
              Get returns the setting's value in the app the service is mounted in —
              its default until an app has started with it.
            name: Get
            out:
              - type: T
            recv: pointer
          - doc: |-
              Name is the setting's name, its key in a configuration file — in its
              module's section, for a module's setting.
            name: Name
            out:
              - type: string
            recv: pointer
        name: SettingService
        struct:
          unexported: true
        typeParams:
          - constraint: SettingValue
            name: T
      - doc: SettingValue is what a setting may hold.
        interface:
          embeds:
            - string | bool | int | int64 | float64 | time.Duration | []string
        name: SettingValue
      - doc: SettingConfigurer configures a setting.
        interface:
          unexported: true
        name: SettingConfigurer
      - doc: |-
          Frontend is static assets the product serves: a single page application,
          a documentation site. Requests the page makes to the product's endpoints
          are attributed to it in the diagram.
        name: Frontend
        struct:
          unexported: true
      - doc: StaticConfigurer configures a frontend.
        interface:
          unexported: true
        name: StaticConfigurer
      - doc: |-
          StoreService is a typed, keyed collection of entities. Every read returns a copy
          and every write stores one: an entity is kept as its JSON encoding, so what
          a handler holds can never alias what the store holds, and the memory and
          file backends behave identically.

          With a data directory (<PRODUCT>_DATA_DIR; ".app/data" in dev) the store persists
          every write before returning, atomically — a crash never leaves a torn
          file — and a write costs one entity, whatever the store holds. Without one,
          it lives in memory. A store a database keeps ([Database], [Keeps]) lives
          in a table of it, and every call is a round trip. A store is a port (ADR
          0004): what it runs on is its engine (store_engine.go) — the SDK's
          document store, in memory, in files or over SQL —; the framework makes it a node of
          the graph, observes every call, and speaks for its refusals. Its writes
          join the transaction their context carries ([Transact]).
        methods:
          - doc: |-
              Former returns the former values of the field at pointer — its JSON
              pointer (RFC 6901), "/email" — in the record under key, newest first:
              each with when it was replaced and by whom. A secret field's former values
              say when they changed, never what they were: their Value is empty. A field
              that keeps no former values is an [Invalid] error, a missing record a
              [NotFound].
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: pointer
                type: string
            name: Former
            out:
              - type: "[]Former"
              - type: error
            recv: pointer
          - doc: |-
              Hold places a legal hold on the record under key: neither the retention,
              nor a person's erasure, nor Delete touches it until [StoreService.Release] lifts
              it. reason says why — an authority's request, a case under litigation —
              and is kept for whoever runs the product, never shown in the Studio.
              Holding a held record again replaces its reason.
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: reason
                type: string
            name: Hold
            out:
              - type: error
            recv: pointer
          - doc: |-
              Release lifts the hold on the record under key: the retention takes it up
              again, from where its instants say. A record no hold keeps is a
              [NotFound] error.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Release
            out:
              - type: error
            recv: pointer
          - doc: |-
              Lookup returns the entity whose key in the unique index is key, or a
              [NotFound] error. Asking a non-unique index is an [Invalid] error: use
              [StoreService.Find].
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Lookup
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Find returns the entities indexed under key, ordered by their store key. It
              reads any index, unique or not; no entity is an empty slice, not an error.
            in:
              - name: ctx
                type: context.Context
              - name: index
              - name: key
                type: string
            name: Find
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Filter returns the entities keep accepts, ordered by key. It reads every
              entity: an index is the way to avoid it.
            in:
              - name: ctx
                type: context.Context
              - name: keep
                type: func(T) bool
            name: Filter
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: |-
              Passwords declares the password policy of one secret field of the store's
              entity; field names it — the framework calls it on a zero entity to find which. The
              field then only ever holds the password's hash, a PHC string, or nothing
              before a first password; a write that puts anything else in it is
              refused. A field that is not secret refuses the start, as does a second
              policy on the same field.
            in:
              - name: field
                type: func(*T) *string
              - name: opts
                type: PasswordConfigurer
            name: Passwords
            out:
              - type: "*PasswordPolicyService[T]"
            recv: pointer
            variadic: true
          - doc: |-
              Erase erases one record now, as its retention would: its personal,
              special and secret members and its subject cleared — after the store's
              Anonymise function has kept what it generalises —, its erased fields
              stamped, the rest kept. A held record is refused with a [Conflict] that
              names the hold, never a placed hold's reason. reason is journaled, for
              whoever runs the product.
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: reason
                type: string
            name: Erase
            out:
              - type: error
            recv: pointer
          - doc: |-
              Revisions returns the versions the store keeps of the record under key,
              newest first: the record as it is now, then the former ones — n at most,
              more while a legal hold keeps the record. A secret member is zeroed in
              each: a former password hash never reaches the product. A missing record
              is a [NotFound], a store that keeps no revisions an [Invalid].
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Revisions
            out:
              - type: "[]RevisionEvent[T]"
              - type: error
            recv: pointer
          - doc: |-
              Revision returns the version numbered number of the record under key, its
              secret members zeroed: a [NotFound] when the record keeps none of that
              number — never made, or pruned.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: number
                type: uint64
            name: Revision
            out:
              - type: RevisionEvent[T]
              - type: error
            recv: pointer
          - doc: |-
              Diff returns what changed from the version numbered from to the version
              numbered to of the record under key, in RFC 6902's words — add, remove,
              replace, each at a JSON pointer — with both values, in the order they
              apply: none when the two are the same. A secret member says it changed,
              never what. Showing a text's changes line by line is the reader's: the
              Studio does it.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: from
              - name: to
                type: uint64
            name: Diff
            out:
              - type: "[]Edit"
              - type: error
            recv: pointer
          - doc: |-
              Restore writes the version numbered number of the record under key back,
              as a new version: history is never rewritten. It restores the whole
              version, or only the fields named by JSON pointer (RFC 6901) — "/title" —,
              as WordPress restores some fields of a revision. It keeps the record's
              workflow state, which its workflow owns, and every secret member:
              restoring an account never brings back an old password past its policy,
              and naming one of them is an [Invalid] error. A unique index the restored
              record breaks refuses it with a [Conflict], and nothing changes. It
              returns the record as restored.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: number
                type: uint64
              - name: fields
                type: string
            name: Restore
            out:
              - type: T
              - type: error
            recv: pointer
            variadic: true
          - doc: |-
              Untrash brings the record the product deleted under key back from the
              store's trash, as it was when deleted — its versions kept, no version
              made — and returns it. A key with no record in the trash — never deleted,
              purged, or written again since — is a [NotFound]; a unique index another
              record took a key of meanwhile refuses it with a [Conflict], and it stays
              in the trash; a store without [Revisions] keeps no trash: an [Invalid].
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Untrash
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Trashed returns the records in the store's trash, in key order: each
              one's key, when the product deleted it, and when the framework purges it. A store
              without [Revisions] keeps no trash: an [Invalid].
            in:
              - name: ctx
                type: context.Context
            name: Trashed
            out:
              - type: "[]TombstoneEvent"
              - type: error
            recv: pointer
          - doc: Get returns the entity with the given key, or a [NotFound] error.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Get
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: List returns every entity, ordered by key.
            in:
              - name: ctx
                type: context.Context
            name: List
            out:
              - type: "[]T"
              - type: error
            recv: pointer
          - doc: Count returns how many entities the store holds.
            in:
              - name: ctx
                type: context.Context
            name: Count
            out:
              - type: int
              - type: error
            recv: pointer
          - doc: Put stores the entity, replacing any entity with the same key.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Put
            out:
              - type: error
            recv: pointer
          - doc: Insert stores a new entity; it is a [Conflict] error when the key exists.
            in:
              - name: ctx
                type: context.Context
              - name: v
                type: T
            name: Insert
            out:
              - type: error
            recv: pointer
          - doc: |-
              Update applies fn to the entity with the given key and stores the result,
              atomically with respect to every other write of this store. fn must not
              change the key. An error from fn leaves the entity untouched.

              fn runs while the store's writers wait — on a database, inside the
              write's transaction, the entity locked —: it may read this store, but must
              not write to it, nor fire a workflow over it — either would wait for the
              write fn is part of.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
              - name: fn
                type: func(*T) error
            name: Update
            out:
              - type: T
              - type: error
            recv: pointer
          - doc: |-
              Delete removes the entity with the given key, or returns a [NotFound] error.
              On a store with [Revisions] it moves the entity to the store's trash
              instead, for <store>-trash — 30 days unless that setting says otherwise, 0
              deleting at once —: gone from every read, its unique keys free, its
              versions kept, [StoreService.Untrash] brings it back, and the framework purges it
              once its time is up. When the store seals at rest and the entity was its
              person's last record, their data key goes with it, as with an erasure —
              at the commit, in a [Transact] —, once nothing the framework keeps still needs it: a
              held record, a record in the trash, or a former value or version sealed
              under it, keeps the key.
            in:
              - name: ctx
                type: context.Context
              - name: key
                type: string
            name: Delete
            out:
              - type: error
            recv: pointer
        name: StoreService
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - doc: StoreConfigurer configures a store.
        interface:
          unexported: true
        name: StoreConfigurer
      - doc: |-
          TopicService is an asynchronous channel of messages of type T. Every subscription
          receives every message, at least once: a subscription's handler must
          tolerate a redelivery.
        methods:
          - doc: |-
              Publish sends msg to every subscription. It returns once every
              subscription's queue has accepted the message; delivery happens later.
              Inside a transaction ([Transact], a command's) the message is encoded now
              and queued at the commit: in the transaction, just before it commits, for
              a subscription whose queue lives on the transaction's database — a queue
              that refuses it then fails the transaction —, once it committed for the
              others. A rollback drops it. A topic that publishes once ([TopicService.Once])
              publishes a message whose key it published within its window in no queue.
            in:
              - name: ctx
                type: context.Context
              - name: msg
                type: T
            name: Publish
            out:
              - type: error
            recv: pointer
          - doc: |-
              PublishAt sends msg to every subscription as [TopicService.Publish] does,
              but no subscription receives it before at: a reminder, a trial that ends,
              an order cancelled if still unpaid. It is as durable as any message, held
              to the commit inside a transaction as a publication is; an instant already
              past is now. It does not recur — a job does. A topic that publishes once
              refuses it: the SDK has no publication once for later yet. It is the SDK's
              queue.PublishAt.
            in:
              - name: ctx
                type: context.Context
              - name: msg
                type: T
              - name: at
                type: time.Time
            name: PublishAt
            out:
              - type: error
            recv: pointer
          - doc: |-
              Once makes the topic publish a message at most once per key over window:
              a second [TopicService.Publish] whose message has the key of one published
              within the window publishes nothing, in no subscription's queue, and
              answers nil — a producer that retries a publication it never heard back
              from adds no copy. The window is counted by each subscription's queue,
              from its first publication under the key; it is the SDK's
              queue.PublishOnce. A message whose key is empty is refused. Delivery stays
              at least once: a handler still tolerates a redelivery.

              window is the default of the topic's setting
              <service>-topic-<name>-once-window, which config/<env>.* and
              <PRODUCT>_<NAME> override; one that is not positive stops the start. A
              queued command keeps its own key ([Command.Key]): a dispatch whose key
              waits or runs is not queued again, however long ago it was dispatched.
            in:
              - name: key
                type: func(T) string
              - name: window
                type: time.Duration
            name: Once
            out:
              - type: "*TopicService[T]"
            recv: pointer
        name: TopicService
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - doc: |-
          SubscriptionWorker consumes a topic: its handler runs once per message, at least
          once, retried on error, and dead-lettered after MaxDeliveries attempts.
        name: SubscriptionWorker
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: T
      - doc: SubscriptionConfigurer configures a subscription.
        interface:
          unexported: true
        name: SubscriptionConfigurer
      - doc: |-
          DeliveryOption configures a queue's deliveries: a subscription's, or a
          queued command's ([MaxDeliveries], [Parallelism]).
        interface:
          embeds:
            - SubscriptionConfigurer
            - CommandConfigurer
        name: DeliveryOption
      - doc: |-
          WrittenEvent is what a watch is told of a write: which store, which record, and
          whether it was deleted — never a value. The watch reads the record itself
          ([RecordsOf]): without its secret members, and journaled.
        name: WrittenEvent
        struct:
          fields:
            - doc: "Store is the store's node ID: \"shop/store/reviews\"."
              name: Store
              tag: json:"store"
              type: string
            - doc: Key is the record's key in the store.
              name: Key
              tag: json:"key"
              type: string
            - doc: |-
                Deleted is set when the write deleted the record: there is nothing
                left to read.
              name: Deleted
              tag: json:"deleted,omitempty"
              type: bool
            - doc: |-
                Fields are the store's fields that carry the watch's mark, as
                [App.Fields] lists them. Which of them the write changed, the notice
                does not say.
              name: Fields
              tag: json:"fields,omitempty"
              type: "[]FieldRefValue"
      - doc: |-
          Watch is a subscription fed by stores instead of a topic: its handler is
          told of every write the framework confirms on a store whose entity holds a field
          with its mark. [Service.Watch] declares one.
        name: Watch
        struct:
          unexported: true
      - doc: |-
          Mark is what a module looks for in the product's fields: app.Personal,
          app.Special or app.Moderated. There is no mark for public or secret:
          there is nothing to find in the first, and nothing may watch the second.
        name: Mark
        underlying: string
      - doc: |-
          FieldRefValue is one field of one store that carries a mark: where the field
          is, and what its tag says of it.
        name: FieldRefValue
        struct:
          fields:
            - doc: Store is the store's node ID.
              name: Store
              tag: json:"store"
              type: string
            - doc: |-
                Path is the field's JSON pointer in the entity: "/body". A "*"
                stands for every element of an array or every value of a map:
                "/replies/*/body".
              name: Path
              tag: json:"path"
              type: string
            - doc: Class is the field's class; "" when it is unclassified.
              name: Class
              tag: json:"class,omitempty"
              type: string
            - doc: |-
                Subject is the pointer of the store's subject — for moderated
                content, its author — or "" when the store has none.
              name: Subject
              tag: json:"subject,omitempty"
              type: string
      - doc: |-
          WorkflowService is a state machine over the entities of one store: the states an
          entity goes through, and the arrows between them. It is declared as data —
          which is why the diagram can draw it exactly — and it runs four kinds of
          transitions:

            - event transitions ([WorkflowService.On]), fired by code with [WorkflowService.Fire];
            - timer transitions ([WorkflowService.After]), fired by the workflow's own loop
              once an entity has spent a duration in a state;
            - timer transitions at an instant the entity carries ([WorkflowService.At]) — a
              due date, a deadline — fired by the same loop when it comes;
            - guard transitions ([WorkflowService.When]), fired by the same loop as soon as
              a condition on the entity holds.

          The SDK's state-machine engine runs it (statemachine), which the workflow
          subsystem plugs in (framework/app/workflow, ADR 0179 step 5). Its loop never
          polls: it keeps an agenda of the transitions due, sleeps until the
          earliest, and a write of the store — which may bring one forward — wakes
          it. A workflow with nothing due does not run at all. Transitions of one
          entity run one at a time, of different entities at once.

          The entity's state lives in the entity itself (the state function returns
          a pointer to it), so the store stays the single source of truth; the
          engine keeps, beside it, when each entity entered its state and the
          history of its transitions — in the workflow's file under the data
          directory, so a timer keeps counting across a restart.
        methods:
          - doc: Initial sets the state a new entity enters with [WorkflowService.Start].
            in:
              - name: state
                type: S
            name: Initial
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              On declares an event transition: [WorkflowService.Fire] with this event moves an
              entity in state from to state to. One event may leave several states, but
              only one arrow per (event, from).
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
            name: "On"
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              After declares a timer transition: an entity that has spent d in state from
              moves to state to, fired by the workflow's own loop. d is a duration, or a
              setting of the service that holds one — which must then be positive.
            in:
              - name: event
                type: string
              - name: d
                type: D
              - name: from
              - name: to
                type: S
            name: After
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
            typeParams:
              - constraint: Delay
                name: D
          - doc: |-
              At declares a timer transition at an instant the entity carries — a due
              date, a deadline: an entity in state from moves to state to once the time
              instant returns has come; false means no instant for now. The framework asks again
              each time the entity is written, and the workflow's own loop sleeps until
              the earliest instant.
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
              - name: instant
                type: func(E) (time.Time, bool)
            name: At
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              When declares a guard transition: an entity in state from moves to state to
              as soon as guard holds. The guard sees the entity only: the framework checks it each
              time the entity is written, never on a clock — a condition that depends on
              the time is an instant, declared with [WorkflowService.At].
            in:
              - name: event
                type: string
              - name: from
              - name: to
                type: S
              - name: guard
                type: func(E) bool
            name: When
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              OnEnter runs fn when an entity enters state, before it is stored. An error
              cancels the transition, and so does a panic — reported as
              [CodeWorkflowHookPanic], the entity free for the next transition. fn may
              change the entity, not its state nor its key ([CodeWorkflowHookChange]),
              and must not fire this workflow, which is refused
              ([CodeWorkflowReentrant]): transitions of one entity run one at a time.
            in:
              - name: state
                type: S
              - name: fn
                type: func(context.Context, *E) error
            name: OnEnter
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              OnTransition runs fn after every transition has been stored, whoever fired
              it — the natural place to publish it on a topic. An error or a panic is
              logged and shown by the Studio; the transition stands, and the next hooks
              still run.
            in:
              - name: fn
                type: func(context.Context, ChangeEvent[E, S]) error
            name: OnTransition
            out:
              - type: "*WorkflowService[E, S]"
            recv: pointer
          - doc: |-
              Start enters a new entity into the workflow: it sets the initial state,
              runs the OnEnter hooks, and inserts the entity in the store.
            in:
              - name: ctx
                type: context.Context
              - name: e
                type: E
            name: Start
            out:
              - type: E
              - type: error
            recv: pointer
          - doc: |-
              Fire moves the entity with the given key along the event transition
              leaving its current state. It is a [Conflict] error when no such
              transition exists, and a [NotFound] error when the entity does not.
            in:
              - name: ctx
                type: context.Context
              - name: key
              - name: event
                type: string
            name: Fire
            out:
              - type: E
              - type: error
            recv: pointer
          - doc: |-
              Census counts the entities per state; every declared state is present.
              The engine keeps the count; the call is drawn, as the diagram declares it,
              as a read of the store.
            in:
              - name: ctx
                type: context.Context
            name: Census
            out:
              - type: map[S]int
              - type: error
            recv: pointer
          - doc: Can reports whether event may be fired on e.
            in:
              - name: e
                type: E
              - name: event
                type: string
            name: Can
            out:
              - type: bool
            recv: pointer
        name: WorkflowService
        struct:
          unexported: true
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: |-
          Delay is how long a timer transition waits: a duration, or a setting that
          holds one — read when the delay is needed, so each environment can give
          its own.
        interface:
          embeds:
            - time.Duration | *SettingService[time.Duration]
        name: Delay
      - doc: |-
          ChangeEvent describes one transition, for [WorkflowService.OnTransition] hooks: the
          entity, the event, and the states it left and entered.
        name: ChangeEvent
        struct:
          fields:
            - doc: Key is the entity's key in the store.
              name: Key
              type: string
            - doc: Entity is the entity, as stored after the transition.
              name: Entity
              type: E
            - doc: Event is the transition's name; "create" for [WorkflowService.Start].
              name: Event
              type: string
            - doc: From is the state left; the zero S on creation.
              name: From
              type: S
            - doc: To is the state entered.
              name: To
              type: S
            - doc: Trigger is "create", "event", "timer" or "guard".
              name: Trigger
              type: string
            - doc: Caller is the node that fired it, when code did.
              name: Caller
              type: string
            - doc: At is when it happened.
              name: At
              type: time.Time
        typeParams:
          - constraint: any
            name: E
          - constraint: comparable
            name: S
      - doc: OTLPFullPolicy is what an export's full queue does with a new batch.
        name: OTLPFullPolicy
        underlying: string
      - doc: |-
          OTLPBatchValue is one batch as the product's own sender receives it
          ([OTLPSender]): its signal, [OTLPTraces] or [OTLPMetrics], and its
          OTLP/JSON document, which a collector takes as it is.
        name: OTLPBatchValue
        struct:
          fields:
            - doc: Signal is OTLPTraces or OTLPMetrics.
              name: Signal
              type: string
            - doc: Document is the OTLP/JSON export request.
              name: Document
              type: "[]byte"
      - doc: |-
          OpenTelemetryConfigurer configures the app's OTLP export: [OTLPEndpoint],
          [OTLPBounds], [OTLPWhenFull], [OTLPMaxAge], [OTLPSendTimeout],
          [OTLPSampleRatio], [OTLPDatabase], [OTLPSender].
        interface:
          unexported: true
        name: OpenTelemetryConfigurer
    variables:
      - doc: |-
          Privacy is the framework's own service: the data keys, the legal holds and the
          privacy journal of an app that keeps personal data or seals what it
          keeps. The framework mounts a copy of it — named app.privacy, a name no service of a
          product can take — in every app whose stores keep personal data or declare
          a retention, or that keeps sealed values at rest, before the product's
          services. Its stores stay in the data directory unless the product places
          them (ADR 0004): app.Keeps(app.Privacy). On a SQLite database its data
          keys stay in the data directory all the same — a key is written apart
          from every transaction, and the file's one writer may be held by the
          transaction of the write that needs it —; its holds and its journal go
          there. A product never mounts it itself.
        name: Privacy
        type: "*Service"
      - doc: |-
          PerUID is the current user: one process per user of the machine (its
          UID on Unix, its SID on Windows).
        name: PerUID
        type: ScopeValue
      - doc: |-
          PerExecutable is the running executable's path, links resolved: one
          process per installed copy of the binary.
        name: PerExecutable
        type: ScopeValue
      - doc: |-
          PerConfigDir is the user's configuration directory (os.UserConfigDir):
          one process per configuration home.
        name: PerConfigDir
        type: ScopeValue
  - doc: |-
      Package jobengine is what framework/app/jobs plugs into kit: the scheduler
      the framework's jobs run on — the SDK's scheduler, on the app's clock — and the
      schedules it reads from a job's declaration, a period or a five-field cron
      expression (ADR 0179 §1, step 7). The framework's core imports none of the SDK's
      scheduler: it reaches it through plug, and a product that declares no job
      links none of it.

      Package jobengine — the compile-time proof that the scheduler is the framework's.
    functions:
      - doc: Enable plugs the jobs' scheduler and their schedules into the framework.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/jobengine
  - doc: |-
      Package mailengine is what framework/app/mail plugs into kit: the outbox
      the framework's mailers keep — the SDK's mail spool, on the database that keeps the
      mailer's service in the queue subsystem's sealed broker, else in the data
      directory or in memory — and the transports that empty it, the SDK's SMTP
      transport and its capture transport (ADR 0179 §1, step 6). The framework's core
      imports neither the SDK's spool nor a transport: it reaches them through
      plug, and a product that declares no mailer links none of them.

      Package mailengine — the compile-time proof that the outbox is the framework's.
    functions:
      - doc: Enable plugs the mailers' outbox and their transports into the framework.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/mailengine
  - doc: |-
      Package otlpengine is what framework/app/otlp plugs into the framework:
      the export app.OTLP declares — the product's spans and the metrics the
      framework derives from them, each signal kept in a durable queue of its
      own (the SDK's app/forward over its data/queue, in the data directory, else
      in memory) and forwarded to an OpenTelemetry collector over OTLP/HTTP, or
      to the product's own sender (issue #483, ADR 0185). The framework's core
      imports none of the SDK's forward, queue or OTLP exporters: it reaches them
      through plug, and a product that declares no export links none of them.

      Package otlpengine — the compile-time proof that the export is the framework's.
    functions:
      - doc: Enable plugs the OTLP export into the framework.
        name: Enable
    path: github.com/kitsunium/sdk/framework/internal/app/otlpengine
  - constants:
      - blockDoc: The spool's refusals the framework tells apart, which it words for the product.
        doc: MailRefusalNone is no refusal the framework words.
        name: MailRefusalNone
        type: MailRefusal
        value: "0"
      - blockDoc: The spool's refusals the framework tells apart, which it words for the product.
        doc: |-
          MailRefusalClosed is a spool that is closed: its mailer is not
          running.
        name: MailRefusalClosed
        type: MailRefusal
        value: "1"
      - blockDoc: The spool's refusals the framework tells apart, which it words for the product.
        doc: MailRefusalUnencodable is a mail the outbox cannot encode.
        name: MailRefusalUnencodable
        type: MailRefusal
        value: "2"
      - blockDoc: The spool's refusals the framework tells apart, which it words for the product.
        doc: |-
          MailRefusalInvalidURL is an SMTP URL that is not one of the form
          smtp://user:password@host:port; its "problem" field says the clause.
        name: MailRefusalInvalidURL
        type: MailRefusal
        value: "3"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventOther is an event of the spool the framework shows nothing of.
        name: MailEventOther
        type: MailEvent
        value: "0"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventQueued is a mail put in the outbox.
        name: MailEventQueued
        type: MailEvent
        value: "1"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventSent is a mail the transport accepted.
        name: MailEventSent
        type: MailEvent
        value: "2"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventRetrying is a failed attempt that will be retried.
        name: MailEventRetrying
        type: MailEvent
        value: "3"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventDeadLettered is a mail given up on after its last attempt.
        name: MailEventDeadLettered
        type: MailEvent
        value: "4"
      - blockDoc: What a spool reports of a mail.
        doc: MailEventDuplicate is a redelivery of a mail already sent, dropped.
        name: MailEventDuplicate
        type: MailEvent
        value: "5"
      - blockDoc: |-
          Why a spool gave a mail up: what the framework tells the product's bounce
          hook and the Studio's mailbox of a dead letter.
        doc: MailGivenUpExhausted is a mail whose last attempt failed.
        name: MailGivenUpExhausted
        type: MailGiveUp
        value: "0"
      - blockDoc: |-
          Why a spool gave a mail up: what the framework tells the product's bounce
          hook and the Studio's mailbox of a dead letter.
        doc: |-
          MailGivenUpRejected is a mail the receiving server refused for good,
          an SMTP 5xx reply, dead-lettered without a retry.
        name: MailGivenUpRejected
        type: MailGiveUp
        value: "1"
      - blockDoc: |-
          Why a spool gave a mail up: what the framework tells the product's bounce
          hook and the Studio's mailbox of a dead letter.
        doc: |-
          MailGivenUpExpired is a mail whose attempt failed once it was older
          than the spool's MaxAge.
        name: MailGivenUpExpired
        type: MailGiveUp
        value: "2"
      - doc: LabelNode is the pprof label naming the node a goroutine works for.
        name: LabelNode
