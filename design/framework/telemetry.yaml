apiVersion: kit.kitsunium/design/v2
domain: framework/telemetry
packages:
  - codes:
      - const:
          - doc: |-
              CodeMisconfigured identifies an exporter configuration that cannot be
              honoured: no socket path, a buffer outside its bounds, an ID outside the
              grammar in the node table.
            name: CodeMisconfigured
            note: "range: 0.4.3.0 - 0.4.3.255"
            value: "0x00_04_03_01"
        type: errs.Code
      - const:
          - doc: CodeRunning identifies a Start on an exporter already started.
            name: CodeRunning
            value: "0x00_04_03_02"
        type: errs.Code
    constants:
      - blockDoc: The kinds.
        doc: KindSpan is one unit of work that ended on a node.
        name: KindSpan
        type: Kind
        value: "1"
      - blockDoc: The kinds.
        doc: |-
          KindPhase is the process changing phase: starting, serving, draining,
          stopped, failed — Op carries it.
        name: KindPhase
        type: Kind
        value: "2"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpNone
        type: Op
        value: "0"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpRequest
