    doc: |-
      Package telemetry — the exporter: a bounded ring producers never wait on,
      drained to the clients attached to a private socket, which it never reads.

      Package telemetry — the compile-time proof that Exporter is an Emitter.

      Package telemetry is the port a running product reports what it does on,
      and the exporter that hands it to a tool attached to the product (ADR 0149).

      It is not the trace domain. pkg/v1/observe/trace builds spans a backend stores and
      carries its context through context.WithValue; this port carries nothing
      through a context, builds nothing a caller keeps, and costs a producer one
      fixed-size copy into a bounded ring — zero allocations, pinned by a test
      (testing.AllocsPerRun) and measured in BENCH.md:

      	emitter.Emit(&telemetry.Event{Kind: telemetry.KindSpan, Op: telemetry.OpRequest,
      		Node: ref, Start: start, Duration: d, Outcome: telemetry.OutcomeOK})

      # A closed schema

      An [Event] holds numbers only: enumerations ([Kind], [Op], [Outcome]), a
      dotted-quad error code, instants, identifiers a trace already carries, and
      NODE REFERENCES — indexes into the table of node IDs the exporter sends once,
      in its handshake, each one checked against the ID grammar
      (framework/model.ParseID). There is no free text, so there is no field a
      person's name, an address or a request body could travel in: the schema
      itself is what keeps personal data out, in every environment.

      # Inert unless configured

      [Nop] is the emitter a product holds by default: Emit returns at once. An
      [Exporter] exists only when the product was started with one, and it only
      EMITS — it never reads what a client sends, so nothing reaches the product
      through it. It listens on a private socket (pkg/v1/proc/ipc, ADR 0148): the
      product's account and the UIDs and GIDs the deployment names, under the
      runtime directory; a stale socket is replaced, a live one refused. A client
      connects, reads one handshake line — product, binary, role, instance,
      revision, model version, design digest, the node table, the first sequence
      number — then fixed-size records ([RecordSize] bytes each) for as long as
      it reads. A slow client loses records, counted; the product never waits.

      Package telemetry — the interfaces: what a producer emits to, and what the
      exporter needs of its listener and of a client.
    functions:
      - doc: |-
          NewExporter checks cfg and builds an exporter that listens nowhere yet:
          Start opens its socket.
        in:
          - name: cfg
            type: "*ExporterConfig"
        name: NewExporter
        out:
          - type: "*Exporter"
          - type: error
      - doc: OpOf is the Op named name, or OpNone.
        in:
          - name: name
            type: string
        name: OpOf
        impl: opOf
        out:
          - type: Op
      - doc: |-
          Decode reads one record, as a client does: the event and its sequence
          number. ok is false for a record of another size or version.
        in:
          - name: b
            type: "[]byte"
        name: Decode
        out:
          - name: e
            type: Event
          - name: seq
            type: uint64
          - name: ok
            type: bool
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      ipc: github.com/kitsunium/sdk/pkg/v1/proc/ipc
    path: github.com/kitsunium/sdk/framework/telemetry
    sentinels:
      - var:
          - code: CodeMisconfigured
            doc: |-
              Misconfigured refuses an exporter that cannot be built as asked; the
              rule field says which rule failed.
            name: Misconfigured
            options:
              - errs.WithExitCode(78)
            private: "framework/telemetry: no socket path, a buffer outside [64, 1<<20], or a node ID outside the grammar; the rule field says which"
            public: The telemetry exporter is misconfigured
            reason: MISCONFIGURED
          - code: CodeRunning
            doc: Running refuses a second Start.
            name: Running
            private: "framework/telemetry: Start called on a started exporter"
            public: The telemetry exporter is already running
            reason: RUNNING
    types:
      - decl: true
        doc: Kind says what an event reports.
        name: Kind
        underlying: uint8
      - decl: true
        doc: "Op is what the work was: the span operations of framework/model."
        name: Op
        underlying: uint8
      - decl: true
        doc: Outcome says how the work ended.
        name: Outcome
        underlying: uint8
      - decl: true
        doc: |-
          NodeRef is a node's index in the handshake's node table, from 1; zero is
          "no node".
        name: NodeRef
        underlying: uint32
      - decl: true
        doc: |-
          Event is one report. Its fields are numbers only — see the package comment:
          there is no field a person's data could travel in, in any environment.
        name: Event
        struct:
          fields:
            - name: Kind
              type: Kind
            - name: Op
              type: Op
            - name: Outcome
              type: Outcome
            - doc: Node is where the work ran; From, the node it came from, if any.
              name: Node
            - doc: Node is where the work ran; From, the node it came from, if any.
              name: From
              type: NodeRef
            - doc: Code is the dotted-quad code of the error that ended it, 0 for none.
              name: Code
              type: uint32
            - doc: Start is when it began, in Unix nanoseconds; Duration, how long it took.
              name: Start
            - doc: Start is when it began, in Unix nanoseconds; Duration, how long it took.
              name: Duration
              type: int64
            - doc: TraceID and SpanID are the trace's, when there is one.
              name: TraceID
              type: "[16]byte"
            - name: SpanID
              type: "[8]byte"
      - decl: true
        doc: |-
          HelloValue is what the handshake says about the process, besides the
          operations and the record size: which product, binary and role run, from
          which revision and design, and the node table events refer to.
        name: HelloValue
        struct:
          fields:
            - doc: |-
                Product, Binary and Role name what runs: the app, the binary and the
                process role it is (framework/model's IDs).
              name: Product
            - doc: |-
                Product, Binary and Role name what runs: the app, the binary and the
                process role it is (framework/model's IDs).
              name: Binary
            - doc: |-
                Product, Binary and Role name what runs: the app, the binary and the
                process role it is (framework/model's IDs).
              name: Role
              type: string
            - doc: Revision is the VCS commit the binary was built from (vcs.revision).
              name: Revision
              type: string
            - doc: Digest is the design's digest the code was generated from, when known.
              name: Digest
              type: string
            - doc: "Nodes are the node IDs events refer to: Nodes[i] is NodeRef(i+1)."
              name: Nodes
              type: "[]string"
      - decl: true
        doc: |-
          ExporterConfig is where the exporter listens, who may attach, and how much
          it holds for a slow reader.
        name: ExporterConfig
        struct:
          fields:
            - doc: Path is the private socket's absolute path (pkg/v1/proc/ipc).
              name: Path
              type: string
            - doc: |-
                AllowUIDs and AllowGIDs admit accounts besides the product's own: the
                on-call group declared at deployment.
              name: AllowUIDs
            - doc: |-
                AllowUIDs and AllowGIDs admit accounts besides the product's own: the
                on-call group declared at deployment.
              name: AllowGIDs
              type: "[]int"
            - doc: |-
                Buffer is the ring's size in events, rounded up to a power of two, in
                [MinBuffer, MaxBuffer]; zero is DefaultBuffer.
              name: Buffer
              type: int
            - doc: Hello is what the handshake says.
              name: Hello
              type: HelloValue
      - decl: true
        doc: |-
          Exporter is an Emitter that hands events to the clients attached to its
          socket. It never blocks a producer: a full ring drops the event and counts
          it.
        implements:
          - Emitter
        methods:
          - doc: |-
              Ref is the reference of node id in the handshake's table; zero when the
              table does not hold it.
            in:
              - name: id
                type: string
            name: Ref
            impl: ref
            out:
              - type: NodeRef
            recv: pointer
          - doc: Instance is the process's instance identifier, in the handshake.
            name: Instance
            out:
              - type: string
            recv: pointer
          - doc: Dropped is how many events a full ring refused.
            name: Dropped
            out:
              - type: uint64
            recv: pointer
          - doc: Sent is how many records reached at least one client.
            name: Sent
            out:
              - type: uint64
            recv: pointer
          - doc: |-
              Emit copies ev into the ring, or drops it when the ring is full. It never
              blocks and never allocates.
            in:
              - name: ev
                type: "*Event"
            name: Emit
            recv: pointer
          - doc: |-
              Start opens the socket and starts the two goroutines: one accepts clients
              and greets them, one drains the ring to them. Both end at Stop.
            in:
              - name: ctx
                type: context.Context
            name: Start
            out:
              - type: error
            recv: pointer
          - doc: Stop closes the socket and every client, and waits for the goroutines.
            in:
              - name: ctx
                type: context.Context
            name: Stop
            out:
              - type: error
            recv: pointer
        name: Exporter
        struct:
          fields:
            - name: cfg
              type: ExporterConfig
            - name: refs
              type: map[string]NodeRef
            - name: instance
              type: string
            - name: ring
              type: ring
            - name: mask
              type: uint64
            - name: tail
              type: counter
            - name: head
              type: uint64
            - name: wake
              type: chan struct{}
            - name: dropped
              type: counter
            - name: sent
              type: counter
            - name: seq
              type: uint64
            - name: mu
              type: sync.Mutex
            - name: ln
              type: ipc.Listener
            - name: clients
              type: "[]*ipc.Conn"
            - name: cancel
              type: context.CancelFunc
            - name: done
              type: sync.WaitGroup
            - name: buf
              type: "[]byte"
      - decl: true
        doc: |-
          Emitter is where a product reports: the telemetry port. Emit copies e and
          never keeps it; it must not block and must not allocate.
        interface:
          methods:
            - in:
                - name: e
                  type: "*Event"
              name: Emit
        name: Emitter
    variables:
      - doc: |-
          OpNames are the operations' names, as framework/model spells them,
          indexed by Op. The handshake sends them, so a reader never hard-codes
          the table.
        name: OpNames
        type: "[23]string"
      - doc: |-
          Nop is the emitter that reports nothing: what a product holds unless it
          was started with an exporter.
        name: Nop
        type: Emitter
