      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        doc: The phases, for KindPhase.
        name: OpStarting
        type: Op
        value: "18"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpServing
        type: Op
        value: "19"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpDraining
        type: Op
        value: "20"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpStopped
        type: Op
        value: "21"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpFailed
        type: Op
