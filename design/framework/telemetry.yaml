      - blockDoc: The outcomes.
        name: OutcomeOK
        type: Outcome
        value: "1"
      - blockDoc: The outcomes.
        name: OutcomeError
        type: Outcome
        value: "2"
      - doc: RecordSize is the size of one record on the wire.
        name: RecordSize
        type: int
        value: "64"
      - doc: Protocol names the wire this package speaks, in the handshake.
        name: Protocol
        type: string
        value: "\"kit-telemetry/v1\""
      - blockDoc: The ring's bounds and default, in events.
        name: MinBuffer
        type: int
        value: "64"
      - blockDoc: The ring's bounds and default, in events.
        name: MaxBuffer
        type: int
        value: 1 << 20
      - blockDoc: The ring's bounds and default, in events.
        name: DefaultBuffer
        type: int
