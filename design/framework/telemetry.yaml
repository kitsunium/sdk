      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpDeliverMail
        type: Op
        value: "11"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpSecret
        type: Op
        value: "12"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpDispatch
        type: Op
        value: "13"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpAsk
        type: Op
        value: "14"
      - blockDoc: The operations, in the order of their names in [OpNames]; zero is none.
        name: OpHandle
        type: Op
