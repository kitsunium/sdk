# ADR 0156 §1: no module of the SDK requires a module outside the standard
# library; the vendor modules are ADR 0157's, and the framework's connectors
# ADR 0158's.
stdlib:
  vendors: [third-party, framework/connectors]
# The race-off allocation lane (CLAUDE.md rule 12): the hand-written
# targets, and the section kit gen keeps of it — every package whose budgets
# name a fixture, so that its gen_perf_test.go runs (ADR 0165).
allocLane: tools/alloc-lane-targets.txt
# Each designed function's performance contract (ADR 0165). What the
# compiler decides — inline, inlineCost, escapes — kit check measures from
# go build -gcflags=<package>=-m=2 on the host cell, and prints for every
# budget's function whether it holds or not. What a call costs — allocs (at
# most), allocsMin (at least) — the gen_perf_test.go kit gen writes counts,
# race off, over the hand-written fixture the budget names (func
# perf<Fixture>(tb testing.TB) func(), in the package's
# perf_fixtures_test.go), as a total over 30 000 calls after as many
# warm-up calls; bench asks it for a benchmark whose ns/op is only ever a
# benchstat delta, never a number.
budgets:
  # errs: the accessors inline (each measured "can inline": the *Error
  # field reads at cost 3, Pack at 18, CodeOf to PrivateOf at 73 to 75 —
  # HasCode does not, cost 190, and has no inline budget), the field reads
  # and Pack leak nothing (CodeOf to PrivateOf leak err, which they walk),
  # and the kernel zero-allocation gate's errs probes, bound 0.
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.Pack
    inline: true
    escapes: []
    allocs: 0
    fixture: Pack
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.CodeOf
    inline: true
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.ReasonOf
    inline: true
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.PublicOf
    inline: true
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.PrivateOf
    inline: true
  # A pkg/v1 forwarder with an inline budget forwards only while the compiler
  # inlines it, and is otherwise a variable bound to its callee: kit measures
  # it (go build -gcflags=<package>=-m=2, on the platforms' first cell) and
  # records the verdict in gen_facade.go (ADR 0166). errs.ReasonOf's forwarder
  # costs 88 against the inliner's 80 — the kernel accessor alone costs 75 —
  # and measured slower than the variable by more than the 3 % a forwarder may
  # cost (ADR 0163 §10): CPU time per call +1.88 %, +1.07 %, +3.88 % (p =
  # 0.035) and +5.13 % (p = 0.043) over four benchstat runs of ten samples,
  # +2.91 % pooled over the forty (p < 0.001). So kit writes it as
  # kerrs.ReasonOf's variable until the accessor inlines within the budget.
  # Every other forwarder is a function, whatever it costs.
  - fn: go:github.com/kitsunium/sdk/pkg/v1/errs.ReasonOf
    inline: true
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.(*Error).Code
    inline: true
    escapes: []
    allocs: 0
    fixture: ErrorCode
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.(*Error).Reason
    inline: true
    escapes: []
    allocs: 0
    fixture: ErrorReason
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.(*Error).Public
    inline: true
    escapes: []
    allocs: 0
    fixture: ErrorPublic
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.(*Error).Private
    inline: true
    escapes: []
    allocs: 0
    fixture: ErrorPrivate
  - fn: go:github.com/kitsunium/sdk/internal/kernel/errs.HasCode
    allocs: 0
    fixture: HasCode
    bench:
      nsop: {maxDelta: 3%, vs: base}
