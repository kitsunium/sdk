# design/sdk.yaml — the SDK's project file: its structure, and the rules kit
# holds it to (ADR 0163). The other files of design/ are its surface: every
# exported symbol of the SDK's modules (modules: below) — the root, internal,
# the pkg/v1 families — and of the sixteen vendor modules, one
# file per domain or package group, each with its inputs and outputs —
# `surface: closed` makes an exported symbol no file declares a finding. An
# API change starts here, then `kit gen` writes the pins, the ports, the
# codes (ADR 0164) and pkg/v1's facades (ADR 0166); and so does a doc edit
# (`docs: design`, ADR 0167): every doc comment and package comment is this
# design's, kit gen writes it into the code and each pin marker carries its
# digest. The SDK's CI reads this directory as bytes only (ADR 0163 §3).
apiVersion: kit.kitsunium/design/v2
project:
  name: sdk
  type: library
  module: github.com/kitsunium/sdk
  workspace: go.work
  # The kit this design is written for (design v2, project.kit): the daemon
  # refuses the project under any other kit, by name, and `make regen`
  # (scripts/regen.sh) refuses to run one. No part of the design's digest.
  kit:
    version: v0.1.0-rc.15
  surface: closed
  # Every doc comment is the design's (ADR 0167): kit gen writes each doc
  # slot of a designed declaration and each package's doc.go.
  docs: design
# The cells: bazel-ci.yml's cross-build matrix, one table, which
# check-platforms.sh holds equal to the matrix and genindex writes docs/api on.
platforms:
  from: scripts/ci/platforms.sh
# Outside go.work: outside the layers and the surface.
auxiliary:
  - e2e
  - tools/genindex
  - tools/netgate
  - tools/sdkguard
# The Go modules (ADR 0171 §7, platform ADR 0011): each by the directory of its
# go.mod, with every module of the repository its go.mod requires — the go
# command lists every module that provides a package to a module's build and
# tests, and kit check holds each require directive and each import, a test's
# included, to this list. The root holds the framework; internal is the one
# shared module of kernel, core and service; a family of pkg/v1 is a module.
# The requirements form no cycle: the floor on the root that §3 asks of
# internal and every family is written by the release (cut-tags.sh), never here.
modules:
  - dir: .
    requires: [internal, pkg/v1/app, pkg/v1/clock, pkg/v1/concur, pkg/v1/crypto, pkg/v1/data, pkg/v1/errs, pkg/v1/net, pkg/v1/observe, pkg/v1/proc, pkg/v1/security]
  - dir: internal
  - dir: pkg/v1/errs
    requires: [internal]
  - dir: pkg/v1/clock
    requires: [internal]
  - dir: pkg/v1/collections
    requires: [internal, pkg/v1/errs]
  - dir: pkg/v1/concur
    requires: [internal, pkg/v1/clock, pkg/v1/errs]
  - dir: pkg/v1/crypto
    requires: [internal, pkg/v1/errs]
  - dir: pkg/v1/net
    requires: [internal]
  - dir: pkg/v1/proc
    requires: [internal, pkg/v1/errs]
  - dir: pkg/v1/observe
    requires: [internal, pkg/v1/clock, pkg/v1/errs]
  - dir: pkg/v1/data
    requires: [internal, pkg/v1/clock, pkg/v1/errs, pkg/v1/proc]
  - dir: pkg/v1/security
    requires: [internal, pkg/v1/clock, pkg/v1/crypto, pkg/v1/errs, pkg/v1/observe, pkg/v1/proc]
  - dir: pkg/v1/app
    requires: [internal, pkg/v1/clock, pkg/v1/crypto, pkg/v1/data, pkg/v1/errs, pkg/v1/observe, pkg/v1/security]
  - dir: framework/connectors/mysql
    requires: [., internal, pkg/v1/app, pkg/v1/clock, pkg/v1/concur, pkg/v1/crypto, pkg/v1/data, pkg/v1/errs, pkg/v1/net, pkg/v1/observe, pkg/v1/proc, pkg/v1/security]
  - dir: framework/connectors/postgres
    requires: [., internal, pkg/v1/app, pkg/v1/clock, pkg/v1/concur, pkg/v1/crypto, pkg/v1/data, pkg/v1/errs, pkg/v1/net, pkg/v1/observe, pkg/v1/proc, pkg/v1/security]
  - dir: framework/connectors/sqlite
    requires: [., internal, pkg/v1/app, pkg/v1/clock, pkg/v1/concur, pkg/v1/crypto, pkg/v1/data, pkg/v1/errs, pkg/v1/net, pkg/v1/observe, pkg/v1/proc, pkg/v1/security]
  - dir: framework/connectors/ssh
    requires: [., internal, pkg/v1/app, pkg/v1/crypto, pkg/v1/data]
  - dir: third-party/aws
    requires: [internal]
  - dir: third-party/codec/hcl
    requires: [internal]
  - dir: third-party/codec/protobuf
    requires: [internal]
  - dir: third-party/codec/yaml
    requires: [internal]
  - dir: third-party/db/redis
    requires: [internal]
  - dir: third-party/db/writer/clickhouse
    requires: [internal]
  - dir: third-party/db/writer/mysql
    requires: [internal]
  - dir: third-party/db/writer/redis
    requires: [internal]
  - dir: third-party/ebpf
    requires: [internal]
  - dir: third-party/nats
    requires: [internal]
  - dir: third-party/transform
    requires: [internal]
  - dir: third-party/x-crypto
    requires: [internal]
# The order is the direction (ADR 0068, ADR 0147, ADR 0157); the kernel is
# rule 1, both halves; the service mirrors the core (ADR 0160); pkg/v1 is the
# facade (ADR 0074), whose re-exports are its packages' facade: (ADR 0166).
layers:
  - name: kernel
    paths: [internal/kernel]
    deps: [std]
    stdlibOnly: true
    generic: true
  - name: core
    paths: [internal/core]
    deps: [kernel]
  - name: service
    paths: [internal/service]
    deps: [kernel, core]
    mirrors: core
  - name: public
    paths: [pkg/v1]
    deps: [kernel, core, service]
    shape: facade
  - name: thirdparty
    paths: [third-party]
    deps: [kernel, core, service, public]
  - name: framework
    paths: [framework]
    deps: [public, kernel/errs]
# ADR 0155 and ADR 0159 §4. A root entry is one domain, and its own package,
# when it has one, is a root package — the family docs/api writes `root`; a
# name is a family. The kernel's and pkg/v1's root packages belong to no
# family. The core holds the seven families and no root package: its crypto,
# net and proc are their families' root packages (ADR 0155 §1). In the
# service, crypto, net and proc are one domain each — an engine beneath one
# answers to the core at its family's root (ADR 0160 §1, the ROOTS of
# check-core-symmetry.sh), which is what the mirrors rule reads; app, data,
# observe and security hold one domain per directory (its FAMILIES).
families:
  - in: [kernel]
    root: [backoff, clock, errs, jsonenc, plugin, semver, swar]
    names: [collections, concur, fs]
  - in: [core]
    names: [app, crypto, data, net, observe, proc, security]
  - in: [service]
    root: [crypto, net, proc]
    names: [app, data, observe, security]
  - in: [public]
    root: [clock, errs]
    names:
      - app
      - collections
      - concur
      - crypto
      - data
      - net
      - observe
      - proc
      - security
# A code is errs.Code's dotted quad (ADR 0005), declared by the core at the
# engine's path (ADR 0160): its package's codes: and sentinels: in the
# domain's design file, which kit gen writes into gen_codes.go (ADR 0164).
# The ranges below own the ranges (ADR 0035): kit writes them into
# codeRangeOwners, and they are authored apart from the codes they audit.
# //:audit_sources is what the errs audits read (check-audit-coverage.sh).
# A sentinel's statuses are its exit: and http: fields; one without options:
# is written with static, constants the linker initialises, and kit gen
# checks what define would have checked when the program starts (ADR 0176).
codes:
  placement: core-at-engine-path
  type: go:github.com/kitsunium/sdk/internal/kernel/errs.Code
  define: go:github.com/kitsunium/sdk/internal/kernel/errs.Define
  static: go:github.com/kitsunium/sdk/internal/kernel/errs.Static
  owners: internal/kernel/errs/gen_ranges_test.go#codeRangeOwners
  audit: BUILD.bazel#audit_sources
  # The ranges' table (ADR 0035, ADR 0164): each range MM.LL.PP and the
  # directory of the package that owns it. kit writes it into
  # internal/kernel/errs/gen_ranges_test.go (codeRangeOwners), which the
  # registry audits compare the codes with; it is authored here, apart from
  # the codes, and never derived from them.
  ranges:
    - range: 0.1.3
      owner: internal/kernel/collections/ring
    - range: 0.1.4
      owner: internal/kernel/concur/commit
    - range: 0.1.5
      owner: internal/kernel/concur/batcher
    - range: 0.1.6
      owner: internal/kernel/concur/pool
      note: ADR 0216, the bounded worker pool (#804)
    - range: 0.1.7
      owner: internal/kernel/concur/sema
      note: ADR 0216, the weighted semaphore (#812)
    - range: 0.1.8
      owner: internal/kernel/fs/seglog
      note: ADR 0230, the segmented log (#820)
    - range: 0.2.2
