      - name: KindInvalid
        type: AttrKind
        value: "0"
      - name: KindString
        type: AttrKind
        value: "1"
      - name: KindInt64
        type: AttrKind
        value: "2"
      - name: KindBool
        type: AttrKind
        value: "3"
      - name: KindStrings
        type: AttrKind
        value: "4"
      - name: CodePermissionDenied
        type: errs.Code
        value: "0x00_02_1A_01"
      - name: CodeAttributeMissing
        type: errs.Code
        value: "0x00_02_1A_02"
      - name: CodeAttributeKindMismatch
        type: errs.Code
        value: "0x00_02_1A_03"
      - name: CodePolicyMisconfigured
        type: errs.Code
        value: "0x00_02_1A_04"
