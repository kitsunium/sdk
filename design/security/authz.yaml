          - name: err
            type: error
      - in:
          - name: rules
            type: Rule
        name: NewABAC
        out:
          - name: policy
            type: Policy
          - name: err
            type: error
        variadic: true
      - in:
          - name: key
          - name: want
            type: string
        name: AttrEquals
        out:
          - name: condition
            type: Condition
          - name: err
            type: error
      - in:
          - name: key
