apiVersion: kit.kitsunium/design/v2
domain: security/authz
packages:
  - codes:
      - const:
          - doc: |-
              CodePermissionDenied identifies the single refusal this domain produces. It
              is the code every non-[Allow] outcome converts to — an explicit [Deny], an
              all-[Abstain] evaluation, a policy that could not be evaluated — because a
              caller who can tell those apart from the outside learns the shape of the
              policy set.
            name: CodePermissionDenied
            note: "range: 0.2.26.0 - 0.2.26.255"
            value: "0x00_02_1A_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeAttributeMissing identifies a rule that named an attribute the request
              does not carry. It is an evaluation FAILURE, never a false comparison: the
              rule did not run, so nothing about it was satisfied.
            name: CodeAttributeMissing
            value: "0x00_02_1A_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeAttributeKindMismatch identifies an attribute that is present but not
              the kind the rule compares — a text rule against a number, a flag rule
              against a set. Like an absent attribute, it means the rule did not run.
            name: CodeAttributeKindMismatch
            value: "0x00_02_1A_03"
        type: errs.Code
      - const:
          - doc: |-
              CodePolicyMisconfigured identifies a policy that cannot be evaluated because
              of how it was assembled: a nil [Policy] in a composition, or a [Policy] that
              returned a [Decision] outside the three named states.
            name: CodePolicyMisconfigured
            value: "0x00_02_1A_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeGrantInvalid identifies an RBAC grant table refused at construction: no
              roles attribute named, no grants, an unnamed role, a role that confers
              nothing, or a permission with an empty half.
            name: CodeGrantInvalid
            note: |-
              range: 0.3.56.0 - 0.3.56.255

              The construction refusals of the engine in internal/service/security/authz.
              The range was allocated in the service layer (LL = 3) and is declared here,
              beside the domain's verdicts, since ADR 0160: LL records the layer that
              allocated a range, not the directory its declaration lives in, so the values
              never change.
            value: "0x00_03_38_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeRuleInvalid identifies an ABAC rule set refused at construction: no
              rules, an unnamed rule, an empty action or resource, a nil condition, or an
              effect that is neither Allow nor Deny.
            name: CodeRuleInvalid
            value: "0x00_03_38_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeConditionInvalid identifies a condition constructor refused at
              construction: an empty attribute name, an empty set member, a nil inner
              condition, or a combinator over no conditions at all.
            name: CodeConditionInvalid
            value: "0x00_03_38_03"
        type: errs.Code
    constants:
      - name: KindInvalid
        type: AttrKind
        value: "0"
      - name: KindString
        type: AttrKind
        value: "1"
      - name: KindInt64
        type: AttrKind
        value: "2"
      - name: KindBool
        type: AttrKind
        value: "3"
      - name: KindStrings
        type: AttrKind
        value: "4"
      - name: Abstain
        type: Decision
        value: "0"
      - name: Allow
        type: Decision
        value: "1"
      - name: Deny
        type: Decision
        value: "2"
    functions:
      - in:
          - name: key
          - name: value
            type: string
        name: AttrString
        out:
          - type: AttrValue
      - in:
          - name: key
            type: string
          - name: value
            type: int64
        name: AttrInt64
        out:
          - type: AttrValue
      - in:
          - name: key
            type: string
          - name: value
            type: bool
        name: AttrBool
        out:
          - type: AttrValue
      - in:
          - name: key
            type: string
          - name: values
            type: string
        name: AttrStrings
        out:
          - type: AttrValue
        variadic: true
      - in:
          - name: subject
          - name: action
          - name: resource
            type: string
          - name: attrs
            type: AttrValue
        name: NewRequestValue
        out:
          - type: RequestValue
        variadic: true
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/security/authz
    sentinels:
      - note: |-
          Every verdict in the first block below carries the SAME Public sentence,
          "Access to the requested resource is denied", spelled out at each call site
          because the registry audit requires the argument to be a string literal.

          The repetition is the point, and it is a security property rather than an
          oversight: a refusal message that explains itself is a description of the
          policy set, delivered to the party the policy exists to keep out. "You are
          not an admin" names the role model. "Missing attribute department" names an
          attribute and tells the attacker which value to forge next. "Denied by rule
          7" tells them how many rules there are and which one to work around.

          The diagnosis is not lost — it is moved. Every sentinel carries a distinct
          Private, the call site attaches structured fields, and both reach the
          operator through errs.PrivateOf / errs.FieldsOf, which pkg/v1's own docs
          forbid putting on the wire. What crosses the boundary is one sentence that
          is true of every refusal and specific to none — and a test pins that the
          four Publics stay byte-identical.
        var:
          - code: CodePermissionDenied
            doc: |-
              PermissionDenied is the refusal. It is what internal/service/security/authz.Check
              returns for an explicit Deny, for an evaluation in which every policy
              abstained, and for one that could not be completed — three causes, one
              error, one code, one sentence.

              The fields distinguish them for the operator: "outcome" is "deny",
              "abstain" or "unevaluable", and an unevaluable outcome also carries the
              underlying code and reason. errs.HasCode(err, CodePermissionDenied)
              therefore answers true for every refusal, which is what a framework
              routes on.
            name: PermissionDenied
            options:
              - errs.WithHTTPStatus(httpForbidden)
            private: "core/security/authz: the request was refused; the fields carry the outcome, the subject, the action, the resource and — when the evaluation failed — the underlying code"
            public: Access to the requested resource is denied
            reason: PERMISSION_DENIED
          - code: CodeAttributeMissing
            doc: |-
              AttributeMissing is returned by a [Condition] whose rule names an
              attribute the request does not carry.

              It exists as its own code because the alternative is the defect this
              domain was written to prevent: reporting an absent attribute as a failed
              comparison. `department == "finance"` on a subject with no department is
              not false — it is unanswerable, and answering false lets a request that
              carries NO attributes at all walk past every rule of that shape. Every
              combinator treats it as absorbing, so it cannot be laundered into a
              grant by a Not, an AnyOf, or a rule whose effect happens to be Deny.
            name: AttributeMissing
            options:
              - errs.WithHTTPStatus(httpForbidden)
            private: "core/security/authz: a rule named an attribute the request does not carry; the fields name the attribute and the rule"
            public: Access to the requested resource is denied
            reason: ATTRIBUTE_MISSING
          - code: CodeAttributeKindMismatch
            doc: |-
              AttributeKindMismatch is returned by a [Condition] whose attribute is
              present but carries another kind — a number where the rule compares
              text, a set where it reads a flag.

              It is the same failure as an absent attribute wearing a different hat:
              the comparison did not happen. A kind mismatch is normally a wiring bug
              on the producing side, so it is reported rather than coerced; coercing
              would make "42" and 42 the same attribute in one direction and not the
              other, which is how a rule starts matching requests it was never
              written for.
            name: AttributeKindMismatch
            options:
              - errs.WithHTTPStatus(httpForbidden)
            private: "core/security/authz: an attribute is present but not the kind the rule compares; the fields name the attribute, the wanted kind and the kind found"
            public: Access to the requested resource is denied
            reason: ATTRIBUTE_KIND_MISMATCH
          - code: CodePolicyMisconfigured
            doc: |-
              PolicyMisconfigured is returned when a composition cannot be evaluated
              because of how it was built: a nil [Policy] among its members, or a
              member that returned a [Decision] outside the three named states.

              Both are treated as [Deny] and reported, never skipped. Skipping a nil
              policy would silently shrink the policy set — the one edit an attacker
              would most like to make — and treating an out-of-contract Decision as
              anything but a refusal would let a numeric conversion authorize.
            name: PolicyMisconfigured
            options:
              - errs.WithHTTPStatus(httpForbidden)
              - errs.WithExitCode(exitConfig)
            private: "core/security/authz: a policy could not be evaluated as assembled — a nil member, or a decision outside allow/deny/abstain; the fields carry the position and the value"
            public: Access to the requested resource is denied
            reason: POLICY_MISCONFIGURED
          - code: CodeGrantInvalid
            doc: |-
              GrantInvalid is returned by NewRBAC for a grant table that could never
              grant correctly. The fields name the offending row and role.
            name: GrantInvalid
            note: |-
              The engine's construction refusals (0.3.56.*). They are raised by
              internal/service/security/authz while a policy is being ASSEMBLED — their
              Private names that package, the one that raises them — and declared here
              since ADR 0160, so every code of the domain is in one place.

              These three carry a Public that describes a server-side configuration
              fault rather than the neutral refusal sentence the verdicts above use.
              That is deliberate and is not a leak: a construction error is returned to
              the process that is starting up, on a path where no request exists yet
              and no client is listening. It never becomes a response, so it may be
              specific. Every one is a permanent wiring fault — the same arguments are
              refused forever, and the fix is a code change at the call site — so all
              three carry EX_CONFIG.
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/authz: NewRBAC received a grant table it cannot honour; the fields carry the detail, the row index and the role"
            public: The role grant table is not usable and was refused
            reason: GRANT_INVALID
          - code: CodeRuleInvalid
            doc: |-
              RuleInvalid is returned by NewABAC for a rule set that could never
              decide correctly. The fields name the offending rule and its position.
            name: RuleInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/authz: NewABAC received a rule it cannot honour; the fields carry the detail, the rule index and the rule name"
            public: The attribute rule set is not usable and was refused
            reason: RULE_INVALID
          - code: CodeConditionInvalid
            doc: |-
              ConditionInvalid is returned by a condition constructor whose arguments
              it cannot honour. It is never an evaluation outcome: an attribute that
              is absent or of the wrong kind is AttributeMissing or
              AttributeKindMismatch, and both of those are refusals of a REQUEST,
              while this is a refusal of the RULE.
            name: ConditionInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/authz: a condition constructor received an empty key, an empty member, a nil condition or an empty set; the fields carry the detail"
            public: The condition cannot be built from the given arguments
            reason: CONDITION_INVALID
    types:
      - name: AttrKind
        underlying: uint8
      - methods:
          - name: Key
            out:
              - type: string
            recv: value
          - name: Kind
            out:
              - type: AttrKind
            recv: value
          - name: StringValue
            out:
              - name: value
                type: string
              - name: ok
                type: bool
            recv: value
          - name: Int64Value
            out:
              - name: value
                type: int64
              - name: ok
                type: bool
            recv: value
          - name: BoolValue
            out:
              - name: value
              - name: ok
                type: bool
            recv: value
          - name: StringsValue
            out:
              - name: values
                type: "[]string"
              - name: ok
                type: bool
            recv: value
          - in:
              - name: want
                type: string
            name: Contains
            out:
              - name: found
              - name: ok
                type: bool
            recv: value
        name: AttrValue
        struct:
          unexported: true
      - name: Policy
        underlying: func(ctx context.Context, request RequestValue) (Decision, error)
      - name: Condition
        underlying: func(request RequestValue) (bool, error)
      - methods:
          - name: Granted
            out:
              - type: bool
            recv: value
          - name: Valid
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: Decision
        underlying: uint8
      - methods:
          - name: Subject
            out:
              - type: string
            recv: value
          - name: Action
            out:
              - type: string
            recv: value
          - name: Resource
            out:
              - type: string
            recv: value
          - in:
              - name: key
                type: string
            name: Attr
            out:
              - name: attr
                type: AttrValue
              - name: ok
                type: bool
            recv: value
          - name: AttrCount
            out:
              - type: int
            recv: value
        name: RequestValue
        struct:
          unexported: true
  - functions:
      - in:
          - name: rules
            type: RuleValue
        name: NewABAC
        out:
          - name: policy
            type: coreauthz.Policy
          - name: err
            type: error
        variadic: true
      - in:
          - name: ctx
            type: context.Context
          - name: policy
            type: coreauthz.Policy
          - name: request
            type: coreauthz.RequestValue
        name: Check
        out:
          - type: error
      - in:
          - name: policy
            type: coreauthz.Policy
          - name: err
            type: error
        name: Must
        out:
          - type: coreauthz.Policy
      - in:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
        name: MustCondition
        out:
          - type: coreauthz.Condition
      - in:
          - name: inner
            type: coreauthz.Condition
        name: Not
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: conditions
            type: coreauthz.Condition
        name: AllOf
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
        variadic: true
      - in:
          - name: conditions
            type: coreauthz.Condition
        name: AnyOf
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
        variadic: true
      - in:
          - name: policies
            type: coreauthz.Policy
        name: DenyOverrides
        out:
          - type: coreauthz.Policy
        variadic: true
      - in:
          - name: key
          - name: want
            type: string
        name: AttrEquals
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: key
            type: string
        name: AttrIsTrue
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: key
            type: string
          - name: lo
            type: int64
        name: AttrAtLeast
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: key
          - name: want
            type: string
        name: AttrContains
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: key
            type: string
        name: AttrMatchesSubject
        out:
          - name: condition
            type: coreauthz.Condition
          - name: err
            type: error
      - in:
          - name: cfg
            type: RBACConfig
        name: NewRBAC
        out:
          - name: policy
            type: coreauthz.Policy
          - name: err
            type: error
    imports:
      coreauthz: github.com/kitsunium/sdk/internal/core/security/authz
    path: github.com/kitsunium/sdk/internal/service/security/authz
    types:
      - name: RuleValue
        struct:
          fields:
            - name: Name
              type: string
            - name: Action
              type: string
            - name: Resource
              type: string
            - name: Effect
              type: coreauthz.Decision
            - name: When
              type: coreauthz.Condition
      - name: GrantValue
        struct:
          fields:
            - name: Role
              type: string
            - name: Permissions
              type: "[]PermissionValue"
      - name: PermissionValue
        struct:
          fields:
            - name: Action
              type: string
            - name: Resource
              type: string
      - name: RBACConfig
        struct:
          fields:
            - name: RolesAttr
              type: string
            - name: Grants
              type: "[]GrantValue"
  - facade:
      - const:
          - doc: |-
              Abstain means a policy has no opinion about this request. It is the
              ZERO Decision, it grants nothing, and [Check] refuses it.
            name: Abstain
            reexport: coreauthz.Abstain
            type: Decision
            typed: true
            value: "0"
          - doc: |-
              Allow means a policy permits the request. It is the only granting state,
              and any [Deny] in the composition still outranks it.
            name: Allow
            reexport: coreauthz.Allow
            type: Decision
            typed: true
            value: "1"
          - doc: Deny means a policy refuses the request. It is absorbing.
            name: Deny
            reexport: coreauthz.Deny
            type: Decision
            typed: true
            value: "2"
          - blank: true
            doc: |-
              KindInvalid is the zero AttrKind. [NewRequest] drops an attribute
              carrying it, so such an attribute is absent rather than unusable.
            name: KindInvalid
            reexport: coreauthz.KindInvalid
            type: AttrKind
            typed: true
            value: "0"
          - doc: KindString is a single text value.
            name: KindString
            reexport: coreauthz.KindString
            type: AttrKind
            typed: true
            value: "1"
          - doc: KindInt64 is a whole number — including a Unix timestamp.
            name: KindInt64
            reexport: coreauthz.KindInt64
            type: AttrKind
            typed: true
            value: "2"
          - doc: KindBool is a flag, which can be present and false.
            name: KindBool
            reexport: coreauthz.KindBool
            type: AttrKind
            typed: true
            value: "3"
          - doc: KindStrings is an unordered set of text values — roles, groups, scopes.
            name: KindStrings
            reexport: coreauthz.KindStrings
            type: AttrKind
            typed: true
            value: "4"
      - const:
          - doc: |-
              CodePermissionDenied identifies every refusal this domain produces —
              explicit, by abstention, or by an evaluation that could not complete.
            name: CodePermissionDenied
            reexport: coreauthz.CodePermissionDenied
            type: errs.Code
            typed: true
            value: "0x00_02_1A_01"
          - doc: |-
              CodeAttributeMissing identifies a rule that named an attribute the
              request does not carry. It is a failure, never a false comparison.
            name: CodeAttributeMissing
            reexport: coreauthz.CodeAttributeMissing
            type: errs.Code
            typed: true
            value: "0x00_02_1A_02"
          - doc: |-
              CodeAttributeKindMismatch identifies an attribute present under another
              kind than the rule compares.
            name: CodeAttributeKindMismatch
            reexport: coreauthz.CodeAttributeKindMismatch
            type: errs.Code
            typed: true
            value: "0x00_02_1A_03"
          - doc: |-
              CodePolicyMisconfigured identifies a nil policy in a composition, or one
              that returned a decision outside allow/deny/abstain.
            name: CodePolicyMisconfigured
            reexport: coreauthz.CodePolicyMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_02_1A_04"
          - doc: CodeGrantInvalid identifies an RBAC grant table refused at construction.
            name: CodeGrantInvalid
            reexport: coreauthz.CodeGrantInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_38_01"
          - doc: CodeRuleInvalid identifies an ABAC rule set refused at construction.
            name: CodeRuleInvalid
            reexport: coreauthz.CodeRuleInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_38_02"
          - doc: |-
              CodeConditionInvalid identifies a condition constructor refused at
              construction.
            name: CodeConditionInvalid
            reexport: coreauthz.CodeConditionInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_38_03"
      - alias:
          - doc: |-
              Decision is the public alias for the three-valued verdict: [Allow], [Deny]
              or [Abstain]. Its zero value is [Abstain].
            name: Decision
            target: coreauthz.Decision
      - alias:
          - doc: |-
              Policy is the public alias for the authorization port. It is a func type, so
              it can never grow a method and break a downstream implementer (ADR 0039).
            name: Policy
            target: coreauthz.Policy
      - alias:
          - doc: |-
              Condition is the public alias for an attribute predicate. Returning an error
              means "could not be evaluated", which is absorbing everywhere.
            name: Condition
            target: coreauthz.Condition
      - alias:
          - doc: Request is the public alias for the immutable question a policy answers.
            name: Request
            target: coreauthz.RequestValue
      - alias:
          - doc: Attr is the public alias for one typed, named fact attached to a [Request].
            name: Attr
            target: coreauthz.AttrValue
      - alias:
          - doc: |-
              AttrKind is the public alias for the type an [Attr] carries. The kind is
              part of the attribute's identity: a text rule against a number MISMATCHES,
              it does not compare false.
            name: AttrKind
            target: coreauthz.AttrKind
      - alias:
          - doc: |-
              Permission is the public alias for one (action, resource) pair a role
              confers. Resource is the KIND of thing; instance facts belong in attributes.
            name: Permission
            target: svcauthz.PermissionValue
      - alias:
          - doc: Grant is the public alias for one role and the permissions it confers.
            name: Grant
            target: svcauthz.GrantValue
      - alias:
          - doc: RBACConfig is the public alias for [NewRBAC]'s parameters.
            name: RBACConfig
            target: svcauthz.RBACConfig
      - alias:
          - doc: |-
              Rule is the public alias for one attribute rule: what it is about, what it
              decides, and when it fires.
            name: Rule
            target: svcauthz.RuleValue
      - var:
          - doc: |-
              PermissionDenied is the one refusal. Every non-granting outcome converts
              to it, with the same code, status and sentence.
            name: PermissionDenied
            reexport: coreauthz.PermissionDenied
            type: "*kernelerrs.Error"
          - doc: |-
              AttributeMissing is reported by a condition whose rule named an
              attribute the request does not carry.
            name: AttributeMissing
            reexport: coreauthz.AttributeMissing
            type: "*kernelerrs.Error"
          - doc: |-
              AttributeKindMismatch is reported by a condition whose attribute is
              present under another kind.
            name: AttributeKindMismatch
            reexport: coreauthz.AttributeKindMismatch
            type: "*kernelerrs.Error"
          - doc: |-
              PolicyMisconfigured is reported for a nil policy in a composition, or a
              decision outside allow/deny/abstain.
            name: PolicyMisconfigured
            reexport: coreauthz.PolicyMisconfigured
            type: "*kernelerrs.Error"
          - doc: GrantInvalid is returned by [NewRBAC] for a grant table it cannot honour.
            name: GrantInvalid
            reexport: coreauthz.GrantInvalid
            type: "*kernelerrs.Error"
          - doc: RuleInvalid is returned by [NewABAC] for a rule set it cannot honour.
            name: RuleInvalid
            reexport: coreauthz.RuleInvalid
            type: "*kernelerrs.Error"
          - doc: |-
              ConditionInvalid is returned by a condition constructor for arguments it
              cannot honour.
            name: ConditionInvalid
            reexport: coreauthz.ConditionInvalid
            type: "*kernelerrs.Error"
      - func:
          doc: |-
            NewRequest builds the immutable question. Attributes are indexed by key,
            last one wins, and one with an empty key or the zero kind is dropped — so
            every attribute a rule can find is one it can use.
          forward: coreauthz.NewRequestValue
          in:
            - name: subject
            - name: action
            - name: resource
              type: string
            - name: attrs
              type: Attr
          name: NewRequest
          out:
            - type: Request
          variadic: true
      - func:
          doc: AttrString builds a text attribute.
          forward: coreauthz.AttrString
          in:
            - name: key
            - name: value
              type: string
          name: AttrString
          out:
            - type: Attr
      - func:
          doc: AttrInt64 builds a whole-number attribute. Times travel as Unix seconds.
          forward: coreauthz.AttrInt64
          in:
            - name: key
              type: string
            - name: value
              type: int64
          name: AttrInt64
          out:
            - type: Attr
      - func:
          doc: |-
            AttrBool builds a flag attribute. Present-and-false is a different fact from
            absent, and this is how the first one is stated.
          forward: coreauthz.AttrBool
          in:
            - name: key
              type: string
            - name: value
              type: bool
          name: AttrBool
          out:
            - type: Attr
      - func:
          doc: |-
            AttrStrings builds a set attribute — roles, groups, scopes. Passing no
            values states that the subject holds none, which is NOT the same as omitting
            the attribute: the first abstains, the second refuses.
          forward: coreauthz.AttrStrings
          in:
            - name: key
              type: string
            - name: values
              type: string
          name: AttrStrings
          out:
            - type: Attr
          variadic: true
      - func:
          doc: |-
            Check evaluates policy and reports the verdict as an error: nil when
            permitted, [PermissionDenied] otherwise. It is the closure — the one place
            where "nobody said Allow" becomes a refusal — and a nil policy refuses.
          forward: svcauthz.Check
          in:
            - name: ctx
              type: context.Context
            - name: policy
              type: Policy
            - name: request
              type: Request
          name: Check
          out:
            - type: error
      - func:
          doc: |-
            DenyOverrides composes policies: a [Deny] from any member wins, an [Allow]
            requires at least one grant and no refusal, and everything else abstains.
            Every member is evaluated — only a refusal short-circuits — so the result
            does not depend on the order the policies were listed in.
          forward: svcauthz.DenyOverrides
          in:
            - name: policies
              type: Policy
          name: DenyOverrides
          out:
            - type: Policy
          variadic: true
      - func:
          doc: |-
            NewRBAC builds a role-based policy over a fixed grant table. It answers
            [Allow] or [Abstain] and never [Deny] for an ungranted request — see the
            package docs for why that is what makes it composable.
          forward: svcauthz.NewRBAC
          in:
            - name: cfg
              type: RBACConfig
          name: NewRBAC
          out:
            - name: policy
              type: Policy
            - name: err
              type: error
      - func:
          doc: |-
            NewABAC builds an attribute-based policy over a fixed rule set, folded by
            the same deny-overrides algorithm the policy set is.
          forward: svcauthz.NewABAC
          in:
            - name: rules
              type: Rule
          name: NewABAC
          out:
            - name: policy
              type: Policy
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            AttrEquals holds when the request carries key as text equal to want, and
            FAILS when the attribute is absent or is not text.
          forward: svcauthz.AttrEquals
          in:
            - name: key
            - name: want
              type: string
          name: AttrEquals
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: |-
            AttrIsTrue holds when the request carries key as a flag that is set. Present
            and false does not hold; absent fails.
          forward: svcauthz.AttrIsTrue
          in:
            - name: key
              type: string
          name: AttrIsTrue
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: AttrAtLeast holds when the request carries key as a number at least lo.
          forward: svcauthz.AttrAtLeast
          in:
            - name: key
              type: string
            - name: lo
              type: int64
          name: AttrAtLeast
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: AttrContains holds when the request carries key as a set containing want.
          forward: svcauthz.AttrContains
          in:
            - name: key
            - name: want
              type: string
          name: AttrContains
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: |-
            AttrMatchesSubject holds when the request carries key as text equal to the
            subject — the ownership rule. An anonymous request owns nothing, so an empty
            subject never matches, not even an empty owner.
          forward: svcauthz.AttrMatchesSubject
          in:
            - name: key
              type: string
          name: AttrMatchesSubject
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: |-
            Not inverts a condition's answer and PROPAGATES its failure unchanged. An
            attribute the request does not carry therefore stays unevaluable instead of
            becoming "true", which is the single sharpest form of the absent-attribute
            trap.
          forward: svcauthz.Not
          in:
            - name: inner
              type: Condition
          name: Not
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
      - func:
          doc: |-
            AllOf holds when every condition holds. Every branch is evaluated, so the
            answer is order-independent and a failure anywhere is reported.
          forward: svcauthz.AllOf
          in:
            - name: conditions
              type: Condition
          name: AllOf
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            AnyOf holds when at least one condition holds — but an unevaluable branch is
            still absorbing, so a request cannot satisfy the rule by omitting the
            attribute one of its branches names.
          forward: svcauthz.AnyOf
          in:
            - name: conditions
              type: Condition
          name: AnyOf
          out:
            - name: condition
              type: Condition
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            Must unwraps a policy constructor for a package-level var, panicking on
            error. Use it on wiring written in code, never on data read at run time.
          forward: svcauthz.Must
          in:
            - name: policy
              type: Policy
            - name: err
              type: error
          name: Must
          out:
            - type: Policy
      - func:
          doc: |-
            MustCondition unwraps a condition constructor for a package-level var,
            panicking on error. Same contract as [Must].
          forward: svcauthz.MustCondition
          in:
            - name: condition
              type: Condition
            - name: err
              type: error
          name: MustCondition
          out:
            - type: Condition
    imports:
      coreauthz: github.com/kitsunium/sdk/internal/core/security/authz
      errs: github.com/kitsunium/sdk/pkg/v1/errs
      kernelerrs: github.com/kitsunium/sdk/internal/kernel/errs
      svcauthz: github.com/kitsunium/sdk/internal/service/security/authz
    path: github.com/kitsunium/sdk/pkg/v1/security/authz
