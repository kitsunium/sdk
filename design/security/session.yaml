apiVersion: kit.kitsunium/design/v2
domain: security/session
packages:
  - constants:
      - name: CodeNotFound
        type: errs.Code
        value: "0x00_02_0E_01"
      - name: CodeExpired
        type: errs.Code
        value: "0x00_02_0E_02"
      - name: CodeInvalidID
        type: errs.Code
        value: "0x00_02_0E_03"
      - name: CodeInvalidConfig
        type: errs.Code
        value: "0x00_02_0E_04"
      - name: CodeIdentifierCollision
        type: errs.Code
        value: "0x00_02_0E_05"
      - name: CodeEntropyFailed
        type: errs.Code
        value: "0x00_02_0E_06"
      - name: CodeStoreUnavailable
        type: errs.Code
        value: "0x00_02_0E_07"
      - name: CodeSealInvalid
        type: errs.Code
        value: "0x00_02_0E_08"
      - name: CodeFixationRefused
        type: errs.Code
        value: "0x00_02_0E_09"
      - name: CodeRecordCorrupt
        type: errs.Code
        value: "0x00_03_2E_01"
      - name: CodeDirectoryUnsafe
        type: errs.Code
        value: "0x00_03_2E_02"
