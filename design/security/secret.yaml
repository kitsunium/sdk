apiVersion: kit.kitsunium/design/v2
domain: security/secret
packages:
  - codes:
      - const:
          - doc: |-
              CodeNotFound identifies a secret name that holds no version in the store
              asked: never written, or supplied by nobody.
            name: CodeNotFound
            note: "range: 0.2.37.0 - 0.2.37.255"
            value: "0x00_02_25_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidName identifies a name outside the secret-name grammar: empty,
              longer than MaxNameLen, or carrying a character outside the closed alphabet.
            name: CodeInvalidName
            value: "0x00_02_25_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeReadOnly identifies a write — Put or Prune — refused by a store that
              only reads, such as the environment.
            name: CodeReadOnly
            value: "0x00_02_25_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeStoreUnavailable identifies a backend that could not be read or written:
              a permission error, a full disk, a vanished directory, a lock that could not
              be taken.
            name: CodeStoreUnavailable
            value: "0x00_02_25_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeValueRefused identifies a secret that could not be decoded: anything but
              a string, or the redaction placeholder itself fed back as if it were a value.
            name: CodeValueRefused
            value: "0x00_02_25_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeEmptyValue identifies a Put of an empty secret. An empty secret is what
              an unfilled field looks like, so it is refused rather than stored.
            name: CodeEmptyValue
            value: "0x00_02_25_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKeep identifies a Prune asked to keep fewer than one version.
              Keeping none would delete the secret, which is not what pruning means.
            name: CodeInvalidKeep
            value: "0x00_02_25_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidSubject identifies a subject outside the subject grammar: empty,
              longer than MaxSubjectLen, or carrying a character outside the closed
              alphabet (ADR 0142).
            name: CodeInvalidSubject
            value: "0x00_02_25_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidConfig identifies a store, keyring or rotator that cannot be
              built as configured: a missing directory, a directory other users can read,
              a malformed environment prefix, a rotation policy with no interval.
            name: CodeInvalidConfig
            note: |-
              range: 0.3.68.0 - 0.3.68.255

              The refusals of the engines in internal/service/security/secret — the
              concrete stores, the keyring, the rotator, the key file and the subject
              keys. The range was allocated in the service layer (LL = 3) and is declared
              here, beside the domain's verdicts, since ADR 0160: LL records the layer that
              allocated a range, not the directory its declaration lives in, so the values
              never change.
            value: "0x00_03_44_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeRecordUnreadable identifies a file-store record that exists and cannot
              be read back: truncated, tampered, written under another key, or written by
              a format this build does not know.
            name: CodeRecordUnreadable
            value: "0x00_03_44_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeEnvRefused identifies an environment that names a secret without
              supplying a usable value: both the variable and its _FILE form set, or a
              _FILE naming an empty or oversized file.
            name: CodeEnvRefused
            value: "0x00_03_44_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeSealInvalid identifies a box the keyring could not open — the single
              verdict for every cause, so Open is not an oracle.
            name: CodeSealInvalid
            value: "0x00_03_44_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureInvalid identifies a signature the keyring did not verify — the
              single verdict for every cause, so Verify is not an oracle.
            name: CodeSignatureInvalid
            value: "0x00_03_44_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyMaterialInvalid identifies a secret version a keyring cannot use as a
              key because it is not exactly one crypto.Key long.
            name: CodeKeyMaterialInvalid
            value: "0x00_03_44_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeGenerateFailed identifies a rotation whose policy could not produce a
              new secret: the generator returned an error or an empty value.
            name: CodeGenerateFailed
            value: "0x00_03_44_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyFileInvalid identifies a key file that exists and does not hold one
              key: not a regular file, or not exactly one crypto.Key long.
            name: CodeKeyFileInvalid
            value: "0x00_03_44_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyDestroyed identifies a box whose subject data key is not held:
              destroyed by an erasure, or never made (ADR 0142).
            name: CodeKeyDestroyed
            value: "0x00_03_44_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeSubjectKeyUnreadable identifies a subject data key that is held and does
              not unwrap under the root keyring: the version that wrapped it is no longer
              kept, the root secret was replaced, or the stored bytes were altered (ADR
              0142).
            name: CodeSubjectKeyUnreadable
            value: "0x00_03_44_0A"
        type: errs.Code
    constants:
      - doc: |-
          MaxNameLen is the longest secret name, in bytes. It is the length of a DNS
          label (RFC 1123), and the grammar is that label's: long enough for any name
          a person chooses, short enough for every filesystem and every environment.
        name: MaxNameLen
        type: int
        value: "63"
      - doc: |-
          MaxSubjectLen is the longest subject, in bytes: room for a SHA-512 digest in
          hexadecimal, the longest reference a caller has a reason to derive.
        name: MaxSubjectLen
        type: int
        value: "128"
      - doc: |-
          Redacted is the placeholder every rendering of a [Value] writes, whatever
          the secret holds — including nothing. One constant for every value is the
          point: a rendering that varied with the secret, even only in its length,
          would be a channel the secret leaks through.
        name: Redacted
        type: string
        value: "\"<redacted>\""
    doc: |-
      Package secret — ranges 0.2.37.* (the port's verdicts) and 0.3.68.* (the
      engines' own refusals) — ADR 0096 and ADR 0142, declared here since ADR 0160.

      Package secret — declares the sentinel *errs.Error outcomes: the verdicts of
      the ports, and the refusals of the concrete stores, the keyring, the rotator
      and the subject keys in internal/service/security/secret (ADR 0160). Each
      var's name equals its errs.Define Reason in SCREAMING_SNAKE form.

      No Public and no Private here carries a secret, and no field ever will: the
      whole domain exists so that a value can travel through a program without
      being written down by accident, and an error message is the most-written
      text a program produces. A secret's NAME is not secret and may travel as a
      log-only field, because an operator cannot act on "a secret is missing"
      without knowing which one.

      Package secret — the secret-name grammar, the one every store shares.

      Package secret declares the secret domain (ADR 0096): the [Value] a secret
      travels in, the [Store] port that keeps named secrets as numbered versions,
      the [VersionValue] a store hands back, and the one name grammar every store
      shares. Concrete stores — in memory, the process environment, a directory on
      disk — the keyring that sees a secret's versions as keys, and the rotator
      that mints them live in internal/service/security/secret; this package owns only the
      contract.

      # What the domain is for

      A secret has three properties no other value in a program has, and each of
      them is a mechanism here rather than a convention a caller must remember:

        - it must not be WRITTEN DOWN by accident. [Value] renders as a fixed
          placeholder in every rendering there is, so a struct printed while
          debugging, a configuration dumped as JSON, and an attribute a logger
          formats all print the placeholder, and only an explicit Reveal gets the
          bytes out;
        - it CHANGES. A key that is never rotated is a key whose compromise is
          permanent, so a store keeps numbered versions instead of one value, and
          the newest is current while the older ones stay readable until pruned;
        - it comes from SOMEWHERE ELSE — an orchestrator, a mounted volume, a
          directory the process owns. The [Store] port is the seam that lets the
          same code read any of them, and the one a Vault, KMS or cloud secret
          manager plugs into later without the code that reads secrets changing.

      # There is no registry

      Like lock (ADR 0052) and session (ADR 0045), this domain has no
      name->implementation registry. Which store holds a deployment's secrets is a
      decision made in code where the program is wired: resolving it from a
      configuration string would let a typo turn an encrypted store into an
      environment lookup, and the first symptom would be a missing secret in
      production.

      Package secret — the subject grammar, and the port that keeps the wrapped
      data key of each subject (ADR 0142).

      Package secret — the Value: a secret that every rendering writes as a
      placeholder, and that only an explicit Reveal hands back.
    functions:
      - doc: |-
          ValidateName reports whether name is a secret name, returning [InvalidName]
          when it is not.

          A name is 1 to [MaxNameLen] characters of lowercase ASCII letters, digits
          and '-', starting and ending with a letter or a digit — the DNS label
          grammar. Every store validates with this function, and the alphabet is
          closed rather than merely filtered because a name crosses several naming
          systems at once:

            - it is a FILE name in the file store, so it carries no path separator, no
              leading dot and no character a filesystem treats specially;
            - it is LOWERCASE only, because two names differing only by case would be
              two secrets on Linux and one file on the case-insensitive filesystems
              macOS and Windows ship by default;
            - it maps to an environment VARIABLE by upper-casing and turning '-' into
              '_', and that mapping is one-to-one only because '_' itself is not in the
              alphabet — with it, "smtp-url" and "smtp_url" would both read SMTP_URL.

          The refusal names the clause and never the rejected string. A valid name is
          not a secret and travels in other verdicts' fields; an INVALID one is
          whatever a caller passed, and the classic way to pass something invalid is
          to hand the value where the name belonged.
        in:
          - name: name
            type: string
        name: ValidateName
        out:
          - type: error
      - doc: |-
          ValidateSubject reports whether subject is a subject reference, returning
          [InvalidSubject] when it is not.

          A subject names whoever or whatever a data key belongs to — a person, a
          tenant, a record — as the caller files it. It is 1 to [MaxSubjectLen] bytes
          of lowercase ASCII letters, digits, '-', '_', '.' and ':', starting with a
          letter or a digit. The alphabet is closed because a subject is a KEY in the
          caller's storage and a field of every box sealed under it:

            - it is LOWERCASE only, because a store on a case-insensitive collation —
              the default of several SQL engines — would file "Ab" and "aB" as one
              subject, and two subjects sharing one data key erase each other;
            - it carries no separator, space or control byte, so it stands in a
              storage key, a log field and a box header without being quoted.

          A subject is a REFERENCE, never an identity: it is kept in clear in the
          store and in every box, so it must not be the e-mail address or the name it
          stands for. An HMAC of the identity under a key the caller keeps
          (pkg/v1/crypto/mac), written in hexadecimal, fits the grammar and tells whoever
          reads the store nothing.

          The refusal names the clause and never the rejected string: the string most
          likely to be refused here is the identity that should have been hashed.
        in:
          - name: subject
            type: string
        name: ValidateSubject
        out:
          - type: error
      - doc: |-
          NewValue returns a Value holding a copy of raw. The caller's slice is not
          the Value's storage, so clearing it afterwards — as anyone handling key
          material should — does not change the Value. An empty raw yields the zero
          Value.
        in:
          - name: raw
            type: "[]byte"
        name: NewValue
        out:
          - type: Value
      - doc: |-
          FromString returns a Value holding text. An empty text yields the zero
          Value.
        in:
          - name: text
            type: string
        name: FromString
        out:
          - type: Value
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/security/secret
    ports:
      - doc: |-
          Store keeps named secrets, each as a sequence of numbered versions.
          Implementations MUST be safe for concurrent use.

          Versions are numbered from 1, strictly increasing, and a number is never
          reused — not after a prune, not after a restart — because a version number
          is how a sealed box or a signature names the key that made it, and a reused
          number would hand an old box to a new key.

          The method set is five operations wide and is FROZEN: pkg/v1/security/secret aliases
          this interface, so under ADR 0039 a sixth method would break every
          downstream implementation at compile time. A new capability — deleting a
          secret outright, a conditional put — arrives as a SIBLING interface reached
          by type assertion, never as a widened Store.

          Every method validates its name through [ValidateName] first and refuses a
          malformed one with [InvalidName] before touching the backend.

          IFACE-PLUGIN: the concrete stores stay unexported behind their constructors
          in internal/service/security/secret.
        methods:
          - doc: |-
              Get returns the CURRENT version of name — the highest number kept. It
              returns [NotFound] for a name that holds no version.
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
            name: Get
            out:
              - name: current
                type: VersionValue
              - name: err
                type: error
          - doc: |-
              Versions returns every kept version of name, NEWEST FIRST, so the head
              of the slice is what Get returns. It returns [NotFound] for a name that
              holds no version, rather than an empty slice a caller might iterate
              over as if it had found a secret with no history.
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
            name: Versions
            out:
              - name: versions
                type: "[]VersionValue"
              - name: err
                type: error
          - doc: |-
              Put stores value as a new version of name — one past the highest ever
              kept, or 1 for a new name — and returns it. It refuses an empty value
              with [EmptyValue], and a store that only reads refuses every Put with
              [ReadOnly].
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
              - name: value
                type: Value
            name: Put
            out:
              - name: created
                type: VersionValue
              - name: err
                type: error
          - doc: |-
              Prune drops every version of name except the newest keep. keep below 1
              is refused with [InvalidKeep]: pruning never deletes a secret. Pruning a
              name that already holds no more than keep versions is not an error.
            in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
              - name: keep
                type: int
            name: Prune
            out:
              - type: error
          - doc: |-
              Names lists every name holding at least one version, sorted. It never
              returns a value: a caller that wants one asks for it by name.
            in:
              - name: ctx
                type: context.Context
            name: Names
            out:
              - name: names
                type: "[]string"
              - name: err
                type: error
        name: Store
      - doc: |-
          SubjectKeyStore keeps one wrapped data key per subject: the bytes the
          subject-key engine (internal/service/security/secret, SubjectKeys) seals a subject's
          data key into under the root keyring, which nothing but that engine, holding
          the root they were wrapped under, can open. The caller implements it over
          its own storage — a document store, a table — or takes the memory one the
          service ships.

          Implementations MUST be safe for concurrent use, and Insert and Replace MUST
          be atomic across every process that shares the storage. That is the whole
          of what the engine asks, and a store that cannot promise it LOSES data
          rather than failing:

            - an Insert that is not insert-if-absent lets two processes both create
              the first key of one subject, and every box sealed under the key that
              was overwritten opens nowhere again;
            - a Replace that is not compare-and-swap lets a re-wrap write back a key an
              erasure destroyed while the re-wrap ran, and the erasure is undone.

          Absent and taken are answers, not errors, as in the state-machine port (ADR
          0120): Get reports found, Insert inserted, Replace replaced and Delete
          deleted — each false, with a nil error, for the ordinary case — so an error
          from a method always means the store FAILED.

          The engine validates every subject with [ValidateSubject] before it calls,
          and never touches a slice it handed over once the call returns; a store
          keeps its own copy, and a slice it returns belongs to the caller.

          The method set is FROZEN at five (ADR 0039): pkg/v1/security/secret aliases this
          interface, so a sixth method would break every implementation downstream. A
          new capability — an index that answers the oldest root version without a
          scan — arrives as a SIBLING interface reached by type assertion.
        methods:
          - doc: |-
              Get returns the wrapped key filed under subject, and found == false —
              with a nil error — when there is none.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
            name: Get
            out:
              - name: wrapped
                type: "[]byte"
              - name: found
                type: bool
              - name: err
                type: error
          - doc: |-
              Insert files wrapped under subject when no key is filed there. When one
              is, it stores nothing and reports inserted == false with a nil error.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
              - name: wrapped
                type: "[]byte"
            name: Insert
            out:
              - name: inserted
                type: bool
              - name: err
                type: error
          - doc: |-
              Replace files next under subject only while subject still holds
              current, byte for byte. When it holds anything else — or nothing,
              because the key was destroyed meanwhile — it stores nothing and reports
              replaced == false with a nil error: a re-wrap never brings back a key
              an erasure destroyed.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
              - name: current
              - name: next
                type: "[]byte"
            name: Replace
            out:
              - name: replaced
                type: bool
              - name: err
                type: error
          - doc: |-
              Delete removes the key filed under subject and reports whether there
              was one. It is the destruction a cryptographic erase rests on, so the
              key must leave the storage the store READS — a document store folds
              what it overwrote, a table deletes the row. Copies the backend keeps
              elsewhere — a write-ahead log, a replica, a backup — stay wrapped under
              the root version that sealed them, and open only while it is kept.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
            name: Delete
            out:
              - name: deleted
                type: bool
              - name: err
                type: error
          - doc: |-
              All yields every filed key once, then stops; an error ends the
              sequence. The engine replaces keys while it ranges, so an
              implementation holds no lock across a yield, and a key filed during
              the sequence may or may not be yielded.
            in:
              - name: ctx
                type: context.Context
            name: All
            out:
              - type: iter.Seq2[SubjectKeyValue, error]
        name: SubjectKeyStore
    sentinels:
      - var:
          - code: CodeNotFound
            doc: |-
              NotFound is returned by Get, Versions and Prune for a name that holds
              no version — never written to a writable store, or supplied by nobody
              to a read-only one.
            name: NotFound
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: the store holds no version under the requested name; the field names it, the value never existed"
            public: No secret has that name
            reason: NOT_FOUND
          - code: CodeInvalidName
            doc: |-
              InvalidName is returned by every Store method, and by ValidateName, for
              a name outside the grammar. The grammar is closed on purpose: a name
              becomes a file name in one store and a variable name in another, and a
              character one of them treats specially would make two stores disagree
              about which secret a name designates.
            name: InvalidName
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: a name must be 1-63 characters of a-z, 0-9 and '-', starting and ending with a letter or a digit"
            public: That is not a valid secret name
            reason: INVALID_NAME
          - code: CodeReadOnly
            doc: |-
              ReadOnly is returned by Put and Prune on a store that only reads. The
              environment is the shipped example: the process did not write its own
              environment and cannot rotate what an orchestrator mounted.
            name: ReadOnly
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: Put or Prune was called on a store that only reads — rotate at the source that supplies it"
            public: This secret store cannot be written
            reason: READ_ONLY
          - code: CodeStoreUnavailable
            doc: |-
              StoreUnavailable is returned when the backend itself failed. It carries
              EX_TEMPFAIL and 503 because a retry is meaningful, which is what
              separates it from every other verdict in this block.
            name: StoreUnavailable
            options:
              - errs.WithExitCode(exitTempFail)
              - errs.WithHTTPStatus(httpUnavailable)
            private: "core/security/secret: the backend could not be read or written, or its lock could not be taken; the fields name the operation and the secret, never a value"
            public: The secret store is unavailable
            reason: STORE_UNAVAILABLE
          - code: CodeValueRefused
            doc: |-
              ValueRefused is returned by Value.UnmarshalJSON and Value.UnmarshalText.

              Two inputs are refused. A JSON token that is not a string: a number has
              already been re-spelled on its way to the decoder — 1e3 arrives as 1000
              and a twenty-digit token loses its tail to float64 — so accepting it
              would store a secret the operator never wrote. And the redaction
              placeholder itself: it is what every rendering of a Value writes, so
              finding it on the way IN means a rendered configuration was fed back as
              a real one, and every secret in it would silently become the placeholder.
            name: ValueRefused
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: the decoder was given a non-string JSON token or the redaction placeholder; quote the secret, and never reload a rendered configuration"
            public: A secret can only be decoded from a string, and never from its own placeholder
            reason: VALUE_REFUSED
          - code: CodeEmptyValue
            doc: |-
              EmptyValue is returned by Put for an empty secret. Storing one would
              turn an unfilled field into a version every reader then trusts (ADR
              0031: a zero value is refused where no default is safe, and no secret
              is a safe default).
            name: EmptyValue
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: Put was given a zero Value; an empty secret is what an unfilled field looks like"
            public: An empty secret cannot be stored
            reason: EMPTY_VALUE
          - code: CodeInvalidKeep
            doc: |-
              InvalidKeep is returned by Prune when asked to keep fewer than one
              version. Keeping none would delete the secret, and deletion is a
              different decision from pruning — one a rotation must never take by
              arithmetic accident.
            name: InvalidKeep
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: Prune was asked to keep fewer than one version, which would delete the secret rather than prune it"
            public: A prune must keep at least one version
            reason: INVALID_KEEP
          - code: CodeInvalidSubject
            doc: |-
              InvalidSubject is returned by ValidateSubject, and by every call that
              takes a subject, for a subject outside the grammar (ADR 0142). The
              rejected string is never repeated: the one most likely to be refused is
              the identity a caller forgot to derive a reference from.
            name: InvalidSubject
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/secret: a subject must be 1-128 bytes of a-z, 0-9, '-', '_', '.' and ':', starting with a letter or a digit"
            public: That is not a valid subject reference
            reason: INVALID_SUBJECT
          - code: CodeInvalidConfig
            doc: |-
              InvalidConfig is returned by every engine constructor for a
              configuration it cannot honour (ADR 0031): a missing directory, a
              directory other accounts can read, a malformed prefix, a nil store, a
              rotation policy with no interval, fewer than two kept versions, or no
              generator. The fields name the setting and the clause, never a value.
            name: InvalidConfig
            note: |-
              The engines' own refusals (0.3.68.*). They are raised by
              internal/service/security/secret — their Private names that package, the
              one that raises them — and declared here since ADR 0160, so every code of
              the domain is in one place.

              No Public, Private or field here carries a secret, a data key or a sealed
              box either. A secret's name, a version number, an environment variable's
              NAME, a valid subject reference and an operation may travel as log-only
              fields; a file path does not, because the directory a store owns is a
              deployment detail an error has no reason to repeat.
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: a constructor refused its configuration; the fields name the setting and the clause"
            public: The secret store configuration is not usable
            reason: INVALID_CONFIG
          - code: CodeRecordUnreadable
            doc: |-
              RecordUnreadable is returned by the file store for a record it found and
              could not read back. It is NOT transient, which is what separates it
              from StoreUnavailable: the likeliest cause is a store opened with a
              different key from the one that wrote it, and retrying reads the same
              bytes with the same key.
            name: RecordUnreadable
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: a file-store record is truncated, tampered, sealed under another key, or of an unknown format; the field names the secret"
            public: A stored secret could not be read back
            reason: RECORD_UNREADABLE
          - code: CodeEnvRefused
            doc: |-
              EnvRefused is returned by the environment store when the environment
              names a secret without supplying a usable value. Setting both NAME and
              NAME_FILE is refused rather than resolved by a precedence rule, exactly
              as the official container images refuse it: the operator meant one of
              them, and picking silently is how the wrong one ends up in production.
            name: EnvRefused
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: both the variable and its _FILE form are set, or the _FILE form names an empty or oversized file; the fields name the variables"
            public: The environment does not supply a usable value for that secret
            reason: ENV_REFUSED
          - code: CodeSealInvalid
            doc: |-
              SealInvalid is returned by Keyring.Open for every failure without
              distinguishing them: a box too short to carry a header, an unknown
              format, a version no longer kept, a flipped bit, the wrong associated
              data. One verdict is what keeps Open from being an oracle — the posture
              crypto.DecryptionFailed takes for the AEAD underneath.
            name: SealInvalid
            private: "service/security/secret: the box failed to open — malformed, sealed under a version no longer kept, tampered, or bound to other data — deliberately not distinguished"
            public: That sealed value could not be opened
            reason: SEAL_INVALID
          - code: CodeSignatureInvalid
            doc: |-
              SignatureInvalid is returned by Keyring.Verify for every failure without
              distinguishing them, for the same reason SealInvalid does.
            name: SignatureInvalid
            private: "service/security/secret: the signature failed to verify — malformed, made under a version no longer kept, or over other bytes — deliberately not distinguished"
            public: That signature is not valid
            reason: SIGNATURE_INVALID
          - code: CodeKeyMaterialInvalid
            doc: |-
              KeyMaterialInvalid is returned by the keyring when the version it must
              use is not exactly one crypto.Key long. A keyring's versions are keys, and a
              password stored under a keyring's name is not one: stretching it
              silently would hide that it was never random.
            name: KeyMaterialInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: a keyring version is not exactly 32 bytes; generate its versions with Random(32)"
            public: That secret cannot be used as a key
            reason: KEY_MATERIAL_INVALID
          - code: CodeGenerateFailed
            doc: |-
              GenerateFailed is returned by a rotation whose policy could not produce
              a new secret. Nothing is stored and nothing is pruned, so the current
              version stays current.
            name: GenerateFailed
            private: "service/security/secret: the rotation policy's generator returned an error or an empty value; the current version is unchanged"
            public: A new secret could not be generated
            reason: GENERATE_FAILED
          - code: CodeKeyFileInvalid
            doc: |-
              KeyFileInvalid is returned by KeyFile for a file that exists and does not
              hold one key: a directory or a device where a file belongs, or content
              that is not exactly one crypto.Key long. It is never repaired — a key
              truncated or padded to fit is a different key, and a store sealed under
              the original would then read as corrupt.
            name: KeyFileInvalid
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: the key file is not a regular file or is not exactly 32 raw bytes; the content is never repeated"
            public: The key file does not hold a key
            reason: KEY_FILE_INVALID
          - code: CodeKeyDestroyed
            doc: |-
              KeyDestroyed is returned by SubjectKeys.Open for a box whose data key
              is not held — the answer an erasure exists to produce, so a caller
              reading records treats it as "this value was erased" rather than as a
              fault. It cannot tell a key destroyed from one never made, nor from a
              box whose key identifier was edited: telling them apart would mean
              keeping a trace of every erased subject, which is what an erasure
              removes.
            name: KeyDestroyed
            private: "service/security/secret: the box names a subject key that is not held — destroyed by an erasure, or never made — and nothing can open it again"
            public: That value was erased
            reason: KEY_DESTROYED
          - code: CodeSubjectKeyUnreadable
            doc: |-
              SubjectKeyUnreadable is returned when a subject's data key is held and
              does not unwrap under the root keyring. It is NOT an erasure and must
              never be read as one: the likeliest causes are a root secret replaced by
              another value under the same version number, and a root version pruned
              while a key was still wrapped under it — which RotatorConfig.InUse
              exists to prevent. The engine never replaces such a key; Destroy
              removes it.
            name: SubjectKeyUnreadable
            options:
              - errs.WithExitCode(exitConfig)
            private: "service/security/secret: a subject key is held and does not open under the root keyring — its version pruned, the root replaced, or the record altered; the field names the subject"
            public: A data key could not be unwrapped
            reason: SUBJECT_KEY_UNREADABLE
    types:
      - doc: |-
          VersionValue is one version of one secret: which secret, which version, the
          secret itself, and when the store recorded it.

          It renders safely: [Value] redacts itself, so %+v of a VersionValue, or its
          JSON, prints the name, the number and the instant, and the placeholder where
          the secret would be.

          pkg/v1/security/secret aliases it as Versioned. It is a published concrete shape the
          SDK RETURNS, so ADR 0040 applies with its full cost: a caller destructuring
          it positionally breaks on an added field, and the licence to change it ends
          at v1.
        name: VersionValue
        struct:
          fields:
            - doc: Name is the secret's name, in the grammar [ValidateName] accepts.
              name: Name
              type: string
            - doc: |-
                Version is this version's number: 1 for the first, strictly increasing,
                never reused.
              name: Version
              type: int
            - doc: Value is the secret.
              name: Value
              type: Value
            - doc: |-
                Created is when the store recorded this version, from the store's own
                clock. A store that cannot know — the environment does not say when a
                variable was set — reports the zero time, and says so in its doc.
              name: Created
              type: time.Time
      - doc: |-
          SubjectKeyValue is one subject's wrapped data key, as a [SubjectKeyStore]
          keeps it and yields it from All.

          pkg/v1/security/secret aliases it as WrappedKey. It is a published concrete shape
          the SDK hands to callers, so ADR 0040 applies: a caller destructuring it
          positionally breaks on an added field, and the licence to change it ends at
          v1.
        name: SubjectKeyValue
        struct:
          fields:
            - doc: |-
                Subject is whom the key belongs to, in the grammar [ValidateSubject]
                accepts.
              name: Subject
              type: string
            - doc: |-
                Wrapped is the data key sealed under the root keyring: ciphertext,
                bound to Subject, readable by nothing without the root.
              name: Wrapped
              type: "[]byte"
      - doc: |-
          Value is an immutable secret: a password, a token, a connection string, key
          material. It exists so that a secret can travel through a program — a
          configuration struct, a log line, an error, a JSON dump — without being
          written down on the way.

          Immutable means the BYTES: nothing reachable from a Value changes them, so
          copies share them safely. The two decoders assign a new Value to the
          variable they are given — exactly as time.Time's UnmarshalJSON assigns a new
          Time — which replaces what the variable holds and changes no bytes any other
          copy holds; that is what lets a configuration loader fill a Value field.

            - EVERY rendering writes [Redacted]: String, GoString, Format (so %v, %+v,
              %#v, %s and %q alike), MarshalJSON, MarshalText. A configuration dumped
              for a --show-config flag, a struct printed while debugging and a value
              logged by a handler that did not know what it held all print the same
              ten characters.
            - [Value.Reveal] and [Value.RevealString] are the only ways out, and they
              are spelled to read like a decision at the call site that makes it.
            - [Value.Equal] compares in constant time, and == does not compile: the
              struct carries a zero-size field of a non-comparable type, so neither
              the byte comparison that leaks a shared prefix's length nor a pointer
              comparison that answers "same allocation" can be written by accident.
              A Value cannot be a map key for the same reason.
            - It DECODES from a JSON string and from text, so a configuration loader
              fills a Value field from a file or from the environment exactly as it
              fills a string field. It refuses anything that is not a string, and the
              placeholder itself — see [ValueRefused].

          The bytes sit behind a pointer rather than in the struct, and that is a
          defence, not a detail. fmt cannot call Format on a Value held in an
          UNEXPORTED field of another struct — reflection will not hand it the method
          — so it prints that field's own fields instead. Holding a slice there would
          print the secret as a list of byte values; holding a pointer prints an
          address. A Value in an exported field, a slice, a map or a variable is
          formatted through its methods and prints the placeholder.

          The zero Value is the empty secret: [Value.IsZero] reports it, it reveals
          nil, and a store refuses to Put it.
        methods:
          - doc: |-
              Reveal returns a fresh copy of the secret's bytes — the only way out besides
              [Value.RevealString]. The copy is the caller's: mutating it cannot reach the
              Value. The zero Value reveals nil.

              Hand the result to the API that consumes the secret; never to a logger, a
              metric label, a URL or an error message.
            name: Reveal
            out:
              - type: "[]byte"
            recv: value
          - doc: |-
              RevealString returns the secret as a string. The same warning as
              [Value.Reveal] applies, with one more: a Go string cannot be cleared, so a
              revealed string lives until the collector reclaims it.
            name: RevealString
            out:
              - type: string
            recv: value
          - doc: IsZero reports whether the Value is the empty secret.
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              Len reports the secret's length in bytes. A length is metadata, not the
              secret, and a caller validating key material needs it; it is exposed here
              so that nobody reveals a secret only to measure it.
            name: Len
            out:
              - type: int
            recv: value
          - doc: |-
              Equal reports whether v and other hold the same bytes, in time that does not
              depend on how many leading bytes they share. Two zero Values are equal.

              What IS observable is whether the two lengths match: crypto/subtle returns
              at once on a length mismatch, as every constant-time comparison in the
              standard library does. Compare against a value of the length you expect, or
              compare digests, when the length itself must stay private.
            in:
              - name: other
                type: Value
            name: Equal
            out:
              - type: bool
            recv: value
          - doc: String implements fmt.Stringer and always writes [Redacted].
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              GoString implements fmt.GoStringer so %#v stays redacted: fmt bypasses
              String for Go-syntax formatting and would otherwise print the struct.
            name: GoString
            out:
              - type: string
            recv: value
          - doc: |-
              Format implements fmt.Formatter, so EVERY verb writes the placeholder — %v,
              %+v, %#v, %s, %x and the rest. %q writes it quoted, because a caller who
              asked for quotes is usually building a larger quoted rendering.
            in:
              - name: state
                type: fmt.State
              - name: verb
                type: rune
            name: Format
            recv: value
          - doc: |-
              MarshalJSON implements json.Marshaler and writes [Redacted] as a JSON string,
              so a configuration dumped as JSON never carries the secret. encoding/json
              escapes the angle brackets, which changes the spelling on the wire and not
              the string it decodes to.
            name: MarshalJSON
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: value
          - doc: |-
              MarshalText implements encoding.TextMarshaler and writes [Redacted], which is
              what TOML, YAML, XML and log/slog's text handler reach for.
            name: MarshalText
            out:
              - name: text
                type: "[]byte"
              - name: err
                type: error
            recv: value
          - doc: |-
              UnmarshalJSON implements json.Unmarshaler. It accepts a JSON STRING and
              nothing else: a number has already been re-spelled before a decoder sees it
              (1e3 arrives as 1000, a twenty-digit token loses its tail to float64), so
              storing one would store a secret nobody wrote. A null leaves the Value as it
              was, which is encoding/json's own convention for a field that decodes
              itself. Every refusal is [ValueRefused], and none of them quotes the input.
            in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
          - doc: |-
              UnmarshalText implements encoding.TextUnmarshaler. The text becomes the
              secret, copied — except [Redacted] itself, which is refused with
              [ValueRefused]: every rendering of a Value writes it, so finding it on the
              way in means a rendered configuration was loaded as a real one, and every
              secret in it would otherwise silently become the placeholder.
            in:
              - name: text
                type: "[]byte"
            name: UnmarshalText
            out:
              - type: error
            recv: pointer
        name: Value
        struct:
          unexported: true
  - doc: |-
      Package secret — the read-only store over the process environment, with the
      NAME_FILE convention Docker and Kubernetes secrets use.

      Package secret — the file store: a directory the store owns, one record per
      secret published atomically through vfs, writers serialised across
      processes through the lock domain, and optional sealing at rest.

      Package secret — the file store's construction parameters and the checks
      that refuse a directory the store cannot keep secrets in.

      Package secret — the file store's on-disk record: one JSON document per
      secret, sealed when the store has a key.

      Package secret — the file store's honest refusal where its mechanics do not
      exist (ADR 0018 §(a): a uniform typed sentinel, never a silent downgrade and
      never a build break).

      The store rests on vfs.NewOS, which refuses the same platforms for reasons
      its own osguard_other.go records: on Windows a directory cannot be flushed,
      so a published name and the bytes it names can disagree after a crash, and
      a permission mode is not an ACL, so 0600 would exclude nobody. A secret
      store that reported success while doing neither is the one this domain
      exists not to ship. The memory and environment stores work everywhere.

      Package secret — the file store's platform gate, on the platforms that have
      what it rests on: vfs's atomic publication with a flushed directory entry,
      permission bits that exclude other accounts, and the lock domain's flock(2).

      Package secret — the machine-local key file: one crypto.Key, created on
      first use, the same key for every process that asks at once.

      Package secret — the keyring: the versions of one secret seen as keys.

      Package secret — a keyring read once: the root view a pass over many
      wrapped keys uses.

      Package secret — the in-process store.

      Package secret — the rotator: a policy that mints new versions of one
      secret on a schedule, keeping enough old ones that nothing sealed before a
      rotation breaks because of it.

      Package secret — the subject box: what SubjectKeys.Seal returns, and the
      associated data it and a wrapped key are bound to.

      Package secret — the bounded cache of opened subject keys, and the order it
      keeps between filling an entry and destroying a key.

      Package secret — subject keys: one data key per subject, wrapped by a root
      keyring that rotates, and destroyed to erase everything it sealed (ADR 0142).

      Package secret — the in-process subject-key store.

      Package secret — what a rotation of the root costs the subject keys: one
      re-wrap per subject, and a version kept while a key still needs it.

      Package secret provides the concrete secret stores — in memory, the process
      environment, a directory on disk — the Keyring that sees one secret's
      versions as keys, and the Rotator that mints new versions on a schedule
      (ADR 0096). Every store implements core/security/secret.Store.

      This file holds the argument checks every store applies identically and the
      version arithmetic they share, so that three backends cannot disagree about
      what a valid Put or a correct prune is.

      Package secret — the two ways this package turns a failure into a verdict:
      storeFailure, around the error a caller's SubjectKeyStore returned, and
      wrapAs, around one of the domain's sentinels. Every sentinel and code it
      raises is declared in internal/core/security/secret (ADR 0160); this
      package declares none.

      No Public, Private or field built here carries a secret, a data key or a
      sealed box. A secret's name, a version number, an environment variable's
      NAME, a valid subject reference and an operation may travel as log-only
      fields; a file path does not, because the directory a store owns is a
      deployment detail an error has no reason to repeat.
    functions:
      - doc: |-
          NewEnv returns a read-only Store over the process environment.

          The secret "smtp-url" under prefix "APP" is read from the variable
          APP_SMTP_URL, or — the Docker and Kubernetes convention — from the file the
          variable APP_SMTP_URL_FILE names, with ONE trailing line ending removed,
          because a file written with `echo` ends with one and a password does not.
          Setting both is refused with [coresecret.EnvRefused] rather than resolved by a
          precedence rule, exactly as the official container images refuse it. An
          empty variable counts as unset, since shells and compose files export empty
          variables to mean exactly that; an empty FILE is refused, since a file named
          explicitly and found empty is a mount that did not populate.

          Every secret it returns is version 1: the environment carries one value and
          no history. Created is the file's modification time for the _FILE form and
          the zero time for a variable, which says when it was set to nobody.

          Put and Prune are refused with core/security/secret.ReadOnly: the process did not
          write its own environment and cannot rotate what an orchestrator mounted.
        in:
          - name: cfg
            type: EnvConfig
        name: NewEnv
        out:
          - name: store
            type: coresecret.Store
          - name: err
            type: error
      - doc: |-
          NewFile returns a Store that keeps its secrets in cfg.Dir.

          Every write — a Put, a Prune — publishes the secret's whole record through
          vfs.WriteAtomic, so a reader, in this process or another, sees the history
          before the write or after it and never a torn file; and the record is 0600
          in a 0700 directory. Writers of one secret are serialised through the lock
          domain's file locker, whose lock files live beside the records, because a
          Put reads the history to number the new version and two unserialised Puts
          would mint the same number. Reads take no lock: the rename is the
          synchronisation.

          With cfg.Key set, nothing readable is written: each record is sealed with
          AES-256-GCM, bound to the secret's name, before it is published — and the
          temporary the publication writes first holds the same sealed bytes.

          It refuses at CONSTRUCTION: a configuration it cannot honour
          ([coresecret.InvalidConfig]), a directory another account can read ([coresecret.InvalidConfig],
          never narrowed silently), and — with core/proc.UnsupportedPlatform — a
          platform where vfs cannot publish atomically or the lock cannot exclude,
          which today is every platform but the Unix family. The directory is not
          touched when the platform is refused.

          The store also implements io.Closer, which releases the directory handle;
          every call after Close fails with core/security/secret.StoreUnavailable.
        in:
          - name: cfg
            type: FileConfig
        name: NewFile
        out:
          - name: store
            type: coresecret.Store
          - name: err
            type: error
      - doc: |-
          KeyFile returns the crypto.Key held in the file at path, creating the file
          with a fresh random key the first time — the machine-local key a sealed file
          store (FileConfig.Key) is opened with.

          The file holds exactly one key as RAW bytes: exactly crypto.KeyLen of them,
          no encoding, no line ending. `openssl rand 32 > key` writes one. Anything
          else is refused with [coresecret.KeyFileInvalid] — never truncated, never padded, never
          decoded, because a key reshaped to fit is a different key and a store sealed
          under the original would then read as corrupt.

          An absent file is created: crypto/rand bytes are written to a temporary 0600
          file in the same directory, flushed, and PUBLISHED with a hard link, which
          the kernel refuses when the name already exists. So two processes starting
          at once cannot both win: the loser's link fails, it reads the winner's file,
          and both return the same key — which is the property a shared store needs.
          The directory is created 0700 when it has to be made, and flushed after the
          link, so the name survives a crash alongside the bytes.

          An existing file with ANY group or world permission bit is refused with
          [coresecret.InvalidConfig] — the rule the file store's directory follows, and never
          narrowed behind the operator's back. The error never contains the key, and
          never the content of a file that was refused.

          It refuses with core/proc.UnsupportedPlatform wherever the file store does —
          today every platform outside the Unix family. On Windows a mode is not an
          access list: 0600 maps to nothing but the read-only attribute and excludes
          no account, so a key file there would promise a protection it does not
          have. Nothing is created where it refuses.
        in:
          - name: path
            type: string
        name: KeyFile
        out:
          - name: key
            type: corecrypto.Key
          - name: err
            type: error
      - doc: |-
          NewKeyring returns the keyring over the versions of name in store. It
          refuses a nil store and a malformed name at construction; it does not
          require the secret to exist yet — a Rotator's Ensure, or any Put, creates
          it, and until then Seal and Sign report core/security/secret.NotFound.
        in:
          - name: store
            type: coresecret.Store
          - name: name
            type: string
        name: NewKeyring
        out:
          - name: keyring
            type: "*Keyring"
          - name: err
            type: error
      - doc: |-
          NewMemory returns a Store that keeps every version in this process's memory.
          It cannot fail: there is nothing to open and nothing a configuration can get
          wrong.
        in:
          - name: cfg
            type: MemoryConfig
        name: NewMemory
        out:
          - type: coresecret.Store
      - doc: |-
          Random returns a generator of n bytes from crypto/rand — the one a Keyring's
          versions need with n = 32. An n below 16 bytes yields a generator that
          refuses every call with [coresecret.InvalidConfig], so the mistake surfaces at the
          first Ensure rather than as a guessable secret.
        in:
          - name: "n"
            type: int
        name: Random
        out:
          - type: func() (coresecret.Value, error)
      - doc: |-
          NewRotator validates cfg and returns a rotator. It refuses a nil store, a
          malformed name, a non-positive interval, fewer than two kept versions and a
          nil generator — each with [coresecret.InvalidConfig] naming the setting — and touches
          nothing: the secret is created by Ensure, not here.
        in:
          - name: cfg
            type: RotatorConfig
        name: NewRotator
        out:
          - name: rotator
            type: "*Rotator"
          - name: err
            type: error
      - doc: |-
          SubjectOf returns the subject a box sealed by [SubjectKeys.Seal] names,
          without opening it — what an erasure reads to find which keys the records it
          erases were sealed under. It answers [coresecret.SealInvalid] for anything that is not
          a subject box. The subject is not secret: it is a reference, and it travels
          in clear in every box.
        in:
          - name: box
            type: "[]byte"
        name: SubjectOf
        out:
          - name: subject
            type: string
          - name: err
            type: error
      - doc: |-
          NewSubjectKeys validates cfg and returns the engine. It refuses a nil root,
          a nil store, a negative cache size, a cache without a CacheTTL and a
          CacheTTL without a cache, each with [coresecret.InvalidConfig] naming the setting, and
          touches nothing: a key is made by the first Seal of its subject.
        in:
          - name: cfg
            type: SubjectKeysConfig
        name: NewSubjectKeys
        out:
          - name: keys
            type: "*SubjectKeys"
          - name: err
            type: error
      - doc: |-
          NewMemorySubjectKeyStore returns a core/security/secret.SubjectKeyStore that keeps
          every wrapped key in this process's memory. It cannot fail. Insert and
          Replace are atomic within the process — the only one that can see the map.
        name: NewMemorySubjectKeyStore
        out:
          - type: coresecret.SubjectKeyStore
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
      corelock: github.com/kitsunium/sdk/internal/core/app/lock
      coresecret: github.com/kitsunium/sdk/internal/core/security/secret
    path: github.com/kitsunium/sdk/internal/service/security/secret
    types:
      - doc: EnvConfig parameterises [NewEnv].
        name: EnvConfig
        struct:
          fields:
            - doc: |-
                Prefix namespaces every variable: with "APP", the secret "smtp-url" is
                read from APP_SMTP_URL, or from the file APP_SMTP_URL_FILE names. The
                separating underscore belongs to the store, and a trailing one on Prefix
                is absorbed, so "APP" and "APP_" name the same namespace.

                Empty is allowed and means no namespace: "smtp-url" reads SMTP_URL. It
                is a legitimate choice — DATABASE_URL is a convention of its own — and
                Names then lists the whole environment, mapped to names, which is noise
                but never a value.

                A non-empty prefix must be uppercase ASCII letters, digits and '_', and
                must not start with a digit or consist of underscores alone: anything
                else is not a variable name a shell can export.
              name: Prefix
              type: string
      - doc: |-
          FileConfig parameterises [NewFile].

          Its zero value is deliberately NOT a working store: Dir must be stated,
          because the directory IS the store, and a default one — the working
          directory, the temporary directory — would put secrets wherever the process
          happened to start, readable by whoever else uses that place.
        name: FileConfig
        struct:
          fields:
            - doc: |-
                Dir is the directory the store owns: one record per secret, published
                atomically, 0600, plus the lock files that serialise writers. It is
                created 0700 if absent, and REFUSED if it exists with any group or world
                permission bit — a secret directory another account can read is the
                whole compromise, and the store does not chmod it behind the operator's
                back.
              name: Dir
              type: string
            - doc: |-
                Key, when set, SEALS every record with AES-256-GCM before it touches
                the disk, bound to the secret's name so a record copied under another
                name does not open. Nothing readable is written then — not the values,
                not the version numbers, not the timestamps; only the file names, which
                are the secret names.

                The zero Key means no encryption at rest, which is a legitimate choice
                on a volume that is already encrypted, and it is the choice a caller
                makes by leaving the field empty. A store opened with a Key refuses a
                record written without one, and the other way round, with
                RecordUnreadable — never by guessing which it was.
              name: Key
              type: corecrypto.Key
            - doc: |-
                Clock stamps each version's Created and paces the wait for another
                process's lock. nil means clock.System.
              name: Clock
              type: clock.Timed
      - doc: |-
          Keyring sees the versions of ONE secret as keys, so a rotation never breaks
          what was sealed or signed before it:

            - the NEWEST version seals and signs;
            - EVERY kept version still opens and verifies, because each box and each
              signature carries the number of the version that made it;
            - a version stops opening only when it is pruned — the only way to retire
              a key, and the one a rotation's Keep decides.

          A version is key material and must be exactly one crypto.Key long (derived
          from corecrypto.KeyLen). Generate the versions with Random(corecrypto.KeyLen);
          a password stored under a keyring's
          name is refused with [coresecret.KeyMaterialInvalid] rather than stretched, because
          stretching would hide that it was never random. Each version is split by
          HKDF-SHA256 into an AES-256-GCM key and an HMAC-SHA256 key, so sealing and
          signing never share a key — and, for the subject keys a keyring is the root
          of (ADR 0142), into a third key that wraps them, which Seal never uses.

          A box is [0x01][version, 4 bytes big-endian][crypto box]; a signature is
          [0x01][version][32-byte tag]. The version is not secret — it names a key,
          and anyone holding a box can read it.

          It holds no state but the store and the name, reads the store on every
          call, and is safe for concurrent use.
        methods:
          - doc: |-
              Seal encrypts plaintext under the NEWEST version, binding aad (which may be
              nil), and returns a box carrying that version's number. It returns
              core/security/secret.NotFound while the secret has no version, and
              [coresecret.KeyMaterialInvalid] when the newest version is not a 32-byte key.
            in:
              - name: ctx
                type: context.Context
              - name: plaintext
              - name: aad
                type: "[]byte"
            name: Seal
            out:
              - name: box
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Open decrypts a box Seal made, under the version its header names, verifying
              aad. Every failure that concerns the box — malformed, a version no longer
              kept, tampered, other associated data — is the one [coresecret.SealInvalid] verdict. A
              store that could not be READ is reported as such, because "retry" and
              "reject the box" are different responses.
            in:
              - name: ctx
                type: context.Context
              - name: box
              - name: aad
                type: "[]byte"
            name: Open
            out:
              - name: plaintext
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Sign returns a signature over message made with the NEWEST version, carrying
              its number. It fails as Seal fails.
            in:
              - name: ctx
                type: context.Context
              - name: message
                type: "[]byte"
            name: Sign
            out:
              - name: signature
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Verify checks a signature Sign made, under the version it names, in constant
              time. Every failure that concerns the signature is the one
              [coresecret.SignatureInvalid] verdict; a store that could not be read is reported as
              such.
            in:
              - name: ctx
                type: context.Context
              - name: message
              - name: signature
                type: "[]byte"
            name: Verify
            out:
              - type: error
            recv: pointer
        name: Keyring
        struct:
          unexported: true
      - doc: MemoryConfig parameterises [NewMemory]. Its zero value is a working store.
        name: MemoryConfig
        struct:
          fields:
            - doc: |-
                Clock stamps each version's Created. nil means clock.System; a test
                driving a Rotator passes the same ManualClock to both, so the store's
                stamps and the rotator's "now" are one timeline.
              name: Clock
              type: clock.Clock
      - doc: |-
          PolicySpec says how often a secret rotates, how many versions survive a
          rotation, and how a new version is made. Every field is required; NewRotator
          refuses the zero value of each, because none of them has a default the SDK
          could choose on a caller's behalf (ADR 0031). pkg/v1/security/secret aliases it as
          Policy.
        name: PolicySpec
        struct:
          fields:
            - doc: |-
                Every is the rotation interval, measured from the current version's
                Created. It must be positive.
              name: Every
              type: time.Duration
            - doc: |-
                Keep is how many versions a rotation leaves, the new one included. It
                must be at least 2, so the version a rotation replaces still opens what
                it sealed; set it to cover the longest-lived box or signature in
                flight, divided by Every, plus one.
              name: Keep
              type: int
            - doc: |-
                Generate makes a new version. [Random] is the generator for keys and
                tokens. An error or an empty value aborts the rotation with
                [coresecret.GenerateFailed]; nothing is stored and nothing is pruned.
              name: Generate
              type: func() (coresecret.Value, error)
      - doc: |-
          RotatorConfig parameterises [NewRotator]: the secret to rotate, where it
          lives, the policy, and the three optional collaborators — a clock, a
          cross-process lock, and a callback told of every rotation.
        name: RotatorConfig
        struct:
          fields:
            - doc: |-
                Store holds the secret. Required. A read-only store is accepted and
                every write it refuses surfaces as core/security/secret.ReadOnly.
              name: Store
              type: coresecret.Store
            - doc: Name is the secret to rotate. Required.
              name: Name
              type: string
            - doc: Policy is the schedule, the retention and the generator. Required.
              name: Policy
              type: PolicySpec
            - doc: |-
                Clock decides when a rotation is due and paces Run. nil means
                clock.System. A test drives the rotator with a clock.ManualClock — the
                same one its store stamps Created with, so both read one timeline.
              name: Clock
              type: clock.Timed
            - doc: |-
                Locker, when set, serialises rotations of this secret ACROSS PROCESSES:
                Ensure, Rotate and RotateIfDue take its lock, re-read the current
                version, and only then decide. Without it, two replicas sharing a file
                store can both find a rotation due and both perform it — nothing breaks,
                since both versions are kept keys, but a rotation is wasted and Keep
                counts it. One process needs no Locker: the rotator serialises its own
                calls.
              name: Locker
              type: corelock.Locker
            - doc: |-
                OnRotate, when set, is told of every rotation this rotator performs,
                with the version it created. It runs on the rotating goroutine after
                the version is stored, the old ones pruned and every lock released, so
                it may call back into the rotator. Ensure creating the first version is
                not a rotation and does not call it.
              name: OnRotate
              type: func(rotated coresecret.VersionValue)
            - doc: |-
                InUse, when set, reports the OLDEST version something still needs — for
                the root of a SubjectKeys, the oldest version a data key is still
                wrapped under: [SubjectKeys.OldestRoot] — or 0 when nothing does. A
                rotation then prunes no version at or above it, whatever Policy.Keep
                says: Keep becomes a floor, and the store holds more versions until the
                dependants move on (SubjectKeys.Rewrap). It is asked after the new
                version is stored and before the prune. Its error is returned as it is
                and nothing is pruned — the rotation happened, and the next one prunes
                again — because a version pruned while still needed destroys whatever
                depends on it, and no later call can bring it back.
              name: InUse
              type: func(ctx context.Context) (oldest int, err error)
      - doc: |-
          Rotator mints new versions of one secret according to a [PolicySpec].

          It starts no goroutine. [Rotator.RotateIfDue] is one decision a caller can
          drive from anything — a scheduler, a request, a start-up hook — and
          [Rotator.Run] is the loop for a caller that wants one: it blocks on the
          caller's goroutine, sleeps on the injected clock until the next rotation is
          due, and returns when its context ends, so the caller that started it is the
          one that joins it.
        methods:
          - doc: |-
              Ensure returns the current version, creating version 1 with the policy's
              generator when the secret has none. It is the call to make at start-up,
              before a Keyring over the same name is asked to seal. Creating the first
              version is not a rotation, so OnRotate is not told.
            in:
              - name: ctx
                type: context.Context
            name: Ensure
            out:
              - name: current
                type: coresecret.VersionValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Due reports when the current version becomes due for rotation: its Created
              plus the policy's interval. It returns core/security/secret.NotFound when the secret
              has no version yet — Ensure creates it.
            in:
              - name: ctx
                type: context.Context
            name: Due
            out:
              - name: due
                type: time.Time
              - name: err
                type: error
            recv: pointer
          - doc: |-
              RotateIfDue rotates when the current version is due and reports whether it
              did. A secret with no version is created instead — the same as Ensure — and
              reported as not rotated. The decision and the rotation are one step under
              the rotator's lock, and under the Locker's when one was configured.
            in:
              - name: ctx
                type: context.Context
            name: RotateIfDue
            out:
              - name: current
                type: coresecret.VersionValue
              - name: rotated
                type: bool
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Rotate rotates now, whether or not a rotation is due, and returns the new
              version. When the version was stored but the prune after it failed, it
              returns BOTH the new version and the prune's error: the rotation happened —
              OnRotate is told — and only the retirement of old versions did not, which
              the next rotation retries.
            in:
              - name: ctx
                type: context.Context
            name: Rotate
            out:
              - name: created
                type: coresecret.VersionValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Run rotates the secret for as long as ctx lives: it ensures the secret
              exists, sleeps on the rotator's clock until the current version is due,
              rotates, and repeats. It blocks on the caller's goroutine and starts none,
              so the caller that runs it joins it by waiting for it to return.

              It returns nil when ctx ends — a stop is not a failure — and the first error
              otherwise, without retrying: a store that went away is the supervisor's to
              retry with a backoff, not a loop's to spin on.
            in:
              - name: ctx
                type: context.Context
            name: Run
            out:
              - type: error
            recv: pointer
        name: Rotator
        struct:
          unexported: true
      - doc: |-
          SubjectKeysConfig parameterises [NewSubjectKeys]: the root that wraps every
          data key, the store that keeps them, and how many opened keys this process
          may keep, for how long.
        name: SubjectKeysConfig
        struct:
          fields:
            - doc: |-
                Root wraps every data key: a Keyring over the root secret. Its newest
                version wraps each new key and every kept version unwraps, so a
                rotation breaks nothing; [SubjectKeys.Rewrap] moves every key to the
                newest version, and RotatorConfig.InUse keeps a version from being
                pruned while a key is still wrapped under it. Required.
              name: Root
              type: "*Keyring"
            - doc: Store keeps the wrapped keys, one per subject. Required.
              name: Store
              type: coresecret.SubjectKeyStore
            - doc: |-
                CacheSize is how many opened keys this process keeps, the least
                recently used evicted first. Zero keeps none: every Seal and Open
                reads the store and unwraps. Negative is refused.
              name: CacheSize
              type: int
            - doc: |-
                CacheTTL is how long an opened key stays cached. It is required with a
                cache and refused without one, because it is a promise about erasure: a
                key another PROCESS destroyed keeps opening — and sealing — here for up
                to CacheTTL. A key destroyed through this value leaves its cache at once.
              name: CacheTTL
              type: time.Duration
            - doc: Clock times the cache. nil means clock.System.
              name: Clock
              type: clock.Clock
      - doc: |-
          SubjectKeys keeps one data key per subject — a person, a tenant, a record,
          whatever the caller files keys under — and seals and opens under it:

            - a data key is 32 bytes from crypto/rand, made by the first Seal for its
              subject, wrapped under the root keyring's newest version, bound to its
              subject, and filed in the store;
            - a box names its subject and the identifier of the key that sealed it,
              and is bound to whatever the caller passes as binding — where the value
              lies — so a box moved elsewhere does not open;
            - [SubjectKeys.Destroy] deletes a subject's key: every box sealed under
              it, wherever it was copied, stops opening. NIST SP 800-88r2 calls this a
              cryptographic erase;
            - a rotation of the root re-wraps one small key per subject
              ([SubjectKeys.Rewrap]) and never touches a box.

          It is safe for concurrent use.
        methods:
          - doc: |-
              Seal encrypts plaintext under subject's data key — made, wrapped and filed
              by this call when subject has none — and returns a box naming subject and
              that key. The box is bound to bind, part by part and in order: Open must be
              given the same parts, so a caller binds the box to where the value lies (a
              store, a record's key, a field's pointer) and a box moved elsewhere does not
              open. Each part is length-prefixed, so ("ab", "c") and ("a", "bc") differ.

              It refuses a malformed subject with core/security/secret.InvalidSubject, returns
              core/security/secret.NotFound while the root has no version, and
              [coresecret.SubjectKeyUnreadable] when subject's key is held and does not unwrap — it
              never replaces such a key.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
              - name: plaintext
                type: "[]byte"
              - name: bind
                type: string
            name: Seal
            out:
              - name: box
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
            variadic: true
          - doc: |-
              Open decrypts a box [SubjectKeys.Seal] made, under the key of the subject it
              names, verifying bind. It answers:

                - [coresecret.KeyDestroyed] when that key is not held — destroyed by an erasure, or
                  replaced by a newer key of the same subject after one: the value is
                  erased, and a caller reading records reads it as such;
                - [coresecret.SealInvalid] when the box is malformed, altered, or bound to other
                  parts;
                - [coresecret.SubjectKeyUnreadable] when the key is held and does not unwrap, which
                  is a fault and never an erasure;
                - core/security/secret.StoreUnavailable when the store failed.
            in:
              - name: ctx
                type: context.Context
              - name: box
                type: "[]byte"
              - name: bind
                type: string
            name: Open
            out:
              - name: plaintext
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
            variadic: true
          - doc: |-
              Destroy deletes subject's data key, and reports whether one was held. Every
              box sealed under it stops opening — the copies in other records, in former
              versions, in a dead letter or a backup included — because nothing holds the
              key that would open them: the cryptographic erase of NIST SP 800-88r2.

              This process's cache drops and wipes the key at once. Another process that
              cached it keeps it for up to its CacheTTL. A wrapped copy of the key that
              the store's backend kept elsewhere — a write-ahead log, a backup — opens only
              while the root version that wrapped it is kept: the erasure is complete
              everywhere once that version is pruned.

              Destroying a subject that holds no key is not an error. A later Seal for the
              same subject makes a NEW key, which opens nothing the destroyed one sealed.
            in:
              - name: ctx
                type: context.Context
              - name: subject
                type: string
            name: Destroy
            out:
              - name: destroyed
                type: bool
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Rewrap moves every data key to the root's newest version: each key wrapped
              under an older one is unwrapped, wrapped again, and filed with a
              compare-and-swap, so a key destroyed or re-wrapped meanwhile is left alone.
              No box is touched — this is why a root rotation costs one small write per
              subject and never a pass over the data.

              Run it after every rotation of the root (the rotator's OnRotate), and at
              start-up to finish a pass that was interrupted: a key already under the
              newest version costs one unwrap, which is also what makes Unreadable exact —
              every key the pass counts has been opened. It reads the root once, so a
              rotation during the pass leaves keys under the version it read, which the
              next pass moves, and a key filed meanwhile under a NEWER version is counted
              current and left for that pass.

              It returns the report with a nil error when every key is under the newest
              version, the report with [coresecret.SubjectKeyUnreadable] when some did not unwrap —
              they are counted, the pass goes on without them — and the report so far with
              the store's or the context's error when the pass could not finish.
            in:
              - name: ctx
                type: context.Context
            name: Rewrap
            out:
              - name: report
                type: RewrapValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              OldestRoot returns the oldest root version a data key is still wrapped
              under, or 0 when the store holds no key. It is the question a rotation of
              the root must ask before it prunes, and its signature is the one
              RotatorConfig.InUse takes:

              	rotator, err := NewRotator(RotatorConfig{..., InUse: keys.OldestRoot})

              It reads the root once and OPENS every key under the version it names —
              about a microsecond each — and counts only the keys that open as one data
              key. A key that does not — its version already pruned, altered, not a
              keyring box — is lost whatever is kept, and counting it would stop every
              later prune for nothing: the root's versions would pile up, and a backed-up
              wrapped key would keep opening under them long after its subject's
              erasure. Such keys are Rewrap's to report. A cancelled scan stops at the
              next key, and any failure is returned: the rotator then prunes nothing.
            in:
              - name: ctx
                type: context.Context
            name: OldestRoot
            out:
              - name: version
                type: int
              - name: err
                type: error
            recv: pointer
        name: SubjectKeys
        struct:
          unexported: true
      - doc: |-
          RewrapValue reports what one [SubjectKeys.Rewrap] pass did, key by key.

          pkg/v1/security/secret aliases it as RewrapReport.
        name: RewrapValue
        struct:
          fields:
            - doc: "Root is the root version the pass wrapped under: the newest it read."
              name: Root
              type: int
            - doc: |-
                Current counts the keys already wrapped under Root, each opened to
                prove it, and the keys a later rotation already wrapped under a newer
                version, which the next pass checks.
              name: Current
              type: int
            - doc: Rewrapped counts the keys the pass moved to Root.
              name: Rewrapped
              type: int
            - doc: |-
                Skipped counts the keys destroyed, or re-wrapped by another writer,
                while the pass ran. They are left as they are: a re-wrap never brings
                back a destroyed key.
              name: Skipped
              type: int
            - doc: |-
                Unreadable counts the keys that did not unwrap as one data key —
                wrapped under a version no longer kept, under another root secret or
                for another purpose, altered, or not one key long — and the entries
                whose subject is outside the grammar. They are left as they are, and
                the pass returns [coresecret.SubjectKeyUnreadable].
              name: Unreadable
              type: int
  - doc: |-
      Package secret is the public facade for the SDK's secret domain (ADR 0096):
      a [Value] that no rendering writes down, a [Store] that keeps named secrets
      as numbered versions, a [Keyring] that turns those versions into keys, and a
      [Rotator] that mints new ones on a schedule.

      	type Config struct {
      	    Port     int          `json:"port"`
      	    Database secret.Value `json:"database_url"` // decodes like a string
      	}
      	fmt.Printf("%+v\n", cfg)              // {Port:8080 Database:<redacted>}
      	db, err := sql.Open("pgx", cfg.Database.RevealString())

      # A Value renders as a placeholder, everywhere

      fmt with every verb (String, GoString and Format are all implemented, so
      %v, %+v, %#v, %s and %q agree), encoding/json (MarshalJSON writes the
      placeholder string, so a configuration dumped for a --show-config flag does
      not leak), encoding.TextMarshaler (so TOML, YAML and log/slog's text handler
      agree), and log/slog's JSON handler: every one writes [Redacted]. The bytes
      come out only through [Value].Reveal and [Value].RevealString.

      A Value decodes from a JSON string or from text, so config.Load
      (pkg/v1/app/config) fills a Value field from a file or the environment exactly as it fills a string —
      and it refuses two inputs, with ValueRefused: a JSON token that is not a
      string, because a number has been re-spelled before a decoder sees it (1e3
      arrives as 1000; twenty digits lose their tail to float64), and the
      placeholder itself, because finding it on the way in means a rendered
      configuration was loaded as a real one.

      == does not compile on a Value and neither does using one as a map key; use
      [Value].Equal, which compares in constant time.

      # Stores

      A [Store] holds versions numbered from 1, never reused, newest first:

        - [NewMemory] keeps them in this process — tests, development, a secret
          regenerated at every start;
        - [NewEnv] reads the environment, read-only: the secret "smtp-url" under
          the prefix "APP" is APP_SMTP_URL, or the content of the file
          APP_SMTP_URL_FILE names — the Docker and Kubernetes convention. Setting
          both is refused rather than resolved;
        - [NewFile] keeps them in a directory it owns: 0700, one 0600 record per
          secret published atomically, writers serialised across processes, and,
          given a key, nothing readable written at all.

      A name is 1 to 63 characters of a-z, 0-9 and '-', starting and ending with
      a letter or a digit ([ValidateName]) — one grammar that survives every
      filesystem and maps one-to-one onto an environment variable.

      # A machine-local key for the file store

      [KeyFile] returns the key held in a file, creating it on first use:

      	key, err := secret.KeyFile("/var/lib/app/store.key") // 32 raw bytes, 0600
      	store, err := secret.NewFile(secret.FileConfig{Dir: "/var/lib/app/secrets", Key: key})

      The file holds exactly 32 RAW bytes and nothing else is accepted — not base64,
      not a trailing newline — because a key reshaped to fit is another key. An
      absent file is created from crypto/rand and published with a hard link, so
      processes racing on first use all return the one key that won; a file any
      other account can read is refused, as the store's directory is.

      # Keyring and rotation

      	store, _ := secret.NewFile(secret.FileConfig{Dir: "/var/lib/app/secrets", Key: kek})
      	rotator, _ := secret.NewRotator(secret.RotatorConfig{
      	    Store: store, Name: "session-key",
      	    Policy: secret.Policy{Every: 30 * 24 * time.Hour, Keep: 3, Generate: secret.Random(32)},
      	})
      	_, _ = rotator.Ensure(ctx)          // creates version 1 the first time
      	keyring, _ := secret.NewKeyring(store, "session-key")
      	box, _ := keyring.Seal(ctx, cookie, nil) // sealed under the newest version
      	go func() { _ = rotator.Run(ctx) }()  // rotates every 30 days
      	plain, _ := keyring.Open(ctx, box, nil)  // still opens after a rotation

      The newest version seals and signs; every kept version still opens and
      verifies, because each box and each signature carries the number of the
      version that made it. A version stops opening when it is pruned — and a
      rotation keeps [Policy].Keep versions, at least two, so the one it replaces
      keeps working.

      # One key per subject, and an erasure that reaches every copy

      [SubjectKeys] keeps one data key per SUBJECT — a person, a tenant, a record:
      whoever the caller files keys under — wrapped by a root [Keyring] that
      rotates, and seals and opens under it (ADR 0142):

      	keys, _ := secret.NewSubjectKeys(secret.SubjectKeysConfig{
      	    Root:  root,                    // a Keyring over the root secret, "data-key"
      	    Store: store,                   // your SubjectKeyStore, or NewMemorySubjectKeyStore()
      	    CacheSize: 10_000, CacheTTL: time.Minute,
      	})
      	box, _ := keys.Seal(ctx, ref, []byte(email), "reports", id, "/email")
      	plain, _ := keys.Open(ctx, box, "reports", id, "/email")
      	_, _ = keys.Destroy(ctx, ref)       // every box sealed for ref stops opening
      	_, err := keys.Open(ctx, box, "reports", id, "/email") // KeyDestroyed

      A subject is a REFERENCE, never an identity: it is kept in clear in the store
      and in every box ([ValidateSubject]: lowercase, 1 to [MaxSubjectLen] bytes).
      Derive it — an HMAC of the identity, in hexadecimal. The parts after the
      plaintext bind the box to where it lies, so a box copied into another record
      or field does not open; they are length-prefixed, so ("ab", "c") and ("a",
      "bc") differ.

      Destroying a subject's key is a cryptographic erase (NIST SP 800-88r2): the
      boxes it sealed stop opening wherever they were copied — former versions, a
      dead letter, a backup of the data — because nothing holds the key. Open then
      answers [KeyDestroyed], which a caller reads as "erased", and never
      [SubjectKeyUnreadable], which is a fault: a key held that does not unwrap.
      The erasure reaches this process's cache at once, another process's within
      its CacheTTL, and a copy of the wrapped key a backup of the KEY store kept
      only while the root version that wrapped it is kept.

      A rotation of the root costs one small write per subject and never touches a
      box. Wire the rotator so it re-wraps after each rotation and never prunes a
      version a key still needs:

      	rotator, _ := secret.NewRotator(secret.RotatorConfig{
      	    Store: secrets, Name: "data-key",
      	    Policy:   secret.Policy{Every: 30 * 24 * time.Hour, Keep: 3, Generate: secret.Random(32)},
      	    InUse:    keys.OldestRoot,      // Keep becomes a floor while a key lags
      	    OnRotate: func(secret.Versioned) { _, _ = keys.Rewrap(ctx) },
      	})

      # What this package does not do

      It ships no Vault, KMS or cloud secret-manager client: those are [Store]
      implementations a connector provides, and the port is frozen so one can be
      written today. It does not reload TLS certificates. It does not lock memory
      or promise that a revealed secret is erased: Go's collector moves and copies
      memory, and a string cannot be cleared.

      Package secret — subject keys: one data key per subject under a rotating
      root, and the erasure that destroys it (ADR 0142).
    facade:
      - const:
          - doc: Redacted is the placeholder every rendering of a [Value] writes.
            name: Redacted
            reexport: coresecret.Redacted
            type: string
            typed: true
            value: "\"<redacted>\""
      - const:
          - doc: MaxNameLen is the longest secret name, in bytes.
            name: MaxNameLen
            reexport: coresecret.MaxNameLen
            type: int
            typed: true
            value: "63"
      - alias:
          - doc: |-
              Value is an immutable secret that renders as [Redacted] in every rendering;
              only Reveal and RevealString hand its bytes back.
            name: Value
            target: coresecret.Value
      - alias:
          - doc: |-
              Store keeps named secrets as numbered versions. It is frozen at five
              methods; a new capability arrives as a sibling interface.
            name: Store
            target: coresecret.Store
      - alias:
          - doc: |-
              Versioned is one version of one secret: name, number, value, and when the
              store recorded it.
            name: Versioned
            target: coresecret.VersionValue
      - alias:
          - doc: MemoryConfig parameterises [NewMemory].
            name: MemoryConfig
            target: svcsecret.MemoryConfig
      - alias:
          - doc: EnvConfig parameterises [NewEnv].
            name: EnvConfig
            target: svcsecret.EnvConfig
      - alias:
          - doc: FileConfig parameterises [NewFile].
            name: FileConfig
            target: svcsecret.FileConfig
      - alias:
          - doc: |-
              Keyring sees the versions of one secret as keys: the newest seals and signs,
              every kept version opens and verifies.
            name: Keyring
            target: svcsecret.Keyring
      - alias:
          - doc: |-
              Policy says how often a secret rotates, how many versions a rotation keeps,
              and how a new one is made.
            name: Policy
            target: svcsecret.PolicySpec
      - alias:
          - doc: RotatorConfig parameterises [NewRotator].
            name: RotatorConfig
            target: svcsecret.RotatorConfig
      - alias:
          - doc: Rotator mints new versions of one secret according to a [Policy].
            name: Rotator
            target: svcsecret.Rotator
      - var:
          - doc: NotFound is returned for a name that holds no version.
            name: NotFound
            reexport: coresecret.NotFound
            type: "*errs.Error"
          - doc: InvalidName is returned for a name outside the grammar.
            name: InvalidName
            reexport: coresecret.InvalidName
            type: "*errs.Error"
          - doc: ReadOnly is returned by a write to a store that only reads.
            name: ReadOnly
            reexport: coresecret.ReadOnly
            type: "*errs.Error"
          - doc: |-
              StoreUnavailable is returned when the backend could not be read or
              written; a retry is meaningful.
            name: StoreUnavailable
            reexport: coresecret.StoreUnavailable
            type: "*errs.Error"
          - doc: |-
              ValueRefused is returned by a decode given anything but a string, or
              the placeholder itself.
            name: ValueRefused
            reexport: coresecret.ValueRefused
            type: "*errs.Error"
          - doc: EmptyValue is returned by a Put of an empty secret.
            name: EmptyValue
            reexport: coresecret.EmptyValue
            type: "*errs.Error"
          - doc: InvalidKeep is returned by a Prune asked to keep fewer than one version.
            name: InvalidKeep
            reexport: coresecret.InvalidKeep
            type: "*errs.Error"
          - doc: |-
              InvalidConfig is returned by a constructor given a configuration it
              cannot honour.
            name: InvalidConfig
            reexport: coresecret.InvalidConfig
            type: "*errs.Error"
          - doc: |-
              RecordUnreadable is returned by the file store for a record it found
              and could not read back — most often, one written under another key.
            name: RecordUnreadable
            reexport: coresecret.RecordUnreadable
            type: "*errs.Error"
          - doc: |-
              EnvRefused is returned when the environment names a secret without a
              usable value: both forms set, or an empty or oversized file.
            name: EnvRefused
            reexport: coresecret.EnvRefused
            type: "*errs.Error"
          - doc: SealInvalid is returned by Keyring.Open for every box it cannot open.
            name: SealInvalid
            reexport: coresecret.SealInvalid
            type: "*errs.Error"
          - doc: |-
              SignatureInvalid is returned by Keyring.Verify for every signature it
              cannot verify.
            name: SignatureInvalid
            reexport: coresecret.SignatureInvalid
            type: "*errs.Error"
          - doc: |-
              KeyMaterialInvalid is returned when a keyring version is not exactly 32
              bytes.
            name: KeyMaterialInvalid
            reexport: coresecret.KeyMaterialInvalid
            type: "*errs.Error"
          - doc: GenerateFailed is returned when a rotation's generator failed.
            name: GenerateFailed
            reexport: coresecret.GenerateFailed
            type: "*errs.Error"
          - doc: |-
              KeyFileInvalid is returned by KeyFile for a file that exists and does not
              hold exactly one key of raw bytes.
            name: KeyFileInvalid
            reexport: coresecret.KeyFileInvalid
            type: "*errs.Error"
      - func:
          doc: New returns a Value holding a copy of raw.
          forward: coresecret.NewValue
          in:
            - name: raw
              type: "[]byte"
          name: New
          out:
            - type: Value
      - func:
          doc: FromString returns a Value holding text.
          forward: coresecret.FromString
          in:
            - name: text
              type: string
          name: FromString
          out:
            - type: Value
      - func:
          doc: |-
            ValidateName reports whether name is a secret name, returning [InvalidName]
            when it is not. Every store calls it; a caller may too, to refuse a name at
            the edge of its own input.
          forward: coresecret.ValidateName
          in:
            - name: name
              type: string
          name: ValidateName
          out:
            - type: error
      - func:
          doc: NewMemory returns a Store that keeps its versions in this process's memory.
          forward: svcsecret.NewMemory
          in:
            - name: cfg
              type: MemoryConfig
          name: NewMemory
          out:
            - type: Store
      - func:
          doc: |-
            NewEnv returns a read-only Store over the process environment, honouring the
            NAME_FILE convention. It refuses a prefix no shell could export.
          forward: svcsecret.NewEnv
          in:
            - name: cfg
              type: EnvConfig
          name: NewEnv
          out:
            - name: store
              type: Store
            - name: err
              type: error
      - func:
          doc: |-
            NewFile returns a Store that keeps its versions in a directory it owns,
            sealed at rest when cfg.Key is set. It refuses a directory other accounts
            can read, and returns proc.UnsupportedPlatform where atomic publication or
            the file lock is unavailable. The store also implements io.Closer.
          forward: svcsecret.NewFile
          in:
            - name: cfg
              type: FileConfig
          name: NewFile
          out:
            - name: store
              type: Store
            - name: err
              type: error
      - func:
          doc: NewKeyring returns the keyring over the versions of name in store.
          forward: svcsecret.NewKeyring
          in:
            - name: store
              type: Store
            - name: name
              type: string
          name: NewKeyring
          out:
            - name: keyring
              type: "*Keyring"
            - name: err
              type: error
      - func:
          doc: NewRotator returns a rotator for cfg.Name in cfg.Store. It starts nothing.
          forward: svcsecret.NewRotator
          in:
            - name: cfg
              type: RotatorConfig
          name: NewRotator
          out:
            - name: rotator
              type: "*Rotator"
            - name: err
              type: error
      - func:
          doc: |-
            KeyFile returns the crypto.Key held in the file at path — exactly
            crypto.KeyLen raw bytes — creating the file with a fresh random key on first
            use: 0600, its directory 0700 when it has to be made, published atomically so
            that concurrent first uses all return the same key.

            It refuses content that is not exactly one key with [KeyFileInvalid], an
            existing file other accounts can read with [InvalidConfig], and — where the
            file store refuses, every platform outside the Unix family, because a mode
            is not an access list there — proc.UnsupportedPlatform. No error carries the
            key or a refused file's content.
          forward: svcsecret.KeyFile
          in:
            - name: path
              type: string
          name: KeyFile
          out:
            - name: key
              type: crypto.Key
            - name: err
              type: error
      - func:
          doc: |-
            Random returns a generator of n bytes from crypto/rand; a keyring's versions
            need n = 32. Below 16 bytes the generator refuses every call.
          forward: svcsecret.Random
          in:
            - name: "n"
              type: int
          name: Random
          out:
            - type: func() (Value, error)
      - const:
          - doc: MaxSubjectLen is the longest subject reference, in bytes.
            name: MaxSubjectLen
            reexport: coresecret.MaxSubjectLen
            type: int
            typed: true
            value: "128"
      - alias:
          - doc: |-
              SubjectKeys keeps one data key per subject, wrapped by a root [Keyring]:
              Seal and Open under a subject's key, Destroy to erase everything it sealed,
              Rewrap after the root rotates.
            name: SubjectKeys
            target: svcsecret.SubjectKeys
      - alias:
          - doc: SubjectKeysConfig parameterises [NewSubjectKeys].
            name: SubjectKeysConfig
            target: svcsecret.SubjectKeysConfig
      - alias:
          - doc: |-
              SubjectKeyStore keeps one wrapped data key per subject. The caller
              implements it over its own storage — Insert and Replace atomic across every
              process — or uses [NewMemorySubjectKeyStore]. It is frozen at five methods;
              a new capability arrives as a sibling interface.
            name: SubjectKeyStore
            target: coresecret.SubjectKeyStore
      - alias:
          - doc: |-
              WrappedKey is one subject's wrapped data key, as a [SubjectKeyStore] keeps
              it.
            name: WrappedKey
            target: coresecret.SubjectKeyValue
      - alias:
          - doc: RewrapReport says what one [SubjectKeys].Rewrap pass did, key by key.
            name: RewrapReport
            target: svcsecret.RewrapValue
      - var:
          - doc: |-
              InvalidSubject is returned for a subject outside the grammar; the
              rejected string is never repeated.
            name: InvalidSubject
            reexport: coresecret.InvalidSubject
            type: "*errs.Error"
          - doc: |-
              KeyDestroyed is returned by SubjectKeys.Open for a box whose data key is
              not held: the value was erased.
            name: KeyDestroyed
            reexport: coresecret.KeyDestroyed
            type: "*errs.Error"
          - doc: |-
              SubjectKeyUnreadable is returned when a subject's data key is held and
              does not unwrap under the root: a fault, never an erasure.
            name: SubjectKeyUnreadable
            reexport: coresecret.SubjectKeyUnreadable
            type: "*errs.Error"
      - func:
          doc: |-
            ValidateSubject reports whether subject is a subject reference, returning
            [InvalidSubject] when it is not: 1 to [MaxSubjectLen] bytes of a-z, 0-9,
            '-', '_', '.' and ':', starting with a letter or a digit. A subject is kept
            in clear, so it is a reference derived from an identity, never the identity.
          forward: coresecret.ValidateSubject
          in:
            - name: subject
              type: string
          name: ValidateSubject
          out:
            - type: error
      - func:
          doc: |-
            NewSubjectKeys returns the engine that keeps one data key per subject under
            cfg.Root, filed in cfg.Store. It refuses a nil root or store, a negative
            cache, and a cache without a TTL — the TTL bounds how long a key another
            process destroyed keeps opening here — with [InvalidConfig].
          forward: svcsecret.NewSubjectKeys
          in:
            - name: cfg
              type: SubjectKeysConfig
          name: NewSubjectKeys
          out:
            - name: keys
              type: "*SubjectKeys"
            - name: err
              type: error
      - func:
          doc: |-
            NewMemorySubjectKeyStore returns a [SubjectKeyStore] that keeps the wrapped
            keys in this process's memory — for tests and development, where the data
            they protect dies with the process too.
          forward: svcsecret.NewMemorySubjectKeyStore
          name: NewMemorySubjectKeyStore
          out:
            - type: SubjectKeyStore
      - func:
          doc: |-
            SubjectOf returns the subject a box sealed by [SubjectKeys].Seal names,
            without opening it, or [SealInvalid] for anything that is not such a box.
          forward: svcsecret.SubjectOf
          in:
            - name: box
              type: "[]byte"
          name: SubjectOf
          out:
            - name: subject
              type: string
            - name: err
              type: error
    imports:
      coresecret: github.com/kitsunium/sdk/internal/core/security/secret
      crypto: github.com/kitsunium/sdk/pkg/v1/crypto
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcsecret: github.com/kitsunium/sdk/internal/service/security/secret
    path: github.com/kitsunium/sdk/pkg/v1/security/secret
