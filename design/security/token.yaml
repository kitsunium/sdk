apiVersion: kit.kitsunium/design/v2
domain: security/token
packages:
  - codes:
      - const:
          - doc: |-
              CodeMalformed identifies a token whose structure could not be read at all:
              the wrong number of segments, a segment that is not unpadded base64url, a
              header or payload that is not a JSON object.
            name: CodeMalformed
            note: "range: 0.2.13.0 - 0.2.13.255"
            value: "0x00_02_0D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeAlgorithmNone identifies a token presenting the unsecured "none"
              algorithm of RFC 7519 §6 (in any capitalisation). It is always refused and
              there is no configuration that enables it.
            name: CodeAlgorithmNone
            value: "0x00_02_0D_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeAlgorithmMismatch identifies a token whose algorithm header names an
              algorithm other than the one the verifier is bound to. This is the code an
              algorithm-confusion attempt produces.
            name: CodeAlgorithmMismatch
            value: "0x00_02_0D_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignatureInvalid identifies a token whose signature or MAC tag did not
              authenticate under the bound key.
            name: CodeSignatureInvalid
            value: "0x00_02_0D_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeExpired identifies an authenticated token whose "exp" claim is in the
              past, after the configured leeway.
            name: CodeExpired
            value: "0x00_02_0D_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotYetValid identifies an authenticated token whose "nbf" claim is in
              the future, after the configured leeway.
            name: CodeNotYetValid
            value: "0x00_02_0D_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeExpiryRequired identifies a token carrying no "exp" claim where the
              profile requires one — the default. It is also raised by an issuer asked to
              mint a token with neither an explicit expiry nor a configured lifetime.
            name: CodeExpiryRequired
            value: "0x00_02_0D_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeAudienceMismatch identifies an authenticated token whose "aud" claim
              does not contain the audience the verifier was configured with.
            name: CodeAudienceMismatch
            value: "0x00_02_0D_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeIssuerMismatch identifies an authenticated token whose "iss" claim is
              not the issuer the verifier was configured with.
            name: CodeIssuerMismatch
            value: "0x00_02_0D_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeTooLarge identifies an input past a declared size bound: the token
              string, the decoded header, or the number of claims.
            name: CodeTooLarge
            value: "0x00_02_0D_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeTooDeep identifies a claims payload whose JSON nesting exceeds the
              configured depth bound.
            name: CodeTooDeep
            value: "0x00_02_0D_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyUnsuitable identifies a key that cannot be used for the algorithm it
              was handed to: the wrong length, the wrong curve, or a key type for which
              this domain implements no algorithm.
            name: CodeKeyUnsuitable
            value: "0x00_02_0D_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodePolicyMisconfigured identifies an issuer or verifier built with a
              configuration it cannot honour — a negative or absurd leeway, a negative
              lifetime, a bound below the floor. Every call is refused without touching
              the token (ADR 0031).
            name: CodePolicyMisconfigured
            value: "0x00_02_0D_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeIssueFailed identifies an issuer that could not render the claims it was
              given — a claim the target format cannot express, or a signing fault.
            name: CodeIssueFailed
            value: "0x00_02_0D_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeClaimNameInvalid identifies a private claim whose name is empty or
              shadows one of the seven registered claim names.
            name: CodeClaimNameInvalid
            value: "0x00_02_0D_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeLifetimeTooLong identifies an authenticated token whose exp-iat span
              exceeds the maximum lifetime the verifier accepts.
            name: CodeLifetimeTooLong
            value: "0x00_02_0D_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeHeaderUnsupported identifies a JOSE header the engine will not act on:
              a non-empty "crit" (RFC 7515 §4.1.11 makes an unrecognised critical
              parameter a mandatory rejection), or a "typ" that does not match the one the
              verifier requires.
            name: CodeHeaderUnsupported
            note: |-
              range: 0.3.44.0 - 0.3.44.255

              What is specific to the two concrete formats the engine in
              internal/service/security/token implements — header parameters, key-set
              selection, PASETO framing. The verdicts a caller matches on are the 0.2.13.*
              block above. The range was allocated in the service layer (LL = 3) and is
              declared here since ADR 0160: LL records the layer that allocated a range,
              not the directory its declaration lives in, so the values never change.
            value: "0x00_03_2C_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyNotFound identifies a token whose "kid" names no key in the JWK Set
              the verifier was built from.
            name: CodeKeyNotFound
            value: "0x00_03_2C_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyIDMissing identifies a token presented to a key-set verifier with no
              "kid" header. A set verifier selects by id; it does not try every key it
              holds.
            name: CodeKeyIDMissing
            value: "0x00_03_2C_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyIDAmbiguous identifies a "kid" carried by more candidates than the
              verifier will try. Trying a bounded number of candidates is the rotation
              path; trying an unbounded number is a CPU amplifier a publisher controls.
            name: CodeKeyIDAmbiguous
            value: "0x00_03_2C_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeFooterMismatch identifies a PASETO token whose footer is not the one the
              verifier expects — including a footer present where none was configured.
            name: CodeFooterMismatch
            value: "0x00_03_2C_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeSchemeUnsupported identifies a PASETO version+purpose the engine does
              not implement: any local (encrypted) purpose, and every version other than
              v4. See internal/service/security/token/CLAUDE.md for why v4.local is
              absent.
            name: CodeSchemeUnsupported
            value: "0x00_03_2C_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateMember identifies a JOSE header or claims object carrying the
              same member name twice. Go's encoding/json silently keeps the last one, so
              two readers of the same bytes could disagree about what the token says
              (RFC 8725 §2.6).
            name: CodeDuplicateMember
            value: "0x00_03_2C_07"
        type: errs.Code
    constants:
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimIssuer is "iss" — who minted the token.
        name: ClaimIssuer
        type: string
        value: "\"iss\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimSubject is "sub" — who the token is about.
        name: ClaimSubject
        type: string
        value: "\"sub\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimAudience is "aud" — who the token is FOR. Checked, never assumed.
        name: ClaimAudience
        type: string
        value: "\"aud\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimExpiry is "exp" — the instant after which the token is dead.
        name: ClaimExpiry
        type: string
        value: "\"exp\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimNotBefore is "nbf" — the instant before which it is not yet alive.
        name: ClaimNotBefore
        type: string
        value: "\"nbf\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimIssuedAt is "iat" — when it was minted.
        name: ClaimIssuedAt
        type: string
        value: "\"iat\""
      - blockDoc: |-
          Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
          names, with a different value encoding — see internal/service/security/token.
        doc: ClaimID is "jti" — a unique id for the token.
        name: ClaimID
        type: string
        value: "\"jti\""
      - doc: |-
          MaxPrivateClaims caps how many application claims one token may carry. The
          number is a bound, not a budget: a claim set is an authorisation statement,
          and a token that needs more than this many members is describing a database
          row rather than a subject. The cap keeps a hostile payload's decode cost
          linear and bounded, which is the same reason the wire size is capped.
        name: MaxPrivateClaims
        type: int
        value: "64"
      - doc: |-
          AlgorithmUnknown is the zero value — the algorithm nobody chose. Every
          constructor refuses it rather than defaulting to one.
        name: AlgorithmUnknown
        type: Algorithm
        value: "0"
      - doc: |-
          AlgorithmHS256 is JOSE "HS256": HMAC-SHA-256 over a 256-bit shared
          secret (RFC 7518 §3.2). Symmetric — a verifier can also mint tokens.
        name: AlgorithmHS256
        type: Algorithm
        value: "1"
      - doc: |-
          AlgorithmES256 is JOSE "ES256": ECDSA on NIST P-256 with SHA-256 and the
          fixed-width R||S signature encoding of RFC 7518 §3.4.
        name: AlgorithmES256
        type: Algorithm
        value: "2"
      - doc: |-
          AlgorithmEdDSA is JOSE "EdDSA": Ed25519 over the JWS signing input
          (RFC 8037 §3.1).
        name: AlgorithmEdDSA
        type: Algorithm
        value: "3"
      - doc: |-
          AlgorithmPasetoV4Public is PASETO v4.public: Ed25519 over the
          pre-authentication encoding of the version header, payload and footer.
          It is a distinct Algorithm from AlgorithmEdDSA even though both use
          Ed25519, because the bytes that get signed are not the same bytes.
        name: AlgorithmPasetoV4Public
        type: Algorithm
        value: "4"
    doc: |-
      Package token — the immutable claim set every concrete token format decodes
      into and every issuer renders from.

      Package token — the copy-on-write setters that build a [ClaimsValue].

      Package token — ranges 0.2.13.* (the domain's verdicts) and 0.3.44.* (what
      is specific to the two concrete formats) — ADR 0042, declared here since
      ADR 0160.

      Package token — declares the sentinel *errs.Error verdicts an issuer or a
      verifier returns, and the refusals specific to the two concrete formats the
      engine in internal/service/security/token implements (ADR 0160). Each var's
      name equals its errs.Define Reason in SCREAMING_SNAKE form.

      The Public strings are the half a third party reads (ADR 0005 §4). They name
      WHICH check refused the token and never echo a value from it: not the
      audience, not the issuer, not the key id, not a claim. A rejection message
      that quotes the token's own contents back is a mirror an attacker can query.

      Package token declares the security-token domain: the [Issuer] and
      [Verifier] ports, the immutable [ClaimsValue] every concrete format decodes
      into, and the typed verdicts a caller matches on. Concrete formats — JWT/JWS
      compact (RFC 7519) and PASETO v4 — live in internal/service/security/token; this
      package owns only the contract, so a caller can hold a Verifier without
      knowing which wire format produced it.

      # There is no registry, and that is the security decision

      Every other pluggable SDK domain resolves an implementation through a
      process-wide registry keyed on a name. A token registry would be keyed on
      the "alg" header — a field the ATTACKER writes. Resolving the verifying
      algorithm from that field is algorithm confusion, the class of bug where an
      RSA/EC public key (public by definition) is fed to HMAC-SHA-256 as a shared
      secret and the forgery verifies. So the algorithm is bound at construction,
      by a constructor that only accepts the ONE key type that algorithm can use,
      and the header is only ever compared against that binding — never consulted
      to choose it. See ADR 0042.

      [Algorithm] is a uint8 enum rather than a string for the same reason: the
      unsecured "none" algorithm of RFC 7519 §6 has no representation in this
      type, so no call site can request it and no configuration can enable it. A
      token whose header says "none" is refused with [AlgorithmNone].
    functions:
      - doc: |-
          IsRegisteredClaim reports whether name is one of the seven registered claim
          names this domain models itself.
        impl: isRegisteredClaim
        in:
          - name: name
            type: string
        name: IsRegisteredClaim
        out:
          - type: bool
      - doc: |-
          NewClaimsValue returns an empty claim set to build on. The zero ClaimsValue
          is equally valid and equally empty; this constructor exists so a call site
          reads as a statement of intent rather than a struct literal.

          pkg/v1/security/token re-exports it as the shorter NewClaims, since the Value suffix
          is a core-layer naming rule (KTN-STRUCT-ROLE) and not a consumer's concern.
        impl: newClaimsValue
        name: NewClaimsValue
        out:
          - type: ClaimsValue
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/security/token
    ports:
      - doc: |-
          Issuer mints a signed token carrying claims. Implementations are bound to
          exactly one [Algorithm] and one signing key at construction, MUST be safe for
          concurrent use, and MUST NOT take an algorithm or a key from the claims.

          IFACE-PLUGIN: constructors in internal/service/security/token hand instances back
          behind this interface; the concrete types stay unexported.
        methods:
          - doc: |-
              Issue renders claims as a token string, or returns a typed verdict
              (IssueFailed / ExpiryRequired / KeyUnsuitable) when it cannot.
            in:
              - name: claims
                type: ClaimsValue
            name: Issue
            out:
              - type: string
              - type: error
        name: Issuer
      - doc: |-
          Verifier authenticates a token and returns its claims. Implementations are
          bound to exactly one [Algorithm] and one verification key at construction and
          MUST be safe for concurrent use.

          The contract has three parts, and all three are security requirements:

           1. The signature is checked BEFORE any claim is read, so a caller never
              acts on — or logs — the contents of an unauthenticated token.
           2. The token's own algorithm header is compared against the binding and is
              never used to select a key, an algorithm, or a code path.
           3. Failure returns exactly one typed verdict and a zero ClaimsValue. There
              is no "invalid, but here are the claims anyway" path.

          IFACE-PLUGIN: constructors in internal/service/security/token hand instances back
          behind this interface; the concrete types stay unexported.
        methods:
          - doc: |-
              Verify authenticates token and returns its claims, or one of the typed
              verdicts declared in this package.
            in:
              - name: token
                type: string
            name: Verify
            out:
              - type: ClaimsValue
              - type: error
        name: Verifier
    sentinels:
      - var:
          - code: CodeMalformed
            doc: |-
              Malformed is returned when the input cannot be read as a token: the
              wrong segment count, a segment that is not unpadded base64url, a header
              or payload that is not a JSON object.
            name: Malformed
            options:
              - errs.WithExitCode(exitDataErr)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: token structure unreadable — segment count, base64url decode, or JSON shape"
            public: The token is malformed
            reason: MALFORMED
          - code: CodeAlgorithmNone
            doc: |-
              AlgorithmNone is returned for a token presenting the unsecured "none"
              algorithm (RFC 7519 §6), in any capitalisation. It is unconditional:
              this domain has no Algorithm value for "none" and no option enabling it.
            name: AlgorithmNone
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: alg=none refused unconditionally; there is no configuration that accepts it"
            public: The token declares the unsecured none algorithm
            reason: ALGORITHM_NONE
          - code: CodeAlgorithmMismatch
            doc: |-
              AlgorithmMismatch is returned when the token's algorithm header names
              something other than the algorithm the verifier is bound to. It is the
              verdict an algorithm-confusion attempt produces, and it is reached
              BEFORE any key is handed to any primitive.
            name: AlgorithmMismatch
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: header alg differs from the bound algorithm; the header never selects a key"
            public: The token algorithm is not the one this verifier accepts
            reason: ALGORITHM_MISMATCH
          - code: CodeSignatureInvalid
            doc: |-
              SignatureInvalid is returned when the signature or MAC tag did not
              authenticate the token under the bound key. It is deliberately the same
              verdict for "wrong key" and "tampered bytes": the two are the same event.
            name: SignatureInvalid
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: signature or MAC tag did not verify under the bound key"
            public: The token signature is not valid
            reason: SIGNATURE_INVALID
          - code: CodeExpired
            doc: |-
              Expired is returned when an AUTHENTICATED token's exp claim is in the
              past. Reaching it means the signature already verified — claim verdicts
              are never reported for a token that failed authentication.
            name: Expired
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: exp is in the past after leeway; signature had already verified"
            public: The token has expired
            reason: EXPIRED
          - code: CodeNotYetValid
            doc: |-
              NotYetValid is returned when an authenticated token's nbf claim is in
              the future after leeway.
            name: NotYetValid
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: nbf is in the future after leeway"
            public: The token is not valid yet
            reason: NOT_YET_VALID
          - code: CodeExpiryRequired
            doc: |-
              ExpiryRequired is returned when a token carries no exp claim and the
              profile requires one — which is the default, because RFC 7519 §4.1.4
              makes exp OPTIONAL and a token that never expires is a password.
            name: ExpiryRequired
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: exp absent and the profile requires it; set AllowMissingExpiry to opt out"
            public: The token carries no expiry
            reason: EXPIRY_REQUIRED
          - code: CodeAudienceMismatch
            doc: |-
              AudienceMismatch is returned when an authenticated token's aud claim
              does not contain this recipient. A correctly signed token addressed to
              another API is not a valid token here (RFC 8725 §3.9).
            name: AudienceMismatch
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: configured audience absent from the aud claim"
            public: The token is not addressed to this audience
            reason: AUDIENCE_MISMATCH
          - code: CodeIssuerMismatch
            doc: |-
              IssuerMismatch is returned when an authenticated token's iss claim is
              not the configured issuer (RFC 8725 §3.8).
            name: IssuerMismatch
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: iss differs from the configured issuer"
            public: The token issuer is not the expected one
            reason: ISSUER_MISMATCH
          - code: CodeTooLarge
            doc: |-
              TooLarge is returned when an input passes a declared size bound before
              any parsing happens — the token string, the decoded header, the claim
              count. The bound is checked FIRST so a hostile input never funds the
              work of discovering that it is hostile.
            name: TooLarge
            options:
              - errs.WithExitCode(exitDataErr)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: input past a declared bound (token length, header size, or claim count)"
            public: The token exceeds the accepted size
            reason: TOO_LARGE
          - code: CodeTooDeep
            doc: |-
              TooDeep is returned when the claims payload nests deeper than the
              configured bound. The depth is measured by a linear scan of the raw
              bytes, before encoding/json ever sees them.
            name: TooDeep
            options:
              - errs.WithExitCode(exitDataErr)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: claim nesting past MaxClaimDepth, measured before JSON decoding"
            public: The token claims are nested too deeply
            reason: TOO_DEEP
          - code: CodeKeyUnsuitable
            doc: |-
              KeyUnsuitable is returned when a key cannot serve the algorithm it was
              handed to: wrong length, wrong curve, or a key type for which this
              domain implements nothing.
            name: KeyUnsuitable
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/token: key type, curve or length does not match the bound algorithm"
            public: The key cannot be used for this token algorithm
            reason: KEY_UNSUITABLE
          - code: CodePolicyMisconfigured
            doc: |-
              PolicyMisconfigured is returned by every call to an issuer or verifier
              built with a configuration it cannot honour. Like its resilience
              namesake it is permanent, not transient: the fix is at the construction
              site, never a retry (ADR 0031).
            name: PolicyMisconfigured
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/token: issuer or verifier built with a configuration it cannot honour; fields name the knob"
            public: The token policy is misconfigured
            reason: POLICY_MISCONFIGURED
          - code: CodeIssueFailed
            doc: |-
              IssueFailed is returned when an issuer cannot render the claims it was
              given — a claim the target format cannot express, or a signing fault.
            name: IssueFailed
            options:
              - errs.WithExitCode(exitConfig)
            private: "core/security/token: claims unrenderable in the target format, or the signing primitive failed"
            public: The token could not be issued
            reason: ISSUE_FAILED
          - code: CodeClaimNameInvalid
            doc: |-
              ClaimNameInvalid is returned by ClaimsValue.WithPrivateRaw for an empty
              name or one shadowing a registered claim.
            name: ClaimNameInvalid
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/security/token: private claim name empty or colliding with a registered claim name"
            public: The claim name is empty or reserved
            reason: CLAIM_NAME_INVALID
          - code: CodeLifetimeTooLong
            doc: |-
              LifetimeTooLong is returned when an authenticated token's exp-iat span
              exceeds the maximum the verifier accepts. A long-lived bearer token is
              a credential with no revocation story, so a recipient is allowed to say
              no to one even when its issuer said yes.
            name: LifetimeTooLong
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "core/security/token: exp-iat span past MaxLifetime"
            public: The token lifetime exceeds what this recipient accepts
            reason: LIFETIME_TOO_LONG
          - code: CodeHeaderUnsupported
            doc: |-
              HeaderUnsupported is returned for a JOSE header the engine will not act
              on: a non-empty "crit", or a "typ" other than the required one.

              A non-empty "crit" is a rejection and not a warning because RFC 7515
              §4.1.11 says so: the parameters it names MUST be understood, the engine
              understands none of them, and "ignore what you do not understand" is how
              a security-relevant extension gets silently dropped.
            name: HeaderUnsupported
            note: |-
              The refusals specific to the two concrete formats (0.3.44.*). They are
              raised by internal/service/security/token — their Private names that
              package, the one that raises them — and declared here since ADR 0160, so
              every code of the domain is in one place. As above, the Public half names
              the check that refused the token and never echoes a value out of it — not
              a kid, not a footer, not a claim.
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: non-empty crit, or typ differs from the required value"
            public: The token header carries parameters this verifier will not accept
            reason: HEADER_UNSUPPORTED
          - code: CodeKeyNotFound
            doc: KeyNotFound is returned when the token's kid names no key in the set.
            name: KeyNotFound
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: kid absent from the JWK Set"
            public: No key in the key set matches this token
            reason: KEY_NOT_FOUND
          - code: CodeKeyIDMissing
            doc: |-
              KeyIDMissing is returned when a key-set verifier is handed a token with
              no kid header. Selecting by id is the contract; trying every key in the
              set instead would turn a large published JWKS into a work multiplier and
              would quietly accept a token the publisher never routed to that key.
            name: KeyIDMissing
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: set verifier requires a kid header; use a single-key verifier when tokens carry none"
            public: The token carries no key identifier
            reason: KEY_ID_MISSING
          - code: CodeKeyIDAmbiguous
            doc: |-
              KeyIDAmbiguous is returned when more keys carry the kid than the
              verifier will try. jwk.Set refuses to pick between duplicate kids
              because nothing distinguishes them; a signature does distinguish them,
              so the engine tries the candidates — but a bounded number of them.
            name: KeyIDAmbiguous
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: candidate count past MaxKeyCandidates; a bounded rotation window is the supported case"
            public: Too many keys share this token key identifier
            reason: KEY_ID_AMBIGUOUS
          - code: CodeFooterMismatch
            doc: |-
              FooterMismatch is returned for a PASETO footer that is not the expected
              one, including a footer present where the verifier expects none. The
              footer is authenticated but is not returned through the Verifier port,
              so accepting an arbitrary one would authenticate data and then drop it.
            name: FooterMismatch
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: PASETO footer differs from the configured value, or is present with none configured"
            public: The token footer is not the expected one
            reason: FOOTER_MISMATCH
          - code: CodeSchemeUnsupported
            doc: |-
              SchemeUnsupported is returned for a PASETO version+purpose the engine
              does not implement — every local (encrypted) purpose, and every version
              other than v4. It is returned instead of Malformed so an operator can
              tell "this is not a token" from "this is a token I did not build for".
            name: SchemeUnsupported
            options:
              - errs.WithExitCode(exitNoPerm)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: only PASETO v4.public is implemented; v4.local needs primitives the SDK keeps in third-party"
            public: This token version and purpose are not supported
            reason: SCHEME_UNSUPPORTED
          - code: CodeDuplicateMember
            doc: |-
              DuplicateMember is returned when a JOSE header or a claims object
              carries the same member name twice. encoding/json would silently keep
              the last, so a token could say one thing to this reader and another to
              the next (RFC 8725 §2.6).
            name: DuplicateMember
            options:
              - errs.WithExitCode(exitDataErr)
              - errs.WithHTTPStatus(statusUnauthorized)
            private: "service/security/token: duplicate JSON member in the header or the claims object"
            public: The token repeats a member name
            reason: DUPLICATE_MEMBER
    types:
      - decl: true
        doc: |-
          ClaimsValue is one token's claim set: the seven registered claims as typed
          fields plus any number of application ("private") claims held as their raw
          JSON encoding.

          It is an immutable value. Accessors copy every slice and map out, the With*
          methods return a modified copy rather than mutating the receiver, and every
          field is unexported so encoding/json cannot reach the contents by reflection
          — a claim set routinely carries personal data, and the only way it should
          ever be serialised is through a format package that knows what it is doing.

          Private claims are RAW JSON, not decoded values: this is the core layer, and
          "what shape is a scope claim" is the caller's question, not the domain's.
          Decode one with pkg/v1/security/token.PrivateClaim.
        methods:
          - doc: Issuer reports the "iss" claim, empty when the token carried none.
            name: Issuer
            out:
              - type: string
            recv: value
          - doc: Subject reports the "sub" claim, empty when the token carried none.
            name: Subject
            out:
              - type: string
            recv: value
          - doc: ID reports the "jti" claim, empty when the token carried none.
            name: ID
            out:
              - type: string
            recv: value
          - doc: Audience returns a copy of the "aud" claim, nil when the token carried none.
            name: Audience
            out:
              - type: "[]string"
            recv: value
          - doc: |-
              Expiry reports the "exp" claim. The zero Time means the claim was ABSENT,
              never "expired at the epoch" — a verifier decides what to do about absence
              (see VerifierConfig.AllowMissingExpiry in internal/service/security/token).
            name: Expiry
            out:
              - type: time.Time
            recv: value
          - doc: NotBefore reports the "nbf" claim; the zero Time means it was absent.
            name: NotBefore
            out:
              - type: time.Time
            recv: value
          - doc: IssuedAt reports the "iat" claim; the zero Time means it was absent.
            name: IssuedAt
            out:
              - type: time.Time
            recv: value
          - doc: |-
              PrivateNames returns the application claim names, sorted, so a caller
              enumerating them gets a stable order rather than Go's randomised map order.
            name: PrivateNames
            out:
              - type: "[]string"
            recv: value
          - doc: |-
              PrivateRaw returns a copy of the raw JSON encoding of the named application
              claim. The second result reports presence, so a claim explicitly set to JSON
              null is distinguishable from a claim that was never sent.
            in:
              - name: name
                type: string
            name: PrivateRaw
            out:
              - name: raw
                type: "[]byte"
              - name: found
                type: bool
            recv: value
          - doc: IsZero reports whether c carries no claim at all.
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              String implements fmt.Stringer and renders the SHAPE of the claim set, never
              a value: "token.Claims{registered:3 aud:1 private:2}".

              A claim set is the output of an authentication decision and routinely holds a
              subject id, an email, a tenant, a scope list. Rendering any of it would put
              that in whichever log line happened to use %v — which is exactly how claim
              contents end up in a log aggregator that was never scoped to hold them. The
              counts are enough to tell "the token had no audience" from "the audience did
              not match", which is what a %v is usually reaching for.
            name: String
            out:
              - type: string
            recv: value
          - doc: WithIssuer returns a copy of c carrying iss. The empty string clears it.
            in:
              - name: iss
                type: string
            name: WithIssuer
            out:
              - type: ClaimsValue
            recv: value
          - doc: WithSubject returns a copy of c carrying sub. The empty string clears it.
            in:
              - name: sub
                type: string
            name: WithSubject
            out:
              - type: ClaimsValue
            recv: value
          - doc: WithID returns a copy of c carrying jti. The empty string clears it.
            in:
              - name: jti
                type: string
            name: WithID
            out:
              - type: ClaimsValue
            recv: value
          - doc: |-
              WithAudience returns a copy of c whose "aud" claim is exactly aud. Passing no
              argument clears the claim; the slice is copied, so a later mutation of the
              caller's backing array cannot reach the claim set.
            in:
              - name: aud
                type: string
            name: WithAudience
            out:
              - type: ClaimsValue
            recv: value
            variadic: true
          - doc: |-
              WithExpiry returns a copy of c carrying exp. The zero Time clears the claim,
              which a verifier reads as "no expiry was sent" — not as "expired".
            in:
              - name: exp
                type: time.Time
            name: WithExpiry
            out:
              - type: ClaimsValue
            recv: value
          - doc: WithNotBefore returns a copy of c carrying nbf. The zero Time clears it.
            in:
              - name: nbf
                type: time.Time
            name: WithNotBefore
            out:
              - type: ClaimsValue
            recv: value
          - doc: WithIssuedAt returns a copy of c carrying iat. The zero Time clears it.
            in:
              - name: iat
                type: time.Time
            name: WithIssuedAt
            out:
              - type: ClaimsValue
            recv: value
          - doc: |-
              WithPrivateRaw returns a copy of c carrying the application claim name with
              the raw JSON encoding raw.

              It refuses three things rather than accommodating them:

                - an empty name, which no JSON object member can carry meaningfully;
                - one of the seven registered names ([IsRegisteredClaim]) — a second "exp"
                  that the temporal validator never reads is a claim an application would
                  trust and nothing would enforce;
                - more than [MaxPrivateClaims] members, so the decode cost of a hostile
                  payload stays bounded.

              raw is copied and is NOT validated as JSON here: the format package that
              produced it already parsed it, and re-parsing in the value type would put a
              second, differently-strict JSON reader on the trusted path.
            in:
              - name: name
                type: string
              - name: raw
                type: "[]byte"
            name: WithPrivateRaw
            out:
              - name: claims
                type: ClaimsValue
              - name: err
                type: error
            recv: value
          - doc: |-
              GoString implements fmt.GoStringer so %#v stays redacted too — fmt bypasses
              String for Go-syntax formatting and would otherwise dump every field.
            impl: goString
            name: GoString
            out:
              - type: string
            recv: value
        name: ClaimsValue
        struct:
          fields:
            - doc: issuer is the "iss" claim, empty when absent.
              name: issuer
              type: string
            - doc: subject is the "sub" claim, empty when absent.
              name: subject
              type: string
            - doc: id is the "jti" claim, empty when absent.
              name: id
              type: string
            - doc: |-
                audience is the "aud" claim. JWT allows one string or an array of them
                (RFC 7519 §4.1.3), so the general shape is a slice; PASETO allows only
                one, which its encoder enforces.
              name: audience
              type: "[]string"
            - doc: expiry is the "exp" claim; the zero Time means the claim was absent.
              name: expiry
              type: time.Time
            - doc: notBefore is the "nbf" claim; the zero Time means it was absent.
              name: notBefore
              type: time.Time
            - doc: issuedAt is the "iat" claim; the zero Time means it was absent.
              name: issuedAt
              type: time.Time
            - doc: |-
                private maps an application claim name to its raw JSON encoding. Raw,
                because re-encoding a decoded value would change bytes the issuer signed.
              name: private
              type: map[string][]byte
      - decl: true
        doc: |-
          Algorithm is the signature algorithm a token issuer or verifier is bound to.
          The zero value is [AlgorithmUnknown] and is never usable.

          The set is closed and deliberately small: an algorithm reaches this enum only
          when the SDK's crypto domain already ships the primitive behind it. "none"
          is absent by construction.
        methods:
          - doc: |-
              Known reports whether a names an algorithm this domain implements. It is the
              guard every constructor runs before binding a key, so an out-of-range value
              is refused at construction rather than at the first verification.
            impl: known
            name: Known
            out:
              - type: bool
            recv: value
          - doc: |-
              String reports the wire name of a — the JOSE "alg" header value for the JWS
              algorithms, and the version+purpose header for PASETO. An unknown Algorithm
              renders "unknown", which matches no wire name, so a zero value can never be
              mistaken for a real header on either side of a comparison.
            name: String
            out:
              - type: string
            recv: value
        name: Algorithm
        underlying: uint8
  - constants:
      - doc: |-
          DefaultMaxTokenLen is the token-string bound applied when a config
          leaves MaxTokenLen at zero. 8 KiB comfortably holds an OIDC ID token
          with a certificate thumbprint; it does not hold an attack.
        name: DefaultMaxTokenLen
        type: int
        value: 8 << 10
      - doc: |-
          MinTokenLen is the floor a configured MaxTokenLen may not go below. A
          bound smaller than this would reject every real token, which is a
          configuration mistake worth naming rather than a policy.
        name: MinTokenLen
        type: int
        value: "64"
      - doc: |-
          MaxTokenLenCeiling is the ceiling a configured MaxTokenLen may not
          exceed. There is no legitimate multi-megabyte bearer token, and the
          ceiling is what keeps "configurable" from meaning "unbounded".
        name: MaxTokenLenCeiling
        type: int
        value: 1 << 20
      - doc: |-
          DefaultMaxClaimDepth is the JSON nesting bound applied when a config
          leaves MaxClaimDepth at zero.
        name: DefaultMaxClaimDepth
        type: int
        value: "16"
      - doc: |-
          MaxClaimDepthCeiling is the ceiling a configured MaxClaimDepth may not
          exceed.
        name: MaxClaimDepthCeiling
        type: int
        value: "64"
      - doc: |-
          DefaultMaxKeyCandidates is how many keys a set verifier will try for one
          "kid" when the config leaves MaxKeyCandidates at zero. A rotation window
          holds two; four leaves room for a slow rollover without turning a
          published JWK Set into a signature-verification multiplier.
        name: DefaultMaxKeyCandidates
        type: int
        value: "4"
      - doc: |-
          MaxKeyCandidatesCeiling caps MaxKeyCandidates. Trying keys IS signature
          verification, the expensive half of this package; a publisher who can
          name the candidate count can name the cost.
        name: MaxKeyCandidatesCeiling
        type: int
        value: "16"
      - doc: |-
          MaxLeeway is the largest clock-skew allowance a verifier accepts.

          Leeway exists because two hosts disagree about the time by seconds. A leeway
          measured in hours is not skew tolerance, it is an expiry claim that has been
          quietly disabled — so the constructor refuses it rather than honouring a
          value whose effect the caller almost certainly did not intend (ADR 0031).
        name: MaxLeeway
        type: time.Duration
        value: "300000000000"
    doc: |-
      Package token — one JWK Set member, with its binding already derived.

      Package token — the three numeric limits a verification policy resolves.

      Package token — the claims <-> JSON conversion shared by both formats.

      JWT and PASETO agree on the seven registered claim NAMES and disagree on
      their value encodings: JWT writes NumericDate (RFC 7519 §2) and allows "aud"
      to be a string or an array of strings; PASETO writes RFC 3339 timestamps and
      allows exactly one audience. So the traversal is written once and the two
      encodings are a [claimShape] each — rather than two claim decoders that
      would drift apart on everything except the part that actually differs.

      Package token — the one-pass, string-aware JSON nesting counter.

      Package token — the Ed25519 signing binding.

      Package token — the bounded wire primitives every format here goes through:
      segment splitting, strict base64url, JSON depth and duplicate-member checks,
      and PASETO's pre-authentication encoding.

      Every function in this file runs on ATTACKER-CONTROLLED bytes before any key
      is touched, so each one is O(len(input)) with a bound checked first and no
      allocation proportional to a count the attacker chooses.

      Package token — the ECDSA P-256 signing binding.

      Package token — the HMAC-SHA-256 binding.

      Package token — the JWT issuing policy.

      Package token — the JWT/JOSE claim-value encoding.

      Package token — JSON string rendering that cannot fail.

      encoding/json's Marshal returns an error no string or []string can ever
      produce, and discarding it at a dozen call sites is how a real failure
      somewhere else eventually gets discarded too. Rendering the two shapes this
      package actually emits by hand removes the error channel instead of ignoring
      it — and removes a reflective encode from every mint.

      Package token — verification against a JWK or a JWK Set.

      This file holds the ONLY run-time algorithm selection in the package, and the
      selector is the KEY, never the token. A relying party fetched the key set
      from a publisher it trusts; the "kty"/"crv" members are that publisher's
      statement about their own key, and deriving the algorithm from them is
      exactly as trustworthy as the key itself. Deriving it from the token's "alg"
      header would be trusting the attacker's statement about the relying party's
      key — which is algorithm confusion, spelled out.

      Package token — JWS Compact Serialization (RFC 7515): the header, and the
      algorithm gate every verifier runs before a key reaches a primitive.

      Package token — the JWS compact issuer.

      Package token — the parsed, not-yet-authenticated shape of a compact token.

      Package token — the single-key JWS compact verifier.

      Package token — the JWT constructor set: one per algorithm, each accepting
      only the Go key type its algorithm can use.

      That is not documentation. NewHS256Verifier's parameter is a
      core/crypto.Key — a struct with an unexported field — so the classic
      confusion bug, handing it an EC or RSA public key so the attacker can sign
      with the public half, is a call that does not compile.

      Package token — the algorithm-bound key contracts and their constructors.

      This file is where algorithm confusion is made unwritable. Each binding
      holds ONE Go key type and reports ONE algorithm, and the bind* helpers below
      are the only way to build one. There is no `bind(alg, []byte)`, because a
      function that takes an algorithm name and a bag of bytes is a function whose
      caller can be talked into passing a public key where a shared secret goes.

      Package token — PASETO v4.public: the constructors and the scheme gate.

      PASETO is the format that answers the question "what if the algorithm were
      not negotiable". Its header is a version and a purpose — "v4.public." —
      baked into the signed bytes through the pre-authentication encoding, so
      there is no "alg" field to substitute and algorithm confusion has nothing to
      grip. This implementation still binds the key type at construction, because
      the property should hold for the same reason on both formats rather than by
      accident on one of them.

      Only v4.public ships. See the package CLAUDE.md §PASETO for v4.local.

      Package token — the PASETO v4.public issuer.

      Package token — the PASETO v4.public issuing policy.

      Package token — the PASETO claim-value encoding.

      Package token — the PASETO v4.public verifier.

      Package token — the PASETO v4.public verification policy.

      Package token — the validated, defaults-applied form of a verification
      config, so the checks run once at construction rather than once per token.

      Package token implements the two concrete security-token formats behind the
      core/security/token ports: JWT over JWS Compact Serialization (RFC 7519 + RFC 7515)
      and PASETO v4.public. It is stdlib-only and composes the SDK's own crypto
      schemes — HMAC-SHA-256 from service/crypto/mac/hmacsha2, Ed25519 from
      service/crypto/sign/ed25519sig — so it adds no dependency to internal/service.

      # Algorithm confusion is prevented by the constructor set, not by a check

      There is no NewVerifier(alg, key) here, and there is no verifier that reads
      the token's "alg" header to decide what to do. There is one constructor per
      algorithm, each accepting only the ONE Go type that algorithm can use:

      	NewHS256Verifier(secret crypto.Key,     cfg VerifierConfig)
      	NewES256Verifier(pub *ecdsa.PublicKey,  cfg VerifierConfig)
      	NewEdDSAVerifier(pub ed25519.PublicKey, cfg VerifierConfig)

      The textbook algorithm-confusion bug — an RSA/EC public key handed to
      HMAC-SHA-256 as a shared secret, so that anybody holding the public key can
      mint tokens — is a call that does not compile here: *ecdsa.PublicKey is not
      a crypto.Key and never converts to one. Verification then compares the
      header against the binding and refuses a mismatch with
      coretoken.AlgorithmMismatch, before any key reaches any primitive.

      [NewVerifierFromJWK] and [NewSetVerifier] are the only places an algorithm is
      chosen at run time, and they choose it from the KEY's "kty"/"crv" — material
      the relying party fetched from a trusted publisher — never from the token.

      # What is refused, always

        - "alg":"none" in any capitalisation (RFC 7519 §6), with no option to
          enable it: the core Algorithm enum has no value that spells it.
        - a non-empty "crit" header (RFC 7515 §4.1.11).
        - a token past the configured size, or claims past the configured nesting
          depth, both checked before any decode.
        - a repeated JSON member in the header or the claims (RFC 8725 §2.6).
        - a token with no "exp", unless the profile opts out explicitly.

      See the package CLAUDE.md for the RFC 8725 coverage table, including the
      sections this package does NOT address.

      Package token — hosts compile-time interface assertions
      — keeping them out of the production
      source so the runtime binary carries no diagnostic-only declarations.

      Package token — the claim validation both formats share.

      Everything here runs AFTER the signature has verified, and that ordering is a
      security property, not an implementation detail: reporting "expired" for a
      token whose signature was never checked tells an attacker what is inside a
      forgery, and hands the application a claim set it may log.

      Package token — the JWT verification policy.
    functions:
      - doc: |-
          NewVerifierFromJWK returns a JWT verifier bound to the algorithm key's own
          type and curve imply:

          	kty=oct                -> HS256
          	kty=EC,  crv=P-256     -> ES256
          	kty=OKP, crv=Ed25519   -> EdDSA

          P-384 and P-521 are represented by the jwk package and refused HERE with
          KeyUnsuitable. RSA never gets this far: jwk.Parse refuses it first, as
          UNSUPPORTED_KEY_TYPE, because the SDK models no RSA scheme at all. The SDK
          signs with none of them, and a verifier that pretends otherwise would promise
          an interop the crypto domain cannot honour.

          The key's own advisory members are enforced, not ignored: a "use" other than
          "sig", a "key_ops" that excludes "verify", or an "alg" that disagrees with
          what the key type implies, all refuse the key. A publisher who says "this key
          is for encryption" has said something, and honouring it costs nothing.
        in:
          - name: key
            type: jwk.KeyValue
          - name: cfg
            type: VerifierConfig
        name: NewVerifierFromJWK
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
      - doc: |-
          NewSetVerifier returns a JWT verifier that selects a key from set by the
          token's "kid" header.

          # The kid is a selector, not a credential

          The kid chooses which key to TRY. It never decides whether the token is
          valid: the signature does. So a kid naming an EC key does not let a token
          claiming HS256 through — the binding built from that key reports ES256, the
          header comparison refuses, and no key material reaches a MAC.

          # Duplicate kids

          jwk.Set.ByKid refuses to choose between keys sharing a kid, because nothing
          in the document distinguishes them and picking the first would make the
          answer depend on member order. This verifier CAN choose, because it has
          something the key set does not: a signature. It tries the candidates in
          document order and accepts the first that verifies, which is the rotation
          path RFC 7517 §4.5 leaves open.

          It tries a BOUNDED number of them. The candidate count is chosen by whoever
          published the JWK Set, and each attempt is a signature verification, so an
          unbounded loop would let a publisher — or anybody who can influence the
          document — price every request. Past MaxKeyCandidates the token is refused
          with KeyIDAmbiguous rather than verified slowly.

          # The set is bound ONCE, here

          Every member's verifying binding is derived at construction, not per token.
          A JWK is a key's SERIALISED form and the binding is the same key in the
          shape a primitive consumes; deriving it reads the key's own kty/crv/x/y and
          nothing a token supplies, so it is a fixed function of material that is
          fixed for this verifier's lifetime. Doing it per request cost a full PKIX
          round trip — `x509.MarshalPKIXPublicKey` immediately re-parsed by
          `x509.ParsePKIXPublicKey` — measured at 8.3 % of an ES256 JWKS
          verification's CPU and 28.2 % of its allocated objects. See
          `internal/service/crypto/key/jwk/BENCH.md`.

          What deliberately did NOT move is the ORDER. Which key is selected, the
          candidate bound, and the algorithm comparison against the binding all still
          happen per token and in the same sequence, because that sequence is ADR
          0042's security property. Nothing here is keyed on, or cached against,
          anything the token carries.

          # A set that can verify nothing is refused

          Binding at construction is also what lets a useless set be refused there
          (ADR 0031): an empty set, and one whose every member either has no kid or is
          unusable, are both PolicyMisconfigured rather than a verifier that refuses
          every token. The unusable members of a set that IS accepted still count
          against MaxKeyCandidates — see indexByKid.
        in:
          - name: set
            type: jwk.Set
          - name: cfg
            type: VerifierConfig
        name: NewSetVerifier
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
      - doc: |-
          NewHS256Issuer returns a JWT issuer signing with HMAC-SHA-256 under secret.

          HS256 is symmetric: anybody who can verify these tokens can also mint them.
          Reach for [NewES256Issuer] or [NewEdDSAIssuer] the moment the verifier is
          not the same trust domain as the issuer.
        in:
          - name: secret
            type: corecrypto.Key
          - name: cfg
            type: IssuerConfig
        name: NewHS256Issuer
        out:
          - name: issuer
            type: coretoken.Issuer
          - name: err
            type: error
      - doc: |-
          NewES256Issuer returns a JWT issuer signing with ECDSA P-256 + SHA-256,
          emitting the fixed-width R||S signature of RFC 7518 §3.4.
        in:
          - name: priv
            type: "*ecdsa.PrivateKey"
          - name: cfg
            type: IssuerConfig
        name: NewES256Issuer
        out:
          - name: issuer
            type: coretoken.Issuer
          - name: err
            type: error
      - doc: NewEdDSAIssuer returns a JWT issuer signing with Ed25519 (JOSE "EdDSA").
        in:
          - name: priv
            type: ed25519.PrivateKey
          - name: cfg
            type: IssuerConfig
        name: NewEdDSAIssuer
        out:
          - name: issuer
            type: coretoken.Issuer
          - name: err
            type: error
      - doc: NewHS256Verifier returns a JWT verifier bound to HMAC-SHA-256 under secret.
        in:
          - name: secret
            type: corecrypto.Key
          - name: cfg
            type: VerifierConfig
        name: NewHS256Verifier
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
      - doc: |-
          NewES256Verifier returns a JWT verifier bound to ECDSA P-256 under pub.

          pub is validated as a curve point, not merely measured: an off-curve point
          is a documented route to key recovery (RFC 8725 §3.4).
        in:
          - name: pub
            type: "*ecdsa.PublicKey"
          - name: cfg
            type: VerifierConfig
        name: NewES256Verifier
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
      - doc: NewEdDSAVerifier returns a JWT verifier bound to Ed25519 under pub.
        in:
          - name: pub
            type: ed25519.PublicKey
          - name: cfg
            type: VerifierConfig
        name: NewEdDSAVerifier
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
      - doc: NewPasetoV4Issuer returns a PASETO v4.public issuer signing with Ed25519.
        in:
          - name: priv
            type: ed25519.PrivateKey
          - name: cfg
            type: PasetoIssuerConfig
        name: NewPasetoV4Issuer
        out:
          - name: issuer
            type: coretoken.Issuer
          - name: err
            type: error
      - doc: NewPasetoV4Verifier returns a PASETO v4.public verifier bound to pub.
        in:
          - name: pub
            type: ed25519.PublicKey
          - name: cfg
            type: PasetoVerifierConfig
        name: NewPasetoV4Verifier
        out:
          - name: verifier
            type: coretoken.Verifier
          - name: err
            type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
      coretoken: github.com/kitsunium/sdk/internal/core/security/token
      ecdsa: crypto/ecdsa
      ed25519: crypto/ed25519
      jwk: github.com/kitsunium/sdk/internal/service/crypto/key/jwk
    path: github.com/kitsunium/sdk/internal/service/security/token
    types:
      - decl: true
        doc: |-
          IssuerConfig configures a JWT issuer.

          The zero value is usable and safe: it stamps "iat", requires the caller to
          supply an expiry, and refuses to mint a token that would never expire.
        name: IssuerConfig
        struct:
          fields:
            - doc: Issuer, when non-empty, is stamped as "iss" on claims that carry none.
              name: Issuer
              type: string
            - doc: |-
                Type overrides the JWS "typ" header. Empty means "JWT" (RFC 7519 §5.1).
                Set it to an explicit media type such as "at+jwt" when this issuer mints
                more than one kind of token (RFC 8725 §3.11 / §3.12).
              name: Type
              type: string
            - doc: |-
                KeyID, when non-empty, is stamped as the JWS "kid" header — the value a
                recipient's key-set verifier selects on. An issuer that publishes a JWK
                Set needs one; an issuer whose verifier holds a single key does not.
              name: KeyID
              type: string
            - doc: |-
                Lifetime, when positive, is stamped as "exp" = now + Lifetime on claims
                that carry no expiry of their own. Zero means the claims must bring one.
              name: Lifetime
              type: time.Duration
            - doc: |-
                AllowMissingExpiry permits minting a token with no "exp" at all. The
                zero value is false, so the dangerous shape is the one you have to ask
                for by name: a bearer token that never expires is a password with worse
                rotation (ADR 0030).
              name: AllowMissingExpiry
              type: bool
            - doc: |-
                Clock is the time source for "iat" and the derived "exp". Nil means
                clock.System. It is a clock.Clock — the frozen read-only half of the
                time port (ADR 0039) — because issuing stamps instants and never waits.
              name: Clock
              type: clock.Clock
      - decl: true
        doc: |-
          PasetoIssuerConfig configures a PASETO v4.public issuer.

          It is a flat struct rather than an [IssuerConfig] plus two extras, and the
          missing fields are the point: PASETO has no header parameters, so there is
          nothing for Type or KeyID to set. Embedding the JWS config would have
          published two knobs this format silently ignores, and a configuration field
          that does nothing is a bug waiting for somebody to set it. The equivalent of
          a "kid" here is [PasetoIssuerConfig.Footer], which the signature covers.

          The zero value is usable and safe: it stamps "iat", requires the caller to
          supply an expiry, and refuses to mint a token that would never expire.
        name: PasetoIssuerConfig
        struct:
          fields:
            - doc: Issuer, when non-empty, is stamped as "iss" on claims that carry none.
              name: Issuer
              type: string
            - doc: |-
                Footer is the optional, AUTHENTICATED but unencrypted footer. It is
                covered by the signature through the pre-authentication encoding, and it
                is where a key identifier belongs in this format.
              name: Footer
              type: "[]byte"
            - doc: |-
                ImplicitAssertion is v4's optional out-of-band context: it is covered by
                the signature but never transmitted, so a token only verifies for a
                recipient who already knows it. Both sides must configure the same value.
              name: ImplicitAssertion
              type: "[]byte"
            - doc: |-
                Lifetime, when positive, is stamped as "exp" = now + Lifetime on claims
                that carry no expiry of their own. Zero means the claims must bring one.
              name: Lifetime
              type: time.Duration
            - doc: |-
                AllowMissingExpiry permits minting a token with no "exp" at all. The
                zero value is false, so the dangerous shape is the one you have to ask
                for by name (ADR 0030).
              name: AllowMissingExpiry
              type: bool
            - doc: |-
                Clock is the time source for "iat" and the derived "exp". Nil means
                clock.System.
              name: Clock
              type: clock.Clock
      - decl: true
        doc: |-
          PasetoVerifierConfig configures a PASETO v4.public verifier.

          Like its issuing counterpart it is flat rather than an embedded
          [VerifierConfig], and the absent knobs are deliberate: PASETO has no "typ"
          to require and no "kid" to select on, so RequireType and MaxKeyCandidates
          would be fields this format ignores.

          The zero value is usable and strict: it requires an expiry, allows no clock
          skew, checks no issuer or audience, expects no footer, and applies the
          default bounds.
        name: PasetoVerifierConfig
        struct:
          fields:
            - doc: Issuer, when non-empty, must equal the token's "iss" (RFC 8725 §3.8).
              name: Issuer
              type: string
            - doc: |-
                Audience, when non-empty, must equal the token's "aud". PASETO's
                audience is a single string, so there is no list to search.
              name: Audience
              type: string
            - doc: |-
                Footer is the footer this verifier expects, compared in constant time.
                Empty means the token must carry NO footer.

                The Verifier port returns claims, not a footer, so an unconstrained
                footer would be data this package authenticated and then dropped on the
                floor. Refusing is the only answer that does not quietly lose it.
              name: Footer
              type: "[]byte"
            - doc: ImplicitAssertion must equal the value the issuer signed with.
              name: ImplicitAssertion
              type: "[]byte"
            - doc: |-
                Leeway is the clock-skew allowance applied to "exp" and "nbf". It must
                be in [0, MaxLeeway].
              name: Leeway
              type: time.Duration
            - doc: |-
                MaxLifetime, when positive, refuses an authenticated token whose exp-iat
                span exceeds it. It requires "iat".
              name: MaxLifetime
              type: time.Duration
            - doc: MaxTokenLen bounds the token string. Zero means DefaultMaxTokenLen.
              name: MaxTokenLen
              type: int
            - doc: |-
                MaxClaimDepth bounds the claims' JSON nesting. Zero means
                DefaultMaxClaimDepth.
              name: MaxClaimDepth
              type: int
            - doc: AllowMissingExpiry accepts a token with no "exp".
              name: AllowMissingExpiry
              type: bool
            - doc: |-
                Clock is the time source for the temporal claims. Nil means
                clock.System; a clock.ManualClock makes an expiry test deterministic.
              name: Clock
              type: clock.Clock
      - decl: true
        doc: |-
          VerifierConfig configures a JWT verifier.

          The zero value is usable and strict: it requires an expiry, allows no clock
          skew, checks no issuer or audience (there is none to check against), and
          applies the default bounds.
        name: VerifierConfig
        struct:
          fields:
            - doc: Issuer, when non-empty, must equal the token's "iss" (RFC 8725 §3.8).
              name: Issuer
              type: string
            - doc: |-
                Audience, when non-empty, must appear in the token's "aud"
                (RFC 8725 §3.9). A correctly signed token minted for another API is not
                a valid token here.
              name: Audience
              type: string
            - doc: |-
                RequireType, when non-empty, must equal the JWS "typ" header. It is the
                mechanism RFC 8725 §3.12 asks for: two kinds of token from one issuer
                need validation rules that reject each other's tokens.
              name: RequireType
              type: string
            - doc: |-
                Leeway is the clock-skew allowance applied to "exp" and "nbf". It must
                be in [0, MaxLeeway].
              name: Leeway
              type: time.Duration
            - doc: |-
                MaxLifetime, when positive, refuses an authenticated token whose
                exp-iat span exceeds it. It requires "iat": a lifetime that cannot be
                computed is not a lifetime this recipient has accepted.
              name: MaxLifetime
              type: time.Duration
            - doc: |-
                MaxTokenLen bounds the token string. Zero means DefaultMaxTokenLen; a
                value outside [MinTokenLen, MaxTokenLenCeiling] is refused.
              name: MaxTokenLen
              type: int
            - doc: |-
                MaxClaimDepth bounds the claims' JSON nesting. Zero means
                DefaultMaxClaimDepth; a value outside [1, MaxClaimDepthCeiling] is
                refused.
              name: MaxClaimDepth
              type: int
            - doc: |-
                MaxKeyCandidates bounds how many keys a set verifier tries for one kid.
                Zero means DefaultMaxKeyCandidates. Ignored by single-key verifiers.
              name: MaxKeyCandidates
              type: int
            - doc: |-
                AllowMissingExpiry accepts a token with no "exp". The zero value is
                false, so the profile that RFC 7519 §4.1.4 leaves optional is required
                here unless the caller opts out by name.
              name: AllowMissingExpiry
              type: bool
            - doc: |-
                Clock is the time source for the temporal claims. Nil means
                clock.System; a clock.ManualClock makes an expiry test deterministic
                without sleeping.
              name: Clock
              type: clock.Clock
  - doc: |-
      Package token — the dotted-quad codes a consumer routes on.

      These are RE-EXPORTS, not declarations: the ranges 0.2.13.* and 0.3.44.* are
      owned by internal/core/security/token, where every code of the token domain
      is declared (ADR 0160), and 0.3.42.* by internal/core/crypto/key/jwk; the
      errs ownership audit skips a cross-package selector for exactly this reason
      (ADR 0035). Matching on a code
      rather than on a reason string is the stronger contract — a code is a number
      in docs/error-codes.yaml, a reason is a spelling.

      	switch {
      	case errs.HasCode(err, token.CodeExpired):          // 401, refresh
      	case errs.HasCode(err, token.CodeAudienceMismatch): // 401, wrong service
      	case errs.HasCode(err, token.CodeSignatureInvalid): // 401, and alert
      	}

      All three answer 401, and a token addressed to another service is no
      exception: RFC 6750 §3.1 spends invalid_token — and 401 — on a token that is
      "invalid for other reasons", while 403 (insufficient_scope) says the token
      is valid HERE and merely too weak, which an audience mismatch is not. What
      differs between the rows is what the caller does next, not the status.

      Package token — the algorithm, registered-claim and JWK key vocabulary.

      Package token — the constructor set, one per algorithm, plus the JWK
      loaders and bridges. Each constructor accepts only the Go key type its
      algorithm can use, which is what makes algorithm confusion a call that does
      not compile.

      Package token — the typed verdicts an issuer, a verifier or a key loader
      returns.

      Match them with errs.HasCode (the codes are re-exported in facade_gen.go) or
      errs.HasReason. Their Public halves name WHICH check refused a token and
      never echo a value out of it — not an audience, not an issuer, not a key id,
      not a claim. The JWK* verdicts are the key loaders' — ParseJWK and
      ParseJWKSet — and hold a key document to the same rule: they name the rule a
      member broke, never the member's value.

      Package token is the public facade for the SDK's security-token domain:
      JSON Web Tokens over JWS Compact Serialization (RFC 7519) and PASETO
      v4.public. It is stdlib-only and composes the SDK's own crypto schemes, so
      it adds no dependency to a consumer's build.

      	iss, err := token.NewES256Issuer(privateKey, token.IssuerConfig{
      	    Issuer:   "https://auth.example.com",
      	    Lifetime: 15 * time.Minute,
      	})
      	jwt, err := iss.Issue(token.NewClaims().WithSubject("user-42").WithAudience("api"))

      	ver, err := token.NewES256Verifier(&privateKey.PublicKey, token.VerifierConfig{
      	    Issuer:   "https://auth.example.com",
      	    Audience: "api",
      	    Leeway:   30 * time.Second,
      	})
      	claims, err := ver.Verify(jwt)

      # Algorithm confusion is a call you cannot write

      There is no NewVerifier(algorithm, key), and no verifier reads the token's
      "alg" header to decide what to do with it. There is one constructor per
      algorithm, and each accepts only the Go type that algorithm can use:

      	NewHS256Verifier(secret crypto.Key,      cfg VerifierConfig)
      	NewES256Verifier(pub *ecdsa.PublicKey,   cfg VerifierConfig)
      	NewEdDSAVerifier(pub ed25519.PublicKey,  cfg VerifierConfig)

      The textbook attack — take the RSA or EC public key the server publishes,
      use it as an HMAC shared secret, mint tokens with it, and let a verifier
      that trusts the header do the rest — needs a call that hands a public key to
      the HMAC path. Here that call does not compile: crypto.Key is a struct with
      an unexported field, and no *ecdsa.PublicKey converts to it. Verification
      then COMPARES the header against the binding and refuses a mismatch with
      AlgorithmMismatch, before any key reaches any primitive.

      [NewVerifierFromJWK] and [NewSetVerifier] are the only places an algorithm
      is selected at run time, and they select it from the KEY's kty/crv — the
      material a relying party fetched from a publisher it trusts — never from the
      token.

      # Loading a published key

      A relying party that verifies against an issuer's published keys fetches the
      key document itself — this package performs no I/O, follows no jwks_uri and
      caches nothing (ADR 0042) — and hands the bytes to [ParseJWKSet], or to
      [ParseJWK] for a single key:

      	set, err := token.ParseJWKSet(body) // the issuer's JWK Set, as fetched
      	ver, err := token.NewSetVerifier(set, token.VerifierConfig{
      	    Issuer:   "https://auth.example.com",
      	    Audience: "api",
      	})

      Parsing is the only way to obtain a [JWK]: the type has no exported field
      and no UnmarshalJSON, so its validation — strict base64url, coordinates at
      the curve's fixed length, the point on its curve, a private "d" deriving
      exactly the declared public key — is not a step a caller can skip by
      decoding some other way. [NewJWKSet] assembles a set from keys already
      parsed. A refusal carries one of the CodeJWK* codes, matchable with
      errs.HasCode; a set is accepted whole or not at all, so one RSA member —
      the SDK verifies nothing with RSA — refuses the document.

      # What is always refused

        - "alg":"none" in any capitalisation (RFC 7519 §6). [Algorithm] is an enum
          with no value that spells it, so no configuration can enable it.
        - a non-empty "crit" header (RFC 7515 §4.1.11).
        - a token with no "exp", unless VerifierConfig.AllowMissingExpiry says
          otherwise. RFC 7519 §4.1.4 makes exp OPTIONAL; a bearer token that never
          expires is a password with a worse rotation story, so the default here
          inverts that and the opt-out has a name.
        - a token past MaxTokenLen, or claims past MaxClaimDepth — both checked
          before any decode allocates.
        - a repeated JSON member in the header or the claims (RFC 8725 §2.6).

      # Testing time without sleeping

      Every config has a Clock field, and it takes any value with the two methods
      Now and Since — so the fake is one a test writes itself, and an expiry test
      moves time by assignment instead of by sleeping:

      	type fakeClock struct{ now time.Time }

      	func (c *fakeClock) Now() time.Time                  { return c.now }
      	func (c *fakeClock) Since(t time.Time) time.Duration { return c.now.Sub(t) }

      	fake := &fakeClock{now: time.Unix(1000, 0)}
      	ver, _ := token.NewHS256Verifier(secret, token.VerifierConfig{Clock: fake})
      	fake.now = fake.now.Add(2 * time.Hour) // now the token is expired, deterministically

      Move it between calls, or guard it with a mutex if a verifier reads it from
      another goroutine at the same time.

      # Claims are not printable

      [Claims] renders its SHAPE under %v / %s / %#v — "token.Claims{registered:3
      aud:1 private:2}" — and never a value. A claim set is the output of an
      authentication decision and routinely holds a subject id, an email or a
      tenant; the counts are enough to tell "no audience was sent" from "the
      audience did not match", which is what a %v is usually reaching for.
    facade:
      - const:
          - doc: |-
              CodeMalformed identifies an input that could not be read as a token
              (0.2.13.1).
            name: CodeMalformed
            reexport: coretoken.CodeMalformed
            type: errs.Code
            typed: true
            value: "0x00_02_0D_01"
      - const:
          - doc: |-
              CodeAlgorithmNone identifies a token declaring the unsecured "none"
              algorithm (0.2.13.2).
            name: CodeAlgorithmNone
            reexport: coretoken.CodeAlgorithmNone
            type: errs.Code
            typed: true
            value: "0x00_02_0D_02"
      - const:
          - doc: |-
              CodeAlgorithmMismatch identifies a header naming an algorithm other than the
              bound one — what an algorithm-confusion attempt produces (0.2.13.3).
            name: CodeAlgorithmMismatch
            reexport: coretoken.CodeAlgorithmMismatch
            type: errs.Code
            typed: true
            value: "0x00_02_0D_03"
      - const:
          - doc: |-
              CodeSignatureInvalid identifies a signature or MAC tag that did not
              authenticate (0.2.13.4).
            name: CodeSignatureInvalid
            reexport: coretoken.CodeSignatureInvalid
            type: errs.Code
            typed: true
            value: "0x00_02_0D_04"
      - const:
          - doc: CodeExpired identifies an authenticated token whose exp is past (0.2.13.5).
            name: CodeExpired
            reexport: coretoken.CodeExpired
            type: errs.Code
            typed: true
            value: "0x00_02_0D_05"
      - const:
          - doc: |-
              CodeNotYetValid identifies an authenticated token whose nbf is in the future
              (0.2.13.6).
            name: CodeNotYetValid
            reexport: coretoken.CodeNotYetValid
            type: errs.Code
            typed: true
            value: "0x00_02_0D_06"
      - const:
          - doc: |-
              CodeExpiryRequired identifies a token with no exp where the profile requires
              one (0.2.13.7).
            name: CodeExpiryRequired
            reexport: coretoken.CodeExpiryRequired
            type: errs.Code
            typed: true
            value: "0x00_02_0D_07"
      - const:
          - doc: |-
              CodeAudienceMismatch identifies a configured audience absent from the token's
              aud claim (0.2.13.8).
            name: CodeAudienceMismatch
            reexport: coretoken.CodeAudienceMismatch
            type: errs.Code
            typed: true
            value: "0x00_02_0D_08"
      - const:
          - doc: |-
              CodeIssuerMismatch identifies an iss that is not the configured issuer
              (0.2.13.9).
            name: CodeIssuerMismatch
            reexport: coretoken.CodeIssuerMismatch
            type: errs.Code
            typed: true
            value: "0x00_02_0D_09"
      - const:
          - doc: CodeTooLarge identifies an input past a declared size bound (0.2.13.10).
            name: CodeTooLarge
            reexport: coretoken.CodeTooLarge
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0A"
      - const:
          - doc: CodeTooDeep identifies claims nested past MaxClaimDepth (0.2.13.11).
            name: CodeTooDeep
            reexport: coretoken.CodeTooDeep
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0B"
      - const:
          - doc: |-
              CodeKeyUnsuitable identifies a key that cannot serve the algorithm it was
              handed to (0.2.13.12).
            name: CodeKeyUnsuitable
            reexport: coretoken.CodeKeyUnsuitable
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0C"
      - const:
          - doc: |-
              CodePolicyMisconfigured identifies a constructor given a configuration it
              cannot honour; permanent, never a retry (0.2.13.13).
            name: CodePolicyMisconfigured
            reexport: coretoken.CodePolicyMisconfigured
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0D"
      - const:
          - doc: |-
              CodeIssueFailed identifies claims that could not be rendered or signed
              (0.2.13.14).
            name: CodeIssueFailed
            reexport: coretoken.CodeIssueFailed
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0E"
      - const:
          - doc: |-
              CodeClaimNameInvalid identifies an empty or reserved private-claim name
              (0.2.13.15).
            name: CodeClaimNameInvalid
            reexport: coretoken.CodeClaimNameInvalid
            type: errs.Code
            typed: true
            value: "0x00_02_0D_0F"
      - const:
          - doc: |-
              CodeLifetimeTooLong identifies an exp-iat span past
              VerifierConfig.MaxLifetime (0.2.13.16).
            name: CodeLifetimeTooLong
            reexport: coretoken.CodeLifetimeTooLong
            type: errs.Code
            typed: true
            value: "0x00_02_0D_10"
      - const:
          - doc: |-
              CodeHeaderUnsupported identifies a non-empty "crit", or a "typ" mismatch
              (0.3.44.1).
            name: CodeHeaderUnsupported
            reexport: coretoken.CodeHeaderUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_2C_01"
      - const:
          - doc: CodeKeyNotFound identifies a kid naming no key in the set (0.3.44.2).
            name: CodeKeyNotFound
            reexport: coretoken.CodeKeyNotFound
            type: errs.Code
            typed: true
            value: "0x00_03_2C_02"
      - const:
          - doc: |-
              CodeKeyIDMissing identifies a token presented to a set verifier with no kid
              (0.3.44.3).
            name: CodeKeyIDMissing
            reexport: coretoken.CodeKeyIDMissing
            type: errs.Code
            typed: true
            value: "0x00_03_2C_03"
      - const:
          - doc: |-
              CodeKeyIDAmbiguous identifies more keys sharing a kid than the verifier will
              try (0.3.44.4).
            name: CodeKeyIDAmbiguous
            reexport: coretoken.CodeKeyIDAmbiguous
            type: errs.Code
            typed: true
            value: "0x00_03_2C_04"
      - const:
          - doc: |-
              CodeFooterMismatch identifies a PASETO footer that is not the expected one
              (0.3.44.5).
            name: CodeFooterMismatch
            reexport: coretoken.CodeFooterMismatch
            type: errs.Code
            typed: true
            value: "0x00_03_2C_05"
      - const:
          - doc: |-
              CodeSchemeUnsupported identifies a PASETO version+purpose that is not
              v4.public (0.3.44.6).
            name: CodeSchemeUnsupported
            reexport: coretoken.CodeSchemeUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_2C_06"
      - const:
          - doc: |-
              CodeDuplicateMember identifies a header or claims object repeating a member
              name (0.3.44.7).
            name: CodeDuplicateMember
            reexport: coretoken.CodeDuplicateMember
            type: errs.Code
            typed: true
            value: "0x00_03_2C_07"
      - const:
          - doc: |-
              CodeJWKMalformed identifies a key document that is not the JSON shape
              RFC 7517 describes — invalid JSON, a key that is not an object, or a set
              whose "keys" is not an array (0.3.42.1).
            name: CodeJWKMalformed
            reexport: corejwk.CodeJWKMalformed
            type: errs.Code
            typed: true
            value: "0x00_03_2A_01"
      - const:
          - doc: |-
              CodeJWKMissingMember identifies a key missing a member its declared type
              requires, or a set missing "keys" (0.3.42.2).
            name: CodeJWKMissingMember
            reexport: corejwk.CodeJWKMissingMember
            type: errs.Code
            typed: true
            value: "0x00_03_2A_02"
      - const:
          - doc: |-
              CodeJWKUnsupportedKeyType identifies a "kty" other than EC, OKP or oct — RSA
              included, since the SDK verifies nothing with RSA (0.3.42.3).
            name: CodeJWKUnsupportedKeyType
            reexport: corejwk.CodeJWKUnsupportedKeyType
            type: errs.Code
            typed: true
            value: "0x00_03_2A_03"
      - const:
          - doc: |-
              CodeJWKUnsupportedCurve identifies an unknown "crv", or one paired with the
              wrong "kty" (0.3.42.4).
            name: CodeJWKUnsupportedCurve
            reexport: corejwk.CodeJWKUnsupportedCurve
            type: errs.Code
            typed: true
            value: "0x00_03_2A_04"
      - const:
          - doc: |-
              CodeJWKInvalidEncoding identifies a member that is not unpadded base64url, or
              not the fixed length its curve mandates (0.3.42.5).
            name: CodeJWKInvalidEncoding
            reexport: corejwk.CodeJWKInvalidEncoding
            type: errs.Code
            typed: true
            value: "0x00_03_2A_05"
      - const:
          - doc: |-
              CodeJWKKeyMismatch identifies material that is not a key on the declared
              curve: an off-curve point, an out-of-range scalar, or a "d" that does not
              derive the declared public key (0.3.42.6).
            name: CodeJWKKeyMismatch
            reexport: corejwk.CodeJWKKeyMismatch
            type: errs.Code
            typed: true
            value: "0x00_03_2A_06"
      - const:
          - doc: |-
              AlgorithmHS256 is JOSE "HS256" — HMAC-SHA-256 over a 256-bit shared secret
              (RFC 7518 §3.2). Symmetric: a verifier can also mint.
            name: AlgorithmHS256
            reexport: coretoken.AlgorithmHS256
            type: Algorithm
            typed: true
            value: "1"
      - const:
          - doc: |-
              AlgorithmES256 is JOSE "ES256" — ECDSA on NIST P-256 with SHA-256 and the
              fixed-width R||S signature encoding of RFC 7518 §3.4.
            name: AlgorithmES256
            reexport: coretoken.AlgorithmES256
            type: Algorithm
            typed: true
            value: "2"
      - const:
          - doc: |-
              AlgorithmEdDSA is JOSE "EdDSA" — Ed25519 over the JWS signing input
              (RFC 8037 §3.1).
            name: AlgorithmEdDSA
            reexport: coretoken.AlgorithmEdDSA
            type: Algorithm
            typed: true
            value: "3"
      - const:
          - doc: |-
              AlgorithmPasetoV4Public is PASETO v4.public — Ed25519 over the
              pre-authentication encoding of the header, payload and footer.
            name: AlgorithmPasetoV4Public
            reexport: coretoken.AlgorithmPasetoV4Public
            type: Algorithm
            typed: true
            value: "4"
      - const:
          - doc: ClaimIssuer is the registered claim "iss" (RFC 7519 §4.1.1).
            name: ClaimIssuer
            note: |-
              There is deliberately no constant for the unsecured "none" algorithm of
              RFC 7519 §6: [Algorithm] is an enum with no value that spells it, so no
              configuration can enable one and no call site can ask for one.
            reexport: coretoken.ClaimIssuer
            type: string
            typed: true
            value: "\"iss\""
      - const:
          - doc: ClaimSubject is the registered claim "sub" (RFC 7519 §4.1.2).
            name: ClaimSubject
            reexport: coretoken.ClaimSubject
            type: string
            typed: true
            value: "\"sub\""
      - const:
          - doc: ClaimAudience is the registered claim "aud" (RFC 7519 §4.1.3).
            name: ClaimAudience
            reexport: coretoken.ClaimAudience
            type: string
            typed: true
            value: "\"aud\""
      - const:
          - doc: ClaimExpiry is the registered claim "exp" (RFC 7519 §4.1.4).
            name: ClaimExpiry
            reexport: coretoken.ClaimExpiry
            type: string
            typed: true
            value: "\"exp\""
      - const:
          - doc: ClaimNotBefore is the registered claim "nbf" (RFC 7519 §4.1.5).
            name: ClaimNotBefore
            reexport: coretoken.ClaimNotBefore
            type: string
            typed: true
            value: "\"nbf\""
      - const:
          - doc: ClaimIssuedAt is the registered claim "iat" (RFC 7519 §4.1.6).
            name: ClaimIssuedAt
            reexport: coretoken.ClaimIssuedAt
            type: string
            typed: true
            value: "\"iat\""
      - const:
          - doc: ClaimID is the registered claim "jti" (RFC 7519 §4.1.7).
            name: ClaimID
            reexport: coretoken.ClaimID
            type: string
            typed: true
            value: "\"jti\""
      - const:
          - doc: |-
              KeyTypeEC is the JWK "kty" of an elliptic-curve key on a NIST prime curve
              (RFC 7518 §6.2): public members "x" and "y", private member "d".
            name: KeyTypeEC
            reexport: jwk.TypeEC
            type: KeyType
            typed: true
            value: "\"EC\""
      - const:
          - doc: |-
              KeyTypeOKP is the JWK "kty" of an octet key pair, an Edwards-curve key
              (RFC 8037 §2): public member "x", private member "d".
            name: KeyTypeOKP
            reexport: jwk.TypeOKP
            type: KeyType
            typed: true
            value: "\"OKP\""
      - const:
          - doc: |-
              KeyTypeOct is the JWK "kty" of a symmetric key carried whole in "k"
              (RFC 7518 §6.4). It has no public half and no curve.
            name: KeyTypeOct
            reexport: jwk.TypeOct
            type: KeyType
            typed: true
            value: "\"oct\""
      - const:
          - doc: CurveP256 is NIST P-256 (RFC 7518 §6.2.1.1), the curve of an ES256 key.
            name: CurveP256
            reexport: jwk.CurveP256
            type: Curve
            typed: true
            value: "\"P-256\""
      - const:
          - doc: |-
              CurveP384 is NIST P-384. [ParseJWK] accepts it, but nothing in this package
              signs or verifies with it, so [NewVerifierFromJWK] refuses it with
              [KeyUnsuitable].
            name: CurveP384
            reexport: jwk.CurveP384
            type: Curve
            typed: true
            value: "\"P-384\""
      - const:
          - doc: CurveP521 is NIST P-521, accepted and refused exactly as P-384 is.
            name: CurveP521
            reexport: jwk.CurveP521
            type: Curve
            typed: true
            value: "\"P-521\""
      - const:
          - doc: CurveEd25519 is the Edwards curve of an EdDSA key (RFC 8037 §2).
            name: CurveEd25519
            reexport: jwk.CurveEd25519
            type: Curve
            typed: true
            value: "\"Ed25519\""
      - alias:
          - doc: |-
              Key is the public alias for the SDK's opaque, redacting 256-bit symmetric
              key — the only type NewHS256Issuer / NewHS256Verifier accept. Build one with
              pkg/v1/crypto.NewKey, or derive one with pkg/v1/crypto/kdf; never type one.
            name: Key
            target: corecrypto.Key
      - alias:
          - doc: |-
              JWK is the public alias for a parsed JSON Web Key (RFC 7517). Obtain one
              from [ParseJWK]: the type has no exported field and deliberately no
              UnmarshalJSON, so json.Unmarshal decodes nothing into a JWK — and reports no
              error. A JWK field in a configuration struct therefore stays the zero JWK,
              which [NewVerifierFromJWK] refuses with [KeyUnsuitable]; decode that field
              as a json.RawMessage and hand it to ParseJWK instead.

              json.Marshal renders a JWK's public members only. A symmetric ("oct") key
              has no public form — its "k" member is the secret itself — so json.Marshal
              refuses it rather than publish it; private members leave only through the
              key's MarshalPrivate method, which says so at the call site.
            name: JWK
            target: jwk.KeyValue
      - alias:
          - doc: |-
              JWKSet is the public alias for a parsed JSON Web Key Set (RFC 7517 §5).
              Obtain one from [ParseJWKSet], or assemble one from parsed keys with
              [NewJWKSet].
            name: JWKSet
            target: jwk.Set
      - alias:
          - doc: |-
              KeyType is the public alias for a JWK's "kty" member, the key-type family
              [JWK].Kty reports: [KeyTypeEC], [KeyTypeOKP] or [KeyTypeOct]. The zero JWK
              reports the empty KeyType.
            name: KeyType
            target: jwk.Type
      - alias:
          - doc: |-
              Curve is the public alias for a JWK's "crv" member, the curve [JWK].Crv
              reports: [CurveP256], [CurveP384], [CurveP521] or [CurveEd25519]. A symmetric
              key has no curve and reports the empty Curve.
            name: Curve
            target: jwk.Curve
      - func:
          doc: |-
            NewHS256Issuer returns a JWT issuer signing with HMAC-SHA-256 under secret.

            HS256 is symmetric: everyone who can verify these tokens can also mint them.
            Reach for [NewES256Issuer] or [NewEdDSAIssuer] the moment the verifier is not
            in the same trust domain as the issuer.
          forward: svctoken.NewHS256Issuer
          in:
            - name: secret
              type: Key
            - name: cfg
              type: IssuerConfig
          name: NewHS256Issuer
          out:
            - name: issuer
              type: Issuer
            - name: err
              type: error
      - func:
          doc: |-
            NewES256Issuer returns a JWT issuer signing with ECDSA P-256 + SHA-256,
            emitting the fixed-width R||S signature of RFC 7518 §3.4.
          forward: svctoken.NewES256Issuer
          in:
            - name: priv
              type: "*ecdsa.PrivateKey"
            - name: cfg
              type: IssuerConfig
          name: NewES256Issuer
          out:
            - name: issuer
              type: Issuer
            - name: err
              type: error
      - func:
          doc: NewEdDSAIssuer returns a JWT issuer signing with Ed25519 (JOSE "EdDSA").
          forward: svctoken.NewEdDSAIssuer
          in:
            - name: priv
              type: ed25519.PrivateKey
            - name: cfg
              type: IssuerConfig
          name: NewEdDSAIssuer
          out:
            - name: issuer
              type: Issuer
            - name: err
              type: error
      - func:
          doc: |-
            NewHS256Verifier returns a JWT verifier bound to HMAC-SHA-256 under secret.
            It accepts a [Key] and nothing else, which is what makes the HMAC half of
            algorithm confusion unwritable rather than merely documented.
          forward: svctoken.NewHS256Verifier
          in:
            - name: secret
              type: Key
            - name: cfg
              type: VerifierConfig
          name: NewHS256Verifier
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - func:
          doc: |-
            NewES256Verifier returns a JWT verifier bound to ECDSA P-256 under pub. The
            point is validated on the curve, not merely measured (RFC 8725 §3.4).
          forward: svctoken.NewES256Verifier
          in:
            - name: pub
              type: "*ecdsa.PublicKey"
            - name: cfg
              type: VerifierConfig
          name: NewES256Verifier
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - func:
          doc: NewEdDSAVerifier returns a JWT verifier bound to Ed25519 under pub.
          forward: svctoken.NewEdDSAVerifier
          in:
            - name: pub
              type: ed25519.PublicKey
            - name: cfg
              type: VerifierConfig
          name: NewEdDSAVerifier
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - func:
          doc: NewPasetoV4Issuer returns a PASETO v4.public issuer signing with Ed25519.
          forward: svctoken.NewPasetoV4Issuer
          in:
            - name: priv
              type: ed25519.PrivateKey
            - name: cfg
              type: PasetoIssuerConfig
          name: NewPasetoV4Issuer
          out:
            - name: issuer
              type: Issuer
            - name: err
              type: error
      - func:
          doc: |-
            NewPasetoV4Verifier returns a PASETO v4.public verifier bound to pub. A token
            of any other PASETO version or purpose — including v4.local — is refused with
            [SchemeUnsupported].
          forward: svctoken.NewPasetoV4Verifier
          in:
            - name: pub
              type: ed25519.PublicKey
            - name: cfg
              type: PasetoVerifierConfig
          name: NewPasetoV4Verifier
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - func:
          doc: |-
            ParseJWK decodes one JSON Web Key document (RFC 7517 §4) into the [JWK] that
            [NewVerifierFromJWK] and [NewJWKSet] take. Fetching the document is the
            application's job: this package performs no I/O, so the bytes come from
            wherever the application already trusts — a configuration file, or a key
            endpoint it queried itself.

            It is the only way to turn bytes into a JWK, and it validates before it
            returns one: every member the key type requires present, every member
            unpadded base64url (RFC 7515 §2), coordinates at the curve's fixed length,
            the point on the declared curve, and — when a private "d" is present — the
            scalar deriving exactly the declared public key. Members it does not model
            are ignored (RFC 7517 §4).

            A refusal returns the zero JWK and an error carrying one of
            [CodeJWKMalformed], [CodeJWKMissingMember], [CodeJWKUnsupportedKeyType],
            [CodeJWKUnsupportedCurve], [CodeJWKInvalidEncoding] or [CodeJWKKeyMismatch];
            its message names the rule that failed and never a member's value. An RSA
            key is refused here, with [CodeJWKUnsupportedKeyType], because the SDK
            verifies nothing with RSA.
          forward: jwk.Parse
          in:
            - name: document
              type: "[]byte"
          name: ParseJWK
          out:
            - name: key
              type: JWK
            - name: err
              type: error
      - func:
          doc: |-
            ParseJWKSet decodes a JSON Web Key Set document (RFC 7517 §5) — typically the
            body an issuer serves at its jwks_uri, fetched by the application — into the
            [JWKSet] that [NewSetVerifier] takes.

            Every member is validated exactly as [ParseJWK] validates one, and the set is
            accepted whole or not at all: one refused member refuses the document, with
            that member's own CodeJWK* code and its index attached, rather than yielding
            a set that silently holds fewer keys than were published. A set carrying an
            RSA member is therefore refused, with [CodeJWKUnsupportedKeyType].

            The "keys" member is required — absent or null is refused with
            [CodeJWKMissingMember] — while an empty array is a valid empty set, which
            [NewSetVerifier] then refuses because it could never verify anything. A
            document, or a member, that is JSON null is not an object at all and is
            refused with [CodeJWKMalformed].
          forward: jwk.ParseSet
          in:
            - name: document
              type: "[]byte"
          name: ParseJWKSet
          out:
            - name: set
              type: JWKSet
            - name: err
              type: error
      - func:
          doc: |-
            NewJWKSet assembles a [JWKSet] from keys already parsed, in the given order —
            the order in which [NewSetVerifier] tries candidates sharing a "kid". It
            validates nothing further: the material of every non-zero JWK already passed
            [ParseJWK], and a zero JWK in a set can never verify a token.
          forward: jwk.NewSet
          in:
            - name: keys
              type: JWK
          name: NewJWKSet
          out:
            - type: JWKSet
          variadic: true
      - func:
          doc: |-
            NewVerifierFromJWK returns a JWT verifier bound to the algorithm key's own
            kty/crv imply: oct to HS256, EC P-256 to ES256, OKP Ed25519 to EdDSA. Every
            other key the SDK can represent — P-384, P-521 — is refused with
            [KeyUnsuitable]; an RSA key never gets this far, because [ParseJWK] refuses
            it with [CodeJWKUnsupportedKeyType].

            The key's advisory members are enforced: a "use" other than "sig", a
            "key_ops" without "verify", or an "alg" contradicting the key type all refuse
            the key.
          forward: svctoken.NewVerifierFromJWK
          in:
            - name: key
              type: JWK
            - name: cfg
              type: VerifierConfig
          name: NewVerifierFromJWK
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - func:
          doc: |-
            NewSetVerifier returns a JWT verifier selecting a key from set by the token's
            "kid" header.

            The kid chooses which key to TRY; the signature decides whether the token is
            valid. A token with no kid is refused with [KeyIDMissing] rather than tried
            against every key in the set. When several keys share a kid — legal during a
            rotation, since RFC 7517 §4.5 only SHOULD-s uniqueness — the candidates are
            tried in document order up to VerifierConfig.MaxKeyCandidates, past which the
            token is refused with [KeyIDAmbiguous].

            A set no token could ever verify against is refused here, with
            [PolicyMisconfigured], rather than built into a verifier that refuses
            everything: an empty set, and one whose every member either carries no kid
            or is a key this package does not verify with (P-384, P-521). A single key
            published without a kid belongs to [NewVerifierFromJWK].
          forward: svctoken.NewSetVerifier
          in:
            - name: set
              type: JWKSet
            - name: cfg
              type: VerifierConfig
          name: NewSetVerifier
          out:
            - name: verifier
              type: Verifier
            - name: err
              type: error
      - var:
          - doc: Malformed is returned when the input cannot be read as a token.
            name: Malformed
            reexport: coretoken.Malformed
            type: "*kernelerrs.Error"
          - doc: |-
              AlgorithmNone is returned for a token declaring the unsecured "none"
              algorithm. It is unconditional — no configuration accepts one.
            name: AlgorithmNone
            reexport: coretoken.AlgorithmNone
            type: "*kernelerrs.Error"
          - doc: |-
              AlgorithmMismatch is returned when the token's algorithm header is not
              the algorithm the verifier is bound to. It is the verdict an
              algorithm-confusion attempt produces, reached before any key is used.
            name: AlgorithmMismatch
            reexport: coretoken.AlgorithmMismatch
            type: "*kernelerrs.Error"
          - doc: |-
              SignatureInvalid is returned when the signature or MAC tag did not
              authenticate under the bound key — the same verdict for a wrong key and
              for tampered bytes, because they are the same event.
            name: SignatureInvalid
            reexport: coretoken.SignatureInvalid
            type: "*kernelerrs.Error"
          - doc: Expired is returned when an AUTHENTICATED token's exp is past.
            name: Expired
            reexport: coretoken.Expired
            type: "*kernelerrs.Error"
          - doc: NotYetValid is returned when an authenticated token's nbf is future.
            name: NotYetValid
            reexport: coretoken.NotYetValid
            type: "*kernelerrs.Error"
          - doc: |-
              ExpiryRequired is returned when a token carries no exp and the profile
              requires one — the default on both the issuing and verifying side.
            name: ExpiryRequired
            reexport: coretoken.ExpiryRequired
            type: "*kernelerrs.Error"
          - doc: |-
              AudienceMismatch is returned when the configured audience is absent from
              an authenticated token's aud (RFC 8725 §3.9).
            name: AudienceMismatch
            reexport: coretoken.AudienceMismatch
            type: "*kernelerrs.Error"
          - doc: |-
              IssuerMismatch is returned when an authenticated token's iss is not the
              configured issuer (RFC 8725 §3.8).
            name: IssuerMismatch
            reexport: coretoken.IssuerMismatch
            type: "*kernelerrs.Error"
          - doc: |-
              TooLarge is returned for an input past a declared size bound, checked
              before any parsing happens.
            name: TooLarge
            reexport: coretoken.TooLarge
            type: "*kernelerrs.Error"
          - doc: TooDeep is returned for claims nested past MaxClaimDepth.
            name: TooDeep
            reexport: coretoken.TooDeep
            type: "*kernelerrs.Error"
          - doc: |-
              KeyUnsuitable is returned when a key cannot serve the algorithm it was
              handed to — the wrong length, curve, or key type.
            name: KeyUnsuitable
            reexport: coretoken.KeyUnsuitable
            type: "*kernelerrs.Error"
          - doc: |-
              PolicyMisconfigured is returned by a constructor given a configuration
              it cannot honour. Permanent, not transient: the fix is at the
              construction site, never a retry (ADR 0031).
            name: PolicyMisconfigured
            reexport: coretoken.PolicyMisconfigured
            type: "*kernelerrs.Error"
          - doc: |-
              IssueFailed is returned when an issuer cannot render the given claims —
              a claim the target format cannot express, or a signing fault.
            name: IssueFailed
            reexport: coretoken.IssueFailed
            type: "*kernelerrs.Error"
          - doc: |-
              ClaimNameInvalid is returned for a private claim name that is empty or
              shadows a registered one.
            name: ClaimNameInvalid
            reexport: coretoken.ClaimNameInvalid
            type: "*kernelerrs.Error"
          - doc: |-
              LifetimeTooLong is returned when an authenticated token's exp-iat span
              exceeds VerifierConfig.MaxLifetime.
            name: LifetimeTooLong
            reexport: coretoken.LifetimeTooLong
            type: "*kernelerrs.Error"
          - blank: true
            doc: |-
              HeaderUnsupported is returned for a header carrying a non-empty "crit",
              or a "typ" other than VerifierConfig.RequireType.
            name: HeaderUnsupported
            reexport: coretoken.HeaderUnsupported
            type: "*kernelerrs.Error"
          - doc: KeyNotFound is returned when a token's kid names no key in the set.
            name: KeyNotFound
            reexport: coretoken.KeyNotFound
            type: "*kernelerrs.Error"
          - doc: |-
              KeyIDMissing is returned when a set verifier is handed a token with no
              kid header.
            name: KeyIDMissing
            reexport: coretoken.KeyIDMissing
            type: "*kernelerrs.Error"
          - doc: |-
              KeyIDAmbiguous is returned when more keys share a kid than
              VerifierConfig.MaxKeyCandidates allows the verifier to try.
            name: KeyIDAmbiguous
            reexport: coretoken.KeyIDAmbiguous
            type: "*kernelerrs.Error"
          - doc: |-
              FooterMismatch is returned for a PASETO footer that is not the expected
              one, including a footer present where none was configured.
            name: FooterMismatch
            reexport: coretoken.FooterMismatch
            type: "*kernelerrs.Error"
          - doc: |-
              SchemeUnsupported is returned for a PASETO version+purpose this package
              does not implement — every local purpose, and every version but v4.
            name: SchemeUnsupported
            reexport: coretoken.SchemeUnsupported
            type: "*kernelerrs.Error"
          - doc: |-
              DuplicateMember is returned when a header or claims object repeats a
              member name (RFC 8725 §2.6).
            name: DuplicateMember
            reexport: coretoken.DuplicateMember
            type: "*kernelerrs.Error"
          - blank: true
            doc: |-
              JWKMalformed is returned by ParseJWK / ParseJWKSet for a document that is
              not the JSON shape RFC 7517 describes — invalid JSON, a key that is not an
              object, or a set whose "keys" is not an array.
            name: JWKMalformed
            reexport: corejwk.Malformed
            type: "*kernelerrs.Error"
          - doc: |-
              JWKMissingMember is returned for a key missing a member its declared type
              requires ("kty", "crv", "x", "y" or "k"), or a set missing "keys".
            name: JWKMissingMember
            reexport: corejwk.MissingMember
            type: "*kernelerrs.Error"
          - doc: |-
              JWKUnsupportedKeyType is returned for a "kty" other than EC, OKP or oct.
              RSA is refused here on purpose: the SDK verifies nothing with RSA.
            name: JWKUnsupportedKeyType
            reexport: corejwk.UnsupportedKeyType
            type: "*kernelerrs.Error"
          - doc: |-
              JWKUnsupportedCurve is returned for an unknown "crv", or a known one
              paired with the wrong "kty" (P-256 under OKP, Ed25519 under EC).
            name: JWKUnsupportedCurve
            reexport: corejwk.UnsupportedCurve
            type: "*kernelerrs.Error"
          - doc: |-
              JWKInvalidEncoding is returned for a member that is not unpadded
              base64url, or not the fixed length its curve mandates.
            name: JWKInvalidEncoding
            reexport: corejwk.InvalidEncoding
            type: "*kernelerrs.Error"
          - doc: |-
              JWKKeyMismatch is returned for well-encoded material that is not a key on
              the declared curve: an off-curve point, an out-of-range scalar, or a "d"
              that does not derive the declared public key.
            name: JWKKeyMismatch
            reexport: corejwk.KeyMismatch
            type: "*kernelerrs.Error"
      - alias:
          - doc: |-
              Algorithm is the public alias for the signature algorithm a token issuer or
              verifier is bound to.
            name: Algorithm
            target: coretoken.Algorithm
      - alias:
          - doc: Claims is the public alias for a token's immutable claim set.
            name: Claims
            target: coretoken.ClaimsValue
      - alias:
          - doc: Issuer is the public alias for the token-minting port.
            name: Issuer
            target: coretoken.Issuer
      - alias:
          - doc: Verifier is the public alias for the token-authenticating port.
            name: Verifier
            target: coretoken.Verifier
      - alias:
          - doc: IssuerConfig is the public alias for the JWT issuing policy.
            name: IssuerConfig
            target: svctoken.IssuerConfig
      - alias:
          - doc: VerifierConfig is the public alias for the JWT verification policy.
            name: VerifierConfig
            target: svctoken.VerifierConfig
      - alias:
          - doc: |-
              PasetoIssuerConfig is the public alias for the PASETO v4.public issuing
              policy. It is a separate type rather than [IssuerConfig] plus two extras
              because PASETO has no header parameters: there is nothing for a Type or a
              KeyID to set, and publishing knobs the format ignores is how a configuration
              field ends up doing nothing. Its equivalent of a "kid" is the Footer, which
              the signature covers.
            name: PasetoIssuerConfig
            target: svctoken.PasetoIssuerConfig
      - alias:
          - doc: |-
              PasetoVerifierConfig is the public alias for the PASETO v4.public
              verification policy. Same shape decision as its issuing counterpart: no
              RequireType, no MaxKeyCandidates, because PASETO has neither a "typ" to
              require nor a "kid" to select on.
            name: PasetoVerifierConfig
            target: svctoken.PasetoVerifierConfig
      - func:
          doc: NewClaims returns an empty claim set to build on with the With* methods.
          forward: coretoken.NewClaimsValue
          name: NewClaims
          out:
            - type: Claims
    functions:
      - doc: |-
          PrivateClaim decodes the named application claim of claims into T.

          It lives here rather than on the Claims value because "what shape is a scope
          claim" is the caller's question, not the domain's: the core value stores
          private claims as the exact JSON bytes the issuer signed, so re-encoding a
          decoded value can never change what was authenticated.

          The second result reports presence, which is how a claim explicitly set to
          JSON null is told apart from one that was never sent.
        in:
          - name: claims
            type: Claims
          - name: name
            type: string
        name: PrivateClaim
        out:
          - name: value
            type: T
          - name: found
