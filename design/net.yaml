apiVersion: kit.kitsunium/design/v2
domain: net
packages:
  - codes:
      - const:
          - doc: CodeListenFailed identifies a listener that could not be bound to its address.
            name: CodeListenFailed
            note: "range: 0.2.11.0 - 0.2.11.255"
            value: "0x00_02_0B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidAddress identifies a listen or dial address that is syntactically
              unusable (empty host and port, malformed socket path, negative port).
            name: CodeInvalidAddress
            value: "0x00_02_0B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedNetwork identifies a network name the domain does not serve
              (anything outside tcp, tcp4, tcp6, udp, udp4, udp6, unix, unixgram, unixpacket).
            name: CodeUnsupportedNetwork
            value: "0x00_02_0B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeServerClosed identifies work refused because the server already stopped
              accepting; it is the expected terminal outcome of a graceful shutdown.
            name: CodeServerClosed
            value: "0x00_02_0B_04"
        type: errs.Code
      - const:
          - doc: CodeAlreadyStarted identifies a Start call on a server that is already serving.
            name: CodeAlreadyStarted
            value: "0x00_02_0B_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotStarted identifies an operation that requires a running server on one
              that has not been started.
            name: CodeNotStarted
            value: "0x00_02_0B_06"
        type: errs.Code
      - const:
          - doc: CodeHandlerMissing identifies a listener group that was bound without a handler.
            name: CodeHandlerMissing
            value: "0x00_02_0B_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerPanic identifies a panic recovered inside a handler; the connection
              is closed but the process survives.
            name: CodeHandlerPanic
            value: "0x00_02_0B_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeConnLimitReached identifies a connection rejected because the group's
              concurrency ceiling was saturated.
            name: CodeConnLimitReached
            value: "0x00_02_0B_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeDrainTimeout identifies a shutdown whose drain budget expired with
              connections still in flight; the remainder is closed hard.
            name: CodeDrainTimeout
            value: "0x00_02_0B_0A"
        type: errs.Code
      - const:
          - doc: CodeGroupUnknown identifies a lookup for a listener group that was never declared.
            name: CodeGroupUnknown
            value: "0x00_02_0B_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeGroupDuplicate identifies a second declaration of an already-declared
              listener group name.
            name: CodeGroupDuplicate
            value: "0x00_02_0B_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeSocketAdoptFailed identifies an inherited socket that could not be adopted
              from the supervisor.
            name: CodeSocketAdoptFailed
            value: "0x00_02_0B_0D"
        type: errs.Code
      - const:
          - doc: CodePacketTooLarge identifies a datagram longer than the group's accepted size.
            name: CodePacketTooLarge
            value: "0x00_02_0B_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeTLSMaterialInvalid identifies TLS material that is absent, malformed, or
              yields no usable certificate; it is never downgraded to an empty trust store.
            name: CodeTLSMaterialInvalid
            value: "0x00_02_0B_0F"
        type: errs.Code
      - const:
          - doc: CodeTLSHandshakeFailed identifies a TLS or mTLS handshake that did not complete.
            name: CodeTLSHandshakeFailed
            value: "0x00_02_0B_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeRequestDenied identifies an outbound request refused by the transport
              policy before it left the process.
            name: CodeRequestDenied
            value: "0x00_02_0B_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeResponseTooLarge identifies a response body that exceeded the configured
              read ceiling.
            name: CodeResponseTooLarge
            value: "0x00_02_0B_12"
        type: errs.Code
      - const:
          - doc: CodeCallFailed identifies an outbound call that did not produce a response.
            name: CodeCallFailed
            value: "0x00_02_0B_13"
        type: errs.Code
      - const:
          - doc: CodeTooManyRedirects identifies an outbound call that exceeded its redirect budget.
            name: CodeTooManyRedirects
            value: "0x00_02_0B_14"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidDuration identifies a configuration duration that is neither a Go
              duration literal nor an integer nanosecond count.
            name: CodeInvalidDuration
            value: "0x00_02_0B_15"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsafePath identifies an outbound path carrying a dot segment, literal or
              percent-encoded. Such a path is refused before any allowlist pattern is tried,
              because an anchored pattern like ^/v1/supi/[^/]+$ happily matches "/v1/supi/.."
              which the upstream then normalises to a different resource.
            name: CodeUnsafePath
            value: "0x00_02_0B_16"
        type: errs.Code
      - const:
          - doc: |-
              CodeSSEFieldInvalid identifies a Server-Sent Events frame the wire format
              cannot carry: a line terminator inside an id, an event name or a comment
              (the format has no escape — a newline SPLITS a value, so an id carrying one
              would silently become a different id plus a stray field), a negative retry,
              a retry under one millisecond (the wire field is an integer millisecond
              count, and truncating to zero would say "reconnect immediately"), or a frame
              with no field set at all.
            name: CodeSSEFieldInvalid
            value: "0x00_02_0B_17"
        type: errs.Code
      - const:
          - doc: |-
              CodeSSEFlushUnsupported identifies a ResponseWriter that cannot be flushed.
              Server-Sent Events is a streaming format: without a flush every event sits in
              the transport buffer until the handler returns, which for an endless stream
              means the client receives nothing, ever.
            name: CodeSSEFlushUnsupported
            value: "0x00_02_0B_18"
        type: errs.Code
      - const:
          - doc: |-
              CodeSSEStreamClosed identifies a send on a stream that has already ended —
              the client disconnected, the server began draining, or the handler closed it.
            name: CodeSSEStreamClosed
            value: "0x00_02_0B_19"
        type: errs.Code
      - const:
          - doc: |-
              CodeSSEStreamMisconfigured identifies a stream option the domain refuses to
              interpret rather than guess at: a negative keep-alive interval or a negative
              per-write budget (ADR 0031).
            name: CodeSSEStreamMisconfigured
            value: "0x00_02_0B_1A"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSHandshakeFailed identifies an HTTP request that is not a valid RFC 6455
              opening handshake: wrong method, absent or non-"websocket" Upgrade token, a
              Connection header without "Upgrade", a Sec-WebSocket-Key that does not decode
              to sixteen bytes, a Sec-WebSocket-Version other than 13, or an Origin the
              server's policy refuses. The response is written before this is returned, so
              the handler has nothing left to answer.
            name: CodeWSHandshakeFailed
            value: "0x00_02_0B_1B"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSUpgradeUnsupported identifies a ResponseWriter whose connection cannot
              be taken over — an HTTP/2 request, or a middleware wrapper that hides
              http.Hijacker. WebSocket is not a response format: it replaces HTTP on the
              socket, so without the hijack there is nothing to upgrade.
            name: CodeWSUpgradeUnsupported
            value: "0x00_02_0B_1C"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSProtocolViolation identifies a frame RFC 6455 forbids: an unmasked
              client frame (§5.1), a set reserved bit or reserved opcode (§5.2), a
              fragmented or oversized control frame (§5.5), a non-minimal length encoding
              (§5.2), a continuation with no message in progress or a new data frame
              interrupting one (§5.4), or a malformed close payload (§5.5.1). Each fails
              the connection.
            name: CodeWSProtocolViolation
            value: "0x00_02_0B_1D"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSMessageTooLarge identifies a frame or an accumulated message beyond the
              connection's configured ceiling. The frame's announced length is checked
              BEFORE any buffer is sized from it, because a 64-bit length field a peer
              chooses is an out-of-memory condition one allocation away.
            name: CodeWSMessageTooLarge
            value: "0x00_02_0B_1E"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSInvalidPayload identifies a payload the protocol cannot carry: a text
              message or close reason that is not valid UTF-8 (§8.1), a close code that
              must never appear on the wire (1004, 1005, 1006, 1015 and the unallocated
              ranges — §7.4.2), or a close reason past the control-frame ceiling.
            name: CodeWSInvalidPayload
            value: "0x00_02_0B_1F"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSConnClosed identifies an operation on a connection that has ended — the
              peer sent Close, the server began draining, the handler closed it, or the
              socket died. It is the terminal outcome a receive loop runs until.
            name: CodeWSConnClosed
            value: "0x00_02_0B_20"
        type: errs.Code
      - const:
          - doc: |-
              CodeWSConnMisconfigured identifies a connection option the domain refuses to
              interpret rather than guess at: a negative ping interval or write budget, or
              a non-positive size ceiling (ADR 0031).
            name: CodeWSConnMisconfigured
            value: "0x00_02_0B_21"
        type: errs.Code
      - const:
          - doc: |-
              CodeStaticMisconfigured identifies a static file handler refused at
              construction: no file tree to serve, a security header value the handler
              will not send, or a Referrer-Policy token no browser recognises (ADR 0130).
            name: CodeStaticMisconfigured
            value: "0x00_02_0B_22"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopTLSUnsupported identifies a loop group given a TLS identity: the
              loop engine speaks plaintext only, and the SDK owns no TLS stack it could
              drive without a blocking net.Conn (ADR 0186 §D2).
            name: CodeLoopTLSUnsupported
            value: "0x00_02_0B_23"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopOptionUnsupported identifies an option a group cannot honour on its
              engine: Loop on a group not served by a loop handler, BatchReplies on a
              stream group (ADR 0192), or, on a loop group, Use or an option neither the
              engine nor the handler honours (ADR 0186 §D1).
            name: CodeLoopOptionUnsupported
            value: "0x00_02_0B_24"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopBackendUnavailable identifies an explicit loop backend the running
              kernel's probe refused, on a platform that has the mechanic (ADR 0186 §D5).
            name: CodeLoopBackendUnavailable
            value: "0x00_02_0B_25"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopNoDescriptors identifies a loop group refused at Start because the
              effective RLIMIT_NOFILE is zero or unreadable, which leaves no descriptor
              for a ring's table or a connection (ADR 0186 §D5).
            name: CodeLoopNoDescriptors
            value: "0x00_02_0B_26"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopStaleRef identifies an operation on a connection reference whose
              generation has ended: the connection closed, and its slot may already
              serve another one.
            name: CodeLoopStaleRef
            value: "0x00_02_0B_27"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopOutputFull identifies a write refused because the connection's
              output, or the loop's global output budget, is at its ceiling.
            name: CodeLoopOutputFull
            value: "0x00_02_0B_28"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopSpillFull identifies an unconsumed tail that does not fit the
              connection's spill, or the loop's global spill budget.
            name: CodeLoopSpillFull
            value: "0x00_02_0B_29"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopPostQueueFull identifies a Post refused because the loop's
              preallocated queue of posted operations is full.
            name: CodeLoopPostQueueFull
            value: "0x00_02_0B_2A"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopWrongThread identifies a loop operation called from a thread other
              than the loop's own, detected under the loopdebug build tag.
            name: CodeLoopWrongThread
            value: "0x00_02_0B_2B"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerAlreadySet identifies a second handler declaration on one stream
              group — Handle, HandleFunc, HandleHTTP or HandleLoop, in any order — which
              does not replace the first (ADR 0186 §D1).
            name: CodeHandlerAlreadySet
            value: "0x00_02_0B_2C"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1RequestMalformed identifies a request the restricted HTTP/1.1
              profile refuses for its syntax: a bare CR or LF, a NUL or other control byte
              in a value, obs-fold, whitespace before a colon, a name outside tchar, or a
              request line that is not method, target and HTTP/1.1 (ADR 0186 §D6).
            name: CodeHTTP1RequestMalformed
            value: "0x00_02_0B_2D"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1TransferEncoding identifies a request carrying a
              Transfer-Encoding field, chunked or not: the profile frames by Content-Length
              alone, so it carries no chunked body and no trailer.
            name: CodeHTTP1TransferEncoding
            value: "0x00_02_0B_2E"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1ContentLengthInvalid identifies a Content-Length the profile cannot
              frame by: empty, not decimal digits, too long, or present twice, equal or not.
            name: CodeHTTP1ContentLengthInvalid
            value: "0x00_02_0B_2F"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1FieldDuplicated identifies a second Authorization or Host field in
              one request.
            name: CodeHTTP1FieldDuplicated
            value: "0x00_02_0B_30"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1ExpectRefused identifies a request carrying an Expect field: the
              profile sends no interim response, so 100-continue cannot be met.
            name: CodeHTTP1ExpectRefused
            value: "0x00_02_0B_31"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1HeadTooLarge identifies a request head past the profile's head
              bound or its field-line count.
            name: CodeHTTP1HeadTooLarge
            value: "0x00_02_0B_32"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1TargetTooLong identifies a request-target past the profile's target
              bound.
            name: CodeHTTP1TargetTooLong
            value: "0x00_02_0B_33"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1BodyTooLarge identifies a Content-Length past the profile's body
              bound.
            name: CodeHTTP1BodyTooLarge
            value: "0x00_02_0B_34"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1MethodUnsupported identifies a CONNECT request: the profile opens no
              tunnel.
            name: CodeHTTP1MethodUnsupported
            value: "0x00_02_0B_35"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1ResponseInvalid identifies a response the profile's writer refuses
              to put on the wire: a status outside 200 to 999, a body on a 204 or a 304, a
              field name that is not a token or that the codec writes itself, or a field
              value with a control byte.
            name: CodeHTTP1ResponseInvalid
            value: "0x00_02_0B_36"
        type: errs.Code
      - const:
          - doc: |-
              CodeHTTP1Misconfigured identifies profile limits the codec refuses to
              interpret: a negative bound, or one past its maximum.
            name: CodeHTTP1Misconfigured
            value: "0x00_02_0B_37"
        type: errs.Code
      - const:
          - doc: |-
              CodeEngineUnsupported identifies an Engine a group cannot run on: one its
              handler's type has no such engine for, one another option contradicts, or a
              value outside the engine constants (ADR 0187).
            name: CodeEngineUnsupported
            value: "0x00_02_0B_38"
        type: errs.Code
      - const:
          - doc: |-
              CodePlaintextWithTLS identifies a group given both Plaintext and TLS: the
              group cannot both refuse and serve TLS (ADR 0187).
            name: CodePlaintextWithTLS
            value: "0x00_02_0B_39"
        type: errs.Code
      - const:
          - doc: |-
              CodeGroupNameConflict identifies a Name option that contradicts the name the
              group was declared with, or names nothing (ADR 0187).
            name: CodeGroupNameConflict
            value: "0x00_02_0B_3A"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopGroupStalled identifies a loop group every ring of which the watchdog
              drained while the server was serving (ADR 0188).
            name: CodeLoopGroupStalled
            value: "0x00_02_0B_3B"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopCapabilityRefused identifies a LoopValue.Capabilities entry the loop
              cannot opt into: an engine, a class B capability or an unknown token
              (ADR 0189).
            name: CodeLoopCapabilityRefused
            value: "0x00_02_0B_3C"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopMiddlewareInvalid identifies a loop middleware whose layer does not
              forward every callback to the handler it wraps.
            name: CodeLoopMiddlewareInvalid
            value: "0x00_02_0B_3D"
        type: errs.Code
      - const:
          - doc: |-
              CodeProtocolsRefused identifies a Protocols option, or a TLS identity's
              NextProtos, that an HTTP group cannot serve.
            name: CodeProtocolsRefused
            value: "0x00_02_0B_3E"
        type: errs.Code
      - const:
          - doc: |-
              CodeLoopOutboundFull identifies a job refused because the lane's queue to its
              worker is full.
            name: CodeLoopOutboundFull
            value: "0x00_02_0B_3F"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerAmbiguous identifies a handler the simple API cannot assign to one engine: it implements both interfaces of its entry and no Engine chooses.
            name: CodeHandlerAmbiguous
            value: "0x00_02_0B_40"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandlerUnsupported identifies a handler no engine of the simple API's entry serves.
            name: CodeHandlerUnsupported
            value: "0x00_02_0B_41"
        type: errs.Code
      - const:
          - doc: |-
              CodePlaintextRequired identifies an HTTP group given neither TLS nor Plaintext.
            name: CodePlaintextRequired
            value: "0x00_02_0B_42"
        type: errs.Code
      - const:
          - doc: |-
              CodePacketOptionUnsupported identifies an option a datagram group cannot honour.
            name: CodePacketOptionUnsupported
            value: "0x00_02_0B_43"
        type: errs.Code
    constants:
      - blockDoc: The loop backends. The zero value is LoopBackendAuto.
        doc: |-
          LoopBackendAuto takes the best backend the platform's probe reaches:
          io_uring, then epoll on Linux, the portable backend elsewhere.
        name: LoopBackendAuto
        type: LoopBackend
        value: "0"
      - blockDoc: The loop backends. The zero value is LoopBackendAuto.
        doc: |-
          LoopBackendIOURing is io_uring, on linux/amd64, arm64, riscv64 and loong64,
          after the kernel's staged probe.
        name: LoopBackendIOURing
        type: LoopBackend
        value: "1"
      - blockDoc: The loop backends. The zero value is LoopBackendAuto.
        doc: |-
          LoopBackendEpoll is epoll, on every Linux architecture.
        name: LoopBackendEpoll
        type: LoopBackend
        value: "2"
      - blockDoc: The loop backends. The zero value is LoopBackendAuto.
        doc: |-
          LoopBackendPortable is the default engine's accept path and goroutines,
          serialised onto one handler goroutine, on every platform.
        name: LoopBackendPortable
        type: LoopBackend
        value: "3"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionNone names no option; it is the zero value.
        name: OptionNone
        type: OptionKind
        value: "0"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionTLS is TLS. A loop group always refuses it, with LoopTLSUnsupported.
        name: OptionTLS
        type: OptionKind
        value: "1"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionMiddleware is Use. A loop group always refuses it: there is no
          ConnHandler to decorate.
        name: OptionMiddleware
        type: OptionKind
        value: "2"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionReadTimeout is ReadTimeout.
        name: OptionReadTimeout
        type: OptionKind
        value: "3"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionWriteTimeout is WriteTimeout.
        name: OptionWriteTimeout
        type: OptionKind
        value: "4"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionIdleTimeout is IdleTimeout. The loop engine honours it.
        name: OptionIdleTimeout
        type: OptionKind
        value: "5"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionReadHeaderTimeout is ReadHeaderTimeout, which only a protocol adapter
          can honour.
        name: OptionReadHeaderTimeout
        type: OptionKind
        value: "6"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionMaxHeaderBytes is MaxHeaderBytes, which only a protocol adapter can
          honour.
        name: OptionMaxHeaderBytes
        type: OptionKind
        value: "7"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionHandshakeTimeout is HandshakeTimeout.
        name: OptionHandshakeTimeout
        type: OptionKind
        value: "8"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionReadBufferSize is ReadBufferSize.
        name: OptionReadBufferSize
        type: OptionKind
        value: "9"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionMaxPacketSize is MaxPacketSize.
        name: OptionMaxPacketSize
        type: OptionKind
        value: "10"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionBatchSize is BatchSize.
        name: OptionBatchSize
        type: OptionKind
        value: "11"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionShards is Shards.
        name: OptionShards
        type: OptionKind
        value: "12"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionMaxConns is MaxConns. The loop engine honours it, refusing with
          ConnLimitReached.
        name: OptionMaxConns
        type: OptionKind
        value: "13"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionAdopt is Adopt. The loop engine honours it.
        name: OptionAdopt
        type: OptionKind
        value: "14"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionPreHandshake is PreHandshake.
        name: OptionPreHandshake
        type: OptionKind
        value: "15"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionPlaintext is Plaintext. Every engine honours it; with TLS it is refused
          with PlaintextWithTLS.
        name: OptionPlaintext
        type: OptionKind
        value: "16"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: OptionName is Name. Every engine honours it.
        name: OptionName
        type: OptionKind
        value: "17"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionEngine is Engine. Every engine honours it, or refuses the group with
          EngineUnsupported.
        name: OptionEngine
        type: OptionKind
        value: "18"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionLoopMiddleware is UseLoop. The loop engine honours it; every group no
          loop handler serves refuses it with LoopOptionUnsupported.
        name: OptionLoopMiddleware
        type: OptionKind
        value: "19"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionBatchReplies is BatchReplies. A datagram group honours it; a stream
          group, goroutine or loop, refuses it with LoopOptionUnsupported (ADR 0192).
        name: OptionBatchReplies
        type: OptionKind
        value: "20"
      - blockDoc: The group options a loop group judges at Start, by kind.
        doc: |-
          OptionProtocols is Protocols. Only an HTTP group served by net/http
          honours it; a loop group refuses it with LoopOptionUnsupported, and any
          other group with ProtocolsRefused.
        name: OptionProtocols
        type: OptionKind
        value: "21"
      - blockDoc: The engine families a group may name with Engine. The zero value is EngineAuto.
        doc: |-
          EngineAuto lets the group's handler type choose its engine (ADR 0187): a loop
          handler runs on the loop engine, every other handler on the goroutine engine.
        name: EngineAuto
        type: EngineValue
        value: "0"
      - blockDoc: The engine families a group may name with Engine. The zero value is EngineAuto.
        doc: |-
          EngineGoroutine is the default engine: one goroutine per connection on the
          runtime's netpoller. It serves Handle, HandleFunc and HandleHTTP.
        name: EngineGoroutine
        type: EngineValue
        value: "1"
      - blockDoc: The engine families a group may name with Engine. The zero value is EngineAuto.
        doc: |-
          EngineLoop is the loop engine of ADR 0186. It serves HandleLoop; Loop picks its
          backend.
        name: EngineLoop
        type: EngineValue
        value: "2"
      - blockDoc: The engines an operator may switch off with KITSUNIUM_NET_DISABLE (ADR 0188).
        doc: |-
          CapabilityIOURing is io_uring, the top of the lattice. Switched off, or capped
          below, no loop group calls io_uring_setup.
        name: CapabilityIOURing
        type: Capability
        value: "\"iouring\""
      - blockDoc: The engines an operator may switch off with KITSUNIUM_NET_DISABLE (ADR 0188).
        doc: |-
          CapabilityEpoll is epoll, below io_uring. Switched off, a loop group that would
          have fallen back to it runs on the portable backend.
        name: CapabilityEpoll
        type: Capability
        value: "\"epoll\""
      - blockDoc: The floors of the lattice, which KITSUNIUM_NET_ENGINE may name and nothing switches off (ADR 0188).
        doc: |-
          CapabilityPortable is the portable loop backend, the loop family's floor on
          every platform, and what an unknown token caps the engine at.
        name: CapabilityPortable
        type: Capability
        value: "\"portable\""
      - blockDoc: The floors of the lattice, which KITSUNIUM_NET_ENGINE may name and nothing switches off (ADR 0188).
        doc: |-
          CapabilityGoroutine is the goroutine engine, the bottom of the lattice. A loop
          handler capped at it runs on the portable backend, the lowest engine that can
          serve one.
        name: CapabilityGoroutine
        type: Capability
        value: "\"goroutine\""
      - blockDoc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingMultishotRecv is io_uring's multishot receive. Switched off,
          every receive is single-shot and re-armed after each completion.
        name: CapabilityURingMultishotRecv
        type: Capability
        value: "\"uring-multishot-recv\""
      - blockDoc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingPbuf is io_uring's provided-buffer ring. The io_uring backend
          receives into nothing else: switched off, io_uring is never set up and the group
          runs on epoll.
        name: CapabilityURingPbuf
        type: Capability
        value: "\"uring-pbuf\""
      - blockDoc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingDirect is io_uring's direct descriptors, chosen when the release
          check passes (a kernel from 6.13). Switched off, connections live in the process
          table and the release check does not run.
        name: CapabilityURingDirect
        type: Capability
        value: "\"uring-direct\""
      - blockDoc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityEpollExclusive is EPOLLEXCLUSIVE on every loop's listener
          registration. Switched off, every loop's epoll is woken by each connection.
        name: CapabilityEpollExclusive
        type: Capability
        value: "\"epoll-exclusive\""
      - blockDoc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityTCPNoDelay is TCP_NODELAY on the listeners a loop group accepts on,
          inherited by every accepted socket. Switched off, it is not set.
        name: CapabilityTCPNoDelay
        type: Capability
        value: "\"tcp-nodelay\""
      - blockDoc: The class A-code capabilities, opt-in, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingDeferTaskrun is IORING_SETUP_DEFER_TASKRUN with SINGLE_ISSUER on
          the ring a loop's thread waits on; the other rings keep COOP_TASKRUN.
        name: CapabilityURingDeferTaskrun
        type: Capability
        value: "\"uring-defer-taskrun\""
      - blockDoc: The class A-code capabilities, opt-in, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingNoSQArray is IORING_SETUP_NO_SQARRAY: the SQ indexes the SQEs
          directly, with no indirection array.
        name: CapabilityURingNoSQArray
        type: Capability
        value: "\"uring-no-sqarray\""
      - blockDoc: The class A-code capabilities, opt-in, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingRingFDs registers each ring's descriptor with its thread
          (IORING_REGISTER_RING_FDS), at most 16 a thread, and unregisters it before the
          ring closes.
        name: CapabilityURingRingFDs
        type: Capability
        value: "\"uring-ring-fds\""
      - blockDoc: The class A-code capabilities, opt-in, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
        doc: |-
          CapabilityURingSQRewind is IORING_SETUP_SQ_REWIND with NO_SQARRAY: every
          submission is filled from SQE 0. It needs the kernel 7.0 lane before it may
          leave class A-code.
        name: CapabilityURingSQRewind
        type: Capability
        value: "\"uring-sq-rewind\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityURingSendZC is io_uring's zero-copy send.
        name: CapabilityURingSendZC
        type: Capability
        value: "\"uring-send-zc\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityURingBundle is io_uring's receive and send bundles.
        name: CapabilityURingBundle
        type: Capability
        value: "\"uring-bundle\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityURingPbufInc is the incrementally consumed buffer ring
          (IOU_PBUF_RING_INC).
        name: CapabilityURingPbufInc
        type: Capability
        value: "\"uring-pbuf-inc\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityBusyPoll is busy polling of the network device's queue.
        name: CapabilityBusyPoll
        type: Capability
        value: "\"busy-poll\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityURingZCRX is io_uring's zero-copy receive.
        name: CapabilityURingZCRX
        type: Capability
        value: "\"uring-zcrx\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityReuseportCBPF is a classic BPF program steering SO_REUSEPORT
          connections to their loop.
        name: CapabilityReuseportCBPF
        type: Capability
        value: "\"reuseport-cbpf\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityTCPDeferAccept is TCP_DEFER_ACCEPT on the listeners.
        name: CapabilityTCPDeferAccept
        type: Capability
        value: "\"tcp-defer-accept\""
      - blockDoc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
        doc: |-
          CapabilityURingMinTimeout is io_uring's minimum wait (min_wait_usec), only where
          the kernel advertises IORING_FEAT_MIN_TIMEOUT.
        name: CapabilityURingMinTimeout
        type: Capability
        value: "\"uring-min-timeout\""
      - doc: |-
          EnvEngine is the variable that caps every group's engine at one capability of
          the lattice: min(code, environment), never above the code's choice.
        name: EnvEngine
        type: string
        value: "\"KITSUNIUM_NET_ENGINE\""
      - doc: |-
          EnvDisable is the variable that switches engines off, a comma-separated list of
          capabilities the operator may switch off.
        name: EnvDisable
        type: string
        value: "\"KITSUNIUM_NET_DISABLE\""
      - doc: |-
          LoopsAuto, set as LoopValue.Loops, runs one loop per GOMAXPROCS, read once at
          Start: a snapshot that a later change of GOMAXPROCS does not move. It is a
          sentinel, never the zero value, which is one loop (ADR 0187 §D9); State
          reports the count and "auto" as its source.
        name: LoopsAuto
        type: int
        value: "-1"
      - doc: |-
          HTTP1MaxFields is how many field lines one request of the restricted
          HTTP/1.1 profile may carry. It sizes HTTP1RequestValue.Fields, so a request is
          framed into a fixed array and never into a slice that grows: one more line is
          refused (431), never stored elsewhere.
        name: HTTP1MaxFields
        type: int
        value: "64"
      - doc: |-
          HTTP1MaxSubject is the longest subject an HTTP1AuthValue holds, in bytes. It
          sizes the value's array, so a subject is copied into the request and never
          aliases the bytes it was read from; a longer one is refused.
        name: HTTP1MaxSubject
        type: int
        value: "128"
      - doc: |-
          HTTP1MaxAccessFields is how many request fields an access-log link may
          allow: it sizes HTTP1AccessValue.Fields, so a record is a value and never a
          slice that grows.
        name: HTTP1MaxAccessFields
        type: int
        value: "8"
      - doc: |-
          HTTP1DefaultHead is the head bound a zero HTTP1LimitsValue.Head selects: the
          request line, every field line and the blank line that ends them, in bytes.
        name: HTTP1DefaultHead
        type: int
        value: "8192"
      - doc: HTTP1MaxHead is the largest head bound HTTP1LimitsValue.Head may ask for.
        name: HTTP1MaxHead
        type: int
        value: "65536"
      - doc: |-
          HTTP1DefaultTarget is the request-target bound a zero HTTP1LimitsValue.Target
          selects, in bytes.
        name: HTTP1DefaultTarget
        type: int
        value: "2048"
      - doc: |-
          HTTP1DefaultBody is the Content-Length bound a zero HTTP1LimitsValue.Body
          selects: one mebibyte.
        name: HTTP1DefaultBody
        type: int64
        value: 1 << 20
      - doc: |-
          HTTP1MaxBody is the largest Content-Length bound HTTP1LimitsValue.Body may
          ask for: one gibibyte, which ten decimal digits always hold.
        name: HTTP1MaxBody
        type: int64
        value: 1 << 30
      - doc: |-
          HTTP1MaxContentLengthDigits is how many digits a Content-Length may carry,
          leading zeros included. Ten digits hold HTTP1MaxBody and stay far from the
          int64 limit, so the value is accumulated with no overflow to check: a longer
          field is refused before it is read.
        name: HTTP1MaxContentLengthDigits
        type: int
        value: "10"
      - blockDoc: The lifecycle phases, in the order a server passes through them.
        doc: PhaseNew is a constructed server that has not bound anything yet.
        name: PhaseNew
        type: Phase
        value: "0"
      - blockDoc: The lifecycle phases, in the order a server passes through them.
        doc: PhaseStarting is binding listeners; some may already be up.
        name: PhaseStarting
        type: Phase
        value: "1"
      - blockDoc: The lifecycle phases, in the order a server passes through them.
        doc: PhaseServing is bound and accepting.
        name: PhaseServing
        type: Phase
        value: "2"
      - blockDoc: The lifecycle phases, in the order a server passes through them.
        doc: PhaseDraining has stopped accepting and is waiting for in-flight work.
        name: PhaseDraining
        type: Phase
        value: "3"
      - blockDoc: The lifecycle phases, in the order a server passes through them.
        doc: PhaseStopped has released every listener.
        name: PhaseStopped
        type: Phase
        value: "4"
      - doc: |-
          SSEContentType is the media type an event stream must be served under. A
          client that receives anything else does not start an EventSource at all.
        name: SSEContentType
        type: string
        value: "\"text/event-stream\""
      - doc: |-
          SSEMinRetry is the smallest reconnection hint the wire can carry. The retry
          field is an integer MILLISECOND count, so anything shorter rounds to zero —
          and zero does not mean "a very short delay", it means "reconnect at once".
        name: SSEMinRetry
        type: time.Duration
        value: "1000000"
      - doc: |-
          SSELastEventIDHeader is the request header a reconnecting client sends,
          carrying the id of the last event it processed.
        name: SSELastEventIDHeader
        type: string
        value: "\"Last-Event-ID\""
      - doc: |-
          WSGUID is the fixed string RFC 6455 §1.3 concatenates to Sec-WebSocket-Key
          before hashing. It is a constant of the protocol, not a secret and not a
          parameter: its only job is to make the accept value impossible to produce by
          echoing the request, so a cache or a naive proxy cannot fake an upgrade.
        name: WSGUID
        type: string
        value: "\"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\""
      - doc: |-
          WSVersion is the only protocol version this domain speaks (RFC 6455 §4.1).
          A request naming any other version is refused WITH this value advertised
          back, which is what lets a client renegotiate instead of guessing.
        name: WSVersion
        type: string
        value: "\"13\""
      - doc: |-
          WSKeyLen is how many bytes Sec-WebSocket-Key decodes to (RFC 6455 §4.1).
          A key of any other length is not a WebSocket handshake, whatever it decodes.
        name: WSKeyLen
        type: int
        value: "16"
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: WSKeyHeader carries the client's 16 random bytes, base64-encoded.
        name: WSKeyHeader
        type: string
        value: "\"Sec-WebSocket-Key\""
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: WSAcceptHeader carries the server's proof it understood the handshake.
        name: WSAcceptHeader
        type: string
        value: "\"Sec-WebSocket-Accept\""
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: |-
          WSVersionHeader carries the client's version, and the server's
          counter-offer when it refuses one.
        name: WSVersionHeader
        type: string
        value: "\"Sec-WebSocket-Version\""
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: WSProtocolHeader carries the subprotocol list, then the single choice.
        name: WSProtocolHeader
        type: string
        value: "\"Sec-WebSocket-Protocol\""
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: |-
          WSExtensionsHeader carries the extension offer. This domain negotiates
          none, so it is never echoed — see the package CLAUDE.md.
        name: WSExtensionsHeader
        type: string
        value: "\"Sec-WebSocket-Extensions\""
      - blockDoc: |-
          The handshake headers, spelled once so no caller mistypes one into a silent
          miss.
        doc: WSUpgradeToken is the token both Upgrade headers must carry.
        name: WSUpgradeToken
        type: string
        value: "\"websocket\""
      - doc: |-
          WSMaxControlPayload is the ceiling RFC 6455 §5.5 puts on a control frame's
          payload. It exists so an endpoint can answer a Ping without buffering: a
          control frame is answered inline, between the fragments of a message, so it
          must fit in a fixed buffer that is always available.
        name: WSMaxControlPayload
        type: int
        value: "125"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: WSCloseNormal is a completed purpose, on either side.
        name: WSCloseNormal
        type: WSCloseCode
        value: "1000"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseGoingAway is a server shutting down or a browser navigating away.
          It is what a drain sends.
        name: WSCloseGoingAway
        type: WSCloseCode
        value: "1001"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: WSCloseProtocolError is a frame the RFC forbids.
        name: WSCloseProtocolError
        type: WSCloseCode
        value: "1002"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseUnsupportedData is a well-formed frame carrying data this endpoint
          cannot accept — binary to a text-only peer, for instance.
        name: WSCloseUnsupportedData
        type: WSCloseCode
        value: "1003"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseNoStatus means the peer's Close frame carried no code. It is
          reported to the application and never sent.
        name: WSCloseNoStatus
        type: WSCloseCode
        value: "1005"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseAbnormal means the connection died without a Close frame. It is
          reported to the application and never sent.
        name: WSCloseAbnormal
        type: WSCloseCode
        value: "1006"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseInvalidPayload is a text frame that is not valid UTF-8, or a close
          reason that is not.
        name: WSCloseInvalidPayload
        type: WSCloseCode
        value: "1007"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: WSClosePolicyViolation is the generic refusal when no other code fits.
        name: WSClosePolicyViolation
        type: WSCloseCode
        value: "1008"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: WSCloseTooLarge is a message beyond what this endpoint accepts.
        name: WSCloseTooLarge
        type: WSCloseCode
        value: "1009"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseExtensionRequired is a client giving up because the server did not
          negotiate an extension it needs. A server never sends it.
        name: WSCloseExtensionRequired
        type: WSCloseCode
        value: "1010"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: WSCloseInternalError is an unexpected condition on this side.
        name: WSCloseInternalError
        type: WSCloseCode
        value: "1011"
      - blockDoc: |-
          The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
          WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
          OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
          close frame, so sending one would be a statement contradicted by its own
          delivery.
        doc: |-
          WSCloseTLSHandshake means the TLS handshake failed. It is reported to the
          application and never sent — there is no connection to send it on.
        name: WSCloseTLSHandshake
        type: WSCloseCode
        value: "1015"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSContinuation continues the message the previous frame began.
        name: WSContinuation
        type: WSOpCode
        value: "0x0"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSText carries a UTF-8 payload, validated on both sides.
        name: WSText
        type: WSOpCode
        value: "0x1"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSBinary carries opaque bytes.
        name: WSBinary
        type: WSOpCode
        value: "0x2"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSClose begins or completes the closing handshake.
        name: WSClose
        type: WSOpCode
        value: "0x8"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSPing asks the peer to answer with a Pong carrying the same payload.
        name: WSPing
        type: WSOpCode
        value: "0x9"
      - blockDoc: |-
          The opcodes RFC 6455 defines. Everything else in the four-bit space is
          reserved, and a reserved opcode fails the connection rather than being
          skipped: an endpoint that ignored it would be desynchronised from a peer that
          believes the frame meant something.
        doc: WSPong answers a Ping, or is sent unsolicited as a one-way heartbeat.
        name: WSPong
        type: WSOpCode
        value: "0xA"
    doc: |-
      Package net — the listen address value.

      Package net — the completed-call observation record.

      Package net — the outbound client configuration.

      Package net — range 0.2.11.* (ADR 0029 core/net block).

      Package net — the accepted stream connection port.

      Package net — the shutdown signal a long-lived handler observes.

      Package net — the configuration-friendly duration value.

      Package net — declares the sentinel *errs.Error outcomes of the network
      domain. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE form.
      Service implementations and the pkg/v1 facades wrap these sentinels; they
      declare no codes of their own (the ADR 0016 proc precedent).

      Package net — compile-time interface assertions, kept out of the production
      source per KTN-IFACE-ASSERT-PLACEMENT.

      Package net — the opaque, redacting TLS identity value.

      Package net — the on-disk TLS material description.

      Package net — the TLS identity construction parameters.

      Package net — the per-group resource ceilings.

      Package net — the loop engine's contract: the connection reference, the
      posted operation, the option kinds a loop group judges, and the ports a loop
      and its handler implement (ADR 0186 §D4).

      Package net — a loop group's reported state: the backend it runs on, how it
      got there, and its rings' counters.

      Package net — the loop engine's configuration value and its backends.

      Package net — TLS material parsing helpers shared by NewIdentity.

      Package net — the generic handler decorator.

      Package net — the received datagram port.

      Package net — the server lifecycle phase.

      Package net — the outbound authorisation port.

      Package net — compile-time interface assertions, kept out of the production
      source per KTN-IFACE-ASSERT-PLACEMENT.

      Package net — the completed outbound response value.

      Package net — the Server-Sent Events frame: the value a stream sends and the
      rules a frame must satisfy to be carried at all. Writing it — the encoder
      that splits Data into data lines, and the comment frame — is
      internal/service/net/sse's (ADR 0160 §4).

      Package net — the server's reported state.

      Package net — the per-phase deadlines.

      Package net — the WebSocket protocol's vocabulary (RFC 6455): the opening
      handshake's constants and the control-frame ceiling. Reading and writing the
      protocol — the handshake's key check and digest, the frame codec, the close
      payload, the UTF-8 check — is internal/service/net/websocket's (ADR 0160 §4).

      Package net — the WebSocket close code (RFC 6455 §7.4) and the predicates
      that govern it in both directions. The close payload's wire form is
      internal/service/net/websocket's (ADR 0160 §4).

      Package net — the WebSocket application message (RFC 6455 §5.6). Its UTF-8
      rule (§8.1) is checked by the engine on the bytes, as they come off and go
      onto the wire: internal/service/net/websocket.ValidateText (ADR 0160 §4).

      Package net — the WebSocket frame opcode (RFC 6455 §5.2).

      Package net — shared sentinel-wrapping helper.
    functions:
      - doc: |-
          WithDrainSignal returns ctx carrying the channel a server closes when it
          begins draining.

          A request context is deliberately NOT what carries this. Cancelling it would
          tell every in-flight handler to abandon the response it is halfway through,
          which is the opposite of a graceful drain — the drain exists so those
          responses finish. This signal is additive: a handler that ignores it behaves
          exactly as before, and a handler that holds a connection open indefinitely —
          an event stream, a long poll — gets the one piece of information it cannot
          otherwise have, namely that finishing now is the cooperative thing to do.

          The channel is closed, never sent on, so every observer sees it and a late
          observer sees it immediately.
        in:
          - name: ctx
            type: context.Context
          - name: draining
            type: <-chan struct{}
        name: WithDrainSignal
        out:
          - type: context.Context
      - doc: |-
          DrainSignal returns the drain channel carried by ctx, or nil when the server
          serving this request publishes none.

          A nil channel is the right absence: receiving from it blocks forever, so a
          select that watches it alongside other cases simply never fires that case.
          A caller therefore needs no nil check.
        in:
          - name: ctx
            type: context.Context
        name: DrainSignal
        out:
          - type: <-chan struct{}
      - doc: |-
          NewIdentityValue validates in-memory TLS material and returns the opaque identity.
          It fails loudly where the standard library is silent: a CA bundle that yields
          no usable certificate is TLSMaterialInvalid, never an empty pool that would
          verify nothing.
        in:
          - name: p
            type: IdentityParams
        name: NewIdentityValue
        out:
          - name: id
            type: IdentityValue
          - name: err
            type: error
      - doc: |-
          NewLoopLayer returns the base of a loop middleware's layer over next: the
          LoopLayer a layer embeds, forwarding every callback to next.
        in:
          - name: next
            type: LoopHandler
        name: NewLoopLayer
        out:
          - type: LoopLayer
      - doc: |-
          Chain applies middlewares to a handler, outermost first.

          Chain(h, a, b, c) yields a(b(c(h))): the first middleware listed is the first
          to see a connection. That ordering matches how the list reads on the page,
          which is the only ordering a reader will guess correctly.
        in:
          - name: h
            type: H
          - name: middlewares
            type: Middleware[H]
        name: Chain
        out:
          - type: H
        typeParams:
          - constraint: any
            name: H
        variadic: true
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      stdnet: net
      time: time
      tls: crypto/tls
    path: github.com/kitsunium/sdk/internal/core/net
    ports:
      - doc: |-
          Conn is one accepted stream connection.

          It embeds stdlib net.Conn, so a handler reads and writes it exactly as it
          would any socket and every io helper keeps working — io.Copy, bufio, encoding
          wrappers, crypto/tls. Everything the domain adds is additive, which is what
          keeps "plug a handler in" a four-line exercise.

          A Conn is pooled and recycled once ServeConn returns. A handler MUST NOT
          retain it, nor the slice returned by Buffer, past that point — the same
          contract the logger's builder already carries.

          IFACE-PLUGIN: the concrete type stays unexported in internal/service/net/server.
        embeds:
          - stdnet.Conn
        methods:
          - doc: |-
              ID returns the monotonic identifier assigned at accept time, for
              correlating log lines belonging to one connection.
            name: ID
            out:
              - type: uint64
          - doc: |-
              Group returns the name of the listener group that accepted this
              connection, so one handler serving several groups can tell them apart.
            name: Group
            out:
              - type: string
          - doc: |-
              Buffer returns a connection-scoped scratch buffer sized by the group's
              read-buffer limit. It is recycled with the connection, which is what lets
              a handler read without allocating per connection.
            name: Buffer
            out:
              - type: "[]byte"
        name: Conn
      - doc: |-
          ConnHandler serves one accepted stream connection.

          Returning an error does not kill the server: the connection is closed and the
          error is logged and metered. That is deliberate — one malformed peer must
          never be able to take down the process.

          Implementations MUST be safe for concurrent use: the server runs one
          goroutine per connection and they all share the handler.
        methods:
          - in:
              - name: ctx
                type: context.Context
              - name: c
                type: Conn
            name: ServeConn
            out:
              - type: error
        name: ConnHandler
      - doc: |-
          LoopHandler is the port a consumer implements to be served by a loop group
          (ADR 0186 §D4).

          One thread calls it: every callback of one loop runs on that loop's thread,
          one at a time, so a handler needs no lock for state it keeps per loop. It
          MUST NOT block: a blocking callback stalls every connection of its loop. A
          callback receives the LoopIO of the loop that calls it and the reference of
          the connection concerned; neither is valid past the loop's life, and a
          reference past its connection's OnClose is stale.

          IFACE-PLUGIN: the engines live in internal/service/net/loop and
          internal/service/net/server; this port is what a consumer writes.
        methods:
          - doc: |-
              OnOpen is called once per accepted connection, before any OnData for it.
              Pressure(ref) already answers for this connection.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnOpen
          - doc: |-
              OnData hands the handler the bytes received on ref and returns how many of
              them it consumed, from 0 to len(buf). buf stays valid until the next
              OnBatchEnd returns, never later, and the handler must not write to it.
              The unconsumed tail is kept in the connection's spill and handed back
              first, followed by the next bytes, on the next OnData; a tail past the
              spill ceiling closes the connection with LoopSpillFull. A value outside
              0 to len(buf) is treated as len(buf).
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
              - name: buf
                type: "[]byte"
            name: OnData
            out:
              - type: int
          - doc: |-
              OnTimeout is called when the deadline set by SetDeadline on ref expires.
              The connection stays open: closing it is the handler's choice.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnTimeout
          - doc: |-
              OnWritable is called when ref's pending output falls below the loop's
              low-water mark after a Write was refused with LoopOutputFull or left output
              pending past the mark, so a producer that paused can resume.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnWritable
          - doc: |-
              OnBatchEnd is called once per loop iteration, after the OnData calls of
              every ring of the loop, and before any buffer handed to them returns to the
              kernel. It is where a handler flushes work it batched — one database
              commit for every request of the batch, say — before writing the answers.
            in:
              - name: io
                type: LoopIO
            name: OnBatchEnd
          - doc: |-
              OnClose is called once per connection, last. err is nil when the peer
              closed cleanly or the handler called Close, and otherwise names why the
              loop closed it — LoopSpillFull, an idle timeout, the drain, a socket
              error. ref is stale once OnClose returns.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
              - name: err
                type: error
            name: OnClose
        name: LoopHandler
      - doc: |-
          LoopIO is what a loop offers its handler: the operations on its connections
          (ADR 0186 §D4). Each loop implements it with a pointer of its own, handed to
          every callback.

          Write, Close and SetDeadline belong to the loop's thread: they are called from
          a callback, never from another goroutine, which is what lets them take no
          lock. Under the loopdebug build tag a call from another thread is refused with
          LoopWrongThread. Post is the one operation another goroutine may call. Every
          error is a preallocated sentinel; none of the calls allocates when p belongs
          to the caller's heap or mapping.

          IFACE-PLUGIN: the concrete loops stay unexported in
          internal/service/net/loop and internal/service/net/server.
        methods:
          - doc: |-
              Write copies p into ref's output and returns. Writes on one reference leave
              in the order they were made, and p may be reused once Write returns. It is
              refused with LoopOutputFull, copying nothing, when p would pass the
              connection's output ceiling or the loop's global output budget, and with
              LoopStaleRef when ref's connection has closed.
            in:
              - name: ref
                type: LoopConnRef
              - name: p
                type: "[]byte"
            name: Write
            out:
              - type: error
          - doc: |-
              Close closes ref's connection once the output already written has left,
              and calls OnClose. A second Close, or a Close on a stale reference, returns
              LoopStaleRef and does nothing.
            in:
              - name: ref
                type: LoopConnRef
            name: Close
            out:
              - type: error
          - doc: |-
              SetDeadline arms ref's timer to fire OnTimeout after d, on the loop's
              coarse timer wheel: it fires no earlier than d and at most one wheel tick
              late. A d of zero or less disarms it. Arming again replaces the previous
              deadline.
            in:
              - name: ref
                type: LoopConnRef
              - name: d
                type: time.Duration
            name: SetDeadline
            out:
              - type: error
          - doc: |-
              Pressure reports whether ref's connection was accepted, or has since come,
              under the loop's soft pressure: the group serves more connections than its
              soft bound. It is a primitive; what a protocol makes of it — HTTP/1.1
              answers Connection: close — is the protocol adapter's. A stale reference
              reports false.
            in:
              - name: ref
                type: LoopConnRef
            name: Pressure
            out:
              - type: bool
          - doc: |-
              Post queues op to run once on the loop's thread with arg, and wakes the
              loop. It is the one operation any goroutine may call. The queue is
              preallocated and holds no closure: op is a plain function and arg an
              integer the caller gives meaning to. Each posted operation runs exactly
              once, in the order posted; a full queue refuses with LoopPostQueueFull, and
              a loop that has stopped with ServerClosed.
            in:
              - name: op
                type: PostFunc
              - name: arg
                type: uintptr
            name: Post
            out:
              - type: error
          - doc: |-
              Loop returns the index of the loop this LoopIO belongs to, from 0 to the
              group's lane count less one, fixed for the loop's life: its lane. A
              handler keeps its per-lane state — a scratch, a batch, a buffer — in a
              slice indexed by it and sized at LoopStarter.OnStart, so a callback finds
              its own with no lock and no map. The portable backend runs LoopValue.Loops
              lanes too, one handler goroutine each. Any goroutine may call it.
            name: Loop
            out:
              - type: int
        name: LoopIO
      - doc: |-
          LoopOptionHonourer is the optional capability of a LoopHandler that honours
          group options the loop engine does not: a protocol adapter that applies a
          header deadline, say. At Start, server refuses with LoopOptionUnsupported
          every option set on a loop group that neither the engine nor the handler
          honours (ADR 0186 §D1). A handler without it honours nothing of its own.
        methods:
          - doc: |-
              Honours reports whether the handler applies the option of kind k itself.
            in:
              - name: k
                type: OptionKind
            name: Honours
            out:
              - type: bool
        name: LoopOptionHonourer
      - doc: |-
          LoopStarter is the optional capability of a LoopHandler that keeps state per
          lane: OnStart tells it how many lanes the group runs, once, before any other
          callback, so it sizes a slice indexed by LoopIO.Loop and no callback grows
          one. A lane is one loop thread on a native backend, one handler goroutine on
          the portable backend; its count is LoopValue.Loops, zero meaning one, on
          every backend, a fallback from a native backend to the portable one
          included.
        methods:
          - doc: |-
              OnStart is called once, before any other callback, with the number of
              lanes: every LoopIO.Loop the group's callbacks see is from 0 to lanes
              less one.
            in:
              - name: lanes
                type: int
            name: OnStart
        name: LoopStarter
      - doc: |-
          LoopLayered is what every layer a loop middleware returns implements: Next
          is the handler the layer wraps. A layer embeds LoopLayer, which forwards the
          eight callbacks — the six of LoopHandler, Honours and OnStart — to Next, and
          overrides the ones it acts on, forwarding them in turn. At Start the server
          walks the chain by Next and sends each callback through a probe chain; a
          layer that does not implement LoopLayered, or does not forward a callback,
          fails Start with LoopMiddlewareInvalid. The chain honours an option when one
          of its layers or the handler does.
        methods:
          - doc: Next returns the handler the layer wraps.
            name: Next
            out:
              - type: LoopHandler
        name: LoopLayered
      - doc: |-
          LoopWorker runs a lane's offloaded jobs (R3): Work is called on the lane's
          worker goroutine, one per lane, off the loop's thread, one job at a time in
          the order the lane sent them, and may block. When it returns, the job goes
          back to the lane, whose offloader's OnDone sees it on the loop's thread.
        methods:
          - doc: |-
              Work runs job, sent by the lane whose index is lane.
            in:
              - name: lane
                type: int
              - name: job
                type: LoopJobValue
            name: Work
        name: LoopWorker
      - doc: |-
          LoopOutbound is one lane's queue to its worker (R3), preallocated
          (LoopValue.Outbound). Send is called on the lane's thread only, with the
          lane's LoopIO, and never blocks: it queues the job and wakes the worker, or
          refuses with LoopOutboundFull, queueing nothing.

          IFACE-PLUGIN: the queue is internal/service/net/server's.
        methods:
          - doc: |-
              Send queues job for the lane's worker, or refuses with LoopOutboundFull.
            in:
              - name: io
                type: LoopIO
              - name: job
                type: LoopJobValue
            name: Send
            out:
              - type: error
        name: LoopOutbound
      - doc: |-
          LoopOffloader is the optional capability of a LoopHandler that offloads
          blocking work (R3). At Start the server walks the chain by Next for the
          first offloader whose Worker is not nil, starts one worker goroutine per
          lane, and calls OnOutbound once, after LoopStarter.OnStart and before any
          other callback. Each job a lane sends comes back through OnDone, on that
          lane's thread, once Work has returned; a job whose connection closed
          meanwhile comes back too, so the offloader frees what it kept for it. A
          draining loop keeps open every connection Pending names. The workers stop
          after the loop engine has: on Shutdown once the drain is over, queued jobs
          then dropped.
        methods:
          - doc: |-
              Worker returns the worker the group's lanes offload to; nil offloads
              nothing.
            name: Worker
            out:
              - type: LoopWorker
          - doc: |-
              OnOutbound gives the offloader its lanes' outbounds, once.
            in:
              - name: v
                type: LoopOutboundValue
            name: OnOutbound
          - doc: |-
              OnDone is called on the lane's thread with each job its worker ran.
            in:
              - name: io
                type: LoopIO
              - name: job
                type: LoopJobValue
            name: OnDone
          - doc: |-
              Pending reports, on the lane's thread, whether ref, a connection of lane,
              waits for an answer its worker has not given back: a draining loop keeps
              it open until it has, and eviction passes it by.
            in:
              - name: lane
                type: int
              - name: ref
                type: LoopConnRef
            name: Pending
            out:
              - type: bool
        name: LoopOffloader
      - doc: |-
          HTTP1Handler answers one request of the restricted HTTP/1.1 profile.

          It sees only requests the codec framed and accepted: a refusal is answered
          and the connection closed before any handler runs, and no handler can turn
          one into an answer of its own. It fills res — the status, extra field lines
          and the body — and the codec writes the framing: the status line,
          Content-Length and Connection: close.

          req is valid until ServeHTTP1 returns, and so is every byte it aliases
          unless the caller says longer: on the loop engine those bytes stay valid
          until the loop's batch ends, HTTP1Batcher.EndBatch included. A handler that
          keeps one past that copies it. On the loop engine a handler runs on the
          loop's thread and must not block it.
        methods:
          - in:
              - name: req
                type: "*HTTP1RequestValue"
              - name: res
                type: "*HTTP1ResponseValue"
            name: ServeHTTP1
        name: HTTP1Handler
      - doc: |-
          HTTP1Batcher is the optional capability of an HTTP1Handler served on a loop
          group: the end of each batch of the loop's requests.

          The loop adapter calls EndBatch once per loop iteration that served at least
          one request, on the loop's thread, after every request of the batch went
          through ServeHTTP1 and before any answer of the batch is written. A handler
          runs the work it batched there — one transaction for every request, say —
          and completes each response it deferred (HTTP1ResponseValue.Defer). Every
          byte the batch's requests aliased is still valid while EndBatch runs, and
          none is once it returns. Like every callback of the loop, it must not block
          the loop's thread longer than the batch's own work.

          IFACE-PLUGIN: what a consumer writes beside HTTP1Handler; the adapter that
          calls it is internal/service/net/http1's.
        methods:
          - doc: |-
              EndBatch ends the batch of the lane whose index is lane: the Lane every
              request of the batch carried.
            in:
              - name: lane
                type: int
            name: EndBatch
        name: HTTP1Batcher
      - doc: |-
          HTTP1Worker is the optional capability of an HTTP1Handler served on a loop
          group that answers off the loop's thread (R3): a response the handler marks
          Pending is handed to the lane's worker goroutine, which calls WorkHTTP1 with
          the response's Job and a response value of its own to fill; the loop adapter
          writes it, from the loop's thread, once WorkHTTP1 returns. WorkHTTP1 may
          block. It reads nothing of the request, whose bytes do not outlive the
          batch: the handler copied what the work needs and named it by job.

          IFACE-PLUGIN: what a consumer writes beside HTTP1Handler; the adapter that
          calls it is internal/service/net/http1's.
        methods:
          - doc: |-
              WorkHTTP1 fills res, the answer to the pending request of lane whose Job
              was job.
            in:
              - name: lane
                type: int
              - name: job
                type: uint64
              - name: res
                type: "*HTTP1ResponseValue"
            name: WorkHTTP1
        name: HTTP1Worker
      - doc: |-
          HTTP1BearerVerifier verifies a Bearer token for the http1 chain's
          authenticating link. VerifyBearer reports whether token is valid and, when
          it is, sets the subject and the claims on auth, which belongs to the
          request: the link copies nothing back, and nothing the verifier keeps may
          alias token, whose bytes the connection reuses once the batch ends. It runs
          on the lane's thread, once per request the link judges, and must not block
          it.

          IFACE-PLUGIN: what a consumer writes; the link that calls it is
          internal/service/net/http1's.
        methods:
          - doc: |-
              VerifyBearer reports whether token, the credentials after "Bearer ", is
              valid, and fills auth when it is.
            in:
              - name: token
                type: "[]byte"
              - name: auth
                type: "*HTTP1AuthValue"
            name: VerifyBearer
            out:
              - type: bool
        name: HTTP1BearerVerifier
      - doc: |-
          HTTP1AccessLogger receives the http1 chain's access-log records. Every slice
          of rec aliases the request or the response and is valid only while
          LogHTTP1 runs: a logger that keeps a byte copies it. It runs on the lane's
          thread, once per request, and must not block it: a logger that writes to a
          file or a socket queues the record.

          IFACE-PLUGIN: what a consumer writes; the link that calls it is
          internal/service/net/http1's.
        methods:
          - doc: LogHTTP1 receives one request's record.
            in:
              - name: rec
                type: HTTP1AccessValue
            name: LogHTTP1
        name: HTTP1AccessLogger
      - doc: |-
          Packet is one received datagram.

          Data is valid only until ServePacket returns: the buffer is recycled straight
          back into the read batch, which is what makes batched datagram reading
          allocation-free. A handler that needs the payload afterwards must copy it.

          IFACE-PLUGIN: the concrete type stays unexported in internal/service/net/server.
        methods:
          - doc: Data returns the datagram payload.
            name: Data
            out:
              - type: "[]byte"
          - doc: From returns the sender's address.
            name: From
            out:
              - type: stdnet.Addr
          - doc: To returns the local address the datagram arrived on.
            name: To
            out:
              - type: stdnet.Addr
          - doc: ID returns the monotonic identifier assigned at read time.
            name: ID
            out:
              - type: uint64
          - doc: Group returns the name of the listener group that received it.
            name: Group
            out:
              - type: string
          - doc: |-
              Reply writes a datagram back to the sender. It exists so the common case
              needs no reference to the underlying connection.
            in:
              - name: b
                type: "[]byte"
            name: Reply
            out:
              - name: "n"
                type: int
              - name: err
                type: error
        name: Packet
      - doc: |-
          PacketHandler serves one received datagram.

          Returning an error does not kill the server: it is logged and metered, and
          reading continues. A datagram service must survive a malformed packet.

          Implementations MUST be safe for concurrent use.
        methods:
          - in:
              - name: ctx
                type: context.Context
              - name: p
                type: Packet
            name: ServePacket
            out:
              - type: error
        name: PacketHandler
      - doc: |-
          Policy authorises an outbound request before it leaves the process.

          The contract that makes this worth a port: implementations are evaluated
          inside the RoundTripper, underneath every call site. A caller cannot construct
          a request that skips the check, so "this client is read-only" becomes a
          property of the code rather than a convention the next contributor must
          remember. Allow returns nil to permit the request and a typed error to refuse
          it; the refusal is reported as RequestDenied without echoing the path, so a
          denial cannot leak the private API surface through a log line.

          Implementations MUST be safe for concurrent use.

          IFACE-PLUGIN: concrete policies live in internal/service/net/client; their
          types stay unexported behind their constructors.
        methods:
          - in:
              - name: req
                type: RequestValue
            name: Allow
            out:
              - type: error
        name: Policy
    sentinels:
      - var:
          - code: CodeListenFailed
            doc: ListenFailed is returned when a listener could not be bound.
            exit: UNAVAILABLE
            name: ListenFailed
            private: "core/net: binding a listener failed; the wrap cause is the OS error"
            public: The server could not bind its listening address
            reason: LISTEN_FAILED
          - code: CodeInvalidAddress
            doc: InvalidAddress is returned for a syntactically unusable address.
            exit: USAGE
            name: InvalidAddress
            private: "core/net: the supplied host:port or socket path could not be parsed"
            public: The network address is not valid
            reason: INVALID_ADDRESS
          - code: CodeUnsupportedNetwork
            doc: UnsupportedNetwork is returned for a network name outside the served set.
            exit: USAGE
            name: UnsupportedNetwork
            private: "core/net: network outside {tcp,tcp4,tcp6,udp,udp4,udp6,unix,unixgram,unixpacket}"
            public: The network type is not supported
            reason: UNSUPPORTED_NETWORK
          - code: CodeServerClosed
            doc: ServerClosed is returned once the server has stopped accepting work.
            exit: UNAVAILABLE
            name: ServerClosed
            private: "core/net: the server stopped accepting; this is the terminal state of a graceful shutdown"
            public: The server is closed
            reason: SERVER_CLOSED
          - code: CodeAlreadyStarted
            doc: AlreadyStarted is returned by Start on a server that is already serving.
            exit: SOFTWARE
            name: AlreadyStarted
            private: "core/net: Start called on a server whose phase is already Serving"
            public: The server is already started
            reason: ALREADY_STARTED
          - code: CodeNotStarted
            doc: NotStarted is returned when an operation requires a running server.
            exit: SOFTWARE
            name: NotStarted
            private: "core/net: the operation requires a running server"
            public: The server is not started
            reason: NOT_STARTED
          - code: CodeHandlerMissing
            doc: HandlerMissing is returned when a group was bound without a handler.
            exit: USAGE
            name: HandlerMissing
            private: "core/net: a group reached Start with a nil handler"
            public: The listener group has no handler
            reason: HANDLER_MISSING
          - code: CodeHandlerPanic
            doc: HandlerPanic wraps a panic recovered inside a handler.
            exit: SOFTWARE
            name: HandlerPanic
            private: "core/net: a handler panicked; the connection was closed and the process kept running"
            public: The connection handler failed unexpectedly
            reason: HANDLER_PANIC
          - code: CodeConnLimitReached
            doc: ConnLimitReached is returned when the group's connection ceiling is full.
            exit: TEMPFAIL
            name: ConnLimitReached
            private: "core/net: the group's concurrency ceiling rejected the connection"
            public: The server is at its connection limit
            reason: CONN_LIMIT_REACHED
          - code: CodeDrainTimeout
            doc: DrainTimeout is returned when the shutdown drain budget expired.
            exit: TEMPFAIL
            name: DrainTimeout
            private: "core/net: connections were still in flight when the drain budget expired"
            public: The server did not drain before its deadline
            reason: DRAIN_TIMEOUT
          - code: CodeGroupUnknown
            doc: GroupUnknown is returned for a lookup of an undeclared group.
            exit: USAGE
            name: GroupUnknown
            private: "core/net: no group is registered under that name"
            public: The listener group is not declared
            reason: GROUP_UNKNOWN
          - code: CodeGroupDuplicate
            doc: GroupDuplicate is returned for a second declaration of one group name.
            exit: USAGE
            name: GroupDuplicate
            private: "core/net: a group with that name already exists on this server"
            public: The listener group is already declared
            reason: GROUP_DUPLICATE
          - code: CodeSocketAdoptFailed
            doc: SocketAdoptFailed is returned when an inherited socket could not be adopted.
            exit: OSERR
            name: SocketAdoptFailed
            private: "core/net: a supervisor-passed descriptor could not be turned into a listener"
            public: An inherited socket could not be adopted
            reason: SOCKET_ADOPT_FAILED
          - code: CodePacketTooLarge
            doc: |-
              PacketTooLarge names the reason a datagram beyond the group's accepted
              size is dropped. It is deliberately not returned to anyone: a read loop
              has no caller, so the drop is reported through
              StateValue.OversizedPackets. The sentinel stays because it is what gives
              that count a documented name in the registry.
            exit: DATAERR
            name: PacketTooLarge
            private: "core/net: the received datagram exceeded the group's maximum packet size"
            public: The datagram is larger than the accepted size
            reason: PACKET_TOO_LARGE
          - code: CodeTLSMaterialInvalid
            doc: |-
              TLSMaterialInvalid is returned for absent, malformed, or empty TLS material.
              It is deliberately loud: an unusable bundle must never degrade into a trust
              store that silently verifies nothing.
            exit: CONFIG
            name: TLSMaterialInvalid
            private: "core/net: the certificate, key, or CA bundle yielded no usable material"
            public: The TLS material is missing or invalid
            reason: TLS_MATERIAL_INVALID
          - code: CodeTLSHandshakeFailed
            doc: TLSHandshakeFailed is returned when a TLS or mTLS handshake did not complete.
            exit: UNAVAILABLE
            name: TLSHandshakeFailed
            private: "core/net: the TLS or mTLS handshake did not complete"
            public: The TLS handshake failed
            reason: TLS_HANDSHAKE_FAILED
          - code: CodeRequestDenied
            doc: |-
              RequestDenied is returned when the transport policy refused an outbound call.
              The public message never names the refused path, so a denial cannot leak the
              shape of the private API surface through a log line.
            exit: NOPERM
            name: RequestDenied
            private: "core/net: the transport policy refused the outbound request"
            public: The request was refused by policy
            reason: REQUEST_DENIED
          - code: CodeResponseTooLarge
            doc: ResponseTooLarge is returned when a response body exceeded the read ceiling.
            exit: DATAERR
            name: ResponseTooLarge
            private: "core/net: the response body exceeded the configured maximum size"
            public: The response is larger than the accepted size
            reason: RESPONSE_TOO_LARGE
          - code: CodeCallFailed
            doc: CallFailed is returned when an outbound call produced no response.
            exit: UNAVAILABLE
            name: CallFailed
            private: "core/net: the outbound call did not produce a response"
            public: The outbound call failed
            reason: CALL_FAILED
          - code: CodeTooManyRedirects
            doc: TooManyRedirects is returned when a call exceeded its redirect budget.
            exit: UNAVAILABLE
            name: TooManyRedirects
            private: "core/net: the redirect chain was longer than the configured maximum"
            public: The outbound call exceeded its redirect budget
            reason: TOO_MANY_REDIRECTS
          - code: CodeInvalidDuration
            doc: |-
              InvalidDuration is returned for a configuration duration that parses as
              neither a Go duration literal nor an integer nanosecond count.
            exit: CONFIG
            name: InvalidDuration
            private: "core/net: the value is neither a Go duration literal nor a nanosecond count"
            public: The duration value is not valid
            reason: INVALID_DURATION
          - code: CodeUnsafePath
            doc: |-
              UnsafePath is returned for a path carrying a dot segment in any form. It is
              evaluated before the allowlist, because Go normalises dot segments neither
              in url.URL nor in the transport, so an anchored pattern alone is not enough.
            exit: NOPERM
            name: UnsafePath
            private: "core/net: the path carries a literal or percent-encoded dot segment"
            public: The request path is not in normalised form
            reason: UNSAFE_PATH
          - code: CodeSSEFieldInvalid
            doc: |-
              SSEFieldInvalid is returned for a Server-Sent Events frame the wire format
              cannot carry. The format has no escape mechanism: a newline inside a value
              SPLITS it rather than being quoted, so an id or an event name carrying one
              would arrive as a different value plus a stray field. It is refused, never
              truncated — a silently shortened id is a resume token that points at the
              wrong place.
            exit: USAGE
            name: SSEFieldInvalid
            private: "core/net: an SSE frame carried a line terminator in a single-line field, an unrepresentable retry, or no field at all"
            public: The event cannot be represented in the event-stream format
            reason: SSE_FIELD_INVALID
          - code: CodeSSEFlushUnsupported
            doc: |-
              SSEFlushUnsupported is returned when the ResponseWriter cannot be flushed.
              Without a flush the events accumulate in the transport buffer and reach the
              client only when the handler returns, so an endless stream delivers nothing
              at all — the failure is total and silent, which is why it is refused at
              construction rather than discovered in production.
            exit: SOFTWARE
            name: SSEFlushUnsupported
            private: "core/net: the http.ResponseWriter implements neither Flush nor http.Flusher"
            public: The response cannot be streamed
            reason: SSE_FLUSH_UNSUPPORTED
          - code: CodeSSEStreamClosed
            doc: |-
              SSEStreamClosed is returned by a send on a stream that has already ended:
              the client disconnected, the server began draining, or the handler closed
              it. It is the terminal outcome a streaming handler loops until.
            exit: UNAVAILABLE
            name: SSEStreamClosed
            private: "core/net: the SSE stream ended — peer gone, server draining, or closed by the handler"
            public: The event stream is closed
            reason: SSE_STREAM_CLOSED
          - code: CodeSSEStreamMisconfigured
            doc: |-
              SSEStreamMisconfigured is returned for a stream option the domain refuses
              to interpret rather than guess at (ADR 0031). A zero keep-alive interval is
              CLAMPED to the domain default, because a working keep-alive needs no
              explanation; a negative one is REFUSED, because no value the SDK invented
              for it would be defensible and "never" already has an explicit spelling.
            exit: CONFIG
            name: SSEStreamMisconfigured
            private: "core/net: a negative keep-alive interval or write budget was supplied"
            public: The event stream options are not valid
            reason: SSE_STREAM_MISCONFIGURED
          - code: CodeWSHandshakeFailed
            doc: |-
              WSHandshakeFailed is returned when an HTTP request is not a valid RFC 6455
              opening handshake. The upgrade is refused with an HTTP status rather than
              a Close frame, because at that point there is no WebSocket connection to
              close — the response is still an ordinary HTTP one.
            exit: DATAERR
            name: WSHandshakeFailed
            private: "core/net: the request does not satisfy RFC 6455 §4.2.1, or its origin was refused"
            public: The WebSocket handshake is not valid
            reason: WS_HANDSHAKE_FAILED
          - code: CodeWSUpgradeUnsupported
            doc: |-
              WSUpgradeUnsupported is returned when the response's connection cannot be
              hijacked. It is deliberately distinct from a failed handshake: the request
              was fine and the peer did nothing wrong — this stack cannot take over the
              socket, which is a deployment fact (HTTP/2, or a middleware that wraps the
              ResponseWriter without forwarding Unwrap), not a client error.
            exit: SOFTWARE
            name: WSUpgradeUnsupported
            private: "core/net: the http.ResponseWriter exposes no http.Hijacker, so the socket cannot be taken over"
            public: The connection cannot be upgraded
            reason: WS_UPGRADE_UNSUPPORTED
          - code: CodeWSProtocolViolation
            doc: |-
              WSProtocolViolation is returned for a frame RFC 6455 forbids. Every case it
              covers FAILS THE CONNECTION rather than being skipped: a peer that sent a
              frame this endpoint ignored believes it said something, and the two would
              be desynchronised from that point on.
            exit: DATAERR
            name: WSProtocolViolation
            private: "core/net: the frame violates RFC 6455 framing — masking, reserved bits/opcodes, control-frame shape, minimal length, or fragmentation order"
            public: The WebSocket frame is not valid
            reason: WS_PROTOCOL_VIOLATION
          - code: CodeWSMessageTooLarge
            doc: |-
              WSMessageTooLarge is returned when a frame or a reassembled message exceeds
              the connection's ceiling. The check runs against the ANNOUNCED length,
              before any buffer is sized from it: allocating from a 64-bit integer the
              peer chose is a denial of service in one line.
            exit: DATAERR
            name: WSMessageTooLarge
            private: "core/net: the frame or the accumulated message exceeded the configured ceiling"
            public: The WebSocket message is larger than the accepted size
            reason: WS_MESSAGE_TOO_LARGE
          - code: CodeWSInvalidPayload
            doc: |-
              WSInvalidPayload is returned for a payload the protocol cannot carry: text
              that is not UTF-8, a close code that must never be sent, or a close reason
              past the control-frame ceiling. It is one sentinel for both directions on
              purpose — the rule a peer broke is the rule this endpoint must not break.
            exit: DATAERR
            name: WSInvalidPayload
            private: "core/net: invalid UTF-8, an unsendable close code, or an oversized close reason"
            public: The WebSocket payload is not valid
            reason: WS_INVALID_PAYLOAD
          - code: CodeWSConnClosed
            doc: |-
              WSConnClosed is returned by any operation on a connection that has ended.
              It is the terminal outcome a receive loop runs until, and it carries the
              close code the peer sent when there was one.
            exit: UNAVAILABLE
            name: WSConnClosed
            private: "core/net: the connection ended — peer close, server draining, closed by the handler, or a dead socket"
            public: The WebSocket connection is closed
            reason: WS_CONN_CLOSED
          - code: CodeWSConnMisconfigured
            doc: |-
              WSConnMisconfigured is returned for an option the domain refuses to
              interpret rather than guess at (ADR 0031). A zero ping interval is CLAMPED
              to the domain default, because a working heartbeat needs no explanation; a
              negative one is REFUSED, and "never" has its own spelling.
            exit: CONFIG
            name: WSConnMisconfigured
            private: "core/net: a negative interval or budget, or a non-positive size ceiling, was supplied"
            public: The WebSocket options are not valid
            reason: WS_CONN_MISCONFIGURED
          - code: CodeStaticMisconfigured
            doc: |-
              StaticMisconfigured is returned when a static file handler is built with
              nothing it can serve safely: no file tree, a header value carrying a
              control character, or a Referrer-Policy token no browser knows — which a
              browser ignores, silently falling back to a weaker default. The "option"
              field names which (ADR 0130).
            exit: CONFIG
            name: StaticMisconfigured
            private: "core/net: a nil file tree, a header value with a control character, or an unknown Referrer-Policy token"
            public: The static file handler configuration is not valid
            reason: STATIC_MISCONFIGURED
          - code: CodeLoopTLSUnsupported
            doc: |-
              LoopTLSUnsupported is returned by Start for a loop group given TLS. The loop
              engine is plaintext only (ADR 0186 §D2); a group that needs TLS is served by
              Handle or HandleHTTP on the default engine.
            exit: CONFIG
            name: LoopTLSUnsupported
            private: "core/net: a loop group was given a TLS identity; the loop engine is plaintext only"
            public: The loop engine does not serve TLS
            reason: LOOP_TLS_UNSUPPORTED
          - code: CodeLoopOptionUnsupported
            doc: |-
              LoopOptionUnsupported is returned by Start for an option a group cannot honour
              on its engine: Loop on a group served by Handle, HandleFunc or HandleHTTP, or
              on a datagram group; Use on a loop group; or an option neither the loop
              engine nor its handler honours. A group with no handler fails with
              HandlerMissing instead. The "option" field names it. It is judged at
              Start, once the handler is known, whatever order the declarations came in.
            exit: CONFIG
            name: LoopOptionUnsupported
            private: "core/net: an option the group's engine or its loop handler cannot honour"
            public: The group option is not supported by its engine
            reason: LOOP_OPTION_UNSUPPORTED
          - code: CodeLoopBackendUnavailable
            doc: |-
              LoopBackendUnavailable is returned by Start for an explicit loop backend the
              running kernel's probe refused. The "stage" and "reason" fields name the probe
              step that failed. A GOOS that has no such mechanic at all returns the shared
              UnsupportedPlatform instead (ADR 0018 §(a)).
            exit: UNAVAILABLE
            name: LoopBackendUnavailable
            private: "core/net: the kernel probe refused the requested loop backend"
            public: The requested loop backend is not available on this kernel
            reason: LOOP_BACKEND_UNAVAILABLE
          - code: CodeLoopNoDescriptors
            doc: |-
              LoopNoDescriptors is returned by Start for a loop group when the effective
              RLIMIT_NOFILE soft limit is zero or cannot be read: no ring table and no
              connection could hold a descriptor. It is checked before the ring count is
              derived, so it is never a division by zero.
            exit: OSERR
            name: LoopNoDescriptors
            private: "core/net: RLIMIT_NOFILE is zero or unreadable; the loop has no descriptor to use"
            public: The process has no file descriptor available for the loop
            reason: LOOP_NO_DESCRIPTORS
          - code: CodeLoopStaleRef
            doc: |-
              LoopStaleRef is returned by a loop operation on a reference whose connection
              has closed. The operation does nothing: the slot may already name another
              connection, and the generation is what tells the two apart.
            exit: SOFTWARE
            name: LoopStaleRef
            private: "core/net: the connection reference's generation has ended"
            public: The connection is closed
            reason: LOOP_STALE_REF
          - code: CodeLoopOutputFull
            doc: |-
              LoopOutputFull is returned by Write when the bytes would pass the connection's
              output ceiling or the loop's global output budget. Nothing is copied; the
              caller waits for OnWritable or closes.
            exit: TEMPFAIL
            name: LoopOutputFull
            private: "core/net: the connection's output or the loop's output budget is at its ceiling"
            public: The connection cannot take more output now
            reason: LOOP_OUTPUT_FULL
          - code: CodeLoopSpillFull
            doc: |-
              LoopSpillFull is the error OnClose receives for a connection whose unconsumed
              input passed its spill ceiling or the loop's global spill budget. The loop
              closes it rather than read further.
            exit: TEMPFAIL
            name: LoopSpillFull
            private: "core/net: the unconsumed input passed the spill ceiling"
            public: The connection sent more than it may hold unread
            reason: LOOP_SPILL_FULL
          - code: CodeLoopPostQueueFull
            doc: |-
              LoopPostQueueFull is returned by Post when the loop's preallocated queue is
              full. The operation is not queued and will not run.
            exit: TEMPFAIL
            name: LoopPostQueueFull
            private: "core/net: the loop's post queue is full"
            public: The loop cannot take more posted work now
            reason: LOOP_POST_QUEUE_FULL
          - code: CodeLoopOutboundFull
            doc: |-
              LoopOutboundFull is returned by LoopOutbound.Send when the lane's
              preallocated queue to its worker is full (R3). The job is not queued; the
              refusal is counted in LoopStateValue.OutboundRefused.
            exit: TEMPFAIL
            name: LoopOutboundFull
            private: "core/net: the lane's queue to its worker is full"
            public: The server cannot take more offloaded work now
            reason: LOOP_OUTBOUND_FULL
          - code: CodeLoopWrongThread
            doc: |-
              LoopWrongThread is returned under the loopdebug build tag by Write, Close or
              SetDeadline called from a thread other than the loop's own. Without the tag
              the check is not compiled; the call is a contract violation either way.
            exit: SOFTWARE
            name: LoopWrongThread
            private: "core/net: a loop-thread operation was called from another thread"
            public: The operation was called outside its loop
            reason: LOOP_WRONG_THREAD
          - code: CodeHandlerAlreadySet
            doc: |-
              HandlerAlreadySet is returned by Start for a stream group whose handler was
              declared twice — by Handle, HandleFunc, HandleHTTP or HandleLoop, in any
              order. The second declaration does not replace the first; the "group" field
              names the group.
            exit: USAGE
            name: HandlerAlreadySet
            private: "core/net: a second handler declaration on one stream group"
            public: The listener group already has a handler
            reason: HANDLER_ALREADY_SET
          - code: CodeHTTP1RequestMalformed
            doc: |-
              HTTP1RequestMalformed is the refusal of a request whose syntax the profile
              does not accept. It is answered 400 with Connection: close, and the
              connection is closed: no handler sees the request.
            exit: DATAERR
            http: 400
            name: HTTP1RequestMalformed
            private: "core/net: a bare CR or LF, a NUL or control byte, obs-fold, whitespace before a colon, a non-token name, or a bad request line"
            public: The request is malformed
            reason: HTTP1_REQUEST_MALFORMED
          - code: CodeHTTP1TransferEncoding
            doc: |-
              HTTP1TransferEncoding is the refusal of any Transfer-Encoding. A
              request that carries one alongside a Content-Length is the classic smuggling
              vector (RFC 9112 §11.2), so the profile never chooses between them.
            exit: DATAERR
            http: 400
            name: HTTP1TransferEncoding
            private: "core/net: a Transfer-Encoding field, chunked or not; the profile frames by Content-Length alone"
            public: Transfer-Encoding is not supported
            reason: HTTP1_TRANSFER_ENCODING
          - code: CodeHTTP1ContentLengthInvalid
            doc: |-
              HTTP1ContentLengthInvalid is the refusal of a Content-Length the profile
              cannot frame by. A second one is refused even when it repeats the first:
              two parsers disagreeing on which one counts is how a body becomes a request.
            exit: DATAERR
            http: 400
            name: HTTP1ContentLengthInvalid
            private: "core/net: an empty, non-digit, over-long or repeated Content-Length"
            public: The Content-Length is not valid
            reason: HTTP1_CONTENT_LENGTH_INVALID
          - code: CodeHTTP1FieldDuplicated
            doc: |-
              HTTP1FieldDuplicated is the refusal of a second Authorization or Host. The
              profile hands a handler one of each, and picking one of two would let a
              front end and this server judge different credentials or origins.
            exit: DATAERR
            http: 400
            name: HTTP1FieldDuplicated
            private: "core/net: a second Authorization or Host field"
            public: A request field is repeated
            reason: HTTP1_FIELD_DUPLICATED
          - code: CodeHTTP1ExpectRefused
            doc: |-
              HTTP1ExpectRefused is the refusal of an Expect field, answered 417
              (RFC 9110 §10.1.1).
            exit: DATAERR
            http: 417
            name: HTTP1ExpectRefused
            private: "core/net: an Expect field; the profile sends no 100 Continue"
            public: The expectation cannot be met
            reason: HTTP1_EXPECT_REFUSED
          - code: CodeHTTP1HeadTooLarge
            doc: |-
              HTTP1HeadTooLarge is the refusal of a head past the profile's bound, in
              bytes or in field lines, answered 431.
            exit: DATAERR
            http: 431
            name: HTTP1HeadTooLarge
            private: "core/net: the head did not end within its byte bound, or carried more than HTTP1MaxFields field lines"
            public: The request header is too large
            reason: HTTP1_HEAD_TOO_LARGE
          - code: CodeHTTP1TargetTooLong
            doc: |-
              HTTP1TargetTooLong is the refusal of a request-target past the profile's
              bound, answered 414.
            exit: DATAERR
            http: 414
            name: HTTP1TargetTooLong
            private: "core/net: the request-target is longer than the target bound"
            public: The request target is too long
            reason: HTTP1_TARGET_TOO_LONG
          - code: CodeHTTP1BodyTooLarge
            doc: |-
              HTTP1BodyTooLarge is the refusal of a Content-Length past the profile's
              body bound, answered 413 before a byte of the body is read.
            exit: DATAERR
            http: 413
            name: HTTP1BodyTooLarge
            private: "core/net: the declared Content-Length is past the body bound"
            public: The request content is too large
            reason: HTTP1_BODY_TOO_LARGE
          - code: CodeHTTP1MethodUnsupported
            doc: |-
              HTTP1MethodUnsupported is the refusal of CONNECT, answered 501: a tunnel is
              outside the profile (ADR 0186 §D6).
            exit: DATAERR
            http: 501
            name: HTTP1MethodUnsupported
            private: "core/net: a CONNECT request"
            public: The request method is not supported
            reason: HTTP1_METHOD_UNSUPPORTED
          - code: CodeHTTP1ResponseInvalid
            doc: |-
              HTTP1ResponseInvalid is returned by the profile's writer for a response it
              will not put on the wire. Nothing is appended: a half-written response on a
              kept-alive connection would frame every response after it wrongly.
            exit: USAGE
            name: HTTP1ResponseInvalid
            private: "core/net: a status outside 200-999, a body on 204 or 304, a non-token or codec-owned field name, or a control byte in a field value"
            public: The response is not valid
            reason: HTTP1_RESPONSE_INVALID
          - code: CodeHTTP1Misconfigured
            doc: |-
              HTTP1Misconfigured is returned for profile limits the codec refuses to
              interpret rather than guess at (ADR 0031): a zero bound is the default, a
              negative one, or one past its maximum, is refused. The "option" field names
              which.
            exit: CONFIG
            name: HTTP1Misconfigured
            private: "core/net: a negative bound, a head past HTTP1MaxHead, a target past the head, or a body past HTTP1MaxBody"
            public: The HTTP/1.1 profile limits are not valid
            reason: HTTP1_MISCONFIGURED
          - code: CodeEngineUnsupported
            doc: |-
              EngineUnsupported is returned by Start for a group whose Engine cannot serve
              it: EngineGoroutine on a group served by HandleLoop or given Loop, EngineLoop
              on a group served by Handle, HandleFunc or HandleHTTP or on a datagram group,
              or a value outside the engine constants. The "engine" field names the value.
              It is refused, never replaced by another engine (ADR 0187).
            exit: CONFIG
            name: EngineUnsupported
            private: "core/net: the Engine option names an engine the group's handler or options cannot run on"
            public: The group's engine cannot serve its handler
            reason: ENGINE_UNSUPPORTED
          - code: CodePlaintextWithTLS
            doc: |-
              PlaintextWithTLS is returned by Start for a group given both Plaintext and
              TLS, in either order. The group is never served in plaintext nor over TLS by
              default: the contradiction is the caller's to settle (ADR 0187).
            exit: CONFIG
            name: PlaintextWithTLS
            private: "core/net: a group was given both Plaintext and TLS"
            public: The group cannot be both plaintext and TLS
            reason: PLAINTEXT_WITH_TLS
          - code: CodeHandlerAmbiguous
            doc: |-
              HandlerAmbiguous is returned by Start for a simple-API group whose handler
              implements both interfaces of its entry — http.Handler and HTTP1Handler for
              HTTP, ConnHandler and LoopHandler for TCP — with no Engine to choose
              (ADR 0197). The "entry" and "type" fields name them.
            exit: USAGE
            name: HandlerAmbiguous
            private: "core/net: the handler implements both interfaces of its entry and no Engine chooses"
            public: The handler could run on two engines; choose one with Engine
            reason: HANDLER_AMBIGUOUS
          - code: CodeHandlerUnsupported
            doc: |-
              HandlerUnsupported is returned by Start for a simple-API group whose handler
              no engine of its entry serves: a PacketHandler given to HTTP, a LoopHandler
              given to UDP, an HTTP handler given to TCP (its "serve" field names HTTP),
              any other type (ADR 0197). The "entry" and "type" fields name them, on
              every one of these refusals.
            exit: USAGE
            name: HandlerUnsupported
            private: "core/net: no engine of the entry serves the handler's type"
            public: The handler cannot be served by this entry point
            reason: HANDLER_UNSUPPORTED
          - code: CodePlaintextRequired
            doc: |-
              PlaintextRequired is returned by Start for a group that serves HTTP —
              net/http's or the http1 codec — given neither TLS nor Plaintext: a group
              without TLS says so (ADR 0187 §D7, ADR 0197). The "group" field names it.
            exit: CONFIG
            name: PlaintextRequired
            private: "core/net: an HTTP group without TLS must say Plaintext"
            public: The HTTP group needs TLS or Plaintext
            reason: PLAINTEXT_REQUIRED
          - code: CodePacketOptionUnsupported
            doc: |-
              PacketOptionUnsupported is returned by Start for a datagram group given an
              option the datagram engine does not apply — anything but MaxPacketSize,
              BatchSize, BatchReplies, Adopt, Name, Engine and Plaintext — refused rather
              than dropped
              (ADR 0187 §D4, ADR 0197). The "option" field names it.
            exit: CONFIG
            name: PacketOptionUnsupported
            private: "core/net: the datagram group was given an option it cannot honour"
            public: The datagram group cannot honour one of its options
            reason: PACKET_OPTION_UNSUPPORTED
          - code: CodeGroupNameConflict
            doc: |-
              GroupNameConflict is returned by Start for a group given a Name that is empty
              or differs from the non-empty name it was declared with. The "group" and
              "name" fields carry both.
            exit: USAGE
            name: GroupNameConflict
            private: "core/net: the Name option contradicts the group's declared name, or is empty"
            public: The group's name is not consistent
            reason: GROUP_NAME_CONFLICT
          - code: CodeLoopGroupStalled
            doc: |-
              LoopGroupStalled is returned by Serve once every ring of a loop group has been
              drained by its watchdog while the server was serving, and by the server's
              liveness check once that has lasted the stall grace (ADR 0188). The "group"
              field names it. A process restarted with the same environment stalls the
              same way: the runbook sets KITSUNIUM_NET_DISABLE.
            exit: UNAVAILABLE
            name: LoopGroupStalled
            private: "core/net: every ring of the loop group was drained by its watchdog; set KITSUNIUM_NET_DISABLE before restarting"
            public: A loop group stopped accepting connections
            reason: LOOP_GROUP_STALLED
          - code: CodeLoopMiddlewareInvalid
            doc: |-
              LoopMiddlewareInvalid is returned by Start when a loop middleware's layer
              does not forward every callback to the handler it wraps: it does not
              implement LoopLayered, its Next is not the handler it was given, or one of
              the eight callbacks sent through a probe chain did not reach the handler.
              The "group" and "callback" fields name it.
            exit: CONFIG
            name: LoopMiddlewareInvalid
            private: "core/net: a loop middleware's layer does not forward every callback to the next handler"
            public: A loop middleware does not forward every callback
            reason: LOOP_MIDDLEWARE_INVALID
          - code: CodeProtocolsRefused
            doc: |-
              ProtocolsRefused is returned by Start for an HTTP group whose Protocols
              option is empty, holds an empty identifier, repeats or names an unknown
              one, asks for h2
              without TLS, or contradicts its identity's NextProtos — naming an HTTP
              version the group does not serve, or none it does — and for a group that
              serves no http.Handler given Protocols. The "reason" field names it
              (ADR 0195).
            exit: CONFIG
            name: ProtocolsRefused
            private: "core/net: the group's HTTP protocols cannot be served as configured"
            public: The group's HTTP protocols are misconfigured
            reason: PROTOCOLS_REFUSED
          - code: CodeLoopCapabilityRefused
            doc: |-
              LoopCapabilityRefused is returned by Start for a loop group whose
              LoopValue.Capabilities names something it cannot opt into: an engine, a
              class B capability, which stays off until BENCH.md shows its threshold, or a
              token outside the registry. The "capability" field names it. It is refused,
              never ignored (ADR 0189).
            exit: CONFIG
            name: LoopCapabilityRefused
            private: "core/net: LoopValue.Capabilities names an engine, a class B capability or an unknown token"
            public: The loop group asks for a capability it cannot opt into
            reason: LOOP_CAPABILITY_REFUSED
    types:
      - doc: |-
          AddressValue names one socket to bind. It is a value type so a group's listen
          set is comparable and copyable, and so a configuration file can express it
          directly.
        methods:
          - doc: String renders the address as "network://addr" for logs and error fields.
            name: String
            out:
              - type: string
            recv: value
        name: AddressValue
        struct:
          fields:
            - doc: |-
                Network is the socket family: tcp, tcp4, tcp6, udp, udp4, udp6, unix,
                unixgram or unixpacket.
              name: Network
              tag: json:"network"
              type: string
            - doc: |-
                Addr is the bind target: "host:port" for the IP families, a filesystem
                path for the unix families.
              name: Addr
              tag: json:"addr"
              type: string
      - doc: |-
          CallValue records one completed outbound call for observation, so a caller
          can log, meter or trace every egress without wrapping each call site by hand.

          It is handed to a CallHook once the response body is FINISHED WITH — read to
          the end, failed, or closed — not when the headers arrive. A body's size is
          only known after it has been read, and an over-sized body or a failed close
          happens later still, so a record emitted at the headers could carry neither:
          it reported every call as a clean success of zero bytes. A refused request
          and an unreachable upstream are still reported immediately, because in
          neither case is there a body to wait for.
        name: CallValue
        struct:
          fields:
            - doc: Method is the uppercase HTTP method.
              name: Method
              type: string
            - doc: Host is the authority the call was sent to.
              name: Host
              type: string
            - doc: Path is the request path.
              name: Path
              type: string
            - doc: Status is the HTTP status code, or zero when the call produced no response.
              name: Status
              type: int
            - doc: Bytes is the number of response body bytes read.
              name: Bytes
              type: int64
            - doc: |-
                Duration is the wall-clock time from request start to response headers.
                It deliberately excludes the body: the record is emitted once the body is
                done with, but this field measures the upstream's time to first answer,
                which is the one a slow upstream and a large payload do not share.
              name: Duration
              type: time.Duration
            - doc: |-
                Err is what ended the call: a policy refusal, a transport failure, the
                response ceiling, or a failed close. Nil when the body was read in full.
              name: Err
              type: error
      - doc: |-
          CallHook receives one CallValue per completed outbound call. It is a function
          port rather than an interface because it is a single-method contract with no
          state, and a func keeps the domain free of a dependency on the logger or the
          metrics package: the consumer wires it to whichever it uses.

          A CallHook MUST be safe for concurrent use and MUST NOT block — it runs on the
          calling goroutine, so a slow hook slows every request.
        name: CallHook
        underlying: func(call CallValue)
      - doc: |-
          ClientConfig describes an outbound client. Durations use DurationValue so a
          configuration file can say "5s" rather than a nanosecond count.

          It sits in core beside LimitsValue and TimeoutsValue, which carry the same
          kind of knobs for the inbound half. Keeping both faces' configuration in one
          layer is what lets a consumer decode a whole network stanza against the
          contract package alone, without importing an implementation to name the type
          of a field it is setting.
        name: ClientConfig
        struct:
          fields:
            - doc: BaseURL is the origin every relative path resolves against.
              name: BaseURL
              tag: json:"base_url"
              type: string
            - doc: DialTimeout bounds establishing the TCP connection.
              name: DialTimeout
              tag: json:"dial_timeout"
              type: DurationValue
            - doc: HandshakeTimeout bounds the TLS handshake.
              name: HandshakeTimeout
              tag: json:"handshake_timeout"
              type: DurationValue
            - doc: |-
                ResponseTimeout bounds the wait for response headers after the request
                has been written. It is separate from TotalTimeout so a slow upstream is
                distinguishable from a large body.
              name: ResponseTimeout
              tag: json:"response_timeout"
              type: DurationValue
            - doc: TotalTimeout bounds the whole call, body included.
              name: TotalTimeout
              tag: json:"total_timeout"
              type: DurationValue
            - doc: |-
                MaxResponseSize caps the response body in bytes. A body of exactly this
                size is admitted; only one past it fails the call, and the body is never
                truncated.
              name: MaxResponseSize
              tag: json:"max_response_size"
              type: int64
            - doc: |-
                MaxRedirects caps the redirect chain. Every hop is re-authorised by the
                policy, and a hop to another origin is refused unless RedirectOrigins
                names it, so a redirect cannot walk out of the allowed surface.
              name: MaxRedirects
              tag: json:"max_redirects"
              type: int
            - doc: |-
                RedirectOrigins names the origins, each written scheme://host[:port], a
                redirect may lead to besides the origin of the request that started the
                chain. Empty — the default — refuses with RequestDenied every redirect
                that changes the scheme, the host or the port, https to http included:
                the built-in policies judge the method and the path, so a hop that keeps
                the path and swaps the origin would otherwise pass them. A listed origin
                is followed, and receives none of the DefaultHeaders. An entry that is
                not a bare http or https origin fails New with InvalidAddress.
              name: RedirectOrigins
              tag: json:"redirect_origins"
              type: '[]string'
            - doc: |-
                DefaultHeaders are added to every request that does not already set them
                and is sent to the origin of BaseURL — or, with no BaseURL, to whatever
                origin the request names. They are never sent to another origin: a
                request built for one does not receive them, and a redirect that leaves
                the origin of the request that started the chain is sent without them.
              name: DefaultHeaders
              tag: json:"default_headers"
              type: map[string]string
      - doc: ConnHandlerFunc adapts a plain function to ConnHandler.
        methods:
          - doc: ServeConn implements ConnHandler by calling f.
            in:
              - name: ctx
                type: context.Context
              - name: c
                type: Conn
            name: ServeConn
            out:
              - type: error
            recv: value
        name: ConnHandlerFunc
        underlying: func(ctx context.Context, c Conn) error
      - doc: |-
          DurationValue is a time.Duration that round-trips through JSON as either a Go
          duration string ("30s", "1m30s") or a raw nanosecond count. The SDK's config
          loader (ADR 0028) decodes through a JSON round-trip, and encoding/json renders
          a bare time.Duration as nanoseconds — which would force an operator to write
          30000000000 in a YAML file to mean thirty seconds. This type accepts both and
          always emits the readable form.

          The mixed receivers are required by encoding/json and are not a style slip:
          MarshalJSON must take a value so a non-pointer struct field marshals, and
          UnmarshalJSON must take a pointer so it can assign. The standard library's
          time.Time carries the same asymmetry for the same reason.

          PROMOTION CANDIDATE: this type is domain-neutral and stdlib-only, so it
          belongs in internal/kernel or internal/core/app/config the moment a second domain
          needs it. It is declared here because the repo's bar for a shared primitive is
          two real consumers arising from an actual duplication, and today there is one.
        methods:
          - doc: Duration returns the value as a plain time.Duration.
            name: Duration
            out:
              - type: time.Duration
            recv: value
          - doc: String renders the canonical Go duration form, e.g. "1m30s".
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              MarshalJSON emits the readable duration string so a written-back configuration
              file stays legible.
            name: MarshalJSON
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: value
          - doc: |-
              UnmarshalJSON accepts a quoted Go duration string ("30s") or a bare number of
              nanoseconds, so both a hand-written config file and a machine-generated one
              decode.
            in:
              - name: data
                type: "[]byte"
            name: UnmarshalJSON
            out:
              - type: error
            recv: pointer
        name: DurationValue
        underlying: time.Duration
      - doc: |-
          EngineValue names the engine family a group runs on, passed by Engine (ADR
          0187): the goroutine engine or the loop engine. The zero value, EngineAuto,
          lets the handler's type choose. The backend inside the loop family is
          LoopValue.Backend's.
        methods:
          - doc: String renders the engine as an error field spells it.
            name: String
            out:
              - type: string
            recv: value
        name: EngineValue
        underlying: uint8
      - doc: |-
          HTTP1LimitsValue bounds what one request of the restricted HTTP/1.1 profile
          may carry. Zero means the profile's default, never unbounded; a negative
          field, or one past its maximum, is refused when the codec is built.
        name: HTTP1LimitsValue
        struct:
          fields:
            - doc: |-
                Head bounds the request line, the field lines and the blank line that
                ends them, in bytes: zero selects HTTP1DefaultHead, at most HTTP1MaxHead.
              name: Head
              tag: json:"head"
              type: int
            - doc: |-
                Target bounds the request-target, in bytes: zero selects
                HTTP1DefaultTarget, and it may not exceed Head.
              name: Target
              tag: json:"target"
              type: int
            - doc: |-
                Body bounds the Content-Length a request may declare: zero selects
                HTTP1DefaultBody, at most HTTP1MaxBody.
              name: Body
              tag: json:"body"
              type: int64
      - doc: |-
          HTTP1FieldValue is one field line of a request, as it arrived: its name,
          in the case the client wrote it, and its value with the surrounding
          whitespace removed. Both slices alias the bytes the request was framed from.
        name: HTTP1FieldValue
        struct:
          fields:
            - doc: Name is the field name, validated as an RFC 9110 token.
              name: Name
              type: "[]byte"
            - doc: |-
                Value is the field value, without its leading and trailing spaces and
                tabs; it holds no NUL, CR, LF or other control byte but the tab.
              name: Value
              type: "[]byte"
      - doc: |-
          HTTP1RequestValue is one request of the restricted HTTP/1.1 profile, framed
          by the codec (internal/service/net/http1).

          It is not named RequestValue: that name is the outbound request the Policy
          port judges, and the two never meet. The profile's prefix is the domain's
          way of naming a protocol's value, as SSEEventValue and WSMessageValue do.

          Every slice aliases the bytes the codec read: the value is valid while those
          bytes are, which on the loop engine is until OnBatchEnd returns. A handler
          that keeps a byte past that copies it. Fields is an array, so a value framed
          into a reused HTTP1RequestValue allocates nothing. Auth is a value, not a
          slice: what a link established survives the bytes it was read from.

          A link of a chain may read every field and set Route, Auth and
          Authenticated; writing Consumed, HeadLen or Body changes nothing, since the
          adapter frames with what Parse returned, never with what a link left.
        methods:
          - doc: |-
              Field returns the value of the first field named name and true, or nil and
              false when the request carries none. Names compare case-insensitively on
              A–Z only, so no locale or Unicode folding can make two names equal.
            in:
              - name: name
                type: string
            name: Field
            out:
              - type: "[]byte"
              - type: bool
            recv: pointer
        name: HTTP1RequestValue
        struct:
          fields:
            - doc: Method is the request method, a token.
              name: Method
              type: "[]byte"
            - doc: Target is the request-target exactly as sent, still percent-encoded.
              name: Target
              type: "[]byte"
            - doc: Host is the Host field's value; HasHost says whether it was present.
              name: Host
              type: "[]byte"
            - doc: |-
                Authorization is the Authorization field's value; HasAuthorization says
                whether it was present.
              name: Authorization
              type: "[]byte"
            - doc: |-
                Body is the request content, Content-Length bytes after the head. It is
                empty until the whole body has arrived.
              name: Body
              type: "[]byte"
            - doc: ContentLength is the declared body length, zero when the field is absent.
              name: ContentLength
              type: int64
            - doc: |-
                HeadLen is the length of the head: the request line, the field lines and
                the blank line. It is zero until the head is complete.
              name: HeadLen
              type: int
            - doc: |-
                Consumed is HeadLen plus ContentLength: the bytes this request takes from
                the stream, whatever its method or route. The next pipelined request
                starts there. It is set as soon as the head is complete, before the body
                arrives, so an early answer knows how much it has to drain.
              name: Consumed
              type: int
            - doc: NFields is how many entries of Fields the request filled.
              name: NFields
              type: int
            - doc: |-
                Fields holds the request's field lines in the order they arrived,
                Host, Authorization and Content-Length included.
              name: Fields
              type: "[HTTP1MaxFields]HTTP1FieldValue"
            - doc: HasHost reports whether the request carried a Host field.
              name: HasHost
              type: bool
            - doc: |-
                HasAuthorization reports whether the request carried an Authorization
                field.
              name: HasAuthorization
              type: bool
            - doc: |-
                Close reports whether the client asked to close the connection after
                this request: a Connection field holding the close token.
              name: Close
              type: bool
            - doc: |-
                Lane is the index of the lane that framed the request, from 0 to the
                group's lane count less one — its LoopIO.Loop — set by the loop adapter
                before the handler runs. One lane is one thread or one goroutine, so a
                handler finds its per-lane state in a slice sized at LoopStarter.OnStart,
                with no lock. Parse leaves it as it is; outside the loop adapter it is
                what the caller set.
              name: Lane
              type: int
            - doc: |-
                Path is the request's canonical path, the one target every link of a
                chain routes and judges on, computed once by the codec: the target's
                path up to its query, an absolute-form target reduced to its path once
                its authority matched Host. It is still percent-encoded, and holds no
                dot-segment, no empty segment, no backslash and no encoded slash, dot,
                backslash or NUL: the codec refuses a target that would (400). An
                asterisk-form target, OPTIONS only, is "*".
              name: Path
              type: "[]byte"
            - doc: |-
                Query is the target's query, after its "?" and without it; empty when
                the target has none.
              name: Query
              type: "[]byte"
            - doc: |-
                Route is the identifier of the route a router link matched, zero for
                none. Parse resets it to zero; only a link sets it.
              name: Route
              type: int
            - doc: |-
                Auth is what an authenticating link established: the subject and the
                claims, copied by value into the request, so nothing of them aliases
                bytes the connection reuses. Parse resets it; Authenticated says
                whether a link set it.
              name: Auth
              type: HTTP1AuthValue
            - doc: |-
                Authenticated reports whether an authenticating link verified the
                request's credentials and filled Auth. Parse resets it to false.
              name: Authenticated
              type: bool
      - doc: |-
          HTTP1AuthValue is what an authenticating link of the http1 chain
          established about a request: a subject of at most HTTP1MaxSubject bytes,
          held in an array, and 64 bits of claims the application gives meaning to.
          It is a value, so copying a request copies it, and it never aliases the
          bytes the credentials were read from. The zero value is no subject and no
          claim.
        methods:
          - doc: |-
              SetSubject copies b into the value and reports true, or leaves the value
              as it is and reports false when b is longer than HTTP1MaxSubject.
            in:
              - name: b
                type: "[]byte"
            name: SetSubject
            out:
              - type: bool
            recv: pointer
          - doc: |-
              Subject returns the subject, aliasing the value: valid while the value
              is, and empty when none was set.
            name: Subject
            out:
              - type: "[]byte"
            recv: pointer
          - doc: SetClaims sets the claims.
            in:
              - name: c
                type: uint64
            name: SetClaims
            recv: pointer
          - doc: Claims returns the claims.
            name: Claims
            out:
              - type: uint64
            recv: pointer
          - doc: Reset clears the subject and the claims.
            name: Reset
            recv: pointer
        name: HTTP1AuthValue
        struct:
          unexported: true
      - doc: |-
          HTTP1AccessValue is one request's access-log record, as the http1 chain's
          logging link hands it to an HTTP1AccessLogger: what the request asked, how
          it was routed and answered, and the request fields the link allows, by
          name. It never holds the Authorization field, the query or the body: the
          link refuses to allow a credential field, and the record has no slot for
          the rest. Every slice aliases the request or the response.
        name: HTTP1AccessValue
        struct:
          fields:
            - doc: Lane is the request's lane.
              name: Lane
              type: int
            - doc: Route is the route a router link matched, zero for none.
              name: Route
              type: int
            - doc: Method is the request method.
              name: Method
              type: "[]byte"
            - doc: Path is the request's canonical path, without its query.
              name: Path
              type: "[]byte"
            - doc: |-
                Status is the answer's status code, 200 when the handler left it zero;
                zero for an answer still deferred.
              name: Status
              type: int
            - doc: BodyLen is the length of the answer's body.
              name: BodyLen
              type: int
            - doc: Authenticated reports whether an authenticating link verified the request.
              name: Authenticated
              type: bool
            - doc: Deferred reports whether the answer was deferred to the batch's end.
              name: Deferred
              type: bool
            - doc: NFields is how many entries of Fields the record filled.
              name: NFields
              type: int
            - doc: |-
                Fields holds the allowed request fields the request carried, in the order
                the link was given their names.
              name: Fields
              type: "[HTTP1MaxAccessFields]HTTP1FieldValue"
      - doc: |-
          LoopLayer is the base of a loop middleware's layer: it forwards the eight
          callbacks — OnOpen, OnData, OnTimeout, OnWritable, OnBatchEnd, OnClose,
          Honours and OnStart — to the handler it wraps, and Next returns it. A layer
          embeds it, built by NewLoopLayer, and overrides the callbacks it acts on;
          an override forwards the callback in turn, through the embedded LoopLayer,
          unless the layer answers it itself — a refused connection's bytes, say.
          Honours answers for the wrapped handler, which a LoopOptionHonourer
          answers and any other handler does not; OnStart reaches a LoopStarter and
          stops at any other handler.
        methods:
          - doc: |-
              Next returns the handler the layer wraps.

              IFACE-PLUGIN: the wrapped handler is whatever the next layer, or the
              consumer, wrote.
            name: Next
            out:
              - type: LoopHandler
            recv: value
          - doc: OnOpen forwards to the wrapped handler.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnOpen
            recv: value
          - doc: OnData forwards to the wrapped handler and returns what it consumed.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
              - name: buf
                type: "[]byte"
            name: OnData
            out:
              - type: int
            recv: value
          - doc: OnTimeout forwards to the wrapped handler.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnTimeout
            recv: value
          - doc: OnWritable forwards to the wrapped handler.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
            name: OnWritable
            recv: value
          - doc: OnBatchEnd forwards to the wrapped handler.
            in:
              - name: io
                type: LoopIO
            name: OnBatchEnd
            recv: value
          - doc: OnClose forwards to the wrapped handler.
            in:
              - name: io
                type: LoopIO
              - name: ref
                type: LoopConnRef
              - name: err
                type: error
            name: OnClose
            recv: value
          - doc: |-
              Honours reports whether the wrapped handler honours the option of kind k:
              its own Honours when it is a LoopOptionHonourer, false otherwise.
            in:
              - name: k
                type: OptionKind
            name: Honours
            out:
              - type: bool
            recv: value
          - doc: OnStart forwards to the wrapped handler when it is a LoopStarter.
            in:
              - name: lanes
                type: int
            name: OnStart
            recv: value
        name: LoopLayer
        struct:
          unexported: true
      - doc: |-
          HTTP1ResponseValue is the answer an HTTP1Handler gives to one request.

          The handler sets the status, appends any field lines to Header with the
          codec's writer and the content to Body. The codec writes the status line,
          the Content-Length computed from Body and Connection: close when it is
          needed: the handler never spells the response's framing, so it cannot get it
          wrong.
        name: HTTP1ResponseValue
        struct:
          fields:
            - doc: |-
                Status is the status code, 200 to 999; zero means 200. The profile
                sends no interim response.
              name: Status
              type: int
            - doc: |-
                Header holds the response's extra field lines, each written as
                "Name: value\r\n" by the codec's writer. It never holds Content-Length or
                Connection, which the codec writes.
              name: Header
              type: "[]byte"
            - doc: Body is the response content.
              name: Body
              type: "[]byte"
            - doc: Close asks the codec to close the connection after this response.
              name: Close
              type: bool
            - doc: |-
                Defer, set by the handler, holds the answer back until the end of the
                loop's batch, for work it batches — one database transaction for every
                request of the batch, say. The response value then stays valid, at the
                same address, until HTTP1Batcher.EndBatch returns, and the handler
                completes it there: it fills it and clears Defer. An answer still
                deferred when EndBatch returns is answered 500 and its connection
                closed. Only the loop adapter reads it; AppendResponse does not.
              name: Defer
              type: bool
            - doc: |-
                Pending, set by the handler, hands the answer to the lane's worker
                (HTTP1Worker, R3): the loop adapter sends Job to it and writes the
                answer the worker fills, from the loop's thread, once it comes back.
                Answers after it on the same connection wait for it, in order. A queue
                to the worker that is full answers 503 with Retry-After at once, the
                connection kept; a connection that closes first drops the answer. Pending
                with Defer, or with no worker, is answered 500 and the connection closed.
                Only the loop adapter reads it.
              name: Pending
              type: bool
            - doc: |-
                Job is the integer a pending answer's worker is given: the handler's own
                index of what the work needs, which it copied out of the request, since
                the request's bytes do not outlive the batch.
              name: Job
              type: uint64
      - doc: HTTP1HandlerFunc adapts a plain function to HTTP1Handler.
        methods:
          - doc: ServeHTTP1 implements HTTP1Handler by calling f.
            in:
              - name: req
                type: "*HTTP1RequestValue"
              - name: res
                type: "*HTTP1ResponseValue"
            name: ServeHTTP1
            recv: value
        name: HTTP1HandlerFunc
        underlying: func(req *HTTP1RequestValue, res *HTTP1ResponseValue)
      - doc: |-
          IdentityValue is an opaque TLS identity: a certificate chain, the trust
          anchors used to verify the peer, and the negotiated-version policy. Its String
          and GoString output is always "<redacted>" so an accidental %v, %s or %#v can
          never spill key material into a log line. The only way out is ClientConfig or
          ServerConfig, which mint a fresh *tls.Config per call.

          The zero value is valid and means "no identity" — IsZero reports it.
        methods:
          - doc: |-
              String implements fmt.Stringer and always redacts so key material never
              reaches a log line through %v or %s.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              GoString implements fmt.GoStringer so %#v stays redacted too — fmt bypasses
              String for Go-syntax formatting and would otherwise dump the unexported fields.
            name: GoString
            out:
              - type: string
            recv: value
          - doc: |-
              IsZero reports whether the identity carries no material at all, which is the
              zero value a caller gets when no TLS was configured.
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              ClientConfig returns a fresh *tls.Config for dialling a peer. Each call yields
              a new value so a caller mutating the result cannot affect any other user of
              the same identity.

              "Fresh" covers the slices and the trust pool, not only the outer struct. A
              new *tls.Config whose Certificates and RootCAs still point at the identity's
              own would leave cfg.Certificates[0] = other and cfg.RootCAs.AddCert(evil)
              reaching every other configuration the identity has ever minted, including
              ones already in use — which is the opposite of what an opaque, immutable
              identity is for. Who pays that cost, and how often, is the CALLER's choice
              and not a property of this method: net/client calls it once inside New and
              net/server once per listener, but service/app/mail calls it per connection —
              which for SMTP is per message — deliberately, because StartTLS takes the
              config and a transport that reused one would hand every send a *tls.Config
              another send could still be mutating. Three slice clones are nothing beside
              an SMTP round trip; the sentence that used to sit here said "never per
              request", which was true of the two net callers and false of the third.
            name: ClientConfig
            out:
              - type: "*tls.Config"
            recv: value
          - doc: |-
              ServerConfig returns a fresh *tls.Config for accepting connections, switching
              to mutual TLS when the identity requires a client certificate.
            name: ServerConfig
            out:
              - type: "*tls.Config"
            recv: value
        name: IdentityValue
        struct:
          unexported: true
      - doc: |-
          IdentityFileParams names TLS material to read from the filesystem. Every path
          is optional on its own; the combination is validated once the bytes are in
          hand, by the same core constructor that validates in-memory material.

          It is the disk-sourced twin of IdentityParams and lives beside it on purpose:
          the two describe one domain concept — the material an identity is built from
          — and splitting them across layers would let the rules that govern them drift
          apart, which is exactly what this domain refuses for TLS.
        name: IdentityFileParams
        struct:
          fields:
            - doc: |-
                CertFile is the PEM leaf certificate followed by any intermediates.
                Supplying it without KeyFile is always a configuration slip, never an
                intention, and is refused: an mTLS client that silently degrades to plain
                TLS is a security hole that reports nothing.
              name: CertFile
              tag: json:"cert_file"
              type: string
            - doc: KeyFile is the PEM private key matching CertFile.
              name: KeyFile
              tag: json:"key_file"
              type: string
            - doc: |-
                RootsFile is the PEM CA bundle used to verify the peer. Leaving it empty
                selects the platform trust store, which is right for a public endpoint and
                wrong for a private PKI.
              name: RootsFile
              tag: json:"roots_file"
              type: string
            - doc: |-
                ClientCAFile is the PEM CA bundle a server accepts client certificates
                from. Required whenever RequireClientCert is set.
              name: ClientCAFile
              tag: json:"client_ca_file"
              type: string
            - doc: |-
                ServerName overrides the name verified against the peer certificate.

                This is far more often required than its "optional" typing suggests. Any
                deployment reached through a port forward or a tunnel connects to
                127.0.0.1 while the peer certificate names the real service, and the
                handshake then fails every single time until ServerName is set. Treat it
                as mandatory whenever the dial address is not the certificate's name.
              name: ServerName
              tag: json:"server_name"
              type: string
            - doc: |-
                MinVersion is the lowest accepted TLS version. Zero selects TLS 1.3;
                anything below TLS 1.2 is refused.
              name: MinVersion
              tag: json:"min_version"
              type: uint16
            - doc: NextProtos is the ALPN protocol list, e.g. {"h2", "http/1.1"}.
              name: NextProtos
              tag: json:"next_protos"
              type: "[]string"
            - doc: RequireClientCert turns a server identity into mutual TLS.
              name: RequireClientCert
              tag: json:"require_client_cert"
              type: bool
      - doc: |-
          IdentityParams carries in-memory TLS material. Every field is optional on its
          own; the combination is what is validated by NewIdentity. Sourcing material
          from memory rather than from disk is what lets a consumer pull certificates
          out of a secret manager without ever writing them to a filesystem.
        name: IdentityParams
        struct:
          fields:
            - doc: |-
                CertPEM is the PEM-encoded leaf certificate followed by any intermediates.
                Paired with KeyPEM; supplying one without the other is an error.
              name: CertPEM
              type: "[]byte"
            - doc: KeyPEM is the PEM-encoded private key matching CertPEM.
              name: KeyPEM
              type: "[]byte"
            - doc: |-
                RootsPEM is the PEM-encoded CA bundle used to verify the peer. When empty
                the platform trust store is used, which is the right default for a public
                endpoint and the wrong one for a private PKI.
              name: RootsPEM
              type: "[]byte"
            - doc: |-
                ClientCAPEM is the PEM-encoded CA bundle a server accepts client
                certificates from. It is meaningless on a client identity.
              name: ClientCAPEM
              type: "[]byte"
            - doc: |-
                ServerName overrides the name verified against the peer certificate. It is
                required when connecting to a host by IP whose certificate names a DNS name.
              name: ServerName
              type: string
            - doc: |-
                MinVersion is the lowest accepted TLS version. Zero selects TLS 1.3;
                anything below TLS 1.2 is refused outright.
              name: MinVersion
              type: uint16
            - doc: NextProtos is the ALPN protocol list, e.g. {"h2", "http/1.1"}.
              name: NextProtos
              type: "[]string"
            - doc: |-
                RequireClientCert turns a server identity into mutual TLS: the peer must
                present a certificate that chains to ClientCAPEM.
              name: RequireClientCert
              type: bool
      - doc: |-
          LimitsValue bounds what one listener group may consume. Every field is
          optional; zero means "use the domain default", never "unbounded" — an unset
          ceiling must not be the dangerous one.
        name: LimitsValue
        struct:
          fields:
            - doc: |-
                MaxConns caps concurrent connections in the group. Beyond it, a new
                connection is accepted and immediately closed with ConnLimitReached, which
                is kinder than letting the accept queue silently overflow.
              name: MaxConns
              tag: json:"max_conns"
              type: int
            - doc: |-
                ReadBufferSize sizes the per-connection scratch buffer returned by
                Conn.Buffer.
              name: ReadBufferSize
              tag: json:"read_buffer_size"
              type: int
            - doc: |-
                MaxPacketSize is the largest datagram accepted. A larger one is DROPPED
                and counted in StateValue.OversizedPackets, never delivered truncated:
                the kernel discards the tail, so the prefix that survives reads exactly
                like a complete message and the handler cannot tell the difference.
              name: MaxPacketSize
              tag: json:"max_packet_size"
              type: int
            - doc: Backlog is the listen backlog depth where the platform honours it.
              name: Backlog
              tag: json:"backlog"
              type: int
            - doc: |-
                Shards is the number of independent listeners to open on one address with
                SO_REUSEPORT, each with its own accept loop, to remove accept contention.
                Zero selects the platform default.
              name: Shards
              tag: json:"shards"
              type: int
            - doc: |-
                BatchSize is how many datagrams to read per syscall. Zero selects the
                default; one disables batching.
              name: BatchSize
              tag: json:"batch_size"
              type: int
      - doc: |-
          LoopBackend names the mechanic a loop group runs on (ADR 0186 §D5). The zero
          value is LoopBackendAuto.
        methods:
          - doc: String renders the backend as State and the start line spell it.
            name: String
            out:
              - type: string
            recv: value
        name: LoopBackend
        underlying: uint8
      - doc: |-
          LoopConnRef names one connection of a loop: the ring it lives on, its slot
          in that ring's table and the generation of that slot. It is a comparable value
          with no behaviour, so a handler can key a map with it and hold it without
          holding anything of the engine.

          A slot is reused only once every operation of its previous generation has
          completed, and the generation then moves on, so an operation on a reference
          whose connection closed does nothing and returns LoopStaleRef — it can never
          reach the connection that took the slot since. The zero value names no
          connection.
        name: LoopConnRef
        struct:
          fields:
            - doc: Ring is the ring, inside its loop, that holds the connection.
              name: Ring
              type: uint32
            - doc: Slot is the connection's index in the ring's table.
              name: Slot
              type: uint32
            - doc: |-
                Gen is the slot's generation. It is never zero for a live connection, so
                the zero LoopConnRef is stale on every loop.
              name: Gen
              type: uint32
      - doc: |-
          LoopJobValue is one job a lane sends its worker through LoopOutbound (R3):
          the connection it answers, by its full reference, the slot the sender
          keeps it in with that slot's own generation, and an integer the sender
          gives meaning to. It is a value with no pointer, so the queue that carries
          it holds nothing the garbage collector must scan, and a completion that
          comes back after its connection closed finds a stale reference, never
          another connection.
        name: LoopJobValue
        struct:
          fields:
            - doc: Ref is the connection the job answers.
              name: Ref
              type: LoopConnRef
            - doc: Slot is the sender's index of the job's state.
              name: Slot
              type: uint32
            - doc: Gen is the generation of that slot when the job was sent.
              name: Gen
              type: uint32
            - doc: Arg is the sender's own argument.
              name: Arg
              type: uint64
      - doc: |-
          LoopOutboundValue is what a loop group gives its offloader at Start, once,
          after LoopStarter.OnStart and before any other callback: one outbound per
          lane, indexed by LoopIO.Loop, and the output ceiling of one connection
          (LoopValue.OutputCap, its default applied), which bounds what an offloader
          holds back for a connection while one of its answers is pending.
        name: LoopOutboundValue
        struct:
          fields:
            - doc: Lanes are the lanes' outbounds, by lane.
              name: Lanes
              type: "[]LoopOutbound"
            - doc: OutputCap is LoopValue.OutputCap, its default applied.
              name: OutputCap
              type: int
      - doc: |-
          LoopRingStateValue reports one ring of one loop: counters the loop refreshes
          at the end of each batch, read without stopping it (ADR 0186 §D8).
        name: LoopRingStateValue
        struct:
          fields:
            - doc: Loop is the loop's index in its group.
              name: Loop
              tag: json:"loop"
              type: int
            - doc: Ring is the ring's index in its loop.
              name: Ring
              tag: json:"ring"
              type: int
            - doc: Conns is the number of connections the ring holds now.
              name: Conns
              tag: json:"conns"
              type: int64
            - doc: Accepted is the number of connections the ring accepted.
              name: Accepted
              tag: json:"accepted"
              type: uint64
            - doc: Closed is the number of connections the ring closed.
              name: Closed
              tag: json:"closed"
              type: uint64
            - doc: Batches is the number of loop iterations that reaped this ring.
              name: Batches
              tag: json:"batches"
              type: uint64
            - doc: Completions is the number of completions or events the ring reaped.
              name: Completions
              tag: json:"completions"
              type: uint64
            - doc: |-
                BufferStarved is the number of receives that found no provided buffer
                (ENOBUFS) and waited for one to come back.
              name: BufferStarved
              tag: json:"buffer_starved"
              type: uint64
            - doc: |-
                EnterRetries is the number of times submitting to the kernel was retried
                after it was busy — the completion queue full, typically.
              name: EnterRetries
              tag: json:"enter_retries"
              type: uint64
            - doc: |-
                AcceptPauses is the number of times the ring stopped accepting: the
                descriptor reserve reached, or the process out of descriptors.
              name: AcceptPauses
              tag: json:"accept_pauses"
              type: uint64
            - doc: Evicted is the number of idle connections closed to admit others.
              name: Evicted
              tag: json:"evicted"
              type: uint64
            - doc: |-
                WatchdogFires is the number of times the liveness watchdog saw a stall it
                could observe and acted on it.
              name: WatchdogFires
              tag: json:"watchdog_fires"
              type: uint64
            - doc: |-
                Draining reports a ring the watchdog judged sick: it accepts nothing new
                and closes its connections as they fall idle.
              name: Draining
              tag: json:"draining"
              type: bool
      - doc: |-
          LoopStateValue reports one loop group: the backend it runs on, how it got
          there, how it is sized, and its rings' counters (ADR 0186 §D8). A fallback is
          reported here and by Degraded, never silently.
        name: LoopStateValue
        struct:
          fields:
            - doc: Group is the loop group's name.
              name: Group
              tag: json:"group"
              type: string
            - doc: Backend is the backend in use.
              name: Backend
              tag: json:"backend"
              type: LoopBackend
            - doc: |-
                ProbeStage names the last stage of the kernel probe the backend passed,
                or the stage that failed when the group fell back.
              name: ProbeStage
              tag: json:"probe_stage"
              type: string
            - doc: |-
                Degraded reports that the group runs on a backend other than the best one
                it asked for: auto fell back from io_uring, say.
              name: Degraded
              tag: json:"degraded"
              type: bool
            - doc: DegradedReason names the fallback and its cause when Degraded is set.
              name: DegradedReason
              tag: json:"degraded_reason,omitempty"
              type: string
            - doc: Loops is the number of loops running.
              name: Loops
              tag: json:"loops"
              type: int
            - doc: |-
                LoopsSource says where Loops came from: "explicit", "auto" — LoopsAuto,
                GOMAXPROCS read at Start — or "single" when Loops was zero.
              name: LoopsSource
              tag: json:"loops_source"
              type: string
            - doc: Rings is the number of rings per loop.
              name: Rings
              tag: json:"rings"
              type: int
            - doc: |-
                RingsSource says where Rings came from: "explicit", "derived" from the
                connection bounds and the descriptor limit, or "single" when no bound was
                set or the backend runs one ring.
              name: RingsSource
              tag: json:"rings_source"
              type: string
            - doc: |-
                RLimitNoFile is the effective RLIMIT_NOFILE soft limit read at Start. The
                SDK never raises it; the Go runtime already lifts the soft limit to the
                hard one.
              name: RLimitNoFile
              tag: json:"rlimit_nofile"
              type: uint64
            - doc: |-
                GOMAXPROCS is runtime.GOMAXPROCS(0) read at Start. The SDK never sets it.
              name: GOMAXPROCS
              tag: json:"gomaxprocs"
              type: int
            - doc: |-
                BatchP99 is the 99th percentile of one loop iteration's duration, over the
                loops' recent batches.
              name: BatchP99
              tag: json:"batch_p99"
              type: DurationValue
            - doc: |-
                OutboundRefused counts the jobs a full queue to a worker refused
                (LoopOutboundFull), every lane's: for the http1 adapter, the 503s it
                answered for them. Zero when the group offloads nothing.
              name: OutboundRefused
              tag: json:"outbound_refused"
              type: uint64
            - doc: RingStates reports every ring of every loop, loop by loop.
              name: RingStates
              tag: json:"ring_states"
              type: "[]LoopRingStateValue"
            - doc: |-
                Capabilities reports every optional kernel capability the group's backend
                probed or was told not to, the server's socket probes merged in
                (ADR 0189).
              name: Capabilities
              tag: json:"capabilities,omitempty"
              type: "[]CapabilityValue"
      - doc: |-
          LoopValue configures a loop group's engine (ADR 0186 §D5). It is a value of
          its own, passed by the Loop group option, so LimitsValue and TimeoutsValue
          keep the meanings they publish for every engine. Every field is optional:
          zero selects the domain default, never "unbounded".
        name: LoopValue
        struct:
          fields:
            - doc: |-
                Backend is the mechanic to run on. LoopBackendAuto takes the best one the
                platform's probe reaches and reports any fallback in State; an explicit
                backend the platform cannot run is refused at Start.
              name: Backend
              tag: json:"backend"
              type: LoopBackend
            - doc: |-
                Loops is the number of loops, each one goroutine locked to its OS thread
                on a native backend. Zero selects one; LoopsAuto selects GOMAXPROCS, read
                once at Start. The SDK never sets GOMAXPROCS: sizing the process against
                its loops is the consumer's policy, and State reports both.
              name: Loops
              tag: json:"loops"
              type: int
            - doc: |-
                Rings is the number of descriptor shards inside one loop, each with its
                own table of at most min(RLIMIT_NOFILE, IORING_MAX_FIXED_FILES) entries:
                what lets io_uring serve more connections than RLIMIT_NOFILE. Zero
                derives it, ⌈max(MaxConns, SoftConns) / min(RLIMIT_NOFILE,
                IORING_MAX_FIXED_FILES)⌉, and one when both are zero; that is the only
                formula, and State says where the value came from. epoll and the portable
                backend run one ring whatever it says.
              name: Rings
              tag: json:"rings"
              type: int
            - doc: |-
                CQBatch bounds the completions or events one loop iteration reaps before
                it calls OnBatchEnd. Zero selects the domain default.
              name: CQBatch
              tag: json:"cq_batch"
              type: int
            - doc: |-
                SpillCap is the most unconsumed input, in bytes, one connection may hold
                between OnData calls. Past it the connection is closed with
                LoopSpillFull. Zero selects the domain default.
              name: SpillCap
              tag: json:"spill_cap"
              type: int
            - doc: |-
                OutputCap is the most written and unsent output, in bytes, one
                connection may hold. A Write past it is refused with LoopOutputFull. Zero
                selects the domain default.
              name: OutputCap
              tag: json:"output_cap"
              type: int
            - doc: |-
                SoftConns is the soft connection bound: a connection accepted while the
                group serves more is flagged under pressure (LoopIO.Pressure), so a
                protocol can ask its peer to leave. It refuses nothing; MaxConns does.
                Zero sets no soft bound.
              name: SoftConns
              tag: json:"soft_conns"
              type: int
            - doc: |-
                EvictIdle is how long a connection must have been idle before the loop
                may close it to admit another under hard pressure — the process out of
                descriptors, or MaxConns reached. A connection with unread bytes is
                never evicted. Zero evicts nothing.
              name: EvictIdle
              tag: json:"evict_idle"
              type: DurationValue
            - doc: |-
                Capabilities opts the group into kernel capabilities of class A-code
                (ADR 0189). Each is probed and used where the kernel has it, reported
                "missing" and as a fault where it does not, and never used once
                KITSUNIUM_NET_DISABLE names it. An engine, a class B capability or an
                unknown token is refused at Start with LoopCapabilityRefused. Nil asks
                for none; the class A-kernel capabilities need no opt-in.
              name: Capabilities
              tag: json:"capabilities,omitempty"
              type: "[]Capability"
            - doc: |-
                Outbound is how many jobs one lane's queue to its worker holds (R3),
                when the group's handler offloads (LoopOffloader). A Send past it is
                refused with LoopOutboundFull and counted in LoopStateValue. Zero
                selects 256.
              name: Outbound
              tag: json:"outbound"
              type: int
      - doc: |-
          Middleware decorates a handler with another of the same type.

          It is generic over the handler type so stream and datagram handlers share one
          shape and one Chain helper, instead of the domain carrying two near-identical
          middleware types that would inevitably drift.
        name: Middleware
        typeParams:
          - constraint: any
            name: H
        underlying: func(next H) H
      - doc: |-
          OptionKind names a group option, for the one question a loop group asks of
          its options at Start: is this one honoured (LoopOptionHonourer)? It names
          options, not their values.
        methods:
          - doc: String renders the option's name, as its constructor spells it.
            name: String
            out:
              - type: string
            recv: value
        name: OptionKind
        underlying: uint8
      - doc: PacketHandlerFunc adapts a plain function to PacketHandler.
        methods:
          - doc: ServePacket implements PacketHandler by calling f.
            in:
              - name: ctx
                type: context.Context
              - name: p
                type: Packet
            name: ServePacket
            out:
              - type: error
            recv: value
        name: PacketHandlerFunc
        underlying: func(ctx context.Context, p Packet) error
      - doc: |-
          Phase is where a server sits in its lifecycle. It is reported by State so an
          operator — or a readiness probe — can tell "not yet listening" apart from
          "listening" and from "draining", which a single boolean cannot express.
        methods:
          - doc: String renders the phase for logs and status output.
            name: String
            out:
              - type: string
            recv: value
        name: Phase
        underlying: uint8
      - doc: PolicyFunc adapts a plain function to the Policy interface.
        methods:
          - doc: Allow implements Policy by calling f.
            in:
              - name: req
                type: RequestValue
            name: Allow
            out:
              - type: error
            recv: value
        name: PolicyFunc
        underlying: func(req RequestValue) error
      - doc: |-
          PostFunc is an operation posted to a loop with LoopIO.Post. It runs once, on
          the loop's thread, with the loop's LoopIO and the integer it was posted with.
          It is a plain function rather than a closure so the queue holds no pointer the
          poster built: a top-level function and an index into the caller's own table
          post without allocating.
        name: PostFunc
        underlying: func(io LoopIO, arg uintptr)
      - doc: |-
          ResponseValue is a fully-read outbound response.

          The client returns this rather than an *http.Response on purpose. A returned
          *http.Response makes the caller responsible for closing the body and for
          reading it under a size cap, and a single forgotten Close leaks a connection.
          It also makes an accurate byte count impossible: the size of a body is only
          known once it has been read, so an observation hook firing at header time can
          never report it. Reading and closing inside the client fixes both.
        name: ResponseValue
        struct:
          fields:
            - doc: |-
                Status is the HTTP status code. It is set even when the call also returns
                an error, so a caller can tolerate a specific status deliberately.
              name: Status
              type: int
            - doc: Header is the response header set.
              name: Header
              type: http.Header
            - doc: |-
                Body is the fully-read response body, already bounded by the client's
                size cap. It is nil for a status that carries no body, such as 204.
              name: Body
              type: "[]byte"
      - doc: |-
          RequestValue describes an outbound request to the transport policy.

          Two field choices are load-bearing and were paid for in a real integration:

            - The path is the ESCAPED form, the one that goes on the wire. url.URL.Path
              is already percent-DECODED, so a policy that judges it accepts "%2e%2e"
              — which the upstream then reinterprets as "..". Judging the decoded form
              makes a correctly written allowlist bypassable, so this type does not
              carry it.
            - RawQuery is present because a policy often needs to require a parameter,
              not just permit a path. A read-only policy that cannot see the query
              cannot, for instance, insist that a listing call passes the filter that
              makes its result correct.

          The value is immutable by construction: a policy receives a copy and cannot
          mutate the request it is judging.
        name: RequestValue
        struct:
          fields:
            - doc: Method is the uppercase HTTP method, e.g. "GET".
              name: Method
              type: string
            - doc: Scheme is the URL scheme, e.g. "https".
              name: Scheme
              type: string
            - doc: |-
                Host is the authority, host[:port]. It is carried because a policy that
                sees only the path cannot defend against a redirect that keeps the path
                and swaps the origin.
              name: Host
              type: string
            - doc: |-
                EscapedPath is the percent-encoded path exactly as it will be sent. It is
                never the decoded form — see the type comment.
              name: EscapedPath
              type: string
            - doc: RawQuery is the encoded query string, without the leading "?".
              name: RawQuery
              type: string
      - doc: |-
          SSEEventValue is one Server-Sent Events frame.

          The format has no escape mechanism. A line terminator inside a value is not
          quoted, it SPLITS the value: that is exactly what makes a multi-line payload
          expressible — Data is emitted as one "data:" line per line and the client
          rejoins them with "\n" — and exactly what makes a line terminator inside ID
          or Name unrepresentable. Those are refused rather than truncated, because a
          silently shortened id is a resume token pointing at the wrong place.
        methods:
          - doc: IsZero reports whether the frame carries no field at all.
            name: IsZero
            out:
              - type: bool
            recv: value
          - doc: |-
              Validate reports whether the frame can be carried by the wire format.

              It is separate from the encoder (internal/service/net/sse.AppendEvent) so a
              caller can check a frame before committing to send it, and so the encoder
              can validate everything BEFORE it appends anything — a half-written frame on
              a stream is unrecoverable, since the peer has already read it.
            name: Validate
            out:
              - type: error
            recv: value
        name: SSEEventValue
        struct:
          fields:
            - doc: |-
                ID is the frame's "id" field. A client stores the last non-empty id it
                saw and sends it back as Last-Event-ID when it reconnects, so this is the
                resume token — and it is the CALLER's to mint, because only the caller
                knows what it means. Empty emits no id field, which leaves the client's
                stored id untouched; that is the format's own behaviour, not an omission.
                An id carrying U+0000 is refused with SSEFieldInvalid, as one carrying a
                line terminator is: a client ignores such an id field (WHATWG HTML,
                "process the field"), so its stored resume token would silently stay the
                previous one.
              name: ID
              tag: json:"id"
              type: string
            - doc: |-
                Name is the frame's "event" field — the event type the client dispatches
                under. Empty means the default type, "message".
              name: Name
              tag: json:"event"
              type: string
            - doc: |-
                Data is the payload. Every line terminator it carries (LF, CR or CRLF)
                becomes a separate "data:" line, which the client rejoins with "\n". A
                payload that mixed terminators therefore arrives normalised to LF: the
                value is preserved, its byte spelling is not.
              name: Data
              tag: json:"data"
              type: string
            - doc: |-
                Retry is the reconnection delay hint, emitted as an integer millisecond
                count. Zero emits no retry field.
              name: Retry
              tag: json:"retry"
              type: DurationValue
      - doc: |-
          Capability names one engine of the lattice the operator's switches restrict
          (ADR 0188), iouring > epoll > portable > goroutine, or one optional kernel
          capability a loop group probes (ADR 0189). Its values are the tokens
          KITSUNIUM_NET_ENGINE and KITSUNIUM_NET_DISABLE take; these blocks are the
          registry they are parsed against, and any other token is unknown.
          KITSUNIUM_NET_ENGINE takes an engine only.
        name: Capability
        underlying: string
      - doc: |-
          CapabilityValue reports one optional kernel capability of a loop group: what
          its probe found and whether the group runs with it (ADR 0189). A capability the
          operator switched off is never probed.
        name: CapabilityValue
        struct:
          fields:
            - doc: Name is the capability.
              name: Name
              tag: json:"name"
              type: Capability
            - doc: Class is "a-kernel", "a-code" or "b".
              name: Class
              tag: json:"class"
              type: string
            - doc: |-
                Status is "on" (probed and in use), "available" (probed, not asked for),
                "absent" (probed, the kernel lacks it), "missing" (a class A-code
                capability the code opted into and the kernel lacks: a fault),
                "disabled" (switched off by KITSUNIUM_NET_DISABLE or an unknown token,
                never probed) or "unprobed" (the backend the group runs on has no use for
                it).
              name: Status
              tag: json:"status"
              type: string
            - doc: Reason names the probe stage and the kernel's answer, or the switch.
              name: Reason
              tag: json:"reason,omitempty"
              type: string
      - doc: |-
          OverrideValue reports what the operator's environment did to the engines,
          read once, before any probe (ADR 0188). The zero value is "no override".
        name: OverrideValue
        struct:
          fields:
            - doc: |-
                Source is "environment" when KITSUNIUM_NET_ENGINE or KITSUNIUM_NET_DISABLE
                is set to a non-empty value, and empty otherwise.
              name: Source
              tag: json:"source,omitempty"
              type: string
            - doc: |-
                Raw is what was read, each variable set as NAME=value, separated by a
                space, in the order EnvEngine, EnvDisable.
              name: Raw
              tag: json:"raw,omitempty"
              type: string
            - doc: |-
                Applied is the highest engine the environment lets a group run on, after
                both variables; empty when nothing is set. A group runs on
                min(its code's choice, Applied), skipping what Disabled names.
              name: Applied
              tag: json:"applied,omitempty"
              type: Capability
            - doc: Disabled lists the engines KITSUNIUM_NET_DISABLE switched off.
              name: Disabled
              tag: json:"disabled,omitempty"
              type: "[]Capability"
      - doc: |-
          DatagramStateValue counts what the batched datagram paths drop (ADR 0192):
          the messages a read cut short, and the replies a batch queued that did not
          leave. Each is a drop nobody above a read loop could be told of, so the
          counter is the report.
        name: DatagramStateValue
        struct:
          fields:
            - doc: |-
                TruncatedPackets is the number of messages dropped because the kernel cut
                them: a coalesced message past its buffer (MSG_TRUNC under UDP GRO), or a
                message whose control data did not fit (MSG_CTRUNC). Neither can be split
                into whole datagrams, so none of what survives is delivered.
              name: TruncatedPackets
              tag: json:"truncated_packets"
              type: uint64
            - doc: |-
                GSOOversized is the number of GSO sends the kernel refused with EMSGSIZE:
                a sizing bug, counted, which leaves GSO on.
              name: GSOOversized
              tag: json:"gso_oversized"
              type: uint64
            - doc: |-
                ReplyFailures is the number of replies a BatchReplies group queued during
                a batch that did not leave: Reply had already reported them sent.
              name: ReplyFailures
              tag: json:"reply_failures"
              type: uint64
      - doc: |-
          FaultValue reports one thing the server runs without, or cannot do, now: a
          degraded listener or loop group, a drained ring, a stalled loop group, or an
          environment token the registry does not know (ADR 0188).
        name: FaultValue
        struct:
          fields:
            - doc: |-
                Source says what reported it: "listener", "loop", "ring", "stall",
                "capability", "gso" or "environment".
              name: Source
              tag: json:"source"
              type: string
            - doc: Group names the group concerned; empty for the environment.
              name: Group
              tag: json:"group,omitempty"
              type: string
            - doc: Reason names the fault and, where one exists, the runbook's switch.
              name: Reason
              tag: json:"reason"
              type: string
      - doc: |-
          FallbacksValue counts the times a group started on a lower engine than the one
          its code asked for, because the better one failed, and keeps the last one
          (ADR 0188). An override by the environment is not a fallback.
        name: FallbacksValue
        struct:
          fields:
            - doc: Count is the number of fallbacks since the server was built.
              name: Count
              tag: json:"count"
              type: uint64
            - doc: LastGroup names the group of the last fallback.
              name: LastGroup
              tag: json:"last_group,omitempty"
              type: string
            - doc: LastReason is the last fallback's reason.
              name: LastReason
              tag: json:"last_reason,omitempty"
              type: string
            - doc: LastAt is when the last fallback happened; zero when none did.
              name: LastAt
              tag: json:"last_at"
              type: time.Time
      - doc: |-
          PlatformValue names what the server runs on, so a report says which kernel a
          probe ran against (ADR 0188).
        name: PlatformValue
        struct:
          fields:
            - doc: GOOS is runtime.GOOS.
              name: GOOS
              tag: json:"goos"
              type: string
            - doc: GOARCH is runtime.GOARCH.
              name: GOARCH
              tag: json:"goarch"
              type: string
            - doc: |-
                Kernel is the operating system's release as the platform reports it: the
                uname release on Linux, kern.osrelease on darwin and the BSDs,
                major.minor.build as GetVersion reports it on Windows; empty when it cannot
                be read, and on illumos and Solaris, where the standard library reads none.
              name: Kernel
              tag: json:"kernel,omitempty"
              type: string
            - doc: Go is runtime.Version(), the toolchain the binary was built with.
              name: Go
              tag: json:"go"
              type: string
      - doc: |-
          StateValue is a snapshot of the server's lifecycle and listeners.

          It is a value, so a caller can hold it, log it, or compare it without racing
          the server that produced it.
        methods:
          - doc: |-
              Degraded reports whether the server runs with any fault — a listener or loop
              group that fell back from a requested optimisation, a drained ring, a
              stalled loop group, an unknown environment token — so a caller can assert
              "no silent degradation" in one call. It reads Faults, and still the
              Degraded flags of Listeners and Loops for a value built by hand (ADR 0188).
            name: Degraded
            out:
              - type: bool
            recv: value
        name: StateValue
        struct:
          fields:
            - doc: Phase is where the server sits in its lifecycle.
              name: Phase
              tag: json:"phase"
              type: Phase
            - doc: Listeners describes every bound listener, including any degradation.
              name: Listeners
              tag: json:"listeners"
              type: "[]ListenerStateValue"
            - doc: ActiveConns is the number of connections currently being served.
              name: ActiveConns
              tag: json:"active_conns"
              type: int64
            - doc: TotalConns is the number accepted since the server started.
              name: TotalConns
              tag: json:"total_conns"
              type: uint64
            - doc: RejectedConns is the number turned away by the connection ceiling.
              name: RejectedConns
              tag: json:"rejected_conns"
              type: uint64
            - doc: |-
                OversizedPackets is the number of datagrams dropped for passing their
                group's MaxPacketSize. They are counted rather than delivered because the
                kernel has already discarded the tail, and the prefix that survives is
                indistinguishable from a complete message to the handler receiving it. A
                read loop has nobody to return an error to, so this counter is the report.
              name: OversizedPackets
              tag: json:"oversized_packets"
              type: uint64
            - doc: |-
                AcceptBackoffs is the number of times an accept loop waited after Accept
                failed with anything but its listener closing — the process out of file
                descriptors, typically, with connections still queued. Retrying at once
                would spin a core per listener while the condition lasts; each wait is
                5 ms, doubling to 1 s, and the next accepted connection starts the curve
                over. A count that keeps rising is a server that cannot accept.
              name: AcceptBackoffs
              tag: json:"accept_backoffs"
              type: uint64
            - doc: Datagrams counts what the batched datagram paths drop (ADR 0192).
              name: Datagrams
              tag: json:"datagrams"
              type: DatagramStateValue
            - doc: |-
                Loops reports every loop group (ADR 0186 §D8). It is empty while the
                server serves none.
              name: Loops
              tag: json:"loops,omitempty"
              type: "[]LoopStateValue"
            - doc: |-
                Override reports what KITSUNIUM_NET_ENGINE and KITSUNIUM_NET_DISABLE did
                (ADR 0188).
              name: Override
              tag: json:"override"
              type: OverrideValue
            - doc: |-
                Faults lists everything the server runs without now, the degradations of
                Listeners and Loops included; Degraded is true when it is not empty.
              name: Faults
              tag: json:"faults,omitempty"
              type: "[]FaultValue"
            - doc: Fallbacks counts the engine fallbacks and keeps the last one.
              name: Fallbacks
              tag: json:"fallbacks"
              type: FallbacksValue
            - doc: Platform names the operating system, its release and the toolchain.
              name: Platform
              tag: json:"platform"
              type: PlatformValue
      - doc: |-
          ListenerStateValue reports one bound listener.

          It carries the address actually bound rather than the one requested, and it
          reports any fallback explicitly, so a caller never has to infer either.
        name: ListenerStateValue
        struct:
          fields:
            - doc: Group is the listener group's name.
              name: Group
              tag: json:"group"
              type: string
            - doc: |-
                Address is the address actually bound, which for a port of zero is the
                one the kernel chose rather than the one requested.
              name: Address
              tag: json:"address"
              type: string
            - doc: Network is the socket family.
              name: Network
              tag: json:"network"
              type: string
            - doc: Shards is how many listeners were actually opened on this address.
              name: Shards
              tag: json:"shards"
              type: int
            - doc: |-
                Degraded reports that a requested optimisation was unavailable and the
                server fell back. It is surfaced rather than logged once at startup,
                because a silent fallback is indistinguishable from a working one and
                nobody re-reads yesterday's logs to find out.
              name: Degraded
              tag: json:"degraded"
              type: bool
            - doc: DegradedReason names the fallback in plain words when Degraded is set.
              name: DegradedReason
              tag: json:"degraded_reason,omitempty"
              type: string
            - doc: |-
                Adopted reports a listener inherited from a supervisor rather than bound
                by this process.
              name: Adopted
              tag: json:"adopted"
              type: bool
            - doc: |-
                Exclusive reports that no other socket can bind the listener's address
                while it lives: SO_EXCLUSIVEADDRUSE on Windows, set on a unicast TCP or
                UDP socket this process binds and read back, never set, on an adopted
                one. It is false on every other platform, which has no such option.
              name: Exclusive
              tag: json:"exclusive"
              type: bool
            - doc: |-
                BindWait is how long the bind waited for its address to come free: on
                Windows, a restarted server's address stays taken until the previous
                process's connections end, and the bind is retried, bounded. Zero when
                the first attempt bound.
              name: BindWait
              tag: json:"bind_wait"
              type: DurationValue
      - doc: |-
          TimeoutsValue bounds each phase of a connection separately.

          Per-phase deadlines rather than one overall budget: a slow reader, a slow
          writer and an idle keep-alive connection are three different problems with
          three different right answers, and a single timeout cannot tell them apart.

          Every field is a PER-OPERATION bound, refreshed each time, not a budget for
          the connection's whole life. The distinction is the whole point: a peer
          sending one byte per second violates a per-read bound at once and stays
          inside a lifetime bound until the lifetime runs out.
        name: TimeoutsValue
        struct:
          fields:
            - doc: Read bounds one read from the peer.
              name: Read
              tag: json:"read"
              type: DurationValue
            - doc: Write bounds one write to the peer.
              name: Write
              tag: json:"write"
              type: DurationValue
            - doc: Idle bounds how long a connection may sit with no traffic at all.
              name: Idle
              tag: json:"idle"
              type: DurationValue
            - doc: |-
                Handshake bounds the TLS handshake, which is the phase a hostile peer can
                most cheaply stall. Unlike the others, zero here does NOT mean unbounded:
                the negotiation happens before any handler exists to notice it, so it
                falls back to the domain's default instead.
              name: Handshake
              tag: json:"handshake"
              type: DurationValue
      - doc: WSCloseCode is the status code a Close frame carries (RFC 6455 §7.4).
        methods:
          - doc: |-
              Sendable reports whether the code may appear in a Close frame on the wire.

              It is deliberately a property of the CODE rather than a check inside the
              sender, because the same question is asked twice from opposite directions: a
              peer that sends 1006 is committing a protocol error, and so is this endpoint
              if it ever does. One predicate, both directions, no chance of the two
              drifting apart.
            name: Sendable
            out:
              - type: bool
            recv: value
          - doc: |-
              Echoable returns the code to send back when answering this one.

              It exists because §5.5.1 says an endpoint SHOULD echo the peer's status code,
              and the one code a peer can leave us holding — WSCloseNoStatus, for a Close
              with no payload — is a code §7.4.1 forbids on the wire. Echoing blindly is
              therefore a protocol error waiting for the first well-behaved peer that
              closes without saying why.
            name: Echoable
            out:
              - type: WSCloseCode
            recv: value
        name: WSCloseCode
        underlying: uint16
      - doc: |-
          WSMessageValue is one complete WebSocket application message, reassembled
          from however many frames carried it.

          A message is the unit an application reasons about; a frame is the unit the
          transport reasons about. Handing the application frames would make
          fragmentation — which is the sender's private choice of chunk size, not a
          semantic boundary — visible in every consumer.
        methods:
          - doc: OpCode returns the frame opcode this message is carried under.
            name: OpCode
            out:
              - type: WSOpCode
            recv: value
        name: WSMessageValue
        struct:
          fields:
            - doc: |-
                Binary reports whether the payload is opaque bytes (opcode 0x2) rather
                than UTF-8 text (opcode 0x1). The zero value is text, which is the
                opcode a zero-valued frame would carry anyway.
              name: Binary
              tag: json:"binary"
              type: bool
            - doc: |-
                Data is the reassembled payload. For a text message it is valid UTF-8,
                which the engine verifies on both the receiving and the sending side.
              name: Data
              tag: json:"data"
              type: "[]byte"
      - doc: WSOpCode is a frame's four-bit type field (RFC 6455 §5.2).
        methods:
          - doc: |-
              IsControl reports whether the opcode names a control frame.

              Control frames are the ones that may be injected BETWEEN the fragments of a
              message, so the distinction decides which fragmentation rules apply.
            name: IsControl
            out:
              - type: bool
            recv: value
          - doc: Defined reports whether RFC 6455 assigns this opcode a meaning.
            name: Defined
            out:
              - type: bool
            recv: value
          - doc: String renders the opcode for a log line or an error field.
            name: String
            out:
              - type: string
            recv: value
        name: WSOpCode
        underlying: byte
  - doc: |-
      Package client — the response body size ceiling.

      Package client is the outbound half of the SDK's network domain (ADR 0029):
      an HTTP client whose read-only posture is enforced by the transport rather
      than by the call site.

      Package client — the policy conjunction.

      Package client — the configuration defaults.

      Package client — the path denylist policy.

      Package client — the policy-enforcing RoundTripper.

      Package client — the method allowlist policy.

      Package client — path safety checks applied before any allowlist pattern.

      Package client — the path allowlist policy.

      Package client — the policy constructors.
    functions:
      - doc: |-
          New builds a client from cfg, the TLS identity, the policy and the hook.

          A nil policy is refused rather than defaulted to "allow everything": an
          unguarded egress path wearing the name of a guarded one is worse than none.
        in:
          - name: cfg
            type: corenet.ClientConfig
          - name: id
            type: corenet.IdentityValue
          - name: policy
            type: corenet.Policy
          - name: hook
            type: corenet.CallHook
        name: New
        out:
          - name: c
            type: "*Client"
          - name: err
            type: error
      - doc: |-
          AllowMethods admits only the named HTTP methods. Passing none admits none:
          an allowlist that lost its contents must close, not open.
        in:
          - name: methods
            type: string
        name: AllowMethods
        out:
          - type: corenet.Policy
        variadic: true
      - doc: |-
          AllowPaths admits only paths matching one of the patterns.

          The patterns are supplied UNANCHORED and this constructor anchors them.
          Leaving anchoring to the caller is precisely the omission that turns an
          allowlist into a sieve — `/v1/profiles` would otherwise be satisfied by
          `/anything/v1/profiles/and/more` — and it is invisible in review.
        in:
          - name: patterns
            type: string
        name: AllowPaths
        out:
          - name: policy
            type: corenet.Policy
          - name: err
            type: error
        variadic: true
      - doc: |-
          DenyPaths refuses paths matching one of the patterns. A deny is final and is
          not overridable by an allow pattern, so a narrow exclusion can be carved out
          of a broad allow rule without rewriting it into something unreadable.
        in:
          - name: patterns
            type: string
        name: DenyPaths
        out:
          - name: policy
            type: corenet.Policy
          - name: err
            type: error
        variadic: true
      - doc: |-
          Policies requires every policy to allow the request. Composition is by
          conjunction so that adding a policy can only ever narrow what is permitted.
        in:
          - name: members
            type: corenet.Policy
        name: Policies
        out:
          - type: corenet.Policy
        variadic: true
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      http: net/http
      url: net/url
    path: github.com/kitsunium/sdk/internal/service/net/client
    types:
      - doc: |-
          Client performs guarded outbound HTTP calls.

          Every request it sends — including one forged through the *http.Client that
          HTTP returns — passes through a transport that consults the policy first, so
          the client's posture cannot be bypassed by forgetting a check at a call site.
        methods:
          - doc: |-
              HTTP returns the underlying *http.Client.

              The policy still applies: it lives in the transport, so a third-party SDK
              handed this client cannot escape it. That is precisely why the check was put
              there rather than in Do.
            name: HTTP
            out:
              - type: "*http.Client"
            recv: pointer
          - doc: |-
              Get issues a guarded GET against a path relative to the configured base URL.
              The query is encoded here so no call site has to remember to escape it.
            in:
              - name: ctx
                type: context.Context
              - name: path
                type: string
              - name: query
                type: url.Values
            name: Get
            out:
              - name: resp
                type: corenet.ResponseValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Do sends req and returns a fully-read response.

              It returns a value rather than an *http.Response so the caller cannot leak a
              connection by forgetting to close the body, and so the byte count is known —
              which is what lets the observation hook report an accurate size. The hook
              fires from the body itself, so a caller using the escape hatch is observed on
              exactly the same terms.
            in:
              - name: req
                type: "*http.Request"
            name: Do
            out:
              - name: resp
                type: corenet.ResponseValue
              - name: err
                type: error
            recv: pointer
        name: Client
        struct:
          unexported: true
  - constants:
      - doc: "RefusalNone is no refusal: the request was framed, or needs more bytes."
        name: RefusalNone
        type: Refusal
        value: "0"
      - doc: |-
          RefusalRequestLine is a request line that does not end right after its
          version.
        name: RefusalRequestLine
        type: Refusal
        value: "1"
      - doc: RefusalMethod is an empty method, or one that is not a token.
        name: RefusalMethod
        type: Refusal
        value: "2"
      - doc: |-
          RefusalTarget is an empty request-target, or one holding a control byte,
          DEL or a byte from 0x80 up.
        name: RefusalTarget
        type: Refusal
        value: "3"
      - doc: RefusalVersion is any version but HTTP/1.1.
        name: RefusalVersion
        type: Refusal
        value: "4"
      - doc: RefusalBareCR is a CR not followed by LF.
        name: RefusalBareCR
        type: Refusal
        value: "5"
      - doc: RefusalBareLF is a LF not preceded by CR.
        name: RefusalBareLF
        type: Refusal
        value: "6"
      - doc: RefusalNUL is a NUL inside a field value or name.
        name: RefusalNUL
        type: Refusal
        value: "7"
      - doc: |-
          RefusalControl is a control byte other than the tab, or DEL, inside a
          field value.
        name: RefusalControl
        type: Refusal
        value: "8"
      - doc: |-
          RefusalObsFold is a field line that starts with a space or a tab: the
          obsolete line folding (RFC 9112 §5.2).
        name: RefusalObsFold
        type: Refusal
        value: "9"
      - doc: |-
          RefusalSpaceBeforeColon is whitespace between a field name and its colon
          (RFC 9112 §5.1).
        name: RefusalSpaceBeforeColon
        type: Refusal
        value: "10"
      - doc: |-
          RefusalName is an empty field name, one that is not a token, or a field
          line with no colon.
        name: RefusalName
        type: Refusal
        value: "11"
      - doc: |-
          RefusalTransferEncoding is any Transfer-Encoding field, chunked or not:
          the profile frames by Content-Length alone, so it carries no chunked body
          and no trailer.
        name: RefusalTransferEncoding
        type: Refusal
        value: "12"
      - doc: |-
          RefusalContentLength is a Content-Length that is empty, not decimal
          digits, or longer than corenet.HTTP1MaxContentLengthDigits.
        name: RefusalContentLength
        type: Refusal
        value: "13"
      - doc: |-
          RefusalContentLengthDuplicated is a second Content-Length field, equal to
          the first or not.
        name: RefusalContentLengthDuplicated
        type: Refusal
        value: "14"
      - doc: RefusalAuthorizationDuplicated is a second Authorization field.
        name: RefusalAuthorizationDuplicated
        type: Refusal
        value: "15"
      - doc: RefusalHostDuplicated is a second Host field.
        name: RefusalHostDuplicated
        type: Refusal
        value: "16"
      - doc: |-
          RefusalExpect is an Expect field: the profile sends no interim response,
          so 100-continue cannot be met (RFC 9110 §10.1.1).
        name: RefusalExpect
        type: Refusal
        value: "17"
      - doc: RefusalHeadTooLarge is a head that does not end within the head bound.
        name: RefusalHeadTooLarge
        type: Refusal
        value: "18"
      - doc: RefusalTooManyFields is a field line past corenet.HTTP1MaxFields.
        name: RefusalTooManyFields
        type: Refusal
        value: "19"
      - doc: RefusalTargetTooLong is a request-target past the target bound.
        name: RefusalTargetTooLong
        type: Refusal
        value: "20"
      - doc: RefusalBodyTooLarge is a Content-Length past the body bound.
        name: RefusalBodyTooLarge
        type: Refusal
        value: "21"
      - doc: "RefusalMethodUnsupported is CONNECT: the profile opens no tunnel."
        name: RefusalMethodUnsupported
        type: Refusal
        value: "22"
      - doc: |-
          RefusalTargetPath is a target whose path holds a dot-segment, an empty
          segment, a backslash, an invalid percent-escape, or an encoded slash, dot,
          backslash or NUL: a path two links of a chain, or a link and a backend,
          could read as two different resources.
        name: RefusalTargetPath
        type: Refusal
        value: "23"
      - doc: |-
          RefusalTargetForm is a target in none of the forms the profile serves:
          origin-form, absolute-form with an http or https scheme, or "*" for OPTIONS.
        name: RefusalTargetForm
        type: Refusal
        value: "24"
      - doc: |-
          RefusalTargetHost is an absolute-form target whose authority carries
          userinfo, is empty, or differs from the Host field, or comes with no Host
          field at all.
        name: RefusalTargetHost
        type: Refusal
        value: "25"
    doc: |-
      Package http1 is the restricted HTTP/1.1 profile (ADR 0186 §D6): a codec
      that frames requests out of bytes and appends responses to bytes, doing no
      I/O, and HandleLoop, the adapter that serves it on a loop group. Its request
      value and handler ports are internal/core/net's (HTTP1RequestValue,
      HTTP1Handler, HTTP1Batcher); pkg/v1/net/http1 publishes it (ADR 0186 §D9
      step 12).

      The profile is defined by what it refuses. A request is answered with its
      Refusal's status and Connection: close, and the connection closed, when it
      carries a bare CR or LF, a NUL or another control byte in a value, obs-fold,
      whitespace before a colon, a name outside tchar, any Transfer-Encoding, a
      Content-Length that is not one run of at most ten digits or that repeats, a
      second Authorization or Host, an Expect field, CONNECT, or a head, target or
      body past its bound. None of those reaches a handler, and a handler cannot
      answer one.

      Framing depends on neither the method nor the route: a request takes its
      head plus its Content-Length, which Parse computes, so a body that spells a
      request is never read as one, and an early answer knows what it must drain
      before the next pipelined request.

      	var p http1.Parser                    // the profile's default limits
      	var req corenet.HTTP1RequestValue     // reused: Fields is an array
      	n, r := p.Parse(buf, &req)
      	switch {
      	case r != http1.RefusalNone:
      		out = http1.AppendRefusal(out, r) // then close
      	case n == 0:
      		// more bytes; req.Consumed is set once the head is whole
      	default:
      		h.ServeHTTP1(&req, &res)
      		out, err = http1.AppendResponse(out, &req, &res, false)
      		buf = buf[n:]
      	}

      Nothing here allocates once the caller's buffers have room: Parse slices the
      bytes it was given, and the writer appends precomputed status lines and an
      integer formatted in place.
    functions:
      - doc: |-
          NewParser returns a Parser bounded by l. A zero field selects the profile's
          default; a negative one, a head past corenet.HTTP1MaxHead, a target past the
          head or a body past corenet.HTTP1MaxBody is refused with
          corenet.HTTP1Misconfigured, the field named.
        in:
          - name: l
            type: corenet.HTTP1LimitsValue
        name: NewParser
        out:
          - type: Parser
          - type: error
      - doc: |-
          Continue returns req.Consumed and sets req.Body once buf, the bytes the
          request was framed from, holds the whole body; until then it returns 0. It
          reads no head: a caller that got 0 from Parse with req.HeadLen set calls
          Continue as bytes arrive, and calls Parse only for the next request.
        in:
          - name: buf
            type: "[]byte"
          - name: req
            type: "*corenet.HTTP1RequestValue"
        name: Continue
        out:
          - type: int
      - doc: |-
          Pending returns how many bytes of req's body have yet to arrive when
          buffered bytes of the request are already held: what an early answer to a
          complete head has to read and discard before the next request, or the
          reason to close instead.
        in:
          - name: req
            type: "*corenet.HTTP1RequestValue"
          - name: buffered
            type: int
        name: Pending
        out:
          - type: int
      - doc: |-
          AppendStatusLine appends the status line of status to dst: a registered
          code's line is copied whole, any other code from 200 to 999 gets an empty
          reason phrase, which RFC 9112 §4 allows. A code below 200 is refused with
          corenet.HTTP1ResponseInvalid: the profile sends no interim response. It
          allocates nothing when dst has room.
        in:
          - name: dst
            type: "[]byte"
          - name: status
            type: int
        name: AppendStatusLine
        out:
          - type: "[]byte"
          - type: error
      - doc: |-
          AppendField appends the field line "name: value\r\n" to dst. A name that is
          not a token, a value with a control byte other than the tab, and the names
          the codec writes itself — Content-Length, Connection and Transfer-Encoding —
          are refused with corenet.HTTP1ResponseInvalid, and nothing is appended. It
          allocates nothing when dst has room.
        in:
          - name: dst
            type: "[]byte"
          - name: name
          - name: value
            type: string
        name: AppendField
        out:
          - type: "[]byte"
          - type: error
      - doc: |-
          AppendResponse appends the whole response res answers req with: the status
          line, res.Header, Content-Length and, when res.Close, req.Close or closing
          asks for it, Connection: close, then the body.

          Content-Length is len(res.Body), so the response's framing is the codec's.
          The answer to a HEAD carries the Content-Length and no body. A 204 or a 304
          carries neither, and refuses a body. A status the profile does not send is
          refused with corenet.HTTP1ResponseInvalid, before anything is appended.
          res.Header is copied as it is: it is the handler's, written by AppendField.
          It allocates nothing when dst has room.
        in:
          - name: dst
            type: "[]byte"
          - name: req
            type: "*corenet.HTTP1RequestValue"
          - name: res
            type: "*corenet.HTTP1ResponseValue"
          - name: closing
            type: bool
        name: AppendResponse
        out:
          - type: "[]byte"
          - type: error
      - doc: |-
          AppendRefusal appends the whole answer to r: its status line,
          Content-Length: 0 and Connection: close. The caller closes the connection
          once it is written; nothing a handler does changes it. RefusalNone, and a
          value this package does not return, append a 400. It allocates nothing
          when dst has room.
        in:
          - name: dst
            type: "[]byte"
          - name: r
            type: Refusal
        name: AppendRefusal
        out:
          - type: "[]byte"
      - doc: |-
          HandleLoop adapts h to the loop engine: the corenet.LoopHandler a group
          serves with StreamGroup.HandleLoop. p frames every request, so its limits
          are the group's; the zero Parser is the profile's defaults.

          Each lane frames its requests into a request value of its own, sets its
          Lane, and calls h on the lane's thread, one request at a time, in the order
          they arrived, pipelined ones included. A refused request is answered and
          its connection closed without reaching h. An answer has AppendResponse's
          framing, with Connection: close when the request, the response or the
          loop's soft pressure (LoopIO.Pressure) asks for it, and nothing more is
          read from a connection that closes. The batch's answers are written at
          its end, after h's EndBatch when h is a corenet.HTTP1Batcher, in request
          order on each connection, deferred ones in their place.

          The response value h fills starts every request with a zero status and a
          nil Header and Body: h points them at bytes it owns, valid until the
          answer is taken — when ServeHTTP1 returns, or when EndBatch returns for a
          deferred one. An answer AppendResponse refuses is answered 500 and its
          connection closed, and so is a deferred answer EndBatch left deferred. An
          answer the connection's output refuses (LoopOutputFull: OutputCap is the
          most a connection's answers to one batch may hold) closes the connection
          rather than wait. A request the spill cannot hold whole (LoopValue.SpillCap
          below p's head and body bounds) closes it too, with LoopSpillFull.
        in:
          - name: h
            type: corenet.HTTP1Handler
          - name: p
            type: Parser
        name: HandleLoop
        out:
          - type: "*LoopHandler"
      - doc: |-
          Routes returns the router link of an http1 chain: it matches each request's
          canonical Path against routes, in order, sets HTTP1RequestValue.Route to the
          first match's ID — zero when none matches — and calls the next handler,
          always: a request no route matches still reaches the next links, so an
          authenticating link judges it like any other and only the handler answers
          404. A route matches when its Method is empty or the request's, and its
          Path is the request's, or a prefix of it ending on a segment boundary when
          Prefix is set. An ID of zero or below, a repeated ID, a Path that does not
          start with "/" and a Method that is not a token are refused with
          corenet.HTTP1Misconfigured.
        in:
          - name: routes
            type: RouteValue
        name: Routes
        out:
          - type: corenet.Middleware[corenet.HTTP1Handler]
          - type: error
        variadic: true
      - doc: |-
          Bearer returns the authenticating link of an http1 chain: every request
          whose Route is not in exempt must carry "Authorization: Bearer <token>"
          that v verifies, or is answered 401 with WWW-Authenticate: Bearer and goes
          no further. The link resets Auth and Authenticated first, then lets v set
          the subject and the claims on the request's own Auth — a value, so nothing
          of them aliases the token's bytes — and sets Authenticated before the next
          handler runs. An exempt route reaches the next handler unauthenticated.
          The scheme matches case-insensitively, the token is what follows its
          spaces. A nil v, or an exempt ID of zero or below, is refused with
          corenet.HTTP1Misconfigured.
        in:
          - name: v
            type: corenet.HTTP1BearerVerifier
          - name: exempt
            type: int
        name: Bearer
        out:
          - type: corenet.Middleware[corenet.HTTP1Handler]
          - type: error
        variadic: true
      - doc: |-
          Headers returns the link that gives every answer the field lines pairs
          names, written once by AppendField: name, value, name, value. It sets the
          response's Header before the next handler runs, as a slice with no spare
          capacity, so a handler that appends its own fields copies them rather than
          write into the link's bytes. An odd count, and every name AppendField
          refuses, are refused with corenet.HTTP1Misconfigured.
        in:
          - name: pairs
            type: string
        name: Headers
        out:
          - type: corenet.Middleware[corenet.HTTP1Handler]
          - type: error
        variadic: true
      - doc: |-
          Log returns the access-log link of an http1 chain: once the next handler
          has answered, it hands l one corenet.HTTP1AccessValue — lane, route,
          method, canonical path, status, body length, whether the request was
          authenticated and whether its answer was deferred — with the request's
          fields named in allow, at most corenet.HTTP1MaxAccessFields of them. It
          never logs the query, the body or a credential: Authorization,
          Proxy-Authorization and Cookie in allow are refused with
          corenet.HTTP1Misconfigured, as are a nil l, an empty or repeated name and a
          name that is not a token.
        in:
          - name: l
            type: corenet.HTTP1AccessLogger
          - name: allow
            type: string
        name: Log
        out:
          - type: corenet.Middleware[corenet.HTTP1Handler]
          - type: error
        variadic: true
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
    path: github.com/kitsunium/sdk/internal/service/net/http1
    types:
      - doc: |-
          LoopHandler serves the restricted HTTP/1.1 profile on a loop group: the
          corenet.LoopHandler HandleLoop returns. Its state is per lane — a request
          value, the batch's answers, a flag per connection — and a lane touches only
          its own, found by LoopIO.Loop and built at OnStart, so the data path takes
          no lock and, once a lane's buffers have grown to its batches, allocates
          nothing. It honours no group option itself: a loop group given
          ReadHeaderTimeout or MaxHeaderBytes refuses it at Start, the head bound
          being p's.
        methods:
          - doc: OnOpen implements corenet.LoopHandler. It marks the connection open on its lane.
            in:
              - name: io
                type: corenet.LoopIO
              - name: ref
                type: corenet.LoopConnRef
            name: OnOpen
            recv: pointer
          - doc: |-
              OnData implements corenet.LoopHandler. It frames every whole request at the
              start of buf, serves each in turn, and returns the bytes they took: a
              request still incomplete waits in the loop's spill for its next bytes. A
              refused request, or one whose answer closes the connection, takes the rest
              of buf, which is never read.
            in:
              - name: io
                type: corenet.LoopIO
              - name: ref
                type: corenet.LoopConnRef
              - name: buf
                type: "[]byte"
            name: OnData
            out:
              - type: int
            recv: pointer
          - doc: |-
              OnTimeout implements corenet.LoopHandler. The adapter arms no deadline, so a
              timeout it did not ask for closes the connection.
            in:
              - name: io
                type: corenet.LoopIO
              - name: ref
                type: corenet.LoopConnRef
            name: OnTimeout
            recv: pointer
          - doc: |-
              OnWritable implements corenet.LoopHandler. Nothing waits on it: an answer
              the output refuses closes its connection.
            in:
              - name: io
                type: corenet.LoopIO
              - name: ref
                type: corenet.LoopConnRef
            name: OnWritable
            recv: pointer
          - doc: |-
              OnBatchEnd implements corenet.LoopHandler. When the batch served a request,
              it calls the handler's EndBatch if it has one, then writes the batch's
              answers in order and closes the connections whose answer asked to.
            in:
              - name: io
                type: corenet.LoopIO
            name: OnBatchEnd
            recv: pointer
          - doc: |-
              OnClose implements corenet.LoopHandler. The connection's held answers are
              given up — a pending one's job cancelled, its slot freed when it comes back
              — and its flag stays until the next OnOpen of its slot replaces it; an
              answer of the batch still queued for it is dropped when its Write is
              refused as stale.
            in:
              - name: io
                type: corenet.LoopIO
              - name: ref
                type: corenet.LoopConnRef
              - name: err
                type: error
            name: OnClose
            recv: pointer
          - doc: |-
              OnStart implements corenet.LoopStarter: it builds every lane's state
              before the first callback, so no lane builds its own under a lock.
            in:
              - name: lanes
                type: int
            name: OnStart
            recv: pointer
          - doc: |-
              Worker implements corenet.LoopOffloader: the adapter offloads when its
              handler is a corenet.HTTP1Worker, and nothing otherwise.
            name: Worker
            out:
              - type: corenet.LoopWorker
            recv: pointer
          - doc: |-
              OnOutbound implements corenet.LoopOffloader: each lane keeps its outbound,
              and every connection's holdback is bounded by the output ceiling.
            in:
              - name: v
                type: corenet.LoopOutboundValue
            name: OnOutbound
            recv: pointer
          - doc: |-
              OnDone implements corenet.LoopOffloader, on the lane's thread: the job's
              answer is ready, and its connection is flushed at the batch's end, in
              request order. A connection that closed meanwhile has its slot freed and
              nothing written.
            in:
              - name: io
                type: corenet.LoopIO
              - name: job
                type: corenet.LoopJobValue
            name: OnDone
            recv: pointer
          - doc: |-
              Pending implements corenet.LoopOffloader: a connection holding answers
              behind a pending one is still being answered, so a draining loop keeps it.
            in:
              - name: lane
                type: int
              - name: ref
                type: corenet.LoopConnRef
            name: Pending
            out:
              - type: bool
            recv: pointer
        name: LoopHandler
        struct:
          unexported: true
      - doc: |-
          RouteLayer is the router link Routes builds: the layer it wraps around the
          next handler.
        methods:
          - doc: ServeHTTP1 implements corenet.HTTP1Handler.
            in:
              - name: req
                type: "*corenet.HTTP1RequestValue"
              - name: res
                type: "*corenet.HTTP1ResponseValue"
            name: ServeHTTP1
            recv: pointer
          - doc: |-
              EndBatch implements corenet.HTTP1Batcher: it ends the next handler's
              batch when the next handler is a batcher, so a chain defers answers as
              its handler does.
            in:
              - name: lane
                type: int
            name: EndBatch
            recv: pointer
        name: RouteLayer
        struct:
          unexported: true
      - doc: |-
          BearerLayer is the authenticating link Bearer builds: the layer it wraps
          around the next handler.
        methods:
          - doc: ServeHTTP1 implements corenet.HTTP1Handler.
            in:
              - name: req
                type: "*corenet.HTTP1RequestValue"
              - name: res
                type: "*corenet.HTTP1ResponseValue"
            name: ServeHTTP1
            recv: pointer
          - doc: |-
              EndBatch implements corenet.HTTP1Batcher: it ends the next handler's
              batch when the next handler is a batcher, so a chain defers answers as
              its handler does.
            in:
              - name: lane
                type: int
            name: EndBatch
            recv: pointer
        name: BearerLayer
        struct:
          unexported: true
      - doc: |-
          HeadersLayer is the link Headers builds: the layer it wraps around the next
          handler.
        methods:
          - doc: ServeHTTP1 implements corenet.HTTP1Handler.
            in:
              - name: req
                type: "*corenet.HTTP1RequestValue"
              - name: res
                type: "*corenet.HTTP1ResponseValue"
            name: ServeHTTP1
            recv: pointer
          - doc: |-
              EndBatch implements corenet.HTTP1Batcher: it ends the next handler's
              batch when the next handler is a batcher, so a chain defers answers as
              its handler does.
            in:
              - name: lane
                type: int
            name: EndBatch
            recv: pointer
        name: HeadersLayer
        struct:
          unexported: true
      - doc: |-
          LogLayer is the access-log link Log builds: the layer it wraps around the
          next handler.
        methods:
          - doc: ServeHTTP1 implements corenet.HTTP1Handler.
            in:
              - name: req
                type: "*corenet.HTTP1RequestValue"
              - name: res
                type: "*corenet.HTTP1ResponseValue"
            name: ServeHTTP1
            recv: pointer
          - doc: |-
              EndBatch implements corenet.HTTP1Batcher: it ends the next handler's
              batch when the next handler is a batcher, so a chain defers answers as
              its handler does.
            in:
              - name: lane
                type: int
            name: EndBatch
            recv: pointer
        name: LogLayer
        struct:
          unexported: true
      - doc: |-
          RouteValue is one route of a router link: an identifier the application
          gives meaning to, a method, a canonical path and whether the path is a
          prefix. The identifier is what the chain names a route by — an
          authenticating link's exemptions, an access-log record, the handler's
          switch.
        name: RouteValue
        struct:
          fields:
            - doc: ID identifies the route, from 1; zero is "no route".
              name: ID
              type: int
            - doc: Method is the method the route takes, empty for any.
              name: Method
              type: string
            - doc: |-
                Path is the canonical path the route matches, from "/": the whole of
                it, or its start when Prefix is set.
              name: Path
              type: string
            - doc: |-
                Prefix makes Path match the start of a request's path, on a segment
                boundary: "/health" matches "/health" and "/health/live", never
                "/healthz"; a Path ending in "/" matches whatever follows it.
              name: Prefix
              type: bool
      - doc: |-
          Parser frames requests of the restricted HTTP/1.1 profile under its limits.
          It holds three integers and no state between calls, so one Parser serves
          any number of connections and goroutines. The zero Parser uses the
          profile's default limits.
        methods:
          - doc: Limits returns the bounds the Parser applies, defaults resolved.
            name: Limits
            out:
              - type: corenet.HTTP1LimitsValue
            recv: value
          - doc: |-
              Parse frames the request at the start of buf into req and returns the
              bytes it takes and RefusalNone, once the whole request is there.

              It returns 0 and RefusalNone while more bytes are needed. When the head is
              complete and only the body is missing, req.HeadLen and req.Consumed are
              already set: Continue then waits for the body without reading the head
              again, and an early answer knows how much the request still has to send.

              It returns 0 and the refusal when the bytes break the profile. A refusal
              never depends on bytes past the one that broke a rule, so more bytes never
              turn it into an acceptance; and an accepted request takes the same bytes
              whatever follows it, the next pipelined request included.

              Framing depends on neither the method nor the target: a request takes its
              head plus its Content-Length, a GET's included. Every slice in req aliases
              buf. Parse allocates nothing.
            in:
              - name: buf
                type: "[]byte"
              - name: req
                type: "*corenet.HTTP1RequestValue"
            name: Parse
            out:
              - type: int
              - type: Refusal
            recv: value
        name: Parser
        struct:
          unexported: true
      - doc: |-
          Refusal names the rule a request broke. The zero Refusal, RefusalNone, is
          no refusal at all. Every other one is answered with its Status, Connection:
          close, and the connection closed: the request never reaches a handler, and a
          handler has no say in it.
        methods:
          - doc: String names the refusal for a log line or a metric label.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Status returns the status code the refusal is answered with: 400 for a
              malformed or smuggling-prone request, 413, 414 and 431 for the size bounds,
              417 for Expect and 501 for CONNECT. RefusalNone, and a value this package
              does not return, give 0.
            name: Status
            out:
              - type: int
            recv: value
          - doc: |-
              Err returns the core/net sentinel the refusal belongs to, or nil for
              RefusalNone. Several refusals share a sentinel: the sentinel is what a caller
              branches on, the Refusal is what a log line names.
            name: Err
            out:
              - type: error
            recv: value
        name: Refusal
        underlying: uint8
  - doc: |-
      Package loop is the network domain's event-loop engine (ADR 0186): the
      native backends a plaintext stream group runs on when it is served by a
      corenet.LoopHandler — epoll on every Linux architecture, io_uring after a
      staged probe of the running kernel — and nothing else of the SDK.

      It is a leaf below server (§D3): it imports internal/core/net, the shared
      UnsupportedPlatform of internal/core/proc and the kernel, never server.
      server binds or adopts the listeners, keeps the lifecycle, the admission and
      the drain, and hands the loop duplicated descriptors through one type,
      Listener. The portable backend stays in server: it needs the netpoller.

      A loop is one goroutine locked to its OS thread, owning its rings or its
      epoll instance. Its connection table is pointer-free Go memory the race
      detector sees; every byte the kernel reads or writes — the read arena, the
      spill and output slab — is mapped outside the Go heap (§D7). The engine
      knows bytes, references, deadlines, write pressure and the order of
      writes; it speaks no HTTP.

      An idle connection on a native backend costs at most 256 bytes of Go heap
      — its slot and its timer link — and no mapped byte: its output chunk is
      attached at its first Write and returned once drained.
    functions:
      - doc: |-
          Start resolves cfg against the effective RLIMIT_NOFILE — refusing with
          LoopNoDescriptors when it is zero or unreadable, before the one ring formula
          divides by it — starts the group's loops on the backend cfg asks for, and
          writes one line to cfg.Log naming the backend, the probe stage, any fallback
          reason, the loops, the rings and their sizes. The listeners are the group's
          from the call on, started or refused. An explicit backend the platform has
          no mechanic for is UnsupportedPlatform; one the kernel's probe refused is
          LoopBackendUnavailable.
        in:
          - name: cfg
            type: Config
        name: Start
        out:
          - type: "*Group"
          - type: error
      - doc: |-
          ResolveLoops resolves LoopValue.Loops n and says where the count came from,
          as LoopStateValue.LoopsSource spells it: LoopsAuto is GOMAXPROCS read now,
          "auto"; a positive count is its own, "explicit"; anything else is one,
          "single" (R8). server calls it once per group, at Start, and keeps the
          snapshot for every backend.
        in:
          - name: "n"
            type: int
        name: ResolveLoops
        out:
          - type: int
          - type: string
      - doc: |-
          CheckCapabilities refuses a LoopValue.Capabilities entry the group cannot opt
          into: an engine, a class B capability or an unknown token, with
          LoopCapabilityRefused naming it (ADR 0189). A class A-kernel entry needs no
          opt-in and is accepted as it is. server calls it for the portable backend,
          which never reaches Start.
        in:
          - name: group
            type: string
          - name: v
            type: corenet.LoopValue
        name: CheckCapabilities
        out:
          - type: error
      - doc: |-
          Unprobed is the capability report of a group that runs on backend without
          the leaf's probes — the portable backend: every row unprobed, or disabled
          by what the operator switched off, as disabledBy says (ADR 0189).
        in:
          - name: backend
            type: string
          - name: disabled
            type: "[]corenet.Capability"
          - name: disabledBy
            type: string
        name: Unprobed
        out:
          - type: "[]corenet.CapabilityValue"
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
    path: github.com/kitsunium/sdk/internal/service/net/loop
    types:
      - doc: |-
          Config is what server gives a loop group to start: the group's name, its
          LoopValue, the two options the engine honours itself — MaxConns and
          IdleTimeout — its handler and its listeners.
        name: Config
        struct:
          fields:
            - doc: Group is the group's name, for the start line and State.
              name: Group
              type: string
            - doc: Value is the group's LoopValue.
              name: Value
              type: corenet.LoopValue
            - doc: |-
                MaxConns is LimitsValue.MaxConns: past it a connection is accepted and
                closed at once. Zero sets no ceiling.
              name: MaxConns
              type: int
            - doc: |-
                IdleTimeout closes a connection with no traffic for that long, its
                output sent. Zero sets none.
              name: IdleTimeout
              type: time.Duration
            - doc: Handler is the group's loop handler.
              name: Handler
              type: corenet.LoopHandler
            - doc: |-
                Busy reports whether a connection of a lane waits on its worker (the
                chain's LoopOffloader.Pending, R3): the drain keeps it open, eviction
                passes it by. Nil when nothing offloads.
              name: Busy
              type: "func(lane int, ref corenet.LoopConnRef) bool"
            - doc: Listeners are the sockets to accept on.
              name: Listeners
              type: "[]Listener"
            - doc: Log receives the one start line; nil is standard error.
              name: Log
              type: io.Writer
            - doc: |-
                Disabled are the capabilities the operator switched off: never probed,
                never used, reported "disabled" (ADR 0189).
              name: Disabled
              type: "[]corenet.Capability"
            - doc: |-
                DisabledBy says how they were switched off in State; empty is
                KITSUNIUM_NET_DISABLE.
              name: DisabledBy
              type: string
            - doc: |-
                LoopsSource is where Value.Loops came from, for State, when server
                resolved it already: LoopsAuto read as GOMAXPROCS is "auto". Empty lets
                the group say it itself.
              name: LoopsSource
              type: string
      - doc: |-
          Group is a running loop group: its loops, their threads and their rings.
          Start is the one way to get one, so a Group always runs, or ran and was
          stopped by Shutdown or Close.
        methods:
          - doc: |-
              Shutdown drains the group, until ctx is done; then it closes the rest. The
              drain stops accepting without resetting a connection the kernel already
              completed: every loop cancels its pending accepts — serving one that
              completed as the cancel crossed it —, takes the listen queue until it is
              empty or 65536 connections came from one listener — arrivals outpacing the
              drain, whose rest the close resets —, and the last loop to do so closes
              the listener; then each
              connection closes once it settled, its output sent, a connection that has
              sent nothing yet once it has or stayed silent for a second. A drain cut
              short returns DrainTimeout.
            in:
              - name: ctx
                type: context.Context
            name: Shutdown
            out:
              - type: error
            recv: pointer
          - doc: Close closes every connection and stops every loop now.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: State reports the group's backend and every ring's counters.
            name: State
            out:
              - type: corenet.LoopStateValue
            recv: pointer
          - doc: Rejected is how many connections MaxConns turned away.
            name: Rejected
            out:
              - type: uint64
            recv: pointer
          - doc: Live is how many connections the group serves now.
            name: Live
            out:
              - type: int64
            recv: pointer
        name: Group
        struct:
          unexported: true
      - doc: |-
          Listener is the one hand-off from server to the loop: a listening socket
          server has already bound or adopted, as a duplicated descriptor the loop
          group owns from then on and closes when it stops.
        name: Listener
        struct:
          fields:
            - doc: FD is the duplicated descriptor, close-on-exec.
              name: FD
              type: int
  - doc: |-
      Package server — adoption of listeners inherited from a supervisor.

      Package server — the datagram batch-read abstraction.

      Package server — compile-time interface assertions, kept out of the
      production source per KTN-IFACE-ASSERT-PLACEMENT.

      Package server — the portable datagram reader.

      Package server — the pooled stream connection.

      Package server — compile-time interface assertions, kept out of the
      production source per KTN-IFACE-ASSERT-PLACEMENT.

      Package server — the socket that holds its connection slot until it closes.

      Package server — the completion state of one connection handed to net/http.

      Package server — batch-reader selection on Linux.

      Package server — batch-reader selection on platforms without recvmmsg.

      Package server — every served socket family is left to the kernel here.

      Package server — the two socket families Windows cannot open at all.

      Package server — the bounded TLS handshake.

      Package server — the net/http adapter.

      Package server — the bounds only an HTTP group has.

      Package server — the listener bridge that lets net/http consume our accepts.

      Package server — the width-correct kernel length assignment.

      Package server — the start, accept and drain lifecycle.

      Package server — compile-time interface assertions, kept out of the
      production source per KTN-IFACE-ASSERT-PLACEMENT.

      Package server — listener construction.

      Package server — the listener that hands out close-tracking sockets.

      Package server — a loop group's engine on Linux: the leaf's native backends,
      handed duplicated listener descriptors, or the portable backend.

      Package server — a loop group's engine off Linux: the portable backend.

      Package server — loop groups: HandleLoop, the options a loop group refuses
      at Start, its listeners and its engine in the server's lifecycle (ADR 0186).

      Package server — the portable loop backend: the default engine's accept
      path and goroutines, every handler callback serialised onto one handler
      goroutine (ADR 0186 §D3, §D7).

      Package server — the recvmmsg batched datagram reader.

      Package server — the recvmmsg message header layout.

      Package server — the functional options.

      Package server — the pooled datagram.

      Package server — a group of datagram listeners.

      Package server — datagram listener construction and the read loop.

      Package server — the datagram read loop.

      Package server — per-connection state recycling.

      Package server — the descriptor-bearing socket contract.

      Package server — SO_REUSEPORT support on the BSD family.

      Package server — SO_REUSEPORT support on Linux.

      Package server — the SO_REUSEPORT floor for platforms without it.

      Package server is the inbound half of the SDK's network domain (ADR 0029):
      one unified listener engine for TCP, Unix, TLS and mutual TLS, serving
      pluggable handlers grouped behind shared middlewares and policies.

      Package server — kernel sockaddr decoding for the batched reader.

      Package server — a group of listeners sharing one handler and policy.

      Package server — the per-group connection ceiling.

      Package server — deliberate discard of non-actionable cleanup errors.

      Package server — how a Unix kernel reports a datagram longer than the read
      buffer: by truncating it, which is not an error at all.

      Package server — how Windows reports a datagram longer than the read buffer.
    functions:
      - doc: NewAdmission returns an admission with no reserved address.
        in:
          - name: cfg
            type: AdmissionConfig
        name: NewAdmission
        out:
          - type: "*Admission"
      - doc: |-
          PreHandshake puts the group's accepted connections under a, before any
          TLS byte is read (ADR 0174 D2).
        in:
          - name: a
            type: "*Admission"
        name: PreHandshake
        out:
          - type: GroupOption
      - doc: |-
          Plaintext declares that the group serves no TLS (ADR 0187). Every engine
          honours it. A group given both Plaintext and TLS, in either order, fails
          Start with PlaintextWithTLS. An HTTP group without TLS must give it, or
          fails Start with PlaintextRequired (ADR 0197).
        name: Plaintext
        out:
          - type: GroupOption
      - doc: |-
          Protocols sets the HTTP versions an HTTP group serves, by ALPN identifier —
          "http/1.1" and "h2" — in the order its TLS listeners prefer them, unless the
          group's identity names NextProtos: the listeners then offer the identity's
          entries the list holds, in the identity's order (ADR 0195). Unset, a group
          with TLS serves both, h2 first, and a group without serves HTTP/1.1. It is
          judged at Start: an empty list, an empty, repeated or unknown identifier,
          "h2" without TLS (cleartext HTTP/2 is not served), an identity
          whose NextProtos names a version the list excludes or none it includes, and
          any group that does not serve an http.Handler are refused with
          ProtocolsRefused; a loop group refuses it with LoopOptionUnsupported.

          A request that arrived over HTTP/2 has no http.Hijacker: a handler that
          hijacks its connection — a WebSocket upgrade written by hand, say — serves
          HTTP/1.1 clients only, and a TLS group that relies on it for every client
          says Protocols("http/1.1"), the behaviour it had before HTTP/2 was
          negotiated by default.
        in:
          - name: protos
            type: string
        name: Protocols
        out:
          - type: GroupOption
        variadic: true
      - doc: |-
          Name names the group in State, logs and errors (ADR 0187). On a group
          declared with an empty name it sets the name, which must then be unique like
          any other; on one declared with a name it must repeat it. An empty Name, or
          one that differs from a non-empty declared name, fails Start with
          GroupNameConflict.
        in:
          - name: name
            type: string
        name: Name
        out:
          - type: GroupOption
      - doc: |-
          Engine names the engine family the group runs on (ADR 0187): EngineGoroutine,
          one goroutine per connection, or EngineLoop, the loop engine; Loop then
          picks the loop's backend. The zero value, EngineAuto, lets the handler's
          type choose, which is what a group without the option does. An engine the
          group's handler cannot run on, or that another option contradicts —
          EngineGoroutine with Loop or HandleLoop, EngineLoop with Handle, HandleFunc
          or HandleHTTP or on a datagram group — fails Start with EngineUnsupported,
          and is never replaced by the other engine.
        in:
          - name: e
            type: corenet.EngineValue
        name: Engine
        out:
          - type: GroupOption
      - doc: |-
          WithDrainTimeout bounds how long Shutdown waits for in-flight connections
          before closing them hard.
        in:
          - name: d
            type: time.Duration
        name: WithDrainTimeout
        out:
          - type: Option
      - doc: |-
          WithDrainGrace sets how long Shutdown keeps accepting and serving once
          readiness has turned false, before it closes any listener: the time a load
          balancer or an orchestrator takes to stop routing to the server. Zero, the
          default, starts closing at once: a loop group still takes its listen queue
          before its listener closes. Serve adds it to the drain budget; a caller of
          Shutdown gives it within its ctx.
        in:
          - name: d
            type: time.Duration
        name: WithDrainGrace
        out:
          - type: Option
      - doc: |-
          Loop configures a group's loop engine (ADR 0186 §D5): its backend, its loops
          and rings, and its per-connection and pressure bounds. It is judged at Start,
          once the group's handler is known: a group served by HandleLoop runs on it,
          and a group served by Handle, HandleFunc or HandleHTTP refuses it with
          LoopOptionUnsupported, whichever order the declarations came in. A group with
          no handler fails with HandlerMissing instead, and one given a second handler
          with HandlerAlreadySet. A datagram group refuses it with LoopOptionUnsupported
          too. A group served by HandleLoop without it runs on the zero LoopValue.
        in:
          - name: v
            type: corenet.LoopValue
        name: Loop
        out:
          - type: GroupOption
      - doc: |-
          Listen adds an address to a group. It is variadic-friendly by repetition:
          calling it twice binds two addresses to the same handler, which is how one
          service reaches both a TCP port and a Unix socket.
        in:
          - name: network
          - name: addr
            type: string
        name: Listen
        out:
          - type: GroupOption
      - doc: |-
          TLS turns the group's listeners into TLS listeners, or mutual-TLS ones when
          the identity requires a client certificate. One option covers both, so the
          two cannot drift apart in configuration.
        in:
          - name: id
            type: corenet.IdentityValue
        name: TLS
        out:
          - type: GroupOption
      - doc: |-
          ReadTimeout bounds one read from the peer. On an HTTP group it bounds each
          read of a request body, refreshed per read, the header phase unless
          ReadHeaderTimeout is set, and the wait for the next request unless
          IdleTimeout is.
        in:
          - name: d
            type: time.Duration
        name: ReadTimeout
        out:
          - type: GroupOption
      - doc: WriteTimeout bounds one write to the peer.
        in:
          - name: d
            type: time.Duration
        name: WriteTimeout
        out:
          - type: GroupOption
      - doc: IdleTimeout bounds how long a connection may sit with no traffic.
        in:
          - name: d
            type: time.Duration
        name: IdleTimeout
        out:
          - type: GroupOption
      - doc: |-
          ReadHeaderTimeout bounds the HEADER phase of an HTTP request on its own: the
          request line and the header fields must arrive within d of the connection
          becoming ready for a request, however long the read timeout lets the body
          take.

          The header phase is the one a slowloris attack stalls — a few bytes a
          second, never finishing a line — and it is also the phase a legitimate
          client completes in milliseconds, so it deserves a far shorter bound than a
          read timeout sized for an upload. Unset (or non-positive) keeps what the
          group did before this option existed: the header phase is bounded by the
          read timeout. It has no effect on a group that does not serve HTTP.
        in:
          - name: d
            type: time.Duration
        name: ReadHeaderTimeout
        out:
          - type: GroupOption
      - doc: |-
          MaxHeaderBytes caps how many bytes net/http reads for one request's line and
          header fields. A request over the cap is answered 431 Request Header Fields
          Too Large and never reaches the handler.

          Unset (or non-positive) keeps net/http's own default, 1 MiB
          (http.DefaultMaxHeaderBytes) — which was applying silently before this
          option existed. net/http reads a small fixed allowance past the cap before
          refusing, so the refusal happens a few kilobytes after n, not at the byte.
          It has no effect on a group that does not serve HTTP.
        in:
          - name: "n"
            type: int
        name: MaxHeaderBytes
        out:
          - type: GroupOption
      - doc: |-
          HandshakeTimeout bounds the TLS negotiation on a group's listeners.

          Unset does NOT mean unbounded here, unlike the other three: the handshake is
          the phase a peer can stall before any handler exists to notice, so it falls
          back to the domain's default rather than to no bound at all.
        in:
          - name: d
            type: time.Duration
        name: HandshakeTimeout
        out:
          - type: GroupOption
      - doc: ReadBufferSize sizes the per-connection scratch buffer handed to the handler.
        in:
          - name: "n"
            type: int
        name: ReadBufferSize
        out:
          - type: GroupOption
      - doc: |-
          MaxPacketSize caps the datagram size a group accepts. A larger datagram is
          dropped and counted in State, never delivered as a truncated prefix.
        in:
          - name: "n"
            type: int
        name: MaxPacketSize
        out:
          - type: GroupOption
      - doc: |-
          BatchSize sets how many datagrams one read attempts to collect. One disables
          batching explicitly; zero selects the platform default. Where the platform
          cannot batch, State reports the degradation rather than hiding it.
        in:
          - name: "n"
            type: int
        name: BatchSize
        out:
          - type: GroupOption
      - doc: |-
          BatchReplies makes a datagram group's replies leave per read batch rather than
          one at a time (ADR 0192). Packet.Reply made while the batch is served then
          queues a copy of its datagram and reports it sent, len(b) and nil; the batch's
          replies leave together when it ends, and one that fails then is counted in
          State's Datagrams.ReplyFailures, since its handler has returned. On Linux a UDP
          socket sends them with one sendmmsg, a run of consecutive replies to one peer
          of one size as one UDP GSO send, split at 64 segments or the IP length, and
          one datagram a message once the device refused GSO (EIO); a zoned IPv6 peer
          is written at once, and a Unix datagram socket, a socket with no raw
          descriptor and every other platform send the queue one WriteTo a reply.
          A queue that is full — 128 replies or 256 KiB — sends what it holds early,
          before the batch ends; a reply larger than that room, or to a peer the sink
          cannot address, is written at once and returns the write's own error, never
          counted. Under the option Reply is valid only during the handler's call, as
          Data is:
          the Packet is the read loop's, and one kept and replied to while a later
          batch is served is queued with that batch. A reply made while no batch is
          served is written at once. Without the option, Reply writes at once and
          returns the write's own error. A stream group refuses it with
          LoopOptionUnsupported.
        name: BatchReplies
        out:
          - type: GroupOption
      - doc: |-
          Shards sets how many listeners to open on each of the group's addresses.

          Several listeners on one address is what SO_REUSEPORT buys: the kernel
          load-balances incoming connections across them, so N accept loops never
          contend on one accept queue. Zero selects one per core; one disables sharding.
          Where the platform or the socket family cannot shard, the count collapses to
          one and State reports why rather than staying silent.
        in:
          - name: "n"
            type: int
        name: Shards
        out:
          - type: GroupOption
      - doc: |-
          MaxConns caps how many connections the group serves at once.

          The budget is per group, not per socket: a group listening on a TCP port and
          a Unix socket, or sharded across several listeners, shares one ceiling —
          which is what an operator sizing a server actually means. Beyond it a
          connection is accepted and closed immediately with ConnLimitReached, because
          a refusal the peer can observe beats a timeout it cannot tell from a hang.
          Zero means no ceiling.
        in:
          - name: "n"
            type: int
        name: MaxConns
        out:
          - type: GroupOption
      - doc: |-
          Adopt takes over a socket inherited from a supervisor instead of binding one.

          Socket activation is what makes a zero-downtime restart possible: the
          supervisor holds the bound socket across the exec, so no connection is lost
          and no bind races. The name is the one the unit file publishes in
          LISTEN_FDNAMES. Repeat the option to adopt several sockets into one group.

          A named socket the supervisor did not pass is SocketAdoptFailed, never a
          silent fallback to binding: a service that quietly binds its own port has
          lost exactly the property activation exists to provide.
        in:
          - name: names
            type: string
        name: Adopt
        out:
          - type: GroupOption
        variadic: true
      - doc: New builds a server.
        in:
          - name: opts
            type: Option
        name: New
        out:
          - type: "*Server"
        variadic: true
    imports:
      corehealth: github.com/kitsunium/sdk/internal/core/app/health
      corenet: github.com/kitsunium/sdk/internal/core/net
      http: net/http
      stdnet: net
    path: github.com/kitsunium/sdk/internal/service/net/server
    types:
      - doc: |-
          AdmissionConfig parameterises [NewAdmission]. A zero budget is clamped to
          its default, never read as "unlimited" (ADR 0031, clamp half).
        name: AdmissionConfig
        struct:
          fields:
            - doc: |-
                PerAddress caps the connections one IPv4 address, or one IPv6 /64, may
                hold before their handshake completes. Default 4.
              name: PerAddress
              type: int
            - doc: |-
                Reserved is the budget of the addresses declared with SetReserved.
                Default 8.
              name: Reserved
              type: int
      - doc: |-
          Admission is the pre-handshake admission of ADR 0174 D2: a per-address
          budget of connections that have not completed their handshake, checked
          before any TLS byte is read, with a reserved budget for declared
          addresses so a flood from elsewhere never locks them out. It is safe for
          concurrent use, and shared by a [StreamGroup] ([PreHandshake]) and by any
          transport that runs its own listener.
        methods:
          - doc: |-
              Admit counts a new connection from remote against its address's budget.
              It returns ok false, counted, when the budget is spent: the caller closes
              the connection before reading a byte. Otherwise release, idempotent,
              gives the slot back once the handshake completes or the connection ends.
            in:
              - name: remote
                type: stdnet.Addr
            name: Admit
            out:
              - name: release
                type: func()
              - name: ok
                type: bool
            recv: pointer
          - doc: |-
              SetReserved replaces the reserved addresses. Each is a host or a
              host:port, resolved now; one that does not resolve is given no reserved
              budget, never an unkeyed one.
            in:
              - name: addrs
                type: "[]string"
            name: SetReserved
            recv: pointer
          - doc: Refused counts the connections refused before their handshake.
            name: Refused
            out:
              - type: int64
            recv: pointer
        name: Admission
        struct:
          unexported: true
      - doc: Option configures a Server.
        name: Option
        underlying: func(*Server)
      - doc: GroupOption configures a StreamGroup.
        name: GroupOption
        underlying: func(*StreamGroup)
      - doc: |-
          PacketGroup is a set of datagram sockets sharing one handler, one middleware
          chain and one policy. It mirrors StreamGroup deliberately: the whole point of
          the domain is that a UDP service is wired the same way a TCP one is.
        methods:
          - doc: Name returns the group's name.
            name: Name
            out:
              - type: string
            recv: pointer
          - doc: Handle sets the group's handler, replacing any previous one.
            in:
              - name: h
                type: corenet.PacketHandler
            name: Handle
            out:
              - type: "*PacketGroup"
            recv: pointer
          - doc: HandleFunc sets the group's handler from a plain function.
            in:
              - name: f
                type: corenet.PacketHandlerFunc
            name: HandleFunc
            out:
              - type: "*PacketGroup"
            recv: pointer
          - doc: Use appends middlewares, outermost first.
            in:
              - name: middlewares
                type: corenet.Middleware[corenet.PacketHandler]
            name: Use
            out:
              - type: "*PacketGroup"
            recv: pointer
            variadic: true
        name: PacketGroup
        struct:
          unexported: true
      - doc: |-
          Server owns a set of listener groups and their lifecycle.

          It is safe for concurrent use. Declaration-time mistakes — a duplicate group
          name, an unusable address — are recorded and returned by Start rather than
          panicking or forcing an error check on every declaration, which is what keeps
          wiring a server down to a handful of readable lines.
        methods:
          - doc: |-
              Start binds every group's listeners and begins accepting.

              It returns once every listener is bound, so a caller that gets a nil error
              knows the ports are open — which is what makes a test able to dial
              immediately, and a supervisor able to report readiness honestly.
            in:
              - name: ctx
                type: context.Context
            name: Start
            out:
              - type: error
            recv: pointer
          - doc: |-
              Serve starts the server and blocks until ctx is cancelled, then drains.

              It is the one-call entry point: a caller that has nothing else to do on the
              main goroutine writes Serve and gets startup, blocking and graceful shutdown
              without assembling them. It also returns, after the same drain, once every
              ring of a loop group has been drained by its watchdog: LoopGroupStalled,
              naming the group (ADR 0188).
            in:
              - name: ctx
                type: context.Context
            name: Serve
            out:
              - type: error
            recv: pointer
          - doc: |-
              Shutdown drains the server, severing what remains once ctx expires.

              Readiness turns false first, and the server keeps accepting and serving
              for the grace WithDrainGrace sets, so whoever routes on readiness stops
              sending before anything closes; a server already stopped waits no grace.
              Then the listeners close — a loop group takes its listen queue first, to
              the end unless arrivals outpace it —, and each connection finishes its
              work.
            in:
              - name: ctx
                type: context.Context
            name: Shutdown
            out:
              - type: error
            recv: pointer
          - doc: |-
              Close releases every listener and severs every live connection immediately,
              without draining.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: |-
              Group declares a listener group and returns it for handler attachment.

              It returns the group rather than (group, error) on purpose: a declaration
              error is recorded and surfaced by Start, so the common path stays a single
              chained expression instead of an error check per line.
            in:
              - name: name
                type: string
              - name: opts
                type: GroupOption
            name: Group
            out:
              - type: "*StreamGroup"
            recv: pointer
            variadic: true
          - doc: |-
              PacketGroup declares a datagram listener group and returns it for handler
              attachment. It mirrors Group deliberately: the point of the domain is that a
              UDP service is declared the same way a TCP one is.
            in:
              - name: name
                type: string
              - name: opts
                type: GroupOption
            name: PacketGroup
            out:
              - type: "*PacketGroup"
            recv: pointer
            variadic: true
          - doc: |-
              HTTP declares a group serving h over HTTP on addr, a TCP address — the
              simple API (ADR 0187 §D6, ADR 0197). h is an http.Handler, served by
              net/http on the goroutine engine, or an HTTP1Handler, served by the http1
              profile's codec on the loop engine; a handler that is both needs Engine to
              choose. The group is named "tcp+" + addr unless Name says otherwise, and
              opts apply as they do to Group. Without TLS, Plaintext is required (ADR
              0187 §D7). Every refusal is reported by Start: a nil or typed nil handler
              (HandlerMissing), both interfaces without Engine (HandlerAmbiguous), an
              Engine the handler cannot run on (EngineUnsupported), a type no engine of
              HTTP serves (HandlerUnsupported), Plaintext with TLS (PlaintextWithTLS),
              neither (PlaintextRequired).
            in:
              - name: addr
                type: string
              - name: h
                type: any
              - name: opts
                type: GroupOption
            name: HTTP
            out:
              - type: "*StreamGroup"
            recv: pointer
            variadic: true
          - doc: |-
              TCP declares a group serving h on addr, a TCP address — the simple API.
              h is a ConnHandler, one goroutine per connection, or a LoopHandler, on the
              loop engine; a handler that is both needs Engine to choose. An HTTP
              handler is refused with HandlerUnsupported: HTTP serves it. The group is
              named "tcp+" + addr unless Name says otherwise. Start also refuses a nil or
              typed nil handler (HandlerMissing), both interfaces without Engine
              (HandlerAmbiguous), an Engine the handler cannot run on
              (EngineUnsupported), any other type (HandlerUnsupported) and Plaintext with
              TLS (PlaintextWithTLS); a TCP group serves no HTTP, so it needs neither TLS
              nor Plaintext.
            in:
              - name: addr
                type: string
              - name: h
                type: any
              - name: opts
                type: GroupOption
            name: TCP
            out:
              - type: "*StreamGroup"
            recv: pointer
            variadic: true
          - doc: |-
              UDP declares a datagram group serving h on addr, a UDP address — the
              simple API. h is a PacketHandler; anything else, a LoopHandler included, is
              refused with HandlerUnsupported, and a nil or typed nil handler with
              HandlerMissing. The group is named "udp+" + addr unless Name says
              otherwise; every option the datagram engine does not honour is refused, as
              on any datagram group.
            in:
              - name: addr
                type: string
              - name: h
                type: any
              - name: opts
                type: GroupOption
            name: UDP
            out:
              - type: "*PacketGroup"
            recv: pointer
            variadic: true
          - doc: State returns a snapshot of the server's lifecycle and listeners.
            name: State
            out:
              - type: corenet.StateValue
            recv: pointer
          - doc: |-
              RegisterHealth registers the server's readiness and liveness checks on h,
              both named "net/server" (ADR 0188). Readiness is built from State: ready
              while serving with no stalled loop group. Liveness fails once a loop group
              has stayed stalled for the stall grace, 30 seconds. A receive that never
              completes on a live ring is not watched.
            in:
              - name: h
                type: corehealth.Health
            name: RegisterHealth
            out:
              - type: error
            recv: pointer
        name: Server
        struct:
          unexported: true
      - doc: |-
          StreamGroup is a set of listeners sharing one handler, one middleware chain
          and one policy. Grouping exists so a server can expose the same handler on a
          TCP port and a Unix socket — or two ports with different TLS identities —
          without the caller assembling the wiring twice.
        methods:
          - doc: Name returns the group's name.
            name: Name
            out:
              - type: string
            recv: pointer
          - doc: |-
              Handle sets the group's handler. A group declares one handler, once: a
              second declaration on the same group — Handle, HandleFunc, HandleHTTP or
              HandleLoop, in any order — does not replace the first, and Start returns
              HandlerAlreadySet naming the group (ADR 0186 §D1).
            in:
              - name: h
                type: corenet.ConnHandler
            name: Handle
            out:
              - type: "*StreamGroup"
            recv: pointer
          - doc: |-
              HandleFunc sets the group's handler from a plain function. It exists because
              the overwhelmingly common case is one function, and making that case require
              a named type would be the papercut that decides whether the API feels light.
            in:
              - name: f
                type: corenet.ConnHandlerFunc
            name: HandleFunc
            out:
              - type: "*StreamGroup"
            recv: pointer
          - doc: |-
              HandleHTTP serves an http.Handler over this group's listeners.

              The group keeps its own limits, TLS identity and drain; net/http only does
              the protocol. That split is ADR 0029 D3: reimplementing HTTP would mean
              owning request smuggling defences, HTTP/2 flow control and HPACK to lose,
              not gain, throughput.
            in:
              - name: h
                type: http.Handler
            name: HandleHTTP
            out:
              - type: "*StreamGroup"
            recv: pointer
          - doc: |-
              HandleLoop serves the group on the loop engine (ADR 0186): h is called on
              the loop's own thread for every connection of the group, with the bytes
              each one receives, instead of a goroutine per connection. It is opt-in, and
              plaintext only.

              The group keeps the server's lifecycle — the bind, the adoption of
              inherited sockets, MaxConns, the drain, State — and Loop(v) sizes and
              places the engine: io_uring after a probe of the running kernel, then epoll,
              on Linux, and the portable backend, the default engine's accept path
              serialised onto one handler goroutine, everywhere else. Start refuses a loop
              group given TLS with LoopTLSUnsupported, one given Use or an option neither
              the engine (IdleTimeout, MaxConns, Adopt, Plaintext, Name, Engine) nor h,
              through LoopOptionHonourer, honours with LoopOptionUnsupported — an option
              given counts, its zero value included —, and an explicit backend the
              platform or the kernel cannot run with UnsupportedPlatform or
              LoopBackendUnavailable.

              A callback of h runs on the loop's thread and must not block it: a blocking
              call stalls every connection of its loop. h is declared once, like every
              handler: a second declaration of any kind makes Start return
              HandlerAlreadySet.
            in:
              - name: h
                type: corenet.LoopHandler
            name: HandleLoop
            out:
              - type: "*StreamGroup"
            recv: pointer
          - doc: Use appends middlewares, outermost first.
            in:
              - name: middlewares
                type: corenet.Middleware[corenet.ConnHandler]
            name: Use
            out:
              - type: "*StreamGroup"
            recv: pointer
            variadic: true
          - doc: |-
              UseLoop appends loop middlewares, outermost first, and records the
              OptionLoopMiddleware kind on every call, even with none. A loop group
              wraps its handler in them at Start, after checking that each layer is a
              corenet.LoopLayered whose Next is what it was given and that every one of
              the eight callbacks, sent through a probe chain, reaches the probe: a layer
              that fails either check fails Start with LoopMiddlewareInvalid. The chain
              honours an option when one of its layers or the handler does. A group no
              loop handler serves refuses UseLoop with LoopOptionUnsupported.
            in:
              - name: middlewares
                type: corenet.Middleware[corenet.LoopHandler]
            name: UseLoop
            out:
              - type: "*StreamGroup"
            recv: pointer
            variadic: true
        name: StreamGroup
        struct:
          unexported: true
  - constants:
      - doc: |-
          DefaultKeepAlive is the comment cadence a stream uses when the caller sets
          none. It sits under the idle timeout of every proxy worth naming — nginx and
          most cloud load balancers default to 60 s, some CDNs to 30 — so a stream that
          has nothing to say still proves it is alive before anything cuts it.
        name: DefaultKeepAlive
        type: time.Duration
        value: "15000000000"
      - doc: |-
          DefaultWriteTimeout bounds ONE frame's write. It is not a budget for the
          stream, which by nature has none; it is what stops a peer that has stopped
          reading from pinning a goroutine and a socket buffer forever.
        name: DefaultWriteTimeout
        type: time.Duration
        value: "10000000000"
    doc: |-
      Package sse — an event's wire form, as the WHATWG HTML standard's
      Server-Sent Events format spells it: the encoder that turns a
      corenet.SSEEventValue into the bytes a stream writes, and a comment into the
      one frame no client dispatches.

      The value and the rules it must satisfy are the core's
      (corenet.SSEEventValue.Validate); writing it is a mechanism, and it moved
      here from internal/core/net (ADR 0160 §4).

      Package sse — the stream's functional options and their defaults.

      Package sse is the server side of Server-Sent Events (ADR 0029): a
      unidirectional server→client stream over an ordinary HTTP response, carrying
      text/event-stream frames until either end decides it is over.

      It is written against net/http's own interfaces, not against this SDK's
      listener engine, so it works on any http.Handler. Mounted on the SDK engine
      it additionally observes the server's drain signal, which is what stops an
      endless stream from holding a graceful shutdown open for its whole budget.
    functions:
      - doc: |-
          AppendEvent appends e's wire form to dst and returns the extended slice.

          It appends nothing when the frame is invalid: the whole frame is validated
          first (corenet.SSEEventValue.Validate), so a stream never emits a partial
          one. Appending rather than returning a fresh slice is what lets a stream
          reuse one buffer for its whole life.
        in:
          - name: dst
            type: "[]byte"
          - name: e
            type: corenet.SSEEventValue
        name: AppendEvent
        out:
          - name: wire
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          AppendComment appends a comment frame — a line beginning with ':' that
          every client ignores — to dst.

          It exists for keep-alive: an idle event stream is indistinguishable from a
          dead one to a proxy counting idle seconds, and a comment is the only traffic
          the format offers that cannot be mistaken for an event.
        in:
          - name: dst
            type: "[]byte"
          - name: text
            type: string
        name: AppendComment
        out:
          - name: wire
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          KeepAlive sets the interval between keep-alive comments.

          Zero does NOT mean "never" (ADR 0031): a stream with keep-alive silently
          disabled works perfectly on a developer's loopback and dies at one minute
          behind a real proxy, which is the worst possible place to learn it. Zero is
          clamped to DefaultKeepAlive; a negative interval is refused, because no value
          the SDK invented for it would be defensible. To disable it, say so with
          [WithoutKeepAlive].
        in:
          - name: d
            type: time.Duration
        name: KeepAlive
        out:
          - type: Option
      - doc: |-
          WithoutKeepAlive disables the keep-alive comment entirely.

          It exists so that "never" is something a caller writes on purpose rather than
          something a zero value does to them. Reach for it when the stream already
          carries traffic more often than any intermediary's idle timeout, or when
          there is no intermediary at all.
        name: WithoutKeepAlive
        out:
          - type: Option
      - doc: |-
          WriteTimeout bounds how long one frame's write may take.

          It is deliberately per-frame. A group's WriteTimeout is an absolute deadline
          for the whole response, which for an endless stream means the stream is cut
          at that instant; the stream therefore replaces it with this bound, refreshed
          on every frame. Zero is clamped to DefaultWriteTimeout, negative is refused.
        in:
          - name: d
            type: time.Duration
        name: WriteTimeout
        out:
          - type: Option
      - doc: |-
          Retry sets the reconnection delay the stream advertises in its opening frame.

          It is the server's one chance to control how hard clients come back: a fleet
          that all reconnect on the browser default of about three seconds is a
          thundering herd aimed at a server that has just restarted. Zero sends no
          retry field and leaves the client on its own default.
        in:
          - name: d
            type: time.Duration
        name: Retry
        out:
          - type: Option
      - doc: |-
          New starts an event stream on w and returns it.

          It writes the response headers and flushes them immediately, so the client's
          EventSource opens at once rather than at the first event — which on a stream
          whose first event may be minutes away is the difference between working and
          appearing hung.

          It fails when the response cannot be flushed. That is checked before anything
          is written, because a stream that cannot flush is not a slow stream: every
          frame sits in the transport buffer until the handler returns, and a handler
          that never returns delivers nothing at all.
        in:
          - name: w
            type: http.ResponseWriter
          - name: r
            type: "*http.Request"
          - name: opts
            type: Option
        name: New
        out:
          - name: stream
            type: "*Stream"
          - name: err
            type: error
        variadic: true
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/net/sse
    types:
      - doc: Option configures a Stream.
        name: Option
        underlying: func(*config)
      - doc: |-
          Stream is one open event stream: an HTTP response held open, written one
          frame at a time and flushed after each.

          It is safe for concurrent use. That is not decoration — the keep-alive runs
          on its own goroutine and shares the response writer with the handler, and a
          handler that fans events in from several producers is the normal shape.
        methods:
          - doc: |-
              LastEventID returns the id the client says it last processed, or "" for a
              fresh connection.

              The SDK does NOT replay from it, and the shape of the problem is why. A
              replay buffer held by the stream would be useless by construction: a
              reconnect is a NEW connection and therefore a new stream, so its buffer is
              always empty at exactly the moment a resume needs it. A buffer that outlived
              the stream would be an application store — it has to know how many events to
              keep, how long they stay valid, and whether replaying them is even safe,
              which is a question about the events' meaning and not about the transport.
              The honest thing is to hand the cursor to the handler and let it resume from
              its own log.
            name: LastEventID
            out:
              - type: string
            recv: pointer
          - doc: |-
              Done returns the channel closed when the stream has ended: the client
              disconnected, the server began draining, or Close was called.

              A streaming handler selects on it. Send refuses once it is closed as well, so
              a handler that only ever calls Send in a loop still terminates — but a
              handler that watches this can stop between events instead of discovering it
              on the next one.
            name: Done
            out:
              - type: <-chan struct{}
            recv: pointer
          - doc: |-
              Send writes one event and flushes it.

              The frame is validated before anything is written, so an unrepresentable
              event cannot leave half of itself on a stream the peer is already parsing.
            in:
              - name: event
                type: corenet.SSEEventValue
            name: Send
            out:
              - type: error
            recv: pointer
          - doc: |-
              Comment writes a comment frame — ignored by every client — and flushes it.

              It is what keep-alive is made of, and it is exported because a caller
              sometimes needs to prove liveness at a moment of its own choosing: right
              after the headers, or after a long computation it knows took too long.
            in:
              - name: text
                type: string
            name: Comment
            out:
              - type: error
            recv: pointer
          - doc: |-
              Close ends the stream and joins its goroutines.

              A handler should defer it. Returning from the handler also ends the stream —
              net/http cancels the request context — but Close makes the moment explicit
              and joins the keep-alive rather than leaving it to notice.
            name: Close
            out:
              - type: error
            recv: pointer
        name: Stream
        struct:
          unexported: true
  - constants:
      - doc: |-
          DefaultContentSecurityPolicy is the policy sent when Config names none: the
          page's own origin for everything it loads, no base URL or form target
          elsewhere, and no framing by another page.
        name: DefaultContentSecurityPolicy
        type: string
        value: "\"default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'\""
      - doc: |-
          DefaultReferrerPolicy is the Referrer-Policy sent when Config names none: a
          full referrer to this origin, none at all to another.
        name: DefaultReferrerPolicy
        type: string
        value: "\"same-origin\""
      - doc: |-
          ImmutableCacheControl is the Cache-Control of a file Config.Immutable marks
          content-hashed: stored for a year, shared caches included, and never
          revalidated — a new version has a new name.
        name: ImmutableCacheControl
        type: string
        value: "\"public, max-age=31536000, immutable\""
      - doc: |-
          RevalidateCacheControl is the Cache-Control of every other response: stored,
          but revalidated before each use, so a redeployed page is never served stale.
        name: RevalidateCacheControl
        type: string
        value: "\"no-cache\""
    doc: |-
      Package static — what NewHandler refuses in a Config.

      Package static — opening a name of the tree, and telling a name that names
      nothing from a tree that failed.

      Package static — the lookup failures a Unix kernel reports for a name.

      Package static — the lookup failures Windows reports for a name.

      Package static — one file's response: its caching, its type, its body.

      Package static serves a tree of files from an io/fs.FS over HTTP — what
      http.FileServerFS does, and what it does not (ADR 0130).

      A request path is cleaned from the root before anything is looked up, so a
      ".." never climbs above the tree, whatever the file system does with names.
      A directory is never listed: it is served by its index.html, or it is 404.
      An optional single-page-application fallback serves the root's index.html
      for a path with no extension that names nothing, so client-side routes
      survive a reload while a missing script is still a 404 and never a page of
      HTML. Every response — a file, a redirect, a 404, a 405, a 500 — carries a
      Content-Security-Policy, X-Content-Type-Options: nosniff and a
      Referrer-Policy. A file the caller marks content-hashed is cached for a year
      and never revalidated; everything else is revalidated before each use.

      Only GET and HEAD are answered, and HEAD answers exactly what GET would,
      without the body. Every status goes through the ResponseWriter the handler
      was given, so a wrapping handler that records the status sees every 5xx: a
      file the tree holds but cannot open, stat or seek.
    functions:
      - doc: |-
          NewHandler returns a Handler serving fsys as cfg says. It refuses, with the core
          net sentinel STATIC_MISCONFIGURED and an "option" field naming what, a nil
          fsys, a header value holding a control character, and a Referrer-Policy that
          is not a list of known tokens. It reads nothing from fsys: a tree that
          appears after the handler is built is served once it is there.

          To serve a sub-directory — the "dist" of an embed.FS — hand NewHandler the result
          of fs.Sub. The handler confines request NAMES to the tree it is given; what
          the tree's own entries point at is the file system's business, so serve an
          os.Root's FS rather than os.DirFS where a link could lead out of it.
        in:
          - name: fsys
            type: fs.FS
          - name: cfg
            type: Config
        name: NewHandler
        out:
          - type: "*Handler"
          - type: error
    imports:
      fs: io/fs
      http: net/http
    path: github.com/kitsunium/sdk/internal/service/net/static
    types:
      - doc: |-
          Config says how a tree is served. Its zero value is a working, strict
          configuration: the default policies, no fallback, nothing cached for good.
        name: Config
        struct:
          fields:
            - doc: |-
                ContentSecurityPolicy is sent on every response. Empty sends
                DefaultContentSecurityPolicy; there is no way to send none. A value
                holding a control character is refused at construction.
              name: ContentSecurityPolicy
              type: string
            - doc: |-
                ReferrerPolicy is sent on every response: one of the eight tokens the
                Referrer Policy specification defines, or a comma-separated list of
                them. Empty sends DefaultReferrerPolicy. Any other value is refused at
                construction, because a browser ignores a token it does not know and falls back
                to its own default, which sends the origin to every site.
              name: ReferrerPolicy
              type: string
            - doc: |-
                SinglePageApp serves the root's index.html, with 200, for a path that
                has no extension and names nothing in the tree. A path with an
                extension that names nothing stays a 404, and so does a directory with
                no index.html.
              name: SinglePageApp
              type: bool
            - doc: |-
                Immutable reports whether the file at name — slash-separated, relative
                to the root, as served: "assets/app-3f2a9c.js" — is content-hashed, so
                its response may be cached with ImmutableCacheControl. For a fallback it
                is asked about "index.html", the file actually served. Nil marks
                nothing.
              name: Immutable
              type: func(name string) bool
      - doc: |-
          Handler serves one file tree. It is safe for concurrent use.

          The zero Handler has no tree and answers every request 500, with the
          default headers. Build one with NewHandler.
        methods:
          - doc: |-
              ServeHTTP answers one request: the security headers first, then the method,
              then the name.
            in:
              - name: w
                type: http.ResponseWriter
              - name: r
                type: "*http.Request"
            name: ServeHTTP
            recv: pointer
        name: Handler
        struct:
          unexported: true
  - doc: |-
      Package tlsid loads TLS and mutual-TLS material into the opaque, redacting
      identity declared by internal/core/net (ADR 0029). It is the service half of
      the domain's TLS surface: this package does the filesystem I/O and nothing
      else, delegating every validation decision to core so that in-memory and
      on-disk material are held to exactly the same standard.
    functions:
      - doc: |-
          SPKI returns the pin of a certificate: the SHA-256 of its
          SubjectPublicKeyInfo.
        in:
          - name: c
            type: "*x509.Certificate"
        name: SPKI
        out:
          - type: "[32]byte"
      - doc: |-
          NewIdentity builds an identity over a certificate source and its roots;
          get is asked at every handshake. nil roots are refused: an identity that
          trusts the platform's roots trusts everybody's CA.
        in:
          - name: get
            type: func() (*tls.Certificate, error)
          - name: roots
            type: "*x509.CertPool"
        name: NewIdentity
        out:
          - type: "*Identity"
          - type: error
      - doc: |-
          LoadReloadable reads an identity from files and reloads it in place when
          they change. A reload is refused, counted, and the old identity kept, when
          the new certificate does not parse or match its key, or names another URI
          SAN, or carries another key: a renewal reuses the key, so the pins hold.
          A new roots file is added to the old roots, so a CA rollover trusts the
          union until the process restarts.
        in:
          - name: f
            type: FilesConfig
        name: LoadReloadable
        out:
          - type: "*Identity"
          - type: error
      - doc: |-
          PeerOf returns the peer of a completed handshake, false before one or
          without a peer certificate. Its Chain is set only when the standard
          verifier ran; the identity's own check sees the chain it verified.
        in:
          - name: cs
            type: tls.ConnectionState
        name: PeerOf
        out:
          - type: PeerIdentityValue
          - type: bool
      - doc: |-
          Deadline is when a connection to peer must end: at its certificate's
          NotAfter, or after maxAge from opened, whichever comes first, so a
          revoked or expired identity cannot ride an old connection.
        in:
          - name: peer
            type: PeerIdentityValue
          - name: opened
            type: time.Time
          - name: maxAge
            type: time.Duration
        name: Deadline
        out:
          - type: time.Time
      - doc: |-
          Load reads the named TLS material and returns the validated identity.

          A missing or unreadable file is TLSMaterialInvalid naming the offending
          field, never a silently skipped one: a trust bundle that fails to load must
          not degrade into "trust the platform", and a client keypair that fails to
          load must not degrade into an anonymous connection.
        in:
          - name: p
            type: corenet.IdentityFileParams
        name: Load
        out:
          - name: id
            type: corenet.IdentityValue
          - name: err
            type: error
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      tls: crypto/tls
      url: net/url
      x509: crypto/x509
    path: github.com/kitsunium/sdk/internal/service/net/tlsid
    types:
      - doc: |-
          PeerIdentityValue is what a handshake PROVED about the peer: its verified leaf
          and chain, and the SHA-256 of its SubjectPublicKeyInfo, the pin a member
          is admitted on. Nothing in it comes from a frame the peer wrote.
        name: PeerIdentityValue
        struct:
          fields:
            - doc: Leaf is the peer's verified certificate.
              name: Leaf
              type: "*x509.Certificate"
            - doc: |-
                Chain is the chain the standard verifier built, leaf first; empty
                when tls.ConnectionState.VerifiedChains is, as under the identity's
                own VerifyConnection, which verifies the chain itself (see PeerOf).
              name: Chain
              type: "[]*x509.Certificate"
            - doc: SPKI is the SHA-256 of the leaf's SubjectPublicKeyInfo.
              name: SPKI
              type: "[32]byte"
            - doc: URIs are the leaf's URI SANs.
              name: URIs
              type: "[]*url.URL"
            - doc: "NotAfter is when the leaf expires: a connection is closed by then."
              name: NotAfter
              type: time.Time
      - doc: |-
          Verify is a caller's check of a verified peer, run on EVERY handshake,
          after the chain, the roots and the extended key usage passed. A non-nil
          error fails the handshake (fail-closed).
        name: Verify
        underlying: func(peer PeerIdentityValue) error
      - doc: |-
          Identity is a node's own TLS identity and the roots it trusts, reloadable
          in place. It is safe for concurrent use.
        methods:
          - doc: Certificate returns the identity's current certificate.
            name: Certificate
            out:
              - type: "*tls.Certificate"
              - type: error
            recv: pointer
          - doc: Leaf returns the current certificate, parsed.
            name: Leaf
            out:
              - type: "*x509.Certificate"
              - type: error
            recv: pointer
          - doc: "Roots returns the trusted roots: the union of every roots file read."
            name: Roots
            out:
              - type: "*x509.CertPool"
            recv: pointer
          - doc: ReloadFailures counts the reloads refused so far.
            name: ReloadFailures
            out:
              - type: int64
            recv: pointer
          - doc: |-
              ServerConfig accepts only a client whose chain verifies against the roots
              with clientAuth, then passes check, on every handshake.
            in:
              - name: check
                type: Verify
            name: ServerConfig
            out:
              - type: "*tls.Config"
            recv: pointer
          - doc: |-
              ClientConfig dials only a server whose chain verifies against the roots
              with serverAuth, then passes check, on every handshake. The standard
              verification is replaced by this one, not skipped: it would look for a
              DNS name, and an identity may name a URI only.
            in:
              - name: check
                type: Verify
            name: ClientConfig
            out:
              - type: "*tls.Config"
            recv: pointer
        name: Identity
        struct:
          unexported: true
      - doc: |-
          FilesConfig names the PEM files of a reloadable identity. They are looked
          at no more often than Every, and a renewal is swapped in only when it keeps
          the key and the URI SAN.
        name: FilesConfig
        struct:
          fields:
            - doc: CertFile holds the certificate, its chain may follow it.
              name: CertFile
              type: string
            - doc: KeyFile holds its private key.
              name: KeyFile
              type: string
            - doc: RootsFile holds the roots, trusted as RootCAs AND ClientCAs.
              name: RootsFile
              type: string
            - doc: Every bounds how often the files are looked at; 0 is one second.
              name: Every
              type: time.Duration
  - constants:
      - doc: |-
          CloseCodeLen is the width of the status code that opens a Close frame's
          payload. A Close payload is therefore either empty or at least this long —
          one byte is not "a truncated code", it is a protocol error.
        name: CloseCodeLen
        type: int
        value: "2"
      - doc: MaskLen is the width of the masking key a client prefixes to every frame.
        name: MaskLen
        type: int
        value: "4"
      - doc: |-
          MinHeaderLen is the shortest possible frame header: flags/opcode and the
          mask bit with a 7-bit length.
        name: MinHeaderLen
        type: int
        value: "2"
      - doc: |-
          MaxHeaderLen is the longest possible frame header: the two fixed bytes, a
          64-bit extended length, and a masking key.
        name: MaxHeaderLen
        type: int
        value: "14"
      - doc: |-
          DefaultPingInterval is how often an idle connection proves the peer is still
          there. It sits under the idle timeout of every proxy worth naming (nginx and
          most cloud load balancers default to 60 s), so a connection that has nothing
          to say still survives the intermediaries between it and its peer.
        name: DefaultPingInterval
        type: time.Duration
        value: "30000000000"
      - doc: |-
          DefaultWriteTimeout bounds ONE frame's write. A connection has no total write
          budget by nature; this is what stops a peer that has stopped reading from
          pinning a goroutine and a socket buffer forever.
        name: DefaultWriteTimeout
        type: time.Duration
        value: "10000000000"
      - doc: |-
          DefaultMaxMessageSize is the ceiling on one reassembled message. It exists
          because a message's size is chosen by the PEER, one 64-bit field at a time,
          and fragmentation lets that peer keep choosing until the process dies.
        name: DefaultMaxMessageSize
        type: int64
        value: 1 << 20
      - doc: |-
          DefaultMaxFrameSize is the ceiling on a single frame's announced payload. It
          is checked before any buffer is sized, which is the whole point: the number
          being checked is the number the attacker wrote.
        name: DefaultMaxFrameSize
        type: int64
        value: 1 << 20
    doc: |-
      Package websocket — the closing handshake's payload (RFC 6455 §5.5.1): a
      two-byte status code and an optional UTF-8 reason, written and read here.
      The close code and the predicates that govern it — Sendable, Echoable — are
      the domain's (corenet.WSCloseCode); this is their wire form (ADR 0160 §4).

      Package websocket — the frame header and its wire form (RFC 6455 §5).

      Reading and writing frames is this package's mechanism, not the domain's
      contract (ADR 0160 §4): it moved here from internal/core/net, which keeps
      what a second implementation would share — the opcode, the close code, the
      message and the control-frame ceiling (corenet.WSMaxControlPayload).

      Package websocket — the RFC 6455 §4.2 opening handshake.

      Package websocket — the opening handshake's key exchange (RFC 6455 §4.1,
      §4.2.2): the check that a Sec-WebSocket-Key is a nonce, and the digest that
      answers it. The protocol's constants — the GUID, the version, the header
      names — are the domain's (corenet.WSGUID and its neighbours).

      Package websocket — the connection's functional options and their defaults.

      Package websocket — the UTF-8 rule a text message must satisfy (RFC 6455
      §8.1), checked on the bytes as they come off and go onto the wire. The
      message itself is the domain's value (corenet.WSMessageValue).

      Package websocket is the server side of RFC 6455: an HTTP request upgraded
      into a bidirectional, message-oriented connection over the same socket.

      It is written against net/http's own interfaces, not against this SDK's
      listener engine, so it works inside any http.Handler. Mounted on the SDK
      engine it additionally observes the server's drain signal, which is what
      stops a connection that by design never ends from being severed under its
      handler on every deployment.

      permessage-deflate and every other extension are deliberately NOT negotiated;
      the reserved frame bits an extension would use are refused as protocol
      errors. See the package CLAUDE.md.
    functions:
      - doc: |-
          AppendClosePayload appends a Close frame's payload — a two-byte status code
          followed by an optional UTF-8 reason — to dst.

          It refuses a code that must not appear on the wire and a reason that would
          push the control frame past its 125-byte ceiling. Both refusals happen before
          anything is appended.
        in:
          - name: dst
            type: "[]byte"
          - name: code
            type: corenet.WSCloseCode
          - name: reason
            type: string
        name: AppendClosePayload
        out:
          - name: wire
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          ParseClosePayload reads a received Close frame's payload.

          An empty payload is legal and reports corenet.WSCloseNoStatus — the value
          that exists to describe exactly this, and that must never be sent. A
          ONE-byte payload is not a truncated code to be salvaged: it is a protocol
          error, and treating it as anything else would let a peer choose which half
          of the code this endpoint reads.
        in:
          - name: b
            type: "[]byte"
        name: ParseClosePayload
        out:
          - name: code
            type: corenet.WSCloseCode
          - name: reason
            type: string
          - name: err
            type: error
      - doc: |-
          FrameHeaderLen returns the full header length announced by the first two
          bytes of a frame, or 0 when fewer than two bytes are available.

          It exists so a reader can take exactly two bytes, learn how many more the
          header needs, and take exactly those — never speculating past the header into
          a payload it has not yet bounded.
        in:
          - name: b
            type: "[]byte"
        name: FrameHeaderLen
        out:
          - type: int
      - doc: |-
          ParseFrameHeader parses a COMPLETE frame header and enforces every rule
          RFC 6455 states about it that does not depend on which side sent it.

          The masking requirement is deliberately NOT here: it is the one rule whose
          answer depends on the direction of travel, so it lives in
          [FrameHeaderValue.ValidateFromClient] where the direction is named. Every
          other rule — reserved bits, reserved opcodes, control-frame shape, minimal
          length encoding — is absolute and is checked here, once.
        in:
          - name: b
            type: "[]byte"
        name: ParseFrameHeader
        out:
          - name: header
            type: FrameHeaderValue
          - name: err
            type: error
      - doc: |-
          ApplyMask XORs payload in place with the frame's masking key.

          The transform is its own inverse, so the same call unmasks what it masked.
          It is done in place because the payload has already been read into the
          buffer that will be handed to the application: copying it out to unmask would
          double the cost of every frame for no gain.

          It runs over EVERY inbound byte and there is no way to opt out — RFC 6455
          §5.1 requires every client-to-server frame to be masked — so it moves a
          machine word at a time rather than a byte at a time. A CPU profile of a 4 KiB
          receive attributed 89 % of the whole path to the byte-at-a-time form; the
          word form is measured at sixteen times its throughput at that size, and the
          compiler renders each word as one memory-destination XOR with no vector
          instruction, no assembly and no unsafe.pointer anywhere.

          # Why the byte order cancels

          [binary.LittleEndian] is used for BOTH the payload word and the key word, and
          that is the entire endianness argument. A fixed-order decode E is a bijection
          between eight bytes and a uint64 under which XOR is bytewise —
          E(a)^E(b) = E(a XOR b), because each byte occupies its own bit field — so
          decoding, XORing and re-encoding with ONE order reproduces the byte-for-byte
          XOR on every machine, big-endian included. What is unsafe is not the choice
          of order but MIXING two, or reinterpreting the slice as words directly, which
          is native-order and would silently disagree with a little-endian key on a
          big-endian host. Neither appears here, and neither can be added without
          changing the one order this function names.
        in:
          - name: payload
            type: "[]byte"
          - name: key
            type: "[MaskLen]byte"
        name: ApplyMask
      - doc: |-
          AppendFrame appends one server frame to dst and returns the extended slice.

          The frame is never masked, because RFC 6455 §5.1 forbids a server from
          masking and a client that receives a masked frame fails the connection. That
          is expressed by the absence of a parameter rather than by a documented
          default: there is no argument a caller could pass to get it wrong.

          Appending rather than allocating is what lets a connection reuse one buffer
          for its whole life.
        in:
          - name: dst
            type: "[]byte"
          - name: op
            type: corenet.WSOpCode
          - name: final
            type: bool
          - name: payload
            type: "[]byte"
        name: AppendFrame
        out:
          - name: wire
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Upgrade completes the RFC 6455 opening handshake and returns the connection.

          On failure it has already written an HTTP response — a 426 carrying the
          version this server speaks, a 400, a 403 or a 405 as the fault requires — so
          the handler has nothing left to answer and should simply return.

          The socket is taken over from net/http, which means it is no longer the HTTP
          server's to close, nor this SDK's listener engine's. Both are told, and the
          connection is the handler's until it closes it.
        in:
          - name: w
            type: http.ResponseWriter
          - name: r
            type: "*http.Request"
          - name: opts
            type: Option
        name: Upgrade
        out:
          - name: conn
            type: "*Conn"
          - name: err
            type: error
        variadic: true
      - doc: |-
          AcceptKey computes the Sec-WebSocket-Accept value for a client's
          Sec-WebSocket-Key (RFC 6455 §4.2.2 step 5).

          The digest is SHA-1 by the RFC's own instruction. It is not a security
          primitive here and is not used as one: its job is to prove the server parsed
          the handshake rather than replaying it, so that a cache holding a stale 101
          cannot be mistaken for a live upgrade.
        in:
          - name: key
            type: string
        name: AcceptKey
        out:
          - type: string
      - doc: |-
          ValidateKey reports whether a Sec-WebSocket-Key is what RFC 6455 §4.1 says
          it is: base64 of exactly sixteen bytes.

          It is checked rather than merely echoed through the digest because a key of
          the wrong length is a request that was not produced by a WebSocket client at
          all — most often a scanner, sometimes a proxy replaying a fragment — and
          answering it with a 101 hands a socket to something that will never speak the
          protocol.
        in:
          - name: key
            type: string
        name: ValidateKey
        out:
          - type: error
      - doc: |-
          Subprotocols declares the subprotocols this server speaks, most preferred
          first.

          The SERVER's order decides, not the client's: the client advertises what it
          can do, and choosing among those is the server's call — a client that listed
          a deprecated dialect first should not be able to pin the server to it.

          When the client offers none this server can speak, the upgrade still
          succeeds with no Sec-WebSocket-Protocol header, which RFC 6455 §4.2.2 names
          as the way to say "none agreed". Failing the handshake instead would be a
          stricter rule than the protocol has, and it would break every client that
          advertises an optional dialect.

          Each name must be an RFC 7230 token, which is what RFC 6455 §4.1 requires
          of a subprotocol: the chosen one is written verbatim into the response, so a
          name carrying a space, a comma or a quote would put a malformed handshake on
          the wire — it is refused at Upgrade instead. The list is copied here, so a
          caller reusing the slice it passed cannot change later handshakes, or race
          with the ones in flight.
        in:
          - name: names
            type: string
        name: Subprotocols
        out:
          - type: Option
        variadic: true
      - doc: |-
          MaxMessageSize bounds one reassembled message.

          Zero is clamped to [DefaultMaxMessageSize] and a negative value is refused
          (ADR 0031). There is deliberately no way to spell "unbounded": the length is
          announced by the peer in a 64-bit field, and fragmentation lets it keep
          announcing more, so an unbounded ceiling is not a configuration choice — it
          is a remote memory allocator.
        in:
          - name: "n"
            type: int64
        name: MaxMessageSize
        out:
          - type: Option
      - doc: |-
          MaxFrameSize bounds one frame's ANNOUNCED payload length.

          It is a separate bound from [MaxMessageSize] because it is enforced at a
          different moment: the frame ceiling is checked against the header, before a
          single payload byte is read or a single byte allocated, whereas the message
          ceiling is checked as fragments accumulate. A connection that only had the
          second would have to allocate the first frame to discover it was too big.
        in:
          - name: "n"
            type: int64
        name: MaxFrameSize
        out:
          - type: Option
      - doc: |-
          PingInterval sets how often the connection pings an otherwise silent peer.

          Zero does NOT mean "never" (ADR 0031). A connection with the heartbeat
          silently disabled works perfectly on a developer's loopback and dies at one
          minute behind a real proxy — and worse, it stops noticing a peer that has
          vanished without closing, which is the normal way a mobile client leaves.
          Zero is clamped to [DefaultPingInterval]; a negative interval is refused; to
          disable it, say so with [WithoutPing].

          Every interval the heartbeat sends a Ping, and one interval later it ends
          the connection if the handler has READ no frame since. It counts frames
          Receive has read, never frames that merely arrived, so it keeps a
          connection open only while one goroutine loops on Receive — see [Conn].
        in:
          - name: d
            type: time.Duration
        name: PingInterval
        out:
          - type: Option
      - doc: |-
          WithoutPing disables the heartbeat entirely.

          It exists so that "never" is something a caller writes on purpose rather than
          something a zero value does to them. It also disables the only liveness check
          this connection has: without it, a peer that disappears without closing —
          a laptop lid, a NAT rebinding — leaves a goroutine parked on a read that will
          never return until something else closes the socket.
        name: WithoutPing
        out:
          - type: Option
      - doc: |-
          WriteTimeout bounds how long one frame's write may take.

          It is per-frame on purpose. A group's WriteTimeout is an absolute deadline
          for the whole HTTP response, which for a connection that outlives the
          response entirely would cut it at that instant; the upgrade therefore clears
          the inherited deadline and replaces it with this bound, refreshed per frame.
          Zero is clamped to [DefaultWriteTimeout], negative is refused.
        in:
          - name: d
            type: time.Duration
        name: WriteTimeout
        out:
          - type: Option
      - doc: |-
          AllowOrigins replaces the default same-origin rule with an exact allowlist.

          The comparison is on the whole Origin header, case-insensitively — scheme,
          host and port together. Comparing only the host would accept
          http://app.example.com for an https server, which is precisely the downgrade
          an origin check exists to notice. Behind a proxy that terminates TLS this is
          the only way to have the scheme checked at all: the request arrives in
          plaintext there, so the default rule cannot see which scheme the browser
          used (see sameOrigin).

          The list is copied here, for the same reason Subprotocols copies its own.
        in:
          - name: origins
            type: string
        name: AllowOrigins
        out:
          - type: Option
        variadic: true
      - doc: |-
          AllowAnyOrigin disables the origin check.

          It has to be written out because the browser's same-origin policy does NOT
          apply to WebSocket: a page on any site can open a connection to this server
          and the browser will attach the user's cookies to the handshake. An upgrader
          that accepted every origin by default would be a cross-site request forgery
          primitive with a default-on switch, so the switch is default-off and named.

          Reach for it when authentication does not ride on ambient credentials — a
          bearer token in the subprotocol, a signed ticket in the query — which is
          exactly the case where the origin proves nothing anyway.
        name: AllowAnyOrigin
        out:
          - type: Option
      - doc: |-
          ValidateText reports whether a payload can travel as a text frame.

          Validation is performed on the REASSEMBLED message rather than per frame, and
          that is a correctness requirement rather than an optimisation: a multi-byte
          sequence may straddle a fragment boundary, so a per-frame check would reject
          perfectly valid messages whose only fault is where the sender chose to split
          them.
        in:
          - name: b
            type: "[]byte"
        name: ValidateText
        out:
          - type: error
      - doc: |-
          NewConn assembles the connection and starts the goroutines it owns.

          It is exported only because the struct-constructor lint requires a
          New-prefixed constructor beside every exported struct; it takes an unexported
          option set, so nothing outside this package can call it. [Upgrade] is the
          real entry point, and the public façade re-exports only that.
        in:
          - name: socket
            type: stdnet.Conn
          - name: buffered
            type: "*bufio.Reader"
          - name: subprotocol
            type: string
          - name: cfg
            type: "*config"
          - name: draining
            type: <-chan struct{}
        name: NewConn
        out:
          - type: "*Conn"
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      http: net/http
      stdnet: net
    path: github.com/kitsunium/sdk/internal/service/net/websocket
    types:
      - doc: |-
          FrameHeaderValue is one parsed frame header (RFC 6455 §5.2).

          The RSV bits are absent on purpose. They only mean anything once an extension
          has been negotiated, this domain negotiates none, and a set RSV bit is
          therefore a protocol error rather than a value to carry — see
          ParseFrameHeader.
        methods:
          - doc: |-
              ValidateFromClient enforces the one framing rule whose answer depends on the
              direction of travel: RFC 6455 §5.1 requires every client-to-server frame to
              be masked.

              An unmasked client frame FAILS THE CONNECTION. That is not pedantry about a
              key that protects nothing cryptographically: masking exists so a hostile
              script cannot steer a browser into emitting bytes that a transparent
              intermediary would read as a second, attacker-chosen HTTP request. An
              endpoint that accepted unmasked frames would let that script skip the one
              mechanism the design has against cache poisoning.
            name: ValidateFromClient
            out:
              - type: error
            recv: value
        name: FrameHeaderValue
        struct:
          fields:
            - doc: "Final is the FIN bit: this frame completes the message."
              name: Final
              tag: json:"final"
              type: bool
            - doc: OpCode is the frame type.
              name: OpCode
              tag: json:"opcode"
              type: corenet.WSOpCode
            - doc: |-
                Masked is the MASK bit. RFC 6455 §5.1 requires it on every client frame
                and forbids it on every server frame.
              name: Masked
              tag: json:"masked"
              type: bool
            - doc: MaskKey is the four-byte key, meaningful only when Masked.
              name: MaskKey
              tag: json:"mask_key"
              type: "[MaskLen]byte"
            - doc: |-
                Length is the payload length the frame announces. It is what the peer
                SAYS, not what it has sent — every bound must be checked against it
                BEFORE any buffer is sized from it.
              name: Length
              tag: json:"length"
              type: uint64
      - doc: Option configures a Conn.
        name: Option
        underlying: func(*config)
      - doc: |-
          Conn is one upgraded WebSocket connection.

          Every connection needs exactly ONE goroutine looping on [Conn.Receive] for
          its whole life — not two, and not zero — and that includes a connection the
          handler only ever writes to.

          Not two, because the protocol is a single ordered frame stream: two
          concurrent readers would each take half of a message.

          Not zero, because that loop is more than the way messages arrive. It is
          where the peer's Ping is answered (RFC 6455 §5.5.2), where its Close is
          replied to (§5.5.1), and the only place the heartbeat can see that the peer
          is alive: the heartbeat counts frames the handler has READ, so a Pong the
          peer sent on time but nobody read is, to it, silence. A handler that only
          pushes therefore runs the loop in a goroutine of its own and discards what
          it reads. Without one, the heartbeat ends the connection within two ping
          intervals — about a minute at [DefaultPingInterval] — however healthy the
          peer is. Nothing here starts that reader for you: it would have to own the
          buffer Receive hands out, and owning it is what makes a steady-state read
          free.

          Writes are safe for concurrent use — the heartbeat writes from its own
          goroutine while the handler writes from another, and a handler fanning
          messages in from several producers is the normal shape.
        methods:
          - doc: |-
              Subprotocol returns the subprotocol the handshake agreed on, or "" when none
              was.
            name: Subprotocol
            out:
              - type: string
            recv: pointer
          - doc: |-
              Done returns the channel closed when the connection has ended: the peer sent
              Close, the socket died, the heartbeat found the peer silent, the server began
              draining, or the handler closed it.

              Done is for the goroutines that are NOT reading. The one goroutine every
              connection needs looping on Receive (see [Conn]) learns of the end from
              Receive's terminal error at the same moment. A handler that pushes
              application events selects on Done beside its event source, so it stops
              between events rather than on the next failed Send.

              Watching Done does not replace the reader. A connection nobody reads answers
              no Ping, replies to no Close, and is ended by the heartbeat within two ping
              intervals, however healthy the peer is.
            name: Done
            out:
              - type: <-chan struct{}
            recv: pointer
          - doc: |-
              PeerCloseCode returns the status code the peer's Close frame carried.

              It reports [corenet.WSCloseNoStatus] when the peer closed without one — the
              code that exists to describe exactly that — and zero when no Close frame was
              ever received, which is the case that matters most: it distinguishes a peer
              that said goodbye from one that vanished.
            name: PeerCloseCode
            out:
              - type: corenet.WSCloseCode
            recv: pointer
          - doc: |-
              Receive reads the next complete message, answering control frames on the way.

              It is called in a loop, by one goroutine, for the connection's whole life —
              on a connection with nothing to read as much as on any other. Control
              frames are served INSIDE this call: the Pong a Ping is owed, the Close a
              Close is owed, and the count the heartbeat reads to decide the peer is
              alive. Stop calling it and all three stop with it; see [Conn].

              It returns a message only when one is whole: fragmentation is the sender's
              private choice of chunk size, not a semantic boundary, so surfacing it would
              put an implementation detail of the peer's writer into every consumer.

              The returned Data aliases the connection's own reassembly buffer and is valid
              until the next call to Receive. A handler that keeps a message past that must
              copy it — the same rule the engine's Conn.Buffer() carries, for the same
              reason: reusing one buffer is what makes a steady-state read allocate
              nothing.
            name: Receive
            out:
              - name: message
                type: corenet.WSMessageValue
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Send writes one message as a single frame and returns once it is on the wire.

              The SDK never fragments what it sends. Fragmentation exists so a sender can
              begin a message whose length it does not yet know; every message this API can
              express is already in memory, so splitting it would add a failure mode
              (a half-sent message when the socket dies mid-sequence) in exchange for
              nothing.
            in:
              - name: message
                type: corenet.WSMessageValue
            name: Send
            out:
              - type: error
            recv: pointer
          - doc: SendText writes one UTF-8 text message.
            in:
              - name: text
                type: string
            name: SendText
            out:
              - type: error
            recv: pointer
          - doc: SendBinary writes one binary message.
            in:
              - name: data
                type: "[]byte"
            name: SendBinary
            out:
              - type: error
            recv: pointer
          - doc: |-
              Ping sends a Ping frame carrying payload.

              It is exported because the automatic heartbeat answers "is the peer alive on
              its own schedule"; a caller sometimes needs to ask at a moment of its own —
              right after a long computation, or before committing to expensive work on the
              peer's behalf. A payload past [corenet.WSMaxControlPayload] is refused: a
              control frame must fit a buffer that is always available.
            in:
              - name: payload
                type: "[]byte"
            name: Ping
            out:
              - type: error
            recv: pointer
          - doc: |-
              Close ends the connection with a normal-closure status.

              A handler should defer it. It returns nil even when the socket has already
              gone: by the time a handler is closing, the peer having left first is the
              expected ending, not a fault to report. Use [Conn.CloseWith] to say something
              more specific.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: |-
              CloseWith ends the connection with a specific status code and reason.

              It reports an error only when the CODE or the reason is unusable — a code the
              RFC forbids on the wire, a reason that is not UTF-8 or does not fit a control
              frame. Those are caller mistakes and must surface whatever the socket is
              doing; a transport failure at this point is not, because there is nothing
              left to do about it.
            in:
              - name: code
                type: corenet.WSCloseCode
              - name: reason
                type: string
            name: CloseWith
            out:
              - type: error
            recv: pointer
        name: Conn
        struct:
          unexported: true
  - doc: |-
      Package client is the outbound half of the SDK's network domain (ADR 0029):
      an HTTP client whose posture is enforced by the transport rather than by the
      call site.

      # Why the policy lives in the transport

      A [Policy] is evaluated inside the http.RoundTripper, underneath every call
      site. A caller cannot construct a request that skips it, because there is no
      path to the network that does not pass through the transport. "This client is
      read-only" therefore stops being a convention the next contributor has to
      remember and becomes a property of the code — which is why [Client].HTTP can
      safely hand the underlying *http.Client to a third-party SDK without
      forfeiting the guarantee.

      Every default is closed. A conjunction with no members refuses, a path
      allowlist with no patterns refuses, and a client built with a nil policy is
      refused outright. An allowlist that lost its contents — a renamed config key,
      a slice never populated — must close, never quietly become a passthrough.

      # Building a read-only client

      	allow, err := client.AllowPaths(`/v1/(subscribers|supi/[^/]+|profiles(/[^/]+)?)`)
      	deny, err := client.DenyPaths(`/v1/(authentication|policy|eir|oam).*`)
      	policy := client.Policies(client.AllowMethods("GET"), deny, allow)

      	c, err := client.New(client.Config{BaseURL: "https://sdm.core.svc:8000"},
      		identity, policy, func(call client.CallInfo) {
      			logger.Info(ctx, lg, "egress",
      				logger.String("path", call.Path), logger.Int("status", call.Status))
      		})

      	resp, err := c.Get(ctx, "/v1/subscribers", url.Values{"profileId": {"P-tenant-a"}})

      Patterns are supplied UNANCHORED and anchored by the constructor. Leaving
      anchoring to the caller is exactly the omission that turns an allowlist into a
      sieve, and it is invisible in review.

      # What the response gives you

      Get and Do return a fully-read [Response] rather than an *http.Response. A
      returned *http.Response makes the caller responsible for closing the body and
      bounding its size, and one forgotten Close leaks a connection. It also makes
      an honest byte count impossible, since the size of a body is only known once
      it has been read.

      A non-2xx status returns BOTH the response and an error: a caller diagnosing
      the failure needs the body, and a caller who never considered the status still
      gets an error. A 204 with no body is a normal outcome, not a failure.

      # What it deliberately does not do

      It does not decode. Depending on the codec registry would link every codec
      the SDK ships into every consumer that only wanted a guarded GET, so
      decoding belongs above this layer.

      It does not truncate an oversized body — it fails with [ResponseTooLarge]. A
      silent truncation does not stay silent; it resurfaces several layers away as
      an incomprehensible decode error on a body that looks complete.
    facade:
      - alias:
          - doc: Client performs guarded outbound HTTP calls.
            name: Client
            target: svcclient.Client
      - alias:
          - doc: |-
              Config describes an outbound client. Durations accept "5s" as well as a raw
              nanosecond count, so a configuration file stays readable.
            name: Config
            target: corenet.ClientConfig
      - alias:
          - doc: Response is a fully-read outbound response.
            name: Response
            target: corenet.ResponseValue
      - alias:
          - doc: |-
              Policy authorises an outbound request. Implementations run inside the
              transport, so no call site can bypass them.
            name: Policy
            target: corenet.Policy
      - alias:
          - doc: PolicyFunc adapts a plain function to Policy.
            name: PolicyFunc
            target: corenet.PolicyFunc
      - alias:
          - doc: |-
              RequestInfo is the immutable request description a Policy judges. It carries
              the ESCAPED path: url.URL.Path is already percent-decoded, so a policy that
              judged it would accept "%2e%2e", which the upstream reinterprets as "..".
            name: RequestInfo
            target: corenet.RequestValue
      - alias:
          - doc: CallInfo records one completed outbound call.
            name: CallInfo
            target: corenet.CallValue
      - alias:
          - doc: CallHook receives one CallInfo per outbound call. It must not block.
            name: CallHook
            target: corenet.CallHook
      - alias:
          - doc: Duration is a configuration-friendly time.Duration.
            name: Duration
            target: corenet.DurationValue
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: |-
              RequestDenied reports a request refused by the policy. Its public message
              never names the refused path, so a denial cannot leak the private API
              surface into a log line.
            name: RequestDenied
            reexport: corenet.RequestDenied
            type: "*errs.Error"
          - doc: |-
              UnsafePath reports a path carrying a dot segment, literal or
              percent-encoded, or a path that is not absolute.
            name: UnsafePath
            reexport: corenet.UnsafePath
            type: "*errs.Error"
          - doc: ResponseTooLarge reports a body beyond the configured ceiling.
            name: ResponseTooLarge
            reexport: corenet.ResponseTooLarge
            type: "*errs.Error"
          - doc: CallFailed reports an unreachable upstream or a non-2xx status.
            name: CallFailed
            reexport: corenet.CallFailed
            type: "*errs.Error"
          - doc: TooManyRedirects reports a redirect chain beyond the configured cap.
            name: TooManyRedirects
            reexport: corenet.TooManyRedirects
            type: "*errs.Error"
      - func:
          doc: |-
            New builds a guarded client. A nil policy is refused rather than defaulted to
            "allow everything": an unguarded egress path wearing the name of a guarded one
            is worse than no client at all.
          forward: svcclient.New
          in:
            - name: cfg
              type: Config
            - name: id
              type: tlsid.Identity
            - name: policy
              type: Policy
            - name: hook
              type: CallHook
          name: New
          out:
            - name: c
              type: "*Client"
            - name: err
              type: error
      - func:
          doc: AllowMethods admits only the named HTTP methods. Passing none admits none.
          forward: svcclient.AllowMethods
          in:
            - name: methods
              type: string
          name: AllowMethods
          out:
            - type: Policy
          variadic: true
      - func:
          doc: |-
            AllowPaths admits only paths matching one of the patterns. The patterns are
            supplied unanchored and anchored here, so no caller can forget to.
          forward: svcclient.AllowPaths
          in:
            - name: patterns
              type: string
          name: AllowPaths
          out:
            - name: policy
              type: Policy
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            DenyPaths refuses paths matching one of the patterns. A deny is final and is
            not overridable by an allow pattern.
          forward: svcclient.DenyPaths
          in:
            - name: patterns
              type: string
          name: DenyPaths
          out:
            - name: policy
              type: Policy
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            Policies requires every policy to allow the request. Composition is by
            conjunction, so adding a policy can only ever narrow what is permitted.
          forward: svcclient.Policies
          in:
            - name: members
              type: Policy
          name: Policies
          out:
            - type: Policy
          variadic: true
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcclient: github.com/kitsunium/sdk/internal/service/net/client
      tlsid: github.com/kitsunium/sdk/pkg/v1/net/tlsid
    path: github.com/kitsunium/sdk/pkg/v1/net/client
  - doc: |-
      Package http1 is the restricted HTTP/1.1 profile the SDK serves on its loop
      engine (ADR 0186 §D6): a codec that frames requests out of bytes and appends
      responses to bytes, and HandleLoop, the adapter that serves a Handler on a
      loop group of package server.

      It is a profile, not an HTTP server, and what it refuses defines it. A
      request is answered with its status and Connection: close, and its
      connection closed, before any handler sees it, when it carries any
      Transfer-Encoding (chunked, and so trailers, included), Expect, a bare CR or
      LF, a NUL or another control byte in a value, obs-fold, whitespace before a
      colon, a name outside tchar, a Content-Length that is not one run of at most
      ten digits or that repeats, a second Authorization or Host, CONNECT, a
      target two readers could resolve apart — a dot-segment, an empty segment, a
      backslash, an encoded slash, dot, backslash or NUL, an absolute-form not for
      its Host — or a head, target or body past its Limits. HTTP/2, Upgrade and
      TLS are out of the profile: a program that needs them mounts net/http with Group.HandleHTTP.
      Framing depends on neither the method nor the route: a request takes its
      head plus its Content-Length.

      # Serving

      	type api struct{ lanes []perLane } // one per lane, indexed by Request.Lane

      	func (a *api) ServeHTTP1(req *http1.Request, res *http1.Response) {
      		l := &a.lanes[req.Lane]
      		switch req.Route { // set by the router link
      		case routeItem:
      			res.Defer = true // answered at the end of the batch
      			l.pending = append(l.pending, job{res: res, user: req.Auth})
      		default:
      			res.Status = 404
      		}
      	}

      	func (a *api) EndBatch(lane int) {
      		l := &a.lanes[lane]
      		// one transaction for every job of l.pending, then for each:
      		// job.res.Status, job.res.Body = ..., ...; job.res.Defer = false
      	}

      	routes, _ := http1.Routes(http1.Route{ID: routeItem, Method: "GET", Path: "/items/", Prefix: true},
      		http1.Route{ID: routeHealth, Path: "/health"})
      	bearer, _ := http1.Bearer(verifier, routeHealth) // /health needs no token
      	srv.Group("api", server.Listen("tcp", ":8080"), server.Loop(server.LoopValue{Loops: 2}), server.Plaintext()).
      		HandleLoop(http1.HandleLoop(http1.Chain(a, routes, bearer), http1.Parser{}))

      A handler runs on its lane's thread and must not block it. Every callback
      of one lane runs on that thread, one at a time, so state kept per lane needs
      no lock; Request.Lane and the lane argument of EndBatch name the lane. The
      answers of a batch leave at its end, in request order on each connection.

      # The chain

      A link is a Middleware, composed with Chain, the first listed outermost.
      The codec has already computed the request's canonical Path — no
      dot-segment, no empty segment, no encoded slash, dot, backslash or NUL, an
      absolute-form target reduced to its path once its authority matched Host —
      so every link routes and judges the same bytes. Routes sets
      Request.Route, Bearer verifies the token for every route its exemptions do
      not name and copies the subject and the claims into Request.Auth by value,
      Headers gives every answer its fields, and Log hands an AccessLogger a
      record of the fields it allows, never a credential. No link writes the
      bytes a request takes: the adapter frames with what Parse returned.

      # The codec alone

      Parser.Parse, AppendResponse and AppendRefusal frame and write without the
      loop, on any []byte: nothing allocates once the caller's buffers have room.
    facade:
      - alias:
          - doc: |-
              Handler answers one request of the profile. It sees only requests the
              codec framed and accepted, fills the Response, and the codec writes the
              framing: the status line, Content-Length and Connection: close.
            name: Handler
            target: corenet.HTTP1Handler
      - alias:
          - doc: HandlerFunc adapts a plain function to Handler.
            name: HandlerFunc
            target: corenet.HTTP1HandlerFunc
      - alias:
          - doc: |-
              Batcher is the optional capability of a Handler served on a loop group:
              EndBatch runs once per batch of the loop's requests, before any answer of
              the batch is written, and completes the responses the handler deferred.
            name: Batcher
            target: corenet.HTTP1Batcher
      - alias:
          - doc: |-
              Worker is the optional capability of a Handler served on a loop group that
              answers off the loop's thread: a Response marked Pending is filled by
              WorkHTTP1 on the lane's worker goroutine, which may block, and written once
              it returns.
            name: Worker
            target: corenet.HTTP1Worker
      - alias:
          - doc: |-
              Request is one request, framed by the codec. Every slice aliases the bytes
              Request is one request, framed by the codec. Every slice aliases the bytes
              it was framed from; Lane names the lane that framed it, Path is its
              canonical path, Route and Auth what the chain's links set.
            name: Request
            target: corenet.HTTP1RequestValue
      - alias:
          - doc: |-
              Response is the answer a Handler gives: a status, extra field lines written
              by AppendField, a body, Close, and Defer to answer at the batch's end.
            name: Response
            target: corenet.HTTP1ResponseValue
      - alias:
          - doc: Field is one field line of a Request, as it arrived.
            name: Field
            target: corenet.HTTP1FieldValue
      - alias:
          - doc: |-
              Limits bounds what one request may carry. Zero selects the profile's
              default, never unbounded.
            name: Limits
            target: corenet.HTTP1LimitsValue
      - alias:
          - doc: |-
              Parser frames requests under its Limits. The zero Parser uses the
              profile's defaults; NewParser validates others.
            name: Parser
            target: svchttp1.Parser
      - alias:
          - doc: |-
              Refusal names the rule a request broke; RefusalNone is none. Branch on its
              Err, a sentinel of this package, and log its String.
            name: Refusal
            target: svchttp1.Refusal
      - alias:
          - doc: |-
              LoopHandler serves the profile on a loop group: the server.LoopHandler
              HandleLoop returns.
            name: LoopHandler
            target: svchttp1.LoopHandler
      - alias:
          - doc: |-
              Middleware is a link of a chain: it decorates a Handler with another,
              composed by Chain.
            name: Middleware
            target: corenet.Middleware[corenet.HTTP1Handler]
      - alias:
          - doc: |-
              Auth is what an authenticating link established: a subject and claims,
              held by value in the Request.
            name: Auth
            target: corenet.HTTP1AuthValue
      - alias:
          - doc: |-
              BearerVerifier verifies a Bearer token for Bearer's link and fills the
              request's Auth.
            name: BearerVerifier
            target: corenet.HTTP1BearerVerifier
      - alias:
          - doc: |-
              Access is one request's access-log record, as Log's link hands it to an
              AccessLogger.
            name: Access
            target: corenet.HTTP1AccessValue
      - alias:
          - doc: AccessLogger receives Log's records, on the lane's thread.
            name: AccessLogger
            target: corenet.HTTP1AccessLogger
      - alias:
          - doc: |-
              Route is one route of Routes' link: an identifier, a method, a canonical
              path and whether it is a prefix.
            name: Route
            target: svchttp1.RouteValue
      - alias:
          - doc: RouteLayer is the link Routes builds.
            name: RouteLayer
            target: svchttp1.RouteLayer
      - alias:
          - doc: BearerLayer is the link Bearer builds.
            name: BearerLayer
            target: svchttp1.BearerLayer
      - alias:
          - doc: HeadersLayer is the link Headers builds.
            name: HeadersLayer
            target: svchttp1.HeadersLayer
      - alias:
          - doc: LogLayer is the link Log builds.
            name: LogLayer
            target: svchttp1.LogLayer
      - const:
          - doc: "RefusalNone is no refusal: the request was framed, or needs more bytes."
            name: RefusalNone
            reexport: svchttp1.RefusalNone
            type: Refusal
            typed: true
            value: "0"
      - const:
          - doc: |-
              MaxFields is how many field lines one request may carry; one more is
              refused (431).
            name: MaxFields
            reexport: corenet.HTTP1MaxFields
            type: int
            typed: true
            value: "64"
      - const:
          - doc: MaxSubject is the longest subject an Auth holds, in bytes.
            name: MaxSubject
            reexport: corenet.HTTP1MaxSubject
            type: int
            typed: true
            value: "128"
      - const:
          - doc: MaxAccessFields is how many request fields Log may allow.
            name: MaxAccessFields
            reexport: corenet.HTTP1MaxAccessFields
            type: int
            typed: true
            value: "8"
      - const:
          - doc: DefaultHead is the head bound a zero Limits.Head selects, in bytes.
            name: DefaultHead
            reexport: corenet.HTTP1DefaultHead
            type: int
            typed: true
            value: "8192"
      - const:
          - doc: MaxHead is the largest head bound Limits.Head may ask for.
            name: MaxHead
            reexport: corenet.HTTP1MaxHead
            type: int
            typed: true
            value: "65536"
      - const:
          - doc: DefaultTarget is the request-target bound a zero Limits.Target selects.
            name: DefaultTarget
            reexport: corenet.HTTP1DefaultTarget
            type: int
            typed: true
            value: "2048"
      - const:
          - doc: DefaultBody is the Content-Length bound a zero Limits.Body selects.
            name: DefaultBody
            reexport: corenet.HTTP1DefaultBody
            type: int64
            typed: true
            value: "1048576"
      - const:
          - doc: MaxBody is the largest Content-Length bound Limits.Body may ask for.
            name: MaxBody
            reexport: corenet.HTTP1MaxBody
            type: int64
            typed: true
            value: "1073741824"
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: |-
              RequestMalformed is the refusal of a request whose syntax the profile does
              not accept: its request line, a name, a bare CR or LF, a control byte.
            name: RequestMalformed
            reexport: corenet.HTTP1RequestMalformed
            type: "*errs.Error"
          - doc: TransferEncoding is the refusal of any Transfer-Encoding, chunked included.
            name: TransferEncoding
            reexport: corenet.HTTP1TransferEncoding
            type: "*errs.Error"
          - doc: |-
              ContentLengthInvalid is the refusal of a Content-Length that is not one run
              of digits, is too long, or repeats.
            name: ContentLengthInvalid
            reexport: corenet.HTTP1ContentLengthInvalid
            type: "*errs.Error"
          - doc: FieldDuplicated is the refusal of a second Authorization or Host field.
            name: FieldDuplicated
            reexport: corenet.HTTP1FieldDuplicated
            type: "*errs.Error"
          - doc: ExpectRefused is the refusal of a request carrying Expect.
            name: ExpectRefused
            reexport: corenet.HTTP1ExpectRefused
            type: "*errs.Error"
          - doc: HeadTooLarge is the refusal of a head past its bound, or of too many fields.
            name: HeadTooLarge
            reexport: corenet.HTTP1HeadTooLarge
            type: "*errs.Error"
          - doc: TargetTooLong is the refusal of a request-target past its bound.
            name: TargetTooLong
            reexport: corenet.HTTP1TargetTooLong
            type: "*errs.Error"
          - doc: BodyTooLarge is the refusal of a Content-Length past the body bound.
            name: BodyTooLarge
            reexport: corenet.HTTP1BodyTooLarge
            type: "*errs.Error"
          - doc: MethodUnsupported is the refusal of CONNECT.
            name: MethodUnsupported
            reexport: corenet.HTTP1MethodUnsupported
            type: "*errs.Error"
          - doc: ResponseInvalid is a response the writer refuses to write.
            name: ResponseInvalid
            reexport: corenet.HTTP1ResponseInvalid
            type: "*errs.Error"
          - doc: Misconfigured is a Limits NewParser refuses.
            name: Misconfigured
            reexport: corenet.HTTP1Misconfigured
            type: "*errs.Error"
      - func:
          doc: |-
            HandleLoop adapts h to the loop engine: the handler of
            server.Group.HandleLoop. p frames every request; the zero Parser is the
            profile's defaults. A refused request is answered and closed without
            reaching h; the batch's answers leave at its end, after h's EndBatch when h
            is a Batcher, in request order on each connection. A Response starts every
            request with a nil Header and Body, which h points at bytes it owns until
            the answer is taken. An answer the writer refuses, or one left deferred, is
            answered 500 and its connection closed; one the connection's output refuses
            closes the connection.
          forward: svchttp1.HandleLoop
          in:
            - name: h
              type: Handler
            - name: p
              type: Parser
          name: HandleLoop
          out:
            - type: "*LoopHandler"
      - func:
          doc: |-
            NewParser returns a Parser bounded by l, refusing a negative or oversized
            bound with Misconfigured.
          forward: svchttp1.NewParser
          in:
            - name: l
              type: Limits
          name: NewParser
          out:
            - type: Parser
            - type: error
      - func:
          doc: |-
            Continue returns req.Consumed and sets req.Body once buf holds the whole
            body of a request whose head Parse framed; until then it returns 0.
          forward: svchttp1.Continue
          in:
            - name: buf
              type: "[]byte"
            - name: req
              type: "*Request"
          name: Continue
          out:
            - type: int
      - func:
          doc: |-
            Pending returns how many bytes of req's body have yet to arrive when
            buffered bytes of the request are held.
          forward: svchttp1.Pending
          in:
            - name: req
              type: "*Request"
            - name: buffered
              type: int
          name: Pending
          out:
            - type: int
      - func:
          doc: |-
            AppendStatusLine appends the status line of status to dst; below 200 is
            refused with ResponseInvalid.
          forward: svchttp1.AppendStatusLine
          in:
            - name: dst
              type: "[]byte"
            - name: status
              type: int
          name: AppendStatusLine
          out:
            - type: "[]byte"
            - type: error
      - func:
          doc: |-
            AppendField appends "name: value\r\n" to dst. A name that is not a token, a
            control byte in the value, and Content-Length, Connection and
            Transfer-Encoding, which the codec writes, are refused with ResponseInvalid.
          forward: svchttp1.AppendField
          in:
            - name: dst
              type: "[]byte"
            - name: name
            - name: value
              type: string
          name: AppendField
          out:
            - type: "[]byte"
            - type: error
      - func:
          doc: |-
            AppendResponse appends the whole answer res gives req: the status line,
            res.Header, Content-Length from len(res.Body), Connection: close when res,
            req or closing asks for it, then the body.
          forward: svchttp1.AppendResponse
          in:
            - name: dst
              type: "[]byte"
            - name: req
              type: "*Request"
            - name: res
              type: "*Response"
            - name: closing
              type: bool
          name: AppendResponse
          out:
            - type: "[]byte"
            - type: error
      - func:
          doc: |-
            AppendRefusal appends the whole answer to r — its status, Content-Length: 0
            and Connection: close; the caller then closes the connection.
          forward: svchttp1.AppendRefusal
          in:
            - name: dst
              type: "[]byte"
            - name: r
              type: Refusal
          name: AppendRefusal
          out:
            - type: "[]byte"
      - func:
          doc: |-
            Chain applies links to a handler, outermost first: Chain(h, a, b) yields
            a(b(h)), the first link listed the first to see a request.
          forward: corenet.Chain
          in:
            - name: h
              type: Handler
            - name: links
              type: Middleware
          name: Chain
          out:
            - type: Handler
          variadic: true
      - func:
          doc: |-
            Routes returns the router link: Request.Route is the first route whose
            Method and Path match, zero for none, and the next handler runs either
            way. A bad ID, a repeated one, a Path not from "/" or a Method that is not
            a token is refused with Misconfigured.
          forward: svchttp1.Routes
          in:
            - name: routes
              type: Route
          name: Routes
          out:
            - type: Middleware
            - type: error
          variadic: true
      - func:
          doc: |-
            Bearer returns the authenticating link: a request whose Route is not in
            exempt is answered 401 unless v verifies its Bearer token; v sets the
            subject and the claims on the request's Auth, a value.
          forward: svchttp1.Bearer
          in:
            - name: v
              type: BearerVerifier
            - name: exempt
              type: int
          name: Bearer
          out:
            - type: Middleware
            - type: error
          variadic: true
      - func:
          doc: |-
            Headers returns the link that gives every answer the field lines pairs
            names, name then value; a name AppendField refuses is Misconfigured.
          forward: svchttp1.Headers
          in:
            - name: pairs
              type: string
          name: Headers
          out:
            - type: Middleware
            - type: error
          variadic: true
      - func:
          doc: |-
            Log returns the access-log link: one Access record per request, with the
            request fields allow names. Authorization, Proxy-Authorization and Cookie
            are refused with Misconfigured: a credential is never logged.
          forward: svchttp1.Log
          in:
            - name: l
              type: AccessLogger
            - name: allow
              type: string
          name: Log
          out:
            - type: Middleware
            - type: error
          variadic: true
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svchttp1: github.com/kitsunium/sdk/internal/service/net/http1
    path: github.com/kitsunium/sdk/pkg/v1/net/http1
  - doc: |-
      Package server — the two group options only an HTTP group reads: the header
      phase's own deadline and the header size cap.

      Package server is the inbound half of the SDK's network domain (ADR 0029):
      one unified listener engine for TCP, Unix, TLS and mutual TLS, serving
      pluggable handlers grouped behind shared middlewares.

      # The whole thing

      	srv := server.New()
      	srv.Group("echo", server.Listen("tcp", ":8080")).
      		HandleFunc(func(ctx context.Context, c server.Conn) error {
      			_, err := io.Copy(c, c)
      			return err
      		})
      	err := srv.Serve(ctx)

      That is the design target, not a simplified excerpt. [Conn] embeds net.Conn,
      so a handler reads and writes a connection exactly as it would any socket and
      every io helper keeps working — io.Copy, bufio, encoding wrappers. Everything
      the domain adds is additive.

      # Groups

      A group is a set of listeners sharing one handler, one middleware chain and
      one policy. It exists so the same handler can answer on a TCP port and a Unix
      socket without wiring it twice:

      	srv.Group("api",
      		server.Listen("tcp", ":8443"),
      		server.Listen("unix", "/run/api.sock"),
      		server.TLS(identity),
      		server.IdleTimeout(30*time.Second),
      	).Use(mw).Handle(handler)

      [Group] returns the group rather than a (group, error) pair on purpose: a
      declaration mistake — a duplicate name, an unusable address, a missing
      handler — is recorded and reported by [Server].Start. The declaration chain
      stays readable, and nothing is swallowed.

      # TLS and mutual TLS

      One option covers both. A [github.com/kitsunium/sdk/pkg/v1/net/tlsid.Identity]
      built with RequireClientCert turns the group's listeners into mutual-TLS
      listeners; the same identity type serves the outbound client, so the two
      cannot drift apart. The handshake runs on the connection's own goroutine, so
      a slow or hostile peer cannot stall the accept path for everyone else.

      # Lifecycle

      [Server].Start returns once every listener is bound, so a nil error means the
      ports are open. [Server].Serve starts, blocks until the context is cancelled,
      then drains. [Server].Shutdown stops accepting and waits for in-flight work
      within a budget, severing what remains when the budget expires — a shutdown
      that never returns is worse than one that admits it gave up.

      [Server].State reports the phase, the addresses actually bound, and whether
      any listener fell back from a requested optimisation. A silent degradation is
      indistinguishable from a working server, so it is surfaced rather than logged
      once at startup.

      An Accept that fails for any reason but its listener closing — the process
      out of file descriptors, typically — is retried after a wait, never at once:
      5 ms, doubling, held at one second, started over by the next accepted
      connection, as net/http's own Serve does. Retrying at once would spin a core
      per listener for as long as the condition lasts. A shutdown during a wait
      ends it at once, and [State].AcceptBackoffs counts the waits, so a server
      that cannot accept says so.

      # Connections that never end

      A drain waits for in-flight work to finish, which assumes it eventually does.
      An event stream, a long poll, or anything built on a protocol upgrade breaks
      that assumption: the request is in flight forever by design, so the drain
      waits out its whole budget and then severs the socket under the handler.

      [DrainSignal] is the way out. A handler holding a connection open selects on
      it alongside its own work and returns when it closes, which turns a
      budget-length DRAIN_TIMEOUT into a clean drain:

      	select {
      	case <-server.DrainSignal(r.Context()):
      		return
      	case ev := <-events:
      		// …
      	}

      The request context is deliberately NOT cancelled to say this. Cancelling it
      would tell every handler to abandon the response it is halfway through, which
      is the opposite of what a graceful drain is for. The signal is additive: a
      handler that ignores it behaves exactly as it did before.

      [github.com/kitsunium/sdk/pkg/v1/net/sse] is the Server-Sent Events
      implementation built on it, and watches the signal for you.

      # Protocol upgrades

      [github.com/kitsunium/sdk/pkg/v1/net/websocket] is WebSocket (RFC 6455),
      server side. It hijacks the response, which means the socket stops being the
      engine's: it is neither closed nor waited for by a drain — the same carve-out
      http.Server.Shutdown documents for hijacked connections. The connection
      watches [DrainSignal] and closes itself with a 1001 "going away" instead, so
      a deployment ends it deliberately rather than by severing it.

      The same is true of anything else a handler hijacks: once the socket is taken
      over it is the handler's to close.
    facade:
      - func:
          doc: |-
            ReadHeaderTimeout bounds the HEADER phase of an HTTP request on its own: the
            request line and every header field must arrive within d, whatever the read
            timeout allows a body.

            The header phase is the one a slowloris stalls — a byte every few seconds,
            never finishing a line — and the one an honest client finishes in
            milliseconds, so it deserves a bound far shorter than a read timeout sized
            for an upload. A client that stalls there is disconnected at d. Unset (or
            non-positive) keeps the earlier behaviour: the header phase is bounded by
            [ReadTimeout]. No effect on a group that does not serve HTTP.
          forward: svcserver.ReadHeaderTimeout
          in:
            - name: d
              type: time.Duration
          name: ReadHeaderTimeout
          out:
            - type: GroupOption
      - func:
          doc: |-
            MaxHeaderBytes caps the bytes net/http reads for a request's line and header
            fields; a request past the cap is answered 431 Request Header Fields Too
            Large and never reaches the handler.

            Unset (or non-positive) keeps net/http's default of 1 MiB, which applied
            silently before this option existed. net/http reads a small fixed allowance
            past the cap before refusing. No effect on a group that does not serve HTTP.
          forward: svcserver.MaxHeaderBytes
          in:
            - name: "n"
              type: int
          name: MaxHeaderBytes
          out:
            - type: GroupOption
      - alias:
          - doc: Server owns a set of listener groups and their lifecycle.
            name: Server
            target: svcserver.Server
      - alias:
          - doc: |-
              Group is a set of listeners sharing one handler, middleware chain and policy.

              Group.HandleHTTP mounts an http.Handler on the group's listeners: the group
              keeps its own limits, TLS identity and drain, and net/http only does the
              protocol.
            name: Group
            target: svcserver.StreamGroup
      - alias:
          - doc: Conn is one accepted stream connection. It embeds net.Conn.
            name: Conn
            target: corenet.Conn
      - alias:
          - doc: Handler serves one accepted stream connection.
            name: Handler
            target: corenet.ConnHandler
      - alias:
          - doc: HandlerFunc adapts a plain function to Handler.
            name: HandlerFunc
            target: corenet.ConnHandlerFunc
      - alias:
          - doc: Middleware decorates a handler with another of the same type.
            name: Middleware
            target: corenet.Middleware[corenet.ConnHandler]
      - alias:
          - doc: State is a snapshot of the server's lifecycle and listeners.
            name: State
            target: corenet.StateValue
      - alias:
          - doc: ListenerState reports one bound listener, including any fallback.
            name: ListenerState
            target: corenet.ListenerStateValue
      - alias:
          - doc: |-
              LoopState reports one loop group: its backend, how it got there, how it is
              sized, and its rings' counters.
            name: LoopState
            target: corenet.LoopStateValue
      - alias:
          - doc: LoopRingState reports one ring of one loop group.
            name: LoopRingState
            target: corenet.LoopRingStateValue
      - alias:
          - doc: |-
              Override reports what KITSUNIUM_NET_ENGINE and KITSUNIUM_NET_DISABLE did to
              the engines.
            name: Override
            target: corenet.OverrideValue
      - alias:
          - doc: Fault reports one thing the server runs without, or cannot do, now.
            name: Fault
            target: corenet.FaultValue
      - alias:
          - doc: Fallbacks counts the engine fallbacks and keeps the last one.
            name: Fallbacks
            target: corenet.FallbacksValue
      - alias:
          - doc: |-
              DatagramState counts what the batched datagram paths drop: messages cut
              short, GSO sends refused for their size, queued replies that did not leave.
            name: DatagramState
            target: corenet.DatagramStateValue
      - alias:
          - doc: Platform names the operating system, its release and the toolchain.
            name: Platform
            target: corenet.PlatformValue
      - alias:
          - doc: |-
              Capability names one engine of the lattice iouring > epoll > portable >
              goroutine; its values are the operator's tokens.
            name: Capability
            target: corenet.Capability
      - const:
          - doc: CapabilityIOURing is io_uring, the top of the lattice.
            name: CapabilityIOURing
            reexport: corenet.CapabilityIOURing
            type: Capability
            typed: true
            value: "\"iouring\""
      - const:
          - doc: CapabilityEpoll is epoll, below io_uring.
            name: CapabilityEpoll
            reexport: corenet.CapabilityEpoll
            type: Capability
            typed: true
            value: "\"epoll\""
      - const:
          - doc: CapabilityPortable is the portable loop backend, the loop family's floor.
            name: CapabilityPortable
            reexport: corenet.CapabilityPortable
            type: Capability
            typed: true
            value: "\"portable\""
      - const:
          - doc: CapabilityGoroutine is the goroutine engine, the bottom of the lattice.
            name: CapabilityGoroutine
            reexport: corenet.CapabilityGoroutine
            type: Capability
            typed: true
            value: "\"goroutine\""
      - alias:
          - doc: CapabilityValue reports one optional kernel capability of a loop group.
            name: CapabilityValue
            target: corenet.CapabilityValue
      - const:
          - doc: CapabilityURingDeferTaskrun opts a loop group into uring-defer-taskrun, a class A-code kernel capability.
            name: CapabilityURingDeferTaskrun
            reexport: corenet.CapabilityURingDeferTaskrun
            type: Capability
            typed: true
            value: "\"uring-defer-taskrun\""
      - const:
          - doc: CapabilityURingNoSQArray opts a loop group into uring-no-sqarray, a class A-code kernel capability.
            name: CapabilityURingNoSQArray
            reexport: corenet.CapabilityURingNoSQArray
            type: Capability
            typed: true
            value: "\"uring-no-sqarray\""
      - const:
          - doc: CapabilityURingRingFDs opts a loop group into uring-ring-fds, a class A-code kernel capability.
            name: CapabilityURingRingFDs
            reexport: corenet.CapabilityURingRingFDs
            type: Capability
            typed: true
            value: "\"uring-ring-fds\""
      - const:
          - doc: CapabilityURingSQRewind opts a loop group into uring-sq-rewind, a class A-code kernel capability.
            name: CapabilityURingSQRewind
            reexport: corenet.CapabilityURingSQRewind
            type: Capability
            typed: true
            value: "\"uring-sq-rewind\""
      - const:
          - doc: EnvEngine is the variable that caps every group's engine.
            name: EnvEngine
            reexport: corenet.EnvEngine
            type: string
            typed: true
            value: "\"KITSUNIUM_NET_ENGINE\""
      - const:
          - doc: EnvDisable is the variable that switches engines off.
            name: EnvDisable
            reexport: corenet.EnvDisable
            type: string
            typed: true
            value: "\"KITSUNIUM_NET_DISABLE\""
      - alias:
          - doc: |-
              LoopValue configures a group's loop engine, passed by Loop. Every field is
              optional: zero selects the domain default.
            name: LoopValue
            target: corenet.LoopValue
      - alias:
          - doc: LoopBackend names the mechanic a loop group runs on.
            name: LoopBackend
            target: corenet.LoopBackend
      - const:
          - doc: |-
              LoopBackendAuto takes the best backend the platform's probe reaches.
            name: LoopBackendAuto
            reexport: corenet.LoopBackendAuto
            type: LoopBackend
            typed: true
            value: "0"
      - const:
          - doc: |-
              LoopBackendIOURing is io_uring, after the kernel's staged probe.
            name: LoopBackendIOURing
            reexport: corenet.LoopBackendIOURing
            type: LoopBackend
            typed: true
            value: "1"
      - const:
          - doc: |-
              LoopBackendEpoll is epoll, on every Linux architecture.
            name: LoopBackendEpoll
            reexport: corenet.LoopBackendEpoll
            type: LoopBackend
            typed: true
            value: "2"
      - const:
          - doc: |-
              LoopBackendPortable is the default engine's accept path, serialised onto
              one handler goroutine.
            name: LoopBackendPortable
            reexport: corenet.LoopBackendPortable
            type: LoopBackend
            typed: true
            value: "3"
      - const:
          - doc: |-
              LoopsAuto, as LoopValue.Loops, runs one loop per GOMAXPROCS, read once at
              Start.
            name: LoopsAuto
            reexport: corenet.LoopsAuto
            type: int
            typed: true
            value: "-1"
      - alias:
          - doc: |-
              LoopHandler serves the connections of a loop group, one callback per event,
              on the loop's thread. A callback must not block it.
            name: LoopHandler
            target: corenet.LoopHandler
      - alias:
          - doc: |-
              LoopIO is what a loop offers its handler: Write, Close, SetDeadline and
              Pressure on its connections, from a callback, and Post from any goroutine.
            name: LoopIO
            target: corenet.LoopIO
      - alias:
          - doc: |-
              LoopOptionHonourer is the optional capability of a LoopHandler that honours
              group options the loop engine does not.
            name: LoopOptionHonourer
            target: corenet.LoopOptionHonourer
      - alias:
          - doc: |-
              LoopStarter is the optional capability of a LoopHandler that keeps state
              per lane: OnStart gives it the lane count, once, before any other callback.
            name: LoopStarter
            target: corenet.LoopStarter
      - alias:
          - doc: |-
              LoopOffloader is the optional capability of a LoopHandler that offloads
              blocking work to one worker goroutine per lane (R3).
            name: LoopOffloader
            target: corenet.LoopOffloader
      - alias:
          - doc: LoopWorker runs a lane's offloaded jobs, off the loop's thread; it may block.
            name: LoopWorker
            target: corenet.LoopWorker
      - alias:
          - doc: |-
              LoopOutbound is one lane's preallocated queue to its worker; Send never
              blocks.
            name: LoopOutbound
            target: corenet.LoopOutbound
      - alias:
          - doc: LoopJobValue is one job a lane sends its worker.
            name: LoopJobValue
            target: corenet.LoopJobValue
      - alias:
          - doc: |-
              LoopOutboundValue is what an offloader is given at Start: the lanes'
              outbounds and the output ceiling of one connection.
            name: LoopOutboundValue
            target: corenet.LoopOutboundValue
      - alias:
          - doc: |-
              LoopLayered is what every layer of a loop middleware implements: Next is
              the handler it wraps.
            name: LoopLayered
            target: corenet.LoopLayered
      - alias:
          - doc: |-
              LoopLayer is the base a loop middleware's layer embeds: it forwards the
              eight callbacks to the handler it wraps.
            name: LoopLayer
            target: corenet.LoopLayer
      - alias:
          - doc: LoopMiddleware decorates a loop handler with a layer, for UseLoop.
            name: LoopMiddleware
            target: corenet.Middleware[corenet.LoopHandler]
      - alias:
          - doc: |-
              LoopConnRef names one connection of a loop by ring, slot and generation. The
              zero value names no connection.
            name: LoopConnRef
            target: corenet.LoopConnRef
      - alias:
          - doc: |-
              PostFunc is an operation posted to a loop with LoopIO.Post. It runs once, on
              the loop's thread.
            name: PostFunc
            target: corenet.PostFunc
      - alias:
          - doc: OptionKind names a group option, for LoopOptionHonourer.Honours.
            name: OptionKind
            target: corenet.OptionKind
      - const:
          - doc: OptionNone names no option; it is the zero value.
            name: OptionNone
            reexport: corenet.OptionNone
            type: OptionKind
            typed: true
            value: "0"
      - const:
          - doc: OptionTLS is TLS. A loop group always refuses it.
            name: OptionTLS
            reexport: corenet.OptionTLS
            type: OptionKind
            typed: true
            value: "1"
      - const:
          - doc: OptionMiddleware is Use. A loop group always refuses it.
            name: OptionMiddleware
            reexport: corenet.OptionMiddleware
            type: OptionKind
            typed: true
            value: "2"
      - const:
          - doc: OptionReadTimeout is ReadTimeout.
            name: OptionReadTimeout
            reexport: corenet.OptionReadTimeout
            type: OptionKind
            typed: true
            value: "3"
      - const:
          - doc: OptionWriteTimeout is WriteTimeout.
            name: OptionWriteTimeout
            reexport: corenet.OptionWriteTimeout
            type: OptionKind
            typed: true
            value: "4"
      - const:
          - doc: OptionIdleTimeout is IdleTimeout. The loop engine honours it.
            name: OptionIdleTimeout
            reexport: corenet.OptionIdleTimeout
            type: OptionKind
            typed: true
            value: "5"
      - const:
          - doc: |-
              OptionReadHeaderTimeout is ReadHeaderTimeout, which only a protocol adapter
              can honour.
            name: OptionReadHeaderTimeout
            reexport: corenet.OptionReadHeaderTimeout
            type: OptionKind
            typed: true
            value: "6"
      - const:
          - doc: |-
              OptionMaxHeaderBytes is MaxHeaderBytes, which only a protocol adapter can
              honour.
            name: OptionMaxHeaderBytes
            reexport: corenet.OptionMaxHeaderBytes
            type: OptionKind
            typed: true
            value: "7"
      - const:
          - doc: OptionHandshakeTimeout is HandshakeTimeout.
            name: OptionHandshakeTimeout
            reexport: corenet.OptionHandshakeTimeout
            type: OptionKind
            typed: true
            value: "8"
      - const:
          - doc: OptionReadBufferSize is ReadBufferSize.
            name: OptionReadBufferSize
            reexport: corenet.OptionReadBufferSize
            type: OptionKind
            typed: true
            value: "9"
      - const:
          - doc: OptionMaxPacketSize is MaxPacketSize.
            name: OptionMaxPacketSize
            reexport: corenet.OptionMaxPacketSize
            type: OptionKind
            typed: true
            value: "10"
      - const:
          - doc: OptionBatchSize is BatchSize.
            name: OptionBatchSize
            reexport: corenet.OptionBatchSize
            type: OptionKind
            typed: true
            value: "11"
      - const:
          - doc: OptionShards is Shards.
            name: OptionShards
            reexport: corenet.OptionShards
            type: OptionKind
            typed: true
            value: "12"
      - const:
          - doc: OptionMaxConns is MaxConns. The loop engine honours it.
            name: OptionMaxConns
            reexport: corenet.OptionMaxConns
            type: OptionKind
            typed: true
            value: "13"
      - const:
          - doc: OptionAdopt is Adopt. The loop engine honours it.
            name: OptionAdopt
            reexport: corenet.OptionAdopt
            type: OptionKind
            typed: true
            value: "14"
      - const:
          - doc: OptionPreHandshake is PreHandshake.
            name: OptionPreHandshake
            reexport: corenet.OptionPreHandshake
            type: OptionKind
            typed: true
            value: "15"
      - const:
          - doc: OptionPlaintext is Plaintext. Every engine honours it.
            name: OptionPlaintext
            reexport: corenet.OptionPlaintext
            type: OptionKind
            typed: true
            value: "16"
      - const:
          - doc: OptionName is Name. Every engine honours it.
            name: OptionName
            reexport: corenet.OptionName
            type: OptionKind
            typed: true
            value: "17"
      - const:
          - doc: OptionEngine is Engine. Every engine honours it, or refuses the group.
            name: OptionEngine
            reexport: corenet.OptionEngine
            type: OptionKind
            typed: true
            value: "18"
          - doc: OptionLoopMiddleware is UseLoop. A group no loop handler serves refuses it.
            name: OptionLoopMiddleware
            reexport: corenet.OptionLoopMiddleware
            type: OptionKind
            typed: true
            value: "19"
      - const:
          - doc: OptionBatchReplies is BatchReplies. A datagram group honours it; a stream group refuses it.
            name: OptionBatchReplies
            reexport: corenet.OptionBatchReplies
            type: OptionKind
            typed: true
            value: "20"
          - doc: OptionProtocols is Protocols. Only an HTTP group honours it.
            name: OptionProtocols
            reexport: corenet.OptionProtocols
            type: OptionKind
            typed: true
            value: "21"
      - alias:
          - doc: |-
              EngineValue names the engine family a group runs on, passed by Engine. The
              zero value, EngineAuto, lets the handler's type choose.
            name: EngineValue
            target: corenet.EngineValue
      - const:
          - doc: EngineAuto lets the group's handler type choose its engine.
            name: EngineAuto
            reexport: corenet.EngineAuto
            type: EngineValue
            typed: true
            value: "0"
      - const:
          - doc: EngineGoroutine is the default engine, one goroutine per connection.
            name: EngineGoroutine
            reexport: corenet.EngineGoroutine
            type: EngineValue
            typed: true
            value: "1"
      - const:
          - doc: EngineLoop is the loop engine; Loop picks its backend.
            name: EngineLoop
            reexport: corenet.EngineLoop
            type: EngineValue
            typed: true
            value: "2"
      - alias:
          - doc: Phase is where a server sits in its lifecycle.
            name: Phase
            target: corenet.Phase
      - const:
          - doc: |-
              The lifecycle phases, in the order a server passes through them. They are
              re-exported so a caller can compare State().Phase without importing the
              internal package, which Go's firewall forbids anyway.
              PhaseNew is a constructed server that has not bound anything yet.
            name: PhaseNew
            reexport: corenet.PhaseNew
            type: Phase
            typed: true
            value: "0"
      - const:
          - doc: PhaseStarting is binding listeners; some may already be up.
            name: PhaseStarting
            reexport: corenet.PhaseStarting
            type: Phase
            typed: true
            value: "1"
      - const:
          - doc: PhaseServing is bound and accepting.
            name: PhaseServing
            reexport: corenet.PhaseServing
            type: Phase
            typed: true
            value: "2"
      - const:
          - doc: PhaseDraining has stopped accepting and is waiting for in-flight work.
            name: PhaseDraining
            reexport: corenet.PhaseDraining
            type: Phase
            typed: true
            value: "3"
      - const:
          - doc: PhaseStopped has released every listener.
            name: PhaseStopped
            reexport: corenet.PhaseStopped
            type: Phase
            typed: true
            value: "4"
      - alias:
          - doc: Option configures a Server.
            name: Option
            target: svcserver.Option
      - alias:
          - doc: GroupOption configures a Group.
            name: GroupOption
            target: svcserver.GroupOption
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: ListenFailed reports a listener that could not be bound.
            name: ListenFailed
            reexport: corenet.ListenFailed
            type: "*errs.Error"
          - doc: InvalidAddress reports an unusable listen address.
            name: InvalidAddress
            reexport: corenet.InvalidAddress
            type: "*errs.Error"
          - doc: UnsupportedNetwork reports a socket family the domain does not serve.
            name: UnsupportedNetwork
            reexport: corenet.UnsupportedNetwork
            type: "*errs.Error"
          - doc: AlreadyStarted reports a second Start on a running server.
            name: AlreadyStarted
            reexport: corenet.AlreadyStarted
            type: "*errs.Error"
          - doc: HandlerMissing reports a group declared without a handler.
            name: HandlerMissing
            reexport: corenet.HandlerMissing
            type: "*errs.Error"
          - doc: GroupDuplicate reports a second group declared under one name.
            name: GroupDuplicate
            reexport: corenet.GroupDuplicate
            type: "*errs.Error"
          - doc: DrainTimeout reports a shutdown whose budget expired with work in flight.
            name: DrainTimeout
            reexport: corenet.DrainTimeout
            type: "*errs.Error"
          - doc: ConnLimitReached reports a connection turned away by the group ceiling.
            name: ConnLimitReached
            reexport: corenet.ConnLimitReached
            type: "*errs.Error"
          - doc: HandlerAlreadySet reports a second handler declared on one stream group.
            name: HandlerAlreadySet
            reexport: corenet.HandlerAlreadySet
            type: "*errs.Error"
          - doc: LoopTLSUnsupported reports TLS set on a loop group.
            name: LoopTLSUnsupported
            reexport: corenet.LoopTLSUnsupported
            type: "*errs.Error"
          - doc: LoopOptionUnsupported reports a group option a loop group cannot honour.
            name: LoopOptionUnsupported
            reexport: corenet.LoopOptionUnsupported
            type: "*errs.Error"
          - doc: EngineUnsupported reports an Engine the group's handler or options cannot run on.
            name: EngineUnsupported
            reexport: corenet.EngineUnsupported
            type: "*errs.Error"
          - doc: PlaintextWithTLS reports a group given both Plaintext and TLS.
            name: PlaintextWithTLS
            reexport: corenet.PlaintextWithTLS
            type: "*errs.Error"
          - doc: HandlerAmbiguous reports a simple-API handler that could run on two engines and no Engine chooses.
            name: HandlerAmbiguous
            reexport: corenet.HandlerAmbiguous
            type: "*errs.Error"
          - doc: HandlerUnsupported reports a handler no engine of its simple-API entry serves.
            name: HandlerUnsupported
            reexport: corenet.HandlerUnsupported
            type: "*errs.Error"
          - doc: PlaintextRequired reports an HTTP group given neither TLS nor Plaintext.
            name: PlaintextRequired
            reexport: corenet.PlaintextRequired
            type: "*errs.Error"
          - doc: PacketOptionUnsupported reports an option a datagram group cannot honour.
            name: PacketOptionUnsupported
            reexport: corenet.PacketOptionUnsupported
            type: "*errs.Error"
          - doc: GroupNameConflict reports a Name that is empty or contradicts the group's declared name.
            name: GroupNameConflict
            reexport: corenet.GroupNameConflict
            type: "*errs.Error"
          - doc: LoopGroupStalled reports a loop group every ring of which its watchdog drained.
            name: LoopGroupStalled
            reexport: corenet.LoopGroupStalled
            type: "*errs.Error"
          - doc: LoopMiddlewareInvalid reports a loop middleware whose layer does not forward every callback.
            name: LoopMiddlewareInvalid
            reexport: corenet.LoopMiddlewareInvalid
            type: "*errs.Error"
          - doc: ProtocolsRefused reports an HTTP group's Protocols, or its identity's NextProtos, that it cannot serve.
            name: ProtocolsRefused
            reexport: corenet.ProtocolsRefused
            type: "*errs.Error"
          - doc: LoopCapabilityRefused reports a LoopValue.Capabilities entry a loop group cannot opt into.
            name: LoopCapabilityRefused
            reexport: corenet.LoopCapabilityRefused
            type: "*errs.Error"
          - doc: LoopBackendUnavailable reports an explicit loop backend the kernel's probe refused.
            name: LoopBackendUnavailable
            reexport: corenet.LoopBackendUnavailable
            type: "*errs.Error"
          - doc: LoopNoDescriptors reports a loop group with no RLIMIT_NOFILE to size it by.
            name: LoopNoDescriptors
            reexport: corenet.LoopNoDescriptors
            type: "*errs.Error"
          - doc: LoopStaleRef reports an operation on a connection that has closed.
            name: LoopStaleRef
            reexport: corenet.LoopStaleRef
            type: "*errs.Error"
          - doc: LoopOutputFull reports a Write past a connection's or a loop's output bound.
            name: LoopOutputFull
            reexport: corenet.LoopOutputFull
            type: "*errs.Error"
          - doc: LoopSpillFull reports a connection closed for unconsumed input past its ceiling.
            name: LoopSpillFull
            reexport: corenet.LoopSpillFull
            type: "*errs.Error"
          - doc: LoopPostQueueFull reports a Post refused by a full queue.
            name: LoopPostQueueFull
            reexport: corenet.LoopPostQueueFull
            type: "*errs.Error"
          - doc: LoopOutboundFull reports a job refused by a lane's full queue to its worker.
            name: LoopOutboundFull
            reexport: corenet.LoopOutboundFull
            type: "*errs.Error"
          - doc: LoopWrongThread reports, under loopdebug, a loop operation off the loop's thread.
            name: LoopWrongThread
            reexport: corenet.LoopWrongThread
            type: "*errs.Error"
      - func:
          doc: New builds a server.
          forward: svcserver.New
          in:
            - name: opts
              type: Option
          name: New
          out:
            - type: "*Server"
          variadic: true
      - func:
          doc: |-
            DrainSignal returns the channel closed when the server serving this request
            begins draining, or nil when none is published.

            It is how a handler that holds a connection open indefinitely — an event
            stream, a long poll — learns that finishing now is the cooperative thing to
            do. Without it such a handler holds the drain open until the budget expires
            and its socket is severed under it, on every shutdown.

            A nil channel blocks forever, so a select that watches it needs no nil check
            and behaves correctly on a server that publishes nothing.
          forward: corenet.DrainSignal
          in:
            - name: ctx
              type: context.Context
          name: DrainSignal
          out:
            - type: <-chan struct{}
      - func:
          doc: |-
            Chain applies middlewares to a handler, outermost first.

            Chain(h, a, b, c) yields a(b(c(h))): the first middleware listed is the first
            to see a connection, matching how the list reads at the call site.
          forward: corenet.Chain
          in:
            - name: h
              type: Handler
            - name: middlewares
              type: Middleware
          name: Chain
          out:
            - type: Handler
          variadic: true
      - func:
          doc: |-
            Loop configures a group's loop engine (ADR 0186 §D5): its backend, its loops
            and rings, and its per-connection and pressure bounds. It is judged at Start,
            once the group's handler is known: a group served by HandleLoop runs on it,
            and a group served by Handle, HandleFunc or HandleHTTP refuses it with
            LoopOptionUnsupported, whichever order the declarations came in. A group with
            no handler fails with HandlerMissing instead, and one given a second handler
            with HandlerAlreadySet. A datagram group refuses it with LoopOptionUnsupported
            too. A group served by HandleLoop without it runs on the zero LoopValue.
          forward: svcserver.Loop
          in:
            - name: v
              type: LoopValue
          name: Loop
          out:
            - type: GroupOption
      - func:
          doc: |-
            Listen adds an address to a group. Repeat it to bind several addresses to one
            handler — a TCP port and a Unix socket, for instance.

            On Windows, whose AF_UNIX sockets are stream-only, a "unixgram" or
            "unixpacket" address fails Start with the SDK's UNSUPPORTED_PLATFORM, before
            any socket is opened; "unix" is served there as everywhere else.
          forward: svcserver.Listen
          in:
            - name: network
            - name: addr
              type: string
          name: Listen
          out:
            - type: GroupOption
      - func:
          doc: |-
            TLS turns the group's listeners into TLS listeners, or mutual-TLS ones when
            the identity requires a client certificate.
          forward: svcserver.TLS
          in:
            - name: id
              type: tlsid.Identity
          name: TLS
          out:
            - type: GroupOption
      - func:
          doc: |-
            ReadTimeout bounds one read from the peer.

            It is refreshed per read, not installed once when the connection is accepted:
            a deadline set at accept time would be a budget for the connection's whole
            life, which a peer trickling one byte at a time stays comfortably inside. On
            a group serving an http.Handler it bounds three things: each read
            of a request body, refreshed before every read — never net/http's own
            ReadTimeout, which budgets the whole request and would cut off a peer whose
            every read is inside the bound —, the header phase, unless
            [ReadHeaderTimeout] sets it apart, and the wait for the next request when
            no [IdleTimeout] is set. The time a handler spends between two reads is its
            own, and the deadline is cleared once the body has ended.
          forward: svcserver.ReadTimeout
          in:
            - name: d
              type: time.Duration
          name: ReadTimeout
          out:
            - type: GroupOption
      - func:
          doc: WriteTimeout bounds one write to the peer, refreshed per write.
          forward: svcserver.WriteTimeout
          in:
            - name: d
              type: time.Duration
          name: WriteTimeout
          out:
            - type: GroupOption
      - func:
          doc: |-
            IdleTimeout bounds how long a connection may sit with no traffic at all.

            It is enforced on the read side, where silence is observable: a read is
            bounded by whichever of ReadTimeout and IdleTimeout is tighter. Setting both
            therefore narrows the bound rather than replacing it, which is what the two
            options together are asking for.
          forward: svcserver.IdleTimeout
          in:
            - name: d
              type: time.Duration
          name: IdleTimeout
          out:
            - type: GroupOption
      - func:
          doc: |-
            HandshakeTimeout bounds the TLS negotiation on the group's listeners.

            Unset does not mean unbounded, unlike the other three. The handshake runs on
            the connection's own goroutine — the listener does not negotiate in Accept,
            which is what keeps one slow peer from stalling the accept path for everyone
            — so it is the one phase that can be stalled before any handler exists to
            notice, and a peer that connects and says nothing would otherwise hold a
            goroutine and a slot under MaxConns indefinitely. It falls back to a domain
            default instead.
          forward: svcserver.HandshakeTimeout
          in:
            - name: d
              type: time.Duration
          name: HandshakeTimeout
          out:
            - type: GroupOption
      - func:
          doc: |-
            ReadBufferSize sizes the per-connection scratch buffer handed to the handler
            by Conn.Buffer. It is recycled with the connection, which is what lets a
            handler read without allocating per connection.
          forward: svcserver.ReadBufferSize
          in:
            - name: "n"
              type: int
          name: ReadBufferSize
          out:
            - type: GroupOption
      - func:
          doc: |-
            WithDrainTimeout bounds how long Shutdown waits for in-flight connections
            before severing them.
          forward: svcserver.WithDrainTimeout
          in:
            - name: d
              type: time.Duration
          name: WithDrainTimeout
          out:
            - type: Option
      - func:
          doc: |-
            WithDrainGrace sets how long Shutdown keeps accepting and serving once
            readiness has turned false, before it closes any listener. Zero starts
            closing at once: a loop group still takes its listen queue before its
            listener closes.
          forward: svcserver.WithDrainGrace
          in:
            - name: d
              type: time.Duration
          name: WithDrainGrace
          out:
            - type: Option
      - alias:
          - doc: PacketGroup is a set of datagram sockets sharing one handler and chain.
            name: PacketGroup
            target: svcserver.PacketGroup
      - alias:
          - doc: Packet is one received datagram.
            name: Packet
            target: corenet.Packet
      - alias:
          - doc: PacketHandler serves one received datagram.
            name: PacketHandler
            target: corenet.PacketHandler
      - alias:
          - doc: PacketHandlerFunc adapts a plain function to PacketHandler.
            name: PacketHandlerFunc
            target: corenet.PacketHandlerFunc
      - alias:
          - doc: PacketMiddleware decorates a datagram handler.
            name: PacketMiddleware
            target: corenet.Middleware[corenet.PacketHandler]
      - func:
          doc: |-
            MaxPacketSize caps the datagram size a group accepts.

            A larger datagram is dropped and counted in [State].OversizedPackets, never
            delivered. Truncating would hand the handler a prefix indistinguishable from
            a complete message, which is a correctness problem rather than a capacity
            one; a drop it can observe in State is the honest answer.
          forward: svcserver.MaxPacketSize
          in:
            - name: "n"
              type: int
          name: MaxPacketSize
          out:
            - type: GroupOption
      - func:
          doc: |-
            BatchSize sets how many datagrams one read attempts to collect. One disables
            batching; zero selects the platform default. Where the platform cannot batch,
            State reports the degradation rather than hiding it.
          forward: svcserver.BatchSize
          in:
            - name: "n"
              type: int
          name: BatchSize
          out:
            - type: GroupOption
      - func:
          doc: |-
            BatchReplies makes a datagram group's replies leave per read batch: Reply
            then reports a queued reply sent, and a queued send that fails — when the batch
            ends, or earlier when the queue fills — is counted in
            [State].Datagrams.ReplyFailures; a reply too large to queue is written at once
            and returns its own error. On Linux a UDP socket batches
            them with sendmmsg and, where it can, UDP GSO; elsewhere each leaves with a
            WriteTo. Under it Reply is valid only during the handler's call, as Data is.
            Without it, Reply writes at once and returns the write's own error. A stream
            group refuses it.
          forward: svcserver.BatchReplies
          name: BatchReplies
          out:
            - type: GroupOption
      - func:
          doc: |-
            NewLoopLayer returns the LoopLayer a loop middleware's layer embeds over
            next, forwarding every callback to it.
          forward: corenet.NewLoopLayer
          in:
            - name: next
              type: LoopHandler
          name: NewLoopLayer
          out:
            - type: LoopLayer
      - func:
          doc: ChainPacket applies middlewares to a datagram handler, outermost first.
          forward: corenet.Chain
          in:
            - name: h
              type: PacketHandler
            - name: middlewares
              type: PacketMiddleware
          name: ChainPacket
          out:
            - type: PacketHandler
          variadic: true
      - func:
          doc: |-
            MaxConns caps how many connections a group serves at once.

            The budget is per group, not per socket: a group listening on a TCP port and
            a Unix socket, or sharded across several listeners, shares one ceiling —
            which is what an operator sizing a server actually means. Beyond it a
            connection is accepted and closed immediately with ConnLimitReached, because
            a refusal the peer can observe beats a timeout it cannot tell from a hang.
            Zero means no ceiling.
          forward: svcserver.MaxConns
          in:
            - name: "n"
              type: int
          name: MaxConns
          out:
            - type: GroupOption
      - func:
          doc: |-
            Shards sets how many listeners to open on each of the group's addresses.

            Zero selects one per core; one disables sharding. Where the platform (Windows
            has no SO_REUSEPORT) or the socket family (a Unix socket) cannot shard, the
            count collapses to one. An explicit count that collapses is reported in State
            with the reason; zero collapsing is not, since it asked for nothing a single
            listener fails to give.
          forward: svcserver.Shards
          in:
            - name: "n"
              type: int
          name: Shards
          out:
            - type: GroupOption
      - func:
          doc: |-
            Adopt takes over a socket inherited from a supervisor instead of binding one.

            Socket activation is what makes a zero-downtime restart possible: the
            supervisor holds the bound socket across the exec, so no connection is lost
            and no bind races. The name is the one the unit file publishes in
            LISTEN_FDNAMES. Repeat the option to adopt several sockets into one group.

            A named socket the supervisor did not pass is SocketAdoptFailed, never a
            silent fallback to binding: a service that quietly binds its own port has
            lost exactly the property activation exists to provide. The same holds on
            Windows, which has no socket activation at all: Start fails there with
            SocketAdoptFailed, whose cause field names UNSUPPORTED_PLATFORM.
          forward: svcserver.Adopt
          in:
            - name: names
              type: string
          name: Adopt
          out:
            - type: GroupOption
          variadic: true
      - func:
          doc: |-
            Plaintext declares that the group serves no TLS. Every engine honours it. A
            group given both Plaintext and TLS, in either order, fails Start with
            PlaintextWithTLS. An HTTP group without TLS must give it, or fails Start
            with PlaintextRequired.
          forward: svcserver.Plaintext
          name: Plaintext
          out:
            - type: GroupOption
      - func:
          doc: |-
            Protocols sets the HTTP versions an HTTP group serves, by ALPN identifier —
            "http/1.1" and "h2" — in the order its TLS listeners prefer them, unless the
            identity names NextProtos, whose order then wins over the entries the list
            holds. Unset, a group with TLS serves both, h2 first, and one without serves
            HTTP/1.1. Start refuses with ProtocolsRefused an empty list, an empty,
            repeated or unknown identifier, h2 without TLS, an identity whose NextProtos names a version the
            list excludes or none it includes, and a group that serves no http.Handler;
            a loop group refuses it with LoopOptionUnsupported.

            A request that arrived over HTTP/2 has no http.Hijacker: a handler that
            hijacks its connection serves HTTP/1.1 clients only, and a TLS group that
            relies on it for every client says Protocols("http/1.1").
          forward: svcserver.Protocols
          in:
            - name: protos
              type: string
          name: Protocols
          out:
            - type: GroupOption
          variadic: true
      - func:
          doc: |-
            Name names the group in State, logs and errors. On a group declared with an
            empty name it sets the name, which must then be unique like any other; on one
            declared with a name it must repeat it. An empty Name, or one that differs
            from a non-empty declared name, fails Start with GroupNameConflict.
          forward: svcserver.Name
          in:
            - name: name
              type: string
          name: Name
          out:
            - type: GroupOption
      - func:
          doc: |-
            Engine names the engine family the group runs on: EngineGoroutine, one
            goroutine per connection, or EngineLoop, the loop engine; Loop then picks the
            loop's backend. The zero value, EngineAuto, lets the handler's type choose.
            An engine the group's handler cannot run on, or that another option
            contradicts — EngineGoroutine with Loop or HandleLoop, EngineLoop with
            Handle, HandleFunc or HandleHTTP or on a datagram group — fails Start with
            EngineUnsupported, and is never replaced by the other engine.
          forward: svcserver.Engine
          in:
            - name: e
              type: EngineValue
          name: Engine
          out:
            - type: GroupOption
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcserver: github.com/kitsunium/sdk/internal/service/net/server
      tlsid: github.com/kitsunium/sdk/pkg/v1/net/tlsid
    path: github.com/kitsunium/sdk/pkg/v1/net/server
  - doc: |-
      Package sse is the server side of Server-Sent Events: a unidirectional
      server→client stream over an ordinary HTTP response.

      # The whole thing

      	func handler(w http.ResponseWriter, r *http.Request) {
      		stream, err := sse.New(w, r)
      		if err != nil {
      			http.Error(w, "streaming unavailable", http.StatusInternalServerError)
      			return
      		}
      		defer stream.Close()

      		for {
      			select {
      			case <-stream.Done():
      				return
      			case ev := <-events:
      				if err := stream.Send(sse.Event{ID: ev.Cursor, Name: "tick", Data: ev.JSON}); err != nil {
      					return
      				}
      			}
      		}
      	}

      It is written against net/http's own interfaces, so it works in any
      http.Handler. Mounted on this SDK's engine — Group.HandleHTTP — it
      additionally observes the server's drain signal, which is what stops an
      endless stream from holding a graceful shutdown open for its whole budget.

      # Why a newline is not an error

      The format has no escape mechanism. A line terminator inside a value is not
      quoted, it SPLITS the value across several "data:" lines, which the client
      rejoins with "\n" — so a multi-line payload is expressible and exact. The
      same absence of escaping makes a terminator inside [Event].ID or
      [Event].Name unrepresentable, and those are refused rather than truncated: a
      silently shortened id is a resume token pointing at the wrong place.

      # Reconnection, and what the SDK does not do

      A client stores the last non-empty id it saw and sends it back in the
      Last-Event-ID header when it reconnects. [Stream].LastEventID hands that
      cursor to the handler. Nothing is replayed from it, on purpose.

      A replay buffer held by the stream would be empty at exactly the moment a
      resume needs it — a reconnect is a NEW connection and therefore a new stream.
      A buffer that outlived the stream would be an application store: it has to
      know how many events to keep, how long they stay valid, and whether replaying
      them is even safe, which are questions about what the events MEAN and not
      about the transport. So the cursor is handed over and the handler resumes
      from its own log. Minting ids is the handler's job for the same reason: an id
      the SDK invented would be a number that means nothing to the application the
      client sends it back to.

      # Keep-alive

      An idle stream is indistinguishable from a dead one to a proxy counting idle
      seconds. [Stream] therefore sends a periodic comment — ignored by every
      client, so it can never be mistaken for an event. The interval defaults to
      [DefaultKeepAlive]; a zero passed to [KeepAlive] is clamped to it rather than
      silently meaning "never", and "never" is spelled [WithoutKeepAlive].

      # Shutdown

      [Stream].Done closes when the client disconnects, when the handler calls
      [Stream].Close, or when the server begins draining. [Stream].Send refuses
      once it has, so a handler that only ever calls Send in a loop terminates too.
      Both halves matter: without the second, one handler shape could still hold a
      graceful shutdown open until its budget expired.

      # Clients

      This package is the server half only. The SDK's outbound client returns a
      fully-read body by design and cannot consume a stream that never ends; see
      the package CLAUDE.md for why that is a separate decision rather than an
      omission.
    facade:
      - const:
          - doc: |-
              ContentType is the media type an event stream is served under. A client that
              receives anything else does not open an EventSource at all.
            name: ContentType
            reexport: corenet.SSEContentType
            type: string
            typed: true
            value: "\"text/event-stream\""
      - const:
          - doc: |-
              LastEventIDHeader is the request header a reconnecting client sends, carrying
              the id of the last event it processed.
            name: LastEventIDHeader
            reexport: corenet.SSELastEventIDHeader
            type: string
            typed: true
            value: "\"Last-Event-ID\""
      - const:
          - doc: |-
              MinRetry is the shortest reconnection hint [Event].Retry can carry. The wire
              field is an integer millisecond count, so anything shorter would round to
              zero — which does not mean "very soon", it means "reconnect immediately".
            name: MinRetry
            reexport: corenet.SSEMinRetry
            type: time.Duration
            typed: true
            value: "1000000"
      - const:
          - doc: |-
              DefaultKeepAlive is the comment cadence a stream uses when the caller sets
              none. It sits under the idle timeout of every proxy worth naming.
            name: DefaultKeepAlive
            reexport: svcsse.DefaultKeepAlive
            type: time.Duration
            typed: true
            value: "15000000000"
      - const:
          - doc: |-
              DefaultWriteTimeout bounds ONE frame's write. A stream has no total write
              budget by nature; this is what stops a peer that has stopped reading from
              pinning a goroutine forever.
            name: DefaultWriteTimeout
            reexport: svcsse.DefaultWriteTimeout
            type: time.Duration
            typed: true
            value: "10000000000"
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: |-
              FieldInvalid reports an event the wire format cannot carry: a line
              terminator in an id, an event name or a comment; a negative or
              sub-millisecond retry; an event name with no data, which every client
              discards; or a frame with no field at all.
            name: FieldInvalid
            reexport: corenet.SSEFieldInvalid
            type: "*errs.Error"
          - doc: |-
              FlushUnsupported reports a ResponseWriter that cannot be flushed, and so
              cannot stream at all.
            name: FlushUnsupported
            reexport: corenet.SSEFlushUnsupported
            type: "*errs.Error"
          - doc: |-
              StreamClosed reports a send on a stream that has already ended — the
              client disconnected, the server began draining, or the handler closed it.
              It is the terminal outcome a streaming handler loops until.
            name: StreamClosed
            reexport: corenet.SSEStreamClosed
            type: "*errs.Error"
          - doc: |-
              StreamMisconfigured reports an option the domain refuses to interpret
              rather than guess at, such as a negative keep-alive interval.
            name: StreamMisconfigured
            reexport: corenet.SSEStreamMisconfigured
            type: "*errs.Error"
      - alias:
          - doc: |-
              Stream is one open event stream: an HTTP response held open, written one
              frame at a time and flushed after each. It is safe for concurrent use.
            name: Stream
            target: svcsse.Stream
      - alias:
          - doc: |-
              Event is one Server-Sent Events frame. [Event].Validate reports whether the
              wire format can carry it; [AppendEvent] writes it.
            name: Event
            target: corenet.SSEEventValue
      - alias:
          - doc: Option configures a Stream.
            name: Option
            target: svcsse.Option
      - func:
          doc: |-
            New starts an event stream on w and returns it.

            It writes the response headers and flushes them immediately, so the client
            connects at once rather than at the first event. It fails when the response
            cannot be flushed — checked before anything is written, so the handler is
            free to answer some other way.
          forward: svcsse.New
          in:
            - name: w
              type: http.ResponseWriter
            - name: r
              type: "*http.Request"
            - name: opts
              type: Option
          name: New
          out:
            - name: stream
              type: "*Stream"
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            AppendEvent appends ev's wire form to dst and returns the extended slice —
            the bytes [Stream].Send writes, for a caller that frames events onto a
            transport of its own.

            It appends nothing when the frame is invalid: the whole frame is validated
            first, so a partial frame never reaches dst. Appending rather than returning
            a fresh slice is what lets a caller reuse one buffer for every frame.
          forward: svcsse.AppendEvent
          in:
            - name: dst
              type: "[]byte"
            - name: ev
              type: Event
          name: AppendEvent
          out:
            - name: wire
              type: "[]byte"
            - name: err
              type: error
      - func:
          doc: |-
            KeepAlive sets the interval between keep-alive comments.

            Zero does not mean "never": a stream with keep-alive silently disabled works
            perfectly on a developer's loopback and dies at one minute behind a real
            proxy, which is the worst possible place to learn it. Zero is clamped to
            [DefaultKeepAlive]; a negative interval is refused. To disable it, say so
            with [WithoutKeepAlive].
          forward: svcsse.KeepAlive
          in:
            - name: d
              type: time.Duration
          name: KeepAlive
          out:
            - type: Option
      - func:
          doc: |-
            WithoutKeepAlive disables the keep-alive comment entirely, so that "never" is
            something a caller writes on purpose rather than something a zero does to
            them.
          forward: svcsse.WithoutKeepAlive
          name: WithoutKeepAlive
          out:
            - type: Option
      - func:
          doc: |-
            WriteTimeout bounds how long one frame's write may take.

            It is per-frame on purpose. A group's WriteTimeout is an absolute deadline
            for the whole response, which on an endless stream means the stream is cut at
            that instant; a stream replaces it with this bound, refreshed per frame. Zero
            is clamped to [DefaultWriteTimeout], negative is refused.
          forward: svcsse.WriteTimeout
          in:
            - name: d
              type: time.Duration
          name: WriteTimeout
          out:
            - type: Option
      - func:
          doc: |-
            Retry sets the reconnection delay the stream advertises in its opening frame.

            It is the server's one chance to control how hard clients come back: a fleet
            that all reconnect on the browser default of about three seconds is a
            thundering herd aimed at a server that has just restarted. Zero sends no
            retry field.
          forward: svcsse.Retry
          in:
            - name: d
              type: time.Duration
          name: Retry
          out:
            - type: Option
      - func:
          doc: |-
            DrainSignal returns the channel closed when the server serving this request
            begins draining, or nil when it publishes none.

            It is what [Stream] watches, exposed because an event stream is not the only
            handler that holds a connection open indefinitely — a long poll does too, and
            so will anything built on a protocol upgrade. A nil channel blocks forever,
            so a select that watches it needs no nil check.
          forward: corenet.DrainSignal
          in:
            - name: ctx
              type: context.Context
          name: DrainSignal
          out:
            - type: <-chan struct{}
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      svcsse: github.com/kitsunium/sdk/internal/service/net/sse
    path: github.com/kitsunium/sdk/pkg/v1/net/sse
  - doc: |-
      Package static serves a tree of files — a single-page application, a
      documentation site, an embed.FS — over HTTP: what http.FileServerFS does,
      and what it does not (ADR 0130).

      # The whole thing

      	//go:embed dist
      	var dist embed.FS

      	tree, _ := fs.Sub(dist, "dist")
      	assets, err := static.New(tree, static.Config{
      		SinglePageApp: true,
      		Immutable:     func(name string) bool { return strings.HasPrefix(name, "assets/") },
      	})
      	if err != nil {
      		return err
      	}
      	mux.Handle("GET /app/", http.StripPrefix("/app", assets))

      # What it refuses

        - A request path is cleaned from the root before anything is looked up,
          so no spelling of ".." climbs above the tree — whatever the file
          system itself does with a name.
        - A directory is never listed. It is served by its index.html, after a
          redirect to its name with a trailing slash so the page's relative links
          resolve inside it; a directory with no index.html is a 404.
        - Only GET and HEAD are answered; anything else is a 405 with Allow. HEAD
          answers exactly what GET would, without the body.

      # A single-page application

      With [Config].SinglePageApp, a path that has no extension and names nothing
      is served the root's index.html with a 200, so a client-side route
      survives a reload. A path WITH an extension that names nothing stays a 404:
      a script tag must never receive a page of HTML in place of the script it
      asked for.

      # Headers

      Every response — a file, a redirect, a 404, a 405, a 500 — carries a
      Content-Security-Policy ([DefaultContentSecurityPolicy] unless
      [Config].ContentSecurityPolicy names one), X-Content-Type-Options: nosniff,
      and a Referrer-Policy ([DefaultReferrerPolicy], "same-origin", unless
      [Config].ReferrerPolicy names one). [New] refuses a policy holding a control
      character, and a Referrer-Policy that is not a list of the tokens the
      specification defines, since a browser ignores one it does not know.

      Under nosniff a browser refuses a script or a stylesheet served with the
      wrong type, and the standard library lets a host's MIME tables override its
      own. The types a page cannot run without — HTML, JavaScript, CSS, JSON,
      WebAssembly, SVG, a web manifest — are therefore pinned, the same on every
      host.

      A file [Config].Immutable marks content-hashed is sent with
      [ImmutableCacheControl]: cached for a year and never revalidated. Every
      other response is sent with [RevalidateCacheControl], so a redeployed page
      is never served stale.

      # Errors a wrapper can see

      Every status goes through the ResponseWriter the handler was given, so a
      handler wrapped by one that records the status sees every 5xx. A name the
      file system refuses — nothing there, a character it cannot hold, a file
      used as a directory, a component too long — is the client's 404, because a
      client chooses every name it asks for and could otherwise produce a 5xx at
      will. A name the tree holds and cannot open, stat or seek — a permission
      refused, a storage failure — is a 500. A failure after the status is sent
      cannot change it; the body is cut short of its declared length instead.
    facade:
      - const:
          - doc: |-
              DefaultContentSecurityPolicy is the policy sent when Config names none: the
              page's own origin for everything it loads, no base URL or form target
              elsewhere, and no framing by another page.
            name: DefaultContentSecurityPolicy
            reexport: svcstatic.DefaultContentSecurityPolicy
            type: string
            typed: true
            value: "\"default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'\""
      - const:
          - doc: |-
              DefaultReferrerPolicy is the Referrer-Policy sent when Config names none: a
              full referrer to this origin, none at all to another.
            name: DefaultReferrerPolicy
            reexport: svcstatic.DefaultReferrerPolicy
            type: string
            typed: true
            value: "\"same-origin\""
      - const:
          - doc: |-
              ImmutableCacheControl is the Cache-Control of a file Config.Immutable marks
              content-hashed: a year, shared caches included, never revalidated.
            name: ImmutableCacheControl
            reexport: svcstatic.ImmutableCacheControl
            type: string
            typed: true
            value: "\"public, max-age=31536000, immutable\""
      - const:
          - doc: |-
              RevalidateCacheControl is the Cache-Control of every other response:
              stored, but revalidated before each use.
            name: RevalidateCacheControl
            reexport: svcstatic.RevalidateCacheControl
            type: string
            typed: true
            value: "\"no-cache\""
      - alias:
          - doc: |-
              Config says how a tree is served; its zero value is a working, strict
              configuration.
            name: Config
            target: svcstatic.Config
      - alias:
          - doc: |-
              Handler serves one file tree; it is an http.Handler, safe for concurrent
              use. The zero Handler has no tree and answers every request 500.
            name: Handler
            target: svcstatic.Handler
      - var:
          - doc: |-
              Misconfigured is returned by New for a nil tree, a header value holding a
              control character, or a Referrer-Policy that is not a list of known tokens.
              The "option" field names which; the value is never repeated.
            name: Misconfigured
            reexport: corenet.StaticMisconfigured
            type: "*errs.Error"
      - func:
          doc: |-
            New returns a Handler serving fsys as cfg says, or Misconfigured. It reads
            nothing from fsys. To serve a sub-directory, hand it the result of fs.Sub;
            to keep a link inside the tree from leading out of it, hand it an os.Root's
            FS rather than os.DirFS — the handler confines the names it is asked for,
            not what the tree's own entries point at.
          forward: svcstatic.NewHandler
          in:
            - name: fsys
              type: fs.FS
            - name: cfg
              type: Config
          name: New
          out:
            - type: "*Handler"
            - type: error
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      fs: io/fs
      svcstatic: github.com/kitsunium/sdk/internal/service/net/static
    path: github.com/kitsunium/sdk/pkg/v1/net/static
  - doc: |-
      Package tlsid builds TLS and mutual-TLS identities for the SDK's network
      domain (ADR 0029), from files on disk or from material already in memory.

      An Identity is opaque and redacts itself: its String and GoString output is
      always "<redacted>", so an accidental %v, %s or %#v cannot spill key material
      into a log line. The only way out is [Identity].ClientConfig or
      [Identity].ServerConfig, each of which mints a fresh *tls.Config, so one
      caller's mutation can never reach another.

      The package exists to close a specific, widely-repeated bug. The standard
      library's x509.CertPool.AppendCertsFromPEM reports failure through a boolean
      return that is almost universally discarded, so a CA bundle that is empty,
      truncated, or accidentally a private key produces a pool that parses without
      complaint and verifies nothing. Here such a bundle is a typed
      TLS_MATERIAL_INVALID error. An absent bundle (use the platform trust store)
      stays deliberately distinct from an unusable one.

      The same principle governs the rest of the surface: a certificate supplied
      without its key is refused rather than degraded to an anonymous connection, a
      server that demands a client certificate without a CA bundle to verify it
      against is refused at construction rather than rejecting every peer at
      handshake time, and the minimum version defaults to TLS 1.3 with TLS 1.0 and
      1.1 refused outright per RFC 8996. A silent downgrade is always the wrong
      answer for transport security, so this package never performs one.

      # Loading from disk

      	id, err := tlsid.Load(tlsid.FileParams{
      		CertFile:   "/etc/pki/client.crt",
      		KeyFile:    "/etc/pki/client.key",
      		RootsFile:  "/etc/pki/ca.crt",
      		ServerName: "sdm.core.svc",
      	})
      	if err != nil {
      		return err
      	}
      	conn, err := tls.Dial("tcp", "127.0.0.1:8000", id.ClientConfig())

      ServerName is optional in the type and close to mandatory in practice: any
      deployment reached through a port forward or a tunnel dials 127.0.0.1 while
      the peer certificate names the real service, and the handshake fails until
      ServerName overrides the verified name.

      # Loading from memory

      New takes the same material as bytes, so certificates can come from a secret
      manager without ever touching a filesystem:

      	id, err := tlsid.New(tlsid.Params{CertPEM: cert, KeyPEM: key, RootsPEM: ca})

      # Mutual TLS

      Set RequireClientCert on a server identity and supply the CA bundle that
      client certificates must chain to:

      	id, err := tlsid.Load(tlsid.FileParams{
      		CertFile:          "/etc/pki/server.crt",
      		KeyFile:           "/etc/pki/server.key",
      		ClientCAFile:      "/etc/pki/client-ca.crt",
      		RequireClientCert: true,
      	})
      	ln := tls.NewListener(raw, id.ServerConfig())
    facade:
      - alias:
          - doc: |-
              Identity is an opaque TLS identity. Its String and GoString output is always
              "<redacted>"; ClientConfig and ServerConfig are the only ways to reach the
              material, and each returns a fresh *tls.Config.
            name: Identity
            target: corenet.IdentityValue
      - alias:
          - doc: Params carries TLS material already held in memory.
            name: Params
            target: corenet.IdentityParams
      - alias:
          - doc: FileParams names TLS material to read from the filesystem.
            name: FileParams
            target: corenet.IdentityFileParams
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: |-
              MaterialInvalid reports TLS material that is missing, unreadable,
              malformed, or that yields no usable certificate. It is never downgraded to
              an empty trust store.
            name: MaterialInvalid
            reexport: corenet.TLSMaterialInvalid
            type: "*errs.Error"
          - doc: HandshakeFailed reports a TLS or mutual-TLS handshake that did not complete.
            name: HandshakeFailed
            reexport: corenet.TLSHandshakeFailed
            type: "*errs.Error"
      - func:
          doc: |-
            New validates TLS material held in memory and returns the opaque identity. It
            applies exactly the same rules as Load; only the source of the bytes differs.
          forward: corenet.NewIdentityValue
          in:
            - name: p
              type: Params
          name: New
          out:
            - name: id
              type: Identity
            - name: err
              type: error
      - func:
          doc: |-
            Load reads the named TLS material from disk and returns the opaque identity.
            A configured-but-unreadable file is an error, never a silently skipped one.
          forward: svctlsid.Load
          in:
            - name: p
              type: FileParams
          name: Load
          out:
            - name: id
              type: Identity
            - name: err
              type: error
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svctlsid: github.com/kitsunium/sdk/internal/service/net/tlsid
    path: github.com/kitsunium/sdk/pkg/v1/net/tlsid
  - doc: |-
      Package websocket is the server side of RFC 6455: an HTTP request upgraded
      into a bidirectional, message-oriented connection over the same socket.

      # The whole thing

      	func handler(w http.ResponseWriter, r *http.Request) {
      		conn, err := websocket.Upgrade(w, r)
      		if err != nil {
      			return // Upgrade has already written the HTTP refusal
      		}
      		defer conn.Close()

      		for {
      			msg, rerr := conn.Receive()
      			if rerr != nil {
      				return
      			}
      			if serr := conn.Send(msg); serr != nil {
      				return
      			}
      		}
      	}

      It is written against net/http's own interfaces, so it works in any
      http.Handler. Mounted on this SDK's engine — Group.HandleHTTP — it
      additionally observes the server's drain signal, which is what stops a
      connection that by design never ends from being severed under its handler on
      every deployment.

      # Messages, not frames

      [Conn].Receive returns whole messages. Fragmentation is the sender's private
      choice of chunk size, not a semantic boundary, so surfacing it would put an
      implementation detail of the peer's writer into every consumer. Control
      frames — Ping, Pong, Close — are answered underneath and never surface as
      messages: they are transport, not payload.

      The returned [Message].Data aliases the connection's reassembly buffer and is
      valid until the next [Conn].Receive. Keep it longer and you must copy it.
      That is what makes a steady-state read allocate nothing.

      # What is refused, and why refusing is the specification

      RFC 6455 is unusual in how much of it is stated as MUST-fail rather than
      should-tolerate, because a frame stream that keeps going after a
      disagreement is two endpoints reading different messages from the same bytes.
      This implementation refuses:

        - an unmasked client frame (§5.1) — masking is what stops a hostile script
          from steering a browser into emitting bytes a transparent proxy would
          read as a second, attacker-chosen HTTP request;
        - a set reserved bit or a reserved opcode (§5.2);
        - a fragmented or over-125-byte control frame (§5.5);
        - a length not in its minimal encoding (§5.2);
        - a continuation with no message in progress, or a new data frame
          interrupting one (§5.4);
        - a text message that is not valid UTF-8 (§8.1), judged on the reassembled
          message so a sequence straddling a fragment boundary stays valid;
        - a close code that must never travel — 1004, 1005, 1006, 1015 and the
          unallocated ranges (§7.4.2) — in either direction.

      # Bounds

      A frame announces its length in a 64-bit field the PEER writes.
      [MaxFrameSize] is checked against that announcement before a single byte is
      read or allocated, and [MaxMessageSize] against the accumulated total, since
      fragmentation lets a peer exceed any per-frame bound a thousand small frames
      at a time. Neither has an "unbounded" setting on purpose.

      # Extensions

      None are negotiated, permessage-deflate included. The server sends no
      Sec-WebSocket-Extensions header — which RFC 6455 §4.2.2 defines as the way to
      say "no extension is in use" — and the frame reader enforces the same answer
      by refusing any reserved bit an extension would have set. Compression is
      therefore a refusal the wire can verify, not a promise in a document.

      # Origin

      The browser's same-origin policy does not apply to WebSocket: any page can
      open a connection to this server, and the browser attaches the user's cookies
      to the handshake. By default an Origin header, when present, must name the
      request's own host and port — and, when this server terminates TLS itself,
      the https scheme as well, because an http:// page for the same host is
      exactly the downgrade the check exists to notice. A request with no Origin (a
      CLI, a service, a Go client) is allowed, because there is no ambient
      credential to abuse; the opaque "null" origin is refused.

      Behind a proxy that terminates TLS, the request reaches this server in
      plaintext whatever the browser used, so the default rule cannot see the
      scheme. It does not guess it either: a request carrying Forwarded or
      X-Forwarded-Proto on a connection this server did not terminate is refused,
      with a message naming what to configure. Only the PRESENCE of those headers
      is read, never their value — one a client writes can make the check stricter
      and never looser. [AllowOrigins] names the origins outright and replaces the
      default rule entirely; [AllowAnyOrigin] removes the check, by name.

      # One goroutine always reads

      Every connection needs exactly one goroutine looping on [Conn].Receive for
      its whole life — including a connection the handler only ever writes to.
      That loop is where the peer's Ping is answered (RFC 6455 §5.5.2), where its
      Close is replied to (§5.5.1), and the only place the heartbeat can see that
      the peer is alive. A handler that pushes runs it in a goroutine of its own
      and discards what it reads:

      	func push(w http.ResponseWriter, r *http.Request) {
      		conn, err := websocket.Upgrade(w, r)
      		if err != nil {
      			return
      		}
      		defer conn.Close()

      		go func() { // the reader: required even with nothing to read
      			for {
      				if _, rerr := conn.Receive(); rerr != nil {
      					return
      				}
      			}
      		}()

      		for {
      			select {
      			case <-conn.Done():
      				return
      			case event := <-events: // the application's own feed
      				if serr := conn.SendText(event); serr != nil {
      					return
      				}
      			}
      		}
      	}

      The reading goroutine needs no joining: the deferred Close ends the
      connection, and its Receive returns the terminal error.

      # Liveness and shutdown

      A peer that vanishes without closing leaves a socket that is perfectly
      readable and will simply never produce another byte. The heartbeat is the
      only thing that turns that silence into an ending: every [PingInterval] it
      sends a Ping, and one interval later it ends the connection if the handler
      has READ no frame since. It counts frames the handler has read, not frames
      that arrived — a Pong the peer sent on time is silence to it until
      [Conn].Receive reads it — so a connection nobody reads is ended within two
      intervals, about a minute at [DefaultPingInterval], however healthy the peer
      is. Zero is clamped to [DefaultPingInterval] rather than meaning "never", and
      "never" is spelled [WithoutPing].

      [Conn].Done closes when the peer sends Close, when the socket dies, when the
      heartbeat gives up, when the handler closes it, or when the server begins
      draining — in which case the connection sends a 1001 "going away" of its own
      accord. [Conn].Receive and [Conn].Send refuse from the same instant, so the
      reading loop and a pushing loop both terminate too.

      # Clients

      This package is the server half only. The SDK's outbound client returns a
      fully-read body by design and cannot dial an upgrade; see the package
      CLAUDE.md for why that is a separate decision rather than an omission.
    facade:
      - const:
          - doc: |-
              GUID is the fixed string RFC 6455 §1.3 concatenates to the client's key
              before hashing. It is a constant of the protocol, not a secret.
            name: GUID
            reexport: corenet.WSGUID
            type: string
            typed: true
            value: "\"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\""
      - const:
          - doc: |-
              Version is the only protocol version this server speaks. A request naming
              another is refused WITH this value advertised back, so a client can
              renegotiate instead of guessing.
            name: Version
            reexport: corenet.WSVersion
            type: string
            typed: true
            value: "\"13\""
      - const:
          - doc: |-
              MaxControlPayload is the ceiling RFC 6455 §5.5 puts on a control frame's
              payload, and therefore on a [Conn].Ping payload or a close reason.
            name: MaxControlPayload
            reexport: corenet.WSMaxControlPayload
            type: int
            typed: true
            value: "125"
      - const:
          - doc: |-
              DefaultPingInterval is the heartbeat cadence a connection uses when the
              caller sets none. It sits under the idle timeout of every proxy worth naming.
            name: DefaultPingInterval
            reexport: svcws.DefaultPingInterval
            type: time.Duration
            typed: true
            value: "30000000000"
      - const:
          - doc: |-
              DefaultWriteTimeout bounds ONE frame's write. A connection has no total write
              budget by nature; this is what stops a peer that has stopped reading from
              pinning a goroutine forever.
            name: DefaultWriteTimeout
            reexport: svcws.DefaultWriteTimeout
            type: time.Duration
            typed: true
            value: "10000000000"
      - const:
          - doc: DefaultMaxMessageSize is the ceiling on one reassembled message.
            name: DefaultMaxMessageSize
            reexport: svcws.DefaultMaxMessageSize
            type: int64
            typed: true
            value: 1 << 20
      - const:
          - doc: DefaultMaxFrameSize is the ceiling on a single frame's announced payload.
            name: DefaultMaxFrameSize
            reexport: svcws.DefaultMaxFrameSize
            type: int64
            typed: true
            value: 1 << 20
      - const:
          - doc: CloseNormal is a completed purpose, on either side.
            name: CloseNormal
            reexport: corenet.WSCloseNormal
            type: CloseCode
            typed: true
            value: "1000"
          - doc: CloseGoingAway is a server shutting down; it is what a drain sends.
            name: CloseGoingAway
            reexport: corenet.WSCloseGoingAway
            type: CloseCode
            typed: true
            value: "1001"
          - doc: CloseProtocolError is a frame the RFC forbids.
            name: CloseProtocolError
            reexport: corenet.WSCloseProtocolError
            type: CloseCode
            typed: true
            value: "1002"
          - doc: |-
              CloseUnsupportedData is a well-formed frame carrying data this endpoint
              cannot accept.
            name: CloseUnsupportedData
            reexport: corenet.WSCloseUnsupportedData
            type: CloseCode
            typed: true
            value: "1003"
          - doc: CloseNoStatus means the peer's Close frame carried no code.
            name: CloseNoStatus
            reexport: corenet.WSCloseNoStatus
            type: CloseCode
            typed: true
            value: "1005"
          - doc: CloseAbnormal means the connection died without a Close frame.
            name: CloseAbnormal
            reexport: corenet.WSCloseAbnormal
            type: CloseCode
            typed: true
            value: "1006"
          - doc: CloseInvalidPayload is text that is not valid UTF-8.
            name: CloseInvalidPayload
            reexport: corenet.WSCloseInvalidPayload
            type: CloseCode
            typed: true
            value: "1007"
          - doc: ClosePolicyViolation is the generic refusal when no other code fits.
            name: ClosePolicyViolation
            reexport: corenet.WSClosePolicyViolation
            type: CloseCode
            typed: true
            value: "1008"
          - doc: CloseTooLarge is a message beyond what this endpoint accepts.
            name: CloseTooLarge
            reexport: corenet.WSCloseTooLarge
            type: CloseCode
            typed: true
            value: "1009"
          - doc: CloseExtensionRequired is a client giving up for want of an extension.
            name: CloseExtensionRequired
            reexport: corenet.WSCloseExtensionRequired
            type: CloseCode
            typed: true
            value: "1010"
          - doc: CloseInternalError is an unexpected condition on this side.
            name: CloseInternalError
            reexport: corenet.WSCloseInternalError
            type: CloseCode
            typed: true
            value: "1011"
          - doc: CloseTLSHandshake means the TLS handshake failed.
            name: CloseTLSHandshake
            reexport: corenet.WSCloseTLSHandshake
            type: CloseCode
            typed: true
            value: "1015"
        doc: |-
          The close codes RFC 6455 §7.4.1 defines. [CloseNoStatus], [CloseAbnormal] and
          [CloseTLSHandshake] describe the ABSENCE of a close frame: they may be
          observed through [Conn].PeerCloseCode and must never be sent, which
          [Conn].CloseWith enforces — as it refuses [CloseExtensionRequired], the one
          code only a client may open a closing handshake with.
      - doc: Sentinels returned by this package. Match with errors.Is or errs.HasCode.
        var:
          - doc: |-
              HandshakeFailed reports a request that is not a valid RFC 6455 opening
              handshake, or one whose origin the policy refused. [Upgrade] has already
              written the HTTP response when it returns this.
            name: HandshakeFailed
            reexport: corenet.WSHandshakeFailed
            type: "*errs.Error"
          - doc: |-
              UpgradeUnsupported reports a response whose connection cannot be taken
              over — HTTP/2, or a middleware that wraps the ResponseWriter without
              forwarding Unwrap. The request was fine; this stack cannot serve it.
            name: UpgradeUnsupported
            reexport: corenet.WSUpgradeUnsupported
            type: "*errs.Error"
          - doc: |-
              ProtocolViolation reports a frame RFC 6455 forbids. The connection has
              already been failed when it surfaces.
            name: ProtocolViolation
            reexport: corenet.WSProtocolViolation
            type: "*errs.Error"
          - doc: |-
              MessageTooLarge reports a frame or a reassembled message beyond the
              configured ceiling, refused before any buffer was sized from it.
            name: MessageTooLarge
            reexport: corenet.WSMessageTooLarge
            type: "*errs.Error"
          - doc: |-
              InvalidPayload reports text that is not UTF-8, a close code that must
              never travel, or a close reason past the control-frame ceiling.
            name: InvalidPayload
            reexport: corenet.WSInvalidPayload
            type: "*errs.Error"
          - doc: |-
              ConnClosed reports an operation on a connection that has ended. It is the
              terminal outcome a receive loop runs until, and it carries the peer's
              close code when there was one.
            name: ConnClosed
            reexport: corenet.WSConnClosed
            type: "*errs.Error"
          - doc: |-
              ConnMisconfigured reports an option the domain refuses to interpret
              rather than guess at, such as a negative ping interval.
            name: ConnMisconfigured
            reexport: corenet.WSConnMisconfigured
            type: "*errs.Error"
      - alias:
          - doc: |-
              Conn is one upgraded WebSocket connection.

              Exactly one goroutine loops on [Conn].Receive for the connection's whole
              life. Never two: the protocol is a single ordered frame stream, so two
              readers would each take half of a message. Never zero: that loop is also
              where Pings are answered, where the peer's Close is replied to and where the
              heartbeat sees the peer alive, so a connection nobody reads is ended within
              two ping intervals — see the package documentation for the push-handler
              shape. Writes are safe for concurrent use.
            name: Conn
            target: svcws.Conn
      - alias:
          - doc: Message is one complete WebSocket application message.
            name: Message
            target: corenet.WSMessageValue
      - alias:
          - doc: CloseCode is the status code a Close frame carries (RFC 6455 §7.4).
            name: CloseCode
            target: corenet.WSCloseCode
      - alias:
          - doc: Option configures a Conn.
            name: Option
            target: svcws.Option
      - func:
          doc: |-
            Upgrade completes the RFC 6455 opening handshake and returns the connection.

            On failure it has ALREADY written the HTTP response — a 426 carrying the
            version this server speaks, a 400, a 403 or a 405 as the fault requires — so
            the handler should simply return.

            The socket is taken over from net/http. It is no longer the HTTP server's to
            close, nor this SDK's listener engine's: it is the handler's until
            [Conn].Close.
          forward: svcws.Upgrade
          in:
            - name: w
              type: http.ResponseWriter
            - name: r
              type: "*http.Request"
            - name: opts
              type: Option
          name: Upgrade
          out:
            - name: conn
              type: "*Conn"
            - name: err
              type: error
          variadic: true
      - func:
          doc: |-
            Subprotocols declares the subprotocols this server speaks, most preferred
            first.

            The SERVER's order decides. A client advertises what it can speak; choosing
            among those is the server's call, or a client that listed a deprecated
            dialect first could pin the server to it forever. No overlap is not a failure
            — the upgrade succeeds with no subprotocol, which RFC 6455 §4.2.2 names as
            the way to say "none agreed".

            Each name must be an RFC 7230 token, since the chosen one is written into
            the response verbatim; a name with a space, a comma or a quote is refused at
            Upgrade. The list is copied, so reusing the slice changes nothing later.
          forward: svcws.Subprotocols
          in:
            - name: names
              type: string
          name: Subprotocols
          out:
            - type: Option
          variadic: true
      - func:
          doc: |-
            MaxMessageSize bounds one reassembled message.

            Zero is clamped to [DefaultMaxMessageSize], negative is refused. There is
            deliberately no "unbounded" setting: the length is announced by the peer in a
            64-bit field, and fragmentation lets it keep announcing more, so an unbounded
            ceiling is not a configuration choice — it is a remote memory allocator.
          forward: svcws.MaxMessageSize
          in:
            - name: "n"
              type: int64
          name: MaxMessageSize
          out:
            - type: Option
      - func:
          doc: |-
            MaxFrameSize bounds one frame's ANNOUNCED payload length.

            It is separate from [MaxMessageSize] because it is enforced at a different
            moment: against the header, before a byte is read or allocated. A ceiling
            above the message ceiling can never be reached and is refused as a mistake.
          forward: svcws.MaxFrameSize
          in:
            - name: "n"
              type: int64
          name: MaxFrameSize
          out:
            - type: Option
      - func:
          doc: |-
            PingInterval sets how often the connection pings an otherwise silent peer.

            Zero does not mean "never": it is clamped to [DefaultPingInterval], because a
            connection with the heartbeat silently disabled works perfectly on loopback
            and then stops noticing peers that vanish — which is how a mobile client
            normally leaves. A negative interval is refused; "never" is [WithoutPing].

            The heartbeat counts frames the handler has READ, so it keeps a connection
            open only while one goroutine loops on [Conn].Receive; a connection nobody
            reads is ended within two intervals, however healthy the peer.
          forward: svcws.PingInterval
          in:
            - name: d
              type: time.Duration
          name: PingInterval
          out:
            - type: Option
      - func:
          doc: |-
            WithoutPing disables the heartbeat, and with it the connection's only
            liveness check. Use it where the transport provides its own.
          forward: svcws.WithoutPing
          name: WithoutPing
          out:
            - type: Option
      - func:
          doc: |-
            WriteTimeout bounds how long one frame's write may take.

            It is per-frame on purpose: a group's WriteTimeout is an absolute deadline
            for one HTTP response, and this connection outlives the response entirely.
            Zero is clamped to [DefaultWriteTimeout], negative is refused.
          forward: svcws.WriteTimeout
          in:
            - name: d
              type: time.Duration
          name: WriteTimeout
          out:
            - type: Option
      - func:
          doc: |-
            AllowOrigins replaces the default same-origin rule with an exact allowlist.

            The comparison is on the whole Origin header — scheme, host and port —
            case-insensitively. Matching the host alone would accept http:// for an https
            server, which is the downgrade the check exists to notice. Behind a proxy
            that terminates TLS this is the only way to have the scheme checked at all:
            the request arrives in plaintext there, so the default rule cannot see which
            scheme the browser used.
          forward: svcws.AllowOrigins
          in:
            - name: origins
              type: string
          name: AllowOrigins
          out:
            - type: Option
          variadic: true
      - func:
          doc: |-
            AllowAnyOrigin disables the origin check.

            It has to be written out because the browser's same-origin policy does not
            apply to WebSocket: any page may open a connection to this server and the
            browser will attach the user's cookies to the handshake. Reach for it when
            authentication does not ride on ambient credentials — a bearer token, a
            signed ticket — which is exactly when the origin proves nothing anyway.
          forward: svcws.AllowAnyOrigin
          name: AllowAnyOrigin
          out:
            - type: Option
      - func:
          doc: |-
            AcceptKey computes the Sec-WebSocket-Accept value for a client's
            Sec-WebSocket-Key (RFC 6455 §4.2.2).

            It is exported for tests and for anyone writing a client handshake by hand.
            The digest is SHA-1 by the RFC's own instruction and is not a security
            primitive: its job is to prove the server parsed the handshake rather than
            replaying it, so a cached 101 cannot pass for a live upgrade.
          forward: svcws.AcceptKey
          in:
            - name: key
              type: string
          name: AcceptKey
          out:
            - type: string
      - func:
          doc: |-
            DrainSignal returns the channel closed when the server serving this request
            begins draining, or nil when it publishes none.

            [Conn] watches it for you. It is re-exported here because a handler often
            wants to stop its own work at the same moment, and a nil channel blocks
            forever, so a select that watches it needs no nil check.
          forward: corenet.DrainSignal
          in:
            - name: ctx
              type: context.Context
          name: DrainSignal
          out:
            - type: <-chan struct{}
    imports:
      corenet: github.com/kitsunium/sdk/internal/core/net
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      http: net/http
      svcws: github.com/kitsunium/sdk/internal/service/net/websocket
    path: github.com/kitsunium/sdk/pkg/v1/net/websocket
