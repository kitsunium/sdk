apiVersion: kit.kitsunium/design/v2
domain: observe/trace
packages:
  - codes:
      - const:
          - doc: |-
              CodeInvalidTraceParent identifies a traceparent header that cannot be read as
              a span context: a malformed field, the invalid version "ff", or an all-zero
              trace-id or parent-id — the two values W3C Trace Context declares invalid.
            name: CodeInvalidTraceParent
            note: "range: 0.2.20.0 - 0.2.20.255"
            value: "0x00_02_14_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidTraceState identifies a tracestate header that does not match the
              W3C list grammar: a key or value outside its character set, more than 32 list
              members, or the same key twice.
            name: CodeInvalidTraceState
            value: "0x00_02_14_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownExporter identifies an Export/Lookup naming a span exporter that no
              imported package has registered.
            name: CodeUnknownExporter
            value: "0x00_02_14_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeExportFailed identifies a span exporter that returned an error while
              shipping a batch (the exporter's cause rides the wrap trail).
            name: CodeExportFailed
            value: "0x00_02_14_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies a boot-time SpanExporter registry
              collision: a nil exporter, or a distinct exporter claiming a taken Name.
            name: CodeDuplicateRegistration
            value: "0x00_02_14_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidSpanName identifies a Start call with an empty span name. A span's
              name is the low-cardinality operation label every backend groups on, so an
              empty one produces a trace nobody can search for.
            name: CodeInvalidSpanName
            value: "0x00_02_14_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidAttribute identifies an attribute set a span, an event, a link or
              a Resource cannot carry: an attribute with an empty Key, the same Key twice,
              or a value no constructor ever set (AttrKindInvalid). The rules are the
              shared model's (internal/core/observe/otel); this code is the trace signal's own,
              where it used to borrow the metrics one (0.2.9.4) because the model lived in
              internal/core/observe/metrics.
            name: CodeInvalidAttribute
            value: "0x00_02_14_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntropyFailed identified a crypto/rand.Read failure while drawing the
              bytes of a trace or span identifier. Nothing returns it since Go 1.24,
              whose crypto/rand.Read cannot fail; the code stays allocated and published.
            name: CodeEntropyFailed
            note: |-
              range: 0.3.50.0 - 0.3.50.255 — allocated to the tracing engine,
              internal/service/observe/trace (ADR 0051 service/observe/trace block), and
              declared here since ADR 0160: the engine returns these and declares none.
            value: "0x00_03_32_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidSampleRatio identifies a Ratio sampler asked for a fraction that
              is not one: NaN, negative, above 1, or exactly 0 — which is NeverSample under
              a name that also spells "unconfigured" (ADR 0031).
            name: CodeInvalidSampleRatio
            value: "0x00_03_32_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPInvalidSpanContext identifies a span handed to the OTLP/JSON encoder
              whose trace-id or span-id is all zeroes. Both are declared invalid by W3C
              Trace Context and required by the schema, so there is no honest hex to emit.
            name: CodeOTLPInvalidSpanContext
            value: "0x00_03_32_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPSpanNotEnded identifies a span handed to the OTLP/JSON encoder with no
              EndTime. `end_time_unix_nano` is required, and a zero would claim the span
              ended at the Unix epoch.
            name: CodeOTLPSpanNotEnded
            value: "0x00_03_32_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPEndpointInvalid identifies an OTLP/HTTP exporter configured with an
              endpoint that is not an absolute http(s) URL carrying a path — the address
              the POST would otherwise be sent to blind.
            name: CodeOTLPEndpointInvalid
            value: "0x00_03_32_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPExportRejected identifies a collector that refused the payload
              PERMANENTLY: an HTTP status outside the specification's retryable set, so
              replaying the same bytes would fail the same way.
            name: CodeOTLPExportRejected
            value: "0x00_03_32_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPExportUnavailable identifies a TRANSIENT OTLP/HTTP failure — a
              transport fault, or one of the four statuses the specification lists as
              retryable. The same bytes may succeed later.
            name: CodeOTLPExportUnavailable
            value: "0x00_03_32_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPPartialSuccess identifies a collector that accepted the request
              (HTTP 200) but rejected some of its spans. The specification forbids retrying
              it, so the loss is reported rather than replayed.
            name: CodeOTLPPartialSuccess
            value: "0x00_03_32_08"
        type: errs.Code
    constants:
      - name: ExceptionEventName
        type: string
        value: "\"exception\""
      - name: ExceptionTypeKey
        type: string
        value: "\"exception.type\""
      - name: ExceptionMessageKey
        type: string
        value: "\"exception.message\""
      - name: ExceptionStacktraceKey
        type: string
        value: "\"exception.stacktrace\""
      - name: TraceIDLen
        type: int
        value: "16"
      - name: SpanIDLen
        type: int
        value: "8"
      - name: TraceIDHexLen
        type: int
        value: "32"
      - name: SpanIDHexLen
        type: int
        value: "16"
      - name: FlagSampled
        type: TraceFlags
        value: "0x01"
      - name: DefaultScopeName
        type: string
        value: "\"github.com/kitsunium/sdk/pkg/v1/observe/trace\""
      - name: SpanKindUnspecified
        type: SpanKind
        value: "0"
      - name: SpanKindInternal
        type: SpanKind
        value: "1"
      - name: SpanKindServer
        type: SpanKind
        value: "2"
      - name: SpanKindClient
        type: SpanKind
        value: "3"
      - name: SpanKindProducer
        type: SpanKind
        value: "4"
      - name: SpanKindConsumer
        type: SpanKind
        value: "5"
      - name: MaxTraceStateMembers
        type: int
        value: "32"
      - name: MaxTraceStateKeyLen
        type: int
        value: "256"
      - name: MaxTraceStateValueLen
        type: int
        value: "256"
      - name: StatusUnset
        type: StatusCode
        value: "0"
      - name: StatusOK
        type: StatusCode
        value: "1"
      - name: StatusError
        type: StatusCode
        value: "2"
    functions:
      - in:
          - name: sorted
            type: "[]coreotel.AttrValue"
        name: ValidateAttrs
      - in:
          - name: attrs
            type: "[]coreotel.AttrValue"
        name: SortAttrs
        out:
          - type: "[]coreotel.AttrValue"
      - in:
          - name: resource
            type: coreotel.ResourceValue
        name: NormalizeResource
        out:
          - type: coreotel.ResourceValue
      - in:
          - name: parent
            type: context.Context
          - name: context
            type: SpanContextValue
        name: ContextWithSpanContext
        out:
          - type: context.Context
      - in:
          - name: ctx
            type: context.Context
        name: SpanContextFromContext
        out:
          - type: SpanContextValue
      - in:
          - name: e
            type: SpanExporter
        name: RegisterExporter
        out:
          - type: SpanExporter
      - in:
          - name: name
            type: ExporterName
        name: LookupExporter
        out:
          - name: e
            type: SpanExporter
          - name: ok
            type: bool
      - name: AvailableExporters
        out:
          - type: "[]ExporterName"
      - in:
          - name: name
            type: ExporterName
          - name: spans
            type: SpansValue
        name: Export
        out:
          - type: error
      - in:
          - name: text
            type: string
        name: ParseTraceID
        out:
          - name: id
            type: TraceID
          - name: err
            type: error
      - in:
          - name: text
            type: string
        name: ParseSpanID
        out:
          - name: id
            type: SpanID
          - name: err
            type: error
      - in:
          - name: scope
            type: coreotel.ScopeValue
        name: NormalizeScope
        out:
          - type: coreotel.ScopeValue
      - in:
          - name: size
            type: int
        name: NewStateBuilder
        out:
          - type: StateBuilder
    imports:
      coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/trace
    ports:
      - doc: |-
          Carrier is the two-method surface a header set has to present for a span
          context to travel through it.

          It is exactly http.Header's Get/Set pair, on purpose and to the letter, so
          the engine's `trace.Inject(ctx, req.Header)` compiles with no adapter — and
          so this package still imports no net/http, which would drag an HTTP opinion
          into a contract that also has to serve a message queue and a gRPC metadata
          map.

          IFACE-PLUGIN: it is FROZEN at two methods (ADR 0039). Adding a third — Del,
          Values, a multi-value read — would break every downstream two-method double at
          compile time with no deprecation window, and every one of those additions is
          reachable as a sibling interface instead. Two is also what makes http.Header
          satisfy it structurally, which is the whole ergonomics.
        methods:
          - in:
              - name: key
                type: string
            name: Get
            out:
              - type: string
          - in:
              - name: key
              - name: value
                type: string
            name: Set
        name: Carrier
      - doc: |-
          SpanExporter ships a batch of finished spans to a backend.
          Implementations MUST be safe for concurrent use.

          IFACE-PLUGIN: the registry stores plug-in exporters behind this interface;
          concrete exporter types stay unexported per package.
        methods:
          - name: Name
            out:
              - type: ExporterName
          - in:
              - name: spans
                type: SpansValue
            name: Export
            out:
              - type: error
        name: SpanExporter
      - doc: |-
          Tracer starts spans. It is the only way a span comes into existence.

          IFACE-PLUGIN: it is FROZEN at one method (ADR 0039). Everything a caller might
          want to add — a second Start taking an explicit clock, a Flush, a Shutdown —
          is reachable as a sibling interface or as a method on the concrete type, and
          none of them is worth breaking every downstream double for.

          Start returns a context carrying the new span's context, so a callee that
          starts its own span becomes a child without either function naming the other.
          The Span is returned separately rather than fished back out of the context,
          because a caller who has to look up the span they just created will eventually
          look up the wrong one.

          An EMPTY name panics with InvalidSpanName: a span name is the low-cardinality
          operation label every backend groups on, it is a literal at the call site, and
          it is therefore wrong on the first call or never — the same argument that makes
          an unusable attribute key a panic in `metrics`.
        methods:
          - in:
              - name: ctx
                type: context.Context
              - name: name
                type: string
              - name: params
                type: SpanParams
            name: Start
            out:
              - name: child
                type: context.Context
              - name: span
                type: Span
        name: Tracer
      - doc: |-
          Span is one live, recording span.

          IFACE-PLUGIN: FROZEN at five methods (ADR 0039). Two things a reader will
          expect and not find, each deliberate:

            - There is no RecordError. It would have to decide what an error's TYPE is,
              which is a judgement about the caller's error model, and it is expressible
              as one AddEvent call. pkg/v1/observe/trace ships it as a HELPER over this port
              instead, which is exactly the shape that does not freeze a decision into a
              port.
            - End takes no timestamp. A span that ends at a time other than "now" is
              either replaying history or working around a clock, and both want a sibling
              interface rather than a parameter every caller has to pass a zero value to.

          Every method is safe for concurrent use and every one is a NO-OP on an
          unsampled span, so instrumentation costs nothing when sampling is off. End is
          idempotent: the second call is ignored rather than emitting the span twice.
        methods:
          - doc: SpanContext returns the span's identity — what Inject propagates.
            name: SpanContext
            out:
              - type: SpanContextValue
          - doc: SetAttrs adds or replaces typed dimensions on the span.
            in:
              - name: attrs
                type: coreotel.AttrValue
            name: SetAttrs
            variadic: true
          - doc: AddEvent records a timestamped point inside the span.
            in:
              - name: name
                type: string
              - name: attrs
                type: coreotel.AttrValue
            name: AddEvent
            variadic: true
          - doc: SetStatus records the operation's outcome.
            in:
              - name: code
                type: StatusCode
              - name: message
                type: string
            name: SetStatus
          - doc: End closes the span and hands it to the Tracer's SpanSink.
            name: End
        name: Span
    sentinels:
      - var:
          - code: CodeInvalidTraceParent
            doc: |-
              InvalidTraceParent is returned when a traceparent header cannot be read.
              Its Public never echoes the header: it is attacker-controlled text.
            name: InvalidTraceParent
            private: "service/observe/trace.ParseTraceParent: the header failed the W3C Trace Context grammar, or carried an all-zero trace-id or parent-id"
            public: The traceparent header is not a valid W3C trace context
            reason: INVALID_TRACE_PARENT
          - code: CodeInvalidTraceState
            doc: InvalidTraceState is returned when a tracestate header cannot be read.
            name: InvalidTraceState
            private: "service/observe/trace.ParseTraceState, StateValue.Insert or StateBuilder.Add: a member failed the W3C list grammar, or the list exceeded 32 members or repeated a key"
            public: The tracestate header is not a valid W3C trace state list
            reason: INVALID_TRACE_STATE
          - code: CodeUnknownExporter
            doc: UnknownExporter is returned when no SpanExporter is registered under a Name.
            name: UnknownExporter
            private: "core/observe/trace.Export: exporter absent from registry; blank-import the exporter's package"
            public: No trace exporter is registered under that name
            reason: UNKNOWN_EXPORTER
          - code: CodeExportFailed
            doc: ExportFailed wraps an exporter's failure while shipping spans.
            name: ExportFailed
            private: "core/observe/trace.Export: the registered exporter returned an error"
            public: The trace exporter failed to ship the spans
            reason: EXPORT_FAILED
          - code: CodeDuplicateRegistration
            doc: DuplicateRegistration is the boot-time SpanExporter-registry panic sentinel.
            name: DuplicateRegistration
            private: "core/observe/trace.RegisterExporter: a distinct exporter already claims this name, or a nil exporter was supplied"
            public: A trace exporter is already registered under that name
            reason: DUPLICATE_REGISTRATION
          - code: CodeInvalidSpanName
            doc: InvalidSpanName is the panic sentinel for a Start call with no name.
            name: InvalidSpanName
            private: "core/observe/trace: Tracer.Start requires a low-cardinality operation name; an empty one produces a trace no backend can group"
            public: A span name must not be empty
            reason: INVALID_SPAN_NAME
          - code: CodeInvalidAttribute
            doc: |-
              InvalidAttribute is the panic sentinel for an unusable attribute set on
              a span, an event, a link or a Resource.
            name: InvalidAttribute
            private: "core/observe/trace: an attribute set must name each dimension once, with a non-empty key and a value from String/Bool/Int64/Float64"
            public: An attribute key is empty or repeated, or its value was never set
            reason: INVALID_ATTRIBUTE
          - code: CodeEntropyFailed
            doc: |-
              EntropyFailed was the wrap of a crypto/rand.Read failure while drawing
              trace or span id bytes. Nothing returns it since Go 1.24, whose
              crypto/rand.Read never fails; it stays published with its value.
            name: EntropyFailed
            private: "service/observe/trace: crypto/rand.Read returned an error"
            public: Trace identifier generation failed to read secure random bytes
            reason: ENTROPY_FAILED
          - code: CodeInvalidSampleRatio
            doc: |-
              InvalidSampleRatio is returned when Ratio is handed a fraction it will
              not turn into a sampler.
            name: InvalidSampleRatio
            private: "service/observe/trace.Ratio: use NeverSample for none and AlwaysSample for all; 0 also spells an unset field, so it is refused rather than guessed"
            public: A sampling ratio must be greater than 0 and at most 1
            reason: INVALID_SAMPLE_RATIO
          - code: CodeOTLPInvalidSpanContext
            doc: OTLPInvalidSpanContext is returned when a span carries an unusable id.
            name: OTLPInvalidSpanContext
            private: "service/observe/trace: OTLP requires 16 trace-id bytes and 8 span-id bytes, and W3C Trace Context declares the all-zero form of each invalid"
            public: A span carries an all-zero trace or span identifier
            reason: OTLP_INVALID_SPAN_CONTEXT
          - code: CodeOTLPSpanNotEnded
            doc: OTLPSpanNotEnded is returned when a span reaches the encoder unended.
            name: OTLPSpanNotEnded
            private: "service/observe/trace: endTimeUnixNano is required; a zero would claim the span ended at the Unix epoch"
            public: A span reached the exporter without an end time
            reason: OTLP_SPAN_NOT_ENDED
          - code: CodeOTLPEndpointInvalid
            doc: OTLPEndpointInvalid is returned when an OTLP/HTTP endpoint is unusable.
            name: OTLPEndpointInvalid
            private: "service/observe/trace.NewOTLPHTTPExporter: a bare host connects, answers 404 and looks exactly like a collector that is up"
            public: The OTLP endpoint must be an absolute http(s) URL with a path
            reason: OTLP_ENDPOINT_INVALID
          - code: CodeOTLPExportRejected
            doc: OTLPExportRejected reports a permanent refusal by the collector.
            name: OTLPExportRejected
            private: "service/observe/trace: the collector answered a status the OTLP specification says MUST NOT be retried"
            public: The trace collector rejected the export
            reason: OTLP_EXPORT_REJECTED
          - code: CodeOTLPExportUnavailable
            doc: OTLPExportUnavailable reports a transient failure worth retrying.
            name: OTLPExportUnavailable
            private: "service/observe/trace: a transport fault, or one of the four statuses the OTLP specification lists as retryable"
            public: The trace collector is unavailable
            reason: OTLP_EXPORT_UNAVAILABLE
          - code: CodeOTLPPartialSuccess
            doc: OTLPPartialSuccess reports an accepted request with rejected spans.
            name: OTLPPartialSuccess
            private: "service/observe/trace: the OTLP specification forbids retrying a partial success, so the loss is reported rather than replayed"
            public: The trace collector accepted the request but rejected some spans
            reason: OTLP_PARTIAL_SUCCESS
    types:
      - methods:
          - name: Normalized
            out:
              - type: EventValue
            recv: value
        name: EventValue
