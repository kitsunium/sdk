            recv: value
        name: ExporterName
        underlying: string
      - methods:
          - name: IsValid
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: TraceID
        underlying: "[TraceIDLen]byte"
      - methods:
          - name: IsValid
            out:
              - type: bool
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: SpanID
        underlying: "[SpanIDLen]byte"
      - methods:
          - name: IsSampled
            out:
              - type: bool
            recv: value
          - in:
              - name: sampled
                type: bool
            name: WithSampled
            out:
              - type: TraceFlags
            recv: value
          - name: Sanitized
            out:
              - type: TraceFlags
            recv: value
        name: TraceFlags
        underlying: byte
      - methods:
          - name: Normalized
            out:
              - type: LinkValue
            recv: value
          - name: IsValid
            out:
              - type: bool
            recv: value
        name: LinkValue
        struct:
          fields:
            - name: Context
              type: SpanContextValue
            - name: Attrs
              type: "[]coreotel.AttrValue"
      - name: SpanParams
        struct:
          fields:
            - name: Kind
              type: SpanKind
            - name: Attrs
              type: "[]coreotel.AttrValue"
            - name: Links
              type: "[]LinkValue"
            - name: StartTime
              type: time.Time
      - name: Sampler
        underlying: func(params SamplingParams) bool
      - name: SpanSink
        underlying: func(span SpanValue)
      - name: SamplingParams
        struct:
          fields:
            - name: Parent
              type: SpanContextValue
            - name: TraceID
              type: TraceID
            - name: Name
              type: string
            - name: Kind
              type: SpanKind
            - name: Attrs
              type: "[]coreotel.AttrValue"
            - name: Links
              type: "[]LinkValue"
      - methods:
          - name: IsValid
            out:
              - type: bool
            recv: value
          - name: IsSampled
            out:
              - type: bool
            recv: value
          - in:
              - name: state
                type: StateValue
            name: WithState
            out:
              - type: SpanContextValue
            recv: value
        name: SpanContextValue
        struct:
          fields:
            - name: TraceID
              type: TraceID
            - name: SpanID
              type: SpanID
            - name: Flags
              type: TraceFlags
            - name: State
              type: StateValue
            - name: Remote
              type: bool
      - methods:
          - name: Resolved
            out:
              - type: SpanKind
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: SpanKind
        underlying: int32
      - methods:
          - name: Duration
            out:
              - type: time.Duration
            recv: value
          - name: IsRoot
            out:
              - type: bool
            recv: value
        name: SpanValue
        struct:
          fields:
            - name: Context
              type: SpanContextValue
            - name: Parent
              type: SpanContextValue
            - name: Name
              type: string
            - name: Kind
              type: SpanKind
            - name: StartTime
              type: time.Time
            - name: EndTime
              type: time.Time
            - name: Attrs
              type: "[]coreotel.AttrValue"
            - name: Events
              type: "[]EventValue"
            - name: Links
              type: "[]LinkValue"
            - name: Status
              type: StatusValue
      - methods:
          - name: IsEmpty
            out:
              - type: bool
            recv: value
        name: SpansValue
        struct:
          fields:
            - name: Resource
              type: coreotel.ResourceValue
            - name: Scope
              type: coreotel.ScopeValue
            - name: Spans
              type: "[]SpanValue"
      - methods:
          - in:
              - name: key
              - name: value
                type: string
            name: Add
            out:
              - type: bool
            recv: pointer
          - name: State
            out:
              - type: StateValue
            recv: pointer
        name: StateBuilder
        struct:
          unexported: true
      - methods:
          - name: Len
            out:
              - type: int
            recv: value
          - in:
              - name: key
                type: string
            name: Get
            out:
              - name: value
                type: string
              - name: ok
                type: bool
            recv: value
          - in:
              - name: key
              - name: value
                type: string
            name: Insert
            out:
              - name: state
                type: StateValue
              - name: err
                type: error
            recv: value
          - in:
              - name: key
                type: string
            name: Delete
            out:
              - type: StateValue
            recv: value
          - name: String
            out:
              - type: string
            recv: value
        name: StateValue
        struct:
          unexported: true
      - methods:
          - name: String
            out:
              - type: string
            recv: value
        name: StatusCode
        underlying: int32
      - methods:
          - name: Resolved
            out:
              - type: StatusValue
            recv: value
          - name: IsUnset
            out:
              - type: bool
            recv: value
        name: StatusValue
        struct:
          fields:
            - name: Code
              type: StatusCode
            - name: Message
              type: string
  - constants:
      - name: OTLPTracesPath
        type: string
        value: "\"/v1/traces\""
      - name: DefaultOTLPTimeout
        type: time.Duration
        value: "10000000000"
      - name: DefaultOTLPMaxResponseBytes
        type: int64
        value: 1 << 20
      - name: HTTPRequestMethodKey
        type: string
        value: "\"http.request.method\""
      - name: HTTPResponseStatusCodeKey
        type: string
        value: "\"http.response.status_code\""
      - name: URLPathKey
        type: string
        value: "\"url.path\""
      - name: URLSchemeKey
        type: string
        value: "\"url.scheme\""
