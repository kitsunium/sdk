apiVersion: kit.kitsunium/design/v2
domain: observe/metrics
packages:
  - codes:
      - const:
          - doc: |-
              CodeUnknownExporter identifies an Export/Lookup naming an exporter that no
              imported package has registered.
            name: CodeUnknownExporter
            note: "range: 0.2.9.0 - 0.2.9.255"
            value: "0x00_02_09_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeExportFailed identifies an exporter that returned an error while shipping
              a snapshot (the exporter's cause rides the wrap trail).
            name: CodeExportFailed
            value: "0x00_02_09_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInstrumentKindConflict identifies a Meter call reusing a name already
              bound to a DIFFERENT instrument kind (e.g. a Counter name fetched as a Gauge,
              or as an UpDownCounter, which is a different monotonicity on one metric).
            name: CodeInstrumentKindConflict
            value: "0x00_02_09_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidAttribute identifies an instrument fetched with an attribute set
              that cannot name a series: an attribute with an empty Key, the same Key
              twice, or a value no constructor ever set (AttrKindInvalid).
            name: CodeInvalidAttribute
            value: "0x00_02_09_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies a boot-time Exporter registry collision:
              a nil exporter, or a distinct exporter claiming an already-registered Name.
            name: CodeDuplicateRegistration
            value: "0x00_02_09_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidTemporality identifies a MeterConfig carrying a Temporality that
              is none of the three declared constants — reachable only by a deliberate cast.
            name: CodeInvalidTemporality
            value: "0x00_02_09_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidDescription identifies a Describe call carrying an empty
              description — a call that would document nothing (ADR 0067).
            name: CodeInvalidDescription
            value: "0x00_02_09_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeDescriptionConflict identifies a second, DIFFERENT description bound to
              an instrument name that already has one. A description belongs to the name,
              so two of them means one of the two wiring sites is wrong (ADR 0067).
            name: CodeDescriptionConflict
            value: "0x00_02_09_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidMetricName identifies an instrument name the Prometheus text
              exposition format cannot carry: it does not match [a-zA-Z_:][a-zA-Z0-9_:]*.
            name: CodeInvalidMetricName
            note: |-
              range: 0.3.45.0 - 0.3.45.255 — allocated to the metrics engine,
              internal/service/observe/metrics (ADR 0005 service/observe/metrics block),
              and declared here since ADR 0160: the engine returns these and declares
              none. Every one of them is about a wire — Prometheus text or OTLP — the
              engine writes.
            value: "0x00_03_2D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidLabelName identifies an attribute key the Prometheus text
              exposition format cannot carry: it does not match [a-zA-Z_][a-zA-Z0-9_]* (a
              metric name may hold a colon, a label name may not — and neither may hold the
              dot every OTel-conventional attribute key is spelled with).
            name: CodeInvalidLabelName
            value: "0x00_03_2D_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeReservedLabelName identifies a syntactically legal attribute key that the
              exposition format or the Prometheus server reserves for its own use: the "__"
              prefix, or "le" on a histogram, where it names the bucket's upper bound.
            name: CodeReservedLabelName
            value: "0x00_03_2D_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnsupportedTemporality identifies a snapshot that is not cumulative —
              delta, or an unresolved temporality — handed to the Prometheus exporter,
              whose exposition format has no temporality field and whose server reads
              every counter as cumulative.
            name: CodeUnsupportedTemporality
            value: "0x00_03_2D_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPUnresolvedTemporality identifies a snapshot handed to the OTLP/JSON
              encoder carrying a temporality that is neither delta nor cumulative. The
              schema's AGGREGATION_TEMPORALITY_UNSPECIFIED "MUST not be used", so there is
              no honest integer to emit.
            name: CodeOTLPUnresolvedTemporality
            value: "0x00_03_2D_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPInvalidBucketLayout identifies a histogram point whose buckets OTLP
              cannot express: a count array that is not one longer than the bounds array,
              or bounds that are non-finite or not strictly increasing.
            name: CodeOTLPInvalidBucketLayout
            value: "0x00_03_2D_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPEndpointInvalid identifies an OTLP/HTTP exporter configured with an
              endpoint that is not an absolute http(s) URL carrying a path — the address
              the POST would otherwise be sent to blind.
            name: CodeOTLPEndpointInvalid
            value: "0x00_03_2D_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPExportRejected identifies a collector that refused the payload
              PERMANENTLY: an HTTP status outside the specification's retryable set, so
              replaying the same bytes would fail the same way.
            name: CodeOTLPExportRejected
            value: "0x00_03_2D_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPExportUnavailable identifies a TRANSIENT OTLP/HTTP failure — a
              transport fault, or one of the four statuses the specification lists as
              retryable. The same bytes may succeed later.
            name: CodeOTLPExportUnavailable
            value: "0x00_03_2D_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeOTLPPartialSuccess identifies a collector that accepted the request
              (HTTP 200) but rejected some of its data points. The specification forbids
              retrying it, so the loss is reported rather than replayed.
            name: CodeOTLPPartialSuccess
            value: "0x00_03_2D_0A"
        type: errs.Code
    constants:
      - doc: |-
          OverflowAttrKey names the reserved attribute the meter attaches to the single
          aggregated series it folds observations into once an instrument has reached
          its cardinality bound. It is spelled with underscores rather than dots so it
          needs no mangling to be a legal Prometheus label name — unlike every
          OTel-conventional key, which is dotted.

          The key is RESERVED: a caller who passes it explicitly with a BOOL value is
          writing into the same series the meter uses for overflow, and their
          observations merge with it. That is not enforced — enforcing it would cost a
          comparison per attribute on the lookup path to prevent a collision nobody
          reaches by accident.
        name: OverflowAttrKey
        type: string
        value: "\"sdk_metric_overflow\""
      - doc: |-
          DefaultScopeName names this SDK as the instrumenting library when a caller
          declares no scope of their own. An empty scope name is legal in the
          specification and useless in a backend, so the meter fills in the one thing
          it can state truthfully: which library minted the instruments.

          It is this signal's own constant and is deliberately not shared:
          internal/core/observe/trace declares its own, because a scope names the library that
          produced THIS signal (ADR 0051 §Decision 2).
        name: DefaultScopeName
        type: string
        value: "\"github.com/kitsunium/sdk/pkg/v1/observe/metrics\""
      - doc: |-
          TemporalityUnspecified is the zero value and means "the caller has not
          chosen". It is legal ONLY in a MeterConfig, where it resolves to
          TemporalityCumulative; it never reaches a SnapshotValue.
        name: TemporalityUnspecified
        type: Temporality
        value: "0"
      - doc: |-
          TemporalityDelta means each point covers the window since the previous
          collection: (T1,T2], then (T2,T3]. The reported number is consumed by
          the collection that reads it and starts again from zero.
        name: TemporalityDelta
        type: Temporality
        value: "1"
      - doc: |-
          TemporalityCumulative means each point covers the window since the
          series started: (T0,T1], then (T0,T2]. The reported number is a running
          total and a reader differences successive collections itself.
        name: TemporalityCumulative
        type: Temporality
        value: "2"
    doc: |-
      Package metrics — the sibling port that registers asynchronous instruments.

      Package metrics — this signal's half of the shared attribute model
      (internal/core/observe/otel): the refusal an unusable set earns HERE, the Resource a
      Meter publishes, and the one attribute key only a meter ever writes.

      Package metrics — range 0.2.9.* (ADR 0027 core/observe/metrics block), and
      range 0.3.45.*, the metrics engine's, declared here since ADR 0160.

      Package metrics declares the observability port of the SDK, shaped on the
      OpenTelemetry metrics DATA MODEL — the specification, never the library.
      Instruments (Counter, UpDownCounter, Gauge, Histogram and their observable
      counterparts), the Meter that mints + collects them, typed Attrs, aggregation
      Temporality, the producing Resource and the InstrumentationScope, plus the
      Exporter contract + registry that ships a SnapshotValue out. A core sibling
      admitted by ADR 0027 (Phase-B wave) and re-shaped by ADR 0044; the in-memory
      meter and the stdlib exporters live in internal/service/observe/metrics, and
      exporters self-register via the registry (writer-registry model, ADR 0012).

      A series is one instrument name plus one attribute set, and a Meter bounds
      how many series a name may hold.

      Package metrics — the sibling port that documents an instrument NAME.

      Package metrics — the sibling port that mints the non-monotonic sum.

      Package metrics — declares the sentinel *errs.Error values. Each var's name
      equals its errs.Define Reason in SCREAMING_SNAKE form.

      Package metrics — the Exporter contract + process-wide exporter registry.

      Package metrics — the Gauge instrument.

      Package metrics — the exportable gauge point: a sampled reading, which covers
      no window and therefore carries no temporality.

      Package metrics — the Histogram instrument.

      Package metrics — the exportable histogram point: an explicit-bucket
      distribution.

      Package metrics — the Meter: the frozen instrument factory + collector.

      Package metrics — the asynchronous (observable) instruments: a value read at
      collection time rather than written at observation time.

      Package metrics — the instrumentation scope this signal publishes.

      Package metrics — the exportable snapshot: the OTel payload hierarchy in Go.

      Package metrics — the exportable sum point: the shape a Counter and an
      UpDownCounter share. The metric envelope that tells them apart lives beside
      SnapshotValue, whose field it is.

      Package metrics — aggregation temporality, the OTel concept that says which
      window a reported number covers.
    functions:
      - doc: |-
          ValidateAttrs panics with InvalidAttribute (0.2.9.4) when sorted cannot name
          a series: an empty Key, a value no constructor ever set, or the same Key
          twice. It is the check every instrument fetch runs, on the already sorted
          set; the rules are the shared model's (internal/core/observe/otel.ValidateAttrs), the
          code is this signal's.
        impl: validateAttrs
        in:
          - name: sorted
            type: "[]coreotel.AttrValue"
        name: ValidateAttrs
      - doc: |-
          NormalizeResource returns the ResourceValue a Meter publishes: attributes
          sorted, validated, owned, and carrying ServiceNameKey whether or not the
          caller supplied it. An unusable attribute set panics with InvalidAttribute,
          at construction, rather than at the first export.
        impl: normalizeResource
        in:
          - name: resource
            type: coreotel.ResourceValue
        name: NormalizeResource
        out:
          - type: coreotel.ResourceValue
      - doc: |-
          LookupExporter returns the Exporter registered under name.

          IFACE-PLUGIN: the registry stores plug-in exporters behind the Exporter
          interface — concrete backend types stay unexported.
        impl: lookupExporter
        in:
          - name: name
            type: ExporterName
        name: LookupExporter
        out:
          - name: e
            type: Exporter
          - name: ok
            type: bool
      - doc: AvailableExporters returns the sorted list of registered ExporterNames.
        impl: availableExporters
        name: AvailableExporters
        out:
          - type: "[]ExporterName"
      - doc: |-
          RegisterExporter inserts e under e.Name() and returns it for singleton
          binding. Panics on a nil exporter or a distinct exporter on a taken Name.

          IFACE-PLUGIN: the registry hands plug-in Exporter instances back to callers so
          each backend keeps its concrete type unexported.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: e
            type: Exporter
        name: RegisterExporter
        out:
          - type: Exporter
      - doc: |-
          Export ships snap through the Exporter registered as name. A missing exporter
          returns UnknownExporter; an exporter failure wraps as ExportFailed.
        in:
          - name: name
            type: ExporterName
          - name: snap
            type: SnapshotValue
        name: Export
        out:
          - type: error
      - doc: |-
          NormalizeScope returns the ScopeValue a Meter publishes, filling an empty Name
          with DefaultScopeName. Version is left exactly as supplied.
        in:
          - name: scope
            type: coreotel.ScopeValue
        name: NormalizeScope
        out:
          - type: coreotel.ScopeValue
    imports:
      coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/metrics
    ports:
      - doc: |-
          AsyncMeter registers ASYNCHRONOUS instruments: a callback read once per
          Collect instead of a handle written to per observation. It is the right shape
          whenever the value already exists somewhere and only needs reading — a
          runtime counter, a queue length, a cache size — because instrumenting those
          synchronously means finding every mutation site.

          Registrations accumulate: registering a second callback under one name adds
          it rather than replacing it, which is what the OTel API specifies and what
          lets two packages contribute to the same instrument. There is no
          unregistration — an observable is declared at wiring time and lives as long
          as the meter.

          A sibling interface rather than three more methods on Meter, per ADR 0039.
        methods:
          - doc: |-
              ObservableCounter registers a monotonic sum read at collection time.
              The callback reports the ABSOLUTE total.
            in:
              - name: name
                type: string
              - name: observe
                type: Int64Callback
            name: ObservableCounter
          - doc: |-
              ObservableUpDownCounter registers a non-monotonic sum read at
              collection time. The callback reports the ABSOLUTE total.
            in:
              - name: name
                type: string
              - name: observe
                type: Int64Callback
            name: ObservableUpDownCounter
          - doc: ObservableGauge registers a sampled reading taken at collection time.
            in:
              - name: name
                type: string
              - name: observe
                type: Float64Callback
            name: ObservableGauge
        name: AsyncMeter
      - doc: |-
          Counter is a MONOTONIC sum: it only ever increases. In the OTel data model
          its points land in a Sum carrying Monotonic = true, which is what tells a
          backend that a decrease is a restart rather than a measurement.
        methods:
          - doc: |-
              Add increments the counter by a non-negative delta. A non-positive
              delta is ignored — a counter that could go down is an UpDownCounter,
              and a backend reading this one is entitled to assume it cannot.
            in:
              - name: delta
                type: int64
            name: Add
          - doc: Inc increments the counter by one (Add(1) shorthand).
            name: Inc
        name: Counter
      - doc: |-
          Describer attaches a human-readable description to an instrument NAME.

          The OTel metrics data model puts `description` on the Metric, not on the data
          point, and the specification says outright that it is NON-IDENTIFYING: two
          streams that differ only by their description are one stream. That is why
          this is Describe(name, …) and not a description parameter threaded through
          Counter/Gauge/Histogram. A description describes the thing a backend graphs,
          which is the name; a call site only ever contributes one series of it, and a
          per-call-site parameter would invite two call sites to disagree about the
          documentation of one metric while both look correct.

          It is also why the description is not on the observation path at all. Counter
          and its siblings are called once per observation; Describe is called once, at
          wiring time, next to the code that decides the instrument exists.

          # A sibling, discovered by type assertion

          Meter is FROZEN (ADR 0039) and so is FullMeter — a union is still an
          interface, and adding a method to either would break every downstream double
          at compile time with no deprecation window. Describer is therefore a fourth
          sibling beside UpDownMeter and AsyncMeter, and it is NOT folded into
          FullMeter:

          	if d, ok := meter.(metrics.Describer); ok {
          		d.Describe("http_server_requests", "Requests served, by route and status")
          	}

          The assertion is not ceremony. A Meter that records no description — a test
          double, a no-op meter, a downstream implementation written before this port
          existed — legitimately does not implement Describer, and `ok == false` is how
          a caller finds out that their documentation will not reach the wire. The same
          shape as cache.Tagger (ADR 0049) and lock.Deadliner (ADR 0052): the ABSENCE
          of the sibling is the answer.

          # What an implementation is expected to refuse

          Both refusals are programmer errors — a description is a literal written at a
          wiring site, constant for the process — so an implementation is expected to
          refuse them LOUDLY rather than return an error this signature has nowhere to
          put, exactly as Meter refuses a cross-kind name reuse:

            - An EMPTY description. It is a call that does nothing, which is the inert
              outcome ADR 0031 bans; the caller meant to write something.
            - A SECOND, DIFFERENT description for one name. A description belongs to
              the name, so two of them means one of the two wiring sites is wrong, and
              whichever one lost would be invisible on every wire. Re-describing a name
              with the SAME text is idempotent, because two packages documenting one
              metric identically have not disagreed about anything.

          A description is DATA, not structure: unlike an instrument name or an
          attribute key, it is prose, and an implementation must not refuse it for the
          bytes it contains. An exporter escapes it for the wire it is writing.
        methods:
          - doc: |-
              Describe binds description to the instrument called name. It is
              idempotent for identical text and refused for conflicting text.
            in:
              - name: name
              - name: description
                type: string
            name: Describe
        name: Describer
      - doc: |-
          UpDownMeter mints the non-monotonic sum Meter cannot — the instrument for a
          total that goes down as well as up.

          A sibling interface rather than a fourth method on Meter, per ADR 0039: Meter
          is published through a `pkg/v1` type alias, Go interfaces are structural, and
          widening one breaks every downstream implementer at compile time.
        methods:
          - in:
              - name: name
                type: string
              - name: attrs
                type: coreotel.AttrValue
            name: UpDownCounter
            out:
              - type: UpDownCounter
            variadic: true
        name: UpDownMeter
      - doc: |-
          UpDownCounter is a NON-MONOTONIC sum: a running total that may go down as
          well as up — in-flight requests, queue depth, open connections.

          It is not a Gauge. A gauge is a sampled reading with no arithmetic behind it
          ("the temperature is 21.5"); an up-down counter is a total every call site
          contributes to ("this handler took one slot, that one released it"), which is
          why it is additive and a gauge is not. In the OTel data model both a Counter
          and an UpDownCounter produce a Sum, and MONOTONICITY IS A FIELD OF THAT SUM
          rather than a second point type — which is exactly why the two interfaces
          exist at the API and only one shape exists in SumMetricValue.

          It is a sibling of Counter rather than a widening of it, and structurally
          distinct from it by Dec: a Counter is not silently usable where an
          UpDownCounter is required.
        methods:
          - doc: Add adjusts the total by delta, which may be negative.
            in:
              - name: delta
                type: int64
            name: Add
          - doc: Inc adds one.
            name: Inc
          - doc: Dec subtracts one.
            name: Dec
        name: UpDownCounter
      - doc: |-
          Exporter ships a Snapshot to a backend (text writer, Prometheus, OTLP, …).
          Implementations MUST be safe for concurrent use.

          IFACE-PLUGIN: the registry stores plug-in exporters behind this interface;
          concrete exporter types stay unexported per package.
        methods:
          - name: Name
            out:
              - type: ExporterName
          - in:
              - name: snap
                type: SnapshotValue
            name: Export
            out:
              - type: error
        name: Exporter
      - doc: Gauge is an instantaneous value that can go up or down.
        methods:
          - doc: Set replaces the gauge's current value.
            in:
              - name: value
                type: float64
            name: Set
          - doc: Add adjusts the gauge by delta (may be negative).
            in:
              - name: delta
                type: float64
            name: Add
        name: Gauge
      - doc: Histogram records a distribution of observations into fixed buckets.
        methods:
          - doc: Record observes one value, incrementing its bucket and the sum/count.
            in:
              - name: value
                type: float64
            name: Record
          - doc: RecordDuration observes d as seconds (latency-histogram convenience).
            in:
              - name: d
                type: time.Duration
            name: RecordDuration
        name: Histogram
      - doc: |-
          Meter mints named, attributed instruments and collects their values.

          A SERIES is one instrument name plus one attribute set, and it is the unit of
          identity: repeated calls with the same name and the same attributes return
          the SAME instrument, so observations from every call site accumulate in one
          place. Attribute ORDER is not part of the identity — the set is a set, and
          {a,b} and {b,a} resolve to the same series. Passing no attributes at all is
          legitimate and names the dimensionless series.

          A name reused across instrument KINDS is a programmer error. So is an
          attribute set with an empty key, a repeated key, or a value no constructor
          ever set: all three are structure, fixed at the call site, and an
          implementation is expected to refuse them loudly.

          Implementations MUST be safe for concurrent use, and MUST bound how many
          distinct attribute sets one name may hold — an unbounded attribute set is a
          memory incident, not a reporting inconvenience.

          This interface is FROZEN. `pkg/v1/observe/metrics.Meter` is a type alias to it, Go
          interfaces are structural, and adding a method would break every downstream
          implementer at compile time with no deprecation window (ADR 0039). The
          instruments it lacks live on UpDownMeter and AsyncMeter, and FullMeter is the
          union every in-tree constructor actually returns.
        methods:
          - in:
              - name: name
                type: string
              - name: attrs
                type: coreotel.AttrValue
            name: Counter
            out:
              - type: Counter
            variadic: true
          - in:
              - name: name
                type: string
              - name: attrs
                type: coreotel.AttrValue
            name: Gauge
            out:
              - type: Gauge
            variadic: true
          - in:
              - name: name
                type: string
              - name: buckets
                type: "[]float64"
              - name: attrs
                type: coreotel.AttrValue
            name: Histogram
            out:
              - type: Histogram
            variadic: true
          - doc: |-
              Collect returns a point-in-time SnapshotValue of every series.

              Under TemporalityDelta it is a MUTATION: it consumes the window it
              reports. Two independent collectors would then each receive half the
              observations, so a delta meter has exactly one reader.
            name: Collect
            out:
              - type: SnapshotValue
        name: Meter
      - doc: |-
          FullMeter is the whole OTel instrument set behind one name: the frozen Meter
          plus both siblings. It is what every constructor in this SDK returns, and
          widening a returned VALUE from Meter to FullMeter is safe for the same reason
          widening clock.System from Clock to Timed was — every existing assignment
          into a Meter still compiles (ADR 0039 §Decision 1).
        embeds:
          - Meter
          - UpDownMeter
          - AsyncMeter
        name: FullMeter
    sentinels:
      - var:
          - code: CodeUnknownExporter
            doc: UnknownExporter is returned when no Exporter is registered under a Name.
            name: UnknownExporter
            private: "core/observe/metrics.Export: exporter absent from registry; blank-import the exporter's package"
            public: No metrics exporter is registered under that name
            reason: UNKNOWN_EXPORTER
          - code: CodeExportFailed
            doc: ExportFailed wraps an exporter's failure while shipping a snapshot.
            name: ExportFailed
            private: "core/observe/metrics.Export: the registered exporter returned an error"
            public: The metrics exporter failed to ship the snapshot
            reason: EXPORT_FAILED
          - code: CodeInstrumentKindConflict
            doc: InstrumentKindConflict is returned when a name is reused for a different kind.
            name: InstrumentKindConflict
            private: "service/observe/metrics: a name bound to one instrument kind was fetched as another"
            public: That instrument name is already registered with a different kind
            reason: INSTRUMENT_KIND_CONFLICT
          - code: CodeInvalidAttribute
            doc: InvalidAttribute is the panic sentinel for an unusable attribute set.
            name: InvalidAttribute
            private: "service/observe/metrics: an attribute set must name each dimension once, with a non-empty key and a value from String/Bool/Int64/Float64"
            public: An attribute key is empty or repeated, or its value was never set
            reason: INVALID_ATTRIBUTE
          - code: CodeDuplicateRegistration
            doc: DuplicateRegistration is the boot-time Exporter-registry panic sentinel.
            name: DuplicateRegistration
            private: "core/observe/metrics.RegisterExporter: a distinct exporter already claims this name, or a nil exporter was supplied"
            public: An exporter is already registered under that name
            reason: DUPLICATE_REGISTRATION
          - code: CodeInvalidTemporality
            doc: |-
              InvalidTemporality is the panic sentinel for a Temporality that is none
              of the three declared constants.
            name: InvalidTemporality
            private: "core/observe/metrics: Temporality must be Unspecified, Delta or Cumulative; any other value came from a cast"
            public: That aggregation temporality is not one this SDK declares
            reason: INVALID_TEMPORALITY
          - code: CodeInvalidDescription
            doc: InvalidDescription is the panic sentinel for an empty Describe.
            name: InvalidDescription
            private: "service/observe/metrics: Describer.Describe was handed \"\"; a description that documents nothing is the inert call ADR 0031 bans"
            public: An instrument description must not be empty
            reason: INVALID_DESCRIPTION
          - code: CodeDescriptionConflict
            doc: |-
              DescriptionConflict is the panic sentinel for two different descriptions
              bound to one instrument name.
            name: DescriptionConflict
            private: "service/observe/metrics: a description belongs to the name; re-describing with identical text is idempotent, differing text is a wiring defect"
            public: That instrument name already carries a different description
            reason: DESCRIPTION_CONFLICT
          - code: CodeInvalidMetricName
            doc: |-
              InvalidMetricName is returned when an instrument name cannot be spelled
              as a Prometheus metric name.
            name: InvalidMetricName
            private: "service/observe/metrics: the Prometheus exposition format requires [a-zA-Z_:][a-zA-Z0-9_:]*; rename the instrument at its call site"
            public: An instrument name is not a valid Prometheus metric name
            reason: INVALID_METRIC_NAME
          - code: CodeInvalidLabelName
            doc: |-
              InvalidLabelName is returned when an attribute key cannot be spelled as
              a Prometheus label name.
            name: InvalidLabelName
            private: "service/observe/metrics: the Prometheus exposition format requires [a-zA-Z_][a-zA-Z0-9_]* for a label name — no colon, and no dot, so an OTel-conventional dotted key cannot be carried"
            public: An attribute key is not a valid Prometheus label name
            reason: INVALID_LABEL_NAME
          - code: CodeReservedLabelName
            doc: ReservedLabelName is returned when an attribute key is legal but reserved.
            name: ReservedLabelName
            private: "service/observe/metrics: a \"__\" prefix is reserved for the server's internal labels, and \"le\" is reserved for a histogram's bucket bound"
            public: An attribute key is reserved by the Prometheus exposition format
            reason: RESERVED_LABEL_NAME
          - code: CodeUnsupportedTemporality
            doc: |-
              UnsupportedTemporality is returned when a snapshot that is not
              cumulative — delta, or an unresolved temporality — is handed to the
              Prometheus exporter.
            name: UnsupportedTemporality
            private: "service/observe/metrics: the text exposition format has no temporality field and the server reads every counter as cumulative; build the meter with TemporalityCumulative for this exporter"
            public: The Prometheus exposition format carries cumulative metrics only
            reason: UNSUPPORTED_TEMPORALITY
          - code: CodeOTLPUnresolvedTemporality
            doc: |-
              OTLPUnresolvedTemporality is returned when a snapshot's temporality has
              no OTLP enum value.
            name: OTLPUnresolvedTemporality
            private: "service/observe/metrics: the OTLP AggregationTemporality enum spells only delta (1) and cumulative (2); UNSPECIFIED is documented as MUST NOT be used, so a Meter resolves the knob at construction and a hand-built snapshot must too"
            public: That aggregation temporality has no OTLP representation
            reason: OTLP_UNRESOLVED_TEMPORALITY
          - code: CodeOTLPInvalidBucketLayout
            doc: |-
              OTLPInvalidBucketLayout is returned when a histogram point's buckets
              cannot be spelled as explicit_bounds plus bucket_counts.
            name: OTLPInvalidBucketLayout
            private: "service/observe/metrics: OTLP requires bucket_counts to be one longer than explicit_bounds and explicit_bounds to be strictly increasing and finite; the bucket above the last declared bound is already the +Inf overflow"
            public: That histogram's buckets have no OTLP representation
            reason: OTLP_INVALID_BUCKET_LAYOUT
          - code: CodeOTLPEndpointInvalid
            doc: |-
              OTLPEndpointInvalid is returned by NewOTLPHTTPExporter when the
              configured endpoint cannot be a metrics collector URL.
            name: OTLPEndpointInvalid
            private: "service/observe/metrics: OTLP/HTTP takes a full URL used as-is, so it must carry the signal path (metrics.OTLPMetricsPath); a bare host would POST to the root and collect 404s"
            public: The OTLP endpoint is not an absolute http or https URL with a path
            reason: OTLP_ENDPOINT_INVALID
          - code: CodeOTLPExportRejected
            doc: |-
              OTLPExportRejected is returned when a collector refuses the payload with
              a status the specification marks non-retryable.
            name: OTLPExportRejected
            private: "service/observe/metrics: the collector answered a 4xx/5xx outside the retryable set, so the same bytes will fail again; check the payload, the headers and the collector's own logs"
            public: The OTLP collector rejected the metrics payload
            reason: OTLP_EXPORT_REJECTED
          - code: CodeOTLPExportUnavailable
            doc: |-
              OTLPExportUnavailable is returned when an OTLP/HTTP export fails in a way
              the specification says may be retried.
            name: OTLPExportUnavailable
            private: "service/observe/metrics: a transport fault or one of HTTP 429/502/503/504; compose resilience.NewRetry with Retryable: metrics.OTLPRetryable rather than looping here"
            public: The OTLP collector is unreachable or overloaded
            reason: OTLP_EXPORT_UNAVAILABLE
          - code: CodeOTLPPartialSuccess
            doc: |-
              OTLPPartialSuccess is returned when a collector accepts the request but
              rejects some of its data points.
            name: OTLPPartialSuccess
            private: "service/observe/metrics: the response carried partialSuccess.rejectedDataPoints; the specification forbids retrying it, so the rejected points are lost and the cause is at the collector"
            public: The OTLP collector accepted the request but rejected some data points
            reason: OTLP_PARTIAL_SUCCESS
    types:
      - decl: true
        doc: |-
          ExporterName is the typed key under which an Exporter registers (e.g. "text",
          "prometheus"). The zero value ExporterName("") is reserved invalid.
        methods:
          - doc: String returns the raw name.
            name: String
            out:
              - type: string
            recv: value
        name: ExporterName
        underlying: string
      - decl: true
        doc: |-
          GaugeValue is one series of a gauge metric: the attribute set that identifies
          it plus its instantaneous reading.
        name: GaugeValue
        struct:
          fields:
            - doc: |-
                Attrs is the series' attribute set, sorted by Key; nil for the
                dimensionless series. See SumValue.Attrs for the aliasing rule.
              name: Attrs
              type: "[]coreotel.AttrValue"
            - doc: Value is the last reading taken.
              name: Value
              type: float64
      - decl: true
        doc: |-
          HistogramValue is one series of a histogram metric: the attribute set that
          identifies it, the explicit bucket upper bounds, the count per bucket
          (len == len(Bounds)+1, the last being the +Inf overflow), and the Sum/Count
          of every observation in the window.
        name: HistogramValue
        struct:
          fields:
            - doc: |-
                Attrs is the series' attribute set, sorted by Key; nil for the
                dimensionless series. See SumValue.Attrs for the aliasing rule.
              name: Attrs
              type: "[]coreotel.AttrValue"
            - doc: |-
                Bounds holds the histogram's explicit upper bounds, ascending. OTLP
                calls this field explicit_bounds.
              name: Bounds
              type: "[]float64"
            - doc: |-
                Counts holds one count per bucket plus the +Inf overflow slot. The
                counts are PER BUCKET, not cumulative — a format that wants a
                cumulative ladder (Prometheus) builds it as it walks.
              name: Counts
              type: "[]uint64"
            - doc: Sum is the total of every observed value in the window.
              name: Sum
              type: float64
            - doc: Count is how many observations the window holds.
              name: Count
              type: uint64
      - decl: true
        doc: |-
          ObserveInt64 reports ONE integer measurement, with its own attribute set,
          from inside an Int64Callback. It is valid only for the duration of that call;
          retaining it and calling it later observes into a collection that has already
          finished.

          It is a FUNC port, not a single-method interface, for the reason ADR 0041
          gives: a published func type cannot grow a method, so it cannot break a
          downstream implementer the way widening an interface would (ADR 0039).
        name: ObserveInt64
        underlying: func(value int64, attrs ...coreotel.AttrValue)
      - decl: true
        doc: ObserveFloat64 is ObserveInt64 for a double-valued observable.
        name: ObserveFloat64
        underlying: func(value float64, attrs ...coreotel.AttrValue)
      - decl: true
        doc: |-
          Int64Callback is read ONCE PER COLLECTION and reports the instrument's
          current ABSOLUTE value — not a delta. That is the OTel contract for an
          asynchronous sum: the callback states what the total is now
          (runtime.NumGoroutine(), bytes allocated since boot), and the SDK differences
          successive observations itself when the meter is a delta reader.

          A callback MUST NOT call Collect on the meter that is collecting it, and MUST
          NOT block: it runs inline in the collection, so a slow callback is a slow
          scrape for every other instrument too.
        name: Int64Callback
        underlying: func(observe ObserveInt64)
      - decl: true
        doc: |-
          Float64Callback is Int64Callback for a double-valued observable — an
          observable gauge, whose reported value is a sampled reading and therefore has
          no temporality at all.
        name: Float64Callback
        underlying: func(observe ObserveFloat64)
      - decl: true
        doc: |-
          SumMetricValue is every series of ONE sum instrument name, plus the two facts
          the OTel data model attaches to the metric rather than to its points.

          A Counter and an UpDownCounter both produce a SumMetricValue; they differ
          only by Monotonic. That is the model's own economy, and it is why the SDK has
          two instrument interfaces and one point shape.
        name: SumMetricValue
        struct:
          fields:
            - doc: |-
                Temporality says which window Points cover. Never
                TemporalityUnspecified — a Meter resolves it at construction.
              name: Temporality
              type: Temporality
            - doc: |-
                Monotonic is true for a Counter and false for an UpDownCounter. A
                backend uses it to decide whether a decrease is a reset or a reading.
              name: Monotonic
              type: bool
            - doc: |-
                Description is the instrument's human-readable docstring, or "" when
                nobody described it. It is NON-IDENTIFYING — the OTel data model says so
                outright — so it never joins the series identity and an exporter that
                cannot carry it loses nothing but the prose. See Describer.
              name: Description
              type: string
            - doc: Points holds the name's series, sorted by attribute set.
              name: Points
              type: "[]SumValue"
      - decl: true
        doc: |-
          GaugeMetricValue is every series of ONE gauge instrument name.

          It carries no Temporality, and that absence is the model, not an omission: a
          gauge is a sampled reading, so there is no window for it to cover and OTLP's
          Gauge message has no temporality field either. The one-field struct exists so
          that all three kinds present the same walk to an exporter — an exporter that
          had to special-case gauges would special-case them in every format.
        name: GaugeMetricValue
        struct:
          fields:
            - doc: |-
                Description is the instrument's human-readable docstring, or "" when
                nobody described it. See SumMetricValue.Description.
              name: Description
              type: string
            - doc: Points holds the name's series, sorted by attribute set.
              name: Points
              type: "[]GaugeValue"
      - decl: true
        doc: |-
          HistogramMetricValue is every series of ONE histogram instrument name, plus
          its temporality.

          Exponential (base-2) histograms, which the OTel model also defines, are not
          implemented: they are a different bucketing scheme with their own scale /
          offset / zero-count fields, and adding them is a second point type rather
          than a field on this one. Deferred by ADR 0044 §Deferred.
        name: HistogramMetricValue
        struct:
          fields:
            - doc: |-
                Temporality says which window Points cover. Never
                TemporalityUnspecified.
              name: Temporality
              type: Temporality
            - doc: |-
                Description is the instrument's human-readable docstring, or "" when
                nobody described it. See SumMetricValue.Description.
              name: Description
              type: string
            - doc: Points holds the name's series, sorted by attribute set.
              name: Points
              type: "[]HistogramValue"
      - decl: true
        doc: |-
          SnapshotValue is a point-in-time copy of every series in a Meter, handed to
          an Exporter. It is the OTel payload hierarchy flattened into one Go value:
          Resource once, Scope once, then metrics keyed by name, each carrying its own
          points — ResourceMetrics → ScopeMetrics → Metric → data points, with the two
          single-element levels collapsed because one Meter has exactly one of each.

          The shape is deliberately "instrument name -> its metric", not
          "series key -> value": every wire format an exporter targets groups by name
          first (Prometheus emits one TYPE header per name followed by its series; OTLP
          nests data points inside one Metric). An exporter iterating these maps writes
          its header once per key and its points from the slice, with no regrouping
          pass and no composite key to re-parse.

          Two properties an exporter may rely on:

            - Each Points slice is SORTED by attribute set, so a snapshot renders
              byte-identically twice in a row given the same values — which is what
              makes exporter output diffable and its tests writable without a sort of
              their own.
            - Each Attrs slice is sorted by Key and nil for the dimensionless series,
              so len(Attrs) == 0 is the "no braces" case rather than something to
              special-case per exporter.
        name: SnapshotValue
        struct:
          fields:
            - doc: Resource identifies the producer, carried once for the whole payload.
              name: Resource
              type: coreotel.ResourceValue
            - doc: |-
                Scope identifies the instrumentation, carried once for the whole
                payload.
              name: Scope
              type: coreotel.ScopeValue
            - doc: |-
                StartTime opens the window every point covers. Under
                TemporalityCumulative it is the meter's own start and repeats across
                collections; under TemporalityDelta it advances to the previous
                collection's Time.

                It is one value for the whole snapshot rather than one per point
                because every point in one Collect covers the same window. An encoder
                that needs it per point (OTLP does) copies this one down.
              name: StartTime
              type: time.Time
            - doc: "Time closes the window: the instant the collection was taken."
              name: Time
              type: time.Time
            - doc: |-
                Sums maps an instrument name to its sum metric — Counters and
                UpDownCounters together, told apart by SumMetricValue.Monotonic.
              name: Sums
              type: map[string]SumMetricValue
            - doc: Gauges maps an instrument name to its gauge metric.
              name: Gauges
              type: map[string]GaugeMetricValue
            - doc: Histograms maps an instrument name to its histogram metric.
              name: Histograms
              type: map[string]HistogramMetricValue
      - decl: true
        doc: |-
          SumValue is one series of a sum metric: the attribute set that identifies it
          plus its value. Monotonicity and temporality are NOT here — they belong to
          the metric, not to the point, which is the OTel data model's own split.
        name: SumValue
        struct:
          fields:
            - doc: |-
                Attrs is the series' attribute set, sorted by Key; nil for the
                dimensionless series.

                The slice ALIASES the meter's own copy — it is not cloned per Collect.
                The meter never mutates an attribute set after the series is created,
                so a reader is safe; a writer would corrupt every future snapshot.
                Cloning instead would cost one allocation per series per collection,
                i.e. it would scale the cost of scraping with cardinality, which is
                the exact axis the cardinality bound exists to contain.
              name: Attrs
              type: "[]coreotel.AttrValue"
            - doc: |-
                Value is the series' total: cumulative since the meter started, or the
                delta since the previous collection, according to
                SumMetricValue.Temporality.
              name: Value
              type: int64
      - decl: true
        doc: |-
          Temporality says which time window a metric's reported value covers. It is
          the single most load-bearing concept in the OpenTelemetry metrics data model,
          because the same number means two different things under the two settings and
          nothing in the number itself says which.
        methods:
          - doc: String returns the spelling used in diagnostics and in the text exporter.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Resolved maps the UNSET zero value onto the temporality a Meter actually
              implements, and refuses anything that is neither of the three constants.

              TemporalityUnspecified CLAMPS to TemporalityCumulative rather than refusing,
              and the reason is not convention: an in-memory meter accumulates into atomics
              and never resets them unless it is asked to, so "cumulative" is a DESCRIPTION
              of what the unconfigured meter does, not a value invented on the caller's
              behalf. Any other default would be a claim about the implementation that the
              implementation does not honour (ADR 0031 §clamp).

              An out-of-range value can only come from a deliberate cast — Temporality(7)
              is not something a caller reaches by forgetting a field — so it is a
              programming error and panics with InvalidTemporality rather than being
              quietly folded into the default, which would hide the cast forever.
            name: Resolved
            out:
              - type: Temporality
            recv: value
        name: Temporality
        underlying: uint8
  - constants:
      - doc: |-
          DefaultMaxSeriesPerInstrument is the bound a Meter uses when MeterConfig
          leaves the knob unset. 2000 distinct attribute sets per instrument name is
          the figure the OpenTelemetry SDKs settled on for the same problem: high
          enough that a sanely-attributed metric never reaches it, low enough that a
          metric which does reach it has not yet cost meaningful memory.
        name: DefaultMaxSeriesPerInstrument
        type: int
        value: "2000"
      - doc: |-
          OTLPMetricsPath is the URL path OTLP/HTTP reserves for the metrics signal.
          The specification names it under §OTLP/HTTP Request; an endpoint is a full
          URL used as-is, so a caller spells the path themselves and this constant is
          what they spell it with.
        name: OTLPMetricsPath
        type: string
        value: "\"/v1/metrics\""
      - doc: |-
          DefaultOTLPTimeout bounds one export round trip when OTLPHTTPConfig leaves
          Timeout unset. Ten seconds is the value the OpenTelemetry protocol exporter
          specification itself defaults OTEL_EXPORTER_OTLP_TIMEOUT to, so it is a
          clamp onto the specification's own number rather than a figure this SDK
          invented (ADR 0031).
        name: DefaultOTLPTimeout
        type: time.Duration
        value: "10000000000"
      - doc: |-
          DefaultOTLPMaxResponseBytes caps how much of a collector's response body is
          read. A conforming response is an ExportMetricsServiceResponse or a Status
          message — hundreds of bytes. The cap exists because the body is the one part
          of this exchange a REMOTE party controls its length of, and an exporter that
          read it whole would hand a hostile or broken collector a way to exhaust the
          process that is only trying to report its metrics.

          It also bounds the drain that recycles the connection after the verdict —
          always this default rather than OTLPHTTPConfig.MaxResponseBytes, because
          that knob bounds what is read into memory and the drain keeps nothing.
        name: DefaultOTLPMaxResponseBytes
        type: int64
        value: 1 << 20
    doc: |-
      Package metrics — one instrument name's slot in a collection arena.

      Package metrics — the Meter's configuration: cardinality bound, aggregation
      temporality, producing Resource, instrumentation Scope and clock.

      Package metrics — OTLP/HTTP emitter: the exporter that POSTs an encoded
      snapshot to a collector. The transport itself — endpoint refusal, the default
      client and its own pool, the bounded reads, the classification — is the one
      both signals share (internal/service/observe/internal/otlp); what is this signal's is
      the path, the vocabulary every verdict is named in, and the encoder.

      Package metrics — OTLP/JSON encoder: SnapshotValue to the bytes an OTLP
      receiver accepts, implemented from the specification with encoding/json.

      Package metrics — Prometheus text exposition connector (format 0.0.4).

      Package metrics — stdlib text Exporter (one series per line, under a header
      per instrument name).

      Package metrics — atomic float64 gauge.

      Package metrics — atomic bucketed histogram.

      Package metrics — the in-memory Meter (a core/observe/metrics.FullMeter).

      Package metrics — the description a Meter attaches to an instrument NAME.

      Package metrics — the asynchronous instruments: registration, and the read
      that happens once per Collect.

      Package metrics — the qualifier set of one text-exporter "# metric" line.

      Package metrics — per-instrument-name bookkeeping: kind binding and the
      cardinality tally.

      Package metrics — the one member of a collector's answer that is this
      signal's own: the count an ExportMetricsServiceResponse reports rejected.

      Package metrics — the OTLP payload tree: a Go mirror of
      opentelemetry/proto/{collector/metrics,metrics}/v1, restricted to the fields
      this SDK produces. The common/v1 and resource/v1 messages it embeds —
      KeyValue, AnyValue, Resource, InstrumentationScope — and the proto3-JSON
      scalars are the ones both signals share, in internal/service/observe/internal/otlp.

      Field ORDER inside each struct is the schema's FIELD-NUMBER order, not a
      reading order: encoding/json emits struct fields as declared, and deriving
      the order from the document is what makes the expected bytes in the tests
      checkable against the .proto field by field. The visible evidence that the
      order came from the schema rather than from taste is otlpNumberDataPoint,
      which puts attributes AFTER the value because it is field 7 — it replaced a
      long-removed labels field at 1.

      Every field this SDK does not produce is ABSENT rather than always-empty
      (rule 5): schemaUrl, unit, flags, exemplars, droppedAttributesCount, and a
      histogram point's min/max. `description` joined the produced set in ADR 0067
      and is omitted only when the metric carries none — see otlpMetric.

      Package metrics — the OTLP/HTTP exporter's configuration.

      Package metrics — series identity: the canonical key binding an instrument
      name and an attribute set to exactly one series.

      Package metrics — one live series.

      Package metrics — one snapshot group's series map.

      Package metrics provides the in-memory Meter + lock-free instruments
      (Counter, UpDownCounter, Gauge, Histogram and their observable counterparts)
      implementing core/observe/metrics, plus two stdlib Exporters. Instruments are atomic
      and lock-free on the hot path; the Meter takes only a read lock to resolve an
      existing series and serialises creation alone. A series is one instrument
      name plus one TYPED attribute set, with a per-name cardinality bound that
      folds the excess into one aggregated overflow series. ADR 0027 / ADR 0044.
      Cross-OS: 100% portable.
    functions:
      - doc: |-
          OTLPRetryable reports whether err is an OTLP/HTTP failure the specification
          says may be replayed: a transport fault, or one of HTTP 429 / 502 / 503 /
          504. Everything else — a rejected payload, a partial success, an
          unrepresentable snapshot — is false, because replaying identical bytes at a
          collector that already refused them only costs the retry budget.

          Its signature is exactly resilience.RetryConfig.Retryable's, so it drops
          straight into a retry policy without an adapter. That is the whole reason
          this exporter classifies instead of looping.
        impl: otlpRetryable
        in:
          - name: err
            type: error
        name: OTLPRetryable
        out:
          - type: bool
      - doc: |-
          NewMeter returns a fresh in-memory Meter with every MeterConfig knob at its
          resolved default: bounded at DefaultMaxSeriesPerInstrument, cumulative,
          service.name=unknown_service, this SDK as the scope, and the system clock.
        impl: newMeter
        name: NewMeter
        out:
          - type: coremetrics.FullMeter
      - doc: |-
          NewMeterWithConfig returns a fresh in-memory Meter honouring cfg. Every unset
          field resolves to a working value and none of them to an inert one — see
          MeterConfig for each knob's rule.
        impl: newMeterWithConfig
        in:
          - name: cfg
            type: MeterConfig
        name: NewMeterWithConfig
        out:
          - type: coremetrics.FullMeter
      - doc: |-
          NewOTLPHTTPExporter returns an Exporter that encodes each snapshot as
          OTLP/JSON and POSTs it to cfg.Endpoint.

          It is the EMITTER half of this package's OTLP support; EncodeOTLPJSON is the
          encoder half and this constructor adds nothing to it but transport. The split
          is why an encoding bug and a network bug are never the same investigation.

          It is deliberately NOT registered. The registry is reached by importing a
          package, and arming a network client from an import is strictly worse than
          the stdout hazard ADR 0030 already refuses: there is no endpoint that could
          be a correct default, and a wrong one turns every Export into a POST at
          whatever answers on that address.

          It does NOT retry, and that is a decision rather than an omission. The
          specification asks a client to back off exponentially on a retryable status,
          this SDK already ships that policy in internal/service/app/resilience, and a
          backoff hidden inside Export would be a second one a caller cannot see, tune
          or cancel. What this exporter provides instead is the CLASSIFICATION a retry
          policy needs:

          	runner := resilience.NewRetry(resilience.RetryConfig{
          	    MaxAttempts: 3,
          	    BaseDelay:   time.Second,
          	    Retryable:   metrics.OTLPRetryable,
          	})

          A construction failure is returned rather than deferred into a Runner that
          always fails: nothing here publishes a signature that forces the deferral,
          and refusing at wiring time is strictly earlier than refusing at the first
          scrape.
        in:
          - name: name
            type: coremetrics.ExporterName
          - name: cfg
            type: OTLPHTTPConfig
        name: NewOTLPHTTPExporter
        out:
          - name: exporter
            type: coremetrics.Exporter
          - name: err
            type: error
      - doc: |-
          EncodeOTLPJSON renders snap as ONE OTLP/JSON ExportMetricsServiceRequest —
          exactly the bytes that go in the body of a POST to /v1/metrics under
          Content-Type: application/json.

          It is the encoder half of this package's OTLP support and it does no I/O at
          all, so it is usable and testable on its own: hand it a snapshot, compare the
          bytes to the schema. The emitter half (NewOTLPHTTPExporter) calls exactly
          this function and adds only the transport.

          The snapshot maps onto the payload without a regrouping pass, which is what
          ADR 0044 §Decision 9 shaped it for:

          	SnapshotValue        -> resourceMetrics[0]
          	  .Resource          ->   .resource.attributes
          	  .Scope             ->   .scopeMetrics[0].scope
          	  .Sums[name]        ->   .scopeMetrics[0].metrics[] {name, sum{…}}
          	  .Gauges[name]      ->   metrics[] {name, gauge{…}}
          	  .Histograms[name]  ->   metrics[] {name, histogram{…}}
          	  .*[name].Description ->  metrics[].description, omitted when empty
          	  .StartTime/.Time   ->   copied DOWN onto every data point

          The two single-element levels are single because one Meter has exactly one
          Resource and one Scope.

          It REFUSES rather than emits a payload the schema cannot express: a
          temporality that is neither delta nor cumulative (OTLPUnresolvedTemporality)
          and a bucket layout that is not strictly-increasing finite bounds with one
          count per bucket plus the overflow (OTLPInvalidBucketLayout). Both are
          STRUCTURE — a temporality is fixed at meter construction, a bucket ladder is
          a literal at the call site — so each fails on the first export or never,
          exactly like the metric name the Prometheus connector refuses.
        in:
          - name: snap
            type: coremetrics.SnapshotValue
        name: EncodeOTLPJSON
        out:
          - name: doc
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          NewOTLPJSONExporter returns an Exporter writing each snapshot to dst as one
          newline-terminated OTLP/JSON document. It is NOT added to the registry — bind
          it yourself or call Export directly.

          The newline makes a stream of exports newline-delimited JSON, which is what a
          file or a terminal wants; EncodeOTLPJSON returns the document alone, which is
          what an HTTP body wants.
        in:
          - name: name
            type: coremetrics.ExporterName
          - name: dst
            type: io.Writer
        name: NewOTLPJSONExporter
        out:
          - type: coremetrics.Exporter
      - doc: |-
          NewPrometheusExporter returns a Prometheus text Exporter writing to dst under
          name. It is NOT added to the registry — bind it yourself, or hand it the
          http.ResponseWriter of a /metrics handler and call Export directly.
        in:
          - name: name
            type: coremetrics.ExporterName
          - name: dst
            type: io.Writer
        name: NewPrometheusExporter
        out:
          - type: coremetrics.Exporter
      - doc: |-
          NewTextExporter returns a text Exporter writing to dst under name. It is NOT
          added to the registry — bind it yourself or call Export directly.
        in:
          - name: name
            type: coremetrics.ExporterName
          - name: dst
            type: io.Writer
        name: NewTextExporter
        out:
          - type: coremetrics.Exporter
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
      coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
      otlp: github.com/kitsunium/sdk/internal/service/observe/internal/otlp
    path: github.com/kitsunium/sdk/internal/service/observe/metrics
    types:
      - decl: true
        doc: |-
          MeterConfig configures a Meter. Every field has a resolved meaning when left
          unset — none of them is inert (ADR 0031).
        name: MeterConfig
        struct:
          fields:
            - doc: |-
                MaxSeriesPerInstrument bounds how many distinct attribute sets ONE
                instrument name may hold. Beyond it, further sets fold into a single
                aggregated overflow series rather than allocating — see
                seriesStore.admit for that policy and what it costs.

                Non-positive CLAMPS to DefaultMaxSeriesPerInstrument. It does NOT mean
                "unbounded", and there is no setting that does (ADR 0031): a caller who
                leaves this zero has not decided that memory is free, they have not yet
                learned the question exists, and the zero value must not be the
                dangerous answer. A caller who genuinely wants a huge bound types a
                huge number, and the number is then in their source where a reviewer
                can see it.

                The bound is PER NAME rather than per meter so that one exploding
                attribute on http_requests_total cannot starve db_queries_total of the
                series it needs; each metric's failure stays its own.
              name: MaxSeriesPerInstrument
              type: int
            - doc: |-
                Temporality says which window a collected sum or histogram covers.

                Unset CLAMPS to TemporalityCumulative, because that is what this meter
                DOES when nothing tells it otherwise: it accumulates into atomics and
                never resets them. TemporalityDelta makes Collect consume the window it
                reports, which means a delta meter has exactly one reader — two
                independent collectors would each receive part of the observations.
                Any value that is neither of the three constants panics
                (InvalidTemporality); it can only come from a cast.
              name: Temporality
              type: coremetrics.Temporality
            - doc: |-
                Resource identifies the producer of the telemetry and is carried once
                per snapshot. An absent service.name is filled with
                coreotel.UnknownService, which is what the OpenTelemetry
                specification mandates rather than a value this SDK invented.
              name: Resource
              type: coreotel.ResourceValue
            - doc: |-
                Scope identifies the instrumentation that mints the instruments. An
                empty Name resolves to coremetrics.DefaultScopeName; Version stays
                empty when the caller has none, because it is optional in the
                specification and inventing one would be a claim about code this
                package cannot see.
              name: Scope
              type: coreotel.ScopeValue
            - doc: |-
                Clock supplies the snapshot window's endpoints. Nil resolves to
                clock.System, matching every other port in this SDK that takes one.
                Only Now and Since are used, so the frozen two-method clock.Clock is
                enough and a two-method test double still satisfies it (ADR 0039).
              name: Clock
              type: clock.Clock
      - decl: true
        doc: |-
          OTLPHTTPConfig configures an OTLP/HTTP exporter. Every field has a resolved
          meaning when left unset except Endpoint, which has none that could be right:
          a full URL used as-is, so a caller writes
          "http://collector:4318" + OTLPMetricsPath, and an endpoint that is not an
          absolute http(s) URL with a non-root path is REFUSED at construction
          (OTLPEndpointInvalid). Timeout clamps to DefaultOTLPTimeout and is ignored
          when Client is set; MaxResponseBytes clamps to DefaultOTLPMaxResponseBytes.

          It is a DEFINED type over the configuration of the transport both signals
          share (internal/service/observe/internal/otlp.HTTPConfig, where each field is
          documented once), not an alias of it: metrics.OTLPHTTPConfig and
          trace.OTLPHTTPConfig stay two types a caller cannot hand to the wrong
          signal's constructor.
        name: OTLPHTTPConfig
        underlying: otlp.HTTPConfig
    variables:
      - doc: |-
          OTLPJSON is the default OTLP/JSON exporter, registered to write each snapshot
          to stderr as one newline-terminated document. Use NewOTLPJSONExporter for a
          custom writer/name, EncodeOTLPJSON for the bytes alone, or
          NewOTLPHTTPExporter to actually ship them to a collector.

          stderr, not stdout, for the reason ADR 0030 gives in full on Text: importing
          a package must never arm a writer on a stream the process may be using as a
          protocol channel. This instance is a diagnostic — the production path is
          NewOTLPHTTPExporter, which is never registered because arming a network
          client on import would be strictly worse than arming a writer.
        name: OTLPJSON
        type: coremetrics.Exporter
      - doc: |-
          Prometheus is the default Prometheus connector, registered to write snapshots
          to stderr. Use NewPrometheusExporter for the writer a scrape actually needs.

          stderr, not stdout, for the reason ADR 0030 gives in full on Text: importing
          a package must never arm a writer on a stream the process may be using as a
          protocol channel. The registered instance is a diagnostic — the production
          path is NewPrometheusExporter(name, w) inside an HTTP handler, where w is the
          http.ResponseWriter the scraper is waiting on, and no default is involved.
        name: Prometheus
        type: coremetrics.Exporter
      - doc: |-
          Text is the default text exporter, registered to write snapshots to stderr.
          Use NewTextExporter for a custom writer/name (not added to the registry).

          The destination is stderr, not stdout, because importing a package must never
          arm a writer on a stream the process may be using as a protocol channel. A
          daemon that speaks JSON-RPC on stdout (an MCP server in stdio mode), a filter
          that pipes structured output downstream, any `cmd | jq` — each of them is
          corrupted by a single Export("text", ...) if the default writer is stdout,
          and the import that armed it is invisible at the call site. Diagnostics
          belong on stderr; a caller who genuinely wants stdout asks for it by name
          with NewTextExporter(name, os.Stdout). ADR 0030.
        name: Text
        type: coremetrics.Exporter
  - doc: |-
      Package metrics is the public facade for the SDK's observability domain — the
      natural twin of the logger, shaped on the OpenTelemetry metrics DATA MODEL.

      The model is OpenTelemetry's; the code is not. Nothing here imports
      go.opentelemetry.io: OTel is a published specification, and this SDK
      implements it the way it implements the Prometheus exposition format or
      RFC 7517 — from the document, with the standard library. What you get is the
      model's vocabulary (typed attributes, aggregation temporality, Resource,
      InstrumentationScope, monotonic and non-monotonic sums, observable
      instruments) with this SDK's dependency budget, which is zero.

      	m := metrics.NewMeter()
      	m.Counter("requests").Add(1)
      	_ = metrics.Export("text", m.Collect())

      # Instruments

      A [Meter] mints four synchronous instruments and registers three
      asynchronous ones:

        - [Counter] — a MONOTONIC sum. Requests served, bytes written. A
          non-positive Add is ignored, because a backend reading a monotonic sum
          is entitled to treat a decrease as a process restart.
        - [UpDownCounter] — a NON-MONOTONIC sum. In-flight requests, queue depth.
          Additive like a counter, but Add may be negative and Dec exists.
        - [Gauge] — a sampled reading with no arithmetic behind it. Temperature,
          a configured limit.
        - [Histogram] — a bucketed distribution. Latency, payload size.
        - [FullMeter].ObservableCounter, [FullMeter].ObservableUpDownCounter and
          [FullMeter].ObservableGauge — a callback read once per [Meter].Collect,
          for a value that already exists somewhere and only needs reading
          (runtime.NumGoroutine(), a cache size). The callback reports the
          ABSOLUTE value; the SDK differences it when the meter is a delta reader.

      A Counter and an UpDownCounter both produce a [SumMetric] in the snapshot,
      told apart by [SumMetric].Monotonic. That is the OTel data model's own
      economy: monotonicity is a FIELD of a sum, not a second point type.

      [Meter] itself carries only the three instruments and Collect it shipped
      with; UpDownCounter and the observables live on the sibling interfaces
      [UpDownMeter] and [AsyncMeter], because a published Go interface cannot grow
      a method without breaking every downstream implementer (ADR 0039).
      [FullMeter] is the union, and it is what [NewMeter] returns.

      # Describing an instrument

      The OTel data model gives a metric a human-readable description, and the SDK
      records it against the instrument NAME rather than against a call site,
      because that is where the model puts it and because it is explicitly
      NON-IDENTIFYING: describing a metric never creates a series. [Describer] is a
      fourth sibling and, unlike the other two, it is NOT folded into [FullMeter] —
      a union is still an interface, and widening one breaks downstream doubles at
      any version. Reach it by type assertion:

      	meter := metrics.NewMeter()
      	if d, ok := meter.(metrics.Describer); ok {
      		d.Describe("http_server_requests", "Requests served, by route and status")
      	}

      The false branch is information, not boilerplate: a Meter that records no
      description does not implement [Describer], and that is how a caller learns
      their documentation will not reach the wire.

      Describing is a WIRING-TIME call and costs the observation path nothing. Two
      mistakes panic, both of them structural and therefore caught on the first
      boot or never: an EMPTY description ([InvalidDescription]), which would
      document nothing; and a SECOND, DIFFERENT description for one name
      ([DescriptionConflict]), because a description belongs to the name and two of
      them means one wiring site is wrong. Re-describing with identical text is
      idempotent.

      What each exporter does with it: "prometheus" emits `# HELP <name> <text>`
      above `# TYPE` and nothing at all when there is no description, "otlpjson"
      fills `Metric.description` and omits the field when it is empty, and "text"
      prints it on the `# metric` header because that exporter exists to show the
      whole model.

      # Attributes

      An instrument is identified by its name AND its attributes. One name plus one
      attribute set is one SERIES, and every fetch of that pair returns the same
      instrument, so observations accumulate in one place wherever they are made.
      An attribute's value is TYPED — string, bool, int64 or float64 — and built by
      one of four constructors:

      	m.Counter("requests",
      	    metrics.String("http.request.method", "GET"),
      	    metrics.Int64("http.response.status_code", 503),
      	    metrics.Bool("cache.hit", false),
      	).Inc()

      The type is part of the identity: String("v", "1") and Int64("v", 1) are two
      different series, not one. Attribute ORDER is not — a set is a set. Passing
      no attributes names the dimensionless series.

      An attribute KEY is structure: it is written at the call site and constant
      for the process, so an empty key, a repeated key, or a value built by a
      struct literal instead of a constructor is a programmer error and panics with
      [InvalidAttribute]. An attribute VALUE is data and may be anything.

      Homogeneous ARRAY attributes, which the OTel model also allows, are not
      implemented — see the package's CLAUDE.md for what they would cost on the
      observation path.

      # Temporality

      [Temporality] says which window a reported number covers, and it is the one
      fact a metric value cannot carry by itself:

        - [TemporalityCumulative] — the point covers everything since the meter
          started. Successive collections repeat the start timestamp. This is what
          an unconfigured [Meter] does, because an in-memory meter accumulates into
          atomics and never resets them.
        - [TemporalityDelta] — the point covers only the window since the previous
          collection. [Meter].Collect then CONSUMES what it reports, so a delta
          meter has exactly one reader.

      [TemporalityUnspecified] is the zero value and resolves to cumulative; there
      is no setting that leaves it undecided (ADR 0031).

      # Resource and scope

      A [Snapshot] carries two identities once for the whole payload rather than on
      every point: the [Resource] (who produced this — service.name, and anything
      else the caller adds) and the [Scope] (what instrumented it — a library name
      and version). An absent service.name resolves to [UnknownService], which is
      what the specification mandates rather than a value this SDK invented.

      	m := metrics.NewMeterWithConfig(metrics.MeterConfig{
      	    Resource: metrics.Resource{Attrs: []metrics.Attr{
      	        metrics.String(metrics.ServiceNameKey, "orders"),
      	    }},
      	    Scope: metrics.Scope{Name: "github.com/acme/orders", Version: "1.4.0"},
      	})

      # Cardinality

      Distinct attribute values create distinct series, and an unbounded stream of
      them is a memory incident rather than a reporting inconvenience. Every Meter
      therefore bounds how many series ONE instrument name may hold —
      [DefaultMaxSeriesPerInstrument] unless [NewMeterWithConfig] says otherwise.
      Past the bound, further attribute sets are folded into a single aggregated
      series carrying [OverflowAttrKey]=true: memory stays bounded, no observation
      is dropped, and the condition is visible in every snapshot from then on. What
      is lost is the breakdown — once folded, an observation's own attributes are
      gone.

      A non-positive MaxSeriesPerInstrument clamps to the default. There is no
      setting that means "unbounded" (ADR 0031); a caller who wants a very large
      bound writes a very large number, where a reviewer can see it.

      # Exporting

      A [Snapshot] maps each instrument name to its metric, and each metric to its
      series — the shape every per-series wire format wants, and the shape an
      OTLP encoder can walk without a regrouping pass. Three stdlib exporters are
      registered on import and [Export] dispatches by name. All three write to
      stderr so that importing this package never arms a writer on stdout, which a
      process may be using as a protocol channel (ADR 0030).

      "text" is a diagnostic that prints the whole model — resource, scope, window,
      temporality, monotonicity, and each attribute with its type visible.

      "prometheus" is a deliberately LOSSY connector to the Prometheus text
      exposition format, kept because a Prometheus deployment is a real
      destination and not because the format can carry this model. What it loses:

        - Temporality. The format has none, and a server reads every counter as
          cumulative. A delta snapshot is REFUSED ([UnsupportedTemporality]) rather
          than mis-labelled, and so is a hand-built one whose temporality was left
          unresolved, which would otherwise pass as cumulative.
        - The attribute's TYPE. A Prometheus label value is a string, so
          Int64("v", 1) and String("v", "1") — two series here — become one there.
        - The Resource and the Scope, which have nowhere to go. In particular
          service.name cannot even be spelled: a Prometheus label name is
          [a-zA-Z_][a-zA-Z0-9_]* and the dot is outside it.
        - Exemplars, which this SDK does not produce at all.

      It REFUSES, rather than rewrites, a name the format cannot spell: an
      instrument name must match [a-zA-Z_:][a-zA-Z0-9_:]* and an attribute key
      [a-zA-Z_][a-zA-Z0-9_]*, which means an OTel-conventional dotted key is
      refused too. Mapping the offending characters to "_" would silently merge two
      distinct instruments into one family, and a metrics pipeline cannot detect
      that afterwards. The refusal is typed ([InvalidMetricName],
      [InvalidLabelName], [ReservedLabelName]) and leaves the writer untouched,
      because a truncated exposition parses as a complete one.

      A scrape endpoint binds its own exporter with [NewPrometheusExporter] and
      hands it the response writer:

      	http.HandleFunc("/metrics", func(w http.ResponseWriter, _ *http.Request) {
      	    w.Header().Set("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
      	    _ = metrics.NewPrometheusExporter("scrape", w).Export(m.Collect())
      	})

      A non-monotonic sum is typed `gauge` there, not `counter`, because `rate()`
      on a counter re-extrapolates from zero every time the value falls.

      # OTLP

      "otlpjson" is the native wire: the OpenTelemetry Protocol, JSON encoding,
      implemented from the specification with encoding/json and net/http and
      nothing else. Nothing here imports go.opentelemetry.io, for the reason
      nothing else in this package does — OTel is a document, and the whole point
      of shaping [Snapshot] on its data model was that a payload carrying
      temporality, resource, scope and typed attributes is OTLP-encodable by
      construction. Unlike the Prometheus connector, this one loses NOTHING.

      It comes in two halves, deliberately, so an encoding bug and a network bug
      are never the same investigation:

      [EncodeOTLPJSON] is the ENCODER. It takes a [Snapshot] and returns the exact
      bytes of one ExportMetricsServiceRequest — the body of a POST to
      /v1/metrics — and does no I/O at all. Hand it to a queue, a file, a
      compressor, or a test that compares it to the schema:

      	body, err := metrics.EncodeOTLPJSON(m.Collect())

      [NewOTLPJSONExporter] binds that encoder to an io.Writer, emitting one
      newline-terminated document per export so a stream is NDJSON. The registered
      "otlpjson" exporter is that, on stderr (ADR 0030).

      [NewOTLPHTTPExporter] is the EMITTER: it encodes and POSTs to a collector
      under Content-Type: application/json. It is NOT registered — the registry is
      reached by importing a package, there is no endpoint that could be a correct
      default, and arming a network client from an import is worse than arming a
      writer. The endpoint is a full URL used as-is, so spell the signal path:

      	exporter, err := metrics.NewOTLPHTTPExporter("otlp",
      	    metrics.OTLPHTTPConfig{Endpoint: "http://collector:4318" + metrics.OTLPMetricsPath})

      It does not retry, and that is a decision. The specification asks a client to
      back off on a retryable status; this SDK already ships that policy, and a
      backoff hidden inside Export would be a second one you cannot see, tune or
      cancel. What you get instead is the classification a retry policy needs —
      [OTLPRetryable] has exactly the signature resilience.RetryConfig.Retryable
      wants:

      	runner := resilience.NewRetry(resilience.RetryConfig{
      	    MaxAttempts: 3,
      	    BaseDelay:   time.Second,
      	    Retryable:   metrics.OTLPRetryable,
      	})

      [OTLPExportUnavailable] is transient (a transport fault, or HTTP 429 / 502 /
      503 / 504 — the four the specification lists, and no other 5xx).
      [OTLPExportRejected] is permanent. [OTLPPartialSuccess] means the collector
      accepted the request and dropped some of its points, which the specification
      forbids retrying, so it is reported rather than replayed.

      Two things the encoder REFUSES rather than mis-encodes, both structural and
      therefore wrong on the first export or never:
      [OTLPUnresolvedTemporality], because the schema says its UNSPECIFIED value
      "MUST not be used"; and [OTLPInvalidBucketLayout], because OTLP requires
      bucket counts one longer than strictly-increasing finite bounds — the bucket
      above the last declared bound is already the +Inf overflow, so an infinite
      bound would declare it twice.
    facade:
      - const:
          - doc: |-
              DefaultMaxSeriesPerInstrument is the cardinality bound NewMeter applies,
              and the value a non-positive MeterConfig knob clamps to.
            name: DefaultMaxSeriesPerInstrument
            reexport: svcmetrics.DefaultMaxSeriesPerInstrument
            type: int
            typed: true
            value: "2000"
          - doc: |-
              OverflowAttrKey is the reserved attribute naming a meter's aggregated
              overflow series. It appears in a snapshot only once an instrument has
              exceeded its cardinality bound, and its value is the boolean true.
            name: OverflowAttrKey
            reexport: coremetrics.OverflowAttrKey
            type: string
            typed: true
            value: "\"sdk_metric_overflow\""
          - doc: |-
              ServiceNameKey is the attribute key the OTel resource semantic
              conventions reserve for the logical name of the service.
            name: ServiceNameKey
            reexport: coreotel.ServiceNameKey
            type: string
            typed: true
            value: "\"service.name\""
          - doc: |-
              UnknownService is the service.name the specification mandates when a
              producer supplies none.
            name: UnknownService
            reexport: coreotel.UnknownService
            type: string
            typed: true
            value: "\"unknown_service\""
          - doc: |-
              DefaultScopeName names this SDK as the instrumenting library when a
              caller declares no scope of their own.
            name: DefaultScopeName
            reexport: coremetrics.DefaultScopeName
            type: string
            typed: true
            value: "\"github.com/kitsunium/sdk/pkg/v1/observe/metrics\""
          - doc: |-
              OTLPMetricsPath is the URL path OTLP/HTTP reserves for the metrics
              signal. An OTLP endpoint is a full URL used as-is, so append this to a
              collector's base address rather than hoping the SDK guesses it.
            name: OTLPMetricsPath
            reexport: svcmetrics.OTLPMetricsPath
            type: string
            typed: true
            value: "\"/v1/metrics\""
          - doc: |-
              DefaultOTLPTimeout bounds one OTLP/HTTP export round trip when
              OTLPHTTPConfig leaves Timeout unset. It is the OpenTelemetry protocol
              exporter specification's own default, not a figure this SDK invented.
            name: DefaultOTLPTimeout
            reexport: svcmetrics.DefaultOTLPTimeout
            type: time.Duration
            typed: true
            value: "10000000000"
          - doc: |-
              DefaultOTLPMaxResponseBytes caps how much of a collector's response is
              read. The body is the one length a remote party controls in this
              exchange, and a conforming response is a few hundred bytes.
            name: DefaultOTLPMaxResponseBytes
            reexport: svcmetrics.DefaultOTLPMaxResponseBytes
            type: int64
            typed: true
            value: 1 << 20
      - alias:
          - doc: OTLPHTTPConfig is the public alias for an OTLP/HTTP exporter's configuration.
            name: OTLPHTTPConfig
            target: svcmetrics.OTLPHTTPConfig
      - alias:
          - doc: |-
              Meter is the public alias for the frozen instrument factory: Counter, Gauge,
              Histogram and Collect.
            name: Meter
            target: coremetrics.Meter
      - alias:
          - doc: |-
              UpDownMeter is the public alias for the sibling port that mints the
              non-monotonic sum Meter cannot.
            name: UpDownMeter
            target: coremetrics.UpDownMeter
      - alias:
          - doc: |-
              AsyncMeter is the public alias for the sibling port that registers
              observable (asynchronous) instruments.
            name: AsyncMeter
            target: coremetrics.AsyncMeter
      - alias:
          - doc: |-
              Describer is the public alias for the sibling port that documents an
              instrument NAME. It is deliberately NOT part of FullMeter — reach it by type
              assertion, and read the false case as "this meter records no description".
            name: Describer
            target: coremetrics.Describer
      - alias:
          - doc: |-
              FullMeter is the public alias for the union of all three — what NewMeter
              returns.
            name: FullMeter
            target: coremetrics.FullMeter
      - alias:
          - doc: Counter is the public alias for a monotonic sum instrument.
            name: Counter
            target: coremetrics.Counter
      - alias:
          - doc: UpDownCounter is the public alias for a non-monotonic sum instrument.
            name: UpDownCounter
            target: coremetrics.UpDownCounter
      - alias:
          - doc: Gauge is the public alias for a sampled-reading instrument.
            name: Gauge
            target: coremetrics.Gauge
      - alias:
          - doc: Histogram is the public alias for a bucketed distribution instrument.
            name: Histogram
            target: coremetrics.Histogram
      - alias:
          - doc: Attr is the public alias for one typed dimension of a series.
            name: Attr
            target: coreotel.AttrValue
      - alias:
          - doc: AttrKind is the public alias for an attribute value's type tag.
            name: AttrKind
            target: coreotel.AttrKind
      - const:
          - doc: AttrKindInvalid marks an attribute whose value no constructor ever set.
            name: AttrKindInvalid
            reexport: coreotel.AttrKindInvalid
            type: AttrKind
            typed: true
            value: "0"
      - const:
          - doc: AttrKindString marks a string-valued attribute.
            name: AttrKindString
            reexport: coreotel.AttrKindString
            type: AttrKind
            typed: true
            value: "1"
      - const:
          - doc: AttrKindBool marks a bool-valued attribute.
            name: AttrKindBool
            reexport: coreotel.AttrKindBool
            type: AttrKind
            typed: true
            value: "2"
      - const:
          - doc: AttrKindInt64 marks a signed 64-bit integer attribute.
            name: AttrKindInt64
            reexport: coreotel.AttrKindInt64
            type: AttrKind
            typed: true
            value: "3"
      - const:
          - doc: AttrKindFloat64 marks an IEEE-754 double attribute.
            name: AttrKindFloat64
            reexport: coreotel.AttrKindFloat64
            type: AttrKind
            typed: true
            value: "4"
      - alias:
          - doc: Temporality is the public alias for a metric's aggregation temporality.
            name: Temporality
            target: coremetrics.Temporality
      - const:
          - doc: |-
              TemporalityUnspecified is the unset zero value; it resolves to
              TemporalityCumulative and never reaches a Snapshot.
            name: TemporalityUnspecified
            reexport: coremetrics.TemporalityUnspecified
            type: Temporality
            typed: true
            value: "0"
      - const:
          - doc: TemporalityDelta reports the window since the previous collection.
            name: TemporalityDelta
            reexport: coremetrics.TemporalityDelta
            type: Temporality
            typed: true
            value: "1"
      - const:
          - doc: TemporalityCumulative reports the window since the series started.
            name: TemporalityCumulative
            reexport: coremetrics.TemporalityCumulative
            type: Temporality
            typed: true
            value: "2"
      - alias:
          - doc: |-
              Resource is the public alias for the producer's identity, carried once per
              snapshot.
            name: Resource
            target: coreotel.ResourceValue
      - alias:
          - doc: |-
              Scope is the public alias for the instrumentation's identity, carried once
              per snapshot.
            name: Scope
            target: coreotel.ScopeValue
      - alias:
          - doc: Snapshot is the public alias for a whole-meter point-in-time copy.
            name: Snapshot
            target: coremetrics.SnapshotValue
      - alias:
          - doc: |-
              SumMetric is the public alias for every series of one sum instrument name,
              plus its temporality and monotonicity.
            name: SumMetric
            target: coremetrics.SumMetricValue
      - alias:
          - doc: SumPoint is the public alias for one sum series.
            name: SumPoint
            target: coremetrics.SumValue
      - alias:
          - doc: GaugeMetric is the public alias for every series of one gauge instrument name.
            name: GaugeMetric
            target: coremetrics.GaugeMetricValue
      - alias:
          - doc: GaugePoint is the public alias for one gauge series.
            name: GaugePoint
            target: coremetrics.GaugeValue
      - alias:
          - doc: |-
              HistogramMetric is the public alias for every series of one histogram
              instrument name, plus its temporality.
            name: HistogramMetric
            target: coremetrics.HistogramMetricValue
      - alias:
          - doc: HistogramPoint is the public alias for one histogram series.
            name: HistogramPoint
            target: coremetrics.HistogramValue
      - alias:
          - doc: |-
              ObserveInt64 is the public alias for the reporting function an integer
              observable callback is handed.
            name: ObserveInt64
            target: coremetrics.ObserveInt64
      - alias:
          - doc: |-
              ObserveFloat64 is the public alias for the reporting function a double
              observable callback is handed.
            name: ObserveFloat64
            target: coremetrics.ObserveFloat64
      - alias:
          - doc: Int64Callback is the public alias for an integer observable's callback.
            name: Int64Callback
            target: coremetrics.Int64Callback
      - alias:
          - doc: Float64Callback is the public alias for a double observable's callback.
            name: Float64Callback
            target: coremetrics.Float64Callback
      - alias:
          - doc: MeterConfig is the public alias for a Meter's configuration.
            name: MeterConfig
            target: svcmetrics.MeterConfig
      - alias:
          - doc: Exporter is the public alias for a snapshot shipper.
            name: Exporter
            target: coremetrics.Exporter
      - alias:
          - doc: ExporterName is the public alias for an exporter's registry key.
            name: ExporterName
            target: coremetrics.ExporterName
      - var:
          - doc: UnknownExporter is returned by Export when no exporter matches the name.
            name: UnknownExporter
            reexport: coremetrics.UnknownExporter
            type: "*errs.Error"
          - doc: ExportFailed wraps an exporter's shipping failure.
            name: ExportFailed
            reexport: coremetrics.ExportFailed
            type: "*errs.Error"
          - doc: InstrumentKindConflict is raised when a name is reused across kinds.
            name: InstrumentKindConflict
            reexport: coremetrics.InstrumentKindConflict
            type: "*errs.Error"
          - doc: |-
              InvalidAttribute is raised when an attribute set has an empty or
              repeated key, or a value no constructor ever set.
            name: InvalidAttribute
            reexport: coremetrics.InvalidAttribute
            type: "*errs.Error"
          - doc: |-
              InvalidTemporality is raised when a MeterConfig carries a Temporality
              that is none of the three constants.
            name: InvalidTemporality
            reexport: coremetrics.InvalidTemporality
            type: "*errs.Error"
          - doc: |-
              InvalidDescription is raised when Describe is handed an empty
              description, which would document nothing.
            name: InvalidDescription
            reexport: coremetrics.InvalidDescription
            type: "*errs.Error"
          - doc: |-
              DescriptionConflict is raised when a second, DIFFERENT description is
              bound to an instrument name that already has one.
            name: DescriptionConflict
            reexport: coremetrics.DescriptionConflict
            type: "*errs.Error"
          - doc: |-
              InvalidMetricName is returned by the Prometheus connector when an
              instrument name is not a valid Prometheus metric name.
            name: InvalidMetricName
            reexport: coremetrics.InvalidMetricName
            type: "*errs.Error"
          - doc: |-
              InvalidLabelName is returned by the Prometheus connector when an
              attribute key is not a valid Prometheus label name.
            name: InvalidLabelName
            reexport: coremetrics.InvalidLabelName
            type: "*errs.Error"
          - doc: |-
              ReservedLabelName is returned by the Prometheus connector when an
              attribute key is legal but reserved — a "__" prefix, or "le" on a
              histogram.
            name: ReservedLabelName
            reexport: coremetrics.ReservedLabelName
            type: "*errs.Error"
          - doc: |-
              UnsupportedTemporality is returned by the Prometheus connector when the
              snapshot is not cumulative — a delta one, which the exposition format
              cannot express, or a hand-built one whose temporality is unresolved.
            name: UnsupportedTemporality
            reexport: coremetrics.UnsupportedTemporality
            type: "*errs.Error"
          - doc: |-
              OTLPUnresolvedTemporality is returned by the OTLP/JSON encoder when a
              metric's temporality is neither delta nor cumulative. The schema's
              UNSPECIFIED value is documented as one that MUST NOT be used.
            name: OTLPUnresolvedTemporality
            reexport: coremetrics.OTLPUnresolvedTemporality
            type: "*errs.Error"
          - doc: |-
              OTLPInvalidBucketLayout is returned by the OTLP/JSON encoder when a
              histogram's buckets are not one count more than strictly-increasing
              finite bounds.
            name: OTLPInvalidBucketLayout
            reexport: coremetrics.OTLPInvalidBucketLayout
            type: "*errs.Error"
          - doc: |-
              OTLPEndpointInvalid is returned by NewOTLPHTTPExporter when the endpoint
              is not an absolute http(s) URL carrying the signal path.
            name: OTLPEndpointInvalid
            reexport: coremetrics.OTLPEndpointInvalid
            type: "*errs.Error"
          - doc: |-
              OTLPExportRejected is returned when a collector refuses the payload with
              a status the specification marks non-retryable.
            name: OTLPExportRejected
            reexport: coremetrics.OTLPExportRejected
            type: "*errs.Error"
          - doc: |-
              OTLPExportUnavailable is returned when an OTLP/HTTP export fails
              transiently — a transport fault, or HTTP 429/502/503/504. It is the one
              OTLPRetryable reports true for.
            name: OTLPExportUnavailable
            reexport: coremetrics.OTLPExportUnavailable
            type: "*errs.Error"
          - doc: |-
              OTLPPartialSuccess is returned when a collector accepts the request but
              rejects some of its data points. The specification forbids retrying it.
            name: OTLPPartialSuccess
            reexport: coremetrics.OTLPPartialSuccess
            type: "*errs.Error"
      - func:
          doc: |-
            String returns a string-valued attribute. It is the shortest of the four
            constructors to write because a string dimension is the common one.
          forward: coreotel.String
          in:
            - name: key
            - name: value
              type: string
          name: String
          out:
            - type: Attr
      - func:
          doc: Bool returns a bool-valued attribute.
          forward: coreotel.Bool
          in:
            - name: key
              type: string
            - name: value
              type: bool
          name: Bool
          out:
            - type: Attr
      - func:
          doc: Int64 returns a signed-integer attribute.
          forward: coreotel.Int64
          in:
            - name: key
              type: string
            - name: value
              type: int64
          name: Int64
          out:
            - type: Attr
      - func:
          doc: |-
            Float64 returns a double attribute. A float is a measurement rather than a
            dimension, and it is keyed on its bit pattern — see the core documentation.
          forward: coreotel.Float64
          in:
            - name: key
              type: string
            - name: value
              type: float64
          name: Float64
          out:
            - type: Attr
      - func:
          doc: |-
            NewMeter returns a fresh in-memory Meter with every MeterConfig knob at its
            resolved default: bounded at DefaultMaxSeriesPerInstrument, cumulative,
            service.name=unknown_service, this SDK as the scope, and the system clock.
          forward: svcmetrics.NewMeter
          name: NewMeter
          out:
            - type: FullMeter
      - func:
          doc: |-
            NewMeterWithConfig returns a fresh in-memory Meter honouring cfg. Every unset
            field resolves to a working value and none of them to an inert one.
          forward: svcmetrics.NewMeterWithConfig
          in:
            - name: cfg
              type: MeterConfig
          name: NewMeterWithConfig
          out:
            - type: FullMeter
      - func:
          doc: |-
            NewTextExporter returns a text Exporter writing to dst under name (not
            auto-registered).
          forward: svcmetrics.NewTextExporter
          in:
            - name: name
              type: ExporterName
            - name: dst
              type: io.Writer
          name: NewTextExporter
          out:
            - type: Exporter
      - func:
          doc: |-
            NewPrometheusExporter returns an Exporter rendering the Prometheus text
            exposition format to dst under name (not auto-registered). Hand it the
            http.ResponseWriter of a /metrics handler; the registered "prometheus"
            exporter targets stderr and is a diagnostic, not a scrape endpoint.
          forward: svcmetrics.NewPrometheusExporter
          in:
            - name: name
              type: ExporterName
            - name: dst
              type: io.Writer
          name: NewPrometheusExporter
          out:
            - type: Exporter
      - func:
          doc: |-
            EncodeOTLPJSON renders snap as ONE OTLP/JSON ExportMetricsServiceRequest:
            exactly the bytes that go in the body of a POST to /v1/metrics under
            Content-Type: application/json.

            It does no I/O, so it is the half of OTLP support that is testable on its
            own — and the half NewOTLPHTTPExporter calls before it touches a socket.
          forward: svcmetrics.EncodeOTLPJSON
          in:
            - name: snap
              type: Snapshot
          name: EncodeOTLPJSON
          out:
            - name: doc
              type: "[]byte"
            - name: err
              type: error
      - func:
          doc: |-
            NewOTLPJSONExporter returns an Exporter writing each snapshot to dst as one
            newline-terminated OTLP/JSON document, so a stream of exports is NDJSON. It
            is not auto-registered; the registered "otlpjson" exporter is this, on
            stderr.
          forward: svcmetrics.NewOTLPJSONExporter
          in:
            - name: name
              type: ExporterName
            - name: dst
              type: io.Writer
          name: NewOTLPJSONExporter
          out:
            - type: Exporter
      - func:
          doc: |-
            NewOTLPHTTPExporter returns an Exporter that encodes each snapshot as
            OTLP/JSON and POSTs it to cfg.Endpoint, which is a full URL used as-is.

            It is never registered, and it never retries — compose resilience.NewRetry
            with OTLPRetryable instead. A refused endpoint fails here, at wiring, rather
            than at the first scrape.
          forward: svcmetrics.NewOTLPHTTPExporter
          in:
            - name: name
              type: ExporterName
            - name: cfg
              type: OTLPHTTPConfig
          name: NewOTLPHTTPExporter
          out:
            - name: exporter
              type: Exporter
            - name: err
              type: error
      - func:
          doc: |-
            OTLPRetryable reports whether err is an OTLP/HTTP failure the specification
            says may be replayed: a transport fault, or HTTP 429 / 502 / 503 / 504.
            Its signature is resilience.RetryConfig.Retryable's, so it drops in without
            an adapter.
          forward: svcmetrics.OTLPRetryable
          in:
            - name: err
              type: error
          name: OTLPRetryable
          out:
            - type: bool
      - func:
          doc: RegisterExporter adds e to the process-wide exporter registry.
          forward: coremetrics.RegisterExporter
          in:
            - name: e
              type: Exporter
          name: RegisterExporter
          out:
            - type: Exporter
      - func:
          doc: Export ships snap through the exporter registered as name.
          forward: coremetrics.Export
          in:
            - name: name
              type: ExporterName
            - name: snap
              type: Snapshot
          name: Export
          out:
            - type: error
      - func:
          doc: AvailableExporters returns the sorted list of registered exporter names.
          forward: coremetrics.AvailableExporters
          name: AvailableExporters
          out:
            - type: "[]ExporterName"
    imports:
      coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
      coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcmetrics: github.com/kitsunium/sdk/internal/service/observe/metrics
    path: github.com/kitsunium/sdk/pkg/v1/observe/metrics
