            type: coremetrics.ExporterName
          - name: dst
            type: io.Writer
        name: NewOTLPJSONExporter
        out:
          - type: coremetrics.Exporter
      - in:
          - name: name
            type: coremetrics.ExporterName
          - name: dst
            type: io.Writer
        name: NewPrometheusExporter
        out:
