        name: Owning
        out:
          - type: corelogger.Logger
      - in:
          - name: lg
            type: corelogger.Logger
          - name: skip
            type: int
        name: WithCaller
        out:
          - type: corelogger.Logger
      - in:
          - name: w
            type: io.Writer
          - name: min
            type: level.Level
        name: NewTextHandler
        out:
          - name: h
            type: "*TextHandler"
          - name: err
            type: error
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      encoder: github.com/kitsunium/sdk/internal/service/observe/logger/encoder
