          - name: lg
            type: Logger
          - name: err
            type: error
      - name: Default
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - in:
          - name: path
            type: string
        name: DefaultMulti
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Debug
        variadic: true
      - in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Info
        variadic: true
      - in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Warn
        variadic: true
      - in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Error
        variadic: true
      - in:
          - name: key
          - name: val
            type: string
        name: String
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: int
        name: Int
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: bool
        name: Bool
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: float64
        name: Float64
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: int64
        name: Int64
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: uint64
        name: Uint64
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: time.Duration
        name: Duration
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: time.Time
        name: Time
        out:
          - type: Attr
      - in:
          - name: key
            type: string
          - name: val
            type: any
        name: Any
        out:
          - type: Attr
      - in:
          - name: cfg
            type: SinkConfig
        name: NewWithSink
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - in:
          - name: w
            type: io.Writer
        name: NewWriterSink
        out:
          - name: sink
            type: Sink
          - name: err
            type: error
      - name: TextEncoder
        out:
          - type: Encoder
      - in:
          - name: ctx
            type: context.Context
        name: TraceContextFromContext
        out:
          - type: TraceContext
      - name: FrameworkVersion
        out:
          - type: string
      - in:
          - name: err
            type: error
        name: WithError
        out:
          - type: "[]Attr"
      - in:
