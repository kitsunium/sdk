            recv: value
        name: TraceContextValue
        struct:
          fields:
            - name: TraceID
              type: "[TraceIDLen]byte"
            - name: SpanID
              type: "[SpanIDLen]byte"
      - name: TraceContextSource
        underlying: func(ctx context.Context) (trace TraceContextValue)
      - methods:
          - name: Kind
            out:
              - type: Kind
            recv: value
          - name: String
            out:
              - type: string
            recv: value
          - name: Int64
            out:
              - type: int64
            recv: value
          - name: Bits
            out:
              - type: packedBits
            recv: value
          - name: Uint64
            out:
              - type: uint64
            recv: value
          - name: Float64
            out:
              - type: float64
            recv: value
          - name: Bool
            out:
              - type: bool
            recv: value
          - name: Duration
            out:
              - type: time.Duration
            recv: value
          - name: Time
            out:
              - type: time.Time
            recv: value
          - name: Group
            out:
              - type: "[]AttrValue"
            recv: value
          - name: Any
            out:
              - type: any
            recv: value
        name: Value
        struct:
          unexported: true
  - constants:
      - name: SourceFieldKey
        type: string
        value: "\"source\""
    functions:
      - in:
