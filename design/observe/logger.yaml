apiVersion: kit.kitsunium/design/v2
domain: observe/logger
packages:
  - codes:
      - const:
          - doc: CodeWriterNil identifies a NewTextHandler call made with a nil io.Writer.
            name: CodeWriterNil
            note: "range: 0.3.1.0 - 0.3.1.255"
            value: "0x00_03_01_01"
        type: errs.Code
      - const:
          - doc: CodeHandlerNil identifies a New call made with a nil core.Handler.
            name: CodeHandlerNil
            value: "0x00_03_01_02"
        type: errs.Code
      - const:
          - doc: CodeEncoderNil identifies a NewHandler call made with a nil Encoder.
            name: CodeEncoderNil
            value: "0x00_03_01_03"
        type: errs.Code
      - const:
          - doc: CodeSinkRequired identifies a NewHandler call made with a nil Sink.
            name: CodeSinkRequired
            value: "0x00_03_01_04"
        type: errs.Code
      - const:
          - comment: 0.3.1.10 (serial 10)
            doc: CodeCtxCancelled identifies a Handle call whose context was already done.
            name: CodeCtxCancelled
            value: "0x00_03_01_0A"
        type: errs.Code
      - const:
          - comment: 0.3.1.20 (serial 20)
            doc: |-
              CodeWriteFailed identifies a Handle call whose underlying writer returned
              a non-nil error; ExitCode defaults to 74 (EX_IOERR) for this case.
            name: CodeWriteFailed
            value: "0x00_03_01_14"
        type: errs.Code
    constants:
      - doc: |-
          KindAny tags a Value whose payload is an unconstrained interface; handlers
          SHOULD render it via fmt.Sprintf or a "?" placeholder when the concrete
          type is not in their format table. It is also the zero-value of Kind.
        name: KindAny
        type: Kind
        value: "0"
      - doc: KindBool tags a Value carrying a boolean payload.
        name: KindBool
        type: Kind
        value: "1"
      - doc: KindDuration tags a Value carrying a time.Duration payload.
        name: KindDuration
        type: Kind
        value: "2"
      - doc: KindFloat64 tags a Value carrying a float64 payload.
        name: KindFloat64
        type: Kind
        value: "3"
      - doc: KindInt64 tags a Value carrying an int64 payload (also covers int / int32).
        name: KindInt64
        type: Kind
        value: "4"
      - doc: KindString tags a Value carrying a string payload.
        name: KindString
        type: Kind
        value: "5"
      - doc: KindTime tags a Value carrying a time.Time payload.
        name: KindTime
        type: Kind
        value: "6"
      - doc: KindUint64 tags a Value carrying an unsigned 64-bit integer payload.
        name: KindUint64
        type: Kind
        value: "7"
      - doc: |-
          KindGroup tags a Value whose payload is a slice of AttrValue, used to model
          nested groups (slog.Group) without flattening into the parent record.
        name: KindGroup
        type: Kind
        value: "8"
      - blockDoc: |-
          TraceIDLen and SpanIDLen are the byte lengths W3C Trace Context fixes for
          the two identifiers: 16 bytes of trace-id, 8 of span-id. They are not
          tunable — they are the format, not a default.
        doc: TraceIDLen is the trace identifier's length in bytes.
        name: TraceIDLen
        type: int
        value: "16"
      - blockDoc: |-
          TraceIDLen and SpanIDLen are the byte lengths W3C Trace Context fixes for
          the two identifiers: 16 bytes of trace-id, 8 of span-id. They are not
          tunable — they are the format, not a default.
        doc: SpanIDLen is the span identifier's length in bytes.
        name: SpanIDLen
        type: int
        value: "8"
      - blockDoc: |-
          TraceIDLen and SpanIDLen are the byte lengths W3C Trace Context fixes for
          the two identifiers: 16 bytes of trace-id, 8 of span-id. They are not
          tunable — they are the format, not a default.
        doc: TraceIDHexLen is the trace identifier's length in lowercase hex.
        name: TraceIDHexLen
        type: int
        value: "32"
      - blockDoc: |-
          TraceIDLen and SpanIDLen are the byte lengths W3C Trace Context fixes for
          the two identifiers: 16 bytes of trace-id, 8 of span-id. They are not
          tunable — they are the format, not a default.
        doc: SpanIDHexLen is the span identifier's length in lowercase hex.
        name: SpanIDHexLen
        type: int
        value: "16"
      - blockDoc: |-
          TraceIDKey and SpanIDKey are the field names OpenTelemetry prescribes for
          trace context in NON-OTLP log formats — "use the field names trace_id for
          the TraceId, span_id for the SpanId"
          (specification/compatibility/logging_trace_context.md). They are top-level
          keys of the record, not attributes, which is why they are rendered by the
          encoders rather than appended to RecordEvent.Attrs.
        doc: TraceIDKey is the top-level field name carrying the trace identifier.
        name: TraceIDKey
        type: string
        value: "\"trace_id\""
      - blockDoc: |-
          TraceIDKey and SpanIDKey are the field names OpenTelemetry prescribes for
          trace context in NON-OTLP log formats — "use the field names trace_id for
          the TraceId, span_id for the SpanId"
          (specification/compatibility/logging_trace_context.md). They are top-level
          keys of the record, not attributes, which is why they are rendered by the
          encoders rather than appended to RecordEvent.Attrs.
        doc: SpanIDKey is the top-level field name carrying the span identifier.
        name: SpanIDKey
        type: string
        value: "\"span_id\""
    doc: |-
      Package logger — range 0.3.1.*, the logger engine's (ADR 0005
      service/observe/logger block), declared here since ADR 0160: the engine,
      internal/service/observe/logger, returns these and declares none.

      Package logger — declares the Encoder port — the format-side
      boundary that mirrors Sink (transport-side). Both ports live in core/
      per hexagonal architecture conventions; concrete adapters live under
      internal/service/observe/logger/encoder/. See ADR 0005.

      Package logger — declares the sentinels the logger engine
      (internal/service/observe/logger) returns from its constructors and Handle
      methods. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.

      Package logger — declares the Handler interface that concrete
      implementations in sdk/internal/service satisfy. Handlers format
      RecordEvent values and write them to the backing sink.

      Package logger — declares the Kind enum that discriminates the union
      payload carried by Value. Handlers switch on Kind to select the matching
      accessor (String, Int64, Float64, …) instead of paying the cost of an
      `any` type assertion at every render call.

      Package logger — declares the Logger interface — the primary entry
      point consumers interact with. A Logger binds a Handler and exposes
      ergonomic Log / With / Enabled operations over it.

      Package logger — defines the RecordEvent value carried between
      Logger and Handler. It is an immutable snapshot of a single log event at
      the core boundary.

      Package logger — declares the Sink port — the transport-side
      boundary of the logger architecture. A Sink receives a fully formatted
      byte payload (typically produced by an Encoder) plus the originating
      RecordEvent for sinks that need structured access (CloudWatch metadata,
      S3 object tags, syslog severity mapping).

      Concrete Sink implementations live in internal/service/observe/logger/sink/<x>/
      (console, file, multi, async, route, failover, sample, recover, syslog,
      …). Encoders live in internal/service/observe/logger/encoder/. The Handler
      composes one Encoder with one Sink — see commit 7 for the genericHandler
      that wires them together.

      Package logger — declares the trace-correlation half of a log record: the
      TraceContextValue a RecordEvent carries, and the TraceContextSource port
      that reads one off a context.Context.

      The pair lives here rather than in internal/core/observe/trace because a log record
      is not a span: it borrows two identifiers from one. Keeping the value local
      keeps this package stdlib-only — importing the trace domain would put its
      whole model (and the shared core/observe/otel model behind it) in front of every
      consumer that only wants a line on stderr. The binding between the two lives at the top
      layer, in pkg/v1/observe/logger, which is allowed to know both domains. See
      ADR 0062.

      Package logger — declares the Value type — a discriminated union
      carrying the payload of an AttrValue without forcing every concrete type
      through `any`. Handlers switch on Value.Kind() to select a typed accessor
      (Int64, Float64, String, …) and skip the cost of reflection at format time.

      Storage layout: bool / int64 / uint64 / float64 / time.Duration share the
      `num` field via bit-packing (math.Float64bits for floats, two's complement
      for ints). Strings live in `str`. Time, Group and Any payloads live in
      `any`. The zero Value carries Kind == KindAny with a nil `any` payload.
    functions:
      - doc: |-
          NewValue is a generic alias of AnyValue, exposed for tooling that expects a
          New-prefixed constructor on every exported type. Prefer the typed
          constructors (StringValue, Int64Value, …) at call sites.
        in:
          - name: v
            type: any
        name: NewValue
        out:
          - type: Value
      - doc: StringValue builds a Value of kind string.
        in:
          - name: v
            type: string
        name: StringValue
        out:
          - type: Value
      - doc: |-
          Int64Value builds a Value of kind int64. int and int32 callers should widen
          to int64 at the call site.
        in:
          - name: v
            type: int64
        name: Int64Value
        out:
          - type: Value
      - doc: |-
          IntValue builds a Value of kind int64 from a plain int. Provided for caller
          ergonomy so the most common integer type does not need an explicit cast.
        in:
          - name: v
            type: int
        name: IntValue
        out:
          - type: Value
      - doc: Uint64Value builds a Value of kind uint64.
        in:
          - name: v
            type: uint64
        name: Uint64Value
        out:
          - type: Value
      - doc: Float64Value builds a Value of kind float64.
        in:
          - name: v
            type: float64
        name: Float64Value
        out:
          - type: Value
      - doc: BoolValue builds a Value of kind bool.
        in:
          - name: v
            type: bool
        name: BoolValue
        out:
          - type: Value
      - doc: |-
          DurationValue builds a Value of kind duration. Storing the int64 nanosecond
          count in bits keeps the hot path allocation-free.
        in:
          - name: v
            type: time.Duration
        name: DurationValue
        out:
          - type: Value
      - doc: |-
          TimeValue builds a Value of kind time. The time.Time payload lives in the
          any field because its locale + monotonic representation does not fit into
          num without additional storage.
        in:
          - name: v
            type: time.Time
        name: TimeValue
        out:
          - type: Value
      - doc: |-
          GroupValue builds a Value whose payload is a slice of AttrValue, modelling
          a nested attribute group. The slice is stored verbatim — callers MUST NOT
          mutate it after the Value is constructed.
        in:
          - name: attrs
            type: AttrValue
        name: GroupValue
        out:
          - type: Value
        variadic: true
      - doc: |-
          AnyValue builds a Value of KindAny carrying an arbitrary payload. Handlers
          inspect the concrete type via type assertion and fall back to "?" when the
          type is not in their format table.
        in:
          - name: v
            type: any
        name: AnyValue
        out:
          - type: Value
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
    path: github.com/kitsunium/sdk/internal/core/observe/logger
    ports:
      - doc: |-
          Encoder formats a RecordEvent into a byte slice. Implementations MUST be
          safe for concurrent use by multiple goroutines and SHOULD avoid allocating
          beyond the caller-supplied buffer (typically borrowed from the
          kernel/concur/buffer pool) so the encoding step itself does not allocate.
        methods:
          - doc: |-
              Name returns the canonical encoder identifier ("text", "ndjson",
              "json"). Useful for diagnostic dumps and metrics tagging.
            name: Name
            out:
              - name: name
                type: string
          - doc: |-
              Append serialises r onto dst and returns the (possibly re-allocated)
              buffer. groups carries the active group prefix stack — encoders are
              responsible for rendering it as their format-specific prefix
              ("g1.g2.key" for text, nested objects for JSON).
            in:
              - name: dst
                type: "[]byte"
              - name: groups
                type: "[]string"
              - name: r
                type: RecordEvent
            name: Append
            out:
              - name: out
                type: "[]byte"
        name: Encoder
      - doc: |-
          Handler formats and emits RecordEvent values produced by a Logger.
          Implementations MUST be safe for concurrent use by multiple goroutines.
        methods:
          - doc: |-
              Enabled reports whether the handler would emit a record at the given
              level, allowing callers to skip expensive attribute construction.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: RecordEvent
            name: Enabled
            out:
              - name: enabled
                type: bool
          - doc: |-
              Handle formats and writes a RecordEvent. Returning a non-nil error
              signals a sink failure; the Logger may drop the record regardless.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: RecordEvent
            name: Handle
            out:
              - name: err
                type: error
          - doc: |-
              WithAttrs returns a derived Handler that prepends the given attrs to
              every subsequent RecordEvent. The receiver MUST NOT be mutated.
            in:
              - name: attrs
                type: "[]AttrValue"
            name: WithAttrs
            out:
              - name: child
                type: Handler
          - doc: |-
              WithGroup returns a derived Handler that namespaces every subsequent
              attribute key under the given group name (rendered as "group.key"
              for text handlers, or as a nested object for structured handlers).
              An empty name MUST be treated as a no-op so callers can pass user
              input without guarding it.
            in:
              - name: name
                type: string
            name: WithGroup
            out:
              - name: child
                type: Handler
        name: Handler
      - doc: |-
          Logger is the primary logging interface. Implementations MUST be safe for
          concurrent use by multiple goroutines.
        methods:
          - doc: |-
              Log emits a RecordEvent at the given level with the supplied message
              and attrs. Implementations SHOULD short-circuit when Enabled returns
              false to avoid unnecessary formatting work.
            in:
              - name: ctx
                type: context.Context
              - name: lv
                type: level.Level
              - name: msg
                type: string
              - name: attrs
                type: AttrValue
            name: Log
            variadic: true
          - doc: |-
              With returns a derived Logger whose emitted records always include the
              supplied attrs. The receiver MUST NOT be mutated.
            in:
              - name: attrs
                type: AttrValue
            name: With
            out:
              - name: child
                type: Logger
            variadic: true
          - doc: |-
              WithGroup returns a derived Logger whose subsequent attributes are
              namespaced under the given group name. Empty names MUST be a no-op.
            in:
              - name: name
                type: string
            name: WithGroup
            out:
              - name: child
                type: Logger
          - doc: Enabled reports whether a record at the given level would be emitted.
            in:
              - name: ctx
                type: context.Context
              - name: lv
                type: level.Level
            name: Enabled
            out:
              - name: enabled
                type: bool
        name: Logger
      - doc: |-
          Sink is the transport port consumed by the generic Handler. Implementations
          MUST be safe for concurrent use by multiple goroutines and SHOULD assume
          their own concurrency model (mutex / lock-free / batched flush) so the
          Handler can stay encoder-agnostic. Sinks that need the severity level read
          it directly from r.Level — the port is intentionally kept narrow.
        methods:
          - doc: |-
              Write delivers the formatted byte payload p plus the originating record
              to the underlying transport. Sinks MAY ignore p and re-serialise from
              r when their wire protocol differs from the encoder's output (e.g. a
              CloudWatch sink reads r.Time directly to populate the AWS request).
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: RecordEvent
              - name: p
                type: "[]byte"
            name: Write
            out:
              - name: "n"
                type: int
              - name: err
                type: error
          - doc: Flush forces any buffered records out. A no-op for synchronous sinks.
            in:
              - name: ctx
                type: context.Context
            name: Flush
            out:
              - name: err
                type: error
          - doc: |-
              Close releases any resources held by the sink (file descriptors, AWS
              clients, network connections). Sinks MAY refuse subsequent Writes
              after Close returns; callers MUST NOT use the sink after closing it.
            name: Close
            out:
              - name: err
                type: error
        name: Sink
    sentinels:
      - var:
          - code: CodeWriterNil
            doc: WriterNil is returned when NewTextHandler receives a nil io.Writer.
            name: WriterNil
            private: service/observe/logger.NewTextHandler called with nil io.Writer
            public: Log handler requires a non-nil writer
            reason: WRITER_NIL
          - code: CodeHandlerNil
            doc: HandlerNil is returned when New receives a nil Handler.
            name: HandlerNil
            private: service/observe/logger.New called with nil Handler
            public: Logger requires a non-nil handler
            reason: HANDLER_NIL
          - code: CodeEncoderNil
            doc: EncoderNil is returned when NewHandler receives a nil Encoder.
            name: EncoderNil
            private: service/observe/logger.NewHandler called with nil Encoder
            public: Logger handler requires a non-nil encoder
            reason: ENCODER_NIL
          - code: CodeSinkRequired
            doc: SinkRequired is returned when NewHandler receives a nil Sink.
            name: SinkRequired
            private: service/observe/logger.NewHandler called with nil Sink
            public: Logger handler requires a non-nil sink
            reason: SINK_REQUIRED
          - code: CodeCtxCancelled
            doc: CtxCancelled wraps a cancelled context at Handle time.
            name: CtxCancelled
            private: service/observe/logger.TextHandler.Handle invoked with cancelled context
            public: Logging aborted due to cancellation
            reason: CTX_CANCELLED
          - code: CodeWriteFailed
            doc: WriteFailed wraps the underlying writer's error at Handle time.
            name: WriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: service/observe/logger.TextHandler.Handle underlying writer returned an error
            public: Log write failed
            reason: WRITE_FAILED
    types:
      - decl: true
        doc: |-
          Kind discriminates the payload variant carried by a Value. Kind values are
          stable across the public API; new variants are appended at the end so old
          handlers default to KindAny rather than panic on an unknown discriminant.
        methods:
          - doc: |-
              String returns the lowercase textual label associated with the Kind
              receiver, suitable for diagnostic dumps and golden test fixtures.
              "string", "time", "uint64", "group" — or "unknown" for future variants.
            name: String
            out:
              - type: string
            recv: value
        name: Kind
        underlying: int8
      - decl: true
        doc: |-
          RecordEvent captures a single log event; handlers are responsible for writing
          or forwarding it. Instances are intended to be used read-only after
          construction by the Logger implementation.
        name: RecordEvent
        struct:
          fields:
            - doc: Time is the instant the event occurred; zero means "fill in at handle time".
              name: Time
              type: time.Time
            - doc: Level is the severity of the event.
              name: Level
              type: level.Level
            - doc: Message is the human-readable description of the event.
              name: Message
              type: string
            - doc: |-
                PC is the program counter captured at the Log call site (via
                runtime.Callers). Zero means "no caller information available";
                handlers SHOULD resolve PC into a frame lazily at format time.
              name: PC
              type: uintptr
            - doc: Attrs carries the structured key/value pairs attached to this event.
              name: Attrs
              type: "[]AttrValue"
            - doc: |-
                TraceContext is the identity of the span this event was emitted
                inside; the zero value means "no trace here" and MUST render nothing.
                It is a FIELD rather than two entries in Attrs because the Encoder
                port receives no context.Context — the identity has to travel on the
                record to reach the formatter at all — and because OpenTelemetry
                prescribes trace_id / span_id as TOP-LEVEL keys of the log object,
                which an attribute cannot be: WithGroup would prefix it. See ADR 0062.
              name: TraceContext
              type: TraceContextValue
      - decl: true
        doc: |-
          AttrValue is an immutable key/value pair carried by a RecordEvent. Use the
          typed Value constructors (StringValue, Int64Value, …) to build the Value
          field — the zero Value is a valid KindAny carrying nil.
        name: AttrValue
        struct:
          fields:
            - doc: Key identifies the attribute in the output line.
              name: Key
              type: string
            - doc: Value carries the typed payload; handlers dispatch on Value.Kind().
              name: Value
              type: Value
      - decl: true
        doc: |-
          TraceContextValue is the trace correlation a single log record carries: the
          identity of the span the record was emitted inside.

          It is a VALUE and carries no flags and no tracestate, because a log line
          answers exactly one question — "which span produced this?" — and the
          sampling decision that governs the trace is not a property of the line.

          The zero value is the INVALID context, deliberately: an all-zero trace-id is
          what W3C Trace Context §3.2.2.3 declares invalid, and an all-zero span-id is
          §3.2.2.4's. So "no trace here" and "a trace nobody may join" are one value
          with one spelling, and every consumer has exactly one check to make.
        methods:
          - doc: |-
              IsValid reports whether the pair names a span a backend can join: both
              identifiers present and non-zero.

              Both are required rather than either, and that follows the data model rather
              than convenience: "if a SpanId is provided, the corresponding TraceId should
              also be included" (specification/logs/data-model.md, Trace Context Fields).
              The only producer in this SDK is a W3C span context, which is itself invalid
              unless both identifiers are set, so a half-populated pair never reaches an
              encoder through a supported path — and if one is forged by hand, emitting
              half of it would produce a field no query can join on.
            name: IsValid
            out:
              - type: bool
            recv: value
          - doc: |-
              AppendTraceIDHex appends the trace identifier to dst as 32 LOWERCASE hex
              digits and returns the extended buffer.

              The spelling is normative — "Trace IDs and span IDs must be lowercase and
              hex-encoded" (specification/compatibility/logging_trace_context.md) — and
              three formatters (the text encoder, the JSON encoder and the legacy text
              handler) have to agree on it byte for byte, which is why it lives beside the
              value rather than three times over in internal/service/observe/logger.

              It appends and never returns a string: a string would be one heap allocation
              per emitted record, and the logger's one-allocation-per-emit contract has no
              room for a second. See ADR 0062 and pkg/v1/observe/logger/BENCH.md.
            in:
              - name: dst
                type: "[]byte"
            name: AppendTraceIDHex
            out:
              - type: "[]byte"
            recv: value
          - doc: |-
              AppendSpanIDHex appends the span identifier to dst as 16 lowercase hex
              digits and returns the extended buffer. Same contract as AppendTraceIDHex.
            in:
              - name: dst
                type: "[]byte"
            name: AppendSpanIDHex
            out:
              - type: "[]byte"
            recv: value
        name: TraceContextValue
        struct:
          fields:
            - doc: TraceID identifies the whole trace; rendered as 32 lowercase hex digits.
              name: TraceID
              type: "[TraceIDLen]byte"
            - doc: SpanID identifies the span within the trace; 16 lowercase hex digits.
              name: SpanID
              type: "[SpanIDLen]byte"
      - decl: true
        doc: |-
          TraceContextSource reads the trace context carried by ctx.

          It is a FUNC port, so ADR 0039 is satisfied structurally: a func type cannot
          grow a method, so publishing it can never break a downstream implementation.
          It returns the zero (invalid) value rather than an error or an ok flag —
          running outside a trace is the normal state of most code, not a fault, and
          IsValid is the single question every caller already has to ask.

          Implementations MUST NOT allocate: they run once per emitted record.
        name: TraceContextSource
        underlying: func(ctx context.Context) (trace TraceContextValue)
      - doc: |-
          Value is an immutable discriminated payload attached to an AttrValue. Use
          the documented constructors (StringValue / Int64Value / …) to obtain a
          well-formed instance — the zero value is a valid KindAny carrying nil.
        methods:
          - doc: |-
              Kind returns the discriminator for this Value, indicating which typed
              accessor (String / Int64 / Float64 / …) handlers should call.
            name: Kind
            out:
              - type: Kind
            recv: value
          - doc: |-
              String returns the textual payload when the Value carries KindString; for
              any other Kind it returns an empty string. Handlers that need a stringified
              rendering of non-string Kinds MUST format from the typed accessor instead.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Int64 returns the int64 payload. The result is undefined when Kind is not
              KindInt64; callers MUST guard with Kind() before calling this accessor.
            name: Int64
            out:
              - type: int64
            recv: value
          - doc: |-
              Bits returns the raw uint64 storage that backs all bit-packed Kinds
              (KindBool / KindInt64 / KindUint64 / KindFloat64 / KindDuration). Callers
              SHOULD prefer the typed accessors; Bits exists for tooling and tests that
              need direct access to the packed storage.
            name: Bits
            out:
              - type: packedBits
            recv: value
          - doc: |-
              Uint64 returns the uint64 payload. The result is undefined when Kind is not
              KindUint64; callers MUST guard with Kind() before calling this accessor.
            name: Uint64
            out:
              - type: uint64
            recv: value
          - doc: |-
              Float64 returns the float64 payload. The result is undefined when Kind is
              not KindFloat64; callers MUST guard with Kind() before calling this
              accessor.
            name: Float64
            out:
              - type: float64
            recv: value
          - doc: |-
              Bool returns the boolean payload. The result is undefined when Kind is not
              KindBool; callers MUST guard with Kind() before calling this accessor.
            name: Bool
            out:
              - type: bool
            recv: value
          - doc: |-
              Duration returns the time.Duration payload. The result is undefined when
              Kind is not KindDuration; callers MUST guard with Kind() before calling
              this accessor.
            name: Duration
            out:
              - type: time.Duration
            recv: value
          - doc: |-
              Time returns the time.Time payload. The result is undefined when Kind is
              not KindTime; callers MUST guard with Kind() before calling this accessor.
              A nil any field decodes as the zero time.Time.
            name: Time
            out:
              - type: time.Time
            recv: value
          - doc: |-
              Group returns the nested AttrValue slice. The result is undefined when
              Kind is not KindGroup; callers MUST guard with Kind() before calling this
              accessor. A nil any field decodes as a nil slice.
            name: Group
            out:
              - type: "[]AttrValue"
            recv: value
          - doc: |-
              Any returns the opaque payload for KindAny. For typed Kinds the return is
              nil — callers should call the typed accessor instead.
            name: Any
            out:
              - type: any
            recv: value
        name: Value
        struct:
          unexported: true
  - constants:
      - doc: |-
          SourceFieldKey is the attribute key under which the resolved caller location
          is emitted. Encoders render it like any other string attribute, so both the
          text and JSON encoders honour it without modification.
        name: SourceFieldKey
        type: string
        value: "\"source\""
    doc: |-
      Package logger — declares the chainable Builder API — the low-allocation
      hot path for callers that care about per-call cost. Pulled from a
      recycler.Pool[*chainBuilder], the builder accumulates attrs without
      allocating beyond the pre-sized scratchpad and returns to the pool on
      Send. It is NOT allocation-free end to end: the handler clones the
      accumulated attrs on every Send, so exactly one slice escapes per emit
      (see pkg/v1/observe/logger/BENCH.md).

      Package logger — declares genericHandler — the corelogger.Handler
      implementation that composes an Encoder (format) with a Sink (transport).
      It replaces the legacy TextHandler that fused both responsibilities into
      one struct, and ships as the single Handler the service layer offers.

      Package logger — wires a core.Handler into a core.Logger. It
      provides the thin loggerImpl that routes Log calls through the Handler's
      Enabled fast-path and honours With-derived attrs via copy-on-write.

      Package logger — a Logger that owns the writers it was built over, and the
      one call that releases them.

      Package logger — declares the recycled event-record bucket consumed
      by the Builder API. Pulling RecordEvent values from a recycler.Pool
      removes the builder and scratchpad allocations from the hot path; the
      handler still clones the accumulated attrs on every Send, so the
      steady-state cost is ONE heap allocation per emit, not zero. Combined
      with the kind-discriminated Value union the remaining per-call cost is
      dominated by the encoder + sink rather than GC pressure.

      Package logger — declares the sourceHandler decorator — a Handler
      middleware that resolves the RecordEvent.PC captured by the front-end into a
      structured "source" attribute (file:line:function) before delegating to the
      wrapped Handler. It is additive and opt-in: the record shape is unchanged
      until a caller wraps a Logger via WithCaller, and resolution is stdlib-only
      (runtime.CallersFrames).

      Package logger — implements the TextHandler — a concrete
      core.Handler that renders RecordEvent values as
      "TIME LEVEL msg key=val..." and writes the bytes to an io.Writer under a
      mutex. It composes the kernel/concur/buffer pool and kernel/clock abstraction so
      that tests can drive it deterministically.
    functions:
      - doc: |-
          NewHandler composes enc with sink and gates emission on the supplied
          minimum level. A nil enc OR sink is rejected so callers cannot
          accidentally construct a dead handler.
        in:
          - name: enc
            type: encoder.Encoder
          - name: sink
            type: corelogger.Sink
          - name: min
            type: level.Level
        name: NewHandler
        out:
          - name: h
            type: corelogger.Handler
          - name: err
            type: error
      - doc: New wraps a core.Handler inside a core.Logger with no trace correlation.
        in:
          - name: h
            type: corelogger.Handler
        name: New
        out:
          - name: lg
            type: corelogger.Logger
          - name: err
            type: error
      - doc: |-
          NewWithTraceContext wraps a core.Handler inside a core.Logger that stamps
          every emitted record with the trace context src reads off the caller's
          context.

          src is a port, not an import: this package never learns which propagation
          carries the span, so internal/service/observe/logger keeps zero edges to any other
          service-layer domain. pkg/v1/observe/logger binds it to the trace domain. A nil src
          is the documented "no correlation" wiring and costs nothing per emit.
        in:
          - name: h
            type: corelogger.Handler
          - name: src
            type: corelogger.TraceContextSource
        name: NewWithTraceContext
        out:
          - name: lg
            type: corelogger.Logger
          - name: err
            type: error
      - doc: |-
          Build is the package-level entry point that returns a chainable Builder
          bound to lg at the supplied level. It type-asserts lg to the concrete
          loggerImpl created by New; foreign Logger implementations get nil so
          callers detect the misconfiguration immediately.
          IFACE-PLUGIN: returns the chainable Builder contract so callers depend on
          the fluent API surface rather than the recycled concrete type.
        in:
          - name: lg
            type: corelogger.Logger
          - name: lv
            type: level.Level
        name: Build
        out:
          - type: Builder
      - doc: |-
          LogAttrs is the package-level entry point for the slice-overload of Log.
          It mirrors Build by routing through the concrete loggerImpl.
        in:
          - name: ctx
            type: context.Context
          - name: lg
            type: corelogger.Logger
          - name: lv
            type: level.Level
          - name: msg
            type: string
          - name: attrs
            type: "[]corelogger.AttrValue"
        name: LogAttrs
      - doc: |-
          Owning returns lg carrying owned as the resources it owns, so that Close
          releases them.

          It exists for a constructor that OPENS writers on its caller's behalf —
          pkg/v1/observe/logger.NewMulti resolves each spec through the writer registry, so the
          caller never holds a Sink it could close — and hands back a Logger that was
          otherwise the only thing referring to them. Without it those files were held
          until a collection ran their finalizers: a descriptor leak for a program that
          rebuilds its logger, and on Windows a log file nothing could delete or rotate
          while the process lived (ADR 0095).

          The result is still this package's concrete Logger, so Build and LogAttrs
          keep their fast path. A Logger this package did not build is returned
          unchanged — it has no Close to carry the resources to.
        in:
          - name: lg
            type: corelogger.Logger
          - name: owned
            type: io.Closer
        name: Owning
        out:
          - type: corelogger.Logger
      - doc: |-
          WithCaller returns a derived Logger whose emitted records carry a "source"
          attribute resolving the captured call-site program counter into
          file:line:function. The skip argument is the extra stack-frame offset
          reserved for wrapper layers; pass 0 for direct callers. Foreign Logger
          implementations (not produced by New) are returned unchanged so callers fail
          safe rather than losing their logger. A nil Logger is returned as-is.
        in:
          - name: lg
            type: corelogger.Logger
          - name: skip
            type: int
        name: WithCaller
        out:
          - type: corelogger.Logger
      - doc: |-
          NewTextHandler constructs a TextHandler that writes to w and filters records
          strictly below min. The returned handler uses the real system clock.
        in:
          - name: w
            type: io.Writer
          - name: min
            type: level.Level
        name: NewTextHandler
        out:
          - name: h
            type: "*TextHandler"
          - name: err
            type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      encoder: github.com/kitsunium/sdk/internal/service/observe/logger/encoder
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
    path: github.com/kitsunium/sdk/internal/service/observe/logger
    types:
      - decl: true
        doc: |-
          Builder is the chainable interface returned by Logger.Build. Every typed
          accessor (Str / Int / Bool / …) returns the receiver so callers compose
          the chain in a single expression. Send terminates the chain by emitting
          the accumulated record through the underlying handler and returns the
          builder to the recycler — callers MUST NOT use the builder after Send.
        interface:
          methods:
            - doc: Str appends a string attribute.
              in:
                - name: key
                - name: val
                  type: string
              name: Str
              out:
                - type: Builder
            - doc: Int appends an int attribute (widened to int64 internally).
              in:
                - name: key
                  type: string
                - name: val
                  type: int
              name: Int
              out:
                - type: Builder
            - doc: Int64 appends an int64 attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: int64
              name: Int64
              out:
                - type: Builder
            - doc: Uint64 appends a uint64 attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: uint64
              name: Uint64
              out:
                - type: Builder
            - doc: Bool appends a boolean attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: bool
              name: Bool
              out:
                - type: Builder
            - doc: Float64 appends a float64 attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: float64
              name: Float64
              out:
                - type: Builder
            - doc: Duration appends a time.Duration attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: time.Duration
              name: Duration
              out:
                - type: Builder
            - doc: Time appends a time.Time attribute.
              in:
                - name: key
                  type: string
                - name: val
                  type: time.Time
              name: Time
              out:
                - type: Builder
            - doc: Any appends an opaque attribute; handlers degrade unrecognised types to "?".
              in:
                - name: key
                  type: string
                - name: val
                  type: any
              name: Any
              out:
                - type: Builder
            - doc: Send terminates the chain by emitting the accumulated record.
              in:
                - name: ctx
                  type: context.Context
                - name: msg
                  type: string
              name: Send
        name: Builder
      - decl: true
        doc: |-
          TextHandler is a core.Handler that renders records as a single plain-text
          line per event. It is safe for concurrent use via an internal mutex.
        methods:
          - doc: |-
              Enabled reports whether the handler would emit a record at r.Level, taking
              context cancellation into account.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: corelogger.RecordEvent
            name: Enabled
            out:
              - type: bool
            recv: pointer
          - doc: |-
              WithAttrs returns a derived TextHandler sharing the writer but owning a new
              attrs slice that prepends the given attributes to every record.
            in:
              - name: attrs
                type: "[]corelogger.AttrValue"
            name: WithAttrs
            out:
              - type: corelogger.Handler
            recv: pointer
          - doc: |-
              WithGroup returns a derived TextHandler that namespaces every subsequent
              attribute key under the given group name (rendered as "name.key").
            in:
              - name: name
                type: string
            name: WithGroup
            out:
              - type: corelogger.Handler
            recv: pointer
          - doc: Handle formats and writes a RecordEvent to the underlying io.Writer.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: corelogger.RecordEvent
            name: Handle
            out:
              - type: error
            recv: pointer
        name: TextHandler
        struct:
          fields:
            - doc: w is the backing sink; writes are serialised through mu.
              name: w
              type: io.Writer
            - doc: mu serialises Write calls so concurrent goroutines emit atomic lines.
              name: mu
              type: sync.Mutex
            - doc: attrs are prepended to every RecordEvent emitted through this handler.
              name: attrs
              type: "[]corelogger.AttrValue"
            - doc: |-
                groups carries the active group prefix stack (outermost first); each
                emitted attribute key is rendered as "g1.g2.….key" in the line.
              name: groups
              type: "[]string"
            - doc: min is the minimum level the handler emits; records below are dropped.
              name: min
              type: level.Level
            - doc: clk sources the timestamp when RecordEvent.Time is the zero value.
              name: clk
              type: clock.Clock
  - aliases:
      - doc: |-
          Encoder is the format-side port now rooted in internal/core/observe/logger.
          Kept as an alias here so consumers that import service/observe/logger/encoder
          for the interface type keep compiling. New code should import the
          canonical type from core/observe/logger directly.
        name: Encoder
        target: corelogger.Encoder
    constants:
      - doc: |-
          ReservedPrefix is what a TOP-LEVEL attribute whose key the SDK reserves is
          rendered under, so the two never collide on one line. The whole namespace
          under it is reserved with it — see [ReservesKey].
        name: ReservedPrefix
        type: string
        value: "\"attr.\""
    doc: |-
      Package encoder provides concrete Encoder implementations (Text today;
      NDJSON and JSON to land in follow-up commits). The Encoder interface
      itself lives in internal/core/observe/logger — this package is implementation-
      only, exposing the interface via a type alias so existing call sites
      that import "service/observe/logger/encoder".Encoder keep compiling.

      Per ADR 0005 hexagonal layering: core/ holds ports, service/ holds
      adapters. Previously Encoder lived here, creating an asymmetry where
      Sink lived in core/ and Encoder lived in service/ even though both are
      ports of the Handler.

      Package encoder — implements jsonEncoder, the structured single-line JSON
      encoder that renders a record as one encoding/json-compatible object per
      line: {"ts":…,"level":…,"msg":…,<flat attrs>}\n. Lives beside the text
      encoder so the format and the transport (Sink) evolve independently. The
      byte writer is hand-rolled (append-based, no reflection, no json.Marshal)
      so the hot path stays allocation-free.

      Package encoder — implements TextEncoder, the default human-readable
      encoder that renders a record as "TIME LEVEL msg key=val key=val …\n".
      Lives in its own package so the format and the transport (Sink) can
      evolve independently.

      Package encoder — renders the record timestamp, the one field every encoded
      line carries and the single most expensive thing either encoder does.

      A CPU profile of a bare emit attributed 34.6 % of the WHOLE call —
      builder, handler, encoder and sink together — to time.Time.AppendFormat,
      with time.nextStdChunk and time.appendInt the two largest flat entries under
      it. That is the generic formatter re-parsing the layout string, chunk by
      chunk, on every single log record, to reach a result that never varies in
      shape. appendTimestamp writes the same bytes with fixed offsets instead, and
      is measured at 6.0× the stdlib call on a UTC instant and 5.0× on an offset
      zone — `BenchmarkAppendTimestamp{,Zoned}` against their `…Stdlib` controls,
      reported in internal/service/observe/logger/encoder/BENCH.md §5.2.

      It is a REPLACEMENT for one exact layout, not a general formatter: anything
      it cannot render identically falls back to AppendFormat rather than
      approximating. TestAppendTimestampMatchesAppendFormat pins the equivalence
      across four zones and a hundred thousand instants each.
    functions:
      - doc: |-
          ReservesKey reports whether a TOP-LEVEL attribute key must be renamed under
          [ReservedPrefix]: the two the SDK emits as fields of its own — trace_id and
          span_id, the correlation OpenTelemetry prescribes and ADR 0062 writes on
          every record emitted inside a span — and anything already in the reserved
          namespace.

          Two members of one JSON object cannot both be "trace_id" — a decoder keeps
          one of them, and which one is the decoder's business — so an attribute
          carrying that key beside the SDK's field could replace the correlation on the
          way in, and could carry a value from anywhere. It is renamed rather than
          dropped: nothing a caller logged is lost, and nothing it logged can be
          mistaken for the span this line came from.

          The namespace is reserved WITH the two keys because the rename has to be
          injective, and prefixing alone is not: a caller logging both trace_id and a
          literal attr.trace_id would otherwise land both on "attr.trace_id" and the
          ambiguity would survive one name over. Prefixing anything already inside the
          namespace makes the mapping one-to-one — attr.trace_id becomes
          attr.attr.trace_id — so two distinct keys always render distinct.

          Inside a group the key is already prefixed ("http.trace_id"), so it cannot
          collide and is left alone.
        in:
          - name: key
            type: string
        name: ReservesKey
        out:
          - type: bool
      - doc: |-
          NewJSON builds an Encoder that renders records as single-line JSON. Pass
          clock.System for production use; tests inject a fake clock. A nil clock
          falls back to the real wall clock so callers can pass clock.System or nil
          interchangeably.
          IFACE-PLUGIN: returns the Encoder contract so callers depend on the
          public surface; the concrete jsonEncoder is intentionally hidden.
        in:
          - name: clk
            type: clock.Clock
        name: NewJSON
        out:
          - type: Encoder
      - doc: |-
          NewText builds an Encoder bound to the supplied clock. Pass clock.System
          for production use; tests inject a fake clock. A nil clock falls back to
          the real wall clock so callers can pass clock.System or nil interchangeably.
          IFACE-PLUGIN: returns the Encoder contract so callers depend on the
          public surface; the concrete textEncoder is intentionally hidden.
        in:
          - name: clk
            type: clock.Clock
        name: NewText
        out:
          - type: Encoder
      - doc: |-
          AppendSanitized copies text onto dst replacing '\n', '\r', and NUL
          with a single space so the content can never inject a new frame in a
          line-framed downstream sink. Other control characters are preserved to
          keep the rendering faithful; only framing-sensitive bytes are stripped.
          It scrubs every attacker-influenceable textual field — the Message, group
          names, and attribute keys — not just the Message (V110).

          It is exported for one caller outside this package: the legacy
          service/observe/logger.TextHandler, which renders the same line shape without going
          through an Encoder. That handler once appended all three fields verbatim —
          the scrub existed, but only here — so a line break in any of them forged a
          log line. One function shared by both renderers cannot drift from itself.
        in:
          - name: dst
            type: "[]byte"
          - name: text
            type: string
        name: AppendSanitized
        out:
          - type: "[]byte"
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
    path: github.com/kitsunium/sdk/internal/service/observe/logger/encoder
  - constants:
      - doc: |-
          KindSymlink is the value of the "kind" field both symlink refusals carry —
          the policy one in RefuseSymlink and the kernel one ExplainOpenFailure
          diagnoses. One sentinel per sink serves every open failure, so the field is
          what lets a consumer tell "someone put a link at my log path" apart from a
          full disk, at whichever of the two points caught it.
        name: KindSymlink
        type: string
        value: "\"symlink\""
    doc: |-
      Package logfile is the hardened open both file sinks share: the append-only
      sink in internal/service/observe/logger/sink/file and the rotating one in
      internal/service/observe/logger/writer/rotfile, which re-runs it on every reopen after a
      rotation. A path whose final component is a symbolic link is refused twice —
      by an os.Lstat BEFORE the open (policy) and by O_NOFOLLOW AT the open where
      the kernel has it (the TOCTOU window the check leaves) — and both refusals
      name the indirection the same way, so an operator reading one line can tell
      a planted link from a full disk (CWE-59).

      Both sinks carried a copy of all of it; the copies differed in nothing but
      their error code and their wording (OPEN_FAILED 0.3.14.* for the sink,
      ROT_FILE_OPEN_FAILED for rotfile). Those are what this package does not own:
      a sink hands it a RefusalSpec carrying its two wraps, and every refusal leaves
      under that sink's code, in its words. It declares no code.

      Package logfile — the fallback openFlags for the platforms whose syscall
      package has no O_NOFOLLOW at all: windows, plan9, js/wasm — and wasip1, which
      has the constant but not a kernel behind it (see open_flags_unix.go for why
      it is here rather than there).

      On these platforms the symlink refusal is RefuseSymlink's os.Lstat and
      NOTHING ELSE, so the window between that check and the os.OpenFile that
      follows it is open. That is a real difference in protection and it is
      written down in the CLAUDE.md platform tables (this package's and each
      sink's) rather than smoothed over: a table claiming uniform protection would
      be worse than no table.

      Closing it here needs a different primitive, not a different flag — Windows
      has FILE_FLAG_OPEN_REPARSE_POINT, which OPENS the link and requires the
      handle to be rejected afterwards, the opposite shape from a failing open
      (ADR 0082 §D2 measured both for internal/service/app/lock). That is a separate
      piece of work and is named as one; this file does not pretend to be it.

      Package logfile — the Unix half of openFlags: the kernel is asked not to
      traverse an indirection at the log path, so a symbolic link planted in the
      window between RefuseSymlink's os.Lstat and the os.OpenFile that follows it
      fails the open instead of silently redirecting the sink (CWE-59) — at
      construction of either file sink, and on every reopen after a rotation.

      # Why the tag is `unix` and not a list of six GOOS

      The capability class is "the pinned toolchain's syscall package defines
      O_NOFOLLOW", and `unix` is the class the toolchain itself declares. Measured
      on go1.27.1 — the toolchain this repo resolves — by compiling
      `const _ = syscall.O_NOFOLLOW` as a LIBRARY package (never linked, so cgo and
      PIE link rules cannot mask the only question being asked) for all 47
      GOOS/GOARCH pairs of `go tool dist list`. All 39 pairs the `unix` tag selects
      compile it:

      	aix/ppc64, android/{386,amd64,arm,arm64}, darwin/{amd64,arm64},
      	dragonfly/amd64, freebsd/{386,amd64,arm,arm64}, illumos/amd64,
      	ios/{amd64,arm64}, linux/{386,amd64,arm,arm64,loong64,mips,mips64,
      	mips64le,mipsle,ppc64,ppc64le,riscv64,s390x}, netbsd/{386,amd64,arm,arm64},
      	openbsd/{386,amd64,arm,arm64,ppc64,riscv64}, solaris/amd64

      The other 8 pairs are js/wasm, plan9/{386,amd64,arm},
      windows/{386,amd64,arm64} and wasip1/wasm. Seven of them genuinely lack the
      constant; wasip1 has it and is excluded anyway, for the reason at the end of
      this comment. All eight take open_flags_other.go.

      A list of six GOOS would have been a second place to maintain the same fact,
      and its failure mode is the wrong way round: a Unix port Go adds later would
      silently land in the weaker fallback. With `unix`, a Unix port WITHOUT
      O_NOFOLLOW breaks the build instead — loud, which is what a security control
      should be when its premise stops holding. That is ADR 0018 §(c)'s rule
      applied (a missing kernel ABI constant is split by build tag, never guarded
      at runtime) and ADR 0018 §(a)'s `_unix.go` suffix, "the shared Unix mechanic".

      wasip1 is deliberately NOT here although it defines O_NOFOLLOW = 0400: there
      it is not a kernel flag but a lookupflag, `path_open` called without
      LOOKUP_SYMLINK_FOLLOW (go1.27.1 src/syscall/fs_wasip1.go:574), so the refusal
      belongs to whichever WASI host runs the module. No lane in this repository
      runs one, so claiming the protection there would be a claim nothing here can
      check. It takes the fallback and the CLAUDE.md table says so by name.
    functions:
      - doc: |-
          Open refuses a pre-existing symlink at path, then opens it for appending —
          O_APPEND|O_CREATE|O_WRONLY, plus O_NOFOLLOW on every Unix — creating it with
          perm. It is the single hardening entry point, so the checks run identically
          at a sink's construction AND on every reopen after a rotation: no path into
          a log file is weaker than another.

          The two refusals are not redundant. RefuseSymlink is a check and therefore
          has a window after it; openFlags carries O_NOFOLLOW on every Unix so the
          kernel refuses inside that window (open_flags_unix.go, and
          open_flags_other.go for the platforms where the check is all there is).
          Neither covers a symbolic link at a PARENT component; each sink's "do NOT
          place the log file under an attacker-writable directory" pre-condition does.

          The caller owns the returned descriptor.
        in:
          - name: path
            type: string
          - name: perm
            type: os.FileMode
          - name: refusals
            type: "*RefusalSpec"
        name: Open
        out:
          - name: file
            type: "*os.File"
          - name: err
            type: error
      - doc: |-
          RefuseSymlink returns the sink's policy refusal when path's final component
          is a symbolic link, and nil otherwise. os.Lstat does NOT traverse the final
          component, so a link that is already there is caught before OpenFile can
          follow it; an absent path or a stat error passes through, so the OpenFile
          that follows surfaces the real diagnostic uniformly.
        in:
          - name: path
            type: string
          - name: refusal
            type: "*errs.WrapParams"
        name: RefuseSymlink
        out:
          - type: error
      - doc: |-
          ExplainOpenFailure wraps a failed open under the sink's open refusal and
          adds what an os.Lstat can still say about path.

          That Lstat is DIAGNOSIS and never the decision. The refusal was already taken
          one line earlier, by the kernel, so a planter who removes the link between
          the two calls changes which field this error carries and cannot change
          whether the open was refused. It is the opposite situation from
          RefuseSymlink, which runs BEFORE the open and is a check the flag exists to
          back up — the same distinction internal/service/app/lock draws in
          classifyOpenFailure (ADR 0082 §D4).

          The errno is deliberately not consulted. O_NOFOLLOW reports a planted link as
          ELOOP on linux, openbsd and darwin, EMLINK on freebsd and dragonfly, and
          EFTYPE on netbsd; a three-value table across six kernels is the shape of
          thing that is wrong on the seventh, and there is nothing to branch on anyway
          since both refusals share one sentinel per sink.
        in:
          - name: path
            type: string
          - name: openErr
            type: error
          - name: refusal
            type: "*errs.WrapParams"
        name: ExplainOpenFailure
        out:
          - type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/service/observe/logger/internal/logfile
    types:
      - decl: true
        doc: |-
          RefusalSpec is one sink's error vocabulary for the hardened open: the wrap a
          policy refusal leaves under, and the wrap a failed os.OpenFile does. Each
          carries the sink's own code, reason and wording, and a sink declares its
          RefusalSpec once, as a package-level value.
        name: RefusalSpec
        struct:
          fields:
            - doc: |-
                Symlink wraps the policy refusal: the final component is already a
                symbolic link, so the open is never attempted.
              name: Symlink
              type: errs.WrapParams
            - doc: |-
                Open wraps a failed os.OpenFile — the kernel refusing a link planted
                after the check among the causes, and a full disk among the others.
              name: Open
              type: errs.WrapParams
  - doc: |-
      Package memory implements a Sink that retains a defensive snapshot of every
      RecordEvent it receives in a mutex-guarded slice. It is intended for tests
      that need to assert on what was logged — level, message, and attrs — without
      parsing an encoder's byte output. Records returns an independent copy of the
      buffer and Reset clears it; both are safe for concurrent use alongside Write.

      Package memory — defines the Memory sink, an in-memory Sink that buffers a
      defensive snapshot of every received RecordEvent for test assertions.

      Package memory — compile-time proof that *Memory satisfies the core Sink port.
    functions:
      - doc: NewMemory returns an empty Memory sink ready to record received records.
        name: NewMemory
        out:
          - type: "*Memory"
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
    path: github.com/kitsunium/sdk/internal/service/observe/logger/sink/memory
    types:
      - decl: true
        doc: |-
          Memory is a terminal Sink that retains a defensive snapshot of every
          RecordEvent it receives in a slice guarded by an RWMutex. It exists for tests
          that assert on what was logged without parsing an encoder's byte output.
          Write records; Records returns an independent copy of the buffer; Reset
          clears it. All methods are safe for concurrent use.
        implements:
          - corelogger.Sink
        methods:
          - doc: |-
              Write appends a defensive snapshot of r to the buffer and reports len(p) as
              written. The encoder's bytes p are intentionally ignored — the sink retains
              the structured record, not its serialised form. The Attrs slice is
              deep-cloned, including any nested KindGroup payloads, so later caller
              mutation cannot corrupt recorded history.
            in:
              - name: ctx
                type: context.Context
              - name: r
                type: corelogger.RecordEvent
              - name: p
                type: "[]byte"
            name: Write
            out:
              - name: "n"
                type: int
              - name: err
                type: error
            recv: pointer
          - doc: Flush is a no-op for the memory sink — nothing is buffered downstream.
            in:
              - name: ctx
                type: context.Context
            name: Flush
            out:
              - type: error
            recv: pointer
          - doc: |-
              Close is a no-op for the memory sink — it holds no OS resources. Buffered
              records remain readable via Records after Close so tests can assert on a
              closed sink.
            name: Close
            out:
              - type: error
            recv: pointer
          - doc: |-
              Records returns a snapshot copy of the buffered records. The returned slice
              is independent of the sink's internal buffer, so callers may iterate it while
              other goroutines continue writing.
            name: Records
            out:
              - type: "[]corelogger.RecordEvent"
            recv: pointer
          - doc: |-
              Len reports the number of accepted Write calls. It is cheaper than len of
              Records for callers that only need a count, and reads under the read lock.
            name: Len
            out:
              - type: int
            recv: pointer
          - doc: |-
              Reset discards all buffered records and the write counter, returning the
              sink to its empty state.
            name: Reset
            recv: pointer
        name: Memory
        struct:
          fields:
            - doc: |-
                mu guards records and writes; Write/Reset take the write lock, Records
                the read lock so concurrent assertions never block each other.
              name: mu
              type: sync.RWMutex
            - doc: |-
                records holds a defensive copy of each received RecordEvent in arrival
                order; each entry's Attrs slice is deep-cloned (including nested
                KindGroup payloads) so caller mutation cannot corrupt recorded history.
              name: records
              type: "[]corelogger.RecordEvent"
            - doc: |-
                writes is the lifetime accepted-append count — equal to len(records)
                until Reset (this sink never drops or dedups). It lets callers assert on
                total throughput without diffing the slice and gives the struct a second
                field beyond the guarded slice.
              name: writes
              type: int
  - codes:
      - const:
          - doc: |-
              CodeWriterRequired identifies a NewText call with Config.Writer == nil;
              the v1 façade refuses to default silently to stderr.
            name: CodeWriterRequired
            note: "range: 1.1.0.0 - 1.1.0.255"
            value: "0x01_01_00_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeSinkConfigRequired identifies a NewWithSink call with
              SinkConfig.Sink == nil; the v1 façade refuses to default silently to
              a console sink so callers see the misconfiguration immediately. The
              identifier is qualified with "Config" so the AST audit can distinguish
              it from the service-layer sink/handler validation (0.3.1.4).
            name: CodeSinkConfigRequired
            value: "0x01_01_00_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeWriterSpecInvalid identifies a NewMulti call with no WriterSpec entries;
              the façade refuses to build a logger that fans out to nothing (ADR 0012).
            name: CodeWriterSpecInvalid
            value: "0x01_01_00_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeTopologyInvalid identifies a FromConfig call whose config blob is
              malformed, names an unregistered writer, or whose Factory/DecodeConfig
              rejected its options. The error path is redacted: it names only the writer
              and the failure kind, never any decoded credential or option value (ADR 0014).
            name: CodeTopologyInvalid
            value: "0x01_01_00_04"
        type: errs.Code
    doc: |-
      Package logger — re-exports the chainable Builder API and the
      slice-overload LogAttrs entry point. Both are routed through the
      internal service implementation, which owns the recycler that holds
      the steady-state hot-path at one allocation per emit.

      Package logger — adds the opt-in caller annotation surface. WithCaller
      derives a Logger whose records carry a structured "source" attribute
      (file:line:function) resolved from the program counter the front-end already
      captures. It is additive: an unwrapped Logger emits no source field, so the
      frozen record shape is unchanged until a caller opts in.

      Package logger — range 1.1.0.* (ADR 0005 pkg/v1/observe/logger block).

      Package logger — adds ergonomic Encoder constructors to the public facade.
      The Encoder type alias itself lives in sink.go; this file contributes the
      named constructors (NewTextEncoder / NewJSONEncoder) so consumers can build
      an encoder directly and pass it to NewWithSink without importing internal/*.

      Package logger — declares pkg/v1/observe/logger's sentinels. Each var's
      name equals its errs.Define Reason in SCREAMING_SNAKE form.

      Package logger — exposes FromConfig, the capstone of the config-driven writer
      subsystem (ADR 0014 §D5): it builds a fully wired Logger from a config blob
      with zero Go glue. The blob is decoded by a codec the CONSUMER already
      registered (FromConfig imports only the core/data/codec dispatch surface, never
      pkg/v1/data/codec or any service codec, so a pkg/v1/observe/logger consumer inherits no
      vendor modules). Each decoded WriterEntry is resolved against the writer
      registry; a Factory that implements ConfigDecoder translates its own option
      map, otherwise a default mapping passes the raw map straight to the factory.

      Package logger — re-exports the Value payload discriminant so consumers can
      name what Value.Kind() returns.

      Without these aliases MemorySink is only half usable: it hands back
      RecordSnapshot values whose Attrs carry a Kind, but the Kind type itself
      lived behind the internal/ firewall, so a consumer test could read the
      discriminant and still not write it down. The core doc already calls these
      values "stable across the public API"; this file makes that true.

      Package logger — exposes the runtime-tunable level surface: ParseLevel (the
      strict inverse of a lowercased Level.String), the Leveler one-method port, and
      LevelVar, an atomically mutable threshold holder a custom sink or gate consults
      on each record to retune a live logger's floor without rebuilding the pipeline.

      Package logger is the stable v1 public API for SDK logging.

      Consumers import this package; internal/* paths are compile-blocked
      outside the SDK repo. Type signatures exported here are frozen after
      the first v1.0.0 release; breaking changes land in pkg/v2. Security
      fixes in internal/* propagate via a minor bump without touching this
      façade.

      # Goals

        - One-allocation hot path. The chainable Build(lg, lv).Str(...).
          Send(...) builder is backed by a sync.Pool that recycles the
          builder and its attrs scratchpad, but the handler clones that
          scratchpad on every Send — so steady-state cost is exactly 1
          heap allocation per emit, not 0. The variadic Info/Warn/... path
          costs the same 1 (its variadic slice). Prefer Build for
          ergonomics; it is not an allocation-free guarantee. Measured in
          BENCH.md and pinned by its design contract (allocsMin: 1 on
          Build, ADR 0165).
        - Composable transport. A Logger is wired from a Sink (where bytes
          go) + an Encoder (how bytes are formatted). Fan-out, async, route,
          failover, sample, recover middleware compose around a Sink —
          bring your own topology.
        - Typed Attrs at the call site. 9 typed constructors (String, Int,
          Bool, Float64, Int64, Uint64, Duration, Time, Any) — no
          any-untyped key/value pairs that error at runtime.
        - Build-time version stamping. Version is the single ldflags
          injection point. FrameworkVersion() is added as
          "framework_version" to every emitted record — set under
          go build -ldflags "-X .../logger.Version=…" or Bazel --stamp.
        - Trace correlation, on by default and free. A record emitted
          inside a span carries that span's trace_id and span_id as
          top-level fields; a record emitted outside one carries neither
          key. No call site changes — Logger.Log has always taken a
          context.Context. Costs no extra allocation. See ADR 0062 and
          the "Trace correlation" section below.
        - Two failure modes only. Construction returns WriterRequired
          (1.1.0.1) on a nil writer or SinkConfigRequired (1.1.0.2) on a
          nil sink — both introspectable via errs.HasCode.

      # What's shipped

      Three construction paths, three native sinks, six middleware kinds,
      nine Attr ctors, four Level constants, three emission paths.

      	| Group               | Symbols                                                                     | Role |
      	|---------------------|------------------------------------------------------------------------------|------|
      	| Construction        | Default, DefaultMulti(path), NewText(Config), NewWithSink(SinkConfig)        | Wire a Logger from explicit knobs OR a one-liner. Config has Writer (single) + Writers ([]io.Writer fan-out) — pick one. DefaultMulti fans console+file from one call (blank-import the writer pkg). |
      	| Sinks (native)      | ConsoleStderr, ConsoleStdout, NewWriterSink(w), Multi(branches…), LevelGate  | Native + io.Writer adapter + fan-out + a per-branch floor; bring custom Sink for DB/etc. |
      	| Middleware          | multi, async, route, failover, sample, recover                               | Compose around a base Sink; same Sink interface chainable |
      	| Encoders            | TextEncoder                                                                  | key=value lines on system clock (JSON/structured: internal today) |
      	| Emission            | Info / Warn / Error / Debug (variadic), Build(lg,lv) → chain → Send, LogAttrs| 1 alloc on variadic, 1 alloc steady-state on Build |
      	| Attr constructors   | String, Int, Bool, Float64, Int64, Uint64, Duration, Time, Any               | Typed at the call site |
      	| Levels              | LevelDebug, LevelInfo, LevelWarn, LevelError                                 | MinLevel on SinkConfig filters at the source |
      	| Versioning          | Version (ldflags), FrameworkVersion()                                        | Stamp every record with the SDK build version |
      	| Error sentinels     | WriterRequired (1.1.0.1), SinkConfigRequired (1.1.0.2)                       | Construction-time, introspectable via errs.HasCode |

      # Quick start (text on stderr)

      	import "github.com/kitsunium/sdk/pkg/v1/observe/logger"

      	func main() {
      	    lg, err := logger.NewText(logger.Config{Writer: os.Stderr, Level: logger.LevelInfo})
      	    if err != nil { panic(err) }
      	    lg.Info(context.Background(), "service ready",
      	        logger.String("addr", ":8080"))
      	}

      [Default] returns the stderr one-liner equivalent in tests + scripts.
      [DefaultMulti] is the batteries-included service default: it fans
      INFO-and-above records to BOTH the console AND a plain (non-rotating)
      file from a single call — the caller blank-imports
      github.com/kitsunium/sdk/pkg/v1/observe/logger/writer to activate the two
      named writers. Pass [Config]{Writer: nil} and [NewText] returns the
      typed sentinel [WriterRequired] — the pre-errors API silently
      defaulted to os.Stderr; that was a breaking change recorded in
      ADR 0002.

      # Custom sink topology

      For multi-sink fan-out, async / failover / sample / route middleware,
      drive [NewWithSink] with a [SinkConfig]:

      	sink := logger.Multi(
      	    logger.ConsoleStderr(logger.TextEncoder),
      	    fileSink, // *yourSink implementing logger.Sink
      	)
      	lg, err := logger.NewWithSink(logger.SinkConfig{Sink: sink, Level: logger.LevelDebug})

      A nil Sink returns [SinkConfigRequired]. Both [NewText] and
      [NewWithSink] decorate every emitted record with the
      "framework_version" attribute (see [FrameworkVersion]).

      # One logger, two floors

      [SinkConfig].MinLevel is the floor of the whole pipeline. When one
      branch of a fan-out should see less than another — the terminal at
      the application's level, an in-process viewer at every level — set
      the pipeline's floor to the lowest and gate the narrower branch with
      [LevelGate]:

      	sink := logger.Multi(
      	    logger.LevelGate(logger.ConsoleStderr(), logger.LevelInfo), // Info and above
      	    viewer, // everything, Debug included
      	)
      	lg, err := logger.NewWithSink(logger.SinkConfig{Sink: sink, MinLevel: logger.LevelDebug})

      The gate applies the floor it is given, Info included; a dropped
      record is a successful no-op, so it never surfaces as a fan-out
      failure.

      # Builder hot path

      [Build] returns a chainable, sync.Pool-backed [Builder] whose
      steady-state per-call cost is one heap allocation per emit: the pool
      recycles the Builder and its attrs scratchpad, but the handler clones
      that scratchpad on every [Builder].Send, so one slice escapes.
      Callers MUST NOT use a Builder after [Builder].Send — it returns to
      the recycler.

      	logger.Build(lg, logger.LevelInfo).
      	    Str("user", u.Name).
      	    Int("age", u.Age).
      	    Send(ctx, "user logged in")

      [LogAttrs] is the slice overload that avoids the variadic-slice
      allocation in [Logger].Log.

      # Trace correlation

      Every Logger this package builds stamps the span in scope onto
      every record it emits, as the two TOP-LEVEL fields OpenTelemetry
      prescribes for non-OTLP log formats: "trace_id" (32 lowercase hex
      digits) and "span_id" (16). Populating
      the context is the trace domain's job — the inbound HTTP middleware
      in github.com/kitsunium/sdk/pkg/v1/observe/trace, or an explicit
      trace.ContextWithSpanContext:

      	ctx = trace.ContextWithSpanContext(ctx, spanContext)
      	logger.Info(ctx, lg, "served") // → … trace_id=4bf9… span_id=00f0…

      Three properties are worth knowing:

        - They are record FIELDS ([Record].TraceContext), not attributes,
          so [Logger].WithGroup never renames them to "http.trace_id" and
          a Sink can read the identity off the record instead of parsing
          it back out of a formatted line.
        - Both names are RESERVED at the top level. An attribute called
          "trace_id" or "span_id" renders as "attr.trace_id" /
          "attr.span_id", because two fields of one name let a decoder
          keep the caller's value as the line's correlation. It is
          renamed and never dropped, and a key under [Logger].WithGroup
          already carries its prefix and is untouched. The whole "attr."
          namespace is reserved with them, so a key already inside it is
          prefixed again — otherwise the rename would not be one-to-one
          and two of your own keys could collide. To log somebody else's
          identifier, name it for what it is:
          logger.String("upstream_trace_id", id).
        - When no span is in scope NOTHING is emitted — not an empty
          value and not the all-zero identifier, both of which W3C Trace
          Context declares invalid. Most lines a service logs are outside
          a request, and an unjoinable trace_id on all of them would make
          the field useless as a filter.
        - It costs no extra allocation: the hot path stays at exactly one
          heap allocation per emit, with a span and without. The
          identifiers are hex-encoded straight into the encoder's buffer
          and never become a Go string. Measured in BENCH.md.

      [TraceContextFromContext] is the adapter, exported so a caller
      wiring a Logger by hand can reuse it.

      # Version stamping

      [Version] is the single ldflags injection point for the SDK.
      Recipes:

        - Raw go build: `go build -ldflags "-X github.com/kitsunium/sdk/pkg/v1/observe/logger.Version=v0.1.0" ./...`
        - Bazel: --stamp + x_defs + tools/workspace_status.sh (STABLE_VERSION).

      [FrameworkVersion] returns the link-time value or the literal "dev"
      sentinel when unset. Every emitted record carries this value under
      the "framework_version" attribute key.

      # Errors

      Construction failures carry typed dotted-quad codes under range
      1.1.0.* per ADR 0005:

        - 1.1.0.1 [CodeWriterRequired] / [WriterRequired]: NewText with Writer == nil.
        - 1.1.0.2 [CodeSinkConfigRequired] / [SinkConfigRequired]: NewWithSink with Sink == nil.

      Inspect via the accessors in github.com/kitsunium/sdk/pkg/v1/errs.

      Package logger — exposes the in-memory test sink (NewMemorySink) and its
      RecordSnapshot element type so consumers can assert on what was logged.

      Package logger — exposes the Sink port, the multi-sink helper and the
      per-branch level gate alongside the encoder-aware constructor NewWithSink.
      Together they let consumers replace the default text-on-stderr wiring
      (NewText / Default) with arbitrary fan-out / async / file / syslog
      topologies — without reaching into internal/* packages.

      Package logger — declares the TopologyConfig DTO consumed by FromConfig.
      A TopologyConfig is the decoded shape of a logger config file: a global level
      plus an ordered list of named writer entries. It is a plain data carrier with
      no behaviour — the construction logic lives in FromConfig.

      Package logger — bridges the trace domain to the logging domain, so a log
      line emitted inside a span carries that span's identity and an operator
      holding a trace_id can find the logs that belong to it.

      This file is the ONLY place in the SDK where logging and tracing meet, and
      that placement is the design (ADR 0062). internal/service/observe/logger and
      internal/service/observe/trace are siblings, and neither imports the other because
      the two domains meet only here, at the top layer; internal/core/observe/logger is
      kept stdlib-only so a consumer who only wants a line on stderr does not
      compile the trace model. pkg/v1 is the layer that knows both domains
      already, so the binding lives here and nowhere else.

      Package logger — exposes the SDK version to the rest of the
      logger package. The ldflags pipeline injects the real value at build
      time; local development runs fall back to the "dev" sentinel.

      Package logger — WithError decomposes an SDK typed error into structured log
      Attrs (error.code / error.reason / error.public + wrap-trail codes), making
      the SDK's dotted-quad errors first-class structured data rather than a flat
      string. It lives beside the Attr constructors it produces.

      Package logger — exposes the named, config-driven writer surface (ADR 0012):
      the WriterName / *Config aliases, the WriterSpec pair, and NewMulti, which
      resolves each named writer to a Sink and fans records out to all of them via
      Multi. Built-in console + file writers activate with a blank import of
      pkg/v1/observe/logger/writer; s3 / cloudwatch activate with a blank import of the
      matching third-party/aws/writer package (which alone pulls the AWS SDK).

      Package logger — declares the WriterEntryConfig DTO consumed by FromConfig.
      A WriterEntryConfig names a registered writer and carries its raw, codec-
      decoded option map; FromConfig hands that map to the writer's Decoder (or a
      default mapping) to obtain a typed writer.Config.
    facade:
      - alias:
          - doc: |-
              Builder is the stable alias for the internal chainable Builder. Returned
              by Build, every typed accessor (Str / Int / Bool / …) returns the receiver
              so callers compose the chain in a single expression. Send terminates the
              chain — callers MUST NOT use the builder after Send.
            name: Builder
            target: svclogger.Builder
      - func:
          doc: |-
            Build returns a chainable Builder bound to lg at the supplied level.
            Builders are recycled through a sync.Pool, so the steady-state per-call
            cost is one heap allocation per emit — the handler clones the accumulated
            attrs on Send, and that clone escapes. See BENCH.md.
          forward: svclogger.Build
          in:
            - name: lg
              type: Logger
            - name: lv
              type: Level
          name: Build
          out:
            - type: Builder
      - func:
          doc: |-
            LogAttrs is the slice-overload of Logger.Log that avoids the variadic
            slice allocation imposed by Logger.Log(... Attr). Pre-built attribute
            slices flow through this entry point without per-call boxing.
          forward: svclogger.LogAttrs
          in:
            - name: ctx
              type: context.Context
            - name: lg
              type: Logger
            - name: lv
              type: Level
            - name: msg
              type: string
            - name: attrs
              type: "[]Attr"
          name: LogAttrs
      - func:
          doc: |-
            WithCaller returns a derived Logger whose emitted records carry a "source"
            attribute resolving the call site into file:line:function. The skip argument
            is the extra stack-frame offset reserved for wrapper layers; pass 0 for
            direct callers. The returned Logger shares the original's sink and encoder;
            the only change is the added annotation, so the option is safe to layer onto
            any Logger built by this package.

            	lg, _ := logger.Default()
            	lg = logger.WithCaller(lg, 0)
            	lg.Info(ctx, "ready") // record now carries source=…/main.go:42:main.run
          forward: svclogger.WithCaller
          in:
            - name: lg
              type: Logger
            - name: skip
              type: int
          name: WithCaller
          out:
            - type: Logger
      - alias:
          - doc: |-
              Format is the typed wire-format identifier accepted by FromConfig. It is a
              stable alias onto the core codec dispatch surface, so a consumer names a
              format with the same string values the codec facade exposes.
            name: Format
            target: corecodec.Format
      - alias:
          - doc: |-
              Kind is the stable alias for the internal payload discriminant carried by a
              Value. Switch on it to select the matching typed accessor (String, Int64,
              Float64, …) instead of paying for an `any` assertion at render time.
            name: Kind
            target: corelogger.Kind
      - const:
          - doc: |-
              KindAny tags a Value whose payload is an unconstrained interface. It is also
              the zero value of Kind, so an unrecognised future variant degrades here
              rather than panicking.
            name: KindAny
            reexport: corelogger.KindAny
            type: Kind
            typed: true
            value: "0"
      - const:
          - doc: KindBool tags a Value carrying a boolean payload.
            name: KindBool
            reexport: corelogger.KindBool
            type: Kind
            typed: true
            value: "1"
      - const:
          - doc: KindDuration tags a Value carrying a time.Duration payload.
            name: KindDuration
            reexport: corelogger.KindDuration
            type: Kind
            typed: true
            value: "2"
      - const:
          - doc: KindFloat64 tags a Value carrying a float64 payload.
            name: KindFloat64
            reexport: corelogger.KindFloat64
            type: Kind
            typed: true
            value: "3"
      - const:
          - doc: |-
              KindInt64 tags a Value carrying an int64 payload (also covers int / int32,
              which IntValue widens on the way in).
            name: KindInt64
            reexport: corelogger.KindInt64
            type: Kind
            typed: true
            value: "4"
      - const:
          - doc: KindString tags a Value carrying a string payload.
            name: KindString
            reexport: corelogger.KindString
            type: Kind
            typed: true
            value: "5"
      - const:
          - doc: KindTime tags a Value carrying a time.Time payload.
            name: KindTime
            reexport: corelogger.KindTime
            type: Kind
            typed: true
            value: "6"
      - const:
          - doc: KindUint64 tags a Value carrying an unsigned 64-bit integer payload.
            name: KindUint64
            reexport: corelogger.KindUint64
            type: Kind
            typed: true
            value: "7"
      - const:
          - doc: |-
              KindGroup tags a Value whose payload is a nested []Attr. Producers that
              target the bundled text and JSON encoders flatten groups into dotted keys
              instead, since neither encoder renders a group payload directly.
            name: KindGroup
            reexport: corelogger.KindGroup
            type: Kind
            typed: true
            value: "8"
      - alias:
          - doc: |-
              Leveler is the stable alias for the internal one-method level port. A custom
              Sink reads Level on each record so the threshold can change at runtime; both
              LevelVar and any constant-returning type satisfy it.
            name: Leveler
            target: level.Leveler
      - alias:
          - doc: |-
              LevelVar is the stable alias for the atomic Level holder. Its zero value
              reports LevelInfo; Set and Level are safe for concurrent use, so one
              goroutine can retune the floor while a sink reads it on the hot path.
            name: LevelVar
            target: level.Var
      - func:
          doc: |-
            NewLevelVar returns a LevelVar seeded with initial. Hold the returned pointer
            where a sink or gate can read its Level, then call Set to raise or lower the
            live threshold. Pair it with ParseLevel to retune from an env or flag value.
          forward: level.NewVar
          in:
            - name: initial
              type: Level
          name: NewLevelVar
          out:
            - type: "*LevelVar"
      - func:
          doc: |-
            ParseLevel maps a canonical lowercase level name (debug / info / warn /
            error) to its Level, the strict inverse of a lowercased Level.String. Input
            is trimmed and lowercased before matching. Unknown names return the zero
            Level and a redacted LevelUnknown error — the offending input is never echoed.

            Unlike the internal best-effort config path, this surface reports the miss so
            a caller validating an env/flag value can reject it rather than silently
            falling back to Info.
          forward: level.ParseLevel
          in:
            - name: name
              type: string
          name: ParseLevel
          out:
            - name: lvl
              type: Level
            - name: err
              type: error
      - alias:
          - doc: Logger is the stable alias for the internal core.Logger interface.
            name: Logger
            target: corelogger.Logger
      - alias:
          - doc: Attr is the stable alias for the internal AttrValue key/value pair.
            name: Attr
            target: corelogger.AttrValue
      - alias:
          - doc: Level is the stable alias for the internal severity type.
            name: Level
            target: level.Level
      - const:
          - doc: LevelDebug selects records describing detailed tracing information.
            name: LevelDebug
            reexport: level.Debug
            type: Level
            typed: true
            value: "-4"
      - const:
          - doc: LevelInfo selects records describing routine operational events.
            name: LevelInfo
            reexport: level.Info
            type: Level
            typed: true
            value: "0"
      - const:
          - doc: LevelWarn selects records describing abnormal but recoverable conditions.
            name: LevelWarn
            reexport: level.Warn
            type: Level
            typed: true
            value: "4"
      - const:
          - doc: LevelError selects records describing failures needing action.
            name: LevelError
            reexport: level.Error
            type: Level
            typed: true
            value: "8"
      - alias:
          - doc: |-
              RecordSnapshot is a buffered copy of a single recorded log event. It is the
              element type returned by MemorySink.Records, letting tests assert on a
              record's Level, Message, and Attrs without parsing an encoder's byte output.
              It is the same type as Record (an alias of the core RecordEvent).
            name: RecordSnapshot
            target: corelogger.RecordEvent
      - alias:
          - doc: |-
              MemorySink is a Sink that buffers a defensive snapshot of every received
              record in a mutex-guarded slice. It is intended for tests that assert on
              what was logged. Pass it to NewWithSink (it satisfies Sink), retrieve the
              buffered records with Records, and clear them with Reset.
            name: MemorySink
            target: memory.Memory
      - func:
          doc: NewMemorySink returns an empty MemorySink ready to record received records.
          forward: memory.NewMemory
          name: NewMemorySink
          out:
            - type: "*MemorySink"
      - alias:
          - doc: |-
              Sink is the stable alias for the internal core.Sink port. Consumers
              compose Sink instances (console / file / syslog / async / multi …) and
              pass them to NewWithSink to wire a custom transport pipeline.
            name: Sink
            target: corelogger.Sink
      - alias:
          - doc: |-
              Record is the stable alias for the internal RecordEvent value passed to
              Sink.Write. Consumers implementing custom Sinks reach for this type
              rather than reimporting the internal core.logger package.
            name: Record
            target: corelogger.RecordEvent
      - alias:
          - doc: |-
              Encoder is the stable alias for the internal service encoder interface.
              The default text encoder is exposed via TextEncoder; structured output is
              injected through NewWithSink via SinkConfig.Encoder (see NewJSONEncoder)
              when callers need machine-readable output.
            name: Encoder
            target: encoder.Encoder
      - func:
          doc: |-
            Multi is a thin wrapper around the internal multi (fan-out) sink. It
            broadcasts every record to each branch in order and aggregates per-sink
            failures via errors.Join under the FANOUT_WRITE_FAILED sentinel.
          forward: multi.New
          in:
            - name: branches
              type: Sink
          name: Multi
          out:
            - type: Sink
          variadic: true
      - func:
          doc: |-
            LevelGate returns a Sink that passes to sink the records whose level is at
            or above min and drops the others, delegating Flush and Close. It is how one
            branch of a [Multi] fan-out sees less than another: the pipeline's
            [SinkConfig].MinLevel is set to the lowest level any branch wants, and the
            narrower branches are gated.

            The floor is the one given, for every level — Info included. A dropped
            record reports success (every byte accepted, no error), so a fan-out never
            counts it as a failed write. The gate holds nothing of its own: Flush and
            Close reach sink unchanged, and closing the gate closes sink.

            A nil sink yields nil, which [Multi] skips and [NewWithSink] refuses with
            [SinkConfigRequired].
          forward: levelgate.Floor
          in:
            - name: sink
              type: Sink
            - name: min
              type: Level
          name: LevelGate
          out:
            - type: Sink
      - func:
          doc: |-
            ConsoleStderr returns the stderr console Sink used by Default. Exposed
            so callers building a Multi() topology can wire stderr alongside richer
            transports without re-implementing the convenience constructor.
          forward: console.NewStderr
          name: ConsoleStderr
          out:
            - type: Sink
      - func:
          doc: |-
            ConsoleStdout returns the stdout console Sink. Same rationale as
            ConsoleStderr — exposed for Multi() compositions.
          forward: console.NewStdout
          name: ConsoleStdout
          out:
            - type: Sink
      - alias:
          - doc: |-
              TraceContext is the stable alias for the trace correlation a Record carries:
              the trace and span identifiers of the span the record was emitted inside.
              The zero value means "no trace here" and renders nothing.
            name: TraceContext
            target: corelogger.TraceContextValue
      - alias:
          - doc: |-
              TraceContextSource is the stable alias for the port that reads a
              TraceContext off a context.Context. Every Logger built by this package is
              wired to TraceContextFromContext.
            name: TraceContextSource
            target: corelogger.TraceContextSource
      - const:
          - doc: |-
              StreamStderr selects os.Stderr for the console writer (zero value, so a
              ConsoleConfig{} written without an opinion lands here — ADR 0030).
            name: StreamStderr
            reexport: corewriter.ConsoleStderr
            type: corewriter.ConsoleStream
            typed: true
            value: "0"
          - doc: |-
              StreamStdout selects os.Stdout for the console writer. Because stdout is
              a protocol channel for many processes, it is reachable only by name.
            name: StreamStdout
            reexport: corewriter.ConsoleStdout
            type: corewriter.ConsoleStream
            typed: true
            value: "1"
        doc: |-
          StreamStderr targets os.Stderr (the zero value); StreamStdout targets stdout.
          Typed as corewriter.ConsoleStream so the constants stand alone ahead of the
          type aliases below (const → type ordering).
      - alias:
          - doc: |-
              WriterName is the stable alias for a registered writer key
              ("console" / "file" / "rotfile" / "s3" / "cloudwatch").
            name: WriterName
            target: corewriter.Name
      - alias:
          - doc: |-
              ConsoleConfig configures the "console" writer (stream + optional MinLevel).
              The zero value targets os.Stderr (ADR 0030).
            name: ConsoleConfig
            target: corewriter.ConsoleConfig
      - alias:
          - doc: FileConfig configures the "file" writer (path + optional MinLevel).
            name: FileConfig
            target: corewriter.FileConfig
      - alias:
          - doc: |-
              S3Config configures the "s3" writer. Usable as a value without the AWS SDK;
              it resolves to a working sink only once third-party/aws/writer/s3 is imported.
            name: S3Config
            target: corewriter.S3Config
      - alias:
          - doc: |-
              CloudWatchConfig configures the "cloudwatch" writer. Same import-gated
              resolution as S3Config.
            name: CloudWatchConfig
            target: corewriter.CloudWatchConfig
      - alias:
          - doc: |-
              RotFileConfig configures the "rotfile" writer — a size- and/or age-capped,
              optionally gzip-compressed on-disk file that rotates Path -> Path.1 … up to
              MaxBackups (Path / MaxBytes / MaxBackups / MaxAgeDays / Compress / RotateEvery
              / MinLevel). Usable as a value once
              github.com/kitsunium/sdk/pkg/v1/observe/logger/writer is blank-imported (it
              self-registers the "rotfile" factory alongside console and file); pass it via
              WriterSpec{Name: "rotfile", Config: cfg} to NewMulti.
            name: RotFileConfig
            target: corewriter.RotFileConfig
      - alias:
          - doc: |-
              ConsoleStream selects which standard stream the console writer targets. Its
              zero value is StreamStderr (ADR 0030).
            name: ConsoleStream
            target: corewriter.ConsoleStream
      - alias:
          - doc: |-
              CredentialProvider yields short-lived credentials on demand for the network
              writers; the SDK never logs or wraps the returned material.
            name: CredentialProvider
            target: corewriter.CredentialProvider
      - alias:
          - doc: |-
              CredentialValue is the opaque, redacting credential set returned by a
              CredentialProvider; its String output is always "<redacted>".
            name: CredentialValue
            target: corewriter.CredentialValue
      - func:
          doc: |-
            NewCredentialValue builds a CredentialValue from AWS SigV4 material. An empty
            sessionToken is valid for long-lived keys.
          forward: corewriter.NewCredentialValue
          in:
            - name: accessKeyID
            - name: secretAccessKey
            - name: sessionToken
              type: string
          name: NewCredentialValue
          out:
            - type: CredentialValue
      - alias:
          - doc: |-
              WriterSpec names a writer and carries its concrete config. Read at call sites
              as logger.WriterSpec{Name: "file", Config: logger.FileConfig{Path: …}}. It is
              a type alias onto internal/core/observe/logger/writer, so the public type is identity-equal
              to the internal writer model (alias-based public surface, zero runtime cost).
            name: WriterSpec
            target: corewriter.Spec
    functions:
      - doc: |-
          NewTextEncoder returns the default human-readable encoder, rendering each
          record as "TIME LEVEL msg key=val …\n" with RFC3339-millisecond timestamps.
          It is a named peer of TextEncoder bound to the real system clock.
        name: NewTextEncoder
        out:
          - type: Encoder
      - doc: |-
          NewJSONEncoder returns a structured single-line JSON encoder, rendering each
          record as one encoding/json-compatible object per line:
          {"ts":…,"level":…,"msg":…,<flat attrs>}. Grouped attributes flatten to
          dotted keys ("g1.g2.key") to match the text encoder's convention. Pass it to
          NewWithSink via SinkConfig.Encoder for machine-readable output.
        name: NewJSONEncoder
        out:
          - type: Encoder
      - doc: |-
          FromConfig builds a Logger from raw, a config blob in the wire format named by
          format, decoded by a codec the consumer has already registered (blank-import
          github.com/kitsunium/sdk/pkg/v1/data/codec or a single service codec to activate
          one). It unmarshals raw into a Topology, resolves each WriterEntry against the
          writer registry — calling the Factory's ConfigDecoder when it implements one,
          else a default mapping — composes the sinks via Multi, and returns a Logger
          filtered at the topology's Level.

          FromConfig returns TopologyInvalid (1.1.0.4) when format is unregistered, the
          blob is undecodable, the topology has no writers, a writer Name is unknown, or
          a writer rejects its options. The error is redacted: it names only the writer
          and the failure kind, never a decoded credential or option value.

          Like NewMulti's, the returned Logger owns the writers it opened — the caller
          never held them — and implements io.Closer to release them, once.
        in:
          - name: format
            type: Format
          - name: raw
            type: "[]byte"
        name: FromConfig
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - doc: |-
          NewText builds a text-format Logger writing to cfg.Writer (single) OR
          cfg.Writers (fan-out) filtered at cfg.MinLevel. NewText intentionally
          does NOT default a nil destination: callers that want stderr use
          Default(), which supplies it explicitly. Every record emitted through
          the returned Logger carries a "framework_version" attr.

          Multi-writer example — stream identical text records to stderr AND a
          log file:

          	f, _ := os.OpenFile("/var/log/myapp.log", os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
          	lg, err := logger.NewText(logger.Config{
          	    Writers:  []io.Writer{os.Stderr, f},
          	    MinLevel: logger.LevelInfo,
          	})
        in:
          - name: cfg
            type: Config
        name: NewText
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - doc: |-
          Default returns a Logger writing INFO-and-above records to os.Stderr.
          The stderr Writer is supplied explicitly here; NewText itself no longer
          silently defaults a nil Writer.
        name: Default
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - doc: |-
          DefaultMulti returns a Logger that fans INFO-and-above records out to BOTH
          the console (stderr, the ConsoleConfig zero value — ADR 0030) AND a plain
          file at path.
          It is the batteries-included "perfect default" the SDK recommends for a
          service: two destinations from one call, with NO rotation surface — the
          plain "file" writer never rotates, so rotation stays opt-in (a caller wanting
          size/age rotation reaches for the rotating writer explicitly).

          Unlike Default (stderr-only, no extra import), DefaultMulti resolves the
          "console" and "file" writers through the registry, so the CALLER MUST
          blank-import the writer package to activate them:

          	import (
          	    "github.com/kitsunium/sdk/pkg/v1/observe/logger"
          	    _ "github.com/kitsunium/sdk/pkg/v1/observe/logger/writer" // console + file
          	)

          	lg, err := logger.DefaultMulti("/var/log/app.log")

          Without that import the file/console Names do not resolve and DefaultMulti
          returns the registry's WriterUnknownName, surfaced through NewMulti.

          Like every Logger NewMulti returns, it owns the writers it opened and
          implements io.Closer: Close releases the console writer and the file.
        in:
          - name: path
            type: string
        name: DefaultMulti
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - doc: Debug emits a RecordEvent at LevelDebug through lg.
        in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Debug
        variadic: true
      - doc: Info emits a RecordEvent at LevelInfo through lg.
        in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Info
        variadic: true
      - doc: Warn emits a RecordEvent at LevelWarn through lg.
        in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Warn
        variadic: true
      - doc: Error emits a RecordEvent at LevelError through lg.
        in:
          - name: ctx
            type: context.Context
          - name: lg
            type: Logger
          - name: msg
            type: string
          - name: attrs
            type: Attr
        name: Error
        variadic: true
      - doc: String builds an Attr carrying a string value.
        in:
          - name: key
          - name: val
            type: string
        name: String
        out:
          - type: Attr
      - doc: Int builds an Attr carrying an int value.
        in:
          - name: key
            type: string
          - name: val
            type: int
        name: Int
        out:
          - type: Attr
      - doc: Bool builds an Attr carrying a boolean value.
        in:
          - name: key
            type: string
          - name: val
            type: bool
        name: Bool
        out:
          - type: Attr
      - doc: Float64 builds an Attr carrying a float64 value.
        in:
          - name: key
            type: string
          - name: val
            type: float64
        name: Float64
        out:
          - type: Attr
      - doc: Int64 builds an Attr carrying an int64 value.
        in:
          - name: key
            type: string
          - name: val
            type: int64
        name: Int64
        out:
          - type: Attr
      - doc: Uint64 builds an Attr carrying a uint64 value.
        in:
          - name: key
            type: string
          - name: val
            type: uint64
        name: Uint64
        out:
          - type: Attr
      - doc: Duration builds an Attr carrying a time.Duration value.
        in:
          - name: key
            type: string
          - name: val
            type: time.Duration
        name: Duration
        out:
          - type: Attr
      - doc: Time builds an Attr carrying a time.Time value.
        in:
          - name: key
            type: string
          - name: val
            type: time.Time
        name: Time
        out:
          - type: Attr
      - doc: |-
          Any builds an Attr carrying an opaque payload. Use the typed helpers when
          possible — Any disables type-aware rendering.
        in:
          - name: key
            type: string
          - name: val
            type: any
        name: Any
        out:
          - type: Attr
      - doc: |-
          NewWithSink builds a Logger forwarding records through cfg.Sink and
          formatting them with cfg.Encoder. It is the port-and-adapter entry point
          for callers that want full control over both the format (Encoder) and
          the transport (Sink); use NewText for the default text-on-stderr wiring.
        in:
          - name: cfg
            type: SinkConfig
        name: NewWithSink
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
      - doc: |-
          NewWriterSink wraps an arbitrary [io.Writer] in a [Sink] so callers can
          compose plain file / network / bytes.Buffer writers with [Multi] for
          fan-out. The returned Sink serialises Write calls through an internal
          mutex (identical contract to [ConsoleStderr] / [ConsoleStdout]).

          Returns [WriterRequired] when w is nil.

          	f, _ := os.OpenFile("/var/log/app.log", os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
          	fileSink, _ := logger.NewWriterSink(f)
          	lg, _ := logger.NewWithSink(logger.SinkConfig{
          	    Sink: logger.Multi(logger.ConsoleStderr(), fileSink),
          	})
        in:
          - name: w
            type: io.Writer
        name: NewWriterSink
        out:
          - name: sink
            type: Sink
          - name: err
            type: error
      - doc: |-
          TextEncoder returns a fresh text Encoder bound to the real system clock.
          Callers passing a custom Encoder to NewWithSink usually want this as a
          starting point — it is the same encoder NewText / Default rely on.
        name: TextEncoder
        out:
          - type: Encoder
      - doc: |-
          TraceContextFromContext reads the span identity carried by ctx and returns
          it in the shape a log record carries.

          It is the adapter between [github.com/kitsunium/sdk/pkg/v1/observe/trace]'s
          SpanContext and the logger's TraceContext: the two identifiers, without the
          flags and the tracestate, because a log line answers "which span produced
          this?" and nothing else.

          An absent, unsampled-and-absent or malformed span context yields the zero
          value, and the encoders then emit no trace_id and no span_id at all — never
          an empty string and never the all-zero identifier, both of which W3C Trace
          Context §3.2.2.3/§3.2.2.4 declare invalid.

          It allocates nothing: the context walk returns a value type, and the two
          identifiers are fixed-size arrays copied by assignment.
        in:
          - name: ctx
            type: context.Context
        name: TraceContextFromContext
        out:
          - type: TraceContext
      - doc: FrameworkVersion returns the linked-in SDK version, or "dev" if unset.
        name: FrameworkVersion
        out:
          - type: string
      - doc: |-
          WithError decomposes err into structured log Attrs so the SDK's dotted-quad
          typed errors become first-class structured data rather than a flat string.

          For an SDK error it emits error.code, error.reason and error.public, then one
          error.trail.<n> Attr per wrap-trail code (newest wrap last). Empty metadata
          fields are skipped. For a plain stdlib error it falls back to a single
          error.message Attr. A nil err yields no Attrs.

          The result is meant to be spread into an emission call, e.g.
          logger.Error(ctx, lg, "op failed", logger.WithError(err)...).
        in:
          - name: err
            type: error
        name: WithError
        out:
          - type: "[]Attr"
      - doc: |-
          NewMulti builds a Logger that fans every record out to all specs, each
          resolved to a Sink by its registered factory and composed through Multi.
          Records are filtered at min (the handler-global level); a spec's own MinLevel
          can restrict an individual writer further.

          Each writer's package MUST be imported for its Name to resolve: blank-import
          pkg/v1/observe/logger/writer for console + file, and third-party/aws/writer/{s3,cloudwatch}
          for the AWS writers. An unresolved Name returns the registry's
          WriterUnknownName; an empty specs list returns WriterSpecInvalid.

          The returned Logger OWNS the writers NewMulti opened — the caller never held
          them — and implements io.Closer to release them: Close drains what an
          asynchronous writer still holds and closes every writer, once, whatever the
          number of calls. Loggers derived with With or WithGroup share the writers and
          own none of them; closing one releases nothing. Until Close, the writers live
          as long as the Logger does, and a file one opened cannot be deleted or
          rotated by another program on Windows:

          	lg, err := logger.NewMulti(logger.LevelInfo, specs...)
          	if err != nil { … }
          	defer lg.(io.Closer).Close()

          	import (
          	    "github.com/kitsunium/sdk/pkg/v1/observe/logger"
          	    _ "github.com/kitsunium/sdk/pkg/v1/observe/logger/writer" // console + file
          	)

          	lg, err := logger.NewMulti(logger.LevelInfo,
          	    logger.WriterSpec{Name: "console", Config: logger.ConsoleConfig{Stream: logger.StreamStderr}},
          	    logger.WriterSpec{Name: "file",    Config: logger.FileConfig{Path: "/var/log/app.log"}},
          	)
        in:
          - name: min
            type: Level
          - name: specs
            type: WriterSpec
        name: NewMulti
        out:
          - name: lg
            type: Logger
          - name: err
            type: error
        variadic: true
    imports:
      console: github.com/kitsunium/sdk/internal/service/observe/logger/sink/console
      corecodec: github.com/kitsunium/sdk/internal/core/data/codec
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      corewriter: github.com/kitsunium/sdk/internal/core/observe/logger/writer
      encoder: github.com/kitsunium/sdk/internal/service/observe/logger/encoder
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
      levelgate: github.com/kitsunium/sdk/internal/service/observe/logger/writer/levelgate
      memory: github.com/kitsunium/sdk/internal/service/observe/logger/sink/memory
      multi: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/multi
      svclogger: github.com/kitsunium/sdk/internal/service/observe/logger
    path: github.com/kitsunium/sdk/pkg/v1/observe/logger
    sentinels:
      - var:
          - code: CodeWriterRequired
            doc: |-
              WriterRequired is returned when NewText is called with Config.Writer==nil.
              Callers that want the "stderr convenience" use Default() instead.
            name: WriterRequired
            private: pkg/v1/observe/logger.NewText called with Config.Writer==nil; supply an io.Writer or use logger.Default()
            public: Logger config requires an explicit writer
            reason: WRITER_REQUIRED
          - code: CodeSinkConfigRequired
            doc: |-
              SinkConfigRequired is returned when NewWithSink is called with
              SinkConfig.Sink==nil. Callers that want a console sink use
              logger.ConsoleStderr / ConsoleStdout or stick to logger.Default()
              for the legacy text-on-stderr wiring.
            name: SinkConfigRequired
            private: pkg/v1/observe/logger.NewWithSink called with SinkConfig.Sink==nil; supply a Sink or use logger.Default()
            public: Logger SinkConfig requires an explicit sink
            reason: SINK_CONFIG_REQUIRED
          - code: CodeWriterSpecInvalid
            doc: |-
              WriterSpecInvalid is returned when NewMulti is called with zero
              WriterSpec entries. Supply at least one named writer (and blank-import
              its package) so the fan-out has a destination.
            name: WriterSpecInvalid
            private: pkg/v1/observe/logger.NewMulti called with no WriterSpec entries; supply at least one named writer
            public: NewMulti requires at least one writer spec
            reason: WRITER_SPEC_INVALID
          - code: CodeTopologyInvalid
            doc: |-
              TopologyInvalid is returned by FromConfig when the config blob cannot be
              decoded, names a writer no imported package has registered, or a writer's
              Factory/DecodeConfig rejected its options. The message is redacted: it
              names only the writer and the failure kind, never a decoded credential or
              option value (the SECRET GATE of ADR 0014 §D5).
            name: TopologyInvalid
            private: "pkg/v1/observe/logger.FromConfig: blob undecodable, unknown writer name, or a writer rejected its options (option values redacted)"
            public: Logger topology config is invalid
            reason: TOPOLOGY_INVALID
    types:
      - doc: |-
          Config carries the construction parameters accepted by NewText.
          Two destination forms are supported — pick the one that fits:

            - Writer single — Writer: w. Records go to that one writer.
            - Writers fan-out — Writers: []io.Writer{a, b, c}. Records broadcast
              to every writer in order; per-branch failures are joined under
              FANOUT_WRITE_FAILED. Use this when you want stderr AND a log file
              in one go (a common ops pattern) without dropping to NewWithSink.

          When BOTH are set, Writers wins and Writer is ignored. Use whichever
          reads more naturally at the call site. Construction returns
          WriterRequired (1.1.0.1) when neither field carries any writer.
        name: Config
        struct:
          fields:
            - doc: |-
                Writer is the single-destination convenience field; nil triggers
                WriterRequired unless Writers carries at least one entry.
              name: Writer
              type: io.Writer
            - doc: |-
                Writers is the multi-destination fan-out field; non-empty wires
                the records through logger.Multi over per-writer console sinks.
                Nil/empty falls back to Writer.
              name: Writers
              type: "[]io.Writer"
            - doc: MinLevel is the minimum severity emitted; zero value is LevelInfo.
              name: MinLevel
              type: Level
      - doc: |-
          SinkConfig carries the construction parameters accepted by NewWithSink.
          A zero-valued SinkConfig{Sink: s} is enough to ship records through s at
          LevelInfo using the default text encoder bound to the real wall clock.
        name: SinkConfig
        struct:
          fields:
            - doc: Sink is the destination transport; nil yields SinkConfigRequired.
              name: Sink
              type: Sink
            - doc: Encoder formats records into bytes; nil falls back to the text encoder.
              name: Encoder
              type: Encoder
            - doc: MinLevel is the minimum severity emitted; zero value is LevelInfo.
              name: MinLevel
              type: Level
      - doc: |-
          TopologyConfig is the decoded logger configuration: a global Level (parsed by
          the same names the level package prints — "debug" / "info" / "warn" /
          "error", case-insensitive, empty defaults to info) and the ordered Writers
          fanned out to. FromConfig unmarshals a config blob into a TopologyConfig via a
          consumer-registered codec, then resolves each entry against the writer
          registry. The Config role suffix marks it a config DTO (KTN-STRUCT-ROLE).
        name: TopologyConfig
        struct:
          fields:
            - doc: Level is the minimum severity emitted, by name; empty defaults to info.
              name: Level
              tag: json:"level" yaml:"level" toml:"level"
              type: string
            - doc: Writers is the ordered set of named writer entries to fan records out to.
              name: Writers
              tag: json:"writers" yaml:"writers" toml:"writers"
              type: "[]WriterEntryConfig"
      - doc: |-
          WriterEntryConfig names one writer in a TopologyConfig and carries its raw
          option map as decoded from the config blob. Name MUST match a writer
          registered via a blank-import; Options is the per-writer option bag handed to
          the writer's Decoder (when it implements one) or passed straight to the
          factory's Open otherwise. Option values are never echoed into an error — the
          SECRET GATE redacts them. The Config role suffix marks it a config DTO
          (KTN-STRUCT-ROLE).
        name: WriterEntryConfig
        struct:
          fields:
            - doc: Name is the registered writer key ("console" / "file" / "s3" / …).
              name: Name
              tag: json:"name" yaml:"name" toml:"name"
              type: string
            - doc: Options is the raw, codec-decoded per-writer option map.
              name: Options
              tag: json:"config" yaml:"config" toml:"config"
              type: map[string]any
    variables:
      - doc: |-
          Version is overridden at build time via

          	go build -ldflags "-X github.com/kitsunium/sdk/pkg/v1/observe/logger.Version=v0.1.0"

          Leave it as the zero value in local dev; FrameworkVersion returns "dev".
        name: Version
        type: string
  - codes:
      - const:
          - doc: |-
              CodeLoggerRequired identifies a NewHandler / New call with a nil Logger.
              The bridge refuses to build a handler that discards silently: its whole
              purpose is to guarantee a single pipeline, and a bridge to nowhere would
              break that guarantee precisely where the caller believed it held.
            name: CodeLoggerRequired
            note: "range: 1.1.1.0 - 1.1.1.255"
            value: "0x01_01_01_01"
        type: errs.Code
    doc: |-
      Package slogbridge — converts slog levels and attributes to their SDK peers.

      Package slogbridge — the slog.Handler that forwards records to an SDK Logger.

      Package slogbridge — range 1.1.1.* (ADR 0005 pkg/v1/observe/logger/slogbridge block).

      Package slogbridge adapts an SDK [logger.Logger] to log/slog so a foreign
      API that accepts only a *slog.Logger emits through the SDK pipeline.

      # Why this package exists

      The SDK logger deliberately does not depend on log/slog: internal/core is
      stdlib-only and its level sub-package states the rule outright ("specifically
      never log/slog"). That keeps the domain free of a foreign vocabulary — but it
      leaves consumers stranded whenever a library types its logging knob as the
      *concrete* *slog.Logger rather than an interface. The MCP Go SDK's
      mcp.ServerOptions.Logger is the canonical example.

      Without a bridge the only way out is a SECOND logger writing to the same
      stream, and that second pipeline is where the damage lives: two level
      thresholds parsed by two different rules, two line formats on one file, and
      "framework_version" stamped on only half the records. This package removes
      the second pipeline. slog becomes a façade over the SDK Logger — one
      threshold, one encoder, one set of sinks, one version stamp.

      slog is confined to this package on purpose. It is an adapter to a foreign
      ecosystem, so it lives at the public edge (ADR 0032); kernel, core and
      service never learn the word.

      # Quick start

      	lg, err := logger.NewText(logger.Config{Writer: os.Stderr, MinLevel: logger.LevelInfo})
      	if err != nil { return err }

      	sl, err := slogbridge.New(lg)
      	if err != nil { return err }

      	srv := mcp.NewServer(impl, &mcp.ServerOptions{Logger: sl})

      Every record the foreign library emits through sl now travels the SDK
      pipeline: filtered at the SDK Logger's threshold, rendered by the SDK
      encoder, decorated with "framework_version".

      # Level mapping is exact

      The two scales coincide by construction — SDK Debug/Info/Warn/Error are
      -4/0/4/8, the same integers slog uses — so the conversion is lossless and
      intermediate values (slog.Level(2)) survive. Only levels outside the int8
      range saturate, since the SDK Level is an int8.

      A single consequence worth stating: the SDK Logger's threshold is now the
      ONLY threshold. A caller who used to build the slog view with its own
      slog.HandlerOptions.Level must move that decision to the SDK Logger's
      MinLevel; the bridge deliberately offers no second knob to disagree with.

      # Faithfulness and its one limit

      Attributes convert by Kind: String, Int64, Uint64, Float64, Bool, Duration
      and Time map onto their SDK peers, keeping the encoders' type-aware
      rendering. slog.KindAny is the deliberate exception — both bundled encoders
      print "?" for an Any payload, so an slog.Any("err", err) routed through it
      would arrive with its value erased. The bridge converts such a value with
      [log/slog.Value.String], which formats it exactly as slog's own handlers do:
      the Go type is lost, where a "?" would lose the type and the value both.

      Groups flatten to dotted keys ("g1.g2.key"), matching what the SDK text and
      JSON encoders already produce for nested attributes. slog's elision rules
      are honoured — an empty Attr is dropped, an empty group NAME inlines its
      members, and a group with no members is dropped. An empty KEY is a different
      thing and keeps its separator ("g."), which is what slog itself prints.
      [log/slog.LogValuer] values are resolved before conversion.

      Two things do NOT cross, both because the SDK's Logger.Log contract carries
      neither. slog.Record.PC is the first: the bridge calls the ordinary Log,
      which captures a program counter at the bridge, so a destination built with
      [logger.WithCaller] reports this package as the source rather than the
      foreign library's own logging call. Do not enable WithCaller on a
      bridged destination — a wrong source is worse than none.

      The second is slog.Record.Time. The SDK's Logger.Log
      contract takes no timestamp, so the record is stamped by the SDK handler's
      clock at emit time instead. For live logging the difference is sub-
      microsecond; for a REPLAYED record (one built now and handled later) the
      original time is lost. Callers replaying records should carry the original
      instant as an explicit attribute.
    functions:
      - doc: |-
          NewHandler returns an slog.Handler that forwards every record to lg.

          A nil lg returns [LoggerRequired] (1.1.1.1) rather than a handler that
          silently discards: this package exists to guarantee one pipeline, and a
          bridge to nowhere would defeat the guarantee at the exact moment a caller
          believed it held.
        in:
          - name: lg
            type: logger.Logger
        name: NewHandler
        out:
          - name: h
            type: slog.Handler
          - name: err
            type: error
      - doc: |-
          New returns a *slog.Logger writing through lg — the one-liner a caller hands
          to a library whose logging knob is typed as the concrete *slog.Logger.

          A nil lg returns [LoggerRequired] (1.1.1.1).
        in:
          - name: lg
            type: logger.Logger
        name: New
        out:
          - name: sl
            type: "*slog.Logger"
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      logger: github.com/kitsunium/sdk/pkg/v1/observe/logger
      slog: log/slog
    path: github.com/kitsunium/sdk/pkg/v1/observe/logger/slogbridge
    sentinels:
      - var:
          - code: CodeLoggerRequired
            doc: |-
              LoggerRequired is returned when NewHandler or New is called with a nil
              Logger. Build the destination first (logger.NewText / NewWithSink /
              Default), then bridge it — there is no "default destination" here, by the
              same reasoning that made NewText refuse to default to stderr (ADR 0002).
            name: LoggerRequired
            private: "pkg/v1/observe/logger/slogbridge: NewHandler/New called with a nil logger.Logger; build one with logger.NewText or logger.Default() first"
            public: slog bridge requires an explicit logger
            reason: LOGGER_REQUIRED
