            type: corelogger.Logger
          - name: err
            type: error
      - in:
          - name: lg
            type: corelogger.Logger
          - name: lv
            type: level.Level
        name: Build
        out:
          - type: Builder
      - in:
          - name: ctx
            type: context.Context
          - name: lg
            type: corelogger.Logger
          - name: lv
            type: level.Level
          - name: msg
            type: string
          - name: attrs
            type: "[]corelogger.AttrValue"
        name: LogAttrs
      - in:
          - name: lg
            type: corelogger.Logger
          - name: owned
