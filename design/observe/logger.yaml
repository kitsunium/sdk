      corewriter: github.com/kitsunium/sdk/internal/core/observe/logger/writer
      encoder: github.com/kitsunium/sdk/internal/service/observe/logger/encoder
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
      memory: github.com/kitsunium/sdk/internal/service/observe/logger/sink/memory
      svclogger: github.com/kitsunium/sdk/internal/service/observe/logger
    path: github.com/kitsunium/sdk/pkg/v1/observe/logger
    sentinels:
      - var:
          - code: CodeWriterRequired
            doc: |-
              WriterRequired is returned when NewText is called with Config.Writer==nil.
              Callers that want the "stderr convenience" use Default() instead.
            name: WriterRequired
            private: pkg/v1/observe/logger.NewText called with Config.Writer==nil; supply an io.Writer or use logger.Default()
            public: Logger config requires an explicit writer
            reason: WRITER_REQUIRED
          - code: CodeSinkConfigRequired
            doc: |-
              SinkConfigRequired is returned when NewWithSink is called with
              SinkConfig.Sink==nil. Callers that want a console sink use
              logger.ConsoleStderr / ConsoleStdout or stick to logger.Default()
              for the legacy text-on-stderr wiring.
            name: SinkConfigRequired
            private: pkg/v1/observe/logger.NewWithSink called with SinkConfig.Sink==nil; supply a Sink or use logger.Default()
            public: Logger SinkConfig requires an explicit sink
            reason: SINK_CONFIG_REQUIRED
          - code: CodeWriterSpecInvalid
            doc: |-
              WriterSpecInvalid is returned when NewMulti is called with zero
              WriterSpec entries. Supply at least one named writer (and blank-import
              its package) so the fan-out has a destination.
            name: WriterSpecInvalid
            private: pkg/v1/observe/logger.NewMulti called with no WriterSpec entries; supply at least one named writer
            public: NewMulti requires at least one writer spec
            reason: WRITER_SPEC_INVALID
          - code: CodeTopologyInvalid
            doc: |-
              TopologyInvalid is returned by FromConfig when the config blob cannot be
              decoded, names a writer no imported package has registered, or a writer's
              Factory/DecodeConfig rejected its options. The message is redacted: it
              names only the writer and the failure kind, never a decoded credential or
              option value (the SECRET GATE of ADR 0014 §D5).
            name: TopologyInvalid
            private: "pkg/v1/observe/logger.FromConfig: blob undecodable, unknown writer name, or a writer rejected its options (option values redacted)"
            public: Logger topology config is invalid
            reason: TOPOLOGY_INVALID
    types:
      - name: Config
