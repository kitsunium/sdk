apiVersion: kit.kitsunium/design/v2
domain: observe/logger/writer/rotfile
packages:
  - codes:
      - const:
          - doc: |-
              CodeRotFileOpenFailed identifies a (re)open whose os.OpenFile invocation
              failed or whose target resolved to a symlink (CWE-59). It fires both at
              construction and on every reopen after a rotation, so the symlink/0600
              hardening re-runs for the freshly created Path.
            name: CodeRotFileOpenFailed
            note: "range: 0.3.27.0 - 0.3.27.255"
            value: "0x00_03_1B_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeRotFileRotateFailed identifies a rotation step that failed — the
              rename shift across the .N backups, the optional gzip compaction, or the
              0600 chmod of a rotated sibling.
            name: CodeRotFileRotateFailed
            value: "0x00_03_1B_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeRotFileWriteFailed identifies a Write whose underlying *os.File
              returned an error; ExitCode defaults to 74 (EX_IOERR).
            name: CodeRotFileWriteFailed
            value: "0x00_03_1B_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeRotFileDecodeFailed identifies a config-map value of an unexpected shape
              while decoding a "rotfile" writer entry from a config file (the Decoder
              path). It is a configuration error (EX_CONFIG 78), distinct from the I/O
              sentinels, and never echoes the offending value (secret gate).
            name: CodeRotFileDecodeFailed
            value: "0x00_03_1B_04"
        type: errs.Code
    doc: |-
      Package rotfile declares the codes and sentinels of the rotating-file log
      writer, internal/service/observe/logger/writer/rotfile: range 0.3.27.*,
      allocated to that engine (ADR 0014 service slot 0x1b) and declared here since
      ADR 0160, so the engine declares none.

      Package rotfile — declares the sentinels returned by the rotating file
      sink's constructor and Write / rotate paths. Each var's name equals its
      errs.Define Reason in SCREAMING_SNAKE form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/writer/rotfile
    sentinels:
      - var:
          - code: CodeRotFileOpenFailed
            doc: |-
              RotFileOpenFailed wraps an os.OpenFile failure (or a refused symlink)
              at construction time and on every reopen after a rotation.
            name: RotFileOpenFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/rotfile: os.OpenFile failed or the path is a symlink"
            public: Rotating file sink could not open the destination file
            reason: ROT_FILE_OPEN_FAILED
          - code: CodeRotFileRotateFailed
            doc: |-
              RotFileRotateFailed wraps a failure during the rename shift, the gzip
              compaction, or the 0600 chmod of a rotated sibling.
            name: RotFileRotateFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/rotfile: a rename, gzip, or chmod step in the rotation cycle failed"
            public: Rotating file sink failed to rotate the destination file
            reason: ROT_FILE_ROTATE_FAILED
          - code: CodeRotFileWriteFailed
            doc: |-
              RotFileWriteFailed wraps the underlying *os.File.Write error at Write
              time.
            name: RotFileWriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/rotfile: underlying *os.File returned an error"
            public: Rotating file write failed
            reason: ROT_FILE_WRITE_FAILED
          - code: CodeRotFileDecodeFailed
            doc: |-
              RotFileDecodeFailed flags a config-map value of an unexpected shape while
              decoding a "rotfile" writer entry from a config file. It is redacted —
              the offending value is never echoed (secret gate).
            name: RotFileDecodeFailed
            options:
              - errs.WithExitCode(exitConfigErr)
            private: "service/observe/logger/writer/rotfile: a config map value had an unexpected shape"
            public: Rotating file sink could not decode its configuration
            reason: ROT_FILE_DECODE_FAILED
  - aliases:
      - doc: |-
          Config configures the "rotfile" writer. It is an alias of
          core/observe/logger/writer.RotFileConfig — see that type for the full field documentation
          (Path / MaxBytes / MaxBackups / Compress / MaxAgeDays / Clock / RotateEvery /
          OnError / MinLevel).
        name: Config
        target: writer.RotFileConfig
    doc: |-
      Package rotfile — backup-name arithmetic and the per-slot move/gzip helpers
      split out of rotate.go so each function stays under KTN-FUNC-MAXLOC.

      Package rotfile — the config Decoder that makes "rotfile" reachable from a
      config file via pkg/v1/observe/logger.FromConfig. Kept in its own file (NOT inlined
      into rotfile.go) so the factory's Open and Decode halves never collide in one
      source. Every helper redacts: a malformed value yields RotFileDecodeFailed
      tagged with the writer name only, never the offending value (secret gate).

      Package rotfile — calendar pruning of rotated siblings (MaxAgeDays), split
      out of rotate.go so each function stays under KTN-FUNC-MAXLOC. The exported
      on-demand Rotate method lives beside its receiver in rotating_sink.go.

      Package rotfile — rotation cycle: threshold check, backup shift, optional
      gzip, and the hardened reopen. Kept out of sink.go so each function stays
      under KTN-FUNC-MAXLOC.

      Package rotfile — the interval-rotation tick body driven by the worker.Every
      daemon wired in newRotatingSink when Config.RotateEvery is positive. Split
      from rotating_sink.go so the daemon's tick logic and its tests sit in their
      own source/test pair.

      Package rotfile — the exported on-demand Rotate method (SIGHUP / logrotate
      integration), split out of rotating_sink.go so the receiver file stays under
      KTN-FUNC-MAXLOC. The calendar-pruning helpers it delegates to live in
      prune.go.

      Package rotfile — rotatingSink (the rotating Sink implementation) plus the
      open/reopen hardening shared with the rotation cycle. Its Config lives in the
      parent-prefixed sibling rotating_sink_config.go (KTN-STRUCT-ONEFILE).

      Package rotfile — Config is the rotfile writer's value type. Since issue #93
      the canonical struct lives in core/observe/logger/writer (RotFileConfig) so the public facade
      (pkg/v1/observe/logger) can re-export it like ConsoleConfig / FileConfig; this alias
      keeps the in-package name (Config) and its type identity unchanged, so Open's
      type-assertion and every existing caller compile untouched.

      Package rotfile registers the "rotfile" writer factory (ADR 0014): a
      size-capped, on-disk file sink that rotates when a write would exceed
      MaxBytes and optionally gzips each rotated file. Importing the package
      (typically a blank import via pkg/v1/observe/logger/writer) self-registers the
      factory so writer.Open("rotfile", Config{…}) resolves.

      Unlike service/observe/logger/writer/file, this sink owns its descriptor directly because it
      must close + rename + reopen Path across a rotation; it cannot delegate to
      the append-only sink/file. The security-critical hardening of sink/file is
      preserved and, crucially, RE-RUN on every reopen: the symlink refusal +
      O_NOFOLLOW + 0600 checks fire each time Path is recreated after a rename/gzip
      cycle, not only at first New (CWE-59). Rotated .N and .N.gz siblings are
      forced to 0600 so a gzip never leaks default permissions.

      Durability note: the rename is not followed by a directory fsync, so a crash
      between rename and reopen can leave Path missing until the next write — an
      accepted crash window for logs, documented rather than paid for on every
      rotation.

      Package rotfile — the wrap points every failure of this writer goes through,
      so each carries its code from internal/core/observe/logger/writer/rotfile.
    imports:
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/internal/service/observe/logger/writer/rotfile
    variables:
      - doc: |-
          Writer is the registered rotfile factory singleton. The blank assignment runs
          writer.Register at package load (no init()), mirroring the codec convention.
        name: Writer
        type: writer.Factory
