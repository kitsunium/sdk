apiVersion: kit.kitsunium/design/v2
domain: observe/logger/writer/nettransport
packages:
  - codes:
      - const:
          - doc: |-
              CodeNetTransportDialFailed identifies a failure to establish the transport at
              Open time: a net.Dial (tcp/udp) error or an unparseable/empty HTTP endpoint.
              ExitCode defaults to 74 (EX_IOERR).
            name: CodeNetTransportDialFailed
            note: "range: 0.3.30.0 - 0.3.30.255"
            value: "0x00_03_1E_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeNetTransportWriteFailed identifies a per-record send failure: the
              underlying net.Conn.Write returned an error, or the HTTP POST did not yield a
              2xx status. ExitCode defaults to 74 (EX_IOERR).
            name: CodeNetTransportWriteFailed
            value: "0x00_03_1E_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/writer/nettransport
    sentinels:
      - var:
          - code: CodeNetTransportDialFailed
            doc: |-
              NetTransportDialFailed wraps a net.Dial failure (tcp/udp) or a rejected
              HTTP endpoint at construction time.
            name: NetTransportDialFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/nettransport: net.Dial failed or the HTTP endpoint was invalid"
            public: Network transport could not establish its destination
            reason: NET_TRANSPORT_DIAL_FAILED
          - code: CodeNetTransportWriteFailed
            doc: |-
              NetTransportWriteFailed wraps a per-record send failure: a net.Conn.Write
              error or a non-2xx HTTP response.
            name: NetTransportWriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/nettransport: the underlying transport returned an error"
            public: Network transport write failed
            reason: NET_TRANSPORT_WRITE_FAILED
  - imports:
      http: net/http
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/internal/service/observe/logger/writer/nettransport
    types:
      - name: NetConfig
        struct:
          fields:
            - name: Address
              type: string
            - name: Dialer
              type: func(network, addr string) (conn net.Conn, err error)
            - name: HTTPClient
              type: "*http.Client"
            - name: MinLevel
              type: level.Level
            - name: BufferSize
              type: int
            - name: OnDrop
              type: func(dropped int)
            - name: OnError
              type: func(err error)
    variables:
      - name: WriterTCP
        type: writer.Factory
      - name: WriterUDP
        type: writer.Factory
      - name: WriterHTTP
        type: writer.Factory
