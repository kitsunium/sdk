apiVersion: kit.kitsunium/design/v2
domain: observe/logger/writer/journald
packages:
  - codes:
      - const:
          - doc: |-
              CodeJournaldOpenFailed identifies a failure to connect the unix-datagram
              socket at Open time (the journald socket is absent or not connectable).
              ExitCode defaults to 74 (EX_IOERR).
            name: CodeJournaldOpenFailed
            note: "range: 0.3.31.0 - 0.3.31.255"
            value: "0x00_03_1F_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeJournaldWriteFailed identifies a datagram send failure on the journald
              socket. ExitCode defaults to 74 (EX_IOERR).
            name: CodeJournaldWriteFailed
            value: "0x00_03_1F_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/writer/journald
    sentinels:
      - var:
          - code: CodeJournaldOpenFailed
            doc: JournaldOpenFailed wraps a failure to connect the unix-datagram socket.
            name: JournaldOpenFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/journald: connecting the unix-datagram socket failed"
            public: Journald sink could not connect the journal socket
            reason: JOURNALD_OPEN_FAILED
          - code: CodeJournaldWriteFailed
            doc: JournaldWriteFailed wraps a datagram send failure on the journald socket.
            name: JournaldWriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/writer/journald: the unix-datagram socket returned an error"
            public: Journald sink write failed
            reason: JOURNALD_WRITE_FAILED
  - imports:
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/internal/service/observe/logger/writer/journald
    types:
      - name: Config
        struct:
          fields:
            - name: SocketPath
              type: string
            - name: Dialer
              type: func(network, addr string) (conn net.Conn, err error)
            - name: MinLevel
              type: level.Level
            - name: BufferSize
              type: int
            - name: OnDrop
              type: func(dropped int)
            - name: OnError
              type: func(err error)
    variables:
      - name: Writer
        type: writer.Factory
