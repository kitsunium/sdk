apiVersion: kit.kitsunium/design/v2
domain: observe/logger/sink/syslog
packages:
  - codes:
      - const:
          - doc: CodeSyslogAddrEmpty identifies a New call made with an empty address.
            name: CodeSyslogAddrEmpty
            note: "range: 0.3.15.0 - 0.3.15.255"
            value: "0x00_03_0F_01"
        type: errs.Code
      - const:
          - doc: CodeSyslogDialFailed identifies a New call whose net.Dial failed.
            name: CodeSyslogDialFailed
            value: "0x00_03_0F_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeSyslogWriteFailed identifies a Write call whose underlying net.Conn
              returned a non-nil error; ExitCode defaults to 74 (EX_IOERR) for this case.
            name: CodeSyslogWriteFailed
            value: "0x00_03_0F_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeSyslogCloseFailed identifies a Close call whose net.Conn.Close returned
              an error; surfaces network teardown failures so callers can react.
            name: CodeSyslogCloseFailed
            value: "0x00_03_0F_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeSyslogProtoInvalid identifies a New call with an unsupported network.
              Only "udp" and "tcp" are accepted today.
            name: CodeSyslogProtoInvalid
            value: "0x00_03_0F_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeSyslogCtxCancelled identifies a Write or Flush call whose context was
              already done. Wraps the stdlib context error so the typed-errors-only SDK
              rule is satisfied and consumers can HasCode / errors.Is against it.
            name: CodeSyslogCtxCancelled
            value: "0x00_03_0F_06"
        type: errs.Code
    doc: |-
      Package syslog declares the codes and sentinels of the logger's syslog sink,
      internal/service/observe/logger/sink/syslog: range 0.3.15.*, allocated to
      that engine (ADR 0005 service/observe/logger/sink/syslog block) and declared
      here since ADR 0160, so the engine declares none.

      Package syslog — declares the sentinels returned by the syslog
      Sink. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE
      form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/sink/syslog
    sentinels:
      - var:
          - code: CodeSyslogAddrEmpty
            doc: AddrEmpty is returned when New receives an empty network address.
            name: AddrEmpty
            private: service/observe/logger/sink/syslog.New called with empty address
            public: Syslog sink requires a non-empty address
            reason: SYSLOG_ADDR_EMPTY
          - code: CodeSyslogProtoInvalid
            doc: ProtoInvalid is returned when New receives an unsupported network.
            name: ProtoInvalid
            private: service/observe/logger/sink/syslog.New called with unsupported network
            public: Syslog sink supports only 'udp' or 'tcp'
            reason: SYSLOG_PROTO_INVALID
          - code: CodeSyslogDialFailed
            doc: DialFailed wraps a net.Dial failure at construction time.
            name: DialFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "service/observe/logger/sink/syslog.New: net.Dial returned an error"
            public: Syslog sink could not dial the destination
            reason: SYSLOG_DIAL_FAILED
          - code: CodeSyslogWriteFailed
            doc: WriteFailed wraps the underlying net.Conn.Write error at Write time.
            name: WriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: service/observe/logger/sink/syslog.Write underlying net.Conn returned an error
            public: Syslog write failed
            reason: SYSLOG_WRITE_FAILED
          - code: CodeSyslogCloseFailed
            doc: CloseFailed wraps the underlying net.Conn.Close error at Close time.
            name: CloseFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: service/observe/logger/sink/syslog.Close underlying net.Conn.Close returned an error
            public: Syslog close failed
            reason: SYSLOG_CLOSE_FAILED
          - code: CodeSyslogCtxCancelled
            doc: |-
              CtxCancelled wraps a context that was already done when Write or
              Flush was entered. Provided as a typed sentinel so consumers match
              via HasCode / errors.Is without reaching for stdlib context errors.
            name: CtxCancelled
            private: service/observe/logger/sink/syslog.Write or Flush saw a cancelled context
            public: Syslog sink aborted due to cancellation
            reason: SYSLOG_CTX_CANCELLED
  - doc: |-
      Package syslog — holds the Config struct consumed by
      NewWithConfig. Pulled into its own file per the SDK's
      one-exported-struct-per-file convention.

      Package syslog — computes the RFC5424 priority value
      (facility * 8 + severity) consumed by the framing layer. Pulled into
      its own file so syslog_sink.go stays focused on the Sink contract.

      Package syslog implements a network sink that ships records to a syslog
      daemon via UDP or TCP. The wire format is a minimal RFC5424 envelope:

      	<PRI>1 - - - - - - <payload>

      PRI is computed from the record's level + the default USER facility.
      Hostname, app-name, procid, msgid, and structured-data slots are fixed
      to "-" to keep the producer side allocation-friendly; consumers that
      need richer envelopes wrap this sink with their own framing.

      Use case: ship logs to journald / rsyslog / a central syslog collector
      over the standard 514/UDP port.
    functions:
      - doc: |-
          New dials addr over network (udp / tcp) using net.Dial and returns a
          syslog Sink. The connection lifetime is owned by the sink — Close
          releases it. SECURITY: addr is passed straight to net.Dial. When addr
          is consumer-controlled (env var, config, API input), prefer
          NewWithConfig with a Dialer that enforces an allowlist so an attacker
          cannot target internal services (169.254.169.254, localhost, etc.).
        in:
          - name: network
          - name: addr
            type: string
        name: New
        out:
          - name: sink
            type: corelogger.Sink
          - name: err
            type: error
      - doc: |-
          NewWithConfig dials addr over network (udp / tcp) using cfg.Dialer (or
          net.Dial when cfg.Dialer is nil) and returns a syslog Sink. Recommended
          constructor when addr might be consumer-controlled — plug an allowlist
          dialer to defuse SSRF.
        in:
          - name: network
          - name: addr
            type: string
          - name: cfg
            type: Config
        name: NewWithConfig
        out:
          - name: sink
            type: corelogger.Sink
          - name: err
            type: error
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
    path: github.com/kitsunium/sdk/internal/service/observe/logger/sink/syslog
    types:
      - doc: |-
          Config tunes the syslog sink at construction time. Every field is
          optional — the zero-value Config produces a sink using net.Dial as the
          dialer, which is the pre-existing behaviour preserved by New.
        name: Config
        struct:
          fields:
            - doc: |-
                Dialer, when non-nil, replaces net.Dial for the connection setup.
                Callers whose operational environment exposes a hostile network
                surface (e.g. a public-facing admin endpoint that takes a user-
                controllable syslog destination) plug an allowlisted dialer here
                to prevent SSRF against internal services or cloud-metadata
                endpoints (CWE-918). Default nil preserves legacy net.Dial.
              name: Dialer
              type: func(network, addr string) (conn net.Conn, err error)
