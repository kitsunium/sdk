apiVersion: kit.kitsunium/design/v2
domain: observe/logger/sink/console
packages:
  - codes:
      - const:
          - doc: CodeWriterNil identifies a New call made with a nil io.Writer.
            name: CodeWriterNil
            note: "range: 0.3.13.0 - 0.3.13.255"
            value: "0x00_03_0D_01"
        type: errs.Code
      - const:
          - comment: 0.3.13.10 (serial 10)
            doc: CodeCtxCancelled identifies a Write call whose context was already done.
            name: CodeCtxCancelled
            value: "0x00_03_0D_0A"
        type: errs.Code
      - const:
          - comment: 0.3.13.20 (serial 20)
            doc: |-
              CodeWriteFailed identifies a Write call whose underlying io.Writer
              returned a non-nil error; ExitCode defaults to 74 (EX_IOERR) for this case.
            name: CodeWriteFailed
            value: "0x00_03_0D_14"
        type: errs.Code
    doc: |-
      Package console declares the codes and sentinels of the logger's console
      sink, internal/service/observe/logger/sink/console: range 0.3.13.*, allocated
      to that engine (ADR 0005 service/observe/logger/sink/console block) and
      declared here since ADR 0160, so the engine declares none.

      Package console — declares the sentinels the console sink's constructor and
      Write method return. Each var's name equals its errs.Define Reason in
      SCREAMING_SNAKE form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/sink/console
    sentinels:
      - var:
          - code: CodeWriterNil
            doc: WriterNil is returned when New receives a nil io.Writer.
            name: WriterNil
            private: service/observe/logger/sink/console.New called with nil io.Writer
            public: Console sink requires a non-nil writer
            reason: WRITER_NIL
          - code: CodeCtxCancelled
            doc: CtxCancelled wraps a cancelled context at Write time.
            name: CtxCancelled
            private: service/observe/logger/sink/console.Write invoked with cancelled context
            public: Logging aborted due to cancellation
            reason: CTX_CANCELLED
          - code: CodeWriteFailed
            doc: WriteFailed wraps the underlying writer's error at Write time.
            name: WriteFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: service/observe/logger/sink/console.Write underlying io.Writer returned an error
            public: Console write failed
            reason: WRITE_FAILED
  - doc: |-
      Package console implements a Sink that writes formatted records onto an
      io.Writer (typically os.Stdout or os.Stderr) under a local mutex so
      concurrent goroutines emit atomic lines. It is the default Sink shipped
      by pkg/v1/observe/logger.Default.

      The console sink intentionally ignores the originating RecordEvent — it
      just streams the encoder's output verbatim. Sinks that need structured
      metadata (CloudWatch, S3, Kafka) read it from r in their own packages.
    functions:
      - doc: |-
          New constructs a Sink that writes to w. Every Write call acquires the
          internal mutex so concurrent goroutines emit atomic lines.
        in:
          - name: w
            type: io.Writer
        name: New
        out:
          - name: sink
            type: corelogger.Sink
          - name: err
            type: error
      - doc: NewStderr is a convenience constructor binding the sink to os.Stderr.
        impl: newStderr
        name: NewStderr
        out:
          - type: corelogger.Sink
      - doc: NewStdout is a convenience constructor binding the sink to os.Stdout.
        impl: newStdout
        name: NewStdout
        out:
          - type: corelogger.Sink
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
    path: github.com/kitsunium/sdk/internal/service/observe/logger/sink/console
