apiVersion: kit.kitsunium/design/v2
domain: observe/logger/middleware/failover
packages:
  - codes:
      - const:
          - doc: |-
              CodeFailoverExhausted identifies a Write call where every downstream
              sink in the failover chain returned a non-nil error. The sentinel wraps
              errors.Join of the per-sink failures so callers can inspect each cause.
            name: CodeFailoverExhausted
            note: "range: 0.3.19.0 - 0.3.19.255"
            value: "0x00_03_13_01"
        type: errs.Code
      - const:
          - doc: CodeFailoverEmpty identifies a New call made with zero downstream sinks.
            name: CodeFailoverEmpty
            value: "0x00_03_13_02"
        type: errs.Code
    doc: |-
      Package failover declares the codes and sentinels of the logger's failover
      middleware, internal/service/observe/logger/middleware/failover: range
      0.3.19.*, allocated to that engine (ADR 0005
      service/observe/logger/middleware/failover block) and declared here since ADR
      0160, so the engine declares none.

      Package failover — declares the sentinels returned by the
      failover Sink. Each var's name equals its errs.Define Reason in
      SCREAMING_SNAKE form.
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/middleware/failover
    sentinels:
      - var:
          - code: CodeFailoverExhausted
            doc: |-
              Exhausted wraps an errors.Join of every per-sink failure when the
              failover chain has tried every downstream Sink without success.
            name: Exhausted
            private: service/observe/logger/middleware/failover.Write tried every downstream sink and aggregated their errors
            public: All failover sinks returned an error
            reason: FAILOVER_EXHAUSTED
          - code: CodeFailoverEmpty
            doc: Empty is returned when New is invoked without any downstream sinks.
            name: Empty
            private: service/observe/logger/middleware/failover.New called with zero sinks
            public: Failover requires at least one downstream sink
            reason: FAILOVER_EMPTY
  - doc: |-
      Package failover implements a sequential-retry Sink that tries downstream
      sinks in order until one succeeds. The first successful Write returns
      nil; if every sink fails, Write returns Exhausted wrapping an
      errors.Join of the per-sink failures.

      Use case: emit logs to a primary collector with a local file as a
      fallback so logs survive a network outage.
    functions:
      - doc: New constructs a failover Sink trying each branch in order.
        in:
          - name: branches
            type: corelogger.Sink
        name: New
        out:
          - name: sink
            type: corelogger.Sink
          - name: err
            type: error
        variadic: true
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
    path: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/failover
