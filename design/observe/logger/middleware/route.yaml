apiVersion: kit.kitsunium/design/v2
domain: observe/logger/middleware/route
packages:
  - codes:
      - const:
          - doc: |-
              CodeRouteNoMatch identifies a Write call whose record matched none of
              the registered predicates. The default sink (when configured) handles
              this case; without a default the Write returns this sentinel.
            name: CodeRouteNoMatch
            note: "range: 0.3.18.0 - 0.3.18.255"
            value: "0x00_03_12_01"
        type: errs.Code
    doc: |-
      Package route declares the codes and sentinels of the logger's routing
      middleware, internal/service/observe/logger/middleware/route: range
      0.3.18.*, allocated to that engine (ADR 0005 service/observe/logger/middleware/route
      block) and declared here since ADR 0160, so the engine declares none.

      Package route — declares the sentinel the routing Sink returns. Its Reason
      is the namespaced form of its code's name (ADR 0006).
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/middleware/route
    sentinels:
      - var:
          - code: CodeRouteNoMatch
            doc: |-
              NoMatch is returned by Write when no predicate matched the record AND
              no default sink was configured. Callers that want a catch-all should
              pass a default sink to New so writes never silently disappear.
            name: NoMatch
            private: service/observe/logger/middleware/route.Write found no matching predicate and no default sink
            public: No route predicate matched the record
            reason: ROUTE_NO_MATCH
  - doc: |-
      Package route implements a predicate-based router Sink. Records are
      dispatched to the first downstream sink whose Predicate returns true
      for the record. When no predicate matches, the optional fallback sink
      receives the write; without a fallback, Write returns NoMatch.

      Use case: send error-level records to a remote alerting drain while
      keeping info-level records local.

      Package route — declares the Params struct that pairs a predicate with a
      downstream sink. Sibling of router_sink.go so the router file stays
      focused on the Sink contract.
    functions:
      - doc: |-
          New constructs a router Sink from the supplied entries and optional
          fallback Sink. The entries slice is defensively copied so post-
          construction mutation by the caller is harmless.
        in:
          - name: fallback
            type: corelogger.Sink
          - name: entries
            type: Params
        name: New
        out:
          - type: corelogger.Sink
        variadic: true
      - doc: LevelAtLeast returns a Predicate matching records at or above min.
        in:
          - name: min
            type: level.Level
        name: LevelAtLeast
        out:
          - type: Predicate
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
    path: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/route
    types:
      - decl: true
        doc: |-
          Predicate decides whether a route should accept a given record. The
          router evaluates predicates in declaration order; the first true wins.
        name: Predicate
        underlying: func(r corelogger.RecordEvent) (match bool)
      - decl: true
        doc: |-
          Params binds a Predicate to a downstream Sink. Held verbatim by the
          router; callers MUST NOT mutate the Sink reference after registration.
          Read at call sites as route.Params{When: …, Sink: …}.
        name: Params
        struct:
          fields:
            - doc: When decides whether this entry accepts the record.
              name: When
              type: Predicate
            - doc: Sink receives the matching record.
              name: Sink
              type: corelogger.Sink
