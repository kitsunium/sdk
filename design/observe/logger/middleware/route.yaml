apiVersion: kit.kitsunium/design/v2
domain: observe/logger/middleware/route
packages:
  - constants:
      - name: CodeRouteNoMatch
        type: errs.Code
        value: "0x00_03_12_01"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/observe/logger/middleware/route
    variables:
      - name: NoMatch
        type: "*errs.Error"
  - functions:
      - in:
          - name: fallback
            type: corelogger.Sink
          - name: entries
            type: Params
        name: New
        out:
          - type: corelogger.Sink
        variadic: true
      - in:
          - name: min
            type: level.Level
        name: LevelAtLeast
        out:
          - type: Predicate
    imports:
      corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
      level: github.com/kitsunium/sdk/internal/core/observe/logger/level
    path: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/route
    types:
      - name: Predicate
        underlying: func(r corelogger.RecordEvent) (match bool)
      - name: Params
        struct:
          fields:
            - name: When
              type: Predicate
            - name: Sink
              type: corelogger.Sink
