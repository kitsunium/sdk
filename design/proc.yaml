            - name: Stdout
              type: io.Writer
            - name: Stderr
              type: io.Writer
            - name: Stdin
              type: io.Reader
            - name: ExtraFiles
              type: "[]*os.File"
      - methods:
          - name: String
            out:
              - type: string
            recv: value
          - name: Known
            out:
              - type: bool
            recv: value
        name: StdioMode
        underlying: uint8
    variables:
      - name: UnsupportedPlatform
        type: "*errs.Error"
      - name: InvalidSpec
        type: "*errs.Error"
      - name: UnknownUser
        type: "*errs.Error"
      - name: UnknownGroup
