apiVersion: kit.kitsunium/design/v2
domain: proc
packages:
  - codes:
      - const:
          - doc: |-
              CodeUnsupportedPlatform identifies a primitive invoked on an operating system
              that cannot provide it (e.g. cgroup or subreaper off Linux). The no-op stub
              returns it instead of panicking.
            name: CodeUnsupportedPlatform
            note: "range: 0.2.6.0 - 0.2.6.255"
            value: "0x00_02_06_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidSpec identifies a Start call whose Spec is malformed — an empty
              Path or a contradictory attribute combination.
            name: CodeInvalidSpec
            value: "0x00_02_06_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownUser identifies a Spec naming a User that does not resolve to a uid
              on the host.
            name: CodeUnknownUser
            value: "0x00_02_06_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownGroup identifies a Spec naming a Group or supplementary group that
              does not resolve to a gid on the host.
            name: CodeUnknownGroup
            value: "0x00_02_06_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeSpawnFailed identifies a fork/exec failure when starting the process — a
              missing binary, a permission denial, or a kernel resource fault.
            name: CodeSpawnFailed
            value: "0x00_02_06_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeWaitFailed identifies a wait4 failure while reaping the leader — a host
              fault, not a normal non-zero exit (which is reported via ExitValue).
            name: CodeWaitFailed
            value: "0x00_02_06_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeSignalFailed identifies a kill(2) failure delivering a signal to a process
              or process group.
            name: CodeSignalFailed
            value: "0x00_02_06_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeStopFailed identifies a graceful-stop that could not terminate the process
              group even after escalating to SIGKILL.
            name: CodeStopFailed
            value: "0x00_02_06_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownSignal identifies a Parse call whose name or number is not in the
              platform signal table.
            name: CodeUnknownSignal
            value: "0x00_02_06_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeRelayFailed identifies a Relay that could not forward a received signal to
              its target process or group.
            name: CodeRelayFailed
            value: "0x00_02_06_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeSubreaperFailed identifies a prctl(PR_SET_CHILD_SUBREAPER) failure when
              arming subreaper semantics for a non-PID1 supervisor.
            name: CodeSubreaperFailed
            value: "0x00_02_06_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeReapFailed identifies a wait4 failure during a reap sweep other than the
              benign "no children" condition.
            name: CodeReapFailed
            value: "0x00_02_06_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownResource identifies an Apply call naming a Resource the platform
              does not map to an RLIMIT_* constant.
            name: CodeUnknownResource
            value: "0x00_02_06_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeRlimitFailed identifies a setrlimit(2) failure applying a per-process
              resource limit.
            name: CodeRlimitFailed
            value: "0x00_02_06_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeCgroupUnavailable identifies a cgroup operation attempted where cgroup v2
              is not mounted or not delegated to the caller.
            name: CodeCgroupUnavailable
            value: "0x00_02_06_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeCgroupCreateFailed identifies a failure creating a control-group directory
              under the cgroup v2 hierarchy.
            name: CodeCgroupCreateFailed
            value: "0x00_02_06_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeCgroupWriteFailed identifies a failure writing a controller file
              (memory.max, cpu.max, pids.max, io.max, cgroup.procs).
            name: CodeCgroupWriteFailed
            value: "0x00_02_06_11"
        type: errs.Code
      - const:
          - doc: CodeCgroupDeleteFailed identifies a failure removing a control-group directory.
            name: CodeCgroupDeleteFailed
            value: "0x00_02_06_12"
        type: errs.Code
      - const:
          - doc: |-
              CodeNotifyFailed identifies a failure sending an sd_notify datagram to
              $NOTIFY_SOCKET (distinct from the no-op when the variable is unset).
            name: CodeNotifyFailed
            value: "0x00_02_06_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeListenFailed identifies a failure creating or binding the supervisor-side
              sd_notify datagram socket.
            name: CodeListenFailed
            value: "0x00_02_06_14"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidNotification identifies a received sd_notify datagram that could not
              be parsed into NAME=value fields.
            name: CodeInvalidNotification
            value: "0x00_02_06_15"
        type: errs.Code
      - const:
          - doc: |-
              CodeCredentialMismatch identifies a received datagram whose kernel-verified
              sender credentials did not match the expected supervised process.
            name: CodeCredentialMismatch
            value: "0x00_02_06_16"
        type: errs.Code
      - const:
          - doc: |-
              CodeStdioCaptureFailed identifies a StdioCapture spawn whose output copier
              could not deliver the child's stdout/stderr to the caller's writer (the writer
              itself returned an error). Surfaced from Wait when the process otherwise
              exited cleanly.
            name: CodeStdioCaptureFailed
            value: "0x00_02_06_17"
        type: errs.Code
      - const:
          - doc: |-
              CodeStdioDrainTimeout identifies a Wait whose StdioCapture copiers had not
              reached EOF when Spec.DrainGrace closed after the exit: a process the child
              left behind still held its output pipe. The ExitValue is the real one.
            name: CodeStdioDrainTimeout
            value: "0x00_02_06_18"
        type: errs.Code
      - const:
          - doc: |-
              CodeHandleUnavailable identifies a ProcessHandle operation on a process whose
              race-free kernel handle — a pidfd on Linux, a process HANDLE on Windows — could
              not be obtained: a kernel without pidfd, or a filter that refuses it.
            name: CodeHandleUnavailable
            value: "0x00_02_06_19"
        type: errs.Code
      - const:
          - doc: |-
              CodePTYFailed identifies a pseudo-terminal that could not be allocated,
              unlocked, opened or resized for a StdioPTY spawn, or a Terminal operation on
              a child that has none.
            name: CodePTYFailed
            value: "0x00_02_06_1A"
        type: errs.Code
      - const:
          - doc: |-
              CodeMemlimitMisconfigured identifies a soft-memory-limit configuration
              memlimit cannot honour: a headroom outside (0, 100] percent, or a negative
              floor.
            name: CodeMemlimitMisconfigured
            value: "0x00_02_06_1C"
        type: errs.Code
      - const:
          - doc: |-
              CodeCgroupReadFailed identifies a control group whose counters could not be
              read: its own files are gone (the group was deleted) or unreadable.
            name: CodeCgroupReadFailed
            value: "0x00_02_06_1D"
        type: errs.Code
      - const:
          - doc: |-
              CodeSandboxFailed identifies a step of Spec.Sandbox that failed in the child
              before its program ran — a mount, the pivot, a capability, the identity,
              Landlock, the seccomp filter —: the program never ran.
            name: CodeSandboxFailed
            value: "0x00_02_06_1E"
        type: errs.Code
      - const:
          - doc: |-
              CodeReservedEnv identifies a Spec whose Env names a variable of the SDK's own
              spawn protocol — a key beginning __KITSUNIUM_SDK_PROC_, in any case — through
              which a caller could otherwise override what the spawn tells its child.
            name: CodeReservedEnv
            value: "0x00_02_06_1F"
        type: errs.Code
      - const:
          - doc: |-
              CodePIDFileRefused identifies a PID file AttachPIDFile could not read safely:
              a relative path, a symbolic link at its end, a component that is no
              directory, a file that is not regular, or content that is not one PID.
            name: CodePIDFileRefused
            value: "0x00_02_06_20"
        type: errs.Code
      - const:
          - doc: |-
              CodeAdoptionRefused identifies a process Attach or AttachPIDFile may not
              adopt: PID 1, this process, one outside the cgroup or the users asked for,
              or one named by a PID file nobody but root or this process's user vouches
              for and with no bound given.
            name: CodeAdoptionRefused
            value: "0x00_02_06_21"
        type: errs.Code
      - const:
          - doc: |-
              CodeStatusUnknown identifies the end of an attached process: it was not this
              process's child, so it is gone with an exit status nobody here can read.
            name: CodeStatusUnknown
            value: "0x00_02_06_22"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidFDName identifies a descriptor name LISTEN_FDNAMES cannot carry:
              longer than systemd's FDNAME_MAX, or a byte that is not printable ASCII, or a
              ':'.
            name: CodeInvalidFDName
            value: "0x00_02_06_23"
        type: errs.Code
      - const:
          - doc: |-
              CodeSandboxUnavailable identifies a part of Spec.Sandbox the running kernel
              cannot apply — Landlock or one of its rights, seccomp, a namespace, procfs,
              memfd_create, mount_setattr —, refused before the fork.
            name: CodeSandboxUnavailable
            value: "0x00_02_06_24"
        type: errs.Code
      - const:
          - doc: |-
              CodeCgroupControllerAbsent identifies a cgroup v2 controller asked of
              a group whose parent does not offer it: absent from the root's
              cgroup.controllers, or refused by the kernel when it was enabled.
            name: CodeCgroupControllerAbsent
            value: "0x00_02_06_25"
        type: errs.Code
    constants:
      - doc: |-
          LimitInfinity is the soft/hard value meaning "no limit" (RLIM_INFINITY). Use
          it in a LimitValue to lift a resource ceiling rather than setting a number.
        name: LimitInfinity
        type: uint64
        value: "18446744073709551615"
      - doc: |-
          MemoryBoundHigh reports that a memory.high file bound the derivation: the
          throttle above which the kernel reclaims and slows the group's allocations,
          long before memory.max would kill it.

          The run starts at iota+1 so the zero stays unminted — see the type comment.
        name: MemoryBoundHigh
        type: MemoryBound
        value: "1"
      - doc: |-
          MemoryBoundMax reports that a hard cap bound the derivation: a cgroup v2
          memory.max file, or cgroup v1's memory.limit_in_bytes — v1 has no throttle
          to read beside it.
        name: MemoryBoundMax
        type: MemoryBound
        value: "2"
      - doc: |-
          MemorySourceOperator reports that GOMEMLIMIT carried a non-empty value.
          The Go runtime has already applied it and the derivation stands aside:
          overriding an operator's explicit decision would contradict them silently.

          The run starts at iota+1 so the zero stays unminted — see the type comment.
        name: MemorySourceOperator
        type: MemorySource
        value: "1"
      - doc: |-
          MemorySourceUnconstrained reports that no control group governing this
          process declares a memory cap: not containerised, capped at "max", or not
          Linux at all. There is nothing to derive a limit from.
        name: MemorySourceUnconstrained
        type: MemorySource
        value: "2"
      - doc: |-
          MemorySourceBelowFloor reports that a cap was found but the limit derived
          from it fell under the usable floor. Holding the runtime beneath it would
          spin the collector continuously without averting the kill, so the
          derivation declines rather than applying a limit it expects to hurt.
        name: MemorySourceBelowFloor
        type: MemorySource
        value: "3"
      - doc: |-
          MemorySourceCgroup reports the only outcome that yields a limit: a real
          cap was read from the control-group hierarchy and the derived value is
          usable.
        name: MemorySourceCgroup
        type: MemorySource
        value: "4"
      - doc: "ResourceUnknown is the reserved zero value: no resource selected."
        name: ResourceUnknown
        type: Resource
        value: "0"
      - doc: |-
          ResourceNoFile limits the highest open file descriptor (RLIMIT_NOFILE),
          mapping systemd's LimitNOFILE=. A child spawned without it gets the
          supervisor's ORIGINAL soft limit, not the one the Go runtime raised at start,
          unless rlimit.KeepRaisedNoFile was called.
        name: ResourceNoFile
        type: Resource
        value: "1"
      - doc: |-
          ResourceNProc limits the number of processes for the real user id
          (RLIMIT_NPROC), mapping systemd's LimitNPROC=.
        name: ResourceNProc
        type: Resource
        value: "2"
      - doc: |-
          ResourceCore limits the size of a core dump in bytes (RLIMIT_CORE),
          mapping systemd's LimitCORE=.
        name: ResourceCore
        type: Resource
        value: "3"
      - doc: |-
          ResourceAS limits the process virtual address-space size (RLIMIT_AS),
          mapping systemd's LimitAS=.
        name: ResourceAS
        type: Resource
        value: "4"
      - doc: |-
          ResourceCPU limits CPU time in seconds (RLIMIT_CPU), mapping systemd's
          LimitCPU=.
        name: ResourceCPU
        type: Resource
        value: "5"
      - doc: |-
          ResourceFSize limits the largest file the process may create in bytes
          (RLIMIT_FSIZE), mapping systemd's LimitFSIZE=.
        name: ResourceFSize
        type: Resource
        value: "6"
      - doc: |-
          ResourceData limits the process data-segment size (RLIMIT_DATA), mapping
          systemd's LimitDATA=.
        name: ResourceData
        type: Resource
        value: "7"
      - doc: |-
          ResourceStack limits the process stack size (RLIMIT_STACK), mapping
          systemd's LimitSTACK=.
        name: ResourceStack
        type: Resource
        value: "8"
      - doc: |-
          ResourceMemLock limits bytes that may be locked into RAM (RLIMIT_MEMLOCK),
          mapping systemd's LimitMEMLOCK=.
        name: ResourceMemLock
        type: Resource
        value: "9"
      - doc: |-
          StdioInherit shares the parent's stdin/stdout/stderr with the child — the
          default, and the only behaviour that existed before per-process wiring.
        name: StdioInherit
        type: StdioMode
        value: "0"
      - doc: |-
          StdioNull connects every stream to the platform null device: the child's
          output is discarded and its stdin returns EOF immediately.
        name: StdioNull
        type: StdioMode
        value: "1"
      - doc: |-
          StdioCapture connects the child to the Spec's Stdout/Stderr writers and
          Stdin reader; a nil writer or reader for a given stream falls back to the
          null device for that one stream.
        name: StdioCapture
        type: StdioMode
        value: "2"
      - doc: |-
          StdioPTY connects the child's stdin, stdout and stderr to the slave side of a
          new pseudo-terminal, which becomes its controlling terminal in a new session;
          the master is the handle's Terminal.TTY. Linux, darwin, FreeBSD and OpenBSD;
          every other platform refuses it with UnsupportedPlatform before spawning.
        name: StdioPTY
        type: StdioMode
        value: "3"
      - doc: SchedOther is the normal time-sharing policy (SCHED_OTHER) — the zero value.
        name: SchedOther
        type: SchedPolicy
        value: "0"
      - doc: SchedFIFO is the first-in first-out realtime policy (SCHED_FIFO).
        name: SchedFIFO
        type: SchedPolicy
        value: "1"
      - doc: SchedRR is the round-robin realtime policy (SCHED_RR).
        name: SchedRR
        type: SchedPolicy
        value: "2"
      - doc: SchedBatch is the policy for CPU-bound batch work (SCHED_BATCH).
        name: SchedBatch
        type: SchedPolicy
        value: "3"
      - doc: SchedIdle runs the child only when nothing else wants the CPU (SCHED_IDLE).
        name: SchedIdle
        type: SchedPolicy
        value: "5"
      - doc: FDsSealed gives the child no descriptor of the supervisor's past its stdio and ExtraFiles — the zero value.
        name: FDsSealed
        type: FDPolicy
        value: "0"
      - doc: FDsInherited lets the child inherit every descriptor of the supervisor that lacks close-on-exec.
        name: FDsInherited
        type: FDPolicy
        value: "1"
      - doc: IOClassNone sets no I/O class, the kernel deriving one from the CPU niceness — the zero value.
        name: IOClassNone
        type: IOClass
        value: "0"
      - doc: IOClassRealTime is the realtime I/O class (IOPRIO_CLASS_RT).
        name: IOClassRealTime
        type: IOClass
        value: "1"
      - doc: IOClassBestEffort is the best-effort I/O class (IOPRIO_CLASS_BE).
        name: IOClassBestEffort
        type: IOClass
        value: "2"
      - doc: IOClassIdle gets I/O only when no other process wants the disk (IOPRIO_CLASS_IDLE).
        name: IOClassIdle
        type: IOClass
        value: "3"
      - doc: "ControllerCPU distributes CPU time: cpu.weight, cpu.max, cpu.max.burst."
        name: ControllerCPU
        type: Controller
        value: "1"
      - doc: |-
          ControllerCPUSet pins tasks to CPUs and memory nodes: cpuset.cpus,
          cpuset.mems.
        name: ControllerCPUSet
        type: Controller
        value: "2"
      - doc: "ControllerIO distributes block I/O: io.weight, io.max, io.latency."
        name: ControllerIO
        type: Controller
        value: "3"
      - doc: |-
          ControllerMemory bounds memory: memory.min/low/high/max, the swap and
          zswap limits, memory.oom.group.
        name: ControllerMemory
        type: Controller
        value: "4"
      - doc: "ControllerPids bounds the number of tasks: pids.max."
        name: ControllerPids
        type: Controller
        value: "5"
      - doc: "ControllerHugeTLB bounds huge-page use: hugetlb.<size>.max."
        name: ControllerHugeTLB
        type: Controller
        value: "6"
      - doc: "ControllerRDMA bounds RDMA resources: rdma.max."
        name: ControllerRDMA
        type: Controller
        value: "7"
      - doc: "ControllerMisc bounds scalar resources the kernel lists: misc.max."
        name: ControllerMisc
        type: Controller
        value: "8"
      - doc: NamespaceUser clones the child into a new user namespace (CLONE_NEWUSER).
        name: NamespaceUser
        type: Namespace
        value: "1"
      - doc: NamespacePID clones the child into a new PID namespace, as its PID 1 (CLONE_NEWPID).
        name: NamespacePID
        type: Namespace
        value: "2"
      - doc: NamespaceMount gives the child a private copy of the mount namespace (CLONE_NEWNS).
        name: NamespaceMount
        type: Namespace
        value: "4"
      - doc: NamespaceIPC clones the child into a new IPC namespace (CLONE_NEWIPC).
        name: NamespaceIPC
        type: Namespace
        value: "8"
      - doc: NamespaceUTS clones the child into a new UTS namespace (CLONE_NEWUTS).
        name: NamespaceUTS
        type: Namespace
        value: "16"
      - doc: NamespaceNet clones the child into a new network namespace, with a loopback only (CLONE_NEWNET).
        name: NamespaceNet
        type: Namespace
        value: "32"
      - doc: |-
          NamespaceCgroup puts the child in a new cgroup namespace (CLONE_NEWCGROUP),
          rooted at the group it runs in, Spec.CgroupPath's when one is set — unshared
          once the child is placed there.
        name: NamespaceCgroup
        type: Namespace
        value: "64"
      - doc: NamespaceTime clones the child into a new time namespace (CLONE_NEWTIME, Linux 5.6).
        name: NamespaceTime
        type: Namespace
        value: "128"
      - doc: MountReadOnly binds Target onto itself and makes it read-only, recursively (systemd ReadOnlyPaths=) — the zero value.
        name: MountReadOnly
        type: MountKind
        value: "0"
      - doc: MountBind binds Source onto Target, recursively (systemd BindPaths=).
        name: MountBind
        type: MountKind
        value: "1"
      - doc: MountTmpfs mounts an empty tmpfs on Target, nosuid and nodev (systemd TemporaryFileSystem=).
        name: MountTmpfs
        type: MountKind
        value: "2"
      - doc: MountTmpfsSticky mounts an empty tmpfs on Target, mode 1777 — sticky, writable by all, as /tmp is —, nosuid and nodev (systemd PrivateTmp=).
        name: MountTmpfsSticky
        type: MountKind
        value: "3"
      - doc: LandlockExecute is LANDLOCK_ACCESS_FS_EXECUTE (ABI 1).
        name: LandlockExecute
        type: LandlockAccess
        value: "1"
      - doc: LandlockWriteFile is LANDLOCK_ACCESS_FS_WRITE_FILE (ABI 1).
        name: LandlockWriteFile
        type: LandlockAccess
        value: "2"
      - doc: LandlockReadFile is LANDLOCK_ACCESS_FS_READ_FILE (ABI 1).
        name: LandlockReadFile
        type: LandlockAccess
        value: "4"
      - doc: LandlockReadDir is LANDLOCK_ACCESS_FS_READ_DIR (ABI 1).
        name: LandlockReadDir
        type: LandlockAccess
        value: "8"
      - doc: LandlockRemoveDir is LANDLOCK_ACCESS_FS_REMOVE_DIR (ABI 1).
        name: LandlockRemoveDir
        type: LandlockAccess
        value: "16"
      - doc: LandlockRemoveFile is LANDLOCK_ACCESS_FS_REMOVE_FILE (ABI 1).
        name: LandlockRemoveFile
        type: LandlockAccess
        value: "32"
      - doc: LandlockMakeChar is LANDLOCK_ACCESS_FS_MAKE_CHAR (ABI 1).
        name: LandlockMakeChar
        type: LandlockAccess
        value: "64"
      - doc: LandlockMakeDir is LANDLOCK_ACCESS_FS_MAKE_DIR (ABI 1).
        name: LandlockMakeDir
        type: LandlockAccess
        value: "128"
      - doc: LandlockMakeReg is LANDLOCK_ACCESS_FS_MAKE_REG (ABI 1).
        name: LandlockMakeReg
        type: LandlockAccess
        value: "256"
      - doc: LandlockMakeSock is LANDLOCK_ACCESS_FS_MAKE_SOCK (ABI 1).
        name: LandlockMakeSock
        type: LandlockAccess
        value: "512"
      - doc: LandlockMakeFifo is LANDLOCK_ACCESS_FS_MAKE_FIFO (ABI 1).
        name: LandlockMakeFifo
        type: LandlockAccess
        value: "1024"
      - doc: LandlockMakeBlock is LANDLOCK_ACCESS_FS_MAKE_BLOCK (ABI 1).
        name: LandlockMakeBlock
        type: LandlockAccess
        value: "2048"
      - doc: LandlockMakeSym is LANDLOCK_ACCESS_FS_MAKE_SYM (ABI 1).
        name: LandlockMakeSym
        type: LandlockAccess
        value: "4096"
      - doc: LandlockRefer is LANDLOCK_ACCESS_FS_REFER (ABI 2, Linux 5.19).
        name: LandlockRefer
        type: LandlockAccess
        value: "8192"
      - doc: LandlockTruncate is LANDLOCK_ACCESS_FS_TRUNCATE (ABI 3, Linux 6.2).
        name: LandlockTruncate
        type: LandlockAccess
        value: "16384"
      - doc: LandlockIoctlDev is LANDLOCK_ACCESS_FS_IOCTL_DEV (ABI 5, Linux 6.10).
        name: LandlockIoctlDev
        type: LandlockAccess
        value: "32768"
      - doc: SeccompKill kills the whole process (SECCOMP_RET_KILL_PROCESS, Linux 4.14) — the zero value.
        name: SeccompKill
        type: SeccompAction
        value: "0"
      - doc: SeccompErrno fails the call with SeccompValue.Errno (SECCOMP_RET_ERRNO).
        name: SeccompErrno
        type: SeccompAction
        value: "1"
      - doc: SeccompAllow lets the call through (SECCOMP_RET_ALLOW).
        name: SeccompAllow
        type: SeccompAction
        value: "2"
    doc: |-
      Package proc — range 0.2.6.* (ADR 0016 core/proc block). The whole domain
      owns this single PP octet: every sentinel below is declared here and only
      wrapped (never re-Defined) by the service implementations and pkg/v1 facades.

      Package proc — declares the sentinels returned across the process-supervision
      domain. Each var's name equals its errs.Define Reason in SCREAMING_SNAKE form;
      service implementations and pkg/v1 facades wrap these, never re-Define them.

      Package proc — the ExitValue value type: the outcome of a finished process.

      Package proc — the Group port: a cgroup v2 control group handle.

      Package proc — the LimitValue value type: a soft/hard setrlimit pair.

      Package proc — the Listener port: the supervisor side of sd_notify.

      Package proc — the MemoryLimitValue value type and the MemorySource enum: what
      a derived Go soft memory limit is, and what decided it.

      Package proc — the NotificationValue value type: a parsed sd_notify datagram.

      Package proc declares the OS process-supervision contract of the SDK: the
      ports (Process, Reaper, Group, Listener), the immutable value types (Spec,
      ExitValue, LimitValue, NotificationValue, Signal, Resource), and the domain's
      complete error-sentinel set (range 0.2.6.*). It is the sixth internal/core
      sibling (ADR 0016), peer of codec / writer / crypto / logger / transform.

      Unlike codec and crypto, proc ships no plug-in registry: each primitive has a
      single canonical OS implementation chosen at build time by platform tag, not
      a runtime-registered scheme. Core declares the ports and value types; concrete
      behaviour lives in internal/service/proc/*; the pkg/v1/proc facades (process,
      signal, reaper, rlimit, cgroup, systemd/notify) re-export this surface.

      proc is stdlib-only (os, syscall, time, strconv, strings) plus
      internal/kernel/errs — no golang.org/x/sys — preserving the SDK's dep-light
      invariant. Every error returned by the domain is one of the sentinels in
      errors.go; service code wraps them with errs.Wrap and never defines new codes.

      Package proc — the Process port: lifetime control over a spawned process.

      Package proc — the Reaper port: collection of terminated child processes.

      Package proc — the SandboxValue value type and its parts: the namespaces,
      mounts, root, capabilities, Landlock rules and seccomp filter a sandboxed child
      is spawned under (Spec.Sandbox).

      Package proc — the Signal value type: a typed, platform-portable OS signal
      with Parse / String / OS bridging. The name table is platform-specific and
      lives in signal_unix.go / signal_other.go.

      Package proc — non-Unix signal name table (Windows): the portable subset.

      Package proc — Unix signal name table (linux/darwin/bsd).

      Package proc — the Spec value type: an immutable process spawn specification.

      Package proc — the StdioMode value: how a spawned child's standard streams
      (stdin, stdout, stderr) are connected.
    functions:
      - doc: |-
          Parse resolves a signal from its name or number into sig. It accepts the
          canonical "SIGTERM", the bare "TERM", and the numeric "15" (all
          case-insensitive), returning UnknownSignal for anything the platform table
          does not define. On Linux (SIGRTMIN 34 to SIGRTMAX 64, glibc's view) and
          FreeBSD (65 to 126) it also accepts the realtime signals as kill(1) and
          systemd spell them — "SIGRTMIN", "SIGRTMIN+3", "SIGRTMAX-2", "RTMIN+1" —
          and their numbers; elsewhere the same spellings are UnknownSignal.
        in:
          - name: name
            type: string
        name: Parse
        out:
          - name: sig
            type: Signal
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/proc
    ports:
      - doc: |-
          ContextWaiter is the sibling of Process (ADR 0039) that bounds a wait: the
          handle Start returns implements it, a Process from elsewhere may not.
        methods:
          - doc: |-
              WaitContext waits like Wait until the process exits or ctx is done. When
              ctx ends first it returns ctx's error and the child keeps running; a later
              Wait or WaitContext still reports the real exit.
            in:
              - name: ctx
                type: context.Context
            name: WaitContext
            out:
              - type: ExitValue
              - type: error
        name: ContextWaiter
      - doc: |-
          Group is a handle to a cgroup v2 control group used to confine a process tree:
          set controller limits, attach processes, and remove the group. Implementations
          live in internal/service/proc/*; it is Linux-only and non-Linux builds return
          a no-op satisfying this interface with UNSUPPORTED_PLATFORM.
        methods:
          - doc: |-
              SetMemoryMax writes memory.max (systemd MemoryMax=); a negative value
              means "max" (no limit).
            in:
              - name: bytes
                type: int64
            name: SetMemoryMax
            out:
              - type: error
          - doc: |-
              SetCPUMax writes cpu.max as "quota period" (systemd CPUQuota=); a negative
              quota means "max".
            in:
              - name: quota
              - name: period
                type: int64
            name: SetCPUMax
            out:
              - type: error
          - doc: |-
              SetPidsMax writes pids.max (systemd TasksMax=); a negative value means
              "max".
            in:
              - name: "n"
                type: int64
            name: SetPidsMax
            out:
              - type: error
          - doc: |-
              SetIOMax writes one io.max line verbatim (systemd IO*Max=), e.g.
              "8:0 rbps=1048576".
            in:
              - name: spec
                type: string
            name: SetIOMax
            out:
              - type: error
          - doc: Add moves the process pid into this group by writing cgroup.procs.
            in:
              - name: pid
                type: int
            name: Add
            out:
              - type: error
          - doc: |-
              Kill atomically SIGKILLs every process in the group by writing "1" to
              cgroup.kill (systemd KillMode=control-group; kernel >= 5.14). Unlike a
              process-group kill, nothing escapes — a member that called setsid is still
              in the control group. Returns UnsupportedPlatform when cgroup.kill is absent
              (older kernels), so callers can fall back to SignalGroup.

              Kill a group nothing will be spawned into again: on Linux (measured on
              6.12), after one cgroup.kill — an empty group's too — every child later
              cloned into the group (Spec.CgroupPath, CLONE_INTO_CGROUP) is SIGKILLed at
              its fork, while a process moved in by Add is not. To empty a group that
              will be reused, signal its members instead (GroupSignaler's Signal).
            name: Kill
            out:
              - type: error
          - doc: |-
              Freeze quiesces the whole group by writing "1" to cgroup.freeze (kernel
              >= 5.2), stopping every member so a consistent signal sweep or snapshot can
              run. Returns UnsupportedPlatform when cgroup.freeze is absent. Idempotent.
            name: Freeze
            out:
              - type: error
          - doc: |-
              Thaw resumes a frozen group by writing "0" to cgroup.freeze. Returns
              UnsupportedPlatform when cgroup.freeze is absent. Idempotent.
            name: Thaw
            out:
              - type: error
          - doc: Delete removes the (empty) control group; callers move processes out first.
            name: Delete
            out:
              - type: error
        name: Group
      - doc: |-
          GroupReader is the read half a control group may offer beside Group (ADR
          0039, asserted on the Group cgroup.Create returns): what the confined tree
          has used. A backend reads what its kernel counts and says what it cannot
          with GroupStatValue.Partial; a platform with no control group has no
          GroupReader.
        methods:
          - doc: |-
              Stat reads the group's counters: CPU time and throttling, memory now, at
              its peak and the events of its limits, the pid count, the I/O per device.
              It returns CgroupReadFailed when the group's own files cannot be read —
              the group was deleted.
            name: Stat
            out:
              - type: GroupStatValue
              - type: error
          - doc: |-
              Members lists the pids of the group's processes and of the groups
              beneath it — the cgroup.procs of the subtree, the tracked set, the
              job's process list — in no promised order: a process a delegated
              service moved into a group of its own is still the group's.
            name: Members
            out:
              - type: "[]int"
              - type: error
        name: GroupReader
      - doc: |-
          GroupSignaler is the sibling of Group (ADR 0039, asserted on the Group
          cgroup.Create returns on Linux) that reaches every process of the group and
          of the groups beneath it — systemd's KillMode=control-group and mixed. With
          Group's Kill it is what proc/service's CgroupKill asks of a unit's group.
        methods:
          - doc: |-
              Signal sends sig to every process of the group and of the groups beneath
              it but the caller's own, reading cgroup.procs again until a pass finds no
              process it has not signalled, at most 64 passes. A process gone before the
              signal reached it is not an error; any other refusal is SignalFailed.
            in:
              - name: sig
                type: Signal
            name: Signal
            out:
              - type: error
          - doc: |-
              Contains reports whether pid is a process of the group or of a group
              beneath it. CgroupReadFailed when the group's cgroup.procs cannot be read.
            in:
              - name: pid
                type: int
            name: Contains
            out:
              - type: bool
              - type: error
        name: GroupSignaler
      - doc: |-
          GroupTree is the sibling of Group (ADR 0039, asserted on the Group
          cgroup.Create returns on Linux) for the group as a node of the hierarchy:
          its directory, the controllers the groups beneath it get, its delegation
          to another user, and its removal with what was made beneath it.
        methods:
          - doc: "Path is the group's directory: the CgroupPath a Spec spawns a child straight into."
            name: Path
            out:
              - type: string
          - doc: |-
              EnableControllers writes ctrls to the group's cgroup.subtree_control, so
              the groups beneath it get their interface files. A controller the group's
              cgroup.controllers does not list is CgroupControllerAbsent, and a
              malformed name InvalidSpec, before anything is written; while the group
              itself holds a process the kernel refuses with EBUSY, CgroupWriteFailed
              (cgroup v2's no-internal-process rule).
            in:
              - name: ctrls
                type: Controller
            name: EnableControllers
            out:
              - type: error
            variadic: true
          - doc: |-
              Delegate hands the group to the user uid and the group gid (systemd
              Delegate=yes): it changes the owner of the directory and of the files the
              kernel lists in /sys/kernel/cgroup/delegate — cgroup.procs,
              cgroup.threads and cgroup.subtree_control where that list is absent — so
              that user may create groups beneath it, move its processes and enable
              controllers. -1 keeps an owner unchanged. A file the group lacks is
              skipped; a refused change is CgroupWriteFailed.
            in:
              - name: uid
              - name: gid
                type: int
            name: Delegate
            out:
              - type: error
          - doc: |-
              DeleteTree removes the group and every group beneath it, deepest first:
              what a delegated unit made under its group goes with it, as systemd
              cleans a Delegate=yes unit up. A group still holding a process stops it
              with CgroupDeleteFailed naming that group — Kill, and wait for Watch to
              say the group is empty, first. A link is never followed.
            name: DeleteTree
            out:
              - type: error
        name: GroupTree
      - doc: |-
          GroupTuner is the sibling of Group (ADR 0039, asserted on the Group
          cgroup.Create returns on Linux) that writes the cgroup v2 interface files
          Group does not: the memory protections and throttle, the swap and zswap
          limits, the OOM grouping, the CPU weight and burst, the cpusets, the I/O
          weight and latency. Each setter writes one file of the group, which exists
          only when the parent enables its controller (WithControllers,
          GroupTree.EnableControllers): a write to an absent file is
          CgroupWriteFailed. A value outside the kernel's range is InvalidSpec, and
          nothing is written.
        methods:
          - doc: |-
              SetMemoryMin writes memory.min (systemd MemoryMin=), the memory the group
              keeps whatever the pressure; a negative value writes "max".
            in:
              - name: bytes
                type: int64
            name: SetMemoryMin
            out:
              - type: error
          - doc: |-
              SetMemoryLow writes memory.low (systemd MemoryLow=), the memory reclaimed
              from the group only when nothing else can be; a negative value writes
              "max".
            in:
              - name: bytes
                type: int64
            name: SetMemoryLow
            out:
              - type: error
          - doc: |-
              SetMemoryHigh writes memory.high (systemd MemoryHigh=), the throttle
              above which the group's allocations are slowed and reclaimed; a negative
              value writes "max".
            in:
              - name: bytes
                type: int64
            name: SetMemoryHigh
            out:
              - type: error
          - doc: |-
              SetMemorySwapMax writes memory.swap.max (systemd MemorySwapMax=); a
              negative value writes "max".
            in:
              - name: bytes
                type: int64
            name: SetMemorySwapMax
            out:
              - type: error
          - doc: |-
              SetMemoryZswapMax writes memory.zswap.max (systemd MemoryZSwapMax=); a
              negative value writes "max".
            in:
              - name: bytes
                type: int64
            name: SetMemoryZswapMax
            out:
              - type: error
          - doc: |-
              SetMemoryZswapWriteback writes memory.zswap.writeback (systemd
              MemoryZSwapWriteback=, Linux 6.8): false keeps the group's compressed
              pages from being written back to swap.
            in:
              - name: enabled
                type: bool
            name: SetMemoryZswapWriteback
            out:
              - type: error
          - doc: |-
              SetMemoryOOMGroup writes memory.oom.group: true makes the OOM killer end
              the whole group rather than one task of it (systemd OOMPolicy=kill).
            in:
              - name: enabled
                type: bool
            name: SetMemoryOOMGroup
            out:
              - type: error
          - doc: |-
              SetCPUWeight writes cpu.weight (systemd CPUWeight=), the group's share of
              CPU against its siblings, 1 to 10000 (100 by default).
            in:
              - name: weight
                type: int64
            name: SetCPUWeight
            out:
              - type: error
          - doc: |-
              SetCPUMaxBurst writes cpu.max.burst, the CPU time the group may borrow
              above cpu.max's quota in a period, in microseconds; a negative burst is
              InvalidSpec.
            in:
              - name: burst
                type: time.Duration
            name: SetCPUMaxBurst
            out:
              - type: error
          - doc: |-
              SetCPUSetCPUs writes cpuset.cpus (systemd AllowedCPUs=) in the kernel's
              list form, "0-3,8"; an empty list writes "", the parent's CPUs. A
              negative CPU is InvalidSpec.
            in:
              - name: cpus
                type: "[]int"
            name: SetCPUSetCPUs
            out:
              - type: error
          - doc: |-
              SetCPUSetMems writes cpuset.mems (systemd AllowedMemoryNodes=) in the
              list form SetCPUSetCPUs writes.
            in:
              - name: nodes
                type: "[]int"
            name: SetCPUSetMems
            out:
              - type: error
          - doc: |-
              SetIOWeight writes io.weight's default (systemd IOWeight=), the group's
              share of I/O against its siblings, 1 to 10000 (100 by default).
            in:
              - name: weight
                type: int64
            name: SetIOWeight
            out:
              - type: error
          - doc: |-
              SetIOLatency writes the io.latency line of the device major:minor
              (systemd IODeviceLatencyTargetSec=): the latency the group's I/O is
              protected to, in microseconds; zero removes it, and a negative target is
              InvalidSpec.
            in:
              - name: major
              - name: minor
                type: uint32
              - name: target
                type: time.Duration
            name: SetIOLatency
            out:
              - type: error
        name: GroupTuner
      - doc: |-
          GroupWatcher is the sibling of Group (ADR 0039, asserted on the Group
          cgroup.Create returns on Linux) that follows the group's state:
          cgroup.events and memory.events, read again after every change the kernel
          announces with inotify.
        methods:
          - doc: |-
              Watch returns a channel holding the group's state first, then its state
              after each change the kernel announces: populated, frozen, the memory
              events. The channel holds one value, and a burst coalesces into the
              latest — published even when the burst left the state as it was, so a
              reader that read the group meanwhile learns it changed back: the watch
              never blocks on its reader. It is closed when ctx ends, and when the
              group is gone, after a last value holding no process; a reader whose ctx
              is not done reads the close as the group's removal. CgroupReadFailed
              when the group's cgroup.events cannot be watched or read.
            in:
              - name: ctx
                type: context.Context
            name: Watch
            out:
              - type: <-chan GroupEventsValue
              - type: error
        name: GroupWatcher
      - doc: |-
          JobLimiter is the sibling of Group (ADR 0039) on Windows, where Group's
          SetMemoryMax caps each process of the Job Object: it caps the job as a
          whole. Group's SetMemoryMax is unchanged.
        methods:
          - doc: |-
              SetJobMemoryLimit caps the memory committed by every process of the job
              together (JOB_OBJECT_LIMIT_JOB_MEMORY); a negative value removes the cap.
              CgroupWriteFailed when the job refuses it.
            in:
              - name: bytes
                type: int64
            name: SetJobMemoryLimit
            out:
              - type: error
        name: JobLimiter
      - doc: |-
          Listener is the supervisor side of the sd_notify protocol: it owns the
          AF_UNIX datagram socket a supervised child writes readiness to, and yields one
          parsed, credential-verified NotificationValue per received datagram.
          Implementations live in internal/service/proc/*.
        methods:
          - doc: |-
              Recv blocks until the next datagram arrives and returns it parsed, with the
              sender PID verified by the kernel. It returns a typed error on a malformed
              datagram or once the listener is closed.
            name: Recv
            out:
              - type: NotificationValue
              - type: error
          - doc: Close releases the socket and unblocks any in-flight Recv.
            name: Close
            out:
              - type: error
        name: Listener
      - doc: |-
          Process is a handle to a spawned process. It exposes only lifetime control —
          observe completion, deliver a signal to the leader or its whole group, and
          stop it gracefully. Implementations live in internal/service/proc/*; the
          pkg/v1/proc/process facade returns this interface.
        methods:
          - doc: PID reports the process identifier of the leader.
            name: PID
            out:
              - type: int
          - doc: |-
              Wait blocks until the process exits and returns its ExitValue — the real
              one even when a running Reaper collected the child first. It is safe
              to call once; concurrent or repeated calls observe the same outcome. Under
              StdioCapture it returns only after every captured byte has reached the
              caller's writers; if a writer itself failed, the ExitValue still reports the
              real exit status and the error is StdioCaptureFailed. A process the child
              left behind can hold its output pipe past the exit: Spec.DrainGrace bounds
              that wait, after which the pipes are closed and the error, beside the real
              ExitValue, is StdioDrainTimeout.
            name: Wait
            out:
              - type: ExitValue
              - type: error
          - doc: Signal delivers sig to the leader process only.
            in:
              - name: sig
                type: Signal
            name: Signal
            out:
              - type: error
          - doc: |-
              SignalGroup delivers sig to the leader's entire process group (kill(-pgid,
              sig)), reaching forked grandchildren — the KillMode=control-group analogue.
              On Windows a Setpgid child's console process group receives CTRL_BREAK for
              SIGINT, SIGTERM, SIGHUP and SIGQUIT instead — the one console event Windows
              delivers to a single group, which a Go child reads as os.Interrupt; CTRL_C
              never reaches one group — and SIGKILL, or any signal to a child without its
              own group, reaches the leader alone.
            in:
              - name: sig
                type: Signal
            name: SignalGroup
            out:
              - type: error
          - doc: |-
              Stop terminates the process group gracefully: it sends sig, waits up to
              grace for exit, then escalates to SIGKILL. It returns when the process has
              exited or ctx is cancelled. On Windows sig reaches a Setpgid child as its
              console control event, as SignalGroup sends it, and the escalation is
              TerminateProcess.
            in:
              - name: ctx
                type: context.Context
              - name: grace
                type: time.Duration
              - name: sig
                type: Signal
            name: Stop
            out:
              - type: error
        name: Process
      - doc: |-
          ProcessHandle is the sibling of Process (ADR 0039) that reaches the process
          through a kernel handle rather than its pid, which another process may hold
          once this one is reaped: a pidfd on Linux 5.4 and later, the process HANDLE on
          Windows. The handles Start and Open return implement it.
        methods:
          - doc: |-
              Handle returns a new descriptor for the process, which the caller owns and
              closes: a pidfd on Linux — readable once the process exits, so it can be
              polled, or passed to another process — and a duplicated process HANDLE on
              Windows. It reports false where none is available: a kernel without pidfd,
              another platform, or a process already reaped.
            name: Handle
            out:
              - type: "*os.File"
              - type: bool
          - doc: |-
              SignalHandle delivers sig through the process's kernel handle
              (pidfd_send_signal on Linux), never by pid: once the process is reaped it
              fails with SignalFailed wrapping ESRCH instead of reaching a process that
              reused the pid. It returns HandleUnavailable where the kernel gave no handle,
              and UnsupportedPlatform off Linux and Windows.
            in:
              - name: sig
                type: Signal
            name: SignalHandle
            out:
              - type: error
        name: ProcessHandle
      - doc: |-
          Reaper collects terminated child processes so they do not linger as zombies —
          the core duty of any PID1 or subreaper. Implementations live in
          internal/service/proc/*; non-supporting platforms return a no-op reaper.

          A sweep collects every exited child, including one a Process handle is
          waiting for; an implementation must hand such a child's exit status to that
          Process rather than discard it, so its Wait still reports the real exit.
        methods:
          - doc: |-
              Start begins a background SIGCHLD-driven loop that reaps children as they
              exit. It is idempotent: a second Start while running is a no-op.
            name: Start
          - doc: |-
              Stop ends the background loop after a final draining sweep, so shutdown
              leaves no un-reaped zombies. It is safe to call without a prior Start.
            name: Stop
          - doc: |-
              ReapOnce performs a single non-blocking sweep and reports how many
              children were reaped. It is safe to call concurrently with the loop.
            name: ReapOnce
            out:
              - type: int
              - type: error
        name: Reaper
      - doc: |-
          Terminal is the sibling of Process (ADR 0039) for a child started with
          StdioPTY: the master side of its pseudo-terminal, and the window size. The
          handle Start returns implements it on Unix.
        methods:
          - doc: |-
              TTY returns the master side of the child's pseudo-terminal: what the child
              writes is read from it, and what is written to it is the child's input. The
              caller owns it and closes it; it is nil for a child started without
              StdioPTY.
            name: TTY
            out:
              - type: "*os.File"
          - doc: |-
              Resize sets the terminal's window size (TIOCSWINSZ), and the kernel sends
              the child SIGWINCH. It returns PTYFailed for a child started without
              StdioPTY or a size the kernel refuses.
            in:
              - name: rows
              - name: cols
                type: uint16
            name: Resize
            out:
              - type: error
          - doc: Size reads the terminal's current window size (TIOCGWINSZ).
            name: Size
            out:
              - type: PTYValue
              - type: error
        name: Terminal
    sentinels:
      - var:
          - code: CodeUnsupportedPlatform
            doc: |-
              UnsupportedPlatform is returned by a primitive invoked on an operating
              system that cannot provide it; the no-op stub returns it, never a panic.
            exit: UNAVAILABLE
            name: UnsupportedPlatform
            private: "core/proc: primitive unavailable on the current GOOS; the stub returns this instead of acting"
            public: This operation is not supported on this platform
            reason: UNSUPPORTED_PLATFORM
          - code: CodeInvalidSpec
            doc: |-
              InvalidSpec is returned by Start when the Spec is malformed — an empty Path
              or a contradictory attribute combination.
            exit: USAGE
            name: InvalidSpec
            private: "service/proc/exec.Start: Spec is malformed (empty Path or contradictory attributes)"
            public: Process specification is invalid
            reason: INVALID_SPEC
          - code: CodeUnknownUser
            doc: |-
              UnknownUser is returned when a Spec names a User that does not resolve to a
              uid on the host.
            exit: NOUSER
            name: UnknownUser
            private: "service/proc/exec.Start: Spec.User did not resolve to a uid via os/user"
            public: The requested user does not exist
            reason: UNKNOWN_USER
          - code: CodeUnknownGroup
            doc: |-
              UnknownGroup is returned when a Spec names a Group or supplementary group
              that does not resolve to a gid on the host.
            exit: NOUSER
            name: UnknownGroup
            private: "service/proc/exec.Start: Spec.Group/Groups did not resolve to a gid via os/user"
            public: The requested group does not exist
            reason: UNKNOWN_GROUP
          - code: CodeSpawnFailed
            doc: |-
              SpawnFailed is returned when fork/exec fails — a missing binary, a
              permission denial, or a kernel resource fault.
            exit: OSERR
            name: SpawnFailed
            private: "service/proc/exec.Start: fork/exec failed"
            public: Could not start the process
            reason: SPAWN_FAILED
          - code: CodeWaitFailed
            doc: |-
              WaitFailed is returned when wait4 fails reaping the leader — a host fault,
              not a normal non-zero exit (reported via ExitValue instead).
            exit: OSERR
            name: WaitFailed
            private: "service/proc/exec.Wait: wait4 returned an unexpected error"
            public: Could not wait for the process to exit
            reason: WAIT_FAILED
          - code: CodeSignalFailed
            doc: |-
              SignalFailed is returned when kill(2) fails delivering a signal to a
              process or process group.
            exit: OSERR
            name: SignalFailed
            private: "service/proc: kill(2) failed for the target pid or process group"
            public: Could not deliver the signal
            reason: SIGNAL_FAILED
          - code: CodeStopFailed
            doc: |-
              StopFailed is returned when a graceful stop cannot terminate the process
              group even after escalating to SIGKILL.
            exit: OSERR
            name: StopFailed
            private: "service/proc/exec.Stop: process group survived signal escalation to SIGKILL"
            public: Could not stop the process
            reason: STOP_FAILED
          - code: CodeUnknownSignal
            doc: |-
              UnknownSignal is returned by Parse when the name or number is not in the
              platform signal table.
            exit: USAGE
            name: UnknownSignal
            private: "core/proc.Parse: input is not a signal known on this platform"
            public: Unknown signal name or number
            reason: UNKNOWN_SIGNAL
          - code: CodeRelayFailed
            doc: |-
              RelayFailed is returned by Relay when a received signal cannot be forwarded
              to its target process or group.
            exit: OSERR
            name: RelayFailed
            private: "service/proc/signal.Relay: forwarding the signal to the target failed"
            public: Could not relay the signal to the target
            reason: RELAY_FAILED
          - code: CodeSubreaperFailed
            doc: |-
              SubreaperFailed is returned when prctl(PR_SET_CHILD_SUBREAPER) fails arming
              subreaper semantics for a non-PID1 supervisor.
            exit: OSERR
            name: SubreaperFailed
            private: "service/proc/reaper.SetChildSubreaper: prctl(PR_SET_CHILD_SUBREAPER) failed"
            public: Could not enable child-subreaper mode
            reason: SUBREAPER_FAILED
          - code: CodeReapFailed
            doc: |-
              ReapFailed is returned when a reap sweep hits a wait4 error other than the
              benign "no children" condition.
            exit: OSERR
            name: ReapFailed
            private: "service/proc/reaper.ReapOnce: wait4 failed with an error other than ECHILD"
            public: Could not reap child processes
            reason: REAP_FAILED
          - code: CodeUnknownResource
            doc: |-
              UnknownResource is returned by Apply when a Resource has no RLIMIT_*
              mapping on the platform.
            exit: USAGE
            name: UnknownResource
            private: "service/proc/rlimit.Apply: Resource has no RLIMIT_* mapping on this platform"
            public: Unknown or unsupported resource limit
            reason: UNKNOWN_RESOURCE
          - code: CodeRlimitFailed
            doc: |-
              RlimitFailed is returned when setrlimit(2) fails applying a per-process
              resource limit.
            exit: OSERR
            name: RlimitFailed
            private: "service/proc/rlimit.Apply: setrlimit(2) failed"
            public: Could not apply the resource limit
            reason: RLIMIT_FAILED
          - code: CodeCgroupUnavailable
            doc: |-
              CgroupUnavailable is returned when a cgroup operation runs where cgroup v2
              is not mounted or not delegated to the caller.
            exit: UNAVAILABLE
            name: CgroupUnavailable
            private: "service/proc/cgroup: the unified cgroup v2 hierarchy is absent or not writable by the caller"
            public: cgroup v2 is not available or not delegated
            reason: CGROUP_UNAVAILABLE
          - code: CodeCgroupCreateFailed
            doc: |-
              CgroupCreateFailed is returned when a control-group directory cannot be
              created under the cgroup v2 hierarchy.
            exit: OSERR
            name: CgroupCreateFailed
            private: "service/proc/cgroup.Create: mkdir under the cgroup v2 hierarchy failed"
            public: Could not create the control group
            reason: CGROUP_CREATE_FAILED
          - code: CodeCgroupWriteFailed
            doc: |-
              CgroupWriteFailed is returned when a controller file cannot be written
              (memory.max, cpu.max, pids.max, io.max, cgroup.procs).
            exit: OSERR
            name: CgroupWriteFailed
            private: "service/proc/cgroup: writing a controller file failed (controller disabled or value rejected)"
            public: Could not write the cgroup controller file
            reason: CGROUP_WRITE_FAILED
          - code: CodeCgroupDeleteFailed
            doc: |-
              CgroupDeleteFailed is returned when a control-group directory cannot be
              removed.
            exit: OSERR
            name: CgroupDeleteFailed
            private: "service/proc/cgroup.Delete: rmdir of the control group failed (still populated?)"
            public: Could not delete the control group
            reason: CGROUP_DELETE_FAILED
          - code: CodeNotifyFailed
            doc: |-
              NotifyFailed is returned when an sd_notify datagram cannot be sent to
              $NOTIFY_SOCKET — distinct from the no-op when the variable is unset.
            exit: OSERR
            name: NotifyFailed
            private: "service/proc/systemd/notify: writing to $NOTIFY_SOCKET failed"
            public: Could not send the sd_notify datagram
            reason: NOTIFY_FAILED
          - code: CodeListenFailed
            doc: |-
              ListenFailed is returned when the supervisor-side sd_notify datagram socket
              cannot be created or bound.
            exit: OSERR
            name: ListenFailed
            private: "service/proc/systemd/notify.Listen: creating or binding the AF_UNIX datagram socket failed"
            public: Could not create the sd_notify listener socket
            reason: LISTEN_FAILED
          - code: CodeInvalidNotification
            doc: |-
              InvalidNotification is returned when a received sd_notify datagram cannot
              be parsed into NAME=value fields.
            exit: DATAERR
            name: InvalidNotification
            private: "service/proc/systemd/notify.Recv: datagram did not parse into NAME=value fields"
            public: Received sd_notify datagram is malformed
            reason: INVALID_NOTIFICATION
          - code: CodeCredentialMismatch
            doc: |-
              CredentialMismatch is returned when a received datagram's kernel-verified
              sender credentials do not match the expected supervised process.
            exit: NOPERM
            name: CredentialMismatch
            private: "service/proc/systemd/notify.Recv: SO_PASSCRED sender pid is not the expected supervised process"
            public: Datagram sender credentials did not match
            reason: CREDENTIAL_MISMATCH
          - code: CodeStdioCaptureFailed
            doc: |-
              StdioCaptureFailed is returned from Wait when a StdioCapture copier could
              not deliver the child's stdout/stderr to the caller's writer (the writer
              itself errored), even though the process exited cleanly.
            exit: IOERR
            name: StdioCaptureFailed
            private: "service/proc/exec: a StdioCapture copier failed writing the child's stdout/stderr to the caller's sink"
            public: Could not deliver the captured output to the writer
            reason: STDIO_CAPTURE_FAILED
          - code: CodeStdioDrainTimeout
            doc: |-
              StdioDrainTimeout is returned from Wait, beside the real ExitValue, when the
              StdioCapture copiers had not reached EOF when Spec.DrainGrace closed after
              the exit: something the child left behind still held its output pipe. The
              parent's pipe ends are closed, and the fields name the streams held and the
              bytes delivered.
            exit: IOERR
            name: StdioDrainTimeout
            private: "service/proc/exec: the capture pipes were still held open when the drain grace closed after the child's exit"
            public: The process exited but its output was still held open
            reason: STDIO_DRAIN_TIMEOUT
          - code: CodeHandleUnavailable
            doc: |-
              HandleUnavailable is returned by a ProcessHandle operation, or by Open, when no
              race-free kernel handle exists for the process: a kernel without pidfd, or a
              filter that refuses it.
            exit: UNAVAILABLE
            name: HandleUnavailable
            private: "service/proc/exec: no pidfd or process HANDLE could be obtained for the process"
            public: No process handle is available
            reason: HANDLE_UNAVAILABLE
          - code: CodePTYFailed
            doc: |-
              PTYFailed is returned when a pseudo-terminal cannot be allocated, unlocked,
              opened or resized for a StdioPTY spawn, or when a Terminal operation targets a
              child started without one.
            exit: OSERR
            name: PTYFailed
            private: "service/proc/exec: allocating, opening or resizing the pseudo-terminal failed"
            public: Could not set up the pseudo-terminal
            reason: PTY_FAILED
          - code: CodeMemlimitMisconfigured
            doc: |-
              MemlimitMisconfigured is returned by memlimit's ApplyWith and Watch when the
              configuration cannot be honoured: a headroom outside (0, 100] percent, or a
              negative floor. Nothing is installed (ADR 0031).
            exit: USAGE
            name: MemlimitMisconfigured
            private: "service/proc/memlimit: ConfigValue.HeadroomPercent outside [0, 100] or MinimumLimit negative"
            public: The memory limit configuration is invalid
            reason: MEMLIMIT_MISCONFIGURED
          - code: CodeCgroupReadFailed
            doc: |-
              CgroupReadFailed is returned by GroupReader.Stat and Members when the
              group's own counters cannot be read: the group was deleted, or its files
              are unreadable to the caller.
            exit: IOERR
            name: CgroupReadFailed
            private: "service/proc/cgroup: reading the group's cpu.stat, cgroup.procs or job accounting failed"
            public: Could not read the control group's counters
            reason: CGROUP_READ_FAILED
          - code: CodeSandboxFailed
            doc: |-
              SandboxFailed is returned by Start when a step of Spec.Sandbox failed in the
              child before its program ran: the step field names it — mounts, pivot_root,
              landlock_paths, capbset_drop, securebits, identity, capabilities,
              cloexec_sweep, no_new_privs, landlock_restrict_self, seccomp — and the errno
              field gives the kernel's answer. The program never ran.
            exit: OSERR
            name: SandboxFailed
            private: "service/proc/exec.Start: a step of Spec.Sandbox failed in the child before its program ran; the step field names it"
            public: Could not confine the process
            reason: SANDBOX_FAILED
          - code: CodeReservedEnv
            doc: |-
              ReservedEnv is returned by Start and Run, before any fork, when Spec.Env names
              a variable of the SDK's own spawn protocol: a key that begins
              __KITSUNIUM_SDK_PROC_, compared without regard to case. The spawn sets those
              variables itself, and a child reads the first of two equal keys, so one in
              Spec.Env would override what the SDK tells the child.
            exit: USAGE
            name: ReservedEnv
            private: "service/proc/exec.Start: Spec.Env names a reserved __KITSUNIUM_SDK_PROC_ variable"
            public: The environment names a variable reserved by the SDK
            reason: RESERVED_ENV
          - code: CodePIDFileRefused
            doc: |-
              PIDFileRefused is returned by AttachPIDFile for a PID file it cannot read
              safely: a relative path, a symbolic link at its end, a component that is no
              directory, a file that is not regular, one it cannot open — the cause, such as
              fs.ErrNotExist, is wrapped — or content that is not one decimal PID.
            exit: DATAERR
            name: PIDFileRefused
            private: "service/proc/exec.AttachPIDFile: the PID file is not a regular file reached safely, or holds no single PID; the why field says which"
            public: The PID file cannot be read safely
            reason: PID_FILE_REFUSED
          - code: CodeAdoptionRefused
            doc: |-
              AdoptionRefused is returned by Attach and AttachPIDFile for a process they may
              not adopt: PID 1 or this process, one outside the cgroup or the users the
              AttachValue asks for, or — from a PID file another user could have written —
              any process when the AttachValue bounds nothing.
            exit: NOPERM
            name: AdoptionRefused
            private: "service/proc/exec.Attach: the process is PID 1, this process, outside the cgroup or users asked for, or named by an untrusted PID file with no bound"
            public: The process may not be adopted
            reason: ADOPTION_REFUSED
          - code: CodeStatusUnknown
            doc: |-
              StatusUnknown is what Wait returns, with an ExitValue whose Code is -1, once a
              process Attach or AttachPIDFile adopted has ended: it was not this process's
              child, so its exit status is not this process's to read.
            name: StatusUnknown
            private: "service/proc/exec: an attached process is not this process's child; it ended and its exit status cannot be read"
            public: The process ended with an unknown status
            reason: STATUS_UNKNOWN
          - code: CodeInvalidFDName
            doc: |-
              InvalidFDName is returned by systemd/listen's CheckName, Prepare and
              PrepareFiles for a descriptor name LISTEN_FDNAMES cannot carry: longer than
              systemd's FDNAME_MAX, a byte that is not printable ASCII, or a ':' — the
              list's separator (systemd's fdname_is_valid).
            exit: USAGE
            name: InvalidFDName
            private: "service/proc/systemd/listen: a descriptor name is longer than FDNAME_MAX, not printable ASCII, or holds a ':'"
            public: The descriptor name is not valid
            reason: INVALID_FD_NAME
          - code: CodeSandboxUnavailable
            doc: |-
              SandboxUnavailable is returned by Start, before any fork, for a part of
              Spec.Sandbox the running kernel lacks, and by LandlockABI on a kernel without
              Landlock: the feature field names the function — landlock, or
              landlock:<right> beside the abi field, seccomp, namespace:<kind>, procfs,
              memfd_create, mount_setattr, cap_last_cap or capability.
            exit: UNAVAILABLE
            name: SandboxUnavailable
            private: "service/proc/exec.Start: this kernel lacks a part of Spec.Sandbox; the feature field names it"
            public: The kernel cannot apply the requested confinement
            reason: SANDBOX_UNAVAILABLE
          - code: CodeCgroupControllerAbsent
            doc: |-
              CgroupControllerAbsent is returned when a cgroup v2 controller is asked
              of a group whose parent does not offer it: Create's WithControllers and
              GroupTree.EnableControllers name the controller and the directory.
            exit: UNAVAILABLE
            name: CgroupControllerAbsent
            private: "service/proc/cgroup: the controller is absent from cgroup.controllers or refused by cgroup.subtree_control"
            public: The cgroup controller is not available here
            reason: CGROUP_CONTROLLER_ABSENT
    types:
      - doc: |-
          GroupStatValue is what a control group's tree has used, as GroupReader.Stat
          read it. A counter the backend cannot read is zero, and Partial says that
          some are: memory.peak before Linux 5.19, a controller not enabled for the
          group, and on Windows and FreeBSD everything their kernels do not count.
        name: GroupStatValue
        struct:
          fields:
            - doc: CPUUsage is the CPU time the group's tasks used, user and system.
              name: CPUUsage
              type: time.Duration
            - doc: CPUUser is the user-mode share of CPUUsage.
              name: CPUUser
              type: time.Duration
            - doc: CPUSystem is the kernel-mode share of CPUUsage.
              name: CPUSystem
              type: time.Duration
            - doc: ThrottledTime is how long cpu.max held the group's tasks back.
              name: ThrottledTime
              type: time.Duration
            - doc: NrThrottled is how many periods cpu.max throttled the group in.
              name: NrThrottled
              type: int64
            - doc: MemoryCurrent is the memory the group holds now, in bytes.
              name: MemoryCurrent
              type: int64
            - doc: |-
                MemoryPeak is the most memory the group held, in bytes (Linux 5.19's
                memory.peak; Windows' peak job memory).
              name: MemoryPeak
              type: int64
            - doc: MemoryEvents counts what the group's memory limits did.
              name: MemoryEvents
              type: MemoryEventsValue
            - doc: PidsCurrent is how many tasks the group holds now.
              name: PidsCurrent
              type: int64
            - doc: IO is the I/O the group did, one entry per device.
              name: IO
              type: "[]IOStatValue"
            - doc: Partial reports that at least one counter could not be read and is zero.
              name: Partial
              type: bool
      - doc: |-
          MemoryEventsValue counts what a control group's memory limits did — Linux's
          memory.events.
        name: MemoryEventsValue
        struct:
          fields:
            - doc: Low counts reclaims under memory.low's protection.
              name: Low
              type: int64
            - doc: High counts the times the group was throttled above memory.high.
              name: High
              type: int64
            - doc: Max counts the times the group hit memory.max.
              name: Max
              type: int64
            - doc: OOM counts the times the group ran out of memory.
              name: OOM
              type: int64
            - doc: OOMKill counts the tasks the OOM killer ended in the group.
              name: OOMKill
              type: int64
      - doc: |-
          IOStatValue is one device's I/O by a control group — a line of Linux's
          io.stat.
        name: IOStatValue
        struct:
          fields:
            - doc: Major is the device's major number.
              name: Major
              type: uint32
            - doc: Minor is the device's minor number.
              name: Minor
              type: uint32
            - doc: RBytes is the bytes read.
              name: RBytes
              type: uint64
            - doc: WBytes is the bytes written.
              name: WBytes
              type: uint64
            - doc: RIOs is the read operations.
              name: RIOs
              type: uint64
            - doc: WIOs is the write operations.
              name: WIOs
              type: uint64
      - doc: |-
          AttachValue bounds the process a PID file may name when the file is not
          trustworthy — reached through a symbolic link another user could have made,
          or kept in a directory, or written to a file, that another user could
          change: the process must then lie in the cgroup v2 subtree Cgroup and run as
          one of UIDs. A bound that is given is checked whatever the file; the zero
          value bounds nothing, and a file that is not trustworthy is then refused.
        name: AttachValue
        struct:
          fields:
            - doc: |-
                Cgroup is a cgroup v2 path as /proc/<pid>/cgroup names it —
                "/system.slice/web.service" —: the process must be in it or below it. Empty
                checks no cgroup.
              name: Cgroup
              type: string
            - doc: |-
                UIDs are the users the process may run as: its real and its effective uid
                must both be one of them. Empty checks no user.
              name: UIDs
              type: "[]int"
      - doc: |-
          DescriptorsValue are the descriptors one sd_notify datagram brought
          (NotificationValue.Descriptors): the caller owns every one and closes those
          it does not keep. Descriptors that came with no assignment calling for them
          are closed by the Listener, as systemd does.
        name: DescriptorsValue
        struct:
          fields:
            - doc: |-
                Files are the descriptors the datagram carried (SCM_RIGHTS): with
                FDSTORE=1 the ones to store, with BARRIER=1 the barrier, which the caller
                closes once every earlier datagram is processed.
              name: Files
              type: "[]*os.File"
            - doc: |-
                MainPIDFD is the pidfd a MAINPIDFD=1 datagram carried: its process is the
                new main process, and MainPID its PID; nil when none.
              name: MainPIDFD
              type: "*os.File"
            - doc: |-
                SenderPIDFD is a pidfd on the sending process (SCM_PIDFD, Linux 6.5 and
                later): the sender itself, beyond the reach of a PID reuse; nil where the
                kernel attaches none.
              name: SenderPIDFD
              type: "*os.File"
      - doc: |-
          Controller is a cgroup v2 controller: String is its name as the kernel
          spells it in cgroup.controllers and cgroup.subtree_control. The constants
          are the controllers of Linux 6.12; the zero value is none and is not
          Known.
        methods:
          - doc: |-
              String returns the controller's kernel name, "memory", or
              "controller(N)" for a value no constant holds.
            name: String
            out:
              - type: string
            recv: value
          - doc: Known reports whether c is one of the Controller constants.
            name: Known
            out:
              - type: bool
            recv: value
        name: Controller
        underlying: uint8
      - doc: |-
          GroupEventsValue is a control group's state as GroupWatcher.Watch reads it
          after each change: its cgroup.events keys and its memory.events counters.
        name: GroupEventsValue
        struct:
          fields:
            - doc: |-
                MemoryEvents counts what the group's memory limits did — memory.events,
                zero where the memory controller is not enabled for the group.
              name: MemoryEvents
              type: MemoryEventsValue
            - doc: |-
                Populated reports that the group or a group beneath it holds a live
                process (cgroup.events "populated").
              name: Populated
              type: bool
            - doc: Frozen reports that the group is frozen (cgroup.events "frozen").
              name: Frozen
              type: bool
      - doc: |-
          ExitValue is the immutable outcome of a finished process: its exit status, the
          signal that terminated it (if any), and resource-usage accounting. It is the
          value returned by Process.Wait.
        methods:
          - doc: |-
              Success reports whether the process exited normally with status zero. Its
              receiver is a pointer: an ExitValue carries Usage by value, past the size
              worth copying for a question.
            name: Success
            out:
              - type: bool
            recv: pointer
        name: ExitValue
        struct:
          fields:
            - doc: |-
                Code is the exit status (0–255) when the process exited normally; it is -1
                when the process was terminated by a signal.
              name: Code
              type: int
            - doc: |-
                Signal is the signal that terminated the process, or the zero Signal when
                it exited normally.
              name: Signal
              type: Signal
            - doc: |-
                Signaled reports whether the process was terminated by a signal rather
                than exiting on its own.
              name: Signaled
              type: bool
            - doc: UserTime is the CPU time spent in user mode.
              name: UserTime
              type: time.Duration
            - doc: SystemTime is the CPU time spent in kernel mode on the process's behalf.
              name: SystemTime
              type: time.Duration
            - doc: |-
                MaxRSS is the peak resident set size in KiB on every platform, read from
                wait4's rusage: darwin and ios report bytes, which are converted to KiB
                rounding up; Linux and the BSDs report KiB, passed through. It is 0 when
                the platform does not supply it (illumos, Solaris and Windows).
              name: MaxRSS
              type: int64
            - doc: |-
                CoreDumped reports whether the signalled death left a core image
                (WaitStatus.CoreDump). It is false for a normal exit, and wherever the
                platform cannot say (Windows).
              name: CoreDumped
              type: bool
            - doc: |-
                Usage is the rest of wait4's resource accounting — page faults, block I/O
                and context switches — read from the same rusage as UserTime and MaxRSS.
                It is carried by value, so building an ExitValue allocates nothing and
                one an observer keeps is never changed by a later collection. Its Known
                is false where the platform does not supply it (illumos, Solaris and
                Windows).
              name: Usage
              type: UsageValue
      - doc: |-
          FDPolicy says which of the supervisor's descriptors a child inherits besides
          its stdio and ExtraFiles (Spec.FDs). The zero value FDsSealed gives it none.
        name: FDPolicy
        underlying: uint8
      - doc: |-
          IOClass is an I/O scheduling class (Spec.Scheduling). Its values are Linux's
          IOPRIO_CLASS_* numbers; the zero value IOClassNone sets none.
        methods:
          - doc: |-
              String returns the lowercase class name ("none", "realtime", "besteffort",
              "idle"), or "ioclass(N)" for an undefined value.
            name: String
            out:
              - type: string
            recv: value
        name: IOClass
        underlying: int
      - doc: |-
          LimitValue is an immutable soft/hard resource-limit pair for setrlimit(2). The
          soft limit is the enforced value; the hard limit is the ceiling an
          unprivileged process may raise the soft limit to.
        name: LimitValue
        struct:
          fields:
            - doc: Soft is the enforced limit; it must not exceed Hard.
              name: Soft
              type: uint64
            - doc: Hard is the ceiling for Soft; raising it typically requires privilege.
              name: Hard
              type: uint64
      - doc: |-
          MemoryBound names which control-group file bound a soft-memory-limit
          derivation, so a log line says whether the throttle (memory.high) or the hard
          cap (memory.max) set the allowance.

          The zero value is deliberately unclaimed, as MemorySource's is: it is the
          Bound of every derivation that read no allowance.
        methods:
          - doc: |-
              String renders the bound for a log line: "high", "max", or "unknown" for a
              value this package never mints, the zero included.
            name: String
            out:
              - type: string
            recv: value
        name: MemoryBound
        underlying: uint8
      - doc: |-
          MemorySource names what decided the Go soft memory limit, so a caller that
          sees no limit applied can tell WHY without re-deriving it.

          The zero value is deliberately unclaimed. A MemorySource is produced by a
          derivation, never chosen by a caller, so a zero reaching a log line is a value
          this package never minted rather than one of the four real outcomes wearing a
          default.
        methods:
          - doc: |-
              String renders the source for a log line. A value this package never mints —
              including the zero — renders as "unknown" rather than as a number, because it
              is a defect worth reading as one.
            name: String
            out:
              - type: string
            recv: value
        name: MemorySource
        underlying: uint8
      - doc: |-
          MemoryLimitValue is an immutable record of one soft-memory-limit derivation:
          the cgroup allowance it read, the limit it derived, and what decided the
          outcome.

          Allowance and Limit are zero on every outcome except MemorySourceCgroup, with
          one exception: MemorySourceBelowFloor carries the Allowance it read, because
          the reason the limit was discarded is only legible next to the cap that
          produced it.
        methods:
          - doc: |-
              Applied reports whether the derivation installed a limit. It is true for
              exactly one source, and it is the predicate a caller wants rather than a
              comparison against Limit — a zero Limit and "no limit applied" are the same
              state today, and tying call sites to that coincidence would be fragile.
            name: Applied
            out:
              - type: bool
            recv: value
        name: MemoryLimitValue
        struct:
          fields:
            - doc: |-
                Allowance is the tightest cgroup memory cap governing this process, in
                bytes, or zero when none was read.
              name: Allowance
              type: int64
            - doc: |-
                Limit is the Go soft memory limit derived from Allowance, in bytes, or
                zero when no limit was applied.
              name: Limit
              type: int64
            - doc: Source names what decided the outcome.
              name: Source
              type: MemorySource
            - doc: |-
                Bound names the file that set Allowance — memory.high or the hard cap —
                on every outcome that carries an Allowance, and is zero otherwise.
              name: Bound
              type: MemoryBound
      - doc: |-
          NotificationValue is a parsed sd_notify(3) datagram received by a Listener: the
          raw newline-separated state fields plus the kernel-verified sender PID. It
          carries no policy — a supervisor decides what READY or WATCHDOG means for
          ordering. The lifecycle flags are read through methods so State stays the
          single source of truth.
        methods:
          - doc: Ready reports whether the datagram carried READY=1.
            name: Ready
            out:
              - type: bool
            recv: value
          - doc: Reloading reports whether the datagram carried RELOADING=1.
            name: Reloading
            out:
              - type: bool
            recv: value
          - doc: Stopping reports whether the datagram carried STOPPING=1.
            name: Stopping
            out:
              - type: bool
            recv: value
          - doc: Watchdog reports whether the datagram carried WATCHDOG=1 (a keep-alive ping).
            name: Watchdog
            out:
              - type: bool
            recv: value
        name: NotificationValue
        struct:
          fields:
            - doc: |-
                State is the raw NAME=value field set from the datagram (READY, STATUS,
                MAINPID, WATCHDOG, RELOADING, STOPPING, …), preserved verbatim.
              name: State
              type: map[string]string
            - doc: Status is the free-text STATUS= line, empty when absent.
              name: Status
              type: string
            - doc: MainPID is the PID advertised by MAINPID=, or 0 when absent.
              name: MainPID
              type: int
            - doc: |-
                SenderPID is the sending process's PID as verified by the kernel via
                SO_PASSCRED, not a value the sender can forge; 0 when credentials were
                unavailable.
              name: SenderPID
              type: int
            - doc: |-
                SenderUID is the sending process's user, as verified by the kernel with
                SenderPID; it means nothing when SenderPID is 0.
              name: SenderUID
              type: int
            - doc: |-
                SenderGID is the sending process's group, as verified by the kernel with
                SenderPID; it means nothing when SenderPID is 0.
              name: SenderGID
              type: int
            - doc: |-
                Descriptors are the descriptors the datagram brought — the ones it carried,
                a pidfd on its sender —, which the caller owns; nil when it brought none.
              name: Descriptors
              type: "*DescriptorsValue"
      - doc: |-
          PTYValue is a pseudo-terminal's window size in character cells, as TIOCSWINSZ
          sets it and TIOCGWINSZ reads it.
        name: PTYValue
        struct:
          fields:
            - doc: Rows is the number of character rows.
              name: Rows
              type: uint16
            - doc: Cols is the number of character columns.
              name: Cols
              type: uint16
      - doc: |-
          Resource identifies a per-process resource governed by setrlimit(2). It is an
          abstract, platform-portable enum; the service layer maps each value to the
          platform's RLIMIT_* constant. The zero value ResourceUnknown is the reserved
          invalid sentinel.
        methods:
          - doc: |-
              String reports the canonical lowercase name of r (e.g. "nofile"), or
              "unknown" for an unrecognised value. The names match the suffix of the
              systemd Limit* directives.
            name: String
            out:
              - type: string
            recv: value
          - doc: Known reports whether r is a defined resource other than the zero value.
            name: Known
            out:
              - type: bool
            recv: value
        name: Resource
        underlying: int
      - doc: |-
          ResultValue is what Run returns: the child's exit and the head of each of its
          output streams.
        name: ResultValue
        struct:
          fields:
            - doc: Exit is the child's ExitValue.
              name: Exit
              type: ExitValue
            - doc: Stdout is the first RunValue.MaxOutputBytes bytes the child wrote to its standard output.
              name: Stdout
              type: "[]byte"
            - doc: Stderr is the first RunValue.MaxOutputBytes bytes the child wrote to its standard error.
              name: Stderr
              type: "[]byte"
            - doc: |-
                Truncated reports whether either stream wrote more than MaxOutputBytes, the
                rest of it read and discarded.
              name: Truncated
              type: bool
      - doc: |-
          RunValue configures Run: how much of each output stream it keeps, and how long
          a cancelled run's child is given to stop.
        name: RunValue
        struct:
          fields:
            - doc: |-
                MaxOutputBytes is the number of bytes kept from each of stdout and stderr.
                The child's output past it is read and discarded, so the child never blocks
                on a full pipe and the caller never holds more. It must be positive: Run
                refuses zero with InvalidSpec (ADR 0031).
              name: MaxOutputBytes
              type: int
            - doc: |-
                Grace is how long a child whose run was cancelled is given between SIGTERM
                and SIGKILL; zero or less escalates at once.
              name: Grace
              type: time.Duration
      - doc: |-
          SchedPolicy is a CPU scheduling policy (Spec.Scheduling). Its values are
          Linux's SCHED_* numbers; the zero value SchedOther is the normal time-sharing
          policy.
        methods:
          - doc: |-
              String returns the lowercase policy name ("other", "fifo", "rr", "batch",
              "idle"), or "schedpolicy(N)" for an undefined value.
            name: String
            out:
              - type: string
            recv: value
        name: SchedPolicy
        underlying: int
      - doc: |-
          SchedulingValue is the CPU scheduling policy and I/O priority a child is
          spawned under (Spec.Scheduling). Its zero value asks for the normal policy and
          no I/O class: SchedOther at priority 0, IOClassNone.
        name: SchedulingValue
        struct:
          fields:
            - doc: Policy is the CPU scheduling policy.
              name: Policy
              type: SchedPolicy
            - doc: |-
                Priority is the static priority of SchedFIFO and SchedRR (1 to 99 on Linux,
                0 to 31 on FreeBSD); it must be 0 for every other policy.
              name: Priority
              type: int
            - doc: |-
                IOClass is the I/O scheduling class; IOClassNone leaves the kernel's
                default, derived from the CPU niceness.
              name: IOClass
              type: IOClass
            - doc: |-
                IOPriority is the level within IOClassRealTime or IOClassBestEffort, from 0
                (highest) to 7 (lowest).
              name: IOPriority
              type: int
      - doc: |-
          Signal is a typed, platform-portable OS signal. Its underlying value is the
          platform signal number, so Signal(syscall.SIGTERM) and a Signal parsed from
          "SIGTERM" compare equal. The zero value is the reserved invalid signal.
        methods:
          - doc: |-
              OS bridges s to the os.Signal expected by os/signal and Process.Signal. It is
              a zero-cost conversion to syscall.Signal — the canonical os.Signal carrier.
            name: OS
            out:
              - type: os.Signal
            recv: value
          - doc: Int reports the raw platform signal number underlying s.
            name: Int
            out:
              - type: int
            recv: value
          - doc: |-
              String reports the canonical upper-case name of s (e.g. "SIGTERM"). A
              realtime signal renders as "SIGRTMIN" or "SIGRTMIN+n" on Linux and FreeBSD.
              An unrecognised signal renders as "signal <n>" so logs stay unambiguous.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Known reports whether s names a signal in the platform table or in its
              realtime range (Linux and FreeBSD).
            name: Known
            out:
              - type: bool
            recv: value
        name: Signal
        underlying: int
      - doc: |-
          Spec is the immutable description of a process to spawn: the executable and
          its environment, the credentials and isolation topology to apply, and the
          resource/scheduling attributes to set between fork and exec. It carries no
          policy — restart, health, and dependency concerns belong to the caller.

          Pointer fields (Umask, Nice, OOMScoreAdj) distinguish "leave at the inherited
          default" (nil) from "set explicitly to zero". Maps and slices are read by the
          service layer and never mutated.
        name: Spec
        struct:
          fields:
            - doc: |-
                Path is the executable to run. Required. A value containing a path
                separator is a file path, taken as written (a relative one is resolved
                against Dir). A bare name — "go", "sh" — is searched in the PATH the
                CHILD will see: the PATH entry of Env whenever Env names one (an
                explicitly empty PATH= searches nothing), the parent's only when Env
                names none (including when Env is nil). os/exec's rules apply: the first
                executable in PATH order wins, and a match found only through a relative
                entry ("." or an empty one) is refused with exec.ErrDot.
              name: Path
              type: string
            - doc: |-
                Args is the full argv including argv[0]; when empty the service uses
                [Spec.Path] — the name as written, not the resolved file — as the sole
                argument.
              name: Args
              type: "[]string"
            - doc: Dir is the working directory; empty means inherit the parent's.
              name: Dir
              type: string
            - doc: |-
                Env is the explicit environment; nil yields an empty environment, never
                implicit inheritance, so a spawned service starts from a known state. A key
                set more than once keeps its last value, at the place of its last
                occurrence, as os/exec reads append(os.Environ(), "K=v"). A key beginning
                __KITSUNIUM_SDK_PROC_, in any case, is the SDK's own spawn protocol and is
                refused with ReservedEnv before any fork.
              name: Env
              type: "[]string"
            - doc: |-
                User is the name or numeric uid to setuid to; empty leaves the parent's.
                The child takes the user's primary gid unless Group names one. A numeric
                uid with no passwd entry has no primary gid, so it needs an explicit
                Group: alone it fails with UnknownUser, never falling back to gid 0.
              name: User
              type: string
            - doc: |-
                Group is the name or numeric gid to setgid to. Empty leaves the user's
                primary gid when User is set, and the parent's when it is not.
              name: Group
              type: string
            - doc: Groups are supplementary group names or gids (systemd SupplementaryGroups=).
              name: Groups
              type: "[]string"
            - doc: |-
                Setpgid places the child in its own process group, enabling group-kill of
                the whole tree (systemd KillMode=control-group without cgroups).
              name: Setpgid
              type: bool
            - doc: Setsid starts the child in a new session detached from the controlling tty.
              name: Setsid
              type: bool
            - doc: |-
                DieWithParent, when non-zero, is the signal the child receives when the
                supervisor dies — a SIGKILL or a crash included, where no Stop runs. Linux and
                FreeBSD set the kernel's parent-death signal (PR_SET_PDEATHSIG, procctl
                PROC_PDEATHSIG_CTL), which fires when the THREAD that forked the child exits:
                the Go runtime keeps its threads, but one whose goroutine ends while locked to
                it exits with it. Windows places the child in a Job Object with
                KILL_ON_JOB_CLOSE whose handle stays open for the supervisor's life, so any
                non-zero signal means termination there. Elsewhere a non-zero value surfaces
                UnsupportedPlatform before anything is spawned. The zero Signal requests
                nothing.
              name: DieWithParent
              type: Signal
            - doc: |-
                Umask, when non-nil, is the file-creation mask applied to the child
                (systemd UMask=).
              name: Umask
              type: "*int"
            - doc: |-
                Nice, when non-nil, is the scheduling-priority adjustment applied to the
                child (systemd Nice=). On Windows it selects the child's priority class at
                creation: -10 and below HIGH, below 0 ABOVE_NORMAL, 0 NORMAL, 1 to 10
                BELOW_NORMAL, above 10 IDLE.
              name: Nice
              type: "*int"
            - doc: |-
                OOMScoreAdj, when non-nil, is the /proc/<pid>/oom_score_adj value applied
                to the child (systemd OOMScoreAdjust=).
              name: OOMScoreAdj
              type: "*int"
            - doc: |-
                Scheduling, when non-nil, is the CPU scheduling policy and the I/O priority
                applied to the child (systemd CPUSchedulingPolicy=, CPUSchedulingPriority=,
                IOSchedulingClass=, IOSchedulingPriority=), on the live pid beside Nice. Linux
                applies both (sched_setscheduler, ioprio_set); FreeBSD applies SchedFIFO,
                SchedRR and SchedIdle through rtprio(2); every other platform refuses a Policy
                other than SchedOther or an IOClass other than IOClassNone with
                UnsupportedPlatform before spawning. An undefined policy or class, or an I/O
                level past 7, is InvalidSpec; a refusal by the kernel (a realtime policy
                without CAP_SYS_NICE) is RlimitFailed and the child is torn down.
              name: Scheduling
              type: "*SchedulingValue"
            - doc: |-
                Rlimits are per-resource soft/hard limits applied post-fork, pre-exec
                (systemd Limit*=); resources unsupported on the platform surface a typed
                error rather than silently no-op. Without a ResourceNoFile entry the child
                does not inherit the supervisor's open-file soft limit: the Go runtime
                raises its own to the hard limit at start and puts the original back in
                every child it forks, until rlimit.KeepRaisedNoFile is called.
              name: Rlimits
              type: map[Resource]LimitValue
            - doc: |-
                CgroupPath, when non-empty, is an already-created cgroup v2 directory the
                child is placed into BEFORE exec, so controller limits (MemoryMax/TasksMax/
                …) apply from its first instruction — closing the unconfined window that a
                post-spawn Group.Add(pid) leaves open (systemd places the unit's payload in
                its cgroup the same way). On Linux 5.7 and later the child is cloned straight
                into the group (clone3 with CLONE_INTO_CGROUP); on an older kernel, or one
                whose filter refuses clone3, the pre-exec trampoline writes its pid to
                <CgroupPath>/cgroup.procs. Linux-only: a non-empty
                value on any other GOOS surfaces UnsupportedPlatform; a path that is missing,
                not a cgroup v2 directory, or not delegated surfaces a typed cgroup error
                rather than spawning unconfined.
              name: CgroupPath
              type: string
            - doc: |-
                Stdio selects how the child's standard streams are wired: StdioInherit
                (default — share the parent's), StdioNull (discard to the null device),
                StdioCapture (use the Stdout/Stderr/Stdin members below), or StdioPTY (one
                pseudo-terminal for all three, sized by PTY). systemd
                StandardOutput=/StandardError=/StandardInput= is the analogue.
              name: Stdio
              type: StdioMode
            - doc: |-
                Stdout, when Stdio is StdioCapture, receives the child's standard output;
                a nil writer discards that stream to the null device.
              name: Stdout
              type: io.Writer
            - doc: |-
                Stderr, when Stdio is StdioCapture, receives the child's standard error;
                a nil writer discards that stream to the null device.
              name: Stderr
              type: io.Writer
            - doc: |-
                Stdin, when Stdio is StdioCapture, is copied to the child's standard input;
                a nil reader gives the child an immediate-EOF stdin. The reader should be
                EOF-terminating (a buffer, file, or strings.Reader); the copier closes the
                child's stdin at EOF and never blocks Wait.
              name: Stdin
              type: io.Reader
            - doc: |-
                PTY, when Stdio is StdioPTY, is the initial window size of the child's
                pseudo-terminal; nil leaves the size a new terminal has (zero by zero). It is
                ignored in every other mode.
              name: PTY
              type: "*PTYValue"
            - doc: |-
                DrainGrace bounds how long Wait waits for the StdioCapture copiers once the
                exit status is in hand. A process the child left behind that inherited its
                stdout or stderr — a daemon, `sleep 60 &` — keeps the pipe open after the
                child exits; when the grace closes, Wait closes the parent's pipe ends and
                returns the real ExitValue with StdioDrainTimeout. The zero value is the
                bounded default of one second (ADR 0031); a negative value waits for every
                byte however long the pipes stay open.
              name: DrainGrace
              type: time.Duration
            - doc: |-
                ExtraFiles are additional open files inherited by the child, in order,
                starting at file descriptor 3 (after stdin/stdout/stderr). This is the
                mechanism behind socket activation (sd_listen_fds): an activator binds
                listening sockets and passes them here, then sets LISTEN_FDS/LISTEN_PID in
                Env so the child finds them at fd 3..3+len-1. nil means no extra fds. They
                are the only descriptors past stdio the child gets, unless FDs says otherwise.
              name: ExtraFiles
              type: "[]*os.File"
            - doc: |-
                PIDEnv names variables the child is given set to its own PID, in decimal:
                the spawn sets them after the fork, before the program runs — what
                LISTEN_PID and WATCHDOG_PID need, since no parent knows a child's PID
                before forking it. A name here replaces the same name in Env. Setting one
                routes the spawn through the trampoline, as Rlimits and Umask do; Windows
                refuses it with UnsupportedPlatform. A name that is empty or holds '=',
                ',' or NUL is InvalidSpec, one beginning __KITSUNIUM_SDK_PROC_ ReservedEnv.
              name: PIDEnv
              type: "[]string"
            - doc: |-
                FDs says which of the supervisor's descriptors the child inherits besides its
                stdio and ExtraFiles. FDsSealed — the zero value — gives it none: Start first
                marks every descriptor of the supervisor from 3 up close-on-exec, one
                close_range(CLOSE_RANGE_CLOEXEC) on Linux 5.11 and later and on FreeBSD,
                otherwise a walk of /proc/self/fd (Linux, illumos, Solaris) or /dev/fd (darwin
                and the BSDs). The mark is process-wide and closes nothing: the supervisor keeps
                using its descriptors. FDsInherited lets the child inherit every descriptor that
                lacks close-on-exec, as fork/exec does by default — after a sealed spawn, only
                those opened without close-on-exec since. Windows passes a child only the
                handles it is given, so the field changes nothing there.
              name: FDs
              type: FDPolicy
            - doc: |-
                Sandbox, when non-nil, is the isolation the child is spawned under:
                namespaces, mounts, a new root, capabilities, no_new_privs, Landlock and
                seccomp, applied by the spawn's second stage before the program runs, the
                seccomp filter last. The identity (User, Group, Groups) is then taken by
                that stage too, after the capability bounding set is cut, and FDs must be
                FDsSealed. Linux on amd64 and arm64 applies it; any other platform refuses
                it with UnsupportedPlatform before anything is spawned, a kernel lacking a
                part of it with SandboxUnavailable, and a step that fails in the child with
                SandboxFailed — the program never runs unconfined.
              name: Sandbox
              type: "*SandboxValue"
      - doc: |-
          StdioMode selects how a spawned child's standard streams are wired. The zero
          value is StdioInherit, preserving the historical behaviour where the child
          shares the parent's stdin/stdout/stderr (systemd StandardOutput=/StandardInput=
          is the analogue, but the choice is generic to anything that spawns processes).
        methods:
          - doc: |-
              String returns the lowercase mode name ("inherit", "null", "capture", "pty"),
              or "stdiomode(N)" for an out-of-range value.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              Known reports whether m is one of the defined StdioInherit/StdioNull/StdioCapture/
              StdioPTY modes (i.e. m <= StdioPTY).
            name: Known
            out:
              - type: bool
            recv: value
        name: StdioMode
        underlying: uint8
      - doc: |-
          UsageValue is the resource accounting wait4 returns beside CPU time and peak
          RSS: the page faults, block I/O operations and context switches of the
          finished process. It is the value ExitValue.Usage carries.
        name: UsageValue
        struct:
          fields:
            - doc: |-
                Known reports whether the platform filled the counters. It is false on
                illumos, Solaris and Windows, where every counter reads zero, so a usage
                nobody measured is never read as an idle process.
              name: Known
              type: bool
            - doc: MinorFaults counts the page faults served without I/O (ru_minflt).
              name: MinorFaults
              type: uint64
            - doc: MajorFaults counts the page faults that needed I/O (ru_majflt).
              name: MajorFaults
              type: uint64
            - doc: InBlock counts the block input operations (ru_inblock).
              name: InBlock
              type: uint64
            - doc: OutBlock counts the block output operations (ru_oublock).
              name: OutBlock
              type: uint64
            - doc: VoluntaryCtxSw counts the times the process gave up the CPU (ru_nvcsw).
              name: VoluntaryCtxSw
              type: uint64
            - doc: InvoluntaryCtxSw counts the times the scheduler took the CPU away (ru_nivcsw).
              name: InvoluntaryCtxSw
              type: uint64
      - doc: |-
          CapabilitiesValue is the capability state a sandboxed child execs with
          (SandboxValue.Capabilities). A mask's bit n is capability n
          (linux/capability.h: 0 CAP_CHOWN … 40 CAP_CHECKPOINT_RESTORE).
        name: CapabilitiesValue
        struct:
          fields:
            - doc: |-
                Bounding is the bounding set the child keeps (systemd
                CapabilityBoundingSet=): every capability the kernel knows outside it is
                dropped with PR_CAPBSET_DROP, which needs CAP_SETPCAP — as uid 0 in a user
                namespace has. The zero value drops them all.
              name: Bounding
              type: uint64
            - doc: |-
                Ambient is raised in the child's ambient set (systemd
                AmbientCapabilities=), so a program that is not root keeps them across
                execve; its inheritable set becomes this one. It must lie within Bounding.
              name: Ambient
              type: uint64
            - doc: |-
                SecureBits, when non-zero, is set with PR_SET_SECUREBITS (systemd
                SecureBits=), its bits those of linux/securebits.h.
              name: SecureBits
              type: uint32
      - doc: |-
          IDMapValue is one line of a user namespace's uid_map or gid_map: Size ids
          from Inside in the namespace are Outside and up in the supervisor's.
        name: IDMapValue
        struct:
          fields:
            - doc: Inside is the first id in the namespace.
              name: Inside
              type: uint32
            - doc: Outside is the id Inside maps to in the supervisor's namespace.
              name: Outside
              type: uint32
            - doc: Size is the number of ids mapped; it must be at least 1.
              name: Size
              type: uint32
      - doc: |-
          LandlockAccess is a set of Landlock filesystem access rights, one bit per
          right, numbered as LANDLOCK_ACCESS_FS_* (linux/landlock.h).
        name: LandlockAccess
        underlying: uint64
      - doc: |-
          LandlockRuleValue grants Access beneath Path (LANDLOCK_RULE_PATH_BENEATH): to
          the file or directory itself and to everything below it.
        name: LandlockRuleValue
        struct:
          fields:
            - doc: |-
                Path is the absolute file or directory the rule covers, opened by the
                child after its mounts and its pivot.
              name: Path
              type: string
            - doc: |-
                Access is the set of rights granted beneath Path; it must lie within
                LandlockValue.Handled.
              name: Access
              type: LandlockAccess
      - doc: |-
          LandlockValue restricts a child's filesystem access (SandboxValue.Landlock):
          every right in Handled is denied beneath every path but the Rules' and the
          rights they grant there; a right outside Handled is not restricted. The
          kernel's Landlock ABI decides which rights exist: one it lacks is refused
          with SandboxUnavailable unless BestEffort names it, in which case it is left
          unrestricted. The ABI in effect is LandlockABI's answer.
        name: LandlockValue
        struct:
          fields:
            - doc: Handled is the set of rights restricted; it must not be empty.
              name: Handled
              type: LandlockAccess
            - doc: Rules grant rights beneath paths.
              name: Rules
              type: "[]LandlockRuleValue"
            - doc: |-
                BestEffort is the set of rights dropped rather than refused when the
                kernel's ABI lacks them.
              name: BestEffort
              type: LandlockAccess
      - doc: |-
          MountKind is what a MountValue mounts. The zero value MountReadOnly makes an
          existing tree read-only.
        name: MountKind
        underlying: uint8
      - doc: |-
          MountValue is one mount the child makes in its mount namespace
          (SandboxValue.Mounts).
        name: MountValue
        struct:
          fields:
            - doc: Kind is what is mounted.
              name: Kind
              type: MountKind
            - doc: |-
                Source is the directory or file a MountBind binds; empty for every other
                kind.
              name: Source
              type: string
            - doc: Target is the absolute path mounted on; it must exist.
              name: Target
              type: string
            - doc: |-
                ReadOnly makes a MountBind or a MountTmpfs read-only, recursively (a
                MountReadOnly always is).
              name: ReadOnly
              type: bool
      - doc: |-
          Namespace is a set of Linux namespaces (SandboxValue.Namespaces), one bit per
          namespace. The zero value is no namespace.
        name: Namespace
        underlying: uint32
      - doc: |-
          SandboxValue is the isolation a child is spawned under (Spec.Sandbox). The
          spawn applies it in two stages: the clone puts the child in its namespaces,
          then the child — re-executed from /proc/self/exe, on one locked thread —
          makes its mounts, pivots into its root, opens its Landlock paths, cuts its
          capability bounding set, sets its securebits, takes its identity, sets its
          capabilities, marks every descriptor past the ones it is given
          close-on-exec, sets no_new_privs, restricts itself with Landlock and
          installs its seccomp filter last, just before execve. A step that fails
          stops the spawn before the program runs (SandboxFailed); a part the kernel
          cannot apply is refused before the fork (SandboxUnavailable), and a platform
          without the mechanism refuses the whole value (UnsupportedPlatform). Linux
          on amd64 and arm64 applies it; every other platform refuses it.
        name: SandboxValue
        struct:
          fields:
            - doc: |-
                Namespaces are the namespaces the child is cloned into (systemd
                PrivateUsers=, PrivatePIDs=, PrivateMounts=, PrivateIPC=, ProtectHostname=,
                PrivateNetwork=, ProtectControlGroups=). A mount namespace is unshared
                with every mount of it made private first, so nothing the child mounts
                propagates back. Without NamespaceUser, an unprivileged supervisor's
                clone is refused by the kernel.
              name: Namespaces
              type: Namespace
            - doc: |-
                UIDMap maps the user namespace's uids to the supervisor's (NamespaceUser).
                Empty maps the namespace's uid 0 to the supervisor's effective uid, one id
                wide — the one mapping an unprivileged supervisor may write.
              name: UIDMap
              type: "[]IDMapValue"
            - doc: |-
                GIDMap maps the user namespace's gids, as UIDMap maps the uids; setgroups(2)
                is denied in the namespace.
              name: GIDMap
              type: "[]IDMapValue"
            - doc: |-
                Mounts are made in order in the child's mount namespace, which they
                require (NamespaceMount).
              name: Mounts
              type: "[]MountValue"
            - doc: |-
                Root, when not empty, is the absolute directory the child pivots into
                after its Mounts (systemd RootDirectory=, through pivot_root(2)); the old
                root is detached. Spec.Path and Spec.Dir are then paths inside it, and
                Spec.Path must hold a '/'. It requires NamespaceMount.
              name: Root
              type: string
            - doc: |-
                Capabilities, when non-nil, bounds the child's capabilities; nil leaves
                them as inherited.
              name: Capabilities
              type: "*CapabilitiesValue"
            - doc: |-
                NoNewPrivileges sets no_new_privs (systemd NoNewPrivileges=): no execve of
                the child or its descendants gains a privilege. Landlock and Seccomp set
                it whatever this says, as the kernel requires of an unprivileged caller.
              name: NoNewPrivileges
              type: bool
            - doc: Landlock, when non-nil, restricts the child's access to the filesystem.
              name: Landlock
              type: "*LandlockValue"
            - doc: Seccomp, when non-nil, filters the child's system calls.
              name: Seccomp
              type: "*SeccompValue"
      - doc: |-
          SeccompAction is what a seccomp filter does with a system call. The zero
          value SeccompKill kills the process.
        name: SeccompAction
        underlying: uint8
      - doc: |-
          SeccompValue is a child's system call filter (SandboxValue.Seccomp, systemd
          SystemCallFilter= and SystemCallErrorNumber=): the calls named in Syscalls
          take Action, every other call Default. A call from another architecture's
          ABI — or the x32 ABI on amd64 — kills the process. execve, exit, exit_group,
          rt_sigreturn and the spawn's own failure report always pass, since the
          filter is installed before the child's program is executed: a Syscalls entry
          naming one of the first four with an action other than SeccompAllow is
          InvalidSpec.
        name: SeccompValue
        struct:
          fields:
            - doc: Default is the action of every call Syscalls does not name.
              name: Default
              type: SeccompAction
            - doc: |-
                Syscalls are the calls Action applies to, by their Linux names ("mkdirat").
                A name no supported architecture knows is InvalidSpec; one this
                architecture lacks matches nothing.
              name: Syscalls
              type: "[]string"
            - doc: |-
                Action is the action of the calls Syscalls names; it must differ from
                Default.
              name: Action
              type: SeccompAction
            - doc: Errno is the error number SeccompErrno returns, 1 to 4095; zero is EPERM.
              name: Errno
              type: int
  - doc: |-
      Package buildinfo is what the running binary was built from, read from the
      build information the Go toolchain embedded in it.

      It only reads, and only the binary it runs in — or a debug.BuildInfo handed
      to ParseBuild. It is a package of its own, apart from
      internal/service/proc/self's runtime metrics, so that a program which only
      asks what it was built from never imports runtime/metrics, whose
      initialisation every process importing it pays at start (ADR 0172). Nothing
      here can fail in a way a caller could act on, so nothing returns an error: a
      binary built without module support reads as false.
    functions:
      - doc: |-
          ReadBuild describes the running binary. It reports false when the binary
          carries no build information — one built without module support — and
          never fails otherwise.
        name: ReadBuild
        out:
          - name: build
            type: BuildValue
          - name: ok
            type: bool
      - doc: |-
          ParseBuild describes the build info. It is what ReadBuild uses on the
          running binary, exported for a BuildInfo from elsewhere — one a test builds
          by hand, or debug.ParseBuildInfo's reading of another binary's `go version
          -m` output. A nil info describes nothing.
        in:
          - name: info
            type: "*debug.BuildInfo"
        name: ParseBuild
        out:
          - type: BuildValue
    imports:
      debug: runtime/debug
    path: github.com/kitsunium/sdk/internal/service/proc/buildinfo
    types:
      - doc: |-
          BuildValue is what the running binary was built from: the toolchain, the
          main package, the main module with its version-control stamp, and every
          dependency with the replacement it was built through.

          It is the engine's own value (ADR 0074): no port in the proc domain speaks
          it, and it describes one mechanism's reading of runtime/debug.
        methods:
          - doc: |-
              Module returns the module whose path is path — the main module or one of
              the dependencies — and whether the build contains it.
            in:
              - name: path
                type: string
            name: Module
            out:
              - name: found
                type: ModuleValue
              - name: ok
                type: bool
            recv: pointer
          - doc: |-
              Reproducible reports whether the build can be made again byte for byte
              from its source: built with -trimpath, from a recorded revision, with no
              uncommitted change. It is false for a build that does not say — one
              outside version control, or a Bazel build, which stamps none of the
              three.
            name: Reproducible
            out:
              - type: bool
            recv: pointer
        name: BuildValue
        struct:
          fields:
            - doc: GoVersion is the toolchain that built the binary, e.g. "go1.27.1".
              name: GoVersion
              type: string
            - doc: |-
                Path is the import path of the main package, e.g.
                "github.com/acme/app/cmd/server".
              name: Path
              type: string
            - doc: Main is the main module.
              name: Main
              type: ModuleValue
            - doc: |-
                Deps are the dependencies linked into the binary, in the order the
                toolchain recorded them.
              name: Deps
              type: "[]ModuleValue"
            - doc: |-
                Toolchain is how the toolchain built the binary: the target, the
                compiler, the flags and the cgo setting, read from the build settings.
              name: Toolchain
              type: ToolchainValue
            - doc: |-
                Settings are every build setting the toolchain recorded, verbatim and in
                its order — the vcs stamp and the toolchain's included, and a key a later
                toolchain adds that Toolchain does not name.
              name: Settings
              type: "[]SettingValue"
      - doc: |-
          ModuleValue is one module of the running binary, described by the code
          that was actually built for it.

          Its fields separate the three things a recorded version conflates: a
          RELEASE (Version), a COMMIT (Revision and Time), and a DIRECTORY on the
          build machine (Local and Dir). A pseudo-version names a commit rather than
          a release, so it fills Revision and Time and leaves Version empty; a module
          built from a directory has no version to tell at all.
        name: ModuleValue
        struct:
          fields:
            - doc: |-
                Time is the commit's time, when known: the main module's vcs.time
                stamp, or the timestamp a pseudo-version carries. Zero otherwise.
              name: Time
              type: time.Time
            - doc: |-
                Path is the module path the build required, e.g.
                "github.com/kitsunium/sdk".
              name: Path
              type: string
            - doc: |-
                Version is the released version the code came from, e.g. "v0.4.6", or
                "" when there is none to tell: a pseudo-version (a commit, in Revision),
                a module built from a local directory, or a main module built without
                one. A "+dirty" suffix is not kept here; it is what Modified says.
              name: Version
              type: string
            - doc: |-
                Revision is the version-control commit the code came from, when known:
                the main module's vcs.revision stamp (a full object name), or the
                commit a pseudo-version names (its twelve-character prefix).
              name: Revision
              type: string
            - doc: |-
                Dir is the directory a replace directive pointed the module at, as the
                toolchain recorded it — relative to the main module, or to the
                workspace root in workspace mode — or "" when it was not replaced by a
                directory. A workspace module is Local with no Dir: the toolchain does
                not record where it was.
              name: Dir
              type: string
            - doc: |-
                Replacement is the module path a replace directive substituted, when it
                substituted another module rather than a directory; Version is then
                that module's.
              name: Replacement
              type: string
            - doc: |-
                Local reports that the code came from a directory on the build machine
                rather than from a published version: a directory replacement, a
                workspace module, or a main module built inside its own source tree.
              name: Local
              type: bool
            - doc: |-
                Modified reports that the build included uncommitted changes: the main
                module's vcs.modified stamp, or the "+dirty" its version carried. The
                toolchain records nothing of the kind for a dependency.
              name: Modified
              type: bool
      - doc: |-
          SettingValue is one build setting as the toolchain recorded it: a key such
          as "-trimpath", "CGO_ENABLED" or "vcs.revision", and its value.
        name: SettingValue
        struct:
          fields:
            - doc: Key names the setting, e.g. "-tags" or "GOAMD64".
              name: Key
              type: string
            - doc: Value is the setting's value as recorded, e.g. "a,b" or "v3".
              name: Value
              type: string
      - doc: |-
          ToolchainValue is how the toolchain built the binary, read by key from the
          build settings it recorded. A setting the toolchain did not record leaves
          its field zero: a build by the go command records the target and the
          compiler, and one by Bazel records none of them.
        name: ToolchainValue
        struct:
          fields:
            - doc: OS is the target operating system, GOOS, e.g. "linux".
              name: OS
              type: string
            - doc: Arch is the target architecture, GOARCH, e.g. "amd64".
              name: Arch
              type: string
            - doc: |-
                ArchLevel is the architecture's feature level — GOAMD64, GOARM, GO386,
                GOARM64 and their siblings — e.g. "v3", which needs AVX2 on the host.
              name: ArchLevel
              type: string
            - doc: Compiler is the compiler toolchain, -compiler, e.g. "gc".
              name: Compiler
              type: string
            - doc: BuildMode is the -buildmode flag, e.g. "exe" or "pie".
              name: BuildMode
              type: string
            - doc: |-
                Tags are the build tags, -tags, in the order given; none when the build
                named none.
              name: Tags
              type: "[]string"
            - doc: LDFlags is the -ldflags flag as given, e.g. "-s -w -X main.v=1".
              name: LDFlags
              type: string
            - doc: |-
                DefaultGODEBUG is the GODEBUG default the binary runs with before its
                environment's, e.g. "httpmuxgo121=1".
              name: DefaultGODEBUG
              type: string
            - doc: CgoEnabled reports that CGO_ENABLED was 1.
              name: CgoEnabled
              type: bool
            - doc: |-
                Trimpath reports that -trimpath was set: file paths in panics and
                profiles are module paths, not the build machine's directories.
              name: Trimpath
              type: bool
  - doc: |-
      Package cgroup — creates and manages cgroup v2 control groups.

      This file holds the platform-neutral surface: Available and Create delegate
      to the build-tagged available / createGroup implementations (cgroup_linux.go
      on Linux, cgroup_other.go everywhere else). The returned Group satisfies the
      core proc.Group port — set memory/cpu/pids/io ceilings, attach processes, and
      remove the group — and is implemented only against the unified cgroup v2
      hierarchy. Non-Linux builds and unprivileged/non-delegated Linux hosts degrade
      to the typed proc sentinels rather than panicking.

      Package cgroup — FreeBSD control groups via rctl(8) (RACCT/RCTL). FreeBSD has
      no cgroup v2 hierarchy; the native resource-limit mechanic is rctl, whose
      rules are strings of the form "subject:subject-id:resource:action=amount"
      applied through the rctl_add_rule(2) / rctl_remove_rule(2) syscalls. We bind
      those syscalls directly (dep-light, no golang.org/x/sys — the same discipline
      as the Windows Job Object backend), hand-citing the syscall numbers from
      FreeBSD sys/kern/syscalls.master.

      Mapping to the core/proc.Group port (a group here is a tracked PID set; rctl
      rules are per-process, so limits are stored and (re)applied to each member):
        - SetMemoryMax → process:PID:vmemoryuse:deny=N
        - SetCPUMax    → process:PID:pcpu:deny=PCT   (PCT = quota/period*100)
        - Add          → apply every stored rule to PID
        - Kill         → SIGKILL every member
        - Delete       → rctl_remove_rule "process:PID" for every member

      SetPidsMax (rctl maxproc is a user/loginclass/jail resource, never a
      per-process one), SetIOMax (the spec string is cgroup-format), and
      Freeze/Thaw (rctl has no quiesce) return the uniform UnsupportedPlatform
      sentinel — exactly as the Windows backend degrades its non-mappable verbs.

      Package cgroup — Linux cgroup v2 control-group implementation.

      Package cgroup — degrade stub for platforms with no control-group facility:
      cgroup v2 is Linux-only, Windows has its own Job Object backend
      (cgroup_windows.go), and FreeBSD has its own rctl backend
      (cgroup_freebsd.go), so this covers darwin and the remaining BSDs
      (OpenBSD/NetBSD/DragonFly), where no equivalent exists.

      Package cgroup — Windows control groups via Job Objects. A Win32 Job Object is
      the native, kernel-enforced equivalent of a cgroup v2 control group: it caps a
      set of assigned processes' memory / CPU / process-count and can terminate them
      atomically. We bind the kernel32 entry points directly (syscall.NewLazyDLL, no
      golang.org/x/sys per the dep-light invariant) with the ABI struct layouts
      hand-declared and cited from the Win32 headers (winnt.h / jobapi2.h), the same
      discipline the proc trampoline already uses.

      Mapping to the core/proc.Group port:
        - Create        → CreateJobObjectW
        - SetMemoryMax  → JOBOBJECT_EXTENDED_LIMIT_INFORMATION.ProcessMemoryLimit
        - SetCPUMax     → JOBOBJECT_CPU_RATE_CONTROL_INFORMATION (hard cap)
        - SetPidsMax    → JOBOBJECT_BASIC_LIMIT_INFORMATION.ActiveProcessLimit
        - Add           → OpenProcess + AssignProcessToJobObject
        - Kill          → TerminateJobObject
        - Delete        → CloseHandle

      SetIOMax and Freeze/Thaw have no stable, generally-available Job Object
      equivalent, so they return the uniform UnsupportedPlatform sentinel.

      Package cgroup — the Option functional-option type and its accumulator.
    functions:
      - doc: |-
          Available reports whether the unified cgroup v2 hierarchy is mounted at
          /sys/fs/cgroup AND a sub-group can be created under it by the caller (the
          delegation test). It returns false off Linux, on a cgroup v1 host, and on a
          Linux host where the hierarchy is read-only to the caller. It answers for
          the mount root only: for a delegated subtree, use Probe.
        name: Available
        out:
          - type: bool
      - doc: |-
          Create makes a new control group named name under the delegated cgroup v2
          root and returns a Group handle bound to it. On Linux name may be a nested
          path, "a/b", whose missing groups are made on the way; a name that is
          absolute, not canonical, climbs with "..", or crosses a link is InvalidSpec,
          and nothing is ever made or written outside the root. It returns
          CgroupUnavailable when the hierarchy is absent or not delegated,
          CgroupControllerAbsent when WithControllers names a controller the
          root does not offer, CgroupCreateFailed when mkdir fails, and
          UnsupportedPlatform off Linux.
        in:
          - name: name
            type: string
          - name: opts
            type: Option
        name: Create
        out:
          - name: g
            type: coreproc.Group
          - name: err
            type: error
        variadic: true
      - doc: |-
          WithControllers enables ctrls for the group Create makes: they are written
          to the cgroup.subtree_control of the root and of every group between the
          root and the new one, top-down, before the group is made, so its interface
          files for them exist. A controller the root's cgroup.controllers does not
          list is CgroupControllerAbsent before anything is made. It is a cgroup
          v2 option: the Job Object and rctl backends accept it and ignore it.
        in:
          - name: ctrls
            type: coreproc.Controller
        name: WithControllers
        out:
          - type: Option
        variadic: true
      - doc: |-
          WithRoot overrides the parent directory under which Create makes the new
          control group. Use it to target a delegated sub-tree (e.g. the cgroup a
          container manager handed to the caller) instead of the top-level mount.
        in:
          - name: root
            type: string
        name: WithRoot
        out:
          - type: Option
      - doc: |-
          Probe reports what the caller may do under a control-group root: WithRoot's,
          else the unified mount. Where Available answers for the mount root alone —
          false on every host that delegates a subtree rather than the root, a
          systemd unit with Delegate=yes, a rootless container, a user session —
          Probe answers for the root it is given, and names the caller's own cgroup
          to pass back as WithRoot. On Linux it never fails: a root without the
          cgroup.controllers marker is not Mounted. On Windows (Job Objects) and
          FreeBSD (rctl, with RACCT) Mounted and Delegated are Available's answer and
          OwnGroup is empty: neither has a hierarchy to delegate. Elsewhere it
          returns UnsupportedPlatform.
        in:
          - name: opts
            type: Option
        name: Probe
        out:
          - type: ProbeValue
          - type: error
        variadic: true
      - doc: |-
          Membership returns the cgroup v2 path /proc/<pid>/cgroup names for a
          process of the group whose directory is dir — the path coreproc's
          AttachValue.Cgroup bounds an adoption with —, read off the cgroup2 mount
          that holds dir: "/sys/fs/cgroup/system.slice/web.service" is
          "/system.slice/web.service", and under a mount that exposes a subtree the
          path is that subtree's. GroupTree.Path is a directory, never this path.
          It returns InvalidSpec when dir is not absolute and clean or no cgroup2
          mount holds it, and UnsupportedPlatform off Linux.
        in:
          - name: dir
            type: string
        name: Membership
        out:
          - type: string
          - type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/cgroup
    types:
      - doc: |-
          ProbeValue is what Probe found under a control-group root: whether it is a
          cgroup v2 directory, whether the caller may create a group under it, its
          controllers, and the caller's own cgroup.
        name: ProbeValue
        struct:
          fields:
            - doc: Root is the directory probed.
              name: Root
              type: string
            - doc: |-
                OwnGroup is the directory of this process's own unified cgroup — the
                root a delegated caller passes back as WithRoot — or empty where there
                is none to name.
              name: OwnGroup
              type: string
            - doc: Controllers are the controllers Root's cgroup.controllers lists.
              name: Controllers
              type: "[]string"
            - doc: Mounted reports that Root is a cgroup v2 directory.
              name: Mounted
              type: bool
            - doc: |-
                Delegated reports that the caller may create a group under Root: a
                uniquely named one was created and removed.
              name: Delegated
              type: bool
      - doc: |-
          Option customises a Create call (functional-option pattern). Construct
          options with the WithRoot helper; the zero set yields a group directly under
          the unified cgroup v2 mount.
        name: Option
        underlying: func(*groupConfig)
  - doc: |-
      Package childwait decides who receives a child's exit status (ADR 0093).

      A process has two kinds of waiter for its children. The Process handle
      returned by service/proc/exec waits for the one child it spawned. The reaper
      (service/proc/reaper), switched on when the supervisor runs as pid 1 or as a
      subreaper, answers every SIGCHLD with wait4(-1) — which collects ANY child,
      the handle's included. The kernel hands a zombie's status to exactly one
      wait, so before this package whichever call reached the kernel first kept it:
      when the sweep won, the handle's own wait failed with ECHILD and an exit 0
      was reported as WAIT_FAILED. A supervisor read that as a failure and
      restarted a service that had stopped cleanly.

      The ledger makes every status reach its owner whoever collects it:

        - Spawn forks and CLAIMS the child in one step. The fork runs under a
          shared gate and the pid is claimed before the gate is released, so no
          sweep can decide a child is nobody's while its spawn is in flight.
        - ReapAny is the only wait4(-1) in the SDK. A child it collects that is
          claimed has its status stored on the claim, under a lock held from before
          the wait4 until after the hand-off. The claim is looked up only once no
          spawn is between fork and claim, so a child that exited before its spawn
          registered it is found, and a claim left on a recycled pid has already
          been replaced by the newer child's. A child nobody claims is an orphan.
        - The owner still waits for its own child itself, so a process without a
          reaper behaves exactly as before. When that wait fails with ECHILD, the
          owner takes the sweep lock — any hand-off still in progress lands first —
          and reads the status from its claim. A status stored before the owner
          ever waited is read first, so it is never waited for at all.

      A status is lost only when something outside the SDK reaps the child, and
      the owner then learns it deterministically instead of hanging.

      Package childwait — off Unix there is no wait4 and no reaper, so nothing but
      the owner ever collects a child and the ledger only records claims.

      Package childwait — the Unix half: the status wait4 reports, and the one
      wait4 for any child in the SDK (wait4(-1); wait4(0) on illumos and Solaris,
      see waitany_solaris.go).

      Package childwait — the pid that means "any child" to wait4 on illumos and
      Solaris (the solaris build tag selects both).

      Package childwait — the pid that means "any child" to wait4 on every Unix but
      illumos and Solaris, whose libc reads it otherwise (waitany_solaris.go).
    functions:
      - doc: |-
          Spawn runs start — a fork/exec returning the started process — and claims
          the child before any sweep can treat it as an orphan. start's error is
          returned verbatim, with no process and no claim. The caller owns the claim
          and must end it through Reclaim or Release once it has the exit status.
        in:
          - name: start
            type: func() (*os.Process, error)
        name: Spawn
        out:
          - name: proc
            type: "*os.Process"
          - name: claim
            type: "*Claim"
          - name: err
            type: error
      - build: unix
        doc: |-
          ReapAny performs one non-blocking wait4 for any child — the only one in the
          SDK, and wait4(-1) everywhere but illumos and Solaris, where libc spells it
          wait4(0) — and, before returning, hands the status of a claimed child to its
          claim. It returns what wait4 returned: a positive pid for a collected child,
          0 when children exist but none has exited, or -1 and the errno (ECHILD when
          there are no children at all). Callers loop on it to drain.
        name: ReapAny
        out:
          - name: pid
            type: int
          - name: err
            type: error
      - build: unix
        doc: |-
          ReapAnyObserved is ReapAny with an observer: observe, when not nil, hears of
          every child the sweep collects — its pid, its status and whether a claim
          owned it — after the hand-off and under the sweep lock, before ReapAny would
          return. It is the one moment an orphan's status exists: the observer is told
          and nothing is stored (ADR 0093). It must not block, and must not keep
          status, which the next sweep reuses.
        in:
          - name: observe
            type: func(pid int, status *StatusValue, owned bool)
        name: ReapAnyObserved
        out:
          - name: pid
            type: int
          - name: err
            type: error
      - build: unix && !386 && !arm && !mips && !mipsle
        doc: |-
          MaxRSSKB reports the peak resident set size in KiB from a wait4 rusage. On a
          64-bit GOARCH Rusage.Maxrss is already int64; the unit is normalised — a
          kilobyte figure passes through, darwin's bytes are converted, rounding up.
        in:
          - name: ru
            type: "*syscall.Rusage"
        name: MaxRSSKB
        out:
          - type: int64
      - build: unix && (386 || arm || mips || mipsle)
        doc: |-
          MaxRSSKB reports the peak resident set size in KiB from a wait4 rusage. On a
          32-bit GOARCH Rusage.Maxrss is int32, so it is widened to the int64
          ExitValue.MaxRSS documents, then normalised.
        in:
          - name: ru
            type: "*syscall.Rusage"
        name: MaxRSSKB
        out:
          - type: int64
      - build: unix && !illumos && !solaris
        doc: |-
          UsageOf reads the page-fault, block-I/O and context-switch counters of a
          wait4 rusage into ExitValue.Usage, Known set. Linux, darwin and the BSDs
          fill them; a counter that reads negative is reported as zero, not wrapped.
          The value is returned, not a pointer: a collection converts it without
          allocating.
        in:
          - name: ru
            type: "*syscall.Rusage"
        name: UsageOf
        out:
          - type: coreproc.UsageValue
      - build: illumos || solaris
        doc: |-
          UsageOf reports no counters on illumos and Solaris: their wait4 leaves the
          rusage counters unfilled, as it leaves ru_maxrss at 0, so the value's Known
          is false rather than a row of zeros that would read as an idle process.
        in:
          - name: _
            type: "*syscall.Rusage"
        name: UsageOf
        out:
          - type: coreproc.UsageValue
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/childwait
    types:
      - doc: |-
          Claim is a spawner's hold on one child's exit status. It is created by Spawn,
          filled by a sweep that collects the child, and ended by the owner once the
          status is in hand. A Claim is safe for concurrent use. A nil *Claim holds
          nothing: every method answers as for a claim no sweep ever filled.
        methods:
          - doc: |-
              Collected reports the status a sweep handed over, if one has. An owner asks
              before waiting itself: a child already collected must not be waited for by
              pid, because the pid may by now belong to another process.
            name: Collected
            out:
              - name: status
                type: StatusValue
              - name: ok
                type: bool
            recv: pointer
          - doc: |-
              Reclaim is for an owner whose own wait failed with ECHILD — the child was
              reaped by someone else. It waits for any sweep in progress to finish its
              hand-off, then reports the status the ledger collected. ok false means
              nothing in the SDK took the child: something outside it reaped the child and
              the status is lost. Either way the claim is ended.
            name: Reclaim
            out:
              - name: status
                type: StatusValue
              - name: ok
                type: bool
            recv: pointer
          - doc: |-
              Release ends the claim: the owner has the exit status from its own wait, or
              has given up on it. A later sweep that collects the same pid belongs to a
              different child and must not land on this claim.
            name: Release
            recv: pointer
        name: Claim
        struct:
          unexported: true
      - build: "!unix"
        doc: |-
          StatusValue carries nothing off Unix: no sweep exists to collect a child, so
          no claim is ever filled and an owner always has the status from its own wait.
        name: StatusValue
        struct: {}
      - build: unix
        doc: |-
          StatusValue is what wait4 collected for one child: the termination status
          word and the resource usage reported with it — exactly what the owner's own
          wait would have returned.
        methods:
          - doc: |-
              Exit reads the status in the words a Process's Wait reports: the exit code,
              or -1, the terminating signal and whether it dumped core, and the CPU times,
              peak RSS and counters of the rusage — so a child nobody claimed is described
              as an owned one is.
            name: Exit
            out:
              - type: coreproc.ExitValue
            recv: pointer
        name: StatusValue
        struct:
          fields:
            - doc: WaitStatus is the child's termination status (exit code or signal).
              name: WaitStatus
              type: syscall.WaitStatus
            - doc: Rusage is the resource usage wait4 reported for the child.
              name: Rusage
              type: syscall.Rusage
  - doc: |-
      Package exec — Unix best-effort post-start attributes: scheduling priority
      (Nice), OOM-killer bias (OOMScoreAdj). Each is applied after fork/exec and
      surfaces a typed error when the host refuses, rather than silently dropping a
      requested field.

      Package exec — Linux pre-exec cgroup v2 placement. When a Spec sets
      CgroupPath, the child must join that control group BEFORE it execs the target,
      so the controller limits (memory.max, pids.max, …) bind from the first
      instruction rather than after a post-spawn Group.Add(pid) race. The parent
      validates the path up front (validateCgroupPath); the trampoline then writes
      its own pid into <path>/cgroup.procs (applyCgroupPlacement) between the rlimit
      step and execve. cgroups are Linux-only, so this file is the only place that
      touches them; the !linux sibling rejects a non-empty path as UnsupportedPlatform.

      Package exec — cgroup placement on Unix platforms that are NOT Linux (the
      BSDs, Darwin). cgroup v2 is a Linux mechanism with no portable equivalent, so
      a non-empty Spec.CgroupPath is rejected up front with UnsupportedPlatform
      rather than silently ignored — silently dropping the placement would run the
      target unconfined, the exact failure the feature exists to prevent. The
      trampoline never reaches applyCgroupPlacement here because validateCgroupPath
      fails the spawn first; it is defined only to keep the unix build self-contained.

      Package exec — Windows cgroup-placement guard. A Spec.CgroupPath names a
      cgroup v2 directory, a Linux-only concept; Windows confines via Job Object
      assignment through the cgroup port (a handle, not a path), so a non-empty path
      at spawn has no meaning here and is rejected with the uniform sentinel.

      Package exec — Unix credential resolution: maps Spec.User/Group/Groups (names
      or numeric ids) to a syscall.Credential via os/user, the systemd
      User=/Group=/SupplementaryGroups= analogue.

      Package exec — the keystone spawn primitive: turns a coreproc.Spec into a
      running, supervised process via fork/exec with credentials, a private process
      group/session, and best-effort scheduling attributes.

      The platform-portable surface is Start; the concrete fork/exec lives in
      exec_unix.go (every Unix GOOS) with a degrading no-op in exec_other.go so the
      package compiles on every target. Errors are the central coreproc sentinels,
      wrapped (never re-Defined) with errs.Wrap.

      Package exec — the Unix spawn: validates the Spec, resolves credentials,
      builds the SysProcAttr (Setpgid/Setsid/Credential), forks/execs via
      os.StartProcess, then applies best-effort scheduling attributes. Returns a
      *Handle satisfying the coreproc.Process port.

      Package exec — the Windows spawn primitive. Start turns a Spec into a running,
      supervised process via os.StartProcess (CreateProcess under the hood) and
      returns a coreproc.Process handle. Stdio (inherit/null/capture) reuses the
      portable stdioState; Setpgid maps to a new console process group so a later
      CTRL_BREAK can target the child. The Unix-only Spec fields — rlimits, umask,
      nice/oom, credentials, ExtraFiles, a cgroup path — have no Windows equivalent
      in this layer (resource confinement is the Job Object backend's job, applied at
      the cgroup port), so they are rejected up front with the uniform sentinel
      rather than silently dropped.

      Package exec — the process-handle value: a Unix supervision handle
      implementing the coreproc.Process port over an *os.Process, with group-aware
      Signal/Stop and a once-only Wait that captures exit status plus wait4 rusage.
      The concrete type is unexported; Start returns it as the coreproc.Process
      interface.

      Package exec — the Windows process-handle value implementing the
      coreproc.Process port over an *os.Process. Windows has no Unix process groups
      or wait4 rusage, so SignalGroup sends a Setpgid child's console group
      CTRL_BREAK and degrades to the leader without one, and the ExitValue
      carries the exit code + CPU times the os layer exposes (no terminating signal,
      no MaxRSS). The concrete type is unexported; Start returns it as the interface.

      Package exec — the parent<->trampoline handshake pipe. The re-exec trampoline
      (trampoline_unix.go) applies rlimits/umask in a forked child before exec'ing
      the real target; if that application fails, or the execve itself fails, the
      child exits with a distinct status — but Start could not otherwise tell that
      apart from a legitimate target exit of the same code. This pipe closes the gap:
      the child inherits the write end as handshakeFD and reports a one-byte status
      through it, so Start surfaces a typed RlimitFailed / SpawnFailed instead of a
      silent spawn. It is the same self-pipe + close-on-exec trick os/exec uses for
      its own errpipe: a clean execve closes the fd (the parent reads EOF = success),
      a failure writes a status byte first.

      Package exec — spawn-time resource confinement via a Win32 Job Object: the
      Windows realisation of a Spec's rlimits. A child requesting a mappable Resource
      is assigned, right after spawn, to a Job Object carrying the limit, so the
      rlimit "grafts onto" the spawn (the cgroup port is the standalone equivalent).
      kernel32 is bound directly (syscall.NewLazyDLL, ABI cited, no x/sys).

      Mappable: ResourceAS/ResourceData → ProcessMemoryLimit; ResourceNProc →
      ActiveProcessLimit. Every other Resource (NoFile/Core/FSize/Stack/MemLock) has
      no Job Object analogue and is rejected with UnknownResource before the spawn,
      honouring the no-silent-field-loss rule.

      Package exec — Unix umask / rlimit validation for the spawn. The Go runtime
      exposes no SysProcAttr hook to run setrlimit(2)/umask(2) in the child between
      fork and exec, so Start honours both via the re-exec trampoline
      (trampoline_unix.go): a Spec requesting a mapped Rlimit or a Umask is spawned
      through a self-invocation that applies the limits then execs the target. This
      validator therefore only rejects a Resource with no platform RLIMIT_* mapping
      (the SDK's "no silent field loss" rule) — every mappable field is honoured.

      Package exec — RLIMIT_AS mapping for the platforms whose stdlib syscall exports
      it (Linux, Darwin, FreeBSD, NetBSD, DragonFly). OpenBSD has no address-space
      rlimit — RLIMIT_AS is absent from its kernel ABI — so it provides the no-op in
      limittable_openbsd.go instead, leaving ResourceAS unmapped (UnknownResource).

      Package exec — OpenBSD has no address-space rlimit (RLIMIT_AS is absent from
      its kernel ABI), so it adds no resources beyond the common Unix set. ResourceAS
      therefore stays unmapped on OpenBSD and a Spec requesting it surfaces the typed
      UnknownResource — the honest "this platform cannot set that limit" answer,
      rather than a build failure on the missing constant.

      Package exec — Unix Resource→RLIMIT_* table. Only the constants the stdlib
      syscall package exports are mapped; RLIMIT_NPROC and RLIMIT_MEMLOCK live in
      golang.org/x/sys (banned here), so those resources stay unmapped and surface
      UnknownResource rather than a wrong limit. The address-space limit (RLIMIT_AS)
      is present on every supported target EXCEPT OpenBSD, so it is added by a
      build-tagged addPlatformLimits (limittable_as.go / limittable_openbsd.go)
      rather than referenced here — that keeps this file compiling on OpenBSD.

      Package exec — resolving a bare executable name through the PATH the child
      will run with.

      os.StartProcess does not search PATH: it hands its path to execve (or to
      CreateProcess) as written, so a bare "go" names a file in the current
      directory and fails with ENOENT. The port documents Spec.Path as "absolute
      or PATH-resolvable", which is what os/exec.Command gives a Go programmer, so
      the resolution happens here, once, before either spawn path — the direct
      fork/exec and the limits trampoline, which execs the target itself.

      Package exec — the Unix spellings of a PATH search: one candidate per
      directory, executable when any execute bit is set, variable names
      case-sensitive.

      Package exec — the Windows spellings of a PATH search: a name is tried with
      each PATHEXT extension unless it already carries one, a regular file is
      runnable by its extension, and variable names are case-insensitive ("Path"
      is the usual spelling there).

      Package exec — the peak-RSS unit: peakKiB turns a raw ru_maxrss into the KiB
      the port documents, passing a kilobyte figure through and converting darwin's
      bytes rounding up. It is platform-neutral so its arithmetic is tested on every
      GOOS.

      Package exec — peak-RSS read on a 32-bit GOARCH, where Rusage.Maxrss is int32
      and is widened to the int64 the port expects (see maxrss_rss64_unix.go for the
      64-bit counterpart).

      Package exec — peak-RSS read on a 64-bit GOARCH, where Rusage.Maxrss is
      already int64 and needs no widening cast (see maxrss_rss32_unix.go for the
      32-bit counterpart).

      Package exec — darwin's ru_maxrss unit: its getrusage(2) and wait4(2) report
      bytes, so 1024 of them make one KiB. The darwin constraint also holds for
      GOOS=ios.

      Package exec — the ru_maxrss unit of every other Unix: Linux and the BSDs
      report kilobytes, so the figure passes through; illumos and Solaris define it
      in pages and leave it 0.

      Package exec — Unix procfs writer: a tiny os.WriteFile shim used to set
      /proc/<pid>/oom_score_adj, isolated so the platform-specific path handling
      stays out of the attribute logic.

      Package exec — per-process stdio wiring. buildStdio turns a Spec's Stdio mode
      into the three *os.File the spawn passes as ProcAttr.Files, plus the
      parent-side lifecycle: the child-side ends to close once the child owns its
      dups (so EOF propagates on exit) and the copier goroutines that drain capture
      pipes into the caller's writers. StdioInherit (default) shares the parent's
      streams; StdioNull discards via the null device; StdioCapture connects pipes.

      Package exec — the re-exec trampoline that honours Spec.Rlimits and Spec.Umask
      pre-exec. The Go runtime exposes no SysProcAttr hook to run setrlimit(2)/
      umask(2) in the child between fork and exec, so when a Spec requests either,
      Start does NOT exec the target directly: it execs this very binary
      (os.Executable()) as a tiny trampoline, passing the real target + an encoded
      limits payload in a sentinel env var. The init() below detects that var,
      applies the limits in the fresh process (before main), then execve()s the real
      target — so the target starts already under its rlimits/umask, with no cgo and
      no dependency. The limits persist across the execve.

      Footgun: any binary that imports this package and is run with the sentinel env
      var set will re-exec. Start sets it only on the trampoline child and strips it
      before execve, so a normal run never has it; do not set it by hand.

      Package exec — the sandbox (Spec.Sandbox, #728), a trampoline in two stages on
      Linux amd64 and arm64. Stage one is the clone: the namespaces, the mount
      namespace unshared and made private, the user namespace's maps, and the exec of
      /proc/self/exe — never a path that may since hold another binary; without
      procfs the spawn is refused. Stage two runs in the child before main, on its one
      locked thread, from a payload sealed in a memfd (a version, a length, every
      seal): mounts, pivot_root, the Landlock paths, PR_CAPBSET_DROP, securebits,
      setgroups/setresgid/setresuid through raw calls on that thread, capset and the
      ambient set, the close-on-exec sweep, no_new_privs, landlock_restrict_self, and
      the seccomp filter — an architecture check, x32 killed on amd64 — immediately
      before execve. A step that fails reports itself on the handshake pipe and the
      target never runs. The system call numbers and the seccomp name table are per
      GOARCH (sysnum_linux_amd64.go, sysnum_linux_arm64.go); every other platform
      refuses the field before the fork.

      Spikes, not implemented: OpenBSD's pledge(2) execpromises and unveil(2), and
      Windows' restricted tokens and AppContainer. Verdict: neither maps onto the
      Linux steps — pledge restricts by promise, not by system call or path tree, and
      unveil does not survive execve; a restricted token or an AppContainer is set at
      CreateProcessAsUser, with no namespace, mount, Landlock or seccomp equivalent.
      Both stay refused with UnsupportedPlatform until a value of their own is
      designed for them.

      Package exec — central wrap helpers. Every syscall/stdlib cause is wrapped
      back onto a coreproc sentinel by restating that sentinel's exact
      Reason/Public/Private/ExitCode here once, so call sites stay terse and the
      magic exit-code literals live in a single named place.

      Package exec — darwin's word on whether this process's unreaped child has
      died: the probe zombieGroupRefused needs because darwin's kill(2) answers a
      group of zombies with EPERM.

      Package exec — the zombie probe where the kernel needs none.
    functions:
      - build: unix
        doc: |-
          Start spawns the process described by spec and returns a live coreproc.Process
          handle. ctx is honoured up to the fork/exec boundary: a ctx already cancelled
          is reported before any OS work. The child runs with an explicit (possibly
          empty) environment, the requested credentials, and — when Setpgid is set — its
          own process group so the whole tree can be group-killed.
        in:
          - name: ctx
            type: context.Context
          - name: spec
            type: coreproc.Spec
        name: Start
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - build: windows
        doc: |-
          Start spawns spec as a supervised Windows process and returns its handle. A
          cancelled context, a malformed Spec, or an unsupported Spec field short-circuit
          before any process is created.
        in:
          - name: ctx
            type: context.Context
          - name: spec
            type: coreproc.Spec
        name: Start
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - doc: |-
          Run starts spec, waits for it, and returns its exit with the head of its
          output, bounded however much the child writes: stdout and stderr are captured
          into buffers that keep the first opts.MaxOutputBytes bytes each and discard the
          rest while still reading, so the child never blocks on a full pipe and the
          supervisor never holds more than the ceiling. spec's Stdio, Stdout and Stderr
          are replaced; its Stdin is kept. When ctx ends first the child is stopped —
          SIGTERM, opts.Grace, then SIGKILL — and Run returns what it had with ctx's
          error. A MaxOutputBytes that is not positive is refused with InvalidSpec
          before anything is spawned.
        in:
          - name: ctx
            type: context.Context
          - name: spec
            type: coreproc.Spec
          - name: opts
            type: coreproc.RunValue
        name: Run
        out:
          - name: result
            type: coreproc.ResultValue
          - name: err
            type: error
      - doc: |-
          Open returns a handle on a process this one did not spawn, held through a
          kernel handle so that no later signal reaches another process that reuses the
          pid: a pidfd on Linux 5.4 and later, a process HANDLE on Windows. Its Signal and
          SignalHandle act through that handle; SignalGroup reaches the process alone,
          since a group addressed by number is not race-free; Stop signals, watches the
          handle for the exit within the grace, then kills. It implements ProcessHandle
          and ContextWaiter, and its Wait and WaitContext are refused with WaitFailed:
          only a parent collects an exit status. A pid that does not exist is
          SignalFailed wrapping ESRCH; a Linux kernel without pidfd is
          HandleUnavailable; every other platform is UnsupportedPlatform.
        in:
          - name: pid
            type: int
        name: Open
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - doc: |-
          Reclaim holds again a child this process spawned before an execve kept
          it — a supervisor's hand-over (kitsunium/sdk#738) —: a pidfd and the
          claim on its exit status (ADR 0093), so Wait reads its real status and
          reaps it, as Start's handle does, and the reaper hands it the status a
          sweep took. The child must be this process's, read from
          /proc/<pid>/stat before and after the claim: a pid gone, reaped already
          or another's is AdoptionRefused, a pid below 1 InvalidSpec. Its process
          group is its own when it leads one. Linux only; UnsupportedPlatform
          elsewhere. ctx is read before any kernel call.
        in:
          - name: ctx
            type: context.Context
          - name: pid
            type: int
        name: Reclaim
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - doc: |-
          Attach adopts a running process this one did not spawn and holds it so that
          its Wait observes the end and nothing it sends reaches another process that
          reuses the pid: through a pidfd on Linux, through two kqueue EVFILT_PROC
          knotes on darwin and the BSDs, each attached by the kernel to the process
          that had the pid when it was registered and to no later one. Wait and
          WaitContext return once the process has exited, with StatusUnknown and an
          ExitValue whose Code is -1: only a parent reads an exit status, and none is
          promised. Nothing is waited for in the kernel's sense, so a child of this
          process attached here keeps its status for its own handle or the reaper.
          On Linux Signal, SignalGroup and SignalHandle go through the pidfd. On darwin
          and the BSDs no kernel handle signals a process this one did not fork:
          Signal and SignalGroup go by pid once a knote has proven the process still
          running — the instant between that proof and kill(2) is the one a reuse
          could still slip into —, SignalHandle is UnsupportedPlatform and Handle
          reports none. Stop signals, watches for the end within the grace, then kills.
          The handle implements ProcessHandle and ContextWaiter.

          A pid below 1 is InvalidSpec; PID 1 and this process are AdoptionRefused; a
          pid that does not exist is SignalFailed wrapping ESRCH; a kernel without
          pidfd_open, or a kqueue refused, is HandleUnavailable; illumos, Solaris and
          Windows are UnsupportedPlatform. ctx is read before any kernel call.
        in:
          - name: ctx
            type: context.Context
          - name: pid
            type: int
        name: Attach
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - doc: |-
          AttachPIDFile reads the PID file at path and adopts the process it names, as
          Attach does. path is absolute and walked one component at a time from the
          root; the file at its end is opened without following a symbolic link,
          without blocking, and must be a regular file holding one decimal PID,
          surrounding blanks allowed. Anything else is PIDFileRefused.

          The file is trustworthy when nobody but root and this process's user could
          have made what the walk went through: every directory and the file belong to
          one of them, no directory is writable by its group or others unless sticky,
          the file by neither, and a symbolic link on the way lies in such a directory
          and belongs to one of them. The process a trustworthy file names is adopted;
          from any other file it must satisfy want, and a want that bounds nothing is
          AdoptionRefused. A bound want gives is checked whatever the file, and the
          check is proven to concern the process held, not a later one with its pid.

          Off Linux there is no cgroup, so a Cgroup bound is AdoptionRefused; the
          users are read from the kernel's process record (sysctl kinfo_proc), whose
          start time must be the same before and after the knotes are registered.
          Each directory of the walk is held open for reading there, where Linux needs
          only the permission to search it.
        in:
          - name: ctx
            type: context.Context
          - name: path
            type: string
          - name: want
            type: coreproc.AttachValue
        name: AttachPIDFile
        out:
          - name: proc
            type: coreproc.Process
          - name: err
            type: error
      - doc: |-
          EnvAllow returns the entries of parent whose key is one of keys, in parent's
          order: the environment to hand a child that must see those variables and no
          other. A key that appears more than once keeps its last value, at the place of
          its last occurrence — the value a getenv would read. Keys compare
          case-insensitively on Windows and exactly elsewhere. parent is not modified.
        in:
          - name: parent
            type: "[]string"
          - name: keys
            type: string
        name: EnvAllow
        out:
          - type: "[]string"
        variadic: true
      - doc: |-
          EnvDeny returns the entries of parent whose key is none of keys, in parent's
          order, a repeated key keeping its last value at the place of its last
          occurrence. Keys compare as in EnvAllow. parent is not modified.
        in:
          - name: parent
            type: "[]string"
          - name: keys
            type: string
        name: EnvDeny
        out:
          - type: "[]string"
        variadic: true
      - doc: |-
          LandlockABI returns the Landlock ABI version the running kernel implements:
          1 on Linux 5.13, 2 on 5.19, 3 on 6.2, 4 on 6.7, 5 on 6.10, 6 on 6.12. A
          LandlockValue's rights newer than it are refused with SandboxUnavailable
          unless named best-effort. A kernel without Landlock, or with Landlock
          disabled at boot, is SandboxUnavailable; every platform but Linux on amd64
          and arm64 is UnsupportedPlatform.
        name: LandlockABI
        out:
          - name: abi
            type: int
          - name: err
            type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/exec
  - constants:
      - doc: |-
          SelfCgroupFile names the per-process cgroup membership file. Each line maps
          a hierarchy to the path this process belongs to, relative to that
          hierarchy's mount root.
        name: SelfCgroupFile
        type: string
        value: '"/proc/self/cgroup"'
      - doc: |-
          SelfMountinfoFile lists this process's mounts, including where each cgroup
          hierarchy is actually attached.
        name: SelfMountinfoFile
        type: string
        value: '"/proc/self/mountinfo"'
    doc: |-
      Package cgroupfs reads where this process sits in the control-group
      filesystem: where each hierarchy is mounted and which part of it a mount
      exposes (/proc/self/mountinfo, octal escapes decoded), which cgroup the
      process belongs to (/proc/self/cgroup), the translation between the two,
      and the directory of its own unified cgroup.

      It was memlimit's until #1097 and #938 needed the same reading: cgroup's
      Probe names the caller's own group, and self's identity its container. One
      reading is not worth an edge from one engine to another, so it sits under
      internal/, where Go's rule confines it to the proc family, as rlim does.
      Every function takes the file reader, so a test drives each shape without a
      cgroup filesystem.
    functions:
      - doc: |-
          Membership extracts this process's path in the unified hierarchy and in the
          v1 memory controller from /proc/self/cgroup's content. Either is empty when
          the hierarchy is not listed.
        in:
          - name: content
            type: string
        name: Membership
        out:
          - name: v2Path
            type: string
          - name: v1Path
            type: string
      - doc: |-
          UnderMountRoot re-expresses a /proc/self/cgroup membership path relative to
          the part of the cgroup filesystem a mount exposes (mountinfo field 4),
          reporting false when the mount does not expose this process's cgroup.
        in:
          - name: mountRoot
            type: string
          - name: cgroupPath
            type: string
        name: UnderMountRoot
        out:
          - name: relative
            type: string
          - name: ok
            type: bool
      - doc: |-
          Mounts returns every attachment of the unified hierarchy and of the v1
          memory controller, with what each exposes, falling back to the
          conventional /sys/fs/cgroup and /sys/fs/cgroup/memory when mountinfo is
          unreadable or lists neither.
        in:
          - name: readFile
            type: func(string) ([]byte, error)
        name: Mounts
        out:
          - name: v2
            type: "[]MountValue"
          - name: v1
            type: "[]MountValue"
      - doc: |-
          OwnGroup returns the directory of the unified-hierarchy cgroup this process
          belongs to: the "0::" path of /proc/self/cgroup, re-expressed under the
          first cgroup2 mount that exposes it. It reports false on a host with no
          unified membership — not Linux, a v1-only host — or with no mount reaching
          it.
        in:
          - name: readFile
            type: func(string) ([]byte, error)
        name: OwnGroup
        out:
          - name: dir
            type: string
          - name: ok
            type: bool
    path: github.com/kitsunium/sdk/internal/service/proc/internal/cgroupfs
    types:
      - doc: |-
          MountValue is one attached cgroup hierarchy: where it is mounted, and which
          part of the cgroup filesystem that mount exposes. A whole-hierarchy mount
          exposes "/"; a bind mount of a subtree exposes that subtree, and a
          membership path has to be re-expressed relative to it (UnderMountRoot).
        name: MountValue
        struct:
          fields:
            - doc: Point is the directory the hierarchy is attached to.
              name: Point
              type: string
            - doc: Root is the path WITHIN the cgroup filesystem this mount exposes.
              name: Root
              type: string
  - doc: |-
      Package rlim builds the kernel's resource-limit struct from a soft/hard pair:
      the one place the proc family turns a coreproc.LimitValue into the
      syscall.Rlimit that setrlimit(2) and prlimit64(2) read. exec's trampoline
      applies a limit in the child before exec, rlimit applies one to a running
      process, and both carried a copy of the constructor.

      It exists because the struct is not one type across the Unix kernels:
      FreeBSD and DragonFly declare Rlimit.Cur and Max as int64 (their rlim_t is
      __int64_t), every other Unix as uint64, which is coreproc.LimitValue's own
      width. Make is split by build tag so no caller ever names the field type,
      and LimitInfinity (^uint64(0)) lands as RLIM_INFINITY on both: verbatim where
      the fields are uint64, as int64(-1) where they are int64.

      Off Unix there is no rlimit struct, and the package holds nothing.

      Package rlim — the uint64 syscall.Rlimit constructor. On every Unix target
      except FreeBSD and DragonFly the kernel types Rlimit.Cur/Max as uint64,
      matching coreproc.LimitValue exactly.

      Package rlim — the int64 syscall.Rlimit constructor. FreeBSD and DragonFly
      type Rlimit.Cur/Max as int64 (their rlim_t is __int64_t), unlike every other
      Unix target.
    functions:
      - build: unix && !freebsd && !dragonfly
        doc: |-
          Make builds a syscall.Rlimit from a uint64 soft/hard pair. On these targets
          Cur/Max are uint64, so the pair maps verbatim and LimitInfinity
          (^uint64(0)) lands as the kernel's RLIM_INFINITY.
        in:
          - name: soft
          - name: hard
            type: uint64
        name: Make
        out:
          - type: syscall.Rlimit
      - build: freebsd || dragonfly
        doc: |-
          Make builds a syscall.Rlimit from a uint64 soft/hard pair. On FreeBSD and
          DragonFly Cur/Max are int64, so the pair is converted; the conversion is
          value-preserving for real limits, and LimitInfinity (^uint64(0)) wraps to
          int64(-1) = RLIM_INFINITY, the kernel's "no limit" sentinel.
        in:
          - name: soft
          - name: hard
            type: uint64
        name: Make
        out:
          - type: syscall.Rlimit
      - build: unix && !freebsd && !dragonfly
        doc: |-
          Pair reads a syscall.Rlimit back as the soft/hard pair Make built it from:
          verbatim on these targets.
        in:
          - name: limit
            type: syscall.Rlimit
        name: Pair
        out:
          - name: soft
            type: uint64
          - name: hard
            type: uint64
      - build: freebsd || dragonfly
        doc: |-
          Pair reads a syscall.Rlimit back as the soft/hard pair Make built it from:
          RLIM_INFINITY's int64(-1) wraps back to LimitInfinity (^uint64(0)).
        in:
          - name: limit
            type: syscall.Rlimit
        name: Pair
        out:
          - name: soft
            type: uint64
          - name: hard
            type: uint64
    path: github.com/kitsunium/sdk/internal/service/proc/internal/rlim
  - doc: |-
      Package bsdabi decodes, from their bytes, the records the BSD kernels and
      darwin hand the proc family: a process's kinfo_proc (kinfo_proc2 on NetBSD),
      read by sysctl(3) for its start time and its users, and the sockcred2
      FreeBSD attaches to a datagram for its sender.

      Every structure is laid out as its header declares it, for the
      architecture's ABI, and a record is decoded only once it proves to be the
      one asked for — its size, the size it states where it states one, the pid
      it names —, never guessed at. The package holds no system call and no
      build constraint: the caller passes runtime.GOOS and runtime.GOARCH, and
      the tests read every layout on any machine, from records built member by
      member after the headers. It sits under internal/, where Go's rule confines
      it to the proc family, as rlim and cgroupfs do.
    functions:
      - doc: |-
          ProcRecord decodes the record ProcRequest asked for: the process's start
          time, in microseconds since the epoch as its kernel states it, and its real
          and effective users. ok is false when buf is not that record as the layout
          of goos and goarch lays it out — shorter than it, of another size than the
          record states, or naming another process than pid.
        in:
          - name: goos
          - name: goarch
            type: string
          - name: pid
            type: int
          - name: buf
            type: "[]byte"
        name: ProcRecord
        out:
          - name: start
            type: int64
          - name: ruid
          - name: euid
            type: int
          - name: ok
            type: bool
      - doc: |-
          ProcRequest returns the sysctl(3) name that asks the kernel of goos for the
          record of process pid — kern.proc.pid's struct kinfo_proc on FreeBSD,
          DragonFly and darwin, KERN_PROC's on OpenBSD and KERN_PROC2's struct
          kinfo_proc2 on NetBSD, each of those two asked for the prefix ProcRecord
          reads — and the size of the buffer it fills. ok is false for a pid outside
          pid_t's range and for a goos and goarch whose layout this package does not
          hold.
        in:
          - name: goos
          - name: goarch
            type: string
          - name: pid
            type: int
        name: ProcRequest
        out:
          - name: mib
            type: "[]int32"
          - name: size
            type: int
          - name: ok
            type: bool
      - doc: |-
          Sockcred2 decodes the data of the SCM_CREDS2 control message FreeBSD's
          LOCAL_CREDS_PERSISTENT attaches to every datagram (struct sockcred2,
          sys/socket.h): the sender's PID and its real user and group, as the kernel
          wrote them. ok is false for data shorter than the structure and the groups
          it counts, a group count past CMGROUP_MAX, a version other than 0, or a PID
          below 1.
        in:
          - name: data
            type: "[]byte"
        name: Sockcred2
        out:
          - name: pid
          - name: uid
          - name: gid
            type: int
          - name: ok
            type: bool
    path: github.com/kitsunium/sdk/internal/service/proc/internal/bsdabi
  - doc: |-
      Package memlimit — resolving WHICH cgroup limit files govern this process:
      where each hierarchy is mounted, which part of the filesystem that mount
      exposes, which cgroup the process belongs to, and the ancestors whose caps
      bound it just as effectively.

      Package memlimit derives the Go runtime soft memory limit from the control
      group allowance governing this process.

      GOMAXPROCS has been cgroup-aware since Go 1.25, but the memory limit never
      was: a process in a 512 MiB container happily grows its heap past the cap and
      is SIGKILLed by the kernel instead of being pushed into a more aggressive GC
      cycle. Any workload whose peak working set approaches its container's cap hits
      exactly that failure mode.

      The limit set here is SOFT and covers all memory mapped, managed and not
      released by the Go runtime — the heap, but also goroutine stacks and runtime
      metadata. It excludes memory the runtime does not manage: the binary's own
      image, C allocations, syscall.Mmap mappings, and kernel memory held on the
      process's behalf. Subprocesses are outside it entirely.

      The allowance is the tightest cap on the way up. On cgroup v2 every
      memory.max is read with the memory.high beside it, at the process's own cgroup
      and at each ancestor, and the minimum across both files binds: the kernel
      reclaims and slows a group above memory.high long before memory.max kills it,
      so the throttle is the working cap, and the result's Bound says which file
      set it. cgroup v1 has no such file — memory.soft_limit_in_bytes is a reclaim
      hint — and memory.limit_in_bytes alone binds there.

      So this reduces OOM pressure rather than eliminating it. It is also the one
      direction the cgroup sibling does not cover: cgroup WRITES a control group to
      bound a child, memlimit READS the one already bounding this process.
    functions:
      - doc: |-
          Apply derives the Go soft memory limit from the cgroup allowance and installs
          it, reporting what it read, what it derived, and what decided the outcome.

          The allowance is the tightest cap governing this process: resolved from
          /proc/self/cgroup so a child cgroup is honoured, then minimised across its
          ancestors and across both hierarchies on a hybrid host. On cgroup v2 it is
          minimised across memory.high as well as memory.max: the kernel throttles a
          group above memory.high long before memory.max kills it, so the throttle is
          the working cap. The result's Bound names which of the two set it.

          It leaves the runtime default untouched — and says which of the three reasons
          applied — when the operator set GOMEMLIMIT to a non-empty value, when no
          cgroup file is readable (any non-Linux host) or none declares a cap, or when
          the derived limit is implausibly small.
        name: Apply
        out:
          - type: coreproc.MemoryLimitValue
      - doc: |-
          ApplyWith is Apply with the caller's knobs: the share of the allowance handed
          to the runtime, the floor under which a derived limit is declined, and the
          GC percent installed with the limit. Its zero value is Apply.

          It returns MemlimitMisconfigured, and installs nothing, for a headroom
          outside (0, 100] percent or a negative floor (ADR 0031).
        in:
          - name: cfg
            type: ConfigValue
        name: ApplyWith
        out:
          - type: coreproc.MemoryLimitValue
          - type: error
      - doc: |-
          Derive is what Apply would install, read and derived the same way, and
          installs nothing: a caller that sizes memory outside the Go heap — a
          network loop's slab (#809) — reads the allowance without touching the
          runtime's limit.
        name: Derive
        out:
          - type: coreproc.MemoryLimitValue
      - doc: |-
          Watch applies the limit as ApplyWith does, reports it to onChange, then
          re-derives it every period on clk until ctx ends — and installs and reports
          again only when the derivation changed: an orchestrator's resize, a
          systemctl set-property MemoryMax=, a vertical autoscaler. A re-read on a
          clock is the only honest mechanism: the kernel reports no write to a
          cgroupfs limit file through inotify, and memory.max raises no event.

          A period under one second is clamped to one second (ADR 0031). When the cap
          is lifted, or falls below the floor, the runtime's default — no limit, and
          the GC percent that was in force — is put back rather than a limit no cap
          stands behind kept. An operator's GOMEMLIMIT is never touched. onChange may
          be nil; it runs on Watch's goroutine and must not block.

          It blocks until ctx ends and then returns nil; it returns
          MemlimitMisconfigured at once, and installs nothing, for a configuration
          ApplyWith refuses.
        in:
          - name: ctx
            type: context.Context
          - name: clk
            type: clock.Timed
          - name: every
            type: time.Duration
          - name: cfg
            type: ConfigValue
          - name: onChange
            type: func(coreproc.MemoryLimitValue)
        name: Watch
        out:
          - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/memlimit
    types:
      - doc: |-
          ConfigValue tunes a soft-memory-limit derivation. Its zero value is Apply's:
          90 percent of the allowance, a 64 MiB floor, the GC percent untouched.
        name: ConfigValue
        struct:
          fields:
            - doc: |-
                HeadroomPercent is the share of the allowance handed to the runtime, in
                (0, 100]; zero means 90. The rest covers what counts against the cgroup
                outside the runtime — the binary, mapped files, C allocations — so a
                cgo- or mmap-heavy service lowers it.
              name: HeadroomPercent
              type: int
            - doc: |-
                MinimumLimit is the floor in bytes under which a derived limit is
                declined (MemorySourceBelowFloor); zero means 64 MiB.
              name: MinimumLimit
              type: int64
            - doc: |-
                GCPercent, when not nil, is installed with debug.SetGCPercent at the
                moment a limit is — -1 runs the collector on the limit alone — and the
                previous percent is put back when Watch withdraws the limit. Nil leaves
                GOGC as it is.
              name: GCPercent
              type: "*int"
  - doc: |-
      Package reaper — the PID1 / subreaper zombie collector backing pkg/v1/proc/reaper.

      New returns a coreproc.Reaper whose concrete behaviour is selected at build
      time: a real SIGCHLD-driven waitpid loop on Unix (reaper_unix.go) and a
      degrade-to-no-op stub elsewhere (reaper_other.go). SetChildSubreaper and
      IsPID1 are likewise platform-split. This file holds only the cross-platform
      Option surface so the option type is declared once.

      Package reaper — non-Unix no-op reaper: degrades cleanly where SIGCHLD and
      PR_SET_CHILD_SUBREAPER do not exist (e.g. Windows).

      Package reaper — Unix SIGCHLD waitpid reaping loop (all Unix). The
      PR_SET_CHILD_SUBREAPER arming lives in the Linux-only sibling.

      Package reaper — FreeBSD / DragonFly BSD descendant-reaper arming via
      procctl(2). procctl(P_PID, 0, PROC_REAP_ACQUIRE, NULL) makes the calling
      process the reaper for its whole descendant tree, the BSD analogue of Linux's
      prctl(PR_SET_CHILD_SUBREAPER): orphaned descendants reparent to this process
      instead of PID1, so a non-init supervisor still receives their SIGCHLD.

      Package reaper — DragonFly BSD procctl(2) ABI constants for SetChildSubreaper.

      Package reaper — FreeBSD procctl(2) ABI constants for SetChildSubreaper.

      Package reaper — Linux PR_SET_CHILD_SUBREAPER arming via prctl(2).

      Package reaper — non-Linux Unix subreaper stub for platforms with no
      reparent-here facility (darwin/openbsd/netbsd/solaris): neither Linux's
      prctl(PR_SET_CHILD_SUBREAPER) nor BSD's procctl(PROC_REAP_ACQUIRE) exists, so
      arming degrades to a typed error. FreeBSD and DragonFly are handled by the
      real procctl(2) sibling (subreaper_bsd.go).

      Package reaper — the timer sweep illumos and Solaris need beside SIGCHLD (the
      solaris build tag selects both).

      Package reaper — no timer sweep where every child's exit posts SIGCHLD.
    functions:
      - doc: |-
          WithOnReap registers fn as a post-sweep callback receiving the count of
          children reaped in each sweep. It is purely observational; fn must not block.
          On illumos and Solaris the loop also sweeps once a second (their exits post
          no SIGCHLD), so there fn hears zero once a second from an idle reaper.
        in:
          - name: fn
            type: func(int)
        name: WithOnReap
        out:
          - type: Option
      - doc: |-
          WithOnExit registers fn as an observer of every child a sweep collects:
          its pid, its exit in the words a Process's Wait uses, and whether a Process
          owned it. It is the one record of an orphan's end a subreaper or PID 1 can
          give — the status is told once, synchronously, and stored nowhere (ADR
          0093). fn runs under the sweep lock, after the owner's status is handed
          over: it must not block. Off Unix, where nothing is collected, it is
          retained and never called.
        in:
          - name: fn
            type: func(ExitEvent)
        name: WithOnExit
        out:
          - type: Option
      - build: "!unix"
        doc: |-
          New returns a no-op reaper on platforms without SIGCHLD/waitpid semantics. The
          WithOnReap observer is still retained so its cross-platform contract holds;
          only the actual reaping degrades to a zero-child sweep here.
        in:
          - name: opts
            type: Option
        name: New
        out:
          - type: coreproc.Reaper
        variadic: true
      - build: "!unix"
        doc: |-
          SetChildSubreaper reports UnsupportedPlatform on non-Unix platforms, which
          have no prctl(PR_SET_CHILD_SUBREAPER) equivalent.
        name: SetChildSubreaper
        out:
          - type: error
      - build: "!unix"
        doc: |-
          IsPID1 reports false on non-Unix platforms, where the pid-1-is-init convention
          does not apply.
        name: IsPID1
        out:
          - type: bool
      - build: unix
        doc: |-
          New returns a Unix reaper configured by opts. The reaper is created idle; call
          Start to begin background reaping. It does not arm subreaper mode — call
          SetChildSubreaper separately when the supervisor is not PID1.
        in:
          - name: opts
            type: Option
        name: New
        out:
          - type: coreproc.Reaper
        variadic: true
      - build: unix
        doc: |-
          IsPID1 reports whether the current process is the init process (pid 1), the
          canonical signal that this process is the system's ultimate reaper.
        name: IsPID1
        out:
          - type: bool
      - build: freebsd || dragonfly
        doc: |-
          SetChildSubreaper marks the calling process as the reaper for its descendant
          tree via procctl(P_PID, 0, PROC_REAP_ACQUIRE, NULL) so orphaned descendants
          reparent here rather than to PID1. It returns SubreaperFailed (wrapping the
          errno) on failure. It is the FreeBSD / DragonFly analogue of the Linux
          prctl(PR_SET_CHILD_SUBREAPER) path; platforms with neither facility report
          UnsupportedPlatform.
        name: SetChildSubreaper
        out:
          - type: error
      - build: linux
        doc: |-
          SetChildSubreaper marks the calling process as a child subreaper via
          prctl(PR_SET_CHILD_SUBREAPER, 1) so orphaned descendants reparent here rather
          than to PID1. It returns SubreaperFailed (wrapping the errno) on failure. It
          is Linux-only; other Unix platforms have no equivalent and report
          UnsupportedPlatform.
        name: SetChildSubreaper
        out:
          - type: error
      - build: unix && !linux && !freebsd && !dragonfly
        doc: |-
          SetChildSubreaper reports UnsupportedPlatform on non-Linux Unix systems
          (darwin/bsd), which have no prctl(PR_SET_CHILD_SUBREAPER) equivalent. The
          SIGCHLD reaping loop still works there; only the subreaper attribute is
          unavailable, so orphans reparent to PID1 rather than to this process.
        name: SetChildSubreaper
        out:
          - type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/reaper
    types:
      - doc: |-
          Option configures a reaper returned by New. Options are applied in order; an
          unknown or zero option is a no-op. The set is intentionally small — a reaper
          has little to tune beyond an optional sweep callback for observability.
        name: Option
        underlying: func(*config)
      - doc: |-
          ExitEvent is one child a sweep collected: an orphan re-parented to this
          process, or a child a Process spawned and owns.
        name: ExitEvent
        struct:
          fields:
            - doc: PID is the collected child's process id.
              name: PID
              type: int
            - doc: |-
                Exit is how the child ended, in the words Process.Wait uses: the exit
                code, or -1 and the terminating signal, and its rusage.
              name: Exit
              type: coreproc.ExitValue
            - doc: |-
                Owned reports that a Process spawned the child and has been handed the
                same status; false is an orphan, whose status ends here.
              name: Owned
              type: bool
  - doc: |-
      Package rlimit — applies per-process setrlimit(2) resource ceilings.

      This file holds the platform-neutral surface: the exported Apply and
      PrepareSysProcAttr entry points delegate to the build-tagged applyLimits /
      prepareLimits implementations (rlimit_linux.go on Linux, rlimit_other.go
      everywhere else). Core declares the Resource enum and LimitValue pair; this
      package maps each Resource to the platform RLIMIT_* constant and issues the
      syscall, wrapping failures in the central proc sentinels.

      Package rlimit — Linux setrlimit/prlimit64 implementation.

      Package rlimit — non-Unix stub returning UnsupportedPlatform. setrlimit(2) is
      a Unix mechanic (Linux via rlimit_linux.go, Darwin and the BSDs via
      rlimit_unix.go); the remaining targets (Windows, plan9, js/wasm) have no
      equivalent, so every entry point degrades to the typed sentinel.

      Package rlimit — RLIMIT_AS mapping for the non-Linux Unix targets whose stdlib
      syscall exports it (Darwin, FreeBSD, NetBSD, DragonFly). OpenBSD has no
      address-space rlimit — RLIMIT_AS is absent from its kernel ABI — so it supplies
      the no-op in rlimit_table_openbsd.go instead, leaving ResourceAS unmapped
      (UnknownResource) rather than failing to compile on the missing constant.

      Package rlimit — OpenBSD adds no resources beyond the common Unix set:
      RLIMIT_AS is absent from its kernel ABI, so ResourceAS stays unmapped and a
      request for it surfaces the typed UnknownResource — the honest "this platform
      cannot set that limit" answer — rather than a build failure on the missing
      constant.

      Package rlimit — non-Linux Unix setrlimit(2) implementation. Darwin and the
      BSDs expose setrlimit(2) for the calling process exactly as Linux does, so a
      Spec's resource ceilings are honoured natively (applied post-fork on self by
      the exec trampoline). The Linux-only prlimit64(2) path for a FOREIGN pid has
      no portable equivalent here, so an Apply targeting another process degrades to
      the typed UnsupportedPlatform sentinel rather than silently limiting the
      caller. The Resource→RLIMIT_* table maps only the constants stdlib syscall
      exports on every target; RLIMIT_NPROC/RLIMIT_MEMLOCK live in golang.org/x/sys
      (banned), and RLIMIT_AS is absent on OpenBSD — both surface UnknownResource
      via the build-tagged table rather than a wrong limit or a build break.
    functions:
      - doc: |-
          Apply sets the soft/hard ceilings in limits on the process identified by pid.
          A pid of 0 (or the caller's own pid) targets the calling process via
          setrlimit(2); any other pid targets that process via prlimit64(2), which
          needs CAP_SYS_RESOURCE. An unmapped Resource yields UnknownResource and a
          failing syscall yields RlimitFailed; off Linux every call yields
          UnsupportedPlatform.
        in:
          - name: pid
            type: int
          - name: limits
            type: map[coreproc.Resource]coreproc.LimitValue
        name: Apply
        out:
          - type: error
      - doc: |-
          PrepareSysProcAttr validates limits and reports whether they can be applied,
          returning the same typed errors Apply would. It performs no syscall and
          mutates nothing: Go's os/exec SysProcAttr carries no rlimit field, so the
          caller applies limits post-fork from the child (see Apply with pid 0) rather
          than declaratively through SysProcAttr. Use it to fail fast — at Spec
          construction time — on a Resource this platform cannot honour, before a
          process is ever spawned.
        in:
          - name: limits
            type: map[coreproc.Resource]coreproc.LimitValue
        name: PrepareSysProcAttr
        out:
          - type: error
      - doc: |-
          KeepRaisedNoFile makes every child this process spawns from now on inherit
          its raised open-file soft limit. The Go runtime raises its own soft
          RLIMIT_NOFILE to the hard limit at start and, by design, puts the original soft
          limit back in every child it forks — 1024 on a stock Linux, 256 on macOS —
          until the program sets RLIMIT_NOFILE itself. KeepRaisedNoFile sets it to the
          value in force, which ends that restore without a trampoline, and returns that
          value. It acts once per process; a later call returns the first call's
          outcome. A failing getrlimit or setrlimit is RlimitFailed; off Unix it is
          UnsupportedPlatform.
        name: KeepRaisedNoFile
        out:
          - name: kept
            type: coreproc.LimitValue
          - name: err
            type: error
      - doc: |-
          Get reads the soft/hard ceiling of resource r for pid, 0 being the caller:
          getrlimit(2) for the caller, prlimit64(2) with no new value for another
          pid on Linux, and UnsupportedPlatform for another pid elsewhere — Apply's
          rule — and off Unix. An unmapped resource is UnknownResource; a refused
          read RlimitFailed wrapping the errno.
        in:
          - name: pid
            type: int
          - name: r
            type: coreproc.Resource
        name: Get
        out:
          - type: coreproc.LimitValue
          - type: error
      - doc: |-
          OpenFiles counts the caller's open descriptors, to alert against Get's
          RLIMIT_NOFILE: /proc/self/fd on Linux, illumos and Solaris, /dev/fd on
          darwin, sysctl kern.proc.nfds on FreeBSD (13 and later), and on Windows the
          process's HANDLE count — files, but also events, threads and keys. OpenBSD,
          NetBSD and DragonFly answer UnsupportedPlatform: their /dev/fd nodes are
          static.
        name: OpenFiles
        out:
          - type: int
          - type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/rlimit
  - constants:
      - doc: |-
          StartSourceInit is the package's initialisation: within it, not the kernel's
          word.
        name: StartSourceInit
        type: StartSource
        value: "1"
      - doc: StartSourceKernel is the kernel's record of when it started the process.
        name: StartSourceKernel
        type: StartSource
        value: "2"
    doc: |-
      Package self is what the running process is doing right now: the Go
      runtime's own metrics and the kernel's account of the CPU time used.

      The rest of the proc domain acts on OTHER processes — it spawns, signals,
      reaps and limits children. This package only reads, and only the process it
      runs in. What the binary was built from is internal/service/proc/buildinfo's,
      a package of its own so that reading a build never imports runtime/metrics
      (ADR 0172). Nothing here can fail in a way a caller could act on, so nothing
      returns an error: an absent answer is a zero field or a false, and the doc
      comment of each field says which.

      Package self — the CPU time the process used, where the kernel's count is
      not at hand.

      Package self — the CPU time the process used, as the kernel counts it.

      Package self — the running process's runtime state, read from the Go
      runtime's own metrics and the kernel's CPU accounting.
    functions:
      - doc: |-
          ReadStats takes a snapshot of the running process. It reads the runtime's
          metrics once, the last collection's time once and the kernel's CPU
          accounting once, and never fails: a figure the platform cannot give is
          zero, and CPUEstimated says when CPUTime is an estimate.
        name: ReadStats
        out:
          - type: StatsValue
      - doc: |-
          SetOOMScoreAdj sets the running process's own OOM-killer bias, writing n to
          /proc/self/oom_score_adj (-1000 to 1000): a supervisor that must outlive its
          children lowers it, which needs CAP_SYS_RESOURCE, below the value it started
          with. It is the one writer of this package. A value the kernel refuses is
          RlimitFailed; off Linux it is UnsupportedPlatform.
        in:
          - name: "n"
            type: int
        name: SetOOMScoreAdj
        out:
          - type: error
      - doc: |-
          ReadIdentity reads what the kernel says the running process is — facts the
          runtime cannot give: when the kernel started it (restart detection, a
          pid-reuse-safe identity), the SHA-256 and Go build id of the binary really
          running (self-verification before a signed self-update replaces it), the
          container and pid namespace it runs in, and the boot. Like ReadStats it
          never fails: a fact the platform does not give is zero, and the flags say
          which. Hashing the binary reads it whole: call it once, not per request.
        name: ReadIdentity
        out:
          - type: IdentityValue
    path: github.com/kitsunium/sdk/internal/service/proc/self
    types:
      - doc: |-
          IdentityValue is what the kernel says the running process is. Every field is
          a zero where the platform does not give it, never an error (ADR 0100).
        name: IdentityValue
        struct:
          fields:
            - doc: |-
                StartedAt is when the process started: the kernel's record on Linux
                (/proc/self/stat's start tick after /proc/stat's boot time) and Windows
                (GetProcessTimes), the package's initialisation elsewhere —
                StartedAtSource says which.
              name: StartedAt
              type: time.Time
            - doc: Executable is the path of the running binary, as os.Executable reads it.
              name: Executable
              type: string
            - doc: |-
                BuildID is the Go build id of the running binary — its ELF
                .note.go.buildid, or the raw mark the linker writes at the start of the
                text of every format — what `go tool buildid` prints; empty when absent.
              name: BuildID
              type: string
            - doc: |-
                ContainerID is the 64-hex id of the container the process runs in, read
                from its cgroup path in the docker, cri-containerd, crio, libpod and
                kubepods shapes; empty outside one.
              name: ContainerID
              type: string
            - doc: BootID is the kernel's id of the current boot (Linux); empty elsewhere.
              name: BootID
              type: string
            - doc: |-
                PIDNamespace is the inode of /proc/self/ns/pid, the pid namespace's id
                (Linux); zero elsewhere.
              name: PIDNamespace
              type: uint64
            - doc: Digest is the SHA-256 of the running binary's file, valid when DigestOK.
              name: Digest
              type: "[32]byte"
            - doc: StartedAtSource says where StartedAt came from.
              name: StartedAtSource
              type: StartSource
            - doc: DigestOK reports that the binary could be read whole and Digest holds its hash.
              name: DigestOK
              type: bool
            - doc: |-
                NSPid1 reports that the process is pid 1 of its pid namespace (the last
                NSpid entry of /proc/self/status) — the init of a container.
              name: NSPid1
              type: bool
      - doc: |-
          StartSource names where IdentityValue.StartedAt came from. The zero is
          unminted.
        methods:
          - doc: String renders the source for a log line, "unknown" for a value never minted.
            name: String
            out:
              - type: string
            recv: value
        name: StartSource
        underlying: uint8
      - doc: |-
          StatsValue is the running process at one instant, as the Go runtime and
          the kernel account for it.

          Every count is cumulative since the process started, and the two
          distributions are too: a p99 read here is over the process's whole life,
          not over the last minute. A caller wanting a window subtracts two
          snapshots.

          It is the engine's own value (ADR 0074): no port in the proc domain speaks
          it.
        name: StatsValue
        struct:
          fields:
            - doc: |-
                At is when the snapshot was taken, on the wall clock: this describes
                the machine, whatever clock the program's own logic runs on.
              name: At
              type: time.Time
            - doc: Started is when the process started, to within its initialisation.
              name: Started
              type: time.Time
            - doc: |-
                LastGC is when the most recent garbage collection ended; zero before
                the first one.
              name: LastGC
              type: time.Time
            - doc: |-
                GCPauses is the distribution of stop-the-world pauses caused by the
                garbage collector.
              name: GCPauses
              type: DistributionValue
            - doc: |-
                SchedLatencies is the distribution of the time goroutines spent ready
                to run before they ran — the queueing a saturated scheduler adds.
              name: SchedLatencies
              type: DistributionValue
            - doc: PID is the process identifier.
              name: PID
              type: int
            - doc: "MaxProcs is GOMAXPROCS: how many threads may run Go code at once."
              name: MaxProcs
              type: int
            - doc: CPUs is how many logical CPUs the process can use.
              name: CPUs
              type: int
            - doc: Goroutines is how many goroutines exist.
              name: Goroutines
              type: int
            - doc: |-
                HeapBytes is the memory occupied by live and not-yet-swept heap
                objects.
              name: HeapBytes
              type: uint64
            - doc: HeapObjects is how many objects occupy HeapBytes.
              name: HeapObjects
              type: uint64
            - doc: HeapGoalBytes is the heap size at which the next collection starts.
              name: HeapGoalBytes
              type: uint64
            - doc: |-
                MemoryBytes is all the memory the Go runtime has mapped from the
                system: the heap, the stacks, the runtime's own structures. It is the
                runtime's number, not the kernel's resident set.
              name: MemoryBytes
              type: uint64
            - doc: TotalAllocBytes is every byte ever allocated on the heap.
              name: TotalAllocBytes
              type: uint64
            - doc: GCCycles is how many collections have completed.
              name: GCCycles
              type: uint64
            - doc: CPUTime is the CPU time the process has consumed, user and system.
              name: CPUTime
              type: time.Duration
            - doc: Uptime is At minus Started.
              name: Uptime
              type: time.Duration
            - doc: |-
                CPUEstimated reports that CPUTime is the Go runtime's estimate rather
                than the kernel's count: the runtime's total CPU capacity minus its
                idle time, which counts only threads running Go code and so misses time
                spent in C code or blocked in the kernel — and which the runtime
                refreshes only at a garbage collection, so it lags by up to one GC
                cycle and reads zero before the first. It is true where the kernel's
                count is not at hand — Plan 9, wasm: neither getrusage(2) nor
                GetProcessTimes exists there — and wherever that call failed.
              name: CPUEstimated
              type: bool
            - doc: |-
                RSSBytes is the kernel's resident set — what the OOM killer and the
                cgroup count, where MemoryBytes is the runtime's mapping: /proc/self/statm
                on Linux, the working set on Windows, zero elsewhere (KernelMemory).
              name: RSSBytes
              type: uint64
            - doc: |-
                PeakRSSBytes is the most resident memory the process has held: VmHWM on
                Linux, getrusage(2)'s ru_maxrss on the other Unixes, the peak working set
                on Windows; zero on illumos and Solaris, whose kernel leaves it so.
              name: PeakRSSBytes
              type: uint64
            - doc: Threads is how many kernel threads the process runs (Linux); zero elsewhere.
              name: Threads
              type: int
            - doc: |-
                OpenFiles is how many descriptors the process holds open (Linux), or its
                HANDLE count (Windows); zero elsewhere — rlimit.OpenFiles counts on more
                platforms.
              name: OpenFiles
              type: int
            - doc: |-
                KernelMemory reports that RSSBytes is the kernel's count (Linux,
                Windows); false where the platform gives the SDK no current resident set.
              name: KernelMemory
              type: bool
      - doc: |-
          DistributionValue is one of the Go runtime's cumulative histograms, read
          as durations. Its buckets are the runtime's own — the shape of
          runtime/metrics.Float64Histogram — and it is a value: reading it never
          touches the runtime again.
        methods:
          - doc: Count returns how many observations the distribution holds.
            name: Count
            out:
              - type: uint64
            recv: value
          - doc: |-
              Quantile returns the q-th quantile of the distribution, q in [0, 1]: the
              UPPER bound of the bucket where the cumulative count reaches q of the total
              — an upper estimate, which is the honest reading of a bucketed histogram.
              q outside [0, 1] is clamped, NaN is read as 0, and an empty distribution is
              zero. A bucket whose upper bound is infinite answers with its lower bound.
            in:
              - name: q
                type: float64
            name: Quantile
            out:
              - type: time.Duration
            recv: value
        name: DistributionValue
        struct:
          fields:
            - doc: Counts[i] is the number of observations in [Buckets[i], Buckets[i+1]).
              name: Counts
              type: "[]uint64"
            - doc: |-
                Buckets are the boundaries, in seconds, one more than Counts. The
                first may be -Inf and the last +Inf.
              name: Buckets
              type: "[]float64"
  - doc: |-
      Package signal — Unix Relay: forwards each received signal to a pid or process
      group via kill(2), where a negative Target addresses the group whose id is its
      absolute value.

      Package signal — Windows Relay. There is no kill(2) on Windows, so signal
      forwarding maps onto the two native delivery primitives, bound directly from
      kernel32 (syscall.NewLazyDLL, ABI cited, no golang.org/x/sys):

        - a process-group target (Target < -1) → GenerateConsoleCtrlEvent, the
          console control event that reaches every process in the group: CTRL_BREAK
          for every signal, SIGINT included — the only event that can target one
          group, which a Go process reads as os.Interrupt;
        - a single-pid target (Target > 0) → OpenProcess + TerminateProcess, the
          reliable per-process delivery (Windows has no per-pid interrupt).

      The reserved targets 0 and -1 are refused before any delivery, exactly as the
      Unix build does, so a zero-value Target never fans out.

      Package signal — typed signal toolbox over os/signal: Notify subscribes to a
      set of signals on a leak-free channel, and Relay forwards received signals to
      a process or process group. The kill(2) path is platform-split into
      relay_unix.go / relay_other.go; this file holds the cross-platform Notify and
      the Target value, since os/signal itself is portable.
    functions:
      - build: unix
        doc: |-
          Relay reads signals from src and forwards each to target via kill(2) until src
          is closed. A positive target is a pid; a target below -1 addresses the process
          group whose id is -target (the kill(2) negative-pid convention). The reserved
          values 0 (the caller's own process group) and -1 (every process the caller may
          signal) are refused up front with a RelayFailed error before any delivery, so a
          zero-value or mis-computed Target cannot fan a signal out to unintended
          recipients. The first delivery failure stops the relay and returns a
          RelayFailed error wrapping the kill(2) cause; a clean drain of src returns nil.
        in:
          - name: src
            type: <-chan coreproc.Signal
          - name: target
            type: Target
        name: Relay
        out:
          - type: error
      - build: windows
        doc: |-
          Relay reads signals from src and forwards each to target until src is closed.
          A positive target is a pid; a target below -1 addresses the process group
          whose id is -target. The reserved 0 and -1 are refused up front. The first
          delivery failure stops the relay with a RelayFailed error; a clean drain of
          src returns nil.
        in:
          - name: src
            type: <-chan coreproc.Signal
          - name: target
            type: Target
        name: Relay
        out:
          - type: error
      - doc: |-
          Notify subscribes to sigs and returns a receive-only channel of typed Signals
          plus a stop function. Each delivery of one of sigs is translated from its
          os.Signal carrier to a coreproc.Signal and sent on the channel. The channel is
          buffered (one slot per subscribed signal, minimum one) so a burst is not
          dropped while a reader is busy, matching the os/signal "never blocks the
          sender" contract.

          The returned stop function unregisters the os/signal channel (signal.Stop runs
          in the translation goroutine via defer), ends the goroutine, and closes the
          returned channel; it is idempotent and leak-free — after it returns no
          goroutine or signal registration survives. Calling it more than once is a safe
          no-op.
        in:
          - name: sigs
            type: coreproc.Signal
        name: Notify
        out:
          - type: <-chan coreproc.Signal
          - type: func()
        variadic: true
      - doc: |-
          SendValue queues sig with value to the process target — rt_sigqueueinfo(2)
          with SI_QUEUE on Linux, sigqueue(2) on FreeBSD — where kill(2) would deliver
          the signal alone. A realtime signal queues instead of coalescing. The value
          reaches a C handler's si_value; a Go receiver cannot read it (os/signal
          exposes no siginfo). target names one process: a group, 0 and -1 are refused.
          It returns SIGNAL_FAILED wrapping the errno — ESRCH for a reaped pid — and
          UNSUPPORTED_PLATFORM elsewhere.
        in:
          - name: target
            type: Target
          - name: sig
            type: coreproc.Signal
          - name: value
            type: int
        name: SendValue
        out:
          - type: error
      - doc: |-
          NotifyContext returns a copy of parent that is cancelled when one of sigs
          arrives, with a ReceivedError naming it as context.Cause — os/signal's
          NotifyContext for the typed Signal, with Notify's guarantee that the
          subscription is live before it returns. stop unsubscribes, cancels the
          context with no signal cause, and returns once the bridge goroutine has
          ended; it is idempotent.
        in:
          - name: parent
            type: context.Context
          - name: sigs
            type: coreproc.Signal
        name: NotifyContext
        out:
          - name: ctx
            type: context.Context
          - name: stop
            type: func()
        variadic: true
      - doc: |-
          CauseSignal reports the signal a NotifyContext context was cancelled by, and
          false when it was cancelled otherwise or not at all.
        in:
          - name: ctx
            type: context.Context
        name: CauseSignal
        out:
          - name: sig
            type: coreproc.Signal
          - name: ok
            type: bool
      - doc: |-
          Escalate applies policy to the deliveries of sigs until ctx ends or stop is
          called: a delivery runs OnFirst and opens a window of policy.Window on clk;
          a second delivery of any of sigs inside it runs OnRepeat once, and the relay
          ends. A window that passes with no repeat closes, and the next delivery is a
          first again. A zero Window never closes — any later delivery escalates (ADR
          0031). It is the "first signal: drain with grace; second: stop at once" the
          framework and every CLI convention apply. The hooks run on the relay's
          goroutine and must not block; either may be nil. On Windows the deliveries
          are the console events the runtime maps to os.Interrupt. stop is
          idempotent and returns once the relay has ended.
        in:
          - name: ctx
            type: context.Context
          - name: clk
            type: clock.Waiter
          - name: policy
            type: EscalationValue
          - name: sigs
            type: coreproc.Signal
        name: Escalate
        out:
          - name: stop
            type: func()
        variadic: true
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/signal
    types:
      - doc: |-
          EscalationValue is the policy Escalate applies to repeated signals: what to
          do at a first delivery, at a repeat, and how long a repeat counts as one.
        name: EscalationValue
        struct:
          fields:
            - doc: OnFirst runs at a delivery that opens a window; nil runs nothing.
              name: OnFirst
              type: func(coreproc.Signal)
            - doc: |-
                OnRepeat runs once, at a delivery inside the window, and ends the relay;
                nil runs nothing.
              name: OnRepeat
              type: func(coreproc.Signal)
            - doc: |-
                Window is how long after a first delivery a second one escalates. Zero
                is a window that never closes: any later delivery escalates.
              name: Window
              type: time.Duration
      - doc: |-
          ReceivedError is the cause a NotifyContext context is cancelled with: the
          signal that arrived, as an error. It is comparable, so context.Cause(ctx)
          == ReceivedError{Signal: s} holds, and CauseSignal reads it back.
        methods:
          - doc: Error names the signal that cancelled the context, e.g. "SIGTERM received".
            name: Error
            out:
              - type: string
            recv: value
        name: ReceivedError
        struct:
          fields:
            - doc: Signal is the signal that arrived.
              name: Signal
              type: coreproc.Signal
      - doc: |-
          Target names the recipient of a relayed signal: a positive value is a pid; a
          value below -1 is the negation of a process-group id (kill(2) delivers to the
          whole group whose id is its absolute value). It is a plain int so call sites
          can pass a raw pid or -pgid without a constructor.
        name: Target
        underlying: int
  - doc: |-
      Package listen — non-Unix stub. Socket activation relies on file-descriptor
      inheritance, which is a Unix mechanism, so every entry point returns the typed
      UnsupportedPlatform sentinel and an empty result rather than acting.

      Package listen — Unix socket activation (sd_listen_fds(3) family). The
      service side recovers listening sockets an activator passed via inherited fds
      3.. plus the LISTEN_FDS / LISTEN_PID / LISTEN_FDNAMES environment; the
      activator side (Prepare) is the symmetric half, so the protocol is testable
      end-to-end without systemd. Fd inheritance is POSIX, so this builds on every
      Unix; non-Unix gets a stub returning UnsupportedPlatform.
    functions:
      - build: "!unix"
        doc: Files returns no sockets and UnsupportedPlatform off Unix.
        in:
          - name: _
            type: bool
        name: Files
        out:
          - type: "[]*os.File"
          - type: error
      - build: "!unix"
        doc: Listeners returns no listeners and UnsupportedPlatform off Unix.
        in:
          - name: _
            type: bool
        name: Listeners
        out:
          - type: "[]net.Listener"
          - type: error
      - build: "!unix"
        doc: WithNames returns no grouping and UnsupportedPlatform off Unix.
        in:
          - name: _
            type: bool
        name: WithNames
        out:
          - type: map[string][]*os.File
          - type: error
      - build: "!unix"
        doc: Prepare cannot pass sockets off Unix and returns UnsupportedPlatform.
        in:
          - name: _
            type: "*coreproc.Spec"
          - name: _
            type: map[string]net.Listener
        name: Prepare
        out:
          - type: error
      - build: "!unix"
        doc: PrepareFiles cannot pass descriptors off Unix and returns UnsupportedPlatform.
        in:
          - name: _
            type: "*coreproc.Spec"
          - name: _
            type: "[]NamedFileValue"
        name: PrepareFiles
        out:
          - type: error
      - doc: |-
          CheckName refuses, with InvalidFDName, a descriptor name LISTEN_FDNAMES cannot
          carry — systemd's fdname_is_valid: at most 255 bytes, every byte printable
          ASCII, no ':', the list's separator. The empty name is valid; Prepare and
          PrepareFiles announce it as "unknown". It is the check FileDescriptorName=
          and FDNAME= values pass, on every platform.
        in:
          - name: name
            type: string
        name: CheckName
        out:
          - type: error
      - build: unix
        doc: |-
          Files returns the inherited listening sockets (fd 3..3+LISTEN_FDS) as *os.File,
          gated on LISTEN_PID. When unsetEnv is true the activation env is cleared so a
          grandchild does not re-inherit it. An empty/foreign activation set yields nil.
          Each socket has FD_CLOEXEC set, as sd_listen_fds(3) sets it, so no process
          this one spawns inherits a listening socket; handing one on to a re-exec is
          explicit, through Prepare or the Spec's ExtraFiles.
        in:
          - name: unsetEnv
            type: bool
        name: Files
        out:
          - name: files
            type: "[]*os.File"
          - name: err
            type: error
      - build: unix
        doc: |-
          Listeners returns the inherited stream sockets wrapped as net.Listener. Each
          underlying *os.File is closed after net.FileListener dups it.
        in:
          - name: unsetEnv
            type: bool
        name: Listeners
        out:
          - name: lns
            type: "[]net.Listener"
          - name: err
            type: error
      - build: unix
        doc: |-
          WithNames returns the inherited sockets grouped by their LISTEN_FDNAMES name
          (duplicate names group multiple fds under one key).
        in:
          - name: unsetEnv
            type: bool
        name: WithNames
        out:
          - name: byName
            type: map[string][]*os.File
          - name: err
            type: error
      - build: unix
        doc: |-
          Prepare is the activator side: it prepends each listener's socket to child as
          an inherited fd and sets LISTEN_FDS / LISTEN_FDNAMES in child.Env so the
          spawned process recovers them via Files/Listeners. Sockets are passed in
          sorted-name order, each name checked as CheckName does, the empty one
          announced as "unknown". LISTEN_PID is the child's own: Prepare adds it to
          child.PIDEnv, which the spawn sets after the fork (kitsunium/sdk#739) — a
          spawn through the trampoline; a caller that cannot afford it removes the
          name, and Files accepts an absent LISTEN_PID from a trusted parent.
        in:
          - name: child
            type: "*coreproc.Spec"
          - name: named
            type: map[string]net.Listener
        name: Prepare
        out:
          - type: error
      - build: unix
        doc: |-
          PrepareFiles hands files to child as Prepare hands sockets: at fd 3 on, in the
          order given, LISTEN_FDS, LISTEN_FDNAMES and LISTEN_PID set as Prepare sets
          them. The files are passed as they are — never duplicated nor closed here, so
          a descriptor store hands its descriptors to each restart and keeps them —
          and a name LISTEN_FDNAMES cannot carry is InvalidFDName before child changes.
          Any ExtraFiles child already had follow them.
        in:
          - name: child
            type: "*coreproc.Spec"
          - name: files
            type: "[]NamedFileValue"
        name: PrepareFiles
        out:
          - type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/systemd/listen
    types:
      - doc: |-
          NamedFileValue is one descriptor PrepareFiles hands a child, and the name
          LISTEN_FDNAMES gives it: a socket a service manager bound, or one a
          descriptor store kept with the FDNAME= its service sent.
        name: NamedFileValue
        struct:
          fields:
            - doc: Name is the descriptor's name; empty is announced as "unknown".
              name: Name
              type: string
            - doc: File is the descriptor; PrepareFiles neither duplicates nor closes it.
              name: File
              type: "*os.File"
  - doc: |-
      Package notify — the supervisor (listener) side on Linux: SO_PASSCRED.

      Package notify — the supervisor (listener) side off Linux and FreeBSD:
      unsupported.

      Package notify — the notifier (child) side: sending sd_notify datagrams.

      Package notify — sd_notify(3) readiness/watchdog protocol implementation.

      This package implements both sides of the systemd sd_notify protocol on top of
      the ports declared in internal/core/proc:

        - the notifier (Notify and its lifecycle shorthands) writes a single
          newline-separated NAME=value datagram to $NOTIFY_SOCKET; when the variable
          is unset every notifier call is a no-op returning nil, exactly as
          libsystemd specifies, so an unsupervised binary stays silent rather than
          erroring;
        - the listener (Listen) is the supervisor side: it owns an AF_UNIX datagram
          socket, enables SO_PASSCRED (Linux) or LOCAL_CREDS_PERSISTENT (FreeBSD) so
          the kernel stamps each datagram with the sender's verified PID, and yields
          one parsed NotificationValue per Recv.

      $NOTIFY_SOCKET is an AF_UNIX address; a leading '@' selects the abstract
      namespace and is replaced by a NUL byte before binding/connecting. The
      credential-passing listener runs on Linux (SO_PASSCRED / SCM_CREDENTIALS) and
      FreeBSD (LOCAL_CREDS_PERSISTENT / SCM_CREDS2); on every other platform Listen
      returns coreproc.UnsupportedPlatform while the notifier remains fully
      portable.
    functions:
      - build: linux || freebsd
        doc: |-
          Listen creates a supervisor-side sd_notify datagram socket, makes the kernel
          stamp every datagram with its sender's credentials — SO_PASSCRED on Linux,
          LOCAL_CREDS_PERSISTENT on FreeBSD —, and returns the Listener together with
          the $NOTIFY_SOCKET value a child should be given. The socket is bound under a
          private temp directory so its path is unguessable; the caller sets
          NOTIFY_SOCKET=socketPath for the child.

          Its Recv reads the whole sd_notify(3) transport (kitsunium/sdk#730): the
          sender's PID, real user and real group from SCM_CREDENTIALS or SCM_CREDS2, a
          pidfd on the sender where the kernel attaches one (SO_PASSPIDFD, Linux 6.5),
          and the descriptors a datagram carries (SCM_RIGHTS, close-on-exec on
          arrival). Every assignment sd_notify(3)
          defines is checked — a flag is 1, a PID or a count is decimal, NOTIFYACCESS= a
          known access, FDNAME= a valid name —; an unknown name is kept as it came, a
          name given twice keeps its last value. BARRIER=1 must carry exactly one
          descriptor and is returned alone; MAINPIDFD=1 exactly one pidfd — a process
          descriptor on FreeBSD —, whose PID becomes MainPID. A datagram refused — truncated, its control data truncated,
          an embedded NUL, an assignment out of bounds, no credentials — is
          InvalidNotification or CredentialMismatch, and every descriptor it carried is
          closed.
        name: Listen
        out:
          - name: l
            type: coreproc.Listener
          - name: socketPath
            type: string
          - name: err
            type: error
      - build: "!linux && !freebsd"
        doc: |-
          Listen returns UnsupportedPlatform off Linux and FreeBSD: the credential
          check the listener relies on — the kernel stamping every datagram with its
          sender (SO_PASSCRED, LOCAL_CREDS_PERSISTENT) — is theirs alone. The notifier
          side (Notify and its shorthands) and WatchdogInterval remain available on
          every platform.
        name: Listen
        out:
          - name: l
            type: coreproc.Listener
          - name: socketPath
            type: string
          - name: err
            type: error
      - build: linux || freebsd
        doc: |-
          ListenFor is Listen for a service that runs as uid and gid: the private
          directory and the socket in it belong to that user, so the service — and
          root — can reach the socket, and no other user can. Changing their owner
          needs the privilege to: a refusal is ListenFailed, nothing left behind.
        in:
          - name: uid
          - name: gid
            type: int
        name: ListenFor
        out:
          - name: l
            type: coreproc.Listener
          - name: socketPath
            type: string
          - name: err
            type: error
      - build: "!linux && !freebsd"
        doc: |-
          ListenFor returns UnsupportedPlatform off Linux and FreeBSD, as Listen does.
        in:
          - name: _
          - name: _
            type: int
        name: ListenFor
        out:
          - name: l
            type: coreproc.Listener
          - name: socketPath
            type: string
          - name: err
            type: error
      - build: linux || freebsd
        doc: |-
          Detach readies l — Listen's or ListenFor's — to be handed to another image
          of this process (kitsunium/sdk#738): it returns a new close-on-exec
          descriptor on the socket, and l's Close no longer removes the socket's
          path nor its directory, which Adopt's listener removes in turn. Any other
          Listener is ListenFailed.
        in:
          - name: l
            type: coreproc.Listener
        name: Detach
        out:
          - name: f
            type: "*os.File"
          - name: err
            type: error
      - build: "!linux && !freebsd"
        doc: Detach returns UnsupportedPlatform off Linux and FreeBSD, as Listen does.
        in:
          - name: _
            type: coreproc.Listener
        name: Detach
        out:
          - name: f
            type: "*os.File"
          - name: err
            type: error
      - build: linux || freebsd
        doc: |-
          Adopt is the listener over a socket Detach handed over, bound at
          socketPath: the kernel stamps every datagram with its sender again, and
          Close removes the path — and the private directory Listen made, named
          sdnotify-… — as Listen's listener does. f is the caller's; a descriptor
          that is no datagram socket of the unix family is ListenFailed.
        in:
          - name: f
            type: "*os.File"
          - name: socketPath
            type: string
        name: Adopt
        out:
          - name: l
            type: coreproc.Listener
          - name: err
            type: error
      - build: "!linux && !freebsd"
        doc: Adopt returns UnsupportedPlatform off Linux and FreeBSD, as Listen does.
        in:
          - name: _
            type: "*os.File"
          - name: _
            type: string
        name: Adopt
        out:
          - name: l
            type: coreproc.Listener
          - name: err
            type: error
      - doc: |-
          Notify sends an sd_notify datagram carrying the given NAME=value state to
          $NOTIFY_SOCKET. When $NOTIFY_SOCKET is unset it is a no-op returning nil, per
          libsystemd; a send failure when the socket is set returns NotifyFailed. An
          empty state map under a set socket still opens and closes the connection,
          matching libsystemd's "ping" behaviour.

          It waits as long as the supervisor makes it wait: a unixgram write blocks
          once the receiving buffer is full, and this call carries no deadline. A
          caller whose own work is bounded wants [NotifyContext].
        in:
          - name: state
            type: map[string]string
        name: Notify
        out:
          - type: error
      - doc: |-
          NotifyContext is [Notify] bounded by ctx: the datagram's write observes ctx's
          deadline, and its cancellation.

          It exists because the write is the only unbounded step in the call. The
          socket belongs to the supervisor, so a supervisor that stops reading — paused,
          stopped, or simply slow — blocks the writer with nothing the process can do
          about it. Where that write sits under a lock a health probe also takes, one
          stuck supervisor stops every later probe from answering: the readiness the
          datagram was meant to announce becomes unobservable because announcing it
          hung.

          ctx bounds the WRITE, not the dial: a unixgram dial takes no round trip.
        in:
          - name: ctx
            type: context.Context
          - name: state
            type: map[string]string
        name: NotifyContext
        out:
          - name: err
            type: error
      - doc: Ready notifies the supervisor that startup is complete (READY=1).
        name: Ready
        out:
          - type: error
      - doc: ReadyContext is [Ready] bounded by ctx — see [NotifyContext].
        in:
          - name: ctx
            type: context.Context
        name: ReadyContext
        out:
          - type: error
      - doc: StatusContext is [Status] bounded by ctx — see [NotifyContext].
        in:
          - name: ctx
            type: context.Context
          - name: msg
            type: string
        name: StatusContext
        out:
          - type: error
      - doc: |-
          Reloading notifies the supervisor that a configuration reload has begun
          (RELOADING=1).
        name: Reloading
        out:
          - type: error
      - doc: Stopping notifies the supervisor that shutdown has begun (STOPPING=1).
        name: Stopping
        out:
          - type: error
      - doc: Status publishes a single-line free-text status (STATUS=msg).
        in:
          - name: msg
            type: string
        name: Status
        out:
          - type: error
      - doc: Watchdog sends a watchdog keep-alive ping (WATCHDOG=1).
        name: Watchdog
        out:
          - type: error
      - doc: MainPID advertises the main process PID to the supervisor (MAINPID=pid).
        in:
          - name: pid
            type: int
        name: MainPID
        out:
          - type: error
      - doc: |-
          WatchdogInterval reports the watchdog ping interval the supervisor configured
          via $WATCHDOG_USEC. ok is false — sd_watchdog_enabled's "watchdog disabled"
          result — when the variable is unset, malformed, not positive, or larger than
          a time.Duration holds, and when $WATCHDOG_PID is set and does not name this
          process: a child that inherited its parent's environment is not the process
          the supervisor watches. When ok is true, d is positive. It is portable: it
          reads only the environment and never touches a socket.
        name: WatchdogInterval
        out:
          - name: d
            type: time.Duration
          - name: ok
            type: bool
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
    path: github.com/kitsunium/sdk/internal/service/proc/systemd/notify
  - constants:
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapProcessSpawn is spawning + supervising a child process (process.Start).
        name: CapProcessSpawn
        type: Capability
        value: "0"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapRlimit is applying per-process setrlimit-style limits (rlimit.Apply).
        name: CapRlimit
        type: Capability
        value: "1"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: |-
          CapUmaskNice is the spawn-time umask and nice knobs (Spec.Umask, Spec.Nice),
          native on every Unix. The OOM-killer bias is CapOOMScoreAdj.
        name: CapUmaskNice
        type: Capability
        value: "2"
      - doc: |-
          CapOOMScoreAdj is the spawn-time OOM-killer bias (Spec.OOMScoreAdj), a Linux
          procfs knob: elsewhere Start refuses it with UnsupportedPlatform before
          spawning anything. It is numbered 12, apart from the block above: 8 to 11 are
          the spawn's own capabilities (ADR 0217), and a value is never given twice.
        name: CapOOMScoreAdj
        type: Capability
        value: "12"
      - doc: |-
          CapSandbox is spawning a child under Spec.Sandbox: namespaces, mounts,
          capabilities, Landlock and seccomp, applied before its program runs. Linux on
          amd64 and arm64 alone, where the system call tables are written; every other
          GOOS and GOARCH refuses it with UnsupportedPlatform before spawning anything.
          It is numbered 13, after CapOOMScoreAdj.
        name: CapSandbox
        type: Capability
        value: "13"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapCgroup is a kernel-enforced resource container (cgroup.Create).
        name: CapCgroup
        type: Capability
        value: "3"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapReaper is zombie reaping / subreaping (reaper.New).
        name: CapReaper
        type: Capability
        value: "4"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapSignalRelay is forwarding signals to a pid / process group (signal.Relay).
        name: CapSignalRelay
        type: Capability
        value: "5"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapSdNotify is the service-manager readiness/watchdog protocol (systemd/notify).
        name: CapSdNotify
        type: Capability
        value: "6"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapSocketActivation is inheriting a pre-opened listening socket (systemd/listen).
        name: CapSocketActivation
        type: Capability
        value: "7"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapDieWithParent is binding a child to the supervisor's life (Spec.DieWithParent).
        name: CapDieWithParent
        type: Capability
        value: "8"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapScheduling is a child's CPU policy and I/O class (Spec.Scheduling).
        name: CapScheduling
        type: Capability
        value: "9"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapPTY is spawning a child on a pseudo-terminal (StdioPTY).
        name: CapPTY
        type: Capability
        value: "10"
      - blockDoc: The supervisable capabilities, one per platform-sensitive proc primitive.
        doc: CapProcessHandle is reaching a process through a kernel handle, not its pid (ProcessHandle, process.Open).
        name: CapProcessHandle
        type: Capability
        value: "11"
    doc: |-
      Package proc is the capability-preflight facade for the process-supervision
      domain. Some proc primitives have no native, secure mechanic on every OS
      (cgroup is Linux, Windows and FreeBSD only, rlimit/sd_notify are Unix-only,
      the OOM bias Linux-only, …); the SDK
      honours those gaps by returning the typed [UnsupportedPlatform] error and
      NEVER panicking on its own. This package lets a CONSUMER instead choose to
      fail fast at its own startup — the idiomatic Go MustX pattern
      ([regexp.MustCompile] / [text/template.Must]): the library offers the panic,
      it never imposes it.

      # Why preflight instead of recover

      A process supervisor (a PID1) cannot rely on a recover() in its hot path: an
      unrecovered panic in pid 1 orphans every supervised service, and a panic that
      crosses a CGO/FFI boundary is undefined behaviour. The safe pattern is to
      reject an unsupported configuration up front — assert the required
      capabilities once, at startup, then route only to capabilities that
      [Supported] reports present.

      	func main() {
      		// crash-at-launch, clearly, if this host cannot supervise at all:
      		proc.MustSupport(proc.CapProcessSpawn, proc.CapReaper)
      		os.Exit(run())
      	}

      	// elsewhere, branch instead of crash for an optional capability:
      	if proc.Supported(proc.CapCgroup) {
      		// confine via cgroup / Job Object
      	}

      # Capability × platform matrix

      Every row is the engines' own answer: a capability marked ❌ is refused with
      [UnsupportedPlatform] by its engine, and one marked ✅ is not, which a test of
      this package holds on every platform the SDK's runtime lanes run.

      	Capability           linux darwin windows freebsd openbsd netbsd dragonfly illumos solaris
      	CapProcessSpawn        ✅     ✅     ✅      ✅      ✅      ✅      ✅        ✅      ✅
      	CapSignalRelay         ✅     ✅     ✅      ✅      ✅      ✅      ✅        ✅      ✅
      	CapReaper              ✅     ✅     ✅¹     ✅      ✅      ✅      ✅        ✅⁴     ✅⁴
      	CapCgroup              ✅     ❌     ✅²     ✅²     ❌      ❌      ❌        ❌      ❌
      	CapRlimit              ✅     ✅     ❌³     ✅      ✅      ✅      ✅        ✅      ✅
      	CapUmaskNice           ✅     ✅     ❌      ✅      ✅      ✅      ✅        ✅      ✅
      	CapOOMScoreAdj         ✅     ❌     ❌      ❌      ❌      ❌      ❌        ❌      ❌
      	CapSdNotify            ✅     ✅     ❌      ✅      ✅      ✅      ✅        ✅      ✅
      	CapSocketActivation    ✅     ✅     ❌      ✅      ✅      ✅      ✅        ✅      ✅
      	CapDieWithParent       ✅     ❌     ✅      ✅      ❌      ❌      ❌        ❌      ❌
      	CapScheduling          ✅     ❌     ❌⁵     ✅⁶     ❌      ❌      ❌        ❌      ❌
      	CapPTY                 ✅     ✅     ❌      ✅      ✅      ❌      ❌        ❌      ❌
      	CapProcessHandle       ✅     ❌     ✅      ❌      ❌      ❌      ❌        ❌      ❌
      	CapSandbox             ✅⁷    ❌     ❌      ❌      ❌      ❌      ❌        ❌      ❌

      ¹ Windows has no zombies; the reaper is a correct no-op there. ² Windows
      cgroup is the Job Object backend; FreeBSD's is the rctl(8) backend, which
      needs a kernel carrying RACCT (kern.racct.enable=1): without it
      cgroup.Available reports false and cgroup.Create returns
      [UnsupportedPlatform]. ³ the Unix setrlimit-on-self model has no
      Windows analogue; Windows resource limits are applied through the cgroup
      (Job Object) container or at spawn via the process Spec, not a standalone rlimit.
      ⁴ illumos and Solaris have no reparent-here facility, like darwin, OpenBSD
      and NetBSD: SetChildSubreaper returns [UnsupportedPlatform]. Their reaper
      also sweeps once a second, because the Go runtime forks every child there
      with FORK_NOSIGCHLD and its exit posts no SIGCHLD. Both columns are proven
      on OmniOS r151054 and Oracle Solaris 11.4 (amd64) by the SDK's
      cross-platform runtime lane.
      ⁵ Windows maps Spec.Nice onto a priority class, but has no scheduling
      policy or I/O class. ⁶ FreeBSD applies SchedFIFO, SchedRR and SchedIdle
      through rtprio(2); it has no batch policy and no per-process I/O class.
      ⁷ on amd64 and arm64, the architectures whose system call tables the sandbox's
      seccomp filter is written against; Linux on any other GOARCH refuses it.

      [Supported] consults runtime.GOOS only — CapSandbox's row is written for the
      GOARCH the binary is built for — it is the platform-level matrix, not a runtime
      probe. A capability that is native on the GOOS may still be unavailable at
      runtime (e.g. cgroup present but not delegated); use the per-facade probe for
      that (e.g. cgroup.Available()).
    functions:
      - doc: |-
          Supported reports whether cap has a native backend on the current GOOS. It is
          pure, allocation-free and race-clean: it consults runtime.GOOS only, never a
          runtime delegation probe (see the package doc on cgroup.Available()).
        in:
          - name: c
            type: Capability
        name: Supported
        out:
          - type: bool
      - doc: |-
          MissingCapabilities returns the subset of caps with no native backend on the
          current platform; an empty (nil) result means every capability is present.
        in:
          - name: caps
            type: Capability
        name: MissingCapabilities
        out:
          - type: "[]Capability"
        variadic: true
      - doc: |-
          MustSupport panics when any requested capability is missing on the current
          platform, and is a no-op otherwise. It is the consumer's OPT-IN fail-fast: the
          SDK never calls it. The panic value is the typed [errs] UnsupportedPlatform
          error (code 0.2.6.1), so a top-level recover() can classify it via
          errs.CodeOf / HasCode rather than a bare string.
        in:
          - name: caps
            type: Capability
        name: MustSupport
        variadic: true
    imports:
      kernelerrs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/pkg/v1/proc
    types:
      - doc: |-
          Capability identifies one process-supervision capability whose native backend
          is present on some platforms and absent on others.
        methods:
          - doc: |-
              String returns the capability's stable name, or its integer form when the
              value is out of range.
            name: String
            out:
              - type: string
            recv: value
        name: Capability
        underlying: int
    variables:
      - doc: |-
          UnsupportedPlatform is the central sentinel a missing capability surfaces. A
          recover() of a [MustSupport] panic yields an error carrying this error's code.
        name: UnsupportedPlatform
        type: "*kernelerrs.Error"
  - doc: |-
      Package buildinfo is what the running binary was built from: the toolchain,
      the main package, the main module with its version-control stamp, and every
      dependency followed through its replacement.

      	build, ok := buildinfo.Build()
      	sdk, found := build.Module("github.com/kitsunium/sdk")
      	// sdk.Version is a release ("v0.4.6"), or "" with sdk.Revision/sdk.Time
      	// for a pseudo-version, or "" with sdk.Local for a directory.

      A module's recorded version conflates three things, and [Module] keeps them
      apart: a RELEASE in Version, a COMMIT in Revision and Time (a pseudo-version
      names one, and so does the main module's version-control stamp), and a
      DIRECTORY in Local and Dir (a replace, a workspace module). Nothing here fails:
      a binary built without module support reads as false.

      The same values are re-exported by pkg/v1/proc/process, beside the spawning of
      children and the process's runtime statistics. This package is the reading
      alone, so that a program asking only what it was built from imports neither
      the spawn engine nor runtime/metrics, whose initialisation every process
      importing them pays at start (ADR 0172).
    facade:
      - alias:
          - doc: |-
              BuildInfo is what the running binary was built from: the toolchain, the
              main package, the main module with its version-control stamp, and every
              dependency followed through its replacement. It is an alias of the service
              value, and the same type as pkg/v1/proc/process.BuildInfo.
            name: BuildInfo
            target: svcbuild.BuildValue
      - alias:
          - doc: |-
              Module is one module of the running binary, with its release, its commit
              and its local directory told apart. It is an alias of the service value,
              and the same type as pkg/v1/proc/process.Module.
            name: Module
            target: svcbuild.ModuleValue
      - alias:
          - doc: |-
              Toolchain is how the toolchain built the binary: its target, compiler,
              flags and cgo setting. It is an alias of the service value, and the same
              type as pkg/v1/proc/process.Toolchain.
            name: Toolchain
            target: svcbuild.ToolchainValue
      - alias:
          - doc: |-
              Setting is one build setting as the toolchain recorded it, key and value.
              It is an alias of the service value, and the same type as
              pkg/v1/proc/process.Setting.
            name: Setting
            target: svcbuild.SettingValue
      - func:
          doc: |-
            Build describes what the running binary was built from, and reports false
            when the binary carries no build information.
          forward: svcbuild.ReadBuild
          name: Build
          out:
            - name: info
              type: BuildInfo
            - name: ok
              type: bool
      - func:
          doc: |-
            ParseBuild describes a BuildInfo from elsewhere — one a test builds by
            hand, or debug.ParseBuildInfo's reading of another binary — exactly as
            Build describes the running one.
          forward: svcbuild.ParseBuild
          in:
            - name: info
              type: "*debug.BuildInfo"
          name: ParseBuild
          out:
            - type: BuildInfo
    imports:
      debug: runtime/debug
      svcbuild: github.com/kitsunium/sdk/internal/service/proc/buildinfo
    path: github.com/kitsunium/sdk/pkg/v1/proc/buildinfo
  - doc: |-
      Package cgroup creates and manages cgroup v2 control groups to confine a
      process tree's memory, CPU, pids, and IO.

      It is the thin public facade over internal/service/proc/cgroup: Group is an
      alias of the core proc.Group port and the functions delegate straight to the
      service implementation. The kernel-enforced control-group backend is the
      unified cgroup v2 hierarchy on Linux, a Job Object on Windows and rctl(8) on
      FreeBSD; the facade degrades gracefully — on a platform with no such backend
      (darwin, OpenBSD, NetBSD, DragonFly, illumos, Solaris, a FreeBSD kernel
      without RACCT), a cgroup
      v1 host, or an unprivileged/non-delegated Linux host it returns the typed
      UnsupportedPlatform or CgroupUnavailable error rather than panicking.

      # Usage

      Create a group, cap its memory, attach a process, then tear it down:

      	import (
      		"github.com/kitsunium/sdk/pkg/v1/proc/cgroup"
      	)

      	if !cgroup.Available() {
      		// cgroup v2 not mounted or not delegated to this caller.
      		return
      	}
      	g, err := cgroup.Create("myservice")
      	if err != nil {
      		return // CgroupUnavailable / CgroupCreateFailed / UnsupportedPlatform
      	}
      	defer g.Delete()
      	_ = g.SetMemoryMax(256 << 20) // 256 MiB; a negative value means "no limit"
      	_ = g.SetCPUMax(50000, 100000) // 50% of one CPU ("quota period" microseconds)
      	_ = g.Add(pid)                 // move pid into the group via cgroup.procs

      # Semantics

      Set*Max writes the matching cgroup v2 interface file: memory.max, cpu.max
      ("quota period"), pids.max, and one io.max line written verbatim. A negative
      numeric value writes the literal "max" (no limit). Add writes a pid to
      cgroup.procs. Delete rmdir's the group, which the kernel refuses (EBUSY,
      surfaced as CgroupDeleteFailed) until every process has left it.

      # Delegation

      Available is honest about delegation: it confirms the cgroup.controllers
      marker exists AND that a throwaway sub-directory can be created under the
      mount. A read-only root (the common unprivileged-container case) reports
      false, and Create returns CgroupUnavailable. Use WithRoot to target a
      delegated sub-tree handed to the caller by a container manager.

      # Platform notes

      The backend is cgroup v2 on Linux, a Job Object on Windows and rctl(8) on
      FreeBSD. On those, Available reports true (Linux additionally requires the
      hierarchy delegated, FreeBSD a kernel with RACCT) and Create returns a usable
      Group. On every other platform (darwin, OpenBSD, NetBSD, DragonFly, illumos, Solaris) Available
      returns false and Create returns UnsupportedPlatform. The Group surface is
      uniform; SetIOMax / Freeze / Thaw degrade to UnsupportedPlatform on the Job
      Object backend, which has no equivalent for them. WithRoot names a directory of
      the cgroup v2 hierarchy, so it takes effect on Linux only: the Job Object and
      rctl backends have no hierarchy, and accept the option and ignore it.
    facade:
      - alias:
          - doc: |-
              Group is a handle to a cgroup v2 control group: set controller ceilings,
              attach processes, and remove the group. It aliases the core proc.Group port.
            name: Group
            target: coreproc.Group
      - alias:
          - doc: |-
              Option customises a Create call (functional-option pattern). It aliases the
              service Option type; construct options with WithRoot.
            name: Option
            target: svccgroup.Option
      - func:
          doc: |-
            WithRoot overrides the parent directory under which Create makes the new
            control group, targeting a delegated sub-tree instead of the top-level mount.
            It is a cgroup v2 path: on Windows and FreeBSD, whose backends have no
            hierarchy, it is accepted and ignored.
          forward: svccgroup.WithRoot
          in:
            - name: root
              type: string
          name: WithRoot
          out:
            - type: Option
      - func:
          doc: |-
            Available reports whether a kernel-enforced control-group backend is usable: on
            Linux, that the unified cgroup v2 hierarchy is mounted AND a sub-group can be
            created under it by the caller; on Windows, that Job Objects are available
            (always true); on FreeBSD, that the kernel carries RACCT. It returns false on
            platforms with no backend (darwin, OpenBSD, NetBSD, DragonFly, illumos, Solaris), on cgroup v1,
            and on a Linux host where the hierarchy is read-only.
          forward: svccgroup.Available
          name: Available
          out:
            - type: bool
      - func:
          doc: |-
            Create makes a new control group named name and returns a Group bound to it —
            a cgroup v2 sub-group under the delegated root on Linux, where name may be
            nested ("a/b") and never leaves the root, a Job Object on Windows, a tracked
            rctl group on FreeBSD. It returns CgroupUnavailable when the Linux hierarchy
            is absent or not delegated, CgroupControllerAbsent when WithControllers
            names a controller the root does not offer, CgroupCreateFailed when creation
            fails, and UnsupportedPlatform on a platform with no control-group backend
            (darwin, OpenBSD, NetBSD, DragonFly, illumos, Solaris).
          forward: svccgroup.Create
          in:
            - name: name
              type: string
            - name: opts
              type: Option
          name: Create
          out:
            - name: g
              type: Group
            - name: err
              type: error
          variadic: true
      - alias:
          - doc: |-
              GroupReader is the read half of a Group: Stat and Members. Assert it on the
              Group Create returns. It aliases the core port.
            name: GroupReader
            target: coreproc.GroupReader
      - alias:
          - doc: |-
              GroupStat is what a group's tree has used, as GroupReader.Stat read it;
              Partial says some counters could not be. It aliases the core value.
            name: GroupStat
            target: coreproc.GroupStatValue
      - alias:
          - doc: MemoryEvents counts what a group's memory limits did. It aliases the core value.
            name: MemoryEvents
            target: coreproc.MemoryEventsValue
      - alias:
          - doc: IOStat is one device's I/O by a group. It aliases the core value.
            name: IOStat
            target: coreproc.IOStatValue
      - alias:
          - doc: |-
              ProbeResult is what Probe found under a control-group root: whether it is
              mounted, whether the caller may create a group there, its controllers,
              and the caller's own cgroup. It aliases the service value.
            name: ProbeResult
            target: svccgroup.ProbeValue
      - func:
          doc: |-
            Probe reports what the caller may do under a control-group root — WithRoot's,
            else the mount — where Available answers for the mount root alone. On a
            host that delegates a subtree, Probe(WithRoot(p.OwnGroup)) is the gate
            Create can be used behind. UnsupportedPlatform where no backend exists.
          forward: svccgroup.Probe
          in:
            - name: opts
              type: Option
          name: Probe
          out:
            - type: ProbeResult
            - type: error
          variadic: true
      - func:
          doc: |-
            Membership returns the path /proc/<pid>/cgroup names for a process of the
            group whose directory is dir — what process.AttachScope's Cgroup takes —:
            "/sys/fs/cgroup/system.slice/web.service" is "/system.slice/web.service".
            A group's Path is that directory, never this path. InvalidSpec when no
            cgroup2 mount holds dir; UnsupportedPlatform off Linux.
          forward: svccgroup.Membership
          in:
            - name: dir
              type: string
          name: Membership
          out:
            - type: string
            - type: error
      - func:
          doc: |-
            WithControllers enables ctrls for the group Create makes, on Linux: they
            are written to the cgroup.subtree_control of the root and of every group
            down to the new one before it is made, so its interface files for them
            exist. A controller the root does not offer is CgroupControllerAbsent
            before anything is made. Windows and FreeBSD accept it and ignore it.
          forward: svccgroup.WithControllers
          in:
            - name: ctrls
              type: Controller
          name: WithControllers
          out:
            - type: Option
          variadic: true
      - alias:
          - doc: |-
              Controller is a cgroup v2 controller; String is its kernel name. It
              aliases the core value.
            name: Controller
            target: coreproc.Controller
      - const:
          - doc: "ControllerCPU distributes CPU time: cpu.weight, cpu.max, cpu.max.burst."
            name: ControllerCPU
            reexport: coreproc.ControllerCPU
            type: Controller
            typed: true
            value: "1"
          - doc: "ControllerCPUSet pins tasks to CPUs and memory nodes: cpuset.cpus, cpuset.mems."
            name: ControllerCPUSet
            reexport: coreproc.ControllerCPUSet
            type: Controller
            typed: true
            value: "2"
          - doc: "ControllerIO distributes block I/O: io.weight, io.max, io.latency."
            name: ControllerIO
            reexport: coreproc.ControllerIO
            type: Controller
            typed: true
            value: "3"
          - doc: "ControllerMemory bounds memory: memory.min/low/high/max, the swap and zswap limits, memory.oom.group."
            name: ControllerMemory
            reexport: coreproc.ControllerMemory
            type: Controller
            typed: true
            value: "4"
          - doc: "ControllerPids bounds the number of tasks: pids.max."
            name: ControllerPids
            reexport: coreproc.ControllerPids
            type: Controller
            typed: true
            value: "5"
          - doc: "ControllerHugeTLB bounds huge-page use: hugetlb.<size>.max."
            name: ControllerHugeTLB
            reexport: coreproc.ControllerHugeTLB
            type: Controller
            typed: true
            value: "6"
          - doc: "ControllerRDMA bounds RDMA resources: rdma.max."
            name: ControllerRDMA
            reexport: coreproc.ControllerRDMA
            type: Controller
            typed: true
            value: "7"
          - doc: "ControllerMisc bounds scalar resources the kernel lists: misc.max."
            name: ControllerMisc
            reexport: coreproc.ControllerMisc
            type: Controller
            typed: true
            value: "8"
        doc: |-
          The cgroup v2 controllers of Linux 6.12, re-exported so WithControllers and
          EnableControllers can be called without importing internal/core/proc.
      - alias:
          - doc: |-
              GroupTuner is the Linux sibling of a Group that writes the cgroup v2 files
              Group does not: memory.min/low/high, the swap and zswap limits,
              memory.oom.group, cpu.weight, cpu.max.burst, the cpusets, io.weight and
              io.latency. Assert it on the Group Create returns. It aliases the core port.
            name: GroupTuner
            target: coreproc.GroupTuner
      - alias:
          - doc: |-
              GroupTree is the Linux sibling of a Group for the group as a node of the
              hierarchy: Path, EnableControllers, Delegate and DeleteTree. It aliases the
              core port.
            name: GroupTree
            target: coreproc.GroupTree
      - alias:
          - doc: |-
              GroupWatcher is the Linux sibling of a Group that follows cgroup.events and
              memory.events: Watch. It aliases the core port.
            name: GroupWatcher
            target: coreproc.GroupWatcher
      - alias:
          - doc: |-
              GroupSignaler is the Linux sibling of a Group that signals every process of
              the group and of the groups beneath it, and says whether a pid is one of
              them: Signal and Contains. It aliases the core port.
            name: GroupSignaler
            target: coreproc.GroupSignaler
      - alias:
          - doc: |-
              GroupEvents is a group's state as GroupWatcher.Watch reads it: populated,
              frozen, the memory events. It aliases the core value.
            name: GroupEvents
            target: coreproc.GroupEventsValue
      - alias:
          - doc: |-
              JobLimiter is the Windows sibling of a Group that caps the memory of the
              whole Job Object, where SetMemoryMax caps each process: SetJobMemoryLimit.
              It aliases the core port.
            name: JobLimiter
            target: coreproc.JobLimiter
    functions:
      - doc: |-
          MustCreate is like [Create] but panics with the typed error when creation
          fails — UnsupportedPlatform on a platform with no control-group backend
          (darwin, OpenBSD, NetBSD, DragonFly, illumos, Solaris), or CgroupUnavailable when the Linux hierarchy is not
          delegated. It is the idiomatic Go MustX opt-in (like
          [regexp.MustCompile]) for a consumer that chooses crash-on-unsupported at its
          own startup; the SDK itself never panics, and [Create] is the non-panicking
          form for normal use. The panic value is the typed error, so a top-level
          recover() can classify it via errs.CodeOf / HasCode.
        in:
          - name: name
            type: string
          - name: opts
            type: Option
        name: MustCreate
        out:
          - type: Group
        variadic: true
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      svccgroup: github.com/kitsunium/sdk/internal/service/proc/cgroup
    path: github.com/kitsunium/sdk/pkg/v1/proc/cgroup
  - doc: |-
      Package memlimit derives the Go runtime soft memory limit from the control
      group allowance governing this process, and installs it.

      GOMAXPROCS has been cgroup-aware since Go 1.25; the memory limit never was. A
      process in a 512 MiB container grows its heap past the cap and is SIGKILLed by
      the kernel instead of being pushed into a more aggressive GC cycle. One call at
      start-up converts that kill into collector pressure.

      It is the thin public facade over internal/service/proc/memlimit: the types are
      aliases of the core proc value types and the function delegates straight to the
      service implementation.

      # Usage

      Apply it once, as early as possible, before the heap has grown:

      	import (
      		"github.com/kitsunium/sdk/pkg/v1/proc/memlimit"
      	)

      	func main() {
      		applied := memlimit.Apply()
      		if applied.Applied() {
      			// applied.Limit bytes, derived from applied.Allowance.
      		}
      	}

      Apply never fails and never panics: every outcome is a value. A caller that
      only wants to know whether it acted reads Applied; one that wants to log WHY it
      did not reads Source, which distinguishes an operator-set GOMEMLIMIT from an
      uncapped host from a cap too tight to honour.

      # What the limit covers

      The limit is SOFT and covers all memory mapped, managed and not released by the
      Go runtime — the heap, goroutine stacks, runtime metadata. It excludes memory
      the runtime does not manage: the binary image, C allocations, syscall.Mmap
      mappings, and kernel memory held on the process's behalf. Subprocesses are
      outside it entirely. Ninety percent of the cgroup allowance is handed to the
      runtime and the remainder covers those, so this reduces OOM pressure rather
      than eliminating it.

      # Which cap is the allowance

      The tightest on the way up. On cgroup v2 the allowance is the minimum of
      memory.max and memory.high over the process's own cgroup and every ancestor:
      the kernel reclaims and slows a group above memory.high long before memory.max
      kills it, so the throttle is the working cap. The result's Bound says which of
      the two file kinds set it (MemoryBoundHigh or MemoryBoundMax). cgroup v1 has no
      such file — memory.soft_limit_in_bytes is a reclaim hint — and
      memory.limit_in_bytes alone binds there.

      # Relation to cgroup and rlimit

      The three are distinct directions on one subject. cgroup WRITES a control group
      to bound a child process. rlimit applies a setrlimit(2) ceiling the kernel
      enforces by failing allocations. memlimit READS the cgroup cap already bounding
      THIS process and tunes the Go collector to live inside it — nothing is enforced,
      the collector simply works harder as the heap approaches the limit.

      # Platform notes

      Control groups are a Linux facility. Off Linux no limit file is readable, so
      Apply reports MemorySourceUnconstrained and leaves the runtime default in
      place; no call fails and no build tag is needed.
    facade:
      - const:
          - doc: |-
              MemorySourceOperator reports that GOMEMLIMIT carried a non-empty value, which
              the runtime has already applied. It re-exports the core enum value so consumers
              qualify it as memlimit.MemorySourceOperator.
            name: MemorySourceOperator
            reexport: coreproc.MemorySourceOperator
            type: Source
            typed: true
            value: "1"
      - const:
          - doc: |-
              MemorySourceUnconstrained reports that no control group governing this process
              declares a memory cap.
            name: MemorySourceUnconstrained
            reexport: coreproc.MemorySourceUnconstrained
            type: Source
            typed: true
            value: "2"
      - const:
          - doc: |-
              MemorySourceBelowFloor reports that a cap was found but the limit derived from
              it fell under the usable floor and was discarded.
            name: MemorySourceBelowFloor
            reexport: coreproc.MemorySourceBelowFloor
            type: Source
            typed: true
            value: "3"
      - const:
          - doc: |-
              MemorySourceCgroup reports the one outcome that yields a limit: a real cap was
              read from the control-group hierarchy and the derived value was applied.
            name: MemorySourceCgroup
            reexport: coreproc.MemorySourceCgroup
            type: Source
            typed: true
            value: "4"
      - const:
          - doc: |-
              MemoryBoundHigh reports that a memory.high file — the kernel's throttle —
              bound the derivation. It re-exports the core enum value.
            name: MemoryBoundHigh
            reexport: coreproc.MemoryBoundHigh
            type: Bound
            typed: true
            value: "1"
      - const:
          - doc: |-
              MemoryBoundMax reports that the hard cap — memory.max, or cgroup v1's
              memory.limit_in_bytes — bound the derivation. It re-exports the core enum
              value.
            name: MemoryBoundMax
            reexport: coreproc.MemoryBoundMax
            type: Bound
            typed: true
            value: "2"
      - alias:
          - doc: |-
              Bound names the control-group file that set a derivation's allowance. It
              aliases the core proc type.
            name: Bound
            target: coreproc.MemoryBound
      - alias:
          - doc: Source names what decided the soft memory limit. It aliases the core proc type.
            name: Source
            target: coreproc.MemorySource
      - alias:
          - doc: |-
              Limit is an immutable record of one derivation: the allowance read, the limit
              derived, and the source that decided it. It aliases the core proc type.
            name: Limit
            target: coreproc.MemoryLimitValue
      - func:
          doc: |-
            Apply derives the Go soft memory limit from the tightest control-group cap
            governing this process and installs it, returning what it read, what it
            derived, and what decided the outcome.

            It stands aside — leaving the runtime default in place — when GOMEMLIMIT is
            already set, when no cgroup declares a cap, and when the derived limit is too
            small to be useful. Those three are told apart by Limit.Source.
          forward: svcmemlimit.Apply
          name: Apply
          out:
            - type: Limit
      - alias:
          - doc: |-
              Config tunes a derivation: the share of the allowance handed to the runtime,
              the floor, and the GC percent installed with the limit. Its zero value is
              Apply's. It aliases the service value.
            name: Config
            target: svcmemlimit.ConfigValue
      - func:
          doc: |-
            ApplyWith is Apply with the caller's Config. It returns an error carrying
            MEMLIMIT_MISCONFIGURED, and installs nothing, for a headroom outside (0, 100]
            percent or a negative floor.
          forward: svcmemlimit.ApplyWith
          in:
            - name: cfg
              type: Config
          name: ApplyWith
          out:
            - type: Limit
            - type: error
      - func:
          doc: |-
            Watch applies the limit as ApplyWith does, then re-derives it every period on
            clk until ctx ends, installing and reporting it again only when it changed —
            a resize of the control group under the running process. A period under a
            second is clamped to a second; a lifted cap puts the runtime's default back.
            It blocks until ctx ends.
          forward: svcmemlimit.Watch
          in:
            - name: ctx
              type: context.Context
            - name: clk
              type: clock.Timed
            - name: every
              type: time.Duration
            - name: cfg
              type: Config
            - name: onChange
              type: func(Limit)
          name: Watch
          out:
            - type: error
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      svcmemlimit: github.com/kitsunium/sdk/internal/service/proc/memlimit
