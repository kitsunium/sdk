      - name: ResourceCPU
        type: Resource
        value: "5"
      - name: ResourceFSize
        type: Resource
        value: "6"
      - name: ResourceData
        type: Resource
        value: "7"
      - name: ResourceStack
        type: Resource
        value: "8"
      - name: ResourceMemLock
        type: Resource
        value: "9"
      - name: StdioInherit
        type: StdioMode
        value: "0"
      - name: StdioNull
        type: StdioMode
