    functions:
      - doc: |-
          MustStart is like [Start] but panics with the typed error when the spawn fails
          — UnsupportedPlatform off Unix/Windows, InvalidSpec, RlimitFailed, … It is the
          idiomatic Go MustX opt-in (like [regexp.MustCompile]) for a consumer that
          chooses crash-on-failure at its own startup; the SDK itself never panics, and
          [Start] is the non-panicking form for normal use. The panic value is the typed
          error, so a top-level recover() can classify it via errs.CodeOf / HasCode.
        in:
          - name: ctx
            type: context.Context
          - name: spec
            type: Spec
        name: MustStart
        out:
          - type: Process
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      debug: runtime/debug
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcbuild: github.com/kitsunium/sdk/internal/service/proc/buildinfo
      svcexec: github.com/kitsunium/sdk/internal/service/proc/exec
      svcself: github.com/kitsunium/sdk/internal/service/proc/self
    path: github.com/kitsunium/sdk/pkg/v1/proc/process
  - doc: |-
      Package reaper is the PID1 / subreaper zombie-collector facade.

      A process that becomes the parent of orphaned descendants — an init (pid 1)
      in a container, or any supervisor that calls [SetChildSubreaper] — must reap
      the children that reparent to it, or they accumulate as zombies that exhaust
      the system's pid space. This package wraps the kernel mechanics (a SIGCHLD
      handler driving a non-blocking waitpid loop, plus prctl(PR_SET_CHILD_SUBREAPER))
      behind a tiny, portable surface.

      	r := reaper.New()
      	r.Start()          // background: reap children as they exit
      	defer r.Stop()     // final drain; no zombie outlives shutdown

      	// A non-init supervisor opts in to collecting orphaned grandchildren:
      	if !reaper.IsPID1() {
      		if err := reaper.SetChildSubreaper(); err != nil {
      			// degrade: orphans will reparent to pid 1 instead
      		}
      	}

      # Semantics

      [Reaper].Start installs an [os/signal] SIGCHLD handler and, on each signal,
      loops syscall.Wait4 with WNOHANG until it drains every reapable child. Start is
      idempotent. [Reaper].Stop performs one final drain and waits for the loop's
      goroutine to exit, so a Start/Stop cycle leaks neither zombies nor goroutines
      and may be repeated. [Reaper].ReapOnce runs a single non-blocking sweep and is
      safe to call concurrently with the loop — each child's exit is observed
      exactly once across whoever sweeps.

      # Children spawned through pkg/v1/proc/process

      A sweep collects EVERY exited child, including one a
      [github.com/kitsunium/sdk/pkg/v1/proc/process.Process] is waiting for. Its exit
      status is not lost: the sweep hands it to that Process, whose Wait reports
      the child's own exit code whichever of the two collected it. A child spawned
      any other way — os/exec, syscall.ForkExec, a C library — has no such claim, so
      a running reaper still takes its status and its own wait fails with ECHILD.
      Spawn what you wait for through pkg/v1/proc/process in a process that runs the
      reaper.

      ECHILD ("no children") is treated as a clean end of a sweep, not an error; any
      other wait error surfaces as the typed sentinel [ReapFailed].

      # Platform notes

      The real implementation is Unix-only. On platforms without SIGCHLD/waitpid
      (e.g. Windows), [New] returns a no-op reaper (Start/Stop do nothing, ReapOnce
      returns 0) and [SetChildSubreaper] returns [UnsupportedPlatform]. On illumos
      and Solaris the Go runtime forks every child with FORK_NOSIGCHLD, so the exit
      of a child this process spawned posts no SIGCHLD there; the loop also sweeps
      once a second on those two, which keeps "reap children as they exit" true. Code that
      links this package therefore builds and runs everywhere; only the behaviour
      degrades. [SetChildSubreaper] requires no privilege but is a per-process
      Linux capability; where the prctl is unavailable it returns a typed error
      rather than panicking.
    facade:
      - alias:
          - doc: |-
              Reaper collects terminated child processes so they do not linger as zombies —
              the core duty of any PID1 or subreaper. It is an alias of the core port; the
              concrete value is platform-selected by [New].
            name: Reaper
            target: coreproc.Reaper
      - alias:
          - doc: |-
              Option configures a [Reaper] returned by [New]. It is an alias of the service
              option type so callers compose options without importing internal packages.
            name: Option
            target: svc.Option
      - doc: |-
          The exported sentinels re-export the central proc error vars so callers match
          reaper failures without importing internal packages. Match with errs.HasCode
          and [github.com/kitsunium/sdk/pkg/v1/errs].
        var:
          - doc: |-
              ReapFailed is returned by a sweep when wait4 fails with an error other
              than the benign ECHILD ("no children") condition.
            name: ReapFailed
            reexport: coreproc.ReapFailed
            type: "*errs.Error"
          - doc: |-
              SubreaperFailed is returned by [SetChildSubreaper] when
              prctl(PR_SET_CHILD_SUBREAPER) fails to arm subreaper mode.
            name: SubreaperFailed
            reexport: coreproc.SubreaperFailed
            type: "*errs.Error"
          - doc: |-
              UnsupportedPlatform is returned by [SetChildSubreaper] on platforms
              without a prctl(PR_SET_CHILD_SUBREAPER) equivalent (e.g. Windows).
            name: UnsupportedPlatform
            reexport: coreproc.UnsupportedPlatform
            type: "*errs.Error"
      - func:
          doc: |-
            WithOnReap registers fn as a post-sweep observer receiving the number of
            children reaped in each sweep (including zero). fn must not block. On illumos
            and Solaris the loop also sweeps once a second, so there an idle reaper calls
            fn with zero once a second.
          forward: svc.WithOnReap
          in:
            - name: fn
              type: func(int)
          name: WithOnReap
          out:
            - type: Option
      - alias:
          - doc: |-
              ExitEvent is one child a sweep collected — its pid, its exit and whether a
              Process owned it. It aliases the service value.
            name: ExitEvent
            target: svc.ExitEvent
      - func:
          doc: |-
            WithOnExit registers fn as an observer of every child a sweep collects, an
            orphan included: the one record of how a re-parented descendant ended. fn
            runs under the sweep lock and must not block; nothing is stored.
          forward: svc.WithOnExit
          in:
            - name: fn
              type: func(ExitEvent)
          name: WithOnExit
          out:
            - type: Option
      - func:
          doc: |-
            New returns a [Reaper] configured by opts. On Unix it is a SIGCHLD-driven
            waitpid loop; elsewhere it is a no-op. The reaper starts idle — call Start.
          forward: svc.New
          in:
            - name: opts
              type: Option
          name: New
          out:
            - type: Reaper
          variadic: true
      - func:
          doc: |-
            SetChildSubreaper marks the calling process as a child subreaper so orphaned
            descendants reparent to it rather than to PID1. It returns [SubreaperFailed]
            on a prctl error and [UnsupportedPlatform] off Unix.
          forward: svc.SetChildSubreaper
          name: SetChildSubreaper
          out:
            - type: error
      - func:
          doc: |-
            IsPID1 reports whether the current process is the init process (pid 1). It is
            false on platforms where the convention does not apply.
          forward: svc.IsPID1
          name: IsPID1
          out:
            - type: bool
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svc: github.com/kitsunium/sdk/internal/service/proc/reaper
    path: github.com/kitsunium/sdk/pkg/v1/proc/reaper
  - doc: |-
      Package rlimit applies per-process resource ceilings via setrlimit(2) /
      prlimit64(2).

      It is the thin public facade over internal/service/proc/rlimit: the types are
      aliases of the core proc value types and the functions delegate straight to
      the service implementation. Resources are named abstractly (Resource) and
      mapped to the platform RLIMIT_* constant inside the service layer, so calling
      code stays portable; on a non-Linux host every call returns the typed
      UnsupportedPlatform error rather than acting.

      # Usage

      Lower the open-file ceiling of the current process to 1024 soft / 4096 hard:

      	import (
      		"github.com/kitsunium/sdk/pkg/v1/proc/rlimit"
      	)

      	err := rlimit.Apply(0, map[rlimit.Resource]rlimit.Limit{
      		rlimit.ResourceNoFile: {Soft: 1024, Hard: 4096},
      	})
      	if err != nil {
      		// inspect with errs.HasCode(err, ...) — RlimitFailed / UnknownResource.
      	}

      A pid of 0 targets the calling process via setrlimit(2). Any other pid targets
      that process via prlimit64(2), which requires the CAP_SYS_RESOURCE capability;
      without it the call returns RlimitFailed wrapping EPERM.

      # Spec integration

      Go's os/exec SysProcAttr carries no rlimit field. process.Start applies a
      Spec.Rlimits set to the child it spawns via a re-exec trampoline; this package
      is the standalone primitive for the other cases: apply limits from the child
      after fork (a pid-0 Apply in the child) or, when supervising, apply them to the
      spawned pid via prlimit64. PrepareSysProcAttr validates a limit set without any
      syscall — call it at Spec-construction time to fail fast on a Resource this
      platform cannot honour, before a process is ever spawned.

      # Platform notes

      Only Linux is supported. RLIMIT_NPROC and RLIMIT_MEMLOCK are absent from Go's
      syscall package and are restated from the kernel generic ABI inside the
      service layer. Off Linux, Apply and PrepareSysProcAttr return
      UnsupportedPlatform.
    facade:
      - const:
          - doc: LimitInfinity is the soft/hard value meaning "no limit" (RLIM_INFINITY).
            name: LimitInfinity
            reexport: coreproc.LimitInfinity
            type: uint64
            typed: true
            value: "18446744073709551615"
      - const:
          - doc: |-
              ResourceNoFile limits the highest open file descriptor (RLIMIT_NOFILE). It
              re-exports the core enum value so consumers qualify it as rlimit.ResourceNoFile.
            name: ResourceNoFile
            reexport: coreproc.ResourceNoFile
            type: Resource
            typed: true
            value: "1"
      - const:
          - doc: ResourceNProc limits the number of processes for the real uid (RLIMIT_NPROC).
            name: ResourceNProc
            reexport: coreproc.ResourceNProc
            type: Resource
            typed: true
            value: "2"
      - const:
          - doc: ResourceCore limits the core-dump size in bytes (RLIMIT_CORE).
            name: ResourceCore
            reexport: coreproc.ResourceCore
            type: Resource
            typed: true
            value: "3"
      - const:
          - doc: ResourceAS limits the process virtual address-space size (RLIMIT_AS).
            name: ResourceAS
            reexport: coreproc.ResourceAS
            type: Resource
            typed: true
            value: "4"
      - const:
          - doc: ResourceCPU limits CPU time in seconds (RLIMIT_CPU).
            name: ResourceCPU
            reexport: coreproc.ResourceCPU
            type: Resource
            typed: true
            value: "5"
      - const:
          - doc: ResourceFSize limits the largest file the process may create (RLIMIT_FSIZE).
            name: ResourceFSize
            reexport: coreproc.ResourceFSize
            type: Resource
            typed: true
            value: "6"
      - const:
          - doc: ResourceData limits the process data-segment size (RLIMIT_DATA).
            name: ResourceData
            reexport: coreproc.ResourceData
            type: Resource
            typed: true
            value: "7"
      - const:
          - doc: ResourceStack limits the process stack size (RLIMIT_STACK).
            name: ResourceStack
            reexport: coreproc.ResourceStack
            type: Resource
            typed: true
            value: "8"
      - const:
          - doc: ResourceMemLock limits bytes that may be locked into RAM (RLIMIT_MEMLOCK).
            name: ResourceMemLock
            reexport: coreproc.ResourceMemLock
            type: Resource
            typed: true
            value: "9"
      - alias:
          - doc: |-
              Resource is the abstract, platform-portable resource enum mapped to a
              RLIMIT_* constant by the service layer. It aliases the core proc type.
            name: Resource
            target: coreproc.Resource
      - alias:
          - doc: |-
              Limit is an immutable soft/hard setrlimit(2) pair. It aliases the core proc
              LimitValue type.
            name: Limit
            target: coreproc.LimitValue
      - func:
          doc: |-
            Apply sets the soft/hard ceilings in limits on the process identified by pid.
            A pid of 0 targets the calling process; any other pid targets that process via
            prlimit64(2) and needs CAP_SYS_RESOURCE. It returns UnknownResource for an
            unmapped resource, RlimitFailed on a syscall failure, and UnsupportedPlatform
            off Linux.
          forward: svcrlimit.Apply
          in:
            - name: pid
              type: int
            - name: limits
              type: map[Resource]Limit
          name: Apply
          out:
            - type: error
      - func:
          doc: |-
            PrepareSysProcAttr validates limits without issuing any syscall and reports
            whether they can be applied on this platform, returning the same typed errors
            Apply would (UnknownResource / UnsupportedPlatform). Use it to fail fast at
            Spec-construction time; Go's SysProcAttr has no rlimit field, so the actual
            application happens post-fork via Apply.
          forward: svcrlimit.PrepareSysProcAttr
          in:
            - name: limits
              type: map[Resource]Limit
          name: PrepareSysProcAttr
          out:
            - type: error
      - func:
          doc: |-
            KeepRaisedNoFile makes every child this process spawns from now on inherit
            its raised open-file soft limit, instead of the original one the Go runtime
            puts back in each child it forks, and returns the limit in force. It acts once
            per process. It returns RlimitFailed on a syscall failure and
            UnsupportedPlatform off Unix.
          forward: svcrlimit.KeepRaisedNoFile
          name: KeepRaisedNoFile
          out:
            - name: kept
              type: Limit
            - name: err
              type: error
      - func:
          doc: |-
            Get reads the soft/hard ceiling of r for pid (0 is the caller): getrlimit for
            the caller, prlimit64 for another pid on Linux, UnsupportedPlatform for
            another pid elsewhere.
          forward: svcrlimit.Get
          in:
            - name: pid
              type: int
            - name: r
              type: Resource
          name: Get
          out:
            - type: Limit
            - type: error
      - func:
          doc: |-
            OpenFiles counts the caller's open descriptors (HANDLES on Windows), to watch
            against Get(0, ResourceNoFile). UnsupportedPlatform on OpenBSD, NetBSD and
            DragonFly.
          forward: svcrlimit.OpenFiles
          name: OpenFiles
          out:
            - type: int
            - type: error
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      svcrlimit: github.com/kitsunium/sdk/internal/service/proc/rlimit
    path: github.com/kitsunium/sdk/pkg/v1/proc/rlimit
  - doc: |-
      Package signal is the typed signal toolbox: parse, subscribe, and forward OS
      signals through one ergonomic surface.

      It is a thin facade over the SDK process-supervision domain. Signals are typed
      values ([Signal]) that round-trip through their canonical name, [Notify]
      subscribes to a set of them on a leak-free channel, and [Relay] forwards a
      stream of received signals to another process or process group.

      	// Translate a graceful-shutdown request and act on it.
      	term, _ := signal.Parse("SIGTERM")         // typed value
      	intr, _ := signal.Parse("SIGINT")
      	ch, stop := signal.Notify(term, intr)
      	defer stop()                               // leak-free teardown
      	<-ch                                       // block until a signal arrives

      	// Forward every signal we receive down to a child process group.
      	src, stop := signal.Notify(term)
      	defer stop()
      	go signal.Relay(src, signal.Target(-childPGID)) // negative ⇒ process group

      # Notify semantics

      [Notify] registers an os/signal subscription and runs a translation goroutine
      that converts each delivery to a typed [Signal]. The returned channel is
      buffered (one slot per subscribed signal, floor of one) so a burst is not
      dropped while the reader is busy. The returned stop function detaches the
      subscription, ends the goroutine, and closes the channel; it is idempotent and
      leaves no goroutine or registration behind.

      # Relay semantics

      [Relay] reads from the source channel and delivers each signal to the
      [Target] — via kill(2) on Unix. A positive [Target] is a pid; a [Target] below
      -1 addresses the process group whose id is its absolute value. Relay returns
      when the source channel closes (nil) or when a delivery fails (a typed
      RELAY_FAILED error). The reserved targets 0 and -1 are refused on every
      platform before anything is delivered.

      # Platform notes

      Parse, String, and Notify are portable. Relay has a native backend on Unix
      (kill(2)) and on Windows, which has no kill(2): a pid target is terminated
      with TerminateProcess, and a process-group target receives a console control
      event: CTRL_BREAK, SIGINT included, since Windows delivers no CTRL_C to one
      group. On the remaining platforms it
      returns the typed UNSUPPORTED_PLATFORM sentinel rather than acting, so code
      compiles and degrades gracefully everywhere.
    facade:
      - alias:
          - doc: |-
              Signal is a typed, platform-portable OS signal. It aliases the domain type, so
              a value parsed here interoperates with the rest of the SDK process domain.
            name: Signal
            target: coreproc.Signal
      - alias:
          - doc: |-
              Target names the recipient of a relayed signal: a positive value is a pid; a
              value below -1 addresses the process group whose id is its absolute value.
            name: Target
            target: svcsignal.Target
      - func:
          doc: |-
            Parse resolves a signal from its name or number — the canonical "SIGTERM", the
            bare "TERM", or the numeric "15", all case-insensitive, and on Linux and
            FreeBSD the realtime "SIGRTMIN+n" / "SIGRTMAX-n" — returning a typed
            UNKNOWN_SIGNAL error for anything the platform does not define.
          forward: coreproc.Parse
          in:
            - name: name
              type: string
          name: Parse
          out:
            - name: sig
              type: Signal
            - name: err
              type: error
      - func:
          doc: |-
            Notify subscribes to sigs and returns a receive-only channel of typed Signals
            plus an idempotent, leak-free stop function. Each delivery is translated to a
            typed Signal; the channel is buffered so a burst is not dropped, and stop
            detaches the subscription and closes the channel.
          forward: svcsignal.Notify
          in:
            - name: sigs
              type: Signal
          name: Notify
          out:
            - name: ch
              type: <-chan Signal
            - name: stop
              type: func()
          variadic: true
      - func:
          doc: |-
            Relay reads signals from src and forwards each to target until src closes —
            via kill(2) on Unix, via TerminateProcess or a console control event on
            Windows. A positive target is a pid; a target below -1 addresses the process
            group whose id is -target. It returns nil on a clean drain and a typed
            RELAY_FAILED error on the first delivery failure (UNSUPPORTED_PLATFORM on a
            platform that is neither Unix nor Windows).
          forward: svcsignal.Relay
          in:
            - name: src
              type: <-chan Signal
            - name: target
              type: Target
          name: Relay
          out:
            - type: error
      - func:
          doc: |-
            SendValue queues sig with value to the process target (rt_sigqueueinfo(2) on
            Linux, sigqueue(2) on FreeBSD): a realtime signal queues instead of
            coalescing, and a C receiver reads the value from si_value — a Go one cannot.
            It returns SIGNAL_FAILED wrapping the errno (ESRCH for a reaped pid), and
            UNSUPPORTED_PLATFORM elsewhere.
          forward: svcsignal.SendValue
          in:
            - name: target
              type: Target
            - name: sig
              type: Signal
            - name: value
              type: int
          name: SendValue
          out:
            - type: error
      - alias:
          - doc: |-
              Cause is the cause a NotifyContext context is cancelled with: the signal
              that arrived. It aliases the service value.
            name: Cause
            target: svcsignal.ReceivedError
      - alias:
          - doc: |-
              Escalation is the policy Escalate applies: OnFirst, OnRepeat and the
              Window between them. It aliases the service value.
            name: Escalation
            target: svcsignal.EscalationValue
      - func:
          doc: |-
            NotifyContext returns a copy of parent cancelled when one of sigs arrives,
            with a Cause naming it — os/signal's NotifyContext for the typed Signal.
            stop unsubscribes and ends the bridge; it is idempotent.
          forward: svcsignal.NotifyContext
          in:
            - name: parent
              type: context.Context
            - name: sigs
              type: Signal
          name: NotifyContext
          out:
            - name: ctx
              type: context.Context
            - name: stop
              type: func()
          variadic: true
      - func:
          doc: |-
            CauseSignal reports the signal a NotifyContext context was cancelled by.
          forward: svcsignal.CauseSignal
          in:
            - name: ctx
              type: context.Context
          name: CauseSignal
          out:
            - name: sig
              type: Signal
            - name: ok
              type: bool
      - func:
          doc: |-
            Escalate runs policy.OnFirst at a delivery of one of sigs and policy.OnRepeat
            once at a second delivery within policy.Window on clk — zero meaning any
            later one — then stops relaying: the "second Ctrl-C stops at once"
            convention. stop is idempotent.
          forward: svcsignal.Escalate
          in:
            - name: ctx
              type: context.Context
            - name: clk
              type: clock.Waiter
            - name: policy
              type: Escalation
            - name: sigs
              type: Signal
          name: Escalate
          out:
            - name: stop
              type: func()
          variadic: true
    imports:
      clock: github.com/kitsunium/sdk/internal/kernel/clock
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      svcsignal: github.com/kitsunium/sdk/internal/service/proc/signal
    path: github.com/kitsunium/sdk/pkg/v1/proc/signal
  - doc: |-
      Package listen is the public facade for systemd-style socket activation
      (sd_listen_fds(3)): a service recovers already-bound listening sockets handed
      to it by an activator, and an activator hands sockets to a child it spawns.

      It is the symmetric companion to pkg/v1/proc/systemd/notify (readiness) and is generic to
      any networked program: zero-downtime restarts, on-demand start, and inetd-style
      launching all rest on passing a bound socket to a fresh process so no
      connection is lost and no bind races.

      # Service side

      A socket-activated process recovers its inherited listeners:

      	lns, err := listen.Listeners(true) // unsetEnv: true so children don't re-inherit
      	if err != nil {
      		return err // UnsupportedPlatform off Unix; LISTEN_FAILED on a bad fd
      	}
      	for _, ln := range lns {
      		go serve(ln)
      	}

      Files returns the raw *os.File sockets, Listeners wraps the stream sockets as
      net.Listener, and WithNames groups them by their LISTEN_FDNAMES name (duplicate
      names allowed). All honour LISTEN_PID: fds addressed to a different process are
      ignored (an empty result, not an error).

      # Activator side

      Prepare is the symmetric half — it makes the protocol self-contained and
      testable without systemd. It appends each listener's socket to the child Spec's
      inherited files and sets LISTEN_FDS / LISTEN_FDNAMES so the child recovers them:

      	ln, _ := net.Listen("tcp", ":8080")
      	spec := process.Spec{Path: "/usr/bin/myservice"}
      	if err := listen.Prepare(&spec, map[string]net.Listener{"http": ln}); err != nil {
      		return err
      	}
      	p, err := process.Start(ctx, spec) // the child finds the socket at fd 3

      LISTEN_PID is intentionally omitted by Prepare: a pre-fork activator cannot know
      the child's pid, so the receiving side accepts an absent LISTEN_PID from a
      trusted parent while still validating a present one (the systemd-set case).

      # Platform

      Socket activation relies on Unix file-descriptor inheritance. Off Unix every
      function returns the typed UnsupportedPlatform sentinel; the package compiles
      on every GOOS.
    facade:
      - alias:
          - doc: |-
              Spec is the process spawn specification an activator augments via Prepare. It
              aliases the core port type, so the same value drives process.Start.
            name: Spec
            target: coreproc.Spec
      - func:
          doc: |-
            Files returns the inherited listening sockets (fd 3..3+LISTEN_FDS) as *os.File,
            honouring LISTEN_PID. When unsetEnv is true the activation environment is
            cleared so a grandchild does not re-inherit it. An empty or foreign activation
            set yields nil with no error; off Unix it returns UnsupportedPlatform. Each
            socket is close-on-exec, as sd_listen_fds(3) leaves it: a spawned child
            inherits one only when it is passed explicitly, through Prepare or ExtraFiles.
          forward: svclisten.Files
          in:
            - name: unsetEnv
              type: bool
          name: Files
          out:
            - name: files
              type: "[]*os.File"
            - name: err
              type: error
      - func:
          doc: |-
            Listeners returns the inherited stream sockets wrapped as net.Listener (the
            underlying *os.File is closed after the dup). Same gating and platform
            behaviour as Files.
          forward: svclisten.Listeners
          in:
            - name: unsetEnv
              type: bool
          name: Listeners
          out:
            - name: listeners
              type: "[]net.Listener"
            - name: err
              type: error
      - func:
          doc: |-
            WithNames returns the inherited sockets grouped by their LISTEN_FDNAMES name;
            duplicate names group several fds under one key.
          forward: svclisten.WithNames
          in:
            - name: unsetEnv
              type: bool
          name: WithNames
          out:
            - name: named
              type: map[string][]*os.File
            - name: err
              type: error
      - func:
          doc: |-
            Prepare (activator side) appends each named listener's socket to child as an
            inherited fd and sets LISTEN_FDS / LISTEN_FDNAMES in child.Env so the spawned
            process recovers them via Files/Listeners. Off Unix it returns
            UnsupportedPlatform.
          forward: svclisten.Prepare
          in:
            - name: child
              type: "*Spec"
            - name: named
              type: map[string]net.Listener
          name: Prepare
          out:
            - type: error
      - func:
          doc: |-
            PrepareFiles (activator side) hands files to child at fd 3 on, in order, with
            LISTEN_FDS, LISTEN_FDNAMES and LISTEN_PID set as Prepare sets them — never
            duplicating nor closing them, so a descriptor store hands the same ones to
            each restart. Off Unix it returns UnsupportedPlatform.
          forward: svclisten.PrepareFiles
          in:
            - name: child
              type: "*Spec"
            - name: files
              type: "[]NamedFile"
          name: PrepareFiles
          out:
            - type: error
      - func:
          doc: |-
            CheckName refuses with InvalidFDName a descriptor name LISTEN_FDNAMES cannot
            carry: longer than systemd's FDNAME_MAX, a byte that is not printable ASCII, or
            a ':'.
          forward: svclisten.CheckName
          in:
            - name: name
              type: string
          name: CheckName
          out:
            - type: error
      - alias:
          - doc: |-
              NamedFile is one descriptor PrepareFiles hands a child and its
              LISTEN_FDNAMES name. It aliases the service's type.
            name: NamedFile
            target: svclisten.NamedFileValue
      - const:
          - doc: CodeInvalidFDName is the code of InvalidFDName.
            name: CodeInvalidFDName
            reexport: coreproc.CodeInvalidFDName
            type: errs.Code
            typed: true
            value: "0x00_02_06_23"
      - var:
          - doc: |-
              InvalidFDName is returned for a descriptor name LISTEN_FDNAMES cannot carry.
            name: InvalidFDName
            reexport: coreproc.InvalidFDName
            type: "*errs.Error"
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svclisten: github.com/kitsunium/sdk/internal/service/proc/systemd/listen
    path: github.com/kitsunium/sdk/pkg/v1/proc/systemd/listen
  - doc: |-
      Package notify is the public facade for the systemd sd_notify(3)
      readiness/watchdog protocol.

      It has two sides. A supervised process (the notifier) tells its supervisor
      when it is ready, reloading, stopping, or alive; a supervisor (the listener)
      receives those datagrams with the sender's kernel-verified PID.

      # Notifier

      The notifier functions write a single AF_UNIX datagram to the socket named by
      the $NOTIFY_SOCKET environment variable. Per libsystemd, when $NOTIFY_SOCKET
      is unset every notifier call is a no-op that returns nil — an unsupervised
      binary stays silent rather than failing:

      	func main() {
      		// ... finish startup ...
      		if err := notify.Ready(); err != nil {
      			log.Fatal(err)
      		}
      		// optionally publish progress:
      		_ = notify.Status("accepting connections")
      		// if a watchdog is configured, ping within the interval:
      		if d, ok := notify.WatchdogInterval(); ok {
      			t := time.NewTicker(d / 2)
      			defer t.Stop()
      			for range t.C {
      				_ = notify.Watchdog()
      			}
      		}
      	}

      Notify sends an arbitrary state map; Ready, Reloading, Stopping, Status,
      Watchdog, and MainPID are shorthands for the common single-field datagrams.

      # Listener (supervisor)

      Listen creates a private datagram socket, enables SO_PASSCRED so the kernel
      stamps each datagram with the sender's verified PID, user and group, and
      returns the socket path to hand a child via NOTIFY_SOCKET (ListenFor gives the
      socket to the user a service runs as). Each Recv checks every assignment
      sd_notify(3) defines and hands over the descriptors the datagram carried
      (FDSTORE=1, BARRIER=1, MAINPIDFD=1), which the caller then owns:

      	l, path, err := notify.Listen()
      	if err != nil {
      		log.Fatal(err)
      	}
      	defer l.Close()
      	// ... spawn the child with NOTIFY_SOCKET=path in its environment ...
      	n, err := l.Recv()
      	if err != nil {
      		log.Fatal(err)
      	}
      	if n.Ready() {
      		log.Printf("child %d is ready", n.SenderPID)
      	}

      # Platform notes

      The notifier and WatchdogInterval are portable across every GOOS. The
      listener relies on SO_PASSCRED / SCM_CREDENTIALS, a Linux facility: on every
      other platform Listen returns the UNSUPPORTED_PLATFORM error and never panics.

      A $NOTIFY_SOCKET value beginning with '@' selects the abstract socket
      namespace; the '@' is replaced by a NUL byte before binding or connecting.
    facade:
      - alias:
          - doc: |-
              Listener is the supervisor side of the protocol: it owns the datagram socket a
              supervised child writes readiness to and yields one parsed, credential-verified
              Notification per Recv.
            name: Listener
            target: coreproc.Listener
      - alias:
          - doc: |-
              Notification is a parsed sd_notify datagram: the raw State field set plus the
              typed Status, MainPID, and kernel-verified SenderPID, SenderUID and
              SenderGID, the Descriptors it brought, with Ready/Reloading/Stopping/Watchdog
              lifecycle accessors.
            name: Notification
            target: coreproc.NotificationValue
      - alias:
          - doc: |-
              Descriptors are the descriptors one datagram brought — FDSTORE=1's, the
              BARRIER=1 one, the MAINPIDFD=1 pidfd, a pidfd on the sender —, the caller's
              to keep or close. It is an alias of the core port's DescriptorsValue.
            name: Descriptors
            target: coreproc.DescriptorsValue
      - func:
          doc: |-
            Notify sends an sd_notify datagram carrying the given NAME=value state to
            $NOTIFY_SOCKET, or is a no-op returning nil when $NOTIFY_SOCKET is unset.
          forward: svcnotify.Notify
          in:
            - name: state
              type: map[string]string
          name: Notify
          out:
            - type: error
      - func:
          doc: Ready notifies the supervisor that startup is complete (READY=1).
          forward: svcnotify.Ready
          name: Ready
          out:
            - type: error
      - func:
          doc: |-
            Reloading notifies the supervisor that a configuration reload has begun
            (RELOADING=1).
          forward: svcnotify.Reloading
          name: Reloading
          out:
            - type: error
      - func:
          doc: Stopping notifies the supervisor that shutdown has begun (STOPPING=1).
          forward: svcnotify.Stopping
          name: Stopping
          out:
            - type: error
      - func:
          doc: Status publishes a single-line free-text status (STATUS=msg).
          forward: svcnotify.Status
          in:
            - name: msg
              type: string
          name: Status
          out:
            - type: error
      - func:
          doc: Watchdog sends a watchdog keep-alive ping (WATCHDOG=1).
          forward: svcnotify.Watchdog
          name: Watchdog
          out:
            - type: error
      - func:
          doc: MainPID advertises the main process PID to the supervisor (MAINPID=pid).
          forward: svcnotify.MainPID
          in:
            - name: pid
              type: int
          name: MainPID
          out:
            - type: error
      - func:
          doc: |-
            Listen creates a supervisor-side sd_notify socket and returns the Listener plus
            the socketPath a child should be given via NOTIFY_SOCKET. Off Linux and
            FreeBSD it returns the UNSUPPORTED_PLATFORM error.
          forward: svcnotify.Listen
          name: Listen
          out:
            - name: l
              type: Listener
            - name: socketPath
              type: string
            - name: err
              type: error
      - func:
          doc: |-
            ListenFor is Listen for a service that runs as uid and gid: the socket's
            private directory and the socket belong to that user, so only it and root
            reach the socket. Off Linux and FreeBSD it returns the UNSUPPORTED_PLATFORM
            error.
          forward: svcnotify.ListenFor
          in:
            - name: uid
            - name: gid
              type: int
          name: ListenFor
          out:
            - name: l
              type: Listener
            - name: socketPath
              type: string
            - name: err
              type: error
      - func:
          doc: |-
            WatchdogInterval reports the watchdog ping interval the supervisor configured
            via $WATCHDOG_USEC; ok is false when the variable is unset, malformed or out
            of a time.Duration's range, or when $WATCHDOG_PID names another process.
            When ok is true, d is positive.
          forward: svcnotify.WatchdogInterval
          name: WatchdogInterval
          out:
            - name: d
              type: time.Duration
            - name: ok
              type: bool
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      svcnotify: github.com/kitsunium/sdk/internal/service/proc/systemd/notify
    path: github.com/kitsunium/sdk/pkg/v1/proc/systemd/notify
