apiVersion: kit.kitsunium/design/v2
domain: third-party/db/writer/clickhouse
packages:
  - codes:
      - const:
          - doc: |-
              CodeCHClientInitFailed identifies a failure to build the database/sql handle
              at Open time (nil/invalid table or an unresolvable credential provider).
              ExitCode defaults to 74 (EX_IOERR).
            name: CodeCHClientInitFailed
            note: "range: 0.3.33.0 - 0.3.33.255"
            value: "0x00_03_21_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeCHInsertFailed identifies a failed batch INSERT on the drainer goroutine.
              ExitCode defaults to 74 (EX_IOERR).
            name: CodeCHInsertFailed
            value: "0x00_03_21_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/third-party/db/writer/clickhouse
    sentinels:
      - var:
          - code: CodeCHClientInitFailed
            doc: |-
              ClientInitFailed wraps a failure to build the sql handle: an invalid table
              or an unresolvable credential provider.
            name: ClientInitFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/clickhouse: invalid table or credentials unresolvable"
            public: ClickHouse writer could not initialise its client
            reason: CLIENT_INIT_FAILED
          - code: CodeCHInsertFailed
            doc: InsertFailed wraps a failed batch INSERT.
            name: InsertFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/clickhouse: the multi-row INSERT returned an error"
            public: ClickHouse writer failed to insert a log batch
            reason: INSERT_FAILED
    variables:
      - name: Writer
        type: writer.Factory
