apiVersion: kit.kitsunium/design/v2
domain: third-party/db/writer/redis
packages:
  - codes:
      - const:
          - doc: |-
              CodeRedisClientInitFailed identifies a failure to build the Redis client
              at Open time (missing socket/stream or an unresolvable credential provider).
              ExitCode defaults to 74 (EX_IOERR).
            name: CodeRedisClientInitFailed
            note: "range: 0.3.34.0 - 0.3.34.255"
            value: "0x00_03_22_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeRedisXAddFailed identifies a failed pipelined XADD batch on the
              drainer goroutine. ExitCode defaults to 74 (EX_IOERR).
            name: CodeRedisXAddFailed
            value: "0x00_03_22_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/third-party/db/writer/redis
    sentinels:
      - var:
          - code: CodeRedisClientInitFailed
            doc: |-
              ClientInitFailed wraps a failure to build the client: a missing
              socket/stream or an unresolvable credential provider.
            name: ClientInitFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/redis: socket/stream missing or credentials unresolvable"
            public: Redis writer could not initialise its client
            reason: CLIENT_INIT_FAILED
          - code: CodeRedisXAddFailed
            doc: AddFailed wraps a failed pipelined XADD batch.
            name: AddFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/redis: the pipelined XADD returned an error"
            public: Redis writer failed to append a log batch
            reason: ADD_FAILED
    variables:
      - name: Writer
        type: writer.Factory
