apiVersion: kit.kitsunium/design/v2
domain: third-party/db/writer/mysql
packages:
  - codes:
      - const:
          - doc: |-
              CodeMySQLClientInitFailed identifies a failure to build the database/sql
              handle at Open time (nil credentials, an unresolvable credential provider, or
              a malformed DSN). ExitCode defaults to 74 (EX_IOERR).
            name: CodeMySQLClientInitFailed
            note: "range: 0.3.32.0 - 0.3.32.255"
            value: "0x00_03_20_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeMySQLInsertFailed identifies a failed batch INSERT on the drainer
              goroutine. ExitCode defaults to 74 (EX_IOERR).
            name: CodeMySQLInsertFailed
            value: "0x00_03_20_02"
        type: errs.Code
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      writer: github.com/kitsunium/sdk/internal/core/observe/logger/writer
    path: github.com/kitsunium/sdk/third-party/db/writer/mysql
    sentinels:
      - var:
          - code: CodeMySQLClientInitFailed
            doc: |-
              ClientInitFailed wraps a failure to build the sql handle: nil/invalid
              credentials or a sql.Open failure.
            name: ClientInitFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/mysql: credentials missing/unresolvable or sql.Open failed"
            public: MySQL writer could not initialise its client
            reason: CLIENT_INIT_FAILED
          - code: CodeMySQLInsertFailed
            doc: InsertFailed wraps a failed batch INSERT.
            name: InsertFailed
            options:
              - errs.WithExitCode(exitIOErr)
            private: "third-party/db/writer/mysql: the multi-row INSERT returned an error"
            public: MySQL writer failed to insert a log batch
            reason: INSERT_FAILED
    variables:
      - name: Writer
        type: writer.Factory
