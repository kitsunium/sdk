apiVersion: kit.kitsunium/design/v2
domain: third-party/transform
packages:
  - codes:
      - const:
          - doc: |-
              CodeZstdFailed identifies a failure inside the zstd codec during either a
              Compress or a Decompress operation — a malformed frame, a truncated stream,
              or a checksum mismatch. It is deliberately NOT the code a tripped output
              bound produces: see CodeDecompressionLimitExceeded.
            name: CodeZstdFailed
            note: "range: 0.3.63.0 - 0.3.63.255"
            value: "0x00_03_3F_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeS2Failed identifies a failure inside the s2 codec during either a
              Compress or a Decompress operation — a corrupt block header, a length header
              the payload does not honour, or an input larger than the block format can
              address.
            name: CodeS2Failed
            value: "0x00_03_3F_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecompressionLimitExceeded identifies a decompression refused because its
              output would exceed the compressor's configured ceiling — a decompression
              bomb, or a legitimate payload larger than this compressor was built for.

              It is a SEPARATE code from CodeZstdFailed / CodeS2Failed on purpose. "Someone
              sent us bytes we could not parse" and "someone sent us bytes engineered to
              exhaust this process" are different events for whoever reads the logs: the
              first is traffic, the second is an attack signature worth alerting on, and a
              shared code makes the second invisible inside the first.
            name: CodeDecompressionLimitExceeded
            value: "0x00_03_3F_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeLimitMisconfigured identifies a constructor call whose
              maxDecompressedBytes argument is not a positive byte count. The value is
              REFUSED rather than defaulted because its two natural readings — "no limit"
              and "refuse everything" — are opposites, and picking either on the caller's
              behalf silently grants or silently denies (ADR 0031 §refuse, ADR 0066 D4).
            name: CodeLimitMisconfigured
            value: "0x00_03_3F_04"
        type: errs.Code
    constants:
      - name: S2Algorithm
        type: coretransform.Algorithm
        value: "\"s2\""
      - name: DefaultMaxDecompressedBytes
        type: int64
        value: 64 << 20
      - name: ZstdAlgorithm
        type: coretransform.Algorithm
        value: "\"zstd\""
      - name: ZstdFastest
        type: ZstdLevel
        value: "1"
      - name: ZstdDefault
        type: ZstdLevel
        value: "3"
      - name: ZstdBetter
        type: ZstdLevel
        value: "7"
      - name: ZstdBest
        type: ZstdLevel
        value: "11"
    functions:
      - in:
          - name: maxDecompressedBytes
            type: int64
        name: NewS2Compressor
        out:
          - name: compressor
            type: "*S2Compressor"
          - name: err
            type: error
      - in:
          - name: level
            type: ZstdLevel
          - name: maxDecompressedBytes
            type: int64
        name: NewZstdCompressor
        out:
          - name: compressor
            type: "*ZstdCompressor"
          - name: err
            type: error
    imports:
      coretransform: github.com/kitsunium/sdk/internal/core/data/transform
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/third-party/transform
    sentinels:
      - var:
          - code: CodeZstdFailed
            doc: ZstdFailed wraps a failure from the zstd codec (Compress or Decompress).
            name: ZstdFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "third-party/transform: the zstd codec returned an error"
            public: zstd transform failed
            reason: ZSTD_FAILED
          - code: CodeS2Failed
            doc: S2Failed wraps a failure from the s2 codec (Compress or Decompress).
            name: S2Failed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "third-party/transform: the s2 codec returned an error"
            public: s2 transform failed
            reason: S2_FAILED
          - code: CodeDecompressionLimitExceeded
            doc: |-
              DecompressionLimitExceeded is returned when a decompression would produce
              more plaintext than the compressor's configured ceiling allows. No output
              is returned with it: the caller's dst is handed back at its original
              length, so a refused bomb never leaves a partial payload behind.
            name: DecompressionLimitExceeded
            options:
              - errs.WithExitCode(exitDataErr)
            private: "third-party/transform: the decompression-bomb ceiling refused this payload"
            public: Decompressed output would exceed the configured limit
            reason: DECOMPRESSION_LIMIT_EXCEEDED
          - code: CodeLimitMisconfigured
            doc: |-
              LimitMisconfigured is returned by NewZstdCompressor / NewS2Compressor for
              a non-positive maxDecompressedBytes. It is a construction-time refusal, so
              a compressor that would not bound its output never exists to be called.
            name: LimitMisconfigured
            private: "third-party/transform: a non-positive decompression ceiling is refused, never defaulted (ADR 0031)"
            public: maxDecompressedBytes must be a positive byte count
            reason: LIMIT_MISCONFIGURED
    types:
      - methods:
          - name: Algorithm
            out:
              - type: coretransform.Algorithm
            recv: pointer
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Compress
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Decompress
            out:
              - name: decoded
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
        name: S2Compressor
        struct:
          unexported: true
      - name: ZstdLevel
        underlying: int
      - methods:
          - name: Algorithm
            out:
              - type: coretransform.Algorithm
            recv: pointer
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Compress
            out:
              - name: encoded
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - in:
              - name: dst
              - name: src
                type: "[]byte"
            name: Decompress
            out:
              - name: decoded
                type: "[]byte"
              - name: err
                type: error
            recv: pointer
          - name: Close
            out:
              - type: error
            recv: pointer
        name: ZstdCompressor
        struct:
          unexported: true
    variables:
      - name: S2
        type: coretransform.Compressor
      - name: Zstd
        type: coretransform.Compressor
