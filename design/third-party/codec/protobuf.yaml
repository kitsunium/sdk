apiVersion: kit.kitsunium/design/v2
domain: third-party/codec/protobuf
packages:
  - codes:
      - const:
          - doc: |-
              CodeProtobufMarshalFailed identifies a Marshal failure — either the value is
              not a proto.Message (Protobuf is schema-bound) or google.golang.org/protobuf
              /proto.Marshal returned an error.
            name: CodeProtobufMarshalFailed
            note: "range: 0.3.38.0 - 0.3.38.255"
            value: "0x00_03_26_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeProtobufUnmarshalFailed identifies an Unmarshal failure — the target is
              not a proto.Message, or proto.Unmarshal rejected the wire bytes.
            name: CodeProtobufUnmarshalFailed
            value: "0x00_03_26_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeProtobufSizeExceeded identifies an Unmarshal input over the 10 MiB cap
              (CWE-400 defence before the decoder allocates).
            name: CodeProtobufSizeExceeded
            value: "0x00_03_26_03"
        type: errs.Code
    doc: |-
      Package protobuf wraps google.golang.org/protobuf as a codec.Codec
      implementation. It lives under third-party/codec/, in a module of its own
      (ADR 0157), and is OPT-IN: a consumer blank-imports it to register the
      "protobuf" Format — pkg/v1/data/codec does NOT pull it. The reason is the
      schema-bound contract, not dep weight: Protobuf only encodes proto.Message
      values, so it cannot honour the universal "every registered codec
      round-trips any Go struct" guarantee the default registry enforces. A
      non-message value surfaces PROTOBUF_MARSHAL_FAILED /
      PROTOBUF_UNMARSHAL_FAILED. Non-streaming (the wire format is length-unframed;
      framing is a caller concern); implements Appender. ADR 0023.

      Package protobuf — range 0.3.38.* (ADR 0023 third-party/codec/protobuf block).

      Package protobuf — declares the sentinel *errs.Error values for Protobuf.
    functions:
      - doc: New returns the Protobuf codec singleton.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/third-party/codec/protobuf
    sentinels:
      - var:
          - code: CodeProtobufMarshalFailed
            doc: MarshalFailed wraps a non-proto.Message value or a proto.Marshal failure.
            name: MarshalFailed
            private: "third-party/codec/protobuf: value is not a proto.Message or proto.Marshal returned an error"
            public: Protobuf encoding failed
            reason: PROTOBUF_MARSHAL_FAILED
          - code: CodeProtobufUnmarshalFailed
            doc: UnmarshalFailed wraps a non-proto.Message target or a proto.Unmarshal failure.
            name: UnmarshalFailed
            private: "third-party/codec/protobuf: target is not a proto.Message or proto.Unmarshal returned an error"
            public: Protobuf decoding failed
            reason: PROTOBUF_UNMARSHAL_FAILED
          - code: CodeProtobufSizeExceeded
            doc: SizeExceeded marks an Unmarshal input over the 10 MiB hard cap.
            name: SizeExceeded
            private: "third-party/codec/protobuf: len(data) exceeds maxProtobufBytes"
            public: Protobuf input exceeds size limit
            reason: PROTOBUF_SIZE_EXCEEDED
    variables:
      - doc: Codec is the registered Protobuf singleton.
        name: Codec
        type: codec.Codec
