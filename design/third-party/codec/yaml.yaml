apiVersion: kit.kitsunium/design/v2
domain: third-party/codec/yaml
packages:
  - codes:
      - const:
          - doc: |-
              CodeYAMLFullMarshalFailed identifies a failure encoding a value through
              gopkg.in/yaml.v3 (a MarshalYAML hook that failed, or a stream whose writer
              failed).
            name: CodeYAMLFullMarshalFailed
            note: "range: 0.3.77.0 - 0.3.77.255"
            value: "0x00_03_4D_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeYAMLFullUnmarshalFailed identifies a failure decoding through
              gopkg.in/yaml.v3: a syntax error, a value its target cannot hold, or an
              input over the 10 MiB cap.
            name: CodeYAMLFullUnmarshalFailed
            value: "0x00_03_4D_02"
        type: errs.Code
    constants:
      - doc: |-
          Format is the name this codec is registered under. It differs from the
          native codec's "yaml" because the registry refuses a second codec under one
          name, and because the two are not the same reader.
        name: Format
        type: string
        value: "\"yaml-full\""
    doc: |-
      Package yaml wraps gopkg.in/yaml.v3 as a codec.Codec implementation
      registered under the Format "yaml-full". It is the whole of YAML 1.2 as
      yaml.v3 reads it — anchors and aliases, tags, merge keys, complex keys,
      multi-document streams — for the program that needs a construct the SDK's
      own codec refuses by name.

      It is a module of its own under third-party/ (ADR 0157), NOT
      internal/service/data/codec, because the SDK's own "yaml" Format is a native,
      standard-library-only reader of a named subset (internal/service/data/codec/yaml)
      and the public module stays free of gopkg.in/yaml.v3. It is opt-in: a consumer blank-imports this package
      to register "yaml-full"; pkg/v1/data/codec does NOT pull it.

      It claims NO MIME type and NO file extension. ".yaml", ".yml" and
      application/yaml stay the native codec's, whatever else a program imports, so
      importing this package never changes what an extension lookup returns; a
      caller reaches the full reader by naming "yaml-full".

      Streaming is supported: yaml.v3 exposes Encoder/Decoder types that serialise
      a sequence of documents separated by `---` markers.

      Package yaml — range 0.3.77.* (third-party/codec/yaml block).

      Package yaml — adapts yaml.v3's *Decoder to codec.Decoder.

      Package yaml — adapts yaml.v3's *Encoder to codec.Encoder.

      Package yaml — declares the sentinel *errs.Error values for the full YAML codec.
    functions:
      - doc: New returns the full-YAML codec singleton.
        name: New
        out:
          - type: codec.Codec
    imports:
      codec: github.com/kitsunium/sdk/internal/core/data/codec
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/third-party/codec/yaml
    sentinels:
      - var:
          - code: CodeYAMLFullMarshalFailed
            doc: MarshalFailed marks a gopkg.in/yaml.v3 encode failure.
            name: MarshalFailed
            private: "third-party/codec/yaml: gopkg.in/yaml.v3 failed to encode the value"
            public: YAML encoding failed
            reason: YAML_FULL_MARSHAL_FAILED
          - code: CodeYAMLFullUnmarshalFailed
            doc: |-
              UnmarshalFailed marks a gopkg.in/yaml.v3 decode failure, or an input over
              the 10 MiB cap.
            name: UnmarshalFailed
            private: "third-party/codec/yaml: gopkg.in/yaml.v3 failed to decode the document, or the input exceeds maxYAMLBytes"
            public: YAML decoding failed
            reason: YAML_FULL_UNMARSHAL_FAILED
    variables:
      - doc: Codec is the registered full-YAML singleton.
        name: Codec
        type: codec.Codec
