  - of: wrapForFormat
    participants:
      - id: caller
        kind: actor
      - id: wrapForFormat
        kind: self
      - id: binary.LittleEndian.PutUint32
        kind: value
    steps:
      - bind: innerStr
        eval: string(inner)
      - switch:
          cases:
            - case: NDJSON
              do:
                - return: "[]stdjson.RawMessage{stdjson.RawMessage(inner)}, nil"
            - case: CSV
              do:
                - return: "[][]string{{csvPromotionHeader}, {innerStr}}, nil"
            - case: Form
              do:
                - return: "url.Values{formPromotionKey: []string{innerStr}}, nil"
            - case: PEM
              do:
                - return: "&stdpem.Block{Type: pemPromotionBlockType, Bytes: inner}, nil"
            - case: "\"flatbuffers\""
              do:
                - bind: out
                  eval: make([]byte, flatBuffersHeaderBytes+len(inner))
                - eval: binary.LittleEndian.PutUint32(out[:flatBuffersHeaderBytes], fbcodec.PromotionMagic)
                  to: binary.LittleEndian.PutUint32
                - eval: copy(out[flatBuffersHeaderBytes:], inner)
                - return: out, nil
            - case: "\"tlv\""
              do:
                - return: innerStr, nil
            - default: true
              do:
                - return: nil, promoteFailedFor(f, "no marshal strategy")
          "on": f
  - of: containerForFormat
    steps:
      - switch:
          cases:
            - case: NDJSON
              do:
                - bind: rows
                  eval: new([]stdjson.RawMessage)
                - return: rows, extractNDJSON(rows), nil
            - case: CSV
              do:
                - bind: table
                  eval: new([][]string)
                - return: table, extractCSV(table), nil
            - case: Form
              do:
                - bind: values
                  eval: new(url.Values)
                - return: values, extractForm(values), nil
            - case: PEM
              do:
                - bind: block
                  eval: new(*stdpem.Block)
                - return: block, extractPEM(block), nil
            - case: "\"flatbuffers\""
              do:
                - bind: raw
                  eval: new([]byte)
                - return: raw, extractFlatBuffers(raw), nil
            - case: "\"tlv\""
              do:
                - bind: s
                  eval: new(string)
                - return: s, extractTLV(s), nil
            - default: true
              do:
                - return: nil, nil, promoteFailedFor(f, "no unmarshal strategy")
          "on": f
  - of: extractNDJSON
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("empty ndjson promotion container")
                  when: len(*rows) == 0
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("ndjson promotion container holds more than one record")
                  when: len(*rows) != 1
              - return: (*rows)[0], nil
  - of: extractCSV
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("malformed csv promotion container")
                  when: "!isCSVPromotion(*table)"
              - return: "[]byte((*table)[1][0]), nil"
  - of: extractForm
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - bind: payload
                eval: (*values)[formPromotionKey]
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("malformed form promotion container")
                  when: len(*values) != 1 || len(payload) != 1
              - return: "[]byte(payload[0]), nil"
  - of: isCSVPromotion
    steps:
      - return: |-
          len(table) == csvPromotionRowCount &&
          		len(table[0]) == 1 && table[0][0] == csvPromotionHeader &&
          		len(table[1]) == 1
  - of: extractPEM
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("nil pem promotion block")
                  when: "*block == nil"
              - return: (*block).Bytes, nil
  - of: extractFlatBuffers
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - opt:
                  do:
                    - return: nil, promoteContainerFailed("flatbuffers promotion payload too short")
                  when: len(*raw) < flatBuffersHeaderBytes
              - return: (*raw)[flatBuffersHeaderBytes:], nil
  - of: extractTLV
    steps:
      - return:
          closure:
            results: "[]byte, error"
            steps:
              - return: "[]byte(*s), nil"
  - of: promoteFailedFor
    participants:
      - id: caller
        kind: actor
      - id: promoteFailedFor
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(nil, kerrs.WrapParams{
          		Code:    CodePromoteFailed,
          		Reason:  "PROMOTE_FAILED",
          		Public:  "codec promotion failed",
          		Private: "pkg/v1/data/codec: " + detail + " for format " + string(f),
          	})
        to: kerrs
  - of: promoteJSONFailed
    participants:
      - id: caller
        kind: actor
      - id: promoteJSONFailed
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:    CodePromoteFailed,
          		Reason:  "PROMOTE_FAILED",
          		Public:  "codec promotion failed",
          		Private: "pkg/v1/data/codec: " + detail + " for format " + string(f),
          	})
        to: kerrs
  - of: promoteContainerFailed
    participants:
      - id: caller
        kind: actor
      - id: promoteContainerFailed
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(nil, kerrs.WrapParams{
          		Code:    CodePromoteFailed,
          		Reason:  "PROMOTE_FAILED",
          		Public:  "codec promotion container malformed",
          		Private: "pkg/v1/data/codec: " + detail,
          	})
        to: kerrs
  - of: hasPromotionStrategy
    steps:
      - switch:
          cases:
            - case: NDJSON, CSV, Form, PEM, "flatbuffers", "tlv"
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": f
  - of: isValueShapeMismatch
    participants:
      - id: caller
        kind: actor
      - id: isValueShapeMismatch
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: "false"
          when: err == nil
      - bind: reason, ok
        eval: kerrs.ReasonOf(err)
        to: kerrs
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - switch:
          cases:
            - case: "\"VALUE_INVALID\", \"FLATBUFFERS_BAD_TYPE\", \"FLATBUFFERS_BAD_TARGET\""
              do:
                - return: "true"
            - case: "\"UNMARSHAL_FAILED\""
              do:
                - return: f != NDJSON
          "on": reason
      - return: "false"
