          do:
            - return: cmp.Or(uerr)
              to: cmp
          init:
            bind: uerr
            eval: c.Unmarshal(data, containerPtr)
            to: c.Unmarshal
          when: uerr != nil
      - bind: inner, eerr
        eval: extract()
      - opt:
          do:
            - return: cmp.Or(eerr)
              to: cmp
          when: eerr != nil
      - opt:
          do:
            - return: promoteJSONFailed(f, jerr, "encoding/json could not decode the payload into the target")
              to: promoteJSONFailed
          init:
            bind: jerr
            eval: stdjson.Unmarshal(inner, v)
            to: stdjson
          when: jerr != nil
