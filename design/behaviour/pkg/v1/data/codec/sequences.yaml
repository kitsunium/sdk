    participants:
      - id: caller
        kind: actor
      - id: promoteUnmarshal
        kind: self
      - id: containerForFormat
        kind: internal
      - id: cmp
        kind: stdlib
      - id: c.Unmarshal
        kind: value
      - id: stdjson
        kind: stdlib
      - id: promoteJSONFailed
        kind: internal
