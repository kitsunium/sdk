  binary: encoding/binary
  cmp: cmp
  corecodec: github.com/kitsunium/sdk/internal/core/data/codec
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fbcodec: github.com/kitsunium/sdk/internal/service/data/codec/flatbuffers
  io: io
  kerrs: github.com/kitsunium/sdk/internal/kernel/errs
  stdjson: encoding/json
  stdpem: encoding/pem
  transform: github.com/kitsunium/sdk/pkg/v1/data/transform
  url: net/url
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/pkg/v1/data/codec
  name: codec
  purpose: Package codec is the universal encoder/decoder dispatch facade.
types: []
