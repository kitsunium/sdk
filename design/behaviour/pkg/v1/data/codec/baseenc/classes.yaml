  - doc: |-
      The nine Formats this package registers. Each is an untyped constant, so it
      goes wherever a format name is taken — the codec package's Marshal,
      config.FSSource's string, i18n.LoadFS's codec.Format — without a
      conversion.
    grouped: true
    items:
      - doc: Base64 is standard base64, RFC 4648 §4.
        name: Base64
        value: "\"base64\""
      - doc: Base64URL is the URL- and filename-safe base64 alphabet, RFC 4648 §5.
        name: Base64URL
        value: "\"base64url\""
      - doc: Base32 is standard base32, RFC 4648 §6.
        name: Base32
        value: "\"base32\""
      - doc: Base16 is upper-case hexadecimal, RFC 4648 §8.
        name: Base16
        value: "\"base16\""
      - doc: Hex is lower-case hexadecimal.
        name: Hex
        value: "\"hex\""
      - doc: ASCII85 is Adobe's Ascii85, four bytes in five characters.
        name: ASCII85
        value: "\"ascii85\""
      - doc: Base45 is RFC 9285's alphabet, the one a QR code's alphanumeric mode holds.
        name: Base45
        value: "\"base45\""
      - doc: Base58 is Bitcoin's alphabet; its base conversion is quadratic, so its input is capped at 4 KiB.
        name: Base58
        value: "\"base58\""
      - doc: Base62 is the alphanumeric alphabet; capped at 4 KiB like Base58.
        name: Base62
        value: "\"base62\""
