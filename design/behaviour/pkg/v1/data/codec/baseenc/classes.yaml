package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/pkg/v1/data/codec/baseenc
  name: baseenc
  purpose: "Package baseenc registers the base-N codec with the SDK's codec registry — and no other codec — when it is imported (ADR 0134): import _ \"github.com/kitsunium/sdk/pkg/v1/data/codec/baseenc\" It registers nine Formats, one per alphabet, all through one pipeline: a value is encoded as JSON and the JSON text as base-N, and decoding runs the two steps backwards — so every alphabet carries any Go value encoding/json can, and swapping one alphabet for another is a change of Format name."
