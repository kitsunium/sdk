apiVersion: design/behaviour/v1
constants:
  - doc: |-
      devVersion is the string returned by FrameworkVersion when Version was
      not set at link time (typical for `go run` / local `go test`).
    items:
      - name: devVersion
        type: string
        value: "\"dev\""
    name: devVersion
  - doc: |-
      errorAttrCap is the small pre-allocation hint for an SDK error's Attr slice —
      code + reason + public + one trail frame covers the common case.
    items:
      - name: errorAttrCap
        type: int
        value: "4"
    name: errorAttrCap
  - doc: |-
      Structured keys WithError emits, documented in one place so the producer here
      and any downstream parser cannot drift.
    grouped: true
    items:
      - doc: errorCodeKey carries the dotted-quad classification of an SDK error.
        name: errorCodeKey
        value: "\"error.code\""
      - doc: errorReasonKey carries the SCREAMING_SNAKE reason of an SDK error.
        name: errorReasonKey
        value: "\"error.reason\""
      - doc: errorPublicKey carries the wire-safe public message of an SDK error.
        name: errorPublicKey
        value: "\"error.public\""
      - doc: errorTrailKey is the prefix for each positional wrap-trail code field.
        name: errorTrailKey
        value: "\"error.trail\""
      - doc: errorMessageKey carries the flat Error() string of a non-SDK error.
        name: errorMessageKey
        value: "\"error.message\""
    name: errorCodeKey
