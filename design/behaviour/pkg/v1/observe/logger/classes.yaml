  - name: NewWithSink
    params: cfg SinkConfig
    results: lg Logger, err error
  - name: NewWriterSink
    params: w io.Writer
    results: sink Sink, err error
  - name: TextEncoder
    results: Encoder
  - name: TraceContextFromContext
    params: ctx context.Context
    results: TraceContext
  - name: FrameworkVersion
    results: string
  - name: WithError
    params: err error
    results: "[]Attr"
  - doc: |-
      fallbackAttrs renders a plain stdlib error as a single error.message Attr —
      the only field a non-SDK error can offer.
    name: fallbackAttrs
    params: err error
    results: "[]Attr"
  - doc: |-
      appendReason appends the SCREAMING_SNAKE reason Attr when err carries one,
      returning the slice unchanged otherwise.
    name: appendReason
    params: attrs []Attr, err error
    results: "[]Attr"
  - doc: |-
      appendOptional appends a string Attr under key only when value is non-empty,
      keeping empty error metadata out of the emitted record.
    name: appendOptional
    params: attrs []Attr, key, value string
    results: "[]Attr"
  - doc: |-
      appendTrail emits one indexed error.trail Attr per wrap-trail code, in the
      order TrailOf reports them (newest wrap last), and returns the grown slice.
    name: appendTrail
    params: attrs []Attr, trail []kerrs.Code
    results: "[]Attr"
  - name: NewMulti
    params: min Level, specs ...WriterSpec
    results: lg Logger, err error
