# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
sequences:
  - of: (*suite).backend
    participants:
      - id: caller
        kind: actor
      - id: (*suite).backend
        kind: self
      - id: s.running.Graph().Node
        kind: value
    steps:
      - bind: node
        eval: s.running.Graph().Node("st-" + s.name + "/store/docs")
        to: s.running.Graph().Node
      - opt:
          do:
            - return: "\"\""
          when: node == nil || node.Store == nil
      - return: node.Store.Backend
  - of: (*suite).onDatabase
    participants:
      - id: caller
        kind: actor
      - id: (*suite).onDatabase
        kind: self
      - id: s.backend
        kind: internal
    steps:
      - bind: backend
        eval: s.backend()
        to: s.backend
      - return: backend != "memory" && backend != "file" && backend != ""
  - of: durable
    participants:
      - id: caller
        kind: actor
      - id: durable
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Skip
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - eval: t.Skip("memory keeps nothing past a stop")
              to: t.Skip
          when: s.backend() == "memory"
  - of: (*suite).again
    participants:
      - id: caller
        kind: actor
      - id: (*suite).again
        kind: self
      - id: t.Helper
        kind: value
      - id: s.stop
        kind: internal
      - id: build
        kind: internal
    steps:
      - eval: t.Helper()
        to: t.Helper
      - eval: s.stop(t)
        to: s.stop
      - return: build(s.name, s.place, s.clock, declare)
        to: build
  - of: watchCatchUp
    participants:
      - id: caller
        kind: actor
      - id: watchCatchUp
        kind: self
      - id: durable
        kind: internal
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: s.again
        kind: internal
      - id: replaying.running.Main
        kind: value
      - id: t.Fatalf
        kind: value
      - id: t.Errorf
        kind: value
      - id: build
        kind: internal
      - id: heard.start
        kind: internal
      - id: heard.settle
        kind: internal
      - id: heard.again
        kind: internal
      - id: next.start
        kind: internal
      - id: next.settle
        kind: internal
      - id: t.Error
        kind: value
    steps:
      - eval: durable(t, s)
        to: durable
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - loop:
          do:
            - eval: "must(t, s.memos.Insert(ctx, memo{ID: id, Text: \"unheard\"}))"
              to: must
          key: _
          range: "[]string{\"m2\", \"m1\"}"
          value: id
      - bind: replaying
        eval: s.again(t, declareMemos)
        to: s.again
      - opt:
          do:
            - eval: t.Fatalf("watch replay exited %d, want 0", exit)
              to: t.Fatalf
          init:
            bind: exit
            eval: replaying.running.Main(ctx, []string{"watch", "replay", "st-" + s.name + "/subscription/screen"})
            to: replaying.running.Main
          when: exit != 0
      - opt:
          do:
            - eval: t.Errorf("watch replay of no watch exited %d, want 1", exit)
              to: t.Errorf
          init:
            bind: exit
            eval: replaying.running.Main(ctx, []string{"watch", "replay", "st-" + s.name + "/subscription/nothing"})
            to: replaying.running.Main
          when: exit != 1
      - bind: heard
        eval: build(s.name, s.place, s.clock, declareMemos)
        to: build
      - eval: heard.start(t)
        to: heard.start
      - eval: heard.settle(t, "after")
        to: heard.settle
      - loop:
          do:
            - opt:
                do:
                  - eval: t.Errorf("after watch replay the watch did not hear %s", id)
                    to: t.Errorf
                when: "!heard.listed.has(id)"
          key: _
          range: "[]string{\"m1\", \"m2\"}"
          value: id
      - bind: next
        eval: heard.again(t, declareMemos)
        to: heard.again
      - eval: next.start(t)
        to: next.start
      - eval: next.settle(t, "next")
        to: next.settle
      - opt:
          do:
            - eval: t.Error("a memo heard before a clean stop was heard again")
              to: t.Error
          when: next.listed.has("m1") || next.listed.has("after")
  - of: declareTimers
    participants:
      - id: caller
        kind: actor
      - id: declareTimers
        kind: self
      - id: svc.Store
        kind: value
      - id: svc.Workflow("expiry", s.timers, stateOf).Initial("new").After
        kind: value
    steps:
      - set: s.timers
        to: svc.Store
        value: svc.Store("timers", doc.key)
      - set: s.expiry
        to: svc.Workflow("expiry", s.timers, stateOf).Initial("new").After
        value: svc.Workflow("expiry", s.timers, stateOf).Initial("new").After("expire", time.Hour, "new", "expired")
  - of: workflowJournal
    participants:
      - id: caller
        kind: actor
      - id: workflowJournal
        kind: self
      - id: durable
        kind: internal
      - id: t.Context
        kind: value
      - id: s.expiry.Start
        kind: value
      - id: t.Fatalf
        kind: value
      - id: s.again
        kind: internal
      - id: restarted.start
        kind: internal
      - id: s.clock.Advance
        kind: value
      - id: time
        kind: stdlib
      - id: restarted.timers.Get
        kind: value
      - id: ticking
        kind: internal
    steps:
      - eval: durable(t, s)
        to: durable
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - opt:
          do:
            - eval: "t.Fatalf(\"start the entity: %v\", err)"
              to: t.Fatalf
          init:
            bind: _, err
            eval: "s.expiry.Start(ctx, doc{ID: \"t1\"})"
            to: s.expiry.Start
          when: err != nil
      - bind: restarted
        eval: s.again(t, declareTimers)
        to: s.again
      - eval: restarted.start(t)
        to: restarted.start
      - eval: s.clock.Advance(time.Hour - time.Second)
        to: s.clock.Advance
      - eval: time.Sleep(10 * pollEvery)
        to: time
      - opt:
          do:
            - eval: "t.Fatalf(\"before its instant: %+v %v, want the entity still new\", d, err)"
              to: t.Fatalf
          init:
            bind: d, err
            eval: restarted.timers.Get(ctx, "t1")
            to: restarted.timers.Get
          when: err != nil || d.State != "new"
      - eval: |-
          ticking(t, restarted, "the timer armed before the restart", func() bool {
          		d, err := restarted.timers.Get(ctx, "t1")
          		return err == nil && d.State == "expired"
          	})
        to: ticking
  - of: dataCopy
    participants:
      - id: caller
        kind: actor
      - id: dataCopy
        kind: self
      - id: t.Skip
        kind: value
      - id: t.Context
        kind: value
      - id: s.stop
        kind: internal
      - id: t.TempDir
        kind: value
      - id: build
        kind: internal
      - id: files.start
        kind: internal
      - id: must
        kind: internal
      - id: files.stop
        kind: internal
      - id: build(s.name, into, nil, declareMemoStore).running.Main
        kind: value
      - id: t.Fatalf
        kind: value
      - id: t.Error
        kind: value
      - id: after.start
        kind: internal
      - id: expectCopied
        kind: internal
    steps:
      - opt:
          do:
            - eval: t.Skip("no database to copy into")
              to: t.Skip
          when: "!s.onDatabase()"
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: s.stop(t)
        to: s.stop
      - bind: dir
        eval: t.TempDir()
        to: t.TempDir
      - bind: files
        eval: build(s.name, []app.AppOption{app.DataDir(dir)}, nil, declareMemoStore)
        to: build
      - eval: files.start(t)
        to: files.start
      - loop:
          do:
            - eval: "must(t, files.memos.Insert(ctx, memo{ID: id, Text: \"copied\"}))"
              to: must
          key: _
          range: copiedMemos
          value: id
      - eval: files.stop(t)
        to: files.stop
      - bind: into
        eval: append(slices.Clone(s.place), app.DataDir(dir))
      - opt:
          do:
            - eval: t.Fatalf("data copy exited %d, want 0", exit)
              to: t.Fatalf
          init:
            bind: exit
            eval: build(s.name, into, nil, declareMemoStore).running.Main(ctx, copyArgs)
            to: build(s.name, into, nil, declareMemoStore).running.Main
          when: exit != 0
      - opt:
          do:
            - eval: t.Error("a second copy into a database that holds the memos was not refused")
              to: t.Error
          init:
            bind: exit
            eval: build(s.name, into, nil, declareMemoStore).running.Main(ctx, copyArgs)
            to: build(s.name, into, nil, declareMemoStore).running.Main
          when: exit == 0
      - bind: after
        eval: build(s.name, into, nil, declareMemoStore)
        to: build
      - eval: after.start(t)
        to: after.start
      - eval: expectCopied(t, after)
        to: expectCopied
  - of: expectCopied
    participants:
      - id: caller
        kind: actor
      - id: expectCopied
        kind: self
      - id: t.Helper
        kind: value
      - id: s.memos.Get
        kind: value
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - loop:
          do:
            - opt:
                do:
                  - eval: "t.Errorf(\"%s after the copy: %+v %v\", id, got, err)"
                    to: t.Errorf
                init:
                  bind: got, err
                  eval: s.memos.Get(t.Context(), id)
                  to: s.memos.Get
                when: err != nil || got.Text != "copied"
          key: _
          range: copiedMemos
          value: id
      - opt:
          do:
            - eval: t.Errorf("after the copy the memos are kept in %q, want the database", s.backend())
              to: t.Errorf
          when: "!s.onDatabase()"
  - of: (*suite).otlpPlace
    steps:
      - return: |-
          append(slices.Clone(s.place),
          		app.OTLP(app.OTLPDatabase("database"), app.OTLPSender(send), app.OTLPSendTimeout(time.Hour)),
          		app.Set("otlp-drain", time.Duration(0)), app.Set("otlp-interval", time.Second))
  - of: (*exports).refuse
    participants:
      - id: caller
        kind: actor
      - id: (*exports).refuse
        kind: self
      - id: e.refused.Add
        kind: value
      - id: app
        kind: package
    steps:
      - eval: e.refused.Add(1)
        to: e.refused.Add
      - return: app.Unavailable("the collector is down")
        to: app
  - of: (*exports).accept
    participants:
      - id: caller
        kind: actor
      - id: (*exports).accept
        kind: self
      - id: e.sent.Add
        kind: value
    steps:
      - eval: e.sent.Add(1)
        to: e.sent.Add
      - return: nil
  - of: otlpTables
    participants:
      - id: caller
        kind: actor
      - id: otlpTables
        kind: self
      - id: t.Skip
        kind: value
      - id: s.stop
        kind: internal
      - id: build
        kind: internal
      - id: first.start
        kind: internal
      - id: must
        kind: internal
      - id: ticking
        kind: internal
      - id: t.Fatalf
        kind: value
      - id: first.stop
        kind: internal
      - id: second.start
        kind: internal
    steps:
      - opt:
          do:
            - eval: t.Skip("no database to keep the export's queues")
              to: t.Skip
          when: "!s.onDatabase()"
      - eval: s.stop(t)
        to: s.stop
      - bind: down
        eval: "&exports{}"
      - bind: first
        eval: build(s.name, s.otlpPlace(down.refuse), s.clock, nil)
        to: build
      - eval: first.start(t)
        to: first.start
      - eval: "must(t, first.docs.Put(t.Context(), doc{ID: \"traced\"}))"
        to: must
      - eval: ticking(t, first, "a batch refused by a collector that is down", func() bool { return down.refused.Load() > 0 })
        to: ticking
      - bind: export
        eval: first.running.Graph().Runtime.Export
      - opt:
          do:
            - eval: "t.Fatalf(\"the export's queues: %+v, want them on the database, durable\", export)"
              to: t.Fatalf
          when: export == nil || len(export.Signals) == 0 || export.Signals[0].Store != "database:database" || !export.Signals[0].Durable
      - eval: first.stop(t)
        to: first.stop
      - bind: up
        eval: "&exports{}"
      - bind: second
        eval: build(s.name, s.otlpPlace(up.accept), s.clock, nil)
        to: build
      - eval: second.start(t)
        to: second.start
      - eval: ticking(t, second, "the first run's backlog sent by the second", func() bool { return up.sent.Load() > 0 })
        to: ticking
  - of: doc.key
    steps:
      - return: d.ID
  - of: (*heard).add
    steps:
      - lock:
          mutex: h
      - set: h.ids
        value: append(h.ids, id)
  - of: (*heard).has
    participants:
      - id: caller
        kind: actor
      - id: (*heard).has
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: h
      - return: slices.Contains(h.ids, id)
        to: slices
  - of: Run
    participants:
      - id: caller
        kind: actor
      - id: Run
        kind: self
      - id: t.Run
        kind: value
    steps:
      - loop:
          do:
            - eval: t.Run(b.Name+"/"+c.name, func(t *testing.T) { c.run(t, open(t, b, c.name, c.clocked)) })
              to: t.Run
          key: _
          range: cases
          value: c
  - of: open
    participants:
      - id: caller
        kind: actor
      - id: open
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Setenv
        kind: value
      - id: clock
        kind: package
      - id: build
        kind: internal
      - id: s.start
        kind: internal
    steps:
      - eval: t.Helper()
        to: t.Helper
      - eval: t.Setenv("STORETEST_SMTP_URL", "")
        to: t.Setenv
      - eval: t.Setenv("STORETEST_SECRETS", "memory")
        to: t.Setenv
      - eval: t.Setenv("STORETEST_DATABASE_TIMEOUT", "1m")
        to: t.Setenv
      - var:
          name: clk
          type: "*clock.ManualClock"
      - opt:
          do:
            - set: clk
              to: clock
              value: clock.NewManualClock(epoch)
          when: clocked
      - bind: s
        eval: build(name, b.Options(t, App), clk, declarations[name])
        to: build
      - eval: s.start(t)
        to: s.start
      - return: s
  - of: build
    participants:
      - id: caller
        kind: actor
      - id: build
        kind: self
      - id: app
        kind: package
      - id: svc.Store
        kind: value
      - id: svc.Subscribe
        kind: value
      - id: app.NewApp(App, svc).With
        kind: value
      - id: s.running.With
        kind: value
    steps:
      - bind: svc
        eval: app.NewService("st-"+name, "A case of the framework's store conformance suite.")
        to: app
      - bind: docs
        eval: |-
          svc.Store("docs", doc.key,
          		app.Unique("email", func(d doc) string { return d.Email }),
          		app.Index("team", func(d doc) []string { return d.Teams }))
        to: svc.Store
      - bind: pages
        eval: |-
          svc.Store("pages", doc.key, app.Revisions(2),
          		app.Unique("email", func(d doc) string { return d.Email }))
        to: svc.Store
      - bind: s
        eval: |-
          &suite{
          		heard:     &heard{},
          		docs:      docs,
          		moved:     svc.Topic[doc]("moved"),
          		lifecycle: svc.Workflow("lifecycle", docs, stateOf).Initial("new").When("ready", "new", "done", isReady),
          		pages:     pages,
          		pageFlow:  svc.Workflow("publishing", pages, stateOf).Initial("new").When("ready", "new", "done", isReady).On("hold", "new", "held"),
          		name:      name,
          		place:     place,
          	}
      - eval: svc.Subscribe("heard", s.moved, func(_ context.Context, d doc) error { s.heard.add(d.ID); return nil })
        to: svc.Subscribe
      - opt:
          do:
            - eval: declare(svc, s)
          when: declare != nil
      - set: s.running
        to: app.NewApp(App, svc).With
        value: |-
          app.NewApp(App, svc).With(append([]app.AppOption{
          		app.Listen("127.0.0.1:0"), app.Env(app.EnvDev), app.Analyze(false), app.Logs(io.Discard),
          	}, place...)...)
      - opt:
          do:
            - set: s.clock
              value: clk
            - set: s.running
              to: s.running.With
              value: s.running.With(app.Clock(clk))
          when: clk != nil
      - return: s
  - of: (*suite).start
    participants:
      - id: caller
        kind: actor
      - id: (*suite).start
        kind: self
      - id: t.Helper
        kind: value
      - id: s.running.Start
        kind: value
      - id: t.Fatalf
        kind: value
      - id: t.Cleanup
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - eval: "t.Fatalf(\"start: %v\", err)"
              to: t.Fatalf
          init:
            bind: err
            eval: s.running.Start(t.Context())
            to: s.running.Start
          when: err != nil
      - eval: t.Cleanup(func() { s.stop(t) })
        to: t.Cleanup
  - of: (*suite).stop
    participants:
      - id: caller
        kind: actor
      - id: (*suite).stop
        kind: self
      - id: t.Helper
        kind: value
      - id: context
        kind: stdlib
      - id: s.running.Stop
        kind: value
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - return: ""
          when: s.stopped
      - set: s.stopped
        value: "true"
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), stopWait)
        to: context
      - defer: cancel()
      - opt:
          do:
            - eval: "t.Errorf(\"stop: %v\", err)"
              to: t.Errorf
          init:
            bind: err
            eval: s.running.Stop(ctx)
            to: s.running.Stop
          when: err != nil
  - of: stateOf
    steps:
      - return: "&d.State"
  - of: isReady
    steps:
      - return: d.Ready
  - of: code
    steps:
      - opt:
          do:
            - return: ke.Code
          init:
            bind: ke, ok
            eval: errors.AsType[*app.Error](err)
          when: ok
      - return: "\"\""
  - of: message
    steps:
      - opt:
          do:
            - return: ke.Message
          init:
            bind: ke, ok
            eval: errors.AsType[*app.Error](err)
          when: ok
      - return: "\"\""
  - of: expect
    participants:
      - id: caller
        kind: actor
      - id: expect
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - eval: "t.Errorf(\"%s: %v\", what, err)"
              to: t.Errorf
          when: code(err) != want
  - of: must
    participants:
      - id: caller
        kind: actor
      - id: must
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Fatal
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - eval: t.Fatal(err)
              to: t.Fatal
          when: err != nil
  - of: eventually
    participants:
      - id: caller
        kind: actor
      - id: eventually
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Fatalf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - loop:
          cond: time.Now().Before(deadline)
          do:
            - opt:
                do:
                  - return: ""
                when: cond()
          init: deadline := time.Now().Add(waitFor)
          post: time.Sleep(pollEvery)
      - eval: t.Fatalf("timed out waiting for %s", what)
        to: t.Fatalf
  - of: idsOf
    steps:
      - bind: ids
        eval: make([]string, 0, len(docs))
      - loop:
          do:
            - set: ids
              value: append(ids, d.ID)
          key: _
          range: docs
          value: d
      - return: ids
  - of: setN
    steps:
      - return:
          closure:
            params: d *doc
            results: error
            steps:
              - set: d.N
                value: "n"
              - return: nil
  - of: writeModes
    participants:
      - id: caller
        kind: actor
      - id: writeModes
        kind: self
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: expect
        kind: internal
      - id: s.docs.Update
        kind: value
      - id: t.Errorf
        kind: value
      - id: s.docs.Count
        kind: value
      - id: s.docs.Get
        kind: value
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: "must(t, s.docs.Insert(ctx, doc{ID: \"a\", N: 1}))"
        to: must
      - eval: "expect(t, \"an insert over a taken key\", s.docs.Insert(ctx, doc{ID: \"a\", N: 2}), app.WireConflict)"
        to: expect
      - eval: "must(t, s.docs.Put(ctx, doc{ID: \"a\", N: putN}))"
        to: must
      - bind: got, err
        eval: s.docs.Update(ctx, "a", func(d *doc) error { d.N++; return nil })
        to: s.docs.Update
      - opt:
          do:
            - eval: "t.Errorf(\"an update: %+v %v\", got, err)"
              to: t.Errorf
          when: err != nil || got.N != putN+1
      - set: _, err
        to: s.docs.Update
        value: s.docs.Update(ctx, "none", func(*doc) error { return nil })
      - eval: expect(t, "an update of nothing", err, app.WireNotFound)
        to: expect
      - set: _, err
        to: s.docs.Update
        value: s.docs.Update(ctx, "a", func(d *doc) error { d.ID = "b"; return nil })
      - eval: expect(t, "an update that renames", err, app.WireInvalid)
        to: expect
      - opt:
          do:
            - eval: "t.Errorf(\"count: %d %v\", n, err)"
              to: t.Errorf
          init:
            bind: n, err
            eval: s.docs.Count(ctx)
            to: s.docs.Count
          when: err != nil || n != 1
      - eval: must(t, s.docs.Delete(ctx, "a"))
        to: must
      - eval: expect(t, "a delete of nothing", s.docs.Delete(ctx, "a"), app.WireNotFound)
        to: expect
      - set: _, err
        to: s.docs.Get
