          do:
            - eval: "t.Errorf(\"after a write and a transition of the state: %+v\", revs)"
              to: t.Errorf
          when: len(revs) != len(keptVersions) || revs[0].Number != transitioned || revs[0].Value.State != "done" || revs[0].By != "u1" || revs[1].Number != transitioned-1
