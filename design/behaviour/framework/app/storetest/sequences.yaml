        to: must
      - bind: said
        eval: make([]string, 0, len(edits))
      - loop:
          do:
            - set: said
              value: append(said, strings.Join([]string{e.Op, e.Path, rawText(e.From), rawText(e.To)}, " "))
          key: _
          range: edits
          value: e
      - opt:
          do:
            - eval: t.Errorf("diff %q, want %q", said, transitionEdits)
              to: t.Errorf
          when: "!slices.Equal(said, transitionEdits)"
