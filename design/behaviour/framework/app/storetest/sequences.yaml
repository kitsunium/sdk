          		return err == nil && d.State == "done"
          	})
        to: eventually
      - opt:
          do:
            - eval: "t.Errorf(\"a rolled back write moved the workflow: %+v %v\", d, err)"
              to: t.Errorf
          init:
            bind: d, err
            eval: s.docs.Get(ctx, "rolled")
            to: s.docs.Get
          when: err != nil || d.State != "new" || d.Ready
  - of: ns
    participants:
      - id: caller
        kind: actor
      - id: ns
        kind: self
      - id: t.Helper
        kind: value
      - id: s.pages.Revisions
        kind: value
      - id: t.Fatalf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - bind: revs, err
        eval: s.pages.Revisions(t.Context(), key)
        to: s.pages.Revisions
      - opt:
          do:
            - eval: "t.Fatalf(\"the versions of %s: %v\", key, err)"
              to: t.Fatalf
          when: err != nil
      - bind: out
        eval: make([]string, 0, len(revs))
      - loop:
          do:
            - set: out
              value: append(out, strconv.FormatUint(r.Number, 10)+":"+strconv.Itoa(r.Value.N))
          key: _
          range: revs
          value: r
      - return: out
  - of: expectVersions
    participants:
      - id: caller
        kind: actor
      - id: expectVersions
        kind: self
      - id: t.Helper
        kind: value
      - id: ns
        kind: internal
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - opt:
          do:
            - eval: t.Errorf("versions %q %s, want %q", got, what, want)
              to: t.Errorf
          init:
            bind: got
            eval: ns(t, s, "p")
            to: ns
          when: "!slices.Equal(got, want)"
  - of: revisions
    participants:
      - id: caller
        kind: actor
      - id: revisions
        kind: self
      - id: app
        kind: package
      - id: s.pageFlow.Start
        kind: value
      - id: must
        kind: internal
      - id: s.pages.Update
        kind: value
      - id: expectVersions
        kind: internal
      - id: s.pages.Get
        kind: value
      - id: eventually
        kind: internal
      - id: transitionVersions
        kind: internal
      - id: s.pages.Revision
        kind: value
      - id: expect
        kind: internal
    steps:
      - bind: ctx
        eval: app.WithUser(t.Context(), "u1", struct{}{})
        to: app
      - bind: _, err
        eval: "s.pageFlow.Start(ctx, doc{ID: \"p\", N: 1})"
        to: s.pageFlow.Start
      - eval: must(t, err)
        to: must
      - loop:
          cond: n <= pageUpdates
          do:
            - bind: _, err
              eval: s.pages.Update(ctx, "p", setN(n))
              to: s.pages.Update
            - eval: must(t, err)
              to: must
          init: n := 2
          post: n++
      - eval: expectVersions(t, s, "after the updates", keptVersions)
        to: expectVersions
      - bind: cur, err
        eval: s.pages.Get(ctx, "p")
        to: s.pages.Get
      - eval: must(t, err)
        to: must
      - eval: must(t, s.pages.Put(ctx, cur))
        to: must
      - eval: expectVersions(t, s, "after a write of the same record", keptVersions)
        to: expectVersions
      - set: _, err
        to: s.pages.Update
        value: s.pages.Update(ctx, "p", ready)
      - eval: must(t, err)
        to: must
      - eval: |-
          eventually(t, "the guard's transition", func() bool {
          		d, err := s.pages.Get(ctx, "p")
          		return err == nil && d.State == "done"
          	})
        to: eventually
      - eval: transitionVersions(t, s)
        to: transitionVersions
      - set: _, err
        to: s.pages.Revision
        value: s.pages.Revision(ctx, "p", 1)
      - eval: expect(t, "a pruned version", err, app.WireNotFound)
        to: expect
  - of: transitionVersions
    participants:
      - id: caller
        kind: actor
      - id: transitionVersions
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Context
        kind: value
      - id: s.pages.Revisions
        kind: value
      - id: must
        kind: internal
      - id: t.Errorf
        kind: value
      - id: s.pages.Diff
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - bind: revs, err
        eval: s.pages.Revisions(ctx, "p")
        to: s.pages.Revisions
      - eval: must(t, err)
        to: must
      - opt:
          do:
            - eval: "t.Errorf(\"after a write and a transition of the state: %+v\", revs)"
              to: t.Errorf
          when: len(revs) != len(keptVersions) || revs[0].Number != transitioned || revs[0].Value.State != "done" || revs[0].By != "u1" || revs[1].Number != transitioned-1
      - bind: edits, err
        eval: s.pages.Diff(ctx, "p", transitioned-2, transitioned)
        to: s.pages.Diff
      - eval: must(t, err)
        to: must
      - bind: said
        eval: make([]string, 0, len(edits))
      - loop:
          do:
            - set: said
              value: append(said, strings.Join([]string{e.Op, e.Path, rawText(e.From), rawText(e.To)}, " "))
          key: _
          range: edits
          value: e
      - opt:
          do:
            - eval: t.Errorf("diff %q, want %q", said, transitionEdits)
              to: t.Errorf
          when: "!slices.Equal(said, transitionEdits)"
  - of: rawText
    steps:
      - return: string(raw)
  - of: revisionsRestore
    participants:
      - id: caller
        kind: actor
      - id: revisionsRestore
        kind: self
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: s.pages.Update
        kind: value
      - id: s.pages.Restore
        kind: value
      - id: t.Errorf
        kind: value
      - id: expect
        kind: internal
      - id: expectVersions
        kind: internal
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: "must(t, s.pages.Insert(ctx, doc{ID: \"p\", Email: \"a@example.com\", N: 1, State: \"new\"}))"
        to: must
      - bind: _, err
        eval: s.pages.Update(ctx, "p", func(d *doc) error { d.Email, d.N, d.State = "b@example.com", 2, "done"; return nil })
        to: s.pages.Update
      - eval: must(t, err)
        to: must
      - bind: got, err
        eval: s.pages.Restore(ctx, "p", 1, "/n")
        to: s.pages.Restore
      - opt:
          do:
            - eval: "t.Errorf(\"a field restored: %+v %v\", got, err)"
              to: t.Errorf
          when: err != nil || got.N != 1 || got.Email != "b@example.com" || got.State != "done"
      - eval: "must(t, s.pages.Insert(ctx, doc{ID: \"q\", Email: \"a@example.com\"}))"
        to: must
      - set: _, err
        to: s.pages.Restore
        value: s.pages.Restore(ctx, "p", 1)
      - eval: expect(t, "a restore a unique index refuses", err, app.WireConflict)
        to: expect
      - eval: expectVersions(t, s, "after a refused restore", refusedRestore)
        to: expectVersions
      - eval: must(t, s.pages.Delete(ctx, "q"))
        to: must
      - set: got, err
        to: s.pages.Restore
        value: s.pages.Restore(ctx, "p", 1)
      - opt:
          do:
            - eval: "t.Errorf(\"the whole version restored: %+v %v\", got, err)"
              to: t.Errorf
          when: err != nil || got.Email != "a@example.com" || got.State != "done"
  - of: revisionsRollback
    participants:
      - id: caller
        kind: actor
      - id: revisionsRollback
        kind: self
      - id: t.Context
        kind: value
      - id: s.pageFlow.Start
        kind: value
      - id: must
        kind: internal
      - id: s.pages.Update
        kind: value
      - id: app
        kind: package
      - id: t.Fatal
        kind: value
      - id: s.pages.Get
        kind: value
      - id: t.Errorf
        kind: value
      - id: ns
        kind: internal
      - id: rolledTransition
        kind: internal
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - bind: _, err
        eval: "s.pageFlow.Start(ctx, doc{ID: \"p\", N: 1})"
        to: s.pageFlow.Start
      - eval: must(t, err)
        to: must
      - set: _, err
        to: s.pages.Update
        value: s.pages.Update(ctx, "p", setN(2))
      - eval: must(t, err)
        to: must
      - set: err
        to: app
        value: |-
          app.Transact(ctx, func(ctx context.Context) error {
          		_, err := s.pages.Update(ctx, "p", setN(rolledN))
          		return errors.Join(err, errRolled)
          	})
      - opt:
          do:
            - eval: t.Fatal(err)
              to: t.Fatal
          when: "!errors.Is(err, errRolled)"
      - opt:
          do:
            - eval: "t.Errorf(\"the record after the rollback: %+v %v\", got, err)"
              to: t.Errorf
          init:
            bind: got, err
            eval: s.pages.Get(ctx, "p")
            to: s.pages.Get
          when: err != nil || got.N != 2
      - bind: versions
        eval: ns(t, s, "p")
        to: ns
      - opt:
          do:
            - eval: "t.Errorf(\"a rolled back write shows in the versions: %q\", versions)"
              to: t.Errorf
          when: slices.ContainsFunc(versions, func(v string) bool { return strings.HasSuffix(v, ":"+strconv.Itoa(rolledN)) })
      - opt:
          do:
            - eval: "t.Errorf(\"the rollback pruned a version: %q\", versions)"
              to: t.Errorf
          when: versions[len(versions)-1] != "1:1"
      - eval: rolledTransition(t, s)
        to: rolledTransition
  - of: rolledTransition
    participants:
      - id: caller
        kind: actor
      - id: rolledTransition
        kind: self
      - id: t.Helper
        kind: value
      - id: t.Context
        kind: value
      - id: app
        kind: package
      - id: t.Fatal
        kind: value
      - id: s.pages.Revisions
        kind: value
      - id: must
        kind: internal
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - bind: err
        eval: |-
          app.Transact(ctx, func(ctx context.Context) error {
          		_, err := s.pageFlow.Fire(ctx, "p", "hold")
          		return errors.Join(err, errRolled)
          	})
        to: app
      - opt:
          do:
            - eval: t.Fatal(err)
              to: t.Fatal
          when: "!errors.Is(err, errRolled)"
      - bind: revs, err
        eval: s.pages.Revisions(ctx, "p")
        to: s.pages.Revisions
      - eval: must(t, err)
        to: must
      - loop:
          do:
            - opt:
                do:
                  - eval: "t.Errorf(\"version %d holds the state a rollback undid: %q\", r.Number, r.Value.State)"
                    to: t.Errorf
                when: r.Value.State != "new"
          key: _
          range: revs
          value: r
  - of: trash
    participants:
      - id: caller
        kind: actor
      - id: trash
        kind: self
      - id: trashDeletes
        kind: internal
      - id: trashUntrashes
        kind: internal
      - id: trashPurges
        kind: internal
      - id: trashNeedsRevisions
        kind: internal
    steps:
      - eval: trashDeletes(t, s)
        to: trashDeletes
      - eval: trashUntrashes(t, s)
        to: trashUntrashes
      - eval: trashPurges(t, s)
        to: trashPurges
      - eval: trashNeedsRevisions(t, s)
        to: trashNeedsRevisions
  - of: trashDeletes
    participants:
      - id: caller
        kind: actor
      - id: trashDeletes
        kind: self
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: s.pages.Update
        kind: value
      - id: s.pages.Get
        kind: value
      - id: expect
        kind: internal
      - id: s.pages.List
        kind: value
      - id: t.Errorf
        kind: value
      - id: expectTrash
        kind: internal
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: "must(t, s.pages.Insert(ctx, doc{ID: \"p\", Email: \"a@example.com\", N: 1}))"
        to: must
      - bind: _, err
        eval: s.pages.Update(ctx, "p", setN(2))
        to: s.pages.Update
      - eval: must(t, err)
        to: must
      - eval: must(t, s.pages.Delete(ctx, "p"))
        to: must
      - set: _, err
        to: s.pages.Get
        value: s.pages.Get(ctx, "p")
      - eval: expect(t, "a read of a trashed page", err, app.WireNotFound)
        to: expect
      - opt:
          do:
            - eval: "t.Errorf(\"a list after the deletion: %v %v\", idsOf(all), err)"
              to: t.Errorf
          init:
            bind: all, err
            eval: s.pages.List(ctx)
            to: s.pages.List
          when: err != nil || len(all) != 0
      - eval: "expectTrash(t, s, \"after the deletion\", []app.Tombstone{{Key: \"p\", At: epoch, PurgeAt: epoch.Add(trashDays)}})"
        to: expectTrash
  - of: trashUntrashes
    participants:
      - id: caller
        kind: actor
      - id: trashUntrashes
        kind: self
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: s.pages.Untrash
        kind: value
      - id: expect
        kind: internal
      - id: t.Errorf
        kind: value
      - id: expectVersions
        kind: internal
      - id: expectTrash
        kind: internal
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: "must(t, s.pages.Insert(ctx, doc{ID: \"q\", Email: \"a@example.com\"}))"
        to: must
      - bind: _, err
        eval: s.pages.Untrash(ctx, "p")
        to: s.pages.Untrash
      - eval: expect(t, "an untrash a unique index refuses", err, app.WireConflict)
        to: expect
      - eval: must(t, s.pages.Delete(ctx, "q"))
        to: must
      - bind: got, err
        eval: s.pages.Untrash(ctx, "p")
        to: s.pages.Untrash
      - opt:
          do:
            - eval: "t.Errorf(\"the page untrashed: %+v %v\", got, err)"
              to: t.Errorf
          when: err != nil || got.N != 2 || got.Email != "a@example.com"
      - eval: expectVersions(t, s, "after the untrash", []string{"2:2", "1:1"})
        to: expectVersions
      - set: _, err
        to: s.pages.Untrash
        value: s.pages.Untrash(ctx, "p")
      - eval: expect(t, "an untrash of a page not in the trash", err, app.WireNotFound)
        to: expect
      - eval: "expectTrash(t, s, \"after the untrash\", []app.Tombstone{{Key: \"q\", At: epoch, PurgeAt: epoch.Add(trashDays)}})"
        to: expectTrash
  - of: trashPurges
    participants:
      - id: caller
        kind: actor
      - id: trashPurges
        kind: self
      - id: t.Context
        kind: value
      - id: s.clock.Advance
        kind: value
      - id: must
        kind: internal
      - id: eventually
        kind: internal
      - id: expectTrash
        kind: internal
      - id: s.pages.Revisions
        kind: value
      - id: expect
        kind: internal
      - id: ns
        kind: internal
      - id: t.Errorf
        kind: value
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: s.clock.Advance(time.Hour)
        to: s.clock.Advance
      - eval: must(t, s.pages.Delete(ctx, "p"))
        to: must
      - eval: s.clock.Advance(trashDays - time.Second)
        to: s.clock.Advance
      - eval: |-
          eventually(t, "q purged at its instant", func() bool {
          		stones, err := s.pages.Trashed(ctx)
          		return err == nil && len(stones) == 1 && stones[0].Key == "p"
          	})
        to: eventually
      - eval: "expectTrash(t, s, \"a second before p's instant\", []app.Tombstone{{Key: \"p\", At: epoch.Add(time.Hour), PurgeAt: epoch.Add(time.Hour + trashDays)}})"
        to: expectTrash
      - eval: s.clock.Advance(time.Second)
        to: s.clock.Advance
      - eval: |-
          eventually(t, "p purged at its instant", func() bool {
          		stones, err := s.pages.Trashed(ctx)
          		return err == nil && len(stones) == 0
          	})
        to: eventually
      - bind: _, err
        eval: s.pages.Revisions(ctx, "p")
        to: s.pages.Revisions
      - eval: expect(t, "the versions of a purged page", err, app.WireNotFound)
        to: expect
      - eval: "must(t, s.pages.Insert(ctx, doc{ID: \"p\", N: rewrittenN}))"
        to: must
      - opt:
          do:
            - eval: "t.Errorf(\"a page written after its purge: %q, want version 1 again\", got)"
              to: t.Errorf
          init:
            bind: got
            eval: ns(t, s, "p")
            to: ns
          when: "!slices.Equal(got, []string{\"1:\" + strconv.Itoa(rewrittenN)})"
  - of: trashNeedsRevisions
    participants:
      - id: caller
        kind: actor
      - id: trashNeedsRevisions
        kind: self
      - id: t.Context
        kind: value
      - id: must
        kind: internal
      - id: s.docs.Untrash
        kind: value
      - id: expect
        kind: internal
      - id: s.docs.Trashed
        kind: value
    steps:
      - bind: ctx
        eval: t.Context()
        to: t.Context
      - eval: "must(t, s.docs.Insert(ctx, doc{ID: \"d\"}))"
        to: must
      - eval: must(t, s.docs.Delete(ctx, "d"))
        to: must
      - bind: _, err
        eval: s.docs.Untrash(ctx, "d")
        to: s.docs.Untrash
      - eval: expect(t, "an untrash on a store without revisions", err, app.WireInvalid)
        to: expect
      - set: _, err
        to: s.docs.Trashed
        value: s.docs.Trashed(ctx)
      - eval: expect(t, "the trash of a store without revisions", err, app.WireInvalid)
        to: expect
      - eval: "must(t, s.docs.Insert(ctx, doc{ID: \"d\"}))"
        to: must
  - of: expectTrash
    participants:
      - id: caller
        kind: actor
      - id: expectTrash
        kind: self
      - id: t.Helper
        kind: value
      - id: s.pages.Trashed
        kind: value
      - id: t.Fatalf
        kind: value
      - id: t.Errorf
        kind: value
    steps:
      - eval: t.Helper()
        to: t.Helper
      - bind: got, err
        eval: s.pages.Trashed(t.Context())
        to: s.pages.Trashed
      - opt:
          do:
            - eval: "t.Fatalf(\"the trash %s: %v\", what, err)"
              to: t.Fatalf
          when: err != nil
      - bind: same
        eval: len(got) == len(want)
      - loop:
          cond: same && i < len(got)
          do:
            - set: same
              value: got[i].Key == want[i].Key && got[i].At.Equal(want[i].At) && got[i].PurgeAt.Equal(want[i].PurgeAt)
          init: i := 0
          post: i++
      - opt:
          do:
            - eval: "t.Errorf(\"the trash %s: %+v, want %+v\", what, got, want)"
              to: t.Errorf
          when: "!same"
