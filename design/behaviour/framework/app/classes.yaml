        value: iapp.CodeWorkflowNotInPlace
      - doc: CodeTransactionPanic is CodeTransactionPanic.
        name: CodeTransactionPanic
        type: errs.Code
        value: iapp.CodeTransactionPanic
    name: WireInvalid
  - grouped: true
    items:
      - doc: |-
          OverlapSkip skips the fire, counted, the previous run going on: the
          default, since the framework cannot know that two runs of a job may
          run at once.
        name: OverlapSkip
        type: OverlapPolicy
        value: iapp.OverlapSkip
      - doc: OverlapAllow runs the fire beside the previous run.
        name: OverlapAllow
        type: OverlapPolicy
        value: iapp.OverlapAllow
      - doc: |-
          OverlapReplace cancels the previous run's context and runs the fire
          once that run returned: the newest fire wins, two runs never overlap.
        name: OverlapReplace
        type: OverlapPolicy
        value: iapp.OverlapReplace
    name: OverlapSkip
  - doc: The two signals an export forwards, as an [OTLPBatch] names them.
    grouped: true
    items:
      - doc: |-
          OTLPTraces names the trace signal: an OTLP/JSON
          ExportTraceServiceRequest.
        name: OTLPTraces
        type: string
        value: iapp.OTLPTraces
      - doc: |-
          OTLPMetrics names the metrics signal: an OTLP/JSON
          ExportMetricsServiceRequest.
        name: OTLPMetrics
        type: string
        value: iapp.OTLPMetrics
    name: OTLPTraces
  - doc: |-
      What an export's full queue does with a new batch: the setting
      otlp-when-full spells it.
    grouped: true
    items:
      - doc: |-
          OTLPDropOldest, the default: the oldest batches not being sent are
          taken out, counted dropped, until the new one fits.
        name: OTLPDropOldest
        type: OTLPFullPolicy
        value: iapp.OTLPDropOldest
      - doc: "OTLPDropNewest: the new batch is refused, counted dropped."
        name: OTLPDropNewest
        type: OTLPFullPolicy
        value: iapp.OTLPDropNewest
      - doc: |-
          OTLPBlock: the span or the snapshot waits for room a few seconds, then
          is refused, counted dropped.
        name: OTLPBlock
        type: OTLPFullPolicy
        value: iapp.OTLPBlock
    name: OTLPDropOldest
  - doc: |-
      CodeProfileRead reports a profile of the process that could not be written
      or read back. It is in the framework's 0.4.2.* range.
    items:
      - name: CodeProfileRead
        type: errs.Code
        value: iapp.CodeProfileRead
    name: CodeProfileRead
  - grouped: true
    items:
      - doc: |-
          Personal marks a field that holds data about a person: personal,
          special, or a record's subject.
        name: Personal
        type: Mark
        value: iapp.Personal
      - doc: Special marks a field of GDPR art. 9(1) or art. 10.
        name: Special
        type: Mark
        value: iapp.Special
      - doc: Moderated marks content others see and a moderator may act on.
        name: Moderated
        type: Mark
        value: iapp.Moderated
    name: Personal
  - doc: |-
      CodeScopeUnknown reports a scope whose value could not be read at the
      start: no current user, no executable path, no configuration directory.
    items:
      - name: CodeScopeUnknown
        type: errs.Code
        value: iapp.CodeScopeUnknown
    name: CodeScopeUnknown
