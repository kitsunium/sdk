functions:
  - doc: |-
      bufferArchive reads the whole release archive into memory, refusing
      anything larger than capBytes. Buffering (instead of streaming) is what
      lets the SHA-256 be verified BEFORE any extraction code touches the bytes;
      the zip path already required full buffering (ReaderAt), so this unifies
      both archive shapes at a bounded memory cost.
    name: bufferArchive
    params: body io.Reader, capBytes int64
    results: archive []byte, bufErr error
  - doc: |-
      findChecksumEntry scans a sha256sum-format manifest ("<hex>  <name>" per
      line) and returns the hex digest recorded for asset. Tolerates one or two
      separator spaces and the binary-mode "*" name marker; lines that do not
      parse as a digest entry are ignored.
    name: findChecksumEntry
    params: manifest, asset string
    results: digest string, found bool
  - doc: |-
      isHexDigest reports whether s is a well-formed hex-encoded SHA-256 digest
      (exactly 64 hex characters, any case).
    name: isHexDigest
    params: s string
    results: bool
  - doc: |-
      consentFromEnv reads the standing authorisation.

      The second result distinguishes "no answer recorded" from "the answer is
      no", which the caller needs: only the first falls through to a prompt.
      Unset and empty are the same thing — an exported variable set to nothing
      is not a decision.
    name: consentFromEnv
    params: value string
    results: granted, decided bool
  - doc: |-
      askUpgradeConsent puts the question to the human at the keyboard.

      Default-no: a bare Enter, EOF, a closed stdin and an unreadable one all
      decline. The only accepted answers are an explicit yes.
    name: askUpgradeConsent
    params: out io.Writer, in io.Reader
    results: bool
  - name: StdinIsTerminal
    results: bool
  - doc: |-
      isNullDevice reports whether info describes the null device.

      os.SameFile compares what the filesystem says, so it holds through a symlink
      or a bind mount — a path comparison against the string "/dev/null" would not.
    name: isNullDevice
    params: info os.FileInfo
    results: bool
  - doc: |-
      terminalLike reports whether a file mode is that of a character device.

      It excludes a pipe, a regular file and a closed descriptor. It does NOT
      exclude the null device, which is a character device too — StdinIsTerminal
      handles that separately, and this comment used to claim otherwise.
    name: terminalLike
    params: mode os.FileMode
    results: bool
  - doc: |-
      diagnose renders what err carries beyond its public sentence: every field,
      then the words of the first cause this SDK did not write.

      It returns the empty string for an error with neither, which is the signal a
      caller uses to print nothing rather than an empty line.
    name: diagnose
    params: err error
    results: string
  - doc: |-
      foreignCauses returns the messages in err's tree that this SDK did not
      write — the operating system's, the decoder's, the transport's — in the
      order they appear.

      It returns nothing when the whole tree is ours. A refusal this package
      DECIDED has no foreign cause, and rendering its sentinel back would repeat,
      word for word, the sentence the reader has just been shown.

      It walks errors.Join as well as the single-unwrap chain. Stopping at the
      join was the first shape of this and it was wrong in the one case that
      composes: finalizeReplacement joins the rename's os.ErrPermission with the
      elevation's own error, so a reader got "permission denied" followed by our
      own ELEVATION_FAILED sentence — the sentence they had just read — and never
      the process result underneath it. When `sudo -n mv` fails silently, that
      result is the only thing there is.
    name: foreignCauses
    params: err error
    results: "[]string"
  - doc: collectForeign appends err's foreign messages to found, depth first.
    name: collectForeign
    params: err error, found *[]string
  - doc: |-
      truthyEnv reports whether an environment variable's value means "yes".

      The accepted set is closed and case-insensitive. Anything else — including
      a typo, and including "0"/"false" — is NOT consent: an opt-in that treats
      an unrecognised value as permission is not an opt-in.
    name: truthyEnv
    params: value string
    results: bool
  - doc: |-
      sudoMove replaces execPath with tmpPath via a non-interactive `sudo -n
      mv` — the escalation finalizeReplacement falls back to when the plain
      rename is refused for permissions, and the same one the devcontainer
      installer's conditional (`ktn.md`) uses for a root-owned target
      directory. `-n` disables the password prompt entirely: without a cached
      credential or a NOPASSWD sudoers rule it fails immediately instead of
      hanging an unattended upgrade.

      It is unexported and reached only through guardedSudoMove, so there is no
      call path that escalates without the opt-in.
    name: sudoMove
    params: tmpPath, execPath string
    results: error
  - doc: runProbe runs the binary at path with args, output discarded, within ctx.
    name: runProbe
    params: ctx context.Context, path string, args []string
    results: error
  - doc: |-
      decodeSignature turns the .sig asset's bytes into a raw ed25519 signature.

      The canonical published form is base64 (scripts/release/sign-checksums.sh
      emits one line, no wrapping), which is what survives every release tool
      that treats assets as text. A body that is EXACTLY ed25519.SignatureSize
      bytes is taken as the raw binary form instead — that check comes first and
      runs on the untrimmed bytes, because a raw signature can legitimately
      contain a byte that looks like whitespace and trimming it first would
      corrupt one signature in every few hundred.
    name: decodeSignature
    params: raw []byte
    results: signature []byte, decodeErr error
  - doc: |-
      newReleaseHTTPClient builds the client every real (non-injected) Service
      uses.

      Go's DEFAULT redirect policy allows ten hops AND allows https→http: the
      standard library only strips sensitive headers on a cross-host redirect,
      it never refuses a scheme downgrade. On this path that would put a release
      archive — code about to be given 0755 and moved over the running binary —
      on a plaintext connection chosen by the redirect target.

      pkg/license/ci.go solves the same problem by refusing redirects OUTRIGHT,
      and that is right for the endpoint it talks to: the Actions token minter
      has no legitimate redirect, so the safe answer and the correct one
      coincide. Here they do not — `github.com/.../releases/download/...` always
      redirects to the asset CDN — so the policy is the closest equivalent that
      still works: follow, but only ever to https, and only a bounded number of
      times.

      It stays a net/http client over http.DefaultTransport rather than
      pkg/v1/net/client, which ADR 0158 §2 names for HTTP: the guarded transport sets
      no Proxy, so it ignores HTTP(S)_PROXY and NO_PROXY — measured, it dialled
      the host directly where this client went through the proxy — and an update
      that cannot leave a network through its proxy never arrives on any machine
      behind one. The guarded client's policy would have to re-state this one's
      https-only hops as a request policy besides.

      The transport is a CLONE of http.DefaultTransport, never the value itself
      (issue #304). Clone keeps everything the default does, the environment's
      proxy first; what it does not keep is the connection pool, which is
      process-wide and which any code may empty — httptest.Server.Close does on
      every close, and so does CloseIdleConnections on any client with a nil
      Transport. net/http returns a connection to the idle pool before it hands a
      body-less response to the request waiting on it, so an outside close in
      that window broke this client's request in flight: the caller got "HTTP/1.x
      transport connection broken: http: CloseIdleConnections called" instead of
      the InsecureRedirect refusal the redirect would have produced. A pool of
      its own is a pool only this client closes.
    name: newReleaseHTTPClient
    results: "*http.Client"
  - doc: |-
      releaseTransport returns a transport configured as http.DefaultTransport
      is, with a connection pool nothing else in the process shares.
    name: releaseTransport
    results: "*http.Transport"
  - doc: |-
      checkReleaseRedirect is newReleaseHTTPClient's policy, kept as a named
      function so the decision is testable without standing up a redirect chain.
    name: checkReleaseRedirect
    params: req *http.Request, via []*http.Request
    results: error
  - doc: |-
      decodeJSONBody reads at most capBytes from body and unmarshals it into
      `into`, refusing anything larger rather than letting an untrusted endpoint
      choose how much memory this process spends.

      json.Decoder over a raw response body — what every call site used before —
      has no such bound: it streams until EOF. The cap is a parameter rather
      than a constant read inside so the refusal branch is reachable in a test
      without producing an 8MB fixture.

      fields are what the CALLER knows and this function cannot: which query the
      body answers, and the tag if the query named one. They are taken here
      rather than wrapped on afterwards so each of the three failures is
      classified exactly once, at the only frame that can tell a read failure
      from an over-cap body from a body that simply is not release metadata.
    name: decodeJSONBody
    params: body io.Reader, capBytes int64, into any, fields ...errs.FieldValue
    results: error
  - name: NewService
    params: version string, src SourceValue
    results: "*Service"
  - name: NewUpdaterWithDeps
    params: version string, src SourceValue, client Getter, fs FileSystem, copier Copier
    results: "*Service"
  - doc: normalizeVersion ensures a version string has the required "v" prefix.
    name: normalizeVersion
    params: v string
    results: string
  - doc: |-
      openFromTarGz walks a gzip-compressed tar stream and returns a reader over
      the first regular file whose basename matches want. The tar Reader is bound
      to the current entry; reading past EntrySize returns io.EOF.
    name: openFromTarGz
    params: body io.Reader, want string
    results: binary io.Reader, cleanup func(), openErr error
  - doc: |-
      openFromZip buffers the response body (zip requires ReaderAt) and returns
      a reader over the first file whose basename matches want. Closes the inner
      file reader via the cleanup callback.
    name: openFromZip
    params: body io.Reader, want string
    results: binary io.Reader, cleanup func(), openErr error
  - doc: |-
      closeBestEffort releases an io.Closer without failing the caller, logging
      the error with the supplied context label so an operator can correlate it
      with the failed cleanup site (zip entry, gzip reader, etc.).
    name: closeBestEffort
    params: c io.Closer, what string
  - doc: |-
      refuse reports a refusal this package reached on its own.

      The sentinel is passed as the CAUSE rather than as parameters, so
      errors.Is finds it by unwrapping as well as by (Code, Reason), and the
      fields carry every particular the public sentence deliberately leaves out.
    name: refuse
    params: sentinel *errs.Error, fields ...errs.FieldValue
    results: error
  - doc: |-
      classify reports a failure that arrived from OUTSIDE — a transport, a
      filesystem, a decoder — under the sentinel that says what it means here.

      The sentinel's Code, Reason, Public, Private and exit status are READ from
      it rather than restated at the call site. A restatement is four strings
      copied by hand with nothing checking the copy, and this package reaches
      DownloadFailed from twelve sites in five files, eight of them through here:
      the first copy to drift would give one failure two different sentences
      depending on which call path produced it.
      TestClassifyCarriesTheSentinelVerbatim is what makes that impossible rather
      than unlikely.

      When cause ALREADY carries an *errs.Error, errs.Wrap's origin-wins rule
      (ADR 0002 / SDK rule 6) keeps the cause's identity and the sentinel
      contributes only a trail entry. That is the right outcome, and it is why
      every call here can name its most specific classification without first
      checking whether the cause has one of its own.

      A nil sentinel is refused rather than dereferenced. Only a bug in this
      package can produce one, and the worst place to take a process down is the
      path that is already reporting a failure — so it degrades to what
      refuse(nil) would do, a typed INVALID_WRAP_PARAMS still carrying the cause.
      Neither sentinel.Code() nor errs.CodeOf(sentinel) is total here: a typed-nil
      *errs.Error is a non-nil error interface, so the accessor finds it in the
      chain and dereferences it exactly as the method would.
    name: classify
    params: sentinel *errs.Error, cause error, fields ...errs.FieldValue
    results: error
