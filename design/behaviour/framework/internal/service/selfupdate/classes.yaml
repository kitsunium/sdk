# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: Checksum verification constants.
    grouped: true
    items:
      - doc: checksumsAssetName is the release asset holding the sha256sum manifest.
        name: checksumsAssetName
        type: string
        value: "\"checksums.txt\""
      - doc: |-
          maxArchiveBytes caps the in-memory archive buffer. Release archives are
          ~10-30MB today; 256MB leaves ample headroom while bounding memory use
          against a hostile or corrupted download stream.
        name: maxArchiveBytes
        type: int64
        value: 256 << 20
      - doc: |-
          maxChecksumsBytes caps the checksums.txt manifest read. The real
          manifest is a few hundred bytes; 1MB is defence-in-depth.
        name: maxChecksumsBytes
        type: int64
        value: 1 << 20
      - doc: |-
          sha256HexLen is the hex-encoded length of a SHA-256 digest: 32 bytes,
          two hex characters each, so 64 characters total.
        name: sha256HexLen
        type: int
        value: "64"
    name: checksumsAssetName
  - doc: |-
      nullDevicePath is the well-known sink whose reads return EOF forever. It is a
      CHARACTER DEVICE, which is exactly why the mode test alone cannot exclude it.
    items:
      - name: nullDevicePath
        type: string
        value: "\"/dev/null\""
    name: nullDevicePath
  - doc: |-
      maxForeignCauses bounds how many foreign messages one error may contribute.

      The tree is this package's own and is two deep, so the bound is not reached
      in practice; it is here because diagnose runs on the failure path, where a
      cycle somebody else introduced must not become an unbounded string.
    items:
      - name: maxForeignCauses
        type: int
        value: "8"
    name: maxForeignCauses
  - doc: |-
      maxVendorKeys bounds the key list, as ADR 0091 bounds the entitlement
      anchors: two for a rotation, three for an interrupted one, four with
      headroom. Past it the tail is dropped and logged — a build mistake answered
      by refusing every update would strand every installation.
    items:
      - name: maxVendorKeys
        type: int
        value: "4"
    name: maxVendorKeys
  - doc: The signed statement's header lines, when a signature domain is set.
    grouped: true
    items:
      - name: statementTag
        type: string
        value: "\"# tag \""
      - name: statementExpires
        type: string
        value: "\"# expires \""
    name: statementTag
  - doc: prevSuffix names the previous binary kept beside the new one.
    items:
      - name: prevSuffix
        type: string
        value: "\".prev\""
    name: prevSuffix
  - doc: defaultProbeTimeout bounds a probe that declared none.
    items:
      - name: defaultProbeTimeout
        type: time.Duration
        value: 5 * time.Second
    name: defaultProbeTimeout
  - doc: Signature verification constants.
    grouped: true
    items:
      - doc: |-
          signatureAssetName is the release asset carrying the detached ed25519
          signature over checksums.txt. Detached rather than embedded so the
          manifest stays byte-identical to what `sha256sum` emits and the
          existing installers keep parsing it unchanged.
        name: signatureAssetName
        type: string
        value: checksumsAssetName + ".sig"
      - doc: |-
          maxSignatureBytes caps the signature asset read. A base64 ed25519
          signature is 88 characters and the raw form is 64 bytes; 4KB is
          defence-in-depth against an endpoint that answers with a page instead.
        name: maxSignatureBytes
        type: int64
        value: 4 << 10
    name: signatureAssetName
  - doc: |-
      defaultProductEnvPrefix is the environment-variable prefix used when a
      SourceValue names none. It is deliberately generic: a build that forgets to
      set Product still gets a working, if unbranded, opt-in variable rather than
      silently sharing one with every other SDK consumer on the machine.
    items:
      - name: defaultProductEnvPrefix
        type: string
        value: "\"SELFUPDATE\""
    name: defaultProductEnvPrefix
  - doc: |-
      envSuffixAutoUpgrade is appended to the product prefix for the unattended
      upgrade opt-in.
    items:
      - name: envSuffixAutoUpgrade
        type: string
        value: "\"_AUTO_UPGRADE\""
    name: envSuffixAutoUpgrade
  - doc: |-
      envSuffixAllowSudo is appended to the product prefix for the privilege
      escalation opt-in.
    items:
      - name: envSuffixAllowSudo
        type: string
        value: "\"_ALLOW_SUDO\""
    name: envSuffixAllowSudo
  - doc: Transport bounds.
    grouped: true
    items:
      - doc: |-
          maxRedirects caps the redirect chain. GitHub answers a release asset
          download with one redirect to objects.githubusercontent.com, so a
          handful of hops is generous; Go's default of 10 is not a bound anyone
          chose for this.
        name: maxRedirects
        type: int
        value: "5"
      - doc: |-
          maxAPIBodyBytes caps a GitHub REST response. The archive path was
          already capped (maxArchiveBytes) while the JSON path was not, so a
          hostile or broken endpoint could stream unbounded bytes into
          json.Decoder. A /releases page is a few hundred kilobytes.
        name: maxAPIBodyBytes
        type: int64
        value: 8 << 20
    name: maxRedirects
  - doc: Service constants for GitHub API, versioning, and file operations.
    grouped: true
    items:
      - doc: apiURL is the GitHub releases API endpoint for latest stable release.
        name: apiURL
        type: string
        value: "\"https://api.github.com/repos/%s/%s/releases/latest\""
      - doc: releasesURL is the GitHub releases API endpoint for all releases.
        name: releasesURL
        type: string
        value: "\"https://api.github.com/repos/%s/%s/releases\""
      - doc: releaseByTagURL is the GitHub API endpoint for a specific release tag.
        name: releaseByTagURL
        type: string
        value: "\"https://api.github.com/repos/%s/%s/releases/tags/%s\""
      - doc: downloadURL is the release asset download URL pattern.
        name: downloadURL
        type: string
        value: "\"https://github.com/%s/%s/releases/download/%s/%s\""
      - doc: httpTimeout is the timeout for HTTP requests.
        name: httpTimeout
        type: time.Duration
        value: 30 * time.Second
      - doc: executablePerm is the permission for executable files.
        name: executablePerm
        type: os.FileMode
        value: "0o755"
      - doc: CandidateListSentinel is the sentinel value for --candidate without a tag.
        name: CandidateListSentinel
        type: string
        value: "\"__list__\""
    name: apiURL
