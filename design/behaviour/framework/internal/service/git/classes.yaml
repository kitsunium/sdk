# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      wholeFileEnd is the synthetic upper bound used for a whole-file change (new
      or untracked file), so ContainsLine matches any line in such a file without
      the parser needing to know the file's true length.
    items:
      - name: wholeFileEnd
        type: int
        value: 1 << 30
    name: wholeFileEnd
  - doc: |-
      changedFilesHint pre-sizes the changed-set maps. A typical branch touches a
      handful of files; this avoids the first few rehashes without over-allocating.
    items:
      - name: changedFilesHint
        type: int
        value: "16"
    name: changedFilesHint
  - doc: |-
      minHunkFields is the minimum whitespace-separated token count of a well-formed
      unified-diff hunk header ("@@", "-a,b", "+c,d").
    items:
      - name: minHunkFields
        type: int
        value: "3"
    name: minHunkFields
  - doc: |-
      nameStatusSingleWidth is the token width of a single-path name-status record
      (status + path) in the `git diff --name-status -z` wire format.
    items:
      - name: nameStatusSingleWidth
        type: int
        value: "2"
    name: nameStatusSingleWidth
  - doc: |-
      nameStatusRenameWidth is the token width of a rename/copy name-status record
      (status + old path + new path).
    items:
      - name: nameStatusRenameWidth
        type: int
        value: "3"
    name: nameStatusRenameWidth
  - doc: |-
      nameStatusNewPathOffset is the offset of the rename/copy NEW path within its
      record (after the status and the old path).
    items:
      - name: nameStatusNewPathOffset
        type: int
        value: "2"
    name: nameStatusNewPathOffset
  - doc: |-
      gitEntry is the name of the `.git` entry a worktree carries: a directory in
      an ordinary repository, a `gitdir:` pointer FILE in a linked worktree or a
      submodule. Its identity is one half of the memo's validity condition.
    items:
      - name: gitEntry
        type: string
        value: "\".git\""
    name: gitEntry
  - doc: |-
      committerPrefix opens the header line of a commit object that carries the
      committer's identity and date.
    items:
      - name: committerPrefix
        type: string
        value: "\"committer \""
    name: committerPrefix
  - doc: "tzDigits is the length of a git timezone offset without its sign: \"0200\"."
    items:
      - name: tzDigits
        type: int
        value: "4"
    name: tzDigits
  - doc: secondsPerMinute and minutesPerHour turn an "hhmm" offset into seconds.
    grouped: true
    items:
      - name: secondsPerMinute
        type: int
        value: "60"
      - name: minutesPerHour
        type: int
        value: "60"
    name: secondsPerMinute
  - doc: |-
      decimalBase and int64Bits are the arguments strconv.ParseInt needs to read
      a Unix timestamp.
    grouped: true
    items:
      - name: decimalBase
        type: int
        value: "10"
      - name: int64Bits
        type: int
        value: "64"
    name: decimalBase
  - doc: |-
      originHEAD is the remote-tracking symbolic ref that names the default branch.
      It is spelled in full rather than as "origin/HEAD" so rev-parse resolves the
      remote-tracking ref and cannot be steered onto a refs/origin/HEAD a
      repository planted higher in its search order.
    items:
      - name: originHEAD
        type: string
        value: "\"refs/remotes/origin/HEAD\""
    name: originHEAD
  - doc: |-
      separator is the OS path separator as a string, for the prefix and suffix
      tests that rewrite one spelling of the repository root into the other.
    items:
      - name: separator
        type: string
        value: string(filepath.Separator)
    name: separator
files:
  - decls:
      - wholeFileEnd
      - changedFilesHint
      - ChangedSetValue
      - NewChangedSetValue
      - newChangedSetValue
      - childPrefix
      - (*ChangedSetValue).spelledAs
      - (*ChangedSetValue).addLineRange
      - (*ChangedSetValue).addWholeFile
      - (*ChangedSetValue).markTouched
      - (*ChangedSetValue).ContainsLine
      - (*ChangedSetValue).ContainsFile
      - (*ChangedSetValue).ContainsDir
      - (*ChangedSetValue).IsEmpty
    name: changed_set.go
  - decls:
      - _
    name: changed_set_compliance.go
  - decls:
      - Config
      - IncludeFunc
    name: config.go
  - decls:
      - minHunkFields
      - nameStatusSingleWidth
      - nameStatusRenameWidth
      - nameStatusNewPathOffset
      - fileBlock
      - parseUnifiedDiff
      - updatePaths
      - flushFile
      - applyHunk
      - markPath
      - scopedAbs
      - cutAnyPrefix
      - newPathFrom
      - oldPathFrom
      - trimHeaderTab
      - parseNameStatus
      - parseHunkPlusRange
      - plusToken
      - parseStartCount
    name: diff_parse.go
  - decls: []
    name: doc.go
  - decls:
      - hardenedGitConfig
      - extDiffGuard
      - runGitOutput
      - runGitBlob
      - blobFailure
      - gitProbe
    name: exec.go
  - decls:
      - gitEntry
      - gitDirCache
      - gitDirMemo
      - GitDir
      - memoizedGitDir
      - gitDirMemo.stillTrue
      - sameEntry
      - lstatOrNil
    name: gitdir.go
  - decls:
      - committerPrefix
      - tzDigits
      - secondsPerMinute
      - decimalBase
      - HeadValue
      - Head
      - headFailure
      - committerTime
      - parseSignature
      - parseOffset
      - filterGuard
    name: head.go
  - decls:
      - originHEAD
      - separator
      - defaultBranchCandidates
      - fullFallback
      - Resolve
      - repoTopLevel
      - spelledTopLevel
      - trimRepoTail
      - shallowState
      - resolveBaseRef
      - mergeBase
      - collectChanges
      - addDiff
      - addNameStatus
      - addUntracked
    name: resolve.go
  - decls:
      - ShowFile
      - pathAbsent
    name: show.go
functions:
  - name: NewChangedSetValue
    params: repoRoot string
    results: "*ChangedSetValue"
  - doc: |-
      newChangedSetValue returns an empty changed-set rooted at git's absolute
      repository top-level, and recording aliasRoot as a second, equally valid
      spelling of it. An empty aliasRoot means the two spellings coincide.
    name: newChangedSetValue
    params: repoRoot, aliasRoot string
    results: "*ChangedSetValue"
  - doc: |-
      childPrefix returns the prefix every path strictly below dir carries.

      It is dir plus a separator, EXCEPT where dir already ends in one — which is
      what a filesystem root is, "/" on Unix and `C:\` on Windows. Appending there
      produces "//", a prefix no cleaned path carries, so a repository rooted at
      the filesystem root would mirror nothing at all. The separator cannot simply
      be dropped either: "/repo" without it also prefixes "/repo-other/a.go", which
      is a different tree.
    name: childPrefix
    params: dir string
    results: string
  - doc: |-
      parseUnifiedDiff feeds the "+"-side line ranges of a `git diff -U0 -M -C`
      payload into set. New/renamed paths are attributed to their post-edit path;
      deletions and pure renames mark the file/package touched without line ranges.
      Generated files (per include) are skipped entirely so a `make generate` churn
      never floods diff mode.
    name: parseUnifiedDiff
    params: diff, root string, set *ChangedSetValue, include IncludeFunc
  - doc: |-
      updatePaths interprets a diff header line and returns the (possibly updated)
      post-edit target and pre-edit oldPath. Non-header lines pass through unchanged.
    name: updatePaths
    params: line, target, oldPath string
    results: newTarget, newOld string
  - doc: |-
      flushFile records touched-only state for a file block that produced no +side
      hunk (pure rename, copy, mode change) and for the old side of a deletion or
      rename, so file- and package-scoped rules surface while line-scoped rules do
      not.
    name: flushFile
    params: set *ChangedSetValue, root string, include IncludeFunc, blk fileBlock
  - doc: |-
      applyHunk parses one @@ header and, when it adds lines to a scoped target,
      records the range. Returns true when a range was recorded.
    name: applyHunk
    params: line, target, root string, set *ChangedSetValue, include IncludeFunc
    results: bool
  - doc: |-
      markPath records relPath (and its directory) as touched when the caller's
      filter admits it, with no associated line range.
    name: markPath
    params: set *ChangedSetValue, relPath, root string, include IncludeFunc
  - doc: |-
      scopedAbs resolves a diff-relative path to an absolute path and reports
      whether the caller's filter admits it. A nil filter admits everything.
    name: scopedAbs
    params: relPath, root string, include IncludeFunc
    results: abs string, ok bool
  - doc: cutAnyPrefix strips whichever of two prefixes line carries, reporting which.
    name: cutAnyPrefix
    params: line, primary, secondary string
    results: rest string, ok bool
  - doc: |-
      newPathFrom extracts the post-edit path from a "+++ " header value. The bool
      is false for a deletion ("+++ /dev/null"), pairing the empty string so it is
      never an ambiguous lone-string sentinel.
    name: newPathFrom
    params: raw string
    results: path string, isFile bool
  - doc: |-
      oldPathFrom extracts the pre-edit path from a "--- " header value, returning
      the fallback for a new file ("--- /dev/null").
    name: oldPathFrom
    params: raw, fallback string
    results: string
  - doc: |-
      trimHeaderTab strips the trailing TAB git appends to a "---"/"+++" header
      path that contains a space ("+++ b/with space.go\t"), the traditional-diff
      delimiter for the optional timestamp field. Without this strip the path keeps
      a trailing TAB, so the caller's filter sees a name no test matches and the
      spaced filename silently loses its line ranges.
    name: trimHeaderTab
    params: raw string
    results: string
  - doc: |-
      parseNameStatus folds a `git diff --name-status -z` payload into set as
      file/directory membership (no line ranges). The -z wire format is NUL-separated
      and never c-quoted, so paths carrying spaces, tabs, newlines, or non-ASCII
      bytes arrive verbatim — this pass is the authoritative changed-file list and
      guarantees a file whose unified-diff header the parser cannot resolve
      (residual c-quoting) is still recorded as file-touched, never silently
      dropped. Records are `<status>NUL<path>NUL`, with renames/copies carrying two
      paths: `R100NUL<old>NUL<new>NUL`.
    name: parseNameStatus
    params: payload, root string, set *ChangedSetValue, include IncludeFunc
  - doc: |-
      parseHunkPlusRange parses the "+"-side of a unified-diff hunk header
      ("@@ -a,b +c,d @@") into an inclusive 1-based range. ok is false when the
      header is malformed or the +side adds zero lines (a pure deletion hunk).
    name: parseHunkPlusRange
    params: line string
    results: rng coregit.LineRangeValue, ok bool
  - doc: |-
      plusToken returns the "+"-side token of a hunk header (with the '+' stripped),
      reporting whether one was found. Per unified-diff grammar the range region is
      "@@ -a,b +c,d @@"; the scan is restricted to the tokens between the two "@@"
      sentinels so a function-context annotation after the closing "@@" that
      happens to start with '+' can never be picked up as a range token.
    name: plusToken
    params: fields []string
    results: token string, ok bool
  - doc: |-
      parseStartCount splits a unified-diff side token "c,d" (or "c") into its start
      line and line count. A missing count defaults to 1 per diff grammar. ok is
      false when either number fails to parse.
    name: parseStartCount
    params: token string
    results: start, count int, ok bool
  - doc: |-
      extDiffGuard returns args with --no-ext-diff inserted directly after the
      subcommand when that subcommand honours diff.external, and unchanged
      otherwise.

      It takes the git subcommand and its arguments, and returns them with the
      flag injected when applicable.
    name: extDiffGuard
    params: args []string
    results: "[]string"
  - doc: |-
      runGitOutput executes a git subcommand inside repo and returns trimmed
      stdout. stderr is captured and folded into the returned error so a failed
      invocation is debuggable without a silent discard.

      Every invocation carries hardenedGitConfig so a hostile `.git/config` in the
      target repository cannot turn a read-only query into code execution.
    name: runGitOutput
    params: ctx context.Context, repo string, args ...string
    results: gitOutput string, err error
  - doc: |-
      runGitBlob is runGitOutput without the trim: it returns stdout verbatim, and
      hands the failure back unwrapped so the caller can decide which refusal it is.

      The trim is right for every probe in this package — a SHA, a ref name, a
      top-level path all arrive with a trailing newline nobody wants. It is wrong
      for a file's contents, where leading and trailing whitespace is the file's,
      and where a whitespace-only blob would otherwise come back empty.

      The error is NOT typed here, unlike everywhere else in this file. A blob read
      fails for two reasons a caller has to tell apart — the commit is unreachable,
      or the path is absent from it — and only the caller knows which probes
      separate them. It returns the exec error and git's stderr tail, and
      blobFailure below turns that pair into whichever sentinel applies.
    name: runGitBlob
    params: ctx context.Context, repo string, args ...string
    results: blob, stderrTail string, err error
  - doc: |-
      blobFailure types a failed blob read as CommandFailed, with the subcommand
      and git's stderr in Private where a branch name or a path is not wire-visible.
    name: blobFailure
    params: cause error, stderrTail string, args ...string
    results: error
  - doc: |-
      gitProbe runs a git subcommand purely for its success/failure signal,
      discarding stdout. Used by boolean probes (is-shallow, ref existence) where
      the exit code is the answer.
    name: gitProbe
    params: ctx context.Context, repo string, args ...string
    results: bool
  - name: GitDir
    params: ctx context.Context, root string
    results: gitDir string, err error
  - doc: |-
      memoizedGitDir returns the memoized git directory for an already-cleaned
      absolute root, and whether it is still true.
    name: memoizedGitDir
    params: abs string
    results: dir string, ok bool
  - doc: |-
      sameEntry reports whether two lstat results describe the same filesystem
      object, treating two absences as equal — an entry that was absent and still
      is has not changed, and that is the ordinary state of a root below the
      worktree top level.
    name: sameEntry
    params: before, now fs.FileInfo
    results: bool
  - doc: |-
      lstatOrNil returns the lstat of path, or nil when it cannot be read. It does
      not follow a symbolic link, because a `.git` that became one is a change of
      the entry itself and not of whatever it now points at.
    name: lstatOrNil
    params: path string
    results: fs.FileInfo
  - name: Head
    params: ctx context.Context, dir string
    results: head HeadValue, err error
  - doc: |-
      headFailure decides which refusal a failed HEAD resolution is.

      It is decided by a probe, not by reading git's stderr, whose wording is
      localised and unversioned — the same rule ShowFile follows. The probe runs
      only on the failure path.
    name: headFailure
    params: ctx context.Context, dir string, cause error
    results: error
  - doc: |-
      committerTime reads the committer date out of a raw commit object: the
      header line "committer Name <email> 1727270400 +0200", whose last two fields
      are the Unix time and the offset it was recorded in.

      The name is free text and the email is between angle brackets, so the two
      fields are taken from after the LAST '>' rather than by splitting on spaces.
      Header lines end at the first empty line; a continuation line (a signature,
      a mergetag) starts with a space and never with "committer ".
    name: committerTime
    params: commit string
    results: at time.Time, ok bool
  - doc: |-
      parseSignature reads "Name <email> seconds ±hhmm" into a time in its
      recorded offset.
    name: parseSignature
    params: identity string
    results: at time.Time, ok bool
  - doc: |-
      parseOffset reads a git timezone offset, "+0200" or "-0530", into seconds
      east of UTC.
    name: parseOffset
    params: zone string
    results: seconds int, ok bool
  - doc: |-
      filterGuard returns the -c overrides that make every filter driver the
      repository's configuration defines no filter at all, for the one command
      Head runs that reads worktree content.

      git status converts a tracked file whose stat changed through its clean
      filter — or its long-running process filter — to compare it with the index,
      and a filter is a command a .git/config names. The hardened runner already
      empties core.fsmonitor for the same reason; a filter cannot be emptied the
      same way without its name, so the names are read first (reading the
      configuration runs nothing) and each driver's clean and process commands
      are set to "", which git treats as no filter. -c beats every config file.

      A driver whose name holds '=' cannot be written as a -c key: that
      configuration is refused with CommandFailed rather than read around.
    name: filterGuard
    params: ctx context.Context, dir string
    results: guard []string, err error
  - doc: |-
      fullFallback builds a ResolutionValue signalling the degrade, with the given
      reason. Nil Set + FullFallback=true is the contract a caller checks to treat
      everything as in scope.
    name: fullFallback
    params: reason string
    results: coregit.ResolutionValue
  - name: Resolve
    params: ctx context.Context, cfg Config
    results: coregit.ResolutionValue
  - doc: |-
      repoTopLevel resolves the repository root from a hint directory; an empty
      hint resolves from the process working directory.

      It answers with TWO spellings of one directory. canonical is git's own
      --show-toplevel, in the operating system's path form, which every recorded
      path is built from. asSpelled is the same directory named the way the caller
      named it, and is empty unless the caller's spelling differs from git's — a
      symbolic link git resolved away, or on Windows an 8.3 short name git
      expanded — so without it a caller whose paths use that spelling queries a
      set keyed under a root it never spells.
    name: repoTopLevel
    params: ctx context.Context, hint string
    results: canonical, asSpelled string, ok bool
  - doc: |-
      spelledTopLevel returns the repository top-level named the way the caller
      named it, or "" when the caller's path already reaches it directly.

      The only EvalSymlinks this package performs happen here, and only when the
      hint is not already inside the canonical root — which is the ordinary case,
      so the ordinary case pays nothing. What they buy is an O(1) prefix rewrite
      on every later query instead of a syscall per query.

      Both sides are resolved before they are compared. The hint, because that is
      where the caller's indirection lives. The canonical root, because what git
      resolves is git's business and differs by platform: on Windows it expands an
      8.3 short name (`RUNNER~1`, which is how %TEMP% is spelled on a CI runner)
      and EvalSymlinks does too, but whether it follows a link is the git build's
      choice. Comparing git's answer to a fully resolved hint would name no alias
      whenever the two stopped at different places.
    name: spelledTopLevel
    params: absHint, canonical string
    results: alias string, ok bool
  - doc: |-
      trimRepoTail removes from clean the path the resolved hint holds below
      canonical, leaving the caller's spelling of the top level. It returns ""
      when the resolved hint is not under canonical, or when the tail is not
      literally present in the caller's spelling — which is the case where the
      indirection sits inside the last components and no prefix can describe it.
    name: trimRepoTail
    params: clean, canonical, resolved string
    results: alias string, ok bool
  - doc: |-
      shallowState reports whether the repository is a shallow clone, and whether
      the probe answered at all.

      Those are two facts and only one of them is safe to guess. A probe that
      fails — a git too old for the flag, a git that is not there, a repository
      that became unreadable between two invocations — has told us nothing, and
      nothing is not "full history": reading it that way hands back a set scoped
      against history that was truncated. known=false is what makes Resolve
      degrade instead of computing a diff it cannot trust.
    name: shallowState
    params: ctx context.Context, root string
    results: shallow, known bool
  - doc: |-
      resolveBaseRef resolves the default-branch ref, preferring the symbolic
      origin/HEAD and falling back to a fixed candidate list.
    name: resolveBaseRef
    params: ctx context.Context, root string
    results: string, bool
  - doc: mergeBase returns the merge-base commit between baseRef and HEAD.
    name: mergeBase
    params: ctx context.Context, root, baseRef string
    results: string, bool
  - doc: |-
      collectChanges populates set from the four diff sources that together define
      "changed vs the default branch": committed (merge-base→HEAD), staged
      (index), unstaged (working tree), and untracked files. Any git failure or
      timeout is returned so the caller can degrade loudly to a full scan rather
      than surface a partial (silently under-reported) changed-set.
    name: collectChanges
    params: ctx context.Context, root, baseSHA string, set *ChangedSetValue, include IncludeFunc
    results: error
  - doc: |-
      addDiff folds one diff source into set in two passes: first the NUL-separated
      `git diff --name-status -z` file list (authoritative file/package membership,
      robust to any filename), then the unified `git diff -U0 -M -C` payload solely
      for "+"-side line ranges. A genuine git failure (bad ref, killed by the
      context deadline) is returned; an empty diff (no changes, exit 0) contributes
      nothing and is not an error.
    name: addDiff
    params: ctx context.Context, root string, set *ChangedSetValue, include IncludeFunc, extraArgs ...string
    results: error
  - doc: |-
      addNameStatus runs `git diff --name-status -z -M -C <extraArgs...>` and folds
      the NUL-separated file list into set as file/package membership (no line
      ranges — those come from the unified-diff pass). A genuine git failure (or
      timeout) is returned; an empty list (exit 0) contributes nothing and is not
      an error.
    name: addNameStatus
    params: ctx context.Context, root string, set *ChangedSetValue, include IncludeFunc, extraArgs ...string
    results: error
  - doc: |-
      addUntracked adds untracked, non-ignored files as whole-file changes. A git
      failure (or timeout) is returned; no untracked files (exit 0) is not an error.
    name: addUntracked
    params: ctx context.Context, root string, set *ChangedSetValue, include IncludeFunc
    results: error
  - name: ShowFile
    params: ctx context.Context, repoRoot, sha, relPath string
    results: content string, err error
  - doc: |-
      pathAbsent reports whether a failed `git show <sha>:./<path>` failed because
      the tree at sha holds no object at that path.

      It is two questions and both have to be asked. `cat-file -e` answers "no such
      object" the same way for a commit that does not resolve and for a path that
      is not in it, so an unreachable sha would otherwise be reported as a missing
      file and a caller would retry with a different path forever.
    name: pathAbsent
    params: ctx context.Context, repoRoot, sha, spec string
    results: bool
imports:
  bytes: bytes
  context: context
  coregit: github.com/kitsunium/sdk/framework/internal/core/git
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  exec: os/exec
  filepath: path/filepath
  fs: io/fs
  os: os
  slices: slices
  strconv: strconv
  strings: strings
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/framework/internal/service/git
  name: git
  purpose: "Package git — the changed set: which files, line ranges and directories a branch touched."
types:
  - fields:
      - doc: repoRoot is the absolute repository top-level, retained for diagnostics.
        name: repoRoot
        type: string
      - doc: |-
          lineRangesByFile maps an absolute file path to its changed "+"-side line
          ranges. Empty for a pure rename or a deletion (file touched, no lines).
        name: lineRangesByFile
        type: map[string][]coregit.LineRangeValue
      - doc: touchedFiles is the set of absolute file paths that appear in the diff.
        name: touchedFiles
        type: map[string]struct{}
      - doc: |-
          touchedDirs is the set of absolute directories enclosing touched files,
          the predicate for directory-scoped queries.
        name: touchedDirs
        type: map[string]struct{}
      - doc: |-
          aliasRoot is a second spelling of repoRoot — the one the caller used to
          reach the repository, when that path traverses a symbolic link git
          resolved away. Empty when the caller's spelling already is git's. It is
          read only while the set is being built: every entry is recorded under
          both spellings, so no query pays for it.
        name: aliasRoot
        type: string
    kind: struct
    methods:
      - doc: |-
          spelledAs returns the path absPath carries under the caller's own spelling of
          the repository root, and whether there is one.

          Every path recorded here is built from git's canonical top-level, because
          that is what --show-toplevel answers. A caller that reached the repository
          through a symbolic link spells its own paths through that link, and
          filepath.Clean is lexical, so the two never meet: every query answers false,
          on a resolution that is neither degraded nor empty — a whole branch read as
          unchanged, which is the one answer this package must never give.

          The second spelling is recorded at BUILD time rather than resolved at query
          time, and that is the whole placement argument: the alias is known once, when
          the set is constructed, while queries are unbounded — a caller asks
          ContainsLine once per diagnostic. Paying here keeps the read path exactly
          what framework/internal/service/git/BENCH.md measured: a map lookup, no branch on
          the alias, and zero allocations.
        name: spelledAs
        params: absPath string
        recv: s *ChangedSetValue
        results: aliased string, ok bool
      - doc: |-
          addLineRange records a changed line range on absFile and marks the file and
          its directory as touched.
        name: addLineRange
        params: absFile string, rng coregit.LineRangeValue
        recv: s *ChangedSetValue
      - doc: |-
          addWholeFile records a whole-file change (new / untracked file): every line
          is in the diff.
        name: addWholeFile
        params: absFile string
        recv: s *ChangedSetValue
      - doc: |-
          markTouched records absFile and its directory as touched WITHOUT adding any
          line range — used for pure renames and deletions so file- and directory-scoped
          queries still answer while line-scoped ones do not.
        name: markTouched
        params: absFile string
        recv: s *ChangedSetValue
      - name: ContainsLine
        params: absFile string, line int
        recv: s *ChangedSetValue
        results: bool
      - name: ContainsFile
        params: absFile string
        recv: s *ChangedSetValue
        results: bool
      - name: ContainsDir
        params: absDir string
        recv: s *ChangedSetValue
        results: bool
      - name: IsEmpty
        recv: s *ChangedSetValue
        results: bool
    name: ChangedSetValue
  - fields:
      - doc: |-
          Root is a directory inside the repository to resolve from. Empty resolves
          from the process working directory.
        name: Root
        type: string
      - doc: |-
          Include decides which files belong in the changed set. Nil admits all.

          This is where a caller states the policy the source implementation had
          hard-coded: a Go linter passes a test for a ".go" suffix and a
          generated-file probe; a documentation tool passes something else; a tool
          that wants everything passes nil.
        name: Include
        type: IncludeFunc
    kind: struct
    name: Config
  - kind: named
    name: IncludeFunc
    underlying: func(absPath string) bool
  - doc: |-
      fileBlock is the per-file parser state accumulated while scanning one
      "diff --git" block: the post-edit path, the pre-edit path, and whether any
      +side hunk was seen.
    fields:
      - name: target
        type: string
      - name: oldPath
        type: string
      - name: hadHunk
        type: bool
    kind: struct
    name: fileBlock
  - doc: |-
      gitDirMemo is one memoized resolution: the git directory, plus the two
      filesystem facts that make it still the answer.

      A memo with no validity condition is not a cache, it is an assertion that
      the filesystem does not change — and the two ways it changes under a
      long-lived process are both cheap to notice.
    fields:
      - doc: dir is the resolved absolute git directory.
        name: dir
        type: string
      - doc: |-
          entry is the lstat of <root>/.git at resolution time, or nil when the
          root carried no .git entry at all — which is the ordinary case for a
          root that lies below the worktree top level.
        name: entry
        type: fs.FileInfo
      - doc: |-
          resolved is the lstat of dir itself, so a git directory that moved or
          was removed invalidates the memo even when <root>/.git is untouched.
        name: resolved
        type: fs.FileInfo
    kind: struct
    methods:
      - doc: stillTrue reports whether this memo still describes the filesystem under abs.
        name: stillTrue
        params: abs string
        recv: m gitDirMemo
        results: bool
    name: gitDirMemo
  - fields:
      - doc: |-
          Time is the commit's committer date, in the offset it was recorded
          with — what `git log --format=%cI` prints.
        name: Time
        type: time.Time
      - doc: Revision is the full object name of the commit HEAD resolves to.
        name: Revision
        type: string
      - doc: |-
          Modified reports that a TRACKED file differs from HEAD, staged or not.
          An untracked file does not count: it is not part of what the commit
          describes, and a build stamp that turned dirty whenever an editor left
          a swap file would say nothing. This is narrower than the vcs.modified
          Go stamps into a binary, which counts untracked files too.
        name: Modified
        type: bool
    kind: struct
    name: HeadValue
vars:
  - doc: |-
      _ asserts at compile time that the concrete changed set still implements the
      core port, so a renamed method fails here rather than at a consumer's call
      site.
    items:
      - name: _
        type: coregit.ChangedSet
        value: (*ChangedSetValue)(nil)
    name: _
  - doc: |-
      hardenedGitConfig neutralises the git configuration keys that make a git
      child process execute an arbitrary command chosen by the repository it is
      pointed at.

      This matters because the MCP daemon runs git against whatever repository the
      user opened, and `.git/config` travels with a clone. A planted key therefore
      runs code as the daemon user on an operation the user believes is read-only.

      Both entries below were demonstrated, not assumed. Against a repository with
      the key set to a script, the daemon's own invocations
      (`diff -U0 -M -C`, `status --porcelain`) executed it 5 times; with these two
      overrides in place, 0 times:

        - core.fsmonitor: git runs it to enumerate changed paths, on status and diff.
          Disabled here by setting it empty; -c beats every config file, so the
          target repository cannot re-enable it.
        - diff.external: git runs it in place of its own diff implementation.
          This one is NOT disabled with -c. Setting diff.external to the empty
          string does not disable it — git tries to execute "" and aborts with
          `cannot run : No such file or directory` / `external diff died`, which
          breaks diff outright. The documented lever is the --no-ext-diff flag,
          injected per-subcommand by extDiffGuard below.

      Deliberately NOT included, to avoid hardening against nothing:
        - core.pager: tested, does not execute — git detects the non-TTY and skips paging.
        - diff.<driver>.textconv: did not fire on any invocation this package makes.
        - core.hooksPath: none of these subcommands run hooks.
        - credential.helper / core.sshCommand / protocol.*: network operations only,
          and this package performs none.

      A third group was added after the first two, and it executes nothing: the
      four keys that choose the a//b/ prefixes of a unified-diff header. They do
      not run code, they make the parser read a path that is not the file's, and
      the symptom is the one this package exists to prevent — a changed line that
      answers false. Measured against a repository carrying each key, on the diff
      this package actually runs:

      	diff.srcPrefix=SRC/ + diff.dstPrefix=DST/  ContainsFile true, ContainsLine FALSE
      	diff.mnemonicPrefix=true (index/worktree)  ContainsFile true, ContainsLine FALSE
      	diff.noprefix=true                         both true — "a.txt" survives the
      	                                           "b/" strip by coincidence, so it
      	                                           is neutralised for the coincidence
      	                                           rather than for the symptom

      ContainsFile survives all three because the NUL-separated name-status pass
      carries no prefixes at all; only the line ranges are lost. diff.noprefix wins
      over diff.srcPrefix/diff.dstPrefix, so pinning the two prefixes is not enough
      on its own and all four are set.
    grouped: true
    items:
      - name: hardenedGitConfig
        type: "[]string"
        value: |-
          []string{
          		//: core.quotepath=off makes git print non-ASCII path bytes verbatim
          		//: instead of c-quoting them ("caf\303\251.go" wrapped in double
          		//: quotes), which would defeat the a//b/ prefix-stripping and the .go
          		//: suffix check in the diff/ls-files parsers and silently drop the file
          		//: from the changed-set. Control characters (tab, newline, quote) are
          		//: still quoted — the NUL-separated name-status/-z passes cover those
          		//: residual cases.
          		"-c", "core.quotepath=off",
          		"-c", "core.fsmonitor=",
          		//: No subcommand this package runs consults a hook — diff, status,
          		//: ls-files, rev-parse and merge-base are all read-only. It is set
          		//: anyway so the guarantee does not depend on that list staying
          		//: read-only: the next person to add a subcommand here should not have
          		//: to re-derive which ones execute hooks. internal/worktree, which does
          		//: commit, needs it for real.
          		"-c", "core.hooksPath=",
          		//: The four keys that choose a unified-diff header's path prefixes.
          		//: They execute nothing; they make "+++ b/x.go" arrive as "+++ w/x.go"
          		//: or "+++ DST/x.go", which the b/ strip leaves intact, so the line
          		//: ranges are filed under a path no caller will ever query. Pinned to
          		//: git's documented defaults rather than disabled, because "a/" and
          		//: "b/" are what the parser is written against. diff.noprefix is set
          		//: first in spirit and last in effect: it overrides the two explicit
          		//: prefixes, so neutralising them without it changes nothing.
          		"-c", "diff.noprefix=false",
          		"-c", "diff.mnemonicPrefix=false",
          		"-c", "diff.srcPrefix=a/",
          		"-c", "diff.dstPrefix=b/",
          	}
      - doc: |-
          extDiffSubcommands lists the git subcommands that honour diff.external
          and therefore need the --no-ext-diff flag. Other subcommands reject the
          flag outright, so it cannot simply be appended to every invocation.
        name: extDiffSubcommands
        type: map[string]bool
        value: |-
          map[string]bool{
          		"diff": true,
          		"show": true,
          		"log":  true,
          	}
    name: hardenedGitConfig
  - doc: |-
      gitDirCache memoizes GitDir results per cleaned absolute root so the caller
      pays the `git rev-parse --git-dir` subprocess once per root for as long as
      the answer stays true. Entries are gitDirMemo values; anything else found
      here is distrusted and recomputed.
    items:
      - name: gitDirCache
        type: sync.Map
    name: gitDirCache
  - grouped: true
    items:
      - doc: |-
          defaultBranchCandidates are the fallback refs tried, in order, when
          origin/HEAD does not resolve the default branch symbolically.
        name: defaultBranchCandidates
        value: "[]string{\"origin/main\", \"origin/master\", \"main\", \"master\"}"
      - doc: |-
          diffBaseArgs is the fixed `git diff` argument prefix shared by every diff
          source: minimal context (-U0) with rename (-M) and copy (-C) detection.
        name: diffBaseArgs
        value: "[]string{\"diff\", \"-U0\", \"-M\", \"-C\"}"
      - doc: |-
          nameStatusBaseArgs is the fixed argument prefix of the membership pass:
          NUL-separated (-z), never c-quoted file statuses with the same rename
          (-M) and copy (-C) detection as diffBaseArgs, immune to exotic filenames
          (spaces, tabs, newlines, non-ASCII) that defeat unified-diff headers.
        name: nameStatusBaseArgs
        value: "[]string{\"diff\", \"--name-status\", \"-z\", \"-M\", \"-C\"}"
    name: defaultBranchCandidates
