        kind: internal
      - id: time.Unix(seconds, 0).In
        kind: value
    steps:
      - bind: _, stamp, closed
        eval: strings.CutLast(identity, ">")
        to: strings
      - opt:
          do:
            - return: time.Time{}, false
          when: "!closed"
      - bind: fields
        eval: strings.Fields(stamp)
        to: strings
      - opt:
          do:
            - return: time.Time{}, false
          when: len(fields) != 2
      - bind: seconds, secondsErr
        eval: strconv.ParseInt(fields[0], decimalBase, int64Bits)
        to: strconv
      - bind: offset, offsetOK
        eval: parseOffset(fields[1])
        to: parseOffset
      - opt:
          do:
            - return: time.Time{}, false
          when: secondsErr != nil || !offsetOK
      - return: time.Unix(seconds, 0).In(time.FixedZone("", offset)), true
        to: time.Unix(seconds, 0).In
  - of: parseOffset
    participants:
      - id: caller
        kind: actor
      - id: parseOffset
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, false
          when: len(zone) != tzDigits+1 || (zone[0] != '+' && zone[0] != '-')
      - bind: hours, hoursErr
        eval: strconv.Atoi(zone[1:3])
        to: strconv
      - bind: minutes, minutesErr
        eval: strconv.Atoi(zone[3:])
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: hoursErr != nil || minutesErr != nil || hours < 0 || minutes < 0 || minutes >= minutesPerHour
      - set: seconds
        value: (hours*minutesPerHour + minutes) * secondsPerMinute
      - opt:
          do:
            - return: "-seconds, true"
          when: zone[0] == '-'
      - return: seconds, true
  - of: filterGuard
    participants:
      - id: caller
        kind: actor
      - id: filterGuard
        kind: self
      - id: runGitOutput
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - bind: keys, listErr
        eval: runGitOutput(ctx, dir, "config", "--list", "--name-only")
        to: runGitOutput
      - opt:
          do:
            - return: nil, listErr
          when: listErr != nil
      - bind: seen
        eval: map[string]bool{}
      - loop:
          do:
            - bind: rest, isFilter
              eval: strings.CutPrefix(key, "filter.")
              to: strings
            - bind: cut
              eval: strings.LastIndexByte(rest, '.')
              to: strings
            - opt:
                do:
                  - continue: true
                when: "!isFilter || cut <= 0 || seen[rest[:cut]]"
            - bind: name
              eval: rest[:cut]
            - opt:
                do:
                  - return: |-
                      nil, errs.Wrap(coregit.CommandFailed, errs.WrapParams{},
                      				errs.String("problem", "a filter driver name holds '=', which git -c cannot address"))
                when: strings.Contains(name, "=")
            - set: seen[name]
              value: "true"
            - set: guard
              value: append(guard, "-c", "filter."+name+".clean=", "-c", "filter."+name+".process=")
          key: key
          range: strings.SplitSeq(keys, "\n")
      - return: guard, nil
  - of: fullFallback
    steps:
      - return: "coregit.ResolutionValue{FullFallback: true, Reason: reason}"
  - of: Resolve
    participants:
      - id: caller
        kind: actor
      - id: Resolve
        kind: self
      - id: repoTopLevel
        kind: internal
      - id: fullFallback
        kind: internal
      - id: shallowState
        kind: internal
      - id: resolveBaseRef
        kind: internal
      - id: mergeBase
        kind: internal
      - id: runGitOutput
        kind: internal
      - id: newChangedSetValue
        kind: internal
      - id: collectChanges
        kind: internal
    steps:
      - bind: root, spelled, ok
        eval: repoTopLevel(ctx, cfg.Root)
        to: repoTopLevel
      - opt:
          do:
            - return: fullFallback("not a git repository — everything in scope")
              to: fullFallback
          when: "!ok"
      - bind: shallow, known
        eval: shallowState(ctx, root)
        to: shallowState
      - opt:
          do:
            - return: fullFallback("shallow probe failed — everything in scope")
              to: fullFallback
          when: "!known"
      - opt:
          do:
            - return: fullFallback("shallow clone — everything in scope")
              to: fullFallback
          when: shallow
      - bind: baseRef, ok
        eval: resolveBaseRef(ctx, root)
        to: resolveBaseRef
      - opt:
          do:
            - return: fullFallback("default branch unresolved — everything in scope")
              to: fullFallback
          when: "!ok"
      - bind: baseSHA, ok
        eval: mergeBase(ctx, root, baseRef)
        to: mergeBase
      - opt:
          do:
            - return: fullFallback("no merge-base with " + baseRef + " — everything in scope")
              to: fullFallback
          when: "!ok"
      - bind: headSHA, err
        eval: runGitOutput(ctx, root, "rev-parse", "HEAD")
        to: runGitOutput
      - opt:
          do:
            - return: fullFallback("HEAD unresolved — everything in scope")
              to: fullFallback
          when: err != nil
      - bind: set
        eval: newChangedSetValue(root, spelled)
        to: newChangedSetValue
      - opt:
          do:
            - return: fullFallback("git diff failed or timed out — everything in scope")
              to: fullFallback
          init:
            bind: err
            eval: collectChanges(ctx, root, baseSHA, set, cfg.Include)
            to: collectChanges
          when: err != nil
      - return: |-
          coregit.ResolutionValue{
          		Set:     set,
          		BaseRef: baseRef,
          		BaseSHA: baseSHA,
          		HeadSHA: headSHA,
          	}
  - of: repoTopLevel
    participants:
      - id: caller
        kind: actor
      - id: repoTopLevel
        kind: self
      - id: filepath
        kind: stdlib
      - id: runGitOutput
        kind: internal
      - id: spelledTopLevel
        kind: internal
    steps:
      - bind: start
        eval: hint
      - opt:
          do:
            - set: start
              value: "\".\""
          when: start == ""
      - bind: abs, err
        eval: filepath.Abs(start)
        to: filepath
      - opt:
          do:
            - return: "\"\", \"\", false"
          when: err != nil
      - bind: out, err
        eval: runGitOutput(ctx, abs, "rev-parse", "--show-toplevel")
        to: runGitOutput
      - opt:
          do:
            - return: "\"\", \"\", false"
          when: err != nil
      - set: canonical
        to: filepath
        value: filepath.Clean(out)
      - set: asSpelled, _
        to: spelledTopLevel
        value: spelledTopLevel(abs, canonical)
      - return: canonical, asSpelled, true
  - of: spelledTopLevel
    participants:
      - id: caller
        kind: actor
      - id: spelledTopLevel
        kind: self
      - id: filepath
        kind: stdlib
      - id: trimRepoTail
        kind: internal
    steps:
      - bind: clean
        eval: filepath.Clean(absHint)
        to: filepath
      - opt:
          do:
            - return: "\"\", false"
          when: clean == canonical || strings.HasPrefix(clean, canonical+separator)
      - bind: resolved, err
        eval: filepath.EvalSymlinks(clean)
        to: filepath
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil
      - bind: root, rootErr
        eval: filepath.EvalSymlinks(canonical)
        to: filepath
      - opt:
          do:
            - set: root
              value: canonical
          when: rootErr != nil
      - return: trimRepoTail(clean, root, resolved)
        to: trimRepoTail
  - of: trimRepoTail
    participants:
      - id: caller
        kind: actor
      - id: trimRepoTail
        kind: self
      - id: filepath
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: rel, err
        eval: filepath.Rel(canonical, resolved)
        to: filepath
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil || rel == ".." || strings.HasPrefix(rel, ".."+separator)
      - opt:
          do:
            - return: clean, true
          when: rel == "."
      - bind: trimmed, cut
        eval: strings.CutSuffix(clean, separator+rel)
        to: strings
      - opt:
          do:
            - return: "\"\", false"
          when: "!cut"
      - return: trimmed, true
  - of: shallowState
    participants:
      - id: caller
        kind: actor
      - id: shallowState
        kind: self
      - id: runGitOutput
        kind: internal
    steps:
      - bind: out, err
        eval: runGitOutput(ctx, root, "rev-parse", "--is-shallow-repository")
        to: runGitOutput
      - opt:
          do:
            - return: false, false
          when: err != nil
      - switch:
          cases:
            - case: "\"true\""
              do:
                - return: true, true
            - case: "\"false\""
              do:
                - return: false, true
            - default: true
              do:
                - return: false, false
          "on": out
  - of: resolveBaseRef
    participants:
      - id: caller
        kind: actor
      - id: resolveBaseRef
        kind: self
      - id: runGitOutput
        kind: internal
    steps:
      - bind: out, err
        eval: runGitOutput(ctx, root, "rev-parse", "--verify", "--quiet", "--abbrev-ref", originHEAD)
        to: runGitOutput
      - opt:
          do:
            - return: out, true
          when: err == nil && out != ""
      - loop:
          do:
            - opt:
                do:
                  - return: cand, true
                when: gitProbe(ctx, root, "rev-parse", "--verify", "--quiet", cand+"^{commit}")
          key: _
          range: defaultBranchCandidates
          value: cand
      - return: "\"\", false"
  - of: mergeBase
    participants:
      - id: caller
        kind: actor
      - id: mergeBase
        kind: self
      - id: runGitOutput
        kind: internal
    steps:
      - bind: out, err
        eval: runGitOutput(ctx, root, "merge-base", baseRef, "HEAD")
        to: runGitOutput
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil || out == ""
      - return: out, true
  - of: collectChanges
    participants:
      - id: caller
        kind: actor
      - id: collectChanges
        kind: self
      - id: addDiff
        kind: internal
      - id: addUntracked
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: addDiff(ctx, root, set, include, baseSHA, "HEAD")
            to: addDiff
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: addDiff(ctx, root, set, include, "--cached")
            to: addDiff
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: addDiff(ctx, root, set, include)
            to: addDiff
          when: err != nil
      - return: addUntracked(ctx, root, set, include)
        to: addUntracked
  - of: addDiff
    participants:
      - id: caller
        kind: actor
      - id: addDiff
        kind: self
      - id: addNameStatus
        kind: internal
      - id: slices
        kind: stdlib
      - id: runGitOutput
        kind: internal
      - id: parseUnifiedDiff
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: addNameStatus(ctx, root, set, include, extraArgs...)
            to: addNameStatus
          when: err != nil
      - bind: args
        eval: slices.Concat(diffBaseArgs, extraArgs)
        to: slices
      - bind: out, err
        eval: runGitOutput(ctx, root, args...)
        to: runGitOutput
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: nil
          when: out == ""
      - eval: parseUnifiedDiff(out, root, set, include)
        to: parseUnifiedDiff
      - return: nil
  - of: addNameStatus
    participants:
      - id: caller
        kind: actor
      - id: addNameStatus
        kind: self
      - id: slices
        kind: stdlib
      - id: runGitOutput
        kind: internal
      - id: parseNameStatus
        kind: internal
    steps:
      - bind: args
        eval: slices.Concat(nameStatusBaseArgs, extraArgs)
        to: slices
      - bind: out, err
        eval: runGitOutput(ctx, root, args...)
        to: runGitOutput
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: nil
          when: out == ""
      - eval: parseNameStatus(out, root, set, include)
        to: parseNameStatus
      - return: nil
  - of: addUntracked
    participants:
      - id: caller
        kind: actor
      - id: addUntracked
        kind: self
      - id: runGitOutput
        kind: internal
      - id: scopedAbs
        kind: internal
      - id: set.addWholeFile
        kind: internal
    steps:
      - bind: out, err
        eval: runGitOutput(ctx, root, "ls-files", "--others", "--exclude-standard", "-z")
        to: runGitOutput
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: nil
          when: out == ""
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: rel == ""
            - opt:
                do:
                  - eval: set.addWholeFile(abs)
                    to: set.addWholeFile
                init:
                  bind: abs, ok
                  eval: scopedAbs(rel, root, include)
                  to: scopedAbs
                when: ok
          key: rel
          range: strings.SplitSeq(out, "\x00")
      - return: nil
  - of: ShowFile
    participants:
      - id: caller
        kind: actor
      - id: ShowFile
        kind: self
      - id: runGitBlob
        kind: internal
    steps:
      - bind: spec
        eval: sha + ":./" + relPath
      - bind: content, stderrTail, runErr
        eval: runGitBlob(ctx, repoRoot, "show", spec)
        to: runGitBlob
      - opt:
          do:
            - return: content, nil
          when: runErr == nil
      - opt:
          do:
            - return: |-
                "", errs.Wrap(runErr, errs.WrapParams{
                			Code:    coregit.CodePathAbsent,
                			Reason:  "PATH_ABSENT",
                			Public:  "the path does not exist at that commit",
                			Private: "service/git: " + relPath + " is absent from " + sha + ": " + stderrTail,
                		})
          when: pathAbsent(ctx, repoRoot, sha, spec)
      - return: "\"\", blobFailure(runErr, stderrTail, \"show\", spec)"
  - of: pathAbsent
    participants:
      - id: caller
        kind: actor
      - id: pathAbsent
        kind: self
      - id: gitProbe
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: "!gitProbe(ctx, repoRoot, \"cat-file\", \"-e\", sha+\"^{commit}\")"
      - return: "!gitProbe(ctx, repoRoot, \"cat-file\", \"-e\", spec)"
        to: gitProbe
