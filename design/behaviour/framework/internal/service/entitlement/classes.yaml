# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxAnchors bounds how many vendor keys one verifier will accept.

      A rotation needs two — the key being retired and the key replacing it — and a
      rotation interrupted by a second one needs three. Four leaves that headroom
      and stops there, because the list's cost is exactly its length: an anchor is a
      key whose compromise is accepted while it is listed, so a bound that is never
      reached is a bound that lets the list become the place retired keys accumulate.
    items:
      - name: maxAnchors
        type: int
        value: "4"
    name: maxAnchors
  - doc: |-
      cachedBundleName is the file the last authenticated bundle is kept under. It
      carries the published name so an operator reading a cache directory can tell
      at a glance what the file is and where it came from.
    items:
      - name: cachedBundleName
        type: string
        value: "\"roster.signed.json\""
    name: cachedBundleName
  - doc: cacheDirMode keeps the cache directory owner-only.
    items:
      - name: cacheDirMode
        type: os.FileMode
        value: "0o700"
    name: cacheDirMode
  - doc: |-
      markCeiling bounds how far AHEAD of the local clock the mark may sit before the
      CACHE, rather than the clock, is what a refusal names.

      coreent.RosterLifetime and not a dial of its own: the mark IS a roster's
      IssuedAt, so a publisher cannot legitimately be more than one roster lifetime
      ahead of a client whose clock is right. Past that the bundle and the clock
      cannot both be plausible, and the bundle is the one that got there by being
      WRITTEN rather than by being fetched — ParseBundle refuses
      `now.Before(IssuedAt)`, so no install through rememberRoster can produce such a
      mark, and a file dropped into the cache directory is the whole of how this
      state is reached.

      # The trap this is NOT

      It is not a reason to DISCARD an implausible mark, and turning it into one
      would hand over the ratchet's own bypass. "Ignore a mark more than markCeiling
      ahead of now" reads as prudence and is a hole: rolling the clock back by more
      than markCeiling puts the LEGITIMATE mark outside the ceiling too, so the one
      record the ratchet exists to consult is thrown away by exactly the move it
      exists to catch — and checkClock then returns nil, which is the answer the
      attacker wanted.

      Both directions therefore stay REFUSALS, under the one sentinel
      coreent.ErrClockRegressed, and only the `condition` field differs. It has to
      differ, because the ADVICE does: "set the clock" is wrong when the clock is
      right and a planted bundle is dated next year, and an operator following it
      would break a machine that was working.
      Test_Service_checkClock_refusesBothDirectionsOfAnImplausibleMark fails if this
      is ever simplified into a discarded record.
    items:
      - name: markCeiling
        type: time.Duration
        value: coreent.RosterLifetime
    name: markCeiling
  - doc: |-
      markCompareStage names the ratchet's comparison in the stage field of the two
      refusals it raises. A constant rather than two literals: the two are one
      operation, and a typo in either would split it in a log query.
    items:
      - name: markCompareStage
        type: string
        value: "\"mark_compare\""
    name: markCompareStage
  - doc: |-
      cacheLockName is the lock every holder of one cache directory takes.

      The name is scoped by the DIRECTORY — a file locker's locks exclude only
      other users of the same directory — so one constant serves every product.
      Two products with separate cache directories do not contend, and two
      processes sharing one do, which is exactly the grouping wanted.
    items:
      - name: cacheLockName
        type: string
        value: "\"roster\""
    name: cacheLockName
  - doc: |-
      cacheLockBudget bounds how long a caller waits for the cache.

      The protected section is a file read, an ed25519 verification and a rename:
      microseconds, with no network and no user interaction inside it. A wait that
      reaches seconds therefore means something pathological — a holder stopped in
      a debugger, a filesystem that has stopped answering — and the right response
      to that is to stop waiting rather than to hang a licence gate a shell is
      sitting in front of.
    items:
      - name: cacheLockBudget
        type: time.Duration
        value: 2 * time.Second
    name: cacheLockBudget
  - doc: |-
      cacheLockPoll is how often a waiting caller retries while another process
      holds the cache.

      The locker's own default is 25 ms, chosen for a section whose length it
      cannot know. This one's length IS known — a file read, an ed25519
      verification and a rename — so 25 ms is roughly a thousand times the wait it
      is pacing, and every contended handover pays most of it as dead time. One
      millisecond is still four or five wakeups across a section that long, which
      is polling rather than spinning.

      Measured on the contended probe, 400 rounds of two writers racing:

      	25 ms (the locker's default):  11.66 s
      	 1 ms (this value):              2.53 s
    items:
      - name: cacheLockPoll
        type: time.Duration
        value: time.Millisecond
    name: cacheLockPoll
  - doc: |-
      Environment variables the Actions runner injects when a workflow declares
      `permissions: id-token: write`.
    grouped: true
    items:
      - doc: actionsTokenURLEnv holds the endpoint that mints an OIDC token.
        name: actionsTokenURLEnv
        type: string
        value: "\"ACTIONS_ID_TOKEN_REQUEST_URL\""
      - doc: |-
          actionsTokenBearerEnv holds the ephemeral credential authorising that
          request. It is what someone outside Actions cannot obtain.
        name: actionsTokenBearerEnv
        type: string
        value: "\"ACTIONS_ID_TOKEN_REQUEST_TOKEN\""
    name: actionsTokenURLEnv
  - doc: |-
      actionsTokenHostSuffix is the only host family the request URL may name.

      The URL arrives as an environment variable, so without this the bearer
      credential would be sent wherever that variable pointed — handing an
      attacker the one secret the runner has, by setting a variable.
    items:
      - name: actionsTokenHostSuffix
        type: string
        value: "\".actions.githubusercontent.com\""
    name: actionsTokenHostSuffix
  - doc: |-
      maxTokenResponseBytes caps the mint endpoint's response. A token is a couple
      of kilobytes; anything past this is not one.
    items:
      - name: maxTokenResponseBytes
        type: int64
        value: 64 << 10
    name: maxTokenResponseBytes
  - doc: sha256Size is the width of a SHA-256 digest, in bytes.
    items:
      - name: sha256Size
        type: int
        value: "32"
    name: sha256Size
  - doc: |-
      ActionsJWKSURL is where GitHub publishes the keys. Fixed, https, and never
      taken from a token: letting the thing being verified choose its own key
      source is the whole trust decision handed to the attacker.
    items:
      - name: ActionsJWKSURL
        type: string
        value: ActionsIssuer + "/.well-known/jwks"
    name: ActionsJWKSURL
  - doc: |-
      maxJWKSKeys caps how many entries a key set may carry. GitHub publishes a
      handful; a set with thousands is either broken or an attempt to make key
      selection expensive.
    items:
      - name: maxJWKSKeys
        type: int
        value: "32"
    name: maxJWKSKeys
  - doc: |-
      maxJWKSBytes caps the document before it is decoded at all.

      The entry-count limit below only applies AFTER json.Unmarshal has already
      built every element in memory, so a multi-megabyte key set would be paid for
      in full before being refused. GitHub's own set is a couple of kilobytes.
    items:
      - name: maxJWKSBytes
        type: int
        value: 1 << 20
    name: maxJWKSBytes
  - doc: |-
      maxRSAModulusBits refuses a modulus larger than any real signing key.

      rsa.VerifyPKCS1v15 does modular arithmetic over whatever it is given, so an
      absurdly large modulus turns a verification into a long computation — and
      this runs before anything has authenticated the key set.
    items:
      - name: maxRSAModulusBits
        type: int
        value: "8192"
    name: maxRSAModulusBits
  - doc: ActionsIssuer is the only issuer whose tokens mean anything here.
    items:
      - name: ActionsIssuer
        type: string
        value: "\"https://token.actions.githubusercontent.com\""
    name: ActionsIssuer
  - doc: |-
      DefaultActionsAudience is the audience a product that names none falls back
      to. A product SHOULD set its own: an audience shared between products lets a
      token minted for one satisfy the other's gate.

      A dedicated audience matters: a token minted for some other service — a
      cloud provider, a registry — must not be replayable here, and `aud` is what
      keeps the two apart. It is chosen by us, not by the caller, precisely so a
      workflow cannot request a token this verifier will accept for a purpose it
      never agreed to.
    items:
      - name: DefaultActionsAudience
        type: string
        value: "\"kitsunium-sdk-entitlement\""
    name: DefaultActionsAudience
  - doc: |-
      maxTokenBytes caps a compact JWT. Real Actions tokens are two kilobytes at
      most; anything past this is not a token we should be parsing.
    items:
      - name: maxTokenBytes
        type: int
        value: 16 << 10
    name: maxTokenBytes
  - doc: |-
      maxTokenLifetime bounds how long a token may claim to be valid.

      GitHub mints these for minutes. A token whose own window is wider is either
      not from Actions or is being replayed, and accepting it would turn the skew
      allowance below into an unbounded replay window.
    items:
      - name: maxTokenLifetime
        type: time.Duration
        value: 30 * time.Minute
    name: maxTokenLifetime
  - doc: |-
      clockSkew is how far the local clock may disagree with GitHub's before a
      valid token is refused. CI runners are well synchronised; this is slack for
      the round trip, not for a drifting clock.
    items:
      - name: clockSkew
        type: time.Duration
        value: 2 * time.Minute
    name: clockSkew
  - doc: |-
      minRSAModulusBits refuses a key too small to mean anything. GitHub signs
      with 2048-bit keys; a JWKS offering less has been tampered with.
    items:
      - name: minRSAModulusBits
        type: int
        value: "2048"
    name: minRSAModulusBits
  - doc: |-
      jwtParts is the number of segments in a compact JWS: header, payload,
      signature.
    items:
      - name: jwtParts
        type: int
        value: "3"
    name: jwtParts
  - doc: Positions of the three segments in a compact JWS.
    grouped: true
    items:
      - doc: headerSegment is the JOSE header.
        name: headerSegment
        type: int
        value: iota
      - doc: payloadSegment is the claims set.
        name: payloadSegment
      - doc: signatureSegment is the signature over the first two.
        name: signatureSegment
    name: headerSegment
  - doc: |-
      minRSAExponent is the smallest public exponent RSA allows. Anything below
      is not a key.
    items:
      - name: minRSAExponent
        type: int64
        value: "3"
    name: minRSAExponent
  - doc: |-
      maxRSAExponent bounds the public exponent so the int64 it is read into
      cannot truncate when narrowed to int, which is 32 bits on some platforms.
      Real exponents are 65537; this is far above any of them.
    items:
      - name: maxRSAExponent
        type: int64
        value: 1<<31 - 1
    name: maxRSAExponent
  - doc: |-
      evenDivisor tests an exponent's parity. An even RSA exponent shares a factor
      with every Euler totient, so it cannot be a valid public exponent.
    items:
      - name: evenDivisor
        type: int64
        value: "2"
    name: evenDivisor
  - doc: |-
      unusableHost is the single bucket every origin that names no fetchable host
      falls into. It is one shared value, not the URL itself: returning the URL made
      two DIFFERENT malformed entries look like two different hosts and satisfy the
      redundancy requirement, while neither could ever be fetched.
    items:
      - name: unusableHost
        type: string
        value: "\"\\x00unusable\""
    name: unusableHost
  - doc: |-
      minRedundantHosts is the number of DISTINCT hosts a product's origin list
      must span to count as redundant. Two branches on one host share that host's
      outage, so a list where every entry resolves to the same name looks redundant
      while being a single point of failure.
    items:
      - name: minRedundantHosts
        type: int
        value: "2"
    name: minRedundantHosts
  - doc: Roughtime wire constants.
    grouped: true
    items:
      - doc: roughtimeFrameMagic prefixes every packet in the framed dialect.
        name: roughtimeFrameMagic
        type: string
        value: "\"ROUGHTIM\""
      - doc: roughtimeVersion is the protocol version this client advertises.
        name: roughtimeVersion
        type: uint32
        value: "1"
      - doc: |-
          roughtimeNonceSize is the challenge length. The nonce is what makes a
          captured response worthless: the server signs a tree containing it.
        name: roughtimeNonceSize
        type: int
        value: "32"
      - doc: |-
          roughtimeMinRequest is the floor every request is padded to. It is an
          anti-amplification rule of the protocol, not a preference: a server is
          entitled to drop anything smaller, which is one reason a client that
          forgets it sees perfect silence.
        name: roughtimeMinRequest
        type: int
        value: "1024"
      - doc: |-
          roughtimeMaxResponse caps what is read back, for the same reason every
          other endpoint in this package is capped.
        name: roughtimeMaxResponse
        type: int
        value: "4096"
      - doc: |-
          roughtimeMaxPathDepth bounds the Merkle proof. A tree deeper than this
          would hold more requests than a server batches in a second, and the
          depth is attacker-chosen.
        name: roughtimeMaxPathDepth
        type: int
        value: "32"
      - doc: "roughtimeHashSize is the width of a Merkle node: SHA-512 truncated."
        name: roughtimeHashSize
        type: int
        value: "32"
      - doc: |-
          roughtimeTimeout bounds one query. Short on purpose — this is a
          corroborating signal on a start-up path, and a user must never wait on
          it. A filtered port is the common case, and it costs exactly this.
        name: roughtimeTimeout
        type: time.Duration
        value: 2 * time.Second
    name: roughtimeFrameMagic
  - doc: |-
      Roughtime signature contexts, NUL-terminated as the draft specifies.

      These are the two values an interoperability failure is most likely to hide
      in: they are hashed into every signature, so a wrong byte here produces a
      client that verifies nothing at all while looking entirely healthy. They are
      named as constants rather than inlined so that whoever validates against a
      real server has one place to correct.
    grouped: true
    items:
      - doc: |-
          roughtimeDelegationContext prefixes the long-term key's signature over
          the delegation.
        name: roughtimeDelegationContext
        type: string
        value: "\"RoughTime v1 delegation signature--\\x00\""
      - doc: |-
          roughtimeResponseContext prefixes the delegated key's signature over the
          signed response.
        name: roughtimeResponseContext
        type: string
        value: "\"RoughTime v1 response signature\\x00\""
    name: roughtimeDelegationContext
  - doc: |-
      maxClockSkew is how far the local clock may sit from signed network time
      before it is refused.

      Generous on purpose. What this is aimed at is a clock wrong by hours or days
      — a dead CMOS battery, a restored snapshot, a deliberate rollback — and a
      tight bound would turn ordinary drift, a slow link and a server's own radius
      into refusals for machines that are perfectly fine.
    items:
      - name: maxClockSkew
        type: time.Duration
        value: 5 * time.Minute
    name: maxClockSkew
  - doc: |-
      Merkle node prefixes. They exist so a leaf hash can never be mistaken for an
      interior one, which is what stops a second-preimage attack on the tree.
    grouped: true
    items:
      - doc: roughtimeLeafPrefix marks a hash over a client nonce.
        name: roughtimeLeafPrefix
        type: byte
        value: "0x00"
      - doc: roughtimeNodePrefix marks a hash over two child hashes.
        name: roughtimeNodePrefix
        type: byte
        value: "0x01"
    name: roughtimeLeafPrefix
  - doc: |-
      roughtimeMaxTags caps how many fields one message may declare.

      The count is the FIRST four bytes a hostile server controls, and it sizes
      every allocation below it. Roughtime messages carry a handful of tags; this
      is far above any real one and far below a number worth allocating for.
    items:
      - name: roughtimeMaxTags
        type: int
        value: "32"
    name: roughtimeMaxTags
  - doc: roughtimeTagSize is the width of a tag, an offset and a count alike.
    items:
      - name: roughtimeTagSize
        type: int
        value: "4"
    name: roughtimeTagSize
  - doc: |-
      maxArtefactBytes caps each roster artefact. The endpoint is untrusted by
      construction, so an unbounded read hands it a memory-exhaustion lever; a
      roster of thousands of subjects still fits far inside this.
    items:
      - name: maxArtefactBytes
        type: int64
        value: 4 << 20
    name: maxArtefactBytes
  - doc: |-
      fetchTimeout bounds ONE attempt at ONE origin. It is short on purpose:
      with several origins tried in turn, a generous per-origin timeout stacks
      into a wait no user would sit through, and a black-holed endpoint is far
      better abandoned than waited on. The overall bound is this times the
      number of origins, which is what makes adding an origin cheap.
    items:
      - name: fetchTimeout
        type: time.Duration
        value: 3 * time.Second
    name: fetchTimeout
  - doc: fieldSeparator joins one rendered field to the next in a diagnostic line.
    items:
      - name: fieldSeparator
        type: string
        value: "\" \""
    name: fieldSeparator
