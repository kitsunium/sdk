        eval: make(map[string]*rsa.PublicKey, len(decoded.Keys))
      - bind: seen
        eval: make(map[string]bool, len(decoded.Keys))
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: entry.KeyID == ""
            - opt:
                do:
                  - return: |-
                      nil, refuse(coreent.ErrCIUnverifiable,
                      				errs.String("stage", "build_keys"),
                      				errs.String("condition", "one kid declared twice"),
                      				errs.String("kid", entry.KeyID))
                when: seen[entry.KeyID]
            - set: seen[entry.KeyID]
              value: "true"
            - bind: key, keyErr
              eval: rsaKeyFromJWK(&entry)
              to: rsaKeyFromJWK
            - opt:
                do:
                  - continue: true
                when: keyErr != nil
            - set: built[entry.KeyID]
              value: key
          key: _
          range: decoded.Keys
          value: entry
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "build_keys"),
                			errs.String("condition", "no usable RS256 key in the set"),
                			errs.Int("got_keys", len(decoded.Keys)))
          when: len(built) == 0
      - return: built, nil
  - of: (*audienceClaim).UnmarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: (*audienceClaim).UnmarshalJSON
        kind: self
      - id: refuse
        kind: internal
      - id: json
        kind: stdlib
    steps:
      - opt:
          do:
            - return: |-
                refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "decode_audience"),
                			errs.String("condition", "the claim is null rather than absent or a string"))
              to: refuse
          when: string(data) == "null"
      - var:
          name: single
          type: string
      - opt:
          do:
            - set: "*a"
              value: audienceClaim{single}
            - return: nil
          init:
            bind: err
            eval: json.Unmarshal(data, &single)
            to: json
          when: err == nil
      - var:
          name: many
          type: "[]string"
      - opt:
          do:
            - return: |-
