            bind: mkErr
            eval: os.MkdirAll(dir, cacheDirMode)
            to: os
          when: mkErr != nil
      - bind: staged, stageErr
        eval: stageBundle(dir, raw)
        to: stageBundle
      - opt:
          do:
            - return: stageErr
          when: stageErr != nil
      - bind: installed
        eval: cachedBundlePath(dir)
        to: cachedBundlePath
      - opt:
          do:
            - eval: removeBestEffort(staged)
              to: removeBestEffort
            - return: |-
                classify(CacheUnwritable, renameErr,
                			errs.String("step", "rename"),
                			errs.String("path", installed))
              to: classify
          init:
            bind: renameErr
            eval: os.Rename(staged, installed)
            to: os
          when: renameErr != nil
      - return: nil
  - of: stageBundle
    participants:
      - id: caller
        kind: actor
      - id: stageBundle
        kind: self
      - id: os
        kind: stdlib
      - id: file.Name
        kind: value
      - id: file.Write
        kind: value
      - id: removeBestEffort
        kind: internal
    steps:
      - bind: file, createErr
        eval: os.CreateTemp(dir, cachedBundleName+".*.tmp")
        to: os
      - opt:
          do:
            - return: |-
                "", classify(CacheUnwritable, createErr,
                			errs.String("step", "create_temp"),
                			errs.String("dir", dir))
          when: createErr != nil
      - defer: |-
          func() {
          		closeErr := file.Close()
          		//: Nothing to add when the caller is already failing.
          		if closeErr == nil || err != nil {
          			//: Leave the existing outcome alone.
          			return
          		}
          		removeBestEffort(file.Name())
          		path, err = "", classify(CacheUnwritable, closeErr,
          			errs.String("step", "close"),
          			errs.String("path", file.Name()))
          	}()
      - bind: staged
        eval: file.Name()
        to: file.Name
      - opt:
          do:
            - eval: removeBestEffort(staged)
              to: removeBestEffort
            - return: |-
                "", classify(CacheUnwritable, writeErr,
                			errs.String("step", "write"),
                			errs.String("path", staged))
          init:
            bind: _, writeErr
            eval: file.Write(raw)
            to: file.Write
          when: writeErr != nil
      - return: staged, nil
  - of: removeBestEffort
    participants:
      - id: caller
        kind: actor
      - id: removeBestEffort
        kind: self
      - id: os
        kind: stdlib
      - id: log
        kind: stdlib
    steps:
      - opt:
          do:
            - eval: "log.Printf(\"remove %s: %v\", path, err)"
              to: log
          init:
            bind: err
            eval: os.Remove(path)
            to: os
          when: err != nil && !errors.Is(err, fs.ErrNotExist)
  - of: (*Service).cachedRoster
    participants:
      - id: caller
        kind: actor
      - id: (*Service).cachedRoster
        kind: self
      - id: cachedBundlePath
        kind: internal
      - id: s.holdCacheForRead
        kind: internal
      - id: parseBundleAnyAnchor
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrRosterUnreachable,
                			errs.String("stage", "read_cache"),
                			errs.String("condition", "no cache directory configured, so there is nowhere to look"))
          when: s.cacheDir == ""
      - bind: path
        eval: cachedBundlePath(s.cacheDir)
        to: cachedBundlePath
      - var:
          name: raw
          type: "[]byte"
      - var:
          name: readErr
          type: error
      - eval: s.holdCacheForRead(func() { raw, readErr = readCappedFile(path) })
        to: s.holdCacheForRead
      - opt:
          do:
            - return: nil, readErr
          when: readErr != nil
      - return: parseBundleAnyAnchor(raw, s.anchors, now)
        to: parseBundleAnyAnchor
  - of: readCappedFile
    participants:
      - id: caller
        kind: actor
      - id: readCappedFile
        kind: self
      - id: os
        kind: stdlib
      - id: readBounded
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrRosterUnreachable,
                			errs.String("stage", "read_cache"),
                			errs.String("path", path),
                			errs.String("condition", "not a regular file, so opening it could block forever"))
          when: "!regularFile(path)"
      - bind: file, openErr
        eval: os.Open(path)
        to: os
      - opt:
          do:
            - return: |-
                nil, classify(coreent.ErrRosterUnreachable, openErr,
                			errs.String("stage", "read_cache"),
                			errs.String("path", path))
          when: openErr != nil
      - defer: |-
          func() {
          		//: Best-effort: a descriptor we cannot release is worth a line, never
          		//: a refused licence.
          		if closeErr := file.Close(); closeErr != nil {
          			log.Printf("close %s: %v", path, closeErr)
          		}
          	}()
      - return: readBounded(file, path)
        to: readBounded
  - of: (*Service).signedHighWaterMark
    participants:
      - id: caller
        kind: actor
      - id: (*Service).signedHighWaterMark
        kind: self
      - id: s.holdCacheForRead
        kind: internal
      - id: s.markFloorNow
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}
          when: s.cacheDir == ""
      - var:
          name: mark
          type: markRecord
      - eval: s.holdCacheForRead(func() { mark = s.markWhileHeld() })
        to: s.holdCacheForRead
      - opt:
          do:
            - return: floor.issued
          init:
            bind: floor
            eval: s.markFloorNow()
            to: s.markFloorNow
          when: floor.present && mark.issued.Before(floor.issued)
      - return: mark.issued
  - of: (*Service).raiseMarkFloor
    steps:
      - lock:
          mutex: s.markFloorMu
      - bind: previous
        eval: s.markFloor
      - opt:
          do:
            - set: s.markFloor
              value: offered
          when: "!s.markFloor.present || s.markFloor.issued.Before(offered.issued)"
      - return: previous
  - of: (*Service).markFloorNow
    steps:
      - lock:
          mutex: s.markFloorMu
      - return: s.markFloor
  - of: judgeAgainstFloor
    participants:
      - id: caller
        kind: actor
      - id: judgeAgainstFloor
        kind: self
      - id: refuse
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: "!floor.present || !offered.present"
      - opt:
          do:
            - return: |-
                refuse(coreent.ErrRosterStale,
                			errs.String("stage", markCompareStage),
                			errs.String("condition", "superseded by a newer signed decision this process has already authenticated"),
                			errs.String("issued_at", offered.issued.UTC().Format(time.RFC3339)),
                			errs.String("mark", floor.issued.UTC().Format(time.RFC3339)))
              to: refuse
          when: offered.issued.Before(floor.issued)
      - opt:
          do:
            - return: |-
                refuse(coreent.ErrRosterStale,
                			errs.String("stage", markCompareStage),
                			errs.String("condition", "a different document signed at the same instant as one this process has already authenticated"),
                			errs.String("mark", floor.issued.UTC().Format(time.RFC3339)))
              to: refuse
          when: offered.issued.Equal(floor.issued) && offered.payload != floor.payload
      - return: nil
  - of: rosterMark
    steps:
      - opt:
          do:
            - return: markRecord{}
          when: |-
            roster == nil ||
            		roster.IssuedAt.IsZero() ||
            		roster.ExpiresAt.Before(roster.IssuedAt) ||
            		roster.ExpiresAt.Sub(roster.IssuedAt) > coreent.RosterLifetime
      - return: "markRecord{issued: roster.IssuedAt, payload: payloadDigest(payload), present: true}"
  - of: bundleMark
    participants:
      - id: caller
        kind: actor
      - id: bundleMark
        kind: self
      - id: authenticateBundle
        kind: internal
      - id: rosterMark
        kind: internal
    steps:
      - bind: roster, payload, authErr
        eval: authenticateBundle(raw, vendor)
        to: authenticateBundle
      - opt:
          do:
            - return: markRecord{}
          when: authErr != nil
      - return: rosterMark(roster, payload)
        to: rosterMark
  - of: (*Service).markWhileHeld
    participants:
      - id: caller
        kind: actor
      - id: (*Service).markWhileHeld
        kind: self
      - id: readCappedFile
        kind: internal
      - id: bundleMarkAnyAnchor
        kind: internal
    steps:
      - bind: raw, readErr
        eval: readCappedFile(cachedBundlePath(s.cacheDir))
        to: readCappedFile
      - opt:
          do:
            - return: markRecord{}
          when: readErr != nil
      - return: bundleMarkAnyAnchor(raw, s.anchors)
        to: bundleMarkAnyAnchor
  - of: (*Service).checkClock
    participants:
      - id: caller
        kind: actor
      - id: (*Service).checkClock
        kind: self
      - id: s.signedHighWaterMark
        kind: internal
      - id: refuse
        kind: internal
    steps:
      - bind: mark
        eval: s.signedHighWaterMark()
        to: s.signedHighWaterMark
      - opt:
          do:
            - return: nil
          when: mark.IsZero() || !now.Before(mark)
      - opt:
          do:
            - return: |-
                refuse(coreent.ErrClockRegressed,
                			errs.String("condition", "the newest signed instant this machine holds is further ahead of the local clock than a roster's own lifetime, so the cached bundle is what cannot be right"),
                			errs.String("clock", now.UTC().Format(time.RFC3339)),
                			errs.String("mark", mark.UTC().Format(time.RFC3339)),
                			errs.String("ceiling", markCeiling.String()))
              to: refuse
          when: mark.Sub(now) > markCeiling
      - return: |-
          refuse(coreent.ErrClockRegressed,
          		errs.String("condition", "the local clock reads earlier than the newest signed instant this machine has authenticated"),
          		errs.String("clock", now.UTC().Format(time.RFC3339)),
          		errs.String("mark", mark.UTC().Format(time.RFC3339)))
        to: refuse
  - of: (*Service).checkClockAndTime
    participants:
      - id: caller
        kind: actor
      - id: (*Service).checkClockAndTime
        kind: self
      - id: s.checkClock
        kind: internal
      - id: s.checkNetworkTime
        kind: internal
    steps:
      - opt:
          do:
            - return: ratchetErr
          init:
            bind: ratchetErr
            eval: s.checkClock(now)
            to: s.checkClock
          when: ratchetErr != nil
      - return: s.checkNetworkTime(now)
        to: s.checkNetworkTime
  - of: (*Service).cacheGuard
    participants:
      - id: caller
        kind: actor
      - id: (*Service).cacheGuard
        kind: self
      - id: lock
        kind: package
      - id: log
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: s.cacheDir == ""
      - lock:
          mutex: s.cacheLockMu
      - opt:
          do:
            - return: s.cacheLock
          when: s.cacheLockFor == s.cacheDir
      - set: s.cacheLockFor
        value: s.cacheDir
      - set: s.cacheLock
        value: nil
      - bind: locker, lockErr
        eval: "lock.NewFileLocker(lock.FileConfig{Dir: s.cacheDir, Poll: cacheLockPoll})"
        to: lock
      - opt:
          do:
            - eval: log.Printf("cannot guard the roster cache at %s (%v); concurrent refreshes on this machine are not serialised", s.cacheDir, lockErr)
              to: log
            - return: nil
          when: lockErr != nil
      - set: s.cacheLock
        value: locker
      - return: s.cacheLock
  - of: (*Service).underCacheLock
    participants:
      - id: caller
        kind: actor
      - id: (*Service).underCacheLock
        kind: self
      - id: s.cacheGuard
        kind: internal
      - id: context
        kind: stdlib
      - id: locker.Acquire
        kind: value
    steps:
      - bind: locker
        eval: s.cacheGuard()
        to: s.cacheGuard
      - opt:
          do:
            - eval: fn()
            - return: true, nil
          when: locker == nil
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), cacheLockBudget)
        to: context
      - defer: cancel()
      - bind: lease, acquireErr
        eval: locker.Acquire(ctx, cacheLockName)
        to: locker.Acquire
      - opt:
          do:
            - return: false, acquireErr
          when: acquireErr != nil
      - defer: |-
          func() {
          		//: Best-effort: a lease we cannot release is released by the kernel
          		//: when this process ends, so it is worth a line and never a refusal.
          		if releaseErr := lease.Release(context.Background()); releaseErr != nil {
          			log.Printf("releasing the roster cache lock at %s: %v", s.cacheDir, releaseErr)
          		}
          	}()
      - eval: fn()
      - return: true, nil
  - of: (*Service).holdCacheForWrite
    participants:
      - id: caller
        kind: actor
      - id: (*Service).holdCacheForWrite
        kind: self
      - id: s.underCacheLock
        kind: internal
      - id: log
        kind: stdlib
    steps:
      - bind: ran, why
        eval: s.underCacheLock(fn)
        to: s.underCacheLock
      - opt:
          do:
            - return: ""
          when: ran
      - eval: "log.Printf(\"roster cache at %s: the guard could not be taken (%v); this refresh was skipped and the next verification caches whatever it fetches\", s.cacheDir, why)"
        to: log
  - of: (*Service).holdCacheForRead
    steps:
      - eval: fn()
  - of: InCI
    steps:
      - return: os.Getenv(actionsTokenURLEnv) != "" && os.Getenv(actionsTokenBearerEnv) != ""
  - of: checkTokenURL
    participants:
      - id: caller
        kind: actor
      - id: checkTokenURL
        kind: self
      - id: url
        kind: stdlib
      - id: parsed.Hostname
        kind: value
    steps:
      - bind: parsed, parseErr
        eval: url.Parse(raw)
        to: url
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "check_token_url"),
                			errs.String("condition", "the runner named a url that does not parse"))
          when: parseErr != nil
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "check_token_url"),
                			errs.String("condition", "the scheme would put the credential on the wire in clear"),
                			errs.String("scheme", parsed.Scheme))
          when: parsed.Scheme != "https"
      - bind: host
        eval: parsed.Hostname()
        to: parsed.Hostname
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "check_token_url"),
                			errs.String("condition", "the host is not GitHub's token endpoint"),
                			errs.String("host", host))
          when: |-
            host != strings.TrimPrefix(actionsTokenHostSuffix, ".") &&
            		!strings.HasSuffix(host, actionsTokenHostSuffix)
      - return: parsed, nil
  - of: RequestActionsToken
    participants:
      - id: caller
        kind: actor
      - id: RequestActionsToken
        kind: self
      - id: checkTokenURL
        kind: internal
      - id: endpoint.Query
        kind: value
      - id: query.Set
        kind: value
      - id: query.Encode
        kind: value
      - id: fetchToken
        kind: internal
    steps:
      - bind: rawURL, bearer
        eval: os.Getenv(actionsTokenURLEnv), os.Getenv(actionsTokenBearerEnv)
      - opt:
          do:
            - return: |-
                "", refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "mint_token"),
                			errs.String("condition", "neither runner token variable is set"))
          when: rawURL == "" || bearer == ""
      - bind: endpoint, urlErr
        eval: checkTokenURL(rawURL)
        to: checkTokenURL
      - opt:
          do:
            - return: "\"\", urlErr"
          when: urlErr != nil
      - bind: query
        eval: endpoint.Query()
        to: endpoint.Query
      - eval: query.Set("audience", audience)
        to: query.Set
      - set: endpoint.RawQuery
        to: query.Encode
        value: query.Encode()
      - bind: raw, fetchErr
        eval: fetchToken(get, endpoint.String(), bearer)
        to: fetchToken
      - opt:
          do:
            - return: "\"\", fetchErr"
          when: fetchErr != nil
      - return: raw, nil
  - of: tokenResponseBody
    participants:
      - id: caller
        kind: actor
      - id: tokenResponseBody
        kind: self
      - id: closeBestEffort
        kind: internal
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "mint_token"),
                			errs.String("condition", "no BearerFetch was supplied"))
          when: get == nil
      - bind: resp, getErr
        eval: get(endpoint, bearer)
      - opt:
          do:
            - return: |-
                nil, classifyForeign(coreent.ErrCIUnverifiable, getErr,
                			errs.String("stage", "mint_token"))
          when: getErr != nil
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "mint_token"),
                			errs.String("condition", "the transport returned neither a response nor an error"))
          when: resp == nil || resp.Body == nil
      - defer: closeBestEffort(resp.Body, endpoint)
        to: closeBestEffort
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "mint_token"),
                			errs.String("condition", "the mint endpoint refused"),
                			errs.Int("status", resp.StatusCode))
          when: resp.StatusCode != http.StatusOK
      - bind: read, readErr
        eval: io.ReadAll(io.LimitReader(resp.Body, maxTokenResponseBytes+1))
        to: io
      - opt:
          do:
            - return: |-
                nil, classifyForeign(coreent.ErrCIUnverifiable, readErr,
                			errs.String("stage", "read_token_response"))
          when: readErr != nil
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "read_token_response"),
                			errs.String("condition", "body at or past the cap"),
                			errs.Int64("limit_bytes", maxTokenResponseBytes),
                			errs.Int("got_bytes", len(read)))
          when: int64(len(read)) > maxTokenResponseBytes
      - return: read, nil
  - of: fetchToken
    participants:
      - id: caller
        kind: actor
      - id: fetchToken
        kind: self
      - id: tokenResponseBody
        kind: internal
      - id: strictUnmarshal
        kind: internal
    steps:
      - bind: body, bodyErr
        eval: tokenResponseBody(get, endpoint, bearer)
        to: tokenResponseBody
      - opt:
          do:
            - return: "\"\", bodyErr"
          when: bodyErr != nil
      - bind: minted, decodeErr
        eval: strictUnmarshal[actionsTokenResponse](body, "token response")
        to: strictUnmarshal
      - opt:
          do:
            - return: "\"\", decodeErr"
          when: decodeErr != nil
      - opt:
          do:
            - return: |-
                "", refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "mint_token"),
                			errs.String("condition", "a well-formed response carrying no token"))
          when: minted.Value == ""
      - return: minted.Value, nil
  - of: DefaultBearerFetch
    participants:
      - id: caller
        kind: actor
      - id: DefaultBearerFetch
        kind: self
      - id: http
        kind: stdlib
      - id: req.Header.Set
        kind: value
      - id: client.Do
        kind: value
    steps:
      - bind: client
        eval: |-
          &http.Client{
          		Timeout: fetchTimeout,
          		CheckRedirect: func(*http.Request, []*http.Request) error {
          			//: Refuse rather than follow: the destination was never checked.
          			return refuse(coreent.ErrCIUnverifiable,
          				errs.String("stage", "mint_token"),
          				errs.String("condition", "the token endpoint redirected and the destination was never checked"))
          		},
          	}
      - bind: req, reqErr
        eval: http.NewRequest(http.MethodGet, url, nil)
        to: http
      - opt:
          do:
            - return: |-
                nil, classify(coreent.ErrCIUnverifiable, reqErr,
                			errs.String("stage", "build_token_request"))
          when: reqErr != nil
      - eval: req.Header.Set("Authorization", "Bearer "+bearer)
        to: req.Header.Set
      - return: client.Do(req)
        to: client.Do
  - of: VerifyCI
    participants:
      - id: caller
        kind: actor
      - id: VerifyCI
        kind: self
      - id: RequestActionsToken
        kind: internal
      - id: VerifyActionsToken
        kind: internal
      - id: roster.CIEntitlementFor
        kind: value
    steps:
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "verify_ci"),
                			errs.String("condition", "neither runner token variable is set"))
          when: "!InCI()"
      - bind: raw, tokenErr
        eval: RequestActionsToken(get, audience)
        to: RequestActionsToken
      - opt:
          do:
            - return: nil, tokenErr
          when: tokenErr != nil
      - bind: verified, verifyErr
        eval: VerifyActionsToken(raw, keys, audience, now)
        to: VerifyActionsToken
      - opt:
          do:
            - return: nil, verifyErr
          when: verifyErr != nil
      - opt:
          do:
            - return: nil, entitlementErr
          init:
            bind: _, entitlementErr
            eval: roster.CIEntitlementFor(verified.RepositoryOwnerID, now)
            to: roster.CIEntitlementFor
          when: entitlementErr != nil
      - return: verified, nil
  - of: (*Service).ciSeat
    participants:
      - id: caller
        kind: actor
      - id: (*Service).ciSeat
        kind: self
      - id: s.publishedJWKS
        kind: internal
      - id: VerifyCI
        kind: internal
      - id: roster.CIEntitlementFor
        kind: value
      - id: time
        kind: stdlib
    steps:
      - opt:
          do:
            - return: |-
                coreent.GrantValue{}, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "ci_seat"),
                			errs.String("condition", "neither runner token variable is set"))
          when: "!InCI()"
      - opt:
          do:
            - return: |-
                coreent.GrantValue{}, refuse(coreent.ErrCINotEntitled,
                			errs.String("stage", "ci_seat"),
                			errs.String("condition", "the roster carries no CI block at all"))
          when: len(roster.CIAccounts) == 0
      - bind: keys, keysErr
        eval: s.publishedJWKS()
        to: s.publishedJWKS
      - opt:
          do:
            - return: coreent.GrantValue{}, keysErr
          when: keysErr != nil
      - bind: claims, verifyErr
        eval: VerifyCI(s.bearerFetch, keys, roster, s.product.audience(), now)
        to: VerifyCI
      - opt:
          do:
            - return: coreent.GrantValue{}, verifyErr
          when: verifyErr != nil
      - bind: entitlement, entitlementErr
        eval: roster.CIEntitlementFor(claims.RepositoryOwnerID, now)
        to: roster.CIEntitlementFor
      - opt:
          do:
            - return: coreent.GrantValue{}, entitlementErr
          when: entitlementErr != nil
      - bind: tokenExpiry
        eval: time.Unix(claims.ExpiresAt, 0)
        to: time
      - opt:
          do:
            - return: |-
                coreent.GrantValue{}, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "ci_seat"),
                			errs.String("condition", "the Actions token expired before this verification, so any grant built on it would be expired the instant it was returned"),
                			errs.String("token_exp", tokenExpiry.UTC().Format(time.RFC3339)),
                			errs.String("now", now.UTC().Format(time.RFC3339)))
          when: "!tokenExpiry.After(now)"
      - return: |-
          coreent.GrantValue{
          		Subject:    "ci:" + claims.Repository,
          		VerifiedAt: now,
          		NotAfter:   coreent.GrantDeadline(now, roster.ExpiresAt, entitlement.ExpiresAt, tokenExpiry),
          	}, nil
  - of: (*Service).publishedJWKS
    participants:
      - id: caller
        kind: actor
      - id: (*Service).publishedJWKS
        kind: self
      - id: s.fetch
        kind: internal
      - id: ParseJWKS
        kind: internal
    steps:
      - bind: raw, fetchErr
        eval: s.fetch(ActionsJWKSURL)
        to: s.fetch
      - opt:
          do:
            - return: |-
                nil, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "fetch_jwks"),
                			errs.String("cause", particulars(fetchErr)))
          when: fetchErr != nil
      - return: ParseJWKS(raw)
        to: ParseJWKS
  - of: ciRefusalIsFinal
    steps:
      - opt:
          do:
            - return: "false"
          when: roster == nil
      - return: InCI() && !roster.CIRelaxed
  - of: ciContext
    participants:
      - id: caller
        kind: actor
      - id: ciContext
        kind: self
      - id: particulars
        kind: internal
      - id: annotate
        kind: internal
    steps:
      - opt:
          do:
            - return: deviceErr
          when: ciErr == nil || !InCI()
      - bind: seat
        eval: "[]errs.FieldValue{errs.String(\"ci_refusal\", ciErr.Error())}"
      - opt:
          do:
            - set: seat
              value: append(seat, errs.String("ci_detail", detail))
          init:
            bind: detail
            eval: particulars(ciErr)
            to: particulars
          when: detail != ""
      - return: annotate(deviceErr, seat...)
        to: annotate
  - of: verifiedBy
    participants:
      - id: caller
        kind: actor
      - id: verifiedBy
        kind: self
      - id: sign
        kind: package
    steps:
      - bind: verified, verifyErr
        eval: sign.Verify(sign.Ed25519, key, message, signature)
        to: sign
      - return: verifyErr == nil && verified
  - of: digestOf
    participants:
      - id: caller
        kind: actor
      - id: digestOf
        kind: self
      - id: hash
        kind: package
    steps:
      - bind: sum, sumErr
        eval: hash.Sum(algorithm, data)
        to: hash
      - opt:
          do:
            - panic: "\"entitlement: \" + string(algorithm) + \" is not registered: \" + sumErr.Error()"
          when: sumErr != nil
      - return: sum
  - of: payloadDigest
    steps:
      - var:
          name: digest
          type: "[sha256Size]byte"
      - eval: copy(digest[:], digestOf(hash.SHA256, payload))
      - return: digest
  - of: sha512Prefix
    steps:
      - return: digestOf(hash.SHA512, data)[:size]
  - of: checkNoDuplicateNames
    participants:
      - id: caller
        kind: actor
      - id: checkNoDuplicateNames
        kind: self
      - id: json
        kind: stdlib
      - id: decoder.Token
        kind: value
      - id: admitToken
        kind: internal
    steps:
      - bind: decoder
        eval: json.NewDecoder(bytes.NewReader(data))
        to: json
      - var:
          name: stack
          type: "[]*nameFrame"
      - loop:
          do:
            - bind: token, tokenErr
              eval: decoder.Token()
              to: decoder.Token
            - opt:
                do:
                  - return: "\"\", false"
                when: tokenErr != nil
            - bind: name, seen, next
              eval: admitToken(stack, token)
              to: admitToken
            - opt:
                do:
                  - return: name, true
                when: seen
            - set: stack
              value: next
          forever: true
  - of: admitToken
    participants:
      - id: caller
        kind: actor
      - id: admitToken
        kind: self
      - id: topFrame
        kind: internal
      - id: valueClosed
        kind: internal
    steps:
      - bind: delim, isDelim
        eval: token.(json.Delim)
      - opt:
          do:
            - return: "\"\", false, applyDelim(stack, delim)"
          when: isDelim
      - bind: name, isName
        eval: token.(string)
      - bind: top
        eval: topFrame(stack)
        to: topFrame
      - opt:
          do:
            - opt:
                do:
                  - return: name, true, stack
                init:
                  bind: _, repeated
                  eval: top.names[name]
                when: repeated
            - set: top.names[name]
              value: struct{}{}
            - set: top.expectKey
              value: "false"
            - return: "\"\", false, stack"
          when: isName && top != nil && top.object && top.expectKey
      - eval: valueClosed(top)
        to: valueClosed
      - return: "\"\", false, stack"
  - of: applyDelim
    participants:
      - id: caller
        kind: actor
      - id: applyDelim
        kind: self
      - id: valueClosed
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'{'"
              do:
                - return: "append(stack, &nameFrame{names: map[string]struct{}{}, object: true, expectKey: true})"
            - case: "'['"
              do:
                - return: append(stack, &nameFrame{})
            - default: true
              do:
                - opt:
                    do:
                      - return: stack
                    when: len(stack) == 0
                - set: stack
                  value: stack[:len(stack)-1]
                - eval: valueClosed(topFrame(stack))
                  to: valueClosed
                - return: stack
          "on": delim
  - of: topFrame
    steps:
      - opt:
          do:
            - return: nil
          when: len(stack) == 0
      - return: stack[len(stack)-1]
  - of: valueClosed
    steps:
      - opt:
          do:
            - return: ""
          when: frame == nil || !frame.object
      - set: frame.expectKey
        value: "true"
  - of: decodeJWKS
    participants:
      - id: caller
        kind: actor
      - id: decodeJWKS
        kind: self
      - id: checkNoDuplicateNames
        kind: internal
      - id: json
        kind: stdlib
    steps:
      - opt:
          do:
            - return: |-
                decoded, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "decode_jwks"),
                			errs.String("condition", "document larger than the cap"),
                			errs.Int("limit_bytes", maxJWKSBytes),
                			errs.Int("got_bytes", len(raw)))
