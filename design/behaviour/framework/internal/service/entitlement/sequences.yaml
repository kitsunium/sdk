  - of: (*Service).rememberRoster
    participants:
      - id: caller
        kind: actor
      - id: (*Service).rememberRoster
        kind: self
      - id: bundleMarkAnyAnchor
        kind: internal
      - id: s.raiseMarkFloor
        kind: internal
      - id: s.holdCacheForWrite
        kind: internal
      - id: judgeAgainstFloor
        kind: internal
