      - return: filepath.Join(root, p.cacheDir())
        to: filepath
  - of: (*Service).WithCache
    steps:
      - set: s.cacheDir
        value: dir
      - return: s
  - of: cachedBundlePath
    participants:
      - id: caller
        kind: actor
      - id: cachedBundlePath
        kind: self
      - id: filepath
        kind: stdlib
    steps:
      - return: filepath.Join(dir, cachedBundleName)
        to: filepath
  - of: judgeMark
