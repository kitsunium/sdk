            - return: |-
                nil, refuse(coreent.ErrRosterUnsigned,
                			errs.String("condition", "no trust anchor was linked into this build, so no signature can be valid"))
          when: len(anchors) == 0
      - var:
          name: lastErr
          type: error
      - loop:
          do:
            - bind: candidate, parseErr
              eval: ParseBundle(raw, anchor, now)
              to: ParseBundle
            - opt:
                do:
                  - return: candidate, nil
                when: parseErr == nil
            - opt:
                do:
                  - return: nil, parseErr
                when: "!errors.Is(parseErr, coreent.ErrRosterUnsigned)"
            - set: lastErr
              value: parseErr
          key: _
          range: anchors
          value: anchor
      - return: nil, lastErr
  - of: bundleMarkAnyAnchor
