        eval: anchors
      - opt:
          do:
            - eval: "log.Printf(\"entitlement: %d trust anchors declared, keeping the first %d\", len(kept), maxAnchors)"
              to: log
            - set: kept
              value: kept[:maxAnchors]
          when: len(kept) > maxAnchors
      - bind: owned
        eval: make([][]byte, 0, len(kept))
      - loop:
          do:
            - set: owned
              value: append(owned, bytes.Clone(anchor))
          key: _
          range: kept
          value: anchor
      - return: owned
  - of: parseBundleAnyAnchor
