            bind: unmarshalErr
            eval: json.Unmarshal(raw, &decoded)
            to: json
          when: unmarshalErr != nil
      - opt:
          do:
            - return: |-
                decoded, refuse(coreent.ErrCIUnverifiable,
                			errs.String("stage", "decode_jwks"),
                			errs.String("condition", "more entries than any real key set"),
                			errs.Int("limit_keys", maxJWKSKeys),
                			errs.Int("got_keys", len(decoded.Keys)))
          when: len(decoded.Keys) > maxJWKSKeys
      - return: decoded, nil
  - of: ParseJWKS
