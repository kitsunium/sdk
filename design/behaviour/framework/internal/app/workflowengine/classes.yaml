  name: workflowengine
  purpose: "Package workflowengine is what framework/app/workflow plugs into kit: the engine the framework's workflows run on — the SDK's statemachine, instantiated once, over the framework's entity and the state's spelling (ADR 0179 §1, step 5, Q3) —, its loop of timers and guards, and the conversions between the engine's values and plug's."
types:
  - doc: |-
      sdkClock is the app's clock, as kit's core hands it (plug.Clock), as the
      SDK's engine stamps and waits on it: the same instants and the same
      timers, a test's manual clock included.
    fields:
      - name: ""
        role: embedded
        type: plug.Clock
    kind: struct
    methods:
      - doc: NewTimer is the clock's timer, as the SDK's.
        name: NewTimer
        params: d time.Duration
        recv: c sdkClock
        results: clock.Timer
      - doc: NewTicker is the clock's ticker, as the SDK's.
        name: NewTicker
        params: d time.Duration
        recv: c sdkClock
        results: clock.Ticker
    name: sdkClock
  - doc: |-
      engine is the SDK's engine as kit's core uses it: its one instantiation,
      at kit's entity and the state's spelling.
    fields:
      - name: m
        type: "*statemachine.Machine[entity, string]"
    kind: struct
    methods:
      - doc: Start enters e in the workflow.
        name: Start
        params: ctx context.Context, e entity
        recv: x *engine
        results: entity, error
      - doc: Fire moves the entity under key along event's transition.
        name: Fire
        params: ctx context.Context, key, event string
        recv: x *engine
        results: entity, error
      - doc: Changed tells the engine the entity under key was written.
        name: Changed
        params: ctx context.Context, key string
        recv: x *engine
        results: error
      - doc: Deleted tells the engine the entity under key was deleted.
        name: Deleted
        params: ctx context.Context, key string
        recv: x *engine
        results: error
      - doc: Census counts the entities per state.
        name: Census
        recv: x *engine
        results: map[string]int
      - doc: Records are what the engine knows of each entity, as plug spells them.
        name: Records
        recv: x *engine
        results: "[]plug.WorkflowRecordValue"
      - doc: Run runs the engine's loop until ctx ends.
        name: Run
        params: ctx context.Context
        recv: x *engine
        results: error
    name: engine
  - doc: |-
      journal is a workflow's journal, which the core keeps, as the SDK's
      engine reads and writes it.
    fields:
      - name: j
        type: plug.WorkflowJournal
    kind: struct
    methods:
      - doc: Load reads every record the journal kept.
        name: Load
        params: ctx context.Context
        recv: j journal
        results: "[]statemachine.Record[string], error"
      - doc: Save keeps records.
        name: Save
        params: ctx context.Context, records ...statemachine.Record[string]
        recv: j journal
        results: error
      - doc: Delete forgets the records of keys.
        name: Delete
        params: ctx context.Context, keys ...string
        recv: j journal
        results: error
    name: journal
