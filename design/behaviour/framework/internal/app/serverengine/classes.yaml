functions:
  - doc: |-
      sampleProcess is the SDK's snapshot of the running process (process.Self)
      as the model says it. Latency percentiles come from the runtime's
      histograms, which count since the process started. The time is the wall
      clock's: a process sample is about the machine, not the product's clock.

      It lives here rather than in kit because process.Self is runtime/metrics,
      whose initialisation every process importing it pays at start, and the spawn
      engine beside it in pkg/v1/proc/process: only a serving app answers the
      runtime graph that carries a sample (ADR 0172).
    name: sampleProcess
    results: "*model.Process"
  - doc: millis is d in milliseconds, to two decimals.
    name: millis
    params: d time.Duration
    results: float64
  - doc: round2 is f to two decimals, as kit rounds every figure it shows.
    name: round2
    params: f float64
    results: float64
  - name: Enable
  - doc: |-
      newHTTPServer builds the engine cfg describes: its engine accepts, bounds
      and drains the connections, net/http speaks the protocol.

      IFACE-PLUGIN: kit reaches the engine through plug.HTTPServer; this is its
      one implementation.
    name: newHTTPServer
    params: cfg plug.HTTPConfig
    results: plug.HTTPServer
  - doc: |-
      newStaticFiles serves the tree fsys as a single-page application, under
      the content security policy csp.
    name: newStaticFiles
    params: fsys fs.FS, csp string
    results: http.Handler, error
