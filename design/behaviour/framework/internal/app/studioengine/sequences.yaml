          do:
            - return: nil
          when: err != nil
      - bind: d
        eval: "&model.DevBuild{BuiltAt: new(at.UTC()), Changed: changedFiles(getenv(envDevChanged))}"
      - opt:
          do:
            - set: d.BuildMs
              to: round2
