            - opt:
                do:
                  - set: out
                    value: append(out, f)
                init:
                  bind: f
                  eval: strings.TrimSpace(f)
                  op: =
                  to: strings
                when: f != "" && filepath.IsLocal(filepath.FromSlash(f)) && len(out) < maxDevChanged
          key: f
          range: strings.SplitSeq(raw, "\n")
