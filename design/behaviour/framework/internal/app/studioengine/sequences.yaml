          init:
            bind: ms, err
            eval: strconv.ParseFloat(getenv(envDevBuildMs), 64)
            to: strconv
          when: err == nil && ms >= 0
      - set: d.Rebuilds, d.More
        value: positiveInt(getenv(envDevBuilds)), positiveInt(getenv(envDevMore))
      - return: d
  - of: changedFiles
    participants:
      - id: caller
