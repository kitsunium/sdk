          		{Name: model.VarStudioRemote, Value: s.Remote, From: settingFrom(getenv, false, model.VarStudioRemote)},
          		{Name: model.VarAnalyze, Value: s.Analyze, From: settingFrom(getenv, s.AnalyzeOption != nil, model.VarAnalyze), Option: "app.Analyze"},
          	}
  - of: settingFrom
    steps:
      - switch:
          cases:
            - case: option
              do:
                - return: model.SettingOption
            - case: getenv(name) != ""
              do:
                - return: model.SettingEnv
            - default: true
              do:
                - return: model.SettingDefault
  - of: devForced
    participants:
      - id: caller
        kind: actor
      - id: devForced
        kind: self
      - id: strings
