apiVersion: design/behaviour/v1
constants:
  - doc: The spool's refusals the framework tells apart, which it words for the product.
    grouped: true
    items:
      - doc: MailRefusalNone is no refusal the framework words.
        name: MailRefusalNone
        type: MailRefusal
        value: iota
      - doc: |-
          MailRefusalClosed is a spool that is closed: its mailer is not
          running.
        name: MailRefusalClosed
      - doc: MailRefusalUnencodable is a mail the outbox cannot encode.
        name: MailRefusalUnencodable
      - doc: |-
          MailRefusalInvalidURL is an SMTP URL that is not one of the form
          smtp://user:password@host:port; its "problem" field says the clause.
        name: MailRefusalInvalidURL
    name: MailRefusalNone
  - doc: What a spool reports of a mail.
    grouped: true
    items:
      - doc: MailEventOther is an event of the spool the framework shows nothing of.
        name: MailEventOther
        type: MailEvent
        value: iota
      - doc: MailEventQueued is a mail put in the outbox.
        name: MailEventQueued
      - doc: MailEventSent is a mail the transport accepted.
        name: MailEventSent
      - doc: MailEventRetrying is a failed attempt that will be retried.
        name: MailEventRetrying
      - doc: MailEventDeadLettered is a mail given up on after its last attempt.
        name: MailEventDeadLettered
      - doc: MailEventDuplicate is a redelivery of a mail already sent, dropped.
        name: MailEventDuplicate
    name: MailEventOther
  - doc: |-
      Why a spool gave a mail up: what the framework tells the product's bounce
      hook and the Studio's mailbox of a dead letter.
    grouped: true
    items:
      - doc: MailGivenUpExhausted is a mail whose last attempt failed.
        name: MailGivenUpExhausted
        type: MailGiveUp
        value: iota
      - doc: |-
          MailGivenUpRejected is a mail the receiving server refused for good,
          an SMTP 5xx reply, dead-lettered without a retry.
        name: MailGivenUpRejected
      - doc: |-
          MailGivenUpExpired is a mail whose attempt failed once it was older
          than the spool's MaxAge.
        name: MailGivenUpExpired
    name: MailGivenUpExhausted
  - doc: The two signals an export forwards, as an OTLPBatchValue names them.
    grouped: true
    items:
      - doc: |-
          OTLPTraces names the trace signal: an OTLP/JSON
          ExportTraceServiceRequest.
        name: OTLPTraces
        type: string
        value: "\"traces\""
      - doc: |-
          OTLPMetrics names the metrics signal: an OTLP/JSON
          ExportMetricsServiceRequest.
        name: OTLPMetrics
        type: string
        value: "\"metrics\""
    name: OTLPTraces
  - doc: The full policies an export's queue applies, as the setting spells them.
    grouped: true
    items:
      - doc: OTLPDropOldest takes the oldest batches out until the new one fits.
        name: OTLPDropOldest
        type: string
        value: "\"drop-oldest\""
      - doc: OTLPDropNewest refuses the new batch.
        name: OTLPDropNewest
        type: string
        value: "\"drop-newest\""
      - doc: OTLPBlock makes the producer wait for room, up to a bound.
        name: OTLPBlock
        type: string
        value: "\"block\""
    name: OTLPDropOldest
  - grouped: true
    items:
      - doc: LabelNode is the pprof label naming the node a goroutine works for.
        name: LabelNode
        type: string
        value: "\"app_node\""
      - doc: LabelLoop is the pprof label naming the loop a goroutine belongs to.
        name: LabelLoop
        type: string
        value: "\"app_loop\""
    name: LabelNode
  - doc: The write modes.
    grouped: true
    items:
      - doc: |-
          WriteUpsert writes whatever the key holds: a creation or a
          replacement.
        name: WriteUpsert
        type: WriteMode
        value: iota
      - doc: WriteInsert expects nothing under the key, and is refused otherwise.
        name: WriteInsert
      - doc: |-
          WriteReplace expects a document under the key, and is refused
          otherwise: never a resurrection.
        name: WriteReplace
    name: WriteUpsert
  - doc: The kinds of refusal.
    grouped: true
    items:
      - doc: RefusalNone is no refusal the framework words.
        name: RefusalNone
        type: Refusal
        value: iota
      - doc: |-
          RefusalNotFound is no document under the key, or under the index's
          key.
        name: RefusalNotFound
      - doc: RefusalExists is a document already under the key an insertion names.
        name: RefusalExists
      - doc: RefusalUniqueTaken is another document under a unique index's key.
        name: RefusalUniqueTaken
      - doc: RefusalKeyEmpty is a document whose key is empty.
        name: RefusalKeyEmpty
      - doc: RefusalKeyChanged is an update that changes the document's key.
        name: RefusalKeyChanged
      - doc: RefusalIndexUnknown is an index the store does not declare.
        name: RefusalIndexUnknown
      - doc: RefusalIndexNotUnique is a lookup on an index that is not unique.
        name: RefusalIndexNotUnique
      - doc: RefusalIndexBroken is stored documents that break a unique index.
        name: RefusalIndexBroken
      - doc: RefusalUndecodable is a record that does not decode into its type.
        name: RefusalUndecodable
      - doc: RefusalUnencodable is an entity that does not encode.
        name: RefusalUnencodable
      - doc: RefusalPersist is a write the store could not keep.
        name: RefusalPersist
      - doc: |-
          RefusalLoad is a store that could not be loaded; its "problem" field
          says why.
        name: RefusalLoad
      - doc: RefusalClosed is a call on a closed engine.
        name: RefusalClosed
      - doc: |-
          RefusalUnconfirmed is a write that stands but whose survival across a
          power loss is in doubt.
        name: RefusalUnconfirmed
      - doc: |-
          RefusalVersionsNotKept is a call on the versions of a store that keeps
          none.
        name: RefusalVersionsNotKept
      - doc: |-
          RefusalVersionsRewrite is a rewrite of versions that adds or
          renumbers one.
        name: RefusalVersionsRewrite
      - doc: RefusalNotTrashed is no record in the trash under the key.
        name: RefusalNotTrashed
      - doc: |-
          RefusalKeyTooLong is a key longer than a database's key columns hold;
          its "max" field says how long they hold.
        name: RefusalKeyTooLong
      - doc: RefusalStatement is a statement the database did not complete.
        name: RefusalStatement
      - doc: |-
          RefusalTxClosed is a call with the context of a transaction that
          ended.
        name: RefusalTxClosed
      - doc: |-
          RefusalTxFailed is a transaction or a savepoint the database would
          not open, commit or roll back.
        name: RefusalTxFailed
      - doc: |-
          RefusalOutOfOrder is a migration older than one already applied; its
          "applied" field names the newer.
        name: RefusalOutOfOrder
      - doc: |-
          RefusalRenameTarget is a table whose present name is taken while its
          former one still holds the framework's data (ADR 0180 step 5); its
          "tables" field names them, and nothing was moved.
        name: RefusalRenameTarget
    name: RefusalNone
  - doc: |-
      WorkflowCreateEvent is the event of a transition Start fires: an entity
      entering its workflow.
    items:
      - name: WorkflowCreateEvent
        type: string
        value: "\"create\""
    name: WorkflowCreateEvent
  - doc: The triggers of a transition.
    grouped: true
    items:
      - doc: WorkflowTriggerStart is a creation, which Start fires.
        name: WorkflowTriggerStart
        type: WorkflowTrigger
        value: iota
      - doc: WorkflowTriggerEvent is an event code fires.
        name: WorkflowTriggerEvent
      - doc: "WorkflowTriggerDelay is a timer: a duration spent in a state."
        name: WorkflowTriggerDelay
      - doc: WorkflowTriggerDeadline is a timer at an instant the entity carries.
        name: WorkflowTriggerDeadline
      - doc: WorkflowTriggerGuard is a condition on the entity that holds.
        name: WorkflowTriggerGuard
    name: WorkflowTriggerStart
  - doc: Why a run of a workflow's loop started.
    grouped: true
    items:
      - doc: WorkflowWakeStart is the loop's first run.
        name: WorkflowWakeStart
        type: WorkflowWake
        value: iota
      - doc: WorkflowWakeDue is a transition coming due.
        name: WorkflowWakeDue
      - doc: WorkflowWakeChange is a write that may have brought one forward.
        name: WorkflowWakeChange
    name: WorkflowWakeStart
  - doc: What a workflow's loop reports.
    grouped: true
    items:
      - doc: WorkflowLoopOther is an event of the loop the framework shows nothing of.
        name: WorkflowLoopOther
        type: WorkflowLoopEvent
        value: iota
      - doc: "WorkflowLoopRunStarted is a run starting: Wake and Started are set."
        name: WorkflowLoopRunStarted
      - doc: |-
          WorkflowLoopRunEnded is a run ending: Started, Ended, Next and what
          it could not fire, Err, are set.
        name: WorkflowLoopRunEnded
      - doc: |-
          WorkflowLoopWaiting is the loop asleep until Next, zero for no
          transition due.
        name: WorkflowLoopWaiting
    name: WorkflowLoopOther
  - doc: The engine's failures the framework tells apart, which it words for the product.
    grouped: true
    items:
      - doc: WorkflowFailureNone is no failure the framework words.
        name: WorkflowFailureNone
        type: WorkflowFailure
        value: iota
      - doc: |-
          WorkflowTransitionRefused is an event that leaves no transition from
          the entity's state.
        name: WorkflowTransitionRefused
      - doc: WorkflowEntityMissing is no entity under the key.
        name: WorkflowEntityMissing
      - doc: WorkflowEntityExists is an entity already under the key Start names.
        name: WorkflowEntityExists
      - doc: WorkflowKeyEmpty is an entity whose key is empty.
        name: WorkflowKeyEmpty
      - doc: |-
          WorkflowHookFailed is a hook that returned an error, joined to it;
          its "hook" and "event" fields name the hook's kind and the event.
        name: WorkflowHookFailed
      - doc: |-
          WorkflowHookPanicked is a hook that panicked; its "hook", "panic" and
          "stack" fields say which and how.
        name: WorkflowHookPanicked
      - doc: |-
          WorkflowHookChangedState is an OnEnter hook that changed the state
          it entered.
        name: WorkflowHookChangedState
      - doc: |-
          WorkflowHookChangedKey is an OnEnter hook that changed its entity's
          key.
        name: WorkflowHookChangedKey
      - doc: WorkflowReentrant is an OnEnter hook that fired its own workflow.
        name: WorkflowReentrant
      - doc: WorkflowStoreFailed is the workflow's store that failed.
        name: WorkflowStoreFailed
      - doc: WorkflowJournalFailed is the workflow's journal that failed.
        name: WorkflowJournalFailed
      - doc: |-
          WorkflowFunctionPanicked is a guard or an instant function that
          panicked.
        name: WorkflowFunctionPanicked
      - doc: WorkflowLoopPanicked is the loop that panicked.
        name: WorkflowLoopPanicked
      - doc: |-
          WorkflowWaitAbandoned is a caller that stopped waiting for its
          entity: its context ended.
        name: WorkflowWaitAbandoned
    name: WorkflowFailureNone
