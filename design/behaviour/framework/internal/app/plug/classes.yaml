package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/framework/internal/app/plug
  name: plug
  purpose: "Package plug is where the framework's opt-in subsystems plug in: the HTTP engine, the frontends' file server and the process sampler of the runtime graph (framework/app/server), the Studio — the tool's variables, its routes and the framework's sentences in the languages after English (framework/app/studio) —, the stores and the databases (framework/app/store), the queues (framework/app/queue), the workflows (framework/app/workflow), the mailers (framework/app/mail), the jobs (framework/app/jobs)."
types:
  - fields:
      - doc: |-
          Every is the schedule of a job that runs every period, first one
          period after the scheduler starts; a period that is not positive is
          refused.
        name: Every
        type: func(period time.Duration) (JobScheduleFunc, error)
      - doc: |-
          Cron is the schedule of a five-field POSIX cron expression, in the
          process's local time zone; an expression it cannot read is refused.
        name: Cron
        type: func(expr string) (JobScheduleFunc, error)
      - doc: |-
          Open opens the scheduler the app's jobs run on, as cfg says, with no
          entry yet.
        name: Open
        type: func(cfg *JobSchedulerConfig) JobScheduler
    kind: struct
    name: JobDriverConfig
  - kind: named
    name: JobScheduleFunc
    underlying: func(after time.Time) (next time.Time, ok bool)
  - fields:
      - doc: Clock is the app's clock, which the scheduler stamps and waits on.
        name: Clock
        type: Clock
      - doc: |-
          OnResult hears every decision of the scheduler — each run, with the
          job's own error, and each fire skipped or missed —, one at a time.
        name: OnResult
        type: func(res JobResultValue)
    kind: struct
    name: JobSchedulerConfig
  - fields:
      - doc: Name names the job; the scheduler refuses a name it holds already.
        name: Name
        type: string
      - doc: Schedule says when the job runs next.
        name: Schedule
        type: JobScheduleFunc
      - doc: Run runs the job once; its error is the result's.
        name: Run
        type: func(ctx context.Context) error
      - doc: |-
          Overlap is what a fire does while the job's previous run goes, as the
          SDK scheduler's OverlapPolicy numbers it: 0 skips it — the zero —, 1
          runs it beside, 2 replaces the run; the scheduler refuses any other.
        name: Overlap
        type: uint8
      - doc: |-
          StartingDeadline bounds how late a fire may still start; zero is no
          bound.
        name: StartingDeadline
        type: time.Duration
    kind: struct
    name: JobEntryValue
  - fields:
      - doc: Name is the job's.
        name: Name
        type: string
      - doc: Scheduled is the instant the fire was due.
        name: Scheduled
        type: time.Time
      - doc: Started and Finished bound the run; zero for a fire that did not run.
        name: Started
        type: time.Time
      - doc: Started and Finished bound the run; zero for a fire that did not run.
        name: Finished
        type: time.Time
      - doc: |-
          Missed counts the fires that came due while the scheduler could not
          fire them, skipped rather than caught up.
        name: Missed
        type: int
      - doc: "Skipped says the fire did not run: a run of the same job was going."
        name: Skipped
        type: bool
      - doc: |-
          Expired says the fire did not run: the scheduler came to it more
          than the job's starting deadline after its instant.
        name: Expired
        type: bool
      - doc: |-
          Replaced says a newer fire of a job that replaces its runs cancelled
          this one — before it started when Started is zero.
        name: Replaced
        type: bool
      - doc: Err is the run's error.
        name: Err
        type: error
    kind: struct
    name: JobResultValue
  - kind: named
    name: JobScheduler
    underlying: |-
      interface {
      	// Add registers a job; it is refused while the scheduler runs, for a
      	// name it holds already, and for an entry with no name, run or
      	// schedule.
      	Add(entry JobEntryValue) error
      	// Run fires the jobs until ctx ends, then waits for the runs going.
      	Run(ctx context.Context) error
      }
  - fields:
      - doc: Open opens one mailer's outbox as cfg says, closed until it runs.
        name: Open
        type: func(cfg *MailSpoolConfig) (MailSpool, error)
      - doc: |-
          Validate is the SDK's verdict on a mail: nil when the outbox takes it,
          else what is wrong with it, in the SDK's public words.
        name: Validate
        type: func(msg MailValue) error
      - doc: |-
          Capture is a transport that delivers nothing and keeps the last
          message it composed (MailCaptureSource).
        name: Capture
        type: func() MailSink
      - doc: |-
          ParseSMTP reads an SMTP URL — smtp://user:password@host:port?tls=
          starttls|implicit|none, smtps:// for implicit TLS — as the SDK's
          SMTP transport would take it.
        name: ParseSMTP
        type: func(url string) (MailRelayValue, error)
      - doc: |-
          NewSMTP is the SDK's SMTP transport to relay, which dials nothing
          until a mail is sent.
        name: NewSMTP
        type: func(relay *MailRelayValue) (MailSink, error)
      - doc: |-
          Refused reports whether err, or an error it wraps, is the spool's or
          the URL's refusal of kind: the SDK's sentinels stay in the subsystem,
          and the error keeps the fields the SDK gave it.
        name: Refused
        type: func(err error, kind MailRefusal) bool
    kind: struct
    name: MailDriverConfig
  - kind: named
    name: MailRefusal
    underlying: uint8
  - kind: named
    name: MailEvent
    underlying: uint8
  - kind: named
    name: MailGiveUp
    underlying: uint8
  - fields:
      - doc: |-
          Transport makes one delivery attempt of msg; the spool retries a
          failure, or dead-letters the mail after its last attempt.
        name: Transport
        type: func(ctx context.Context, msg MailValue, attempt MailAttemptValue) error
      - doc: Clock is the app's clock, which the spool stamps and waits on.
        name: Clock
        type: Clock
      - doc: Observe is told each event of each mail.
        name: Observe
        type: func(e *MailEventValue)
      - doc: |-
          Annotate is what the spool keeps of a Send for its deliveries, read
          from the Send's context.
        name: Annotate
        type: func(ctx context.Context) map[string]string
      - doc: NewID mints a mail's outbox ID.
        name: NewID
        type: func() (string, error)
      - doc: |-
          Outbox is the queue the spool keeps its mails in on a database —
          the queue subsystem's, sealed —, nil for a directory or memory.
        name: Outbox
        type: Broker
      - doc: |-
          Database is the database Outbox is on, whose transaction a mail sent
          in one joins; nil for none.
        name: Database
        type: Database
      - doc: |-
          From is the sender of every mail that names none: the SDK's
          mail.Address, held as any.
        name: From
        type: MailValue
      - doc: |-
          Dir is the directory the spool keeps its own queue in; with no Outbox
          and no Dir, the outbox is in memory.
        name: Dir
        type: string
      - doc: |-
          BackoffBase is the wait after a failed attempt, doubled after each,
          up to BackoffMax.
        name: BackoffBase
        type: time.Duration
      - doc: BackoffMax bounds the wait after a failed attempt.
        name: BackoffMax
        type: time.Duration
      - doc: SendTimeout bounds one attempt.
        name: SendTimeout
        type: time.Duration
      - doc: PollInterval bounds an idle wait.
        name: PollInterval
        type: time.Duration
      - doc: |-
          MaxAttempts is how many attempts a mail gets before it is
          dead-lettered.
        name: MaxAttempts
        type: int
      - doc: |-
          MaxMessageBytes bounds one mail in the spool's own queue; zero is the
          spool's own bound.
        name: MaxMessageBytes
        type: int
      - doc: |-
          MaxAge is how long after it was queued a mail may still be retried:
          an attempt that fails later gives it up; zero sets no age.
        name: MaxAge
        type: time.Duration
      - doc: |-
          RetryPermanent retries a mail the receiving server refused for good —
          an SMTP 5xx reply — like a temporary failure, instead of giving it up
          at once.
        name: RetryPermanent
        type: bool
    kind: struct
    name: MailSpoolConfig
  - fields:
      - doc: Value is the SDK's mail value.
        name: Value
        type: any
    kind: struct
    name: MailValue
  - fields:
      - doc: Config is the SDK's SMTP configuration, held as any.
        name: Config
        type: any
      - doc: Server is where it delivers, host:port.
        name: Server
        type: string
      - doc: "TLS is its TLS mode as the URL spells it: starttls, implicit or none."
        name: TLS
        type: string
    kind: struct
    name: MailRelayValue
  - fields:
      - doc: QueuedAt is when the mail was put in the outbox.
        name: QueuedAt
        type: time.Time
      - doc: Meta is what Annotate kept of the Send.
        name: Meta
        type: map[string]string
      - doc: ID is the mail's outbox ID.
        name: ID
        type: string
      - doc: Attempt numbers the attempt, from 1.
        name: Attempt
        type: int
    kind: struct
    name: MailAttemptValue
  - fields:
      - doc: Meta is what Annotate kept of the Send.
        name: Meta
        type: map[string]string
      - doc: FailedAt is when its last attempt failed.
        name: FailedAt
        type: time.Time
      - doc: QueuedAt is when the mail was put in the outbox.
        name: QueuedAt
        type: time.Time
      - doc: Message is the mail.
        name: Message
        type: MailValue
      - doc: |-
          ID is the mail's outbox ID; empty when its record did not decode, and
          QueueID then names it.
        name: ID
        type: string
      - doc: QueueID is the outbox queue's identifier for its record.
        name: QueueID
        type: string
      - doc: Cause is its last failure's public text, "" for none.
        name: Cause
        type: string
      - doc: Attempts counts its delivery attempts.
        name: Attempts
        type: int
      - doc: |-
          GivenUp is why it was given up, read from its last failure's code and
          trail as the outbox kept them.
        name: GivenUp
        type: MailGiveUp
    kind: struct
    name: MailDeadLetterValue
  - fields:
      - doc: Err is a failed attempt's failure.
        name: Err
        type: error
      - doc: |-
          Reply is the SMTP reply the failure carries, nil for none: the
          receiving server's own words, never shown in a public message.
        name: Reply
        type: "*textproto.Error"
      - doc: Meta is what Annotate kept of the Send.
        name: Meta
        type: map[string]string
