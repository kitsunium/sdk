                nil, errs.Wrap(queue.MessageTooLarge, errs.WrapParams{},
                			errs.String("mailer", o.node), errs.Int("bytes", len(payload)), errs.Int("max", o.max))
          when: o.max > 0 && len(payload) > o.max
      - return: o.seal(ctx, payload)
  - of: (*sealedOutbox).lacks
