          		FailedAt: d.FailedAt, Reason: d.Reason, Cause: d.Cause, Message: pluggedMessage(d.Message),
          		Code: d.Code, Deliveries: d.Deliveries, Trail: d.Trail,
          	}
  - of: pluggedStep
    steps:
      - opt:
          do:
            - return: nil
          when: s == nil
      - return:
          closure:
            params: ctx context.Context, ex plug.Executor
            results: error
            steps:
              - return: s(ctx, ex)
  - of: clockOf
