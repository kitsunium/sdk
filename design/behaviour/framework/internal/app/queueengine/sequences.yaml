          when: err != nil
      - return: deferred.PublishAt(ctx, box, at)
        to: deferred.PublishAt
  - of: (*sealedOutbox).PublishOnce
    participants:
      - id: caller
        kind: actor
      - id: (*sealedOutbox).PublishOnce
        kind: self
      - id: o.sealMail
        kind: internal
      - id: once.PublishOnce
        kind: value
    steps:
      - bind: once, ok
        eval: o.Broker.(queue.OncePublisher)
      - opt:
          do:
            - return: queue.Message{}, false, o.lacks("OncePublisher")
          when: "!ok"
      - bind: box, err
        eval: o.sealMail(ctx, payload)
        to: o.sealMail
      - opt:
          do:
            - return: queue.Message{}, false, err
          when: err != nil
