        kind: value
    steps:
      - return: o.manager.ReplayDeadLetter(ctx, id)
        to: o.manager.ReplayDeadLetter
  - of: (*sealedOutbox).DeleteDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*sealedOutbox).DeleteDeadLetter
        kind: self
      - id: o.manager.DeleteDeadLetter
        kind: value
    steps:
      - return: o.manager.DeleteDeadLetter(ctx, id)
        to: o.manager.DeleteDeadLetter
  - of: Enable
    participants:
      - id: caller
        kind: actor
      - id: Enable
        kind: self
      - id: plug.Queues.Store
        kind: value
    steps:
      - eval: |-
          plug.Queues.Store(&plug.QueueDriverConfig{
          		Open: open, TableMigration: tableMigration, TrailMigration: trailMigration,
          		// A nil broker is a nil any: openBroker returns none with its error.
          		OpenSDK: func(cfg plug.QueueConfig) (any, error) {
          			b, err := openSDK(cfg)
          			if err != nil {
          				return nil, err
          			}
          			return b, nil
          		},
          		DoNotRetry: queue.DoNotRetry, NotRetryable: notRetryable,
          	})
        to: plug.Queues.Store
  - of: open
    participants:
      - id: caller
        kind: actor
      - id: open
        kind: self
      - id: clockOf
        kind: internal
      - id: openBroker
        kind: internal
      - id: newSealedOutbox
        kind: internal
    steps:
      - bind: clk
        eval: clockOf(cfg.Clock)
        to: clockOf
      - bind: b, err
        eval: openBroker(&cfg, clk)
        to: openBroker
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: b, err
                  eval: newSealedOutbox(b, &cfg)
                  op: =
                  to: newSealedOutbox
                when: err != nil
          when: cfg.Seal != nil
      - opt:
          do:
            - set: b
              value: wrap(b)
          init:
            bind: wrap, ok
            eval: cfg.Wrap.(func(queue.Broker) queue.Broker)
          when: ok && wrap != nil
      - return: "&broker{q: b, clock: clk}, nil"
  - of: openSDK
    participants:
      - id: caller
        kind: actor
      - id: openSDK
        kind: self
      - id: openBroker
        kind: internal
    steps:
      - return: openBroker(&cfg, clockOf(cfg.Clock))
        to: openBroker
  - of: openBroker
    participants:
      - id: caller
        kind: actor
      - id: openBroker
        kind: self
      - id: policyOf
        kind: internal
      - id: openSQL
        kind: internal
      - id: queue
        kind: package
    steps:
      - bind: policy
        eval: policyOf(cfg.Policy)
        to: policyOf
      - switch:
          cases:
            - case: cfg.Database != nil
              do:
                - return: openSQL(cfg, policy, clk)
                  to: openSQL
            - case: cfg.Dir != ""
              do:
                - return: "queue.NewFile(queue.FileConfig{Clock: clk, Dir: cfg.Dir, Policy: policy})"
                  to: queue
      - return: "queue.NewMemory(queue.MemoryConfig{Clock: clk, Policy: policy})"
        to: queue
  - of: openSQL
    participants:
      - id: caller
        kind: actor
      - id: openSQL
        kind: self
      - id: storeengine
        kind: package
      - id: queue
        kind: package
    steps:
      - bind: tm, dialect, ok
        eval: storeengine.SQLOf(cfg.Database)
        to: storeengine
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(queue.SQLQueueMisconfigured, errs.WrapParams{},
                			errs.String("queue", cfg.Name), errs.String("problem", "the queue's database was not opened by the store subsystem"))
          when: "!ok"
      - return: "queue.NewSQL(queue.SQLConfig{Table: cfg.Table, Policy: policy, Clock: clk, Transactor: tm, Dialect: dialect, Trail: true})"
        to: queue
  - of: policyOf
    steps:
      - return: |-
          queue.Policy{
          		VisibilityTimeout: p.VisibilityTimeout, RetryDelay: p.RetryDelay, MaxRetryDelay: p.MaxRetryDelay,
          		MaxDeliveries: p.MaxDeliveries, MaxMessageBytes: p.MaxMessageBytes,
          	}
  - of: notRetryable
    participants:
      - id: caller
        kind: actor
      - id: notRetryable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.HasCode(err, queue.CodeNotRetryable)
        to: errs
  - of: tableMigration
    participants:
      - id: caller
        kind: actor
      - id: tableMigration
        kind: self
      - id: dialectOf
        kind: internal
      - id: queue
        kind: package
    steps:
      - bind: d, err
        eval: dialectOf(dialect)
        to: dialectOf
      - opt:
          do:
            - return: plug.MigrationValue{}, err
          when: err != nil
      - bind: m, err
        eval: queue.SQLMigration(d, table, version)
        to: queue
      - opt:
          do:
            - return: plug.MigrationValue{}, err
          when: err != nil
      - return: "plug.MigrationValue{Version: m.Version, Name: m.Name, Up: pluggedStep(m.Up), Down: pluggedStep(m.Down)}, nil"
  - of: trailMigration
    participants:
      - id: caller
        kind: actor
      - id: trailMigration
        kind: self
      - id: dialectOf
        kind: internal
      - id: queue
        kind: package
    steps:
      - bind: d, err
        eval: dialectOf(dialect)
        to: dialectOf
      - opt:
          do:
            - return: plug.MigrationValue{}, err
          when: err != nil
      - bind: m, err
        eval: queue.SQLTrailMigration(d, table, version)
        to: queue
      - opt:
          do:
            - return: plug.MigrationValue{}, err
          when: err != nil
      - return: "plug.MigrationValue{Version: m.Version, Name: m.Name, Up: pluggedStep(m.Up), Down: pluggedStep(m.Down)}, nil"
  - of: dialectOf
    steps:
      - switch:
          cases:
            - case: model.EnginePostgres
              do:
                - return: sql.DialectPostgres, nil
            - case: model.EngineMySQL
              do:
                - return: sql.DialectMySQL, nil
            - case: model.EngineSQLite
              do:
                - return: sql.DialectSQLite, nil
          "on": name
      - return: 0, errs.Wrap(sql.UnknownDialect, errs.WrapParams{}, errs.String("dialect", name))
