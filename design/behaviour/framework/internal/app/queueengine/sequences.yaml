      - return: |-
          w.PutDeadLetter(ctx, queue.DeadLetter{
          		FailedAt: dead.FailedAt, Reason: dead.Reason, Cause: dead.Cause, Message: sdkMessage(dead.Message),
          		Code: dead.Code, Deliveries: dead.Deliveries, Trail: dead.Trail,
          	})
        to: w.PutDeadLetter
  - of: (*broker).Close
    participants:
      - id: caller
        kind: actor
      - id: (*broker).Close
        kind: self
      - id: c.Close
        kind: value
    steps:
      - opt:
          do:
            - return: c.Close()
              to: c.Close
