package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/framework/internal/app/queueengine
  name: queueengine
  purpose: "Package queueengine is what framework/app/queue plugs into kit: the brokers the framework's consumers' queues run on — the SDK's queue in memory, in the data directory and over SQL, a mailer's outbox on a database sealed in front of the SQL one —, the consumer that delivers them, and the migration of a queue's table (ADR 0179 §1, step 4)."
types:
  - doc: broker is one of the SDK's brokers as kit's core uses it.
    fields:
      - name: q
        type: queue.Broker
      - name: clock
        type: clock.Timed
    kind: struct
    methods:
      - doc: |-
          Publish puts payload in the queue, in the transaction ctx carries for its
          database when it lives on one.
        name: Publish
        params: ctx context.Context, payload []byte
        recv: b *broker
        results: error
      - doc: |-
          PublishAt puts payload in the queue, received by no consumer before at,
          in the transaction ctx carries for its database when it lives on one.
        name: PublishAt
        params: ctx context.Context, payload []byte, at time.Time
        recv: b *broker
        results: error
      - doc: |-
          PublishOnce puts payload in the queue unless a publication under key was
          made within window, and reports whether it did.
        name: PublishOnce
        params: ctx context.Context, key string, payload []byte, window time.Duration
        recv: b *broker
        results: bool, error
      - doc: |-
          Consume runs the SDK's consumer over the queue until ctx ends or its
          storage fails: every handler kit runs tolerates a redelivery. A stop lets
          the running handler finish within cfg's drain, each outcome bounded by its
          settle, and the lease of a running handler is renewed when cfg says so. A
          failure whose handler asked for a delay of its own (cfg.RetryIn) is the
          SDK's queue.RetryAfter: its message comes back after that delay.
        name: Consume
        params: ctx context.Context, cfg plug.ConsumeConfig
        recv: b *broker
        results: error
      - doc: DeadLetters are up to maxLetters of the queue's dead letters.
        name: DeadLetters
        params: ctx context.Context, maxLetters int
        recv: b *broker
        results: "[]plug.DeadLetterValue, error"
      - doc: |-
          Messages are up to maxMessages live messages after the identifier after,
          as they lie.
        name: Messages
        params: ctx context.Context, after string, maxMessages int
        recv: b *broker
        results: "[]plug.LiveMessageValue, error"
      - doc: PutMessage writes live as it lies.
        name: PutMessage
        params: ctx context.Context, live plug.LiveMessageValue
        recv: b *broker
        results: string, error
      - doc: PutDeadLetter writes dead as it lies.
        name: PutDeadLetter
        params: ctx context.Context, dead plug.DeadLetterValue
        recv: b *broker
        results: string, error
      - doc: |-
          Close releases what the queue holds — a file queue's directory
          descriptors —; nothing for a queue that holds none.
        name: Close
        recv: b *broker
        results: error
    name: broker
  - doc: |-
      sdkClock is the app's clock, as kit's core hands it (plug.Clock), as the
      SDK's queue stamps and waits on it: the same instants and the same timers,
      a test's manual clock included.
    fields:
      - name: ""
        role: embedded
        type: plug.Clock
    kind: struct
    methods:
      - doc: NewTimer is the clock's timer, as the SDK's.
        name: NewTimer
        params: d time.Duration
        recv: c sdkClock
        results: clock.Timer
      - doc: NewTicker is the clock's ticker, as the SDK's.
        name: NewTicker
        params: d time.Duration
        recv: c sdkClock
        results: clock.Ticker
    name: sdkClock
  - doc: |-
      sealedOutbox is the broker a mailer's spool writes into and delivers from
      when its outbox is on a database: the SQL broker, each payload sealed on
      its way in and opened on its way out — a delivery's and a dead letter's.
      It answers every sibling the SQL broker answers, so the spool keeps its
      wake, its lease renewal and its dead letters.
    fields:
      - name: ""
        role: embedded
        type: queue.Broker
      - name: waker
        type: queue.Waker
      - name: renew
        type: queue.LeaseExtender
      - name: dead
        type: queue.DeadLetterReader
      - name: reject
        type: queue.Rejecter
      - name: release
        type: queue.Releaser
      - name: manager
        type: queue.DeadLetterManager
      - name: seal
        type: func(ctx context.Context, payload []byte) ([]byte, error)
      - name: unseal
        type: func(ctx context.Context, box []byte) []byte
      - doc: |-
          node is the mailer's node ID, max the bound of a mail before it is
          sealed.
        name: node
        type: string
      - name: max
        type: int
    kind: struct
    methods:
      - doc: |-
          Publish seals payload — a mail as the spool writes it — and publishes the
          box, in the transaction ctx carries when there is one. A mail larger than
          the bound is the queue's MessageTooLarge, as the spool's own queue would
          say it, and nothing is published.
        name: Publish
        params: ctx context.Context, payload []byte
        recv: o *sealedOutbox
        results: queue.Message, error
      - doc: Receive leases up to maxMessages mails and opens each.
        name: Receive
        params: ctx context.Context, maxMessages int
        recv: o *sealedOutbox
        results: "[]queue.Delivery, error"
      - doc: open is the mail a box holds, the box as it lies when it does not open.
        name: open
        params: ctx context.Context, payload []byte
        recv: o *sealedOutbox
        results: "[]byte"
      - doc: Wake is the SQL broker's.
        name: Wake
        recv: o *sealedOutbox
        results: queue.Wake
      - doc: Extend is the SQL broker's.
        name: Extend
        params: ctx context.Context, receipt queue.Receipt, by time.Duration
        recv: o *sealedOutbox
        results: queue.Lease, error
      - doc: Reject is the SQL broker's.
        name: Reject
        params: ctx context.Context, receipt queue.Receipt, cause error
        recv: o *sealedOutbox
        results: error
      - doc: |-
          Release is the SQL broker's: a mail the spool did not finish goes back
          as it lies, its attempt not counted.
        name: Release
        params: ctx context.Context, receipt queue.Receipt
        recv: o *sealedOutbox
        results: error
      - doc: |-
          DeadLetters returns up to maxLetters dead mails, oldest first, each
          opened as a delivery is.
        name: DeadLetters
        params: ctx context.Context, maxLetters int
        recv: o *sealedOutbox
        results: "[]queue.DeadLetter, error"
      - doc: |-
          Messages lists up to maxMessages live mails after an identifier, each
          opened as a delivery is (queue.MessageReader): what a data copy
          fingerprints, the mail and not its box.
        name: Messages
        params: ctx context.Context, after string, maxMessages int
        recv: o *sealedOutbox
        results: "[]queue.LiveMessage, error"
      - doc: |-
          PutMessage seals a mail, as it waits in a file outbox, and writes the box
          into the table with its count and its instants (queue.MessageWriter):
          what a data copy moves a mailer's outbox with.
        name: PutMessage
        params: ctx context.Context, live queue.LiveMessage
        recv: o *sealedOutbox
        results: string, error
      - doc: |-
          PutDeadLetter seals a dead mail and writes the box into the table's dead
          letters with its cause (queue.DeadLetterWriter).
        name: PutDeadLetter
        params: ctx context.Context, dead queue.DeadLetter
        recv: o *sealedOutbox
        results: string, error
      - doc: sealMail seals a mail as Publish does, refusing one above the bound.
        name: sealMail
        params: ctx context.Context, payload []byte
        recv: o *sealedOutbox
        results: "[]byte, error"
      - doc: |-
          lacks is the refusal of a capability the broker behind the sealing does
          not have.
        name: lacks
        params: capability string
        recv: o *sealedOutbox
        results: error
      - doc: |-
          NackAfter is the SQL broker's (queue.DelayedNacker): the spool parks a
          mail for its backoff with it, the box staying as it lies.
        name: NackAfter
        params: ctx context.Context, receipt queue.Receipt, cause error, delay time.Duration
        recv: o *sealedOutbox
        results: queue.Nack, error
      - doc: |-
          PublishAt seals payload as Publish does and publishes the box, received by
          no consumer before at (queue.DelayedPublisher).
        name: PublishAt
        params: ctx context.Context, payload []byte, at time.Time
        recv: o *sealedOutbox
        results: queue.Message, error
      - doc: |-
          PublishOnce seals payload as Publish does and publishes the box at most
          once per key over window (queue.OncePublisher).
        name: PublishOnce
        params: ctx context.Context, key string, payload []byte, window time.Duration
        recv: o *sealedOutbox
        results: queue.Message, bool, error
      - doc: "ReplayDeadLetter is the SQL broker's: the box goes back as it lies."
        name: ReplayDeadLetter
        params: ctx context.Context, id string
        recv: o *sealedOutbox
        results: error
      - doc: DeleteDeadLetter is the SQL broker's.
        name: DeleteDeadLetter
        params: ctx context.Context, id string
        recv: o *sealedOutbox
        results: error
    name: sealedOutbox
vars:
  - doc: |-
      : Asserts at compile time that a queue is what plug describes, with every
      sibling kit's core asks for, that a mailer's sealed outbox answers every
      sibling the SDK's SQL broker does, and that the app's clock is the SDK's.
    grouped: true
    items:
      - name: _
        type: plug.Broker
        value: (*broker)(nil)
      - name: _
        type: plug.MessageMover
        value: (*broker)(nil)
      - name: _
        type: plug.LaterPublisher
        value: (*broker)(nil)
      - name: _
        type: io.Closer
        value: (*broker)(nil)
      - name: _
        type: queue.Waker
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.LeaseExtender
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.DeadLetterReader
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.Rejecter
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.Releaser
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.DelayedNacker
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.DelayedPublisher
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.OncePublisher
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.DeadLetterManager
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.MessageReader
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.MessageWriter
        value: (*sealedOutbox)(nil)
      - name: _
        type: queue.DeadLetterWriter
        value: (*sealedOutbox)(nil)
      - name: _
        type: clock.Timed
        value: sdkClock{}
    name: _
