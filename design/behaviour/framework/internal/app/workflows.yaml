      - var:
          name: out
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, id)
                when: id != "" && !slices.Contains(out, id)
          key: _
          range: ids
          value: id
      - return: out
  - of: (*App).storeWarnings
    steps:
      - var:
          name: out
          type: "[]model.Diagnostic"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, a.storeWarningsOf(st)...)
                when: st.plan().personal()
          key: _
          range: a.productStores()
          value: st
      - return: out
  - of: yieldKeys
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: "!yield(key, nil)"
          key: _
          range: keys
          value: key
      - opt:
          do:
            - return: "true"
          when: failure == nil
      - return: yield("", failure) && failure == nil
  - of: (*storeCore).keysTo
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - return: nil
                when: "!yield(key, nil)"
          key: key
          range: s.keys(ctx)
          value: err
      - return: nil
  - of: mailersOf
    steps:
      - bind: out
        eval: map[string][]string{}
      - loop:
          do:
            - opt:
                do:
                  - set: out[e.From]
                    value: append(out[e.From], e.To)
                when: e.Kind == model.EdgeSends
          key: _
          range: g.Edges
          value: e
      - return: out
  - of: reservedPath
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: p == strings.TrimSuffix(prefix, "/") || strings.HasPrefix(p, prefix)
          key: _
          range: "[]string{reservedPrefix, formerReserved}"
          value: prefix
      - return: "false"
  - of: renamedVariables
    steps:
      - opt:
          do:
            - return: nil
          when: appPrefix(name) == formerPrefix
      - var:
          name: out
          type: "[]renamedName"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: "append(out, renamedName{old: old, now: productVariable(name, stem)})"
                init:
                  bind: old
                  eval: formerPrefix + "_" + stem
                when: getenv(old) != ""
          key: _
          range: operatorStems
          value: stem
      - return: out
  - of: uniqueRenamed
    steps:
      - bind: seen
        eval: map[declaredField]bool{}
      - bind: out
        eval: in[:0:0]
      - loop:
          do:
            - opt:
                do:
                  - set: seen[r.field]
                    value: "true"
                  - set: out
                    value: append(out, r)
                when: "!seen[r.field]"
          key: _
          range: in
          value: r
      - return: out
  - of: renamedIn
    steps:
      - var:
          name: out
          type: "[]renamedName"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: d.typ == nil || seen[d.typ]
            - set: seen[d.typ]
              value: "true"
            - loop:
                do:
                  - set: out
                    value: append(out, r.name)
                key: _
                range: planOf(d.typ).renamed
                value: r
          key: _
          range: types
          value: d
      - return: out
  - of: distinct
    steps:
      - bind: out
        eval: make([]string, 0, len(refs))
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, r)
                when: "!slices.Contains(out, r)"
          key: _
          range: refs
          value: r
      - return: out
  - of: reservedPrefixOf
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: prefix
                when: strings.HasPrefix(name, prefix)
          key: _
          range: "[]string{ownSecretPrefix, formerSecretPrefix}"
          value: prefix
      - return: "\"\""
  - of: (*retentionRun).earliest
    steps:
      - lock:
          mutex: r.mu
      - var:
          name: first
          type: time.Time
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: at
                when: first.IsZero() || at.Before(first)
          key: _
          range: r.agenda
          value: at
      - return: first
  - of: fieldType
    steps:
      - opt:
          do:
            - return: nil, false
          when: opaque(t)
      - loop:
          do:
            - opt:
                do:
                  - return: t.FieldByIndex(f.Index).Type, true
                when: f.Name == name
          key: _
          range: jsonshape.Of(t).Fields
          value: f
      - return: nil, false
  - of: matchSegs
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: pattern[i] != "*" && pattern[i] != segs[i]
          key: i
          range: pattern
      - return: "true"
  - of: (*Binary).roleNamed
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: r
                when: r.name == name
          key: _
          range: b.roles
          value: r
      - return: nil
  - of: (*Binary).selectRole
    steps:
      - var:
          name: best
          type: "*role"
      - loop:
          do:
            - opt:
                do:
                  - set: best
                    value: r
                when: len(r.args) <= len(args) && slices.Equal(r.args, args[:len(r.args)]) && (best == nil || len(r.args) > len(best.args))
          key: _
          range: b.roles
          value: r
      - opt:
          do:
            - return: nil, args
          when: best == nil
      - return: best, args[len(best.args):]
  - of: (*App).sealingStores
    steps:
      - var:
          name: sealed
          type: "[]placementSource"
      - loop:
          do:
            - opt:
                do:
                  - set: sealed
                    value: append(sealed, st)
                init:
                  bind: s, ok
                  eval: st.(sealingSource)
                when: ok && !frameworkOwn(st.base().svc) && s.sealsAtRest(a)
          key: _
          range: a.placedStores()
          value: st
      - return: sealed
  - of: scanString
    steps:
      - loop:
          cond: j < len(b)
          do:
            - switch:
                cases:
                  - case: "'\\\\'"
                    do:
                      - op: ++
                        set: j
                  - case: "'\"'"
                    do:
                      - return: j + 1, true
                "on": b[j]
          init: j := i + 1
          post: j++
      - return: len(b), false
  - of: writeObject
    steps:
      - bind: "n"
        eval: 2 + len(members)*2
      - loop:
          do:
            - op: +=
              set: "n"
              value: len(m.rawName) + len(m.value)
          key: _
          range: members
          value: m
      - bind: b
        eval: make([]byte, 0, n)
      - set: b
        value: append(b, '{')
      - loop:
          do:
            - opt:
                do:
                  - set: b
                    value: append(b, ',')
                when: i > 0
            - set: b
              value: append(append(append(b, m.rawName...), ':'), m.value...)
          key: i
          range: members
          value: m
      - return: append(b, '}')
  - of: appPrefix
    steps:
      - bind: b
        eval: "[]byte(strings.ToUpper(name))"
      - loop:
          do:
            - opt:
                do:
                  - set: b[i]
                    value: "'_'"
                when: (c < 'A' || c > 'Z') && (c < '0' || c > '9')
          key: i
          range: b
          value: c
      - return: string(b)
  - of: (*App).distinctSecrets
    steps:
      - var:
          name: out
          type: "[]model.Diagnostic"
      - var:
          name: secrets
          type: "[]*Secret"
      - bind: owner
        eval: map[string]string{}
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: |-
                      append(out, diagnosticOf("error", s.id, a.source(&s.decl),
                      				say("secret.twice", "name", s.key(), "first", first, "second", s.id, "variable", s.variable(a))))
                  - continue: true
                init:
                  bind: first, dup
                  eval: owner[s.keptName()]
                when: dup
            - set: owner[s.keptName()]
              value: s.id
            - set: secrets
              value: append(secrets, s)
          key: _
          range: a.declaredSecrets()
          value: s
      - return: secrets, out
  - of: fileList
    steps:
      - bind: items, ok
        eval: v.raw.([]any)
      - opt:
          do:
            - return: settingValue{}, valueProblem("value.list")
          when: "!ok"
      - bind: list
        eval: make([]string, 0, len(items))
      - loop:
          do:
            - bind: text, ok
              eval: item.(string)
            - opt:
                do:
                  - return: settingValue{}, valueProblem("value.list")
                when: "!ok"
            - set: list
              value: append(list, text)
          key: _
          range: items
          value: item
      - return: settingValue{list}, nil
  - of: (*App).moduleSections
    steps:
      - opt:
          do:
            - return: values
          when: len(a.modules) == 0
      - bind: out
        eval: make(map[string]any, len(values))
      - loop:
          do:
            - bind: section, isMap
              eval: v.(map[string]any)
            - switch:
                cases:
                  - case: a.mountsModule(key) && isMap
                    do:
                      - loop:
                          do:
                            - set: out[key+"."+name]
                              value: value
                          key: name
                          range: section
                          value: value
                  - case: a.mountsModule(key)
                    do:
                      - eval: problem("", nil, "setting.file-section", "file", file, "module", key)
                  - case: strings.Contains(key, ".")
                    do:
                      - eval: problem("", nil, "setting.file-unknown", "file", file, "key", key)
                  - default: true
                    do:
                      - set: out[key]
                        value: v
          key: key
          range: values
          value: v
      - return: out
  - of: (*App).mountsModule
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: mm.module.name == name
          key: _
          range: a.modules
          value: mm
      - return: "false"
  - of: (*App).frameworkTables
    steps:
      - var:
          name: out
          type: "[]frameworkTable"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, storeTables(t, st.base())...)
                init:
                  bind: t, ok
                  eval: st.(tabled)
                when: ok && a.keptOn(st, d)
          key: _
          range: a.placedStores()
          value: st
      - loop:
          do:
            - set: out
              value: append(out, a.nodeTables(n, d)...)
          key: _
          range: a.mountedNodes()
          value: "n"
      - return: out
  - of: unlinkedSubsystems
    steps:
      - var:
          name: out
          type: "[]subsystem"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, s)
                when: "!s.linked()"
          key: _
          range: subsystems
          value: s
      - return: out
  - of: (*App).unlinkedApp
    steps:
      - var:
          name: out
          type: "[]unlinkedDecl"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: s.app == nil
            - opt:
                do:
                  - set: out
                    value: "append(out, unlinkedDecl{node: otlpNode, at: a.source(at), sub: s})"
                init:
                  bind: at
                  eval: s.app(a)
                when: at != nil
          key: _
          range: missing
          value: s
      - return: out
  - of: (*unit).held
    steps:
      - lock:
          mutex: u.tx.mu
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: "n"
                when: "!e.inside"
          key: _
          range: u.tx.held[min(u.heldMark, len(u.tx.held)):]
          value: e
      - return: "n"
  - of: writtenHomes
    steps:
      - bind: written
        eval: map[string]map[string]bool{}
      - loop:
          do:
            - bind: home, stored
              eval: homes[e.To]
            - opt:
                do:
                  - continue: true
                when: "!stored || !writesStore(e.Kind) || !transactional(g.Node(e.From))"
            - opt:
                do:
                  - set: written[e.From]
                    value: map[string]bool{}
                when: written[e.From] == nil
            - set: written[e.From][home]
              value: "true"
          key: _
          range: edges
          value: e
      - return: written
  - of: transactBlockWarnings
    steps:
      - var:
          name: out
          type: "[]model.Diagnostic"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: n.Code == nil
            - loop:
                do:
                  - set: out
                    value: append(out, funcBlockWarnings(n.ID, f, homes)...)
                key: _
                range: n.Code.Funcs
                value: f
          key: _
          range: static.Nodes
          value: "n"
      - return: out
  - of: blockHomes
    steps:
      - bind: dbs
        eval: map[string]bool{}
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: st.Effect == 0 || !under(f, st.Block, block)
            - bind: e
              eval: f.Effects[st.Effect-1]
            - opt:
                do:
                  - set: dbs[home]
                    value: "true"
                init:
                  bind: home, stored
                  eval: homes[e.Target]
                when: stored && writesStore(e.Kind)
          key: _
          range: f.Steps
          value: st
      - return: dbs
  - of: under
    steps:
      - loop:
          cond: b > 0 && b <= len(f.Blocks)
          do:
            - opt:
                do:
                  - return: "true"
                when: b == target
          init: b := block
          post: b = f.Blocks[b-1].Parent
      - return: "false"
  - of: (*App).storeHomes
    steps:
      - bind: out
        eval: map[string]string{}
      - loop:
          do:
            - bind: "n"
              eval: "&g.Nodes[i]"
            - opt:
                do:
                  - continue: true
                when: n.Kind != model.KindStore || n.Store == nil
            - opt:
                do:
                  - continue: true
                init:
                  bind: s, ok
                  eval: a.findNode(n.ID).(interface{ memoryOnly() bool })
                when: ok && s.memoryOnly()
            - set: out[n.ID]
              value: localName
            - opt:
                do:
                  - set: out[n.ID]
                    value: "\"database \" + n.Store.Database"
                when: n.Store.Database != ""
          key: i
          range: g.Nodes
      - return: out
  - of: (*trashRun).earliest
    steps:
      - lock:
          mutex: r.mu
      - var:
          name: first
          type: time.Time
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: e.due
                when: first.IsZero() || e.due.Before(first)
          key: _
          range: r.agenda
          value: e
      - return: first
  - of: (*Watch).feeders
    steps:
      - var:
          name: out
          type: "[]feeder"
      - loop:
          do:
            - bind: ws, ok
              eval: st.(feeder)
            - opt:
                do:
                  - set: out
                    value: append(out, ws)
                when: ok && (w.ownStores || st.base().svc.module != w.svc.module) && len(markedFields(st, w.mark)) > 0
          key: _
          range: a.productStores()
          value: st
      - return: out
  - of: placeholderName
    steps:
      - opt:
          do:
            - return: "false"
          when: name == ""
      - loop:
          do:
            - switch:
                cases:
                  - case: c == '_', c >= 'a' && c <= 'z', c >= 'A' && c <= 'Z'
                  - case: i > 0 && c >= '0' && c <= '9'
                  - default: true
                    do:
                      - return: "false"
          key: i
          range: name
          value: c
      - return: "true"
  - of: (*WorkflowService).see
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: w.order
                    value: append(w.order, st)
                when: "!slices.Contains(w.order, st)"
          key: _
          range: states
          value: st
  - of: (*WorkflowService).hasAuto
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: x.trigger != model.TriggerEvent
          key: _
          range: w.arrows
          value: x
      - return: "false"
  - of: (*WorkflowService).Can
    steps:
      - bind: cur
        eval: "*w.state(&e)"
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: x.event == event && x.from == cur && x.trigger == model.TriggerEvent
          key: _
          range: w.arrows
          value: x
      - return: "false"
  - of: recordOf
    steps:
      - opt:
          do:
            - return: plug.WorkflowRecordValue{}, false
          when: "!declared[inst.State]"
      - bind: rec
        eval: "plug.WorkflowRecordValue{Key: key, State: inst.State, Entered: inst.EnteredAt}"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!declared[s.To] || (!declared[s.From] && s.Trigger != model.TriggerCreate)"
            - bind: from
              eval: s.From
            - opt:
                do:
                  - set: from
                    value: "\"\""
                when: "!declared[from]"
            - set: rec.History
              value: |-
                append(rec.History, plug.WorkflowStepValue{
                			Event: s.Event, From: from, To: s.To, Trigger: engineTrigger(s.Trigger), Actor: s.Caller, At: s.At,
                		})
          key: _
          range: inst.History
          value: s
      - return: rec, true
  - of: instanceOf
    steps:
      - bind: inst
        eval: "model.Instance{ID: rec.Key, State: rec.State, EnteredAt: rec.Entered.UTC()}"
      - loop:
          do:
            - bind: step
              eval: "model.Step{Event: s.Event, From: s.From, To: s.To, At: s.At.UTC(), Trigger: frameworkTrigger(s.Trigger), Caller: s.Actor}"
            - opt:
                do:
                  - set: step.From
                    value: "\"\""
                when: s.Trigger == plug.WorkflowTriggerStart
            - set: inst.History
              value: append(inst.History, step)
          key: _
          range: rec.History
          value: s
      - return: inst
  - of: instancesOf
    steps:
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: out
        eval: make([]model.Instance, 0, len(ds))
      - loop:
          do:
            - bind: inst, ok
              eval: d.Value.(model.Instance)
            - opt:
                do:
                  - bind: v, err
                    eval: instanceConfig.decode(d.JSON)
                  - opt:
                      do:
                        - return: nil, err
                      when: err != nil
                  - set: inst, _
                    value: v.(model.Instance)
                when: "!ok"
            - set: out
              value: append(out, inst)
          key: _
          range: ds
          value: d
      - return: out, nil
