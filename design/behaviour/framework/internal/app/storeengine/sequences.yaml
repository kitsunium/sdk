    steps:
      - bind: db, ok
        eval: cfg.Database.(*database)
      - opt:
          do:
            - return: |-
                nil, plug.Refuse(plug.RefusalLoad, errs.Wrap(docstore.LoadFailed, errs.WrapParams{},
                			errs.String("problem", "the store's database was not opened by the store subsystem")))
          when: "!ok"
      - bind: e
        eval: "&sqlEngine{docs: &documents{cfg: cfg}}"
      - bind: dcfg
        eval: "docstore.SQLConfig[docRecord]{Key: e.docs.keyOf, Transactor: db.tm, Dialect: db.dialect, Table: cfg.Table, IndexKey: cfg.IndexKey}"
      - opt:
          do:
            - set: dcfg.Versions, dcfg.Clock, dcfg.Held
              value: cfg.Versions, clockOf(cfg.Clock), cfg.Held
          when: cfg.Versions > 0
      - bind: ds, err
        eval: docstore.OpenSQL(dcfg, e.docs.specs()...)
        to: docstore
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - set: e.ds
        value: ds
      - return: e, nil
