      - bind: stones, err
        eval: e.ds.Tombstones(ctx)
        to: e.ds.Tombstones
      - return: pluggedTombstones(stones), said(err)
        to: pluggedTombstones
  - of: (*sqlEngine).VersionList
    participants:
      - id: caller
        kind: actor
      - id: (*sqlEngine).VersionList
        kind: self
      - id: e.ds.Versions
        kind: value
      - id: pluggedVersions
        kind: internal
    steps:
      - bind: vs, err
        eval: e.ds.Versions(ctx, key)
        to: e.ds.Versions
      - return: pluggedVersions(vs), said(err)
        to: pluggedVersions
  - of: (*sqlEngine).Current
    participants:
      - id: caller
        kind: actor
      - id: (*sqlEngine).Current
        kind: self
      - id: e.ds.Get
        kind: value
    steps:
      - bind: r, err
        eval: e.ds.Get(ctx, key)
        to: e.ds.Get
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - return: r.raw, nil
  - of: (*sqlEngine).KeepsVersions
    steps:
      - return: e.keep() > 0
  - of: (*sqlEngine).PutDocument
    participants:
      - id: caller
        kind: actor
      - id: (*sqlEngine).PutDocument
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.PutDocument(ctx, key, sdkVersions(versions), trashedAt))
        to: said
  - of: (*sqlEngine).InsertRaw
    participants:
      - id: caller
        kind: actor
      - id: (*sqlEngine).InsertRaw
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.Insert(ctx, rawRecord(raw)))
        to: said
  - of: Enable
    participants:
      - id: caller
        kind: actor
      - id: Enable
        kind: self
      - id: plug.Stores.Store
        kind: value
    steps:
      - eval: |-
          plug.Stores.Store(&plug.StoreDriverConfig{
          		Open: open, Database: openDatabase, TableMigration: tableMigration,
          		FormerTables: formerTables, RenameTables: renameTables,
          	})
        to: plug.Stores.Store
  - of: open
    participants:
      - id: caller
        kind: actor
      - id: open
        kind: self
      - id: openSQL
        kind: internal
      - id: openFile
        kind: internal
    steps:
      - opt:
          do:
            - return: openSQL(&cfg)
              to: openSQL
          when: cfg.Database != nil
      - return: openFile(&cfg)
        to: openFile
