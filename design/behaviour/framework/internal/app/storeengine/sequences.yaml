    steps:
      - return: said(d.checker.Check(ctx))
        to: said
  - of: (*database).Migrator
    participants:
      - id: caller
        kind: actor
      - id: (*database).Migrator
        kind: self
      - id: sql
        kind: package
    steps:
      - bind: m, err
        eval: "sql.NewMigrator(d.cfg, sql.MigrateConfig{Migrations: sqlMigrations(ms), VersionTable: table})"
        to: sql
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - return: "migrator{m: m}, nil"
  - of: SQLOf
    steps:
      - bind: d, ok
        eval: db.(*database)
      - opt:
          do:
            - return: nil, 0, false
          when: "!ok"
      - return: d.tm, d.dialect, true
  - of: migrator.Plan
    participants:
      - id: caller
        kind: actor
      - id: migrator.Plan
        kind: self
      - id: m.m.Plan
        kind: value
      - id: pluggedMigrations
