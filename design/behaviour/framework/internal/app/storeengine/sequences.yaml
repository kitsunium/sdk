      - id: said
        kind: internal
    steps:
      - return: |-
          said(d.tm.Transact(ctx, sql.TxOptions{}, func(ctx context.Context, _ sql.Executor) error {
          		return fn(ctx)
          	}))
        to: said
  - of: (*database).InTransaction
    participants:
      - id: caller
        kind: actor
      - id: (*database).InTransaction
        kind: self
      - id: j.Join
        kind: value
    steps:
      - bind: j, ok
        eval: d.tm.(sql.Joiner)
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: _, in
        eval: j.Join(ctx)
        to: j.Join
      - return: in
  - of: (*database).Defer
    steps:
      - bind: df, ok
