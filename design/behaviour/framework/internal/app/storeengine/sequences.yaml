            - set: out[i]
              to: pluggedMigration
              value: pluggedMigration(m)
          key: i
          range: ms
          value: m
      - return: out
  - of: pluggedMigration
    steps:
      - return: "plug.MigrationValue{Version: m.Version, Name: m.Name, Up: pluggedStep(m.Up), Down: pluggedStep(m.Down)}"
