          when: cfg.Data != nil
      - opt:
          do:
            - set: dcfg.Versions, dcfg.Clock
              value: cfg.Versions, clockOf(cfg.Clock)
            - set: dcfg.Held
              value:
                closure:
                  params: key string
                  results: bool
                  steps:
                    - opt:
                        do:
                          - return: "true"
                        init:
                          bind: _, undoing
                          eval: e.undoing.Load(key)
                          to: e.undoing.Load
                        when: undoing
                    - return: cfg.Held != nil && cfg.Held(context.Background(), key)
          when: cfg.Versions > 0
      - bind: ds, err
        eval: docstore.Open(dcfg, e.docs.specs()...)
        to: docstore
      - opt:
          do:
            - opt:
                do:
                  - return: nil, errors.Join(lerr, ds.Close())
                when: err == nil
            - return: nil, lerr
          init:
            bind: lerr
            eval: e.docs.load.loaded()
            to: e.docs.load.loaded
          when: lerr != nil
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - set: e.ds
