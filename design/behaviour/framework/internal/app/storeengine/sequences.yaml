    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).before
        kind: self
      - id: e.ds.Get
        kind: value
      - id: e.head
        kind: internal
      - id: e.undoing.Store
        kind: value
      - id: e.undoing.Delete
        kind: value
      - id: e.ds.Put
        kind: value
      - id: e.tell
        kind: internal
      - id: said
        kind: internal
      - id: e.uncreate
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: key == "" || !e.local(ctx)
      - bind: prev, err
        eval: e.ds.Get(key)
        to: e.ds.Get
      - switch:
          cases:
            - case: err == nil
              do:
                - bind: head
                  eval: e.head(key)
                  to: e.head
                - return:
                    closure:
                      params: context.Context
                      results: error
                      steps:
                        - eval: e.undoing.Store(key, true)
                          to: e.undoing.Store
                        - defer: e.undoing.Delete(key)
                          to: e.undoing.Delete
                        - bind: err
                          eval: e.ds.Put(prev)
                          to: e.ds.Put
                        - eval: e.tell(key, false, err)
                          to: e.tell
                        - opt:
                            do:
                              - return: said(err)
                                to: said
                            when: err != nil && !errors.Is(err, docstore.WriteUnconfirmed)
                        - return: said(errors.Join(err, e.forget(key, head, prev)))
                          to: said
            - case: errors.Is(err, docstore.DocumentNotFound)
              do:
                - return: e.uncreate(key)
                  to: e.uncreate
      - return:
          closure:
            params: context.Context
            results: error
            steps:
              - return: said(err)
                to: said
  - of: (*fileEngine).uncreate
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).uncreate
        kind: self
      - id: e.unconfirmed
        kind: internal
      - id: e.ds.Delete
        kind: value
      - id: e.tell
        kind: internal
      - id: said
        kind: internal
    steps:
      - opt:
          do:
            - return:
                closure:
                  params: context.Context
                  results: error
                  steps:
                    - return: e.unconfirmed(e.ds.Trash(key), key, true)
                      to: e.unconfirmed
          when: e.trashedNow(key)
      - return:
          closure:
            params: context.Context
            results: error
            steps:
              - bind: err
                eval: e.ds.Delete(key)
                to: e.ds.Delete
              - opt:
                  do:
                    - return: nil
                  when: errors.Is(err, docstore.DocumentNotFound)
              - eval: e.tell(key, true, err)
                to: e.tell
              - return: said(err)
                to: said
  - of: (*fileEngine).after
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).after
        kind: self
      - id: tx.Undo
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: err != nil && !errors.Is(err, docstore.WriteUnconfirmed)
      - bind: tx
        eval: e.docs.cfg.Transaction
      - opt:
          do:
            - eval: tx.Undo(ctx, e.docs.cfg.Name, undo)
              to: tx.Undo
          when: undo != nil && tx != nil
      - bind: fn
        eval: e.onWrite
      - opt:
          do:
            - set: fn
              value: e.onDelete
          when: deleted
      - opt:
          do:
            - return: ""
          when: fn == nil
      - opt:
          do:
            - eval: fn(key)
          when: tx == nil || !tx.AtCommit(ctx, func() { fn(key) })
  - of: (*fileEngine).tell
    steps:
      - opt:
          do:
            - return: ""
          when: err != nil && !errors.Is(err, docstore.WriteUnconfirmed)
      - bind: fn
        eval: e.onWrite
      - opt:
          do:
            - set: fn
              value: e.onDelete
          when: deleted
      - opt:
          do:
            - eval: fn(key)
          when: fn != nil
  - of: (*fileEngine).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Close
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.Close())
        to: said
  - of: (*fileEngine).Fold
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Fold
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.Fold())
        to: said
  - of: (*fileEngine).Keys
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Keys
        kind: self
      - id: saidKeys
        kind: internal
    steps:
      - return: saidKeys(e.ds.Keys(after))
        to: saidKeys
  - of: (*fileEngine).StoredVersions
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).StoredVersions
        kind: self
      - id: e.ds.Versions
        kind: value
      - id: pluggedVersions
        kind: internal
    steps:
      - bind: vs, err
        eval: e.ds.Versions(key)
        to: e.ds.Versions
      - return: pluggedVersions(vs), said(err)
        to: pluggedVersions
  - of: (*fileEngine).RewriteVersions
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).RewriteVersions
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.RewriteVersions(key, rewritingSDK(fn)))
        to: said
  - of: (*fileEngine).head
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).head
        kind: self
      - id: e.ds.Versions
        kind: value
    steps:
      - opt:
          do:
            - return: "0"
          when: e.keep() == 0
      - bind: all, err
        eval: e.ds.Versions(key)
        to: e.ds.Versions
      - opt:
          do:
            - return: "0"
          when: err != nil || len(all) == 0
      - return: all[0].Number
  - of: (*fileEngine).forget
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).forget
        kind: self
      - id: json
        kind: stdlib
      - id: e.ds.RewriteVersions
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: e.keep() == 0 || head == 0
      - bind: held, merr
        eval: json.Marshal(prev)
        to: json
      - bind: err
        eval: |-
          e.ds.RewriteVersions(key, func(former []docstore.Version) ([]docstore.Version, error) {
          		former = slices.DeleteFunc(former, func(v docstore.Version) bool { return v.Number > head })
          		for i := range former {
          			if former[i].Number == head && merr == nil {
          				former[i].JSON = held
          			}
          		}
          		return former, nil
          	})
        to: e.ds.RewriteVersions
      - opt:
          do:
            - return: nil
          when: errors.Is(err, docstore.WriteUnconfirmed)
      - return: err
  - of: (*fileEngine).VersionWeight
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).VersionWeight
        kind: self
      - id: pluggedWeight
        kind: internal
    steps:
      - return: pluggedWeight(e.ds.VersionWeight())
        to: pluggedWeight
  - of: (*fileEngine).Trash
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Trash
        kind: self
      - id: e.unconfirmed
        kind: internal
      - id: e.ds.Trash
        kind: value
      - id: e.after
        kind: internal
      - id: said
        kind: internal
    steps:
      - var:
          name: undo
          type: func(context.Context) error
      - opt:
          do:
            - set: undo
              value:
                closure:
                  params: context.Context
                  results: error
                  steps:
                    - return: e.unconfirmed(e.ds.Restore(key), key, false)
                      to: e.unconfirmed
          when: key != "" && e.local(ctx)
      - bind: err
        eval: e.ds.Trash(key)
        to: e.ds.Trash
      - eval: e.after(ctx, err, key, true, undo)
        to: e.after
      - return: said(err)
        to: said
  - of: (*fileEngine).Untrash
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Untrash
        kind: self
      - id: e.unconfirmed
        kind: internal
      - id: e.ds.Restore
        kind: value
      - id: e.after
        kind: internal
      - id: said
        kind: internal
    steps:
      - var:
          name: undo
          type: func(context.Context) error
      - opt:
          do:
            - set: undo
              value:
                closure:
                  params: context.Context
                  results: error
                  steps:
                    - return: e.unconfirmed(e.ds.Trash(key), key, true)
                      to: e.unconfirmed
          when: key != "" && e.local(ctx)
      - bind: err
        eval: e.ds.Restore(key)
        to: e.ds.Restore
      - eval: e.after(ctx, err, key, false, undo)
        to: e.after
      - return: said(err)
        to: said
  - of: (*fileEngine).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Purge
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.Purge(key))
        to: said
  - of: (*fileEngine).Tombstones
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Tombstones
        kind: self
      - id: e.ds.Tombstones
        kind: value
      - id: pluggedTombstones
        kind: internal
    steps:
      - bind: stones, err
        eval: e.ds.Tombstones()
        to: e.ds.Tombstones
      - return: pluggedTombstones(stones), said(err)
        to: pluggedTombstones
  - of: (*fileEngine).unconfirmed
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).unconfirmed
        kind: self
      - id: e.tell
        kind: internal
      - id: said
        kind: internal
    steps:
      - eval: e.tell(key, deleted, err)
        to: e.tell
      - opt:
          do:
            - return: said(err)
              to: said
          when: err != nil && !errors.Is(err, docstore.WriteUnconfirmed)
      - return: nil
  - of: (*fileEngine).trashedNow
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).trashedNow
        kind: self
      - id: e.ds.Versions
        kind: value
    steps:
      - opt:
          do:
            - return: "false"
          when: e.keep() == 0
      - bind: _, err
        eval: e.ds.Versions(key)
        to: e.ds.Versions
      - return: err == nil
  - of: (*fileEngine).Documents
    steps:
      - return: e, true
  - of: (*fileEngine).KeyList
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).KeyList
        kind: self
      - id: e.Keys
        kind: internal
    steps:
      - return: e.Keys(ctx, "")
        to: e.Keys
  - of: (*fileEngine).TombstoneList
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).TombstoneList
        kind: self
      - id: e.Tombstones
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil
          when: e.keep() == 0
      - return: e.Tombstones(ctx)
        to: e.Tombstones
  - of: (*fileEngine).VersionList
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).VersionList
        kind: self
      - id: e.StoredVersions
        kind: internal
    steps:
      - return: e.StoredVersions(ctx, key)
        to: e.StoredVersions
  - of: (*fileEngine).Current
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).Current
        kind: self
      - id: e.ds.Get
        kind: value
    steps:
      - bind: r, err
        eval: e.ds.Get(key)
        to: e.ds.Get
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - return: r.raw, nil
  - of: (*fileEngine).KeepsVersions
    steps:
      - return: e.keep() > 0
  - of: (*fileEngine).PutDocument
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).PutDocument
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.PutDocument(key, sdkVersions(versions), trashedAt))
        to: said
  - of: (*fileEngine).InsertRaw
    participants:
      - id: caller
        kind: actor
      - id: (*fileEngine).InsertRaw
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(e.ds.Insert(rawRecord(raw)))
        to: said
  - of: saidKeys
    steps:
      - return:
          closure:
            params: yield func(string, error) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(key, said(err))"
                  key: key
                  range: keys
                  value: err
  - of: said
    participants:
      - id: caller
        kind: actor
      - id: said
        kind: self
      - id: errs
        kind: package
      - id: plug
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: err == nil
      - opt:
          do:
            - return: err
          init:
            bind: r, told
            eval: errors.AsType[*plug.RefusalError](err)
          when: told && r.Kind != plug.RefusalNone
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!errors.Is(err, s.sentinel)"
            - opt:
                do:
                  - set: err
                    to: errs
                    value: errs.Wrap(err, errs.WrapParams{}, errs.String("max", strconv.Itoa(docstore.MaxSQLKeyLen)))
                when: s.kind == plug.RefusalKeyTooLong
            - return: plug.Refuse(s.kind, err)
              to: plug
          key: _
          range: sentinels
          value: s
      - return: err
  - of: formerTables
    participants:
      - id: caller
        kind: actor
      - id: formerTables
        kind: self
      - id: renaming
        kind: internal
      - id: catalogue
        kind: internal
      - id: stillFormer
        kind: internal
    steps:
      - bind: scope, err
        eval: renaming(db)
        to: renaming
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: cat, err
        eval: catalogue(ctx, scope.cfg.DB, scope.dialect)
        to: catalogue
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: stillFormer(cat, plan), nil
        to: stillFormer
  - of: renameTables
    participants:
      - id: caller
        kind: actor
      - id: renameTables
        kind: self
      - id: renaming
        kind: internal
      - id: catalogue
        kind: internal
      - id: refuseTaken
        kind: internal
      - id: scope.runMove
        kind: internal
      - id: scope.cfg.DB.ExecContext
        kind: value
    steps:
      - bind: scope, err
        eval: renaming(db)
        to: renaming
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: cat, err
        eval: catalogue(ctx, scope.cfg.DB, scope.dialect)
        to: catalogue
      - opt:
          do:
            - return: nil, err
          when: err != nil || len(stillFormer(cat, plan)) == 0
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: refuseTaken(cat, pairs(cat, plan.Tables))
            to: refuseTaken
          when: err != nil
      - bind: moved, err
        eval: scope.runMove(ctx, plan)
        to: scope.runMove
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, failedAt(phaseDrop, err)
          init:
            bind: _, err
            eval: scope.cfg.DB.ExecContext(ctx, "DROP TABLE IF EXISTS "+scope.dialect.QuoteIdent(plan.FormerVersions))
            to: scope.cfg.DB.ExecContext
          when: err != nil
      - return: moved, nil
  - of: (*database).runMove
    participants:
      - id: caller
        kind: actor
      - id: (*database).runMove
        kind: self
      - id: sql
        kind: package
      - id: present.Plan
        kind: value
      - id: move
        kind: internal
      - id: m.Up
        kind: value
    steps:
      - bind: present, err
        eval: "sql.NewMigrator(d.cfg, sql.MigrateConfig{VersionTable: plan.Versions})"
        to: sql
      - opt:
          do:
            - set: _, err
              to: present.Plan
              value: present.Plan(ctx)
          when: err == nil
      - opt:
          do:
            - return: nil, said(err)
          when: err != nil
      - var:
          name: moved
          type: "[]string"
      - bind: step
        eval:
          closure:
            params: ctx context.Context, ex sql.Executor
            results: error
            steps:
              - var:
                  name: err
                  type: error
              - set: moved, err
                to: move
                value: move(ctx, ex, d.dialect, plan)
              - return: err
      - bind: m, err
        eval: |-
          sql.NewMigrator(d.cfg, sql.MigrateConfig{
          		VersionTable: plan.FormerVersions,
          		Migrations:   []sql.Migration{{Version: plan.Version, Name: plan.Name, Up: step, Down: sql.Irreversible}},
          	})
        to: sql
      - opt:
          do:
            - set: err
              to: m.Up
              value: m.Up(ctx)
          when: err == nil
      - return: moved, said(err)
  - of: renaming
    steps:
      - bind: scope, ok
        eval: db.(*database)
      - opt:
          do:
            - return: |-
                nil, plug.Refuse(plug.RefusalLoad, errs.Wrap(docstore.LoadFailed, errs.WrapParams{},
                			errs.String("problem", "the database was not opened by the store subsystem")))
          when: "!ok"
      - return: scope, nil
  - of: catalogue
    participants:
      - id: caller
        kind: actor
      - id: catalogue
        kind: self
      - id: names
        kind: internal
    steps:
      - return: names(ctx, q, catalogueQueries[dialect], phaseCatalogue)
        to: names
  - of: names
    participants:
      - id: caller
        kind: actor
      - id: names
        kind: self
      - id: q.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: rows.Err
        kind: value
    steps:
      - bind: rows, err
        eval: q.QueryContext(ctx, query, args...)
        to: q.QueryContext
      - opt:
          do:
            - return: nil, failedAt(phase, err)
          when: err != nil
      - defer: |-
          func() {
          		if cerr := rows.Close(); cerr != nil && err == nil {
          			err = failedAt(phase, cerr)
          		}
          	}()
      - bind: out
        eval: map[string]bool{}
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: name
                type: string
            - opt:
                do:
                  - return: nil, failedAt(phase, err)
                init:
                  bind: err
                  eval: rows.Scan(&name)
                  to: rows.Scan
                when: err != nil
            - set: out[name]
              value: "true"
      - opt:
          do:
            - return: nil, failedAt(phase, err)
          init:
            bind: err
            eval: rows.Err()
            to: rows.Err
          when: err != nil
      - return: out, nil
  - of: failedAt
    participants:
      - id: caller
        kind: actor
      - id: failedAt
        kind: self
      - id: plug
        kind: package
    steps:
      - return: |-
          plug.Refuse(plug.RefusalStatement, errors.Join(
          		errs.Wrap(docstore.StatementFailed, errs.WrapParams{}, errs.String("phase", phase)), cause))
        to: plug
  - of: stillFormer
    participants:
      - id: caller
        kind: actor
      - id: stillFormer
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: out
          type: "[]string"
      - opt:
          do:
            - set: out
              value: append(out, plan.FormerVersions)
          when: cat[plan.FormerVersions]
      - loop:
          do:
            - set: out
              value: append(out, p.From)
          key: _
          range: pairs(cat, plan.Tables)
          value: p
      - eval: slices.Sort(out)
        to: slices
      - return: slices.Compact(out)
        to: slices
  - of: pairs
    participants:
      - id: caller
        kind: actor
      - id: pairs
        kind: self
      - id: strings
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: out
          type: "[]plug.RenameValue"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: t.From == "" || t.From == t.To
            - opt:
                do:
                  - set: out
                    value: append(out, t)
                when: cat[t.From]
            - loop:
                do:
                  - opt:
                      do:
                        - set: out
                          value: "append(out, plug.RenameValue{From: name, To: t.To + derivedMark + derived})"
                      init:
                        bind: derived, ok
                        eval: strings.CutPrefix(name, t.From+derivedMark)
                        to: strings
                      when: ok
                key: name
                range: cat
          key: _
          range: tables
          value: t
      - eval: slices.SortFunc(out, func(x, y plug.RenameValue) int { return strings.Compare(x.From, y.From) })
        to: slices
      - return: slices.CompactFunc(out, func(x, y plug.RenameValue) bool { return x.From == y.From })
        to: slices
  - of: move
    participants:
      - id: caller
        kind: actor
      - id: move
        kind: self
      - id: catalogue
        kind: internal
      - id: pairs
        kind: internal
      - id: refuseTaken
        kind: internal
      - id: copyHistory
        kind: internal
      - id: renameAll
        kind: internal
      - id: renameIndexes
        kind: internal
      - id: relabel
        kind: internal
    steps:
      - bind: cat, err
        eval: catalogue(ctx, ex, dialect)
        to: catalogue
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: renames
        eval: pairs(cat, plan.Tables)
        to: pairs
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: refuseTaken(cat, renames)
            to: refuseTaken
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: copyHistory(ctx, ex, dialect, plan, cat[plan.FormerVersions])
            to: copyHistory
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: renameAll(ctx, ex, dialect, renames)
            to: renameAll
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: renameIndexes(ctx, ex, dialect, renames)
            to: renameIndexes
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: relabel(ctx, ex, dialect, plan)
            to: relabel
          when: err != nil
      - bind: out
        eval: make([]string, 0, len(renames))
      - loop:
          do:
            - set: out
              value: append(out, p.From)
          key: _
          range: renames
          value: p
      - return: out, nil
  - of: refuseTaken
    participants:
      - id: caller
        kind: actor
      - id: refuseTaken
        kind: self
      - id: plug
        kind: package
    steps:
      - var:
          name: taken
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: taken
                    value: append(taken, p.From+" -> "+p.To)
                when: cat[p.To]
          key: _
          range: renames
          value: p
      - opt:
          do:
            - return: nil
          when: len(taken) == 0
      - return: |-
          plug.Refuse(plug.RefusalRenameTarget, errs.Wrap(docstore.StatementFailed, errs.WrapParams{},
          		errs.String("tables", strings.Join(taken, ", "))))
        to: plug
  - of: relabel
    participants:
      - id: caller
        kind: actor
      - id: relabel
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: failedAt
        kind: internal
    steps:
      - loop:
          do:
            - bind: _, err
              eval: |-
                ex.ExecContext(ctx, "UPDATE "+dialect.QuoteIdent(plan.Versions)+" SET name = "+dialect.Placeholder(1)+
                			" WHERE name = "+dialect.Placeholder(2), l.To, l.From)
              to: ex.ExecContext
            - opt:
                do:
                  - return: failedAt(phaseLabels, err)
                    to: failedAt
                when: err != nil
          key: _
          range: plan.Labels
          value: l
      - return: nil
  - of: copyHistory
    participants:
      - id: caller
        kind: actor
      - id: copyHistory
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: failedAt
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: "!found"
      - bind: former, present
        eval: dialect.QuoteIdent(plan.FormerVersions), dialect.QuoteIdent(plan.Versions)
      - bind: _, err
        eval: |-
          ex.ExecContext(ctx, "INSERT INTO "+present+" (version, name, applied_at_unix)"+
          		" SELECT f.version, f.name, f.applied_at_unix FROM "+former+" f WHERE f.version <> "+dialect.Placeholder(1)+
          		" AND NOT EXISTS (SELECT 1 FROM "+present+" p WHERE p.version = f.version)", int64(plan.Version))
        to: ex.ExecContext
      - opt:
          do:
            - return: failedAt(phaseHistory, err)
              to: failedAt
          when: err != nil
      - return: nil
  - of: renameAll
    participants:
      - id: caller
        kind: actor
      - id: renameAll
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: failedAt
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: len(renames) == 0
      - var:
          name: stmts
          type: "[]string"
      - alt:
          - do:
              - bind: parts
                eval: make([]string, 0, len(renames))
              - loop:
                  do:
                    - set: parts
                      value: append(parts, dialect.QuoteIdent(p.From)+" TO "+dialect.QuoteIdent(p.To))
                  key: _
                  range: renames
                  value: p
              - set: stmts
                value: "[]string{\"RENAME TABLE \" + strings.Join(parts, \", \")}"
            when: dialect == sql.DialectMySQL
          - do:
              - loop:
                  do:
                    - set: stmts
                      value: append(stmts, "ALTER TABLE "+dialect.QuoteIdent(p.From)+" RENAME TO "+dialect.QuoteIdent(p.To))
                  key: _
                  range: renames
                  value: p
            else: true
      - loop:
          do:
            - opt:
                do:
                  - return: failedAt(phaseRename, err)
                    to: failedAt
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, s)
                  to: ex.ExecContext
                when: err != nil
          key: _
          range: stmts
          value: s
      - return: nil
  - of: renameIndexes
    participants:
      - id: caller
        kind: actor
      - id: renameIndexes
        kind: self
      - id: names
        kind: internal
      - id: indexAfter
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: failedAt
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: dialect != sql.DialectPostgres
      - bind: quote
        eval: dialect.QuoteIdent
      - loop:
          do:
            - bind: indexes, err
              eval: names(ctx, ex, "SELECT indexname FROM pg_catalog.pg_indexes WHERE schemaname = current_schema() AND tablename = $1", phaseIndexes, p.To)
              to: names
            - opt:
                do:
                  - return: err
                when: err != nil
            - loop:
                do:
                  - bind: to, ok
                    eval: indexAfter(idx, p)
                    to: indexAfter
                  - opt:
                      do:
                        - continue: true
                      when: "!ok"
                  - opt:
                      do:
                        - return: failedAt(phaseIndexes, err)
                          to: failedAt
                      init:
                        bind: _, err
                        eval: ex.ExecContext(ctx, "ALTER INDEX "+quote(idx)+" RENAME TO "+quote(to))
                        to: ex.ExecContext
                      when: err != nil
                key: _
                range: slices.Sorted(maps.Keys(indexes))
                value: idx
          key: _
          range: renames
          value: p
      - return: nil
  - of: indexAfter
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: len(p.From) != len(p.To)
      - bind: "n"
        eval: min(len(idx), len(p.From))
      - opt:
          do:
            - return: "\"\", false"
          when: n == 0 || idx[:n] != p.From[:n]
      - return: p.To[:n] + idx[n:], true
