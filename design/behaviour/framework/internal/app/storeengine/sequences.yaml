        kind: internal
      - id: e.ds.InsertStamped
        kind: value
      - id: e.ds.ReplaceStamped
        kind: value
      - id: e.ds.PutStamped
        kind: value
      - id: e.retold
        kind: internal
      - id: said
        kind: internal
    steps:
      - bind: stamp
        eval: e.docs.stamp(ctx)
        to: e.docs.stamp
      - bind: c, done, err
        eval: e.call(ctx, true)
        to: e.call
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: done()
      - bind: r
        eval: recordFor(d)
        to: recordFor
      - switch:
          cases:
            - case: plug.WriteInsert
              do:
                - set: err
                  to: e.ds.InsertStamped
                  value: e.ds.InsertStamped(c, r, stamp)
            - case: plug.WriteReplace
              do:
                - set: err
                  to: e.ds.ReplaceStamped
                  value: e.ds.ReplaceStamped(c, r, stamp)
            - default: true
              do:
                - set: err
                  to: e.ds.PutStamped
                  value: e.ds.PutStamped(c, r, stamp)
          "on": mode
      - opt:
          do:
            - eval: e.retold(ctx, e.docs.writtenKey(r))
              to: e.retold
          when: err == nil
      - return: said(err)
        to: said
