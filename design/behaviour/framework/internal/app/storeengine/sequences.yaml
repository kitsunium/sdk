      - id: e.docs.load.loaded
        kind: internal
    steps:
      - bind: e
        eval: "&fileEngine{docs: &documents{cfg: cfg}}"
      - bind: dcfg
        eval: "docstore.Config[docRecord]{Key: e.docs.keyOf, Path: cfg.Path}"
      - opt:
