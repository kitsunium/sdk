        to: said
  - of: migrator.Down
    participants:
      - id: caller
        kind: actor
      - id: migrator.Down
        kind: self
      - id: said
        kind: internal
    steps:
      - return: said(m.m.Down(ctx, version))
        to: said
  - of: sqlMigrations
    steps:
      - bind: out
        eval: make([]sql.Migration, len(ms))
      - loop:
          do:
            - set: out[i]
              value: "sql.Migration{Version: m.Version, Name: m.Name, Up: sqlStep(m.Up), Down: sqlStep(m.Down)}"
          key: i
          range: ms
          value: m
      - return: out
  - of: sqlStep
    steps:
      - opt:
          do:
            - return: nil
          when: s == nil
      - return:
          closure:
            params: ctx context.Context, ex sql.Executor
            results: error
            steps:
              - return: s(ctx, ex)
