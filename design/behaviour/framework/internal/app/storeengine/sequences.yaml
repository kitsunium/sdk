            - case: plug.WriteReplace
              do:
                - set: err
                  to: e.ds.ReplaceStamped
                  value: e.ds.ReplaceStamped(r, stamp)
            - case: plug.WriteUpsert
              do:
                - set: err
                  to: e.ds.PutStamped
                  value: e.ds.PutStamped(r, stamp)
            - default: true
              do:
                - set: err
                  to: e.ds.PutStamped
                  value: e.ds.PutStamped(r, stamp)
          "on": mode
      - eval: e.after(ctx, err, key, false, undo)
        to: e.after
      - return: said(err)
        to: said
