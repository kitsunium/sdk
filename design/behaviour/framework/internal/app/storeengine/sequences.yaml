    steps:
      - bind: d, err
        eval: dialectOf(dialect)
        to: dialectOf
      - opt:
          do:
            - return: plug.MigrationValue{}, err
          when: err != nil
      - var:
          name: m
          type: sql.Migration
      - switch:
          cases:
            - case: t.VersionsOf != ""
