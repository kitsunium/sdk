# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      derivedMark separates a document store's table from the tables the SDK
      derives from it — <table>___ix, <table>___vs —: three underscores no
      table name the framework gives holds.
    items:
      - name: derivedMark
        value: "\"___\""
    name: derivedMark
  - doc: The phases a refusal of the move names.
    grouped: true
    items:
      - name: phaseCatalogue
        value: "\"catalogue\""
      - name: phaseHistory
        value: "\"history\""
      - name: phaseRename
        value: "\"rename\""
      - name: phaseIndexes
        value: "\"indexes\""
      - name: phaseLabels
        value: "\"labels\""
      - name: phaseDrop
        value: "\"drop\""
    name: phaseCatalogue
  - doc: |-
      sqlKeysChunk is how many keys one call of a database's engine lists, each
      under its own <name>-timeout: a long listing is many short calls, never one
      call the timeout ends halfway.
    items:
      - name: sqlKeysChunk
        type: int
        value: "256"
    name: sqlKeysChunk
