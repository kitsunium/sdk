apiVersion: design/behaviour/v1
constants:
  - doc: |-
      capturedMails is how many deliveries the capture transport keeps: one,
      which the mailer reads at once — the mailbox keeps what the Studio shows.
    items:
      - name: capturedMails
        type: int
        value: "1"
    name: capturedMails
