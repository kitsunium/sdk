functions:
  - doc: |-
      clockOf is c as the SDK's spool takes it, nil — the spool's own, the
      system's — for none.
    name: clockOf
    params: c plug.Clock
    results: clock.Timed
  - name: Enable
  - doc: |-
      validate is the SDK's verdict on msg, a mail.Message: what the spool
      would refuse it for.
    name: validate
    params: msg plug.MailValue
    results: error
  - doc: |-
      capture is the SDK's capture transport, keeping the last message it
      composed.

      IFACE-PLUGIN: kit reaches a transport through plug.MailSink; this is
      its implementation.
    name: capture
    results: plug.MailSink
  - doc: |-
      parseSMTP reads url with the SDK's mail.ParseURL, which refuses what its
      SMTP transport would: the relay it names, its configuration — which holds
      the password — handed on to newSMTP and never kept.
    name: parseSMTP
    params: url string
    results: plug.MailRelayValue, error
  - doc: |-
      newSMTP is the SDK's SMTP transport to relay, as parseSMTP read it. It
      dials nothing.

      IFACE-PLUGIN: kit reaches a transport through plug.MailSink; this is
      its implementation.
    name: newSMTP
    params: relay *plug.MailRelayValue
    results: plug.MailSink, error
  - doc: "tlsName is the TLS mode as the URL spells it: starttls, implicit or none."
    name: tlsName
    params: mode mail.TLSMode
    results: string
  - doc: |-
      refused reports whether err, or an error it wraps, is the SDK's sentinel
      of kind.
    name: refused
    params: err error, kind plug.MailRefusal
    results: bool
  - doc: |-
      messageOf is the SDK's mail v holds; the zero mail for any other value,
      which the SDK refuses.
    name: messageOf
    params: v plug.MailValue
    results: mail.Message
  - doc: addressOf is the SDK's sender v holds; none for any other value.
    name: addressOf
    params: v plug.MailValue
    results: mail.Address
  - doc: |-
      open opens the SDK's spool over cfg. An outbox on a database takes the
      SDK's broker the queue subsystem opened there (queueengine.BrokerOf) and the
      database's transaction manager the store subsystem opened, a Deferrer
      that is an Aborter too (storeengine.SQLOf); without one, the spool tells the
      mailbox a mail was queued when Send returns.

      IFACE-PLUGIN: kit reaches a mailer's outbox through plug.MailSpool; this
      is its implementation.
    name: open
    params: cfg *plug.MailSpoolConfig
    results: plug.MailSpool, error
  - doc: |-
      backoffOf is the SDK's exponential backoff at cfg's bounds: the wait
      after a failed attempt, from BackoffBase, doubling, up to BackoffMax.
    name: backoffOf
    params: cfg *plug.MailSpoolConfig
    results: resilience.Backoff
  - doc: |-
      deferrerOf is the transaction manager of db, a database the store
      subsystem opened, as the spool defers on it: a Deferrer that is an Aborter
      too, as the SDK's is; nil otherwise.
    name: deferrerOf
    params: db plug.Database
    results: sql.Deferrer
  - doc: observeOf is fn as the spool tells it each event, nil for none.
    name: observeOf
    params: fn func(e *plug.MailEventValue)
    results: func(mailspool.Event)
  - doc: |-
      givenUpOf is why the spool gave up a mail that failed with err: the code
      the spool adds to a dead letter's trail when it gives it up early — a
      permanent refusal, a mail too old —, else its last attempt. errs.HasCode
      reads the trail, where errors.Is would see only the origin.
    name: givenUpOf
    params: err error
    results: plug.MailGiveUp
  - doc: |-
      replyOf is the SMTP reply err carries, which the SDK's SMTP transport
      keeps reachable through errors.As; nil for none.
    name: replyOf
    params: err error
    results: "*textproto.Error"
  - doc: eventOf is the spool's event kind k as kit's core reads it.
    name: eventOf
    params: k mailspool.EventKind
    results: plug.MailEvent
  - doc: attemptFrom is the attempt the spool put in ctx.
    name: attemptFrom
    params: ctx context.Context
    results: plug.MailAttemptValue, bool
  - doc: |-
      deadGivenUp is why the spool gave up the mail of the dead letter d, read
      as givenUpOf reads a live failure: the code the spool adds when it gives a
      mail up early, which the queue kept in the dead letter's trail — or as its
      code, when the transport's failure was no SDK error and the mark became
      the origin —, else its last attempt (issue #500).
    name: deadGivenUp
    params: d *mailspool.DeadLetter
    results: plug.MailGiveUp
