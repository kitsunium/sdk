package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/framework/internal/app/mailengine
  name: mailengine
  purpose: "Package mailengine is what framework/app/mail plugs into kit: the outbox the framework's mailers keep — the SDK's mail spool, on the database that keeps the mailer's service in the queue subsystem's sealed broker, else in the data directory or in memory — and the transports that empty it, the SDK's SMTP transport and its capture transport (ADR 0179 §1, step 6)."
types:
  - doc: |-
      sdkClock is the app's clock, as kit's core hands it (plug.Clock), as the
      SDK's engine stamps and waits on it: the same instants and the same
      timers, a test's manual clock included.
    fields:
      - name: ""
        role: embedded
        type: plug.Clock
    kind: struct
    methods:
      - doc: NewTimer is the clock's timer, as the SDK's.
        name: NewTimer
        params: d time.Duration
        recv: c sdkClock
        results: clock.Timer
      - doc: NewTicker is the clock's ticker, as the SDK's.
        name: NewTicker
        params: d time.Duration
        recv: c sdkClock
        results: clock.Ticker
    name: sdkClock
  - doc: spool is the SDK's mail spool as kit's core uses it.
    fields:
      - name: s
        type: "*mailspool.Spool"
    kind: struct
    methods:
      - doc: Send puts msg, a mail.Message, in the outbox.
        name: Send
        params: ctx context.Context, msg plug.MailValue
        recv: s spool
        results: string, error
      - doc: SendWithID puts msg, a mail.Message, in the outbox under id.
        name: SendWithID
        params: ctx context.Context, id string, msg plug.MailValue
        recv: s spool
        results: error
      - doc: |-
          DeadLetters returns up to maxLetters of the outbox's dead letters, oldest
          first, each with why it was given up.
        name: DeadLetters
        params: ctx context.Context, maxLetters int
        recv: s spool
        results: "[]plug.MailDeadLetterValue, error"
      - doc: Run hands each mail to the transport until ctx ends.
        name: Run
        params: ctx context.Context
        recv: s spool
        results: error
      - doc: Close releases the outbox.
        name: Close
        recv: s spool
        results: error
    name: spool
  - doc: transport is the SDK's SMTP transport as kit's core uses it.
    fields:
      - name: t
        type: mail.Transport
    kind: struct
    methods:
      - doc: Send delivers msg, a mail.Message.
        name: Send
        params: ctx context.Context, msg plug.MailValue
        recv: t transport
        results: error
    name: transport
  - doc: |-
      captured is the SDK's capture transport as kit's core uses it: it
      delivers nothing and keeps the last message it composed.
    fields:
      - name: t
        type: mail.FullTransport
    kind: struct
    methods:
      - doc: Send composes msg, a mail.Message, and keeps it.
        name: Send
        params: ctx context.Context, msg plug.MailValue
        recv: c *captured
        results: error
      - doc: Composed is the last message the transport composed, nil for none.
        name: Composed
        recv: c *captured
        results: "[]byte"
    name: captured
  - doc: |-
      attempts is the transport the spool hands each attempt to: kit's core's
      attempt, told the attempt the spool's context carries.
    fields:
      - name: run
        type: func(ctx context.Context, msg plug.MailValue, attempt plug.MailAttemptValue) error
    kind: struct
    methods:
      - doc: Send runs kit's attempt of msg, with the attempt the spool put in ctx.
        name: Send
        params: ctx context.Context, msg mail.Message
        recv: a attempts
        results: error
    name: attempts
vars:
  - doc: sentinels are the SDK's sentinels of each refusal kit tells apart.
    items:
      - name: sentinels
        value: |-
          map[plug.MailRefusal]error{
          	plug.MailRefusalClosed:      mailspool.Closed,
          	plug.MailRefusalUnencodable: mailspool.MessageUnencodable,
          	plug.MailRefusalInvalidURL:  mail.InvalidURL,
          }
    name: sentinels
  - doc: |-
      : Asserts at compile time that a mailer's outbox and its transports are
      what plug describes, that the transport the spool hands each attempt to is
      the SDK's, and that the app's clock is the SDK's.
    grouped: true
    items:
      - name: _
        type: plug.MailSpool
        value: spool{}
      - name: _
        type: plug.MailSink
        value: transport{}
      - name: _
        type: plug.MailSink
        value: (*captured)(nil)
      - name: _
        type: plug.MailCaptureSource
        value: (*captured)(nil)
      - name: _
        type: mail.Transport
        value: attempts{}
      - name: _
        type: clock.Timed
        value: sdkClock{}
    name: _
  - doc: events are the spool's events kit's core tells apart.
    items:
      - name: events
        value: |-
          map[mailspool.EventKind]plug.MailEvent{
          	mailspool.EventQueued:       plug.MailEventQueued,
          	mailspool.EventSent:         plug.MailEventSent,
          	mailspool.EventRetrying:     plug.MailEventRetrying,
          	mailspool.EventDeadLettered: plug.MailEventDeadLettered,
          	mailspool.EventDuplicate:    plug.MailEventDuplicate,
          }
    name: events
