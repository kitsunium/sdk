apiVersion: design/behaviour/v1
constants:
  - doc: |-
      CodeNoVendorKey identifies an install attempted by a build carrying no vendor
      key. Match it with errs.HasCode: it is the one refusal a retry never fixes.
    items:
      - name: CodeNoVendorKey
        type: errs.Code
        value: coreupd.CodeNoVendorKey
    name: CodeNoVendorKey
  - doc: CodeSignatureMissing identifies a release whose manifest signature was absent.
    items:
      - name: CodeSignatureMissing
        type: errs.Code
        value: coreupd.CodeSignatureMissing
    name: CodeSignatureMissing
  - doc: |-
      CodeSignatureInvalid identifies a manifest signature that did not verify. With
      CodeSignatureMissing it is the supply-chain pair: no retry helps, and no manual
      install is safe.
    items:
      - name: CodeSignatureInvalid
        type: errs.Code
        value: coreupd.CodeSignatureInvalid
    name: CodeSignatureInvalid
  - doc: |-
      CodeChecksumMissing identifies an archive with no entry in the authenticated
      manifest.
    items:
      - name: CodeChecksumMissing
        type: errs.Code
        value: coreupd.CodeChecksumMissing
    name: CodeChecksumMissing
  - doc: |-
      CodeChecksumMismatch identifies an archive whose digest did not match its
      authenticated manifest entry.
    items:
      - name: CodeChecksumMismatch
        type: errs.Code
        value: coreupd.CodeChecksumMismatch
    name: CodeChecksumMismatch
  - doc: CodeArchiveTooLarge identifies a release archive over the in-memory cap.
    items:
      - name: CodeArchiveTooLarge
        type: errs.Code
        value: coreupd.CodeArchiveTooLarge
    name: CodeArchiveTooLarge
  - doc: CodeAPIBodyTooLarge identifies release metadata over its read cap.
    items:
      - name: CodeAPIBodyTooLarge
        type: errs.Code
        value: coreupd.CodeAPIBodyTooLarge
    name: CodeAPIBodyTooLarge
  - doc: CodeInsecureRedirect identifies a redirect leaving HTTPS or over the hop bound.
    items:
      - name: CodeInsecureRedirect
        type: errs.Code
        value: coreupd.CodeInsecureRedirect
    name: CodeInsecureRedirect
  - doc: CodeUnexpectedStatus identifies an unusable status from the release host.
    items:
      - name: CodeUnexpectedStatus
        type: errs.Code
        value: coreupd.CodeUnexpectedStatus
    name: CodeUnexpectedStatus
  - doc: |-
      CodeDownloadFailed identifies a download that did not complete. It is the
      transient one: a retry is reasonable.
    items:
      - name: CodeDownloadFailed
        type: errs.Code
        value: coreupd.CodeDownloadFailed
    name: CodeDownloadFailed
  - doc: CodeDevBuild identifies a check on a build with no release version.
    items:
      - name: CodeDevBuild
        type: errs.Code
        value: coreupd.CodeDevBuild
    name: CodeDevBuild
  - doc: CodeCandidateNotFound identifies a requested candidate that does not exist.
    items:
      - name: CodeCandidateNotFound
        type: errs.Code
        value: coreupd.CodeCandidateNotFound
    name: CodeCandidateNotFound
  - doc: CodeNotPrerelease identifies a tag requested as a candidate that is stable.
    items:
      - name: CodeNotPrerelease
        type: errs.Code
        value: coreupd.CodeNotPrerelease
    name: CodeNotPrerelease
  - doc: CodeDraftRelease identifies a draft release, which exposes no asset.
    items:
      - name: CodeDraftRelease
        type: errs.Code
        value: coreupd.CodeDraftRelease
    name: CodeDraftRelease
  - doc: CodeInvalidTag identifies a tag that is not a valid semantic version.
    items:
      - name: CodeInvalidTag
        type: errs.Code
        value: coreupd.CodeInvalidTag
    name: CodeInvalidTag
  - doc: CodeBinaryNotInArchive identifies a verified archive missing the binary.
    items:
      - name: CodeBinaryNotInArchive
        type: errs.Code
        value: coreupd.CodeBinaryNotInArchive
    name: CodeBinaryNotInArchive
  - doc: CodeUnknownArchive identifies an asset in an unhandled container format.
    items:
      - name: CodeUnknownArchive
        type: errs.Code
        value: coreupd.CodeUnknownArchive
    name: CodeUnknownArchive
  - doc: |-
      CodeElevationNotAuthorised identifies a replacement needing privilege the
      operator did not opt into. Recoverable, but only through the opt-in.
    items:
      - name: CodeElevationNotAuthorised
        type: errs.Code
        value: coreupd.CodeElevationNotAuthorised
    name: CodeElevationNotAuthorised
  - doc: |-
      CodeCandidateTagRequired identifies a candidate install asked for without
      naming which candidate. It wraps errors.ErrUnsupported, so a caller matching
      that instead still matches.
    items:
      - name: CodeCandidateTagRequired
        type: errs.Code
        value: svcupd.CodeCandidateTagRequired
    name: CodeCandidateTagRequired
  - doc: |-
      CodeReleaseMetadataUnreadable identifies a release-API answer that arrived
      whole and did not decode. The bytes came, so no transport retry applies.
    items:
      - name: CodeReleaseMetadataUnreadable
        type: errs.Code
        value: svcupd.CodeReleaseMetadataUnreadable
    name: CodeReleaseMetadataUnreadable
  - doc: |-
      CodeArchiveUnreadable identifies a release archive that would not unpack. It
      is raised only AFTER the signature and digest have both verified, so it is a
      packaging or transfer fault and never a supply-chain signal.
    items:
      - name: CodeArchiveUnreadable
        type: errs.Code
        value: svcupd.CodeArchiveUnreadable
    name: CodeArchiveUnreadable
  - doc: |-
      CodeExecutablePathUnresolved identifies an update that cannot name the file
      it would replace. Nothing is attempted after it.
    items:
      - name: CodeExecutablePathUnresolved
        type: errs.Code
        value: svcupd.CodeExecutablePathUnresolved
    name: CodeExecutablePathUnresolved
  - doc: |-
      CodeStagingFailed identifies a replacement that failed BEFORE the rename, so
      the running binary is byte-for-byte as it was. That is the whole difference
      between this and CodeReplacementFailed, and it is the fact an operator needs.
    items:
      - name: CodeStagingFailed
        type: errs.Code
        value: svcupd.CodeStagingFailed
    name: CodeStagingFailed
  - doc: |-
      CodeReplacementFailed identifies a rename over the running executable that did
      not land.
    items:
      - name: CodeReplacementFailed
        type: errs.Code
        value: svcupd.CodeReplacementFailed
    name: CodeReplacementFailed
  - doc: |-
      CodeElevationFailed identifies an escalation the operator DID authorise and
      that the system refused anyway. Unlike CodeElevationNotAuthorised, no
      environment variable repairs it.
    items:
      - name: CodeElevationFailed
        type: errs.Code
        value: svcupd.CodeElevationFailed
    name: CodeElevationFailed
  - doc: |-
      CodeProbeFailed identifies a replacement whose new binary did not answer the
      probe the product declared with Service.WithProbe; the previous binary is put
      back from <binary>.prev when it was kept (ADR 0150).
    items:
      - name: CodeProbeFailed
        type: errs.Code
        value: svcupd.CodeProbeFailed
    name: CodeProbeFailed
  - doc: |-
      CandidateListSentinel is the tag value meaning "list the candidates rather
      than install one".

      It exists because a CLI flag taking an optional value has to spell "the flag
      was given without a value" AS a value. A caller wires it into its own flag
      definition, so the sentinel has to be reachable from outside the package that
      consumes it.
    items:
      - name: CandidateListSentinel
        type: string
        value: svcupd.CandidateListSentinel
    name: CandidateListSentinel
