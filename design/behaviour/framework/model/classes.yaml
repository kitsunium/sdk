        name: ContainerProcess
        type: string
        value: core.ContainerProcess
      - comment: "a frontend: served by the process, run by a browser"
        name: ContainerSPA
        type: string
        value: core.ContainerSPA
      - comment: "the data directory: store files, queue files"
        name: ContainerVolume
        type: string
        value: core.ContainerVolume
      - comment: data kept in the process's memory only
        name: ContainerMemory
        type: string
        value: core.ContainerMemory
      - doc: |-
          ContainerDatabase is a database the app declares (app.Database):
          "container:database:<name>", drawn as a cylinder.
        name: ContainerDatabase
        type: string
        value: core.ContainerDatabase
    name: ContainerProcess
  - grouped: true
    items:
      - doc: |-
          PortOwnerApp is the framework's own listener: the health probes, the Studio in
          dev, and the product's HTTP when it declares any.
        name: PortOwnerApp
        type: string
        value: core.PortOwnerApp
    name: PortOwnerApp
  - doc: What a port serves.
    grouped: true
    items:
      - comment: the liveness and readiness probes
        name: ServesHealth
        type: string
        value: core.ServesHealth
      - comment: the Studio and its API, in dev
        name: ServesStudio
        type: string
        value: core.ServesStudio
      - comment: the product's own HTTP entry points
        name: ServesHTTP
        type: string
        value: core.ServesHTTP
    name: ServesHealth
  - doc: The kinds of [CodeBlock].
    grouped: true
    items:
      - comment: an if's first branch
        name: BlockIf
        type: string
        value: core.BlockIf
      - comment: an if's else-if branch
        name: BlockElseIf
        type: string
        value: core.BlockElseIf
      - comment: an if's last branch
        name: BlockElse
        type: string
        value: core.BlockElse
      - comment: a switch's or a select's case
        name: BlockCase
        type: string
        value: core.BlockCase
      - comment: a for or range loop's body
        name: BlockLoop
        type: string
        value: core.BlockLoop
      - comment: "a go statement: runs beside the caller"
        name: BlockGo
        type: string
        value: core.BlockGo
      - comment: "a defer statement: runs when the function returns"
        name: BlockDefer
        type: string
        value: core.BlockDefer
      - comment: "a function literal: runs when it is called"
        name: BlockFunc
        type: string
        value: core.BlockFunc
      - doc: |-
          BlockTransaction is the function an app.Transact runs: its steps run in
          one transaction, and the effects they make leave at its commit.
        name: BlockTransaction
        type: string
        value: core.BlockTransaction
    name: BlockIf
  - doc: The kinds of connectors.
    grouped: true
    items:
      - doc: "ConnectorTransport is how the product is reached: HTTP."
        name: ConnectorTransport
        type: ConnectorKind
        value: core.ConnectorTransport
      - doc: "ConnectorMessaging is what it sends and receives: mail, queues."
        name: ConnectorMessaging
        type: ConnectorKind
        value: core.ConnectorMessaging
      - doc: "ConnectorData is where it keeps its data: stores, databases."
        name: ConnectorData
        type: ConnectorKind
        value: core.ConnectorData
    name: ConnectorTransport
  - doc: The roles of a connector, against the process boundary.
    grouped: true
    items:
      - name: RoleInbound
        type: string
        value: core.RoleInbound
      - name: RoleOutbound
        type: string
        value: core.RoleOutbound
      - name: RoleStorage
        type: string
        value: core.RoleStorage
    name: RoleInbound
  - doc: The connectors kit ships.
    grouped: true
    items:
      - name: ConnectorHTTP
        type: string
        value: core.ConnectorHTTP
      - name: ConnectorMail
        type: string
        value: core.ConnectorMail
      - name: ConnectorStore
        type: string
        value: core.ConnectorStore
      - name: ConnectorQueue
        type: string
        value: core.ConnectorQueue
      - doc: |-
          ConnectorDatabase is brought by a store a database keeps (ADR 0004):
          app.Database declares the database, an engine module reaches it.
        name: ConnectorDatabase
        type: string
        value: core.ConnectorDatabase
    name: ConnectorHTTP
  - doc: |-
      The engines a database runs on (ADR 0004): one module each in kit's
      repository, the only code that imports its driver.
    grouped: true
    items:
      - name: EnginePostgres
        type: string
        value: core.EnginePostgres
      - name: EngineMySQL
        type: string
        value: core.EngineMySQL
      - name: EngineSQLite
        type: string
        value: core.EngineSQLite
    name: EnginePostgres
  - doc: Mail statuses.
    grouped: true
    items:
      - comment: in the outbox, not yet handed to the transport
        name: MailQueued
        type: string
        value: core.MailQueued
      - comment: "the transport accepted it (capture: kept for the mailbox)"
        name: MailSent
        type: string
        value: core.MailSent
      - comment: the last attempt failed; another is scheduled
        name: MailRetrying
        type: string
        value: core.MailRetrying
      - comment: abandoned after its last attempt
        name: MailDead
        type: string
        value: core.MailDead
    name: MailQueued
  - grouped: true
    items:
      - doc: |-
          MockReplace is the one mode a [Mock] has: a test's app.Replace, a typed
          function run in place of an operation's handler — or of what a port calls —
          while the rest of its pipeline still runs. The Studio sets none (D13): it
          shows the application, it does not act on it, so the respond, fail and
          delay modes of the platform's kit have no representation here.
        name: MockReplace
        type: string
        value: core.MockReplace
    name: MockReplace
  - doc: The edge kinds.
    grouped: true
    items:
      - doc: |-
          EdgeCalls targets an endpoint or a port. From a port, it is the port's
          binding — what the port calls — and it is declared.
        name: EdgeCalls
        type: EdgeKind
        value: core.EdgeCalls
      - doc: EdgeReads targets a store the source reads from.
        name: EdgeReads
        type: EdgeKind
        value: core.EdgeReads
      - doc: EdgeWrites targets a store the source writes to.
        name: EdgeWrites
        type: EdgeKind
        value: core.EdgeWrites
      - doc: EdgePublishes targets a topic.
        name: EdgePublishes
        type: EdgeKind
        value: core.EdgePublishes
      - doc: |-
          EdgeDelivers goes from a topic to each of its subscriptions, and from a
          store to each watch it feeds (ADR 0008). Declared.
        name: EdgeDelivers
        type: EdgeKind
        value: core.EdgeDelivers
      - doc: EdgeTransitions targets a workflow; Label carries the event.
        name: EdgeTransitions
        type: EdgeKind
        value: core.EdgeTransitions
      - doc: EdgePersists goes from a workflow to the store it lives in. Declared.
        name: EdgePersists
        type: EdgeKind
        value: core.EdgePersists
      - doc: "EdgeSends targets a mailer: the source puts a message in its outbox."
        name: EdgeSends
        type: EdgeKind
        value: core.EdgeSends
      - doc: EdgeWakes goes from a topic to a declared loop it wakes. Declared.
        name: EdgeWakes
        type: EdgeKind
        value: core.EdgeWakes
      - doc: EdgeUses targets a secret whose value or keys the source uses.
        name: EdgeUses
        type: EdgeKind
        value: core.EdgeUses
      - doc: |-
          EdgeDispatches targets a command: the source dispatches it. From an
          endpoint that exposes the command, or from a port bound to it, it is
          declared.
        name: EdgeDispatches
        type: EdgeKind
        value: core.EdgeDispatches
      - doc: |-
          EdgeAsks targets a query: the source asks it. From an endpoint that
          exposes the query, or from a port bound to it, it is declared.
        name: EdgeAsks
        type: EdgeKind
        value: core.EdgeAsks
      - doc: |-
          EdgeContracts goes from one process role to another it talks to —
          through a socket, a pipe, a command line —, and names the versioned
          contract they share in [Edge].Contract. It is the only edge between two
          roles (D22). Declared.
        name: EdgeContracts
        type: EdgeKind
        value: core.EdgeContracts
      - doc: |-
          EdgeRuns goes from a role to what it runs: a CLI command, a listener,
          an endpoint's server, a loop. Declared.
        name: EdgeRuns
        type: EdgeKind
        value: core.EdgeRuns
      - doc: |-
          EdgeImports goes from a component to a library it may import (D19).
          Declared.
        name: EdgeImports
        type: EdgeKind
        value: core.EdgeImports
      - doc: EdgeRenders goes from a presentation to what it renders. Declared.
        name: EdgeRenders
        type: EdgeKind
        value: core.EdgeRenders
    name: EdgeCalls
  - grouped: true
    items:
      - comment: "0.4.1.1"
        doc: CodeInvalidID identifies an ID the grammar of [IDPattern] does not match.
        name: CodeInvalidID
        type: errs.Code
        value: core.CodeInvalidID
    name: CodeInvalidID
  - doc: The live event types.
    grouped: true
    items:
      - doc: EventHello opens every stream and carries the graph revision.
        name: EventHello
        type: EventType
        value: core.EventHello
      - doc: EventSpan reports one unit of work that finished on a node.
        name: EventSpan
        type: EventType
        value: core.EventSpan
      - doc: EventTransition reports a workflow instance changing state.
        name: EventTransition
        type: EventType
        value: core.EventTransition
      - doc: |-
          EventLifecycle reports a lifecycle component moving, or the process
          changing phase.
        name: EventLifecycle
        type: EventType
        value: core.EventLifecycle
      - doc: EventLoop reports a loop run.
        name: EventLoop
        type: EventType
        value: core.EventLoop
      - doc: EventCensus reports a workflow's population per state.
        name: EventCensus
        type: EventType
        value: core.EventCensus
      - doc: EventGraph reports that the graph structure changed.
        name: EventGraph
        type: EventType
        value: core.EventGraph
      - doc: EventLog reports a log record written by product code, in dev.
        name: EventLog
        type: EventType
        value: core.EventLog
      - doc: EventMail reports a mail entering the outbox or changing status.
        name: EventMail
        type: EventType
        value: core.EventMail
    name: EventHello
  - doc: |-
      The grammar of every ID a graph carries, written once. The runtime, the
      analyzer, the design files' JSON Schema and the Studio all read it from
      here: a second copy is how two sides come to derive different names for the
      same declaration (invariant 1 of the platform's kit).

      	id       = "external"
      	         | service
      	         | service "/" kind "/" name
      	         | "binary:" segment
      	         | "binary:" segment "/role/" segment
      	         | "library:" segment
      	service  = [ segment "." ] segment        ; "<module>.<service>"
      	segment  = [a-z][a-z0-9-]{0,62}
      	name     = [A-Za-z][A-Za-z0-9_.-]{0,62}
      	         | method " " path                 ; an endpoint named by its route

      A module's service named like the module is the module's name alone
      ([QualifiedService]); every other service of a module is qualified.
    grouped: true
    items:
      - doc: SegmentPattern is a service, module, binary, role or library name.
        name: SegmentPattern
        type: string
        value: core.SegmentPattern
      - doc: NamePattern is a node's name within its service and kind.
        name: NamePattern
        type: string
        value: core.NamePattern
      - doc: |-
          RoutePattern is the name of an endpoint declared without one: its
          route, "GET /tasks/{id}".
        name: RoutePattern
        type: string
        value: core.RoutePattern
      - doc: |-
          ContractPattern is the versioned contract an [EdgeContracts] edge
          carries: "render/v1".
        name: ContractPattern
        type: string
        value: core.ContractPattern
      - doc: BinaryScope prefixes the ID of a binary and of its roles.
        name: BinaryScope
        type: string
        value: core.BinaryScope
      - doc: LibraryScope prefixes the ID of a library.
        name: LibraryScope
        type: string
        value: core.LibraryScope
    name: SegmentPattern
  - grouped: true
    items:
      - doc: |-
          Version is the schema version of every document in this package.

          Version 2 adds the auth, mailer and loop kinds, the sends and wakes edges,
          the code level of every node ([CodeInfo]), the C4 context and containers
          ([Architecture]) and the daemon's own machinery ([Runtime]).

          Version 3 adds the secret kind ([SecretInfo]), the uses edge, the secret
          span operation, the rotation loop and the store origin of a setting.

          Version 4 is the one bump the decisions of issue #17 share. It adds the
          port kind ([PortInfo]) and its binding, a declared edge from the port to
          what it calls; the endpoint that implements a port
          ([EndpointInfo].Implements), which has no method and no path; and the
          replace mock mode ([MockReplace]). ADR 0004 adds the databases: the store's
          database ([StoreInfo].Database), the database container, the database
          connector and its adapters, [Runtime].Databases and [Setting].Database.
          ADR 0008 adds the modules the app mounts ([Graph].Modules), the module of a
          node ([Node].Module) and the Go module of a position outside the product's
          ([Source].GoModule); and the watch, a subscription fed by stores: its mark
          and the stores that feed it ([SubscriptionInfo].Mark,
          [SubscriptionInfo].Stores), each drawing a declared delivers edge to it.
          ADR 0005 adds the command and query kinds ([CommandInfo], [QueryInfo]),
          the dispatches and asks edges, the endpoint that exposes one
          ([EndpointInfo].Exposes), the read model ([StoreInfo].ReadModel), the
          dispatch, ask and handle span operations and the dispatch and ask
          controls.

          Version 5 is the first the SDK's framework publishes (ADR 0147). It
          adds what a product is made of beyond its services: the binary
          ([KindBinary]) and its process roles ([KindRole]), the short CLI command
          ([KindCLI]), the listener that is not HTTP ([KindListener]), the library
          shared between components ([KindLibrary]) and the presentation
          ([KindPresentation]); the edge between two roles of a product, which
          carries a versioned contract ([EdgeContracts], [Edge].Contract); and the
          grammar every ID follows, written once ([ID], [ParseID]). It removes what
          the Studio no longer does (D13): the respond, fail and delay mock modes,
          the control event and its payload — a [Mock] is a test's replacement only.

          Version 6 renames the runtime framework (ADR 0180): its packages are
          framework/app and framework/internal/app, so a source position the
          document gives in the framework's code names those paths, and the
          constants of the framework's own provenance, port owner and setting
          origin are [ProvenanceApp], [PortOwnerApp] and [SettingAppDev]; since
          ADR 0180's step 4 their values are "app" and "appdev", the build's
          and the graph's version of the framework are their field "app", and
          the variable a framework setting names carries the product's prefix.
        name: Version
        type: int
        value: core.Version
    name: Version
  - grouped: true
    items:
      - doc: ExternalID is the id of the node standing for the outside world.
        name: ExternalID
        type: string
        value: core.ExternalID
    name: ExternalID
  - doc: Exposure says who may reach an endpoint.
    grouped: true
    items:
      - doc: ExposePublic endpoints are routed on the product's HTTP listener.
        name: ExposePublic
        type: string
        value: core.ExposePublic
      - doc: |-
          ExposePrivate endpoints have no route: the implementation of a port
          (Service.Implement), reached in process through its port. A graph kit
          made before its operations were internal by default also marks so an
          endpoint it kept off the listener.
        name: ExposePrivate
        type: string
        value: core.ExposePrivate
    name: ExposePublic
  - doc: |-
      How an exposure says it is open on purpose, when its operation declares
      no permission and no rule (EndpointInfo.Access).
    grouped: true
    items:
      - doc: |-
          AccessAnyone is app.Anyone(): whoever reaches the route may run the
          operation.
        name: AccessAnyone
        type: string
        value: core.AccessAnyone
      - doc: |-
          AccessAnyUser is app.AnyUser(): any signed-in user may run it — the
          operation asks for one.
        name: AccessAnyUser
        type: string
        value: core.AccessAnyUser
    name: AccessAnyone
  - doc: Authentication an endpoint asks for.
    grouped: true
    items:
      - doc: |-
          AuthRequired endpoints run only for an authenticated caller; the others
          are answered 401 before the handler runs.
        name: AuthRequired
        type: string
        value: core.AuthRequired
      - doc: |-
          AuthOptional endpoints run the auth handler when credentials are
          present, and serve anonymous callers too.
        name: AuthOptional
        type: string
        value: core.AuthOptional
    name: AuthRequired
  - doc: Transition triggers.
    grouped: true
    items:
      - doc: TriggerEvent is a transition fired by code, naming an event.
        name: TriggerEvent
        type: string
        value: core.TriggerEvent
      - doc: |-
          TriggerTimer is a transition fired after a duration in a state, or at
          an instant the entity carries.
        name: TriggerTimer
        type: string
        value: core.TriggerTimer
      - doc: |-
          TriggerGuard is a transition fired when a condition on the entity
          holds, checked each time the entity is written.
        name: TriggerGuard
        type: string
        value: core.TriggerGuard
      - doc: TriggerCreate is the entry of a new instance into the initial state.
        name: TriggerCreate
        type: string
        value: core.TriggerCreate
    name: TriggerEvent
  - doc: |-
      How the start chose what a port calls: app.Bind, else the one
      Service.Implement among the services the app mounts, else the port's
      fallback — or a test replaced the port.
    grouped: true
    items:
      - doc: ViaBind is the app's app.Bind.
        name: ViaBind
        type: string
        value: core.ViaBind
      - doc: ViaImplement is the one Service.Implement among the mounted services.
        name: ViaImplement
        type: string
        value: core.ViaImplement
      - doc: ViaFallback is the port's own app.Fallback.
        name: ViaFallback
        type: string
        value: core.ViaFallback
      - doc: |-
          ViaReplace is a test's app.Replace: a function answers in place of
          whatever the port would call, and nothing is bound.
        name: ViaReplace
        type: string
        value: core.ViaReplace
    name: ViaBind
  - doc: How a command is handled.
    grouped: true
    items:
      - doc: |-
          ModeSync is handled on its caller's goroutine: Dispatch returns the
          handler's result.
        name: ModeSync
        type: string
        value: core.ModeSync
      - doc: |-
          ModeQueued is sent to the background (app.Queued): Dispatch returns
          once the command's own queue accepted it, and a consumer handles it,
          retried and dead-lettered.
        name: ModeQueued
        type: string
        value: core.ModeQueued
    name: ModeSync
  - doc: Mail transports.
    grouped: true
    items:
      - doc: TransportSMTP delivers to an SMTP relay.
        name: TransportSMTP
        type: string
        value: core.TransportSMTP
      - doc: |-
          TransportCapture keeps every message for the Studio's mailbox and
          delivers nothing: the transport of dev and tests.
        name: TransportCapture
        type: string
        value: core.TransportCapture
    name: TransportSMTP
  - doc: How a secret is made.
    grouped: true
    items:
      - doc: "SecretProvided is given by the operator: an SMTP URL, an API token."
        name: SecretProvided
        type: string
        value: core.SecretProvided
      - doc: |-
          SecretGenerated is made by kit and rotated on a schedule: a signing or
          sealing key.
        name: SecretGenerated
        type: string
        value: core.SecretGenerated
    name: SecretProvided
  - doc: Where a running app found a secret.
    grouped: true
    items:
      - doc: |-
          SecretFromEnv is the environment: the variable, or the file its _FILE
          form names.
        name: SecretFromEnv
        type: string
        value: core.SecretFromEnv
      - doc: |-
          SecretFromFile is the framework's encrypted file store: <PRODUCT>_SECRETS=file:<dir>,
          or the data directory's .secrets in dev.
        name: SecretFromFile
        type: string
        value: core.SecretFromFile
      - doc: |-
          SecretFromMemory is a store in the process's memory: a test, or
          <PRODUCT>_SECRETS=memory. A generated secret is made again at every start.
        name: SecretFromMemory
        type: string
        value: core.SecretFromMemory
      - doc: SecretFromStore is a store the product's code gave kit.
        name: SecretFromStore
        type: string
        value: core.SecretFromStore
    name: SecretFromEnv
  - doc: Loop styles.
    grouped: true
    items:
      - doc: |-
          LoopDeclared is Service.Loop: kit owns the wait — the wake sources are
          data, so the diagram draws them — and the product owns the work.
        name: LoopDeclared
        type: string
        value: core.LoopDeclared
      - doc: |-
          LoopGoroutine is Service.Go: the product wrote the whole loop; kit
          starts it, stops it, restarts it after a failure, and reads its select
          statements to draw what it waits on.
        name: LoopGoroutine
        type: string
        value: core.LoopGoroutine
    name: LoopDeclared
  - doc: Wake source kinds of a declared loop, and why a loop of kit's ran.
    grouped: true
    items:
      - comment: a fixed period
        name: WakeInterval
        type: string
        value: core.WakeInterval
      - comment: a time the product computes after every run
        name: WakeDeadline
        type: string
        value: core.WakeDeadline
      - comment: any publish on a topic
        name: WakeTopic
        type: string
        value: core.WakeTopic
      - comment: once, when the app starts
        name: WakeStart
        type: string
        value: core.WakeStart
      - comment: Loop.Nudge, or the Studio
        name: WakeManual
        type: string
        value: core.WakeManual
      - comment: a write of the store a workflow runs over, or of one a watch hears
        name: WakeChange
        type: string
        value: core.WakeChange
    name: WakeInterval
  - doc: Select case kinds.
    grouped: true
    items:
      - comment: a timer, ticker or time.After channel
        name: SelectTimer
        type: string
        value: core.SelectTimer
      - comment: "ctx.Done(): the loop's way out"
        name: SelectDone
        type: string
        value: core.SelectDone
      - comment: any other receive
        name: SelectReceive
        type: string
        value: core.SelectReceive
      - comment: a send
        name: SelectSend
        type: string
        value: core.SelectSend
      - comment: "the default case: the select never blocks"
        name: SelectDefault
        type: string
        value: core.SelectDefault
    name: SelectTimer
  - doc: "What a field holds: the classes of an app tag (ADR 0006)."
    grouped: true
    items:
      - doc: |-
          ClassPublic holds nothing personal and nothing secret: the question
          was asked.
        name: ClassPublic
        type: string
        value: core.ClassPublic
      - doc: |-
          ClassPersonal holds data about an identifiable person: a name, an
          address, a message a person wrote.
        name: ClassPersonal
        type: string
        value: core.ClassPersonal
      - doc: |-
          ClassSpecial holds the special categories of GDPR art. 9(1), or
          criminal convictions (art. 10).
        name: ClassSpecial
        type: string
        value: core.ClassSpecial
      - doc: "ClassSecret holds a credential: a password's hash, a token's digest."
        name: ClassSecret
        type: string
        value: core.ClassSecret
    name: ClassPublic
  - doc: The node kinds.
    grouped: true
    items:
      - doc: KindService groups the nodes of one bounded context.
        name: KindService
        type: NodeKind
        value: core.KindService
      - doc: KindEndpoint is an HTTP endpoint with typed request and response.
        name: KindEndpoint
        type: NodeKind
        value: core.KindEndpoint
      - doc: KindStore is a typed, keyed collection of entities.
        name: KindStore
        type: NodeKind
        value: core.KindStore
      - doc: KindTopic is an asynchronous, at-least-once message channel.
        name: KindTopic
        type: NodeKind
        value: core.KindTopic
      - doc: KindSubscription consumes one topic.
        name: KindSubscription
        type: NodeKind
        value: core.KindSubscription
      - doc: KindWorkflow is a state machine over the entities of one store.
        name: KindWorkflow
        type: NodeKind
        value: core.KindWorkflow
      - doc: "KindJob is scheduled work: a fixed interval or a cron expression."
        name: KindJob
        type: NodeKind
        value: core.KindJob
      - doc: KindFrontend is static assets served by the product.
        name: KindFrontend
        type: NodeKind
        value: core.KindFrontend
      - doc: KindExternal stands for everything outside the product.
        name: KindExternal
        type: NodeKind
        value: core.KindExternal
      - doc: |-
          KindAuth is the app's authentication handler: it turns a request's
          credentials into a user, in front of every endpoint that asks for one.
        name: KindAuth
        type: NodeKind
        value: core.KindAuth
      - doc: |-
          KindMailer is outbound mail: a durable outbox, and the transport that
          empties it — SMTP, or the capture of dev and tests.
        name: KindMailer
        type: NodeKind
        value: core.KindMailer
      - doc: |-
          KindLoop is a long-running loop of the daemon: declared (kit owns the
          wait, the product the work) or hand-written (a goroutine kit supervises).
        name: KindLoop
        type: NodeKind
        value: core.KindLoop
      - doc: |-
          KindSecret is a secret the product declares: provided by the operator,
          or generated by kit and rotated on a schedule. Its value is never in a
          graph.
        name: KindSecret
        type: NodeKind
        value: core.KindSecret
      - doc: |-
          KindPort is an operation a service needs and does not implement: a
          typed request, a typed response, a name. What it calls — another
          service's endpoint, the app's binding, its own fallback — is decided
          when the app starts, and drawn as a declared edge from the port.
        name: KindPort
        type: NodeKind
        value: core.KindPort
      - doc: |-
          KindCommand is an operation that changes something: a typed input, a
          typed result, one handler, the pipeline of its kind. It is dispatched,
          on its caller's goroutine or through its own queue.
        name: KindCommand
        type: NodeKind
        value: core.KindCommand
      - doc: |-
          KindQuery is an operation that reads and changes nothing: a typed
          input, a typed result, one handler. It is asked.
        name: KindQuery
        type: NodeKind
        value: core.KindQuery
      - doc: |-
          KindBinary is one executable the product ships. It holds process
          roles; its ID is "binary:<name>".
        name: KindBinary
        type: NodeKind
        value: core.KindBinary
      - doc: |-
          KindRole is one process role of a binary — "statusline" and
          "statusline daemon" are two roles of one binary. Its root package is
          generated wiring; two roles talk through their contract only. Its ID
          is "binary:<binary>/role/<name>".
        name: KindRole
        type: NodeKind
        value: core.KindRole
      - doc: |-
          KindCLI is a short command-line command: it parses its arguments,
          runs once and exits with a typed status.
        name: KindCLI
        type: NodeKind
        value: core.KindCLI
      - doc: |-
          KindListener accepts connections that are not HTTP: a private Unix
          socket, a named pipe. It is an inbound port like an endpoint.
        name: KindListener
        type: NodeKind
        value: core.KindListener
      - doc: |-
          KindLibrary is a package shared between components, declared so the
          components that use it are allowed to import it. Its ID is
          "library:<name>".
        name: KindLibrary
        type: NodeKind
        value: core.KindLibrary
      - doc: |-
          KindPresentation turns a service's results into what a reader sees:
          a rendered line, a page, a report.
        name: KindPresentation
        type: NodeKind
        value: core.KindPresentation
    name: KindService
  - doc: "Process profiles: what a role does with its process."
    grouped: true
    items:
      - doc: |-
          ProfileServer serves HTTP until it is stopped: the platform's kit
          product, and the only profile that opens a TCP listener.
        name: ProfileServer
        type: string
        value: core.ProfileServer
      - doc: |-
          ProfileCLI parses its arguments, runs once and exits with a typed
          status. It starts no listener and no loop outlives it.
        name: ProfileCLI
        type: string
        value: core.ProfileCLI
      - doc: |-
          ProfileDaemon runs until it is stopped, or until it has been idle for
          its declared time, and serves no HTTP: it answers on its listeners —
          a private socket, a pipe — and runs its loops.
        name: ProfileDaemon
        type: string
        value: core.ProfileDaemon
    name: ProfileServer
  - doc: Listener networks.
    grouped: true
    items:
      - doc: NetworkUnix is a Unix-domain socket, private to its owner.
        name: NetworkUnix
        type: string
        value: core.NetworkUnix
      - doc: NetworkPipe is a Windows named pipe, its DACL granting its owner only.
        name: NetworkPipe
        type: string
        value: core.NetworkPipe
      - doc: |-
          NetworkLocal is NetworkUnix where there is one, NetworkPipe on
          Windows: what a product declares when it does not care which.
        name: NetworkLocal
        type: string
        value: core.NetworkLocal
    name: NetworkUnix
  - doc: The modes of <PRODUCT>_RETENTION.
    grouped: true
    items:
      - doc: "RetentionOn erases and deletes what is due: the default."
        name: RetentionOn
        type: string
        value: core.RetentionOn
      - doc: |-
          RetentionDryRun journals what the retention would do and changes
          nothing: how a new retention is deployed over old data.
        name: RetentionDryRun
        type: string
        value: core.RetentionDryRun
      - doc: RetentionOff runs no retention, warned of at every start outside dev.
        name: RetentionOff
        type: string
        value: core.RetentionOff
    name: RetentionOn
  - doc: The gaps a register lists for a store that keeps personal data.
    grouped: true
    items:
      - comment: no app.Purpose
        name: GapPurpose
        type: string
        value: core.GapPurpose
      - comment: "no retention, kit's or the product's: its personal data is kept forever"
        name: GapRetention
        type: string
        value: core.GapRetention
      - comment: "no subject field: no person can have their records"
        name: GapSubject
        type: string
        value: core.GapSubject
    name: GapPurpose
  - doc: The security measures a register lists (point g).
    grouped: true
    items:
      - doc: |-
          MeasureRedacted: the Studio, the spans and the logs never show a
          personal, special or secret value.
        name: MeasureRedacted
        type: string
        value: core.MeasureRedacted
      - doc: "MeasureHolds: a legal hold stops erasure and deletion."
        name: MeasureHolds
        type: string
        value: core.MeasureHolds
      - doc: |-
          MeasureJournal: every export, erasure, deletion and hold is journaled,
          each entry chained to the previous one by SHA-256.
        name: MeasureJournal
        type: string
        value: core.MeasureJournal
      - doc: |-
          MeasureNotSealed: the store's classified members are in clear: it is
          kept in memory, where nothing is at rest, or its members are plain.
        name: MeasureNotSealed
        type: string
        value: core.MeasureNotSealed
      - doc: |-
          MeasureSealed: its classified members are sealed at rest, AES-256-GCM
          under per-subject data keys a person's erasure destroys (ADR 0006 §4).
        name: MeasureSealed
        type: string
        value: core.MeasureSealed
    name: MeasureRedacted
  - doc: |-
      SealedPlaceholder is what the Studio receives in place of a value kit
      keeps sealed at rest — a record's member in the data browser, a former
      value —: never the value, nor its box (ADR 0006 §9). A value it opens and
      may not show is "[redacted]".
    items:
      - name: SealedPlaceholder
        type: string
        value: core.SealedPlaceholder
    name: SealedPlaceholder
  - doc: The operations of the privacy journal.
    grouped: true
    items:
      - comment: a person's records exported
        name: JournalExport
        type: string
        value: core.JournalExport
      - comment: a record read by a module, through app.Records
        name: JournalRead
        type: string
        value: core.JournalRead
      - comment: a store's keys listed by a module that watches it, through app.Records
        name: JournalList
        type: string
        value: core.JournalList
      - comment: a record's personal data cleared
        name: JournalErase
        type: string
        value: core.JournalErase
      - comment: a record removed
        name: JournalDelete
        type: string
        value: core.JournalDelete
      - comment: some fields of a record cleared, by a module
        name: JournalEraseFields
        type: string
        value: core.JournalEraseFields
      - comment: a hold placed on a record
        name: JournalHold
        type: string
        value: core.JournalHold
      - comment: a hold lifted
        name: JournalRelease
        type: string
        value: core.JournalRelease
      - comment: a subject's data key destroyed (ADR 0006, step 3)
        name: JournalShred
        type: string
        value: core.JournalShred
      - comment: a journal opened after the one before it closed, naming its last hash (ADR 0180 step 5c)
        name: JournalContinue
        type: string
        value: core.JournalContinue
    name: JournalExport
  - doc: Profile kinds.
    grouped: true
    items:
      - comment: where CPU time went, sampled for a duration
        name: ProfileCPU
        type: string
        value: core.ProfileCPU
      - comment: where the live heap was allocated
        name: ProfileHeap
        type: string
        value: core.ProfileHeap
    name: ProfileCPU
  - doc: Process phases, in the order a process goes through them.
    grouped: true
    items:
      - name: PhaseStarting
        type: string
        value: core.PhaseStarting
      - name: PhaseServing
        type: string
        value: core.PhaseServing
      - name: PhaseDraining
        type: string
        value: core.PhaseDraining
      - name: PhaseStopped
        type: string
        value: core.PhaseStopped
      - name: PhaseFailed
        type: string
        value: core.PhaseFailed
    name: PhaseStarting
  - doc: Database states.
    grouped: true
    items:
      - doc: |-
          DatabaseUnset: no URL, in dev. Its stores stay in the data directory
          and nothing is opened.
        name: DatabaseUnset
        type: string
        value: core.DatabaseUnset
      - doc: |-
          DatabaseMemory: the app keeps its data in memory (app.InMemory):
          nothing is opened, no URL is read.
        name: DatabaseMemory
        type: string
        value: core.DatabaseMemory
      - doc: |-
          DatabaseOpen: the pool is open, its migrations ran, it answered its
          check at start.
        name: DatabaseOpen
        type: string
        value: core.DatabaseOpen
      - doc: "DatabaseFailed: the start could not open it, migrate it or reach it."
        name: DatabaseFailed
        type: string
        value: core.DatabaseFailed
      - doc: "DatabaseClosed: not opened yet, or closed by the stop."
        name: DatabaseClosed
        type: string
        value: core.DatabaseClosed
    name: DatabaseUnset
  - doc: Where a setting's value comes from.
    grouped: true
    items:
      - comment: an environment variable
        name: SettingEnv
        type: string
        value: core.SettingEnv
      - comment: "the product's code: an AppOption"
        name: SettingOption
        type: string
        value: core.SettingOption
      - comment: kit's default for the environment
        name: SettingDefault
        type: string
        value: core.SettingDefault
      - comment: the environment's secret store (a secret)
        name: SettingStore
        type: string
        value: core.SettingStore
      - comment: kit dev set the variable, for this launch
        name: SettingAppDev
        type: string
        value: core.SettingAppDev
      - comment: a configuration file of the product (Detail)
        name: SettingFile
        type: string
        value: core.SettingFile
    name: SettingEnv
  - doc: |-
      The settings the framework reads, by the variable that sets each. The
      framework's own are named under the product's prefix — its name
      upper-cased, every other character an underscore —, so a constant holds
      the name after it: VarDataDir is TODO_DATA_DIR for the product "todo"
      (ADR 0180 §3). VarStudio, VarStudioRemote, VarAnalyze and VarDevForced are
      the tool's, set by it and read whole by the Studio subsystem alone.
    grouped: true
    items:
      - name: VarEnv
        type: string
        value: core.VarEnv
      - name: VarAddr
        type: string
        value: core.VarAddr
      - name: VarDataDir
        type: string
        value: core.VarDataDir
      - name: VarStudio
        type: string
        value: core.VarStudio
      - name: VarStudioRemote
        type: string
        value: core.VarStudioRemote
      - name: VarAnalyze
        type: string
        value: core.VarAnalyze
      - name: VarTrustProxy
        type: string
        value: core.VarTrustProxy
      - name: VarAllowedHosts
        type: string
        value: core.VarAllowedHosts
      - name: VarLogLevel
        type: string
        value: core.VarLogLevel
      - name: VarSMTPURL
        type: string
        value: core.VarSMTPURL
      - doc: |-
          VarRetention sets what the stores' retention loops do: on, dry-run
          or off (ADR 0006).
        name: VarRetention
        type: string
        value: core.VarRetention
      - doc: |-
          VarDevForced is how kit dev tells the product which of the variables
          above it set itself for this launch: their origin is kit dev.
        name: VarDevForced
        type: string
        value: core.VarDevForced
    name: VarEnv
  - doc: Boot steps, in the order kit takes them.
    grouped: true
    items:
      - comment: the environment and the options, read
        name: BootConfig
        type: string
        value: core.BootConfig
      - comment: what the services declare, checked
        name: BootDeclarations
        type: string
        value: core.BootDeclarations
      - comment: the services bound to the app
        name: BootMount
        type: string
        value: core.BootMount
      - comment: the routes of endpoints and frontends
        name: BootRoutes
        type: string
        value: core.BootRoutes
      - comment: the data directory, opened
        name: BootData
        type: string
        value: core.BootData
      - comment: health, the Studio, protection, observation
        name: BootHandler
        type: string
        value: core.BootHandler
      - comment: the lifecycle components, started in order
        name: BootComponents
        type: string
        value: core.BootComponents
      - comment: "ready: the phase is serving"
        name: BootServing
        type: string
        value: core.BootServing
    name: BootConfig
  - doc: Component states.
    grouped: true
    items:
      - name: ComponentPending
        type: string
        value: core.ComponentPending
      - name: ComponentStarting
        type: string
        value: core.ComponentStarting
      - name: ComponentUp
        type: string
        value: core.ComponentUp
      - name: ComponentStopping
        type: string
        value: core.ComponentStopping
      - name: ComponentDown
        type: string
        value: core.ComponentDown
      - name: ComponentFailed
        type: string
        value: core.ComponentFailed
    name: ComponentPending
  - doc: Loop kinds.
    grouped: true
    items:
      - comment: a job, fired by the scheduler
        name: LoopJob
        type: string
        value: core.LoopJob
      - comment: "a workflow's own loop: its timers and guards, when due"
        name: LoopTimer
        type: string
        value: core.LoopTimer
      - comment: a subscription's consumer, a queued command's, or a mailer's outbox
        name: LoopConsumer
        type: string
        value: core.LoopConsumer
      - comment: the HTTP server's accept loop
        name: LoopHTTP
        type: string
        value: core.LoopHTTP
      - comment: the scheduler's own loop, which fires the jobs
        name: LoopScheduler
        type: string
        value: core.LoopScheduler
      - comment: a declared loop's wake cycle (Service.Loop)
        name: LoopWake
        type: string
        value: core.LoopWake
      - comment: a hand-written loop (Service.Go)
        name: LoopRoutine
        type: string
        value: core.LoopRoutine
      - comment: a generated secret's rotation, on its schedule
        name: LoopRotation
        type: string
        value: core.LoopRotation
      - comment: "a store's retention: erases and deletes what is due (ADR 0006)"
        name: LoopRetention
        type: string
        value: core.LoopRetention
    name: LoopJob
  - doc: "Loop provenances: who wrote the code that loops."
    grouped: true
    items:
      - doc: |-
          ProvenanceLibrary loops are written by a library: net/http's accept
          loop, the SDK scheduler, the SDK queue consumer.
        name: ProvenanceLibrary
        type: string
        value: core.ProvenanceLibrary
      - doc: |-
          ProvenanceApp loops are written by the framework for a declaration: a workflow's
          sweep, a declared loop's wake cycle.
        name: ProvenanceApp
        type: string
        value: core.ProvenanceApp
      - doc: "ProvenanceProduct loops are written by hand in the product: Service.Go."
        name: ProvenanceProduct
        type: string
        value: core.ProvenanceProduct
    name: ProvenanceLibrary
  - doc: Loop states.
    grouped: true
    items:
      - comment: blocked until its next wake
        name: LoopWaiting
        type: string
        value: core.LoopWaiting
      - comment: doing a run
        name: LoopRunning
        type: string
        value: core.LoopRunning
      - comment: failed, waiting out its backoff
        name: LoopRestarting
        type: string
        value: core.LoopRestarting
      - name: LoopStopped
        type: string
        value: core.LoopStopped
    name: LoopWaiting
  - doc: Span operations.
    grouped: true
    items:
      - comment: an HTTP request served by an endpoint
        name: OpRequest
        type: string
        value: core.OpRequest
      - comment: an in-process call of an endpoint, or of a port
        name: OpCall
        type: string
        value: core.OpCall
      - comment: a store read
        name: OpRead
        type: string
        value: core.OpRead
      - comment: a store write
        name: OpWrite
        type: string
        value: core.OpWrite
      - comment: a topic publish
        name: OpPublish
        type: string
        value: core.OpPublish
      - comment: a subscription handling one message
        name: OpDeliver
        type: string
        value: core.OpDeliver
      - comment: a workflow transition
        name: OpTransition
        type: string
        value: core.OpTransition
      - comment: a job run, a loop run
        name: OpRun
        type: string
        value: core.OpRun
      - comment: the auth handler, in front of an endpoint
        name: OpAuth
        type: string
        value: core.OpAuth
      - comment: a mail put in the outbox
        name: OpSend
        type: string
        value: core.OpSend
      - comment: the outbox handing one mail to the transport
        name: OpDeliverMail
        type: string
        value: core.OpDeliverMail
      - comment: "a secret's value or keys used: Value, Seal, Open, Sign, Verify"
        name: OpSecret
        type: string
        value: core.OpSecret
      - comment: "a command dispatched: its run, or its queuing for a queued one"
        name: OpDispatch
        type: string
        value: core.OpDispatch
      - comment: a query asked
        name: OpAsk
        type: string
        value: core.OpAsk
      - comment: a queued command handled by its consumer, in the dispatcher's trace
        name: OpHandle
        type: string
        value: core.OpHandle
      - comment: a connection a listener accepted, handled until it closes
        name: OpConnect
        type: string
        value: core.OpConnect
      - comment: a short command-line command, run once
        name: OpCLI
        type: string
        value: core.OpCLI
      - doc: |-
          OpTransaction is a unit of work (app.Transact, a command's, a
          workflow's transition): its attrs say the database it belongs to —
          "database", and "backend" as a store says it —, its "outcome", the
          effects it held ("effects"), and "savepoint" for one nested in
          another.
        name: OpTransaction
        type: string
        value: core.OpTransaction
    name: OpRequest
  - doc: The outcomes of a transaction, as its span's "outcome" attribute says them.
    grouped: true
    items:
      - doc: "OutcomeCommit is a transaction that committed: its effects left."
        name: OutcomeCommit
        type: string
        value: core.OutcomeCommit
      - doc: |-
          OutcomeRollback is a transaction whose writes were undone: its effects
          were dropped.
        name: OutcomeRollback
        type: string
        value: core.OutcomeRollback
    name: OutcomeCommit
  - doc: Span statuses.
    grouped: true
    items:
      - name: StatusOK
        type: string
        value: core.StatusOK
      - name: StatusError
        type: string
        value: core.StatusError
    name: StatusOK
  - doc: |-
      MaxTableLen is the longest table name a store on a database takes, in
      bytes: the SDK's document store over SQL keeps its index rows in the table
      named after it with "___ix", within PostgreSQL's 63.
    items:
      - name: MaxTableLen
        type: int
        value: core.MaxTableLen
    name: MaxTableLen
