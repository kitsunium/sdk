imports:
  core: github.com/kitsunium/sdk/framework/model/internal/core
  errs: github.com/kitsunium/sdk/internal/kernel/errs
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/framework/model
  name: model
  purpose: "Package model is the Product Graph: the one data shape every part of the framework agrees on."
types:
  - alias: true
    doc: |-
      Architecture is the product at the two outer levels of the C4 model.

      Context (level 1) is the product as one box, the people who use it and the
      systems it depends on. Containers (level 2) is what the product is
      deployed as: the process, the frontend its browser runs, the volume its
      data lives on. Components (level 3) are the nodes, grouped by service; code
      (level 4) is each node's [CodeInfo].

      kit derives all of it from the declarations — a frontend implies a person
      with a browser, a mailer an SMTP relay, a data directory a volume, a
      database its own container — so it is exactly as true as the rest of the
      graph.
    kind: alias
    name: Architecture
    underlying: core.ArchitectureMessage
  - alias: true
    doc: |-
      Person is a human user of the product.
      It is drawn at the edge of the C4 context view, outside every container.
    kind: alias
    name: Person
    underlying: core.PersonMessage
  - alias: true
    doc: |-
      System is a software system outside the product.
      Nodes are the product's nodes that talk to it; Technology says what it runs
      on.
    kind: alias
    name: System
    underlying: core.SystemMessage
  - alias: true
    doc: |-
      Container is one runnable or storage unit of the product.
      Its ID starts with "container:"; Nodes are the nodes that live in it.
    kind: alias
    name: Container
    underlying: core.ContainerMessage
  - alias: true
    doc: |-
      Port is an address a process listens on.
      Owner is the container that listens on it; Serves names what is reached
      through it.
    kind: alias
    name: Port
    underlying: core.PortMessage
  - alias: true
    doc: |-
      Link is a relationship between two elements of the architecture. The
      process's link to a database, "Reads and writes", carries the database
      connector, and the store connector once stores live on it.
    kind: alias
    name: Link
    underlying: core.LinkMessage
  - alias: true
    doc: |-
      CodeInfo is the code a node runs, as the static analysis read it: the
      fourth and innermost level of the C4 model. The entry is the function the
      node runs — an endpoint's handler, a subscription's, a loop's — and Funcs
      are the functions of the module it reaches, each with what it calls and
      what it does to other nodes.
    kind: alias
    name: CodeInfo
    underlying: core.CodeResult
  - alias: true
    doc: |-
      CodeFunc is one function of the module a node's code reaches.
      Its steps are listed in the order they run, under the blocks that guard
      them.
    kind: alias
    name: CodeFunc
    underlying: core.CodeFuncMessage
  - alias: true
    doc: |-
      CodeStep is one thing a function does: a call to another function of the
      module, a call on a building block, or a call into the SDK — under the
      innermost block that guards it.
    kind: alias
    name: CodeStep
    underlying: core.CodeStepMessage
  - alias: true
    doc: |-
      CodeBlock is a block of a function that decides whether, or how many
      times, the steps under it run.
    kind: alias
    name: CodeBlock
    underlying: core.CodeBlockMessage
  - alias: true
    doc: |-
      CodeEffect is one call on a building block, inside a function.
      It names the node it reaches and the edge kind that call draws.
    kind: alias
    name: CodeEffect
    underlying: core.CodeEffectMessage
  - alias: true
    doc: |-
      CodeUse is one SDK function a node's code calls.
      Sites are where the node's code calls it, so a reader sees what it leans
      on.
    kind: alias
    name: CodeUse
    underlying: core.CodeUseMessage
  - alias: true
    doc: |-
      Connector is something a product plugs into, as the product declares it:
      how it is reached, what it reaches out to, where it keeps its data. The
      Studio shows a connector's pages and widgets only when the product has
      one: a command-line tool has no requests to list, a service without a
      mailer no mailbox.

      A connector says what the code declares, never what an environment
      supplies. The relay a mailer delivers through, the directory a store
      writes to, the address kit listens on are facts of the running
      environment — [MailerInfo], [StoreInfo], the [Architecture] and [Runtime]
      carry those. So a connector is a pure function of the nodes
      ([ConnectorsOf]), and never moves a graph's revision.
    kind: alias
    name: Connector
    underlying: core.ConnectorMessage
  - alias: true
    doc: ConnectorKind groups connectors by what they are for.
    kind: alias
    name: ConnectorKind
    underlying: core.ConnectorKind
  - alias: true
    doc: |-
      ConnectorInfo is a connector kit can plug a product into, whether the
      product uses it or not: what it is, and the building blocks that bring it.
    kind: alias
    name: ConnectorInfo
    underlying: core.ConnectorSpec
  - alias: true
    doc: |-
      Adapter is a module a connector plugs a product in through: an engine,
      imported by the product's main to reach a database, and the only code of
      the product that imports its driver.
    kind: alias
    name: Adapter
    underlying: core.AdapterMessage
  - alias: true
    doc: |-
      MailSummary is the name [MailMessage] embeds its summary under: the field
      a caller sets and reads is MailMessage.MailSummary, its JSON members
      promoted beside the body's.
    kind: alias
    name: MailSummary
    underlying: core.MailSummary
  - alias: true
    doc: |-
      MailMessage is a whole captured mail, for the Studio's mailbox.
      It is kept by the capture transport of dev and tests only, never in
      production.
    kind: alias
    name: MailMessage
    underlying: core.MailMessage
  - alias: true
    doc: |-
      EdgeKind says how two nodes relate.
      It is a wire format — the graph's JSON and the Studio's TypeScript unions
      carry these names —, so it stays a string.
    kind: alias
    name: EdgeKind
    underlying: core.EdgeKind
  - alias: true
    doc: |-
      EventType names the kind of a live event.
      It is a wire format — the graph's JSON and the Studio's TypeScript unions
      carry these names —, so it stays a string.
    kind: alias
    name: EventType
    underlying: core.EventType
  - alias: true
    doc: |-
      StoreHistory is what a store remembers of its records.
      Fields names the fields it keeps former values of; Kept and Bytes weigh
      them, and Versions, Trashed and VersionBytes weigh its records' versions.
    kind: alias
    name: StoreHistory
    underlying: core.StoreHistoryMessage
  - alias: true
    doc: |-
      PasswordPolicy is the policy of one secret field that holds a password's
      hash (Store.Passwords).
    kind: alias
    name: PasswordPolicy
    underlying: core.PasswordPolicyMessage
  - alias: true
    doc: |-
      Former is one former value of a field that keeps its history: what it
      was, until when, and who replaced it.
    kind: alias
    name: Former
    underlying: core.FormerMessage
  - alias: true
    doc: |-
      RecordHistory is what kit remembers of one record, as the Studio's data
      view shows it (GET /_app/api/former): each field's former values, newest
      first, by the field's JSON pointer — a secret field's without their
      values, a personal or special one's redacted.
    kind: alias
    name: RecordHistory
    underlying: core.RecordHistoryMessage
  - alias: true
    doc: |-
      RecordVersion is one version of a record whose store keeps revisions
      (ADR 0007 §3): its number, when the write that made it ran, who made
      it and which command, and the record as it was.
    kind: alias
    name: RecordVersion
    underlying: core.RecordVersionMessage
  - alias: true
    doc: |-
      Edit is one change between two versions of a record, in RFC 6902's
      words: an add, a remove or a replace at a JSON pointer.
    kind: alias
    name: Edit
    underlying: core.EditMessage
  - alias: true
    doc: |-
      RecordVersions is a record's versions as the Studio's data view shows
      them (GET /_app/api/revisions), and what changed between two.
    kind: alias
    name: RecordVersions
    underlying: core.RecordVersionsMessage
  - alias: true
    doc: |-
      TrashedRecord is one record in a store's trash as the Studio lists it
      (GET /_app/api/trash): its key, when the product deleted it and when kit
      purges it — never its value.
    kind: alias
    name: TrashedRecord
    underlying: core.TrashedRecordMessage
  - alias: true
    doc: |-
      StoreTrash is a page of a store's trash as the Studio lists it (GET
      /_app/api/trash), in key order.
    kind: alias
    name: StoreTrash
    underlying: core.StoreTrashMessage
  - alias: true
    doc: ExportedVersions are the versions of one exported record.
    kind: alias
    name: ExportedVersions
    underlying: core.ExportedVersionsMessage
  - alias: true
    doc: |-
      ID is a node's identity, parsed: the one grammar of [IDPattern]. Its
      String is the ID it was parsed from.
    kind: alias
    name: ID
    underlying: core.IDValue
  - alias: true
    doc: |-
      Graph is the whole product.
      It is the JSON document the runtime serves and the analyzer writes; Version
      names its shape.
    kind: alias
    name: Graph
    underlying: core.GraphMessage
  - alias: true
    doc: |-
      App identifies the product and the machine that described it.
      It names the module, the environment and the build the graph was taken
      from.
    kind: alias
    name: App
    underlying: core.AppMessage
  - alias: true
    doc: |-
      Build is what a binary was built from, at its three levels.
      Its three levels are the Go toolchain, the main module and the modules it
      depends on.
    kind: alias
    name: Build
    underlying: core.BuildMessage
  - alias: true
    doc: |-
      ModuleVersion identifies one module of a build.
      Local and Modified say when the code that ran is not the published version.
    kind: alias
    name: ModuleVersion
    underlying: core.ModuleVersionMessage
  - alias: true
    doc: |-
      Source locates code.
      File is relative to its module's root; Line and EndLine bound the
      declaration.
    kind: alias
    name: Source
    underlying: core.SourceMessage
  - alias: true
    doc: |-
      Edge is one relation, with the evidence for it.
      Declared, Static and Observed say whether construction, the code or the
      runtime knows it.
    kind: alias
    name: Edge
    underlying: core.EdgeMessage
  - alias: true
    doc: |-
      Stats are observed counters for a node or an edge.
      They are counters: they never move a graph's revision.
    kind: alias
    name: Stats
    underlying: core.StatsMessage
  - alias: true
    doc: |-
      Diagnostic is a problem found while building the graph.
      It names the node or the file it is about, and how serious it is.
    kind: alias
    name: Diagnostic
    underlying: core.DiagnosticMessage
  - alias: true
    doc: |-
      Analysis reports the status of static analysis.
      It says whether the analyzer ran, how long it took, and the error that
      stopped it.
    kind: alias
    name: Analysis
    underlying: core.AnalysisResult
  - alias: true
    doc: |-
      Module is a module the app mounts: a Go module's services, released and
      mounted together like a bundle (ADR 0008). Everything a module declares is
      qualified with its name: its services are "<module>.<service>" — the one
      named like the module is "<module>" —, so its nodes are
      "<module>.<service>/<kind>/<name>" and carry [Node].Module.
    kind: alias
    name: Module
    underlying: core.ModuleMessage
  - alias: true
    doc: |-
      File is one file a graph points at: its path, relative to its root — the
      product's module, or the Go module [Source].GoModule names.
    kind: alias
    name: File
    underlying: core.FileMessage
  - alias: true
    doc: |-
      Node is one building block.
      Its ID is its identity; exactly one of the kind-specific fields matching
      Kind is set.
    kind: alias
    name: Node
    underlying: core.NodeEntity
  - alias: true
    doc: |-
      EndpointInfo describes an HTTP endpoint, or the implementation of a port.
      It carries the method and path, the request and response schemas, and its
      auth.
    kind: alias
    name: EndpointInfo
    underlying: core.EndpointSpec
  - alias: true
    doc: |-
      PortInfo describes a port: an operation a service needs and another
      implements.
    kind: alias
    name: PortInfo
    underlying: core.PortSpec
  - alias: true
    doc: |-
      CommandInfo describes a command: an operation that changes something.
      It carries its input and result schemas, its handler, its queue and who may
      dispatch it.
    kind: alias
    name: CommandInfo
    underlying: core.CommandSpec
  - alias: true
    doc: |-
      QueryInfo describes a query: an operation that reads and changes
      nothing.
    kind: alias
    name: QueryInfo
    underlying: core.QuerySpec
  - alias: true
    doc: |-
      Permission is what a caller needs to dispatch a command or to ask a
      query: that the app's policy lets it do Action to Resource (Allow).
    kind: alias
    name: Permission
    underlying: core.PermissionMessage
  - alias: true
    doc: |-
      StoreInfo describes a store.
      It carries the entity's schema, its backend, its indexes, its privacy and
      its history.
    kind: alias
    name: StoreInfo
    underlying: core.StoreSpec
  - alias: true
    doc: |-
      StorePrivacy is what a store keeps of people: whom each record is about,
      why, for how long, and — on a runtime graph — what is held and due.
    kind: alias
    name: StorePrivacy
    underlying: core.StorePrivacyMessage
  - alias: true
    doc: |-
      Retention is when kit erases or deletes a record: after a delay counted
      from an instant the record carries (After or Setting, and Since), or at an
      instant a function gives (At).
    kind: alias
    name: Retention
    underlying: core.RetentionSpec
  - alias: true
    doc: |-
      ProductRetention is a retention the product keeps itself, as it says
      it.
    kind: alias
    name: ProductRetention
    underlying: core.ProductRetentionSpec
  - alias: true
    doc: |-
      HeldUntil is the hold a store declares on each of its records, until an
      instant the record carries.
    kind: alias
    name: HeldUntil
    underlying: core.HeldUntilSpec
  - alias: true
    doc: |-
      IndexInfo is one secondary index of a store.
      Its name is unique in the store; Unique says whether two records may share
      a key.
    kind: alias
    name: IndexInfo
    underlying: core.IndexSpec
  - alias: true
    doc: |-
      TopicInfo describes a topic.
      It carries the message's schema; its subscriptions are the nodes it
      delivers to.
    kind: alias
    name: TopicInfo
    underlying: core.TopicSpec
  - alias: true
    doc: |-
      SubscriptionInfo describes a subscription — or a watch (ADR 0008), a
      subscription whose deliveries come from stores instead of a topic.
    kind: alias
    name: SubscriptionInfo
    underlying: core.SubscriptionSpec
  - alias: true
    doc: |-
      WorkflowInfo describes a state machine bound to a store.
      It carries the states and the transitions between them, and the store it
      lives in.
    kind: alias
    name: WorkflowInfo
    underlying: core.WorkflowSpec
  - alias: true
    doc: |-
      StateInfo is one state of a workflow.
      Terminal marks a state an instance stays in; Count is how many instances
      are in it.
    kind: alias
    name: StateInfo
    underlying: core.StateSpec
  - alias: true
    doc: |-
      TransitionInfo is one arrow of a workflow.
      It names the event that fires it and the states it goes from and to.
    kind: alias
    name: TransitionInfo
    underlying: core.TransitionSpec
  - alias: true
    doc: |-
      JobInfo describes a scheduled job.
      It carries the fixed interval or the cron expression that schedules it.
    kind: alias
    name: JobInfo
    underlying: core.JobSpec
  - alias: true
    doc: |-
      FrontendInfo describes static assets served by the product.
      It carries the path the assets are served under and where they are read
      from.
    kind: alias
    name: FrontendInfo
    underlying: core.FrontendSpec
  - alias: true
    doc: |-
      AuthInfo describes the app's authentication handler.
      Credentials says what it reads from a request; Endpoints are the ones
      behind it.
    kind: alias
    name: AuthInfo
    underlying: core.AuthSpec
  - alias: true
    doc: |-
      MailerInfo describes outbound mail.
      It carries the transport that empties the outbox and the outbox's counters.
    kind: alias
    name: MailerInfo
    underlying: core.MailerSpec
  - alias: true
    doc: |-
      SecretInfo describes a declared secret: how it is made, where it lives,
      its versions — never its value.
    kind: alias
    name: SecretInfo
    underlying: core.SecretSpec
  - alias: true
    doc: |-
      LoopInfo describes a loop node.
      Style says whether it is declared (kit owns the wait) or hand-written.
    kind: alias
    name: LoopInfo
    underlying: core.LoopSpec
  - alias: true
    doc: |-
      WakeSource is one thing that wakes a declared loop.
      Kind says whether a topic, a period (Every) or a function wakes the loop.
    kind: alias
    name: WakeSource
    underlying: core.WakeSourceMessage
  - alias: true
    doc: |-
      SelectCase is one case of a select statement in a hand-written loop.
      The analyzer reads it from the loop's body; Kind says what the case waits
      on.
    kind: alias
    name: SelectCase
    underlying: core.SelectCaseMessage
  - alias: true
    doc: |-
      Mechanic is a generic building block, backed by an SDK package, that a node
      composes. The catalog lists every mechanic kit offers; an endpoint's
      pipeline lists the ones it uses.
    kind: alias
    name: Mechanic
    underlying: core.MechanicMessage
  - alias: true
    doc: |-
      Schema describes a Go type as it appears on the wire.
      It is a JSON-Schema-like shape: a kind, its fields or elements, and its Go
      type.
    kind: alias
    name: Schema
    underlying: core.SchemaMessage
  - alias: true
    doc: |-
      Field is one member of an object schema.
      It carries the JSON name, the schema of its value and the classes of its
      data.
    kind: alias
    name: Field
    underlying: core.FieldMessage
  - alias: true
    doc: |-
      NodeKind is the closed set of building blocks a kit product is made of.
      It is a wire format — the graph's JSON and the Studio's TypeScript unions
      carry these names —, so it stays a string.
    kind: alias
    name: NodeKind
    underlying: core.NodeKind
  - alias: true
    doc: |-
      BinaryInfo is one executable the product ships: the [Node].Binary of a
      [KindBinary] node, naming its roles.
    kind: alias
    name: BinaryInfo
    underlying: core.BinarySpec
  - alias: true
    doc: |-
      RoleInfo is one process role of a binary: the [Node].Role of a
      [KindRole] node — its profile, arguments, singleton and idle stop.
    kind: alias
    name: RoleInfo
    underlying: core.RoleSpec
  - alias: true
    doc: |-
      CLIInfo is a short command-line command: the [Node].CLI of a [KindCLI]
      node, the words that run it.
    kind: alias
    name: CLIInfo
    underlying: core.CLISpec
  - alias: true
    doc: |-
      ListenerInfo is a listener that is not HTTP: the [Node].Listener of a
      [KindListener] node — its network, its contract, who may connect.
    kind: alias
    name: ListenerInfo
    underlying: core.ListenerSpec
  - alias: true
    doc: |-
      LibraryInfo is a package shared between components (D19): the
      [Node].Library of a [KindLibrary] node.
    kind: alias
    name: LibraryInfo
    underlying: core.LibrarySpec
  - alias: true
    doc: |-
      PresentationInfo is what turns results into what a reader sees: the
      [Node].Presentation of a [KindPresentation] node.
    kind: alias
    name: PresentationInfo
    underlying: core.PresentationSpec
  - alias: true
    doc: |-
      PersonalData is a person's data as app.Export gives it (GDPR art. 15 and
      20): their records, store by store, with what art. 15(1) asks beside them.
    kind: alias
    name: PersonalData
    underlying: core.PersonalDataMessage
  - alias: true
    doc: |-
      StoreData is one store's records about a person.
      It is one part of what app.Export gives a person about themselves.
    kind: alias
    name: StoreData
    underlying: core.StoreDataMessage
  - alias: true
    doc: |-
      Erasure is what app.Erase did, store by store.
      Stores lists, store by store, what the erasure did there.
    kind: alias
    name: Erasure
    underlying: core.ErasureMessage
  - alias: true
    doc: |-
      StoreErasure is one store's part of an erasure: the keys of the records
      erased, deleted, and held — left in place, as a legal hold asks. A key
      may be personal data, which the Studio and the logs never show.
    kind: alias
    name: StoreErasure
    underlying: core.StoreErasureMessage
  - alias: true
    doc: |-
      Privacy is what a running app says of the personal data it keeps.
      It is the Privacy page's data: the register, the holds and the journal's
      state.
    kind: alias
    name: Privacy
    underlying: core.PrivacyMessage
  - alias: true
    doc: |-
      Register is the record of processing of GDPR art. 30(1), as far as the
      code knows it.
    kind: alias
    name: Register
    underlying: core.RegisterMessage
  - alias: true
    doc: |-
      RegisterStore is one store's line in the register.
      It names the classes the store keeps, their purposes and their retention.
    kind: alias
    name: RegisterStore
    underlying: core.RegisterStoreMessage
  - alias: true
    doc: |-
      Hold is one record a legal hold keeps. It carries references only: never
      the record's key, its subject's identity, or the hold's reason, which kit
      keeps apart.
    kind: alias
    name: Hold
    underlying: core.HoldEvent
  - alias: true
    doc: |-
      JournalEntry is one operation of the privacy journal: what was done,
      where, by whom and when, with references only — never an identity, a
      value or a key. Each entry is chained to the previous one by SHA-256.
    kind: alias
    name: JournalEntry
    underlying: core.JournalEntryEvent
  - alias: true
    doc: |-
      JournalCheck is what verifying the journal's chain found.
      A broken chain names the first entry whose hash does not follow.
    kind: alias
    name: JournalCheck
    underlying: core.JournalCheckMessage
  - alias: true
    doc: |-
      RecordFormer is the former values of one exported record's fields.
      A personal or special field's former values are redacted, never exported in
      clear.
    kind: alias
    name: RecordFormer
    underlying: core.RecordFormerMessage
  - alias: true
    doc: |-
      Profile is a pprof profile of the running product, folded onto its graph:
      every sample is attributed to the node whose code was running — through
      the pprof label kit puts on every handler, subscription, job and loop run,
      or, for the heap, which carries no label, through the node's code functions
      on the sample's stack.
    kind: alias
    name: Profile
    underlying: core.ProfileResult
  - alias: true
    doc: |-
      NodeCost is what one node cost.
      It is the share of the profile's samples spent in the node's code.
    kind: alias
    name: NodeCost
    underlying: core.NodeCostMessage
  - alias: true
    doc: |-
      FuncCost is what one function cost.
      It carries the flat and cumulative samples of the function and where it
      lives.
    kind: alias
    name: FuncCost
    underlying: core.FuncCostMessage
  - alias: true
    doc: |-
      FlameNode is one frame of a flame graph.
      Its children are the frames it called; its value is the samples under it.
    kind: alias
    name: FlameNode
    underlying: core.FlameNodeMessage
  - alias: true
    doc: |-
      Goroutines is every goroutine of the process, grouped by what it runs.
      Each group names the node its stack runs in, when one does.
    kind: alias
    name: Goroutines
    underlying: core.GoroutinesResult
  - alias: true
    doc: |-
      GoroutineGroup is goroutines doing the same thing.
      They share one stack; Count says how many run it.
    kind: alias
    name: GoroutineGroup
    underlying: core.GoroutineGroup
  - alias: true
    doc: |-
      Runtime is what a running process says about itself: the daemon's own state
      and its internal loop.
    kind: alias
    name: Runtime
    underlying: core.RuntimeMessage
  - alias: true
    doc: |-
      Database is one database the app declares (app.Database), as the running
      process found it. Its URL is never shown: where it was found, the engine,
      the address and the TLS mode are.
    kind: alias
    name: Database
    underlying: core.DatabaseMessage
  - alias: true
    doc: |-
      Pool is a database's connection pool, as database/sql counts it.
      It is sampled when the runtime state is read; its counters never move a
      revision.
    kind: alias
    name: Pool
    underlying: core.Pool
  - alias: true
    doc: |-
      MigrationSet is one set of migrations on a database — kit's own, the
      product's (app.Migrations), a module's — with its own version table, and
      so its own lock.
    kind: alias
    name: MigrationSet
    underlying: core.MigrationSetMessage
  - alias: true
    doc: |-
      Migration is one versioned migration.
      Its Version orders it among the others; Name says what it does.
    kind: alias
    name: Migration
    underlying: core.MigrationMessage
  - alias: true
    doc: |-
      Setting is one configuration value kit read when the product started:
      kit's own, or one a service of the product declares.
    kind: alias
    name: Setting
    underlying: core.SettingMessage
  - alias: true
    doc: |-
      BootStep is one step of the start, as it ran.
      It carries when it began, how long it took and, when it failed, its error.
    kind: alias
    name: BootStep
    underlying: core.BootStepMessage
  - alias: true
    doc: |-
      DevBuild is one build of `kit dev`: when, how long, and why.
      It lets the Studio say what changed and how long the reload took.
    kind: alias
    name: DevBuild
    underlying: core.DevBuildMessage
  - alias: true
    doc: |-
      PhaseChange is one step of the daemon's life.
      It carries the phase entered, when it was entered, and why.
    kind: alias
    name: PhaseChange
    underlying: core.PhaseChangeEvent
  - alias: true
    doc: |-
      Process is the Go process a product runs in.
      It carries the runtime's figures — goroutines, heap, GC, CPU — taken at At.
    kind: alias
    name: Process
    underlying: core.ProcessSpec
  - alias: true
    doc: |-
      HTTPServer is the product's HTTP server, and whose loop serves it.
      Its address is the one it listens on; its loop is the node that runs it.
    kind: alias
    name: HTTPServer
    underlying: core.HTTPServer
  - alias: true
    doc: |-
      Component is one lifecycle component: brought up in order, taken down in
      reverse.
    kind: alias
    name: Component
    underlying: core.ComponentMessage
  - alias: true
    doc: |-
      Loop is one recurring piece of the daemon's internal loop: a job, a
      workflow's timer sweep, a subscription's consumer, the HTTP accept loop, a
      declared or hand-written loop.
    kind: alias
    name: Loop
    underlying: core.LoopMessage
  - alias: true
    doc: |-
      Event is one live event. Exactly one of the payload fields matching Type is
      set.
    kind: alias
    name: Event
    underlying: core.Event
  - alias: true
    doc: |-
      Span is a finished unit of work, attributed to a node. Only allow-listed,
      wire-safe fields travel: no URL, no query string, no private error text.
    kind: alias
    name: Span
    underlying: core.SpanMessage
  - alias: true
    doc: |-
      Payload is the request and the response of a span, as JSON, in dev only.
      Every member whose name says it is a secret — password, token, secret,
      authorization, cookie… — or whose Go field is tagged app:"secret" is
      replaced by "[redacted]", and each side is cut at 8 KiB.
    kind: alias
    name: Payload
    underlying: core.Payload
  - alias: true
    doc: |-
      TransitionEvent is one workflow instance moving between states.
      It names the workflow, the entity, the event and the states it went from
      and to.
    kind: alias
    name: TransitionEvent
    underlying: core.TransitionEvent
  - alias: true
    doc: |-
      Census is a workflow's population per state.
      It counts the instances in each state when the census was taken.
    kind: alias
    name: Census
    underlying: core.CensusMessage
  - alias: true
    doc: |-
      Trace is the spans sharing one trace ID, root first.
      The root span is the one with no parent in the trace; the others follow it.
    kind: alias
    name: Trace
    underlying: core.TraceMessage
  - alias: true
    doc: |-
      Snippet is source code served to a reader of the graph.
      Focus and FocusEnd mark the lines a reader asked for, inside the lines
      served.
    kind: alias
    name: Snippet
    underlying: core.SnippetMessage
  - alias: true
    doc: |-
      Instance is one entity's journey through a workflow.
      It carries the entity's key, its current state and the steps that brought
      it there.
    kind: alias
    name: Instance
    underlying: core.InstanceMessage
  - alias: true
    doc: |-
      Step is one transition in an instance's history.
      It carries the event, the states it went from and to, and when it fired.
    kind: alias
    name: Step
    underlying: core.StepEvent
  - alias: true
    doc: |-
      LogRecord is one log record written by product code through app.Log, kept
      in dev so the Studio can show a request's logs beside its spans.
    kind: alias
    name: LogRecord
    underlying: core.LogRecordMessage
  - alias: true
    doc: |-
      Mock is the replacement a test gave the app ([MockReplace]).
      It is set by a test only; the Studio shows it and never sets one (D13).
    kind: alias
    name: Mock
    underlying: core.MockMessage
vars:
  - doc: |-
      InvalidID is returned by [ParseID] for a string the ID grammar does not
      match. Its "part" field names what failed — the kind, the service name, the
      node name —, never the input.
    items:
      - name: InvalidID
        type: "*errs.Error"
        value: core.InvalidID
    name: InvalidID
  - doc: |-
      IDPattern is the whole grammar as one regular expression, anchored —
      the one the design files' JSON Schema publishes for an ID. Only an
      endpoint may be named by its route.
    items:
      - name: IDPattern
        type: string
        value: core.IDPattern
    name: IDPattern
