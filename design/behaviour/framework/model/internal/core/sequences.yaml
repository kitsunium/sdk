          do:
            - eval: workflowSources(n.Workflow, add)
              to: workflowSources
          when: n.Workflow != nil
      - opt:
          do:
            - eval: storeSources(n.Store, add)
              to: storeSources
          when: n.Store != nil
      - opt:
          do:
            - loop:
                do:
                  - eval: add(n.Loop.Wakes[j].Func)
                key: j
                range: n.Loop.Wakes
            - loop:
                do:
                  - eval: add(n.Loop.Selects[j].Source)
                key: j
                range: n.Loop.Selects
          when: n.Loop != nil
