apiVersion: design/behaviour/v1
sequences:
  - of: IsEngine
    participants:
      - id: caller
        kind: actor
      - id: IsEngine
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.ContainsFunc(engines, func(e AdapterMessage) bool { return e.ID == backend })
        to: slices
  - of: queued
    steps:
      - return: n.Command != nil && n.Command.Mode == ModeQueued
  - of: ConnectorCatalog
    participants:
      - id: caller
        kind: actor
      - id: ConnectorCatalog
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: out
        eval: make([]ConnectorSpec, len(builtin))
      - loop:
          do:
            - set: c.Roles
              to: slices
              value: slices.Clone(c.Roles)
            - set: c.Settings
              to: slices
              value: slices.Clone(c.Settings)
            - set: c.Declares
              to: slices
              value: slices.Clone(c.Declares)
            - set: c.Adapters
              to: slices
              value: slices.Clone(c.Adapters)
            - set: c.brings, c.detail
              value: nil, nil
            - set: out[i]
              value: c
          key: i
          range: builtin
          value: c
      - eval: slices.SortFunc(out, func(a, b ConnectorSpec) int { return strings.Compare(a.ID, b.ID) })
        to: slices
      - return: out
  - of: detailOf
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: c.detail == nil
      - set: detail
        value: c.detail(n)
      - return: detail, detail != ""
  - of: ConnectorsOf
    participants:
      - id: caller
        kind: actor
      - id: ConnectorsOf
        kind: self
      - id: detailOf
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - leaf: a const or type declaration in a body
        stmt: |-
          type found struct {
          		info    ConnectorSpec
          		nodes   []string
          		details []string
          	}
      - bind: by
        eval: map[string]*found{}
      - loop:
          do:
            - bind: "n"
              eval: "&nodes[i]"
            - loop:
                do:
                  - bind: f
                    eval: by[info.ID]
                  - opt:
                      do:
                        - set: f
                          value: "&found{info: *info}"
                        - set: by[info.ID]
                          value: f
                      when: f == nil
                  - set: f.nodes
                    value: append(f.nodes, n.ID)
                  - opt:
                      do:
                        - set: f.details
                          value: append(f.details, d)
                      init:
                        bind: d, ok
                        eval: detailOf(info, n)
                        to: detailOf
                      when: ok && !slices.Contains(f.details, d)
                key: _
                range: connectorsFor(n)
                value: info
          key: i
          range: nodes
      - bind: out
        eval: make([]ConnectorMessage, 0, len(by))
      - loop:
          do:
            - bind: f
              eval: by[id]
            - eval: slices.Sort(f.nodes)
              to: slices
            - eval: slices.Sort(f.details)
              to: slices
            - set: out
              value: |-
                append(out, ConnectorMessage{
                			ID: id, Kind: f.info.Kind, Roles: slices.Clone(f.info.Roles), Protocol: f.info.Protocol,
                			Detail: strings.Join(f.details, ", "), Settings: slices.Clone(f.info.Settings), Nodes: slices.Compact(f.nodes),
                		})
          key: _
          range: slices.Sorted(maps.Keys(by))
          value: id
      - return: out
  - of: SplitDoc
    participants:
      - id: caller
        kind: actor
      - id: SplitDoc
        kind: self
      - id: splitTagged
        kind: internal
      - id: joinLines
        kind: internal
    steps:
      - bind: def, docs
        eval: splitTagged(text)
        to: splitTagged
      - bind: out
        eval: map[string]string{}
      - loop:
          do:
            - opt:
                do:
                  - set: out[tag]
                    value: s
                init:
                  bind: s
                  eval: joinLines(lines)
                  to: joinLines
                when: s != ""
          key: tag
          range: docs
          value: lines
      - bind: d
        eval: joinLines(def)
        to: joinLines
      - opt:
          do:
            - set: d
              value: out["en"]
          when: d == ""
      - eval: delete(out, "en")
      - opt:
          do:
            - set: out
              value: nil
          when: len(out) == 0
      - return: d, out
  - of: splitTagged
    participants:
      - id: caller
        kind: actor
      - id: splitTagged
        kind: self
      - id: parts.add
        kind: internal
    steps:
      - var:
          name: parts
          type: taggedLines
      - loop:
          do:
            - eval: parts.add(line)
              to: parts.add
          key: line
          range: strings.SplitSeq(text, "\n")
      - return: parts.def, parts.docs
  - of: (*taggedLines).add
    participants:
      - id: caller
        kind: actor
      - id: (*taggedLines).add
        kind: self
      - id: strings
        kind: stdlib
      - id: docTag().FindStringSubmatch
        kind: value
    steps:
      - set: line
        to: strings
        value: strings.TrimSpace(line)
      - opt:
          do:
            - set: p.lang, line
              value: m[1], m[2]
          init:
            bind: m
            eval: docTag().FindStringSubmatch(line)
            to: docTag().FindStringSubmatch
          when: m != nil
      - opt:
          do:
            - set: p.def
              value: append(p.def, line)
            - return: ""
          when: p.lang == ""
      - opt:
          do:
            - set: p.docs
              value: map[string][]string{}
          when: p.docs == nil
      - set: p.docs[p.lang]
        value: append(p.docs[p.lang], line)
  - of: joinLines
    participants:
      - id: caller
        kind: actor
      - id: joinLines
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.Join(strings.Fields(strings.Join(lines, " ")), " ")
        to: strings
  - of: NodeID
    steps:
      - opt:
          do:
            - return: service
          when: kind == KindService
      - return: service + "/" + string(kind) + "/" + name
  - of: EdgeID
    steps:
      - bind: id
