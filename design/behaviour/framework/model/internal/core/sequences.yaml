      - opt:
          do:
            - eval: codeSources(n.Code, add)
              to: codeSources
          when: n.Code != nil
  - of: storeSources
    steps:
      - opt:
          do:
            - loop:
                do:
                  - eval: add(src)
                key: _
                range: st.Privacy.sources()
                value: src
          when: st.Privacy != nil
      - loop:
          do:
            - eval: add(src)
          key: _
          range: st.History.sources()
          value: src
  - of: workflowSources
    steps:
      - loop:
          do:
            - loop:
                do:
                  - eval: add(&st.OnEnter[j])
                key: j
                range: st.OnEnter
          key: _
          range: w.States
          value: st
      - loop:
          do:
            - eval: add(tr.Guard)
            - eval: add(tr.Source)
          key: _
          range: w.Transitions
          value: tr
