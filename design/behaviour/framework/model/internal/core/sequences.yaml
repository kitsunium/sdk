              value: "\"|\" + label"
          when: label != ""
      - return: id
  - of: (*GraphMessage).Files
    participants:
      - id: caller
        kind: actor
      - id: (*GraphMessage).Files
        kind: self
      - id: nodeSources
        kind: internal
      - id: g.graphSources
        kind: internal
      - id: slices
