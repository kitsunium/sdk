        type: errs.Code
        value: coreent.CodeLicenceExpired
    name: CodeLicenceExpired
  - doc: |-
      CodeKeyMismatch identifies a local key that does not match the published
      fingerprint.
    items:
      - name: CodeKeyMismatch
        type: errs.Code
        value: coreent.CodeKeyMismatch
    name: CodeKeyMismatch
  - doc: |-
      CodeRosterUnreachable identifies a check that could not decide either way. It
      is NOT a refusal, and a caller that treats it as one turns an outage into a
      revocation.
    items:
      - name: CodeRosterUnreachable
        type: errs.Code
        value: coreent.CodeRosterUnreachable
    name: CodeRosterUnreachable
  - doc: |-
      CodeAmbiguousLicence identifies more than one identity on one machine, which
      no automatic choice can resolve safely.
    items:
      - name: CodeAmbiguousLicence
        type: errs.Code
        value: coreent.CodeAmbiguousLicence
    name: CodeAmbiguousLicence
  - doc: CodeCIUnverifiable identifies a CI run whose provenance could not be proven.
    items:
      - name: CodeCIUnverifiable
        type: errs.Code
        value: coreent.CodeCIUnverifiable
    name: CodeCIUnverifiable
  - doc: |-
      CodeCIUnknownKey identifies a CI token signed by a key the issuer does not
