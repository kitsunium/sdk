constants:
  - doc: |-
      RosterLifetime is how long a signed roster stays usable. It bounds how long a
      revoked subject keeps working offline, and how long a captured roster can be
      replayed — the same bound, read from either side.
    items:
      - name: RosterLifetime
        type: time.Duration
        value: coreent.RosterLifetime
    name: RosterLifetime
  - doc: CodeNoLicence identifies a machine with no entitlement key at all.
    items:
      - name: CodeNoLicence
        type: errs.Code
        value: coreent.CodeNoLicence
    name: CodeNoLicence
  - doc: |-
      CodeRosterUnsigned identifies a roster carrying no valid vendor signature —
      the spoofing signal, since a substituted endpoint cannot produce one.
    items:
      - name: CodeRosterUnsigned
        type: errs.Code
        value: coreent.CodeRosterUnsigned
    name: CodeRosterUnsigned
  - doc: CodeRosterStale identifies a roster that verified but whose window has closed.
