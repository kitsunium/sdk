        type: errs.Code
        value: coreent.CodeRosterStale
    name: CodeRosterStale
  - doc: CodeRevoked identifies a subject absent from a roster that was itself valid.
    items:
      - name: CodeRevoked
        type: errs.Code
        value: coreent.CodeRevoked
    name: CodeRevoked
  - doc: CodeLicenceExpired identifies a subject whose own term has closed.
    items:
