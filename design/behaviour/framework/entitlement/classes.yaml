        type: errs.Code
        value: coreent.CodeCIUnknownKey
    name: CodeCIUnknownKey
  - doc: CodeCINotEntitled identifies a CI account the roster does not cover.
    items:
      - name: CodeCINotEntitled
        type: errs.Code
        value: coreent.CodeCINotEntitled
    name: CodeCINotEntitled
  - doc: CodeNoPossession identifies a holder who could not prove possession.
    items:
      - name: CodeNoPossession
        type: errs.Code
        value: coreent.CodeNoPossession
    name: CodeNoPossession
  - doc: |-
      CodeClockRegressed identifies a clock behind the last signed document this
      machine verified — the anti-rollback ratchet.
    items:
      - name: CodeClockRegressed
        type: errs.Code
        value: coreent.CodeClockRegressed
    name: CodeClockRegressed
  - doc: CodeUpdateRequired identifies a build below the floor the roster mandates.
