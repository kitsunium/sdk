# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      Shift values are WIRE-STABLE. Changing them breaks every persisted Code.
      A future layout (e.g. 4/8/8/12) MUST introduce a new Code type, never
      mutate these constants.
    grouped: true
    items:
      - name: shiftMajor
        type: uint
        value: "24"
      - name: shiftLayer
        type: uint
        value: "16"
      - name: shiftPackage
        type: uint
        value: "8"
    name: shiftMajor
  - doc: CIDR-style mask constants for prefix matching via NewPrefixMatcher.
    grouped: true
    items:
      - comment: /8 — all codes sharing Major
        name: MaskByMajor
        type: Code
        value: "0xFF_00_00_00"
      - comment: /16 — all codes sharing Major+Layer
        name: MaskByLayer
        type: Code
        value: "0xFF_FF_00_00"
      - comment: /24 — all codes sharing Major+Layer+Package
        name: MaskByPackage
        type: Code
        value: "0xFF_FF_FF_00"
      - comment: /32 — exact match only
        name: MaskExact
        type: Code
        value: "0xFF_FF_FF_FF"
    name: MaskByMajor
  - doc: |-
      padThreshold10 is the cutoff below which itoaPadded3 must emit two
      leading zeros ("00X"). Named to avoid a bare magic literal.
    items:
      - name: padThreshold10
        type: uint8
        value: "10"
    name: padThreshold10
  - doc: |-
      padThreshold100 is the cutoff below which itoaPadded3 must emit one
      leading zero ("0XX"). Named to avoid a bare magic literal.
    items:
      - name: padThreshold100
        type: uint8
        value: "100"
    name: padThreshold100
  - doc: |-
      codeMaxLen is the longest rendering of a Code in either form:
      "255.255.255.255" and "MMM.LLL.PPP.SSS" are both fifteen bytes.
    items:
      - name: codeMaxLen
        type: int
        value: "15"
    name: codeMaxLen
  - doc: |-
      octetMaxDigits is the decimal width of the largest octet, 255 — and so the
      width Padded fills every octet to.
    items:
      - name: octetMaxDigits
        type: int
        value: "3"
    name: octetMaxDigits
  - doc: codeDotCount is the number of '.' separators between a Code's four octets.
    items:
      - name: codeDotCount
        type: int
        value: "3"
    name: codeDotCount
  - grouped: true
    items:
      - comment: "0.0.0.1"
        doc: |-
          CodeInvalidCode identifies a Define call whose numeric code is zero,
          overflows int32-positive range, or violates the Layer=0 reserved rule.
        name: CodeInvalidCode
        type: Code
        value: iota + 0x00_00_00_01
      - comment: "0.0.0.2"
        doc: |-
          CodeInvalidReason identifies a Define call whose Reason is empty or
          does not match the SCREAMING_SNAKE convention.
        name: CodeInvalidReason
      - comment: "0.0.0.3"
        doc: |-
          CodeInvalidPublic identifies a Define call whose Public message is
          empty, exceeds 120 runes, or contains a newline.
        name: CodeInvalidPublic
      - comment: "0.0.0.4"
        doc: |-
          CodeInvalidPrivate identifies a Define call whose Private message is
          empty. Introduced by ADR 0005 to close the validate.go bug where
          CodeInvalidPublic was erroneously cited for Private-field failures.
        name: CodeInvalidPrivate
      - comment: "0.0.0.5"
        doc: |-
          CodeInvalidCodeString identifies a ParseCode failure (malformed
          canonical dotted-quad input).
        name: CodeInvalidCodeString
      - comment: "0.0.0.6"
        doc: |-
          CodeInvalidWrapParams identifies a Wrap-time validation failure on
          caller-supplied WrapParams. Wrap returns an *Error carrying this
          code instead of panicking (runtime path, not init-time).
        name: CodeInvalidWrapParams
    name: CodeInvalidCode
  - doc: |-
      defaultHTTPStatus is the wire status returned when an Error does not
      override it. 500 is deliberately generic — callers who want layer-aware
      mapping put the raw Code in a response header.
    items:
      - name: defaultHTTPStatus
        type: int
        value: "500"
    name: defaultHTTPStatus
  - doc: |-
      defaultExitCode is the POSIX exit status returned when an Error does not
      override it. 70 matches sysexits EX_SOFTWARE (internal software error).
    items:
      - name: defaultExitCode
        type: int
        value: "70"
    name: defaultExitCode
  - doc: trailSeparator precedes each wrap-site code in (*Error).Error's header.
    items:
      - name: trailSeparator
        type: string
        value: "\" <- \""
    name: trailSeparator
  - doc: |-
      truncatedMarker follows the trail in (*Error).Error's header when its
      middle links were dropped. Verbatim: operators grep for "(truncated)".
    items:
      - name: truncatedMarker
        type: string
        value: "\" (truncated)\""
    name: truncatedMarker
  - doc: decimalBase is the radix used when rendering integer FieldValue payloads.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: floatPrec is the shortest-round-trip sentinel for strconv.FormatFloat.
    items:
      - name: floatPrec
        type: int
        value: "-1"
    name: floatPrec
  - doc: floatBitSize tells strconv.FormatFloat we are formatting a 64-bit float.
    items:
      - name: floatBitSize
        type: int
        value: "64"
    name: floatBitSize
  - doc: floatFormat selects strconv's general exponent-or-decimal mode.
    items:
      - name: floatFormat
        type: byte
        value: "'g'"
    name: floatFormat
  - doc: |-
      fieldInvalid is the zero-value tag; it marks a FieldValue that was not
      built through one of the constructors. StringValue degrades to "" for it.
    items:
      - name: fieldInvalid
        type: fieldKind
        value: "0"
    name: fieldInvalid
  - doc: fieldString tags a FieldValue whose payload lives in the private str member.
    items:
      - name: fieldString
        type: fieldKind
        value: "1"
    name: fieldString
  - doc: fieldInt tags a FieldValue whose payload lives in the private num member.
    items:
      - name: fieldInt
        type: fieldKind
        value: "2"
    name: fieldInt
  - doc: fieldBool tags a FieldValue whose payload lives in the private bl member.
    items:
      - name: fieldBool
        type: fieldKind
        value: "3"
    name: fieldBool
  - doc: fieldFloat tags a FieldValue whose payload lives in the private fl member.
    items:
      - name: fieldFloat
        type: fieldKind
        value: "4"
    name: fieldFloat
  - doc: Canonical-form length and shape limits for ParseCode.
    grouped: true
    items:
      - doc: "codeStringMinLen is the shortest valid canonical form: \"0.0.0.0\"."
        name: codeStringMinLen
        type: int
        value: "7"
      - doc: "codeStringMaxLen is the longest valid canonical form: \"255.255.255.255\"."
        name: codeStringMaxLen
        type: int
        value: "15"
      - doc: codeSegmentCount is the exact number of dot-separated segments.
        name: codeSegmentCount
        type: int
        value: "4"
      - doc: codeSegmentLastIdx is the highest valid segment index (codeSegmentCount-1).
        name: codeSegmentLastIdx
        type: int
        value: "3"
      - doc: codeSegmentMaxDigits is the upper bound on a single segment's digit count.
        name: codeSegmentMaxDigits
        type: int
        value: "3"
    name: codeStringMinLen
  - doc: |-
      Per-segment numeric upper bound for ParseCode.
      The radix for digit accumulation is the package-wide decimalBase (field.go).
    grouped: true
    items:
      - doc: octetMax is the maximum value a single segment may represent.
        name: octetMax
        type: int
        value: "255"
    name: octetMax
  - doc: Diagnostics envelope sizing — bounds the echoed input in error messages.
    grouped: true
    items:
      - doc: |-
          inputEchoMax caps the prefix of malformed input we include in private
          diagnostics, preventing adversarial gigantic payloads from bloating logs.
        name: inputEchoMax
        type: int
        value: "32"
    name: inputEchoMax
  - doc: |-
      Fixed-position indices for the four-octet array — naming them removes the
      raw 0/1/2/3 literals from the Pack call site.
    grouped: true
    items:
      - doc: octetIdxMajor is the index of the Major octet inside the parsed array.
        name: octetIdxMajor
        type: int
        value: iota
      - doc: octetIdxLayer is the index of the Layer octet inside the parsed array.
        name: octetIdxLayer
      - doc: octetIdxPackage is the index of the Package octet inside the parsed array.
        name: octetIdxPackage
      - doc: octetIdxSerial is the index of the Serial octet inside the parsed array.
        name: octetIdxSerial
    name: octetIdxMajor
  - doc: prefixMatcherOpen opens PrefixMatcher.String's rendering.
    items:
      - name: prefixMatcherOpen
        type: string
        value: "\"PrefixMatcher{prefix=\""
    name: prefixMatcherOpen
  - doc: prefixMatcherMask separates the prefix from the mask in PrefixMatcher.String.
    items:
      - name: prefixMatcherMask
        type: string
        value: "\", mask=\""
    name: prefixMatcherMask
  - doc: |-
      registrySentinel is a compile-time marker that the registry audit is
      expected to run in this package. It has no runtime behaviour beyond
      existing.
    items:
      - name: registrySentinel
        type: string
        value: "\"sdk-registry-audit-v1\""
    name: registrySentinel
  - doc: |-
      maxTrailLen caps the trail length so pathological recursive wraps cannot
      grow the trail unbounded. Observed middleware depth in Go SDKs (go-kit,
      otel, sqlx, grpc-go) is <= 5; 16 gives 3x headroom. Memory cost per
      *Error with a full trail: 16 * 4 bytes = 64 bytes, negligible.
    items:
      - name: maxTrailLen
        type: int
        value: "16"
    name: maxTrailLen
  - doc: |-
      trailReserveTail is subtracted from maxTrailLen to compute how many tail
      entries to preserve on overflow truncation: preservedTail = maxTrailLen -
      trailReserveTail. The two reserved slots account for the origin (kept at
      index 0) and the newest entry being appended, so the final slice
      origin + preservedTail + newest fits within maxTrailLen.
    items:
      - name: trailReserveTail
        type: int
        value: "2"
    name: trailReserveTail
  - doc: |-
      maxPublicRunes bounds the size of the wire-safe Public message so no
      single error can blow up logs or HTTP responses.
    items:
      - name: maxPublicRunes
        type: int
        value: "120"
    name: maxPublicRunes
  - doc: reasonPattern documents the SCREAMING_SNAKE_CASE shape expected for Reason.
    items:
      - name: reasonPattern
        type: string
        value: "\"^[A-Z][A-Z0-9_]*$\""
    name: reasonPattern
  - doc: |-
      maxEchoRunes bounds how much of a caller's argument a structural failure
      quotes in its Private. The argument is the caller's own data, of any length:
      it never reaches Public (rule 4), and Private keeps enough to find the call
      site without carrying a runaway string into every log line.
    items:
      - name: maxEchoRunes
        type: int
        value: "64"
    name: maxEchoRunes
  - doc: echoEllipsis marks an echo clipped at maxEchoRunes.
    items:
      - name: echoEllipsis
        type: string
        value: "\"…\""
    name: echoEllipsis
  - doc: |-
      The Public of each structural failure: a fixed literal, at most
      maxPublicRunes runes and free of newlines, that never carries the caller's
      argument (rule 4). The detail — the offending value, the measured size — is
      the Private's.
    grouped: true
    items:
      - doc: publicCodeZero is the Public of a zero code.
        name: publicCodeZero
        type: string
        value: "\"The error code must be non-zero\""
      - doc: publicCodeOverflow is the Public of a code above the int32 range.
        name: publicCodeOverflow
        type: string
        value: "\"The error code must fit the positive int32 range\""
      - doc: publicCodeMetaLayer is the Public of a Layer=0 code outside the meta-codes.
        name: publicCodeMetaLayer
        type: string
        value: "\"Layer 0 of an error code is reserved for the errs meta-codes\""
      - doc: publicReason is the Public of a malformed Reason.
        name: publicReason
        type: string
        value: "\"The reason must match \" + reasonPattern"
      - doc: publicEmpty is the Public of an empty Public.
        name: publicEmpty
        type: string
        value: "\"The public message must not be empty\""
      - doc: publicTooLong is the Public of a Public above maxPublicRunes.
        name: publicTooLong
        type: string
        value: "\"The public message exceeds the 120-rune limit\""
      - doc: publicNewline is the Public of a Public holding a line terminator.
        name: publicNewline
        type: string
        value: "\"The public message must not contain a newline\""
      - doc: publicPrivateEmpty is the Public of an empty Private.
        name: publicPrivateEmpty
        type: string
        value: "\"The private message must not be empty\""
    name: publicCodeZero
  - doc: |-
      maxInt32Positive caps the dotted-quad Code at the largest non-negative
      int32 value so the deprecated Code() int accessor never wraps to a
      negative integer.
    items:
      - name: maxInt32Positive
        type: uint32
        value: "0x7FFFFFFF"
    name: maxInt32Positive
