functions:
  - name: CodeOf
    params: err error
    results: c Code, ok bool
  - name: ReasonOf
    params: err error
    results: reason string, ok bool
  - name: PublicOf
    params: err error
    results: string
  - name: PrivateOf
    params: err error
    results: string
  - name: FieldsOf
    params: err error
    results: "[]FieldValue"
  - name: HTTPStatusOf
    params: err error
    results: int
  - name: ExitCodeOf
    params: err error
    results: int
  - name: HasReason
    params: err error, reason string
    results: bool
  - doc: |-
      deepestError walks err via errors.As and returns the innermost *Error.
      Unexported because only the public accessors should use it.
    name: deepestError
    params: err error
    results: "*Error"
  - name: Pack
    params: mm Major, ll Layer, pp PkgCode, ss Serial
    results: Code
  - doc: |-
      appendCode appends the canonical dotted form of c — the bytes String
      returns — onto dst, so a renderer that composes a larger string (Error,
      PrefixMatcher.String) writes the code in place instead of allocating it.
    name: appendCode
    params: dst []byte, c Code
    results: "[]byte"
  - doc: |-
      codeLen returns len(c.String()) without rendering it, so a renderer can
      size its one allocation exactly.
    name: codeLen
    params: c Code
    results: int
  - doc: octetLen returns the number of decimal digits of an unpadded octet.
    name: octetLen
    params: octet uint8
    results: int
  - doc: |-
      itoaDecimal returns the decimal representation of a uint8 (0-255) UNPADDED.
      Internal helper for ParseCode's diagnostics; the renderers use appendCode.
    name: itoaDecimal
    params: octet uint8
    results: string
  - doc: |-
      appendPadded3 appends the zero-padded 3-digit decimal form ("000".. "255")
      of octet onto dst.
    name: appendPadded3
    params: dst []byte, octet uint8
    results: "[]byte"
  - name: WithHTTPStatus
    params: status int
    results: DefineOption
  - name: WithExitCode
    params: code int
    results: DefineOption
  - name: NewError
    params: code Code, reason, public, private string, opts ...DefineOption
    results: "*Error"
  - name: NewRuntime
    params: code Code, reason, public, private string, fields ...FieldValue
    results: "*Error"
  - name: Define
    params: code Code, reason, public, private string, opts ...DefineOption
    results: "*Error"
  - name: Static
    params: code Code, reason, public, private string, http, exit int
    results: "*Error"
  - doc: |-
      newValidationError is the BOOTSTRAP constructor used by validateDefineArgs
      to surface structural failures WITHOUT re-entering Define (which would
      recurse into validateDefineArgs again and blow the stack at init).

      Direct struct literal — does not call Define or validateDefineArgs.
    name: newValidationError
    params: code Code, reason, public, private string
    results: "*Error"
  - name: Wrap
    params: cause error, params WrapParams, fields ...FieldValue
    results: "*Error"
  - doc: |-
      wrapSDKCause builds the *Error returned when Wrap finds an *Error in
      the cause chain. Extracted from Wrap so each path through Wrap stays
      readable as a top-to-bottom case analysis instead of one nested branch.
    name: wrapSDKCause
    params: cause error, inner *Error, params WrapParams, fields []FieldValue
    results: "*Error"
  - doc: |-
      newFromStdlibCause builds an *Error for causes that are NOT *Error.
      Runtime-safe: validation failure on caller-supplied WrapParams returns
      a typed *Error{CodeInvalidWrapParams} instead of panicking (v5 HIGH fix).
    name: newFromStdlibCause
    params: cause error, params WrapParams, fields []FieldValue
    results: "*Error"
  - name: HasCode
    params: err error, c Code
    results: bool
  - doc: |-
      errCodeMatches reports whether the outermost *Error layer of err
      carries c either as its origin Code or anywhere in its trail.
    name: errCodeMatches
    params: err error, c Code
    results: bool
  - doc: |-
      hasCodeInSingleUnwrap recurses through the single-error Unwrap()
      interface to keep HasCode below the cyclo budget.
    name: hasCodeInSingleUnwrap
    params: err error, c Code
    results: bool
  - doc: |-
      hasCodeInMultiUnwrap recurses through the multi-error Unwrap()
      interface (e.g. errors.Join) to keep HasCode below the cyclo budget.
    name: hasCodeInMultiUnwrap
    params: err error, c Code
    results: bool
  - name: NewFieldValue
    params: key, val string
    results: FieldValue
  - name: String
    params: key, val string
    results: FieldValue
  - name: Int
    params: key string, val int
    results: FieldValue
  - name: Int64
    params: key string, val int64
    results: FieldValue
  - name: Bool
    params: key string, val bool
    results: FieldValue
  - name: Float
    params: key string, val float64
    results: FieldValue
  - name: ParseCode
    params: s string
    results: c Code, err error
  - doc: |-
      scanOctets walks s, finalises each dot-delimited segment via parseOctet,
      and returns the resulting four-octet array. Extracted from ParseCode to
      keep its cyclomatic complexity below the SDK ceiling.
    name: scanOctets
    params: s string
    results: octets [codeSegmentCount]uint8, err error
  - doc: |-
      parseOctet validates and returns a single octet per ParseCode rules.
      Extracted so the ParseCode main loop stays under the SDK's cyclomatic
      complexity ceiling.
    name: parseOctet
    params: seg string
    results: octet uint8, ok bool
  - doc: |-
      digitsToOctet reads seg as a base-10 unsigned integer and validates that
      every byte is an ASCII digit and that the result fits in a uint8.
      Extracted from parseOctet to keep its cyclomatic complexity below 9.
    name: digitsToOctet
    params: seg string
    results: octet uint8, ok bool
  - doc: |-
      parseFailure builds the *Error returned by ParseCode. Wrapping it in a
      helper keeps the call sites compact and centralises the Reason / Public
      messaging.
    name: parseFailure
    params: input, detail string
    results: "*Error"
  - name: NewPrefixMatcher
    params: prefix, mask Code
    results: "*PrefixMatcher"
  - name: RegistryMarker
    results: string
  - doc: |-
      appendTrail returns the new trail slice and whether truncation occurred.
      Contract:
        - cause == nil (no prior trail) → trail = [next] unless next == 0.
        - next == 0 → refuse to write a meaningless zero Code; existing trail
          is preserved untouched. (v5 fix: protects HasCode / PrefixMatcher
          from caller bugs on the origin-wins path where params.Code is
          appended unchecked.)
        - under cap → append, inherit cause.trailTruncated (monotonic OR).
        - overflow → keep origin + (maxTrailLen-2) most recent entries + next;
          trailTruncated transitions to true and stays true.
    name: appendTrail
    params: cause *Error, next Code
    results: trail []Code, truncated bool
  - name: TrailOf
    params: err error
    results: "[]Code"
  - doc: validateDefineArgs applies Define's structural rules.
    name: validateDefineArgs
    params: code Code, reason, public, private string
    results: "*Error"
  - doc: |-
      validateCode checks the dotted-quad Code. Rules (see ADR 0005):
      1. code != 0
      2. uint32(code) <= 0x7FFF_FFFF (safe int32 round-trip)
      3. Layer(code) != 0 unless code is in metaCodeAllowed
    name: validateCode
    params: code Code
    results: "*Error"
  - doc: validateReason checks the SCREAMING_SNAKE_CASE shape of Reason.
    name: validateReason
    params: reason string
    results: "*Error"
  - doc: validatePublic checks Public is non-empty, capped, and newline-free.
    name: validatePublic
    params: public string
    results: "*Error"
  - doc: |-
      validatePrivate checks Private is non-empty. v5 bug fix: this now cites
      CodeInvalidPrivate (not CodeInvalidPublic as pre-ADR-0005).
    name: validatePrivate
    params: private string
    results: "*Error"
  - doc: |-
      clipEcho bounds a caller's argument to maxEchoRunes runes for a Private,
      marking a cut with echoEllipsis. A cut never splits a rune.
    name: clipEcho
    params: value string
    results: string
  - doc: containsNewline reports whether s contains any newline rune.
    name: containsNewline
    params: s string
    results: bool
  - doc: |-
      isScreamingSnake reports whether s matches reasonPattern without pulling
      regexp into the kernel package.
    name: isScreamingSnake
    params: s string
    results: bool
  - doc: |-
      isValidReasonRune reports whether r is acceptable at position i inside a
      Reason identifier.
    name: isValidReasonRune
    params: i int, r rune
    results: bool
  - doc: isUpperLetter reports whether r is an uppercase ASCII letter.
    name: isUpperLetter
    params: r rune
    results: bool
  - doc: isDigit reports whether r is an ASCII digit.
    name: isDigit
    params: r rune
    results: bool
imports:
  errors: errors
  fmt: fmt
  slices: slices
  strconv: strconv
  strings: strings
  utf8: unicode/utf8
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/errs
  name: errs
  purpose: Package errs — provides package-level introspection helpers that walk a cause chain and read fields from the deepest *Error encountered.
types:
  - kind: named
    methods:
      - name: Major
        recv: c Code
        results: Major
      - name: Layer
        recv: c Code
        results: Layer
      - name: Package
        recv: c Code
        results: PkgCode
      - name: Serial
        recv: c Code
        results: Serial
      - name: String
        recv: c Code
        results: string
      - name: Padded
        recv: c Code
        results: string
    name: Code
    underlying: uint32
  - doc: |-
      Named octet types prevent positional-argument footguns in Pack.
      PkgCode is spelled out (not `Pkg`) so callers keep `pkg` as an ordinary
      variable name without shadowing.
    items:
      - name: Major
        underlying: uint8
      - name: Layer
        underlying: uint8
      - name: PkgCode
        underlying: uint8
      - name: Serial
        underlying: uint8
    kind: group
    name: Major
  - fields:
      - name: code
        type: Code
      - name: reason
        type: string
      - name: public
        type: string
      - name: private
        type: string
      - name: fields
        type: "[]FieldValue"
      - name: trail
        type: "[]Code"
      - name: trailTruncated
        type: bool
      - name: httpOverride
        type: int
      - name: exitOverride
        type: int
      - name: source
        type: error
    kind: struct
    methods:
      - name: Code
        recv: e *Error
        results: Code
      - name: Reason
        recv: e *Error
        results: string
      - name: Public
        recv: e *Error
        results: string
      - name: Private
        recv: e *Error
        results: string
      - name: Fields
        recv: e *Error
        results: "[]FieldValue"
      - name: Trail
        recv: e *Error
        results: "[]Code"
      - name: TrailTruncated
        recv: e *Error
        results: bool
      - name: Is
        params: target error
        recv: e *Error
        results: bool
      - doc: |-
          matchesPrefix reports whether this Error's origin code or any trail
          entry satisfies the *PrefixMatcher's (prefix, mask) pair. Extracted from
          Is so the three target-type branches there each remain a single line.
        name: matchesPrefix
        params: pm *PrefixMatcher
        recv: e *Error
        results: bool
      - doc: |-
          matchesSentinel reports whether this Error and target (already typed
          as *Error) refer to the same sentinel by (Code, Reason) — and falls
          back to pointer equality if the codes do not match.
        name: matchesSentinel
        params: te *Error, target error
        recv: e *Error
        results: bool
      - name: Error
        recv: e *Error
        results: string
      - doc: |-
          renderedLen returns len(e.Error()) without rendering it: the brackets,
          the spaces and the separators around each code, Reason and Public.
        name: renderedLen
        recv: e *Error
        results: int
      - name: Source
        recv: e *Error
        results: error
      - name: Unwrap
        recv: e *Error
        results: error
      - name: HTTPStatus
        recv: e *Error
        results: int
      - name: ExitCode
        recv: e *Error
        results: int
    name: Error
  - kind: named
    name: DefineOption
    underlying: func(e *Error)
  - doc: |-
      fieldKind discriminates a FieldValue's underlying type. The concrete
      values are unexported so callers cannot construct a FieldValue by struct
      literal — only the String/Int/Bool/Float/NewFieldValue helpers produce
      well-formed instances.
    kind: named
    name: fieldKind
    underlying: uint8
  - fields:
      - name: key
        type: string
      - name: kind
        type: fieldKind
      - name: str
        type: string
      - name: num
        type: int64
      - name: bl
        type: bool
      - name: fl
        type: float64
    kind: struct
    methods:
      - name: Key
        recv: f FieldValue
        results: string
      - name: StringValue
        recv: f FieldValue
        results: string
    name: FieldValue
  - fields:
      - name: prefix
        type: Code
      - name: mask
        type: Code
    kind: struct
    methods:
      - name: String
        recv: p *PrefixMatcher
        results: string
      - name: Error
        recv: p *PrefixMatcher
        results: string
      - name: Prefix
        recv: p *PrefixMatcher
        results: Code
      - name: Mask
        recv: p *PrefixMatcher
        results: Code
    name: PrefixMatcher
  - fields:
      - doc: Code is the dotted-quad identifier assigned to the wrapping Error.
        name: Code
        type: Code
      - doc: Reason is the SCREAMING_SNAKE stable identifier of the wrapping Error.
        name: Reason
        type: string
      - doc: Public is the wire-safe message (string literal at source level).
        name: Public
        type: string
      - doc: Private is the log-only detailed message.
        name: Private
        type: string
      - doc: |-
          ExitCode optionally overrides the POSIX exit status of the wrapping
          Error (default 70 EX_SOFTWARE); the zero value keeps the default. It
          lets a stdlib cause be wrapped into an Error that carries the same
          exit semantics as a sibling errs.Define sentinel — the origin-wins
          path already inherits a cause Error's exit override, but the
          stdlib-cause path has no Error to inherit from.
        name: ExitCode
        type: int
    kind: struct
    name: WrapParams
vars:
  - doc: |-
      Package-level mutable state — all package `var` declarations live in one
      grouped block to keep the static surface easy to audit.

      A structural failure is reported as an *Error built by newValidationError,
      a struct literal: the validator cannot mint its errors through Define, which
      would recurse into it, and it needs no stdlib error either. So this package
      obeys rule 2 like every other one — make guard holds it to SDK002 with no
      exemption.
    grouped: true
    items:
      - doc: |-
          metaCodeAllowed is the whitelist — only these Codes may have Layer == 0.
          Anything else with Layer==0 is rejected by validateCode as structurally
          invalid (Layer=0 reserved for this package's meta-codes per ADR 0005).
        name: metaCodeAllowed
        value: |-
          map[Code]struct{}{
          		CodeInvalidCode:       {},
          		CodeInvalidReason:     {},
          		CodeInvalidPublic:     {},
          		CodeInvalidPrivate:    {},
          		CodeInvalidCodeString: {},
          		CodeInvalidWrapParams: {},
          	}
    name: metaCodeAllowed
