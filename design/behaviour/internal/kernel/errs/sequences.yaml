  - of: codeLen
    steps:
      - return: |-
          octetLen(uint8(c.Major())) + octetLen(uint8(c.Layer())) +
          		octetLen(uint8(c.Package())) + octetLen(uint8(c.Serial())) + codeDotCount
  - of: octetLen
    steps:
      - switch:
          cases:
            - case: octet < padThreshold10
              do:
                - return: "1"
            - case: octet < padThreshold100
              do:
                - return: "2"
            - default: true
              do:
                - return: octetMaxDigits
