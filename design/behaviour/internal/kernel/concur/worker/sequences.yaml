  - of: Every
    participants:
      - id: caller
        kind: actor
      - id: Every
        kind: self
      - id: resolveEvery
        kind: internal
      - id: Start
        kind: internal
    steps:
      - opt:
          do:
            - panic: "\"worker: nil tick\""
