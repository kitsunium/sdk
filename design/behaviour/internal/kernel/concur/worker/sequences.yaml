      - go: |-
          func() {
          		//: guarantee done closes even if the loop returns early or via
          		//: runtime.Goexit; doneOnce keeps the close single + lint-clean.
          		defer ld.doneOnce.Do(func() {
          			//: the loop has returned — release every Stop waiter.
          			close(ld.done)
