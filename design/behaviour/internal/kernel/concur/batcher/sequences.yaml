            bind: ferr
            eval: either(b.deliverBatch(b.life, ready), b.deliverBatch(b.life, batch))
            to: either
          when: ferr != nil
  - of: (*Batcher).weigh
    steps:
      - opt:
          do:
            - return: "1"
          when: b.cfg.WeightOf == nil
      - return: b.cfg.WeightOf(item)
  - of: (*Batcher).full
    steps:
      - bind: countCap
        eval: b.cfg.MaxItems > 0 && len(b.buf) >= b.cfg.MaxItems
      - bind: weightCap
        eval: b.cfg.WeightOf != nil && b.cfg.MaxWeight > 0 && b.weight >= b.cfg.MaxWeight
      - return: countCap || weightCap
