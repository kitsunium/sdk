          cases:
            - comm: <-entry.done
              do:
                - eval: entry.repanic()
                  to: entry.repanic
                - return: entry.val, shared, entry.err
            - comm: <-ctx.Done()
              do:
                - select:
                    cases:
                      - comm: <-entry.done
                        do:
                          - eval: entry.repanic()
                            to: entry.repanic
                          - return: entry.val, shared, entry.err
                      - default: true
                - eval: g.abandon(key, entry)
                  to: g.abandon
                - var:
                    name: zero
                    type: V
                - return: zero, shared, ctx.Err()
  - of: (*Group).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*Group).abandon
        kind: self
      - id: g.mu.Lock
        kind: value
      - id: g.mu.Unlock
        kind: value
