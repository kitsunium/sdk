      - eval: g.mu.Lock()
        to: g.mu.Lock
      - op: "--"
        set: entry.refs
      - bind: orphaned
        eval: entry.refs == 0 && !entry.retired
      - opt:
          do:
            - set: entry.retired
              value: "true"
            - opt:
                do:
                  - eval: delete(g.calls, key)
                when: g.calls[key] == entry
          when: orphaned
      - eval: g.mu.Unlock()
        to: g.mu.Unlock
      - opt:
          do:
            - eval: entry.cancel()
          when: orphaned
