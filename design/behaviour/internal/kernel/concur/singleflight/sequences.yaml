        to: out.WriteString
      - eval: out.WriteString(renderRaised(p.Raised))
        to: out.WriteString
      - eval: out.WriteString("\noriginating goroutine stack:\n")
        to: out.WriteString
      - eval: out.Write(p.Stack)
        to: out.Write
      - return: out.String()
        to: out.String
  - of: renderRaised
    participants:
      - id: caller
        kind: actor
      - id: renderRaised
        kind: self
      - id: typed.Error
        kind: value
      - id: typed.String
        kind: internal
    steps:
      - typeswitch:
          bind: typed
          cases:
            - do:
                - return: typed
              types: string
            - do:
                - return: typed.Error()
                  to: typed.Error
              types: error
            - do:
                - return: typed.String()
                  to: typed.String
              types: interface{ String() string }
          "on": raised
      - return: "\"non-textual panic value (see PanicValue.Raised)\""
  - of: (*Group).Do
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Do
        kind: self
      - id: g.join
        kind: internal
      - id: g.await
        kind: internal
    steps:
      - bind: entry, joined
        eval: g.join(ctx, key, fn)
        to: g.join
      - return: g.await(ctx, key, entry, joined)
        to: g.await
  - of: (*Group).Forget
    steps:
      - lock:
          mutex: g.mu
      - eval: delete(g.calls, key)
  - of: (*Group).InFlight
    steps:
      - lock:
          mutex: g.mu
          read: true
      - return: len(g.calls)
  - of: (*Group).join
    participants:
      - id: caller
        kind: actor
      - id: (*Group).join
        kind: self
      - id: context
        kind: stdlib
      - id: g.run
        kind: internal
    steps:
