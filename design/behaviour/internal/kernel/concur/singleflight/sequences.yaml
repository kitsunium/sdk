          do:
            - set: c.panicked
              to: newPanicValue
              value: newPanicValue(raised)
          init:
            bind: raised
            eval: recover()
          when: raised != nil
  - of: (*call).repanic
    steps:
      - opt:
          do:
            - return: ""
          when: c.panicked == nil
      - panic: "*c.panicked"
  - of: newPanicValue
    steps:
      - return: "&PanicValue{Raised: raised, Stack: debug.Stack()}"
  - of: PanicValue.String
