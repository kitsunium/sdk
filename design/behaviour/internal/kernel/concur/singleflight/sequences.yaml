# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
sequences:
  - of: (*call).capturePanic
    participants:
      - id: caller
        kind: actor
      - id: (*call).capturePanic
        kind: self
      - id: newPanicValue
        kind: internal
    steps:
      - opt:
          do:
            - set: c.panicked
              to: newPanicValue
              value: newPanicValue(raised)
          init:
            bind: raised
            eval: recover()
          when: raised != nil
  - of: (*call).repanic
    steps:
      - opt:
          do:
            - return: ""
          when: c.panicked == nil
      - panic: "*c.panicked"
  - of: (*detached).Deadline
    steps:
      - return: time.Time{}, false
  - of: (*detached).Done
    steps:
      - return: nil
  - of: (*detached).Err
    steps:
      - return: nil
  - of: (*detached).Value
    participants:
      - id: caller
        kind: actor
      - id: (*detached).Value
        kind: self
      - id: d.parent.Value
        kind: value
    steps:
      - return: d.parent.Value(key)
        to: d.parent.Value
  - of: (*detached).String
    steps:
      - opt:
          do:
            - return: named.String() + ".WithoutCancel"
          init:
            bind: named, ok
            eval: d.parent.(interface{ String() string })
          when: ok
      - return: reflect.TypeOf(d.parent).String() + ".WithoutCancel"
  - of: newPanicValue
    steps:
      - return: "&PanicValue{Raised: raised, Stack: debug.Stack()}"
  - of: PanicValue.String
    participants:
      - id: caller
        kind: actor
      - id: PanicValue.String
        kind: self
      - id: out.WriteString
        kind: value
      - id: out.Write
        kind: value
      - id: out.String
        kind: value
    steps:
      - var:
          name: out
          type: strings.Builder
      - eval: "out.WriteString(\"singleflight: panic in deduplicated call: \")"
        to: out.WriteString
      - eval: out.WriteString(renderRaised(p.Raised))
        to: out.WriteString
      - eval: out.WriteString("\noriginating goroutine stack:\n")
        to: out.WriteString
      - eval: out.Write(p.Stack)
        to: out.Write
      - return: out.String()
        to: out.String
  - of: renderRaised
    participants:
      - id: caller
        kind: actor
      - id: renderRaised
        kind: self
      - id: typed.Error
        kind: value
      - id: typed.String
        kind: internal
    steps:
      - typeswitch:
          bind: typed
          cases:
            - do:
                - return: typed
              types: string
            - do:
                - return: typed.Error()
                  to: typed.Error
              types: error
            - do:
                - return: typed.String()
                  to: typed.String
              types: interface{ String() string }
          "on": raised
      - return: "\"non-textual panic value (see PanicValue.Raised)\""
  - of: (*Group).shardOf
    steps:
      - return: "&g.shards[maphash.Comparable(shardSeed, key)&uint64(shardCount-1)]"
  - of: (*Group).Do
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Do
        kind: self
      - id: g.shardOf
        kind: internal
      - id: held.join
        kind: internal
      - id: held.await
        kind: internal
    steps:
      - bind: held
        eval: g.shardOf(key)
        to: g.shardOf
      - bind: entry, joined
        eval: held.join(ctx, key, fn)
        to: held.join
      - return: held.await(ctx, key, entry, joined)
        to: held.await
  - of: (*Group).Forget
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Forget
        kind: self
      - id: g.shardOf
        kind: internal
    steps:
      - bind: held
        eval: g.shardOf(key)
        to: g.shardOf
      - lock:
          mutex: held.mu
      - eval: delete(held.calls, key)
  - of: (*Group).InFlight
    participants:
      - id: caller
        kind: actor
      - id: (*Group).InFlight
        kind: self
      - id: held.mu.Lock
        kind: value
      - id: held.mu.Unlock
        kind: value
    steps:
      - bind: total
        eval: "0"
      - loop:
          do:
            - bind: held
              eval: "&g.shards[at]"
            - eval: held.mu.Lock()
              to: held.mu.Lock
            - op: +=
              set: total
              value: len(held.calls)
            - eval: held.mu.Unlock()
              to: held.mu.Unlock
          key: at
          range: g.shards
      - return: total
  - of: (*shard).join
    participants:
      - id: caller
        kind: actor
      - id: (*shard).join
        kind: self
      - id: s.joinExisting
        kind: internal
      - id: context
        kind: stdlib
      - id: s.insertOrJoin
        kind: internal
      - id: s.run
        kind: internal
    steps:
      - opt:
          do:
            - return: existing, true
          init:
            bind: existing
            eval: s.joinExisting(key)
            to: s.joinExisting
          when: existing != nil
      - opt:
          do:
            - panic: "\"cannot create context from nil parent\""
          when: ctx == nil
      - bind: candidate
        eval: "&call[V]{base: detached{parent: ctx}, done: make(chan struct{}), refs: 1}"
      - bind: callCtx, cancel
        eval: context.WithCancel(&candidate.base)
        to: context
      - set: candidate.cancel
        value: cancel
      - opt:
          do:
            - eval: cancel()
            - return: winner, true
          init:
            bind: winner, inserted
            eval: s.insertOrJoin(key, candidate)
            to: s.insertOrJoin
          when: "!inserted"
      - go: s.run(callCtx, key, candidate, fn)
        to: s.run
      - return: candidate, false
  - of: (*shard).joinExisting
    steps:
      - lock:
          mutex: s.mu
      - bind: existing, found
        eval: s.calls[key]
      - opt:
          do:
            - return: nil
          when: "!found"
      - op: ++
        set: existing.refs
      - return: existing
  - of: (*shard).insertOrJoin
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - op: ++
              set: existing.refs
            - return: existing, false
          init:
            bind: existing, found
            eval: s.calls[key]
          when: found
      - opt:
          do:
            - set: s.calls
              value: make(map[K]*call[V], initialCallsCapacity)
          when: s.calls == nil
      - set: s.calls[key]
        value: candidate
      - return: candidate, true
  - of: (*shard).run
    participants:
      - id: caller
        kind: actor
      - id: (*shard).run
        kind: self
      - id: s.publish
        kind: internal
      - id: entry.capturePanic
        kind: internal
    steps:
      - defer: entry.cancel()
      - defer: s.publish(key, entry)
        to: s.publish
      - defer: entry.capturePanic()
        to: entry.capturePanic
      - set: entry.val, entry.err
        value: fn(ctx)
  - of: (*shard).publish
    participants:
      - id: caller
        kind: actor
      - id: (*shard).publish
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: entry.publishOnce.Do
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - opt:
          do:
            - eval: delete(s.calls, key)
          when: s.calls[key] == entry
      - set: entry.retired
        value: "true"
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: entry.publishOnce.Do(func() { close(entry.done) })
        to: entry.publishOnce.Do
  - of: (*shard).await
    participants:
      - id: caller
        kind: actor
      - id: (*shard).await
        kind: self
      - id: entry.repanic
        kind: internal
      - id: s.abandon
        kind: internal
    steps:
      - select:
          cases:
            - comm: <-entry.done
              do:
                - eval: entry.repanic()
                  to: entry.repanic
                - return: entry.val, shared, entry.err
            - comm: <-ctx.Done()
              do:
                - select:
                    cases:
                      - comm: <-entry.done
                        do:
                          - eval: entry.repanic()
                            to: entry.repanic
                          - return: entry.val, shared, entry.err
                      - default: true
                - eval: s.abandon(key, entry)
                  to: s.abandon
                - var:
                    name: zero
                    type: V
                - return: zero, shared, ctx.Err()
  - of: (*shard).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*shard).abandon
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - op: "--"
        set: entry.refs
      - bind: orphaned
        eval: entry.refs == 0 && !entry.retired
      - opt:
          do:
            - set: entry.retired
              value: "true"
            - opt:
                do:
                  - eval: delete(s.calls, key)
                when: s.calls[key] == entry
          when: orphaned
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - eval: entry.cancel()
          when: orphaned
