      - bind: callCtx, cancel
        eval: context.WithCancel(context.WithoutCancel(ctx))
        to: context
      - bind: fresh
        eval: "&call[V]{done: make(chan struct{}), cancel: cancel, refs: 1}"
      - opt:
          do:
            - set: g.calls
              value: make(map[K]*call[V], initialCallsCapacity)
          when: g.calls == nil
      - set: g.calls[key]
        value: fresh
      - go: g.run(callCtx, key, fresh, fn)
        to: g.run
      - return: fresh, false
  - of: (*Group).run
    participants:
      - id: caller
        kind: actor
      - id: (*Group).run
        kind: self
      - id: g.publish
        kind: internal
      - id: entry.capturePanic
        kind: internal
    steps:
      - defer: entry.cancel()
      - defer: g.publish(key, entry)
        to: g.publish
      - defer: entry.capturePanic()
        to: entry.capturePanic
      - set: entry.val, entry.err
        value: fn(ctx)
  - of: (*Group).publish
    participants:
      - id: caller
        kind: actor
      - id: (*Group).publish
        kind: self
      - id: g.mu.Lock
        kind: value
      - id: g.mu.Unlock
        kind: value
      - id: entry.publishOnce.Do
        kind: value
    steps:
      - eval: g.mu.Lock()
        to: g.mu.Lock
      - opt:
          do:
            - eval: delete(g.calls, key)
          when: g.calls[key] == entry
      - set: entry.retired
        value: "true"
      - eval: g.mu.Unlock()
        to: g.mu.Unlock
      - eval: entry.publishOnce.Do(func() { close(entry.done) })
        to: entry.publishOnce.Do
  - of: (*Group).await
    participants:
      - id: caller
        kind: actor
      - id: (*Group).await
        kind: self
      - id: entry.repanic
        kind: internal
      - id: g.abandon
        kind: internal
