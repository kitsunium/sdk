# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
sequences:
  - of: (*call).capturePanic
    participants:
      - id: caller
        kind: actor
      - id: (*call).capturePanic
        kind: self
      - id: newPanicValue
        kind: internal
    steps:
      - opt:
          do:
            - set: c.panicked
              to: newPanicValue
              value: newPanicValue(raised)
          init:
            bind: raised
            eval: recover()
          when: raised != nil
  - of: (*call).repanic
    steps:
      - opt:
          do:
            - return: ""
          when: c.panicked == nil
      - panic: "*c.panicked"
  - of: (*detached).Deadline
    steps:
      - return: time.Time{}, false
  - of: (*detached).Done
    steps:
      - return: nil
  - of: (*detached).Err
    steps:
      - return: nil
  - of: (*detached).Value
    participants:
      - id: caller
        kind: actor
      - id: (*detached).Value
        kind: self
      - id: d.parent.Value
        kind: value
    steps:
      - return: d.parent.Value(key)
        to: d.parent.Value
  - of: (*detached).String
    steps:
      - opt:
          do:
            - return: named.String() + ".WithoutCancel"
          init:
            bind: named, ok
            eval: d.parent.(interface{ String() string })
          when: ok
      - return: reflect.TypeOf(d.parent).String() + ".WithoutCancel"
  - of: newPanicValue
    steps:
      - return: "&PanicValue{Raised: raised, Stack: debug.Stack()}"
  - of: PanicValue.String
    participants:
      - id: caller
        kind: actor
      - id: PanicValue.String
        kind: self
      - id: out.WriteString
        kind: value
      - id: out.Write
        kind: value
      - id: out.String
        kind: value
    steps:
      - var:
          name: out
          type: strings.Builder
      - eval: "out.WriteString(\"singleflight: panic in deduplicated call: \")"
        to: out.WriteString
      - eval: out.WriteString(renderRaised(p.Raised))
        to: out.WriteString
      - eval: out.WriteString("\noriginating goroutine stack:\n")
        to: out.WriteString
      - eval: out.Write(p.Stack)
        to: out.Write
      - return: out.String()
        to: out.String
  - of: renderRaised
    participants:
      - id: caller
        kind: actor
      - id: renderRaised
        kind: self
      - id: typed.Error
        kind: value
      - id: typed.String
        kind: internal
    steps:
      - typeswitch:
          bind: typed
          cases:
            - do:
                - return: typed
              types: string
            - do:
                - return: typed.Error()
                  to: typed.Error
              types: error
            - do:
                - return: typed.String()
                  to: typed.String
              types: interface{ String() string }
          "on": raised
      - return: "\"non-textual panic value (see PanicValue.Raised)\""
  - of: hashOf
    participants:
      - id: caller
        kind: actor
      - id: hashOf
        kind: self
      - id: maphash
        kind: stdlib
    steps:
      - return: maphash.Comparable(shardSeed, key)
        to: maphash
  - of: (*Group).shardAt
    steps:
      - return: "&g.shards[hash&uint64(shardCount-1)]"
  - of: (*Group).shardOf
    participants:
      - id: caller
        kind: actor
      - id: (*Group).shardOf
        kind: self
      - id: g.shardAt
        kind: internal
    steps:
      - return: g.shardAt(hashOf(key))
        to: g.shardAt
  - of: (*Group).Do
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Do
        kind: self
      - id: maphash
        kind: stdlib
      - id: g.shardAt
        kind: internal
      - id: held.join
        kind: internal
      - id: held.await
        kind: internal
    steps:
      - bind: hash
        eval: maphash.Comparable(shardSeed, key)
        to: maphash
      - bind: held
        eval: g.shardAt(hash)
        to: g.shardAt
      - bind: entry, joined
        eval: held.join(ctx, key, hash, fn)
        to: held.join
      - return: held.await(ctx, entry, joined)
        to: held.await
  - of: (*Group).Forget
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Forget
        kind: self
      - id: g.shardOf
        kind: internal
      - id: held.mu.Lock
        kind: value
      - id: held.unlock
        kind: internal
    steps:
      - bind: held
        eval: g.shardOf(key)
        to: g.shardOf
      - eval: held.mu.Lock()
        to: held.mu.Lock
      - defer: held.unlock()
        to: held.unlock
      - eval: delete(held.calls, key)
  - of: (*Group).InFlight
    participants:
      - id: caller
        kind: actor
      - id: (*Group).InFlight
        kind: self
      - id: g.shards[at].live
        kind: internal
    steps:
      - bind: total
        eval: "0"
      - loop:
          do:
            - op: +=
              set: total
              to: g.shards[at].live
              value: g.shards[at].live()
          key: at
          range: g.shards
      - return: total
  - of: (*shard).live
    participants:
      - id: caller
        kind: actor
      - id: (*shard).live
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.unlock
        kind: internal
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - defer: s.unlock()
        to: s.unlock
      - bind: count
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: count
                when: "!entry.retired.Load()"
          key: _
          range: s.calls
          value: entry
      - return: count
  - of: (*shard).join
    participants:
      - id: caller
        kind: actor
      - id: (*shard).join
        kind: self
      - id: s.joinExisting
        kind: internal
      - id: s.settle
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: existing, true
                init:
                  bind: existing
                  eval: s.joinExisting(key, hash)
                  to: s.joinExisting
                when: existing != nil
          when: s.hotHash.Load() == hash
      - bind: candidate, callCtx
        eval: newCandidate[K, V](ctx, key)
      - return: s.settle(callCtx, candidate, hash, fn)
        to: s.settle
  - of: (*shard).joinExisting
    participants:
      - id: caller
        kind: actor
      - id: (*shard).joinExisting
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.unlock
        kind: internal
      - id: s.follow
        kind: internal
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - defer: s.unlock()
        to: s.unlock
      - bind: existing, found
        eval: s.calls[key]
      - opt:
          do:
            - return: nil
          when: "!found || existing.retired.Load()"
      - eval: s.follow(existing, hash)
        to: s.follow
      - return: existing
  - of: (*shard).follow
    participants:
      - id: caller
        kind: actor
      - id: (*shard).follow
        kind: self
      - id: s.hotHash.Store
        kind: value
    steps:
      - op: ++
        set: entry.refs
      - opt:
          do:
            - eval: s.hotHash.Store(hash)
              to: s.hotHash.Store
          when: s.hotHash.Load() != hash
  - of: newCandidate
    participants:
      - id: caller
        kind: actor
      - id: newCandidate
        kind: self
      - id: context
        kind: stdlib
    steps:
      - opt:
          do:
            - panic: "\"cannot create context from nil parent\""
          when: ctx == nil
      - set: candidate
        value: "&call[K, V]{base: detached{parent: ctx}, done: make(chan struct{}), refs: 1, key: key}"
      - set: callCtx, candidate.cancel
        to: context
        value: context.WithCancel(&candidate.base)
      - return: candidate, callCtx
  - of: (*shard).settle
    participants:
      - id: caller
        kind: actor
      - id: (*shard).settle
        kind: self
      - id: s.insertOrJoin
        kind: internal
      - id: s.run
        kind: internal
    steps:
      - opt:
          do:
            - eval: candidate.cancel()
            - return: winner, true
          init:
            bind: winner, inserted
            eval: s.insertOrJoin(candidate, hash)
            to: s.insertOrJoin
          when: "!inserted"
      - go: s.run(callCtx, candidate, fn)
        to: s.run
      - return: candidate, false
  - of: (*shard).insertOrJoin
    participants:
      - id: caller
        kind: actor
      - id: (*shard).insertOrJoin
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.unlock
        kind: internal
      - id: s.follow
        kind: internal
    steps:
      - bind: key
        eval: candidate.key
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - defer: s.unlock()
        to: s.unlock
      - opt:
          do:
            - eval: s.follow(existing, hash)
              to: s.follow
            - return: existing, false
          init:
            bind: existing, found
            eval: s.calls[key]
          when: found && !existing.retired.Load()
      - opt:
          do:
            - set: s.calls
              value: make(map[K]*call[K, V], initialCallsCapacity)
          when: s.calls == nil
      - set: s.calls[key]
        value: candidate
      - return: candidate, true
  - of: (*shard).unlock
    participants:
      - id: caller
        kind: actor
      - id: (*shard).unlock
        kind: self
      - id: s.drainRetired
        kind: internal
      - id: s.mu.Unlock
        kind: value
    steps:
      - loop:
          do:
            - eval: s.drainRetired()
              to: s.drainRetired
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - opt:
                do:
                  - return: ""
                when: s.retired.Load() == nil || !s.mu.TryLock()
          forever: true
  - of: (*shard).drainRetired
    participants:
      - id: caller
        kind: actor
      - id: (*shard).drainRetired
        kind: self
      - id: s.remove
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: s.retired.Load() == nil
      - loop:
          cond: queued != nil
          do:
            - bind: next
              eval: queued.next
            - set: queued.next
              value: nil
            - eval: s.remove(queued)
              to: s.remove
            - set: queued
              value: next
          init: queued := s.retired.Swap(nil)
  - of: (*shard).remove
    steps:
      - opt:
          do:
            - eval: delete(s.calls, entry.key)
          when: s.calls[entry.key] == entry
  - of: (*shard).run
    participants:
      - id: caller
        kind: actor
      - id: (*shard).run
        kind: self
      - id: s.publish
        kind: internal
      - id: entry.capturePanic
        kind: internal
    steps:
      - defer: entry.cancel()
      - defer: s.publish(entry)
        to: s.publish
      - defer: entry.capturePanic()
        to: entry.capturePanic
      - set: entry.val, entry.err
        value: fn(ctx)
  - of: (*shard).publish
    participants:
      - id: caller
        kind: actor
      - id: (*shard).publish
        kind: self
      - id: s.release
        kind: internal
      - id: entry.publishOnce.Do
        kind: value
    steps:
      - opt:
          do:
            - eval: s.release(entry)
              to: s.release
          when: entry.retired.CompareAndSwap(false, true)
      - eval: entry.publishOnce.Do(func() { close(entry.done) })
        to: entry.publishOnce.Do
  - of: (*shard).release
    participants:
      - id: caller
        kind: actor
      - id: (*shard).release
        kind: self
      - id: s.remove
        kind: internal
      - id: s.unlock
        kind: internal
      - id: s.retired.Load
        kind: value
    steps:
      - opt:
          do:
            - eval: s.remove(entry)
              to: s.remove
            - eval: s.unlock()
              to: s.unlock
            - return: ""
          when: s.mu.TryLock()
      - loop:
          do:
            - bind: head
              eval: s.retired.Load()
              to: s.retired.Load
            - set: entry.next
              value: head
            - opt:
                do:
                  - break: true
                when: s.retired.CompareAndSwap(head, entry)
          forever: true
      - opt:
          do:
            - eval: s.unlock()
              to: s.unlock
          when: s.mu.TryLock()
  - of: (*shard).await
    participants:
      - id: caller
        kind: actor
      - id: (*shard).await
        kind: self
      - id: entry.repanic
        kind: internal
      - id: s.abandon
        kind: internal
    steps:
      - select:
          cases:
            - comm: <-entry.done
              do:
                - eval: entry.repanic()
                  to: entry.repanic
                - return: entry.val, shared, entry.err
            - comm: <-ctx.Done()
              do:
                - select:
                    cases:
                      - comm: <-entry.done
                        do:
                          - eval: entry.repanic()
                            to: entry.repanic
                          - return: entry.val, shared, entry.err
                      - default: true
                - eval: s.abandon(entry)
                  to: s.abandon
                - var:
                    name: zero
                    type: V
                - return: zero, shared, ctx.Err()
  - of: (*shard).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*shard).abandon
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.remove
        kind: internal
      - id: s.unlock
        kind: internal
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - op: "--"
        set: entry.refs
      - bind: orphaned
        eval: entry.refs == 0 && entry.retired.CompareAndSwap(false, true)
      - opt:
          do:
            - eval: s.remove(entry)
              to: s.remove
          when: orphaned
      - eval: s.unlock()
        to: s.unlock
      - opt:
          do:
            - eval: entry.cancel()
          when: orphaned
