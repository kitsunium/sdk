imports:
  context: context
  debug: runtime/debug
  maphash: hash/maphash
  reflect: reflect
  strings: strings
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/concur/singleflight
  name: singleflight
  purpose: Package singleflight — the in-flight call record shared by every caller of one key.
types:
  - doc: |-
      call is one execution of fn, shared by every caller that named its key while
      it was running.

      Every field except base, done and cancel is written by exactly one
      goroutine — the one running fn — and read by the waiters only AFTER
      close(done), which is the happens-before edge that makes the reads
      race-free without a second mutex. refs and retired are the exception: they
      are group bookkeeping and are read and written under the mutex of the shard
      holding the call.
    fields:
      - doc: |-
          base is the shared context's root: the leader's values, none of its
          deadline or cancellation (#813). Written once, before the call is
          published to any other goroutine, and read-only after.
        name: base
        type: detached
      - doc: |-
          done is closed once val/err/panicked are final. Closing rather than
          sending is what lets N waiters observe one result.
        name: done
        type: chan struct{}
      - doc: |-
          publishOnce guards close(done). Only run's defer chain reaches it today,
          but a second close panics and a panicking publish is the one failure
          that leaves every waiter parked on a channel forever — so the guard is
          on the type rather than on a maintainer remembering the invariant.
        name: publishOnce
        type: sync.Once
      - doc: |-
          cancel stops the shared context. It is fired when the last caller
          abandons the call, and again (harmlessly) when fn returns.
        name: cancel
        type: context.CancelFunc
      - doc: refs counts the callers still waiting. Guarded by the shard's mutex.
        name: refs
        type: int
      - doc: |-
          retired records that the call has left the Group's map, so a late
          abandonment cannot delete a key that now belongs to a different call.
          Guarded by the shard's mutex.
        name: retired
        type: bool
      - doc: val and err are fn's outcome.
        name: val
        type: V
      - name: err
        type: error
      - doc: panicked is non-nil when fn panicked; every waiter re-raises it.
        name: panicked
        type: "*PanicValue"
    kind: struct
    methods:
      - doc: |-
          capturePanic is deferred INSIDE the goroutine running fn: recover() only
          reports a panic when called directly by a deferred function of the panicking
          frame, so this cannot be folded into run's own defer chain body.
        name: capturePanic
        recv: c *call[V]
      - doc: |-
          repanic re-raises fn's panic in the calling goroutine. Called only after
          done is closed.
        name: repanic
        recv: c *call[V]
    name: call
    typeParams: V any
  - doc: |-
      detached is the root of a shared call's context: the leader's values and
      none of its deadline or cancellation — what context.WithoutCancel(leader)
      returns, kept inside the call record so that it costs no allocation of its
      own (#813).

      Only the context.WithCancel built over it is ever handed to fn. That one
      finds Done nil here, so it never watches this root, and answers the context
      package's own lookups itself — Cause, a child looking for its parent, the
      private key context.WithoutCancel answers nil to — so none of them reaches
      this root, and delegating every other Value to the leader's context gives
      exactly WithoutCancel's answers. identity_internal_test.go compares the two
      constructions on every observable, against the code before #813 and after.

      Being inside the record, the root keeps the record reachable for as long as
      fn's context is: an fn that hands its context to work outliving the call
      keeps the call's result alive with it, where WithoutCancel kept only the
      leader's context. Nothing a caller reads changes.
    fields:
      - doc: parent is the leader's context, read for its values alone.
        name: parent
        type: context.Context
    kind: struct
    methods:
      - doc: "Deadline reports none: the leader's deadline is not the call's."
        name: Deadline
        recv: "*detached"
        results: deadline time.Time, ok bool
      - doc: |-
          Done is nil: nothing but the Group cancels the call, on the context built
          over this one.
        name: Done
        recv: "*detached"
        results: <-chan struct{}
      - doc: "Err is nil: the root is never cancelled."
        name: Err
        recv: "*detached"
        results: error
      - doc: Value is the leader's value for key.
        name: Value
        params: key any
        recv: d *detached
        results: any
      - doc: |-
          String names the context as context.WithoutCancel's does, so a context
          printed in a log reads as it did before #813.
        name: String
        recv: d *detached
        results: string
    name: detached
  - fields:
      - doc: Raised is the value the original panic carried, verbatim.
        name: Raised
        type: any
      - doc: Stack is the stack of the goroutine that ran fn, captured at recovery.
        name: Stack
        type: "[]byte"
    kind: struct
    methods:
      - name: String
        recv: p PanicValue
        results: string
    name: PanicValue
  - doc: |-
      shard is one of a Group's maps and the mutex guarding it, with every call's
      refs and retired.
    fields:
      - name: mu
        type: sync.Mutex
      - name: calls
        type: map[K]*call[V]
      - name: _
        type: "[shardPad]byte"
    kind: struct
    methods:
      - doc: |-
          join registers this goroutine as a waiter on key's call, starting one if
          none is in flight. joined reports whether the call was already running.

          The critical section holds the map and nothing else (#1035): a follower
          finds the call and counts itself in one acquisition; a leader looks, builds
          its call record and context with the lock released, and takes it again to
          insert — and a candidate that lost the key to another leader in between
          cancels the context it built and joins the winner instead.
        name: join
        params: ctx context.Context, key K, fn func(ctx context.Context) (V, error)
        recv: s *shard[K, V]
        results: entry *call[V], joined bool
      - doc: |-
          joinExisting counts the caller in key's in-flight call and returns it, or
          returns nil when none is in flight.
        name: joinExisting
        params: key K
        recv: s *shard[K, V]
        results: "*call[V]"
      - doc: |-
          insertOrJoin registers candidate under key and reports true, or — when a
          call for key is already in flight — counts the caller in that call and
          returns it with false. One acquisition decides both.
        name: insertOrJoin
        params: key K, candidate *call[V]
        recv: s *shard[K, V]
        results: winner *call[V], inserted bool
      - doc: |-
          run executes fn, publishes its outcome on entry, and retires key. It runs on
          its own goroutine: that is what makes a caller's departure a departure
          rather than a kill.
        name: run
        params: ctx context.Context, key K, entry *call[V], fn func(ctx context.Context) (V, error)
        recv: s *shard[K, V]
      - doc: |-
          publish retires key (so the next Do starts fresh) and wakes every waiter.
          The map entry is dropped BEFORE done is closed so a goroutine arriving in
          between starts a new call instead of joining a finished one.
        name: publish
        params: key K, entry *call[V]
        recv: s *shard[K, V]
      - doc: |-
          await blocks until the result lands or ctx is done.

          A served caller does NOT touch the shard's mutex: publish already retired the
          entry under it, and refs is read only to decide whether an ABANDONING caller
          was the last one — a decision that is moot once the call is retired. Skipping
          the bookkeeping keeps the deduplicated path at one mutex acquisition per
          caller (the join) instead of two.
        name: await
        params: ctx context.Context, key K, entry *call[V], shared bool
        recv: s *shard[K, V]
        results: value V, isShared bool, err error
      - doc: |-
          abandon drops the claim of a caller that gave up. When the LAST such caller
          leaves, the key is retired and the shared context is cancelled: a call whose
          every caller has gone is computing a result nobody will read.
        name: abandon
        params: key K, entry *call[V]
        recv: s *shard[K, V]
    name: shard
    typeParams: K comparable, V any
  - fields:
      - doc: |-
          : a fixed array so the zero Group needs no constructor; each shard builds
          : its map on first use.
        name: shards
        type: "[shardCount]shard[K, V]"
    kind: struct
    methods:
      - doc: shardOf returns the shard key lives in.
        name: shardOf
        params: key K
        recv: g *Group[K, V]
        results: "*shard[K, V]"
      - name: Do
        params: ctx context.Context, key K, fn func(ctx context.Context) (V, error)
        recv: g *Group[K, V]
        results: value V, shared bool, err error
      - name: Forget
        params: key K
        recv: g *Group[K, V]
      - name: InFlight
        recv: g *Group[K, V]
        results: int
    name: Group
    typeParams: K comparable, V any
vars:
  - doc: |-
      shardSeed keys the hash that picks a key's shard. One seed per process:
      drawn at start, so no input can be crafted to land every key in one shard.
    items:
      - name: shardSeed
        value: maphash.MakeSeed()
    name: shardSeed
