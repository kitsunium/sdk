package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/concur/singleflight
  name: singleflight
  purpose: Package singleflight — the in-flight call record shared by every caller of one key.
types:
  - doc: |-
      call is one execution of fn, shared by every caller that named its key while
      it was running.

      Every field except done and cancel is written by exactly one goroutine — the
      one running fn — and read by the waiters only AFTER close(done), which is
      the happens-before edge that makes the reads race-free without a second
      mutex. refs and retired are the exception: they are group bookkeeping and
      are read and written under Group.mu.
    fields:
      - doc: |-
          done is closed once val/err/panicked are final. Closing rather than
          sending is what lets N waiters observe one result.
        name: done
        type: chan struct{}
      - doc: |-
          publishOnce guards close(done). Only run's defer chain reaches it today,
          but a second close panics and a panicking publish is the one failure
          that leaves every waiter parked on a channel forever — so the guard is
          on the type rather than on a maintainer remembering the invariant.
        name: publishOnce
        type: sync.Once
      - doc: |-
          cancel stops the shared context. It is fired when the last caller
          abandons the call, and again (harmlessly) when fn returns.
        name: cancel
        type: context.CancelFunc
      - doc: refs counts the callers still waiting. Guarded by Group.mu.
        name: refs
        type: int
      - doc: |-
          retired records that the call has left the Group's map, so a late
          abandonment cannot delete a key that now belongs to a different call.
          Guarded by Group.mu.
        name: retired
        type: bool
      - doc: val and err are fn's outcome.
        name: val
        type: V
      - name: err
        type: error
      - doc: panicked is non-nil when fn panicked; every waiter re-raises it.
        name: panicked
        type: "*PanicValue"
    kind: struct
    methods:
      - doc: |-
          capturePanic is deferred INSIDE the goroutine running fn: recover() only
          reports a panic when called directly by a deferred function of the panicking
          frame, so this cannot be folded into run's own defer chain body.
        name: capturePanic
        recv: c *call[V]
      - doc: |-
          repanic re-raises fn's panic in the calling goroutine. Called only after
          done is closed.
        name: repanic
        recv: c *call[V]
    name: call
    typeParams: V any
  - fields:
      - doc: Raised is the value the original panic carried, verbatim.
        name: Raised
        type: any
      - doc: Stack is the stack of the goroutine that ran fn, captured at recovery.
        name: Stack
        type: "[]byte"
    kind: struct
    methods:
      - name: String
        recv: p PanicValue
        results: string
    name: PanicValue
  - fields:
      - doc: |-
          : RWMutex rather than Mutex only for InFlight, the one read-only path;
          : every other method mutates the map or a refcount and takes Lock.
        name: mu
        type: sync.RWMutex
      - name: calls
        type: map[K]*call[V]
    kind: struct
    methods:
      - name: Do
        params: ctx context.Context, key K, fn func(ctx context.Context) (V, error)
        recv: g *Group[K, V]
        results: value V, shared bool, err error
      - name: Forget
        params: key K
        recv: g *Group[K, V]
      - name: InFlight
        recv: g *Group[K, V]
        results: int
      - doc: |-
          join registers this goroutine as a waiter on key's call, starting one if
          none is in flight. joined reports whether the call was already running.
        name: join
        params: ctx context.Context, key K, fn func(ctx context.Context) (V, error)
        recv: g *Group[K, V]
        results: entry *call[V], joined bool
      - doc: |-
          run executes fn, publishes its outcome on entry, and retires key. It runs on
          its own goroutine: that is what makes a caller's departure a departure
          rather than a kill.
        name: run
        params: ctx context.Context, key K, entry *call[V], fn func(ctx context.Context) (V, error)
        recv: g *Group[K, V]
      - doc: |-
          publish retires key (so the next Do starts fresh) and wakes every waiter.
          The map entry is dropped BEFORE done is closed so a goroutine arriving in
          between starts a new call instead of joining a finished one.
        name: publish
        params: key K, entry *call[V]
        recv: g *Group[K, V]
      - doc: |-
          await blocks until the result lands or ctx is done.

          A served caller does NOT touch the group mutex: publish already retired the
          entry under it, and refs is read only to decide whether an ABANDONING caller
          was the last one — a decision that is moot once the call is retired. Skipping
          the bookkeeping keeps the deduplicated path at one mutex acquisition per
          caller (the join) instead of two.
        name: await
        params: ctx context.Context, key K, entry *call[V], shared bool
        recv: g *Group[K, V]
        results: value V, isShared bool, err error
      - doc: |-
          abandon drops the claim of a caller that gave up. When the LAST such caller
          leaves, the key is retired and the shared context is cancelled: a call whose
          every caller has gone is computing a result nobody will read.
        name: abandon
        params: key K, entry *call[V]
        recv: g *Group[K, V]
    name: Group
    typeParams: K comparable, V any
