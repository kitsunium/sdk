imports:
  atomic: sync/atomic
  context: context
  debug: runtime/debug
  maphash: hash/maphash
  reflect: reflect
  strings: strings
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/concur/singleflight
  name: singleflight
  purpose: Package singleflight — the in-flight call record shared by every caller of one key.
types:
  - doc: |-
      call is one execution of fn, shared by every caller that named its key while
      it was running.

      Every field except base, done, cancel, key and next is written by exactly
      one goroutine — the one running fn — and read by the waiters only AFTER
      close(done), which is the happens-before edge that makes the reads
      race-free without a second mutex. refs, retired and next are the
      exception: they are group bookkeeping, refs read and written under the
      mutex of the shard holding the call, retired an atomic so publish can set
      it without that mutex, next written before the call is queued and read by
      the shard's lock holder that drains the queue (#1035).
    fields:
      - doc: |-
          base is the shared context's root: the leader's values, none of its
          deadline or cancellation (#813). Written once, before the call is
          published to any other goroutine, and read-only after.
        name: base
        type: detached
      - doc: |-
          done is closed once val/err/panicked are final. Closing rather than
          sending is what lets N waiters observe one result.
        name: done
        type: chan struct{}
      - doc: |-
          cancel stops the shared context. It is fired when the last caller
          abandons the call, and again (harmlessly) when fn returns.
        name: cancel
        type: context.CancelFunc
      - doc: |-
          next links the call into its shard's queue of retired calls whose map
          entry is still to be removed: publish queues it when another goroutine
          holds the shard's mutex, and the holder removes it (#1035).
        name: next
        type: "*call[K, V]"
      - doc: panicked is non-nil when fn panicked; every waiter re-raises it.
        name: panicked
        type: "*PanicValue"
      - doc: refs counts the callers still waiting. Guarded by the shard's mutex.
        name: refs
        type: int
      - doc: |-
          publishOnce guards close(done). Only run's defer chain reaches it today,
          but a second close panics and a panicking publish is the one failure
          that leaves every waiter parked on a channel forever — so the guard is
          on the type rather than on a maintainer remembering the invariant.
        name: publishOnce
        type: sync.Once
      - doc: |-
          retired records that the call is over for the Group: a caller finding
          it in the map treats the key as absent and starts a new call, and a
          late abandonment cannot delete a key that now belongs to a different
          call. Set once, by whichever of publish and the last abandonment comes
          first, without the shard's mutex for publish (#1035).
        name: retired
        type: atomic.Bool
      - doc: |-
          key is the key the call runs for, read by whoever removes its map
          entry once it is retired.
        name: key
        type: K
      - doc: val and err are fn's outcome.
        name: val
        type: V
      - name: err
        type: error
    kind: struct
    methods:
      - doc: |-
          capturePanic is deferred INSIDE the goroutine running fn: recover() only
          reports a panic when called directly by a deferred function of the panicking
          frame, so this cannot be folded into run's own defer chain body.
        name: capturePanic
        recv: c *call[K, V]
      - doc: |-
          repanic re-raises fn's panic in the calling goroutine. Called only after
          done is closed.
        name: repanic
        recv: c *call[K, V]
    name: call
    typeParams: K comparable, V any
  - doc: |-
      detached is the root of a shared call's context: the leader's values and
      none of its deadline or cancellation — what context.WithoutCancel(leader)
      returns, kept inside the call record so that it costs no allocation of its
      own (#813).

      Only the context.WithCancel built over it is ever handed to fn. That one
      finds Done nil here, so it never watches this root, and answers the context
      package's own lookups itself — Cause, a child looking for its parent, the
      private key context.WithoutCancel answers nil to — so none of them reaches
      this root, and delegating every other Value to the leader's context gives
      exactly WithoutCancel's answers. identity_internal_test.go compares the two
      constructions on every observable, against the code before #813 and after.

      Being inside the record, the root keeps the record reachable for as long as
      fn's context is: an fn that hands its context to work outliving the call
      keeps the call's result alive with it, where WithoutCancel kept only the
      leader's context. Nothing a caller reads changes.
    fields:
      - doc: parent is the leader's context, read for its values alone.
        name: parent
        type: context.Context
    kind: struct
    methods:
      - doc: "Deadline reports none: the leader's deadline is not the call's."
        name: Deadline
        recv: "*detached"
        results: deadline time.Time, ok bool
      - doc: |-
          Done is nil: nothing but the Group cancels the call, on the context built
          over this one.
        name: Done
        recv: "*detached"
        results: <-chan struct{}
      - doc: "Err is nil: the root is never cancelled."
        name: Err
        recv: "*detached"
        results: error
      - doc: Value is the leader's value for key.
        name: Value
        params: key any
        recv: d *detached
        results: any
      - doc: |-
          String names the context as context.WithoutCancel's does, so a context
          printed in a log reads as it did before #813.
        name: String
        recv: d *detached
        results: string
    name: detached
  - fields:
      - doc: Raised is the value the original panic carried, verbatim.
        name: Raised
        type: any
      - doc: Stack is the stack of the goroutine that ran fn, captured at recovery.
        name: Stack
        type: "[]byte"
    kind: struct
    methods:
      - name: String
        recv: p PanicValue
        results: string
    name: PanicValue
  - doc: |-
      shard is one of a Group's maps and the mutex guarding it, with every call's
      refs, and the queue of retired calls whose entry is still in the map.
    fields:
      - name: mu
        type: sync.Mutex
      - name: calls
        type: map[K]*call[K, V]
      - doc: |-
          : the calls publish retired while another goroutine held mu, linked by
          : their next field: whoever holds mu removes their entries before
          : releasing it (see unlock), so publish never waits for the lock.
        name: retired
        type: atomic.Pointer[call[K, V]]
      - name: _
        type: "[shardPad]byte"
      - doc: |-
          : the hash of the latest key whose call gained a follower: read without
          : the lock, it tells a caller whether a first look may find its key in
          : flight. A number, so it keeps no call alive; on a line of its own,
          : written only when the hot key changes, so the callers of keys nobody
          : shares read it from their own cache rather than from the line the
          : mutex moves between them.
        name: hotHash
        type: atomic.Uint64
      - name: _
        type: "[hintPad]byte"
    kind: struct
    methods:
      - doc: |-
          live counts the shard's calls a new Do would join: its entries, less the
          retired ones still waiting for their removal.
        name: live
        recv: s *shard[K, V]
        results: int
      - doc: |-
          join registers this goroutine as a waiter on key's call, starting one if
          none is in flight. joined reports whether the call was already running.

          The critical section holds the map and nothing else (#1035). A caller whose
          key hashes as the shard's hot key — the latest whose call gained a follower
          — looks first and joins the call in flight in that one acquisition,
          building nothing. Every other caller builds a candidate, the call record
          and its context, with the lock released, and one acquisition either
          inserts it or counts the caller in the call that got there first. Only the
          leader of a hot key, whose first look found nothing, takes the lock twice.
          hash is key's hashOf.
        name: join
        params: ctx context.Context, key K, hash uint64, fn func(ctx context.Context) (V, error)
        recv: s *shard[K, V]
        results: entry *call[K, V], joined bool
      - doc: |-
          joinExisting counts the caller in key's in-flight call and returns it, or
          returns nil when none is in flight.
        name: joinExisting
        params: key K, hash uint64
        recv: s *shard[K, V]
        results: "*call[K, V]"
      - doc: |-
          follow counts one more waiter in entry, with s.mu held, and makes its key,
          of hash hash, the shard's hot key: a key whose call gained a follower is
          likely to gain more, and the next ones then look before building anything.
        name: follow
        params: entry *call[K, V], hash uint64
        recv: s *shard[K, V]
      - doc: |-
          settle inserts candidate under its key and starts its fn under callCtx, or
          joins the call already in flight for that key — one acquisition decides. A
          candidate that lost the key cancels the context it built and joins the
          winner: its fn never runs. hash is the key's hashOf.

          Goroutine lifecycle: a winning candidate's fn runs on a goroutine started
          here, with no lock held, and that goroutine ends when fn returns or panics,
          once run has published the outcome and cancelled callCtx.
        name: settle
        params: callCtx context.Context, candidate *call[K, V], hash uint64, fn func(ctx context.Context) (V, error)
        recv: s *shard[K, V]
        results: entry *call[K, V], joined bool
      - doc: |-
          insertOrJoin registers candidate under key and reports true, or — when a
          call for key is already in flight — counts the caller in that call and
          returns it with false. One acquisition decides both. A retired call still
          in the map is not in flight: the candidate takes its place, so a newcomer
          starts a new call rather than joining a finished one.
        name: insertOrJoin
        params: candidate *call[K, V], hash uint64
        recv: s *shard[K, V]
        results: winner *call[K, V], inserted bool
      - doc: |-
          unlock releases s.mu, first removing the entries of the calls publish
          queued while it was held. A publish that queued its call after the drain
          found the lock taken, so the call is drained by whoever releases the lock
          after it — this goroutine, which looks once more once it has released it,
          or the goroutine that took the lock in between.
        name: unlock
        recv: s *shard[K, V]
      - doc: |-
          drainRetired removes, with s.mu held, the map entry of every call queued
          on s.retired whose key it still holds.
        name: drainRetired
        recv: s *shard[K, V]
      - doc: |-
          remove deletes entry's map entry, with s.mu held, unless its key now
          belongs to another call — Forget, an abandoned predecessor's successor or a
          newcomer that found it retired may have replaced it.
        name: remove
        params: entry *call[K, V]
        recv: s *shard[K, V]
      - doc: |-
          run executes fn, publishes its outcome on entry, and retires its key. It
          runs on its own goroutine: that is what makes a caller's departure a
          departure rather than a kill.
        name: run
        params: ctx context.Context, entry *call[K, V], fn func(ctx context.Context) (V, error)
        recv: s *shard[K, V]
      - doc: |-
          publish retires the call (so the next Do on its key starts fresh) and wakes
          every waiter. The call is retired BEFORE done is closed so a goroutine
          arriving in between starts a new call instead of joining a finished one.

          It never waits for the shard's mutex (#1035): retired is an atomic, which a
          newcomer reads as the key's absence, and the map entry is removed now when
          the lock is free, or by the goroutine holding it otherwise.
        name: publish
        params: entry *call[K, V]
        recv: s *shard[K, V]
      - doc: |-
          release removes a retired call's map entry without waiting for s.mu: at
          once when the lock is free, else by queueing the call for the goroutine
          holding it.
        name: release
        params: entry *call[K, V]
        recv: s *shard[K, V]
      - doc: |-
          await blocks until the result lands or ctx is done.

          A served caller does NOT touch the shard's mutex: publish already retired the
          entry under it, and refs is read only to decide whether an ABANDONING caller
          was the last one — a decision that is moot once the call is retired. Skipping
          the bookkeeping keeps the deduplicated path at one mutex acquisition per
          caller (the join) instead of two.
        name: await
        params: ctx context.Context, entry *call[K, V], shared bool
        recv: s *shard[K, V]
        results: value V, isShared bool, err error
      - doc: |-
          abandon drops the claim of a caller that gave up. When the LAST such caller
          leaves, the key is retired and the shared context is cancelled: a call whose
          every caller has gone is computing a result nobody will read.
        name: abandon
        params: entry *call[K, V]
        recv: s *shard[K, V]
    name: shard
    typeParams: K comparable, V any
  - fields:
      - doc: |-
          : a fixed array so the zero Group needs no constructor; each shard builds
          : its map on first use.
        name: shards
        type: "[shardCount]shard[K, V]"
    kind: struct
    methods:
      - doc: shardAt returns the shard a key of hash lives in.
        name: shardAt
        params: hash uint64
        recv: g *Group[K, V]
        results: "*shard[K, V]"
      - doc: shardOf returns the shard key lives in.
        name: shardOf
        params: key K
        recv: g *Group[K, V]
        results: "*shard[K, V]"
      - name: Do
        params: ctx context.Context, key K, fn func(ctx context.Context) (V, error)
        recv: g *Group[K, V]
        results: value V, shared bool, err error
      - name: Forget
        params: key K
        recv: g *Group[K, V]
      - name: InFlight
        recv: g *Group[K, V]
        results: int
    name: Group
    typeParams: K comparable, V any
vars:
  - doc: |-
      shardSeed keys the hash that picks a key's shard. One seed per process:
      drawn at start, so no input can be crafted to land every key in one shard.
    items:
      - name: shardSeed
        value: maphash.MakeSeed()
    name: shardSeed
