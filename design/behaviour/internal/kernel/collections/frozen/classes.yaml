        results: int
      - name: All
        recv: d *Dict
        results: iter.Seq2[string, string]
      - name: AppendBinary
        params: b []byte
        recv: d *Dict
        results: "[]byte, error"
      - name: MarshalBinary
        recv: d *Dict
        results: "[]byte, error"
    name: Dict
  - doc: |-
      plan is a solved hash function over n keys: the seed, the pilots, the remap of
      the slots past n, and where each input key landed.
    fields:
      - name: seed
        type: uint64
      - name: "n"
        type: uint32
      - name: nb
        type: uint32
      - name: m
        type: uint32
      - name: pilots
        type: "[]byte"
      - name: remap
        type: "[]uint32"
      - name: pos
        type: "[]uint32"
      - name: hs
        type: "[]uint64"
    kind: struct
    name: plan
  - doc: verdict is how one seed's search ended.
    kind: named
    name: verdict
    underlying: uint8
  - doc: search is one seed's placement state.
    fields:
      - name: hs
        type: "[]uint64"
      - name: "n"
        type: uint32
      - name: m
        type: uint32
      - name: nb
        type: uint32
      - name: start
        type: "[]uint32"
      - name: keys
        type: "[]uint32"
      - name: bh
        type: "[]uint64"
      - name: owner
        type: "[]uint32"
      - name: taken
        type: "[]uint64"
      - name: pilot
        type: "[]byte"
      - name: recent
        type: "[recentEvicted]uint32"
      - name: next
        type: int
      - name: stack
        type: "[]uint32"
      - name: buf
