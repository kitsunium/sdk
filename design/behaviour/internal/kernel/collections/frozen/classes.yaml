  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/collections/frozen
  name: frozen
  purpose: "Package frozen provides read-only maps built once from a known key set and read in place: Map (integer keys, integer values), StringMap (string keys, integer values) and Dict (string keys, string values)."
types:
