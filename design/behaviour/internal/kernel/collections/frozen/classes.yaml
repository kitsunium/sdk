    kind: struct
    methods:
      - doc: bucket returns the hashes of bucket b's keys.
        name: bucket
        params: b uint32
        recv: s *search
        results: "[]uint64"
      - doc: |-
          run places every bucket, the largest first, evicting when a bucket finds no
          free pilot.
        name: run
        params: same func(i, j int) bool
        recv: s *search
        results: verdict, int
      - doc: |-
          collisions finds two keys of one hash, which share every slot under every
          pilot: equal keys are a duplicate, different ones need another seed.
        name: collisions
        params: same func(i, j int) bool
        recv: s *search
        results: verdict, int
      - doc: |-
          bySize lists the non-empty buckets, the largest first and in index order
          within one size, by a counting sort.
        name: bySize
        recv: s *search
        results: "[]uint32"
      - doc: |-
          slots writes the slots bucket b's keys take under pilot p into s.buf and
          reports false when two of them collide.
        name: slots
        params: b uint32, p byte
        recv: s *search
        results: bool
      - doc: take gives bucket b pilot p and its slots, which s.buf holds.
        name: take
        params: b uint32, p byte
        recv: s *search
      - doc: free releases slot x.
        name: free
        params: x uint32
        recv: s *search
      - doc: |-
          placeFree gives bucket b the first pilot whose slots are all free. Each
          pilot stops at its first taken slot, which at a high load is almost always
          its first key's.
        name: placeFree
        params: b uint32
        recv: s *search
        results: bool
      - doc: |-
          placeEvicting gives bucket b the pilot whose taken slots belong to the
          cheapest set of buckets — the sum of their sizes squared — never one placed by
          a recent eviction, evicts those buckets onto the stack, and takes the slots.
        name: placeEvicting
        params: b uint32
        recv: s *search
        results: bool
      - doc: |-
          cost prices evicting the owners of the slots s.buf holds: false when one of
          them was placed by a recent eviction.
        name: cost
        recv: s *search
        results: uint64, bool
      - doc: evict frees bucket c's slots and pushes it to be placed again.
        name: evict
        params: c uint32
        recv: s *search
      - doc: |-
          finish remaps the taken slots past n onto the free ones below it and records
          where every key landed.
        name: finish
        params: seed uint64
        recv: s *search
        results: plan
    name: search
  - doc: |-
      shape is what a table holds: its kind, the widths of its integer keys and
      values in bytes (0 for strings), and whether each is signed.
    fields:
      - name: kind
        type: byte
      - name: kw
        type: byte
      - name: vw
        type: byte
      - name: signs
        type: byte
    kind: struct
    methods:
      - doc: |-
          stride is a record's size: an integer key and its value, or a string
          entry's offset.
        name: stride
        recv: s shape
        results: uint32
      - doc: |-
          head is the size of a string entry's head: the key's length and, in a Dict,
          the value's.
        name: head
        recv: s shape
        results: uint32
    name: shape
  - doc: |-
      table is a built or loaded image, read in place: every section is a slice of
      it, so a table holds the same few pointers whatever its size and the
      collector scans none of its bytes.
    fields:
      - name: image
        type: "[]byte"
      - name: pilots
        type: "[]byte"
      - name: tags
        type: "[]byte"
      - name: remap
        type: "[]byte"
      - name: recs
        type: "[]byte"
      - name: blob
        type: string
      - name: seed
        type: uint64
      - name: "n"
        type: uint32
      - name: nb
        type: uint32
      - name: m
        type: uint32
      - name: stride
        type: uint32
      - name: kmask
        type: uint64
      - name: shape
        type: shape
    kind: struct
    methods:
      - doc: |-
          verify walks the body: every remapped slot is below n, every string lies in
          the blob, and every record's key hashes to that record's own slot — which
          also proves no two records hold one key.
        name: verify
        recv: t *table
        results: error
      - doc: |-
          checkEntry returns the key of the string entry at off when the entry — its
          head, its key and its value — lies within the blob.
        name: checkEntry
        params: off uint32
        recv: t *table
        results: string, bool
      - doc: |-
          appendTo appends t's image to b; the zero table's is the image of an empty
          table of shape s.
        name: appendTo
        params: b []byte, s shape
        recv: t *table
        results: "[]byte"
      - doc: |-
          slot is the slot of the key whose hash is h: its bucket's pilot, then the
          remap when the slot falls past n.
        name: slot
        params: h uint64
        recv: t *table
        results: uint32
      - doc: |-
          findInt returns the record of integer key k, read as its type's uint64. A
          record's offset is computed in 64 bits: n records of 16 bytes pass 4 GiB
          long before n reaches the slots' 32 bits.
        name: findInt
        params: k uint64
        recv: t *table
        results: uint64, bool
      - doc: findString returns the blob offset of string key k's entry.
        name: findString
        params: k string
        recv: t *table
        results: uint32, bool
      - doc: intKey is record r's integer key.
        name: intKey
        params: r uint64
        recv: t *table
        results: uint64
      - doc: intValue is record r's integer value, which follows its key.
        name: intValue
        params: r uint64
        recv: t *table
        results: uint64
      - doc: entry is the blob offset of slot x's string entry.
        name: entry
        params: x uint32
        recv: t *table
        results: uint32
      - doc: stringKey is the key of the string entry at off.
        name: stringKey
        params: off uint32
        recv: t *table
        results: string
      - doc: entryValue is the integer value of the string entry at off, after its key.
        name: entryValue
        params: off uint32
        recv: t *table
        results: uint64
      - doc: textValue is the string value of the Dict entry at off, after its key.
        name: textValue
        params: off uint32
        recv: t *table
        results: string
      - doc: view points t's sections into image, whose header says the layout l.
        name: view
        params: image []byte, l layout
        recv: t *table
    name: table
  - doc: |-
      layout is where an image's sections start, and its size, computed in 64
      bits so no header can overflow it.
    fields:
      - name: tags
        type: uint64
      - name: remap
        type: uint64
      - name: recs
        type: uint64
      - name: blob
        type: uint64
      - name: size
        type: uint64
    kind: struct
    name: layout
vars:
  - doc: dictShape is the shape of a Dict.
    items:
      - name: dictShape
        value: "shape{kind: kindText}"
    name: dictShape
  - grouped: true
    items:
      - doc: castagnoli is CRC32C's table, which the platform's instruction computes.
        name: castagnoli
        value: crc32.MakeTable(crc32.Castagnoli)
      - doc: |-
          le is the image's byte order: every integer of an image is
          little-endian, whatever the platform's.
        name: le
        value: binary.LittleEndian
    name: castagnoli
