functions:
  - doc: |-
      build solves the hash function of ks's keys and writes the image of shape
      s, each key's record in slot order so the blob is in the records' order.
    name: build
    params: s shape, ks keySet
    results: table, error
  - doc: |-
      widthOf is T's size in bytes and whether it is signed, found by shifting a
      one out of it.
    name: widthOf
    results: byte, bool
    typeParams: T Integer
  - doc: signs packs the two signedness flags of a shape.
    name: signs
    params: key, value bool
    results: byte
  - doc: lengths refuses keys and values of different lengths.
    name: lengths
    params: keys, values int
    results: error
  - doc: origin builds a fresh error on its own sentinel, with fields.
    name: origin
    params: sentinel *errs.Error, fields ...errs.FieldValue
    results: error
  - doc: |-
      fold multiplies a by b into 128 bits and folds the halves together: every
      bit of either input reaches the middle of the result, which is the whole
      mixing step of both hashes.
    name: fold
    params: a, b uint64
    results: uint64
  - doc: |-
      below maps x onto [0, n) by the high half of x*n — a range reduction with no
      division, uniform when x is.
    name: below
    params: x uint64, n uint32
    results: uint32
  - doc: |-
      hashInt hashes an integer key, read as the uint64 its type converts to, under
      seed: the seed XORed in, then Stafford's thirteenth 64-bit finalizer (the
      one SplitMix64 ends with). It is a bijection, so two integer keys never share
      a hash. One folded multiply was measured too weak for it: on the keys 0 to
      200 000 its hashes kept the inputs' structure and a build took two minutes
      instead of 40 ms.
    name: hashInt
    params: seed, k uint64
    results: uint64
  - doc: |-
      load64 reads s[i:i+8] little-endian. The one slice of eight bytes is the
      only bounds check: the compiler then knows every index below it is in range,
      and merges the byte loads into one.
    name: load64
    params: s string, i int
    results: uint64
  - doc: load32 reads s[i:i+4] little-endian, with load64's one bounds check.
    name: load32
    params: s string, i int
    results: uint64
  - doc: |-
      hashString hashes a string key under seed: sixteen bytes per folded
      multiply, the tail read as two overlapping words so no byte is read twice
      into the same lane and none is skipped.
    name: hashString
    params: seed uint64, s string
    results: uint64
  - doc: |-
      slotOf is where a key whose hash is h lands under pilot p, in a table of m
      slots: the pilot's multiple is XORed in and the product's high half reduced.
    name: slotOf
    params: h uint64, p byte, m uint32
    results: uint32
  - doc: corrupt is the error of an image that is not one, for why.
    name: corrupt
    params: why string
    results: error
  - doc: |-
      load reads image as a table of shape want, verifying it under check; the
      table reads image in place, so the caller keeps it alive and unchanged.
    name: load
    params: image []byte, want shape, check Check
    results: table, error
  - doc: |-
      sizes refuses counts no build writes: buckets without keys or keys without
      buckets, fewer slots than keys, or more keys than a table holds.
    name: sizes
    params: t *table
    results: error
  - doc: mapShape is the shape of a Map[K, V].
    name: mapShape
    results: shape
    typeParams: K, V Integer
  - name: NewMap
    params: keys []K, values []V
    results: "*Map[K, V], error"
    typeParams: K, V Integer
  - name: LoadMap
    params: image []byte, check Check
    results: "*Map[K, V], error"
    typeParams: K, V Integer
  - doc: stringMapShape is the shape of a StringMap[V].
    name: stringMapShape
    results: shape
    typeParams: V Integer
  - name: NewStringMap
    params: keys []string, values []V
    results: "*StringMap[V], error"
    typeParams: V Integer
  - name: LoadStringMap
    params: image []byte, check Check
    results: "*StringMap[V], error"
    typeParams: V Integer
  - name: NewDict
    params: keys, values []string
    results: "*Dict, error"
  - name: LoadDict
    params: image []byte, check Check
    results: "*Dict, error"
  - doc: |-
      totalLen is the bytes of every key and value, in 64 bits so the sum of a
      huge input does not wrap.
    name: totalLen
    params: keys, values []string
    results: uint64
  - doc: |-
      head writes a string entry's key length and bytes at blob, returning the
      offset past the key.
    name: head
    params: blob []byte, key string, hs uint32
    results: uint32
  - doc: |-
      seedAt is the seed of attempt a: a fixed sequence, so a build is a function
      of its key set alone and its image is reproducible.
    name: seedAt
    params: a int
    results: uint64
  - doc: |-
      solve finds a minimal perfect hash function for n keys, hash(seed, i) being
      key i's hash under seed and same(i, j) whether keys i and j are equal. It
      reports the index of a duplicated key with ok false and dup >= 0, or ok false
      and dup < 0 when no seed worked.
    name: solve
    params: n int, hash func(seed uint64, i int) uint64, same func(i, j int) bool
    results: p plan, dup int, ok bool
  - doc: newSearch sizes the table and sorts the keys into their buckets.
    name: newSearch
    params: hs []uint64
    results: "*search"
  - doc: loadw reads a w-byte little-endian integer at b[0:w], zero-extended.
    name: loadw
    params: b []byte, w byte
    results: uint64
  - doc: storew writes the low w bytes of v at b[0:w].
    name: storew
    params: b []byte, w byte, v uint64
  - doc: mask is the low w bytes set.
    name: mask
    params: w byte
    results: uint64
  - doc: pad4 rounds x up to a multiple of four.
    name: pad4
    params: x uint64
    results: uint64
  - doc: |-
      layoutOf places the sections of a table of n records, nb buckets, m slots
      and a blob of blob bytes.
    name: layoutOf
    params: s shape, n, nb, m uint32, blob uint64
    results: layout
  - doc: writeHeader fills image's header for t's fields and seals both CRCs.
    name: writeHeader
    params: image []byte, t *table
  - doc: |-
      stringOf returns b's bytes as a string without copying them: the one use of
      unsafe in the package. A table's blob is a slice of its image, and a string
      over it is what lets Get compare a key and return a Dict value with no
      allocation. It is sound because nothing writes to an image once a table views
      it — a built table owns its image and never writes it again, and Load's
      contract makes the caller keep its bytes unchanged for as long as the table
      lives.
    name: stringOf
    params: b []byte
    results: string
