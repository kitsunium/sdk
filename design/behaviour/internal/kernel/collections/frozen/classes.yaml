apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxKeys is the most keys a table holds: its slots, n·100/α of them, are
      counted in a uint32.
    items:
      - name: maxKeys
        type: uint64
        value: math.MaxUint32 / percent * loadPercent
    name: maxKeys
  - doc: |-
      The odd multipliers the hashes and the slot function fold with. Any odd
      64-bit constant with its bits spread works; these are the golden ratio's
      and two of its neighbours, fixed forever because an image stores hashes'
      consequences (its pilots) and is read by a later build.
    grouped: true
    items:
      - name: mulA
        type: uint64
        value: "0x9E3779B97F4A7C15"
      - name: mulB
        type: uint64
        value: "0xD6E8FEB86659FD93"
      - name: mulC
        type: uint64
        value: "0xC2B2AE3D27D4EB4F"
    name: mulA
  - grouped: true
    items:
      - doc: |-
          CheckHeader verifies the header alone — its magic, CRC-32C, version,
          shape, and that its sizes add up to the image's length — in constant
          time. It is for bytes the caller wrote itself and kept intact: a body
          damaged after the header was sealed is not detected, and a Get on it may
          return a wrong answer or panic.
        name: CheckHeader
        type: Check
        value: iota
      - doc: |-
          CheckAll verifies the header, then the body's CRC-32C, every remapped
          slot, every string's bounds, every tag, and that every key leads back to
          its own slot — in time linear in the image. A table loaded under it
          never panics and finds every key it holds: it is the mode for bytes from
          anywhere else.
        name: CheckAll
    name: CheckHeader
  - doc: The shape of the hash function a build searches for.
    grouped: true
    items:
      - doc: |-
          keysPerBucket is λ, the mean bucket size: one pilot byte serves this many
          keys, so the pilots cost 1/λ byte a key. Three is where the search with
          eviction stays linear at the table's load.
        name: keysPerBucket
        type: uint32
        value: "3"
      - doc: |-
          loadPercent is α: the table has n·100/α slots, the slots past n being
          remapped onto the holes below it, so a pilot search never needs the last
          free slot of a full table. Measured on a million keys, 99 spent half the
          build evicting; 97 costs 0.12 byte a key of remap and builds in two
          thirds of the time, and lower buys nothing more.
        name: loadPercent
        type: uint64
        value: "97"
      - doc: "pilots is the number of pilot values a bucket can take: one byte."
        name: pilots
        type: int
        value: "256"
      - doc: |-
          attempts bounds the seeds a build tries before it gives up; with a hash
          of 64 bits a second seed is already rare.
        name: attempts
        type: int
        value: "8"
      - doc: |-
          recentEvicted is how many buckets placed by eviction are not evicted
          again at once, which breaks the two-bucket cycles eviction can fall in.
        name: recentEvicted
        type: int
        value: "16"
      - doc: evictionsPerKey bounds the evictions of one seed, n times this.
        name: evictionsPerKey
        type: int
        value: "32"
      - doc: percent is what loadPercent is out of.
        name: percent
        type: uint64
        value: "100"
    name: keysPerBucket
  - grouped: true
    items:
      - doc: "solved: every key has a slot."
        name: solved
        type: verdict
        value: iota
      - doc: "reseed: this seed failed (two keys of one hash, or too many evictions)."
        name: reseed
      - doc: "duplicate: two keys are equal."
        name: duplicate
    name: solved
  - doc: |-
      The image's fixed header, little-endian, its CRC-32C over the bytes before
      headerSealed, where the CRC itself is stored:

      	0  magic "KFZN"     12 keys     24 seed       48 body CRC32C
      	4  version          16 buckets  32 blob size  52 reserved, zero
      	6  shape: kind, key width, value width, signs  40 image size  60 header CRC32C
      	10 reserved, zero   20 slots

      The sections follow, padded to four bytes: the pilots (a byte a bucket),
      the tags (a byte a key: its hash's low byte, read before anything else so
      an absent key is refused without touching a record), the remap (a uint32
      for each slot past n), the records (n of them, the shape's stride each) and
      the blob. An integer table's record is its key then its value; a string
      table's is the uint32 offset of its entry in the blob: the key's length as
      a uint32, a Dict's value length too, then the key's bytes and the value's.
    grouped: true
    items:
      - name: headerSize
        type: uint64
        value: "64"
      - name: headerSealed
        type: uint64
        value: "60"
      - name: version
        type: uint16
        value: "1"
      - name: magic
        value: "\"KFZN\""
    name: headerSize
  - doc: |-
      The widths, in bytes, an integer is stored at: a key, a value, a length or
      an offset.
    grouped: true
    items:
      - name: width8
        type: byte
        value: "8"
      - name: width4
        type: byte
        value: "4"
      - name: width2
        type: byte
        value: "2"
    name: width8
  - doc: The kinds of table, the shape's first byte.
    grouped: true
    items:
      - comment: integer keys, integer values
        name: kindInts
        type: byte
        value: "0"
      - comment: string keys, integer values
        name: kindStrings
        type: byte
        value: "1"
      - comment: string keys, string values
        name: kindText
        type: byte
        value: "3"
    name: kindInts
