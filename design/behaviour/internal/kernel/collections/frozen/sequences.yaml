      - id: d.t.appendTo
        kind: internal
    steps:
      - return: d.t.appendTo(b, dictShape), nil
        to: d.t.appendTo
  - of: (*Dict).MarshalBinary
    participants:
      - id: caller
        kind: actor
      - id: (*Dict).MarshalBinary
        kind: self
      - id: d.t.appendTo
        kind: internal
    steps:
      - return: d.t.appendTo(nil, dictShape), nil
        to: d.t.appendTo
  - of: totalLen
    steps:
      - var:
          name: "n"
          type: uint64
      - loop:
          do:
            - op: +=
              set: "n"
              value: uint64(len(k))
          key: _
          range: keys
          value: k
      - loop:
          do:
            - op: +=
              set: "n"
              value: uint64(len(v))
          key: _
          range: values
          value: v
      - return: "n"
  - of: (*table).appendTo
    participants:
      - id: caller
        kind: actor
      - id: (*table).appendTo
        kind: self
      - id: writeHeader
        kind: internal
    steps:
      - opt:
          do:
            - bind: e
              eval: make([]byte, headerSize)
            - bind: empty
              eval: new(table)
            - set: empty.shape
              value: s
            - eval: writeHeader(e, empty)
              to: writeHeader
            - return: append(b, e...)
          when: t.image == nil
      - return: append(b, t.image...)
  - of: head
    participants:
      - id: caller
        kind: actor
      - id: head
        kind: self
      - id: le.PutUint32
        kind: value
    steps:
      - eval: le.PutUint32(blob, uint32(len(key)))
        to: le.PutUint32
      - return: hs + uint32(copy(blob[hs:], key))
  - of: seedAt
    participants:
      - id: caller
        kind: actor
      - id: seedAt
        kind: self
      - id: fold
        kind: internal
    steps:
      - return: fold(uint64(a)+mulB, mulC)
        to: fold
  - of: solve
    participants:
      - id: caller
        kind: actor
      - id: solve
        kind: self
      - id: seedAt
        kind: internal
      - id: newSearch
        kind: internal
      - id: s.run
        kind: internal
      - id: s.finish
        kind: internal
    steps:
      - opt:
          do:
            - return: plan{}, -1, true
          when: n == 0
      - bind: hs
        eval: make([]uint64, n)
      - loop:
          do:
            - bind: seed
              eval: seedAt(a)
              to: seedAt
            - loop:
                do:
                  - set: hs[i]
                    value: hash(seed, i)
                key: i
                range: hs
            - bind: s
              eval: newSearch(hs)
              to: newSearch
            - switch:
                cases:
                  - case: solved
                    do:
                      - return: s.finish(seed), -1, true
                        to: s.finish
                  - case: duplicate
                    do:
                      - return: plan{}, d, false
                  - case: reseed
                init:
                  bind: v, d
                  eval: s.run(same)
                  to: s.run
                "on": v
          key: a
          range: attempts
      - return: plan{}, -1, false
  - of: newSearch
    participants:
      - id: caller
        kind: actor
      - id: newSearch
        kind: self
      - id: below
        kind: internal
    steps:
      - bind: "n"
        eval: uint32(len(hs))
      - bind: nb
        eval: (n + keysPerBucket - 1) / keysPerBucket
      - bind: m
        eval: uint32((uint64(n)*percent + loadPercent - 1) / loadPercent)
      - bind: s
        eval: |-
          &search{
          		hs: hs, n: n, m: m, nb: nb,
          		start: make([]uint32, nb+1), keys: make([]uint32, n), bh: make([]uint64, n),
          		owner: make([]uint32, m), taken: make([]uint64, (m+63)/64), pilot: make([]byte, nb),
          	}
      - loop:
          do:
            - op: ++
              set: s.start[below(h, nb)+1]
          key: _
          range: hs
          value: h
      - loop:
          do:
            - op: +=
              set: s.start[b+1]
              value: s.start[b]
          key: b
          range: nb
      - bind: fill
        eval: make([]uint32, nb)
      - eval: copy(fill, s.start[:nb])
      - loop:
          do:
            - bind: b
              eval: below(h, nb)
              to: below
            - set: s.keys[fill[b]]
              value: uint32(i)
            - set: s.bh[fill[b]]
              value: h
            - op: ++
              set: fill[b]
          key: i
          range: hs
          value: h
      - loop:
          do:
            - set: s.recent[i]
              value: ^uint32(0)
          key: i
          range: s.recent
      - return: s
  - of: (*search).bucket
    steps:
      - return: s.bh[s.start[b]:s.start[b+1]]
  - of: (*search).run
    participants:
      - id: caller
        kind: actor
      - id: (*search).run
        kind: self
      - id: s.collisions
        kind: internal
      - id: s.bySize
        kind: internal
    steps:
      - opt:
          do:
            - return: v, d
          init:
            bind: v, d
            eval: s.collisions(same)
            to: s.collisions
          when: v != solved
      - bind: order
        eval: s.bySize()
        to: s.bySize
      - bind: budget
        eval: int(s.n) * evictionsPerKey
      - loop:
          do:
            - set: s.stack
              value: append(s.stack[:0], b)
            - loop:
                cond: len(s.stack) > 0
                do:
                  - bind: c
                    eval: s.stack[len(s.stack)-1]
                  - set: s.stack
                    value: s.stack[:len(s.stack)-1]
                  - opt:
                      do:
                        - continue: true
                      when: s.placeFree(c)
                  - opt:
                      do:
                        - return: reseed, -1
                      when: budget == 0 || !s.placeEvicting(c)
                  - op: "--"
                    set: budget
          key: _
          range: order
          value: b
      - return: solved, -1
  - of: (*search).collisions
    participants:
      - id: caller
        kind: actor
      - id: (*search).collisions
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: lo, hi
              eval: s.start[b], s.start[b+1]
            - loop:
                cond: i < hi
                do:
                  - bind: k
                    eval: slices.Index(s.bh[lo:i], s.bh[i])
                    to: slices
                  - opt:
                      do:
                        - continue: true
                      when: k < 0
                  - opt:
                      do:
                        - return: duplicate, int(s.keys[i])
                      when: same(int(s.keys[i]), int(s.keys[lo+uint32(k)]))
                  - return: reseed, -1
                init: i := lo + 1
                post: i++
          key: b
          range: s.nb
      - return: solved, -1
  - of: (*search).bySize
    steps:
      - bind: largest
        eval: uint32(0)
      - loop:
          do:
            - set: largest
              value: max(largest, s.start[b+1]-s.start[b])
          key: b
          range: s.nb
      - bind: at
        eval: make([]uint32, largest+2)
      - loop:
          do:
            - op: ++
              set: at[largest-(s.start[b+1]-s.start[b])+1]
          key: b
          range: s.nb
      - loop:
          cond: i < uint32(len(at))
          do:
            - op: +=
              set: at[i]
              value: at[i-1]
          init: i := uint32(1)
          post: i++
      - bind: nonEmpty
        eval: at[largest]
      - bind: order
        eval: make([]uint32, s.nb)
      - loop:
          do:
            - bind: k
              eval: largest - (s.start[b+1] - s.start[b])
            - set: order[at[k]]
              value: b
            - op: ++
              set: at[k]
          key: b
          range: s.nb
      - return: order[:nonEmpty]
  - of: (*search).slots
    participants:
      - id: caller
        kind: actor
      - id: (*search).slots
        kind: self
      - id: slotOf
        kind: internal
    steps:
      - set: s.buf
        value: s.buf[:0]
      - loop:
          do:
            - bind: x
              eval: slotOf(h, p, s.m)
              to: slotOf
            - opt:
                do:
                  - return: "false"
                when: slices.Contains(s.buf, x)
            - set: s.buf
              value: append(s.buf, x)
          key: _
          range: s.bucket(b)
          value: h
      - return: "true"
  - of: (*search).take
    steps:
      - set: s.pilot[b]
        value: p
      - loop:
          do:
            - set: s.owner[x]
              value: b + 1
            - op: "|="
              set: s.taken[x/64]
              value: 1 << (x % 64)
          key: _
          range: s.buf
          value: x
  - of: (*search).free
    steps:
      - set: s.owner[x]
        value: "0"
      - op: "&^="
        set: s.taken[x/64]
        value: 1 << (x % 64)
  - of: (*search).placeFree
    participants:
      - id: caller
        kind: actor
      - id: (*search).placeFree
        kind: self
      - id: s.bucket
        kind: internal
      - id: slotOf
        kind: internal
      - id: s.take
        kind: internal
    steps:
      - bind: hs
        eval: s.bucket(b)
        to: s.bucket
      - loop:
          do:
            - bind: free
              eval: "true"
            - loop:
                do:
                  - bind: x
                    eval: slotOf(h, byte(p), s.m)
                    to: slotOf
                  - opt:
                      do:
                        - set: free
                          value: "false"
                        - break: true
                      when: s.taken[x/64]&(1<<(x%64)) != 0
                key: _
                range: hs
                value: h
            - opt:
                do:
                  - eval: s.take(b, byte(p))
                    to: s.take
                  - return: "true"
                when: free && s.slots(b, byte(p))
          key: p
          range: pilots
      - return: "false"
  - of: (*search).placeEvicting
    participants:
      - id: caller
        kind: actor
      - id: (*search).placeEvicting
        kind: self
      - id: s.cost
        kind: internal
      - id: s.slots
        kind: internal
      - id: s.evict
        kind: internal
      - id: s.take
        kind: internal
    steps:
      - bind: best, bestCost
        eval: "-1, ^uint64(0)"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!s.slots(b, byte(p))"
            - bind: cost, ok
              eval: s.cost()
              to: s.cost
            - opt:
                do:
                  - set: best, bestCost
                    value: p, cost
                when: ok && cost < bestCost
          key: p
          range: pilots
      - opt:
          do:
            - return: "false"
          when: best < 0
      - eval: s.slots(b, byte(best))
        to: s.slots
      - loop:
          do:
            - opt:
                do:
                  - eval: s.evict(o - 1)
                    to: s.evict
                init:
                  bind: o
                  eval: s.owner[x]
                when: o != 0
          key: _
          range: s.buf
          value: x
      - eval: s.slots(b, byte(best))
        to: s.slots
      - eval: s.take(b, byte(best))
        to: s.take
      - set: s.recent[s.next]
        value: b
      - set: s.next
        value: (s.next + 1) % recentEvicted
      - return: "true"
  - of: (*search).evict
    participants:
      - id: caller
        kind: actor
      - id: (*search).evict
        kind: self
      - id: slotOf
        kind: internal
      - id: s.free
        kind: internal
    steps:
      - loop:
          do:
            - bind: x
              eval: slotOf(h, s.pilot[c], s.m)
              to: slotOf
            - opt:
                do:
                  - eval: s.free(x)
                    to: s.free
                when: s.owner[x] == c+1
          key: _
          range: s.bucket(c)
          value: h
      - set: s.stack
        value: append(s.stack, c)
  - of: (*search).finish
    participants:
      - id: caller
        kind: actor
      - id: (*search).finish
        kind: self
      - id: slotOf
        kind: internal
    steps:
      - bind: p
        eval: |-
          plan{
          		seed: seed, n: s.n, nb: s.nb, m: s.m, pilots: s.pilot, hs: s.hs,
          		remap: make([]uint32, s.m-s.n), pos: make([]uint32, s.n),
          	}
      - bind: hole
        eval: uint32(0)
      - loop:
          cond: x < s.m
          do:
            - opt:
                do:
                  - continue: true
                when: s.owner[x] == 0
            - loop:
                cond: s.owner[hole] != 0
                do:
                  - op: ++
                    set: hole
            - set: p.remap[x-s.n]
              value: hole
            - op: ++
              set: hole
          init: x := s.n
          post: x++
      - loop:
          do:
            - loop:
                cond: j < s.start[b+1]
                do:
                  - bind: x
                    eval: slotOf(s.bh[j], s.pilot[b], s.m)
                    to: slotOf
                  - opt:
                      do:
                        - set: x
                          value: p.remap[x-s.n]
                      when: x >= s.n
                  - set: p.pos[s.keys[j]]
                    value: x
                init: j := s.start[b]
                post: j++
          key: b
          range: s.nb
      - return: p
  - of: shape.stride
    steps:
      - opt:
          do:
            - return: uint32(s.kw) + uint32(s.vw)
          when: s.kind == kindInts
      - return: uint32(width4)
  - of: shape.head
    steps:
      - opt:
          do:
            - return: uint32(width4 + width4)
          when: s.kind == kindText
      - return: uint32(width4)
  - of: loadw
    participants:
      - id: caller
        kind: actor
      - id: loadw
        kind: self
      - id: le.Uint64
        kind: value
    steps:
      - switch:
          cases:
            - case: width8
              do:
                - return: le.Uint64(b)
                  to: le.Uint64
            - case: width4
              do:
                - return: uint64(le.Uint32(b))
            - case: width2
              do:
                - return: uint64(le.Uint16(b))
            - default: true
              do:
                - return: uint64(b[0])
          "on": w
  - of: storew
    participants:
      - id: caller
        kind: actor
      - id: storew
        kind: self
      - id: le.PutUint64
        kind: value
      - id: le.PutUint32
        kind: value
      - id: le.PutUint16
        kind: value
    steps:
      - switch:
          cases:
            - case: width8
              do:
                - eval: le.PutUint64(b, v)
                  to: le.PutUint64
            - case: width4
              do:
                - eval: le.PutUint32(b, uint32(v))
                  to: le.PutUint32
            - case: width2
              do:
                - eval: le.PutUint16(b, uint16(v))
                  to: le.PutUint16
            - default: true
              do:
                - set: b[0]
                  value: byte(v)
          "on": w
  - of: mask
    steps:
      - opt:
          do:
            - return: ^uint64(0)
          when: w >= width8
      - return: 1<<(uint64(width8)*uint64(w)) - 1
  - of: (*table).slot
    participants:
      - id: caller
        kind: actor
      - id: (*table).slot
        kind: self
      - id: slotOf
        kind: internal
      - id: le.Uint32
        kind: value
    steps:
      - bind: x
        eval: slotOf(h, t.pilots[below(h, t.nb)], t.m)
        to: slotOf
      - opt:
          do:
            - set: x
              to: le.Uint32
              value: le.Uint32(t.remap[4*uint64(x-t.n):])
          when: x >= t.n
      - return: x
  - of: (*table).findInt
    participants:
      - id: caller
        kind: actor
      - id: (*table).findInt
        kind: self
      - id: hashInt
        kind: internal
      - id: t.slot
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, false
          when: t.n == 0
      - op: "&="
        set: k
        value: t.kmask
      - bind: h
        eval: hashInt(t.seed, k)
        to: hashInt
      - bind: x
        eval: t.slot(h)
        to: t.slot
      - opt:
          do:
            - return: 0, false
          when: t.tags[x] != byte(h)
      - bind: r
        eval: uint64(x) * uint64(t.stride)
      - return: r, loadw(t.recs[r:], t.shape.kw) == k
  - of: (*table).findString
    participants:
      - id: caller
        kind: actor
      - id: (*table).findString
        kind: self
      - id: hashString
        kind: internal
      - id: t.slot
        kind: internal
      - id: t.entry
        kind: internal
      - id: t.shape.head
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, false
          when: t.n == 0
      - bind: h
        eval: hashString(t.seed, k)
        to: hashString
      - bind: x
        eval: t.slot(h)
        to: t.slot
      - opt:
          do:
            - return: 0, false
          when: t.tags[x] != byte(h)
      - bind: "off"
        eval: t.entry(x)
        to: t.entry
      - bind: e
        eval: t.blob[off:]
      - opt:
          do:
            - return: 0, false
          when: load32(e, 0) != uint64(len(k))
      - bind: hs
        eval: t.shape.head()
        to: t.shape.head
      - return: off, e[hs:hs+uint32(len(k))] == k
  - of: (*table).intKey
    participants:
      - id: caller
        kind: actor
      - id: (*table).intKey
        kind: self
      - id: loadw
        kind: internal
    steps:
      - return: loadw(t.recs[r:], t.shape.kw)
        to: loadw
  - of: (*table).intValue
    participants:
      - id: caller
        kind: actor
      - id: (*table).intValue
        kind: self
      - id: loadw
        kind: internal
    steps:
      - return: loadw(t.recs[r+uint64(t.shape.kw):], t.shape.vw)
        to: loadw
  - of: (*table).entry
    participants:
      - id: caller
        kind: actor
      - id: (*table).entry
        kind: self
      - id: le.Uint32
        kind: value
    steps:
      - return: le.Uint32(t.recs[4*uint64(x):])
        to: le.Uint32
  - of: (*table).stringKey
    steps:
      - bind: at
        eval: off + t.shape.head()
      - return: "t.blob[at : at+uint32(load32(t.blob, int(off)))]"
  - of: (*table).entryValue
    participants:
      - id: caller
        kind: actor
      - id: (*table).entryValue
        kind: self
      - id: load64
        kind: internal
      - id: load32
        kind: internal
    steps:
      - bind: at
        eval: int(off + t.shape.head() + uint32(load32(t.blob, int(off))))
      - switch:
          cases:
            - case: width8
              do:
                - return: load64(t.blob, at)
                  to: load64
            - case: width4
              do:
                - return: load32(t.blob, at)
                  to: load32
            - case: width2
              do:
                - return: uint64(t.blob[at]) | uint64(t.blob[at+1])<<8
            - default: true
              do:
                - return: uint64(t.blob[at])
          "on": t.shape.vw
  - of: (*table).textValue
    steps:
      - bind: at
        eval: off + t.shape.head() + uint32(load32(t.blob, int(off)))
      - return: "t.blob[at : at+uint32(load32(t.blob, int(off)+int(width4)))]"
  - of: pad4
    steps:
      - return: (x + 3) &^ 3
  - of: layoutOf
    steps:
      - var:
          name: l
          type: layout
      - set: l.tags
        value: headerSize + pad4(uint64(nb))
      - set: l.remap
        value: l.tags + pad4(uint64(n))
      - set: l.recs
        value: l.remap + 4*(uint64(m)-uint64(n))
      - set: l.blob
        value: l.recs + uint64(n)*uint64(s.stride())
      - set: l.size
        value: l.blob + blob
      - return: l
  - of: writeHeader
    participants:
      - id: caller
        kind: actor
      - id: writeHeader
        kind: self
      - id: le.PutUint16
        kind: value
      - id: le.PutUint32
        kind: value
      - id: le.PutUint64
        kind: value
    steps:
      - bind: h
        eval: image[:headerSize]
      - eval: clear(h)
      - eval: copy(h, magic)
      - eval: le.PutUint16(h[4:], version)
        to: le.PutUint16
      - set: h[6], h[7], h[8], h[9]
        value: t.shape.kind, t.shape.kw, t.shape.vw, t.shape.signs
      - eval: le.PutUint32(h[12:], t.n)
        to: le.PutUint32
      - eval: le.PutUint32(h[16:], t.nb)
        to: le.PutUint32
      - eval: le.PutUint32(h[20:], t.m)
        to: le.PutUint32
      - eval: le.PutUint64(h[24:], t.seed)
        to: le.PutUint64
      - eval: le.PutUint64(h[32:], uint64(len(t.blob)))
        to: le.PutUint64
      - eval: le.PutUint64(h[40:], uint64(len(image)))
        to: le.PutUint64
      - eval: le.PutUint32(h[48:], crc32.Checksum(image[headerSize:], castagnoli))
        to: le.PutUint32
      - eval: le.PutUint32(h[headerSealed:], crc32.Checksum(h[:headerSealed], castagnoli))
        to: le.PutUint32
  - of: (*table).view
    participants:
      - id: caller
        kind: actor
      - id: (*table).view
        kind: self
      - id: stringOf
        kind: internal
      - id: t.shape.stride
        kind: internal
      - id: mask
        kind: internal
    steps:
      - set: t.image
        value: image
      - set: t.pilots
        value: "image[headerSize : headerSize+uint64(t.nb)]"
      - set: t.tags
        value: "image[l.tags : l.tags+uint64(t.n)]"
      - set: t.remap
        value: image[l.remap:l.recs]
      - set: t.recs
        value: image[l.recs:l.blob]
      - set: t.blob
        to: stringOf
        value: stringOf(image[l.blob:l.size])
      - set: t.stride
        to: t.shape.stride
        value: t.shape.stride()
      - set: t.kmask
        to: mask
        value: mask(t.shape.kw)
  - of: stringOf
    participants:
      - id: caller
        kind: actor
      - id: stringOf
        kind: self
      - id: unsafe
        kind: stdlib
    steps:
      - return: unsafe.String(unsafe.SliceData(b), len(b))
        to: unsafe
