        name: tail
        type: atomic.Uint64
      - name: _
        type: linePad
      - doc: |-
          head is the next position the reader reads, written by the reader
          alone and loaded by Len.
        name: head
        type: atomic.Uint64
      - name: _
        type: linePad
    kind: struct
