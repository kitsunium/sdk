    params: cfg Config[K, V], stripes int, hash func(key K) uint64
    results: "*Striped[K, V]"
    typeParams: K comparable, V any
  - doc: |-
      shareOf returns stripe at's share of bound over count stripes: the
      remainder goes to the first stripes, and a set bound gives every stripe at
      least one unit, since a zero bound would read as unbounded.
    name: shareOf
    params: bound, count, at int
    results: int
imports:
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  heap: github.com/kitsunium/sdk/internal/kernel/collections/heap
  iter: iter
  maphash: hash/maphash
  math: math
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/collections/cache
  name: cache
  purpose: Package cache provides a generic, concurrency-safe LRU + TTL cache (Cache[K,V]) — a kernel primitive (stdlib-only, no domain vocabulary).
types:
  - fields:
      - name: mu
        type: sync.RWMutex
      - name: clk
        type: clock.Clock
      - name: maxEntries
        type: int
      - name: maxWeight
        type: int64
      - name: weightOf
        type: func(key K, val V) int64
      - name: defaultTTL
        type: time.Duration
      - name: onEvict
        type: func(key K, val V)
      - name: policy
        type: Policy
      - name: items
        type: map[K]*entry[K, V]
      - doc: main is the LRU list, and S3-FIFO's main queue.
        name: main
        type: entryList[K, V]
      - doc: small is S3-FIFO's probationary queue; empty under LRU.
        name: small
        type: entryList[K, V]
      - doc: ghost remembers the keys probation evicted (S3-FIFO only).
        name: ghost
        type: ghostSet[K]
      - doc: |-
          expiry orders the entries that carry a deadline, earliest first; nil
          until the first one is stored.
        name: expiry
        type: "*heap.IndexedHeap[*entry[K, V]]"
      - name: hits
        type: uint64
      - name: misses
        type: uint64
      - name: evictions
        type: uint64
      - doc: |-
          The padding keeps the counters every operation writes off the cache line of the
          mutex of whatever is allocated next — in a Striped, the next stripe.
        name: _
        type: "[cacheLine]byte"
    kind: struct
    methods:
      - name: Fetch
        params: key K
        recv: c *Cache[K, V]
        results: value V, ok bool
      - name: Set
        params: key K, val V
        recv: c *Cache[K, V]
      - name: SetTTL
        params: key K, val V, ttl time.Duration
        recv: c *Cache[K, V]
      - doc: |-
          setTTL inserts or updates key=val, computing the absolute expiry and applying
          eviction when a bound is exceeded.
        name: setTTL
        params: key K, val V, ttl time.Duration
        recv: c *Cache[K, V]
      - doc: |-
          overwrite refreshes a live entry's value, weight and expiry, and records the
          write as a hit would be recorded. Caller holds mu.
        name: overwrite
        params: ent *entry[K, V], val V, exp time.Time, pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
      - name: Delete
        params: key K
        recv: c *Cache[K, V]
      - name: Expire
        recv: c *Cache[K, V]
        results: int
      - name: Keys
        recv: c *Cache[K, V]
        results: iter.Seq[K]
      - doc: keySnapshot copies the keys present and unexpired, under the read lock.
        name: keySnapshot
        recv: c *Cache[K, V]
        results: "[]K"
      - name: Len
        recv: c *Cache[K, V]
        results: int
      - name: Purge
        recv: c *Cache[K, V]
      - name: Stats
        recv: c *Cache[K, V]
        results: StatsValue
      - doc: weigh returns what key=val counts against MaxWeight.
        name: weigh
        params: key K, val V
        recv: c *Cache[K, V]
        results: int32
      - doc: |-
          reweigh changes ent's weight in place, keeping its list's sum. Caller holds
          mu.
        name: reweigh
        params: ent *entry[K, V], weight int32
        recv: c *Cache[K, V]
      - doc: |-
          setDeadline gives ent the deadline exp (zero = none) and keeps the expiry
          heap in step. Caller holds mu.
        name: setDeadline
        params: ent *entry[K, V], exp time.Time
        recv: c *Cache[K, V]
      - doc: expired reports whether ent carries a deadline that has passed. Caller holds mu.
        name: expired
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          overCapacity reports whether a bound is exceeded. The weight bound never
          asks a lone entry to leave: an entry heavier than MaxWeight is stored and
          evicts everything else. Caller holds mu.
        name: overCapacity
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          evictIfNeeded removes entries while a bound is exceeded, never fresh — the
          entry the current Set wrote. An entry whose deadline has passed goes before
          any live one: the heap's top is tried first, so a dead entry never costs a
          live one its slot. Caller holds mu.
        name: evictIfNeeded
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          removeEvict detaches ent, counts an eviction, and QUEUES the evicted pair
          onto pending. Caller holds mu.

          OnEvict is deliberately NOT invoked here. Every caller holds c.mu and
          sync.Mutex is not reentrant, so a callback that touches the cache would
          deadlock outright, and a merely slow one would hold every other operation
          off for its whole duration — turning eviction into an unbounded critical
          section. Callers drain pending through notifyEvicted after unlocking.
        name: removeEvict
        params: ent *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          detach takes ent out of its list, the expiry heap and the map. Caller holds
          mu.
        name: detach
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          notifyEvicted fires OnEvict for every queued pair. It MUST be called with
          c.mu released — the callback is user code and may re-enter the cache.
        name: notifyEvicted
        params: pending []evictionValue[K, V]
        recv: c *Cache[K, V]
      - doc: listOf returns the list ent sits in. Caller holds mu.
        name: listOf
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
        results: "*entryList[K, V]"
      - doc: unlink detaches ent from its list, fixing head/tail. Caller holds mu.
        name: unlink
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          admit places a new entry: at the front of the LRU list, or for S3-FIFO in
          the small queue — main when the ghost remembers its key. Caller holds mu.
        name: admit
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          touch records a hit: LRU promotes the entry, S3-FIFO counts it. Caller
          holds mu.
        name: touch
        params: ent *entry[K, V]
        recv: c *Cache[K, V]
      - doc: |-
          evictOne removes one entry by the policy, never fresh — the entry the
          current Set wrote — and reports whether it found a victim. Caller holds mu.
        name: evictOne
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          evictS3FIFO evicts from the small queue while it holds its share or main is
          empty, from main otherwise, and falls back to the other queue when the
          first has nothing it may evict. Caller holds mu.
        name: evictS3FIFO
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          smallIsLarge reports whether the small queue holds its tenth of the bound
          that applies. Caller holds mu.
        name: smallIsLarge
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          evictSmall walks the small queue from its tail: an entry hit since its
          admission moves to main with its counter cleared, the first one never hit
          is evicted and its key remembered by the ghost. Caller holds mu.
        name: evictSmall
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          evictMain is main's clock hand: the tail with hits left is re-inserted at
          the head with one hit fewer, the first without any is evicted. Caller holds
          mu.
        name: evictMain
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *Cache[K, V]
        results: bool
      - doc: |-
          ghostBound is how many hashes the ghost keeps: the entry bound when there is
          one, else the live count. Caller holds mu.
        name: ghostBound
        recv: c *Cache[K, V]
        results: int
    name: Cache
    typeParams: K comparable, V any
  - fields:
      - doc: MaxEntries caps the live entry count (LRU eviction above it). 0 = unbounded.
        name: MaxEntries
        type: int
      - doc: DefaultTTL applies to Set entries (SetTTL overrides per-entry). 0 = no expiry.
        name: DefaultTTL
        type: time.Duration
      - doc: Clock is the time source (injectable for tests). nil = clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          OnEvict, if non-nil, is called with the key+value of every entry removed by
          capacity eviction or expiry (not by an explicit Delete/Set-overwrite).
        name: OnEvict
        type: func(key K, val V)
      - doc: |-
          MaxWeight caps the summed weight of the live entries, evicting above it as
          MaxEntries does; both apply when both are set. 0 = unbounded. An entry
          heavier than MaxWeight alone is stored and evicts every other entry: the
          primitive has no error to refuse it with.
        name: MaxWeight
        type: int64
      - doc: |-
          WeightOf, if non-nil, weighs an entry when it is stored; a negative answer
          counts as 0, and one above math.MaxInt32 as math.MaxInt32. nil = every
          entry weighs 1, so MaxWeight is then a count.
        name: WeightOf
        type: func(key K, val V) int64
      - doc: |-
          Policy chooses the victim when the cache is full. The zero value is
          PolicyLRU.
        name: Policy
        type: Policy
    kind: struct
    name: Config
    typeParams: K comparable, V any
  - doc: queueID names the list an entry sits in.
    kind: named
    name: queueID
    underlying: uint8
  - doc: |-
      entry is one cache slot: it holds the key (so eviction can delete it from the
      map), the value, an optional absolute expiry, and the prev/next links of the
      intrusive list it sits in (head = most recently inserted or promoted, tail =
      the next victim).
    fields:
      - name: key
        type: K
      - name: val
        type: V
      - name: expireAt
        type: time.Time
      - name: prev
        type: "*entry[K, V]"
      - name: next
        type: "*entry[K, V]"
      - doc: |-
          expiry names the entry's node in the expiry heap; the zero Handle when
          it carries no deadline.
        name: expiry
        type: heap.Handle
      - doc: |-
          weight is what the entry counts against MaxWeight: WeightOf's answer,
          or 1 without one. 32 bits, so that with freq and queue it fills one word
          and the node stays in the 80-byte size class for a string key and a
          word-sized value.
        name: weight
        type: int32
      - doc: |-
          freq counts the hits since admission or the last demotion, capped at
          maxFreq (S3-FIFO only).
        name: freq
        type: uint8
      - doc: queue says which list the entry sits in (S3-FIFO only; LRU uses main).
        name: queue
        type: queueID
    kind: struct
    name: entry
    typeParams: K comparable, V any
  - doc: |-
      evictionValue is one evicted key/value pair, captured BY VALUE at eviction
      time. Copying is deliberate: the *entry it came from is unlinked and may be
      reused or collected before the observer runs, so holding the pointer would
      hand the callback a node the cache no longer owns.
    fields:
      - name: key
        type: K
      - name: val
        type: V
    kind: struct
    name: evictionValue
    typeParams: K comparable, V any
  - doc: |-
      ghostSet is S3-FIFO's ghost queue: the hashes of the keys the small queue
      evicted without a hit, oldest first, bounded. A key it remembers skips
      probation on its next admission. It holds hashes, never keys or values, so
      a remembered key costs a few words whatever K is; a collision admits a
      stranger into main, which costs at worst one misplaced entry.
    fields:
      - doc: seed keys the hash; fixed for the cache's life.
        name: seed
        type: maphash.Seed
      - doc: ring is the FIFO of hashes; head indexes the oldest of size live ones.
        name: ring
        type: "[]uint64"
      - name: head
        type: int
      - name: size
        type: int
      - doc: members counts each hash's occurrences in the ring.
        name: members
        type: map[uint64]uint32
    kind: struct
    methods:
      - doc: remembers reports whether key's hash is in the ring.
        name: remembers
        params: key K
        recv: g *ghostSet[K]
        results: bool
      - doc: |-
          add remembers key, forgetting the oldest hashes while the ring holds bound
          or more.
        name: add
        params: key K, bound int
        recv: g *ghostSet[K]
      - doc: dropOldest forgets the oldest hash.
        name: dropOldest
        recv: g *ghostSet[K]
      - doc: grow doubles the ring, never past bound, keeping the hashes oldest first.
        name: grow
        params: bound int
        recv: g *ghostSet[K]
      - doc: reset forgets everything, keeping the ring's array.
        name: reset
        recv: g *ghostSet[K]
    name: ghostSet
    typeParams: K comparable
  - doc: |-
      entryList is an intrusive doubly-linked list of entries with its count and
      summed weight: head = most recently inserted or promoted, tail = the next
      victim. Caller holds the cache's mu for every method.
    fields:
      - name: head
        type: "*entry[K, V]"
      - name: tail
        type: "*entry[K, V]"
      - name: count
        type: int
      - name: weight
        type: int64
    kind: struct
    methods:
      - doc: pushFront inserts ent at the head. ent MUST be detached.
        name: pushFront
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
      - doc: unlink detaches ent from the list, fixing head and tail.
        name: unlink
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
      - doc: moveFront promotes ent to the head.
        name: moveFront
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
    name: entryList
    typeParams: K comparable, V any
  - kind: named
    name: Policy
    underlying: uint8
  - fields:
      - name: Hits
        type: uint64
      - name: Misses
        type: uint64
      - name: Evictions
        type: uint64
      - doc: |-
          Weight is the summed weight of the live entries when the cache weighs
          them — Config.MaxWeight or Config.WeightOf set — and 0 when it does not.
        name: Weight
        type: int64
      - doc: |-
          Policy is the eviction policy that runs: Config.Policy, or PolicyLRU
          for a value the cache does not know.
        name: Policy
        type: Policy
    kind: struct
    name: StatsValue
  - fields:
      - name: stripes
        type: "[]*Cache[K, V]"
      - doc: hash is the caller's, or nil for maphash over seed.
        name: hash
        type: func(key K) uint64
      - name: seed
        type: maphash.Seed
    kind: struct
    methods:
      - doc: stripe returns the Cache key lands in.
        name: stripe
        params: key K
        recv: s *Striped[K, V]
        results: "*Cache[K, V]"
      - name: Fetch
        params: key K
        recv: s *Striped[K, V]
        results: value V, ok bool
      - name: Set
        params: key K, val V
        recv: s *Striped[K, V]
      - name: SetTTL
        params: key K, val V, ttl time.Duration
        recv: s *Striped[K, V]
      - name: Delete
        params: key K
        recv: s *Striped[K, V]
      - name: Expire
        recv: s *Striped[K, V]
        results: int
      - name: Keys
        recv: s *Striped[K, V]
        results: iter.Seq[K]
      - name: Len
        recv: s *Striped[K, V]
        results: int
      - name: Purge
        recv: s *Striped[K, V]
      - name: Stats
        recv: s *Striped[K, V]
        results: StatsValue
      - name: Stripes
        recv: s *Striped[K, V]
        results: int
    name: Striped
    typeParams: K comparable, V any
