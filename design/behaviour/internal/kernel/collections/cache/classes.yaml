apiVersion: design/behaviour/v1
constants:
  - doc: cacheLine is the padding that separates two Caches allocated side by side.
    items:
      - name: cacheLine
        type: int
        value: "64"
    name: cacheLine
  - grouped: true
    items:
      - doc: queueMain is the LRU list, and S3-FIFO's main queue.
        name: queueMain
        type: queueID
        value: iota
      - doc: queueSmall is S3-FIFO's probationary queue.
        name: queueSmall
    name: queueMain
  - doc: |-
      minGhostRing is the ring's first allocation: small enough for a tiny cache,
      large enough that a busy one does not double its way up from one slot.
    items:
      - name: minGhostRing
        type: int
        value: "8"
    name: minGhostRing
  - grouped: true
    items:
      - doc: |-
          PolicyLRU evicts the least-recently-used entry: every hit moves its entry
          to the front. A scan of cold keys longer than the capacity flushes the
          whole hot set.
        name: PolicyLRU
        type: Policy
        value: iota
      - doc: |-
          PolicyS3FIFO is S3-FIFO (Yang et al., SOSP 2023): a new key enters a small
          probationary FIFO holding a tenth of the capacity; one hit there promotes
          it to the main FIFO when it reaches the tail, none sends its key to a
          bounded ghost set, and a key the ghost remembers is admitted straight into
          main. A one-time scan therefore churns the small queue and leaves the hot
          set in main. A hit only sets a counter — it moves nothing.
        name: PolicyS3FIFO
    name: PolicyLRU
  - doc: |-
      maxFreq caps an entry's hit counter: S3-FIFO's two bits. Three hits are
      enough to survive three passes of main's clock hand.
    items:
      - name: maxFreq
        type: uint8
        value: "3"
    name: maxFreq
  - doc: |-
      smallShare is the small queue's share of the capacity: one tenth, the
      paper's figure, written as the divisor it is used as.
    items:
      - name: smallShare
        type: int
        value: "10"
    name: smallShare
