apiVersion: design/behaviour/v1
constants:
  - doc: cacheLine is the padding that separates two Caches allocated side by side.
    items:
      - name: cacheLine
        type: int
        value: "64"
    name: cacheLine
  - doc: |-
      heapArity is the expiry heap's fan-out: the four cells of a parent's children share
      one cache line, and the tree is half as deep as a binary one.
    items:
      - name: heapArity
        type: int
        value: "4"
    name: heapArity
  - grouped: true
    items:
      - doc: |-
          queueMain is the LRU list, S3-FIFO's main queue and W-TinyLFU's
          protected segment.
        name: queueMain
        type: queueID
        value: iota
      - doc: queueSmall is S3-FIFO's probationary queue and W-TinyLFU's window.
        name: queueSmall
      - doc: queueProbation is W-TinyLFU's probationary segment.
        name: queueProbation
    name: queueMain
  - doc: |-
      minGhostRing is the ring's first allocation: small enough for a tiny cache,
      large enough that a busy one does not double its way up from one slot.
    items:
      - name: minGhostRing
        type: int
        value: "8"
    name: minGhostRing
  - grouped: true
    items:
      - doc: |-
          PolicyLRU evicts the least-recently-used entry: every hit moves its entry
          to the front. A scan of cold keys longer than the capacity flushes the
          whole hot set.
        name: PolicyLRU
        type: Policy
        value: iota
      - doc: |-
          PolicyS3FIFO is S3-FIFO (Yang et al., SOSP 2023): a new key enters a small
          probationary FIFO holding a fiftieth of the capacity; one hit there
          promotes it to the main FIFO when it reaches the tail, none sends its key
          to a ghost set holding a quarter of the capacity in hashes, and a key the
          ghost remembers is admitted straight into main. A one-time scan therefore
          churns the small queue and leaves the hot set in main. A hit only sets a
          counter — it moves nothing.
        name: PolicyS3FIFO
      - doc: |-
          PolicyTinyLFU is W-TinyLFU (Einziger, Friedman and Manes, ACM TOS 2017):
          a new key enters an LRU window holding a hundredth of the capacity; the
          key the window pushes out moves into main when main has room, and
          otherwise contests main's next victim — the least recently used of main's
          probationary segment — and stays only when a frequency sketch says it was
          used more, and twice at least. A second use in main moves an entry into
          the protected segment, four fifths of main. Every Set and every hit counts
          its key: the first use in a period in a doorkeeper, a Bloom filter, the
          later ones in a count-min sketch of four-bit counters halved every ten
          uses an entry of the bound, so a key used once — a scan, the long tail —
          never displaces one used more, and the counts follow what is used now. A
          key just written is always served: the window holds it.
        name: PolicyTinyLFU
    name: PolicyLRU
  - doc: |-
      maxFreq caps an entry's hit counter: S3-FIFO's two bits. Three hits are
      enough to survive three passes of main's clock hand.
    items:
      - name: maxFreq
        type: uint8
        value: "3"
    name: maxFreq
  - doc: |-
      smallShare is the small queue's share of the capacity, written as the
      divisor it is used as: a fiftieth. The paper's tenth admitted into main
      keys that came back once by chance; measured over 100 million accesses
      (#834, BENCH.md), a fiftieth keeps 0.9 points more of a Zipf s = 1.0 at a
      tenth of the keys, and more of every Zipf, scan and loop cell.
    items:
      - name: smallShare
        type: int
        value: "50"
    name: smallShare
  - doc: |-
      ghostShare is the ghost's share of the capacity, written as the divisor it
      is used as: a quarter. A ghost as long as main (the paper's) remembers keys
      that recur too rarely to earn main, which they then share with the hot set;
      a quarter admits a key straight into main only when it came back soon.
    items:
      - name: ghostShare
        type: int
        value: "4"
    name: ghostShare
  - grouped: true
    items:
      - doc: |-
          sketchSample is the sketch's aging period, in increments per entry of
          the bound: every sketchSample × bound increments, every counter is
          halved, so the counts follow what is used now.
        name: sketchSample
        type: int
        value: "10"
      - doc: "blockWords is a block's words: eight, one cache line."
        name: blockWords
        type: int
        value: "8"
      - doc: |-
          sketchMaxEntries caps the keys a table is sized for at 2^27 — a
          gibibyte of counters, past any bound the entries' memory allows —, so
          the period and the doorkeeper's bits fit an int on 32 bits too.
        name: sketchMaxEntries
        type: int
        value: 1 << 27
      - doc: counterMax is a four-bit counter's ceiling.
        name: counterMax
        type: uint64
        value: "15"
      - doc: counterLowBits masks the low bit of every four-bit counter of a word.
        name: counterLowBits
        type: uint64
        value: "0x1111111111111111"
      - doc: |-
          counterHalfMask clears what a one-bit shift carries into each counter's
          top bit from its neighbour.
        name: counterHalfMask
        type: uint64
        value: "0x7777777777777777"
      - doc: counterMix remixes a hash into the bytes that pick a key's counters.
        name: counterMix
        type: uint32
        value: "0x31848bab"
      - doc: |-
          doorBitsPerSample sizes the doorkeeper: four bits per increment of
          the aging period, so the keys used once in a period fill it sparsely.
        name: doorBitsPerSample
        type: int
        value: "4"
      - doc: "doorMinBits is the smallest doorkeeper: one word."
        name: doorMinBits
        type: int
        value: "64"
      - doc: doorMaxBits caps the doorkeeper at 2^30 bits (128 MiB).
        name: doorMaxBits
        type: int
        value: 1 << 30
      - doc: |-
          doorMixLow and doorMixHigh spread a hash into the doorkeeper's three
          bit positions.
        name: doorMixLow
        type: uint64
        value: "0x9e3779b97f4a7c15"
      - doc: doorMixHigh is the second multiplier, for the third position.
        name: doorMixHigh
        type: uint64
        value: "0xc2b2ae3d27d4eb4f"
    name: sketchSample
  - grouped: true
    items:
      - doc: |-
          windowShare is W-TinyLFU's window against the bound, written as the
          divisor it is used as: a hundredth.
        name: windowShare
        type: int
        value: "100"
      - doc: protectedFifths is the protected segment's share of main, in fifths.
        name: protectedFifths
        type: int
        value: "4"
      - doc: fifths divides a share in fifths.
        name: fifths
        type: int
        value: "5"
      - doc: |-
          admitAtLeast is the estimate a candidate needs to replace a key of
          main: two uses — the doorkeeper's and one counted —, so a key used once,
          a scan's or the long tail's, never displaces one.
        name: admitAtLeast
        type: uint64
        value: "2"
    name: windowShare
