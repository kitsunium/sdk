imports:
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  iter: iter
  maphash: hash/maphash
  math: math
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/collections/cache
  name: cache
  purpose: Package cache provides a generic, concurrency-safe LRU + TTL cache (Cache[K,V]) — a kernel primitive (stdlib-only, no domain vocabulary).
types:
  - fields:
      - doc: |-
          mu serialises every call: a sync.Mutex, whose uncontended lock and
          unlock are one atomic each and inlined — a RWMutex's write lock costs
          four, and only Len and Stats ever read shared (#1038).
        name: mu
        type: sync.Mutex
      - doc: core is the cache itself; every access holds mu.
        name: core
        type: UnlockedMap[K, V]
      - doc: |-
          The padding keeps the counters every operation writes off the cache line of the
          mutex of whatever is allocated next — in a Striped, the next stripe.
        name: _
        type: "[cacheLine]byte"
    kind: struct
    methods:
      - name: Fetch
        params: key K
        recv: c *Cache[K, V]
        results: value V, ok bool
      - name: Set
        params: key K, val V
        recv: c *Cache[K, V]
      - name: SetTTL
        params: key K, val V, ttl time.Duration
        recv: c *Cache[K, V]
      - doc: |-
          setTTL inserts or updates key=val under the lock, computing the deadline
          and applying eviction when a bound is exceeded.
        name: setTTL
        params: key K, val V, ttl time.Duration
        recv: c *Cache[K, V]
      - name: Delete
        params: key K
        recv: c *Cache[K, V]
      - name: Expire
        recv: c *Cache[K, V]
        results: int
      - name: Keys
        recv: c *Cache[K, V]
        results: iter.Seq[K]
      - doc: keySnapshot copies the keys present and unexpired, under the lock.
        name: keySnapshot
        recv: c *Cache[K, V]
        results: "[]K"
      - name: Len
        recv: c *Cache[K, V]
        results: int
      - name: Purge
        recv: c *Cache[K, V]
      - name: Stats
        recv: c *Cache[K, V]
        results: StatsValue
    name: Cache
    typeParams: K comparable, V any
  - fields:
      - doc: MaxEntries caps the live entry count (LRU eviction above it). 0 = unbounded.
        name: MaxEntries
        type: int
      - doc: DefaultTTL applies to Set entries (SetTTL overrides per-entry). 0 = no expiry.
        name: DefaultTTL
        type: time.Duration
      - doc: Clock is the time source (injectable for tests). nil = clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          OnEvict, if non-nil, is called with the key+value of every entry removed by
          capacity eviction or expiry (not by an explicit Delete/Set-overwrite).
        name: OnEvict
        type: func(key K, val V)
      - doc: |-
          MaxWeight caps the summed weight of the live entries, evicting above it as
          MaxEntries does; both apply when both are set. 0 = unbounded. An entry
          heavier than MaxWeight alone is stored and evicts every other entry: the
          primitive has no error to refuse it with.
        name: MaxWeight
        type: int64
      - doc: |-
          WeightOf, if non-nil, weighs an entry when it is stored; a negative answer
          counts as 0, and one above math.MaxInt32 as math.MaxInt32. nil = every
          entry weighs 1, so MaxWeight is then a count.
        name: WeightOf
        type: func(key K, val V) int64
      - doc: |-
          Policy chooses the victim when the cache is full. The zero value is
          PolicyLRU.
        name: Policy
        type: Policy
    kind: struct
    name: Config
    typeParams: K comparable, V any
  - doc: |-
      deadlineSlot is one cell of the expiry heap: the deadline, held inline so a
      comparison reads no entry, and the entry it belongs to.
    fields:
      - name: at
        type: int64
      - name: ent
        type: "*entry[K, V]"
    kind: struct
    name: deadlineSlot
    typeParams: K comparable, V any
  - doc: |-
      deadlineHeap orders the entries that carry a deadline, earliest first: a
      4-ary min-heap over int64 deadlines (#1038). Each entry knows its cell — its
      slot is the index plus one — so a re-stamp or a removal from anywhere costs
      O(log n) without a search, and no comparison goes through a function value.
      It replaced kernel/collections/heap's IndexedHeap here, whose comparison is
      an indirect call that dereferences two entries; that heap stays for its
      other users. A slot is 32 bits: four billion deadlines is past what the
      memory of the entries holding them allows. Caller holds the cache's lock.
    fields:
      - doc: slots is the heap array; nil until the first deadline.
        name: slots
        type: "[]deadlineSlot[K, V]"
    kind: struct
    methods:
      - doc: size reports how many entries carry a deadline.
        name: size
        recv: h *deadlineHeap[K, V]
        results: int
      - doc: |-
          top returns the entry with the earliest deadline and that deadline, or nil
          when no entry carries one.
        name: top
        recv: h *deadlineHeap[K, V]
        results: "*entry[K, V], int64"
      - doc: push adds ent, which carries no deadline yet, at deadline at.
        name: push
        params: ent *entry[K, V], at int64
        recv: h *deadlineHeap[K, V]
      - doc: fix moves ent, already in the heap, to its new deadline at.
        name: fix
        params: ent *entry[K, V], at int64
        recv: h *deadlineHeap[K, V]
      - doc: remove takes ent, which is in the heap, out of it.
        name: remove
        params: ent *entry[K, V]
        recv: h *deadlineHeap[K, V]
      - doc: |-
          up moves the cell at index toward the root while its deadline is earlier
          than its parent's, keeping every entry's slot in step, and reports whether
          it moved.
        name: up
        params: index int
        recv: h *deadlineHeap[K, V]
        results: bool
      - doc: |-
          down moves the cell at index toward the leaves while a child's deadline is
          earlier, keeping every entry's slot in step.
        name: down
        params: index int
        recv: h *deadlineHeap[K, V]
      - doc: place writes cell at index and tells its entry where it is.
        name: place
        params: index int, cell deadlineSlot[K, V]
        recv: h *deadlineHeap[K, V]
    name: deadlineHeap
    typeParams: K comparable, V any
  - doc: queueID names the list an entry sits in.
    kind: named
    name: queueID
    underlying: uint8
  - doc: |-
      entry is one cache slot: it holds the key (so eviction can delete it from the
      map), the value, the prev/next links of the intrusive list it sits in (head =
      most recently inserted or promoted, tail = the next victim), and an optional
      deadline.

      The layout is a budget (#1038): for a string key and a word-sized value the
      node is 58 bytes, so it lands in the 64-byte size class — one class, and one
      cache line, since the runtime places an object of that class on a 64-byte
      boundary. A time.Time deadline (24 bytes) and a heap handle (8) had taken it
      to 80 bytes, two lines, and every insertion paid the larger class.
    fields:
      - name: key
        type: K
      - name: val
        type: V
      - name: prev
        type: "*entry[K, V]"
      - name: next
        type: "*entry[K, V]"
      - doc: |-
          deadline is when the entry expires, in nanoseconds since the cache's
          epoch (see UnlockedMap.deadlineAfter); meaningful only while slot is set.
        name: deadline
        type: int64
      - doc: |-
          slot is the entry's position in the expiry heap plus one, and 0 while
          it carries no deadline.
        name: slot
        type: uint32
      - doc: |-
          weight is what the entry counts against MaxWeight: WeightOf's answer,
          or 1 without one.
        name: weight
        type: int32
      - doc: |-
          freq counts the hits since admission or the last demotion, capped at
          maxFreq (S3-FIFO only).
        name: freq
        type: uint8
      - doc: queue says which list the entry sits in (S3-FIFO only; LRU uses main).
        name: queue
        type: queueID
    kind: struct
    name: entry
    typeParams: K comparable, V any
  - doc: |-
      evictionValue is one evicted key/value pair, captured BY VALUE at eviction
      time. Copying is deliberate: the *entry it came from is unlinked and may be
      reused or collected before the observer runs, so holding the pointer would
      hand the callback a node the cache no longer owns.
    fields:
      - name: key
        type: K
      - name: val
        type: V
    kind: struct
    name: evictionValue
    typeParams: K comparable, V any
  - doc: |-
      ghostSet is S3-FIFO's ghost queue: the hashes of the keys the small queue
      evicted without a hit, oldest first, bounded. A key it remembers skips
      probation on its next admission. It holds hashes, never keys or values, so
      a remembered key costs a few words whatever K is; a collision admits a
      stranger into main, which costs at worst one misplaced entry.
    fields:
      - doc: seed keys the hash; fixed for the cache's life.
        name: seed
        type: maphash.Seed
      - doc: ring is the FIFO of hashes; head indexes the oldest of size live ones.
        name: ring
        type: "[]uint64"
      - name: head
        type: int
      - name: size
        type: int
      - doc: members counts each hash's occurrences in the ring.
        name: members
        type: map[uint64]uint32
    kind: struct
    methods:
      - doc: remembers reports whether key's hash is in the ring.
        name: remembers
        params: key K
        recv: g *ghostSet[K]
        results: bool
      - doc: |-
          add remembers key, forgetting the oldest hashes while the ring holds bound
          or more.
        name: add
        params: key K, bound int
        recv: g *ghostSet[K]
      - doc: dropOldest forgets the oldest hash.
        name: dropOldest
        recv: g *ghostSet[K]
      - doc: grow doubles the ring, never past bound, keeping the hashes oldest first.
        name: grow
        params: bound int
        recv: g *ghostSet[K]
      - doc: reset forgets everything, keeping the ring's array.
        name: reset
        recv: g *ghostSet[K]
    name: ghostSet
    typeParams: K comparable
  - doc: |-
      entryList is an intrusive doubly-linked list of entries with its count and
      summed weight: head = most recently inserted or promoted, tail = the next
      victim. Caller holds the cache's lock for every method.
    fields:
      - name: head
        type: "*entry[K, V]"
      - name: tail
        type: "*entry[K, V]"
      - name: count
        type: int
      - name: weight
        type: int64
    kind: struct
    methods:
      - doc: pushFront inserts ent at the head. ent MUST be detached.
        name: pushFront
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
      - doc: unlink detaches ent from the list, fixing head and tail.
        name: unlink
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
      - doc: |-
          moveFront promotes ent, which sits in the list, to the head. It relinks
          pointers only: the entry never leaves the list, so its count and summed
          weight stay as they are, and a hit writes neither (#1038).
        name: moveFront
        params: ent *entry[K, V]
        recv: l *entryList[K, V]
    name: entryList
    typeParams: K comparable, V any
  - kind: named
    name: Policy
    underlying: uint8
  - fields:
      - name: Hits
        type: uint64
      - name: Misses
        type: uint64
      - name: Evictions
        type: uint64
      - doc: |-
          Weight is the summed weight of the live entries when the cache weighs
          them — Config.MaxWeight or Config.WeightOf set — and 0 when it does not.
        name: Weight
        type: int64
      - doc: |-
          Policy is the eviction policy that runs: Config.Policy, or PolicyLRU
          for a value the cache does not know.
        name: Policy
        type: Policy
    kind: struct
    name: StatsValue
  - fields:
      - name: stripes
        type: "[]*Cache[K, V]"
      - doc: hash is the caller's, or nil for maphash over seed.
        name: hash
        type: func(key K) uint64
      - name: seed
        type: maphash.Seed
    kind: struct
    methods:
      - doc: stripe returns the Cache key lands in.
        name: stripe
        params: key K
        recv: s *Striped[K, V]
        results: "*Cache[K, V]"
      - name: Fetch
        params: key K
        recv: s *Striped[K, V]
        results: value V, ok bool
      - name: Set
        params: key K, val V
        recv: s *Striped[K, V]
      - name: SetTTL
        params: key K, val V, ttl time.Duration
        recv: s *Striped[K, V]
      - name: Delete
        params: key K
        recv: s *Striped[K, V]
      - name: Expire
        recv: s *Striped[K, V]
        results: int
      - name: Keys
        recv: s *Striped[K, V]
        results: iter.Seq[K]
      - name: Len
        recv: s *Striped[K, V]
        results: int
      - name: Purge
        recv: s *Striped[K, V]
      - name: Stats
        recv: s *Striped[K, V]
        results: StatsValue
      - name: Stripes
        recv: s *Striped[K, V]
        results: int
    name: Striped
    typeParams: K comparable, V any
  - fields:
      - name: clk
        type: clock.Clock
      - name: maxEntries
        type: int
      - name: maxWeight
        type: int64
      - name: weightOf
        type: func(key K, val V) int64
      - name: defaultTTL
        type: time.Duration
      - name: onEvict
        type: func(key K, val V)
      - name: policy
        type: Policy
      - name: items
        type: map[K]*entry[K, V]
      - doc: main is the LRU list, and S3-FIFO's main queue.
        name: main
        type: entryList[K, V]
      - doc: small is S3-FIFO's probationary queue; empty under LRU.
        name: small
        type: entryList[K, V]
      - doc: ghost remembers the keys probation evicted (S3-FIFO only).
        name: ghost
        type: ghostSet[K]
      - doc: expiry orders the entries that carry a deadline, earliest first.
        name: expiry
        type: deadlineHeap[K, V]
      - doc: |-
          epoch is the instant every deadline counts from: the clock's reading at
          the first deadline, set once epochSet says it was read.
        name: epoch
        type: time.Time
      - name: epochSet
        type: bool
      - name: hits
        type: uint64
      - name: misses
        type: uint64
      - name: evictions
        type: uint64
    kind: struct
    methods:
      - doc: |-
          admit places a new entry: at the front of the LRU list, or for S3-FIFO in
          the small queue — main when the ghost remembers its key. Caller holds the lock.
        name: admit
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          touch records a hit: LRU promotes the entry, S3-FIFO counts it. Caller
          holds the lock.
        name: touch
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          evictOne removes one entry by the policy, never fresh — the entry the
          current Set wrote — and reports whether it found a victim. Caller holds the lock.
        name: evictOne
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          evictS3FIFO evicts from the small queue while it holds its share or main is
          empty, from main otherwise, and falls back to the other queue when the
          first has nothing it may evict. Caller holds the lock.
        name: evictS3FIFO
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          smallIsLarge reports whether the small queue holds its tenth of the bound
          that applies. Caller holds the lock.
        name: smallIsLarge
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          evictSmall walks the small queue from its tail: an entry hit since its
          admission moves to main with its counter cleared, the first one never hit
          is evicted and its key remembered by the ghost. Caller holds the lock.
        name: evictSmall
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          evictMain is main's clock hand: the tail with hits left is re-inserted at
          the head with one hit fewer, the first without any is evicted. Caller holds
          the lock.
        name: evictMain
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          ghostBound is how many hashes the ghost keeps: the entry bound when there is
          one, else the live count. Caller holds the lock.
        name: ghostBound
        recv: c *UnlockedMap[K, V]
        results: int
      - doc: init configures c from cfg; NewUnlockedMap and NewCache share it.
        name: init
        params: cfg Config[K, V]
        recv: c *UnlockedMap[K, V]
      - name: Fetch
        params: key K
        recv: c *UnlockedMap[K, V]
        results: value V, ok bool
      - name: Set
        params: key K, val V
        recv: c *UnlockedMap[K, V]
      - name: SetTTL
        params: key K, val V, ttl time.Duration
        recv: c *UnlockedMap[K, V]
      - name: Delete
        params: key K
        recv: c *UnlockedMap[K, V]
      - name: Expire
        recv: c *UnlockedMap[K, V]
        results: int
      - name: Keys
        recv: c *UnlockedMap[K, V]
        results: iter.Seq[K]
      - name: Len
        recv: c *UnlockedMap[K, V]
        results: int
      - name: Purge
        recv: c *UnlockedMap[K, V]
      - name: Stats
        recv: c *UnlockedMap[K, V]
        results: StatsValue
      - doc: |-
          fetch looks key up, reaping it when its deadline has passed, and records a
          hit by the policy. Caller holds the lock.
        name: fetch
        params: key K, pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: value V, ok bool
      - doc: |-
          set inserts or updates key=val with ttl (0 or less = no deadline), and
          applies the bounds. Caller holds the lock.
        name: set
        params: key K, val V, ttl time.Duration, pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          overwrite refreshes a live entry's value, weight and deadline, and records
          the write as a hit would be recorded. Caller holds the lock.
        name: overwrite
        params: ent *entry[K, V], val V, timed bool, at int64, pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          remove takes key out, if present, without an eviction. Caller holds the
          lock.
        name: remove
        params: key K
        recv: c *UnlockedMap[K, V]
      - doc: |-
          expire evicts every entry whose deadline has passed, the clock read once,
          and reports how many. Caller holds the lock.
        name: expire
        params: pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
        results: int
      - doc: keySnapshot copies the keys present and unexpired. Caller holds the lock.
        name: keySnapshot
        recv: c *UnlockedMap[K, V]
        results: "[]K"
      - doc: |-
          deadlineAfter returns the deadline ttl (positive) from now, in nanoseconds
          since the epoch, the first call fixing the epoch. The difference of two
          clock readings is taken on their monotonic readings when both carry one,
          as time.Time.Before compares them, so a deadline means what a time.Time
          deadline meant; a sum past the int64 range — a TTL of centuries — is held
          at its maximum. Caller holds the lock.
        name: deadlineAfter
        params: ttl time.Duration
        recv: c *UnlockedMap[K, V]
        results: int64
      - doc: |-
          sinceEpoch reads the clock as nanoseconds since the epoch. Called only once
          some entry carries a deadline, so the epoch is set. Caller holds the lock.
        name: sinceEpoch
        recv: c *UnlockedMap[K, V]
        results: int64
      - doc: |-
          setDeadline gives ent the deadline at, keeping the expiry heap in step.
          Caller holds the lock.
        name: setDeadline
        params: ent *entry[K, V], at int64
        recv: c *UnlockedMap[K, V]
      - doc: |-
          clearDeadline takes ent's deadline away, if it had one. Caller holds the
          lock.
        name: clearDeadline
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: weigh returns what key=val counts against MaxWeight.
        name: weigh
        params: key K, val V
        recv: c *UnlockedMap[K, V]
        results: int32
      - doc: |-
          reweigh changes ent's weight in place, keeping its list's sum. Caller holds
          the lock.
        name: reweigh
        params: ent *entry[K, V], weight int32
        recv: c *UnlockedMap[K, V]
      - doc: |-
          overCapacity reports whether a bound is exceeded. The weight bound never
          asks a lone entry to leave: an entry heavier than MaxWeight is stored and
          evicts everything else. Caller holds the lock.
        name: overCapacity
        recv: c *UnlockedMap[K, V]
        results: bool
      - doc: |-
          evictIfNeeded removes entries while a bound is exceeded, never fresh — the
          entry the current Set wrote. An entry whose deadline has passed goes before
          any live one: the heap's top is tried first, so a dead entry never costs a
          live one its slot. Caller holds the lock.
        name: evictIfNeeded
        params: fresh *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          removeEvict detaches ent, counts an eviction, and QUEUES the evicted pair
          onto pending. Caller holds the lock.

          OnEvict is deliberately NOT invoked here. Under a Cache every caller holds
          its mutex and sync.Mutex is not reentrant, so a callback that touches the
          cache would deadlock outright, and a merely slow one would hold every other
          operation off for its whole duration — turning eviction into an unbounded
          critical section; and an UnlockedMap must be consistent before user code runs.
          Callers drain pending through notifyEvicted once the operation is done.
        name: removeEvict
        params: ent *entry[K, V], pending *[]evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          detach takes ent out of its list, the expiry heap and the map. Caller holds
          the lock.
        name: detach
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: |-
          notifyEvicted fires OnEvict for every queued pair. Under a Cache it MUST be
          called with the mutex released — the callback is user code and may re-enter
          the cache.
        name: notifyEvicted
        params: pending []evictionValue[K, V]
        recv: c *UnlockedMap[K, V]
      - doc: listOf returns the list ent sits in. Caller holds the lock.
        name: listOf
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
        results: "*entryList[K, V]"
      - doc: unlink detaches ent from its list, fixing head/tail. Caller holds the lock.
        name: unlink
        params: ent *entry[K, V]
        recv: c *UnlockedMap[K, V]
    name: UnlockedMap
    typeParams: K comparable, V any
