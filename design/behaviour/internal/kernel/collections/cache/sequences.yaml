          when: c.clk == nil
      - set: c.maxEntries
        value: max(cfg.MaxEntries, 0)
      - set: c.maxWeight
        value: max(cfg.MaxWeight, 0)
      - set: c.weightOf
        value: cfg.WeightOf
      - set: c.defaultTTL
        value: cfg.DefaultTTL
      - set: c.onEvict
        value: cfg.OnEvict
      - set: c.policy
        value: PolicyLRU
      - set: c.items
        value: make(map[K]*entry[K, V], c.maxEntries)
      - opt:
          do:
            - set: c.policy
              value: PolicyS3FIFO
            - set: c.ghost
              to: newGhostSet
              value: newGhostSet[K]()
          when: cfg.Policy == PolicyS3FIFO
  - of: (*UnlockedMap).Fetch
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Fetch
        kind: self
      - id: c.fetch
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - set: value, ok
        to: c.fetch
        value: c.fetch(key, &pending)
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
      - return: value, ok
  - of: (*UnlockedMap).Set
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Set
        kind: self
      - id: c.set
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - eval: c.set(key, val, c.defaultTTL, &pending)
        to: c.set
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
  - of: (*UnlockedMap).SetTTL
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).SetTTL
        kind: self
      - id: c.set
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - eval: c.set(key, val, ttl, &pending)
        to: c.set
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
  - of: (*UnlockedMap).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Delete
        kind: self
      - id: c.remove
        kind: internal
    steps:
      - eval: c.remove(key)
        to: c.remove
  - of: (*UnlockedMap).Expire
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Expire
        kind: self
      - id: c.expire
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - bind: reaped
        eval: c.expire(&pending)
        to: c.expire
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
      - return: reaped
  - of: (*UnlockedMap).Keys
    steps:
      - return:
          closure:
            params: yield func(K) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(key)"
                  key: _
                  range: c.keySnapshot()
                  value: key
  - of: (*UnlockedMap).Len
    steps:
      - return: len(c.items)
  - of: (*UnlockedMap).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Purge
        kind: self
      - id: c.ghost.reset
        kind: internal
    steps:
      - set: c.items
        value: make(map[K]*entry[K, V], c.maxEntries)
      - set: c.main
        value: entryList[K, V]{}
      - set: c.small
        value: entryList[K, V]{}
      - set: c.expiry
        value: deadlineHeap[K, V]{}
      - opt:
          do:
            - eval: c.ghost.reset()
              to: c.ghost.reset
          when: c.policy == PolicyS3FIFO
  - of: (*UnlockedMap).Stats
    steps:
      - var:
          name: weight
          type: int64
      - opt:
          do:
            - set: weight
              value: c.main.weight + c.small.weight
          when: c.maxWeight > 0 || c.weightOf != nil
      - return: "StatsValue{Hits: c.hits, Misses: c.misses, Evictions: c.evictions, Weight: weight, Policy: c.policy}"
  - of: (*UnlockedMap).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).fetch
        kind: self
      - id: c.removeEvict
        kind: internal
      - id: c.touch
        kind: internal
      - id: c.main.moveFront
        kind: internal
    steps:
      - bind: ent
        eval: c.items[key]
      - opt:
          do:
            - opt:
                do:
                  - eval: c.removeEvict(ent, pending)
                    to: c.removeEvict
                when: ent != nil
            - op: ++
              set: c.misses
            - var:
                name: zero
                type: V
            - return: zero, false
          when: ent == nil || (ent.slot != 0 && c.sinceEpoch() >= ent.deadline)
      - alt:
          - do:
              - eval: c.touch(ent)
                to: c.touch
            when: c.policy == PolicyS3FIFO
          - do:
              - eval: c.main.moveFront(ent)
                to: c.main.moveFront
            else: true
      - op: ++
        set: c.hits
      - return: ent.val, true
  - of: (*UnlockedMap).set
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).set
        kind: self
      - id: c.deadlineAfter
        kind: internal
      - id: c.overwrite
        kind: internal
      - id: c.weigh
        kind: internal
      - id: c.admit
        kind: internal
      - id: c.main.pushFront
        kind: internal
      - id: c.setDeadline
        kind: internal
      - id: c.evictIfNeeded
        kind: internal
    steps:
      - var:
          name: at
          type: int64
      - opt:
          do:
            - set: at
              to: c.deadlineAfter
              value: c.deadlineAfter(ttl)
          when: ttl > 0
      - opt:
          do:
            - eval: c.overwrite(ent, val, ttl > 0, at, pending)
              to: c.overwrite
            - return: ""
          init:
            bind: ent
            eval: c.items[key]
          when: ent != nil
      - bind: ent
        eval: "&entry[K, V]{key: key, val: val, weight: 1}"
      - opt:
          do:
            - set: ent.weight
              to: c.weigh
              value: c.weigh(key, val)
          when: c.weightOf != nil
      - set: c.items[key]
        value: ent
      - alt:
          - do:
              - eval: c.admit(ent)
                to: c.admit
            when: c.policy == PolicyS3FIFO
          - do:
              - eval: c.main.pushFront(ent)
                to: c.main.pushFront
            else: true
      - opt:
          do:
            - eval: c.setDeadline(ent, at)
              to: c.setDeadline
          when: ttl > 0
      - opt:
          do:
            - eval: c.evictIfNeeded(ent, pending)
              to: c.evictIfNeeded
          when: c.maxEntries > 0 || c.maxWeight > 0
  - of: (*UnlockedMap).overwrite
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).overwrite
        kind: self
      - id: c.reweigh
        kind: internal
      - id: c.setDeadline
        kind: internal
      - id: c.clearDeadline
        kind: internal
      - id: c.touch
        kind: internal
      - id: c.evictIfNeeded
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.reweigh(ent, c.weigh(ent.key, val))
              to: c.reweigh
          when: c.weightOf != nil
      - set: ent.val
        value: val
      - alt:
          - do:
              - eval: c.setDeadline(ent, at)
                to: c.setDeadline
            when: timed
          - do:
              - eval: c.clearDeadline(ent)
                to: c.clearDeadline
            else: true
      - eval: c.touch(ent)
        to: c.touch
      - opt:
          do:
            - eval: c.evictIfNeeded(ent, pending)
              to: c.evictIfNeeded
          when: c.maxWeight > 0
  - of: (*UnlockedMap).remove
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).remove
        kind: self
      - id: c.detach
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.detach(ent)
              to: c.detach
          init:
            bind: ent
            eval: c.items[key]
          when: ent != nil
  - of: (*UnlockedMap).expire
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).expire
        kind: self
      - id: c.sinceEpoch
        kind: internal
      - id: c.expiry.top
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: c.expiry.size() == 0
      - bind: now
        eval: c.sinceEpoch()
        to: c.sinceEpoch
      - bind: reaped
        eval: "0"
      - loop:
          do:
            - bind: top, at
              eval: c.expiry.top()
              to: c.expiry.top
            - opt:
                do:
                  - return: reaped
                when: top == nil || now < at
            - eval: c.removeEvict(top, pending)
              to: c.removeEvict
            - op: ++
              set: reaped
          forever: true
  - of: (*UnlockedMap).deadlineAfter
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).deadlineAfter
        kind: self
      - id: c.clk.Now
        kind: value
      - id: now.Sub
        kind: value
    steps:
      - bind: now
        eval: c.clk.Now()
        to: c.clk.Now
      - opt:
          do:
            - set: c.epoch, c.epochSet
              value: now, true
          when: "!c.epochSet"
      - bind: since
        eval: now.Sub(c.epoch)
        to: now.Sub
      - opt:
          do:
            - return: math.MaxInt64
          when: since > math.MaxInt64-ttl
      - return: int64(since + ttl)
  - of: (*UnlockedMap).sinceEpoch
    steps:
      - return: int64(c.clk.Now().Sub(c.epoch))
  - of: (*UnlockedMap).setDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).setDeadline
        kind: self
      - id: c.expiry.fix
        kind: internal
      - id: c.expiry.push
        kind: internal
    steps:
      - set: ent.deadline
        value: at
      - opt:
          do:
            - eval: c.expiry.fix(ent, at)
              to: c.expiry.fix
            - return: ""
          when: ent.slot != 0
      - eval: c.expiry.push(ent, at)
        to: c.expiry.push
  - of: (*UnlockedMap).clearDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).clearDeadline
        kind: self
      - id: c.expiry.remove
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.expiry.remove(ent)
              to: c.expiry.remove
          when: ent.slot != 0
      - set: ent.deadline
        value: "0"
  - of: (*UnlockedMap).weigh
    steps:
      - opt:
          do:
            - return: "1"
          when: c.weightOf == nil
      - return: int32(min(max(c.weightOf(key, val), 0), math.MaxInt32))
  - of: (*UnlockedMap).reweigh
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).reweigh
        kind: self
      - id: c.listOf
        kind: internal
    steps:
      - bind: list
        eval: c.listOf(ent)
        to: c.listOf
      - op: +=
        set: list.weight
        value: int64(weight) - int64(ent.weight)
      - set: ent.weight
        value: weight
  - of: (*UnlockedMap).overCapacity
    steps:
      - bind: count
        eval: len(c.items)
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && count > c.maxEntries
      - return: c.maxWeight > 0 && count > 1 && c.main.weight+c.small.weight > c.maxWeight
  - of: (*UnlockedMap).evictIfNeeded
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictIfNeeded
        kind: self
      - id: c.expiry.top
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!c.overCapacity()"
      - var:
          name: now
          type: int64
      - bind: read
        eval: "false"
      - loop:
          cond: c.overCapacity()
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - set: now, read
                          value: c.sinceEpoch(), true
                      when: "!read"
                  - opt:
                      do:
                        - eval: c.removeEvict(top, pending)
                          to: c.removeEvict
                        - continue: true
                      init:
                        bind: top, at
                        eval: c.expiry.top()
                        to: c.expiry.top
                      when: top != fresh && now >= at
                when: c.expiry.size() > 0
            - opt:
                do:
                  - return: ""
                when: "!c.evictOne(fresh, pending)"
  - of: (*UnlockedMap).removeEvict
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).removeEvict
        kind: self
      - id: c.detach
        kind: internal
    steps:
      - eval: c.detach(ent)
        to: c.detach
      - op: ++
        set: c.evictions
      - opt:
          do:
            - set: "*pending"
              value: "append(*pending, evictionValue[K, V]{key: ent.key, val: ent.val})"
          when: c.onEvict != nil
  - of: (*UnlockedMap).detach
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).detach
        kind: self
      - id: c.unlink
        kind: internal
      - id: c.expiry.remove
        kind: internal
    steps:
      - eval: c.unlink(ent)
        to: c.unlink
      - opt:
          do:
            - eval: c.expiry.remove(ent)
              to: c.expiry.remove
          when: ent.slot != 0
      - eval: delete(c.items, ent.key)
  - of: (*UnlockedMap).notifyEvicted
    steps:
      - opt:
          do:
            - return: ""
          when: len(pending) == 0
      - loop:
          do:
            - eval: c.onEvict(ev.key, ev.val)
          key: _
          range: pending
          value: ev
  - of: (*UnlockedMap).listOf
    steps:
      - opt:
          do:
            - return: "&c.small"
          when: ent.queue == queueSmall
      - return: "&c.main"
  - of: (*UnlockedMap).unlink
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).unlink
        kind: self
      - id: c.listOf(ent).unlink
        kind: internal
    steps:
      - eval: c.listOf(ent).unlink(ent)
        to: c.listOf(ent).unlink
