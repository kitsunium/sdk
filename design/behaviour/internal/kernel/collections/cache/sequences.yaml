        value: entryList[K, V]{}
      - set: c.small
        value: entryList[K, V]{}
      - set: c.expiry
        value: nil
      - opt:
          do:
            - eval: c.ghost.reset()
              to: c.ghost.reset
          when: c.policy == PolicyS3FIFO
