          do:
            - opt:
                do:
                  - eval: c.expiry.Remove(ent.expiry)
                    to: c.expiry.Remove
                  - set: ent.expiry
                    value: heap.Handle{}
                when: ent.expiry != (heap.Handle{})
            - return: ""
          when: exp.IsZero()
      - opt:
          do:
            - set: c.expiry
              to: heap
              value: heap.NewIndexed(byDeadline[K, V])
          when: c.expiry == nil
      - opt:
          do:
            - eval: c.expiry.Update(ent.expiry, ent)
              to: c.expiry.Update
            - return: ""
          when: ent.expiry != (heap.Handle{})
