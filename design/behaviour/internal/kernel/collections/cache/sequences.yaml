    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictOne
        kind: self
      - id: c.evictS3FIFO
        kind: internal
      - id: c.evictTinyLFU
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - switch:
          cases:
            - case: PolicyS3FIFO
              do:
                - return: c.evictS3FIFO(fresh, pending)
                  to: c.evictS3FIFO
            - case: PolicyTinyLFU
              do:
                - return: c.evictTinyLFU(fresh, pending)
                  to: c.evictTinyLFU
            - default: true
              do:
                - bind: victim
                  eval: c.main.tail
                - opt:
                    do:
                      - return: "false"
                    when: victim == nil || victim == fresh
                - eval: c.removeEvict(victim, pending)
                  to: c.removeEvict
                - return: "true"
          "on": c.policy
  - of: (*UnlockedMap).admitS3FIFO
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).admitS3FIFO
        kind: self
      - id: c.main.pushFront
        kind: internal
      - id: c.small.pushFront
        kind: internal
    steps:
      - opt:
          do:
            - set: ent.queue
              value: queueMain
            - eval: c.main.pushFront(ent)
              to: c.main.pushFront
            - return: ""
          when: c.ghost.remembers(ent.key)
      - set: ent.queue
        value: queueSmall
      - eval: c.small.pushFront(ent)
        to: c.small.pushFront
  - of: (*UnlockedMap).evictS3FIFO
    steps:
      - opt:
          do:
            - return: c.evictSmall(fresh, pending) || c.evictMain(fresh, pending)
          when: c.small.count > 0 && (c.main.count == 0 || c.smallIsLarge())
      - return: c.evictMain(fresh, pending) || c.evictSmall(fresh, pending) || c.evictMain(fresh, pending)
  - of: (*UnlockedMap).smallIsLarge
    steps:
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && c.small.count*smallShare >= c.maxEntries
      - return: c.maxWeight > 0 && c.small.weight*int64(smallShare) >= c.maxWeight
  - of: (*UnlockedMap).evictSmall
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictSmall
        kind: self
      - id: c.small.unlink
        kind: internal
      - id: c.main.pushFront
        kind: internal
      - id: c.ghost.add
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - loop:
          cond: victim != nil
          do:
            - bind: newer
              eval: victim.prev
            - opt:
                do:
                  - set: victim
                    value: newer
                  - continue: true
                when: victim == fresh
            - opt:
                do:
                  - eval: c.small.unlink(victim)
                    to: c.small.unlink
                  - set: victim.freq
                    value: "0"
                  - set: victim.queue
                    value: queueMain
                  - eval: c.main.pushFront(victim)
                    to: c.main.pushFront
                  - set: victim
                    value: newer
                  - continue: true
                when: victim.freq > 0
            - eval: c.ghost.add(victim.key, c.ghostBound())
              to: c.ghost.add
            - eval: c.removeEvict(victim, pending)
              to: c.removeEvict
            - return: "true"
          init: victim := c.small.tail
      - return: "false"
  - of: (*UnlockedMap).evictMain
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictMain
        kind: self
      - id: c.main.moveFront
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - loop:
          cond: budget > 0
          do:
            - bind: victim
              eval: c.main.tail
            - opt:
                do:
                  - return: "false"
                when: victim == nil
            - opt:
                do:
                  - opt:
                      do:
                        - return: "false"
                      when: victim == fresh && c.main.count == 1
                  - opt:
                      do:
                        - op: "--"
                          set: victim.freq
                      when: victim.freq > 0
                  - eval: c.main.moveFront(victim)
                    to: c.main.moveFront
                  - continue: true
                when: victim.freq > 0 || victim == fresh
            - eval: c.removeEvict(victim, pending)
              to: c.removeEvict
            - return: "true"
          init: budget := c.main.count*int(maxFreq+1) + 1
          post: budget--
      - return: "false"
  - of: (*UnlockedMap).ghostBound
    steps:
      - opt:
          do:
            - return: max(c.maxEntries/ghostShare, 1)
          when: c.maxEntries > 0
      - return: max(len(c.items)/ghostShare, 1)
  - of: (*frequencySketch).size
    steps:
      - set: entries
        value: min(max(entries, 1), sketchMaxEntries)
      - bind: blocks
        eval: "1"
      - loop:
          cond: blocks*blockWords < entries
          do:
            - op: <<=
              set: blocks
              value: "1"
      - bind: table
        eval: make([]sketchBlock, blocks)
      - set: s.blocks
        value: table
      - set: s.blockMask
        value: uint32(blocks) - 1
      - set: s.additions
        value: "0"
      - set: s.sampleSize
        value: sketchSample * entries
      - bind: bits
        eval: doorMinBits
      - loop:
          cond: bits/doorBitsPerSample < s.sampleSize && bits < doorMaxBits
          do:
            - op: <<=
              set: bits
              value: "1"
      - bind: door
        eval: make([]uint64, bits/doorMinBits)
      - set: s.door
        value: door
      - set: s.doorMask
        value: uint32(bits - 1)
  - of: (*frequencySketch).fit
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).fit
        kind: self
      - id: s.size
        kind: internal
    steps:
      - bind: words
        eval: len(s.blocks) * blockWords
      - opt:
          do:
            - return: ""
          when: entries <= words || words >= sketchMaxEntries
      - eval: s.size(entries)
        to: s.size
  - of: (*frequencySketch).clear
    steps:
      - eval: clear(s.blocks)
      - eval: clear(s.door)
      - set: s.additions
        value: "0"
  - of: (*frequencySketch).record
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).record
        kind: self
      - id: s.doorCells
        kind: internal
      - id: s.increment
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(s.blocks) == 0
      - bind: first, second, third
        eval: s.doorCells(hash)
        to: s.doorCells
      - set: "*seen"
        value: s.period
      - opt:
          do:
            - eval: s.increment(hash)
              to: s.increment
            - return: ""
          when: s.doorHolds(first, second, third)
      - op: "|="
        set: s.door[first>>6]
        value: 1 << (first & 63)
      - op: "|="
        set: s.door[second>>6]
        value: 1 << (second & 63)
      - op: "|="
        set: s.door[third>>6]
        value: 1 << (third & 63)
  - of: (*frequencySketch).touch
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).touch
        kind: self
      - id: s.increment
        kind: internal
      - id: s.record
        kind: internal
    steps:
      - opt:
          do:
            - eval: s.increment(hash)
              to: s.increment
            - return: ""
          when: "*seen == s.period"
      - eval: s.record(hash, seen)
        to: s.record
  - of: (*frequencySketch).estimateHeld
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).estimateHeld
        kind: self
      - id: s.frequency
        kind: internal
    steps:
      - bind: count
        eval: s.frequency(hash)
        to: s.frequency
      - opt:
          do:
            - op: ++
              set: count
          when: len(s.blocks) != 0 && seen == s.period
      - return: count
  - of: (*frequencySketch).doorCells
    steps:
      - bind: low
        eval: uint64(hash) * doorMixLow
      - bind: high
        eval: uint64(hash) * doorMixHigh
      - return: uint32(low) & s.doorMask, uint32(low>>32) & s.doorMask, uint32(high>>32) & s.doorMask
  - of: (*frequencySketch).doorHolds
    steps:
      - return: |-
          s.door[first>>6]&(1<<(first&63)) != 0 &&
          		s.door[second>>6]&(1<<(second&63)) != 0 &&
          		s.door[third>>6]&(1<<(third&63)) != 0
  - of: (*frequencySketch).counters
    steps:
      - set: mix
        value: hash * counterMix
      - op: ^=
        set: mix
        value: mix >> 14
      - return: "&s.blocks[hash&s.blockMask], mix"
  - of: (*frequencySketch).increment
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).increment
        kind: self
      - id: s.counters
        kind: internal
      - id: s.age
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(s.blocks) == 0
      - bind: block, mix
        eval: s.counters(hash)
        to: s.counters
      - bind: added
        eval: |-
          bump(&block[mix&1], mix>>1&15) |
          		bump(&block[2|mix>>8&1], mix>>9&15) |
          		bump(&block[4|mix>>16&1], mix>>17&15) |
          		bump(&block[6|mix>>24&1], mix>>25&15)
      - opt:
          do:
            - return: ""
          when: added == 0
      - op: ++
        set: s.additions
      - opt:
          do:
            - eval: s.age()
              to: s.age
          when: s.additions >= s.sampleSize
  - of: bump
    steps:
      - bind: shift
        eval: nibble << 2
      - bind: room
        eval: (*word>>shift&counterMax+1)>>4 ^ 1
      - op: +=
        set: "*word"
        value: room << shift
      - return: room
  - of: (*frequencySketch).frequency
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).frequency
        kind: self
      - id: s.counters
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: len(s.blocks) == 0
      - bind: block, mix
        eval: s.counters(hash)
        to: s.counters
      - bind: least
        eval: block[mix&1] >> ((mix >> 1 & 15) << 2) & counterMax
      - set: least
        value: min(least, block[2|mix>>8&1]>>((mix>>9&15)<<2)&counterMax)
      - set: least
        value: min(least, block[4|mix>>16&1]>>((mix>>17&15)<<2)&counterMax)
      - return: min(least, block[6|mix>>24&1]>>((mix>>25&15)<<2)&counterMax)
  - of: (*frequencySketch).age
    participants:
      - id: caller
        kind: actor
      - id: (*frequencySketch).age
        kind: self
      - id: bits
        kind: stdlib
    steps:
      - bind: odd
        eval: "0"
      - loop:
          do:
            - bind: block
              eval: "&s.blocks[at]"
            - loop:
                do:
                  - op: +=
                    set: odd
                    to: bits
                    value: bits.OnesCount64(word & counterLowBits)
                  - set: block[w]
                    value: word >> 1 & counterHalfMask
                key: w
                range: block
                value: word
          key: at
          range: s.blocks
      - set: s.additions
        value: (s.additions - odd/4) / 2
      - eval: clear(s.door)
      - op: ++
        set: s.period
  - of: NewStriped
    participants:
      - id: caller
        kind: actor
      - id: NewStriped
        kind: self
      - id: maphash
        kind: stdlib
      - id: shareOf
        kind: internal
      - id: NewCache
        kind: internal
    steps:
      - bind: count
        eval: max(stripes, 1)
      - bind: built
        eval: "&Striped[K, V]{stripes: make([]*Cache[K, V], count), hash: hash}"
      - opt:
          do:
            - set: built.seed
              to: maphash
              value: maphash.MakeSeed()
          when: hash == nil
      - bind: entries
        eval: max(cfg.MaxEntries, 0)
      - bind: weight
        eval: max(cfg.MaxWeight, 0)
      - loop:
          do:
            - bind: part
              eval: cfg
            - set: part.MaxEntries
              to: shareOf
              value: shareOf(entries, count, at)
            - set: part.MaxWeight
              value: int64(shareOf(int(weight), count, at))
            - set: built.stripes[at]
              to: NewCache
              value: NewCache(part)
          key: at
          range: built.stripes
      - return: built
  - of: shareOf
    steps:
      - opt:
          do:
            - return: "0"
          when: bound == 0
      - bind: share
        eval: bound / count
      - opt:
          do:
            - op: ++
              set: share
          when: at < bound%count
      - return: max(share, 1)
  - of: (*Striped).stripe
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).stripe
        kind: self
      - id: maphash
        kind: stdlib
    steps:
      - opt:
          do:
            - return: s.stripes[0]
          when: len(s.stripes) == 1
      - var:
          name: sum
          type: uint64
      - alt:
          - do:
              - set: sum
                value: s.hash(key)
            when: s.hash != nil
          - do:
              - set: sum
                to: maphash
                value: maphash.Comparable(s.seed, key)
            else: true
      - return: s.stripes[sum%uint64(len(s.stripes))]
  - of: (*Striped).Fetch
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Fetch
        kind: self
      - id: s.stripe(key).Fetch
        kind: internal
    steps:
      - return: s.stripe(key).Fetch(key)
        to: s.stripe(key).Fetch
  - of: (*Striped).Set
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Set
        kind: self
      - id: s.stripe(key).Set
        kind: internal
    steps:
      - eval: s.stripe(key).Set(key, val)
        to: s.stripe(key).Set
  - of: (*Striped).SetTTL
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).SetTTL
        kind: self
      - id: s.stripe(key).SetTTL
        kind: internal
    steps:
      - eval: s.stripe(key).SetTTL(key, val, ttl)
        to: s.stripe(key).SetTTL
  - of: (*Striped).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Delete
        kind: self
      - id: s.stripe(key).Delete
        kind: internal
    steps:
      - eval: s.stripe(key).Delete(key)
        to: s.stripe(key).Delete
  - of: (*Striped).Expire
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Expire
        kind: self
      - id: part.Expire
        kind: internal
    steps:
      - bind: reaped
        eval: "0"
      - loop:
          do:
            - op: +=
              set: reaped
              to: part.Expire
              value: part.Expire()
          key: _
          range: s.stripes
          value: part
      - return: reaped
  - of: (*Striped).Keys
    steps:
      - return:
          closure:
            params: yield func(K) bool
            steps:
              - loop:
                  do:
                    - loop:
                        do:
                          - opt:
                              do:
                                - return: ""
                              when: "!yield(key)"
                        key: key
                        range: part.Keys()
                  key: _
                  range: s.stripes
                  value: part
  - of: (*Striped).Len
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Len
        kind: self
      - id: part.Len
        kind: internal
    steps:
      - bind: total
        eval: "0"
      - loop:
          do:
            - op: +=
              set: total
              to: part.Len
              value: part.Len()
          key: _
          range: s.stripes
          value: part
      - return: total
  - of: (*Striped).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Purge
        kind: self
      - id: part.Purge
        kind: internal
    steps:
      - loop:
          do:
            - eval: part.Purge()
              to: part.Purge
          key: _
          range: s.stripes
          value: part
  - of: (*Striped).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Stats
        kind: self
      - id: part.Stats
        kind: internal
    steps:
      - var:
          name: total
          type: StatsValue
      - loop:
          do:
            - bind: stats
              eval: part.Stats()
              to: part.Stats
            - op: +=
              set: total.Hits
              value: stats.Hits
            - op: +=
              set: total.Misses
              value: stats.Misses
            - op: +=
              set: total.Evictions
              value: stats.Evictions
            - op: +=
              set: total.Weight
              value: stats.Weight
            - set: total.Policy
              value: stats.Policy
          key: _
          range: s.stripes
          value: part
      - return: total
  - of: (*Striped).Stripes
    steps:
      - return: len(s.stripes)
  - of: (*UnlockedMap).initTinyLFU
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).initTinyLFU
        kind: self
      - id: c.sketch.size
        kind: internal
      - id: protectedShare
        kind: internal
    steps:
      - opt:
          do:
            - set: c.shares.window
              value: max(c.maxEntries/windowShare, 1)
            - set: c.shares.protected
              value: int(protectedShare(int64(c.maxEntries - c.shares.window)))
            - eval: c.sketch.size(c.maxEntries)
              to: c.sketch.size
          when: c.maxEntries > 0
      - opt:
          do:
            - set: c.shares.windowWeight
              value: max(c.maxWeight/int64(windowShare), 1)
            - set: c.shares.protectedWeight
              to: protectedShare
              value: protectedShare(c.maxWeight - c.shares.windowWeight)
            - opt:
                do:
                  - eval: c.sketch.size(blockWords)
                    to: c.sketch.size
                when: c.maxEntries == 0
          when: c.maxWeight > 0
  - of: protectedShare
    steps:
      - return: size/int64(fifths)*int64(protectedFifths) + size%int64(fifths)*int64(protectedFifths)/int64(fifths)
  - of: (*UnlockedMap).admitTinyLFU
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).admitTinyLFU
        kind: self
      - id: c.sketch.fit
        kind: internal
      - id: c.sketch.record
        kind: internal
      - id: c.small.pushFront
        kind: internal
      - id: c.probate
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: c.sketch.fit(len(c.items))
                    to: c.sketch.fit
                when: c.maxEntries == 0
            - set: ent.hash
              value: uint32(maphash.Comparable(sketchSeed, ent.key))
            - eval: c.sketch.record(ent.hash, &ent.period)
              to: c.sketch.record
          when: c.sketch.blocks != nil
      - set: ent.queue
        value: queueSmall
      - eval: c.small.pushFront(ent)
        to: c.small.pushFront
      - loop:
          cond: c.windowIsLarge()
          do:
            - bind: candidate
              eval: c.small.tail
            - opt:
                do:
                  - return: ""
                when: candidate == ent || !c.mainHasRoom(candidate)
            - eval: c.probate(candidate)
              to: c.probate
  - of: (*UnlockedMap).touchTinyLFU
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).touchTinyLFU
        kind: self
      - id: c.sketch.touch
        kind: internal
      - id: c.main.moveFront
        kind: internal
      - id: c.reorderTinyLFU
        kind: internal
    steps:
      - eval: c.sketch.touch(ent.hash, &ent.period)
        to: c.sketch.touch
      - opt:
          do:
            - eval: c.main.moveFront(ent)
              to: c.main.moveFront
            - return: ""
          when: ent.queue == queueMain
      - eval: c.reorderTinyLFU(ent)
        to: c.reorderTinyLFU
  - of: (*UnlockedMap).reorderTinyLFU
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).reorderTinyLFU
        kind: self
      - id: c.small.moveFront
        kind: internal
      - id: c.probation.unlink
        kind: internal
      - id: c.main.pushFront
        kind: internal
      - id: c.main.unlink
        kind: internal
      - id: c.probation.pushFront
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.small.moveFront(ent)
              to: c.small.moveFront
            - return: ""
          when: ent.queue == queueSmall
      - eval: c.probation.unlink(ent)
        to: c.probation.unlink
      - set: ent.queue
        value: queueMain
      - eval: c.main.pushFront(ent)
        to: c.main.pushFront
      - loop:
          cond: c.protectedIsLarge()
          do:
            - bind: demoted
              eval: c.main.tail
            - eval: c.main.unlink(demoted)
              to: c.main.unlink
            - set: demoted.queue
              value: queueProbation
            - eval: c.probation.pushFront(demoted)
              to: c.probation.pushFront
  - of: (*UnlockedMap).evictTinyLFU
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictTinyLFU
        kind: self
      - id: olderThan
        kind: internal
      - id: c.contest
        kind: internal
      - id: c.mainVictim
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: c.contest(candidate, fresh, pending)
                    to: c.contest
                  - return: "true"
                init:
                  bind: candidate
                  eval: olderThan(&c.small, fresh)
                  to: olderThan
                when: candidate != nil
          when: c.windowIsLarge()
      - bind: victim
        eval: c.mainVictim(fresh)
        to: c.mainVictim
      - opt:
          do:
            - set: victim
              to: olderThan
              value: olderThan(&c.small, fresh)
          when: victim == nil
      - opt:
          do:
            - return: "false"
          when: victim == nil
      - eval: c.removeEvict(victim, pending)
        to: c.removeEvict
      - return: "true"
  - of: (*UnlockedMap).contest
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).contest
        kind: self
      - id: c.probate
        kind: internal
      - id: c.mainVictim
        kind: internal
      - id: c.sketch.estimateHeld
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.probate(candidate)
              to: c.probate
            - return: ""
          when: c.mainHasRoom(candidate)
      - bind: victim
        eval: c.mainVictim(fresh)
        to: c.mainVictim
      - bind: used
        eval: c.sketch.estimateHeld(candidate.hash, candidate.period)
        to: c.sketch.estimateHeld
      - opt:
          do:
            - eval: c.removeEvict(candidate, pending)
              to: c.removeEvict
            - return: ""
          when: victim == nil || used < admitAtLeast || used <= c.sketch.estimateHeld(victim.hash, victim.period)
      - eval: c.removeEvict(victim, pending)
        to: c.removeEvict
      - eval: c.probate(candidate)
        to: c.probate
  - of: (*UnlockedMap).probate
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).probate
        kind: self
      - id: c.small.unlink
        kind: internal
      - id: c.probation.pushFront
        kind: internal
    steps:
      - eval: c.small.unlink(ent)
        to: c.small.unlink
      - set: ent.queue
        value: queueProbation
      - eval: c.probation.pushFront(ent)
        to: c.probation.pushFront
  - of: (*UnlockedMap).mainVictim
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).mainVictim
        kind: self
      - id: olderThan
        kind: internal
    steps:
      - opt:
          do:
            - return: victim
          init:
            bind: victim
            eval: olderThan(&c.probation, fresh)
            to: olderThan
          when: victim != nil
      - return: olderThan(&c.main, fresh)
        to: olderThan
  - of: (*UnlockedMap).windowIsLarge
    steps:
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && c.small.count > c.shares.window
      - return: c.maxWeight > 0 && c.small.weight > c.shares.windowWeight
  - of: (*UnlockedMap).protectedIsLarge
    steps:
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && c.main.count > c.shares.protected
      - return: c.maxWeight > 0 && c.main.weight > c.shares.protectedWeight
  - of: (*UnlockedMap).mainHasRoom
    steps:
      - opt:
          do:
            - return: "false"
          when: c.maxEntries > 0 && c.probation.count+c.main.count >= c.maxEntries-c.shares.window
      - return: c.maxWeight <= 0 || c.probation.weight+c.main.weight+int64(ent.weight) <= c.maxWeight-c.shares.windowWeight
  - of: olderThan
    steps:
      - opt:
          do:
            - return: l.tail
          when: l.tail != skip
      - return: skip.prev
  - of: NewUnlockedMap
    participants:
      - id: caller
        kind: actor
      - id: NewUnlockedMap
        kind: self
      - id: built.init
        kind: internal
    steps:
      - bind: built
        eval: "&UnlockedMap[K, V]{}"
      - eval: built.init(cfg)
        to: built.init
      - return: built
  - of: (*UnlockedMap).init
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).init
        kind: self
      - id: newGhostSet
        kind: internal
      - id: c.initTinyLFU
        kind: internal
    steps:
      - set: c.clk
        value: cfg.Clock
      - opt:
          do:
            - set: c.clk
              value: clock.System
          when: c.clk == nil
      - set: c.maxEntries
        value: max(cfg.MaxEntries, 0)
      - set: c.maxWeight
        value: max(cfg.MaxWeight, 0)
      - set: c.weightOf
        value: cfg.WeightOf
      - set: c.defaultTTL
        value: cfg.DefaultTTL
      - set: c.onEvict
        value: cfg.OnEvict
      - set: c.policy
        value: PolicyLRU
      - set: c.items
        value: make(map[K]*entry[K, V], c.maxEntries)
      - switch:
          cases:
            - case: PolicyS3FIFO
              do:
                - set: c.policy
                  value: PolicyS3FIFO
                - set: c.ghost
                  to: newGhostSet
                  value: newGhostSet[K]()
            - case: PolicyTinyLFU
              do:
                - set: c.policy
                  value: PolicyTinyLFU
                - eval: c.initTinyLFU()
                  to: c.initTinyLFU
            - default: true
          "on": cfg.Policy
  - of: (*UnlockedMap).Fetch
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Fetch
        kind: self
      - id: c.missed
        kind: internal
      - id: c.main.moveFront
        kind: internal
      - id: c.sketch.touch
        kind: internal
      - id: c.reorderTinyLFU
        kind: internal
    steps:
      - bind: ent
        eval: c.items[key]
      - opt:
          do:
            - eval: c.missed(ent)
              to: c.missed
            - var:
                name: zero
                type: V
            - return: zero, false
          when: ent == nil || (ent.slot != 0 && c.sinceEpoch() >= ent.deadline)
      - switch:
          cases:
            - case: PolicyLRU
              do:
                - eval: c.main.moveFront(ent)
                  to: c.main.moveFront
            - case: PolicyS3FIFO
              do:
                - set: ent.freq
                  value: min(ent.freq+1, maxFreq)
            - default: true
              do:
                - eval: c.sketch.touch(ent.hash, &ent.period)
                  to: c.sketch.touch
                - alt:
                    - do:
                        - eval: c.main.moveFront(ent)
                          to: c.main.moveFront
                      when: ent.queue == queueMain
                    - do:
                        - eval: c.reorderTinyLFU(ent)
                          to: c.reorderTinyLFU
                      else: true
          "on": c.policy
      - op: ++
        set: c.hits
      - return: ent.val, true
  - of: (*UnlockedMap).missed
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).missed
        kind: self
      - id: c.removeEvict
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - opt:
          do:
            - eval: c.removeEvict(ent, &pending)
              to: c.removeEvict
          when: ent != nil
      - op: ++
        set: c.misses
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
  - of: (*UnlockedMap).Deadline
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Deadline
        kind: self
      - id: c.epoch.Add
        kind: value
    steps:
      - bind: ent
        eval: c.items[key]
      - opt:
          do:
            - return: time.Time{}, false
          when: ent == nil
      - opt:
          do:
            - return: time.Time{}, true
          when: ent.slot == 0
      - return: c.epoch.Add(time.Duration(ent.deadline)), true
        to: c.epoch.Add
  - of: (*UnlockedMap).Set
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Set
        kind: self
      - id: c.set
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - eval: c.set(key, val, c.defaultTTL, &pending)
        to: c.set
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
  - of: (*UnlockedMap).SetTTL
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).SetTTL
        kind: self
      - id: c.set
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - eval: c.set(key, val, ttl, &pending)
        to: c.set
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
  - of: (*UnlockedMap).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Delete
        kind: self
      - id: c.remove
        kind: internal
    steps:
      - eval: c.remove(key)
        to: c.remove
  - of: (*UnlockedMap).Expire
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Expire
        kind: self
      - id: c.expire
        kind: internal
      - id: c.notifyEvicted
        kind: internal
    steps:
      - var:
          name: pending
          type: "[]evictionValue[K, V]"
      - bind: reaped
        eval: c.expire(&pending)
        to: c.expire
      - eval: c.notifyEvicted(pending)
        to: c.notifyEvicted
      - return: reaped
  - of: (*UnlockedMap).Keys
    steps:
      - return:
          closure:
            params: yield func(K) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(key)"
                  key: _
                  range: c.keySnapshot()
                  value: key
  - of: (*UnlockedMap).Len
    steps:
      - return: len(c.items)
  - of: (*UnlockedMap).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Purge
        kind: self
      - id: c.ghost.reset
        kind: internal
      - id: c.sketch.clear
        kind: internal
    steps:
      - set: c.items
        value: make(map[K]*entry[K, V], c.maxEntries)
      - set: c.main
        value: entryList[K, V]{}
      - set: c.small
        value: entryList[K, V]{}
      - set: c.probation
        value: entryList[K, V]{}
      - set: c.expiry
        value: deadlineHeap[K, V]{}
      - opt:
          do:
            - eval: c.ghost.reset()
              to: c.ghost.reset
          when: c.policy == PolicyS3FIFO
      - eval: c.sketch.clear()
        to: c.sketch.clear
  - of: (*UnlockedMap).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).Stats
        kind: self
      - id: c.weight
        kind: internal
    steps:
      - var:
          name: weight
          type: int64
      - opt:
          do:
            - set: weight
              to: c.weight
              value: c.weight()
          when: c.maxWeight > 0 || c.weightOf != nil
      - return: "StatsValue{Hits: c.hits, Misses: c.misses, Evictions: c.evictions, Weight: weight, Policy: c.policy}"
  - of: (*UnlockedMap).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).fetch
        kind: self
      - id: c.removeEvict
        kind: internal
      - id: c.main.moveFront
        kind: internal
      - id: c.sketch.touch
        kind: internal
      - id: c.reorderTinyLFU
        kind: internal
    steps:
      - bind: ent
        eval: c.items[key]
      - opt:
          do:
            - opt:
                do:
                  - eval: c.removeEvict(ent, pending)
                    to: c.removeEvict
                when: ent != nil
            - op: ++
              set: c.misses
            - var:
                name: zero
                type: V
            - return: zero, false
          when: ent == nil || (ent.slot != 0 && c.sinceEpoch() >= ent.deadline)
      - switch:
          cases:
            - case: PolicyLRU
              do:
                - eval: c.main.moveFront(ent)
                  to: c.main.moveFront
            - case: PolicyS3FIFO
              do:
                - set: ent.freq
                  value: min(ent.freq+1, maxFreq)
            - default: true
              do:
                - eval: c.sketch.touch(ent.hash, &ent.period)
                  to: c.sketch.touch
                - alt:
                    - do:
                        - eval: c.main.moveFront(ent)
                          to: c.main.moveFront
                      when: ent.queue == queueMain
                    - do:
                        - eval: c.reorderTinyLFU(ent)
                          to: c.reorderTinyLFU
                      else: true
          "on": c.policy
      - op: ++
        set: c.hits
      - return: ent.val, true
  - of: (*UnlockedMap).set
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).set
        kind: self
      - id: c.deadlineAfter
        kind: internal
      - id: c.overwrite
        kind: internal
      - id: c.weigh
        kind: internal
      - id: c.main.pushFront
        kind: internal
      - id: c.admit
        kind: internal
      - id: c.setDeadline
        kind: internal
      - id: c.evictIfNeeded
        kind: internal
    steps:
      - var:
          name: at
          type: int64
      - opt:
          do:
            - set: at
              to: c.deadlineAfter
              value: c.deadlineAfter(ttl)
          when: ttl > 0
      - opt:
          do:
            - eval: c.overwrite(ent, val, ttl > 0, at, pending)
              to: c.overwrite
            - return: ""
          init:
            bind: ent
            eval: c.items[key]
          when: ent != nil
      - bind: ent
        eval: "&entry[K, V]{key: key, val: val, weight: 1}"
      - opt:
          do:
            - set: ent.weight
              to: c.weigh
              value: c.weigh(key, val)
          when: c.weightOf != nil
      - set: c.items[key]
        value: ent
      - alt:
          - do:
              - eval: c.main.pushFront(ent)
                to: c.main.pushFront
            when: c.policy == PolicyLRU
          - do:
              - eval: c.admit(ent)
                to: c.admit
            else: true
      - opt:
          do:
            - eval: c.setDeadline(ent, at)
              to: c.setDeadline
          when: ttl > 0
      - opt:
          do:
            - eval: c.evictIfNeeded(ent, pending)
              to: c.evictIfNeeded
          when: c.maxEntries > 0 || c.maxWeight > 0
  - of: (*UnlockedMap).overwrite
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).overwrite
        kind: self
      - id: c.reweigh
        kind: internal
      - id: c.setDeadline
        kind: internal
      - id: c.clearDeadline
        kind: internal
      - id: c.touch
        kind: internal
      - id: c.evictIfNeeded
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.reweigh(ent, c.weigh(ent.key, val))
              to: c.reweigh
          when: c.weightOf != nil
      - set: ent.val
        value: val
      - alt:
          - do:
              - eval: c.setDeadline(ent, at)
                to: c.setDeadline
            when: timed
          - do:
              - eval: c.clearDeadline(ent)
                to: c.clearDeadline
            else: true
      - eval: c.touch(ent)
        to: c.touch
      - opt:
          do:
            - eval: c.evictIfNeeded(ent, pending)
              to: c.evictIfNeeded
          when: c.maxWeight > 0
  - of: (*UnlockedMap).remove
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).remove
        kind: self
      - id: c.detach
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.detach(ent)
              to: c.detach
          init:
            bind: ent
            eval: c.items[key]
          when: ent != nil
  - of: (*UnlockedMap).expire
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).expire
        kind: self
      - id: c.sinceEpoch
        kind: internal
      - id: c.expiry.top
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: c.expiry.size() == 0
      - bind: now
        eval: c.sinceEpoch()
        to: c.sinceEpoch
      - bind: reaped
        eval: "0"
      - loop:
          do:
            - bind: top, at
              eval: c.expiry.top()
              to: c.expiry.top
            - opt:
                do:
                  - return: reaped
                when: top == nil || now < at
            - eval: c.removeEvict(top, pending)
              to: c.removeEvict
            - op: ++
              set: reaped
          forever: true
  - of: (*UnlockedMap).deadlineAfter
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).deadlineAfter
        kind: self
      - id: c.clk.Now
        kind: value
      - id: now.Sub
        kind: value
    steps:
      - bind: now
        eval: c.clk.Now()
        to: c.clk.Now
      - opt:
          do:
            - set: c.epoch, c.epochSet
              value: now, true
          when: "!c.epochSet"
      - bind: since
        eval: now.Sub(c.epoch)
        to: now.Sub
      - opt:
          do:
            - return: math.MaxInt64
          when: since > math.MaxInt64-ttl
      - return: int64(since + ttl)
  - of: (*UnlockedMap).sinceEpoch
    steps:
      - return: int64(c.clk.Now().Sub(c.epoch))
  - of: (*UnlockedMap).setDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).setDeadline
        kind: self
      - id: c.expiry.fix
        kind: internal
      - id: c.expiry.push
        kind: internal
    steps:
      - set: ent.deadline
        value: at
      - opt:
          do:
            - eval: c.expiry.fix(ent, at)
              to: c.expiry.fix
            - return: ""
          when: ent.slot != 0
      - eval: c.expiry.push(ent, at)
        to: c.expiry.push
  - of: (*UnlockedMap).clearDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).clearDeadline
        kind: self
      - id: c.expiry.remove
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.expiry.remove(ent)
              to: c.expiry.remove
          when: ent.slot != 0
      - set: ent.deadline
        value: "0"
  - of: (*UnlockedMap).weigh
    steps:
      - opt:
          do:
            - return: "1"
          when: c.weightOf == nil
      - return: int32(min(max(c.weightOf(key, val), 0), math.MaxInt32))
  - of: (*UnlockedMap).reweigh
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).reweigh
        kind: self
      - id: c.listOf
        kind: internal
    steps:
      - bind: list
        eval: c.listOf(ent)
        to: c.listOf
      - op: +=
        set: list.weight
        value: int64(weight) - int64(ent.weight)
      - set: ent.weight
        value: weight
  - of: (*UnlockedMap).overCapacity
    steps:
      - bind: count
        eval: len(c.items)
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && count > c.maxEntries
      - return: c.maxWeight > 0 && count > 1 && c.weight() > c.maxWeight
  - of: (*UnlockedMap).weight
    steps:
      - return: c.main.weight + c.small.weight + c.probation.weight
  - of: (*UnlockedMap).evictIfNeeded
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).evictIfNeeded
        kind: self
      - id: c.expiry.top
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!c.overCapacity()"
      - var:
          name: now
          type: int64
      - bind: read
        eval: "false"
      - loop:
          cond: c.overCapacity()
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - set: now, read
                          value: c.sinceEpoch(), true
                      when: "!read"
                  - opt:
                      do:
                        - eval: c.removeEvict(top, pending)
                          to: c.removeEvict
                        - continue: true
                      init:
                        bind: top, at
                        eval: c.expiry.top()
                        to: c.expiry.top
                      when: top != fresh && now >= at
                when: c.expiry.size() > 0
            - opt:
                do:
                  - return: ""
                when: "!c.evictOne(fresh, pending)"
  - of: (*UnlockedMap).removeEvict
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).removeEvict
        kind: self
      - id: c.detach
        kind: internal
    steps:
      - eval: c.detach(ent)
        to: c.detach
      - op: ++
        set: c.evictions
      - opt:
          do:
            - set: "*pending"
              value: "append(*pending, evictionValue[K, V]{key: ent.key, val: ent.val})"
          when: c.onEvict != nil
  - of: (*UnlockedMap).detach
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).detach
        kind: self
      - id: c.unlink
        kind: internal
      - id: c.expiry.remove
        kind: internal
    steps:
      - eval: c.unlink(ent)
        to: c.unlink
      - opt:
          do:
            - eval: c.expiry.remove(ent)
              to: c.expiry.remove
          when: ent.slot != 0
      - eval: delete(c.items, ent.key)
  - of: (*UnlockedMap).notifyEvicted
    steps:
      - opt:
          do:
            - return: ""
          when: len(pending) == 0
      - loop:
          do:
            - eval: c.onEvict(ev.key, ev.val)
          key: _
          range: pending
          value: ev
  - of: (*UnlockedMap).listOf
    steps:
      - switch:
          cases:
            - case: queueSmall
              do:
                - return: "&c.small"
            - case: queueProbation
              do:
                - return: "&c.probation"
            - default: true
              do:
                - return: "&c.main"
          "on": ent.queue
  - of: (*UnlockedMap).unlink
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).unlink
        kind: self
      - id: c.listOf(ent).unlink
        kind: internal
    steps:
      - eval: c.listOf(ent).unlink(ent)
        to: c.listOf(ent).unlink
