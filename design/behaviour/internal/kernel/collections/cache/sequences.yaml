            - case: PolicyS3FIFO
              do:
                - opt:
                    do:
                      - op: ++
                        set: ent.freq
                    when: ent.freq < maxFreq
            - case: PolicyTinyLFU
              do:
                - eval: c.touchTinyLFU(ent)
                  to: c.touchTinyLFU
            - default: true
              do:
                - eval: c.main.moveFront(ent)
                  to: c.main.moveFront
          "on": c.policy
