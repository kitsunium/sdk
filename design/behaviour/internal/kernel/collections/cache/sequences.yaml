    steps:
      - bind: count
        eval: len(c.items)
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && count > c.maxEntries
      - return: c.maxWeight > 0 && count > 1 && c.main.weight+c.small.weight > c.maxWeight
  - of: (*Cache).evictIfNeeded
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).evictIfNeeded
        kind: self
      - id: c.expiry.Peek
        kind: value
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!c.overCapacity()"
      - var:
          name: now
          type: time.Time
      - bind: read
        eval: "false"
      - loop:
          cond: c.overCapacity()
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - set: now, read
                          value: c.clk.Now(), true
                      when: "!read"
                  - opt:
                      do:
                        - eval: c.removeEvict(top, pending)
                          to: c.removeEvict
                        - continue: true
                      init:
                        bind: top, _, _
                        eval: c.expiry.Peek()
                        to: c.expiry.Peek
                      when: top != fresh && !now.Before(top.expireAt)
                when: c.expiry != nil && c.expiry.Len() > 0
            - opt:
                do:
                  - return: ""
                when: "!c.evictOne(fresh, pending)"
  - of: (*Cache).removeEvict
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).removeEvict
        kind: self
      - id: c.detach
        kind: internal
    steps:
      - eval: c.detach(ent)
        to: c.detach
      - op: ++
        set: c.evictions
      - opt:
          do:
            - set: "*pending"
              value: "append(*pending, evictionValue[K, V]{key: ent.key, val: ent.val})"
          when: c.onEvict != nil
  - of: (*Cache).detach
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).detach
        kind: self
      - id: c.unlink
        kind: internal
      - id: c.expiry.Remove
        kind: value
    steps:
      - eval: c.unlink(ent)
        to: c.unlink
      - opt:
          do:
            - eval: c.expiry.Remove(ent.expiry)
              to: c.expiry.Remove
            - set: ent.expiry
              value: heap.Handle{}
          when: ent.expiry != (heap.Handle{})
      - eval: delete(c.items, ent.key)
  - of: (*Cache).notifyEvicted
    steps:
      - opt:
          do:
            - return: ""
          when: len(pending) == 0
      - loop:
          do:
            - eval: c.onEvict(ev.key, ev.val)
          key: _
          range: pending
          value: ev
  - of: (*Cache).listOf
    steps:
      - opt:
          do:
            - return: "&c.small"
          when: ent.queue == queueSmall
      - return: "&c.main"
  - of: (*Cache).unlink
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).unlink
        kind: self
      - id: c.listOf(ent).unlink
        kind: internal
    steps:
      - eval: c.listOf(ent).unlink(ent)
        to: c.listOf(ent).unlink
  - of: newGhostSet
    steps:
      - return: "ghostSet[K]{seed: maphash.MakeSeed(), members: make(map[uint64]uint32)}"
  - of: (*ghostSet).remembers
    steps:
      - opt:
          do:
            - return: "false"
          when: g.size == 0
      - return: g.members[maphash.Comparable(g.seed, key)] > 0
  - of: (*ghostSet).add
    participants:
      - id: caller
        kind: actor
      - id: (*ghostSet).add
        kind: self
      - id: g.dropOldest
        kind: internal
      - id: g.grow
        kind: internal
      - id: maphash
        kind: stdlib
    steps:
      - set: bound
        value: max(bound, 1)
      - loop:
          cond: g.size >= bound
          do:
            - eval: g.dropOldest()
              to: g.dropOldest
      - opt:
          do:
            - eval: g.grow(bound)
              to: g.grow
          when: g.size == len(g.ring)
      - bind: hash
        eval: maphash.Comparable(g.seed, key)
        to: maphash
      - set: g.ring[(g.head+g.size)%len(g.ring)]
        value: hash
      - op: ++
        set: g.size
      - op: ++
        set: g.members[hash]
  - of: (*ghostSet).dropOldest
    steps:
      - bind: hash
        eval: g.ring[g.head]
      - set: g.head
        value: (g.head + 1) % len(g.ring)
      - op: "--"
        set: g.size
      - opt:
          do:
            - eval: delete(g.members, hash)
            - return: ""
          when: g.members[hash] <= 1
      - op: "--"
        set: g.members[hash]
  - of: (*ghostSet).grow
    steps:
      - bind: next
        eval: make([]uint64, min(max(2*len(g.ring), minGhostRing), max(bound, len(g.ring)+1)))
      - loop:
          do:
            - set: next[i]
              value: g.ring[(g.head+i)%len(g.ring)]
          key: i
          range: g.size
      - set: g.ring
        value: next
      - set: g.head
        value: "0"
  - of: (*ghostSet).reset
    steps:
      - set: g.head
        value: "0"
      - set: g.size
        value: "0"
      - eval: clear(g.members)
  - of: (*entryList).pushFront
    steps:
      - set: ent.prev
        value: nil
      - set: ent.next
        value: l.head
      - opt:
          do:
            - set: l.head.prev
              value: ent
          when: l.head != nil
      - set: l.head
        value: ent
      - opt:
          do:
            - set: l.tail
              value: ent
          when: l.tail == nil
      - op: ++
        set: l.count
      - op: +=
        set: l.weight
        value: int64(ent.weight)
  - of: (*entryList).unlink
    steps:
      - alt:
          - do:
              - set: ent.prev.next
                value: ent.next
            when: ent.prev != nil
          - do:
              - set: l.head
                value: ent.next
            else: true
      - alt:
          - do:
              - set: ent.next.prev
                value: ent.prev
            when: ent.next != nil
          - do:
              - set: l.tail
                value: ent.prev
            else: true
      - set: ent.prev
        value: nil
      - set: ent.next
        value: nil
      - op: "--"
        set: l.count
      - op: "-="
        set: l.weight
        value: int64(ent.weight)
  - of: (*entryList).moveFront
    participants:
      - id: caller
        kind: actor
      - id: (*entryList).moveFront
        kind: self
      - id: l.unlink
        kind: internal
      - id: l.pushFront
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: l.head == ent
      - eval: l.unlink(ent)
        to: l.unlink
      - eval: l.pushFront(ent)
        to: l.pushFront
  - of: (*Cache).admit
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).admit
        kind: self
      - id: c.main.pushFront
        kind: internal
      - id: c.small.pushFront
        kind: internal
    steps:
      - opt:
          do:
            - set: ent.queue
              value: queueMain
            - eval: c.main.pushFront(ent)
              to: c.main.pushFront
            - return: ""
          when: c.policy != PolicyS3FIFO
      - opt:
          do:
            - set: ent.queue
              value: queueMain
            - eval: c.main.pushFront(ent)
              to: c.main.pushFront
            - return: ""
          when: c.ghost.remembers(ent.key)
      - set: ent.queue
        value: queueSmall
      - eval: c.small.pushFront(ent)
        to: c.small.pushFront
  - of: (*Cache).touch
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).touch
        kind: self
      - id: c.main.moveFront
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - op: ++
                    set: ent.freq
                when: ent.freq < maxFreq
            - return: ""
          when: c.policy == PolicyS3FIFO
      - eval: c.main.moveFront(ent)
        to: c.main.moveFront
  - of: (*Cache).evictOne
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).evictOne
        kind: self
      - id: c.evictS3FIFO
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - opt:
          do:
            - return: c.evictS3FIFO(fresh, pending)
              to: c.evictS3FIFO
          when: c.policy == PolicyS3FIFO
      - bind: victim
        eval: c.main.tail
      - opt:
          do:
            - return: "false"
          when: victim == nil || victim == fresh
      - eval: c.removeEvict(victim, pending)
        to: c.removeEvict
      - return: "true"
  - of: (*Cache).evictS3FIFO
    steps:
      - opt:
          do:
            - return: c.evictSmall(fresh, pending) || c.evictMain(fresh, pending)
          when: c.small.count > 0 && (c.main.count == 0 || c.smallIsLarge())
      - return: c.evictMain(fresh, pending) || c.evictSmall(fresh, pending) || c.evictMain(fresh, pending)
  - of: (*Cache).smallIsLarge
    steps:
      - opt:
          do:
            - return: "true"
          when: c.maxEntries > 0 && c.small.count*smallShare >= c.maxEntries
      - return: c.maxWeight > 0 && c.small.weight*int64(smallShare) >= c.maxWeight
  - of: (*Cache).evictSmall
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).evictSmall
        kind: self
      - id: c.small.unlink
        kind: internal
      - id: c.main.pushFront
        kind: internal
      - id: c.ghost.add
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - loop:
          cond: victim != nil
          do:
            - bind: newer
              eval: victim.prev
            - opt:
                do:
                  - set: victim
                    value: newer
                  - continue: true
                when: victim == fresh
            - opt:
                do:
                  - eval: c.small.unlink(victim)
                    to: c.small.unlink
                  - set: victim.freq
                    value: "0"
                  - set: victim.queue
                    value: queueMain
                  - eval: c.main.pushFront(victim)
                    to: c.main.pushFront
                  - set: victim
                    value: newer
                  - continue: true
                when: victim.freq > 0
            - eval: c.ghost.add(victim.key, c.ghostBound())
              to: c.ghost.add
            - eval: c.removeEvict(victim, pending)
              to: c.removeEvict
            - return: "true"
          init: victim := c.small.tail
      - return: "false"
  - of: (*Cache).evictMain
    participants:
      - id: caller
        kind: actor
      - id: (*Cache).evictMain
        kind: self
      - id: c.main.moveFront
        kind: internal
      - id: c.removeEvict
        kind: internal
    steps:
      - loop:
          cond: budget > 0
          do:
            - bind: victim
              eval: c.main.tail
            - opt:
                do:
                  - return: "false"
                when: victim == nil
            - opt:
                do:
                  - opt:
                      do:
                        - return: "false"
                      when: victim == fresh && c.main.count == 1
                  - opt:
                      do:
                        - op: "--"
                          set: victim.freq
                      when: victim.freq > 0
                  - eval: c.main.moveFront(victim)
                    to: c.main.moveFront
                  - continue: true
                when: victim.freq > 0 || victim == fresh
            - eval: c.removeEvict(victim, pending)
              to: c.removeEvict
            - return: "true"
          init: budget := c.main.count*int(maxFreq+1) + 1
          post: budget--
      - return: "false"
  - of: (*Cache).ghostBound
    steps:
      - opt:
          do:
            - return: c.maxEntries
          when: c.maxEntries > 0
      - return: len(c.items)
  - of: NewStriped
    participants:
      - id: caller
        kind: actor
      - id: NewStriped
        kind: self
      - id: maphash
        kind: stdlib
      - id: shareOf
        kind: internal
      - id: NewCache
        kind: internal
    steps:
      - bind: count
        eval: max(stripes, 1)
      - bind: built
        eval: "&Striped[K, V]{stripes: make([]*Cache[K, V], count), hash: hash}"
      - opt:
          do:
            - set: built.seed
              to: maphash
              value: maphash.MakeSeed()
          when: hash == nil
      - bind: entries
        eval: max(cfg.MaxEntries, 0)
      - bind: weight
        eval: max(cfg.MaxWeight, 0)
      - loop:
          do:
            - bind: part
              eval: cfg
            - set: part.MaxEntries
              to: shareOf
              value: shareOf(entries, count, at)
            - set: part.MaxWeight
              value: int64(shareOf(int(weight), count, at))
            - set: built.stripes[at]
              to: NewCache
              value: NewCache(part)
          key: at
          range: built.stripes
      - return: built
  - of: shareOf
    steps:
      - opt:
          do:
            - return: "0"
          when: bound == 0
      - bind: share
        eval: bound / count
      - opt:
          do:
            - op: ++
              set: share
          when: at < bound%count
      - return: max(share, 1)
  - of: (*Striped).stripe
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).stripe
        kind: self
      - id: maphash
        kind: stdlib
    steps:
      - opt:
          do:
            - return: s.stripes[0]
          when: len(s.stripes) == 1
      - var:
          name: sum
          type: uint64
      - alt:
          - do:
              - set: sum
                value: s.hash(key)
            when: s.hash != nil
          - do:
              - set: sum
                to: maphash
                value: maphash.Comparable(s.seed, key)
            else: true
      - return: s.stripes[sum%uint64(len(s.stripes))]
  - of: (*Striped).Fetch
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Fetch
        kind: self
      - id: s.stripe(key).Fetch
        kind: internal
    steps:
      - return: s.stripe(key).Fetch(key)
        to: s.stripe(key).Fetch
  - of: (*Striped).Set
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Set
        kind: self
      - id: s.stripe(key).Set
        kind: internal
    steps:
      - eval: s.stripe(key).Set(key, val)
        to: s.stripe(key).Set
  - of: (*Striped).SetTTL
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).SetTTL
        kind: self
      - id: s.stripe(key).SetTTL
        kind: internal
    steps:
      - eval: s.stripe(key).SetTTL(key, val, ttl)
        to: s.stripe(key).SetTTL
  - of: (*Striped).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Delete
        kind: self
      - id: s.stripe(key).Delete
        kind: internal
    steps:
      - eval: s.stripe(key).Delete(key)
        to: s.stripe(key).Delete
  - of: (*Striped).Expire
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Expire
        kind: self
      - id: part.Expire
        kind: internal
    steps:
      - bind: reaped
        eval: "0"
      - loop:
          do:
            - op: +=
              set: reaped
              to: part.Expire
              value: part.Expire()
          key: _
          range: s.stripes
          value: part
      - return: reaped
  - of: (*Striped).Keys
    steps:
      - return:
          closure:
            params: yield func(K) bool
            steps:
              - loop:
                  do:
                    - loop:
                        do:
                          - opt:
                              do:
                                - return: ""
                              when: "!yield(key)"
                        key: key
                        range: part.Keys()
                  key: _
                  range: s.stripes
                  value: part
  - of: (*Striped).Len
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Len
        kind: self
      - id: part.Len
        kind: internal
    steps:
      - bind: total
        eval: "0"
      - loop:
          do:
            - op: +=
              set: total
              to: part.Len
              value: part.Len()
          key: _
          range: s.stripes
          value: part
      - return: total
  - of: (*Striped).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Purge
        kind: self
      - id: part.Purge
        kind: internal
    steps:
      - loop:
          do:
            - eval: part.Purge()
              to: part.Purge
          key: _
          range: s.stripes
          value: part
  - of: (*Striped).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*Striped).Stats
        kind: self
      - id: part.Stats
        kind: internal
    steps:
      - var:
          name: total
          type: StatsValue
      - loop:
          do:
            - bind: stats
              eval: part.Stats()
              to: part.Stats
            - op: +=
              set: total.Hits
              value: stats.Hits
            - op: +=
              set: total.Misses
              value: stats.Misses
            - op: +=
              set: total.Evictions
              value: stats.Evictions
            - op: +=
              set: total.Weight
              value: stats.Weight
            - set: total.Policy
              value: stats.Policy
          key: _
          range: s.stripes
          value: part
      - return: total
  - of: (*Striped).Stripes
    steps:
      - return: len(s.stripes)
