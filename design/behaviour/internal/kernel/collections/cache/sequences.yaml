            - case: PolicyTinyLFU
              do:
                - eval: c.admitTinyLFU(ent)
                  to: c.admitTinyLFU
            - default: true
              do:
                - set: ent.queue
                  value: queueMain
                - eval: c.main.pushFront(ent)
                  to: c.main.pushFront
          "on": c.policy
  - of: (*UnlockedMap).touch
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).touch
        kind: self
      - id: c.touchTinyLFU
        kind: internal
      - id: c.main.moveFront
        kind: internal
