  - of: (*entryList).pushFront
    steps:
      - set: ent.prev
        value: nil
      - set: ent.next
        value: l.head
      - opt:
          do:
            - set: l.head.prev
              value: ent
          when: l.head != nil
      - set: l.head
        value: ent
      - opt:
          do:
            - set: l.tail
              value: ent
          when: l.tail == nil
      - op: ++
        set: l.count
      - op: +=
        set: l.weight
        value: int64(ent.weight)
  - of: (*entryList).unlink
    steps:
      - alt:
          - do:
              - set: ent.prev.next
                value: ent.next
            when: ent.prev != nil
          - do:
              - set: l.head
                value: ent.next
            else: true
      - alt:
          - do:
              - set: ent.next.prev
                value: ent.prev
            when: ent.next != nil
          - do:
              - set: l.tail
                value: ent.prev
            else: true
      - set: ent.prev
        value: nil
      - set: ent.next
        value: nil
      - op: "--"
        set: l.count
      - op: "-="
        set: l.weight
        value: int64(ent.weight)
