    steps:
      - opt:
          do:
            - return: ""
          when: l.head == ent
      - bind: prev, next
        eval: ent.prev, ent.next
      - set: prev.next
        value: next
      - alt:
          - do:
              - set: next.prev
                value: prev
            when: next != nil
          - do:
              - set: l.tail
                value: prev
            else: true
      - set: ent.prev
        value: nil
      - set: ent.next
        value: l.head
      - set: l.head.prev
        value: ent
      - set: l.head
        value: ent
  - of: (*UnlockedMap).admit
    participants:
      - id: caller
        kind: actor
      - id: (*UnlockedMap).admit
        kind: self
      - id: c.admitS3FIFO
        kind: internal
      - id: c.admitTinyLFU
