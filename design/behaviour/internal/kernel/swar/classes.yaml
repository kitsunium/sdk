  - doc: |-
      The lane constants: a uint64 is read as eight byte lanes, lane 0 the lowest
      byte, which is the first of the eight bytes under binary.LittleEndian.
    grouped: true
    items:
      - doc: "ones is 0x01 in every lane: a byte multiplied by it fills the lanes."
        name: ones
        type: uint64
        value: "0x0101010101010101"
      - doc: low7 is the low seven bits of every lane.
        name: low7
        type: uint64
        value: "0x7F7F7F7F7F7F7F7F"
      - doc: "high is the high bit of every lane: where a lane test reports a hit."
        name: high
        type: uint64
        value: "0x8080808080808080"
      - doc: wordSize is the bytes one word covers.
        name: wordSize
        type: int
        value: "8"
      - doc: |-
          twoScanMin is the length from which IndexByte2 prefers two scans of the
          standard library's bytes.IndexByte to the word loop, where it has no
          vector form: measured, the two cost the same near 64 bytes (BENCH.md).
        name: twoScanMin
        type: int
        value: "64"
      - doc: exactBound is the largest bound a lane comparison is exact for.
        name: exactBound
        type: byte
        value: "128"
      - doc: |-
          upperHalf is the first byte of the upper half of the alphabet: the
          bytes whose high bit is set.
        name: upperHalf
        type: byte
        value: "0x80"
