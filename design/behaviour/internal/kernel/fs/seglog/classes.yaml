functions:
  - doc: origin builds a fresh error on its own sentinel, with fields.
    name: origin
    params: sentinel *errs.Error, fields ...errs.FieldValue
    results: error
  - doc: |-
      failed is the Failed of operation op, its cause kept as a field rather
      than wrapped, so the code a caller matches on is always Failed.
    name: failed
    params: op string, c error
    results: error
  - doc: damaged is the Damaged of segment seg at offset off, for why.
    name: damaged
    params: seg uint64, off int64, why string
    results: error
  - doc: u64 renders v in decimal, the spelling of every index field.
    name: u64
    params: v uint64
    results: string
  - doc: |-
      outside is the error of a read of index on a log holding first through
      next-1: Dropped below, OutOfRange at or past the end.
    name: outside
    params: index, first, next uint64
    results: error
  - doc: |-
      abandon is where an error with no reader goes: the cleanup of a file
      nothing will read again, whose outcome is already decided.
    name: abandon
    params: err error
  - name: Open
    params: dir string, segBytes int64
    results: "*Log, error"
  - doc: |-
      mkdirDurable creates dir, private to the owner, and when it did not
      exist syncs its parent, which publishes the new entry.
    name: mkdirDurable
    params: dir string
    results: error
  - doc: align8 rounds n up to the next record boundary.
    name: align8
    params: n int
    results: int
  - doc: recordLen is the aligned length on disk of a record of n payload bytes.
    name: recordLen
    params: n int
    results: int
  - doc: |-
      appendRecord encodes r at the end of dst, crc sealed and zero-padded to
      the record boundary, and returns the extended slice.
    name: appendRecord
    params: dst []byte, r *record
    results: "[]byte"
  - doc: boolByte is v as the record's flag byte.
    name: boolByte
    params: v bool
    results: byte
  - doc: |-
      sealRecord recomputes a record's crc over its body. The body's end is
      summed in uint64, where a length near 2^31 cannot wrap as an int sum does
      on 32 bits.
    name: sealRecord
    params: b []byte
  - doc: |-
      sealedBody is the body of the record at b[0:] when its length is in range
      and its crc holds, whatever version it carries; nil otherwise. The length
      is bounded as the u32 it is, before any int sum: on 32 bits one near 2^31
      wrapped recHeader+n negative and the slice panicked.
    name: sealedBody
    params: b []byte
    results: "[]byte"
  - doc: |-
      parseRecord decodes the record at b[0:]; ok is false for a hole: a short
      read, a zero header, a length out of range or a crc that fails — and for
      a sealed record of a version this build does not write, which recovery
      tells apart with unknownVersionAt before it calls anything a hole.
    name: parseRecord
    params: b []byte
    results: rec record, ok bool
  - doc: |-
      decodeCheckpoint parses encode's payload; ok is false for any other
      length, which recovery reads as a damaged checkpoint.
    name: decodeCheckpoint
    params: b []byte
    results: checkpoint, bool
  - doc: knownKind reports whether k is a record kind this build reads.
    name: knownKind
    params: k uint8
    results: bool
  - doc: allZero reports whether b holds only zero bytes.
    name: allZero
    params: b []byte
    results: bool
  - doc: scanRecOf is the scanRec of r, parsed at offset off.
    name: scanRecOf
    params: r *record, off int64
    results: scanRec
  - doc: |-
      unknownVersionAt looks, at every record boundary from off to the end of
      b, for a record whose crc holds but whose version this build does not
      write. Such a record is no damage: a newer build wrote it, synced, and
      may have acknowledged it; taken for a hole it would be zeroed as a torn
      tail. Unknown means stop, never skip.
    name: unknownVersionAt
    params: b []byte, seg uint64, off int64
    results: error
  - doc: |-
      scanSegments reads and parses every segment of dir in order. A segment is
      judged as soon as it is read, so the first damage found is the one
      reported, and nothing after it is read. Only the last segment's bytes are
      kept.
    name: scanSegments
    params: dir string, nums []uint64, sb *scanBufs
    results: "[]*scanned, error"
  - doc: |-
      scanSegment reads segment n of dir and parses its records up to the
      first hole, or through its seal: a sealed segment is read up to its seal,
      and the rest of a segment is read only for a hole, which is classified on
      the whole file. The bytes and the records go to sb's buffers, which the
      next segment reuses.
    name: scanSegment
    params: dir string, n uint64, sb *scanBufs
    results: "*scanned, error"
  - doc: |-
      checkBatchSequence refuses a log whose batch sequence is not contiguous
      across the whole log, at the first record that breaks it.
    name: checkBatchSequence
    params: segs []*scanned
    results: error
  - doc: |-
      checkLayouts refuses, before any tail is classified or trimmed, a record
      of a kind this build does not read: left to replay, one in an unfinished
      last batch would be trimmed with the tear and zeroed.
    name: checkLayouts
    params: segs []*scanned
    results: error
  - doc: |-
      continuesBatch reports whether r may follow prev: in prev's batch, or
      first of the next one once prev ended its own.
    name: continuesBatch
    params: prev, r *scanRec
    results: bool
  - doc: |-
      trimTornTail decides the fate of a hole in the last segment: a torn tail
      is dropped from the records, its truncation point kept for positionTail
      to zero and sync before any new record; any other hole is Damaged.
    name: trimTornTail
    params: last *scanned
    results: error
  - doc: |-
      classifyTail returns where to truncate a torn tail in the segment bytes
      b, whose valid records before the hole are recs, or -1 and why the hole
      is damage.
    name: classifyTail
    params: b []byte, recs []scanRec, hole int64
    results: int64, string
  - doc: recordsAfter is every valid record after the hole, at record boundaries.
    name: recordsAfter
    params: b []byte, hole int64
    results: "[]record"
  - doc: |-
      judgeAfterHole returns why a hole is damage given the valid records after
      it, or "" when they do not forbid a tear.
    name: judgeAfterHole
    params: after []record, torn uint64
    results: string
  - doc: |-
      tornBatchStart is where the torn batch, which never completed, begins:
      all of it is dropped, as it was never synced and never acknowledged. A
      torn batch that starts with the segment's checkpoint is damage.
    name: tornBatchStart
    params: recs []scanRec, lastOff int64, torn uint64
    results: int64, string
  - doc: |-
      segName is segment n's file name; fixed-width hex, so the names sort in
      segment order and recovery accepts no other spelling of n.
    name: segName
    params: n uint64
    results: string
  - doc: |-
      zeroFrom zeroes f from off to size, 1 MiB at a time, and syncs it; the
      sync runs even when there is nothing to zero.
    name: zeroFrom
    params: f *os.File, off, size int64
    results: error
  - doc: |-
      zeroRange writes zeros over f from off to size, 1 MiB at a time, and
      syncs nothing.
    name: zeroRange
    params: f io.WriterAt, off, size int64
    results: error
  - doc: |-
      abandonTmp closes f, the segment .tmp at path a failure leaves
      unpublished, removes it, and returns c, the failure being reported. A
      removal that fails leaves it to recovery, which deletes every .tmp.
    name: abandonTmp
    params: f io.Closer, path string, c error
    results: error
  - doc: |-
      datasync makes a segment's written bytes durable with fdatasync(2): the
      segment is zero-filled at its full size, so there is no size to publish.
    name: datasync
    params: f *os.File
    results: error
  - doc: |-
      syncDir makes a directory's entries durable: a rename or an unlink is
      published only once its directory is synced. The directory is only read,
      so its Close loses nothing; a failure there is still reported when the
      sync succeeded.
    name: syncDir
    params: dir string
    results: err error
