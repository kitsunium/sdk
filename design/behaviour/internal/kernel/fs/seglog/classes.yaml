        params: lo, hi uint64, maxBytes int
        recv: l *Log
        results: int
      - doc: |-
          run is how many of the at most max slots from slot i are durable,
          contiguous and in one segment: what one read returns.
        name: run
        params: i uint64, maxRun int
        recv: l *Log
        results: int
      - doc: pendingPayload is a copy of the payload of the pending record s locates.
        name: pendingPayload
        params: s slot
        recv: l *Log
        results: "[]byte"
