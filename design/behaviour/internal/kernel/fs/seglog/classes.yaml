          readRun reads the contiguous records slots locate, the first at index,
          with one read, checks each against what the log recorded, and appends
          their payloads to dst. A record that does not match is Damaged: the log
          disagrees with what it wrote.
        name: readRun
        params: index uint64, slots []slot, dst [][]byte
        recv: l *Log
        results: "[][]byte, error"
      - doc: segment is the open segment numbered n, nil when none is.
        name: segment
        params: n uint64
        recv: l *Log
        results: "*segment"
      - name: Close
        recv: l *Log
        results: error
      - doc: |-
          recover scans every segment, classifies every hole, and only then changes
          anything: a torn tail zeroed, the next segment published.
        name: recover
        recv: l *Log
        results: error
      - doc: |-
          segmentNumbers lists the published segments, sorted, deleting on the way
          every .tmp: only an incomplete one exists, one that never reached its
          rename. A name that is not exactly a segment's is ignored.
        name: segmentNumbers
        recv: l *Log
        results: "[]uint64, error"
      - doc: |-
          replay builds the log's index from every segment's checkpoint and
          records, in order, and judges continuity on the result.
        name: replay
        params: segs []*scanned
        recv: l *Log
        results: error
      - doc: replayRecord applies one record of segment seg to the index being built.
        name: replayRecord
        params: seg uint64, r *scanRec
        recv: l *Log
        results: error
      - doc: |-
          replayDrop is applyDrop during the replay: the front resliced away, not
          copied, which replay does once at its end.
        name: replayDrop
        params: index uint64
        recv: l *Log
      - doc: |-
          openSegments opens every scanned segment for reading and writing, in
          order; those already opened stay in l.segs for Close.
        name: openSegments
        params: segs []*scanned
        recv: l *Log
        results: error
      - doc: |-
          syncAtOpen makes durable everything recovery is about to trust, before
          anything is reported from it. A process killed between a batch's write
          and its sync leaves that batch in the page cache, complete with its end
          record: a restart in the same boot reads it as written, and would report
          records no device holds. The same holds for a rename or an unlink whose
          directory sync never ran.
        name: syncAtOpen
        recv: l *Log
        results: error
      - doc: |-
          positionTail sets the write offset in the last segment: at the torn
          tail's truncation point, zeroing and syncing what lies past it unless it
          is zero already, else right after the last valid record.
        name: positionTail
        params: last *scanned, tail *segment
        recv: l *Log
        results: error
      - doc: segPath is the path of segment n's file.
        name: segPath
        params: n uint64
        recv: l *Log
        results: string
      - doc: tmpPath is the path of segment n's file before its publication.
        name: tmpPath
        params: n uint64
        recv: l *Log
        results: string
      - doc: |-
          createSegment publishes segment n opening with cp: a zero-filled .tmp,
          the checkpoint, a sync, the rename, a sync of the directory. size is the
          segment's size.
        name: createSegment
        params: n uint64, size int64, cp *checkpoint
        recv: l *Log
        results: error
      - doc: |-
          segmentFile is the zero-filled .tmp of segment n at size: the prepared
          one when it is that segment at that size, else one created and zeroed
          now, on the writer's path.
        name: segmentFile
        params: n uint64, size int64, tmp string
        recv: l *Log
        results: "*os.File, error"
      - doc: |-
          prepare launches the goroutine that zero-fills segment n off the
          writer's path. It ends on its own once the .tmp is zeroed or has failed,
          closing done; takePrepared and Close only ever wait on it.
        name: prepare
        params: n uint64, size int64
        recv: l *Log
      - doc: |-
          takePrepared waits for the prepared segment n, when it is the one wanted
          at that size; nil means prepare it now.
        name: takePrepared
        params: n uint64, size int64
        recv: l *Log
        results: "*os.File"
      - doc: |-
          rotate seals the current segment in its own synced batch, then publishes
          the next one. It runs between batches only. need is the size of the
          batch that did not fit.
        name: rotate
        params: need int
        recv: l *Log
        results: error
      - doc: |-
          publishNext publishes the segment after the current one, whose seal is
          durable, from the durable state and the next batch number. A batch
          larger than a segment gets a segment of its own size.
        name: publishNext
        params: need int
        recv: l *Log
        results: error
      - doc: |-
          dropSegmentsLocked unlinks the prefix of sealed segments that hold only
          records below the first index, then syncs the directory. It runs after a
          sync, so the drop record that justifies it is durable first.
        name: dropSegmentsLocked
        recv: l *Log
        results: error
    name: Log
  - doc: record is one decoded record; data aliases the bytes it was parsed from.
    fields:
      - name: kind
        type: uint8
      - name: tag
        type: uint8
      - name: end
        type: bool
      - name: batch
        type: uint64
      - name: index
        type: uint64
      - name: data
        type: "[]byte"
      - name: length
        type: int
    kind: struct
    name: record
  - doc: |-
      checkpoint is the record that opens every segment: the index its first
      entry takes, the log's first index when it was activated, and the batch
      sequence number the segment starts with.
    fields:
      - name: next
        type: uint64
      - name: first
        type: uint64
      - name: nextBatch
        type: uint64
    kind: struct
    methods:
      - doc: |-
          encode is the checkpoint record's payload: three little-endian uint64s,
          in the order decodeCheckpoint reads them back.
        name: encode
        recv: c checkpoint
        results: "[]byte"
    name: checkpoint
  - doc: |-
      scanRec is what recovery keeps of a record past the scan: everything but
      its payload.
    fields:
      - name: "off"
        type: int64
      - name: batch
        type: uint64
      - name: index
        type: uint64
      - name: length
        type: uint32
      - name: size
        type: uint32
      - name: kind
        type: uint8
      - name: tag
        type: uint8
      - name: end
        type: bool
    kind: struct
    name: scanRec
  - doc: scanned is one segment as recovery read it, before anything is changed.
    fields:
      - name: "n"
        type: uint64
      - name: size
        type: int64
      - doc: |-
          data is the bytes read of the last segment, nil for the others: the
          whole file, unless it is sealed and was read up to its seal only.
        name: data
        type: "[]byte"
      - name: recs
        type: "[]scanRec"
      - doc: |-
          cp is the checkpoint the segment opens with; cpOK is false when its
          first record holds no checkpoint payload.
        name: cp
        type: checkpoint
      - name: cpOK
        type: bool
      - doc: |-
          layout is the VersionUnsupported of the segment's first record of a
          kind this build does not read, nil when there is none.
        name: layout
        type: error
      - doc: |-
          seqBreak is the offset of the first record that does not continue
          the batch sequence of the log read before it, -1 when none.
        name: seqBreak
        type: int64
      - name: hole
        type: int64
      - name: sealed
        type: bool
      - name: trimmed
        type: int64
    kind: struct
    methods:
      - doc: |-
          note appends to recs the scanRec of r, parsed at offset off, and judges
          what only its payload tells: the checkpoint the segment opens with, and a
          record of a kind this build does not read.
        name: note
        params: recs []scanRec, r *record, off int64
        recv: s *scanned
        results: "[]scanRec"
      - doc: |-
          parse appends to recs the records of s read through reader, up to the
          first hole or through the seal, and returns them.
        name: parse
        params: reader *segRead, recs []scanRec
        recv: s *scanned
        results: "[]scanRec, error"
      - doc: |-
          holeAt records the hole at off once the rest of the file is read, which
          is where it is classified. A record a newer build wrote, here or past the
          hole, stops the open before anything is classified or changed.
        name: holeAt
        params: reader *segRead, off int64
        recv: s *scanned
        results: error
    name: scanned
  - doc: |-
      scanBufs is what the scan reuses from one segment to the next: the
      buffer a segment is read into and the records parsed from it. chunk is
      how far ahead it reads, scanChunk when zero; only a test sets it.
    fields:
      - name: b
        type: "[]byte"
      - name: recs
        type: "[]scanRec"
      - name: chunk
        type: int64
    kind: struct
    methods:
      - doc: |-
          reader is the read of segment file f into sb's buffer, grown when the
          file is larger than any before it. A file larger than an int holds is
          refused before the buffer is made.
        name: reader
        params: f *os.File
        recv: sb *scanBufs
        results: "*segRead, error"
    name: scanBufs
  - doc: |-
      segRead is a segment file read in order into b, the file's size, of
      which the first n bytes are read, chunk at least at a time. What lies
      past n is an earlier segment's bytes, and no parse looks at it.
    fields:
      - name: f
        type: io.Reader
      - name: b
        type: "[]byte"
      - name: "n"
        type: int64
      - name: chunk
        type: int64
    kind: struct
    methods:
      - doc: |-
          record reads enough for parseRecord to judge the record at off on
          b[off:n] as it would on the whole file.
        name: record
        params: off int64
        recv: r *segRead
        results: error
      - doc: |-
          upTo reads the file up to end, at most its size, a chunk at least at a
          time.
        name: upTo
        params: end int64
        recv: r *segRead
        results: error
    name: segRead
  - doc: |-
      batchSeq follows the batch sequence across the log, segment after
      segment.
    fields:
      - name: prev
        type: scanRec
      - name: any
        type: bool
    kind: struct
    methods:
      - doc: |-
          follow returns the offset of the first record of recs that does not
          continue the sequence read so far, -1 when every one does.
        name: follow
        params: recs []scanRec
        recv: q *batchSeq
        results: int64
    name: batchSeq
  - doc: segment is one published segment file, open for reading and writing.
    fields:
      - name: "n"
        type: uint64
      - name: f
        type: "*os.File"
      - doc: size is the file's fixed size.
        name: size
        type: int64
      - doc: "start is the index its first entry takes: its checkpoint's next."
        name: start
        type: uint64
    kind: struct
    name: segment
  - doc: |-
      prepared is the next segment, zero-filled in the background as a .tmp
      while the current one fills. It is never published early: recovery
      deletes any .tmp, and its checkpoint is written at activation.
    fields:
      - name: "n"
        type: uint64
      - name: size
        type: int64
      - name: done
        type: chan struct{}
      - name: f
        type: "*os.File"
      - name: err
        type: error
    kind: struct
    name: prepared
vars:
  - doc: castagnoli is the CRC-32C table every record's crc is computed with.
    items:
      - name: castagnoli
        value: crc32.MakeTable(crc32.Castagnoli)
    name: castagnoli
