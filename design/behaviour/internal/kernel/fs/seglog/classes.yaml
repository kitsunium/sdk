package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/fs/seglog
  name: seglog
  purpose: "Package seglog is a durable, append-only log of records addressed by a contiguous uint64 index, kept in a directory of fixed-size, zero-filled segment files: the segmented log the consensus file log wrote for itself (ADR 0152 D4), extracted without its vocabulary so that any engine needing an ordered, crash-recovering sequence of byte payloads builds on it rather than rewriting it (ADR 0159, ADR 0230)."
types:
  - doc: |-
      cause is the text of a failure's cause, recorded as a field of the error
      a caller matches on and never wrapped as an error of its own.
    kind: named
    methods:
      - doc: Error returns the cause's text unchanged.
        name: Error
        recv: c cause
        results: string
    name: cause
    underlying: string
  - doc: |-
      slot locates one retained entry: in the pending batch before its sync,
      in segment seg after.
    fields:
      - name: seg
        type: uint64
      - name: "off"
        type: int64
      - name: size
        type: uint32
      - name: kind
        type: uint8
      - name: pending
        type: bool
    kind: struct
    name: slot
  - doc: |-
      durable is the state the synced records describe, which a rotation's
      checkpoint is written from, never from the pending batch it precedes.
    fields:
      - name: next
        type: uint64
      - name: first
        type: uint64
    kind: struct
    name: durable
  - fields:
      - name: dir
        type: string
      - name: segBytes
        type: int64
      - doc: mu guards the state below; readers hold it shared.
        name: mu
        type: sync.RWMutex
      - name: segs
        type: "[]*segment"
      - doc: off is the write offset in the last segment.
        name: "off"
        type: int64
      - doc: batch is the sequence number of the pending batch.
        name: batch
        type: uint64
      - name: pending
        type: "[]byte"
      - doc: pendingLast is the offset in pending of its last record, -1 for none.
        name: pendingLast
        type: int
      - name: first
        type: uint64
      - name: next
        type: uint64
      - doc: slots[i] locates entry first+i.
        name: slots
        type: "[]slot"
      - name: dur
        type: durable
      - name: prep
        type: "*prepared"
      - doc: failed is the failure that stopped the log, nil while it is healthy.
        name: failed
        type: error
      - name: closed
        type: bool
      - doc: tornTails counts the torn tails recovery repaired; a test reads it.
        name: tornTails
        type: int
      - doc: |-
          afterSeal runs once a rotation's seal is durable and before the next
          segment is published; duringSync runs between each write of a batch
          and its sync, the lock released. Only a test sets them.
        name: afterSeal
        type: func()
      - name: duringSync
        type: func()
      - doc: |-
          wmu serialises the writers. A sync holds it, not mu, across its write
          and sync, so readers do not wait for the disk.
        name: wmu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          usable is why the log refuses a call: closed, then the failure that
          stopped it, nil while it is healthy.
        name: usable
        recv: l *Log
        results: error
      - doc: |-
          add appends r to the pending batch and remembers it as the batch's last
          record, the one Sync flags end-of-batch.
        name: add
        params: r *record
        recv: l *Log
      - name: Append
        params: index uint64, kind uint8, payload []byte
        recv: l *Log
        results: error
      - name: Sync
        recv: l *Log
        results: error
      - doc: syncLocked is Sync; the caller holds wmu and mu.
        name: syncLocked
        recv: l *Log
        results: error
      - doc: |-
          writeBatch makes the pending batch durable at l.off in segment cur in two
          steps: every record before the last, synced, then the last one, which
          carries the end-of-batch flag, synced. A power cut during one sync may
          persist any subset of its dirty pages, the end record's without an
          earlier one's; written last and on its own, a valid end record proves the
          rest of its batch durable before it, so a hole before it is damage to
          synced data, and nothing else.
        name: writeBatch
        params: cur *segment
        recv: l *Log
        results: error
      - doc: writeAndSync writes b at off in segment cur and syncs it.
        name: writeAndSync
        params: cur *segment, b []byte, off int64
        recv: l *Log
        results: error
      - doc: |-
          settleBatch records the pending batch, now synced in segment seg, as
          durable: its entries are read from disk from here on, the write offset
          moves past it, and the next batch gets the next sequence number.
        name: settleBatch
        params: seg uint64
        recv: l *Log
      - doc: markDurable records the state the synced records now describe.
        name: markDurable
        recv: l *Log
      - doc: restamp rewrites the batch sequence of every pending record.
        name: restamp
        params: batch uint64
        recv: l *Log
      - name: DropBefore
        params: index uint64
        recv: l *Log
        results: error
      - doc: |-
          applyDrop makes index the first: the slots below it go, and past the
          next the log is empty and starts there.
        name: applyDrop
        params: index uint64
        recv: l *Log
      - name: Bounds
        recv: l *Log
        results: first, next uint64
      - name: Kind
        params: index uint64
        recv: l *Log
        results: uint8, error
      - name: Read
        params: index uint64
        recv: l *Log
        results: "[]byte, error"
      - name: Range
        params: lo, hi uint64, maxBytes int, dst [][]byte
