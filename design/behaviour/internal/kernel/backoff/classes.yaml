# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: |-
          maxDuration is the longest wait a time.Duration can represent. A backoff
          that grows past it is held there rather than converted: Go leaves the
          conversion of an out-of-range float64 to an integer
          implementation-defined, and on amd64 it yields math.MinInt64 — a
          NEGATIVE wait, which a timer fires at once, abolishing the backoff at
          exactly the attempt where it is longest.
        name: maxDuration
        type: time.Duration
        value: math.MaxInt64
      - doc: |-
          defaultMultiplier is the growth factor a multiplier that would not grow
          resolves to: standard exponential doubling.
        name: defaultMultiplier
        type: float64
        value: "2"
      - doc: noJitter is the deterministic backoff, and the zero value.
        name: noJitter
        type: float64
        value: "0"
      - doc: |-
          maxJitter is the ceiling on a jitter fraction. Above 1 the random
          component would exceed the delay it widens, which is a different policy
          (a randomised wait) wearing this one's name.
        name: maxJitter
        type: float64
        value: "1"
    name: maxDuration
  - doc: |-
      decorrelatedFactor is how far above the previous wait a decorrelated draw
      may reach: the Builders' Library's `random_between(base, sleep * 3)`.
    items:
      - name: decorrelatedFactor
        type: float64
        value: "3"
    name: decorrelatedFactor
  - doc: |-
      The three ways a [Value] lays its randomisation on the curve. The zero is
      the additive jitter the curve has always had, so a Value written before
      the mode existed waits exactly as it did (ADR 0031).
    grouped: true
    items:
      - doc: |-
          JitterAdditive widens the grown wait by a random fraction of itself,
          drawn from [0, Jitter) and ADDED: the average wait keeps growing with
          the attempt. A zero Jitter is the deterministic curve. It is the zero
          JitterMode.
        name: JitterAdditive
        type: JitterMode
        value: iota
      - doc: |-
          JitterFull draws the wait uniformly from [0, grown], the grown wait being
          the curve held at MaxDelay: the "Full Jitter" of the Builders' Library,
          which spreads callers that failed together the most widely of the three
          and keeps the average at half the curve. Jitter is not read.
        name: JitterFull
      - doc: |-
          JitterDecorrelated draws each wait from the previous one, as [Decorrelate]
          does: uniformly from [BaseDelay, 3 × previous], held at MaxDelay — the
          "Decorrelated Jitter" of the Builders' Library. A loop that keeps the
          previous wait calls Decorrelate; [Value.Delay], which has no memory,
          reads the curve's own previous step as the previous wait. Jitter is not
          read.
        name: JitterDecorrelated
    name: JitterAdditive
files:
  - decls:
      - maxDuration
      - Value
      - Value.Delay
      - Grow
      - Widen
      - NormalMultiplier
      - NormalJitter
      - grow
      - widen
    name: backoff.go
  - decls: []
    name: doc.go
  - decls:
      - decorrelatedFactor
      - JitterMode
      - JitterAdditive
      - JitterMode.String
      - Full
      - Decorrelate
    name: jitter.go
functions:
  - name: Grow
    params: base, ceiling time.Duration, multiplier float64, attempt int
    results: time.Duration
  - name: Widen
    params: delay time.Duration, jitter float64
    results: time.Duration
  - name: NormalMultiplier
    params: multiplier float64
    results: float64
  - name: NormalJitter
    params: jitter float64
    results: float64
  - doc: |-
      grow computes base × multiplier^(attempt−1), held at ceiling when one is set
      and at maxDuration otherwise. multiplier is already normalised (> 1, or +Inf).
    name: grow
    params: base, ceiling time.Duration, multiplier float64, attempt int
    results: time.Duration
  - doc: |-
      widen adds a uniform random fraction of delay, drawn from [0, jitter), to
      delay. jitter is already clamped into [0, 1].

      It is separate from grow so the growth stays a PURE function of the
      attempt: the deterministic curve and the randomisation are two claims, and a
      suite that cannot assert the first without the second can assert neither.
    name: widen
    params: delay time.Duration, jitter float64
    results: time.Duration
  - name: Full
    params: delay time.Duration
    results: time.Duration
  - name: Decorrelate
    params: base, ceiling, previous time.Duration
    results: time.Duration
imports:
  math: math
  rand: math/rand/v2
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/kernel/backoff
  name: backoff
  purpose: "Package backoff computes an exponential backoff: how long a loop that keeps failing waits before its next attempt."
types:
  - fields:
      - doc: |-
          BaseDelay is the wait after the first failure. Zero or negative waits
          nothing.
        name: BaseDelay
        type: time.Duration
      - doc: MaxDelay is the ceiling on the grown delay. Zero means no ceiling.
        name: MaxDelay
        type: time.Duration
      - doc: |-
          Multiplier is the growth factor between consecutive waits. 1 or below,
          and NaN, mean 2.
        name: Multiplier
        type: float64
      - doc: |-
          Jitter widens each wait by a uniform random fraction of itself, drawn
          from [0, Jitter) and ADDED, after the MaxDelay ceiling — so when a
          ceiling is set a wait may reach MaxDelay × (1 + Jitter). Zero is the
          deterministic backoff.

          It exists because a deterministic backoff SYNCHRONISES the very callers
          it is meant to spread: N clients that fail against one dependency at the
          same instant retry at the same instant, N times over. Jitter turns those
          bursts back into a distribution.

          It is read only under JitterAdditive.
        name: Jitter
        type: float64
      - doc: |-
          JitterMode is how the randomisation is laid on the curve. The zero,
          JitterAdditive, is the Jitter above — what Value has always done;
          JitterFull and JitterDecorrelated are the Builders' Library's two
          other variants, which randomise the whole wait and ignore Jitter. A
          value outside the three is read as JitterAdditive.
        name: JitterMode
        type: JitterMode
    kind: struct
    methods:
      - name: Delay
        params: attempt int
        recv: b Value
        results: time.Duration
    name: Value
  - kind: named
    methods:
      - name: String
        recv: m JitterMode
        results: string
    name: JitterMode
    underlying: uint8
