# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      hexDigits spells the two digits of a \u00XX escape, lowercase as
      encoding/json writes them.
    items:
      - name: hexDigits
        type: string
        value: "\"0123456789abcdef\""
    name: hexDigits
  - doc: The bytes AppendEscaped never copies as they are, and the sizes of its loops.
    grouped: true
    items:
      - doc: |-
          controlBound is the bound below which a byte is a control character, which
          RFC 8259 §7 requires escaped. 0x20 is within swar's exact range (128).
        name: controlBound
        type: byte
        value: "0x20"
      - doc: nibbleShift reaches a byte's high nibble.
        name: nibbleShift
        type: byte
        value: "4"
      - doc: nibbleMask keeps a byte's low nibble.
        name: nibbleMask
        type: byte
        value: "0x0f"
      - doc: "byteValues is how many values a byte has: the size of the table of plain bytes."
        name: byteValues
        type: int
        value: "256"
      - doc: |-
          scalarWindow is how many bytes the byte loop reads after the search finds
          a byte: enough that a dense stretch pays for the search once, few enough
          that a lone escape in a long string does not make the rest of it a byte loop.
        name: scalarWindow
        type: int
        value: "16"
      - doc: |-
          dense is how many hits a window needs to be called dense, which keeps the
          byte loop reading: the hit that ended the search is one of them.
        name: dense
        type: int
        value: "2"
      - doc: |-
          searchMin is the length from which the word search beats the byte loop,
          measured (BENCH.md): below it the fixed price of a search call is not repaid.
        name: searchMin
        type: int
        value: "32"
    name: controlBound
  - doc: |-
      The UTF-8 shapes the byte loop reads in place, without a decode call. C2 to
      DF lead a two-byte rune (C0 and C1 would be overlong); E1 to EC, EE and EF
      lead a three-byte rune that is neither overlong (E0) nor a surrogate (ED);
      a continuation byte is 10xxxxxx. E2 80 A8 and E2 80 A9 are the two
      separators, which the loop does not copy.
    grouped: true
    items:
      - name: twoByteLead
        type: byte
        value: "0xC2"
      - name: twoByteMax
        type: byte
        value: "0xDF"
      - name: threeByteOverlong
        type: byte
        value: "0xE0"
      - name: threeByteMax
        type: byte
        value: "0xEF"
      - name: threeByteSurr
        type: byte
        value: "0xED"
      - name: contMask
        type: byte
        value: "0xC0"
      - name: contBits
        type: byte
        value: "0x80"
      - name: twoBytes
        type: int
        value: "2"
      - name: threeBytes
        type: int
        value: "3"
      - name: separatorLead
        type: byte
        value: "0xE2"
      - name: separatorMid
        type: byte
        value: "0x80"
      - name: separatorLast
        type: byte
        value: "0xA8"
    name: twoByteLead
  - doc: |-
      The two separators encoding/json escapes though RFC 8259 does not require it:
      legal in a JSON string, a line end in a script.
    grouped: true
    items:
      - name: lineSeparator
        type: rune
        value: "0x2028"
      - name: paragraphSeparator
        type: rune
        value: "0x2029"
    name: lineSeparator
  - doc: replacement is U+FFFD as the three UTF-8 bytes it is written with.
    items:
      - name: replacement
        type: string
        value: "\"\\xef\\xbf\\xbd\""
    name: replacement
files:
  - decls: []
    name: doc.go
  - decls:
      - Object
