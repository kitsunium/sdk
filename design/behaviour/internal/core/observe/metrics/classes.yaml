functions:
  - name: ValidateAttrs
    params: sorted []coreotel.AttrValue
  - name: NormalizeResource
    params: resource coreotel.ResourceValue
    results: coreotel.ResourceValue
  - name: DefaultBuckets
    results: "[]float64"
  - name: ExponentialIndex
    params: magnitude float64, scale int32
    results: int32
  - name: ExponentialLowerBound
    params: index, scale int32
    results: float64
  - doc: |-
      powerOfTwoIndex is the bucket index of the exact power of two 2^e at scale:
      the bucket whose INCLUSIVE upper bound it is.
    name: powerOfTwoIndex
    params: e, scale int32
    results: int32
  - name: RegisterExporter
    params: e Exporter
    results: Exporter
  - name: LookupExporter
    params: name ExporterName
    results: e Exporter, ok bool
  - name: AvailableExporters
    results: "[]ExporterName"
  - name: Export
    params: name ExporterName, snap SnapshotValue
    results: error
  - name: ExportContext
    params: ctx context.Context, name ExporterName, snap SnapshotValue
    results: error
  - doc: |-
      boundExport returns ctx unchanged when it already carries a deadline, and
      ctx bounded by DefaultExportTimeout when it does not, with the function that
      releases it.
    name: boundExport
    params: ctx context.Context
    results: context.Context, context.CancelFunc
  - name: NormalizeScope
    params: scope coreotel.ScopeValue
    results: coreotel.ScopeValue
imports:
  context: context
  coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  plugin: github.com/kitsunium/sdk/internal/kernel/plugin
  slices: slices
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/observe/metrics
  name: metrics
  purpose: Package metrics — the sibling port that registers asynchronous instruments.
types:
  - fields:
      - doc: Time is when the measurement was recorded, on the meter's clock.
        name: Time
        type: time.Time
      - doc: |-
          Value is the measurement. On a sum point it holds the integer the
          instrument was handed — exact below 2^53 — and OTLP/JSON writes it as
          asInt; on a histogram point it is the recorded double, asDouble.
        name: Value
        type: float64
      - doc: TraceID is the trace the measurement was recorded in.
        name: TraceID
        type: "[16]byte"
      - doc: SpanID is the span the measurement was recorded in.
        name: SpanID
        type: "[8]byte"
    kind: struct
    name: ExemplarValue
  - fields:
      - doc: Offset is the bucket index of Counts[0].
        name: Offset
        type: int32
      - doc: Counts holds one count per bucket, PER BUCKET (not cumulative).
        name: Counts
        type: "[]uint64"
    kind: struct
    name: ExponentialBucketsValue
  - fields:
      - doc: |-
          Attrs is the series' attribute set, sorted by Key; nil for the
          dimensionless series. See SumValue.Attrs for the aliasing rule.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: |-
          Scale sets the resolution: base = 2^(2^-Scale), so each bucket's upper
          bound is base times its lower. ExponentialMinScale to
          ExponentialMaxScale.
        name: Scale
        type: int32
      - doc: |-
          ZeroCount counts the observations whose magnitude is at most
          ZeroThreshold — zero itself, since this SDK's threshold is 0.
        name: ZeroCount
        type: uint64
      - doc: ZeroThreshold is the magnitude ZeroCount covers; 0 in this SDK.
        name: ZeroThreshold
        type: float64
      - doc: Positive holds the buckets of the positive observations.
        name: Positive
        type: ExponentialBucketsValue
      - doc: Negative holds the buckets of the negative observations, by magnitude.
        name: Negative
        type: ExponentialBucketsValue
      - doc: Sum is the total of every observed value in the window.
        name: Sum
        type: float64
      - doc: Count is how many observations the window holds, ZeroCount included.
        name: Count
        type: uint64
      - doc: |-
          Exemplars holds at most one exemplar: the last measurement of the
          window recorded with RecordContext under a sampled span. Its buckets
          move when the scale drops, so one per bucket would point at a bucket
          that no longer exists.
        name: Exemplars
        type: "[]ExemplarValue"
    kind: struct
    name: ExponentialHistogramValue
  - kind: named
    methods:
      - name: String
        recv: n ExporterName
        results: string
    name: ExporterName
    underlying: string
  - fields:
      - doc: |-
          Attrs is the series' attribute set, sorted by Key; nil for the
          dimensionless series. See SumValue.Attrs for the aliasing rule.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: Value is the last reading taken.
        name: Value
        type: float64
    kind: struct
    name: GaugeValue
  - fields:
      - doc: |-
          Attrs is the series' attribute set, sorted by Key; nil for the
          dimensionless series. See SumValue.Attrs for the aliasing rule.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: |-
          Bounds holds the histogram's explicit upper bounds, ascending. OTLP
          calls this field explicit_bounds.
        name: Bounds
        type: "[]float64"
      - doc: |-
          Counts holds one count per bucket plus the +Inf overflow slot. The
          counts are PER BUCKET, not cumulative — a format that wants a
          cumulative ladder (Prometheus) builds it as it walks.
        name: Counts
        type: "[]uint64"
      - doc: |-
          Sum is the total of every observed value in the window; 0 and
          meaningless when NoSum is true.
        name: Sum
        type: float64
      - doc: Count is how many observations the window holds.
        name: Count
        type: uint64
      - doc: |-
          NoSum is true when the source keeps no total of what it counted — an
          observable histogram read off runtime/metrics, whose histograms carry
          counts and no sum. Sum is then not a reading, and every exporter says
          so rather than print it: OTLP/JSON writes the optional sum as absent,
          the Prometheus connector writes no _sum line, the text exporter is
          unchanged (it prints the count). The zero value is a histogram that
          knows its sum, which every synchronous histogram does.
        name: NoSum
        type: bool
      - doc: |-
          Exemplars holds at most one exemplar per bucket, in bucket order: the
          last measurement of the window recorded with RecordContext under a
          SAMPLED span (ADR 0051). Nil when none was.
        name: Exemplars
        type: "[]ExemplarValue"
    kind: struct
    name: HistogramValue
  - kind: named
    name: ObserveInt64
    underlying: func(value int64, attrs ...coreotel.AttrValue)
  - kind: named
    name: ObserveFloat64
    underlying: func(value float64, attrs ...coreotel.AttrValue)
  - kind: named
    name: Int64Callback
    underlying: func(observe ObserveInt64)
  - kind: named
    name: Float64Callback
    underlying: func(observe ObserveFloat64)
  - kind: named
    name: ObserveHistogram
    underlying: func(point HistogramValue)
  - kind: named
    name: HistogramCallback
    underlying: func(observe ObserveHistogram)
  - fields:
      - doc: |-
          Temporality says which window Points cover. Never
          TemporalityUnspecified — a Meter resolves it at construction.
        name: Temporality
        type: Temporality
      - doc: |-
          Monotonic is true for a Counter and false for an UpDownCounter. A
          backend uses it to decide whether a decrease is a reset or a reading.
        name: Monotonic
        type: bool
      - doc: |-
          Description is the instrument's human-readable docstring, or "" when
          nobody described it. It is NON-IDENTIFYING — the OTel data model says so
          outright — so it never joins the series identity and an exporter that
          cannot carry it loses nothing but the prose. See Describer.
        name: Description
        type: string
      - doc: |-
          Unit is the instrument's unit in UCUM ("s", "By", "{request}"), or ""
          when nobody declared one. Like Description it belongs to the name, is
          non-identifying, and an exporter that cannot carry it loses only the
          annotation (ADR 0208). See UnitDescriber.
        name: Unit
        type: string
      - doc: Points holds the name's series, sorted by attribute set.
        name: Points
        type: "[]SumValue"
    kind: struct
    name: SumMetricValue
  - fields:
      - doc: |-
          Description is the instrument's human-readable docstring, or "" when
          nobody described it. See SumMetricValue.Description.
        name: Description
        type: string
      - doc: |-
          Unit is the instrument's unit in UCUM ("s", "By", "{request}"), or ""
          when nobody declared one. Like Description it belongs to the name, is
          non-identifying, and an exporter that cannot carry it loses only the
          annotation (ADR 0208). See UnitDescriber.
        name: Unit
        type: string
      - doc: Points holds the name's series, sorted by attribute set.
        name: Points
        type: "[]GaugeValue"
    kind: struct
    name: GaugeMetricValue
  - fields:
      - doc: |-
          Temporality says which window Points cover. Never
          TemporalityUnspecified.
        name: Temporality
        type: Temporality
      - doc: |-
          Description is the instrument's human-readable docstring, or "" when
          nobody described it. See SumMetricValue.Description.
        name: Description
        type: string
      - doc: |-
          Unit is the instrument's unit in UCUM ("s", "By", "{request}"), or ""
          when nobody declared one. Like Description it belongs to the name, is
          non-identifying, and an exporter that cannot carry it loses only the
          annotation (ADR 0208). See UnitDescriber.
        name: Unit
        type: string
      - doc: Points holds the name's series, sorted by attribute set.
        name: Points
        type: "[]HistogramValue"
    kind: struct
    name: HistogramMetricValue
  - fields:
      - doc: Resource identifies the producer, carried once for the whole payload.
        name: Resource
        type: coreotel.ResourceValue
      - doc: |-
          Scope identifies the instrumentation, carried once for the whole
          payload.
        name: Scope
        type: coreotel.ScopeValue
      - doc: |-
          StartTime opens the window every point covers. Under
          TemporalityCumulative it is the meter's own start and repeats across
          collections; under TemporalityDelta it advances to the previous
          collection's Time.

          It is one value for the whole snapshot rather than one per point
          because every point in one Collect covers the same window. An encoder
          that needs it per point (OTLP does) copies this one down.
        name: StartTime
        type: time.Time
      - doc: "Time closes the window: the instant the collection was taken."
        name: Time
        type: time.Time
      - doc: |-
          Sums maps an instrument name to its sum metric — Counters and
          UpDownCounters together, told apart by SumMetricValue.Monotonic.
        name: Sums
        type: map[string]SumMetricValue
      - doc: Gauges maps an instrument name to its gauge metric.
        name: Gauges
        type: map[string]GaugeMetricValue
      - doc: Histograms maps an instrument name to its histogram metric.
        name: Histograms
        type: map[string]HistogramMetricValue
      - doc: |-
          ExponentialHistograms maps an instrument name to its exponential
          histogram metric. Nil from a meter that holds none.
        name: ExponentialHistograms
        type: map[string]ExponentialHistogramMetricValue
    kind: struct
    name: SnapshotValue
  - fields:
      - doc: |-
          Temporality says which window Points cover. Never
          TemporalityUnspecified.
        name: Temporality
        type: Temporality
      - doc: |-
          Description is the instrument's human-readable docstring, or "" when
          nobody described it. See SumMetricValue.Description.
        name: Description
        type: string
      - doc: |-
          Unit is the instrument's unit in UCUM, or "" when nobody declared one
          (ADR 0208). See UnitDescriber.
        name: Unit
        type: string
      - doc: Points holds the name's series, sorted by attribute set.
        name: Points
        type: "[]ExponentialHistogramValue"
    kind: struct
    name: ExponentialHistogramMetricValue
  - kind: named
    name: StatKind
    underlying: uint8
  - kind: named
    name: ReportStat
    underlying: func(name string, kind StatKind, unit string, value int64, attrs ...coreotel.AttrValue)
  - fields:
      - doc: |-
          Attrs is the series' attribute set, sorted by Key; nil for the
          dimensionless series.

          The slice ALIASES the meter's own copy — it is not cloned per Collect.
          The meter never mutates an attribute set after the series is created,
          so a reader is safe; a writer would corrupt every future snapshot.
          Cloning instead would cost one allocation per series per collection,
          i.e. it would scale the cost of scraping with cardinality, which is
          the exact axis the cardinality bound exists to contain.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: |-
          Value is the series' total: cumulative since the meter started, or the
          delta since the previous collection, according to
          SumMetricValue.Temporality.
        name: Value
        type: int64
      - doc: |-
          Exemplars holds at most one exemplar: the last measurement of the
          window recorded with AddContext under a SAMPLED span (ADR 0051). Nil
          when none was.
        name: Exemplars
        type: "[]ExemplarValue"
    kind: struct
    name: SumValue
  - kind: named
    methods:
      - name: String
        recv: t Temporality
        results: string
      - name: Resolved
        recv: t Temporality
        results: Temporality
    name: Temporality
    underlying: uint8
vars:
  - doc: |-
      defaultBuckets is the OpenTelemetry SDK's default explicit bucket ladder,
      copied out by DefaultBuckets and never handed out itself.
    items:
      - name: defaultBuckets
        value: "[]float64{0, 5, 10, 25, 50, 75, 100, 250, 500, 750, 1000, 2500, 5000, 7500, 10000}"
    name: defaultBuckets
  - doc: |-
      registry maps each ExporterName to its Exporter — a read-mostly,
      copy-on-write table (kernel/plugin.Registry), the same mechanism the other
      signal's exporter registry runs on.
    items:
      - name: registry
        type: plugin.Registry[ExporterName, Exporter]
    name: registry
