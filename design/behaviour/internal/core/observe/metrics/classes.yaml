# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      OverflowAttrKey names the reserved attribute the meter attaches to the single
      aggregated series it folds observations into once an instrument has reached
      its cardinality bound. It is spelled with underscores rather than dots so it
      needs no mangling to be a legal Prometheus label name — unlike every
      OTel-conventional key, which is dotted.

      The key is RESERVED: a caller who passes it explicitly with a BOOL value is
      writing into the same series the meter uses for overflow, and their
      observations merge with it. That is not enforced — enforcing it would cost a
      comparison per attribute on the lookup path to prevent a collision nobody
      reaches by accident.
    items:
      - name: OverflowAttrKey
        type: string
        value: "\"sdk_metric_overflow\""
    name: OverflowAttrKey
  - doc: |-
      MaxUnitLen is the longest unit UnitDescriber accepts, in bytes: a UCUM unit
      is a short label a backend reads, never a document (ADR 0208).
    items:
      - name: MaxUnitLen
        type: int
        value: "63"
    name: MaxUnitLen
  - grouped: true
    items:
      - doc: |-
          ExponentialMinScale is the lowest scale an exponential histogram falls to:
          base 2^1024, three buckets cover every finite double. The OpenTelemetry
          specification's floor.
        name: ExponentialMinScale
        type: int32
        value: "-10"
      - doc: |-
          ExponentialMaxScale is the scale an exponential histogram starts at — base
          2^(2^-20), a relative error under 1e-6 — and the specification's ceiling.
          The histogram only ever lowers it, when the range it holds needs more
          buckets than its maximum.
        name: ExponentialMaxScale
        type: int32
        value: "20"
      - doc: |-
          DefaultExponentialMaxSize is the bucket count per range — positive and
          negative each — an exponential histogram created with a maxSize of zero or
          less holds: the OpenTelemetry SDKs' default, 160, which keeps a 1 µs to
          100 s latency range at scale 3, a relative error under 4.5 %.
        name: DefaultExponentialMaxSize
        type: int
        value: "160"
    name: ExponentialMinScale
  - doc: The two facts of IEEE 754 binary64 the mapping rests on.
    grouped: true
    items:
      - doc: frexpHalf is the fraction math.Frexp returns for an exact power of two.
        name: frexpHalf
        type: float64
        value: "0.5"
      - doc: |-
          maxNormalExponent is one past the largest double's base-2 exponent:
          math.MaxFloat64 < 2^1024.
        name: maxNormalExponent
        type: int32
        value: "1024"
    name: frexpHalf
  - doc: |-
      DefaultExportTimeout bounds one export when the caller's context carries no
      deadline of its own: 30 s, the OpenTelemetry metrics SDK specification's
      default exportTimeout for a periodic exporting reader
      (OTEL_METRIC_EXPORT_TIMEOUT). A context with no deadline is how an
      indefinite block is written; a caller who wants another bound puts it on the
      context.
    items:
      - name: DefaultExportTimeout
        type: time.Duration
        value: 30 * time.Second
    name: DefaultExportTimeout
  - doc: |-
      DefaultScopeName names this SDK as the instrumenting library when a caller
      declares no scope of their own. An empty scope name is legal in the
      specification and useless in a backend, so the meter fills in the one thing
      it can state truthfully: which library minted the instruments.

      It is this signal's own constant and is deliberately not shared:
      internal/core/observe/trace declares its own, because a scope names the library that
      produced THIS signal (ADR 0051 §Decision 2).
    items:
      - name: DefaultScopeName
        type: string
        value: "\"github.com/kitsunium/sdk/pkg/v1/observe/metrics\""
    name: DefaultScopeName
  - doc: The two kinds of engine statistic an Observer reports (#871).
    grouped: true
    items:
      - doc: |-
          StatCounter is a count that only grows while the engine lives — hits,
          batches sent —, carried as an observable counter.
        name: StatCounter
        type: StatKind
        value: "1"
      - doc: |-
          StatGauge is a level read now — entries held, a backlog —, carried as an
          observable up-down counter.
        name: StatGauge
        type: StatKind
        value: "2"
    name: StatCounter
  - doc: The three wire spellings, which the text exporter emits verbatim.
    grouped: true
    items:
      - name: temporalityUnspecifiedText
        type: string
        value: "\"unspecified\""
      - name: temporalityDeltaText
        type: string
        value: "\"delta\""
      - name: temporalityCumulativeText
        type: string
        value: "\"cumulative\""
    name: temporalityUnspecifiedText
  - grouped: true
    items:
      - doc: |-
          TemporalityUnspecified is the zero value and means "the caller has not
          chosen". It is legal ONLY in a MeterConfig, where it resolves to
          TemporalityCumulative; it never reaches a SnapshotValue.
        name: TemporalityUnspecified
        type: Temporality
        value: iota
      - doc: |-
          TemporalityDelta means each point covers the window since the previous
          collection: (T1,T2], then (T2,T3]. The reported number is consumed by
          the collection that reads it and starts again from zero.
        name: TemporalityDelta
      - doc: |-
          TemporalityCumulative means each point covers the window since the
          series started: (T0,T1], then (T0,T2]. The reported number is a running
          total and a reader differences successive collections itself.
        name: TemporalityCumulative
    name: TemporalityUnspecified
