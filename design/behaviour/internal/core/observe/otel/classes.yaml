  - name: Int64
    params: key string, value int64
    results: AttrValue
  - name: Float64
    params: key string, value float64
    results: AttrValue
  - name: CompareAttrKey
    params: a, b AttrValue
    results: int
  - name: CompareAttrValue
    params: a, b AttrValue
    results: int
  - name: ValidateAttrs
    params: sorted []AttrValue, refusal error
  - name: SortAttrs
    params: attrs []AttrValue, refusal error
    results: "[]AttrValue"
  - name: NormalizeResource
    params: resource ResourceValue, refusal error
