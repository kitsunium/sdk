imports:
  binary: encoding/binary
  cmp: cmp
  math: math
  slices: slices
  strconv: strconv
  strings: strings
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/observe/otel
  name: otel
  purpose: "Package otel holds the OpenTelemetry types every signal shares: the typed attribute (common/v1 KeyValue and AnyValue), the Resource (resource/v1) and the InstrumentationScope (common/v1)."
types:
  - kind: named
    name: AttrKind
    underlying: uint8
  - fields:
      - doc: |-
          Key names the dimension. It must be non-empty and appear at most once
          in an attribute set; ValidateAttrs checks both.
        name: Key
        type: string
      - doc: kind discriminates which of num/str carries the value.
        name: kind
        type: AttrKind
      - doc: num carries a bool, an int64 or the IEEE-754 bits of a float64.
        name: num
        type: uint64
      - doc: str carries a string value, and only a string value.
        name: str
        type: string
    kind: struct
    methods:
      - name: Kind
        recv: a AttrValue
        results: AttrKind
      - name: Str
        recv: a AttrValue
        results: string
      - name: Bool
        recv: a AttrValue
        results: bool
      - name: Int64
        recv: a AttrValue
        results: int64
      - name: Float64
        recv: a AttrValue
        results: float64
      - name: AppendIdentity
        params: dst []byte
        recv: a AttrValue
        results: "[]byte"
      - name: AppendText
        params: dst []byte
        recv: a AttrValue
        results: "[]byte"
    name: AttrValue
  - fields:
      - doc: |-
          Attrs are the producer's attributes, sorted by Key. A ResourceValue
          normalised by NormalizeResource always carries ServiceNameKey.
        name: Attrs
        type: "[]AttrValue"
    kind: struct
    name: ResourceValue
  - fields:
      - doc: |-
          Name is the instrumenting library's name. Empty means unset and
          resolves to the signal's own default — see NormalizeScope.
        name: Name
        type: string
      - doc: |-
          Version is the instrumenting library's version. It is optional in the
          specification and stays empty when the caller has none — inventing one
          would be a claim about code this package cannot see.
        name: Version
        type: string
    kind: struct
    name: ScopeValue
