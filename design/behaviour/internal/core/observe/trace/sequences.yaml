    steps:
      - return: len(s.Spans) == 0
  - of: NewStateBuilder
    steps:
      - return: "StateBuilder{entries: make([]traceStateEntry, 0, min(max(size, 0), MaxTraceStateMembers))}"
  - of: (*StateBuilder).Add
    steps:
      - opt:
          do:
            - return: "false"
          when: |-
            !isValidTraceStateKey(key) || !isValidMemberValue(value) ||
            		slices.ContainsFunc(b.entries, keyMatcher(key)) || len(b.entries) == MaxTraceStateMembers
      - set: b.entries
        value: "append(b.entries, traceStateEntry{key: key, value: value})"
      - return: "true"
  - of: (*StateBuilder).State
    steps:
      - bind: state
        eval: "StateValue{entries: b.entries}"
      - set: b.entries
        value: nil
      - return: state
  - of: StateValue.Len
    steps:
      - return: len(s.entries)
  - of: StateValue.Get
    participants:
      - id: caller
        kind: actor
      - id: StateValue.Get
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at
        eval: slices.IndexFunc(s.entries, keyMatcher(key))
        to: slices
      - opt:
          do:
            - return: "\"\", false"
          when: at < 0
      - return: s.entries[at].value, true
  - of: StateValue.Delete
    participants:
      - id: caller
        kind: actor
      - id: StateValue.Delete
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at
        eval: slices.IndexFunc(s.entries, keyMatcher(key))
        to: slices
      - opt:
          do:
            - return: s
          when: at < 0
      - bind: next
        eval: slices.Clone(s.entries)
        to: slices
      - return: "StateValue{entries: slices.Delete(next, at, at+1)}"
  - of: StateValue.String
    participants:
      - id: caller
        kind: actor
      - id: StateValue.String
        kind: self
      - id: out.WriteString
        kind: value
      - id: out.String
        kind: value
    steps:
      - opt:
          do:
            - return: "\"\""
          when: len(s.entries) == 0
      - var:
          name: out
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - eval: out.WriteString(traceStateListSep)
                    to: out.WriteString
                when: i > 0
            - eval: out.WriteString(entry.key)
              to: out.WriteString
            - eval: out.WriteString(traceStatePairSep)
              to: out.WriteString
            - eval: out.WriteString(entry.value)
              to: out.WriteString
          key: i
          range: s.entries
          value: entry
      - return: out.String()
        to: out.String
  - of: keyMatcher
    steps:
      - return:
          closure:
            params: entry traceStateEntry
            results: bool
            steps:
              - return: entry.key == key
  - of: isValidTraceStateKey
    participants:
      - id: caller
        kind: actor
      - id: isValidTraceStateKey
        kind: self
      - id: strings
        kind: stdlib
      - id: isTraceStateSegment
        kind: internal
    steps:
      - bind: tenant, system, multi
        eval: strings.Cut(key, traceStateTenant)
        to: strings
      - opt:
          do:
            - return: isTraceStateSegment(key, MaxTraceStateKeyLen, false)
              to: isTraceStateSegment
          when: "!multi"
      - return: isTraceStateSegment(tenant, maxTenantIDLen, true) && isTraceStateSegment(system, maxSystemIDLen, false)
  - of: isTraceStateSegment
    steps:
      - opt:
          do:
            - return: "false"
          when: len(segment) == 0 || len(segment) > limit
      - bind: lead
        eval: isLowerAlpha(segment[0]) || (digitLead && isDigit(segment[0]))
      - return: lead && allTraceStateKeyChars(segment[1:])
  - of: isTraceStateKeyChar
    steps:
      - return: isLowerAlpha(c) || isDigit(c) || c == '_' || c == '-' || c == '*' || c == '/'
  - of: isMemberValueChar
    steps:
      - return: |-
          c >= printableASCIILow && c <= printableASCIIHigh &&
          		c != traceStateListByte && c != traceStatePairByte
  - of: isLowerAlpha
    steps:
      - return: c >= 'a' && c <= 'z'
  - of: isDigit
    steps:
      - return: c >= '0' && c <= '9'
  - of: StatusValue.Resolved
    steps:
      - opt:
          do:
            - return: s
          when: s.Code == StatusError
      - opt:
          do:
            - return: "StatusValue{Code: StatusOK}"
          when: s.Code == StatusOK
      - return: "StatusValue{Code: StatusUnset}"
  - of: StatusValue.IsUnset
    steps:
      - return: s.Code == StatusUnset && s.Message == ""
  - of: StatusCode.String
    steps:
      - switch:
          cases:
            - case: StatusOK
              do:
                - return: "\"OK\""
            - case: StatusError
              do:
                - return: "\"ERROR\""
            - default: true
              do:
                - return: "\"UNSET\""
          "on": c
