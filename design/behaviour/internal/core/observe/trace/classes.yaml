functions:
  - name: ValidateAttrs
    params: sorted []coreotel.AttrValue
  - name: SortAttrs
    params: attrs []coreotel.AttrValue
    results: "[]coreotel.AttrValue"
  - name: NormalizeResource
    params: resource coreotel.ResourceValue
    results: coreotel.ResourceValue
  - name: ContextWithSpanContext
    params: parent context.Context, context SpanContextValue
    results: context.Context
  - doc: |-
      contextWithValue is the single WithValue call site of a span context, kept
      apart so the shadowed parameter name above never reaches context.WithValue.
    name: contextWithValue
    params: parent context.Context, value SpanContextValue
    results: context.Context
  - name: ContextWithSpan
    params: parent context.Context, span Span
    results: context.Context
  - name: SpanContextFromContext
    params: ctx context.Context
    results: SpanContextValue
  - name: RegisterExporter
    params: e SpanExporter
    results: SpanExporter
  - name: LookupExporter
    params: name ExporterName
    results: e SpanExporter, ok bool
  - name: AvailableExporters
    results: "[]ExporterName"
  - name: Export
    params: name ExporterName, spans SpansValue
    results: error
  - name: ExportContext
    params: ctx context.Context, name ExporterName, spans SpansValue
    results: error
  - doc: |-
      boundExport returns ctx unchanged when it already carries a deadline, and
      ctx bounded by DefaultExportTimeout when it does not, with the function that
      releases it.
    name: boundExport
    params: ctx context.Context
    results: context.Context, context.CancelFunc
  - name: ParseTraceID
    params: text string
    results: id TraceID, err error
  - name: ParseSpanID
    params: text string
    results: id SpanID, err error
  - doc: |-
      isLowerHex reports whether text is drawn entirely from [0-9a-f].

      hex.DecodeString accepts uppercase, and the traceparent grammar does not
      (32HEXDIGLC / 16HEXDIGLC), so the alphabet is checked here rather than left to
      the decoder.
    name: isLowerHex
    params: text string
    results: bool
  - doc: isNotLowerHexDigit reports whether c falls outside [0-9a-f].
    name: isNotLowerHexDigit
    params: c byte
    results: bool
  - name: NormalizeScope
    params: scope coreotel.ScopeValue
    results: coreotel.ScopeValue
  - name: NewStateBuilder
    params: size int
    results: StateBuilder
  - doc: |-
      keyMatcher returns a predicate matching an entry by key. It is a closure over
      one string, built on the cold paths only.
    name: keyMatcher
    params: key string
    results: func(traceStateEntry) bool
  - doc: |-
      isValidTraceStateKey reports whether key matches `simple-key` or
      `multi-tenant-key`.

      	simple-key       = lcalpha 0*255( lcalpha / DIGIT / "_" / "-" / "*" / "/" )
      	multi-tenant-key = tenant-id "@" system-id
      	tenant-id        = ( lcalpha / DIGIT ) 0*240( ... )
      	system-id        = lcalpha 0*13( ... )

      The two forms differ in their first character — a tenant-id may start with a
      digit, a simple-key may not — which is why they are not one check with a
      longer length.
    name: isValidTraceStateKey
    params: key string
    results: bool
  - doc: |-
      isTraceStateSegment reports whether segment is 1..limit characters drawn from
      the key alphabet, opening with a lowercase letter — or, when digitLead, with a
      lowercase letter or a digit.
    name: isTraceStateSegment
    params: segment string, limit int, digitLead bool
    results: bool
  - doc: |-
      allTraceStateKeyChars reports whether every byte of tail is drawn from the key
      alphabet `lcalpha / DIGIT / "_" / "-" / "*" / "/"`.
    name: allTraceStateKeyChars
    params: tail string
    results: bool
  - doc: |-
      isValidMemberValue reports whether value matches
      `value = 0*255(chr) nblk-chr`, i.e. 1..256 printable ASCII characters,
      excluding ',' and '=', whose LAST character is not a space.

      The trailing-space rule is the one that gets missed: it exists so that
      stripping OWS around a list member cannot change the value.
    name: isValidMemberValue
    params: value string
    results: bool
  - doc: |-
      isTraceStateKeyChar reports whether c is drawn from the key alphabet
      `lcalpha / DIGIT / "_" / "-" / "*" / "/"`.
    name: isTraceStateKeyChar
    params: c byte
    results: bool
  - doc: |-
      isMemberValueChar reports whether c is drawn from
      `chr = %x20 / %x21-2B / %x2D-3C / %x3E-7E` — printable ASCII minus ',' (0x2C)
      and '=' (0x3D).
    name: isMemberValueChar
    params: c byte
    results: bool
  - doc: isLowerAlpha reports whether c is `lcalpha = %x61-7A`.
    name: isLowerAlpha
    params: c byte
    results: bool
  - doc: isDigit reports whether c is an ASCII digit.
    name: isDigit
    params: c byte
    results: bool
imports:
  context: context
  coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  hex: encoding/hex
  plugin: github.com/kitsunium/sdk/internal/kernel/plugin
  slices: slices
  strings: strings
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/observe/trace
  name: trace
  purpose: "Package trace — this signal's half of the shared attribute model (internal/core/observe/otel): the refusal an unusable set earns HERE, and the Resource a Tracer publishes."
types:
  - doc: |-
      contextKeyType is the unexported key type for the context value. Unexported so
      nothing outside this package can write the slot, which is what keeps
      SpanContextFromContext's answer trustworthy: the only writers are
      ContextWithSpanContext, which stores a typed value, and ContextWithSpan, which
      stores the Span whose SpanContext is read back.
    kind: struct
    name: contextKeyType
  - fields:
      - doc: |-
          Time is when it happened. An unset instant encodes as 0, which is what
          the schema means by an unknown timestamp.
        name: Time
        type: time.Time
      - doc: Name is the event's low-cardinality label.
        name: Name
        type: string
      - doc: Attrs are the event's typed dimensions, sorted by Key.
        name: Attrs
        type: "[]coreotel.AttrValue"
    kind: struct
    methods:
      - name: Normalized
        recv: e EventValue
        results: EventValue
    name: EventValue
  - kind: named
    methods:
      - name: String
        recv: n ExporterName
        results: string
    name: ExporterName
    underlying: string
  - kind: named
    methods:
      - name: IsValid
        recv: t TraceID
        results: bool
      - name: String
        recv: t TraceID
        results: string
    name: TraceID
    underlying: "[TraceIDLen]byte"
  - kind: named
    methods:
      - name: IsValid
        recv: s SpanID
        results: bool
      - name: String
        recv: s SpanID
        results: string
    name: SpanID
    underlying: "[SpanIDLen]byte"
  - kind: named
    methods:
      - name: IsSampled
        recv: f TraceFlags
        results: bool
      - name: WithSampled
        params: sampled bool
        recv: f TraceFlags
        results: TraceFlags
      - name: Sanitized
        recv: f TraceFlags
        results: TraceFlags
    name: TraceFlags
    underlying: byte
  - fields:
      - doc: |-
          Context identifies the linked span. A link whose context is invalid is
          dropped rather than emitted — it names nothing.
        name: Context
        type: SpanContextValue
      - doc: Attrs describe the relationship, sorted by Key.
        name: Attrs
        type: "[]coreotel.AttrValue"
    kind: struct
    methods:
      - name: Normalized
        recv: l LinkValue
        results: LinkValue
      - name: IsValid
        recv: l LinkValue
        results: bool
    name: LinkValue
  - fields:
      - doc: |-
          Kind is the span's relationship to its neighbours. The zero value
          resolves to SpanKindInternal (SpanKind.Resolved).
        name: Kind
        type: SpanKind
      - doc: |-
          Attrs are the dimensions known at Start. They are the ONLY ones a
          Sampler sees, so anything the sampling decision depends on belongs here
          rather than in a later SetAttrs.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: Links point at causally related spans in other traces.
        name: Links
        type: "[]LinkValue"
      - doc: |-
          StartTime overrides the span's start instant. The zero value means
          "now", which is what every caller but a replaying one wants — and it is
          a CLAMP rather than a refusal because "now" is a description of what the
          tracer does, not a value chosen on the caller's behalf (ADR 0031).
        name: StartTime
        type: time.Time
    kind: struct
    name: SpanParams
  - kind: named
    name: Sampler
    underlying: func(params SamplingParams) bool
  - kind: named
    name: SpanSink
    underlying: func(span SpanValue)
  - fields:
      - doc: |-
          Parent is the context this span descends from, or the invalid zero
          value when this is a root.
        name: Parent
        type: SpanContextValue
      - doc: TraceID is the trace the new span belongs to.
        name: TraceID
        type: TraceID
      - doc: Name is the span's operation name.
        name: Name
        type: string
      - doc: Kind is the span's relationship to its neighbours.
        name: Kind
        type: SpanKind
      - doc: |-
          Attrs are the attributes supplied at Start, sorted by Key. Attributes
          added AFTER Start are invisible here — the decision has already been
          taken by then, which is the price of taking it once.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: Links are the links supplied at Start.
        name: Links
        type: "[]LinkValue"
    kind: struct
    name: SamplingParams
  - fields:
      - doc: TraceID identifies the whole trace. Shared by every span in it.
        name: TraceID
        type: TraceID
      - doc: SpanID identifies this span within the trace.
        name: SpanID
        type: SpanID
      - doc: |-
          Flags is the traceparent flag byte, kept EXACTLY as received. Undefined
          bits are masked at format time (TraceFlags.Sanitized), never on receipt.
        name: Flags
        type: TraceFlags
      - doc: |-
          State is the tracestate list travelling beside the traceparent. It is
          propagated verbatim; this SDK adds no entry of its own.
        name: State
        type: StateValue
      - doc: |-
          Remote reports whether this context was EXTRACTED from a carrier rather
          than created in this process. OTLP carries the fact as a span flag, and
          a backend needs it to tell "my caller" from "my own parent span".
        name: Remote
        type: bool
    kind: struct
    methods:
      - name: IsValid
        recv: c SpanContextValue
        results: bool
      - name: IsSampled
        recv: c SpanContextValue
        results: bool
      - name: WithState
        params: state StateValue
        recv: c SpanContextValue
        results: SpanContextValue
    name: SpanContextValue
  - kind: named
    methods:
      - name: Resolved
        recv: k SpanKind
        results: SpanKind
      - name: String
        recv: k SpanKind
        results: string
    name: SpanKind
    underlying: int32
  - fields:
      - doc: "Context identifies this span: trace-id, span-id, flags, tracestate."
        name: Context
        type: SpanContextValue
      - doc: |-
          Parent identifies the span this one descends from. The zero value means
          this is a root span.
        name: Parent
        type: SpanContextValue
      - doc: Name is the low-cardinality operation label a backend groups on.
        name: Name
        type: string
      - doc: |-
          Kind is the span's relationship to its neighbours, already resolved —
          never SpanKindUnspecified on a span a Tracer produced.
        name: Kind
        type: SpanKind
      - doc: StartTime opens the interval the span covers.
        name: StartTime
        type: time.Time
      - doc: |-
          EndTime closes it. A span whose EndTime is unset never ended, and no
          exporter in this SDK will ship one.
        name: EndTime
        type: time.Time
      - doc: Attrs are the span's typed dimensions, sorted by Key.
        name: Attrs
        type: "[]coreotel.AttrValue"
      - doc: |-
          Events are timestamped points inside the interval, in the order they
          were recorded.
        name: Events
        type: "[]EventValue"
      - doc: Links point at causally related spans in other traces.
        name: Links
        type: "[]LinkValue"
      - doc: Status is the recorded outcome, already resolved.
        name: Status
        type: StatusValue
    kind: struct
    methods:
      - name: Duration
        recv: s SpanValue
        results: time.Duration
      - name: IsRoot
        recv: s SpanValue
        results: bool
    name: SpanValue
  - fields:
      - doc: Resource identifies the producer, carried once for the whole payload.
        name: Resource
        type: coreotel.ResourceValue
      - doc: |-
          Scope identifies the instrumentation, carried once for the whole
          payload.
        name: Scope
        type: coreotel.ScopeValue
      - doc: |-
          Spans are the finished spans, in the order they ended. That order is
          stable and is what makes an exporter's output diffable; it is NOT
          causal — a parent ends after its children.
        name: Spans
        type: "[]SpanValue"
    kind: struct
    methods:
      - name: IsEmpty
        recv: s SpansValue
        results: bool
    name: SpansValue
  - fields:
      - doc: entries is the list so far, leftmost first.
        name: entries
        type: "[]traceStateEntry"
    kind: struct
    methods:
      - name: Add
        params: key, value string
        recv: b *StateBuilder
        results: bool
      - name: State
        recv: b *StateBuilder
        results: StateValue
    name: StateBuilder
  - fields:
      - doc: entries is the ordered list, leftmost first. nil is the empty list.
        name: entries
        type: "[]traceStateEntry"
    kind: struct
    methods:
      - name: Len
        recv: s StateValue
        results: int
      - name: Get
        params: key string
        recv: s StateValue
        results: value string, ok bool
      - name: Insert
        params: key, value string
        recv: s StateValue
        results: state StateValue, err error
      - name: Delete
        params: key string
        recv: s StateValue
        results: StateValue
      - name: String
        recv: s StateValue
        results: string
    name: StateValue
  - kind: named
    methods:
      - name: String
        recv: c StatusCode
        results: string
    name: StatusCode
    underlying: int32
  - fields:
      - doc: Code is the verdict.
        name: Code
        type: StatusCode
      - doc: |-
          Message describes the failure. It is dropped unless Code is
          StatusError, and it is the ONE free-text field a span carries — so it
          must not be given a value the operator cannot see safely. It is not an
          errs Public: a span message is read by whoever reads the trace.
        name: Message
        type: string
    kind: struct
    methods:
      - name: Resolved
        recv: s StatusValue
        results: StatusValue
      - name: IsUnset
        recv: s StatusValue
        results: bool
    name: StatusValue
  - doc: |-
      traceStateEntry is one `key=value` list member. It is unexported because the
      only ways to obtain one are Insert and StateBuilder.Add, both of which
      validate — a struct literal would let an unspellable entry into a header.
    fields:
      - doc: key is the vendor identifier, already validated against the grammar.
        name: key
        type: string
      - doc: value is the vendor's opaque state, already validated.
        name: value
        type: string
    kind: struct
    name: traceStateEntry
vars:
  - doc: spanContextKey is the singleton key. A struct{} key allocates nothing.
    items:
      - name: spanContextKey
        type: contextKeyType
    name: spanContextKey
  - doc: |-
      registry maps each ExporterName to its SpanExporter — a read-mostly,
      copy-on-write table (kernel/plugin.Registry), the same mechanism the other
      signal's exporter registry runs on.
    items:
      - name: registry
        type: plugin.Registry[ExporterName, SpanExporter]
    name: registry
