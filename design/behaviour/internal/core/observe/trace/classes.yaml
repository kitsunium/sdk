# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      ExceptionEventName and the three attribute keys around it are the OpenTelemetry
      semantic convention for recording an error on a span.

      They are constants here rather than strings at a call site because the whole
      value of a convention is that two producers spell it identically: a backend
      renders an event named exactly "exception" as an error, and renders
      "Exception" as an event nobody will ever look at.
    grouped: true
    items:
      - doc: ExceptionEventName is the reserved event name for a recorded error.
        name: ExceptionEventName
        type: string
        value: "\"exception\""
      - doc: ExceptionTypeKey names the error's type.
        name: ExceptionTypeKey
        type: string
        value: "\"exception.type\""
      - doc: ExceptionMessageKey names the error's message.
        name: ExceptionMessageKey
        type: string
        value: "\"exception.message\""
      - doc: |-
          ExceptionStacktraceKey names the error's stack trace. This SDK never
          fills it: a Go error carries no stack, and inventing one from the
          recording site would name the wrong goroutine.
        name: ExceptionStacktraceKey
        type: string
        value: "\"exception.stacktrace\""
    name: ExceptionEventName
  - doc: |-
      DefaultExportTimeout bounds one export when the caller's context carries no
      deadline of its own: 30 s, the OpenTelemetry trace SDK specification's default
      for a batch processor's exportTimeout (OTEL_BSP_EXPORT_TIMEOUT). The
      specification says an export MUST NOT block indefinitely, and a context with
      no deadline is how an indefinite block is written; a caller who wants another
      bound puts it on the context.
    items:
      - name: DefaultExportTimeout
        type: time.Duration
        value: 30 * time.Second
    name: DefaultExportTimeout
  - doc: |-
      TraceIDLen and SpanIDLen are the byte lengths W3C Trace Context and
      opentelemetry/proto/trace/v1 both fix: 16 bytes of trace-id, 8 of span-id.
      They are not tunable — a 16-byte trace-id is the format, not a default.
    grouped: true
    items:
      - doc: TraceIDLen is the trace identifier's length in bytes.
        name: TraceIDLen
        type: int
        value: "16"
      - doc: SpanIDLen is the span identifier's length in bytes.
        name: SpanIDLen
        type: int
        value: "8"
      - doc: TraceIDHexLen is the trace identifier's length in lowercase hex.
        name: TraceIDHexLen
        type: int
        value: TraceIDLen * 2
      - doc: SpanIDHexLen is the span identifier's length in lowercase hex.
        name: SpanIDHexLen
        type: int
        value: SpanIDLen * 2
    name: TraceIDLen
  - doc: |-
      FlagSampled is the sampled bit: the least significant one. When set, the
      caller "may have recorded trace data" (§3.2.2.5.1), which is what makes the
      sampling decision a property of the TRACE rather than of each span.
    items:
      - name: FlagSampled
        type: TraceFlags
        value: "0x01"
    name: FlagSampled
  - doc: |-
      DefaultScopeName names this SDK's TRACE package as the instrumenting library
      when a caller declares no scope of their own.

      It is a separate constant from metrics' DefaultScopeName, and the difference is
      not cosmetic: an InstrumentationScope names the library that produced THIS
      signal, so stamping a span batch with `…/pkg/v1/observe/metrics` would tell a backend
      that the metrics package emitted spans. Sharing the value would have been the
      one place where sharing the model stopped being reuse and started being a
      wrong answer — which is exactly the line ADR 0051 §Decision 2 draws, and why
      internal/core/observe/otel takes the default as a parameter rather than owning one.
    items:
      - name: DefaultScopeName
        type: string
        value: "\"github.com/kitsunium/sdk/pkg/v1/observe/trace\""
    name: DefaultScopeName
  - doc: |-
      The five kinds, in the schema's own declaration order: iota reproduces
      SPAN_KIND_UNSPECIFIED = 0 through SPAN_KIND_CONSUMER = 5 exactly, which is
      what the OTLP encoder emits as the enum's integer.
    grouped: true
    items:
      - doc: |-
          SpanKindUnspecified is SPAN_KIND_UNSPECIFIED (0). It is the zero value,
          and the schema's own comment says an implementation should set INTERNAL
          instead — so it CLAMPS rather than travels (ADR 0031 §clamp): a span
          created with no stated kind is doing work inside this process, which is
          what INTERNAL means. Nothing this SDK emits carries it.
        name: SpanKindUnspecified
        type: SpanKind
        value: iota
      - doc: |-
          SpanKindInternal is SPAN_KIND_INTERNAL (1): work inside one process,
          with no remote counterpart.
        name: SpanKindInternal
      - doc: |-
          SpanKindServer is SPAN_KIND_SERVER (2): handling an inbound synchronous
          request. Its parent is normally a remote CLIENT span.
        name: SpanKindServer
      - doc: |-
          SpanKindClient is SPAN_KIND_CLIENT (3): making an outbound synchronous
          request and waiting for it.
        name: SpanKindClient
      - doc: |-
          SpanKindProducer is SPAN_KIND_PRODUCER (4): enqueuing a message whose
          handling happens later, and elsewhere.
        name: SpanKindProducer
      - doc: |-
          SpanKindConsumer is SPAN_KIND_CONSUMER (5): handling a message that was
          enqueued earlier. Its parent finished long before it started, which is
          why it is not simply a SERVER span.
        name: SpanKindConsumer
    name: SpanKindUnspecified
  - doc: |-
      The three limits the W3C tracestate grammar fixes. They are the GRAMMAR's own
      bounds, not ceilings this SDK invented, which is why there is no knob for any
      of them (ADR 0031 §refuse: an SDK-chosen ceiling here would be arbitrary, and
      the specification already supplies a non-arbitrary one).
    grouped: true
    items:
      - doc: |-
          MaxTraceStateMembers is the list cap: `list = list-member 0*31( OWS ","
          OWS list-member )` is 32 members, no more.
        name: MaxTraceStateMembers
        type: int
        value: "32"
      - doc: |-
          MaxTraceStateKeyLen is the longest legal key: `simple-key = lcalpha
          0*255(...)` is 1 + 255 characters.
        name: MaxTraceStateKeyLen
        type: int
        value: "256"
      - doc: |-
          MaxTraceStateValueLen is the longest legal value: `value = 0*255(chr)
          nblk-chr` is 255 + 1 characters.
        name: MaxTraceStateValueLen
        type: int
        value: "256"
    name: MaxTraceStateMembers
  - doc: |-
      The two sub-key limits of the multi-tenant form `tenant-id "@" system-id`:
      `tenant-id` is 1 + 240 characters and `system-id` is 1 + 13.
    grouped: true
    items:
      - name: maxTenantIDLen
        type: int
        value: "241"
      - name: maxSystemIDLen
        type: int
        value: "14"
    name: maxTenantIDLen
  - doc: |-
      The list punctuation, named so the rendering and the key grammar read as the
      grammar does. They are strings rather than bytes because every use site
      joins or cuts with them, and a byte would be converted at each one. The
      header's parser, internal/service/observe/trace, names its own: reading the
      header is the engine's mechanism (ADR 0160 §4).
    grouped: true
    items:
      - name: traceStateListSep
        type: string
        value: "\",\""
      - name: traceStatePairSep
        type: string
        value: "\"=\""
      - name: traceStateTenant
        type: string
        value: "\"@\""
    name: traceStateListSep
  - doc: |-
      The bounds of `chr` — printable ASCII, %x20 through %x7E — plus the two
      punctuation marks it excludes, as bytes. The grammar states them as
      hexadecimal ranges, so they are named rather than inlined.
    grouped: true
    items:
      - name: printableASCIILow
        type: byte
        value: "0x20"
      - name: printableASCIIHigh
        type: byte
        value: "0x7E"
      - name: traceStateListByte
        type: byte
        value: "','"
      - name: traceStatePairByte
        type: byte
        value: "'='"
    name: printableASCIILow
  - doc: |-
      The three codes, in the schema's own declaration order: iota reproduces
      STATUS_CODE_UNSET = 0 through STATUS_CODE_ERROR = 2 exactly, which is what the
      OTLP encoder emits as the enum's integer.
    grouped: true
    items:
      - doc: |-
          StatusUnset is STATUS_CODE_UNSET (0), the default and the overwhelmingly
          common value. It means "no explicit judgement was recorded" — NOT "it
          worked". A backend applies its own heuristics (an HTTP 5xx, a timeout);
          an SDK claiming OK on the caller's behalf would suppress exactly those.
        name: StatusUnset
        type: StatusCode
        value: iota
      - doc: |-
          StatusOK is STATUS_CODE_OK (1): the developer explicitly asserted
          success, which the specification says should override any backend
          heuristic. It is therefore a claim, never set by this SDK on its own.
        name: StatusOK
      - doc: "StatusError is STATUS_CODE_ERROR (2): the operation failed."
        name: StatusError
    name: StatusUnset
