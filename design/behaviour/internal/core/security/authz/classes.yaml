apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: |-
          KindInvalid is the zero AttrKind — FIRST in the iota run for exactly
          that reason. It belongs to the zero [AttrValue] and to nothing else:
          [NewRequestValue] drops an attribute carrying it, so a kind-less
          attribute is ABSENT rather than present and unusable.
        name: KindInvalid
        type: AttrKind
        value: iota
      - doc: KindString is a single text value — a department, a tenant, a region.
        name: KindString
      - doc: KindInt64 is a whole number — an age, a level, a Unix timestamp.
        name: KindInt64
      - doc: KindBool is a flag — mfa_satisfied, account_locked, is_internal.
        name: KindBool
      - doc: |-
          KindStrings is an unordered set of text values — the roles a subject
          holds, the groups it belongs to, the scopes a token carries.
        name: KindStrings
    name: KindInvalid
  - grouped: true
    items:
      - doc: |-
          Abstain means this policy has no opinion about this request. It is the
          zero value — FIRST in the iota run for exactly that reason — and it
          grants nothing: composition preserves it, and the closure refuses it.
        name: Abstain
        type: Decision
        value: iota
      - doc: |-
          Allow means this policy permits the request. It is the ONLY value that
          grants, and under deny-overrides it can still be defeated by a [Deny]
          from any other policy in the composition.
        name: Allow
      - doc: |-
          Deny means this policy refuses the request. It is absorbing: no [Allow]
          anywhere in a composition can outvote it (ADR 0057 §D2).
        name: Deny
    name: Abstain
