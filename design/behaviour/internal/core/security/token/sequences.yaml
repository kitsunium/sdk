    participants:
      - id: caller
        kind: actor
      - id: (*VerifyScratch).MACEqual
        kind: self
      - id: s.mac.Reset
        kind: value
      - id: s.mac.Write
        kind: value
      - id: s.mac.Sum
        kind: value
      - id: hmac
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: s.inUse.Load() != 1
      - eval: s.mac.Reset()
        to: s.mac.Reset
      - eval: s.mac.Write(input)
        to: s.mac.Write
      - bind: sum
        eval: s.mac.Sum(s.sum[:0])
        to: s.mac.Sum
      - bind: equal
        eval: hmac.Equal(sum, tag)
        to: hmac
      - eval: clear(s.sum[:])
      - return: equal
  - of: (*VerifyScratch).String
