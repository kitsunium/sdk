  - of: Algorithm.String
    steps:
      - switch:
          cases:
            - case: AlgorithmHS256
              do:
                - return: "\"HS256\""
            - case: AlgorithmES256
              do:
                - return: "\"ES256\""
            - case: AlgorithmEdDSA
              do:
                - return: "\"EdDSA\""
            - case: AlgorithmPasetoV4Public
              do:
                - return: "\"v4.public\""
            - default: true
              do:
                - return: "\"unknown\""
          "on": a
  - of: Algorithm.Known
    steps:
      - return: a >= AlgorithmHS256 && a <= AlgorithmPasetoV4Public
