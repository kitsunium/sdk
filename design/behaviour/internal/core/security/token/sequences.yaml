  - of: (*ClaimsBuf).declare
    steps:
      - opt:
          do:
            - return: ClaimsBufOverflow
          when: len(name) > ClaimsBufTextCap
      - opt:
          do:
            - return: ClaimNameInvalid
          when: |-
            name == "" || IsRegisteredClaim(name) || !plainMemberName(name) ||
            		slices.Contains(b.names[:b.declared], name)
      - set: b.names[b.declared]
