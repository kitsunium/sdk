apiVersion: design/behaviour/v1
constants:
  - doc: |-
      Registered claim names (RFC 7519 §4.1). PASETO v4 reuses the same seven
      names, with a different value encoding — see internal/service/security/token.
    grouped: true
    items:
      - doc: ClaimIssuer is "iss" — who minted the token.
        name: ClaimIssuer
        type: string
        value: "\"iss\""
      - doc: ClaimSubject is "sub" — who the token is about.
        name: ClaimSubject
        type: string
        value: "\"sub\""
      - doc: ClaimAudience is "aud" — who the token is FOR. Checked, never assumed.
        name: ClaimAudience
        type: string
        value: "\"aud\""
      - doc: ClaimExpiry is "exp" — the instant after which the token is dead.
        name: ClaimExpiry
        type: string
        value: "\"exp\""
      - doc: ClaimNotBefore is "nbf" — the instant before which it is not yet alive.
        name: ClaimNotBefore
        type: string
        value: "\"nbf\""
      - doc: ClaimIssuedAt is "iat" — when it was minted.
        name: ClaimIssuedAt
        type: string
        value: "\"iat\""
      - doc: ClaimID is "jti" — a unique id for the token.
        name: ClaimID
        type: string
        value: "\"jti\""
    name: ClaimIssuer
  - doc: |-
      MaxPrivateClaims caps how many application claims one token may carry. The
      number is a bound, not a budget: a claim set is an authorisation statement,
      and a token that needs more than this many members is describing a database
      row rather than a subject. The cap keeps a hostile payload's decode cost
      linear and bounded, which is the same reason the wire size is capped.
    items:
      - name: MaxPrivateClaims
        type: int
        value: "64"
    name: MaxPrivateClaims
  - doc: |-
      claimSlots is how many registered claims RFC 7519 §4.1 defines, and hence
      the width of the presence vector registeredCount folds.
    items:
      - name: claimSlots
        type: int
        value: "7"
    name: claimSlots
  - doc: |-
      The fixed capacities of a [ClaimsBuf]. They are bounds, not budgets: a claim
      longer than its slot, an audience with more members, or more declared
      private names than this is refused with [ClaimsBufOverflow] — never cut to
      fit, because a truncated subject is another subject.
    grouped: true
    items:
      - doc: |-
          ClaimsBufTextCap is the capacity, in octets, of every text slot of a
          ClaimsBuf: each registered string claim, each audience member and each
          declared private claim, decoded.
        name: ClaimsBufTextCap
        type: int
        value: "256"
      - doc: ClaimsBufAudienceCap is how many "aud" members a ClaimsBuf holds.
        name: ClaimsBufAudienceCap
        type: int
        value: "4"
      - doc: |-
          ClaimsBufPrivateCap is how many private claim names a ClaimsBuf may
          declare.
        name: ClaimsBufPrivateCap
        type: int
        value: "8"
    name: ClaimsBufTextCap
  - grouped: true
    items:
      - doc: |-
          ClaimAbsent is the state of a claim the token did not carry — and of
          every claim of a ClaimsBuf that was reset or whose verification failed.
        name: ClaimAbsent
        type: ClaimState
        value: iota
      - doc: |-
          ClaimWrongType is the state of a declared private claim whose JSON type
          is not a string. A registered claim of the wrong type is never stored:
          the token is refused with [Malformed].
        name: ClaimWrongType
      - doc: ClaimInvalid is the state of a text claim that is the empty string.
        name: ClaimInvalid
      - doc: ClaimOK is the state of a claim present with a usable value.
        name: ClaimOK
    name: ClaimAbsent
  - grouped: true
    items:
      - doc: TextIssuer is the "iss" claim.
        name: TextIssuer
        type: TextClaim
        value: iota
      - doc: TextSubject is the "sub" claim.
        name: TextSubject
      - doc: TextID is the "jti" claim.
        name: TextID
    name: TextIssuer
  - doc: textClaims is how many TextClaim values exist.
    items:
      - name: textClaims
        type: int
        value: "3"
    name: textClaims
  - grouped: true
    items:
      - doc: TimeExpiry is the "exp" claim.
        name: TimeExpiry
        type: TimeClaim
        value: iota
      - doc: TimeNotBefore is the "nbf" claim.
        name: TimeNotBefore
      - doc: TimeIssuedAt is the "iat" claim.
        name: TimeIssuedAt
    name: TimeExpiry
  - doc: timeClaims is how many TimeClaim values exist.
    items:
      - name: timeClaims
        type: int
        value: "3"
    name: timeClaims
  - doc: |-
      scratchSumLen is the widest tag a scratch sums into: SHA-512's 64 octets,
      so a scratch is never the reason a wider MAC cannot be carried.
    items:
      - name: scratchSumLen
        type: int
        value: "64"
    name: scratchSumLen
  - grouped: true
    items:
      - doc: |-
          AlgorithmUnknown is the zero value — the algorithm nobody chose. Every
          constructor refuses it rather than defaulting to one.
        name: AlgorithmUnknown
        type: Algorithm
        value: iota
      - doc: |-
          AlgorithmHS256 is JOSE "HS256": HMAC-SHA-256 over a 256-bit shared
          secret (RFC 7518 §3.2). Symmetric — a verifier can also mint tokens.
        name: AlgorithmHS256
      - doc: |-
          AlgorithmES256 is JOSE "ES256": ECDSA on NIST P-256 with SHA-256 and the
          fixed-width R||S signature encoding of RFC 7518 §3.4.
        name: AlgorithmES256
      - doc: |-
          AlgorithmEdDSA is JOSE "EdDSA": Ed25519 over the JWS signing input
          (RFC 8037 §3.1).
        name: AlgorithmEdDSA
      - doc: |-
          AlgorithmPasetoV4Public is PASETO v4.public: Ed25519 over the
          pre-authentication encoding of the version header, payload and footer.
          It is a distinct Algorithm from AlgorithmEdDSA even though both use
          Ed25519, because the bytes that get signed are not the same bytes.
        name: AlgorithmPasetoV4Public
    name: AlgorithmUnknown
