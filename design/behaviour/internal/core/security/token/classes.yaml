package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/security/token
  name: token
  purpose: Package token — the immutable claim set every concrete token format decodes into and every issuer renders from.
types:
  - fields:
      - doc: issuer is the "iss" claim, empty when absent.
        name: issuer
        type: string
      - doc: subject is the "sub" claim, empty when absent.
        name: subject
        type: string
      - doc: id is the "jti" claim, empty when absent.
        name: id
        type: string
      - doc: |-
          audience is the "aud" claim. JWT allows one string or an array of them
          (RFC 7519 §4.1.3), so the general shape is a slice; PASETO allows only
          one, which its encoder enforces.
        name: audience
        type: "[]string"
      - doc: expiry is the "exp" claim; the zero Time means the claim was absent.
        name: expiry
        type: time.Time
      - doc: notBefore is the "nbf" claim; the zero Time means it was absent.
        name: notBefore
        type: time.Time
      - doc: issuedAt is the "iat" claim; the zero Time means it was absent.
        name: issuedAt
        type: time.Time
      - doc: |-
          private maps an application claim name to its raw JSON encoding. Raw,
          because re-encoding a decoded value would change bytes the issuer signed.
        name: private
        type: map[string][]byte
    kind: struct
    methods:
      - name: Issuer
        recv: c ClaimsValue
        results: string
      - name: Subject
        recv: c ClaimsValue
        results: string
      - name: ID
        recv: c ClaimsValue
        results: string
      - name: Audience
        recv: c ClaimsValue
        results: "[]string"
      - name: Expiry
        recv: c ClaimsValue
        results: time.Time
      - name: NotBefore
        recv: c ClaimsValue
        results: time.Time
      - name: IssuedAt
        recv: c ClaimsValue
        results: time.Time
      - name: PrivateNames
        recv: c ClaimsValue
        results: "[]string"
      - name: PrivateRaw
        params: name string
        recv: c ClaimsValue
        results: raw []byte, found bool
      - name: IsZero
        recv: c ClaimsValue
        results: bool
      - name: String
        recv: c ClaimsValue
        results: string
      - name: GoString
        recv: c ClaimsValue
        results: string
      - doc: registeredCount reports how many of the seven registered claims are present.
        name: registeredCount
        recv: c ClaimsValue
        results: int
      - name: WithIssuer
        params: iss string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithSubject
        params: sub string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithID
        params: jti string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithAudience
        params: aud ...string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithExpiry
        params: exp time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithNotBefore
        params: nbf time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithIssuedAt
        params: iat time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithPrivateRaw
        params: name string, raw []byte
        recv: c ClaimsValue
        results: claims ClaimsValue, err error
    name: ClaimsValue
  - kind: named
    methods:
      - name: String
        recv: s ClaimState
        results: string
    name: ClaimState
    underlying: uint8
  - kind: named
    name: TextClaim
    underlying: uint8
  - kind: named
    name: TimeClaim
    underlying: uint8
  - doc: textSlot is one fixed-capacity text claim.
    fields:
      - doc: value holds the decoded octets; only the first n are meaningful.
        name: value
        type: "[ClaimsBufTextCap]byte"
      - doc: n is how many octets of value the claim occupies.
        name: "n"
        type: uint16
      - doc: state is what is known about the claim.
        name: state
        type: ClaimState
    kind: struct
    methods:
      - doc: view returns the slot's octets when usable, and its state.
        name: view
        recv: s *textSlot
        results: value []byte, state ClaimState
      - doc: set copies value into the slot, or refuses it when it does not fit.
        name: set
        params: value []byte
        recv: s *textSlot
        results: error
    name: textSlot
  - doc: timeSlot is one registered instant, as Unix seconds and nanoseconds.
    fields:
      - doc: sec is the whole seconds since the Unix epoch.
        name: sec
        type: int64
      - doc: |-
          nsec is the fraction past sec, in nanoseconds, in [0, 1e9): sec is the
          floor, as time.Time.Unix reports it.
        name: nsec
        type: int32
      - doc: state is what is known about the claim.
        name: state
        type: ClaimState
    kind: struct
    name: timeSlot
  - fields:
      - doc: text holds iss, sub and jti, indexed by TextClaim.
        name: text
        type: "[textClaims]textSlot"
      - doc: times holds exp, nbf and iat, indexed by TimeClaim.
        name: times
        type: "[timeClaims]timeSlot"
      - doc: audience holds the "aud" members, in token order.
        name: audience
        type: "[ClaimsBufAudienceCap]textSlot"
      - doc: audienceLen is how many audience entries are populated.
        name: audienceLen
        type: uint8
      - doc: |-
          names are the declared private claim names, configuration kept across
          resets.
        name: names
        type: "[ClaimsBufPrivateCap]string"
      - doc: declared is how many entries of names are populated.
        name: declared
        type: uint8
      - doc: private holds the declared private claims, indexed like names.
        name: private
        type: "[ClaimsBufPrivateCap]textSlot"
    kind: struct
    methods:
      - doc: declare appends one private claim name to b's declaration.
        name: declare
        params: name string
        recv: b *ClaimsBuf
        results: error
      - name: Reset
        recv: b *ClaimsBuf
      - name: Text
        params: c TextClaim
        recv: b *ClaimsBuf
        results: value []byte, state ClaimState
      - name: SetText
        params: c TextClaim, value []byte
        recv: b *ClaimsBuf
        results: error
      - name: Unix
        params: c TimeClaim
        recv: b *ClaimsBuf
        results: sec int64, nsec int32, state ClaimState
      - name: SetUnix
        params: c TimeClaim, sec int64, nsec int32
        recv: b *ClaimsBuf
      - name: AudienceLen
        recv: b *ClaimsBuf
        results: int
      - name: Audience
        params: i int
        recv: b *ClaimsBuf
        results: value []byte, state ClaimState
      - name: AppendAudience
        params: value []byte
        recv: b *ClaimsBuf
        results: error
      - name: Declared
        recv: b *ClaimsBuf
        results: int
      - name: PrivateIndex
        params: name []byte
        recv: b *ClaimsBuf
        results: int
      - name: Private
        params: name string
        recv: b *ClaimsBuf
        results: value []byte, state ClaimState
      - name: SetPrivate
        params: i int, value []byte
        recv: b *ClaimsBuf
        results: error
      - name: MarkPrivate
        params: i int, state ClaimState
        recv: b *ClaimsBuf
      - name: String
        recv: b ClaimsBuf
        results: string
      - name: GoString
        recv: b ClaimsBuf
        results: string
    name: ClaimsBuf
  - fields:
      - doc: mac is the keyed MAC this scratch reuses, Reset before every use.
        name: mac
        type: hash.Hash
      - doc: |-
          owner is the token of the verifier that made the scratch; compared by
          identity, never read.
        name: owner
        type: any
      - doc: |-
          inUse is 1 while a verification holds the scratch: entered by a CAS
          from 0, left by a store of 0.
        name: inUse
        type: atomic.Uint32
      - doc: sum receives the computed tag, so summing allocates nothing.
        name: sum
        type: "[scratchSumLen]byte"
    kind: struct
    methods:
      - name: Enter
        params: owner any
        recv: s *VerifyScratch
        results: error
      - name: Leave
        recv: s *VerifyScratch
      - name: MACEqual
        params: input, tag []byte
        recv: s *VerifyScratch
        results: bool
      - name: String
        recv: s *VerifyScratch
        results: string
      - name: GoString
        recv: s *VerifyScratch
        results: string
    name: VerifyScratch
  - kind: named
    methods:
      - name: String
        recv: a Algorithm
        results: string
      - name: Known
        recv: a Algorithm
        results: bool
    name: Algorithm
    underlying: uint8
vars:
  - doc: |-
      registeredClaims is the closed set of names this domain owns. A private
      claim may not use one of them, because a second spelling of "exp" that the
      validator never reads is a claim an application would trust and nothing
      would enforce.
    items:
      - name: registeredClaims
        value: |-
          []string{
          	ClaimIssuer, ClaimSubject, ClaimAudience,
          	ClaimExpiry, ClaimNotBefore, ClaimIssuedAt, ClaimID,
          }
    name: registeredClaims
