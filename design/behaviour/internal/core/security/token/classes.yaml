        results: bool
      - name: String
        recv: c ClaimsValue
        results: string
      - name: GoString
        recv: c ClaimsValue
        results: string
      - doc: registeredCount reports how many of the seven registered claims are present.
        name: registeredCount
        recv: c ClaimsValue
        results: int
      - name: WithIssuer
        params: iss string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithSubject
        params: sub string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithID
        params: jti string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithAudience
        params: aud ...string
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithExpiry
        params: exp time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithNotBefore
        params: nbf time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithIssuedAt
        params: iat time.Time
        recv: c ClaimsValue
        results: ClaimsValue
      - name: WithPrivateRaw
        params: name string, raw []byte
        recv: c ClaimsValue
        results: claims ClaimsValue, err error
    name: ClaimsValue
  - kind: named
    methods:
      - name: String
        recv: a Algorithm
        results: string
      - name: Known
        recv: a Algorithm
        results: bool
    name: Algorithm
    underlying: uint8
vars:
  - doc: |-
      registeredClaims is the closed set of names this domain owns. A private
      claim may not use one of them, because a second spelling of "exp" that the
      validator never reads is a claim an application would trust and nothing
      would enforce.
    items:
      - name: registeredClaims
        value: |-
          []string{
          	ClaimIssuer, ClaimSubject, ClaimAudience,
          	ClaimExpiry, ClaimNotBefore, ClaimIssuedAt, ClaimID,
          }
    name: registeredClaims
