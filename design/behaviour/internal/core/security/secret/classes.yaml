# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      MaxNameLen is the longest secret name, in bytes. It is the length of a DNS
      label (RFC 1123), and the grammar is that label's: long enough for any name
      a person chooses, short enough for every filesystem and every environment.
    items:
      - name: MaxNameLen
        type: int
        value: "63"
    name: MaxNameLen
  - doc: |-
      MaxSubjectLen is the longest subject, in bytes: room for a SHA-512 digest in
      hexadecimal, the longest reference a caller has a reason to derive.
    items:
      - name: MaxSubjectLen
        type: int
        value: "128"
    name: MaxSubjectLen
  - doc: |-
      Redacted is the placeholder every rendering of a [Value] writes, whatever
      the secret holds — including nothing. One constant for every value is the
      point: a rendering that varied with the secret, even only in its length,
      would be a channel the secret leaks through.
    items:
      - name: Redacted
        type: string
        value: "\"<redacted>\""
    name: Redacted
  - doc: |-
      jsonNull is the token encoding/json hands an Unmarshaler for an explicit
      null, which by the package's own convention leaves the target untouched.
    items:
      - name: jsonNull
        type: string
        value: "\"null\""
    name: jsonNull
  - doc: jsonQuote opens and closes a JSON string token.
    items:
      - name: jsonQuote
        type: byte
        value: "'\"'"
    name: jsonQuote
files:
  - decls: []
    name: doc.go
  - decls:
      - MaxNameLen
      - ValidateName
      - isAnchor
    name: name.go
  - decls:
      - VersionValue
    name: secret.go
  - decls:
      - MaxSubjectLen
      - ValidateSubject
      - isSubjectByte
      - SubjectKeyValue
    name: subject.go
  - decls:
      - Redacted
      - jsonNull
      - jsonQuote
      - Value
      - heldBytes
      - NewValue
      - FromString
      - Value.Reveal
      - Value.RevealString
      - Value.IsZero
      - Value.Len
      - Value.Equal
      - Value.String
      - Value.GoString
      - Value.Format
      - Value.MarshalJSON
      - Value.MarshalText
      - (*Value).UnmarshalJSON
      - (*Value).UnmarshalText
      - Value.bytes
      - writeRendering
    name: value.go
functions:
  - name: ValidateName
    params: name string
    results: error
  - doc: |-
      isAnchor reports whether b is a lowercase ASCII letter or a digit — the
      characters a name may start and end with.
    name: isAnchor
    params: b byte
    results: bool
  - name: ValidateSubject
    params: subject string
    results: error
  - doc: isSubjectByte reports whether b belongs to the subject alphabet.
    name: isSubjectByte
    params: b byte
    results: bool
  - name: NewValue
    params: raw []byte
    results: Value
  - name: FromString
    params: text string
    results: Value
  - doc: |-
      writeRendering writes a rendering into the state fmt handed to Format.

      fmt.Formatter has no error return, and fmt itself discards what a write into
      its own buffer reports, so there is nowhere for the error to go. It is read
      here rather than assigned to a blank, so the discard is visible as a
      decision.
    name: writeRendering
    params: state fmt.State, text string
imports:
  bytes: bytes
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
  io: io
  json: encoding/json
  strconv: strconv
  subtle: crypto/subtle
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/security/secret
  name: secret
  purpose: Package secret — ranges 0.2.37.* (the port's verdicts) and 0.3.68.* (the engines' own refusals) — ADR 0096 and ADR 0142, declared here since ADR 0160.
types:
  - fields:
      - doc: Name is the secret's name, in the grammar [ValidateName] accepts.
        name: Name
        type: string
      - doc: |-
          Version is this version's number: 1 for the first, strictly increasing,
          never reused.
        name: Version
        type: int
      - doc: Value is the secret.
        name: Value
        type: Value
      - doc: |-
          Created is when the store recorded this version, from the store's own
          clock. A store that cannot know — the environment does not say when a
          variable was set — reports the zero time, and says so in its doc.
        name: Created
        type: time.Time
    kind: struct
    name: VersionValue
  - fields:
      - doc: |-
          Subject is whom the key belongs to, in the grammar [ValidateSubject]
          accepts.
        name: Subject
        type: string
      - doc: |-
          Wrapped is the data key sealed under the root keyring: ciphertext,
          bound to Subject, readable by nothing without the root.
        name: Wrapped
        type: "[]byte"
    kind: struct
    name: SubjectKeyValue
  - fields:
      - doc: |-
          _ makes the struct non-comparable at zero cost, so == and map keys are
          compile errors rather than an identity comparison that looks like an
          equality one.
        name: _
        type: "[0]func()"
      - doc: |-
          held points at the secret's bytes; nil for the zero Value. It is never
          mutated after construction, so copies of a Value share it safely.
        name: held
        type: "*heldBytes"
    kind: struct
    methods:
      - name: Reveal
        recv: v Value
        results: "[]byte"
      - name: RevealString
        recv: v Value
        results: string
      - name: IsZero
        recv: v Value
        results: bool
      - name: Len
        recv: v Value
        results: int
      - name: Equal
        params: other Value
        recv: v Value
        results: bool
      - name: String
        recv: v Value
        results: string
      - name: GoString
        recv: v Value
        results: string
      - name: Format
        params: state fmt.State, verb rune
        recv: v Value
      - name: MarshalJSON
        recv: v Value
        results: encoded []byte, err error
      - name: MarshalText
        recv: v Value
        results: text []byte, err error
      - name: UnmarshalJSON
        params: data []byte
        recv: v *Value
        results: error
      - name: UnmarshalText
        params: text []byte
        recv: v *Value
        results: error
      - doc: |-
          bytes returns the held secret without copying, for the comparisons inside
          this package. It never leaves the package.
        name: bytes
        recv: v Value
        results: "[]byte"
    name: Value
  - doc: |-
      heldBytes is the one allocation a Value owns. It is a separate type only so
      that the field a Value carries is a pointer — see the Value doc comment.
    fields:
      - doc: "raw is the secret, never empty: the empty secret is a nil held pointer."
        name: raw
        type: "[]byte"
    kind: struct
    name: heldBytes
