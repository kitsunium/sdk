  - name: Sign
    params: name Algorithm, priv, message []byte
    results: sig []byte, err error
  - name: Verify
    params: name Algorithm, pub, message, sig []byte
    results: ok bool, err error
  - name: RegisterStreamSealer
    params: s StreamSealer
    results: StreamSealer
  - name: LookupStreamSealer
    params: name Algorithm
    results: s StreamSealer, ok bool
