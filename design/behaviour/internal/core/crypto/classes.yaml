imports:
  bytes: bytes
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
  hash: hash
  hex: encoding/hex
  io: io
  plugin: github.com/kitsunium/sdk/internal/kernel/plugin
  strconv: strconv
  strings: strings
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/crypto
  name: crypto
  purpose: Package crypto — the AEAD port implemented by each concrete algorithm.
types:
  - doc: |-
      agreementSchemeFault is the opaque, non-*errs.Error stand-in attached as the
      cause when an Agreement scheme returns its own typed error. It carries a
      fixed redacted message so no scheme diagnostic — and no key material — can
      ride out through the wrap chain, while still keeping a cause for chain walks.
    kind: struct
    methods:
      - doc: Error reports a fixed redacted marker so the scheme's diagnostic never leaks.
        name: Error
        recv: agreementSchemeFault
        results: string
    name: agreementSchemeFault
  - kind: named
    methods:
      - name: String
        recv: a Algorithm
        results: string
      - name: Known
        recv: a Algorithm
        results: bool
    name: Algorithm
    underlying: string
  - fields:
      - doc: |-
          raw holds the symmetric key bytes behind a slice so a value-receiver
          Zeroize can clear the shared backing array; NewKey is the only producer.
        name: raw
        type: "[]byte"
    kind: struct
    methods:
      - name: Bytes
        recv: k Key
        results: "[]byte"
      - name: Zeroize
        recv: k Key
      - name: String
        recv: k Key
        results: string
      - name: GoString
        recv: k Key
        results: string
    name: Key
  - doc: |-
      schemeRegistry is one capability's registry: the kernel's read-mostly,
      copy-on-write table, and the public registrar's name, which is what its
      refusals carry. Re-registering the SAME value is an idempotent no-op; a
      DISTINCT value under a taken Algorithm is the hard conflict. The zero table
      is ready to use; a registry is declared with its verb.

      V is what the registry stores: a comparable port that names its own
      Algorithm, the key it registers under — every capability port is one.
    fields:
      - doc: |-
          table maps each Algorithm to its scheme; Lookup and Names read it
          directly, lock-free.
        name: table
        type: plugin.Registry[Algorithm, V]
      - doc: verb names the public registrar in panic/error text, e.g. "RegisterHasher".
        name: verb
        type: string
    kind: struct
    methods:
      - doc: |-
          register is the body of every public registrar: it refuses an unusable value,
          publishes v under v.Algorithm(), and returns v so a scheme package can bind
          its singleton to a typed package-level variable. Both refusals are boot-time
          panics carrying the duplicate-registration code.

          "Unusable" means a nil, a typed nil pointer or a value whose type is not
          comparable: each satisfies the port and none can serve one call (see
          internal/kernel/plugin). It is refused BEFORE v.Algorithm() is called, which
          is what lets a typed nil be refused at all.
        name: register
        params: v V
        recv: r *schemeRegistry[V]
        results: V
      - doc: |-
          publish inserts (name -> v). Returns a non-nil error when name is already
          held by a DISTINCT value; re-publishing the SAME value is an idempotent
          no-op. The duplicate check and the publish are one atomic step of the kernel
          table.
        name: publish
        params: name Algorithm, v V
        recv: r *schemeRegistry[V]
        results: error
    name: schemeRegistry
    typeParams: |-
      V interface {
      	comparable
      	Algorithm() Algorithm
      }
vars:
  - doc: |-
      agreements maps each Algorithm to its Agreement scheme. Backed by the shared
      read-mostly schemeRegistry — register once at import, dispatch is lock-free.
    items:
      - name: agreements
        value: "schemeRegistry[Agreement]{verb: \"RegisterAgreement\"}"
    name: agreements
  - doc: |-
      derivers maps each Algorithm to its Deriver. A distinct capability beside
      AEAD/Hasher/Signer; backed by the shared read-mostly schemeRegistry — register
      once at import, dispatch is lock-free.
    items:
      - name: derivers
        value: "schemeRegistry[Deriver]{verb: \"RegisterDeriver\"}"
    name: derivers
  - doc: |-
      hashers maps each Algorithm to its Hasher. Separate from the AEAD registry:
      fingerprint hashing is a distinct, non-authenticated capability. Backed by the
      shared read-mostly schemeRegistry — register once at import, Sum is lock-free.
    items:
      - name: hashers
        value: "schemeRegistry[Hasher]{verb: \"RegisterHasher\"}"
    name: hashers
  - doc: |-
      macs maps each Algorithm to its MAC. Backed by the shared read-mostly
      schemeRegistry — register once at import, dispatch is lock-free.
    items:
      - name: macs
        value: "schemeRegistry[MAC]{verb: \"RegisterMAC\"}"
    name: macs
  - doc: |-
      passwordHashers maps each Algorithm to its PasswordHasher. Backed by the
      shared read-mostly schemeRegistry — register once at import, dispatch is
      lock-free.
    items:
      - name: passwordHashers
        value: "schemeRegistry[PasswordHasher]{verb: \"RegisterPasswordHasher\"}"
    name: passwordHashers
  - doc: |-
      aeads maps each Algorithm to its AEAD (the shared schemeRegistry); idIndex
      maps the 1-byte wire id to the same AEAD so Open can dispatch from the box
      header alone. Both are the kernel's read-mostly, copy-on-write table
      (kernel/plugin.Registry, ADR 0159). The id index is the AEAD's own, kept
      BESIDE the Algorithm table: the scheme registry is keyed by Algorithm,
      whereas Open resolves by the byte id in the frame.
    grouped: true
    items:
      - name: aeads
        value: "schemeRegistry[AEAD]{verb: \"Register\"}"
      - name: idIndex
        type: plugin.Registry[byte, AEAD]
    name: aeads
  - doc: |-
      signers maps each Algorithm to its Signer. Backed by the shared read-mostly
      schemeRegistry — register once at import, dispatch is lock-free.
    items:
      - name: signers
        value: "schemeRegistry[Signer]{verb: \"RegisterSigner\"}"
    name: signers
  - doc: |-
      streamSealers maps each Algorithm to its StreamSealer. Backed by the shared
      read-mostly schemeRegistry — register once at import, dispatch is lock-free.
    items:
      - name: streamSealers
        value: "schemeRegistry[StreamSealer]{verb: \"RegisterStreamSealer\"}"
    name: streamSealers
