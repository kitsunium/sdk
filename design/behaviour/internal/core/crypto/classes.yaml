functions:
  - name: RegisterAgreement
    params: a Agreement
    results: Agreement
  - name: LookupAgreement
    params: name Algorithm
    results: a Agreement, ok bool
  - name: AvailableAgreements
    results: "[]Algorithm"
  - name: GenerateAgreementKey
    params: name Algorithm
    results: pub, priv []byte, err error
  - name: AgreementShared
    params: name Algorithm, priv, peerPub []byte
    results: secret []byte, err error
  - doc: |-
      neutralizeAgreementCause returns a cause safe to hand to errs.Wrap at the
      AgreementShared boundary. When the scheme returns a stdlib error it passes
      through unchanged (errs.Wrap takes the stdlib path, so AgreementFailed wins
      origin). When the scheme returns its own *errs.Error, origin-wins would
      otherwise inherit that error's Code/Public/Private — possibly leaking a
      diagnostic message or key bytes — so it is collapsed to an opaque
      agreementSchemeFault carrying no scheme Public/Private/Fields, forcing the
      facade's CodeAgreementFailed to stay the origin (finding V21).
    name: neutralizeAgreementCause
    params: cause error
    results: error
  - name: RegisterDeriver
    params: d Deriver
    results: Deriver
  - name: LookupDeriver
    params: name Algorithm
    results: d Deriver, ok bool
  - name: AvailableDerivers
    results: "[]Algorithm"
  - name: Subkey
    params: name Algorithm, secret, salt []byte, info string, length int
    results: subkey []byte, err error
  - doc: |-
      conflictText renders a registry conflict for the boot panic that reports it:
      the typed error's header and Public, then each field it carries, quoted.
      Error() never renders a field (rule 4), and the panic is the only place an
      operator learns WHICH registrar refused WHICH key.
    name: conflictText
    params: err error
    results: string
