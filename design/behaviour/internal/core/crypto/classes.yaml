    results: "[]Algorithm"
  - name: Seal
    params: name Algorithm, key Key, plaintext, aad []byte
    results: box []byte, err error
  - name: Open
    params: key Key, box, aad []byte
    results: plaintext []byte, err error
  - name: RegisterSigner
