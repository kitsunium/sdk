    results: key Key, err error
  - name: RegisterMAC
    params: m MAC
    results: MAC
  - name: LookupMAC
    params: name Algorithm
    results: m MAC, ok bool
  - name: AvailableMACs
    results: "[]Algorithm"
  - name: MACTag
    params: name Algorithm, key Key, message []byte
    results: tag []byte, err error
  - name: MACVerify
    params: name Algorithm, key Key, message, tag []byte
    results: ok bool, err error
  - name: RegisterPasswordHasher
    params: p PasswordHasher
    results: PasswordHasher
  - name: LookupPasswordHasher
    params: name Algorithm
    results: p PasswordHasher, ok bool
  - name: AvailablePasswordHashers
    results: "[]Algorithm"
  - name: HashPassword
    params: name Algorithm, password []byte
    results: phc string, err error
  - name: VerifyPassword
    params: password []byte, phc string
    results: ok bool, err error
  - name: NeedsRehash
    params: phc string
    results: bool
  - doc: |-
      phcID extracts the scheme id from a PHC string of the form `$id$...`. It
      returns ok=false for any string not starting with `$id$`.
    name: phcID
    params: phc string
    results: id string, ok bool
  - name: Register
    params: a AEAD
    results: AEAD
  - doc: |-
      indexID inserts (id -> a) into the wire-id index. Same idempotent-vs-conflict
      semantics as the scheme registry: the SAME scheme under its own id is a
      no-op, a DISTINCT one under a taken id is the conflict. The check and the
      insert are one atomic step of the kernel table.
    name: indexID
    params: id byte, a AEAD
    results: error
  - name: Lookup
    params: name Algorithm
    results: a AEAD, ok bool
  - doc: |-
      lookupByID resolves the 1-byte wire id to its AEAD; used by Open to dispatch
      from the box header alone.

      IFACE-PLUGIN: returns the AEAD interface so the box id resolves to whichever
      scheme registered it; concrete scheme types stay unexported per package.
    name: lookupByID
    params: id byte
    results: a AEAD, ok bool
