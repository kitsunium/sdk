# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      KeyLen is the required symmetric key length in bytes (256-bit). Both shipped
      AEADs — AES-256-GCM and XChaCha20-Poly1305 — take a 32-byte key, so a single
      fixed length keeps the surface tiny and the validation total.
    items:
      - name: KeyLen
        type: int
        value: "32"
    name: KeyLen
  - doc: |-
      phcMinSegments is the minimum field count of a `$id$…` PHC string once split
      on `$`: the empty prefix, the id, and at least one more field.
    items:
      - name: phcMinSegments
        type: int
        value: "3"
    name: phcMinSegments
  - doc: |-
      Version is the box wire-format version, the first byte of every sealed box
      ([Version][id][nonce][ciphertext||tag]). It is frozen post-v1.0.0; a future
      framing change bumps it and Open rejects an unknown version as
      DecryptionFailed. Concrete AEADs embed it via this constant.
    items:
      - name: Version
        type: byte
        value: "0x01"
    name: Version
  - doc: |-
      headerLen is the fixed prefix every box carries before its scheme-specific
      nonce: one Version byte + one algorithm-id byte.
    items:
      - name: headerLen
        type: int
        value: "2"
    name: headerLen
