package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/net
  name: net
  purpose: Package net — the listen address value.
types:
  - fields:
      - doc: |-
          Network is the socket family: tcp, tcp4, tcp6, udp, udp4, udp6, unix,
          unixgram or unixpacket.
        name: Network
        type: string
      - doc: |-
          Addr is the bind target: "host:port" for the IP families, a filesystem
          path for the unix families.
        name: Addr
        type: string
    kind: struct
    methods:
      - name: String
        recv: a AddressValue
        results: string
    name: AddressValue
  - fields:
      - doc: Method is the uppercase HTTP method.
        name: Method
        type: string
      - doc: Host is the authority the call was sent to.
        name: Host
        type: string
      - doc: Path is the request path.
        name: Path
        type: string
      - doc: Status is the HTTP status code, or zero when the call produced no response.
        name: Status
        type: int
      - doc: Bytes is the number of response body bytes read.
        name: Bytes
        type: int64
      - doc: |-
          Duration is the wall-clock time from request start to response headers.
          It deliberately excludes the body: the record is emitted once the body is
          done with, but this field measures the upstream's time to first answer,
          which is the one a slow upstream and a large payload do not share.
        name: Duration
        type: time.Duration
      - doc: |-
          Err is what ended the call: a policy refusal, a transport failure, the
          response ceiling, or a failed close. Nil when the body was read in full.
        name: Err
        type: error
    kind: struct
    name: CallValue
  - kind: named
    name: CallHook
    underlying: func(call CallValue)
  - kind: named
    name: Capability
    underlying: string
  - fields:
      - doc: Name is the capability.
        name: Name
        type: Capability
      - doc: Class is "a-kernel", "a-code" or "b".
        name: Class
        type: string
      - doc: |-
          Status is "on" (probed and in use), "available" (probed, not asked for),
          "absent" (probed, the kernel lacks it), "missing" (a class A-code
          capability the code opted into and the kernel lacks: a fault),
          "disabled" (switched off by KITSUNIUM_NET_DISABLE or an unknown token,
          never probed) or "unprobed" (the backend the group runs on has no use for
          it).
        name: Status
        type: string
      - doc: Reason names the probe stage and the kernel's answer, or the switch.
        name: Reason
        type: string
    kind: struct
    name: CapabilityValue
  - fields:
      - doc: BaseURL is the origin every relative path resolves against.
        name: BaseURL
        type: string
      - doc: DialTimeout bounds establishing the TCP connection.
        name: DialTimeout
        type: DurationValue
      - doc: HandshakeTimeout bounds the TLS handshake.
        name: HandshakeTimeout
        type: DurationValue
      - doc: |-
          ResponseTimeout bounds the wait for response headers after the request
          has been written. It is separate from TotalTimeout so a slow upstream is
          distinguishable from a large body.
        name: ResponseTimeout
        type: DurationValue
      - doc: TotalTimeout bounds the whole call, body included.
        name: TotalTimeout
        type: DurationValue
      - doc: |-
          MaxResponseSize caps the response body in bytes. A body of exactly this
          size is admitted; only one past it fails the call, and the body is never
          truncated.
        name: MaxResponseSize
        type: int64
      - doc: |-
          MaxRedirects caps the redirect chain. Every hop is re-authorised by the
          policy, and a hop to another origin is refused unless RedirectOrigins
          names it, so a redirect cannot walk out of the allowed surface.
        name: MaxRedirects
        type: int
      - doc: |-
          RedirectOrigins names the origins, each written scheme://host[:port], a
          redirect may lead to besides the origin of the request that started the
          chain. Empty — the default — refuses with RequestDenied every redirect
          that changes the scheme, the host or the port, https to http included:
          the built-in policies judge the method and the path, so a hop that keeps
          the path and swaps the origin would otherwise pass them. A listed origin
          is followed, and receives none of the DefaultHeaders. An entry that is
          not a bare http or https origin fails New with InvalidAddress.
        name: RedirectOrigins
        type: "[]string"
      - doc: |-
          DefaultHeaders are added to every request that does not already set them
          and is sent to the origin of BaseURL — or, with no BaseURL, to whatever
          origin the request names. They are never sent to another origin: a
          request built for one does not receive them, and a redirect that leaves
          the origin of the request that started the chain is sent without them.
        name: DefaultHeaders
        type: map[string]string
    kind: struct
    name: ClientConfig
  - fields:
      - doc: |-
          Types lists the Content-Types, without parameters, that may be compressed.
          Empty selects text/plain, text/css, text/javascript, text/csv, text/xml,
          application/json, application/javascript, application/xml, image/svg+xml
          and application/wasm. text/html is not among them: a page that reflects a
          request's input beside a secret is what BREACH reads, and a caller who
          compresses HTML names it here, knowing it does not do that.
        name: Types
        type: "[]string"
      - doc: Level is gzip's level, 1 to 9 or -1 for its default; zero selects -1.
        name: Level
        type: int
      - doc: |-
          MinBytes is the smallest body compressed: a smaller one is sent as it is,
          as its gzip container would cost more than it saves. Zero selects 1024; a
          negative value is refused.
        name: MinBytes
        type: int
    kind: struct
    name: CompressValue
  - kind: named
    methods:
      - name: ServeConn
        params: ctx context.Context, c Conn
        recv: f ConnHandlerFunc
        results: error
    name: ConnHandlerFunc
    underlying: func(ctx context.Context, c Conn) error
  - fields:
      - doc: |-
          Origins are the exact origins allowed, as a browser serializes them:
          scheme://host[:port], in lower case, with no path. "*" allows any origin,
          alone in the list and without Credentials. "null" is refused: it is what a
          sandboxed page and a local file both send.
        name: Origins
        type: "[]string"
      - doc: |-
          Methods are the methods a preflight may ask for; empty selects the
          CORS-safelisted GET, HEAD and POST, never every method.
        name: Methods
        type: "[]string"
      - doc: |-
          Headers are the request fields a preflight may ask for; empty allows only
          the CORS-safelisted fields.
        name: Headers
        type: "[]string"
      - doc: ExposeHeaders are the response fields a page may read.
        name: ExposeHeaders
        type: "[]string"
      - doc: |-
          Credentials lets a page send cookies and read the answer. It is refused
          with "*": that combination publishes every user's answers to every site.
        name: Credentials
        type: bool
      - doc: |-
          MaxAge is how long a browser may keep a preflight's answer, clamped to 24
          hours; zero writes no Access-Control-Max-Age, negative is refused.
        name: MaxAge
        type: DurationValue
    kind: struct
    methods:
      - doc: answers builds what origin is answered.
        name: answers
        params: origin string, methods []string
        recv: c *CORSValue
        results: "*corsOrigin"
      - doc: check refuses what the policy cannot honour.
        name: check
        params: methods []string
        recv: c *CORSValue
        results: error
      - doc: |-
          originsValid reports whether Origins is a list the policy can compare: one
          exact origin after another, each once, or "*" alone without Credentials.
        name: originsValid
        recv: c *CORSValue
        results: bool
    name: CORSValue
  - fields:
      - doc: Name is the field name.
        name: Name
        type: string
      - doc: Value is the field value.
        name: Value
        type: string
    kind: struct
    name: CORSFieldValue
  - fields:
      - doc: "Lines are the field lines, each \"Name: value\\r\\n\", for the http1 codec."
        name: Lines
        type: "[]byte"
      - doc: Fields are the fields by name, for net/http's Header.
        name: Fields
        type: "[]CORSFieldValue"
    kind: struct
    name: CORSAnswerValue
  - doc: corsOrigin is what one origin is answered, built once.
    fields:
      - doc: actual answers a request that is not a preflight.
        name: actual
        type: CORSAnswerValue
      - doc: preflight answers a preflight.
        name: preflight
        type: CORSAnswerValue
    kind: struct
    name: corsOrigin
  - fields:
      - doc: |-
          origins finds an exact origin's answers; a lookup by a []byte key converts
          nothing.
        name: origins
        type: map[string]*corsOrigin
      - doc: any answers every origin when the policy is "*"; nil otherwise.
        name: any
        type: "*corsOrigin"
      - doc: methods are the methods a preflight may ask for.
        name: methods
        type: map[string]struct{}
      - doc: "vary answers an origin not listed: Vary: Origin alone."
        name: vary
        type: CORSAnswerValue
    kind: struct
    methods:
      - name: Actual
        params: origin []byte
        recv: p *CORSPolicy
        results: CORSAnswerValue
      - name: Preflight
        params: origin, method []byte
        recv: p *CORSPolicy
        results: CORSAnswerValue
      - doc: lookup returns origin's answers, nil when it is not allowed.
        name: lookup
        params: origin []byte
        recv: p *CORSPolicy
        results: "*corsOrigin"
    name: CORSPolicy
  - doc: |-
      drainSignalKey types the context key so no other package can collide with it
      and no string constant can be typo'd into a silent miss.
    kind: struct
    name: drainSignalKey
  - kind: named
    methods:
      - name: Duration
        recv: d DurationValue
        results: time.Duration
      - name: String
        recv: d DurationValue
        results: string
      - name: MarshalJSON
        recv: d DurationValue
        results: encoded []byte, err error
      - name: UnmarshalJSON
        params: data []byte
        recv: d *DurationValue
        results: error
      - doc: parseString decodes the unquoted body of a JSON duration token.
        name: parseString
        params: token string
        recv: d *DurationValue
        results: error
    name: DurationValue
    underlying: time.Duration
  - kind: named
    methods:
      - name: String
        recv: e EngineValue
        results: string
    name: EngineValue
    underlying: uint8
  - fields:
      - doc: |-
          Head bounds the request line, the field lines and the blank line that
          ends them, in bytes: zero selects HTTP1DefaultHead, at most HTTP1MaxHead.
        name: Head
        type: int
      - doc: |-
          Target bounds the request-target, in bytes: zero selects
          HTTP1DefaultTarget, and it may not exceed Head.
        name: Target
        type: int
      - doc: |-
          Body bounds the Content-Length a request may declare: zero selects
          HTTP1DefaultBody, at most HTTP1MaxBody.
        name: Body
        type: int64
    kind: struct
    name: HTTP1LimitsValue
  - fields:
      - doc: Name is the field name, validated as an RFC 9110 token.
        name: Name
        type: "[]byte"
      - doc: |-
          Value is the field value, without its leading and trailing spaces and
          tabs; it holds no NUL, CR, LF or other control byte but the tab.
        name: Value
        type: "[]byte"
    kind: struct
    name: HTTP1FieldValue
  - fields:
      - doc: Method is the request method, a token.
        name: Method
        type: "[]byte"
      - doc: Target is the request-target exactly as sent, still percent-encoded.
        name: Target
        type: "[]byte"
      - doc: Host is the Host field's value; HasHost says whether it was present.
        name: Host
        type: "[]byte"
      - doc: |-
          Authorization is the Authorization field's value; HasAuthorization says
          whether it was present.
        name: Authorization
        type: "[]byte"
      - doc: |-
          Body is the request content, Content-Length bytes after the head. It is
          empty until the whole body has arrived.
        name: Body
        type: "[]byte"
      - doc: ContentLength is the declared body length, zero when the field is absent.
        name: ContentLength
        type: int64
      - doc: |-
          HeadLen is the length of the head: the request line, the field lines and
          the blank line. It is zero until the head is complete.
        name: HeadLen
        type: int
      - doc: |-
          Consumed is HeadLen plus ContentLength: the bytes this request takes from
          the stream, whatever its method or route. The next pipelined request
          starts there. It is set as soon as the head is complete, before the body
          arrives, so an early answer knows how much it has to drain.
        name: Consumed
        type: int
      - doc: NFields is how many entries of Fields the request filled.
        name: NFields
        type: int
      - doc: |-
          Fields holds the request's field lines in the order they arrived,
          Host, Authorization and Content-Length included.
        name: Fields
        type: "[HTTP1MaxFields]HTTP1FieldValue"
      - doc: HasHost reports whether the request carried a Host field.
        name: HasHost
        type: bool
      - doc: |-
          HasAuthorization reports whether the request carried an Authorization
          field.
        name: HasAuthorization
        type: bool
      - doc: |-
          Close reports whether the client asked to close the connection after
          this request: a Connection field holding the close token.
        name: Close
        type: bool
      - doc: |-
          Lane is the index of the lane that framed the request, from 0 to the
          group's lane count less one — its LoopIO.Loop — set by the loop adapter
          before the handler runs. One lane is one thread or one goroutine, so a
          handler finds its per-lane state in a slice sized at LoopStarter.OnStart,
          with no lock. Parse leaves it as it is; outside the loop adapter it is
          what the caller set.
        name: Lane
        type: int
      - doc: |-
          Path is the request's canonical path, the one target every link of a
          chain routes and judges on, computed once by the codec: the target's
          path up to its query, an absolute-form target reduced to its path once
          its authority matched Host. It is still percent-encoded, and holds no
          dot-segment, no empty segment, no backslash and no encoded slash, dot,
          backslash or NUL: the codec refuses a target that would (400). An
          asterisk-form target, OPTIONS only, is "*".
        name: Path
        type: "[]byte"
      - doc: |-
          Query is the target's query, after its "?" and without it; empty when
          the target has none.
        name: Query
        type: "[]byte"
      - doc: |-
          Route is the identifier of the route a router link matched, zero for
          none. Parse resets it to zero; only a link sets it.
        name: Route
        type: int
      - doc: |-
          Auth is what an authenticating link established: the subject and the
          claims, copied by value into the request, so nothing of them aliases
          bytes the connection reuses. Parse resets it; Authenticated says
          whether a link set it.
        name: Auth
        type: HTTP1AuthValue
      - doc: |-
          Authenticated reports whether an authenticating link verified the
          request's credentials and filled Auth. Parse resets it to false.
        name: Authenticated
        type: bool
      - doc: |-
          Trace is the request's W3C trace context, as the http1 chain's Trace link
          read it from the traceparent field: invalid (IsValid false) when no such
          link ran, when the field is absent, or when it is malformed, a request
          being served either way (§4.3). tracestate is not read: a request carries
          the 25 bytes of the context and no list. Parse resets it.
        name: Trace
        type: trace.SpanContextValue
      - doc: |-
          Scheme is the :scheme pseudo-field of an HTTP/2 request, empty on HTTP/1.1.
          An HTTP/2 codec maps a request before Canonical (ADR 0220): Method from
          :method; Target from :path, origin-form or "*" (an absolute-form :path is
          RefusalTargetForm); Host from :authority, else the Host field, both present
          and different RefusalTargetHost, HasHost set; Fields the regular fields in
          arrival order with HPACK's lowercase names; Authorization, ContentLength and
          Body as on HTTP/1.1; Close, HeadLen and Consumed zero.
        name: Scheme
        type: "[]byte"
      - doc: Proto is the request's HTTP major version, 1 or 2.
        name: Proto
        type: uint8
      - doc: Stream is the HTTP/2 stream the request arrived on, zero on HTTP/1.1.
        name: Stream
        type: uint32
      - doc: |-
          ID identifies the request on its lane — the lane in the top 16 bits, a
          counter from 1 in the rest — set by the loop adapter before the handler
          runs, so two lanes never hold the same one. It is a number the client
          never sees, what a sampling decision or a slow-request record is keyed on.
          Parse leaves it as it is; outside the loop adapter it is what the caller
          set.
        name: ID
        type: uint64
      - doc: |-
          Conn names the connection the request arrived on, set by the loop adapter
          before the handler runs: what a handler keeps to find, at
          HTTP1Streamer.OnStreamOpen, the stream this request opened. Parse leaves it
          as it is.
        name: Conn
        type: LoopConnRef
      - doc: |-
          RoutePrefix is how many leading bytes of Path the Prefix route a router link
          matched covers, zero for an exact route or none: what a file tree strips to
          find the name under its route. Parse resets it; only a link sets it.
        name: RoutePrefix
        type: int
      - doc: |-
          RequestID is the request's correlation identifier, as the http1 chain's
          RequestID link accepted it from X-Request-Id or minted it: copied by
          value, so a handler that needs it past the batch copies this value into
          its own job table. Parse resets it; it is empty when no such link ran.
        name: RequestID
        type: HTTP1RequestIDValue
    kind: struct
    methods:
      - name: Field
        params: name string
        recv: r *HTTP1RequestValue
        results: "[]byte, bool"
    name: HTTP1RequestValue
  - fields:
      - doc: |-
          Status is the status code, 200 to 999; zero means 200. The profile
          sends no interim response.
        name: Status
        type: int
      - doc: |-
          Header holds the response's extra field lines, each written as
          "Name: value\r\n" by the codec's writer. It never holds Content-Length or
          Connection, which the codec writes.
        name: Header
        type: "[]byte"
      - doc: Body is the response content.
        name: Body
        type: "[]byte"
      - doc: Close asks the codec to close the connection after this response.
        name: Close
        type: bool
      - doc: |-
          Defer, set by the handler, holds the answer back until the end of the
          loop's batch, for work it batches — one database transaction for every
          request of the batch, say. The response value then stays valid, at the
          same address, until HTTP1Batcher.EndBatch returns, and the handler
          completes it there: it fills it and clears Defer. An answer still
          deferred when EndBatch returns is answered 500 and its connection
          closed. Only the loop adapter reads it; AppendResponse does not.
        name: Defer
        type: bool
      - doc: |-
          Pending, set by the handler, hands the answer to the lane's worker
          (HTTP1Worker, R3): the loop adapter sends Job to it and writes the
          answer the worker fills, from the loop's thread, once it comes back.
          Answers after it on the same connection wait for it, in order. A queue
          to the worker that is full answers 503 with Retry-After at once, the
          connection kept; a connection that closes first drops the answer. Pending
          with Defer, or with no worker, is answered 500 and the connection closed.
          Only the loop adapter reads it.
        name: Pending
        type: bool
      - doc: |-
          Job is the integer a pending answer's worker is given: the handler's own
          index of what the work needs, which it copied out of the request, since
          the request's bytes do not outlive the batch.
        name: Job
        type: uint64
      - doc: |-
          TraceLine holds the traceparent field line the http1 chain's Trace link
          writes on this answer, Header pointing at it; a value, so a deferred
          answer keeps it past the request. Only the link sets it.
        name: TraceLine
        type: "[HTTP1TraceLineLen]byte"
      - doc: |-
          RequestID is the identifier the codec writes as an X-Request-Id field after
          Header, when set: a value, so a deferred or a pending answer keeps it past
          the request, and a field written per request needs no slice to outlive the
          batch. The chain's RequestID link sets it.
        name: RequestID
        type: HTTP1RequestIDValue
      - doc: |-
          Stream answers with a response delimited by the connection's close (RFC 9112
          §6.3 item 8): the codec writes the status line and the fields with
          Connection: close and no Content-Length, refusing HEAD, 204 and 304 with
          HTTP1ResponseInvalid, and the handler keeps writing the body through
          HTTP1Streamer. Requests pipelined behind it are dropped with the connection.
          A Stream with Defer or Pending, behind a held answer, or with no
          HTTP1Streamer in the handler is answered 500 and the connection closed. It
          does not make a chunked answer: ADR 0186 §D6 still refuses every coding.
        name: Stream
        type: bool
      - doc: |-
          Upgrade answers 101 Switching Protocols: the codec writes the status line,
          Connection: Upgrade and Header — which holds the protocol's own fields —
          and no length, then every later byte of the connection goes to
          HTTP1Upgrader. It carries no body; with one, or with no HTTP1Upgrader in the
          handler, the answer is 500 and the connection closed.
        name: Upgrade
        type: bool
      - doc: |-
          RetryAfter, when above zero, is written by the codec as a Retry-After field
          in seconds after Header: a value, so a refusal needs no slice of its own.
          The chain's RateLimit link sets it.
        name: RetryAfter
        type: int
      - doc: |-
          CORS holds the field lines the chain's CORS link gives this answer, written
          by the codec after Header: its own slot, so the link costs nothing beside a
          Headers link, and its bytes are the policy's, shared and read only.
        name: CORS
        type: "[]byte"
      - doc: |-
          File, set by a pending answer's worker, makes the answer's body a file: the
          codec writes the head with Content-Length File.Len and no body bytes, and
          sends the file behind it. A HEAD answer closes File.R unsent. With Body, on a
          204 or a 304, or outside a worker's answer it is answered 500 and the
          connection closed.
        name: File
        type: HTTP1FileValue
    kind: struct
    name: HTTP1ResponseValue
  - fields:
      - doc: |-
          R reads the file: *os.File where a descriptor is to be sent, or any other
          io.ReaderAt (an embed.FS file) through the copy path. Nil means no file.
        name: R
        type: io.ReaderAt
      - doc: Off is the offset of the first byte to send.
        name: "Off"
        type: int64
      - doc: Len is how many bytes to send; what Content-Length says.
        name: Len
        type: int64
    kind: struct
    name: HTTP1FileValue
  - fields:
      - doc: FD is the open descriptor, read and never closed by the engine.
        name: FD
        type: int
      - doc: Off is the offset of the first byte to send.
        name: "Off"
        type: int64
      - doc: Len is how many bytes to send.
        name: Len
        type: int64
    kind: struct
    name: LoopFileSpanValue
  - fields:
      - doc: IO is the loop the connection lives on.
        name: IO
        type: LoopIO
      - doc: Ref is the connection.
        name: Ref
        type: LoopConnRef
    kind: struct
    methods:
      - name: Send
        params: p []byte
        recv: s HTTP1StreamValue
        results: error
      - name: End
        recv: s HTTP1StreamValue
        results: error
      - name: Deadline
        params: d time.Duration
        recv: s HTTP1StreamValue
        results: error
    name: HTTP1StreamValue
  - kind: named
    methods:
      - name: ServeHTTP1
        params: req *HTTP1RequestValue, res *HTTP1ResponseValue
        recv: f HTTP1HandlerFunc
    name: HTTP1HandlerFunc
    underlying: func(req *HTTP1RequestValue, res *HTTP1ResponseValue)
  - fields:
      - doc: subject holds the subject's bytes, the first n of them.
        name: subject
        type: "[HTTP1MaxSubject]byte"
      - doc: n is the subject's length.
        name: "n"
        type: uint8
      - doc: claims are the application's bits.
        name: claims
        type: uint64
    kind: struct
    methods:
      - name: SetSubject
        params: b []byte
        recv: a *HTTP1AuthValue
        results: bool
      - name: Subject
        recv: a *HTTP1AuthValue
        results: "[]byte"
      - name: SetClaims
        params: c uint64
        recv: a *HTTP1AuthValue
      - name: Claims
        recv: a *HTTP1AuthValue
        results: uint64
      - name: Reset
        recv: a *HTTP1AuthValue
    name: HTTP1AuthValue
  - fields:
      - doc: id holds the identifier's bytes, the first n of them.
        name: id
        type: "[HTTP1MaxRequestID]byte"
      - doc: n is the identifier's length.
        name: "n"
        type: uint8
    kind: struct
    methods:
      - name: Set
        params: b []byte
        recv: v *HTTP1RequestIDValue
        results: bool
      - name: Bytes
        recv: v *HTTP1RequestIDValue
        results: "[]byte"
      - name: Reset
        recv: v *HTTP1RequestIDValue
    name: HTTP1RequestIDValue
  - kind: named
    name: HTTP1AccessStage
    underlying: uint8
  - fields:
      - doc: Lane is the request's lane.
        name: Lane
        type: int
      - doc: Route is the route a router link matched, zero for none.
        name: Route
        type: int
      - doc: Method is the request method.
        name: Method
        type: "[]byte"
      - doc: Path is the request's canonical path, without its query.
        name: Path
        type: "[]byte"
      - doc: |-
          Status is the answer's status code, 200 when the handler left it zero;
          zero for an answer still deferred.
        name: Status
        type: int
      - doc: BodyLen is the length of the answer's body.
        name: BodyLen
        type: int
      - doc: Authenticated reports whether an authenticating link verified the request.
        name: Authenticated
        type: bool
      - doc: |-
          TraceID is the trace the request joined, read from its traceparent by a
          Trace link in the same chain; the zero value without one.
        name: TraceID
        type: trace.TraceID
      - doc: |-
          Stage says what the record is: an answer written, one deferred or pending
          and so with no status yet, or a deferred answer's completion.
        name: Stage
        type: HTTP1AccessStage
      - doc: |-
          ID is the request's number (HTTP1RequestValue.ID): what a sampling decision
          or a slow-request record is keyed on, the same on both records of a deferred
          answer.
        name: ID
        type: uint64
      - doc: |-
          Elapsed is the time from the batch's start to this record, the wait behind
          the batch's earlier requests included; on a deferred answer's second record
          the time since it was deferred.
        name: Elapsed
        type: DurationValue
      - doc: |-
          RequestID is the request's correlation identifier, the one its answer
          carries in X-Request-Id; empty without a RequestID link in the chain.
        name: RequestID
        type: HTTP1RequestIDValue
      - doc: Proto is the request's HTTP major version, 1 or 2.
        name: Proto
        type: uint8
      - doc: Stream is the HTTP/2 stream the request arrived on, zero on HTTP/1.1.
        name: Stream
        type: uint32
      - doc: NFields is how many entries of Fields the record filled.
        name: NFields
        type: int
      - doc: |-
          Fields holds the allowed request fields the request carried, in the order
          the link was given their names.
        name: Fields
        type: "[HTTP1MaxAccessFields]HTTP1FieldValue"
    kind: struct
    name: HTTP1AccessValue
  - fields:
      - doc: certs holds the parsed keypair; empty for a client that only verifies.
        name: certs
        type: "[]tls.Certificate"
      - doc: roots verifies the peer; nil means "use the platform trust store".
        name: roots
        type: "*x509.CertPool"
      - doc: clientCAs verifies client certificates on a server identity.
        name: clientCAs
        type: "*x509.CertPool"
      - doc: serverName overrides the verified peer name.
        name: serverName
        type: string
      - doc: minVersion is the resolved TLS floor, never zero after construction.
        name: minVersion
        type: uint16
      - doc: nextProtos is the ALPN list.
        name: nextProtos
        type: "[]string"
      - doc: requireClientCert promotes a server identity to mutual TLS.
        name: requireClientCert
        type: bool
    kind: struct
    methods:
      - name: String
        recv: i IdentityValue
        results: string
      - name: GoString
        recv: i IdentityValue
        results: string
      - name: IsZero
        recv: i IdentityValue
        results: bool
      - name: ClientConfig
        recv: i IdentityValue
        results: "*tls.Config"
      - name: ServerConfig
        recv: i IdentityValue
        results: "*tls.Config"
      - doc: |-
          clonedRoots copies the peer-verification pool so one configuration's AddCert
          cannot reach another's. A nil pool means "use the platform trust store" and
          stays nil, which is deliberately distinct from an empty pool trusting nothing.
        name: clonedRoots
        recv: i IdentityValue
        results: "*x509.CertPool"
      - doc: clonedClientCAs copies the client-certificate pool for the same reason.
        name: clonedClientCAs
        recv: i IdentityValue
        results: "*x509.CertPool"
      - doc: |-
          resolvedMinVersion never returns zero, so a zero-value identity still pins a
          modern floor instead of inheriting the stdlib default.
        name: resolvedMinVersion
        recv: i IdentityValue
        results: uint16
    name: IdentityValue
  - fields:
      - doc: |-
          CertFile is the PEM leaf certificate followed by any intermediates.
          Supplying it without KeyFile is always a configuration slip, never an
          intention, and is refused: an mTLS client that silently degrades to plain
          TLS is a security hole that reports nothing.
        name: CertFile
        type: string
      - doc: KeyFile is the PEM private key matching CertFile.
        name: KeyFile
        type: string
      - doc: |-
          RootsFile is the PEM CA bundle used to verify the peer. Leaving it empty
          selects the platform trust store, which is right for a public endpoint and
          wrong for a private PKI.
        name: RootsFile
        type: string
      - doc: |-
          ClientCAFile is the PEM CA bundle a server accepts client certificates
          from. Required whenever RequireClientCert is set.
        name: ClientCAFile
        type: string
      - doc: |-
          ServerName overrides the name verified against the peer certificate.

          This is far more often required than its "optional" typing suggests. Any
          deployment reached through a port forward or a tunnel connects to
          127.0.0.1 while the peer certificate names the real service, and the
          handshake then fails every single time until ServerName is set. Treat it
          as mandatory whenever the dial address is not the certificate's name.
        name: ServerName
        type: string
      - doc: |-
          MinVersion is the lowest accepted TLS version. Zero selects TLS 1.3;
          anything below TLS 1.2 is refused.
        name: MinVersion
        type: uint16
      - doc: NextProtos is the ALPN protocol list, e.g. {"h2", "http/1.1"}.
        name: NextProtos
        type: "[]string"
      - doc: RequireClientCert turns a server identity into mutual TLS.
        name: RequireClientCert
        type: bool
    kind: struct
    name: IdentityFileParams
  - fields:
      - doc: |-
          CertPEM is the PEM-encoded leaf certificate followed by any intermediates.
          Paired with KeyPEM; supplying one without the other is an error.
        name: CertPEM
        type: "[]byte"
      - doc: KeyPEM is the PEM-encoded private key matching CertPEM.
        name: KeyPEM
        type: "[]byte"
      - doc: |-
          RootsPEM is the PEM-encoded CA bundle used to verify the peer. When empty
          the platform trust store is used, which is the right default for a public
          endpoint and the wrong one for a private PKI.
        name: RootsPEM
        type: "[]byte"
      - doc: |-
          ClientCAPEM is the PEM-encoded CA bundle a server accepts client
          certificates from. It is meaningless on a client identity.
        name: ClientCAPEM
        type: "[]byte"
      - doc: |-
          ServerName overrides the name verified against the peer certificate. It is
          required when connecting to a host by IP whose certificate names a DNS name.
        name: ServerName
        type: string
      - doc: |-
          MinVersion is the lowest accepted TLS version. Zero selects TLS 1.3;
          anything below TLS 1.2 is refused outright.
        name: MinVersion
        type: uint16
      - doc: NextProtos is the ALPN protocol list, e.g. {"h2", "http/1.1"}.
        name: NextProtos
        type: "[]string"
      - doc: |-
          RequireClientCert turns a server identity into mutual TLS: the peer must
          present a certificate that chains to ClientCAPEM.
        name: RequireClientCert
        type: bool
    kind: struct
    name: IdentityParams
  - fields:
      - doc: |-
          MaxConns caps concurrent connections in the group. Beyond it, a new
          connection is accepted and immediately closed with ConnLimitReached, which
          is kinder than letting the accept queue silently overflow.
        name: MaxConns
        type: int
      - doc: |-
          ReadBufferSize sizes the per-connection scratch buffer returned by
          Conn.Buffer.
        name: ReadBufferSize
        type: int
      - doc: |-
          MaxPacketSize is the largest datagram accepted. A larger one is DROPPED
          and counted in StateValue.OversizedPackets, never delivered truncated:
          the kernel discards the tail, so the prefix that survives reads exactly
          like a complete message and the handler cannot tell the difference.
        name: MaxPacketSize
        type: int
      - doc: |-
          Backlog is the depth the kernel queues established connections at, before the
          accept loop takes them (#978). Zero keeps the standard library's, the host's
          somaxconn; the kernel clamps a larger value to it, and State says so. A
          stream group sets it with the Backlog option, on both engines; Windows
          keeps the platform's own.
        name: Backlog
        type: int
      - doc: |-
          ReceiveBuffer is the receive buffer, in bytes, the kernel is asked for on
          the group's sockets, before bind (SO_RCVBUF): a datagram group's, a stream
          group's listeners and so the sockets they accept (#973). Zero keeps the
          kernel's default. The kernel doubles the value and clamps it to rmem_max;
          State reports what it holds, in ListenerStateValue.ReceiveBuffer, and a
          clamp is no fault.
        name: ReceiveBuffer
        type: int
      - doc: |-
          SendBuffer is the send buffer, in bytes, asked as ReceiveBuffer is
          (SO_SNDBUF, clamped to wmem_max).
        name: SendBuffer
        type: int
      - doc: |-
          Shards is the number of independent listeners to open on one address with
          SO_REUSEPORT, each with its own accept loop, to remove accept contention.
          Zero selects the platform default.
        name: Shards
        type: int
      - doc: |-
          BatchSize is how many datagrams to read per syscall. Zero selects the
          default; one disables batching.
        name: BatchSize
        type: int
    kind: struct
    name: LimitsValue
  - fields:
      - doc: Ring is the ring, inside its loop, that holds the connection.
        name: Ring
        type: uint32
      - doc: Slot is the connection's index in the ring's table.
        name: Slot
        type: uint32
      - doc: |-
          Gen is the slot's generation. It is never zero for a live connection, so
          the zero LoopConnRef is stale on every loop.
        name: Gen
        type: uint32
    kind: struct
    name: LoopConnRef
  - kind: named
    name: PostFunc
    underlying: func(io LoopIO, arg uintptr)
  - kind: named
    methods:
      - name: String
        recv: k OptionKind
        results: string
    name: OptionKind
    underlying: uint8
  - fields:
      - doc: Protocols is the group's Protocols list, nil when the group gave none.
        name: Protocols
        type: "[]string"
      - doc: HTTP2Off is set when KITSUNIUM_NET_DISABLE switched http2-loop off.
        name: HTTP2Off
        type: bool
      - doc: HTTP2 is the HTTP2 option's bounds, the zero value when the group gave none.
        name: HTTP2
        type: corehttp2.LimitsValue
    kind: struct
    name: LoopHTTPValue
  - fields:
      - doc: HTTP1Requests counts the HTTP/1.1 requests served.
        name: HTTP1Requests
        type: uint64
      - doc: HTTP2Requests counts the HTTP/2 requests served.
        name: HTTP2Requests
        type: uint64
      - doc: HTTP2Errors counts the HTTP/2 errors by type, a row for each counted.
        name: HTTP2Errors
        type: "[]corehttp2.ErrorCountValue"
    kind: struct
    name: HTTPCountsValue
  - fields:
      - doc: next is the handler the layer wraps.
        name: next
        type: LoopHandler
    kind: struct
    methods:
      - name: Next
        recv: l LoopLayer
        results: LoopHandler
      - name: OnOpen
        params: io LoopIO, ref LoopConnRef
        recv: l LoopLayer
      - name: OnData
        params: io LoopIO, ref LoopConnRef, buf []byte
        recv: l LoopLayer
        results: int
      - name: OnTimeout
        params: io LoopIO, ref LoopConnRef
        recv: l LoopLayer
      - name: OnWritable
        params: io LoopIO, ref LoopConnRef
        recv: l LoopLayer
      - name: OnBatchEnd
        params: io LoopIO
        recv: l LoopLayer
      - name: OnClose
        params: io LoopIO, ref LoopConnRef, err error
        recv: l LoopLayer
      - name: Honours
        params: k OptionKind
        recv: l LoopLayer
        results: bool
      - name: OnStart
        params: lanes int
        recv: l LoopLayer
      - name: OnDrain
        params: io LoopIO, ref LoopConnRef
        recv: l LoopLayer
    name: LoopLayer
  - fields:
      - doc: Ref is the connection the job answers.
        name: Ref
        type: LoopConnRef
      - doc: Slot is the sender's index of the job's state.
        name: Slot
        type: uint32
      - doc: Gen is the generation of that slot when the job was sent.
        name: Gen
        type: uint32
      - doc: Arg is the sender's own argument.
        name: Arg
        type: uint64
    kind: struct
    name: LoopJobValue
  - fields:
      - doc: Lanes are the lanes' outbounds, by lane.
        name: Lanes
        type: "[]LoopOutbound"
      - doc: OutputCap is LoopValue.OutputCap, its default applied.
        name: OutputCap
        type: int
    kind: struct
    name: LoopOutboundValue
  - fields:
      - doc: UID is the peer's user id.
        name: UID
        type: uint32
      - doc: GID is the peer's group id.
        name: GID
        type: uint32
      - doc: PID is the peer's process id.
        name: PID
        type: uint32
      - doc: Verified is true when the kernel named the peer.
        name: Verified
        type: bool
    kind: struct
    name: LoopPeerValue
  - fields:
      - doc: Loop is the loop's index in its group.
        name: Loop
        type: int
      - doc: Ring is the ring's index in its loop.
        name: Ring
        type: int
      - doc: Conns is the number of connections the ring holds now.
        name: Conns
        type: int64
      - doc: Accepted is the number of connections the ring accepted.
        name: Accepted
        type: uint64
      - doc: Closed is the number of connections the ring closed.
        name: Closed
        type: uint64
      - doc: Batches is the number of loop iterations that reaped this ring.
        name: Batches
        type: uint64
      - doc: Completions is the number of completions or events the ring reaped.
        name: Completions
        type: uint64
      - doc: |-
          BufferStarved is the number of receives that found no provided buffer
          (ENOBUFS) and waited for one to come back.
        name: BufferStarved
        type: uint64
      - doc: |-
          EnterRetries is the number of times submitting to the kernel was retried
          after it was busy — the completion queue full, typically.
        name: EnterRetries
        type: uint64
      - doc: |-
          AcceptPauses is the number of times the ring stopped accepting: the
          descriptor reserve reached, or the process out of descriptors.
        name: AcceptPauses
        type: uint64
      - doc: Evicted is the number of idle connections closed to admit others.
        name: Evicted
        type: uint64
      - doc: |-
          WatchdogFires is the number of times the liveness watchdog saw a stall it
          could observe and acted on it.
        name: WatchdogFires
        type: uint64
      - doc: |-
          BatchesCut is the number of batches BatchBudget stopped while this ring
          still had completions to reap (ADR 0206).
        name: BatchesCut
        type: uint64
      - doc: BytesIn is the number of bytes the ring received and delivered to the handler.
        name: BytesIn
        type: uint64
      - doc: |-
          BytesOut is the number of bytes the ring sent: the answers the kernel took, a short
          send counted as it left.
        name: BytesOut
        type: uint64
      - doc: |-
          OutputRefused is the number of Writes the ring refused with LoopOutputFull: the
          connection's output ceiling, or the slab's budget, reached.
        name: OutputRefused
        type: uint64
      - doc: |-
          SpillClosed is the number of connections the ring closed with LoopSpillFull:
          unconsumed input past SpillCap, or the slab's budget spent.
        name: SpillClosed
        type: uint64
      - doc: Timeouts is the number of deadlines of SetDeadline that fired (OnTimeout calls).
        name: Timeouts
        type: uint64
      - doc: IdleClosed is the number of connections the ring closed for IdleTimeout.
        name: IdleClosed
        type: uint64
      - doc: |-
          PendingOutput is the bytes written and not yet sent, a gauge: what the ring's
          connections still owe their peers at the last batch's end.
        name: PendingOutput
        type: int64
      - doc: |-
          Draining reports a ring the watchdog judged sick: it accepts nothing new
          and closes its connections as they fall idle.
        name: Draining
        type: bool
    kind: struct
    name: LoopRingStateValue
  - fields:
      - doc: Group is the loop group's name.
        name: Group
        type: string
      - doc: Backend is the backend in use.
        name: Backend
        type: LoopBackend
      - doc: |-
          ProbeStage names the last stage of the kernel probe the backend passed,
          or the stage that failed when the group fell back.
        name: ProbeStage
        type: string
      - doc: |-
          Degraded reports that the group runs on a backend other than the best one
          it asked for: auto fell back from io_uring, say.
        name: Degraded
        type: bool
      - doc: DegradedReason names the fallback and its cause when Degraded is set.
        name: DegradedReason
        type: string
      - doc: Loops is the number of loops running.
        name: Loops
        type: int
      - doc: |-
          LoopsSource says where Loops came from: "explicit", "auto" — LoopsAuto,
          GOMAXPROCS read at Start — or "single" when Loops was zero.
        name: LoopsSource
        type: string
      - doc: Rings is the number of rings per loop.
        name: Rings
        type: int
      - doc: |-
          RingsSource says where Rings came from: "explicit", "derived" from the
          connection bounds and the descriptor limit, or "single" when no bound was
          set or the backend runs one ring.
        name: RingsSource
        type: string
      - doc: |-
          RLimitNoFile is the effective RLIMIT_NOFILE soft limit read at Start. The
          SDK never raises it; the Go runtime already lifts the soft limit to the
          hard one.
        name: RLimitNoFile
        type: uint64
      - doc: GOMAXPROCS is runtime.GOMAXPROCS(0) read at Start. The SDK never sets it.
        name: GOMAXPROCS
        type: int
      - doc: |-
          BatchP99 is the 99th percentile of one loop iteration's duration, over the
          loops' recent batches.
        name: BatchP99
        type: DurationValue
      - doc: |-
          OutboundRefused counts the jobs a full queue to a worker refused
          (LoopOutboundFull), every lane's: for the http1 adapter, the 503s it
          answered for them. Zero when the group offloads nothing.
        name: OutboundRefused
        type: uint64
      - doc: |-
          SlabInUse is the bytes of the spill and output chunks every loop's slab holds at
          the last batches' end, chunk sizes counted, a gauge.
        name: SlabInUse
        type: int64
      - doc: |-
          SlabMapped is the bytes every loop's slab has mapped outside the Go heap. A size
          class keeps one wholly free arena and unmaps the others on the loop's tick
          (#809), so it falls back after a burst.
        name: SlabMapped
        type: int64
      - doc: |-
          SlabBudget is the ceiling of SlabInUse, every loop's summed: past it a Write is
          refused and a spill closes its connection, by name, never by the kernel's OOM
          killer.
        name: SlabBudget
        type: int64
      - doc: |-
          SlabBudgetSource says where each loop's slab budget came from (#809):
          "explicit" for LoopValue.SlabBudget, "derived" from the cgroup allowance
          memlimit read, "default" for 128 MiB a loop; empty on the portable
          backend, which has no slab.
        name: SlabBudgetSource
        type: string
      - doc: RingStates reports every ring of every loop, loop by loop.
        name: RingStates
        type: "[]LoopRingStateValue"
      - doc: |-
          Capabilities reports every optional kernel capability the group's backend
          probed or was told not to, the server's socket probes merged in
          (ADR 0189).
        name: Capabilities
        type: "[]CapabilityValue"
    kind: struct
    name: LoopStateValue
  - kind: named
    methods:
      - name: String
        recv: b LoopBackend
        results: string
    name: LoopBackend
    underlying: uint8
  - fields:
      - doc: |-
          Backend is the mechanic to run on. LoopBackendAuto takes the best one the
          platform's probe reaches and reports any fallback in State; an explicit
          backend the platform cannot run is refused at Start.
        name: Backend
        type: LoopBackend
      - doc: |-
          Loops is the number of loops, each one goroutine locked to its OS thread
          on a native backend. Zero selects one; LoopsAuto selects GOMAXPROCS less
          one, at least one, read once at Start. The SDK never sets GOMAXPROCS:
          sizing the process against its loops is the consumer's policy, and State
          reports both. A native loop yields to the Go scheduler every 5 ms of
          serving while GOMAXPROCS exceeds the group's loops (ADR 0199).
        name: Loops
        type: int
      - doc: |-
          Rings is the number of descriptor shards inside one loop, each with its
          own table of at most min(RLIMIT_NOFILE, IORING_MAX_FIXED_FILES) entries:
          what lets io_uring serve more connections than RLIMIT_NOFILE. Zero
          derives it, ⌈max(MaxConns, SoftConns) / min(RLIMIT_NOFILE,
          IORING_MAX_FIXED_FILES)⌉, and one when both are zero; that is the only
          formula, and State says where the value came from. epoll and the portable
          backend run one ring whatever it says.
        name: Rings
        type: int
      - doc: |-
          CQBatch bounds the completions or events one loop iteration reaps before
          it calls OnBatchEnd. Zero selects the domain default.
        name: CQBatch
        type: int
      - doc: |-
          SpillCap is the most unconsumed input, in bytes, one connection may hold
          between OnData calls. Past it the connection is closed with
          LoopSpillFull. Zero selects the domain default. It is the ceiling on a
          request's head and body together for an http1 handler that takes the
          body whole (a LoopSpillChecker adapts to it at Start); an
          HTTP1BodyReader's spill holds only the head.
        name: SpillCap
        type: int
      - doc: |-
          OutputCap is the most written and unsent output, in bytes, one
          connection may hold. A Write past it is refused with LoopOutputFull. Zero
          selects the domain default.
        name: OutputCap
        type: int
      - doc: |-
          SoftConns is the soft connection bound: a connection accepted while the
          group serves more is flagged under pressure (LoopIO.Pressure), so a
          protocol can ask its peer to leave. It refuses nothing; MaxConns does.
          Zero sets no soft bound.
        name: SoftConns
        type: int
      - doc: |-
          EvictIdle is how long a connection must have been idle before the loop
          may close it to admit another under hard pressure — the process out of
          descriptors, or MaxConns reached. A connection with unread bytes is
          never evicted. Zero evicts nothing.
        name: EvictIdle
        type: DurationValue
      - doc: |-
          Capabilities opts the group into kernel capabilities of class A-code
          (ADR 0189). Each is probed and used where the kernel has it, reported
          "missing" and as a fault where it does not, and never used once
          KITSUNIUM_NET_DISABLE names it. An engine, a class B capability or an
          unknown token is refused at Start with LoopCapabilityRefused. Nil asks
          for none; the class A-kernel capabilities need no opt-in.
        name: Capabilities
        type: "[]Capability"
      - doc: |-
          Outbound is how many jobs one lane's queue to its worker holds (R3),
          when the group's handler offloads (LoopOffloader). A Send past it is
          refused with LoopOutboundFull and counted in LoopStateValue. Zero
          selects 256.
        name: Outbound
        type: int
      - doc: |-
          BatchWait bounds how long an io_uring loop holds its wait for
          BatchWaitMin completions while it is loaded: its previous batch reaped
          at least four, or two receives carrying bytes at least come within the
          bound at the rate they arrive. A loaded loop so serves larger batches for fewer
          wakeups (ADR 0199, ADR 0202). It
          bounds each grouped wait, not a request's latency: a request read over
          several batches may meet one at each. Zero selects 250 µs,
          a negative value turns the grouped wait off, and anything past the 10 ms
          tick is the tick. epoll and the portable backend ignore it.
        name: BatchWait
        type: DurationValue
      - doc: |-
          BatchWaitMin is how many completions the grouped wait waits for before
          BatchWait runs out. Zero selects 32; past CQBatch it is CQBatch.
        name: BatchWaitMin
        type: int
      - doc: |-
          BatchBudget bounds how long an io_uring loop reaps completions in one
          batch: past it, a ring stops reaping, and a ring after it reaps at most one
          more lot of 16 before it stops too — a bounded overrun, not a hard stop.
          What is left waits for the next batch, which starts at the ring it stopped
          at and does not wait. A
          request is answered once its batch ends, after OnBatchEnd, so a batch of
          thousands of requests holds every answer for its whole length (ADR 0206).
          A batch that ran past half of it hands its answers to the kernel at once
          instead of at the next wait. Zero, or a negative value, bounds nothing:
          the batch reaps up to four CQBatch a ring, as before. epoll and the
          portable backend ignore it.
        name: BatchBudget
        type: DurationValue
      - doc: |-
          SendZCMin is the smallest flight an io_uring loop sends zero-copy, in
          bytes, once the group opted into uring-send-zc (#969): a flight of at least
          that many bytes leaves by IORING_OP_SEND_ZC and its slab chunk stays the
          kernel's until the notification says the pages are free, a shorter one by
          IORING_OP_SEND as before. Zero selects 16 KiB; a negative value is refused
          with LoopValueInvalid. epoll and the portable backend ignore it, and so
          does a group that did not opt in.
        name: SendZCMin
        type: int
      - doc: |-
          Affinity pins each loop's thread to one CPU, Affinity[i] for loop i, with
          sched_setaffinity once the thread is locked (loop-affinity, class A-code,
          #857). Nil pins nothing; otherwise it names one CPU per loop, from 0 to
          8191, or Start refuses it with LoopValueInvalid. A CPU the kernel refuses —
          offline, outside the process's set, or a seccomp filter — leaves that loop
          unpinned, serving, and the row missing, a fault. With Shards(0) and
          so-incoming-cpu opted into, each loop's listener asks the kernel for the
          connections its CPU received. The portable backend ignores it.
        name: Affinity
        type: "[]int"
      - doc: |-
          NotsentLowat is TCP_NOTSENT_LOWAT, in bytes, on the group's TCP listeners,
          inherited by each accepted socket (tcp-notsent-lowat, class A-code, Linux
          3.12, #857): the kernel takes at most that many unsent bytes, so a write
          is short and OnWritable fires once the peer drained, not once megabytes
          of socket buffer emptied. Zero sets nothing unless Capabilities opts into
          tcp-notsent-lowat, which selects 128 KiB; a positive value opts in;
          negative is refused with LoopValueInvalid. The portable backend ignores it.
        name: NotsentLowat
        type: int
      - doc: |-
          SlabBudget is the most payload memory, in bytes, one loop maps outside the
          Go heap for its connections' spill and output together (#809): past it a
          Write is refused with LoopOutputFull and a spill closes its connection
          with LoopSpillFull. Zero derives it from the cgroup allowance the server
          reads with memlimit, a quarter of the allowance shared by the loops and
          at most 128 MiB, and is 128 MiB where no allowance is found; negative is
          refused with LoopValueInvalid. A size class's wholly free arenas past the
          first are unmapped on the loop's tick. The portable backend ignores it.
        name: SlabBudget
        type: int
      - doc: |-
          BusyPoll is busy-poll's window (class A-code, #979): how long a loop's wait
          polls the device queues of its sockets before it sleeps, io_uring's
          busy_poll_to and epoll's busy_poll_usecs, rounded up to whole
          microseconds. Zero selects 50 µs once Capabilities opts into busy-poll; it
          opts nothing in by itself. Negative, or past one second, is refused with
          LoopValueInvalid. The portable backend ignores it.
        name: BusyPoll
        type: DurationValue
      - doc: |-
          BusyPollBudget is how many packets one poll of busy-poll may take, epoll's
          busy_poll_budget: zero is the kernel's, and past 64 the kernel asks for
          CAP_NET_ADMIN, its refusal reading the row missing. Negative, or past
          65535, is refused with LoopValueInvalid. io_uring always takes the
          kernel's; the portable backend ignores it.
        name: BusyPollBudget
        type: int
      - doc: |-
          ZCRX names the NIC receive queue uring-zcrx would serve (class B, #980). A
          zero Interface keeps the row off. While the row is class B a named queue
          is only probed — registered on a throwaway ring that is closed at once,
          the kernel's answer in the row's reason — and no byte is received through
          it.
        name: ZCRX
        type: ZCRXValue
    kind: struct
    name: LoopValue
  - fields:
      - doc: Interface is the network interface's name; empty names none.
        name: Interface
        type: string
      - doc: |-
          Queue is the index of the interface's receive queue; negative is refused
          with LoopValueInvalid.
        name: Queue
        type: int
      - doc: |-
          AreaBytes is the size of the area the kernel lands payloads in, rounded up
          to whole pages: zero selects 4 MiB, negative is refused with
          LoopValueInvalid.
        name: AreaBytes
        type: int
    kind: struct
    name: ZCRXValue
  - kind: named
    name: Middleware
    typeParams: H any
    underlying: func(next H) H
  - kind: named
    methods:
      - name: ServePacket
        params: ctx context.Context, p Packet
        recv: f PacketHandlerFunc
        results: error
    name: PacketHandlerFunc
    underlying: func(ctx context.Context, p Packet) error
  - kind: named
    methods:
      - name: String
        recv: p Phase
        results: string
    name: Phase
    underlying: uint8
  - kind: named
    methods:
      - name: Allow
        params: req RequestValue
        recv: f PolicyFunc
        results: error
    name: PolicyFunc
    underlying: func(req RequestValue) error
  - fields:
      - doc: |-
          Trusted lists the CIDRs of the balancers. Empty, or a range that does not
          parse, fails Start with OptionValueInvalid.
        name: Trusted
        type: "[]string"
      - doc: |-
          Timeout bounds the header's arrival, on the server's clock. Zero selects
          3 s; a negative value fails Start with OptionValueInvalid.
        name: Timeout
        type: DurationValue
    kind: struct
    name: ProxyProtocolValue
  - fields:
      - doc: |-
          Status is the HTTP status code. It is set even when the call also returns
          an error, so a caller can tolerate a specific status deliberately.
        name: Status
        type: int
      - doc: Header is the response header set.
        name: Header
        type: http.Header
      - doc: |-
          Body is the fully-read response body, already bounded by the client's
          size cap. It is nil for a status that carries no body, such as 204.
        name: Body
        type: "[]byte"
    kind: struct
    name: ResponseValue
  - fields:
      - doc: Method is the uppercase HTTP method, e.g. "GET".
        name: Method
        type: string
      - doc: Scheme is the URL scheme, e.g. "https".
        name: Scheme
        type: string
      - doc: |-
          Host is the authority, host[:port]. It is carried because a policy that
          sees only the path cannot defend against a redirect that keeps the path
          and swaps the origin.
        name: Host
        type: string
      - doc: |-
          EscapedPath is the percent-encoded path exactly as it will be sent. It is
          never the decoded form — see the type comment.
        name: EscapedPath
        type: string
      - doc: RawQuery is the encoded query string, without the leading "?".
        name: RawQuery
        type: string
    kind: struct
    name: RequestValue
  - fields:
      - doc: |-
          ID is the frame's "id" field. A client stores the last non-empty id it
          saw and sends it back as Last-Event-ID when it reconnects, so this is the
          resume token — and it is the CALLER's to mint, because only the caller
          knows what it means. Empty emits no id field, which leaves the client's
          stored id untouched; that is the format's own behaviour, not an omission.
          An id carrying U+0000 is refused with SSEFieldInvalid, as one carrying a
          line terminator is: a client ignores such an id field (WHATWG HTML,
          "process the field"), so its stored resume token would silently stay the
          previous one.
        name: ID
        type: string
      - doc: |-
          Name is the frame's "event" field — the event type the client dispatches
          under. Empty means the default type, "message".
        name: Name
        type: string
      - doc: |-
          Data is the payload. Every line terminator it carries (LF, CR or CRLF)
          becomes a separate "data:" line, which the client rejoins with "\n". A
          payload that mixed terminators therefore arrives normalised to LF: the
          value is preserved, its byte spelling is not.
        name: Data
        type: string
      - doc: |-
          Retry is the reconnection delay hint, emitted as an integer millisecond
          count. Zero emits no retry field.
        name: Retry
        type: DurationValue
    kind: struct
    methods:
      - name: IsZero
        recv: e SSEEventValue
        results: bool
      - name: Validate
        recv: e SSEEventValue
        results: error
    name: SSEEventValue
  - fields:
      - doc: Phase is where the server sits in its lifecycle.
        name: Phase
        type: Phase
      - doc: Listeners describes every bound listener, including any degradation.
        name: Listeners
        type: "[]ListenerStateValue"
      - doc: ActiveConns is the number of connections currently being served.
        name: ActiveConns
        type: int64
      - doc: TotalConns is the number accepted since the server started.
        name: TotalConns
        type: uint64
      - doc: RejectedConns is the number turned away by the connection ceiling.
        name: RejectedConns
        type: uint64
      - doc: |-
          OversizedPackets is the number of datagrams dropped for passing their
          group's MaxPacketSize. They are counted rather than delivered because the
          kernel has already discarded the tail, and the prefix that survives is
          indistinguishable from a complete message to the handler receiving it. A
          read loop has nobody to return an error to, so this counter is the report.
        name: OversizedPackets
        type: uint64
      - doc: |-
          AcceptBackoffs is the number of times an accept loop waited after Accept
          failed with anything but its listener closing — the process out of file
          descriptors, typically, with connections still queued. Retrying at once
          would spin a core per listener while the condition lasts; each wait is
          5 ms, doubling to 1 s, and the next accepted connection starts the curve
          over. A count that keeps rising is a server that cannot accept.
        name: AcceptBackoffs
        type: uint64
      - doc: |-
          SuppressedLogs counts the lines of net/http's own log the server did not
          write: over the cap of ten records a second, or with no logger to write
          them to (WithLogger). A count that rises is a port being probed, or a
          handler that panics.
        name: SuppressedLogs
        type: uint64
      - doc: Datagrams counts what the batched datagram paths drop (ADR 0192).
        name: Datagrams
        type: DatagramStateValue
      - doc: |-
          Loops reports every loop group (ADR 0186 §D8). It is empty while the
          server serves none.
        name: Loops
        type: "[]LoopStateValue"
      - doc: |-
          Override reports what KITSUNIUM_NET_ENGINE and KITSUNIUM_NET_DISABLE did
          (ADR 0188).
        name: Override
        type: OverrideValue
      - doc: |-
          Faults lists everything the server runs without now, the degradations of
          Listeners and Loops included; Degraded is true when it is not empty.
        name: Faults
        type: "[]FaultValue"
      - doc: Fallbacks counts the engine fallbacks and keeps the last one.
        name: Fallbacks
        type: FallbacksValue
      - doc: Platform names the operating system, its release and the toolchain.
        name: Platform
        type: PlatformValue
    kind: struct
    methods:
      - name: Degraded
        recv: s StateValue
        results: bool
    name: StateValue
  - fields:
      - doc: Group is the listener group's name.
        name: Group
        type: string
      - doc: |-
          Address is the address actually bound, which for a port of zero is the
          one the kernel chose rather than the one requested.
        name: Address
        type: string
      - doc: Network is the socket family.
        name: Network
        type: string
      - doc: Shards is how many listeners were actually opened on this address.
        name: Shards
        type: int
      - doc: |-
          Degraded reports that a requested optimisation was unavailable and the
          server fell back. It is surfaced rather than logged once at startup,
          because a silent fallback is indistinguishable from a working one and
          nobody re-reads yesterday's logs to find out.
        name: Degraded
        type: bool
      - doc: DegradedReason names the fallback in plain words when Degraded is set.
        name: DegradedReason
        type: string
      - doc: |-
          Adopted reports a listener inherited from a supervisor rather than bound
          by this process.
        name: Adopted
        type: bool
      - doc: |-
          Exclusive reports that no other socket can bind the listener's address
          while it lives: SO_EXCLUSIVEADDRUSE on Windows, set on a unicast TCP or
          UDP socket this process binds and read back, never set, on an adopted
          one. It is false on every other platform, which has no such option.
        name: Exclusive
        type: bool
      - doc: |-
          BindWait is how long the bind waited for its address to come free: on
          Windows, a restarted server's address stays taken until the previous
          process's connections end, and the bind is retried, bounded. Zero when
          the first attempt bound.
        name: BindWait
        type: DurationValue
      - doc: H2C reports an HTTP group serving HTTP/2 in cleartext, by prior knowledge alone.
        name: H2C
        type: bool
      - doc: |-
          HTTP2 is the HTTP/2 bounds the group serves with, resolved: a group given
          none reads ADR 0195's numbers. Nil for a listener that serves no HTTP.
        name: HTTP2
        type: "*corehttp2.LimitsValue"
      - doc: |-
          MaxBodyBytes is the request-body bound an HTTP group served by net/http
          holds on this listener: the default's 1 MiB, the option's value, or -1
          for none. Zero on every other listener, which has no such bound.
        name: MaxBodyBytes
        type: int64
      - doc: |-
          Backlog is the depth of the listener's accept queue as applied: the
          Backlog option's value, or the host's somaxconn for the default, and the
          clamp when the host's somaxconn is below what was asked (Degraded, with
          its reason). Zero for an adopted socket, whose queue the supervisor sized,
          and for a datagram socket.
        name: Backlog
        type: int
      - doc: |-
          ReceiveBuffer is the socket's receive buffer as the kernel holds it,
          read back after bind, or after the group's size was applied to an
          adopted socket (SO_RCVBUF): on Linux twice what was asked, clamped to
          rmem_max, the kernel's default when nothing was asked. Zero where the
          platform cannot say. A clamp is reported here and is no fault.
        name: ReceiveBuffer
        type: int
      - doc: |-
          SendBuffer is the socket's send buffer as the kernel holds it, read back
          as ReceiveBuffer is (SO_SNDBUF, wmem_max).
        name: SendBuffer
        type: int
      - doc: |-
          ProxyRefused counts the connections a ProxyProtocol group refused — peers
          outside Trusted, and headers malformed or not finished within Timeout. It
          is the group's count, on each of its listeners' rows.
        name: ProxyRefused
        type: uint64
      - doc: |-
          HTTP1Requests counts the HTTP/1.1 requests the group served since Start
          (#966): one count per request on net/http's engine, one per batch on the
          loop engine, whose adapter counts them. It is the group's count, on each
          of its listeners' rows; zero on a group that serves no HTTP.
        name: HTTP1Requests
        type: uint64
      - doc: HTTP2Requests counts the HTTP/2 requests the group served, as HTTP1Requests does.
        name: HTTP2Requests
        type: uint64
      - doc: |-
          HTTP2Errors counts the group's HTTP/2 protocol errors by type, a row for
          each type counted at least once, in the vocabulary's order: on net/http's
          engine what its CountError reports, an unanswered PING included; on the
          loop engine each RST_STREAM and GOAWAY its codec answers with an error
          and each header list past its bound. net/http counts neither a header
          list past MaxHeaderBytes, which it answers 431 itself, nor a frame past
          its frame bound.
        name: HTTP2Errors
        type: "[]corehttp2.ErrorCountValue"
      - doc: |-
          ALPN is the protocol list a TLS HTTP group's listeners offer, in the
          order offered (#964): the group's versions intersected with its
          identity's NextProtos, on net/http's engine and on a TLS loop codec
          group alike. Nil for a group that negotiates nothing.
        name: ALPN
        type: "[]string"
    kind: struct
    name: ListenerStateValue
  - fields:
      - doc: |-
          TruncatedPackets is the number of messages dropped because the kernel cut
          them: a coalesced message past its buffer (MSG_TRUNC under UDP GRO), or a
          message whose control data did not fit (MSG_CTRUNC). Neither can be split
          into whole datagrams, so none of what survives is delivered.
        name: TruncatedPackets
        type: uint64
      - doc: |-
          GSOOversized is the number of GSO sends the kernel refused with EMSGSIZE:
          a sizing bug, counted, which leaves GSO on.
        name: GSOOversized
        type: uint64
      - doc: |-
          ReplyFailures is the number of replies a BatchReplies group queued during
          a batch that did not leave: Reply had already reported them sent.
        name: ReplyFailures
        type: uint64
      - doc: |-
          KernelDrops is the number of datagrams the kernel dropped before a read
          could see them, for want of room in a socket's receive buffer: the last
          SO_RXQ_OVFL count of each batched UDP socket, summed (#973). A gauge of the
          kernel's own counter, read from the messages that arrive, so a drop after
          the last message is seen with the next one. The kernel counts what it
          refused to queue, so under UDP GRO a coalesced message of N datagrams is
          one drop: the count then stands below the datagrams lost. Zero where the
          socket is not batched, and under KITSUNIUM_NET_DISABLE=udp-rxq-ovfl.
        name: KernelDrops
        type: uint64
      - doc: |-
          Capabilities reports the optional kernel capabilities of the datagram
          sockets — udp-rxq-ovfl and udp-pktinfo, and uring-multishot-recvmsg for the
          groups PacketGroup.HandleLoop serves — as a loop group's do: on, absent, disabled by the
          operator, or unprobed while no batched socket exists.
        name: Capabilities
        type: "[]CapabilityValue"
    kind: struct
    name: DatagramStateValue
  - fields:
      - doc: |-
          Source is "environment" when KITSUNIUM_NET_ENGINE or KITSUNIUM_NET_DISABLE
          is set to a non-empty value, and empty otherwise.
        name: Source
        type: string
      - doc: |-
          Raw is what was read, each variable set as NAME=value, separated by a
          space, in the order EnvEngine, EnvDisable.
        name: Raw
        type: string
      - doc: |-
          Applied is the highest engine the environment lets a group run on, after
          both variables; empty when nothing is set. A group runs on
          min(its code's choice, Applied), skipping what Disabled names.
        name: Applied
        type: Capability
      - doc: Disabled lists the engines KITSUNIUM_NET_DISABLE switched off.
        name: Disabled
        type: "[]Capability"
    kind: struct
    name: OverrideValue
  - fields:
      - doc: |-
          Source says what reported it: "listener", "loop", "ring", "stall",
          "capability", "gso" or "environment".
        name: Source
        type: string
      - doc: Group names the group concerned; empty for the environment.
        name: Group
        type: string
      - doc: Reason names the fault and, where one exists, the runbook's switch.
        name: Reason
        type: string
    kind: struct
    name: FaultValue
  - fields:
      - doc: Count is the number of fallbacks since the server was built.
        name: Count
        type: uint64
      - doc: LastGroup names the group of the last fallback.
        name: LastGroup
        type: string
      - doc: LastReason is the last fallback's reason.
        name: LastReason
        type: string
      - doc: LastAt is when the last fallback happened; zero when none did.
        name: LastAt
        type: time.Time
    kind: struct
    name: FallbacksValue
  - fields:
      - doc: GOOS is runtime.GOOS.
        name: GOOS
        type: string
      - doc: GOARCH is runtime.GOARCH.
        name: GOARCH
        type: string
      - doc: |-
          Kernel is the operating system's release as the platform reports it: the
          uname release on Linux, kern.osrelease on darwin and the BSDs,
          major.minor.build as GetVersion reports it on Windows; empty when it cannot
          be read, and on illumos and Solaris, where the standard library reads none.
        name: Kernel
        type: string
      - doc: Go is runtime.Version(), the toolchain the binary was built with.
        name: Go
        type: string
    kind: struct
    name: PlatformValue
  - kind: named
    name: SteerValue
    underlying: uint8
  - fields:
      - doc: Read bounds one read from the peer.
        name: Read
        type: DurationValue
      - doc: Write bounds one write to the peer.
        name: Write
        type: DurationValue
      - doc: Idle bounds how long a connection may sit with no traffic at all.
        name: Idle
        type: DurationValue
      - doc: |-
          Handshake bounds the TLS handshake, which is the phase a hostile peer can
          most cheaply stall. Unlike the others, zero here does NOT mean unbounded:
          the negotiation happens before any handler exists to notice it, so it
          falls back to the domain's default instead.
        name: Handshake
        type: DurationValue
      - doc: |-
          KeepAlive is the idle time before the first keepalive probe of an accepted
          socket, and the interval between probes: zero is 15 s, the standard
          library's, and negative sets none.
        name: KeepAlive
        type: DurationValue
      - doc: |-
          UserTimeout is TCP_USER_TIMEOUT, the time sent output may stay
          unacknowledged before the kernel closes the connection: zero is Write's
          bound when one is set, otherwise none.
        name: UserTimeout
        type: DurationValue
    kind: struct
    name: TimeoutsValue
  - kind: named
    methods:
      - name: Sendable
        recv: c WSCloseCode
        results: bool
      - name: Echoable
        recv: c WSCloseCode
        results: WSCloseCode
    name: WSCloseCode
    underlying: uint16
  - fields:
      - doc: |-
          Binary reports whether the payload is opaque bytes (opcode 0x2) rather
          than UTF-8 text (opcode 0x1). The zero value is text, which is the
          opcode a zero-valued frame would carry anyway.
        name: Binary
        type: bool
      - doc: |-
          Data is the reassembled payload. For a text message it is valid UTF-8,
          which the engine verifies on both the receiving and the sending side.
        name: Data
        type: "[]byte"
    kind: struct
    methods:
      - name: OpCode
        recv: m WSMessageValue
        results: WSOpCode
    name: WSMessageValue
  - kind: named
    methods:
      - name: IsControl
        recv: o WSOpCode
        results: bool
      - name: Defined
        recv: o WSOpCode
        results: bool
      - name: String
        recv: o WSOpCode
        results: string
    name: WSOpCode
    underlying: byte
vars:
  - doc: corsSafeMethods are the CORS-safelisted methods, a policy's default.
    items:
      - name: corsSafeMethods
        value: "[]string{\"GET\", \"HEAD\", \"POST\"}"
    name: corsSafeMethods
  - doc: |-
      The func adapters must satisfy the ports they exist to adapt; an adapter that
      drifts from its interface is useless and the drift is silent until call time.
      LoopLayer forwards every callback a layer may be asked for: it must stay a
      LoopHandler, and each optional capability, or a layer embedding it would
      stop forwarding one without a compile error.
    grouped: true
    items:
      - name: _
        type: ConnHandler
        value: ConnHandlerFunc(nil)
      - name: _
        type: PacketHandler
        value: PacketHandlerFunc(nil)
      - name: _
        type: HTTP1Handler
        value: HTTP1HandlerFunc(nil)
      - name: _
        type: LoopHandler
        value: LoopLayer{}
      - name: _
        type: LoopLayered
        value: LoopLayer{}
      - name: _
        type: LoopOptionHonourer
        value: LoopLayer{}
      - name: _
        type: LoopStarter
        value: LoopLayer{}
      - name: _
        type: LoopDrainer
        value: LoopLayer{}
    name: _
  - doc: |-
      optionNames holds each kind's constructor name, indexed by kind. Its length
      is pinned to the constant block by Test_OptionKind_String, so the two cannot fall
      out of step silently.
    items:
      - name: optionNames
        value: |-
          [...]string{
          	OptionNone:              "none",
          	OptionTLS:               "TLS",
          	OptionMiddleware:        "Use",
          	OptionReadTimeout:       "ReadTimeout",
          	OptionWriteTimeout:      "WriteTimeout",
          	OptionIdleTimeout:       "IdleTimeout",
          	OptionReadHeaderTimeout: "ReadHeaderTimeout",
          	OptionMaxHeaderBytes:    "MaxHeaderBytes",
          	OptionHandshakeTimeout:  "HandshakeTimeout",
          	OptionReadBufferSize:    "ReadBufferSize",
          	OptionMaxPacketSize:     "MaxPacketSize",
          	OptionBatchSize:         "BatchSize",
          	OptionShards:            "Shards",
          	OptionMaxConns:          "MaxConns",
          	OptionAdopt:             "Adopt",
          	OptionPreHandshake:      "PreHandshake",
          	OptionPlaintext:         "Plaintext",
          	OptionName:              "Name",
          	OptionEngine:            "Engine",
          	OptionLoopMiddleware:    "UseLoop",
          	OptionBatchReplies:      "BatchReplies",
          	OptionProtocols:         "Protocols",
          	OptionMaxBodyBytes:      "MaxBodyBytes",
          	OptionBacklog:           "Backlog",
          	OptionReceiveBuffer:     "ReceiveBuffer",
          	OptionSendBuffer:        "SendBuffer",
          	OptionProxyProtocol:     "ProxyProtocol",
          	OptionSteer:             "Steer",
          	OptionKeepAlive:         "KeepAlive",
          	OptionUserTimeout:       "UserTimeout",
          	OptionHTTP2:             "HTTP2",
          }
    name: optionNames
  - doc: |-
      PolicyFunc must satisfy Policy: the adapter is useless if it drifts from the
      port it exists to adapt.
    items:
      - name: _
        type: Policy
        value: PolicyFunc(nil)
    name: _#2
