# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      EnvEngine is the variable that caps every group's engine at one capability of
      the lattice: min(code, environment), never above the code's choice.
    items:
      - name: EnvEngine
        type: string
        value: "\"KITSUNIUM_NET_ENGINE\""
    name: EnvEngine
  - doc: |-
      EnvDisable is the variable that switches engines off, a comma-separated list of
      capabilities the operator may switch off.
    items:
      - name: EnvDisable
        type: string
        value: "\"KITSUNIUM_NET_DISABLE\""
    name: EnvDisable
  - doc: The engines an operator may switch off with KITSUNIUM_NET_DISABLE (ADR 0188).
    grouped: true
    items:
      - doc: |-
          CapabilityIOURing is io_uring, the top of the lattice. Switched off, or capped
          below, no loop group calls io_uring_setup.
        name: CapabilityIOURing
        type: Capability
        value: "\"iouring\""
      - doc: |-
          CapabilityEpoll is epoll, below io_uring. Switched off, a loop group that would
          have fallen back to it runs on the portable backend.
        name: CapabilityEpoll
        type: Capability
        value: "\"epoll\""
      - doc: |-
          CapabilityKqueue is kqueue, at epoll's rank on darwin and the BSDs (ADR 0222).
          Switched off, or capped below, a loop group there runs on the portable backend
          and no kqueue is probed.
        name: CapabilityKqueue
        type: Capability
        value: "\"kqueue\""
    name: CapabilityIOURing
  - doc: The floors of the lattice, which KITSUNIUM_NET_ENGINE may name and nothing switches off (ADR 0188).
    grouped: true
    items:
      - doc: |-
          CapabilityPortable is the portable loop backend, the loop family's floor on
          every platform, and what an unknown token caps the engine at.
        name: CapabilityPortable
        type: Capability
        value: "\"portable\""
      - doc: |-
          CapabilityGoroutine is the goroutine engine, the bottom of the lattice. A loop
          handler capped at it runs on the portable backend, the lowest engine that can
          serve one.
        name: CapabilityGoroutine
        type: Capability
        value: "\"goroutine\""
    name: CapabilityPortable
  - doc: The class A-kernel capabilities, on once probed, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
    grouped: true
    items:
      - doc: |-
          CapabilityURingMultishotRecv is io_uring's multishot receive. Switched off,
          every receive is single-shot and re-armed after each completion.
        name: CapabilityURingMultishotRecv
        type: Capability
        value: "\"uring-multishot-recv\""
      - doc: |-
          CapabilityURingPbuf is io_uring's provided-buffer ring. The io_uring backend
          receives into nothing else: switched off, io_uring is never set up and the group
          runs on epoll.
        name: CapabilityURingPbuf
        type: Capability
        value: "\"uring-pbuf\""
      - doc: |-
          CapabilityURingPbufInc is the provided-buffer ring consumed incrementally
          (IOU_PBUF_RING_INC, 6.12): a buffer serves recv after recv, each from where the
          last stopped (ADR 0204). Switched off, or refused by the kernel, each recv takes
          a whole buffer.
        name: CapabilityURingPbufInc
        type: Capability
        value: "\"uring-pbuf-inc\""
      - doc: |-
          CapabilityURingDirect is io_uring's direct descriptors, chosen when the release
          check passes (a kernel from 6.13). Switched off, connections live in the process
          table and the release check does not run.
        name: CapabilityURingDirect
        type: Capability
        value: "\"uring-direct\""
      - doc: |-
          CapabilityEpollExclusive is EPOLLEXCLUSIVE on every loop's listener
          registration. Switched off, every loop's epoll is woken by each connection.
        name: CapabilityEpollExclusive
        type: Capability
        value: "\"epoll-exclusive\""
      - doc: |-
          CapabilityTCPNoDelay is TCP_NODELAY on the listeners a loop group accepts on,
          inherited by every accepted socket. Switched off, it is not set.
        name: CapabilityTCPNoDelay
        type: Capability
        value: "\"tcp-nodelay\""
      - doc: |-
          CapabilityUDPRxqOvfl is SO_RXQ_OVFL on a batched UDP socket (Linux 2.6.33):
          the kernel attaches its count of the datagrams it dropped for want of
          receive-buffer room to each message read, which State reports as
          DatagramStateValue.KernelDrops. Switched off, the option is not set and the
          count stays zero.
        name: CapabilityUDPRxqOvfl
        type: Capability
        value: "\"udp-rxq-ovfl\""
      - doc: |-
          CapabilityUDPPktinfo is IP_PKTINFO and IPV6_RECVPKTINFO on a UDP socket
          bound to a wildcard address (#972): each datagram names its own destination,
          read back by Packet.To, and Reply leaves from that address. Off Linux the row
          reads unprobed. Switched off, the option is not set, Packet.To is the bound
          address and the kernel chooses a reply's source.
        name: CapabilityUDPPktinfo
        type: Capability
        value: "\"udp-pktinfo\""
      - doc: |-
          CapabilityURingRecvmsg is io_uring's multishot RECVMSG (6.0) on a
          datagram group served by PacketGroup.HandleLoop (#852): each datagram, its
          sender's address and UDP GRO's segment size land in a provided buffer, and
          the replies of a batch leave as SENDMSG, UDP_SEGMENT runs included. Absent —
          a probe stage refused — or switched off, the group's sockets are read by the
          batched reader of ADR 0192 on the runtime's netpoller, the epoll lane.
        name: CapabilityURingRecvmsg
        type: Capability
        value: "\"uring-multishot-recvmsg\""
      - doc: |-
          CapabilityTCPKeepAlive is SO_KEEPALIVE with TCP_KEEPIDLE, TCP_KEEPINTVL and
          TCP_KEEPCNT on the listeners a loop group accepts on, inherited by every
          accepted socket: 15 s, 15 s and 9 probes, the standard library's own, so a peer
          that vanished frees its slot on both engines. Switched off, or set negative,
          it is not set.
        name: CapabilityTCPKeepAlive
        type: Capability
        value: "\"tcp-keepalive\""
      - doc: |-
          CapabilityTCPUserTimeout is TCP_USER_TIMEOUT on the listeners a loop group
          accepts on, inherited by every accepted socket: the time output may stay
          unacknowledged before the kernel closes the connection with an error. Switched
          off, or with no timeout asked for, it is not set.
        name: CapabilityTCPUserTimeout
        type: Capability
        value: "\"tcp-user-timeout\""
    name: CapabilityURingMultishotRecv
  - doc: The class A-code capabilities, opt-in, which KITSUNIUM_NET_DISABLE may switch off (ADR 0189).
    grouped: true
    items:
      - doc: |-
          CapabilityURingDeferTaskrun is IORING_SETUP_DEFER_TASKRUN with SINGLE_ISSUER on
          the ring a loop's thread waits on; the other rings keep COOP_TASKRUN.
        name: CapabilityURingDeferTaskrun
        type: Capability
        value: "\"uring-defer-taskrun\""
      - doc: |-
          CapabilityURingNoSQArray is IORING_SETUP_NO_SQARRAY: the SQ indexes the SQEs
          directly, with no indirection array.
        name: CapabilityURingNoSQArray
        type: Capability
        value: "\"uring-no-sqarray\""
      - doc: |-
          CapabilityURingRingFDs registers each ring's descriptor with its thread
          (IORING_REGISTER_RING_FDS), at most 16 a thread, and unregisters it before the
          ring closes.
        name: CapabilityURingRingFDs
        type: Capability
        value: "\"uring-ring-fds\""
      - doc: |-
          CapabilityURingSQRewind is IORING_SETUP_SQ_REWIND with NO_SQARRAY: every
          submission is filled from SQE 0. It needs the kernel 7.0 lane before it may
          leave class A-code.
        name: CapabilityURingSQRewind
        type: Capability
        value: "\"uring-sq-rewind\""
      - doc: |-
          CapabilityURingRecvBundle is io_uring's receive bundle (IORING_RECVSEND_BUNDLE,
          6.10): one completion fills as many provided buffers as the bytes waiting need
          (ADR 0205). Opted into, on only where a probe recv fills two buffers — not with
          incremental consumption before 6.15; otherwise each completion fills one buffer.
        name: CapabilityURingRecvBundle
        type: Capability
        value: "\"uring-recv-bundle\""
      - doc: |-
          CapabilityTCPDeferAccept is TCP_DEFER_ACCEPT on the listeners a loop group
          accepts on: a connection is handed to the group once its peer has sent, or the
          group's read bound has run out, rounded up to whole seconds, so a peer that
          connects and says nothing takes no slot. Opted into, it is set only where the
          group has a read bound.
        name: CapabilityTCPDeferAccept
        type: Capability
        value: "\"tcp-defer-accept\""
      - doc: |-
          CapabilityReuseportLoops is one SO_REUSEPORT listener per loop of a loop group
          (#856): opted into with Shards(0), each loop accepts on its own queue, the
          kernel's four-tuple hash spreading the connections, and the drain takes each
          loop's queue. Switched off, the group serves one shared listener.
        name: CapabilityReuseportLoops
        type: Capability
        value: "\"reuseport-loops\""
      - doc: |-
          CapabilityLoopAffinity pins each loop's thread to the CPU LoopValue.Affinity
          names for it (#857): a refused CPU leaves the loop unpinned and the row
          missing, a fault.
        name: CapabilityLoopAffinity
        type: Capability
        value: "\"loop-affinity\""
      - doc: |-
          CapabilitySOIncomingCPU is SO_INCOMING_CPU on each per-loop listener of
          Shards(0) whose loop LoopValue.Affinity pins (#857): the kernel prefers the
          listener whose CPU received the connection. Opted into, it needs both.
        name: CapabilitySOIncomingCPU
        type: Capability
        value: "\"so-incoming-cpu\""
      - doc: |-
          CapabilityTCPNotsentLowat is TCP_NOTSENT_LOWAT on a loop group's TCP
          listeners, LoopValue.NotsentLowat bytes, 128 KiB when only opted into (#857).
        name: CapabilityTCPNotsentLowat
        type: Capability
        value: "\"tcp-notsent-lowat\""
      - doc: |-
          CapabilityHTTP2Loop is the HTTP/2 adapter of a loop group (ADR 0220). Switched
          off, the group serves HTTP/1.1 alone: the client preface is refused 400 and
          closed, and State's row reads disabled. It leaves class A-code once its merge
          gate holds (ADR 0189 §D1).
        name: CapabilityHTTP2Loop
        type: Capability
        value: "\"http2-loop\""
      - doc: |-
          CapabilityBusyPoll is busy polling of the network device's receive queues while
          a loop waits (#979): IORING_REGISTER_NAPI on each io_uring loop's ring 0 and
          EPIOCSPARAMS on each epoll loop's instance, both Linux 6.9, for
          LoopValue.BusyPoll with prefer_busy_poll set. It spends CPU to spare the
          wake-up an interrupt costs; a socket the kernel gives no NAPI id — loopback, a
          veth without GRO — is not polled. Before 6.9 the row reads absent, and
          unprobed on the portable backend. It leaves class A-code only through the
          paired gate of ADR 0189's amendment of 2026-11-11.
        name: CapabilityBusyPoll
        type: Capability
        value: "\"busy-poll\""
    name: CapabilityURingDeferTaskrun
  - doc: The class B capabilities, declared, not built, which KITSUNIUM_NET_DISABLE may name (ADR 0189).
    grouped: true
    items:
      - doc: |-
          CapabilityURingSendZC is io_uring's zero-copy send (IORING_OP_SEND_ZC, Linux
          6.0), class A-code since #969 although it sits in this block: a group opts in
          through LoopValue.Capabilities, every flight of at least LoopValue.SendZCMin
          bytes then leaves zero-copy, released at the kernel's notification. The
          probe asks REGISTER_PROBE for the opcode, then sends one datagram zero-copy
          on loopback and waits for its notification.
        name: CapabilityURingSendZC
        type: Capability
        value: "\"uring-send-zc\""
      - doc: |-
          CapabilityURingBundle is io_uring's send bundles; the receive bundle is
          CapabilityURingRecvBundle's (ADR 0205).
        name: CapabilityURingBundle
        type: Capability
        value: "\"uring-bundle\""
      - doc: |-
          CapabilityURingZCRX is io_uring's zero-copy receive (#980): IORING_OP_RECV_ZC
          (58) into an area registered with IORING_REGISTER_ZCRX_IFQ (32), Linux 6.15, on
          a ring set up with DEFER_TASKRUN and CQE32, from a NIC receive queue with
          header and data split that the operator steered to the group's port, the
          queue registered under CAP_NET_ADMIN. The row names the stage that stops it —
          the kernel without the opcode, no LoopValue.ZCRX interface, or the register's
          answer on a throwaway ring — and stays class B, receiving nothing, until its
          BENCH.md row and threshold exist (ADR 0189, amended 2026-11-11).
        name: CapabilityURingZCRX
        type: Capability
        value: "\"uring-zcrx\""
      - doc: |-
          CapabilityReuseportCBPF is a classic BPF program steering a datagram group's
          SO_REUSEPORT sockets (#977): opted into with Steer, it hands each datagram to
          the socket of index cpu mod n, the softirq's CPU. Refused — EPERM under a
          seccomp filter, EINVAL before Linux 4.5 — the row reads absent and the hash
          spread serves. The stream side, #857, is the loop's to do.
        name: CapabilityReuseportCBPF
        type: Capability
        value: "\"reuseport-cbpf\""
      - doc: |-
          CapabilityURingMinTimeout is io_uring's minimum wait (min_wait_usec), only where
          the kernel advertises IORING_FEAT_MIN_TIMEOUT.
        name: CapabilityURingMinTimeout
        type: Capability
        value: "\"uring-min-timeout\""
      - doc: |-
          CapabilityTCPFastOpen is TCP_FASTOPEN on a loop group's listeners (#857): one
          round trip saved to a repeat client where net.ipv4.tcp_fastopen allows it.
        name: CapabilityTCPFastOpen
        type: Capability
        value: "\"tcp-fastopen\""
    name: CapabilityURingSendZC
  - grouped: true
    items:
      - doc: |-
          acceptEncodingMaxBytes is the longest Accept-Encoding this reads: a
          browser's is a few dozen bytes, and the field is the peer's.
        name: acceptEncodingMaxBytes
        type: int
        value: 1 << 10
      - doc: acceptEncodingMaxElements is the most elements of one it walks.
        name: acceptEncodingMaxElements
        type: int
        value: "32"
    name: acceptEncodingMaxBytes
  - grouped: true
    items:
      - doc: corsMaxAge is the longest lifetime a preflight may be given.
        name: corsMaxAge
        type: time.Duration
        value: 24 * time.Hour
      - doc: corsWildcard is the one non-origin Origins may hold.
        name: corsWildcard
        type: string
        value: "\"*\""
      - doc: corsNullOrigin is the literal a sandboxed page or a local file sends.
        name: corsNullOrigin
        type: string
        value: "\"null\""
      - doc: fieldListSeparator joins a field's values, as RFC 9110 §5.6.1 spells a list.
        name: fieldListSeparator
        type: string
        value: "\", \""
      - doc: fieldEnd closes a field line.
        name: fieldEnd
        type: string
        value: "\"\\r\\n\""
      - doc: nameValueSeparator closes a field name.
        name: nameValueSeparator
        type: string
        value: "\": \""
    name: corsMaxAge
  - doc: The CORS response fields.
    grouped: true
    items:
      - name: corsVary
        type: string
        value: "\"Vary\""
      - name: corsAllowOrigin
        type: string
        value: "\"Access-Control-Allow-Origin\""
      - name: corsAllowMethods
        type: string
        value: "\"Access-Control-Allow-Methods\""
      - name: corsAllowHeaders
        type: string
        value: "\"Access-Control-Allow-Headers\""
      - name: corsExposeHeaders
        type: string
        value: "\"Access-Control-Expose-Headers\""
      - name: corsAllowCredentials
        type: string
        value: "\"Access-Control-Allow-Credentials\""
      - name: corsMaxAgeField
        type: string
        value: "\"Access-Control-Max-Age\""
    name: corsVary
  - grouped: true
    items:
      - doc: decimalBase is the radix used to read a bare nanosecond count.
        name: decimalBase
        type: int
        value: "10"
      - doc: bitSize64 is the width a nanosecond count must fit, matching time.Duration.
        name: bitSize64
        type: int
        value: "64"
      - doc: "minQuotedLen is the shortest possible quoted JSON token: the two quotes."
        name: minQuotedLen
        type: int
        value: "2"
    name: decimalBase
  - doc: The engine families a group may name with Engine. The zero value is EngineAuto.
    grouped: true
    items:
      - doc: |-
          EngineAuto lets the group's handler type choose its engine (ADR 0187): a loop
          handler runs on the loop engine, every other handler on the goroutine engine.
        name: EngineAuto
        type: EngineValue
        value: iota
      - doc: |-
          EngineGoroutine is the default engine: one goroutine per connection on the
          runtime's netpoller. It serves Handle, HandleFunc and HandleHTTP.
        name: EngineGoroutine
      - doc: |-
          EngineLoop is the loop engine of ADR 0186. It serves HandleLoop; Loop picks its
          backend.
        name: EngineLoop
    name: EngineAuto
  - doc: |-
      HTTP1MaxFields is how many field lines one request of the restricted
      HTTP/1.1 profile may carry. It sizes HTTP1RequestValue.Fields, so a request is
      framed into a fixed array and never into a slice that grows: one more line is
      refused (431), never stored elsewhere.
    items:
      - name: HTTP1MaxFields
        type: int
        value: "64"
    name: HTTP1MaxFields
  - doc: |-
      HTTP1MaxSubject is the longest subject an HTTP1AuthValue holds, in bytes. It
      sizes the value's array, so a subject is copied into the request and never
      aliases the bytes it was read from; a longer one is refused.
    items:
      - name: HTTP1MaxSubject
        type: int
        value: "128"
    name: HTTP1MaxSubject
  - doc: |-
      HTTP1MaxAccessFields is how many request fields an access-log link may
      allow: it sizes HTTP1AccessValue.Fields, so a record is a value and never a
      slice that grows.
    items:
      - name: HTTP1MaxAccessFields
        type: int
        value: "8"
    name: HTTP1MaxAccessFields
  - doc: |-
      HTTP1TraceLineLen sizes HTTP1ResponseValue.TraceLine: the field name, a
      version-00 traceparent and the line's end. Its array keeps a deferred
      answer's trace field, so it never aliases the request.
    items:
      - name: HTTP1TraceLineLen
        type: int
        value: "70"
    name: HTTP1TraceLineLen
  - doc: |-
      HTTP1MaxRequestID is the longest request identifier an HTTP1RequestIDValue
      holds, in bytes. It sizes the value's array, so an identifier is copied by
      value and never aliases the bytes it was read from; a longer one is treated
      as absent by the chain's RequestID link.
    items:
      - name: HTTP1MaxRequestID
        type: int
        value: "64"
    name: HTTP1MaxRequestID
  - doc: |-
      HTTP1DefaultHead is the head bound a zero HTTP1LimitsValue.Head selects: the
      request line, every field line and the blank line that ends them, in bytes.
    items:
      - name: HTTP1DefaultHead
        type: int
        value: "8192"
    name: HTTP1DefaultHead
  - doc: HTTP1MaxHead is the largest head bound HTTP1LimitsValue.Head may ask for.
    items:
      - name: HTTP1MaxHead
        type: int
        value: "65536"
    name: HTTP1MaxHead
  - doc: |-
      HTTP1DefaultTarget is the request-target bound a zero HTTP1LimitsValue.Target
      selects, in bytes.
    items:
      - name: HTTP1DefaultTarget
        type: int
        value: "2048"
    name: HTTP1DefaultTarget
  - doc: |-
      HTTP1DefaultBody is the Content-Length bound a zero HTTP1LimitsValue.Body
      selects: one mebibyte.
    items:
      - name: HTTP1DefaultBody
        type: int64
        value: 1 << 20
    name: HTTP1DefaultBody
  - doc: |-
      HTTP1MaxBody is the largest Content-Length bound HTTP1LimitsValue.Body may
      ask for: one gibibyte, which ten decimal digits always hold.
    items:
      - name: HTTP1MaxBody
        type: int64
        value: 1 << 30
    name: HTTP1MaxBody
  - doc: |-
      HTTP1MaxContentLengthDigits is how many digits a Content-Length may carry,
      leading zeros included. Ten digits hold HTTP1MaxBody and stay far from the
      int64 limit, so the value is accumulated with no overflow to check: a longer
      field is refused before it is read.
    items:
      - name: HTTP1MaxContentLengthDigits
        type: int
        value: "10"
    name: HTTP1MaxContentLengthDigits
  - doc: "The bytes an HTTP1RequestIDValue may hold: the visible ASCII range."
    grouped: true
    items:
      - doc: visibleFirst is '!'.
        name: visibleFirst
        type: byte
        value: "0x21"
      - doc: visibleLast is '~'.
        name: visibleLast
        type: byte
        value: "0x7E"
    name: visibleFirst
  - grouped: true
    items:
      - doc: HTTP1AccessAnswered is an answer written when the handler returned.
        name: HTTP1AccessAnswered
        type: HTTP1AccessStage
        value: iota
      - doc: |-
          HTTP1AccessDeferred is the first record of an answer deferred to the
          batch's end; its Status is zero.
        name: HTTP1AccessDeferred
      - doc: |-
          HTTP1AccessPending is an answer handed to the lane's worker: the record's
          only one, its Status zero.
        name: HTTP1AccessPending
      - doc: |-
          HTTP1AccessCompleted is a deferred answer's second record: Status and
          BodyLen are the answer's, Elapsed the time since it was deferred.
        name: HTTP1AccessCompleted
    name: HTTP1AccessAnswered
  - doc: |-
      defaultMinVersion is the floor applied when IdentityParams.MinVersion is zero.
      TLS 1.3 is the default rather than 1.2 because a new deployment has no legacy
      peer to accommodate; a caller that genuinely needs 1.2 must say so explicitly.
    items:
      - comment: tls.VersionTLS13
        name: defaultMinVersion
        type: uint16
        value: tls.VersionTLS12 + 1
    name: defaultMinVersion
  - doc: The group options a loop group judges at Start, by kind.
    grouped: true
    items:
      - doc: OptionNone names no option; it is the zero value.
        name: OptionNone
        type: OptionKind
        value: iota
      - doc: OptionTLS is TLS. A loop group always refuses it, with LoopTLSUnsupported.
        name: OptionTLS
      - doc: |-
          OptionMiddleware is Use. A loop group always refuses it: there is no
          ConnHandler to decorate.
        name: OptionMiddleware
      - doc: OptionReadTimeout is ReadTimeout.
        name: OptionReadTimeout
      - doc: OptionWriteTimeout is WriteTimeout.
        name: OptionWriteTimeout
      - doc: OptionIdleTimeout is IdleTimeout. The loop engine honours it.
        name: OptionIdleTimeout
      - doc: |-
          OptionReadHeaderTimeout is ReadHeaderTimeout, which only a protocol adapter
          can honour.
        name: OptionReadHeaderTimeout
      - doc: |-
          OptionMaxHeaderBytes is MaxHeaderBytes, which only a protocol adapter can
          honour.
        name: OptionMaxHeaderBytes
      - doc: OptionHandshakeTimeout is HandshakeTimeout.
        name: OptionHandshakeTimeout
      - doc: OptionReadBufferSize is ReadBufferSize.
        name: OptionReadBufferSize
      - doc: OptionMaxPacketSize is MaxPacketSize.
        name: OptionMaxPacketSize
      - doc: OptionBatchSize is BatchSize.
        name: OptionBatchSize
      - doc: OptionShards is Shards.
        name: OptionShards
      - doc: |-
          OptionMaxConns is MaxConns. The loop engine honours it, refusing with
          ConnLimitReached.
        name: OptionMaxConns
      - doc: OptionAdopt is Adopt. The loop engine honours it.
        name: OptionAdopt
      - doc: OptionPreHandshake is PreHandshake.
        name: OptionPreHandshake
      - doc: |-
          OptionPlaintext is Plaintext. Every engine honours it; with TLS it is refused
          with PlaintextWithTLS.
        name: OptionPlaintext
      - doc: OptionName is Name. Every engine honours it.
        name: OptionName
      - doc: |-
          OptionEngine is Engine. Every engine honours it, or refuses the group with
          EngineUnsupported.
        name: OptionEngine
      - doc: |-
          OptionLoopMiddleware is UseLoop. The loop engine honours it; every group no
          loop handler serves refuses it with LoopOptionUnsupported.
        name: OptionLoopMiddleware
      - doc: |-
          OptionBatchReplies is BatchReplies. A datagram group honours it; a stream
          group, goroutine or loop, refuses it with LoopOptionUnsupported (ADR 0192).
        name: OptionBatchReplies
      - doc: |-
          OptionProtocols is Protocols. An HTTP group served by net/http honours
          it, and so does the http1 codec given TLS when it names "http/1.1"
          alone; any other list for that codec is refused with ProtocolsRefused.
          Any other loop group — the http1 codec without TLS included — refuses
          it with LoopOptionUnsupported unless its handler or a layer honours it
          (LoopOptionHonourer), and any other group with ProtocolsRefused.
        name: OptionProtocols
      - doc: |-
          OptionMaxBodyBytes is MaxBodyBytes. An HTTP group served by net/http
          honours it; a loop group refuses it with LoopOptionUnsupported, its body
          bound being the http1 profile's own, and a datagram group with
          PacketOptionUnsupported.
        name: OptionMaxBodyBytes
      - doc: |-
          OptionBacklog is Backlog. A stream group honours it on both engines; a
          datagram group refuses it with PacketOptionUnsupported.
        name: OptionBacklog
      - doc: |-
          OptionReceiveBuffer is ReceiveBuffer. A stream group honours it on both
          engines and a datagram group on its socket; the accepted sockets of a loop
          group inherit the listener's.
        name: OptionReceiveBuffer
      - doc: OptionSendBuffer is SendBuffer, honoured as OptionReceiveBuffer is.
        name: OptionSendBuffer
      - doc: |-
          OptionProxyProtocol is ProxyProtocol. A goroutine-engine TCP group honours it;
          a loop group refuses it with LoopOptionUnsupported, a datagram group with
          PacketOptionUnsupported.
        name: OptionProxyProtocol
      - doc: |-
          OptionSteer is Steer. A datagram group honours it; every other group refuses it
          with LoopOptionUnsupported.
        name: OptionSteer
      - doc: OptionKeepAlive is KeepAlive. Every stream engine honours it.
        name: OptionKeepAlive
      - doc: OptionUserTimeout is UserTimeout. Every stream engine honours it.
        name: OptionUserTimeout
      - doc: |-
          OptionHTTP2 is HTTP2. An HTTP group honours it; a loop group refuses it with
          LoopOptionUnsupported unless its handler honours it (the http2 adapter
          does), a datagram group with PacketOptionUnsupported.
        name: OptionHTTP2
    name: OptionNone
  - doc: |-
      LoopsAuto, set as LoopValue.Loops, runs one loop per GOMAXPROCS but one, at
      least one, read once at Start: a snapshot that a later change of GOMAXPROCS
      does not move. The P left over runs the rest of the process (ADR 0199). It
      is a sentinel, never the zero value, which is one loop (ADR 0187 §D9); State
      reports the count and "auto" as its source.
    items:
      - name: LoopsAuto
        type: int
        value: "-1"
    name: LoopsAuto
  - doc: The loop backends. The zero value is LoopBackendAuto.
    grouped: true
    items:
      - doc: |-
          LoopBackendAuto takes the best backend the platform's probe reaches:
          io_uring, then epoll on Linux, the portable backend elsewhere. On darwin
          and the BSDs it stays portable until kqueue's paired gate holds: kqueue
          runs there when named, LoopBackendKqueue (ADR 0222).
        name: LoopBackendAuto
        type: LoopBackend
        value: iota
      - doc: |-
          LoopBackendIOURing is io_uring, on linux/amd64, arm64, riscv64 and loong64,
          after the kernel's staged probe.
        name: LoopBackendIOURing
      - doc: LoopBackendEpoll is epoll, on every Linux architecture.
        name: LoopBackendEpoll
      - doc: |-
          LoopBackendPortable is the default engine's accept path and goroutines,
          serialised onto one handler goroutine, on every platform.
        name: LoopBackendPortable
      - doc: |-
          LoopBackendKqueue is kqueue, on darwin, FreeBSD, OpenBSD, NetBSD and
          DragonFly, after a staged probe (ADR 0222). It runs only when named:
          LoopBackendAuto does not choose it until its paired gate holds.
        name: LoopBackendKqueue
    name: LoopBackendAuto
  - doc: |-
      minAcceptedVersion is the oldest TLS version the domain will serve or dial.
      TLS 1.0 and 1.1 are deprecated by RFC 8996 and are refused, not warned about.
    items:
      - name: minAcceptedVersion
        type: uint16
        value: tls.VersionTLS12
    name: minAcceptedVersion
  - doc: The lifecycle phases, in the order a server passes through them.
    grouped: true
    items:
      - doc: PhaseNew is a constructed server that has not bound anything yet.
        name: PhaseNew
        type: Phase
        value: iota
      - doc: PhaseStarting is binding listeners; some may already be up.
        name: PhaseStarting
      - doc: PhaseServing is bound and accepting.
        name: PhaseServing
      - doc: PhaseDraining has stopped accepting and is waiting for in-flight work.
        name: PhaseDraining
      - doc: PhaseStopped has released every listener.
        name: PhaseStopped
    name: PhaseNew
  - doc: |-
      SSEContentType is the media type an event stream must be served under. A
      client that receives anything else does not start an EventSource at all.
    items:
      - name: SSEContentType
        type: string
        value: "\"text/event-stream\""
    name: SSEContentType
  - doc: |-
      SSEMinRetry is the smallest reconnection hint the wire can carry. The retry
      field is an integer MILLISECOND count, so anything shorter rounds to zero —
      and zero does not mean "a very short delay", it means "reconnect at once".
    items:
      - name: SSEMinRetry
        type: time.Duration
        value: time.Millisecond
    name: SSEMinRetry
  - doc: |-
      SSELastEventIDHeader is the request header a reconnecting client sends,
      carrying the id of the last event it processed.
    items:
      - name: SSELastEventIDHeader
        type: string
        value: "\"Last-Event-ID\""
    name: SSELastEventIDHeader
  - grouped: true
    items:
      - doc: SteerHash spreads a group's datagrams with the kernel's 4-tuple hash.
        name: SteerHash
        type: SteerValue
        value: iota
      - doc: |-
          SteerCPU hands each datagram to shard cpu mod n, the softirq's CPU
          (SO_ATTACH_REUSEPORT_CBPF, Linux 4.5).
        name: SteerCPU
    name: SteerHash
  - doc: |-
      WSGUID is the fixed string RFC 6455 §1.3 concatenates to Sec-WebSocket-Key
      before hashing. It is a constant of the protocol, not a secret and not a
      parameter: its only job is to make the accept value impossible to produce by
      echoing the request, so a cache or a naive proxy cannot fake an upgrade.
    items:
      - name: WSGUID
        type: string
        value: "\"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\""
    name: WSGUID
  - doc: |-
      WSVersion is the only protocol version this domain speaks (RFC 6455 §4.1).
      A request naming any other version is refused WITH this value advertised
      back, which is what lets a client renegotiate instead of guessing.
    items:
      - name: WSVersion
        type: string
        value: "\"13\""
    name: WSVersion
  - doc: |-
      WSKeyLen is how many bytes Sec-WebSocket-Key decodes to (RFC 6455 §4.1).
      A key of any other length is not a WebSocket handshake, whatever it decodes.
    items:
      - name: WSKeyLen
        type: int
        value: "16"
    name: WSKeyLen
  - doc: |-
      The handshake headers, spelled once so no caller mistypes one into a silent
      miss.
    grouped: true
    items:
      - doc: WSKeyHeader carries the client's 16 random bytes, base64-encoded.
        name: WSKeyHeader
        type: string
        value: "\"Sec-WebSocket-Key\""
      - doc: WSAcceptHeader carries the server's proof it understood the handshake.
        name: WSAcceptHeader
        type: string
        value: "\"Sec-WebSocket-Accept\""
      - doc: |-
          WSVersionHeader carries the client's version, and the server's
          counter-offer when it refuses one.
        name: WSVersionHeader
        type: string
        value: "\"Sec-WebSocket-Version\""
      - doc: WSProtocolHeader carries the subprotocol list, then the single choice.
        name: WSProtocolHeader
        type: string
        value: "\"Sec-WebSocket-Protocol\""
      - doc: |-
          WSExtensionsHeader carries the extension offer. This domain negotiates
          none, so it is never echoed — see the package CLAUDE.md.
        name: WSExtensionsHeader
        type: string
        value: "\"Sec-WebSocket-Extensions\""
      - doc: WSUpgradeToken is the token both Upgrade headers must carry.
        name: WSUpgradeToken
        type: string
        value: "\"websocket\""
    name: WSKeyHeader
  - doc: |-
      WSMaxControlPayload is the ceiling RFC 6455 §5.5 puts on a control frame's
      payload. It exists so an endpoint can answer a Ping without buffering: a
      control frame is answered inline, between the fragments of a message, so it
      must fit in a fixed buffer that is always available.
    items:
      - name: WSMaxControlPayload
        type: int
        value: "125"
    name: WSMaxControlPayload
  - doc: |-
      The close codes RFC 6455 §7.4.1 defines. Three of them — WSCloseNoStatus,
      WSCloseAbnormal and WSCloseTLSHandshake — are values an application may
      OBSERVE but that MUST NOT appear on the wire: they describe the absence of a
      close frame, so sending one would be a statement contradicted by its own
      delivery.
    grouped: true
    items:
      - doc: WSCloseNormal is a completed purpose, on either side.
        name: WSCloseNormal
        type: WSCloseCode
        value: "1000"
      - doc: |-
          WSCloseGoingAway is a server shutting down or a browser navigating away.
          It is what a drain sends.
        name: WSCloseGoingAway
        type: WSCloseCode
        value: "1001"
      - doc: WSCloseProtocolError is a frame the RFC forbids.
        name: WSCloseProtocolError
        type: WSCloseCode
        value: "1002"
      - doc: |-
          WSCloseUnsupportedData is a well-formed frame carrying data this endpoint
          cannot accept — binary to a text-only peer, for instance.
        name: WSCloseUnsupportedData
        type: WSCloseCode
        value: "1003"
      - doc: |-
          WSCloseNoStatus means the peer's Close frame carried no code. It is
          reported to the application and never sent.
        name: WSCloseNoStatus
        type: WSCloseCode
        value: "1005"
      - doc: |-
          WSCloseAbnormal means the connection died without a Close frame. It is
          reported to the application and never sent.
        name: WSCloseAbnormal
        type: WSCloseCode
        value: "1006"
      - doc: |-
          WSCloseInvalidPayload is a text frame that is not valid UTF-8, or a close
          reason that is not.
        name: WSCloseInvalidPayload
        type: WSCloseCode
        value: "1007"
      - doc: WSClosePolicyViolation is the generic refusal when no other code fits.
        name: WSClosePolicyViolation
        type: WSCloseCode
        value: "1008"
      - doc: WSCloseTooLarge is a message beyond what this endpoint accepts.
        name: WSCloseTooLarge
        type: WSCloseCode
        value: "1009"
      - doc: |-
          WSCloseExtensionRequired is a client giving up because the server did not
          negotiate an extension it needs. A server never sends it.
        name: WSCloseExtensionRequired
        type: WSCloseCode
        value: "1010"
      - doc: WSCloseInternalError is an unexpected condition on this side.
        name: WSCloseInternalError
        type: WSCloseCode
        value: "1011"
      - doc: |-
          WSCloseTLSHandshake means the TLS handshake failed. It is reported to the
          application and never sent — there is no connection to send it on.
        name: WSCloseTLSHandshake
        type: WSCloseCode
        value: "1015"
    name: WSCloseNormal
  - doc: The boundaries of the close-code ranges RFC 6455 §7.4.2 reserves.
    grouped: true
    items:
      - doc: wsCloseProtocolLow is the first code the protocol itself may define.
        name: wsCloseProtocolLow
        type: WSCloseCode
        value: "1000"
      - doc: |-
          wsCloseRegisteredHigh is the last code registered with IANA today
          (1012 Service Restart, 1013 Try Again Later and 1014 Bad Gateway are
          later registrations against the same range). Everything between here and
          wsCloseLibraryLow is reserved-but-unallocated, so it is refused.
        name: wsCloseRegisteredHigh
        type: WSCloseCode
        value: "1014"
      - doc: |-
          wsCloseUndefined is the one hole inside the assigned block: 1004 was
          reserved and never given a meaning, so it must not be sent.
        name: wsCloseUndefined
        type: WSCloseCode
        value: "1004"
      - doc: |-
          wsCloseLibraryLow opens the range libraries and frameworks register
          first-come-first-served, which runs contiguously into the private range.
        name: wsCloseLibraryLow
        type: WSCloseCode
        value: "3000"
      - doc: |-
          wsClosePrivateHigh closes the range applications may use without
          registering anything.
        name: wsClosePrivateHigh
        type: WSCloseCode
        value: "4999"
    name: wsCloseProtocolLow
  - doc: |-
      wsControlBit is set on every control opcode (0x8..0xF) and clear on every
      data opcode (0x0..0x7), which is the whole reason the opcode space is split
      at 8 — an endpoint can classify an opcode it does not know.
    items:
      - name: wsControlBit
        type: byte
        value: "0x08"
    name: wsControlBit
  - doc: |-
      The opcodes RFC 6455 defines. Everything else in the four-bit space is
      reserved, and a reserved opcode fails the connection rather than being
      skipped: an endpoint that ignored it would be desynchronised from a peer that
      believes the frame meant something.
    grouped: true
    items:
      - doc: WSContinuation continues the message the previous frame began.
        name: WSContinuation
        type: WSOpCode
        value: "0x0"
      - doc: WSText carries a UTF-8 payload, validated on both sides.
        name: WSText
        type: WSOpCode
        value: "0x1"
      - doc: WSBinary carries opaque bytes.
        name: WSBinary
        type: WSOpCode
        value: "0x2"
      - doc: WSClose begins or completes the closing handshake.
        name: WSClose
        type: WSOpCode
        value: "0x8"
      - doc: WSPing asks the peer to answer with a Pong carrying the same payload.
        name: WSPing
        type: WSOpCode
        value: "0x9"
      - doc: WSPong answers a Ping, or is sent unsolicited as a one-way heartbeat.
        name: WSPong
        type: WSOpCode
        value: "0xA"
    name: WSContinuation
