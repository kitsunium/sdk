functions:
  - name: WithDrainSignal
    params: ctx context.Context, draining <-chan struct{}
    results: context.Context
  - name: DrainSignal
    params: ctx context.Context
    results: <-chan struct{}
  - doc: foldEqual reports whether b and s are equal once A–Z are folded to a–z.
    name: foldEqual
    params: b []byte, s string
    results: bool
  - doc: foldByte maps A–Z onto a–z and every other byte onto itself.
    name: foldByte
    params: c byte
    results: byte
  - name: NewIdentityValue
    params: p IdentityParams
    results: id IdentityValue, err error
  - doc: |-
      parseKeyPair turns a PEM certificate chain and key into a tls.Certificate.
      Both halves empty is legitimate — a client that only verifies the server holds
      no identity of its own — but supplying one without the other is a mistake that
      would otherwise surface as a confusing handshake failure much later.
    name: parseKeyPair
    params: certPEM, keyPEM []byte
    results: certs []tls.Certificate, err error
  - doc: |-
      parsePool builds a certificate pool from a PEM bundle.

      This is the trap the domain exists to close. x509.CertPool.AppendCertsFromPEM
      reports success through a boolean that is almost universally discarded, so a
      bundle that is empty, truncated, or accidentally a private key produces a pool
      that parses fine and verifies nothing — the failure then shows up as a trusted
      connection to an untrusted peer. Here a bundle that yields no certificate is a
      typed error, and an absent bundle is distinct from an unusable one.
    name: parsePool
    params: bundlePEM []byte, field string
    results: pool *x509.CertPool, err error
  - doc: resolveMinVersion applies the domain default and refuses deprecated versions.
    name: resolveMinVersion
    params: v uint16
    results: version uint16, err error
  - name: Chain
    params: h H, middlewares ...Middleware[H]
    results: H
    typeParams: H any
  - doc: validateSSELine refuses a line terminator in a field the format cannot split.
    name: validateSSELine
    params: field, value string
    results: error
  - doc: |-
      validateSSERetry refuses a reconnection hint the millisecond field cannot
      carry honestly.
    name: validateSSERetry
    params: retry time.Duration
    results: error
  - doc: |-
      wrapAs returns the given net sentinel as the error origin (its code, reason
      and public message win), attaching the cause's message and any extra fields as
      structured metadata. Wrapping the sentinel rather than the cause is what keeps
      the domain code intact: origin-wins would otherwise let an *errs.Error cause
      hijack it. A nil cause yields the sentinel carrying only the extra fields.
    name: wrapAs
    params: sentinel *errs.Error, cause error, fields ...errs.FieldValue
    results: error
imports:
  context: context
  errs: github.com/kitsunium/sdk/internal/kernel/errs
