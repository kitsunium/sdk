                			errs.String("field", "min_version"),
                			errs.String("why", "TLS versions below 1.2 are refused"))
          when: v < minAcceptedVersion
      - return: v, nil
  - of: PacketHandlerFunc.ServePacket
    steps:
      - return: f(ctx, p)
  - of: Phase.String
    steps:
      - switch:
          cases:
            - case: PhaseNew
              do:
                - return: "\"new\""
            - case: PhaseStarting
              do:
                - return: "\"starting\""
            - case: PhaseServing
              do:
                - return: "\"serving\""
            - case: PhaseDraining
              do:
                - return: "\"draining\""
            - case: PhaseStopped
              do:
                - return: "\"stopped\""
            - default: true
              do:
                - return: "\"unknown\""
          "on": p
  - of: PolicyFunc.Allow
    steps:
      - return: f(req)
  - of: SSEEventValue.IsZero
    steps:
      - return: e.ID == "" && e.Name == "" && e.Data == "" && e.Retry == 0
  - of: SSEEventValue.Validate
    participants:
      - id: caller
        kind: actor
      - id: SSEEventValue.Validate
        kind: self
      - id: errs
        kind: package
      - id: validateSSELine
        kind: internal
      - id: validateSSERetry
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("why", "the event carries no field at all"))
              to: errs
          when: e.IsZero()
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: validateSSELine("id", e.ID)
            to: validateSSELine
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("field", "id"),
                			errs.String("why", "the value carries U+0000, which a client ignores the whole id for"))
              to: errs
          when: e.ID != "" && strings.IndexByte(e.ID, 0) >= 0
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: validateSSELine("event", e.Name)
            to: validateSSELine
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("field", "event"),
                			errs.String("why", "an event name without data dispatches nothing"))
              to: errs
          when: e.Name != "" && e.Data == ""
      - return: validateSSERetry(e.Retry.Duration())
        to: validateSSERetry
  - of: validateSSELine
    participants:
      - id: caller
        kind: actor
      - id: validateSSELine
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("field", field),
                			errs.String("why", "the value carries a line terminator, which this field cannot express"))
              to: errs
          when: value != "" && (strings.IndexByte(value, '\n') >= 0 || strings.IndexByte(value, '\r') >= 0)
      - return: nil
  - of: validateSSERetry
    participants:
      - id: caller
        kind: actor
      - id: validateSSERetry
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("field", "retry"),
                			errs.String("why", "the reconnection delay is negative"))
              to: errs
          when: retry < 0
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
                			errs.String("field", "retry"),
                			errs.Int64("nanoseconds", int64(retry)),
                			errs.String("why", "the wire field is an integer millisecond count"))
              to: errs
          when: retry > 0 && retry < SSEMinRetry
      - return: nil
  - of: WSCloseCode.Sendable
    steps:
      - opt:
          do:
            - return: c != wsCloseUndefined && c != WSCloseNoStatus && c != WSCloseAbnormal
          when: c >= wsCloseProtocolLow && c <= wsCloseRegisteredHigh
      - return: c >= wsCloseLibraryLow && c <= wsClosePrivateHigh
  - of: WSCloseCode.Echoable
    steps:
      - opt:
          do:
            - return: WSCloseNormal
          when: "!c.Sendable()"
      - return: c
  - of: WSMessageValue.OpCode
    steps:
      - opt:
          do:
            - return: WSBinary
          when: m.Binary
      - return: WSText
  - of: WSOpCode.IsControl
    steps:
      - return: byte(o)&wsControlBit != 0
  - of: WSOpCode.Defined
    steps:
      - switch:
          cases:
            - case: WSContinuation, WSText, WSBinary, WSClose, WSPing, WSPong
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": o
  - of: WSOpCode.String
    steps:
      - switch:
          cases:
            - case: WSContinuation
              do:
                - return: "\"continuation\""
            - case: WSText
              do:
                - return: "\"text\""
            - case: WSBinary
              do:
                - return: "\"binary\""
            - case: WSClose
              do:
                - return: "\"close\""
            - case: WSPing
              do:
                - return: "\"ping\""
            - case: WSPong
              do:
                - return: "\"pong\""
            - default: true
              do:
                - return: "\"reserved\""
          "on": o
  - of: wrapAs
    participants:
      - id: caller
        kind: actor
      - id: wrapAs
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(sentinel, errs.WrapParams{}, fields...)
              to: errs
          when: cause == nil
      - return: errs.Wrap(sentinel, errs.WrapParams{}, append(fields, errs.String("cause", cause.Error()))...)
        to: errs
