      - id: wrapAs
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(sentinel, errs.WrapParams{}, fields...)
              to: errs
          when: cause == nil
      - return: errs.Wrap(sentinel, errs.WrapParams{}, append(fields, errs.String("cause", cause.Error()))...)
        to: errs
