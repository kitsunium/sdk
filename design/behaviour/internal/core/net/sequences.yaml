  - of: validateSSELine
    participants:
      - id: caller
        kind: actor
      - id: validateSSELine
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(SSEFieldInvalid, errs.WrapParams{},
