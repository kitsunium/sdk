functions:
  - doc: prefixFlag is the flag a prefix character stands for, and whether it is one.
    name: prefixFlag
    params: c byte
    results: CommandFlags, bool
  - name: ParseCommand
    params: words []string
    results: CommandValue, error
  - doc: parsePrefixes splits the first word into its prefix flags and the program.
    name: parsePrefixes
    params: word string
    results: CommandFlags, string, error
  - doc: |-
      checkProgram returns the rule a program breaks, "" when it breaks none: it
      is an absolute path or a file name without a slash, and holds no control
      character.
    name: checkProgram
    params: path string
    results: string
  - doc: commandInvalid is COMMAND_INVALID with the rule and the word.
    name: commandInvalid
    params: rule, word string
    results: error
imports:
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  os: os
  slices: slices
  strconv: strconv
  strings: strings
  time: time
  unicode: unicode
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/proc/service
  name: service
  purpose: "Package service is the contract of a service unit's life cycle (ADR 0214): systemd.service(5)'s directives as typed values, the states a unit passes through and the snapshot a consumer reads, the ports the engine reaches the world through, and the codes of the range 0.3.105.*."
types:
  - alias: true
    doc: |-
      Clock is the time every wait of a unit runs on: the kernel's clock.Timed,
      so pkg/v1/clock's System and ManualClock are clocks here (ADR 0214 §5).
    kind: alias
    name: Clock
    underlying: clock.Timed
  - kind: named
    methods:
      - name: String
        recv: f CommandFlags
        results: string
      - name: Privileged
        recv: f CommandFlags
        results: bool
    name: CommandFlags
    underlying: uint8
  - fields:
      - doc: |-
          Path is the program: an absolute path or a bare file name the engine
          looks up. It is empty only for a FlagShell command that is the shell
          alone.
        name: Path
        type: string
      - doc: |-
          Args is the program's argument vector, argv[0] first: Path, or the word
          "@" named. $VAR and ${VAR} in it are expanded at spawn unless
          FlagNoEnvExpand.
        name: Args
        type: "[]string"
      - doc: Flags are the command's prefixes.
        name: Flags
        type: CommandFlags
    kind: struct
    name: CommandValue
  - kind: named
    methods:
      - name: String
        recv: p ProtectSystem
        results: string
    name: ProtectSystem
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: p PrivateTmp
        results: string
    name: PrivateTmp
    underlying: uint8
  - fields:
      - doc: Source is the absolute file or directory bound.
        name: Source
        type: string
      - doc: Target is where it appears, absolute; empty is Source. It must exist.
        name: Target
        type: string
    kind: struct
    name: BindPathValue
  - fields:
      - doc: Path is the absolute directory the tmpfs is mounted on; it must exist.
        name: Path
        type: string
      - doc: ReadOnly is the ":ro" option.
        name: ReadOnly
        type: bool
    kind: struct
    name: TemporaryFileSystemValue
  - fields:
      - doc: |-
          Syscalls are the calls by their Linux names ("mkdirat"); the @group names
          are the caller's to expand.
        name: Syscalls
        type: "[]string"
      - doc: "Deny inverts the list: the calls named are refused, every other passes."
        name: Deny
        type: bool
    kind: struct
    name: SystemCallFilterValue
  - fields:
      - doc: Codes are exit codes, 0–255.
        name: Codes
        type: "[]int"
      - doc: Signals are terminating signals.
        name: Signals
        type: "[]coreproc.Signal"
    kind: struct
    methods:
      - name: Contains
        params: exit coreproc.ExitValue
        recv: s ExitStatusValue
        results: bool
      - name: Empty
        recv: s ExitStatusValue
        results: bool
    name: ExitStatusValue
  - fields:
      - doc: |-
          Fields are the message's NAME=value assignments; a name given twice
          keeps its last value.
        name: Fields
        type: map[string]string
      - doc: |-
          Files are the descriptors the message carried (SCM_RIGHTS), in order —
          with MAINPIDFD=1 the first is the main process's pidfd —, which the
          engine owns once Recv returned them: the store keeps those FDSTORE=1
          hands it, and every other is closed when the message is taken, which is
          what BARRIER=1 waits for.
        name: Files
        type: "[]*os.File"
      - doc: PID is the sender's process, 0 when unknown.
        name: PID
        type: int
      - doc: UID is the sender's user, -1 when unknown.
        name: UID
        type: int
      - doc: |-
          Verified is true when the kernel named PID (and UID, when known): a
          message whose sender is not verified is dropped.
        name: Verified
        type: bool
    kind: struct
    name: NotifyValue
  - fields:
      - doc: At is when the snapshot was published, on the unit's clock.
        name: At
        type: time.Time
      - doc: Changed is when State last changed.
        name: Changed
        type: time.Time
      - doc: Name is the unit's name.
        name: Name
        type: string
      - doc: Status is the last STATUS= the unit sent.
        name: Status
        type: string
      - doc: BusError is the last BUSERROR= the unit sent.
        name: BusError
        type: string
      - doc: VarlinkError is the last VARLINKERROR= the unit sent.
        name: VarlinkError
        type: string
      - doc: ExitStatusText is the last EXIT_STATUS= the unit sent, informative only.
        name: ExitStatusText
        type: string
      - doc: MainExit is the main process's last exit, valid when MainExited.
        name: MainExit
        type: coreproc.ExitValue
      - doc: |-
          Generation grows by one with every snapshot published; two events whose
          generations are not consecutive have lost the ones between.
        name: Generation
        type: uint64
      - doc: Dropped is how many events the unit's subscriptions have dropped.
        name: Dropped
        type: uint64
      - doc: |-
          NotifyRefused is how many notifications were refused: an unverified or
          unadmitted sender, a MAINPID= that could not be accepted.
        name: NotifyRefused
        type: uint64
      - doc: |-
          FDStoreRefused is how many descriptors FDSTORE=1 handed that the store
          refused and closed: past FileDescriptorStoreMax=, or to a unit without a
          store.
        name: FDStoreRefused
        type: uint64
      - doc: |-
          FDStoreDiscarded is how many stored descriptors were closed because the
          unit no longer runs what stored them — another ExecStart=, user or
          group.
        name: FDStoreDiscarded
        type: uint64
      - doc: MainPID is the main process, 0 when there is none.
        name: MainPID
        type: int
      - doc: ControlPID is the command running, 0 when there is none.
        name: ControlPID
        type: int
      - doc: Errno is the last ERRNO= the unit sent.
        name: Errno
        type: int
      - doc: FDStore is how many descriptors the unit's store holds.
        name: FDStore
        type: int
      - doc: |-
          Restarts is how many automatic restarts ran since the last start the
          caller asked for or RESTART_RESET=1.
        name: Restarts
        type: uint32
      - doc: State is where the unit stands.
        name: State
        type: State
      - doc: Sub is the step it is at.
        name: Sub
        type: Sub
      - doc: Result is why its last run ended, or ResultSuccess while it runs well.
        name: Result
        type: Result
      - doc: ReloadResult is how its last reload ended.
        name: ReloadResult
        type: Result
      - doc: NotifyAccess is the effective NotifyAccess=, NOTIFYACCESS= included.
        name: NotifyAccess
        type: NotifyAccess
      - doc: MainExited is true once the main process's exit is known.
        name: MainExited
        type: bool
    kind: struct
    name: StateValue
  - fields:
      - doc: Name is its FDNAME=, "stored" when the message named none.
        name: Name
        type: string
      - doc: Device is the device of the object it refers to, as fstat names it.
        name: Device
        type: uint64
      - doc: Inode is the inode of the object it refers to, as fstat names it.
        name: Inode
        type: uint64
      - doc: Mode is the object's type and permissions, as fstat reads them.
        name: Mode
        type: os.FileMode
      - doc: |-
          Poll is true while a hangup or an error on it removes it from the store:
          FDPOLL=0 clears it, and so does an object epoll cannot watch.
        name: Poll
        type: bool
    kind: struct
    name: StoredFDValue
  - fields:
      - doc: StateValue is the unit after the change.
        name: ""
        role: embedded
        type: StateValue
      - doc: Previous is the state before the change.
        name: Previous
        type: State
      - doc: PreviousSub is the step before the change.
        name: PreviousSub
        type: Sub
    kind: struct
    name: EventValue
  - kind: named
    methods:
      - name: String
        recv: t Type
        results: string
    name: Type
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: r Restart
        results: string
    name: Restart
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: m RestartMode
        results: string
    name: RestartMode
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: m KillMode
        results: string
    name: KillMode
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: e ExitType
        results: string
    name: ExitType
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: a NotifyAccess
        results: string
    name: NotifyAccess
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: m TimeoutMode
        results: string
    name: TimeoutMode
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: p OOMPolicy
        results: string
    name: OOMPolicy
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: p Preserve
        results: string
    name: Preserve
    underlying: uint8
  - kind: named
    methods:
      - name: "On"
        params: def bool
        recv: t Toggle
        results: bool
    name: Toggle
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: s State
        results: string
      - name: ActiveState
        recv: s State
        results: string
    name: State
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: s Sub
        results: string
    name: Sub
    underlying: uint8
  - kind: named
    methods:
      - name: String
        recv: r Result
        results: string
    name: Result
    underlying: uint8
vars:
  - doc: |-
      prefixes are the prefix characters and their flags, in the order String
      writes them.
    items:
      - name: prefixes
        value: |-
          [...]struct {
          	char byte
          	flag CommandFlags
          }{
          	{'@', FlagArgv0},
          	{'-', FlagIgnoreFailure},
          	{':', FlagNoEnvExpand},
          	{'+', FlagFullPrivileges},
          	{'!', FlagNoCredentials},
          	{'|', FlagShell},
          }
    name: prefixes
  - grouped: true
    items:
      - doc: typeNames are the Type= spellings.
        name: typeNames
        value: "[...]string{\"\", \"simple\", \"exec\", \"forking\", \"oneshot\", \"dbus\", \"notify\", \"notify-reload\", \"idle\"}"
      - doc: restartNames are the Restart= spellings.
        name: restartNames
        value: "[...]string{\"no\", \"on-success\", \"on-failure\", \"on-abnormal\", \"on-watchdog\", \"on-abort\", \"always\"}"
      - doc: restartModeNames are the RestartMode= spellings.
        name: restartModeNames
        value: "[...]string{\"normal\", \"direct\", \"debug\"}"
      - doc: killModeNames are the KillMode= spellings.
        name: killModeNames
        value: "[...]string{\"\", \"process\", \"control-group\", \"mixed\", \"none\"}"
      - doc: exitTypeNames are the ExitType= spellings.
        name: exitTypeNames
        value: "[...]string{\"main\", \"cgroup\"}"
      - doc: notifyAccessNames are the NotifyAccess= spellings.
        name: notifyAccessNames
        value: "[...]string{\"none\", \"main\", \"exec\", \"all\"}"
      - doc: timeoutModeNames are the failure modes' spellings.
        name: timeoutModeNames
        value: "[...]string{\"terminate\", \"abort\", \"kill\"}"
      - doc: oomPolicyNames are the OOMPolicy= spellings.
        name: oomPolicyNames
        value: "[...]string{\"\", \"continue\", \"stop\", \"kill\"}"
      - doc: preserveNames are the FileDescriptorStorePreserve= spellings.
        name: preserveNames
        value: "[...]string{\"restart\", \"no\", \"yes\", \"on-success\"}"
      - doc: stateNames are the states' spellings.
        name: stateNames
        value: "[...]string{\"inactive\", \"activating\", \"active\", \"reloading\", \"deactivating\", \"failed\", \"auto-restart\", \"exited\", \"condition-skipped\"}"
      - doc: activeStates are systemd's ActiveState of each State.
        name: activeStates
        value: "[...]string{\"inactive\", \"activating\", \"active\", \"reloading\", \"deactivating\", \"failed\", \"activating\", \"active\", \"inactive\"}"
      - doc: subNames are systemd's SubState spellings.
        name: subNames
        value: |-
          [...]string{
          		"dead", "condition", "start-pre", "start", "start-post", "running", "exited",
          		"reload", "reload-signal", "reload-notify", "reload-post", "stop", "stop-watchdog",
          		"stop-sigterm", "stop-sigkill", "stop-post", "final-watchdog", "final-sigterm",
          		"final-sigkill", "failed", "auto-restart", "running-revalidating",
          	}
      - doc: resultNames are systemd's Result= spellings.
        name: resultNames
        value: |-
          [...]string{
          		"success", "resources", "protocol", "timeout", "exit-code", "signal",
          		"core-dump", "watchdog", "start-limit-hit", "oom-kill", "exec-condition",
          	}
    name: typeNames
  - grouped: true
    items:
      - doc: protectSystemNames are the ProtectSystem= spellings.
        name: protectSystemNames
        value: "[...]string{\"no\", \"yes\", \"full\", \"strict\"}"
      - doc: privateTmpNames are the PrivateTmp= spellings.
        name: privateTmpNames
        value: "[...]string{\"no\", \"yes\", \"disconnected\"}"
    name: protectSystemNames
