# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: "ControllerCPU distributes CPU time: cpu.weight, cpu.max, cpu.max.burst."
        name: ControllerCPU
        type: Controller
        value: iota + 1
      - doc: |-
          ControllerCPUSet pins tasks to CPUs and memory nodes: cpuset.cpus,
          cpuset.mems.
        name: ControllerCPUSet
      - doc: "ControllerIO distributes block I/O: io.weight, io.max, io.latency."
        name: ControllerIO
      - doc: |-
          ControllerMemory bounds memory: memory.min/low/high/max, the swap and
          zswap limits, memory.oom.group.
        name: ControllerMemory
      - doc: "ControllerPids bounds the number of tasks: pids.max."
        name: ControllerPids
      - doc: "ControllerHugeTLB bounds huge-page use: hugetlb.<size>.max."
        name: ControllerHugeTLB
      - doc: "ControllerRDMA bounds RDMA resources: rdma.max."
        name: ControllerRDMA
      - doc: "ControllerMisc bounds scalar resources the kernel lists: misc.max."
        name: ControllerMisc
    name: ControllerCPU
  - doc: |-
      LimitInfinity is the soft/hard value meaning "no limit" (RLIM_INFINITY). Use
      it in a LimitValue to lift a resource ceiling rather than setting a number.
    items:
      - name: LimitInfinity
        type: uint64
        value: ^uint64(0)
    name: LimitInfinity
  - grouped: true
    items:
      - doc: |-
          MemorySourceOperator reports that GOMEMLIMIT carried a non-empty value.
          The Go runtime has already applied it and the derivation stands aside:
          overriding an operator's explicit decision would contradict them silently.

          The run starts at iota+1 so the zero stays unminted — see the type comment.
        name: MemorySourceOperator
        type: MemorySource
        value: iota + 1
      - doc: |-
          MemorySourceUnconstrained reports that no control group governing this
          process declares a memory cap: not containerised, capped at "max", or not
          Linux at all. There is nothing to derive a limit from.
        name: MemorySourceUnconstrained
      - doc: |-
          MemorySourceBelowFloor reports that a cap was found but the limit derived
          from it fell under the usable floor. Holding the runtime beneath it would
          spin the collector continuously without averting the kill, so the
          derivation declines rather than applying a limit it expects to hurt.
        name: MemorySourceBelowFloor
      - doc: |-
          MemorySourceCgroup reports the only outcome that yields a limit: a real
          cap was read from the control-group hierarchy and the derived value is
          usable.
        name: MemorySourceCgroup
    name: MemorySourceOperator
  - grouped: true
    items:
      - doc: |-
          MemoryBoundHigh reports that a memory.high file bound the derivation: the
          throttle above which the kernel reclaims and slows the group's allocations,
          long before memory.max would kill it.

          The run starts at iota+1 so the zero stays unminted — see the type comment.
        name: MemoryBoundHigh
        type: MemoryBound
        value: iota + 1
      - doc: |-
          MemoryBoundMax reports that a hard cap bound the derivation: a cgroup v2
          memory.max file, or cgroup v1's memory.limit_in_bytes — v1 has no throttle
          to read beside it.
        name: MemoryBoundMax
    name: MemoryBoundHigh
  - grouped: true
    items:
      - doc: "ResourceUnknown is the reserved zero value: no resource selected."
        name: ResourceUnknown
        type: Resource
        value: iota
      - doc: |-
          ResourceNoFile limits the highest open file descriptor (RLIMIT_NOFILE),
          mapping systemd's LimitNOFILE=. A child spawned without it gets the
          supervisor's ORIGINAL soft limit, not the one the Go runtime raised at start,
          unless rlimit.KeepRaisedNoFile was called.
        name: ResourceNoFile
      - doc: |-
          ResourceNProc limits the number of processes for the real user id
          (RLIMIT_NPROC), mapping systemd's LimitNPROC=.
        name: ResourceNProc
      - doc: |-
          ResourceCore limits the size of a core dump in bytes (RLIMIT_CORE),
          mapping systemd's LimitCORE=.
        name: ResourceCore
      - doc: |-
          ResourceAS limits the process virtual address-space size (RLIMIT_AS),
          mapping systemd's LimitAS=.
        name: ResourceAS
      - doc: |-
          ResourceCPU limits CPU time in seconds (RLIMIT_CPU), mapping systemd's
          LimitCPU=.
        name: ResourceCPU
      - doc: |-
          ResourceFSize limits the largest file the process may create in bytes
          (RLIMIT_FSIZE), mapping systemd's LimitFSIZE=.
        name: ResourceFSize
      - doc: |-
          ResourceData limits the process data-segment size (RLIMIT_DATA), mapping
          systemd's LimitDATA=.
        name: ResourceData
      - doc: |-
          ResourceStack limits the process stack size (RLIMIT_STACK), mapping
          systemd's LimitSTACK=.
        name: ResourceStack
      - doc: |-
          ResourceMemLock limits bytes that may be locked into RAM (RLIMIT_MEMLOCK),
          mapping systemd's LimitMEMLOCK=.
        name: ResourceMemLock
    name: ResourceUnknown
  - grouped: true
    items:
      - doc: NamespaceUser clones the child into a new user namespace (CLONE_NEWUSER).
        name: NamespaceUser
        type: Namespace
        value: "1"
      - doc: NamespacePID clones the child into a new PID namespace, as its PID 1 (CLONE_NEWPID).
        name: NamespacePID
        type: Namespace
        value: "2"
      - doc: NamespaceMount gives the child a private copy of the mount namespace (CLONE_NEWNS).
        name: NamespaceMount
        type: Namespace
        value: "4"
      - doc: NamespaceIPC clones the child into a new IPC namespace (CLONE_NEWIPC).
        name: NamespaceIPC
        type: Namespace
        value: "8"
      - doc: NamespaceUTS clones the child into a new UTS namespace (CLONE_NEWUTS).
        name: NamespaceUTS
        type: Namespace
        value: "16"
      - doc: NamespaceNet clones the child into a new network namespace, with a loopback only (CLONE_NEWNET).
        name: NamespaceNet
        type: Namespace
        value: "32"
      - doc: |-
          NamespaceCgroup puts the child in a new cgroup namespace (CLONE_NEWCGROUP),
          rooted at the group it runs in, Spec.CgroupPath's when one is set — unshared
          once the child is placed there.
        name: NamespaceCgroup
        type: Namespace
        value: "64"
      - doc: NamespaceTime clones the child into a new time namespace (CLONE_NEWTIME, Linux 5.6).
        name: NamespaceTime
        type: Namespace
        value: "128"
      - doc: MountReadOnly binds Target onto itself and makes it read-only, recursively (systemd ReadOnlyPaths=) — the zero value.
        name: MountReadOnly
        type: MountKind
        value: "0"
      - doc: MountBind binds Source onto Target, recursively (systemd BindPaths=).
        name: MountBind
        type: MountKind
        value: "1"
      - doc: MountTmpfs mounts an empty tmpfs on Target, nosuid and nodev (systemd TemporaryFileSystem=).
        name: MountTmpfs
        type: MountKind
        value: "2"
      - doc: MountTmpfsSticky mounts an empty tmpfs on Target, mode 1777 — sticky, writable by all, as /tmp is —, nosuid and nodev (systemd PrivateTmp=).
        name: MountTmpfsSticky
        type: MountKind
        value: "3"
      - doc: LandlockExecute is LANDLOCK_ACCESS_FS_EXECUTE (ABI 1).
        name: LandlockExecute
        type: LandlockAccess
        value: "1"
      - doc: LandlockWriteFile is LANDLOCK_ACCESS_FS_WRITE_FILE (ABI 1).
        name: LandlockWriteFile
        type: LandlockAccess
        value: "2"
      - doc: LandlockReadFile is LANDLOCK_ACCESS_FS_READ_FILE (ABI 1).
        name: LandlockReadFile
        type: LandlockAccess
        value: "4"
      - doc: LandlockReadDir is LANDLOCK_ACCESS_FS_READ_DIR (ABI 1).
        name: LandlockReadDir
        type: LandlockAccess
        value: "8"
      - doc: LandlockRemoveDir is LANDLOCK_ACCESS_FS_REMOVE_DIR (ABI 1).
        name: LandlockRemoveDir
        type: LandlockAccess
        value: "16"
      - doc: LandlockRemoveFile is LANDLOCK_ACCESS_FS_REMOVE_FILE (ABI 1).
        name: LandlockRemoveFile
        type: LandlockAccess
        value: "32"
      - doc: LandlockMakeChar is LANDLOCK_ACCESS_FS_MAKE_CHAR (ABI 1).
        name: LandlockMakeChar
        type: LandlockAccess
        value: "64"
      - doc: LandlockMakeDir is LANDLOCK_ACCESS_FS_MAKE_DIR (ABI 1).
        name: LandlockMakeDir
        type: LandlockAccess
        value: "128"
      - doc: LandlockMakeReg is LANDLOCK_ACCESS_FS_MAKE_REG (ABI 1).
        name: LandlockMakeReg
        type: LandlockAccess
        value: "256"
      - doc: LandlockMakeSock is LANDLOCK_ACCESS_FS_MAKE_SOCK (ABI 1).
        name: LandlockMakeSock
        type: LandlockAccess
        value: "512"
      - doc: LandlockMakeFifo is LANDLOCK_ACCESS_FS_MAKE_FIFO (ABI 1).
        name: LandlockMakeFifo
        type: LandlockAccess
        value: "1024"
      - doc: LandlockMakeBlock is LANDLOCK_ACCESS_FS_MAKE_BLOCK (ABI 1).
        name: LandlockMakeBlock
        type: LandlockAccess
        value: "2048"
      - doc: LandlockMakeSym is LANDLOCK_ACCESS_FS_MAKE_SYM (ABI 1).
        name: LandlockMakeSym
        type: LandlockAccess
        value: "4096"
      - doc: LandlockRefer is LANDLOCK_ACCESS_FS_REFER (ABI 2, Linux 5.19).
        name: LandlockRefer
        type: LandlockAccess
        value: "8192"
      - doc: LandlockTruncate is LANDLOCK_ACCESS_FS_TRUNCATE (ABI 3, Linux 6.2).
        name: LandlockTruncate
        type: LandlockAccess
        value: "16384"
      - doc: LandlockIoctlDev is LANDLOCK_ACCESS_FS_IOCTL_DEV (ABI 5, Linux 6.10).
        name: LandlockIoctlDev
        type: LandlockAccess
        value: "32768"
      - doc: SeccompKill kills the whole process (SECCOMP_RET_KILL_PROCESS, Linux 4.14) — the zero value.
        name: SeccompKill
        type: SeccompAction
        value: "0"
      - doc: SeccompErrno fails the call with SeccompValue.Errno (SECCOMP_RET_ERRNO).
        name: SeccompErrno
        type: SeccompAction
        value: "1"
      - doc: SeccompAllow lets the call through (SECCOMP_RET_ALLOW).
        name: SeccompAllow
        type: SeccompAction
        value: "2"
    name: NamespaceUser
  - grouped: true
    items:
      - doc: SchedOther is the normal time-sharing policy (SCHED_OTHER) — the zero value.
        name: SchedOther
        type: SchedPolicy
        value: "0"
      - doc: SchedFIFO is the first-in first-out realtime policy (SCHED_FIFO).
        name: SchedFIFO
        type: SchedPolicy
        value: "1"
      - doc: SchedRR is the round-robin realtime policy (SCHED_RR).
        name: SchedRR
        type: SchedPolicy
        value: "2"
      - doc: SchedBatch is the policy for CPU-bound batch work (SCHED_BATCH).
        name: SchedBatch
        type: SchedPolicy
        value: "3"
      - doc: SchedIdle runs the child only when nothing else wants the CPU (SCHED_IDLE).
        name: SchedIdle
        type: SchedPolicy
        value: "5"
      - doc: IOClassNone sets no I/O class, the kernel deriving one from the CPU niceness — the zero value.
        name: IOClassNone
        type: IOClass
        value: "0"
      - doc: IOClassRealTime is the realtime I/O class (IOPRIO_CLASS_RT).
        name: IOClassRealTime
        type: IOClass
        value: "1"
      - doc: IOClassBestEffort is the best-effort I/O class (IOPRIO_CLASS_BE).
        name: IOClassBestEffort
        type: IOClass
        value: "2"
      - doc: IOClassIdle gets I/O only when no other process wants the disk (IOPRIO_CLASS_IDLE).
        name: IOClassIdle
        type: IOClass
        value: "3"
    name: SchedOther
  - doc: The realtime range's two names, as kill(1) and systemd spell them.
    grouped: true
    items:
      - doc: rtMinName is the range's first signal.
        name: rtMinName
        type: string
        value: "\"SIGRTMIN\""
      - doc: rtMaxName is the range's last signal.
        name: rtMaxName
        type: string
        value: "\"SIGRTMAX\""
    name: rtMinName
  - doc: |-
      The realtime signal range as a Linux program linked against glibc sees it:
      the kernel numbers 32 to 64, and glibc keeps 32 and 33 for its threads
      (SIGCANCEL, SIGSETXID), so SIGRTMIN is 34. A cgo build linking another libc
      may move SIGRTMIN; a pure Go program sees this range.
    grouped: true
    items:
      - doc: rtMin is SIGRTMIN.
        name: rtMin
        type: Signal
        value: "34"
      - doc: rtMax is SIGRTMAX.
        name: rtMax
        type: Signal
        value: "64"
    name: rtMin
  - grouped: true
    items:
      - doc: FDsSealed gives the child no descriptor of the supervisor's past its stdio and ExtraFiles — the zero value.
        name: FDsSealed
        type: FDPolicy
        value: "0"
      - doc: FDsInherited lets the child inherit every descriptor of the supervisor that lacks close-on-exec.
        name: FDsInherited
        type: FDPolicy
        value: "1"
    name: FDsSealed
  - grouped: true
    items:
      - doc: |-
          StdioInherit shares the parent's stdin/stdout/stderr with the child — the
          default, and the only behaviour that existed before per-process wiring.
        name: StdioInherit
        type: StdioMode
        value: iota
      - doc: |-
          StdioNull connects every stream to the platform null device: the child's
          output is discarded and its stdin returns EOF immediately.
        name: StdioNull
      - doc: |-
          StdioCapture connects the child to the Spec's Stdout/Stderr writers and
          Stdin reader; a nil writer or reader for a given stream falls back to the
          null device for that one stream.
        name: StdioCapture
      - doc: |-
          StdioPTY connects the child's stdin, stdout and stderr to the slave side of a
          new pseudo-terminal, which becomes its controlling terminal in a new session;
          the master is the handle's Terminal.TTY. Linux, darwin, FreeBSD and OpenBSD;
          every other platform refuses it with UnsupportedPlatform before spawning.
        name: StdioPTY
    name: StdioInherit
