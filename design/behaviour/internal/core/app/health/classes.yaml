# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: |-
          ProbeStartup asks "is this process still coming up?". While it answers
          no, the orchestrator must neither route to the replica nor restart it.

          The run starts at iota+1, not at iota: the zero is left unclaimed on
          purpose, so a Probe nobody set is a value this package never mints
          rather than the startup question answered by default.
        name: ProbeStartup
        type: Probe
        value: iota + 1
      - doc: |-
          ProbeReadiness asks "can this replica take traffic right now?". A no
          removes it from routing and never restarts it. Dependency checks belong
          here, and only here.
        name: ProbeReadiness
      - doc: |-
          ProbeLiveness asks "is this process irrecoverable?". A no restarts the
          replica, so only process-local evidence may contribute to it.
        name: ProbeLiveness
    name: ProbeStartup
  - grouped: true
    items:
      - doc: |-
          StatusUnhealthy is a failing critical check, or a probe with one. The
          replica must not take traffic (readiness) or is irrecoverable
          (liveness). It is the ZERO VALUE; see the type comment.
        name: StatusUnhealthy
        type: Status
        value: iota
      - doc: |-
          StatusDegraded is a failing NON-critical check, or a probe with one and
          no critical failure. It is a SERVING state: the replica keeps taking
          traffic. A degraded replica that stopped serving would make
          "non-critical" mean nothing.
        name: StatusDegraded
      - doc: |-
          StatusHealthy is every check passing — including the case where there
          are no checks at all (ADR 0031: an empty registry is legitimate, and
          the process answering the probe is the evidence).
        name: StatusHealthy
    name: StatusUnhealthy
