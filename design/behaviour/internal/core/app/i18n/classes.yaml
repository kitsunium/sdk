functions:
  - doc: buildPow10 fills the power table once, at package initialisation.
    name: buildPow10
    results: "[maxFractionDigits + 1]uint64"
  - name: Int
    params: n int64
    results: CountValue
  - name: Decimal
    params: value float64, fractionDigits int
    results: count CountValue, err error
  - doc: |-
      splitDecimal derives the operands i, f and v from a finite, non-negative
      value and a display precision. It is separate from [Decimal] so the refusals
      and the arithmetic read as two steps.
    name: splitDecimal
    params: abs float64, fractionDigits int
    results: CountValue
  - name: ParseForm
    params: name string
    results: form Form, err error
  - name: ValidateKey
    params: key Key
    results: error
  - name: NewCompiledMessage
    params: other PatternValue, plural []FormPatternValue
    results: message MessageValue, err error
  - name: NewPattern
    params: parts []PartValue
    results: body PatternValue, err error
  - name: ValidPlaceholder
    params: name string
    results: bool
  - doc: isNameStart reports whether b may begin a placeholder name.
    name: isNameStart
    params: b byte
    results: bool
  - name: NewTag
    params: language, script, region string
    results: tag TagValue, err error
  - doc: isRegion reports whether sub is an ISO 3166-1 alpha-2 or UN M.49 region.
    name: isRegion
    params: sub string
    results: bool
  - doc: isAlpha reports whether sub is non-empty and all ASCII letters.
    name: isAlpha
    params: sub string
    results: bool
  - doc: isDigit reports whether sub is non-empty and all ASCII digits.
    name: isDigit
    params: sub string
    results: bool
  - doc: appendLower appends sub to dst, ASCII-lowercased.
    name: appendLower
    params: dst []byte, sub string
    results: "[]byte"
  - doc: appendUpper appends sub to dst, ASCII-uppercased.
    name: appendUpper
    params: dst []byte, sub string
    results: "[]byte"
  - doc: |-
      appendTitle appends sub to dst with the first byte uppercased and the rest
      lowercased — the canonical case of an ISO 15924 script subtag.
    name: appendTitle
    params: dst []byte, sub string
    results: "[]byte"
  - doc: lowerByte folds one ASCII byte to lower case.
    name: lowerByte
    params: b byte
    results: byte
  - doc: upperByte folds one ASCII byte to upper case.
    name: upperByte
    params: b byte
    results: byte
imports:
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  strings: strings
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/app/i18n
  name: i18n
  purpose: Package i18n — ranges 0.2.30.* (ADR 0063 core/app/i18n block) and 0.3.60.* (ADR 0063 service/app/i18n block, declared here since ADR 0160).
types:
  - fields:
      - doc: |-
          integerPart is CLDR operand i: the integer digits of the ABSOLUTE
          value. CLDR's operands ignore the sign, and so does every rule:
          "-1 degree" is `one` in English exactly as "1 degree" is.
        name: integerPart
        type: uint64
      - doc: |-
          fractionValue is CLDR operand f: the visible fraction digits read as an
          integer, trailing zeros included.
        name: fractionValue
        type: uint64
      - doc: |-
          visibleFractionDigits is CLDR operand v: how many fraction digits the
          reader sees.
        name: visibleFractionDigits
        type: uint8
    kind: struct
    methods:
      - name: IntegerPart
        recv: c CountValue
        results: uint64
      - name: FractionValue
        recv: c CountValue
        results: uint64
      - name: VisibleFractionDigits
        recv: c CountValue
        results: int
      - name: IsIntegerValued
        recv: c CountValue
        results: bool
    name: CountValue
  - kind: named
    methods:
      - name: String
        recv: f Form
        results: string
      - name: Valid
        recv: f Form
        results: bool
    name: Form
    underlying: uint8
  - kind: named
    name: PluralRule
    underlying: func(count CountValue) Form
  - kind: named
    name: Args
    underlying: map[string]string
  - kind: named
    name: Key
    underlying: string
  - fields:
      - doc: other is the mandatory FormOther pattern.
        name: other
        type: PatternValue
      - doc: |-
          plural holds the remaining categories, ascending by Form. It is nil for
          a message with no plural forms, which is the common case and the one
          worth keeping small.
        name: plural
        type: "[]FormPatternValue"
    kind: struct
    methods:
      - name: Format
        params: form Form, args Args
        recv: m MessageValue
        results: rendered string, err error
      - doc: patternFor resolves a category to its compiled body.
        name: patternFor
        params: form Form
        recv: m MessageValue
        results: body PatternValue, ok bool
      - name: HasForm
        params: form Form
        recv: m MessageValue
        results: bool
      - name: IsPlural
        recv: m MessageValue
        results: bool
    name: MessageValue
  - fields:
      - doc: |-
          Form is the category. [FormOther] is never one of these: a message
          carries its `other` body out of line, and [NewCompiledMessage] refuses
          it here.
        name: Form
        type: Form
      - doc: Body is the compiled pattern for the category.
        name: Body
        type: PatternValue
    kind: struct
    name: FormPatternValue
  - fields:
      - doc: Text is the literal span. It is empty for a placeholder.
        name: Text
        type: string
      - doc: Name is the placeholder name. It is empty for a literal span.
        name: Name
        type: string
    kind: struct
    name: PartValue
  - fields:
      - doc: parts is the compiled span list, in order.
        name: parts
        type: "[]PartValue"
      - doc: size is the sum of the literal lengths, used to size the builder.
        name: size
        type: int
      - doc: |-
          set distinguishes a compiled EMPTY pattern from a pattern that was never
          compiled at all.
        name: set
        type: bool
    kind: struct
    methods:
      - doc: literal returns the pattern's text when it needs no substitution at all.
        name: literal
        recv: p PatternValue
        results: text string, ok bool
      - doc: expand renders a pattern that carries at least one placeholder.
        name: expand
        params: args Args
        recv: p PatternValue
        results: rendered string, err error
    name: PatternValue
  - fields:
      - doc: |-
          canonical is the canonical form: lowercase language, Titlecase script,
          UPPERCASE alpha region. The three accessors slice it, so they cost
          nothing and cannot disagree with it.
        name: canonical
        type: string
      - doc: |-
          langN, scriptN and regionN are the subtag lengths inside canonical. A
          zero scriptN or regionN means the subtag is absent.
        name: langN
        type: uint8
      - doc: |-
          langN, scriptN and regionN are the subtag lengths inside canonical. A
          zero scriptN or regionN means the subtag is absent.
        name: scriptN
        type: uint8
      - doc: |-
          langN, scriptN and regionN are the subtag lengths inside canonical. A
          zero scriptN or regionN means the subtag is absent.
        name: regionN
        type: uint8
    kind: struct
    methods:
      - name: String
        recv: t TagValue
        results: string
      - name: IsZero
        recv: t TagValue
        results: bool
      - name: Language
        recv: t TagValue
        results: string
      - name: Script
        recv: t TagValue
        results: string
      - name: Region
        recv: t TagValue
        results: string
      - name: Parent
        recv: t TagValue
        results: parent TagValue, ok bool
    name: TagValue
vars:
  - doc: |-
      pow10 indexes 10^n for n in 0..maxFractionDigits.

      It is built by multiplication rather than written out, for the reason the
      table exists at all: math.Pow returns a float64 whose nearest representable
      value for 10^7 is not exactly 10000000, and a hand-written literal table is
      ten numbers a reviewer has to count the zeros in.
    items:
      - name: pow10
        value: buildPow10()
    name: pow10
  - doc: |-
      formNames maps each category to the name CLDR spells it with — the same
      spelling a catalogue file uses.
    items:
      - name: formNames
        value: |-
          [formCount]string{
          	FormOther: "other",
          	FormZero:  "zero",
          	FormOne:   "one",
          	FormTwo:   "two",
          	FormFew:   "few",
          	FormMany:  "many",
          }
    name: formNames
