# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxFractionDigits bounds [Decimal]'s second argument. Ten fraction digits
      would already exceed float64's honest precision for most integer parts, and
      the operand f is an integer of that many digits — so the bound is where the
      arithmetic stops being able to tell the truth, not a round number.
    items:
      - name: maxFractionDigits
        type: int
        value: "9"
    name: maxFractionDigits
  - doc: decimalBase is ten, because that is what a fraction DIGIT is worth.
    items:
      - name: decimalBase
        type: uint64
        value: "10"
    name: decimalBase
  - doc: The six categories, `other` first so it is the zero value.
    grouped: true
    items:
      - doc: |-
          FormOther is the catch-all category. Every language defines it and
          every message is required to carry it.
        name: FormOther
        type: Form
        value: iota
      - doc: |-
          FormZero is used by languages with a distinct form for nought — Arabic
          and Latvian among them. Most languages do not have it.
        name: FormZero
      - doc: FormOne is the singular of languages that have one.
        name: FormOne
      - doc: FormTwo is the dual — Arabic, Slovenian, Welsh.
        name: FormTwo
      - doc: FormFew is the small-plural of the Slavic and Semitic families.
        name: FormFew
      - doc: |-
          FormMany is the large-plural, and in several Romance languages the
          compact-decimal form ("1 million").
        name: FormMany
      - doc: |-
          formCount bounds the enum. It is unexported: it is a size, not a
          category, and exporting it would put a seventh value in the public
          vocabulary of a specification that defines six.
        name: formCount
    name: FormOther
  - doc: The two ASCII bounds that make a key unsafe to print.
    grouped: true
    items:
      - doc: |-
          asciiSpace is the lowest printable ASCII byte; everything below it is a
          C0 control character.
        name: asciiSpace
        type: byte
        value: "0x20"
      - doc: |-
          asciiDelete is DEL, the one control character above the printable
          range.
        name: asciiDelete
        type: byte
        value: "0x7F"
    name: asciiSpace
  - doc: |-
      argSizeGuess is the number of bytes [MessageValue.Format] assumes a
      substituted value will occupy when it sizes the builder. It is a HINT: too
      small costs one growth, too large costs untouched capacity, and neither is a
      correctness question. Sixteen covers a formatted count, a short name and a
      filename stem; internal/service/app/i18n/BENCH.md reports the resulting
      allocations per render.
    items:
      - name: argSizeGuess
        type: int
        value: "16"
    name: argSizeGuess
  - doc: The subtag lengths BCP 47 fixes for the three positions this domain admits.
    grouped: true
    items:
      - doc: minLanguageLen is the shortest ISO 639 language subtag ("fr").
        name: minLanguageLen
        type: int
        value: "2"
      - doc: |-
          maxLanguageLen is the longest one this domain accepts ("fil"). BCP 47
          also registers 4-letter (reserved) and 5-to-8-letter subtags; both are
          refused — see [NewTag].
        name: maxLanguageLen
        type: int
        value: "3"
      - doc: scriptLen is the ISO 15924 script subtag length, always 4 ("Hant").
        name: scriptLen
        type: int
        value: "4"
      - doc: regionAlphaLen is the ISO 3166-1 alpha-2 region length ("CA").
        name: regionAlphaLen
        type: int
        value: "2"
      - doc: regionDigitLen is the UN M.49 numeric region length ("419").
        name: regionDigitLen
        type: int
        value: "3"
      - doc: separatorLen is the one byte a subtag separator occupies.
        name: separatorLen
        type: int
        value: "1"
      - doc: |-
          maxTagLen is "fil-Hant-419": the longest canonical form the subset can
          produce. It sizes the stack buffer NewTag canonicalises into.
        name: maxTagLen
        type: int
        value: maxLanguageLen + separatorLen + scriptLen + separatorLen + regionDigitLen
      - doc: asciiCaseBit is the single bit that separates 'a' from 'A'.
        name: asciiCaseBit
        type: byte
        value: "'a' - 'A'"
    name: minLanguageLen
