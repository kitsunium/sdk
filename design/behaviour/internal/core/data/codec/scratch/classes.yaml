          recycler.NewCappedPool[*bytes.Buffer](
          		func() *bytes.Buffer { return new(bytes.Buffer) },
          		func(b *bytes.Buffer) { b.Reset() },
          		func(b *bytes.Buffer) int { return b.Cap() },
          		MaxRetainedBufBytes,
