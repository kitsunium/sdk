# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The reasons a bound refusal carries in every codec of the family (#894):
      the per-format code is the origin, the reason is shared, so one test answers
      "too large" or "too deep" across the formats.
    grouped: true
    items:
      - doc: reasonSizeExceeded is the family's reason for input past a size bound.
        name: reasonSizeExceeded
        type: string
        value: "\"SIZE_EXCEEDED\""
      - doc: reasonDepthExceeded is the family's reason for input past a depth bound.
        name: reasonDepthExceeded
        type: string
        value: "\"DEPTH_EXCEEDED\""
      - doc: reasonLimitExceeded is multipart's older spelling of a size refusal.
        name: reasonLimitExceeded
        type: string
        value: "\"LIMIT_EXCEEDED\""
      - doc: reasonDocumentTooLarge is strictjson's older spelling of one.
        name: reasonDocumentTooLarge
        type: string
        value: "\"DOCUMENT_TOO_LARGE\""
    name: reasonSizeExceeded
  - doc: |-
      sniffLen is how many bytes of an input Detect reads at most: the 512
      http.DetectContentType reads, so a caller that already peeked that much for
      the standard library passes the same slice.
    items:
      - name: sniffLen
        type: int
        value: "512"
    name: sniffLen
  - doc: The fields the misuse refusals carry (#1101).
    grouped: true
    items:
      - doc: fieldTarget names the type of a refused Unmarshal or Decode target.
        name: fieldTarget
        type: string
        value: "\"target\""
      - doc: fieldType names the type of a refused Marshal value.
        name: fieldType
        type: string
        value: "\"type\""
      - doc: nilTarget is what fieldTarget says for an untyped nil.
        name: nilTarget
        type: string
        value: "\"nil\""
    name: fieldTarget
  - doc: |-
      The keys a decode refusal carries its position under (#1125): every codec
      writes them through PositionFields or by these names, so PositionOf reads
      any codec's position back.
    grouped: true
    items:
      - doc: FieldOffset is the key of a refusal's 0-based byte offset.
        name: FieldOffset
        value: "\"offset\""
      - doc: FieldLine is the key of a refusal's 1-based line.
        name: FieldLine
        value: "\"line\""
      - doc: |-
          FieldColumn is the key of a refusal's 1-based column, counted as the format
          counts it: characters for yaml and toml, bytes for csv.
        name: FieldColumn
        value: "\"column\""
    name: FieldOffset
  - doc: The slots of the three coordinates, in the order PositionFields writes them.
    grouped: true
    items:
      - doc: slotOffset is the byte offset's slot.
        name: slotOffset
        type: int
        value: iota
      - doc: slotLine is the line's slot.
        name: slotLine
      - doc: slotColumn is the column's slot.
        name: slotColumn
      - doc: positionFieldCount is how many fields a position can carry.
        name: positionFieldCount
    name: slotOffset
files:
  - decls:
      - reasonSizeExceeded
      - IsTooLarge
      - IsTooDeep
    name: bounds.go
  - decls:
      - sniffLen
      - sniffEntry
      - sniffers
      - indexSniffer
      - Detect
    name: detect.go
  - decls: []
    name: doc.go
  - decls:
      - conflictText
    name: errors.go
  - decls:
      - Format
      - Format.Known
      - Format.String
    name: format.go
  - decls:
      - fieldTarget
      - CheckTarget
      - CheckValue
      - IsMisuse
    name: misuse.go
  - decls:
      - FieldOffset
      - slotOffset
      - PositionValue
      - PositionFields
      - PositionOf
      - coordinate
    name: position.go
  - decls:
      - registry
      - Register
      - publishCodec
      - refuseEmptyKeys
      - refuseEmptyAliases
      - indexAliases
      - normalizeMIME
      - publishAlias
      - Lookup
      - LookupMIME
      - LookupExt
      - Available
    name: registry.go
functions:
  - name: IsTooLarge
    params: err error
    results: bool
  - name: IsTooDeep
    params: err error
    results: bool
  - doc: |-
      indexSniffer appends c to Detect's list when it implements Sniffer. Register
      calls it once the Format is c's, so a codec refused for a conflict never
      sniffs.
    name: indexSniffer
    params: name Format, c Codec
  - name: Detect
    params: prefix []byte
    results: f Format, ok bool
  - doc: |-
      conflictText renders a registry conflict for the boot panic that reports it:
      the typed error's header and Public, then each field it carries, quoted.
      Error() never renders a field (rule 4), and the panic is the only place an
      operator learns WHICH key collided and which codec already held it.
    name: conflictText
    params: err error
    results: string
  - name: CheckTarget
    params: v any
    results: error
  - name: CheckValue
    params: v any
    results: error
  - name: IsMisuse
    params: err error
    results: bool
  - name: PositionFields
    params: p PositionValue
    results: "[]errs.FieldValue"
  - name: PositionOf
    params: err error
    results: p PositionValue, ok bool
  - doc: |-
      coordinate returns the slot and the member of p that key names, or a nil
      member for a key that is not a coordinate.
    name: coordinate
    params: p *PositionValue, key string
    results: slot int, dst *int
  - name: Register
    params: c Codec
    results: Codec
  - doc: |-
      publishCodec claims name for c. Returns a non-nil error when name is already
      registered — to ANY codec, the same one included: a Format registers once,
      whereas the alias indexes and the other core registries accept the identical
      value again as a no-op. The caller turns the error into a panic so the
      boot-time failure is loud and grep-friendly. The check and the insert are one
      atomic step.
    name: publishCodec
    params: name Format, c Codec
    results: error
  - doc: |-
      refuseEmptyKeys panics with KEY_EMPTY when c's Name, or one of its MIME
      types or extensions once normalised the way the matching Lookup* normalises
      it, is empty. An empty key is no key at all — LookupMIME and LookupExt miss
      on "" — and it is exactly what a package variable holds when Register reads
      it before its initialiser ran: two codecs in that state both hold "", and
      the second used to die on a DUPLICATE_REGISTRATION naming the FIRST, a
      collision that blamed the wrong codec and hid the cause (supervizio/agent#305).
    name: refuseEmptyKeys
    params: c Codec, name Format, mimes, exts []string
  - doc: |-
      refuseEmptyAliases panics with KEY_EMPTY on the first alias of kind that
      normalize reduces to "", naming the codec, the slot and the raw value.
    name: refuseEmptyAliases
    params: aliases []string, name Format, kind string, normalize func(string) string
  - doc: |-
      indexAliases stores every alias (MIME or extension) in dst, panicking
      when a distinct codec already claims the same key. normalize reduces each
      raw alias to its index key — strings.ToLower for extensions, normalizeMIME
      for MIME types so registration and LookupMIME agree on the key (issue #36).
      Empty keys never reach it: refuseEmptyKeys ran first.
    name: indexAliases
    params: dst *plugin.Registry[string, Format], aliases []string, name Format, kind string, normalize func(string) string
  - doc: |-
      normalizeMIME reduces a raw MIME string to the canonical index key shared by
      registration and LookupMIME: the media type alone (parameters stripped),
      lowercased and trimmed. Sharing this between the two paths is what guarantees
      a registered MIME is reachable — the asymmetry it removes was issue #36.
    name: normalizeMIME
    params: raw string
    results: string
  - doc: |-
      publishAlias inserts (key → name) into an alias index. Returns a non-nil
      error when key is already claimed by a different Format; idempotent
      re-registration by the same Format is accepted. The check, the insert and
      the owner the error names are one atomic step.
    name: publishAlias
    params: dst *plugin.Registry[string, Format], key string, name Format, kind, alias string
    results: error
  - name: Lookup
    params: f Format
    results: c Codec, ok bool
  - name: LookupMIME
    params: raw string
    results: c Codec, ok bool
  - name: LookupExt
    params: ext string
    results: c Codec, ok bool
  - name: Available
    results: "[]Format"
imports:
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
  mime: mime
  plugin: github.com/kitsunium/sdk/internal/kernel/plugin
  reflect: reflect
  snapshot: github.com/kitsunium/sdk/internal/kernel/concur/snapshot
  strconv: strconv
  strings: strings
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/core/data/codec
  name: codec
  purpose: Package codec — declares the optional Appender extension that hot-path encoders (NDJSON, JSON, text) implement so callers can write into a caller-supplied buffer without paying for an intermediate allocation.
types:
  - doc: |-
      sniffEntry is one codec Detect asks: the Format it registered under, and its
      Sniffer.
    fields:
      - doc: name is the Format Detect answers when this codec alone claims the bytes.
        name: name
        type: Format
      - doc: sniffer is the codec's Sniffer.
        name: sniffer
        type: Sniffer
    kind: struct
    name: sniffEntry
  - kind: named
    methods:
      - name: Known
        recv: f Format
        results: bool
      - name: String
        recv: f Format
        results: string
    name: Format
    underlying: string
  - fields:
      - doc: Offset is the 0-based byte offset of the problem in the input.
        name: Offset
        type: int
      - doc: Line is the 1-based line of the problem, zero when unknown.
        name: Line
        type: int
      - doc: Column is the 1-based column of the problem, zero when unknown.
        name: Column
        type: int
    kind: struct
    name: PositionValue
vars:
  - doc: |-
      sniffers lists, in registration order, every registered codec implementing
      Sniffer. Like the registry it is written once per codec at import and read
      on every Detect: a copy-on-write slice behind one atomic load, so Detect
      takes no lock and allocates nothing.
    items:
      - name: sniffers
        type: snapshot.Value[[]sniffEntry]
    name: sniffers
  - doc: |-
      Package-level indexes.

      Each is the kernel's read-mostly, copy-on-write table (kernel/plugin.Registry,
      ADR 0159): codec packages register themselves exactly ONCE at package import
      time (their package-level var initializer calls Register), and every other
      access is a read (Lookup / LookupMIME / LookupExt) — one atomic pointer load
      and a map read, no lock. A frozen-after-init map read that way is ~30% faster
      than sync.Map.Load + the interface-to-Codec type assertion (microbench: 9.1 ns
      vs 12.8 ns) and avoids the dirty-map fallback machinery sync.Map carries for
      the write-mostly workloads we never trigger.

      The MIME and extension indexes are the codec's own, kept BESIDE the Format
      table rather than inside it (the kernel table has no second index); what is
      shared is the mechanism, and what stays here is the domain: the strict rule on
      a Format name, the alias normalisation, and the conflict's code and fields.
    grouped: true
    items:
      - name: registry
        type: plugin.Registry[Format, Codec]
      - name: mimeIndex
        type: plugin.Registry[string, Format]
      - name: extIndex
        type: plugin.Registry[string, Format]
    name: registry
