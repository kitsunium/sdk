functions:
  - name: Unique
    params: name string, key func(T) string
    results: IndexSpec[T]
    typeParams: T any
  - name: Index
    params: name string, keys func(T) []string
    results: IndexSpec[T]
    typeParams: T any
  - name: Ordered
    params: name string, key func(T) string
