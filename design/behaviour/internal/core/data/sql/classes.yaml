# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: DialectUnknown is the unusable zero value.
        name: DialectUnknown
        type: Dialect
        value: iota
      - doc: |-
          DialectPostgres is PostgreSQL 9.1+ (and wire-compatible engines that
          implement pg_advisory_lock, e.g. CockroachDB advertises the function
          but the caller must verify it is a real lock before claiming this).
        name: DialectPostgres
      - doc: DialectMySQL is MySQL 5.7+ / MariaDB 10.x with InnoDB.
        name: DialectMySQL
      - doc: DialectSQLite is SQLite 3.6.8+.
        name: DialectSQLite
    name: DialectUnknown
  - doc: |-
      decimalBase is the radix a version is rendered in when it travels as an
      error field. Named because 10 appearing four times in one file is exactly
      the kind of literal that gets "fixed" to 16 by a well-meaning edit.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
files:
  - decls: []
    name: doc.go
  - decls:
      - TxFunc
    name: sql.go
  - decls:
      - Dialect
      - DialectUnknown
      - dialectNames
      - Dialect.String
