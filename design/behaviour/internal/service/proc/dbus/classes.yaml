package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/dbus
  name: dbus
  purpose: "Package dbus is the SDK's message bus client (kitsunium/sdk#737, ADR 0214's S0e amendment): what a supervisor needs of a D-Bus daemon to run systemd's Type=dbus — who owns a well-known name, and every change of it — and what a supervised Go service needs to be one: owning its name."
types:
  - fields:
      - name: nc
        type: net.Conn
      - name: r
        type: "*bufio.Reader"
      - doc: done closes once the connection ended.
        name: done
        type: chan struct{}
      - doc: |-
          pending are the calls waiting for a reply, by serial; watches the
          names watched. Guarded by mu.
        name: pending
        type: map[uint32]*pending
      - name: watches
        type: map[string][]*watch
      - doc: cause is why the connection ended. Guarded by mu.
        name: cause
        type: error
      - doc: uniqueName is the connection's name on the bus, Hello's answer.
        name: uniqueName
        type: string
      - doc: wg joins the reader and every watch's goroutine.
        name: wg
        type: sync.WaitGroup
      - doc: doneOnce closes done.
        name: doneOnce
        type: sync.Once
      - name: mu
        type: sync.Mutex
      - doc: wmu writes one message at a time.
        name: wmu
        type: sync.Mutex
      - name: serial
        type: atomic.Uint32
      - doc: closed refuses every new call and watch. Guarded by mu.
        name: closed
        type: bool
    kind: struct
    methods:
      - name: UniqueName
        recv: c *Conn
        results: string
      - name: NameOwner
        params: ctx context.Context, name string
        recv: c *Conn
        results: string, error
      - name: RequestName
        params: ctx context.Context, name string
        recv: c *Conn
        results: bool, error
      - name: ReleaseName
        params: ctx context.Context, name string
        recv: c *Conn
        results: bool, error
      - name: Close
        recv: c *Conn
        results: error
      - doc: answer sends a call whose reply is one uint32, and returns it.
        name: answer
        params: ctx context.Context, cv *callValue
        recv: c *Conn
        results: uint32, error
      - doc: |-
          call sends cv and returns its method return; an error message is
          CALL_FAILED naming it.
        name: call
        params: ctx context.Context, cv *callValue
        recv: c *Conn
        results: "*message, error"
      - doc: |-
          roundTrip sends cv and returns its reply, a method return or an error
          message; onReply runs in the reader as the reply is read.
        name: roundTrip
        params: ctx context.Context, cv *callValue, onReply func(*message)
        recv: c *Conn
        results: "*message, error"
      - doc: lateReply is a reply read before the connection ended, or CONN_CLOSED.
        name: lateReply
        params: p *pending
        recv: c *Conn
        results: "*message, error"
      - doc: nextSerial is the next serial, never 0.
        name: nextSerial
        recv: c *Conn
        results: uint32
      - doc: forget drops a call nobody waits for.
        name: forget
        params: serial uint32
        recv: c *Conn
      - doc: |-
          send writes one call, within ctx's deadline. A message half written leaves
          the stream unreadable: a failed write ends the connection.
        name: send
        params: ctx context.Context, serial uint32, cv *callValue
        recv: c *Conn
        results: error
      - doc: |-
          fail ends the connection for cause (nil for Close): no new call or watch,
          the socket closed, which ends the reader.
        name: fail
        params: cause error
        recv: c *Conn
      - doc: read reads every message until the connection ends, and ends it.
        name: read
        recv: c *Conn
      - doc: |-
          end closes the connection after its reader stopped: every call waiting and
          every watch learn it through done.
        name: end
        params: cause error
        recv: c *Conn
      - doc: |-
          dispatch hands one message: a reply to its call, NameOwnerChanged to its
          watches; a method call another peer sends is dropped, as is a type the
          specification lets a reader ignore.
        name: dispatch
        params: m *message
        recv: c *Conn
      - doc: reply hands the bus driver's reply to the call it answers.
        name: reply
        params: m *message
        recv: c *Conn
      - doc: |-
          announced hands the bus driver's NameOwnerChanged to the name's watches
          that looked their owner up already: an announcement read before the lookup
          is older than it.
        name: announced
        params: m *message
        recv: c *Conn
      - name: WatchName
        params: ctx context.Context, name string
        recv: c *Conn
        results: <-chan string, error
      - doc: register adds w to the name's watches, unless the connection is closed.
        name: register
        params: w *watch
        recv: c *Conn
        results: bool
      - doc: |-
          track counts one more goroutine for Close to join, unless the connection is
          closed — under mu, so it happens before Close waits.
        name: track
        recv: c *Conn
        results: bool
      - doc: unwatch removes w from the name's watches.
        name: unwatch
        params: w *watch
        recv: c *Conn
      - doc: |-
          looked takes the lookup's reply in the reader, before the next message is
          read: the owner first, every announcement read from now on after it.
        name: looked
        params: w *watch, m *message
        recv: c *Conn
      - doc: deliver hands w's owners to out, in order, until ctx or the connection ends.
        name: deliver
        params: ctx context.Context, w *watch, out chan<- string, rule string
        recv: c *Conn
      - doc: head is w's oldest owner not delivered.
        name: head
        params: w *watch
        recv: c *Conn
        results: string, bool
      - doc: pop drops w's oldest owner, delivered.
        name: pop
        params: w *watch
        recv: c *Conn
      - doc: |-
          removeMatch asks the bus to stop announcing a watch's name, without
          waiting for its answer.
        name: removeMatch
        params: rule string
        recv: c *Conn
    name: Conn
  - doc: |-
      pending is one call waiting for its reply; onReply, when set, runs in the
      reader before the next message is read.
    fields:
      - name: reply
        type: chan *message
      - name: onReply
        type: func(*message)
    kind: struct
    name: pending
  - doc: |-
      watch is one watch of a name: the owners not yet delivered, oldest first,
      and whether its lookup was read — an announcement read before it is older
      than it. Its queue and ready are guarded by the connection's mu.
    fields:
      - name: name
        type: string
      - name: queue
        type: "[]string"
      - name: wake
        type: chan struct{}
      - name: ready
        type: bool
    kind: struct
    methods:
      - doc: |-
          push queues an owner announced, under the connection's mu: past
          maxBacklog the newest is coalesced into the last, the oldest kept.
        name: push
        params: owner string
        recv: w *watch
      - doc: nudge wakes the watch's goroutine, once.
        name: nudge
        recv: w *watch
    name: watch
  - doc: |-
      message is one message read: its header and its body, the body nil when it
      was past maxBodyBytes and dropped; bodyLen and fieldLen are the lengths its
      fixed header announced.
    fields:
      - name: order
        type: binary.ByteOrder
      - name: path
        type: string
      - name: iface
        type: string
      - name: member
        type: string
      - name: errName
        type: string
      - name: dest
        type: string
      - name: sender
        type: string
      - name: sig
        type: string
      - name: body
        type: "[]byte"
      - name: serial
        type: uint32
      - name: replySerial
        type: uint32
      - name: bodyLen
        type: uint32
      - name: fieldLen
        type: uint32
      - name: typ
        type: byte
      - name: flags
        type: byte
    kind: struct
    methods:
      - doc: |-
          parseFields reads the header's field array: every field the client knows,
          the others skipped when their value is a basic type.
        name: parseFields
        params: b []byte
        recv: m *message
        results: error
      - doc: field reads one header field's value into the message.
        name: field
        params: d *decoder, code, typ byte
        recv: m *message
        results: error
      - doc: strings reads a body of n strings, which its signature must say.
        name: strings
        params: n int
        recv: m *message
        results: "[]string, bool"
      - doc: uint32 reads a body of one uint32.
        name: uint32
        recv: m *message
        results: uint32, bool
    name: message
  - doc: |-
      discarder is what a message is read from: bytes, and a body dropped
      unread.
    kind: named
    name: discarder
    underlying: |-
      interface {
      	io.Reader
      	// Discard skips the next n bytes.
      	Discard(n int) (discarded int, err error)
      }
  - doc: |-
      encoder writes a message, little-endian, aligning each value on its
      offset from the message's start.
    fields:
      - name: b
        type: "[]byte"
    kind: struct
    methods:
      - doc: pad aligns the next value on n bytes.
        name: pad
        params: n int
        recv: e *encoder
      - doc: u32 writes a uint32.
        name: u32
        params: v uint32
        recv: e *encoder
      - doc: "str writes a string or an object path: its length, its bytes, a NUL."
        name: str
        params: s string
        recv: e *encoder
      - doc: "sig writes a signature: its length on one byte, its bytes, a NUL."
        name: sig
        params: s string
        recv: e *encoder
      - doc: |-
          field writes one header field: its code and a variant holding a string
          ('s'), an object path ('o') or a signature ('g').
        name: field
        params: code, typ byte, value string
        recv: e *encoder
    name: encoder
  - doc: |-
      callValue is one method call to the bus driver: its member, its body's
      signature and the body's arguments — strings, then a uint32 when sig ends
      in "u".
    fields:
      - name: member
        type: string
      - name: sig
        type: string
      - name: strs
        type: "[]string"
      - name: u
        type: uint32
      - name: flags
        type: byte
    kind: struct
    name: callValue
  - doc: |-
      decoder reads values aligned on their offset from the message's start
      (base is b's offset there).
    fields:
      - name: order
        type: binary.ByteOrder
      - name: b
        type: "[]byte"
      - name: base
        type: int
      - name: "off"
        type: int
    kind: struct
    methods:
      - doc: align skips the padding up to n bytes, which must lie within b.
        name: align
        params: n int
        recv: d *decoder
        results: bool
      - doc: byte reads one byte.
        name: byte
        recv: d *decoder
        results: byte, bool
      - doc: u32 reads a uint32.
        name: u32
        recv: d *decoder
        results: uint32, bool
      - doc: |-
          string reads a string or an object path: its length, valid UTF-8 without
          NUL, and its terminating NUL.
        name: string
        recv: d *decoder
        results: string, bool
      - doc: "signature reads a signature: its length on one byte, its bytes, a NUL."
        name: signature
        recv: d *decoder
        results: string, bool
      - doc: text reads n bytes and the NUL that ends them.
        name: text
        params: n int
        recv: d *decoder
        results: string, bool
      - doc: skip skips one value of a basic type; a container is not skipped.
        name: skip
        params: typ byte
        recv: d *decoder
        results: bool
    name: decoder
vars:
  - doc: basicSizes are the fixed-size basic types a skipped header field may hold.
    items:
      - name: basicSizes
        value: |-
          map[byte]int{
          	'y': sizeByte, 'n': sizeInt16, 'q': sizeInt16, 'b': sizeInt32, 'i': sizeInt32,
          	'u': sizeInt32, 'h': sizeInt32, 'x': sizeInt64, 't': sizeInt64, 'd': sizeInt64,
          }
    name: basicSizes
