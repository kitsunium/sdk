functions:
  - name: SystemBusAddress
    results: string
  - name: SessionBusAddress
    results: string
  - doc: |-
      socketOf is the socket the first usable entry of address names: a path, or
      "@" and an abstract name, as package net dials it.
    name: socketOf
    params: address string
    results: string, error
  - doc: |-
      unixSocket reads one entry: unix: with exactly one of path= and abstract=,
      each value unescaped; any other transport or key is not one the client
      dials.
    name: unixSocket
    params: entry string
    results: string, bool
  - doc: |-
      unixKey reads one key=value of a unix entry over socket, the socket named
      so far: path= and abstract= name it, once; guid= is not checked; a
      listening key (tmpdir, dir, runtime), a second socket or a value that does
      not unescape is refused.
    name: unixKey
    params: kv, socket string
    results: string, bool
  - doc: |-
      unescape decodes a value's %XX escapes; a truncated or non-hex escape is
      refused.
    name: unescape
    params: v string
    results: string, bool
  - doc: escapeValue escapes every byte of v outside [-0-9A-Za-z_/.\*].
    name: escapeValue
    params: v string
    results: string
  - doc: |-
      authenticate runs AUTH EXTERNAL over w with no identity of its own,
      reading the bus's answers from r: nil once the bus said OK and was told
      BEGIN.
    name: authenticate
    params: w io.Writer, r io.ByteReader
    results: error
  - doc: |-
      noIdentity answers the bus's DATA with an empty one — the identity the
      kernel gives of the socket's peer — and returns the bus's next answer.
    name: noIdentity
    params: w io.Writer, r io.ByteReader
    results: verb, rest string, err error
  - doc: |-
      authVerdict acts on the bus's verdict, verb and the rest of its line: OK
      is answered BEGIN.
    name: authVerdict
    params: w io.Writer, verb, rest string
    results: error
  - doc: authAnswer reads one line of the bus as its verb and the rest.
    name: authAnswer
    params: r io.ByteReader
    results: verb, rest string, err error
  - doc: authLine reads one line of the bus, without its CRLF, within maxAuthLine.
    name: authLine
    params: r io.ByteReader
    results: string, error
  - doc: unreachable wraps a connection's failure as BUS_UNREACHABLE.
    name: unreachable
    params: cause error
    results: error
  - doc: unreachableOrNil is nil for nil, BUS_UNREACHABLE otherwise.
    name: unreachableOrNil
    params: err error
    results: error
  - name: NewConn
    params: ctx context.Context, address string
    results: "*Conn, error"
  - doc: |-
      open authenticates over nc, starts the reader and says Hello; a
      failure closes nc.

      Goroutine lifecycle: the reader, ended when nc is — Close, the bus's
      hang-up, a message the client cannot read —; joined by Close.
    name: open
    params: ctx context.Context, nc net.Conn
    results: "*Conn, error"
  - doc: |-
      handshake runs the authentication within ctx and callTimeout: the sooner
      deadline, and ctx's cancellation through an expired one, end a read or a
      write in flight.
    name: handshake
    params: ctx context.Context, nc net.Conn, r io.ByteReader
    results: error
  - doc: |-
      deadlineCause is context.DeadlineExceeded when the deadline that passed was
      the context's, nil when it was the client's own bound.
    name: deadlineCause
    params: byCtx bool
    results: error
  - doc: isTimeout reports a read or a write that passed its deadline.
    name: isTimeout
    params: err error
    results: bool
  - doc: "ownerOf reads GetNameOwner's reply: the owner, empty for NameHasNoOwner."
    name: ownerOf
    params: m *message
    results: string, error
  - doc: callFailed is CALL_FAILED naming the method and the bus's error.
    name: callFailed
    params: method, errName string
    results: error
  - doc: |-
      ended is a call whose context ended: CALL_TIMEOUT for its deadline,
      CALL_CANCELLED otherwise, ctx's error in the chain.
    name: ended
    params: method string, cause error
    results: error
  - doc: |-
      timedOut is CALL_TIMEOUT naming the method, cause — a deadline that
      passed — in the chain when there is one.
    name: timedOut
    params: method string, cause error
    results: error
  - doc: |-
      gone takes an error nobody can act on: a deadline on a connection that is
      closing, a socket closed whatever its close says.
    name: gone
    params: err error
  - doc: checkName refuses a name that is not a well-known bus name (NAME_INVALID).
    name: checkName
    params: name string
    results: error
  - doc: |-
      validName reports a well-known bus name: two elements or more separated by
      dots, each of [A-Za-z0-9_-] and not opening with a digit, 255 bytes at
      most. A unique name (":1.42") is not one.
    name: validName
    params: name string
    results: bool
  - doc: |-
      badElement reports an element of a bus name that is empty, opens with a
      digit, or holds a byte outside [A-Za-z0-9_-].
    name: badElement
    params: e string
    results: bool
  - doc: busNameByte reports a byte of [A-Za-z0-9_-].
    name: busNameByte
    params: c byte
    results: bool
  - doc: matchRule is the rule that has the bus announce name's changes of owner.
    name: matchRule
    params: name string
    results: string
  - doc: encodeCall writes a method call to the bus driver.
    name: encodeCall
    params: serial uint32, c *callValue
    results: "[]byte"
  - doc: |-
      readMessage reads one message: the header bounded before it is read, the
      body read whole or, past maxBodyBytes, read and dropped.
    name: readMessage
    params: r discarder
    results: "*message, error"
  - doc: |-
      parseFixed reads the fixed part of a header: the byte order, the type, the
      flags, the version, the lengths and the serial.
    name: parseFixed
    params: head []byte
    results: "*message, error"
  - doc: padding is how many bytes align offset on n.
    name: padding
    params: offset, n int
    results: int
  - doc: okOr is nil when ok, PROTOCOL_VIOLATION naming rule otherwise.
    name: okOr
    params: ok bool, rule string
    results: error
  - doc: allOf reports whether every byte of s is c.
    name: allOf
    params: s string, c byte
    results: bool
  - doc: violation is PROTOCOL_VIOLATION naming the rule broken.
    name: violation
    params: rule string
    results: error
