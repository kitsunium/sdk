          when: c.closed
      - set: c.pending[serial]
        value: p
      - eval: c.mu.Unlock()
        to: c.mu.Unlock
      - opt:
          do:
            - eval: c.forget(serial)
              to: c.forget
            - return: nil, err
          init:
            bind: err
            eval: c.send(ctx, serial, cv)
            to: c.send
          when: err != nil
      - bind: bound
        eval: time.NewTimer(callTimeout)
        to: time
      - defer: bound.Stop()
        to: bound.Stop
      - select:
          cases:
            - comm: m := <-p.reply
              do:
                - return: m, nil
            - comm: <-ctx.Done()
              do:
                - eval: c.forget(serial)
                  to: c.forget
                - return: nil, ended(cv.member, ctx.Err())
            - comm: <-bound.C
              do:
                - eval: c.forget(serial)
                  to: c.forget
                - return: nil, timedOut(cv.member, nil)
            - comm: <-c.done
              do:
                - return: c.lateReply(p)
                  to: c.lateReply
  - of: (*Conn).lateReply
    steps:
      - select:
          cases:
            - comm: m := <-p.reply
              do:
                - return: m, nil
            - default: true
              do:
                - return: nil, coredbus.ConnClosed
  - of: (*Conn).nextSerial
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).nextSerial
        kind: self
