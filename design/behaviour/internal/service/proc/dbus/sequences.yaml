    participants:
      - id: caller
        kind: actor
      - id: (*Conn).send
        kind: self
      - id: encodeCall
        kind: internal
      - id: ctx.Deadline
        kind: value
      - id: gone
        kind: internal
      - id: c.nc.Write
        kind: value
      - id: c.fail
        kind: internal
    steps:
      - bind: b
