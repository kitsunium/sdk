        to: encodeCall
      - lock:
          mutex: c.wmu
      - bind: deadline, _
        eval: ctx.Deadline()
        to: ctx.Deadline
      - eval: gone(c.nc.SetWriteDeadline(deadline))
        to: gone
      - opt:
          do:
            - eval: c.fail(err)
              to: c.fail
            - return: coredbus.ConnClosed
          init:
            bind: _, err
            eval: c.nc.Write(b)
            to: c.nc.Write
          when: err != nil
      - return: nil
  - of: (*Conn).fail
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).fail
        kind: self
      - id: c.mu.Lock
        kind: value
      - id: c.mu.Unlock
        kind: value
      - id: gone
        kind: internal
    steps:
      - eval: c.mu.Lock()
        to: c.mu.Lock
      - opt:
          do:
            - set: c.cause
              value: cause
          when: c.cause == nil
      - set: c.closed
