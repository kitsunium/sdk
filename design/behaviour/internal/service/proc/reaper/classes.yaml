apiVersion: design/behaviour/v1
constants:
  - doc: |-
      exitOSErr is sysexits.h EX_OSERR (71): the exit status the proc domain assigns
      to OS-level operation failures, restated here so a wrapped errno carries the
      same exit semantics as the central ReapFailed/SubreaperFailed sentinels.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      prSetChildSubreaper is the prctl(2) operation that marks the calling process
      as a "child subreaper": orphaned descendants reparent to the nearest living
      ancestor subreaper instead of PID1, so a non-init supervisor still receives
      their SIGCHLD and can wait(2) them. The value is 36 on Linux and is not
      exported by the standard syscall package, so it is named here. It is typed
      uintptr to feed syscall.Syscall6 directly.
    items:
      - name: prSetChildSubreaper
        type: uintptr
        value: "36"
    name: prSetChildSubreaper
  - doc: |-
      timerSweepEvery is zero: on Linux, darwin and the BSDs every exiting child
      posts SIGCHLD, so the loop sweeps on the signal alone. illumos and Solaris
      are the exception (timersweep_solaris.go).
    items:
      - name: timerSweepEvery
        type: time.Duration
        value: "0"
    name: timerSweepEvery
