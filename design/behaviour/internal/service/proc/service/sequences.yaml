          type: fileRecord
      - bind: sub
        eval: "&reader{b: b}"
      - loop:
          cond: ok
          do:
            - switch:
                cases:
                  - case: fIndex
                    do:
                      - set: f.index
                        to: sub.int
                        value: sub.int(v)
                  - case: fFD
                    do:
                      - set: f.fd
                        to: sub.int
                        value: sub.int(v)
                  - case: fMode
                    do:
                      - set: f.mode
                        value: uint32(sub.u64(v))
                  - case: fDev
                    do:
                      - set: f.dev
                        to: sub.u64
                        value: sub.u64(v)
                  - case: fIno
                    do:
                      - set: f.ino
