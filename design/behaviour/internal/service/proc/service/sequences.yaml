                        value: sub.u64(v)
                  - default: true
                "on": tag
          init: tag, v, ok := sub.next()
          post: tag, v, ok = sub.next()
      - eval: r.keep(sub.err)
        to: r.keep
      - return: f
  - of: checkRefs
    participants:
      - id: caller
        kind: actor
      - id: checkRefs
        kind: self
      - id: checkRecords
        kind: internal
      - id: checkUnitRefs
        kind: internal
    steps:
      - bind: seen, err
        eval: checkRecords(files)
