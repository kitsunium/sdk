                  - case: pPID
                    do:
                      - set: p.pid
                        to: sub.int
                        value: sub.int(v)
                  - case: pChild
                    do:
                      - set: p.child
                        value: sub.u64(v) != 0
                  - case: pWitness
                    do:
                      - set: witness
                        to: sub.int
                        value: sub.int(v)
