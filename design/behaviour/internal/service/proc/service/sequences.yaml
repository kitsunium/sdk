      - bind: w
        eval: "&writer{}"
      - var:
          name: files
          type: "[]*os.File"
      - bind: add
        eval:
          closure:
            params: f *os.File
            results: uint64
            steps:
              - set: files
                value: append(files, f)
              - return: uint64(len(files))
