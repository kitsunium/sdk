        to: st.notifyStates
      - eval: st.notifyMetadata(f)
        to: st.notifyMetadata
      - eval: st.notifyWatchdog(f)
        to: st.notifyWatchdog
      - eval: st.notifyTimeouts(f)
        to: st.notifyTimeouts
