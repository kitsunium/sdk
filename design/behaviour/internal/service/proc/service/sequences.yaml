      - id: strconv
        kind: stdlib
      - id: gone
        kind: internal
    steps:
      - var:
          name: files
          type: "[]*os.File"
      - opt:
          do:
            - opt:
                do:
                  - set: v.State["MAINPID"]
                    to: strconv
                    value: strconv.Itoa(v.MainPID)
                  - set: files
                    value: append(files, d.MainPIDFD)
                when: d.MainPIDFD != nil
            - set: files
              value: append(files, d.Files...)
            - opt:
                do:
                  - eval: gone(d.SenderPIDFD.Close())
                    to: gone
                when: d.SenderPIDFD != nil
          init:
            bind: d
