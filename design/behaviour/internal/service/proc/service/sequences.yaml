            - eval: fw.i64(fFD, int64(rec.fd))
              to: fw.i64
            - eval: fw.u64(fMode, uint64(rec.mode))
              to: fw.u64
            - eval: fw.u64(fDev, rec.dev)
              to: fw.u64
            - eval: fw.u64(fIno, rec.ino)
              to: fw.u64
            - eval: w.record(tagFile, fw.b)
              to: w.record
          key: i
          range: files
          value: f
