      - bind: l, path, err
        eval: svcnotify.Listen()
        to: svcnotify
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&listenerSource{l: l, socket: path}, nil"
  - of: (*listenerSource).Socket
    steps:
      - return: s.socket
  - of: (*listenerSource).Recv
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSource).Recv
        kind: self
      - id: ctx.Err
        kind: value
      - id: s.l.Recv
        kind: value
      - id: notifyValue
        kind: internal
    steps:
      - opt:
          do:
            - return: coresvc.NotifyValue{}, err
