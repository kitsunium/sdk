          init: tag, v, ok := sub.next()
          post: tag, v, ok = sub.next()
      - eval: r.keep(sub.err)
        to: r.keep
      - set: u.store[id]
        value: index
  - of: decodeFile
    participants:
      - id: caller
        kind: actor
      - id: decodeFile
        kind: self
      - id: sub.int
        kind: internal
      - id: sub.u64
        kind: internal
      - id: r.keep
        kind: internal
    steps:
