      - id: snapshot
        kind: internal
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
      - id: a.restoreStore
        kind: internal
      - id: a.restoreProcs
        kind: internal
      - id: u.clock.Now
        kind: value
      - id: u.clock.NewTimer
        kind: value
      - id: a.handle
        kind: internal
      - id: a.rewatch
        kind: internal
    steps:
      - bind: u
        eval: a.u
      - bind: at
        eval: r.m.published.At
      - set: a.m
        value: r.m
      - set: a.m.s
        value: u.s
      - set: a.m.published
        to: snapshot
        value: snapshot(&a.m)
      - set: a.m.published.Generation, a.m.published.At
        value: a.m.generation, at
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - set: u.snap
        value: a.m.published
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
