        to: errs
  - of: firstOf
    steps:
      - opt:
          do:
            - return: err
          when: err != nil || errno == 0
      - return: errno
  - of: fileIdentity
    participants:
      - id: caller
        kind: actor
      - id: fileIdentity
        kind: self
      - id: f.SyscallConn
        kind: value
      - id: raw.Control
        kind: value
    steps:
      - bind: rec
        eval: "fileRecord{fd: -1}"
      - var:
          name: st
          type: syscall.Stat_t
      - var:
          name: serr
          type: error
      - bind: raw, err
