        eval: r.i64(v)
        to: r.i64
      - opt:
          do:
            - set: r.err
              to: handoverInvalid
              value: handoverInvalid("an integer past an int")
            - return: "0"
          when: int64(int(n)) != n
      - return: int(n)
  - of: (*reader).at
    participants:
      - id: caller
        kind: actor
      - id: (*reader).at
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Unix(0, r.i64(v))
        to: time
  - of: (*reader).str
    steps:
      - return: string(v)
