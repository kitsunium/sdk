        eval: resolve(&own)
        to: resolve
      - opt:
          do:
            - eval: closeNotify(own.Notify)
              to: closeNotify
            - return: nil, err
          when: err != nil
      - set: fu.taken
        value: "true"
      - bind: conn
        eval: fu.conn
      - set: fu.conn
        value: nil
      - bind: r
        eval: "&restoring{fu: fu, m: m, ready: make(chan struct{}, 1)}"
      - bind: u
        eval: launchRestored(&own, s, conn, r)
        to: launchRestored
      - eval: <-r.ready
      - return: u, nil
  - of: closeNotify
    participants:
      - id: caller
        kind: actor
      - id: closeNotify
        kind: self
      - id: gone
        kind: internal
    steps:
      - opt:
          do:
            - eval: gone(src.Close())
              to: gone
          when: src != nil
  - of: launchRestored
    participants:
      - id: caller
        kind: actor
      - id: launchRestored
        kind: self
      - id: s.put
        kind: internal
      - id: newUnit
        kind: internal
      - id: u.readers.Add
        kind: value
      - id: u.run
        kind: internal
      - id: u.readNotify
        kind: internal
      - id: u.readers.Done
        kind: value
    steps:
      - eval: s.put(setInstance, conn != nil)
        to: s.put
      - bind: u
        eval: newUnit(cfg, s)
        to: newUnit
      - set: u.conn
        value: conn
      - set: u.restoring
        value: r
      - eval: u.readers.Add(2)
        to: u.readers.Add
      - go: u.run(s)
        to: u.run
      - alt:
          - do:
              - go: u.readNotify(cfg.Notify)
                to: u.readNotify
            when: cfg.Notify != nil
          - do:
              - eval: u.readers.Done()
                to: u.readers.Done
            else: true
      - return: u
