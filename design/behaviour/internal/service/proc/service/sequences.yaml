        to: seal
  - of: encodeUnit
    participants:
      - id: caller
        kind: actor
      - id: encodeUnit
        kind: self
      - id: uw.str
        kind: internal
      - id: uw.record
        kind: internal
      - id: pw.i64
        kind: internal
      - id: pw.flag
        kind: internal
      - id: pw.u64
        kind: internal
      - id: sw.u64
        kind: internal
      - id: uw.u64
        kind: internal
