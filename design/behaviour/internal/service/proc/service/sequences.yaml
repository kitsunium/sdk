                do:
                  - set: h.watched
                    to: a.watchHangup
                    value: a.watchHangup(f, e.id)
                when: e.poll
            - set: h.view.Poll
              value: h.watched
            - set: a.store[e.id]
              value: h
            - set: a.storeOrder
              value: append(a.storeOrder, e.id)
            - set: kept
              value: append(kept, e)
          key: _
          range: m.store
          value: e
      - set: m.store
        value: kept
      - eval: closeFiles(slices.Collect(mapValues(fu.store)))
        to: closeFiles
      - eval: clear(fu.store)
      - eval: a.publishStore()
        to: a.publishStore
  - of: mapValues
    steps:
      - return:
          closure:
            params: yield func(*os.File) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(f)"
                  key: _
                  range: m
                  value: f
  - of: (*actor).restoreProcs
    participants:
      - id: caller
        kind: actor
      - id: (*actor).restoreProcs
        kind: self
      - id: a.holdAgain
        kind: internal
      - id: closeFiles
        kind: internal
      - id: a.watch
        kind: internal
    steps:
      - var:
          name: lost
          type: "[]int"
      - loop:
          do:
            - bind: hp
              eval: "&fu.procs[i]"
            - bind: p, err
              eval: a.holdAgain(hp)
              to: a.holdAgain
