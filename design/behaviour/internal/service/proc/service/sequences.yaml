    participants:
      - id: caller
        kind: actor
      - id: (*reader).next
        kind: self
      - id: handoverInvalid
        kind: internal
      - id: binary.LittleEndian.Uint16
        kind: value
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - opt:
          do:
            - return: 0, nil, false
          when: len(r.b) == 0 || r.err != nil
      - opt:
          do:
            - set: r.err
              to: handoverInvalid
              value: handoverInvalid("a record cut short")
            - return: 0, nil, false
