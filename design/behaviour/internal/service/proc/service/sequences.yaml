                key: id
                range: ref.store
                value: idx
            - opt:
                do:
                  - set: fu.conn
                    value: opened[ref.conn]
                when: ref.hasConn
            - opt:
                do:
                  - set: fu.notify
                    value: opened[ref.notify]
                when: ref.hasNotif
            - set: h.units
