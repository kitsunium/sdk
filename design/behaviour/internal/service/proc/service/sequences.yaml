      - bind: out
        eval: make([]byte, 0, payloadHeader+len(body)+sha256.Size)
      - set: out
        value: append(out, handoverMagic...)
      - set: out
        to: binary.LittleEndian.AppendUint16
        value: binary.LittleEndian.AppendUint16(out, version)
      - set: out
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(out, uint32(len(body)))
      - set: out
        value: append(out, body...)
      - bind: sum
        eval: sha256.Sum256(body)
        to: sha256
      - return: append(out, sum[:]...)
