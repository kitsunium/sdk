            - eval: sw.u64(sID, id)
              to: sw.u64
            - eval: sw.u64(sFile, add(fu.store[id]))
              to: sw.u64
            - eval: uw.record(uStore, sw.b)
              to: uw.record
          key: _
          range: slices.Sorted(mapKeys(fu.store))
