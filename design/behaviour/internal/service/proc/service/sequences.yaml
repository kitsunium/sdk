      - eval: st.population()
        to: st.population
      - switch:
          cases:
            - case: st.ev.has(flagByFile)
              do:
                - eval: st.pidFileRead()
                  to: st.pidFileRead
            - case: st.ev.has(flagByGuess)
              do:
                - eval: st.mainGuessed()
                  to: st.mainGuessed
            - default: true
