      - opt:
          do:
            - set: r.err
              to: handoverInvalid
              value: handoverInvalid("a record past the payload's end")
            - return: 0, nil, false
          when: uint64(n) > uint64(len(r.b)-recordHeader)
      - bind: v
        eval: "r.b[recordHeader : recordHeader+int(n)]"
      - set: r.b
        value: r.b[recordHeader+int(n):]
      - return: tag, v, true
