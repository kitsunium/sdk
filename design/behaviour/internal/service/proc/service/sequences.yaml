    participants:
      - id: caller
        kind: actor
      - id: unseal
        kind: self
      - id: binary.LittleEndian.Uint16
        kind: value
      - id: binary.LittleEndian.Uint32
        kind: value
      - id: sha256
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, handoverInvalid("a payload of no possible length", errs.Int("bytes", len(payload)))
          when: len(payload) < payloadHeader+sha256.Size || len(payload) > maxHandoverBytes
      - opt:
          do:
            - return: nil, handoverInvalid("no hand-over magic")
          when: string(payload[:len(handoverMagic)]) != handoverMagic
      - bind: version
        eval: binary.LittleEndian.Uint16(payload[8:])
        to: binary.LittleEndian.Uint16
      - opt:
          do:
            - return: nil, handoverInvalid("a version this image does not read", errs.Int("version", int(version)), errs.Int("reads", int(handoverVersion)))
          when: version == 0 || version > handoverVersion
      - bind: "n"
        eval: binary.LittleEndian.Uint32(payload[10:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: nil, handoverInvalid("a body length that does not match")
          when: uint64(n) != uint64(len(payload)-payloadHeader-sha256.Size)
      - bind: body
        eval: "payload[payloadHeader : payloadHeader+int(n)]"
      - bind: sum
        eval: sha256.Sum256(body)
        to: sha256
      - opt:
          do:
            - return: nil, handoverInvalid("a body that does not match its sum")
          when: "!bytes.Equal(sum[:], payload[payloadHeader+int(n):])"
      - return: body, nil
