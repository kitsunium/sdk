    participants:
      - id: caller
        kind: actor
      - id: OpenImage
        kind: self
      - id: openImage
        kind: internal
    steps:
      - return: openImage(path)
        to: openImage
  - of: Reexec
    participants:
      - id: caller
        kind: actor
      - id: Reexec
        kind: self
      - id: handoverInvalid
        kind: internal
      - id: reexec
        kind: internal
    steps:
      - opt:
          do:
            - return: handoverInvalid("no hand-over, image or argv")
