          do:
            - return: nil, coreproc.InvalidSpec
          when: att == nil || hp.witness == nil
      - bind: p, err
        eval: att.AttachPID(a.u.ctx, hp.pid)
        to: att.AttachPID
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, coreproc.InvalidSpec
          when: "!witnessNames(hp.witness, hp.pid)"
      - return: p, nil
  - of: witnessNames
    participants:
      - id: caller
        kind: actor
      - id: witnessNames
        kind: self
      - id: w.SyscallConn
        kind: value
      - id: gone
        kind: internal
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: fd
        eval: "-1"
      - bind: raw, err
        eval: w.SyscallConn()
        to: w.SyscallConn
      - opt:
          do:
            - return: "false"
          when: err != nil
      - eval: gone(raw.Control(func(v uintptr) { fd = int(v) }))
        to: gone
      - bind: info, err
        eval: os.ReadFile("/proc/self/fdinfo/" + strconv.Itoa(fd))
        to: os
      - opt:
          do:
            - return: "false"
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - bind: n, aerr
                    eval: strconv.Atoi(strings.TrimSpace(v))
                    to: strconv
