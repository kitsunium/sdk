                do:
                  - op: ++
                    set: m.storeDiscarded
                  - continue: true
                when: f == nil
            - bind: info, err
              eval: f.Stat()
              to: f.Stat
            - opt:
                do:
                  - set: info
                    value: nil
                when: err != nil
            - bind: h
