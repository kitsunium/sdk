    participants:
      - id: caller
        kind: actor
      - id: execSpawner.Spawn
        kind: self
      - id: exec
        kind: package
    steps:
      - return: exec.Start(ctx, spec)
        to: exec
  - of: NewAttacher
    participants:
      - id: caller
        kind: actor
      - id: NewAttacher
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - set: scope.UIDs
        to: slices
        value: slices.Clone(scope.UIDs)
      - return: "execAttacher{scope: scope}"
