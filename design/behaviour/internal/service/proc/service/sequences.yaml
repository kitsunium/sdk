      - bind: named
        eval: slices.AppendSeq(slices.Collect(maps.Values(ref.witness)), maps.Values(ref.store))
        to: slices
      - opt:
          do:
            - set: named
              value: append(named, ref.conn)
          when: ref.hasConn
      - opt:
          do:
            - set: named
              value: append(named, ref.notify)
