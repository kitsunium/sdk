                  bind: d
                  eval: a.m.deadlines[k]
                when: "!d.IsZero()"
          key: k
          range: timerCount
      - loop:
          do:
            - eval: "a.handle(&event{kind: evExit, pid: pid, exit: coreproc.ExitValue{Code: -1}, flags: flagUnknown})"
              to: a.handle
          key: _
          range: lost
          value: pid
      - eval: a.rewatch()
        to: a.rewatch
  - of: (*actor).restoreStore
    participants:
      - id: caller
        kind: actor
      - id: (*actor).restoreStore
        kind: self
      - id: f.Stat
        kind: value
      - id: a.watchHangup
        kind: internal
      - id: closeFiles
        kind: internal
      - id: a.publishStore
        kind: internal
    steps:
      - bind: m
        eval: "&a.m"
      - bind: kept
        eval: m.store[:0:0]
