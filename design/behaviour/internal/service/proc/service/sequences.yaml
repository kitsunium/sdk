                init:
                  bind: v, ok
                  eval: strings.CutPrefix(line, "Pid:")
                  to: strings
                when: ok
          key: line
          range: strings.SplitSeq(string(info), "\n")
      - return: "false"
  - of: (*actor).rewatch
    participants:
      - id: caller
