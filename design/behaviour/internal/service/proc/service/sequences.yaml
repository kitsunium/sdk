            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - bind: v, err
        eval: s.l.Recv()
        to: s.l.Recv
      - opt:
          do:
            - return: "coresvc.NotifyValue{PID: 0, UID: -1}, nil"
          when: errs.HasCode(err, coreproc.CodeInvalidNotification) || errs.HasCode(err, coreproc.CodeCredentialMismatch)
      - opt:
          do:
            - return: coresvc.NotifyValue{}, err
          when: err != nil
      - return: notifyValue(&v), nil
        to: notifyValue
  - of: notifyValue
    participants:
      - id: caller
        kind: actor
      - id: notifyValue
