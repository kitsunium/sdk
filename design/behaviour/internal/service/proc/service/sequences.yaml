  - of: (*Unit).State
    steps:
      - lock:
          mutex: u.mu
      - bind: snap
        eval: u.snap
      - set: snap.Dropped
        value: u.dropped
      - return: snap
  - of: (*Unit).FDStore
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).FDStore
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: u.mu
      - return: slices.Clone(u.stored)
        to: slices
  - of: (*Unit).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).Close
        kind: self
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
      - id: u.send
        kind: internal
      - id: u.readers.Wait
        kind: value
    steps:
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - set: u.closed
        value: "true"
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
      - bind: err
        eval: u.send(ctx, evClose)
        to: u.send
      - opt:
          do:
            - set: err
              value: nil
          when: err != nil && errs.HasCode(err, coresvc.CodeUnitClosed)
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: u.readers.Wait()
        to: u.readers.Wait
      - return: nil
  - of: (*Unit).request
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).request
        kind: self
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
      - id: errs
        kind: package
      - id: u.send
        kind: internal
    steps:
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - bind: closed
        eval: u.closed
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
      - opt:
          do:
            - return: errs.Wrap(coresvc.UnitClosed, errs.WrapParams{}, errs.String("unit", u.s.name))
              to: errs
          when: closed
      - return: u.send(ctx, kind)
        to: u.send
  - of: (*Unit).send
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).send
        kind: self
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
      - id: u.forgetWaiter
        kind: internal
      - id: errs
        kind: package
      - id: ctx.Err
        kind: value
      - id: u.endAnswer
        kind: internal
    steps:
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - op: ++
        set: u.nextID
      - bind: id
        eval: u.nextID
      - bind: answer
        eval: make(chan error, 1)
      - set: u.waiters[id]
        value: answer
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
      - defer: u.forgetWaiter(id)
        to: u.forgetWaiter
      - select:
          cases:
            - comm: "u.inbox <- event{kind: kind, waiter: id}"
            - comm: <-u.done
              do:
                - return: errs.Wrap(coresvc.UnitClosed, errs.WrapParams{}, errs.String("unit", u.s.name))
                  to: errs
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
      - select:
          cases:
            - comm: err := <-answer
              do:
                - return: err
            - comm: <-u.done
              do:
                - return: u.endAnswer(kind, answer)
                  to: u.endAnswer
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
  - of: (*Unit).endAnswer
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).endAnswer
        kind: self
      - id: errs
        kind: package
    steps:
      - select:
          cases:
            - comm: err := <-answer
              do:
                - return: err
            - default: true
      - opt:
          do:
            - return: nil
          when: kind == evClose
      - return: errs.Wrap(coresvc.UnitClosed, errs.WrapParams{}, errs.String("unit", u.s.name))
        to: errs
  - of: (*Unit).forgetWaiter
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).forgetWaiter
        kind: self
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
    steps:
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - eval: delete(u.waiters, id)
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
  - of: (*Unit).post
    steps:
      - select:
          cases:
            - comm: u.inbox <- *ev
              do:
                - return: "true"
            - comm: <-u.done
              do:
                - return: "false"
  - of: (*Unit).readNotify
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).readNotify
        kind: self
      - id: u.readers.Done
        kind: value
      - id: src.Recv
        kind: value
      - id: closeFiles
        kind: internal
    steps:
      - defer: u.readers.Done()
        to: u.readers.Done
      - bind: failures
        eval: "0"
      - loop:
          cond: failures < maxRecvFailures
          do:
            - bind: msg, err
              eval: src.Recv(u.ctx)
              to: src.Recv
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: u.ctx.Err() != nil
                  - op: ++
                    set: failures
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - opt:
                do:
                  - eval: closeFiles(msg.Files)
                    to: closeFiles
                  - return: ""
                when: "!u.post(&event{kind: evNotify, msg: msg})"
