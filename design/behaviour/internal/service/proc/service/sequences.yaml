              to: closeFiles
            - set: hp.witness
              value: nil
            - opt:
                do:
                  - set: lost
                    value: append(lost, hp.pid)
                  - continue: true
                when: err != nil
            - eval: a.watch(p)
              to: a.watch
            - opt:
                do:
                  - set: a.children[hp.pid]
                    value: "true"
                when: hp.child
          key: i
          range: fu.procs
      - return: lost
  - of: (*actor).holdAgain
    participants:
      - id: caller
        kind: actor
      - id: (*actor).holdAgain
        kind: self
      - id: exec
        kind: package
      - id: att.AttachPID
