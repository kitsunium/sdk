            eval: f["BUSERROR"]
          when: ok
      - opt:
          do:
            - set: m.varlinkError
              value: v
          init:
            bind: v, ok
            eval: f["VARLINKERROR"]
          when: ok
      - opt:
          do:
            - set: m.exitStatusText
              value: v
          init:
            bind: v, ok
            eval: f["EXIT_STATUS"]
          when: ok
  - of: (*step).notifyWatchdog
    participants:
      - id: caller
        kind: actor
      - id: (*step).notifyWatchdog
        kind: self
      - id: parseUsec
        kind: internal
      - id: st.resetWatchdog
        kind: internal
      - id: st.forceWatchdog
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - opt:
                do:
                  - set: m.watchdogPeriod
                    value: d
                  - eval: st.resetWatchdog()
                    to: st.resetWatchdog
                init:
                  bind: d, valid
                  eval: parseUsec(v)
                  to: parseUsec
                when: valid && d > 0
          init:
            bind: v, ok
            eval: f["WATCHDOG_USEC"]
          when: ok
      - switch:
          cases:
            - case: "\"1\""
              do:
                - opt:
                    do:
                      - eval: st.resetWatchdog()
                        to: st.resetWatchdog
                    when: "!m.deadlines[timerWatchdog].IsZero()"
            - case: "\"trigger\""
              do:
                - eval: st.forceWatchdog()
                  to: st.forceWatchdog
          "on": f["WATCHDOG"]
  - of: (*step).notifyTimeouts
    participants:
      - id: caller
        kind: actor
      - id: (*step).notifyTimeouts
        kind: self
      - id: parseUsec
        kind: internal
      - id: st.ev.at.Add
        kind: value
      - id: st.armAt
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: v, ok
        eval: f["EXTEND_TIMEOUT_USEC"]
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: d, valid
        eval: parseUsec(v)
        to: parseUsec
      - opt:
          do:
            - return: ""
          when: "!valid"
      - bind: at
        eval: st.ev.at.Add(d)
        to: st.ev.at.Add
      - loop:
          do:
            - opt:
                do:
                  - eval: st.armAt(k, at)
                    to: st.armAt
                when: "!m.deadlines[k].IsZero() && at.After(m.deadlines[k]) && (k != timerState || m.sub != coresvc.SubAutoRestart)"
          key: k
          range: timerCount
  - of: parseUsec
    participants:
      - id: caller
        kind: actor
      - id: parseUsec
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: n, err
        eval: strconv.ParseUint(v, 10, 63)
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: err != nil || n > uint64(coresvc.Infinity/time.Microsecond)
      - return: time.Duration(n) * time.Microsecond, true
  - of: (*Unit).Subscribe
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).Subscribe
        kind: self
      - id: sub.close
        kind: internal
    steps:
      - opt:
          do:
            - set: capacity
              value: defaultQueue
          when: capacity == 0
      - bind: sub
        eval: "&subscription{ch: make(chan coresvc.EventValue, min(max(capacity, 1), maxQueue))}"
      - lock:
          mutex: u.mu
      - opt:
          do:
            - eval: sub.close()
              to: sub.close
            - return: sub.ch, func() {}
          when: u.ended
      - set: u.subs[sub]
        value: struct{}{}
      - return: sub.ch, func() { u.unsubscribe(sub) }
  - of: (*subscription).close
    participants:
      - id: caller
        kind: actor
      - id: (*subscription).close
        kind: self
      - id: s.once.Do
        kind: value
    steps:
      - eval: s.once.Do(func() { close(s.ch) })
        to: s.once.Do
  - of: (*Unit).unsubscribe
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).unsubscribe
        kind: self
      - id: sub.close
        kind: internal
    steps:
      - lock:
          mutex: u.mu
      - eval: delete(u.subs, sub)
      - eval: sub.close()
        to: sub.close
  - of: (*Unit).publish
    steps:
      - lock:
          mutex: u.mu
      - set: u.snap
        value: "*snap"
      - bind: view
        eval: "*snap"
      - set: view.Dropped
        value: u.dropped
      - bind: ev
        eval: "coresvc.EventValue{StateValue: view, Previous: prev, PreviousSub: prevSub}"
      - loop:
          do:
            - select:
                cases:
                  - comm: sub.ch <- ev
                  - default: true
                    do:
                      - op: ++
                        set: u.dropped
          key: sub
          range: u.subs
  - of: (*Unit).closeSubscriptions
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).closeSubscriptions
        kind: self
      - id: sub.close
        kind: internal
    steps:
      - lock:
          mutex: u.mu
      - set: u.ended
        value: "true"
      - loop:
          do:
            - eval: delete(u.subs, sub)
            - eval: sub.close()
              to: sub.close
          key: sub
          range: u.subs
  - of: reduce
    participants:
      - id: caller
        kind: actor
      - id: reduce
        kind: self
      - id: st.settle
        kind: internal
      - id: st.publish
        kind: internal
      - id: answersLast
        kind: internal
    steps:
      - bind: st
        eval: "&step{m: m, ev: ev}"
      - opt:
          do:
            - eval: handlers[ev.kind](st)
          when: int(ev.kind) < len(handlers)
      - eval: st.settle()
        to: st.settle
      - eval: st.publish()
        to: st.publish
      - return: answersLast(st.out)
        to: answersLast
  - of: answersLast
    steps:
      - bind: isAnswer
        eval:
          closure:
            params: ef effect
            results: bool
            steps:
              - return: ef.kind == efReply || ef.kind == efExit
      - opt:
          do:
            - return: out
          when: "!slices.ContainsFunc(out, isAnswer)"
      - bind: sorted
        eval: make([]effect, 0, len(out))
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - set: sorted
                          value: append(sorted, out[i])
                      when: isAnswer(out[i]) == answers
                key: i
                range: out
          key: _
          range: "[]bool{false, true}"
          value: answers
      - return: sorted
  - of: (*step).emit
    steps:
      - set: st.out
        value: append(st.out, *ef)
  - of: (*step).reply
    participants:
      - id: caller
        kind: actor
      - id: (*step).reply
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(waiters) == 0
      - eval: "st.emit(&effect{kind: efReply, waiters: waiters, err: err})"
        to: st.emit
  - of: (*step).refusal
    participants:
      - id: caller
        kind: actor
      - id: (*step).refusal
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(sentinel, errs.WrapParams{}, errs.String("unit", st.m.s.name))
        to: errs
  - of: (*step).publish
    participants:
      - id: caller
        kind: actor
      - id: (*step).publish
        kind: self
      - id: snapshot
        kind: internal
      - id: st.emit
        kind: internal
    steps:
      - bind: mdl
        eval: st.m
      - bind: snap
        eval: snapshot(mdl)
        to: snapshot
      - bind: last
        eval: mdl.published
      - set: last.Generation, last.At
        value: 0, time.Time{}
      - opt:
          do:
            - return: ""
          when: snap == last
      - op: ++
        set: mdl.generation
      - set: snap.Generation, snap.At
        value: mdl.generation, st.ev.at
      - bind: prev
        eval: mdl.published
      - set: mdl.published
        value: snap
      - eval: "st.emit(&effect{kind: efPublish, snap: snap, prevState: prev.State, prevSub: prev.Sub})"
        to: st.emit
  - of: snapshot
    steps:
      - return: |-
          coresvc.StateValue{
          		Changed: m.changed, Name: m.s.name, Status: m.status, BusError: m.busError,
          		VarlinkError: m.varlinkError, ExitStatusText: m.exitStatusText, MainExit: m.mainExit,
          		NotifyRefused: m.notifyRefused, MainPID: m.mainPID, ControlPID: m.controlPID,
          		FDStoreRefused: m.storeRefused, FDStoreDiscarded: m.storeDiscarded, FDStore: len(m.store),
          		Errno: m.errno, Restarts: m.restarts, State: m.state, Sub: m.sub, Result: m.result,
          		ReloadResult: m.reloadResult, NotifyAccess: m.notifyAccess, MainExited: m.has(flagMainExited),
          	}
  - of: isDead
    steps:
      - return: s == coresvc.StateInactive || s == coresvc.StateFailed || s == coresvc.StateConditionSkipped
  - of: upSub
    steps:
      - return: sub == coresvc.SubRunning || sub == coresvc.SubRunningRevalidating || sub == coresvc.SubExited
  - of: isUp
    steps:
      - return: s == coresvc.StateActive || s == coresvc.StateExited || s == coresvc.StateReloading
  - of: joined
    steps:
      - return: append(slices.Clone(j.waiters), w...)
  - of: (*step).onStart
    participants:
      - id: caller
        kind: actor
      - id: (*step).onStart
        kind: self
      - id: st.reply
        kind: internal
      - id: st.startNow
        kind: internal
    steps:
      - bind: w
        eval: "[]uint64{st.ev.waiter}"
      - opt:
          do:
            - eval: st.reply(w, st.refusal(coresvc.UnitClosed))
              to: st.reply
            - return: ""
          when: st.m.has(flagClosing)
      - opt:
          do:
            - return: ""
          when: st.queueStart(kind, w)
      - eval: st.startNow(kind, w)
        to: st.startNow
  - of: (*step).queueStart
    participants:
      - id: caller
        kind: actor
      - id: (*step).queueStart
        kind: self
      - id: joined
        kind: internal
      - id: st.queueBehindStop
        kind: internal
      - id: st.reply
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - switch:
          cases:
            - case: jobStart
              do:
                - set: m.job.waiters
                  to: joined
                  value: joined(m.job, w)
            - case: jobRestart, jobStop
              do:
                - eval: st.queueBehindStop(kind, w)
                  to: st.queueBehindStop
            - case: jobReload
              do:
                - opt:
                    do:
                      - eval: st.reply(m.job.waiters, st.refusal(coresvc.JobCanceled))
                        to: st.reply
                      - set: m.job
                        value: job{}
                      - return: "false"
                    when: kind == jobRestart
                - eval: st.reply(w, nil)
                  to: st.reply
            - default: true
              do:
                - return: "false"
          "on": m.job.kind
      - return: "true"
  - of: (*step).queueBehindStop
    participants:
      - id: caller
        kind: actor
      - id: (*step).queueBehindStop
        kind: self
      - id: joined
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - set: m.job.waiters
              to: joined
              value: joined(m.job, w)
            - return: ""
          when: m.job.kind == jobRestart && m.job.stopped
      - set: m.pending
        value: "job{kind: kind, waiters: joined(m.pending, w)}"
  - of: (*step).startNow
    participants:
      - id: caller
        kind: actor
      - id: (*step).startNow
        kind: self
      - id: st.reply
        kind: internal
      - id: m.set
        kind: internal
      - id: st.stopNow
        kind: internal
      - id: st.beginStart
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - switch:
          cases:
            - case: kind == jobStart && isUp(m.state)
              do:
                - eval: st.reply(w, nil)
                  to: st.reply
            - case: st.activatingAlone(kind)
              do:
                - set: m.job
                  value: "job{kind: jobStart, waiters: w, stopped: true}"
            - case: m.state == coresvc.StateDeactivating
              do:
                - set: m.job
                  value: "job{kind: jobStop}"
                - set: m.pending
                  value: "job{kind: kind, waiters: w}"
            - case: st.restartsRunning(kind)
              do:
                - set: m.job
                  value: "job{kind: jobRestart, waiters: w}"
                - eval: m.set(flagForbidRestart, true)
                  to: m.set
                - eval: m.set(flagRestarting, true)
                  to: m.set
                - eval: st.stopNow()
                  to: st.stopNow
            - default: true
              do:
                - set: m.job
                  value: "job{kind: kind, waiters: w, stopped: true}"
                - eval: st.beginStart(true)
                  to: st.beginStart
  - of: (*step).activatingAlone
    steps:
      - return: kind == jobStart && st.m.state == coresvc.StateActivating
  - of: (*step).restartsRunning
    steps:
      - bind: s
        eval: st.m.state
      - return: kind == jobRestart && !isDead(s) && s != coresvc.StateAutoRestart
  - of: (*step).onStop
    participants:
      - id: caller
        kind: actor
      - id: (*step).onStop
        kind: self
      - id: joined
        kind: internal
      - id: st.reply
        kind: internal
      - id: m.set
        kind: internal
      - id: st.stopNow
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: w
        eval: "[]uint64{st.ev.waiter}"
      - opt:
          do:
            - set: m.job.waiters
              to: joined
              value: joined(m.job, w)
            - return: ""
          when: m.job.kind == jobStop
      - opt:
          do:
            - eval: st.reply(m.job.waiters, st.refusal(coresvc.JobCanceled))
              to: st.reply
            - set: m.job
              value: job{}
          when: m.job.kind != jobNone
      - eval: st.reply(m.pending.waiters, st.refusal(coresvc.JobCanceled))
        to: st.reply
      - set: m.pending
        value: job{}
      - eval: m.set(flagForbidRestart, true)
        to: m.set
      - opt:
          do:
            - eval: st.reply(w, nil)
              to: st.reply
            - return: ""
          when: isDead(m.state)
      - set: m.job
        value: "job{kind: jobStop, waiters: w}"
      - eval: st.stopNow()
        to: st.stopNow
  - of: (*step).stopNow
    participants:
      - id: caller
        kind: actor
      - id: (*step).stopNow
        kind: self
      - id: st.disarm
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.enterStop
        kind: internal
    steps:
      - switch:
          cases:
            - case: coresvc.StateAutoRestart
              do:
                - eval: st.disarm(timerState)
                  to: st.disarm
                - eval: st.setState(coresvc.StateInactive, coresvc.SubDead)
                  to: st.setState
            - case: coresvc.StateActivating
              do:
                - eval: st.enterSignal(coresvc.SubStopSigterm, coresvc.ResultSuccess)
                  to: st.enterSignal
            - case: coresvc.StateActive, coresvc.StateExited, coresvc.StateReloading
              do:
                - eval: st.enterStop(coresvc.ResultSuccess)
                  to: st.enterStop
            - default: true
          "on": st.m.state
  - of: (*step).onReload
    participants:
      - id: caller
        kind: actor
      - id: (*step).onReload
        kind: self
      - id: joined
        kind: internal
      - id: st.reply
        kind: internal
      - id: st.enterReload
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: w
        eval: "[]uint64{st.ev.waiter}"
      - opt:
          do:
            - set: m.job.waiters
              to: joined
              value: joined(m.job, w)
            - return: ""
          when: m.job.kind == jobReload
      - opt:
          do:
            - eval: st.reply(w, st.refusal(coresvc.ReloadUnsupported))
              to: st.reply
            - return: ""
          when: len(m.s.lists[listReload]) == 0 && m.s.typ != coresvc.TypeNotifyReload
      - opt:
          do:
            - eval: st.reply(w, errs.Wrap(coresvc.ReloadFailed, errs.WrapParams{}, errs.String("unit", m.s.name), errs.String("state", m.sub.String())))
              to: st.reply
            - return: ""
          when: m.has(flagClosing) || m.job.kind != jobNone || !upSub(m.sub)
      - set: m.job
        value: "job{kind: jobReload, waiters: w}"
      - eval: st.enterReload()
        to: st.enterReload
  - of: (*step).onFail
    participants:
      - id: caller
        kind: actor
      - id: (*step).onFail
        kind: self
      - id: st.forceWatchdog
        kind: internal
      - id: st.reply
        kind: internal
    steps:
      - eval: st.forceWatchdog()
        to: st.forceWatchdog
      - eval: st.reply([]uint64{st.ev.waiter}, nil)
        to: st.reply
  - of: (*step).onResetFailed
    participants:
      - id: caller
        kind: actor
      - id: (*step).onResetFailed
        kind: self
      - id: st.setState
        kind: internal
      - id: st.reply
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - eval: st.setState(coresvc.StateInactive, coresvc.SubDead)
              to: st.setState
            - set: m.result, m.reloadResult
              value: coresvc.ResultSuccess, coresvc.ResultSuccess
          when: m.state == coresvc.StateFailed || m.state == coresvc.StateConditionSkipped
      - set: m.restarts, m.limitCount, m.limitBegin
        value: 0, 0, time.Time{}
      - eval: st.reply([]uint64{st.ev.waiter}, nil)
        to: st.reply
  - of: (*step).onClose
    participants:
      - id: caller
        kind: actor
      - id: (*step).onClose
        kind: self
      - id: m.set
        kind: internal
      - id: st.refusal
        kind: internal
      - id: st.reply
        kind: internal
      - id: st.forgetAll
        kind: internal
      - id: st.exit
        kind: internal
      - id: st.stopNow
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - set: m.closeWaiters
        value: append(slices.Clone(m.closeWaiters), st.ev.waiter)
      - opt:
          do:
            - return: ""
          when: m.has(flagClosing)
      - eval: m.set(flagClosing, true)
        to: m.set
      - bind: closed
        eval: st.refusal(coresvc.UnitClosed)
        to: st.refusal
      - eval: st.reply(m.pending.waiters, closed)
        to: st.reply
      - set: m.pending
        value: job{}
      - opt:
          do:
            - eval: st.reply(m.job.waiters, closed)
              to: st.reply
            - set: m.job
              value: job{}
          when: m.job.kind != jobNone && m.job.kind != jobStop
      - opt:
          do:
            - eval: st.forgetAll()
              to: st.forgetAll
            - eval: st.exit()
              to: st.exit
            - return: ""
          when: m.s.on(setSurviveFinal)
      - opt:
          do:
            - eval: m.set(flagForbidRestart, true)
              to: m.set
            - set: m.job
              value: "job{kind: jobStop}"
            - eval: st.stopNow()
              to: st.stopNow
          when: "!isDead(m.state) && m.job.kind != jobStop"
  - of: (*step).settle
    participants:
      - id: caller
        kind: actor
      - id: (*step).settle
        kind: self
      - id: st.settleStore
        kind: internal
      - id: st.exit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - eval: settlers[m.job.kind](st)
      - eval: st.settleStore()
        to: st.settleStore
      - opt:
          do:
            - eval: st.exit()
              to: st.exit
          when: (m.has(flagClosing) || st.instanceOver()) && m.job.kind == jobNone && isDead(m.state)
  - of: (*step).instanceOver
    steps:
      - bind: m
        eval: st.m
      - return: m.s.on(setInstance) && m.has(flagRan) && m.pending.kind == jobNone
  - of: (*step).settleRestart
    participants:
      - id: caller
        kind: actor
      - id: (*step).settleRestart
        kind: self
      - id: m.set
        kind: internal
      - id: st.disarm
        kind: internal
      - id: st.beginStart
        kind: internal
      - id: st.settleStart
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - set: m.job.stopped
              value: "true"
            - eval: m.set(flagRestarting, false)
              to: m.set
            - eval: st.disarm(timerState)
              to: st.disarm
            - eval: st.beginStart(true)
              to: st.beginStart
          when: "!m.job.stopped && (isDead(m.state) || m.state == coresvc.StateAutoRestart)"
      - eval: st.settleStart()
        to: st.settleStart
  - of: (*step).settleStart
    participants:
      - id: caller
        kind: actor
      - id: (*step).settleStart
        kind: self
      - id: st.startOutcome
        kind: internal
      - id: st.reply
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: "!m.job.stopped"
      - bind: done, err
        eval: st.startOutcome()
        to: st.startOutcome
      - opt:
          do:
            - return: ""
          when: "!done"
      - eval: st.reply(m.job.waiters, err)
        to: st.reply
      - set: m.job
        value: job{}
  - of: (*step).startOutcome
    steps:
      - bind: m
        eval: st.m
      - switch:
          cases:
            - case: m.result == coresvc.ResultStartLimitHit && isDead(m.state)
              do:
                - return: true, st.refusal(coresvc.StartLimitHit)
            - case: st.startedClean()
              do:
                - return: true, nil
            - case: m.state == coresvc.StateFailed || m.state == coresvc.StateAutoRestart
              do:
                - return: true, st.startFailed()
            - default: true
              do:
                - return: false, nil
  - of: (*step).startFailed
    participants:
      - id: caller
        kind: actor
      - id: (*step).startFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - bind: m
        eval: st.m
      - bind: fields
        eval: "[]errs.FieldValue{errs.String(\"unit\", m.s.name), errs.String(\"result\", m.result.String())}"
      - opt:
          do:
            - set: fields
              value: append(fields, errs.String("pidfile", m.pidFileCause))
          when: m.pidFileCause != ""
      - opt:
          do:
            - return: errs.Wrap(coresvc.StartFailed, errs.WrapParams{}, fields...)
              to: errs
          when: m.sandboxCause == 0
      - bind: cause
        eval: errs.Wrap(sandboxSentinel(m.sandboxCause), errs.WrapParams{}, m.sandboxFields...)
        to: errs
      - return: errs.Wrap(errors.Join(coresvc.StartFailed, cause), errs.WrapParams{}, append(fields, m.sandboxFields...)...)
        to: errs
  - of: sandboxSentinel
    steps:
      - opt:
          do:
            - return: coreproc.SandboxUnavailable
          when: code == coreproc.CodeSandboxUnavailable
      - return: coreproc.SandboxFailed
  - of: (*step).startedClean
    steps:
      - bind: m
        eval: st.m
      - return: upSub(m.sub) || m.state == coresvc.StateInactive || m.state == coresvc.StateConditionSkipped
  - of: (*step).settleStop
    participants:
      - id: caller
        kind: actor
      - id: (*step).settleStop
        kind: self
      - id: st.reply
        kind: internal
      - id: st.beginStart
        kind: internal
      - id: st.settleStart
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: "!isDead(m.state)"
      - eval: st.reply(m.job.waiters, nil)
        to: st.reply
      - set: m.job
        value: job{}
      - opt:
          do:
            - set: m.job, m.pending
              value: m.pending, job{}
            - set: m.job.stopped
              value: "true"
            - eval: st.beginStart(true)
              to: st.beginStart
            - eval: st.settleStart()
              to: st.settleStart
          when: m.pending.kind != jobNone && !m.has(flagClosing)
  - of: (*step).settleReload
    participants:
      - id: caller
        kind: actor
      - id: (*step).settleReload
        kind: self
      - id: errs
        kind: package
      - id: st.reply
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - var:
                name: err
                type: error
            - opt:
                do:
                  - set: err
                    to: errs
                    value: errs.Wrap(coresvc.ReloadFailed, errs.WrapParams{}, errs.String("unit", m.s.name), errs.String("result", m.reloadResult.String()))
                when: m.reloadResult != coresvc.ResultSuccess
            - eval: st.reply(m.job.waiters, err)
              to: st.reply
            - set: m.job
              value: job{}
            - return: ""
          when: upSub(m.sub)
      - opt:
          do:
            - eval: st.reply(m.job.waiters, st.refusal(coresvc.JobCanceled))
              to: st.reply
            - set: m.job
              value: job{}
          when: m.state != coresvc.StateReloading
  - of: (*step).exit
    participants:
      - id: caller
        kind: actor
      - id: (*step).exit
        kind: self
      - id: m.set
        kind: internal
      - id: st.disarm
        kind: internal
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: m.has(flagExited)
      - eval: m.set(flagExited, true)
        to: m.set
      - eval: st.disarm(timerState)
        to: st.disarm
      - eval: st.disarm(timerWatchdog)
        to: st.disarm
      - eval: st.disarm(timerPIDFile)
        to: st.disarm
      - eval: "st.emit(&effect{kind: efExit, waiters: m.closeWaiters})"
        to: st.emit
      - set: m.closeWaiters
        value: nil
  - of: openImage
    participants:
      - id: caller
        kind: actor
      - id: openImage
        kind: self
      - id: syscall
        kind: stdlib
      - id: os
        kind: stdlib
    steps:
      - bind: fd, err
        eval: syscall.Open(path, oPath|syscall.O_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: nil, reexecFailed(err, errs.String("path", path))
          when: err != nil
      - return: os.NewFile(uintptr(fd), path), nil
        to: os
  - of: reexecFailed
    participants:
      - id: caller
        kind: actor
      - id: reexecFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(joinCause(coresvc.ReexecFailed, cause), errs.WrapParams{}, fields...)
        to: errs
  - of: reexec
    participants:
      - id: caller
        kind: actor
      - id: reexec
        kind: self
      - id: h.encode
        kind: internal
      - id: memfdPayload
        kind: internal
      - id: reexecFailed
        kind: internal
      - id: fileIdentity
        kind: internal
      - id: fdOf
        kind: internal
      - id: execWith
        kind: internal
    steps:
      - bind: payload, files, err
        eval: h.encode(versionSeam())
        to: h.encode
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: tamperPayload(payload)
      - bind: memfd, err
        eval: memfdPayload(payload)
        to: memfdPayload
      - opt:
          do:
            - return: reexecFailed(err)
              to: reexecFailed
          when: err != nil
      - defer: func() { gone(syscall.Close(memfd)) }()
      - bind: fds
        eval: "[]int{memfd}"
      - loop:
          do:
            - bind: rec, ierr
              eval: fileIdentity(f)
              to: fileIdentity
            - opt:
                do:
                  - return: ierr
                when: ierr != nil
            - set: fds
              value: append(fds, rec.fd)
          key: _
          range: files
          value: f
      - bind: imageFD, err
        eval: fdOf(image)
        to: fdOf
      - opt:
          do:
            - return: reexecFailed(err)
              to: reexecFailed
          when: err != nil
      - bind: envv
        eval: append(slices.DeleteFunc(slices.Clone(env), isHandoverEnv), handoverEnv+"="+strconv.Itoa(memfd))
      - return: execWith(fds, "/proc/self/fd/"+strconv.Itoa(imageFD), argv, envv)
        to: execWith
  - of: execWith
    participants:
      - id: caller
        kind: actor
      - id: execWith
        kind: self
      - id: sealAll
        kind: internal
      - id: reexecFailed
        kind: internal
      - id: syscall.ForkLock.Lock
        kind: value
      - id: gone
        kind: internal
      - id: syscall
        kind: stdlib
      - id: syscall.ForkLock.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: reexecFailed(err)
              to: reexecFailed
          init:
            bind: err
            eval: sealAll()
            to: sealAll
          when: err != nil
      - eval: syscall.ForkLock.Lock()
        to: syscall.ForkLock.Lock
      - loop:
          do:
            - eval: gone(setFDFlags(fd, 0))
              to: gone
          key: _
          range: keep
          value: fd
      - bind: err
        eval: syscall.Exec(path, argv, envv)
        to: syscall
      - loop:
          do:
            - eval: gone(setFDFlags(fd, syscall.FD_CLOEXEC))
              to: gone
          key: _
          range: keep
          value: fd
      - eval: syscall.ForkLock.Unlock()
        to: syscall.ForkLock.Unlock
      - return: reexecFailed(err, errs.String("path", path))
        to: reexecFailed
  - of: isHandoverEnv
    participants:
      - id: caller
        kind: actor
      - id: isHandoverEnv
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.HasPrefix(kv, handoverEnv+"=")
        to: strings
  - of: memfdPayload
    participants:
      - id: caller
        kind: actor
      - id: memfdPayload
        kind: self
      - id: syscall
        kind: stdlib
      - id: gone
        kind: internal
    steps:
      - bind: name, err
        eval: syscall.BytePtrFromString("kitsunium-handover")
        to: syscall
      - opt:
          do:
            - return: "-1, err"
          when: err != nil
      - bind: r, _, errno
        eval: syscall.Syscall(sysMemfdCreate, uintptr(unsafe.Pointer(name)), mfdCloexec|mfdAllowSealing, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, errno"
          when: errno != 0
      - bind: fd
        eval: int(r)
      - loop:
          cond: off < len(payload)
          do:
            - bind: n, werr
              eval: syscall.Pwrite(fd, payload[off:], int64(off))
              to: syscall
            - opt:
                do:
                  - eval: gone(syscall.Close(fd))
                    to: gone
                  - return: "-1, werr"
                when: werr != nil
            - op: +=
              set: "off"
              value: "n"
          init: off := 0
      - opt:
          do:
            - eval: gone(syscall.Close(fd))
              to: gone
            - return: "-1, errno"
          init:
            bind: _, _, errno
            eval: syscall.Syscall(syscall.SYS_FCNTL, uintptr(fd), fAddSeals, sealsWhole)
            op: =
            to: syscall
          when: errno != 0
      - return: fd, nil
  - of: setFDFlags
    participants:
      - id: caller
        kind: actor
      - id: setFDFlags
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_FCNTL, uintptr(fd), syscall.F_SETFD, flags)
        to: syscall
      - opt:
          do:
            - return: nil
          when: errno == 0
      - return: errno
  - of: cloexec
    participants:
      - id: caller
        kind: actor
      - id: cloexec
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: r, _, errno
        eval: syscall.RawSyscall(syscall.SYS_FCNTL, uintptr(fd), syscall.F_GETFD, 0)
        to: syscall
      - opt:
          do:
            - return: false, false
          when: errno != 0
      - return: true, r&syscall.FD_CLOEXEC != 0
  - of: listFDs
    participants:
      - id: caller
        kind: actor
      - id: listFDs
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: entries, err
        eval: os.ReadDir(fdDir)
        to: os
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - var:
          name: out
          type: "[]int"
      - loop:
          do:
            - bind: fd, aerr
              eval: strconv.Atoi(e.Name())
              to: strconv
            - opt:
                do:
                  - set: out
                    value: append(out, fd)
                when: aerr == nil && fd >= firstPassedFD
          key: _
          range: entries
          value: e
      - return: out, nil
  - of: sealAll
    participants:
      - id: caller
        kind: actor
      - id: sealAll
        kind: self
      - id: listFDs
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - bind: fds, err
        eval: listFDs()
        to: listFDs
      - opt:
          do:
            - return: err
          when: err != nil
      - loop:
          do:
            - eval: syscall.CloseOnExec(fd)
              to: syscall
          key: _
          range: fds
          value: fd
      - return: nil
  - of: fdOf
    participants:
      - id: caller
        kind: actor
      - id: fdOf
        kind: self
      - id: f.SyscallConn
        kind: value
    steps:
      - bind: fd
        eval: "-1"
      - bind: raw, err
        eval: f.SyscallConn()
        to: f.SyscallConn
      - opt:
          do:
            - return: "-1, err"
          when: err != nil
      - return: fd, raw.Control(func(v uintptr) { fd = int(v) })
  - of: takeHandover
    participants:
      - id: caller
        kind: actor
      - id: takeHandover
        kind: self
      - id: os
        kind: stdlib
      - id: gone
        kind: internal
      - id: acceptHandover
        kind: internal
      - id: closeInherited
        kind: internal
      - id: stopChildren
        kind: internal
    steps:
      - bind: v, ok
        eval: os.LookupEnv(handoverEnv)
        to: os
      - opt:
          do:
            - return: nil, nil
          when: "!ok"
      - eval: gone(os.Unsetenv(handoverEnv))
        to: gone
      - bind: h, err
        eval: acceptHandover(v)
        to: acceptHandover
      - opt:
          do:
            - eval: closeInherited(nil)
              to: closeInherited
            - bind: stopped
              eval: stopChildren(ctx, grace)
              to: stopChildren
            - bind: fields
              eval: make([]errs.FieldValue, 0, len(stopped))
            - loop:
                do:
                  - set: fields
                    value: append(fields, errs.Int("pid", pid))
                key: _
                range: stopped
                value: pid
            - return: nil, errs.Wrap(err, errs.WrapParams{}, fields...)
          when: err != nil
      - return: h, nil
  - of: acceptHandover
    participants:
      - id: caller
        kind: actor
      - id: acceptHandover
        kind: self
      - id: strconv
        kind: stdlib
      - id: readPayload
        kind: internal
      - id: decodeHandover
        kind: internal
      - id: openRecords
        kind: internal
      - id: closeInherited
        kind: internal
      - id: resolveRefs
        kind: internal
    steps:
      - bind: fd, err
        eval: strconv.Atoi(v)
        to: strconv
      - opt:
          do:
            - return: nil, handoverInvalid("no payload descriptor", errs.String("env", v))
          when: err != nil || fd < firstPassedFD
      - bind: payload, err
        eval: readPayload(fd)
        to: readPayload
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: units, records, err
        eval: decodeHandover(payload)
        to: decodeHandover
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: opened, err
        eval: openRecords(records)
        to: openRecords
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: keep
        eval: make([]int, 0, len(records))
      - loop:
          do:
            - set: keep
              value: append(keep, r.fd)
          key: _
          range: records
          value: r
      - eval: closeInherited(keep)
        to: closeInherited
      - return: resolveRefs(units, opened), nil
        to: resolveRefs
  - of: readPayload
    participants:
      - id: caller
        kind: actor
      - id: readPayload
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - defer: func() { gone(syscall.Close(fd)) }()
      - var:
          name: st
          type: syscall.Stat_t
      - opt:
          do:
            - return: nil, handoverInvalid("the payload descriptor is no file", errs.Int("fd", fd))
          init:
            bind: err
            eval: syscall.Fstat(fd, &st)
            to: syscall
          when: err != nil || st.Mode&syscall.S_IFMT != syscall.S_IFREG
      - bind: seals, _, errno
        eval: syscall.Syscall(syscall.SYS_FCNTL, uintptr(fd), fGetSeals, 0)
        to: syscall
      - opt:
          do:
            - return: nil, handoverInvalid("the payload is not sealed whole", errs.Int("fd", fd))
          when: errno != 0 || seals&sealsWhole != sealsWhole
      - opt:
          do:
            - return: nil, handoverInvalid("a payload past its bound", errs.Int64("bytes", st.Size))
          when: st.Size > int64(maxHandoverBytes)
      - bind: buf
        eval: make([]byte, st.Size)
      - loop:
          cond: off < len(buf)
          do:
            - bind: n, err
              eval: syscall.Pread(fd, buf[off:], int64(off))
              to: syscall
            - opt:
                do:
                  - return: nil, handoverInvalid("the payload could not be read", errs.Int("fd", fd))
                when: err != nil || n == 0
            - op: +=
              set: "off"
              value: "n"
          init: off := 0
      - return: buf, nil
  - of: openRecords
    participants:
      - id: caller
        kind: actor
      - id: openRecords
        kind: self
      - id: checkRecord
        kind: internal
      - id: closeFiles
        kind: internal
      - id: syscall
        kind: stdlib
      - id: os
        kind: stdlib
    steps:
      - bind: opened
        eval: make(map[int]*os.File, len(records))
      - loop:
          do:
            - opt:
                do:
                  - eval: closeFiles(slices.Collect(mapIntValues(opened)))
                    to: closeFiles
                  - return: nil, err
                init:
                  bind: err
                  eval: checkRecord(r)
                  to: checkRecord
                when: err != nil
            - eval: syscall.CloseOnExec(r.fd)
              to: syscall
            - set: opened[r.index]
              to: os
              value: os.NewFile(uintptr(r.fd), "handover-"+strconv.Itoa(r.fd))
          key: _
          range: records
          value: r
      - return: opened, nil
  - of: checkRecord
    participants:
      - id: caller
        kind: actor
      - id: checkRecord
        kind: self
      - id: cloexec
        kind: internal
      - id: mismatch
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - bind: open, on
        eval: cloexec(r.fd)
        to: cloexec
      - opt:
          do:
            - return: mismatch(syscall.EBADF, r.fd)
              to: mismatch
          when: "!open || on"
      - var:
          name: st
          type: syscall.Stat_t
      - opt:
          do:
            - return: mismatch(err, r.fd)
              to: mismatch
          init:
            bind: err
            eval: syscall.Fstat(r.fd, &st)
            to: syscall
          when: err != nil
      - opt:
          do:
            - return: mismatch(syscall.ESTALE, r.fd)
              to: mismatch
          when: st.Mode&syscall.S_IFMT != r.mode || uint64(st.Dev) != r.dev || st.Ino != r.ino
      - return: nil
  - of: mapIntValues
    steps:
      - return:
          closure:
            params: yield func(*os.File) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(f)"
                  key: _
                  range: m
                  value: f
  - of: closeInherited
    participants:
      - id: caller
        kind: actor
      - id: closeInherited
        kind: self
      - id: listFDs
        kind: internal
      - id: cloexec
        kind: internal
      - id: gone
        kind: internal
    steps:
      - bind: fds, err
        eval: listFDs()
        to: listFDs
      - opt:
          do:
            - return: ""
          when: err != nil
      - loop:
          do:
            - bind: open, on
              eval: cloexec(fd)
              to: cloexec
            - opt:
                do:
                  - eval: gone(syscall.Close(fd))
                    to: gone
                when: open && !on && !slices.Contains(keep, fd)
          key: _
          range: fds
          value: fd
  - of: stopChildren
    participants:
      - id: caller
        kind: actor
      - id: stopChildren
        kind: self
      - id: childrenOf
        kind: internal
      - id: stopHanded
        kind: internal
    steps:
      - bind: pids
        eval: childrenOf(os.Getpid())
        to: childrenOf
      - var:
          name: procs
          type: "[]handedProc"
      - loop:
          do:
            - set: procs
              value: "append(procs, handedProc{pid: pid, child: true})"
          key: _
          range: pids
          value: pid
      - eval: stopHanded(ctx, grace, procs)
        to: stopHanded
      - return: pids
  - of: childrenOf
    participants:
      - id: caller
        kind: actor
      - id: childrenOf
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
      - id: parentOf
        kind: internal
    steps:
      - bind: entries, err
        eval: os.ReadDir("/proc")
        to: os
      - opt:
          do:
            - return: nil
          when: err != nil
      - var:
          name: out
          type: "[]int"
      - loop:
          do:
            - bind: pid, aerr
              eval: strconv.Atoi(e.Name())
              to: strconv
            - opt:
                do:
                  - set: out
                    value: append(out, pid)
                init:
                  bind: ppid, ok
                  eval: parentOf(pid)
                  to: parentOf
                when: aerr == nil && ok && ppid == parent
          key: _
          range: entries
          value: e
      - return: out
  - of: shallRestart
    participants:
      - id: caller
        kind: actor
      - id: shallRestart
        kind: self
      - id: restartTable
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: exited && s.prevent.Contains(exit)
      - opt:
          do:
            - return: s.typ != coresvc.TypeOneshot || result != coresvc.ResultSuccess
          when: exited && s.force.Contains(exit)
      - return: restartTable(s.restart, result)
        to: restartTable
  - of: bit
    steps:
      - return: 1 << r
  - of: restartTable
    steps:
      - opt:
          do:
            - return: "false"
          when: int(policy) >= len(table1)
      - return: table1[policy]&bit(result) != 0
  - of: restartDelay
    participants:
      - id: caller
        kind: actor
      - id: restartDelay
        kind: self
      - id: math
        kind: stdlib
      - id: backoff
        kind: package
    steps:
      - bind: base, ceiling, steps
        eval: s.restartDelay, s.restartMax, s.restartSteps
      - opt:
          do:
            - return: base
          when: n <= 1 || steps == 0 || base == 0 || ceiling == coresvc.Infinity || base >= ceiling
      - opt:
          do:
            - return: ceiling
          when: int64(n) > int64(steps)
      - bind: ratio
        eval: math.Pow(float64(ceiling)/float64(base), 1/float64(steps))
        to: math
      - return: backoff.Grow(base, ceiling, ratio, int(n))
        to: backoff
  - of: jitter
    participants:
      - id: caller
        kind: actor
      - id: jitter
        kind: self
      - id: time
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "0"
          when: bound <= 0
      - opt:
          do:
            - return: time.Duration(draw % uint64(math.MaxInt64))
              to: time
          when: bound == coresvc.Infinity
      - return: time.Duration(draw % (uint64(bound) + 1))
        to: time
  - of: addSaturating
    steps:
      - opt:
          do:
            - return: coresvc.Infinity
          when: a >= coresvc.Infinity-b
      - return: a + b
  - of: classifyMain
    participants:
      - id: caller
        kind: actor
      - id: classifyMain
        kind: self
      - id: uncleanResult
        kind: internal
    steps:
      - opt:
          do:
            - return: coresvc.ResultSuccess
          when: unknown || flags&coresvc.FlagIgnoreFailure != 0 || isClean(exit, &s.success, s.typ != coresvc.TypeOneshot)
      - return: uncleanResult(exit)
        to: uncleanResult
  - of: classifyControl
    participants:
      - id: caller
        kind: actor
      - id: classifyControl
        kind: self
      - id: uncleanResult
        kind: internal
    steps:
      - opt:
          do:
            - return: coresvc.ResultSuccess
          when: unknown || flags&coresvc.FlagIgnoreFailure != 0 || isClean(exit, nil, false)
      - return: uncleanResult(exit)
        to: uncleanResult
  - of: uncleanResult
    steps:
      - opt:
          do:
            - return: coresvc.ResultSignal
          when: exit.Signaled
      - return: coresvc.ResultExitCode
  - of: isClean
    steps:
      - opt:
          do:
            - return: exit.Code == 0 || (success != nil && success.Contains(exit))
          when: "!exit.Signaled"
      - return: (daemon && slices.Contains(cleanSignals, exit.Signal)) || (success != nil && success.Contains(exit))
  - of: resolveSandbox
    participants:
      - id: caller
        kind: actor
      - id: resolveSandbox
        kind: self
      - id: sandboxDirectives
        kind: internal
      - id: unsupported
        kind: internal
      - id: checkSandbox
        kind: internal
      - id: buildSandbox
        kind: internal
      - id: s.put
        kind: internal
      - id: checkSandboxed
        kind: internal
    steps:
      - bind: set
        eval: sandboxDirectives(cfg)
        to: sandboxDirectives
      - opt:
          do:
            - return: nil
          when: len(set) == 0 && cfg.Spec.Sandbox == nil
      - opt:
          do:
            - bind: name
              eval: sandboxDirective
            - opt:
                do:
                  - set: name
                    value: set[0]
                when: len(set) > 0
            - return: unsupported(name, "set", runtime.GOOS+"/"+runtime.GOARCH)
              to: unsupported
          when: "!sandboxPlatform()"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkSandbox(cfg, s)
            to: checkSandbox
          when: err != nil
      - set: s.sandbox
        to: buildSandbox
        value: buildSandbox(cfg, cfg.RootDirectory)
      - set: s.sandboxAway
        value: s.sandbox
      - opt:
          do:
            - eval: s.put(setRootStartOnly, true)
              to: s.put
            - set: s.sandboxAway
              to: buildSandbox
              value: buildSandbox(cfg, "")
            - set: s.sandboxAway.Root
              value: "\"\""
          when: cfg.RootDirectoryStartOnly && s.sandbox.Root != ""
      - eval: s.put(setSandboxed, true)
        to: s.put
      - return: checkSandboxed(cfg, s)
        to: checkSandboxed
  - of: checkSandbox
    participants:
      - id: caller
        kind: actor
      - id: checkSandbox
        kind: self
      - id: firstRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: firstRefusal(slices.Concat(valueRefusals(cfg, s), templateRefusals(cfg)))
            to: firstRefusal
          when: err != nil
      - bind: checks
        eval: "[]func(*Config) error{checkArchitectures, checkSyscallNames, checkSandboxPaths, checkNotifySocket}"
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: check(cfg)
                when: err != nil
          key: _
          range: checks
          value: check
      - return: nil
  - of: valueRefusals
    steps:
      - bind: filtered
        eval: len(cfg.SystemCallFilter.Syscalls) > 0
      - bind: errno
        eval: cfg.SystemCallErrorNumber
      - return: |-
          []sandboxRefusal{
          		{"ProtectSystem", cfg.ProtectSystem.String(), "", cfg.ProtectSystem > coresvc.ProtectSystemStrict},
          		{"ProtectSystem", "strict", "no until an issue asks: a read-only root whose /dev, /proc and /sys stay writable is a recursive read-only with exceptions, which S2's mounts do not make", cfg.ProtectSystem == coresvc.ProtectSystemStrict},
          		{"PrivateTmp", cfg.PrivateTmp.String(), "", cfg.PrivateTmp > coresvc.PrivateTmpDisconnected},
          		{"PrivateTmp", "yes", "no until an issue asks: directories on the host shared by every command and removed after the stop; disconnected, or BindPaths= of directories the caller makes", cfg.PrivateTmp == coresvc.PrivateTmpYes},
          		{"SystemCallErrorNumber", strconv.Itoa(errno), "", filtered && (errno < 0 || errno > errnoMax)},
          		{"PrivatePIDs", "with Type=forking", "", cfg.PrivatePIDs && s.typ == coresvc.TypeForking},
          	}
  - of: templateRefusals
    steps:
      - bind: tpl
        eval: cfg.Spec.Sandbox
      - opt:
          do:
            - set: tpl
              value: "&coreproc.SandboxValue{}"
          when: tpl == nil
      - return: |-
          []sandboxRefusal{
          		{"RootDirectory", cfg.RootDirectory, "", cfg.RootDirectory != "" && tpl.Root != "" && tpl.Root != cfg.RootDirectory},
          		{"CapabilityBoundingSet", "beside Spec.Sandbox.Capabilities", "", tpl.Capabilities != nil && capabilityDirectives(cfg)},
          		{"AmbientCapabilities", strconv.FormatUint(cfg.AmbientCapabilities, 16), "", cfg.AmbientCapabilities&^boundingSet(cfg) != 0},
          		{"SystemCallFilter", "beside Spec.Sandbox.Seccomp", "", tpl.Seccomp != nil && len(cfg.SystemCallFilter.Syscalls) > 0},
          	}
  - of: firstRefusal
    participants:
      - id: caller
        kind: actor
      - id: firstRefusal
        kind: self
      - id: unsupported
        kind: internal
      - id: invalid
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!r.bad"
            - opt:
                do:
                  - return: unsupported(r.directive, r.value, r.why)
                    to: unsupported
                when: r.why != ""
            - return: invalid(r.directive, r.value)
              to: invalid
          key: _
          range: refusals
          value: r
      - return: nil
  - of: checkArchitectures
    participants:
      - id: caller
        kind: actor
      - id: checkArchitectures
        kind: self
      - id: unsupported
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "unsupported(\"SystemCallArchitectures\", a, \"no until an issue asks: S2's filter admits the native ABI alone\")"
                    to: unsupported
                when: a != archNative
            - opt:
                do:
                  - return: "unsupported(\"SystemCallArchitectures\", a, \"a SystemCallFilter=: S2's filter checks the architecture before any call it names\")"
                    to: unsupported
                when: len(cfg.SystemCallFilter.Syscalls) == 0
          key: _
          range: cfg.SystemCallArchitectures
          value: a
      - return: nil
  - of: checkSyscallNames
    participants:
      - id: caller
        kind: actor
      - id: checkSyscallNames
        kind: self
      - id: invalid
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: invalid("SystemCallFilter", name)
                    to: invalid
                when: name == "" || strings.HasPrefix(name, "@")
          key: _
          range: cfg.SystemCallFilter.Syscalls
          value: name
      - return: nil
  - of: checkSandboxPaths
    participants:
      - id: caller
        kind: actor
      - id: checkSandboxPaths
        kind: self
      - id: invalid
        kind: internal
    steps:
      - bind: paths
        eval: |-
          []struct {
          		directive string
          		values    []string
          	}{
          		{"RootDirectory", optional(cfg.RootDirectory)},
          		{"ReadOnlyPaths", cfg.ReadOnlyPaths},
          		{"BindPaths", bindPaths(cfg.BindPaths)},
          		{"BindReadOnlyPaths", bindPaths(cfg.BindReadOnlyPaths)},
          		{"TemporaryFileSystem", tmpfsPaths(cfg.TemporaryFileSystem)},
          	}
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: invalid(p.directive, v)
                          to: invalid
                      when: "!path.IsAbs(v) || path.Clean(v) != v"
                key: _
                range: p.values
                value: v
          key: _
          range: paths
          value: p
      - return: nil
  - of: checkNotifySocket
    participants:
      - id: caller
        kind: actor
      - id: checkNotifySocket
        kind: self
      - id: cfg.Notify.Socket
        kind: value
      - id: unsupported
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: cfg.Notify == nil
      - bind: socket
        eval: cfg.Notify.Socket()
        to: cfg.Notify.Socket
      - opt:
          do:
            - return: "unsupported(\"RootDirectory\", cfg.RootDirectory, \"no until an issue asks: the notification socket \"+socket+\" is the host's path, which S2 cannot bind into the root\")"
              to: unsupported
          when: cfg.RootDirectory != ""
      - bind: hiders
        eval: |-
          []struct {
          		directive string
          		paths     []string
          	}{
          		{"TemporaryFileSystem", tmpfsPaths(cfg.TemporaryFileSystem)},
          		{"PrivateTmp", privateTmpOf(cfg)},
          	}
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: "unsupported(h.directive, p, \"the notification socket \"+socket+\" would be hidden: open it (ListenNotify) with TMPDIR outside the tmpfs\")"
                          to: unsupported
                      when: beneath(socket, p)
                key: _
                range: h.paths
                value: p
          key: _
          range: hiders
          value: h
      - return: nil
  - of: checkSandboxed
    participants:
      - id: caller
        kind: actor
      - id: checkSandboxed
        kind: self
      - id: invalid
        kind: internal
      - id: checkRootCommands
        kind: internal
    steps:
      - bind: sb
        eval: s.sandbox
      - opt:
          do:
            - return: invalid("FDs", "inherited beside a sandbox")
              to: invalid
          when: cfg.Spec.FDs == coreproc.FDsInherited
      - opt:
          do:
            - return: invalid("SupplementaryGroups", "in a user namespace")
              to: invalid
          when: len(cfg.Spec.Groups) > 0 && sb.Namespaces&coreproc.NamespaceUser != 0
      - opt:
          do:
            - return: nil
          when: sb.Root == ""
      - return: checkRootCommands(s)
        to: checkRootCommands
  - of: checkRootCommands
    participants:
      - id: caller
        kind: actor
      - id: checkRootCommands
        kind: self
      - id: invalid
        kind: internal
    steps:
      - loop:
          cond: l < listCount
          do:
            - opt:
                do:
                  - continue: true
                when: l != listStart && s.on(setRootStartOnly)
            - loop:
                do:
                  - bind: path
                    eval: c.Path
                  - opt:
                      do:
                        - set: path
                          value: s.shell
                      when: c.Flags&coresvc.FlagShell != 0
                  - opt:
                      do:
                        - return: invalid(listDirectives[l], path)
                          to: invalid
                      when: c.Flags&coresvc.FlagFullPrivileges == 0 && !strings.Contains(path, "/")
                key: _
                range: s.lists[l]
                value: c
          init: l := listCondition
          post: l++
      - return: nil
  - of: buildSandbox
    participants:
      - id: caller
        kind: actor
      - id: buildSandbox
        kind: self
      - id: cloneSandbox
        kind: internal
      - id: directiveMounts
        kind: internal
      - id: directiveNamespaces
        kind: internal
      - id: directiveCapabilities
        kind: internal
      - id: directiveSeccomp
        kind: internal
    steps:
      - bind: sb
        eval: cloneSandbox(cfg.Spec.Sandbox)
        to: cloneSandbox
      - bind: mounts
        eval: directiveMounts(cfg, root)
        to: directiveMounts
      - op: "|="
        set: sb.Namespaces
        to: directiveNamespaces
        value: directiveNamespaces(cfg, len(mounts) > 0)
      - set: sb.Mounts
        value: append(sb.Mounts, mounts...)
      - opt:
          do:
            - set: sb.Root
              value: cfg.RootDirectory
          when: cfg.RootDirectory != ""
      - set: sb.NoNewPrivileges
        value: sb.NoNewPrivileges || cfg.NoNewPrivileges
      - opt:
          do:
            - set: sb.Capabilities
              value: c
          init:
            bind: c
            eval: directiveCapabilities(cfg)
            to: directiveCapabilities
          when: c != nil
      - opt:
          do:
            - set: sb.Seccomp
              value: sc
          init:
            bind: sc
            eval: directiveSeccomp(cfg)
            to: directiveSeccomp
          when: sc != nil
      - return: sb
  - of: directiveMounts
    participants:
      - id: caller
        kind: actor
      - id: directiveMounts
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: mounts
          type: "[]coreproc.MountValue"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: cfg.ProtectSystem < p.level || (p.optional && !exists(root+p.path))
            - set: mounts
              value: "append(mounts, coreproc.MountValue{Kind: coreproc.MountReadOnly, Target: root + p.path})"
          key: _
          range: protectedSystem
          value: p
      - loop:
          do:
            - set: mounts
              value: "append(mounts, coreproc.MountValue{Kind: coreproc.MountReadOnly, Target: p})"
          key: _
          range: cfg.ReadOnlyPaths
          value: p
      - set: mounts
        value: append(mounts, binds(cfg.BindPaths, root, false)...)
      - set: mounts
        value: append(mounts, binds(cfg.BindReadOnlyPaths, root, true)...)
      - loop:
          do:
            - set: mounts
              value: "append(mounts, coreproc.MountValue{Kind: coreproc.MountTmpfs, Target: root + t.Path, ReadOnly: t.ReadOnly})"
          key: _
          range: cfg.TemporaryFileSystem
          value: t
      - loop:
          do:
            - set: mounts
              value: "append(mounts, coreproc.MountValue{Kind: coreproc.MountTmpfsSticky, Target: root + p})"
          key: _
          range: privateTmpOf(cfg)
          value: p
      - eval: |-
          slices.SortStableFunc(mounts, func(a, b coreproc.MountValue) int {
          		//: component by component: a parent first.
          		return slices.Compare(strings.Split(a.Target, "/"), strings.Split(b.Target, "/"))
          	})
        to: slices
      - return: mounts
  - of: directiveCapabilities
    steps:
      - opt:
          do:
            - return: nil
          when: "!capabilityDirectives(cfg)"
      - return: "&coreproc.CapabilitiesValue{Bounding: boundingSet(cfg), Ambient: cfg.AmbientCapabilities, SecureBits: cfg.SecureBits}"
  - of: capabilityDirectives
    steps:
      - return: cfg.CapabilityBoundingSet != nil || cfg.AmbientCapabilities != 0 || cfg.SecureBits != 0
  - of: boundingSet
    steps:
      - opt:
          do:
            - return: allCapabilities
          when: cfg.CapabilityBoundingSet == nil
      - return: "*cfg.CapabilityBoundingSet"
  - of: directiveSeccomp
    steps:
      - bind: f
        eval: cfg.SystemCallFilter
      - opt:
          do:
            - return: nil
          when: len(f.Syscalls) == 0
      - bind: refuse
        eval: coreproc.SeccompKill
      - opt:
          do:
            - set: refuse
              value: coreproc.SeccompErrno
          when: cfg.SystemCallErrorNumber > 0
      - bind: sc
        eval: "&coreproc.SeccompValue{Default: refuse, Syscalls: slices.Clone(f.Syscalls), Action: coreproc.SeccompAllow, Errno: cfg.SystemCallErrorNumber}"
      - opt:
          do:
            - set: sc.Default, sc.Action
              value: coreproc.SeccompAllow, refuse
          when: f.Deny
      - return: sc
  - of: cloneSandbox
    participants:
      - id: caller
        kind: actor
      - id: cloneSandbox
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "&coreproc.SandboxValue{}"
          when: sb == nil
      - bind: out
        eval: "*sb"
      - set: out.UIDMap, out.GIDMap, out.Mounts
        value: slices.Clone(sb.UIDMap), slices.Clone(sb.GIDMap), slices.Clone(sb.Mounts)
      - opt:
          do:
            - bind: c
              eval: "*sb.Capabilities"
            - set: out.Capabilities
              value: "&c"
          when: sb.Capabilities != nil
      - opt:
          do:
            - bind: l
              eval: "*sb.Landlock"
            - set: l.Rules
              to: slices
              value: slices.Clone(sb.Landlock.Rules)
            - set: out.Landlock
              value: "&l"
          when: sb.Landlock != nil
      - opt:
          do:
            - bind: sc
              eval: "*sb.Seccomp"
            - set: sc.Syscalls
              to: slices
              value: slices.Clone(sb.Seccomp.Syscalls)
            - set: out.Seccomp
              value: "&sc"
          when: sb.Seccomp != nil
      - return: "&out"
  - of: (*settings).sandboxFor
    steps:
      - opt:
          do:
            - return: s.sandboxAway
          when: l != listStart && s.on(setRootStartOnly)
      - return: s.sandbox
  - of: privateTmpOf
    steps:
      - opt:
          do:
            - return: privateTmpDirs
          when: cfg.PrivateTmp == coresvc.PrivateTmpDisconnected
      - return: nil
  - of: tmpfsPaths
    steps:
      - bind: out
        eval: make([]string, 0, len(paths))
      - loop:
          do:
            - set: out
              value: append(out, t.Path)
          key: _
          range: paths
          value: t
      - return: out
  - of: optional
    steps:
      - opt:
          do:
            - return: nil
          when: v == ""
      - return: "[]string{v}"
  - of: beneath
    steps:
      - return: path == dir || strings.HasPrefix(path, strings.TrimSuffix(dir, "/")+"/")
  - of: exists
    participants:
      - id: caller
        kind: actor
      - id: exists
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: _, err
        eval: os.Lstat(path)
        to: os
      - return: err == nil
  - of: (*keyWriter).str
    participants:
      - id: caller
        kind: actor
      - id: (*keyWriter).str
        kind: self
      - id: w.b.WriteString
        kind: value
      - id: w.b.WriteByte
        kind: value
    steps:
      - loop:
          do:
            - eval: w.b.WriteString(strconv.Itoa(len(v)))
              to: w.b.WriteString
            - eval: w.b.WriteByte(':')
              to: w.b.WriteByte
            - eval: w.b.WriteString(v)
              to: w.b.WriteString
          key: _
          range: vs
          value: v
  - of: (*keyWriter).num
    participants:
      - id: caller
        kind: actor
      - id: (*keyWriter).num
        kind: self
      - id: w.str
        kind: internal
    steps:
      - loop:
          do:
            - eval: w.str(strconv.FormatUint(v, 10))
              to: w.str
          key: _
          range: vs
          value: v
  - of: (*keyWriter).flag
    participants:
      - id: caller
        kind: actor
      - id: (*keyWriter).flag
        kind: self
      - id: w.str
        kind: internal
    steps:
      - loop:
          do:
            - eval: w.str(strconv.FormatBool(v))
              to: w.str
          key: _
          range: vs
          value: v
  - of: sandboxKey
    participants:
      - id: caller
        kind: actor
      - id: sandboxKey
        kind: self
      - id: w.num
        kind: internal
      - id: w.str
        kind: internal
      - id: w.flag
        kind: internal
      - id: keyCapabilities
        kind: internal
      - id: keyLandlock
        kind: internal
      - id: keySeccomp
        kind: internal
      - id: w.b.String
        kind: value
    steps:
      - opt:
          do:
            - return: "\"-\""
          when: sb == nil
      - bind: w
        eval: "&keyWriter{}"
      - eval: w.num(uint64(sb.Namespaces), uint64(len(sb.UIDMap)), uint64(len(sb.GIDMap)), uint64(len(sb.Mounts)))
        to: w.num
      - loop:
          do:
            - eval: w.num(uint64(m.Inside), uint64(m.Outside), uint64(m.Size))
              to: w.num
          key: _
          range: slices.Concat(sb.UIDMap, sb.GIDMap)
          value: m
      - loop:
          do:
            - eval: w.num(uint64(m.Kind))
              to: w.num
            - eval: w.str(m.Source, m.Target)
              to: w.str
            - eval: w.flag(m.ReadOnly)
              to: w.flag
          key: _
          range: sb.Mounts
          value: m
      - eval: w.str(sb.Root)
        to: w.str
      - eval: w.flag(sb.NoNewPrivileges, sb.Capabilities != nil, sb.Landlock != nil, sb.Seccomp != nil)
        to: w.flag
      - eval: keyCapabilities(w, sb.Capabilities)
        to: keyCapabilities
      - eval: keyLandlock(w, sb.Landlock)
        to: keyLandlock
      - eval: keySeccomp(w, sb.Seccomp)
        to: keySeccomp
      - return: w.b.String()
        to: w.b.String
  - of: keyCapabilities
    participants:
      - id: caller
        kind: actor
      - id: keyCapabilities
        kind: self
      - id: w.num
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: c == nil
      - eval: w.num(c.Bounding, c.Ambient, uint64(c.SecureBits))
        to: w.num
  - of: keyLandlock
    participants:
      - id: caller
        kind: actor
      - id: keyLandlock
        kind: self
      - id: w.num
        kind: internal
      - id: w.str
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: l == nil
      - eval: w.num(uint64(l.Handled), uint64(l.BestEffort), uint64(len(l.Rules)))
        to: w.num
      - loop:
          do:
            - eval: w.str(r.Path)
              to: w.str
            - eval: w.num(uint64(r.Access))
              to: w.num
          key: _
          range: l.Rules
          value: r
  - of: keySeccomp
    participants:
      - id: caller
        kind: actor
      - id: keySeccomp
        kind: self
      - id: w.num
        kind: internal
      - id: w.str
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: sc == nil
      - eval: w.num(uint64(sc.Default), uint64(sc.Action), uint64(len(sc.Syscalls)))
        to: w.num
      - eval: w.str(strconv.Itoa(sc.Errno))
        to: w.str
      - eval: w.str(sc.Syscalls...)
        to: w.str
  - of: (*settings).on
    steps:
      - return: s.flags&f != 0
  - of: (*settings).put
    steps:
      - opt:
          do:
            - op: "|="
              set: s.flags
              value: f
          when: "on"
  - of: resolve
    participants:
      - id: caller
        kind: actor
      - id: resolve
        kind: self
      - id: checkRanges
        kind: internal
      - id: s.put
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid("Name", "")
          when: cfg.Name == ""
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: checkRanges(cfg)
            to: checkRanges
          when: err != nil
      - bind: s
        eval: "&settings{name: cfg.Name, selfPID: os.Getpid()}"
      - eval: s.put(setHasCgroup, cfg.Cgroup != nil)
        to: s.put
      - eval: s.put(setHasAttacher, cfg.Attacher != nil)
        to: s.put
      - bind: steps
        eval: |-
          []func(*Config, *settings) error{
          		resolveType, resolveBus, resolveCgroup, resolveForking, resolveCommands, resolveSandbox, resolveRestart,
          		resolveDurations, resolveSignals, resolveStore, resolveNotify, resolveLimits,
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: step(cfg, s)
                when: err != nil
          key: _
          range: steps
          value: step
      - return: s, nil
  - of: checkRanges
    participants:
      - id: caller
        kind: actor
      - id: checkRanges
        kind: self
      - id: invalid
        kind: internal
    steps:
      - bind: ranges
        eval: |-
          []struct {
          		directive string
          		value     int
          		maxValue  int
          	}{
          		{"Type", int(cfg.Type), int(coresvc.TypeIdle)},
          		{"Restart", int(cfg.Restart), int(coresvc.RestartAlways)},
          		{"RestartMode", int(cfg.RestartMode), int(coresvc.RestartModeDebug)},
          		{"TimeoutStartFailureMode", int(cfg.TimeoutStartFailureMode), int(coresvc.TimeoutKill)},
          		{"TimeoutStopFailureMode", int(cfg.TimeoutStopFailureMode), int(coresvc.TimeoutKill)},
          		{"NotifyAccess", int(cfg.NotifyAccess), int(coresvc.NotifyAccessAll)},
          		{"KillMode", int(cfg.KillMode), int(coresvc.KillModeNone)},
          		{"ExitType", int(cfg.ExitType), int(coresvc.ExitTypeCgroup)},
          		{"OOMPolicy", int(cfg.OOMPolicy), int(coresvc.OOMPolicyKill)},
          		{"FileDescriptorStorePreserve", int(cfg.FileDescriptorStorePreserve), int(coresvc.PreserveOnSuccess)},
          		{"SendSIGKILL", int(cfg.SendSIGKILL), int(coresvc.ToggleNo)},
          		{"GuessMainPID", int(cfg.GuessMainPID), int(coresvc.ToggleNo)},
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: invalid(r.directive, strconv.Itoa(r.value))
                    to: invalid
                when: r.value > r.maxValue
          key: _
          range: ranges
          value: r
      - return: nil
  - of: resolveType
    participants:
      - id: caller
        kind: actor
      - id: resolveType
        kind: self
      - id: defaultType
        kind: internal
      - id: s.put
        kind: internal
      - id: unsupported
        kind: internal
    steps:
      - set: s.typ
        value: cfg.Type
      - opt:
          do:
            - set: s.typ
              to: defaultType
              value: defaultType(cfg)
          when: s.typ == coresvc.TypeDefault
      - eval: s.put(setRemainAfterExit, cfg.RemainAfterExit)
        to: s.put
      - eval: s.put(setSendSIGHUP, cfg.SendSIGHUP)
        to: s.put
      - eval: s.put(setSendSIGKILL, cfg.SendSIGKILL.On(true))
        to: s.put
      - eval: s.put(setSurviveFinal, cfg.SurviveFinalKillSignal)
        to: s.put
      - set: s.shell
        value: cfg.Shell
      - opt:
          do:
            - set: s.shell
              value: defaultShell
          when: s.shell == ""
      - opt:
          do:
            - return: unsupported("Type", s.typ.String(), "windows")
              to: unsupported
          when: isNotifyType(s.typ) && runtime.GOOS == osWindows
      - return: nil
  - of: resolveForking
    participants:
      - id: caller
        kind: actor
      - id: resolveForking
        kind: self
      - id: unsupported
        kind: internal
      - id: invalid
        kind: internal
      - id: s.put
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.typ != coresvc.TypeForking
      - opt:
          do:
            - return: unsupported("Type", "forking", "windows")
              to: unsupported
          when: runtime.GOOS == osWindows
      - opt:
          do:
            - return: invalid("Attacher", "none for Type=forking")
              to: invalid
          when: cfg.Attacher == nil
      - opt:
          do:
            - opt:
                do:
                  - return: invalid("PIDFile", cfg.PIDFile)
                    to: invalid
                when: "!filepath.IsAbs(cfg.PIDFile) || filepath.Clean(cfg.PIDFile) != cfg.PIDFile"
            - set: s.pidFile
              value: cfg.PIDFile
            - return: nil
          when: cfg.PIDFile != ""
      - opt:
          do:
            - return: "unsupported(\"GuessMainPID\", strconv.FormatBool(cfg.GuessMainPID.On(true)), \"PIDFile= or a Cgroup that lists its members (S0g #734)\")"
              to: unsupported
          init:
            bind: _, lists
            eval: cfg.Cgroup.(coresvc.CgroupMembers)
          when: "!lists"
      - eval: s.put(setGuess, cfg.GuessMainPID.On(true))
        to: s.put
      - return: nil
  - of: resolveCommands
    participants:
      - id: caller
        kind: actor
      - id: resolveCommands
        kind: self
      - id: invalid
        kind: internal
      - id: checkCommand
        kind: internal
    steps:
      - set: s.lists
        value: |-
          [listCount][]coresvc.CommandValue{
          		listCondition: cfg.ExecCondition, listStartPre: cfg.ExecStartPre, listStart: cfg.ExecStart,
          		listStartPost: cfg.ExecStartPost, listReload: cfg.ExecReload, listReloadPost: cfg.ExecReloadPost,
          		listStop: cfg.ExecStop, listStopPost: cfg.ExecStopPost,
          	}
      - opt:
          do:
            - return: invalid("ExecStart", strconv.Itoa(len(cfg.ExecStart)))
              to: invalid
          when: s.typ != coresvc.TypeOneshot && len(cfg.ExecStart) != 1
      - opt:
          do:
            - return: invalid("ExecStart", "0")
              to: invalid
          when: len(cfg.ExecStart) == 0 && (!cfg.RemainAfterExit || len(cfg.ExecStop) == 0)
      - loop:
          cond: l < listCount
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: checkCommand(cfg, l, cmd)
                        to: checkCommand
                      when: err != nil
                key: _
                range: s.lists[l]
                value: cmd
          init: l := listCondition
          post: l++
      - return: nil
  - of: checkCommand
    participants:
      - id: caller
        kind: actor
      - id: checkCommand
        kind: self
      - id: invalid
        kind: internal
      - id: unsupported
        kind: internal
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: invalid(listDirectives[l], "")
              to: invalid
          when: cmd.Path == "" && cmd.Flags&coresvc.FlagShell == 0
      - opt:
          do:
            - return: invalid(listDirectives[l], cmd.Path)
              to: invalid
          when: cmd.Path != "" && len(cmd.Args) == 0
      - opt:
          do:
            - opt:
                do:
                  - return: unsupported(listDirectives[l], cmd.Flags.String(), "windows")
                    to: unsupported
                when: runtime.GOOS == osWindows
            - opt:
                do:
                  - return: errs.Wrap(coresvc.PrivilegeRefused, errs.WrapParams{}, errs.String("directive", listDirectives[l]), errs.String("unit", cfg.Name))
                    to: errs
                when: "!cfg.AllowPrivilegedControl"
          when: cmd.Flags.Privileged()
      - return: nil
  - of: resolveRestart
    participants:
      - id: caller
        kind: actor
      - id: resolveRestart
        kind: self
      - id: invalid
        kind: internal
      - id: checkStatusSet
        kind: internal
    steps:
      - set: s.restart, s.restartMode, s.restartSteps
        value: cfg.Restart, cfg.RestartMode, cfg.RestartSteps
      - opt:
          do:
            - return: invalid("Restart", s.restart.String())
              to: invalid
          when: s.typ == coresvc.TypeOneshot && (s.restart == coresvc.RestartAlways || s.restart == coresvc.RestartOnSuccess)
      - opt:
          do:
            - return: invalid("RestartSteps", strconv.Itoa(cfg.RestartSteps))
              to: invalid
          when: cfg.RestartSteps < 0
      - bind: sets
        eval: |-
          []struct {
          		set       coresvc.ExitStatusValue
          		directive string
          	}{
          		{cfg.SuccessExitStatus, "SuccessExitStatus"},
          		{cfg.RestartPreventExitStatus, "RestartPreventExitStatus"},
          		{cfg.RestartForceExitStatus, "RestartForceExitStatus"},
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: checkStatusSet(e.set, e.directive)
                  to: checkStatusSet
                when: err != nil
          key: _
          range: sets
          value: e
      - set: s.success, s.prevent, s.force
        value: cfg.SuccessExitStatus, cfg.RestartPreventExitStatus, cfg.RestartForceExitStatus
      - return: nil
  - of: checkStatusSet
    participants:
      - id: caller
        kind: actor
      - id: checkStatusSet
        kind: self
      - id: invalid
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: invalid(directive, strconv.Itoa(c))
                    to: invalid
                when: c < 0 || c > maxExitCode
          key: _
          range: set.Codes
          value: c
      - loop:
          do:
            - opt:
                do:
                  - return: invalid(directive, sig.String())
                    to: invalid
                when: "!sig.Known()"
          key: _
          range: set.Signals
          value: sig
      - return: nil
  - of: resolveDurations
    participants:
      - id: caller
        kind: actor
      - id: resolveDurations
        kind: self
      - id: resolveDuration
        kind: internal
      - id: unsupported
        kind: internal
    steps:
      - bind: oneshotStart
        eval: defaultTimeout
      - opt:
          do:
            - set: oneshotStart
              value: coresvc.Infinity
          when: s.typ == coresvc.TypeOneshot
      - bind: durations
        eval: |-
          []struct {
          		dst       *time.Duration
          		directive string
          		value     time.Duration
          		def       time.Duration
          		zero      time.Duration
          	}{
          		{&s.timeoutStart, "TimeoutStartSec", cfg.TimeoutStart, oneshotStart, coresvc.Infinity},
          		{&s.timeoutStop, "TimeoutStopSec", cfg.TimeoutStop, defaultTimeout, coresvc.Infinity},
          		{&s.runtimeMax, "RuntimeMaxSec", cfg.RuntimeMax, coresvc.Infinity, coresvc.Infinity},
          		{&s.runtimeJitter, "RuntimeRandomizedExtraSec", cfg.RuntimeRandomizedExtra, 0, 0},
          		{&s.watchdog, "WatchdogSec", cfg.Watchdog, 0, 0},
          		{&s.restartDelay, "RestartSec", cfg.RestartDelay, defaultRestartDelay, 0},
          		{&s.restartMax, "RestartMaxDelaySec", cfg.RestartMaxDelay, coresvc.Infinity, coresvc.Infinity},
          		{&s.restartJitter, "RestartRandomizedDelaySec", cfg.RestartRandomizedDelay, 0, 0},
          	}
      - loop:
          do:
            - bind: v, err
              eval: resolveDuration(d.directive, d.value, d.def, d.zero)
              to: resolveDuration
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: "*d.dst"
              value: v
          key: _
          range: durations
          value: d
      - bind: abort, err
        eval: resolveDuration("TimeoutAbortSec", cfg.TimeoutAbort, s.timeoutStop, coresvc.Infinity)
        to: resolveDuration
      - opt:
          do:
            - return: err
          when: err != nil
      - set: s.timeoutAbort
        value: abort
      - set: s.startMode, s.stopMode
        value: cfg.TimeoutStartFailureMode, cfg.TimeoutStopFailureMode
      - opt:
          do:
            - return: unsupported("WatchdogSec", cfg.Watchdog.String(), "windows")
              to: unsupported
          when: s.watchdog > 0 && s.watchdog != coresvc.Infinity && runtime.GOOS == osWindows
      - opt:
          do:
            - set: s.watchdog
              value: "0"
          when: s.watchdog == coresvc.Infinity
      - return: nil
  - of: resolveDuration
    steps:
      - switch:
          cases:
            - case: value == 0
              do:
                - return: def, nil
            - case: value == coresvc.Zero
              do:
                - return: zero, nil
            - case: value < 0
              do:
                - return: 0, invalid(directive, value.String())
            - default: true
              do:
                - return: value, nil
  - of: resolveSignals
    participants:
      - id: caller
        kind: actor
      - id: resolveSignals
        kind: self
      - id: platformSignals
        kind: internal
      - id: resolveSignal
        kind: internal
      - id: unsupported
        kind: internal
    steps:
      - set: s.sigcont, s.sighup
        to: platformSignals
        value: platformSignals()
      - bind: kill, abort
        eval: sigTERM, sigABRT
      - opt:
          do:
            - set: kill, abort
              value: sigKILL, sigKILL
          when: runtime.GOOS == osWindows
      - bind: signals
        eval: |-
          []struct {
          		dst       *coreproc.Signal
          		directive string
          		value     coreproc.Signal
          		def       coreproc.Signal
          	}{
          		{&s.killSignal, "KillSignal", cfg.KillSignal, kill},
          		{&s.finalKillSignal, "FinalKillSignal", cfg.FinalKillSignal, sigKILL},
          		{&s.watchdogSig, "WatchdogSignal", cfg.WatchdogSignal, abort},
          		{&s.reloadSignal, "ReloadSignal", cfg.ReloadSignal, sigHUP},
          	}
      - loop:
          do:
            - bind: v, err
              eval: resolveSignal(sig.directive, sig.value, sig.def)
              to: resolveSignal
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: "*sig.dst"
              value: v
          key: _
          range: signals
          value: sig
      - bind: restartKill, err
        eval: resolveSignal("RestartKillSignal", cfg.RestartKillSignal, s.killSignal)
        to: resolveSignal
      - opt:
          do:
            - return: err
          when: err != nil
      - set: s.restartKillSignal
        value: restartKill
      - opt:
          do:
            - return: unsupported("SendSIGHUP", "yes", "windows")
              to: unsupported
          when: s.on(setSendSIGHUP) && runtime.GOOS == osWindows
      - return: nil
  - of: resolveSignal
    steps:
      - opt:
          do:
            - return: def, nil
          when: value == 0
      - opt:
          do:
            - return: 0, invalid(directive, strconv.Itoa(value.Int()))
          when: "!value.Known()"
      - opt:
          do:
            - return: 0, unsupported(directive, value.String(), "windows")
          when: runtime.GOOS == osWindows && value != sigKILL
      - return: value, nil
  - of: resolveNotify
    participants:
      - id: caller
        kind: actor
      - id: resolveNotify
        kind: self
      - id: unsupported
        kind: internal
      - id: invalid
        kind: internal
      - id: cfg.Notify.Socket
        kind: value
    steps:
      - set: s.notifyAccess
        value: cfg.NotifyAccess
      - opt:
          do:
            - set: s.notifyAccess
              value: coresvc.NotifyAccessMain
          when: s.notifyAccess == coresvc.NotifyAccessNone && listensToMain(s)
      - opt:
          do:
            - return: unsupported("NotifyAccess", s.notifyAccess.String(), "no cgroup")
              to: unsupported
          when: (s.notifyAccess == coresvc.NotifyAccessExec || s.notifyAccess == coresvc.NotifyAccessAll) && cfg.Cgroup == nil
      - opt:
          do:
            - return: invalid("NotifyAccess", s.notifyAccess.String()+" without a NotifySource")
              to: invalid
          when: s.notifyAccess != coresvc.NotifyAccessNone && cfg.Notify == nil
      - opt:
          do:
            - set: s.socket
              to: cfg.Notify.Socket
              value: cfg.Notify.Socket()
          when: cfg.Notify != nil
      - return: nil
  - of: resolveStore
    participants:
      - id: caller
        kind: actor
      - id: resolveStore
        kind: self
      - id: invalid
        kind: internal
      - id: unsupported
        kind: internal
    steps:
      - bind: "n"
        eval: cfg.FileDescriptorStoreMax
      - opt:
          do:
            - return: invalid("FileDescriptorStoreMax", strconv.Itoa(n))
              to: invalid
          when: n < 0
      - opt:
          do:
            - return: nil
          when: n == 0
      - opt:
          do:
            - return: unsupported("FileDescriptorStoreMax", strconv.Itoa(n), runtime.GOOS)
              to: unsupported
          when: runtime.GOOS != osLinux
      - opt:
          do:
            - return: invalid("FileDescriptorStoreMax", strconv.Itoa(n)+" without a NotifySource")
              to: invalid
          when: cfg.Notify == nil
      - set: s.storeMax, s.preserve, s.storeKey
        value: n, cfg.FileDescriptorStorePreserve, storeKey(cfg, s.sandbox)
      - return: nil
  - of: storeKey
    participants:
      - id: caller
        kind: actor
      - id: storeKey
        kind: self
      - id: b.WriteString
        kind: value
      - id: b.WriteByte
        kind: value
      - id: sha256
        kind: stdlib
    steps:
      - var:
          name: b
          type: strings.Builder
      - bind: field
        eval:
          closure:
            params: v string
            steps:
              - eval: b.WriteString(strconv.Itoa(len(v)))
                to: b.WriteString
              - eval: b.WriteByte(':')
                to: b.WriteByte
              - eval: b.WriteString(v)
                to: b.WriteString
      - eval: field(sandboxKey(sb))
      - eval: field(cfg.Spec.User)
      - eval: field(cfg.Spec.Group)
      - eval: field(strconv.Itoa(len(cfg.Spec.Groups)))
      - loop:
          do:
            - eval: field(g)
          key: _
          range: cfg.Spec.Groups
          value: g
      - eval: field(strconv.Itoa(len(cfg.ExecStart)))
      - loop:
          do:
            - eval: field(c.Path)
            - eval: field(strconv.Itoa(int(c.Flags)))
            - eval: field(strconv.Itoa(len(c.Args)))
            - loop:
                do:
                  - eval: field(w)
                key: _
                range: c.Args
                value: w
          key: _
          range: cfg.ExecStart
          value: c
      - bind: sum
        eval: sha256.Sum256([]byte(b.String()))
        to: sha256
      - return: cfg.Name + "/" + hex.EncodeToString(sum[:])
  - of: resolveLimits
    participants:
      - id: caller
        kind: actor
      - id: resolveLimits
        kind: self
      - id: invalid
        kind: internal
      - id: resolveDuration
        kind: internal
      - id: s.put
        kind: internal
    steps:
      - opt:
          do:
            - return: invalid("StartLimitBurst", strconv.Itoa(cfg.StartLimitBurst))
              to: invalid
          when: cfg.StartLimitBurst < 0
      - set: s.limitBurst
        value: cfg.StartLimitBurst
      - opt:
          do:
            - set: s.limitBurst
              value: defaultLimitBurst
          when: s.limitBurst == 0
      - bind: interval, err
        eval: resolveDuration("StartLimitIntervalSec", cfg.StartLimitInterval, defaultLimitInterval, 0)
        to: resolveDuration
      - opt:
          do:
            - return: err
          when: err != nil
      - set: s.limitInterval
        value: interval
      - eval: s.put(setLimitOff, interval == 0)
        to: s.put
      - return: nil
  - of: listensToMain
    steps:
      - return: isNotifyType(s.typ) || s.watchdog > 0 || s.storeMax > 0
  - of: isNotifyType
    steps:
      - return: t == coresvc.TypeNotify || t == coresvc.TypeNotifyReload
  - of: invalid
    participants:
      - id: caller
        kind: actor
      - id: invalid
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coresvc.ConfigInvalid, errs.WrapParams{}, errs.String("directive", directive), errs.String("value", value))
        to: errs
  - of: unsupported
    participants:
      - id: caller
        kind: actor
      - id: unsupported
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coresvc.DirectiveUnsupported, errs.WrapParams{},
          		errs.String("directive", directive), errs.String("value", value), errs.String("issue", issue))
        to: errs
  - of: platformSignals
    participants:
      - id: caller
        kind: actor
      - id: platformSignals
        kind: self
      - id: coreproc
        kind: package
    steps:
      - return: coreproc.Signal(syscall.SIGCONT), coreproc.Signal(syscall.SIGHUP)
        to: coreproc
  - of: buildSpec
    participants:
      - id: caller
        kind: actor
      - id: buildSpec
        kind: self
      - id: s.sandboxFor
        kind: internal
      - id: mergeEnv
        kind: internal
      - id: expandArgs
        kind: internal
      - id: shellCommand
        kind: internal
      - id: privilegedEnv
        kind: internal
    steps:
      - bind: spec
        eval: "*template"
      - bind: cmd
        eval: ef.cmd
      - set: spec.Sandbox
        to: s.sandboxFor
        value: s.sandboxFor(ef.list)
      - opt:
          do:
            - set: spec.Sandbox
              value: nil
          when: cmd.Flags&coresvc.FlagFullPrivileges != 0
      - bind: env
        eval: mergeEnv(template.Env, ef.vars)
        to: mergeEnv
      - bind: args
        eval: cmd.Args
      - opt:
          do:
            - set: args
              to: expandArgs
              value: expandArgs(args, env)
          when: cmd.Flags&coresvc.FlagNoEnvExpand == 0
      - bind: path
        eval: cmd.Path
      - opt:
          do:
            - set: path, args
              to: shellCommand
              value: shellCommand(s.shell, cmd, args)
          when: cmd.Flags&coresvc.FlagShell != 0
      - opt:
          do:
            - set: spec.User, spec.Group, spec.Groups
              value: "\"\", \"\", nil"
            - set: env
              to: privilegedEnv
              value: privilegedEnv(env)
          when: cmd.Flags.Privileged()
      - set: spec.Path, spec.Args, spec.Env
        value: path, args, env
      - opt:
          do:
            - set: spec.CgroupPath
              value: s.cgroupPath
          when: spec.CgroupPath == ""
      - return: spec
  - of: mergeEnv
    participants:
      - id: caller
        kind: actor
      - id: mergeEnv
        kind: self
      - id: namesOf
        kind: internal
      - id: nameKey
        kind: internal
    steps:
      - bind: engine
        eval: namesOf(vars)
        to: namesOf
      - bind: last
        eval: make(map[string]int, len(base))
      - loop:
          do:
            - set: last[nameKey(envName(v))]
              value: i
          key: i
          range: base
          value: v
      - bind: out
        eval: make([]string, 0, len(base)+len(vars)+1)
      - loop:
          do:
            - bind: name
              eval: nameKey(envName(v))
              to: nameKey
            - opt:
                do:
                  - continue: true
                when: engine[name] || last[name] != i
            - set: out
              value: append(out, v)
          key: i
          range: base
          value: v
      - bind: path
        eval: nameKey("PATH")
        to: nameKey
      - opt:
          do:
            - set: out
              value: append(out, "PATH="+fixedPath)
          init:
            bind: _, named
            eval: last[path]
          when: "!named && !engine[path]"
      - return: append(out, vars...)
  - of: namesOf
    steps:
      - bind: set
        eval: make(map[string]bool, len(vars))
      - loop:
          do:
            - set: set[nameKey(envName(v))]
              value: "true"
          key: _
          range: vars
          value: v
      - return: set
  - of: envName
    participants:
      - id: caller
        kind: actor
      - id: envName
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - bind: name, _, _
              eval: strings.Cut(rest, "=")
              to: strings
            - return: "\"=\" + name"
          init:
            bind: rest, drive
            eval: strings.CutPrefix(assignment, "=")
            to: strings
          when: drive
      - bind: name, _, _
        eval: strings.Cut(assignment, "=")
        to: strings
      - return: name
  - of: nameKey
    participants:
      - id: caller
        kind: actor
      - id: nameKey
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: strings.ToUpper(name)
              to: strings
          when: runtime.GOOS == osWindows
      - return: name
  - of: privilegedEnv
    participants:
      - id: caller
        kind: actor
      - id: privilegedEnv
        kind: self
      - id: envName
        kind: internal
    steps:
      - bind: out
        eval: make([]string, 0, len(env))
      - loop:
          do:
            - bind: name
              eval: envName(v)
              to: envName
            - opt:
                do:
                  - continue: true
                when: strings.HasPrefix(name, "LD_") || name == "ENV" || name == "BASH_ENV" || name == "PATH"
            - set: out
              value: append(out, v)
          key: _
          range: env
          value: v
      - return: append(out, "PATH="+fixedPath)
  - of: shellCommand
    participants:
      - id: caller
        kind: actor
      - id: shellCommand
        kind: self
      - id: shellQuote
        kind: internal
    steps:
      - bind: argv0
        eval: shell
      - opt:
          do:
            - set: argv0
              value: "\"-\" + filepath.Base(shell)"
          when: cmd.Flags&coresvc.FlagArgv0 != 0
      - opt:
          do:
            - return: shell, []string{argv0}
          when: cmd.Path == ""
      - bind: words
        eval: make([]string, len(args))
      - loop:
          do:
            - set: words[i]
              to: shellQuote
              value: shellQuote(w)
          key: i
          range: args
          value: w
      - return: shell, []string{argv0, "-c", strings.Join(words, " ")}
  - of: shellQuote
    steps:
      - opt:
          do:
            - return: w
          when: w != "" && strings.Trim(w, shellPlain) == ""
      - return: "\"'\" + strings.ReplaceAll(w, \"'\", `'\\''`) + \"'\""
  - of: expandArgs
    participants:
      - id: caller
        kind: actor
      - id: expandArgs
        kind: self
      - id: envMap
        kind: internal
      - id: bareVar
        kind: internal
    steps:
      - opt:
          do:
            - return: args
          when: len(args) < 2
      - bind: values
        eval: envMap(env)
        to: envMap
      - bind: out
        eval: make([]string, 0, len(args))
      - set: out
        value: append(out, args[0])
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, splitWords(values[name])...)
                  - continue: true
                init:
                  bind: name, ok
                  eval: bareVar(w)
                  to: bareVar
                when: ok
            - set: out
              value: append(out, expandWord(w, values))
          key: _
          range: args[1:]
          value: w
      - return: out
  - of: envMap
    participants:
      - id: caller
        kind: actor
      - id: envMap
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: values
        eval: make(map[string]string, len(env))
      - loop:
          do:
            - bind: name, value, _
              eval: strings.Cut(v, "=")
              to: strings
            - set: values[name]
              value: value
          key: _
          range: env
          value: v
      - return: values
  - of: bareVar
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: len(w) < 2 || w[0] != '$' || !isName(w[1:])
      - return: w[1:], true
  - of: isDigit
    steps:
      - return: "'0' <= c && c <= '9'"
  - of: isLetter
    steps:
      - return: c == '_' || ('a' <= c && c <= 'z') || ('A' <= c && c <= 'Z')
  - of: expandWord
    participants:
      - id: caller
        kind: actor
      - id: expandWord
        kind: self
      - id: strings
        kind: stdlib
      - id: b.WriteString
        kind: value
      - id: b.String
        kind: value
      - id: dollar
        kind: internal
    steps:
      - var:
          name: b
          type: strings.Builder
      - bind: rest
        eval: w
      - loop:
          do:
            - bind: i
              eval: strings.IndexByte(rest, '$')
              to: strings
            - opt:
                do:
                  - eval: b.WriteString(rest)
                    to: b.WriteString
                  - return: b.String()
                    to: b.String
                when: i < 0
            - eval: b.WriteString(rest[:i])
              to: b.WriteString
            - bind: repl, n
              eval: dollar(rest[i:], values)
              to: dollar
            - eval: b.WriteString(repl)
              to: b.WriteString
            - set: rest
              value: rest[i+n:]
          forever: true
  - of: dollar
    participants:
      - id: caller
        kind: actor
      - id: dollar
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"$\", len(\"$$\")"
          when: strings.HasPrefix(s, "$$")
      - bind: end
        eval: strings.IndexByte(s, '}')
        to: strings
      - opt:
          do:
            - return: values[s[2:end]], end + 1
          when: strings.HasPrefix(s, "${") && end > 0 && isName(s[2:end])
      - return: "\"$\", 1"
  - of: splitWords
    participants:
      - id: caller
        kind: actor
      - id: splitWords
        kind: self
      - id: sp.take
        kind: internal
      - id: sp.flush
        kind: internal
    steps:
      - bind: sp
        eval: "&splitter{}"
      - loop:
          do:
            - eval: sp.take(v[i])
              to: sp.take
          key: i
          range: len(v)
      - eval: sp.flush()
        to: sp.flush
      - return: sp.words
  - of: (*splitter).take
    participants:
      - id: caller
        kind: actor
      - id: (*splitter).take
        kind: self
      - id: sp.quoted
        kind: internal
      - id: sp.flush
        kind: internal
      - id: sp.cur.WriteByte
        kind: value
    steps:
      - switch:
          cases:
            - case: sp.quote != 0
              do:
                - eval: sp.quoted(c)
                  to: sp.quoted
            - case: c == '\'' || c == '"'
              do:
                - set: sp.quote, sp.open
                  value: c, true
            - case: strings.IndexByte(" \t\n", c) >= 0
              do:
                - eval: sp.flush()
                  to: sp.flush
            - default: true
              do:
                - eval: sp.cur.WriteByte(c)
                  to: sp.cur.WriteByte
                - set: sp.open
                  value: "true"
  - of: (*splitter).quoted
    participants:
      - id: caller
        kind: actor
      - id: (*splitter).quoted
        kind: self
      - id: sp.cur.WriteByte
        kind: value
    steps:
      - opt:
          do:
            - set: sp.quote
              value: "0"
            - return: ""
          when: c == sp.quote
      - eval: sp.cur.WriteByte(c)
        to: sp.cur.WriteByte
  - of: (*splitter).flush
    participants:
      - id: caller
        kind: actor
      - id: (*splitter).flush
        kind: self
      - id: sp.cur.Reset
        kind: value
    steps:
      - opt:
          do:
            - set: sp.words
              value: append(sp.words, sp.cur.String())
            - eval: sp.cur.Reset()
              to: sp.cur.Reset
            - set: sp.open
              value: "false"
          when: sp.open
  - of: (*step).onSpawned
    participants:
      - id: caller
        kind: actor
      - id: (*step).onSpawned
        kind: self
      - id: m.set
        kind: internal
      - id: st.noteSandboxFailure
        kind: internal
      - id: st.enterStartPost
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - opt:
          do:
            - eval: m.set(flagBusOwned, ev.has(flagOwner))
              to: m.set
          when: ev.has(flagLookup)
      - opt:
          do:
            - eval: st.noteSandboxFailure(ev.spawnErr)
              to: st.noteSandboxFailure
            - opt:
                do:
                  - eval: spawnFailures[ev.list](st, m.cmd == 0, spawnResult(ev.spawnErr))
                when: ev.list > listNone && ev.list < listCount
            - return: ""
          when: ev.spawnErr != nil
      - opt:
          do:
            - set: m.controlPID
              value: ev.pid
            - return: ""
          when: ev.list != listStart || m.s.typ == coresvc.TypeForking
      - set: m.mainPID
        value: ev.pid
      - eval: m.set(flagMainExited, false)
        to: m.set
      - opt:
          do:
            - eval: st.enterStartPost()
              to: st.enterStartPost
          when: m.sub == coresvc.SubStart && upOnSpawn(m.s.typ)
  - of: upOnSpawn
    steps:
      - return: t == coresvc.TypeSimple || t == coresvc.TypeExec || t == coresvc.TypeIdle
  - of: (*step).firstOr
    steps:
      - opt:
          do:
            - eval: first()
            - return: ""
          when: isFirst
      - eval: then()
  - of: (*step).preStartSpawnFailed
    participants:
      - id: caller
        kind: actor
      - id: (*step).preStartSpawnFailed
        kind: self
      - id: st.firstOr
        kind: internal
    steps:
      - eval: st.firstOr(first, func() { st.enterDead(r, true) }, st.signalWith(r))
        to: st.firstOr
  - of: (*step).reloadSpawnFailed
    participants:
      - id: caller
        kind: actor
      - id: (*step).reloadSpawnFailed
        kind: self
      - id: st.enterRunning
        kind: internal
    steps:
      - set: st.m.reloadResult
        value: r
      - eval: st.enterRunning(coresvc.ResultSuccess)
        to: st.enterRunning
  - of: (*step).signalWith
    participants:
      - id: caller
        kind: actor
      - id: (*step).signalWith
        kind: self
      - id: st.enterSignal
        kind: internal
    steps:
      - return:
          closure:
            steps:
              - eval: st.enterSignal(coresvc.SubStopSigterm, r)
                to: st.enterSignal
  - of: (*step).stopWith
    participants:
      - id: caller
        kind: actor
      - id: (*step).stopWith
        kind: self
      - id: st.enterStop
        kind: internal
    steps:
      - return:
          closure:
            steps:
              - eval: st.enterStop(r)
                to: st.enterStop
  - of: spawnResult
    steps:
      - opt:
          do:
            - return: coresvc.ResultExitCode
          when: errs.HasCode(err, coreproc.CodeSandboxFailed)
      - return: coresvc.ResultResources
  - of: (*step).onAttached
    participants:
      - id: caller
        kind: actor
      - id: (*step).onAttached
        kind: self
      - id: st.population
        kind: internal
      - id: st.pidFileRead
        kind: internal
      - id: st.mainGuessed
        kind: internal
      - id: st.mainPIDAttached
        kind: internal
