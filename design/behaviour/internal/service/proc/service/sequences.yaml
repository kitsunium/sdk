                  - continue: true
                when: p == nil || belongs(cg, pid)
            - loop:
                do:
                  - eval: gone(p.Signal(sig))
                    to: gone
                key: _
                range: ef.signals
                value: sig
          key: _
          range: ef.pids
          value: pid
      - loop:
          do:
            - eval: gone(cg.Signal(sig))
              to: gone
          key: _
          range: ef.signals
          value: sig
      - return: ev
  - of: (*actor).prune
    participants:
      - id: caller
        kind: actor
      - id: (*actor).prune
        kind: self
      - id: gone
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: a.group == nil
      - eval: gone(a.group.DeleteBeneath())
        to: gone
  - of: delegateIDs
    participants:
      - id: caller
        kind: actor
      - id: delegateIDs
        kind: self
      - id: lookupUser
        kind: internal
      - id: lookupGroup
        kind: internal
    steps:
      - set: uid, gid
        value: "-1, -1"
      - opt:
          do:
            - bind: u, lerr
              eval: lookupUser(spec.User)
              to: lookupUser
            - opt:
                do:
                  - return: 0, 0, errs.Wrap(coreproc.UnknownUser, errs.WrapParams{}, errs.String("user", spec.User))
                when: lerr != nil
            - set: uid, gid
              value: u.uid, u.gid
          when: spec.User != ""
      - opt:
          do:
            - bind: g, lerr
              eval: lookupGroup(spec.Group)
              to: lookupGroup
            - opt:
                do:
                  - return: 0, 0, errs.Wrap(coreproc.UnknownGroup, errs.WrapParams{}, errs.String("group", spec.Group))
                when: lerr != nil
            - set: gid
              value: g
          when: spec.Group != ""
      - return: uid, gid, nil
  - of: lookupUser
    participants:
      - id: caller
        kind: actor
      - id: lookupUser
        kind: self
      - id: strconv
        kind: stdlib
      - id: user
        kind: stdlib
      - id: accountOf
        kind: internal
    steps:
      - opt:
          do:
            - bind: u, lerr
              eval: user.LookupId(name)
              to: user
            - opt:
                do:
                  - return: "account{uid: n, gid: -1}, nil"
                when: lerr != nil
            - return: accountOf(u)
              to: accountOf
          init:
            bind: n, nerr
            eval: strconv.Atoi(name)
            to: strconv
          when: nerr == nil
      - bind: u, err
        eval: user.Lookup(name)
        to: user
      - opt:
          do:
            - return: account{}, err
          when: err != nil
      - return: accountOf(u)
        to: accountOf
  - of: accountOf
    participants:
      - id: caller
        kind: actor
      - id: accountOf
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: uid, err
        eval: strconv.Atoi(u.Uid)
        to: strconv
      - opt:
          do:
            - return: account{}, err
          when: err != nil
      - bind: gid, err
        eval: strconv.Atoi(u.Gid)
        to: strconv
      - opt:
          do:
            - return: account{}, err
          when: err != nil
      - return: "account{uid: uid, gid: gid}, nil"
  - of: lookupGroup
    participants:
      - id: caller
        kind: actor
      - id: lookupGroup
        kind: self
      - id: strconv
        kind: stdlib
      - id: user
        kind: stdlib
    steps:
      - opt:
          do:
            - return: n, nil
          init:
            bind: n, err
            eval: strconv.Atoi(name)
            to: strconv
          when: err == nil
      - bind: g, err
        eval: user.LookupGroup(name)
        to: user
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - return: strconv.Atoi(g.Gid)
        to: strconv
  - of: (*actor).prepareStart
    participants:
      - id: caller
        kind: actor
      - id: (*actor).prepareStart
        kind: self
      - id: a.prepare
        kind: internal
      - id: a.startBusWatch
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: a.prepare()
            to: a.prepare
          when: err != nil
      - return: a.startBusWatch()
        to: a.startBusWatch
  - of: (*actor).startBusWatch
    participants:
      - id: caller
        kind: actor
      - id: (*actor).startBusWatch
        kind: self
      - id: a.u.cfg.BusWatcher.WatchName
        kind: value
      - id: a.put
        kind: internal
      - id: a.u.readers.Add
        kind: value
      - id: a.u.forwardBus
        kind: internal
    steps:
      - bind: s
        eval: a.u.s
      - opt:
          do:
            - return: 0, nil
          when: s.typ != coresvc.TypeDbus || a.on(shellBusWatching)
      - bind: owners, err
        eval: a.u.cfg.BusWatcher.WatchName(a.u.ctx, s.busName)
        to: a.u.cfg.BusWatcher.WatchName
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: owner, open
        eval: <-owners
      - opt:
          do:
            - return: 0, nil
          when: "!open"
      - eval: a.put(shellBusWatching, true)
        to: a.put
      - eval: a.u.readers.Add(1)
        to: a.u.readers.Add
      - go: a.u.forwardBus(owners)
        to: a.u.forwardBus
      - bind: flags
        eval: flagLookup
      - opt:
          do:
            - op: "|="
              set: flags
              value: flagOwner
          when: owner != ""
      - return: flags, nil
  - of: (*Unit).forwardBus
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).forwardBus
        kind: self
      - id: u.readers.Done
        kind: value
      - id: u.post
        kind: internal
    steps:
      - defer: u.readers.Done()
        to: u.readers.Done
      - bind: posting
        eval: "true"
      - loop:
          do:
            - bind: ev
              eval: "event{kind: evBusName}"
            - opt:
                do:
                  - set: ev.flags
                    value: flagOwner
                when: owner != ""
            - set: posting
              value: posting && u.post(&ev)
          key: owner
          range: owners
      - opt:
          do:
            - eval: "u.post(&event{kind: evBusName, flags: flagUnwatched})"
              to: u.post
          when: posting
  - of: (*actor).keep
    participants:
      - id: caller
        kind: actor
      - id: (*actor).keep
        kind: self
      - id: f.Stat
        kind: value
      - id: a.watchHangup
        kind: internal
      - id: a.publishStore
        kind: internal
    steps:
      - loop:
          do:
            - bind: e
              eval: ef.entries[i]
            - bind: info, err
              eval: f.Stat()
              to: f.Stat
            - opt:
                do:
                  - set: info
                    value: nil
                when: err != nil
            - bind: h
              eval: "&held{file: f, view: describe(e.name, info)}"
            - opt:
                do:
                  - set: h.watched
                    to: a.watchHangup
                    value: a.watchHangup(f, e.id)
                when: e.poll
            - set: h.view.Poll
              value: h.watched
            - set: a.store[e.id]
              value: h
            - set: a.storeOrder
              value: append(a.storeOrder, e.id)
          key: i
          range: ef.files
          value: f
      - eval: a.publishStore()
        to: a.publishStore
  - of: (*actor).drop
    participants:
      - id: caller
        kind: actor
      - id: (*actor).drop
        kind: self
      - id: a.hangups.remove
        kind: internal
      - id: gone
        kind: internal
      - id: slices
        kind: stdlib
      - id: a.publishStore
        kind: internal
    steps:
      - loop:
          do:
            - bind: h
              eval: a.store[e.id]
            - opt:
                do:
                  - continue: true
                when: h == nil
            - opt:
                do:
                  - eval: a.hangups.remove(h.file)
                    to: a.hangups.remove
                when: h.watched
            - eval: gone(h.file.Close())
              to: gone
            - eval: delete(a.store, e.id)
          key: _
          range: entries
          value: e
      - set: a.storeOrder
        to: slices
        value: slices.DeleteFunc(a.storeOrder, func(id uint64) bool { return a.store[id] == nil })
      - eval: a.publishStore()
        to: a.publishStore
  - of: (*actor).publishStore
    participants:
      - id: caller
        kind: actor
      - id: (*actor).publishStore
        kind: self
      - id: a.u.mu.Lock
        kind: value
      - id: a.u.mu.Unlock
        kind: value
    steps:
      - bind: view
        eval: make([]coresvc.StoredFDValue, 0, len(a.storeOrder))
      - loop:
          do:
            - set: view
              value: append(view, a.store[id].view)
          key: _
          range: slices.Backward(a.storeOrder)
          value: id
      - eval: a.u.mu.Lock()
        to: a.u.mu.Lock
      - set: a.u.stored
        value: view
      - eval: a.u.mu.Unlock()
        to: a.u.mu.Unlock
  - of: (*actor).watchHangup
    participants:
      - id: caller
        kind: actor
      - id: (*actor).watchHangup
        kind: self
      - id: newHangupWatch
        kind: internal
      - id: w.start
        kind: internal
      - id: a.hangups.add
        kind: internal
    steps:
      - opt:
          do:
            - bind: w, err
              eval: newHangupWatch()
              to: newHangupWatch
            - opt:
                do:
                  - return: "false"
                when: err != nil
            - set: a.hangups
              value: w
            - bind: u
              eval: a.u
            - eval: "w.start(func(stored uint64) bool { return u.post(&event{kind: evHangup, stored: stored}) })"
              to: w.start
          when: a.hangups == nil
      - return: a.hangups.add(f, id)
        to: a.hangups.add
  - of: (*actor).closeStore
    participants:
      - id: caller
        kind: actor
      - id: (*actor).closeStore
        kind: self
      - id: a.hangups.stop
        kind: internal
      - id: gone
        kind: internal
      - id: a.publishStore
        kind: internal
    steps:
      - opt:
          do:
            - eval: a.hangups.stop()
              to: a.hangups.stop
          when: a.hangups != nil
      - loop:
          do:
            - eval: gone(h.file.Close())
              to: gone
          key: _
          range: a.store
          value: h
      - eval: clear(a.store)
      - set: a.storeOrder
        value: nil
      - eval: a.publishStore()
        to: a.publishStore
  - of: describe
    participants:
      - id: caller
        kind: actor
      - id: describe
        kind: self
      - id: info.Mode
        kind: value
      - id: fileID
        kind: internal
    steps:
      - bind: v
        eval: "coresvc.StoredFDValue{Name: name}"
      - opt:
          do:
            - return: v
          when: info == nil
      - set: v.Mode
        to: info.Mode
        value: info.Mode()
      - set: v.Device, v.Inode
        to: fileID
        value: fileID(info)
      - return: v
  - of: (*actor).handOver
    participants:
      - id: caller
        kind: actor
      - id: (*actor).handOver
        kind: self
      - id: activation
        kind: internal
      - id: slices
        kind: stdlib
      - id: listen
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: len(owed) == 0
      - bind: named
        eval: activation(spec)
        to: activation
      - set: spec.ExtraFiles
        to: slices
        value: slices.Clone(spec.ExtraFiles[len(named):])
      - return: listen.PrepareFiles(spec, append(named, owed...))
        to: listen
  - of: activation
    participants:
      - id: caller
        kind: actor
      - id: activation
        kind: self
      - id: envMap
        kind: internal
      - id: strconv
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: values
        eval: envMap(spec.Env)
        to: envMap
      - bind: n, err
        eval: strconv.Atoi(values["LISTEN_FDS"])
        to: strconv
      - opt:
          do:
            - return: nil
          when: err != nil || n <= 0 || n > len(spec.ExtraFiles)
      - bind: names
        eval: strings.Split(values["LISTEN_FDNAMES"], ":")
        to: strings
      - opt:
          do:
            - set: names
              value: make([]string, n)
          when: len(names) != n
      - bind: out
        eval: make([]listen.NamedFileValue, 0, n)
      - loop:
          do:
            - set: out
              value: "append(out, listen.NamedFileValue{Name: names[i], File: spec.ExtraFiles[i]})"
          key: i
          range: "n"
      - return: out
  - of: (*step).groupSignals
    steps:
      - switch:
          cases:
            - case: coresvc.KillModeControlGroup
              do:
                - return: "true"
            - case: coresvc.KillModeMixed
              do:
                - return: sub == coresvc.SubStopSigkill || sub == coresvc.SubFinalSigkill
            - default: true
              do:
                - return: "false"
          "on": st.m.s.killMode
  - of: (*step).signalGroup
    participants:
      - id: caller
        kind: actor
      - id: (*step).signalGroup
        kind: self
      - id: st.killSignal
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: sig, extra
        eval: st.killSignal(sub)
        to: st.killSignal
      - eval: st.setState(coresvc.StateDeactivating, sub)
        to: st.setState
      - eval: st.arm(timerState, st.signalTimeout(sub))
        to: st.arm
      - eval: |-
          st.emit(&effect{
          		kind: efSignalGroup, sub: sub,
          		signals: append([]coreproc.Signal{sig}, extra...),
          		pids:    []int{m.mainPID, m.controlPID},
          	})
        to: st.emit
  - of: (*step).onSignaled
    participants:
      - id: caller
        kind: actor
      - id: (*step).onSignaled
        kind: self
      - id: st.population
        kind: internal
      - id: st.signalNothing
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - eval: st.population()
        to: st.population
      - opt:
          do:
            - return: ""
          when: ev.sub != m.sub || m.mainPID != 0 || m.controlPID != 0 || !ev.has(flagEmpty)
      - eval: st.signalNothing(m.sub)
        to: st.signalNothing
  - of: (*step).onCgroup
    participants:
      - id: caller
        kind: actor
      - id: (*step).onCgroup
        kind: self
      - id: st.groupNews
        kind: internal
      - id: st.onCgroupEmpty
        kind: internal
    steps:
      - eval: st.groupNews()
        to: st.groupNews
      - opt:
          do:
            - eval: st.onCgroupEmpty()
              to: st.onCgroupEmpty
          when: st.ev.has(flagEmpty)
  - of: (*step).groupNews
    participants:
      - id: caller
        kind: actor
      - id: (*step).groupNews
        kind: self
      - id: st.onOOM
        kind: internal
      - id: st.population
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.onOOM()
              to: st.onOOM
          when: st.ev.has(flagOOM)
      - eval: st.population()
        to: st.population
  - of: (*step).population
    participants:
      - id: caller
        kind: actor
      - id: (*step).population
        kind: self
      - id: st.m.set
        kind: internal
    steps:
      - bind: ev
        eval: st.ev
      - opt:
          do:
            - eval: st.m.set(flagGroupPopulated, ev.has(flagPopulated))
              to: st.m.set
          when: ev.has(flagPopulated) || ev.has(flagEmpty)
  - of: (*step).onOOM
    participants:
      - id: caller
        kind: actor
      - id: (*step).onOOM
        kind: self
      - id: st.stopOrKill
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.fold
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: policy
        eval: m.s.oomPolicy
      - opt:
          do:
            - return: ""
          when: policy == coresvc.OOMPolicyContinue
      - bind: kill
        eval: policy == coresvc.OOMPolicyKill
      - switch:
          cases:
            - case: coresvc.SubCondition, coresvc.SubStartPre, coresvc.SubStart, coresvc.SubStartPost, coresvc.SubStop
              do:
                - eval: st.stopOrKill(kill, func() { st.enterSignal(coresvc.SubStopSigterm, coresvc.ResultOOMKill) })
                  to: st.stopOrKill
            - case: coresvc.SubRunning, coresvc.SubRunningRevalidating, coresvc.SubExited
              do:
                - eval: st.stopOrKill(kill, func() { st.enterStop(coresvc.ResultOOMKill) })
                  to: st.stopOrKill
            - case: coresvc.SubStopWatchdog, coresvc.SubStopSigterm
              do:
                - eval: st.enterSignal(coresvc.SubStopSigkill, coresvc.ResultOOMKill)
                  to: st.enterSignal
            - case: coresvc.SubStopSigkill, coresvc.SubFinalSigkill
              do:
                - eval: st.fold(coresvc.ResultOOMKill)
                  to: st.fold
            - case: coresvc.SubStopPost, coresvc.SubFinalSigterm
              do:
                - eval: st.enterSignal(coresvc.SubFinalSigkill, coresvc.ResultOOMKill)
                  to: st.enterSignal
            - default: true
          "on": m.sub
  - of: (*step).stopOrKill
    participants:
      - id: caller
        kind: actor
      - id: (*step).stopOrKill
        kind: self
      - id: st.enterSignal
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterSignal(coresvc.SubFinalSigkill, coresvc.ResultOOMKill)
              to: st.enterSignal
            - return: ""
          when: kill
      - eval: stop()
  - of: (*step).onCgroupEmpty
    participants:
      - id: caller
        kind: actor
      - id: (*step).onCgroupEmpty
        kind: self
      - id: st.emptiedStarting
        kind: internal
      - id: st.pidFileAbandoned
        kind: internal
      - id: m.set
        kind: internal
      - id: st.enterRunning
        kind: internal
      - id: st.whenIdle
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: idle
        eval: m.mainPID == 0 && m.controlPID == 0
      - switch:
          cases:
            - case: coresvc.SubStart
              do:
                - eval: st.emptiedStarting(idle)
                  to: st.emptiedStarting
            - case: coresvc.SubStartPost
              do:
                - eval: st.pidFileAbandoned()
                  to: st.pidFileAbandoned
            - case: coresvc.SubRunning, coresvc.SubRunningRevalidating
              do:
                - opt:
                    do:
                      - eval: m.set(flagCgroupGood, false)
                        to: m.set
                      - eval: st.enterRunning(coresvc.ResultSuccess)
                        to: st.enterRunning
                    when: m.mainPID == 0
            - case: coresvc.SubStopWatchdog, coresvc.SubStopSigterm, coresvc.SubStopSigkill
              do:
                - eval: st.whenIdle(idle, func() { st.enterStopPost(coresvc.ResultSuccess) })
                  to: st.whenIdle
            - case: coresvc.SubStopPost, coresvc.SubFinalWatchdog, coresvc.SubFinalSigterm, coresvc.SubFinalSigkill
              do:
                - eval: st.whenIdle(idle, func() { st.enterDead(coresvc.ResultSuccess, true) })
                  to: st.whenIdle
            - default: true
          "on": m.sub
  - of: (*step).emptiedStarting
    participants:
      - id: caller
        kind: actor
      - id: (*step).emptiedStarting
        kind: self
      - id: st.enterStopPost
        kind: internal
      - id: st.pidFileAbandoned
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - switch:
          cases:
            - case: isNotifyType(m.s.typ) && idle
              do:
                - eval: st.enterStopPost(coresvc.ResultProtocol)
                  to: st.enterStopPost
            - case: m.s.exitType == coresvc.ExitTypeCgroup && m.mainPID == 0
              do:
                - eval: st.enterStopPost(coresvc.ResultSuccess)
                  to: st.enterStopPost
            - default: true
              do:
                - eval: st.pidFileAbandoned()
                  to: st.pidFileAbandoned
  - of: (*step).pidFileAbandoned
    participants:
      - id: caller
        kind: actor
      - id: (*step).pidFileAbandoned
        kind: self
      - id: st.mainNeverFound
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.mainNeverFound()
              to: st.mainNeverFound
          when: st.m.s.pidFile != "" && st.waitingForMain()
  - of: (*step).whenIdle
    steps:
      - opt:
          do:
            - eval: next()
          when: idle
  - of: resolveCgroup
    participants:
      - id: caller
        kind: actor
      - id: resolveCgroup
        kind: self
      - id: s.put
        kind: internal
      - id: withoutUnit
        kind: internal
      - id: resolveCgroupPath
        kind: internal
    steps:
      - bind: unit, isUnit
        eval: cfg.Cgroup.(coresvc.CgroupUnit)
      - eval: s.put(setGroupUnit, isUnit)
        to: s.put
      - eval: s.put(setDelegate, cfg.Delegate)
        to: s.put
      - set: s.exitType
        value: cfg.ExitType
      - set: s.killMode
        value: cfg.KillMode
      - opt:
          do:
            - set: s.killMode
              value: coresvc.KillModeProcess
            - opt:
                do:
                  - set: s.killMode
                    value: coresvc.KillModeControlGroup
                when: isUnit
          when: s.killMode == coresvc.KillModeDefault
      - set: s.oomPolicy
        value: cfg.OOMPolicy
      - opt:
          do:
            - set: s.oomPolicy
              value: coresvc.OOMPolicyStop
            - opt:
                do:
                  - set: s.oomPolicy
                    value: coresvc.OOMPolicyContinue
                when: cfg.Delegate
          when: s.oomPolicy == coresvc.OOMPolicyDefault
      - opt:
          do:
            - return: withoutUnit(cfg)
              to: withoutUnit
          when: "!isUnit"
      - return: resolveCgroupPath(cfg, s, unit.Path())
        to: resolveCgroupPath
  - of: withoutUnit
    participants:
      - id: caller
        kind: actor
      - id: withoutUnit
        kind: self
      - id: unsupported
        kind: internal
    steps:
      - bind: needs
        eval: |-
          []struct {
          		on        bool
          		directive string
          		value     string
          	}{
          		{cfg.KillMode == coresvc.KillModeControlGroup, "KillMode", "control-group"},
          		{cfg.KillMode == coresvc.KillModeMixed, "KillMode", "mixed"},
          		{cfg.ExitType == coresvc.ExitTypeCgroup, "ExitType", "cgroup"},
          		{cfg.Delegate, "Delegate", "yes"},
          		{cfg.OOMPolicy != coresvc.OOMPolicyDefault, "OOMPolicy", cfg.OOMPolicy.String()},
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: unsupported(n.directive, n.value, needsUnit)
                    to: unsupported
                when: n.on
          key: _
          range: needs
          value: "n"
      - return: nil
  - of: resolveCgroupPath
    participants:
      - id: caller
        kind: actor
      - id: resolveCgroupPath
        kind: self
      - id: invalid
        kind: internal
    steps:
      - bind: named
        eval: cfg.Spec.CgroupPath
      - opt:
          do:
            - set: s.cgroupPath
              value: dir
            - return: nil
          when: named == ""
      - opt:
          do:
            - return: nil
          when: dir == "" || withinGroup(dir, named)
      - return: invalid("CgroupPath", named)
        to: invalid
  - of: withinGroup
    steps:
      - set: dir, named
        value: path.Clean(dir), path.Clean(named)
      - return: named == dir || strings.HasPrefix(named, strings.TrimSuffix(dir, "/")+"/")
  - of: (*step).onBusName
    participants:
      - id: caller
        kind: actor
      - id: (*step).onBusName
        kind: self
      - id: ev.has
        kind: internal
      - id: m.set
        kind: internal
      - id: st.exitedOrStop
        kind: internal
      - id: st.enterRunning
        kind: internal
      - id: st.enterStartPost
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - opt:
          do:
            - return: ""
          when: ev.has(flagUnwatched)
      - bind: owned
        eval: ev.has(flagOwner)
        to: ev.has
      - eval: m.set(flagBusOwned, owned)
        to: m.set
      - opt:
          do:
            - return: ""
          when: m.s.typ != coresvc.TypeDbus
      - switch:
          cases:
            - case: coresvc.SubRunning, coresvc.SubRunningRevalidating
              do:
                - opt:
                    do:
                      - eval: st.exitedOrStop()
                        to: st.exitedOrStop
                      - return: ""
                    when: "!owned && !ev.has(flagLookup)"
                - eval: st.enterRunning(coresvc.ResultSuccess)
                  to: st.enterRunning
            - case: coresvc.SubStart
              do:
                - opt:
                    do:
                      - eval: st.enterStartPost()
                        to: st.enterStartPost
                    when: owned
            - default: true
          "on": m.sub
  - of: (*step).goodExceptBus
    steps:
      - bind: m
        eval: st.m
      - return: m.mainPID != 0 || m.has(flagCgroupGood)
  - of: (*step).good
    steps:
      - bind: m
        eval: st.m
      - return: (m.s.typ != coresvc.TypeDbus || m.has(flagBusOwned)) && st.goodExceptBus()
  - of: (*step).awaitsBusName
    steps:
      - bind: m
        eval: st.m
      - return: m.s.typ == coresvc.TypeDbus && !m.has(flagBusOwned) && st.goodExceptBus()
  - of: (*step).enterRevalidating
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterRevalidating
        kind: self
      - id: st.runtimeDeadline
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.setState
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: m.sub == coresvc.SubRunningRevalidating
      - opt:
          do:
            - set: m.revalidateBegin
              value: st.ev.at
          when: m.sub == coresvc.SubRunning
      - eval: st.runtimeDeadline()
        to: st.runtimeDeadline
      - eval: st.arm(timerState, busNameGrace)
        to: st.arm
      - eval: st.setState(coresvc.StateActive, coresvc.SubRunningRevalidating)
        to: st.setState
  - of: (*step).resumeRuntime
    participants:
      - id: caller
        kind: actor
      - id: (*step).resumeRuntime
        kind: self
      - id: m.runtimeAt.Add
        kind: value
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: m.revalidateBegin.IsZero()
      - opt:
          do:
            - set: m.runtimeAt
              to: m.runtimeAt.Add
              value: m.runtimeAt.Add(st.ev.at.Sub(m.revalidateBegin))
          when: "!m.runtimeAt.IsZero()"
      - set: m.revalidateBegin
        value: time.Time{}
  - of: defaultType
    steps:
      - switch:
          cases:
            - case: cfg.BusName != ""
              do:
                - return: coresvc.TypeDbus
            - case: len(cfg.ExecStart) > 0
              do:
                - return: coresvc.TypeSimple
            - default: true
              do:
                - return: coresvc.TypeOneshot
  - of: resolveBus
    participants:
      - id: caller
        kind: actor
      - id: resolveBus
        kind: self
      - id: invalid
        kind: internal
      - id: unsupported
        kind: internal
    steps:
      - opt:
          do:
            - return: invalid("BusName", cfg.BusName)
              to: invalid
          when: cfg.BusName != "" && !busNameValid(cfg.BusName)
      - opt:
          do:
            - return: nil
          when: s.typ != coresvc.TypeDbus
      - opt:
          do:
            - return: unsupported("Type", "dbus", runtime.GOOS)
              to: unsupported
          when: runtime.GOOS != osLinux
      - opt:
          do:
            - return: invalid("BusName", "none for Type=dbus")
              to: invalid
          when: cfg.BusName == ""
      - opt:
          do:
            - return: invalid("BusWatcher", "none for Type=dbus")
              to: invalid
          when: cfg.BusWatcher == nil
      - set: s.busName
        value: cfg.BusName
      - return: nil
  - of: busNameValid
    participants:
      - id: caller
        kind: actor
      - id: busNameValid
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: len(name) > maxBusName || name == ""
      - bind: elements
        eval: strings.Split(name, ".")
        to: strings
      - return: len(elements) >= minBusElements && !slices.ContainsFunc(elements, badBusElement)
  - of: badBusElement
    steps:
      - opt:
          do:
            - return: "true"
          when: e == "" || (e[0] >= '0' && e[0] <= '9')
      - return: strings.IndexFunc(e, func(r rune) bool { return r >= utf8.RuneSelf || !busNameByte(byte(r)) }) >= 0
  - of: busNameByte
    steps:
      - return: (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '_' || c == '-'
  - of: (*step).setState
    participants:
      - id: caller
        kind: actor
      - id: (*step).setState
        kind: self
      - id: st.disarm
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - set: m.changed
              value: st.ev.at
          when: m.state != state
      - opt:
          do:
            - eval: st.disarm(timerPIDFile)
              to: st.disarm
          when: m.sub != sub
      - set: m.state, m.sub
        value: state, sub
      - opt:
          do:
            - eval: st.disarm(timerWatchdog)
              to: st.disarm
          when: "!watchdogRuns(sub)"
  - of: (*step).fold
    steps:
      - opt:
          do:
            - set: st.m.result
              value: f
          when: st.m.result == coresvc.ResultSuccess
  - of: (*step).arm
    participants:
      - id: caller
        kind: actor
      - id: (*step).arm
        kind: self
      - id: st.disarm
        kind: internal
      - id: st.armAt
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.disarm(k)
              to: st.disarm
            - return: ""
          when: d == coresvc.Infinity
      - eval: st.armAt(k, st.ev.at.Add(d))
        to: st.armAt
  - of: (*step).armAt
    participants:
      - id: caller
        kind: actor
      - id: (*step).armAt
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - op: ++
        set: m.seq[k]
      - set: m.deadlines[k]
        value: at
      - eval: "st.emit(&effect{kind: efArm, timer: k, at: at, seq: m.seq[k]})"
        to: st.emit
  - of: (*step).disarm
    participants:
      - id: caller
        kind: actor
      - id: (*step).disarm
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: m.deadlines[k].IsZero()
      - op: ++
        set: m.seq[k]
      - set: m.deadlines[k]
        value: time.Time{}
      - eval: "st.emit(&effect{kind: efDisarm, timer: k, seq: m.seq[k]})"
        to: st.emit
  - of: (*step).spawn
    participants:
      - id: caller
        kind: actor
      - id: (*step).spawn
        kind: self
      - id: m.set
        kind: internal
      - id: st.handOver
        kind: internal
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - set: m.list, m.cmd
        value: l, index
      - bind: cmd
        eval: m.s.lists[l][index]
      - opt:
          do:
            - set: m.mainFlags
              value: cmd.Flags
          when: main
      - bind: asMain
        eval: main || (l == listStart && m.s.typ == coresvc.TypeForking)
      - bind: ef
        eval: "effect{kind: efSpawn, list: l, cmd: cmd, main: main, vars: st.vars(l, asMain), opts: optIf(optPrepare, m.has(flagPrepare))}"
      - eval: m.set(flagPrepare, false)
        to: m.set
      - opt:
          do:
            - set: ef.entries
              to: st.handOver
              value: st.handOver()
          when: l == listStart
      - eval: st.emit(&ef)
        to: st.emit
  - of: (*step).vars
    steps:
      - bind: m
        eval: st.m
      - bind: v
        eval: "[]string{\"MANAGERPID=\" + strconv.Itoa(m.s.selfPID)}"
      - set: v
        value: append(v, st.notifyVars(main)...)
      - opt:
          do:
            - set: v
              value: append(v, "FDSTORE="+strconv.Itoa(m.s.storeMax))
          when: m.s.storeMax > 0
      - opt:
          do:
            - set: v
              value: append(v, "MAINPID="+strconv.Itoa(m.mainPID))
          when: "!main && m.mainPID != 0"
      - opt:
          do:
            - set: v
              value: append(v, st.outcomeVars()...)
          when: l == listStop || l == listStopPost
      - opt:
          do:
            - set: v
              value: append(v, "DEBUG_INVOCATION=1")
          when: m.has(flagDebug)
      - return: v
  - of: (*step).notifyVars
    participants:
      - id: caller
        kind: actor
      - id: (*step).notifyVars
        kind: self
      - id: st.watchdogPeriod
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - var:
          name: v
          type: "[]string"
      - bind: heard
        eval: |-
          m.notifyAccess == coresvc.NotifyAccessExec || m.notifyAccess == coresvc.NotifyAccessAll ||
          		(main && m.notifyAccess == coresvc.NotifyAccessMain)
      - opt:
          do:
            - set: v
              value: append(v, "NOTIFY_SOCKET="+m.s.socket)
          when: m.s.socket != "" && heard
      - opt:
          do:
            - set: v
              value: append(v, "WATCHDOG_USEC="+strconv.FormatInt(period.Microseconds(), 10))
          init:
            bind: period
            eval: st.watchdogPeriod()
            to: st.watchdogPeriod
          when: main && period > 0
      - return: v
  - of: (*step).outcomeVars
    participants:
      - id: caller
        kind: actor
      - id: (*step).outcomeVars
        kind: self
      - id: exitVars
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: v
        eval: "[]string{\"SERVICE_RESULT=\" + m.result.String()}"
      - opt:
          do:
            - bind: code, status
              eval: exitVars(m)
              to: exitVars
            - set: v
              value: append(v, "EXIT_CODE="+code, "EXIT_STATUS="+status)
          when: m.has(flagMainExited)
      - return: v
  - of: exitVars
    steps:
      - opt:
          do:
            - return: "\"killed\", strings.TrimPrefix(m.mainExit.Signal.String(), \"SIG\")"
          when: m.mainExit.Signaled
      - return: "\"exited\", strconv.Itoa(m.mainExit.Code)"
  - of: (*step).signal
    participants:
      - id: caller
        kind: actor
      - id: (*step).signal
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: pid == 0 || sig == 0
      - eval: "st.emit(&effect{kind: efSignal, pid: pid, sig: sig})"
        to: st.emit
  - of: (*step).forgetAll
    participants:
      - id: caller
        kind: actor
      - id: (*step).forgetAll
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - loop:
          do:
            - opt:
                do:
                  - eval: "st.emit(&effect{kind: efForget, pid: pid})"
                    to: st.emit
                when: pid != 0
          key: _
          range: "[]int{m.mainPID, m.controlPID}"
          value: pid
      - set: m.mainPID, m.controlPID
        value: 0, 0
  - of: (*step).beginStart
    participants:
      - id: caller
        kind: actor
      - id: (*step).beginStart
        kind: self
      - id: st.disarm
        kind: internal
      - id: m.set
        kind: internal
      - id: st.enterDead
        kind: internal
      - id: st.enterCondition
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - eval: st.disarm(timerState)
        to: st.disarm
      - eval: m.set(flagRan, true)
        to: m.set
      - opt:
          do:
            - set: m.result
              value: coresvc.ResultStartLimitHit
            - eval: st.enterDead(coresvc.ResultStartLimitHit, false)
              to: st.enterDead
            - return: ""
          when: "!st.limitBelow()"
      - set: m.result, m.reloadResult
        value: coresvc.ResultSuccess, coresvc.ResultSuccess
      - eval: m.set(flagMainExited, false)
        to: m.set
      - set: m.mainExit, m.notify
        value: coreproc.ExitValue{}, notifyUnknown
      - set: m.status, m.busError, m.varlinkError, m.exitStatusText, m.errno
        value: "\"\", \"\", \"\", \"\", 0"
      - set: m.notifyAccess, m.watchdogPeriod, m.pidFileCause
        value: m.s.notifyAccess, 0, ""
      - set: m.sandboxCause, m.sandboxFields
        value: 0, nil
      - eval: m.set(flagForbidRestart, false)
        to: m.set
      - eval: m.set(flagCgroupGood, false)
        to: m.set
      - eval: m.set(flagPrepare, m.s.on(setGroupUnit) || m.s.typ == coresvc.TypeDbus)
        to: m.set
      - set: m.runtimeAt, m.revalidateBegin
        value: time.Time{}, time.Time{}
      - opt:
          do:
            - set: m.restarts
              value: "0"
          when: manual
      - eval: m.set(flagDebug, !manual && m.s.restartMode == coresvc.RestartModeDebug)
        to: m.set
      - eval: st.enterCondition()
        to: st.enterCondition
  - of: (*step).limitBelow
    steps:
      - bind: m
        eval: st.m
      - bind: s
        eval: m.s
      - opt:
          do:
            - return: "true"
          when: s.on(setLimitOff)
      - bind: now
        eval: st.ev.at
      - opt:
          do:
            - set: m.limitBegin, m.limitCount
              value: now, 1
            - return: "true"
          when: m.limitBegin.IsZero() || (s.limitInterval != coresvc.Infinity && now.Sub(m.limitBegin) > s.limitInterval)
      - opt:
          do:
            - op: ++
              set: m.limitCount
          when: m.limitCount <= s.limitBurst
      - return: m.limitCount <= s.limitBurst
  - of: (*step).enterCondition
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterCondition
        kind: self
      - id: st.enterStartPre
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterStartPre()
              to: st.enterStartPre
            - return: ""
          when: len(st.m.s.lists[listCondition]) == 0
      - eval: st.setState(coresvc.StateActivating, coresvc.SubCondition)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStart)
        to: st.arm
      - eval: st.spawn(listCondition, 0, false)
        to: st.spawn
  - of: (*step).enterStartPre
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStartPre
        kind: self
      - id: st.enterStart
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterStart()
              to: st.enterStart
            - return: ""
          when: len(st.m.s.lists[listStartPre]) == 0
      - eval: st.setState(coresvc.StateActivating, coresvc.SubStartPre)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStart)
        to: st.arm
      - eval: st.spawn(listStartPre, 0, false)
        to: st.spawn
  - of: (*step).enterStart
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStart
        kind: self
      - id: st.enterStartPost
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterStartPost()
              to: st.enterStartPost
            - return: ""
          when: len(st.m.s.lists[listStart]) == 0
      - eval: st.setState(coresvc.StateActivating, coresvc.SubStart)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStart)
        to: st.arm
      - eval: st.spawn(listStart, 0, st.m.s.typ != coresvc.TypeForking)
        to: st.spawn
  - of: (*step).enterStartPost
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStartPost
        kind: self
      - id: st.setState
        kind: internal
      - id: st.resetWatchdog
        kind: internal
      - id: st.enterRunning
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - eval: st.setState(coresvc.StateActivating, coresvc.SubStartPost)
        to: st.setState
      - eval: st.resetWatchdog()
        to: st.resetWatchdog
      - opt:
          do:
            - eval: st.enterRunning(coresvc.ResultSuccess)
              to: st.enterRunning
            - return: ""
          when: len(st.m.s.lists[listStartPost]) == 0
      - eval: st.arm(timerState, st.m.s.timeoutStart)
        to: st.arm
      - eval: st.spawn(listStartPost, 0, false)
        to: st.spawn
  - of: (*step).enterRunning
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterRunning
        kind: self
      - id: st.fold
        kind: internal
      - id: st.dropControl
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.enterUp
        kind: internal
      - id: st.enterRevalidating
        kind: internal
      - id: st.exitedOrStop
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - eval: st.fold(f)
        to: st.fold
      - eval: st.dropControl()
        to: st.dropControl
      - switch:
          cases:
            - case: m.result != coresvc.ResultSuccess
              do:
                - eval: st.enterSignal(coresvc.SubStopSigterm, f)
                  to: st.enterSignal
            - case: st.good()
              do:
                - eval: st.enterUp()
                  to: st.enterUp
            - case: st.awaitsBusName()
              do:
                - eval: st.enterRevalidating()
                  to: st.enterRevalidating
            - default: true
              do:
                - eval: st.exitedOrStop()
                  to: st.exitedOrStop
  - of: (*step).exitedOrStop
    participants:
      - id: caller
        kind: actor
      - id: (*step).exitedOrStop
        kind: self
      - id: st.disarm
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.enterStop
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - set: m.revalidateBegin
        value: time.Time{}
      - opt:
          do:
            - eval: st.disarm(timerState)
              to: st.disarm
            - eval: st.setState(coresvc.StateExited, coresvc.SubExited)
              to: st.setState
            - return: ""
          when: m.s.on(setRemainAfterExit)
      - eval: st.enterStop(coresvc.ResultSuccess)
        to: st.enterStop
  - of: (*step).enterUp
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterUp
        kind: self
      - id: st.enterReloadByNotify
        kind: internal
      - id: st.enterStopByNotify
        kind: internal
      - id: st.resumeRuntime
        kind: internal
      - id: st.runtimeDeadline
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.disarm
        kind: internal
      - id: st.armAt
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - switch:
          cases:
            - case: notifyReloading
              do:
                - eval: st.enterReloadByNotify()
                  to: st.enterReloadByNotify
            - case: notifyStopping
              do:
                - eval: st.enterStopByNotify()
                  to: st.enterStopByNotify
            - default: true
              do:
                - eval: st.resumeRuntime()
                  to: st.resumeRuntime
                - eval: st.runtimeDeadline()
                  to: st.runtimeDeadline
                - eval: st.setState(coresvc.StateActive, coresvc.SubRunning)
                  to: st.setState
                - opt:
                    do:
                      - eval: st.disarm(timerState)
                        to: st.disarm
                      - return: ""
                    when: m.runtimeAt.IsZero()
                - eval: st.armAt(timerState, m.runtimeAt)
                  to: st.armAt
          "on": m.notify
  - of: (*step).runtimeDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*step).runtimeDeadline
        kind: self
      - id: st.ev.at.Add
        kind: value
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - set: m.runtimeAt
              to: st.ev.at.Add
              value: st.ev.at.Add(addSaturating(m.s.runtimeMax, jitter(st.ev.rand, m.s.runtimeJitter)))
          when: m.runtimeAt.IsZero() && m.s.runtimeMax != coresvc.Infinity
  - of: (*step).dropControl
    participants:
      - id: caller
        kind: actor
      - id: (*step).dropControl
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efForget, pid: m.controlPID})"
              to: st.emit
            - set: m.controlPID
              value: "0"
          when: m.controlPID != 0
      - set: m.list
        value: listNone
  - of: (*step).enterStop
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStop
        kind: self
      - id: st.fold
        kind: internal
      - id: st.dropControl
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - eval: st.fold(f)
        to: st.fold
      - eval: st.dropControl()
        to: st.dropControl
      - opt:
          do:
            - eval: st.enterSignal(coresvc.SubStopSigterm, coresvc.ResultSuccess)
              to: st.enterSignal
            - return: ""
          when: len(st.m.s.lists[listStop]) == 0
      - eval: st.setState(coresvc.StateDeactivating, coresvc.SubStop)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStop)
        to: st.arm
      - eval: st.spawn(listStop, 0, false)
        to: st.spawn
  - of: (*step).enterStopByNotify
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStopByNotify
        kind: self
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
    steps:
      - eval: st.setState(coresvc.StateDeactivating, coresvc.SubStopSigterm)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStop)
        to: st.arm
  - of: (*step).enterSignal
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterSignal
        kind: self
      - id: st.fold
        kind: internal
      - id: st.signalGroup
        kind: internal
      - id: st.killSignal
        kind: internal
      - id: st.signal
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.signalNothing
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: s
        eval: m.s
      - eval: st.fold(f)
        to: st.fold
      - opt:
          do:
            - eval: st.signalGroup(sub)
              to: st.signalGroup
            - return: ""
          when: st.groupSignals(sub)
      - bind: sig, extra
        eval: st.killSignal(sub)
        to: st.killSignal
      - bind: alive
        eval: (m.mainPID != 0 || m.controlPID != 0) && s.killMode != coresvc.KillModeNone
      - opt:
          do:
            - loop:
                do:
                  - eval: st.signal(pid, sig)
                    to: st.signal
                  - loop:
                      do:
                        - eval: st.signal(pid, x)
                          to: st.signal
                      key: _
                      range: extra
                      value: x
                key: _
                range: "[]int{m.mainPID, m.controlPID}"
                value: pid
            - eval: st.setState(coresvc.StateDeactivating, sub)
              to: st.setState
            - eval: st.arm(timerState, st.signalTimeout(sub))
              to: st.arm
            - return: ""
          when: alive
      - eval: st.signalNothing(sub)
        to: st.signalNothing
  - of: (*step).signalTimeout
    steps:
      - bind: s
        eval: st.m.s
      - opt:
          do:
            - return: s.timeoutAbort
          when: sub == coresvc.SubStopWatchdog || sub == coresvc.SubFinalWatchdog
      - return: s.timeoutStop
  - of: (*step).signalNothing
    participants:
      - id: caller
        kind: actor
      - id: (*step).signalNothing
        kind: self
      - id: st.enterSignal
        kind: internal
      - id: st.enterStopPost
        kind: internal
      - id: st.enterDead
        kind: internal
    steps:
      - bind: s
        eval: st.m.s
      - switch:
          cases:
            - case: coresvc.SubStopWatchdog, coresvc.SubStopSigterm
              do:
                - opt:
                    do:
                      - eval: st.enterSignal(coresvc.SubStopSigkill, coresvc.ResultSuccess)
                        to: st.enterSignal
                      - return: ""
                    when: s.on(setSendSIGKILL)
                - eval: st.enterStopPost(coresvc.ResultSuccess)
                  to: st.enterStopPost
            - case: coresvc.SubStopSigkill
              do:
                - eval: st.enterStopPost(coresvc.ResultSuccess)
                  to: st.enterStopPost
            - case: coresvc.SubFinalWatchdog, coresvc.SubFinalSigterm
              do:
                - opt:
                    do:
                      - eval: st.enterSignal(coresvc.SubFinalSigkill, coresvc.ResultSuccess)
                        to: st.enterSignal
                      - return: ""
                    when: s.on(setSendSIGKILL)
                - eval: st.enterDead(coresvc.ResultSuccess, true)
                  to: st.enterDead
            - default: true
              do:
                - eval: st.enterDead(coresvc.ResultSuccess, true)
                  to: st.enterDead
          "on": sub
  - of: (*step).killSignal
    steps:
      - bind: s
        eval: st.m.s
      - switch:
          cases:
            - case: coresvc.SubStopWatchdog, coresvc.SubFinalWatchdog
              do:
                - return: s.watchdogSig, nil
            - case: coresvc.SubStopSigterm, coresvc.SubFinalSigterm
              do:
                - bind: sig
                  eval: s.killSignal
                - opt:
                    do:
                      - set: sig
                        value: s.restartKillSignal
                    when: st.m.has(flagRestarting)
                - bind: extra
                  eval: "[]coreproc.Signal{s.sigcont}"
                - opt:
                    do:
                      - set: extra
                        value: append(extra, s.sighup)
                    when: s.on(setSendSIGHUP)
                - return: sig, extra
            - default: true
              do:
                - return: s.finalKillSignal, nil
          "on": sub
  - of: (*step).enterStopPost
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterStopPost
        kind: self
      - id: st.fold
        kind: internal
      - id: st.dropControl
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - eval: st.fold(f)
        to: st.fold
      - eval: st.dropControl()
        to: st.dropControl
      - opt:
          do:
            - eval: st.enterSignal(coresvc.SubFinalSigterm, coresvc.ResultSuccess)
              to: st.enterSignal
            - return: ""
          when: len(st.m.s.lists[listStopPost]) == 0
      - eval: st.setState(coresvc.StateDeactivating, coresvc.SubStopPost)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStop)
        to: st.arm
      - eval: st.spawn(listStopPost, 0, false)
        to: st.spawn
  - of: (*step).enterDead
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterDead
        kind: self
      - id: st.fold
        kind: internal
      - id: st.disarm
        kind: internal
      - id: st.forgetAll
        kind: internal
      - id: st.releaseStore
        kind: internal
      - id: st.emit
        kind: internal
      - id: endState
        kind: internal
      - id: m.set
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.publish
        kind: internal
      - id: st.arm
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: s
        eval: m.s
      - eval: st.fold(f)
        to: st.fold
      - eval: st.disarm(timerState)
        to: st.disarm
      - eval: st.disarm(timerWatchdog)
        to: st.disarm
      - eval: st.disarm(timerPIDFile)
        to: st.disarm
      - eval: st.forgetAll()
        to: st.forgetAll
      - opt:
          do:
            - eval: st.releaseStore()
              to: st.releaseStore
          when: s.preserve == coresvc.PreserveNo
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efPrune})"
              to: st.emit
          when: s.on(setDelegate)
      - set: m.list
        value: listNone
      - bind: state, sub
        eval: endState(m.result)
        to: endState
      - bind: restart
        eval: allowRestart && !m.has(flagForbidRestart) && shallRestart(s, m.result, m.mainExit, m.has(flagMainExited))
      - eval: m.set(flagForbidRestart, false)
        to: m.set
      - opt:
          do:
            - eval: st.setState(state, sub)
              to: st.setState
            - return: ""
          when: "!restart"
      - opt:
          do:
            - eval: st.setState(state, sub)
              to: st.setState
            - eval: st.publish()
              to: st.publish
          when: s.restartMode != coresvc.RestartModeDirect
      - bind: next
        eval: m.restarts
      - opt:
          do:
            - op: ++
              set: next
          when: next < ^uint32(0)
      - eval: st.setState(coresvc.StateAutoRestart, coresvc.SubAutoRestart)
        to: st.setState
      - eval: st.arm(timerState, addSaturating(restartDelay(s, next), jitter(st.ev.rand, s.restartJitter)))
        to: st.arm
  - of: endState
    steps:
      - opt:
          do:
            - return: coresvc.StateInactive, coresvc.SubDead
          when: result == coresvc.ResultSuccess
      - opt:
          do:
            - return: coresvc.StateConditionSkipped, coresvc.SubDead
          when: result == coresvc.ResultExecCondition
      - return: coresvc.StateFailed, coresvc.SubFailed
  - of: (*step).enterRestart
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterRestart
        kind: self
      - id: st.beginStart
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - op: ++
              set: m.restarts
          when: m.restarts < ^uint32(0)
      - eval: st.beginStart(false)
        to: st.beginStart
  - of: (*step).enterReload
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterReload
        kind: self
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
      - id: st.reloadSignal
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - set: m.reloadResult, m.reloadBegin
        value: coresvc.ResultSuccess, st.ev.monotonic
      - eval: st.setState(coresvc.StateReloading, coresvc.SubReload)
        to: st.setState
      - eval: st.arm(timerState, m.s.timeoutStart)
        to: st.arm
      - opt:
          do:
            - eval: st.reloadSignal()
              to: st.reloadSignal
            - return: ""
          when: len(m.s.lists[listReload]) == 0
      - eval: st.spawn(listReload, 0, false)
        to: st.spawn
  - of: (*step).enterReloadByNotify
    participants:
      - id: caller
        kind: actor
      - id: (*step).enterReloadByNotify
        kind: self
      - id: st.setState
        kind: internal
      - id: st.arm
        kind: internal
    steps:
      - set: st.m.reloadResult
        value: coresvc.ResultSuccess
      - eval: st.setState(coresvc.StateReloading, coresvc.SubReloadNotify)
        to: st.setState
      - eval: st.arm(timerState, st.m.s.timeoutStart)
        to: st.arm
  - of: (*step).reloadCommandsDone
    participants:
      - id: caller
        kind: actor
      - id: (*step).reloadCommandsDone
        kind: self
      - id: st.enterRunning
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.reloadSignal
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - set: m.reloadResult
              value: f
            - eval: st.enterRunning(coresvc.ResultSuccess)
              to: st.enterRunning
            - return: ""
          when: f != coresvc.ResultSuccess
      - opt:
          do:
            - eval: st.setState(coresvc.StateReloading, coresvc.SubReloadNotify)
              to: st.setState
            - return: ""
          when: m.notify == notifyReloading
      - eval: st.reloadSignal()
        to: st.reloadSignal
  - of: (*step).reloadSignal
    participants:
      - id: caller
        kind: actor
      - id: (*step).reloadSignal
        kind: self
      - id: st.signal
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.reloadDone
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - eval: st.signal(m.mainPID, m.s.reloadSignal)
              to: st.signal
            - eval: st.setState(coresvc.StateReloading, coresvc.SubReloadSignal)
              to: st.setState
            - return: ""
          when: m.s.typ == coresvc.TypeNotifyReload && m.mainPID != 0
      - eval: st.reloadDone()
        to: st.reloadDone
  - of: (*step).reloadDone
    participants:
      - id: caller
        kind: actor
      - id: (*step).reloadDone
        kind: self
      - id: st.enterRunning
        kind: internal
      - id: st.setState
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterRunning(coresvc.ResultSuccess)
              to: st.enterRunning
            - return: ""
          when: len(st.m.s.lists[listReloadPost]) == 0
      - eval: st.setState(coresvc.StateReloading, coresvc.SubReloadPost)
        to: st.setState
      - eval: st.spawn(listReloadPost, 0, false)
        to: st.spawn
  - of: watchdogRuns
    steps:
      - switch:
          cases:
            - case: coresvc.SubStartPost, coresvc.SubRunning, coresvc.SubRunningRevalidating, coresvc.SubReload, coresvc.SubReloadSignal, coresvc.SubReloadNotify, coresvc.SubReloadPost, coresvc.SubStop, coresvc.SubStopSigterm, coresvc.SubStopSigkill, coresvc.SubStopPost, coresvc.SubFinalSigterm, coresvc.SubFinalSigkill
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": sub
  - of: (*step).watchdogPeriod
    steps:
      - opt:
          do:
            - return: st.m.watchdogPeriod
          when: st.m.watchdogPeriod > 0
      - return: st.m.s.watchdog
  - of: (*step).resetWatchdog
    participants:
      - id: caller
        kind: actor
      - id: (*step).resetWatchdog
        kind: self
      - id: st.watchdogPeriod
        kind: internal
      - id: st.disarm
        kind: internal
      - id: st.arm
        kind: internal
    steps:
      - bind: period
        eval: st.watchdogPeriod()
        to: st.watchdogPeriod
      - opt:
          do:
            - eval: st.disarm(timerWatchdog)
              to: st.disarm
            - return: ""
          when: period <= 0 || !watchdogRuns(st.m.sub)
      - eval: st.arm(timerWatchdog, period)
        to: st.arm
  - of: (*step).forceWatchdog
    participants:
      - id: caller
        kind: actor
      - id: (*step).forceWatchdog
        kind: self
      - id: st.enterSignal
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: isDead(m.state) || m.state == coresvc.StateAutoRestart || (m.state == coresvc.StateDeactivating && m.sub != coresvc.SubStop)
      - eval: st.enterSignal(coresvc.SubStopWatchdog, coresvc.ResultWatchdog)
        to: st.enterSignal
  - of: (*step).whenNoControl
    steps:
      - opt:
          do:
            - eval: next()
          when: st.m.controlPID == 0
  - of: (*step).whenNoMain
    steps:
      - opt:
          do:
            - eval: next()
          when: st.m.mainPID == 0
  - of: (*step).onExit
    participants:
      - id: caller
        kind: actor
      - id: (*step).onExit
        kind: self
      - id: st.groupNews
        kind: internal
      - id: st.mainExited
        kind: internal
      - id: st.controlExited
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: pid
        eval: st.ev.pid
      - eval: st.groupNews()
        to: st.groupNews
      - opt:
          do:
            - return: ""
          when: pid == 0
      - opt:
          do:
            - eval: st.mainExited()
              to: st.mainExited
            - return: ""
          when: pid == m.mainPID
      - opt:
          do:
            - eval: st.controlExited()
              to: st.controlExited
          when: pid == m.controlPID
  - of: (*step).mainExited
    participants:
      - id: caller
        kind: actor
      - id: (*step).mainExited
        kind: self
      - id: m.set
        kind: internal
      - id: classifyMain
        kind: internal
      - id: st.fold
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - set: m.mainPID, m.mainExit
        value: 0, ev.exit
      - eval: m.set(flagMainExited, true)
        to: m.set
      - opt:
          do:
            - eval: m.set(flagCgroupGood, m.has(flagGroupPopulated))
              to: m.set
          when: m.s.exitType == coresvc.ExitTypeCgroup
      - bind: f
        eval: classifyMain(m.s, ev.exit, ev.has(flagUnknown), m.mainFlags)
        to: classifyMain
      - eval: st.fold(f)
        to: st.fold
      - opt:
          do:
            - eval: st.spawn(listStart, m.cmd+1, true)
              to: st.spawn
            - return: ""
          when: st.oneshotHasNext(f)
      - opt:
          do:
            - eval: next(st, f)
          init:
            bind: next, ok
            eval: mainExits[m.sub]
          when: ok
  - of: (*step).oneshotHasNext
    steps:
      - bind: m
        eval: st.m
      - return: |-
          m.s.typ == coresvc.TypeOneshot && m.sub == coresvc.SubStart && f == coresvc.ResultSuccess &&
          		m.cmd+1 < len(m.s.lists[listStart])
  - of: (*step).mainExitedStarting
    participants:
      - id: caller
        kind: actor
      - id: (*step).mainExitedStarting
        kind: self
      - id: st.onOK
        kind: internal
      - id: st.enterSignal
        kind: internal
      - id: st.notifyMainGone
        kind: internal
      - id: st.enterRunning
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ok
        eval: f == coresvc.ResultSuccess
      - switch:
          cases:
            - case: m.s.typ == coresvc.TypeOneshot
              do:
                - eval: st.onOK(f, st.enterStartPost)
                  to: st.onOK
            - case: m.s.typ == coresvc.TypeForking
            - case: isNotifyType(m.s.typ) && !ok
              do:
                - eval: st.enterSignal(coresvc.SubStopSigterm, f)
                  to: st.enterSignal
            - case: isNotifyType(m.s.typ)
              do:
                - eval: st.notifyMainGone()
                  to: st.notifyMainGone
            - default: true
              do:
                - eval: st.enterRunning(f)
                  to: st.enterRunning
  - of: (*step).notifyMainGone
    participants:
      - id: caller
        kind: actor
      - id: (*step).notifyMainGone
        kind: self
      - id: st.enterSignal
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: m.s.on(setRemainAfterExit) && m.notifyAccess != coresvc.NotifyAccessMain
      - eval: st.enterSignal(coresvc.SubStopSigterm, coresvc.ResultProtocol)
        to: st.enterSignal
  - of: (*step).controlExited
    participants:
      - id: caller
        kind: actor
      - id: (*step).controlExited
        kind: self
      - id: classifyControl
        kind: internal
      - id: st.spawn
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - set: m.controlPID
        value: "0"
      - bind: f
        eval: classifyControl(ev.exit, ev.has(flagUnknown), st.runningFlags())
        to: classifyControl
      - opt:
          do:
            - set: f
              value: coresvc.ResultExecCondition
          when: m.sub == coresvc.SubCondition && f == coresvc.ResultExitCode && ev.exit.Code < maxExitCode
      - opt:
          do:
            - eval: st.spawn(m.list, m.cmd+1, false)
              to: st.spawn
            - return: ""
          when: f == coresvc.ResultSuccess && m.list != listNone && m.cmd+1 < len(m.s.lists[m.list])
      - set: m.list
        value: listNone
      - opt:
          do:
            - eval: next(st, f)
          init:
            bind: next, ok
            eval: controlDone[m.sub]
          when: ok
  - of: (*step).runningFlags
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: "0"
          when: m.list == listNone || m.cmd >= len(m.s.lists[m.list])
      - return: m.s.lists[m.list][m.cmd].Flags
  - of: (*step).onOK
    participants:
      - id: caller
        kind: actor
      - id: (*step).onOK
        kind: self
      - id: st.enterSignal
        kind: internal
    steps:
      - opt:
          do:
            - eval: next()
            - return: ""
          when: f == coresvc.ResultSuccess
      - eval: st.enterSignal(coresvc.SubStopSigterm, f)
        to: st.enterSignal
  - of: (*step).reloadPostDone
    participants:
      - id: caller
        kind: actor
      - id: (*step).reloadPostDone
        kind: self
      - id: st.enterRunning
        kind: internal
    steps:
      - opt:
          do:
            - set: st.m.reloadResult
              value: f
          when: f != coresvc.ResultSuccess
      - eval: st.enterRunning(coresvc.ResultSuccess)
        to: st.enterRunning
  - of: (*step).notifyStore
    participants:
      - id: caller
        kind: actor
      - id: (*step).notifyStore
        kind: self
      - id: st.storeFiles
        kind: internal
      - id: st.closeUnkept
        kind: internal
      - id: st.removeNamed
        kind: internal
    steps:
      - bind: files
        eval: st.ev.msg.Files
      - bind: keep
        eval: make([]bool, len(files))
      - opt:
          do:
            - eval: st.storeFiles(f, keep)
              to: st.storeFiles
          when: f["FDSTORE"] == "1"
      - eval: st.closeUnkept(files, keep)
        to: st.closeUnkept
      - opt:
          do:
            - eval: st.removeNamed(f["FDNAME"])
              to: st.removeNamed
          when: f["FDSTOREREMOVE"] == "1"
  - of: (*step).storeFiles
    participants:
      - id: caller
        kind: actor
      - id: (*step).storeFiles
        kind: self
      - id: st.ownStore
        kind: internal
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: files
        eval: st.ev.msg.Files
      - bind: first
        eval: "0"
      - opt:
          do:
            - set: first
              value: "1"
          when: f["MAINPIDFD"] == "1"
      - opt:
          do:
            - return: ""
          when: first >= len(files)
      - eval: st.ownStore()
        to: st.ownStore
      - bind: name, poll
        eval: fdName(f["FDNAME"]), f["FDPOLL"] != "0"
      - var:
          name: kept
          type: "[]*os.File"
      - var:
          name: entries
          type: "[]storeEntry"
      - loop:
          cond: i < len(files)
          do:
            - opt:
                do:
                  - continue: true
                when: st.duplicate(i)
            - opt:
                do:
                  - op: ++
                    set: m.storeRefused
                  - continue: true
                when: len(m.store) >= m.s.storeMax
            - op: ++
              set: m.storeSeq
            - bind: e
              eval: "storeEntry{name: name, id: m.storeSeq, poll: poll}"
            - set: m.store
              value: append(slices.Clip(m.store), e)
            - set: m.storeKey
              value: m.s.storeKey
            - set: keep[i]
              value: "true"
            - set: kept, entries
              value: append(kept, files[i]), append(entries, e)
          init: i := first
          post: i++
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efStore, files: kept, entries: entries})"
              to: st.emit
          when: len(kept) > 0
  - of: (*step).duplicate
    steps:
      - bind: dups
        eval: st.ev.dupOf
      - opt:
          do:
            - return: "false"
          when: i >= len(dups) || dups[i] == 0
      - return: dups[i] == dupEarlier || slices.ContainsFunc(st.m.store, func(e storeEntry) bool { return e.id == dups[i] })
  - of: (*step).closeUnkept
    participants:
      - id: caller
        kind: actor
      - id: (*step).closeUnkept
        kind: self
      - id: st.closeFiles
        kind: internal
    steps:
      - var:
          name: drop
          type: "[]*os.File"
      - loop:
          do:
            - opt:
                do:
                  - set: drop
                    value: append(drop, f)
                when: "!keep[i]"
          key: i
          range: files
          value: f
      - eval: st.closeFiles(drop)
        to: st.closeFiles
  - of: (*step).closeFiles
    participants:
      - id: caller
        kind: actor
      - id: (*step).closeFiles
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efClose, files: files})"
              to: st.emit
          when: len(files) > 0
  - of: (*step).removeNamed
    participants:
      - id: caller
        kind: actor
      - id: (*step).removeNamed
        kind: self
      - id: st.dropWhere
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: name == "" || listen.CheckName(name) != nil
      - eval: st.dropWhere(func(e storeEntry) bool { return e.name == name })
        to: st.dropWhere
  - of: (*step).onHangup
    participants:
      - id: caller
        kind: actor
      - id: (*step).onHangup
        kind: self
      - id: st.dropWhere
        kind: internal
    steps:
      - bind: id
        eval: st.ev.stored
      - eval: st.dropWhere(func(e storeEntry) bool { return e.id == id })
        to: st.dropWhere
  - of: (*step).dropWhere
    participants:
      - id: caller
        kind: actor
      - id: (*step).dropWhere
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - leaf: a var of several names, or of no type
        stmt: var gone, kept []storeEntry
      - loop:
          do:
            - opt:
                do:
                  - set: gone
                    value: append(gone, e)
                  - continue: true
                when: drop(e)
            - set: kept
              value: append(kept, e)
          key: _
          range: m.store
          value: e
      - opt:
          do:
            - return: ""
          when: len(gone) == 0
      - set: m.store
        value: kept
      - opt:
          do:
            - set: m.storeKey
              value: "\"\""
          when: len(kept) == 0
      - eval: "st.emit(&effect{kind: efStoreDrop, entries: gone})"
        to: st.emit
  - of: (*step).releaseStore
    participants:
      - id: caller
        kind: actor
      - id: (*step).releaseStore
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: len(m.store) == 0
      - eval: "st.emit(&effect{kind: efStoreDrop, entries: m.store})"
        to: st.emit
      - set: m.store, m.storeKey
        value: nil, ""
  - of: (*step).ownStore
    participants:
      - id: caller
        kind: actor
      - id: (*step).ownStore
        kind: self
      - id: st.releaseStore
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: len(m.store) == 0 || m.storeKey == m.s.storeKey
      - op: +=
        set: m.storeDiscarded
        value: uint64(len(m.store))
      - eval: st.releaseStore()
        to: st.releaseStore
  - of: (*step).handOver
    participants:
      - id: caller
        kind: actor
      - id: (*step).handOver
        kind: self
      - id: st.ownStore
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - eval: st.ownStore()
        to: st.ownStore
      - bind: store
        eval: st.m.store
      - opt:
          do:
            - return: nil
          when: len(store) == 0
      - bind: out
        eval: slices.Clone(store)
        to: slices
      - eval: slices.Reverse(out)
        to: slices
      - return: out
  - of: (*step).settleStore
    participants:
      - id: caller
        kind: actor
      - id: (*step).settleStore
        kind: self
      - id: isDead
        kind: internal
      - id: st.releaseStore
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - return: ""
          when: len(m.store) == 0 || m.job.kind != jobNone || m.pending.kind != jobNone
      - bind: release
        eval: "false"
      - switch:
          cases:
            - case: coresvc.PreserveRestart
              do:
                - set: release
                  to: isDead
                  value: isDead(m.state)
            - case: coresvc.PreserveOnSuccess
              do:
                - set: release
                  value: m.state == coresvc.StateFailed
            - default: true
          "on": m.s.preserve
      - opt:
          do:
            - eval: st.releaseStore()
              to: st.releaseStore
          when: release
  - of: fdName
    steps:
      - opt:
          do:
            - return: defaultFDName
          when: v == "" || listen.CheckName(v) != nil
      - return: v
  - of: newHangupWatch
    participants:
      - id: caller
        kind: actor
      - id: newHangupWatch
        kind: self
      - id: syscall
        kind: stdlib
      - id: gone
        kind: internal
      - id: w.closeFDs
        kind: internal
    steps:
      - bind: epfd, err
        eval: syscall.EpollCreate1(syscall.EPOLL_CLOEXEC)
        to: syscall
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: w
        eval: "&hangupWatch{epfd: epfd}"
      - opt:
          do:
            - eval: gone(syscall.Close(epfd))
              to: gone
            - return: nil, err
          init:
            bind: err
            eval: syscall.Pipe2(w.wake[:], syscall.O_CLOEXEC|syscall.O_NONBLOCK)
            op: =
            to: syscall
          when: err != nil
      - opt:
          do:
            - eval: w.closeFDs()
              to: w.closeFDs
            - return: nil, err
          init:
            bind: err
            eval: "syscall.EpollCtl(epfd, syscall.EPOLL_CTL_ADD, w.wake[0], new(syscall.EpollEvent{Events: syscall.EPOLLIN}))"
            op: =
            to: syscall
          when: err != nil
      - return: w, nil
  - of: (*hangupWatch).add
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).add
        kind: self
      - id: control
        kind: internal
    steps:
      - bind: ev
        eval: "&syscall.EpollEvent{Events: syscall.EPOLLONESHOT, Fd: int32(uint32(id)), Pad: int32(uint32(id >> 32))}"
      - bind: added
        eval: "false"
      - eval: control(f, func(fd int) { added = syscall.EpollCtl(w.epfd, syscall.EPOLL_CTL_ADD, fd, ev) == nil })
        to: control
      - return: added
  - of: (*hangupWatch).remove
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).remove
        kind: self
      - id: control
        kind: internal
    steps:
      - eval: control(f, func(fd int) { gone(syscall.EpollCtl(w.epfd, syscall.EPOLL_CTL_DEL, fd, &syscall.EpollEvent{})) })
        to: control
  - of: (*hangupWatch).start
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).start
        kind: self
      - id: w.running.Go
        kind: value
    steps:
      - eval: |-
          w.running.Go(func() {
          		w.run(post)
          	})
        to: w.running.Go
  - of: (*hangupWatch).run
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).run
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: events
        eval: make([]syscall.EpollEvent, 8)
      - loop:
          do:
            - bind: n, err
              eval: syscall.EpollWait(w.epfd, events, -1)
              to: syscall
            - opt:
                do:
                  - continue: true
                when: err == syscall.EINTR
            - opt:
                do:
                  - return: ""
                when: err != nil
            - loop:
                do:
                  - bind: id
                    eval: uint64(uint32(events[i].Fd)) | uint64(uint32(events[i].Pad))<<32
                  - opt:
                      do:
                        - return: ""
                      when: id == 0 || !post(id)
                key: i
                range: "n"
          forever: true
  - of: (*hangupWatch).stop
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).stop
        kind: self
      - id: syscall
        kind: stdlib
      - id: gone
        kind: internal
      - id: w.running.Wait
        kind: value
      - id: w.closeFDs
        kind: internal
    steps:
      - bind: _, err
        eval: syscall.Write(w.wake[1], []byte{1})
        to: syscall
      - eval: gone(err)
        to: gone
      - eval: w.running.Wait()
        to: w.running.Wait
      - eval: w.closeFDs()
        to: w.closeFDs
  - of: (*hangupWatch).closeFDs
    participants:
      - id: caller
        kind: actor
      - id: (*hangupWatch).closeFDs
        kind: self
      - id: gone
        kind: internal
    steps:
      - eval: gone(syscall.Close(w.epfd))
        to: gone
      - eval: gone(syscall.Close(w.wake[0]))
        to: gone
      - eval: gone(syscall.Close(w.wake[1]))
        to: gone
  - of: control
    participants:
      - id: caller
        kind: actor
      - id: control
        kind: self
      - id: f.SyscallConn
        kind: value
      - id: gone
        kind: internal
    steps:
      - bind: rc, err
        eval: f.SyscallConn()
        to: f.SyscallConn
      - opt:
          do:
            - return: ""
          when: err != nil
      - eval: gone(rc.Control(func(fd uintptr) { fn(int(fd)) }))
        to: gone
  - of: sameFile
    participants:
      - id: caller
        kind: actor
      - id: sameFile
        kind: self
      - id: a.Stat
        kind: value
      - id: b.Stat
        kind: value
    steps:
      - bind: ia, errA
        eval: a.Stat()
        to: a.Stat
      - bind: ib, errB
        eval: b.Stat()
        to: b.Stat
      - opt:
          do:
            - return: "false"
          when: errA != nil || errB != nil || !os.SameFile(ia, ib) || ia.Mode()&os.ModeDevice != 0
      - return: accessMode(a) == accessMode(b)
  - of: accessMode
    participants:
      - id: caller
        kind: actor
      - id: accessMode
        kind: self
      - id: control
        kind: internal
    steps:
      - bind: mode
        eval: "-1"
      - eval: |-
          control(f, func(fd int) {
          		flags, _, errno := syscall.Syscall(syscall.SYS_FCNTL, uintptr(fd), syscall.F_GETFL, 0)
          		//: read.
          		if errno == 0 {
          			mode = int(flags) & syscall.O_ACCMODE
          		}
          	})
        to: control
      - return: mode
  - of: fileID
    steps:
      - bind: st, ok
        eval: info.Sys().(*syscall.Stat_t)
      - opt:
          do:
            - return: 0, 0
          when: "!ok"
      - return: uint64(st.Dev), st.Ino
  - of: (*step).forkingStarted
    participants:
      - id: caller
        kind: actor
      - id: (*step).forkingStarted
        kind: self
      - id: st.enterSignal
        kind: internal
      - id: st.enterStartPost
        kind: internal
      - id: st.findMain
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterSignal(coresvc.SubStopSigterm, f)
              to: st.enterSignal
            - return: ""
          when: f != coresvc.ResultSuccess
      - opt:
          do:
            - eval: st.enterStartPost()
              to: st.enterStartPost
            - return: ""
          when: st.m.mainPID != 0
      - eval: st.findMain()
        to: st.findMain
  - of: (*step).startPostDone
    participants:
      - id: caller
        kind: actor
      - id: (*step).startPostDone
        kind: self
      - id: st.findMain
        kind: internal
      - id: st.enterRunning
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - eval: st.findMain()
              to: st.findMain
            - return: ""
          when: m.s.typ == coresvc.TypeForking && m.mainPID == 0
      - eval: st.enterRunning(coresvc.ResultSuccess)
        to: st.enterRunning
  - of: (*step).findMain
    participants:
      - id: caller
        kind: actor
      - id: (*step).findMain
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - bind: s
        eval: st.m.s
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efAttachFile})"
              to: st.emit
            - return: ""
          when: s.pidFile != ""
      - eval: "st.emit(&effect{kind: efGuess, opts: optIf(optGuess, s.on(setGuess))})"
        to: st.emit
  - of: (*step).waitingForMain
    steps:
      - bind: m
        eval: st.m
      - return: |-
          m.s.typ == coresvc.TypeForking && m.mainPID == 0 && m.controlPID == 0 &&
          		(m.sub == coresvc.SubStart || m.sub == coresvc.SubStartPost)
  - of: (*step).pidFileRead
    participants:
      - id: caller
        kind: actor
      - id: (*step).pidFileRead
        kind: self
      - id: st.dropAdopted
        kind: internal
      - id: st.adoptMain
        kind: internal
      - id: st.mainFound
        kind: internal
      - id: st.enterStartPost
        kind: internal
      - id: st.mainNeverFound
        kind: internal
      - id: st.arm
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - opt:
          do:
            - eval: st.dropAdopted()
              to: st.dropAdopted
            - return: ""
          when: "!st.waitingForMain()"
      - opt:
          do:
            - eval: st.adoptMain(ev.pid)
              to: st.adoptMain
            - eval: st.mainFound()
              to: st.mainFound
            - return: ""
          when: ev.has(flagOK)
      - set: m.pidFileCause
        value: ev.reason
      - opt:
          do:
            - eval: st.enterStartPost()
              to: st.enterStartPost
            - return: ""
          when: m.sub == coresvc.SubStart && len(m.s.lists[listStartPost]) > 0
      - opt:
          do:
            - eval: st.mainNeverFound()
              to: st.mainNeverFound
            - return: ""
          when: ev.has(flagEmpty)
      - eval: st.arm(timerPIDFile, pidFileRetry)
        to: st.arm
  - of: (*step).pidFileDue
    participants:
      - id: caller
        kind: actor
      - id: (*step).pidFileDue
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efAttachFile})"
              to: st.emit
          when: st.waitingForMain()
  - of: (*step).mainGuessed
    participants:
      - id: caller
        kind: actor
      - id: (*step).mainGuessed
        kind: self
      - id: st.dropAdopted
        kind: internal
      - id: st.adoptMain
        kind: internal
      - id: m.set
        kind: internal
      - id: st.mainFound
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - bind: ev
        eval: st.ev
      - opt:
          do:
            - eval: st.dropAdopted()
              to: st.dropAdopted
            - return: ""
          when: "!st.waitingForMain()"
      - alt:
          - do:
              - eval: st.adoptMain(ev.pid)
                to: st.adoptMain
            when: ev.has(flagOK)
          - do:
              - eval: m.set(flagCgroupGood, ev.has(flagPopulated))
                to: m.set
            else: true
      - eval: st.mainFound()
        to: st.mainFound
  - of: (*step).dropAdopted
    participants:
      - id: caller
        kind: actor
      - id: (*step).dropAdopted
        kind: self
      - id: st.emit
        kind: internal
    steps:
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efForget, pid: st.ev.pid})"
              to: st.emit
          when: st.ev.has(flagOK)
  - of: (*step).adoptMain
    participants:
      - id: caller
        kind: actor
      - id: (*step).adoptMain
        kind: self
      - id: st.emit
        kind: internal
      - id: m.set
        kind: internal
    steps:
      - bind: m
        eval: st.m
      - opt:
          do:
            - eval: "st.emit(&effect{kind: efForget, pid: m.mainPID})"
              to: st.emit
          when: m.mainPID != 0 && m.mainPID != pid
      - set: m.mainPID
        value: pid
      - eval: m.set(flagMainExited, false)
        to: m.set
  - of: (*step).mainFound
    participants:
      - id: caller
        kind: actor
      - id: (*step).mainFound
        kind: self
      - id: st.enterStartPost
        kind: internal
      - id: st.enterRunning
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterStartPost()
              to: st.enterStartPost
            - return: ""
          when: st.m.sub == coresvc.SubStart
      - eval: st.enterRunning(coresvc.ResultSuccess)
        to: st.enterRunning
  - of: (*step).mainNeverFound
    participants:
      - id: caller
        kind: actor
      - id: (*step).mainNeverFound
        kind: self
      - id: st.enterSignal
        kind: internal
      - id: st.enterStop
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.enterSignal(coresvc.SubStopSigterm, coresvc.ResultProtocol)
              to: st.enterSignal
            - return: ""
          when: st.m.sub == coresvc.SubStart
      - eval: st.enterStop(coresvc.ResultProtocol)
        to: st.enterStop
  - of: soleRoot
    participants:
      - id: caller
        kind: actor
      - id: soleRoot
        kind: self
      - id: parentOf
        kind: internal
    steps:
      - bind: in
        eval: make(map[int]bool, len(members))
      - loop:
          do:
            - set: in[pid]
              value: "true"
          key: _
          range: members
          value: pid
      - bind: root, roots
        eval: 0, 0
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: pid <= 1 || pid == self
            - bind: parent, known
              eval: parentOf(pid)
              to: parentOf
            - opt:
                do:
                  - continue: true
                when: "!known || in[parent]"
            - set: root, roots
              value: pid, roots+1
          key: pid
          range: in
      - return: root, roots == 1
  - of: parentOf
    participants:
      - id: caller
        kind: actor
      - id: parentOf
        kind: self
      - id: os
        kind: stdlib
      - id: bytes
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw, err
        eval: os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")
        to: os
      - opt:
          do:
            - return: 0, false
          when: err != nil
      - bind: _, rest, named
        eval: bytes.CutLast(raw, []byte(")"))
        to: bytes
      - opt:
          do:
            - return: 0, false
          when: "!named"
      - bind: fields
        eval: bytes.Fields(rest)
        to: bytes
      - opt:
          do:
            - return: 0, false
          when: len(fields) < 2
      - bind: parent, err
        eval: strconv.Atoi(string(fields[1]))
        to: strconv
      - return: parent, err == nil
  - of: NewHandoverState
    steps:
      - return: "&HandoverState{}"
  - of: (*HandoverState).Close
    participants:
      - id: caller
        kind: actor
      - id: (*HandoverState).Close
        kind: self
      - id: stopHanded
        kind: internal
      - id: fu.closeFiles
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: fu.taken
            - set: fu.taken
              value: "true"
            - eval: stopHanded(ctx, grace, fu.procs)
              to: stopHanded
            - eval: fu.closeFiles()
              to: fu.closeFiles
          key: _
          range: h.units
          value: fu
      - return: nil
  - of: (*frozenUnit).closeFiles
    participants:
      - id: caller
        kind: actor
      - id: (*frozenUnit).closeFiles
        kind: self
      - id: closeFiles
        kind: internal
    steps:
      - eval: closeFiles(fu.files())
        to: closeFiles
      - eval: clear(fu.store)
      - set: fu.conn, fu.notify
        value: nil, nil
      - loop:
          do:
            - set: fu.procs[i].witness
              value: nil
          key: i
          range: fu.procs
  - of: mapKeys
    steps:
      - return:
          closure:
            params: yield func(uint64) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(id)"
                  key: id
                  range: m
  - of: Freeze
    participants:
      - id: caller
        kind: actor
      - id: Freeze
        kind: self
      - id: handoverHere
        kind: internal
      - id: NewHandoverState
        kind: internal
      - id: u.freeze
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: handoverHere("Freeze")
            to: handoverHere
          when: err != nil
      - bind: h
        eval: NewHandoverState()
        to: NewHandoverState
      - loop:
          do:
            - bind: fu, err
              eval: u.freeze(ctx)
              to: u.freeze
            - opt:
                do:
                  - return: h, err
                when: err != nil
            - set: h.units
              value: append(h.units, fu)
          key: _
          range: units
          value: u
      - return: h, nil
  - of: (*Unit).freeze
    participants:
      - id: caller
        kind: actor
      - id: (*Unit).freeze
        kind: self
      - id: u.mu.Lock
        kind: value
      - id: u.mu.Unlock
        kind: value
      - id: ctx.Err
        kind: value
      - id: u.send
        kind: internal
      - id: u.readers.Wait
        kind: value
    steps:
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - bind: closed
        eval: u.closed
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
      - opt:
          do:
            - return: nil, unitClosed(u.s.name)
          when: closed
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: u.send(context.WithoutCancel(ctx), evFreeze)
            to: u.send
          when: err != nil
      - eval: u.readers.Wait()
        to: u.readers.Wait
      - eval: u.mu.Lock()
        to: u.mu.Lock
      - bind: fu
        eval: u.frozen
      - set: u.frozen
        value: nil
      - eval: u.mu.Unlock()
        to: u.mu.Unlock
      - return: fu, nil
  - forward: errors.Join
    of: joinCause
  - of: unitClosed
    participants:
      - id: caller
        kind: actor
      - id: unitClosed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coresvc.UnitClosed, errs.WrapParams{}, errs.String("unit", name))
        to: errs
  - of: Resume
    participants:
      - id: caller
        kind: actor
      - id: Resume
        kind: self
      - id: handoverHere
        kind: internal
      - id: closeNotify
        kind: internal
      - id: h.unit
        kind: internal
      - id: decodeModel
        kind: internal
      - id: adoptNotify
        kind: internal
      - id: closeFiles
        kind: internal
      - id: resolve
        kind: internal
      - id: launchRestored
        kind: internal
    steps:
      - bind: own
        eval: "*cfg"
      - opt:
          do:
            - eval: closeNotify(own.Notify)
              to: closeNotify
            - return: nil, err
          init:
            bind: err
            eval: handoverHere("Resume")
            to: handoverHere
          when: err != nil
      - var:
          name: fu
          type: "*frozenUnit"
      - opt:
          do:
            - set: fu
              to: h.unit
              value: h.unit(own.Name)
          when: h != nil
      - opt:
          do:
            - eval: closeNotify(own.Notify)
              to: closeNotify
            - return: nil, handoverInvalid("no state for the unit", errs.String("unit", own.Name))
          when: fu == nil
      - bind: m, err
        eval: decodeModel(fu.model)
        to: decodeModel
      - opt:
          do:
            - eval: closeNotify(own.Notify)
              to: closeNotify
            - return: nil, errs.Wrap(err, errs.WrapParams{}, errs.String("unit", own.Name))
          when: err != nil
      - opt:
          do:
            - bind: src, aerr
              eval: adoptNotify(fu.notify, fu.socket)
              to: adoptNotify
            - eval: closeFiles([]*os.File{fu.notify})
              to: closeFiles
            - set: fu.notify
              value: nil
            - opt:
                do:
                  - eval: closeNotify(own.Notify)
                    to: closeNotify
                  - set: own.Notify
                    value: src
                when: aerr == nil
          when: fu.notify != nil
