# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: shellWatching is set while the group's watch runs (S0g).
        name: shellWatching
        type: shellFlag
        value: 1 << iota
      - doc: shellBusWatching is set while the bus name's watch runs (S0e).
        name: shellBusWatching
      - doc: shellExiting is set once the reducer asked to end.
        name: shellExiting
    name: shellWatching
  - doc: needsUnit is what a refused cgroup mode's error names as what lifts it.
    items:
      - name: needsUnit
        type: string
        value: "\"a Cgroup that is a coresvc.CgroupUnit (cgroup v2, S0g #734)\""
    name: needsUnit
  - doc: |-
      busNameGrace is how long a Type=dbus unit alive without its name is given
      to own it again: systemd's SERVICE_BUS_NAME_GRACE_USEC.
    items:
      - name: busNameGrace
        type: time.Duration
        value: 2 * time.Second
    name: busNameGrace
  - grouped: true
    items:
      - doc: maxBusName is the longest bus name the D-Bus specification allows.
        name: maxBusName
        type: int
        value: "255"
      - doc: |-
          minBusElements is how many dot-separated elements a bus name has at
          least.
        name: minBusElements
        type: int
        value: "2"
    name: maxBusName
  - grouped: true
    items:
      - doc: |-
          defaultFDName names a descriptor stored without a valid FDNAME=, as
          sd_notify(3) names it.
        name: defaultFDName
        type: string
        value: "\"stored\""
      - doc: dupEarlier marks a descriptor that repeats one before it in its message.
        name: dupEarlier
        type: uint64
        value: ^uint64(0)
    name: defaultFDName
  - doc: |-
      pidFileRetry is how long a forking unit waits before it reads a PID file it
      could not read again — systemd's inotify watch, on the unit's clock.
    items:
      - name: pidFileRetry
        type: time.Duration
        value: 100 * time.Millisecond
    name: pidFileRetry
  - doc: |-
      firstPassedFD is the lowest descriptor a hand-over names: 0, 1 and 2 are
      the stdio every image keeps.
    items:
      - name: firstPassedFD
        type: int
        value: "3"
    name: firstPassedFD
  - grouped: true
    items:
      - doc: |-
          handoverVersion is the version this image writes, and the newest it
          reads.
        name: handoverVersion
        type: uint16
        value: "1"
      - doc: handoverMagic opens every payload.
        name: handoverMagic
        type: string
        value: "\"KSDKHOV1\""
      - doc: "maxHandoverBytes bounds a payload: read whole, before it is trusted."
        name: maxHandoverBytes
        type: int
        value: 16 << 20
      - doc: recordHeader is a record's tag and length.
        name: recordHeader
        type: int
        value: "6"
      - doc: payloadHeader is the magic, the version and the body's length.
        name: payloadHeader
        type: int
        value: "14"
    name: handoverVersion
  - doc: The payload's records.
    grouped: true
    items:
      - doc: "tagUnit is one unit: its own records."
        name: tagUnit
        type: uint16
        value: iota + 1
      - doc: "tagFile is one descriptor the payload names: its own records."
        name: tagFile
    name: tagUnit
  - doc: A unit's records.
    grouped: true
    items:
      - name: uName
        type: uint16
        value: iota + 1
      - name: uModel
      - name: uProc
      - name: uStore
      - name: uConn
      - name: uNotify
      - name: uSocket
    name: uName
  - doc: A process's, a stored descriptor's and a file's records.
    grouped: true
    items:
      - name: pPID
        type: uint16
        value: iota + 1
      - name: pChild
      - name: pWitness
    name: pPID
  - doc: A stored descriptor's records.
    grouped: true
    items:
      - name: sID
        type: uint16
        value: iota + 1
      - name: sFile
    name: sID
  - doc: A descriptor's records.
    grouped: true
    items:
      - name: fIndex
        type: uint16
        value: iota + 1
      - name: fFD
      - name: fMode
      - name: fDev
      - name: fIno
    name: fIndex
  - doc: |-
      The model's records: every field of the model but its settings, which the
      incoming image resolves again from Config, and its waiters, who were the
      outgoing image's callers.
    grouped: true
    items:
      - name: mChanged
        type: uint16
        value: iota + 1
      - name: mLimitBegin
      - name: mRuntimeAt
      - name: mRevalidateBegin
      - name: mDeadlineState
      - name: mDeadlineWatchdog
      - name: mDeadlinePIDFile
      - name: mPublishedAt
      - name: mStatus
      - name: mBusError
      - name: mVarlinkError
      - name: mExitStatusText
      - name: mPIDFileCause
      - name: mJob
      - name: mPending
      - name: mStoreEntry
      - name: mStoreKey
      - name: mSandboxField
      - name: mSandboxCause
      - name: mMainExit
      - name: mSeqState
      - name: mSeqWatchdog
      - name: mSeqPIDFile
      - name: mGeneration
      - name: mNotifyRefused
      - name: mReloadBegin
      - name: mStoreSeq
      - name: mStoreRefused
      - name: mStoreDiscarded
      - name: mWatchdogPeriod
      - name: mMainPID
      - name: mControlPID
      - name: mCmd
      - name: mErrno
      - name: mLimitCount
      - name: mRestarts
      - name: mState
      - name: mSub
      - name: mResult
      - name: mReloadResult
      - name: mNotifyAccess
      - name: mNotify
      - name: mList
      - name: mMainFlags
      - name: mFlags
    name: mChanged
  - doc: A job's, a store entry's, a field's and an exit's records.
    grouped: true
    items:
      - name: jKind
        type: uint16
        value: iota + 1
      - name: jStopped
    name: jKind
  - doc: A store entry's records.
    grouped: true
    items:
      - name: eName
        type: uint16
        value: iota + 1
      - name: eID
      - name: ePoll
    name: eName
  - doc: A sandbox failure field's records.
    grouped: true
    items:
      - name: kKey
        type: uint16
        value: iota + 1
      - name: kValue
    name: kKey
  - doc: An exit's records.
    grouped: true
    items:
      - name: xCode
        type: uint16
        value: iota + 1
      - name: xSignal
      - name: xSignaled
      - name: xUser
      - name: xSystem
      - name: xMaxRSS
      - name: xCore
      - name: xUsage
    name: xCode
  - doc: |-
      frozenFlags are the model's flags a frozen unit may carry: Close's and the
      end's are not — a closing unit is not handed over.
    items:
      - name: frozenFlags
        value: |-
          flagMainExited | flagForbidRestart | flagRestarting | flagDebug |
          	flagCgroupGood | flagRan | flagGroupPopulated | flagPrepare | flagBusOwned
    name: frozenFlags
  - doc: |-
      connectionName is what LISTEN_FDNAMES names an instance's connection, as
      systemd names an Accept=yes socket.
    items:
      - name: connectionName
        type: string
        value: "\"connection\""
    name: connectionName
  - grouped: true
    items:
      - doc: jobNone is no job.
        name: jobNone
        type: jobKind
        value: iota
      - doc: jobStart is a start.
        name: jobStart
      - doc: jobStop is a stop.
        name: jobStop
      - doc: jobRestart is a stop, then a start.
        name: jobRestart
      - doc: jobReload is a reload.
        name: jobReload
    name: jobNone
  - grouped: true
    items:
      - doc: notifyUnknown is nothing announced since the start.
        name: notifyUnknown
        type: notifyState
        value: iota
      - doc: notifyReady is READY=1.
        name: notifyReady
      - doc: notifyReloading is RELOADING=1.
        name: notifyReloading
      - doc: notifyStopping is STOPPING=1.
        name: notifyStopping
    name: notifyUnknown
  - grouped: true
    items:
      - doc: |-
          timerState bounds the step the unit is at, or waits out the restart
          delay.
        name: timerState
        type: timerKind
        value: iota
      - doc: timerWatchdog is the keep-alive deadline.
        name: timerWatchdog
      - doc: timerPIDFile is when a Type=forking unit reads its PID file again.
        name: timerPIDFile
      - doc: timerCount is how many timers a unit has.
        name: timerCount
    name: timerState
  - grouped: true
    items:
      - doc: flagMainExited is set once the main process's exit is known.
        name: flagMainExited
        type: modelFlag
        value: 1 << iota
      - doc: flagForbidRestart is set once a caller asked for a stop.
        name: flagForbidRestart
      - doc: flagRestarting is set during a restart job's stop.
        name: flagRestarting
      - doc: flagDebug is set on a RestartMode=debug restart.
        name: flagDebug
      - doc: flagClosing is set once Close was asked.
        name: flagClosing
      - doc: flagExited is set once the reducer asked the shell to end.
        name: flagExited
      - doc: |-
          flagCgroupGood is set while a unit with no main process is up on its
          cgroup's members alone: a Type=forking unit whose main process stayed
          unknown, an ExitType=cgroup unit whose main process ended. The cgroup's
          emptying clears it, and ends the unit (S0g).
        name: flagCgroupGood
      - doc: |-
          flagRan is set once a start began: an instance (S0f) ends with the
          first run that is over.
        name: flagRan
      - doc: |-
          flagGroupPopulated is set while the unit's group held a process when
          the shell last read it (S0g).
        name: flagGroupPopulated
      - doc: |-
          flagPrepare is set from a start until its first spawn, which prepares
          the unit's group first: the watch, Delegate=, memory.oom.group (S0g) —
          and a Type=dbus unit's bus name watch (S0e).
        name: flagPrepare
      - doc: |-
          flagBusOwned is set while a Type=dbus unit's BusName= has an owner, as
          the bus last said (S0e): the level, kept while the watch is down.
        name: flagBusOwned
    name: flagMainExited
  - grouped: true
    items:
      - doc: evStart is a caller's start.
        name: evStart
        type: eventKind
        value: iota
      - doc: evStop is a caller's stop.
        name: evStop
      - doc: evRestart is a caller's restart.
        name: evRestart
      - doc: evReload is a caller's reload.
        name: evReload
      - doc: evFail is a caller's failed health check.
        name: evFail
      - doc: evResetFailed is a caller's reset-failed.
        name: evResetFailed
      - doc: evClose is a caller's close.
        name: evClose
      - doc: evSpawned is a spawn's outcome.
        name: evSpawned
      - doc: evExit is a process's end.
        name: evExit
      - doc: evTimer is a timer's fire.
        name: evTimer
      - doc: evNotify is a notification.
        name: evNotify
      - doc: evAttached is an adoption's outcome.
        name: evAttached
      - doc: evHangup is a stored descriptor's hangup or error.
        name: evHangup
      - doc: evCgroup is a change of the unit's group the watch announced (S0g).
        name: evCgroup
      - doc: |-
          evSignaled is a group signal's outcome: whether the group held a
          process when it was sent (S0g).
        name: evSignaled
      - doc: |-
          evBusName is a change of BusName='s owner the bus announced, or the end
          of the watch (S0e).
        name: evBusName
      - doc: |-
          evFreeze is a caller's freeze (S0h): the shell's alone, never the
          reducer's.
        name: evFreeze
    name: evStart
  - grouped: true
    items:
      - doc: flagUnknown is an exit whose status is not knowable.
        name: flagUnknown
        type: eventFlag
        value: 1 << iota
      - doc: flagMember says a notification's sender belongs to the unit's cgroup.
        name: flagMember
      - doc: flagMainMember says the MAINPID= a notification names does.
        name: flagMainMember
      - doc: flagOK is an adoption that succeeded.
        name: flagOK
      - doc: flagByFile is an adoption from PIDFile=.
        name: flagByFile
      - doc: flagByGuess is an adoption GuessMainPID= guessed.
        name: flagByGuess
      - doc: flagPopulated says the unit's cgroup listed a member.
        name: flagPopulated
      - doc: flagEmpty says the unit's cgroup listed none.
        name: flagEmpty
      - doc: |-
          flagOOM says the unit's group counted an OOM kill the reducer has not
          seen (S0g).
        name: flagOOM
      - doc: |-
          flagUnwatched says the watch of the unit's group ended: the group is
          gone (S0g) — or the watch of the bus name: the connection is (S0e).
        name: flagUnwatched
      - doc: flagOwner says BusName= has an owner (S0e).
        name: flagOwner
      - doc: |-
          flagLookup says a spawn's preparation looked BusName='s owner up — the
          level before the main process runs, flagOwner its answer (S0e).
        name: flagLookup
    name: flagUnknown
  - grouped: true
    items:
      - doc: efSpawn spawns a command.
        name: efSpawn
        type: effectKind
        value: iota
      - doc: efSignal signals a process.
        name: efSignal
      - doc: efArm arms a timer.
        name: efArm
      - doc: efDisarm disarms a timer.
        name: efDisarm
      - doc: efReply answers callers.
        name: efReply
      - doc: efAttach adopts a process.
        name: efAttach
      - doc: efAttachFile adopts the process PIDFile= names.
        name: efAttachFile
      - doc: efGuess lists the cgroup and adopts the main process it guesses.
        name: efGuess
      - doc: efClose closes descriptors.
        name: efClose
      - doc: efStore keeps descriptors in the store.
        name: efStore
      - doc: efStoreDrop closes stored descriptors and forgets them.
        name: efStoreDrop
      - doc: efForget leaves a process running, unwatched.
        name: efForget
      - doc: efPublish publishes a snapshot.
        name: efPublish
      - doc: efExit ends the actor.
        name: efExit
      - doc: |-
          efSignalGroup signals the unit's group and reports whether it held a
          process (S0g).
        name: efSignalGroup
      - doc: |-
          efPrune removes the groups a delegated service made beneath the unit's
          group (S0g).
        name: efPrune
    name: efSpawn
  - grouped: true
    items:
      - doc: |-
          optGuess asks efGuess to adopt the process it guesses, not only to
          count the members.
        name: optGuess
        type: effectOpt
        value: 1 << iota
      - doc: optPrepare asks a spawn to prepare the unit's group first (S0g).
        name: optPrepare
    name: optGuess
  - doc: clockMonotonic is CLOCK_MONOTONIC's id.
    items:
      - name: clockMonotonic
        type: uintptr
        value: "1"
    name: clockMonotonic
  - grouped: true
    items:
      - doc: defaultQueue is a subscription's capacity when Subscribe is given 0.
        name: defaultQueue
        type: int
        value: "64"
      - doc: maxQueue is the largest capacity a subscription takes.
        name: maxQueue
        type: int
        value: "4096"
    name: defaultQueue
  - grouped: true
    items:
      - doc: |-
          handoverEnv names the payload's descriptor in the incoming image's
          environment, under ADR 0219's reserved prefix.
        name: handoverEnv
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_HANDOVER\""
      - doc: |-
          oPath is O_PATH: a descriptor naming a file, for execveat and fstat
          alone (include/uapi/asm-generic/fcntl.h, amd64 and arm64 alike).
        name: oPath
        type: int
        value: "0x200000"
      - doc: mfdCloexec and mfdAllowSealing are memfd_create's flags.
        name: mfdCloexec
        type: uintptr
        value: "0x1"
      - doc: mfdCloexec and mfdAllowSealing are memfd_create's flags.
        name: mfdAllowSealing
        type: uintptr
        value: "0x2"
      - doc: |-
          fAddSeals and fGetSeals are fcntl's seal commands (F_LINUX_SPECIFIC_BASE
          + 9 and + 10).
        name: fAddSeals
        type: uintptr
        value: "1033"
      - doc: |-
          fAddSeals and fGetSeals are fcntl's seal commands (F_LINUX_SPECIFIC_BASE
          + 9 and + 10).
        name: fGetSeals
        type: uintptr
        value: "1034"
      - doc: |-
          sealsWhole are F_SEAL_SEAL, F_SEAL_SHRINK, F_SEAL_GROW and
          F_SEAL_WRITE: the payload can change no more.
        name: sealsWhole
        type: uintptr
        value: 0x1 | 0x2 | 0x4 | 0x8
      - doc: fdDir lists this process's descriptors.
        name: fdDir
        type: string
        value: "\"/proc/self/fd\""
    name: handoverEnv
  - doc: sysMemfdCreate is __NR_memfd_create on amd64.
    items:
      - name: sysMemfdCreate
        type: uintptr
        value: "319"
    name: sysMemfdCreate
  - grouped: true
    items:
      - doc: |-
          archNative is the one SystemCallArchitectures= identifier S2's filter
          expresses: it kills every ABI but the native one.
        name: archNative
        type: string
        value: "\"native\""
      - doc: errnoMax is the largest errno SECCOMP_RET_ERRNO carries.
        name: errnoMax
        type: int
        value: "4095"
      - doc: sandboxDirective names a template's own sandbox in a refusal.
        name: sandboxDirective
        type: string
        value: "\"Sandbox\""
      - doc: allCapabilities keeps every capability in the bounding set.
        name: allCapabilities
        type: uint64
        value: ^uint64(0)
    name: archNative
  - grouped: true
    items:
      - doc: defaultTimeout is DefaultTimeoutStartSec= and DefaultTimeoutStopSec=.
        name: defaultTimeout
        type: time.Duration
        value: 90 * time.Second
      - doc: defaultRestartDelay is RestartSec='s default.
        name: defaultRestartDelay
        type: time.Duration
        value: 100 * time.Millisecond
      - doc: defaultLimitInterval is DefaultStartLimitIntervalSec=.
        name: defaultLimitInterval
        type: time.Duration
        value: 10 * time.Second
      - doc: defaultLimitBurst is DefaultStartLimitBurst=.
        name: defaultLimitBurst
        type: int
        value: "5"
      - doc: defaultShell runs a "|" command when Config.Shell is empty.
        name: defaultShell
        type: string
        value: "\"/bin/sh\""
      - doc: maxExitCode is the largest exit status.
        name: maxExitCode
        type: int
        value: "255"
      - doc: osWindows is the GOOS the signal rules differ on.
        name: osWindows
        type: string
        value: "\"windows\""
      - doc: osLinux is the GOOS whose notify socket carries descriptors.
        name: osLinux
        type: string
        value: "\"linux\""
    name: defaultTimeout
  - grouped: true
    items:
      - doc: "listNone is no list: no command runs."
        name: listNone
        type: list
        value: iota
      - doc: listCondition is ExecCondition=.
        name: listCondition
      - doc: listStartPre is ExecStartPre=.
        name: listStartPre
      - doc: listStart is ExecStart=, the main process.
        name: listStart
      - doc: listStartPost is ExecStartPost=.
        name: listStartPost
      - doc: listReload is ExecReload=.
        name: listReload
      - doc: listReloadPost is ExecReloadPost=.
        name: listReloadPost
      - doc: listStop is ExecStop=.
        name: listStop
      - doc: listStopPost is ExecStopPost=.
        name: listStopPost
      - doc: listCount is how many lists there are.
        name: listCount
    name: listNone
  - grouped: true
    items:
      - doc: setRemainAfterExit is RemainAfterExit=.
        name: setRemainAfterExit
        type: settingFlag
        value: 1 << iota
      - doc: setSendSIGHUP is SendSIGHUP=.
        name: setSendSIGHUP
      - doc: setSendSIGKILL is SendSIGKILL=.
        name: setSendSIGKILL
      - doc: setSurviveFinal is SurviveFinalKillSignal=.
        name: setSurviveFinal
      - doc: setHasCgroup is a unit with a CgroupKill.
        name: setHasCgroup
      - doc: setHasAttacher is a unit with an Attacher.
        name: setHasAttacher
      - doc: "setLimitOff is StartLimitIntervalSec=0: no limiter."
        name: setLimitOff
      - doc: setGuess is GuessMainPID= on a Type=forking unit without PIDFile=.
        name: setGuess
      - doc: "setInstance is a unit of one connection (S0f): it ends with its run."
        name: setInstance
      - doc: |-
          setGroupUnit is a unit whose Cgroup is a CgroupUnit: the cgroup modes
          run (S0g).
        name: setGroupUnit
      - doc: setDelegate is Delegate=.
        name: setDelegate
      - doc: |-
          setSandboxed is a unit whose main process runs in a sandbox (S2): its
          uid 0 is no privilege.
        name: setSandboxed
      - doc: |-
          setRootStartOnly is RootDirectoryStartOnly= with a root: ExecStart=
          alone pivots into it.
        name: setRootStartOnly
    name: setRemainAfterExit
  - doc: The signals the engine names, as every platform spells them.
    grouped: true
    items:
      - doc: sigTERM is KillSignal='s default off Windows.
        name: sigTERM
        value: coreproc.Signal(syscall.SIGTERM)
      - doc: sigKILL is FinalKillSignal='s default, and Windows' only signal.
        name: sigKILL
        value: coreproc.Signal(syscall.SIGKILL)
      - doc: sigABRT is WatchdogSignal='s default off Windows.
        name: sigABRT
        value: coreproc.Signal(syscall.SIGABRT)
      - doc: sigHUP is ReloadSignal='s default.
        name: sigHUP
        value: coreproc.Signal(syscall.SIGHUP)
      - doc: sigINT is a clean end for a daemon.
        name: sigINT
        value: coreproc.Signal(syscall.SIGINT)
      - doc: sigPIPE is a clean end for a daemon.
        name: sigPIPE
        value: coreproc.Signal(syscall.SIGPIPE)
    name: sigTERM
  - grouped: true
    items:
      - doc: |-
          fixedPath is the search path systemd gives a command, and the only one
          a "+" or "!" command gets (ADR 0214 §9).
        name: fixedPath
        type: string
        value: "\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\""
      - doc: shellPlain are the bytes a word may hold and need no quote in a shell.
        name: shellPlain
        type: string
        value: "\"_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789./=:,+@%-\""
    name: fixedPath
  - grouped: true
    items:
      - doc: inboxSize is how many events wait for the actor before a sender waits.
        name: inboxSize
        type: int
        value: "64"
      - doc: |-
          maxRecvFailures is how many failed Recv in a row end the notification
          reader: a source that fails forever is not polled forever.
        name: maxRecvFailures
        type: int
        value: "64"
    name: inboxSize
