        params: ctx context.Context, grace time.Duration
        recv: h *HandoverState
        results: error
      - doc: unit is the state h holds for name, nil when none.
        name: unit
        params: name string
        recv: h *HandoverState
        results: "*frozenUnit"
      - doc: |-
          encode writes h's units no Resume took as a payload of version, and lists
          the descriptors it names, by index.
        name: encode
        params: version uint16
        recv: h *HandoverState
        results: "[]byte, []*os.File, error"
    name: HandoverState
  - doc: |-
      frozenUnit is one unit as Freeze left it: its model written down, its
      processes — the outgoing image's handles, or none in the incoming one —
      and the descriptors it keeps, each a descriptor of its own.
    fields:
      - doc: store holds the store's descriptors by entry id.
        name: store
        type: map[uint64]*os.File
      - doc: |-
          conn is an instance's connection (S0f), notify the notification
          socket ListenNotify made, bound at socket.
        name: conn
        type: "*os.File"
      - doc: |-
          conn is an instance's connection (S0f), notify the notification
          socket ListenNotify made, bound at socket.
        name: notify
        type: "*os.File"
      - name: name
        type: string
      - name: socket
        type: string
      - name: model
        type: "[]byte"
      - name: procs
        type: "[]handedProc"
      - name: taken
        type: bool
    kind: struct
    methods:
      - doc: |-
          files lists every descriptor fu holds: the witnesses, the store's by id,
          the connection, the socket.
        name: files
        recv: fu *frozenUnit
        results: "[]*os.File"
      - doc: closeFiles closes every descriptor fu holds.
        name: closeFiles
        recv: fu *frozenUnit
