          oomKills is what the watch read of the group's OOM kills, for the
          shell, which turns a new one into flagOOM.
        name: oomKills
        type: int64
      - doc: |-
          dupOf says, for each of a notification's descriptors, which stored one
          it duplicates — an id, dupEarlier for one before it in the message, 0
          for none —, as the shell found by fstat.
        name: dupOf
        type: "[]uint64"
      - doc: pid is a spawned, exited or adopted process.
        name: pid
        type: int
      - name: kind
        type: eventKind
      - doc: list is the list a spawned process belongs to.
        name: list
        type: list
      - doc: timer is the timer that fired.
        name: timer
        type: timerKind
      - doc: sub is the step a group signal was sent for (evSignaled).
        name: sub
        type: coresvc.Sub
      - doc: flags are the event's booleans.
        name: flags
        type: eventFlag
    kind: struct
    methods:
      - doc: has reports whether flag f is set.
        name: has
        params: f eventFlag
        recv: ev *event
        results: bool
    name: event
  - doc: effectKind is what the shell does.
    kind: named
    name: effectKind
    underlying: uint8
  - doc: effect is one output of the reducer.
    fields:
      - name: at
        type: time.Time
      - doc: err answers the waiters.
        name: err
        type: error
      - doc: snap is the snapshot to publish.
        name: snap
        type: coresvc.StateValue
      - doc: cmd is the command to spawn.
        name: cmd
        type: coresvc.CommandValue
      - doc: vars are the variables the engine sets for the command.
        name: vars
        type: "[]string"
      - doc: signals are a group signal's signal and those that follow it.
        name: signals
        type: "[]coreproc.Signal"
      - doc: |-
          pids are the main and control processes a group signal reaches through
          their handles when they are outside the group.
        name: pids
        type: "[]int"
      - doc: waiters are the callers to answer.
        name: waiters
        type: "[]uint64"
      - doc: files are descriptors to close, or to store.
        name: files
        type: "[]*os.File"
      - doc: |-
          entries are what efStore keeps (one per file), what efStoreDrop
          closes, or what a main command's spawn is handed, in order.
        name: entries
        type: "[]storeEntry"
      - doc: seq identifies an arming.
        name: seq
        type: uint64
      - doc: pid is the process to signal, adopt or forget.
        name: pid
        type: int
      - name: kind
        type: effectKind
      - doc: list and main place a spawned process.
        name: list
        type: list
      - doc: sig is the signal to send.
        name: sig
        type: coreproc.Signal
      - doc: timer is the timer to arm or disarm.
        name: timer
        type: timerKind
      - doc: |-
          prevState and prevSub are what the published snapshot replaces; sub
          is the step a group signal is sent for.
        name: prevState
        type: coresvc.State
      - name: prevSub
        type: coresvc.Sub
      - name: sub
        type: coresvc.Sub
      - doc: main is true for the unit's main process.
        name: main
        type: bool
      - doc: opts are the effect's options.
        name: opts
        type: effectOpt
    kind: struct
    methods:
      - doc: has reports whether option o is set.
        name: has
        params: o effectOpt
        recv: ef *effect
        results: bool
    name: effect
  - doc: effectOpt is one of an effect's options, as a bit.
    kind: named
    name: effectOpt
    underlying: uint8
  - doc: |-
      step is one application of the reducer: the model it changes, the event it
      reads, and the effects it asks for.
    fields:
      - name: m
        type: "*model"
      - name: ev
        type: "*event"
      - name: out
        type: "[]effect"
    kind: struct
    methods:
      - doc: |-
          groupSignals reports whether a signal step reaches the unit's whole group:
          every step under KillMode=control-group, the kills under mixed.
        name: groupSignals
        params: sub coresvc.Sub
        recv: st *step
        results: bool
      - doc: |-
          signalGroup sends a step's signals to the unit's group — the main and
          control processes through their handles where they are outside it — and
          waits under the step's timeout: the outcome, evSignaled, goes on at once
          when the group held no process (unit_kill_context's wait_for_exit).
        name: signalGroup
        params: sub coresvc.Sub
        recv: st *step
      - doc: |-
          onSignaled takes a group signal's outcome: a group that held no process,
          with no main or control process left, has nothing to wait for — the step
          goes on as one that found nothing to signal. An outcome for a step the
          unit left is stale.
        name: onSignaled
        recv: st *step
      - doc: |-
          onCgroup takes a change of the unit's group: an OOM kill first, then its
          population, then — empty — what an emptied group ends.
        name: onCgroup
        recv: st *step
      - doc: |-
          groupNews takes what the shell read of the unit's group with an event: an
          OOM kill — before the event itself, as systemd dispatches its OOM queue
          before SIGCHLD —, then the population.
        name: groupNews
        recv: st *step
      - doc: |-
          population records what the shell read of the group: populated or empty;
          an event that read nothing leaves it.
        name: population
        recv: st *step
      - doc: |-
          onOOM is service_notify_cgroup_oom_event: OOMPolicy=continue keeps the unit;
          stop stops it — signalled while starting, ExecStop= once up —, kill sends
          the final kill at once; either ends it with the result oom-kill.
        name: onOOM
        recv: st *step
      - doc: stopOrKill sends the final kill for OOMPolicy=kill, or runs stop.
        name: stopOrKill
        params: kill bool, stop func()
        recv: st *step
      - doc: |-
          onCgroupEmpty is service_notify_cgroup_empty_event: the group emptied.
          Starting, a notify unit nobody is left to make ready fails with protocol,
          an ExitType=cgroup unit is over, a PID file nobody is left to write is
          given up; up on the group alone, the unit stops; stopping with no main or
          control process left, the stop goes on.
        name: onCgroupEmpty
        recv: st *step
      - doc: |-
          emptiedStarting is an emptied group while ExecStart= runs or the unit
          waits for its main process.
        name: emptiedStarting
        params: idle bool
        recv: st *step
      - doc: pidFileAbandoned gives up a PID file nobody is left to write.
        name: pidFileAbandoned
        recv: st *step
      - doc: whenIdle runs next when no main or control process is left.
        name: whenIdle
        params: idle bool, next func()
        recv: st *step
      - doc: |-
          onBusName takes BusName='s owner (service_bus_name_owner_change):
          starting, an owner makes the unit ready; running, a loss the bus announced
          stops it at once — NameOwnerChanged is definitive —, while a lookup that
          finds no owner — flagLookup: the first answer of a watch begun while the
          unit runs, S0h's restored unit's — leaves it the grace (from_signal false);
          an owner while it awaits its name brings it back. A watch that ended
          changes nothing: the level stays what the bus last said, as systemd keeps
          it while it is disconnected.
        name: onBusName
        recv: st *step
      - doc: |-
          goodExceptBus is service.c's service_good_except_bus_name: a main process,
          or a cgroup with members and no main process found.
        name: goodExceptBus
        recv: st *step
        results: bool
      - doc: |-
          good is service.c's service_good: something to be up on, and a Type=dbus
          unit's name owned.
        name: good
        recv: st *step
        results: bool
      - doc: awaitsBusName reports a Type=dbus unit alive whose name has no owner.
        name: awaitsBusName
        recv: st *step
        results: bool
      - doc: |-
          enterRevalidating gives a Type=dbus unit alive without its name a grace to
          own it again (systemd's SERVICE_RUNNING_REVALIDATING): an active state
          whose timer is the grace — RuntimeMaxSec='s waits, the time spent here not
          counted when the unit was running. A unit awaiting its name already keeps
          the grace it was given on the way in.
        name: enterRevalidating
        recv: st *step
      - doc: |-
          resumeRuntime moves RuntimeMaxSec='s end past the time a unit that was
          running spent awaiting its name, as systemd re-arms the budget left.
        name: resumeRuntime
        recv: st *step
      - doc: |-
          setState moves the unit, stamping when its state changed and stopping the
          watchdog outside the steps it runs in.
        name: setState
        params: state coresvc.State, sub coresvc.Sub
        recv: st *step
      - doc: fold keeps the first failure as the unit's result.
        name: fold
        params: f coresvc.Result
        recv: st *step
      - doc: arm arms timer k to fire after d; Infinity disarms it.
        name: arm
        params: k timerKind, d time.Duration
        recv: st *step
      - doc: armAt arms timer k for at.
        name: armAt
        params: k timerKind, at time.Time
        recv: st *step
      - doc: disarm disarms timer k; a fire of its last arming is stale from now on.
        name: disarm
        params: k timerKind
        recv: st *step
      - doc: |-
          spawn asks for the index-th command of l, as the main process or a control
          one. A Type=forking unit's ExecStart= is a control process given the main
          process's variables: the daemon it forks inherits them.
        name: spawn
        params: l list, index int, main bool
        recv: st *step
      - doc: |-
          vars are the variables the engine sets for a command (systemd.exec(5),
          "Environment Variables Set or Propagated by the Service Manager").
        name: vars
        params: l list, main bool
        recv: st *step
        results: "[]string"
      - doc: |-
          notifyVars are $NOTIFY_SOCKET, for whoever may be heard on it, and
          $WATCHDOG_USEC, for the main process.
        name: notifyVars
        params: main bool
        recv: st *step
        results: "[]string"
      - doc: |-
          outcomeVars are $SERVICE_RESULT, and $EXIT_CODE and $EXIT_STATUS once the
          main process's end is known.
        name: outcomeVars
        recv: st *step
        results: "[]string"
      - doc: signal asks for sig to pid.
        name: signal
        params: pid int, sig coreproc.Signal
        recv: st *step
      - doc: forgetAll drops the main and control processes, leaving them running.
        name: forgetAll
        recv: st *step
      - doc: |-
          beginStart is service.c's service_start: the limiter, the reset, then the
          condition. manual is a start a caller asked for, which flushes the restart
          counter.
        name: beginStart
        params: manual bool
        recv: st *step
      - doc: |-
          limitBelow is systemd's ratelimit_below over StartLimitIntervalSec= and
          StartLimitBurst=: every start counts, in a window that opens at the first.
        name: limitBelow
        recv: st *step
        results: bool
      - doc: enterCondition runs ExecCondition=, or goes on.
        name: enterCondition
        recv: st *step
      - doc: enterStartPre runs ExecStartPre=, or goes on.
        name: enterStartPre
        recv: st *step
      - doc: |-
          enterStart runs the first ExecStart= as the main process — or, for
          Type=forking, as the command whose clean end makes the unit up.
        name: enterStart
        recv: st *step
      - doc: enterStartPost starts the watchdog and runs ExecStartPost=, or goes on.
        name: enterStartPost
        recv: st *step
      - doc: |-
          enterRunning is up, exited, or stopping, by what is left of the unit
          (service.c's service_enter_running).
        name: enterRunning
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          exitedOrStop is service.c's service_enter_exited_or_stop: a unit with
          nothing left to be up on remains exited under RemainAfterExit=, or stops.
        name: exitedOrStop
        recv: st *step
      - doc: |-
          enterUp is up with a main process: running, or the reload or stop it
          announced meanwhile.
        name: enterUp
        recv: st *step
      - doc: |-
          runtimeDeadline sets when RuntimeMaxSec= ends the run, once, when the unit
          first comes up.
        name: runtimeDeadline
        recv: st *step
      - doc: dropControl forgets a control process still running.
        name: dropControl
        recv: st *step
      - doc: enterStop runs ExecStop=, or signals at once.
        name: enterStop
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          enterStopByNotify is a STOPPING=1: stopping, no signal sent, under
          TimeoutStopSec=.
        name: enterStopByNotify
        recv: st *step
      - doc: |-
          enterSignal sends a step's signal to what runs, and waits for it, or goes
          on at once when nothing runs. Under KillMode=control-group, and at mixed's
          kills, the signal reaches the unit's whole group (S0g).
        name: enterSignal
        params: sub coresvc.Sub, f coresvc.Result
        recv: st *step
      - doc: |-
          signalTimeout is how long a signal step waits: TimeoutAbortSec= for an
          abort, TimeoutStopSec= otherwise.
        name: signalTimeout
        params: sub coresvc.Sub
        recv: st *step
        results: time.Duration
      - doc: signalNothing goes on from a signal step that found nothing to wait for.
        name: signalNothing
        params: sub coresvc.Sub
        recv: st *step
      - doc: killSignal is a step's signal, and those that follow it.
        name: killSignal
        params: sub coresvc.Sub
        recv: st *step
        results: coreproc.Signal, []coreproc.Signal
      - doc: enterStopPost runs ExecStopPost=, or the final signals.
        name: enterStopPost
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          enterDead ends the run: inactive, skipped or failed, then auto-restart when
          Restart= says so and nobody asked for the stop.
        name: enterDead
        params: f coresvc.Result, allowRestart bool
        recv: st *step
      - doc: "enterRestart is the restart delay's end: an automatic start."
        name: enterRestart
        recv: st *step
      - doc: enterReload runs ExecReload=, or signals the main process.
        name: enterReload
        recv: st *step
      - doc: enterReloadByNotify is a RELOADING=1 the engine did not ask for.
        name: enterReloadByNotify
        recv: st *step
      - doc: reloadCommandsDone goes on once ExecReload= ended with f.
        name: reloadCommandsDone
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          reloadSignal sends ReloadSignal= to a notify-reload unit's main process and
          waits for RELOADING=1; any other unit has reloaded.
        name: reloadSignal
        recv: st *step
      - doc: reloadDone runs ExecReloadPost= after a successful reload, or is up again.
        name: reloadDone
        recv: st *step
      - doc: watchdogPeriod is WATCHDOG_USEC='s override, else WatchdogSec=.
        name: watchdogPeriod
        recv: st *step
        results: time.Duration
      - doc: resetWatchdog re-arms the keep-alive deadline.
        name: resetWatchdog
        recv: st *step
      - doc: |-
          forceWatchdog aborts the unit with WatchdogSignal=: a missed keep-alive,
          WATCHDOG=trigger, or Fail. It acts until the stop is under way.
        name: forceWatchdog
        recv: st *step
      - doc: whenNoControl runs next once no command runs.
        name: whenNoControl
        params: next func()
        recv: st *step
      - doc: whenNoMain runs next once the main process is gone.
        name: whenNoMain
        params: next func()
        recv: st *step
      - doc: |-
          onExit takes a process's end: the main process's, a command's, or a stale
          one's, which nothing reads — after what the shell read of the unit's group
          with it (S0g): an OOM kill first, then the population.
        name: onExit
        recv: st *step
      - doc: mainExited is service.c's main-process branch of service_sigchld_event.
        name: mainExited
        recv: st *step
      - doc: oneshotHasNext reports a oneshot whose command succeeded and has another.
        name: oneshotHasNext
        params: f coresvc.Result
        recv: st *step
        results: bool
      - doc: mainExitedStarting takes a main process that ended before the unit was up.
        name: mainExitedStarting
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          notifyMainGone fails a notify unit whose main process ended cleanly before
          READY=1, unless it remains and another process may still send it.
        name: notifyMainGone
        recv: st *step
      - doc: |-
          controlExited is service.c's control-process branch of
          service_sigchld_event.
        name: controlExited
        recv: st *step
      - doc: |-
          runningFlags are the prefixes of the command running, none when the step
          no longer runs its list.
        name: runningFlags
        recv: st *step
        results: coresvc.CommandFlags
      - doc: onOK runs next on a success, and stops the unit with f otherwise.
        name: onOK
        params: f coresvc.Result, next func()
        recv: st *step
      - doc: |-
          reloadPostDone ends a reload once ExecReloadPost= ended: its failure fails
          the reload, not the unit.
        name: reloadPostDone
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          notifyStore takes an admitted message's descriptors, after its states, its
          metadata and its watchdog (service.c's order): FDSTORE=1 keeps them, every
          one not kept is closed, then FDSTOREREMOVE=1 removes a name.
        name: notifyStore
        params: f map[string]string
        recv: st *step
      - doc: |-
          storeFiles keeps FDSTORE=1's descriptors, under FDNAME= and FDPOLL=: a
          duplicate of a stored object is dropped, one past FileDescriptorStoreMax=
          refused and counted — a unit without a store refuses every one. With
          MAINPIDFD=1 the first descriptor is the pidfd, never stored.
        name: storeFiles
        params: f map[string]string, keep []bool
        recv: st *step
      - doc: |-
          duplicate reports whether a message's i-th descriptor refers to an object
          the store holds, or repeats one before it, as the shell found it.
        name: duplicate
        params: i int
        recv: st *step
        results: bool
      - doc: closeUnkept closes every descriptor of a message the store did not keep.
        name: closeUnkept
        params: files []*os.File, keep []bool
        recv: st *step
      - doc: closeFiles asks the shell to close descriptors nobody keeps.
        name: closeFiles
        params: files []*os.File
        recv: st *step
      - doc: |-
          removeNamed is FDSTOREREMOVE=1: every descriptor stored under the name is
          closed. Without a valid FDNAME= nothing is, as systemd ignores the request.
        name: removeNamed
        params: name string
        recv: st *step
      - doc: "onHangup takes a stored descriptor's hangup or error: it leaves the store."
        name: onHangup
        recv: st *step
      - doc: dropWhere closes and forgets every stored descriptor drop selects.
        name: dropWhere
        params: drop func(storeEntry) bool
        recv: st *step
      - doc: releaseStore closes the whole store.
        name: releaseStore
        recv: st *step
      - doc: |-
          ownStore closes a store filled for a unit this one no longer is — its key
          another's, as a store restored from elsewhere may be (S0h) — counting
          every descriptor so discarded.
        name: ownStore
        recv: st *step
      - doc: |-
          handOver is what a main command is handed: the unit's own store, newest
          first, as service_collect_fds walks systemd's list.
        name: handOver
        recv: st *step
        results: "[]storeEntry"
      - doc: |-
          settleStore releases the store when FileDescriptorStorePreserve= says the
          unit is done with it: restart once it rests dead with no job and no
          restart due, on-success once it is failed for good. no is released at every
          end of a run (enterDead), yes only by Close.
        name: settleStore
        recv: st *step
      - doc: |-
          forkingStarted takes the end of a Type=forking unit's ExecStart= command:
          a failure fails the start; a clean end looks for the daemon.
        name: forkingStarted
        params: f coresvc.Result
        recv: st *step
      - doc: |-
          startPostDone goes on once ExecStartPost= succeeded: up — or, for a
          forking unit whose daemon is not found yet, after one more look.
        name: startPostDone
        recv: st *step
      - doc: |-
          findMain asks the shell for the daemon: the PID file, or the cgroup's
          members — a guess, or only whether any is left (GuessMainPID=no).
        name: findMain
        recv: st *step
      - doc: |-
          waitingForMain reports a forking unit that looks for its daemon: no main
          process, no command running, at the start or after its post-start.
        name: waitingForMain
        recv: st *step
        results: bool
      - doc: |-
          pidFileRead takes the outcome of a PID file's read: the daemon adopted, or
          — while it cannot be read — the next read armed, until TimeoutStartSec=
          ends the wait, unless ExecStartPost= may still write it or the cgroup says
          nothing is left to write it.
        name: pidFileRead
        recv: st *step
      - doc: pidFileDue reads the PID file again, if the unit still waits for it.
        name: pidFileDue
        recv: st *step
      - doc: |-
          mainGuessed takes the outcome of the cgroup's guess: the daemon adopted, or
          none found — the unit then up while its cgroup has members, as systemd's
          service_good falls back on cgroup_good.
        name: mainGuessed
        recv: st *step
      - doc: |-
          dropAdopted leaves a process an outcome adopted that nobody waits for any
          more.
        name: dropAdopted
        recv: st *step
      - doc: |-
          adoptMain makes pid the unit's main process; a former one is left running,
          no longer the unit's.
        name: adoptMain
        params: pid int
        recv: st *step
      - doc: |-
          mainFound goes on once the daemon is known, or known to be unknowable:
          ExecStartPost= after the start, up after the post-start.
        name: mainFound
        recv: st *step
      - doc: |-
          mainNeverFound fails a start whose PID file nothing is left to write: the
          result protocol, as service.c fails a daemon that never wrote it.
        name: mainNeverFound
        recv: st *step
      - doc: |-
          onNotify takes one sd_notify message (sd_notify(3)), in service.c's order:
          who may send it, MAINPID=, NOTIFYACCESS=, then the states, the metadata,
          the watchdog, the timeouts, the descriptor store.
        name: onNotify
        recv: st *step
      - doc: "admitted is NotifyAccess=: whose messages are read."
        name: admitted
        recv: st *step
        results: bool
      - doc: |-
          notifyMainPID takes MAINPID=: a new main process, adopted, refused when it
          is no process of the unit's.
        name: notifyMainPID
        params: f map[string]string
        recv: st *step
      - doc: |-
          mainPIDAcceptable reports whether pid may be the unit's main process: in
          its cgroup, or — without one — named by a privileged sender; never the
          engine, never PID 1, never one the engine cannot watch. A sandboxed unit's
          uid 0 is no privilege — root of its own user namespace, or confined —, so
          without a cgroup it names no main process (#733).
        name: mainPIDAcceptable
        params: pid int
        recv: st *step
        results: bool
      - doc: notifyAccessOverride takes NOTIFYACCESS=.
        name: notifyAccessOverride
        params: f map[string]string
        recv: st *step
      - doc: notifyStates takes RELOADING=1, READY=1 and STOPPING=1, in that order.
        name: notifyStates
        params: f map[string]string
        recv: st *step
      - doc: |-
          notifyReloading takes RELOADING=1: the answer to ReloadSignal= when it
          belongs to the reload asked for, or a reload of the unit's own.
        name: notifyReloading
        params: inCycle bool
        recv: st *step
      - doc: |-
          notifyReady takes READY=1: a notify type's start-up over, a reload over —
          or, with RELOADING=1 in the same message, a reload begun and ended.
        name: notifyReady
        params: reloadedNow bool
        recv: st *step
      - doc: "notifyStopping takes STOPPING=1: deactivating, under TimeoutStopSec=."
        name: notifyStopping
        recv: st *step
      - doc: |-
          reloadCycle reports whether a RELOADING=1 belongs to the reload the engine
          asked for: its MONOTONIC_USEC= is not before the reload began. Where the
          shell could not read CLOCK_MONOTONIC the order of the messages decides.
        name: reloadCycle
        params: f map[string]string
        recv: st *step
        results: bool
      - doc: |-
          notifyMetadata takes STATUS=, ERRNO=, BUSERROR=, VARLINKERROR= and
          EXIT_STATUS=, which only describe the unit.
        name: notifyMetadata
        params: f map[string]string
        recv: st *step
      - doc: notifyWatchdog takes WATCHDOG=1, WATCHDOG=trigger and WATCHDOG_USEC=.
        name: notifyWatchdog
        params: f map[string]string
        recv: st *step
      - doc: |-
          notifyTimeouts takes EXTEND_TIMEOUT_USEC=: the step's timeout and the
          keep-alive deadline pushed to now + the value, never earlier.
        name: notifyTimeouts
        params: f map[string]string
        recv: st *step
      - doc: emit appends one effect.
        name: emit
        params: ef *effect
        recv: st *step
      - doc: reply answers waiters with err.
        name: reply
        params: waiters []uint64, err error
        recv: st *step
      - doc: refusal is a sentinel naming the unit.
        name: refusal
        params: sentinel *errs.Error
        recv: st *step
        results: error
      - doc: publish emits the snapshot when it differs from the last one published.
        name: publish
        recv: st *step
      - doc: onStart takes a start, or a restart.
        name: onStart
        params: kind jobKind
        recv: st *step
      - doc: |-
          queueStart joins or queues a start behind the job running, and reports
          whether it did.
        name: queueStart
        params: kind jobKind, w []uint64
        recv: st *step
        results: bool
      - doc: queueBehindStop joins a restart's start half, or waits for a stop.
        name: queueBehindStop
        params: kind jobKind, w []uint64
        recv: st *step
      - doc: startNow runs a start or a restart with no job running.
        name: startNow
        params: kind jobKind, w []uint64
        recv: st *step
      - doc: activatingAlone reports a start asked of a unit starting with no job.
        name: activatingAlone
        params: kind jobKind
        recv: st *step
        results: bool
      - doc: restartsRunning reports a restart asked of a unit that runs.
        name: restartsRunning
        params: kind jobKind
        recv: st *step
        results: bool
      - doc: onStop takes a stop.
        name: onStop
        recv: st *step
      - doc: stopNow begins a stop from where the unit stands (service.c's service_stop).
        name: stopNow
        recv: st *step
      - doc: onReload takes a reload.
        name: onReload
        recv: st *step
      - doc: "onFail takes a failed health check: WATCHDOG=trigger from outside."
        name: onFail
        recv: st *step
      - doc: |-
          onResetFailed takes a reset-failed: a failed unit inactive, the restart
          counter and the start limiter flushed.
        name: onResetFailed
        recv: st *step
      - doc: |-
          onClose takes a close: the jobs canceled, then the unit stopped — or left
          running under SurviveFinalKillSignal= — and the actor ended.
        name: onClose
        recv: st *step
      - doc: |-
          settle completes the job the unit's state answers, and ends a closing unit
          with nothing left to do.
        name: settle
        recv: st *step
      - doc: |-
          instanceOver reports an instance (S0f) that ran and has no start queued:
          dead, it ends, its connection closed with it.
        name: instanceOver
        recv: st *step
        results: bool
      - doc: |-
          settleRestart begins a restart's start half once its stop half reached a
          dead state, then answers it as a start.
        name: settleRestart
        recv: st *step
      - doc: |-
          settleStart answers a start job once the unit is up, dead, failed or
          waiting to restart.
        name: settleStart
        recv: st *step
      - doc: startOutcome reports whether a start is over, and its answer.
        name: startOutcome
        recv: st *step
        results: bool, error
      - doc: |-
          startFailed is START_FAILED naming the unit, its result and — for a
          Type=forking unit that never read its PID file — why the file was refused.
          A run that failed on its sandbox keeps START_FAILED outside — its code,
          its reason, errors.Is(err, StartFailed) — and the sandbox's failure inside:
          errs.Wrap's origin is the first *Error its cause holds, so the cause is
          START_FAILED joined to the sandbox's failure, which errors.Is,
          errors.AsType and errs.HasCode reach through the join; the step or the
          feature it named is among the fields.
        name: startFailed
        recv: st *step
        results: error
      - doc: |-
          startedClean reports a start that ended without a failure: up, a oneshot
          that ran to its end, or a skipped condition.
        name: startedClean
        recv: st *step
        results: bool
      - doc: |-
          settleStop answers a stop job once the unit is dead, then starts what
          waited for it.
        name: settleStop
        recv: st *step
      - doc: |-
          settleReload answers a reload job once the unit is up again, or cancels it
          once the unit left.
        name: settleReload
        recv: st *step
      - doc: exit asks the shell to end the actor, once.
        name: exit
        recv: st *step
      - doc: onSpawned records a spawned process, or takes its spawn's failure.
        name: onSpawned
        recv: st *step
      - doc: firstOr runs first for a step's first command, then for a later one.
        name: firstOr
        params: isFirst bool, first, then func()
        recv: st *step
      - doc: |-
          preStartSpawnFailed is a condition or pre-start command that could not be
          spawned: dead at once on the first, signalled on a later one.
        name: preStartSpawnFailed
        params: first bool, r coresvc.Result
        recv: st *step
      - doc: reloadSpawnFailed fails the reload with r; the unit runs on.
        name: reloadSpawnFailed
        params: r coresvc.Result
        recv: st *step
      - doc: signalWith signals what runs, with the result r.
        name: signalWith
        params: r coresvc.Result
        recv: st *step
        results: func()
      - doc: stopWith stops the unit, with the result r.
        name: stopWith
        params: r coresvc.Result
        recv: st *step
        results: func()
      - doc: |-
          noteSandboxFailure keeps the run's first sandbox failure — its code and
          its fields, plain data — for the start's answer (startFailed).
        name: noteSandboxFailure
        params: err error
        recv: st *step
      - doc: |-
          onAttached takes an adoption's outcome: a PID file's (S0c), a guess's
          (S0c), or a MAINPID='s — and what the cgroup listed with it.
        name: onAttached
        recv: st *step
      - doc: |-
          mainPIDAttached takes a MAINPID= adoption: the new main process, or a
          refusal, counted.
        name: mainPIDAttached
        recv: st *step
      - doc: onTimer takes a timer's fire, unless a later arming made it stale.
        name: onTimer
        recv: st *step
      - doc: "startTimedOut is a start step that timed out: TimeoutStartFailureMode=."
        name: startTimedOut
        recv: st *step
      - doc: |-
          reloadTimedOut is a reload that timed out: its command killed, the reload
          failed, the unit running on.
        name: reloadTimedOut
        recv: st *step
      - doc: |-
          sigtermTimedOut is the terminate that did not end the unit: the abort, or
          the final kill.
        name: sigtermTimedOut
        recv: st *step
      - doc: "stopPostTimedOut is ExecStopPost= that timed out: TimeoutStopFailureMode=."
        name: stopPostTimedOut
        recv: st *step
      - doc: finalSigtermTimedOut is the final terminate that did not end what was left.
        name: finalSigtermTimedOut
        recv: st *step
      - doc: |-
          failureMode enters the stop step a failure mode names, with the result
          timeout.
        name: failureMode
        params: mode coresvc.TimeoutMode
        recv: st *step
      - doc: killOrPost is the stop's final kill, or the post-stop without one.
        name: killOrPost
        params: f coresvc.Result
        recv: st *step
      - doc: finalKillOrDead is the last kill, or dead without one.
        name: finalKillOrDead
        params: f coresvc.Result
        recv: st *step
    name: step
  - doc: |-
      subscription is one consumer's queue: the actor offers it every event and
      never waits on it.
    fields:
      - name: ch
        type: chan coresvc.EventValue
      - doc: once closes ch, whoever ends the subscription first.
        name: once
        type: sync.Once
    kind: struct
    methods:
      - doc: close closes the subscription's channel, once.
        name: close
        recv: s *subscription
    name: subscription
  - doc: resultBits is a set of results, one bit each.
    kind: named
    name: resultBits
    underlying: uint16
  - doc: |-
      sandboxRefusal is a check of the sandbox directives: when bad, the
      directive and the value it refuses, CONFIG_INVALID unless why names what an
      unsupported value lacks.
    fields:
      - name: directive
        type: string
      - name: value
        type: string
      - name: why
        type: string
      - name: bad
        type: bool
    kind: struct
    name: sandboxRefusal
  - doc: |-
      keyWriter spells values for a key: each one length-prefixed, so no two
      sequences of values spell alike.
    fields:
      - name: b
        type: strings.Builder
    kind: struct
    methods:
      - doc: str writes strings.
        name: str
        params: vs ...string
        recv: w *keyWriter
      - doc: num writes numbers.
        name: num
        params: vs ...uint64
        recv: w *keyWriter
      - doc: flag writes booleans.
        name: flag
        params: vs ...bool
        recv: w *keyWriter
    name: keyWriter
  - doc: list names an Exec*= list; the reducer runs one at a time.
    kind: named
    name: list
    underlying: uint8
  - doc: settingFlag is one of the settings' booleans, as a bit.
    kind: named
    name: settingFlag
    underlying: uint16
  - doc: |-
      settings is a Config resolved and checked: every default applied, every
      duration either finite or coresvc.Infinity. The reducer reads it and
      nothing else of the configuration; it never changes once New returned.
      sandbox is every command's sandbox — the template's with the directives'
      —, sandboxAway the one of every command but ExecStart='s under
      RootDirectoryStartOnly=: plain values, built once, never written to.
    fields:
      - name: sandbox
        type: "*coreproc.SandboxValue"
      - name: sandboxAway
        type: "*coreproc.SandboxValue"
      - name: lists
        type: "[listCount][]coresvc.CommandValue"
      - name: success
        type: coresvc.ExitStatusValue
      - name: prevent
        type: coresvc.ExitStatusValue
      - name: force
        type: coresvc.ExitStatusValue
      - name: name
        type: string
      - name: socket
        type: string
      - name: shell
        type: string
      - name: pidFile
        type: string
      - name: storeKey
        type: string
      - name: cgroupPath
        type: string
      - name: busName
        type: string
      - name: restartDelay
        type: time.Duration
      - name: restartMax
        type: time.Duration
      - name: restartJitter
        type: time.Duration
      - name: timeoutStart
        type: time.Duration
      - name: timeoutStop
        type: time.Duration
      - name: timeoutAbort
        type: time.Duration
      - name: runtimeMax
        type: time.Duration
      - name: runtimeJitter
        type: time.Duration
      - name: watchdog
        type: time.Duration
      - name: limitInterval
        type: time.Duration
      - name: limitBurst
        type: int
      - name: restartSteps
        type: int
      - name: storeMax
        type: int
      - name: selfPID
        type: int
      - name: killSignal
        type: coreproc.Signal
      - name: restartKillSignal
        type: coreproc.Signal
      - name: finalKillSignal
        type: coreproc.Signal
      - name: watchdogSig
        type: coreproc.Signal
      - name: reloadSignal
        type: coreproc.Signal
      - name: sigcont
        type: coreproc.Signal
      - name: sighup
        type: coreproc.Signal
      - name: typ
        type: coresvc.Type
      - name: restart
        type: coresvc.Restart
      - name: restartMode
        type: coresvc.RestartMode
      - name: startMode
        type: coresvc.TimeoutMode
      - name: stopMode
        type: coresvc.TimeoutMode
      - name: notifyAccess
        type: coresvc.NotifyAccess
      - name: killMode
        type: coresvc.KillMode
      - name: exitType
        type: coresvc.ExitType
      - name: oomPolicy
        type: coresvc.OOMPolicy
      - name: preserve
        type: coresvc.Preserve
      - name: flags
        type: settingFlag
    kind: struct
    methods:
      - doc: |-
          sandboxFor is the sandbox a command of list l runs in: ExecStart='s, or
          every command's but under RootDirectoryStartOnly=.
        name: sandboxFor
        params: l list
        recv: s *settings
        results: "*coreproc.SandboxValue"
      - doc: on reports whether flag f is set.
        name: "on"
        params: f settingFlag
        recv: s *settings
        results: bool
      - doc: put sets flag f when on is true.
        name: put
        params: f settingFlag, on bool
        recv: s *settings
    name: settings
  - doc: |-
      splitter is splitWords' state: the words so far, the one being read, and
      the quote it is inside.
    fields:
      - name: words
        type: "[]string"
      - name: cur
        type: strings.Builder
      - name: quote
        type: byte
      - name: open
        type: bool
    kind: struct
    methods:
      - doc: take reads one byte.
        name: take
        params: c byte
        recv: sp *splitter
      - doc: quoted reads a byte inside quotes.
        name: quoted
        params: c byte
        recv: sp *splitter
      - doc: flush ends the word being read, if any.
        name: flush
        recv: sp *splitter
    name: splitter
  - doc: |-
      execSpawner is the default Spawner: proc/exec's Start, which returns once
      the program was executed.
    kind: struct
    methods:
      - doc: Spawn starts spec with proc/exec.
        name: Spawn
        params: ctx context.Context, spec coreproc.Spec
        recv: execSpawner
        results: coreproc.Process, error
    name: execSpawner
  - doc: execAttacher is NewAttacher's Attacher.
    fields:
      - name: scope
        type: coreproc.AttachValue
    kind: struct
    methods:
      - doc: AttachPID adopts pid with exec.Attach.
        name: AttachPID
        params: ctx context.Context, pid int
        recv: execAttacher
        results: coreproc.Process, error
      - doc: AttachPIDFile reads path with exec.AttachPIDFile, bounded by the scope.
        name: AttachPIDFile
        params: ctx context.Context, path string
        recv: a execAttacher
        results: coreproc.Process, error
    name: execAttacher
  - doc: listenerSource adapts proc/systemd's Listener to a NotifySource.
    fields:
      - name: l
        type: coreproc.Listener
      - name: socket
        type: string
    kind: struct
    methods:
      - doc: Socket is the socket's path.
        name: Socket
        recv: s *listenerSource
        results: string
      - doc: |-
          Recv returns the next datagram. ctx is read before the wait: the wait ends
          with Close. A datagram the listener refused — malformed, out of bounds,
          unattributed — is returned unverified, which the engine counts as refused:
          a service sending garbage cannot end the reader by failing its Recv.
        name: Recv
        params: ctx context.Context
        recv: s *listenerSource
        results: coresvc.NotifyValue, error
      - doc: Close releases the socket and ends a Recv in flight.
        name: Close
        recv: s *listenerSource
        results: error
    name: listenerSource
  - fields:
      - doc: |-
          ctx is the unit's own context — never a caller's: every spawn and the
          notification reader run on it, so a stop escalates on its own deadlines
          (ADR 0214 §7). Close cancels it once the actor ended.
        name: ctx
        type: context.Context
      - name: cancel
        type: context.CancelFunc
      - name: cfg
        type: "*Config"
      - name: s
        type: "*settings"
      - name: clock
        type: coresvc.Clock
      - name: spawn
        type: coresvc.Spawner
      - doc: inbox carries every event to the actor; done closes when it ended.
        name: inbox
        type: chan event
      - name: done
        type: chan struct{}
      - doc: waiters are the callers waiting for a job, by id. Guarded by mu.
        name: waiters
        type: map[uint64]chan error
      - doc: subs are the subscriptions. Guarded by mu.
        name: subs
        type: map[*subscription]struct{}
      - doc: snap is the last snapshot published. Guarded by mu.
        name: snap
        type: coresvc.StateValue
      - doc: stored is the store's listing, newest first. Guarded by mu.
        name: stored
        type: "[]coresvc.StoredFDValue"
      - doc: |-
          conn is an instance's connection (S0f), which the unit owns and closes
          at its end; nil for any other unit.
        name: conn
        type: "*os.File"
      - doc: |-
          restoring is what Resume's actor starts from (S0h); frozen what
          Freeze's actor left. Guarded by mu once the actor runs.
        name: restoring
        type: "*restoring"
      - name: frozen
        type: "*frozenUnit"
      - doc: readers joins the notification reader and the actor's end.
        name: readers
        type: sync.WaitGroup
      - doc: doneOnce closes done.
        name: doneOnce
        type: sync.Once
      - doc: |-
          dropped counts the events the subscriptions dropped; nextID numbers
          the waiters. Guarded by mu.
        name: dropped
        type: uint64
      - doc: |-
          dropped counts the events the subscriptions dropped; nextID numbers
          the waiters. Guarded by mu.
        name: nextID
        type: uint64
      - name: mu
        type: sync.Mutex
      - doc: |-
          closed is set once Close was called; ended once the unit's end is
          complete, its subscriptions closed. Guarded by mu.
        name: closed
        type: bool
      - doc: |-
          closed is set once Close was called; ended once the unit's end is
          complete, its subscriptions closed. Guarded by mu.
        name: ended
        type: bool
    kind: struct
    methods:
      - doc: run is the actor's goroutine.
        name: run
        params: s *settings
        recv: u *Unit
      - doc: |-
          forwardGroup posts every state the watch publishes to the actor, and a
          last event once the watch ended while the unit runs.
        name: forwardGroup
        params: states <-chan coreproc.GroupEventsValue
        recv: u *Unit
      - doc: |-
          forwardBus posts every owner the watch announces to the actor, then the
          watch's end. Once the actor ended it drains the channel, so a watcher never
          waits on it, until the watcher closes it with the unit's ctx.
        name: forwardBus
        params: owners <-chan string
        recv: u *Unit
      - doc: |-
          freeze asks the actor to freeze the unit and waits for its end. Once the
          request is posted it is not withdrawn: a unit whose processes the actor
          forgot must reach the hand-over.
        name: freeze
        params: ctx context.Context
        recv: u *Unit
        results: "*frozenUnit, error"
      - name: Subscribe
        params: capacity int
        recv: u *Unit
        results: events <-chan coresvc.EventValue, cancel func()
      - doc: |-
          unsubscribe ends one subscription: out of the unit's set, under the lock
          publish holds, then closed — so no event is offered to a closed channel.
        name: unsubscribe
        params: sub *subscription
        recv: u *Unit
      - doc: |-
          publish records a snapshot and offers its event to every subscription,
          never waiting: a full queue drops the event and counts it. A subscription
          is offered events only while it is in the set, which unsubscribe leaves
          under the same lock before it closes the channel.
        name: publish
        params: snap *coresvc.StateValue, prev coresvc.State, prevSub coresvc.Sub
        recv: u *Unit
      - doc: |-
          closeSubscriptions closes every subscription at the unit's end, the last
          of it: a subscription closed says everything the unit held is released.
        name: closeSubscriptions
        recv: u *Unit
      - name: Start
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: Stop
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: Restart
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: Reload
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: Fail
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: ResetFailed
        params: ctx context.Context
        recv: u *Unit
        results: error
      - name: State
        recv: u *Unit
        results: coresvc.StateValue
      - name: FDStore
        recv: u *Unit
        results: "[]coresvc.StoredFDValue"
      - name: Close
        params: ctx context.Context
        recv: u *Unit
        results: error
      - doc: request sends a caller's request, refused once the unit is closed.
        name: request
        params: ctx context.Context, kind eventKind
        recv: u *Unit
        results: error
      - doc: send posts a request and waits for its answer, within ctx.
        name: send
        params: ctx context.Context, kind eventKind
        recv: u *Unit
        results: error
      - doc: endAnswer is the answer of a request the actor's end overtook.
        name: endAnswer
        params: kind eventKind, answer chan error
        recv: u *Unit
        results: error
      - doc: forgetWaiter drops a waiter, answered or not.
        name: forgetWaiter
        params: id uint64
        recv: u *Unit
      - doc: answer sends err to the waiters still waiting.
        name: answer
        params: ids []uint64, err error
        recv: u *Unit
      - doc: post hands an event to the actor, or drops it once the actor ended.
        name: post
        params: ev *event
        recv: u *Unit
        results: bool
      - doc: readNotify reads the unit's notifications until Close.
        name: readNotify
        params: src coresvc.NotifySource
        recv: u *Unit
    name: Unit
vars:
  - doc: |-
      appliers do each effect, by kind; one whose outcome the reducer must know
      returns it as an event, and true.
    items:
      - name: appliers
        value: |-
          [...]func(a *actor, ef *effect) (event, bool){
          	efSpawn:      func(a *actor, ef *effect) (event, bool) { return a.spawnCommand(ef), true },
          	efAttach:     func(a *actor, ef *effect) (event, bool) { return a.attach(ef.pid), true },
          	efAttachFile: func(a *actor, _ *effect) (event, bool) { return a.attachFile(), true },
          	efGuess:      func(a *actor, ef *effect) (event, bool) { return a.guessMain(ef.has(optGuess)), true },
          	efSignal:     (*actor).signal,
          	efArm:        (*actor).arm,
          	efDisarm:     func(a *actor, ef *effect) (event, bool) { a.stopTimer(ef.timer); return event{}, false },
          	efReply:      func(a *actor, ef *effect) (event, bool) { a.u.answer(ef.waiters, ef.err); return event{}, false },
          	efClose:      func(_ *actor, ef *effect) (event, bool) { closeFiles(ef.files); return event{}, false },
          	efStore:      func(a *actor, ef *effect) (event, bool) { a.keep(ef); return event{}, false },
          	efStoreDrop:  func(a *actor, ef *effect) (event, bool) { a.drop(ef.entries); return event{}, false },
          	efForget:     func(a *actor, ef *effect) (event, bool) { delete(a.procs, ef.pid); return event{}, false },
          	efPublish: func(a *actor, ef *effect) (event, bool) {
          		a.u.publish(&ef.snap, ef.prevState, ef.prevSub)
          		return event{}, false
          	},
          	efExit:        (*actor).end,
          	efSignalGroup: func(a *actor, ef *effect) (event, bool) { return a.signalGroup(ef), true },
          	efPrune:       func(a *actor, _ *effect) (event, bool) { a.prune(); return event{}, false },
          }
    name: appliers
  - grouped: true
    items:
      - doc: |-
          mainExits are what a step does once its main process ended with f;
          a step with no row waits for its command. A Type=dbus unit awaiting
          its name (S0e) reads as running.
        name: mainExits
        value: |-
          map[coresvc.Sub]func(st *step, f coresvc.Result){
          		coresvc.SubStart:               (*step).mainExitedStarting,
          		coresvc.SubRunning:             (*step).enterRunning,
          		coresvc.SubRunningRevalidating: (*step).enterRunning,
          		coresvc.SubStopWatchdog:        func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopSigterm:         func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopSigkill:         func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopPost: func(st *step, f coresvc.Result) {
          			st.whenNoControl(func() { st.enterSignal(coresvc.SubFinalSigterm, f) })
          		},
          		coresvc.SubFinalWatchdog: func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterDead(f, true) }) },
          		coresvc.SubFinalSigterm:  func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterDead(f, true) }) },
          		coresvc.SubFinalSigkill:  func(st *step, f coresvc.Result) { st.whenNoControl(func() { st.enterDead(f, true) }) },
          	}
      - doc: controlDone are what a step does once its commands ended with f.
        name: controlDone
        value: |-
          map[coresvc.Sub]func(st *step, f coresvc.Result){
          		coresvc.SubCondition:     func(st *step, f coresvc.Result) { st.onOK(f, st.enterStartPre) },
          		coresvc.SubStartPre:      func(st *step, f coresvc.Result) { st.onOK(f, st.enterStart) },
          		coresvc.SubStart:         (*step).forkingStarted,
          		coresvc.SubStartPost:     func(st *step, f coresvc.Result) { st.onOK(f, st.startPostDone) },
          		coresvc.SubReload:        (*step).reloadCommandsDone,
          		coresvc.SubReloadPost:    (*step).reloadPostDone,
          		coresvc.SubStop:          func(st *step, f coresvc.Result) { st.enterSignal(coresvc.SubStopSigterm, f) },
          		coresvc.SubStopWatchdog:  func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopSigterm:   func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopSigkill:   func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterStopPost(f) }) },
          		coresvc.SubStopPost:      func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterSignal(coresvc.SubFinalSigterm, f) }) },
          		coresvc.SubFinalWatchdog: func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterDead(f, true) }) },
          		coresvc.SubFinalSigterm:  func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterDead(f, true) }) },
          		coresvc.SubFinalSigkill:  func(st *step, f coresvc.Result) { st.whenNoMain(func() { st.enterDead(f, true) }) },
          	}
    name: mainExits
  - doc: unitFields reads each of a unit's records into ref.
    items:
      - name: unitFields
        value: |-
          map[uint16]func(ref *unitRefs, r *reader, v []byte){
          	uName:   func(ref *unitRefs, _ *reader, v []byte) { ref.fu.name = string(v) },
          	uModel:  func(ref *unitRefs, _ *reader, v []byte) { ref.fu.model = slices.Clone(v) },
          	uProc:   func(ref *unitRefs, r *reader, v []byte) { ref.addProc(r, v) },
          	uStore:  func(ref *unitRefs, r *reader, v []byte) { ref.addStored(r, v) },
          	uConn:   func(ref *unitRefs, r *reader, v []byte) { ref.conn, ref.hasConn = r.int(v), true },
          	uNotify: func(ref *unitRefs, r *reader, v []byte) { ref.notify, ref.hasNotif = r.int(v), true },
          	uSocket: func(ref *unitRefs, _ *reader, v []byte) { ref.fu.socket = string(v) },
          }
    name: unitFields
  - doc: "The record tables: what each tag writes into the value being read."
    grouped: true
    items:
      - doc: modelFields reads each of the model's scalar records into m.
        name: modelFields
        value: |-
          map[uint16]func(r *reader, m *model, v []byte){
          		mChanged:          func(r *reader, m *model, v []byte) { m.changed = r.at(v) },
          		mLimitBegin:       func(r *reader, m *model, v []byte) { m.limitBegin = r.at(v) },
          		mRuntimeAt:        func(r *reader, m *model, v []byte) { m.runtimeAt = r.at(v) },
          		mRevalidateBegin:  func(r *reader, m *model, v []byte) { m.revalidateBegin = r.at(v) },
          		mDeadlineState:    func(r *reader, m *model, v []byte) { m.deadlines[timerState] = r.at(v) },
          		mDeadlineWatchdog: func(r *reader, m *model, v []byte) { m.deadlines[timerWatchdog] = r.at(v) },
          		mDeadlinePIDFile:  func(r *reader, m *model, v []byte) { m.deadlines[timerPIDFile] = r.at(v) },
          		mPublishedAt:      func(r *reader, m *model, v []byte) { m.published.At = r.at(v) },
          		mStatus:           func(_ *reader, m *model, v []byte) { m.status = string(v) },
          		mBusError:         func(_ *reader, m *model, v []byte) { m.busError = string(v) },
          		mVarlinkError:     func(_ *reader, m *model, v []byte) { m.varlinkError = string(v) },
          		mExitStatusText:   func(_ *reader, m *model, v []byte) { m.exitStatusText = string(v) },
          		mPIDFileCause:     func(_ *reader, m *model, v []byte) { m.pidFileCause = string(v) },
          		mJob:              func(r *reader, m *model, v []byte) { m.job = decodeJob(r, v) },
          		mPending:          func(r *reader, m *model, v []byte) { m.pending = decodeJob(r, v) },
          		mStoreEntry:       func(r *reader, m *model, v []byte) { m.store = append(m.store, decodeEntry(r, v)) },
          		mStoreKey:         func(_ *reader, m *model, v []byte) { m.storeKey = string(v) },
          		mSandboxField:     func(r *reader, m *model, v []byte) { m.sandboxFields = append(m.sandboxFields, decodeField(r, v)) },
          		mSandboxCause:     func(r *reader, m *model, v []byte) { m.sandboxCause = errs.Code(r.u64(v)) },
          		mMainExit:         func(r *reader, m *model, v []byte) { m.mainExit = decodeExit(r, v) },
          		mSeqState:         func(r *reader, m *model, v []byte) { m.seq[timerState] = r.u64(v) },
          		mSeqWatchdog:      func(r *reader, m *model, v []byte) { m.seq[timerWatchdog] = r.u64(v) },
          		mSeqPIDFile:       func(r *reader, m *model, v []byte) { m.seq[timerPIDFile] = r.u64(v) },
          		mGeneration:       func(r *reader, m *model, v []byte) { m.generation = r.u64(v) },
          		mNotifyRefused:    func(r *reader, m *model, v []byte) { m.notifyRefused = r.u64(v) },
          		mReloadBegin:      func(r *reader, m *model, v []byte) { m.reloadBegin = r.u64(v) },
          		mStoreSeq:         func(r *reader, m *model, v []byte) { m.storeSeq = r.u64(v) },
          		mStoreRefused:     func(r *reader, m *model, v []byte) { m.storeRefused = r.u64(v) },
          		mStoreDiscarded:   func(r *reader, m *model, v []byte) { m.storeDiscarded = r.u64(v) },
          		mWatchdogPeriod:   func(r *reader, m *model, v []byte) { m.watchdogPeriod = time.Duration(r.i64(v)) },
          		mMainPID:          func(r *reader, m *model, v []byte) { m.mainPID = r.int(v) },
          		mControlPID:       func(r *reader, m *model, v []byte) { m.controlPID = r.int(v) },
          		mCmd:              func(r *reader, m *model, v []byte) { m.cmd = r.int(v) },
          		mErrno:            func(r *reader, m *model, v []byte) { m.errno = r.int(v) },
          		mLimitCount:       func(r *reader, m *model, v []byte) { m.limitCount = r.int(v) },
          		mRestarts:         func(r *reader, m *model, v []byte) { m.restarts = uint32(r.u64(v)) },
          		mState:            func(r *reader, m *model, v []byte) { m.state = coresvc.State(r.u64(v)) },
          		mSub:              func(r *reader, m *model, v []byte) { m.sub = coresvc.Sub(r.u64(v)) },
          		mResult:           func(r *reader, m *model, v []byte) { m.result = coresvc.Result(r.u64(v)) },
          		mReloadResult:     func(r *reader, m *model, v []byte) { m.reloadResult = coresvc.Result(r.u64(v)) },
          		mNotifyAccess:     func(r *reader, m *model, v []byte) { m.notifyAccess = coresvc.NotifyAccess(r.u64(v)) },
          		mNotify:           func(r *reader, m *model, v []byte) { m.notify = notifyState(r.u64(v)) },
          		mList:             func(r *reader, m *model, v []byte) { m.list = list(r.u64(v)) },
          		mMainFlags:        func(r *reader, m *model, v []byte) { m.mainFlags = coresvc.CommandFlags(r.u64(v)) },
          		mFlags:            func(r *reader, m *model, v []byte) { m.flags = modelFlag(r.u64(v)) },
          	}
      - doc: exitFields reads each of an exit's records into x.
        name: exitFields
        value: |-
          map[uint16]func(x *coreproc.ExitValue, r *reader, v []byte){
          		xCode:     func(x *coreproc.ExitValue, r *reader, v []byte) { x.Code = r.int(v) },
          		xSignal:   func(x *coreproc.ExitValue, r *reader, v []byte) { x.Signal = coreproc.Signal(r.int(v)) },
          		xSignaled: func(x *coreproc.ExitValue, r *reader, v []byte) { x.Signaled = r.u64(v) != 0 },
          		xUser:     func(x *coreproc.ExitValue, r *reader, v []byte) { x.UserTime = time.Duration(r.i64(v)) },
          		xSystem:   func(x *coreproc.ExitValue, r *reader, v []byte) { x.SystemTime = time.Duration(r.i64(v)) },
          		xMaxRSS:   func(x *coreproc.ExitValue, r *reader, v []byte) { x.MaxRSS = r.i64(v) },
          		xCore:     func(x *coreproc.ExitValue, r *reader, v []byte) { x.CoreDumped = r.u64(v) != 0 },
          		xUsage:    func(x *coreproc.ExitValue, r *reader, v []byte) { x.Usage = decodeUsage(r, v) },
          	}
    name: modelFields
  - doc: notifyAccessNames reads NOTIFYACCESS=.
    items:
      - name: notifyAccessNames
        value: |-
          map[string]coresvc.NotifyAccess{
          	"none": coresvc.NotifyAccessNone, "main": coresvc.NotifyAccessMain,
          	"exec": coresvc.NotifyAccessExec, "all": coresvc.NotifyAccessAll,
          }
    name: notifyAccessNames
  - grouped: true
    items:
      - doc: handlers are the reducer's branch for each kind of event.
        name: handlers
        value: |-
          [...]func(*step){
          		evStart:       func(st *step) { st.onStart(jobStart) },
          		evStop:        (*step).onStop,
          		evRestart:     func(st *step) { st.onStart(jobRestart) },
          		evReload:      (*step).onReload,
          		evFail:        (*step).onFail,
          		evResetFailed: (*step).onResetFailed,
          		evClose:       (*step).onClose,
          		evSpawned:     (*step).onSpawned,
          		evExit:        (*step).onExit,
          		evTimer:       (*step).onTimer,
          		evNotify:      (*step).onNotify,
          		evAttached:    (*step).onAttached,
          		evHangup:      (*step).onHangup,
          		evCgroup:      (*step).onCgroup,
          		evSignaled:    (*step).onSignaled,
          		evBusName:     (*step).onBusName,
          	}
      - doc: settlers complete the job of each kind the unit's state answers.
        name: settlers
        value: |-
          [...]func(*step){
          		jobNone:    func(*step) {},
          		jobStart:   (*step).settleStart,
          		jobStop:    (*step).settleStop,
          		jobRestart: (*step).settleRestart,
          		jobReload:  (*step).settleReload,
          	}
    name: handlers
  - doc: |-
      The re-exec's test seams (export_internal_test): the version reexec
      writes, and a look at the payload once it is written and before it reaches
      the image — what a racing writer or a bad image would leave.
    grouped: true
    items:
      - name: versionSeam
        type: func() uint16
        value: func() uint16 { return handoverVersion }
      - name: tamperPayload
        type: func(payload []byte)
        value: func([]byte) {}
    name: versionSeam
  - grouped: true
    items:
      - doc: "cleanSignals end a daemon cleanly: it has no handler for them."
        name: cleanSignals
        value: "[]coreproc.Signal{sigHUP, sigINT, sigTERM, sigPIPE}"
      - doc: |-
          skips are the ends no policy restarts: a skipped condition and a start
          the limiter refused.
        name: skips
        value: bit(coresvc.ResultExecCondition) | bit(coresvc.ResultStartLimitHit)
      - doc: unclean are the ends that are neither a success nor a skip.
        name: unclean
        value: ^(bit(coresvc.ResultSuccess) | skips)
      - doc: |-
          table1 is Table 1 of systemd.service(5): the results each Restart=
          policy restarts after, by policy.
        name: table1
        value: |-
          [...]resultBits{
          		coresvc.RestartNo:         0,
          		coresvc.RestartOnSuccess:  bit(coresvc.ResultSuccess),
          		coresvc.RestartOnFailure:  unclean,
          		coresvc.RestartOnAbnormal: unclean &^ bit(coresvc.ResultExitCode),
          		coresvc.RestartOnWatchdog: bit(coresvc.ResultWatchdog),
          		coresvc.RestartOnAbort:    bit(coresvc.ResultSignal) | bit(coresvc.ResultCoreDump),
          		coresvc.RestartAlways:     ^skips,
          	}
    name: cleanSignals
  - grouped: true
    items:
      - doc: |-
          sandboxPlatform reports whether proc/exec applies a sandbox here: Linux on
          amd64 and arm64 (ADR 0217's S2 amendment); a test plays another.
        name: sandboxPlatform
        type: func() bool
        value: |-
          func() bool {
          		//: the two architectures whose system call tables S2 carries.
          		return runtime.GOOS == osLinux && (runtime.GOARCH == "amd64" || runtime.GOARCH == "arm64")
          	}
      - doc: supervisorEUID is the supervisor's effective uid; a test plays another.
        name: supervisorEUID
        type: func() int
        value: os.Geteuid
      - doc: |-
          protectedSystem are ProtectSystem='s trees, by level: yes's, then full's
          /etc; the ones a host may lack are mounted only where they exist.
        name: protectedSystem
        value: |-
          []struct {
          		path     string
          		level    coresvc.ProtectSystem
          		optional bool
          	}{
          		{"/usr", coresvc.ProtectSystemYes, false},
          		{"/boot", coresvc.ProtectSystemYes, true},
          		{"/efi", coresvc.ProtectSystemYes, true},
          		{"/etc", coresvc.ProtectSystemFull, false},
          	}
      - doc: privateTmpDirs are the directories PrivateTmp= gives a tmpfs of their own.
        name: privateTmpDirs
        value: "[]string{\"/tmp\", \"/var/tmp\"}"
    name: sandboxPlatform
  - doc: listDirectives names each list's directive, for errors.
    items:
      - name: listDirectives
        value: "[listCount]string{\"\", \"ExecCondition\", \"ExecStartPre\", \"ExecStart\", \"ExecStartPost\", \"ExecReload\", \"ExecReloadPost\", \"ExecStop\", \"ExecStopPost\"}"
    name: listDirectives
  - grouped: true
    items:
      - doc: |-
          spawnFailures are what a step does when its command cannot be spawned
          (service.c's "fail:" paths), by list; first is the step's first command,
          r the result the failure ends the run with (spawnResult).
        name: spawnFailures
        value: |-
          [listCount]func(st *step, first bool, r coresvc.Result){
          		listCondition:  (*step).preStartSpawnFailed,
          		listStartPre:   (*step).preStartSpawnFailed,
          		listStart:      func(st *step, first bool, r coresvc.Result) { st.firstOr(first, st.signalWith(r), st.stopWith(r)) },
          		listStartPost:  func(st *step, first bool, r coresvc.Result) { st.firstOr(first, st.stopWith(r), st.signalWith(r)) },
          		listReload:     func(st *step, _ bool, r coresvc.Result) { st.reloadSpawnFailed(r) },
          		listReloadPost: func(st *step, _ bool, r coresvc.Result) { st.reloadSpawnFailed(r) },
          		listStop:       func(st *step, _ bool, r coresvc.Result) { st.signalWith(r)() },
          		listStopPost: func(st *step, first bool, r coresvc.Result) {
          			st.firstOr(first, func() { st.enterSignal(coresvc.SubFinalSigterm, r) }, func() { st.enterDead(r, true) })
          		},
          	}
      - doc: |-
          sandboxCodes are the sandbox's failures a start reports by their code
          (S2): a step that failed in the child, a part the kernel lacks.
        name: sandboxCodes
        value: "[...]errs.Code{coreproc.CodeSandboxFailed, coreproc.CodeSandboxUnavailable}"
    name: spawnFailures
  - doc: |-
      timeouts are what a step does when its timer fires (service.c's
      service_dispatch_timer); every row's result is timeout, but a Type=dbus
      unit's grace (S0e): its name still not owned, it is exited or stopped
      (service_dispatch_bus_name_grace).
    items:
      - name: timeouts
        value: |-
          map[coresvc.Sub]func(st *step){
          	coresvc.SubCondition:           (*step).startTimedOut,
          	coresvc.SubStartPre:            (*step).startTimedOut,
          	coresvc.SubStart:               (*step).startTimedOut,
          	coresvc.SubStartPost:           (*step).startTimedOut,
          	coresvc.SubRunning:             func(st *step) { st.enterStop(coresvc.ResultTimeout) },
          	coresvc.SubReload:              (*step).reloadTimedOut,
          	coresvc.SubReloadSignal:        (*step).reloadTimedOut,
          	coresvc.SubReloadNotify:        (*step).reloadTimedOut,
          	coresvc.SubReloadPost:          (*step).reloadTimedOut,
          	coresvc.SubStop:                func(st *step) { st.failureMode(st.m.s.stopMode) },
          	coresvc.SubStopWatchdog:        func(st *step) { st.killOrPost(coresvc.ResultTimeout) },
          	coresvc.SubStopSigterm:         (*step).sigtermTimedOut,
          	coresvc.SubStopSigkill:         func(st *step) { st.enterStopPost(coresvc.ResultTimeout) },
          	coresvc.SubStopPost:            (*step).stopPostTimedOut,
          	coresvc.SubFinalWatchdog:       func(st *step) { st.finalKillOrDead(coresvc.ResultTimeout) },
          	coresvc.SubFinalSigterm:        (*step).finalSigtermTimedOut,
          	coresvc.SubFinalSigkill:        func(st *step) { st.enterDead(coresvc.ResultTimeout, true) },
          	coresvc.SubAutoRestart:         (*step).enterRestart,
          	coresvc.SubRunningRevalidating: (*step).exitedOrStop,
          }
    name: timeouts
