functions:
  - doc: belongs reports whether pid is a process of the cgroup; an error is "no".
    name: belongs
    params: cg coresvc.CgroupKill, pid int
    results: bool
  - doc: reasonOf is an error's reason ("PID_FILE_REFUSED"), empty when it has none.
    name: reasonOf
    params: err error
    results: string
  - doc: waitEvent waits for a process's end and makes it an event.
    name: waitEvent
    params: p coreproc.Process
    results: event
  - doc: |-
      dropPosted closes the descriptors of the notifications posted before the
      actor ended, which nobody takes now.
    name: dropPosted
    params: inbox chan event
  - doc: |-
      closeFiles closes descriptors nobody keeps; a descriptor that fails to
      close is gone all the same.
    name: closeFiles
    params: files []*os.File
  - doc: |-
      gone takes an error the engine cannot act on: a signal to a process that
      ended, a descriptor or a socket that is closed whatever the close says.
    name: gone
    params: err error
  - doc: |-
      delegateIDs resolves the user and the group spec runs as into the ids
      Delegate= hands the group to: -1 for the supervisor's own (chown(2)'s
      "unchanged"), the user's primary group when spec names none.
    name: delegateIDs
    params: spec *coreproc.Spec
    results: uid, gid int, err error
  - doc: |-
      lookupUser resolves a user name or numeric uid; a numeric uid with no
      entry is itself, its group left (-1).
    name: lookupUser
    params: name string
    results: account, error
  - doc: accountOf reads a user entry's ids.
    name: accountOf
    params: u *user.User
    results: account, error
  - doc: lookupGroup resolves a group name or numeric gid.
    name: lookupGroup
    params: name string
    results: int, error
  - doc: |-
      describe is what Unit.FDStore lists of a stored descriptor: its name and
      what fstat read of it, when it could.
    name: describe
    params: name string, info os.FileInfo
    results: coresvc.StoredFDValue
  - doc: |-
      activation reads the sockets a spec already activates — its first
      LISTEN_FDS ExtraFiles, named by LISTEN_FDNAMES (listen.Prepare's) — so a
      hand-over follows them and LISTEN_FDS counts every one; a malformed count
      is no activation.
    name: activation
    params: spec *coreproc.Spec
    results: "[]listen.NamedFileValue"
  - doc: |-
      resolveCgroup resolves the directives that run on the unit's control group
      (S0g, kitsunium/sdk#734): KillMode= — control-group by default with a
      CgroupUnit, process without —, ExitType=, Delegate=, OOMPolicy=, and the
      group every process of the unit is spawned into. Without a CgroupUnit each
      of them but its default is refused, naming the directive.
    name: resolveCgroup
    params: cfg *Config, s *settings
    results: error
  - doc: withoutUnit refuses the first directive set that needs a CgroupUnit.
    name: withoutUnit
    params: cfg *Config
    results: error
  - doc: |-
      resolveCgroupPath makes the unit's group the CgroupPath of every spawn
      whose template names none; one the template names must lie within the
      group — a group the service is placed in beneath it, as systemd's
      DelegateSubgroup= — or a stop would signal and watch a group the processes
      are not in.
    name: resolveCgroupPath
    params: cfg *Config, s *settings, dir string
    results: error
  - doc: withinGroup reports whether path is the group dir or a group beneath it.
    name: withinGroup
    params: dir, named string
    results: bool
  - doc: |-
      defaultType is TypeDefault resolved as systemd's service_add_extras does:
      dbus with a BusName=, simple with an ExecStart=, oneshot without.
    name: defaultType
    params: cfg *Config
    results: coresvc.Type
  - doc: |-
      resolveBus checks BusName= and, for Type=dbus, what follows it: Linux, a
      name, a BusWatcher. Every other type accepts a valid BusName= and does not
      watch it.
    name: resolveBus
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      busNameValid reports a well-known bus name: two elements or more separated
      by dots, each of [A-Za-z0-9_-] and not opening with a digit, 255 bytes at
      most. A unique name (":1.42") is not one.
    name: busNameValid
    params: name string
    results: bool
  - doc: |-
      badBusElement reports an element of a bus name that is empty, opens with a
      digit, or holds a byte outside [A-Za-z0-9_-].
    name: badBusElement
    params: e string
    results: bool
  - doc: busNameByte reports a byte of [A-Za-z0-9_-].
    name: busNameByte
    params: c byte
    results: bool
  - doc: |-
      exitVars are $EXIT_CODE and $EXIT_STATUS: exited and the code, or killed and
      the signal's name without SIG.
    name: exitVars
    params: m *model
    results: code, status string
  - doc: |-
      endState is the state a run that ended with result rests in: inactive
      after a success, skipped after a skipped condition, failed otherwise.
    name: endState
    params: result coresvc.Result
    results: coresvc.State, coresvc.Sub
  - doc: |-
      watchdogRuns reports whether the watchdog runs at a step: from the
      start-up's end to the stop's, as service.c keeps it.
    name: watchdogRuns
    params: sub coresvc.Sub
    results: bool
  - doc: |-
      fdName is FDNAME='s name, or "stored" when it is absent or no descriptor
      may bear it: systemd ignores an invalid name.
    name: fdName
    params: v string
    results: string
  - doc: newHangupWatch opens the epoll set and its wake pipe, id 0.
    name: newHangupWatch
    results: "*hangupWatch, error"
  - doc: |-
      control lends f's descriptor for one call without the blocking mode
      os.File.Fd would force on it — a mode the service shares, since a stored
      descriptor is the service's own open file.
    name: control
    params: f *os.File, fn func(fd int)
  - doc: |-
      sameFile is systemd's same_fd without kcmp, which the standard library
      does not name everywhere: the same inode on the same device, never a
      device node — two of them may be two contexts —, opened in the same access
      mode, which tells a pipe's two ends apart.
    name: sameFile
    params: a, b *os.File
    results: bool
  - doc: accessMode is f's O_ACCMODE, -1 when it cannot be read.
    name: accessMode
    params: f *os.File
    results: int
  - doc: "fileID is what fstat names an object by: its device and inode."
    name: fileID
    params: info os.FileInfo
    results: device, inode uint64
  - doc: |-
      soleRoot is GuessMainPID='s guess among a cgroup's members, as systemd's
      unit_search_main_pid makes it: the one member whose parent is not a member —
      the daemon its command left, reparented away, whose workers are its own
      children —, when there is exactly one. The engine and PID 1 are never
      guessed; a member whose parent cannot be read is no candidate.
    name: soleRoot
    params: members []int, self int
    results: int, bool
  - doc: |-
      parentOf reads a process's parent from /proc/<pid>/stat: the field after
      the state, which follows the last ")" — the command's name may hold any.
    name: parentOf
    params: pid int
    results: int, bool
  - name: NewHandoverState
    results: "*HandoverState"
  - doc: mapKeys lists a store's ids.
    name: mapKeys
    params: m map[uint64]*os.File
    results: func(func(uint64) bool)
  - name: Freeze
    params: ctx context.Context, units []*Unit
    results: "*HandoverState, error"
  - doc: |-
      joinCause puts cause beside a sentinel in one chain, the sentinel first:
      errs.Wrap keeps the first *Error it finds as the origin, so the result is
      the sentinel's, errors.Is and errs.HasCode reaching the cause too.
    name: joinCause
    params: sentinel, cause error
    results: error
  - doc: unitClosed is UNIT_CLOSED naming the unit.
    name: unitClosed
    params: name string
    results: error
  - name: Resume
    params: cfg *Config, h *HandoverState
    results: "*Unit, error"
  - doc: closeNotify closes a notification source nobody takes.
    name: closeNotify
    params: src coresvc.NotifySource
  - doc: |-
      launchRestored builds a resumed unit and starts its goroutines, its actor
      starting from r.

      Goroutine lifecycle: the actor and the notification reader, as NewUnit's.
    name: launchRestored
    params: cfg *Config, s *settings, conn *os.File, r *restoring
    results: "*Unit"
  - name: OpenImage
    params: path string
    results: "*os.File, error"
  - name: Reexec
    params: h *HandoverState, argv []string, image *os.File, env []string
    results: error
  - name: TakeHandover
    params: ctx context.Context, grace time.Duration
    results: "*HandoverState, error"
  - doc: encodeUnit writes one frozen unit; add numbers each descriptor it names.
    name: encodeUnit
    params: fu *frozenUnit, add func(*os.File) uint64
    results: "[]byte"
  - doc: |-
      decodeHandover reads a payload's units and its descriptors' records; the
      descriptors themselves are the platform's to open.
    name: decodeHandover
    params: payload []byte
    results: "[]*unitRefs, []fileRecord, error"
  - doc: decodeUnit reads one unit's records.
    name: decodeUnit
    params: r *reader, b []byte
    results: "*unitRefs"
  - doc: decodeFile reads one descriptor's record.
    name: decodeFile
    params: r *reader, b []byte
    results: fileRecord
  - doc: |-
      checkRefs refuses units without a name or a process without a pid, and
      references to descriptors the payload does not list, or listed twice.
    name: checkRefs
    params: units []*unitRefs, files []fileRecord
    results: error
  - doc: |-
      checkRecords refuses a descriptor listed twice or at stdio, and returns the
      indices listed.
    name: checkRecords
    params: files []fileRecord
    results: map[int]bool, error
  - doc: |-
      checkUnitRefs refuses a unit without a name, a process without a pid, or
      an index the payload does not list.
    name: checkUnitRefs
    params: ref *unitRefs, seen map[int]bool
    results: error
  - doc: |-
      resolveRefs gives each unit the descriptors its indices name, from the
      opened ones by index; h holds them from here on.
    name: resolveRefs
    params: units []*unitRefs, opened map[int]*os.File
    results: "*HandoverState"
  - doc: handoverInvalid is HANDOVER_INVALID saying why.
    name: handoverInvalid
    params: why string, fields ...errs.FieldValue
    results: error
  - doc: seal frames a body as a payload of version.
    name: seal
    params: body []byte, version uint16
    results: "[]byte"
  - doc: |-
      unseal checks a payload's frame and returns its body: the magic, a version
      this image reads, the length, the sum. Anything else is HANDOVER_INVALID.
    name: unseal
    params: payload []byte
    results: "[]byte, error"
  - doc: encodeModel writes a frozen unit's model; its waiters are not written.
    name: encodeModel
    params: m *model
    results: "[]byte"
  - doc: encodeTimes writes the model's instants.
    name: encodeTimes
    params: w *writer, m *model
  - doc: encodeTexts writes the model's texts and jobs.
    name: encodeTexts
    params: w *writer, m *model
  - doc: encodeStored writes the store's entries and a sandbox failure's fields.
    name: encodeStored
    params: w *writer, m *model
  - doc: encodeCounters writes the model's numbers.
    name: encodeCounters
    params: w *writer, m *model
  - doc: encodeSteps writes the model's enumerated values and flags.
    name: encodeSteps
    params: w *writer, m *model
  - doc: encodeJob writes a job without its waiters.
    name: encodeJob
    params: j job
    results: "[]byte"
  - doc: encodeExit writes an exit.
    name: encodeExit
    params: x *coreproc.ExitValue
    results: "[]byte"
  - doc: |-
      decodeModel reads a model a unit was frozen with, then checks every value
      is one this image runs: HANDOVER_INVALID otherwise. Its settings are the
      caller's to set.
    name: decodeModel
    params: b []byte
    results: model, error
  - doc: |-
      checkModel refuses a decoded model holding a value this image does not
      define, or flags a frozen unit cannot carry.
    name: checkModel
    params: m *model
    results: error
  - doc: |-
      checkSteps refuses a list, a job, a notification state or a flag past what
      this image has.
    name: checkSteps
    params: m *model
    results: error
  - doc: checkStoreIDs refuses a store whose ids repeat, or one past the sequence.
    name: checkStoreIDs
    params: m *model
    results: error
  - doc: decodeJob reads a job, without waiters.
    name: decodeJob
    params: r *reader, b []byte
    results: job
  - doc: decodeEntry reads a store entry.
    name: decodeEntry
    params: r *reader, b []byte
    results: storeEntry
  - doc: decodeField reads a field of a sandbox's failure, as text.
    name: decodeField
    params: r *reader, b []byte
    results: errs.FieldValue
  - doc: decodeExit reads an exit.
    name: decodeExit
    params: r *reader, b []byte
    results: coreproc.ExitValue
  - doc: decodeUsage reads an exit's counters.
    name: decodeUsage
    params: r *reader, b []byte
    results: "*coreproc.UsageValue"
  - doc: "handoverHere is nil: Linux hands units over."
    name: handoverHere
    params: _ string
    results: error
  - doc: dupFile is a new close-on-exec descriptor on f's object, from 3 on.
    name: dupFile
    params: f *os.File
    results: "*os.File, error"
  - doc: |-
      mismatch is HANDOVER_MISMATCH naming fd, its cause beside it in the chain:
      the sentinel first, so it is the origin errs.Wrap keeps.
    name: mismatch
    params: cause error, fd int
    results: error
  - doc: firstOf is err, or the errno when err is nil and the errno is not 0.
    name: firstOf
    params: err error, errno syscall.Errno
    results: error
  - doc: |-
      fileIdentity is what fstat reads of f: its number, its type, its device
      and inode.
    name: fileIdentity
    params: f *os.File
    results: fileRecord, error
  - doc: |-
      adoptNotify is the notification source over a socket the hand-over
      carried, at its path.
    name: adoptNotify
    params: f *os.File, socket string
    results: coresvc.NotifySource, error
  - doc: mapValues lists a store's descriptors.
    name: mapValues
    params: m map[uint64]*os.File
    results: func(func(*os.File) bool)
  - doc: |-
      witnessNames reports whether the pidfd w still names pid: its fdinfo's
      Pid line, -1 or absent once the process was reaped.
    name: witnessNames
    params: w *os.File, pid int
    results: bool
  - doc: |-
      stopHanded stops in order the processes of a unit no Resume took: SIGTERM,
      the grace, SIGKILL, each reaped where it is a child. A process that
      cannot be held is left alone: nothing proves it is the unit's.

      Goroutine lifecycle: one per process, each ended by its process's end;
      joined before stopHanded returns.
    name: stopHanded
    params: ctx context.Context, grace time.Duration, procs []handedProc
  - doc: |-
      heldProcess is the handle of a process a unit ran: the outgoing image's,
      or — the image having changed — the child held again, nil when it cannot be.
    name: heldProcess
    params: ctx context.Context, hp *handedProc
    results: coreproc.Process
  - doc: stopperOf is the stop of one process, its end awaited.
    name: stopperOf
    params: ctx context.Context, p coreproc.Process, grace time.Duration
    results: func()
  - name: SpawnInstance
    params: ctx context.Context, template *Config, instance string, conn *os.File
    results: "*Unit, error"
  - doc: |-
      newInstance makes an instance's unit, inactive, owning conn; a refusal
      closes conn and the configuration's NotifySource.
    name: newInstance
    params: cfg *Config, conn *os.File
    results: "*Unit, error"
  - doc: |-
      closeRefused closes what a refused instance owned: its NotifySource and
      its connection.
    name: closeRefused
    params: src coresvc.NotifySource, conn *os.File
  - doc: |-
      instanceRefusal refuses a missing connection, and Windows, where no
      descriptor is handed to a child (listen.PrepareFiles).
    name: instanceRefusal
    params: conn *os.File
    results: error
  - doc: optIf is o when on, none otherwise.
    name: optIf
    params: o effectOpt, on bool
    results: effectOpt
  - doc: |-
      monotonicMicros is CLOCK_MONOTONIC in microseconds, the clock
      MONOTONIC_USEC= is stamped on; 0 when the kernel refuses the call.
    name: monotonicMicros
    results: uint64
  - doc: mainPIDChanges reports whether MAINPID= is read at a step.
    name: mainPIDChanges
    params: sub coresvc.Sub
    results: bool
  - doc: parseUsec reads a microsecond count.
    name: parseUsec
    params: v string
    results: time.Duration, bool
  - doc: |-
      reduce is the unit's pure reducer (ADR 0214 §3): it moves the model by ev,
      in place, and returns the effects the shell must run. It reads nothing but
      its arguments.
    name: reduce
    params: m *model, ev *event
    results: "[]effect"
  - doc: |-
      answersLast moves the answers to callers — efReply, efExit — after every
      other effect of a step, in their order.
    name: answersLast
    params: out []effect
    results: "[]effect"
  - doc: snapshot is the model as a consumer reads it, without its generation.
    name: snapshot
    params: m *model
    results: coresvc.StateValue
  - doc: isDead reports whether a state has no process the engine runs.
    name: isDead
    params: s coresvc.State
    results: bool
  - doc: |-
      upSub reports whether a step is up and settled: running — a Type=dbus
      unit's revalidation included (S0e) — or exited.
    name: upSub
    params: sub coresvc.Sub
    results: bool
  - doc: isUp reports whether a state is up.
    name: isUp
    params: s coresvc.State
    results: bool
  - doc: joined appends waiters to a copy of a job's.
    name: joined
    params: j job, w []uint64
    results: "[]uint64"
  - doc: sandboxSentinel is the sentinel of a sandbox failure's code.
    name: sandboxSentinel
    params: code errs.Code
    results: error
  - doc: openImage opens path O_PATH and close-on-exec.
    name: openImage
    params: path string
    results: "*os.File, error"
  - doc: reexecFailed is REEXEC_FAILED with its cause beside it.
    name: reexecFailed
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      reexec writes h to a sealed memfd and executes image with it; it returns
      only when the kernel refused, every descriptor close-on-exec again.
    name: reexec
    params: h *HandoverState, image *os.File, argv, env []string
    results: error
  - doc: |-
      execWith seals every descriptor close-on-exec, then — under ForkLock, so
      no fork in between inherits them — lifts the flag on keep alone and
      executes path; when the kernel refuses, keep is close-on-exec again.
      syscall.Exec runs the execve under the runtime's exec lock (no thread is
      created meanwhile, golang/go#19546) and gives the image back the
      descriptor limit this process started with; /proc/self/fd/N names the
      O_PATH descriptor's file as execveat(N, "", AT_EMPTY_PATH) does.
    name: execWith
    params: keep []int, path string, argv, envv []string
    results: error
  - doc: isHandoverEnv reports whether an assignment is the payload's variable.
    name: isHandoverEnv
    params: kv string
    results: bool
  - doc: memfdPayload writes payload to a new memfd and seals it whole.
    name: memfdPayload
    params: payload []byte
    results: int, error
  - doc: "setFDFlags sets fd's descriptor flags: FD_CLOEXEC, or 0 to lift it."
    name: setFDFlags
    params: fd int, flags uintptr
    results: error
  - doc: cloexec reports whether fd is close-on-exec; false for a closed one.
    name: cloexec
    params: fd int
    results: open, on bool
  - doc: listFDs lists this process's descriptors from 3 on.
    name: listFDs
    results: "[]int, error"
  - doc: sealAll marks every descriptor from 3 on close-on-exec.
    name: sealAll
    results: error
  - doc: |-
      fdOf is f's descriptor number, lent without os.File.Fd, which would turn
      a pollable descriptor blocking.
    name: fdOf
    params: f *os.File
    results: int, error
  - doc: |-
      takeHandover reads the payload the outgoing image left: none, or one
      accepted whole, or one refused with nothing left behind.
    name: takeHandover
    params: ctx context.Context, grace time.Duration
    results: "*HandoverState, error"
  - doc: |-
      acceptHandover reads the payload at the descriptor v names and opens every
      descriptor it lists, checked by fstat; any other inherited descriptor is
      closed.
    name: acceptHandover
    params: v string
    results: "*HandoverState, error"
  - doc: readPayload reads the payload from a memfd sealed whole, and closes it.
    name: readPayload
    params: fd int
    results: "[]byte, error"
  - doc: |-
      openRecords checks each listed descriptor against its record — open,
      inherited, the same type, device and inode — and opens it close-on-exec;
      the first that is not is HANDOVER_MISMATCH, every one opened closed again.
    name: openRecords
    params: records []fileRecord
    results: map[int]*os.File, error
  - doc: checkRecord compares a descriptor with what the outgoing image recorded.
    name: checkRecord
    params: r fileRecord
    results: error
  - doc: mapIntValues lists opened descriptors.
    name: mapIntValues
    params: m map[int]*os.File
    results: func(func(*os.File) bool)
  - doc: |-
      closeInherited closes every descriptor from 3 on that is not
      close-on-exec and not in keep: what an exec handed this image that nobody
      named. The runtime's own descriptors are close-on-exec.
    name: closeInherited
    params: keep []int
  - doc: |-
      stopChildren stops in order every child of this process — SIGTERM, the
      grace, SIGKILL — and reaps it: after a refused hand-over nothing
      supervises them. It returns their pids.
    name: stopChildren
    params: ctx context.Context, grace time.Duration
    results: "[]int"
  - doc: childrenOf lists the processes whose parent is parent, from /proc.
    name: childrenOf
    params: parent int
    results: "[]int"
  - doc: |-
      shallRestart is service.c's service_shall_restart: whether a run that
      ended with result restarts, the main process having ended with exit when
      exited is true. A stop the caller asked for is decided before it.
    name: shallRestart
    params: s *settings, result coresvc.Result, exit coreproc.ExitValue, exited bool
    results: bool
  - doc: bit is the set holding r alone.
    name: bit
    params: r coresvc.Result
    results: resultBits
  - doc: |-
      restartTable is Table 1 of systemd.service(5): whether policy restarts after
      result.
    name: restartTable
    params: policy coresvc.Restart, result coresvc.Result
    results: bool
  - doc: |-
      restartDelay is service.c's service_restart_usec_next: the wait before the
      n-th automatic restart, RestartSec= grown towards RestartMaxDelaySec= over
      RestartSteps= on the kernel's backoff curve: base × ratio^(n−1), ratio =
      (max/base)^(1/steps), held at max past the steps.
    name: restartDelay
    params: s *settings, n uint32
    results: time.Duration
  - doc: jitter draws a duration in [0, bound] from the event's random draw.
    name: jitter
    params: draw uint64, bound time.Duration
    results: time.Duration
  - doc: addSaturating adds two non-negative durations, held at Infinity.
    name: addSaturating
    params: a, b time.Duration
    results: time.Duration
  - doc: |-
      classifyMain is service.c's reading of a main process's end: clean is
      success, "-" makes any end a success, an adopted process gone without a
      status is clean (ADR 0214 §10), else an exit code or a signal.
    name: classifyMain
    params: s *settings, exit coreproc.ExitValue, unknown bool, flags coresvc.CommandFlags
    results: coresvc.Result
  - doc: |-
      classifyControl reads a command's end: exit 0 is success, "-" makes any end
      one; SuccessExitStatus= and the clean signals are the main process's only.
    name: classifyControl
    params: exit coreproc.ExitValue, unknown bool, flags coresvc.CommandFlags
    results: coresvc.Result
  - doc: |-
      uncleanResult names an unclean end: a signal, or an exit code. A core dump
      reads as a signal until ExitValue carries the dump bit (#1090).
    name: uncleanResult
    params: exit coreproc.ExitValue
    results: coresvc.Result
  - doc: |-
      isClean is systemd's is_clean_exit: exit 0, a status of success, or — for a
      daemon — SIGHUP, SIGINT, SIGTERM or SIGPIPE.
    name: isClean
    params: exit coreproc.ExitValue, success *coresvc.ExitStatusValue, daemon bool
    results: bool
  - doc: |-
      resolveSandbox resolves the confinement directives of systemd.exec(5) into
      the sandbox every command is spawned under: the template's Spec.Sandbox,
      its namespaces and its mounts first, with the directives' added. A unit
      that sets none and whose template has none has none.
    name: resolveSandbox
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      sandboxDirectives names the confinement directives cfg sets, in Config's
      order.
    name: sandboxDirectives
    params: cfg *Config
    results: "[]string"
  - doc: |-
      checkSandbox refuses a directive value the engine does not run, a
      malformed one, and one the template's own sandbox already decides.
    name: checkSandbox
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      valueRefusals are the checks of the directives' own values: a value past
      its last constant, one S2 cannot express, an errno out of range, a
      combination systemd refuses.
    name: valueRefusals
    params: cfg *Config, s *settings
    results: "[]sandboxRefusal"
  - doc: |-
      templateRefusals are the checks of what Spec.Sandbox decides already — a
      root, a capability state, a filter — and of an ambient set outside the
      bounding one.
    name: templateRefusals
    params: cfg *Config
    results: "[]sandboxRefusal"
  - doc: |-
      firstRefusal is the first bad check's error: DIRECTIVE_UNSUPPORTED when it
      says why, CONFIG_INVALID otherwise.
    name: firstRefusal
    params: refusals []sandboxRefusal
    results: error
  - doc: |-
      checkArchitectures refuses every SystemCallArchitectures= identifier but
      native, and native without the filter it is a property of.
    name: checkArchitectures
    params: cfg *Config
    results: error
  - doc: |-
      checkSyscallNames refuses an empty name and an @group, which the caller
      expands (agent#331).
    name: checkSyscallNames
    params: cfg *Config
    results: error
  - doc: checkSandboxPaths refuses a path that is not absolute and clean.
    name: checkSandboxPaths
    params: cfg *Config
    results: error
  - doc: |-
      checkNotifySocket refuses a sandbox that hides the unit's notification
      socket from its processes: a tmpfs over it, or a root — NOTIFY_SOCKET is
      the host's path, which a pivot moves. systemd binds its socket into the
      root; S2 makes no mount point to bind it on.
    name: checkNotifySocket
    params: cfg *Config
    results: error
  - doc: |-
      checkSandboxed refuses what proc/exec would refuse of the resolved sandbox
      against the unit's own spec and commands: an inherited descriptor table,
      supplementary groups in a user namespace, a command a root cannot find.
    name: checkSandboxed
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      checkRootCommands refuses a command the root reaches whose program is a bare
      name: proc/exec searches PATH on the host, not in the root.
    name: checkRootCommands
    params: s *settings
    results: error
  - doc: |-
      buildSandbox is the sandbox of the template with the directives', its
      paths beneath root when root is set: a new value, the template never
      written to.
    name: buildSandbox
    params: cfg *Config, root string
    results: "*coreproc.SandboxValue"
  - doc: |-
      directiveNamespaces are the namespaces the Private…= directives and
      ProtectHostname= ask for, a mount namespace for mounts or a root; a
      supervisor that is not root reaches them through its own user namespace,
      as systemd's per-user manager implies PrivateUsers=.
    name: directiveNamespaces
    params: cfg *Config, mounts bool
    results: coreproc.Namespace
  - doc: |-
      directiveMounts are the mounts the directives make, sorted by target so a
      tree is mounted before what lies beneath it, as systemd sorts them;
      ProtectSystem=, PrivateTmp=, TemporaryFileSystem= and BindPaths='s targets
      are beneath root.
    name: directiveMounts
    params: cfg *Config, root string
    results: "[]coreproc.MountValue"
  - doc: |-
      binds are BindPaths='s or BindReadOnlyPaths='s mounts, each target beneath
      root, Source where it is empty.
    name: binds
    params: paths []coresvc.BindPathValue, root string, readOnly bool
    results: "[]coreproc.MountValue"
  - doc: |-
      directiveCapabilities is the capability state the directives ask for, nil
      when they ask for none; an ambient set without a bounding one keeps every
      capability in the bounding set.
    name: directiveCapabilities
    params: cfg *Config
    results: "*coreproc.CapabilitiesValue"
  - doc: |-
      capabilityDirectives reports whether cfg sets CapabilityBoundingSet=,
      AmbientCapabilities= or SecureBits=.
    name: capabilityDirectives
    params: cfg *Config
    results: bool
  - doc: boundingSet is CapabilityBoundingSet=, every capability when it is unset.
    name: boundingSet
    params: cfg *Config
    results: uint64
  - doc: |-
      directiveSeccomp is SystemCallFilter='s filter, nil without a name: an
      allow-list lets the calls named through and refuses every other, a
      deny-list refuses the calls named; a refusal kills, or fails the call with
      SystemCallErrorNumber=.
    name: directiveSeccomp
    params: cfg *Config
    results: "*coreproc.SeccompValue"
  - doc: |-
      cloneSandbox is a copy of sb no later change to sb reaches, an empty value
      for nil.
    name: cloneSandbox
    params: sb *coreproc.SandboxValue
    results: "*coreproc.SandboxValue"
  - doc: privateTmpOf are the directories PrivateTmp= covers.
    name: privateTmpOf
    params: cfg *Config
    results: "[]string"
  - doc: "bindPaths are the paths of BindPaths= entries: each source and target."
    name: bindPaths
    params: paths []coresvc.BindPathValue
    results: "[]string"
  - doc: tmpfsPaths are TemporaryFileSystem='s directories.
    name: tmpfsPaths
    params: paths []coresvc.TemporaryFileSystemValue
    results: "[]string"
  - doc: optional is v alone, or nothing when it is empty.
    name: optional
    params: v string
    results: "[]string"
  - doc: beneath reports whether path is dir or lies below it.
    name: beneath
    params: path, dir string
    results: bool
  - doc: exists reports whether path names anything, a link not followed.
    name: exists
    params: path string
    results: bool
  - doc: |-
      sandboxKey spells sb for the store's key: every field, in a fixed order,
      a part absent told from an empty one — a deterministic digest input.
    name: sandboxKey
    params: sb *coreproc.SandboxValue
    results: string
  - doc: keyCapabilities spells a capability state, nothing for none.
    name: keyCapabilities
    params: w *keyWriter, c *coreproc.CapabilitiesValue
  - doc: keyLandlock spells a Landlock restriction, nothing for none.
    name: keyLandlock
    params: w *keyWriter, l *coreproc.LandlockValue
  - doc: keySeccomp spells a filter, nothing for none.
    name: keySeccomp
    params: w *keyWriter, sc *coreproc.SeccompValue
  - doc: resolve checks cfg and resolves its defaults.
    name: resolve
    params: cfg *Config
    results: "*settings, error"
  - doc: checkRanges refuses an enumeration value no constant names.
    name: checkRanges
    params: cfg *Config
    results: error
  - doc: resolveType resolves Type= and the flags that follow from it.
    name: resolveType
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      resolveForking resolves PIDFile= and GuessMainPID=, which only Type=forking
      reads: its main process is a daemon the engine adopts, so it needs an
      Attacher, and a PID file or a cgroup to find the daemon in.
    name: resolveForking
    params: cfg *Config, s *settings
    results: error
  - doc: resolveCommands checks the Exec*= lists.
    name: resolveCommands
    params: cfg *Config, s *settings
    results: error
  - doc: checkCommand checks one command of a list.
    name: checkCommand
    params: cfg *Config, l list, cmd coresvc.CommandValue
    results: error
  - doc: resolveRestart resolves Restart= and the exit status sets.
    name: resolveRestart
    params: cfg *Config, s *settings
    results: error
  - doc: checkStatusSet refuses an exit code out of 0..255 or an unknown signal.
    name: checkStatusSet
    params: set coresvc.ExitStatusValue, directive string
    results: error
  - doc: resolveDurations resolves every duration directive.
    name: resolveDurations
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      resolveDuration reads one duration directive: zero is def, coresvc.Zero is
      zero, coresvc.Infinity is infinity, a negative value is refused.
    name: resolveDuration
    params: directive string, value, def, zero time.Duration
    results: time.Duration, error
  - doc: resolveSignals resolves the kill, watchdog and reload signals.
    name: resolveSignals
    params: cfg *Config, s *settings
    results: error
  - doc: resolveSignal reads one signal directive.
    name: resolveSignal
    params: directive string, value, def coreproc.Signal
    results: coreproc.Signal, error
  - doc: resolveNotify resolves NotifyAccess= and the socket.
    name: resolveNotify
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      resolveStore resolves FileDescriptorStoreMax= and
      FileDescriptorStorePreserve=: a store is fed by FDSTORE=1 through the
      notification socket, which carries descriptors on Linux alone.
    name: resolveStore
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      storeKey is the key a store is filled under: the unit's name and a digest
      of what its main process is — every ExecStart= command, the user, the
      group and the groups it runs as, and the sandbox it runs in (sb, the
      template's with the directives'; nil for none). A store whose key the unit
      no longer matches is closed whole, never handed over.
    name: storeKey
    params: cfg *Config, sb *coreproc.SandboxValue
    results: string
  - doc: resolveLimits resolves the start limiter.
    name: resolveLimits
    params: cfg *Config, s *settings
    results: error
  - doc: |-
      listensToMain reports whether a unit must hear its main process: a notify
      type, a watchdog, a descriptor store.
    name: listensToMain
    params: s *settings
    results: bool
  - doc: isNotifyType reports whether t waits for READY=1.
    name: isNotifyType
    params: t coresvc.Type
    results: bool
  - doc: invalid is CONFIG_INVALID naming a directive and its value.
    name: invalid
    params: directive, value string
    results: error
  - doc: |-
      unsupported is DIRECTIVE_UNSUPPORTED naming a directive, its value and what
      lifts the refusal.
    name: unsupported
    params: directive, value, issue string
    results: error
  - doc: |-
      platformSignals returns SIGCONT, sent after the kill signal so a stopped
      process can end, and SIGHUP, sent after it on SendSIGHUP=.
    name: platformSignals
    results: sigcont, sighup coreproc.Signal
  - doc: |-
      buildSpec makes the spec of one command from the unit's template: the
      command's program and arguments, $VAR and ${VAR} expanded unless ":", the
      engine's variables over the template's, the shell for "|", and for "+" and
      "!" no credentials, the fixed search path and no loader or shell
      start-up variable; the unit's sandbox — none for "+", which systemd runs
      without any namespacing, capability or filter option, the root
      ExecStart='s alone under RootDirectoryStartOnly= —; the unit's group as its
      CgroupPath when the template names none. The template is never written to.
    name: buildSpec
    params: template *coreproc.Spec, s *settings, ef *effect
    results: coreproc.Spec
  - doc: |-
      mergeEnv is base with vars set over it: a name of vars replaces every entry
      of base's, a name base repeats keeps its last value at the place of its last
      occurrence — os/exec's reading of append(os.Environ(), "K=v"), and proc/exec's
      —, and PATH is the fixed search path when neither names one.
    name: mergeEnv
    params: base, vars []string
    results: "[]string"
  - doc: namesOf is the set of names vars assigns, as nameKey compares them.
    name: namesOf
    params: vars []string
    results: map[string]bool
  - doc: |-
      envName is an assignment's name. A leading "=" belongs to it, as proc/exec
      reads it: Windows keeps each drive's current directory as "=C:=C:\dir".
    name: envName
    params: assignment string
    results: string
  - doc: |-
      nameKey is the form two names of one variable share on this platform:
      Windows' names ignore case, so a template's "Path=" is the unit's PATH.
    name: nameKey
    params: name string
    results: string
  - doc: |-
      privilegedEnv drops the variables a privileged command must not inherit —
      LD_*, ENV, BASH_ENV — and fixes PATH.
    name: privilegedEnv
    params: env []string
    results: "[]string"
  - doc: |-
      shellCommand is a "|" command: the shell alone, or the shell's -c over the
      command's words; "@" makes it a login shell ("-" before its argv[0]).
    name: shellCommand
    params: shell string, cmd coresvc.CommandValue, args []string
    results: string, []string
  - doc: shellQuote quotes a word for a POSIX shell, unless it needs none.
    name: shellQuote
    params: w string
    results: string
  - doc: |-
      expandArgs expands the arguments after argv[0] as systemd.service(5)'s
      "Command lines" says: a word that is exactly $NAME becomes the value split at
      whitespace (quotes respected, then removed), ${NAME} anywhere becomes the
      value as one piece, $$ is $, and an unknown variable is empty.
    name: expandArgs
    params: args, env []string
    results: "[]string"
  - doc: envMap reads assignments into a map; mergeEnv left one of each name.
    name: envMap
    params: env []string
    results: map[string]string
  - doc: bareVar reports whether a word is exactly $NAME, and the name.
    name: bareVar
    params: w string
    results: string, bool
  - doc: |-
      isName reports whether s is a variable name: a letter or "_" first, then
      letters, digits and "_".
    name: isName
    params: s string
    results: bool
  - doc: isDigit reports an ASCII digit.
    name: isDigit
    params: c byte
    results: bool
  - doc: isLetter reports an ASCII letter or "_".
    name: isLetter
    params: c byte
    results: bool
  - doc: expandWord replaces ${NAME} by its value and $$ by $, leaving any other $.
    name: expandWord
    params: w string, values map[string]string
    results: string
  - doc: |-
      dollar reads what a "$" opens — "$$", "${NAME}", or a "$" alone — and
      returns what it stands for and how many bytes it spans.
    name: dollar
    params: s string, values map[string]string
    results: string, int
  - doc: splitWords splits a value at whitespace, quotes respected and removed.
    name: splitWords
    params: v string
    results: "[]string"
  - doc: upOnSpawn reports a type that is up once its main process is spawned.
    name: upOnSpawn
    params: t coresvc.Type
    results: bool
  - doc: |-
      spawnResult is the result a spawn's failure ends a run with: exit-code for
      a sandbox step that failed in the child before its program ran — what
      systemd's EXIT_* statuses (226/NAMESPACE, 228/SECCOMP, …) are —, resources
      for everything refused or failed before the fork, a part of the sandbox
      the kernel lacks included, as service_spawn's failures are.
    name: spawnResult
    params: err error
    results: coresvc.Result
  - name: NewAttacher
    params: scope coreproc.AttachValue
    results: coresvc.Attacher
  - name: ListenNotify
    results: coresvc.NotifySource, error
  - doc: |-
      notifyValue maps a received datagram to the engine's message: the
      descriptors it carried, in the order the engine reads them — MAINPIDFD=1's
      pidfd first, whose PID becomes the MAINPID= the engine reads, then
      FDSTORE=1's or BARRIER=1's —, every one the engine's to keep or close. The
      sender's pidfd is no descriptor the message carried (SCM_PIDFD): it is
      closed here, the engine naming the sender by its PID.
    name: notifyValue
    params: v *coreproc.NotificationValue
    results: coresvc.NotifyValue
  - name: NewUnit
    params: cfg *Config
    results: "*Unit, error"
  - doc: |-
      launch builds a unit over resolved settings — an instance's (S0f) with the
      connection it owns — and starts its goroutines.

      Goroutine lifecycle: the actor and the notification reader, as NewUnit's.
    name: launch
    params: cfg *Config, s *settings, conn *os.File
    results: "*Unit"
  - doc: newUnit builds the unit's shell.
    name: newUnit
    params: cfg *Config, s *settings
    results: "*Unit"
imports:
  backoff: github.com/kitsunium/sdk/internal/kernel/backoff
  binary: encoding/binary
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  coresvc: github.com/kitsunium/sdk/internal/core/proc/service
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  exec: github.com/kitsunium/sdk/internal/service/proc/exec
  filepath: path/filepath
  hex: encoding/hex
  listen: github.com/kitsunium/sdk/internal/service/proc/systemd/listen
  maps: maps
  math: math
  os: os
  path: path
  rand: math/rand/v2
  runtime: runtime
  sha256: crypto/sha256
  slices: slices
  strconv: strconv
  strings: strings
  svcnotify: github.com/kitsunium/sdk/internal/service/proc/systemd/notify
  sync: sync
  syscall: syscall
  time: time
  unsafe: unsafe
  user: os/user
  utf8: unicode/utf8
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/service
  name: service
  purpose: "Package service is the engine of a service unit's life cycle (ADR 0214): systemd.service(5)'s state machine for one service — Type=, the Exec*= commands and their prefixes, the timeouts and their failure modes, the watchdog, the notification protocol, Restart=, RestartSec= on the kernel's backoff curve, the start limiter, the stop's escalation."
types:
  - doc: |-
      actor is the I/O shell of one unit (ADR 0214 §3): it owns the model, the
      processes and the timers, takes one event at a time, runs the reducer, and
      does what the reducer asks. Only the actor's goroutine touches it.
    fields:
      - name: u
        type: "*Unit"
      - name: procs
        type: map[int]coreproc.Process
      - doc: |-
          children are the processes the engine spawned: the image's children,
          reclaimed as such across a hand-over (S0h).
        name: children
        type: map[int]bool
      - doc: |-
          store holds the descriptor store's descriptors by id, storeOrder their
          ids oldest first; hangups watches them, once one is.
        name: store
        type: map[uint64]*held
      - name: storeOrder
        type: "[]uint64"
      - name: hangups
        type: "*hangupWatch"
      - name: timers
        type: "[timerCount]clock.Timer"
      - name: armed
        type: "[timerCount]uint64"
      - name: m
        type: model
      - doc: |-
          group is the unit's control group when it runs the cgroup modes (S0g),
          nil otherwise; oomSeen is the OOM kills it counted that the reducer
          was told of.
        name: group
        type: coresvc.CgroupUnit
      - name: oomSeen
        type: int64
      - doc: |-
          flags are the shell's booleans: the group's watch, the bus name's,
          the end asked.
        name: flags
        type: shellFlag
    kind: struct
    methods:
      - doc: on reports whether flag f is set.
        name: "on"
        params: f shellFlag
        recv: a *actor
        results: bool
      - doc: put sets or clears flag f.
        name: put
        params: f shellFlag, on bool
        recv: a *actor
      - doc: wait takes the next event, or a timer's fire.
        name: wait
        recv: a *actor
      - doc: timerFired posts timer k's fire with the arming it fired for.
        name: timerFired
        params: k timerKind
        recv: a *actor
      - doc: |-
          handle runs the reducer over ev and every event its effects hand back,
          in order, before the next event of the inbox.
        name: handle
        params: first *event
        recv: a *actor
      - doc: |-
          annotate finds what the reducer cannot read: what the unit's group holds
          now, with a process's end or a change the watch announced (S0g); which of
          a FDSTORE=1 message's descriptors the store holds already (fstat), and
          whether a notification's sender, and the MAINPID= it names, belong to the
          unit's cgroup — one that cannot answer is read as "no".
        name: annotate
        params: ev *event
        recv: a *actor
      - doc: |-
          annotateNotify finds which of a FDSTORE=1 message's descriptors the store
          holds already, and whether the sender and the MAINPID= it names belong to
          the unit's cgroup.
        name: annotateNotify
        params: ev *event
        recv: a *actor
      - doc: |-
          signal sends a signal to a process the shell holds. A refusal means the
          process is gone already, which its exit event says: nothing to do.
        name: signal
        params: ef *effect
        recv: a *actor
        results: event, bool
      - doc: arm arms a timer for its deadline, replacing its last arming.
        name: arm
        params: ef *effect
        recv: a *actor
        results: event, bool
      - doc: end answers the close's waiters and ends the loop.
        name: end
        params: ef *effect
        recv: a *actor
        results: event, bool
      - doc: |-
          spawnCommand spawns a command and watches its process. A start's first
          spawn prepares the unit's group (S0g) and its bus name's watch (S0e) first;
          what the watch looked up rides on the spawn's outcome, whatever it is.
        name: spawnCommand
        params: ef *effect
        recv: a *actor
        results: event
      - doc: |-
          owed is what a spawn is handed beyond its spec: for ExecStart= alone, an
          instance's connection (S0f), then the store's descriptors the reducer listed
          (S0d) — systemd's order, the socket before the store.
        name: owed
        params: ef *effect
        recv: a *actor
        results: "[]listen.NamedFileValue"
      - doc: attach adopts a process a MAINPID= named and watches it.
        name: attach
        params: pid int
        recv: a *actor
        results: event
      - doc: |-
          attachFile adopts the process PIDFile= names and watches it. A refusal —
          the file absent, unsafe or naming no process the scope admits — carries
          its reason, and whether the cgroup has anything left to write the file.
        name: attachFile
        recv: a *actor
        results: event
      - doc: |-
          guessMain lists the unit's cgroup and, when pick is set, adopts the one
          member whose parent is not a member (GuessMainPID=). The event says whether
          the cgroup has members, so a main process left unknown is up while it has.
        name: guessMain
        params: pick bool
        recv: a *actor
        results: event
      - doc: |-
          members lists the unit's cgroup when it lists its members, with
          flagPopulated or flagEmpty; nothing when it cannot say.
        name: members
        recv: a *actor
        results: "[]int, eventFlag"
      - doc: |-
          watch holds a process and posts its end.

          Goroutine lifecycle: one per process, ended by the process's end. A process
          the unit leaves running (KillMode=none, SurviveFinalKillSignal=) keeps its
          goroutine until it ends, and its end is dropped once the unit is closed.
        name: watch
        params: p coreproc.Process
        recv: a *actor
      - doc: stopTimer stops timer k, if armed.
        name: stopTimer
        params: k timerKind
        recv: a *actor
      - doc: |-
          finish ends the unit: the timers stopped, the context canceled, the socket
          closed, the store closed — its watch stopped once nothing posts —, an
          instance's connection closed, every subscription closed.
        name: finish
        recv: a *actor
      - doc: |-
          prepare readies the unit's group before a start's first spawn, as systemd
          realises a unit's cgroup: its watch running, Delegate='s handing over, and
          memory.oom.group for OOMPolicy=kill. Any refusal fails the spawn.
        name: prepare
        recv: a *actor
        results: error
      - doc: |-
          delegate hands g to the user and the group the unit's processes run as;
          the supervisor's own keeps it as it is.
        name: delegate
        params: g coresvc.CgroupUnit
        recv: a *actor
        results: error
      - doc: |-
          startWatch starts the group's watch unless it runs: the count of OOM kills
          when it starts is the baseline — a kill counted before is no news, and a
          group that went and came back counts from its own start —, then one
          goroutine forwards every later state to the actor.
        name: startWatch
        recv: a *actor
        results: error
      - doc: |-
          annotateGroup reads the unit's group with an event the reducer may decide
          on: an OOM kill it was not told of (flagOOM), and the population, read
          again rather than taken from a state the watch read earlier — a late event
          never ends a unit early. A group that cannot be read holds nothing the
          engine could wait for.
        name: annotateGroup
        params: ev *event
        recv: a *actor
      - doc: |-
          signalGroup sends ef's signals to the unit's group: the main and control
          processes through their handles where they are outside it, then every
          process of it through Signal — passes over the subtree's cgroup.procs until
          none is new, as systemd's cg_kill_recursive —, each process once. SIGKILL
          too, never cgroup.kill (CgroupKill.Kill): on Linux 6.12 one cgroup.kill
          makes every child later cloned into the group (CLONE_INTO_CGROUP) die at
          its fork (measured on 6.12.101), and the unit's next start spawns into it
          again. The outcome says whether the group held a process before the signal.
        name: signalGroup
        params: ef *effect
        recv: a *actor
        results: event
      - doc: |-
          prune removes what a delegated service made beneath the unit's group; a
          group still held — a process KillMode=process or none left behind — stays,
          as systemd leaves a cgroup it cannot trim.
        name: prune
        recv: a *actor
      - doc: |-
          prepareStart readies what a start's first spawn needs before it runs: the
          unit's group (S0g), then a Type=dbus unit's name watch (S0e), whose first
          owner comes back as flagLookup. Any refusal fails the spawn.
        name: prepareStart
        recv: a *actor
        results: eventFlag, error
      - doc: |-
          startBusWatch watches a Type=dbus unit's name unless the watch runs. The
          owner the watch looked up first is the level before the main process runs,
          returned as flagLookup and flagOwner — no readiness: only a change the bus
          announces after the spawn makes the unit ready, as systemd waits for one.
          One goroutine forwards every later change to the actor.
        name: startBusWatch
        recv: a *actor
        results: eventFlag, error
      - doc: |-
          keep holds efStore's descriptors under their ids, watches each one asked
          for a hangup — an object epoll cannot watch stays, unwatched —, and
          publishes the listing.
        name: keep
        params: ef *effect
        recv: a *actor
      - doc: |-
          drop closes efStoreDrop's descriptors — out of the hangup watch first, so
          no event names a descriptor reused — and forgets them.
        name: drop
        params: entries []storeEntry
        recv: a *actor
      - doc: |-
          publishStore publishes Unit.FDStore's listing: newest first, as the next
          main process receives it.
        name: publishStore
        recv: a *actor
      - doc: |-
          watchHangup watches f for a hangup, starting the watch on its first use;
          it reports whether f is watched.

          Goroutine lifecycle: the watch's one goroutine (hangupWatch.start) posts
          each hangup to the actor until closeStore stops it, and is joined there.
        name: watchHangup
        params: f *os.File, id uint64
        recv: a *actor
        results: bool
      - doc: |-
          closeStore ends the store with the actor: the watch stopped and joined,
          every descriptor closed — unless the hand-over (S0h) takes them first.
        name: closeStore
        recv: a *actor
      - doc: |-
          dupsOf says, for each descriptor of a FDSTORE=1 message, which stored one
          it refers to the same object as — or that one before it in the message
          does (dupEarlier) —, as systemd's same_fd decides it.
        name: dupsOf
        params: files []*os.File
        recv: a *actor
        results: "[]uint64"
      - doc: |-
          handOver gives a main command what it is owed, at fd 3 on after the
          sockets the template's spec already activates: owed, in order — the
          store's newest first (S0d), a connection (S0f) —, each with its name,
          LISTEN_FDS counting them all and LISTEN_PID the child's own
          (listen.PrepareFiles). The descriptors are passed as they are; nothing owed
          leaves spec as it was.
        name: handOver
        params: spec *coreproc.Spec, owed []listen.NamedFileValue
        recv: a *actor
        results: error
      - doc: |-
          stored is the store's part of a main command's hand-over, as the reducer
          listed it.
        name: stored
        params: entries []storeEntry
        recv: a *actor
        results: "[]listen.NamedFileValue"
      - doc: |-
          freeze is evFreeze, taken between two events: the events already posted
          are run first, then the model is written down, the descriptors the unit
          keeps duplicated into the hand-over, the processes forgotten — never
          stopped —, every waiter answered UNIT_CLOSED, and the actor ends as Close
          ends it, minus the stop: its finish closes the originals, the hand-over
          keeps the duplicates.
        name: freeze
        params: req *event
        recv: a *actor
      - doc: |-
          drain runs the events posted before the freeze was taken; a second freeze
          among them is refused.
        name: drain
        recv: a *actor
      - doc: |-
          freezeFiles duplicates into fu the store's descriptors, an instance's
          connection and the notification socket ListenNotify made — which is
          detached, so the actor's end leaves its path for the incoming image.
        name: freezeFiles
        params: fu *frozenUnit
        recv: a *actor
        results: error
      - doc: |-
          handProcs lists the processes the shell holds, by pid: the engine's
          children, and the adopted ones with a handle proving them in the
          incoming image.
        name: handProcs
        recv: a *actor
        results: "[]handedProc"
      - doc: |-
          restore starts the actor from what Freeze wrote: the model, the store's
          descriptors by id, each process held again, each timer armed for its
          deadline, the group's and the bus name's watches begun again; then the
          reducer reads what the image change hid — a process gone, the group as it
          is, the bus name's owner as a lookup.
        name: restore
        params: r *restoring
        recv: a *actor
      - doc: |-
          restoreStore holds the store's descriptors again, by id, each watched for
          a hangup as it was; an entry whose descriptor did not come is dropped and
          counted as discarded.
        name: restoreStore
        params: fu *frozenUnit
        recv: a *actor
      - doc: |-
          restoreProcs holds each process again and watches it; it returns the pids
          it could not hold.
        name: restoreProcs
        params: fu *frozenUnit
        recv: a *actor
        results: "[]int"
      - doc: |-
          holdAgain is a handle on a frozen unit's process: the outgoing image's
          own when the image did not change; else a child reclaimed, or an adopted
          process attached again whose witness — the handle the outgoing image
          passed — still names that pid, so the pid was not reused meanwhile.
        name: holdAgain
        params: hp *handedProc
        recv: a *actor
        results: coreproc.Process, error
      - doc: |-
          rewatch begins again the watches the image change ended, for a unit that
          runs: the group's — its baseline the OOM count now, then the group read
          as it is — and the bus name's, whose first answer is a lookup, read with
          the grace, never as a loss (S0e).
        name: rewatch
        recv: a *actor
    name: actor
  - doc: shellFlag is one of the shell's booleans, as a bit.
    kind: named
    name: shellFlag
    underlying: uint8
  - doc: "account is a resolved user: its uid and primary gid."
    fields:
      - name: uid
        type: int
      - name: gid
        type: int
    kind: struct
    name: account
  - doc: |-
      held is one descriptor the shell keeps for the store: the descriptor, what
      Unit.FDStore lists of it, and whether a hangup watch holds it.
    fields:
      - name: file
        type: "*os.File"
      - name: view
        type: coresvc.StoredFDValue
      - name: watched
        type: bool
    kind: struct
    name: held
  - fields:
      - doc: Spawner starts the unit's processes. Nil is proc/exec's Start.
        name: Spawner
        type: coresvc.Spawner
      - doc: |-
          Attacher adopts a process the engine did not start: a MAINPID=, a
          Type=forking daemon. Nil refuses every MAINPID= naming one, and
          Type=forking.
        name: Attacher
        type: coresvc.Attacher
      - doc: |-
          Cgroup is the unit's control group. Nil is none: NotifyAccess=exec and
          all are refused, MAINPID= is accepted from a privileged sender only, and
          a Type=forking unit needs PIDFile=. One that is also a
          coresvc.CgroupMembers lets such a unit guess its main process. One that
          is also a coresvc.CgroupUnit — proc/cgroup's Linux group — runs the
          cgroup modes: every process is spawned into it, KillMode= defaults to
          control-group, ExitType=cgroup, Delegate= and OOMPolicy= run, and its
          emptying ends a unit that was up on its members alone.
        name: Cgroup
        type: coresvc.CgroupKill
      - doc: |-
          Notify is the unit's sd_notify socket, which the unit owns and closes.
          Nil is none: NOTIFY_SOCKET is not set, and a notify type, a watchdog or
          a NotifyAccess= other than none is refused.
        name: Notify
        type: coresvc.NotifySource
      - doc: |-
          BusWatcher follows who owns BusName= on the bus: a Type=dbus unit needs
          one, which the unit watches through from its first start to Close.
          proc/dbus's Conn is one; the caller closes it after the unit. Every other
          type ignores it.
        name: BusWatcher
        type: coresvc.BusWatcher
      - doc: Clock is what every wait runs on. Nil is the system clock.
        name: Clock
        type: coresvc.Clock
      - doc: |-
          CapabilityBoundingSet is CapabilityBoundingSet=: the capabilities the
          unit's processes keep in their bounding set, bit n capability n — every
          other one is dropped, and cut from what root holds. Nil leaves the set as
          inherited; systemd's "~" is the complement, the caller's to compute.
        name: CapabilityBoundingSet
        type: "*uint64"
      - doc: Name names the unit in its snapshots and its errors. Required.
        name: Name
        type: string
      - doc: |-
          PIDFile is PIDFile=: for Type=forking, the absolute, clean path the daemon
          writes its PID to, read through Attacher.AttachPIDFile once the process
          the engine started exited — again every 100 ms, until TimeoutStartSec=,
          while it cannot be read. Every other type ignores it, as systemd does,
          and the engine never removes it.
        name: PIDFile
        type: string
      - doc: |-
          BusName is BusName=: the well-known name a Type=dbus unit is up on — owned
          once its main process runs, lost to stop it. A unit with one and no Type=
          is Type=dbus, as systemd reads it. Every other type accepts it and does
          not watch it: systemd adopts the owner's PID as the main process when it
          knows none, which the engine does not (ADR 0214's S0e amendment).
        name: BusName
        type: string
      - doc: |-
          Shell is the shell a "|" command runs through. Empty is /bin/sh: the
          user database's shell is the caller's to look up.
        name: Shell
        type: string
      - doc: |-
          RootDirectory is RootDirectory=: the absolute directory every command
          pivots into (pivot_root(2)), in a mount namespace, the old root detached;
          a command's path must then hold a '/', and lies inside it. The paths of
          ProtectSystem=, PrivateTmp=, TemporaryFileSystem= and BindPaths='s
          targets are beneath it; ReadOnlyPaths= and BindPaths='s sources are the
          host's. With RootDirectoryStartOnly it is ExecStart='s alone.
        name: RootDirectory
        type: string
      - doc: |-
          Spec is the template every command is spawned from: its working
          directory, environment, credentials, process group, limits, cgroup and
          standard streams. Its Path and Args are the command's. With a
          coresvc.CgroupUnit its CgroupPath is the unit's group when empty, and
          must lie within it. Its Sandbox is the base the sandbox directives add
          to — its namespaces, its mounts first —; a "+" command runs without any
          sandbox, a "!" one keeps it and drops the credentials alone.
        name: Spec
        type: coreproc.Spec
      - doc: |-
          ExecCondition is ExecCondition=: 1 to 254 skips the unit, 255 or an
          abnormal end fails it.
        name: ExecCondition
        type: "[]coresvc.CommandValue"
      - doc: ExecStartPre is ExecStartPre=.
        name: ExecStartPre
        type: "[]coresvc.CommandValue"
      - doc: |-
          ExecStart is ExecStart=: one command, several for TypeOneshot, none for a
          TypeOneshot with RemainAfterExit and an ExecStop.
        name: ExecStart
        type: "[]coresvc.CommandValue"
      - doc: ExecStartPost is ExecStartPost=.
        name: ExecStartPost
        type: "[]coresvc.CommandValue"
      - doc: ExecReload is ExecReload=.
        name: ExecReload
        type: "[]coresvc.CommandValue"
      - doc: ExecReloadPost is ExecReloadPost=, after a successful reload.
        name: ExecReloadPost
        type: "[]coresvc.CommandValue"
      - doc: ExecStop is ExecStop=, after a successful start only.
        name: ExecStop
        type: "[]coresvc.CommandValue"
      - doc: ExecStopPost is ExecStopPost=.
        name: ExecStopPost
        type: "[]coresvc.CommandValue"
      - doc: |-
          ReadOnlyPaths is ReadOnlyPaths=: absolute paths of the host made
          read-only, recursively, in the unit's mount namespace.
        name: ReadOnlyPaths
        type: "[]string"
      - doc: |-
          BindPaths is BindPaths=: paths of the host bound, recursively and
          writable, onto paths of the unit's view, which must exist.
        name: BindPaths
        type: "[]coresvc.BindPathValue"
      - doc: "BindReadOnlyPaths is BindReadOnlyPaths=: as BindPaths, read-only."
        name: BindReadOnlyPaths
        type: "[]coresvc.BindPathValue"
      - doc: |-
          TemporaryFileSystem is TemporaryFileSystem=: an empty tmpfs, mode 0755,
          on each directory of the unit's view, which must exist.
        name: TemporaryFileSystem
        type: "[]coresvc.TemporaryFileSystemValue"
      - doc: |-
          SystemCallArchitectures is SystemCallArchitectures=: "native" is the one
          identifier taken, and only beside a SystemCallFilter=, whose filter kills
          a call of any other ABI — x32 included — whatever this says.
        name: SystemCallArchitectures
        type: "[]string"
      - doc: SuccessExitStatus is SuccessExitStatus=.
        name: SuccessExitStatus
        type: coresvc.ExitStatusValue
      - doc: RestartPreventExitStatus is RestartPreventExitStatus=.
        name: RestartPreventExitStatus
        type: coresvc.ExitStatusValue
      - doc: RestartForceExitStatus is RestartForceExitStatus=.
        name: RestartForceExitStatus
        type: coresvc.ExitStatusValue
      - doc: |-
          SystemCallFilter is SystemCallFilter=: a seccomp filter of named calls, an
          allow-list, or a deny-list with Deny; a call it refuses kills the process,
          unless SystemCallErrorNumber=. The names are taken as given: an
          allow-list's implicit @default, as every @group, is the caller's to expand.
        name: SystemCallFilter
        type: coresvc.SystemCallFilterValue
      - doc: RestartDelay is RestartSec=; zero is 100 ms.
        name: RestartDelay
        type: time.Duration
      - doc: RestartMaxDelay is RestartMaxDelaySec=; zero is infinity.
        name: RestartMaxDelay
        type: time.Duration
      - doc: RestartRandomizedDelay is RestartRandomizedDelaySec=.
        name: RestartRandomizedDelay
        type: time.Duration
      - doc: |-
          TimeoutStart is TimeoutStartSec=; zero is 90 s, infinity for a
          TypeOneshot.
        name: TimeoutStart
        type: time.Duration
      - doc: TimeoutStop is TimeoutStopSec=; zero is 90 s.
        name: TimeoutStop
        type: time.Duration
      - doc: TimeoutAbort is TimeoutAbortSec=; zero is TimeoutStop.
        name: TimeoutAbort
        type: time.Duration
      - doc: RuntimeMax is RuntimeMaxSec=; zero is infinity.
        name: RuntimeMax
        type: time.Duration
      - doc: RuntimeRandomizedExtra is RuntimeRandomizedExtraSec=.
        name: RuntimeRandomizedExtra
        type: time.Duration
      - doc: Watchdog is WatchdogSec=; zero is off.
        name: Watchdog
        type: time.Duration
      - doc: |-
          AmbientCapabilities is AmbientCapabilities=: the capabilities raised in
          the ambient set, bit n capability n, which a process that is not root
          keeps across execve; they must lie within CapabilityBoundingSet=.
        name: AmbientCapabilities
        type: uint64
      - doc: |-
          StartLimitInterval is StartLimitIntervalSec=; zero is 10 s, coresvc.Zero
          no limit, coresvc.Infinity a window that never ends.
        name: StartLimitInterval
        type: time.Duration
      - doc: StartLimitBurst is StartLimitBurst=; zero is 5.
        name: StartLimitBurst
        type: int
      - doc: RestartSteps is RestartSteps=.
        name: RestartSteps
        type: int
      - doc: |-
          FileDescriptorStoreMax is FileDescriptorStoreMax=: how many descriptors
          FDSTORE=1 may keep in the unit's store, handed back to every ExecStart=
          process at fd 3 on — after the sockets Spec activates, newest first —
          and $FDSTORE set to it for every command; zero is no store. It needs
          Notify, implies NotifyAccess=main, and is Linux's only: no other
          platform's notify socket carries descriptors.
        name: FileDescriptorStoreMax
        type: int
      - doc: |-
          SystemCallErrorNumber is SystemCallErrorNumber=: the errno, 1 to 4095, a
          call SystemCallFilter= refuses fails with; zero kills the process,
          systemd's default.
        name: SystemCallErrorNumber
        type: int
      - doc: KillSignal is KillSignal=; zero is SIGTERM (SIGKILL on Windows).
        name: KillSignal
        type: coreproc.Signal
      - doc: RestartKillSignal is RestartKillSignal=; zero is KillSignal.
        name: RestartKillSignal
        type: coreproc.Signal
      - doc: FinalKillSignal is FinalKillSignal=; zero is SIGKILL.
        name: FinalKillSignal
        type: coreproc.Signal
      - doc: WatchdogSignal is WatchdogSignal=; zero is SIGABRT (SIGKILL on Windows).
        name: WatchdogSignal
        type: coreproc.Signal
      - doc: ReloadSignal is ReloadSignal=; zero is SIGHUP.
        name: ReloadSignal
        type: coreproc.Signal
      - doc: |-
          SecureBits is SecureBits=: the securebits set, as linux/securebits.h
          numbers them (noroot 1<<0, keep-caps 1<<4, …); zero sets none.
        name: SecureBits
        type: uint32
      - doc: Type is Type=.
        name: Type
        type: coresvc.Type
      - doc: Restart is Restart=.
        name: Restart
        type: coresvc.Restart
      - doc: RestartMode is RestartMode=.
        name: RestartMode
        type: coresvc.RestartMode
      - doc: TimeoutStartFailureMode is TimeoutStartFailureMode=.
        name: TimeoutStartFailureMode
        type: coresvc.TimeoutMode
      - doc: TimeoutStopFailureMode is TimeoutStopFailureMode=.
        name: TimeoutStopFailureMode
        type: coresvc.TimeoutMode
      - doc: NotifyAccess is NotifyAccess=.
        name: NotifyAccess
        type: coresvc.NotifyAccess
      - doc: |-
          KillMode is KillMode=; its zero is control-group with a
          coresvc.CgroupUnit, process without (ADR 0214's S0g amendment).
        name: KillMode
        type: coresvc.KillMode
      - doc: ExitType is ExitType=; cgroup needs a coresvc.CgroupUnit.
        name: ExitType
        type: coresvc.ExitType
      - doc: |-
          OOMPolicy is OOMPolicy=: what an OOM kill in the cgroup does — stop by
          default, continue under Delegate=. Continue, stop and kill need a
          coresvc.CgroupUnit; kill sets memory.oom.group at each start.
        name: OOMPolicy
        type: coresvc.OOMPolicy
      - doc: |-
          FileDescriptorStorePreserve is FileDescriptorStorePreserve=: when the
          store is released — PreserveRestart once the unit rests dead with no job
          and no restart due, PreserveNo at every end of a run, PreserveYes at
          Close only, PreserveOnSuccess at Close or once the unit is failed for
          good. Close releases every store.
        name: FileDescriptorStorePreserve
        type: coresvc.Preserve
      - doc: SendSIGKILL is SendSIGKILL=; its default is yes.
        name: SendSIGKILL
        type: coresvc.Toggle
      - doc: |-
          GuessMainPID is GuessMainPID=: for Type=forking without PIDFile=, the
          main process is the one member of the Cgroup — a coresvc.CgroupMembers —
          whose parent is not a member, when there is exactly one; no leaves the
          main process unknown, the unit up while the cgroup has members. Every
          other unit ignores it, as systemd does.
        name: GuessMainPID
        type: coresvc.Toggle
      - doc: |-
          ProtectSystem is ProtectSystem=: yes makes /usr read-only, and /boot and
          /efi where they exist, full /etc too; strict is refused.
        name: ProtectSystem
        type: coresvc.ProtectSystem
      - doc: |-
          PrivateTmp is PrivateTmp=: disconnected mounts a tmpfs, mode 1777, on /tmp
          and /var/tmp for each command; yes is refused.
        name: PrivateTmp
        type: coresvc.PrivateTmp
      - doc: RemainAfterExit is RemainAfterExit=.
        name: RemainAfterExit
        type: bool
      - doc: SendSIGHUP is SendSIGHUP=.
        name: SendSIGHUP
        type: bool
      - doc: |-
          SurviveFinalKillSignal is SurviveFinalKillSignal=: Close leaves the
          unit's processes running.
        name: SurviveFinalKillSignal
        type: bool
      - doc: |-
          Delegate is Delegate=: at each start the unit's group is handed to the
          user and the group Spec runs as, and at each end of a run the groups
          the service made beneath it are removed. It needs a coresvc.CgroupUnit.
        name: Delegate
        type: bool
      - doc: |-
          NoNewPrivileges is NoNewPrivileges=: no execve of the unit's processes, or
          of theirs, gains a privilege.
        name: NoNewPrivileges
        type: bool
      - doc: |-
          PrivateUsers is PrivateUsers=: a new user namespace, its root mapped to
          the supervisor's effective uid and gid, one id wide, unless Spec's
          Sandbox names the maps. A supervisor that is not root implies it beside
          any other namespace, as systemd's per-user manager does.
        name: PrivateUsers
        type: bool
      - doc: |-
          PrivateNetwork is PrivateNetwork=: a new network namespace, with a
          loopback alone.
        name: PrivateNetwork
        type: bool
      - doc: |-
          PrivatePIDs is PrivatePIDs=: a new PID namespace, each command its PID 1;
          /proc is not mounted again. Type=forking refuses it, as systemd does.
        name: PrivatePIDs
        type: bool
      - doc: |-
          ProtectHostname is ProtectHostname=: a new UTS namespace — systemd's
          private: the hostname changes there alone; filtering sethostname, as its
          yes does, is SystemCallFilter='s.
        name: ProtectHostname
        type: bool
      - doc: "PrivateIPC is PrivateIPC=: a new IPC namespace."
        name: PrivateIPC
        type: bool
      - doc: |-
          RootDirectoryStartOnly is RootDirectoryStartOnly=: RootDirectory= reaches
          ExecStart= alone; every other command keeps the rest of the sandbox in the
          host's view.
        name: RootDirectoryStartOnly
        type: bool
      - doc: |-
          AllowPrivilegedControl admits the "+" and "!" commands; false refuses
          them (PRIVILEGE_REFUSED).
        name: AllowPrivilegedControl
        type: bool
    kind: struct
    name: Config
  - doc: |-
      hangupWatch is the store's hangup watch: an epoll set every pollable
      stored descriptor is in with no event asked — EPOLLHUP and EPOLLERR are
      always reported, as systemd's sd_event_add_io with events 0 —, each once
      (EPOLLONESHOT) under its id, and a pipe that ends the wait.
    fields:
      - name: running
        type: sync.WaitGroup
      - name: wake
        type: "[2]int"
      - name: epfd
        type: int
    kind: struct
    methods:
      - doc: |-
          add watches f under id; false for an object epoll cannot watch (EPERM: a
          regular file, a directory).
        name: add
        params: f *os.File, id uint64
        recv: w *hangupWatch
        results: bool
      - doc: remove takes f out of the set, before it is closed.
        name: remove
        params: f *os.File
        recv: w *hangupWatch
      - doc: |-
          start runs the watch.

          Goroutine lifecycle: one, posting each hangup's id until the wake pipe or a
          post the unit no longer takes ends it; stop joins it.
        name: start
        params: post func(uint64) bool
        recv: w *hangupWatch
      - doc: |-
          run posts each hangup's id until the wake pipe, or a post the unit no
          longer takes, ends it.
        name: run
        params: post func(uint64) bool
        recv: w *hangupWatch
      - doc: |-
          stop ends run, waits for it, then closes the set and the pipe: no wait is
          left on a descriptor number that could be reused.
        name: stop
        recv: w *hangupWatch
      - doc: closeFDs closes the set and the pipe.
        name: closeFDs
        recv: w *hangupWatch
    name: hangupWatch
  - fields:
      - name: units
        type: "[]*frozenUnit"
    kind: struct
    methods:
      - name: Units
        recv: h *HandoverState
        results: "[]string"
