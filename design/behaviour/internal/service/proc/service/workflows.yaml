                  - op: "|="
                    set: ns
                    value: f.ns
                when: f.on
          key: _
          range: flags
          value: f
      - opt:
          do:
            - op: "|="
              set: ns
              value: coreproc.NamespaceUser
          when: ns != 0 && supervisorEUID() != 0
      - return: ns
