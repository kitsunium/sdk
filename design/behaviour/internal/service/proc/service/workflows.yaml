workflows:
  - of: (*actor).dupsOf
    steps:
      - bind: out
        eval: make([]uint64, len(files))
      - loop:
          do:
            - opt:
                do:
                  - set: out[i]
                    value: dupEarlier
                  - continue: true
                when: slices.ContainsFunc(files[:i], func(g *os.File) bool { return sameFile(f, g) })
            - loop:
                do:
                  - opt:
                      do:
                        - set: out[i]
                          value: id
                        - break: true
                      when: sameFile(f, h.file)
                key: id
                range: a.store
                value: h
          key: i
          range: files
          value: f
      - return: out
  - of: (*actor).stored
    steps:
      - bind: out
        eval: make([]listen.NamedFileValue, 0, len(entries))
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: "append(out, listen.NamedFileValue{Name: e.name, File: h.file})"
                init:
                  bind: h
                  eval: a.store[e.id]
                when: h != nil
          key: _
          range: entries
          value: e
      - return: out
  - of: (*HandoverState).Units
    steps:
      - var:
          name: out
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, fu.name)
                when: "!fu.taken"
          key: _
          range: h.units
          value: fu
      - return: out
  - of: (*HandoverState).unit
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: fu
                when: fu.name == name && !fu.taken
          key: _
          range: h.units
          value: fu
      - return: nil
  - of: (*frozenUnit).files
    steps:
      - var:
          name: out
          type: "[]*os.File"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, p.witness)
                when: p.witness != nil
          key: _
          range: fu.procs
          value: p
      - loop:
          do:
            - set: out
              value: append(out, fu.store[id])
          key: _
          range: slices.Sorted(mapKeys(fu.store))
          value: id
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, f)
                when: f != nil
          key: _
          range: "[]*os.File{fu.conn, fu.notify}"
          value: f
      - return: out
  - of: checkRecords
    steps:
      - bind: seen
        eval: map[int]bool{}
