      - id: caller
        kind: actor
      - id: ioStat
        kind: self
      - id: strings
        kind: stdlib
      - id: ioDevice
        kind: internal
      - id: ioKey
        kind: internal
    steps:
      - var:
          name: devices
          type: "[]coreproc.IOStatValue"
      - loop:
          do:
            - bind: fields
              eval: strings.Fields(line)
              to: strings
            - opt:
                do:
                  - continue: true
                when: len(fields) == 0
            - bind: device, ok
              eval: ioDevice(fields[0])
              to: ioDevice
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - loop:
                do:
                  - eval: ioKey(&device, field)
                    to: ioKey
                key: _
                range: fields[1:]
                value: field
            - set: devices
              value: append(devices, device)
          key: line
          range: strings.Lines(content)
      - return: devices
  - of: ioDevice
    participants:
      - id: caller
        kind: actor
      - id: ioDevice
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: majorText, minorText, found
        eval: strings.Cut(field, devSeparator)
        to: strings
      - bind: major, merr
        eval: strconv.ParseUint(majorText, decimalBase, uint32Bits)
        to: strconv
      - bind: minor, nerr
        eval: strconv.ParseUint(minorText, decimalBase, uint32Bits)
        to: strconv
      - return: "coreproc.IOStatValue{Major: uint32(major), Minor: uint32(minor)}, found && merr == nil && nerr == nil"
  - of: ioKey
    participants:
      - id: caller
        kind: actor
      - id: ioKey
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: key, raw, _
        eval: strings.Cut(field, keyValueSeparator)
        to: strings
      - bind: value, err
        eval: strconv.ParseUint(raw, decimalBase, int64Bits)
        to: strconv
      - bind: targets
        eval: "map[string]*uint64{\"rbytes\": &device.RBytes, \"wbytes\": &device.WBytes, \"rios\": &device.RIOs, \"wios\": &device.WIOs}"
      - opt:
          do:
            - set: "*target"
              value: value
          init:
            bind: target, known
            eval: targets[key]
          when: known && err == nil
