    participants:
      - id: caller
        kind: actor
      - id: membership
        kind: self
      - id: membershipIn
        kind: internal
    steps:
      - return: membershipIn(os.ReadFile, dir)
        to: membershipIn
  - of: membershipIn
    participants:
      - id: caller
        kind: actor
      - id: membershipIn
        kind: self
      - id: cgroupfs
        kind: package
      - id: underPoint
        kind: internal
      - id: path
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\", notAGroupDir(dir)"
          when: "!filepath.IsAbs(dir) || filepath.Clean(dir) != dir"
      - bind: v2, _
        eval: cgroupfs.Mounts(readFile)
        to: cgroupfs
      - bind: best, below, found
        eval: cgroupfs.MountValue{}, "", false
      - loop:
          do:
            - bind: rest, holds
              eval: underPoint(mount.Point, dir)
              to: underPoint
            - opt:
                do:
                  - continue: true
                when: "!holds || (found && len(mount.Point) <= len(best.Point))"
            - set: best, below, found
              value: mount, rest, true
          key: _
          range: v2
          value: mount
      - opt:
          do:
            - return: "\"\", notAGroupDir(dir)"
          when: "!found"
      - return: path.Join("/", best.Root, below), nil
        to: path
  - of: underPoint
    participants:
      - id: caller
        kind: actor
      - id: underPoint
        kind: self
      - id: filepath
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - set: point
        to: filepath
        value: filepath.Clean(point)
      - opt:
          do:
            - return: "\"\", true"
          when: dir == point
      - bind: rest, below
        eval: strings.CutPrefix(dir, strings.TrimSuffix(point, "/")+"/")
        to: strings
      - return: rest, below
  - of: notAGroupDir
    participants:
      - id: caller
        kind: actor
      - id: notAGroupDir
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coreproc.InvalidSpec, errs.WrapParams{}, errs.String("dir", dir))
        to: errs
  - of: defaultConfig
    steps:
      - return: "groupConfig{root: mountRoot}"
  - of: applyOptions
    participants:
      - id: caller
        kind: actor
      - id: applyOptions
        kind: self
      - id: defaultConfig
        kind: internal
    steps:
      - bind: cfg
        eval: defaultConfig()
        to: defaultConfig
      - loop:
          do:
            - opt:
                do:
                  - eval: opt(&cfg)
                when: opt != nil
          key: _
          range: opts
          value: opt
      - return: cfg
  - of: WithRoot
    steps:
      - return:
          closure:
            params: c *groupConfig
            steps:
              - set: c.root
                value: root
  - of: WithControllers
    participants:
      - id: caller
        kind: actor
      - id: WithControllers
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: owned
        eval: slices.Clone(ctrls)
        to: slices
      - return:
          closure:
            params: c *groupConfig
            steps:
              - set: c.controllers
                value: append(c.controllers, owned...)
  - of: inTree
    participants:
      - id: caller
        kind: actor
      - id: inTree
        kind: self
      - id: os
        kind: stdlib
      - id: cmp
        kind: stdlib
    steps:
      - bind: tree, err
        eval: os.OpenRoot(root)
        to: os
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: werr
        eval: work(tree)
      - return: cmp.Or(werr, tree.Close())
        to: cmp
  - of: makeTree
    participants:
      - id: caller
        kind: actor
      - id: makeTree
        kind: self
      - id: enableIn
        kind: internal
      - id: m.descend
        kind: internal
      - id: m.undo
        kind: internal
    steps:
      - bind: m
        eval: "&treeMaker{tree: tree, root: root, name: name, ctrls: ctrls}"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: enableIn(tree.WriteFile, ".", root, ctrls)
            to: enableIn
          when: err != nil
      - opt:
          do:
            - eval: m.undo()
              to: m.undo
            - return: err
          init:
            bind: err
            eval: m.descend()
            to: m.descend
          when: err != nil
      - return: nil
  - of: (*treeMaker).descend
    participants:
      - id: caller
        kind: actor
      - id: (*treeMaker).descend
        kind: self
      - id: strings
        kind: stdlib
      - id: filepath
        kind: stdlib
      - id: m.step
        kind: internal
      - id: enableIn
        kind: internal
    steps:
      - bind: elements
        eval: strings.Split(m.name, string(os.PathSeparator))
        to: strings
      - set: m.made
        value: make([]string, 0, len(elements))
      - loop:
          do:
            - bind: rel
              eval: filepath.Join(elements[:i+1]...)
              to: filepath
            - bind: last
              eval: i == len(elements)-1
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: m.step(rel, last)
                  to: m.step
                when: err != nil
            - opt:
                do:
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: enableIn(m.tree.WriteFile, rel, filepath.Join(m.root, rel), m.ctrls)
                        to: enableIn
                      when: err != nil
                when: "!last"
          key: i
          range: elements
      - return: nil
  - of: (*treeMaker).step
    participants:
      - id: caller
        kind: actor
      - id: (*treeMaker).step
        kind: self
      - id: m.tree.Mkdir
        kind: value
      - id: m.tree.Lstat
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: err
        eval: m.tree.Mkdir(rel, controllerPerm)
        to: m.tree.Mkdir
      - opt:
          do:
            - set: m.made
              value: append(m.made, rel)
            - return: nil
          when: err == nil
      - opt:
          do:
            - return: err
          when: last || !errors.Is(err, fs.ErrExist)
      - bind: info, lerr
        eval: m.tree.Lstat(rel)
        to: m.tree.Lstat
      - opt:
          do:
            - return: lerr
          when: lerr != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(coreproc.InvalidSpec, errs.WrapParams{},
                			errs.String("name", m.name), errs.String("element", rel))
              to: errs
          when: "!info.IsDir()"
      - return: nil
  - of: (*treeMaker).undo
    participants:
      - id: caller
        kind: actor
      - id: (*treeMaker).undo
        kind: self
      - id: m.tree.Remove
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                init:
                  bind: err
                  eval: m.tree.Remove(rel)
                  to: m.tree.Remove
                when: err != nil
          key: _
          range: slices.Backward(m.made)
          value: rel
  - of: enableIn
    participants:
      - id: caller
        kind: actor
      - id: enableIn
        kind: self
      - id: enableLine
        kind: internal
      - id: controllerAbsent
        kind: internal
      - id: writeFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: len(ctrls) == 0
      - bind: line
        eval: enableLine(ctrls)
        to: enableLine
      - bind: err
        eval: write(filepath.Join(rel, subtreeControlFile), []byte(line), controllerPerm)
      - opt:
          do:
            - return: nil
          when: err == nil
      - opt:
          do:
            - return: controllerAbsent(err, line, dir)
              to: controllerAbsent
          when: errors.Is(err, fs.ErrNotExist)
      - return: writeFailed(err, subtreeControlFile, dir)
        to: writeFailed
  - of: enableLine
    participants:
      - id: caller
        kind: actor
      - id: enableLine
        kind: self
      - id: line.WriteByte
        kind: value
      - id: line.WriteString
        kind: value
      - id: line.String
        kind: value
    steps:
      - var:
          name: line
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - eval: line.WriteByte(' ')
                    to: line.WriteByte
                when: i > 0
            - eval: line.WriteString(enablePrefix)
              to: line.WriteString
            - eval: line.WriteString(c.String())
              to: line.WriteString
          key: i
          range: ctrls
          value: c
      - return: line.String()
        to: line.String
  - of: validateControllers
    participants:
      - id: caller
        kind: actor
      - id: validateControllers
        kind: self
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: errs.Wrap(coreproc.InvalidSpec, errs.WrapParams{}, errs.String("controller", c.String()))
                    to: errs
                when: "!c.Known()"
          key: _
          range: ctrls
          value: c
      - return: nil
  - of: rootOffers
    participants:
      - id: caller
        kind: actor
      - id: rootOffers
        kind: self
      - id: os
        kind: stdlib
      - id: controllerAbsent
        kind: internal
      - id: strings
        kind: stdlib
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: len(ctrls) == 0
      - bind: listed, err
        eval: os.ReadFile(filepath.Join(dir, controllersFile))
        to: os
      - opt:
          do:
            - return: controllerAbsent(err, enableLine(ctrls), dir)
              to: controllerAbsent
          when: err != nil
      - bind: offer
        eval: strings.TrimSpace(string(listed))
        to: strings
      - bind: offered
        eval: strings.Fields(offer)
        to: strings
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(coreproc.CgroupControllerAbsent, errs.WrapParams{},
                      				errs.String("controller", c.String()), errs.String("dir", dir), errs.String("offered", offer))
                    to: errs
                when: "!slices.Contains(offered, c.String())"
          key: _
          range: ctrls
          value: c
      - return: nil
  - of: controllerAbsent
    participants:
      - id: caller
        kind: actor
      - id: controllerAbsent
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeCgroupControllerAbsent,
          		Reason:   "CGROUP_CONTROLLER_ABSENT",
          		Public:   "The cgroup controller is not available here",
          		Private:  "service/proc/cgroup: the controller is absent from cgroup.controllers or refused by cgroup.subtree_control",
          		ExitCode: exitUnavailable,
          	}, errs.String("controllers", controllers), errs.String("dir", dir))
        to: errs
  - of: writeFailed
    participants:
      - id: caller
        kind: actor
      - id: writeFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeCgroupWriteFailed,
          		Reason:   "CGROUP_WRITE_FAILED",
          		Public:   "Could not write the cgroup controller file",
          		Private:  "service/proc/cgroup: writing a controller file failed (controller disabled or value rejected)",
          		ExitCode: exitOSErr,
          	}, errs.String("file", file), errs.String("dir", dir))
        to: errs
  - of: (*controlGroup).Path
    steps:
      - return: g.dir
  - of: (*controlGroup).EnableControllers
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).EnableControllers
        kind: self
      - id: validateControllers
        kind: internal
      - id: rootOffers
        kind: internal
      - id: enableIn
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: validateControllers(ctrls)
            to: validateControllers
