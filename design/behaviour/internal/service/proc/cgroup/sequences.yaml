        to: deleteSubtree
  - of: deleteSubtree
    participants:
      - id: caller
        kind: actor
      - id: deleteSubtree
        kind: self
      - id: subtreeOf
        kind: internal
      - id: deleteFailed
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: groups, err
        eval: subtreeOf(dir)
        to: subtreeOf
      - opt:
          do:
            - return: deleteFailed(err, dir)
              to: deleteFailed
          when: err != nil
      - opt:
          do:
            - set: groups
              value: groups[1:]
          when: "!withRoot"
      - loop:
          do:
            - bind: rerr
              eval: os.Remove(group)
              to: os
            - opt:
                do:
                  - continue: true
                when: rerr == nil || (group != dir && errors.Is(rerr, fs.ErrNotExist))
            - return: deleteFailed(rerr, group)
              to: deleteFailed
          key: _
          range: slices.Backward(groups)
          value: group
      - return: nil
  - of: subtreeOf
    participants:
      - id: caller
        kind: actor
      - id: subtreeOf
        kind: self
      - id: os
        kind: stdlib
    steps:
      - var:
          name: groups
          type: "[]string"
      - bind: pending
        eval: "[]string{dir}"
      - loop:
          cond: len(pending) > 0
          do:
            - bind: current
              eval: pending[0]
            - set: pending
              value: pending[1:]
            - bind: entries, err
              eval: os.ReadDir(current)
              to: os
            - opt:
                do:
                  - continue: true
                when: err != nil && current != dir && errors.Is(err, fs.ErrNotExist)
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: groups
              value: append(groups, current)
            - loop:
                do:
                  - opt:
                      do:
                        - set: pending
                          value: append(pending, filepath.Join(current, entry.Name()))
                      when: entry.IsDir()
                key: _
                range: entries
                value: entry
