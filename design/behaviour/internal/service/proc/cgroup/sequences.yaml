      - bind: entries, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: pids, nil
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!entry.IsDir()"
            - bind: below, berr
              eval: treeMembers(filepath.Join(dir, entry.Name()))
              to: treeMembers
            - opt:
                do:
                  - continue: true
                when: berr != nil
            - set: pids
              value: append(pids, below...)
          key: _
          range: entries
          value: entry
      - return: pids, nil
  - of: procsOf
    participants:
      - id: caller
        kind: actor
      - id: procsOf
        kind: self
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: content, err
        eval: os.ReadFile(filepath.Join(dir, procsFile))
        to: os
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: fields
        eval: strings.Fields(string(content))
        to: strings
      - bind: pids
        eval: make([]int, 0, len(fields))
      - loop:
          do:
            - opt:
                do:
                  - set: pids
                    value: append(pids, pid)
                init:
                  bind: pid, perr
                  eval: strconv.Atoi(field)
                  to: strconv
                when: perr == nil
          key: _
          range: fields
          value: field
      - return: pids, nil
  - of: signalFailed
    participants:
      - id: caller
        kind: actor
      - id: signalFailed
