  - of: (*controlGroup).SetIOWeight
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).SetIOWeight
        kind: self
      - id: strconv
        kind: stdlib
      - id: invalidValue
        kind: internal
      - id: g.writeController
        kind: internal
    steps:
      - bind: value
        eval: strconv.FormatInt(weight, decimalBase)
        to: strconv
      - opt:
          do:
            - return: invalidValue(ioWeightFile, value)
              to: invalidValue
          when: weight < weightMin || weight > weightMax
      - return: g.writeController(ioWeightFile, ioWeightDefault+value)
        to: g.writeController
  - of: (*controlGroup).SetIOLatency
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).SetIOLatency
        kind: self
      - id: invalidValue
        kind: internal
      - id: strconv
        kind: stdlib
      - id: g.writeController
        kind: internal
    steps:
      - opt:
          do:
            - return: invalidValue(ioLatencyFile, target.String())
              to: invalidValue
          when: target < 0
      - bind: value
        eval: unlimited
      - opt:
          do:
            - set: value
              to: strconv
              value: strconv.FormatInt(int64((target+time.Microsecond-1)/time.Microsecond), decimalBase)
          when: target > 0
      - bind: device
        eval: strconv.FormatUint(uint64(major), decimalBase) + devSeparator + strconv.FormatUint(uint64(minor), decimalBase)
      - return: g.writeController(ioLatencyFile, device+ioLatencyTarget+value)
        to: g.writeController
  - of: (*controlGroup).writeList
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).writeList
        kind: self
      - id: listOf
        kind: internal
      - id: invalidValue
        kind: internal
      - id: g.writeController
        kind: internal
    steps:
      - bind: list, ok
        eval: listOf(values)
        to: listOf
      - opt:
          do:
            - return: invalidValue(file, list)
              to: invalidValue
          when: "!ok"
      - return: g.writeController(file, list)
        to: g.writeController
  - of: listOf
    participants:
      - id: caller
        kind: actor
      - id: listOf
        kind: self
      - id: slices
        kind: stdlib
      - id: intsText
        kind: internal
      - id: list.WriteString
        kind: value
      - id: list.String
        kind: value
    steps:
      - bind: sorted
        eval: slices.Clone(values)
        to: slices
      - eval: slices.Sort(sorted)
        to: slices
      - set: sorted
        to: slices
        value: slices.Compact(sorted)
      - opt:
          do:
            - return: intsText(values), false
              to: intsText
          when: len(sorted) > 0 && sorted[0] < 0
      - var:
          name: list
          type: strings.Builder
      - loop:
          cond: start < len(sorted)
          do:
            - bind: end
              eval: start
            - loop:
                cond: end+1 < len(sorted) && sorted[end+1] == sorted[end]+1
                do:
                  - op: ++
                    set: end
            - opt:
                do:
                  - eval: list.WriteString(listSeparator)
                    to: list.WriteString
                when: list.Len() > 0
            - eval: list.WriteString(strconv.Itoa(sorted[start]))
              to: list.WriteString
            - opt:
                do:
                  - eval: list.WriteString(rangeSeparator)
                    to: list.WriteString
                  - eval: list.WriteString(strconv.Itoa(sorted[end]))
                    to: list.WriteString
                when: end > start
            - set: start
              value: end + 1
          init: start := 0
      - return: list.String(), true
        to: list.String
  - of: intsText
    participants:
      - id: caller
        kind: actor
      - id: intsText
        kind: self
      - id: strconv
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: texts
        eval: make([]string, len(values))
      - loop:
          do:
            - set: texts[i]
              to: strconv
              value: strconv.Itoa(v)
          key: i
          range: values
          value: v
      - return: strings.Join(texts, listSeparator)
        to: strings
  - of: flagOf
    steps:
      - opt:
          do:
            - return: flagOn
          when: enabled
      - return: flagOff
  - of: invalidValue
    participants:
      - id: caller
        kind: actor
      - id: invalidValue
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coreproc.InvalidSpec, errs.WrapParams{}, errs.String("file", file), errs.String("value", value))
        to: errs
  - of: (*controlGroup).Watch
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).Watch
        kind: self
      - id: watchDir
        kind: internal
    steps:
      - return: watchDir(ctx, g.dir)
        to: watchDir
  - of: watchDir
    participants:
      - id: caller
        kind: actor
      - id: watchDir
        kind: self
      - id: syscall
        kind: stdlib
      - id: w.close
        kind: internal
      - id: w.state
        kind: internal
      - id: w.run
        kind: internal
    steps:
      - bind: fd, err
        eval: syscall.InotifyInit1(syscall.IN_CLOEXEC | syscall.IN_NONBLOCK)
        to: syscall
      - opt:
          do:
            - return: nil, cgroupReadFailed(os.NewSyscallError("inotify_init1", err), dir)
          when: err != nil
      - bind: w
        eval: "&watch{notes: os.NewFile(uintptr(fd), \"inotify\"), dir: dir, name: []byte(filepath.Base(dir)), events: noWatch, memory: noWatch, parent: noWatch}"
      - bind: events, err
        eval: syscall.InotifyAddWatch(fd, filepath.Join(dir, eventsFile), syscall.IN_MODIFY)
        to: syscall
      - opt:
          do:
            - eval: w.close()
              to: w.close
            - return: nil, cgroupReadFailed(os.NewSyscallError("inotify_add_watch", err), dir)
          when: err != nil
      - set: w.events
        value: int32(events)
      - opt:
          do:
            - set: w.memory
              value: int32(memory)
          init:
            bind: memory, merr
            eval: syscall.InotifyAddWatch(fd, filepath.Join(dir, memoryEventsFile), syscall.IN_MODIFY)
            to: syscall
          when: merr == nil
      - opt:
          do:
            - set: w.parent
              value: int32(parent)
          init:
            bind: parent, perr
            eval: syscall.InotifyAddWatch(fd, filepath.Dir(dir), goneMask|syscall.IN_ONLYDIR)
            to: syscall
          when: perr == nil
      - bind: first, err
        eval: w.state()
        to: w.state
      - opt:
          do:
            - eval: w.close()
              to: w.close
            - return: nil, err
          when: err != nil
      - bind: out
        eval: make(chan coreproc.GroupEventsValue, 1)
      - send:
          chan: out
          value: first
      - go: w.run(ctx, out, first)
        to: w.run
      - return: out, nil
  - of: (*watch).run
    participants:
      - id: caller
        kind: actor
      - id: (*watch).run
        kind: self
      - id: w.close
        kind: internal
      - id: context
        kind: stdlib
      - id: w.notes.Read
        kind: value
      - id: w.scan
        kind: internal
      - id: w.state
        kind: internal
      - id: publish
        kind: internal
    steps:
      - defer: close(out)
      - defer: w.close()
        to: w.close
      - bind: stop
        eval: context.AfterFunc(ctx, func() { w.expire() })
        to: context
      - defer: stop()
      - bind: buf
        eval: make([]byte, eventsBuffer)
      - loop:
          do:
            - bind: n, err
              eval: w.notes.Read(buf)
              to: w.notes.Read
            - opt:
                do:
                  - return: ""
                when: err != nil || ctx.Err() != nil
            - bind: removed, announced
              eval: w.scan(buf[:n])
              to: w.scan
            - bind: state, serr
              eval: w.state()
              to: w.state
            - opt:
                do:
                  - eval: publish(out, coreproc.GroupEventsValue{})
                    to: publish
                  - return: ""
                when: removed || serr != nil
            - opt:
                do:
                  - eval: publish(out, state)
                    to: publish
                  - set: last
                    value: state
                when: state != last || announced
          forever: true
  - of: (*watch).expire
    participants:
      - id: caller
        kind: actor
      - id: (*watch).expire
        kind: self
      - id: w.notes.SetReadDeadline
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: w.notes.SetReadDeadline(time.Unix(1, 0))
            to: w.notes.SetReadDeadline
          when: err != nil
  - of: (*watch).close
    participants:
      - id: caller
        kind: actor
      - id: (*watch).close
        kind: self
      - id: w.notes.Close
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: w.notes.Close()
            to: w.notes.Close
          when: err != nil
  - of: (*watch).scan
    participants:
      - id: caller
        kind: actor
      - id: (*watch).scan
        kind: self
      - id: binary.NativeEndian.Uint32
        kind: value
    steps:
      - loop:
          cond: off+syscall.SizeofInotifyEvent <= len(records)
          do:
            - bind: wd
              eval: int32(binary.NativeEndian.Uint32(records[off+recordWd:]))
            - bind: mask
              eval: binary.NativeEndian.Uint32(records[off+recordMask:])
              to: binary.NativeEndian.Uint32
            - bind: start
              eval: off + syscall.SizeofInotifyEvent
            - set: "off"
              value: min(start+int(binary.NativeEndian.Uint32(records[off+recordLen:])), len(records))
            - set: removed
              value: w.gone(wd, mask, records[start:off]) || removed
            - set: announced
              value: announced || w.modified(wd, mask)
          init: off := 0
      - return: removed, announced
  - of: (*watch).modified
    steps:
      - return: mask&syscall.IN_MODIFY != 0 && wd != noWatch && (wd == w.events || wd == w.memory)
  - of: (*watch).gone
    participants:
      - id: caller
        kind: actor
      - id: (*watch).gone
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - opt:
          do:
            - return: bytes.Equal(bytes.TrimRight(name, "\x00"), w.name)
              to: bytes
          when: wd == w.parent && mask&goneMask != 0
      - opt:
          do:
            - return: "false"
          when: mask&syscall.IN_IGNORED == 0
      - opt:
          do:
            - set: w.memory
              value: noWatch
          when: wd == w.memory
      - return: wd == w.events
  - of: (*watch).state
    participants:
      - id: caller
        kind: actor
      - id: (*watch).state
        kind: self
      - id: os
        kind: stdlib
      - id: flatKeyed
        kind: internal
    steps:
      - var:
          name: state
          type: coreproc.GroupEventsValue
      - bind: content, err
        eval: os.ReadFile(filepath.Join(w.dir, eventsFile))
        to: os
      - opt:
          do:
            - return: state, cgroupReadFailed(err, w.dir)
          when: err != nil
      - eval: flatKeyed(string(content), func(key string, value int64) { eventKey(&state, key, value) })
        to: flatKeyed
      - opt:
          do:
            - opt:
                do:
                  - eval: flatKeyed(string(memory), func(key string, value int64) { memoryEvent(&state.MemoryEvents, key, value) })
                    to: flatKeyed
                init:
                  bind: memory, merr
                  eval: os.ReadFile(filepath.Join(w.dir, memoryEventsFile))
                  to: os
                when: merr == nil
          when: w.memory != noWatch
      - return: state, nil
  - of: eventKey
    steps:
      - switch:
          cases:
            - case: "\"populated\""
              do:
                - set: state.Populated
                  value: value != 0
            - case: "\"frozen\""
              do:
                - set: state.Frozen
                  value: value != 0
            - default: true
          "on": strings.TrimSpace(key)
  - of: publish
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: out <- v
                    do:
                      - return: ""
                  - comm: _, open := <-out
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!open"
          forever: true
