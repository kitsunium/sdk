          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeSignalFailed,
          		Reason:   "SIGNAL_FAILED",
          		Public:   "Could not deliver the signal",
          		Private:  "service/proc: kill(2) failed for the target pid or process group",
          		ExitCode: exitOSErr,
          	}, errs.Int("pid", pid))
        to: errs
