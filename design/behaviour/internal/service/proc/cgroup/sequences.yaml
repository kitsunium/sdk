  - of: statFrom
    participants:
      - id: caller
        kind: actor
      - id: statFrom
        kind: self
      - id: flatKeyed
        kind: internal
    steps:
      - var:
          name: stat
          type: coreproc.GroupStatValue
      - bind: cpu, err
        eval: readFile(filepath.Join(dir, cpuStatFile))
      - opt:
          do:
            - return: stat, cgroupReadFailed(err, dir)
          when: err != nil
      - eval: flatKeyed(string(cpu), func(key string, value int64) { cpuStat(&stat, key, value) })
        to: flatKeyed
      - bind: optional
        eval:
          closure:
            params: name string, read func(content string)
            steps:
              - bind: content, rerr
                eval: readFile(filepath.Join(dir, name))
              - opt:
                  do:
                    - set: stat.Partial
                      value: "true"
                    - return: ""
                  when: rerr != nil
              - eval: read(string(content))
      - eval: optional(memoryCurrentFile, func(c string) { stat.MemoryCurrent = single(c) })
      - eval: optional(memoryPeakFile, func(c string) { stat.MemoryPeak = single(c) })
      - eval: optional(pidsCurrentFile, func(c string) { stat.PidsCurrent = single(c) })
      - eval: |-
          optional(memoryEventsFile, func(c string) {
          		flatKeyed(c, func(key string, value int64) { memoryEvent(&stat.MemoryEvents, key, value) })
          	})
      - eval: optional(ioStatFile, func(c string) { stat.IO = ioStat(c) })
      - return: stat, nil
  - of: cpuStat
    steps:
      - switch:
          cases:
            - case: "\"usage_usec\""
              do:
                - set: stat.CPUUsage
                  value: time.Duration(value) * time.Microsecond
            - case: "\"user_usec\""
              do:
                - set: stat.CPUUser
                  value: time.Duration(value) * time.Microsecond
            - case: "\"system_usec\""
              do:
                - set: stat.CPUSystem
                  value: time.Duration(value) * time.Microsecond
            - case: "\"nr_throttled\""
              do:
                - set: stat.NrThrottled
                  value: value
            - case: "\"throttled_usec\""
              do:
                - set: stat.ThrottledTime
                  value: time.Duration(value) * time.Microsecond
            - default: true
          "on": key
  - of: memoryEvent
    steps:
      - switch:
          cases:
            - case: "\"low\""
              do:
                - set: events.Low
                  value: value
            - case: "\"high\""
              do:
                - set: events.High
                  value: value
            - case: "\"max\""
              do:
                - set: events.Max
                  value: value
            - case: "\"oom\""
              do:
                - set: events.OOM
                  value: value
            - case: "\"oom_kill\""
              do:
                - set: events.OOMKill
                  value: value
            - default: true
          "on": key
