            - return: err
          init:
            bind: err
            eval: rootOffers(g.dir, ctrls)
            to: rootOffers
          when: err != nil
      - return: enableIn(os.WriteFile, g.dir, g.dir, ctrls)
        to: enableIn
  - of: (*controlGroup).Delegate
    participants:
      - id: caller
        kind: actor
      - id: (*controlGroup).Delegate
        kind: self
      - id: errs
        kind: package
      - id: delegateIn
        kind: internal
    steps:
      - opt:
          do:
            - return: errs.Wrap(coreproc.InvalidSpec, errs.WrapParams{}, errs.Int("uid", uid), errs.Int("gid", gid))
              to: errs
          when: uid < -1 || gid < -1
      - return: delegateIn(g.dir, delegationFiles(os.ReadFile), uid, gid, os.Lchown)
        to: delegateIn
  - of: delegationFiles
    participants:
      - id: caller
        kind: actor
      - id: delegationFiles
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: listed, err
        eval: readFile(delegateList)
      - opt:
          do:
            - return: slices.Clone(documentedDelegation)
              to: slices
          when: err != nil
      - bind: files
        eval: make([]string, 0, len(documentedDelegation))
      - loop:
          do:
            - opt:
                do:
                  - set: files
                    value: append(files, name)
                when: name != "." && name != ".." && filepath.Base(name) == name
          key: name
          range: strings.FieldsSeq(string(listed))
      - opt:
          do:
            - return: slices.Clone(documentedDelegation)
              to: slices
          when: len(files) == 0
      - return: files
  - of: delegateIn
    participants:
      - id: caller
        kind: actor
      - id: delegateIn
        kind: self
      - id: writeFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: writeFailed(err, ".", dir)
              to: writeFailed
          init:
            bind: err
            eval: chown(dir, uid, gid)
          when: err != nil
      - loop:
          do:
            - bind: err
              eval: chown(filepath.Join(dir, name), uid, gid)
            - opt:
                do:
                  - continue: true
                when: err == nil || errors.Is(err, fs.ErrNotExist)
            - return: writeFailed(err, name, dir)
              to: writeFailed
          key: _
          range: files
          value: name
      - return: nil
