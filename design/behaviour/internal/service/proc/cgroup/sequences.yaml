          		Reason:   "CGROUP_DELETE_FAILED",
          		Public:   "Could not delete the control group",
          		Private:  "service/proc/cgroup.Delete: rmdir of the control group failed (still populated?)",
          		ExitCode: exitOSErr,
          	}, errs.String("dir", dir))
        to: errs
