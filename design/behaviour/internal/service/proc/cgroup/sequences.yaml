    participants:
      - id: caller
        kind: actor
      - id: flatKeyed
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: key, raw, found
              eval: strings.Cut(strings.TrimSpace(line), " ")
              to: strings
            - bind: value, err
              eval: strconv.ParseInt(strings.TrimSpace(raw), decimalBase, int64Bits)
              to: strconv
            - opt:
                do:
                  - eval: visit(key, value)
                when: found && err == nil
          key: line
          range: strings.Lines(content)
  - of: single
