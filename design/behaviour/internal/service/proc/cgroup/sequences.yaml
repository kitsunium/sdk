        kind: actor
      - id: (*signalPass).reach
        kind: self
      - id: signalFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: pid <= 0 || pid == p.self || p.signalled[pid]
      - set: p.signalled[pid]
        value: "true"
      - bind: kerr
        eval: p.kill(pid)
      - opt:
          do:
            - set: p.failure
              to: signalFailed
              value: signalFailed(kerr, pid)
          when: kerr != nil && !errors.Is(kerr, syscall.ESRCH) && p.failure == nil
      - return: "true"
