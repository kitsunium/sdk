# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      controllersFile is the cgroup v2 marker: its presence under the mount proves
      the unified hierarchy is in use (cgroup v1 has no such file at the root).
    items:
      - name: controllersFile
        type: string
        value: "\"cgroup.controllers\""
    name: controllersFile
  - doc: |-
      procsFile is the controller file that attaches a process to a group when its
      pid is written, one pid per write (cgroup.procs).
    items:
      - name: procsFile
        type: string
        value: "\"cgroup.procs\""
    name: procsFile
  - doc: |-
      unlimited is the literal cgroup v2 writes for "no limit" on the numeric
      controller files (memory.max, pids.max, and the quota field of cpu.max).
    items:
      - name: unlimited
        type: string
        value: "\"max\""
    name: unlimited
  - doc: |-
      controllerPerm is the mode for a freshly created control-group directory;
      the kernel ignores the bits but mkdir requires a mode argument.
    items:
      - name: controllerPerm
        type: os.FileMode
        value: "0o755"
    name: controllerPerm
  - doc: decimalBase is the radix used when rendering pids and limit values.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      killFile is the cgroup v2 interface file that, written "1", atomically SIGKILLs
      every member of the group and its subtree (kernel >= 5.14).
    items:
      - name: killFile
        type: string
        value: "\"cgroup.kill\""
    name: killFile
  - doc: |-
      freezeFile is the cgroup v2 interface file that quiesces ("1") or resumes ("0")
      the whole group (kernel >= 5.2).
    items:
      - name: freezeFile
        type: string
        value: "\"cgroup.freeze\""
    name: freezeFile
  - doc: killTrigger is the value written to cgroup.kill to fire the atomic kill.
    items:
      - name: killTrigger
        type: string
        value: "\"1\""
    name: killTrigger
  - doc: |-
      freezeOn / freezeOff are the values written to cgroup.freeze to stop or resume
      the group.
    grouped: true
    items:
      - name: freezeOn
        type: string
        value: "\"1\""
      - name: freezeOff
        type: string
        value: "\"0\""
    name: freezeOn
  - doc: |-
      exitUnavailable is sysexits.h EX_UNAVAILABLE (69), the exit status the
      CGROUP_UNAVAILABLE sentinel carries; restated to wrap a cause with matching
      semantics without re-Defining the central code.
    items:
      - name: exitUnavailable
        type: int
        value: "69"
    name: exitUnavailable
  - doc: |-
      exitOSErr is sysexits.h EX_OSERR (71), the exit status the cgroup create /
      write / delete sentinels carry; restated for the same reason.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      exitUsage is sysexits.h EX_USAGE (64), the exit status the INVALID_SPEC
      sentinel carries; restated to wrap a rejected name without re-Defining the
      central code.
    items:
      - name: exitUsage
        type: int
        value: "64"
    name: exitUsage
  - doc: The cgroup v2 files Stat reads (Documentation/admin-guide/cgroup-v2.rst).
    grouped: true
    items:
      - doc: cpuStatFile is the cpu controller's flat-keyed usage, present on every group.
        name: cpuStatFile
        type: string
        value: "\"cpu.stat\""
      - doc: memoryCurrentFile is the memory the group holds now.
        name: memoryCurrentFile
        type: string
        value: "\"memory.current\""
      - doc: memoryPeakFile is the most memory the group held (Linux 5.19).
        name: memoryPeakFile
        type: string
        value: "\"memory.peak\""
      - doc: memoryEventsFile counts what the group's memory limits did.
        name: memoryEventsFile
        type: string
        value: "\"memory.events\""
      - doc: pidsCurrentFile is how many tasks the group holds now.
        name: pidsCurrentFile
        type: string
        value: "\"pids.current\""
      - doc: ioStatFile is the I/O per device, one nested-keyed line each.
        name: ioStatFile
        type: string
        value: "\"io.stat\""
      - doc: devSeparator splits "MAJ:MIN" in io.stat.
        name: devSeparator
        type: string
        value: "\":\""
      - doc: keyValueSeparator splits "key=value" in io.stat.
        name: keyValueSeparator
        type: string
        value: "\"=\""
      - doc: int64Bits and uint32Bits are the widths the counters parse into.
        name: int64Bits
        type: int
        value: "64"
      - name: uint32Bits
        type: int
        value: "32"
      - doc: |-
          exitIOErr is sysexits.h EX_IOERR (74), the exit status CGROUP_READ_FAILED
          carries; restated to wrap a cause without re-Defining the central code.
        name: exitIOErr
        type: int
        value: "74"
    name: cpuStatFile
  - doc: |-
      maxSignalPasses bounds Signal's re-reads of cgroup.procs: a tree that
      forks faster than it is signalled, and ignores the signal, cannot hold the
      caller forever.
    items:
      - name: maxSignalPasses
        type: int
        value: "64"
    name: maxSignalPasses
  - doc: |-
      mountRoot is the canonical mount point of the unified cgroup v2 hierarchy.
      Exposed as the default root so Option can override it for tests against a
      delegated sub-tree.
    items:
      - name: mountRoot
        type: string
        value: "\"/sys/fs/cgroup\""
    name: mountRoot
  - doc: |-
      The cgroup v2 files a group's place in the hierarchy is read and written
      through (Documentation/admin-guide/cgroup-v2.rst).
    grouped: true
    items:
      - doc: subtreeControlFile enables controllers for the groups beneath a group.
        name: subtreeControlFile
        type: string
        value: "\"cgroup.subtree_control\""
      - doc: threadsFile lists the group's threads; delegated with cgroup.procs.
        name: threadsFile
        type: string
        value: "\"cgroup.threads\""
      - doc: |-
          delegateList is where the kernel lists the files a delegation hands over
          (Linux 4.15).
        name: delegateList
        type: string
        value: "\"/sys/kernel/cgroup/delegate\""
      - doc: enablePrefix marks a controller enabled in cgroup.subtree_control.
        name: enablePrefix
        type: string
        value: "\"+\""
    name: subtreeControlFile
  - doc: |-
      The cgroup v2 interface files GroupTuner writes
      (Documentation/admin-guide/cgroup-v2.rst).
    grouped: true
    items:
      - doc: memoryMinFile is the hard memory protection.
        name: memoryMinFile
        type: string
        value: "\"memory.min\""
      - doc: memoryLowFile is the best-effort memory protection.
        name: memoryLowFile
        type: string
        value: "\"memory.low\""
      - doc: memoryHighFile is the memory throttle.
        name: memoryHighFile
        type: string
        value: "\"memory.high\""
      - doc: memorySwapMaxFile is the swap limit.
        name: memorySwapMaxFile
        type: string
        value: "\"memory.swap.max\""
      - doc: memoryZswapMaxFile is the zswap pool limit.
        name: memoryZswapMaxFile
        type: string
        value: "\"memory.zswap.max\""
      - doc: memoryZswapWritebackFile allows zswap writeback to swap (Linux 6.8).
        name: memoryZswapWritebackFile
        type: string
        value: "\"memory.zswap.writeback\""
      - doc: memoryOOMGroupFile makes the OOM killer take the whole group.
        name: memoryOOMGroupFile
        type: string
        value: "\"memory.oom.group\""
      - doc: cpuWeightFile is the group's CPU share.
        name: cpuWeightFile
        type: string
        value: "\"cpu.weight\""
      - doc: cpuMaxBurstFile is the CPU time borrowable above cpu.max's quota.
        name: cpuMaxBurstFile
        type: string
        value: "\"cpu.max.burst\""
      - doc: cpusetCPUsFile lists the CPUs the group may run on.
        name: cpusetCPUsFile
        type: string
        value: "\"cpuset.cpus\""
      - doc: cpusetMemsFile lists the memory nodes the group may allocate on.
        name: cpusetMemsFile
        type: string
        value: "\"cpuset.mems\""
      - doc: ioWeightFile is the group's I/O share.
        name: ioWeightFile
        type: string
        value: "\"io.weight\""
      - doc: ioLatencyFile is the I/O latency protection, per device.
        name: ioLatencyFile
        type: string
        value: "\"io.latency\""
      - doc: weightMin and weightMax bound cpu.weight and io.weight.
        name: weightMin
        type: int64
        value: "1"
      - name: weightMax
        type: int64
        value: "10000"
      - doc: ioWeightDefault prefixes io.weight's default for every device.
        name: ioWeightDefault
        type: string
        value: "\"default \""
      - doc: ioLatencyTarget prefixes io.latency's target, in microseconds.
        name: ioLatencyTarget
        type: string
        value: "\" target=\""
      - doc: flagOn and flagOff are the boolean files' values.
        name: flagOn
        type: string
        value: "\"1\""
      - name: flagOff
        type: string
        value: "\"0\""
      - doc: "listSeparator and rangeSeparator write a cpuset list: \"0-3,8\"."
        name: listSeparator
        type: string
        value: "\",\""
      - name: rangeSeparator
        type: string
        value: "\"-\""
    name: memoryMinFile
  - doc: The files and the inotify(7) record a watch reads.
    grouped: true
    items:
      - doc: eventsFile is the group's populated and frozen keys (cgroup.events).
        name: eventsFile
        type: string
        value: "\"cgroup.events\""
      - doc: |-
          eventsBuffer holds many records: a burst is read in few reads, and a
          queue overflow is harmless because every read is followed by a fresh
          read of the files.
        name: eventsBuffer
        type: int
        value: "4096"
      - doc: noWatch is the descriptor of a watch that was not added or is gone.
        name: noWatch
        type: int32
        value: "-1"
      - doc: |-
          recordWd, recordMask and recordLen are the offsets of struct
          inotify_event's wd, mask and len.
        name: recordWd
        type: int
        value: "0"
      - name: recordMask
        type: int
        value: "4"
      - name: recordLen
        type: int
        value: "12"
      - doc: |-
          goneMask is what the parent's watch hears of the group's removal or
          rename: cgroupfs removes a group's files without an IN_IGNORED for a
          watch on them, and only the parent's IN_DELETE says the group went
          (measured on Linux 6.12).
        name: goneMask
        type: uint32
        value: syscall.IN_DELETE | syscall.IN_MOVED_FROM
    name: eventsFile
