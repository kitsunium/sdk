apiVersion: design/behaviour/v1
constants:
  - doc: |-
      controllersFile is the cgroup v2 marker: its presence under the mount proves
      the unified hierarchy is in use (cgroup v1 has no such file at the root).
    items:
      - name: controllersFile
        type: string
        value: "\"cgroup.controllers\""
    name: controllersFile
  - doc: |-
      procsFile is the controller file that attaches a process to a group when its
      pid is written, one pid per write (cgroup.procs).
    items:
      - name: procsFile
        type: string
        value: "\"cgroup.procs\""
    name: procsFile
  - doc: |-
      unlimited is the literal cgroup v2 writes for "no limit" on the numeric
      controller files (memory.max, pids.max, and the quota field of cpu.max).
    items:
      - name: unlimited
        type: string
        value: "\"max\""
    name: unlimited
  - doc: |-
      controllerPerm is the mode for a freshly created control-group directory;
      the kernel ignores the bits but mkdir requires a mode argument.
    items:
      - name: controllerPerm
        type: os.FileMode
        value: "0o755"
    name: controllerPerm
  - doc: decimalBase is the radix used when rendering pids and limit values.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      killFile is the cgroup v2 interface file that, written "1", atomically SIGKILLs
      every member of the group and its subtree (kernel >= 5.14).
    items:
      - name: killFile
        type: string
        value: "\"cgroup.kill\""
    name: killFile
  - doc: |-
      freezeFile is the cgroup v2 interface file that quiesces ("1") or resumes ("0")
      the whole group (kernel >= 5.2).
    items:
      - name: freezeFile
        type: string
        value: "\"cgroup.freeze\""
    name: freezeFile
  - doc: killTrigger is the value written to cgroup.kill to fire the atomic kill.
    items:
      - name: killTrigger
        type: string
        value: "\"1\""
    name: killTrigger
  - doc: |-
      freezeOn / freezeOff are the values written to cgroup.freeze to stop or resume
      the group.
    grouped: true
    items:
      - name: freezeOn
        type: string
        value: "\"1\""
      - name: freezeOff
        type: string
        value: "\"0\""
    name: freezeOn
  - doc: |-
      exitUnavailable is sysexits.h EX_UNAVAILABLE (69), the exit status the
      CGROUP_UNAVAILABLE sentinel carries; restated to wrap a cause with matching
      semantics without re-Defining the central code.
    items:
      - name: exitUnavailable
        type: int
        value: "69"
    name: exitUnavailable
  - doc: |-
      exitOSErr is sysexits.h EX_OSERR (71), the exit status the cgroup create /
      write / delete sentinels carry; restated for the same reason.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      exitUsage is sysexits.h EX_USAGE (64), the exit status the INVALID_SPEC
      sentinel carries; restated to wrap a rejected name without re-Defining the
      central code.
    items:
      - name: exitUsage
        type: int
        value: "64"
    name: exitUsage
  - doc: |-
      mountRoot is the canonical mount point of the unified cgroup v2 hierarchy.
      Exposed as the default root so Option can override it for tests against a
      delegated sub-tree.
    items:
      - name: mountRoot
        type: string
        value: "\"/sys/fs/cgroup\""
    name: mountRoot
