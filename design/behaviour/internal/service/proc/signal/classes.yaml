constants:
  - doc: receivedSuffix closes a ReceivedError's message.
    items:
      - name: receivedSuffix
        type: string
        value: "\" received\""
    name: receivedSuffix
  - doc: |-
      exitOSErr is sysexits.h EX_OSERR — the exit status RelayFailed carries so a
      supervisor surfacing err.ExitCode() reports an OS-level fault, not a generic 70.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      sendValueExitCode is sysexits.h EX_OSERR (71), the exit status the proc
      domain gives an OS-level operation failure.
    items:
      - name: sendValueExitCode
        type: int
        value: "71"
    name: sendValueExitCode
  - doc: "siCodeOffset is si_code, the third int: si_signo, si_errno, si_code."
    items:
      - name: siCodeOffset
        type: int
        value: "8"
    name: siCodeOffset
  - doc: |-
      The Linux siginfo_t rt_sigqueueinfo(2) reads (include/uapi/asm-generic/
      siginfo.h), laid out by hand because the standard library declares none.
    grouped: true
    items:
      - doc: "siginfoSize is SI_MAX_SIZE: the kernel copies 128 bytes whatever the arch."
        name: siginfoSize
        type: int
        value: "128"
      - doc: siSignoOffset is si_signo, first on every arch.
        name: siSignoOffset
        type: int
        value: "0"
      - doc: |-
          siQueue is SI_QUEUE (-1, as the kernel's 32-bit int writes it), the
          si_code sigqueue(3) sends: a value from a process, which the kernel
          accepts from a sender that is not the target.
        name: siQueue
        type: uint32
        value: 1<<32 - 1
      - doc: pointerSize is the width of the pointer _sifields holds, its alignment.
        name: pointerSize
        type: int
        value: int(unsafe.Sizeof(uintptr(0)))
      - doc: wideWord is the pointer width at which si_value holds 64 bits.
        name: wideWord
        type: int
        value: "8"
      - doc: |-
          siRTPidOffset is _sifields._rt._pid: after three ints, aligned to the
          pointer the union holds — 16 on a 64-bit arch, 12 on a 32-bit one.
        name: siRTPidOffset
        type: int
        value: (3*4 + pointerSize - 1) / pointerSize * pointerSize
      - doc: siRTUidOffset is _rt._uid.
        name: siRTUidOffset
        type: int
        value: siRTPidOffset + 4
      - doc: siRTValueOffset is _rt._sigval, a pointer-sized union.
        name: siRTValueOffset
        type: int
        value: siRTPidOffset + 8
    name: siginfoSize
