functions:
  - doc: |-
      Relay reads signals from src and forwards each to target via kill(2) until src
      is closed. A positive target is a pid; a target below -1 addresses the process
      group whose id is -target (the kill(2) negative-pid convention). The reserved
      values 0 (the caller's own process group) and -1 (every process the caller may
      signal) are refused up front with a RelayFailed error before any delivery, so a
      zero-value or mis-computed Target cannot fan a signal out to unintended
      recipients. The first delivery failure stops the relay and returns a
      RelayFailed error wrapping the kill(2) cause; a clean drain of src returns nil.
    name: Relay
    params: src <-chan coreproc.Signal, target Target
    results: error
  - name: Notify
    params: sigs ...coreproc.Signal
    results: <-chan coreproc.Signal, func()
  - doc: |-
      translate registers osSigs on src, signals readiness via ready, then pumps
      os.Signal deliveries onto dst as typed Signals until done is closed. Its defer
      unregisters the os/signal subscription and closes dst so blocked readers
      observe the end of stream — owning the full registration lifecycle here keeps
      Notify's teardown a single channel close.
    name: translate
    params: |2

      	src chan os.Signal,
      	dst chan<- coreproc.Signal,
      	done <-chan struct{},
      	ready chan<- struct{},
      	osSigs []os.Signal,
  - doc: |-
      toSignal re-keys an os.Signal carrier back to the typed Signal. os/signal only
      ever delivers syscall.Signal values; a non-syscall carrier collapses to the
      reserved invalid signal rather than panicking.
    name: toSignal
    params: s os.Signal
    results: coreproc.Signal
  - doc: |-
      forward sends sig on dst but yields to a concurrent teardown, reporting
      whether the value was delivered (false means teardown won the race).
    name: forward
    params: dst chan<- coreproc.Signal, done <-chan struct{}, sig coreproc.Signal
    results: bool
