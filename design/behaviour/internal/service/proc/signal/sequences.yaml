          do:
            - return: timer, make(chan time.Time)
          when: window <= 0
      - opt:
          do:
            - set: timer
              to: clk.NewTimer
              value: clk.NewTimer(window)
            - return: timer, timer.C()
          when: timer == nil
      - eval: timer.Reset(window)
        to: timer.Reset
      - return: timer, timer.C()
  - of: closeIfDue
    steps:
      - select:
          cases:
            - comm: <-windowEnds
              do:
                - return: nil
            - default: true
              do:
                - return: windowEnds
  - of: run
    steps:
      - opt:
          do:
            - eval: fn(sig)
          when: fn != nil
  - of: Relay
    participants:
