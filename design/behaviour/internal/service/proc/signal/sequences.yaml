          name: once
          type: sync.Once
      - set: stop
        value:
          closure:
            steps:
              - eval: |-
                  once.Do(func() {
                  			unsubscribe()
                  			cancel(nil)
                  			<-done
                  		})
                to: once.Do
      - return: ctx, stop
  - of: cancelOnSignal
