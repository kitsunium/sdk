          name: once
          type: sync.Once
      - return:
          closure:
            steps:
              - eval: |-
                  once.Do(func() {
                  			unsubscribe()
                  			<-done
                  		})
                to: once.Do
  - of: escalate
    participants:
      - id: caller
        kind: actor
      - id: escalate
        kind: self
