      - pick
    name: proc.go
  - decls:
      - sockcred2Version
      - Sockcred2
    name: sockcred.go
functions:
  - name: ProcRequest
    params: goos, goarch string, pid int
    results: mib []int32, size int, ok bool
  - name: ProcRecord
    params: goos, goarch string, pid int, buf []byte
    results: start int64, ruid, euid int, ok bool
  - doc: readInt32 reads the signed 32-bit integer at off.
    name: readInt32
    params: buf []byte, off int
    results: int64
  - doc: readField reads an unsigned integer of f's width at f's offset.
    name: readField
    params: buf []byte, f field
    results: uint64
  - doc: |-
      layoutOf returns the record layout of goos and goarch, nil where this
      package holds none: Linux reads /proc, and illumos, Solaris and Windows
      have no such record.
    name: layoutOf
    params: goos, goarch string
    results: "*procLayout"
  - doc: |-
      freeBSDLayout returns FreeBSD's struct kinfo_proc on goarch, nil on an
      architecture FreeBSD has no Go port for.
    name: freeBSDLayout
    params: goarch string
    results: "*procLayout"
  - doc: pick returns l when ok, nil otherwise.
    name: pick
    params: ok bool, l *procLayout
    results: "*procLayout"
  - name: Sockcred2
    params: data []byte
    results: pid, uid, gid int, ok bool
imports:
  binary: encoding/binary
  math: math
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/internal/bsdabi
  name: bsdabi
  purpose: "Package bsdabi decodes, from their bytes, the records the BSD kernels and darwin hand the proc family: a process's kinfo_proc (kinfo_proc2 on NetBSD), read by sysctl(3) for its start time and its users, and the sockcred2 FreeBSD attaches to a datagram for its sender."
types:
  - doc: "field is one integer of a record: its offset and its width in bytes."
    fields:
      - doc: off is the offset from the record's start.
        name: "off"
        type: int
      - doc: width is 4 or 8.
        name: width
        type: int
    kind: struct
    name: field
  - doc: |-
      procLayout is where one kernel's process record keeps what ProcRecord
      reads: the record's size, a structure-size field to check it by, the pid
      to check it against, the users and the start time.
    fields:
      - doc: "op is the second name of the sysctl: KERN_PROC or KERN_PROC2."
        name: op
        type: int32
      - doc: sized is true where the name ends with the element size and count.
        name: sized
        type: bool
      - doc: size is the buffer the record fills.
        name: size
        type: int
      - doc: |-
          exact is true where the record is exactly size bytes; false where it is
          at least the prefix read (DragonFly).
        name: exact
        type: bool
      - doc: |-
          structSize is the offset of a field holding the record's own size,
          noStructSize when there is none.
        name: structSize
        type: int
      - doc: pid, ruid and euid are 32-bit fields.
        name: pid
        type: int
      - doc: pid, ruid and euid are 32-bit fields.
        name: ruid
        type: int
      - doc: pid, ruid and euid are 32-bit fields.
        name: euid
        type: int
      - doc: sec and usec are the start time's halves.
        name: sec
        type: field
      - doc: sec and usec are the start time's halves.
        name: usec
        type: field
    kind: struct
    methods:
      - doc: |-
          fits reports whether buf is a whole record of l: its size, and the size it
          states where it states one.
        name: fits
        params: buf []byte
        recv: l *procLayout
        results: bool
      - doc: end is the offset just past the farthest field l reads.
        name: end
        recv: l *procLayout
        results: int
    name: procLayout
vars:
  - grouped: true
    items:
      - doc: freeBSDLP64 is struct kinfo_proc on amd64, arm64 and riscv64.
        name: freeBSDLP64
        value: |-
          procLayout{
          		op: kernProc, size: freeBSDLP64Size, exact: true, structSize: freeBSDStructSize,
          		pid: freeBSDLP64Pid, ruid: freeBSDLP64Ruid, euid: freeBSDLP64Euid,
          		sec: field{freeBSDLP64Sec, int64Bytes}, usec: field{freeBSDLP64Usec, int64Bytes},
          	}
      - doc: freeBSD386 is struct kinfo_proc on i386.
        name: freeBSD386
        value: |-
          procLayout{
          		op: kernProc, size: freeBSD386Size, exact: true, structSize: freeBSDStructSize,
          		pid: freeBSD32Pid, ruid: freeBSD32Ruid, euid: freeBSD32Euid,
          		sec: field{freeBSD32Sec, int32Bytes}, usec: field{freeBSD386Usec, int32Bytes},
          	}
      - doc: freeBSDArm is struct kinfo_proc on arm.
        name: freeBSDArm
        value: |-
          procLayout{
          		op: kernProc, size: freeBSDArmSize, exact: true, structSize: freeBSDStructSize,
          		pid: freeBSD32Pid, ruid: freeBSD32Ruid, euid: freeBSD32Euid,
          		sec: field{freeBSD32Sec, int64Bytes}, usec: field{freeBSDArmUsec, int32Bytes},
          	}
      - doc: dragonFly is struct kinfo_proc's prefix on amd64.
        name: dragonFly
        value: |-
          procLayout{
          		op: kernProc, size: dragonFlyBuffer, structSize: noStructSize,
          		pid: dragonFlyPid, ruid: dragonFlyRuid, euid: dragonFlyEuid,
          		sec: field{dragonFlySec, int64Bytes}, usec: field{dragonFlyUsec, int64Bytes},
          	}
      - doc: darwin is struct kinfo_proc on amd64 and arm64.
        name: darwin
        value: |-
          procLayout{
          		op: kernProc, size: darwinSize, exact: true, structSize: noStructSize,
          		pid: darwinPid, ruid: darwinRuid, euid: darwinEuid,
          		sec: field{darwinSec, int64Bytes}, usec: field{darwinUsec, int32Bytes},
          	}
      - doc: openBSD is struct kinfo_proc's prefix on every architecture.
        name: openBSD
        value: |-
          procLayout{
          		op: kernProcOpenBSD, sized: true, size: openBSDPrefix, exact: true, structSize: noStructSize,
          		pid: openBSDPid, ruid: openBSDRuid, euid: openBSDEuid,
          		sec: field{openBSDSec, int64Bytes}, usec: field{openBSDUsec, int32Bytes},
          	}
      - doc: netBSD is struct kinfo_proc2's prefix on every architecture.
        name: netBSD
        value: |-
          procLayout{
          		op: kernProc2, sized: true, size: netBSDPrefix, exact: true, structSize: noStructSize,
          		pid: netBSDPid, ruid: netBSDRuid, euid: netBSDEuid,
          		sec: field{netBSDSec, int32Bytes}, usec: field{netBSDUsec, int32Bytes},
          	}
    name: freeBSDLP64
