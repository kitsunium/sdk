  - decls: []
    name: doc.go
  - decls:
      - ctlKern
      - int32Bytes
      - freeBSDStructSize
      - dragonFlyBuffer
      - darwinSize
      - openBSDPrefix
      - netBSDPrefix
      - field
      - procLayout
      - freeBSDLP64
      - ProcRequest
      - ProcRecord
      - (*procLayout).fits
      - (*procLayout).end
      - readInt32
      - readField
      - layoutOf
