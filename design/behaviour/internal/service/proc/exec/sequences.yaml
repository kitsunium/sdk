          do:
            - return: |-
                wrapCgroupUnavailable(nil, errs.String("cgroup_path", path),
                			errs.String("reason", "path is not on a cgroup2 filesystem"))
              to: wrapCgroupUnavailable
          when: uint64(st.Type) != cgroup2SuperMagic
      - return: nil
  - of: applyCgroupPlacement
    participants:
      - id: caller
        kind: actor
      - id: applyCgroupPlacement
        kind: self
      - id: filepath
        kind: stdlib
      - id: os
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\""
          when: path == ""
      - bind: procs
        eval: filepath.Join(path, cgroupProcsFile)
        to: filepath
