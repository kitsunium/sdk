            bind: err
            eval: ioctlFile(master, syscall.TIOCSWINSZ, unsafe.Pointer(ws))
            to: ioctlFile
          when: err != nil
      - return: nil
  - of: (*handle).TTY
    steps:
      - return: h.stdio.ptyMaster
  - of: (*handle).Resize
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Resize
