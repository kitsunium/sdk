        eval: resolveGroups(spec.Groups)
        to: resolveGroups
      - opt:
          do:
            - return: nil, sErr
          when: sErr != nil
      - set: out.Groups
        value: groups
      - return: out, nil
  - of: applyUserGroup
    participants:
      - id: caller
        kind: actor
      - id: applyUserGroup
        kind: self
      - id: resolveUser
        kind: internal
      - id: resolveGroup
        kind: internal
    steps:
      - set: out.Uid
        value: uint32(os.Getuid())
      - set: out.Gid
        value: uint32(os.Getgid())
      - opt:
          do:
            - bind: uid, gid, uErr
              eval: resolveUser(spec.User, spec.Group != "")
              to: resolveUser
            - opt:
                do:
                  - return: uErr
                when: uErr != nil
            - set: out.Uid
              value: uid
            - set: out.Gid
              value: gid
          when: spec.User != ""
      - opt:
          do:
            - bind: gid, gErr
              eval: resolveGroup(spec.Group)
              to: resolveGroup
            - opt:
                do:
                  - return: gErr
                when: gErr != nil
            - set: out.Gid
              value: gid
          when: spec.Group != ""
      - return: nil
  - of: resolveUser
    participants:
      - id: caller
        kind: actor
      - id: resolveUser
        kind: self
      - id: strconv
        kind: stdlib
      - id: user
        kind: stdlib
      - id: parseUserIDs
        kind: internal
    steps:
      - opt:
          do:
            - bind: usr, lookErr
              eval: user.LookupId(name)
