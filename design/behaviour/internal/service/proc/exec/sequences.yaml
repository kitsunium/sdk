        eval: p.Stop(context.WithoutCancel(ctx), grace, termSignal)
        to: p.Stop
      - bind: exit, waitErr
        eval: p.Wait()
        to: p.Wait
      - return: exit, errors.Join(ctx.Err(), stopErr, waitErr)
  - of: (*headBuffer).Write
    participants:
      - id: caller
        kind: actor
      - id: (*headBuffer).Write
        kind: self
      - id: b.grow
        kind: internal
    steps:
      - lock:
          mutex: b.mu
      - bind: keep
        eval: min(len(p), b.limit-len(b.buf))
      - set: b.over
        value: b.over || keep < len(p)
      - eval: b.grow(keep)
        to: b.grow
      - set: b.buf
        value: append(b.buf, p[:keep]...)
      - return: len(p), nil
  - of: (*headBuffer).grow
    steps:
      - bind: need
        eval: len(b.buf) + n
      - opt:
          do:
            - return: ""
          when: need <= cap(b.buf)
      - bind: grown
        eval: make([]byte, len(b.buf), min(max(need, 2*cap(b.buf)), b.limit))
      - eval: copy(grown, b.buf)
      - set: b.buf
        value: grown
  - of: (*headBuffer).bytes
    steps:
      - lock:
          mutex: b.mu
      - return: b.buf
  - of: (*headBuffer).truncated
    steps:
      - lock:
          mutex: b.mu
      - return: b.over
  - of: currentHost
    participants:
      - id: caller
        kind: actor
      - id: currentHost
        kind: self
      - id: sandboxHostOverride.Load
        kind: value
    steps:
      - opt:
          do:
            - return: h
          init:
            bind: h
            eval: sandboxHostOverride.Load()
            to: sandboxHostOverride.Load
          when: h != nil
      - return: "&hostKernel"
  - of: LandlockABI
    steps:
      - bind: abi, errno
        eval: currentHost().landlockABI()
      - opt:
          do:
            - return: 0, wrapSandboxUnavailable(errno, errs.String("feature", "landlock"))
          when: errno != 0
      - return: abi, nil
  - of: landlockABIProbe
    participants:
      - id: caller
        kind: actor
      - id: landlockABIProbe
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: r, _, errno
        eval: syscall.Syscall(sysLandlockCreateRuleset, 0, 0, landlockCreateRulesetVersion)
        to: syscall
      - return: int(r), errno
  - of: mountSetattrProbe
    participants:
      - id: caller
        kind: actor
      - id: mountSetattrProbe
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.Syscall6(sysMountSetattr, 0, 0, 0, 0, 0, 0)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: errno == syscall.EINVAL || errno == syscall.EBADF || errno == syscall.EFAULT
      - return: errno
  - of: checkSandbox
    participants:
      - id: caller
        kind: actor
      - id: checkSandbox
        kind: self
      - id: currentHost
        kind: internal
    steps:
      - bind: sb
        eval: spec.Sandbox
      - opt:
          do:
            - return: nil
          when: sb == nil
      - bind: host
        eval: currentHost()
        to: currentHost
      - bind: checks
        eval: |-
          [...]func() error{
          		func() error { return checkSandboxShape(spec) },
          		func() error { return checkSandboxMounts(sb, host) },
          		func() error { return checkCapabilities(sb.Capabilities, host) },
          		func() error { _, _, err := landlockPlan(sb.Landlock, host); return err },
          		func() error { return checkSeccomp(sb.Seccomp, host.seccomp) },
          		func() error { return checkSandboxKernel(sb, host) },
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: check()
                when: err != nil
          key: _
          range: checks
          value: check
      - return: nil
  - of: checkSandboxShape
    participants:
      - id: caller
        kind: actor
      - id: checkSandboxShape
        kind: self
      - id: wrapInvalidSpec
        kind: internal
    steps:
      - bind: sb
        eval: spec.Sandbox
