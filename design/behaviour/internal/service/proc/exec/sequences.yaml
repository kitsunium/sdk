          init:
            bind: status, ok
            eval: claim.Collected()
            to: claim.Collected
          when: ok
      - bind: state, wErr
        eval: proc.Wait()
        to: proc.Wait
      - opt:
          do:
            - eval: claim.Release()
              to: claim.Release
            - return: exitValueFrom(state), false, nil
              to: exitValueFrom
          when: wErr == nil
      - opt:
          do:
            - opt:
                do:
                  - return: exitValue(status.WaitStatus, &status.Rusage), true, nil
                    to: exitValue
                init:
                  bind: status, ok
                  eval: claim.Reclaim()
                  to: claim.Reclaim
                when: ok
          when: errors.Is(wErr, syscall.ECHILD)
      - eval: claim.Release()
        to: claim.Release
      - return: coreproc.ExitValue{}, false, wErr
  - of: (*handle).releaseProc
    participants:
