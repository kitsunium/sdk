  - of: resolveGroups
    participants:
      - id: caller
        kind: actor
      - id: resolveGroups
        kind: self
      - id: resolveGroup
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(names) == 0
      - bind: out
        eval: make([]uint32, 0, len(names))
      - loop:
          do:
            - bind: gid, gErr
              eval: resolveGroup(name)
              to: resolveGroup
            - opt:
                do:
                  - return: nil, gErr
                when: gErr != nil
            - set: out
              value: append(out, gid)
          key: _
          range: names
          value: name
      - return: out, nil
  - of: checkDieWithParent
    steps:
      - return: nil
  - of: setDieWithParent
    participants:
      - id: caller
        kind: actor
      - id: setDieWithParent
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: sig == 0
