                do:
                  - set: value, named
                    value: entryValue, true
                when: found && sameVariable(name, key)
          key: _
          range: env
          value: entry
      - return: value, named
  - of: isExecutable
    participants:
      - id: caller
        kind: actor
      - id: isExecutable
        kind: self
      - id: os
        kind: stdlib
      - id: executableMode
        kind: internal
    steps:
      - bind: info, statErr
        eval: os.Stat(path)
        to: os
      - opt:
          do:
            - return: "false"
          when: statErr != nil || !info.Mode().IsRegular()
      - return: executableMode(info.Mode())
        to: executableMode
  - of: candidates
    steps:
      - return: "[]string{filepath.Join(dir, name)}"
  - of: executableMode
    steps:
      - return: mode&anyExecuteBit != 0
  - of: isPath
    participants:
      - id: caller
        kind: actor
      - id: isPath
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.Contains(name, "/")
        to: strings
  - of: sameVariable
    steps:
      - return: left == right
