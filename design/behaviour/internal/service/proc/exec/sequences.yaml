  - of: checkPTY
    steps:
      - return: nil
  - of: ioctlFile
    participants:
      - id: caller
        kind: actor
      - id: ioctlFile
        kind: self
      - id: f.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
      - id: cmp
