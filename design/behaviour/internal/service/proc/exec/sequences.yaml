  - of: (*handle).awaitKill
    participants:
      - id: caller
        kind: actor
      - id: (*handle).awaitKill
        kind: self
      - id: h.clk.NewTimer
        kind: value
      - id: resend.Stop
        kind: value
    steps:
      - bind: resend
        eval: h.clk.NewTimer(killResendInterval)
        to: h.clk.NewTimer
      - defer: resend.Stop()
        to: resend.Stop
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - comm: <-ctx.Done()
              do:
                - return: true, ctx.Err()
            - comm: <-resend.C()
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - default: true
              do:
                - return: false, nil
  - of: (*handle).signalGroupAllowGone
    participants:
      - id: caller
        kind: actor
      - id: (*handle).signalGroupAllowGone
        kind: self
      - id: h.SignalGroup
        kind: internal
    steps:
      - bind: err
        eval: h.SignalGroup(sig)
        to: h.SignalGroup
      - opt:
          do:
            - return: nil
          when: err != nil && processGone(err)
      - return: err
  - of: (*handle).zombieGroupRefused
    participants:
      - id: caller
        kind: actor
      - id: (*handle).zombieGroupRefused
        kind: self
      - id: h.groupDrains
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: "!zombiesRefused || !h.setpgid || !errs.HasCode(err, coreproc.CodeSignalFailed) || !errors.Is(err, syscall.EPERM)"
      - opt:
          do:
            - return: h.groupDrains()
              to: h.groupDrains
          when: reapedBefore
      - return: h.leaderReaped() || leaderIsZombie(h.pid)
