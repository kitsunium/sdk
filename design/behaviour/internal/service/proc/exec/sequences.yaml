    steps:
      - opt:
          do:
            - return: raw
          when: unitsPerKiB <= 1
      - opt:
          do:
            - return: "0"
          when: raw <= 0
      - bind: kib
        eval: raw / unitsPerKiB
      - opt:
          do:
            - op: ++
              set: kib
          when: raw%unitsPerKiB != 0
      - return: kib
