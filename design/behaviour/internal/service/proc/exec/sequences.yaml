          do:
            - eval: swallowErr(syscall.Close(d.fd))
              to: swallowErr
          key: _
          range: dirs
          value: d
  - of: heldDir.close
    participants:
      - id: caller
        kind: actor
      - id: heldDir.close
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - eval: swallowErr(syscall.Close(d.fd))
        to: swallowErr
  - of: heldEntry.read
    participants:
      - id: caller
