      - bind: start
        eval: "0"
      - opt:
          do:
            - set: start
              value: "1"
          when: strings.HasPrefix(kv, "=")
      - bind: end
        eval: strings.IndexByte(kv[start:], '=')
        to: strings
      - opt:
          do:
            - return: kv
          when: end < 0
      - return: kv[:start+end]
