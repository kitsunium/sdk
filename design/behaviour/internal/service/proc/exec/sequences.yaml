              to: s.drainOutput
          key: i
          range: s.outSrc
      - opt:
          do:
            - go: s.feedInput(s.inDst, s.inSrc)
              to: s.feedInput
          when: s.inDst != nil
  - of: (*stdioState).drainOutput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).drainOutput
        kind: self
      - id: s.wg.Done
