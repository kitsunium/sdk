          do:
            - bind: failed
              eval: wrapSignal(err, errs.Int("target", target), errs.Int("signal", sig.Int()))
              to: wrapSignal
            - opt:
                do:
                  - return: wrapSignal(syscall.ESRCH, errs.Int("target", target), errs.Int("signal", sig.Int()))
                    to: wrapSignal
                when: h.zombieGroupRefused(failed, reapedBefore)
