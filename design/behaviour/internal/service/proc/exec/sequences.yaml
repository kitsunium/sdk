    participants:
      - id: caller
        kind: actor
      - id: maxRSSKB
        kind: self
      - id: peakKiB
        kind: internal
    steps:
      - return: peakKiB(ru.Maxrss, rssUnitsPerKiB)
        to: peakKiB
  - of: writeProcFile
    participants:
      - id: caller
        kind: actor
      - id: writeProcFile
        kind: self
      - id: os
        kind: stdlib
    steps:
