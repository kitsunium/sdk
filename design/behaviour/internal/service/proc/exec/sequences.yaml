          		{spec.FDs == coreproc.FDsInherited, "a sandboxed child inherits only the descriptors it is given"},
          		{sb.Namespaces&^namespaceAll != 0, "unknown namespace"},
          		{!idMapsUsable(sb), "id maps need NamespaceUser, and each line maps an id"},
          		{len(spec.Groups) > 0 && sb.Namespaces&coreproc.NamespaceUser != 0, "a user namespace denies setgroups: no supplementary group can be set"},
          		{!rootUsable(spec), "a root is an absolute path in a mount namespace, and Path a path inside it"},
          	}
      - loop:
          do:
            - opt:
                do:
                  - return: wrapInvalidSpec(errs.String("sandbox", c.why))
                    to: wrapInvalidSpec
                when: c.bad
          key: _
          range: contradictions
          value: c
      - return: nil
  - of: idMapsUsable
    steps:
      - opt:
          do:
            - return: "true"
          when: len(sb.UIDMap) == 0 && len(sb.GIDMap) == 0
      - return: sb.Namespaces&coreproc.NamespaceUser != 0 && idMapsSized(sb.UIDMap) && idMapsSized(sb.GIDMap)
  - of: rootUsable
    steps:
      - bind: sb
        eval: spec.Sandbox
      - opt:
          do:
            - return: "true"
          when: sb.Root == ""
      - return: sb.Namespaces&coreproc.NamespaceMount != 0 && absClean(sb.Root) && strings.Contains(spec.Path, "/")
  - of: absClean
    steps:
      - return: filepath.IsAbs(p) && filepath.Clean(p) == p
  - of: checkSandboxMounts
    participants:
      - id: caller
        kind: actor
      - id: checkSandboxMounts
        kind: self
      - id: wrapInvalidSpec
        kind: internal
      - id: wrapSandboxUnavailable
        kind: internal
    steps:
      - bind: readOnly
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      wrapInvalidSpec(errs.String("sandbox", "a mount needs a mount namespace, a known kind and absolute paths"),
                      				errs.String("target", m.Target))
                    to: wrapInvalidSpec
                when: sb.Namespaces&coreproc.NamespaceMount == 0 || !mountWellFormed(m)
            - set: readOnly
              value: readOnly || m.ReadOnly || m.Kind == coreproc.MountReadOnly
          key: _
          range: sb.Mounts
          value: m
      - opt:
          do:
            - return: nil
          when: "!readOnly"
      - bind: errno
        eval: host.mountSetattr()
      - opt:
          do:
            - return: wrapSandboxUnavailable(errno, errs.String("feature", "mount_setattr"))
              to: wrapSandboxUnavailable
          when: errno != 0
      - return: nil
  - of: mountWellFormed
    steps:
      - bind: bind
        eval: m.Kind == coreproc.MountBind
      - opt:
          do:
            - return: "false"
          when: bind != (m.Source != "") || (bind && !absClean(m.Source))
      - return: m.Kind <= mountKindLast && absClean(m.Target)
  - of: checkCapabilities
    participants:
      - id: caller
        kind: actor
      - id: checkCapabilities
        kind: self
      - id: wrapInvalidSpec
        kind: internal
      - id: capLastCap
        kind: internal
      - id: wrapSandboxUnavailable
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: c == nil
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "an ambient capability lies outside the bounding set"))
              to: wrapInvalidSpec
          when: c.Ambient&^c.Bounding != 0
