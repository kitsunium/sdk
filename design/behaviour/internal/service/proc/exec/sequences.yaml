    steps:
      - eval: swallowErr(h.read.Close())
        to: swallowErr
      - eval: swallowErr(h.write.Close())
        to: swallowErr
  - of: closeHandshake
    participants:
      - id: caller
        kind: actor
      - id: closeHandshake
        kind: self
      - id: hs.closeBoth
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: hs == nil
      - eval: hs.closeBoth()
        to: hs.closeBoth
  - of: handshakeError
