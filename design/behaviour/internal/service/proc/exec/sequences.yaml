    participants:
      - id: caller
        kind: actor
      - id: searchPathOf
        kind: self
      - id: envValue
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - opt:
          do:
            - return: value, true
          init:
            bind: value, named
            eval: envValue(env, pathVariable)
            to: envValue
          when: named
      - return: os.Getenv(pathVariable), false
        to: os
