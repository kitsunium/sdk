        to: user
      - opt:
          do:
            - return: 0, 0, wrapUnknownUser(lookErr, errs.String("user", name))
          when: lookErr != nil
      - return: parseUserIDs(usr)
        to: parseUserIDs
  - of: parseUserIDs
    participants:
      - id: caller
        kind: actor
      - id: parseUserIDs
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: uid64, uErr
        eval: strconv.ParseUint(usr.Uid, idBase, idBits)
        to: strconv
      - opt:
          do:
            - return: 0, 0, wrapUnknownUser(uErr, errs.String("uid", usr.Uid))
          when: uErr != nil
      - bind: gid64, gErr
        eval: strconv.ParseUint(usr.Gid, idBase, idBits)
        to: strconv
      - opt:
          do:
            - return: 0, 0, wrapUnknownGroup(gErr, errs.String("gid", usr.Gid))
          when: gErr != nil
      - return: uint32(uid64), uint32(gid64), nil
  - of: resolveGroup
    participants:
      - id: caller
        kind: actor
      - id: resolveGroup
        kind: self
      - id: strconv
        kind: stdlib
      - id: user
        kind: stdlib
    steps:
      - opt:
          do:
            - return: uint32(n), nil
          init:
            bind: n, convErr
            eval: strconv.ParseUint(name, idBase, idBits)
            to: strconv
          when: convErr == nil
      - bind: grp, lookErr
