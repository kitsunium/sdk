        value: pr
      - set: s.opened
        value: append(s.opened, pr, pw)
      - set: s.closeChild
        value: append(s.closeChild, pr)
      - set: s.inDst, s.inSrc
        value: pw, reader
      - return: nil
  - of: (*stdioState).wireOutput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).wireOutput
        kind: self
      - id: s.wireNull
        kind: internal
      - id: os
        kind: stdlib
      - id: wrapSpawn
        kind: internal
