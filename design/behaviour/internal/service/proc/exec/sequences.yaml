        eval: searchPathOf(spec.Env)
        to: searchPathOf
      - bind: path, lookErr
        eval: lookPath(spec.Path, searchPath, spec.Env)
        to: lookPath
      - opt:
          do:
            - return: spec, wrapSpawn(lookErr, errs.String("path", spec.Path), errs.Bool("from_spec_env", fromSpec))
          when: lookErr != nil
      - opt:
          do:
            - set: spec.Args
              value: "[]string{spec.Path}"
          when: len(spec.Args) == 0
      - set: spec.Path
        value: path
      - return: spec, nil
