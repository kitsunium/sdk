  - of: (*handle).Stop
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Stop
        kind: self
      - id: h.signalGroupAllowGone
        kind: internal
      - id: h.awaitExit
        kind: internal
      - id: h.killUntilReaped
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: h.signalGroupAllowGone(sig)
            to: h.signalGroupAllowGone
          when: err != nil
      - opt:
          do:
            - bind: settled, gracefulErr
              eval: h.awaitExit(ctx, grace)
              to: h.awaitExit
            - opt:
                do:
                  - return: gracefulErr
                when: settled
          when: grace > 0
