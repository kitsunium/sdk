        eval: "coreproc.ExitValue{Code: signalledCode}"
      - opt:
          do:
            - eval: readRusage(ru, &out)
              to: readRusage
          when: ru != nil
      - return: out
  - of: exitValue
    participants:
      - id: caller
        kind: actor
      - id: exitValue
        kind: self
      - id: ws.ExitStatus
        kind: value
      - id: coreproc
        kind: package
      - id: readRusage
        kind: internal
    steps:
      - bind: out
        eval: "coreproc.ExitValue{Code: signalledCode}"
      - opt:
          do:
            - set: out.Code
              to: ws.ExitStatus
              value: ws.ExitStatus()
          when: ws.Exited()
      - opt:
          do:
            - set: out.Signaled
              value: "true"
            - set: out.Signal
              to: coreproc
              value: coreproc.Signal(ws.Signal())
          when: ws.Signaled()
      - opt:
          do:
            - eval: readRusage(ru, &out)
              to: readRusage
          when: ru != nil
      - return: out
  - of: readRusage
    participants:
      - id: caller
        kind: actor
      - id: readRusage
        kind: self
      - id: timevalToDuration
        kind: internal
      - id: maxRSSKB
        kind: internal
    steps:
      - set: out.UserTime
        to: timevalToDuration
        value: timevalToDuration(ru.Utime)
      - set: out.SystemTime
        to: timevalToDuration
        value: timevalToDuration(ru.Stime)
      - set: out.MaxRSS
        to: maxRSSKB
        value: maxRSSKB(ru)
  - of: timevalToDuration
    steps:
      - return: time.Duration(tv.Sec)*time.Second + time.Duration(tv.Usec)*time.Microsecond
  - of: processGone
    steps:
      - return: errs.HasCode(err, coreproc.CodeSignalFailed) && containsESRCH(err)
  - of: newHandshake
    participants:
      - id: caller
        kind: actor
      - id: newHandshake
        kind: self
      - id: os
        kind: stdlib
