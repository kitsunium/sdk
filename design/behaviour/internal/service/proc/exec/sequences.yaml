        to: childwait
      - opt:
          do:
            - return: nil, wrapHandleUnavailable(err, errs.Int("pid", pid))
          when: err != nil
      - opt:
          do:
            - eval: claim.Release()
              to: claim.Release
            - eval: swallowErr(proc.Release())
              to: swallowErr
            - return: nil, wrapAdoptionRefused(nil, errs.Int("pid", pid), errs.String("why", "not a child of this process"))
          when: "!childOf(pid, self)"
