          do:
            - return: wrapSandboxUnavailable(err, errs.String("feature", "cap_last_cap"))
              to: wrapSandboxUnavailable
          when: err != nil
      - opt:
          do:
            - return: wrapSandboxUnavailable(nil, errs.String("feature", "capability"), errs.Int("cap_last_cap", int(last)))
              to: wrapSandboxUnavailable
          when: last < maxCapability && c.Ambient>>(last+1) != 0
      - return: nil
  - of: capLastCap
    participants:
      - id: caller
        kind: actor
      - id: capLastCap
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw, err
        eval: os.ReadFile(host.capLastCap)
        to: os
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: n, err
        eval: strconv.ParseUint(strings.TrimSpace(string(raw)), 10, 32)
        to: strconv
      - opt:
          do:
            - return: 0, syscall.EINVAL
          when: err != nil || uint32(n) > maxCapability
      - return: uint32(n), nil
  - of: landlockPlan
    participants:
      - id: caller
        kind: actor
      - id: landlockPlan
        kind: self
      - id: checkLandlockShape
        kind: internal
      - id: landlockSupported
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, nil, nil
          when: ll == nil
      - opt:
          do:
            - return: 0, nil, err
          init:
            bind: err
            eval: checkLandlockShape(ll)
            to: checkLandlockShape
          when: err != nil
      - bind: abi, errno
        eval: host.landlockABI()
      - opt:
          do:
            - return: 0, nil, wrapSandboxUnavailable(errno, errs.String("feature", "landlock"))
          when: errno != 0
      - bind: supported
        eval: landlockSupported(abi)
        to: landlockSupported
      - opt:
          do:
            - return: 0, nil, wrapSandboxUnavailable(nil, errs.String("feature", "landlock:"+landlockRightName(missing)), errs.Int("abi", abi))
          init:
            bind: missing
            eval: ll.Handled &^ supported &^ ll.BestEffort
          when: missing != 0
      - return: uint64(ll.Handled & supported), trimLandlockRules(ll.Rules, supported), nil
  - of: checkLandlockShape
    participants:
      - id: caller
        kind: actor
      - id: checkLandlockShape
        kind: self
      - id: landlockSupported
        kind: internal
      - id: wrapInvalidSpec
        kind: internal
    steps:
      - bind: known
        eval: landlockSupported(landlockNewestABI)
        to: landlockSupported
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "landlock handles no right, or an unknown one"))
              to: wrapInvalidSpec
          when: ll.Handled == 0 || ll.Handled&^known != 0
      - loop:
          do:
            - opt:
                do:
                  - return: wrapInvalidSpec(errs.String("sandbox", "a landlock rule needs an absolute path and handled rights"), errs.String("path", r.Path))
                    to: wrapInvalidSpec
                when: "!absClean(r.Path) || r.Access == 0 || r.Access&^ll.Handled != 0"
          key: _
          range: ll.Rules
          value: r
      - return: nil
  - of: checkSandboxKernel
    participants:
      - id: caller
        kind: actor
      - id: checkSandboxKernel
        kind: self
      - id: os
        kind: stdlib
      - id: wrapSandboxUnavailable
        kind: internal
    steps:
      - opt:
          do:
            - return: wrapSandboxUnavailable(err, errs.String("feature", "procfs"), errs.String("path", host.procSelfExe))
              to: wrapSandboxUnavailable
          init:
            bind: _, err
            eval: os.Stat(host.procSelfExe)
            to: os
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: wrapSandboxUnavailable(err, errs.String("feature", "namespace:"+n.name))
                          to: wrapSandboxUnavailable
                      init:
                        bind: _, err
                        eval: os.Lstat(filepath.Join(host.nsDir, n.name))
                        to: os
                      when: err != nil
                when: sb.Namespaces&n.ns != 0
          key: _
          range: sandboxNamespaces
          value: "n"
      - return: nil
  - of: trampolineSelf
    participants:
      - id: caller
        kind: actor
      - id: trampolineSelf
        kind: self
      - id: os
        kind: stdlib
    steps:
      - opt:
          do:
            - return: currentHost().procSelfExe, nil
          when: spec.Sandbox != nil
      - return: os.Executable()
        to: os
  - of: attachSandbox
    participants:
      - id: caller
        kind: actor
      - id: attachSandbox
        kind: self
      - id: buildSandboxPayload
        kind: internal
      - id: encodeSandbox
        kind: internal
      - id: sealedPayload
        kind: internal
      - id: setSandboxClone
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: sb
        eval: spec.Sandbox
      - opt:
          do:
            - return: nil, nil
          when: sb == nil
      - bind: p, err
        eval: buildSandboxPayload(spec, attr.Sys.Credential)
        to: buildSandboxPayload
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: data
        eval: encodeSandbox(p)
        to: encodeSandbox
      - bind: fd, errno
        eval: sealedPayload(data)
        to: sealedPayload
      - opt:
          do:
            - return: nil, wrapSandboxUnavailable(errno, errs.String("feature", "memfd_create"))
          when: errno != 0
      - eval: setSandboxClone(attr.Sys, sb)
        to: setSandboxClone
      - set: attr.Sys.Credential
        value: nil
      - opt:
          do:
            - set: attr.Dir
              value: "\"\""
          when: sb.Root != ""
      - bind: payload
        eval: os.NewFile(uintptr(fd), sandboxMemfdName)
        to: os
      - set: attr.Env
        value: append(attr.Env, trampolineSandboxEnv+"="+strconv.Itoa(len(attr.Files)))
      - set: attr.Files
        value: append(attr.Files, payload)
      - return: payload, nil
  - of: setSandboxClone
    participants:
      - id: caller
        kind: actor
      - id: setSandboxClone
        kind: self
      - id: idMappings
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: sb.Namespaces&n.ns == 0 || n.ns == coreproc.NamespaceCgroup
            - opt:
                do:
                  - op: "|="
                    set: sys.Unshareflags
                    value: n.flag
                  - continue: true
                when: n.ns == coreproc.NamespaceMount
            - op: "|="
              set: sys.Cloneflags
              value: n.flag
          key: _
          range: sandboxNamespaces
          value: "n"
      - opt:
          do:
            - return: ""
          when: sb.Namespaces&coreproc.NamespaceUser == 0
      - set: sys.UidMappings
        to: idMappings
        value: idMappings(sb.UIDMap, os.Geteuid())
      - set: sys.GidMappings
        to: idMappings
        value: idMappings(sb.GIDMap, os.Getegid())
      - set: sys.GidMappingsEnableSetgroups
        value: "false"
  - of: idMappings
    steps:
      - opt:
          do:
            - return: "[]syscall.SysProcIDMap{{ContainerID: 0, HostID: self, Size: 1}}"
          when: len(maps) == 0
      - bind: out
        eval: make([]syscall.SysProcIDMap, len(maps))
      - loop:
          do:
            - set: out[i]
              value: "syscall.SysProcIDMap{ContainerID: int(m.Inside), HostID: int(m.Outside), Size: int(m.Size)}"
          key: i
          range: maps
          value: m
      - return: out
  - of: buildSandboxPayload
    participants:
      - id: caller
        kind: actor
      - id: buildSandboxPayload
        kind: self
      - id: currentHost
        kind: internal
      - id: landlockPlan
        kind: internal
      - id: sandboxCapsOf
        kind: internal
      - id: assembleSeccomp
        kind: internal
    steps:
      - bind: sb
        eval: spec.Sandbox
      - bind: host
        eval: currentHost()
        to: currentHost
      - bind: handled, rules, err
        eval: landlockPlan(sb.Landlock, host)
        to: landlockPlan
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: caps, err
        eval: sandboxCapsOf(sb.Capabilities, host)
        to: sandboxCapsOf
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: p
        eval: |-
          &sandboxPayload{
          		cgroupNS:   sb.Namespaces&coreproc.NamespaceCgroup != 0,
          		mounts:     sandboxMounts(sb.Mounts),
          		root:       sb.Root,
          		dir:        spec.Dir,
          		identity:   sandboxIdentityOf(cred, sb.Namespaces&coreproc.NamespaceUser == 0),
          		caps:       caps,
          		noNewPrivs: sb.NoNewPrivileges || sb.Landlock != nil || sb.Seccomp != nil,
          		handled:    handled,
          		rules:      rules,
          		pdeathsig:  uint32(spec.DieWithParent.Int()),
          		parentPID:  parentToCheck(spec),
          		failStep:   host.failStep,
          		traceFD:    host.traceFD,
          	}
      - opt:
          do:
            - set: p.filter
              to: assembleSeccomp
              value: assembleSeccomp(sb.Seccomp, firstSealedFD+len(spec.ExtraFiles))
          when: sb.Seccomp != nil
      - return: p, nil
  - of: parentToCheck
    steps:
      - opt:
          do:
            - return: "0"
          when: spec.DieWithParent == 0 || spec.Sandbox.Namespaces&coreproc.NamespacePID != 0
      - return: uint32(os.Getpid())
  - of: sandboxCapsOf
    participants:
      - id: caller
        kind: actor
      - id: sandboxCapsOf
        kind: self
      - id: capLastCap
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil
          when: c == nil
      - bind: last, err
        eval: capLastCap(host)
        to: capLastCap
      - opt:
          do:
            - return: nil, wrapSandboxUnavailable(err, errs.String("feature", "cap_last_cap"))
          when: err != nil
      - return: "&sandboxCaps{bounding: c.Bounding, ambient: c.Ambient, secureBits: c.SecureBits, lastCap: last}, nil"
  - of: sandboxMounts
    steps:
      - bind: out
        eval: make([]sandboxMount, len(mounts))
      - loop:
          do:
            - set: out[i]
              value: "sandboxMount{kind: uint8(m.Kind), readOnly: m.ReadOnly, source: m.Source, target: m.Target}"
          key: i
          range: mounts
          value: m
      - return: out
  - of: sandboxIdentityOf
    steps:
      - opt:
          do:
            - return: nil
          when: cred == nil
      - return: "&sandboxIdentity{uid: cred.Uid, gid: cred.Gid, setGroups: setGroups, groups: slices.Clone(cred.Groups)}"
  - of: (*payloadWriter).u8
    steps:
      - set: w.buf
        value: append(w.buf, v)
  - of: (*payloadWriter).u32
    participants:
      - id: caller
        kind: actor
      - id: (*payloadWriter).u32
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: w.buf
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(w.buf, v)
  - of: (*payloadWriter).u64
    participants:
      - id: caller
        kind: actor
      - id: (*payloadWriter).u64
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - set: w.buf
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(w.buf, v)
  - of: (*payloadWriter).flag
    participants:
      - id: caller
        kind: actor
      - id: (*payloadWriter).flag
        kind: self
      - id: w.u8
        kind: internal
    steps:
      - opt:
          do:
            - eval: w.u8(1)
              to: w.u8
            - return: ""
          when: v
      - eval: w.u8(0)
        to: w.u8
  - of: (*payloadWriter).str
    participants:
      - id: caller
        kind: actor
      - id: (*payloadWriter).str
        kind: self
      - id: w.u32
        kind: internal
    steps:
      - eval: w.u32(uint32(len(s)))
        to: w.u32
      - set: w.buf
        value: append(w.buf, s...)
  - of: encodeSandbox
    participants:
      - id: caller
        kind: actor
      - id: encodeSandbox
        kind: self
      - id: binary.LittleEndian.AppendUint16
        kind: value
      - id: w.u32
        kind: internal
      - id: w.flag
        kind: internal
      - id: encodeMounts
        kind: internal
      - id: encodeCredentials
        kind: internal
      - id: encodeLandlock
        kind: internal
      - id: w.u8
        kind: internal
      - id: binary.LittleEndian.PutUint32
        kind: value
    steps:
      - bind: w
        eval: "&payloadWriter{buf: make([]byte, 0, sandboxHeaderLen)}"
      - set: w.buf
        value: append(w.buf, sandboxMagic...)
      - set: w.buf
        to: binary.LittleEndian.AppendUint16
        value: binary.LittleEndian.AppendUint16(w.buf, sandboxVersion)
      - set: w.buf
        to: binary.LittleEndian.AppendUint16
        value: binary.LittleEndian.AppendUint16(w.buf, 0)
      - eval: w.u32(0)
        to: w.u32
      - eval: w.flag(p.cgroupNS)
        to: w.flag
      - eval: encodeMounts(w, p)
        to: encodeMounts
      - eval: encodeCredentials(w, p)
        to: encodeCredentials
      - eval: encodeLandlock(w, p)
        to: encodeLandlock
      - eval: w.u32(uint32(len(p.filter)))
        to: w.u32
      - loop:
          do:
            - set: w.buf
              to: binary.LittleEndian.AppendUint16
              value: binary.LittleEndian.AppendUint16(w.buf, ins.code)
            - eval: w.u8(ins.jt)
              to: w.u8
            - eval: w.u8(ins.jf)
              to: w.u8
            - eval: w.u32(ins.k)
              to: w.u32
          key: _
          range: p.filter
          value: ins
      - eval: w.u32(p.pdeathsig)
        to: w.u32
      - eval: w.u32(p.parentPID)
        to: w.u32
      - eval: w.u8(p.failStep)
        to: w.u8
      - eval: w.u32(uint32(p.traceFD))
        to: w.u32
      - eval: binary.LittleEndian.PutUint32(w.buf[8:], uint32(len(w.buf)))
        to: binary.LittleEndian.PutUint32
      - return: w.buf
  - of: encodeMounts
    participants:
      - id: caller
        kind: actor
      - id: encodeMounts
        kind: self
      - id: w.u32
        kind: internal
      - id: w.u8
        kind: internal
      - id: w.flag
        kind: internal
      - id: w.str
        kind: internal
    steps:
      - eval: w.u32(uint32(len(p.mounts)))
        to: w.u32
      - loop:
          do:
            - eval: w.u8(m.kind)
              to: w.u8
            - eval: w.flag(m.readOnly)
              to: w.flag
            - eval: w.str(m.source)
              to: w.str
            - eval: w.str(m.target)
              to: w.str
          key: _
          range: p.mounts
          value: m
      - eval: w.str(p.root)
        to: w.str
      - eval: w.str(p.dir)
        to: w.str
  - of: encodeCredentials
    participants:
      - id: caller
        kind: actor
      - id: encodeCredentials
        kind: self
      - id: w.flag
        kind: internal
      - id: w.u32
        kind: internal
      - id: w.u64
        kind: internal
    steps:
      - eval: w.flag(p.identity != nil)
        to: w.flag
      - opt:
          do:
            - eval: w.u32(id.uid)
              to: w.u32
            - eval: w.u32(id.gid)
              to: w.u32
            - eval: w.flag(id.setGroups)
              to: w.flag
            - eval: w.u32(uint32(len(id.groups)))
              to: w.u32
            - loop:
                do:
                  - eval: w.u32(g)
                    to: w.u32
                key: _
                range: id.groups
                value: g
          init:
            bind: id
            eval: p.identity
          when: id != nil
      - eval: w.flag(p.caps != nil)
        to: w.flag
      - opt:
          do:
            - eval: w.u64(c.bounding)
              to: w.u64
            - eval: w.u64(c.ambient)
              to: w.u64
            - eval: w.u32(c.secureBits)
              to: w.u32
            - eval: w.u32(c.lastCap)
              to: w.u32
          init:
            bind: c
            eval: p.caps
          when: c != nil
      - eval: w.flag(p.noNewPrivs)
        to: w.flag
  - of: encodeLandlock
    participants:
      - id: caller
        kind: actor
      - id: encodeLandlock
        kind: self
      - id: w.u64
        kind: internal
      - id: w.u32
        kind: internal
      - id: w.str
        kind: internal
    steps:
      - eval: w.u64(p.handled)
        to: w.u64
      - eval: w.u32(uint32(len(p.rules)))
        to: w.u32
      - loop:
          do:
            - eval: w.u64(r.access)
              to: w.u64
            - eval: w.str(r.path)
              to: w.str
          key: _
          range: p.rules
          value: r
  - of: (*payloadReader).take
    steps:
      - opt:
          do:
            - set: r.bad
              value: "true"
            - return: nil
          when: r.bad || n < 0 || n > len(r.buf)
      - bind: out
        eval: r.buf[:n]
      - set: r.buf
        value: r.buf[n:]
      - return: out
  - of: (*payloadReader).u8
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).u8
        kind: self
      - id: r.take
        kind: internal
    steps:
      - bind: b
        eval: r.take(1)
        to: r.take
      - opt:
          do:
            - return: "0"
          when: b == nil
      - return: b[0]
  - of: (*payloadReader).u16
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).u16
        kind: self
      - id: r.take
        kind: internal
      - id: binary.LittleEndian.Uint16
        kind: value
    steps:
      - bind: b
        eval: r.take(2)
        to: r.take
      - opt:
          do:
            - return: "0"
          when: b == nil
      - return: binary.LittleEndian.Uint16(b)
        to: binary.LittleEndian.Uint16
  - of: (*payloadReader).u32
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).u32
        kind: self
      - id: r.take
        kind: internal
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - bind: b
        eval: r.take(4)
        to: r.take
      - opt:
          do:
            - return: "0"
          when: b == nil
      - return: binary.LittleEndian.Uint32(b)
        to: binary.LittleEndian.Uint32
  - of: (*payloadReader).u64
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).u64
        kind: self
      - id: r.take
        kind: internal
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - bind: b
        eval: r.take(8)
        to: r.take
      - opt:
          do:
            - return: "0"
          when: b == nil
      - return: binary.LittleEndian.Uint64(b)
        to: binary.LittleEndian.Uint64
  - of: (*payloadReader).flag
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).flag
        kind: self
      - id: r.u8
        kind: internal
    steps:
      - bind: v
        eval: r.u8()
        to: r.u8
      - opt:
          do:
            - set: r.bad
              value: "true"
          when: v > 1
      - return: v == 1
  - of: (*payloadReader).count
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).count
        kind: self
      - id: r.u32
        kind: internal
    steps:
      - bind: "n"
        eval: r.u32()
        to: r.u32
      - opt:
          do:
            - set: r.bad
              value: "true"
            - return: "0"
          when: int64(n) > int64(limit)
      - return: int(n)
  - of: (*payloadReader).str
    participants:
      - id: caller
        kind: actor
      - id: (*payloadReader).str
        kind: self
      - id: r.take
        kind: internal
    steps:
      - bind: b
        eval: r.take(r.count(sandboxMaxString))
        to: r.take
      - opt:
          do:
            - set: r.bad
              value: "true"
            - return: "\"\""
          when: slices.Contains(b, 0)
      - return: string(b)
  - of: decodeSandbox
    participants:
      - id: caller
        kind: actor
      - id: decodeSandbox
        kind: self
      - id: decodeMounts
        kind: internal
      - id: decodeCredentials
        kind: internal
      - id: decodeLandlock
        kind: internal
      - id: r.count
        kind: internal
      - id: r.u32
        kind: internal
      - id: r.u8
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, syscall.EINVAL
          when: len(data) < sandboxHeaderLen || len(data) > sandboxMaxPayload || !sandboxHeaderOK(data)
      - bind: r
        eval: "&payloadReader{buf: data[sandboxHeaderLen:]}"
      - bind: p
        eval: "&sandboxPayload{cgroupNS: r.flag()}"
      - eval: decodeMounts(r, p)
        to: decodeMounts
      - eval: decodeCredentials(r, p)
        to: decodeCredentials
      - eval: decodeLandlock(r, p)
        to: decodeLandlock
      - bind: "n"
        eval: r.count(sandboxMaxInsns)
        to: r.count
      - set: p.filter
        value: make([]sockFilter, 0, n)
      - loop:
          do:
            - set: p.filter
              value: "append(p.filter, sockFilter{code: r.u16(), jt: r.u8(), jf: r.u8(), k: r.u32()})"
          range: "n"
      - set: p.pdeathsig
        to: r.u32
        value: r.u32()
      - set: p.parentPID
        to: r.u32
        value: r.u32()
      - set: p.failStep
        to: r.u8
        value: r.u8()
      - set: p.traceFD
        value: int32(r.u32())
      - opt:
          do:
            - return: nil, syscall.EINVAL
          when: r.bad || len(r.buf) != 0
      - return: p, 0
  - of: sandboxHeaderOK
    steps:
      - return: |-
          string(data[:len(sandboxMagic)]) == sandboxMagic && binary.LittleEndian.Uint16(data[4:]) == sandboxVersion &&
          		binary.LittleEndian.Uint16(data[6:]) == 0 && int(binary.LittleEndian.Uint32(data[8:])) == len(data)
  - of: decodeMounts
    participants:
      - id: caller
        kind: actor
      - id: decodeMounts
        kind: self
      - id: r.count
        kind: internal
      - id: r.str
        kind: internal
    steps:
      - bind: "n"
        eval: r.count(sandboxMaxItems)
        to: r.count
      - set: p.mounts
        value: make([]sandboxMount, 0, n)
      - loop:
          do:
            - set: p.mounts
              value: "append(p.mounts, sandboxMount{kind: r.u8(), readOnly: r.flag(), source: r.str(), target: r.str()})"
          range: "n"
      - set: p.root
        to: r.str
        value: r.str()
      - set: p.dir
        to: r.str
        value: r.str()
  - of: decodeCredentials
    participants:
      - id: caller
        kind: actor
      - id: decodeCredentials
        kind: self
      - id: r.count
        kind: internal
      - id: r.flag
        kind: internal
    steps:
      - opt:
          do:
            - bind: uid, gid, set
              eval: r.u32(), r.u32(), r.flag()
            - bind: "n"
              eval: r.count(sandboxMaxItems)
              to: r.count
            - bind: groups
              eval: make([]uint32, 0, n)
            - loop:
                do:
                  - set: groups
                    value: append(groups, r.u32())
                range: "n"
            - set: p.identity
              value: "&sandboxIdentity{uid: uid, gid: gid, setGroups: set, groups: groups}"
          when: r.flag()
      - opt:
          do:
            - set: p.caps
              value: "&sandboxCaps{bounding: r.u64(), ambient: r.u64(), secureBits: r.u32(), lastCap: r.u32()}"
          when: r.flag()
      - set: p.noNewPrivs
        to: r.flag
        value: r.flag()
  - of: decodeLandlock
    participants:
      - id: caller
        kind: actor
      - id: decodeLandlock
        kind: self
      - id: r.u64
        kind: internal
      - id: r.count
        kind: internal
    steps:
      - set: p.handled
        to: r.u64
        value: r.u64()
      - bind: "n"
        eval: r.count(sandboxMaxItems)
        to: r.count
      - set: p.rules
        value: make([]sandboxRule, 0, n)
      - loop:
          do:
            - set: p.rules
              value: "append(p.rules, sandboxRule{access: r.u64(), path: r.str()})"
          range: "n"
  - of: sealedPayload
    participants:
      - id: caller
        kind: actor
      - id: sealedPayload
        kind: self
      - id: syscall
        kind: stdlib
      - id: writePayload
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: name, err
        eval: syscall.BytePtrFromString(sandboxMemfdName)
        to: syscall
      - opt:
          do:
            - return: "-1, syscall.EINVAL"
          when: err != nil
      - bind: r, _, errno
        eval: syscall.Syscall(sysMemfdCreate, uintptr(unsafe.Pointer(name)), mfdCloexec|mfdAllowSealing, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, errno"
          when: errno != 0
      - set: fd
        value: int(r)
      - opt:
          do:
            - eval: swallowErr(syscall.Close(fd))
              to: swallowErr
            - return: "-1, wErr"
          init:
            bind: wErr
            eval: writePayload(fd, data)
            to: writePayload
          when: wErr != 0
      - set: _, _, errno
        to: syscall
        value: syscall.Syscall(syscall.SYS_FCNTL, uintptr(fd), fAddSeals, sandboxSealSet)
      - opt:
          do:
            - eval: swallowErr(syscall.Close(fd))
              to: swallowErr
            - return: "-1, errno"
          when: errno != 0
      - return: fd, 0
  - of: writePayload
    participants:
      - id: caller
        kind: actor
      - id: writePayload
        kind: self
      - id: syscall
        kind: stdlib
      - id: errnoOf
        kind: internal
    steps:
      - loop:
          cond: len(data) > 0
          do:
            - bind: n, err
              eval: syscall.Write(fd, data)
              to: syscall
            - opt:
                do:
                  - return: errnoOf(err)
                    to: errnoOf
                when: err != nil
            - set: data
              value: data[n:]
      - return: "0"
  - of: readSealedPayload
    participants:
      - id: caller
        kind: actor
      - id: readSealedPayload
        kind: self
      - id: syscall
        kind: stdlib
      - id: decodeSandbox
        kind: internal
    steps:
      - defer: func() { swallowErr(syscall.Close(fd)) }()
      - bind: seals, _, errno
        eval: syscall.RawSyscall(syscall.SYS_FCNTL, uintptr(fd), fGetSeals, 0)
        to: syscall
      - opt:
          do:
            - return: nil, syscall.EPERM
          when: errno != 0 || seals&sandboxSealSet != sandboxSealSet
      - var:
          name: st
          type: syscall.Stat_t
      - opt:
          do:
            - return: nil, syscall.EINVAL
          init:
            bind: err
            eval: syscall.Fstat(fd, &st)
            to: syscall
          when: err != nil || st.Size < int64(sandboxHeaderLen) || st.Size > int64(sandboxMaxPayload)
      - bind: data
        eval: make([]byte, st.Size)
      - bind: n, err
        eval: syscall.Pread(fd, data, 0)
        to: syscall
      - opt:
          do:
            - return: nil, syscall.EIO
          when: err != nil || n != len(data)
      - bind: p, errno
        eval: decodeSandbox(data)
        to: decodeSandbox
      - opt:
          do:
            - return: nil, errno
          when: errno != 0
      - return: p, 0
  - of: parseSyscallTable
    participants:
      - id: caller
        kind: actor
      - id: parseSyscallTable
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: out
        eval: make(map[string]uint32, strings.Count(table, "\n"))
      - loop:
          do:
            - bind: name, num, ok
              eval: strings.Cut(strings.TrimSpace(line), " ")
              to: strings
            - bind: n, err
              eval: strconv.ParseUint(num, syscallBase, syscallBits)
              to: strconv
            - opt:
                do:
                  - set: out[name]
                    value: uint32(n)
                when: ok && err == nil
          key: line
          range: strings.Lines(table)
      - return: out
  - of: checkSeccomp
    participants:
      - id: caller
        kind: actor
      - id: checkSeccomp
        kind: self
      - id: wrapInvalidSpec
        kind: internal
      - id: checkSyscallName
        kind: internal
      - id: wrapSandboxUnavailable
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: sc == nil
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "seccomp needs two distinct known actions and at least one call"))
              to: wrapInvalidSpec
          when: sc.Default > coreproc.SeccompAllow || sc.Action > coreproc.SeccompAllow || sc.Default == sc.Action || len(sc.Syscalls) == 0
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "seccomp errno outside 0 to 4095"), errs.Int("errno", sc.Errno))
              to: wrapInvalidSpec
          when: sc.Errno < 0 || sc.Errno > seccompErrnoMax
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: checkSyscallName(name, sc.Action)
                  to: checkSyscallName
                when: err != nil
          key: _
          range: sc.Syscalls
          value: name
      - opt:
          do:
            - return: wrapSandboxUnavailable(errno, errs.String("feature", "seccomp"))
              to: wrapSandboxUnavailable
          init:
            bind: errno
            eval: available()
          when: errno != 0
      - return: nil
  - of: checkSyscallName
    participants:
      - id: caller
        kind: actor
      - id: checkSyscallName
        kind: self
      - id: wrapInvalidSpec
        kind: internal
    steps:
      - bind: _, own
        eval: syscallNumbers()[name]
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "seccomp names an unknown system call"), errs.String("syscall", name))
              to: wrapInvalidSpec
          when: "!own && !slices.Contains(foreignSyscalls(), name)"
      - opt:
          do:
            - return: wrapInvalidSpec(errs.String("sandbox", "seccomp may not deny a call the spawn needs"), errs.String("syscall", name))
              to: wrapInvalidSpec
          when: action != coreproc.SeccompAllow && slices.Contains(seccompFloor[:], name)
      - return: nil
  - of: seccompAvailable
    participants:
      - id: caller
        kind: actor
      - id: seccompAvailable
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.Syscall(sysSeccomp, seccompGetActionAvail, 0, uintptr(unsafe.Pointer(new(seccompRetKillProcess))))
        to: syscall
      - return: errno
  - of: seccompReturn
    steps:
      - switch:
          cases:
            - case: coreproc.SeccompAllow
              do:
                - return: seccompRetAllow
            - case: coreproc.SeccompErrno
              do:
                - opt:
                    do:
                      - set: errno
                        value: int(syscall.EPERM)
                    when: errno == 0
                - return: seccompRetErrno | uint32(errno)
            - default: true
              do:
                - return: seccompRetKillProcess
          "on": action
  - of: assembleSeccomp
    participants:
      - id: caller
        kind: actor
      - id: assembleSeccomp
        kind: self
      - id: seccompReturn
        kind: internal
    steps:
      - bind: numbers
        eval: syscallNumbers()
      - bind: kill
        eval: seccompRetKillProcess
      - bind: allow
        eval: seccompRetAllow
      - bind: prog
        eval: |-
          []sockFilter{
          		{code: bpfLdWAbs, k: seccompDataArch},
          		{code: bpfJeqK, jt: 1, k: sandboxAuditArch},
          		{code: bpfRetK, k: kill},
          		{code: bpfLdWAbs, k: seccompDataNr},
          	}
      - opt:
          do:
            - set: prog
              value: "append(prog, sockFilter{code: bpfJgeK, jf: 1, k: sandboxX32Bit}, sockFilter{code: bpfRetK, k: kill})"
          when: sandboxX32Bit != 0
      - loop:
          do:
            - set: prog
              value: "append(prog, sockFilter{code: bpfJeqK, jf: 1, k: numbers[name]}, sockFilter{code: bpfRetK, k: allow})"
          key: _
          range: seccompFloor
          value: name
      - set: prog
        value: |-
          append(prog,
          		//: write(hsfd, …): the failure report of an execve the filter let through.
          		sockFilter{code: bpfJeqK, jf: reportSkip, k: numbers["write"]},
          		sockFilter{code: bpfLdWAbs, k: seccompDataArg0Lo},
          		sockFilter{code: bpfJeqK, jf: reportFdSkip, k: uint32(hsfd)},
          		sockFilter{code: bpfLdWAbs, k: seccompDataArg0Hi},
          		sockFilter{code: bpfJeqK, jf: 1, k: 0},
          		sockFilter{code: bpfRetK, k: allow},
          		sockFilter{code: bpfLdWAbs, k: seccompDataNr},
          	)
      - bind: listed
        eval: seccompReturn(sc.Action, sc.Errno)
        to: seccompReturn
      - loop:
          do:
            - set: prog
              value: "append(prog, sockFilter{code: bpfJeqK, jf: 1, k: nr}, sockFilter{code: bpfRetK, k: listed})"
          key: _
          range: seccompNumbers(numbers, sc.Syscalls)
          value: nr
      - return: "append(prog, sockFilter{code: bpfRetK, k: seccompReturn(sc.Default, sc.Errno)})"
  - of: seccompNumbers
    participants:
      - id: caller
        kind: actor
      - id: seccompNumbers
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: out
        eval: make([]uint32, 0, len(names))
      - loop:
          do:
            - bind: nr, ok
              eval: numbers[name]
            - opt:
                do:
                  - continue: true
                when: "!ok || slices.Contains(seccompFloor[:], name)"
            - set: out
              value: append(out, nr)
          key: _
          range: names
          value: name
      - eval: slices.Sort(out)
        to: slices
      - return: slices.Compact(out)
        to: slices
  - of: execSandboxed
    participants:
      - id: caller
        kind: actor
      - id: execSandboxed
        kind: self
      - id: runtime
        kind: stdlib
      - id: strconv
        kind: stdlib
      - id: sandboxFail
        kind: internal
      - id: readSealedPayload
        kind: internal
      - id: reportHandshake
        kind: internal
      - id: os
        kind: stdlib
      - id: st.run
        kind: internal
      - id: st.filterAndExec
        kind: internal
    steps:
      - eval: runtime.LockOSThread()
        to: runtime
      - bind: st
        eval: "&sandboxStage{hsfd: childHandshakeFD(), ruleset: -1}"
      - bind: fd, err
        eval: strconv.Atoi(fdText)
        to: strconv
      - opt:
          do:
            - eval: sandboxFail(st.hsfd, stepPayload, syscall.EINVAL)
              to: sandboxFail
          when: err != nil
      - bind: p, errno
        eval: readSealedPayload(fd)
        to: readSealedPayload
      - opt:
          do:
            - eval: sandboxFail(st.hsfd, stepPayload, errno)
              to: sandboxFail
          when: errno != 0
      - set: st.p
        value: p
      - opt:
          do:
            - eval: reportHandshake(handshakeExecFail)
              to: reportHandshake
            - eval: os.Exit(trampolineExecExit)
              to: os
          when: st.prepareExec(target, args, env) != nil
      - bind: steps
        eval: |-
          [...]func(*sandboxStage) syscall.Errno{
          		(*sandboxStage).cgroupNamespace,
          		(*sandboxStage).mount, (*sandboxStage).pivot, (*sandboxStage).landlockPaths,
          		(*sandboxStage).bounding, (*sandboxStage).secureBits, (*sandboxStage).identity,
          		(*sandboxStage).capabilities, (*sandboxStage).sweep, (*sandboxStage).noNewPrivs,
          		(*sandboxStage).landlock,
          	}
      - loop:
          do:
            - eval: st.run(uint8(i)+stepCgroupNamespace, step)
              to: st.run
          key: i
          range: steps
          value: step
      - eval: st.run(stepSeccomp, func(*sandboxStage) syscall.Errno { return 0 })
        to: st.run
      - eval: st.filterAndExec()
        to: st.filterAndExec
  - of: (*sandboxStage).prepareExec
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).prepareExec
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: err
          type: error
      - set: st.argv0, err
        to: syscall
        value: syscall.BytePtrFromString(target)
      - opt:
          do:
            - return: err
          when: err != nil
      - set: st.argv, err
        to: syscall
        value: syscall.SlicePtrFromStrings(args)
      - opt:
          do:
            - return: err
          when: err != nil
      - set: st.envv, err
        to: syscall
        value: syscall.SlicePtrFromStrings(env)
      - return: err
  - of: (*sandboxStage).run
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).run
        kind: self
      - id: st.trace
        kind: internal
      - id: sandboxFail
        kind: internal
    steps:
      - eval: st.trace(step)
        to: st.trace
      - opt:
          do:
            - eval: sandboxFail(st.hsfd, step, stageInjectedErrno)
              to: sandboxFail
          when: st.p.failStep == step
      - opt:
          do:
            - eval: sandboxFail(st.hsfd, step, errno)
              to: sandboxFail
          init:
            bind: errno
            eval: fn(st)
          when: errno != 0
  - of: (*sandboxStage).trace
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).trace
        kind: self
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: st.p.traceFD < 0
      - var:
          name: rec
          type: "[traceRecordLen]byte"
      - set: rec[0]
        value: step
      - eval: binary.LittleEndian.PutUint32(rec[1:], uint32(syscall.Gettid()))
        to: binary.LittleEndian.PutUint32
      - eval: swallowErr(rawWrite(int(st.p.traceFD), rec[:]))
        to: swallowErr
  - of: sandboxFail
    participants:
      - id: caller
        kind: actor
      - id: sandboxFail
        kind: self
      - id: sandboxReport
        kind: internal
      - id: swallowErr
        kind: internal
      - id: stderrLine
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: report
        eval: sandboxReport(step, errno)
        to: sandboxReport
      - eval: swallowErr(rawWrite(hsfd, report[:]))
        to: swallowErr
      - eval: "stderrLine(\"sdk sandbox: \" + sandboxStepName(step) + \": \" + errno.Error())"
        to: stderrLine
      - eval: os.Exit(trampolineApplyExit)
        to: os
  - of: (*sandboxStage).cgroupNamespace
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).cgroupNamespace
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "0"
          when: "!st.p.cgroupNS"
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_UNSHARE, syscall.CLONE_NEWCGROUP, 0, 0)
        to: syscall
      - return: errno
  - of: (*sandboxStage).mount
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).mount
        kind: self
      - id: applyMount
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: errno
                init:
                  bind: errno
                  eval: applyMount(m)
                  to: applyMount
                when: errno != 0
          key: _
          range: st.p.mounts
          value: m
      - return: "0"
  - of: applyMount
    participants:
      - id: caller
        kind: actor
      - id: applyMount
        kind: self
      - id: rawMount
        kind: internal
      - id: mountReadOnly
        kind: internal
    steps:
      - var:
          name: errno
          type: syscall.Errno
      - switch:
          cases:
            - case: uint8(coreproc.MountTmpfs), uint8(coreproc.MountTmpfsSticky)
              do:
                - bind: flags, options
                  eval: msNosuid|msNodev, tmpfsOptions
                - opt:
                    do:
                      - op: "|="
                        set: flags
                        value: msRdonly
                    when: m.readOnly
                - opt:
                    do:
                      - set: options
                        value: tmpfsStickyOptions
                    when: m.kind == uint8(coreproc.MountTmpfsSticky)
                - return: rawMount("tmpfs", m.target, "tmpfs", flags, options)
                  to: rawMount
            - case: uint8(coreproc.MountBind)
              do:
                - set: errno
                  to: rawMount
                  value: rawMount(m.source, m.target, "", msBind|msRec, "")
            - default: true
              do:
                - set: errno
                  to: rawMount
                  value: rawMount(m.target, m.target, "", msBind|msRec, "")
          "on": m.kind
      - opt:
          do:
            - return: errno
          when: errno != 0 || (m.kind == uint8(coreproc.MountBind) && !m.readOnly)
      - return: mountReadOnly(m.target)
        to: mountReadOnly
  - of: rawMount
    participants:
      - id: caller
        kind: actor
      - id: rawMount
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: src, e1
        eval: syscall.BytePtrFromString(source)
        to: syscall
      - bind: dst, e2
        eval: syscall.BytePtrFromString(target)
        to: syscall
      - opt:
          do:
            - return: syscall.EINVAL
          when: e1 != nil || e2 != nil
      - bind: fs, opts
        eval: optionalCString(fstype), optionalCString(data)
      - bind: _, _, errno
        eval: |-
          syscall.RawSyscall6(syscall.SYS_MOUNT, uintptr(unsafe.Pointer(src)), uintptr(unsafe.Pointer(dst)),
          		uintptr(unsafe.Pointer(fs)), flags, uintptr(unsafe.Pointer(opts)), 0)
        to: syscall
      - return: errno
  - of: optionalCString
    participants:
      - id: caller
        kind: actor
      - id: optionalCString
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: p, err
        eval: syscall.BytePtrFromString(s)
        to: syscall
      - opt:
          do:
            - return: nil
          when: s == "" || err != nil
      - return: p
  - of: mountReadOnly
    participants:
      - id: caller
        kind: actor
      - id: mountReadOnly
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: path, err
        eval: syscall.BytePtrFromString(target)
        to: syscall
      - opt:
          do:
            - return: syscall.EINVAL
          when: err != nil
      - bind: _, _, errno
        eval: |-
          syscall.RawSyscall6(sysMountSetattr, atFDCWD, uintptr(unsafe.Pointer(path)), atRecursive,
          		uintptr(unsafe.Pointer(new(mountAttr{attrSet: mountAttrRdonly}))), mountAttrSizeVer0, 0)
        to: syscall
      - return: errno
  - of: (*sandboxStage).pivot
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).pivot
        kind: self
      - id: rawMount
        kind: internal
      - id: syscall
        kind: stdlib
      - id: errnoOf
        kind: internal
      - id: optionalCString
        kind: internal
    steps:
      - bind: root
        eval: st.p.root
      - opt:
          do:
            - return: "0"
          when: root == ""
      - opt:
          do:
            - return: errno
          init:
            bind: errno
            eval: rawMount(root, root, "", msBind|msRec, "")
            to: rawMount
          when: errno != 0
      - opt:
          do:
            - return: errnoOf(err)
              to: errnoOf
          init:
            bind: err
            eval: syscall.Chdir(root)
            to: syscall
          when: err != nil
      - bind: dot
        eval: optionalCString(".")
        to: optionalCString
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_PIVOT_ROOT, uintptr(unsafe.Pointer(dot)), uintptr(unsafe.Pointer(dot)), 0)
        to: syscall
      - opt:
          do:
            - return: errno
          when: errno != 0
      - set: _, _, errno
        to: syscall
        value: syscall.RawSyscall(syscall.SYS_UMOUNT2, uintptr(unsafe.Pointer(dot)), mntDetach, 0)
      - opt:
          do:
            - return: errno
          when: errno != 0
      - bind: dir
        eval: st.p.dir
      - opt:
          do:
            - set: dir
              value: "\"/\""
          when: dir == ""
      - return: errnoOf(syscall.Chdir(dir))
        to: errnoOf
  - of: errnoOf
    steps:
      - opt:
          do:
            - return: "0"
          when: err == nil
      - opt:
          do:
            - return: errno
          init:
            bind: errno, ok
            eval: errors.AsType[syscall.Errno](err)
          when: ok
      - return: syscall.EIO
  - of: (*sandboxStage).landlockPaths
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).landlockPaths
        kind: self
      - id: syscall
        kind: stdlib
      - id: addLandlockRule
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: st.p.handled == 0
      - bind: handled
        eval: st.p.handled
      - bind: rs, _, errno
        eval: syscall.RawSyscall(sysLandlockCreateRuleset, uintptr(unsafe.Pointer(&handled)), landlockRulesetAttrLen, 0)
        to: syscall
      - opt:
          do:
            - return: errno
          when: errno != 0
      - set: st.ruleset
        value: int(rs)
      - loop:
          do:
            - opt:
                do:
                  - return: errno
                init:
                  bind: errno
                  eval: addLandlockRule(st.ruleset, r)
                  to: addLandlockRule
                when: errno != 0
          key: _
          range: st.p.rules
          value: r
      - return: "0"
  - of: addLandlockRule
    participants:
      - id: caller
        kind: actor
      - id: addLandlockRule
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: path, err
        eval: syscall.BytePtrFromString(r.path)
        to: syscall
      - opt:
          do:
            - return: syscall.EINVAL
          when: err != nil
      - bind: fd, _, errno
        eval: syscall.RawSyscall6(syscall.SYS_OPENAT, atFDCWD, uintptr(unsafe.Pointer(path)), uintptr(oPath|syscall.O_CLOEXEC), 0, 0, 0)
        to: syscall
      - opt:
          do:
            - return: errno
          when: errno != 0
      - bind: attr
        eval: "new(landlockPathBeneath{allowedAccess: r.access, parentFD: int32(fd)})"
      - set: _, _, errno
        to: syscall
        value: syscall.RawSyscall6(sysLandlockAddRule, uintptr(ruleset), landlockRulePathBeneat, uintptr(unsafe.Pointer(attr)), 0, 0, 0)
      - eval: swallowErr(syscall.Close(int(fd)))
        to: swallowErr
      - return: errno
  - of: (*sandboxStage).bounding
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).bounding
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: c
        eval: st.p.caps
      - opt:
          do:
            - return: "0"
          when: c == nil
      - loop:
          cond: cp <= uintptr(c.lastCap)
          do:
            - opt:
                do:
                  - continue: true
                when: c.bounding&(1<<cp) != 0
            - bind: in, _, errno
              eval: syscall.RawSyscall(syscall.SYS_PRCTL, prCapbsetRead, cp, 0)
              to: syscall
            - opt:
                do:
                  - continue: true
                when: errno == 0 && in == 0
            - opt:
                do:
                  - return: errno
                init:
                  bind: _, _, errno
                  eval: syscall.RawSyscall(syscall.SYS_PRCTL, prCapbsetDrop, cp, 0)
                  op: =
                  to: syscall
                when: errno != 0
          init: cp := uintptr(0)
          post: cp++
      - return: "0"
  - of: (*sandboxStage).secureBits
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).secureBits
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: c
        eval: st.p.caps
      - opt:
          do:
            - return: "0"
          when: c == nil || c.secureBits == 0
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_PRCTL, prSetSecureBits, uintptr(c.secureBits), 0)
        to: syscall
      - return: errno
  - of: (*sandboxStage).identity
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).identity
        kind: self
      - id: syscall
        kind: stdlib
      - id: setGroups
        kind: internal
      - id: st.rearmDeathSignal
        kind: internal
    steps:
      - bind: id
        eval: st.p.identity
      - opt:
          do:
            - return: "0"
          when: id == nil
      - opt:
          do:
            - opt:
                do:
                  - return: errno
                init:
                  bind: _, _, errno
                  eval: syscall.RawSyscall(syscall.SYS_PRCTL, prSetKeepCaps, 1, 0)
                  to: syscall
                when: errno != 0
          init:
            bind: c
            eval: st.p.caps
          when: c != nil && c.ambient != 0
      - opt:
          do:
            - return: errno
          init:
            bind: errno
            eval: setGroups(id)
            to: setGroups
          when: errno != 0
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall(syscall.SYS_SETRESGID, uintptr(id.gid), uintptr(id.gid), uintptr(id.gid))
            to: syscall
          when: errno != 0
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall(syscall.SYS_SETRESUID, uintptr(id.uid), uintptr(id.uid), uintptr(id.uid))
            to: syscall
          when: errno != 0
      - return: st.rearmDeathSignal()
        to: st.rearmDeathSignal
  - of: setGroups
    participants:
      - id: caller
        kind: actor
      - id: setGroups
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "0"
          when: "!id.setGroups"
      - var:
          name: groups
          type: uintptr
      - opt:
          do:
            - set: groups
              value: uintptr(unsafe.Pointer(&id.groups[0]))
          when: len(id.groups) > 0
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_SETGROUPS, uintptr(len(id.groups)), groups, 0)
        to: syscall
      - return: errno
  - of: (*sandboxStage).rearmDeathSignal
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).rearmDeathSignal
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "0"
          when: st.p.pdeathsig == 0
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall(syscall.SYS_PRCTL, prSetPdeathsig, uintptr(st.p.pdeathsig), 0)
            to: syscall
          when: errno != 0
      - opt:
          do:
            - return: syscall.ESRCH
          when: st.p.parentPID != 0 && uint32(syscall.Getppid()) != st.p.parentPID
      - return: "0"
  - of: (*sandboxStage).capabilities
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).capabilities
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: c
        eval: st.p.caps
      - opt:
          do:
            - return: "0"
          when: c == nil
      - bind: hdr
        eval: "capHeader{version: capabilityVersion3}"
      - var:
          name: data
          type: "[2]capData"
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall(syscall.SYS_CAPGET, uintptr(unsafe.Pointer(&hdr)), uintptr(unsafe.Pointer(&data[0])), 0)
            to: syscall
          when: errno != 0
      - bind: permitted
        eval: (uint64(data[0].permitted) | uint64(data[1].permitted)<<32) & c.bounding
      - loop:
          do:
            - bind: shift
              eval: 32 * uint(i)
            - set: data[i]
              value: "capData{effective: uint32(permitted >> shift), permitted: uint32(permitted >> shift), inheritable: uint32(c.ambient >> shift)}"
          key: i
          range: data
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall(syscall.SYS_CAPSET, uintptr(unsafe.Pointer(&hdr)), uintptr(unsafe.Pointer(&data[0])), 0)
            to: syscall
          when: errno != 0
      - opt:
          do:
            - return: errno
          init:
            bind: _, _, errno
            eval: syscall.RawSyscall6(syscall.SYS_PRCTL, prCapAmbient, prCapAmbientClearAll, 0, 0, 0, 0)
            to: syscall
          when: errno != 0
      - loop:
          cond: cp <= uintptr(c.lastCap)
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: errno
                      init:
                        bind: _, _, errno
                        eval: syscall.RawSyscall6(syscall.SYS_PRCTL, prCapAmbient, prCapAmbientRaise, cp, 0, 0, 0)
                        to: syscall
                      when: errno != 0
                when: c.ambient&(1<<cp) != 0
          init: cp := uintptr(0)
          post: cp++
      - return: "0"
  - of: (*sandboxStage).sweep
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).sweep
        kind: self
      - id: syscall
        kind: stdlib
      - id: os
        kind: stdlib
      - id: errnoOf
        kind: internal
      - id: strconv
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.RawSyscall(sysCloseRange, uintptr(st.hsfd+1), closeRangeLast, closeRangeCloexec)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: errno == 0
      - opt:
          do:
            - return: errno
          when: errno != syscall.ENOSYS && errno != syscall.EINVAL
      - bind: entries, err
        eval: os.ReadDir(procSelfFD)
        to: os
      - opt:
          do:
            - return: errnoOf(err)
              to: errnoOf
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - eval: syscall.CloseOnExec(fd)
                    to: syscall
                init:
                  bind: fd, aErr
                  eval: strconv.Atoi(entry.Name())
                  to: strconv
                when: aErr == nil && fd > st.hsfd
          key: _
          range: entries
          value: entry
      - return: "0"
  - of: (*sandboxStage).noNewPrivs
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).noNewPrivs
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "0"
          when: "!st.p.noNewPrivs"
      - bind: _, _, errno
        eval: syscall.RawSyscall6(syscall.SYS_PRCTL, prSetNoNewPrivs, 1, 0, 0, 0, 0)
        to: syscall
      - return: errno
  - of: (*sandboxStage).landlock
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).landlock
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: st.ruleset < 0
      - bind: _, _, errno
        eval: syscall.RawSyscall(sysLandlockRestrictSelf, uintptr(st.ruleset), 0, 0)
        to: syscall
      - eval: swallowErr(syscall.Close(st.ruleset))
        to: swallowErr
      - return: errno
  - of: (*sandboxStage).filterAndExec
    participants:
      - id: caller
        kind: actor
      - id: (*sandboxStage).filterAndExec
        kind: self
      - id: syscall
        kind: stdlib
      - id: sandboxFail
        kind: internal
      - id: swallowErr
        kind: internal
      - id: exitGroup
        kind: internal
    steps:
      - opt:
          do:
            - bind: prog
              eval: "new(sockFprog{length: uint16(len(filter)), filter: &filter[0]})"
            - opt:
                do:
                  - eval: sandboxFail(st.hsfd, stepSeccomp, errno)
                    to: sandboxFail
                init:
                  bind: _, _, errno
                  eval: syscall.RawSyscall(syscall.SYS_PRCTL, prSetSeccomp, seccompModeFilter, uintptr(unsafe.Pointer(prog)))
                  to: syscall
                when: errno != 0
          init:
            bind: filter
            eval: st.p.filter
          when: len(filter) > 0
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_EXECVE, uintptr(unsafe.Pointer(st.argv0)), uintptr(unsafe.Pointer(&st.argv[0])), uintptr(unsafe.Pointer(&st.envv[0])))
        to: syscall
      - eval: swallowErr(errnoError(errno))
        to: swallowErr
      - eval: swallowErr(rawWrite(st.hsfd, []byte{handshakeExecFail}))
        to: swallowErr
      - eval: exitGroup(trampolineExecExit)
        to: exitGroup
  - of: rawWrite
    participants:
      - id: caller
        kind: actor
      - id: rawWrite
        kind: self
      - id: syscall
        kind: stdlib
      - id: errnoError
        kind: internal
    steps:
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_WRITE, uintptr(fd), uintptr(unsafe.Pointer(&b[0])), uintptr(len(b)))
        to: syscall
      - return: errnoError(errno)
        to: errnoError
  - of: errnoError
    steps:
      - opt:
          do:
            - return: nil
          when: errno == 0
      - return: errno
  - of: exitGroup
    participants:
      - id: caller
        kind: actor
      - id: exitGroup
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - bind: _, _, errno
              eval: syscall.RawSyscall(syscall.SYS_EXIT_GROUP, uintptr(code), 0, 0)
              to: syscall
            - eval: swallowErr(errnoError(errno))
              to: swallowErr
          forever: true
  - of: sandboxStepName
    steps:
      - opt:
          do:
            - return: sandboxStepNames[step]
          when: int(step) < len(sandboxStepNames)
      - return: "\"step \" + strconv.Itoa(int(step))"
  - of: sandboxReport
    steps:
      - return: "[sandboxReportLen]byte{handshakeSandboxFail, step, byte(errno), byte(errno >> 8)}"
  - of: sandboxFailure
    participants:
      - id: caller
        kind: actor
      - id: sandboxFailure
        kind: self
      - id: wrapSandboxFailed
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: wrapSandboxFailed(nil, errs.String("step", "unknown"))
              to: wrapSandboxFailed
          when: len(rest) < sandboxReportLen-1
      - bind: errno
        eval: syscall.Errno(uint16(rest[1]) | uint16(rest[2])<<8)
        to: syscall
      - return: wrapSandboxFailed(errno, errs.String("step", sandboxStepName(rest[0])), errs.String("errno", errno.Error()))
        to: wrapSandboxFailed
  - of: checkScheduling
    participants:
      - id: caller
        kind: actor
      - id: checkScheduling
        kind: self
      - id: checkSchedulingPlatform
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: sched == nil
      - opt:
          do:
            - return: coreproc.InvalidSpec
          when: "!knownPolicy(sched.Policy) || !knownIOClass(sched.IOClass) || sched.IOPriority < 0 || sched.IOPriority > maxIOPriority"
      - return: checkSchedulingPlatform(sched)
        to: checkSchedulingPlatform
  - of: knownPolicy
    steps:
      - switch:
          cases:
            - case: coreproc.SchedOther, coreproc.SchedFIFO, coreproc.SchedRR, coreproc.SchedBatch, coreproc.SchedIdle
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": p
  - of: knownIOClass
    steps:
      - return: c >= coreproc.IOClassNone && c <= coreproc.IOClassIdle
  - of: checkSchedulingPlatform
    steps:
      - return: nil
  - of: applyScheduling
    participants:
      - id: caller
        kind: actor
      - id: applyScheduling
        kind: self
      - id: syscall
        kind: stdlib
      - id: wrapRlimit
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: sched == nil
      - bind: param
        eval: "new(schedParam{priority: int32(sched.Priority)})"
      - bind: _, _, errno
        eval: syscall.Syscall(syscall.SYS_SCHED_SETSCHEDULER, uintptr(pid), uintptr(sched.Policy), uintptr(unsafe.Pointer(param)))
        to: syscall
      - opt:
          do:
            - return: wrapRlimit(errno, errs.Int("pid", pid), errs.String("policy", sched.Policy.String()))
              to: wrapRlimit
          when: errno != 0
      - opt:
          do:
            - return: nil
          when: sched.IOClass == coreproc.IOClassNone
      - bind: prio
        eval: int(sched.IOClass)<<ioprioClassShift | sched.IOPriority
      - set: _, _, errno
        to: syscall
        value: syscall.Syscall(syscall.SYS_IOPRIO_SET, ioprioWhoProcessSel, uintptr(pid), uintptr(prio))
      - opt:
          do:
            - return: wrapRlimit(errno, errs.Int("pid", pid), errs.String("io_class", sched.IOClass.String()))
              to: wrapRlimit
          when: errno != 0
      - return: nil
  - of: sealFDs
    participants:
      - id: caller
        kind: actor
      - id: sealFDs
        kind: self
      - id: sealWith
        kind: internal
    steps:
      - return: sealWith(markRangeCloexec, &closeRangeAbsent)
        to: sealWith
  - of: markRangeCloexec
    participants:
      - id: caller
        kind: actor
      - id: markRangeCloexec
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.Syscall(sysCloseRange, uintptr(firstSealedFD), closeRangeLast, closeRangeCloexec)
        to: syscall
      - return: errno
  - of: sealInherited
    participants:
      - id: caller
        kind: actor
      - id: sealInherited
        kind: self
      - id: sealFDs
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: spec.FDs == coreproc.FDsInherited
      - return: sealFDs()
        to: sealFDs
  - of: sealWith
    participants:
      - id: caller
        kind: actor
      - id: sealWith
        kind: self
      - id: sealByWalk
        kind: internal
      - id: wrapSpawn
        kind: internal
      - id: missing.Store
        kind: value
    steps:
      - opt:
          do:
            - return: sealByWalk(fdDir)
              to: sealByWalk
          when: missing.Load()
      - bind: errno
        eval: closeRange()
      - opt:
          do:
            - return: nil
          when: errno == 0
      - opt:
          do:
            - return: wrapSpawn(errno, errs.Int("fd", firstSealedFD))
              to: wrapSpawn
          when: errno != syscall.ENOSYS && errno != syscall.EINVAL
      - eval: missing.Store(true)
        to: missing.Store
      - return: sealByWalk(fdDir)
        to: sealByWalk
  - of: sealByWalk
    participants:
      - id: caller
        kind: actor
      - id: sealByWalk
        kind: self
      - id: os
        kind: stdlib
      - id: wrapSpawn
        kind: internal
      - id: strconv
        kind: stdlib
      - id: syscall
        kind: stdlib
    steps:
      - bind: entries, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: wrapSpawn(err, errs.String("fd", dir))
              to: wrapSpawn
          when: err != nil
      - loop:
          do:
            - bind: fd, aErr
              eval: strconv.Atoi(entry.Name())
              to: strconv
            - opt:
                do:
                  - continue: true
                when: aErr != nil || fd < firstSealedFD
            - eval: syscall.CloseOnExec(fd)
              to: syscall
          key: _
          range: entries
          value: entry
      - return: nil
  - of: stdioField
    participants:
      - id: caller
        kind: actor
      - id: stdioField
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.String("stdio", stream)
        to: errs
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: (*stdioState).recordCopyErr
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).recordCopyErr
        kind: self
      - id: s.copyMu.Lock
        kind: value
      - id: s.copyMu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
      - eval: s.copyMu.Lock()
        to: s.copyMu.Lock
      - opt:
          do:
            - set: s.copyErr
              value: err
          when: s.copyErr == nil
      - eval: s.copyMu.Unlock()
        to: s.copyMu.Unlock
  - of: (*stdioState).copyError
    steps:
      - lock:
          mutex: s.copyMu
          read: true
      - return: s.copyErr
  - of: buildStdio
    participants:
      - id: caller
        kind: actor
      - id: buildStdio
        kind: self
      - id: wired.build
        kind: internal
      - id: wired.closeAll
        kind: internal
      - id: buildPTYStdio
        kind: internal
    steps:
      - bind: wired
        eval: "&stdioState{drainGrace: spec.DrainGrace, drainClk: clock.System}"
      - switch:
          cases:
            - case: coreproc.StdioCapture
              do:
                - opt:
                    do:
                      - eval: wired.closeAll()
                        to: wired.closeAll
                      - return: nil, berr
                    init:
                      bind: berr
                      eval: wired.build(spec.Stdin, spec.Stdout, spec.Stderr)
                      to: wired.build
                    when: berr != nil
                - return: wired, nil
            - case: coreproc.StdioNull
              do:
                - opt:
                    do:
                      - eval: wired.closeAll()
                        to: wired.closeAll
                      - return: nil, berr
                    init:
                      bind: berr
                      eval: wired.build(nil, nil, nil)
                      to: wired.build
                    when: berr != nil
                - return: wired, nil
            - case: coreproc.StdioPTY
              do:
                - opt:
                    do:
                      - eval: wired.closeAll()
                        to: wired.closeAll
                      - return: nil, berr
                    init:
                      bind: berr
                      eval: buildPTYStdio(wired, spec.PTY)
                      to: buildPTYStdio
                    when: berr != nil
                - return: wired, nil
            - default: true
              do:
                - set: wired.files
                  value: "[stdioFdCount]*os.File{os.Stdin, os.Stdout, os.Stderr}"
                - return: wired, nil
          "on": spec.Stdio
  - of: (*stdioState).build
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).build
        kind: self
      - id: s.wireInput
        kind: internal
      - id: s.wireOutput
        kind: internal
    steps:
      - opt:
          do:
            - return: ierr
          init:
            bind: ierr
            eval: s.wireInput(in)
            to: s.wireInput
          when: ierr != nil
      - opt:
          do:
            - return: oerr
          init:
            bind: oerr
            eval: s.wireOutput(fdStdout, out)
            to: s.wireOutput
          when: oerr != nil
      - return: s.wireOutput(fdStderr, errw)
        to: s.wireOutput
  - of: (*stdioState).wireInput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).wireInput
        kind: self
      - id: s.wireNull
        kind: internal
      - id: os
        kind: stdlib
      - id: wrapSpawn
        kind: internal
    steps:
      - opt:
          do:
            - return: s.wireNull(fdStdin)
              to: s.wireNull
          when: reader == nil
      - bind: pr, pw, perr
        eval: os.Pipe()
        to: os
      - opt:
          do:
            - return: wrapSpawn(perr, stdioField("stdin"))
              to: wrapSpawn
          when: perr != nil
      - set: s.files[fdStdin]
        value: pr
      - set: s.opened
        value: append(s.opened, pr, pw)
      - set: s.closeChild
        value: append(s.closeChild, pr)
      - set: s.inDst, s.inSrc
        value: pw, reader
      - return: nil
  - of: (*stdioState).wireOutput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).wireOutput
        kind: self
      - id: s.wireNull
        kind: internal
      - id: os
        kind: stdlib
      - id: wrapSpawn
        kind: internal
    steps:
      - opt:
          do:
            - return: s.wireNull(idx)
              to: s.wireNull
          when: w == nil
      - bind: pr, pw, perr
        eval: os.Pipe()
        to: os
      - opt:
          do:
            - return: wrapSpawn(perr, stdioField(outName(idx)))
              to: wrapSpawn
          when: perr != nil
      - set: s.files[idx]
        value: pw
      - set: s.opened
        value: append(s.opened, pr, pw)
      - set: s.closeChild
        value: append(s.closeChild, pw)
      - set: s.outSrc
        value: append(s.outSrc, pr)
      - set: s.outSink
        value: append(s.outSink, w)
      - set: s.outNames
        value: append(s.outNames, outName(idx))
      - return: nil
  - of: nullDevice
    participants:
      - id: caller
        kind: actor
      - id: nullDevice
        kind: self
      - id: sharedNull.Load
        kind: value
      - id: openNull
        kind: internal
      - id: sharedNull.Store
        kind: value
    steps:
      - opt:
          do:
            - return: f, nil
          init:
            bind: f
            eval: sharedNull.Load()
            to: sharedNull.Load
          when: f != nil
      - lock:
          mutex: sharedNullMu
      - opt:
          do:
            - return: f, nil
          init:
            bind: f
            eval: sharedNull.Load()
            to: sharedNull.Load
          when: f != nil
      - bind: f, err
        eval: openNull(os.O_RDWR)
        to: openNull
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - eval: sharedNull.Store(f)
        to: sharedNull.Store
      - return: f, nil
  - of: (*stdioState).wireNull
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).wireNull
        kind: self
      - id: nullDevice
        kind: internal
    steps:
      - bind: f, oerr
        eval: nullDevice()
        to: nullDevice
      - opt:
          do:
            - return: oerr
          when: oerr != nil
      - set: s.files[idx]
        value: f
      - return: nil
  - of: openNull
    participants:
      - id: caller
        kind: actor
      - id: openNull
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: null, oerr
        eval: os.OpenFile(os.DevNull, flag, 0)
        to: os
      - opt:
          do:
            - return: nil, wrapSpawn(oerr, stdioField("null"))
          when: oerr != nil
      - return: null, nil
  - of: (*stdioState).afterStart
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).afterStart
        kind: self
      - id: swallowErr
        kind: internal
      - id: s.wg.Add
        kind: value
      - id: s.drainOutput
        kind: internal
      - id: s.inLive.Store
        kind: value
      - id: s.feedInput
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(f.Close())
              to: swallowErr
          key: _
          range: s.closeChild
          value: f
      - loop:
          do:
            - eval: s.wg.Add(1)
              to: s.wg.Add
            - go: s.drainOutput(s.outSrc[i], s.outSink[i])
              to: s.drainOutput
          key: i
          range: s.outSrc
      - opt:
          do:
            - eval: s.inLive.Store(true)
              to: s.inLive.Store
            - go: s.feedInput(s.inDst, s.inSrc)
              to: s.feedInput
          when: s.inDst != nil
  - of: (*stdioState).drainOutput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).drainOutput
        kind: self
      - id: s.wg.Done
        kind: value
      - id: io
        kind: stdlib
      - id: s.delivered.Add
        kind: value
      - id: s.recordHeld
        kind: internal
      - id: s.recordCopyErr
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - defer: s.wg.Done()
        to: s.wg.Done
      - bind: n, cerr
        eval: io.Copy(sink, src)
        to: io
      - eval: s.delivered.Add(n)
        to: s.delivered.Add
      - opt:
          do:
            - eval: s.recordHeld(src)
              to: s.recordHeld
            - return: ""
          when: s.cut.Load() && errors.Is(cerr, os.ErrClosed)
      - eval: s.recordCopyErr(cerr)
        to: s.recordCopyErr
      - eval: swallowErr(src.Close())
        to: swallowErr
  - of: (*stdioState).feedInput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).feedInput
        kind: self
      - id: io
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: s.inLive.Store
        kind: value
    steps:
      - bind: _, cerr
        eval: io.Copy(dst, src)
        to: io
      - eval: swallowErr(cerr)
        to: swallowErr
      - eval: swallowErr(dst.Close())
        to: swallowErr
      - eval: s.inLive.Store(false)
        to: s.inLive.Store
  - of: (*stdioState).drainBounded
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).drainBounded
        kind: self
      - id: s.wg.Wait
        kind: value
      - id: clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: s.cutDrain
        kind: internal
    steps:
      - opt:
          do:
            - eval: s.wg.Wait()
              to: s.wg.Wait
            - return: false, nil, s.delivered.Load()
          when: len(s.outSrc) == 0 || s.drainGrace < 0
      - bind: grace
        eval: s.drainGrace
      - opt:
          do:
            - set: grace
              value: defaultDrainGrace
          when: grace == 0
      - bind: joined
        eval: make(chan struct{})
      - go: |-
          func() {
          		//: every copier returned.
          		s.wg.Wait()
          		close(joined)
          	}()
      - bind: clk
        eval: s.drainClk
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - bind: timer
        eval: clk.NewTimer(grace)
        to: clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-joined
              do:
                - return: false, nil, s.delivered.Load()
            - comm: <-timer.C()
      - return: s.cutDrain(joined)
        to: s.cutDrain
  - of: (*stdioState).cutDrain
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).cutDrain
        kind: self
      - id: s.cut.Store
        kind: value
      - id: swallowErr
        kind: internal
      - id: s.inLive.Load
        kind: value
      - id: s.copyMu.RLock
        kind: value
      - id: s.copyMu.RUnlock
        kind: value
    steps:
      - eval: s.cut.Store(true)
        to: s.cut.Store
      - loop:
          do:
            - eval: swallowErr(src.Close())
              to: swallowErr
          key: _
          range: s.outSrc
          value: src
      - bind: stdinHeld
        eval: s.inLive.Load()
        to: s.inLive.Load
      - opt:
          do:
            - eval: swallowErr(s.inDst.Close())
              to: swallowErr
          when: stdinHeld
      - eval: <-joined
      - eval: s.copyMu.RLock()
        to: s.copyMu.RLock
      - set: held
        value: append(held, s.held...)
      - eval: s.copyMu.RUnlock()
        to: s.copyMu.RUnlock
      - opt:
          do:
            - set: held
              value: append(held, "stdin")
          when: stdinHeld
      - return: len(held) > 0, held, s.delivered.Load()
  - of: (*stdioState).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).closeAll
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(f.Close())
              to: swallowErr
          key: _
          range: s.opened
          value: f
  - of: outName
    steps:
      - opt:
          do:
            - return: "\"stdout\""
          when: idx == fdStdout
      - return: "\"stderr\""
  - of: installTrampoline
    participants:
      - id: caller
        kind: actor
      - id: installTrampoline
        kind: self
      - id: os
        kind: stdlib
      - id: runTrampoline
        kind: internal
    steps:
      - bind: payload, isTrampoline
        eval: os.LookupEnv(trampolineEnv)
        to: os
      - opt:
          do:
            - return: struct{}{}
          when: "!isTrampoline"
      - eval: runTrampoline(payload)
        to: runTrampoline
      - return: struct{}{}
  - of: runTrampoline
    participants:
      - id: caller
        kind: actor
      - id: runTrampoline
        kind: self
      - id: applyTrampoline
        kind: internal
      - id: reportHandshake
        kind: internal
      - id: stderrLine
        kind: internal
      - id: os
        kind: stdlib
      - id: applyCgroupPlacement
        kind: internal
      - id: armHandshakeClose
        kind: internal
      - id: environWithout
        kind: internal
      - id: withPIDEnv
        kind: internal
      - id: execSandboxed
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - eval: reportHandshake(handshakeApplyFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: \" + msg)"
              to: stderrLine
            - eval: os.Exit(trampolineApplyExit)
              to: os
          init:
            bind: msg
            eval: applyTrampoline(payload)
            to: applyTrampoline
          when: msg != ""
      - opt:
          do:
            - eval: reportHandshake(handshakeCgroupFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: \" + msg)"
              to: stderrLine
            - eval: os.Exit(trampolineApplyExit)
              to: os
          init:
            bind: msg
            eval: applyCgroupPlacement(os.Getenv(trampolineCgroupEnv))
            to: applyCgroupPlacement
          when: msg != ""
      - opt:
          do:
            - eval: reportHandshake(handshakeExecFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: missing target in argv\")"
              to: stderrLine
            - eval: os.Exit(trampolineExecExit)
              to: os
          when: len(os.Args) < trampolineMinArgs
      - eval: armHandshakeClose()
        to: armHandshakeClose
      - bind: target
        eval: os.Args[1]
      - bind: env
        eval: os.Environ()
        to: os
      - loop:
          do:
            - set: env
              to: environWithout
              value: environWithout(env, key)
          key: _
          range: reservedEnvKeys
          value: key
      - set: env
        to: withPIDEnv
        value: withPIDEnv(env, os.Getenv(trampolinePIDEnv), os.Getpid())
      - opt:
          do:
            - eval: execSandboxed(fdText, target, os.Args[trampolineMinArgs:], env)
              to: execSandboxed
          init:
            bind: fdText, sandboxed
            eval: os.LookupEnv(trampolineSandboxEnv)
            to: os
          when: sandboxed
      - opt:
          do:
            - eval: reportHandshake(handshakeExecFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline exec \" + target + \": \" + err.Error())"
              to: stderrLine
            - eval: os.Exit(trampolineExecExit)
              to: os
          init:
            bind: err
            eval: syscall.Exec(target, os.Args[trampolineMinArgs:], env)
            to: syscall
          when: err != nil
  - of: childHandshakeFD
    participants:
      - id: caller
        kind: actor
      - id: childHandshakeFD
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw
        eval: os.Getenv(trampolineHsFdEnv)
        to: os
      - opt:
          do:
            - return: defaultHandshakeFD
          when: raw == ""
      - bind: fd, err
        eval: strconv.Atoi(raw)
        to: strconv
      - opt:
          do:
            - return: defaultHandshakeFD
          when: err != nil
      - return: fd
  - of: reportHandshake
    participants:
      - id: caller
        kind: actor
      - id: reportHandshake
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: syscall.Write(childHandshakeFD(), []byte{code})
            to: syscall
          when: err != nil
  - of: armHandshakeClose
    participants:
      - id: caller
        kind: actor
      - id: armHandshakeClose
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - eval: syscall.CloseOnExec(childHandshakeFD())
        to: syscall
  - of: stderrLine
    participants:
      - id: caller
        kind: actor
      - id: stderrLine
        kind: self
      - id: os.Stderr.WriteString
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: os.Stderr.WriteString(msg + "\n")
            to: os.Stderr.WriteString
          when: err != nil
  - of: applyTrampoline
    participants:
      - id: caller
        kind: actor
      - id: applyTrampoline
        kind: self
      - id: applyToken
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: tok == ""
            - opt:
                do:
                  - return: msg
                init:
                  bind: msg
                  eval: applyToken(tok)
                  to: applyToken
                when: msg != ""
          key: tok
          range: strings.SplitSeq(payload, ";")
      - return: "\"\""
  - of: applyToken
    participants:
      - id: caller
        kind: actor
      - id: applyToken
        kind: self
      - id: applyUmaskToken
        kind: internal
      - id: applyRlimitToken
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'u'"
              do:
                - return: applyUmaskToken(tok[1:])
                  to: applyUmaskToken
            - case: "'r'"
              do:
                - return: applyRlimitToken(tok[1:])
                  to: applyRlimitToken
            - default: true
              do:
                - return: "\"unknown trampoline token\""
          "on": tok[0]
  - of: applyUmaskToken
    participants:
      - id: caller
        kind: actor
      - id: applyUmaskToken
        kind: self
      - id: strconv
        kind: stdlib
      - id: syscall
        kind: stdlib
    steps:
      - bind: mask, err
        eval: strconv.Atoi(s)
        to: strconv
      - opt:
          do:
            - return: "\"malformed umask token\""
          when: err != nil
      - eval: syscall.Umask(mask)
        to: syscall
      - return: "\"\""
  - of: applyRlimitToken
    participants:
      - id: caller
        kind: actor
      - id: applyRlimitToken
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
      - id: syscall
        kind: stdlib
    steps:
      - bind: numStr, rest, ok1
        eval: strings.Cut(s, ",")
        to: strings
      - bind: softStr, hardStr, ok2
        eval: strings.Cut(rest, ",")
        to: strings
      - opt:
          do:
            - return: "\"malformed rlimit token\""
          when: "!ok1 || !ok2"
      - bind: num, e1
        eval: strconv.Atoi(numStr)
        to: strconv
      - bind: soft, e2
        eval: strconv.ParseUint(softStr, decimalRadix, uintBits)
        to: strconv
      - bind: hard, e3
        eval: strconv.ParseUint(hardStr, decimalRadix, uintBits)
        to: strconv
      - opt:
          do:
            - return: "\"malformed rlimit values\""
          when: e1 != nil || e2 != nil || e3 != nil
      - opt:
          do:
            - return: |-
                "setrlimit(" + numStr + ",soft=" + softStr + ",hard=" + hardStr +
                			"): " + err.Error()
          init:
            bind: err
            eval: syscall.Setrlimit(num, new(rlim.Make(soft, hard)))
            to: syscall
          when: err != nil
      - return: "\"\""
  - of: environWithout
    participants:
      - id: caller
        kind: actor
      - id: environWithout
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: out
        eval: make([]string, 0, len(env))
      - loop:
          do:
            - bind: k, _, _
              eval: strings.Cut(kv, "=")
              to: strings
            - opt:
                do:
                  - set: out
                    value: append(out, kv)
                when: k != key
          key: _
          range: env
          value: kv
      - return: out
  - of: needsTrampoline
    steps:
      - return: len(spec.Rlimits) > 0 || spec.Umask != nil || len(spec.PIDEnv) > 0 || cgroupByTrampoline(spec.CgroupPath)
  - of: trampolined
    steps:
      - return: spec.Sandbox != nil || needsTrampoline(spec)
  - of: encodeTrampoline
    participants:
      - id: caller
        kind: actor
      - id: encodeTrampoline
        kind: self
      - id: b.WriteString
        kind: value
      - id: b.String
        kind: value
    steps:
      - var:
          name: b
          type: strings.Builder
      - opt:
          do:
            - eval: b.WriteString("u" + strconv.Itoa(*spec.Umask) + ";")
              to: b.WriteString
          when: spec.Umask != nil
      - loop:
          do:
            - eval: |-
                b.WriteString("r" + strconv.Itoa(resourceLimits[res]) + "," +
                			strconv.FormatUint(lim.Soft, decimalRadix) + "," +
                			strconv.FormatUint(lim.Hard, decimalRadix) + ";")
              to: b.WriteString
          key: res
          range: spec.Rlimits
          value: lim
      - return: b.String()
        to: b.String
  - of: trampolineSpawn
    participants:
      - id: caller
        kind: actor
      - id: trampolineSpawn
        kind: self
      - id: trampolineSelf
        kind: internal
    steps:
      - bind: self, eErr
        eval: trampolineSelf(spec)
        to: trampolineSelf
      - opt:
          do:
            - return: "\"\", nil, nil, eErr"
          when: eErr != nil
      - set: argv
        value: append([]string{self, spec.Path}, buildArgv(spec)...)
      - set: envAddon
        value: "[]string{trampolineEnv + \"=\" + encodeTrampoline(spec)}"
      - opt:
          do:
            - set: envAddon
              value: append(envAddon, trampolineCgroupEnv+"="+spec.CgroupPath)
          when: spec.CgroupPath != ""
      - opt:
          do:
            - set: envAddon
              value: append(envAddon, trampolinePIDEnv+"="+strings.Join(spec.PIDEnv, ","))
          when: len(spec.PIDEnv) > 0
      - return: self, argv, envAddon, nil
  - of: withPIDEnv
    participants:
      - id: caller
        kind: actor
      - id: withPIDEnv
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: env
          when: names == ""
      - bind: value
        eval: strconv.Itoa(pid)
        to: strconv
      - loop:
          do:
            - set: env
              value: append(environWithout(env, name), name+"="+value)
          key: name
          range: strings.SplitSeq(names, ",")
      - return: env
