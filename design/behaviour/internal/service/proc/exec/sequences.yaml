          cases:
            - case: coreproc.StdioCapture
              do:
                - opt:
                    do:
                      - eval: s.closeAll()
                        to: s.closeAll
                      - return: nil, berr
                    init:
                      bind: berr
                      eval: s.build(spec.Stdin, spec.Stdout, spec.Stderr)
                      to: s.build
                    when: berr != nil
                - return: s, nil
            - case: coreproc.StdioNull
              do:
                - opt:
                    do:
                      - eval: s.closeAll()
                        to: s.closeAll
                      - return: nil, berr
