        to: os
  - of: stdioField
    participants:
      - id: caller
        kind: actor
      - id: stdioField
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.String("stdio", stream)
        to: errs
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: (*stdioState).recordCopyErr
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).recordCopyErr
        kind: self
      - id: s.copyMu.Lock
        kind: value
      - id: s.copyMu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
      - eval: s.copyMu.Lock()
        to: s.copyMu.Lock
      - opt:
          do:
            - set: s.copyErr
              value: err
          when: s.copyErr == nil
      - eval: s.copyMu.Unlock()
        to: s.copyMu.Unlock
  - of: (*stdioState).copyError
    steps:
      - lock:
          mutex: s.copyMu
          read: true
      - return: s.copyErr
  - of: buildStdio
    participants:
      - id: caller
        kind: actor
      - id: buildStdio
        kind: self
      - id: s.build
        kind: internal
      - id: s.closeAll
        kind: internal
    steps:
      - bind: s
        eval: "&stdioState{}"
