    participants:
      - id: caller
        kind: actor
      - id: heldDir.entry
        kind: self
      - id: syscall
        kind: stdlib
      - id: fstatEntry
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: fd, err
        eval: syscall.Openat(d.fd, name, oPath|syscall.O_NOFOLLOW|syscall.O_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: heldEntry{}, entryStat{}, "cannot be opened", err
          when: err != nil
      - set: st, err
        to: fstatEntry
        value: fstatEntry(fd)
      - opt:
          do:
            - eval: swallowErr(syscall.Close(fd))
              to: swallowErr
            - return: heldEntry{}, entryStat{}, "cannot be examined", err
          when: err != nil
      - return: "heldEntry{fd: fd}, st, \"\", nil"
