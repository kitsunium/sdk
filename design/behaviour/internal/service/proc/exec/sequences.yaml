        to: s.recordCopyErr
      - eval: swallowErr(src.Close())
        to: swallowErr
  - of: (*stdioState).feedInput
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).feedInput
        kind: self
      - id: io
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: _, cerr
        eval: io.Copy(dst, src)
        to: io
      - eval: swallowErr(cerr)
        to: swallowErr
      - eval: swallowErr(dst.Close())
        to: swallowErr
  - of: (*stdioState).wait
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).wait
        kind: self
      - id: s.wg.Wait
        kind: value
    steps:
      - eval: s.wg.Wait()
        to: s.wg.Wait
  - of: (*stdioState).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*stdioState).closeAll
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(f.Close())
              to: swallowErr
          key: _
          range: s.opened
          value: f
  - of: outName
    steps:
      - opt:
          do:
            - return: "\"stdout\""
          when: idx == fdStdout
      - return: "\"stderr\""
  - of: installTrampoline
    participants:
      - id: caller
        kind: actor
      - id: installTrampoline
        kind: self
      - id: os
        kind: stdlib
      - id: runTrampoline
        kind: internal
    steps:
      - bind: payload, isTrampoline
        eval: os.LookupEnv(trampolineEnv)
        to: os
      - opt:
          do:
            - return: struct{}{}
          when: "!isTrampoline"
      - eval: runTrampoline(payload)
        to: runTrampoline
      - return: struct{}{}
  - of: runTrampoline
    participants:
      - id: caller
        kind: actor
      - id: runTrampoline
        kind: self
      - id: applyTrampoline
        kind: internal
      - id: reportHandshake
        kind: internal
      - id: stderrLine
        kind: internal
      - id: os
        kind: stdlib
      - id: applyCgroupPlacement
        kind: internal
      - id: armHandshakeClose
        kind: internal
      - id: environWithout
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - eval: reportHandshake(handshakeApplyFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: \" + msg)"
              to: stderrLine
            - eval: os.Exit(trampolineApplyExit)
              to: os
          init:
            bind: msg
            eval: applyTrampoline(payload)
            to: applyTrampoline
          when: msg != ""
      - opt:
          do:
            - eval: reportHandshake(handshakeCgroupFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: \" + msg)"
              to: stderrLine
            - eval: os.Exit(trampolineApplyExit)
              to: os
          init:
            bind: msg
            eval: applyCgroupPlacement(os.Getenv(trampolineCgroupEnv))
            to: applyCgroupPlacement
          when: msg != ""
      - opt:
          do:
            - eval: reportHandshake(handshakeExecFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline: missing target in argv\")"
              to: stderrLine
            - eval: os.Exit(trampolineExecExit)
              to: os
          when: len(os.Args) < trampolineMinArgs
      - eval: armHandshakeClose()
        to: armHandshakeClose
      - bind: target
        eval: os.Args[1]
      - bind: env
        eval: |-
          environWithout(environWithout(environWithout(os.Environ(),
          		trampolineEnv), trampolineCgroupEnv), trampolineHsFdEnv)
        to: environWithout
      - opt:
          do:
            - eval: reportHandshake(handshakeExecFail)
              to: reportHandshake
            - eval: "stderrLine(\"sdk trampoline exec \" + target + \": \" + err.Error())"
              to: stderrLine
            - eval: os.Exit(trampolineExecExit)
              to: os
          init:
            bind: err
            eval: syscall.Exec(target, os.Args[trampolineMinArgs:], env)
            to: syscall
          when: err != nil
  - of: childHandshakeFD
    participants:
      - id: caller
        kind: actor
      - id: childHandshakeFD
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw
        eval: os.Getenv(trampolineHsFdEnv)
        to: os
      - opt:
          do:
            - return: defaultHandshakeFD
          when: raw == ""
      - bind: fd, err
        eval: strconv.Atoi(raw)
        to: strconv
      - opt:
          do:
            - return: defaultHandshakeFD
          when: err != nil
      - return: fd
  - of: reportHandshake
    participants:
      - id: caller
        kind: actor
      - id: reportHandshake
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: syscall.Write(childHandshakeFD(), []byte{code})
            to: syscall
          when: err != nil
  - of: armHandshakeClose
    participants:
      - id: caller
        kind: actor
      - id: armHandshakeClose
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - eval: syscall.CloseOnExec(childHandshakeFD())
        to: syscall
  - of: stderrLine
    participants:
      - id: caller
        kind: actor
      - id: stderrLine
        kind: self
      - id: os.Stderr.WriteString
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: os.Stderr.WriteString(msg + "\n")
            to: os.Stderr.WriteString
          when: err != nil
  - of: applyTrampoline
    participants:
      - id: caller
        kind: actor
      - id: applyTrampoline
        kind: self
      - id: applyToken
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: tok == ""
            - opt:
                do:
                  - return: msg
                init:
                  bind: msg
                  eval: applyToken(tok)
                  to: applyToken
                when: msg != ""
          key: tok
          range: strings.SplitSeq(payload, ";")
      - return: "\"\""
  - of: applyToken
    participants:
      - id: caller
        kind: actor
      - id: applyToken
        kind: self
      - id: applyUmaskToken
        kind: internal
      - id: applyRlimitToken
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'u'"
              do:
                - return: applyUmaskToken(tok[1:])
                  to: applyUmaskToken
            - case: "'r'"
              do:
                - return: applyRlimitToken(tok[1:])
                  to: applyRlimitToken
            - default: true
              do:
                - return: "\"unknown trampoline token\""
          "on": tok[0]
  - of: applyUmaskToken
    participants:
      - id: caller
        kind: actor
      - id: applyUmaskToken
        kind: self
      - id: strconv
        kind: stdlib
      - id: syscall
        kind: stdlib
    steps:
      - bind: mask, err
        eval: strconv.Atoi(s)
        to: strconv
      - opt:
          do:
            - return: "\"malformed umask token\""
          when: err != nil
      - eval: syscall.Umask(mask)
        to: syscall
      - return: "\"\""
  - of: applyRlimitToken
    participants:
      - id: caller
        kind: actor
      - id: applyRlimitToken
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
      - id: syscall
        kind: stdlib
    steps:
      - bind: numStr, rest, ok1
        eval: strings.Cut(s, ",")
        to: strings
      - bind: softStr, hardStr, ok2
        eval: strings.Cut(rest, ",")
        to: strings
      - opt:
          do:
            - return: "\"malformed rlimit token\""
          when: "!ok1 || !ok2"
      - bind: num, e1
        eval: strconv.Atoi(numStr)
        to: strconv
      - bind: soft, e2
        eval: strconv.ParseUint(softStr, decimalRadix, uintBits)
        to: strconv
      - bind: hard, e3
        eval: strconv.ParseUint(hardStr, decimalRadix, uintBits)
        to: strconv
      - opt:
          do:
            - return: "\"malformed rlimit values\""
          when: e1 != nil || e2 != nil || e3 != nil
      - opt:
          do:
            - return: |-
                "setrlimit(" + numStr + ",soft=" + softStr + ",hard=" + hardStr +
                			"): " + err.Error()
          init:
            bind: err
            eval: syscall.Setrlimit(num, new(rlim.Make(soft, hard)))
            to: syscall
          when: err != nil
      - return: "\"\""
  - of: environWithout
    participants:
      - id: caller
        kind: actor
      - id: environWithout
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: out
        eval: make([]string, 0, len(env))
      - loop:
          do:
            - bind: k, _, _
              eval: strings.Cut(kv, "=")
              to: strings
            - opt:
                do:
                  - set: out
                    value: append(out, kv)
                when: k != key
          key: _
          range: env
          value: kv
      - return: out
  - of: needsTrampoline
    steps:
      - return: len(spec.Rlimits) > 0 || spec.Umask != nil || spec.CgroupPath != ""
  - of: encodeTrampoline
    participants:
      - id: caller
        kind: actor
      - id: encodeTrampoline
        kind: self
      - id: b.WriteString
        kind: value
      - id: b.String
        kind: value
    steps:
      - var:
          name: b
          type: strings.Builder
      - opt:
          do:
            - eval: b.WriteString("u" + strconv.Itoa(*spec.Umask) + ";")
              to: b.WriteString
          when: spec.Umask != nil
      - loop:
          do:
            - eval: |-
                b.WriteString("r" + strconv.Itoa(resourceLimits[res]) + "," +
                			strconv.FormatUint(lim.Soft, decimalRadix) + "," +
                			strconv.FormatUint(lim.Hard, decimalRadix) + ";")
              to: b.WriteString
          key: res
          range: spec.Rlimits
          value: lim
      - return: b.String()
        to: b.String
  - of: trampolineSpawn
    participants:
      - id: caller
        kind: actor
      - id: trampolineSpawn
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: self, eErr
        eval: os.Executable()
        to: os
      - opt:
          do:
            - return: "\"\", nil, nil, eErr"
          when: eErr != nil
      - set: argv
        value: append([]string{self, spec.Path}, buildArgv(spec)...)
      - set: envAddon
        value: "[]string{trampolineEnv + \"=\" + encodeTrampoline(spec)}"
      - opt:
          do:
            - set: envAddon
              value: append(envAddon, trampolineCgroupEnv+"="+spec.CgroupPath)
          when: spec.CgroupPath != ""
      - return: self, argv, envAddon, nil
  - of: wrapSpawn
    participants:
      - id: caller
        kind: actor
      - id: wrapSpawn
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeSpawnFailed,
          		Reason:   "SPAWN_FAILED",
          		Public:   "Could not start the process",
          		Private:  "service/proc/exec.Start: fork/exec failed",
          		ExitCode: exitOSErr,
          	}, fields...)
        to: errs
  - of: wrapWait
    participants:
      - id: caller
        kind: actor
      - id: wrapWait
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeWaitFailed,
          		Reason:   "WAIT_FAILED",
          		Public:   "Could not wait for the process to exit",
          		Private:  "service/proc/exec.Wait: wait4 returned an unexpected error",
          		ExitCode: exitOSErr,
          	}, fields...)
        to: errs
  - of: wrapSignal
    participants:
      - id: caller
        kind: actor
      - id: wrapSignal
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeSignalFailed,
          		Reason:   "SIGNAL_FAILED",
          		Public:   "Could not deliver the signal",
          		Private:  "service/proc: kill(2) failed for the target pid or process group",
          		ExitCode: exitOSErr,
          	}, fields...)
        to: errs
  - of: wrapStop
    participants:
      - id: caller
        kind: actor
      - id: wrapStop
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeStopFailed,
          		Reason:   "STOP_FAILED",
          		Public:   "Could not stop the process",
          		Private:  "service/proc/exec.Stop: process group survived signal escalation to SIGKILL",
          		ExitCode: exitOSErr,
          	}, fields...)
        to: errs
  - of: wrapRlimit
    participants:
      - id: caller
        kind: actor
      - id: wrapRlimit
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeRlimitFailed,
          		Reason:   "RLIMIT_FAILED",
          		Public:   "Could not apply the resource limit",
          		Private:  "service/proc/rlimit.Apply: setrlimit(2) failed",
          		ExitCode: exitOSErr,
          	}, fields...)
        to: errs
  - of: wrapCgroupUnavailable
    participants:
      - id: caller
        kind: actor
      - id: wrapCgroupUnavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeCgroupUnavailable,
          		Reason:   "CGROUP_UNAVAILABLE",
          		Public:   "cgroup v2 is not available or not delegated",
          		Private:  "service/proc/exec.Start: Spec.CgroupPath is missing, not a cgroup v2 directory, or not delegated",
          		ExitCode: exitUnavailable,
          	}, fields...)
        to: errs
  - of: wrapStdioCapture
    participants:
      - id: caller
        kind: actor
      - id: wrapStdioCapture
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeStdioCaptureFailed,
          		Reason:   "STDIO_CAPTURE_FAILED",
          		Public:   "Could not deliver the captured output to the writer",
          		Private:  "service/proc/exec.Wait: a StdioCapture copier failed writing the child's output to the caller's sink",
          		ExitCode: exitIOErr,
          	}, fields...)
        to: errs
  - of: wrapUnknownUser
    participants:
      - id: caller
        kind: actor
      - id: wrapUnknownUser
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeUnknownUser,
          		Reason:   "UNKNOWN_USER",
          		Public:   "The requested user does not exist",
          		Private:  "service/proc/exec.Start: Spec.User did not resolve to a uid via os/user",
          		ExitCode: exitNoUser,
          	}, fields...)
        to: errs
  - of: wrapUnknownGroup
    participants:
      - id: caller
        kind: actor
      - id: wrapUnknownGroup
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeUnknownGroup,
          		Reason:   "UNKNOWN_GROUP",
          		Public:   "The requested group does not exist",
          		Private:  "service/proc/exec.Start: Spec.Group/Groups did not resolve to a gid via os/user",
          		ExitCode: exitNoUser,
          	}, fields...)
        to: errs
  - of: leaderIsZombie
    steps:
      - return: "false"
