      - bind: r, w, pErr
        eval: os.Pipe()
        to: os
      - opt:
          do:
            - return: nil, pErr
          when: pErr != nil
      - return: "&handshake{read: r, write: w}, nil"
  - of: (*handshake).childFile
    steps:
      - return: h.write
  - of: (*handshake).await
    participants:
      - id: caller
        kind: actor
      - id: (*handshake).await
