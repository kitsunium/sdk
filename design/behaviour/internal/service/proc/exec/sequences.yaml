          do:
            - return: heldDir{}, entryStat{}, err
          when: err != nil
      - bind: st, err
        eval: fstatEntry(fd)
        to: fstatEntry
      - opt:
          do:
            - eval: swallowErr(syscall.Close(fd))
              to: swallowErr
            - return: heldDir{}, entryStat{}, errorOr(err, syscall.ESTALE)
          when: err != nil
      - return: "heldDir{fd: fd}, st, nil"
