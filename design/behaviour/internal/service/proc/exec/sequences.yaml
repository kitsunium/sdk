                  bind: wErr
                  eval: setWinsize(master, *size)
                  to: setWinsize
                when: wErr != nil
          when: size != nil
      - set: s.files
        value: "[stdioFdCount]*os.File{slave, slave, slave}"
      - set: s.closeChild
        value: append(s.closeChild, slave)
