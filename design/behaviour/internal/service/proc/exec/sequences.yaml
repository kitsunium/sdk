      - return: self, tArgv, addon, nil
  - of: buildProcAttr
    participants:
      - id: caller
        kind: actor
      - id: buildProcAttr
        kind: self
      - id: resolveCredential
        kind: internal
      - id: setDieWithParent
        kind: internal
      - id: dedupEnv
        kind: internal
    steps:
      - bind: cred, cErr
        eval: resolveCredential(spec)
        to: resolveCredential
      - opt:
          do:
            - return: nil, cErr
          when: cErr != nil
      - bind: sysAttr
        eval: |-
          &syscall.SysProcAttr{
          		Setpgid:    spec.Setpgid,
          		Setsid:     spec.Setsid,
          		Credential: cred,
          	}
      - eval: setDieWithParent(sysAttr, spec.DieWithParent)
        to: setDieWithParent
      - opt:
          do:
            - set: sysAttr.Setsid, sysAttr.Setctty, sysAttr.Ctty, sysAttr.Setpgid
              value: true, true, fdStdin, false
          when: spec.Stdio == coreproc.StdioPTY
      - bind: env
        eval: dedupEnv(spec.Env)
        to: dedupEnv
      - set: env
        value: append(env, envAddon...)
      - return: "&os.ProcAttr{Dir: spec.Dir, Env: env, Files: files, Sys: sysAttr}, nil"
  - of: appendExtraFiles
    steps:
      - opt:
          do:
            - return: std
          when: len(extra) == 0
      - bind: out
        eval: make([]*os.File, 0, len(std)+len(extra))
      - set: out
        value: append(out, std...)
      - set: out
        value: append(out, extra...)
      - return: out
  - of: buildArgv
    steps:
      - opt:
          do:
            - return: "[]string{spec.Path}"
          when: len(spec.Args) == 0
      - return: spec.Args
  - of: applyPostStart
    participants:
      - id: caller
        kind: actor
      - id: applyPostStart
        kind: self
      - id: applyNice
        kind: internal
      - id: applyOOMScoreAdj
        kind: internal
      - id: applyScheduling
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: applyNice(pid, spec.Nice)
            to: applyNice
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: applyOOMScoreAdj(pid, spec.OOMScoreAdj)
            to: applyOOMScoreAdj
          when: err != nil
      - return: applyScheduling(pid, spec.Scheduling)
        to: applyScheduling
  - of: wrapForeignWait
    participants:
      - id: caller
        kind: actor
      - id: wrapForeignWait
        kind: self
      - id: wrapWait
        kind: internal
    steps:
      - return: wrapWait(syscall.ECHILD, errs.Int("pid", pid), errs.String("why", "not a child of this process"))
        to: wrapWait
  - of: (*handle).Handle
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Handle
        kind: self
      - id: dupProcessHandle
        kind: internal
    steps:
      - lock:
          mutex: h.procMu
          read: true
      - opt:
          do:
            - return: nil, false
          when: h.leaderReaped()
      - return: dupProcessHandle(h.proc)
        to: dupProcessHandle
  - of: (*handle).SignalHandle
    participants:
      - id: caller
        kind: actor
      - id: (*handle).SignalHandle
        kind: self
      - id: wrapSignal
        kind: internal
      - id: signalThrough
        kind: internal
    steps:
      - lock:
          mutex: h.procMu
          read: true
      - opt:
          do:
            - return: wrapSignal(syscall.ESRCH, errs.Int("pid", h.pid), errs.Int("signal", sig.Int()))
              to: wrapSignal
          when: h.leaderReaped()
      - return: signalThrough(h.proc, h.pid, sig)
        to: signalThrough
  - of: dupProcessHandle
    participants:
      - id: caller
        kind: actor
      - id: dupProcessHandle
        kind: self
      - id: p.WithHandle
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: dup
        eval: "-1"
      - bind: hErr
        eval: |-
          p.WithHandle(func(fd uintptr) {
          		r, _, errno := syscall.Syscall(syscall.SYS_FCNTL, fd, syscall.F_DUPFD_CLOEXEC, 0)
          		//: a duplicate only when fcntl succeeded.
          		if errno == 0 {
          			dup = int(r)
          		}
          	})
        to: p.WithHandle
      - opt:
          do:
            - return: nil, false
          when: hErr != nil || dup < 0
      - return: os.NewFile(uintptr(dup), "pidfd"), true
        to: os
  - of: signalThrough
    participants:
      - id: caller
        kind: actor
      - id: signalThrough
        kind: self
      - id: p.WithHandle
        kind: internal
      - id: wrapHandleUnavailable
        kind: internal
      - id: wrapSignal
        kind: internal
    steps:
      - var:
          name: errno
          type: syscall.Errno
      - bind: hErr
        eval: |-
          p.WithHandle(func(fd uintptr) {
          		//: the one signal this call makes.
          		errno = pidfdSendSignal(fd, syscall.Signal(sig.Int()))
          	})
        to: p.WithHandle
      - switch:
          cases:
            - case: errors.Is(hErr, os.ErrNoHandle)
              do:
                - return: wrapHandleUnavailable(hErr, errs.Int("pid", pid))
                  to: wrapHandleUnavailable
            - case: errors.Is(hErr, os.ErrProcessDone)
              do:
                - return: wrapSignal(syscall.ESRCH, errs.Int("pid", pid), errs.Int("signal", sig.Int()))
                  to: wrapSignal
            - case: hErr != nil
              do:
                - return: wrapSignal(hErr, errs.Int("pid", pid), errs.Int("signal", sig.Int()))
                  to: wrapSignal
            - case: errno != 0
              do:
                - return: wrapSignal(errno, errs.Int("pid", pid), errs.Int("signal", sig.Int()))
                  to: wrapSignal
            - default: true
              do:
                - return: nil
  - of: pidfdSendSignal
    participants:
      - id: caller
        kind: actor
      - id: pidfdSendSignal
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.Syscall6(sysPidfdSendSignal, fd, uintptr(sig), 0, 0, 0, 0)
        to: syscall
      - return: errno
  - of: pidfdExited
    participants:
      - id: caller
        kind: actor
      - id: pidfdExited
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: pfd
        eval: "pollFd{fd: int32(fd), events: pollInEvent}"
      - var:
          name: ts
          type: syscall.Timespec
      - opt:
          do:
            - set: ts
              to: syscall
              value: syscall.NsecToTimespec(pollSlice)
          when: wait
      - bind: n, _, errno
        eval: syscall.Syscall6(syscall.SYS_PPOLL, uintptr(unsafe.Pointer(&pfd)), 1, uintptr(unsafe.Pointer(&ts)), 0, 0, 0)
        to: syscall
      - opt:
          do:
            - return: false, errno
          when: errno != 0 && errno != syscall.EINTR
      - return: n == 1 && pfd.revents&pollInEvent != 0, nil
  - of: newHandle
    steps:
      - return: |-
          &handle{
          		proc: p, claim: claim, pid: p.Pid, pgid: p.Pid, setpgid: setpgid, stdio: stdio,
          		done: make(chan struct{}), settled: make(chan struct{}), clk: clock.System, kill: syscall.Kill,
          	}
  - of: (*handle).groupTarget
    steps:
      - opt:
          do:
            - return: "-h.pgid"
          when: h.setpgid
      - return: h.pid
  - of: (*handle).PID
    steps:
      - return: h.pid
  - of: (*handle).Wait
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Wait
        kind: self
      - id: h.waitOnce.Do
        kind: value
    steps:
      - eval: |-
          h.waitOnce.Do(func() {
          		//: WaitContext observes the whole outcome, never half of it.
          		defer close(h.settled)
          		ev, swept, wErr := collectExit(h.proc, h.claim)
          		//: a swept status leaves proc unwaited: free its handle now.
          		if swept {
          			h.releaseProc()
          		}
          		//: signal late Stop goroutines that the process has been reaped.
          		close(h.done)
          		//: join the capture copiers so every byte the child wrote has reached the
          		//: caller's writers before Wait returns, and no copier goroutine leaks.
          		//: the child's exit closed its write ends — but a process it left behind
          		//: may hold them still, so the join is bounded by the drain grace.
          		cut, held, delivered := h.stdio.drainBounded()
          		//: a status nobody could observe (not a non-zero exit) is a typed WAIT_FAILED.
          		if wErr != nil {
          			//: wrap the cause under the central WAIT_FAILED fields.
          			h.waitErr = wrapWait(wErr, errs.Int("pid", h.pid))
          			//: leave waitVal at its zero value on a reap fault.
          			return
          		}
          		//: a collected status yields the translated exit outcome.
          		h.waitVal = ev
          		//: the grace closed on pipes still held: the exit stands, the drain did not.
          		if cut {
          			h.waitErr = wrapStdioDrainTimeout(errs.Int("pid", h.pid),
          				errs.String("held", strings.Join(held, ",")), errs.Int("bytes", int(delivered)))
          			//: the capture error, if any, is secondary to the cut.
          			return
          		}
          		//: a clean exit whose capture writer failed surfaces the typed capture
          		//: error (os/exec semantics) — the exit status still stands in waitVal.
          		if cErr := h.stdio.copyError(); cErr != nil {
          			//: wrap the writer failure under the central STDIO_CAPTURE_FAILED fields.
          			h.waitErr = wrapStdioCapture(cErr, errs.Int("pid", h.pid))
          		}
          	})
        to: h.waitOnce.Do
      - return: h.waitVal, h.waitErr
  - of: collectExit
    participants:
      - id: caller
        kind: actor
      - id: collectExit
        kind: self
      - id: claim.Collected
        kind: value
      - id: exitValue
        kind: internal
      - id: proc.Wait
        kind: internal
      - id: claim.Release
        kind: value
      - id: exitValueFrom
        kind: internal
      - id: claim.Reclaim
        kind: value
    steps:
      - opt:
          do:
            - return: exitValue(status.WaitStatus, &status.Rusage), true, nil
              to: exitValue
          init:
            bind: status, ok
            eval: claim.Collected()
            to: claim.Collected
          when: ok
      - bind: state, wErr
        eval: proc.Wait()
        to: proc.Wait
      - opt:
          do:
            - eval: claim.Release()
              to: claim.Release
            - return: exitValueFrom(state), false, nil
              to: exitValueFrom
          when: wErr == nil
      - opt:
          do:
            - opt:
                do:
                  - return: exitValue(status.WaitStatus, &status.Rusage), true, nil
                    to: exitValue
                init:
                  bind: status, ok
                  eval: claim.Reclaim()
                  to: claim.Reclaim
                when: ok
          when: errors.Is(wErr, syscall.ECHILD)
      - eval: claim.Release()
        to: claim.Release
      - return: coreproc.ExitValue{}, false, wErr
  - of: (*handle).releaseProc
    participants:
      - id: caller
        kind: actor
      - id: (*handle).releaseProc
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - lock:
          mutex: h.procMu
      - eval: swallowErr(h.proc.Release())
        to: swallowErr
  - of: (*handle).leaderReaped
    participants:
      - id: caller
        kind: actor
      - id: (*handle).leaderReaped
        kind: self
      - id: h.claim.Collected
        kind: value
    steps:
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: "true"
            - default: true
      - bind: _, collected
        eval: h.claim.Collected()
        to: h.claim.Collected
      - return: collected
  - of: (*handle).WaitContext
    participants:
      - id: caller
        kind: actor
      - id: (*handle).WaitContext
        kind: self
      - id: ctx.Err
        kind: value
      - id: h.reapInBackground
        kind: internal
    steps:
      - select:
          cases:
            - comm: <-h.settled
              do:
                - return: h.waitVal, h.waitErr
            - default: true
      - opt:
          do:
            - return: coreproc.ExitValue{}, ctxErr
          init:
            bind: ctxErr
            eval: ctx.Err()
            to: ctx.Err
          when: ctxErr != nil
      - go: h.reapInBackground()
        to: h.reapInBackground
      - select:
          cases:
            - comm: <-h.settled
              do:
                - return: h.waitVal, h.waitErr
            - comm: <-ctx.Done()
              do:
                - return: coreproc.ExitValue{}, ctx.Err()
  - of: (*handle).Signal
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Signal
        kind: self
      - id: wrapSignal
        kind: internal
      - id: h.proc.Signal
        kind: value
    steps:
      - lock:
          mutex: h.procMu
          read: true
      - opt:
          do:
            - return: wrapSignal(os.ErrProcessDone, errs.Int("pid", h.pid), errs.Int("signal", sig.Int()))
              to: wrapSignal
          when: h.leaderReaped()
      - opt:
          do:
            - return: wrapSignal(err, errs.Int("pid", h.pid), errs.Int("signal", sig.Int()))
              to: wrapSignal
          init:
            bind: err
            eval: h.proc.Signal(sig.OS())
            to: h.proc.Signal
          when: err != nil
      - return: nil
  - of: (*handle).SignalGroup
    participants:
      - id: caller
        kind: actor
      - id: (*handle).SignalGroup
        kind: self
      - id: h.groupTarget
        kind: internal
      - id: wrapSignal
        kind: internal
    steps:
      - bind: target
        eval: h.groupTarget()
        to: h.groupTarget
      - bind: reapedBefore
        eval: zombiesRefused && h.leaderReaped()
      - opt:
          do:
            - return: wrapSignal(syscall.ESRCH, errs.Int("target", target), errs.Int("signal", sig.Int()))
              to: wrapSignal
          when: "!h.setpgid && h.leaderReaped()"
      - opt:
          do:
            - bind: failed
              eval: wrapSignal(err, errs.Int("target", target), errs.Int("signal", sig.Int()))
              to: wrapSignal
            - opt:
                do:
                  - return: wrapSignal(syscall.ESRCH, errs.Int("target", target), errs.Int("signal", sig.Int()))
                    to: wrapSignal
                when: h.zombieGroupRefused(failed, reapedBefore)
            - return: failed
          init:
            bind: err
            eval: h.kill(target, syscall.Signal(sig.Int()))
          when: err != nil
      - return: nil
  - of: (*handle).Stop
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Stop
        kind: self
      - id: h.signalGroupAllowGone
        kind: internal
      - id: h.awaitExit
        kind: internal
      - id: h.killUntilReaped
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: h.signalGroupAllowGone(sig)
            to: h.signalGroupAllowGone
          when: err != nil
      - opt:
          do:
            - bind: settled, gracefulErr
              eval: h.awaitExit(ctx, grace)
              to: h.awaitExit
            - opt:
                do:
                  - return: gracefulErr
                when: settled
          when: grace > 0
      - return: h.killUntilReaped(ctx)
        to: h.killUntilReaped
  - of: (*handle).killUntilReaped
    participants:
      - id: caller
        kind: actor
      - id: (*handle).killUntilReaped
        kind: self
      - id: h.reapInBackground
        kind: internal
      - id: h.signalGroupAllowGone
        kind: internal
      - id: wrapStop
        kind: internal
      - id: h.awaitKill
        kind: internal
    steps:
      - go: h.reapInBackground()
        to: h.reapInBackground
      - loop:
          do:
            - opt:
                do:
                  - return: wrapStop(err, errs.Int("pgid", h.pgid))
                    to: wrapStop
                init:
                  bind: err
                  eval: h.signalGroupAllowGone(coreproc.Signal(syscall.SIGKILL))
                  to: h.signalGroupAllowGone
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: over, err
                  eval: h.awaitKill(ctx)
                  to: h.awaitKill
                when: over
          forever: true
  - of: (*handle).awaitKill
    participants:
      - id: caller
        kind: actor
      - id: (*handle).awaitKill
        kind: self
      - id: h.clk.NewTimer
        kind: value
      - id: resend.Stop
        kind: value
    steps:
      - bind: resend
        eval: h.clk.NewTimer(killResendInterval)
        to: h.clk.NewTimer
      - defer: resend.Stop()
        to: resend.Stop
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - comm: <-ctx.Done()
              do:
                - return: true, ctx.Err()
            - comm: <-resend.C()
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - default: true
              do:
                - return: false, nil
  - of: (*handle).signalGroupAllowGone
    participants:
      - id: caller
        kind: actor
      - id: (*handle).signalGroupAllowGone
        kind: self
      - id: h.SignalGroup
        kind: internal
    steps:
      - bind: err
        eval: h.SignalGroup(sig)
        to: h.SignalGroup
      - opt:
          do:
            - return: nil
          when: err != nil && processGone(err)
      - return: err
  - of: (*handle).zombieGroupRefused
    participants:
      - id: caller
        kind: actor
      - id: (*handle).zombieGroupRefused
        kind: self
      - id: h.groupDrains
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: "!zombiesRefused || !h.setpgid || !errs.HasCode(err, coreproc.CodeSignalFailed) || !errors.Is(err, syscall.EPERM)"
      - opt:
          do:
            - return: h.groupDrains()
              to: h.groupDrains
          when: reapedBefore
      - return: h.leaderReaped() || leaderIsZombie(h.pid)
  - of: (*handle).groupDrains
    participants:
      - id: caller
        kind: actor
      - id: (*handle).groupDrains
        kind: self
      - id: h.clk.Sleep
        kind: value
    steps:
      - loop:
          do:
            - bind: err
              eval: h.kill(-h.pgid, 0)
            - opt:
                do:
                  - return: "true"
                when: errors.Is(err, syscall.ESRCH)
            - opt:
                do:
                  - return: "false"
                when: "!errors.Is(err, syscall.EPERM)"
            - eval: h.clk.Sleep(drainPoll)
              to: h.clk.Sleep
          range: drainPolls
      - return: "false"
  - of: (*handle).awaitExit
    participants:
      - id: caller
        kind: actor
      - id: (*handle).awaitExit
        kind: self
      - id: h.reapInBackground
        kind: internal
      - id: h.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - go: h.reapInBackground()
        to: h.reapInBackground
      - bind: timer
        eval: h.clk.NewTimer(grace)
        to: h.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - comm: <-ctx.Done()
              do:
                - return: true, ctx.Err()
            - comm: <-timer.C()
              do:
                - return: false, nil
  - of: (*handle).reapInBackground
    participants:
      - id: caller
        kind: actor
      - id: (*handle).reapInBackground
        kind: self
      - id: h.Wait
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: h.Wait()
            to: h.Wait
          when: err != nil
  - of: exitValueFrom
    participants:
      - id: caller
        kind: actor
      - id: exitValueFrom
        kind: self
      - id: exitValue
        kind: internal
      - id: readRusage
        kind: internal
      - id: childwait
        kind: package
    steps:
      - bind: ru, _
        eval: state.SysUsage().(*syscall.Rusage)
      - opt:
          do:
            - return: exitValue(ws, ru)
              to: exitValue
          init:
            bind: ws, ok
            eval: state.Sys().(syscall.WaitStatus)
          when: ok
      - bind: out
        eval: "coreproc.ExitValue{Code: signalledCode}"
      - opt:
          do:
            - eval: readRusage(ru, &out)
              to: readRusage
            - set: out.Usage
              to: childwait
              value: childwait.UsageOf(ru)
          when: ru != nil
      - return: out
  - of: exitValue
    participants:
      - id: caller
        kind: actor
      - id: exitValue
        kind: self
      - id: ws.ExitStatus
        kind: value
      - id: coreproc
        kind: package
      - id: ws.CoreDump
        kind: value
      - id: readRusage
        kind: internal
      - id: childwait
        kind: package
    steps:
      - bind: out
        eval: "coreproc.ExitValue{Code: signalledCode}"
      - opt:
          do:
            - set: out.Code
              to: ws.ExitStatus
              value: ws.ExitStatus()
          when: ws.Exited()
      - opt:
          do:
            - set: out.Signaled
              value: "true"
            - set: out.Signal
              to: coreproc
              value: coreproc.Signal(ws.Signal())
            - set: out.CoreDumped
              to: ws.CoreDump
              value: ws.CoreDump()
          when: ws.Signaled()
      - opt:
          do:
            - eval: readRusage(ru, &out)
              to: readRusage
            - set: out.Usage
              to: childwait
              value: childwait.UsageOf(ru)
          when: ru != nil
      - return: out
  - of: readRusage
    participants:
      - id: caller
        kind: actor
      - id: readRusage
        kind: self
      - id: timevalToDuration
        kind: internal
      - id: childwait
        kind: package
    steps:
      - set: out.UserTime
        to: timevalToDuration
        value: timevalToDuration(ru.Utime)
      - set: out.SystemTime
        to: timevalToDuration
        value: timevalToDuration(ru.Stime)
      - set: out.MaxRSS
        to: childwait
        value: childwait.MaxRSSKB(ru)
  - of: timevalToDuration
    steps:
      - return: time.Duration(tv.Sec)*time.Second + time.Duration(tv.Usec)*time.Microsecond
  - of: processGone
    steps:
      - return: errs.HasCode(err, coreproc.CodeSignalFailed) && containsESRCH(err)
  - of: newHandshake
    participants:
      - id: caller
        kind: actor
      - id: newHandshake
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: r, w, pErr
        eval: os.Pipe()
        to: os
      - opt:
          do:
            - return: nil, pErr
          when: pErr != nil
      - return: "&handshake{read: r, write: w}, nil"
  - of: (*handshake).childFile
    steps:
      - return: h.write
  - of: (*handshake).await
    participants:
      - id: caller
        kind: actor
      - id: (*handshake).await
        kind: self
      - id: swallowErr
        kind: internal
      - id: io
        kind: stdlib
      - id: sandboxFailure
        kind: internal
      - id: handshakeError
        kind: internal
    steps:
      - eval: swallowErr(h.write.Close())
        to: swallowErr
      - bind: status, rErr
        eval: io.ReadAll(h.read)
        to: io
      - eval: swallowErr(rErr)
        to: swallowErr
      - eval: swallowErr(h.read.Close())
        to: swallowErr
      - opt:
          do:
            - return: nil
          when: len(status) == 0
      - opt:
          do:
            - return: sandboxFailure(status[1:])
              to: sandboxFailure
          when: status[0] == handshakeSandboxFail
      - return: handshakeError(status[0])
        to: handshakeError
  - of: (*handshake).closeBoth
    participants:
      - id: caller
        kind: actor
      - id: (*handshake).closeBoth
        kind: self
