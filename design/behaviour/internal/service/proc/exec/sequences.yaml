    participants:
      - id: caller
        kind: actor
      - id: (*handle).groupDrains
        kind: self
      - id: h.clk.Sleep
        kind: value
    steps:
      - loop:
          do:
            - bind: err
              eval: h.kill(-h.pgid, 0)
            - opt:
                do:
                  - return: "true"
                when: errors.Is(err, syscall.ESRCH)
            - opt:
                do:
                  - return: "false"
                when: "!errors.Is(err, syscall.EPERM)"
            - eval: h.clk.Sleep(drainPoll)
              to: h.clk.Sleep
          range: drainPolls
      - return: "false"
  - of: (*handle).awaitExit
    participants:
      - id: caller
        kind: actor
      - id: (*handle).awaitExit
        kind: self
      - id: h.reapInBackground
        kind: internal
      - id: h.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - go: h.reapInBackground()
        to: h.reapInBackground
      - bind: timer
        eval: h.clk.NewTimer(grace)
        to: h.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-h.done
              do:
                - return: true, nil
            - comm: <-ctx.Done()
              do:
                - return: true, ctx.Err()
            - comm: <-timer.C()
              do:
                - return: false, nil
  - of: (*handle).reapInBackground
    participants:
      - id: caller
        kind: actor
      - id: (*handle).reapInBackground
        kind: self
      - id: h.Wait
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: h.Wait()
            to: h.Wait
          when: err != nil
  - of: exitValueFrom
