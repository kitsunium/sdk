          do:
            - return: coreproc.ResultValue{}, coreproc.InvalidSpec
          when: opts.MaxOutputBytes <= 0
      - bind: stdout
        eval: "&headBuffer{limit: opts.MaxOutputBytes}"
      - bind: stderr
        eval: "&headBuffer{limit: opts.MaxOutputBytes}"
      - set: spec.Stdio, spec.Stdout, spec.Stderr
        value: coreproc.StdioCapture, stdout, stderr
      - bind: p, sErr
        eval: Start(ctx, spec)
        to: Start
      - opt:
          do:
            - return: coreproc.ResultValue{}, sErr
          when: sErr != nil
      - bind: exit, wErr
        eval: waitOrStop(ctx, p, opts.Grace)
        to: waitOrStop
      - return: |-
          coreproc.ResultValue{
          		Exit:      exit,
          		Stdout:    stdout.bytes(),
          		Stderr:    stderr.bytes(),
          		Truncated: stdout.truncated() || stderr.truncated(),
          	}, wErr
  - of: waitOrStop
    participants:
      - id: caller
        kind: actor
      - id: waitOrStop
        kind: self
      - id: p.Wait
        kind: value
      - id: cw.WaitContext
        kind: value
      - id: ctx.Err
        kind: value
      - id: p.Stop
        kind: value
