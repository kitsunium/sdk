          do:
            - return: p.Wait()
              to: p.Wait
          when: "!bounded"
      - set: exit, err
        to: cw.WaitContext
        value: cw.WaitContext(ctx)
      - bind: ctxErr
        eval: ctx.Err()
        to: ctx.Err
      - opt:
          do:
            - return: exit, err
          when: ctxErr == nil || !errors.Is(err, ctxErr)
