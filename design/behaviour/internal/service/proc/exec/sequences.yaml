    steps:
      - opt:
          do:
            - return: nil, ctxErr
          init:
            bind: ctxErr
            eval: ctx.Err()
            to: ctx.Err
          when: ctxErr != nil
      - opt:
          do:
            - return: nil, coreproc.InvalidSpec
          when: pid < 1
      - return: reclaimChild(pid)
        to: reclaimChild
  - of: reclaimChild
    participants:
      - id: caller
        kind: actor
      - id: reclaimChild
        kind: self
      - id: os
        kind: stdlib
      - id: childwait
        kind: package
      - id: claim.Release
