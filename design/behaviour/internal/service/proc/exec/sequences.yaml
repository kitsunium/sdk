            eval: s.wireInput(in)
            to: s.wireInput
          when: ierr != nil
      - opt:
          do:
            - return: oerr
          init:
            bind: oerr
            eval: s.wireOutput(fdStdout, out)
            to: s.wireOutput
          when: oerr != nil
