      - id: caller
        kind: actor
      - id: collectExit
        kind: self
      - id: claim.Collected
        kind: value
      - id: exitValue
        kind: internal
      - id: proc.Wait
        kind: internal
      - id: claim.Release
        kind: value
      - id: exitValueFrom
        kind: internal
      - id: claim.Reclaim
        kind: value
