        kind: self
      - id: os
        kind: stdlib
      - id: wrapCgroupUnavailable
        kind: internal
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: path == ""
      - bind: info, err
        eval: os.Stat(path)
        to: os
      - opt:
          do:
            - return: wrapCgroupUnavailable(err, errs.String("cgroup_path", path))
              to: wrapCgroupUnavailable
          when: err != nil || !info.IsDir()
      - var:
          name: st
          type: syscall.Statfs_t
      - opt:
          do:
            - return: wrapCgroupUnavailable(serr, errs.String("cgroup_path", path))
              to: wrapCgroupUnavailable
          init:
            bind: serr
            eval: syscall.Statfs(path, &st)
            to: syscall
          when: serr != nil
