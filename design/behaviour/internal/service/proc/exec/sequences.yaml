        to: syscall
        value: syscall.Signal(sig.Int())
  - of: EnvAllow
    participants:
      - id: caller
        kind: actor
      - id: EnvAllow
        kind: self
      - id: envFilter
        kind: internal
    steps:
      - return: envFilter(parent, keys, true)
        to: envFilter
  - of: EnvDeny
    participants:
      - id: caller
        kind: actor
      - id: EnvDeny
        kind: self
      - id: envFilter
        kind: internal
    steps:
      - return: envFilter(parent, keys, false)
        to: envFilter
  - of: envFilter
    participants:
      - id: caller
        kind: actor
      - id: envFilter
        kind: self
      - id: envKey
        kind: internal
    steps:
      - bind: out
        eval: make([]string, 0, len(parent))
      - loop:
          do:
            - bind: key
              eval: envKey(kv)
              to: envKey
            - opt:
                do:
                  - continue: true
                when: namedKey(keys, key) != keep
            - opt:
                do:
                  - continue: true
                when: repeatedLater(parent[i+1:], key)
            - set: out
              value: append(out, kv)
          key: i
          range: parent
          value: kv
      - return: out
