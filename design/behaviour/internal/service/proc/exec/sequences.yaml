            bind: err
            eval: os.WriteFile(procs, []byte(strconv.Itoa(os.Getpid())), cgroupProcsPerm)
            to: os
          when: err != nil
      - return: "\"\""
  - of: wantsIdentity
    steps:
      - return: spec.User != "" || spec.Group != "" || len(spec.Groups) > 0
  - of: resolveCredential
    participants:
      - id: caller
        kind: actor
      - id: resolveCredential
        kind: self
      - id: applyUserGroup
        kind: internal
      - id: resolveGroups
        kind: internal
    steps:
      - opt:
