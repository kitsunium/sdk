  - of: (*handle).Size
    participants:
      - id: caller
        kind: actor
      - id: (*handle).Size
        kind: self
      - id: ioctlFile
        kind: internal
    steps:
      - opt:
          do:
            - return: coreproc.PTYValue{}, wrapPTYFailed(nil, errs.Int("pid", h.pid), errs.String("why", "not started with StdioPTY"))
          when: h.stdio.ptyMaster == nil
      - var:
          name: ws
          type: winsize
      - opt:
          do:
            - return: coreproc.PTYValue{}, wrapPTYFailed(err, errs.Int("pid", h.pid))
