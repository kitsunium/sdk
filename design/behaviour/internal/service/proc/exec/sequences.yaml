        eval: syscall.Getpgid(pid)
        to: syscall
      - return: newHandle(proc, claim, gerr == nil && pgid == pid, &stdioState{}), nil
        to: newHandle
  - of: childOf
    participants:
      - id: caller
        kind: actor
      - id: childOf
        kind: self
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw, err
        eval: os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")
        to: os
      - opt:
          do:
            - return: "false"
          when: err != nil
      - bind: end
        eval: strings.LastIndexByte(string(raw), ')')
        to: strings
      - opt:
          do:
            - return: "false"
          when: end < 0
      - bind: fields
        eval: strings.Fields(string(raw[end+1:]))
        to: strings
      - opt:
          do:
            - return: "false"
          when: len(fields) < 2
      - bind: ppid, err
        eval: strconv.Atoi(fields[1])
        to: strconv
      - return: err == nil && ppid == parent
