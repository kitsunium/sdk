# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      unknownExitCode is the Code of the ExitValue an attached process's Wait
      returns: no status is known, and a zero would read as success.
    items:
      - name: unknownExitCode
        type: int
        value: "-1"
    name: unknownExitCode
  - doc: |-
      pidfdNonblock is PIDFD_NONBLOCK (Linux 5.10), O_NONBLOCK's value: the pidfd
      is opened non-blocking, ready for the runtime's poller.
    items:
      - name: pidfdNonblock
        type: uintptr
        value: syscall.O_NONBLOCK
    name: pidfdNonblock
  - doc: |-
      prioProcess is the PRIO_PROCESS "which" selector for setpriority(2); it is not
      exported by package syscall on every Unix, so it is named here as the portable
      POSIX constant value 0.
    items:
      - name: prioProcess
        type: int
        value: "0"
    name: prioProcess
  - doc: |-
      cloneIntoCgroupMajor and cloneIntoCgroupMinor are the first Linux release
      with clone3's CLONE_INTO_CGROUP (5.7), which SysProcAttr.UseCgroupFD uses.
    grouped: true
    items:
      - name: cloneIntoCgroupMajor
        type: int
        value: "5"
      - name: cloneIntoCgroupMinor
        type: int
        value: "7"
    name: cloneIntoCgroupMajor
  - doc: |-
      cgroupProcsFile is the cgroup v2 control file that attaches a process to the
      group when its pid is written (one pid per write).
    items:
      - name: cgroupProcsFile
        type: string
        value: "\"cgroup.procs\""
    name: cgroupProcsFile
  - doc: |-
      cgroup2SuperMagic is the statfs f_type of the unified cgroup v2 filesystem
      (CGROUP2_SUPER_MAGIC, the ASCII "cgrp"). Typed uint64 and compared against
      uint64(st.Type) so the arch-dependent Statfs_t.Type field (int64 on amd64/arm64,
      int32 on 386/arm) widens cleanly — the conversion is real on every GOARCH (the
      source is signed, the target unsigned), so it is never a redundant cast.
    items:
      - name: cgroup2SuperMagic
        type: uint64
        value: "0x63677270"
    name: cgroup2SuperMagic
  - doc: |-
      cgroupProcsPerm is the perm passed to os.WriteFile; cgroup.procs always exists
      so the mode is never used to create it — it mirrors the cgroup package's
      controllerPerm for consistency.
    items:
      - name: cgroupProcsPerm
        type: os.FileMode
        value: "0o755"
    name: cgroupProcsPerm
  - doc: |-
      sysCloseRange is __NR_close_range, 436 on every Linux architecture of the
      unified syscall table (include/uapi/asm-generic/unistd.h and the x86 and
      arm tables alike). The mips ABIs number it apart and walk instead.
    items:
      - name: sysCloseRange
        type: uintptr
        value: "436"
    name: sysCloseRange
  - doc: |-
      idBase / idBits are the strconv.ParseUint base and bit-size for parsing the
      32-bit decimal uid/gid strings os/user returns.
    grouped: true
    items:
      - name: idBase
        type: int
        value: "10"
      - name: idBits
        type: int
        value: "32"
    name: idBase
  - doc: |-
      reservedEnvPrefix begins the name of every variable of the SDK's own spawn
      protocol — the trampoline's payload, its cgroup placement, its handshake
      descriptor (reservedEnvKeys lists them). A child reads the FIRST of two equal
      keys and the caller's Spec.Env comes first, so a caller naming one would
      override what the spawn tells its child: Start refuses it (#726).
    items:
      - name: reservedEnvPrefix
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_\""
    name: reservedEnvPrefix
  - doc: |-
      fdDir lists the process's open descriptors: procfs's per-process fd
      directory, complete on Linux, illumos and Solaris.
    items:
      - name: fdDir
        type: string
        value: "\"/proc/self/fd\""
    name: fdDir
  - doc: |-
      sysPidfdSendSignal is __NR_pidfd_send_signal, 424 on every Linux
      architecture of the unified syscall table (Linux 5.1); the stdlib exports no
      number for it on amd64 or arm64, so it is cited here (ADR 0018).
    items:
      - name: sysPidfdSendSignal
        type: uintptr
        value: "424"
    name: sysPidfdSendSignal
  - doc: pollInEvent is POLLIN, the event a pidfd reports once its process has exited.
    items:
      - name: pollInEvent
        type: int16
        value: "0x1"
    name: pollInEvent
  - doc: |-
      pollSlice bounds one ppoll on a pidfd, so a wait for an exit checks its
      context and its timer between slices.
    items:
      - name: pollSlice
        type: int64
        value: int64(50 * 1000 * 1000)
    name: pollSlice
  - doc: |-
      signalledCode is the ExitValue.Code reported for a signalled (non-normal)
      termination; the port reserves -1 for "died by signal, no status".
    items:
      - name: signalledCode
        type: int
        value: "-1"
    name: signalledCode
  - doc: |-
      killResendInterval is how long a SIGKILL escalation waits for the reap
      before it sends SIGKILL again. NetBSD up to 10.1 discards a signal posted to
      a process still inside execve (PR kern/58091, fixed in 10.2 and 11.0), and
      Start returns from inside the child's execve, so the first SIGKILL sent to a
      child just started can be lost; a single SIGKILL followed by an unbounded
      wait then never ends. A SIGKILL that landed kills at once, so on every other
      kernel the reap comes first and nothing is ever resent.
    items:
      - name: killResendInterval
        type: time.Duration
        value: 100 * time.Millisecond
    name: killResendInterval
  - doc: |-
      drainPoll and drainPolls bound how long SignalGroup watches a group that
      darwin refused with EPERM after its leader was reaped (groupDrains): a
      group of zombies empties as soon as init reaps them, which launchd does
      within milliseconds, while a live member this process may not signal stays.
    grouped: true
    items:
      - name: drainPoll
        type: time.Duration
        value: 10 * time.Millisecond
      - name: drainPolls
        type: int
        value: "100"
    name: drainPoll
  - doc: |-
      defaultHandshakeFD is the fallback descriptor for the trampoline status pipe
      when no fd number was passed (a spawn with no ExtraFiles): the pipe follows the
      three std streams at fd 3. With ExtraFiles present the parent appends the pipe
      AFTER them (so ExtraFiles keep fd 3..) and passes the real fd via
      trampolineHsFdEnv; the trampoline reads it through childHandshakeFD.
    items:
      - name: defaultHandshakeFD
        type: int
        value: "3"
    name: defaultHandshakeFD
  - doc: Status bytes the trampoline writes to handshakeFD before it exits on failure.
    grouped: true
    items:
      - comment: a setrlimit/umask application failed.
        name: handshakeApplyFail
        type: byte
        value: "'A'"
      - comment: the execve of the real target failed.
        name: handshakeExecFail
        type: byte
        value: "'E'"
      - comment: the pre-exec cgroup.procs placement failed.
        name: handshakeCgroupFail
        type: byte
        value: "'C'"
    name: handshakeApplyFail
  - doc: pathVariable is the environment variable listing the directories searched.
    items:
      - name: pathVariable
        type: string
        value: "\"PATH\""
    name: pathVariable
  - doc: |-
      anyExecuteBit is the owner, group and other execute bits. os/exec.LookPath
      accepts a file carrying any of them; so does this search.
    items:
      - name: anyExecuteBit
        type: fs.FileMode
        value: "0o111"
    name: anyExecuteBit
  - doc: |-
      oomScoreAdjNative reports that the kernel takes an OOM-killer bias through
      /proc/<pid>/oom_score_adj.
    items:
      - name: oomScoreAdjNative
        type: bool
        value: "true"
    name: oomScoreAdjNative
  - doc: |-
      sysPidfdOpen is __NR_pidfd_open, 434 on every Linux architecture of the
      unified syscall table (Linux 5.3).
    items:
      - name: sysPidfdOpen
        type: uintptr
        value: "434"
    name: sysPidfdOpen
  - doc: |-
      maxSymlinks bounds the symbolic links one walk follows, as the kernel's
      MAXSYMLINKS does (40 on Linux, 32 on the BSDs): past it the path loops.
    items:
      - name: maxSymlinks
        type: int
        value: "40"
    name: maxSymlinks
  - doc: |-
      maxPIDFileBytes bounds what is read of a PID file: one decimal PID and its
      blanks fit many times over; more is not a PID file.
    items:
      - name: maxPIDFileBytes
        type: int
        value: "64"
    name: maxPIDFileBytes
  - doc: groupOtherWrite is the group and others' write bits of a mode.
    items:
      - name: groupOtherWrite
        type: uint32
        value: "0o022"
    name: groupOtherWrite
  - doc: |-
      oPath is O_PATH (Linux 2.6.39), 010000000 on every architecture this file
      builds for; the stdlib exports no name for it. A directory opened so is a
      position in the tree, not a read: walking needs search permission only.
    items:
      - name: oPath
        type: int
        value: "0x200000"
    name: oPath
  - doc: |-
      procFileMode is the os.WriteFile mode for procfs control files; the kernel
      ignores it for existing procfs entries, so it only satisfies the signature.
    items:
      - name: procFileMode
        type: os.FileMode
        value: "0o644"
    name: procFileMode
  - doc: |-
      ptmxPath is the multiplexer a new terminal is allocated from, and ptsDir
      the directory its slave side appears in.
    grouped: true
    items:
      - name: ptmxPath
        type: string
        value: "\"/dev/ptmx\""
      - name: ptsDir
        type: string
        value: "\"/dev/pts/\""
    name: ptmxPath
  - doc: |-
      termSignal is SIGTERM: 15 on every Unix and in Go's Windows signal table,
      named here so Run compiles on every GOOS, plan9 included.
    items:
      - name: termSignal
        type: coreproc.Signal
        value: "15"
    name: termSignal
  - doc: The kernel interfaces the parent reads before a sandboxed fork.
    grouped: true
    items:
      - doc: |-
          procSelfExe is the path the first stage re-executes: the running binary's
          own inode, whatever has since replaced its file on disk. No fallback.
        name: procSelfExe
        type: string
        value: "\"/proc/self/exe\""
      - doc: procNSDir lists this process's namespaces, one link per kind the kernel has.
        name: procNSDir
        type: string
        value: "\"/proc/self/ns\""
      - doc: procCapLastCap is the highest capability number the kernel knows.
        name: procCapLastCap
        type: string
        value: "\"/proc/sys/kernel/cap_last_cap\""
      - doc: "landlockCreateRulesetVersion is LANDLOCK_CREATE_RULESET_VERSION: the call returns the ABI."
        name: landlockCreateRulesetVersion
        type: uintptr
        value: "1"
      - doc: clonenewtime is CLONE_NEWTIME, which only clone3 and unshare take.
        name: cloneNewTime
        type: uintptr
        value: "0x80"
      - doc: "maxCapability bounds a capability mask: bit 63."
        name: maxCapability
        type: uint32
        value: "63"
      - doc: mountKindLast is the highest MountKind.
        name: mountKindLast
        type: coreproc.MountKind
        value: coreproc.MountTmpfsSticky
      - doc: namespaceAll is every Namespace bit.
        name: namespaceAll
        type: coreproc.Namespace
        value: "255"
      - doc: landlockNewestABI is the newest Landlock ABI whose rights this build names.
        name: landlockNewestABI
        type: int
        value: "6"
    name: procSelfExe
  - doc: |-
      The sandbox payload's framing: a magic, a version, a length that must be the
      sealed file's size, then the fields in one fixed order. A reader refuses any
      other version, any byte past the last field, and any count or string longer
      than its bound — so a payload is either the one the parent wrote or nothing.
    grouped: true
    items:
      - doc: sandboxMagic opens every payload.
        name: sandboxMagic
        type: string
        value: "\"KSBX\""
      - doc: |-
          sandboxVersion is the one layout this build reads and writes: 2 opens
          the body with the cgroup namespace's flag.
        name: sandboxVersion
        type: uint16
        value: "2"
      - doc: sandboxHeaderLen is the magic, the version, a reserved half-word and the length.
        name: sandboxHeaderLen
        type: int
        value: "12"
      - doc: "sandboxMaxPayload bounds the whole payload: 1 MiB."
        name: sandboxMaxPayload
        type: int
        value: 1 << 20
      - doc: "sandboxMaxString bounds one path: PATH_MAX."
        name: sandboxMaxString
        type: int
        value: "4096"
      - doc: sandboxMaxItems bounds a count of mounts, groups or rules.
        name: sandboxMaxItems
        type: int
        value: "65536"
      - doc: sandboxMaxInsns is BPF_MAXINSNS, the longest filter the kernel loads.
        name: sandboxMaxInsns
        type: int
        value: "4096"
      - doc: sandboxNoTrace is the trace descriptor of a payload that records nothing.
        name: sandboxNoTrace
        type: int32
        value: "-1"
    name: sandboxMagic
  - doc: |-
      The memfd the payload travels in (linux/memfd.h, linux/fcntl.h): created
      close-on-exec and sealable, then sealed against any change before the fork.
    grouped: true
    items:
      - name: mfdCloexec
        type: uintptr
        value: "0x1"
      - name: mfdAllowSealing
        type: uintptr
        value: "0x2"
      - name: fAddSeals
        type: uintptr
        value: "1033"
      - name: fGetSeals
        type: uintptr
        value: "1034"
      - name: fSealSeal
        type: uintptr
        value: "0x1"
      - name: fSealShrink
        type: uintptr
        value: "0x2"
      - name: fSealGrow
        type: uintptr
        value: "0x4"
      - name: fSealWrite
        type: uintptr
        value: "0x8"
      - name: sandboxSealSet
        type: uintptr
        value: fSealSeal | fSealShrink | fSealGrow | fSealWrite
      - name: sandboxMemfdName
        type: string
        value: "\"kitsunium-sandbox\""
    name: mfdCloexec
  - doc: |-
      Classic BPF, as seccomp runs it (linux/filter.h, linux/seccomp.h): the four
      instructions the filter is made of, the offsets of struct seccomp_data, and
      the return values of the three actions.
    grouped: true
    items:
      - doc: "bpfLdWAbs is BPF_LD|BPF_W|BPF_ABS: A = the 32-bit word at k."
        name: bpfLdWAbs
        type: uint16
        value: "0x20"
      - doc: "bpfJeqK is BPF_JMP|BPF_JEQ|BPF_K: jump jt if A == k, else jf."
        name: bpfJeqK
        type: uint16
        value: "0x15"
      - doc: "bpfJgeK is BPF_JMP|BPF_JGE|BPF_K: jump jt if A >= k, else jf."
        name: bpfJgeK
        type: uint16
        value: "0x35"
      - doc: "bpfRetK is BPF_RET|BPF_K: return k."
        name: bpfRetK
        type: uint16
        value: "0x06"
      - doc: seccompDataNr is the offset of seccomp_data.nr.
        name: seccompDataNr
        type: uint32
        value: "0"
      - doc: seccompDataArch is the offset of seccomp_data.arch.
        name: seccompDataArch
        type: uint32
        value: "4"
      - doc: seccompDataArg0Lo is the offset of the low word of seccomp_data.args[0], little-endian.
        name: seccompDataArg0Lo
        type: uint32
        value: "16"
      - doc: seccompDataArg0Hi is the offset of its high word.
        name: seccompDataArg0Hi
        type: uint32
        value: "20"
      - doc: seccompRetKillProcess is SECCOMP_RET_KILL_PROCESS (Linux 4.14).
        name: seccompRetKillProcess
        type: uint32
        value: "0x80000000"
      - doc: seccompRetErrno is SECCOMP_RET_ERRNO; the errno is its low 16 bits.
        name: seccompRetErrno
        type: uint32
        value: "0x00050000"
      - doc: seccompRetAllow is SECCOMP_RET_ALLOW.
        name: seccompRetAllow
        type: uint32
        value: "0x7fff0000"
      - doc: seccompErrnoMax is the largest errno a filter may return (MAX_ERRNO).
        name: seccompErrnoMax
        type: int
        value: "4095"
      - doc: seccompGetActionAvail is SECCOMP_GET_ACTION_AVAIL, the seccomp(2) operation that asks whether an action exists.
        name: seccompGetActionAvail
        type: uintptr
        value: "2"
      - doc: "reportSkip is how far the write check jumps when the call is no write: past its six instructions."
        name: reportSkip
        type: uint8
        value: "6"
      - doc: "reportFdSkip is how far it jumps when the descriptor's low word is not the handshake's: to the reload of nr."
        name: reportFdSkip
        type: uint8
        value: "3"
      - doc: syscallBase is the base the table's numbers are written in.
        name: syscallBase
        type: int
        value: "10"
      - doc: "syscallBits is their width: a seccomp_data.nr."
        name: syscallBits
        type: int
        value: "32"
    name: bpfLdWAbs
  - doc: |-
      The kernel constants the second stage passes (linux/prctl.h, linux/mount.h,
      linux/capability.h, linux/landlock.h, linux/seccomp.h, linux/fcntl.h).
    grouped: true
    items:
      - name: prSetPdeathsig
        type: uintptr
        value: "1"
      - name: prSetKeepCaps
        type: uintptr
        value: "8"
      - name: prSetSeccomp
        type: uintptr
        value: "22"
      - name: prCapbsetRead
        type: uintptr
        value: "23"
      - name: prCapbsetDrop
        type: uintptr
        value: "24"
      - name: prSetSecureBits
        type: uintptr
        value: "28"
      - name: prSetNoNewPrivs
        type: uintptr
        value: "38"
      - name: prCapAmbient
        type: uintptr
        value: "47"
      - name: prCapAmbientRaise
        type: uintptr
        value: "2"
      - name: prCapAmbientClearAll
        type: uintptr
        value: "4"
      - name: seccompModeFilter
        type: uintptr
        value: "2"
      - name: capabilityVersion3
        type: uint32
        value: "0x20080522"
      - name: msRdonly
        type: uintptr
        value: "0x1"
      - name: msNosuid
        type: uintptr
        value: "0x2"
      - name: msNodev
        type: uintptr
        value: "0x4"
      - name: msBind
        type: uintptr
        value: "0x1000"
      - name: msRec
        type: uintptr
        value: "0x4000"
      - name: mntDetach
        type: uintptr
        value: "0x2"
      - name: mountAttrRdonly
        type: uint64
        value: "0x1"
      - name: mountAttrSizeVer0
        type: uintptr
        value: "32"
      - name: atRecursive
        type: uintptr
        value: "0x8000"
      - comment: AT_FDCWD, -100
        name: atFDCWD
        type: uintptr
        value: ^uintptr(99)
      - name: landlockRulePathBeneat
        type: uintptr
        value: "1"
      - name: landlockRulesetAttrLen
        type: uintptr
        value: "8"
      - name: stageInjectedErrno
        type: syscall.Errno
        value: syscall.ECANCELED
      - name: tmpfsOptions
        type: string
        value: "\"mode=0755\""
      - name: tmpfsStickyOptions
        type: string
        value: "\"mode=1777\""
      - name: procSelfFD
        type: string
        value: "\"/proc/self/fd\""
      - name: traceRecordLen
        type: int
        value: "5"
    name: prSetPdeathsig
  - doc: |-
      trampolineSandboxEnv carries the descriptor number of the sealed memfd that
      holds a sandboxed spawn's payload (Spec.Sandbox): it sits right after the
      handshake pipe in the child's table. Stripped before the target runs.
    items:
      - name: trampolineSandboxEnv
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_SANDBOX\""
    name: trampolineSandboxEnv
  - doc: |-
      handshakeSandboxFail opens a sandbox failure report: the step's number and
      the errno's two low-order bytes follow it.
    items:
      - name: handshakeSandboxFail
        type: byte
        value: "'S'"
    name: handshakeSandboxFail
  - doc: |-
      sandboxReportLen is the length of a sandbox failure report: the tag, the
      step and the errno.
    items:
      - name: sandboxReportLen
        type: int
        value: "4"
    name: sandboxReportLen
  - doc: |-
      The steps of the sandbox's second stage, in the order the kernel imposes on
      them: a step may need a privilege a later one gives up, Landlock and seccomp
      need no_new_privs, and the seccomp filter, installed last, must not refuse
      what the stage still does before execve. Step 0 is the reading of the
      payload; the cgroup namespace comes first of all, the child already in its
      group whichever placed it — the clone or the trampoline's write —, so the
      namespace is rooted at that group. The numbers travel in a failure report
      and in the tests' trace.
    grouped: true
    items:
      - name: stepPayload
        type: uint8
        value: iota
      - name: stepCgroupNamespace
      - name: stepMounts
      - name: stepRoot
      - name: stepLandlockPaths
      - name: stepBounding
      - name: stepSecureBits
      - name: stepIdentity
      - name: stepCapabilities
      - name: stepFDSweep
      - name: stepNoNewPrivs
      - name: stepLandlock
      - name: stepSeccomp
    name: stepPayload
  - doc: |-
      maxIOPriority is the lowest I/O level within a class: the kernel's eight
      levels run from 0 (highest) to 7.
    items:
      - name: maxIOPriority
        type: int
        value: "7"
    name: maxIOPriority
  - doc: |-
      ioprioWhoProcessSel is IOPRIO_WHO_PROCESS and ioprioClassShift the class's
      place in an ioprio value, both from include/uapi/linux/ioprio.h.
    grouped: true
    items:
      - name: ioprioWhoProcessSel
        type: uintptr
        value: "1"
      - name: ioprioClassShift
        type: int
        value: "13"
    name: ioprioWhoProcessSel
  - doc: |-
      closeRangeCloexec is CLOSE_RANGE_CLOEXEC, the close_range(2) flag that marks
      the range close-on-exec instead of closing it: 1<<2 in Linux's
      include/uapi/linux/close_range.h and FreeBSD's sys/unistd.h alike.
    items:
      - name: closeRangeCloexec
        type: uintptr
        value: 1 << 2
    name: closeRangeCloexec
  - doc: |-
      closeRangeLast is the ~0U close_range(2) reads as "up to the highest
      descriptor": the call takes unsigned ints.
    items:
      - name: closeRangeLast
        type: uintptr
        value: uintptr(^uint32(0))
    name: closeRangeLast
  - doc: |-
      firstSealedFD is the lowest descriptor the seal marks: 0, 1 and 2 are the
      child's stdio, which forkExec installs with dup2 whatever their flags.
    items:
      - name: firstSealedFD
        type: int
        value: "3"
    name: firstSealedFD
  - doc: |-
      defaultDrainGrace is how long Wait waits for the capture copiers after the
      exit when Spec.DrainGrace is zero: a bounded default (ADR 0031), of the same
      order as Stop's SIGKILL resend, long enough for a child's last write to
      cross the pipe and short enough that a daemonised grandchild does not hold
      Wait for its lifetime.
    items:
      - name: defaultDrainGrace
        type: time.Duration
        value: time.Second
    name: defaultDrainGrace
  - doc: |-
      Standard-stream fd indices and their count, named so the wiring carries no
      bare magic numbers. The values are the kernel's fixed fd numbers (0/1/2), so
      iota lines up with them and stdioFdCount is the natural fourth value.
    grouped: true
    items:
      - name: fdStdin
        type: int
        value: iota
      - name: fdStdout
      - name: fdStderr
      - name: stdioFdCount
    name: fdStdin
  - doc: |-
      The x86-64 numbers of the system calls the sandbox makes that the standard
      library does not export, from arch/x86/entry/syscalls/syscall_64.tbl, and
      the audit architecture its seccomp filter accepts (linux/audit.h). Each is
      pinned by Test_sandboxSyscallTable on this architecture.
    grouped: true
    items:
      - doc: "sandboxAuditArch is AUDIT_ARCH_X86_64: EM_X86_64 | __AUDIT_ARCH_64BIT | __AUDIT_ARCH_LE."
        name: sandboxAuditArch
        type: uint32
        value: "0xC000003E"
      - doc: "sandboxX32Bit is __X32_SYSCALL_BIT: a call numbered at or past it is the x32 ABI's."
        name: sandboxX32Bit
        type: uint32
        value: "0x40000000"
      - doc: sysSeccomp is __NR_seccomp.
        name: sysSeccomp
