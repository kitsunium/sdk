functions:
  - name: Attach
    params: ctx context.Context, pid int
    results: proc coreproc.Process, err error
  - name: AttachPIDFile
    params: ctx context.Context, path string, want coreproc.AttachValue
    results: proc coreproc.Process, err error
  - doc: |-
      refuseSelfOrInit refuses PID 1 and this process: adopting either would let
      a Stop kill the init system or the supervisor itself.
    name: refuseSelfOrInit
    params: pid int
    results: error
  - doc: bounded reports whether want constrains the process at all.
    name: bounded
    params: want coreproc.AttachValue
    results: bool
  - doc: |-
      attachPIDFile reads the PID file, refuses what it may not adopt, and
      adopts the rest.
    name: attachPIDFile
    params: path string, want coreproc.AttachValue
    results: coreproc.Process, error
  - doc: |-
      checkUsers checks the users bound of want against the real and effective
      uid read of the process pid; readErr is the read's fault, which refuses.
    name: checkUsers
    params: pid int, want coreproc.AttachValue, ruid, euid int, readErr error
    results: error
  - doc: |-
      attachProcess opens a pollable pidfd on pid, checks want against the
      process it holds, and proves the check concerned that process: it was still
      running once the check was over, so its pid was not yet another's.
    name: attachProcess
    params: pid int, want coreproc.AttachValue
    results: coreproc.Process, error
  - doc: rawPidfdOpen is pidfd_open(2) itself (434, ADR 0018).
    name: rawPidfdOpen
    params: pid int, flags uintptr
    results: int, syscall.Errno
  - doc: |-
      openPollablePidfd opens a non-blocking pidfd on pid: PIDFD_NONBLOCK where
      the kernel has it (5.10), else — EINVAL for the unknown flag — a plain
      pidfd made non-blocking with fcntl, which the poller accepts the same way.
    name: openPollablePidfd
    params: pid int, open pidfdOpener
    results: int, error
  - doc: |-
      classifyPidfdOpen maps pidfd_open's refusal: ESRCH is a process gone
      (SIGNAL_FAILED, as Open says), anything else no handle (HANDLE_UNAVAILABLE).
    name: classifyPidfdOpen
    params: err error, pid int
    results: error
  - doc: |-
      newAdopted wraps a non-blocking pidfd: os.NewFile registers it with the
      runtime's poller, so a read on it parks the goroutine, not a thread.
    name: newAdopted
    params: fd, pid int
    results: "*adopted, error"
  - doc: |-
      awaitEnd parks on the pidfd raw lends in the runtime's poller until it
      turns readable — the process has ended. A pidfd the poller refused is
      watched one ppoll slice at a time instead.
    name: awaitEnd
    params: raw syscall.RawConn
  - doc: |-
      checkScope checks want against the process pid, from /proc: its cgroup v2
      path at or below want.Cgroup, its real and effective uid among want.UIDs.
    name: checkScope
    params: pid int, want coreproc.AttachValue
    results: error
  - doc: withinCgroup reports whether the cgroup path cg is want or below it.
    name: withinCgroup
    params: cg, want string
    results: bool
  - doc: |-
      procCgroup reads the process's cgroup v2 path: the "0::" line of
      /proc/<pid>/cgroup.
    name: procCgroup
    params: pid int
    results: string, error
  - doc: |-
      procUIDs reads the process's real and effective uid: the first two fields
      of the Uid: line of /proc/<pid>/status.
    name: procUIDs
    params: pid int
    results: ruid, euid int, err error
  - doc: |-
      procLine returns what follows prefix on the first line of the file at path
      that starts with it.
    name: procLine
    params: path, prefix string
    results: string, error
  - doc: |-
      applyNice sets the child's scheduling priority via setpriority(2). A nil Nice
      leaves the inherited value untouched; a refusal (e.g. lowering niceness
      without privilege) surfaces as RLIMIT_FAILED rather than a silent no-op.
    name: applyNice
    params: pid int, nice *int
    results: error
  - doc: |-
      applyOOMScoreAdj writes the child's /proc/<pid>/oom_score_adj. It is
      Linux-only behaviour; on a Unix kernel without procfs the write fails and is
      reported, never silently ignored. A nil pointer leaves the default untouched.
    name: applyOOMScoreAdj
    params: pid int, adj *int
    results: error
  - doc: |-
      containsESRCH reports whether err's chain carries the syscall.ESRCH errno,
      the "no such process" signal that a group already exited.
    name: containsESRCH
    params: err error
    results: bool
  - doc: kernelClonesIntoCgroup reads the running kernel's release from uname(2).
    name: kernelClonesIntoCgroup
    results: bool
  - doc: |-
      releaseClonesIntoCgroup reports whether a uname release names Linux 5.7 or
      later. A release it cannot read is not trusted with the placement.
    name: releaseClonesIntoCgroup
    params: release string
    results: bool
  - doc: |-
      cgroupByClone reports whether a placement in cgroupPath is made by the clone
      itself (clone3 with CLONE_INTO_CGROUP) rather than by the trampoline.
    name: cgroupByClone
    params: cgroupPath string
    results: bool
  - doc: |-
      attachCgroupFD opens spec's validated cgroup directory and asks the fork to
      clone the child into it (#929): the child is a member from its first
      instruction, with no re-exec and no handshake. The returned release closes
      the directory once the fork returned.
    name: attachCgroupFD
    params: spec coreproc.Spec, attr *syscall.SysProcAttr
    results: release func(), err error
  - doc: |-
      cloneSpawnError reads the failure of a fork that cloned into a group:
      ENOSYS — clone3 filtered — is retried once through the trampoline (retry,
      and the refusal is remembered in refused); a refusal by the group itself (EACCES or
      EPERM when it is not delegated, EBUSY for a domain group with controllers,
      EOPNOTSUPP for a threaded one) is CGROUP_WRITE_FAILED, as the trampoline's
      refused cgroup.procs write was; anything else is SPAWN_FAILED.
    name: cloneSpawnError
    params: cause error, cgroupPath, path string, refused *atomic.Bool
    results: retry bool, err error
  - doc: |-
      cgroupByTrampoline reports whether a placement in cgroupPath needs the
      trampoline's pre-exec cgroup.procs write: a placement the clone cannot make.
    name: cgroupByTrampoline
    params: cgroupPath string
    results: bool
  - doc: |-
      validateCgroupPath checks, before any spawn, that a non-empty Spec.CgroupPath
      names an existing directory that ACTUALLY lives on the cgroup v2 filesystem.
      An empty path is a no-op (nil). A missing path, a non-directory, or a directory
      not on a cgroup2 mount surfaces CgroupUnavailable. The statfs magic check is
      load-bearing: a plain directory (even one containing a file literally named
      cgroup.procs) must NOT pass, or the trampoline's pid-write would silently no-op
      and the child would run UNCONFINED while Start reported success. The writability
      ("delegated") check is deferred to the trampoline write, which surfaces
      CgroupWriteFailed — a stat cannot reliably predict a cgroupfs write refusal.
    name: validateCgroupPath
    params: path string
    results: error
  - doc: |-
      applyCgroupPlacement writes the calling (trampoline) process's pid into
      <path>/cgroup.procs, moving it — and thus the target it is about to exec — into
      the cgroup before execve. Returns "" on success or a diagnostic message the
      trampoline reports to the parent as a CgroupWriteFailed handshake. An empty
      path is a no-op (the trampoline only calls this when a path was encoded).
    name: applyCgroupPlacement
    params: path string
    results: string
  - doc: wantsIdentity reports whether spec requests any credential change at all.
    name: wantsIdentity
    params: spec coreproc.Spec
    results: bool
  - doc: |-
      resolveCredential builds the syscall.Credential implied by spec, or returns a
      nil cred when no user, group, or supplementary groups are requested (leaving
      the child at the parent's identity). It resolves names and numeric ids alike.
    name: resolveCredential
    params: spec coreproc.Spec
    results: cred *syscall.Credential, err error
  - doc: |-
      applyUserGroup resolves spec.User and spec.Group into out's Uid/Gid, with an
      explicit Group overriding the login gid derived from the user.

      A syscall.Credential has no "unset" uid or gid: whatever the struct carries
      is what the child is switched to. So the parent's own ids are written first —
      the Spec's "empty leaves the parent's" — and only what the Spec names
      replaces them. Before, a Spec naming only a Group (or only Groups) left
      Uid at its zero value and asked the kernel for uid 0: refused for an
      unprivileged supervisor, and an escalation's shape for any other.
    name: applyUserGroup
    params: spec coreproc.Spec, out *syscall.Credential
    results: error
  - doc: |-
      resolveUser maps a user name or numeric uid to its uid and primary gid,
      surfacing UnknownUser when neither lookup succeeds.

      A numeric uid with no passwd entry has no primary gid to take, so it is
      honoured only when groupGiven — the Spec names the Group that replaces it —
      and refused otherwise. It used to resolve with gid 0: the child dropped to
      the unknown uid and kept root's group.
    name: resolveUser
    params: name string, groupGiven bool
    results: uid, gid uint32, err error
  - doc: parseUserIDs extracts the numeric uid and gid from a resolved *user.User.
    name: parseUserIDs
    params: usr *user.User
    results: uid, gid uint32, err error
  - doc: |-
      resolveGroup maps a group name or numeric gid to its gid, surfacing
      UnknownGroup when the name does not resolve.
    name: resolveGroup
    params: name string
    results: gid uint32, err error
  - doc: |-
      resolveGroups maps each supplementary group name or gid to a numeric gid,
      preserving order and failing the batch on the first unresolvable entry.
    name: resolveGroups
    params: names []string
    results: gids []uint32, err error
  - doc: |-
      checkDieWithParent accepts any DieWithParent: Linux and FreeBSD carry the
      parent-death signal in SysProcAttr.Pdeathsig.
    name: checkDieWithParent
    params: _ coreproc.Signal
    results: error
  - doc: |-
      setDieWithParent asks the forked child to receive sig when its parent
      thread exits (PR_SET_PDEATHSIG on Linux, procctl(PROC_PDEATHSIG_CTL) on
      FreeBSD). The stdlib sets it after the credential change and, on Linux,
      signals the child at once if the parent died before it could, so no window
      is left open. A zero sig leaves the field unset.
    name: setDieWithParent
    params: attr *syscall.SysProcAttr, sig coreproc.Signal
  - name: EnvAllow
    params: parent []string, keys ...string
    results: "[]string"
  - name: EnvDeny
    params: parent []string, keys ...string
    results: "[]string"
  - doc: |-
      envFilter keeps the entries of parent whose key's membership in keys equals
      keep, dropping every occurrence of a key but its last. The result is a new
      slice, never nil.
    name: envFilter
    params: parent, keys []string, keep bool
    results: "[]string"
  - doc: |-
      dedupEnv returns env with each variable once: the value and the place of its
      last occurrence, which is what os/exec hands a child of
      append(os.Environ(), "K=v") and what searchPathOf, EnvAllow and EnvDeny read
      already. A child's getenv reads the FIRST entry of a name, so a variable left
      twice in the block would be the one the caller meant to replace. An entry
      without "=" assigns nothing and stays as it is. Names compare as sameVariable
      compares them. The result is a new slice, never nil; env is not modified.
    name: dedupEnv
    params: env []string
    results: "[]string"
  - doc: |-
      envKey returns the name of one KEY=value entry; an entry without '=' is all
      key. A leading '=' belongs to the name, as os/exec reads it: Windows keeps
      each drive's current directory as "=C:=C:\dir", and "=C:" and "=D:" are two
      variables.
    name: envKey
    params: kv string
    results: string
  - doc: |-
      namedKey reports whether key is one of keys, compared as the platform
      compares environment variable names (sameVariable).
    name: namedKey
    params: keys []string, key string
    results: bool
  - doc: repeatedLater reports whether any entry of rest has key.
    name: repeatedLater
    params: rest []string, key string
    results: bool
  - doc: |-
      validateSpec rejects a malformed spec before any OS work happens: an empty
      Path, the one structural invariant the port mandates, and an environment that
      names a variable of the spawn protocol. Everything else is resolved (and may
      fail with its own typed error) during the spawn.
    name: validateSpec
    params: spec coreproc.Spec
    results: error
  - doc: |-
      checkReservedEnv refuses an environment naming a variable of the spawn
      protocol with RESERVED_ENV, naming the key. It is its own function so
      validateSpec stays inlinable.
    name: checkReservedEnv
    params: env []string
    results: error
  - doc: |-
      reservedEnvKey returns the first key of env that begins reservedEnvPrefix,
      compared without regard to case: Windows reads environment names that way,
      and a near-miss on Unix is refused too, so the verdict never depends on the
      platform or on how the caller spelled the prefix.
    name: reservedEnvKey
    params: env []string
    results: key string, found bool
  - doc: |-
      checkPIDEnv refuses a Spec.PIDEnv name the trampoline cannot carry or the
      child could not read: empty, or holding '=', ',' or NUL — INVALID_SPEC —,
      or beginning the spawn protocol's prefix — RESERVED_ENV.
    name: checkPIDEnv
    params: names []string
    results: error
  - doc: |-
      Start spawns the process described by spec and returns a live coreproc.Process
      handle. ctx is honoured up to the fork/exec boundary: a ctx already cancelled
      is reported before any OS work. The child runs with an explicit (possibly
      empty) environment, the requested credentials, and — when Setpgid is set — its
      own process group so the whole tree can be group-killed.
    name: Start
    params: ctx context.Context, spec coreproc.Spec
    results: proc coreproc.Process, err error
  - doc: |-
      prepareSpec validates spec, resolves a bare Path in the child's PATH, and
      refuses every field this platform cannot honour — before any OS work, so a
      request is refused, never dropped.
    name: prepareSpec
    params: spec coreproc.Spec
    results: coreproc.Spec, error
  - doc: |-
      checkSpawnable runs, in order, the refusals of the fields a platform may not
      honour: an unmapped rlimit or umask, a parent-death signal, a scheduling
      class, a cgroup placement (missing, not a cgroup, off Linux), a
      pseudo-terminal and a PIDEnv name. The first refusal is returned typed.
    name: checkSpawnable
    params: spec coreproc.Spec
    results: error
  - doc: |-
      configure turns a forked child into the handle Start returns: the
      post-start attributes on the live pid, then the capture copiers. A refused
      attribute tears the child down.
    name: configure
    params: spec coreproc.Spec, started *os.Process, claim *childwait.Claim, sio *stdioState
    results: coreproc.Process, error
  - doc: |-
      teardown kills and reaps a partially-configured child so a post-start
      attribute failure leaves no leaked process or zombie behind. The child has
      just been started and may still be inside its execve, where NetBSD up to
      10.1 discards a signal (PR kern/58091): the SIGKILL is resent until the
      reap (killUntilReaped), so the teardown cannot wait for ever on a signal
      the kernel dropped.
    name: teardown
    params: live *handle
  - doc: |-
      spawn resolves the spawn target (direct or via the limits trampoline),
      assembles the os.ProcAttr, and forks/execs. On any failure it releases the
      stdio fds (so the aborted spawn leaks nothing) and returns the typed error; on
      success it returns the live OS process, still awaiting post-start attributes,
      and the claim on its exit status (ADR 0093).
    name: spawn
    params: spec coreproc.Spec, sio *stdioState
    results: started *os.Process, claim *childwait.Claim, err error
  - doc: |-
      forkPrepared seals the supervisor's descriptor table, attaches the cgroup
      the clone places the child in, forks, and reads the outcome: a failure
      releases what the spawn holds (a clone into a filtered clone3 is retried
      through the trampoline), a trampoline is awaited until it execs the target.
    name: forkPrepared
    params: spec coreproc.Spec, sio *stdioState, handshakePipe *handshake, l launch
    results: "*os.Process, *childwait.Claim, error"
  - doc: |-
      forkFailed reads a fork/exec failure: a clone into a group that clone3's
      filter refused is spawned again through the trampoline (the stdio is still
      intact); any other failure releases the stdio and is typed —
      CGROUP_WRITE_FAILED for a group that refused the member, SPAWN_FAILED else.
    name: forkFailed
    params: spec coreproc.Spec, sio *stdioState, cloned bool, cause error
    results: "*os.Process, *childwait.Claim, error"
  - doc: |-
      awaitTrampoline blocks a trampolined spawn on its handshake until the child
      execs the target (EOF, nil) or reports a pre-exec failure, which it returns
      as the typed RLIMIT_FAILED / SPAWN_FAILED after cleaning up: the exited
      trampoline child is reaped — through the claim, since a running reaper may
      already have collected it — and the stdio fds are released, so the aborted
      spawn leaks nothing. A spawn with no trampoline has no handshake: nil.
    name: awaitTrampoline
    params: hs *handshake, proc releaser, claim *childwait.Claim, sio *stdioState
    results: error
  - doc: |-
      forkClaimed forks/execs through the child ledger, so the child's exit status
      is claimed before a running reaper can collect it as an orphan's: the child
      may exit — and the reaper sweep — before os.StartProcess has even returned.
    name: forkClaimed
    params: path string, argv []string, attr *os.ProcAttr
    results: started *os.Process, claim *childwait.Claim, err error
  - doc: |-
      spawnFiles returns the stdio file table and, for a trampolined spawn, the
      handshake pipe. It deliberately does NOT place the pipe in the table: spawn
      appends it AFTER any Spec.ExtraFiles so the extras keep their documented fd 3..
      positions (socket activation), with the handshake landing at fd 3+len(extras).
    name: spawnFiles
    params: spec coreproc.Spec, sio *stdioState
    results: files []*os.File, hs *handshake, err error
  - doc: |-
      childFileTable assembles the child's full fd table — stdio (0-2), then
      Spec.ExtraFiles at fd 3.. (socket activation), then the handshake pipe LAST so
      the extras keep their contracted positions. When a handshake is present it
      also returns the env entry carrying the pipe's descriptor (3+len(ExtraFiles))
      so the trampoline reports through the right fd; the slice has no handshake and
      the addon is empty for a direct spawn.
    name: childFileTable
    params: stdio, extra []*os.File, hs *handshake
    results: files []*os.File, hsAddon []string
  - doc: |-
      resolveSpawn returns the (path, argv, envAddon) for os.StartProcess. A spec
      with no pre-exec limits spawns the target verbatim with no env addon; a spec
      setting an Rlimit or a Umask spawns the re-exec trampoline (this binary)
      carrying the encoded limits, which applies them then execs the real target.
    name: resolveSpawn
    params: spec coreproc.Spec
    results: path string, argv, envAddon []string, err error
  - doc: |-
      buildProcAttr assembles the os.ProcAttr for the spawn: the working directory,
      the explicit environment (empty, never inherited, when Spec.Env is nil) plus
      any trampoline sentinel entry from envAddon, the inherited std streams, and the
      SysProcAttr carrying credentials and the group/session topology.
    name: buildProcAttr
    params: spec coreproc.Spec, files []*os.File, envAddon []string
    results: attr *os.ProcAttr, err error
  - doc: |-
      appendExtraFiles returns std (the three std fds) followed by the caller's
      extra inherited files at fd 3+, without mutating either input slice.
    name: appendExtraFiles
    params: std, extra []*os.File
    results: "[]*os.File"
  - doc: |-
      buildArgv returns the argv for the spawn: the caller-supplied Args verbatim,
      or [coreproc.Spec.Path] when Args is empty (the port's argv[0] default).
    name: buildArgv
    params: spec coreproc.Spec
    results: "[]string"
  - doc: |-
      applyPostStart applies the best-effort scheduling attributes that can only be
      set on a live pid (Nice, OOMScoreAdj, Scheduling). The first refusal returns its typed
      error so the caller can tear the child down.
    name: applyPostStart
    params: pid int, spec coreproc.Spec
    results: error
  - doc: |-
      wrapForeignWait is the WaitFailed an opened process answers: only a parent
      collects an exit status, so there is none to wait for.
    name: wrapForeignWait
    params: pid int
    results: error
  - doc: dupProcessHandle duplicates p's pidfd with F_DUPFD_CLOEXEC.
    name: dupProcessHandle
    params: p withHandler
    results: "*os.File, bool"
  - doc: |-
      signalThrough sends sig through p's pidfd. The runtime's answer for a
      process it has waited is ESRCH; for a kernel without pidfd,
      HandleUnavailable.
    name: signalThrough
    params: p withHandler, pid int, sig coreproc.Signal
    results: error
  - doc: |-
      pidfdSendSignal issues pidfd_send_signal(fd, sig, NULL, 0) and returns its
      errno: zero on delivery, ESRCH, EPERM or EINVAL as the kernel said.
    name: pidfdSendSignal
    params: fd uintptr, sig syscall.Signal
    results: syscall.Errno
  - doc: |-
      pidfdExited reports whether the process behind fd has exited, waiting up to
      one pollSlice for it (ppoll on POLLIN); a zero wait only reads the state.
    name: pidfdExited
    params: fd uintptr, wait bool
    results: bool, error
  - doc: |-
      newHandle wraps a freshly started *os.Process and the claim on its exit
      status as a handle. setpgid records whether the child leads its own process
      group (Spec.Setpgid): only then is the leader pid a valid pgid for
      group-directed kills. stdio owns the capture copiers that Wait joins so no
      output is lost and no goroutine leaks.
    name: newHandle
    params: p *os.Process, claim *childwait.Claim, setpgid bool, stdio *stdioState
    results: "*handle"
  - doc: |-
      collectExit obtains proc's exit status from whichever waiter took it, and
      ends the claim. Without a running reaper that is always proc's own wait, and
      nothing changes from a plain os.Process.Wait. With one, a sweep may collect
      the child first; its status is then on the claim — before the wait, when the
      sweep came first, or after the wait failed with ECHILD, once the sweep's
      hand-off has landed. swept reports that case: proc's own Wait never
      completed, so the caller must Release proc. err is the wait's own error only
      when the status is truly unobservable: something outside the SDK reaped the
      child, or wait4 failed for another reason.
    name: collectExit
    params: proc waiter, claim *childwait.Claim
    results: exit coreproc.ExitValue, swept bool, err error
  - doc: |-
      exitValueFrom converts a finished *os.ProcessState into the port's ExitValue,
      reading exit status / terminating signal from WaitStatus and CPU/RSS from the
      wait4 rusage.
    name: exitValueFrom
    params: state *os.ProcessState
    results: coreproc.ExitValue
  - doc: |-
      exitValue converts a wait4 status word and its rusage into the port's
      ExitValue — the one translation for a status collected by the handle's own
      wait and for one a reaper sweep handed over. ru may be nil.
    name: exitValue
    params: ws syscall.WaitStatus, ru *syscall.Rusage
    results: coreproc.ExitValue
  - doc: |-
      readRusage fills out's CPU times and MaxRSS from the wait4 rusage ru; the
      remaining counters are childwait.UsageOf's.
    name: readRusage
    params: ru *syscall.Rusage, out *coreproc.ExitValue
  - doc: |-
      timevalToDuration converts a syscall.Timeval (seconds + microseconds) to a
      time.Duration.
    name: timevalToDuration
    params: tv syscall.Timeval
    results: time.Duration
  - doc: |-
      processGone reports whether err's root cause is the benign "no such process"
      condition (ESRCH) — the group already exited.
    name: processGone
    params: err error
    results: bool
  - doc: |-
      newHandshake creates the status pipe. The returned write end must be placed at
      handshakeFD in the child's file table (right after the three std streams).
    name: newHandshake
    results: hs *handshake, err error
  - doc: closeHandshake releases a (possibly nil) handshake pipe on an aborted spawn.
    name: closeHandshake
    params: hs *handshake
  - doc: handshakeError maps a trampoline status byte to its central typed sentinel.
    name: handshakeError
    params: code byte
    results: error
  - doc: |-
      checkLimits validates the rlimit/umask fields of spec before the spawn and
      returns the typed error the caller must surface. An Rlimits key naming a
      resource with no stdlib RLIMIT_* mapping (ResourceNProc / ResourceMemLock) is
      UnknownResource. Every mappable Rlimit and a non-nil Umask are honourable via
      the trampoline, so they pass validation here and are applied pre-exec. An
      OOMScoreAdj off Linux is UnsupportedPlatform: the bias is a procfs write on
      the live pid, so elsewhere it could only fail after the child had already
      run (ADR 0018, amended 2026-11-04). A spec requesting none of these returns
      nil and spawns unaffected.
    name: checkLimits
    params: spec coreproc.Spec
    results: error
  - doc: addPlatformLimits adds the address-space limit (RLIMIT_AS) to the table.
    name: addPlatformLimits
    params: limits map[coreproc.Resource]int
  - doc: |-
      buildResourceLimits returns the Resource→RLIMIT_* map. It is a function rather
      than a literal so the platform constants resolve under the unix build tag and
      the package keeps to the no-init rule via a package-level var initialiser.
    name: buildResourceLimits
    results: map[coreproc.Resource]int
  - doc: |-
      resolveSpec returns spec with Path resolved to the executable the spawn
      runs, and — when the caller gave no Args — argv defaulted to the name as the
      caller WROTE it, which is what os/exec puts in argv[0] and what a program
      reading its own name expects.

      A Path containing a separator is a file path and is left as written: a
      relative one is resolved by the kernel against Spec.Dir, as os/exec
      documents. A bare name is searched in the PATH the CHILD will see — the PATH
      entry of Spec.Env when it carries one (the last, as os/exec reads a
      duplicated key), the parent's otherwise, including when Spec.Env is nil and
      the child's environment is empty. A match found through a relative PATH
      entry ("." or an empty one) is refused, which is Go 1.19's exec.ErrDot rule:
      running whatever file happens to sit in the working directory under a
      command's name is how a checked-out repository executes code nobody chose.
    name: resolveSpec
    params: spec coreproc.Spec
    results: resolved coreproc.Spec, err error
  - doc: |-
      searchPathOf returns the PATH a bare name is searched in, and whether it is
      the child's own: Spec.Env's PATH whenever Spec.Env NAMES one — an explicitly
      empty `PATH=` included, which searches nothing, because that is the PATH the
      child runs with and falling back would run a program the caller's
      environment excluded — and the parent's only when Spec.Env names none.
    name: searchPathOf
    params: env []string
    results: searchPath string, fromSpec bool
  - doc: |-
      envValue returns the last value of key in env, compared as the platform
      compares variable names, and whether env names key at all.
    name: envValue
    params: env []string, key string
    results: value string, named bool
  - doc: |-
      lookPath searches name in every directory of searchPath, in order, and
      returns the first executable candidate. A candidate found through a relative
      directory is refused with exec.ErrDot rather than skipped, exactly as
      os/exec.LookPath refuses it: skipping would silently run a DIFFERENT program
      from the one the PATH order selects.
    name: lookPath
    params: name, searchPath string, env []string
    results: path string, err error
  - doc: |-
      isExecutable reports whether path is a regular file this platform would
      run: any execute bit on Unix, any existing regular file on Windows (where
      the extension, not a mode, decides).
    name: isExecutable
    params: path string
    results: bool
  - doc: candidates is the one file name could be in dir.
    name: candidates
    params: dir, name string, _ []string
    results: "[]string"
  - doc: executableMode reports whether a regular file's mode lets something run it.
    name: executableMode
    params: mode fs.FileMode
    results: bool
  - doc: |-
      isPath reports whether name is a file path rather than a command name: on
      Unix, any slash makes it one, as os/exec.LookPath decides.
    name: isPath
    params: name string
    results: bool
  - doc: |-
      sameVariable compares two environment variable names; Unix names are
      case-sensitive.
    name: sameVariable
    params: left, right string
    results: bool
  - doc: |-
      variableKey is a name's spelling two names sameVariable takes for one share:
      on Unix, the name itself.
    name: variableKey
    params: name string
    results: string
  - name: Open
    params: pid int
    results: proc coreproc.Process, err error
  - doc: |-
      openProcess opens pid through pidfd_open. A pid already gone is SIGNAL_FAILED
      wrapping ESRCH; a kernel that gave no pidfd is HANDLE_UNAVAILABLE — the
      runtime then holds only the number, which is the race Open exists to avoid.
    name: openProcess
    params: pid int
    results: coreproc.Process, error
  - doc: |-
      whyNoPidfd classifies a pid os.FindProcess holds no pidfd for: ESRCH from
      pidfd_open is a process gone (SIGNAL_FAILED), anything else — ENOSYS
      before Linux 5.3, a filter's EPERM — is HANDLE_UNAVAILABLE.
    name: whyNoPidfd
    params: pid int
    results: error
  - doc: |-
      readPIDFile reads the PID the file at path holds, safely (see
      AttachPIDFile), and reports whether the file is trustworthy.
    name: readPIDFile
    params: path string
    results: pid int, trusted bool, err error
  - doc: |-
      parsePID reads one decimal PID, blanks around it allowed, no sign: the
      content of a PID file.
    name: parsePID
    params: buf []byte, path string
    results: int, error
  - doc: |-
      openPIDFile walks path and opens the regular file at its end without
      following a symbolic link or blocking, reporting whether the walk and the
      file are trustworthy.
    name: openPIDFile
    params: path string
    results: f *os.File, trusted bool, err error
  - doc: refusePath is PID_FILE_REFUSED for a path refused as written.
    name: refusePath
    params: path, why string
    results: error
  - doc: |-
      splitPath returns the components of an absolute or relative path, empty
      ones dropped.
    name: splitPath
    params: path string
    results: "[]string"
  - doc: |-
      newPIDWalk opens root — "/" for a PID file, a test's own directory in the
      tests — and starts a walk there: an absolute link target restarts at it, and
      its trust is its own stat's, as the real root's is.
    name: newPIDWalk
    params: root string
    results: "*pidWalk, error"
  - doc: |-
      fileRefusal names why an entry of mode cannot be a PID file, and reports
      whether it can.
    name: fileRefusal
    params: mode uint32
    results: why string, ok bool
  - doc: |-
      entryTrusted reports whether an entry owned by uid, in the directory dir,
      could only have been made by root or euid: both belong to one of them, and
      nobody else may write the directory — or it is sticky, so another user may
      add entries but not replace this one.
    name: entryTrusted
    params: dir entryStat, uid uint32, euid int
    results: bool
  - doc: vouched reports whether uid is root or euid.
    name: vouched
    params: uid uint32, euid int
    results: bool
  - doc: errorOr returns err, or alt when err is nil.
    name: errorOr
    params: err, alt error
    results: error
  - doc: openWalkRoot opens root as a walk's first directory, with its stat.
    name: openWalkRoot
    params: root string
    results: heldDir, entryStat, error
  - doc: |-
      releaseDirs releases every directory of a walk. It is kept out of line:
      inlined, the loop would push pidWalk.close past the inline budget, which a
      walk's one close does not need it to be in.
    name: releaseDirs
    params: dirs []heldDir
  - doc: fstatEntry is fstat(2) of fd, as the walk reads it.
    name: fstatEntry
    params: fd int
    results: entryStat, error
  - doc: statOf is what the walk reads of a Linux stat.
    name: statOf
    params: st *syscall.Stat_t
    results: entryStat
  - doc: |-
      procFDPath names entry name in the directory held as fd, through
      /proc/self/fd: resolution starts at that directory, not at a path. An empty
      name names what fd holds.
    name: procFDPath
    params: fd int, name string
    results: string
  - doc: writeProcFile writes data to a procfs control file at path.
    name: writeProcFile
    params: path, data string
    results: error
  - doc: |-
      openPTY allocates a pseudo-terminal: /dev/ptmx opened without becoming the
      supervisor's controlling terminal, its slave unlocked (TIOCSPTLCK 0) and
      numbered (TIOCGPTN), then /dev/pts/<n> opened the same way. Both are
      close-on-exec; the child gets the slave through dup2.
    name: openPTY
    results: master, slave *os.File, err error
  - doc: |-
      buildPTYStdio allocates a pseudo-terminal (openPTY, per kernel), sizes it
      when size is set, and wires its slave side as the child's fd 0, 1 and 2.
      The parent closes the slave after the spawn; the master stays, for TTY.
    name: buildPTYStdio
    params: s *stdioState, size *coreproc.PTYValue
    results: error
  - doc: "checkPTY accepts StdioPTY: this kernel has pseudo-terminals."
    name: checkPTY
    params: _ coreproc.Spec
    results: error
  - doc: |-
      ioctlFile issues ioctl(req, arg) on f's descriptor without taking it out of
      the runtime's poller (File.Fd would set it blocking, and a Read on the
      master could then no longer be interrupted by Close).
    name: ioctlFile
    params: f *os.File, req uint, arg unsafe.Pointer
    results: error
  - doc: setWinsize sets the terminal's window size (TIOCSWINSZ).
    name: setWinsize
    params: master *os.File, size coreproc.PTYValue
    results: error
  - name: Reclaim
    params: ctx context.Context, pid int
    results: proc coreproc.Process, err error
  - doc: |-
      reclaimChild claims pid's exit status and wraps it in Start's handle, once
      /proc says it is this process's child — before the claim and after it: a
      child's pid is not reused until this process reaps it, so the second read
      proves the claim holds the child the first one saw.
    name: reclaimChild
    params: pid int
    results: coreproc.Process, error
  - doc: |-
      childOf reports whether /proc/<pid>/stat names parent as pid's parent: its
      fourth field, after the command name's closing parenthesis.
    name: childOf
    params: pid, parent int
    results: bool
  - name: Run
    params: ctx context.Context, spec coreproc.Spec, opts coreproc.RunValue
    results: result coreproc.ResultValue, err error
  - doc: |-
      waitOrStop waits for p within ctx; when ctx ends first it stops p with
      SIGTERM and grace, collects the exit, and reports ctx's error beside it.
    name: waitOrStop
    params: ctx context.Context, p coreproc.Process, grace time.Duration
    results: exit coreproc.ExitValue, err error
  - doc: currentHost returns the kernel a sandboxed spawn reads.
    name: currentHost
    results: "*sandboxHost"
  - name: LandlockABI
    results: abi int, err error
  - doc: landlockABIProbe is landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION).
    name: landlockABIProbe
    results: int, syscall.Errno
  - doc: |-
      mountSetattrProbe calls mount_setattr(2) with a size it refuses: EINVAL
      where the call exists, ENOSYS before Linux 5.12.
    name: mountSetattrProbe
    results: syscall.Errno
  - doc: |-
      checkSandbox refuses, before the Path is resolved and before any fork, a
      Spec.Sandbox this spawn cannot apply: InvalidSpec for a malformed value,
      SandboxUnavailable for a part this kernel lacks — the function is named in
      the feature field. A nil Sandbox passes.
    name: checkSandbox
    params: spec coreproc.Spec
    results: error
  - doc: |-
      checkSandboxShape refuses the combinations no kernel could apply: an
      inherited descriptor table, unknown namespaces, id maps without a user
      namespace or mapping nothing, groups in a user namespace, a root without a
      mount namespace or a Path without a '/'.
    name: checkSandboxShape
    params: spec coreproc.Spec
    results: error
  - doc: |-
      idMapsUsable reports whether sb's id maps can be written: none, or lines of
      at least one id in a user namespace.
    name: idMapsUsable
    params: sb *coreproc.SandboxValue
    results: bool
  - doc: |-
      rootUsable reports whether spec's root can be pivoted into: none, or an
      absolute clean path in a mount namespace with a Path that is a path.
    name: rootUsable
    params: spec coreproc.Spec
    results: bool
  - doc: idMapsSized reports whether every line of maps maps at least one id.
    name: idMapsSized
    params: maps []coreproc.IDMapValue
    results: bool
  - doc: absClean reports whether p is an absolute path in its clean form.
    name: absClean
    params: p string
    results: bool
  - doc: |-
      checkSandboxMounts refuses a mount the stage cannot make: no mount
      namespace, an unknown kind, a relative path, a source on a kind that takes
      none; and SandboxUnavailable for a read-only mount on a kernel without
      mount_setattr(2).
    name: checkSandboxMounts
    params: sb *coreproc.SandboxValue, host *sandboxHost
    results: error
  - doc: |-
      mountWellFormed reports whether m has a known kind, an absolute clean
      target, and a source exactly when it binds one, absolute and clean.
    name: mountWellFormed
    params: m coreproc.MountValue
    results: bool
  - doc: |-
      checkCapabilities refuses an ambient set outside the bounding set, or naming
      a capability this kernel does not know.
    name: checkCapabilities
    params: c *coreproc.CapabilitiesValue, host *sandboxHost
    results: error
  - doc: capLastCap reads the highest capability number the kernel knows.
    name: capLastCap
    params: host *sandboxHost
    results: uint32, error
  - doc: |-
      landlockPlan returns the rights restricted and the rules, trimmed to the
      kernel's ABI: a right it lacks is dropped when ll names it best-effort and
      refused with SandboxUnavailable otherwise; a rule left granting nothing is
      dropped. InvalidSpec for no handled right, an unknown right, a relative
      path or a rule granting what is not handled. A nil ll plans nothing.
    name: landlockPlan
    params: ll *coreproc.LandlockValue, host *sandboxHost
    results: uint64, []sandboxRule, error
  - doc: |-
      checkLandlockShape refuses an inert or unknown handled set and a rule with a
      relative path or a right that is not handled.
    name: checkLandlockShape
    params: ll *coreproc.LandlockValue
    results: error
  - doc: |-
      trimLandlockRules keeps each rule's supported rights, and the rules left
      granting any.
    name: trimLandlockRules
    params: rules []coreproc.LandlockRuleValue, supported coreproc.LandlockAccess
    results: "[]sandboxRule"
  - doc: landlockSupported returns the rights an ABI implements.
    name: landlockSupported
    params: abi int
    results: coreproc.LandlockAccess
  - doc: landlockRightName names the lowest right of set.
    name: landlockRightName
    params: set coreproc.LandlockAccess
    results: string
  - doc: |-
      checkSandboxKernel refuses a sandbox this kernel cannot start: no
      /proc/self/exe to re-execute — no fallback is taken — or a namespace kind it
      lacks.
    name: checkSandboxKernel
    params: sb *coreproc.SandboxValue, host *sandboxHost
    results: error
  - doc: |-
      trampolineSelf returns the binary the trampoline re-executes: /proc/self/exe
      for a sandboxed spawn, which the stdlib's path-only StartProcess reaches,
      checked by checkSandbox; os.Executable's answer otherwise.
    name: trampolineSelf
    params: spec coreproc.Spec
    results: string, error
  - doc: |-
      attachSandbox prepares a sandboxed fork on attr: the namespaces on the
      clone, the identity taken from the clone and handed to the second stage, and
      the payload sealed in a memfd placed after the handshake pipe, its number in
      trampolineSandboxEnv. It returns the memfd, which the caller closes once the
      fork is done; nil, and attr untouched, for a spawn with no sandbox.
    name: attachSandbox
    params: spec coreproc.Spec, attr *os.ProcAttr
    results: "*os.File, error"
  - doc: |-
      setSandboxClone puts the namespaces on the clone: every kind but the mount
      and cgroup namespaces on the clone flags, the mount namespace unshared after
      the clone — the stdlib then makes every mount private, so nothing propagates
      back —, the cgroup namespace left to the second stage, and the user
      namespace's maps, setgroups denied.
    name: setSandboxClone
    params: sys *syscall.SysProcAttr, sb *coreproc.SandboxValue
  - doc: idMappings converts maps, or — empty — the namespace's 0 mapped to self.
    name: idMappings
    params: maps []coreproc.IDMapValue, self int
    results: "[]syscall.SysProcIDMap"
  - doc: |-
      buildSandboxPayload assembles what the second stage applies: the cgroup
      namespace, the mounts, root and directory, the identity cred carried, the capability sets, the
      Landlock plan, the assembled filter, the parent-death signal to arm again
      after the identity changes, and the test hooks.
    name: buildSandboxPayload
    params: spec coreproc.Spec, cred *syscall.Credential
    results: "*sandboxPayload, error"
  - doc: |-
      parentToCheck is the supervisor's pid the stage compares its parent with
      after arming the parent-death signal again: none without the signal, nor in
      a PID namespace, where a child sees no parent's pid.
    name: parentToCheck
    params: spec coreproc.Spec
    results: uint32
  - doc: |-
      sandboxCapsOf converts the capability sets, with the kernel's highest
      capability; nil leaves them inherited.
    name: sandboxCapsOf
    params: c *coreproc.CapabilitiesValue, host *sandboxHost
    results: "*sandboxCaps, error"
  - doc: sandboxMounts converts the mounts to the payload's form.
    name: sandboxMounts
    params: mounts []coreproc.MountValue
    results: "[]sandboxMount"
  - doc: |-
      sandboxIdentityOf converts the credential the spec resolved to, nil when it
      names none; setGroups is false in the spawn's own user namespace.
    name: sandboxIdentityOf
    params: cred *syscall.Credential, setGroups bool
    results: "*sandboxIdentity"
  - doc: encodeSandbox writes p in the payload layout.
    name: encodeSandbox
    params: p *sandboxPayload
    results: "[]byte"
  - doc: encodeMounts writes the mounts, the root and the working directory.
    name: encodeMounts
    params: w *payloadWriter, p *sandboxPayload
  - doc: encodeCredentials writes the identity, the capabilities and no_new_privs.
    name: encodeCredentials
    params: w *payloadWriter, p *sandboxPayload
  - doc: encodeLandlock writes the handled rights and the rules.
    name: encodeLandlock
    params: w *payloadWriter, p *sandboxPayload
  - doc: |-
      decodeSandbox parses a payload, refusing with EINVAL anything but the exact
      layout of sandboxVersion: a wrong magic, an unknown version, a length that is
      not the data's, a count or string past its bound, a byte left over.
    name: decodeSandbox
    params: data []byte
    results: "*sandboxPayload, syscall.Errno"
  - doc: |-
      sandboxHeaderOK reports whether data opens with the magic, this version, a
      zero reserved half-word and its own length.
    name: sandboxHeaderOK
    params: data []byte
    results: bool
  - doc: decodeMounts reads the mounts, the root and the working directory.
    name: decodeMounts
    params: r *payloadReader, p *sandboxPayload
  - doc: decodeCredentials reads the identity, the capabilities and no_new_privs.
    name: decodeCredentials
    params: r *payloadReader, p *sandboxPayload
  - doc: decodeLandlock reads the handled rights and the rules.
    name: decodeLandlock
    params: r *payloadReader, p *sandboxPayload
  - doc: |-
      sealedPayload writes data into a new memfd and seals it against any write,
      growth, shrink or further seal change, so what the child reads is what the
      parent wrote. The descriptor is close-on-exec in the parent; the fork's dup2
      gives the child its own copy without the flag.
    name: sealedPayload
    params: data []byte
    results: fd int, errno syscall.Errno
  - doc: writePayload writes data to fd until every byte is written.
    name: writePayload
    params: fd int, data []byte
    results: syscall.Errno
  - doc: |-
      readSealedPayload reads the payload the parent sealed in fd: every seal must
      be set and the file no longer than sandboxMaxPayload, and its bytes must
      decode. The descriptor is closed whatever the outcome.
    name: readSealedPayload
    params: fd int
    results: "*sandboxPayload, syscall.Errno"
  - doc: parseSyscallTable reads "name number" lines into a map.
    name: parseSyscallTable
    params: table string
    results: map[string]uint32
  - doc: |-
      checkSeccomp refuses a filter that cannot be written or would be inert:
      InvalidSpec for an unknown action or name, an errno out of range, no call
      named, a Default equal to Action, or a floor call denied; SandboxUnavailable
      when the kernel has no seccomp or no SECCOMP_RET_KILL_PROCESS.
    name: checkSeccomp
    params: sc *coreproc.SeccompValue, available func() syscall.Errno
    results: error
  - doc: |-
      checkSyscallName refuses a name no supported architecture knows, and a floor
      call given an action other than SeccompAllow.
    name: checkSyscallName
    params: name string, action coreproc.SeccompAction
    results: error
  - doc: |-
      seccompAvailable asks the kernel whether seccomp exists and can kill a
      process: seccomp(SECCOMP_GET_ACTION_AVAIL, 0, &SECCOMP_RET_KILL_PROCESS).
    name: seccompAvailable
    results: syscall.Errno
  - doc: seccompReturn is the filter's return value for action.
    name: seccompReturn
    params: action coreproc.SeccompAction, errno int
    results: uint32
  - doc: |-
      assembleSeccomp writes sc as a classic BPF program: the architecture check
      (another ABI is killed, and on amd64 the x32 one), the floor calls let
      through, a write to the handshake descriptor hsfd let through, then one
      comparison per named call taking Action, and Default for the rest. Every
      jump is 0 or a few instructions forward, far below the 255 a jump can reach.
      checkSeccomp has accepted sc.
    name: assembleSeccomp
    params: sc *coreproc.SeccompValue, hsfd int
    results: "[]sockFilter"
  - doc: |-
      seccompNumbers returns the numbers of names on this architecture, sorted and
      without repeats; a name it lacks, or a floor call, is left out.
    name: seccompNumbers
    params: numbers map[string]uint32, names []string
    results: "[]uint32"
  - doc: |-
      execSandboxed runs the second stage and execs target, never returning: it
      reads the sealed payload at the descriptor fdText names, applies each step
      in order on this thread — locked to it, as the runtime keeps the main
      goroutine during package initialisation — and installs the seccomp filter
      immediately before the execve. A step that fails reports itself on the
      handshake pipe and exits: the target never runs.
    name: execSandboxed
    params: fdText, target string, args, env []string
  - doc: |-
      sandboxFail reports step's failure with errno on the handshake descriptor
      and exits: the target never runs.
    name: sandboxFail
    params: hsfd int, step uint8, errno syscall.Errno
  - doc: applyMount makes one mount, then makes it read-only, recursively, when asked.
    name: applyMount
    params: m sandboxMount
    results: syscall.Errno
  - doc: rawMount is mount(2); an empty fstype or data passes NULL.
    name: rawMount
    params: source, target, fstype string, flags uintptr, data string
    results: syscall.Errno
  - doc: |-
      optionalCString is s as a C string, nil — NULL to the kernel — when empty
      or holding a NUL, which the stage's own constants never do.
    name: optionalCString
    params: s string
    results: "*byte"
  - doc: |-
      mountReadOnly sets MOUNT_ATTR_RDONLY on target and every mount below it
      with mount_setattr(2): a remount would need each one's locked flags.
    name: mountReadOnly
    params: target string
    results: syscall.Errno
  - doc: errnoOf returns err's errno, EIO for any other error, zero for nil.
    name: errnoOf
    params: err error
    results: syscall.Errno
  - doc: addLandlockRule opens r's path O_PATH and adds it to ruleset.
    name: addLandlockRule
    params: ruleset int, r sandboxRule
    results: syscall.Errno
  - doc: |-
      setGroups sets the supplementary groups — cleared when none — unless the
      spawn's own user namespace denies setgroups(2).
    name: setGroups
    params: id *sandboxIdentity
    results: syscall.Errno
  - doc: |-
      rawWrite writes b to fd in one raw call, the one write the filter lets
      through for the handshake descriptor.
    name: rawWrite
    params: fd int, b []byte
    results: error
  - doc: errnoError is errno as an error, nil for zero.
    name: errnoError
    params: errno syscall.Errno
    results: error
  - doc: |-
      exitGroup ends the process with code through exit_group(2), which the filter
      lets through, never returning.
    name: exitGroup
    params: code int
  - doc: sandboxStepName returns the name of step, or its number when it is none.
    name: sandboxStepName
    params: step uint8
    results: string
  - doc: |-
      sandboxReport is the failure report of step with errno, as the stage writes
      it to the handshake pipe.
    name: sandboxReport
    params: step uint8, errno syscall.Errno
    results: "[sandboxReportLen]byte"
  - doc: |-
      sandboxFailure maps a sandbox failure report — what follows the tag — to the
      central SandboxFailed, naming the step and the errno.
    name: sandboxFailure
    params: rest []byte
    results: error
  - doc: |-
      checkScheduling refuses a Spec.Scheduling that names no defined policy or
      class, or an I/O level outside 0..7, with InvalidSpec, then one this platform
      cannot apply with UnsupportedPlatform — both before anything is spawned. A
      nil value asks for nothing.
    name: checkScheduling
    params: sched *coreproc.SchedulingValue
    results: error
  - doc: knownPolicy reports whether p is one of the defined SchedPolicy values.
    name: knownPolicy
    params: p coreproc.SchedPolicy
    results: bool
  - doc: knownIOClass reports whether c is one of the defined IOClass values.
    name: knownIOClass
    params: c coreproc.IOClass
    results: bool
  - doc: |-
      checkSchedulingPlatform accepts every defined policy and class: Linux has
      them all.
    name: checkSchedulingPlatform
    params: _ *coreproc.SchedulingValue
    results: error
  - doc: |-
      applyScheduling sets sched's policy (sched_setscheduler) and, unless it is
      IOClassNone, its I/O priority (ioprio_set) on the live pid. Both apply to
      the child's main thread, which every thread it creates afterwards inherits:
      the window is the one Nice has, between the exec and this call. A refusal —
      a realtime policy or class without CAP_SYS_NICE / CAP_SYS_ADMIN, a priority
      out of range — is RLIMIT_FAILED.
    name: applyScheduling
    params: pid int, sched *coreproc.SchedulingValue
    results: error
  - doc: |-
      sealFDs marks the whole table from firstSealedFD up in one close_range(2)
      call, falling back to the walk on a kernel without it.
    name: sealFDs
    results: error
  - doc: |-
      markRangeCloexec issues close_range(3, ~0U, CLOSE_RANGE_CLOEXEC) and returns
      its errno, zero on success. The stdlib exports no number for it, so
      sysCloseRange is cited per kernel (ADR 0018).
    name: markRangeCloexec
    results: syscall.Errno
  - doc: |-
      sealInherited marks every descriptor of the supervisor from firstSealedFD up
      close-on-exec before a spawn, unless spec.FDs asks to inherit them (#1089). Go's
      fork/exec installs the child's stdio, ExtraFiles and handshake pipe with
      dup2, which clears the flag on the child's copy, and leaves every other
      descriptor without FD_CLOEXEC open in the child: an activation socket a
      systemd unit received, a descriptor the shell that started the supervisor
      leaked, a raw syscall.Dup. The mark closes nothing and is process-wide.
    name: sealInherited
    params: spec coreproc.Spec
    results: error
  - doc: |-
      sealWith marks the table with closeRange — one close_range(2) with
      CLOSE_RANGE_CLOEXEC — and falls back to the walk of fdDir when the kernel
      answers that it has no such call or no such flag (ENOSYS before Linux 5.9 or
      FreeBSD 13, EINVAL on Linux 5.9 and 5.10, which lack the flag), remembering
      the answer in missing so later spawns go straight to the walk.
    name: sealWith
    params: closeRange func() syscall.Errno, missing *atomic.Bool
    results: error
  - doc: |-
      sealByWalk marks close-on-exec every descriptor from firstSealedFD up that
      dir lists — /proc/self/fd on Linux, illumos and Solaris, /dev/fd on darwin
      and the BSDs. syscall.CloseOnExec routes through libc where the kernel
      refuses a raw fcntl (OpenBSD), and ignores a descriptor closed since the
      listing. The directory's own descriptor, opened close-on-exec, is listed
      too and marked again harmlessly.
    name: sealByWalk
    params: dir string
    results: error
  - doc: stdioField tags a wrapped stdio-setup failure with the stream it concerns.
    name: stdioField
    params: stream string
    results: errs.FieldValue
  - doc: |-
      swallowErr intentionally discards a non-actionable cleanup error — a copier's
      drained-pipe io.Copy or a best-effort close — recording the discard so the
      error audit treats it as deliberate rather than dropped.
    name: swallowErr
    params: err error
  - doc: |-
      buildStdio assembles the stdioState for spec.Stdio. Any fd-setup failure
      (os.Pipe / opening the null device) closes whatever was opened and returns a
      typed SPAWN_FAILED — the spawn cannot proceed without its standard streams.
    name: buildStdio
    params: spec coreproc.Spec
    results: state *stdioState, err error
  - doc: |-
      nullDevice returns the process's shared null device, opening it on first
      use. A failed open is not remembered: the next spawn tries again.
    name: nullDevice
    results: "*os.File, error"
  - doc: |-
      openNull opens the platform null device with flag and returns the descriptor;
      the caller owns and eventually closes it. Returning the fd (rather than storing
      it inline) keeps ownership transfer explicit.
    name: openNull
    params: flag int
    results: f *os.File, err error
  - doc: outName maps an output fd index to its stream name for diagnostics.
    name: outName
    params: idx int
    results: string
  - doc: |-
      installTrampoline acts as the trampoline when this process was spawned as one
      (the sentinel env var is present), else returns a zero marker so the
      package-level var initialiser above has a value to bind.
    name: installTrampoline
    results: struct{}
  - doc: |-
      runTrampoline applies the encoded limits then execve()s the real target
      (os.Args[1] with argv os.Args[2:]). It never returns on success; on any failure
      it reports a status byte to the parent (handshakeFD), writes a diagnostic to
      stderr, and exits with a distinct status.
    name: runTrampoline
    params: payload string
  - doc: |-
      childHandshakeFD returns the descriptor the parent placed the handshake pipe's
      write end at: the value of trampolineHsFdEnv when set (the pipe sits after
      Spec.ExtraFiles at fd 3+len(ExtraFiles)), else defaultHandshakeFD (no extras).
    name: childHandshakeFD
    results: int
  - doc: |-
      reportHandshake writes a single status byte to the handshake fd so the parent's
      Start surfaces a typed error. Best-effort: a write fault changes nothing before
      the imminent exit (the parent then falls back to the child's exit code).
    name: reportHandshake
    params: code byte
  - doc: |-
      armHandshakeClose marks the handshake fd close-on-exec so a successful execve
      closes it (the parent reads EOF = success) while a failed execve leaves it open
      for the failure byte. It uses syscall.CloseOnExec rather than a raw
      Syscall(SYS_FCNTL, …): OpenBSD's kernel rejects an fcntl issued outside libc
      (the pinsyscalls hardening) with ENOSYS, whereas CloseOnExec routes through the
      platform's libc-backed fcntl and works on every Unix target. It cannot fail for
      the live pipe descriptor the parent just created and the child inherited.
    name: armHandshakeClose
  - doc: |-
      stderrLine writes a single diagnostic line to standard error, ignoring any
      write error (the trampoline is about to exit regardless).
    name: stderrLine
    params: msg string
  - doc: |-
      applyTrampoline applies every token in the payload, returning the first failure
      message or "" on success.
    name: applyTrampoline
    params: payload string
    results: string
  - doc: |-
      applyToken applies one payload token: "u<mask>" sets the umask, "r<num>,<soft>,
      <hard>" sets one rlimit. It returns "" on success or a diagnostic message.
    name: applyToken
    params: tok string
    results: string
  - doc: applyUmaskToken parses a decimal umask and applies it via umask(2).
    name: applyUmaskToken
    params: s string
    results: string
  - doc: applyRlimitToken parses "num,soft,hard" and applies it via setrlimit(2).
    name: applyRlimitToken
    params: s string
    results: string
  - doc: environWithout returns env with any entry whose key is key removed.
    name: environWithout
    params: env []string, key string
    results: "[]string"
  - doc: |-
      needsTrampoline reports whether spec requests a pre-exec limit (any Rlimit or a
      Umask, a variable set to the child's PID, or a cgroup placement the kernel
      cannot make at clone time) that the
      stdlib spawn cannot apply directly, so Start must route through the re-exec
      trampoline.
    name: needsTrampoline
    params: spec coreproc.Spec
    results: bool
  - doc: |-
      trampolined reports whether spec spawns through the trampoline: a sandbox,
      whose second stage the trampoline is, or a pre-exec limit needsTrampoline
      names. It is apart from needsTrampoline so that one stays inlinable.
    name: trampolined
    params: spec coreproc.Spec
    results: bool
  - doc: |-
      encodeTrampoline builds the payload env value for spec: a ';'-separated list of
      a "u<mask>" umask token (when set) and one "r<num>,<soft>,<hard>" token per
      rlimit (the resource already validated against resourceLimits by checkLimits).
    name: encodeTrampoline
    params: spec coreproc.Spec
    results: string
  - doc: |-
      trampolineSpawn returns the (path, argv, envAddon) that make os.StartProcess run
      the trampoline: exec this binary (os.Executable(), or /proc/self/exe for a
      sandbox) with argv [self, target, targetArgv...] and an extra env entry
      carrying the encoded limits.
    name: trampolineSpawn
    params: spec coreproc.Spec
    results: path string, argv, envAddon []string, err error
  - doc: |-
      withPIDEnv sets every name of the comma-separated list names to pid in env,
      replacing an entry of the same name: the trampoline gives the target its own
      PID, which no parent could know before the fork (Spec.PIDEnv).
    name: withPIDEnv
    params: env []string, names string, pid int
    results: "[]string"
  - doc: wrapSpawn wraps a fork/exec cause onto the central SpawnFailed sentinel.
    name: wrapSpawn
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: wrapWait wraps a wait4 host fault onto the central WaitFailed sentinel.
    name: wrapWait
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: wrapSignal wraps a kill(2) cause onto the central SignalFailed sentinel.
    name: wrapSignal
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: wrapStop wraps a failed SIGKILL escalation onto the central StopFailed sentinel.
    name: wrapStop
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapRlimit wraps a refused scheduling/limit attribute onto the central
      RlimitFailed sentinel.
    name: wrapRlimit
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapCgroupUnavailable wraps a stat/validation cause onto the central
      CgroupUnavailable sentinel — the pre-spawn check that Spec.CgroupPath names an
      existing, delegated cgroup v2 directory.
    name: wrapCgroupUnavailable
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapStdioCapture wraps a StdioCapture writer failure onto the central
      StdioCaptureFailed sentinel.
    name: wrapStdioCapture
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapUnknownUser wraps an os/user resolution cause onto the central UnknownUser
      sentinel.
    name: wrapUnknownUser
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapUnknownGroup wraps an os/user resolution cause onto the central
      UnknownGroup sentinel.
    name: wrapUnknownGroup
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapStdioDrainTimeout builds the central StdioDrainTimeout error a Wait
      returns beside the real exit when the drain grace cut the capture pipes. It
      has no cause: nothing failed, something still held the pipes.
    name: wrapStdioDrainTimeout
    params: fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapHandleUnavailable wraps the reason no kernel handle could be had for a
      process onto the central HandleUnavailable sentinel.
    name: wrapHandleUnavailable
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapPTYFailed wraps a pseudo-terminal fault onto the central PTYFailed
      sentinel.
    name: wrapPTYFailed
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapReservedEnv is the central ReservedEnv sentinel naming the Spec.Env key
      that belongs to the spawn protocol.
    name: wrapReservedEnv
    params: key string
    results: error
  - doc: |-
      wrapPIDFileRefused wraps the reason a PID file cannot be read safely onto
      the central PIDFileRefused sentinel.
    name: wrapPIDFileRefused
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapAdoptionRefused wraps the reason a process may not be adopted onto the
      central AdoptionRefused sentinel.
    name: wrapAdoptionRefused
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapStatusUnknown is the central StatusUnknown sentinel an attached
      process's Wait returns once it has ended.
    name: wrapStatusUnknown
    params: pid int
    results: error
  - doc: |-
      wrapInvalidSpec is the central InvalidSpec sentinel with fields naming the
      malformed part of the Spec.
    name: wrapInvalidSpec
    params: fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapSandboxFailed wraps the errno of a sandbox step that failed in the
      child onto the central SandboxFailed sentinel, naming the step.
    name: wrapSandboxFailed
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapSandboxUnavailable wraps the reason this kernel cannot apply a part of
      Spec.Sandbox onto the central SandboxUnavailable sentinel, naming it.
    name: wrapSandboxUnavailable
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      wrapUnsupportedPlatform is the central UnsupportedPlatform sentinel with
      fields naming what this platform lacks.
    name: wrapUnsupportedPlatform
    params: fields ...errs.FieldValue
    results: error
  - doc: |-
      leaderIsZombie answers false: only darwin refuses a group of zombies with
      EPERM, so no other kernel consults it — and getpgid(2) still finds a zombie
      on Linux, where reading it would call a dead leader alive. solaris, illumos
      and aix have no getpgid in the syscall package at all.
    name: leaderIsZombie
    params: _ int
    results: bool
imports:
  atomic: sync/atomic
  binary: encoding/binary
  bufio: bufio
  childwait: github.com/kitsunium/sdk/internal/service/proc/childwait
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  cmp: cmp
  context: context
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  fs: io/fs
  io: io
  math: math
  os: os
  osexec: os/exec
  rlim: github.com/kitsunium/sdk/internal/service/proc/internal/rlim
  runtime: runtime
  slices: slices
  strconv: strconv
  strings: strings
  sync: sync
  syscall: syscall
  time: time
  unsafe: unsafe
  user: os/user
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/exec
  name: exec
  purpose: "Package exec — Unix best-effort post-start attributes: scheduling priority (Nice), OOM-killer bias (OOMScoreAdj)."
types:
  - doc: "pidfdOpener is pidfd_open(2): a descriptor for pid, or the errno."
    kind: named
    name: pidfdOpener
    underlying: func(pid int, flags uintptr) (int, syscall.Errno)
  - doc: |-
      adopted is the handle Attach returns: a process this one did not spawn,
      held through a non-blocking pidfd registered with the runtime's poller, so
      its end is observed without a thread parked and without a poll loop.
      Nothing in it addresses the pid by number.
    fields:
      - doc: file is the pidfd; the runtime closes it once the handle is collected.
        name: file
        type: "*os.File"
      - doc: raw lends the pidfd for one call (Control) or waits on it (Read).
        name: raw
        type: syscall.RawConn
      - doc: done is closed once the process has ended.
        name: done
        type: chan struct{}
      - doc: "clk is what Stop's grace window runs on: clock.System from Attach."
        name: clk
        type: clock.Waiter
      - doc: watching starts the one goroutine that observes the end.
        name: watching
        type: sync.Once
      - name: pid
        type: int
    kind: struct
    methods:
      - doc: PID reports the process identifier the handle was attached from.
        name: PID
        recv: a *adopted
        results: int
      - doc: |-
          Wait returns once the process has ended, with StatusUnknown and an
          ExitValue whose Code is -1: its status is a parent's to read.
        name: Wait
        recv: a *adopted
        results: exit coreproc.ExitValue, err error
      - doc: |-
          WaitContext waits like Wait until the process ends or ctx is done; when ctx
          ends first it returns ctx's error, and a later wait still observes the end.
        name: WaitContext
        params: ctx context.Context
        recv: a *adopted
        results: exit coreproc.ExitValue, err error
      - doc: |-
          Signal delivers sig to the process held, never to one that reused its pid
          (deliver).
        name: Signal
        params: sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: |-
          SignalGroup delivers sig to the process alone: a group addressed by number
          is not race-free, and this handle holds no group.
        name: SignalGroup
        params: sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: |-
          Stop sends sig, waits for the end up to grace, then sends SIGKILL and waits
          until the end or ctx's. A process already gone is success at either phase.
        name: Stop
        params: ctx context.Context, grace time.Duration, sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: awaitGrace waits for the end up to grace on the handle's clock.
        name: awaitGrace
        params: ctx context.Context, grace time.Duration
        recv: a *adopted
        results: ended bool, err error
      - doc: signalAllowGone delivers sig and treats ESRCH as success.
        name: signalAllowGone
        params: sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: watch starts, once, the goroutine that closes done at the end.
        name: watch
        recv: a *adopted
      - doc: |-
          deliver is how Signal, SignalGroup and Stop reach the process: through the
          pidfd, never by number.
        name: deliver
        params: sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: |-
          SignalHandle delivers sig through the pidfd (pidfd_send_signal); once the
          process has ended it fails with SIGNAL_FAILED wrapping ESRCH.
        name: SignalHandle
        params: sig coreproc.Signal
        recv: a *adopted
        results: error
      - doc: |-
          Handle returns a duplicate of the pidfd, close-on-exec, owned by the caller.
          It shares the handle's open file, hence its O_NONBLOCK.
        name: Handle
        recv: a *adopted
        results: "*os.File, bool"
      - doc: |-
          startWatcher starts the goroutine that closes done once the process has
          ended, and returns once it runs.
        name: startWatcher
        recv: a *adopted
      - doc: exited reports, without waiting, whether the process has ended.
        name: exited
        recv: a *adopted
        results: bool
    name: adopted
  - doc: |-
      launch is what a prepared spawn hands os.StartProcess, and the sandbox
      payload the fork hands the child, released once the fork is done.
    fields:
      - name: path
        type: string
      - name: argv
        type: "[]string"
      - name: attr
        type: "*os.ProcAttr"
      - name: payload
        type: "*os.File"
    kind: struct
    methods:
      - doc: |-
          release closes the parent's copy of the sandbox payload, if any: the child
          holds its own from the fork on.
        name: release
        recv: l launch
    name: launch
  - doc: |-
      withHandler is what the pidfd helpers need of a process: the handle the
      runtime holds for it, lent for the length of one call (os.Process).
    kind: named
    name: withHandler
    underlying: |-
      interface {
      	// WithHandle calls f with the process's pidfd, valid until f returns.
      	WithHandle(f func(handle uintptr)) error
      }
  - doc: pollFd is struct pollfd from poll.h.
    fields:
      - name: fd
        type: int32
      - name: events
        type: int16
      - name: revents
        type: int16
    kind: struct
    name: pollFd
  - doc: |-
      handle is the live supervision handle for one spawned process. It owns the
      *os.Process and the claim on its exit status, remembers the leader pid and
      process-group id, and memoises the single Wait outcome so
      PID/Wait/Signal/SignalGroup/Stop satisfy the coreproc.Process port. It is
      safe for concurrent use.
    fields:
      - name: proc
        type: "*os.Process"
      - name: claim
        type: "*childwait.Claim"
      - name: pid
        type: int
      - name: pgid
        type: int
      - name: setpgid
        type: bool
      - name: stdio
        type: "*stdioState"
      - doc: |-
          procMu serialises the leader-only Signal against the release of proc
          after a reaper sweep took its status: os.Process.Release writes the Pid
          field that a pid-mode os.Process.Signal reads.
        name: procMu
        type: sync.RWMutex
      - name: waitOnce
        type: sync.Once
      - name: waitVal
        type: coreproc.ExitValue
      - name: waitErr
        type: error
      - name: done
        type: chan struct{}
      - doc: |-
          settled is closed once Wait has its whole outcome — the exit and the
          drained (or cut) capture — so WaitContext never returns before it.
        name: settled
        type: chan struct{}
      - doc: |-
          clk is what Stop's grace window and the SIGKILL resend interval are
          measured on: clock.System from newHandle, a ManualClock in a white-box
          test.
        name: clk
        type: clock.Waiter
      - doc: |-
          kill is the kill(2) SignalGroup sends through: syscall.Kill from
          newHandle, a double that drops a signal in a white-box test.
        name: kill
        type: func(pid int, sig syscall.Signal) error
    kind: struct
    methods:
      - doc: |-
          Handle returns a duplicate of the pidfd the runtime holds for the child
          (os.Process.WithHandle), close-on-exec, owned by the caller. It reports
          false once the child is reaped — the runtime has released its pidfd — and
          on a kernel that gave the runtime none (Linux < 5.4, or a filter).
        name: Handle
        recv: h *handle
        results: "*os.File, bool"
      - doc: |-
          SignalHandle delivers sig through the child's pidfd (pidfd_send_signal),
          never by pid: once the child is reaped it fails with SignalFailed wrapping
          ESRCH. A kernel that gave the runtime no pidfd is HandleUnavailable.
        name: SignalHandle
        params: sig coreproc.Signal
        recv: h *handle
        results: error
      - doc: |-
          groupTarget returns the kill(2) target for group-directed operations: the
          negated pgid when the child leads its own group (Setpgid), otherwise the leader
          pid. Without a private group, -pgid would address no group (ESRCH, silently
          swallowed) or, worse, the supervisor's own inherited group — so a non-grouped
          child is only ever signalled at its leader.
        name: groupTarget
        recv: h *handle
        results: int
      - doc: PID reports the leader process identifier.
        name: PID
        recv: h *handle
        results: int
      - doc: |-
          Wait blocks until the process exits and returns its ExitValue. It is
          idempotent: the first call collects the exit status and every caller observes
          the same memoised outcome. The status is the child's own even when a running
          reaper collected the child first (ADR 0093).
        name: Wait
        recv: h *handle
        results: exit coreproc.ExitValue, err error
      - doc: |-
          releaseProc frees the handle the runtime keeps for proc (a pidfd on Linux)
          once a reaper sweep took its status: proc's own Wait never completed, so
          nothing else would release it before a garbage collection. It excludes a
          concurrent leader-only Signal, which reads what Release writes.
        name: releaseProc
        recv: h *handle
      - doc: |-
          leaderReaped reports whether the leader's exit status has been collected —
          by Wait, or by a reaper sweep that handed it over. Its pid may by then belong
          to another process, so nothing may be sent to it by number.
        name: leaderReaped
        recv: h *handle
        results: bool
      - doc: |-
          WaitContext waits like Wait until the process exits or ctx is done. When
          ctx ends first it returns ctx's error and the child keeps running; a later
          Wait or WaitContext still reports the real exit.

          Goroutine lifecycle: it launches reapInBackground, which drives the
          once-only Wait and returns once the child is reaped and its capture drained
          — bounded by the drain grace — whether or not this call is still waiting.
        name: WaitContext
        params: ctx context.Context
        recv: h *handle
        results: exit coreproc.ExitValue, err error
      - doc: |-
          Signal delivers sig to the leader process only (kill(pid, sig)). A leader
          already reaped — by Wait or by a reaper sweep — is reported finished and
          never signalled by pid: that pid may by now be another process's.
        name: Signal
        params: sig coreproc.Signal
        recv: h *handle
        results: error
      - doc: |-
          SignalGroup delivers sig to the leader's entire process group via
          kill(-pgid, sig) when the child leads its own group (Spec.Setpgid), reaching
          forked grandchildren (the control-group analogue). Without a private group it
          degrades to the leader process alone, so it never signals the supervisor's
          inherited group — and once that leader is reaped it reports ESRCH rather
          than signal a pid another process may now hold. A group that holds nothing
          alive is reported ESRCH too on darwin, whose kill(2) answers it EPERM
          (zombieGroupRefused): the answer Linux and the BSDs give once the group is
          reaped, never a SIGNAL_FAILED a caller would read as a live process it may
          not signal.
        name: SignalGroup
        params: sig coreproc.Signal
        recv: h *handle
        results: error
      - doc: |-
          Stop terminates the process group gracefully: it signals the whole group with
          sig, waits up to grace for exit, then escalates to SIGKILL on the group —
          at once when grace is not positive. It returns nil once the group has
          exited, ctx's error if cancelled first, or StopFailed if the group survives
          the SIGKILL escalation. The escalation sends SIGKILL again every
          killResendInterval until the leader is reaped (killUntilReaped), so a
          SIGKILL the kernel discarded does not leave Stop waiting for ever.
        name: Stop
        params: ctx context.Context, grace time.Duration, sig coreproc.Signal
        recv: h *handle
        results: error
      - doc: |-
          killUntilReaped sends SIGKILL to the group and waits for the leader's reap,
          sending SIGKILL again every killResendInterval on the handle's clock until
          the reap or ctx ends the wait. It returns nil once the leader is reaped,
          ctx's error if cancelled first, or StopFailed if a SIGKILL cannot be
          delivered for a reason other than the group being gone.

          A single SIGKILL is not enough: NetBSD up to 10.1 discards a signal posted
          to a process still inside execve (PR kern/58091), and a child that Start
          has just returned may be there. A SIGKILL that landed kills the child
          within the first interval on every kernel, so the resend costs nothing
          where the signal is never lost. The first SIGKILL is sent even when the
          leader is already reaped — a private group can outlive its leader — but a
          resend is not: once the reap is in hand there is nothing left to wait for.

          Goroutine lifecycle: it launches reapInBackground, which returns once the
          leader is reaped; the resend is what guarantees that happens.
        name: killUntilReaped
        params: ctx context.Context
        recv: h *handle
        results: error
      - doc: |-
          awaitKill waits one killResendInterval, on the handle's clock, for the reap
          a SIGKILL should cause. over reports a terminal outcome — the leader reaped
          (err nil) or ctx cancelled (err is ctx's error); false means the interval
          closed with the leader unreaped, and the SIGKILL is due again. A reap that
          landed as the interval closed is terminal, so it costs no extra signal.
        name: awaitKill
        params: ctx context.Context
        recv: h *handle
        results: over bool, err error
      - doc: |-
          signalGroupAllowGone delivers sig to the group but treats an already-exited
          group as success, since a vanished target needs no further signal: ESRCH on
          every kernel — darwin's EPERM for a group holding nothing alive included,
          which SignalGroup reports as ESRCH (zombieGroupRefused).
        name: signalGroupAllowGone
        params: sig coreproc.Signal
        recv: h *handle
        results: error
      - doc: |-
          zombieGroupRefused reports whether err is darwin's answer for a process
          group none of whose members is alive. XNU's kill(-pgid) skips zombies and,
          finding no live member it may signal, answers EPERM (killpg1: "nfound" is
          0, so EPERM under POSIX semantics), where Linux and the BSDs count the
          zombie and report success. darwin's EPERM therefore means "nothing alive
          this process may signal": a group of zombies, or live members it may not
          signal — a leader that changed its credentials, a setuid program — and
          only the first is gone. It holds in two states:

            - the leader was unreaped when the signal left and is dead now: collected
              since (leaderReaped), or a zombie the kernel no longer lists
              (leaderIsZombie, darwin's own probe). A leader that died inside the
              grace window, before the reaper collected it, made Stop's escalation
              report SIGNAL_FAILED for a group that was already gone;
            - the leader was collected before the signal, and what is left are its
              orphans — dead, but zombies until init reaps them, since the leader
              that would have is gone. The group empties when init reaps them, so
              groupDrains watches it for a bounded time: ESRCH is gone, while a live
              member this process may not signal keeps it EPERM, and the refusal
              stands. Stop on a handle already waited, or an escalation that follows
              a leader the background reap had just collected, answered SIGNAL_FAILED
              for a dead group whenever the child had forked.

          It is false on every kernel but darwin (zombiesRefused).
        name: zombieGroupRefused
        params: err error, reapedBefore bool
        recv: h *handle
        results: bool
      - doc: |-
          groupDrains reports whether the private group empties within drainPolls
          polls drainPoll apart on the handle's clock: kill(-pgid, 0) answering
          ESRCH. Any other answer than EPERM — a live member it may signal after all —
          ends the watch: the group is not gone.
        name: groupDrains
        recv: h *handle
        results: bool
      - doc: |-
          awaitExit blocks until the process is reaped, ctx is cancelled, or the grace
          timer fires. settled reports whether a terminal outcome was reached; when
          false the caller must escalate. A non-positive grace closes the window at
          once.

          Goroutine lifecycle: it launches reapInBackground, which drives the once-only
          Wait and returns as soon as the reap completes (closing h.done). The goroutine
          cannot outlive the process: it blocks only inside os.Process.Wait, which
          returns when the child is reaped, so no leak survives this call.
        name: awaitExit
        params: ctx context.Context, grace time.Duration
        recv: h *handle
        results: settled bool, err error
      - doc: |-
          reapInBackground triggers the once-only Wait so Stop's select can observe
          h.done without leaking a blocked goroutine. Any reap error is intentionally
          not returned here: it is memoised in h.waitErr by Wait itself and surfaced to
          whoever calls h.Wait() directly, so this driver has nowhere to propagate it.
        name: reapInBackground
        recv: h *handle
      - doc: |-
          TTY returns the master side of the child's pseudo-terminal, which the caller
          owns and closes, or nil for a child started without StdioPTY.
        name: TTY
        recv: h *handle
        results: "*os.File"
      - doc: |-
          Resize sets the window size of the child's terminal; the kernel sends it
          SIGWINCH. A child without a terminal is PTY_FAILED.
        name: Resize
        params: rows, cols uint16
        recv: h *handle
        results: error
      - doc: Size reads the window size of the child's terminal (TIOCGWINSZ).
        name: Size
        recv: h *handle
        results: coreproc.PTYValue, error
    name: handle
  - doc: |-
      waiter is what collectExit needs from the process it reaps: its own wait,
      and nothing else. Production hands it an *os.Process; the narrower type is
      the statement that collecting an exit status neither signals nor releases
      the process — the caller decides that from the swept flag.
    kind: named
    name: waiter
    underlying: |-
      interface {
      	// Wait blocks until the process exits and returns its state.
      	Wait() (*os.ProcessState, error)
      }
  - doc: |-
      releaser is what an aborted spawn needs from the child it abandons: its own
      wait, to reap it, and the release of its handle when a sweep reaped it
      first. Production hands it an *os.Process.
    kind: named
    name: releaser
    underlying: |-
      interface {
      	waiter
      	// Release frees the process handle without waiting for the process.
      	Release() error
      }
  - doc: |-
      handshake is the parent side of the trampoline status pipe: the child inherits
      the write end as handshakeFD and reports a failure byte through it, while the
      parent reads the read end to learn the trampoline's outcome.
    fields:
      - doc: read is the parent's read end; EOF means the trampoline exec'd the target.
        name: read
        type: "*os.File"
      - doc: write is the child's inherited write end, handed to os.StartProcess.
        name: write
        type: "*os.File"
    kind: struct
    methods:
      - doc: childFile returns the write end to hand to os.StartProcess as handshakeFD.
        name: childFile
        recv: h *handshake
        results: "*os.File"
      - doc: |-
          await closes the parent's write end and reads the trampoline's outcome: a nil
          return on an empty read (EOF) means the execve succeeded and the target is
          running; any bytes return the matching typed sentinel, and the caller must reap
          the exited child.
        name: await
        recv: h *handshake
        results: error
      - doc: closeBoth releases both pipe ends when the spawn aborts before await runs.
        name: closeBoth
        recv: h *handshake
    name: handshake
  - doc: |-
      foreign is the handle Open returns on Linux: a process this one did not
      spawn, held through the pidfd os.FindProcess opened (pidfd_open). Nothing in
      it addresses the pid by number, so a pid reused after the process exits is
      never reached. The runtime closes the pidfd when the handle is collected.
    fields:
      - name: proc
        type: "*os.Process"
      - name: pid
        type: int
      - doc: "clk is what Stop's grace window runs on: clock.System from Open."
        name: clk
        type: clock.Waiter
    kind: struct
    methods:
      - doc: PID reports the process identifier given to Open.
        name: PID
        recv: f *foreign
        results: int
      - doc: "Wait is refused: only a parent collects an exit status."
        name: Wait
        recv: f *foreign
        results: exit coreproc.ExitValue, err error
      - doc: WaitContext is refused like Wait.
        name: WaitContext
        params: _ context.Context
        recv: f *foreign
        results: exit coreproc.ExitValue, err error
      - doc: Signal delivers sig through the pidfd.
        name: Signal
        params: sig coreproc.Signal
        recv: f *foreign
        results: error
      - doc: |-
          SignalGroup delivers sig to the process alone: a group addressed by number
          is not race-free, and this handle holds no group.
        name: SignalGroup
        params: sig coreproc.Signal
        recv: f *foreign
        results: error
      - doc: |-
          SignalHandle delivers sig through the pidfd (pidfd_send_signal); once the
          process has exited it fails with SIGNAL_FAILED wrapping ESRCH.
        name: SignalHandle
        params: sig coreproc.Signal
        recv: f *foreign
        results: error
      - doc: Handle returns a duplicate of the pidfd, owned by the caller.
        name: Handle
        recv: f *foreign
        results: "*os.File, bool"
      - doc: |-
          Stop sends sig through the pidfd, watches the pidfd for the exit up to
          grace, then sends SIGKILL and watches until the exit or ctx's end. A process
          already gone is success at either phase.
        name: Stop
        params: ctx context.Context, grace time.Duration, sig coreproc.Signal
        recv: f *foreign
        results: error
      - doc: signalAllowGone signals through the pidfd and treats ESRCH as success.
        name: signalAllowGone
        params: sig coreproc.Signal
        recv: f *foreign
        results: error
      - doc: |-
          awaitExit polls the pidfd one slice at a time until it reports the exit,
          ctx ends, or deadline (nil: none) fires. exited reports the first.
        name: awaitExit
        params: ctx context.Context, deadline <-chan time.Time
        recv: f *foreign
        results: exited bool, err error
    name: foreign
  - doc: |-
      entryStat is what the walk reads of an entry's stat: the identity a descent
      is proven against, the owner and the mode its trust is judged on. Each
      platform's directory holder (heldDir) fills it from its own syscall.Stat_t,
      whose field types differ from one kernel to the next.
    fields:
      - doc: dev and ino name the inode.
        name: dev
        type: uint64
      - doc: dev and ino name the inode.
        name: ino
        type: uint64
      - doc: uid is the owner.
        name: uid
        type: uint32
      - doc: "mode is st_mode: the type bits and the permissions."
        name: mode
        type: uint32
    kind: struct
    name: entryStat
  - doc: |-
      pidWalk walks a PID file's path from the root one component at a time, each
      directory held open (heldDir) so a rename cannot move the walk elsewhere, and
      records whether anyone but root and this process's user could have made what
      it went through.
    fields:
      - doc: dirs are the directories descended into, the root first; ".." pops.
        name: dirs
        type: "[]heldDir"
      - doc: stats are dirs' stats, index for index.
        name: stats
        type: "[]entryStat"
      - doc: euid is this process's effective user.
        name: euid
        type: int
      - doc: links counts the symbolic links followed.
        name: links
        type: int
      - doc: trusted stays true while every step was made by root or euid.
        name: trusted
        type: bool
    kind: struct
    methods:
      - doc: |-
          walk takes the components todo, every one but the last a step, the last
          the file; path names the PID file in errors.
        name: walk
        params: todo []string, path string
        recv: w *pidWalk
        results: f *os.File, trusted bool, err error
      - doc: close releases every directory the walk holds.
        name: close
        recv: w *pidWalk
      - doc: top is the directory the walk stands in, and its stat.
        name: top
        recv: w *pidWalk
        results: heldDir, entryStat
      - doc: |-
          step takes one component that is not the last: "." stays, ".." climbs, a
          directory is descended into, a symbolic link is read and returned. Every
          step updates the walk's trust.
        name: step
        params: name string
        recv: w *pidWalk
        results: target string, isLink bool, err error
      - doc: |-
          descend opens the directory name — the entry whose stat is want — and makes
          it the walk's position. A directory renamed between the stat and the open
          is refused.
        name: descend
        params: name string, want entryStat
        recv: w *pidWalk
        results: error
      - doc: up climbs one directory; the root's parent is the root.
        name: up
        recv: w *pidWalk
      - doc: |-
          follow continues the walk at a link's target: an absolute target restarts
          at the walk's root, a relative one where the link lies.
        name: follow
        params: target string, rest []string
        recv: w *pidWalk
        results: "[]string"
      - doc: |-
          open opens the walk's last component as the file. The entry is first held
          and examined without following a symbolic link (heldDir.entry), so a link
          at the end, a FIFO or a device is refused by its type before anything reads
          it; only a regular file is then read, through a read proven to reach the
          inode examined (heldEntry.read).
        name: open
        params: name, path string
        recv: w *pidWalk
        results: "*os.File, bool, error"
    name: pidWalk
  - doc: |-
      heldDir is one directory a PID-file walk stands in, held O_PATH: its
      entries are examined through /proc/self/fd/<fd>/<name>, so resolution starts
      at the directory held, never at a path a rename could move.
    fields:
      - doc: fd is the O_PATH descriptor.
        name: fd
        type: int
    kind: struct
    methods:
      - doc: lstat examines the entry name of d without following a link.
        name: lstat
        params: name string
        recv: d heldDir
        results: entryStat, error
      - doc: readlink reads the symbolic link name of d.
        name: readlink
        params: name string
        recv: d heldDir
        results: string, error
      - doc: |-
          openDir holds the directory name of d, O_PATH and without following a link
          — one swapped in since the examination is refused by the kernel.
        name: openDir
        params: name string
        recv: d heldDir
        results: heldDir, entryStat, error
      - doc: |-
          entry holds the last component name of d as a position (O_PATH,
          O_NOFOLLOW): a link at the end, a FIFO or a device is examined without
          being opened at all.
        name: entry
        params: name string
        recv: d heldDir
        results: e heldEntry, st entryStat, why string, err error
      - doc: close releases the held directory.
        name: close
        recv: d heldDir
    name: heldDir
  - doc: |-
      heldEntry is the walk's last component held O_PATH|O_NOFOLLOW: examined by
      fstat before anything is opened for reading.
    fields:
      - doc: fd is the O_PATH descriptor; the entry itself when it is a link.
        name: fd
        type: int
    kind: struct
    methods:
      - doc: |-
          read reopens the held entry for reading through its position, which
          reaches the very inode examined; path names the file.
        name: read
        params: path string
        recv: e heldEntry
        results: f *os.File, why string, err error
      - doc: close releases the held entry.
        name: close
        recv: e heldEntry
    name: heldEntry
  - doc: winsize is struct winsize from sys/ttycom.h and asm-generic/termios.h.
    fields:
      - name: rows
        type: uint16
      - name: cols
        type: uint16
      - name: xpixel
        type: uint16
      - name: ypixel
        type: uint16
    kind: struct
    name: winsize
  - doc: |-
      headBuffer is a capture sink that keeps the first limit bytes written to it
      and accepts, then discards, the rest: the copier keeps draining the pipe, so
      the child never blocks, and the memory held never exceeds limit.
    fields:
      - name: mu
        type: sync.Mutex
      - name: limit
        type: int
      - name: buf
        type: "[]byte"
      - name: over
        type: bool
    kind: struct
    methods:
      - doc: Write keeps what fits under the limit and reports every byte as written.
        name: Write
        params: p []byte
        recv: b *headBuffer
        results: int, error
      - doc: |-
          grow makes room for n more bytes by doubling, capped at the limit, so the
          buffer's allocations total at most twice the limit — append's own growth,
          a quarter at a time for a large slice, allocates five times what it keeps.
        name: grow
        params: n int
        recv: b *headBuffer
      - doc: bytes returns what was kept.
        name: bytes
        recv: b *headBuffer
        results: "[]byte"
      - doc: truncated reports whether more than limit bytes were written.
        name: truncated
        recv: b *headBuffer
        results: bool
    name: headBuffer
  - doc: |-
      sandboxHost is what a sandboxed spawn reads of this kernel, and the two
      hooks the package's tests drive the second stage with. Production uses
      hostKernel; a test swaps it through sandboxHostOverride.
    fields:
      - name: procSelfExe
        type: string
      - name: nsDir
        type: string
      - name: capLastCap
        type: string
      - name: landlockABI
        type: func() (int, syscall.Errno)
      - name: seccomp
        type: func() syscall.Errno
      - name: mountSetattr
        type: func() syscall.Errno
      - name: failStep
        type: uint8
      - name: traceFD
        type: int32
    kind: struct
    name: sandboxHost
  - doc: sandboxMount is one MountValue as the child applies it.
    fields:
      - name: kind
        type: uint8
      - name: readOnly
        type: bool
      - name: source
        type: string
      - name: target
        type: string
    kind: struct
    name: sandboxMount
  - doc: |-
      sandboxIdentity is the credential the child takes itself (Spec.User, Group,
      Groups resolved by the parent). setGroups is false in a user namespace the
      spawn created, where setgroups(2) is denied and the groups stay as they are.
    fields:
      - name: uid
        type: uint32
      - name: gid
        type: uint32
      - name: setGroups
        type: bool
      - name: groups
        type: "[]uint32"
    kind: struct
    name: sandboxIdentity
  - doc: |-
      sandboxCaps is CapabilitiesValue with the highest capability the kernel
      knows (/proc/sys/kernel/cap_last_cap), read by the parent.
    fields:
      - name: bounding
        type: uint64
      - name: ambient
        type: uint64
      - name: secureBits
        type: uint32
      - name: lastCap
        type: uint32
    kind: struct
    name: sandboxCaps
  - doc: sandboxRule is one Landlock rule with its rights trimmed to the kernel's ABI.
    fields:
      - name: access
        type: uint64
      - name: path
        type: string
    kind: struct
    name: sandboxRule
  - doc: sockFilter is struct sock_filter, one classic BPF instruction.
    fields:
      - name: code
        type: uint16
      - name: jt
        type: uint8
      - name: jf
        type: uint8
      - name: k
        type: uint32
    kind: struct
    name: sockFilter
  - doc: sandboxPayload is everything the second stage applies, in its order.
    fields:
      - doc: |-
          cgroupNS asks the stage to unshare a cgroup namespace (NamespaceCgroup),
          which the clone does not: the child must be in its group first.
        name: cgroupNS
        type: bool
      - name: mounts
        type: "[]sandboxMount"
      - name: root
        type: string
      - doc: dir is Spec.Dir, entered inside root after the pivot; unused without one.
        name: dir
        type: string
      - name: identity
        type: "*sandboxIdentity"
      - name: caps
        type: "*sandboxCaps"
      - name: noNewPrivs
        type: bool
      - doc: handled is the Landlock rights restricted; zero means no Landlock.
        name: handled
        type: uint64
      - name: rules
        type: "[]sandboxRule"
      - doc: filter is the assembled seccomp program; empty means no filter.
        name: filter
        type: "[]sockFilter"
      - name: pdeathsig
        type: uint32
      - doc: |-
          parentPID is the supervisor's pid, checked after the parent-death signal
          is armed again; zero (a child in its own PID namespace) checks nothing.
        name: parentPID
        type: uint32
      - doc: |-
          failStep and traceFD serve the package's tests alone: the step failed by
          injection (zero none) and the descriptor each step records itself on.
        name: failStep
        type: uint8
      - name: traceFD
        type: int32
    kind: struct
    name: sandboxPayload
  - doc: payloadWriter appends the payload's fields little-endian.
    fields:
      - name: buf
        type: "[]byte"
    kind: struct
    methods:
      - doc: u8 appends one byte.
        name: u8
        params: v uint8
        recv: w *payloadWriter
      - doc: u32 appends a 32-bit word.
        name: u32
        params: v uint32
        recv: w *payloadWriter
      - doc: u64 appends a 64-bit word.
        name: u64
        params: v uint64
        recv: w *payloadWriter
      - doc: flag appends a boolean as one byte.
        name: flag
        params: v bool
        recv: w *payloadWriter
      - doc: str appends a length-prefixed string.
        name: str
        params: s string
        recv: w *payloadWriter
    name: payloadWriter
  - doc: payloadReader reads the payload's fields, refusing any read past its end.
    fields:
      - name: buf
        type: "[]byte"
      - name: bad
        type: bool
    kind: struct
    methods:
      - doc: take returns the next n bytes, or nil once the payload is short.
        name: take
        params: n int
        recv: r *payloadReader
        results: "[]byte"
      - doc: u8 reads one byte.
        name: u8
        recv: r *payloadReader
        results: uint8
      - doc: u16 reads a 16-bit word.
        name: u16
        recv: r *payloadReader
        results: uint16
      - doc: u32 reads a 32-bit word.
        name: u32
        recv: r *payloadReader
        results: uint32
      - doc: u64 reads a 64-bit word.
        name: u64
        recv: r *payloadReader
        results: uint64
      - doc: flag reads a boolean byte, refusing any value but 0 and 1.
        name: flag
        recv: r *payloadReader
        results: bool
      - doc: count reads a count and refuses one past limit.
        name: count
        params: limit int
        recv: r *payloadReader
        results: int
      - doc: str reads a length-prefixed string without NUL, at most sandboxMaxString long.
        name: str
        recv: r *payloadReader
        results: string
    name: payloadReader
  - doc: capHeader is struct __user_cap_header_struct.
    fields:
      - name: version
        type: uint32
      - name: pid
        type: int32
    kind: struct
    name: capHeader
  - doc: capData is struct __user_cap_data_struct, two of which hold 64 capabilities.
    fields:
      - name: effective
        type: uint32
      - name: permitted
        type: uint32
      - name: inheritable
        type: uint32
    kind: struct
    name: capData
  - doc: mountAttr is struct mount_attr, MOUNT_ATTR_SIZE_VER0 long.
    fields:
      - name: attrSet
        type: uint64
      - name: attrClr
        type: uint64
      - name: propagation
        type: uint64
      - name: usernsFD
        type: uint64
    kind: struct
    name: mountAttr
  - doc: |-
      landlockPathBeneath is struct landlock_path_beneath_attr: packed in C, 12
      bytes, which this layout's first 12 bytes are.
    fields:
      - name: allowedAccess
        type: uint64
      - name: parentFD
        type: int32
    kind: struct
    name: landlockPathBeneath
  - doc: sockFprog is struct sock_fprog.
    fields:
      - name: length
        type: uint16
      - name: filter
        type: "*sockFilter"
    kind: struct
    name: sockFprog
  - doc: |-
      sandboxStage is the second stage of a sandboxed spawn: the payload, the
      handshake descriptor its failures are reported on, the Landlock ruleset
      between its two steps, and the target's argv and environment, converted
      before the filter so nothing is allocated after it.
    fields:
      - name: p
        type: "*sandboxPayload"
      - name: hsfd
        type: int
      - name: ruleset
        type: int
      - name: argv0
        type: "*byte"
      - name: argv
        type: "[]*byte"
      - name: envv
        type: "[]*byte"
    kind: struct
    methods:
      - doc: prepareExec converts the target's path, argv and environment.
        name: prepareExec
        params: target string, args, env []string
        recv: st *sandboxStage
        results: error
      - doc: run traces step, fails it when a test injects a failure there, and runs it.
        name: run
        params: step uint8, fn func(*sandboxStage) syscall.Errno
        recv: st *sandboxStage
      - doc: trace records step and the thread running it on the tests' trace descriptor.
        name: trace
        params: step uint8
        recv: st *sandboxStage
      - doc: |-
          cgroupNamespace unshares a cgroup namespace on this thread, the one that
          execs the target, when the sandbox asks for one. The child is already in
          its group — the clone placed it, or the trampoline wrote its PID — so the
          namespace is rooted there, and the target sees that group as its root on
          either path; the stage still holds the capabilities unshare needs.
        name: cgroupNamespace
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: mount makes each mount in order.
        name: mount
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          pivot moves the child into its root: the root bound onto itself so it is a
          mount point, pivot_root(".", ".") stacking the old root under the new one,
          the old root detached, then the working directory entered inside.
        name: pivot
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          landlockPaths creates the ruleset and adds each rule, its path opened
          O_PATH while the stage still holds its privileges and after its mounts and
          pivot, so the rules name what the child will see.
        name: landlockPaths
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          bounding drops from the bounding set every capability the kernel knows that
          is present and not kept.
        name: bounding
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: secureBits sets the securebits asked.
        name: secureBits
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          identity takes the credential the spec names, on this thread alone — the
          thread that execs —, keeping the permitted set when ambient capabilities are
          to be raised, then arms the parent-death signal again, which the kernel
          clears when the effective ids change.
        name: identity
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          rearmDeathSignal sets the parent-death signal again and, outside a PID
          namespace, checks the supervisor did not die before it was set.
        name: rearmDeathSignal
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          capabilities sets the thread's sets — permitted and effective cut to the
          bounding set, inheritable to the ambient one — then clears the ambient set
          and raises each capability asked.
        name: capabilities
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          sweep marks close-on-exec every descriptor past the handshake pipe — the
          target keeps its stdio and ExtraFiles, below it — with one
          close_range(CLOSE_RANGE_CLOEXEC), or the walk of /proc/self/fd before Linux
          5.11.
        name: sweep
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: noNewPrivs sets no_new_privs, which Landlock and seccomp require.
        name: noNewPrivs
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: landlock restricts this thread — and the target it execs — to the ruleset.
        name: landlock
        recv: st *sandboxStage
        results: syscall.Errno
      - doc: |-
          filterAndExec installs the seccomp filter, if any, and execs the target in
          the next system call: nothing is allocated between the two. A filter the
          kernel refuses is the seccomp step's failure; an execve that fails is
          reported as an exec failure through the write the filter lets through, and
          the stage exits with the call the filter lets through.
        name: filterAndExec
        recv: st *sandboxStage
    name: sandboxStage
  - doc: "schedParam is struct sched_param: one int, the static priority."
    fields:
      - name: priority
        type: int32
    kind: struct
    name: schedParam
  - doc: |-
      stdioState carries the child's three standard-stream files and the parent-side
      machinery to manage them across the spawn. It is built before os.StartProcess,
      closed via closeAll on a spawn failure, or driven by afterStart on success;
      Handle.Wait joins its output copiers so every byte is delivered before Wait
      returns. outSrc/outSink are parallel: outSrc[i] drains into outSink[i].
    fields:
      - name: files
        type: "[stdioFdCount]*os.File"
      - name: opened
        type: "[]*os.File"
      - name: closeChild
        type: "[]*os.File"
      - name: outSrc
        type: "[]*os.File"
      - name: outSink
        type: "[]io.Writer"
      - name: outNames
        type: "[]string"
      - name: inDst
        type: "*os.File"
      - name: inSrc
        type: io.Reader
      - name: drainGrace
        type: time.Duration
      - name: drainClk
        type: clock.Waiter
      - name: ptyMaster
        type: "*os.File"
      - name: wg
        type: sync.WaitGroup
      - name: copyMu
        type: sync.RWMutex
      - name: copyErr
        type: error
      - name: held
        type: "[]string"
      - name: cut
        type: atomic.Bool
      - name: inLive
        type: atomic.Bool
      - name: delivered
        type: atomic.Int64
    kind: struct
    methods:
      - doc: recordCopyErr latches the first output-copier failure so Wait can surface it.
        name: recordCopyErr
        params: err error
        recv: s *stdioState
      - doc: |-
          copyError returns the latched first output-copier failure, or nil when capture
          delivered cleanly. Read it after wait() has joined the copiers.
        name: copyError
        recv: s *stdioState
        results: error
      - doc: |-
          build wires stdin from in, stdout to out, and stderr to errw. A nil stream
          falls back to the null device (StdioNull passes all-nil; StdioCapture passes
          the caller's values, nil meaning "discard this one stream").
        name: build
        params: in io.Reader, out, errw io.Writer
        recv: s *stdioState
        results: error
      - doc: |-
          wireInput connects the child's fd 0. A nil reader gives an immediate-EOF stdin
          from the null device; otherwise a pipe feeds reader→child, closed at EOF by a
          fire-and-forget copier that never blocks Wait.
        name: wireInput
        params: reader io.Reader
        recv: s *stdioState
        results: error
      - doc: |-
          wireOutput connects the child's fd idx (1=stdout, 2=stderr). A nil writer
          discards to the null device; otherwise a pipe drains child→writer via a copier
          joined by wait(), so every byte lands before Wait returns.
        name: wireOutput
        params: idx int, w io.Writer
        recv: s *stdioState
        results: error
      - doc: |-
          wireNull points the child's fd idx at the shared null device, read-write so
          it serves stdin and the outputs alike. It is on no cleanup list: the child
          gets its own copy through dup2, and closing the parent's would take it from
          every later spawn.
        name: wireNull
        params: idx int
        recv: s *stdioState
        results: error
      - doc: |-
          afterStart runs once os.StartProcess has succeeded: the child holds its own dup
          of every fd, so the parent closes its child-side copies (making EOF propagate
          on child exit) and launches the copiers. Output copiers are tracked by the
          WaitGroup; the stdin feeder is fire-and-forget so a non-EOF reader never blocks
          Wait.
        name: afterStart
        recv: s *stdioState
      - doc: |-
          drainOutput copies the pipe read end src into sink until EOF, then releases src
          and signals the WaitGroup. A writer failure is latched (recordCopyErr) so Wait
          can surface it as StdioCaptureFailed — output is not silently truncated.
        name: drainOutput
        params: src io.ReadCloser, sink io.Writer
        recv: s *stdioState
      - doc: recordHeld notes the stream of src as one the drain cut found still open.
        name: recordHeld
        params: src io.ReadCloser
        recv: s *stdioState
      - doc: |-
          feedInput copies the caller's reader src into the pipe write end dst, then
          closes dst so the child's stdin sees EOF. It is fire-and-forget: never joined,
          so a reader that does not EOF cannot block Wait.
        name: feedInput
        params: dst io.WriteCloser, src io.Reader
        recv: s *stdioState
      - doc: |-
          drainBounded joins the output copiers once the exit status is in hand,
          within s.drainGrace on s.drainClk (#1088): the zero grace is defaultDrainGrace, a
          negative one joins without a bound, as Wait always did. A copier blocks
          until every holder of its pipe's write end is gone, and a process the child
          left behind — a daemon, `sleep 60 &` — holds it past the child's exit. When
          the grace closes first, the parent's read ends and stdin write end are
          closed, so each copier returns at once (the pipes are pollable, and Windows
          cancels a pipe's pending read on close), and cut reports it. held names the
          streams that were still open; delivered counts the bytes the copiers handed
          to the caller's writers.

          Goroutine lifecycle: it launches one joiner, which returns once every copier
          has — at EOF, or at once after the cut — so none outlives the call.
        name: drainBounded
        recv: s *stdioState
        results: cut bool, held []string, delivered int64
      - doc: |-
          cutDrain closes the parent's pipe ends after the drain grace closed and
          waits for the copiers, which return at once; see drainBounded.
        name: cutDrain
        params: joined <-chan struct{}
        recv: s *stdioState
        results: cut bool, held []string, delivered int64
      - doc: |-
          closeAll releases every fd buildStdio opened. It is used only on the spawn
          failure path (before afterStart), so it never races the copiers and never
          touches os.Std*.
        name: closeAll
        recv: s *stdioState
    name: stdioState
vars:
  - grouped: true
    items:
      - doc: |-
          cloneIntoCgroupProbe reports, once per process, whether this kernel can
          clone a child straight into a cgroup — a variable so a test can answer
          for a kernel it does not run on.
        name: cloneIntoCgroupProbe
        value: sync.OnceValue(kernelClonesIntoCgroup)
      - doc: |-
          cloneIntoCgroupRefused records that a clone into a group answered ENOSYS
          — a seccomp filter that blocks clone3 on a new kernel — so every later
          spawn places its child through the trampoline.
        name: cloneIntoCgroupRefused
        type: atomic.Bool
    name: cloneIntoCgroupProbe
  - doc: |-
      resourceLimits maps each coreproc.Resource to its platform RLIMIT_* constant,
      backing the spec validation. It is a flat lookup so checking a requested
      resource stays O(1) rather than a high-complexity switch.
    items:
      - name: resourceLimits
        value: buildResourceLimits()
    name: resourceLimits
  - grouped: true
    items:
      - doc: |-
          landlockRights are the Landlock rights by the ABI that introduced them:
          ABI 1 has the first thirteen, 2 adds REFER, 3 TRUNCATE, 5 IOCTL_DEV.
        name: landlockRights
        value: |-
          [...]struct {
          		right coreproc.LandlockAccess
          		abi   int
          		name  string
          	}{
          		{coreproc.LandlockExecute, 1, "execute"},
          		{coreproc.LandlockWriteFile, 1, "write_file"},
          		{coreproc.LandlockReadFile, 1, "read_file"},
          		{coreproc.LandlockReadDir, 1, "read_dir"},
          		{coreproc.LandlockRemoveDir, 1, "remove_dir"},
          		{coreproc.LandlockRemoveFile, 1, "remove_file"},
          		{coreproc.LandlockMakeChar, 1, "make_char"},
          		{coreproc.LandlockMakeDir, 1, "make_dir"},
          		{coreproc.LandlockMakeReg, 1, "make_reg"},
          		{coreproc.LandlockMakeSock, 1, "make_sock"},
          		{coreproc.LandlockMakeFifo, 1, "make_fifo"},
          		{coreproc.LandlockMakeBlock, 1, "make_block"},
          		{coreproc.LandlockMakeSym, 1, "make_sym"},
          		{coreproc.LandlockRefer, 2, "refer"},
          		{coreproc.LandlockTruncate, 3, "truncate"},
          		{coreproc.LandlockIoctlDev, 5, "ioctl_dev"},
          	}
      - doc: |-
          sandboxNamespaces maps each Namespace to its clone flag and its name
          under /proc/self/ns.
        name: sandboxNamespaces
        value: |-
          [...]struct {
          		ns   coreproc.Namespace
          		flag uintptr
          		name string
          	}{
          		{coreproc.NamespaceUser, syscall.CLONE_NEWUSER, "user"},
          		{coreproc.NamespacePID, syscall.CLONE_NEWPID, "pid"},
          		{coreproc.NamespaceMount, syscall.CLONE_NEWNS, "mnt"},
          		{coreproc.NamespaceIPC, syscall.CLONE_NEWIPC, "ipc"},
          		{coreproc.NamespaceUTS, syscall.CLONE_NEWUTS, "uts"},
          		{coreproc.NamespaceNet, syscall.CLONE_NEWNET, "net"},
          		{coreproc.NamespaceCgroup, syscall.CLONE_NEWCGROUP, "cgroup"},
          		{coreproc.NamespaceTime, cloneNewTime, "time"},
          	}
      - doc: hostKernel is the running kernel, as production reads it.
        name: hostKernel
        value: |-
          sandboxHost{
          		procSelfExe:  procSelfExe,
          		nsDir:        procNSDir,
          		capLastCap:   procCapLastCap,
          		landlockABI:  landlockABIProbe,
          		seccomp:      seccompAvailable,
          		mountSetattr: mountSetattrProbe,
          		traceFD:      sandboxNoTrace,
          	}
      - doc: |-
          sandboxHostOverride, when set, replaces hostKernel: the tests' simulated
          kernels, injected failures and trace. Never set outside a test.
        name: sandboxHostOverride
        type: atomic.Pointer[sandboxHost]
    name: landlockRights
  - grouped: true
    items:
      - doc: |-
          seccompFloor are the calls every filter lets through: the stage's own
          execve, its exit should that fail, and the return from a signal the
          runtime may take between the filter and the execve.
        name: seccompFloor
        value: "[...]string{\"execve\", \"exit\", \"exit_group\", \"rt_sigreturn\"}"
      - doc: |-
          syscallNumbers is this architecture's table by name, parsed from
          syscallTable the first time a filter needs it.
        name: syscallNumbers
        value: sync.OnceValue(func() map[string]uint32 { return parseSyscallTable(syscallTable) })
      - doc: foreignSyscalls is the other architecture's names this one lacks.
        name: foreignSyscalls
        value: sync.OnceValue(func() []string { return strings.Fields(foreignTable) })
    name: seccompFloor
  - doc: |-
      sandboxStepNames names each step in a SandboxFailed error's step field,
      indexed by its number.
    items:
      - name: sandboxStepNames
        value: |-
          [...]string{
          	stepPayload:         "payload",
          	stepCgroupNamespace: "cgroup_namespace",
          	stepMounts:          "mounts",
          	stepRoot:            "pivot_root",
          	stepLandlockPaths:   "landlock_paths",
          	stepBounding:        "capbset_drop",
          	stepSecureBits:      "securebits",
          	stepIdentity:        "identity",
          	stepCapabilities:    "capabilities",
          	stepFDSweep:         "cloexec_sweep",
          	stepNoNewPrivs:      "no_new_privs",
          	stepLandlock:        "landlock_restrict_self",
          	stepSeccomp:         "seccomp",
          }
    name: sandboxStepNames
  - doc: |-
      closeRangeAbsent records that this kernel refused close_range with
      CLOSE_RANGE_CLOEXEC, so every later seal walks the descriptor directory.
    items:
      - name: closeRangeAbsent
        type: atomic.Bool
    name: closeRangeAbsent
  - doc: |-
      sharedNull is the null device every null stream of every spawn uses (#943):
      opened once, read-write and close-on-exec, never closed. sharedNullMu
      serialises the first open; later spawns read the pointer alone.
    grouped: true
    items:
      - name: sharedNull
        type: atomic.Pointer[os.File]
      - name: sharedNullMu
        type: sync.Mutex
    name: sharedNull
  - grouped: true
    items:
      - doc: |-
          reservedEnvKeys is every variable of the spawn protocol, listed once: the
          trampoline strips them before the target runs, Start refuses a Spec.Env
          naming any key with their prefix (reservedEnvPrefix), and
          TestReservedEnvKeysListed fails when a constant carrying the prefix is
          declared without being listed here.
        name: reservedEnvKeys
        value: "[...]string{trampolineEnv, trampolineCgroupEnv, trampolineHsFdEnv, trampolinePIDEnv, trampolineSandboxEnv}"
      - doc: |-
          The blank-var initialiser fires the pre-main trampoline check via
          package-level variable initialisation — the no-init idiom
          (KTN-FUNC-NOINIT). In any process that links this package the initialiser
          runs before main, exactly as an init() would but without an init()
          function: installTrampoline is a no-op unless the sentinel env var is set
          (only the trampoline child sees it), in which case the process applies the
          limits and execve()s the real target — never returning.
        name: _
        value: installTrampoline()
    name: reservedEnvKeys
