# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      prioProcess is the PRIO_PROCESS "which" selector for setpriority(2); it is not
      exported by package syscall on every Unix, so it is named here as the portable
      POSIX constant value 0.
    items:
      - name: prioProcess
        type: int
        value: "0"
    name: prioProcess
  - doc: |-
      cgroupProcsFile is the cgroup v2 control file that attaches a process to the
      group when its pid is written (one pid per write).
    items:
      - name: cgroupProcsFile
        type: string
        value: "\"cgroup.procs\""
    name: cgroupProcsFile
  - doc: |-
      cgroup2SuperMagic is the statfs f_type of the unified cgroup v2 filesystem
      (CGROUP2_SUPER_MAGIC, the ASCII "cgrp"). Typed uint64 and compared against
      uint64(st.Type) so the arch-dependent Statfs_t.Type field (int64 on amd64/arm64,
      int32 on 386/arm) widens cleanly — the conversion is real on every GOARCH (the
      source is signed, the target unsigned), so it is never a redundant cast.
    items:
      - name: cgroup2SuperMagic
        type: uint64
        value: "0x63677270"
    name: cgroup2SuperMagic
  - doc: |-
      cgroupProcsPerm is the perm passed to os.WriteFile; cgroup.procs always exists
      so the mode is never used to create it — it mirrors the cgroup package's
      controllerPerm for consistency.
    items:
      - name: cgroupProcsPerm
        type: os.FileMode
        value: "0o755"
    name: cgroupProcsPerm
  - doc: |-
      idBase / idBits are the strconv.ParseUint base and bit-size for parsing the
      32-bit decimal uid/gid strings os/user returns.
    grouped: true
    items:
      - name: idBase
        type: int
        value: "10"
      - name: idBits
        type: int
        value: "32"
    name: idBase
  - doc: |-
      signalledCode is the ExitValue.Code reported for a signalled (non-normal)
      termination; the port reserves -1 for "died by signal, no status".
    items:
      - name: signalledCode
        type: int
        value: "-1"
    name: signalledCode
  - doc: |-
      killResendInterval is how long a SIGKILL escalation waits for the reap
      before it sends SIGKILL again. NetBSD up to 10.1 discards a signal posted to
      a process still inside execve (PR kern/58091, fixed in 10.2 and 11.0), and
      Start returns from inside the child's execve, so the first SIGKILL sent to a
      child just started can be lost; a single SIGKILL followed by an unbounded
      wait then never ends. A SIGKILL that landed kills at once, so on every other
      kernel the reap comes first and nothing is ever resent.
    items:
      - name: killResendInterval
        type: time.Duration
        value: 100 * time.Millisecond
    name: killResendInterval
  - doc: |-
      drainPoll and drainPolls bound how long SignalGroup watches a group that
      darwin refused with EPERM after its leader was reaped (groupDrains): a
      group of zombies empties as soon as init reaps them, which launchd does
      within milliseconds, while a live member this process may not signal stays.
    grouped: true
    items:
      - name: drainPoll
        type: time.Duration
        value: 10 * time.Millisecond
      - name: drainPolls
        type: int
        value: "100"
    name: drainPoll
  - doc: |-
      defaultHandshakeFD is the fallback descriptor for the trampoline status pipe
      when no fd number was passed (a spawn with no ExtraFiles): the pipe follows the
      three std streams at fd 3. With ExtraFiles present the parent appends the pipe
      AFTER them (so ExtraFiles keep fd 3..) and passes the real fd via
      trampolineHsFdEnv; the trampoline reads it through childHandshakeFD.
    items:
      - name: defaultHandshakeFD
        type: int
        value: "3"
    name: defaultHandshakeFD
  - doc: Status bytes the trampoline writes to handshakeFD before it exits on failure.
    grouped: true
    items:
      - comment: a setrlimit/umask application failed.
        name: handshakeApplyFail
        type: byte
        value: "'A'"
      - comment: the execve of the real target failed.
        name: handshakeExecFail
        type: byte
        value: "'E'"
      - comment: the pre-exec cgroup.procs placement failed.
        name: handshakeCgroupFail
        type: byte
        value: "'C'"
    name: handshakeApplyFail
  - doc: pathVariable is the environment variable listing the directories searched.
    items:
      - name: pathVariable
        type: string
        value: "\"PATH\""
    name: pathVariable
  - doc: |-
      anyExecuteBit is the owner, group and other execute bits. os/exec.LookPath
      accepts a file carrying any of them; so does this search.
    items:
      - name: anyExecuteBit
        type: fs.FileMode
        value: "0o111"
    name: anyExecuteBit
  - doc: |-
      rssUnitsPerKiB is 1 because Linux, FreeBSD, OpenBSD, NetBSD and DragonFly
      report ru_maxrss in kilobytes, the unit the port documents. illumos and
      Solaris define the field in pages but leave it 0, so the figure there is 0
      whatever the unit.
    items:
      - name: rssUnitsPerKiB
        type: int64
        value: "1"
    name: rssUnitsPerKiB
  - doc: |-
      procFileMode is the os.WriteFile mode for procfs control files; the kernel
      ignores it for existing procfs entries, so it only satisfies the signature.
    items:
      - name: procFileMode
        type: os.FileMode
        value: "0o644"
    name: procFileMode
  - doc: |-
      Standard-stream fd indices and their count, named so the wiring carries no
      bare magic numbers. The values are the kernel's fixed fd numbers (0/1/2), so
      iota lines up with them and stdioFdCount is the natural fourth value.
    grouped: true
    items:
      - name: fdStdin
        type: int
        value: iota
      - name: fdStdout
      - name: fdStderr
      - name: stdioFdCount
    name: fdStdin
  - doc: |-
      trampolineEnv is the sentinel environment variable carrying the encoded
      rlimit/umask payload to the trampoline child. Deliberately ugly + namespaced so
      it never collides with a real variable.
    items:
      - name: trampolineEnv
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_TRAMPOLINE\""
    name: trampolineEnv
  - doc: |-
      trampolineCgroupEnv carries the cgroup v2 directory the trampoline must place
      its pid into (write to <dir>/cgroup.procs) before execve. Kept in its own
      sentinel var rather than the ';'-delimited payload so a path containing any
      byte never needs escaping. Stripped before the target execs, like trampolineEnv.
    items:
      - name: trampolineCgroupEnv
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_CGROUP\""
    name: trampolineCgroupEnv
  - doc: |-
      trampolineHsFdEnv carries the descriptor number the parent placed the handshake
      pipe's write end at. The pipe is appended AFTER any Spec.ExtraFiles, so its fd
      is 3+len(ExtraFiles), not a fixed 3 — keeping ExtraFiles at their documented fd
      3.. for socket activation. Absent (legacy/no-extras spawns) the trampoline
      falls back to defaultHandshakeFD.
    items:
      - name: trampolineHsFdEnv
        type: string
        value: "\"__KITSUNIUM_SDK_PROC_HSFD\""
    name: trampolineHsFdEnv
  - doc: |-
      Trampoline child exit codes (distinct from any the target could use before it
      execs, so a supervisor can tell a trampoline failure from a target failure).
    grouped: true
    items:
      - comment: a setrlimit/umask application failed.
        name: trampolineApplyExit
        type: int
        value: "126"
      - comment: the execve of the real target failed.
        name: trampolineExecExit
        type: int
        value: "127"
    name: trampolineApplyExit
  - doc: "trampolineMinArgs is the minimum argv the trampoline child needs: [self, target]."
    items:
      - name: trampolineMinArgs
        type: int
        value: "2"
    name: trampolineMinArgs
  - doc: decimalRadix is the base used when encoding/decoding the payload integers.
    items:
      - name: decimalRadix
        type: int
        value: "10"
    name: decimalRadix
  - doc: |-
      uintBits is the bit size passed to strconv.ParseUint for the soft/hard fields,
      matching coreproc.LimitValue's uint64 members.
    items:
      - name: uintBits
        type: int
        value: "64"
    name: uintBits
  - doc: |-
      sysexits exit-code constants mirrored from internal/core/proc/codes.go so the
      wrapped Errors carry the same status as their bare-sentinel siblings.
    grouped: true
    items:
      - comment: EX_NOUSER — a named user/group did not resolve.
        name: exitNoUser
        type: int
        value: "67"
      - comment: EX_UNAVAILABLE — a required facility is absent.
        name: exitUnavailable
        type: int
        value: "69"
      - comment: EX_OSERR — an OS-level operation failed.
        name: exitOSErr
        type: int
        value: "71"
      - comment: EX_IOERR — an I/O error occurred (capture writer failed).
        name: exitIOErr
        type: int
        value: "74"
    name: exitNoUser
  - doc: |-
      zombiesRefused is false: every other kernel counts a zombie when it signals
      a group, so a group of zombies is signalled and an emptied one is ESRCH.
    items:
      - name: zombiesRefused
        type: bool
        value: "false"
    name: zombiesRefused
