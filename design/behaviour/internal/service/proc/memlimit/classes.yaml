# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: procSelfCgroup names the per-process cgroup membership file (cgroupfs's).
    items:
      - name: procSelfCgroup
        type: string
        value: cgroupfs.SelfCgroupFile
    name: procSelfCgroup
  - doc: |-
      rootCgroupPath is the path a process reports when it sits at the hierarchy
      root — the usual case inside a cgroup namespace, where the container's own
      cgroup is presented as "/".
    items:
      - name: rootCgroupPath
        type: string
        value: "\"/\""
    name: rootCgroupPath
  - doc: |-
      defaultCandidateCapacity pre-sizes the candidate slice for a typical nesting
      depth across both hierarchies.
    items:
      - name: defaultCandidateCapacity
        type: int
        value: "8"
    name: defaultCandidateCapacity
  - doc: |-
      maxHeadroomPercent is the largest share of the allowance a caller may hand
      to the runtime: all of it.
    items:
      - name: maxHeadroomPercent
        type: int
        value: "100"
    name: maxHeadroomPercent
  - doc: |-
      runtimeDefaultLimit is the soft memory limit the runtime runs with when
      GOMEMLIMIT is unset: none.
    items:
      - name: runtimeDefaultLimit
        type: int64
        value: math.MaxInt64
    name: runtimeDefaultLimit
  - doc: |-
      cgroupV2LimitFile is the unified-hierarchy memory cap filename. Holds
      either a byte count or the literal "max".
    items:
      - name: cgroupV2LimitFile
        type: string
        value: "\"memory.max\""
    name: cgroupV2LimitFile
  - doc: |-
      cgroupV2HighFile is the unified-hierarchy throttle filename: above it the
      kernel reclaims and slows the group's allocations. Same format as
      memory.max, "max" meaning none.
    items:
      - name: cgroupV2HighFile
        type: string
        value: "\"memory.high\""
    name: cgroupV2HighFile
  - doc: |-
      cgroupV1LimitFile is the legacy hierarchy memory cap filename. Holds a byte
      count, using a near-int64-max sentinel to mean "unlimited".
    items:
      - name: cgroupV1LimitFile
        type: string
        value: "\"memory.limit_in_bytes\""
    name: cgroupV1LimitFile
  - doc: |-
      goMemLimitEnv is the runtime's own override. When an operator sets it, the
      runtime has already applied it and this package must not second-guess them.
    items:
      - name: goMemLimitEnv
        type: string
        value: "\"GOMEMLIMIT\""
    name: goMemLimitEnv
  - doc: unlimitedV2 is the cgroup v2 spelling of "no cap".
    items:
      - name: unlimitedV2
        type: string
        value: "\"max\""
    name: unlimitedV2
  - doc: |-
      unlimitedV1Floor is the threshold above which a v1 value means "no cap".
      The kernel reports PAGE_COUNTER_MAX, which varies with page size, so any
      absurdly large value is treated as unlimited rather than matching one
      constant exactly.
    items:
      - name: unlimitedV1Floor
        type: int64
        value: 1 << 62
    name: unlimitedV1Floor
  - doc: |-
      headroomPercent is the share of the cgroup allowance handed to the Go
      runtime. The remainder covers memory that counts against the cgroup but sits
      outside runtime accounting — the binary image, mapped files, C allocations,
      and kernel memory held on the process's behalf. Handing the runtime 100% of
      the cap would leave nothing for those and reintroduce the OOM kill this
      package prevents.
    items:
      - name: headroomPercent
        type: int64
        value: "90"
    name: headroomPercent
  - doc: percentDivisor converts headroomPercent into a fraction.
    items:
      - name: percentDivisor
        type: int64
        value: "100"
    name: percentDivisor
  - doc: decimalBase is the numeric base of every cgroup limit file.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      int64Bits is the width parsePositiveBytes parses into, matching the int64
      that debug.SetMemoryLimit accepts.
    items:
      - name: int64Bits
        type: int
        value: "64"
    name: int64Bits
  - doc: |-
      minimumLimitBytes is the floor below which the derived limit is discarded.
      A cap this small cannot host a non-trivial working set anyway, and forcing
      the runtime under it would spin the collector continuously without averting
      the kill.
    items:
      - name: minimumLimitBytes
        type: int64
        value: 64 << 20
    name: minimumLimitBytes
  - doc: |-
      minWatchPeriod is the shortest period Watch re-reads at: the files are read
      on every period, and a cap that changes is an operator's act, not a
      sub-second event.
    items:
      - name: minWatchPeriod
        type: time.Duration
        value: time.Second
    name: minWatchPeriod
