# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      procSelfCgroup names the per-process cgroup membership file. Each line maps
      a hierarchy to the path this process belongs to, relative to that
      hierarchy's mount root.
    items:
      - name: procSelfCgroup
        type: string
        value: "\"/proc/self/cgroup\""
    name: procSelfCgroup
  - doc: |-
      cgroupMountRoot is where the unified hierarchy is conventionally mounted.
      Used as a fallback when /proc/self/mountinfo cannot be read.
    items:
      - name: cgroupMountRoot
        type: string
        value: "\"/sys/fs/cgroup\""
    name: cgroupMountRoot
  - doc: |-
      cgroupV1MemoryRoot is the v1 memory controller's conventional mount point,
      used on the same fallback path.
    items:
      - name: cgroupV1MemoryRoot
        type: string
        value: "\"/sys/fs/cgroup/memory\""
    name: cgroupV1MemoryRoot
  - doc: |-
      procSelfMountinfo lists this process's mounts, including where each cgroup
      hierarchy is actually attached.
    items:
      - name: procSelfMountinfo
        type: string
        value: "\"/proc/self/mountinfo\""
    name: procSelfMountinfo
  - doc: |-
      mountinfoSeparator delimits the variable-length prefix from the fstype and
      source fields. The prefix has an optional-fields section of unbounded
      length, so the separator is the only reliable anchor.
    items:
      - name: mountinfoSeparator
        type: string
        value: "\" - \""
    name: mountinfoSeparator
  - doc: |-
      mountRootField is the index, in the prefix fields, of the mount's root
      WITHIN its filesystem. A runtime that bind-mounts a container's own cgroup
      subtree reports that subtree here, and a membership path read from
      /proc/self/cgroup names a real file only once it is expressed relative to it.
    items:
      - name: mountRootField
        type: int
        value: "3"
    name: mountRootField
  - doc: mountpointField is the index of the mount point in the prefix fields.
    items:
      - name: mountpointField
        type: int
        value: "4"
    name: mountpointField
  - doc: fstypeField is the index of the filesystem type after the separator.
    items:
      - name: fstypeField
        type: int
        value: "0"
    name: fstypeField
  - doc: |-
      superOptionsField is the index of the super-block options after the
      separator, where a v1 mount lists the controllers it carries.
    items:
      - name: superOptionsField
        type: int
        value: "2"
    name: superOptionsField
  - doc: fstypeCgroupV2 is the filesystem type of the unified hierarchy.
    items:
      - name: fstypeCgroupV2
        type: string
        value: "\"cgroup2\""
    name: fstypeCgroupV2
  - doc: fstypeCgroupV1 is the filesystem type of a legacy controller mount.
    items:
      - name: fstypeCgroupV1
        type: string
        value: "\"cgroup\""
    name: fstypeCgroupV1
  - doc: |-
      suffixFieldCount is the minimum number of fields expected after the
      separator: fstype, source, and super options.
    items:
      - name: suffixFieldCount
        type: int
        value: "3"
    name: suffixFieldCount
  - doc: |-
      mangleEscape is the byte the kernel's mangle_path writes before an octal
      triple. Space, tab, newline and backslash cannot appear literally in a
      whitespace-delimited field, so the kernel encodes them.
    items:
      - name: mangleEscape
        type: byte
        value: "'\\\\'"
    name: mangleEscape
  - doc: |-
      mangleDigits is how many octal digits follow mangleEscape. The kernel always
      writes three, zero-padded.
    items:
      - name: mangleDigits
        type: int
        value: "3"
    name: mangleDigits
  - doc: octalBase is the base mangle_path encodes an escaped byte in.
    items:
      - name: octalBase
        type: int
        value: "8"
    name: octalBase
  - doc: "escapedByteBits is the width one decoded escape parses into: a single byte."
    items:
      - name: escapedByteBits
        type: int
        value: "8"
    name: escapedByteBits
  - doc: v2LinePrefix marks the unified-hierarchy line in /proc/self/cgroup.
    items:
      - name: v2LinePrefix
        type: string
        value: "\"0::\""
    name: v2LinePrefix
  - doc: v1MemoryController is the controller name to match on a v1 line.
    items:
      - name: v1MemoryController
        type: string
        value: "\"memory\""
    name: v1MemoryController
  - doc: |-
      cgroupLineFields is the number of colon-separated fields per line:
      hierarchy ID, comma-separated controllers, and the path.
    items:
      - name: cgroupLineFields
        type: int
        value: "3"
    name: cgroupLineFields
  - doc: controllersField is the index of the comma-separated controller list.
    items:
      - name: controllersField
        type: int
        value: "1"
    name: controllersField
  - doc: cgroupPathField is the index of the membership path.
    items:
      - name: cgroupPathField
        type: int
        value: "2"
    name: cgroupPathField
  - doc: |-
      rootCgroupPath is the path a process reports when it sits at the hierarchy
      root — the usual case inside a cgroup namespace, where the container's own
      cgroup is presented as "/".
    items:
      - name: rootCgroupPath
        type: string
        value: "\"/\""
    name: rootCgroupPath
  - doc: |-
      defaultCandidateCapacity pre-sizes the candidate slice for a typical nesting
      depth across both hierarchies.
    items:
      - name: defaultCandidateCapacity
        type: int
        value: "8"
    name: defaultCandidateCapacity
  - doc: |-
      cgroupV2LimitFile is the unified-hierarchy memory cap filename. Holds
      either a byte count or the literal "max".
    items:
      - name: cgroupV2LimitFile
        type: string
        value: "\"memory.max\""
    name: cgroupV2LimitFile
  - doc: |-
      cgroupV1LimitFile is the legacy hierarchy memory cap filename. Holds a byte
      count, using a near-int64-max sentinel to mean "unlimited".
    items:
      - name: cgroupV1LimitFile
        type: string
        value: "\"memory.limit_in_bytes\""
    name: cgroupV1LimitFile
  - doc: |-
      goMemLimitEnv is the runtime's own override. When an operator sets it, the
      runtime has already applied it and this package must not second-guess them.
    items:
      - name: goMemLimitEnv
        type: string
        value: "\"GOMEMLIMIT\""
    name: goMemLimitEnv
  - doc: unlimitedV2 is the cgroup v2 spelling of "no cap".
    items:
      - name: unlimitedV2
        type: string
        value: "\"max\""
    name: unlimitedV2
  - doc: |-
      unlimitedV1Floor is the threshold above which a v1 value means "no cap".
      The kernel reports PAGE_COUNTER_MAX, which varies with page size, so any
      absurdly large value is treated as unlimited rather than matching one
      constant exactly.
    items:
      - name: unlimitedV1Floor
        type: int64
        value: 1 << 62
    name: unlimitedV1Floor
  - doc: |-
      headroomPercent is the share of the cgroup allowance handed to the Go
      runtime. The remainder covers memory that counts against the cgroup but sits
      outside runtime accounting — the binary image, mapped files, C allocations,
      and kernel memory held on the process's behalf. Handing the runtime 100% of
      the cap would leave nothing for those and reintroduce the OOM kill this
      package prevents.
    items:
      - name: headroomPercent
        type: int64
        value: "90"
    name: headroomPercent
  - doc: percentDivisor converts headroomPercent into a fraction.
    items:
      - name: percentDivisor
        type: int64
        value: "100"
    name: percentDivisor
  - doc: decimalBase is the numeric base of every cgroup limit file.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      int64Bits is the width parsePositiveBytes parses into, matching the int64
      that debug.SetMemoryLimit accepts.
    items:
      - name: int64Bits
        type: int
        value: "64"
    name: int64Bits
  - doc: |-
      minimumLimitBytes is the floor below which the derived limit is discarded.
      A cap this small cannot host a non-trivial working set anyway, and forcing
      the runtime under it would spin the collector continuously without averting
      the kill.
    items:
      - name: minimumLimitBytes
        type: int64
        value: 64 << 20
    name: minimumLimitBytes
