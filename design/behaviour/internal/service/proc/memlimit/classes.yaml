      - watchFrom
      - report
    name: watch.go
functions:
  - doc: |-
      resolveCgroupPaths returns the memory-limit files to consult, ordered from
      the process's own cgroup outward to the hierarchy root.

      Reading only the hierarchy's ROOT CGROUP was wrong — a different sense of
      "root" from cgroupMount.root, which is what a mount exposes. Limits belong to
      cgroup directories, not to the mount. A process in a child cgroup — the normal
      shape under systemd, and under any runtime that does not use cgroup namespaces
      — would see the root's unlimited value and conclude there was no cap, silently
      disabling the feature exactly where it is needed.

      Ancestors are included because a restrictive parent bounds the process just
      as effectively as its own cgroup; the caller takes the minimum.
    name: resolveCgroupPaths
    params: readFile func(string) ([]byte, error)
    results: "[]string"
  - doc: |-
      mountPointFiles returns the limit file directly under each mount point, which
      is the best guess available when the membership file cannot be read.
    name: mountPointFiles
    params: v2Mounts, v1Mounts []cgroupfs.MountValue
    results: "[]string"
  - doc: |-
      dedupe returns paths with repeats removed, preserving first-seen order.

      Two mounts of one hierarchy can name the same file — a bind of a directory
      onto itself is the simplest way — and every repeat costs a redundant open for
      a value the caller would minimise against itself. The lists are a handful of
      entries deep, so a linear scan beats a map.
    name: dedupe
    params: paths []string
    results: "[]string"
  - doc: |-
      ancestorLimitFiles returns the limit file for cgroupPath under mount, then
      for each ancestor up to the exposed root itself. Returns nil when the
      hierarchy is absent, so a v1-only or v2-only host contributes candidates from
      one side, and nil when the mount exposes a subtree this process is not in.
    name: ancestorLimitFiles
    params: mount cgroupfs.MountValue, cgroupPath, limitFile string
    results: "[]string"
  - doc: defaultConfig is Apply's configuration.
    name: defaultConfig
    results: resolvedConfig
  - doc: systemEnvironment is the running process's.
    name: systemEnvironment
    results: environment
  - name: ApplyWith
    params: cfg ConfigValue
    results: coreproc.MemoryLimitValue, error
  - doc: applyWithFrom is ApplyWith in env.
    name: applyWithFrom
    params: cfg ConfigValue, env environment
    results: coreproc.MemoryLimitValue, error
  - name: Apply
    results: coreproc.MemoryLimitValue
  - doc: |-
      applyFrom is Apply with its three environment dependencies injected so tests
      can drive every branch without a real cgroup filesystem.
    name: applyFrom
    params: |2

      	lookup func(string) (string, bool),
      	readFile func(string) ([]byte, error),
      	setLimit func(int64) int64,
    results: coreproc.MemoryLimitValue
  - doc: |-
      deriveWith derives the soft memory limit cfg asks for from the files
      readFile serves, without installing it.
    name: deriveWith
    params: |2

      	cfg resolvedConfig,
      	lookup func(string) (string, bool),
      	readFile func(string) ([]byte, error),
    results: coreproc.MemoryLimitValue
  - doc: |-
      shareOf returns percent percent of allowance — the share of a cgroup
      allowance handed to the Go runtime. It is exact for every allowance an int64
      can hold and every percent in (0, 100], and it cannot overflow.

      Both naive spellings fail somewhere. Dividing first discards up to
      percentDivisor-1 bytes of the allowance before the share is taken, and within
      a few bytes of the floor that under-computation declines a cap the exact value
      accepts: an allowance of 74,565,405 derives 67,108,860 that way and exactly
      the 67,108,864 floor the other. Multiplying first is exact but wraps above
      math.MaxInt64/percent — reachable, since parseV1Limit accepts up to
      1<<62 and parseV2Limit up to math.MaxInt64.

      Splitting the allowance into whole hundreds and a remainder is both. The
      identity is exact because 100q*percent divides by percentDivisor with
      no remainder of its own, so only the r term rounds — and neither term can
      overflow, since q is at most math.MaxInt64/percentDivisor and r at most
      percentDivisor-1.
    name: shareOf
    params: allowance, percent int64
    results: int64
  - doc: |-
      readCgroupAllowance returns the most restrictive memory cap governing this
      process, in bytes, and the file that set it. Reports false when no candidate
      declares a real cap.

      Takes the minimum across the process's own cgroup and its ancestors: a
      restrictive parent bounds the process just as effectively as its own cgroup,
      and honouring only the nearest value would overshoot the real allowance. On
      the unified hierarchy each memory.max is read with the memory.high beside
      it: the kernel throttles above memory.high long before memory.max kills, so
      the throttle is as much a cap as the kill. A tie keeps the hard cap, read
      first.
    name: readCgroupAllowance
    params: readFile func(string) ([]byte, error)
    results: allowance int64, bound coreproc.MemoryBound, ok bool
  - doc: |-
      readLimitFile reads one cgroup limit file, dispatching on its filename to
      the matching format. v1 and v2 spell "unlimited" differently, so the parse
      cannot be shared.
    name: readLimitFile
    params: readFile func(string) ([]byte, error), candidate string
    results: limit int64, ok bool
  - doc: |-
      parseV2Limit reads a cgroup v2 memory.max value, reporting false for the
      "max" sentinel and for anything unparseable or non-positive.
    name: parseV2Limit
    params: raw string
    results: allowance int64, ok bool
  - doc: |-
      parseV1Limit reads a cgroup v1 memory.limit_in_bytes value, treating the
      near-int64-max sentinel as unlimited.
    name: parseV1Limit
    params: raw string
    results: allowance int64, ok bool
  - doc: |-
      parsePositiveBytes parses a decimal byte count, rejecting anything that is
      not a strictly positive integer.
    name: parsePositiveBytes
    params: raw string
    results: allowance int64, ok bool
  - name: Watch
    params: |2

      	ctx context.Context,
      	clk clock.Timed,
      	every time.Duration,
      	cfg ConfigValue,
      	onChange func(coreproc.MemoryLimitValue),
    results: error
  - doc: watchFrom is Watch in env.
    name: watchFrom
    params: |2

      	ctx context.Context,
      	clk clock.Timed,
      	every time.Duration,
      	cfg ConfigValue,
      	env environment,
      	onChange func(coreproc.MemoryLimitValue),
    results: error
  - doc: report hands a derivation to onChange, when there is one.
    name: report
    params: onChange func(coreproc.MemoryLimitValue), derived coreproc.MemoryLimitValue
imports:
  cgroupfs: github.com/kitsunium/sdk/internal/service/proc/internal/cgroupfs
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  debug: runtime/debug
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  os: os
  path: path
  slices: slices
  strconv: strconv
  strings: strings
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/memlimit
  name: memlimit
  purpose: "Package memlimit — resolving WHICH cgroup limit files govern this process: where each hierarchy is mounted, which part of the filesystem that mount exposes, which cgroup the process belongs to, and the ancestors whose caps bound it just as effectively."
types:
  - fields:
      - doc: |-
          HeadroomPercent is the share of the allowance handed to the runtime, in
          (0, 100]; zero means 90. The rest covers what counts against the cgroup
          outside the runtime — the binary, mapped files, C allocations — so a
          cgo- or mmap-heavy service lowers it.
        name: HeadroomPercent
        type: int
      - doc: |-
          MinimumLimit is the floor in bytes under which a derived limit is
          declined (MemorySourceBelowFloor); zero means 64 MiB.
        name: MinimumLimit
        type: int64
      - doc: |-
          GCPercent, when not nil, is installed with debug.SetGCPercent at the
          moment a limit is — -1 runs the collector on the limit alone — and the
          previous percent is put back when Watch withdraws the limit. Nil leaves
          GOGC as it is.
        name: GCPercent
        type: "*int"
    kind: struct
    methods:
      - doc: validate refuses a configuration no derivation can honour (ADR 0031).
        name: validate
        recv: c ConfigValue
        results: error
      - doc: resolved replaces the zeros with the defaults; the configuration is valid.
        name: resolved
        recv: c ConfigValue
        results: resolvedConfig
    name: ConfigValue
  - doc: |-
      resolvedConfig is a ConfigValue checked and with its zeros replaced by the
      defaults.
    fields:
      - doc: headroom is the share of the allowance handed to the runtime, in percent.
        name: headroom
        type: int64
      - doc: floor is the smallest limit worth installing, in bytes.
        name: floor
        type: int64
      - doc: gcPercent is the GC percent installed with a limit, or nil.
        name: gcPercent
        type: "*int"
    kind: struct
    name: resolvedConfig
  - doc: |-
      environment is what an installation touches: the environment, the cgroup
      files and the runtime's two knobs, injected so a test drives every branch.
    fields:
      - doc: lookup reads an environment variable.
        name: lookup
        type: func(string) (string, bool)
      - doc: readFile reads a cgroup or /proc file.
        name: readFile
        type: func(string) ([]byte, error)
      - doc: setLimit installs a soft memory limit and returns the previous one.
        name: setLimit
        type: func(int64) int64
      - doc: setGC installs a GC percent and returns the previous one.
        name: setGC
        type: func(int) int
    kind: struct
    name: environment
  - doc: |-
      governor installs derivations one after the other, and withdraws its own
      limit when a later derivation has none to install.
    fields:
      - doc: cfg is the configuration every derivation reads.
        name: cfg
        type: resolvedConfig
      - doc: env is what installing touches.
        name: env
        type: environment
      - doc: gcSaved is the GC percent in force before gcPercent was installed.
        name: gcSaved
        type: int
      - doc: installed reports that a limit of this governor's is in force.
        name: installed
        type: bool
      - doc: gcSet reports that gcPercent is installed and gcSaved holds the previous.
        name: gcSet
        type: bool
    kind: struct
    methods:
      - doc: derive reads the files and derives, installing nothing.
        name: derive
        recv: g *governor
        results: coreproc.MemoryLimitValue
      - doc: |-
          settle installs a derivation that carries a limit, and withdraws an earlier
          one when it does not.
        name: settle
        params: derived coreproc.MemoryLimitValue
        recv: g *governor
    name: governor
  - doc: |-
      allowanceReading is the tightest cap read so far and the file kind that set
      it.
    fields:
      - doc: allowance is the smallest real cap seen, or zero before the first.
        name: allowance
        type: int64
      - doc: bound is the kind of file that set allowance.
        name: bound
        type: coreproc.MemoryBound
    kind: struct
    methods:
      - doc: |-
          consider reads one candidate file and keeps it when it is a real cap tighter
          than every one before it.
        name: consider
        params: readFile func(string) ([]byte, error), candidate string, bound coreproc.MemoryBound
        recv: r *allowanceReading
    name: allowanceReading
