      - set: pid, err
        to: syscall
        value: syscall.Wait4(anyChildPID, &status.WaitStatus, syscall.WNOHANG, &status.Rusage)
      - opt:
          do:
            - return: "-1, err"
          when: int32(pid) == -1
      - opt:
          do:
            - return: 0, nil
          when: pid == 0
      - bind: owned
        eval: l.deliver(pid, status)
        to: l.deliver
      - loop:
          do:
            - opt:
                do:
                  - eval: observe(pid, status, owned)
                when: observe != nil
          key: _
          range: observers
          value: observe
