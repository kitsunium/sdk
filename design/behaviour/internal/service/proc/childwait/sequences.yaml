        kind: internal
    steps:
      - lock:
          mutex: l.spawning
      - return: l.handOver(pid, status)
        to: l.handOver
  - of: (*ledger).handOver
    steps:
      - lock:
          mutex: l.mu
      - bind: claim, ok
        eval: l.claims[pid]
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - set: claim.collected
        value: "true"
      - set: claim.status
        value: "*status"
      - eval: delete(l.claims, pid)
      - return: "true"
  - of: (*Claim).Collected
    steps:
      - opt:
          do:
            - return: StatusValue{}, false
          when: c == nil
      - lock:
          mutex: c.book.mu
      - return: c.status, c.collected
  - of: (*Claim).Reclaim
    participants:
      - id: caller
        kind: actor
      - id: (*Claim).Reclaim
        kind: self
      - id: c.book.forget
