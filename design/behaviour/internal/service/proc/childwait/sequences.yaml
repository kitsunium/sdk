      - eval: l.mu.Lock()
        to: l.mu.Lock
      - set: l.claims[pid]
        value: claim
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
      - return: claim
  - of: (*ledger).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*ledger).deliver
        kind: self
