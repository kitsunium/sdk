          do:
            - return: coreproc.NotificationValue{}, wrapListen(err, l.path)
          when: err != nil
      - opt:
          do:
            - return: coreproc.NotificationValue{}, wrapInvalid(nil, errs.String("reason", "datagram truncated"))
          when: recvFlags&syscall.MSG_TRUNC != 0 || n == len(buf)
