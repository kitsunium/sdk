        to: parsePayload
        value: parsePayload(string(buf[:n]))
      - opt:
          do:
            - return: coreproc.NotificationValue{}, err
          when: err != nil
      - bind: pid, ok
        eval: senderPID(oob[:oobn])
        to: senderPID
      - opt:
          do:
            - return: coreproc.NotificationValue{}, wrapCredMismatch()
          when: "!ok"
      - set: value.SenderPID
        value: pid
      - return: value, nil
  - of: wrapCredMismatch
    participants:
      - id: caller
        kind: actor
      - id: wrapCredMismatch
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:     coreproc.CodeCredentialMismatch,
          		Reason:   "CREDENTIAL_MISMATCH",
          		Public:   "Datagram sender credentials did not match",
          		Private:  "service/proc/systemd/notify.Recv: SO_PASSCRED sender pid is not the expected supervised process",
          		ExitCode: exitNoPerm,
          	})
        to: errs
  - of: senderPID
    participants:
      - id: caller
        kind: actor
      - id: senderPID
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, false
          when: len(oob) == 0
      - bind: scms, err
        eval: syscall.ParseSocketControlMessage(oob)
        to: syscall
      - opt:
          do:
            - return: 0, false
          when: err != nil
      - loop:
          do:
            - bind: cred, perr
              eval: syscall.ParseUnixCredentials(&scms[i])
              to: syscall
            - opt:
                do:
                  - continue: true
                when: perr != nil
            - return: int(cred.Pid), true
          key: i
          range: scms
      - return: 0, false
  - of: (*listener).Close
    participants:
      - id: caller
        kind: actor
      - id: (*listener).Close
        kind: self
      - id: l.conn.Close
        kind: value
      - id: errors
        kind: stdlib
      - id: wrapListen
        kind: internal
    steps:
      - bind: err
        eval: l.conn.Close()
        to: l.conn.Close
      - opt:
          do:
            - set: err
              to: errors
              value: errors.Join(err, os.RemoveAll(l.tempDir))
          when: l.tempDir != ""
      - opt:
          do:
            - set: err
              to: errors
              value: errors.Join(err, os.Remove(l.path))
          when: l.tempDir == "" && l.path != "" && !strings.HasPrefix(l.path, "\x00")
      - opt:
          do:
            - return: nil
          when: err == nil
      - return: wrapListen(err, l.path)
        to: wrapListen
  - of: wrapListen
    participants:
      - id: caller
        kind: actor
      - id: wrapListen
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeListenFailed,
          		Reason:   "LISTEN_FAILED",
          		Public:   "Could not create the sd_notify listener socket",
          		Private:  "service/proc/systemd/notify.Listen: creating or binding the AF_UNIX datagram socket failed",
          		ExitCode: exitOSErr,
          	}, errs.String("socket", path))
        to: errs
  - of: Notify
    participants:
      - id: caller
        kind: actor
      - id: Notify
        kind: self
      - id: NotifyContext
        kind: internal
    steps:
      - return: NotifyContext(context.Background(), state)
        to: NotifyContext
  - of: NotifyContext
    participants:
      - id: caller
        kind: actor
      - id: NotifyContext
        kind: self
      - id: os
        kind: stdlib
      - id: net
        kind: stdlib
      - id: wrapNotify
        kind: internal
      - id: encodePayload
        kind: internal
      - id: writeDatagram
        kind: internal
    steps:
      - bind: raw, ok
        eval: os.LookupEnv(envNotifySocket)
        to: os
      - opt:
          do:
            - return: nil
          when: "!ok || raw == \"\""
      - bind: addr
        eval: "&net.UnixAddr{Name: resolveAddr(raw), Net: \"unixgram\"}"
      - bind: conn, err
        eval: net.DialUnix("unixgram", nil, addr)
        to: net
      - opt:
          do:
            - return: wrapNotify(err, raw)
              to: wrapNotify
          when: err != nil
      - defer: |-
          func() {
          		//: close always runs; capture its error only when none preceded it.
          		if closeErr := conn.Close(); closeErr != nil && err == nil {
          			//: a clean send followed by a failed close still reports NotifyFailed.
          			err = wrapNotify(closeErr, raw)
          		}
          	}()
      - bind: payload, err
        eval: encodePayload(state)
        to: encodePayload
      - opt:
          do:
            - return: err
          when: err != nil
      - return: writeDatagram(ctx, conn, payload, raw)
        to: writeDatagram
  - of: writeDatagram
    participants:
      - id: caller
        kind: actor
      - id: writeDatagram
        kind: self
      - id: boundWrite
        kind: internal
      - id: wrapNotify
        kind: internal
      - id: conn.Write
        kind: internal
