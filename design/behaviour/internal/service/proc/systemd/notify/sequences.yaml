          raw.Control(func(fd uintptr) {
          		//: SO_PASSCRED at SOL_SOCKET requests per-message sender credentials.
          		sockErr = syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, syscall.SO_PASSCRED, 1)
          	})
        to: raw.Control
      - opt:
          do:
            - return: wrapListen(ctrlErr, "")
              to: wrapListen
          when: ctrlErr != nil
      - opt:
          do:
            - return: wrapListen(sockErr, "")
              to: wrapListen
          when: sockErr != nil
      - return: nil
  - of: (*listener).Recv
    participants:
      - id: caller
        kind: actor
      - id: (*listener).Recv
        kind: self
      - id: l.conn.ReadMsgUnix
        kind: value
      - id: parsePayload
        kind: internal
      - id: senderPID
        kind: internal
