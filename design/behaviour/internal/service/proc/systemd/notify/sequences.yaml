      - bind: stop, err
        eval: boundWrite(ctx, conn)
        to: boundWrite
      - opt:
          do:
            - return: wrapNotify(err, socket)
              to: wrapNotify
          when: err != nil
      - opt:
          do:
            - defer: stop()
          when: stop != nil
      - set: _, err
        to: conn.Write
        value: conn.Write([]byte(payload))
      - opt:
          do:
            - return: wrapNotify(errors.Join(err, ctx.Err()), socket)
              to: wrapNotify
          when: err != nil
      - return: nil
  - of: boundWrite
    participants:
      - id: caller
        kind: actor
      - id: boundWrite
        kind: self
      - id: ctx.Deadline
        kind: value
      - id: conn.SetWriteDeadline
        kind: internal
      - id: context
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nil
          when: ctx.Done() == nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: conn.SetWriteDeadline(deadline)
                  to: conn.SetWriteDeadline
                when: err != nil
          init:
            bind: deadline, ok
            eval: ctx.Deadline()
            to: ctx.Deadline
          when: ok
      - return: |-
          context.AfterFunc(ctx, func() {
          		//: nothing can be returned from here, and nothing needs to be: a
          		//: refusal means the write is already returning with its own fault.
          		if err := conn.SetWriteDeadline(time.Now()); err != nil {
          			//: the write reports what went wrong.
          			return
          		}
          	}), nil
        to: context
  - of: wrapNotify
    participants:
      - id: caller
        kind: actor
      - id: wrapNotify
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeNotifyFailed,
          		Reason:   "NOTIFY_FAILED",
          		Public:   "Could not send the sd_notify datagram",
          		Private:  "service/proc/systemd/notify: writing to $NOTIFY_SOCKET failed",
          		ExitCode: exitOSErr,
