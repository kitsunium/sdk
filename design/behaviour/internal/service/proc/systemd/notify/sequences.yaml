          when: ctx.Done() == nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: conn.SetWriteDeadline(deadline)
                  to: conn.SetWriteDeadline
                when: err != nil
          init:
            bind: deadline, ok
            eval: ctx.Deadline()
            to: ctx.Deadline
          when: ok
      - return: |-
          context.AfterFunc(ctx, func() {
          		//: nothing can be returned from here, and nothing needs to be: a
          		//: refusal means the write is already returning with its own fault.
          		if err := conn.SetWriteDeadline(time.Now()); err != nil {
          			//: the write reports what went wrong.
          			return
          		}
          	}), nil
        to: context
  - of: wrapNotify
    participants:
      - id: caller
        kind: actor
      - id: wrapNotify
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeNotifyFailed,
          		Reason:   "NOTIFY_FAILED",
          		Public:   "Could not send the sd_notify datagram",
          		Private:  "service/proc/systemd/notify: writing to $NOTIFY_SOCKET failed",
          		ExitCode: exitOSErr,
          	}, errs.String("socket", socket))
        to: errs
  - of: Ready
    participants:
      - id: caller
        kind: actor
      - id: Ready
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"READY\": \"1\"})"
        to: Notify
  - of: ReadyContext
    participants:
      - id: caller
        kind: actor
      - id: ReadyContext
        kind: self
      - id: NotifyContext
        kind: internal
    steps:
      - return: "NotifyContext(ctx, map[string]string{\"READY\": \"1\"})"
        to: NotifyContext
  - of: StatusContext
    participants:
      - id: caller
        kind: actor
      - id: StatusContext
        kind: self
      - id: NotifyContext
        kind: internal
    steps:
      - return: "NotifyContext(ctx, map[string]string{\"STATUS\": msg})"
        to: NotifyContext
  - of: Reloading
    participants:
      - id: caller
        kind: actor
      - id: Reloading
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"RELOADING\": \"1\"})"
        to: Notify
  - of: Stopping
    participants:
      - id: caller
        kind: actor
      - id: Stopping
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"STOPPING\": \"1\"})"
        to: Notify
  - of: Status
    participants:
      - id: caller
        kind: actor
      - id: Status
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"STATUS\": msg})"
        to: Notify
  - of: Watchdog
    participants:
      - id: caller
        kind: actor
      - id: Watchdog
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"WATCHDOG\": \"1\"})"
        to: Notify
  - of: MainPID
    participants:
      - id: caller
        kind: actor
      - id: MainPID
        kind: self
      - id: Notify
        kind: internal
    steps:
      - return: "Notify(map[string]string{\"MAINPID\": strconv.Itoa(pid)})"
        to: Notify
  - of: wrapInvalid
    participants:
      - id: caller
        kind: actor
      - id: wrapInvalid
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coreproc.CodeInvalidNotification,
          		Reason:   "INVALID_NOTIFICATION",
          		Public:   "Received sd_notify datagram is malformed",
          		Private:  "service/proc/systemd/notify.Recv: datagram did not parse into NAME=value fields",
          		ExitCode: exitDataErr,
          	}, fields...)
        to: errs
  - of: resolveAddr
    steps:
      - opt:
          do:
            - return: "\"\\x00\" + raw[1:]"
          when: strings.HasPrefix(raw, "@")
      - return: raw
  - of: encodePayload
    participants:
      - id: caller
        kind: actor
      - id: encodePayload
        kind: self
      - id: b.WriteString
        kind: value
      - id: b.WriteByte
        kind: value
      - id: b.String
        kind: value
    steps:
      - var:
          name: b
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - return: "\"\", wrapInvalid(nil, errs.String(\"name\", name))"
                when: strings.Contains(name, "\n") || strings.Contains(name, "=")
            - opt:
                do:
                  - return: "\"\", wrapInvalid(nil, errs.String(\"value\", value))"
                when: strings.ContainsRune(value, '\n')
            - eval: b.WriteString(name)
              to: b.WriteString
            - eval: b.WriteByte('=')
              to: b.WriteByte
            - eval: b.WriteString(value)
              to: b.WriteString
            - eval: b.WriteByte('\n')
              to: b.WriteByte
          key: name
          range: state
          value: value
      - return: b.String(), nil
        to: b.String
  - of: parsePayload
    participants:
      - id: caller
        kind: actor
      - id: parsePayload
        kind: self
      - id: strings
        kind: stdlib
      - id: checkAssignments
        kind: internal
      - id: mainPIDFromState
        kind: internal
    steps:
      - bind: state
        eval: make(map[string]string)
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: line == ""
            - bind: name, val, found
              eval: strings.Cut(line, "=")
              to: strings
            - opt:
                do:
                  - return: coreproc.NotificationValue{}, wrapInvalid(nil, errs.String("line", line))
                when: "!found"
            - set: state[name]
              value: val
          key: line
          range: strings.SplitSeq(body, "\n")
      - opt:
          do:
            - return: coreproc.NotificationValue{}, err
          init:
            bind: err
            eval: checkAssignments(state)
            op: =
            to: checkAssignments
          when: err != nil
      - bind: mainPID, err
        eval: mainPIDFromState(state)
        to: mainPIDFromState
      - opt:
          do:
            - return: coreproc.NotificationValue{}, err
          when: err != nil
      - return: |-
          coreproc.NotificationValue{
          		State:   state,
          		Status:  state["STATUS"],
          		MainPID: mainPID,
          	}, nil
  - of: mainPIDFromState
    participants:
      - id: caller
        kind: actor
      - id: mainPIDFromState
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw, ok
        eval: state["MAINPID"]
      - opt:
          do:
            - return: 0, nil
          when: "!ok"
      - bind: parsed, convErr
        eval: strconv.Atoi(raw)
        to: strconv
      - opt:
          do:
            - return: 0, wrapInvalid(convErr, errs.String("mainpid", raw))
          when: convErr != nil
      - return: parsed, nil
  - of: watchdogInterval
    participants:
      - id: caller
        kind: actor
      - id: watchdogInterval
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, false
          when: raw == "" || !watchdogIsOurs(pidRaw, self)
      - bind: usec, err
        eval: strconv.ParseInt(raw, decimalBase, int64Bits)
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: err != nil || usec <= 0 || usec > maxWatchdogUsec
      - return: time.Duration(usec) * time.Microsecond, true
  - of: watchdogIsOurs
    participants:
      - id: caller
        kind: actor
      - id: watchdogIsOurs
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "true"
          when: pidRaw == ""
      - bind: pid, err
        eval: strconv.Atoi(pidRaw)
        to: strconv
      - return: err == nil && pid == self
  - of: WatchdogInterval
    participants:
      - id: caller
        kind: actor
      - id: WatchdogInterval
        kind: self
      - id: watchdogInterval
        kind: internal
    steps:
      - return: watchdogInterval(os.Getenv(envWatchdogUsec), os.Getenv(envWatchdogPID), os.Getpid())
        to: watchdogInterval
