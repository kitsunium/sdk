    steps:
      - bind: dir, err
        eval: os.MkdirTemp("", "sdnotify-")
        to: os
      - opt:
          do:
            - return: nil, "", wrapListen(err, "")
          when: err != nil
      - defer: |-
          func() {
          		//: the success path transfers ownership of the dir to the listener.
          		if err != nil {
          			//: join the cleanup error so a failed removal is not silently lost.
          			err = errors.Join(err, os.RemoveAll(dir))
          		}
          	}()
      - bind: path
        eval: filepath.Join(dir, "notify")
        to: filepath
      - bind: conn, err
        eval: "net.ListenUnixgram(\"unixgram\", &net.UnixAddr{Name: path, Net: \"unixgram\"})"
        to: net
      - opt:
          do:
            - return: nil, "", wrapListen(err, path)
          when: err != nil
      - defer: |-
          func() {
          		//: only tear the socket down when the constructor is failing.
          		if err != nil {
          			//: join the close error so a failed close is surfaced, not dropped.
          			err = errors.Join(err, conn.Close())
          		}
          	}()
      - opt:
          do:
            - return: nil, "", err
          init:
            bind: err
            eval: enablePasscred(conn)
            op: =
            to: enablePasscred
          when: err != nil
      - return: "&listener{conn: conn, path: path, tempDir: dir}, path, nil"
  - of: enablePasscred
    participants:
      - id: caller
        kind: actor
      - id: enablePasscred
        kind: self
      - id: conn.SyscallConn
        kind: value
      - id: wrapListen
        kind: internal
      - id: raw.Control
        kind: value
