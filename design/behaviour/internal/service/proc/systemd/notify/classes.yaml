functions:
  - doc: |-
      checkAssignments refuses a datagram one of whose assignments sd_notify(3)
      defines carries a value out of its bounds, naming the assignment. An empty
      name is no assignment at all.
    name: checkAssignments
    params: state map[string]string
    results: error
  - doc: |-
      fdNameValid reports whether name may name a descriptor in LISTEN_FDNAMES or
      FDNAME=, as systemd's fdname_is_valid decides: at most 255 bytes, each
      printable ASCII, none a ':' — the list's separator. The empty name is valid.
    name: fdNameValid
    params: name string
    results: bool
  - doc: "isOne reports whether a flag is set: sd_notify's flags are 1 or absent."
    name: isOne
    params: v string
    results: bool
  - doc: isPID reports whether v is a positive decimal PID.
    name: isPID
    params: v string
    results: bool
  - doc: isUint64 reports whether v is an unsigned decimal 64-bit count.
    name: isUint64
    params: v string
    results: bool
  - doc: "isErrno reports whether v is an errno: a non-negative decimal int."
    name: isErrno
    params: v string
    results: bool
  - doc: isWatchdog reports whether v is a keep-alive (1) or a trigger.
    name: isWatchdog
    params: v string
    results: bool
  - doc: isBoolDigit reports whether v is 0 or 1.
    name: isBoolDigit
    params: v string
    results: bool
  - doc: isNotifyAccess reports whether v is a NotifyAccess= value.
    name: isNotifyAccess
    params: v string
    results: bool
  - doc: |-
      isErrorName reports whether v can be a D-Bus or Varlink error name: 1 to
      255 printable ASCII bytes, no blank.
    name: isErrorName
    params: v string
    results: bool
  - doc: |-
      Detach readies l — Listen's or ListenFor's — to be handed to another image
      of this process (kitsunium/sdk#738): it returns a new close-on-exec
      descriptor on the socket, and l's Close no longer removes the socket's
      path nor its directory, which Adopt's listener removes in turn. Any other
      Listener is ListenFailed.
    name: Detach
    params: l coreproc.Listener
    results: f *os.File, err error
  - doc: |-
      Adopt is the listener over a socket Detach handed over, bound at
      socketPath: the kernel stamps every datagram with its sender again, and
      Close removes the path — and the private directory Listen made, named
      sdnotify-… — as Listen's listener does. f is the caller's; a descriptor
      that is no datagram socket of the unix family is ListenFailed.
    name: Adopt
    params: f *os.File, socketPath string
    results: l coreproc.Listener, err error
  - doc: dialNotify connects a datagram socket to the supervisor's endpoint.
    name: dialNotify
    params: addr *net.UnixAddr
    results: "*net.UnixConn, error"
  - doc: |-
      oobBufSize is the control buffer one datagram needs at most: SCM_RIGHTS
      with SCM_MAX_FD descriptors, SCM_CREDENTIALS, and SCM_PIDFD.
    name: oobBufSize
    results: int
  - doc: |-
      enableCreds flips SO_PASSCRED on the listener's underlying fd so each
      received datagram carries an SCM_CREDENTIALS control message.
    name: enableCreds
    params: conn *net.UnixConn
    results: error
  - doc: |-
      pidfdPID reads the PID a pidfd refers to from /proc/self/fdinfo: its Pid:
      line, absent for any other descriptor, -1 once the process is reaped.
    name: pidfdPID
    params: fd int
    results: int, error
  - doc: |-
      Listen creates a supervisor-side sd_notify datagram socket, makes the kernel
      stamp every datagram with its sender's credentials — SO_PASSCRED on Linux,
      LOCAL_CREDS_PERSISTENT on FreeBSD —, and returns the Listener together with
      the $NOTIFY_SOCKET value a child should be given. The socket is bound under a
      private temp directory so its path is unguessable; the caller sets
      NOTIFY_SOCKET=socketPath for the child.

      Its Recv reads the whole sd_notify(3) transport (kitsunium/sdk#730): the
      sender's PID, real user and real group from SCM_CREDENTIALS or SCM_CREDS2, a
      pidfd on the sender where the kernel attaches one (SO_PASSPIDFD, Linux 6.5),
      and the descriptors a datagram carries (SCM_RIGHTS, close-on-exec on
      arrival). Every assignment sd_notify(3)
      defines is checked — a flag is 1, a PID or a count is decimal, NOTIFYACCESS= a
      known access, FDNAME= a valid name —; an unknown name is kept as it came, a
      name given twice keeps its last value. BARRIER=1 must carry exactly one
      descriptor and is returned alone; MAINPIDFD=1 exactly one pidfd — a process
      descriptor on FreeBSD —, whose PID becomes MainPID. A datagram refused — truncated, its control data truncated,
      an embedded NUL, an assignment out of bounds, no credentials — is
      InvalidNotification or CredentialMismatch, and every descriptor it carried is
      closed.
    name: Listen
    results: l coreproc.Listener, socketPath string, err error
  - doc: |-
      ListenFor is Listen for a service that runs as uid and gid: the private
      directory and the socket in it belong to that user, so the service — and
      root — can reach the socket, and no other user can. Changing their owner
      needs the privilege to: a refusal is ListenFailed, nothing left behind.
    name: ListenFor
    params: uid, gid int
    results: l coreproc.Listener, socketPath string, err error
  - doc: |-
      parseControl reads the control messages: the credentials, the descriptors,
      the sender's pidfd. Every descriptor is recorded, so a refusal closes them.
    name: parseControl
    params: oob []byte
    results: "*control"
  - doc: |-
      checkDatagram refuses a truncated datagram, truncated control data, and a
      body with an embedded NUL.
    name: checkDatagram
    params: body []byte, recvFlags int, full bool
    results: error
  - doc: descriptorsOf returns value's Descriptors, made on first use.
    name: descriptorsOf
    params: value *coreproc.NotificationValue
    results: "*coreproc.DescriptorsValue"
  - doc: swallowErr discards a cleanup error nobody can act on.
    name: swallowErr
    params: err error
  - doc: |-
      wrapCredMismatch restates the central CredentialMismatch sentinel fields for a
      datagram that arrived without parseable SO_PASSCRED credentials.
    name: wrapCredMismatch
    results: error
  - doc: |-
      wrapListen restates the ListenFailed sentinel fields around a stdlib/syscall
      cause, attaching the socket path for diagnostics.
    name: wrapListen
    params: cause error, path string
    results: error
  - name: Notify
    params: state map[string]string
    results: error
  - name: NotifyContext
    params: ctx context.Context, state map[string]string
    results: err error
  - doc: |-
      writeDatagram sends payload over conn under ctx's bound, and names a failure
      after the socket it could not reach.
    name: writeDatagram
    params: ctx context.Context, conn writeDeadliner, payload, socket string
    results: error
  - doc: |-
      boundWrite makes conn's write observe ctx, and returns the watcher's stop
      func — nil when ctx can never be done, which is the plain [Notify] case and
      arms nothing at all.

      A deadline already known is set directly because it is exact and costs no
      goroutine; the AfterFunc is what covers a cancellation with no deadline, and
      it is the only mechanism that reaches a write already in progress — a
      net.Conn has no other way to be interrupted.
    name: boundWrite
    params: ctx context.Context, conn writeDeadliner
    results: stop func() bool, err error
  - doc: |-
      wrapNotify restates the NotifyFailed sentinel fields around a stdlib/syscall
      cause, attaching the socket value for diagnostics.
    name: wrapNotify
    params: cause error, socket string
    results: error
  - name: Ready
    results: error
  - name: ReadyContext
    params: ctx context.Context
    results: error
  - name: StatusContext
    params: ctx context.Context, msg string
    results: error
  - name: Reloading
    results: error
  - name: Stopping
    results: error
  - name: Status
    params: msg string
    results: error
  - name: Watchdog
    results: error
  - name: MainPID
    params: pid int
    results: error
  - doc: |-
      wrapInvalid restates the InvalidNotification sentinel fields around a cause,
      attaching the offending fields for diagnostics.
    name: wrapInvalid
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      resolveAddr turns a $NOTIFY_SOCKET value into the AF_UNIX name to bind/connect:
      a leading '@' marks the abstract namespace and is replaced by a NUL byte so the
      kernel treats sun_path[0]==0 as abstract.
    name: resolveAddr
    params: raw string
    results: string
  - doc: |-
      encodePayload joins a NAME=value state map into the newline-separated datagram
      body sd_notify expects. Order is not significant to the protocol. A name or
      value carrying the '\n' field delimiter (or a name carrying '=', the
      name/value delimiter) would forge extra fields in the datagram, so such a
      state is rejected with InvalidNotification rather than encoded.
    name: encodePayload
    params: state map[string]string
    results: body string, err error
  - doc: |-
      parsePayload splits a received datagram body into a NotificationValue, lifting
      STATUS / MAINPID into their typed fields. It returns InvalidNotification when a
      non-empty line carries no '=', or an assignment sd_notify(3) defines carries a
      value out of its bounds (checkAssignments). A name given twice keeps its last
      value.
    name: parsePayload
    params: body string
    results: value coreproc.NotificationValue, err error
  - doc: |-
      mainPIDFromState extracts MAINPID as an int, returning 0 when absent and a
      typed InvalidNotification when present but not a base-10 integer.
    name: mainPIDFromState
    params: state map[string]string
    results: pid int, err error
  - doc: |-
      watchdogInterval parses a $WATCHDOG_USEC value (microseconds) into a duration,
      for the process whose PID is self, given the $WATCHDOG_PID value pidRaw.
      ok is false when raw is empty, not a positive base-10 integer, or larger than
      a time.Duration holds, and when pidRaw is set and does not name self —
      mirroring sd_watchdog_enabled's "watchdog disabled" result.
    name: watchdogInterval
    params: raw, pidRaw string, self int
    results: d time.Duration, ok bool
  - doc: |-
      watchdogIsOurs reports whether a $WATCHDOG_PID value addresses the process
      self. An unset variable addresses whoever reads $WATCHDOG_USEC, as in
      sd_watchdog_enabled(3); a value that is not a PID addresses nobody.
    name: watchdogIsOurs
    params: pidRaw string, self int
    results: bool
  - name: WatchdogInterval
    results: d time.Duration, ok bool
imports:
  binary: encoding/binary
  bytes: bytes
  context: context
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  math: math
  net: net
  os: os
  strconv: strconv
  strings: strings
  syscall: syscall
  time: time
  utf8: unicode/utf8
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/systemd/notify
  name: notify
  purpose: "Package notify — the supervisor (listener) side on Linux: SO_PASSCRED."
types:
  - doc: |-
      listener is the Listener implementation on Linux and FreeBSD: it owns a
      unixgram socket on which the kernel stamps every datagram with its sender's
      credentials — SO_PASSCRED on Linux, LOCAL_CREDS_PERSISTENT on FreeBSD
      (enableCreds) —, and removes its backing path (if any) on Close.
    fields:
      - name: conn
        type: "*net.UnixConn"
      - name: path
        type: string
      - name: tempDir
        type: string
    kind: struct
    methods:
      - doc: |-
          read receives one datagram. Go's ReadMsgUnix passes MSG_CMSG_CLOEXEC on
          Linux, so every descriptor it carried arrives close-on-exec, atomically.
        name: read
        params: buf, oob []byte
        recv: l *listener
        results: n, oobn, recvFlags int, err error
      - doc: |-
          Recv blocks for the next datagram and returns it parsed (see Listen): the
          kernel-verified sender, the descriptors it carried, every assignment
          sd_notify(3) defines within its bounds. A datagram it refuses has every
          descriptor it carried closed. The descriptors arrive close-on-exec,
          atomically (MSG_CMSG_CLOEXEC, read): no spawn running meanwhile inherits one.
        name: Recv
        recv: l *listener
        results: value coreproc.NotificationValue, err error
      - doc: |-
          recv is Recv with a control buffer of oobSize bytes: a smaller one makes
          the kernel truncate the control data (MSG_CTRUNC), which the tests need.
        name: recv
        params: oobSize int
        recv: l *listener
        results: value coreproc.NotificationValue, err error
      - doc: |-
          Close releases the socket, unblocks any in-flight Recv, and removes the backing
          temp directory (pathname sockets only; abstract sockets vanish on close).
        name: Close
        recv: l *listener
        results: error
    name: listener
  - doc: |-
      sender is a datagram's sender as the kernel stamped it: SCM_CREDENTIALS on
      Linux, SCM_CREDS2 on FreeBSD.
    fields:
      - name: pid
        type: int
      - name: uid
        type: int
      - name: gid
        type: int
    kind: struct
    name: sender
  - doc: control is what a datagram's control messages carried.
    fields:
      - doc: cred is the sender's credentials, nil when absent.
        name: cred
        type: "*sender"
      - doc: files are SCM_RIGHTS' descriptors, in order.
        name: files
        type: "[]int"
      - doc: pidfd is SCM_PIDFD's descriptor, -1 when absent.
        name: pidfd
        type: int
    kind: struct
    methods:
      - doc: take records one control message.
        name: take
        params: scm *syscall.SocketControlMessage
        recv: d *control
      - doc: closeAll closes every descriptor the datagram carried.
        name: closeAll
        recv: d *control
      - doc: |-
          value checks the datagram and builds its NotificationValue, handing over
          the descriptors: the barrier, the main process's pidfd, the ones to store,
          the sender's pidfd. Descriptors no assignment calls for are closed.
        name: value
        params: body []byte, recvFlags int, full bool
        recv: d *control
        results: coreproc.NotificationValue, error
      - doc: |-
          handOverFiles gives value the descriptors its assignments call for, as
          systemd's manager does: BARRIER=1 is one descriptor and nothing else is
          read from its datagram; MAINPIDFD=1 takes the first descriptor as the main
          process's pidfd; FDSTORE=1 keeps the rest; any other is closed.
        name: handOverFiles
        params: value *coreproc.NotificationValue
        recv: d *control
        results: error
      - doc: |-
          mainPIDFD takes the first descriptor as the new main process's pidfd and
          its PID as MainPID: a pidfd's on Linux, read from /proc/self/fdinfo, a
          process descriptor's on FreeBSD, read by pdgetpid(2) (pidfdPID).
        name: mainPIDFD
        params: value *coreproc.NotificationValue
        recv: d *control
        results: error
      - doc: take1 hands over the first descriptor.
        name: take1
        recv: d *control
        results: "[]*os.File"
      - doc: takeAll hands over every remaining descriptor.
        name: takeAll
        recv: d *control
        results: "[]*os.File"
    name: control
  - doc: |-
      writeDeadliner is everything the send needs of a connection: a bound and the
      write it bounds. Taking it rather than *net.UnixConn is also what makes the
      two testable without a socket.
    kind: named
    name: writeDeadliner
    underlying: |-
      interface {
      	SetWriteDeadline(t time.Time) error
      	Write(b []byte) (n int, err error)
      }
vars:
  - doc: |-
      assignmentRules bounds the value of each assignment sd_notify(3) defines
      (kitsunium/sdk#730): a flag is 1, a PID positive and decimal, a count of
      microseconds decimal, a name printable. A name it does not list is not
      sd_notify's to bound and is kept as it came.
    items:
      - name: assignmentRules
        value: |-
          map[string]func(string) bool{
          	"READY":               isOne,
          	"RELOADING":           isOne,
          	"STOPPING":            isOne,
          	"FDSTORE":             isOne,
          	"FDSTOREREMOVE":       isOne,
          	"BARRIER":             isOne,
          	"MAINPIDFD":           isOne,
          	"RESTART_RESET":       isOne,
          	"STATUS":              utf8.ValidString,
          	"EXIT_STATUS":         utf8.ValidString,
          	"MAINPID":             isPID,
          	"WATCHDOG":            isWatchdog,
          	"WATCHDOG_USEC":       isUint64,
          	"EXTEND_TIMEOUT_USEC": isUint64,
          	"MONOTONIC_USEC":      isUint64,
          	"MAINPIDFDID":         isUint64,
          	"ERRNO":               isErrno,
          	"BUSERROR":            isErrorName,
          	"VARLINKERROR":        isErrorName,
          	"NOTIFYACCESS":        isNotifyAccess,
          	"FDNAME":              fdNameValid,
          	"FDPOLL":              isBoolDigit,
          }
    name: assignmentRules
