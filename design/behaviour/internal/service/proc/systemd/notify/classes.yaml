# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxNameBytes bounds FDNAME=, BUSERROR= and VARLINKERROR=: systemd's
      FDNAME_MAX, the longest descriptor name LISTEN_FDNAMES carries.
    items:
      - name: maxNameBytes
        type: int
        value: "255"
    name: maxNameBytes
  - doc: "pidBits sizes a PID: a pid_t, positive."
    items:
      - name: pidBits
        type: int
        value: "31"
    name: pidBits
  - grouped: true
    items:
      - doc: tempDirPrefix opens the name of the private directory Listen binds in.
        name: tempDirPrefix
        type: string
        value: "\"sdnotify-\""
      - doc: socketName is the socket's name in that directory.
        name: socketName
        type: string
        value: "\"notify\""
    name: tempDirPrefix
  - doc: |-
      soPassPIDFD is SO_PASSPIDFD (Linux 6.5, asm-generic 76 on every
      architecture this package builds for; the stdlib exports no name): every
      datagram then carries a pidfd on its sender (SCM_PIDFD).
    items:
      - name: soPassPIDFD
        type: int
        value: "76"
    name: soPassPIDFD
  - doc: scmPIDFD is SCM_PIDFD, the control message type of that pidfd.
    items:
      - name: scmPIDFD
        type: int32
        value: "0x04"
    name: scmPIDFD
  - doc: |-
      payloadBufSize bounds a received datagram body; sd_notify payloads are short
      text blocks, so 4 KiB comfortably holds any realistic field set.
    items:
      - name: payloadBufSize
        type: int
        value: "4096"
    name: payloadBufSize
  - doc: |-
      maxPassedFiles is SCM_MAX_FD on Linux, the most descriptors one datagram
      carries; FreeBSD has no such bound of its own, and its control buffer is
      sized to the same 253.
    items:
      - name: maxPassedFiles
        type: int
        value: "253"
    name: maxPassedFiles
  - doc: fdBytes is the size of one descriptor in a control message.
    items:
      - name: fdBytes
        type: int
        value: "4"
    name: fdBytes
  - doc: envNotifySocket is the environment variable naming the notify datagram socket.
    items:
      - name: envNotifySocket
        value: "\"NOTIFY_SOCKET\""
    name: envNotifySocket
  - doc: |-
      envWatchdogUsec is the environment variable carrying the watchdog timeout, in
      microseconds, that a supervisor sets for its child.
    items:
      - name: envWatchdogUsec
        value: "\"WATCHDOG_USEC\""
    name: envWatchdogUsec
  - doc: |-
      envWatchdogPID is the environment variable naming the one process the
      watchdog timeout is meant for; a child inheriting the environment is not it.
    items:
      - name: envWatchdogPID
        value: "\"WATCHDOG_PID\""
    name: envWatchdogPID
  - doc: |-
      exitDataErr mirrors EX_DATAERR (sysexits.h): a received datagram was malformed.
      It matches the InvalidNotification sentinel's exit code in core/proc.
    items:
      - name: exitDataErr
        type: int
        value: "65"
    name: exitDataErr
  - doc: |-
      exitOSErr mirrors EX_OSERR (sysexits.h): an OS-level send/socket op failed. It
      matches the NotifyFailed / ListenFailed sentinels' exit code in core/proc.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      exitNoPerm mirrors EX_NOPERM (sysexits.h): a credential check failed. It
      matches the CredentialMismatch sentinel's exit code in core/proc.
    items:
      - name: exitNoPerm
        type: int
        value: "77"
    name: exitNoPerm
  - doc: |-
      decimalBase is the radix for parsing protocol integer fields (MAINPID,
      WATCHDOG_USEC), all base-10 per the sd_notify spec.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: int64Bits sizes strconv.ParseInt for the 64-bit WATCHDOG_USEC microsecond count.
    items:
      - name: int64Bits
        type: int
        value: "64"
    name: int64Bits
  - doc: |-
      maxWatchdogUsec is the largest $WATCHDOG_USEC a time.Duration can hold: past
      it, usec * time.Microsecond wraps, and 9223372036854775807 read as -1µs with
      ok true — a ticker built on half of it panics.
    items:
      - name: maxWatchdogUsec
        type: int64
        value: math.MaxInt64 / int64(time.Microsecond)
    name: maxWatchdogUsec
