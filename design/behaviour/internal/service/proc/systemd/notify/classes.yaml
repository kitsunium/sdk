# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      payloadBufSize bounds a received datagram body; sd_notify payloads are short
      text blocks, so 4 KiB comfortably holds any realistic field set.
    items:
      - name: payloadBufSize
        type: int
        value: "4096"
    name: payloadBufSize
  - doc: |-
      oobBufSize bounds the out-of-band control buffer that carries the single
      SCM_CREDENTIALS message; 1 KiB is far larger than one ucred cmsg.
    items:
      - name: oobBufSize
        type: int
        value: "1024"
    name: oobBufSize
  - doc: envNotifySocket is the environment variable naming the notify datagram socket.
    items:
      - name: envNotifySocket
        value: "\"NOTIFY_SOCKET\""
    name: envNotifySocket
  - doc: |-
      envWatchdogUsec is the environment variable carrying the watchdog timeout, in
      microseconds, that a supervisor sets for its child.
    items:
      - name: envWatchdogUsec
        value: "\"WATCHDOG_USEC\""
    name: envWatchdogUsec
  - doc: |-
      envWatchdogPID is the environment variable naming the one process the
      watchdog timeout is meant for; a child inheriting the environment is not it.
    items:
      - name: envWatchdogPID
        value: "\"WATCHDOG_PID\""
    name: envWatchdogPID
  - doc: |-
      exitDataErr mirrors EX_DATAERR (sysexits.h): a received datagram was malformed.
      It matches the InvalidNotification sentinel's exit code in core/proc.
    items:
      - name: exitDataErr
        type: int
        value: "65"
    name: exitDataErr
  - doc: |-
      exitOSErr mirrors EX_OSERR (sysexits.h): an OS-level send/socket op failed. It
      matches the NotifyFailed / ListenFailed sentinels' exit code in core/proc.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      exitNoPerm mirrors EX_NOPERM (sysexits.h): a credential check failed. It
      matches the CredentialMismatch sentinel's exit code in core/proc.
    items:
      - name: exitNoPerm
        type: int
        value: "77"
    name: exitNoPerm
  - doc: |-
      decimalBase is the radix for parsing protocol integer fields (MAINPID,
      WATCHDOG_USEC), all base-10 per the sd_notify spec.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: int64Bits sizes strconv.ParseInt for the 64-bit WATCHDOG_USEC microsecond count.
    items:
      - name: int64Bits
        type: int
        value: "64"
    name: int64Bits
  - doc: |-
      maxWatchdogUsec is the largest $WATCHDOG_USEC a time.Duration can hold: past
      it, usec * time.Microsecond wraps, and 9223372036854775807 read as -1µs with
      ok true — a ticker built on half of it panics.
    items:
      - name: maxWatchdogUsec
        type: int64
        value: math.MaxInt64 / int64(time.Microsecond)
    name: maxWatchdogUsec
