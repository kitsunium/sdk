# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxNameBytes is systemd's FDNAME_MAX: the longest name LISTEN_FDNAMES
      carries.
    items:
      - name: maxNameBytes
        type: int
        value: "255"
    name: maxNameBytes
  - doc: |-
      unknownName is what a descriptor handed without a name is announced as, as
      sd_listen_fds_with_names(3) names every descriptor when LISTEN_FDNAMES is
      absent.
    items:
      - name: unknownName
        type: string
        value: "\"unknown\""
    name: unknownName
  - doc: |-
      exitUsage is sysexits.h EX_USAGE (64), restated to wrap the central
      INVALID_FD_NAME sentinel without re-Defining the code.
    items:
      - name: exitUsage
        type: int
        value: "64"
    name: exitUsage
  - doc: |-
      listenFdStart is SD_LISTEN_FDS_START: the first inherited socket is fd 3, after
      stdin/stdout/stderr.
    items:
      - name: listenFdStart
        type: int
        value: "3"
    name: listenFdStart
  - doc: |-
      exitOSErr is sysexits.h EX_OSERR (71), restated to wrap a cause under the
      central LISTEN_FAILED sentinel without re-Defining the code.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: Environment-variable names of the sd_listen_fds protocol.
    grouped: true
    items:
      - name: envFds
        type: string
        value: "\"LISTEN_FDS\""
      - name: envPID
        type: string
        value: "\"LISTEN_PID\""
      - name: envFdNames
        type: string
        value: "\"LISTEN_FDNAMES\""
    name: envFds
files:
  - decls: []
    name: doc.go
  - decls:
      - maxNameBytes
      - unknownName
      - exitUsage
      - NamedFileValue
      - CheckName
      - announced
      - wrapInvalidName
    name: names.go
  - decls:
      - listenFdStart
      - exitOSErr
      - envFds
      - dropErr
      - setCloexec
      - wrapListen
      - fdCount
      - pidMatches
      - splitNames
      - Files
      - Listeners
      - WithNames
      - Prepare
      - PrepareFiles
      - checkNames
      - activate
      - closeAll
      - listenerFile
      - fileOrWrap
      - envWithout
      - clearEnv
    name: sdlisten_unix.go
functions:
  - name: CheckName
    params: name string
    results: error
  - doc: announced is the name LISTEN_FDNAMES gives a descriptor named name.
    name: announced
    params: name string
    results: string
  - doc: |-
      wrapInvalidName is the central InvalidFDName sentinel naming the name and
      why it was refused.
    name: wrapInvalidName
    params: name, why string
    results: error
  - doc: |-
      dropErr intentionally discards a non-actionable cleanup error (a best-effort
      close or env unset), so the error audit treats the discard as deliberate.
    name: dropErr
    params: err error
  - doc: |-
      setCloexec sets FD_CLOEXEC on an inherited activation socket, as
      sd_listen_fds(3) does.

      The socket arrives without it — the activator cleared it so exec could pass
      it — and an inherited descriptor left that way is inherited again by every
      process this one spawns: a helper started under a lowered identity would
      hold the service's listening socket (:443, say) and could accept on it. The
      previous behaviour CLEARED the flag "so a re-exec keeps the socket"; a
      re-exec that wants it passes it explicitly, through Prepare or ExtraFiles,
      both of which dup it for the child.
    name: setCloexec
    params: fd int
  - doc: wrapListen wraps an fd/socket cause onto the central ListenFailed sentinel.
    name: wrapListen
    params: cause error, fields ...errs.FieldValue
    results: error
  - doc: |-
      fdCount parses LISTEN_FDS and verifies LISTEN_PID. ok is false (no error) when
      the activation set is empty or addressed to a different pid; err is non-nil
      only when LISTEN_FDS is present but malformed.
    name: fdCount
    results: n int, ok bool, err error
  - doc: |-
      pidMatches reports whether LISTEN_PID is absent (accepted) or equals this
      process's pid. A set-but-mismatched LISTEN_PID means the fds are not ours.
    name: pidMatches
    results: bool
  - doc: |-
      splitNames returns n stream names from LISTEN_FDNAMES (colon-separated),
      padding with "" when fewer names than fds are supplied.
    name: splitNames
    params: n int
    results: "[]string"
  - name: Files
    params: unsetEnv bool
    results: files []*os.File, err error
  - name: Listeners
    params: unsetEnv bool
    results: lns []net.Listener, err error
  - name: WithNames
    params: unsetEnv bool
    results: byName map[string][]*os.File, err error
  - name: Prepare
    params: child *coreproc.Spec, named map[string]net.Listener
    results: error
  - name: PrepareFiles
    params: child *coreproc.Spec, files []NamedFileValue
    results: error
  - doc: checkNames checks every name as CheckName does.
    name: checkNames
    params: names []string
    results: error
  - doc: |-
      activate puts acts at fd 3 on in child and the protocol's variables in its
      environment: LISTEN_FDS and LISTEN_FDNAMES in Env, LISTEN_PID in PIDEnv —
      set by the spawn to the child's own PID after the fork.
    name: activate
    params: child *coreproc.Spec, acts []*os.File, names []string
  - doc: closeAll closes files this package duplicated and no longer hands over.
    name: closeAll
    params: files []*os.File
  - doc: |-
      listenerFile returns the dup'd *os.File backing a TCP or Unix listener; other
      listener kinds have no portable fd and are rejected.
    name: listenerFile
    params: ln net.Listener
    results: f *os.File, err error
  - doc: fileOrWrap passes through a recovered *os.File or wraps the File() error.
    name: fileOrWrap
    params: f *os.File, ferr error
    results: file *os.File, err error
  - doc: |-
      envWithout returns env with any KEY= entries for the given keys removed, so
      Prepare can re-set the activation variables without duplicates.
    name: envWithout
    params: env []string, keys ...string
    results: "[]string"
  - doc: |-
      clearEnv unsets the activation environment variables so a grandchild does not
      re-inherit them.
    name: clearEnv
imports:
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  maps: maps
  net: net
  os: os
  slices: slices
  strconv: strconv
  strings: strings
  syscall: syscall
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/systemd/listen
  name: listen
  purpose: Package listen — non-Unix stub.
types:
  - fields:
      - doc: Name is the descriptor's name; empty is announced as "unknown".
        name: Name
        type: string
      - doc: File is the descriptor; PrepareFiles neither duplicates nor closes it.
        name: File
        type: "*os.File"
    kind: struct
    name: NamedFileValue
