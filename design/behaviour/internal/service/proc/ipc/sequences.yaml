        to: listen
  - of: (*Listener).Accept
    participants:
      - id: caller
        kind: actor
      - id: (*Listener).Accept
        kind: self
      - id: l.ln.accept
        kind: internal
      - id: l.mu.Lock
        kind: value
      - id: l.mu.Unlock
        kind: value
      - id: l.admits
        kind: internal
      - id: closeBestEffort
        kind: internal
    steps:
      - loop:
          do:
            - bind: c, p, creds, err
              eval: l.ln.accept()
              to: l.ln.accept
            - opt:
                do:
                  - eval: l.mu.Lock()
                    to: l.mu.Lock
                  - bind: closed
                    eval: l.closed
                  - eval: l.mu.Unlock()
                    to: l.mu.Unlock
                  - opt:
                      do:
                        - return: nil, errs.Wrap(coreipc.Closed, errs.WrapParams{}, errs.String("path", l.cfg.Path))
                      when: closed
                  - return: nil, errs.Wrap(coreipc.ListenFailed, errs.WrapParams{}, errs.String("path", l.cfg.Path), errs.String("cause", err.Error()))
                when: err != nil
            - opt:
                do:
                  - eval: closeBestEffort(c, l.cfg.Path)
                    to: closeBestEffort
                  - eval: l.mu.Lock()
                    to: l.mu.Lock
                  - op: ++
                    set: l.refused
                  - eval: l.mu.Unlock()
                    to: l.mu.Unlock
                  - continue: true
                init:
                  bind: err
                  eval: l.admits(p, creds)
                  to: l.admits
                when: err != nil
            - return: "&coreipc.Conn{Conn: c, Peer: p}, nil"
          forever: true
  - of: (*Listener).Refused
