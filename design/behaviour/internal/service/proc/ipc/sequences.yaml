  - of: withFiles
    steps:
      - return: "&fileConn{UnixConn: c, peer: peer}"
  - of: (*fileConn).SendFiles
    participants:
      - id: caller
        kind: actor
      - id: (*fileConn).SendFiles
        kind: self
      - id: fdPassRefused
        kind: internal
      - id: c.WriteMsgUnix
        kind: value
    steps:
      - switch:
          cases:
            - case: "!c.peer.Verified"
              do:
                - return: fdPassRefused("the kernel did not name the peer", nil)
                  to: fdPassRefused
            - case: len(payload) == 0
              do:
                - return: fdPassRefused("an empty payload carries no descriptor", nil)
                  to: fdPassRefused
      - bind: fds
        eval: make([]int, 0, len(files))
      - loop:
          do:
            - set: fds
              value: append(fds, int(f.Fd()))
          key: _
          range: files
          value: f
      - opt:
          do:
            - return: fdPassRefused("the send failed", err)
              to: fdPassRefused
          init:
            bind: _, _, err
            eval: c.WriteMsgUnix(payload, syscall.UnixRights(fds...), nil)
            to: c.WriteMsgUnix
          when: err != nil
      - return: nil
  - of: (*fileConn).RecvFiles
    participants:
      - id: caller
        kind: actor
      - id: (*fileConn).RecvFiles
        kind: self
      - id: c.ReadMsgUnix
        kind: value
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, nil, fdPassRefused("max is not positive", nil)
          when: max <= 0
      - bind: oob
        eval: make([]byte, syscall.CmsgSpace(max*fdBytes))
      - bind: n, oobn, flags, _, rerr
        eval: c.ReadMsgUnix(buf, oob)
        to: c.ReadMsgUnix
      - opt:
          do:
            - return: n, nil, fdPassRefused("the receive failed", rerr)
          when: rerr != nil
      - bind: messages, perr
        eval: syscall.ParseSocketControlMessage(oob[:oobn])
        to: syscall
      - opt:
          do:
            - return: n, nil, fdPassRefused("the control message did not parse", perr)
          when: perr != nil
      - loop:
          do:
            - bind: fds, uerr
              eval: syscall.ParseUnixRights(&messages[i])
              to: syscall
            - opt:
                do:
                  - continue: true
                when: uerr != nil
            - loop:
                do:
                  - set: files
                    value: append(files, os.NewFile(uintptr(fd), "ipc-passed"))
                key: _
                range: fds
                value: fd
          key: i
          range: messages
      - opt:
          do:
            - return: n, files, fdPassRefused("truncated", nil)
          when: flags&syscall.MSG_CTRUNC != 0
      - return: n, files, nil
  - of: (*Config).validate
    participants:
      - id: caller
        kind: actor
      - id: (*Config).validate
        kind: self
      - id: errs
        kind: package
      - id: checkSIDs
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.Path == "" || !filepath.IsAbs(c.Path)
              do:
                - return: errs.Wrap(coreipc.Misconfigured, errs.WrapParams{}, errs.String("rule", "path must be absolute"))
                  to: errs
