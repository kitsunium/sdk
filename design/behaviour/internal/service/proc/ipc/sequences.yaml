      - id: errs
        kind: package
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: errs.Wrap(coreipc.PeerRefused, errs.WrapParams{}, errs.String("reason", "kernel did not name the peer"))
                    to: errs
                when: named
            - return: nil
          when: "!p.Verified"
      - bind: allowedGroup
        eval:
          closure:
            params: gid int
            results: bool
            steps:
              - return: slices.Contains(cfg.AllowGIDs, gid)
                to: slices
      - opt:
          do:
            - return: nil
          when: p.UID == self || slices.Contains(cfg.AllowUIDs, p.UID) || allowedGroup(p.GID) || slices.ContainsFunc(groups, allowedGroup)
      - return: errs.Wrap(coreipc.PeerRefused, errs.WrapParams{}, errs.Int("uid", p.UID), errs.Int("gid", p.GID))
        to: errs
  - of: NewDialer
    participants:
      - id: caller
        kind: actor
      - id: NewDialer
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: cfg.validate()
            to: cfg.validate
          when: err != nil
      - bind: own
        eval: |-
          Config{
          		Path: cfg.Path, AllowUIDs: slices.Clone(cfg.AllowUIDs), AllowGIDs: slices.Clone(cfg.AllowGIDs),
          		AllowSIDs: slices.Clone(cfg.AllowSIDs),
          	}
      - return: "&Dialer{cfg: own}, nil"
  - of: (*Dialer).Dial
    participants:
      - id: caller
        kind: actor
      - id: (*Dialer).Dial
        kind: self
      - id: dial
        kind: internal
    steps:
      - return: dial(ctx, &d.cfg)
        to: dial
  - of: Dial
    participants:
      - id: caller
        kind: actor
      - id: Dial
        kind: self
      - id: cfg.validate
        kind: internal
      - id: dial
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: cfg.validate()
            to: cfg.validate
          when: err != nil
      - return: dial(ctx, cfg)
        to: dial
  - of: RuntimeDir
    participants:
      - id: caller
        kind: actor
      - id: RuntimeDir
        kind: self
      - id: RuntimeDirOr
        kind: internal
    steps:
      - return: RuntimeDirOr(app, filepath.Join(os.TempDir(), app+"-"+strconv.Itoa(os.Geteuid())))
        to: RuntimeDirOr
  - of: RuntimeDirOr
    participants:
      - id: caller
        kind: actor
      - id: RuntimeDirOr
        kind: self
      - id: strings
        kind: stdlib
      - id: os
        kind: stdlib
      - id: filepath
        kind: stdlib
    steps:
      - opt:
          do:
            - return: d
          init:
            bind: d, _, _
            eval: strings.Cut(os.Getenv("RUNTIME_DIRECTORY"), ":")
            to: strings
          when: d != "" && filepath.IsAbs(d)
      - opt:
          do:
            - return: filepath.Join(d, app)
              to: filepath
          init:
            bind: d
            eval: os.Getenv("XDG_RUNTIME_DIR")
            to: os
          when: d != "" && filepath.IsAbs(d)
      - opt:
          do:
            - opt:
                do:
                  - return: filepath.Join(d, app)
                    to: filepath
                init:
                  bind: d
                  eval: os.Getenv("LOCALAPPDATA")
                  to: os
                when: d != ""
          when: runtime.GOOS == "windows"
      - return: fallback
  - of: closeBestEffort
    participants:
      - id: caller
        kind: actor
      - id: closeBestEffort
        kind: self
      - id: c.Close
        kind: value
      - id: log
        kind: stdlib
    steps:
      - opt:
          do:
            - eval: "log.Printf(\"ipc: closing a connection on %s: %v\", path, err)"
              to: log
          init:
            bind: err
            eval: c.Close()
            to: c.Close
          when: err != nil
  - of: peerOf
    participants:
      - id: caller
        kind: actor
      - id: peerOf
        kind: self
      - id: c.SyscallConn
        kind: value
      - id: raw.Control
        kind: value
    steps:
      - bind: raw, err
        eval: c.SyscallConn()
        to: c.SyscallConn
      - opt:
          do:
            - return: "coreipc.PeerValue{UID: -1, GID: -1}"
          when: err != nil
      - var:
          name: cred
          type: "*syscall.Ucred"
      - var:
          name: credErr
          type: error
      - opt:
          do:
            - return: "coreipc.PeerValue{UID: -1, GID: -1}"
          init:
            bind: err
            eval: |-
              raw.Control(func(fd uintptr) {
              		cred, credErr = syscall.GetsockoptUcred(int(fd), syscall.SOL_SOCKET, syscall.SO_PEERCRED)
              	})
            to: raw.Control
          when: err != nil || credErr != nil || cred == nil
      - return: "coreipc.PeerValue{UID: int(cred.Uid), GID: int(cred.Gid), PID: int(cred.Pid), Verified: true}"
  - of: peerGroups
    participants:
      - id: caller
        kind: actor
      - id: peerGroups
        kind: self
      - id: c.SyscallConn
        kind: value
      - id: readPeerGroups
        kind: internal
    steps:
      - bind: raw, err
        eval: c.SyscallConn()
        to: c.SyscallConn
      - opt:
          do:
            - return: nil
          when: err != nil
      - bind: groups, need
        eval: readPeerGroups(raw, firstPeerGroups)
        to: readPeerGroups
      - opt:
          do:
            - set: groups, _
              to: readPeerGroups
              value: readPeerGroups(raw, need)
          when: groups == nil && need > firstPeerGroups && need <= maxPeerGroups
      - return: groups
  - of: readPeerGroups
    participants:
      - id: caller
        kind: actor
      - id: readPeerGroups
        kind: self
      - id: raw.Control
        kind: value
    steps:
      - bind: buf
        eval: make([]uint32, room)
      - bind: size
        eval: uint32(room * gidBytes)
      - var:
          name: errno
          type: syscall.Errno
      - opt:
          do:
            - return: nil, 0
          init:
            bind: err
            eval: |-
              raw.Control(func(fd uintptr) {
              		_, _, errno = syscall.Syscall6(getsockoptTrap, fd, syscall.SOL_SOCKET, soPeerGroups,
              			uintptr(unsafe.Pointer(&buf[0])), uintptr(unsafe.Pointer(&size)), 0)
              	})
            to: raw.Control
          when: err != nil
      - set: need
        value: int(size) / gidBytes
      - switch:
          cases:
            - case: errno == syscall.ERANGE
              do:
                - return: nil, need
            - case: errno != 0 || need > room
              do:
                - return: nil, 0
      - set: groups
        value: make([]int, need)
      - loop:
          do:
            - set: groups[i]
              value: int(buf[i])
          key: i
          range: need
      - return: groups, need
  - of: checkSIDs
    participants:
      - id: caller
        kind: actor
      - id: checkSIDs
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: len(sids) == 0
      - return: |-
          errs.Wrap(coreipc.Misconfigured, errs.WrapParams{}, errs.String("rule", "AllowSIDs is Windows's: a SID names no account here"),
          		errs.Int("sids", len(sids)))
        to: errs
  - of: socketAcceptor.accept
    participants:
      - id: caller
        kind: actor
      - id: socketAcceptor.accept
        kind: self
      - id: s.AcceptUnix
        kind: value
      - id: peerOf
        kind: internal
      - id: peerGroups
        kind: internal
      - id: withFiles
        kind: internal
    steps:
      - bind: c, err
        eval: s.AcceptUnix()
        to: s.AcceptUnix
      - opt:
          do:
            - return: nil, coreipc.PeerValue{}, nil, err
          when: err != nil
      - set: peer
        to: peerOf
        value: peerOf(c)
      - opt:
          do:
            - set: groups
              to: peerGroups
              value: peerGroups(c)
          when: s.groups
      - return: withFiles(c, peer), peer, groups, nil
        to: withFiles
  - of: socketPosture
    participants:
      - id: caller
        kind: actor
      - id: socketPosture
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: foreignUser
        eval: slices.ContainsFunc(cfg.AllowUIDs, func(uid int) bool { return uid != self && uid != 0 })
        to: slices
      - bind: groups
        eval: slices.Compact(slices.Sorted(slices.Values(cfg.AllowGIDs)))
        to: slices
      - switch:
          cases:
            - case: foreignUser || len(groups) > 1
              do:
                - return: "posture{mode: everyAccount, gid: -1, others: true}"
            - case: len(groups) == 1
              do:
                - return: "posture{mode: ownerAndGroup, gid: groups[0]}"
      - return: "posture{mode: ownerOnly, gid: -1}"
  - of: checkReach
    participants:
      - id: caller
        kind: actor
      - id: checkReach
        kind: self
      - id: os
        kind: stdlib
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!p.others || named"
      - bind: info, err
        eval: os.Lstat(dir)
        to: os
      - opt:
          do:
            - return: |-
                errs.Wrap(coreipc.DirectoryUnsafe, errs.WrapParams{}, errs.String("rule", "the directory cannot be read"),
                			errs.String("path", dir), errs.String("cause", err.Error()))
              to: errs
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(coreipc.DirectoryUnsafe, errs.WrapParams{},
                			errs.String("rule", "searchable by anyone, and the lists open the socket to every account where the kernel names no peer"),
                			errs.String("path", dir), errs.String("mode", info.Mode().Perm().String()))
              to: errs
          when: info.Mode().Perm()&anybodySearches != 0
      - return: nil
  - of: listen
    participants:
      - id: caller
        kind: actor
      - id: listen
        kind: self
      - id: prepareDir
        kind: internal
      - id: socketPosture
        kind: internal
      - id: checkReach
        kind: internal
      - id: clearStale
        kind: internal
      - id: bindSocket
        kind: internal
      - id: listenBound
        kind: internal
    steps:
      - bind: dir, self
        eval: filepath.Dir(cfg.Path), os.Geteuid()
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: prepareDir(dir)
            to: prepareDir
          when: err != nil
      - bind: p
        eval: socketPosture(cfg, self)
        to: socketPosture
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: checkReach(dir, p, kernelNamesPeer)
            to: checkReach
          when: err != nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: clearStale(cfg)
            to: clearStale
          when: err != nil
      - bind: f, err
        eval: bindSocket(cfg.Path, p)
        to: bindSocket
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: ln, err
        eval: listenBound(f, cfg.Path)
        to: listenBound
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&Listener{cfg: *cfg, ln: socketAcceptor{UnixListener: ln, groups: len(cfg.AllowGIDs) > 0}, self: self}, nil"
  - of: clearStale
    participants:
      - id: caller
        kind: actor
      - id: clearStale
        kind: self
      - id: os
        kind: stdlib
      - id: errs
        kind: package
      - id: ownerOf
        kind: internal
      - id: net
        kind: stdlib
      - id: closeBestEffort
        kind: internal
    steps:
      - bind: info, err
        eval: os.Lstat(cfg.Path)
        to: os
      - switch:
          cases:
            - case: errors.Is(err, os.ErrNotExist)
              do:
                - return: nil
            - case: err != nil
              do:
                - return: errs.Wrap(coreipc.ListenFailed, errs.WrapParams{}, errs.String("path", cfg.Path), errs.String("cause", err.Error()))
                  to: errs
            - case: info.Mode()&os.ModeSocket == 0
              do:
                - return: |-
                    errs.Wrap(coreipc.DirectoryUnsafe, errs.WrapParams{}, errs.String("rule", "the socket path holds something that is not a socket"),
                    			errs.String("path", cfg.Path))
                  to: errs
      - opt:
          do:
            - return: errs.Wrap(coreipc.EndpointForeign, errs.WrapParams{}, errs.String("path", cfg.Path), errs.Int("uid", uid))
              to: errs
          init:
            bind: uid, known
            eval: ownerOf(info)
            to: ownerOf
          when: known && uid != os.Geteuid()
      - bind: c, err
        eval: net.DialTimeout("unix", cfg.Path, dialTimeout)
        to: net
      - opt:
          do:
            - eval: closeBestEffort(c, cfg.Path)
              to: closeBestEffort
            - return: errs.Wrap(coreipc.InUse, errs.WrapParams{}, errs.String("path", cfg.Path))
              to: errs
          when: err == nil
      - opt:
          do:
            - return: |-
                errs.Wrap(coreipc.InUse, errs.WrapParams{}, errs.String("path", cfg.Path),
                			errs.String("cause", "the socket's owner may be alive: "+err.Error()))
              to: errs
          when: "!nobodyListens(err)"
      - opt:
          do:
            - return: errs.Wrap(coreipc.ListenFailed, errs.WrapParams{}, errs.String("path", cfg.Path), errs.String("cause", err.Error()))
              to: errs
          init:
            bind: err
            eval: os.Remove(cfg.Path)
            to: os
          when: err != nil && !errors.Is(err, os.ErrNotExist)
      - return: nil
  - of: nobodyListens
    steps:
      - return: errors.Is(err, syscall.ECONNREFUSED) || errors.Is(err, syscall.ENOENT)
  - of: (*Listener).admits
    participants:
      - id: caller
        kind: actor
      - id: (*Listener).admits
        kind: self
      - id: admit
        kind: internal
    steps:
      - return: admit(p, groups, l.self, &l.cfg)
        to: admit
  - of: dial
    participants:
      - id: caller
        kind: actor
      - id: dial
        kind: self
      - id: dialWith
        kind: internal
    steps:
      - return: dialWith(ctx, cfg, os.Lstat, os.Geteuid())
        to: dialWith
  - of: dialWith
    participants:
      - id: caller
        kind: actor
      - id: dialWith
        kind: self
      - id: filepath
        kind: stdlib
      - id: checkDialDir
        kind: internal
      - id: ownersOf
        kind: internal
      - id: context
        kind: stdlib
      - id: d.DialContext
        kind: value
      - id: closeBestEffort
        kind: internal
      - id: peerOf
        kind: internal
      - id: peerGroups
        kind: internal
      - id: admit
        kind: internal
    steps:
      - bind: dir
        eval: filepath.Dir(cfg.Path)
        to: filepath
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coreipc.DialFailed, errs.WrapParams{}, errs.String("path", cfg.Path),
                			errs.String("cause", "nobody listens: the directory does not exist"))
          init:
            bind: _, err
            eval: lstat(dir)
          when: errors.Is(err, os.ErrNotExist)
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: checkDialDir(dir, lstat)
            to: checkDialDir
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: |-
                      nil, errs.Wrap(coreipc.EndpointForeign, errs.WrapParams{}, errs.String("path", cfg.Path),
                      				errs.Int("uid", uid), errs.Int("gid", gid))
                init:
                  bind: uid, gid, known
                  eval: ownersOf(info)
                  to: ownersOf
                when: known && !endpointAdmitted(uid, gid, euid, cfg)
          init:
            bind: info, err
            eval: lstat(cfg.Path)
          when: err == nil
      - bind: ctx, cancel
        eval: context.WithTimeout(ctx, dialTimeout)
        to: context
      - defer: cancel()
      - var:
          name: d
          type: net.Dialer
      - bind: c, err
        eval: d.DialContext(ctx, "unix", cfg.Path)
        to: d.DialContext
      - opt:
          do:
            - return: nil, errs.Wrap(coreipc.DialFailed, errs.WrapParams{}, errs.String("path", cfg.Path), errs.String("cause", err.Error()))
          when: err != nil
      - bind: uc, ok
        eval: c.(*net.UnixConn)
      - opt:
          do:
            - eval: closeBestEffort(c, cfg.Path)
              to: closeBestEffort
            - return: nil, errs.Wrap(coreipc.DialFailed, errs.WrapParams{}, errs.String("path", cfg.Path), errs.String("cause", "not a unix connection"))
          when: "!ok"
      - bind: p
        eval: peerOf(uc)
        to: peerOf
      - var:
          name: groups
          type: "[]int"
      - opt:
          do:
            - set: groups
              to: peerGroups
              value: peerGroups(uc)
          when: len(cfg.AllowGIDs) > 0
      - opt:
          do:
            - eval: closeBestEffort(c, cfg.Path)
              to: closeBestEffort
            - return: nil, err
          init:
            bind: err
            eval: admit(p, groups, euid, cfg)
            to: admit
          when: err != nil
      - return: "&coreipc.Conn{Conn: withFiles(uc, p), Peer: p}, nil"
