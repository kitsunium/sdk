      - lock:
          mutex: l.mu
      - return: l.refused
  - of: (*Listener).Addr
    participants:
      - id: caller
        kind: actor
      - id: (*Listener).Addr
        kind: self
      - id: l.ln.Addr
        kind: internal
    steps:
      - return: l.ln.Addr()
        to: l.ln.Addr
  - of: (*Listener).Path
    steps:
