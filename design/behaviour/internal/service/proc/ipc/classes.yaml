functions:
  - doc: |-
      bindSocket binds a Unix stream socket at path and gives the file p's group
      and mode, without listening yet: until listenBound, a connect(2) is refused
      (ECONNREFUSED), so no connection is made while the file still has the mode
      the umask gave it at bind — wider than p's, under a permissive umask. The
      returned file holds the socket; on failure nothing stays at path.
    name: bindSocket
    params: path string, p posture
    results: "*os.File, error"
  - doc: |-
      setPosture gives the bound socket file p's group, then p's mode. A group
      the file cannot take — this account is not a member, and is not root — is
      a refusal: left at its old group the socket would admit nobody the list
      names, and opened to everyone it would admit more than it names.
    name: setPosture
    params: path string, p posture
    results: error
  - doc: |-
      listenBound starts listening on the socket bindSocket bound at path and
      hands it to the net package, which removes path when the listener closes.
      f is closed either way; on failure nothing stays at path.
    name: listenBound
    params: f *os.File, path string
    results: "*net.UnixListener, error"
  - doc: listenOn calls listen(2) on the socket f holds.
    name: listenOn
    params: f *os.File
    results: error
  - doc: abandon closes a socket that will not listen and removes its file.
    name: abandon
    params: f *os.File, path string
  - doc: |-
      removeBestEffort removes the socket file this listen bound and gives up on:
      the refusal already says why, and a file that cannot be removed is a
      leftover the next Listen clears.
    name: removeBestEffort
    params: path string
  - doc: listenFailed is LISTEN_FAILED at path with its cause.
    name: listenFailed
    params: path, cause string
    results: error
  - doc: |-
      checkChain refuses the socket directory dir when another account could steer
      a component of the path ABOVE it. The socket directory's own entry is not
      judged here — [checkEntry] holds it to stricter rules — so the walk is over
      its parent, and dir need not exist yet: [prepareDir] runs this before it
      creates anything, so nothing is ever created inside a steered tree.
    name: checkChain
    params: dir string
    results: error
  - doc: |-
      checkHolder refuses a socket directory anybody could replace: one held by a
      directory anybody can write that has no sticky bit. [checkChain] judged the
      holder's own path first, so the lookup lands where that audit did.
    name: checkHolder
    params: dir string
    results: error
  - doc: |-
      steerable says whether another account could steer the path at step and,
      when one could, how — the kind a refusal names. steered is false when no
      account the deployment did not choose can.
    name: steerable
    params: step *pathchain.StepValue, self int
    results: kind string, steered bool
  - doc: |-
      ours reports whether info belongs to this process's user or to root. An
      owner that cannot be read belongs to nobody trusted — a gate does not guess
      — though on Unix it always can be read.
    name: ours
    params: info os.FileInfo, self int
    results: bool
  - doc: |-
      pathUnsafe is the PATH_UNSAFE refusal for step: the component that may be
      steered and how, the socket directory the caller configured, the mode of the
      directory holding the component, where an indirection leads and who owns
      what was found.
    name: pathUnsafe
    params: dir string, step *pathchain.StepValue, kind string
    results: error
  - doc: |-
      prepareDir creates dir 0700 when it is missing, then checks it. The path
      above dir is audited BEFORE anything is created, because Mkdir follows a
      link at a parent and would otherwise create the directory inside whatever
      tree the link names; and again after, with the rest of [checkDir], because a
      parent missing at the first audit may have been created by somebody else
      in between.
    name: prepareDir
    params: dir string
    results: error
  - doc: |-
      checkDir refuses a socket directory another account could write to, read
      through, replace or reach through a path it steers: every component above
      it first ([checkChain], PATH_UNSAFE), then its own entry ([checkEntry],
      DIRECTORY_UNSAFE), then the directory holding it ([checkHolder]).
    name: checkDir
    params: dir string
    results: error
  - doc: |-
      checkEntry refuses a socket directory whose own entry another account could
      write to or read through: it must be a real directory — not a link —, owned
      by this process's user, and writable by nobody else. Group or world search
      permission is allowed: that is how a deployment admits an on-call group,
      and without write permission nobody can plant an entry there.
    name: checkEntry
    params: dir string
    results: error
  - doc: |-
      checkDialDir is checkDir from the dialling side (#1092): the same chain and
      holder rules, and the same entry rules — a real directory that nobody but
      its owner can write — but no owner rule: the directory is the LISTENER's,
      usually another account's, and who may be dialled is the socket file's
      owner, which dialWith checks next (ENDPOINT_FOREIGN). A deployment that
      admits an on-call group gives the directory group search, and a client
      outside the group is refused by the kernel at the directory. lstat is the
      platform's, a test's double otherwise.
    name: checkDialDir
    params: dir string, lstat func(string) (os.FileInfo, error)
    results: error
  - doc: checkDialEntry is checkEntry without the owner rule.
    name: checkDialEntry
    params: dir string, lstat func(string) (os.FileInfo, error)
    results: error
  - doc: |-
      endpointAdmitted is the dialling side's owner set for the socket file: this
      account, an allowed user, or an allowed group.
    name: endpointAdmitted
    params: uid, gid, euid int, cfg *Config
    results: bool
  - doc: |-
      ownersOf is the UID and GID owning the file info describes; unknown for a
      nil info or one the platform does not describe with a Stat_t.
    name: ownersOf
    params: info os.FileInfo
    results: uid, gid int, known bool
  - doc: |-
      ownerOf is the UID owning the file info describes; unknown for a nil info
      or one the platform does not describe with a Stat_t.
    name: ownerOf
    params: info os.FileInfo
    results: uid int, known bool
  - doc: |-
      fdPassRefused wraps FDPassRefused with its reason and, when there is one,
      the cause.
    name: fdPassRefused
    params: reason string, cause error
    results: error
  - doc: withFiles wraps a connection so Conn.Conn offers FileSender and FileReceiver.
    name: withFiles
    params: c *net.UnixConn, peer coreipc.PeerValue
    results: net.Conn
  - doc: negative reports whether n cannot be a UID or a GID.
    name: negative
    params: n int
    results: bool
  - name: NewListener
    params: cfg *Config
    results: "*Listener, error"
  - doc: |-
      admit says whether p, whose supplementary groups the kernel gave as
      groups, may use a socket of account self under cfg. An unverified peer
      passed the directory, which is the only gate there is.
    name: admit
    params: p coreipc.PeerValue, groups []int, self int, cfg *Config
    results: error
  - doc: |-
      admitWhere is admit on a platform whose kernel names the peer (named) or
      does not. Where it does, a peer it did not name is an anomaly and is
      refused (#1093, ADR 0031) rather than let through as the directory's; where
      it does not, the directory is the gate and admitted it. A named peer is
      admitted for its user, or for its effective group or one of its
      supplementary groups (#1092) — the groups the kernel recorded with its
      credentials when it connected, never read again from the process.
    name: admitWhere
    params: p coreipc.PeerValue, groups []int, self int, cfg *Config, named bool
    results: error
  - name: NewDialer
    params: cfg *Config
    results: "*Dialer, error"
  - name: Dial
    params: ctx context.Context, cfg *Config
    results: "*coreipc.Conn, error"
  - name: RuntimeDir
    params: app string
    results: string
  - name: RuntimeDirOr
    params: app, fallback string
    results: string
  - doc: |-
      closeBestEffort closes a connection this package refuses or no longer
      needs. Its error changes nothing — the connection is abandoned either way —
      so it is logged, never returned in place of the verdict that caused it.
    name: closeBestEffort
    params: c io.Closer, path string
  - doc: |-
      peerOf asks the kernel who is at the other end of c: SO_PEERCRED, the
      credentials the peer had when it connected — or listened —, which it cannot
      forge.
    name: peerOf
    params: c *net.UnixConn
    results: coreipc.PeerValue
  - doc: |-
      peerGroups asks the kernel for the supplementary groups of the process at
      the other end of c (#1092): SO_PEERGROUPS, the group list of the very
      credentials SO_PEERCRED reads — recorded when the peer connected or
      listened, never read again from a process whose pid may since name another
      one. nil when the kernel does not answer (before 4.13): the peer is then
      judged on its effective group alone, which admits fewer, never more. A list
      longer than the first buffer is read once more at the length the kernel
      asked for.
    name: peerGroups
    params: c *net.UnixConn
    results: "[]int"
  - doc: |-
      readPeerGroups is one SO_PEERGROUPS read into room groups: the groups, or
      nil and — when the kernel said the list is longer (ERANGE) — how many it
      holds.
    name: readPeerGroups
    params: raw syscall.RawConn, room int
    results: groups []int, need int
  - doc: |-
      checkSIDs refuses a SID list: Unix has no SID, and a list it cannot honour
      would admit nobody it names while seeming to (#1349). An empty list is the
      only one there is here.
    name: checkSIDs
    params: sids []string
    results: error
  - doc: |-
      socketPosture is the narrowest posture that lets the accounts cfg names
      connect (#1092, the owner's decision of 2026-11-10): 0600 when it names
      none but this account and root; 0660 and the group when it names a single
      group and no other user — the kernel's own check then admits that group's
      members, supplementary ones included, and nobody else; 0666 when it names
      another user or several groups, which no one group can hold.
    name: socketPosture
    params: cfg *Config, self int
    results: posture
  - doc: |-
      checkReach refuses a socket every account may connect to in a directory
      every account may search, where the kernel names no peer (named false):
      nothing would gate it — not the directory, not the mode, not the
      admission, which admits a peer it cannot name. Where the kernel names
      peers, the admission refuses who the lists do not name, and a directory
      whose group is the allowed accounts' still keeps the others out first.
    name: checkReach
    params: dir string, p posture, named bool
    results: error
  - doc: |-
      listen opens the Unix socket at cfg.Path, once its directory is private
      and what was at the path is known to be a leftover. The socket's mode and
      group are set between bind(2) and listen(2) (bindSocket, listenBound): no
      connection completes before the socket is at the posture the lists ask
      for, whatever the umask made of it at bind.
    name: listen
    params: cfg *Config
    results: "*Listener, error"
  - doc: |-
      clearStale removes a socket nobody answers on, and refuses one somebody
      does. What is not a socket, or not ours, is never removed.
    name: clearStale
    params: cfg *Config
    results: error
  - doc: |-
      nobodyListens reports whether a failed dial says the socket has no owner:
      ECONNREFUSED — a socket file no process listens on, what a killed daemon
      leaves — or ENOENT, the file gone between the Lstat and the dial. Any other
      failure, EAGAIN and a timeout first, leaves the owner possibly alive.
    name: nobodyListens
    params: err error
    results: bool
  - doc: |-
      dial connects to the Unix socket at cfg.Path, once the path to its
      directory is known to be steered by nobody else, the directory to be this
      account's and its file this account's (or an allowed one's). A directory
      that does not exist is nobody listening — the first client of a daemon not
      started yet —, DIAL_FAILED, not an unsafe directory.
    name: dial
    params: ctx context.Context, cfg *Config
    results: "*coreipc.Conn, error"
  - doc: |-
      dialWith is dial with the file-owner reading and the effective uid
      injected, so a test can stand on either side of an account it cannot be.
      The directory may be another account's (#1092, [checkDialDir]); the socket
      file may be owned by this account, an allowed user or an allowed group, and
      is ENDPOINT_FOREIGN otherwise.
    name: dialWith
    params: ctx context.Context, cfg *Config, lstat func(string) (os.FileInfo, error), euid int
    results: "*coreipc.Conn, error"
imports:
  context: context
  coreipc: github.com/kitsunium/sdk/internal/core/proc/ipc
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  io: io
  log: log
  net: net
  os: os
  pathchain: github.com/kitsunium/sdk/internal/kernel/fs/pathchain
  runtime: runtime
  slices: slices
  strconv: strconv
  strings: strings
  sync: sync
  syscall: syscall
  time: time
  unsafe: unsafe
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/ipc
  name: ipc
  purpose: "Package ipc — the components ABOVE the socket's directory, and who could steer them: ADR 0083's rule, applied where the directory is the whole of the access control (ADR 0148)."
types:
  - doc: |-
      fileConn is a private connection that passes open files (#936): the Unix
      connection, and the peer the kernel named for it.
    fields:
      - name: ""
        role: embedded
        type: "*net.UnixConn"
      - name: peer
        type: coreipc.PeerValue
    kind: struct
    methods:
      - doc: SendFiles sends payload with files attached, to a named peer only.
        name: SendFiles
        params: payload []byte, files ...*os.File
        recv: c *fileConn
        results: error
      - doc: |-
          RecvFiles reads one message and at most max descriptors; the kernel closes
          those beyond max (MSG_CTRUNC), and the net package receives them
          close-on-exec.
        name: RecvFiles
        params: buf []byte, max int
        recv: c *fileConn
        results: n int, files []*os.File, err error
    name: fileConn
  - fields:
      - doc: |-
          Path is the socket's absolute path. Its directory is created 0700 when
          missing and refused when another account could write to it.
        name: Path
        type: string
      - doc: |-
          AllowUIDs and AllowGIDs admit peers besides this process's own user:
          an on-call group declared at deployment, say. The listener opens the
          socket file to them — 0660 and the group for one group, 0666 for
          another user or several groups — and, where the kernel names the
          peer (Peer.Verified), admits a peer by its user, its effective group
          or one of its supplementary groups. The directory must still let
          those accounts reach the socket, which is the deployment's to
          arrange — this package never widens a directory. Windows has no UID:
          there these two lists admit nobody, and AllowSIDs is the list.
        name: AllowUIDs
        type: "[]int"
      - doc: |-
          AllowUIDs and AllowGIDs admit peers besides this process's own user:
          an on-call group declared at deployment, say. The listener opens the
          socket file to them — 0660 and the group for one group, 0666 for
          another user or several groups — and, where the kernel names the
          peer (Peer.Verified), admits a peer by its user, its effective group
          or one of its supplementary groups. The directory must still let
          those accounts reach the socket, which is the deployment's to
          arrange — this package never widens a directory. Windows has no UID:
          there these two lists admit nobody, and AllowSIDs is the list.
        name: AllowGIDs
        type: "[]int"
      - doc: |-
          AllowSIDs admits, on Windows, accounts and groups besides this
          process's own account, written as SIDs ("S-1-5-32-545"). Each is
          checked by NewListener, NewDialer and Dial — an entry that is not a
          SID, or Everyone, Anonymous Logon or the Null SID, which stand for
          every caller, is MISCONFIGURED. The listener writes each into the
          pipe's DACL with the rights a client needs to read and write the pipe
          and no more — never FILE_GENERIC_WRITE, whose FILE_APPEND_DATA is
          FILE_CREATE_PIPE_INSTANCE on a pipe, so a listed account can open the
          pipe but never serve an instance of it —, then reads each client's
          token again, through the pipe, and admits the client when the token's
          user or one of its enabled groups is this account or listed (for a
          restricted token, one of its restricting SIDs too); a token it cannot
          read is refused, PEER_REFUSED and counted by Refused. A dialer whose
          own account's pipe does not exist tries the pipe of each listed SID in
          turn, and trusts it only when that account owns it and, where the
          serving process's token can be read, runs it (ENDPOINT_FOREIGN
          otherwise); a group it lists names no pipe, since a pipe is named
          after the account that listens. Unix has no SID: a list that is not
          empty is MISCONFIGURED there.
        name: AllowSIDs
        type: "[]string"
    kind: struct
    methods:
      - doc: validate refuses a configuration no endpoint can be built from.
        name: validate
        recv: c *Config
        results: error
    name: Config
  - fields:
      - name: cfg
        type: Config
      - name: ln
        type: acceptor
      - name: self
        type: int
      - doc: selfSID is this process's account on Windows, empty elsewhere.
        name: selfSID
        type: string
      - name: mu
        type: sync.Mutex
      - name: closed
        type: bool
      - name: refused
        type: int64
    kind: struct
    methods:
      - name: Accept
        recv: l *Listener
        results: "*coreipc.Conn, error"
      - name: Refused
        recv: l *Listener
        results: int64
      - name: Addr
        recv: l *Listener
        results: net.Addr
      - name: Path
        recv: l *Listener
        results: string
      - name: Close
        recv: l *Listener
        results: error
      - doc: |-
          admits is the Unix admission: this account, or an allowed user, or a peer
          whose effective or supplementary group is allowed, or a peer the kernel did
          not name where it names none — the directory admitted it.
        name: admits
        params: p coreipc.PeerValue, groups []int
        recv: l *Listener
        results: error
    name: Listener
  - doc: |-
      acceptor is the endpoint a Listener accepts on: a Unix socket
      (socket.go), a named pipe on Windows (pipe_windows.go). accept returns the
      next connection, what the kernel says of its peer and the credentials the
      admission reads beside it — the peer's supplementary groups on Unix, where
      they are read; its token's user and groups on Windows. Admission is the
      Listener's.
    kind: named
    name: acceptor
    underlying: |-
      interface {
      	accept() (conn net.Conn, peer coreipc.PeerValue, creds credentials, err error)
      	Close() error
      	Addr() net.Addr
      }
  - fields:
      - name: cfg
        type: Config
    kind: struct
    methods:
      - name: Dial
        params: ctx context.Context
        recv: d *Dialer
        results: "*coreipc.Conn, error"
    name: Dialer
  - alias: true
    doc: |-
      credentials are what the Unix admission reads beside a peer's PeerValue:
      its supplementary groups, as the kernel recorded them, where they are read.
    kind: alias
    name: credentials
    underlying: "[]int"
  - doc: |-
      socketAcceptor accepts on a Unix socket; its peers are named by peerOf, and
      their supplementary groups read (peerGroups) when an allowed group may
      need them.
    fields:
      - name: ""
        role: embedded
        type: "*net.UnixListener"
      - name: groups
        type: bool
    kind: struct
    methods:
      - doc: |-
          accept returns the next connection, its peer as the kernel names it and,
          when the acceptor reads them, the peer's groups.
        name: accept
        recv: s socketAcceptor
        results: conn net.Conn, peer coreipc.PeerValue, groups []int, err error
    name: socketAcceptor
  - doc: |-
      posture is the socket file's mode, the group it is given (-1 keeps the one
      bind gave it), and whether that mode lets every account connect.
    fields:
      - name: mode
        type: os.FileMode
      - name: gid
        type: int
      - name: others
        type: bool
    kind: struct
    name: posture
vars:
  - doc: Every private connection on Unix passes files both ways (#936).
    grouped: true
    items:
      - name: _
        type: coreipc.FileSender
        value: (*fileConn)(nil)
      - name: _
        type: coreipc.FileReceiver
        value: (*fileConn)(nil)
    name: _
  - doc: |-
      The socket listener is the engine behind the Listener port, the dialer the
      engine behind the Dialer port.
    grouped: true
    items:
      - name: _
        type: coreipc.Listener
        value: (*Listener)(nil)
      - name: _
        type: coreipc.Dialer
        value: (*Dialer)(nil)
    name: _#2
