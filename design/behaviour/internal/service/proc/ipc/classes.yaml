# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      listenBacklog is the backlog asked of listen(2): every kernel clamps it to
      its own maximum (somaxconn), which is what net.ListenUnix ends up with too.
    items:
      - name: listenBacklog
        type: int
        value: 1<<16 - 1
    name: listenBacklog
  - doc: |-
      worldWritable is the bit that lets any account create, rename or remove an
      entry in a directory.
    items:
      - name: worldWritable
        type: os.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      rootUID is the one account besides this process's user a component may
      belong to: root can replace anything anyway.
    items:
      - name: rootUID
        type: int
        value: "0"
    name: rootUID
  - doc: |-
      The kind field of a PATH_UNSAFE refusal: how another account could steer
      the component it names.
    grouped: true
    items:
      - doc: kindIndirection is a link held by a directory anybody can write.
        name: kindIndirection
        type: string
        value: "\"indirection\""
      - doc: |-
          kindForeign is a component another account owns, held by a directory
          anybody can write.
        name: kindForeign
        type: string
        value: "\"foreign\""
      - doc: |-
          kindReplaceable is a component held by a directory anybody can write
          and that has no sticky bit.
        name: kindReplaceable
        type: string
        value: "\"replaceable\""
    name: kindIndirection
  - doc: |-
      groupOrWorldWritable are the mode bits that let another account plant an
      entry in the directory.
    items:
      - name: groupOrWorldWritable
        type: os.FileMode
        value: "0o022"
    name: groupOrWorldWritable
  - doc: fdBytes is the width of one descriptor in an SCM_RIGHTS message.
    items:
      - name: fdBytes
        type: int
        value: "4"
    name: fdBytes
  - doc: |-
      maxPath is the longest socket path every supported kernel accepts: 104
      bytes of sun_path on the BSDs and macOS, 108 on Linux, and one for the NUL.
    items:
      - name: maxPath
        type: int
        value: "103"
    name: maxPath
  - doc: |-
      dialTimeout bounds Dial and the liveness probe Listen makes on a socket
      already at the path. A local socket answers in microseconds; a second is a
      process that is not coming.
    items:
      - name: dialTimeout
        type: time.Duration
        value: time.Second
    name: dialTimeout
  - doc: |-
      kernelNamesPeer: the kernel answers who is at the other end of a Unix
      socket here — SO_PEERCRED on Linux, LOCAL_PEERCRED on FreeBSD and
      DragonFly, LOCAL_PEEREID on NetBSD —, so a peer it did not name is refused.
    items:
      - name: kernelNamesPeer
        type: bool
        value: "true"
    name: kernelNamesPeer
  - doc: |-
      soPeerGroups is SO_PEERGROUPS (include/uapi/asm-generic/socket.h, Linux
      4.13): 59 on every Linux port Go supports — parisc, sparc and alpha, the
      ports that number it otherwise, are not Go's.
    items:
      - name: soPeerGroups
        type: uintptr
        value: "59"
    name: soPeerGroups
  - doc: |-
      Buffers of SO_PEERGROUPS: the first holds a usual account's groups; a
      longer list is read once more at the length the kernel asked for, bounded
      by NGROUPS_MAX; a group id is four bytes.
    grouped: true
    items:
      - name: firstPeerGroups
        type: int
        value: "64"
      - name: maxPeerGroups
        type: int
        value: "65536"
      - name: gidBytes
        type: int
        value: "4"
    name: firstPeerGroups
  - doc: |-
      Socket modes: the narrowest that lets every account the lists name
      connect(2), which needs write permission on the socket and nothing else —
      a read bit grants nothing on a socket, so 0660 and 0666 are written as
      every service manager writes them.
    grouped: true
    items:
      - doc: ownerOnly admits this account (and root, whom no mode stops).
        name: ownerOnly
        type: os.FileMode
        value: "0o600"
      - doc: ownerAndGroup admits the socket's group besides.
        name: ownerAndGroup
        type: os.FileMode
        value: "0o660"
      - doc: |-
          everyAccount admits every account that reaches the socket; the
          directory, and the listener's admission, are the gates then.
        name: everyAccount
        type: os.FileMode
        value: "0o666"
      - doc: anybodySearches is the directory bit that lets every account through.
        name: anybodySearches
        type: os.FileMode
        value: "0o001"
    name: ownerOnly
  - doc: getsockoptTrap is getsockopt(2)'s system call.
    items:
      - name: getsockoptTrap
        type: uintptr
        value: syscall.SYS_GETSOCKOPT
    name: getsockoptTrap
