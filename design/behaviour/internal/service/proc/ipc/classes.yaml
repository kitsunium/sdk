functions:
  - doc: |-
      checkChain refuses the socket directory dir when another account could steer
      a component of the path ABOVE it. The socket directory's own entry is not
      judged here — [checkEntry] holds it to stricter rules — so the walk is over
      its parent, and dir need not exist yet: [prepareDir] runs this before it
      creates anything, so nothing is ever created inside a steered tree.
    name: checkChain
    params: dir string
    results: error
  - doc: |-
      checkHolder refuses a socket directory anybody could replace: one held by a
      directory anybody can write that has no sticky bit. [checkChain] judged the
      holder's own path first, so the lookup lands where that audit did.
    name: checkHolder
    params: dir string
    results: error
  - doc: |-
      steerable says whether another account could steer the path at step and,
      when one could, how — the kind a refusal names. steered is false when no
      account the deployment did not choose can.
    name: steerable
    params: step *pathchain.StepValue, self int
    results: kind string, steered bool
  - doc: |-
      ours reports whether info belongs to this process's user or to root. An
      owner that cannot be read belongs to nobody trusted — a gate does not guess
      — though on Unix it always can be read.
    name: ours
    params: info os.FileInfo, self int
    results: bool
  - doc: |-
      pathUnsafe is the PATH_UNSAFE refusal for step: the component that may be
      steered and how, the socket directory the caller configured, the mode of the
      directory holding the component, where an indirection leads and who owns
      what was found.
    name: pathUnsafe
    params: dir string, step *pathchain.StepValue, kind string
    results: error
  - doc: |-
      prepareDir creates dir 0700 when it is missing, then checks it. The path
      above dir is audited BEFORE anything is created, because Mkdir follows a
      link at a parent and would otherwise create the directory inside whatever
      tree the link names; and again after, with the rest of [checkDir], because a
      parent missing at the first audit may have been created by somebody else
      in between.
    name: prepareDir
    params: dir string
    results: error
  - doc: |-
      checkDir refuses a socket directory another account could write to, read
      through, replace or reach through a path it steers: every component above
      it first ([checkChain], PATH_UNSAFE), then its own entry ([checkEntry],
      DIRECTORY_UNSAFE), then the directory holding it ([checkHolder]).
    name: checkDir
    params: dir string
    results: error
  - doc: |-
      checkEntry refuses a socket directory whose own entry another account could
      write to or read through: it must be a real directory — not a link —, owned
      by this process's user, and writable by nobody else. Group or world search
      permission is allowed: that is how a deployment admits an on-call group,
      and without write permission nobody can plant an entry there.
    name: checkEntry
    params: dir string
    results: error
  - doc: |-
      checkDialDir is checkDir from the dialling side (#1092): the same chain and
      holder rules, and the same entry rules — a real directory that nobody but
      its owner can write — but no owner rule: the directory is the LISTENER's,
      usually another account's, and who may be dialled is the socket file's
      owner, which dialWith checks next (ENDPOINT_FOREIGN). A deployment that
      admits an on-call group gives the directory group search, and a client
      outside the group is refused by the kernel at the directory. lstat is the
      platform's, a test's double otherwise.
    name: checkDialDir
    params: dir string, lstat func(string) (os.FileInfo, error)
    results: error
  - doc: checkDialEntry is checkEntry without the owner rule.
    name: checkDialEntry
    params: dir string, lstat func(string) (os.FileInfo, error)
    results: error
  - doc: |-
      endpointAdmitted is the dialling side's owner set for the socket file: this
      account, an allowed user, or an allowed group.
    name: endpointAdmitted
    params: uid, gid, euid int, cfg *Config
    results: bool
  - doc: |-
      ownersOf is the UID and GID owning the file info describes; unknown for a
      nil info or one the platform does not describe with a Stat_t.
    name: ownersOf
    params: info os.FileInfo
    results: uid, gid int, known bool
  - doc: |-
      ownerOf is the UID owning the file info describes; unknown for a nil info
      or one the platform does not describe with a Stat_t.
    name: ownerOf
    params: info os.FileInfo
    results: uid int, known bool
  - doc: |-
      fdPassRefused wraps FDPassRefused with its reason and, when there is one,
      the cause.
    name: fdPassRefused
    params: reason string, cause error
    results: error
  - doc: withFiles wraps a connection so Conn.Conn offers FileSender and FileReceiver.
    name: withFiles
    params: c *net.UnixConn, peer coreipc.PeerValue
    results: net.Conn
  - doc: negative reports whether n cannot be a UID or a GID.
    name: negative
    params: n int
    results: bool
  - name: NewListener
    params: cfg *Config
    results: "*Listener, error"
  - doc: |-
      admit says whether p may use a socket of account self under cfg. An
      unverified peer passed the directory, which is the only gate there is.
    name: admit
    params: p coreipc.PeerValue, self int, cfg *Config
    results: error
  - doc: |-
      admitWhere is admit on a platform whose kernel names the peer (named) or
      does not. Where it does, a peer it did not name is an anomaly and is
      refused (#1093, ADR 0031) rather than let through as the directory's; where
      it does not, the directory is the gate and admitted it.
    name: admitWhere
    params: p coreipc.PeerValue, self int, cfg *Config, named bool
    results: error
  - name: NewDialer
    params: cfg *Config
    results: "*Dialer, error"
  - name: Dial
    params: ctx context.Context, cfg *Config
    results: "*coreipc.Conn, error"
  - name: RuntimeDir
    params: app string
    results: string
  - name: RuntimeDirOr
    params: app, fallback string
    results: string
  - doc: |-
      closeBestEffort closes a connection this package refuses or no longer
      needs. Its error changes nothing — the connection is abandoned either way —
      so it is logged, never returned in place of the verdict that caused it.
    name: closeBestEffort
    params: c io.Closer, path string
  - doc: |-
      peerOf asks the kernel who is at the other end of c: SO_PEERCRED, the
      credentials the peer had when it connected — or listened —, which it cannot
      forge.
    name: peerOf
    params: c *net.UnixConn
    results: coreipc.PeerValue
  - doc: |-
      listen opens the Unix socket at cfg.Path, once its directory is private
      and what was at the path is known to be a leftover.
    name: listen
    params: cfg *Config
    results: "*Listener, error"
  - doc: |-
      clearStale removes a socket nobody answers on, and refuses one somebody
      does. What is not a socket, or not ours, is never removed.
    name: clearStale
    params: cfg *Config
    results: error
  - doc: |-
      nobodyListens reports whether a failed dial says the socket has no owner:
      ECONNREFUSED — a socket file no process listens on, what a killed daemon
      leaves — or ENOENT, the file gone between the Lstat and the dial. Any other
      failure, EAGAIN and a timeout first, leaves the owner possibly alive.
    name: nobodyListens
    params: err error
    results: bool
  - doc: |-
      dial connects to the Unix socket at cfg.Path, once the path to its
      directory is known to be steered by nobody else, the directory to be this
      account's and its file this account's (or an allowed one's). A directory
      that does not exist is nobody listening — the first client of a daemon not
      started yet —, DIAL_FAILED, not an unsafe directory.
    name: dial
    params: ctx context.Context, cfg *Config
    results: "*coreipc.Conn, error"
  - doc: |-
      dialWith is dial with the file-owner reading and the effective uid
      injected, so a test can stand on either side of an account it cannot be.
      The directory may be another account's (#1092, [checkDialDir]); the socket
      file may be owned by this account, an allowed user or an allowed group, and
      is ENDPOINT_FOREIGN otherwise.
    name: dialWith
    params: ctx context.Context, cfg *Config, lstat func(string) (os.FileInfo, error), euid int
    results: "*coreipc.Conn, error"
