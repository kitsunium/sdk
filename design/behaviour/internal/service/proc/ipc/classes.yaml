apiVersion: design/behaviour/v1
constants:
  - doc: |-
      worldWritable is the bit that lets any account create, rename or remove an
      entry in a directory.
    items:
      - name: worldWritable
        type: os.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      rootUID is the one account besides this process's user a component may
      belong to: root can replace anything anyway.
    items:
      - name: rootUID
        type: int
        value: "0"
    name: rootUID
  - doc: |-
      The kind field of a PATH_UNSAFE refusal: how another account could steer
      the component it names.
    grouped: true
    items:
      - doc: kindIndirection is a link held by a directory anybody can write.
        name: kindIndirection
        type: string
        value: "\"indirection\""
      - doc: |-
          kindForeign is a component another account owns, held by a directory
          anybody can write.
        name: kindForeign
        type: string
        value: "\"foreign\""
      - doc: |-
          kindReplaceable is a component held by a directory anybody can write
          and that has no sticky bit.
        name: kindReplaceable
        type: string
        value: "\"replaceable\""
    name: kindIndirection
  - doc: |-
      groupOrWorldWritable are the mode bits that let another account plant an
      entry in the directory.
    items:
      - name: groupOrWorldWritable
        type: os.FileMode
        value: "0o022"
    name: groupOrWorldWritable
  - doc: fdBytes is the width of one descriptor in an SCM_RIGHTS message.
    items:
      - name: fdBytes
        type: int
        value: "4"
    name: fdBytes
  - doc: |-
      maxPath is the longest socket path every supported kernel accepts: 104
      bytes of sun_path on the BSDs and macOS, 108 on Linux, and one for the NUL.
    items:
      - name: maxPath
        type: int
        value: "103"
    name: maxPath
  - doc: |-
      dialTimeout bounds Dial and the liveness probe Listen makes on a socket
      already at the path. A local socket answers in microseconds; a second is a
      process that is not coming.
    items:
      - name: dialTimeout
        type: time.Duration
        value: time.Second
    name: dialTimeout
  - doc: |-
      kernelNamesPeer: the kernel answers who is at the other end of a Unix
      socket here — SO_PEERCRED on Linux, LOCAL_PEERCRED on FreeBSD and
      DragonFly, LOCAL_PEEREID on NetBSD —, so a peer it did not name is refused.
    items:
      - name: kernelNamesPeer
        type: bool
        value: "true"
    name: kernelNamesPeer
