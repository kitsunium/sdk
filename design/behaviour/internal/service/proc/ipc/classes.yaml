package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/ipc
  name: ipc
  purpose: "Package ipc — the components ABOVE the socket's directory, and who could steer them: ADR 0083's rule, applied where the directory is the whole of the access control (ADR 0148)."
types:
  - doc: |-
      fileConn is a private connection that passes open files (#936): the Unix
      connection, and the peer the kernel named for it.
    fields:
      - name: ""
        role: embedded
        type: "*net.UnixConn"
      - name: peer
        type: coreipc.PeerValue
    kind: struct
    methods:
      - doc: SendFiles sends payload with files attached, to a named peer only.
        name: SendFiles
        params: payload []byte, files ...*os.File
        recv: c *fileConn
        results: error
      - doc: |-
          RecvFiles reads one message and at most max descriptors; the kernel closes
          those beyond max (MSG_CTRUNC), and the net package receives them
          close-on-exec.
        name: RecvFiles
        params: buf []byte, max int
        recv: c *fileConn
        results: n int, files []*os.File, err error
    name: fileConn
  - fields:
      - doc: |-
          Path is the socket's absolute path. Its directory is created 0700 when
          missing and refused when another account could write to it.
        name: Path
        type: string
      - doc: |-
          AllowUIDs and AllowGIDs admit peers besides this process's own user:
          an on-call group declared at deployment, say. They are enforced where
          the kernel names the peer (Peer.Verified); the directory must still
          let those accounts reach the socket, which is the deployment's to
          arrange — this package never widens a directory. Windows has no UID:
          there the pipe's DACL admits this account only, and the lists admit
          nobody more.
        name: AllowUIDs
        type: "[]int"
      - doc: |-
          AllowUIDs and AllowGIDs admit peers besides this process's own user:
          an on-call group declared at deployment, say. They are enforced where
          the kernel names the peer (Peer.Verified); the directory must still
          let those accounts reach the socket, which is the deployment's to
          arrange — this package never widens a directory. Windows has no UID:
          there the pipe's DACL admits this account only, and the lists admit
          nobody more.
        name: AllowGIDs
        type: "[]int"
    kind: struct
    methods:
      - doc: validate refuses a configuration no endpoint can be built from.
        name: validate
        recv: c *Config
        results: error
    name: Config
  - fields:
      - name: cfg
        type: Config
      - name: ln
        type: acceptor
      - name: self
        type: int
      - doc: selfSID is this process's account on Windows, empty elsewhere.
        name: selfSID
        type: string
      - name: mu
        type: sync.Mutex
      - name: closed
        type: bool
      - name: refused
        type: int64
    kind: struct
    methods:
      - name: Accept
        recv: l *Listener
        results: "*coreipc.Conn, error"
      - name: Refused
        recv: l *Listener
        results: int64
      - name: Addr
        recv: l *Listener
        results: net.Addr
      - name: Path
        recv: l *Listener
        results: string
      - name: Close
        recv: l *Listener
        results: error
      - doc: |-
          admits is the Unix admission: this account, or an allowed user or group,
          or a peer the kernel did not name — the directory admitted it.
        name: admits
        params: p coreipc.PeerValue
        recv: l *Listener
        results: error
    name: Listener
  - doc: |-
      acceptor is the endpoint a Listener accepts on: a Unix socket
      (socket.go), a named pipe on Windows (pipe_windows.go). accept returns the
      next connection and what the kernel says of its peer; admission is the
      Listener's.
    kind: named
    name: acceptor
    underlying: |-
      interface {
      	accept() (net.Conn, coreipc.PeerValue, error)
      	Close() error
      	Addr() net.Addr
      }
  - fields:
      - name: cfg
        type: Config
    kind: struct
    methods:
      - name: Dial
        params: ctx context.Context
        recv: d *Dialer
        results: "*coreipc.Conn, error"
    name: Dialer
  - doc: socketAcceptor accepts on a Unix socket; its peers are named by peerOf.
    fields:
      - name: ""
        role: embedded
        type: "*net.UnixListener"
    kind: struct
    methods:
      - doc: accept returns the next connection and its peer as the kernel names it.
        name: accept
        recv: s socketAcceptor
        results: net.Conn, coreipc.PeerValue, error
    name: socketAcceptor
vars:
  - doc: Every private connection on Unix passes files both ways (#936).
    grouped: true
    items:
      - name: _
        type: coreipc.FileSender
        value: (*fileConn)(nil)
      - name: _
        type: coreipc.FileReceiver
        value: (*fileConn)(nil)
    name: _
  - doc: |-
      The socket listener is the engine behind the Listener port, the dialer the
      engine behind the Dialer port.
    grouped: true
    items:
      - name: _
        type: coreipc.Listener
        value: (*Listener)(nil)
      - name: _
        type: coreipc.Dialer
        value: (*Dialer)(nil)
    name: _#2
