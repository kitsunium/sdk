functions:
  - name: NewClient
    params: ctx context.Context, d coreipc.Dialer, cfg ClientConfig
    results: "*Client, error"
  - doc: |-
      answersFor is how many frames a call's channel holds: one answer, or a
      stream's buffer.
    name: answersFor
    params: stream bool
    results: int
  - doc: |-
      head is a call's or a stream's frame up to its budget; the request's value
      is appended to it.
    name: head
    params: kind byte, id uint64, method string, budget time.Duration
    results: "[]byte"
  - doc: |-
      budgetOf is what a request tells the server it has: what is left of ctx's
      deadline, at most limit when limit is positive; zero for none.
    name: budgetOf
    params: ctx context.Context, limit time.Duration
    results: time.Duration
  - doc: |-
      contextErr is CALL_TIMEOUT for a context whose deadline passed and
      CALL_CANCELLED for one cancelled.
    name: contextErr
    params: ctx context.Context
    results: error
  - doc: |-
      checkFormat refuses no format, one longer than a hello carries, and one no
      codec is registered under; it returns the codec.
    name: checkFormat
    params: f codec.Format
    results: codec.Codec, error
  - doc: serverCodecs validates cfg and looks up the codec of each format.
    name: serverCodecs
    params: cfg ServerConfig
    results: map[codec.Format]codec.Codec, error
  - doc: clientCodec validates cfg and looks up its format's codec.
    name: clientCodec
    params: cfg ClientConfig
    results: codec.Codec, error
  - doc: clockOr is clk, or clock.System for nil.
    name: clockOr
    params: clk clock.Timed
    results: clock.Timed
  - doc: |-
      readFrame reads the next frame: it blocks for its first byte as long as the
      connection is idle, then calls started — the caller arms FrameTimeout there
      — and refuses a length past maxFrame before reading or allocating a byte of
      the rest. A peer that hung up between frames is io.EOF, as the reader says.
    name: readFrame
    params: r frameReader, maxFrame int, started func()
    results: frameValue, error
  - doc: parseFrame splits a frame read whole into its parts.
    name: parseFrame
    params: buf []byte
    results: frameValue, error
  - doc: "unexpectedEOF reads an end inside a frame as what it is: a frame cut short."
    name: unexpectedEOF
    params: err error
    results: error
  - doc: |-
      beginFrame appends a frame's length placeholder and header to dst; the
      body follows, then finishFrame writes the length.
    name: beginFrame
    params: dst []byte, kind byte, id uint64, method string
    results: "[]byte"
  - doc: |-
      finishFrame writes the frame's length and refuses one past what the peer
      reads (peerMax): nothing of it is sent.
    name: finishFrame
    params: frame []byte, peerMax int
    results: "[]byte, error"
  - doc: "emptyFrame is a whole frame with no body: a cancel, an end, a ping, a pong."
    name: emptyFrame
    params: kind byte, id uint64
    results: "[]byte"
  - doc: |-
      helloFrame is a hello: the format as its method, the version and the
      largest frame this end reads as its body.
    name: helloFrame
    params: format codec.Format, maxFrame int
    results: "[]byte"
  - doc: |-
      parseHello reads a hello's body: the peer's version, and the largest frame
      it reads.
    name: parseHello
    params: f frameValue
    results: peerMax int, err error
  - doc: |-
      errorFrame is an error answer for id: the code, reason and public text of
      err when it carries an SDK code, REMOTE_FAILED's otherwise. Its Private
      half and its fields never leave this process.
    name: errorFrame
    params: id uint64, err error
    results: "[]byte"
  - doc: |-
      remoteError rebuilds the error an error frame carries: the same code,
      reason and public text, so errs.HasCode answers on this side as on the
      server's, and REMOTE_FAILED when what the frame says is not a valid SDK
      error.
    name: remoteError
    params: f frameValue
    results: error
  - doc: violation is PROTOCOL_VIOLATION with its rule.
    name: violation
    params: rule string
    results: error
  - doc: |-
      codecFailed is CODEC_FAILED for the direction that failed. The format's
      own error — itself an SDK error, whose code would win a wrap — travels as a
      field, for the log.
    name: codecFailed
    params: direction string, cause error
    results: error
  - doc: misconfigured is MISCONFIGURED with its rule.
    name: misconfigured
    params: rule string
    results: error
  - doc: newKeeper returns a keeper whose goroutine run starts.
    name: newKeeper
    params: clk clock.Timed, frameExpired func(), callExpired func(id uint64)
    results: "*keeper"
  - doc: earlier is the earlier of a and b, the zero time standing for none.
    name: earlier
    params: a, b time.Time
    results: time.Time
  - doc: due reports whether the deadline d is set and not after now.
    name: due
    params: d, now time.Time
    results: bool
  - name: NewServer
    params: cfg ServerConfig, r corerpc.Router
    results: "*Server, error"
  - doc: |-
      swallowErr drops an error nobody can act on: a connection served detached
      ended, and its verdict was the peer's to read. It is an explicit, reviewed
      no-op rather than a bare `_ =`.
    name: swallowErr
    params: err error
  - doc: newServerConn readies a connection for serve.
    name: newServerConn
    params: s *Server, c *coreipc.Conn
    results: "*serverConn"
  - doc: |-
      budgetDuration is a budget in nanoseconds as a duration, the longest one
      standing for anything past it.
    name: budgetDuration
    params: ns uint64
    results: time.Duration
  - doc: connClosed is CONN_CLOSED, for a connection this end closed.
    name: connClosed
    results: error
  - doc: |-
      connClosedBy is CONN_CLOSED for a connection that failed, the failure in
      the log fields.
    name: connClosedBy
    params: cause error
    results: error
