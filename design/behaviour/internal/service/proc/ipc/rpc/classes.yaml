apiVersion: design/behaviour/v1
constants:
  - doc: |-
      streamBuffer is how many of a stream's frames wait for its reader before
      the connection's reader waits too.
    items:
      - name: streamBuffer
        type: int
        value: "16"
    name: streamBuffer
  - doc: |-
      protocolVersion is the version a hello says; a peer saying another is
      refused (FORMAT_REFUSED).
    items:
      - name: protocolVersion
        type: byte
        value: "1"
    name: protocolVersion
  - doc: |-
      The kinds of frame (ADR 0218), numbered from 1 in this order — the wire's,
      never to be reordered: the hello, a call and a stream's request, the
      answers — a reply, an item, a stream's end, an error —, a caller's cancel,
      and a ping with its pong.
    grouped: true
    items:
      - name: kindHello
        type: byte
        value: iota + 1
      - name: kindCall
      - name: kindStream
      - name: kindReply
      - name: kindItem
      - name: kindEnd
      - name: kindError
      - name: kindCancel
      - name: kindPing
      - name: kindPong
    name: kindHello
  - doc: The widths of the wire's fixed parts, in bytes.
    grouped: true
    items:
      - doc: lenBytes is the length prefix, which counts what follows it.
        name: lenBytes
        type: int
        value: "4"
      - doc: |-
          headerBytes is kind:u8 | id:u64 | mlen:u8, what follows the length
          before the method.
        name: headerBytes
        type: int
        value: "10"
      - doc: |-
          idOffset and mlenOffset are where the id and the method's length sit in
          the header.
        name: idOffset
        type: int
        value: "1"
      - name: mlenOffset
        type: int
        value: "9"
      - doc: "budgetBytes is the budget a call's body opens with: nanoseconds, u64."
        name: budgetBytes
        type: int
        value: "8"
      - doc: "helloBodyBytes is a hello's body: version:u8 | maxFrame:u32."
        name: helloBodyBytes
        type: int
        value: "5"
      - doc: "errorFixedBytes is an error's body before its reason: code:u32 | rlen:u8."
        name: errorFixedBytes
        type: int
        value: "5"
      - doc: maxNameBytes is the longest method, format or reason a u8 length says.
        name: maxNameBytes
        type: int
        value: math.MaxUint8
      - doc: |-
          minFrameBytes is the smallest MaxFrameBytes a configuration may set: a
          header, a budget and room for a body.
        name: minFrameBytes
        type: int
        value: "64"
      - doc: maxFrameLimit is the largest a u32 length can say.
        name: maxFrameLimit
        type: int64
        value: math.MaxUint32
      - doc: |-
          frameStartBytes is the capacity a frame being built starts with: a
          small call fits, a larger one grows it.
        name: frameStartBytes
        type: int
        value: "256"
    name: lenBytes
  - doc: |-
      readBufferBytes is the buffered reader's size: a frame's header and a small
      body in one read.
    items:
      - name: readBufferBytes
        type: int
        value: 4 << 10
    name: readBufferBytes
