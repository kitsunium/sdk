                  value: value
            - case: metricGCCycles
              do:
                - set: stats.GCCycles
                  value: value
            - default: true
          "on": name
  - of: applyDistribution
    steps:
      - opt:
          do:
            - return: ""
          when: histogram == nil
      - bind: distribution
        eval: "DistributionValue{Counts: histogram.Counts, Buckets: histogram.Buckets}"
      - switch:
          cases:
            - case: metricGCPauses
              do:
                - set: stats.GCPauses
                  value: distribution
            - case: metricSchedLatency
              do:
                - set: stats.SchedLatencies
