                do:
                  - opt:
                      do:
                        - set: stats.RSSBytes
                          value: pages * uint64(os.Getpagesize())
                        - set: stats.KernelMemory
                          value: "true"
                      init:
                        bind: pages, err
                        eval: strconv.ParseUint(fields[statmResidentField], 10, 64)
                        to: strconv
                      when: err == nil
                when: len(fields) > statmResidentField
          init:
            bind: statm, err
            eval: os.ReadFile(statmFile)
            to: os
          when: err == nil
      - opt:
          do:
            - eval: readStatus(stats, string(status))
              to: readStatus
          init:
            bind: status, err
            eval: os.ReadFile(statusFile)
            to: os
          when: err == nil
      - opt:
          do:
            - set: stats.OpenFiles
              value: len(entries) - 1
          init:
            bind: entries, err
            eval: os.ReadDir(fdDir)
            to: os
          when: err == nil
  - of: readStatus
    participants:
      - id: caller
        kind: actor
      - id: readStatus
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: fields
              eval: strings.Fields(line)
              to: strings
            - opt:
                do:
                  - continue: true
                when: len(fields) < 2
            - bind: value, err
              eval: strconv.ParseUint(fields[1], 10, 64)
              to: strconv
            - opt:
                do:
                  - continue: true
                when: err != nil
            - switch:
                cases:
                  - case: peakKey
                    do:
                      - set: stats.PeakRSSBytes
                        value: value * kibibyte
                  - case: threadsKey
                    do:
                      - set: stats.Threads
                        value: int(value)
                  - default: true
                "on": fields[0]
          key: line
          range: strings.Lines(status)
