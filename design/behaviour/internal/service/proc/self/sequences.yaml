sequences:
  - of: cpuTime
    participants:
      - id: caller
        kind: actor
      - id: cpuTime
        kind: self
      - id: syscall
        kind: stdlib
      - id: runtimeCPU
        kind: internal
      - id: time
        kind: stdlib
    steps:
      - var:
          name: usage
          type: syscall.Rusage
      - opt:
          do:
            - return: runtimeCPU(), true
              to: runtimeCPU
          init:
            bind: err
            eval: syscall.Getrusage(syscall.RUSAGE_SELF, &usage)
            to: syscall
          when: err != nil
      - return: time.Duration(usage.Utime.Nano() + usage.Stime.Nano()), false
        to: time
  - of: DistributionValue.Count
    steps:
      - var:
          name: total
          type: uint64
      - loop:
          do:
            - op: +=
              set: total
              value: count
          key: _
          range: d.Counts
          value: count
      - return: total
  - of: DistributionValue.Quantile
    participants:
      - id: caller
        kind: actor
      - id: DistributionValue.Quantile
        kind: self
      - id: d.Count
        kind: internal
      - id: seconds
        kind: internal
    steps:
      - bind: total
        eval: d.Count()
        to: d.Count
      - opt:
          do:
            - return: "0"
          when: total == 0 || len(d.Buckets) != len(d.Counts)+1
      - opt:
          do:
            - set: q
              value: "0"
          when: math.IsNaN(q)
      - bind: target
        eval: max(uint64(math.Ceil(min(max(q, 0), 1)*float64(total))), 1)
      - var:
          name: seen
          type: uint64
      - loop:
          do:
            - op: +=
              set: seen
              value: count
            - opt:
                do:
                  - continue: true
                when: seen < target
            - return: seconds(bucketBound(d.Buckets[index], d.Buckets[index+1]))
              to: seconds
          key: index
          range: d.Counts
          value: count
      - return: "0"
  - of: bucketBound
    steps:
      - switch:
          cases:
            - case: "!math.IsInf(upper, 0)"
              do:
                - return: upper
            - case: "!math.IsInf(lower, 0)"
              do:
                - return: lower
            - default: true
              do:
                - return: "0"
  - of: seconds
    participants:
      - id: caller
        kind: actor
      - id: seconds
        kind: self
      - id: time
        kind: stdlib
    steps:
      - bind: nanos
        eval: value * float64(time.Second)
      - opt:
          do:
            - return: "0"
          when: nanos <= 0 || math.IsNaN(nanos)
      - opt:
          do:
            - return: maxDuration
          when: nanos >= math.MaxInt64
      - return: time.Duration(nanos)
