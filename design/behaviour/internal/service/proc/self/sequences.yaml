      - id: runtime
        kind: stdlib
      - id: lastGC
        kind: internal
      - id: cpuTime
        kind: internal
    steps:
      - bind: samples
        eval: |-
          []metrics.Sample{
          		{Name: metricGoroutines},
          		{Name: metricHeapBytes},
          		{Name: metricHeapGoal},
          		{Name: metricMemoryTotal},
          		{Name: metricHeapObjects},
          		{Name: metricTotalAlloc},
          		{Name: metricGCCycles},
          		{Name: metricGCPauses},
          		{Name: metricSchedLatency},
          	}
      - eval: metrics.Read(samples)
        to: metrics
      - bind: now
        eval: time.Now()
        to: time
      - bind: stats
        eval: |-
          StatsValue{
          		At: now, Started: started, Uptime: now.Sub(started),
          		PID: os.Getpid(), MaxProcs: runtime.GOMAXPROCS(0), CPUs: runtime.NumCPU(),
          	}
      - loop:
