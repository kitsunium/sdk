# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: |-
          StartSourceInit is the package's initialisation: within it, not the kernel's
          word.
        name: StartSourceInit
        type: StartSource
        value: iota + 1
      - doc: StartSourceKernel is the kernel's record of when it started the process.
        name: StartSourceKernel
    name: StartSourceInit
  - doc: |-
      The marks of a Go build id where the linker writes it raw, at the start of
      the text of every binary format (cmd/internal/buildid): the ELF note holds
      the same id.
    grouped: true
    items:
      - name: buildIDPrefix
        type: string
        value: "\"\\xff Go build ID: \\\"\""
      - name: buildIDSuffix
        type: string
        value: "\"\\\"\\n \\xff\""
      - name: buildIDScanBytes
        type: int64
        value: 32 << 10
      - name: goBuildIDNote
        type: string
        value: "\".note.go.buildid\""
      - name: noteHeaderBytes
        type: int
        value: "16"
      - name: bootIDFile
        type: string
        value: "\"/proc/sys/kernel/random/boot_id\""
    name: buildIDPrefix
  - doc: The procfs facts the kernel keeps about the process and the boot.
    grouped: true
    items:
      - doc: selfStatFile's field 22 is the start time, in clock ticks since boot.
        name: selfStatFile
        type: string
        value: "\"/proc/self/stat\""
      - doc: systemStatFile's btime line is the boot time, in seconds since the epoch.
        name: systemStatFile
        type: string
        value: "\"/proc/stat\""
      - doc: pidNamespaceFile is the process's pid namespace, its inode the namespace id.
        name: pidNamespaceFile
        type: string
        value: "\"/proc/self/ns/pid\""
      - doc: "userHZ is the clock tick of /proc's times: USER_HZ, 100 on every Linux ABI."
        name: userHZ
        type: int64
        value: "100"
      - doc: startTimeIndex is field 22's index after the ")" ending field 2.
        name: startTimeIndex
        type: int
        value: 22 - 3
      - doc: btimeKey opens /proc/stat's boot-time line.
        name: btimeKey
        type: string
        value: "\"btime\""
      - doc: nsPidKey opens /proc/self/status's per-namespace pid line.
        name: nsPidKey
        type: string
        value: "\"NSpid:\""
      - doc: namespaceInit is a pid namespace's first process.
        name: namespaceInit
        type: string
        value: "\"1\""
    name: selfStatFile
  - doc: The procfs files the kernel's view of the process is read from.
    grouped: true
    items:
      - doc: statmFile's second field is the resident set, in pages.
        name: statmFile
        type: string
        value: "\"/proc/self/statm\""
      - doc: statusFile carries VmHWM (the peak resident set, kB) and Threads.
        name: statusFile
        type: string
        value: "\"/proc/self/status\""
      - doc: fdDir lists the open descriptors.
        name: fdDir
        type: string
        value: "\"/proc/self/fd\""
      - doc: statmResidentField is the resident set's index in statm.
        name: statmResidentField
        type: int
        value: "1"
      - doc: kibibyte is the unit status writes its sizes in.
        name: kibibyte
        type: uint64
        value: "1024"
      - doc: peakKey and threadsKey are the status lines read.
        name: peakKey
        type: string
        value: "\"VmHWM:\""
      - name: threadsKey
        type: string
        value: "\"Threads:\""
    name: statmFile
  - doc: oomScoreAdjPath is the running process's own OOM-killer bias in procfs.
    items:
      - name: oomScoreAdjPath
        type: string
        value: "\"/proc/self/oom_score_adj\""
    name: oomScoreAdjPath
  - doc: exitOSErr is sysexits.h EX_OSERR (71), the exit status of RLIMIT_FAILED.
    items:
      - name: exitOSErr
        type: int
        value: "71"
    name: exitOSErr
  - doc: |-
      oomScoreAdjPerm is the mode os.WriteFile is given; the procfs file always
      exists, so it is never used to create one.
    items:
      - name: oomScoreAdjPerm
        type: os.FileMode
        value: "0o644"
    name: oomScoreAdjPerm
  - doc: |-
      The runtime/metrics a snapshot reads. Each is documented in
      runtime/metrics; a name the running toolchain does not know reads as
      KindBad and leaves its field zero rather than failing the snapshot.
    grouped: true
    items:
      - name: metricGoroutines
        type: string
        value: "\"/sched/goroutines:goroutines\""
      - name: metricHeapBytes
        type: string
        value: "\"/memory/classes/heap/objects:bytes\""
      - name: metricHeapGoal
        type: string
        value: "\"/gc/heap/goal:bytes\""
      - name: metricMemoryTotal
        type: string
        value: "\"/memory/classes/total:bytes\""
      - name: metricHeapObjects
        type: string
        value: "\"/gc/heap/objects:objects\""
      - name: metricTotalAlloc
        type: string
        value: "\"/gc/heap/allocs:bytes\""
      - name: metricGCCycles
        type: string
        value: "\"/gc/cycles/total:gc-cycles\""
      - name: metricGCPauses
        type: string
        value: "\"/sched/pauses/total/gc:seconds\""
      - name: metricSchedLatency
        type: string
        value: "\"/sched/latencies:seconds\""
      - name: metricCPUTotal
        type: string
        value: "\"/cpu/classes/total:cpu-seconds\""
      - name: metricCPUIdle
        type: string
        value: "\"/cpu/classes/idle:cpu-seconds\""
    name: metricGoroutines
  - doc: maxDuration is the longest time.Duration, where a conversion saturates.
    items:
      - name: maxDuration
        type: time.Duration
        value: math.MaxInt64
    name: maxDuration
