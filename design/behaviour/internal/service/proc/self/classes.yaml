  - decls:
      - statmFile
      - kernelMemory
      - readStatus
    name: kernelmem_linux.go
  - decls:
      - SetOOMScoreAdj
    name: oomscore.go
  - decls:
      - oomScoreAdjPath
      - exitOSErr
      - oomScoreAdjPerm
      - setOOMScoreAdj
      - oomFailed
    name: oomscore_linux.go
  - decls:
      - metricGoroutines
      - maxDuration
      - started
      - StatsValue
      - DistributionValue
      - DistributionValue.Count
      - DistributionValue.Quantile
      - bucketBound
      - seconds
      - ReadStats
      - apply
      - applyCount
      - applyDistribution
      - lastGC
      - runtimeCPU
    name: stats.go
functions:
  - doc: |-
      cpuTime returns the user and system CPU time the process has consumed, from
      getrusage(2), and false. Should the call fail — it does not, for
      RUSAGE_SELF — it falls back to the runtime's estimate and reports true.
    name: cpuTime
    results: used time.Duration, estimated bool
  - name: ReadIdentity
    results: IdentityValue
  - doc: digestOf hashes the file at name.
    name: digestOf
    params: name string
    results: sum [sha256.Size]byte, ok bool
  - doc: |-
      buildIDOf reads the Go build id: the ELF note where there is one, the raw
      mark at the start of the text otherwise, and "" when neither is there.
    name: buildIDOf
    params: name string
    results: string
  - doc: elfNoteBuildID reads the .note.go.buildid note of an ELF binary.
    name: elfNoteBuildID
    params: name string
    results: id string, ok bool
  - doc: rawBuildID scans the start of the file for the linker's raw mark.
    name: rawBuildID
    params: name string
    results: id string, ok bool
  - doc: |-
      closeQuietly closes a file read to the end: a close failure on a read-only
      file changes nothing the reading can say.
    name: closeQuietly
    params: f io.Closer
  - doc: |-
      containerOf finds a container id in a cgroup path: the deepest element that
      is 64 hex digits once a runtime's scope prefix and ".scope" are dropped.
    name: containerOf
    params: cgroupPath string
    results: string
  - doc: isContainerID reports a 64-digit lower-case hex string.
    name: isContainerID
    params: s string
    results: bool
  - doc: |-
      kernelStart reads when the kernel started the process: the boot time plus
      the start tick.
    name: kernelStart
    results: time.Time, bool
  - doc: bootTime reads /proc/stat's btime.
    name: bootTime
    params: stat string
    results: int64, bool
  - doc: |-
      pidNamespace reads the pid namespace's inode and whether the process is its
      pid 1 (the last NSpid entry: the innermost namespace's view).
    name: pidNamespace
    results: inode uint64, nsPid1 bool
  - doc: |-
      kernelMemory fills the kernel's view: the resident set from statm, its peak
      and the thread count from status, the descriptors from /proc/self/fd.
    name: kernelMemory
    params: stats *StatsValue
  - doc: readStatus reads VmHWM and Threads from /proc/self/status.
    name: readStatus
    params: stats *StatsValue, status string
  - name: SetOOMScoreAdj
    params: n int
    results: error
  - doc: setOOMScoreAdj writes n to /proc/self/oom_score_adj; see SetOOMScoreAdj.
    name: setOOMScoreAdj
    params: n int
    results: error
  - doc: oomFailed wraps a refused write onto the central RlimitFailed sentinel.
    name: oomFailed
    params: cause error, n int
    results: error
  - doc: |-
      bucketBound returns the finite bound that stands for a bucket: its upper
      bound, or its lower one when the upper is infinite, or zero when neither is
      finite.
    name: bucketBound
    params: lower, upper float64
    results: float64
  - doc: |-
      seconds converts a finite, non-negative number of seconds to a duration,
      saturating rather than overflowing.
    name: seconds
    params: value float64
    results: time.Duration
  - name: ReadStats
    results: StatsValue
  - doc: apply copies one runtime sample into the field it names.
    name: apply
    params: stats *StatsValue, sample *metrics.Sample
  - doc: applyCount copies a uint64 sample into its field.
    name: applyCount
    params: stats *StatsValue, name string, value uint64
  - doc: |-
      applyDistribution copies a histogram sample into its field. The runtime
      hands back fresh slices on every Read, so keeping them shares nothing.
    name: applyDistribution
    params: stats *StatsValue, name string, histogram *metrics.Float64Histogram
  - doc: |-
      lastGC returns when the most recent collection ended, or the zero time
      before the first one. runtime/metrics has no such figure; ReadGCStats
      copies it under the runtime's lock without stopping the world.
    name: lastGC
    results: time.Time
  - doc: |-
      runtimeCPU is the Go runtime's estimate of the CPU time the process used:
      its total CPU capacity over the process's life minus its idle time. It is
      the fallback where the kernel's count is not at hand. The runtime takes
      these figures at a garbage collection's stop-the-world, so the estimate is
      as old as the last collection — measured: unchanged across 300 ms of
      spinning, and caught up by the next runtime.GC.
    name: runtimeCPU
    results: time.Duration
imports:
  bytes: bytes
  cgroupfs: github.com/kitsunium/sdk/internal/service/proc/internal/cgroupfs
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  debug: runtime/debug
  elf: debug/elf
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  io: io
  math: math
  metrics: runtime/metrics
  os: os
  path: path
  runtime: runtime
  sha256: crypto/sha256
  strconv: strconv
  strings: strings
  syscall: syscall
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/proc/self
  name: self
  purpose: "Package self is what the running process is doing right now: the Go runtime's own metrics and the kernel's account of the CPU time used."
types:
  - kind: named
    methods:
      - name: String
        recv: s StartSource
        results: string
    name: StartSource
    underlying: uint8
  - fields:
      - doc: |-
          StartedAt is when the process started: the kernel's record on Linux
          (/proc/self/stat's start tick after /proc/stat's boot time) and Windows
          (GetProcessTimes), the package's initialisation elsewhere —
          StartedAtSource says which.
        name: StartedAt
        type: time.Time
      - doc: Executable is the path of the running binary, as os.Executable reads it.
        name: Executable
        type: string
      - doc: |-
          BuildID is the Go build id of the running binary — its ELF
          .note.go.buildid, or the raw mark the linker writes at the start of the
          text of every format — what `go tool buildid` prints; empty when absent.
        name: BuildID
        type: string
      - doc: |-
          ContainerID is the 64-hex id of the container the process runs in, read
          from its cgroup path in the docker, cri-containerd, crio, libpod and
          kubepods shapes; empty outside one.
        name: ContainerID
        type: string
      - doc: BootID is the kernel's id of the current boot (Linux); empty elsewhere.
        name: BootID
        type: string
      - doc: |-
          PIDNamespace is the inode of /proc/self/ns/pid, the pid namespace's id
          (Linux); zero elsewhere.
        name: PIDNamespace
        type: uint64
      - doc: Digest is the SHA-256 of the running binary's file, valid when DigestOK.
        name: Digest
        type: "[32]byte"
      - doc: StartedAtSource says where StartedAt came from.
        name: StartedAtSource
        type: StartSource
      - doc: DigestOK reports that the binary could be read whole and Digest holds its hash.
        name: DigestOK
        type: bool
      - doc: |-
          NSPid1 reports that the process is pid 1 of its pid namespace (the last
          NSpid entry of /proc/self/status) — the init of a container.
        name: NSPid1
        type: bool
    kind: struct
    name: IdentityValue
  - fields:
      - doc: |-
          At is when the snapshot was taken, on the wall clock: this describes
          the machine, whatever clock the program's own logic runs on.
        name: At
        type: time.Time
      - doc: Started is when the process started, to within its initialisation.
        name: Started
        type: time.Time
      - doc: |-
          LastGC is when the most recent garbage collection ended; zero before
          the first one.
        name: LastGC
        type: time.Time
      - doc: |-
          GCPauses is the distribution of stop-the-world pauses caused by the
          garbage collector.
        name: GCPauses
        type: DistributionValue
      - doc: |-
          SchedLatencies is the distribution of the time goroutines spent ready
          to run before they ran — the queueing a saturated scheduler adds.
        name: SchedLatencies
        type: DistributionValue
      - doc: PID is the process identifier.
        name: PID
        type: int
      - doc: "MaxProcs is GOMAXPROCS: how many threads may run Go code at once."
        name: MaxProcs
        type: int
      - doc: CPUs is how many logical CPUs the process can use.
        name: CPUs
        type: int
      - doc: Goroutines is how many goroutines exist.
        name: Goroutines
        type: int
      - doc: |-
          HeapBytes is the memory occupied by live and not-yet-swept heap
          objects.
        name: HeapBytes
        type: uint64
      - doc: HeapObjects is how many objects occupy HeapBytes.
        name: HeapObjects
        type: uint64
      - doc: HeapGoalBytes is the heap size at which the next collection starts.
        name: HeapGoalBytes
        type: uint64
      - doc: |-
          MemoryBytes is all the memory the Go runtime has mapped from the
          system: the heap, the stacks, the runtime's own structures. It is the
          runtime's number, not the kernel's resident set.
        name: MemoryBytes
        type: uint64
      - doc: TotalAllocBytes is every byte ever allocated on the heap.
        name: TotalAllocBytes
        type: uint64
      - doc: GCCycles is how many collections have completed.
        name: GCCycles
        type: uint64
      - doc: CPUTime is the CPU time the process has consumed, user and system.
        name: CPUTime
        type: time.Duration
      - doc: Uptime is At minus Started.
        name: Uptime
        type: time.Duration
      - doc: |-
          CPUEstimated reports that CPUTime is the Go runtime's estimate rather
          than the kernel's count: the runtime's total CPU capacity minus its
          idle time, which counts only threads running Go code and so misses time
          spent in C code or blocked in the kernel — and which the runtime
          refreshes only at a garbage collection, so it lags by up to one GC
          cycle and reads zero before the first. It is true where the kernel's
          count is not at hand — Plan 9, wasm: neither getrusage(2) nor
          GetProcessTimes exists there — and wherever that call failed.
        name: CPUEstimated
        type: bool
      - doc: |-
          RSSBytes is the kernel's resident set — what the OOM killer and the
          cgroup count, where MemoryBytes is the runtime's mapping: /proc/self/statm
          on Linux, the working set on Windows, zero elsewhere (KernelMemory).
        name: RSSBytes
        type: uint64
      - doc: |-
          PeakRSSBytes is the most resident memory the process has held: VmHWM on
          Linux, getrusage(2)'s ru_maxrss on the other Unixes, the peak working set
          on Windows; zero on illumos and Solaris, whose kernel leaves it so.
        name: PeakRSSBytes
        type: uint64
      - doc: Threads is how many kernel threads the process runs (Linux); zero elsewhere.
        name: Threads
        type: int
      - doc: |-
          OpenFiles is how many descriptors the process holds open (Linux), or its
          HANDLE count (Windows); zero elsewhere — rlimit.OpenFiles counts on more
          platforms.
        name: OpenFiles
        type: int
      - doc: |-
          KernelMemory reports that RSSBytes is the kernel's count (Linux,
          Windows); false where the platform gives the SDK no current resident set.
        name: KernelMemory
        type: bool
    kind: struct
    name: StatsValue
  - fields:
      - doc: Counts[i] is the number of observations in [Buckets[i], Buckets[i+1]).
        name: Counts
        type: "[]uint64"
      - doc: |-
          Buckets are the boundaries, in seconds, one more than Counts. The
          first may be -Inf and the last +Inf.
        name: Buckets
        type: "[]float64"
    kind: struct
    methods:
      - name: Count
        recv: d DistributionValue
        results: uint64
      - name: Quantile
        params: q float64
        recv: d DistributionValue
        results: time.Duration
    name: DistributionValue
vars:
  - doc: |-
      containerPrefixes are the scope prefixes the container runtimes give a
      container's cgroup: docker, containerd's CRI plugin, CRI-O and podman.
    items:
      - name: containerPrefixes
        value: "[...]string{\"docker-\", \"cri-containerd-\", \"crio-\", \"libpod-\"}"
    name: containerPrefixes
  - doc: |-
      started is when this package was initialised: the process's start, to
      within the initialisation of the packages linked before it. A program that
      imports this package at all imports it at start-up, so the gap is the
      runtime's own bring-up — microseconds, not the lifetime of anything.
    items:
      - name: started
        value: time.Now()
    name: started
