  - decls:
      - cpuTime
    name: cputime_unix.go
  - decls: []
    name: doc.go
  - decls:
      - StartSourceInit
      - buildIDPrefix
      - containerPrefixes
      - StartSource
      - StartSource.String
      - IdentityValue
      - ReadIdentity
      - digestOf
      - buildIDOf
      - elfNoteBuildID
