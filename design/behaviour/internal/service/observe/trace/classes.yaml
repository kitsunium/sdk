# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The four defaults of a BatchSink are the OpenTelemetry trace SDK
      specification's own for the batching span processor
      (https://opentelemetry.io/docs/specs/otel/trace/sdk/#batching-processor):
      maxQueueSize 2048, scheduledDelayMillis 5000, exportTimeoutMillis 30000 and
      maxExportBatchSize 512. A zero field in BatchSinkConfig takes them, so a zero
      value is the specification's processor rather than an inert one (ADR 0031).
    grouped: true
    items:
      - doc: DefaultBatchMaxQueueSize bounds how many finished spans wait for export.
        name: DefaultBatchMaxQueueSize
        type: int
        value: "2048"
      - doc: DefaultBatchScheduledDelay is the longest a queued span waits before an export starts.
        name: DefaultBatchScheduledDelay
        type: time.Duration
        value: 5 * time.Second
      - doc: DefaultBatchExportTimeout bounds one export, on the sink's clock.
        name: DefaultBatchExportTimeout
        type: time.Duration
        value: coretrace.DefaultExportTimeout
      - doc: DefaultBatchMaxExportBatchSize bounds how many spans one export carries.
        name: DefaultBatchMaxExportBatchSize
        type: int
        value: "512"
    name: DefaultBatchMaxQueueSize
  - doc: |-
      OTLPTracesPath is the OTLP/HTTP path for the trace signal. It is a constant
      rather than something the exporter appends, so an endpoint stays a full URL a
      reviewer can read in one string: "http://collector:4318" + OTLPTracesPath.
    items:
      - name: OTLPTracesPath
        type: string
        value: "\"/v1/traces\""
    name: OTLPTracesPath
  - doc: |-
      DefaultOTLPTimeout is the OpenTelemetry protocol exporter specification's own
      default for OTEL_EXPORTER_OTLP_TIMEOUT. The clamp lands on the specification's
      number rather than on one this SDK invented.
    items:
      - name: DefaultOTLPTimeout
        type: time.Duration
        value: otlp.DefaultTimeout
    name: DefaultOTLPTimeout
  - doc: |-
      DefaultOTLPMaxResponseBytes caps the response body read at 1 MiB. The response
      is the one length a REMOTE party controls in this exchange; the REQUEST body
      is deliberately not capped, because its size is a property of the caller's own
      span volume, any SDK-chosen ceiling would be arbitrary (ADR 0031 §refuse), and
      the collector already answers 413 for one it will not take.

      It also bounds the drain that recycles the connection after the verdict —
      always this default rather than OTLPHTTPConfig.MaxResponseBytes, because
      that knob bounds what is read into memory and the drain keeps nothing.
    items:
      - name: DefaultOTLPMaxResponseBytes
        type: int64
        value: otlp.DefaultMaxResponseBytes
    name: DefaultOTLPMaxResponseBytes
  - doc: |-
      rejectedFieldKey is the errs Field key a partial success carries the
      rejected count under. It never carries remote-controlled text.
    items:
      - name: rejectedFieldKey
        type: string
        value: "\"rejected_spans\""
    name: rejectedFieldKey
  - doc: |-
      otlpJSONExporterName is the registered name of the default OTLP/JSON span
      exporter, which writes to stderr (ADR 0030). It names the ENCODING, not the
      protocol, because an OTLP/protobuf encoder would register beside it.
    items:
      - name: otlpJSONExporterName
        type: coretrace.ExporterName
        value: "\"otlpjson\""
    name: otlpJSONExporterName
  - doc: |-
      The three SpanFlags masks, copied from opentelemetry/proto/trace/v1.SpanFlags.

      The pair is a presence protocol rather than two independent bits: bit 8 says
      "bit 9 is meaningful". Without it a receiver cannot tell "the parent is local"
      from "this producer does not track remoteness", and the two lead to different
      service maps.
    grouped: true
    items:
      - doc: |-
          spanFlagsTraceFlagsMask is SPAN_FLAGS_TRACE_FLAGS_MASK: the low byte
          carries the W3C trace-flags of this span's own context.
        name: spanFlagsTraceFlagsMask
        type: uint32
        value: "0x0000_00FF"
      - doc: |-
          spanFlagsHasIsRemote is SPAN_FLAGS_CONTEXT_HAS_IS_REMOTE_MASK: this
          producer knows whether the context is remote, so the next bit is real.
        name: spanFlagsHasIsRemote
        type: uint32
        value: "0x0000_0100"
      - doc: |-
          spanFlagsIsRemote is SPAN_FLAGS_CONTEXT_IS_REMOTE_MASK: the context came
          from another process.
        name: spanFlagsIsRemote
        type: uint32
        value: "0x0000_0200"
    name: spanFlagsTraceFlagsMask
  - doc: |-
      httpClientErrorFloor is the lowest status a CLIENT span reports as an error.

      4xx IS an error on a client span, unlike on a server span: the caller asked
      for something and did not get it, which is a failure of the call whatever it
      says about whose fault it is. The OpenTelemetry HTTP conventions make exactly
      this asymmetry, and it is the one thing a reader is most likely to assume is a
      copy-paste slip between this constant and httpServerErrorFloor.
    items:
      - name: httpClientErrorFloor
        type: int
        value: "400"
    name: httpClientErrorFloor
  - doc: |-
      The OpenTelemetry HTTP semantic-convention attribute keys this middleware
      records. They are dotted, which is the spelling the conventions SPECIFY — and
      the reason the Prometheus metrics connector refuses them (ADR 0044 §Decision
      8). OTLP carries them unchanged.
    grouped: true
    items:
      - doc: HTTPRequestMethodKey is the request method, uppercase.
        name: HTTPRequestMethodKey
        type: string
        value: "\"http.request.method\""
      - doc: HTTPResponseStatusCodeKey is the response status.
        name: HTTPResponseStatusCodeKey
        type: string
        value: "\"http.response.status_code\""
      - doc: |-
          URLPathKey is the request path. It is the ESCAPED form — see the
          middleware comment for why the decoded one is not recorded.
        name: URLPathKey
        type: string
        value: "\"url.path\""
      - doc: URLSchemeKey is "http" or "https".
        name: URLSchemeKey
        type: string
        value: "\"url.scheme\""
      - doc: |-
          URLFullKey is the outbound URL, recorded on CLIENT spans only and with
          its userinfo REDACTED — the client middleware renders it through
          url.URL.Redacted(), not String(), so a password in the URL becomes
          "xxxxx" instead of travelling to a telemetry backend. The query string
          is NOT redacted: a secret passed as ?api_key= is still recorded, because
          deciding which parameters are sensitive would mean guessing, and a
          wrong guess is both a silent leak and a silently mangled attribute.
          A caller who puts secrets in a query string must keep them out of the
          URL the SDK is handed.
        name: URLFullKey
        type: string
        value: "\"url.full\""
      - doc: ServerAddressKey is the host a client called, or a server was called on.
        name: ServerAddressKey
        type: string
        value: "\"server.address\""
      - doc: ErrorTypeKey names what went wrong when a call produced no response.
        name: ErrorTypeKey
        type: string
        value: "\"error.type\""
    name: HTTPRequestMethodKey
  - doc: |-
      httpServerErrorFloor is the lowest status a SERVER span reports as an error.

      4xx is deliberately NOT an error on a server span, and the OpenTelemetry HTTP
      conventions say so: a 404 is the caller asking for something that is not
      there, which is the server working correctly. Marking it ERROR would make
      every scanner probing for /wp-admin light up a service's error rate.
    items:
      - name: httpServerErrorFloor
        type: int
        value: "500"
    name: httpServerErrorFloor
  - doc: |-
      The two values url.scheme takes on a server span: the scheme the socket
      actually spoke, decided by TLS presence alone (see requestScheme).
    grouped: true
    items:
      - name: schemeHTTP
        type: string
        value: "\"http\""
      - name: schemeHTTPS
        type: string
        value: "\"https\""
    name: schemeHTTP
  - doc: rootIDsLen is the width of one draw of a root span's two identifiers.
    items:
      - name: rootIDsLen
        type: int
        value: coretrace.TraceIDLen + coretrace.SpanIDLen
    name: rootIDsLen
  - grouped: true
    items:
      - doc: floatBitSize is the width every float in this package has.
        name: floatBitSize
        type: int
        value: "64"
      - doc: floatFmt is strconv's shortest-round-trip format verb.
        name: floatFmt
        type: byte
        value: "'g'"
      - doc: |-
          floatPrec asks strconv for the shortest representation that parses back
          to the same value.
        name: floatPrec
        type: int
        value: "-1"
    name: floatBitSize
  - doc: |-
      DefaultMaxSpans is the bound a Recorder uses when RecorderConfig leaves the
      knob unset. 2048 finished spans is roughly one busy second of a single
      service: high enough that a normal collection interval never reaches it, low
      enough that a collector which stopped collecting costs megabytes rather than
      the process.
    items:
      - name: DefaultMaxSpans
        type: int
        value: "2048"
    name: DefaultMaxSpans
  - doc: traceIDUniformBytes is how much of a trace id the uniform is drawn from.
    items:
      - name: traceIDUniformBytes
        type: int
        value: "8"
    name: traceIDUniformBytes
  - doc: |-
      ratioThresholdBits is the width of that uniform — traceIDUniformBytes worth of
      bits minus the top one, so the comparison is unsigned-safe on every
      architecture without a cast that could sign-extend.
    items:
      - name: ratioThresholdBits
        type: int
        value: traceIDUniformBytes*bitsPerByte - 1
    name: ratioThresholdBits
  - doc: |-
      bitsPerByte is the obvious 8, named so ratioThresholdBits derives from
      traceIDUniformBytes rather than restating it.
    items:
      - name: bitsPerByte
        type: int
        value: "8"
    name: bitsPerByte
  - doc: |-
      ratioSpace is the size of the uniform's range as a double: the threshold a
      fraction is scaled into. float64 carries 53 mantissa bits, so the scaling is
      exact to roughly 1 part in 2^53 — far finer than any rate a deployment states.
    items:
      - name: ratioSpace
        type: float64
        value: 1 << ratioThresholdBits
    name: ratioSpace
  - doc: |-
      traceIDUniformOffset is where the uniform is read from: the LAST
      traceIDUniformBytes, not the first. An id that carries structure carries it at
      the front (a timestamp prefix, a machine id), and sampling on structured bits
      samples whole prefixes in or out together. The tail is the part every
      generator makes random.
    items:
      - name: traceIDUniformOffset
        type: int
        value: coretrace.TraceIDLen - traceIDUniformBytes
    name: traceIDUniformOffset
  - doc: |-
      The traceparent field offsets, derived from the grammar rather than counted
      by hand:

      	value          = version "-" version-format
      	version        = 2HEXDIGLC
      	version-format = trace-id "-" parent-id "-" trace-flags
      	trace-id       = 32HEXDIGLC
      	parent-id      = 16HEXDIGLC
      	trace-flags    = 2HEXDIGLC

      which is 2 + 1 + 32 + 1 + 16 + 1 + 2 = 55 characters.
    grouped: true
    items:
      - doc: TraceParentLen is the length of a version-00 traceparent, exactly.
        name: TraceParentLen
        type: int
        value: "55"
      - doc: traceParentSep separates the four components.
        name: traceParentSep
        type: string
        value: "\"-\""
      - doc: versionHexLen is the width of the version field.
        name: versionHexLen
        type: int
        value: "2"
      - doc: flagsHexLen is the width of the trace-flags field.
        name: flagsHexLen
        type: int
        value: "2"
    name: TraceParentLen
  - doc: |-
      The three field offsets inside the fixed 55-character prefix, derived from
      the widths above rather than written as literals so the grammar and the
      arithmetic cannot drift apart. Every version keeps these fields exactly where
      version 00 puts them (§3.2.4), which is what makes fixed-offset reading
      correct here and not merely convenient.
    grouped: true
    items:
      - doc: "traceIDOffset is where trace-id starts: past the version and its dash."
        name: traceIDOffset
        type: int
        value: versionHexLen + 1
      - doc: parentIDOffset is where parent-id starts.
        name: parentIDOffset
        type: int
        value: traceIDOffset + coretrace.TraceIDHexLen + 1
      - doc: flagsOffset is where trace-flags starts.
        name: flagsOffset
        type: int
        value: parentIDOffset + coretrace.SpanIDHexLen + 1
    name: traceIDOffset
  - doc: The two versions the specification names explicitly.
    grouped: true
    items:
      - doc: |-
          VersionSupported is the version this SDK emits: "00", the only version
          the current Recommendation defines.
        name: VersionSupported
        type: string
        value: "\"00\""
      - doc: |-
          versionInvalid is "ff", which §3.2.2.1 declares invalid outright — it is
          reserved so that a forward-version negotiation can never collide with it.
        name: versionInvalid
        type: string
        value: "\"ff\""
    name: VersionSupported
  - doc: |-
      TraceParentHeader and TraceStateHeader are the two header names W3C Trace
      Context defines. Both are lowercase: §3.2.1 asks a vendor to SEND the name in
      lowercase while accepting any case on receipt, which is what http.Header's
      canonicalisation already does for a Go receiver.
    grouped: true
    items:
      - doc: TraceParentHeader carries the span context.
        name: TraceParentHeader
        type: string
        value: "\"traceparent\""
      - doc: TraceStateHeader carries the vendor list.
        name: TraceStateHeader
        type: string
        value: "\"tracestate\""
    name: TraceParentHeader
  - doc: |-
      The header's own punctuation, named so the parser reads as the grammar does:
      `list = list-member 0*31( OWS "," OWS list-member )`, `list-member = (key "="
      value) / OWS`, `OWS = *( SP / HTAB )`. They are strings rather than bytes
      because every use site splits, cuts or trims with them.
    grouped: true
    items:
      - name: traceStateListSep
        type: string
        value: "\",\""
      - name: traceStatePairSep
        type: string
        value: "\"=\""
      - name: traceStateOWS
        type: string
        value: "\" \\t\""
    name: traceStateListSep
