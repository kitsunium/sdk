          	}
  - of: (*span).SpanContext
    steps:
      - return: s.context
  - of: (*span).SetAttrs
    participants:
      - id: caller
        kind: actor
      - id: (*span).SetAttrs
        kind: self
      - id: sortedIncoming
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: len(attrs) == 0
      - bind: incoming
        eval: sortedIncoming(attrs)
        to: sortedIncoming
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: s.ended
      - loop:
          do:
            - bind: at, found
              eval: slices.BinarySearchFunc(s.attrs, attr, coreotel.CompareAttrKey)
              to: slices
            - opt:
                do:
                  - set: s.attrs[at]
                    value: attr
                  - continue: true
                when: found
            - set: s.attrs
              to: slices
              value: slices.Insert(s.attrs, at, attr)
          key: _
          range: incoming
          value: attr
  - of: sortedIncoming
    participants:
      - id: caller
        kind: actor
      - id: sortedIncoming
        kind: self
      - id: coretrace
        kind: package
    steps:
      - opt:
          do:
            - return: coretrace.SortAttrs(attrs)
              to: coretrace
          when: len(attrs) > 1
      - eval: coretrace.ValidateAttrs(attrs)
        to: coretrace
      - return: attrs
  - of: (*span).AddEvent
    steps:
      - bind: event
        eval: |-
          coretrace.EventValue{
          		Time:  s.tracer.cfg.Clock.Now(),
          		Name:  name,
          		Attrs: coretrace.SortAttrs(attrs),
          	}
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: s.ended
      - set: s.events
        value: append(s.events, event)
  - of: (*span).SetStatus
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: s.ended
      - set: s.status
        value: "coretrace.StatusValue{Code: code, Message: message}"
  - of: (*span).End
    participants:
      - id: caller
        kind: actor
      - id: (*span).End
        kind: self
      - id: s.finish
        kind: internal
    steps:
      - bind: value, first
        eval: s.finish()
        to: s.finish
      - opt:
          do:
            - return: ""
          when: "!first"
      - eval: s.tracer.cfg.Sink(value)
  - of: (*span).finish
    participants:
      - id: caller
        kind: actor
      - id: (*span).finish
        kind: self
      - id: s.tracer.cfg.Clock.Now
        kind: value
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: coretrace.SpanValue{}, false
          when: s.ended
      - set: s.ended
        value: "true"
      - set: s.end
        to: s.tracer.cfg.Clock.Now
        value: s.tracer.cfg.Clock.Now()
      - bind: attrs, events
        eval: s.attrs, s.events
      - set: s.attrs, s.events
        value: nil, nil
      - return: |-
          coretrace.SpanValue{
          		Context:   s.context,
          		Parent:    s.parent,
          		Name:      s.name,
          		Kind:      s.kind,
          		StartTime: s.start,
          		EndTime:   s.end,
          		Attrs:     attrs,
          		Events:    events,
          		Links:     s.links,
          		Status:    s.status.Resolved(),
          	}, true
  - of: ParseTraceParent
    participants:
      - id: caller
        kind: actor
      - id: ParseTraceParent
        kind: self
      - id: parseTraceParentPrefix
        kind: internal
    steps:
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, coretrace.InvalidTraceParent
          when: len(header) < TraceParentLen
      - bind: version
        eval: header[:versionHexLen]
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, coretrace.InvalidTraceParent
          when: version == versionInvalid || !isLowerHex(version) || !hasValidTraceParentTail(version, header)
      - return: parseTraceParentPrefix(header[:TraceParentLen])
        to: parseTraceParentPrefix
  - of: hasValidTraceParentTail
    steps:
      - opt:
          do:
            - return: len(header) == TraceParentLen
          when: version == VersionSupported
      - return: len(header) == TraceParentLen || strings.HasPrefix(header[TraceParentLen:], traceParentSep)
  - of: parseTraceParentPrefix
    participants:
      - id: caller
        kind: actor
      - id: parseTraceParentPrefix
        kind: self
      - id: coretrace
        kind: package
      - id: parseTraceFlags
        kind: internal
    steps:
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, coretrace.InvalidTraceParent
          when: prefix[traceIDOffset-1] != '-' || prefix[parentIDOffset-1] != '-' || prefix[flagsOffset-1] != '-'
      - bind: traceID, traceErr
        eval: "coretrace.ParseTraceID(prefix[traceIDOffset : traceIDOffset+coretrace.TraceIDHexLen])"
        to: coretrace
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, traceErr
          when: traceErr != nil
      - bind: spanID, spanErr
        eval: "coretrace.ParseSpanID(prefix[parentIDOffset : parentIDOffset+coretrace.SpanIDHexLen])"
        to: coretrace
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, spanErr
          when: spanErr != nil
      - bind: flags, flagsErr
        eval: parseTraceFlags(prefix[flagsOffset:])
        to: parseTraceFlags
      - opt:
          do:
            - return: coretrace.SpanContextValue{}, flagsErr
          when: flagsErr != nil
      - return: "coretrace.SpanContextValue{TraceID: traceID, SpanID: spanID, Flags: flags, Remote: true}, nil"
  - of: parseTraceFlags
    participants:
      - id: caller
        kind: actor
      - id: parseTraceFlags
        kind: self
      - id: hex
        kind: stdlib
      - id: coretrace
        kind: package
    steps:
      - opt:
          do:
            - return: 0, coretrace.InvalidTraceParent
          when: len(text) != flagsHexLen || !isLowerHex(text)
      - var:
          name: decoded
          type: "[1]byte"
      - opt:
          do:
            - return: 0, coretrace.InvalidTraceParent
          init:
            bind: _, decodeErr
            eval: hex.Decode(decoded[:], []byte(text))
            to: hex
          when: decodeErr != nil
      - return: coretrace.TraceFlags(decoded[0]), nil
        to: coretrace
  - of: FormatTraceParent
    participants:
      - id: caller
        kind: actor
      - id: FormatTraceParent
        kind: self
      - id: out.Grow
        kind: value
      - id: out.WriteString
        kind: value
      - id: out.String
        kind: value
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: "!context.IsValid()"
      - var:
          name: out
          type: strings.Builder
      - eval: out.Grow(TraceParentLen)
        to: out.Grow
      - eval: out.WriteString(VersionSupported)
        to: out.WriteString
      - eval: out.WriteString(traceParentSep)
        to: out.WriteString
      - eval: out.WriteString(context.TraceID.String())
        to: out.WriteString
      - eval: out.WriteString(traceParentSep)
        to: out.WriteString
      - eval: out.WriteString(context.SpanID.String())
        to: out.WriteString
      - eval: out.WriteString(traceParentSep)
        to: out.WriteString
      - eval: out.WriteString(hex.EncodeToString([]byte{byte(context.Flags.Sanitized())}))
        to: out.WriteString
      - return: out.String(), true
        to: out.String
  - of: isLowerHex
    participants:
      - id: caller
        kind: actor
      - id: isLowerHex
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: "!slices.ContainsFunc([]byte(text), isNotLowerHexDigit)"
        to: slices
  - of: isNotLowerHexDigit
    steps:
      - return: (c < '0' || c > '9') && (c < 'a' || c > 'f')
  - of: NewTracer
    steps:
      - return: "&Tracer{cfg: cfg.resolved()}"
  - of: (*Tracer).Resource
    steps:
      - return: t.cfg.Resource
  - of: (*Tracer).Scope
    steps:
      - return: t.cfg.Scope
  - of: (*Tracer).Start
    participants:
      - id: caller
        kind: actor
      - id: (*Tracer).Start
        kind: self
      - id: coretrace
        kind: package
      - id: t.mint
        kind: internal
      - id: newSpan
        kind: internal
    steps:
      - opt:
          do:
            - panic: coretrace.InvalidSpanName.Error()
          when: name == ""
      - bind: parent
        eval: coretrace.SpanContextFromContext(ctx)
        to: coretrace
      - bind: spanContext
        eval: t.mint(parent, name, params)
        to: t.mint
      - opt:
          do:
            - return: "coretrace.ContextWithSpanContext(ctx, spanContext), noopSpan{context: spanContext}"
              to: coretrace
          when: "!spanContext.IsSampled()"
      - bind: recording
        eval: newSpan(t, spanContext, parent, name, params)
        to: newSpan
      - return: coretrace.ContextWithSpanContext(ctx, spanContext), recording
        to: coretrace
  - of: (*Tracer).mint
    participants:
      - id: caller
        kind: actor
      - id: (*Tracer).mint
        kind: self
      - id: drawSpanID
        kind: internal
      - id: drawTraceID
        kind: internal
    steps:
      - bind: spanID
        eval: drawSpanID()
        to: drawSpanID
      - opt:
          do:
            - return: |-
                coretrace.SpanContextValue{
                			TraceID: parent.TraceID,
                			SpanID:  spanID,
                			Flags:   parent.Flags,
                			State:   parent.State,
                		}
          when: parent.IsValid()
      - bind: traceID
        eval: drawTraceID()
        to: drawTraceID
      - bind: sampled
        eval: |-
          t.cfg.Sampler(coretrace.SamplingParams{
          		Parent:  parent,
          		TraceID: traceID,
          		Name:    name,
          		Kind:    params.Kind.Resolved(),
          		Attrs:   params.Attrs,
          		Links:   params.Links,
          	})
      - return: |-
          coretrace.SpanContextValue{
          		TraceID: traceID,
          		SpanID:  spanID,
          		Flags:   coretrace.TraceFlags(0).WithSampled(sampled),
          	}
  - of: ParseTraceState
    participants:
      - id: caller
        kind: actor
      - id: ParseTraceState
        kind: self
      - id: strings
        kind: stdlib
      - id: coretrace
        kind: package
      - id: builder.State
        kind: value
    steps:
      - opt:
          do:
            - return: coretrace.StateValue{}, nil
          when: strings.Trim(header, traceStateOWS) == ""
      - bind: fields
        eval: strings.Split(header, traceStateListSep)
        to: strings
      - bind: builder
        eval: coretrace.NewStateBuilder(len(fields))
        to: coretrace
      - loop:
          do:
            - bind: member
              eval: strings.Trim(field, traceStateOWS)
              to: strings
            - opt:
                do:
                  - continue: true
                when: member == ""
            - bind: key, value, found
              eval: strings.Cut(member, traceStatePairSep)
              to: strings
            - opt:
                do:
                  - return: coretrace.StateValue{}, coretrace.InvalidTraceState
                when: "!found || !builder.Add(key, value)"
          key: _
          range: fields
          value: field
      - return: builder.State(), nil
        to: builder.State
