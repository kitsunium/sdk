# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The JSON literals an appender writes for a bool; null is jsonNull, the
      literal the response decoder reads.
    grouped: true
    items:
      - name: jsonTrue
        type: string
        value: "\"true\""
      - name: jsonFalse
        type: string
        value: "\"false\""
    name: jsonTrue
  - doc: |-
      DefaultTimeout bounds one export round trip when an HTTPConfig leaves Timeout
      unset. Ten seconds is the value the OpenTelemetry protocol exporter
      specification itself defaults OTEL_EXPORTER_OTLP_TIMEOUT to, so it is a clamp
      onto the specification's own number rather than a figure this SDK invented
      (ADR 0031).
    items:
      - name: DefaultTimeout
        type: time.Duration
        value: 10 * time.Second
    name: DefaultTimeout
  - doc: |-
      DefaultMaxResponseBytes caps how much of a collector's response body is
      read: 1 MiB. A conforming response is an ExportMetricsServiceResponse, an
      ExportTraceServiceResponse or a Status message — hundreds of bytes. The cap
      exists because the body is the one length a REMOTE party controls in this
      exchange; the REQUEST body is deliberately not capped, because its size is a
      property of the caller's own volume, any SDK-chosen ceiling would be
      arbitrary (ADR 0031 §refuse), and the collector already answers 413 for one
      it will not take.

      It also bounds the drain that recycles the connection after the verdict —
      always this default rather than HTTPConfig.MaxResponseBytes, for the reason
      closeResponse gives.
    items:
      - name: DefaultMaxResponseBytes
        type: int64
        value: 1 << 20
    name: DefaultMaxResponseBytes
  - doc: |-
      DocumentTerminator ends each document a WRITER-bound OTLP exporter emits, so
      a stream of exports is newline-delimited JSON. It is deliberately NOT part of
      what Marshal returns: that is the HTTP body, and a body is one document.
    items:
      - name: DocumentTerminator
        type: byte
        value: "'\\n'"
    name: DocumentTerminator
  - doc: |-
      jsonNull is the literal a JSON decoder is handed for an explicitly null
      field; it leaves a LenientInt64 at its zero, which means "fully accepted".
    items:
      - name: jsonNull
        type: string
        value: "\"null\""
    name: jsonNull
  - doc: |-
      The three spellings proto3 JSON gives a non-finite double. A double is "a
      number or one of the special string values 'NaN', 'Infinity', and
      '-Infinity'", so a NaN gauge reading or a NaN-valued attribute is
      expressible rather than fatal — unlike encoding/json's own float path, which
      refuses it outright.
    grouped: true
    items:
      - name: jsonNaN
        type: string
        value: "`\"NaN\"`"
      - name: jsonPosInfinity
        type: string
        value: "`\"Infinity\"`"
      - name: jsonNegInfinity
        type: string
        value: "`\"-Infinity\"`"
    name: jsonNaN
  - doc: |-
      The strconv parameters every rendering here uses: base ten, and the
      shortest-round-trip spelling of a 64-bit double.
    grouped: true
    items:
      - name: decimalBase
        type: int
        value: "10"
      - name: floatFmt
        type: byte
        value: "'g'"
      - name: floatPrec
        type: int
        value: "-1"
      - name: floatBitSize
        type: int
        value: "64"
    name: decimalBase
  - doc: |-
      intBufferSize pre-sizes a quoted 64-bit decimal: 20 digits, a sign, two
      quotes, rounded up.
    items:
      - name: intBufferSize
        type: int
        value: "24"
    name: intBufferSize
  - doc: |-
      fallbackIdleTimeout is how long the default client's fallback transport
      keeps an idle connection — see newTransport. It is net/http's own
      DefaultTransport value, so the fallback reaps its pool exactly as the clone
      it stands in for does, rather than holding a connection for as long as the
      collector tolerates it.
    items:
      - name: fallbackIdleTimeout
        type: time.Duration
        value: 90 * time.Second
    name: fallbackIdleTimeout
  - doc: |-
      contentType labels the body. The specification is explicit that both client
      and server MUST set "Content-Type: application/json" for the JSON encoding,
      so the sender sets it LAST and it always wins over a caller-supplied header
      of the same name.
    items:
      - name: contentType
        type: string
        value: "\"application/json\""
    name: contentType
  - doc: |-
      The two header names the sender writes and reads. Retry-After carries the
      collector's own back-off hint under §OTLP/HTTP Throttling; the client SHOULD
      honour it — which is the caller's job here, because nothing here retries.
    grouped: true
    items:
      - name: contentTypeHeader
        type: string
        value: "\"Content-Type\""
      - name: retryAfterHeader
        type: string
        value: "\"Retry-After\""
    name: contentTypeHeader
  - doc: The 2xx window, named so the classification reads as the specification does.
    grouped: true
    items:
      - name: httpStatusOK
        type: int
        value: "200"
      - name: httpStatusMultiChoices
        type: int
        value: "300"
    name: httpStatusOK
  - doc: |-
      The two errs Field keys every verdict may carry; the third, the rejected
      count's, is the signal's (SignalSpec.RejectedField). None of them carries
      remote-controlled text or the endpoint. retry_after_seconds is the key
      app/resilience.RetryAfter reads, so a RetryConfig.Delay honours the
      collector's hint as written; the suite pins the two spellings together.
    grouped: true
    items:
      - name: retryAfterFieldKey
        type: string
        value: "\"retry_after_seconds\""
      - name: statusFieldKey
        type: string
        value: "\"http_status\""
    name: retryAfterFieldKey
  - doc: The two URL schemes OTLP/HTTP speaks, plus the path that is not one.
    grouped: true
    items:
      - name: schemeHTTP
        type: string
        value: "\"http\""
      - name: schemeHTTPS
        type: string
        value: "\"https\""
      - name: rootPath
        type: string
        value: "\"/\""
    name: schemeHTTP
