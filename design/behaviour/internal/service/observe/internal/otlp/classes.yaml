functions:
  - name: AppendString
    params: dst []byte, s string
    results: "[]byte"
  - name: AppendKey
    params: dst []byte, key string
    results: "[]byte"
  - name: AppendBool
    params: dst []byte, v bool
    results: "[]byte"
  - name: AppendNull
    params: dst []byte
    results: "[]byte"
  - name: AppendKeyValues
    params: dst []byte, attrs []KeyValue
    results: "[]byte"
  - name: Attrs
    params: attrs []coreotel.AttrValue
    results: "[]KeyValue"
  - name: KeyValueOf
    params: attr coreotel.AttrValue
    results: KeyValue
  - name: Marshal
    params: request R, failure *errs.WrapParams
    results: doc []byte, err error
    typeParams: R any
  - name: UnixNano
    params: instant time.Time
    results: Uint64
  - name: ResourceOf
    params: resource coreotel.ResourceValue
    results: ResourceMessage
  - name: DecodeRejected
    params: payload []byte, into RejectedCounter
    results: int64
  - doc: appendInt appends a signed decimal, unquoted.
    name: appendInt
    params: dst []byte, v int64
    results: "[]byte"
  - doc: appendUint appends an unsigned decimal, unquoted.
    name: appendUint
    params: dst []byte, v uint64
    results: "[]byte"
  - doc: |-
      appendDouble appends value as Double's MarshalJSON renders it: shortest
      round-trip, or its quoted name when it is not finite.
    name: appendDouble
    params: dst []byte, value float64
    results: "[]byte"
  - name: ScopeOf
    params: scope coreotel.ScopeValue
    results: ScopeMessage
  - name: NewSender
    params: cfg *HTTPConfig, signal *SignalSpec
    results: sender *Sender, err error
  - doc: |-
      checkEndpoint refuses an endpoint that cannot address a collector.

      The path check is the one that earns its keep: every other mistake surfaces
      as a connection error a reader recognises, while a bare
      "http://collector:4318" connects, gets a 404, and looks exactly like a
      collector that is up.
    name: checkEndpoint
    params: endpoint string, signal *SignalSpec
    results: error
  - doc: |-
      newClient builds the default client: bounded by timeout, refusing to follow
      a redirect, and riding a connection pool of its own.

      The redirect refusal is CWE-918. A 30x from a collector — or from anything
      sitting in front of one — would otherwise bounce a POST carrying the
      caller's Authorization header to whatever host the response names, past an
      allowlist that only ever saw the configured endpoint. ErrUseLastResponse
      stops the chain and hands the 30x back as-is, where it is classified as a
      permanent rejection.

      The pool is newTransport's, which says why it is not the process's.
    name: newClient
    params: timeout time.Duration
    results: "*http.Client"
  - doc: |-
      newTransport returns the connection pool the default client owns: a clone of
      http.DefaultTransport, so every setting a process expects of an outbound
      client — the proxy environment first of all — carries over, and none of its
      connections do.

      # Why the default client does not share http.DefaultTransport

      Because anything in the process can empty that pool, and net/http turns
      doing so at the wrong instant into a wrong verdict. A response with no body
      is put back in the idle pool BEFORE the waiting round trip is handed it, and
      a CloseIdleConnections landing in that window closes the connection under
      it: the round trip then reports "connection broken" for a response that had
      already arrived. That made a 200 a retryable Unavailable — the caller's retry
      replays data the collector accepted, which double-counts a delta point or
      stores a span twice — a 429 lose its Retry-After, and a 413 retryable. Every
      httptest.Server.Close and every http.DefaultClient.CloseIdleConnections is
      such a call, made by code this sender cannot see.

      A caller-supplied HTTPConfig.Client is used as given, Transport included,
      so one that rides http.DefaultTransport inherits that exposure; giving it a
      Transport of its own is how it avoids it.

      The clone is a snapshot taken at construction. A process that has replaced
      http.DefaultTransport with something other than an *http.Transport leaves
      nothing to clone, and a fresh transport that still honours the proxy
      environment stands in; one that routes traffic through a custom
      RoundTripper passes it as HTTPConfig.Client.

      Each sender therefore owns a pool, and nothing here closes it: an exporter
      port has no lifecycle method, so idle connections are reaped by the
      transport's idle timeout. One exporter per collector, built once, is the
      intended shape; building one per export holds a pool per call until then.
    name: newTransport
    results: "*http.Transport"
  - doc: |-
      closeResponse drains what is left of the body and closes it, so the
      connection returns to the keep-alive pool.

      The drain is BOUNDED, by DefaultMaxResponseBytes, because it is a read of the
      same remote-controlled length the verdict's read is bounded by, and the only
      one that was not: a collector streaming an endless body held an export here
      forever whenever the client had no deadline. The default client's Timeout
      covers the body; a caller-supplied client is used as-is and may carry none.
      Past the bound the body is closed unread. net/http recycles only a
      connection whose response it has seen end, and the drain it attempts itself
      after an early Close is bounded as well, so a body that runs past both costs
      the connection — which is correct: reading on to save one handshake is
      exactly what the bound refuses.

      It is the DEFAULT and not HTTPConfig.MaxResponseBytes on purpose. That knob
      bounds what is read into MEMORY; this read keeps nothing, and a caller who
      lowered the cap must not lose connection reuse on a conforming response for
      it.

      The bound is on BYTES, not on time: a collector that stops sending mid-body
      is bounded only by the client's deadline, which is why the default client
      carries one.

      Both outcomes are DELIBERATELY discarded: the delivery verdict was already
      computed from the status line, so a teardown fault cannot change it, and
      reporting one would replace a correct verdict with a misleading one. Same
      posture as the nettransport writer's swallowErr.
    name: closeResponse
    params: response *http.Response
  - doc: |-
      swallowTeardown intentionally drops a body-teardown error. It exists as a
      named function so the discard is a documented decision at each call site
      rather than an anonymous blank assignment.
    name: swallowTeardown
    params: err error
  - doc: |-
      isRetryableStatus reports whether status is in the specification's
      retryable set. The set is closed and spelled out rather than derived from the
      status class, because 5xx is NOT retryable as a class — a 500 or a 501 means
      the same request will fail the same way.
    name: isRetryableStatus
    params: status int
    results: bool
  - doc: |-
      retryAfterSeconds reads the collector's throttling hint, in seconds, and
      returns 0 when there is none it can trust.

      Only the delta-seconds form is read. The header also allows an HTTP-date,
      and converting one here would mean comparing the collector's clock to ours —
      the sort of quiet assumption that shows up months later as a retry storm. A
      caller who needs the date form reads the header from their own http.Client's
      response.
    name: retryAfterSeconds
    params: header http.Header
    results: int
  - name: NewStream
    params: dst io.Writer, failure *errs.WrapParams
    results: "*Stream"
imports:
  bytes: bytes
  context: context
  coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  http: net/http
  io: io
  json: encoding/json
  jsonenc: github.com/kitsunium/sdk/internal/kernel/jsonenc
  maps: maps
  math: math
  strconv: strconv
  strings: strings
  sync: sync
  time: time
  url: net/url
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/observe/internal/otlp
  name: otlp
  purpose: "Package otlp — the appenders: one OTLP/JSON document written into one buffer, byte for byte what Marshal renders, without reflection and without a slice per scalar."
types:
  - fields:
      - name: StringValue
        type: "*string"
      - name: BoolValue
        type: "*bool"
      - name: IntValue
        type: "*Int64"
      - name: DoubleValue
        type: "*Double"
    kind: struct
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: v AnyValue
        results: "[]byte"
    name: AnyValue
  - fields:
      - doc: |-
          Endpoint is the FULL URL the payload is POSTed to, used exactly as
          given — no path is appended, no scheme is guessed.

          That mirrors the specification's own split: the per-signal endpoint
          variable is documented as a full URL used without modification, and it
          exists precisely because joining a base with a path is where collectors
          and SDKs disagree. A caller writes "http://collector:4318" plus the
          signal's path constant (OTLPMetricsPath, OTLPTracesPath), where a
          reviewer can see the whole address in one string.

          It is REFUSED at construction when it is not an absolute http(s) URL with
          a host and a non-root path: a bare host would POST to "/" and collect
          404s forever, which looks exactly like a collector that is up.
        name: Endpoint
        type: string
      - doc: |-
          Client is the http.Client the POST rides on. When nil, a client bounded
          by Timeout and refusing every redirect is built, on a connection pool of
          its own: a clone of http.DefaultTransport while that is the stdlib's
          *http.Transport, proxy environment included. A process that replaced
          http.DefaultTransport with another RoundTripper gets a fresh transport
          that keeps only the proxy environment and the idle reaping, never that
          RoundTripper — routing, an mTLS identity or a policy that lives in one
          reaches this exporter only through a Client that carries it.

          A supplied client is used AS-IS, including its own timeout, redirect
          policy and Transport — it is the seam a caller uses to install a proxy,
          an mTLS identity or an SSRF allowlist, and second-guessing it here would
          defeat that. One whose Transport is http.DefaultTransport (a nil
          Transport is) shares that pool with the whole process, and anything that
          empties it — every httptest.Server.Close, every
          http.DefaultClient.CloseIdleConnections — can make a response that had
          already arrived read as a transport fault, so a 200 comes back retryable.
          Give such a client a Transport of its own.
        name: Client
        type: "*http.Client"
      - doc: |-
          Headers are set on every request before Content-Type, so a hosted
          collector's Authorization or tenant header can ride along. Their values
          are treated as secrets: they are never echoed into an error or a field.
        name: Headers
        type: map[string]string
      - doc: |-
          Timeout bounds one export round trip, request and response body
          together. Non-positive CLAMPS to DefaultTimeout; there is no "no timeout"
          setting, because a stalled collector must never wedge the goroutine that
          is exporting (ADR 0031).

          It is ignored when Client is non-nil — a caller who brought their own
          client brought their own deadline.
        name: Timeout
        type: time.Duration
      - doc: |-
          MaxResponseBytes caps the response body read. Non-positive CLAMPS to
          DefaultMaxResponseBytes.
        name: MaxResponseBytes
        type: int64
    kind: struct
    name: HTTPConfig
  - fields:
      - name: Key
        type: string
      - name: Value
        type: AnyValue
    kind: struct
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: kv KeyValue
        results: "[]byte"
    name: KeyValue
  - fields:
      - name: Attributes
        type: "[]KeyValue"
    kind: struct
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: m ResourceMessage
        results: "[]byte"
    name: ResourceMessage
  - kind: named
    name: RejectedCounter
    underlying: |-
      interface {
      	RejectedCount() int64
      }
  - kind: named
    methods:
      - name: UnmarshalJSON
        params: data []byte
        recv: v *LenientInt64
        results: error
    name: LenientInt64
    underlying: int64
  - doc: |-
      exportResponse is a signal's ExportXServiceResponse: the body of every
      accepted OTLP/HTTP request, reduced to its partialSuccess. The field holds
      the signal's own message BY POINTER, and encoding/json decodes through an
      interface holding a non-nil pointer into the value it points to — so the
      decode lands in the caller's struct, with that struct's static tags.
    fields:
      - name: PartialSuccess
        type: RejectedCounter
    kind: struct
    name: exportResponse
  - kind: named
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: v Int64
        results: "[]byte"
      - name: MarshalJSON
        recv: v Int64
        results: encoded []byte, err error
    name: Int64
    underlying: int64
  - kind: named
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: v Uint64
        results: "[]byte"
      - name: MarshalJSON
        recv: v Uint64
        results: encoded []byte, err error
    name: Uint64
    underlying: uint64
  - kind: named
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: v Double
        results: "[]byte"
      - name: MarshalJSON
        recv: v Double
        results: encoded []byte, err error
    name: Double
    underlying: float64
  - fields:
      - name: Name
        type: string
      - name: Version
        type: string
    kind: struct
    methods:
      - name: AppendJSON
        params: dst []byte
        recv: m ScopeMessage
        results: "[]byte"
    name: ScopeMessage
  - fields:
      - doc: endpoint is the validated full URL.
        name: endpoint
        type: string
      - doc: client is the caller's, or the bounded redirect-refusing default.
        name: client
        type: "*http.Client"
      - doc: headers are owned copies of the caller's, written on every request.
        name: headers
        type: map[string]string
      - doc: maxResponse caps the response body read.
        name: maxResponse
        type: int64
      - doc: signal names every verdict in the calling signal's words.
        name: signal
        type: "*SignalSpec"
    kind: struct
    methods:
      - name: Post
        params: body []byte
        recv: s *Sender
        results: error
      - name: PostContext
        params: ctx context.Context, body []byte
        recv: s *Sender
        results: error
      - doc: |-
          classify maps a collector's answer onto one of three verdicts, following the
          specification's own sections.

            - §Full Success / §Partial Success: HTTP 2xx. The body is the signal's
              ExportXServiceResponse; a populated partialSuccess means data was LOST,
              and the client "MUST NOT retry the request", so it is reported as a
              non-retryable failure rather than swallowed as a success.
            - §Retryable Response Codes: 429, 502, 503, 504 — and only those. The
              specification is explicit that "all other 4xx or 5xx response status
              codes MUST NOT be retried".
            - everything else: a permanent rejection.
        name: classify
        params: response *http.Response, payload []byte
        recv: s *Sender
        results: error
      - doc: |-
          partialSuccessOf turns a 2xx body's rejected count into a verdict.

          An unparseable or empty body is a SUCCESS — see DecodeRejected for why
          inventing a loss from a malformed response would be worse than ignoring it.
        name: partialSuccessOf
        params: payload []byte
        recv: s *Sender
        results: error
    name: Sender
  - fields:
      - doc: |-
          EndpointInvalid refuses an endpoint that cannot address a collector:
          empty, not http or https, no host, or no path beyond "/".
        name: EndpointInvalid
        type: "*errs.Error"
      - doc: |-
          EndpointUnparsable wraps url.Parse's own failure. It carries the
          EndpointInvalid code with the parse error on the trail, and never the
          URL's text.
        name: EndpointUnparsable
        type: errs.WrapParams
      - doc: |-
          RequestUnbuildable wraps http.NewRequest's failure — near-unreachable,
          the endpoint having been validated at construction, and still typed.
        name: RequestUnbuildable
        type: errs.WrapParams
      - doc: |-
          TransportFault wraps a client.Do failure: the request never got an
          answer, which the specification says a client SHOULD retry. It must
          carry the Unavailable code, so the signal's retry classifier sees it.
        name: TransportFault
        type: errs.WrapParams
      - doc: |-
          Rejected is the permanent verdict: a status outside the retryable set,
          or a 3xx the redirect refusal handed back.
        name: Rejected
        type: "*errs.Error"
      - doc: "Unavailable is the transient verdict: one of HTTP 429, 502, 503, 504."
        name: Unavailable
        type: "*errs.Error"
      - doc: |-
          PartialSuccess is the verdict for a 2xx whose body reports rejected
          items: data was lost, and the specification forbids replaying it.
        name: PartialSuccess
        type: "*errs.Error"
      - doc: |-
          RejectedField is the errs Field key a PartialSuccess carries the
          rejected count under: "rejected_data_points", "rejected_spans".
        name: RejectedField
        type: string
      - doc: |-
          DecodeRejected reads the rejected count out of a 2xx body — the one
          member that differs between ExportMetricsServiceResponse and
          ExportTraceServiceResponse. A signal passes a function that hands
          otlp.DecodeRejected a fresh pointer to its own partial-success message.
        name: DecodeRejected
        type: func(payload []byte) int64
    kind: struct
    name: SignalSpec
  - fields:
      - doc: mu serialises the one dst.Write of each document.
        name: mu
        type: sync.Mutex
      - doc: dst is the caller's destination.
        name: dst
        type: io.Writer
      - doc: |-
          failure is the signal's wrap for a writer fault: its EXPORT_FAILED code
          and its wording.
        name: failure
        type: errs.WrapParams
    kind: struct
    methods:
      - name: Emit
        params: doc []byte
        recv: s *Stream
        results: error
    name: Stream
