            - bind: v, has
              eval: g.Labels[k]
            - bind: mark
              eval: labelAbsent
            - opt:
                do:
                  - set: mark
                    value: labelPresent
                when: has
            - set: key
              to: appendPart
              value: appendPart(append(key, mark), v)
          key: _
          range: keys
