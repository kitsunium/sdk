          	})
        to: slices
      - opt:
          do:
            - set: groups
              value: groups[:cfg.MaxGroups]
          when: cfg.MaxGroups > 0 && len(groups) > cfg.MaxGroups
      - return: groups
  - of: groupKey
    participants:
      - id: caller
        kind: actor
      - id: groupKey
        kind: self
      - id: appendPart
        kind: internal
