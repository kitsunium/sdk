      - loop:
          do:
            - bind: xv, xHas
              eval: x[k]
            - bind: yv, yHas
              eval: y[k]
            - opt:
                do:
                  - return: c
                init:
                  bind: c
                  eval: cmp.Or(cmpBool(xHas, yHas), cmp.Compare(xv, yv))
                  to: cmp
                when: c != 0
          key: _
          range: keys
          value: k
      - return: "0"
  - of: cmpBool
    steps:
      - switch:
          cases:
            - case: x == y
              do:
                - return: "0"
            - case: "!x"
              do:
                - return: "-1"
      - return: "1"
  - of: cut
    participants:
      - id: caller
        kind: actor
      - id: cut
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: slices.Clone(stack)
              to: slices
          when: n <= 0 || len(stack) <= n
      - return: slices.Clone(stack[:n])
        to: slices
  - of: runtimeFrame
    steps:
      - return: |-
          strings.HasPrefix(fn, "runtime.") || strings.HasPrefix(fn, "runtime/") ||
          		strings.HasPrefix(fn, "internal/") || strings.Contains(fn, ".runtime_")
  - of: parseTracebackLabels
    participants:
      - id: caller
        kind: actor
      - id: parseTracebackLabels
        kind: self
      - id: labelToken
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - bind: out
        eval: make(map[string]string)
      - loop:
          cond: s != ""
          do:
            - bind: key, rest, ok
              eval: labelToken(s)
              to: labelToken
            - opt:
                do:
                  - return: out
                when: "!ok || !strings.HasPrefix(rest, \": \")"
            - bind: value, rest, ok
              eval: labelToken(rest[2:])
              to: labelToken
            - opt:
                do:
                  - return: out
                when: "!ok"
            - set: out[key]
              value: value
            - set: s
              to: strings
              value: strings.TrimPrefix(rest, ", ")
      - return: out
  - of: labelToken
    participants:
      - id: caller
        kind: actor
      - id: labelToken
        kind: self
      - id: strconv
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - loop:
                cond: i < len(s)
                do:
                  - switch:
                      cases:
                        - case: "'\\\\'"
                          do:
                            - op: ++
                              set: i
                        - case: "'\"'"
                          do:
                            - bind: v, err
                              eval: strconv.Unquote(s[:i+1])
                              to: strconv
                            - return: v, s[i+1:], err == nil
                      "on": s[i]
                init: i := 1
                post: i++
            - return: "\"\", \"\", false"
          when: strings.HasPrefix(s, `"`)
      - bind: end
        eval: strings.IndexAny(s, ":,")
        to: strings
      - opt:
          do:
            - return: s, "", true
          when: end < 0
      - return: s[:end], s[end:], true
  - of: parseCounts
    participants:
      - id: caller
        kind: actor
      - id: parseCounts
        kind: self
      - id: bufio
        kind: stdlib
      - id: sc.Buffer
        kind: value
      - id: sc.Text
        kind: value
      - id: strconv
        kind: stdlib
      - id: parseCountLabels
        kind: internal
      - id: appendCountFrame
        kind: internal
    steps:
      - var:
          name: out
          type: "[]countRecord"
      - var:
          name: cur
          type: "*countRecord"
      - bind: sc
        eval: bufio.NewScanner(bytes.NewReader(text))
        to: bufio
      - eval: sc.Buffer(make([]byte, 0, 64<<10), dumpLineMax)
        to: sc.Buffer
      - loop:
          cond: sc.Scan()
          do:
            - bind: line
              eval: sc.Text()
              to: sc.Text
            - switch:
                cases:
                  - case: strings.Contains(line, " @ ")
                    do:
                      - bind: n, err
                        eval: strconv.Atoi(strings.TrimSpace(line[:strings.Index(line, " @ ")]))
                        to: strconv
                      - set: cur
                        value: nil
                      - opt:
                          do:
                            - set: out
                              value: "append(out, countRecord{count: n})"
                            - set: cur
                              value: "&out[len(out)-1]"
                          when: err == nil
                  - case: cur == nil
                  - case: "strings.HasPrefix(line, \"# labels: \")"
                    do:
                      - set: cur.labels
                        to: parseCountLabels
                        value: "parseCountLabels(strings.TrimPrefix(line, \"# labels: \"))"
                  - case: strings.HasPrefix(line, "#\t")
                    do:
                      - set: cur.stack
                        to: appendCountFrame
                        value: appendCountFrame(cur.stack, line)
      - return: out
  - of: appendCountFrame
    participants:
      - id: caller
        kind: actor
      - id: appendCountFrame
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: column
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: part == ""
            - opt:
                do:
                  - bind: fn, _, _
                    eval: strings.Cut(part, "+0x")
                    to: strings
                  - return: append(stack, fn)
                when: column == countFunctionColumn
            - op: ++
              set: column
          key: part
          range: strings.SplitSeq(line, "\t")
      - return: stack
  - of: parseCountLabels
    participants:
      - id: caller
        kind: actor
      - id: parseCountLabels
        kind: self
      - id: strings
        kind: stdlib
      - id: quotedToken
        kind: internal
    steps:
      - set: s
        to: strings
        value: strings.TrimSuffix(strings.TrimPrefix(strings.TrimSpace(s), "{"), "}")
      - bind: out
        eval: make(map[string]string)
      - loop:
          cond: s != ""
          do:
            - bind: key, rest, ok
              eval: quotedToken(s)
              to: quotedToken
            - opt:
                do:
                  - return: out
                when: "!ok || !strings.HasPrefix(rest, \":\")"
            - bind: value, rest, ok
              eval: quotedToken(rest[1:])
              to: quotedToken
            - opt:
                do:
                  - return: out
                when: "!ok"
            - set: out[key]
              value: value
            - set: s
              to: strings
              value: strings.TrimLeft(strings.TrimPrefix(strings.TrimSpace(rest), ","), " ")
      - return: out
  - of: quotedToken
    participants:
      - id: caller
        kind: actor
      - id: quotedToken
        kind: self
      - id: strings
        kind: stdlib
      - id: labelToken
        kind: internal
    steps:
      - set: s
        to: strings
        value: strings.TrimSpace(s)
      - opt:
          do:
            - return: "\"\", \"\", false"
          when: "!strings.HasPrefix(s, `\"`)"
      - return: labelToken(s)
        to: labelToken
  - of: stackKey
    participants:
      - id: caller
        kind: actor
      - id: stackKey
        kind: self
      - id: slices
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - set: stack
        to: slices
        value: slices.DeleteFunc(slices.Clone(stack), func(fn string) bool { return fn == "runtime.goexit" })
      - return: strings.Join(stack[:min(joinDepth, len(stack))], "\n")
        to: strings
  - of: joinLabels
    participants:
      - id: caller
        kind: actor
      - id: joinLabels
        kind: self
      - id: stackKey
        kind: internal
      - id: maps
        kind: stdlib
    steps:
      - bind: byStack
        eval: make(map[string][]*countRecord, len(records))
      - loop:
          do:
            - opt:
                do:
                  - bind: k
                    eval: stackKey(records[i].stack)
                    to: stackKey
                  - set: byStack[k]
                    value: append(byStack[k], &records[i])
                when: len(records[i].labels) > 0
          key: i
          range: records
      - var:
          name: names
          type: "[]string"
      - loop:
          do:
            - set: names
              value: names[:0]
            - loop:
                do:
                  - set: names
                    value: append(names, f.Function)
                key: _
                range: gs[i].Stack
                value: f
            - loop:
                do:
                  - opt:
                      do:
                        - op: "--"
                          set: rec.count
                        - set: gs[i].Labels
                          to: maps
                          value: maps.Clone(rec.labels)
                        - break: true
                      when: rec.count > 0
                key: _
                range: byStack[stackKey(names)]
                value: rec
          key: i
          range: gs
  - of: Parse
    participants:
      - id: caller
        kind: actor
      - id: Parse
        kind: self
      - id: inflate
        kind: internal
      - id: fields
        kind: internal
      - id: d.resolve
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, errs.Wrap(coreprofiling.ProfileTooLarge, errs.WrapParams{}, errs.Int("bytes", len(data)))
          when: len(data) > MaxProfileBytes
      - bind: raw, err
        eval: inflate(data)
        to: inflate
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: d
        eval: "&decoder{locations: make(map[uint64]rawLocation), functions: make(map[uint64]rawFunction)}"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: fields(raw, d.profileField)
            to: fields
          when: err != nil
      - return: d.resolve(MaxFrames)
        to: d.resolve
  - of: inflate
    participants:
      - id: caller
        kind: actor
      - id: inflate
        kind: self
      - id: coretransform
        kind: package
      - id: bounded.DecompressBounded
        kind: value
    steps:
      - opt:
          do:
            - return: data, nil
          when: "!bytes.HasPrefix(data, gzipMagic)"
      - bind: scheme, found
        eval: coretransform.Lookup(gzipAlgorithm)
        to: coretransform
      - bind: bounded, isBounded
        eval: scheme.(coretransform.BoundedDecompressor)
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coretransform.UnknownCompressor, errs.WrapParams{},
                			errs.String("algorithm", string(gzipAlgorithm)))
          when: "!found || !isBounded"
      - bind: out, err
        eval: bounded.DecompressBounded(nil, data, int64(MaxProfileBytes))
        to: bounded.DecompressBounded
      - opt:
          do:
            - return: out, nil
          when: err == nil
      - opt:
          do:
            - return: nil, coreprofiling.ProfileTooLarge
          when: errs.HasCode(err, coretransform.CodeDecompressedTooLarge)
      - return: nil, errs.Wrap(libraryCause(err), malformedParams("gzip"))
  - of: libraryCause
    participants:
      - id: caller
        kind: actor
      - id: libraryCause
        kind: self
      - id: sdkErr.Source
        kind: value
    steps:
      - bind: cause
        eval: err
      - loop:
          do:
            - bind: sdkErr, isSDK
              eval: cause.(*errs.Error)
            - opt:
                do:
                  - return: cause
                when: "!isSDK || sdkErr == nil"
            - set: cause
              to: sdkErr.Source
              value: sdkErr.Source()
          forever: true
  - of: malformedParams
    steps:
      - return: |-
          errs.WrapParams{
          		Code: coreprofiling.CodeProfileMalformed, Reason: "PROFILE_MALFORMED", Public: coreprofiling.ProfileMalformed.Public(),
          		Private: coreprofiling.ProfileMalformed.Private() + " (" + what + ")",
          	}
  - of: fields
    participants:
      - id: caller
        kind: actor
      - id: fields
        kind: self
      - id: w.key
        kind: internal
      - id: w.skip
        kind: internal
    steps:
      - bind: w
        eval: "wire{buf: buf}"
      - loop:
          cond: w.more()
          do:
            - bind: field, kind, err
              eval: w.key()
              to: w.key
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: handled, err
              eval: read(&w, field, kind)
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: w.skip(kind)
                        to: w.skip
                      when: err != nil
                when: "!handled"
      - return: nil
  - of: scalar
    participants:
      - id: caller
        kind: actor
      - id: scalar
        kind: self
      - id: w.varint
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, malformed("scalar")
          when: kind != wireVarint
      - bind: v, err
        eval: w.varint()
        to: w.varint
      - return: int64(v), err
  - of: payload
    participants:
      - id: caller
        kind: actor
      - id: payload
        kind: self
      - id: w.bytes
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, malformed("message")
          when: kind != wireBytes
      - return: w.bytes()
        to: w.bytes
  - of: (*decoder).profileField
    steps:
      - bind: read, known
        eval: profileReaders[field]
      - opt:
          do:
            - return: false, nil
          when: "!known"
      - return: true, read(d, w, kind)
  - of: (*decoder).readString
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readString
        kind: self
      - id: payload
        kind: internal
    steps:
      - bind: s, err
        eval: payload(w, kind)
        to: payload
      - set: d.strings
        value: append(d.strings, string(s))
      - return: err
  - of: (*decoder).readComment
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readComment
        kind: self
      - id: w.varints
        kind: internal
    steps:
      - bind: values, err
        eval: w.varints(nil, kind)
        to: w.varints
      - loop:
          do:
            - set: d.comments
              value: append(d.comments, int64(v))
          key: _
          range: values
          value: v
      - return: err
  - of: (*decoder).readSampleType
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readSampleType
        kind: self
      - id: valueType
        kind: internal
    steps:
      - bind: t, err
        eval: valueType(w, kind)
        to: valueType
      - set: d.types
        value: append(d.types, t)
      - return: err
  - of: (*decoder).readPeriodType
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readPeriodType
        kind: self
      - id: valueType
        kind: internal
    steps:
      - bind: t, err
        eval: valueType(w, kind)
        to: valueType
      - set: d.periodType
        value: t
      - return: err
  - of: (*decoder).readTime
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readTime
        kind: self
      - id: scalar
        kind: internal
    steps:
      - bind: v, err
        eval: scalar(w, kind)
        to: scalar
      - set: d.timeNanos
        value: v
      - return: err
  - of: (*decoder).readDuration
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readDuration
        kind: self
      - id: scalar
        kind: internal
    steps:
      - bind: v, err
        eval: scalar(w, kind)
        to: scalar
      - set: d.durationNanos
        value: v
      - return: err
  - of: (*decoder).readPeriod
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readPeriod
        kind: self
      - id: scalar
        kind: internal
    steps:
      - bind: v, err
        eval: scalar(w, kind)
        to: scalar
      - set: d.period
        value: v
      - return: err
  - of: (*decoder).readDefaultType
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readDefaultType
        kind: self
      - id: scalar
        kind: internal
    steps:
      - bind: v, err
        eval: scalar(w, kind)
        to: scalar
      - set: d.defaultType
        value: v
      - return: err
  - of: valueType
    participants:
      - id: caller
        kind: actor
      - id: valueType
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: rawType{}, err
          when: err != nil
      - var:
          name: t
          type: rawType
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		//: the two fields of a ValueType.
          		switch field {
          		//: what is measured.
          		case 1:
          			var ferr error
          			t.typ, ferr = scalar(w, kind)
          			//: read.
          			return true, ferr
          		//: its unit.
          		case 2:
          			var ferr error
          			t.unit, ferr = scalar(w, kind)
          			//: read.
          			return true, ferr
          		}
          		//: anything else is skipped.
          		return false, nil
          	})
      - return: t, err
  - of: timeOf
    participants:
      - id: caller
        kind: actor
      - id: timeOf
        kind: self
      - id: time.Unix(0, nanos).UTC
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}
          when: nanos == 0
      - return: time.Unix(0, nanos).UTC()
        to: time.Unix(0, nanos).UTC
  - of: (*resolver).spend
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).spend
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(coreprofiling.ProfileTooLarge, errs.WrapParams{}, errs.Int("max_frames", r.limit))
              to: errs
          when: n > r.budget
      - op: "-="
        set: r.budget
        value: "n"
      - return: nil
  - of: (*resolver).str
    steps:
      - opt:
          do:
            - return: "\"\", malformed(\"string index\")"
          when: i < 0 || i >= int64(len(r.d.strings))
      - return: r.d.strings[i], nil
  - of: (*resolver).valueType
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).valueType
        kind: self
      - id: r.str
        kind: internal
    steps:
      - bind: typ, err
        eval: r.str(t.typ)
        to: r.str
      - opt:
          do:
            - return: coreprofiling.SampleTypeValue{}, err
          when: err != nil
      - bind: unit, err
        eval: r.str(t.unit)
        to: r.str
      - return: "coreprofiling.SampleTypeValue{Type: typ, Unit: unit}, err"
  - of: (*resolver).header
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).header
        kind: self
      - id: r.valueType
        kind: internal
      - id: r.str
        kind: internal
    steps:
      - loop:
          do:
            - bind: st, err
              eval: r.valueType(t)
              to: r.valueType
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: p.SampleTypes
              value: append(p.SampleTypes, st)
          key: _
          range: r.d.types
          value: t
      - var:
          name: err
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: p.PeriodType, err
            eval: r.valueType(r.d.periodType)
            op: =
            to: r.valueType
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: p.DefaultSampleType, err
            eval: r.str(r.d.defaultType)
            op: =
            to: r.str
          when: err != nil
      - loop:
          do:
            - bind: text, err
              eval: r.str(c)
              to: r.str
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: p.Comments
              value: append(p.Comments, text)
          key: _
          range: r.d.comments
          value: c
      - return: nil
  - of: (*resolver).sample
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).sample
        kind: self
      - id: r.location
        kind: internal
      - id: r.spend
        kind: internal
      - id: r.labels
        kind: internal
    steps:
      - opt:
          do:
            - return: coreprofiling.SampleValue{}, malformed("sample values")
          when: len(raw.values) != types
      - bind: stack
        eval: make([]coreprofiling.FrameValue, 0, min(len(raw.locations), r.budget))
      - loop:
          do:
            - bind: frames, err
              eval: r.location(id)
              to: r.location
            - opt:
                do:
                  - return: coreprofiling.SampleValue{}, err
                when: err != nil
            - opt:
                do:
                  - return: coreprofiling.SampleValue{}, err
                init:
                  bind: err
                  eval: r.spend(len(frames))
                  to: r.spend
                when: err != nil
            - set: stack
              value: append(stack, frames...)
          key: _
          range: raw.locations
          value: id
      - bind: labels, numbers, err
        eval: r.labels(raw.labels)
        to: r.labels
      - return: "coreprofiling.SampleValue{Labels: labels, NumLabels: numbers, Stack: stack, Values: raw.values}, err"
  - of: (*resolver).location
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).location
        kind: self
      - id: r.spend
        kind: internal
      - id: r.frame
        kind: internal
    steps:
      - opt:
          do:
            - return: frames, nil
          init:
            bind: frames, done
            eval: r.frames[id]
          when: done
      - bind: loc, known
        eval: r.d.locations[id]
      - opt:
          do:
            - return: nil, malformed("location id")
          when: "!known"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: r.spend(max(len(loc.lines), 1))
            to: r.spend
          when: err != nil
      - var:
          name: frames
          type: "[]coreprofiling.FrameValue"
      - opt:
          do:
            - set: frames
              value: "[]coreprofiling.FrameValue{{Address: loc.address}}"
          when: len(loc.lines) == 0
      - loop:
          do:
            - bind: frame, err
              eval: r.frame(line)
              to: r.frame
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: frames
              value: append(frames, frame)
          key: _
          range: loc.lines
          value: line
      - set: r.frames[id]
        value: frames
      - return: frames, nil
  - of: (*resolver).frame
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).frame
        kind: self
      - id: r.str
        kind: internal
    steps:
      - bind: fn, known
        eval: r.d.functions[line.function]
      - opt:
          do:
            - return: coreprofiling.FrameValue{}, malformed("function id")
          when: "!known"
      - bind: name, err
        eval: r.str(fn.name)
        to: r.str
      - opt:
          do:
            - return: coreprofiling.FrameValue{}, err
          when: err != nil
      - bind: file, err
        eval: r.str(fn.file)
        to: r.str
      - return: "coreprofiling.FrameValue{Function: name, File: file, Line: int(line.line), StartLine: int(fn.start)}, err"
  - of: (*resolver).labels
    participants:
      - id: caller
        kind: actor
      - id: (*resolver).labels
        kind: self
      - id: r.str
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil, nil
          when: len(raw) == 0
      - bind: labels, numbers
        eval: make(map[string][]string, len(raw)), make(map[string][]int64, len(raw))
      - loop:
          do:
            - bind: key, err
              eval: r.str(l.key)
              to: r.str
            - opt:
                do:
                  - return: nil, nil, err
                when: err != nil
            - opt:
                do:
                  - set: numbers[key]
                    value: append(numbers[key], l.num)
                  - continue: true
                when: l.str == 0
            - bind: value, err
              eval: r.str(l.str)
              to: r.str
            - opt:
                do:
                  - return: nil, nil, err
                when: err != nil
            - set: labels[key]
              value: append(labels[key], value)
          key: _
          range: raw
          value: l
      - return: labels, numbers, nil
  - of: (*decoder).readSample
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readSample
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: err
          when: err != nil
      - var:
          name: s
          type: rawSample
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		//: one reader per field.
          		switch field {
          		//: innermost location first.
          		case fieldSampleLocation:
          			var ferr error
          			s.locations, ferr = w.varints(s.locations, kind)
          			//: read.
          			return true, ferr
          		//: one value per sample type.
          		case fieldSampleValue:
          			values, ferr := w.varints(nil, kind)
          			//: two's complement, as every int64.
          			for _, v := range values {
          				s.values = append(s.values, int64(v))
          			}
          			//: read.
          			return true, ferr
          		//: a label.
          		case fieldSampleLabel:
          			label, ferr := readLabel(w, kind)
          			s.labels = append(s.labels, label)
          			//: read.
          			return true, ferr
          		}
          		//: anything else is skipped.
          		return false, nil
          	})
      - set: d.samples
        value: append(d.samples, s)
      - return: err
  - of: readLabel
    participants:
      - id: caller
        kind: actor
      - id: readLabel
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: rawLabel{}, err
          when: err != nil
      - var:
          name: l
          type: rawLabel
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		var target *int64
          		//: which of the three the field fills.
          		switch field {
          		//: the label's key, a string index.
          		case fieldLabelKey:
          			target = &l.key
          		//: a string value, a string index.
          		case fieldLabelStr:
          			target = &l.str
          		//: a numeric value.
          		case fieldLabelNum:
          			target = &l.num
          		//: anything else is skipped.
          		default:
          			//: not read.
          			return false, nil
          		}
          		var ferr error
          		*target, ferr = scalar(w, kind)
          		//: read.
          		return true, ferr
          	})
      - return: l, err
  - of: (*decoder).readLocation
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readLocation
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: err
          when: err != nil
      - var:
          name: id
          type: uint64
      - var:
          name: loc
          type: rawLocation
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		//: one reader per field.
          		switch field {
          		//: the id samples refer to.
          		case fieldLocationID:
          			v, ferr := scalar(w, kind)
          			id = uint64(v)
          			//: read.
          			return true, ferr
          		//: the program counter.
          		case fieldLocationAddr:
          			v, ferr := scalar(w, kind)
          			loc.address = uint64(v)
          			//: read.
          			return true, ferr
          		//: a line, innermost inlined call first.
          		case fieldLocationLine:
          			line, ferr := readLine(w, kind)
          			loc.lines = append(loc.lines, line)
          			//: read.
          			return true, ferr
          		}
          		//: anything else is skipped.
          		return false, nil
          	})
      - set: d.locations[id]
        value: loc
      - return: err
  - of: readLine
    participants:
      - id: caller
        kind: actor
      - id: readLine
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: rawLine{}, err
          when: err != nil
      - var:
          name: l
          type: rawLine
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		//: one reader per field.
          		switch field {
          		//: the function id.
          		case fieldLineFunction:
          			v, ferr := scalar(w, kind)
          			l.function = uint64(v)
          			//: read.
          			return true, ferr
          		//: the line executing.
          		case fieldLineLine:
          			var ferr error
          			l.line, ferr = scalar(w, kind)
          			//: read.
          			return true, ferr
          		}
          		//: anything else is skipped.
          		return false, nil
          	})
      - return: l, err
  - of: (*decoder).readFunction
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).readFunction
        kind: self
      - id: payload
        kind: internal
      - id: fields
        kind: internal
    steps:
      - bind: buf, err
        eval: payload(w, kind)
        to: payload
      - opt:
          do:
            - return: err
          when: err != nil
      - var:
          name: id
          type: int64
      - var:
          name: fn
          type: rawFunction
      - set: err
        to: fields
        value: |-
          fields(buf, func(w *wire, field, kind uint64) (bool, error) {
          		var target *int64
          		//: which field the value fills.
          		switch field {
          		//: the id lines refer to.
          		case fieldFunctionID:
          			target = &id
          		//: the name, a string index.
          		case fieldFunctionName:
          			target = &fn.name
          		//: the file, a string index.
          		case fieldFunctionFile:
          			target = &fn.file
          		//: the first line.
          		case fieldFunctionStart:
          			target = &fn.start
          		//: anything else is skipped.
          		default:
          			//: not read.
          			return false, nil
          		}
          		var ferr error
          		*target, ferr = scalar(w, kind)
          		//: read.
          		return true, ferr
          	})
      - set: d.functions[uint64(id)]
        value: fn
      - return: err
  - of: (*decoder).resolve
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).resolve
        kind: self
      - id: r.header
        kind: internal
      - id: r.sample
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, malformed("string table")
          when: len(d.strings) == 0 || d.strings[0] != ""
      - bind: r
        eval: "resolver{d: d, frames: make(map[uint64][]coreprofiling.FrameValue, len(d.locations)), budget: frames, limit: frames}"
      - bind: p
        eval: "&coreprofiling.ProfileValue{Time: timeOf(d.timeNanos), Duration: time.Duration(d.durationNanos), Period: d.period}"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: r.header(p)
            to: r.header
          when: err != nil
      - set: p.Samples
        value: make([]coreprofiling.SampleValue, 0, len(d.samples))
      - loop:
          do:
            - bind: s, err
              eval: r.sample(&d.samples[i], len(p.SampleTypes))
              to: r.sample
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: p.Samples
              value: append(p.Samples, s)
          key: i
          range: d.samples
      - return: p, nil
  - of: (*wire).more
    steps:
      - return: len(w.buf) > 0
  - of: (*wire).key
    participants:
      - id: caller
        kind: actor
      - id: (*wire).key
        kind: self
      - id: w.varint
        kind: internal
    steps:
      - bind: k, err
        eval: w.varint()
        to: w.varint
      - opt:
          do:
            - return: 0, 0, err
          when: err != nil
      - return: k >> fieldShift, k & wireMask, nil
  - of: (*wire).bytes
    participants:
      - id: caller
        kind: actor
      - id: (*wire).bytes
        kind: self
      - id: w.varint
        kind: internal
    steps:
      - bind: n, err
        eval: w.varint()
        to: w.varint
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, malformed("length")
          when: n > uint64(len(w.buf))
      - bind: out
        eval: w.buf[:n]
      - set: w.buf
        value: w.buf[n:]
      - return: out, nil
  - of: (*wire).skip
    participants:
      - id: caller
        kind: actor
      - id: (*wire).skip
        kind: self
      - id: w.varint
        kind: internal
      - id: w.bytes
        kind: internal
      - id: w.advance
        kind: internal
      - id: malformed
        kind: internal
    steps:
      - switch:
          cases:
            - case: wireVarint
              do:
                - bind: _, err
                  eval: w.varint()
                  to: w.varint
                - return: err
            - case: wireBytes
              do:
                - bind: _, err
                  eval: w.bytes()
                  to: w.bytes
                - return: err
            - case: wireFixed64
              do:
                - return: w.advance(fixed64Size)
                  to: w.advance
            - case: wireFixed32
              do:
                - return: w.advance(fixed32Size)
                  to: w.advance
          "on": kind
      - return: malformed("wire type")
        to: malformed
  - of: (*wire).advance
    participants:
      - id: caller
        kind: actor
      - id: (*wire).advance
        kind: self
      - id: malformed
        kind: internal
    steps:
      - opt:
          do:
            - return: malformed("fixed")
              to: malformed
          when: n > len(w.buf)
      - set: w.buf
        value: w.buf[n:]
      - return: nil
  - of: (*wire).varints
    participants:
      - id: caller
        kind: actor
      - id: (*wire).varints
        kind: self
      - id: w.varint
        kind: internal
      - id: w.bytes
        kind: internal
      - id: packed.varint
        kind: internal
    steps:
      - opt:
          do:
            - bind: v, err
              eval: w.varint()
              to: w.varint
            - return: append(dst, v), err
          when: kind == wireVarint
      - opt:
          do:
            - return: dst, malformed("repeated")
          when: kind != wireBytes
      - bind: run, err
        eval: w.bytes()
        to: w.bytes
      - opt:
          do:
            - return: dst, err
          when: err != nil
      - bind: packed
        eval: "wire{buf: run}"
      - loop:
          cond: packed.more()
          do:
            - bind: v, err
              eval: packed.varint()
              to: packed.varint
            - opt:
                do:
                  - return: dst, err
                when: err != nil
            - set: dst
              value: append(dst, v)
      - return: dst, nil
  - of: malformed
    participants:
      - id: caller
        kind: actor
      - id: malformed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coreprofiling.ProfileMalformed, errs.WrapParams{}, errs.String("reading", what))
        to: errs
