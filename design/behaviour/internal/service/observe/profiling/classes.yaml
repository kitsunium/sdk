# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: Fold's defaults, taken when a FoldConfig field is not positive.
    grouped: true
    items:
      - doc: DefaultTopFunctions is how many functions FoldedValue.Top lists.
        name: DefaultTopFunctions
        type: int
        value: "25"
      - doc: DefaultTopPerOwner is how many functions each owner's Top lists.
        name: DefaultTopPerOwner
        type: int
        value: "8"
      - doc: |-
          DefaultFlameMinShare prunes a flame frame costing less than this share
          of the total: half a percent.
        name: DefaultFlameMinShare
        type: float64
        value: "0.005"
      - doc: DefaultFlameMaxDepth is how many frames deep the flame graph goes.
        name: DefaultFlameMaxDepth
        type: int
        value: "64"
    name: DefaultTopFunctions
  - doc: |-
      dumpLineMax bounds one line of a dump the parser reads: a frame line with a
      very long generic instantiation still fits; anything longer ends the parse.
    items:
      - name: dumpLineMax
        type: int
        value: 1 << 20
    name: dumpLineMax
  - doc: |-
      debugTraceback and debugCounts are the two text forms of runtime/pprof's
      goroutine profile: every goroutine's traceback, and the stacks counted.
    grouped: true
    items:
      - name: debugTraceback
        type: int
        value: "2"
      - name: debugCounts
        type: int
        value: "1"
    name: debugTraceback
  - doc: |-
      Presence marks of a grouping label in a group key, and the room a key
      starts with — enough for a few labels, a state and a frame without growing.
    grouped: true
    items:
      - name: labelAbsent
        type: byte
        value: "0"
      - name: labelPresent
        type: byte
        value: "1"
      - name: keyRoom
        type: int
        value: "64"
    name: labelAbsent
  - doc: |-
      joinDepth is how many innermost frames identify a stack when labels are
      matched from the counted profile onto the dump.
    items:
      - name: joinDepth
        type: int
        value: "12"
    name: joinDepth
  - doc: |-
      countFunctionColumn is the index, among a counted-profile frame line's
      non-empty columns, of the function: after the "#" marker and the address.
    items:
      - name: countFunctionColumn
        type: int
        value: "2"
    name: countFunctionColumn
  - doc: |-
      Field numbers of profile.proto's messages that Parse reads. Any other field
      — mappings, drop and keep frames, the documentation URL — is skipped.
    grouped: true
    items:
      - name: fieldSampleType
        type: uint64
        value: "1"
      - name: fieldSample
        type: uint64
        value: "2"
      - name: fieldLocation
        type: uint64
        value: "4"
      - name: fieldFunction
        type: uint64
        value: "5"
      - name: fieldStringTable
        type: uint64
        value: "6"
      - name: fieldTimeNanos
        type: uint64
        value: "9"
      - name: fieldDurationNanos
        type: uint64
        value: "10"
      - name: fieldPeriodType
        type: uint64
        value: "11"
      - name: fieldPeriod
        type: uint64
        value: "12"
      - name: fieldComment
        type: uint64
        value: "13"
      - name: fieldDefaultType
        type: uint64
        value: "14"
    name: fieldSampleType
  - doc: |-
      gzipAlgorithm is the transform scheme a gzip profile is inflated through:
      the one internal/service/data/transform registers, which the facade links.
    items:
      - name: gzipAlgorithm
        type: coretransform.Algorithm
        value: "\"gzip\""
    name: gzipAlgorithm
  - doc: |-
      MaxCPUWindow is the longest window CaptureCPU samples. A longer profile is
      not more precise, only larger and longer to hold the process's one CPU
      profiler: take several.
    items:
      - name: MaxCPUWindow
        type: time.Duration
        value: 5 * time.Minute
    name: MaxCPUWindow
  - doc: |-
      MaxProfileBytes bounds what Parse reads: the input, and the input once
      decompressed. A CPU profile of the longest window CaptureCPU allows weighs a
      few megabytes; a gzip stream inflating past this is not a profile anyone
      should hold in memory.
    items:
      - name: MaxProfileBytes
        type: int
        value: 64 << 20
    name: MaxProfileBytes
  - doc: |-
      MaxFrames bounds the frames Parse builds: each location's, once, and every
      sample's stack, which copies them. The bytes a profile weighs do not bound
      them: a sample names each location by its id, and a location stands for as
      many frames as it has inlined lines, so a few megabytes naming one deep
      location again and again would expand into gigabytes of frames. Four
      million frames — some 230 MB of them — hold a profile of tens of thousands
      of distinct stacks, as deep as the runtime records them.
    items:
      - name: MaxFrames
        type: int
        value: 1 << 22
    name: MaxFrames
  - doc: Field numbers of the nested messages Parse reads.
    grouped: true
    items:
      - name: fieldSampleLocation
        type: uint64
        value: "1"
      - name: fieldSampleValue
        type: uint64
        value: "2"
      - name: fieldSampleLabel
        type: uint64
        value: "3"
      - name: fieldLabelKey
        type: uint64
        value: "1"
      - name: fieldLabelStr
        type: uint64
        value: "2"
      - name: fieldLabelNum
        type: uint64
        value: "3"
      - name: fieldLocationID
        type: uint64
        value: "1"
      - name: fieldLocationAddr
        type: uint64
        value: "3"
      - name: fieldLocationLine
        type: uint64
        value: "4"
      - name: fieldLineFunction
        type: uint64
        value: "1"
      - name: fieldLineLine
        type: uint64
        value: "2"
      - name: fieldFunctionID
        type: uint64
        value: "1"
      - name: fieldFunctionName
        type: uint64
        value: "2"
      - name: fieldFunctionFile
        type: uint64
        value: "4"
      - name: fieldFunctionStart
        type: uint64
        value: "5"
    name: fieldSampleLocation
  - doc: Wire types of the protocol-buffer encoding.
    grouped: true
    items:
      - name: wireVarint
        type: uint64
        value: "0"
      - name: wireFixed64
        type: uint64
        value: "1"
      - name: wireBytes
        type: uint64
        value: "2"
      - name: wireFixed32
        type: uint64
        value: "5"
    name: wireVarint
  - doc: |-
      Sizes the reader skips over for the fixed-width wire types, the most bytes
      one varint may take, and the largest last byte of a ten-byte varint: the
      nine before it carry 63 bits, so the tenth carries the 64th alone and may
      not ask for another byte.
    grouped: true
    items:
      - name: fixed64Size
        type: int
        value: "8"
      - name: fixed32Size
        type: int
        value: "4"
      - name: maxVarint
        type: int
        value: "10"
      - name: maxTenthByte
        type: byte
        value: "1"
    name: fixed64Size
  - doc: |-
      varintPayload and varintMore split a varint byte: seven bits of value, and
      the bit that says another byte follows.
    grouped: true
    items:
      - name: varintPayload
        type: byte
        value: "0x7f"
      - name: varintMore
        type: byte
        value: "0x80"
      - name: varintShift
        type: uint
        value: "7"
      - name: fieldShift
        type: uint
        value: "3"
      - name: wireMask
        type: uint64
        value: "7"
    name: varintPayload
