# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      ReservedPrefix is what a TOP-LEVEL attribute whose key the SDK reserves is
      rendered under, so the two never collide on one line. The whole namespace
      under it is reserved with it — see [ReservesKey].
    items:
      - name: ReservedPrefix
        type: string
        value: "\"attr.\""
    name: ReservedPrefix
  - doc: jsonEncoderName is the canonical identifier returned by jsonEncoder.Name.
    items:
      - name: jsonEncoderName
        type: string
        value: "\"json\""
    name: jsonEncoderName
  - doc: |-
      jsonGroupSeparator joins the active group stack with the attribute key so a
      grouped attr renders flat as "g1.g2.key" — matching the text encoder's
      dotted convention rather than nesting objects.
    items:
      - name: jsonGroupSeparator
        type: byte
        value: "'.'"
    name: jsonGroupSeparator
  - doc: |-
      jsonHexDigits maps a nibble to its lowercase hexadecimal rune for the
      \u00XX escape of control bytes.
    items:
      - name: jsonHexDigits
        type: string
        value: "\"0123456789abcdef\""
    name: jsonHexDigits
  - doc: jsonDecimalBase is the radix passed to strconv.Append* for JSON numbers.
    items:
      - name: jsonDecimalBase
        type: int
        value: "10"
    name: jsonDecimalBase
  - doc: |-
      jsonFloatPrec is the -1 sentinel asking strconv for the shortest
      round-trippable float64 representation.
    items:
      - name: jsonFloatPrec
        type: int
        value: "-1"
    name: jsonFloatPrec
  - doc: jsonFloatBitSize tells strconv.AppendFloat we are formatting a 64-bit float.
    items:
      - name: jsonFloatBitSize
        type: int
        value: "64"
    name: jsonFloatBitSize
  - doc: |-
      jsonFloatFormat is the byte verb ('g') selecting strconv's
      exponent-or-decimal float64 mode.
    items:
      - name: jsonFloatFormat
        type: byte
        value: "'g'"
    name: jsonFloatFormat
  - doc: |-
      jsonControlCeiling is the exclusive upper bound of the bytes the JSON grammar
      forbids unescaped inside a string literal (everything below U+0020).
    items:
      - name: jsonControlCeiling
        type: byte
        value: "0x20"
    name: jsonControlCeiling
  - doc: |-
      jsonNibbleShift is the bit-shift that isolates the high nibble of a byte for
      the \u00XX escape.
    items:
      - name: jsonNibbleShift
        type: byte
        value: "4"
    name: jsonNibbleShift
  - doc: jsonNibbleMask isolates the low nibble of a byte for the \u00XX escape.
    items:
      - name: jsonNibbleMask
        type: byte
        value: "0x0f"
    name: jsonNibbleMask
  - doc: |-
      jsonTimestampOpen opens the object's first member, "ts", up to the opening
      quote of its value.
    items:
      - name: jsonTimestampOpen
        type: string
        value: "`\"ts\":\"`"
    name: jsonTimestampOpen
  - doc: jsonLevelMember closes the "ts" value and names the "level" member.
    items:
      - name: jsonLevelMember
        type: string
        value: "`\",\"level\":`"
    name: jsonLevelMember
  - doc: jsonMessageMember separates the "level" value from the "msg" member.
    items:
      - name: jsonMessageMember
        type: string
        value: "`,\"msg\":`"
    name: jsonMessageMember
  - doc: decimalBase is the radix passed to strconv.Append* for human-readable ints.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      floatPrec is the -1 sentinel that asks strconv to emit the shortest
      round-trippable representation for a float64.
    items:
      - name: floatPrec
        type: int
        value: "-1"
    name: floatPrec
  - doc: floatBitSize tells strconv.AppendFloat we are formatting a 64-bit float.
    items:
      - name: floatBitSize
        type: int
        value: "64"
    name: floatBitSize
  - doc: |-
      floatFormat is the byte verb ('g') selecting strconv's exponent-or-decimal
      mode for float64 rendering.
    items:
      - name: floatFormat
        type: byte
        value: "'g'"
    name: floatFormat
  - doc: |-
      groupSeparator is the rune inserted between successive group names AND
      between a group prefix and an attribute key in textual output ("a.b.k=v").
    items:
      - name: groupSeparator
        type: byte
        value: "'.'"
    name: groupSeparator
  - doc: textEncoderName is the canonical identifier returned by TextEncoder.Name.
    items:
      - name: textEncoderName
        type: string
        value: "\"text\""
    name: textEncoderName
  - doc: |-
      quoteSafeFloor and quoteSafeCeiling bound the byte range strconv.AppendQuote
      copies into its output verbatim: an ASCII byte for which strconv.IsPrint
      reports true is exactly one in [0x20, 0x7E]. Outside that range AppendQuote
      either escapes the byte or decodes a multi-byte rune, so appendQuotedString
      hands the whole string back to it.
    grouped: true
    items:
      - doc: quoteSafeFloor is the lowest byte AppendQuote emits unescaped (space).
        name: quoteSafeFloor
        type: byte
        value: "0x20"
      - doc: quoteSafeCeiling is the highest such byte (tilde).
        name: quoteSafeCeiling
        type: byte
        value: "0x7e"
    name: quoteSafeFloor
  - doc: |-
      The bytes AppendSanitized's fast path tests, the UTF-8 encodings of the
      runes it scrubs, and how many bytes each scrubbed shape spans.
    grouped: true
    items:
      - doc: sanitizeFloor is the first byte that is not a C0 control (space).
        name: sanitizeFloor
        type: byte
        value: "0x20"
      - doc: sanitizeDEL is DEL, the one ASCII control above the C0 range.
        name: sanitizeDEL
        type: byte
        value: "0x7f"
      - doc: |-
          printableSpan is how many bytes printable ASCII spans from
          sanitizeFloor: 0x20-0x7E, so b-sanitizeFloor < printableSpan tests it in
          one unsigned comparison.
        name: printableSpan
        type: byte
        value: sanitizeDEL - sanitizeFloor
      - doc: |-
          utf8C1Lead leads the two-byte encodings of U+0080-U+00BF, the C1
          controls U+0080-U+009F among them.
        name: utf8C1Lead
        type: byte
        value: "0xc2"
      - doc: utf8C1Last is the last continuation byte of a C1 control (U+009F).
        name: utf8C1Last
        type: byte
        value: "0x9f"
      - doc: utf8SeparatorLead leads the three-byte encoding of U+2000-U+2FFF.
        name: utf8SeparatorLead
        type: byte
        value: "0xe2"
      - doc: utf8SeparatorMid is the second byte of U+2000-U+203F.
        name: utf8SeparatorMid
        type: byte
        value: "0x80"
      - doc: utf8LineSeparatorLast is U+2028's last byte; U+2029's is the next.
        name: utf8LineSeparatorLast
        type: byte
        value: "0xa8"
      - doc: utf8ParagraphSeparatorLast is U+2029's last byte.
        name: utf8ParagraphSeparatorLast
        type: byte
        value: "0xa9"
      - doc: continuationFloor is the first UTF-8 continuation byte.
        name: continuationFloor
        type: byte
        value: "0x80"
      - doc: asciiControlWidth is the bytes a C0 control or DEL spans.
        name: asciiControlWidth
        type: int
        value: "1"
      - doc: c1ControlWidth is the bytes a C1 control spans in UTF-8.
        name: c1ControlWidth
        type: int
        value: "2"
      - doc: separatorWidth is the bytes U+2028 or U+2029 spans in UTF-8.
        name: separatorWidth
        type: int
        value: "3"
    name: sanitizeFloor
  - grouped: true
    items:
      - doc: |-
          timestampLayout is the RFC3339-with-milliseconds format every encoded
          record timestamp carries — BOTH encoders, and every KindTime attribute.
          It lives beside appendTimestamp rather than in text.go or json.go
          because appendTimestamp is what renders it and is the only code that can
          go wrong about it; it used to be declared twice, once per encoder, with
          identical values that nothing stopped from drifting apart.
        name: timestampLayout
        type: string
        value: "\"2006-01-02T15:04:05.000Z07:00\""
      - doc: |-
          timestampMinYear and timestampMaxYear bound the years the fixed-width
          four-digit path can render. Outside them the "2006" layout verb emits
          a different WIDTH — five digits past 9999, a leading minus before year
          zero — so those instants go to the stdlib formatter instead of being
          silently truncated into a wrong but well-formed date.
        name: timestampMinYear
        type: int
        value: "0"
      - doc: timestampMaxYear is the last year the four-digit form can spell.
        name: timestampMaxYear
        type: int
        value: "9999"
      - doc: |-
          secondsPerHour and secondsPerMinute split a zone offset, which time.Zone
          reports in seconds east of UTC.
        name: secondsPerHour
        type: int
        value: "3600"
      - doc: |-
          secondsPerMinute is the divisor that drops the sub-minute part of an
          offset, exactly as the "Z07:00" verb does.
        name: secondsPerMinute
        type: int
        value: "60"
      - doc: minutesPerHour closes the offset split.
        name: minutesPerHour
        type: int
        value: "60"
      - doc: |-
          nanosPerMilli converts the nanosecond field to the milliseconds the
          ".000" verb renders.
        name: nanosPerMilli
        type: int
        value: "1_000_000"
      - doc: asciiZero is the byte the digit helpers count up from.
        name: asciiZero
        type: byte
        value: "'0'"
      - doc: |-
          decimalRadix, hundreds and thousands are the place-value divisors the
          fixed-width digit helpers use. Named rather than inline because every
          one of them is a POSITION in a format whose widths are fixed by the
          layout above — not a tunable, and not a number anyone should change
          without changing timestampLayout in the same edit.
        name: decimalRadix
        type: int
        value: "10"
      - doc: hundreds isolates the third decimal place (year centuries, millis).
        name: hundreds
        type: int
        value: "100"
      - doc: thousands isolates the fourth decimal place (year millennia).
        name: thousands
        type: int
        value: "1000"
    name: timestampLayout
