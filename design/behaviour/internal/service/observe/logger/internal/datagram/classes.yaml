constants:
  - doc: |-
      MaxBatch is how many datagrams one sendmmsg(2) carries at most; a longer
      backlog takes several calls.
    items:
      - name: MaxBatch
        type: int
        value: "64"
    name: MaxBatch
  - doc: |-
      mmsghdrAlign is the alignment C gives struct mmsghdr, which it inherits from
      struct msghdr — the widest member decides, and msghdr holds the pointers.
    items:
      - name: mmsghdrAlign
        type: uintptr
        value: unsafe.Alignof(syscall.Msghdr{})
    name: mmsghdrAlign
  - doc: |-
      mmsghdrStride is the distance the kernel advances between array elements:
      struct msghdr, then the uint32 length, rounded up to mmsghdrAlign.
    items:
      - name: mmsghdrStride
        type: uintptr
        value: |-
          (unsafe.Sizeof(syscall.Msghdr{}) +
          	unsafe.Sizeof(uint32(0)) + mmsghdrAlign - 1) / mmsghdrAlign * mmsghdrAlign
    name: mmsghdrStride
  - doc: |-
      The Go layout must equal the kernel stride, and the length must sit
      immediately after the header — asserted as constants, so a mismatch is a
      compile error on every architecture the tree is cross-built for, as
      internal/service/net/server asserts its own copy of the same layout.
    grouped: true
    items:
      - name: _
        type: uintptr
        value: unsafe.Sizeof(mmsghdr{}) - mmsghdrStride
      - name: _
        type: uintptr
        value: mmsghdrStride - unsafe.Sizeof(mmsghdr{})
      - name: _
        type: uintptr
        value: unsafe.Offsetof(mmsghdr{}.length) - unsafe.Sizeof(syscall.Msghdr{})
      - name: _
        type: uintptr
        value: unsafe.Sizeof(syscall.Msghdr{}) - unsafe.Offsetof(mmsghdr{}.length)
    name: _
  - doc: |-
      sysSendmmsg is sendmmsg(2)'s number on linux/amd64
      (arch/x86/entry/syscalls/syscall_64.tbl), which the standard library's
      syscall package does not define on this architecture.
    items:
      - name: sysSendmmsg
        type: uintptr
        value: "307"
    name: sysSendmmsg
