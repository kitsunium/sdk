constants:
  - doc: |-
      facilityUser is the default RFC5424 facility code (USER, value 1) used
      when callers do not override it. The full enum is documented in RFC5424
      §6.2.1 — we ship just USER today and let consumers configure the rest
      in a future commit.
    items:
      - name: facilityUser
        type: int
        value: "1"
    name: facilityUser
  - doc: |-
      facilityShift is the multiplier applied to the facility code per
      RFC5424 (priority = facility * 8 + severity).
    items:
      - name: facilityShift
        type: int
        value: "8"
    name: facilityShift
  - doc: severityError matches RFC5424 severity 3 (Error condition).
    items:
      - name: severityError
        type: int
        value: "3"
    name: severityError
  - doc: |-
      severityWarning matches RFC5424 severity 4 — used as the default for
      records whose level falls outside the four mapped buckets.
    items:
      - name: severityWarning
        type: int
        value: "4"
    name: severityWarning
  - doc: severityInfo matches RFC5424 severity 6 (Informational).
    items:
      - name: severityInfo
        type: int
        value: "6"
    name: severityInfo
  - doc: severityDebug matches RFC5424 severity 7 (Debug).
    items:
      - name: severityDebug
        type: int
        value: "7"
    name: severityDebug
  - doc: netUDP is the canonical udp network identifier accepted by net.Dial.
    items:
      - name: netUDP
        type: string
        value: "\"udp\""
    name: netUDP
  - doc: netTCP is the canonical tcp network identifier accepted by net.Dial.
    items:
      - name: netTCP
        type: string
        value: "\"tcp\""
    name: netTCP
  - doc: |-
      envelopeSuffix is the "1 - - - - - - " RFC5424 envelope suffix written
      after the <PRI> token. The trailing space separates header from message.
    items:
      - name: envelopeSuffix
        type: string
        value: "\"1 - - - - - - \""
    name: envelopeSuffix
  - doc: |-
      maxPRITokenLen is the worst-case length of the "<PRI>" token: the angle
      brackets plus up to three decimal digits ("<255>").
    items:
      - name: maxPRITokenLen
        type: int
        value: len("<255>")
    name: maxPRITokenLen
  - doc: |-
      frameHeaderHint is the byte budget reserved for the "<PRI>1 - - - - - - "
      header so the frame fits in a single allocation alongside the payload. It is
      len(envelopeSuffix)+maxPRITokenLen — sized to the worst case so the
      single-allocation hot path never reallocates for the header.
    items:
      - name: frameHeaderHint
        type: int
        value: len(envelopeSuffix) + maxPRITokenLen
    name: frameHeaderHint
  - doc: |-
      decimalBase is the base passed to strconv.AppendInt when rendering the
      PRI integer into the frame buffer.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
