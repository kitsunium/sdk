  name: syslog
  purpose: Package syslog — holds the Config struct consumed by NewWithConfig.
types:
  - fields:
      - doc: |-
          Dialer, when non-nil, replaces net.Dial for the connection setup.
          Callers whose operational environment exposes a hostile network
          surface (e.g. a public-facing admin endpoint that takes a user-
          controllable syslog destination) plug an allowlisted dialer here
          to prevent SSRF against internal services or cloud-metadata
          endpoints (CWE-918). Default nil preserves legacy net.Dial.
        name: Dialer
        type: func(network, addr string) (conn net.Conn, err error)
    kind: struct
    name: Config
  - doc: |-
      syslogSink wraps a net.Conn behind a mutex so concurrent producers emit
      atomic frames (UDP datagrams are inherently atomic; the mutex protects
      the TCP framing path).
    fields:
      - doc: conn is the underlying network connection.
        name: conn
        type: net.Conn
      - doc: mu serialises Write calls so concurrent producers emit atomic frames.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: Write frames p as RFC5424 and ships it over the network connection.
        name: Write
        params: ctx context.Context, rec corelogger.RecordEvent, p []byte
        recv: s *syslogSink
        results: n int, err error
      - doc: |-
          Flush is a no-op for the syslog sink (UDP datagrams settle on send;
          TCP delegates to the kernel buffer).
        name: Flush
        params: ctx context.Context
        recv: s *syslogSink
        results: error
      - doc: |-
          Close releases the underlying network connection. Subsequent Writes will
          fail with the kernel's "use of closed network connection" error wrapped
          as WriteFailed.
        name: Close
        recv: s *syslogSink
        results: error
    name: syslogSink
