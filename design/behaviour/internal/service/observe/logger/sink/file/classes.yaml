package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/observe/logger/sink/file
  name: file
  purpose: Package file implements a Sink that appends formatted records to an on-disk file.
types:
  - doc: |-
      fileSink wraps *os.File behind a mutex so concurrent goroutines emit
      atomic Write calls. Process-level atomicity for payloads under PIPE_BUF
      is provided by the kernel via O_APPEND.
    fields:
      - doc: f is the underlying *os.File opened in append mode.
        name: f
        type: "*os.File"
      - doc: |-
          mu serialises Write calls so concurrent goroutines emit atomic lines
          even when the payload exceeds PIPE_BUF. Flush does NOT hold it across
          the fsync (#815): a sync needs a stable descriptor, not the exclusion
          of writes, and the descriptor of this sink never changes.
        name: mu
        type: sync.Mutex
      - doc: batch is WriteBatch's concatenation buffer, reused under mu.
        name: batch
        type: "[]byte"
      - doc: |-
          syncFile, when set, replaces (*os.File).Sync as the fsync Flush runs: a
          white-box test substitutes one that blocks, to prove a Write is not held
          behind it. nil in production.
        name: syncFile
        type: func(f *os.File) error
    kind: struct
    methods:
      - doc: Write appends p onto the underlying file under the local mutex.
        name: Write
        params: ctx context.Context, r corelogger.RecordEvent, p []byte
        recv: s *fileSink
        results: n int, err error
      - doc: |-
          WantsAttrs answers false to corelogger.AttrsRequester: it writes the encoder's bytes to its file and reads nothing else of the record but its level, so the
          handler spares it the merged attributes (#1016).
        name: WantsAttrs
        recv: s *fileSink
        results: bool
      - doc: |-
          WriteBatch appends every payload to the file in ONE write, under the
          local mutex, and reports how many records landed whole (#807): the async
          middleware hands a backlog over in one call, and the write(2) per record
          that made a file sink cost four times a memory one is paid once per batch.
        name: WriteBatch
        params: ctx context.Context, recs []corelogger.RecordEvent, payloads [][]byte
        recv: s *fileSink
        results: written int, err error
      - doc: |-
          Flush calls fsync on the underlying file so kernel page cache contents
          reach durable storage.
        name: Flush
        params: ctx context.Context
        recv: s *fileSink
        results: error
      - doc: fsync is the descriptor's Sync, or the test's substitute.
        name: fsync
        recv: s *fileSink
        results: error
      - doc: |-
          Close closes the underlying file. Subsequent Writes will fail with the
          kernel's "file already closed" error (which we wrap as WriteFailed).
        name: Close
        recv: s *fileSink
        results: error
    name: fileSink
vars:
  - doc: |-
      openRefusals is this sink's vocabulary for the hardened open both file sinks
      share (internal/service/observe/logger/internal/logfile): one sentinel, CodeOpenFailed, for
      the policy refusal of a planted link and for every failed open — the kernel's
      refusal of a link planted after the check among them — told apart by the
      "kind" field the shared open adds.
    items:
      - name: openRefusals
        value: |-
          logfile.RefusalSpec{
          	Symlink: errs.WrapParams{
          		Code:    corefile.CodeOpenFailed,
          		Reason:  "OPEN_FAILED",
          		Public:  "File sink refuses to open a symlink",
          		Private: "service/observe/logger/sink/file.New: path is a symlink; refusing per hardening policy",
          	},
          	Open: errs.WrapParams{
          		Code:    corefile.CodeOpenFailed,
          		Reason:  "OPEN_FAILED",
          		Public:  "File sink could not open the destination file",
          		Private: "service/observe/logger/sink/file.New: os.OpenFile returned an error",
          	},
          }
    name: openRefusals
  - grouped: true
    items:
      - doc: fileSink takes a whole backlog in one write (#807).
        name: _
        type: corelogger.BatchSink
        value: (*fileSink)(nil)
      - doc: fileSink says whether it reads RecordEvent.Attrs (#1016).
        name: _
        type: corelogger.AttrsRequester
        value: (*fileSink)(nil)
    name: _
