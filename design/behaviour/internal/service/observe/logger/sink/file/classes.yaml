apiVersion: design/behaviour/v1
constants:
  - doc: |-
      defaultFilePerm is the permission bitmask passed to os.OpenFile when the
      destination file does not yet exist. 0600 restricts reads to the owning
      UID so diagnostic content (attr values, wrapped Private fields bubbled
      in by consumers that log the Source chain) is never world-readable.
      Operators that need group or other-reader access chmod explicitly.
    items:
      - name: defaultFilePerm
        type: os.FileMode
        value: "0o600"
    name: defaultFilePerm
  - doc: |-
      maxRetainedBatch is the largest concatenation buffer WriteBatch keeps for
      the next batch: a burst of large records may grow it past this once, and
      the sink then lets it go rather than hold the burst's size for its lifetime.
    items:
      - name: maxRetainedBatch
        type: int
        value: 1 << 20
    name: maxRetainedBatch
files:
  - decls: []
    name: doc.go
  - decls:
      - defaultFilePerm
      - maxRetainedBatch
      - openRefusals
      - fileSink
      - New
      - (*fileSink).Write
      - (*fileSink).WantsAttrs
      - (*fileSink).WriteBatch
      - retained
      - wholeRecords
      - (*fileSink).Flush
      - (*fileSink).fsync
      - (*fileSink).Close
    name: file.go
  - decls:
      - _
    name: file_compliance.go
functions:
  - name: New
    params: path string
    results: sink corelogger.Sink, err error
  - doc: |-
      retained is buf emptied for reuse, or nil when it grew past
      maxRetainedBatch.
    name: retained
    params: buf []byte
    results: "[]byte"
  - doc: |-
      wholeRecords counts the payloads, from the first, that lie entirely within
