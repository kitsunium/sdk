# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
files:
  - decls:
      - Config
    name: config.go
  - decls: []
    name: doc.go
  - decls:
      - panicValue
      - panicValue.Error
      - safeString
      - safeTypeName
    name: panic_value.go
  - decls:
      - recoverSink
      - New
      - NewWithConfig
      - noopOnPanic
      - (*recoverSink).Write
      - (*recoverSink).Flush
      - (*recoverSink).Close
    name: recover_sink.go
functions:
  - doc: |-
      safeString renders v via fmt.Sprintf("%v", v) with an inner defer/recover
      so a Stringer that panics during rendering does NOT propagate out of the
      recover middleware's outer recover() block. A panic inside a deferred
      function would otherwise bypass the outer recover and crash the producer.
    name: safeString
    params: v any
    results: s string
  - doc: |-
      safeTypeName renders v's dynamic Go type via fmt.Sprintf("%T", v). The
      "%T" verb reads the runtime type descriptor — never calls a user method —
      so it cannot panic. The helper exists for symmetry with safeString and
      to document intent at the Wrap call site.
    name: safeTypeName
    params: v any
    results: string
  - name: New
    params: downstream corelogger.Sink
    results: sink corelogger.Sink, err error
  - name: NewWithConfig
    params: downstream corelogger.Sink, cfg Config
    results: sink corelogger.Sink, err error
  - doc: |-
      noopOnPanic is the documented sink for the OnPanic callback when the
      caller does not supply one. Keeps the recover block's call path branch-free.
    name: noopOnPanic
    params: err error
imports:
  context: context
  corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
  corerecover: github.com/kitsunium/sdk/internal/core/observe/logger/middleware/recover
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/recover
  name: recover
  purpose: Package recover — holds the Config struct consumed by NewWithConfig.
types:
  - fields:
      - doc: |-
          OnPanic is invoked for every downstream panic the recover block
          absorbs in Write / Flush / Close. Because this middleware converts a
          panic into a typed Panicked error and a Logger that swallows handler
          errors then discards it, an absorbed runtime bug (nil-deref, slice
          OOB) is otherwise invisible — no crash, no log line, no signal. This
          hook mirrors async's OnError and gives operators a path to emit a
          metric or fall back to a secondary sink. The argument is the Panicked
          error that was returned to the caller. nil disables the callback.
          Finding V34.
        name: OnPanic
        type: func(err error)
    kind: struct
    name: Config
  - doc: |-
      panicValue adapts a recovered panic value (any) into the error interface
      so errs.Wrap can carry it without spilling the verbatim rendering into
      the Source() chain. The value's rich stringification lives in the wrapped
      error's Private field via safeString, NOT in this Error() method.
    fields:
      - doc: v is the verbatim recover() return value, retained for introspection.
        name: v
        type: any
    kind: struct
    methods:
      - doc: |-
          Error renders a type-only description of the panic. Consumers that log
          the unwrap chain (fmt.Printf("%+v", err) at the edge) therefore see only
          "panic of type <T>" — never the original panic value, which may contain
          internal state that must not leak via the Source() channel. The rich
          %v rendering is preserved in the wrapping *errs.Error's Private field.
        name: Error
        recv: p panicValue
        results: string
    name: panicValue
  - doc: recoverSink wraps a downstream sink with panic recovery on every method.
    fields:
      - doc: downstream is the wrapped sink whose panics are caught.
        name: downstream
        type: corelogger.Sink
      - doc: |-
          onPanic observes every absorbed panic; never nil — noopOnPanic is
          substituted when Config.OnPanic is unset so the recover block can fire
          it unconditionally without a nil check.
        name: onPanic
        type: func(err error)
    kind: struct
    methods:
      - doc: Write forwards p to the downstream sink under panic recovery.
        name: Write
        params: ctx context.Context, rec corelogger.RecordEvent, p []byte
        recv: s *recoverSink
        results: n int, err error
      - doc: Flush forwards to the downstream sink under panic recovery.
        name: Flush
        params: ctx context.Context
        recv: s *recoverSink
        results: err error
      - doc: Close forwards to the downstream sink under panic recovery.
        name: Close
        recv: s *recoverSink
        results: err error
    name: recoverSink
