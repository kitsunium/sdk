apiVersion: design/behaviour/v1
constants:
  - doc: |-
      defaultBufferSize is the ring capacity supplied when Config.BufferSize is
      non-positive; sized to comfortably absorb a short burst.
    items:
      - name: defaultBufferSize
        type: int
        value: "1024"
    name: defaultBufferSize
  - doc: |-
      DefaultMaxBlock is how long a Write waits under the Block policy when
      Config.MaxBlock is unset: one second. Zero does not mean "forever" (ADR 0031):
      a logger that blocks without a bound turns a dead downstream into a stalled
      service, and a caller that wants a longer wait says so, or bounds the wait by
      its context.
    items:
      - name: DefaultMaxBlock
        type: time.Duration
        value: time.Second
    name: DefaultMaxBlock
  - doc: |-
      DropNewest discards the new entry when the ring is full and surfaces
      BufferFull to the caller. The OnDrop callback fires for the dropped entry.
    items:
      - name: DropNewest
        type: DropPolicy
        value: "0"
    name: DropNewest
  - doc: |-
      DropOldest discards the oldest queued entry to make room for the new one.
      The OnDrop callback fires for the dropped entry; Write returns nil.
    items:
      - name: DropOldest
        type: DropPolicy
        value: "1"
    name: DropOldest
  - doc: |-
      Block waits for a free slot when the ring is full — the producer is slowed to
      the downstream's pace instead of losing the entry — for at most MaxBlock on
      the configured Clock. Past the bound the entry is dropped, OnDrop fires and
      Write returns BlockTimeout; a cancelled context returns CtxCancelled and Close
      returns Stopped to every waiting Write. It is Vector's `when_full: block`
      with the one difference ADR 0031 requires: the wait is never unbounded.
    items:
      - name: Block
        type: DropPolicy
        value: "2"
    name: Block
  - doc: |-
      maxSaneCap caps the per-entry backing array size the pool will retain
      after a forward() call. An attacker-influenced record (huge Message or
      attr value) otherwise leaves the entry with a massive cap(ent.data)
      which the pool keeps for the lifetime of the sink. Over many producers
      and many slots the pool can grow to hold several very large buffers
      (CWE-400 / CWE-789 — pool amplification). Dropping the slice reference
      when cap exceeds this threshold forces the pool to allocate a fresh
      small buffer on the next Get; 64 KiB comfortably covers every normal
      record while preventing unbounded retention.
    items:
      - name: maxSaneCap
        type: int
        value: 1 << 16
    name: maxSaneCap
