package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/observe/logger/middleware/async
  name: async
  purpose: Package async wraps any corelogger.Sink with a non-blocking ring buffer and a single drainer goroutine, decoupling the producer hot path from the (potentially slow) downstream sink.
types:
  - doc: |-
      asyncSink wraps a downstream sink behind a ring + drainer goroutine. The
      drainer goroutine is spawned by New and joined by Close.
    fields:
      - doc: downstream is the wrapped sink that receives drained entries.
        name: downstream
        type: corelogger.Sink
      - doc: queue is the lock-free ring buffer holding pending entries.
        name: queue
        type: ring.Queue[*recordEntry]
      - doc: pool recycles *recordEntry values to avoid per-write allocation.
        name: pool
        type: "*recycler.Pool[*recordEntry]"
      - doc: policy selects the saturation behaviour at Write time.
        name: policy
        type: DropPolicy
      - doc: maxBlock bounds a Block wait, on clk. Resolved at construction.
        name: maxBlock
        type: time.Duration
      - doc: clk drives the Block wait; never nil once New has run.
        name: clk
        type: clock.Timed
      - doc: |-
          space carries "a slot was freed" from the drainer to a Write waiting
          under Block. One buffered slot: a free slot wakes one waiter, which
          passes the token on when it leaves room behind. nil under the two drop
          policies, where nobody waits, so the drainer sends nothing.
        name: space
        type: chan struct{}
      - doc: onDrop fires for every entry discarded by the policy; never nil.
        name: onDrop
        type: func(missed int)
      - doc: |-
          onError fires for every downstream Write failure seen by the drainer;
          never nil — noopOnError is substituted when Config.OnError is unset.
          Surfaces errors that would otherwise be silently swallowed by the
          drainer.
        name: onError
        type: func(err error)
      - doc: |-
          stop signals the drainer loop to exit after Close. Closed once by
          Close under ringMu so it doubles as the TOCTOU-safe post-Close guard
          read by Write. The drainLoop selects on it.
        name: stop
        type: chan struct{}
      - doc: stopOnce guards close(stop) so concurrent Close calls never panic.
        name: stopOnce
        type: sync.Once
      - doc: |-
          done is closed by drain() when the drainer loop returns, on both paths:
          production runs drain() inside the worker.LoopDaemon, and the white-box
          tests spawn it by hand. Only the test path JOINS on it; production joins
          through the daemon's Stop, and nothing there receives from done.
        name: done
        type: chan struct{}
      - doc: |-
          doneOnce guards close(done), so the drainer's exit signal fires exactly
          once whichever path ran drain().
        name: doneOnce
        type: sync.Once
      - doc: |-
          daemon owns the production drainer goroutine — its idempotent Stop
          joins the loop, replacing the former hand-rolled <-done join with the
          generic kernel primitive (ADR 0014 §D6). nil on the white-box test
          path that spawns drain() by hand.
        name: daemon
        type: "*worker.LoopDaemon"
      - doc: |-
          flushSignal fires once after every drainer forward() so Flush can
          wait on progress instead of Gosched-spinning. Buffered by 1 so the
          drainer never blocks when nobody is flushing; Flush selects on it
          + ctx.Done for cancellation.
        name: flushSignal
        type: chan struct{}
      - doc: |-
          inFlight counts entries the drainer has TryRead off the ring but not
          yet finished delivering to downstream.Write. Incremented under ringMu
          the moment a TryRead succeeds (so Len() drops but the record is still
          undelivered) and decremented under ringMu once downstream.Write
          returns. Flush observes Len()==0 AND inFlight==0 before treating the
          queue as drained, closing the V28/V111 lost-flush window where Flush
          could report "drained" while a record was mid-delivery downstream.
        name: inFlight
        type: int
      - doc: |-
          ringMu serialises every access to queue so the SPSC ring's single-
          producer / single-consumer contract is not violated by concurrent
          goroutines. Held by:
            - Write (producer TryWrite, and TryRead + TryWrite under DropOldest)
            - Close (as a join point — blocks until every in-flight Write is
              past its TryWrite; new Writes then see isClosed under the lock)
            - drainer forward() (TryRead from the consumer side)

          Rationale over sync.WaitGroup (which races on Add/Wait), over
          sync.RWMutex (RLock allows concurrent producers — still SPSC-unsafe),
          and over leaving the ring lock-free (async has two producers and two
          consumers in practice: Write vs drainer, DropOldest TryRead from
          producer vs drainer TryRead from consumer). With a single mutex the
          ring is effectively a locked queue; the atomic operations inside are
          cheap enough that wrapping them loses little while restoring
          correctness.
        name: ringMu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          Write enqueues an encoded record for the drainer to deliver. Returns
          Stopped if Close has terminated the drainer.
        name: Write
        params: ctx context.Context, rec corelogger.RecordEvent, payload []byte
        recv: s *asyncSink
        results: n int, err error
      - doc: |-
          blockForSpace is the Block policy: it waits for the drainer to free a slot,
          at most maxBlock on clk, and stops early when ctx ends or Close begins. The
          timer is armed only here, on the saturated path — a Write that finds room
          never touches the clock.
        name: blockForSpace
        params: ctx context.Context, ent *recordEntry
        recv: s *asyncSink
        results: n int, err error
      - doc: |-
          abandon ends a Block wait without writing: the entry goes back to the pool,
          OnDrop fires when the entry was dropped for want of a slot, and the verdict
          is returned as Write's.
        name: abandon
        params: ent *recordEntry, verdict error, dropped bool
        recv: s *asyncSink
        results: n int, err error
      - doc: |-
          retryBlocked makes one TryWrite for a waiting Block entry and reports
          whether the wait is over. When the write lands and room is left, it passes
          the wake-up on, so a second waiter is not left waiting for the next read.
        name: retryBlocked
        params: ent *recordEntry
        recv: s *asyncSink
        results: n int, done bool, err error
      - doc: |-
          signalSpace tells one Block waiter that a slot may be free. Non-blocking,
          and a no-op under the drop policies, where nobody waits.
        name: signalSpace
        recv: s *asyncSink
      - doc: handleFull applies the configured DropPolicy to a saturated ring.
        name: handleFull
        params: ent *recordEntry
        recv: s *asyncSink
        results: n int, err error
      - doc: |-
          Flush blocks until the queue has drained or ctx is cancelled. Supports
          ctx == nil (legacy wait-forever semantics, observed via
          waitForDrainerProgress).
          (flushSignal closed) — Stopped is not a cancellation event and is safe
          to observe under a nil ctx.
        name: Flush
        params: ctx context.Context
        recv: s *asyncSink
        results: error
      - doc: |-
          waitForDrainerProgress blocks until the drainer signals progress on
          flushSignal OR ctx is cancelled. Returns false when flushSignal was
          reported closed (a misuse signal the caller surfaces as a typed wrap)
          so Flush cannot loop forever on a closed channel.
        name: waitForDrainerProgress
        params: ctx context.Context
        recv: s *asyncSink
        results: bool
      - doc: |-
          Close stops the drainer goroutine and closes the downstream sink. After
          Close returns, all subsequent Write calls return Stopped. Safe to call
          multiple times — the sync.Once guard makes close(stop) idempotent and the
          worker.LoopDaemon's Stop is itself idempotent.
        name: Close
        recv: s *asyncSink
        results: error
      - doc: |-
          joinDrainer blocks until the drainer loop has returned. The production sink
          joins through its worker.LoopDaemon (idempotent Stop); the white-box test
          path constructs the sink without a daemon and joins on the done channel that
          drain() closes when it exits.
        name: joinDrainer
        recv: s *asyncSink
      - doc: |-
          drain is the drainer loop body, shared by production and the white-box
          tests. Production runs it inside a worker.LoopDaemon (whose Stop owns the
          join); the tests spawn it directly via `go s.drain()` and join on done. It
          selects on the sink's own stop channel and closes done on exit so the
          test-path Close (which has no daemon) can join.
        name: drain
        recv: s *asyncSink
      - doc: |-
          drainLoop is the kernel-worker loop body: it drains ring entries into the
          downstream sink and returns promptly once stop is closed (the worker
          contract). On stop it flushes the ring via drainRemaining so nothing the
          producer accepted is lost. No done close here; the caller (drain() or the
          worker.LoopDaemon) owns the join signal.
        name: drainLoop
        params: stop <-chan struct{}
        recv: s *asyncSink
      - doc: |-
          forward delivers ent to the downstream sink and returns the entry to the
          recycler.
        name: forward
        params: ent *recordEntry
        recv: s *asyncSink
      - doc: |-
          drainRemaining flushes the ring after a stop signal so no in-flight
          entries are dropped on Close.
        name: drainRemaining
        recv: s *asyncSink
      - doc: |-
          forwardDownstreamError surfaces a downstream Write error to the OnError
          callback so operators have a hook for metrics / fallback logging; without
          the callback the async sink would silently drop sink-level failures.
        name: forwardDownstreamError
        params: bytes int, err error
        recv: s *asyncSink
    name: asyncSink
  - kind: named
    name: DropPolicy
    underlying: uint8
  - fields:
      - doc: |-
          BufferSize is the ring buffer capacity; non-positive falls back to
          defaultBufferSize (1024 slots).
        name: BufferSize
        type: int
      - doc: Policy selects DropNewest (default), DropOldest or Block behaviour on saturation.
        name: Policy
        type: DropPolicy
      - doc: |-
          MaxBlock bounds how long a Write waits for a free slot under the Block
          policy; non-positive falls back to DefaultMaxBlock (one second), never to
          an unbounded wait (ADR 0031). Ignored by the two drop policies.
        name: MaxBlock
        type: time.Duration
      - doc: |-
          Clock drives the MaxBlock wait; nil falls back to clock.System. A test
          injects a ManualClock and waits on nothing.
        name: Clock
        type: clock.Timed
      - doc: |-
          OnDrop is invoked for every entry the policy discards because the ring
          is saturated. Useful for wiring a metric counter; nil disables the
          callback. Fires for producer-side drops (ring full under Write).
        name: OnDrop
        type: func(missed int)
      - doc: |-
          OnError is invoked for every downstream Write failure seen by the
          drainer goroutine. Async cannot block the producer on a failing
          downstream, so without this hook those errors are silently lost;
          the callback gives operators a path to emit a counter or log to a
          fallback sink. nil disables the callback. Finding #24.
        name: OnError
        type: func(err error)
    kind: struct
    name: Config
  - doc: |-
      recordEntry holds a single recycled Write payload. Producers populate
      the rec + data fields, push the entry through the ring, and the drainer
      recycles the entry once the downstream sink accepts it.
    fields:
      - doc: rec carries the originating record for the downstream sink.
        name: rec
        type: corelogger.RecordEvent
      - doc: |-
          data carries the encoded bytes; the entry owns the slice for the
          duration of its trip through the ring.
        name: data
        type: "[]byte"
    kind: struct
    name: recordEntry
