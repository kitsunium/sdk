# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
sequences:
  - of: New
    participants:
      - id: caller
        kind: actor
      - id: New
        kind: self
      - id: mustNewRing
        kind: internal
      - id: callbacksOf
        kind: internal
      - id: out.wireBatch
        kind: internal
      - id: worker
        kind: package
    steps:
      - bind: size
        eval: cfg.BufferSize
      - opt:
          do:
            - set: size
              value: defaultBufferSize
          when: size <= 0
      - bind: queue
        eval: mustNewRing(size)
        to: mustNewRing
      - bind: callback, errCallback
        eval: callbacksOf(&cfg)
        to: callbacksOf
      - bind: pool
        eval: recycler.NewPool[*recordEntry](newRecordEntry)
      - bind: batchMax
        eval: max(cfg.BatchMax, 1)
      - bind: out
        eval: |-
          &asyncSink{
          		downstream:  downstream,
          		queue:       queue,
          		pool:        pool,
          		policy:      cfg.Policy,
          		maxBlock:    cfg.MaxBlock,
          		clk:         cfg.Clock,
          		onDrop:      callback,
          		onError:     errCallback,
          		flushSignal: make(chan struct{}, 1),
          		wake:        make(chan struct{}, 1),
          		batchMax:    batchMax,
          		batch:       make([]*recordEntry, 0, batchMax),
          		stop:        make(chan struct{}),
          		done:        make(chan struct{}),
          	}
      - eval: out.wireBatch()
        to: out.wireBatch
      - opt:
          do:
            - opt:
                do:
                  - set: out.maxBlock
                    value: DefaultMaxBlock
                when: out.maxBlock <= 0
            - opt:
                do:
                  - set: out.clk
                    value: clock.System
                when: out.clk == nil
            - set: out.space
              value: make(chan struct{}, 1)
          when: out.policy == Block
      - set: out.daemon
        to: worker
        value: |-
          worker.Start(func(_ <-chan struct{}) {
          		//: run the drainer; drain() closes out.done on exit (doneOnce-guarded)
          		//: and the daemon closes its own join channel — Close joins the latter.
          		out.drain()
          	})
      - return: out
  - of: callbacksOf
    steps:
      - set: onDrop, onError
        value: cfg.OnDrop, cfg.OnError
      - opt:
          do:
            - set: onDrop
              value: noopOnDrop
          when: onDrop == nil
      - opt:
          do:
            - set: onError
              value: noopOnError
          when: onError == nil
      - return: onDrop, onError
  - of: (*asyncSink).wireBatch
    steps:
      - bind: bs, ok
        eval: s.downstream.(corelogger.BatchSink)
      - opt:
          do:
            - return: ""
          when: "!ok || s.batchMax <= 1"
      - set: s.batchSink
        value: bs
      - set: s.recs
        value: make([]corelogger.RecordEvent, 0, s.batchMax)
      - set: s.payloads
        value: make([][]byte, 0, s.batchMax)
  - of: mustNewRing
    steps:
      - bind: queue, err
        eval: ring.New[*recordEntry](size)
      - opt:
          do:
            - panic: "\"internal/service/observe/logger/middleware/async: ring.New failed despite positive size: \" + err.Error()"
          when: err != nil
      - return: queue
  - of: noopOnError
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: noopOnDrop
    steps:
      - opt:
          do:
            - return: ""
          when: missed < 0
  - of: (*asyncSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).Write
        kind: self
      - id: s.ringMu.Lock
        kind: value
      - id: s.ringMu.Unlock
        kind: value
      - id: s.pool.Get
        kind: value
      - id: s.queue.TryWrite
        kind: value
      - id: s.wakeDrainer
        kind: internal
      - id: s.blockForSpace
        kind: internal
      - id: s.handleFull
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                0, errs.Wrap(ctx.Err(), errs.WrapParams{
                			Code:    coreasync.CodeAsyncCtxCancelled,
                			Reason:  "ASYNC_CTX_CANCELLED",
                			Public:  "Async sink write aborted due to cancellation",
                			Private: "service/observe/logger/middleware/async.Write saw a cancelled context",
                		}, errs.Int("level", int(rec.Level)))
          when: ctx != nil && ctx.Err() != nil
      - eval: s.ringMu.Lock()
        to: s.ringMu.Lock
      - opt:
          do:
            - eval: s.ringMu.Unlock()
              to: s.ringMu.Unlock
            - return: 0, coreasync.Stopped
          when: isClosed(s.stop)
      - bind: ent
        eval: s.pool.Get()
        to: s.pool.Get
      - set: ent.rec
        value: rec
      - set: ent.data
        value: append(ent.data[:0], payload...)
      - opt:
          do:
            - eval: s.ringMu.Unlock()
              to: s.ringMu.Unlock
            - eval: s.wakeDrainer()
              to: s.wakeDrainer
            - return: len(payload), nil
          init:
            bind: werr
            eval: s.queue.TryWrite(ent)
            to: s.queue.TryWrite
          when: werr == nil
      - opt:
          do:
            - eval: s.ringMu.Unlock()
              to: s.ringMu.Unlock
            - return: s.blockForSpace(ctx, ent)
              to: s.blockForSpace
          when: s.policy == Block
      - set: n, err
        to: s.handleFull
        value: s.handleFull(ent)
      - eval: s.ringMu.Unlock()
        to: s.ringMu.Unlock
      - eval: s.wakeDrainer()
        to: s.wakeDrainer
      - return: n, err
  - of: (*asyncSink).WantsAttrs
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).WantsAttrs
        kind: self
      - id: corelogger
        kind: package
    steps:
      - return: corelogger.SinkWantsAttrs(s.downstream)
        to: corelogger
  - of: (*asyncSink).blockForSpace
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).blockForSpace
        kind: self
      - id: s.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: doneOf
        kind: internal
      - id: s.abandon
        kind: internal
      - id: s.retryBlocked
        kind: internal
    steps:
      - bind: timer
        eval: s.clk.NewTimer(s.maxBlock)
        to: s.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - bind: cancelled
        eval: doneOf(ctx)
        to: doneOf
      - loop:
          do:
            - select:
                cases:
                  - comm: _, open := <-s.space
                    do:
                      - opt:
                          do:
                            - return: s.abandon(ent, coreasync.Stopped, false)
                              to: s.abandon
                          when: "!open"
                  - comm: <-timer.C()
                    do:
                      - return: s.abandon(ent, coreasync.BlockTimeout, true)
                        to: s.abandon
                  - comm: <-cancelled
                    do:
                      - return: s.abandon(ent, blockCancelled(ctx, ent), true)
                        to: s.abandon
                  - comm: <-s.stop
                    do:
                      - return: s.abandon(ent, coreasync.Stopped, false)
                        to: s.abandon
            - opt:
                do:
                  - return: n, err
                init:
                  bind: n, done, err
                  eval: s.retryBlocked(ent)
                  to: s.retryBlocked
                when: done
          forever: true
  - of: doneOf
    participants:
      - id: caller
        kind: actor
      - id: doneOf
        kind: self
      - id: ctx.Done
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: ctx == nil
      - return: ctx.Done()
        to: ctx.Done
  - of: (*asyncSink).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).abandon
        kind: self
      - id: s.pool.Put
        kind: value
    steps:
      - opt:
          do:
            - eval: s.onDrop(1)
          when: dropped
      - eval: s.pool.Put(ent)
        to: s.pool.Put
      - return: 0, verdict
  - of: blockCancelled
    participants:
      - id: caller
        kind: actor
      - id: blockCancelled
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(ctx.Err(), errs.WrapParams{
          		Code:    coreasync.CodeAsyncCtxCancelled,
          		Reason:  "ASYNC_CTX_CANCELLED",
          		Public:  "Async sink write aborted due to cancellation",
          		Private: "service/observe/logger/middleware/async.Write was cancelled while waiting for a free slot under the Block policy",
          	}, errs.Int("level", int(ent.rec.Level)))
        to: errs
  - of: (*asyncSink).retryBlocked
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).retryBlocked
        kind: self
      - id: s.pool.Put
        kind: value
      - id: s.signalSpace
        kind: internal
      - id: s.wakeDrainer
        kind: internal
    steps:
      - lock:
          mutex: s.ringMu
      - opt:
          do:
            - eval: s.pool.Put(ent)
              to: s.pool.Put
            - return: 0, true, coreasync.Stopped
          when: isClosed(s.stop)
      - opt:
          do:
            - return: 0, false, nil
          when: s.queue.TryWrite(ent) != nil
      - opt:
          do:
            - eval: s.signalSpace()
              to: s.signalSpace
          when: s.queue.Len() < s.queue.Capacity()
      - eval: s.wakeDrainer()
        to: s.wakeDrainer
      - return: len(ent.data), true, nil
  - of: (*asyncSink).wakeDrainer
    steps:
      - opt:
          do:
            - return: ""
          when: "!s.parked.Load()"
      - select:
          cases:
            - comm: s.wake <- struct{}{}
            - default: true
  - of: (*asyncSink).signalSpace
    steps:
      - opt:
          do:
            - return: ""
          when: s.space == nil
      - select:
          cases:
            - comm: s.space <- struct{}{}
            - default: true
  - of: (*asyncSink).handleFull
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).handleFull
        kind: self
      - id: s.queue.TryRead
        kind: value
      - id: s.pool.Put
        kind: value
      - id: swallowRingError
        kind: internal
    steps:
      - opt:
          do:
            - bind: dropped, derr
              eval: s.queue.TryRead()
              to: s.queue.TryRead
            - opt:
                do:
                  - eval: s.onDrop(1)
                  - eval: s.pool.Put(dropped)
                    to: s.pool.Put
                when: derr == nil
            - eval: swallowRingError(s.queue.TryWrite(ent))
              to: swallowRingError
            - return: len(ent.data), nil
          when: s.policy == DropOldest
      - eval: s.onDrop(1)
      - eval: s.pool.Put(ent)
        to: s.pool.Put
      - return: 0, coreasync.BufferFull
  - of: (*asyncSink).Flush
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).Flush
        kind: self
      - id: s.ringMu.Lock
        kind: value
      - id: s.queue.Len
        kind: value
      - id: s.ringMu.Unlock
        kind: value
      - id: s.downstream.Flush
        kind: value
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - eval: s.ringMu.Lock()
              to: s.ringMu.Lock
            - bind: remaining
              eval: s.queue.Len()
              to: s.queue.Len
            - bind: inFlight
              eval: s.inFlight
            - eval: s.ringMu.Unlock()
              to: s.ringMu.Unlock
            - opt:
                do:
                  - return: s.downstream.Flush(ctx)
                    to: s.downstream.Flush
                when: remaining == 0 && inFlight == 0
            - opt:
                do:
                  - return: |-
                      errs.Wrap(ctx.Err(), errs.WrapParams{
                      				Code:    coreasync.CodeAsyncCtxCancelled,
                      				Reason:  "ASYNC_CTX_CANCELLED",
                      				Public:  "Async sink flush aborted due to cancellation",
                      				Private: "service/observe/logger/middleware/async.Flush saw a cancelled context",
                      			})
                    to: errs
                when: ctx != nil && ctx.Err() != nil
            - opt:
                do:
                  - return: coreasync.Stopped
                when: "!s.waitForDrainerProgress(ctx)"
          forever: true
  - of: (*asyncSink).waitForDrainerProgress
    steps:
      - opt:
          do:
            - bind: _, sigOK
              eval: <-s.flushSignal
            - return: sigOK
          when: ctx == nil
      - select:
          cases:
            - comm: _, sigOK := <-s.flushSignal
              do:
                - return: sigOK
            - comm: <-ctx.Done()
              do:
                - return: "true"
  - of: (*asyncSink).Close
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).Close
        kind: self
      - id: s.ringMu.Lock
        kind: value
      - id: s.stopOnce.Do
        kind: value
      - id: s.ringMu.Unlock
        kind: value
      - id: s.joinDrainer
        kind: internal
      - id: s.downstream.Close
        kind: value
    steps:
      - eval: s.ringMu.Lock()
        to: s.ringMu.Lock
      - eval: |-
          s.stopOnce.Do(func() {
          		//: signal the drainer to exit; drainRemaining empties the queue first.
          		close(s.stop)
          	})
        to: s.stopOnce.Do
      - eval: s.ringMu.Unlock()
        to: s.ringMu.Unlock
      - eval: s.joinDrainer()
        to: s.joinDrainer
      - return: s.downstream.Close()
        to: s.downstream.Close
  - of: (*asyncSink).joinDrainer
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).joinDrainer
        kind: self
      - id: s.daemon.Stop
        kind: value
    steps:
      - opt:
          do:
            - eval: s.daemon.Stop()
              to: s.daemon.Stop
            - return: ""
          when: s.daemon != nil
      - eval: <-s.done
  - of: newRecordEntry
    steps:
      - return: "&recordEntry{}"
  - of: (*asyncSink).drain
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).drain
        kind: self
      - id: s.doneOnce.Do
        kind: value
      - id: s.drainLoop
        kind: internal
    steps:
      - defer: |-
          s.doneOnce.Do(func() {
          		//: signal the test-path Close that the drainer has fully exited.
          		close(s.done)
          	})
        to: s.doneOnce.Do
      - eval: s.drainLoop(s.stop)
        to: s.drainLoop
  - of: (*asyncSink).drainLoop
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).drainLoop
        kind: self
      - id: s.take
        kind: internal
      - id: s.signalSpace
        kind: internal
      - id: s.deliver
        kind: internal
      - id: s.drainRemaining
        kind: internal
    steps:
      - loop:
          do:
            - bind: batch
              eval: s.take()
              to: s.take
            - opt:
                do:
                  - eval: s.signalSpace()
                    to: s.signalSpace
                  - eval: s.deliver(batch)
                    to: s.deliver
                  - continue: true
                when: len(batch) > 0
            - opt:
                do:
                  - eval: s.drainRemaining()
                    to: s.drainRemaining
                  - return: ""
                when: "!s.park(stop)"
          forever: true
  - of: (*asyncSink).park
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).park
        kind: self
      - id: s.parked.Store
        kind: value
    steps:
      - eval: s.parked.Store(true)
        to: s.parked.Store
      - defer: s.parked.Store(false)
        to: s.parked.Store
      - opt:
          do:
            - return: "true"
          when: s.pending()
      - select:
          cases:
            - comm: <-stop
              do:
                - return: "false"
            - comm: <-s.wake
              do:
                - return: "true"
  - of: (*asyncSink).pending
    steps:
      - lock:
          mutex: s.ringMu
      - return: s.queue.Len() > 0
  - of: (*asyncSink).take
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).take
        kind: self
      - id: s.ringMu.Lock
        kind: value
      - id: s.queue.TryRead
        kind: value
      - id: s.ringMu.Unlock
        kind: value
    steps:
      - bind: batch
        eval: s.batch[:0]
      - eval: s.ringMu.Lock()
        to: s.ringMu.Lock
      - loop:
          cond: len(batch) < s.batchMax
          do:
            - bind: ent, err
              eval: s.queue.TryRead()
              to: s.queue.TryRead
            - opt:
                do:
                  - break: true
                when: err != nil
            - set: batch
              value: append(batch, ent)
      - op: +=
        set: s.inFlight
        value: len(batch)
      - eval: s.ringMu.Unlock()
        to: s.ringMu.Unlock
      - set: s.batch
        value: batch
      - return: batch
  - of: (*asyncSink).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).deliver
        kind: self
      - id: s.forward
        kind: internal
      - id: s.forwardBatch
        kind: internal
    steps:
      - opt:
          do:
            - loop:
                do:
                  - eval: s.forward(ent)
                    to: s.forward
                key: _
                range: batch
                value: ent
            - return: ""
          when: s.batchSink == nil || len(batch) == 1
      - eval: s.forwardBatch(batch)
        to: s.forwardBatch
  - of: (*asyncSink).forwardBatch
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).forwardBatch
        kind: self
      - id: s.batchSink.WriteBatch
        kind: value
      - id: s.settle
        kind: internal
      - id: s.recycle
        kind: internal
    steps:
      - bind: recs, payloads
        eval: s.recs[:0], s.payloads[:0]
      - loop:
          do:
            - set: recs
              value: append(recs, ent.rec)
            - set: payloads
              value: append(payloads, ent.data)
          key: _
          range: batch
          value: ent
      - bind: written, err
        eval: s.batchSink.WriteBatch(asyncCtx(), recs, payloads)
        to: s.batchSink.WriteBatch
      - opt:
          do:
            - loop:
                do:
                  - eval: s.onError(err)
                range: len(batch) - min(max(written, 0), len(batch))
          when: err != nil
      - eval: clear(recs)
      - eval: clear(payloads)
      - set: s.recs, s.payloads
        value: recs[:0], payloads[:0]
      - eval: s.settle(len(batch))
        to: s.settle
      - loop:
          do:
            - eval: s.recycle(ent)
              to: s.recycle
          key: _
          range: batch
          value: ent
      - eval: clear(batch)
  - of: (*asyncSink).forward
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).forward
        kind: self
      - id: s.downstream.Write
        kind: value
      - id: s.forwardDownstreamError
        kind: internal
      - id: s.settle
        kind: internal
      - id: s.recycle
        kind: internal
    steps:
      - bind: n, err
        eval: s.downstream.Write(asyncCtx(), ent.rec, ent.data)
        to: s.downstream.Write
      - eval: s.forwardDownstreamError(n, err)
        to: s.forwardDownstreamError
      - eval: s.settle(1)
        to: s.settle
      - eval: s.recycle(ent)
        to: s.recycle
  - of: (*asyncSink).settle
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).settle
        kind: self
      - id: s.ringMu.Lock
        kind: value
      - id: s.ringMu.Unlock
        kind: value
    steps:
      - eval: s.ringMu.Lock()
        to: s.ringMu.Lock
      - op: "-="
        set: s.inFlight
        value: "n"
      - eval: s.ringMu.Unlock()
        to: s.ringMu.Unlock
      - select:
          cases:
            - comm: s.flushSignal <- struct{}{}
            - default: true
  - of: (*asyncSink).recycle
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).recycle
        kind: self
      - id: s.pool.Put
        kind: value
    steps:
      - set: ent.rec
        value: corelogger.RecordEvent{}
      - alt:
          - do:
              - set: ent.data
                value: nil
            when: cap(ent.data) > maxSaneCap
          - do:
              - set: ent.data
                value: ent.data[:0]
            else: true
      - eval: s.pool.Put(ent)
        to: s.pool.Put
  - of: (*asyncSink).drainRemaining
    participants:
      - id: caller
        kind: actor
      - id: (*asyncSink).drainRemaining
        kind: self
      - id: s.take
        kind: internal
      - id: s.deliver
        kind: internal
    steps:
      - loop:
          do:
            - bind: batch
              eval: s.take()
              to: s.take
            - opt:
                do:
                  - return: ""
                when: len(batch) == 0
            - eval: s.deliver(batch)
              to: s.deliver
          forever: true
  - of: isClosed
    steps:
      - select:
          cases:
            - comm: <-ch
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - forward: context.Background
    of: asyncCtx
  - of: (*asyncSink).forwardDownstreamError
    steps:
      - opt:
          do:
            - return: ""
          when: bytes < 0 || err == nil
      - eval: s.onError(err)
  - of: swallowRingError
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
