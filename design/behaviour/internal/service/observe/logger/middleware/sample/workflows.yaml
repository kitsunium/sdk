    steps:
      - opt:
          do:
            - return: "true"
          when: len(s.keys) < s.cfg.MaxKeys
      - opt:
          do:
            - return: "false"
          when: now.Sub(s.swept) < s.cfg.Window
      - set: s.swept
        value: now
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: now.Sub(c.start) < s.cfg.Window
