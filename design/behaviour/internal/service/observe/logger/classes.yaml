# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      callerSkipDepth is the number of stack frames to skip when capturing the
      program counter from runtime.Callers: the runtime.Callers frame itself plus
      the loggerImpl.Log frame, so the captured PC points to the application
      caller rather than the logger plumbing.
    items:
      - name: callerSkipDepth
        type: int
        value: "2"
    name: callerSkipDepth
  - doc: |-
      initialAttrCap is the starting capacity reserved for an event's attribute
      slice; chosen to comfortably hold the median log call's attrs without a
      re-allocation while keeping idle pool memory bounded.
    items:
      - name: initialAttrCap
        type: int
        value: "8"
    name: initialAttrCap
  - doc: |-
      SourceFieldKey is the attribute key under which the resolved caller location
      is emitted. Encoders render it like any other string attribute, so both the
      text and JSON encoders honour it without modification.
    items:
      - name: SourceFieldKey
        type: string
        value: "\"source\""
    name: SourceFieldKey
  - doc: |-
      timestampLayout is the RFC3339-with-milliseconds format used to render the
      RecordEvent.Time field into the textual output.
    items:
      - name: timestampLayout
        type: string
        value: "\"2006-01-02T15:04:05.000Z07:00\""
    name: timestampLayout
  - doc: decimalBase is the radix passed to strconv.Append* for human-readable ints.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      floatPrec is the -1 sentinel that asks strconv to emit the shortest
      round-trippable representation for a float64.
    items:
      - name: floatPrec
        type: int
        value: "-1"
    name: floatPrec
  - doc: floatBitSize tells strconv.AppendFloat we are formatting a 64-bit float.
    items:
      - name: floatBitSize
        type: int
        value: "64"
    name: floatBitSize
  - doc: |-
      floatFormat is the byte verb ('g') selecting strconv's exponent-or-decimal
      mode for float64 rendering.
    items:
      - name: floatFormat
        type: byte
        value: "'g'"
    name: floatFormat
  - doc: |-
      groupSeparator is the rune inserted between successive group names AND
      between a group prefix and an attribute key in textual output ("a.b.k=v").
    items:
      - name: groupSeparator
        type: byte
        value: "'.'"
    name: groupSeparator
