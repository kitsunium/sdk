      - opt:
          do:
            - set: s.daemon
              to: worker
              value: worker.Every(cfg.RotateEvery, s.tickRotate)
          when: cfg.RotateEvery > 0
      - return: s, nil
  - of: (*rotatingSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*rotatingSink).Write
        kind: self
      - id: s.ensureOpen
        kind: internal
      - id: s.maybeRotate
        kind: internal
      - id: s.f.Write
        kind: value
    steps:
      - opt:
          do:
            - return: |-
                0, errs.Wrap(ctx.Err(), errs.WrapParams{
                			Code:    corerotfile.CodeRotFileWriteFailed,
                			Reason:  "ROT_FILE_WRITE_FAILED",
                			Public:  "Rotating file write failed",
                			Private: "service/observe/logger/writer/rotfile.Write saw a cancelled context",
                		}, errs.Int("level", int(r.Level)))
          when: ctx != nil && ctx.Err() != nil
      - lock:
          mutex: s.mu
      - opt:
          do:
            - bind: terr
              eval: s.tickErr
            - set: s.tickErr
              value: nil
            - opt:
                do:
                  - eval: s.cfg.OnError(terr)
                when: s.cfg.OnError != nil
          when: s.tickErr != nil
      - opt:
          do:
            - return: 0, oerr
          init:
            bind: oerr
            eval: s.ensureOpen()
            to: s.ensureOpen
          when: oerr != nil
      - opt:
          do:
            - return: 0, rerr
          init:
            bind: rerr
            eval: s.maybeRotate(int64(len(p)))
            to: s.maybeRotate
          when: rerr != nil
      - bind: written, werr
        eval: s.f.Write(p)
        to: s.f.Write
      - op: +=
        set: s.size
        value: int64(written)
      - opt:
          do:
            - return: |-
                written, errs.Wrap(werr, errs.WrapParams{
                			Code:    corerotfile.CodeRotFileWriteFailed,
                			Reason:  "ROT_FILE_WRITE_FAILED",
                			Public:  "Rotating file write failed",
                			Private: "service/observe/logger/writer/rotfile.Write underlying *os.File returned an error",
                		}, errs.Int("bytes", len(p)), errs.Int("level", int(r.Level)))
          when: werr != nil
      - return: written, nil
  - of: (*rotatingSink).Flush
    participants:
      - id: caller
        kind: actor
      - id: (*rotatingSink).Flush
        kind: self
      - id: errs
        kind: package
      - id: s.mu.Lock
        kind: value
      - id: s.syncOpen
        kind: internal
      - id: s.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(ctx.Err(), errs.WrapParams{
                			Code:    corerotfile.CodeRotFileWriteFailed,
                			Reason:  "ROT_FILE_WRITE_FAILED",
                			Public:  "Rotating file flush failed",
                			Private: "service/observe/logger/writer/rotfile.Flush saw a cancelled context",
                		})
              to: errs
          when: ctx != nil && ctx.Err() != nil
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: serr
        eval: s.syncOpen()
        to: s.syncOpen
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - return: |-
                errs.Wrap(serr, errs.WrapParams{
                			Code:    corerotfile.CodeRotFileWriteFailed,
                			Reason:  "ROT_FILE_WRITE_FAILED",
                			Public:  "Rotating file flush failed",
                			Private: "service/observe/logger/writer/rotfile.Flush underlying *os.File.Sync returned an error",
                		})
              to: errs
          when: serr != nil
      - return: nil
  - of: (*rotatingSink).Close
    participants:
      - id: caller
        kind: actor
      - id: (*rotatingSink).Close
        kind: self
      - id: s.daemon.Stop
        kind: value
      - id: s.mu.Lock
        kind: value
      - id: s.closeOpen
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - eval: s.daemon.Stop()
              to: s.daemon.Stop
          when: s.daemon != nil
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.closed
        value: "true"
      - bind: cerr
        eval: s.closeOpen()
        to: s.closeOpen
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - return: |-
                errs.Wrap(cerr, errs.WrapParams{
                			Code:    corerotfile.CodeRotFileWriteFailed,
                			Reason:  "ROT_FILE_WRITE_FAILED",
                			Public:  "Rotating file close failed",
                			Private: "service/observe/logger/writer/rotfile.Close underlying *os.File.Close returned an error",
                		})
              to: errs
          when: cerr != nil
      - return: nil
  - of: (*rotatingSink).syncOpen
    participants:
      - id: caller
        kind: actor
      - id: (*rotatingSink).syncOpen
        kind: self
      - id: s.f.Sync
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: s.f == nil
      - return: s.f.Sync()
        to: s.f.Sync
  - of: (*rotatingSink).closeOpen
    participants:
      - id: caller
        kind: actor
      - id: (*rotatingSink).closeOpen
        kind: self
      - id: s.f.Close
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: s.f == nil
      - return: s.f.Close()
        to: s.f.Close
  - of: (*rotFileFactory).Name
    steps:
      - return: "\"rotfile\""
  - of: (*rotFileFactory).Open
    participants:
      - id: caller
        kind: actor
      - id: (*rotFileFactory).Open
        kind: self
      - id: newRotatingSink
        kind: internal
      - id: levelgate
        kind: package
    steps:
      - bind: c, ok
        eval: cfg.(Config)
      - opt:
          do:
            - return: nil, writer.WriterConfigInvalid
          when: "!ok"
      - bind: base, oerr
        eval: newRotatingSink(&c)
        to: newRotatingSink
      - opt:
          do:
            - return: nil, oerr
          when: oerr != nil
      - return: levelgate.New(base, c.MinLevel), nil
        to: levelgate
  - of: wrapRotate
    participants:
      - id: caller
        kind: actor
      - id: wrapRotate
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    corerotfile.CodeRotFileRotateFailed,
          		Reason:  "ROT_FILE_ROTATE_FAILED",
          		Public:  "Rotating file sink failed to rotate the destination file",
          		Private: private,
          	})
        to: errs
