functions:
  - doc: |-
      decodeStream maps the optional "target" option onto dst. An absent key keeps
      the zero value (stderr); "stderr"/"" select stderr, "stdout" selects stdout.
      An empty string is treated as unspecified, so it lands on the same safe
      default as an absent key rather than on stdout (ADR 0030). A non-string value
      or an unrecognised name yields the redacted WriterConfigInvalid sentinel —
      the value is never echoed (secret gate).
    name: decodeStream
    params: raw map[string]any, dst *writer.ConsoleStream
    results: error
  - doc: |-
      decodeMinLevel maps the optional "min_level" option onto dst. An absent key
      inherits the handler-global floor (zero Level). A non-string value or an
      unparsable name yields the redacted WriterConfigInvalid sentinel; ParseLevel
      is redaction-safe and never echoes its input.
    name: decodeMinLevel
    params: raw map[string]any, dst *level.Level
    results: error
  - doc: |-
      configInvalid returns the shared WriterConfigInvalid sentinel tagged with the
      writer name only. It never carries a decoded option value, honouring the
      Decoder secret-gate contract; origin-wins keeps errors.Is matching the
      sentinel.
    name: configInvalid
    results: error
  - doc: pickStream maps the config stream selector onto the concrete console sink.
    name: pickStream
    params: s writer.ConsoleStream
    results: corelogger.Sink
