apiVersion: design/behaviour/v1
constants:
  - doc: |-
      writerName is the canonical registry key. socketNetwork / defaultSocketPath
      are the unix-datagram network and the systemd journal socket default.
    grouped: true
    items:
      - name: writerName
        value: "\"journald\""
      - name: socketNetwork
        value: "\"unixgram\""
      - name: defaultSocketPath
        value: "\"/run/systemd/journal/socket\""
    name: writerName
  - doc: |-
      messagePrefix is the journal field name framing each record as the entry's
      MESSAGE. The trailing '=' separates the field name from the value.
    items:
      - name: messagePrefix
        type: string
        value: "\"MESSAGE=\""
    name: messagePrefix
  - doc: |-
      unixDatagrams reports whether this platform can open the AF_UNIX datagram
      socket the default dialer connects. Off Windows the kernel answers: a host
      without journald fails the connect with JOURNALD_OPEN_FAILED, as it always
      has.
    items:
      - name: unixDatagrams
        type: bool
        value: "true"
    name: unixDatagrams
files:
  - decls:
      - (*journaldFactory).Decode
      - configInvalid
      - decodeStr
      - decodeLevelKey
      - decodeIntKey
    name: decode.go
  - decls: []
    name: doc.go
  - decls:
      - writerName
      - Writer
      - journaldFactory
      - (*journaldFactory).Name
      - (*journaldFactory).Open
    name: journald.go
  - decls:
      - Config
    name: journald_config.go
  - decls:
      - messagePrefix
