        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindCounter, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.sums.lookup(key)
            to: m.sums.lookup
          when: ok
      - return: m.sums.admit(name, kindCounter, key, sorted, newCounter)
        to: m.sums.admit
  - of: (*memMeter).UpDownCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).UpDownCounter
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.sums.lookup
        kind: internal
      - id: m.sums.admit
        kind: internal
    steps:
