        kind: actor
      - id: (*memHistogram).observe
        kind: self
      - id: validateObserved
        kind: internal
      - id: h.relayout
        kind: internal
      - id: h.count.Store
        kind: value
      - id: h.sumBits.Store
        kind: value
    steps:
      - eval: validateObserved(point)
        to: validateObserved
      - bind: state
        eval: h.observed
      - bind: restart
        eval: h.relayout(point.Bounds)
        to: h.relayout
      - set: restart
        value: restart || wentDown(point.Counts, state.previous)
      - bind: differenced
        eval: delta && !restart
      - eval: h.count.Store(h.storeWindow(point.Counts, differenced))
        to: h.count.Store
      - bind: sum
        eval: point.Sum
      - opt:
          do:
            - op: "-="
              set: sum
              value: state.previousSum
          when: differenced
      - set: state.previousSum
        value: point.Sum
      - eval: h.sumBits.Store(math.Float64bits(sum))
        to: h.sumBits.Store
      - set: state.noSum
        value: point.NoSum
      - set: state.reported
        value: "true"
