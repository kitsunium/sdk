        value: append(buf, name...)
      - set: buf
        value: append(buf, suffix...)
      - set: buf
        to: appendPromLabels
        value: appendPromLabels(buf, attrs, noBound)
      - set: buf
        value: append(buf, ' ')
      - set: buf
        value: append(buf, value...)
      - return: append(buf, '\n')
  - of: appendBucket
    participants:
      - id: caller
        kind: actor
      - id: appendBucket
        kind: self
      - id: appendPromLabels
        kind: internal
    steps:
      - set: buf
        value: append(buf, name...)
      - set: buf
        value: append(buf, bucketSuffix...)
      - set: buf
        to: appendPromLabels
        value: appendPromLabels(buf, attrs, bound)
      - set: buf
        value: append(buf, ' ')
      - set: buf
        value: append(buf, count...)
      - return: append(buf, '\n')
  - of: appendPromLabels
    participants:
      - id: caller
        kind: actor
      - id: appendPromLabels
        kind: self
      - id: appendEscapedValue
        kind: internal
      - id: attr.AppendText
        kind: value
    steps:
      - opt:
          do:
            - return: buf
          when: len(attrs) == 0 && bound == noBound
      - set: buf
        value: append(buf, '{')
      - loop:
          do:
            - opt:
                do:
                  - set: buf
                    value: append(buf, ',')
                when: i > 0
            - set: buf
              value: append(buf, attr.Key...)
            - set: buf
              value: append(buf, '=', '"')
            - alt:
                - do:
                    - set: buf
                      to: appendEscapedValue
                      value: appendEscapedValue(buf, attr.Str())
                  when: attr.Kind() == coreotel.AttrKindString
                - do:
                    - set: buf
                      to: attr.AppendText
                      value: attr.AppendText(buf)
                  else: true
            - set: buf
              value: append(buf, '"')
          key: i
          range: attrs
          value: attr
      - opt:
          do:
            - opt:
                do:
                  - set: buf
                    value: append(buf, ',')
                when: len(attrs) > 0
            - set: buf
              value: append(buf, boundLabelKey...)
            - set: buf
              value: append(buf, '=', '"')
            - set: buf
              value: append(buf, bound...)
            - set: buf
              value: append(buf, '"')
          when: bound != noBound
      - return: append(buf, '}')
  - of: promFloat
    participants:
      - id: caller
        kind: actor
      - id: promFloat
        kind: self
      - id: strconv
