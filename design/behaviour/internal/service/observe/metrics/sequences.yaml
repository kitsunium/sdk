          do:
            - set: buf
              value: append(buf, ' ')
            - set: buf
              value: append(buf, header.temporality...)
          when: header.temporality != ""
      - opt:
          do:
            - set: buf
              value: append(buf, ' ')
            - set: buf
              value: append(buf, header.monotonicity...)
          when: header.monotonicity != ""
      - opt:
          do:
            - set: buf
              value: append(buf, " description="...)
            - set: buf
              to: appendQuoted
              value: appendQuoted(buf, header.description)
          when: header.description != ""
      - return: append(buf, '\n')
  - of: appendSeriesLine
    participants:
      - id: caller
        kind: actor
      - id: appendSeriesLine
        kind: self
      - id: appendEscapedValue
        kind: internal
      - id: appendAttrs
        kind: internal
    steps:
      - set: buf
        to: appendEscapedValue
        value: appendEscapedValue(buf, name)
      - set: buf
        to: appendAttrs
        value: appendAttrs(buf, attrs)
      - set: buf
        value: append(buf, ' ')
      - set: buf
        value: append(buf, value...)
      - return: append(buf, '\n')
  - of: appendAttrs
    participants:
      - id: caller
        kind: actor
      - id: appendAttrs
        kind: self
      - id: appendAttrPair
        kind: internal
    steps:
      - opt:
          do:
            - return: buf
          when: len(attrs) == 0
      - set: buf
        value: append(buf, '{')
      - loop:
          do:
            - opt:
                do:
                  - set: buf
                    value: append(buf, ',')
                when: i > 0
            - set: buf
              to: appendAttrPair
              value: appendAttrPair(buf, attr)
          key: i
          range: attrs
          value: attr
      - return: append(buf, '}')
  - of: appendAttrPair
    participants:
      - id: caller
        kind: actor
      - id: appendAttrPair
