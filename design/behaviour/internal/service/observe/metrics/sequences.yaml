        eval: make([]uint64, len(h.counts))
      - loop:
          do:
            - opt:
                do:
                  - set: counts[i]
                    to: h.counts[i].Swap
                    value: h.counts[i].Swap(0)
                  - continue: true
                when: delta
            - set: counts[i]
              to: h.counts[i].Load
              value: h.counts[i].Load()
          key: i
          range: h.counts
      - opt:
          do:
            - return: |-
                coremetrics.HistogramValue{
                			Bounds:    slices.Clone(h.bounds),
                			Counts:    counts,
                			Sum:       math.Float64frombits(h.sumBits.Swap(0)),
                			Count:     h.count.Swap(0),
                			Exemplars: exemplars,
                		}
          when: delta
      - return: |-
          coremetrics.HistogramValue{
          		Bounds:    slices.Clone(h.bounds),
          		Counts:    counts,
          		Sum:       math.Float64frombits(h.sumBits.Load()),
          		Count:     h.count.Load(),
          		Exemplars: exemplars,
          	}
  - of: (*memHistogram).RecordDuration
    participants:
      - id: caller
        kind: actor
      - id: (*memHistogram).RecordDuration
        kind: self
      - id: h.Record
        kind: internal
    steps:
      - eval: h.Record(d.Seconds())
        to: h.Record
  - of: newObservedHistogram
    steps:
      - return: "&memHistogram{observed: &observedState{}}"
