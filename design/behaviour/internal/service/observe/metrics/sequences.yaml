                  when: attr.Kind() == coreotel.AttrKindString
                - do:
                    - set: buf
                      to: attr.AppendText
                      value: attr.AppendText(buf)
                  else: true
            - set: buf
              value: append(buf, '"')
          key: i
          range: attrs
          value: attr
      - opt:
          do:
            - opt:
                do:
                  - set: buf
                    value: append(buf, ',')
                when: len(attrs) > 0
            - set: buf
              value: append(buf, boundLabelKey...)
            - set: buf
              value: append(buf, '=', '"')
            - set: buf
              value: append(buf, bound...)
            - set: buf
              value: append(buf, '"')
          when: bound != noBound
      - return: append(buf, '}')
  - of: promFloat
    participants:
      - id: caller
        kind: actor
      - id: promFloat
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - return: strconv.FormatFloat(value, 'g', -1, floatBitSize)
        to: strconv
  - of: checkTemporality
    participants:
      - id: caller
        kind: actor
      - id: checkTemporality
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: temporality == coremetrics.TemporalityCumulative
      - return: errs.Wrap(coremetrics.UnsupportedTemporality, errs.WrapParams{}, errs.String("metric", name))
        to: errs
  - of: checkMetricName
    participants:
      - id: caller
        kind: actor
      - id: checkMetricName
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: validMetricName(name)
      - return: errs.Wrap(coremetrics.InvalidMetricName, errs.WrapParams{}, errs.String("metric", name))
        to: errs
  - of: checkAttrNames
    participants:
      - id: caller
        kind: actor
      - id: checkAttrNames
        kind: self
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.InvalidLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: "!validLabelName(attr.Key)"
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.ReservedLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: strings.HasPrefix(attr.Key, reservedLabelPrefix)
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.ReservedLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: bucketBound && attr.Key == boundLabelKey
          key: _
          range: attrs
          value: attr
      - return: nil
  - of: metricNameByte
    steps:
      - switch:
          cases:
            - case: c >= 'a' && c <= 'z', c >= 'A' && c <= 'Z', c == '_', c == ':'
              do:
                - return: "true"
            - case: c >= '0' && c <= '9'
              do:
                - return: "!first"
            - default: true
              do:
                - return: "false"
  - of: labelNameByte
    steps:
      - switch:
          cases:
            - case: c >= 'a' && c <= 'z', c >= 'A' && c <= 'Z', c == '_'
              do:
                - return: "true"
            - case: c >= '0' && c <= '9'
              do:
                - return: "!first"
            - default: true
              do:
                - return: "false"
  - of: newTextExporter
    steps:
      - return: "&textExporter{name: name, dst: dst}"
  - of: NewTextExporter
    participants:
      - id: caller
        kind: actor
      - id: NewTextExporter
        kind: self
      - id: newTextExporter
        kind: internal
    steps:
      - return: newTextExporter(name, dst)
        to: newTextExporter
  - of: (*textExporter).Name
    steps:
      - return: e.name
  - of: (*textExporter).Export
    participants:
      - id: caller
        kind: actor
      - id: (*textExporter).Export
        kind: self
      - id: appendResourceLine
        kind: internal
      - id: appendScopeLine
        kind: internal
      - id: appendWindowLine
        kind: internal
      - id: appendSums
        kind: internal
      - id: appendGauges
        kind: internal
      - id: appendHistograms
        kind: internal
      - id: e.mu.Lock
        kind: value
      - id: e.dst.Write
        kind: value
      - id: e.mu.Unlock
        kind: value
      - id: errs
        kind: package
    steps:
      - var:
          name: buf
          type: "[]byte"
      - set: buf
        to: appendResourceLine
        value: appendResourceLine(buf, snap.Resource)
      - set: buf
        to: appendScopeLine
        value: appendScopeLine(buf, snap.Scope)
      - set: buf
        to: appendWindowLine
        value: appendWindowLine(buf, snap.StartTime, snap.Time)
      - set: buf
        to: appendSums
        value: appendSums(buf, snap.Sums)
      - set: buf
        to: appendGauges
        value: appendGauges(buf, snap.Gauges)
      - set: buf
        to: appendHistograms
        value: appendHistograms(buf, snap.Histograms)
      - eval: e.mu.Lock()
        to: e.mu.Lock
      - bind: _, err
        eval: e.dst.Write(buf)
        to: e.dst.Write
      - eval: e.mu.Unlock()
        to: e.mu.Unlock
      - opt:
          do:
            - return: nil
          when: err == nil
      - return: |-
          errs.Wrap(err, errs.WrapParams{
          		Code:    coremetrics.CodeExportFailed,
          		Reason:  "EXPORT_FAILED",
          		Public:  "The metrics exporter failed to ship the snapshot",
          		Private: "service/observe/metrics: text exporter writer returned an error",
          	})
        to: errs
  - of: appendResourceLine
    participants:
      - id: caller
        kind: actor
      - id: appendResourceLine
        kind: self
      - id: appendAttrPair
        kind: internal
    steps:
      - set: buf
        value: append(buf, "# resource"...)
      - loop:
          do:
            - set: buf
              value: append(buf, ' ')
            - set: buf
              to: appendAttrPair
              value: appendAttrPair(buf, attr)
          key: _
          range: resource.Attrs
          value: attr
      - return: append(buf, '\n')
  - of: appendScopeLine
    participants:
      - id: caller
        kind: actor
      - id: appendScopeLine
        kind: self
      - id: appendQuoted
        kind: internal
    steps:
      - set: buf
        value: append(buf, "# scope name="...)
      - set: buf
        to: appendQuoted
        value: appendQuoted(buf, scope.Name)
      - opt:
          do:
            - set: buf
              value: append(buf, " version="...)
            - set: buf
              to: appendQuoted
              value: appendQuoted(buf, scope.Version)
          when: scope.Version != ""
      - return: append(buf, '\n')
  - of: appendWindowLine
    participants:
      - id: caller
        kind: actor
      - id: appendWindowLine
        kind: self
      - id: start.AppendFormat
        kind: value
      - id: end.AppendFormat
        kind: value
    steps:
      - set: buf
        value: append(buf, "# window start=\""...)
      - set: buf
        to: start.AppendFormat
        value: start.AppendFormat(buf, time.RFC3339Nano)
      - set: buf
        value: append(buf, "\" end=\""...)
      - set: buf
        to: end.AppendFormat
        value: end.AppendFormat(buf, time.RFC3339Nano)
      - return: append(buf, "\"\n"...)
  - of: appendSums
    participants:
      - id: caller
        kind: actor
      - id: appendSums
        kind: self
      - id: appendMetricHeader
        kind: internal
      - id: appendSeriesLine
        kind: internal
    steps:
      - loop:
          do:
            - bind: metric
              eval: metrics[name]
            - bind: monotonicity
              eval: textNonMonotonic
            - opt:
                do:
                  - set: monotonicity
                    value: textMonotonic
                when: metric.Monotonic
            - set: buf
              to: appendMetricHeader
              value: |-
                appendMetricHeader(buf, metricHeader{
                			name:         name,
                			kind:         textKindSum,
                			temporality:  metric.Temporality.String(),
                			monotonicity: monotonicity,
                			description:  metric.Description,
                		})
            - loop:
                do:
                  - set: buf
                    to: appendSeriesLine
                    value: |-
                      appendSeriesLine(buf, name, point.Attrs,
                      				strconv.FormatInt(point.Value, decimalBase))
                key: _
                range: metric.Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf
  - of: appendGauges
    participants:
      - id: caller
        kind: actor
      - id: appendGauges
        kind: self
      - id: appendMetricHeader
        kind: internal
      - id: appendSeriesLine
        kind: internal
    steps:
      - loop:
          do:
            - set: buf
              to: appendMetricHeader
              value: |-
                appendMetricHeader(buf, metricHeader{
                			name:        name,
                			kind:        textKindGauge,
                			description: metrics[name].Description,
                		})
            - loop:
                do:
                  - set: buf
                    to: appendSeriesLine
                    value: |-
                      appendSeriesLine(buf, name, point.Attrs,
                      				strconv.FormatFloat(point.Value, 'g', -1, floatBitSize))
                key: _
                range: metrics[name].Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf
  - of: appendHistograms
    participants:
      - id: caller
        kind: actor
      - id: appendHistograms
        kind: self
      - id: appendMetricHeader
        kind: internal
      - id: appendSeriesLine
        kind: internal
    steps:
      - loop:
          do:
            - bind: metric
              eval: metrics[name]
            - set: buf
              to: appendMetricHeader
              value: |-
                appendMetricHeader(buf, metricHeader{
                			name:        name,
                			kind:        textKindHistogram,
                			temporality: metric.Temporality.String(),
                			description: metric.Description,
                		})
            - loop:
                do:
                  - set: buf
                    to: appendSeriesLine
                    value: |-
                      appendSeriesLine(buf, name, point.Attrs,
                      				strconv.FormatUint(point.Count, decimalBase))
                key: _
                range: metric.Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf
  - of: appendMetricHeader
    participants:
      - id: caller
        kind: actor
      - id: appendMetricHeader
        kind: self
      - id: appendEscapedValue
        kind: internal
      - id: appendQuoted
        kind: internal
    steps:
      - set: buf
        value: append(buf, "# metric "...)
      - set: buf
        to: appendEscapedValue
        value: appendEscapedValue(buf, header.name)
