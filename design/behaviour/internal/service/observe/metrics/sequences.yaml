      - id: caller
        kind: actor
      - id: appendPromExponentials
        kind: self
      - id: checkTemporality
        kind: internal
      - id: checkMetricName
        kind: internal
      - id: appendHelpLine
        kind: internal
      - id: appendTypeLine
        kind: internal
      - id: checkAttrNames
        kind: internal
      - id: strconv
        kind: stdlib
      - id: appendBucket
        kind: internal
      - id: appendSample
        kind: internal
    steps:
      - loop:
          do:
            - bind: metric
              eval: metrics[name]
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: checkTemporality(name, metric.Temporality)
                  to: checkTemporality
                when: err != nil
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: checkMetricName(name)
                  to: checkMetricName
                when: err != nil
            - set: buf
              to: appendHelpLine
              value: appendHelpLine(buf, name, metric.Description)
            - set: buf
              to: appendTypeLine
              value: appendTypeLine(buf, name, promTypeHistogram)
            - loop:
                do:
                  - opt:
                      do:
                        - return: nil, err
                      init:
                        bind: err
                        eval: checkAttrNames(point.Attrs, true)
                        to: checkAttrNames
                      when: err != nil
                  - bind: count
                    eval: strconv.FormatUint(point.Count, decimalBase)
                    to: strconv
                  - set: buf
                    to: appendBucket
                    value: appendBucket(buf, name, point.Attrs, positiveInfBound, count)
                  - set: buf
                    to: appendSample
                    value: appendSample(buf, name, sumSuffix, point.Attrs, promFloat(point.Sum))
                  - set: buf
                    to: appendSample
                    value: appendSample(buf, name, countSuffix, point.Attrs, count)
                key: _
                range: metric.Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf, nil
  - of: newTextExporter
    steps:
      - return: "&textExporter{name: name, dst: dst}"
