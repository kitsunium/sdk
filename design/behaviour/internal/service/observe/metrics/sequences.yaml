        to: math
  - of: newMemGauge
    steps:
      - return: "&memGauge{}"
  - of: NewPrometheusHandler
    steps:
      - opt:
          do:
            - return: nil, coremetrics.CollectorNil
          when: collect == nil
      - bind: name
        eval: cfg.Name
      - opt:
          do:
            - set: name
              value: defaultHandlerExporter
          when: name == ""
      - bind: h
        eval: "&prometheusHandler{collect: collect, name: name, onError: cfg.OnError}"
      - set: h.docs.New
        value:
          closure:
            results: any
            steps:
              - return: new(bytes.Buffer)
      - return: h, nil
