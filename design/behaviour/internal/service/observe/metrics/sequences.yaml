      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindCounter, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.sums.lookup(key)
            to: m.sums.lookup
          when: ok
      - return: m.sums.admit(name, kindCounter, key, sorted, newCounter)
        to: m.sums.admit
  - of: (*memMeter).UpDownCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).UpDownCounter
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.sums.lookup
        kind: internal
      - id: m.sums.admit
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindUpDownCounter, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.sums.lookup(key)
            to: m.sums.lookup
          when: ok
      - return: m.sums.admit(name, kindUpDownCounter, key, sorted, newUpDownCounter)
        to: m.sums.admit
  - of: (*memMeter).Gauge
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).Gauge
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.gauges.lookup
        kind: internal
      - id: m.gauges.admit
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindGauge, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.gauges.lookup(key)
            to: m.gauges.lookup
          when: ok
      - return: m.gauges.admit(name, kindGauge, key, sorted, newMemGauge)
        to: m.gauges.admit
  - of: (*memMeter).Histogram
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).Histogram
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.histograms.lookup
        kind: internal
      - id: newHistogram
        kind: internal
      - id: m.histograms.admit
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindHistogram, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.histograms.lookup(key)
            to: m.histograms.lookup
          when: ok
      - bind: build
        eval:
          closure:
            results: "*memHistogram"
            steps:
              - return: newHistogram(buckets)
                to: newHistogram
      - return: m.histograms.admit(name, kindHistogram, key, sorted, build)
        to: m.histograms.admit
  - of: (*memMeter).Collect
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).Collect
        kind: self
      - id: m.runObservers
        kind: internal
      - id: m.clk.Now
        kind: value
      - id: m.mu.RLock
        kind: value
      - id: m.mu.RUnlock
        kind: value
    steps:
      - lock:
          mutex: m.collectMu
      - bind: delta
        eval: m.temporality == coremetrics.TemporalityDelta
      - eval: m.runObservers(delta)
        to: m.runObservers
      - bind: now
        eval: m.clk.Now()
        to: m.clk.Now
      - eval: m.mu.RLock()
        to: m.mu.RLock
      - bind: snap
        eval: |-
          coremetrics.SnapshotValue{
          		Resource:              m.resource,
          		Scope:                 m.scope,
          		StartTime:             m.startTime,
          		Time:                  now,
          		Sums:                  collectSums(m.sums.byKey, m.names, m.annotations(), m.temporality, delta),
          		Gauges:                collectGauges(m.gauges.byKey, m.names, m.annotations()),
          		Histograms:            collectHistograms(m.histograms.byKey, m.names, m.annotations(), m.temporality, delta),
          		ExponentialHistograms: collectExponentials(m.exponentials.byKey, m.names, m.annotations(), m.temporality, delta),
          	}
      - eval: m.mu.RUnlock()
        to: m.mu.RUnlock
      - opt:
          do:
            - set: m.startTime
              value: now
          when: delta
      - return: snap
  - of: collectSums
    participants:
      - id: caller
        kind: actor
      - id: collectSums
        kind: self
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.SumMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.SumMetricValue{
                			Temporality: temporality,
                			Monotonic:   slot.kind.monotonic(),
                			Description: notes.descriptions[name],
                			Unit:        notes.units[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.SumValue](len(store), names, groupSum)
          value: slot
      - loop:
          do:
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: |-
                append(metric.Points, coremetrics.SumValue{
                			Attrs:     entry.attrs,
                			Value:     entry.inst.collect(delta),
                			Exemplars: entry.inst.exemplars(delta),
                		})
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, sumAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: collectGauges
    participants:
      - id: caller
        kind: actor
      - id: collectGauges
        kind: self
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.GaugeMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.GaugeMetricValue{
                			Description: notes.descriptions[name],
                			Unit:        notes.units[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.GaugeValue](len(store), names, groupGauge)
          value: slot
      - loop:
          do:
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: |-
                append(metric.Points, coremetrics.GaugeValue{
                			Attrs: entry.attrs,
                			Value: entry.inst.load(),
                		})
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, gaugeAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: collectHistograms
    participants:
      - id: caller
        kind: actor
      - id: collectHistograms
        kind: self
      - id: entry.inst.snapshot
        kind: internal
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.HistogramMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.HistogramMetricValue{
                			Temporality: temporality,
                			Description: notes.descriptions[name],
                			Unit:        notes.units[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.HistogramValue](len(store), names, groupHistogram)
          value: slot
      - loop:
          do:
            - bind: point
              eval: entry.inst.snapshot(delta)
              to: entry.inst.snapshot
            - set: point.Attrs
              value: entry.attrs
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: append(metric.Points, point)
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, histogramAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: carve
    participants:
      - id: caller
        kind: actor
      - id: carve
        kind: self
      - id: state.seriesCap
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(string, carved[V]) bool
            steps:
              - bind: arena
                eval: make([]V, 0, storeLen)
              - bind: offset
                eval: "0"
              - loop:
                  do:
                    - opt:
                        do:
                          - continue: true
                        when: state.kind.group() != group
                    - bind: size
                      eval: state.seriesCap()
                      to: state.seriesCap
                    - var:
                        name: window
                        type: "[]V"
                    - alt:
                        - do:
                            - set: window
                              value: make([]V, 0, size)
                          when: offset+size > cap(arena)
                        - do:
                            - set: window
                              value: "arena[offset : offset : offset+size]"
                            - op: +=
                              set: offset
                              value: size
                          else: true
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(name, carved[V]{kind: state.kind, window: window})"
                  key: name
                  range: names
                  value: state
  - of: sizeGroups
    steps:
      - return: min(len(names), storeLen)
  - of: sortPoints
    participants:
      - id: caller
        kind: actor
      - id: sortPoints
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: len(points) < minSortableSeries
      - eval: |-
          slices.SortFunc(points, func(a, b V) int {
          		//: compare the identities, never the values.
          		return compareAttrs(attrsOf(a), attrsOf(b))
          	})
        to: slices
  - of: sumAttrs
    steps:
      - return: p.Attrs
  - of: gaugeAttrs
    steps:
      - return: p.Attrs
  - of: histogramAttrs
    steps:
      - return: p.Attrs
  - of: (*memMeter).Describe
    steps:
      - opt:
          do:
            - panic: coremetrics.InvalidDescription.Error()
          when: description == ""
      - lock:
          mutex: m.mu
      - bind: existing, described
        eval: m.descriptions[name]
      - opt:
          do:
            - opt:
                do:
                  - return: ""
                when: existing == description
            - panic: coremetrics.DescriptionConflict.Error()
          when: described
      - opt:
          do:
            - set: m.descriptions
              value: make(map[string]string, 1)
          when: m.descriptions == nil
      - set: m.descriptions[name]
        value: description
  - of: (*memMeter).annotations
    steps:
      - return: "annotations{descriptions: m.descriptions, units: m.units}"
  - of: (*memMeter).Unit
    steps:
      - opt:
          do:
            - panic: coremetrics.InvalidUnit.Error()
          when: "!validUnit(unit)"
      - lock:
          mutex: m.mu
      - bind: existing, bound
        eval: m.units[name]
      - opt:
          do:
            - opt:
                do:
                  - return: ""
                when: existing == unit
            - panic: coremetrics.UnitConflict.Error()
          when: bound
      - opt:
          do:
            - set: m.units
              value: make(map[string]string, 1)
          when: m.units == nil
      - set: m.units[name]
        value: unit
  - of: (*memMeter).ExponentialHistogram
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ExponentialHistogram
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.exponentials.lookup
        kind: internal
      - id: newExpHistogram
        kind: internal
      - id: m.exponentials.admit
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindExponentialHistogram, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.exponentials.lookup(key)
            to: m.exponentials.lookup
          when: ok
      - bind: build
        eval:
          closure:
            results: "*memExpHistogram"
            steps:
              - return: newExpHistogram(maxSize)
                to: newExpHistogram
      - return: m.exponentials.admit(name, kindExponentialHistogram, key, sorted, build)
        to: m.exponentials.admit
  - of: collectExponentials
    participants:
      - id: caller
        kind: actor
      - id: collectExponentials
        kind: self
      - id: entry.inst.snapshot
        kind: internal
      - id: sortPoints
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: len(store) == 0
      - bind: out
        eval: make(map[string]coremetrics.ExponentialHistogramMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.ExponentialHistogramMetricValue{
                			Temporality: temporality,
                			Description: notes.descriptions[name],
                			Unit:        notes.units[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.ExponentialHistogramValue](len(store), names, groupExponential)
          value: slot
      - loop:
          do:
            - bind: point
              eval: entry.inst.snapshot(delta)
              to: entry.inst.snapshot
            - set: point.Attrs
              value: entry.attrs
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: append(metric.Points, point)
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, exponentialAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: exponentialAttrs
    steps:
      - return: p.Attrs
  - of: (*memMeter).ObservableCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableCounter
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableCounter, int64Cb: observe})"
        to: m.register
  - of: (*memMeter).ObservableUpDownCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableUpDownCounter
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableUpDownCounter, int64Cb: observe})"
        to: m.register
  - of: (*memMeter).ObservableGauge
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableGauge
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableGauge, int64Cb: nil, floatCb: observe})"
        to: m.register
  - of: (*memMeter).register
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).register
        kind: self
      - id: m.bindName
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - eval: m.bindName(obs.name, obs.kind)
        to: m.bindName
      - opt:
          do:
            - return: ""
          when: obs.int64Cb == nil && obs.floatCb == nil && obs.histCb == nil
      - set: m.observers
        value: append(m.observers, obs)
  - of: (*memMeter).runObservers
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).runObservers
        kind: self
      - id: m.mu.RLock
        kind: value
      - id: m.mu.RUnlock
        kind: value
    steps:
      - eval: m.mu.RLock()
        to: m.mu.RLock
      - bind: regs
        eval: m.observers
      - eval: m.mu.RUnlock()
        to: m.mu.RUnlock
      - opt:
          do:
            - return: ""
          when: len(regs) == 0
      - loop:
          do:
            - opt:
                do:
                  - eval: |-
                      obs.histCb(func(point coremetrics.HistogramValue) {
                      				//: resolve or create, then take the reading.
                      				m.observeHistogram(obs.name, point, delta)
                      			})
                  - continue: true
                when: obs.kind == kindObservableHistogram
            - opt:
                do:
                  - eval: |-
                      obs.floatCb(func(value float64, attrs ...coreotel.AttrValue) {
                      				//: resolve or create, then publish the reading.
                      				m.observeGauge(obs.name, value, attrs)
                      			})
                  - continue: true
                when: obs.kind == kindObservableGauge
            - eval: |-
                obs.int64Cb(func(value int64, attrs ...coreotel.AttrValue) {
                			//: resolve or create, then convert to the meter's temporality.
                			m.observeSum(obs.name, obs.kind, value, attrs, delta)
                		})
          key: _
          range: regs
          value: obs
  - of: (*memMeter).observeSum
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).observeSum
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.sums.lookup
        kind: internal
      - id: m.sums.admit
        kind: internal
      - id: sum.observe
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kind, name, sorted)
        to: appendSeriesKey
      - bind: sum, ok
        eval: m.sums.lookup(key)
        to: m.sums.lookup
      - opt:
          do:
            - set: sum
              to: m.sums.admit
              value: m.sums.admit(name, kind, key, sorted, observableBuilder(kind))
          when: "!ok"
      - eval: sum.observe(value, delta)
        to: sum.observe
  - of: (*memMeter).observeGauge
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).observeGauge
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.gauges.lookup
        kind: internal
      - id: m.gauges.admit
        kind: internal
      - id: gauge.Set
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindObservableGauge, name, sorted)
        to: appendSeriesKey
      - bind: gauge, ok
        eval: m.gauges.lookup(key)
        to: m.gauges.lookup
      - opt:
          do:
            - set: gauge
              to: m.gauges.admit
              value: m.gauges.admit(name, kindObservableGauge, key, sorted, newMemGauge)
          when: "!ok"
      - eval: gauge.Set(value)
        to: gauge.Set
  - of: observableBuilder
    steps:
      - opt:
          do:
            - return: newObservableCounter
          when: kind == kindObservableCounter
      - return: newObservableUpDownCounter
  - of: (*memMeter).ObservableHistogram
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableHistogram
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableHistogram, histCb: observe})"
        to: m.register
  - of: (*memMeter).observeHistogram
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).observeHistogram
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.histograms.lookup
        kind: internal
      - id: m.histograms.admit
        kind: internal
      - id: hist.observe
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], point.Attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindObservableHistogram, name, sorted)
        to: appendSeriesKey
      - bind: hist, ok
        eval: m.histograms.lookup(key)
        to: m.histograms.lookup
      - opt:
          do:
            - set: hist
              to: m.histograms.admit
              value: m.histograms.admit(name, kindObservableHistogram, key, sorted, newObservedHistogram)
          when: "!ok"
      - eval: hist.observe(point, delta)
        to: hist.observe
  - of: instrumentKind.group
    steps:
      - switch:
          cases:
            - case: kindCounter, kindUpDownCounter, kindObservableCounter, kindObservableUpDownCounter
              do:
                - return: groupSum
            - case: kindGauge, kindObservableGauge
              do:
                - return: groupGauge
            - case: kindExponentialHistogram
              do:
                - return: groupExponential
            - default: true
              do:
                - return: groupHistogram
          "on": k
  - of: instrumentKind.monotonic
    steps:
      - return: k == kindCounter || k == kindObservableCounter
  - of: (*nameState).seriesCap
    steps:
      - opt:
          do:
            - return: s.series
          when: s.overflowKey == ""
      - return: s.series + 1
  - of: (*nameState).overflowSeries
    steps:
      - opt:
          do:
            - set: s.overflowKey
              value: string(appendSeriesKey(nil, s.kind, name, overflowAttrs))
          when: s.overflowKey == ""
      - return: s.overflowKey, overflowAttrs
  - of: (*memMeter).bindName
    steps:
      - bind: state, ok
        eval: m.names[name]
      - opt:
          do:
            - set: state
              value: "&nameState{kind: want}"
            - set: m.names[name]
              value: state
            - return: state
          when: "!ok"
      - opt:
          do:
            - panic: coremetrics.InstrumentKindConflict.Error()
          when: state.kind != want
      - return: state
  - of: RegisterObservers
    participants:
      - id: caller
        kind: actor
      - id: RegisterObservers
        kind: self
      - id: registerObserver
        kind: internal
    steps:
      - bind: units, _
        eval: meter.(coremetrics.UnitDescriber)
      - loop:
          do:
            - eval: registerObserver(meter, units, cfg, observer)
              to: registerObserver
          key: _
          range: observers
          value: observer
  - of: registerObserver
    participants:
      - id: caller
        kind: actor
      - id: registerObserver
        kind: self
      - id: describeStats
        kind: internal
      - id: spellStat
        kind: internal
      - id: registerStat
        kind: internal
      - id: units.Unit
        kind: value
    steps:
      - bind: reader
        eval: "&statReader{observer: observer, series: map[string]*statSeries{}}"
      - set: reader.record
        value: reader.store
      - bind: described
        eval: describeStats(observer)
        to: describeStats
      - set: reader.callbacks
        value: len(described)
      - loop:
          do:
            - bind: name
              eval: spellStat(stat.name, cfg.Underscore)
              to: spellStat
            - set: reader.series[stat.name]
              value: "&statSeries{kind: stat.kind}"
            - eval: registerStat(meter, name, stat, reader)
              to: registerStat
            - opt:
                do:
                  - eval: units.Unit(name, stat.unit)
                    to: units.Unit
                when: units != nil && stat.unit != ""
          key: _
          range: described
          value: stat
  - of: describeStats
    participants:
      - id: caller
        kind: actor
      - id: describeStats
        kind: self
      - id: observer.Observe
        kind: value
    steps:
      - var:
          name: described
          type: "[]describedStat"
      - bind: seen
        eval: map[string]bool{}
      - eval: |-
          observer.Observe(func(name string, kind coremetrics.StatKind, unit string, _ int64, _ ...coreotel.AttrValue) {
          		//: a statistic with no kind, or one already described, adds nothing.
          		if seen[name] || (kind != coremetrics.StatCounter && kind != coremetrics.StatGauge) {
          			return
          		}
          		seen[name] = true
          		described = append(described, describedStat{name: name, kind: kind, unit: unit})
          	})
        to: observer.Observe
      - return: described
  - of: spellStat
    participants:
      - id: caller
        kind: actor
      - id: spellStat
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: strings.ReplaceAll(name, ".", "_")
              to: strings
          when: underscore
      - return: name
  - of: registerStat
    participants:
      - id: caller
        kind: actor
      - id: registerStat
        kind: self
      - id: reader.emit
        kind: internal
      - id: meter.ObservableCounter
        kind: value
      - id: meter.ObservableUpDownCounter
        kind: value
    steps:
      - bind: callback
        eval:
          closure:
            params: observe coremetrics.ObserveInt64
            steps:
              - eval: reader.emit(stat.name, observe)
                to: reader.emit
      - opt:
          do:
            - eval: meter.ObservableCounter(name, callback)
              to: meter.ObservableCounter
            - return: ""
          when: stat.kind == coremetrics.StatCounter
      - eval: meter.ObservableUpDownCounter(name, callback)
        to: meter.ObservableUpDownCounter
  - of: (*statReader).emit
    participants:
      - id: caller
        kind: actor
      - id: (*statReader).emit
        kind: self
      - id: r.observer.Observe
        kind: value
    steps:
      - lock:
          mutex: r.mu
      - opt:
          do:
            - loop:
                do:
                  - set: series.points
                    value: series.points[:0]
                key: _
                range: r.series
                value: series
            - eval: r.observer.Observe(r.record)
              to: r.observer.Observe
          when: r.served == 0
      - set: r.served
        value: (r.served + 1) % r.callbacks
      - bind: series
        eval: r.series[name]
      - loop:
          do:
            - eval: observe(point.value, point.attrs...)
          key: _
          range: series.points
          value: point
