      - opt:
          do:
            - return: ""
          when: doc.Cap() > maxPooledDocument
      - eval: h.docs.Put(doc)
        to: h.docs.Put
  - of: publicText
    participants:
      - id: caller
        kind: actor
      - id: publicText
        kind: self
      - id: errs
        kind: package
      - id: http
        kind: stdlib
    steps:
      - opt:
          do:
            - return: public
          init:
            bind: public
            eval: errs.PublicOf(err)
            to: errs
          when: public != ""
      - return: http.StatusText(http.StatusInternalServerError)
        to: http
  - of: newHistogram
    participants:
      - id: caller
        kind: actor
      - id: newHistogram
