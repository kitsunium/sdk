      - id: h.count.Add
        kind: value
      - id: h.sumBits.Load
        kind: value
      - id: math
        kind: stdlib
    steps:
      - bind: idx
        eval: len(h.bounds)
      - loop:
          do:
            - opt:
                do:
                  - set: idx
                    value: i
                  - break: true
                when: value <= bound
          key: i
          range: h.bounds
          value: bound
      - eval: h.counts[idx].Add(1)
        to: h.counts[idx].Add
      - eval: h.count.Add(1)
        to: h.count.Add
      - loop:
          do:
            - bind: old
              eval: h.sumBits.Load()
              to: h.sumBits.Load
            - bind: next
              eval: math.Float64bits(math.Float64frombits(old) + value)
