    steps:
      - return: "&memGauge{}"
  - of: newHistogram
    participants:
      - id: caller
        kind: actor
      - id: newHistogram
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: sorted
        eval: slices.Clone(bounds)
        to: slices
      - eval: slices.Sort(sorted)
        to: slices
      - return: "&memHistogram{bounds: sorted, counts: make([]atomic.Uint64, len(sorted)+1)}"
  - of: (*memHistogram).Record
    participants:
      - id: caller
        kind: actor
      - id: (*memHistogram).Record
        kind: self
      - id: h.counts[idx].Add
        kind: value
      - id: h.count.Add
        kind: value
      - id: h.sumBits.Load
        kind: value
      - id: math
        kind: stdlib
    steps:
      - bind: idx
        eval: len(h.bounds)
      - loop:
          do:
            - opt:
                do:
                  - set: idx
                    value: i
                  - break: true
                when: value <= bound
          key: i
          range: h.bounds
          value: bound
      - eval: h.counts[idx].Add(1)
        to: h.counts[idx].Add
      - eval: h.count.Add(1)
        to: h.count.Add
      - loop:
          do:
            - bind: old
              eval: h.sumBits.Load()
              to: h.sumBits.Load
            - bind: next
              eval: math.Float64bits(math.Float64frombits(old) + value)
              to: math
            - opt:
                do:
                  - return: ""
                when: h.sumBits.CompareAndSwap(old, next)
          forever: true
  - of: (*memHistogram).snapshot
    participants:
      - id: caller
        kind: actor
      - id: (*memHistogram).snapshot
        kind: self
      - id: h.counts[i].Swap
        kind: value
      - id: h.counts[i].Load
        kind: value
    steps:
      - bind: counts
        eval: make([]uint64, len(h.counts))
      - loop:
          do:
            - opt:
                do:
                  - set: counts[i]
                    to: h.counts[i].Swap
                    value: h.counts[i].Swap(0)
                  - continue: true
                when: delta
            - set: counts[i]
              to: h.counts[i].Load
              value: h.counts[i].Load()
          key: i
          range: h.counts
      - opt:
          do:
            - return: |-
                coremetrics.HistogramValue{
                			Bounds: slices.Clone(h.bounds),
                			Counts: counts,
                			Sum:    math.Float64frombits(h.sumBits.Swap(0)),
                			Count:  h.count.Swap(0),
                		}
          when: delta
      - return: |-
          coremetrics.HistogramValue{
          		Bounds: slices.Clone(h.bounds),
          		Counts: counts,
          		Sum:    math.Float64frombits(h.sumBits.Load()),
          		Count:  h.count.Load(),
          	}
