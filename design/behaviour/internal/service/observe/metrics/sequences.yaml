            - bind: promType
              eval: promTypeGauge
            - opt:
                do:
                  - set: promType
                    value: promTypeCounter
                when: metric.Monotonic
            - set: buf
              to: appendHelpLine
              value: appendHelpLine(buf, name, metric.Description)
            - set: buf
              to: appendTypeLine
              value: appendTypeLine(buf, name, promType)
            - loop:
                do:
                  - opt:
                      do:
                        - return: nil, err
                      init:
                        bind: err
                        eval: checkAttrNames(point.Attrs, false)
                        to: checkAttrNames
                      when: err != nil
                  - set: buf
                    to: appendSample
                    value: |-
                      appendSample(buf, name, "", point.Attrs,
                      				strconv.FormatInt(point.Value, decimalBase))
                key: _
                range: metric.Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf, nil
  - of: appendPromGauges
    participants:
      - id: caller
        kind: actor
      - id: appendPromGauges
        kind: self
      - id: checkMetricName
        kind: internal
      - id: appendHelpLine
        kind: internal
      - id: appendTypeLine
        kind: internal
      - id: checkAttrNames
        kind: internal
      - id: appendSample
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: checkMetricName(name)
                  to: checkMetricName
                when: err != nil
            - set: buf
              to: appendHelpLine
              value: appendHelpLine(buf, name, metrics[name].Description)
            - set: buf
              to: appendTypeLine
              value: appendTypeLine(buf, name, promTypeGauge)
            - loop:
                do:
                  - opt:
                      do:
                        - return: nil, err
                      init:
                        bind: err
                        eval: checkAttrNames(point.Attrs, false)
                        to: checkAttrNames
                      when: err != nil
                  - set: buf
                    to: appendSample
                    value: appendSample(buf, name, "", point.Attrs, promFloat(point.Value))
                key: _
                range: metrics[name].Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf, nil
  - of: appendPromHistograms
    participants:
      - id: caller
        kind: actor
      - id: appendPromHistograms
        kind: self
      - id: checkTemporality
        kind: internal
      - id: checkMetricName
        kind: internal
      - id: appendHelpLine
        kind: internal
      - id: appendTypeLine
        kind: internal
      - id: checkAttrNames
        kind: internal
      - id: appendHistogramSeries
        kind: internal
    steps:
      - loop:
          do:
            - bind: metric
              eval: metrics[name]
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: checkTemporality(name, metric.Temporality)
                  to: checkTemporality
                when: err != nil
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: checkMetricName(name)
                  to: checkMetricName
                when: err != nil
            - set: buf
              to: appendHelpLine
              value: appendHelpLine(buf, name, metric.Description)
            - set: buf
              to: appendTypeLine
              value: appendTypeLine(buf, name, promTypeHistogram)
            - loop:
                do:
                  - opt:
                      do:
                        - return: nil, err
                      init:
                        bind: err
                        eval: checkAttrNames(point.Attrs, true)
                        to: checkAttrNames
                      when: err != nil
                  - set: buf
                    to: appendHistogramSeries
                    value: appendHistogramSeries(buf, name, point)
                key: _
                range: metric.Points
                value: point
          key: _
          range: sortedKeys(metrics)
          value: name
      - return: buf, nil
  - of: appendHistogramSeries
    participants:
      - id: caller
        kind: actor
      - id: appendHistogramSeries
        kind: self
      - id: appendBucket
        kind: internal
      - id: appendSample
        kind: internal
    steps:
      - var:
          name: cumulative
          type: uint64
      - loop:
          do:
            - opt:
                do:
                  - op: +=
                    set: cumulative
                    value: point.Counts[i]
                when: i < len(point.Counts)
            - opt:
                do:
                  - continue: true
                when: math.IsInf(bound, 0) || math.IsNaN(bound)
            - set: buf
              to: appendBucket
              value: |-
                appendBucket(buf, name, point.Attrs, promFloat(bound),
                			strconv.FormatUint(cumulative, decimalBase))
          key: i
          range: point.Bounds
          value: bound
      - loop:
          cond: i < len(point.Counts)
          do:
            - op: +=
              set: cumulative
              value: point.Counts[i]
          init: i := len(point.Bounds)
          post: i++
      - set: buf
        to: appendBucket
        value: |-
          appendBucket(buf, name, point.Attrs, positiveInfBound,
          		strconv.FormatUint(cumulative, decimalBase))
      - opt:
          do:
            - set: buf
              to: appendSample
              value: appendSample(buf, name, sumSuffix, point.Attrs, promFloat(point.Sum))
          when: "!point.NoSum"
      - return: |-
          appendSample(buf, name, countSuffix, point.Attrs,
          		strconv.FormatUint(point.Count, decimalBase))
        to: appendSample
  - of: appendHelpLine
    participants:
      - id: caller
        kind: actor
      - id: appendHelpLine
        kind: self
      - id: appendEscapedHelp
        kind: internal
