    participants:
      - id: caller
        kind: actor
      - id: (*prometheusHandler).ServeHTTP
        kind: self
      - id: h.serveGet
        kind: internal
      - id: w.Header().Set
        kind: value
      - id: w.WriteHeader
        kind: value
      - id: http
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: http.MethodGet
              do:
                - eval: h.serveGet(w)
                  to: h.serveGet
            - case: http.MethodHead
              do:
                - eval: w.Header().Set("Content-Type", PrometheusContentType)
                  to: w.Header().Set
                - eval: w.WriteHeader(http.StatusOK)
                  to: w.WriteHeader
            - default: true
              do:
                - eval: w.Header().Set("Allow", allowedMethods)
                  to: w.Header().Set
                - eval: http.Error(w, http.StatusText(http.StatusMethodNotAllowed), http.StatusMethodNotAllowed)
                  to: http
          "on": r.Method
  - of: (*prometheusHandler).serveGet
    participants:
      - id: caller
        kind: actor
      - id: (*prometheusHandler).serveGet
        kind: self
      - id: w.Header().Set
        kind: value
      - id: http
        kind: stdlib
      - id: h.scrape.Unlock
        kind: value
      - id: doc.Reset
        kind: value
      - id: h.recycle
        kind: internal
      - id: NewPrometheusExporter(h.name, doc).Export
        kind: value
      - id: w.WriteHeader
        kind: value
      - id: h.write
        kind: internal
    steps:
      - opt:
          do:
            - eval: w.Header().Set("Retry-After", busyRetryAfter)
              to: w.Header().Set
            - eval: http.Error(w, http.StatusText(http.StatusServiceUnavailable), http.StatusServiceUnavailable)
              to: http
            - return: ""
          when: "!h.scrape.TryLock()"
      - defer: h.scrape.Unlock()
        to: h.scrape.Unlock
      - bind: doc, _
        eval: h.docs.Get().(*bytes.Buffer)
      - eval: doc.Reset()
        to: doc.Reset
      - defer: h.recycle(doc)
        to: h.recycle
      - opt:
          do:
            - eval: w.Header().Set("Content-Type", errorContentType)
              to: w.Header().Set
            - eval: w.WriteHeader(http.StatusInternalServerError)
              to: w.WriteHeader
            - eval: h.write(w, []byte(publicText(eerr)))
              to: h.write
            - return: ""
          init:
            bind: eerr
            eval: NewPrometheusExporter(h.name, doc).Export(h.collect())
            to: NewPrometheusExporter(h.name, doc).Export
          when: eerr != nil
      - eval: w.Header().Set("Content-Type", PrometheusContentType)
        to: w.Header().Set
      - eval: w.Header().Set("Content-Length", strconv.Itoa(doc.Len()))
        to: w.Header().Set
      - eval: w.WriteHeader(http.StatusOK)
        to: w.WriteHeader
      - eval: h.write(w, doc.Bytes())
        to: h.write
