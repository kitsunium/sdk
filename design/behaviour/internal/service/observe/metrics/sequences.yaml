    participants:
      - id: caller
        kind: actor
      - id: (*memGauge).Set
        kind: self
      - id: g.bits.Store
        kind: value
    steps:
      - eval: g.bits.Store(math.Float64bits(value))
        to: g.bits.Store
  - of: (*memGauge).Add
    participants:
      - id: caller
        kind: actor
      - id: (*memGauge).Add
        kind: self
      - id: g.bits.Load
        kind: value
      - id: math
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: old
              eval: g.bits.Load()
              to: g.bits.Load
            - bind: next
              eval: math.Float64bits(math.Float64frombits(old) + delta)
              to: math
            - opt:
                do:
                  - return: ""
                when: g.bits.CompareAndSwap(old, next)
          forever: true
  - of: (*memGauge).load
    participants:
      - id: caller
        kind: actor
      - id: (*memGauge).load
        kind: self
      - id: math
        kind: stdlib
    steps:
      - return: math.Float64frombits(g.bits.Load())
        to: math
