            - set: point.Counts[i]
              to: h.counts[i].Load
              value: h.counts[i].Load()
          key: i
          range: h.counts
      - set: point.Count
        to: h.count.Load
        value: h.count.Load()
      - opt:
          do:
            - set: point.Sum
