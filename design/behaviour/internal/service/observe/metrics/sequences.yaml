        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindHistogram, name, sorted)
        to: appendSeriesKey
      - opt:
          do:
            - return: inst
          init:
            bind: inst, ok
            eval: m.histograms.lookup(key)
            to: m.histograms.lookup
          when: ok
      - bind: build
        eval:
          closure:
            results: "*memHistogram"
            steps:
              - return: newHistogram(buckets)
                to: newHistogram
      - return: m.histograms.admit(name, kindHistogram, key, sorted, build)
        to: m.histograms.admit
  - of: (*memMeter).Collect
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).Collect
        kind: self
      - id: m.runObservers
        kind: internal
      - id: m.clk.Now
        kind: value
      - id: m.mu.RLock
        kind: value
      - id: m.mu.RUnlock
        kind: value
    steps:
      - lock:
          mutex: m.collectMu
      - bind: delta
        eval: m.temporality == coremetrics.TemporalityDelta
      - eval: m.runObservers(delta)
        to: m.runObservers
      - bind: now
        eval: m.clk.Now()
        to: m.clk.Now
      - eval: m.mu.RLock()
        to: m.mu.RLock
      - bind: snap
        eval: |-
          coremetrics.SnapshotValue{
          		Resource:   m.resource,
          		Scope:      m.scope,
          		StartTime:  m.startTime,
          		Time:       now,
          		Sums:       collectSums(m.sums.byKey, m.names, m.descriptions, m.temporality, delta),
          		Gauges:     collectGauges(m.gauges.byKey, m.names, m.descriptions),
          		Histograms: collectHistograms(m.histograms.byKey, m.names, m.descriptions, m.temporality, delta),
          	}
      - eval: m.mu.RUnlock()
        to: m.mu.RUnlock
      - opt:
          do:
            - set: m.startTime
              value: now
          when: delta
      - return: snap
  - of: collectSums
    participants:
      - id: caller
        kind: actor
      - id: collectSums
        kind: self
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.SumMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.SumMetricValue{
                			Temporality: temporality,
                			Monotonic:   slot.kind.monotonic(),
                			Description: descriptions[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.SumValue](len(store), names, groupSum)
          value: slot
      - loop:
          do:
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: |-
                append(metric.Points, coremetrics.SumValue{
                			Attrs: entry.attrs,
                			Value: entry.inst.collect(delta),
                		})
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, sumAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: collectGauges
    participants:
      - id: caller
        kind: actor
      - id: collectGauges
        kind: self
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.GaugeMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.GaugeMetricValue{
                			Description: descriptions[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.GaugeValue](len(store), names, groupGauge)
          value: slot
      - loop:
          do:
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: |-
                append(metric.Points, coremetrics.GaugeValue{
                			Attrs: entry.attrs,
                			Value: entry.inst.load(),
                		})
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, gaugeAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: collectHistograms
    participants:
      - id: caller
        kind: actor
      - id: collectHistograms
        kind: self
      - id: entry.inst.snapshot
        kind: internal
      - id: sortPoints
        kind: internal
    steps:
      - bind: out
        eval: make(map[string]coremetrics.HistogramMetricValue, sizeGroups(names, len(store)))
      - loop:
          do:
            - set: out[name]
              value: |-
                coremetrics.HistogramMetricValue{
                			Temporality: temporality,
                			Description: descriptions[name],
                			Points:      slot.window,
                		}
          key: name
          range: carve[coremetrics.HistogramValue](len(store), names, groupHistogram)
          value: slot
      - loop:
          do:
            - bind: point
              eval: entry.inst.snapshot(delta)
              to: entry.inst.snapshot
            - set: point.Attrs
              value: entry.attrs
            - bind: metric
              eval: out[entry.name]
            - set: metric.Points
              value: append(metric.Points, point)
            - set: out[entry.name]
              value: metric
          key: _
          range: store
          value: entry
      - loop:
          do:
            - eval: sortPoints(metric.Points, histogramAttrs)
              to: sortPoints
          key: _
          range: out
          value: metric
      - return: out
  - of: carve
    participants:
      - id: caller
        kind: actor
      - id: carve
        kind: self
      - id: state.seriesCap
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(string, carved[V]) bool
            steps:
              - bind: arena
                eval: make([]V, 0, storeLen)
              - bind: offset
                eval: "0"
              - loop:
                  do:
                    - opt:
                        do:
                          - continue: true
                        when: state.kind.group() != group
                    - bind: size
                      eval: state.seriesCap()
                      to: state.seriesCap
                    - var:
                        name: window
                        type: "[]V"
                    - alt:
                        - do:
                            - set: window
                              value: make([]V, 0, size)
                          when: offset+size > cap(arena)
                        - do:
                            - set: window
                              value: "arena[offset : offset : offset+size]"
                            - op: +=
                              set: offset
                              value: size
                          else: true
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(name, carved[V]{kind: state.kind, window: window})"
                  key: name
                  range: names
                  value: state
  - of: sizeGroups
    steps:
      - return: min(len(names), storeLen)
  - of: sortPoints
    participants:
      - id: caller
        kind: actor
      - id: sortPoints
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: len(points) < minSortableSeries
      - eval: |-
          slices.SortFunc(points, func(a, b V) int {
          		//: compare the identities, never the values.
          		return compareAttrs(attrsOf(a), attrsOf(b))
          	})
        to: slices
  - of: sumAttrs
    steps:
      - return: p.Attrs
  - of: gaugeAttrs
    steps:
      - return: p.Attrs
  - of: histogramAttrs
    steps:
      - return: p.Attrs
  - of: (*memMeter).Describe
    steps:
      - opt:
          do:
            - panic: coremetrics.InvalidDescription.Error()
          when: description == ""
      - lock:
          mutex: m.mu
      - bind: existing, described
        eval: m.descriptions[name]
      - opt:
          do:
            - opt:
                do:
                  - return: ""
                when: existing == description
            - panic: coremetrics.DescriptionConflict.Error()
          when: described
      - opt:
          do:
            - set: m.descriptions
              value: make(map[string]string, 1)
          when: m.descriptions == nil
      - set: m.descriptions[name]
        value: description
  - of: (*memMeter).ObservableCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableCounter
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableCounter, int64Cb: observe})"
        to: m.register
  - of: (*memMeter).ObservableUpDownCounter
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableUpDownCounter
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableUpDownCounter, int64Cb: observe})"
        to: m.register
  - of: (*memMeter).ObservableGauge
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).ObservableGauge
        kind: self
      - id: m.register
        kind: internal
    steps:
      - eval: "m.register(observer{name: name, kind: kindObservableGauge, int64Cb: nil, floatCb: observe})"
        to: m.register
  - of: (*memMeter).register
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).register
        kind: self
      - id: m.bindName
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - eval: m.bindName(obs.name, obs.kind)
        to: m.bindName
      - opt:
          do:
            - return: ""
          when: obs.int64Cb == nil && obs.floatCb == nil
      - set: m.observers
        value: append(m.observers, obs)
  - of: (*memMeter).runObservers
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).runObservers
        kind: self
      - id: m.mu.RLock
        kind: value
      - id: m.mu.RUnlock
        kind: value
    steps:
      - eval: m.mu.RLock()
        to: m.mu.RLock
      - bind: regs
        eval: m.observers
      - eval: m.mu.RUnlock()
        to: m.mu.RUnlock
      - opt:
          do:
            - return: ""
          when: len(regs) == 0
      - loop:
          do:
            - opt:
                do:
                  - eval: |-
                      obs.floatCb(func(value float64, attrs ...coreotel.AttrValue) {
                      				//: resolve or create, then publish the reading.
                      				m.observeGauge(obs.name, value, attrs)
                      			})
                  - continue: true
                when: obs.kind == kindObservableGauge
            - eval: |-
                obs.int64Cb(func(value int64, attrs ...coreotel.AttrValue) {
                			//: resolve or create, then convert to the meter's temporality.
                			m.observeSum(obs.name, obs.kind, value, attrs, delta)
                		})
          key: _
          range: regs
          value: obs
  - of: (*memMeter).observeSum
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).observeSum
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.sums.lookup
        kind: internal
      - id: m.sums.admit
        kind: internal
      - id: sum.observe
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kind, name, sorted)
        to: appendSeriesKey
      - bind: sum, ok
        eval: m.sums.lookup(key)
        to: m.sums.lookup
      - opt:
          do:
            - set: sum
              to: m.sums.admit
              value: m.sums.admit(name, kind, key, sorted, observableBuilder(kind))
          when: "!ok"
      - eval: sum.observe(value, delta)
        to: sum.observe
  - of: (*memMeter).observeGauge
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).observeGauge
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.gauges.lookup
        kind: internal
      - id: m.gauges.admit
        kind: internal
      - id: gauge.Set
        kind: internal
    steps:
      - var:
          name: sortBuf
          type: "[maxStackAttrs]coreotel.AttrValue"
      - var:
          name: keyBuf
          type: "[seriesKeyCap]byte"
      - bind: sorted
        eval: sortAttrs(sortBuf[:0], attrs)
        to: sortAttrs
      - eval: coremetrics.ValidateAttrs(sorted)
        to: coremetrics
      - bind: key
        eval: appendSeriesKey(keyBuf[:0], kindObservableGauge, name, sorted)
        to: appendSeriesKey
      - bind: gauge, ok
        eval: m.gauges.lookup(key)
        to: m.gauges.lookup
      - opt:
          do:
            - set: gauge
              to: m.gauges.admit
              value: m.gauges.admit(name, kindObservableGauge, key, sorted, newMemGauge)
          when: "!ok"
      - eval: gauge.Set(value)
        to: gauge.Set
  - of: observableBuilder
    steps:
      - opt:
          do:
            - return: newObservableCounter
          when: kind == kindObservableCounter
      - return: newObservableUpDownCounter
  - of: instrumentKind.group
    steps:
      - switch:
          cases:
            - case: kindCounter, kindUpDownCounter, kindObservableCounter, kindObservableUpDownCounter
              do:
                - return: groupSum
            - case: kindGauge, kindObservableGauge
              do:
                - return: groupGauge
            - default: true
              do:
                - return: groupHistogram
          "on": k
  - of: instrumentKind.monotonic
    steps:
      - return: k == kindCounter || k == kindObservableCounter
  - of: (*nameState).seriesCap
    steps:
      - opt:
          do:
            - return: s.series
          when: s.overflowKey == ""
      - return: s.series + 1
  - of: (*nameState).overflowSeries
    steps:
      - opt:
          do:
            - set: s.overflowKey
              value: string(appendSeriesKey(nil, s.kind, name, overflowAttrs))
          when: s.overflowKey == ""
      - return: s.overflowKey, overflowAttrs
  - of: (*memMeter).bindName
    steps:
      - bind: state, ok
        eval: m.names[name]
      - opt:
          do:
            - set: state
              value: "&nameState{kind: want}"
            - set: m.names[name]
              value: state
            - return: state
          when: "!ok"
      - opt:
          do:
            - panic: coremetrics.InstrumentKindConflict.Error()
          when: state.kind != want
      - return: state
  - of: (*otlpPartialSuccess).RejectedCount
    steps:
      - return: int64(p.RejectedDataPoints)
  - of: decodeRejected
    participants:
      - id: caller
        kind: actor
      - id: decodeRejected
        kind: self
      - id: otlp
        kind: package
    steps:
      - var:
          name: message
          type: otlpPartialSuccess
      - return: otlp.DecodeRejected(payload, &message)
        to: otlp
  - of: sortAttrs
    participants:
      - id: caller
        kind: actor
      - id: sortAttrs
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(attrs) == 0
      - bind: sorted
        eval: buf
      - opt:
          do:
            - set: sorted
              value: make([]coreotel.AttrValue, 0, len(attrs))
          when: len(attrs) > cap(buf)
      - set: sorted
        value: append(sorted, attrs...)
      - eval: slices.SortFunc(sorted, coreotel.CompareAttrKey)
        to: slices
      - return: sorted
  - of: appendSeriesKey
    participants:
      - id: caller
        kind: actor
      - id: appendSeriesKey
        kind: self
      - id: appendSized
        kind: internal
      - id: attr.AppendIdentity
        kind: value
    steps:
      - set: dst
        value: append(dst, byte(kind))
      - set: dst
        to: appendSized
        value: appendSized(dst, name)
      - loop:
          do:
            - set: dst
              to: appendSized
              value: appendSized(dst, attr.Key)
            - set: dst
              to: attr.AppendIdentity
              value: attr.AppendIdentity(dst)
          key: _
          range: sorted
          value: attr
      - return: dst
  - of: appendSized
    participants:
      - id: caller
        kind: actor
      - id: appendSized
        kind: self
      - id: binary
        kind: stdlib
    steps:
      - set: dst
        to: binary
        value: binary.AppendUvarint(dst, uint64(len(s)))
      - return: append(dst, s...)
  - of: cloneAttrs
    participants:
      - id: caller
        kind: actor
      - id: cloneAttrs
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(src) == 0
      - return: slices.Clone(src)
        to: slices
  - of: compareAttrs
    participants:
      - id: caller
        kind: actor
      - id: compareAttrs
        kind: self
      - id: strings
        kind: stdlib
      - id: coreotel
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: c
                init:
                  bind: c
                  eval: strings.Compare(a[i].Key, b[i].Key)
                  to: strings
                when: c != 0
            - opt:
                do:
                  - return: c
                init:
                  bind: c
                  eval: coreotel.CompareAttrValue(a[i], b[i])
                  to: coreotel
                when: c != 0
          key: i
          range: min(len(a), len(b))
      - return: len(a) - len(b)
  - of: newSeriesStore
    steps:
      - return: "seriesStore[T]{meter: meter, byKey: make(map[string]*seriesEntry[T], 0)}"
  - of: (*seriesStore).lookup
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).lookup
        kind: self
      - id: s.meter.mu.RLock
        kind: value
      - id: s.meter.mu.RUnlock
        kind: value
    steps:
      - eval: s.meter.mu.RLock()
        to: s.meter.mu.RLock
      - bind: entry, found
        eval: s.byKey[string(key)]
      - eval: s.meter.mu.RUnlock()
        to: s.meter.mu.RUnlock
      - opt:
          do:
            - return: inst, false
          when: "!found"
      - return: entry.inst, true
  - of: (*seriesStore).admit
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).admit
        kind: self
      - id: s.meter.bindName
        kind: internal
      - id: s.overflow
        kind: internal
    steps:
      - lock:
          mutex: s.meter.mu
      - opt:
          do:
            - return: entry.inst
          init:
            bind: entry, ok
            eval: s.byKey[string(key)]
          when: ok
      - bind: state
        eval: s.meter.bindName(name, kind)
        to: s.meter.bindName
      - opt:
          do:
            - return: s.overflow(state, name, build)
              to: s.overflow
          when: state.series >= s.meter.maxSeries
      - op: ++
        set: state.series
      - bind: entry
        eval: "&seriesEntry[T]{name: name, attrs: cloneAttrs(sorted), inst: build()}"
      - set: s.byKey[retain(key)]
        value: entry
      - return: entry.inst
  - of: retain
    steps:
      - return: string(key)
  - of: (*seriesStore).overflow
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).overflow
        kind: self
      - id: state.overflowSeries
        kind: internal
    steps:
      - bind: key, attrs
        eval: state.overflowSeries(name)
        to: state.overflowSeries
      - opt:
          do:
            - return: entry.inst
          init:
            bind: entry, ok
            eval: s.byKey[key]
          when: ok
      - bind: entry
        eval: "&seriesEntry[T]{name: name, attrs: cloneAttrs(attrs), inst: build()}"
      - set: s.byKey[key]
        value: entry
      - return: entry.inst
  - of: (*memSum).Add
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Add
        kind: self
      - id: s.v.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: s.monotonic && delta <= 0
      - eval: s.v.Add(delta)
        to: s.v.Add
  - of: (*memSum).Inc
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Inc
        kind: self
      - id: s.v.Add
        kind: value
    steps:
      - eval: s.v.Add(1)
        to: s.v.Add
  - of: (*memSum).Dec
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Dec
        kind: self
      - id: s.Add
        kind: internal
    steps:
      - eval: s.Add(-1)
        to: s.Add
  - of: (*memSum).observe
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).observe
        kind: self
      - id: s.v.Store
        kind: value
    steps:
      - opt:
          do:
            - eval: s.v.Store(absolute)
              to: s.v.Store
            - return: ""
          when: "!delta"
      - bind: window
        eval: absolute - s.previous
      - opt:
          do:
            - set: window
              value: absolute
          when: s.monotonic && absolute < s.previous
      - eval: s.v.Store(window)
        to: s.v.Store
      - set: s.previous
        value: absolute
      - op: ++
        set: s.reports
  - of: (*memSum).collect
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).collect
        kind: self
      - id: s.v.Load
        kind: value
      - id: s.v.Swap
        kind: value
    steps:
      - opt:
          do:
            - return: s.v.Load()
              to: s.v.Load
          when: "!delta"
      - opt:
          do:
            - return: s.v.Swap(0)
              to: s.v.Swap
          when: "!s.observed"
      - opt:
          do:
            - return: "0"
          when: s.reports == 0
      - set: s.reports
        value: "0"
      - return: s.v.Load()
        to: s.v.Load
  - of: newCounter
    steps:
      - return: "&memSum{monotonic: true}"
  - of: newUpDownCounter
    steps:
      - return: "&memSum{}"
  - of: newObservableCounter
    steps:
      - return: "&memSum{monotonic: true, observed: true}"
  - of: newObservableUpDownCounter
    steps:
      - return: "&memSum{observed: true}"
