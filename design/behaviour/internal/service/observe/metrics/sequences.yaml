                  - return: idx
                when: h.sumBits.CompareAndSwap(old, next)
          forever: true
  - of: (*memHistogram).snapshot
    participants:
      - id: caller
        kind: actor
      - id: (*memHistogram).snapshot
        kind: self
      - id: h.observedSnapshot
        kind: internal
      - id: h.ex.collect
        kind: internal
      - id: h.counts[i].Swap
        kind: value
      - id: h.counts[i].Load
        kind: value
