  - of: appendSeriesLine
    participants:
      - id: caller
        kind: actor
      - id: appendSeriesLine
        kind: self
      - id: appendEscapedValue
        kind: internal
      - id: appendAttrs
        kind: internal
    steps:
      - set: buf
