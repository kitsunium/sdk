          errs.Wrap(writeErr, errs.WrapParams{
          		Code:    coremetrics.CodeExportFailed,
          		Reason:  "EXPORT_FAILED",
          		Public:  "The metrics exporter failed to ship the snapshot",
          		Private: "service/observe/metrics: Prometheus exporter writer returned an error",
          	})
        to: errs
  - of: renderExposition
    participants:
      - id: caller
        kind: actor
      - id: renderExposition
        kind: self
      - id: appendPromSums
