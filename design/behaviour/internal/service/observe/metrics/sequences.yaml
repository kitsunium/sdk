        to: appendQuoted
        value: appendQuoted(buf, scope.Name)
      - opt:
          do:
            - set: buf
              value: append(buf, " version="...)
            - set: buf
              to: appendQuoted
              value: appendQuoted(buf, scope.Version)
          when: scope.Version != ""
      - return: append(buf, '\n')
  - of: appendWindowLine
    participants:
      - id: caller
        kind: actor
      - id: appendWindowLine
        kind: self
      - id: start.AppendFormat
        kind: value
      - id: end.AppendFormat
        kind: value
