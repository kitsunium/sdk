            - return: nil, err
          when: err != nil
      - set: doc, err
        to: appendPromHistograms
        value: appendPromHistograms(doc, snap.Histograms)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: doc, err
        to: appendPromExponentials
        value: appendPromExponentials(doc, snap.ExponentialHistograms)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: doc, nil
  - of: appendPromSums
    participants:
      - id: caller
        kind: actor
      - id: appendPromSums
        kind: self
      - id: checkTemporality
        kind: internal
      - id: checkMetricName
        kind: internal
      - id: appendHelpLine
        kind: internal
      - id: appendTypeLine
        kind: internal
      - id: checkAttrNames
        kind: internal
      - id: appendSample
