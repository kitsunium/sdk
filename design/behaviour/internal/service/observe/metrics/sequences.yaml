      - id: appendBuckets
        kind: internal
      - id: otlp.Double(p.ZeroThreshold).AppendJSON
        kind: value
      - id: appendExemplars
        kind: internal
    steps:
      - set: dst
        value: append(dst, '{')
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "startTimeUnixNano")
      - set: dst
        to: p.StartTimeUnixNano.AppendJSON
        value: p.StartTimeUnixNano.AppendJSON(dst)
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "timeUnixNano")
      - set: dst
        to: p.TimeUnixNano.AppendJSON
        value: p.TimeUnixNano.AppendJSON(dst)
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "count")
      - set: dst
        to: p.Count.AppendJSON
        value: p.Count.AppendJSON(dst)
      - opt:
          do:
            - set: dst
              to: otlp
              value: otlp.AppendKey(dst, "sum")
            - set: dst
              to: p.Sum.AppendJSON
              value: p.Sum.AppendJSON(dst)
          when: p.Sum != nil
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "scale")
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, int64(p.Scale), otlpDocDecimalBase)
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "zeroCount")
      - set: dst
        to: p.ZeroCount.AppendJSON
        value: p.ZeroCount.AppendJSON(dst)
      - set: dst
        to: appendBuckets
        value: appendBuckets(dst, "positive", &p.Positive)
      - set: dst
        to: appendBuckets
        value: appendBuckets(dst, "negative", &p.Negative)
      - opt:
          do:
            - set: dst
              to: otlp
              value: otlp.AppendKey(dst, "zeroThreshold")
            - set: dst
              to: otlp.Double(p.ZeroThreshold).AppendJSON
              value: otlp.Double(p.ZeroThreshold).AppendJSON(dst)
          when: p.ZeroThreshold != 0
      - set: dst
        to: appendExemplars
        value: appendExemplars(dst, p.Exemplars)
      - opt:
          do:
            - set: dst
              to: otlp
              value: otlp.AppendKey(dst, "attributes")
            - set: dst
              to: otlp
              value: otlp.AppendKeyValues(dst, p.Attributes)
          when: len(p.Attributes) > 0
      - return: append(dst, '}')
  - of: appendBuckets
    participants:
      - id: caller
        kind: actor
      - id: appendBuckets
        kind: self
      - id: otlp
        kind: package
      - id: strconv
        kind: stdlib
      - id: appendBucketCounts
        kind: internal
    steps:
      - opt:
          do:
            - return: dst
          when: len(b.BucketCounts) == 0
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, key)
      - set: dst
        value: append(dst, '{')
      - set: dst
        to: otlp
        value: otlp.AppendKey(dst, "offset")
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, int64(b.Offset), otlpDocDecimalBase)
      - set: dst
        to: appendBucketCounts
        value: appendBucketCounts(dst, b.BucketCounts)
      - return: append(dst, '}')
  - of: (*otlpPartialSuccess).RejectedCount
    steps:
      - return: int64(p.RejectedDataPoints)
  - of: decodeRejected
    participants:
      - id: caller
        kind: actor
      - id: decodeRejected
        kind: self
      - id: otlp
        kind: package
    steps:
      - var:
          name: message
          type: otlpPartialSuccess
      - return: otlp.DecodeRejected(payload, &message)
        to: otlp
  - of: sortAttrs
    participants:
      - id: caller
        kind: actor
      - id: sortAttrs
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(attrs) == 0
      - bind: sorted
        eval: buf
      - opt:
          do:
            - set: sorted
              value: make([]coreotel.AttrValue, 0, len(attrs))
          when: len(attrs) > cap(buf)
      - set: sorted
        value: append(sorted, attrs...)
      - eval: slices.SortFunc(sorted, coreotel.CompareAttrKey)
        to: slices
      - return: sorted
  - of: appendSeriesKey
    participants:
      - id: caller
        kind: actor
      - id: appendSeriesKey
        kind: self
      - id: appendSized
        kind: internal
      - id: attr.AppendIdentity
        kind: value
    steps:
      - set: dst
        value: append(dst, byte(kind))
      - set: dst
        to: appendSized
        value: appendSized(dst, name)
      - loop:
          do:
            - set: dst
              to: appendSized
              value: appendSized(dst, attr.Key)
            - set: dst
              to: attr.AppendIdentity
              value: attr.AppendIdentity(dst)
          key: _
          range: sorted
          value: attr
      - return: dst
  - of: appendSized
    participants:
      - id: caller
        kind: actor
      - id: appendSized
        kind: self
      - id: binary
        kind: stdlib
    steps:
      - set: dst
        to: binary
        value: binary.AppendUvarint(dst, uint64(len(s)))
      - return: append(dst, s...)
  - of: cloneAttrs
    participants:
      - id: caller
        kind: actor
      - id: cloneAttrs
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(src) == 0
      - return: slices.Clone(src)
        to: slices
  - of: compareAttrs
    participants:
      - id: caller
        kind: actor
      - id: compareAttrs
        kind: self
      - id: strings
        kind: stdlib
      - id: coreotel
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: c
                init:
                  bind: c
                  eval: strings.Compare(a[i].Key, b[i].Key)
                  to: strings
                when: c != 0
            - opt:
                do:
                  - return: c
                init:
                  bind: c
                  eval: coreotel.CompareAttrValue(a[i], b[i])
                  to: coreotel
                when: c != 0
          key: i
          range: min(len(a), len(b))
      - return: len(a) - len(b)
  - of: newSeriesStore
    steps:
      - return: "seriesStore[T]{meter: meter, byKey: make(map[string]*seriesEntry[T], 0)}"
  - of: (*seriesStore).lookup
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).lookup
        kind: self
      - id: s.meter.mu.RLock
        kind: value
      - id: s.meter.mu.RUnlock
        kind: value
    steps:
      - eval: s.meter.mu.RLock()
        to: s.meter.mu.RLock
      - bind: entry, found
        eval: s.byKey[string(key)]
      - eval: s.meter.mu.RUnlock()
        to: s.meter.mu.RUnlock
      - opt:
          do:
            - return: inst, false
          when: "!found"
      - return: entry.inst, true
  - of: (*seriesStore).admit
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).admit
        kind: self
      - id: s.meter.bindName
        kind: internal
      - id: s.overflow
        kind: internal
    steps:
      - lock:
          mutex: s.meter.mu
      - opt:
          do:
            - return: entry.inst
          init:
            bind: entry, ok
            eval: s.byKey[string(key)]
          when: ok
      - bind: state
        eval: s.meter.bindName(name, kind)
        to: s.meter.bindName
      - opt:
          do:
            - return: s.overflow(state, name, build)
              to: s.overflow
          when: state.series >= s.meter.maxSeries
      - op: ++
        set: state.series
      - bind: entry
        eval: "&seriesEntry[T]{name: name, attrs: cloneAttrs(sorted), inst: stampClock(build(), s.meter.clk)}"
      - set: s.byKey[retain(key)]
        value: entry
      - return: entry.inst
  - of: retain
    steps:
      - return: string(key)
  - of: (*seriesStore).overflow
    participants:
      - id: caller
        kind: actor
      - id: (*seriesStore).overflow
        kind: self
      - id: state.overflowSeries
        kind: internal
    steps:
      - bind: key, attrs
        eval: state.overflowSeries(name)
        to: state.overflowSeries
      - opt:
          do:
            - return: entry.inst
          init:
            bind: entry, ok
            eval: s.byKey[key]
          when: ok
      - bind: entry
        eval: "&seriesEntry[T]{name: name, attrs: cloneAttrs(attrs), inst: stampClock(build(), s.meter.clk)}"
      - set: s.byKey[key]
        value: entry
      - return: entry.inst
  - of: (*memSum).AddContext
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).AddContext
        kind: self
      - id: s.v.Add
        kind: value
      - id: sampledSpan
        kind: internal
      - id: s.ex.offer
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: s.monotonic && delta <= 0
      - eval: s.v.Add(delta)
        to: s.v.Add
      - opt:
          do:
            - eval: s.ex.offer(sumExemplarSlots, 0, float64(delta), span)
              to: s.ex.offer
          init:
            bind: span, ok
            eval: sampledSpan(ctx)
            to: sampledSpan
          when: ok
  - of: (*memSum).setClock
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).setClock
        kind: self
      - id: s.ex.setClock
        kind: internal
    steps:
      - eval: s.ex.setClock(clk)
        to: s.ex.setClock
  - of: (*memSum).exemplars
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).exemplars
        kind: self
      - id: s.ex.collect
        kind: internal
    steps:
      - return: s.ex.collect(delta)
        to: s.ex.collect
  - of: (*memSum).Add
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Add
        kind: self
      - id: s.v.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: s.monotonic && delta <= 0
      - eval: s.v.Add(delta)
        to: s.v.Add
  - of: (*memSum).Inc
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Inc
        kind: self
      - id: s.v.Add
        kind: value
    steps:
      - eval: s.v.Add(1)
        to: s.v.Add
  - of: (*memSum).Dec
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).Dec
        kind: self
      - id: s.Add
        kind: internal
    steps:
      - eval: s.Add(-1)
        to: s.Add
  - of: (*memSum).observe
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).observe
        kind: self
      - id: s.v.Store
        kind: value
    steps:
      - opt:
          do:
            - eval: s.v.Store(absolute)
              to: s.v.Store
            - return: ""
          when: "!delta"
      - bind: window
        eval: absolute - s.previous
      - opt:
          do:
            - set: window
              value: absolute
          when: s.monotonic && absolute < s.previous
      - eval: s.v.Store(window)
        to: s.v.Store
      - set: s.previous
        value: absolute
      - op: ++
        set: s.reports
  - of: (*memSum).collect
    participants:
      - id: caller
        kind: actor
      - id: (*memSum).collect
        kind: self
      - id: s.v.Load
        kind: value
      - id: s.v.Swap
        kind: value
    steps:
      - opt:
          do:
            - return: s.v.Load()
              to: s.v.Load
          when: "!delta"
      - opt:
          do:
            - return: s.v.Swap(0)
              to: s.v.Swap
          when: "!s.observed"
      - opt:
          do:
            - return: "0"
          when: s.reports == 0
      - set: s.reports
        value: "0"
      - return: s.v.Load()
        to: s.v.Load
  - of: newCounter
    steps:
      - return: "&memSum{monotonic: true}"
  - of: newUpDownCounter
    steps:
      - return: "&memSum{}"
  - of: newObservableCounter
    steps:
      - return: "&memSum{monotonic: true, observed: true}"
  - of: newObservableUpDownCounter
    steps:
      - return: "&memSum{observed: true}"
