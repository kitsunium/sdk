      - id: appendSums
        kind: internal
      - id: appendGauges
        kind: internal
      - id: appendHistograms
        kind: internal
      - id: appendExponentials
        kind: internal
      - id: e.mu.Lock
        kind: value
      - id: e.dst.Write
        kind: value
      - id: e.mu.Unlock
        kind: value
      - id: errs
        kind: package
    steps:
      - var:
