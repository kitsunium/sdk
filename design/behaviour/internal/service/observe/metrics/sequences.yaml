  - of: (*memMeter).Histogram
    participants:
      - id: caller
        kind: actor
      - id: (*memMeter).Histogram
        kind: self
      - id: sortAttrs
        kind: internal
      - id: coremetrics
        kind: package
      - id: appendSeriesKey
        kind: internal
      - id: m.histograms.lookup
        kind: internal
      - id: newHistogram
        kind: internal
      - id: m.histograms.admit
        kind: internal
