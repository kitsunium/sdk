          do:
            - return: nil
          when: temporality == coremetrics.TemporalityCumulative
      - return: errs.Wrap(coremetrics.UnsupportedTemporality, errs.WrapParams{}, errs.String("metric", name))
        to: errs
  - of: checkMetricName
    participants:
      - id: caller
        kind: actor
      - id: checkMetricName
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: validMetricName(name)
      - return: errs.Wrap(coremetrics.InvalidMetricName, errs.WrapParams{}, errs.String("metric", name))
        to: errs
  - of: checkAttrNames
    participants:
      - id: caller
        kind: actor
      - id: checkAttrNames
        kind: self
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.InvalidLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: "!validLabelName(attr.Key)"
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.ReservedLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: strings.HasPrefix(attr.Key, reservedLabelPrefix)
            - opt:
                do:
                  - return: errs.Wrap(coremetrics.ReservedLabelName, errs.WrapParams{}, errs.String("label", attr.Key))
                    to: errs
                when: bucketBound && attr.Key == boundLabelKey
          key: _
          range: attrs
          value: attr
      - return: nil
  - of: metricNameByte
    steps:
      - switch:
          cases:
            - case: c >= 'a' && c <= 'z', c >= 'A' && c <= 'Z', c == '_', c == ':'
              do:
                - return: "true"
            - case: c >= '0' && c <= '9'
              do:
                - return: "!first"
            - default: true
              do:
                - return: "false"
  - of: labelNameByte
    steps:
      - switch:
          cases:
            - case: c >= 'a' && c <= 'z', c >= 'A' && c <= 'Z', c == '_'
              do:
                - return: "true"
            - case: c >= '0' && c <= '9'
              do:
                - return: "!first"
            - default: true
              do:
                - return: "false"
