      - return: buf
  - of: appendHistograms
    participants:
      - id: caller
        kind: actor
      - id: appendHistograms
        kind: self
      - id: appendMetricHeader
        kind: internal
      - id: appendSeriesLine
        kind: internal
    steps:
      - loop:
          do:
            - bind: metric
