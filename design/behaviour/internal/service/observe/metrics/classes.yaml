# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      DefaultMaxSeriesPerInstrument is the bound a Meter uses when MeterConfig
      leaves the knob unset. 2000 distinct attribute sets per instrument name is
      the figure the OpenTelemetry SDKs settled on for the same problem: high
      enough that a sanely-attributed metric never reaches it, low enough that a
      metric which does reach it has not yet cost meaningful memory.
    items:
      - name: DefaultMaxSeriesPerInstrument
        type: int
        value: "2000"
    name: DefaultMaxSeriesPerInstrument
  - doc: |-
      OTLPMetricsPath is the URL path OTLP/HTTP reserves for the metrics signal.
      The specification names it under §OTLP/HTTP Request; an endpoint is a full
      URL used as-is, so a caller spells the path themselves and this constant is
      what they spell it with.
    items:
      - name: OTLPMetricsPath
        type: string
        value: "\"/v1/metrics\""
    name: OTLPMetricsPath
  - doc: |-
      DefaultOTLPTimeout bounds one export round trip when OTLPHTTPConfig leaves
      Timeout unset. Ten seconds is the value the OpenTelemetry protocol exporter
      specification itself defaults OTEL_EXPORTER_OTLP_TIMEOUT to, so it is a
      clamp onto the specification's own number rather than a figure this SDK
      invented (ADR 0031).
    items:
      - name: DefaultOTLPTimeout
        type: time.Duration
        value: otlp.DefaultTimeout
    name: DefaultOTLPTimeout
  - doc: |-
      DefaultOTLPMaxResponseBytes caps how much of a collector's response body is
      read. A conforming response is an ExportMetricsServiceResponse or a Status
      message — hundreds of bytes. The cap exists because the body is the one part
      of this exchange a REMOTE party controls its length of, and an exporter that
      read it whole would hand a hostile or broken collector a way to exhaust the
      process that is only trying to report its metrics.

      It also bounds the drain that recycles the connection after the verdict —
      always this default rather than OTLPHTTPConfig.MaxResponseBytes, because
      that knob bounds what is read into memory and the drain keeps nothing.
    items:
      - name: DefaultOTLPMaxResponseBytes
        type: int64
        value: otlp.DefaultMaxResponseBytes
    name: DefaultOTLPMaxResponseBytes
  - doc: |-
      rejectedFieldKey is the errs Field key a partial success carries the
      rejected count under. It never carries remote-controlled text.
    items:
      - name: rejectedFieldKey
        type: string
        value: "\"rejected_data_points\""
    name: rejectedFieldKey
  - doc: |-
      otlpJSONExporterName is the registered name of the default OTLP/JSON
      exporter, which writes to stderr (ADR 0030). It names the ENCODING, not the
      protocol, because an OTLP/protobuf encoder would register beside it.
    items:
      - name: otlpJSONExporterName
        type: coremetrics.ExporterName
        value: "\"otlpjson\""
    name: otlpJSONExporterName
  - doc: |-
      The three AggregationTemporality enum values, copied from
      opentelemetry/proto/metrics/v1/metrics.proto. OTLP/JSON encodes an enum as
      its INTEGER, never as its name (specification §JSON Protobuf Encoding), which
      is the one place OTLP/JSON deviates from the generic proto3 JSON mapping.
    grouped: true
    items:
      - doc: |-
          otlpTemporalityUnspecified is AGGREGATION_TEMPORALITY_UNSPECIFIED. The
          schema's own comment reads "UNSPECIFIED is the default
          AggregationTemporality, it MUST not be used" — so this constant names
          the value this encoder REFUSES, never one it emits.
        name: otlpTemporalityUnspecified
        type: int
        value: iota
      - doc: otlpTemporalityDelta is AGGREGATION_TEMPORALITY_DELTA.
        name: otlpTemporalityDelta
      - doc: otlpTemporalityCumulative is AGGREGATION_TEMPORALITY_CUMULATIVE.
        name: otlpTemporalityCumulative
    name: otlpTemporalityUnspecified
  - doc: |-
      prometheusExporterName is the registered name of the default Prometheus
      exporter, which writes to stderr (ADR 0030).
    items:
      - name: prometheusExporterName
        type: coremetrics.ExporterName
        value: "\"prometheus\""
    name: prometheusExporterName
  - doc: |-
      The three TYPE names the exposition format defines for the SDK's instrument
      kinds. Summary and untyped exist in the format but have no SDK instrument.
    grouped: true
    items:
      - name: promTypeCounter
        type: string
        value: "\"counter\""
      - name: promTypeGauge
        type: string
        value: "\"gauge\""
      - name: promTypeHistogram
        type: string
        value: "\"histogram\""
    name: promTypeCounter
  - doc: |-
      The suffixes a histogram family is spelled with, plus the reserved label that
      carries a bucket's inclusive upper bound and the mandatory last bound.
    grouped: true
    items:
      - name: bucketSuffix
        type: string
        value: "\"_bucket\""
      - name: sumSuffix
        type: string
        value: "\"_sum\""
      - name: countSuffix
        type: string
        value: "\"_count\""
      - name: boundLabelKey
        type: string
        value: "\"le\""
      - name: positiveInfBound
        type: string
        value: "\"+Inf\""
      - doc: |-
          noBound is the boundLabelKey-absent sentinel. The empty string is safe
          as a sentinel because every bound this exporter emits is a formatted
          float, and no formatted float is empty.
        name: noBound
        type: string
        value: "\"\""
      - doc: |-
          reservedLabelPrefix is what Prometheus reserves for its own internal
          labels; a label so named is dropped during relabelling, so a series
          carrying one silently loses a dimension at the server.
        name: reservedLabelPrefix
        type: string
        value: "\"__\""
    name: bucketSuffix
  - doc: |-
      textExporterName is the registered name of the default text exporter, which
      writes to stderr (ADR 0030).
    items:
      - name: textExporterName
        type: coremetrics.ExporterName
        value: "\"text\""
    name: textExporterName
  - doc: decimalBase / floatBitSize are the strconv formatting parameters.
    grouped: true
    items:
      - name: decimalBase
        type: int
        value: "10"
      - name: floatBitSize
        type: int
        value: "64"
    name: decimalBase
  - doc: The three kind words and the two monotonicity words the header line uses.
    grouped: true
    items:
      - name: textKindSum
        type: string
        value: "\"sum\""
      - name: textKindGauge
        type: string
        value: "\"gauge\""
      - name: textKindHistogram
        type: string
        value: "\"histogram\""
      - name: textMonotonic
        type: string
        value: "\"monotonic\""
      - name: textNonMonotonic
        type: string
        value: "\"non_monotonic\""
    name: textKindSum
  - doc: minSortableSeries is the shortest slice worth handing to a sort.
    items:
      - name: minSortableSeries
        type: int
        value: "2"
    name: minSortableSeries
  - grouped: true
    items:
      - doc: kindCounter marks a name bound to a synchronous monotonic Counter.
        name: kindCounter
        type: instrumentKind
        value: iota
      - doc: |-
          kindUpDownCounter marks a name bound to a synchronous non-monotonic
          UpDownCounter.
        name: kindUpDownCounter
      - doc: kindGauge marks a name bound to a Gauge.
        name: kindGauge
      - doc: kindHistogram marks a name bound to a Histogram.
        name: kindHistogram
      - doc: kindObservableCounter marks a name bound to an asynchronous monotonic sum.
        name: kindObservableCounter
      - doc: |-
          kindObservableUpDownCounter marks a name bound to an asynchronous
          non-monotonic sum.
        name: kindObservableUpDownCounter
      - doc: kindObservableGauge marks a name bound to an asynchronous gauge.
        name: kindObservableGauge
    name: kindCounter
  - grouped: true
    items:
      - doc: groupSum is SnapshotValue.Sums.
        name: groupSum
        type: outputGroup
        value: iota
      - doc: groupGauge is SnapshotValue.Gauges.
        name: groupGauge
      - doc: groupHistogram is SnapshotValue.Histograms.
        name: groupHistogram
    name: groupSum
  - doc: |-
      maxStackAttrs is how many attributes the lookup path sorts without touching
      the heap. Eight is already an unusual number of dimensions on one metric;
      beyond it the sort falls back to a heap clone, which is correct and merely
      slower — the pathological case pays, the normal one does not.
    items:
      - name: maxStackAttrs
        type: int
        value: "8"
    name: maxStackAttrs
  - doc: |-
      seriesKeyCap is the stack scratch the encoded series key is built in. A key
      is the instrument name plus every key and typed value, each tagged and
      length-prefixed or fixed-width, so 192 bytes covers a long name with a
      handful of attributes. Overflowing it costs one heap slice on that call,
      nothing more.
    items:
      - name: seriesKeyCap
        type: int
        value: "192"
    name: seriesKeyCap
