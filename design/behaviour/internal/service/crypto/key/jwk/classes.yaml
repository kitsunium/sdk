# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      uncompressedPointTag is the SEC1 §2.3.3 prefix of an uncompressed point,
      the encoding crypto/ecdh accepts for a NIST public key.
    items:
      - name: uncompressedPointTag
        type: byte
        value: "0x04"
    name: uncompressedPointTag
  - doc: |-
      bitsPerOctet bounds a big.Int against a fixed-width field element: an integer
      wider than coordLen(crv)*bitsPerOctet cannot be a coordinate on that curve,
      and would make math/big.Int.FillBytes panic.
    items:
      - name: bitsPerOctet
        type: int
        value: "8"
    name: bitsPerOctet
  - doc: p256CoordLen is the fixed octet width of one coordinate on NIST P-256.
    items:
      - name: p256CoordLen
        type: int
        value: "32"
    name: p256CoordLen
  - doc: p384CoordLen is the fixed octet width of one coordinate on NIST P-384.
    items:
      - name: p384CoordLen
        type: int
        value: "48"
    name: p384CoordLen
  - doc: |-
      p521CoordLen is the fixed octet width of one coordinate on NIST P-521 — the
      odd one out, because that curve's bit length is not a multiple of eight and
      therefore rounds up to a whole extra octet.
    items:
      - name: p521CoordLen
        type: int
        value: "66"
    name: p521CoordLen
  - doc: |-
      ed25519KeyLen is the octet length of an Ed25519 public key and of the seed
      RFC 8037 §2 puts in "d" — both 32, unlike crypto/ed25519's 64-octet private
      key, which is seed||public.
    items:
      - name: ed25519KeyLen
        type: int
        value: "32"
    name: ed25519KeyLen
  - grouped: true
    items:
      - doc: |-
          TypeEC is an elliptic-curve key over a NIST prime curve (RFC 7518 §6.2):
          public members "x"/"y", private member "d".
        name: TypeEC
        type: Type
        value: "\"EC\""
      - doc: |-
          TypeOKP is an octet key pair — an Edwards-curve key (RFC 8037 §2):
          public member "x", private member "d" (the 32-octet seed).
        name: TypeOKP
        type: Type
        value: "\"OKP\""
      - doc: |-
          TypeOct is a symmetric key carried whole in "k" (RFC 7518 §6.4). It has
          no public half, which is why MarshalPublic refuses it.
        name: TypeOct
        type: Type
        value: "\"oct\""
    name: TypeEC
  - grouped: true
    items:
      - doc: |-
          CurveP256 is NIST P-256, the curve behind JOSE "ES256" and the SDK's
          registered "ecdsa-p256" signer.
        name: CurveP256
        type: Curve
        value: "\"P-256\""
      - doc: |-
          CurveP384 is NIST P-384 (JOSE "ES384"). Representable here, but the SDK
          registers no signer for it — see the package CLAUDE.md.
        name: CurveP384
        type: Curve
        value: "\"P-384\""
      - doc: |-
          CurveP521 is NIST P-521 (JOSE "ES512"); field elements are 66 octets, not
          65, because 521 bits round up to 66 whole octets.
        name: CurveP521
        type: Curve
        value: "\"P-521\""
      - doc: CurveEd25519 is the Edwards curve behind JOSE "EdDSA" (RFC 8037).
        name: CurveEd25519
        type: Curve
        value: "\"Ed25519\""
    name: CurveP256
