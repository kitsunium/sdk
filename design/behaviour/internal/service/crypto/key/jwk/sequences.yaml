      - return: |-
          []byte(`{"crv":"` + string(k.crv) + `","kty":"EC","x":"` +
          		b64Encode(k.x) + `","y":"` + b64Encode(k.y) + `"}`), nil
  - of: KeyValue.thumbprintOKP
    steps:
      - opt:
          do:
            - return: nil, corejwk.MissingMember
          when: len(k.x) == 0
      - return: |-
          []byte(`{"crv":"` + string(k.crv) + `","kty":"OKP","x":"` +
          		b64Encode(k.x) + `"}`), nil
  - of: KeyValue.thumbprintOct
    steps:
      - opt:
          do:
            - return: nil, corejwk.NoPrivateMaterial
          when: "!k.IsPrivate()"
      - return: "[]byte(`{\"k\":\"` + b64Encode(k.secret()) + `\",\"kty\":\"oct\"}`), nil"
  - of: Parse
    participants:
      - id: caller
        kind: actor
      - id: Parse
        kind: self
      - id: json
        kind: stdlib
      - id: fromWire
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                KeyValue{}, errs.Wrap(corejwk.Malformed, errs.WrapParams{},
                			errs.String("why", "the document is JSON null, not a JWK object"))
          when: isJSONNull(document)
      - var:
          name: raw
          type: keyJSON
      - opt:
          do:
            - return: |-
                KeyValue{}, errs.Wrap(uerr, errs.WrapParams{
                			Code:    corejwk.CodeJWKMalformed,
                			Reason:  "MALFORMED",
                			Public:  "JWK document is malformed",
                			Private: "service/crypto/key/jwk.Parse: json.Unmarshal rejected the document",
                		})
          init:
            bind: uerr
            eval: json.Unmarshal(document, &raw)
            to: json
          when: uerr != nil
      - return: fromWire(raw)
        to: fromWire
  - of: isJSONNull
    participants:
      - id: caller
        kind: actor
      - id: isJSONNull
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - return: bytes.Equal(bytes.TrimSpace(document), []byte("null"))
        to: bytes
  - of: fromWire
    participants:
      - id: caller
        kind: actor
      - id: fromWire
        kind: self
      - id: parseEC
        kind: internal
      - id: parseOKP
        kind: internal
      - id: parseOct
        kind: internal
    steps:
      - opt:
          do:
            - return: KeyValue{}, corejwk.MissingMember
          when: raw.Kty == ""
      - bind: base
        eval: |-
          KeyValue{
          		kty:    Type(raw.Kty),
          		crv:    Curve(raw.Crv),
          		kid:    raw.Kid,
          		use:    raw.Use,
          		alg:    raw.Alg,
          		keyOps: slices.Clone(raw.KeyOps),
          	}
      - switch:
          cases:
            - case: TypeEC
              do:
                - return: parseEC(base, raw)
                  to: parseEC
            - case: TypeOKP
              do:
                - return: parseOKP(base, raw)
                  to: parseOKP
            - case: TypeOct
              do:
                - return: parseOct(base, raw)
                  to: parseOct
            - default: true
              do:
                - return: KeyValue{}, corejwk.UnsupportedKeyType
          "on": base.kty
  - of: parseEC
    participants:
      - id: caller
        kind: actor
      - id: parseEC
        kind: self
      - id: coordLen
        kind: internal
      - id: b64DecodeFixed
        kind: internal
      - id: checkECPoint
        kind: internal
      - id: attachECPrivate
        kind: internal
    steps:
      - bind: size
        eval: coordLen(base.crv)
        to: coordLen
      - opt:
          do:
            - return: KeyValue{}, corejwk.UnsupportedCurve
          when: size == 0
      - opt:
          do:
            - return: KeyValue{}, corejwk.MissingMember
          when: raw.X == "" || raw.Y == ""
      - bind: xcoord, xerr
        eval: b64DecodeFixed(raw.X, size)
        to: b64DecodeFixed
      - opt:
          do:
            - return: KeyValue{}, xerr
          when: xerr != nil
      - bind: ycoord, yerr
        eval: b64DecodeFixed(raw.Y, size)
        to: b64DecodeFixed
      - opt:
          do:
            - return: KeyValue{}, yerr
          when: yerr != nil
      - opt:
          do:
            - return: KeyValue{}, perr
          init:
            bind: perr
            eval: checkECPoint(base.crv, xcoord, ycoord)
            to: checkECPoint
          when: perr != nil
      - set: base.x, base.y
        value: xcoord, ycoord
      - return: attachECPrivate(base, raw.D, size)
        to: attachECPrivate
  - of: attachECPrivate
    participants:
      - id: caller
        kind: actor
      - id: attachECPrivate
        kind: self
      - id: b64DecodeFixed
        kind: internal
      - id: checkECScalar
        kind: internal
      - id: holdPrivate
        kind: internal
    steps:
      - opt:
          do:
            - return: base, nil
          when: member == ""
      - bind: scalar, derr
        eval: b64DecodeFixed(member, size)
        to: b64DecodeFixed
      - opt:
          do:
            - return: KeyValue{}, derr
          when: derr != nil
      - opt:
          do:
            - return: KeyValue{}, serr
          init:
            bind: serr
            eval: checkECScalar(base.crv, scalar, base.x, base.y)
            to: checkECScalar
          when: serr != nil
      - set: base.priv
        to: holdPrivate
        value: holdPrivate(scalar)
      - return: base, nil
  - of: parseOKP
    participants:
      - id: caller
        kind: actor
      - id: parseOKP
        kind: self
      - id: b64DecodeFixed
        kind: internal
      - id: attachOKPPrivate
        kind: internal
    steps:
      - opt:
          do:
            - return: KeyValue{}, corejwk.UnsupportedCurve
          when: base.crv != CurveEd25519
      - opt:
          do:
            - return: KeyValue{}, corejwk.MissingMember
          when: raw.X == ""
      - bind: pub, xerr
        eval: b64DecodeFixed(raw.X, ed25519KeyLen)
        to: b64DecodeFixed
      - opt:
          do:
            - return: KeyValue{}, xerr
          when: xerr != nil
      - set: base.x
        value: pub
      - return: attachOKPPrivate(base, raw.D)
        to: attachOKPPrivate
  - of: attachOKPPrivate
    participants:
      - id: caller
        kind: actor
      - id: attachOKPPrivate
        kind: self
      - id: b64DecodeFixed
        kind: internal
      - id: holdPrivate
        kind: internal
    steps:
      - opt:
          do:
            - return: base, nil
          when: member == ""
      - bind: seed, derr
        eval: b64DecodeFixed(member, ed25519KeyLen)
        to: b64DecodeFixed
      - opt:
          do:
            - return: KeyValue{}, derr
          when: derr != nil
      - opt:
          do:
            - return: KeyValue{}, corejwk.KeyMismatch
          when: "!bytes.Equal(ed25519.NewKeyFromSeed(seed)[ed25519KeyLen:], base.x)"
      - set: base.priv
        to: holdPrivate
        value: holdPrivate(seed)
      - return: base, nil
  - of: parseOct
    participants:
      - id: caller
        kind: actor
      - id: parseOct
        kind: self
      - id: b64Decode
        kind: internal
      - id: holdPrivate
        kind: internal
    steps:
      - opt:
          do:
            - return: KeyValue{}, corejwk.UnsupportedCurve
          when: base.crv != ""
      - opt:
          do:
            - return: KeyValue{}, corejwk.MissingMember
          when: raw.K == ""
      - bind: secret, kerr
        eval: b64Decode(raw.K)
        to: b64Decode
      - opt:
          do:
            - return: KeyValue{}, kerr
          when: kerr != nil
      - set: base.priv
        to: holdPrivate
        value: holdPrivate(secret)
      - return: base, nil
  - of: NewSet
    steps:
      - return: "Set{keys: slices.Clone(keys)}"
  - of: ParseSet
    participants:
      - id: caller
        kind: actor
      - id: ParseSet
        kind: self
      - id: json
        kind: stdlib
      - id: parseMembers
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                Set{}, errs.Wrap(corejwk.Malformed, errs.WrapParams{},
                			errs.String("why", "the document is JSON null, not a JWK Set object"))
          when: isJSONNull(document)
      - var:
          name: raw
          type: setJSON
      - opt:
          do:
            - return: |-
                Set{}, errs.Wrap(uerr, errs.WrapParams{
                			Code:    corejwk.CodeJWKMalformed,
                			Reason:  "MALFORMED",
                			Public:  "JWK document is malformed",
                			Private: "service/crypto/key/jwk.ParseSet: json.Unmarshal rejected the JWK Set envelope",
                		})
          init:
            bind: uerr
            eval: json.Unmarshal(document, &raw)
            to: json
          when: uerr != nil
      - opt:
          do:
            - return: Set{}, corejwk.MissingMember
          when: raw.Keys == nil
      - return: parseMembers(raw.Keys)
        to: parseMembers
  - of: parseMembers
    participants:
      - id: caller
        kind: actor
      - id: parseMembers
        kind: self
      - id: Parse
        kind: internal
    steps:
      - bind: keys
        eval: make([]KeyValue, 0, len(members))
      - loop:
          do:
            - bind: key, perr
              eval: Parse(member)
              to: Parse
            - opt:
                do:
                  - return: Set{}, errs.Wrap(perr, errs.WrapParams{}, errs.Int("index", index))
                when: perr != nil
            - set: keys
              value: append(keys, key)
          key: index
          range: members
          value: member
      - return: "Set{keys: keys}, nil"
  - of: Set.Len
    steps:
      - return: len(s.keys)
  - of: Set.Keys
    participants:
      - id: caller
        kind: actor
      - id: Set.Keys
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Clone(s.keys)
        to: slices
  - of: Set.ByKid
    participants:
      - id: caller
        kind: actor
      - id: Set.ByKid
        kind: self
      - id: s.AllByKid
        kind: internal
    steps:
      - opt:
          do:
            - return: KeyValue{}, corejwk.KeyNotFound
          when: kid == ""
      - bind: matches
        eval: s.AllByKid(kid)
        to: s.AllByKid
      - switch:
          cases:
            - case: "0"
              do:
                - return: KeyValue{}, corejwk.KeyNotFound
            - case: "1"
              do:
                - return: matches[0], nil
            - default: true
              do:
                - return: |-
                    KeyValue{}, errs.Wrap(corejwk.AmbiguousKid, errs.WrapParams{},
                    			errs.Int("candidates", len(matches)))
          "on": len(matches)
  - of: Set.MarshalPublic
    participants:
      - id: caller
        kind: actor
      - id: Set.MarshalPublic
        kind: self
      - id: s.marshalWith
        kind: internal
    steps:
      - return: s.marshalWith(KeyValue.MarshalPublic)
        to: s.marshalWith
  - of: Set.MarshalPrivate
    participants:
      - id: caller
        kind: actor
      - id: Set.MarshalPrivate
        kind: self
      - id: s.marshalWith
        kind: internal
    steps:
      - return: s.marshalWith(KeyValue.MarshalPrivate)
        to: s.marshalWith
  - of: Set.MarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: Set.MarshalJSON
        kind: self
      - id: s.MarshalPublic
        kind: internal
    steps:
      - return: s.MarshalPublic()
        to: s.MarshalPublic
  - of: Set.marshalWith
    participants:
      - id: caller
        kind: actor
      - id: Set.marshalWith
        kind: self
      - id: json
        kind: stdlib
    steps:
      - bind: raw
        eval: "setJSON{Keys: make([]json.RawMessage, 0, len(s.keys))}"
      - loop:
          do:
            - bind: member, merr
              eval: render(key)
            - opt:
                do:
                  - return: nil, errs.Wrap(merr, errs.WrapParams{}, errs.Int("index", index))
                when: merr != nil
            - set: raw.Keys
              value: append(raw.Keys, member)
          key: index
          range: s.keys
          value: key
      - bind: out, jerr
        eval: json.Marshal(raw)
        to: json
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(jerr, errs.WrapParams{
                			Code:    corejwk.CodeJWKMalformed,
                			Reason:  "MALFORMED",
                			Public:  "JWK document is malformed",
                			Private: "service/crypto/key/jwk: json.Marshal failed on the JWK Set envelope",
                		})
          when: jerr != nil
      - return: out, nil
  - of: Set.GoString
    participants:
      - id: caller
        kind: actor
      - id: Set.GoString
        kind: self
      - id: s.String
        kind: internal
    steps:
      - return: s.String()
        to: s.String
  - of: b64Encode
    participants:
      - id: caller
        kind: actor
      - id: b64Encode
        kind: self
      - id: base64.RawURLEncoding.EncodeToString
        kind: value
    steps:
      - return: base64.RawURLEncoding.EncodeToString(raw)
        to: base64.RawURLEncoding.EncodeToString
  - of: b64Decode
    participants:
      - id: caller
        kind: actor
      - id: b64Decode
        kind: self
      - id: base64.RawURLEncoding.DecodeString
        kind: value
    steps:
      - bind: decoded, derr
        eval: base64.RawURLEncoding.DecodeString(member)
        to: base64.RawURLEncoding.DecodeString
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(derr, errs.WrapParams{
                			Code:    corejwk.CodeJWKInvalidEncoding,
                			Reason:  "INVALID_ENCODING",
                			Public:  "JWK member is not valid unpadded base64url",
                			Private: "service/crypto/key/jwk: base64.RawURLEncoding rejected a member (padded or wrong alphabet)",
                		})
          when: derr != nil
      - return: decoded, nil
  - of: b64DecodeFixed
    participants:
      - id: caller
        kind: actor
      - id: b64DecodeFixed
        kind: self
      - id: b64Decode
        kind: internal
    steps:
      - bind: decoded, derr
        eval: b64Decode(member)
        to: b64Decode
      - opt:
          do:
            - return: nil, derr
          when: derr != nil
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corejwk.InvalidEncoding, errs.WrapParams{},
                			errs.Int("want", want), errs.Int("got", len(decoded)))
          when: len(decoded) != want
      - return: decoded, nil
