apiVersion: design/behaviour/v1
constants:
  - doc: kdfID is the only key-derivation id shipped now; it pins the cost params.
    items:
      - name: kdfID
        type: string
        value: "\"pbkdf2-sha256\""
    name: kdfID
  - doc: aeadID is the only AEAD id shipped now.
    items:
      - name: aeadID
        type: corecrypto.Algorithm
        value: "\"aes-256-gcm\""
    name: aeadID
  - doc: version is the wire grammar version literal.
    items:
      - name: version
        type: string
        value: "\"v=1\""
    name: version
  - doc: magic is the leading envelope tag.
    items:
      - name: magic
        type: string
        value: "\"kenv\""
    name: magic
  - doc: |-
      iterations is the fixed PBKDF2 work factor pinned to kdfID. The envelope
      carries no iterations field, so this constant IS the wire contract: an
      envelope written at any other cost is not a `pbkdf2-sha256` envelope even
      though it frames identically. Test_iterations pins it against a golden
      vector produced at this value.
    items:
      - name: iterations
        type: int
        value: "600000"
    name: iterations
  - doc: saltLen is the salt length in bytes generated per envelope.
    items:
      - name: saltLen
        type: int
        value: "32"
    name: saltLen
  - doc: |-
      fieldCount is the number of segments in a well-formed envelope after
      splitting on "$" (the leading empty segment is included).
    items:
      - name: fieldCount
        type: int
        value: "7"
    name: fieldCount
  - doc: |-
      Field indices into the "$"-split envelope string. The leading empty segment
      is index 0, so the first meaningful field is index 1.
    grouped: true
    items:
      - name: fieldMagic
        type: int
        value: iota + 1
      - name: fieldVer
      - name: fieldKDF
      - name: fieldSalt
      - name: fieldAEAD
      - name: fieldBox
    name: fieldMagic
files:
  - decls: []
    name: doc.go
  - decls:
      - kdfID
      - aeadID
      - version
      - magic
      - iterations
      - saltLen
      - fieldCount
      - fieldMagic
