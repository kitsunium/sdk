      - doc: key is the caller's master key; the per-stream key derives from it + salt.
        name: key
        type: corecrypto.Key
      - doc: src is the wire source the header and sealed chunks are read from.
        name: src
        type: io.Reader
      - doc: |-
          gcm is the AES-256-GCM mode keyed by the HKDF-derived per-stream key; nil
