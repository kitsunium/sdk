        type: "[chunkSize + gcmTagLen]byte"
      - doc: plain holds verified-but-not-yet-returned plaintext from the current chunk.
        name: plain
        type: "[]byte"
      - doc: counter is the per-chunk nonce counter, incremented after each open.
        name: counter
        type: uint64
      - doc: |-
          peek holds the single look-ahead byte read past a full wire chunk; valid
          only when the statePeeked bit is set.
