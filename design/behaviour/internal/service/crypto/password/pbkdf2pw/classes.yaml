apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: algorithm is the canonical registry key and PHC id segment.
        name: algorithm
        type: corecrypto.Algorithm
        value: "\"pbkdf2-sha256\""
      - doc: saltLen is the random salt length in bytes (128-bit).
        name: saltLen
        type: int
        value: "16"
      - doc: keyLen is the derived digest length in bytes (256-bit).
        name: keyLen
        type: int
        value: "32"
      - doc: currentIters is the present iteration policy (OWASP 2023 for PBKDF2-SHA256).
        name: currentIters
        type: int
        value: "600_000"
      - doc: |-
          maxIters caps the PHC-supplied iteration count accepted on Verify so a
          hostile or corrupt stored hash cannot force unbounded CPU work. It sits
          far above currentIters to leave ratchet headroom, yet stays bounded.
        name: maxIters
        type: int
        value: "100_000_000"
      - doc: phcFields is the number of `$`-delimited fields in a well-formed hash.
        name: phcFields
        type: int
        value: "5"
      - doc: |-
          fieldID indexes the scheme id after a split on "$" (index 0 is the empty
          prefix before the first "$").
        name: fieldID
        type: int
        value: "1"
      - doc: fieldCost indexes the "i=<n>" iteration-count field.
        name: fieldCost
        type: int
        value: "2"
      - doc: fieldSalt indexes the base64 salt field.
        name: fieldSalt
        type: int
        value: "3"
      - doc: fieldDigest indexes the base64 digest field.
        name: fieldDigest
        type: int
        value: "4"
    name: algorithm
