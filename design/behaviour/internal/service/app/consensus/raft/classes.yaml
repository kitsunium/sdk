          quorumActive reports whether a majority of the voters, this node counted,
          was heard within window before now.
        name: quorumActive
        params: now time.Time, window time.Duration
        recv: r *Raft
        results: bool
      - doc: |-
          broadcastHeartbeat opens a confirmation round, keeping the last 64, and
          sends it to every peer with a commit clamped to the peer's match, so a
          heartbeat never commits an entry the peer may not hold.
        name: broadcastHeartbeat
        params: now time.Time
        recv: r *Raft
      - doc: |-
          peers returns the other members with a progress, in configuration order,
          so that a run stays a pure function of its inputs (D15): a map's order is
          not.
        name: peers
        recv: r *Raft
        results: "[]core.NodeID"
      - doc: broadcastAppend feeds every peer, in configuration order.
        name: broadcastAppend
        params: sendIfEmpty bool
        recv: r *Raft
      - doc: |-
          sendAppend feeds one peer what it lacks: entries when the log holds them,
          a fetch when their payloads were evicted, a snapshot when the log no
          longer reaches back to the peer. A paused peer gets nothing.
        name: sendAppend
        params: to core.NodeID, sendIfEmpty bool
        recv: r *Raft
      - name: Fetched
        params: to core.NodeID, lo uint64, ents []core.EntryValue, compacted bool
        recv: r *Raft
      - doc: |-
          fetchedMatch reports whether ents are the entries from lo on, one per
          index, at the terms the log still holds: a read that raced a truncation
          is not sent.
        name: fetchedMatch
        params: lo uint64, ents []core.EntryValue
        recv: r *Raft
        results: bool
      - doc: |-
          sendEntries sends one append after prev and accounts for it: a replicating
          peer's window grows by it, a probing peer pauses until it answers.
        name: sendEntries
        params: pr *progress, to core.NodeID, prev, prevTerm uint64, ents []core.EntryValue
        recv: r *Raft
      - doc: |-
          maybeCommit advances the commit to the highest index a quorum of voters
          matches, if that entry is of the leader's own term; it reports whether the
          commit moved.
        name: maybeCommit
        recv: r *Raft
        results: bool
      - doc: |-
          stepLeader handles a message of the leader's term. Any answer from a
          member counts as contact for CheckQuorum, the lease and promotion.
        name: stepLeader
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          handleHeartbeatResp acknowledges every round up to the one answered,
          recording the contract generation the peer applied, follows a silent
          peer's report, and refills a window that a lost append left stalled.
        name: handleHeartbeatResp
        params: pr *progress, m core.MessageValue
        recv: r *Raft
      - doc: |-
          followSilentReport takes the heartbeat answer of a peer that truncated
          acknowledged entries and stays silent (#636). Its match is lowered to the
          durable log the answer reports, as on its refusal of an append: a match
          that still counts the entries the truncation dropped is not counted again.
          A probe then resumes past the commit the answer reports, through which the
          peer holds this leader's log. The peer acknowledges no append while
          silent, so nothing else moves its probe, and it needs this leader's
          commit to vote again: resent the same batch at every heartbeat, it stayed
          silent for as long as this leader led. Neither field ever raises match.
        name: followSilentReport
        params: pr *progress, m core.MessageValue
        recv: r *Raft
      - doc: |-
          probeIfLost probes a peer whose window did not move across two heartbeat
          answers: an append in it was lost, the transport may drop, and a window
          that never refills must not stall (R1-11). A follower that reports
          holding the oldest append in flight may only acknowledge it late, after
          its fdatasync: probing it resent, then refilled, a window it held (#560).
          It has ElectionTimeoutMax for it. Past that, its acknowledgement was lost
          too, by a dropped frame or a restart after the write, and the window,
          full, never moved again. held 0 is a follower that reports nothing.
        name: probeIfLost
        params: pr *progress, held uint64
        recv: r *Raft
      - doc: |-
          ackRounds records from's answer to every round up to round, with the
          contract generation it applied, stored plus one so that 0 stays "no
          answer".
        name: ackRounds
        params: from core.NodeID, round, contract uint64
        recv: r *Raft
      - doc: |-
          handleAppResp moves a peer's progress on an append's answer, commits what
          a quorum now holds, and feeds the peer what it still lacks.
        name: handleAppResp
        params: pr *progress, m core.MessageValue
        recv: r *Raft
      - doc: |-
          ackMoved moves a peer whose match an answer raised through index: out of
          a probe the answer settles, or out of a snapshot it covers, then commits
          what a quorum now holds.
        name: ackMoved
        params: pr *progress, index uint64
        recv: r *Raft
      - doc: |-
          handleAppReject backs a peer off after a refused append: to a snapshot it
          asked for, to the truncation it reports, or to the hint of a rejection
          that still answers an outstanding append; any other rejection is stale and
          ignored.
        name: handleAppReject
        params: pr *progress, m core.MessageValue
        recv: r *Raft
      - name: Propose
        params: now time.Time, es []core.EntryValue
        recv: r *Raft
        results: "[]core.PositionValue, errs.Code"
      - doc: |-
          propose is Propose for entries received from origin: this leader, or
          the member that forwarded them, authenticated by the transport.
        name: propose
        params: now time.Time, es []core.EntryValue, origin core.NodeID
        recv: r *Raft
        results: "[]core.PositionValue, errs.Code"
      - doc: |-
          checkProposed admits one proposed entry that would land at index: a
          command as it is unless the no-space alarm is committed, a no-op or an
          unknown kind never, an engine entry once validateAdmin accepts and
          rewrites it. It returns the target of a transfer the entry asks for.

          While the alarm stands every command is refused NO_SPACE, a forwarded one
          too, and the engine entries — the alarm, its clearing, a membership
          change, a transfer — are still admitted, so the cluster can be repaired
          (D17, R2-29). It used to admit every command (#515).
        name: checkProposed
        params: e *core.EntryValue, index uint64, origin core.NodeID
        recv: r *Raft
        results: core.NodeID, errs.Code
      - doc: |-
          validateAdmin re-validates an engine entry against the leader's own state
          and rewrites a membership change into the whole configuration (D8).

          Once the committed cluster version is 2 it records in the entry the node
          it received the operation from, overwriting whatever the proposer wrote:
          the ORIGIN of D8 is the TLS identity of the forwarding connection, never
          a field the forwarder wrote. Before, the entry is of payload version 0,
          which carries none, so a node of protocol 1 still reads it (#561).
        name: validateAdmin
        params: e *core.EntryValue, index uint64, origin core.NodeID
        recv: r *Raft
        results: core.NodeID, errs.Code
      - doc: |-
          checkAdmin holds an engine entry of kind to the leader's state, rewriting
          admin in place where the entry it replicates differs from the one
          proposed. It returns the transfer target of an EntryTransfer.
        name: checkAdmin
        params: kind core.EntryKind, admin *wire.AdminValue, index uint64
        recv: r *Raft
        results: core.NodeID, errs.Code
      - doc: |-
          checkMembership admits one membership change at a time, only once the
          term's no-op committed, and rewrites it into the whole configuration that
          takes effect at index.
        name: checkMembership
        params: admin *wire.AdminValue, index uint64
        recv: r *Raft
        results: errs.Code
      - doc: |-
          checkTimingContract admits a contract proposed against the current
          generation that can hold: a heartbeat at most a fifth of the minimum
          election timeout, a non-empty randomization range and a drift in [0, 1).
          Admitting it drops the lease at once (D9 d).
        name: checkTimingContract
        params: admin *wire.AdminValue
        recv: r *Raft
        results: errs.Code
      - doc: |-
          checkClusterVersion admits only a raise, proposed against the current
          cluster generation of this log.
        name: checkClusterVersion
        params: admin *wire.AdminValue
        recv: r *Raft
        results: errs.Code
      - doc: |-
          checkAnnounced refuses a raise to v while a member of the latest
          configuration, voter or learner, was not heard in this term announcing
          it: the operation is refused while any member does not speak the version
          (D18). A member of the previous release would stop on the raise, and on
          every format written after it.
        name: checkAnnounced
        params: v uint32
        recv: r *Raft
        results: errs.Code
      - doc: |-
          checkNoSpaceClear admits clearing only the alarm that is raised now, so a
          late clear cannot end a newer alarm.
        name: checkNoSpaceClear
        params: admin *wire.AdminValue
        recv: r *Raft
        results: errs.Code
      - doc: checkTransfer admits a transfer to another voter and returns it.
        name: checkTransfer
        params: admin *wire.AdminValue
        recv: r *Raft
        results: core.NodeID, errs.Code
      - doc: |-
          nextConf computes the configuration a single-server change produces, and
          refuses it on its merits (D8). On a refusal the configuration returned is
          not to be used.
        name: nextConf
        params: admin wire.AdminValue
        recv: r *Raft
        results: core.MembershipValue, errs.Code
      - doc: |-
          addLearner adds the one member admin carries as a learner: a new id with
          a key no member holds, never retired, with a pin, and only while a quorum
          answers so the change can commit.
        name: addLearner
        params: cur *core.MembershipValue, admin *wire.AdminValue
        recv: r *Raft
        results: errs.Code
      - doc: |-
          promote makes the learner at idx a voter, only once it caught up and was
          heard recently, and only if the new voter set still answers by a majority.
        name: promote
        params: cur *core.MembershipValue, target core.NodeID, idx int
        recv: r *Raft
        results: errs.Code
      - doc: |-
          removeMember removes the member at idx, never this leader, and retires
          its id; a voter's removal may not cross MinVoters nor leave a voter set
          without an answering majority.
        name: removeMember
        params: cur *core.MembershipValue, target core.NodeID, idx int
        recv: r *Raft
        results: errs.Code
      - doc: |-
          removalStrands reports whether removing target, which leaves next, may
          strand a voter: only the removal of a member that answers, and that may
          vouch for a voter — a voter, or a member that ever was one.
        name: removalStrands
        params: next *core.MembershipValue, target core.NodeID, wasVoter bool
        recv: r *Raft
        results: bool
      - doc: |-
          neverVoter reports whether id is a learner in every configuration this
          leader retains that lists it, the snapshot base's included. A member is
          promoted, never demoted, so it was a learner in every configuration
          before those as well, and vouched counts it for no voter, whatever
          configuration that voter holds: its removal strands no one. strands
          alone cannot tell, since a voter it already finds stranded stays so, and
          every removal of an answering learner was refused while a founder listed
          before the leader was silent over a compacted log (#614).
        name: neverVoter
        params: id core.NodeID
        recv: r *Raft
        results: bool
      - doc: answering reports whether peer id answered within the vote window.
        name: answering
        params: id core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          strands reports whether next leaves a voter unable to hear this leader
          once it comes back: a voter admits on its own configuration, and when
          every voter it knows has left, no member of it can vouch for this leader
          (#542) and its transport refuses this leader's key. A voter of {A, B, C}
          down while B and C were replaced by D and E came back as a voter of
          {A, D, E} that heard nobody, and after one more failure A and D, two
          running voters of three, never committed again (#603).

          The guard admits no one: it only refuses a removal, of a member that
          answers, which would take away the last voter such a voter knows. A
          member that does not answer cannot vouch for anyone now, and its removal
          is never refused here, so a dead voter can always be removed.
        name: strands
        params: next *core.MembershipValue
        recv: r *Raft
        results: bool
      - doc: |-
          reachedBy reports whether voter v, whatever configuration of its past it
          holds, still knows in next this leader or a voter that would vouch for
          it. A voter this leader heard at a match its log still resolves holds
          that configuration or a later one: every member of next it lists there
          it lists in every later one, since an id is never added back once
          removed. For any other voter every retained configuration that lists it
          is a candidate, and when it was a member before the log's start the
          oldest it may hold is unknown: only this leader listed before it, so
          added before it, is then known to it for sure.
        name: reachedBy
        params: next *core.MembershipValue, v core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          vouchedInRetained reports whether v is vouched for in every retained
          configuration, the snapshot base's included.
        name: vouchedInRetained
        params: next *core.MembershipValue, v core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          updateAddress changes the address of the member at idx to the one admin
          carries, while a majority answers.
        name: updateAddress
        params: cur *core.MembershipValue, admin *wire.AdminValue, idx int
        recv: r *Raft
        results: errs.Code
      - doc: |-
          denyPin withdraws the pin of the member at idx, target: its connections
          are refused once the change commits, while it stays a member. Never this
          leader's own, and only while the voters that answer now, the target left
          out, are a majority: the target is cut from the moment the change commits,
          and the change itself must commit without it. Denying the pin of the one
          live voter of three left the entry needing an acknowledgement the
          transport no longer let through, and the cluster had no quorum until the
          dead voter came back (#530, R2-27).
        name: denyPin
        params: cur *core.MembershipValue, target core.NodeID, idx int
        recv: r *Raft
        results: errs.Code
      - doc: |-
          activeMajority is etcd's strict reconfiguration check: the voters of m
          that answer the leader NOW form a majority of m (R2-27).
        name: activeMajority
        params: m core.MembershipValue
        recv: r *Raft
        results: bool
      - doc: |-
          activeMajorityWithout is activeMajority with silent counted as a voter
          that does not answer, whatever it did last.
        name: activeMajorityWithout
        params: m core.MembershipValue, silent core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          handleForward answers a forward once per submission. A transport that
          resends a batch on a fresh connection can deliver a forward twice (#377);
          proposed twice, its command would be applied twice, the follower having
          taken the first answer and dropped the second (#401). A forward already
          answered, in this term or an earlier one, is answered again with the same
          answer, position or refusal, and nothing is proposed.
        name: handleForward
        params: m core.MessageValue
        recv: r *Raft
      - doc: |-
          answerForward proposes the one entry a follower forwarded and returns its
          position or a refusal. The entry is copied out of the frame first, and a
          body that does not match its checksum is never proposed.
        name: answerForward
        params: m core.MessageValue
        recv: r *Raft
        results: fwdAnswer
      - doc: |-
          admitForward applies to a forwarded command the bounds the driver applies
          to a local one before anything is appended: the entry size, the bytes
          appended and not committed, the apply backpressure (D6, review M2).
        name: admitForward
        params: size int
        recv: r *Raft
        results: errs.Code
      - name: ReadIndex
        params: now time.Time, ctx uint64, noLease bool
        recv: r *Raft
      - doc: |-
          serveLeaseRead answers every pending read at the commit index at once,
          with no round, while the lease holds and the caller allows it; otherwise
          the reads wait for flushReads.
        name: serveLeaseRead
        params: allowLease bool
        recv: r *Raft
      - doc: |-
          flushReads starts ONE round for every read that arrived since the last
          one: a read never rides a round already in flight (D9).
        name: flushReads
        recv: r *Raft
      - doc: |-
          contractWindow is the minimum election timeout of the contract a voter
          applied, the window it refuses votes in; an unknown generation grants no
          lease. It used to count as the shortest contract known: a leader started
          from a snapshot cut after a contract change knows only the newer one,
          and sized the acknowledgements of a follower still on the older, shorter
          contract at the newer window, longer than that follower refused votes
          for (#522).
        name: contractWindow
        params: gen uint64
        recv: r *Raft
        results: time.Duration
      - doc: |-
          confirmRounds settles the latest round a quorum of the current
          configuration acknowledged: it extends the lease from that round's send
          instant, answers every read waiting on it or an earlier one, and forgets
          those rounds.
        name: confirmRounds
        recv: r *Raft
      - doc: |-
          lastConfirmedRound returns the latest round of the current configuration
          a quorum acknowledged, its send instant and the lease it grants; a zero
          id when there is none. A round of an older configuration never counts
          (R2-15).
        name: lastConfirmedRound
        recv: r *Raft
        results: uint64, time.Time, time.Duration
      - doc: |-
          roundAcks counts the voters that acknowledged rd and returns the shortest
          election window among the contracts they applied: the lease a round may
          grant is the one every acknowledging voter honours (D9 d).
        name: roundAcks
        params: rd *round
        recv: r *Raft
        results: int, time.Duration
      - doc: |-
          extendLease moves the lease start to a confirmed round sent later than
          the current one, shortened by the drift budget; a dropped lease stays
          dropped for the term.
        name: extendLease
        params: sentAt time.Time, leaseLen time.Duration
        recv: r *Raft
      - doc: |-
          answerConfirmed answers, in arrival order, every read waiting on a round
          through confirmed, and keeps the others waiting.
        name: answerConfirmed
        params: confirmed uint64
        recv: r *Raft
      - doc: |-
          dropRoundsThrough forgets every round through confirmed, keeping the
          slice's storage.
        name: dropRoundsThrough
        params: confirmed uint64
        recv: r *Raft
      - doc: |-
          answerRead answers a read at index, or refuses it with code: locally in
          Ready.ReadStates, or with a message to the follower that forwarded it.
        name: answerRead
        params: q readReq, index uint64, code errs.Code
        recv: r *Raft
      - name: TransferLeadership
        params: now time.Time, to core.NodeID
        recv: r *Raft
        results: errs.Code
      - doc: |-
          startTransfer starts a transfer to to unless one runs: from now on the
          leader proposes nothing and holds no lease, catches the target up, and
          sends TimeoutNow once it holds the whole log.
        name: startTransfer
        params: to core.NodeID
        recv: r *Raft
      - doc: |-
          maybeSendTimeoutNow sends TimeoutNow only once every proposed entry is
          committed and the target holds them all (D8, from raft-sql-poc).
        name: maybeSendTimeoutNow
        recv: r *Raft
      - name: CheckOffer
        params: from core.NodeID, o core.InstallOfferValue, needTable bool
        recv: r *Raft
        results: errs.Code
      - name: InstallSnapshot
        params: meta core.SnapshotMetaValue
        recv: r *Raft
      - doc: |-
          ignoresInstall reports whether an install at idx must leave the log as it
          is. One below the base never moves it back: CheckOffer refuses it.

          The offer was checked fresh before its body streamed and the machine
          restored it, which takes seconds on a large state. Meanwhile this node
          may have been elected, or committed past the snapshot through a new
          leader's appends: its log and its engine state then hold everything the
          snapshot holds, and the effects of the engine entries committed past it
          besides. Moving onto the snapshot would roll that engine state back, and
          a later cut would carry the regression to the other nodes (#416). A node
          with no table still installs (installEngine replays those effects).
        name: ignoresInstall
        params: idx uint64
        recv: r *Raft
        results: bool
      - doc: |-
          installEngine replaces the engine's own replicated state with the
          snapshot's, then applies again the effects of the entries this node holds
          committed past it, which only a node with no table can (#416).
        name: installEngine
        params: meta *core.SnapshotMetaValue
        recv: r *Raft
      - doc: |-
          restartLogAt discards the whole log, whose boundary entry does not match
          the snapshot at (idx, t), and restarts it empty on that snapshot: the
          entries dropped are truncated in the Ready and the store compacted to idx.
        name: restartLogAt
        params: idx, t uint64, chainTip uint32
        recv: r *Raft
      - doc: |-
          dropConfsThrough forgets every configuration appended at or before index,
          which the snapshot base now carries, keeping the slice's storage.
        name: dropConfsThrough
        params: index uint64
        recv: r *Raft
      - doc: |-
          stepLeaderRecord runs the admission of a stale voter (ADR 0152 D4, #542)
          before anything else reads m, and reports whether m was consumed.

          A voter that was down while a member was admitted, promoted and handed
          the leadership comes back with a configuration that does not list it:
          its transport cut that leader's appends, the members it knows were
          followers and sent it nothing, and it stayed pre-candidate for as long as
          that leader led. A follower that hears its PreVote while it follows a
          live leader now answers with that leader's record, and the voter admits
          it for replication only.

          A MsgLeaderRecord is consumed here and moves no term. A message from a
          member admitted only by such a record is consumed, dropped, unless it is
          an append or a heartbeat: the record vouches for replication, never for a
          vote, a transfer, a read or a forward.
        name: stepLeaderRecord
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          sendLeaderRecord answers a PreVote from a member that campaigns behind
          this node's commit, while this node follows a live leader, with that
          leader's record read from the committed configuration. Only once the
          cluster version is 2: a node of protocol 1 does not know the kind.
        name: sendLeaderRecord
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          takeLeaderRecord admits the leader a member vouched for, provisionally:
          only while this node knows no live leader, from a member of its own
          configuration, at a term at least its own, for a key that is pinned and
          an ID this node neither knows as a member nor retired. The transport
          still checks at the handshake that the key is the cluster CA's.
        name: takeLeaderRecord
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          mayTakeRecord reports whether this node takes a record now: it knows no
          live leader and does not lead, and the record comes from a member of its
          configuration at a term at least its own.
        name: mayTakeRecord
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          hearsLeader reports whether this node heard its leader within the
          minimum election timeout.
        name: hearsLeader
        params: now time.Time
        recv: r *Raft
        results: bool
      - doc: |-
          knows reports whether id is a member or a retired ID of the latest or the
          committed configuration: a record never replaces what this node's own
          log says of it.
        name: knows
        params: id core.NodeID
        recv: r *Raft
        results: bool
      - doc: hintedOnly reports whether id is admitted by a leader record alone.
        name: hintedOnly
        params: id core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          endHintOnConf ends the provisional admission once a configuration of
          this node lists the vouched-for leader, which admits it as any member, or
          retires it.
        name: endHintOnConf
        recv: r *Raft
      - doc: |-
          extendHint pushes the end of the provisional admission to its delay past
          now, on an append or a heartbeat of the vouched-for leader that this node
          took as contact at its own term (#618). The delay bounds a leader that is
          no longer heard. Counted from the record alone, it ended the admission
          while the leader's heartbeats still arrived: the transport cut every
          connection of the leader's key, the snapshot stream that would list it
          among them, and a node that hears its leader sends no PreVote that could
          bring a new record, so a voter whose install streamed longer than the
          delay was cut at every window and never caught up under writes. A record
          that already ended is never revived.
        name: extendHint
        params: now time.Time, from core.NodeID
        recv: r *Raft
      - doc: |-
          endHintOnTimeout ends the provisional admission once its delay passed
          after the record or the leader's last contact, with no configuration of
          this node listing the leader.
        name: endHintOnTimeout
        params: now time.Time
        recv: r *Raft
      - doc: |-
          mutated reports whether a test switched mutation m on; it is false in every
          build of the engine, whose Config cannot set the field.
        name: mutated
        params: m mutation
        recv: r *Raft
        results: bool
      - name: SetOverloaded
        params: on bool
        recv: r *Raft
      - name: Tick
        params: now time.Time
        recv: r *Raft
      - doc: |-
          outsideVoteWindow reports whether this node may campaign at now: never
          inside the window it refuses votes in after a leader's contact or its own
          start. A candidacy is a vote for itself, and the window is what a lease
          granted on this node's acknowledgement relies on: a node restarted on an
          older, shorter contract than the one present in its log campaigned on
          that contract's timeout, inside the lease it had acknowledged (#521).
          TimeoutNow does not come here: the leader that sends it dropped its lease.
        name: outsideVoteWindow
        params: now time.Time
        recv: r *Raft
        results: bool
      - name: StorageDone
        params: seq, index, term uint64
        recv: r *Raft
      - doc: |-
          noteSelfVote counts this candidate's own vote once the write seq that
          carries it is durable (D5b), and tallies the campaign then.
        name: noteSelfVote
        params: seq uint64
        recv: r *Raft
      - name: ReportUnreachable
        params: id core.NodeID
        recv: r *Raft
      - name: SnapshotDone
        params: to core.NodeID, index uint64, ok bool
        recv: r *Raft
      - name: Compact
        params: index uint64
        recv: r *Raft
      - name: NoTable
        recv: r *Raft
        results: bool
      - name: SetCanVote
        params: v bool
        recv: r *Raft
      - name: SnapshotIndex
        recv: r *Raft
        results: uint64
      - name: Entry
        params: i uint64
        recv: r *Raft
        results: core.EntryValue, bool
      - name: ConfAt
        params: i uint64
        recv: r *Raft
        results: core.MembershipValue
      - name: ChainAt
        params: i uint64
        recv: r *Raft
        results: uint32
      - name: EngineAt
        params: i uint64
        recv: r *Raft
        results: EngineValue
      - name: TermAt
        params: i uint64
        recv: r *Raft
        results: uint64, bool
      - name: Status
        recv: r *Raft
        results: StatusValue
      - name: Progress
        params: id core.NodeID
        recv: r *Raft
        results: match uint64, lastHeard time.Time, ok bool
      - name: LeaseValid
        params: now time.Time
        recv: r *Raft
        results: bool
      - name: DropLease
        recv: r *Raft
      - name: HasReady
        recv: r *Raft
        results: bool
      - name: Ready
        recv: r *Raft
        results: ReadyValue
      - doc: |-
          numberWrite gives a Ready that asks the storage actor for anything the
          next write sequence number, and remembers it as the write carrying a
          candidate's own vote when this one persists that vote (D5b).
        name: numberWrite
        params: rd *ReadyValue, hsChanged bool
        recv: r *Raft
      - doc: |-
          conf is the latest appended configuration, which governs this node from
          the moment it is appended (D8).
        name: conf
        recv: r *Raft
        results: "*core.MembershipValue"
      - doc: |-
          confAt is the configuration in force at index i: the latest appended at
          or before it, else the snapshot base's.
        name: confAt
        params: i uint64
        recv: r *Raft
        results: "*core.MembershipValue"
      - doc: isVoter reports whether id votes in the current configuration.
        name: isVoter
        params: id core.NodeID
        recv: r *Raft
        results: bool
      - doc: voters lists the current configuration's voters, in its order.
        name: voters
        recv: r *Raft
        results: "[]core.NodeID"
      - doc: quorum is the size of a majority of the current voters.
        name: quorum
        recv: r *Raft
        results: int
      - doc: |-
          promotable reports whether this node may campaign: a voter of the current
          configuration, whose directory may vote, and which is not silent. A
          candidacy is a vote for itself, and the silence grants none: a silent node
          that campaigned was elected with one other grant once the leader was down,
          and overwrote the acknowledged entries it had truncated (#524, R5-13).
          Both the election timer and TimeoutNow go through here.
        name: promotable
        recv: r *Raft
        results: bool
      - doc: |-
          randomTimeout draws an election timeout in [min, max) from the seeded
          generator, one draw per call, so a run replays from its seed (D15).
        name: randomTimeout
        recv: r *Raft
        results: time.Duration
      - doc: resetElection arms the election timer at a fresh random timeout from now.
        name: resetElection
        params: now time.Time
        recv: r *Raft
      - doc: |-
          admitted is the transport's admission set: the union of the latest
          appended configuration and the latest committed one (D4). A member both
          name keeps the committed pin while the appended one withdrew it: a
          DenyPin cuts its target when it commits, never while its acknowledgement
          may still be the one the entry needs (#530).
        name: admitted
        recv: r *Raft
        results: "[]core.MemberValue"
      - doc: |-
          send stamps m with this node's identity and term and queues it. An
          acknowledgement or a vote waits in AfterSync for the write it vouches for
          (D5b), and a silent node sends no positive acknowledgement at all.
        name: send
        params: m core.MessageValue
        recv: r *Raft
      - doc: |-
          waitsForSync reports whether a message of kind vouches for durable state,
          an append's acknowledgement or a granted vote, and so leaves only after
          the write (D5b).
        name: waitsForSync
        params: kind core.MessageKind
        recv: r *Raft
        results: bool
      - doc: |-
          noteAppended records what an appended entry changes at append time: a
          membership takes effect when appended (D8), and every contract present
          widens the vote-refusal window (R3-07).
        name: noteAppended
        params: e *core.EntryValue
        recv: r *Raft
      - doc: |-
          confChanged follows a change of the latest configuration: the admission
          set is republished, a leader tracks exactly the new members, and a
          follower or learner takes the role the new configuration gives it.
        name: confChanged
        recv: r *Raft
      - doc: |-
          trackMembers gives every new member a progress, drops the progress of
          every removed one, and restarts every read round (R2-15).
        name: trackMembers
        recv: r *Raft
      - doc: truncateFrom removes entries from i on and rolls the configuration back.
        name: truncateFrom
        params: i uint64
        recv: r *Raft
      - doc: |-
          appendEntries appends es to the log and to the Ready's write, noting what
          each changes at append time.
        name: appendEntries
        params: es []core.EntryValue
        recv: r *Raft
      - doc: |-
          applyCommitEffects applies the engine's own replicated state of the
          entries newly committed in [lo, hi]. It stops at the first entry this
          version cannot apply, leaving the ones after it untouched.
        name: applyCommitEffects
        params: lo, hi uint64
        recv: r *Raft
      - doc: |-
          applyCommitEffect applies the committed entry e at index i to the
          engine's own replicated state. An engine entry whose payload does not
          parse changes nothing, whatever its kind. It reports whether the walk
          must stop because the entry is one this version cannot apply.
        name: applyCommitEffect
        params: i uint64, e *core.EntryValue
        recv: r *Raft
        results: bool
      - doc: engine is the engine state as it stands.
        name: engine
        recv: r *Raft
        results: EngineValue
      - doc: |-
          noteEngine records the engine state the committed entry at i left, when
          it changed it: EngineAt answers a past index from these records. Only an
          engine entry changes it, so there are as many records as such entries
          above the base.
        name: noteEngine
        params: i uint64
        recv: r *Raft
      - doc: |-
          compactEngines folds the records through index into the base: the log
          forgets those entries, and no snapshot is cut below its base.
        name: compactEngines
        params: index uint64
        recv: r *Raft
      - doc: |-
          resetEngines makes the state as it stands the base, with no record: an
          install replaced the state with the snapshot's.
        name: resetEngines
        recv: r *Raft
      - doc: |-
          foundingContractOf is foundingContract as this node reads it: as written,
          with no completion, under the test mutation that reintroduces #523.
        name: foundingContractOf
        params: admin *wire.AdminValue
        recv: r *Raft
        results: core.TimingContractSpec, bool
      - doc: |-
          commitFounding makes the founding contract the one in force when its
          entry commits, unless a later generation already is: Bootstrap proposed
          it, and every node runs on it rather than on its own InitialTiming, or
          two nodes started with different values would agree that generation 1
          is in force while timing it differently (#421).
        name: commitFounding
        params: admin *wire.AdminValue
        recv: r *Raft
      - doc: |-
          applyAdmin applies the committed engine entry at index i, of kind, whose
          payload is admin, and reports whether it is one this version cannot
          apply, which stops the walk over the committed entries.
        name: applyAdmin
        params: i uint64, kind core.EntryKind, admin *wire.AdminValue
        recv: r *Raft
        results: bool
      - doc: |-
          commitTimingContract makes a committed contract the current one when it
          was proposed against the current generation, and widens the vote-refusal
          window to it.
        name: commitTimingContract
        params: admin *wire.AdminValue
        recv: r *Raft
      - doc: |-
          commitClusterVersion raises the cluster version a committed entry at
          index i proposed against the current generation, never lowering it. A
          version above ProtocolMax is not applied: it is named in the Ready for the
          driver to stop the node, and true stops the walk there.
        name: commitClusterVersion
        params: i uint64, admin *wire.AdminValue
        recv: r *Raft
        results: bool
      - doc: |-
          speaks is the highest protocol version this node speaks: ProtocolMax,
          unless a test runs it as a node of the previous release.
        name: speaks
        recv: r *Raft
        results: uint32
      - doc: |-
          commitTo advances the commit to i, never back, applying the engine's own
          effects of the entries it covers and republishing the admission set when
          the commit changed it.
        name: commitTo
        params: i uint64
        recv: r *Raft
      - doc: |-
          publishAdmitted hands the driver the admission set when it differs from
          the one last handed. Republished at every commit, it cost every node a
          SetMembership, a resolution of every member's address and an Info line
          per committed entry, though nothing had changed (#531).
        name: publishAdmitted
        recv: r *Raft
      - name: PeerStats
        recv: r *Raft
        results: "[]PeerStatValue"
      - name: FailureTolerance
        params: now time.Time
        recv: r *Raft
        results: int
      - name: QuorumActive
        params: now time.Time
        recv: r *Raft
        results: bool
      - name: ChainRefusal
        recv: r *Raft
        results: core.NodeID, uint64, int
      - name: Step
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          stepTerm reconciles m's term with this node's before anything else reads
          m: a higher term makes it a follower, unless the message is one a higher
          term must not impose; an older term is answered so its sender steps down.
          It reports whether m goes on to be handled at this node's term.
        name: stepTerm
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          stepHigherTerm adopts the higher term m carries, or refuses it; it
          reports whether m goes on to be handled.
        name: stepHigherTerm
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          adoptTerm makes this node a follower at m's higher term, following its
          sender when m comes from a leader. A PreVote, and the granted answer to
          one, carry a prospective term and move nothing.
        name: adoptTerm
        params: m core.MessageValue
        recv: r *Raft
      - doc: |-
          answerOlderTerm tells the sender of an older term's append, heartbeat or
          PreVote of the current term; anything else of an older term is dropped
          unanswered.
        name: answerOlderTerm
        params: m core.MessageValue
        recv: r *Raft
      - doc: |-
          stepAnyRole handles the kinds every role handles the same way: votes,
          forwarded proposals and the answers to this node's own forwards and
          reads. It reports whether it handled m.
        name: stepAnyRole
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          refuseForLiveLeader is D5's vote-side CheckQuorum: a node that heard from
          a live leader within the window, or that just started, refuses a vote of
          a higher term unless the request carries a valid transfer flag. A leader
          refuses too while a majority answers it (R7-19).
        name: refuseForLiveLeader
        params: now time.Time, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          validTransferFlag honours a transfer flag only for one campaign: issued by
          the leader this node knows for the flag's term, for the very next term
          (R7-17, R8-37).
        name: validTransferFlag
        params: m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          upToDate is the election restriction: m's log is at least as recent as
          this node's, by last term and then by last index.
        name: upToDate
        params: m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          handleVote answers a vote or a PreVote of this node's term, after the
          live-leader refusal already passed. Only a real vote is recorded, and its
          grant leaves after the vote is durable (send, D5b).
        name: handleVote
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          mayGrant reports whether this node is free to grant m: it already voted
          for the sender, or it has neither voted nor a leader this term, or m is a
          PreVote for a later term, which binds nothing.
        name: mayGrant
        params: pre bool, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          voteRestricted reports whether the election restriction applies to m: it
          always does, unless a test mutation lifts it.
        name: voteRestricted
        params: pre bool, m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          becomeFollower moves to term, following lead (0 when unknown). The vote
          is forgotten only with a new term, and a deposed leader refuses what it
          still held for its clients.
        name: becomeFollower
        params: term uint64, lead core.NodeID
        recv: r *Raft
      - doc: abortLeadership refuses what the old leader still held for its clients.
        name: abortLeadership
        recv: r *Raft
      - doc: |-
          campaign starts a PreVote round (pre) or an election at the next term.
          A PreVote round moves no term and persists nothing; an election votes for
          itself, which counts once durable (D5b), and carries the transfer flag of
          issuer for issuerTerm when a TimeoutNow started it.
        name: campaign
        params: pre bool, issuer core.NodeID, issuerTerm uint64
        recv: r *Raft
      - doc: |-
          tallyVotes moves a campaign on once a quorum granted; it reports whether
          the role changed.
        name: tallyVotes
        recv: r *Raft
        results: bool
      - doc: |-
          countVotes counts the current voters' answers to the campaign; a voter
          that has not answered counts in neither total.
        name: countVotes
        recv: r *Raft
        results: granted, rejected int
      - doc: |-
          stepCandidate handles a message of the campaign's term: an append or a
          heartbeat means a leader won it, an answer is tallied, a read is refused.
        name: stepCandidate
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          followWinner follows the leader of the campaign's term that m comes
          from, unless this node refused that leader for the term: its campaign is
          how the refusal ends, and the leader's messages do not end it (#508).
        name: followWinner
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          stepFollower handles a message of the leader's term at a follower or a
          learner; an append or a heartbeat is contact with the leader, and extends
          the record of a vouched-for one (#618), unless this node refused that
          leader for the term.
        name: stepFollower
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          followHeartbeat records the leader's contact, commits what the heartbeat
          allows of the entries held, and answers the round.
        name: followHeartbeat
        params: now time.Time, m core.MessageValue
        recv: r *Raft
      - doc: |-
          heldOfTerm is the index a heartbeat answer reports: the last index when
          that entry is of this term, so this node holds the leader's log through
          it (Log Matching), durable or not; 0 otherwise, read as nothing
          reported. The leader tells a slow acknowledgement from a lost append by
          it (#560).
        name: heldOfTerm
        recv: r *Raft
        results: uint64
      - doc: |-
          reportSilence marks the heartbeat answer of a silent node with
          FlagTruncated (#636). RejectHint is the end of its durable log: the
          leader lowers its match to it, as on a refused append, so a match that
          still counts entries the truncation dropped is lowered at the first
          answer, before any append. Commit is its commit, through which it holds
          the leader's log: a leader probing it resumes past that index. A silent
          node acknowledges no append, so the probe never moved and the leader
          resent the batch after the truncation point at every heartbeat; the node,
          which needs the commit of a leader of its own term to vote again, never
          got past that batch. A leader of a release that does not read them
          ignores the flag and both fields on a heartbeat answer.
        name: reportSilence
        params: m *core.MessageValue
        recv: r *Raft
      - doc: |-
          reportedContract is the contract generation a heartbeat answer reports:
          the one the committed entries this node holds durably put in force, the
          one a restart rebuilds. The leader sizes its lease on the window of that
          generation, and the node must refuse votes for at least that long after a
          crash. Reporting the generation applied in memory, before the contract's
          entry or the commit that applied it was durable, let a restarted node
          fall back to the older, shorter window and vote or campaign inside the
          lease it had granted (#521, R3-07).
        name: reportedContract
        recv: r *Raft
        results: uint64
      - doc: |-
          followTimeoutNow starts an election at once, carrying the transfer flag,
          when the leader of this term hands leadership over and this node may
          campaign.
        name: followTimeoutNow
        params: m core.MessageValue
        recv: r *Raft
      - doc: |-
          handleAppend is the follower's side of AppendEntries, with the three rules
          raft-sql-poc learned as safety bugs (D6). It reports whether the append
          was accepted: its prefix matched this log, verified, and was acknowledged.
          A refused or dropped append proves nothing about this log, and only an
          accepted one may end a silence (#636).
        name: handleAppend
        params: m core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          rebaseOnCommit handles an append that starts below the commit. Its
          entries past the commit are still news: it is re-based on the committed
          entry when it carries that entry with our term. A node that acknowledges
          nothing — a silent one — learns the rest of the log no other way. It
          reports false, having answered with the commit, when m cannot be re-based.
        name: rebaseOnCommit
        params: m *core.MessageValue
        recv: r *Raft
        results: bool
      - doc: |-
          dropUnknownKinds cuts m's entries at the first one whose kind this
          version does not know and names it in the Ready: that entry and the ones
          after it are never appended, acknowledged or skipped, the ones before it
          are, and the driver stops the node with VERSION_UNSUPPORTED (review M3).
        name: dropUnknownKinds
        params: m *core.MessageValue
        recv: r *Raft
      - doc: |-
          firstNewEntry skips the entries of m the log already holds at the same
          term and returns the position in m.Entries of the first one it does not,
          -1 when it holds them all, with the chain value before it. ok is false,
          and the append is dropped unanswered, when the entries are not one per
          index after m.Index.
        name: firstNewEntry
        params: m *core.MessageValue
        recv: r *Raft
        results: start int, prevChain uint32, ok bool
      - doc: |-
          appendNew verifies and appends m's entries from start on, truncating a
          conflicting suffix first. It reports false, and the append goes
          unacknowledged, when a body or a chain does not verify or when the
          conflict would truncate a committed entry.
        name: appendNew
        params: m *core.MessageValue, start int, prevChain uint32
        recv: r *Raft
        results: bool
      - doc: |-
          verifyChain checks the body and the chain of m's entries from start on
          before anything is appended: a mismatch refuses the acknowledgement, and
          the leader resends (D4).
        name: verifyChain
        params: m *core.MessageValue, start int, prevChain uint32
        recv: r *Raft
        results: bool
      - doc: |-
          acknowledgeAppend acknowledges the prefix m verified and commits up to
          the leader's commit within it: never past what this append proved
          matches the leader's log.
        name: acknowledgeAppend
        params: m *core.MessageValue
        recv: r *Raft
      - doc: |-
          chainRefused counts a refused append from m's sender at index at and
          answers it with a rejection; after MaxChainRefusals in a row at one
          index, that leader's heartbeats go unanswered for the term (D4, R6-05).
        name: chainRefused
        params: m core.MessageValue, at uint64
        recv: r *Raft
      - doc: |-
          refuses reports whether this node refused the leader from for the rest
          of the current term, after MaxChainRefusals refusals of its chain.
        name: refuses
        params: from core.NodeID
        recv: r *Raft
        results: bool
      - doc: |-
          maybeEndSilence lifts the silence condition, on an append this node
          accepted, once a leader of a term at least the node's own has rewritten
          its log past the truncation point and committed an entry of its current
          term (R3-09), and, when that term is the node's own SilentTerm, once the
          node holds that leader's commit (#636).

          A leader of a later term was elected without this node, which granted no
          vote while silent and named no later term before the damage: every entry
          committed before that term, those this node acknowledged and lost
          included, is in that leader's log before its first entry of its term, so
          committing an entry of that term proves the node holds them all. The
          leader of the node's own term is the one that committed the lost entries
          with this node's acknowledgements, so its first entries past the
          truncation point prove nothing: one batch committed an entry of its term
          while entries the node had acknowledged, and that leader had committed,
          were still missing, the node voted again without them, and one more
          failure of that leader elected a log that lacked them. Holding m.Commit,
          the node holds everything that leader had committed when it sent m, and
          the election restriction then refuses any candidate that lacks it.
        name: maybeEndSilence
        params: m core.MessageValue
        recv: r *Raft
    name: Raft
  - fields:
      - name: Role
        type: core.Role
      - name: Term
        type: uint64
      - name: Lead
        type: core.NodeID
      - name: Commit
        type: uint64
      - name: Last
        type: uint64
      - name: Stable
        type: uint64
      - name: Timing
        type: core.TimingContractSpec
      - name: Cluster
        type: uint32
      - name: ClusterG
        type: uint64
      - name: NoSpace
        type: core.AlarmID
      - name: Conf
        type: core.MembershipValue
      - name: Committed
        type: core.MembershipValue
      - name: Transfer
        type: core.NodeID
    kind: struct
    name: StatusValue
  - fields:
      - name: Timing
        type: core.TimingContractSpec
      - name: Cluster
        type: uint32
      - name: ClusterG
        type: uint64
      - name: NoSpace
        type: core.AlarmID
    kind: struct
    name: EngineValue
  - doc: engineAt is the engine state the committed entry at index left.
    fields:
      - name: index
        type: uint64
      - name: v
        type: EngineValue
    kind: struct
    name: engineAt
