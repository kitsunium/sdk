# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The refusals the step function returns, short names for the domain's codes:
      it answers with a code rather than an error, so a refusal costs no
      allocation on the event loop.
    grouped: true
    items:
      - doc: |-
          maxFwdAnswers bounds the answers a node keeps of the forwards it
          received. A duplicate is a frame a transport resent with
          its batch on a fresh connection, right behind its original (#377,
          #401): the newest answers are the ones kept, the oldest go first.
        name: maxFwdAnswers
        type: int
        value: "4096"
      - doc: codeNotLeader refuses what only the leader of this term may do.
        name: codeNotLeader
        type: errs.Code
        value: core.CodeNotLeader
      - doc: |-
          codeChangePending refuses a membership change while another is not
          yet committed, or before the term's no-op is.
        name: codeChangePending
        type: errs.Code
        value: core.CodeMembershipChangePending
      - doc: |-
          codeMembershipInvalid refuses a change, a transfer or a target the
          current configuration does not allow.
        name: codeMembershipInvalid
        type: errs.Code
        value: core.CodeMembershipInvalid
      - doc: codeRetired refuses a node id a Remove retired for good.
        name: codeRetired
        type: errs.Code
        value: core.CodeNodeIDRetired
      - doc: |-
          codePrecondition refuses an admin operation whose expected state is
          not the current one.
        name: codePrecondition
        type: errs.Code
        value: core.CodeAdminPreconditionFailed
      - doc: codeTransferFailed ends a transfer that did not complete in time.
        name: codeTransferFailed
        type: errs.Code
        value: core.CodeTransferFailed
      - doc: codeVersion refuses an entry kind or a payload this node cannot read.
        name: codeVersion
        type: errs.Code
        value: core.CodeVersionUnsupported
      - doc: codeMisconfigured refuses a timing contract that cannot hold.
        name: codeMisconfigured
        type: errs.Code
        value: core.CodeConsensusMisconfigured
    name: maxFwdAnswers
  - doc: |-
      hintElectionTimeouts is how many maximum election timeouts a vouched-for
      leader stays admitted after its record or its last contact, with no
      configuration of this node listing it.
    items:
      - name: hintElectionTimeouts
        type: time.Duration
        value: "4"
    name: hintElectionTimeouts
  - grouped: true
    items:
      - doc: |-
          mutAckBeforeSync acknowledges an append before its sync (raft-sql-poc's
          unsafeAckBeforeSync).
        name: mutAckBeforeSync
        type: mutation
        value: 1 << iota
      - doc: mutSameTermVoteClear forgets the vote when stepping down in one term.
        name: mutSameTermVoteClear
      - doc: |-
          mutCommitBeyondVerified advances a follower's commit past the prefix
          the append verified.
        name: mutCommitBeyondVerified
      - doc: mutAckLastIndex acknowledges lastIndex instead of the verified prefix.
        name: mutAckLastIndex
      - doc: |-
          mutCommitOldTermByCount commits an older term's entry by counting
          replicas (Figure 8).
        name: mutCommitOldTermByCount
      - doc: mutNoRestrictionVote drops the election restriction from RequestVote.
        name: mutNoRestrictionVote
      - doc: mutNoRestrictionPreVote drops it from PreVote.
        name: mutNoRestrictionPreVote
      - doc: mutTransferAnyTerm honours a transfer flag at any term.
        name: mutTransferAnyTerm
      - doc: mutHeartbeatUnclamped sends the raw leader commit in a heartbeat.
        name: mutHeartbeatUnclamped
      - doc: mutNoRestartRefusal votes at once after a restart.
        name: mutNoRestartRefusal
      - doc: mutTimeoutNowAnyTerm accepts TimeoutNow without the term check.
        name: mutTimeoutNowAnyTerm
      - doc: mutStaleCompletion counts a storage completion a truncation superseded.
        name: mutStaleCompletion
      - doc: mutLeaseAfterTransfer keeps the lease after a transfer attempt.
        name: mutLeaseAfterTransfer
      - doc: |-
          mutMembershipBeforeNoOp accepts a membership change before the term's
          no-op commits.
        name: mutMembershipBeforeNoOp
      - doc: |-
          mutLiveLeaderPreVoteOnly applies the live-leader refusal in PreVote
          only.
        name: mutLiveLeaderPreVoteOnly
      - doc: |-
          mutRestrictionUnderTransfer skips the election restriction under the
          transfer flag.
        name: mutRestrictionUnderTransfer
      - doc: |-
          mutLeaseLeaderView computes the lease from the leader's own contract,
          not the minimum over the acknowledging majority.
        name: mutLeaseLeaderView
      - doc: |-
          mutReadNoRound answers a ReadIndex at once, with no confirmation
          round: the read a deposed leader serves stale.
        name: mutReadNoRound
      - doc: |-
          mutSnapshotAckLastIndex acknowledges a snapshot install at lastIndex,
          over a kept suffix nothing verified.
        name: mutSnapshotAckLastIndex
      - doc: |-
          mutInstallBelowBase lets a node with no table install a snapshot
          below its log's base.
        name: mutInstallBelowBase
      - doc: mutChainSkip appends an entry whose chain value does not match.
        name: mutChainSkip
      - doc: |-
          mutForwardNoDedupe proposes a forward each time it is delivered, the
          duplicate a transport resent included (#401).
        name: mutForwardNoDedupe
      - doc: |-
          mutSilentCampaigns lets a silent node campaign, on its election timer
          or a TimeoutNow (#524).
        name: mutSilentCampaigns
      - doc: |-
          mutKeptAppended appends the entries Recover kept to a peer instead
          of sending a snapshot (#507).
        name: mutKeptAppended
      - doc: |-
          mutNoSpaceAdmits admits a command while the no-space alarm is
          committed (#515).
        name: mutNoSpaceAdmits
      - doc: |-
          mutRefusedLeadHeard keeps answering, and taking as contact, the
          appends and heartbeats of a leader the node refused for the term
          after MaxChainRefusals chain refusals (#508).
        name: mutRefusedLeadHeard
      - doc: |-
          mutDenyPinUnchecked admits a DenyPin of this leader, or one that
          leaves no answering majority without its target (#530).
        name: mutDenyPinUnchecked
      - doc: |-
          mutDenyPinAtAppend withdraws a denied pin from the admission set at
          append instead of at commit (#530).
        name: mutDenyPinAtAppend
      - doc: |-
          mutReportUnsyncedContract reports in a heartbeat answer the contract
          generation applied in memory, durable or not (#521).
        name: mutReportUnsyncedContract
      - doc: |-
          mutCampaignInVoteWindow lets the election timer campaign inside the
          node's own vote-refusal window (#521).
        name: mutCampaignInVoteWindow
      - doc: |-
          mutUnknownGenShortestKnown sizes an acknowledgement of a contract
          generation the leader does not know as the shortest one it knows
          (#522).
        name: mutUnknownGenShortestKnown
      - doc: |-
          mutOwnTimingKept keeps the node's own InitialTiming as a known
          contract after a snapshot named the cluster's (#522).
        name: mutOwnTimingKept
      - doc: |-
          mutLeaseWithoutDrift grants a lease under a contract whose drift
          budget is not in (0, 1) (#523).
        name: mutLeaseWithoutDrift
      - doc: |-
          mutFoundingAsWritten runs the founding contract as written, its
          maximum and drift not completed (#523).
        name: mutFoundingAsWritten
      - doc: |-
          mutReadRespAnyPeer takes a read's answer from any peer of the term,
          not only from the leader this node asked (#510).
        name: mutReadRespAnyPeer
      - doc: |-
          mutMembershipEveryCommit hands the driver the admission set at every
          commit, changed or not (#531).
        name: mutMembershipEveryCommit
      - doc: |-
          mutMatchPastLastIndex takes an acknowledgement past the leader's last
          index as the follower's match (#546).
        name: mutMatchPastLastIndex
      - doc: |-
          mutRaiseUnannounced raises the cluster version while a member does not
          announce it (D18, lot S3).
        name: mutRaiseUnannounced
      - doc: |-
          mutOriginAsWritten keeps the admin payload the proposer wrote, with
          no origin the leader authenticated (#561).
        name: mutOriginAsWritten
      - doc: |-
          mutHintAnyKind accepts every kind of message from a leader admitted
          by a leader record alone, a vote included (#542).
        name: mutHintAnyKind
      - doc: |-
          mutRemoveStrands removes an answering member even when a voter may
          then know no one left to vouch for this leader (#603).
        name: mutRemoveStrands
      - doc: |-
          mutHintEndsWhileHeard ends a leader record its delay after it was
          taken, while the vouched-for leader is still heard (#618).
        name: mutHintEndsWhileHeard
      - doc: |-
          mutSilenceEndsBeforeTheLeadersCommit ends the silence under the
          leader of the node's own SilentTerm before the node holds that
          leader's commit (#636).
        name: mutSilenceEndsBeforeTheLeadersCommit
      - doc: |-
          mutSilenceEndsOnARefusal ends the silence on an append the node
          refused (#636).
        name: mutSilenceEndsOnARefusal
      - doc: |-
          mutSilenceIndexUnderTheSnapshot keeps a SilentIndex the node's own
          snapshot covers at start, so that snapshot's commit ends the silence
          (#636).
        name: mutSilenceIndexUnderTheSnapshot
      - doc: |-
          mutSilentReportIgnored ignores the report a silent node's heartbeat
          answer carries: a stale match is not lowered and the probe never
          moves past the first batch (#636).
        name: mutSilentReportIgnored
    name: mutAckBeforeSync
  - doc: The facts a PeerStatValue carries.
    grouped: true
    items:
      - doc: StatVoter is set for a voter, clear for a learner.
        name: StatVoter
        type: PeerStatFlags
        value: 1 << iota
      - doc: |-
          StatHeard is set once the peer answered in this term; LastHeard is
          meaningful only then.
        name: StatHeard
      - doc: StatProbing is set while the leader probes for the peer's match.
        name: StatProbing
      - doc: StatSnapshot is set while a snapshot is being sent to the peer.
        name: StatSnapshot
    name: StatVoter
  - doc: The facts a progress holds, one bit each in peerFacts.
    grouped: true
    items:
      - doc: |-
          peerProbeSent pauses a probing peer until it answers or a heartbeat
          passes.
        name: peerProbeSent
        type: peerFacts
        value: 1 << iota
      - doc: peerHeard is clear until the peer answered once in this term.
        name: peerHeard
      - doc: |-
          peerFetching pauses the peer while the driver reads entries the step
          function evicted.
        name: peerFetching
      - doc: |-
          peerProtocol2 is set while the peer's last message of the term
          carried FlagProtocol2.
        name: peerProtocol2
    name: peerProbeSent
  - grouped: true
    items:
      - doc: stateProbe sends one append at a time until the peer's log matches.
        name: stateProbe
        type: progressState
        value: iota
      - doc: stateReplicate pipelines appends up to the inflight window.
        name: stateReplicate
      - doc: stateSnapshot waits for a snapshot transfer to end.
        name: stateSnapshot
    name: stateProbe
  - doc: |-
      The facts a Raft holds, one bit each in raftFacts: set with |=, cleared
      with &^= and read with &, plain operators that keep the step function's
      small methods within the inliner's budget.
    grouped: true
    items:
      - doc: |-
          raftSelfVoteDurable is set once the write that carries this
          candidate's own vote is durable: its vote counts from then on (D5b).
        name: raftSelfVoteDurable
        type: raftFacts
        value: 1 << iota
      - doc: raftTransferSent is set once TimeoutNow left for the transfer target.
        name: raftTransferSent
      - doc: |-
          raftLeaseDropped is set when the lease must not be served until a new
          round confirms leadership (D9).
        name: raftLeaseDropped
      - doc: |-
          raftOverloaded is the driver's apply backpressure, set each turn: a
          forwarded command is refused while it holds, as a local one is.
        name: raftOverloaded
    name: raftSelfVoteDurable
  - doc: |-
      ProtocolMax is the highest protocol version this engine speaks: a cluster
      version above it is refused, and stops a node that finds it committed.
      Version 2 adds the snapshot metadata's checksum, the admin payload's
      Origin and the log identity's AdoptedFrom, each written only once the
      committed cluster version is 2 (lot S3).
    items:
      - name: ProtocolMax
        type: uint32
        value: "2"
    name: ProtocolMax
  - doc: |-
      Protocol2 is the protocol version whose formats a node writes once the
      cluster version is raised to it.
    items:
      - name: Protocol2
        type: uint32
        value: "2"
    name: Protocol2
