          slice returns the entries in [lo, hi), at least one, at most maxBytes,
          as a copy: a message queued over them is serialised after Ready, whose
          eviction blanks the log's own entries in place (#422).
        name: slice
        params: lo, hi uint64, maxBytes int
        recv: l *memLog
        results: "[]core.EntryValue"
      - doc: resident sums the payload bytes held for (from, to].
        name: resident
        params: from, to uint64
        recv: l *memLog
        results: int64
      - doc: |-
          evict drops payloads, oldest first, while the window is above limit,
          never above through: only applied and durable entries are dropped, so
          Apply never needs the disk and a lagging peer is fed by a fetch.
        name: evict
        params: limit int64, through uint64
        recv: l *memLog
      - doc: truncateFrom drops every entry from index i on.
        name: truncateFrom
        params: i uint64
        recv: l *memLog
      - doc: compactTo forgets the entries through i, which a snapshot now covers.
        name: compactTo
        params: i, t uint64, chain uint32
        recv: l *memLog
    name: memLog
