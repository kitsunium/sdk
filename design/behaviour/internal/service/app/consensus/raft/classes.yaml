functions:
  - doc: |-
      listedBefore reports whether first comes before then in next's members,
      the order members were added in.
    name: listedBefore
    params: next *core.MembershipValue, first, then core.NodeID
    results: bool
  - doc: |-
      vouched reports whether a voter v holding known still finds in next the
      leader, as any member, or another voter of known, which answers its
      PreVote with the leader's record (#542). A known that does not list v is
      not one v holds, and is passed.
    name: vouched
    params: next, known *core.MembershipValue, v, leader core.NodeID
    results: bool
  - doc: |-
      ownCopy returns a copy of b the step function owns, out of a frame the
      transport reuses. An empty b yields nil, exactly as the append([]byte(nil),
      b...) it replaces did, so a copied entry compares equal to its original.
    name: ownCopy
    params: b []byte
    results: "[]byte"
  - doc: |-
      recordOf reads the one member record a MsgLeaderRecord carries, refused
      when the entry's body does not match its checksum, when it is not one
      record, or when the record has no ID or no pinned key.
    name: recordOf
    params: m *core.MessageValue
    results: core.MemberValue, bool
  - doc: statFlag is x when on, else nothing.
    name: statFlag
    params: x PeerStatFlags, on bool
    results: PeerStatFlags
  - name: NewRaft
    params: cfg *Config, st *StartState
    results: "*Raft"
  - doc: |-
      actsAtCommit reports whether an entry of kind changes the engine's own
      replicated state when it commits. A membership does only when it is the
      founding one, which carries the generation 1 contract (#421).
    name: actsAtCommit
    params: kind core.EntryKind
    results: bool
  - doc: |-
      foundingContract is the generation 1 contract a founding membership
      entry carries; ok is false for any other membership, and for a founding
      entry with no contract.

      Bootstrap writes the contract NewNode validates, every field set. One
      written before it did may lack its maximum or carry a drift outside
      [0, 1): it is completed here, the same way on every node since it is a
      function of the entry alone, with a maximum of twice the minimum and no
      drift, which holds no lease. Run as written, a maximum of 0 refused every
      promotion and drew every election timeout at exactly the minimum (#523).
    name: foundingContract
    params: admin *wire.AdminValue
    results: core.TimingContractSpec, bool
  - doc: |-
      adoptsTiming reports whether a snapshot's contract c replaces the one in
      force, cur: at a higher generation, and at the same one too, which is the
      same contract by determinism unless cur is still a node's own
      InitialTiming (#421). A snapshot with no contract replaces nothing.
    name: adoptsTiming
    params: c, cur core.TimingContractSpec
    results: bool
