package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/consensus/raft
  name: raft
  purpose: "Package raft is the consensus engine's step function (ADR 0152 D15): a value with no goroutine, no I/O and no clock."
types:
  - doc: |-
      fwdKey names one submission: the follower that forwarded it and its
      submission id, which never repeats across the follower's restarts (R7-23).
      Two frames with one key are one submission delivered twice.
    fields:
      - name: from
        type: core.NodeID
      - name: ctx
        type: uint64
    kind: struct
    name: fwdKey
  - doc: |-
      fwdAnswer is what a forward was answered: the position its entry was
      appended at, or a refusal with its code and the leader hinted.
    fields:
      - name: reject
        type: bool
      - name: code
        type: errs.Code
      - name: hint
        type: uint64
      - name: index
        type: uint64
      - name: logTerm
        type: uint64
    kind: struct
    name: fwdAnswer
  - doc: |-
      fwdTable keeps the answers given to forwards, bounded by maxFwdAnswers,
      the oldest evicted first. It outlives a term: a duplicate that arrives
      after this node changed term, or led again, is still the submission it
      answered, and replaying an old answer is harmless, the follower having
      taken the first one (#401).
    fields:
      - name: byKey
        type: map[fwdKey]fwdAnswer
      - doc: order is a ring of the kept keys, oldest at next once it is full.
        name: order
        type: "[]fwdKey"
      - name: next
        type: int
    kind: struct
    methods:
      - doc: lookup returns the answer kept for k.
        name: lookup
        params: k fwdKey
        recv: a *fwdTable
        results: fwdAnswer, bool
      - doc: remember keeps v for k, evicting the oldest answer when limit are kept.
        name: remember
        params: k fwdKey, v fwdAnswer, limit int
        recv: a *fwdTable
    name: fwdTable
  - doc: |-
      memLog is the step function's view of the log: the snapshot base and every
      entry after it. The driver loads it at start and trims it after each
      compaction, so it holds no more than the store retains (D6).
    fields:
      - name: snapIndex
        type: uint64
      - name: snapTerm
        type: uint64
      - name: snapChain
        type: uint32
      - name: ents
        type: "[]core.EntryValue"
      - name: committed
        type: uint64
      - name: stable
        type: uint64
      - name: applied
