      - doc: |-
          lastIndex is the index of the last entry held, the snapshot base when
          none is.
        name: lastIndex
        recv: l *memLog
        results: uint64
      - doc: |-
          lastTerm is the term of the last entry held, the snapshot's term when
          none is: what the election restriction compares.
        name: lastTerm
        recv: l *memLog
        results: uint64
      - doc: term returns the term at i; ok is false below the snapshot or past the end.
        name: term
        params: i uint64
        recv: l *memLog
