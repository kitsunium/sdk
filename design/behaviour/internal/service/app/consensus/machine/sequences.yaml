      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: origin(coreconsensus.StateMachineFailed, errs.String("why", "the position row is not there"), errs.Int64("rows", n))
              to: origin
          when: n != 1
      - return: nil
  - of: (*SQL).readPosition
    participants:
      - id: caller
        kind: actor
      - id: (*SQL).readPosition
        kind: self
      - id: ex.QueryRowContext(ctx, m.sel).Scan
        kind: value
      - id: clusterOf
        kind: internal
    steps:
      - leaf: a var of several names, or of no type
        stmt: var cluster, pred string
      - var:
          name: v
          type: "[6]int64"
      - set: err
        to: ex.QueryRowContext(ctx, m.sel).Scan
        value: ex.QueryRowContext(ctx, m.sel).Scan(&cluster, &v[0], &pred, &v[1], &v[2], &v[3], &v[4], &v[5])
      - opt:
          do:
            - return: li, pos, false, nil
          when: err == stdsql.ErrNoRows
      - opt:
          do:
            - return: li, pos, false, err
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: li, pos, false, corrupt("the position row holds a negative number")
                when: x < 0
          key: _
          range: v
          value: x
      - opt:
          do:
            - return: li, pos, false, err
          init:
            bind: li.Cluster, err
            eval: clusterOf(cluster)
            op: =
            to: clusterOf
          when: err != nil
      - opt:
          do:
            - return: li, pos, false, err
          init:
            bind: li.Predecessor, err
            eval: clusterOf(pred)
            op: =
            to: clusterOf
          when: err != nil
      - set: li.Epoch, li.PredecessorEpoch, li.KeptIndex, li.AdoptedFrom
        value: uint64(v[0]), uint64(v[1]), uint64(v[2]), uint64(v[3])
      - set: pos
        value: "coreconsensus.PositionValue{Term: uint64(v[4]), Index: uint64(v[5])}"
      - return: li, pos, true, nil
