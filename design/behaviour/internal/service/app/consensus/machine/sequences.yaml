    participants:
      - id: caller
        kind: actor
      - id: clusterOf
        kind: self
      - id: hex
        kind: stdlib
    steps:
      - var:
          name: c
          type: coreconsensus.ClusterID
      - opt:
          do:
            - return: c, corrupt("the position row holds a cluster id that is not 32 hex digits")
          init:
            bind: n, err
            eval: hex.Decode(c[:], []byte(strings.TrimSpace(s)))
