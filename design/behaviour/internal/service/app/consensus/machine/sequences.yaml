    participants:
      - id: caller
        kind: actor
      - id: (*sqlSnapshot).hold
        kind: self
      - id: s.m.cfg.Transactor.Transact
        kind: value
    steps:
      - defer: close(s.done)
      - bind: opened
        eval: "false"
      - bind: opts
        eval: "coresql.TxOptionsValue{Isolation: s.m.snapIso, ReadOnly: true}"
      - bind: err
        eval: |-
          s.m.cfg.Transactor.Transact(context.Background(), opts, func(ctx context.Context, ex coresql.Executor) error {
          		if _, _, _, err := s.m.readPosition(ctx, ex); err != nil {
          			return err
          		}
          		opened = true
          		ready <- nil
          		for {
          			select {
          			case req := <-s.write:
          				req.n, req.err = s.dump(ctx, ex, req.w)
          				req.done <- struct{}{}
          			case <-s.release:
          				return nil
          			}
          		}
          	})
        to: s.m.cfg.Transactor.Transact
      - opt:
          do:
            - send:
                chan: ready
                value: err
          when: "!opened"
  - of: (*sqlSnapshot).dump
    participants:
      - id: caller
        kind: actor
      - id: (*sqlSnapshot).dump
        kind: self
      - id: cw.Write
        kind: internal
    steps:
      - bind: cw
        eval: "&countingWriter{w: w}"
      - opt:
          do:
            - return: cw.n, err
          init:
            bind: _, err
            eval: cw.Write([]byte{sqlSnapshotMagic[0], sqlSnapshotMagic[1], sqlSnapshotMagic[2], sqlSnapshotMagic[3], sqlSnapshotVersion})
            to: cw.Write
          when: err != nil
      - opt:
          do:
            - return: cw.n, failed("dump", err)
          init:
            bind: err
            eval: s.m.cfg.Dump(ctx, ex, cw)
          when: err != nil
      - return: cw.n, nil
  - of: (*sqlSnapshot).WriteTo
    steps:
      - bind: req
        eval: "&writeReq{w: w, done: make(chan struct{}, 1)}"
      - select:
          cases:
            - comm: s.write <- req
            - comm: <-s.done
              do:
                - return: 0, origin(coreconsensus.StateMachineFailed, errs.String("why", "the snapshot was written after its release"))
      - eval: <-req.done
      - return: req.n, req.err
  - of: (*sqlSnapshot).Release
    participants:
      - id: caller
        kind: actor
      - id: (*sqlSnapshot).Release
        kind: self
      - id: s.once.Do
        kind: value
    steps:
      - eval: s.once.Do(func() { close(s.release) })
        to: s.once.Do
      - eval: <-s.done
  - of: (*countingWriter).Write
    participants:
      - id: caller
        kind: actor
      - id: (*countingWriter).Write
        kind: self
      - id: c.w.Write
        kind: value
    steps:
      - bind: n, err
        eval: c.w.Write(p)
        to: c.w.Write
      - op: +=
        set: c.n
        value: int64(n)
      - return: n, err
