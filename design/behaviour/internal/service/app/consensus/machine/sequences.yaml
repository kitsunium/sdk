      - bind: err
        eval: |-
          m.cfg.Transactor.Transact(context.Background(), coresql.TxOptionsValue{}, func(ctx context.Context, ex coresql.Executor) error {
          		for i := range es {
          			r, err := m.cfg.Apply(ctx, ex, es[i])
          			if err != nil {
          				return err
          			}
          			out[i] = r
