# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The operations a KV command carries, its first byte.
    grouped: true
    items:
      - name: kvOpGet
        type: byte
        value: iota + 1
      - name: kvOpPut
      - name: kvOpCAS
    name: kvOpGet
  - doc: kvSnapshotMagic and kvSnapshotVersion open every snapshot a KV writes.
    grouped: true
    items:
      - name: kvSnapshotMagic
        value: "\"KKV\""
      - name: kvSnapshotVersion
        type: byte
        value: "1"
    name: kvSnapshotMagic
  - doc: maxKVField bounds a key or a value read back from a snapshot.
    items:
      - name: maxKVField
        type: uint64
        value: 1 << 30
    name: maxKVField
  - doc: DefaultPositionTable is the table SQLConfig.Table names when it is empty.
    items:
      - name: DefaultPositionTable
        type: string
        value: "\"kit_consensus_applied\""
    name: DefaultPositionTable
  - doc: |-
      maxTableName bounds a position table's name: PostgreSQL's 63 bytes, the
      shortest identifier limit of the three dialects.
    items:
      - name: maxTableName
        type: int
        value: "63"
    name: maxTableName
  - doc: |-
      sqlSnapshotMagic and sqlSnapshotVersion open every snapshot an SQL
      machine writes: four bytes and a format version, then what Dump wrote.
    grouped: true
    items:
      - name: sqlSnapshotMagic
        value: "\"KSQL\""
      - name: sqlSnapshotVersion
        type: byte
        value: "1"
    name: sqlSnapshotMagic
  - doc: |-
      positionColumns are the columns of the position row, in the order every
      statement binds and scans them.
    items:
      - name: positionColumns
        value: "\"cluster, epoch, predecessor, predecessor_epoch, kept_index, adopted_from, applied_term, applied_index\""
    name: positionColumns
files:
  - decls: []
    name: doc.go
  - decls:
      - origin
      - misconfigured
      - failed
      - corrupt
      - unsupported
    name: errors.go
  - decls:
      - kvOpGet
