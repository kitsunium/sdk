      - kvSnap
      - (*KV).Snapshot
      - kvSnap.WriteTo
      - kvSnap.Release
      - (*KV).Restore
      - readEntry
      - readField
    name: kv.go
  - decls:
      - _
    name: machine_compliance.go
  - decls:
      - DefaultPositionTable
      - maxTableName
      - sqlSnapshotMagic
      - positionColumns
      - SQLConfig
      - SQL
      - NewSQL
      - (*SQLConfig).validate
      - (*SQLConfig).validateParts
