      - id: caller
        kind: actor
      - id: (*Packer).failQueued
        kind: self
      - id: p.mu.Lock
        kind: value
      - id: p.mu.Unlock
        kind: value
      - id: origin
        kind: internal
    steps:
      - eval: p.mu.Lock()
        to: p.mu.Lock
      - bind: q
        eval: p.queue
      - set: p.queue
        value: nil
      - eval: p.mu.Unlock()
        to: p.mu.Unlock
      - bind: err
        eval: origin(coreconsensus.NodeStopped, errs.String("packer", "closed"))
        to: origin
      - loop:
          do:
            - send:
                chan: r.done
                value: "outcome{err: err}"
          key: _
          range: q
          value: r
