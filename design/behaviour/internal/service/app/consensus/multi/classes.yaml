# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The packed body's layout: a version byte, then uvarints, each seven bits a
      byte, the high bit set on every byte but the last.
    grouped: true
    items:
      - doc: |-
          bodyVersion is the first byte of every packed body: the version of the
          layout that follows. A body of another version does not parse.
        name: bodyVersion
        type: byte
        value: "1"
      - doc: |-
          bodyHeaderMax is the most a body's header takes: its version byte and
          the uvarint count of its commands.
        name: bodyHeaderMax
        type: int
        value: 1 + binary.MaxVarintLen64
      - doc: |-
          uvarintMore is the bit of a uvarint byte that says another follows: a
          value at or above it needs one byte more.
        name: uvarintMore
        type: uint64
        value: "0x80"
      - doc: uvarintBits is how many bits of the value one uvarint byte carries.
        name: uvarintBits
        type: uint
        value: "7"
    name: bodyVersion
  - doc: The defaults a zero bound of Config clamps to.
    grouped: true
    items:
      - doc: |-
          DefaultMaxCommands is the commands one entry carries when
          Config.MaxCommands is zero.
        name: DefaultMaxCommands
        type: int
        value: "4096"
      - doc: |-
          DefaultMaxBytes is the largest packed body when Config.MaxBytes is zero:
          the engine's default MaxEntryBytes.
        name: DefaultMaxBytes
        type: int
        value: 1 << 20
      - doc: |-
          DefaultMaxInFlight is the packed entries in flight at once when
          Config.MaxInFlight is zero: one, so every command proposed while an
          entry is in flight waits for it and leaves in the next.
        name: DefaultMaxInFlight
        type: int
        value: "1"
    name: DefaultMaxCommands
files:
  - decls:
      - bodyVersion
      - cmdCost
      - uvarintLen
      - appendBody
      - splitBody
      - malformed
      - origin
    name: body.go
  - decls: []
    name: doc.go
  - decls:
      - Machine
      - NewMachine
      - (*Machine).Apply
      - (*Machine).ApplyBatch
      - (*Machine).Snapshot
      - (*Machine).Restore
    name: machine.go
  - decls:
      - _
    name: multi_compliance.go
  - decls:
      - DefaultMaxCommands
      - Config
      - ResultValue
      - request
      - outcome
      - Packer
      - NewPacker
      - startPacker
      - (*Packer).Propose
      - (*Packer).abandon
      - (*Packer).Close
      - (*Packer).loop
      - (*Packer).send
      - (*Packer).take
      - answer
      - (*Packer).failQueued
    name: packer.go
functions:
  - doc: |-
      cmdCost is what cmd adds to a packed body: its uvarint length, then its
      bytes.
    name: cmdCost
    params: cmd []byte
    results: int
  - doc: uvarintLen is the length of v's uvarint encoding.
    name: uvarintLen
    params: v uint64
    results: int
  - doc: |-
      appendBody appends the packed body of cmds to dst: the version, the count
      of commands, then each command as its uvarint length and its bytes.
    name: appendBody
    params: dst []byte, cmds [][]byte
    results: "[]byte"
  - doc: |-
      splitBody appends to dst one entry per command of e's packed body, each a
      copy of e whose Data is the command — a slice of e.Data capped at its end —
      and whose BodySum is the command's own; ChainSum, which chains the log's
      headers, is zero. A body that does not parse is FRAME_INVALID and leaves
      dst as it was.
    name: splitBody
    params: dst []coreconsensus.EntryValue, e *coreconsensus.EntryValue, sum func([]byte) uint32
    results: "[]coreconsensus.EntryValue, error"
  - doc: malformed is the FRAME_INVALID of a packed body, naming what failed.
    name: malformed
    params: what string
    results: error
  - doc: |-
      origin returns sentinel itself with fields: an SDK cause keeps its code,
      reason and texts (origin wins on wrap), and gains the fields.
    name: origin
    params: sentinel *errs.Error, fields ...errs.FieldValue
    results: error
  - name: NewMachine
    params: inner coreconsensus.BatchingStateMachine
    results: "*Machine"
  - name: NewPacker
    params: r coreconsensus.Replicated, cfg Config
    results: "*Packer"
  - doc: |-
      startPacker builds the Packer of NewPacker over cfg, its bounds already
      defaulted, and launches its loop goroutine. The loop runs until Close
      closes stop, then waits for the entries in flight, answers what is still
      queued NODE_STOPPED and closes done, which Close waits for: no goroutine
      of the Packer outlives a Close that returned.
    name: startPacker
    params: r coreconsensus.Replicated, cfg Config
    results: "*Packer"
  - doc: answer hands each request of batch its sub-result of subs, or err.
    name: answer
    params: batch []*request, tok coreconsensus.TokenValue, subs []any, err error
imports:
  binary: encoding/binary
  context: context
  coreconsensus: github.com/kitsunium/sdk/internal/core/app/consensus
  errs: github.com/kitsunium/sdk/internal/kernel/errs
