package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/consensus/multi
  name: multi
  purpose: "Package multi packs many small commands into one consensus entry and splits their results, on top of the Replicated port and with no change to the engine (ADR 0152 D6, D19, #926)."
types:
  - fields:
      - doc: Inner applies the commands.
        name: Inner
        type: coreconsensus.BatchingStateMachine
      - doc: subs is the scratch of split commands, reused from call to call.
        name: subs
        type: "[]coreconsensus.EntryValue"
      - doc: |-
          ends holds, per entry of a batch, the end of its commands in subs, or
          -1 for a body that did not parse.
        name: ends
        type: "[]int"
      - doc: bad holds the FRAME_INVALID of each entry ends marks -1.
        name: bad
        type: "[]error"
    kind: struct
    methods:
      - name: Apply
        params: e coreconsensus.EntryValue
        recv: m *Machine
        results: any
      - name: ApplyBatch
        params: es []coreconsensus.EntryValue, results []any
        recv: m *Machine
      - name: Snapshot
        recv: m *Machine
        results: coreconsensus.Snapshot, error
      - name: Restore
        params: r io.Reader, meta coreconsensus.SnapshotMetaValue
        recv: m *Machine
        results: error
    name: Machine
  - fields:
      - doc: MaxCommands is the most commands one entry carries.
        name: MaxCommands
        type: int
      - doc: |-
          MaxBytes is the largest packed body; it must not exceed the node's
          MaxEntryBytes, or a full entry is refused ENTRY_TOO_LARGE.
        name: MaxBytes
        type: int
      - doc: |-
          MaxInFlight is the most packed entries proposed and not yet answered;
          the commands proposed while every one is in flight leave together in
          the next.
        name: MaxInFlight
        type: int
    kind: struct
    name: Config
  - fields:
      - doc: Token is the packed entry's token, shared by every command in it.
        name: Token
        type: coreconsensus.TokenValue
      - doc: Sub is the command's index in the entry, in packing order.
        name: Sub
        type: int
      - doc: Value is the result Inner's ApplyBatch wrote for the command.
        name: Value
        type: any
    kind: struct
    name: ResultValue
  - doc: request is one caller's command, queued until the Packer takes it.
    fields:
      - name: cmd
        type: "[]byte"
      - name: taken
        type: bool
      - name: done
        type: chan outcome
    kind: struct
    name: request
  - doc: outcome is the answer to one request.
    fields:
      - name: res
        type: ResultValue
      - name: err
        type: error
    kind: struct
    name: outcome
  - fields:
      - name: r
        type: coreconsensus.Replicated
      - name: cfg
        type: Config
      - name: mu
        type: sync.Mutex
      - name: queue
        type: "[]*request"
      - name: closed
        type: bool
      - doc: stopped closes stop once, whichever Close comes first.
        name: stopped
        type: sync.Once
      - name: kick
        type: chan struct{}
      - name: slots
        type: chan struct{}
      - name: flight
        type: sync.WaitGroup
      - name: stop
        type: chan struct{}
      - name: done
        type: chan struct{}
      - name: life
        type: context.Context
      - name: cancel
        type: context.CancelFunc
    kind: struct
    methods:
      - name: Propose
        params: ctx context.Context, cmd []byte
        recv: p *Packer
        results: ResultValue, error
      - doc: |-
          abandon answers a caller whose ctx ended: a command still queued is taken
          out and never proposed; one already packed may still commit.
        name: abandon
        params: ctx context.Context, r *request
        recv: p *Packer
        results: ResultValue, error
      - name: Close
        params: ctx context.Context
        recv: p *Packer
        results: error
      - doc: |-
          loop proposes the queued commands, each packed entry on a goroutine of its
          own and at most MaxInFlight at once, until Close; then it waits for those
          in flight and answers what is left NODE_STOPPED.
        name: loop
        recv: p *Packer
      - doc: send proposes one packed entry, answers its callers and frees its slot.
        name: send
        params: batch []*request, body []byte
        recv: p *Packer
      - doc: |-
          take packs the head of the queue, within MaxCommands and MaxBytes, into a
          fresh body, and marks its requests taken: from here their callers can no
          longer withdraw them, and their buffers are no longer read.
        name: take
        recv: p *Packer
        results: "[]*request, []byte"
      - doc: |-
          failQueued answers every queued request NODE_STOPPED. Close set closed
          before it signalled stop, so nothing joins the queue after.
        name: failQueued
        recv: p *Packer
    name: Packer
vars:
  - doc: Machine is the state machine of a node, applying in batches.
    items:
      - name: _
        type: coreconsensus.BatchingStateMachine
        value: (*Machine)(nil)
    name: _
