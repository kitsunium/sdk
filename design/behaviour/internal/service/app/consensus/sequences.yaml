            bind: s, ok
            eval: sentinelByCode[c]
          when: ok
      - return: coreconsensus.OutcomeUnknown
  - of: LeaderHint
    participants:
      - id: caller
        kind: actor
      - id: LeaderHint
        kind: self
      - id: strconv
        kind: stdlib
      - id: coreconsensus
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - bind: v, perr
                    eval: strconv.ParseUint(f.StringValue(), 10, 64)
                    to: strconv
