      - opt:
          do:
            - eval: o.log.Log(context.Background(), level.Warn, msg, attrs...)
              to: o.log.Log
          when: o.log != nil && o.log.Enabled(context.Background(), level.Warn)
  - of: lattr
    steps:
      - return: "corelogger.AttrValue{Key: k, Value: corelogger.Uint64Value(v)}"
  - of: lstr
    steps:
      - return: "corelogger.AttrValue{Key: k, Value: corelogger.StringValue(v)}"
  - of: (*obs).span
    participants:
      - id: caller
        kind: actor
      - id: (*obs).span
        kind: self
      - id: o.tracer.Start
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: o.tracer == nil
      - bind: _, s
        eval: "o.tracer.Start(ctx, name, coretrace.SpanParams{Attrs: []coreotel.AttrValue{o.group}})"
        to: o.tracer.Start
      - return: s
  - of: spanEvent
    participants:
      - id: caller
        kind: actor
      - id: spanEvent
        kind: self
      - id: s.AddEvent
        kind: value
    steps:
      - opt:
          do:
            - eval: s.AddEvent(name, attrs...)
              to: s.AddEvent
          when: s != nil
  - of: spanEnd
    participants:
      - id: caller
        kind: actor
      - id: spanEnd
        kind: self
      - id: s.SetStatus
        kind: value
      - id: s.End
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: s == nil
      - opt:
          do:
            - eval: s.SetStatus(coretrace.StatusError, err.Error())
              to: s.SetStatus
          when: err != nil
      - eval: s.End()
        to: s.End
  - of: codeAttr
    participants:
      - id: caller
        kind: actor
      - id: codeAttr
        kind: self
      - id: errs
        kind: package
      - id: c.String
        kind: value
      - id: coreotel
        kind: package
    steps:
      - bind: c, _
        eval: errs.CodeOf(err)
        to: errs
      - bind: r, _
        eval: errs.ReasonOf(err)
        to: errs
      - opt:
          do:
            - set: r
              to: c.String
              value: c.String()
          when: r == ""
      - return: coreotel.String("code", r)
        to: coreotel
  - of: (*Node).observeStatus
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observeStatus
        kind: self
      - id: o.setGauge
        kind: internal
      - id: o.observeRoleChange
        kind: internal
    steps:
      - bind: o
        eval: n.obs
      - eval: o.setGauge(mRole, float64(cur.Role))
        to: o.setGauge
      - eval: o.setGauge(mTerm, float64(cur.Term))
        to: o.setGauge
      - bind: hl
        eval: "0.0"
      - opt:
          do:
            - set: hl
              value: "1"
          when: cur.Leader != 0
      - eval: o.setGauge(mHasLeader, hl)
        to: o.setGauge
      - eval: o.setGauge(mApplyLagEntries, float64(cur.Commit-min(cur.Commit, cur.Applied)))
        to: o.setGauge
      - bind: ns
        eval: "0.0"
      - opt:
          do:
            - set: ns
              value: "1"
          when: cur.NoSpace != 0
      - eval: o.setGauge(mNoSpace, ns)
        to: o.setGauge
      - eval: o.setGauge(mClusterVersion, float64(cur.Versions.Cluster))
        to: o.setGauge
      - eval: o.setGauge(mProtocolVersion, float64(cur.Versions.ProtocolMax))
        to: o.setGauge
      - opt:
          do:
            - eval: o.observeRoleChange(old, cur)
              to: o.observeRoleChange
          when: old == nil || old.Leader != cur.Leader || old.Term != cur.Term || old.Role != cur.Role
  - of: (*obs).observeRoleChange
    participants:
      - id: caller
        kind: actor
      - id: (*obs).observeRoleChange
        kind: self
      - id: o.inc
        kind: internal
      - id: o.info
        kind: internal
    steps:
      - opt:
          do:
            - eval: o.inc(mLeaderChanges)
              to: o.inc
          when: old != nil && old.Leader != cur.Leader
      - opt:
          do:
            - eval: o.inc(mElectionsStarted)
              to: o.inc
          when: cur.Role == coreconsensus.RolePreCandidate || cur.Role == coreconsensus.RoleCandidate
      - eval: |-
          o.info("consensus: role or term changed", lstr("role", cur.Role.String()), lattr("term", cur.Term),
          		lattr("leader", uint64(cur.Leader)))
        to: o.info
  - of: (*Node).observePeers
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observePeers
        kind: self
      - id: n.clk.Now
        kind: value
      - id: o.setGauge
        kind: internal
      - id: n.observePeer
        kind: internal
      - id: o.resetDeparted
        kind: internal
    steps:
      - bind: o
        eval: n.obs
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - return: ""
          when: now.Sub(o.lastPeers) < 100*time.Millisecond
      - set: o.lastPeers
        value: now
      - eval: o.setGauge(mFailureTolerance, float64(n.r.FailureTolerance(now)))
        to: o.setGauge
      - bind: last
        eval: n.r.Status().Last
      - bind: window
        eval: n.r.Status().Timing.ElectionTimeoutMin
      - bind: seen
        eval: map[coreconsensus.NodeID]bool{}
      - loop:
          do:
            - set: seen[p.ID]
              value: "true"
            - eval: n.observePeer(&p, now, last, window)
              to: n.observePeer
          key: _
          range: n.r.PeerStats()
          value: p
      - eval: o.resetDeparted(seen)
        to: o.resetDeparted
  - of: (*Node).observePeer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observePeer
        kind: self
      - id: coreotel
        kind: package
      - id: n.obs.setGauge
        kind: internal
    steps:
      - bind: peer
        eval: coreotel.String("peer", p.ID.String())
        to: coreotel
      - eval: n.obs.setGauge(mPeerMatchLag, float64(last-min(last, p.Match)), peer)
        to: n.obs.setGauge
      - eval: n.obs.setGauge(mPeerInflight, float64(p.Inflight), peer)
        to: n.obs.setGauge
      - bind: u
        eval: "0.0"
      - opt:
          do:
            - set: u
              value: "1"
          when: "!p.Flags.Has(raft.StatHeard) || now.Sub(p.LastHeard) >= window"
      - opt:
          do:
            - set: u
              value: "1"
          init:
            bind: at, ok
            eval: n.unreachableAt[p.ID]
          when: ok && at.After(p.LastHeard)
      - eval: n.obs.setGauge(mPeerUnreachable, u, peer)
        to: n.obs.setGauge
      - opt:
          do:
            - eval: n.obs.setGauge(mPeerLastContact, now.Sub(p.LastHeard).Seconds(), peer)
              to: n.obs.setGauge
          when: p.Flags.Has(raft.StatHeard)
  - of: (*obs).resetDeparted
    participants:
      - id: caller
        kind: actor
      - id: (*obs).resetDeparted
        kind: self
      - id: coreotel
        kind: package
      - id: o.setGauge
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: seen[id]
            - bind: peer
              eval: coreotel.String("peer", id.String())
              to: coreotel
            - loop:
                do:
                  - eval: o.setGauge(name, 0, peer)
                    to: o.setGauge
                key: _
                range: peerGauges
                value: name
          key: id
          range: o.peersPub
      - set: o.peersPub
        value: seen
  - of: (*Node).observeResources
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observeResources
        kind: self
      - id: n.clk.Now
        kind: value
      - id: o.setGauge
        kind: internal
      - id: ls.logStats
        kind: internal
      - id: o.addTo
        kind: internal
      - id: ct.CertExpiry
        kind: internal
    steps:
      - bind: o
        eval: n.obs
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - return: ""
          when: now.Sub(o.lastRes) < time.Second
      - set: o.lastRes
        value: now
      - eval: o.setGauge(mLogQuota, float64(n.cfg.MaxLogBytes))
        to: o.setGauge
      - opt:
          do:
            - bind: b, free, tails
              eval: ls.logStats()
              to: ls.logStats
            - eval: o.setGauge(mLogBytes, float64(b))
              to: o.setGauge
            - opt:
                do:
                  - eval: o.setGauge(mFsFree, float64(free), coreotel.String("fs", "data"))
                    to: o.setGauge
                when: free >= 0
            - eval: o.addTo(mTailTruncated, &o.seenTails, tails)
              to: o.addTo
          init:
            bind: ls, ok
            eval: |-
              n.cfg.Log.(interface {
              		logStats() (bytes, free, tails int64)
              	})
          when: ok
      - opt:
          do:
            - opt:
                do:
                  - eval: o.setGauge(mCertExpiry, e.Sub(now).Seconds())
                    to: o.setGauge
                init:
                  bind: e
                  eval: ct.CertExpiry()
                  to: ct.CertExpiry
                when: "!e.IsZero()"
            - bind: seen
              eval: map[coreconsensus.NodeID]bool{}
            - loop:
                do:
                  - set: seen[id]
                    value: "true"
                  - eval: o.setGauge(mPeerCertExpiry, e.Sub(now).Seconds(), coreotel.String("peer", id.String()))
                    to: o.setGauge
                key: id
                range: ct.PeerCertExpiry()
                value: e
            - loop:
                do:
                  - opt:
                      do:
                        - eval: o.setGauge(mPeerCertExpiry, departedCertExpiry, coreotel.String("peer", id.String()))
                          to: o.setGauge
                      when: "!seen[id]"
                key: id
                range: o.certsPub
            - set: o.certsPub
              value: seen
            - eval: o.addTo(mReloadFailures, &o.seenReloads, int64(ct.ReloadFailures()))
              to: o.addTo
          init:
            bind: ct, ok
            eval: |-
              n.cfg.Transport.(interface {
              		CertExpiry() time.Time
              		PeerCertExpiry() map[coreconsensus.NodeID]time.Time
              		ReloadFailures() int
              	})
          when: ok
  - of: (*Node).ReadCommitted
    participants:
      - id: caller
        kind: actor
      - id: (*Node).ReadCommitted
        kind: self
      - id: ctx.Err
        kind: value
      - id: n.cfg.Log.HardState
        kind: value
      - id: n.cfg.Log.Bounds
        kind: value
      - id: n.cfg.Log.Entries
        kind: value
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: nil, n.stoppedErr()
          when: n.stopped.Load()
      - opt:
          do:
            - set: from
              value: "1"
          when: from == 0
      - bind: hs, err
        eval: n.cfg.Log.HardState()
        to: n.cfg.Log.HardState
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: to
        value: min(to, max(hs.Commit, n.logApplied.Load()))
      - opt:
          do:
            - return: nil, nil
          when: from > to
      - opt:
          do:
            - return: nil, origin(coreconsensus.Compacted, errs.String("from", strconv.FormatUint(from, 10)), errs.String("first", strconv.FormatUint(first, 10)))
          init:
            bind: first, _
            eval: n.cfg.Log.Bounds()
            to: n.cfg.Log.Bounds
          when: from < first
      - return: n.cfg.Log.Entries(from, to+1, maxBytes, nil)
        to: n.cfg.Log.Entries
  - of: OpenSnapshot
    participants:
      - id: caller
        kind: actor
      - id: OpenSnapshot
        kind: self
      - id: restoreCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, restoreRefused("size bounds")
          when: opt == nil || opt.MaxDecoded <= 0
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: meta
        eval: opt.Expected
      - return: "&snapshotReader{cr: newChunkReader(r, codec, max(meta.ChunkSize, 1), opt.MaxDecoded), meta: meta}, nil"
  - of: (*snapshotReader).Read
    participants:
      - id: caller
        kind: actor
      - id: (*snapshotReader).Read
        kind: self
      - id: s.cr.Read
        kind: internal
    steps:
      - bind: n, err
        eval: s.cr.Read(p)
        to: s.cr.Read
      - opt:
          do:
            - return: n, err
          when: "!errors.Is(err, io.EOF)"
      - opt:
          do:
            - return: n, snapshotCorrupt("size")
          when: s.cr.total != s.meta.DecodedSize || s.cr.encoded != s.meta.EncodedSize
      - var:
          name: got
          type: "[32]byte"
      - eval: copy(got[:], s.cr.sum.Sum(nil))
      - opt:
          do:
            - return: n, snapshotCorrupt("sha256")
          when: got != s.meta.SHA256
      - return: n, io.EOF
  - of: ImportObserved
    participants:
      - id: caller
        kind: actor
      - id: ImportObserved
        kind: self
      - id: RestoreSnapshot
        kind: internal
      - id: knownClusterVersion
        kind: internal
      - id: checkObservedTail
        kind: internal
      - id: restoreCodec
        kind: internal
      - id: replayObserved
        kind: internal
      - id: encodeObserved
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, restoreRefused("no options, no snapshot or no state machine")
          when: opt == nil || p == nil || p.Snapshot == nil || p.Machine == nil
      - opt:
          do:
            - return: RestoreSnapshot(d, p.Snapshot, newCluster, members, opt)
              to: RestoreSnapshot
          when: len(p.Tail) == 0
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: knownClusterVersion(&opt.Expected)
            to: knownClusterVersion
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: checkObservedTail(&opt.Expected, p.Tail)
            to: checkObservedTail
          when: err != nil
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: replayObserved(p, opt)
            to: replayObserved
          when: err != nil
      - bind: encoded, meta, err
        eval: encodeObserved(p, codec, opt.Expected)
        to: encodeObserved
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - bind: o
        eval: "*opt"
      - set: o.Expected
        value: meta
      - return: RestoreSnapshot(d, bytes.NewReader(encoded), newCluster, members, &o)
        to: RestoreSnapshot
  - of: replayObserved
    participants:
      - id: caller
        kind: actor
      - id: replayObserved
        kind: self
      - id: OpenSnapshot
        kind: internal
      - id: p.Machine.Restore
        kind: value
      - id: io
        kind: stdlib
      - id: p.Machine.Apply
        kind: value
    steps:
      - bind: r, err
        eval: OpenSnapshot(p.Snapshot, opt)
        to: OpenSnapshot
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: exp
        eval: opt.Expected
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.Machine.Restore(r, exp)
            to: p.Machine.Restore
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: io.Copy(io.Discard, r)
            to: io
          when: err != nil
      - loop:
          do:
            - bind: e
              eval: p.Tail[i]
            - opt:
                do:
                  - continue: true
                when: e.Kind != coreconsensus.EntryCommand
            - set: e.Token
              value: "coreconsensus.TokenValue{Cluster: exp.Log.Cluster, Epoch: exp.Log.Epoch, Term: e.Position.Term, Index: e.Position.Index}"
            - eval: p.Machine.Apply(e)
              to: p.Machine.Apply
          key: i
          range: p.Tail
      - return: nil
  - of: encodeObserved
    participants:
      - id: caller
        kind: actor
      - id: encodeObserved
        kind: self
      - id: p.Machine.Snapshot
        kind: value
      - id: s.Release
        kind: value
      - id: newChunkWriter
        kind: internal
      - id: s.WriteTo
        kind: value
      - id: cw.Close
        kind: internal
      - id: fmt
        kind: stdlib
      - id: buf.Bytes
        kind: value
    steps:
      - bind: s, err
        eval: p.Machine.Snapshot()
        to: p.Machine.Snapshot
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - defer: s.Release()
        to: s.Release
      - var:
          name: buf
          type: bytes.Buffer
      - bind: cw
        eval: newChunkWriter(&buf, codec, defaultChunkSize)
        to: newChunkWriter
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: _, err
            eval: s.WriteTo(cw)
            to: s.WriteTo
          when: err != nil
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: cw.Close()
            to: cw.Close
          when: err != nil
      - bind: last
        eval: p.Tail[len(p.Tail)-1]
      - bind: meta
        eval: exp
      - set: meta.ID
        to: fmt
        value: fmt.Sprintf("%020d-%020d", last.Position.Index, last.Position.Term)
      - set: meta.Position, meta.ChainTip
        value: last.Position, last.ChainSum
      - set: meta.Codec, meta.ChunkSize
        value: string(codec.Algorithm()), defaultChunkSize
      - set: meta.EncodedSize, meta.DecodedSize
        value: cw.encoded, cw.decoded
      - eval: copy(meta.SHA256[:], cw.sum.Sum(nil))
      - set: meta.Membership.Index
        value: last.Position.Index
      - return: buf.Bytes(), meta, nil
        to: buf.Bytes
  - of: checkObservedTail
    participants:
      - id: caller
        kind: actor
      - id: checkObservedTail
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - bind: prev, term, chain
        eval: exp.Position.Index, exp.Position.Term, exp.ChainTip
      - loop:
          do:
            - bind: e
              eval: "&tail[i]"
            - switch:
                cases:
                  - case: e.Position.Index != prev+1
                    do:
                      - return: restoreRefused(fmt.Sprintf("the tail holds %d after %d", e.Position.Index, prev))
                        to: restoreRefused
                  - case: e.Position.Term < term
                    do:
                      - return: restoreRefused(fmt.Sprintf("the term goes back at %d", e.Position.Index))
                        to: restoreRefused
                  - case: "!e.Kind.Known()"
                    do:
                      - return: restoreRefused(fmt.Sprintf("unknown entry kind at %d", e.Position.Index))
                        to: restoreRefused
                  - case: e.Kind == coreconsensus.EntryClusterVersion, e.Kind == coreconsensus.EntryTimingContract, e.Kind == coreconsensus.EntryNoSpaceRaise, e.Kind == coreconsensus.EntryNoSpaceClear
                    do:
                      - return: restoreRefused(fmt.Sprintf("the tail changes the engine's state at %d; import from a later snapshot", e.Position.Index))
                        to: restoreRefused
                  - case: e.BodySum != wire.BodySum(e.Data)
                    do:
                      - return: restoreRefused(fmt.Sprintf("the payload of %d does not match its BodySum", e.Position.Index))
                        to: restoreRefused
                  - case: e.ChainSum != wire.ChainSum(chain, e)
                    do:
                      - return: restoreRefused(fmt.Sprintf("the chain breaks at %d", e.Position.Index))
                        to: restoreRefused
            - set: prev, term, chain
              value: e.Position.Index, e.Position.Term, e.ChainSum
          key: i
          range: tail
      - return: nil
  - of: DataDir.offline
    participants:
      - id: caller
        kind: actor
      - id: DataDir.offline
        kind: self
      - id: misconfigured
        kind: internal
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: misconfigured("DataDir", "zero")
              to: misconfigured
          when: d.d == nil
      - lock:
          mutex: d.d.mu
      - switch:
          cases:
            - case: d.d.closed
              do:
                - return: origin(coreconsensus.NodeStopped, errs.String("why", "data directory closed"))
                  to: origin
            - case: d.d.inUse
              do:
                - return: origin(coreconsensus.DataDirInUse, errs.String("dir", d.d.dir))
                  to: origin
      - return: nil
  - of: DataDir.audit
    participants:
      - id: caller
        kind: actor
      - id: DataDir.audit
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: fmt
        kind: stdlib
      - id: f.Sync
        kind: value
      - id: syncDir
        kind: internal
    steps:
      - bind: f, err
        eval: os.OpenFile(filepath.Join(d.d.dir, fileAudit), os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o600)
        to: os
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = storageFailed("audit", cerr)
          		}
          	}()
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: _, err
            eval: fmt.Fprintf(f, "%s %s\n", op, what)
            to: fmt
          when: err != nil
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: err
            eval: f.Sync()
            to: f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: Init
    participants:
      - id: caller
        kind: actor
      - id: Init
        kind: self
      - id: d.offline
        kind: internal
      - id: InitLog
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - return: InitLog(d.Log(), cluster, slot)
        to: InitLog
  - of: Redraw
    participants:
      - id: caller
        kind: actor
      - id: Redraw
        kind: self
      - id: d.offline
        kind: internal
      - id: RedrawLog
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - return: RedrawLog(d.Log())
        to: RedrawLog
  - of: Inspect
    participants:
      - id: caller
        kind: actor
      - id: Inspect
        kind: self
      - id: d.offline
        kind: internal
      - id: readQuarantineMarker
        kind: internal
      - id: l.mu.RLock
        kind: value
      - id: l.mu.RUnlock
        kind: value
      - id: l.Bounds
        kind: internal
      - id: d.d.snaps.List
        kind: internal
      - id: lastTermOf
        kind: internal
      - id: stopMarkers
        kind: internal
    steps:
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: l
        eval: d.d.log
      - bind: r
        eval: "ReportValue{Stamp: l.stamp}"
      - bind: q, err
        eval: readQuarantineMarker(d.d.dir)
        to: readQuarantineMarker
      - opt:
          do:
            - return: ReportValue{}, err
          when: err != nil
      - set: r.Quarantine
        value: q
      - opt:
          do:
            - eval: l.mu.RLock()
              to: l.mu.RLock
            - set: r.HardState
              value: l.hs
            - eval: l.mu.RUnlock()
              to: l.mu.RUnlock
            - set: r.First, r.Last
              to: l.Bounds
              value: l.Bounds()
          when: l.refuse == nil
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: r.Snapshots, err
            eval: d.d.snaps.List()
            op: =
            to: d.d.snaps.List
          when: err != nil
      - opt:
          do:
            - set: r.Last
              value: max(r.Last, r.Snapshots[0].Position.Index)
          when: l.refuse == nil && len(r.Snapshots) > 0
      - opt:
          do:
            - set: r.LastTerm
              to: lastTermOf
              value: lastTermOf(l, &r)
          when: l.refuse == nil
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: r.Markers, err
            eval: stopMarkers(d.d.dir)
            op: =
            to: stopMarkers
          when: err != nil
      - return: r, nil
  - of: lastTermOf
    participants:
      - id: caller
        kind: actor
      - id: lastTermOf
        kind: self
      - id: l.Term
        kind: internal
    steps:
      - opt:
          do:
            - return: r.Snapshots[0].Position.Term
          when: len(r.Snapshots) > 0 && r.Snapshots[0].Position.Index == r.Last
      - opt:
          do:
            - return: t
          init:
            bind: t, err
            eval: l.Term(r.Last)
            to: l.Term
          when: err == nil
      - return: "0"
  - of: readQuarantineMarker
    participants:
      - id: caller
        kind: actor
      - id: readQuarantineMarker
        kind: self
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: q, err
        eval: os.ReadFile(filepath.Join(dir, markerQuarantine))
        to: os
      - switch:
          cases:
            - case: err == nil
              do:
                - return: strings.TrimSpace(string(q)), nil
                  to: strings
            - case: errors.Is(err, os.ErrNotExist)
              do:
                - return: "\"\", nil"
            - default: true
              do:
                - return: "\"\", storageFailed(\"inspect quarantine\", err)"
  - of: stopMarkers
    participants:
      - id: caller
        kind: actor
      - id: stopMarkers
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("inspect markers", err)
          when: err != nil
      - var:
          name: markers
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: markers
                    value: append(markers, e.Name())
                when: strings.HasPrefix(e.Name(), markerStopPrefix) && !strings.HasSuffix(e.Name(), ".tmp")
          key: _
          range: ents
          value: e
      - return: markers, nil
  - of: ClearQuarantine
    participants:
      - id: caller
        kind: actor
      - id: ClearQuarantine
        kind: self
      - id: d.offline
        kind: internal
      - id: misconfigured
        kind: internal
      - id: d.wipeAndRejoin
        kind: internal
      - id: d.d.log.storageFailedThisBoot
        kind: internal
      - id: d.audit
        kind: internal
      - id: d.truncateAndStaySilent
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - opt:
          do:
            - return: misconfigured("Operator", "invalid")
              to: misconfigured
          when: "!op.Valid()"
      - switch:
          cases:
            - case: WipeAndRejoin
              do:
                - return: d.wipeAndRejoin(op)
                  to: d.wipeAndRejoin
            - case: TruncateAndStaySilent
              do:
                - opt:
                    do:
                      - return: err
                    init:
                      bind: err
                      eval: d.d.log.storageFailedThisBoot()
                      to: d.d.log.storageFailedThisBoot
                    when: err != nil
                - opt:
                    do:
                      - return: err
                    init:
                      bind: err
                      eval: d.audit(op, "clear-quarantine truncate-and-stay-silent")
                      to: d.audit
                    when: err != nil
                - return: d.truncateAndStaySilent()
                  to: d.truncateAndStaySilent
            - default: true
              do:
                - return: misconfigured("exit", "unknown")
                  to: misconfigured
          "on": exit
  - of: DataDir.wipeAndRejoin
    participants:
      - id: caller
        kind: actor
      - id: DataDir.wipeAndRejoin
        kind: self
      - id: d.audit
        kind: internal
      - id: d.d.log.Close
        kind: internal
      - id: d.removeStores
        kind: internal
      - id: d.removeStampAndMarkers
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
      - id: d.d.open
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.audit(op, "clear-quarantine wipe-and-rejoin")
            to: d.audit
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.Close()
            to: d.d.log.Close
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.removeStores()
            to: d.removeStores
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.removeStampAndMarkers()
            to: d.removeStampAndMarkers
          when: err != nil
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(d.d.log.runtimeMarker("STORAGE_FAILED"))
            to: os
          when: err != nil && !errors.Is(err, os.ErrNotExist)
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: d.d.open()
        to: d.d.open
  - of: DataDir.removeStores
    participants:
      - id: caller
        kind: actor
      - id: DataDir.removeStores
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("wipe", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: os.RemoveAll(filepath.Join(d.d.dir, name))
                  to: os
                when: err != nil
          key: _
          range: "[]string{\"log\", \"snap\"}"
          value: name
      - return: nil
  - of: DataDir.removeStampAndMarkers
    participants:
      - id: caller
        kind: actor
      - id: DataDir.removeStampAndMarkers
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: e.Name
        kind: value
    steps:
      - bind: ents, err
        eval: os.ReadDir(d.d.dir)
        to: os
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          when: err != nil
      - loop:
          do:
            - bind: "n"
              eval: e.Name()
              to: e.Name
            - opt:
                do:
                  - opt:
                      do:
                        - return: storageFailed("wipe", err)
                          to: storageFailed
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(d.d.dir, n))
                        to: os
                      when: err != nil
                when: n == fileStamp || n == markerQuarantine || n == fileSilent || strings.HasPrefix(n, markerStopPrefix)
          key: _
          range: ents
          value: e
      - return: nil
  - of: receiptMessage
    participants:
      - id: caller
        kind: actor
      - id: receiptMessage
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: append(append([]byte("kitsunium-consensus/fenced/v1"), old[:]...), next[:]...)
      - return: binary.LittleEndian.AppendUint64(b, uint64(voter))
        to: binary.LittleEndian.AppendUint64
  - of: ReceiptMessage
    participants:
      - id: caller
        kind: actor
      - id: ReceiptMessage
        kind: self
      - id: receiptMessage
        kind: internal
    steps:
      - return: receiptMessage(old, next, voter)
        to: receiptMessage
  - of: Recover
    participants:
      - id: caller
        kind: actor
      - id: Recover
        kind: self
      - id: d.offline
        kind: internal
      - id: recoverRefused
        kind: internal
      - id: d.readRecoverIntent
        kind: internal
      - id: d.finishRecover
        kind: internal
      - id: checkRecover
        kind: internal
      - id: checkRecoverMembers
        kind: internal
      - id: d.planRecover
        kind: internal
      - id: d.writeRecover
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: flog
        eval: d.d.log
      - opt:
          do:
            - return: flog.refuse
          when: errs.HasCode(flog.refuse, coreconsensus.CodeStopMarkerPresent)
      - opt:
          do:
            - return: recoverRefused("quarantined log")
              to: recoverRefused
          when: flog.refuse != nil
      - bind: stamp
        eval: flog.stamp
      - bind: intent, err
        eval: d.readRecoverIntent()
        to: d.readRecoverIntent
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: "recoverRefused(\"an interrupted Recover names cluster \" + intent.cluster.String() + \": run it again to that cluster\")"
                    to: recoverRefused
                when: intent.cluster != newCluster
            - opt:
                do:
                  - return: d.finishRecover(newCluster, opt)
                    to: d.finishRecover
                when: stamp.Log.Cluster == newCluster
          when: intent != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRecover(&stamp, newCluster, opt)
            to: checkRecover
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRecoverMembers(&stamp, members)
            to: checkRecoverMembers
          when: err != nil
      - bind: plan, err
        eval: d.planRecover(&stamp, newCluster, members, opt, intent)
        to: d.planRecover
      - opt:
          do:
            - return: err
          when: err != nil
      - return: d.writeRecover(&stamp, newCluster, members, opt.Operator, &plan)
        to: d.writeRecover
  - of: DataDir.interruptedInstall
    participants:
      - id: caller
        kind: actor
      - id: DataDir.interruptedInstall
        kind: self
      - id: d.d.snaps.List
        kind: internal
      - id: d.verifySnapshotFile
        kind: internal
      - id: flog.Bounds
        kind: internal
      - id: flog.Term
        kind: internal
    steps:
      - bind: metas, err
        eval: d.d.snaps.List()
        to: d.d.snaps.List
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false, err
          when: err != nil
      - bind: flog
        eval: d.d.log
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: coreconsensus.SnapshotMetaValue{}, false, verr
                      when: errs.HasCode(verr, coreconsensus.CodeVersionUnsupported)
                  - continue: true
                init:
                  bind: verr
                  eval: d.verifySnapshotFile(m)
                  to: d.verifySnapshotFile
                when: verr != nil
            - bind: first, last
              eval: flog.Bounds()
              to: flog.Bounds
            - bind: idx
              eval: m.Position.Index
            - opt:
                do:
                  - return: m, false, nil
                when: idx < first
            - opt:
                do:
                  - opt:
                      do:
                        - return: m, false, nil
                      init:
                        bind: t, terr
                        eval: flog.Term(idx)
                        to: flog.Term
                      when: terr == nil && t == m.Position.Term
                when: idx <= last
            - return: m, true, nil
          key: _
          range: metas
          value: m
      - return: coreconsensus.SnapshotMetaValue{}, false, nil
  - of: DataDir.finishInterruptedInstall
    participants:
      - id: caller
        kind: actor
      - id: DataDir.finishInterruptedInstall
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: flog.TruncateSuffix
        kind: internal
      - id: storageFailed
        kind: internal
      - id: compactLog
        kind: internal
      - id: flog.Sync
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - bind: first, _
        eval: flog.Bounds()
        to: flog.Bounds
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          init:
            bind: err
            eval: flog.TruncateSuffix(first)
            to: flog.TruncateSuffix
          when: err != nil
      - opt:
          do:
            - return: storageFailed("compact", err)
              to: storageFailed
          init:
            bind: err
            eval: compactLog(flog, m.Position.Index, m.Position.Term)
            to: compactLog
          when: err != nil
      - opt:
          do:
            - return: storageFailed("sync", err)
              to: storageFailed
          init:
            bind: err
            eval: flog.Sync()
            to: flog.Sync
          when: err != nil
      - return: nil
  - of: DataDir.verifySnapshotFile
    participants:
      - id: caller
        kind: actor
      - id: DataDir.verifySnapshotFile
        kind: self
      - id: defaultCodec
        kind: internal
      - id: snapshotCodec
        kind: internal
      - id: d.d.snaps.Open
        kind: internal
      - id: verifySnapshot
        kind: internal
    steps:
      - bind: own, _
        eval: defaultCodec()
        to: defaultCodec
      - bind: codec, err
        eval: snapshotCodec(&m, own)
        to: snapshotCodec
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: h, err
        eval: d.d.snaps.Open(m.ID)
        to: d.d.snaps.Open
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: |-
          func() {
          		if cerr := h.Close(); cerr != nil && err == nil {
          			err = cerr
          		}
          	}()
      - return: verifySnapshot(io.NewSectionReader(h, 0, m.EncodedSize), m, codec, max(m.DecodedSize, m.EncodedSize))
        to: verifySnapshot
  - of: DataDir.planRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.planRecover
        kind: self
      - id: d.d.log.HardState
        kind: internal
      - id: d.planKept
        kind: internal
      - id: lastMembership
        kind: internal
      - id: checkFenced
        kind: internal
      - id: d.planAdopted
        kind: internal
    steps:
      - var:
          name: p
          type: recoverPlan
      - bind: hard, err
        eval: d.d.log.HardState()
        to: d.d.log.HardState
      - opt:
          do:
            - return: p, err
          when: err != nil
      - set: p.hard, p.resumed
        value: hard, intent != nil
      - opt:
          do:
            - return: p, err
          init:
            bind: err
            eval: d.planKept(&p, intent)
            to: d.planKept
          when: err != nil
      - alt:
          - do:
              - set: p.old
                value: p.install.Membership
            when: p.install != nil
          - do:
              - return: p, err
            init:
              bind: p.old, err
              eval: lastMembership(d.d.log, d.d.snaps, p.kept)
              op: =
              to: lastMembership
            when: err != nil
      - opt:
          do:
            - return: p, err
          init:
            bind: err
            eval: checkFenced(p.old.Voters(), members, opt, stamp.Log.Cluster, newCluster)
            to: checkFenced
          when: err != nil
      - opt:
          do:
            - return: p, err
          init:
            bind: err
            eval: d.planAdopted(&p)
            to: d.planAdopted
          when: err != nil
      - return: p, d.audit(opt.Operator, recoverAuditLine(newCluster, &p))
  - of: DataDir.planAdopted
    participants:
      - id: caller
        kind: actor
      - id: DataDir.planAdopted
        kind: self
      - id: d.d.log.Bounds
        kind: internal
      - id: clusterVersionThrough
        kind: internal
    steps:
      - var:
          name: cluster
          type: uint32
      - switch:
          cases:
            - case: p.resumed
              do:
                - return: nil
            - case: p.install != nil
              do:
                - set: p.adopted, cluster
                  value: p.kept, p.install.ClusterVersion
            - default: true
              do:
                - bind: committed
                  eval: p.hard.Commit
                - opt:
                    do:
                      - set: committed
                        value: first - 1
                    init:
                      bind: first, _
                      eval: d.d.log.Bounds()
                      to: d.d.log.Bounds
                    when: first > 0 && first-1 > committed
                - set: p.adopted
                  value: min(p.kept, committed)
                - var:
                    name: err
                    type: error
                - opt:
                    do:
                      - return: err
                    init:
                      bind: cluster, err
                      eval: clusterVersionThrough(d.d.log, d.d.snaps, p.kept)
                      op: =
                      to: clusterVersionThrough
                    when: err != nil
      - opt:
          do:
            - set: p.adopted
              value: "0"
          when: cluster < raft.Protocol2
      - return: nil
  - of: DataDir.planKept
    participants:
      - id: caller
        kind: actor
      - id: DataDir.planKept
        kind: self
      - id: d.resumedKept
        kind: internal
      - id: d.interruptedInstall
        kind: internal
      - id: d.adoptedEnd
        kind: internal
    steps:
      - var:
          name: err
          type: error
      - opt:
          do:
            - set: p.kept, err
              to: d.resumedKept
              value: d.resumedKept(intent)
            - return: err
          when: p.resumed
      - bind: m, interrupted, err
        eval: d.interruptedInstall()
        to: d.interruptedInstall
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - set: p.install, p.kept
              value: "&m, m.Position.Index"
            - return: nil
          when: interrupted
      - set: p.kept, err
        to: d.adoptedEnd
        value: d.adoptedEnd(p.hard.Commit)
      - return: err
  - of: recoverAuditLine
    participants:
      - id: caller
        kind: actor
      - id: recoverAuditLine
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - return: fmt.Sprintf("recover %s resumed kept %d", newCluster, p.kept)
              to: fmt
          when: p.resumed
      - return: fmt.Sprintf("recover %s kept %d commit %d adopted %d", newCluster, p.kept, p.hard.Commit, p.kept-p.hard.Commit)
        to: fmt
  - of: DataDir.resumedKept
    participants:
      - id: caller
        kind: actor
      - id: DataDir.resumedKept
        kind: self
      - id: d.d.log.Bounds
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, recoverRefused("the interrupted Recover kept an index past the log")
          init:
            bind: _, last
            eval: d.d.log.Bounds()
            to: d.d.log.Bounds
          when: intent.kept > last
      - return: intent.kept, nil
  - of: DataDir.writeRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.writeRecover
        kind: self
      - id: d.finishInterruptedInstall
        kind: internal
      - id: d.writeRecoverIntent
        kind: internal
      - id: d.appendForced
        kind: internal
      - id: d.d.log.WriteStamp
        kind: internal
      - id: d.endRecoveredSilence
        kind: internal
      - id: d.clearRecoverIntent
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.finishInterruptedInstall(p.install)
                  to: d.finishInterruptedInstall
                when: err != nil
          when: p.install != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: "d.writeRecoverIntent(&recoverIntent{cluster: newCluster, kept: p.kept})"
                  to: d.writeRecoverIntent
                when: err != nil
          when: "!p.resumed"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "d.appendForced(new(coreconsensus.HardState{Term: p.hard.Term, Commit: p.kept}), members, &p.old, op)"
            to: d.appendForced
          when: err != nil
      - set: stamp.Log
        value: |-
          coreconsensus.LogIdentityValue{
          		Cluster: newCluster, Epoch: 1, Predecessor: stamp.Log.Cluster,
          		PredecessorEpoch: stamp.Log.Epoch, KeptIndex: p.kept, AdoptedFrom: p.adopted,
          	}
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.WriteStamp(*stamp)
            to: d.d.log.WriteStamp
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.endRecoveredSilence()
            to: d.endRecoveredSilence
          when: err != nil
      - return: d.clearRecoverIntent()
        to: d.clearRecoverIntent
  - of: DataDir.endRecoveredSilence
    participants:
      - id: caller
        kind: actor
      - id: DataDir.endRecoveredSilence
        kind: self
      - id: d.d.log.endSilence
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: d.d.log.endSilence()
            to: d.d.log.endSilence
          when: err != nil
      - return: nil
  - of: DataDir.finishRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.finishRecover
        kind: self
      - id: recoverRefused
        kind: internal
      - id: d.audit
        kind: internal
      - id: d.endRecoveredSilence
        kind: internal
      - id: d.clearRecoverIntent
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!opt.Operator.Valid()"
              do:
                - return: recoverRefused("operator")
                  to: recoverRefused
            - case: opt.Confirm != newCluster.String()
              do:
                - return: recoverRefused("confirmation does not name the new cluster")
                  to: recoverRefused
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.audit(opt.Operator, fmt.Sprintf("recover %s completed", newCluster))
            to: d.audit
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.endRecoveredSilence()
            to: d.endRecoveredSilence
          when: err != nil
      - return: d.clearRecoverIntent()
        to: d.clearRecoverIntent
  - of: DataDir.writeRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.writeRecoverIntent
        kind: self
      - id: fmt
        kind: stdlib
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - bind: body
        eval: |-
          fmt.Sprintf("cluster=%s\nkept=%d\nRecover to cluster %s was interrupted: run Recover again to cluster %s to complete it\n",
          		in.cluster, in.kept, in.cluster, in.cluster)
        to: fmt
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, markerRecover), []byte(body))
            to: writeFileSync
          when: err != nil
      - return: nil
  - of: DataDir.readRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.readRecoverIntent
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
      - id: hex
        kind: stdlib
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(d.d.dir, markerRecover))
        to: os
      - switch:
          cases:
            - case: errors.Is(err, os.ErrNotExist)
              do:
                - return: nil, nil
            - case: err != nil
              do:
                - return: nil, storageFailed("recover marker", err)
      - var:
          name: cluster
          type: string
      - bind: in
        eval: "&recoverIntent{}"
      - opt:
          do:
            - return: nil, recoverRefused("unreadable " + markerRecover + " marker")
          init:
            bind: _, err
            eval: fmt.Sscanf(string(b), "cluster=%s\nkept=%d\n", &cluster, &in.kept)
            to: fmt
          when: err != nil
      - bind: raw, err
        eval: hex.DecodeString(cluster)
        to: hex
      - opt:
          do:
            - return: nil, recoverRefused("unreadable " + markerRecover + " marker")
          when: err != nil || len(raw) != len(in.cluster)
      - eval: copy(in.cluster[:], raw)
      - return: in, nil
  - of: DataDir.clearRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.clearRecoverIntent
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(d.d.dir, markerRecover))
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: recoverRefused
    participants:
      - id: caller
        kind: actor
      - id: recoverRefused
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.RecoverRefused, errs.String("why", why))
        to: origin
  - of: isZeroDigest
    steps:
      - var:
          name: zero
          type: "[32]byte"
      - return: d == zero
  - of: checkRecover
    participants:
      - id: caller
        kind: actor
      - id: checkRecover
        kind: self
      - id: recoverRefused
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!opt.Operator.Valid()"
              do:
                - return: recoverRefused("operator")
                  to: recoverRefused
            - case: opt.Confirm != newCluster.String()
              do:
                - return: recoverRefused("confirmation does not name the new cluster")
                  to: recoverRefused
            - case: newCluster.IsZero() || newCluster == stamp.Log.Cluster
              do:
                - return: recoverRefused("the new cluster must be new")
                  to: recoverRefused
            - case: stamp.State != coreconsensus.StampMember
              do:
                - return: recoverRefused("not a member directory")
                  to: recoverRefused
            - case: len(opt.WitnessKeys) == 0
              do:
                - return: recoverRefused("no witness key")
                  to: recoverRefused
      - return: nil
  - of: checkRecoverMembers
    participants:
      - id: caller
        kind: actor
      - id: checkRecoverMembers
        kind: self
      - id: recoverRefused
        kind: internal
    steps:
      - bind: self
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - return: recoverRefused("a member without an SPKI pin")
                    to: recoverRefused
                when: isZeroDigest(m.SPKI) || m.ID == 0
            - opt:
                do:
                  - return: "recoverRefused(\"a voter other than this node: the other members enter as learners\")"
                    to: recoverRefused
                when: m.ID != stamp.ID && m.Voter
            - opt:
                do:
                  - set: self
                    value: m.Incarnation == stamp.Incarnation
                when: m.ID == stamp.ID && m.Voter
          key: _
          range: members
          value: m
      - opt:
          do:
            - return: recoverRefused("two members under one key")
              to: recoverRefused
          when: sharedKey(members)
      - opt:
          do:
            - return: recoverRefused("this node is not a voter of the new members")
              to: recoverRefused
          when: "!self"
      - return: nil
  - of: checkFenced
    participants:
      - id: caller
        kind: actor
      - id: checkFenced
        kind: self
      - id: slices
        kind: stdlib
      - id: recoverRefused
        kind: internal
      - id: receiptMessage
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: slices.ContainsFunc(members, func(m coreconsensus.MemberValue) bool { return m.ID == v })
            - bind: i
              eval: slices.IndexFunc(opt.Fenced, func(a coreconsensus.FencedAttestationValue) bool { return a.Voter == v })
              to: slices
            - opt:
                do:
                  - return: recoverRefused("an old voter is not attested fenced")
                    to: recoverRefused
                when: i < 0
            - bind: msg
              eval: receiptMessage(oldCluster, newCluster, v)
              to: receiptMessage
            - opt:
                do:
                  - return: recoverRefused("a witness did not sign the fence of an old voter")
                    to: recoverRefused
                when: "!signedByEvery(opt.WitnessKeys, opt.Fenced[i].Receipts, msg)"
          key: _
          range: voters
          value: v
      - return: nil
  - of: DataDir.adoptedEnd
    participants:
      - id: caller
        kind: actor
      - id: DataDir.adoptedEnd
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: d.adoptedPastTheBase
        kind: internal
      - id: d.chainAt
        kind: internal
      - id: d.verifiedEnd
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - opt:
          do:
            - return: d.adoptedPastTheBase(first, last)
              to: d.adoptedPastTheBase
          when: commit+1 < first
      - opt:
          do:
            - return: commit, nil
          when: last <= commit
      - bind: chain, term, err
        eval: d.chainAt(commit, first)
        to: d.chainAt
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - return: d.verifiedEnd(commit, last, term, chain)
        to: d.verifiedEnd
  - of: DataDir.adoptedPastTheBase
    participants:
      - id: caller
        kind: actor
      - id: DataDir.adoptedPastTheBase
        kind: self
      - id: d.d.snaps.List
        kind: internal
      - id: snapshotAt
        kind: internal
      - id: d.verifiedEnd
        kind: internal
      - id: d.d.log.Entries
        kind: internal
    steps:
      - bind: metas, err
        eval: d.d.snaps.List()
        to: d.d.snaps.List
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - opt:
          do:
            - return: d.verifiedEnd(first-1, last, m.Position.Term, m.ChainTip)
              to: d.verifiedEnd
          init:
            bind: m, ok
            eval: snapshotAt(metas, first-1)
            to: snapshotAt
          when: ok
      - opt:
          do:
            - return: 0, recoverRefused("the log is compacted past its persisted commit, and nothing records the chain at its base")
          when: last < first
      - bind: es, err
        eval: d.d.log.Entries(first, first+1, 1, nil)
        to: d.d.log.Entries
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: e
        eval: "&es[0]"
      - opt:
          do:
            - return: 0, recoverRefused("the log is compacted past its persisted commit, and its first entry does not verify")
          when: wire.BodySum(e.Data) != e.BodySum
      - return: d.verifiedEnd(first, last, e.Position.Term, e.ChainSum)
        to: d.verifiedEnd
  - of: DataDir.verifiedEnd
    participants:
      - id: caller
        kind: actor
      - id: DataDir.verifiedEnd
        kind: self
      - id: flog.Entries
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - var:
          name: buf
          type: "[]coreconsensus.EntryValue"
      - loop:
          cond: end < last
          do:
            - bind: es, err
              eval: flog.Entries(end+1, end+2, 1, buf[:0])
              to: flog.Entries
            - opt:
                do:
                  - return: end, nil
                when: errors.Is(err, coreconsensus.LogCorrupt)
            - opt:
                do:
                  - return: 0, err
                when: err != nil
            - bind: e
              eval: "&es[0]"
            - opt:
                do:
                  - return: end, nil
                when: "!extends(e, end, term, chain)"
            - set: chain, term, end
              value: e.ChainSum, e.Position.Term, e.Position.Index
            - set: buf
              value: es
      - return: end, nil
  - of: extends
    steps:
      - return: |-
          e.Position.Index == end+1 && e.Position.Term >= term &&
          		wire.BodySum(e.Data) == e.BodySum && wire.ChainSum(chain, e) == e.ChainSum
  - of: DataDir.appendForced
    participants:
      - id: caller
        kind: actor
      - id: DataDir.appendForced
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: flog.TruncateSuffix
        kind: internal
      - id: d.chainAt
        kind: internal
      - id: clusterVersionThrough
        kind: internal
      - id: wire
        kind: package
      - id: flog.Append
        kind: internal
      - id: flog.Sync
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - bind: commit
        eval: hard.Commit
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: flog.TruncateSuffix(commit + 1)
                  to: flog.TruncateSuffix
                when: err != nil
          when: last > commit
      - bind: chain, termAt, err
        eval: d.chainAt(commit, first)
        to: d.chainAt
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: term
        eval: max(hard.Term, termAt) + 1
      - bind: cluster, err
        eval: clusterVersionThrough(flog, d.d.snaps, commit)
        to: clusterVersionThrough
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: conf
        eval: "coreconsensus.MembershipValue{Members: byID(members), Retired: old.Retired}"
      - var:
          name: version
          type: uint32
      - opt:
          do:
            - set: version, conf.RetiredKeys
              value: wire.AdminVersion3, slices.Clone(old.RetiredKeys)
          when: cluster >= raft.Protocol3
      - bind: data
        eval: "wire.AppendAdminAt(nil, version, &wire.AdminValue{Operator: string(operator), Change: wire.ChangeForced, Membership: conf})"
        to: wire
      - bind: e
        eval: |-
          coreconsensus.EntryValue{
          		Position: coreconsensus.PositionValue{Term: term, Index: commit + 1}, Kind: coreconsensus.EntryMembership,
          		Version: version, BodySum: wire.BodySum(data), Data: data,
          	}
      - set: e.ChainSum
        to: wire
        value: wire.ChainSum(chain, &e)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "flog.Append([]coreconsensus.EntryValue{e}, &coreconsensus.HardState{Term: term, Commit: commit + 1})"
            to: flog.Append
          when: err != nil
      - return: flog.Sync()
        to: flog.Sync
  - of: DataDir.chainAt
    participants:
      - id: caller
        kind: actor
      - id: DataDir.chainAt
        kind: self
      - id: d.d.log.Entries
        kind: internal
      - id: d.d.snaps.List
        kind: internal
      - id: snapshotAt
        kind: internal
    steps:
      - opt:
          do:
            - bind: es, err
              eval: d.d.log.Entries(commit, commit+1, 1, nil)
              to: d.d.log.Entries
            - opt:
                do:
                  - return: 0, 0, err
                when: err != nil
            - return: es[0].ChainSum, es[0].Position.Term, nil
          when: commit >= first
      - bind: metas, err
        eval: d.d.snaps.List()
        to: d.d.snaps.List
      - opt:
          do:
            - return: 0, 0, err
          when: err != nil
      - opt:
          do:
            - return: m.ChainTip, m.Position.Term, nil
          init:
            bind: m, ok
            eval: snapshotAt(metas, commit)
            to: snapshotAt
          when: ok
      - return: 0, 0, nil
  - of: lastMembership
    participants:
      - id: caller
        kind: actor
      - id: lastMembership
        kind: self
      - id: snaps.List
        kind: internal
      - id: l.Bounds
        kind: internal
      - id: l.Entries
        kind: internal
      - id: wire
        kind: package
    steps:
      - var:
          name: m
          type: coreconsensus.MembershipValue
      - bind: metas, err
        eval: snaps.List()
        to: snaps.List
      - opt:
          do:
            - return: m, err
          when: err != nil
      - opt:
          do:
            - set: m
              value: metas[0].Membership
          when: len(metas) > 0
      - bind: first, last
        eval: l.Bounds()
        to: l.Bounds
      - opt:
          do:
            - bind: es, err
              eval: l.Entries(first, min(last, index)+1, int(^uint(0)>>1), nil)
              to: l.Entries
            - opt:
                do:
                  - return: coreconsensus.MembershipValue{}, err
                when: err != nil
            - loop:
                do:
                  - opt:
                      do:
                        - opt:
                            do:
                              - set: m
                                value: a.Membership
                            init:
                              bind: a, err
                              eval: wire.ParseAdminAt(e.Version, e.Data)
                              to: wire
                            when: err == nil
                      when: e.Kind == coreconsensus.EntryMembership
                key: _
                range: es
                value: e
          when: last >= first
      - return: m, nil
  - of: clusterVersionThrough
    participants:
      - id: caller
        kind: actor
      - id: clusterVersionThrough
        kind: self
      - id: snaps.List
        kind: internal
      - id: l.Bounds
        kind: internal
      - id: l.Entries
        kind: internal
      - id: wire
        kind: package
    steps:
      - bind: metas, err
        eval: snaps.List()
        to: snaps.List
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: ver
          type: uint32
      - leaf: a var of several names, or of no type
        stmt: var gen, base uint64
      - opt:
          do:
            - set: ver, gen, base
              value: metas[0].ClusterVersion, metas[0].ClusterGeneration, metas[0].Position.Index
          when: len(metas) > 0
      - bind: first, last
        eval: l.Bounds()
        to: l.Bounds
      - bind: lo
        eval: max(first, base+1)
      - opt:
          do:
            - return: ver, nil
          when: last < lo || index < lo
      - bind: es, err
        eval: l.Entries(lo, min(last, index)+1, int(^uint(0)>>1), nil)
        to: l.Entries
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: e.Kind != coreconsensus.EntryClusterVersion
            - opt:
                do:
                  - set: ver, gen
                    value: a.ClusterVersion, gen+1
                init:
                  bind: a, err
                  eval: wire.ParseAdminAt(e.Version, e.Data)
                  to: wire
                when: err == nil && a.Pre.Generation == gen && a.ClusterVersion > ver
          key: _
          range: es
          value: e
      - return: ver, nil
  - of: RestoreSnapshot
    participants:
      - id: caller
        kind: actor
      - id: RestoreSnapshot
        kind: self
      - id: d.offline
        kind: internal
      - id: checkRestore
        kind: internal
      - id: restoreCodec
        kind: internal
      - id: d.audit
        kind: internal
      - id: restoredMeta
        kind: internal
      - id: d.spoolRestored
        kind: internal
      - id: d.verifyRestored
        kind: internal
      - id: flog.restartAt
        kind: internal
      - id: flog.WriteStamp
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: flog
        eval: d.d.log
      - bind: stamp
        eval: flog.stamp
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: checkRestore(flog, &stamp, newCluster, members, opt)
            to: checkRestore
          when: err != nil
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.audit(opt.Operator, "restore-snapshot "+newCluster.String())
            to: d.audit
          when: err != nil
      - bind: meta
        eval: restoredMeta(&opt.Expected, newCluster, members)
        to: restoredMeta
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.spoolRestored(r, &meta)
            to: d.spoolRestored
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.verifyRestored(&meta, codec, opt.MaxDecoded)
            to: d.verifyRestored
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: flog.restartAt(&meta)
            to: flog.restartAt
          when: err != nil
      - set: stamp.Log, stamp.State
        value: meta.Log, coreconsensus.StampMember
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: flog.WriteStamp(stamp)
            to: flog.WriteStamp
          when: err != nil
      - return: meta, nil
  - of: restoreRefused
    participants:
      - id: caller
        kind: actor
      - id: restoreRefused
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.RestoreRefused, errs.String("why", why))
        to: origin
  - of: checkRestore
    participants:
      - id: caller
        kind: actor
      - id: checkRestore
        kind: self
      - id: checkRestoreTarget
        kind: internal
      - id: checkRestoreBounds
        kind: internal
      - id: checkRestoreMembers
        kind: internal
    steps:
      - opt:
          do:
            - return: flog.refuse
          when: errs.HasCode(flog.refuse, coreconsensus.CodeStopMarkerPresent)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRestoreTarget(flog, newCluster, opt)
            to: checkRestoreTarget
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRestoreBounds(flog, stamp, opt)
            to: checkRestoreBounds
          when: err != nil
      - return: checkRestoreMembers(stamp, members)
        to: checkRestoreMembers
  - of: restoreCodec
    participants:
      - id: caller
        kind: actor
      - id: restoreCodec
        kind: self
      - id: knownClusterVersion
        kind: internal
      - id: linkedCodec
        kind: internal
      - id: defaultRestoreCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: knownClusterVersion(&opt.Expected)
            to: knownClusterVersion
          when: err != nil
      - opt:
          do:
            - return: opt.Codec, nil
          when: opt.Codec != nil
      - opt:
          do:
            - return: linkedCodec(opt.Expected.Codec)
              to: linkedCodec
          when: opt.Expected.Codec != ""
      - return: defaultRestoreCodec()
        to: defaultRestoreCodec
  - of: defaultRestoreCodec
    participants:
      - id: caller
        kind: actor
      - id: defaultRestoreCodec
        kind: self
      - id: defaultCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: codec, nil
          init:
            bind: codec, ok
            eval: defaultCodec()
            to: defaultCodec
          when: ok
      - return: nil, misconfigured("Codec", "no bounded decompressor")
  - of: checkRestoreTarget
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreTarget
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - bind: exp
        eval: "&opt.Expected"
      - switch:
          cases:
            - case: flog.refuse != nil
              do:
                - return: restoreRefused("quarantined log")
                  to: restoreRefused
            - case: "!opt.Operator.Valid()"
              do:
                - return: restoreRefused("operator")
                  to: restoreRefused
            - case: opt.Confirm != newCluster.String() || newCluster.IsZero()
              do:
                - return: restoreRefused("confirmation does not name the new cluster")
                  to: restoreRefused
            - case: exp.ID == "" || exp.Position.Index == 0 || isZeroDigest(exp.SHA256)
              do:
                - return: restoreRefused("expected metadata is zero")
                  to: restoreRefused
      - return: nil
  - of: checkRestoreBounds
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreBounds
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: restoreRefused
        kind: internal
    steps:
      - bind: exp
        eval: "&opt.Expected"
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - switch:
          cases:
            - case: stamp.State != coreconsensus.StampJoining || last >= first
              do:
                - return: restoreRefused("not an empty joining directory")
                  to: restoreRefused
            - case: opt.MaxEncoded <= 0 || opt.MaxDecoded <= 0 || exp.EncodedSize > opt.MaxEncoded || exp.DecodedSize > opt.MaxDecoded
              do:
                - return: restoreRefused("size bounds")
                  to: restoreRefused
      - return: nil
  - of: checkRestoreMembers
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreMembers
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - opt:
          do:
            - return: restoreRefused("this node is not a voter of the new members")
              to: restoreRefused
          when: |-
            !slices.ContainsFunc(members, func(m coreconsensus.MemberValue) bool {
            		return m.ID == stamp.ID && m.Voter && m.Incarnation == stamp.Incarnation
            	})
      - loop:
          do:
            - opt:
                do:
                  - return: restoreRefused("a member without an SPKI pin")
                    to: restoreRefused
                when: isZeroDigest(m.SPKI)
          key: _
          range: members
          value: m
      - opt:
          do:
            - return: restoreRefused("two members under one key")
              to: restoreRefused
          when: sharedKey(members)
      - return: nil
  - of: restoredMeta
    steps:
      - bind: meta
        eval: "*exp"
      - set: meta.Log
        value: |-
          coreconsensus.LogIdentityValue{
          		Cluster: newCluster, Epoch: 1, Predecessor: exp.Log.Cluster,
          		PredecessorEpoch: exp.Log.Epoch, KeptIndex: exp.Position.Index,
          	}
      - opt:
          do:
            - set: meta.Log.AdoptedFrom
              value: exp.Position.Index
          when: exp.ClusterVersion >= raft.Protocol2
      - set: meta.Membership
        value: |-
          coreconsensus.MembershipValue{
          		Index: exp.Position.Index, Members: slices.Clone(members), Retired: exp.Membership.Retired,
          		RetiredKeys: exp.Membership.RetiredKeys,
          	}
      - return: meta
  - of: DataDir.spoolRestored
    participants:
      - id: caller
        kind: actor
      - id: DataDir.spoolRestored
        kind: self
      - id: d.d.snaps.Create
        kind: internal
      - id: sink.Abort
        kind: value
      - id: io
        kind: stdlib
      - id: alsoFailed
        kind: internal
      - id: sink.Commit
        kind: value
    steps:
      - bind: sink, off, err
        eval: d.d.snaps.Create(meta.ID, *meta)
        to: d.d.snaps.Create
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: sink.Abort()
                  to: sink.Abort
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: sink, _, err
                  eval: d.d.snaps.Create(meta.ID, *meta)
                  op: =
                  to: d.d.snaps.Create
                when: err != nil
          when: off != 0
      - bind: n, err
        eval: io.Copy(sink, io.LimitReader(r, meta.EncodedSize+1))
        to: io
      - opt:
          do:
            - return: alsoFailed(restoreRefused("stream size"), "abort", sink.Abort())
              to: alsoFailed
          when: err != nil || n != meta.EncodedSize
      - return: sink.Commit(*meta)
        to: sink.Commit
  - of: DataDir.verifyRestored
    participants:
      - id: caller
        kind: actor
      - id: DataDir.verifyRestored
        kind: self
      - id: d.d.snaps.Open
        kind: internal
      - id: verifySnapshot
        kind: internal
      - id: h.Close
        kind: value
      - id: alsoFailed
        kind: internal
    steps:
      - bind: h, err
        eval: d.d.snaps.Open(meta.ID)
        to: d.d.snaps.Open
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: verr
        eval: verifySnapshot(io.NewSectionReader(h, 0, meta.EncodedSize), *meta, codec, maxDecoded)
        to: verifySnapshot
      - bind: cerr
        eval: h.Close()
        to: h.Close
      - opt:
          do:
            - return: alsoFailed(verr, "remove", d.d.snaps.Remove(meta.ID))
              to: alsoFailed
          when: verr != nil
      - return: cerr
  - of: (*fileLog).restartAt
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).restartAt
        kind: self
      - id: l.resetTo
        kind: internal
      - id: l.Append
        kind: internal
      - id: l.Sync
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.resetTo(meta.Position.Index, meta.Position.Term)
            to: l.resetTo
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "l.Append(nil, &coreconsensus.HardState{Term: meta.Position.Term + 1, Commit: meta.Position.Index})"
            to: l.Append
          when: err != nil
      - return: l.Sync()
        to: l.Sync
  - of: (*fileLog).resetTo
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).resetTo
        kind: self
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - eval: "l.add(&record{kind: recCompact, batch: l.batch, index: index, term: term})"
        to: l.add
      - set: l.slots
        value: nil
      - set: l.first, l.prevTerm
        value: index+1, term
      - set: l.compact, l.compactTerm
        value: index, term
      - return: nil
  - of: DataDir.truncateAndStaySilent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.truncateAndStaySilent
        kind: self
      - id: d.quarantinePoint
        kind: internal
      - id: filepath
        kind: stdlib
      - id: logMaxTerm
        kind: internal
      - id: persistedSilenceTerm
        kind: internal
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
      - id: truncateAtDamage
        kind: internal
      - id: syncDir
        kind: internal
      - id: os
        kind: stdlib
      - id: d.reopenSilenced
        kind: internal
    steps:
      - bind: segN, off, err
        eval: d.quarantinePoint()
        to: d.quarantinePoint
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: logDir
        eval: filepath.Join(d.d.dir, "log")
        to: filepath
      - bind: maxTerm, err
        eval: logMaxTerm(logDir)
        to: logMaxTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: prev, err
        eval: persistedSilenceTerm(d.d.dir)
        to: persistedSilenceTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - set: maxTerm
        value: max(maxTerm, prev)
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, fileSilent), silenceRecord(maxTerm, 0))
            to: writeFileSync
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: truncateAtDamage(logDir, segN, off)
            to: truncateAtDamage
          when: err != nil
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(logDir)
            to: syncDir
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.d.afterTruncate()
                when: err != nil
          when: d.d.afterTruncate != nil
      - opt:
          do:
            - return: storageFailed("clear marker", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(d.d.dir, markerQuarantine))
            to: os
          when: err != nil
      - return: d.reopenSilenced(maxTerm)
        to: d.reopenSilenced
  - of: persistedSilenceTerm
    participants:
      - id: caller
        kind: actor
      - id: persistedSilenceTerm
        kind: self
      - id: os
        kind: stdlib
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(dir, fileSilent))
        to: os
      - switch:
          cases:
            - case: os.IsNotExist(err)
              do:
                - return: 0, nil
            - case: err != nil
              do:
                - return: 0, storageFailed("silence condition", err)
            - case: len(b) != 16
              do:
                - return: 0, storageFailed("silence condition", errSilenceLength)
      - return: binary.LittleEndian.Uint64(b), nil
        to: binary.LittleEndian.Uint64
  - of: DataDir.quarantinePoint
    participants:
      - id: caller
        kind: actor
      - id: DataDir.quarantinePoint
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
    steps:
      - bind: q, err
        eval: os.ReadFile(filepath.Join(d.d.dir, markerQuarantine))
        to: os
      - opt:
          do:
            - return: 0, 0, recoverRefused("no quarantine marker")
          when: err != nil
      - var:
          name: segN
          type: uint64
      - var:
          name: "off"
          type: int64
      - opt:
          do:
            - return: 0, 0, recoverRefused("unreadable quarantine marker")
          init:
            bind: _, err
            eval: fmt.Sscanf(string(q), "seg-%016x %d", &segN, &off)
            to: fmt
          when: err != nil
      - return: segN, off, nil
  - of: logSegments
    participants:
      - id: caller
        kind: actor
      - id: logSegments
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
      - id: filepath
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(logDir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("readdir", err)
          when: err != nil
      - bind: segs
        eval: map[uint64]string{}
      - loop:
          do:
            - var:
                name: "n"
                type: uint64
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, err
                  eval: fmt.Sscanf(e.Name(), "seg-%016x", &n)
                  to: fmt
                when: err != nil || e.Name() != segName(n)
            - set: segs[n]
              to: filepath
              value: filepath.Join(logDir, e.Name())
          key: _
          range: ents
          value: e
      - return: segs, nil
  - of: logMaxTerm
    participants:
      - id: caller
        kind: actor
      - id: logMaxTerm
        kind: self
      - id: logSegments
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: segs, err
        eval: logSegments(logDir)
        to: logSegments
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: maxTerm
          type: uint64
      - loop:
          do:
            - bind: b, err
              eval: os.ReadFile(path)
              to: os
            - opt:
                do:
                  - return: 0, storageFailed("read segment", err)
                when: err != nil
            - set: maxTerm
              value: max(maxTerm, maxRecordTerm(b))
          key: _
          range: segs
          value: path
      - return: maxTerm, nil
  - of: truncateAtDamage
    participants:
      - id: caller
        kind: actor
      - id: truncateAtDamage
        kind: self
      - id: logSegments
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: truncateSegment
        kind: internal
    steps:
      - bind: segs, err
        eval: logSegments(logDir)
        to: logSegments
      - opt:
          do:
            - return: err
          when: err != nil
      - loop:
          do:
            - bind: st, err
              eval: os.Stat(path)
              to: os
            - opt:
                do:
                  - return: storageFailed("read segment", err)
                    to: storageFailed
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: truncateSegment(path, n, segN, off, st.Size())
                  to: truncateSegment
                when: err != nil
          key: "n"
          range: segs
          value: path
      - return: nil
  - of: maxRecordTerm
    participants:
      - id: caller
        kind: actor
      - id: maxRecordTerm
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: maxTerm
          type: uint64
      - loop:
          cond: o+recHeader+recFixed <= len(b)
          do:
            - bind: r, ok
              eval: parseRecord(b[o:])
              to: parseRecord
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - set: maxTerm
              value: max(maxTerm, recordTerm(&r))
            - op: +=
              set: o
              value: r.length - recAlign
          init: o := 0
          post: o += recAlign
      - return: maxTerm
  - of: recordTerm
    participants:
      - id: caller
        kind: actor
      - id: recordTerm
        kind: self
      - id: decodeCheckpoint
        kind: internal
    steps:
      - bind: term
        eval: r.term
      - opt:
          do:
            - set: term
              value: max(term, binary.LittleEndian.Uint64(r.data))
          when: r.kind == recHardState && len(r.data) == hardStateLen
      - opt:
          do:
            - opt:
                do:
                  - set: term
                    value: max(term, cp.hs.Term)
                init:
                  bind: cp, ok
                  eval: decodeCheckpoint(r.data)
                  to: decodeCheckpoint
                when: ok
          when: r.kind == recCheckpt
      - return: term
  - of: truncateSegment
    participants:
      - id: caller
        kind: actor
      - id: truncateSegment
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: zeroSegmentFrom
        kind: internal
    steps:
      - switch:
          cases:
            - case: n > segN || (n == segN && off == 0)
              do:
                - opt:
                    do:
                      - return: storageFailed("truncate", err)
                        to: storageFailed
                    init:
                      bind: err
                      eval: os.Remove(path)
                      to: os
                    when: err != nil
            - case: n == segN
              do:
                - return: zeroSegmentFrom(path, off, size)
                  to: zeroSegmentFrom
      - return: nil
  - of: zeroSegmentFrom
    participants:
      - id: caller
        kind: actor
      - id: zeroSegmentFrom
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: zeroFrom
        kind: internal
    steps:
      - bind: f, err
        eval: os.OpenFile(path, os.O_RDWR, 0)
        to: os
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = storageFailed("truncate", cerr)
          		}
          	}()
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          init:
            bind: err
            eval: zeroFrom(f, off, size)
            to: zeroFrom
          when: err != nil
      - return: nil
  - of: silenceRecord
    participants:
      - id: caller
        kind: actor
      - id: silenceRecord
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - return: binary.LittleEndian.AppendUint64(binary.LittleEndian.AppendUint64(nil, term), index)
        to: binary.LittleEndian.AppendUint64
  - of: DataDir.reopenSilenced
    participants:
      - id: caller
        kind: actor
      - id: DataDir.reopenSilenced
        kind: self
      - id: d.d.log.Close
        kind: internal
      - id: d.d.open
        kind: internal
      - id: d.d.log.Bounds
        kind: internal
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.Close()
            to: d.d.log.Close
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.open()
            to: d.d.open
          when: err != nil
      - bind: _, last
        eval: d.d.log.Bounds()
        to: d.d.log.Bounds
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, fileSilent), silenceRecord(maxTerm, last+1))
            to: writeFileSync
          when: err != nil
      - return: syncDir(d.d.dir)
        to: syncDir
  - of: (*fileLog).silence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).silence
        kind: self
      - id: os
        kind: stdlib
      - id: l.Bounds
        kind: internal
      - id: writeFileSync
        kind: internal
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(l.dir, fileSilent))
        to: os
      - opt:
          do:
            - return: 0, 0, nil, nil
          when: os.IsNotExist(err)
      - bind: _, last
        eval: l.Bounds()
        to: l.Bounds
      - opt:
          do:
            - set: err
              value: errSilenceLength
          when: err == nil && len(b) != 16
      - opt:
          do:
            - return: ^uint64(0) >> 1, last + 1, err, nil
          when: err != nil
      - set: term, index
        value: binary.LittleEndian.Uint64(b), binary.LittleEndian.Uint64(b[8:])
      - opt:
          do:
            - set: index
              value: last + 1
            - opt:
                do:
                  - return: 0, 0, nil, err
                init:
                  bind: err
                  eval: writeFileSync(filepath.Join(l.dir, fileSilent), silenceRecord(term, index))
                  to: writeFileSync
                when: err != nil
          when: index == 0
      - return: term, index, nil, nil
  - of: (*fileLog).endSilence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).endSilence
        kind: self
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: os.Remove(filepath.Join(l.dir, fileSilent))
            to: os
          when: err != nil && !os.IsNotExist(err)
      - return: syncDir(l.dir)
        to: syncDir
  - of: (*Node).Propose
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Propose
        kind: self
      - id: slices
        kind: stdlib
      - id: n.submit
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, origin(coreconsensus.EntryTooLarge, errs.Int("bytes", len(data)))
          when: len(data) > n.cfg.MaxEntryBytes
      - set: data
        to: slices
        value: slices.Clone(data)
      - bind: e
        eval: "coreconsensus.EntryValue{Kind: coreconsensus.EntryCommand, BodySum: wire.BodySum(data), Data: data}"
      - return: n.submit(ctx, e, false)
        to: n.submit
  - of: (*Node).submit
    participants:
      - id: caller
        kind: actor
      - id: (*Node).submit
        kind: self
      - id: ctx.Err
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.obs.span
        kind: internal
      - id: n.pendingProp.Add
        kind: value
      - id: n.obs.setGauge
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.record
        kind: internal
      - id: spanEvent
        kind: internal
      - id: spanEnd
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, n.stoppedErr()
          when: n.stopped.Load()
      - bind: p
        eval: "&proposal{entry: e, admin: admin, done: make(chan propResult, 1)}"
      - bind: start
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: span
        eval: n.obs.span(ctx, "consensus.Propose")
        to: n.obs.span
      - eval: n.pendingProp.Add(1)
        to: n.pendingProp.Add
      - eval: n.obs.setGauge(mProposalsPending, float64(n.pendingProp.Load()))
        to: n.obs.setGauge
      - defer: |-
          func() {
          		n.pendingProp.Add(-1)
          		n.obs.setGauge(mProposalsPending, float64(n.pendingProp.Load()))
          	}()
      - bind: finish
        eval:
          closure:
            params: r propResult
            results: coreconsensus.TokenValue, any, error
            steps:
              - alt:
                  - do:
                      - eval: n.obs.inc(mProposalsFailed, codeAttr(r.err))
                        to: n.obs.inc
                    when: r.err != nil
                  - do:
                      - eval: n.obs.record(mCommitLatency, n.clk.Since(start).Seconds())
                        to: n.obs.record
                      - eval: spanEvent(span, "applied", coreotel.Int64("index", int64(r.tok.Index)))
                        to: spanEvent
                    else: true
              - eval: spanEnd(span, r.err)
                to: spanEnd
              - return: r.tok, r.val, r.err
      - select:
          cases:
            - comm: n.propc <- p
            - comm: <-ctx.Done()
              do:
                - return: "finish(propResult{err: ctx.Err()})"
            - comm: <-n.stopc
              do:
                - return: "finish(propResult{err: n.stoppedErr()})"
      - return: finish(n.awaitProposal(ctx, p))
  - of: (*Node).awaitProposal
    participants:
      - id: caller
        kind: actor
      - id: (*Node).awaitProposal
        kind: self
      - id: p.gone.Store
        kind: value
    steps:
      - select:
          cases:
            - comm: r := <-p.done
              do:
                - return: r
            - comm: <-n.loopDone
              do:
                - select:
                    cases:
                      - comm: r := <-p.done
                        do:
                          - return: r
                      - default: true
                - opt:
                    do:
                      - return: "propResult{err: n.stoppedErr()}"
                    when: p.stage.Load() == stageUnsent
                - return: "propResult{err: outcomeUnknown(\"node stopped\")}"
            - comm: <-ctx.Done()
              do:
                - opt:
                    do:
                      - return: "propResult{err: ctx.Err()}"
                    when: p.stage.CompareAndSwap(stageUnsent, stageAbandoned)
                - eval: p.gone.Store(true)
                  to: p.gone.Store
                - return: |-
                    propResult{err: origin(coreconsensus.OutcomeUnknown,
                    			errs.String("why", "context ended after the append"), errs.String("cause", ctx.Err().Error()))}
  - of: (*Node).handleProposals
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleProposals
        kind: self
      - id: claimed
        kind: internal
      - id: n.r.Status
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.forward
        kind: internal
      - id: n.proposeBatch
        kind: internal
      - id: n.proposeAlone
        kind: internal
    steps:
      - set: ps
        to: claimed
        value: claimed(ps)
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - loop:
                do:
                  - eval: n.forward(p, st)
                    to: n.forward
                key: _
                range: ps
                value: p
            - return: ""
          when: st.Role != coreconsensus.RoleLeader
      - var:
          name: batch
          type: "[]*proposal"
      - var:
          name: ents
          type: "[]coreconsensus.EntryValue"
      - bind: flush
        eval:
          closure:
            steps:
              - eval: n.proposeBatch(now, st.Lead, batch, ents)
                to: n.proposeBatch
              - set: batch, ents
                value: batch[:0], ents[:0]
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: n.refuseOverload(p) || n.refuseShort(p)
            - opt:
                do:
                  - eval: flush()
                  - eval: n.proposeAlone(now, p)
                    to: n.proposeAlone
                  - continue: true
                when: p.admin
            - set: batch
              value: append(batch, p)
            - set: ents
              value: append(ents, p.entry)
          key: _
          range: ps
          value: p
      - eval: flush()
  - of: (*Node).proposeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).proposeBatch
        kind: self
      - id: n.r.Propose
        kind: value
      - id: n.appended
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(batch) == 0
      - bind: pos, code
        eval: n.r.Propose(now, ents)
        to: n.r.Propose
      - loop:
          do:
            - opt:
                do:
                  - send:
                      chan: p.done
                      value: "propResult{err: origin(sentinelOf(code), errs.String(\"leader\", lead.String()))}"
                  - continue: true
                when: code != 0
            - eval: n.appended(p, pos[i], true)
              to: n.appended
          key: i
          range: batch
          value: p
  - of: (*Node).refuseOverload
    steps:
      - opt:
          do:
            - return: "false"
          when: p.admin
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(coreconsensus.Overloaded, errs.String(\"why\", \"pending bytes\"))}"
            - return: "true"
          when: n.pendingBytes.Load()+int64(len(p.entry.Data)) > n.cfg.MaxPendingBytes
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(coreconsensus.Overloaded, errs.String(\"why\", \"apply lag\"))}"
            - return: "true"
          when: n.applyOverloaded()
      - return: "false"
  - of: (*Node).proposeAlone
    participants:
      - id: caller
        kind: actor
      - id: (*Node).proposeAlone
        kind: self
      - id: n.r.Propose
        kind: value
      - id: n.appended
        kind: internal
    steps:
      - bind: pos, code
        eval: n.r.Propose(now, []coreconsensus.EntryValue{p.entry})
        to: n.r.Propose
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(sentinelOf(code))}"
            - return: ""
          when: code != 0
      - eval: n.appended(p, pos[0], true)
        to: n.appended
  - of: (*Node).appended
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appended
        kind: self
      - id: p.stage.Store
        kind: value
      - id: n.pendingBytes.Add
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.answerApplied
        kind: internal
      - id: n.displace
        kind: internal
    steps:
      - set: p.pos, p.local
        value: pos, local
      - eval: p.stage.Store(stageAppended)
        to: p.stage.Store
      - opt:
          do:
            - eval: n.pendingBytes.Add(int64(len(p.entry.Data)))
              to: n.pendingBytes.Add
          when: local
      - eval: n.am.Lock()
        to: n.am.Lock
      - opt:
          do:
            - bind: r, ok
              eval: n.results[pos.Index]
            - eval: n.am.Unlock()
              to: n.am.Unlock
            - eval: n.answerApplied(p, pos, r, ok)
              to: n.answerApplied
            - return: ""
          when: pos.Index <= n.applied
      - bind: displaced
        eval: p
      - opt:
          do:
            - set: n.waiters[pos.Index], displaced
              value: p, old
          init:
            bind: old
            eval: n.waiters[pos.Index]
          when: old == nil || old.pos.Term < pos.Term
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - opt:
          do:
            - eval: n.displace(displaced)
              to: n.displace
          when: displaced != nil
  - of: (*Node).answerApplied
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerApplied
        kind: self
      - id: n.pendingBytes.Add
        kind: value
    steps:
      - opt:
          do:
            - eval: n.pendingBytes.Add(-int64(len(p.entry.Data)))
              to: n.pendingBytes.Add
          when: p.local
      - switch:
          cases:
            - case: ok && r.term == pos.Term
              do:
                - send:
                    chan: p.done
                    value: "propResult{tok: n.token(pos), val: r.val}"
            - case: ok
              do:
                - send:
                    chan: p.done
                    value: "propResult{err: withToken(coreconsensus.EntrySuperseded, n.token(pos))}"
            - default: true
              do:
                - send:
                    chan: p.done
                    value: "propResult{err: outcomeUnknown(\"applied before its position was known\")}"
  - of: (*Node).displace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).displace
        kind: self
      - id: n.pendingBytes.Add
        kind: value
    steps:
      - opt:
          do:
            - eval: n.pendingBytes.Add(-int64(len(p.entry.Data)))
              to: n.pendingBytes.Add
          when: p.local
      - send:
          chan: p.done
          value: "propResult{err: outcomeUnknown(\"another proposal took its index under a later term\")}"
  - of: (*Node).forward
    participants:
      - id: caller
        kind: actor
      - id: (*Node).forward
        kind: self
      - id: n.nextID
        kind: internal
      - id: n.clk.Now
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: p.stage.Store
        kind: value
      - id: n.cfg.Transport.Send
        kind: value
    steps:
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: notLeader(0)}"
            - return: ""
          when: st.Lead == 0 || st.Lead == n.stamp.ID
      - bind: ctx
        eval: n.nextID()
        to: n.nextID
      - bind: kind
        eval: coreconsensus.MsgForward
      - opt:
          do:
            - set: kind
              value: coreconsensus.MsgForwardAdmin
          when: p.admin
      - bind: m
        eval: |-
          coreconsensus.MessageValue{
          		Version: 1, Group: n.cfg.Group, Kind: kind, From: n.stamp.ID, To: st.Lead,
          		Term: st.Term, Context: ctx, Entries: []coreconsensus.EntryValue{p.entry},
          	}
      - set: p.sentAt
        to: n.clk.Now
        value: n.clk.Now()
      - set: n.forwards[ctx]
        value: p
      - eval: n.am.Lock()
        to: n.am.Lock
      - op: ++
        set: n.keepResults
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - eval: p.stage.Store(stagePossible)
        to: p.stage.Store
      - eval: n.cfg.Transport.Send(st.Lead, wire.AppendMessage(nil, &m))
        to: n.cfg.Transport.Send
  - of: (*Node).nextID
    steps:
      - opt:
          do:
            - set: n.subEpoch, n.subCount
              value: newSubEpoch(), 0
          when: n.subCount == ^uint32(0)
      - op: ++
        set: n.subCount
      - return: n.subEpoch | uint64(n.subCount)
  - of: (*Node).forwardAnswered
    participants:
      - id: caller
        kind: actor
      - id: (*Node).forwardAnswered
        kind: self
      - id: n.dropForward
        kind: internal
      - id: n.appended
        kind: internal
    steps:
      - bind: p, ok
        eval: n.forwards[m.Context]
      - opt:
          do:
            - return: ""
          when: "!ok"
      - eval: n.dropForward(m.Context)
        to: n.dropForward
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(sentinelOf(m.Code), errs.String(\"leader\", coreconsensus.NodeID(m.RejectHint).String()))}"
            - return: ""
          when: m.Reject
      - eval: "n.appended(p, coreconsensus.PositionValue{Term: m.LogTerm, Index: m.Index}, false)"
        to: n.appended
  - of: ProposeAs
    participants:
      - id: caller
        kind: actor
      - id: ProposeAs
        kind: self
      - id: r.Propose
        kind: value
    steps:
      - var:
          name: zero
          type: R
      - bind: tok, v, err
        eval: r.Propose(ctx, data)
        to: r.Propose
      - opt:
          do:
            - return: tok, zero, err
          when: err != nil
      - opt:
          do:
            - return: tok, zero, nil
          when: v == nil
      - bind: out, ok
        eval: v.(R)
      - opt:
          do:
            - return: tok, zero, withToken(coreconsensus.ResultTypeMismatch, tok)
          when: "!ok"
      - return: tok, out, nil
  - of: (*Node).Barrier
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Barrier
        kind: self
      - id: n.clk.Now
        kind: value
      - id: w.gone.Store
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.token
        kind: internal
      - id: n.am.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: n.stopped.Load()
      - bind: w
        eval: "&readWait{done: make(chan readResult, 1)}"
      - bind: noLease
        eval: n.cfg.Reads != ReadLease
      - bind: start
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: mode
        eval: "\"read_index\""
      - opt:
          do:
            - set: mode
              value: "\"lease\""
          when: "!noLease"
      - defer: func() { n.obs.record(mBarrierLatency, n.clk.Since(start).Seconds(), coreotel.String("mode", mode)) }()
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: |-
            !n.exec(func() {
            		ctx := n.nextID()
            		w.sentAt = n.clk.Now()
            		w.askedAt = w.sentAt
            		n.reads[ctx] = w
            		n.r.ReadIndex(w.sentAt, ctx, noLease)
            		n.handleReady()
            	})
      - var:
          name: res
          type: readResult
      - select:
          cases:
            - comm: res = <-w.done
            - comm: <-ctx.Done()
              do:
                - eval: w.gone.Store(true)
                  to: w.gone.Store
                - return: coreconsensus.TokenValue{}, origin(coreconsensus.LeadershipUnconfirmed, errs.String("cause", ctx.Err().Error()))
      - switch:
          cases:
            - case: "0"
            - case: coreconsensus.CodeNodeStopped
              do:
                - return: coreconsensus.TokenValue{}, n.stoppedErr()
            - default: true
              do:
                - return: coreconsensus.TokenValue{}, origin(sentinelOf(res.code), errs.String("leader", n.Status().Leader.String()))
          "on": res.code
      - opt:
          do:
            - opt:
                do:
                  - return: coreconsensus.TokenValue{}, ctx.Err()
                when: ctx.Err() != nil
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: "!n.waitApplied(ctx.Done(), res.index)"
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: tok
        eval: "n.token(coreconsensus.PositionValue{Term: n.appliedTerm, Index: n.applied})"
        to: n.token
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - return: tok, nil
  - of: (*Node).WaitApplied
    participants:
      - id: caller
        kind: actor
      - id: (*Node).WaitApplied
        kind: self
      - id: n.token
        kind: internal
      - id: origin
        kind: internal
      - id: ctx.Err
        kind: value
      - id: n.stoppedErr
        kind: internal
      - id: n.appliedAs
        kind: internal
    steps:
      - bind: want
        eval: n.token(t.Position())
        to: n.token
      - opt:
          do:
            - return: origin(coreconsensus.LineageMismatch)
              to: origin
          when: t.Cluster != want.Cluster || t.Epoch != want.Epoch
      - opt:
          do:
            - opt:
                do:
                  - return: ctx.Err()
                    to: ctx.Err
                when: ctx.Err() != nil
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: "!n.waitApplied(ctx.Done(), t.Index)"
      - return: n.appliedAs(t)
        to: n.appliedAs
  - of: (*Node).appliedAs
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appliedAs
        kind: self
      - id: n.appliedTermAt
        kind: internal
      - id: n.stoppedErr
        kind: internal
      - id: n.lineage
        kind: internal
      - id: origin
        kind: internal
      - id: withToken
        kind: internal
    steps:
      - bind: term, known, ok
        eval: n.appliedTermAt(t.Index)
        to: n.appliedTermAt
      - opt:
          do:
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: "!ok"
      - bind: l
        eval: n.lineage()
        to: n.lineage
      - bind: kept
        eval: l.Predecessor != (coreconsensus.ClusterID{}) && t.Index <= l.KeptIndex && t.Index > l.AdoptedFrom
      - switch:
          cases:
            - case: known && term == t.Term, !known && !kept
              do:
                - return: nil
            - case: "!known"
              do:
                - return: origin(coreconsensus.LineageMismatch, errs.String("why", "the predecessor's entry at this index can no longer be read"))
                  to: origin
            - case: kept
              do:
                - return: origin(coreconsensus.LineageMismatch, errs.String("why", "the predecessor's entry at this index is not the one kept"))
                  to: origin
            - default: true
              do:
                - return: "withToken(coreconsensus.EntrySuperseded, n.token(coreconsensus.PositionValue{Term: term, Index: t.Index}))"
                  to: withToken
  - of: (*Node).appliedTermAt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appliedTermAt
        kind: self
      - id: n.cfg.Log.Bounds
        kind: value
      - id: n.cfg.Log.Term
        kind: value
    steps:
      - opt:
          do:
            - return: 0, false, false
          when: |-
            !n.exec(func() {
            		if index <= n.r.Status().Commit {
            			term, known = n.r.TermAt(index)
            		}
            	})
      - opt:
          do:
            - return: term, known, true
          when: known || index > n.logApplied.Load()
      - opt:
          do:
            - return: 0, false, true
          init:
            bind: first, _
            eval: n.cfg.Log.Bounds()
            to: n.cfg.Log.Bounds
          when: index+1 < first
      - bind: t, err
        eval: n.cfg.Log.Term(index)
        to: n.cfg.Log.Term
      - return: t, err == nil, true
  - of: (*Node).admin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).admin
        kind: self
      - id: origin
        kind: internal
      - id: wire
        kind: package
      - id: n.submit
        kind: internal
      - id: err.Error
        kind: value
      - id: n.obs.warn
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.MembershipInvalid, errs.String("why", "operator"))
              to: origin
          when: "!coreconsensus.Operator(a.Operator).Valid()"
      - bind: data
        eval: wire.AppendAdmin(nil, &a)
        to: wire
      - bind: _, _, err
        eval: "n.submit(ctx, coreconsensus.EntryValue{Kind: kind, BodySum: wire.BodySum(data), Data: data}, true)"
        to: n.submit
      - bind: outcome
        eval: "\"ok\""
      - opt:
          do:
            - set: outcome
              to: err.Error
              value: err.Error()
          when: err != nil
      - eval: |-
          n.obs.warn("consensus: administrative operation", lstr("operator", a.Operator), lattr("kind", uint64(kind)),
          		lattr("change", uint64(a.Change)), lattr("target", uint64(a.Target)), lstr("outcome", outcome))
        to: n.obs.warn
      - return: err
  - of: (*Node).AddLearner
    participants:
      - id: caller
        kind: actor
      - id: (*Node).AddLearner
        kind: self
      - id: n.admin
        kind: internal
    steps:
      - return: |-
          n.admin(ctx, coreconsensus.EntryMembership, wire.AdminValue{
          		Operator: string(op), Change: wire.ChangeAddLearner,
          		Target: m.ID, Membership: coreconsensus.MembershipValue{Members: []coreconsensus.MemberValue{m}},
          	})
        to: n.admin
  - of: (*Node).Promote
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Promote
        kind: self
      - id: n.Membership().Member
        kind: value
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: origin
        kind: internal
      - id: n.admin
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.snapState.mu.Lock()
              to: n.snapState.mu.Lock
            - bind: newest
              eval: n.snapState.newestBytes
            - eval: n.snapState.mu.Unlock()
              to: n.snapState.mu.Unlock
            - opt:
                do:
                  - return: |-
                      origin(coreconsensus.MembershipInvalid, errs.String("why", "the learner's snapshot limit is below the newest snapshot"),
                      				errs.Int64("limit", m.MaxSnapshotBytes), errs.Int64("bytes", newest))
                    to: origin
                when: newest > m.MaxSnapshotBytes
          init:
            bind: m, ok
            eval: n.Membership().Member(id)
            to: n.Membership().Member
          when: ok && m.MaxSnapshotBytes > 0
      - return: "n.admin(ctx, coreconsensus.EntryMembership, wire.AdminValue{Operator: string(op), Change: wire.ChangePromote, Target: id})"
        to: n.admin
  - of: (*Node).Remove
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Remove
        kind: self
      - id: n.Status
        kind: internal
      - id: n.admin
        kind: internal
      - id: n.handOff
        kind: internal
      - id: n.successorOf
        kind: internal
      - id: origin
        kind: internal
      - id: n.TransferLeadership
        kind: internal
      - id: n.removeAfterTransfer
        kind: internal
    steps:
      - bind: remove
        eval: "wire.AdminValue{Operator: string(op), Change: wire.ChangeRemove, Target: id}"
      - bind: st
        eval: n.Status()
        to: n.Status
      - switch:
          cases:
            - case: st.Leader != id
              do:
                - return: n.admin(ctx, coreconsensus.EntryMembership, remove)
                  to: n.admin
            - case: id == n.stamp.ID
              do:
                - eval: n.handOff(ctx)
                  to: n.handOff
            - default: true
              do:
                - bind: to, ok
                  eval: n.successorOf(id)
                  to: n.successorOf
                - opt:
                    do:
                      - return: origin(coreconsensus.MembershipInvalid, errs.String("why", "no other voter to lead"))
                        to: origin
                    when: "!ok"
                - opt:
                    do:
                      - return: err
                    init:
                      bind: err
                      eval: n.TransferLeadership(ctx, op, to)
                      to: n.TransferLeadership
                    when: err != nil
      - return: n.removeAfterTransfer(ctx, remove)
        to: n.removeAfterTransfer
  - of: (*Node).successorOf
    participants:
      - id: caller
        kind: actor
      - id: (*Node).successorOf
        kind: self
      - id: n.Membership
        kind: internal
      - id: conf.Member
        kind: value
    steps:
      - bind: conf
        eval: n.Membership()
        to: n.Membership
      - opt:
          do:
            - return: n.stamp.ID, true
          init:
            bind: m, ok
            eval: conf.Member(n.stamp.ID)
            to: conf.Member
          when: ok && m.Voter
      - loop:
          do:
            - opt:
                do:
                  - return: m.ID, true
                when: m.Voter && m.ID != id
          key: _
          range: conf.Members
          value: m
      - return: 0, false
  - of: (*Node).removeAfterTransfer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).removeAfterTransfer
        kind: self
      - id: n.clk.Now().Add
        kind: value
      - id: n.admin
        kind: internal
    steps:
      - bind: timing
        eval: n.Status().Timing
      - bind: deadline
        eval: n.clk.Now().Add(2 * timing.ElectionTimeoutMax)
        to: n.clk.Now().Add
      - loop:
          do:
            - bind: err
              eval: n.admin(ctx, coreconsensus.EntryMembership, remove)
              to: n.admin
            - opt:
                do:
                  - return: err
                when: "!errs.HasCode(err, coreconsensus.CodeMembershipChangePending) || !n.clk.Now().Before(deadline)"
            - opt:
                do:
                  - return: err
                when: "!n.pause(ctx, timing.HeartbeatInterval)"
          forever: true
  - of: (*Node).pause
    participants:
      - id: caller
        kind: actor
      - id: (*Node).pause
        kind: self
      - id: n.clk.NewTimer
        kind: value
      - id: t.Stop
        kind: value
    steps:
      - bind: t
        eval: n.clk.NewTimer(d)
        to: n.clk.NewTimer
      - defer: t.Stop()
        to: t.Stop
      - select:
          cases:
            - comm: <-t.C()
              do:
                - return: "true"
            - comm: <-ctx.Done()
              do:
                - return: "false"
