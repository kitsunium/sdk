    steps:
      - opt:
          do:
            - return: acceptBackoffFirst
          when: prev == 0
      - return: min(2*prev, acceptBackoffCeiling)
  - of: (*TCPTransport).serve
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serve
        kind: self
      - id: t.wg.Done
        kind: value
      - id: t.handshake
        kind: internal
      - id: parseSAN
        kind: internal
      - id: t.serveAuthenticated
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
