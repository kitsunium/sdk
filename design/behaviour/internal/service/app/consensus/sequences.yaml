      - id: caller
        kind: actor
      - id: decodeStamp
        kind: self
      - id: binary.LittleEndian.Uint64
        kind: value
      - id: coreconsensus
        kind: package
    steps:
      - var:
          name: s
          type: coreconsensus.StampValue
      - opt:
          do:
            - return: s, false
          when: len(b) < stampFixed+4 || b[0] != stampVersion
      - bind: body
        eval: b[:len(b)-4]
      - opt:
          do:
            - return: s, false
          when: crc32.Checksum(body, castagnoli) != binary.LittleEndian.Uint32(b[len(b)-4:])
      - bind: p
        eval: "1"
      - eval: copy(s.Log.Cluster[:], body[p:])
      - op: +=
        set: p
        value: len(s.Log.Cluster)
      - set: s.Log.Epoch
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - eval: copy(s.Log.Predecessor[:], body[p:])
      - op: +=
        set: p
        value: len(s.Log.Predecessor)
      - set: s.Log.PredecessorEpoch
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - set: s.Log.KeptIndex
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - set: s.ID
