      - return: "n.admin(ctx, coreconsensus.EntryClusterVersion, wire.AdminValue{Operator: string(op), Pre: pre, ClusterVersion: v})"
        to: n.admin
  - of: (*Node).ClearNoSpace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).ClearNoSpace
        kind: self
      - id: n.admin
        kind: internal
    steps:
      - return: "n.admin(ctx, coreconsensus.EntryNoSpaceClear, wire.AdminValue{Operator: string(op), Pre: pre})"
        to: n.admin
  - of: (*Node).TransferLeadership
    participants:
      - id: caller
        kind: actor
      - id: (*Node).TransferLeadership
        kind: self
      - id: n.admin
        kind: internal
      - id: n.awaitLeader
        kind: internal
      - id: n.confirmLeader
        kind: internal
    steps:
      - bind: err
        eval: "n.admin(ctx, coreconsensus.EntryTransfer, wire.AdminValue{Operator: string(op), Target: to})"
        to: n.admin
      - switch:
          cases:
            - case: err == nil, errs.HasCode(err, coreconsensus.CodeOutcomeUnknown)
              do:
                - return: n.awaitLeader(ctx, to)
                  to: n.awaitLeader
            - case: n.Status().Leader == to
              do:
                - return: n.confirmLeader(ctx, to, err)
                  to: n.confirmLeader
      - return: err
  - of: (*Node).confirmLeader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).confirmLeader
        kind: self
      - id: n.Barrier
        kind: internal
