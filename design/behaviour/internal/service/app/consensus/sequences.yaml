            - return: ""
          when: through <= n.cfg.SnapshotTrailing
      - op: "-="
        set: through
        value: n.cfg.SnapshotTrailing
      - eval: |-
          n.exec(func() {
          		n.r.Compact(through)
          		n.handleReady()
          	})
        to: n.exec
