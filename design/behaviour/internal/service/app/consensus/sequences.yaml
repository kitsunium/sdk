      - opt:
          do:
            - set: n.results[e.Position.Index]
              value: "applyResult{term: e.Position.Term, val: val}"
            - set: n.resultOrder
              value: append(n.resultOrder, e.Position.Index)
            - loop:
                cond: len(n.resultOrder) > 4096
                do:
                  - eval: delete(n.results, n.resultOrder[0])
                  - set: n.resultOrder
                    value: n.resultOrder[1:]
          when: n.keepResults > 0
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - opt:
          do:
            - return: ""
          when: w == nil
      - opt:
          do:
            - eval: n.pendingBytes.Add(-int64(len(w.entry.Data)))
              to: n.pendingBytes.Add
          when: w.local
      - bind: tok
        eval: n.token(e.Position)
        to: n.token
      - opt:
          do:
            - send:
                chan: w.done
                value: "propResult{err: withToken(coreconsensus.EntrySuperseded, tok)}"
            - return: ""
          when: w.pos.Term != e.Position.Term
      - send:
          chan: w.done
          value: "propResult{tok: tok, val: val}"
  - of: (*Node).waitApplied
    participants:
      - id: caller
        kind: actor
      - id: (*Node).waitApplied
        kind: self
      - id: n.acond.Wait
        kind: value
    steps:
      - bind: stopWake
        eval: make(chan struct{})
      - defer: close(stopWake)
      - go: |-
          func() {
          		select {
          		case <-done:
          		case <-n.loopDone:
          		case <-stopWake:
          			return
          		}
          		n.am.Lock()
          		n.acond.Broadcast()
          		n.am.Unlock()
          	}()
      - lock:
          mutex: n.am
      - loop:
          cond: n.applied < index
          do:
            - select:
                cases:
                  - comm: <-done
                    do:
                      - return: "false"
                  - comm: <-n.loopDone
                    do:
                      - return: "false"
                  - default: true
            - eval: n.acond.Wait()
              to: n.acond.Wait
      - return: "true"
  - of: unsupportedKind
    participants:
      - id: caller
        kind: actor
      - id: unsupportedKind
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.VersionUnsupported, errs.Int("kind", int(k)), errs.String("index", u64s(index)))
        to: origin
  - of: foundingDigest
    participants:
      - id: caller
        kind: actor
      - id: foundingDigest
        kind: self
      - id: sha256
        kind: stdlib
    steps:
      - return: "sha256.Sum256(wire.AppendMembership(nil, &coreconsensus.MembershipValue{Members: byID(members)}))"
        to: sha256
  - of: byID
    participants:
      - id: caller
        kind: actor
      - id: byID
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: ms
        eval: slices.Clone(members)
        to: slices
      - eval: |-
          slices.SortFunc(ms, func(a, b coreconsensus.MemberValue) int {
          		switch {
          		case a.ID < b.ID:
          			return -1
          		case a.ID > b.ID:
          			return 1
          		}
          		return 0
          	})
        to: slices
      - return: ms
  - of: Bootstrap
    participants:
      - id: caller
        kind: actor
      - id: Bootstrap
        kind: self
      - id: ctx.Err
        kind: value
      - id: misconfigured
        kind: internal
      - id: checkFounders
        kind: internal
      - id: foundingTiming
        kind: internal
      - id: founderStamp
        kind: internal
      - id: checkSelfListed
        kind: internal
      - id: foundingDigest
        kind: internal
      - id: advanceFounding
        kind: internal
      - id: writeFoundingEntry
        kind: internal
      - id: cfg.Log.WriteStamp
        kind: value
      - id: storageFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: misconfigured("Log", "nil")
              to: misconfigured
          when: cfg.Log == nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkFounders(members, cfg.MinVoters)
            to: checkFounders
          when: err != nil
      - bind: timing, err
        eval: foundingTiming(cfg)
        to: foundingTiming
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: stamp, err
        eval: founderStamp(cfg)
        to: founderStamp
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkSelfListed(members, &stamp)
            to: checkSelfListed
          when: err != nil
      - bind: digest
        eval: foundingDigest(members)
        to: foundingDigest
      - opt:
          do:
            - return: err
          init:
            bind: done, err
            eval: advanceFounding(cfg.Log, &stamp, digest)
            to: advanceFounding
          when: done || err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: writeFoundingEntry(cfg, members, timing)
            to: writeFoundingEntry
          when: err != nil
      - set: stamp.State
        value: coreconsensus.StampMember
      - opt:
          do:
            - return: storageFailed("stamp", err)
              to: storageFailed
          init:
            bind: err
            eval: cfg.Log.WriteStamp(stamp)
            to: cfg.Log.WriteStamp
          when: err != nil
      - return: nil
  - of: checkFounders
    participants:
      - id: caller
        kind: actor
      - id: checkFounders
        kind: self
      - id: origin
        kind: internal
      - id: misconfigured
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.BootstrapRefused, errs.String("why", "no member"))
              to: origin
          when: len(members) == 0
      - var:
          name: noPin
          type: "[32]byte"
      - bind: seen
        eval: map[coreconsensus.NodeID]bool{}
      - loop:
          do:
            - opt:
                do:
                  - return: origin(coreconsensus.BootstrapRefused, errs.String("why", "a zero or repeated id"))
                    to: origin
                when: m.ID == 0 || seen[m.ID]
            - opt:
                do:
                  - return: origin(coreconsensus.BootstrapRefused, errs.String("why", "a member without an SPKI pin"))
                    to: origin
                when: m.SPKI == noPin
            - set: seen[m.ID]
              value: "true"
          key: _
          range: members
          value: m
      - opt:
          do:
            - return: origin(coreconsensus.BootstrapRefused, errs.String("why", "two members under one key"))
              to: origin
          when: sharedKey(members)
      - opt:
          do:
            - return: misconfigured("MinVoters", "above the founding voter count")
              to: misconfigured
          when: minVoters > countVoters(members)
      - return: nil
  - of: founderStamp
    participants:
      - id: caller
        kind: actor
      - id: founderStamp
        kind: self
      - id: cfg.Log.Stamp
        kind: value
    steps:
      - bind: stamp, err
        eval: cfg.Log.Stamp()
        to: cfg.Log.Stamp
      - opt:
          do:
            - return: stamp, storageFailed("stamp", err)
          when: err != nil
      - opt:
          do:
            - return: "stamp, origin(coreconsensus.BootstrapRefused, errs.String(\"why\", \"unstamped: Init first\"))"
          when: stamp.State == 0
      - opt:
          do:
            - return: stamp, origin(coreconsensus.DataDirMismatch, errs.String("why", "cluster or node id"))
          when: stamp.Log.Cluster != cfg.Cluster || (cfg.ID != 0 && cfg.ID != stamp.ID)
      - return: stamp, nil
  - of: checkSelfListed
    participants:
      - id: caller
        kind: actor
      - id: checkSelfListed
        kind: self
      - id: slices
        kind: stdlib
      - id: origin
        kind: internal
    steps:
      - bind: self
        eval: slices.IndexFunc(members, func(m coreconsensus.MemberValue) bool { return m.ID == stamp.ID })
        to: slices
      - opt:
          do:
            - return: origin(coreconsensus.BootstrapRefused, errs.String("why", "this node is not in the list as stamped"))
              to: origin
          when: self < 0 || members[self].Incarnation != stamp.Incarnation || members[self].Slot != stamp.Slot
      - return: nil
  - of: advanceFounding
    participants:
      - id: caller
        kind: actor
      - id: advanceFounding
        kind: self
      - id: log.Bounds
        kind: value
      - id: log.WriteStamp
        kind: value
    steps:
      - switch:
          cases:
            - case: coreconsensus.StampMember
              do:
                - opt:
                    do:
                      - return: true, nil
                    when: stamp.Founding == digest
                - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "already founded with another list"))
            - case: coreconsensus.StampBootstrapPending
              do:
                - opt:
                    do:
                      - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "bootstrap pending with another list"))
                    when: stamp.Founding != digest
            - case: coreconsensus.StampJoining
              do:
                - opt:
                    do:
                      - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "the log already holds entries"))
                    init:
                      bind: first, last
                      eval: log.Bounds()
                      to: log.Bounds
                    when: last >= first
                - set: stamp.State, stamp.Founding
                  value: coreconsensus.StampBootstrapPending, digest
                - opt:
                    do:
                      - return: false, storageFailed("stamp", err)
                    init:
                      bind: err
                      eval: log.WriteStamp(*stamp)
                      to: log.WriteStamp
                    when: err != nil
            - default: true
              do:
                - return: false, origin(coreconsensus.DataDirMismatch, errs.String("why", "unknown stamp state"))
          "on": stamp.State
      - return: false, nil
  - of: foundingTiming
    participants:
      - id: caller
        kind: actor
      - id: foundingTiming
        kind: self
      - id: clampTiming
        kind: internal
      - id: refuseTiming
        kind: internal
    steps:
      - bind: c
        eval: "*cfg"
      - eval: clampTiming(&c.InitialTiming)
        to: clampTiming
      - opt:
          do:
            - return: coreconsensus.TimingContractSpec{}, err
          init:
            bind: err
            eval: refuseTiming(&c)
            to: refuseTiming
          when: err != nil
      - bind: timing
        eval: c.InitialTiming
      - set: timing.Generation
        value: "1"
      - return: timing, nil
  - of: writeFoundingEntry
    participants:
      - id: caller
        kind: actor
      - id: writeFoundingEntry
        kind: self
      - id: cfg.Log.Bounds
        kind: value
      - id: wire
        kind: package
      - id: cfg.Log.Append
        kind: value
      - id: storageFailed
        kind: internal
      - id: cfg.Log.Sync
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          init:
            bind: first, last
            eval: cfg.Log.Bounds()
            to: cfg.Log.Bounds
          when: last >= first
      - bind: conf
        eval: "coreconsensus.MembershipValue{Members: byID(members)}"
      - loop:
          do:
            - set: conf.Members[i].Joining
              value: "false"
          key: i
          range: conf.Members
      - bind: data
        eval: "wire.AppendAdmin(nil, &wire.AdminValue{Operator: \"bootstrap\", Change: wire.ChangeFounding, Membership: conf, Contract: timing})"
        to: wire
      - bind: e
        eval: |-
          coreconsensus.EntryValue{
          		Position: coreconsensus.PositionValue{Term: 1, Index: 1}, Kind: coreconsensus.EntryMembership,
          		BodySum: wire.BodySum(data), Data: data,
          	}
      - set: e.ChainSum
        to: wire
        value: wire.ChainSum(0, &e)
      - bind: hs
        eval: "new(coreconsensus.HardState{Term: 1, Commit: 1})"
      - opt:
          do:
            - return: storageFailed("append", err)
              to: storageFailed
          init:
            bind: err
            eval: cfg.Log.Append([]coreconsensus.EntryValue{e}, hs)
            to: cfg.Log.Append
          when: err != nil
      - opt:
          do:
            - return: storageFailed("sync", err)
              to: storageFailed
          init:
            bind: err
            eval: cfg.Log.Sync()
            to: cfg.Log.Sync
          when: err != nil
      - return: nil
  - of: TimingDefaults
    steps:
      - return: |-
          coreconsensus.TimingContractSpec{
          		Generation: 1, HeartbeatInterval: 100 * time.Millisecond,
          		ElectionTimeoutMin: time.Second, ElectionTimeoutMax: 2 * time.Second,
          	}
  - of: misconfigured
    participants:
      - id: caller
        kind: actor
      - id: misconfigured
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreconsensus.ConsensusMisconfigured, errs.WrapParams{},
          		errs.String("field", field), errs.String("why", why))
        to: errs
  - of: clampInt
    steps:
      - opt:
          do:
            - set: "*v"
              value: d
          when: "*v <= 0"
  - of: clampInt64
    steps:
      - opt:
          do:
            - set: "*v"
              value: d
          when: "*v <= 0"
  - of: clampU64
    steps:
      - opt:
          do:
            - set: "*v"
              value: d
          when: "*v == 0"
  - of: withDefaults
    participants:
      - id: caller
        kind: actor
      - id: withDefaults
        kind: self
      - id: clampDefaults
        kind: internal
      - id: refuseIncoherent
        kind: internal
    steps:
      - bind: c
        eval: "*cfg"
      - eval: clampDefaults(&c)
        to: clampDefaults
      - opt:
          do:
            - return: c, err
          init:
            bind: err
            eval: refuseIncoherent(&c)
            to: refuseIncoherent
          when: err != nil
      - return: c, refuseDurability(&c)
  - of: clampDefaults
    participants:
      - id: caller
        kind: actor
      - id: clampDefaults
        kind: self
      - id: clampTiming
        kind: internal
      - id: clampInt
        kind: internal
      - id: clampInt64
        kind: internal
      - id: clampU64
        kind: internal
      - id: defaultCodec
        kind: internal
    steps:
      - opt:
          do:
            - set: c.Group
              value: "1"
          when: c.Group == 0
      - opt:
          do:
            - set: c.Clock
              value: clock.System
          when: c.Clock == nil
      - eval: clampTiming(&c.InitialTiming)
        to: clampTiming
      - eval: clampInt(&c.MaxBatchBytes, 1<<20)
        to: clampInt
      - eval: clampInt(&c.MaxInflight, 64)
        to: clampInt
      - eval: clampInt(&c.MaxInflightBytes, 8<<20)
        to: clampInt
      - eval: clampInt(&c.MaxEntryBytes, 1<<20)
        to: clampInt
      - eval: clampInt64(&c.MaxPendingBytes, 64<<20)
        to: clampInt64
      - eval: clampInt64(&c.MaxApplyLagBytes, 256<<20)
        to: clampInt64
      - eval: clampInt64(&c.RecentEntriesBytes, 32<<20)
        to: clampInt64
      - eval: clampU64(&c.SnapshotEvery, 16384)
        to: clampU64
      - eval: clampInt64(&c.SnapshotEveryBytes, 64<<20)
        to: clampInt64
      - eval: clampU64(&c.SnapshotTrailing, 4096)
        to: clampU64
      - eval: clampInt64(&c.LogReserveBytes, 256<<20)
        to: clampInt64
      - eval: clampInt(&c.MinVoters, 3)
        to: clampInt
      - eval: clampU64(&c.PromoteLag, 1024)
        to: clampU64
      - opt:
          do:
            - set: c.HardCloseTimeout
              value: 5 * time.Second
          when: c.HardCloseTimeout <= 0
      - opt:
          do:
            - opt:
                do:
                  - set: c.SnapshotCodec
                    value: codec
                init:
                  bind: codec, ok
                  eval: defaultCodec()
                  to: defaultCodec
                when: ok
          when: c.SnapshotCodec == nil
  - of: clampTiming
    participants:
      - id: caller
        kind: actor
      - id: clampTiming
        kind: self
      - id: TimingDefaults
        kind: internal
    steps:
      - bind: def
        eval: TimingDefaults()
        to: TimingDefaults
      - opt:
          do:
            - set: timing.Generation
              value: "1"
          when: timing.Generation == 0
      - opt:
          do:
            - set: timing.HeartbeatInterval
              value: def.HeartbeatInterval
          when: timing.HeartbeatInterval <= 0
      - opt:
          do:
            - set: timing.ElectionTimeoutMin
              value: def.ElectionTimeoutMin
          when: timing.ElectionTimeoutMin <= 0
      - opt:
          do:
            - set: timing.ElectionTimeoutMax
              value: max(def.ElectionTimeoutMax, 2*timing.ElectionTimeoutMin)
          when: timing.ElectionTimeoutMax <= 0
  - of: refuseIncoherent
    participants:
      - id: caller
        kind: actor
      - id: refuseIncoherent
        kind: self
      - id: refuseNilPorts
        kind: internal
      - id: refuseTiming
        kind: internal
      - id: refuseBounds
        kind: internal
      - id: refuseCeilings
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: refuseNilPorts(c)
            to: refuseNilPorts
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: refuseTiming(c)
            to: refuseTiming
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: refuseBounds(c)
            to: refuseBounds
          when: err != nil
      - return: refuseCeilings(c)
        to: refuseCeilings
  - of: refuseNilPorts
    participants:
      - id: caller
        kind: actor
      - id: refuseNilPorts
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.Machine == nil
              do:
                - return: misconfigured("Machine", "nil")
                  to: misconfigured
            - case: c.Log == nil
              do:
                - return: misconfigured("Log", "nil")
                  to: misconfigured
            - case: c.Snapshots == nil
              do:
                - return: misconfigured("Snapshots", "nil")
                  to: misconfigured
            - case: c.Transport == nil
              do:
                - return: misconfigured("Transport", "nil")
                  to: misconfigured
            - case: c.SnapshotCodec == nil
              do:
                - return: misconfigured("SnapshotCodec", "no bounded decompressor")
                  to: misconfigured
      - return: nil
  - of: refuseTiming
    participants:
      - id: caller
        kind: actor
      - id: refuseTiming
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - bind: timing
        eval: "&c.InitialTiming"
      - switch:
          cases:
            - case: timing.HeartbeatInterval*5 > timing.ElectionTimeoutMin
              do:
                - return: misconfigured("InitialTiming.HeartbeatInterval", "not below a fifth of ElectionTimeoutMin")
                  to: misconfigured
            - case: timing.ElectionTimeoutMax <= timing.ElectionTimeoutMin
              do:
                - return: misconfigured("InitialTiming.ElectionTimeoutMax", "not above ElectionTimeoutMin")
                  to: misconfigured
            - case: c.Reads == ReadLease && (math.IsNaN(timing.MaxClockDrift) || timing.MaxClockDrift <= 0 || timing.MaxClockDrift >= 1)
              do:
                - return: misconfigured("InitialTiming.MaxClockDrift", "ReadLease needs 0 < drift < 1")
                  to: misconfigured
      - return: nil
  - of: refuseBounds
    participants:
      - id: caller
        kind: actor
      - id: refuseBounds
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.MaxInflightBytes < c.MaxBatchBytes
              do:
                - return: misconfigured("MaxInflightBytes", "below MaxBatchBytes")
                  to: misconfigured
            - case: c.MaxEntryBytes > c.MaxBatchBytes
              do:
                - return: misconfigured("MaxEntryBytes", "above MaxBatchBytes")
                  to: misconfigured
            - case: int64(c.MaxEntryBytes) > c.MaxPendingBytes
              do:
                - return: misconfigured("MaxPendingBytes", "below MaxEntryBytes")
                  to: misconfigured
            - case: framesBelow(c.Transport, c.MaxBatchBytes+batchFrameOverhead)
              do:
                - return: misconfigured("MaxBatchBytes", "above the transport's MaxFrameBytes")
                  to: misconfigured
      - return: nil
  - of: refuseCeilings
    participants:
      - id: caller
        kind: actor
      - id: refuseCeilings
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.MaxSnapshotBytes <= 0
              do:
                - return: misconfigured("MaxSnapshotBytes", "zero")
                  to: misconfigured
            - case: c.MaxSnapshotBytes < c.SnapshotEveryBytes
              do:
                - return: misconfigured("MaxSnapshotBytes", "below SnapshotEveryBytes")
                  to: misconfigured
            - case: c.MaxLogBytes <= 0
              do:
                - return: misconfigured("MaxLogBytes", "zero")
                  to: misconfigured
            - case: c.LogReserveBytes >= c.MaxLogBytes
              do:
                - return: misconfigured("LogReserveBytes", "not below MaxLogBytes")
                  to: misconfigured
      - return: nil
  - of: refuseDurability
    participants:
      - id: caller
        kind: actor
      - id: refuseDurability
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - bind: _, durable
        eval: c.Machine.(coreconsensus.DurableStateMachine)
      - switch:
          cases:
            - case: DurabilityVolatile
              do:
                - opt:
                    do:
                      - return: misconfigured("Durability", "volatile, but the machine is a DurableStateMachine")
                        to: misconfigured
                    when: durable
            - case: DurabilityDurable
              do:
                - opt:
                    do:
                      - return: misconfigured("Durability", "durable, but the machine has no AppliedPosition")
                        to: misconfigured
                    when: "!durable"
            - default: true
              do:
                - return: misconfigured("Durability", "unset")
                  to: misconfigured
          "on": c.Durability
      - return: nil
  - of: (*Config).MemoryBudget
    steps:
      - return: c.MaxPendingBytes + c.MaxApplyLagBytes + c.RecentEntriesBytes + int64(peers)*int64(c.MaxInflightBytes)
  - of: defaultCodec
    steps:
      - bind: codec, ok
        eval: svctransform.FlateCompressor.(coretransform.BoundedDecompressor)
      - return: codec, ok
  - of: framesBelow
    steps:
      - bind: f, ok
        eval: t.(interface{ maxFrameBytes() int })
      - return: ok && f.maxFrameBytes() < n
  - of: NewDataDir
    participants:
      - id: caller
        kind: actor
      - id: NewDataDir
        kind: self
      - id: NewDataDirWith
        kind: internal
    steps:
      - return: NewDataDirWith(dir, DataDirOptions{})
        to: NewDataDirWith
  - of: NewDataDirWith
    participants:
      - id: caller
        kind: actor
      - id: NewDataDirWith
        kind: self
      - id: refuseUnmarked
        kind: internal
      - id: mkdirDurable
        kind: internal
      - id: os
        kind: stdlib
      - id: flock
        kind: package
      - id: d.open
        kind: internal
      - id: alsoFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: DataDir{}, err
          init:
            bind: err
            eval: refuseUnmarked(dir)
            to: refuseUnmarked
          when: err != nil
      - opt:
          do:
            - return: DataDir{}, coreproc.UnsupportedPlatform
          when: "!flock.Native"
      - opt:
          do:
            - return: DataDir{}, err
          init:
            bind: err
            eval: mkdirDurable(dir)
            to: mkdirDurable
          when: err != nil
      - bind: d
        eval: "&dataDir{dir: dir, opts: opts}"
      - bind: lf, err
        eval: os.OpenFile(filepath.Join(dir, fileLock), os.O_RDWR|os.O_CREATE, 0o600)
        to: os
      - opt:
          do:
            - return: DataDir{}, storageFailed("lock", err)
          when: err != nil
      - set: d.lockf
        value: lf
      - bind: held, err
        eval: flock.TryLock(lf)
        to: flock
      - opt:
          do:
            - return: DataDir{}, alsoFailed(storageFailed("lock", err), "close", lf.Close())
          when: err != nil
      - opt:
          do:
            - return: DataDir{}, alsoFailed(origin(coreconsensus.DataDirLocked, errs.String("dir", dir)), "close", lf.Close())
          when: "!held"
      - opt:
          do:
            - set: err
              to: alsoFailed
              value: alsoFailed(err, "unlock", flock.Unlock(lf))
            - return: DataDir{}, alsoFailed(err, "close", lf.Close())
          init:
            bind: err
            eval: d.open()
            to: d.open
          when: err != nil
      - return: "DataDir{d: d}, nil"
  - of: (*dataDir).open
    participants:
      - id: caller
        kind: actor
      - id: (*dataDir).open
        kind: self
      - id: openFileLog
        kind: internal
      - id: newFileSnapshots
        kind: internal
      - id: alsoFailed
        kind: internal
    steps:
      - bind: l, err
        eval: openFileLog(d, d.opts.SegmentBytes)
        to: openFileLog
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: s, err
        eval: newFileSnapshots(filepath.Join(d.dir, "snap"), l.syncFailedAtOpen)
        to: newFileSnapshots
      - opt:
          do:
            - return: alsoFailed(err, "close log", l.Close())
              to: alsoFailed
          when: err != nil
      - set: d.log, d.snaps
        value: l, s
      - return: nil
  - of: DataDir.Dir
    steps:
      - return: d.d.dir
  - of: DataDir.Log
    steps:
      - return: d.d.log
  - of: DataDir.Snapshots
    steps:
      - return: d.d.snaps
  - of: DataDir.Close
    participants:
      - id: caller
        kind: actor
      - id: DataDir.Close
        kind: self
      - id: origin
        kind: internal
      - id: d.d.log.Close
        kind: internal
      - id: flock
        kind: package
      - id: storageFailed
        kind: internal
      - id: d.d.lockf.Close
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: d.d == nil
      - lock:
          mutex: d.d.mu
      - opt:
          do:
            - return: nil
          when: d.d.closed
      - opt:
          do:
            - return: origin(coreconsensus.DataDirInUse, errs.String("dir", d.d.dir))
