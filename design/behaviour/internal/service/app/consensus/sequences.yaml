        kind: internal
    steps:
      - switch:
          cases:
            - case: c.Machine == nil
              do:
                - return: misconfigured("Machine", "nil")
                  to: misconfigured
            - case: c.Log == nil
              do:
                - return: misconfigured("Log", "nil")
                  to: misconfigured
            - case: c.Snapshots == nil
              do:
                - return: misconfigured("Snapshots", "nil")
                  to: misconfigured
            - case: c.Transport == nil
