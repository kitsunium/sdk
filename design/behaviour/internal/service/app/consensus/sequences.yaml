          do:
            - return: coreconsensus.StampValue{}, origin(coreconsensus.DataDirMismatch, errs.String("why", "unreadable stamp"))
          when: "!ok"
      - return: s, nil
  - of: writeStamp
    participants:
      - id: caller
        kind: actor
      - id: writeStamp
        kind: self
      - id: writeFileSync
        kind: internal
    steps:
      - return: writeFileSync(filepath.Join(dir, fileStamp), encodeStamp(s))
        to: writeFileSync
  - of: cause.Error
    steps:
      - return: string(c)
  - of: u64s
    participants:
      - id: caller
        kind: actor
      - id: u64s
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - return: strconv.FormatUint(v, 10)
        to: strconv
  - of: origin
    participants:
      - id: caller
        kind: actor
      - id: origin
        kind: self
      - id: errs
        kind: package
    steps:
