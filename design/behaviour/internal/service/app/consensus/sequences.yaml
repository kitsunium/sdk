      - id: p.id.Roots
        kind: value
    steps:
      - return: p.id.Roots()
        to: p.id.Roots
  - of: (*PEMIdentity).GetCertificate
    participants:
      - id: caller
        kind: actor
      - id: (*PEMIdentity).GetCertificate
