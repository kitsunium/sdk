      - id: caller
        kind: actor
      - id: (*chunkReader).next
        kind: self
      - id: io
        kind: stdlib
      - id: snapshotCorrupt
        kind: internal
      - id: origin
        kind: internal
      - id: c.codec.DecompressBounded
        kind: value
      - id: c.sum.Write
        kind: value
