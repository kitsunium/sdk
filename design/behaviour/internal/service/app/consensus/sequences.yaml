      - id: c.sum.Write
        kind: value
      - id: c.codec.Compress
        kind: value
      - id: origin
        kind: internal
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: c.w.Write
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: len(c.buf) == 0
      - eval: c.sum.Write(c.buf)
        to: c.sum.Write
      - bind: enc, err
        eval: c.codec.Compress(c.enc[:0], c.buf)
        to: c.codec.Compress
      - opt:
          do:
            - return: err
          when: err != nil
      - set: c.enc
        value: enc
      - opt:
          do:
            - return: |-
                origin(coreconsensus.SnapshotTooLarge, errs.Int64("limit", c.limit),
                			errs.Int64("decoded", c.decoded+int64(len(c.buf))), errs.Int64("encoded", c.encoded+int64(chunkHeaderLen+len(enc))))
