      - return: "n.admin(ctx, coreconsensus.EntryTimingContract, wire.AdminValue{Operator: string(op), Pre: pre, Contract: c})"
        to: n.admin
  - of: (*Node).RaiseClusterVersion
    participants:
      - id: caller
