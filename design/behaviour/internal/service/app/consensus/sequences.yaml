        eval: |-
          coreconsensus.JoinRequestValue{
          		Cluster: cfg.Stamp.Log.Cluster, ID: cfg.Stamp.ID, Incarnation: cfg.Stamp.Incarnation,
          		Slot: cfg.Stamp.Slot, Address: cfg.Address,
