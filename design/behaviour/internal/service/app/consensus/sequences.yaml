      - set: final.ID
        value: k.id
      - set: k.s.done[k.id]
        value: "&memSnap{meta: final, data: bytes.Clone(k.buf.Bytes())}"
      - eval: delete(k.s.spools, k.id)
      - return: nil
  - of: (*memSink).Abort
    steps:
      - lock:
          mutex: k.s.mu
      - eval: delete(k.s.spools, k.id)
      - return: nil
  - of: (*MemorySnapshots).List
    participants:
      - id: caller
        kind: actor
      - id: (*MemorySnapshots).List
        kind: self
      - id: slices
        kind: stdlib
