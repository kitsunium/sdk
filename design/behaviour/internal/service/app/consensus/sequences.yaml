      - id: caller
        kind: actor
      - id: (*chunkWriter).flush
        kind: self
      - id: c.sum.Write
        kind: value
      - id: c.codec.Compress
        kind: value
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: c.w.Write
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: len(c.buf) == 0
      - eval: c.sum.Write(c.buf)
        to: c.sum.Write
      - bind: enc, err
        eval: c.codec.Compress(c.enc[:0], c.buf)
        to: c.codec.Compress
      - opt:
          do:
            - return: err
          when: err != nil
      - set: c.enc
        value: enc
      - var:
          name: h
          type: "[chunkHeaderLen]byte"
      - eval: binary.LittleEndian.PutUint32(h[0:], uint32(len(enc)))
        to: binary.LittleEndian.PutUint32
      - eval: binary.LittleEndian.PutUint32(h[4:], uint32(len(c.buf)))
        to: binary.LittleEndian.PutUint32
      - eval: binary.LittleEndian.PutUint32(h[8:], crc32.Checksum(enc, castagnoli))
        to: binary.LittleEndian.PutUint32
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: c.w.Write(h[:])
            to: c.w.Write
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: c.w.Write(enc)
            to: c.w.Write
          when: err != nil
      - op: +=
        set: c.encoded
        value: int64(chunkHeaderLen + len(enc))
      - op: +=
        set: c.decoded
        value: int64(len(c.buf))
      - set: c.buf
        value: c.buf[:0]
      - return: nil
