    steps:
      - bind: pe, ok
        eval: errors.AsType[*fs.PathError](cause)
      - return: "!ok || pe.Op != \"open\""
  - of: (*fileLog).positionTail
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).positionTail
        kind: self
      - id: zeroRange
        kind: internal
      - id: storageFailed
        kind: internal
      - id: l.syncFailedAtOpen
        kind: internal
    steps:
      - switch:
          cases:
            - case: last.trimmed >= 0
              do:
                - set: l.off
                  value: last.trimmed
                - opt:
                    do:
                      - opt:
                          do:
                            - return: storageFailed("zero tail", err)
                              to: storageFailed
                          init:
                            bind: err
                            eval: zeroRange(tail.f, l.off, tail.size)
                            to: zeroRange
                          when: err != nil
                      - opt:
                          do:
                            - return: l.syncFailedAtOpen("zero tail", err)
                              to: l.syncFailedAtOpen
                          init:
                            bind: err
                            eval: syncFileAtOpen(tail.f)
                          when: err != nil
                    when: "!allZero(last.data[l.off:])"
            - case: len(last.recs) > 0
              do:
                - bind: lr
                  eval: last.recs[len(last.recs)-1]
                - set: l.off
                  value: lr.off + int64(lr.length)
      - return: nil
  - of: classifyTail
    participants:
      - id: caller
        kind: actor
      - id: classifyTail
        kind: self
      - id: recordsAfter
        kind: internal
      - id: judgeAfterHole
        kind: internal
      - id: tornBatchStart
        kind: internal
    steps:
      - bind: rb
        eval: recs[len(recs)-1]
      - bind: after
        eval: recordsAfter(b, hole)
        to: recordsAfter
      - bind: torn
        eval: rb.batch
      - opt:
          do:
            - set: torn
              value: rb.batch + 1
          when: rb.end
      - opt:
          do:
            - return: "-1, why"
          init:
            bind: why
            eval: judgeAfterHole(after, torn)
            to: judgeAfterHole
          when: why != ""
      - opt:
          do:
            - return: tornBatchStart(recs, rb.off, torn)
              to: tornBatchStart
          when: torn == rb.batch
      - return: hole, ""
  - of: recordsAfter
    participants:
      - id: caller
        kind: actor
      - id: recordsAfter
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: after
          type: "[]record"
      - loop:
          cond: off+recHeader+recFixed <= len(b)
          do:
            - opt:
                do:
                  - set: r.off
                    value: int64(off)
                  - set: after
                    value: append(after, r)
                  - op: +=
                    set: "off"
                    value: r.length - recAlign
                init:
                  bind: r, ok
                  eval: parseRecord(b[off:])
                  to: parseRecord
                when: ok
          init: off := align8(int(hole) + recAlign)
          post: off += recAlign
      - return: after
  - of: tornBatchStart
    steps:
      - bind: start
        eval: lastOff
      - loop:
          cond: i >= 0 && recs[i].batch == torn
          do:
            - set: start
              value: recs[i].off
          init: i := len(recs) - 1
          post: i--
      - opt:
          do:
            - return: "-1, \"torn checkpoint\""
          when: recs[0].batch == torn && start == recs[0].off
      - return: start, ""
  - of: zeroFrom
    participants:
      - id: caller
        kind: actor
      - id: zeroFrom
        kind: self
      - id: zeroRange
        kind: internal
      - id: datasync
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: zeroRange(f, off, size)
            to: zeroRange
          when: err != nil
      - return: datasync(f)
        to: datasync
  - of: zeroRange
    participants:
      - id: caller
        kind: actor
      - id: zeroRange
        kind: self
      - id: f.WriteAt
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: off >= size
      - bind: zero
        eval: make([]byte, min(size-off, 1<<20))
      - loop:
          cond: p < size
          do:
            - bind: "n"
              eval: min(int64(len(zero)), size-p)
            - opt:
                do:
                  - return: err
                init:
                  bind: _, err
                  eval: f.WriteAt(zero[:n], p)
                  to: f.WriteAt
                when: err != nil
            - op: +=
              set: p
              value: "n"
          init: p := off
      - return: nil
  - of: (*fileLog).quarantine
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).quarantine
        kind: self
      - id: quarantined
        kind: internal
      - id: fmt
        kind: stdlib
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - bind: qerr
        eval: quarantined(seg, off, why)
        to: quarantined
      - bind: line
        eval: fmt.Sprintf("%s %d %s\n", segName(seg), off, why)
        to: fmt
      - opt:
          do:
            - return: storageFailed("quarantine marker", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(l.dir, markerQuarantine), []byte(line))
            to: writeFileSync
          when: err != nil
      - return: qerr
  - of: (*fileLog).createSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).createSegment
        kind: self
      - id: appendRecord
        kind: internal
      - id: filepath
        kind: stdlib
      - id: l.segmentFile
        kind: internal
      - id: f.WriteAt
        kind: value
      - id: abandonTmp
        kind: internal
      - id: f.Sync
        kind: value
      - id: f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
      - id: l.occupied.Add
        kind: value
      - id: l.prepare
        kind: internal
    steps:
      - bind: size
        eval: l.segBytes
      - bind: cpRec
        eval: "appendRecord(nil, &record{kind: recCheckpt, end: true, batch: cp.nextBatchSeq, data: cp.encode()})"
        to: appendRecord
      - bind: tmp
        eval: filepath.Join(l.logDir(), segName(n)+".tmp")
        to: filepath
      - bind: f, err
        eval: l.segmentFile(n, size, tmp)
        to: l.segmentFile
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: abandonTmp(f, tmp, storageFailed("checkpoint", err))
              to: abandonTmp
          init:
            bind: _, err
            eval: f.WriteAt(cpRec, 0)
            to: f.WriteAt
          when: err != nil
      - opt:
          do:
            - return: abandonTmp(f, tmp, storageFailed("sync segment", err))
              to: abandonTmp
          init:
            bind: err
            eval: f.Sync()
            to: f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("close segment", err)
              to: storageFailed
          init:
            bind: err
            eval: f.Close()
            to: f.Close
          when: err != nil
      - bind: final
        eval: filepath.Join(l.logDir(), segName(n))
        to: filepath
      - opt:
          do:
            - return: storageFailed("rename segment", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Rename(tmp, final)
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("sync dir", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(l.logDir())
            to: syncDir
          when: err != nil
      - set: f, err
        to: os
        value: os.OpenFile(final, os.O_RDWR, 0)
      - opt:
          do:
            - return: storageFailed("open segment", err)
              to: storageFailed
          when: err != nil
      - set: l.segs
        value: "append(l.segs, &segment{n: n, f: f, size: size})"
      - eval: l.occupied.Add(size)
        to: l.occupied.Add
      - set: l.off
        value: int64(len(cpRec))
      - set: l.batch
        value: cp.nextBatchSeq + 1
      - eval: l.prepare(n+1, l.segBytes)
        to: l.prepare
      - return: nil
  - of: (*fileLog).segmentFile
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).segmentFile
        kind: self
      - id: l.takePrepared
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - opt:
          do:
            - return: f, nil
          init:
            bind: f
            eval: l.takePrepared(n, size)
            to: l.takePrepared
          when: f != nil
      - bind: f, err
        eval: os.OpenFile(tmp, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("create segment", err)
          when: err != nil
      - opt:
          do:
            - return: nil, abandonTmp(f, tmp, storageFailed("zero-fill", err))
          init:
            bind: err
            eval: l.zeroFill()(f, 0, size)
          when: err != nil
      - return: f, nil
  - of: (*fileLog).zeroFill
    steps:
      - opt:
          do:
            - return: l.fill
          when: l.fill != nil
      - return: zeroFrom
  - of: abandonTmp
    participants:
      - id: caller
        kind: actor
      - id: abandonTmp
        kind: self
      - id: abandon
        kind: internal
    steps:
      - eval: abandon(f.Close())
        to: abandon
      - eval: abandon(os.Remove(path))
        to: abandon
      - return: cause
  - of: (*fileLog).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).prepare
        kind: self
      - id: l.zeroFill
        kind: internal
    steps:
      - bind: done
        eval: make(chan struct{})
      - bind: p
        eval: "&prepared{n: n, size: size, done: done}"
      - set: l.prep
        value: p
      - bind: fill
        eval: l.zeroFill()
        to: l.zeroFill
      - go: |-
          func() {
          		defer close(done)
          		tmp := filepath.Join(l.logDir(), segName(n)+".tmp")
          		f, err := os.OpenFile(tmp, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
          		if err != nil {
          			p.err = err
          			return
          		}
          		if err := fill(f, 0, size); err != nil {
          			// A half-zeroed .tmp is never published: takePrepared then
          			// builds the segment on the writer's path, where a failure
          			// stops the node. It goes now: on a full disk it holds every
          			// byte the fill could write (#520).
          			p.err = abandonTmp(f, tmp, err)
          			return
          		}
          		p.f = f
          	}()
  - of: (*fileLog).takePrepared
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).takePrepared
        kind: self
      - id: abandon
        kind: internal
    steps:
      - bind: p
        eval: l.prep
      - set: l.prep
        value: nil
      - opt:
          do:
            - return: nil
          when: p == nil
      - eval: <-p.done
      - opt:
          do:
            - opt:
                do:
                  - eval: abandon(abandonTmp(p.f, filepath.Join(l.logDir(), segName(p.n)+".tmp"), nil))
                    to: abandon
                when: p.f != nil
            - return: nil
          when: p.err != nil || p.n != n || p.size != size
      - return: p.f
  - of: writeFileSync
    participants:
      - id: caller
        kind: actor
      - id: writeFileSync
        kind: self
      - id: writeSynced
        kind: internal
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
    steps:
      - bind: tmp
        eval: path + ".tmp"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: writeSynced(tmp, data)
            to: writeSynced
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: os.Rename(tmp, path)
            to: os
          when: err != nil
      - return: syncDir(filepath.Dir(path))
        to: syncDir
  - of: mkdirDurable
    participants:
      - id: caller
        kind: actor
      - id: mkdirDurable
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - bind: _, err
        eval: os.Stat(dir)
        to: os
      - bind: existed
        eval: err == nil
      - opt:
          do:
            - return: storageFailed("mkdir", err)
              to: storageFailed
          init:
            bind: err
            eval: os.MkdirAll(dir, 0o700)
            to: os
          when: err != nil
      - opt:
          do:
            - return: nil
          when: existed
      - opt:
          do:
            - return: storageFailed("mkdir", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(filepath.Dir(dir))
            to: syncDir
          when: err != nil
      - return: nil
  - of: writeSynced
    participants:
      - id: caller
        kind: actor
      - id: writeSynced
        kind: self
      - id: os
        kind: stdlib
      - id: f.Write
        kind: value
      - id: f.Sync
        kind: value
    steps:
      - bind: f, err
        eval: os.OpenFile(path, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
        to: os
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = cerr
          		}
          	}()
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: f.Write(data)
            to: f.Write
          when: err != nil
      - return: f.Sync()
        to: f.Sync
  - of: (*fileLog).rotate
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).rotate
        kind: self
      - id: appendRecord
        kind: internal
      - id: cur.f.WriteAt
        kind: value
      - id: storageFailed
        kind: internal
      - id: datasync
        kind: internal
      - id: l.publishNext
        kind: internal
    steps:
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - bind: seal
        eval: "appendRecord(nil, &record{kind: recSeal, end: true, batch: l.batch, index: uint64(l.off)})"
        to: appendRecord
      - opt:
          do:
            - opt:
                do:
                  - return: storageFailed("seal", err)
                    to: storageFailed
                init:
                  bind: _, err
                  eval: cur.f.WriteAt(seal, l.off)
                  to: cur.f.WriteAt
                when: err != nil
            - opt:
                do:
                  - return: storageFailed("sync seal", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: datasync(cur.f)
                  to: datasync
                when: err != nil
            - op: ++
              set: l.batch
            - opt:
                do:
                  - eval: l.afterSeal()
                when: l.afterSeal != nil
          when: l.off+int64(len(seal)) <= cur.size
      - return: l.publishNext(need)
        to: l.publishNext
  - of: (*fileLog).publishNext
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).publishNext
        kind: self
      - id: l.createSegment
        kind: internal
    steps:
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - bind: cp
        eval: l.dur
      - set: cp.nextBatchSeq
        value: l.batch
      - bind: saved
        eval: l.segBytes
      - opt:
          do:
            - set: l.segBytes
              value: int64(align8(need)) + 1024 + sealReserve
          when: int64(need)+1024+sealReserve > l.segBytes
      - bind: err
        eval: l.createSegment(cur.n+1, &cp)
        to: l.createSegment
      - set: l.segBytes
        value: saved
      - return: err
  - of: (*fileLog).termLocked
    steps:
      - switch:
          cases:
            - case: i == l.first-1
              do:
                - return: l.prevTerm
            - case: i < l.first || i >= l.first+uint64(len(l.slots))
              do:
                - return: "0"
      - return: l.slots[i-l.first].term
  - of: (*fileLog).usable
    steps:
      - opt:
          do:
            - return: l.refuse
          when: l.refuse != nil
      - return: l.failed
  - of: (*fileLog).Entries
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Entries
        kind: self
      - id: l.usable
        kind: internal
      - id: l.readEntry
        kind: internal
    steps:
      - lock:
          mutex: l.mu
          read: true
      - opt:
          do:
            - return: dst, err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: dst, compacted(lo, l.first)
          when: lo < l.first
      - opt:
          do:
            - return: dst, storageFailed("entries", errImpossible)
          when: hi > l.first+uint64(len(l.slots))
      - bind: size
        eval: "0"
      - loop:
          cond: i < hi
          do:
            - bind: s
              eval: l.slots[i-l.first]
            - var:
                name: e
                type: coreconsensus.EntryValue
            - alt:
                - do:
                    - set: e
                      value: "*s.mem"
                  when: s.mem != nil
                - do:
                    - var:
                        name: err
                        type: error
                    - opt:
                        do:
                          - return: dst, err
                        init:
                          bind: e, err
                          eval: l.readEntry(s)
                          op: =
                          to: l.readEntry
                        when: err != nil
                  else: true
            - op: +=
              set: size
              value: len(e.Data)
            - opt:
                do:
                  - break: true
                when: i > lo && size > maxBytes
            - set: dst
              value: append(dst, e)
          init: i := lo
          post: i++
      - return: dst, nil
  - of: (*fileLog).readEntry
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).readEntry
        kind: self
      - id: seg.f.ReadAt
        kind: value
      - id: binary.LittleEndian.Uint32
        kind: value
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: seg
          type: "*segment"
      - loop:
          do:
            - opt:
                do:
                  - set: seg
                    value: x
                when: x.n == s.seg
          key: _
          range: l.segs
          value: x
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", errImpossible)
          when: seg == nil
      - var:
          name: h
          type: "[recHeader]byte"
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", err)
          init:
            bind: _, err
            eval: seg.f.ReadAt(h[:], s.off)
            to: seg.f.ReadAt
          when: err != nil
      - bind: ln
        eval: binary.LittleEndian.Uint32(h[:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, origin(coreconsensus.LogCorrupt, errs.String("segment", segName(s.seg)), errs.Int64("offset", s.off))
          when: int64(ln) > min(seg.size-s.off, math.MaxInt)-int64(recHeader)
      - bind: b
        eval: make([]byte, recHeader+int(ln))
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", err)
          init:
            bind: _, err
            eval: seg.f.ReadAt(b, s.off)
            to: seg.f.ReadAt
          when: err != nil && !errors.Is(err, io.EOF)
      - bind: r, ok
        eval: parseRecord(b)
        to: parseRecord
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, origin(coreconsensus.LogCorrupt, errs.String("segment", segName(s.seg)), errs.Int64("offset", s.off))
          when: "!ok || r.kind != recEntry"
      - return: |-
          coreconsensus.EntryValue{
          		Position: coreconsensus.PositionValue{Term: r.term, Index: r.index},
          		Kind:     coreconsensus.EntryKind(r.ekind), Version: r.ever, BodySum: r.body, ChainSum: r.chain, Data: r.data,
          	}, nil
  - of: (*fileLog).Term
    steps:
      - lock:
          mutex: l.mu
          read: true
      - switch:
          cases:
            - case: index == l.first-1
              do:
                - return: l.prevTerm, nil
            - case: index < l.first
              do:
                - return: 0, compacted(index, l.first)
            - case: index >= l.first+uint64(len(l.slots))
              do:
                - return: 0, storageFailed("term", errImpossible)
      - return: l.slots[index-l.first].term, nil
  - of: (*fileLog).Bounds
    steps:
      - lock:
          mutex: l.mu
          read: true
      - opt:
          do:
            - return: 1, 0
          when: l.refuse != nil
      - return: l.first, l.first + uint64(len(l.slots)) - 1
  - of: (*fileLog).add
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).add
        kind: self
      - id: appendRecord
        kind: internal
    steps:
      - set: l.pendingLast
        value: len(l.pending)
      - set: l.pending
        to: appendRecord
        value: appendRecord(l.pending, r)
  - of: (*fileLog).Append
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Append
        kind: self
      - id: l.usable
        kind: internal
      - id: storageFailed
        kind: internal
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - loop:
          do:
            - bind: e
              eval: entries[i]
            - opt:
                do:
                  - return: storageFailed("append", errImpossible)
                    to: storageFailed
                when: e.Position.Index != l.first+uint64(len(l.slots))
            - eval: |-
                l.add(&record{
                			kind: recEntry, batch: l.batch, term: e.Position.Term, index: e.Position.Index,
                			ekind: uint8(e.Kind), ever: e.Version, body: e.BodySum, chain: e.ChainSum, data: e.Data,
                		})
              to: l.add
            - set: l.slots
              value: "append(l.slots, slot{term: e.Position.Term, mem: &e})"
          key: i
          range: entries
      - opt:
          do:
            - eval: "l.add(&record{kind: recHardState, batch: l.batch, data: encodeHS(*hs)})"
              to: l.add
            - set: l.hs
              value: "*hs"
          when: hs != nil
      - return: nil
  - of: (*fileLog).Sync
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Sync
        kind: self
      - id: l.usable
        kind: internal
      - id: sealRecord
        kind: internal
      - id: l.rotate
        kind: internal
      - id: l.restamp
        kind: internal
      - id: l.mu.Unlock
        kind: value
      - id: l.writeBatch
        kind: internal
      - id: l.mu.Lock
        kind: value
      - id: l.settleBatch
        kind: internal
      - id: l.dropSegmentsLocked
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: nil
          when: len(l.pending) == 0
      - set: l.pending[l.pendingLast+recHeader+2]
        value: "1"
      - eval: sealRecord(l.pending[l.pendingLast:])
        to: sealRecord
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - opt:
          do:
            - opt:
                do:
                  - set: l.failed
                    value: err
                  - return: err
                init:
                  bind: err
                  eval: l.rotate(len(l.pending))
                  to: l.rotate
                when: err != nil
            - eval: l.restamp(l.batch)
              to: l.restamp
            - set: cur
              value: l.segs[len(l.segs)-1]
          when: l.off+int64(len(l.pending))+sealReserve > cur.size
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
      - bind: ferr
        eval: l.writeBatch(cur)
        to: l.writeBatch
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - opt:
          do:
            - set: l.failed
              value: ferr
            - return: l.failed
          when: ferr != nil
      - eval: l.settleBatch(cur.n)
        to: l.settleBatch
      - return: l.dropSegmentsLocked()
        to: l.dropSegmentsLocked
  - of: (*fileLog).writeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).writeBatch
        kind: self
      - id: l.writeAndSync
        kind: internal
    steps:
      - bind: body
        eval: l.pending[:l.pendingLast]
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.writeAndSync(cur, body, l.off)
                  to: l.writeAndSync
                when: err != nil
          when: len(body) > 0
      - return: l.writeAndSync(cur, l.pending[l.pendingLast:], l.off+int64(len(body)))
        to: l.writeAndSync
  - of: (*fileLog).writeAndSync
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).writeAndSync
        kind: self
      - id: cur.f.WriteAt
        kind: value
      - id: storageFailed
        kind: internal
      - id: datasync
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("write", err)
              to: storageFailed
          init:
            bind: _, err
            eval: cur.f.WriteAt(b, off)
            to: cur.f.WriteAt
          when: err != nil
      - opt:
          do:
            - eval: l.duringSync()
          when: l.duringSync != nil
      - opt:
          do:
            - return: storageFailed("fdatasync", err)
              to: storageFailed
          init:
            bind: err
            eval: datasync(cur.f)
            to: datasync
          when: err != nil
      - return: nil
  - of: (*fileLog).settleBatch
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).settleBatch
        kind: self
      - id: l.relocate
        kind: internal
      - id: l.markDurable
        kind: internal
    steps:
      - eval: l.relocate(seg)
        to: l.relocate
      - op: +=
        set: l.off
        value: int64(len(l.pending))
      - eval: l.markDurable()
        to: l.markDurable
      - set: l.pending
        value: l.pending[:0]
      - set: l.pendingLast
        value: "-1"
      - op: ++
        set: l.batch
  - of: (*fileLog).relocate
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).relocate
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: "off"
          type: int64
      - loop:
          cond: off < int64(len(l.pending))
          do:
            - bind: r, _
              eval: parseRecord(l.pending[off:])
              to: parseRecord
            - opt:
                do:
                  - bind: s
                    eval: "&l.slots[r.index-l.first]"
                  - opt:
                      do:
                        - set: s.seg, s.off, s.mem
                          value: seg, l.off+off, nil
                      when: s.mem != nil && s.term == r.term
                when: r.kind == recEntry && r.index >= l.first && r.index < l.first+uint64(len(l.slots))
            - op: +=
              set: "off"
              value: int64(r.length)
  - of: (*fileLog).markDurable
    steps:
      - bind: last
        eval: l.first + uint64(len(l.slots)) - 1
      - set: l.dur
        value: "checkpoint{hs: l.hs, prevIndex: last, prevTerm: l.termLocked(last), compact: l.compact, compactTerm: l.compactTerm}"
  - of: (*fileLog).restamp
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).restamp
        kind: self
      - id: binary.LittleEndian.PutUint64
        kind: value
      - id: sealRecord
        kind: internal
      - id: align8
        kind: internal
    steps:
      - var:
          name: "off"
          type: int
      - loop:
          cond: off < len(l.pending)
          do:
            - eval: binary.LittleEndian.PutUint64(l.pending[off+recHeader+4:], batch)
              to: binary.LittleEndian.PutUint64
            - eval: sealRecord(l.pending[off:])
              to: sealRecord
            - bind: "n"
              eval: int(binary.LittleEndian.Uint32(l.pending[off:]))
            - op: +=
              set: "off"
              to: align8
              value: align8(recHeader + n)
  - of: (*fileLog).TruncateSuffix
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).TruncateSuffix
        kind: self
      - id: l.usable
        kind: internal
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - set: from
              value: l.first
          when: from < l.first
      - opt:
          do:
            - return: nil
          when: from >= l.first+uint64(len(l.slots))
      - eval: "l.add(&record{kind: recTruncate, batch: l.batch, index: from})"
        to: l.add
      - set: l.slots
        value: l.slots[:from-l.first]
      - return: nil
  - of: (*fileLog).CompactPrefix
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).CompactPrefix
        kind: self
      - id: l.compactPrefixAt
        kind: internal
    steps:
      - return: l.compactPrefixAt(through, 0)
        to: l.compactPrefixAt
  - of: (*fileLog).compactPrefixAt
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).compactPrefixAt
        kind: self
      - id: l.usable
        kind: internal
      - id: compactionTerm
        kind: internal
      - id: l.add
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: nil
          when: through < l.first
      - bind: last
        eval: l.first + uint64(len(l.slots)) - 1
      - bind: t, err
        eval: compactionTerm(through, last, l.termLocked(through), term)
        to: compactionTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: "l.add(&record{kind: recCompact, batch: l.batch, index: through, term: t})"
        to: l.add
      - alt:
          - do:
              - set: l.slots
                value: nil
            when: through >= last
          - do:
              - set: l.slots
                to: slices
                value: slices.Clone(l.slots[through-l.first+1:])
            else: true
      - set: l.first, l.prevTerm
        value: through+1, t
      - set: l.compact, l.compactTerm
        value: through, t
      - return: nil
  - of: compactionTerm
    steps:
      - switch:
          cases:
            - case: through <= last && given != 0 && given != held
              do:
                - return: 0, storageFailed("compact", errImpossible)
            - case: through <= last
              do:
                - return: held, nil
            - case: given == 0
              do:
                - return: 0, storageFailed("compact", errUnknownCompactTerm)
      - return: given, nil
  - of: (*fileLog).dropSegmentsLocked
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).dropSegmentsLocked
        kind: self
      - id: l.supersedes
        kind: internal
      - id: l.removeFirstSegment
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - bind: removed
        eval: "false"
      - loop:
          cond: len(l.segs) > 1
          do:
            - bind: superseded, err
              eval: l.supersedes(l.segs[1])
              to: l.supersedes
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - break: true
                when: "!superseded"
            - opt:
                do:
                  - break: true
                when: l.retainsEntryIn(l.segs[0].n)
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.removeFirstSegment()
                  to: l.removeFirstSegment
                when: err != nil
            - set: removed
              value: "true"
      - opt:
          do:
            - return: syncDir(l.logDir())
              to: syncDir
          when: removed
      - return: nil
  - of: (*fileLog).supersedes
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).supersedes
        kind: self
      - id: next.f.ReadAt
        kind: value
      - id: parseRecord
        kind: internal
      - id: decodeCheckpoint
        kind: internal
    steps:
      - bind: b
        eval: make([]byte, recHeader+recFixed+checkpointLen)
      - opt:
          do:
            - return: false, storageFailed("read checkpoint", err)
          init:
            bind: _, err
            eval: next.f.ReadAt(b, 0)
            to: next.f.ReadAt
          when: err != nil
      - bind: r, ok
        eval: parseRecord(b)
        to: parseRecord
      - opt:
          do:
            - return: false, nil
          when: "!ok"
      - bind: cp, ok
        eval: decodeCheckpoint(r.data)
        to: decodeCheckpoint
      - return: ok && cp.prevIndex <= l.compact, nil
  - of: (*fileLog).removeFirstSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).removeFirstSegment
        kind: self
      - id: l.segs[0].f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: os
        kind: stdlib
      - id: l.occupied.Add
        kind: value
    steps:
      - opt:
          do:
            - return: storageFailed("close segment", err)
              to: storageFailed
          init:
            bind: err
            eval: l.segs[0].f.Close()
            to: l.segs[0].f.Close
          when: err != nil
      - opt:
          do:
            - return: storageFailed("remove segment", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(l.logDir(), segName(l.segs[0].n)))
            to: os
          when: err != nil
      - eval: l.occupied.Add(-l.segs[0].size)
        to: l.occupied.Add
      - set: l.segs
        value: l.segs[1:]
      - return: nil
  - of: (*fileLog).HardState
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.hs, l.usable()
  - of: (*fileLog).Stamp
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.stamp, nil
  - of: (*fileLog).WriteStamp
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).WriteStamp
        kind: self
      - id: writeStamp
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: l.refuse
          when: errs.HasCode(l.refuse, coreconsensus.CodeStopMarkerPresent)
      - opt:
          do:
            - return: storageFailed("stamp", err)
              to: storageFailed
          init:
            bind: err
            eval: writeStamp(l.dir, s)
            to: writeStamp
          when: err != nil
      - set: l.stamp
        value: s
      - return: nil
  - of: (*fileLog).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Close
        kind: self
      - id: s.f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: l.occupied.Store
        kind: value
      - id: abandon
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - var:
          name: err
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: err
                    to: storageFailed
                    value: storageFailed("close segment", cerr)
                init:
                  bind: cerr
                  eval: s.f.Close()
                  to: s.f.Close
                when: cerr != nil && err == nil
          key: _
          range: l.segs
          value: s
      - set: l.segs
        value: nil
      - eval: l.occupied.Store(0)
        to: l.occupied.Store
      - opt:
          do:
            - set: l.prep
              value: nil
            - eval: <-p.done
            - opt:
                do:
                  - eval: abandon(p.f.Close())
                    to: abandon
                when: p.f != nil
          init:
            bind: p
            eval: l.prep
          when: p != nil
      - return: err
  - of: (*fileLog).logStats
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).logStats
        kind: self
      - id: l.mu.RLock
        kind: value
      - id: l.mu.RUnlock
        kind: value
      - id: l.logBytes
        kind: internal
    steps:
      - eval: l.mu.RLock()
        to: l.mu.RLock
      - set: tails
        value: l.tailsTruncated
      - eval: l.mu.RUnlock()
        to: l.mu.RUnlock
      - return: l.logBytes(), l.freeBytes(), tails
        to: l.logBytes
  - of: (*fileLog).logBytes
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).logBytes
        kind: self
      - id: l.occupied.Load
        kind: value
    steps:
      - return: l.occupied.Load()
        to: l.occupied.Load
  - of: (*fileLog).freeBytes
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).freeBytes
        kind: self
      - id: fsFree
        kind: internal
    steps:
      - return: fsFree(l.dir)
        to: fsFree
  - of: newFileSnapshots
    participants:
      - id: caller
        kind: actor
      - id: newFileSnapshots
        kind: self
      - id: mkdirDurable
        kind: internal
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
      - id: s.sweepSpools
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: mkdirDurable(dir)
            to: mkdirDurable
          when: err != nil
      - bind: ents, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("list snapshots", err)
          when: err != nil
      - loop:
          do:
            - bind: id, ok
              eval: strings.CutSuffix(e.Name(), ".snap")
              to: strings
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, storageFailed("remove orphan snapshot", err)
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(dir, e.Name()))
                        to: os
                      when: err != nil
                init:
                  bind: _, err
                  eval: os.Stat(filepath.Join(dir, id+".meta"))
                  to: os
                when: errors.Is(err, os.ErrNotExist)
          key: _
          range: ents
          value: e
      - bind: s
        eval: "&fileSnapshots{dir: dir, pins: map[string]int{}, writing: map[string]int{}, owners: map[string]*fileSink{}, resume: map[string]resumePoint{}}"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: s.sweepSpools(newestSpool(ents))
            to: s.sweepSpools
          when: err != nil
      - opt:
          do:
            - return: nil, syncFailed("sync snapshots at open", err)
          init:
            bind: err
            eval: syncDirAtOpen(dir)
          when: err != nil
      - return: s, nil
  - of: newestSpool
    participants:
      - id: caller
        kind: actor
      - id: newestSpool
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: newest
        eval: "\"\""
      - loop:
          do:
            - opt:
                do:
                  - set: newest
                    value: id
                init:
                  bind: id, ok
                  eval: strings.CutSuffix(e.Name(), ".spool")
                  to: strings
                when: ok && id > newest
          key: _
          range: ents
          value: e
      - return: newest
  - of: (*fileSnapshots).sweepSpools
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).sweepSpools
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: s.orphanSpools
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - bind: ents, err
        eval: os.ReadDir(s.dir)
        to: os
      - opt:
          do:
            - return: storageFailed("list snapshots", err)
              to: storageFailed
          when: err != nil
      - lock:
          mutex: s.mu
      - bind: orphans
        eval: s.orphanSpools(ents, keep)
        to: s.orphanSpools
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("remove orphan spool", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: os.Remove(filepath.Join(s.dir, name))
                  to: os
                when: err != nil && !errors.Is(err, os.ErrNotExist)
            - eval: delete(s.resume, strings.TrimSuffix(name, ".spool"))
          key: _
          range: orphans
          value: name
      - opt:
          do:
            - return: nil
          when: len(orphans) == 0
      - opt:
          do:
            - return: storageFailed("remove orphan spool", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(s.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: (*fileSnapshots).orphanSpools
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).orphanSpools
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - var:
          name: out
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, e.Name())
                init:
                  bind: id, ok
                  eval: strings.CutSuffix(e.Name(), ".spool")
                  to: strings
                when: ok && id != keep && s.writing[id] == 0
          key: _
          range: ents
          value: e
      - return: out
  - of: validID
    steps:
      - return: id != "" && len(id) <= 128 && !strings.ContainsAny(id, "/\\.") && filepath.Base(id) == id
  - of: (*fileSnapshots).Create
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Create
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.sweepSpools
        kind: internal
      - id: sink.closed
        kind: internal
      - id: sink.mu.Lock
        kind: value
      - id: s.claimSpool
        kind: internal
      - id: old.supersede
        kind: internal
      - id: os
        kind: stdlib
      - id: sink.mu.Unlock
        kind: value
      - id: positionSpool
        kind: internal
      - id: alsoFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, 0, origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
          when: "!validID(id)"
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - op: ++
        set: s.writing[id]
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - bind: sink
        eval: "&fileSink{s: s, id: id, meta: meta}"
      - opt:
          do:
            - eval: sink.closed()
              to: sink.closed
            - return: nil, 0, err
          init:
            bind: err
            eval: s.sweepSpools(id)
            to: s.sweepSpools
          when: err != nil
      - eval: sink.mu.Lock()
        to: sink.mu.Lock
      - bind: old, at, kept
        eval: s.claimSpool(sink)
        to: s.claimSpool
      - opt:
          do:
            - eval: s.afterPublish(id)
          when: s.afterPublish != nil
      - opt:
          do:
            - eval: old.supersede()
              to: old.supersede
          when: old != nil
      - bind: f, err
        eval: os.OpenFile(filepath.Join(s.dir, id+".spool"), os.O_RDWR|os.O_CREATE, 0o600)
        to: os
      - opt:
          do:
            - eval: sink.mu.Unlock()
              to: sink.mu.Unlock
            - eval: sink.closed()
              to: sink.closed
            - return: nil, 0, storageFailed("spool", err)
          when: err != nil
      - set: sink.f
        value: f
      - bind: off, err
        eval: positionSpool(f, old != nil, at, kept, &meta)
        to: positionSpool
      - opt:
          do:
            - set: err
              to: alsoFailed
              value: alsoFailed(storageFailed("spool", err), "close", f.Close())
            - set: sink.f
              value: nil
            - eval: sink.mu.Unlock()
              to: sink.mu.Unlock
            - eval: sink.closed()
              to: sink.closed
            - return: nil, 0, err
          when: err != nil
      - set: sink.start
        value: "off"
      - eval: sink.mu.Unlock()
        to: sink.mu.Unlock
      - return: sink, off, nil
  - of: (*fileSnapshots).claimSpool
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).claimSpool
        kind: self
      - id: s.claim
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - set: old
        to: s.claim
        value: s.claim(sink)
      - set: at, kept
        value: s.resume[sink.id]
      - eval: delete(s.resume, sink.id)
      - return: old, at, kept
  - of: positionSpool
    participants:
      - id: caller
        kind: actor
      - id: positionSpool
        kind: self
      - id: resumeAt
        kind: internal
      - id: resumeOffset
        kind: internal
    steps:
      - switch:
          cases:
            - case: superseding
              do:
                - return: 0, f.Truncate(0)
            - case: kept && at.chunk == meta.ChunkSize && at.size == meta.EncodedSize
              do:
                - return: resumeAt(f, at.off, meta.ChunkSize)
                  to: resumeAt
            - default: true
              do:
                - return: resumeOffset(f, meta.ChunkSize)
                  to: resumeOffset
  - of: (*fileSnapshots).claim
    steps:
      - bind: old
        eval: s.owners[sink.id]
      - set: s.owners[sink.id]
        value: sink
      - return: old
  - of: (*fileSink).supersede
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).supersede
        kind: self
      - id: abandon
        kind: internal
    steps:
      - lock:
          mutex: k.mu
      - opt:
          do:
            - set: k.superseded
              value: "true"
            - opt:
                do:
                  - eval: abandon(k.f.Close())
                    to: abandon
                when: k.f != nil
          when: "!k.superseded"
  - of: resumeOffset
    participants:
      - id: caller
        kind: actor
      - id: resumeOffset
        kind: self
      - id: f.Stat
        kind: internal
      - id: alignedOffsetAt
        kind: internal
      - id: f.Truncate
        kind: internal
      - id: f.Seek
        kind: value
    steps:
      - bind: st, err
        eval: f.Stat()
        to: f.Stat
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: off, err
        eval: alignedOffsetAt(f, st.Size(), maxEncodedChunk(chunk))
        to: alignedOffsetAt
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: f.Truncate(off)
            to: f.Truncate
          when: err != nil
      - set: _, err
        to: f.Seek
        value: f.Seek(off, io.SeekStart)
      - return: off, err
  - of: resumeAt
    participants:
      - id: caller
        kind: actor
      - id: resumeAt
        kind: self
      - id: f.Stat
        kind: internal
      - id: resumeOffset
        kind: internal
      - id: f.Truncate
        kind: internal
      - id: f.Seek
        kind: value
    steps:
      - bind: st, err
        eval: f.Stat()
        to: f.Stat
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - opt:
          do:
            - return: resumeOffset(f, chunk)
              to: resumeOffset
          when: off < 0 || off > st.Size()
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: f.Truncate(off)
            to: f.Truncate
          when: err != nil
      - set: _, err
        to: f.Seek
        value: f.Seek(off, io.SeekStart)
      - return: off, err
  - of: (*fileSnapshots).forget
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).forget
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - eval: delete(s.resume, id)
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
  - of: (*fileSink).closed
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).closed
        kind: self
      - id: k.done.Do
        kind: value
    steps:
      - eval: |-
          k.done.Do(func() {
          		k.s.mu.Lock()
          		if k.s.writing[k.id]--; k.s.writing[k.id] <= 0 {
          			delete(k.s.writing, k.id)
          		}
          		if k.s.owners[k.id] == k {
          			delete(k.s.owners, k.id)
          		}
          		k.s.mu.Unlock()
          	})
        to: k.done.Do
  - of: (*fileSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Write
        kind: self
      - id: k.f.Write
        kind: value
    steps:
      - lock:
          mutex: k.mu
      - opt:
          do:
            - return: 0, snapshotCorrupt(supersededWhy)
          when: k.superseded
      - opt:
          do:
            - set: k.wrote
              value: "true"
          when: len(p) > 0
      - return: k.f.Write(p)
        to: k.f.Write
  - of: (*fileSink).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Commit
        kind: self
      - id: k.closed
        kind: internal
      - id: snapshotCorrupt
        kind: internal
      - id: k.f.Seek
        kind: value
      - id: alsoFailed
        kind: internal
      - id: k.f.Sync
        kind: value
      - id: k.f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: k.s.forget
        kind: internal
      - id: os
        kind: stdlib
      - id: writeFileSync
        kind: internal
    steps:
      - defer: k.closed()
        to: k.closed
      - lock:
          mutex: k.mu
      - opt:
          do:
            - return: snapshotCorrupt(supersededWhy)
              to: snapshotCorrupt
          when: k.superseded
      - set: final.ID
        value: k.id
      - bind: size, err
        eval: k.f.Seek(0, io.SeekCurrent)
        to: k.f.Seek
      - opt:
          do:
            - return: alsoFailed(storageFailed("snapshot size", err), "close", k.f.Close())
              to: alsoFailed
          when: err != nil
      - opt:
          do:
            - return: alsoFailed(snapshotCorrupt("encoded size"), "close", k.f.Close())
              to: alsoFailed
          when: size != final.EncodedSize
      - opt:
          do:
            - return: alsoFailed(storageFailed("sync snapshot", err), "close", k.f.Close())
              to: alsoFailed
          init:
            bind: err
            eval: k.f.Sync()
            to: k.f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("close snapshot", err)
              to: storageFailed
          init:
            bind: err
            eval: k.f.Close()
            to: k.f.Close
          when: err != nil
      - eval: k.s.forget(k.id)
        to: k.s.forget
      - opt:
          do:
            - opt:
                do:
                  - return: snapshotCorrupt("spool gone before its commit")
                    to: snapshotCorrupt
                when: errors.Is(err, os.ErrNotExist)
            - return: storageFailed("publish snapshot", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Rename(filepath.Join(k.s.dir, k.id+".spool"), filepath.Join(k.s.dir, k.id+".snap"))
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("publish snapshot meta", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(k.s.dir, k.id+".meta"), wire.AppendSnapshotMeta(nil, &final))
            to: writeFileSync
          when: err != nil
      - return: nil
  - of: (*fileSnapshots).published
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).published
        kind: self
      - id: strings
        kind: stdlib
      - id: os
        kind: stdlib
    steps:
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - opt:
          do:
            - return: m, false, nil
          when: "!strings.HasSuffix(name, \".meta\")"
      - bind: id
        eval: strings.TrimSuffix(name, ".meta")
        to: strings
      - bind: b, err
        eval: os.ReadFile(filepath.Join(s.dir, name))
        to: os
      - opt:
          do:
            - return: m, false, nil
          when: errors.Is(err, os.ErrNotExist)
      - opt:
          do:
            - return: m, false, storageFailed("read snapshot meta", err)
          when: err != nil
      - opt:
          do:
            - return: m, false, nil
          when: wire.ParseSnapshotMeta(b, &m) != nil || m.ID != id || !idNamesPosition(&m)
      - opt:
          do:
            - opt:
                do:
                  - return: m, false, nil
                when: errors.Is(err, os.ErrNotExist)
            - return: m, false, storageFailed("stat snapshot", err)
          init:
            bind: _, err
            eval: os.Stat(filepath.Join(s.dir, id+".snap"))
            to: os
          when: err != nil
      - return: m, true, nil
  - of: (*fileSink).release
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).release
        kind: self
      - id: k.closed
        kind: internal
      - id: abandon
        kind: internal
      - id: k.s.mu.Lock
        kind: value
      - id: k.s.mu.Unlock
        kind: value
    steps:
      - defer: k.closed()
        to: k.closed
      - lock:
          mutex: k.mu
      - opt:
          do:
            - return: ""
          when: k.superseded
      - eval: abandon(k.f.Close())
        to: abandon
      - opt:
          do:
            - eval: k.s.mu.Lock()
              to: k.s.mu.Lock
            - opt:
                do:
                  - set: k.s.resume[k.id]
                    value: "resumePoint{off: k.start, chunk: k.meta.ChunkSize, size: k.meta.EncodedSize}"
                when: k.s.owners[k.id] == k
            - eval: k.s.mu.Unlock()
              to: k.s.mu.Unlock
          when: "!k.wrote"
  - of: (*fileSink).Abort
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Abort
        kind: self
      - id: k.closed
        kind: internal
      - id: abandon
        kind: internal
      - id: k.s.forget
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
    steps:
      - defer: k.closed()
        to: k.closed
      - lock:
          mutex: k.mu
      - opt:
          do:
            - return: nil
          when: k.superseded
      - eval: abandon(k.f.Close())
        to: abandon
      - eval: k.s.forget(k.id)
        to: k.s.forget
      - opt:
          do:
            - return: storageFailed("abort spool", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(k.s.dir, k.id+".spool"))
            to: os
          when: err != nil && !errors.Is(err, os.ErrNotExist)
      - return: nil
  - of: (*fileSnapshots).List
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).List
        kind: self
      - id: os
        kind: stdlib
      - id: s.published
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(s.dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("list snapshots", err)
          when: err != nil
      - var:
          name: out
          type: "[]coreconsensus.SnapshotMetaValue"
      - loop:
          do:
            - bind: m, ok, err
              eval: s.published(e.Name())
              to: s.published
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - opt:
                do:
                  - set: out
                    value: append(out, m)
                when: ok
          key: _
          range: ents
          value: e
      - eval: |-
          slices.SortFunc(out, func(a, b coreconsensus.SnapshotMetaValue) int {
          		switch {
          		case a.Position.Index > b.Position.Index:
          			return -1
          		case a.Position.Index < b.Position.Index:
          			return 1
          		}
          		return strings.Compare(b.ID, a.ID)
          	})
        to: slices
      - return: out, nil
  - of: (*fileHandle).Meta
    steps:
      - return: h.meta
  - of: (*fileHandle).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileHandle).Close
        kind: self
      - id: h.once.Do
        kind: value
    steps:
      - var:
          name: err
          type: error
      - eval: |-
          h.once.Do(func() {
          		h.s.mu.Lock()
          		h.s.pins[h.meta.ID]--
          		h.s.mu.Unlock()
          		if cerr := h.File.Close(); cerr != nil {
          			err = storageFailed("close snapshot", cerr)
          		}
          	})
        to: h.once.Do
      - return: err
  - of: (*fileSnapshots).Open
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Open
        kind: self
      - id: os
        kind: stdlib
      - id: wire
        kind: package
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: nil, origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
          when: "!validID(id)"
      - bind: b, err
        eval: os.ReadFile(filepath.Join(s.dir, id+".meta"))
        to: os
      - opt:
          do:
            - return: nil, origin(coreconsensus.SnapshotCorrupt, errs.String("id", id), errs.String("why", "no meta"))
          when: err != nil
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: wire.ParseSnapshotMeta(b, &m)
            to: wire
          when: err != nil
      - bind: h
        eval: "&fileHandle{s: s, meta: m}"
      - bind: f, err
        eval: os.Open(filepath.Join(s.dir, id+".snap"))
        to: os
      - opt:
          do:
            - return: nil, storageFailed("open snapshot", err)
          when: err != nil
      - set: h.File
        value: f
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - op: ++
        set: s.pins[id]
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: h, nil
  - of: (*fileSnapshots).Remove
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Remove
        kind: self
      - id: origin
        kind: internal
      - id: pinnedSnapshot
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
              to: origin
          when: "!validID(id)"
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: pinnedSnapshot()
              to: pinnedSnapshot
          when: s.pins[id] > 0
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("remove", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: os.Remove(filepath.Join(s.dir, id+ext))
                  to: os
                when: err != nil && !errors.Is(err, os.ErrNotExist)
          key: _
          range: "[]string{\".meta\", \".snap\"}"
          value: ext
      - opt:
          do:
            - return: storageFailed("remove", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(s.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: fsFree
    participants:
      - id: caller
        kind: actor
      - id: fsFree
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: s
          type: syscall.Statfs_t
      - opt:
          do:
            - return: "-1"
          init:
            bind: err
            eval: syscall.Statfs(dir, &s)
            to: syscall
          when: err != nil
      - return: int64(s.Bavail) * int64(s.Bsize)
  - of: PeerFlags.Has
    steps:
      - return: f&x == x
  - of: HealthFlags.Has
    steps:
      - return: f&x == x
  - of: HealthFlags.set
    steps:
      - opt:
          do:
            - return: f | x
          when: "on"
      - return: f &^ x
  - of: (*Node).Health
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Health
        kind: self
      - id: n.Status
        kind: internal
      - id: n.StopReason
        kind: internal
      - id: h.Flags.Has
        kind: internal
      - id: n.exec
        kind: internal
      - id: n.snapshotHealth
        kind: internal
      - id: h.Flags.set
        kind: internal
    steps:
      - bind: st
        eval: n.Status()
        to: n.Status
      - bind: h
        eval: |-
          HealthValue{
          		Status: st, Flags: HealthFlags(0).set(HealthStopped, n.stopped.Load()), DroppedFrames: n.droppedFrom.Load(), FailureTolerance: -1,
          		LongTurns: n.longTurns.Load(), JoinsRateLimited: n.joinRefused.Load(),
          	}
      - opt:
          do:
            - set: h.StopReason
              value: r
          init:
            bind: r, ok
            eval: n.StopReason()
            to: n.StopReason
          when: ok
      - opt:
          do:
            - set: h.ApplyLagEntries
              value: st.Commit - st.Applied
          when: st.Commit > st.Applied
      - bind: stopped
        eval: h.Flags.Has(HealthStopped)
        to: h.Flags.Has
      - bind: confirmed, applyOK
        eval: false, false
      - opt:
          do:
            - eval: |-
                n.exec(func() {
                			n.loopHealth(&h)
                			now := n.clk.Now()
                			confirmed = n.leaderConfirmed(now)
                			applyOK = n.applyReady(&st, now)
                		})
              to: n.exec
          when: "!stopped"
      - eval: n.snapshotHealth(&h)
        to: n.snapshotHealth
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthHasLeader, st.Leader != 0 && !stopped && confirmed)
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthReady, isReady(&h, &st, applyOK))
      - return: h
  - of: (*Node).snapshotHealth
    participants:
      - id: caller
        kind: actor
      - id: (*Node).snapshotHealth
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: h.Flags.set
        kind: internal
    steps:
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - set: h.SnapshotBytes
        value: n.snapState.newestBytes
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - set: h.SnapshotLimit
              value: n.cfg.MaxSnapshotBytes
          when: h.SnapshotLimit == 0
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthSnapshotNearLimit, nearLimit(h.SnapshotBytes, h.SnapshotLimit))
  - of: isReady
    steps:
      - return: |-
          !h.Flags.Has(HealthStopped) && h.Flags.Has(HealthHasLeader) && (st.Applied >= st.Commit || applyOK) &&
          		(h.ChainRefusals == 0 || h.ChainRefusalLeader != st.Leader)
  - of: (*applyProgress).noteApplied
    steps:
      - opt:
          do:
            - set: p.applied, p.movedAt
              value: applied, now
          when: applied != p.applied || applied >= commit
      - opt:
          do:
            - set: p.caughtUp
              value: "true"
          when: applied >= commit
  - of: (*Node).applyReady
    participants:
      - id: caller
        kind: actor
      - id: (*Node).applyReady
        kind: self
      - id: applyReady
        kind: internal
    steps:
      - bind: p
        eval: "&n.progress"
      - bind: ok
        eval: applyReady(p.caughtUp, st.Commit, st.Applied, now.Sub(p.movedAt), n.r.Status().Timing.ElectionTimeoutMin)
        to: applyReady
      - opt:
          do:
            - set: p.caughtUp
              value: "false"
          when: "!ok && st.Applied < st.Commit"
      - return: ok
  - of: applyReady
    steps:
      - opt:
          do:
            - return: "true"
          when: applied >= commit
      - return: caughtUp && commit-applied <= maxReadyLag && moved <= window
  - of: (*Node).loopHealth
    participants:
      - id: caller
        kind: actor
      - id: (*Node).loopHealth
        kind: self
      - id: n.clk.Now
        kind: value
      - id: h.Flags.set
        kind: internal
      - id: n.r.FailureTolerance
        kind: value
      - id: n.r.ChainRefusal
        kind: value
      - id: snapshotLimit
        kind: internal
    steps:
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthQuorumReachable, n.r.QuorumActive(now))
      - set: h.FailureTolerance
        to: n.r.FailureTolerance
        value: n.r.FailureTolerance(now)
      - set: h.ChainRefusalLeader, h.ChainRefusalIndex, h.ChainRefusals
        to: n.r.ChainRefusal
        value: n.r.ChainRefusal()
      - bind: conf
        eval: n.r.Status().Conf
      - set: h.SnapshotLimit
        to: snapshotLimit
        value: snapshotLimit(n.cfg.MaxSnapshotBytes, &conf)
      - bind: last
        eval: n.r.Status().Last
      - bind: window
        eval: n.r.Status().Timing.ElectionTimeoutMin
      - loop:
          do:
            - set: h.Peers
              value: append(h.Peers, n.peerHealth(&p, now, last, window))
          key: _
          range: n.r.PeerStats()
          value: p
  - of: (*Node).peerHealth
    participants:
      - id: caller
        kind: actor
      - id: (*Node).peerHealth
        kind: self
      - id: p.Flags.Has
        kind: value
      - id: now.Sub
        kind: value
    steps:
      - bind: ph
        eval: "PeerHealthValue{ID: p.ID, Match: p.Match, Inflight: p.Inflight, LastContact: -1}"
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerVoter
          when: p.Flags.Has(raft.StatVoter)
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerSnapshot
          when: p.Flags.Has(raft.StatSnapshot)
      - opt:
          do:
            - set: ph.Lag
              value: last - p.Match
          when: last > p.Match
      - bind: heard
        eval: p.Flags.Has(raft.StatHeard)
        to: p.Flags.Has
      - opt:
          do:
            - set: ph.LastContact
              to: now.Sub
              value: now.Sub(p.LastHeard)
          when: heard
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerUnreachable
          when: n.peerUnreachable(p, heard, ph.LastContact, window)
      - return: ph
  - of: (*Node).peerUnreachable
    steps:
      - bind: u, reported
        eval: n.unreachableAt[p.ID]
      - return: "!heard || lastContact >= window || (reported && u.After(p.LastHeard))"
  - of: drawID
    participants:
      - id: caller
        kind: actor
      - id: drawID
        kind: self
      - id: rand
        kind: stdlib
      - id: coreconsensus
        kind: package
    steps:
      - loop:
          do:
            - var:
                name: b
                type: "[8]byte"
            - set: _, _
              to: rand
              value: rand.Read(b[:])
            - opt:
                do:
                  - return: id
                init:
                  bind: id
                  eval: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[:]))
                  to: coreconsensus
                when: id != 0
          forever: true
  - of: drawIncarnation
    participants:
      - id: caller
        kind: actor
      - id: drawIncarnation
        kind: self
      - id: rand
        kind: stdlib
    steps:
      - var:
          name: inc
          type: coreconsensus.Incarnation
      - set: _, _
        to: rand
        value: rand.Read(inc[:])
      - return: inc
  - of: InitLog
    participants:
      - id: caller
        kind: actor
      - id: InitLog
        kind: self
      - id: log.Stamp
        kind: value
      - id: log.WriteStamp
        kind: value
    steps:
      - bind: st, err
        eval: log.Stamp()
        to: log.Stamp
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, storageFailed("stamp", err)
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: st.ID, st.Incarnation, nil
                when: st.Log.Cluster == cluster && st.Slot == slot
            - return: 0, coreconsensus.Incarnation{}, origin(coreconsensus.DataDirMismatch, errs.String("why", "stamped for another cluster or slot"))
          when: st.State != 0
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, misconfigured("slot", "not [a-z0-9-]{1,32}")
          when: "!validSlot(slot)"
      - set: st
        value: |-
          coreconsensus.StampValue{
          		Log: coreconsensus.LogIdentityValue{Cluster: cluster, Epoch: 1}, ID: drawID(),
          		Incarnation: drawIncarnation(), Slot: slot, State: coreconsensus.StampJoining,
          	}
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, storageFailed("stamp", err)
          init:
            bind: err
            eval: log.WriteStamp(st)
            to: log.WriteStamp
          when: err != nil
      - return: st.ID, st.Incarnation, nil
  - of: RedrawLog
    participants:
      - id: caller
        kind: actor
      - id: RedrawLog
        kind: self
      - id: log.Stamp
        kind: value
      - id: log.Bounds
        kind: value
      - id: drawID
        kind: internal
      - id: log.WriteStamp
        kind: value
    steps:
      - bind: st, err
        eval: log.Stamp()
        to: log.Stamp
      - opt:
          do:
            - return: 0, storageFailed("stamp", err)
          when: err != nil
      - opt:
          do:
            - return: 0, origin(coreconsensus.DataDirMismatch, errs.String("why", "not an empty joining directory"))
          init:
            bind: first, last
            eval: log.Bounds()
            to: log.Bounds
          when: st.State != coreconsensus.StampJoining || last >= first
      - set: st.ID
        to: drawID
        value: drawID()
      - opt:
          do:
            - return: 0, storageFailed("stamp", err)
          init:
            bind: err
            eval: log.WriteStamp(st)
            to: log.WriteStamp
          when: err != nil
      - return: st.ID, nil
  - of: (*Node).offer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).offer
        kind: self
      - id: n.exec
        kind: internal
      - id: n.positionOffer
        kind: internal
      - id: n.stop
        kind: internal
    steps:
      - bind: acc
        eval: "coreconsensus.InstallAcceptValue{SnapshotID: o.SnapshotID}"
      - bind: position
        eval: "false"
      - bind: ok
        eval: n.exec(func() { position = n.judgeOffer(from.ID, &o, &acc) })
        to: n.exec
      - switch:
          cases:
            - case: position
              do:
                - eval: n.positionOffer(&o, &acc)
                  to: n.positionOffer
            - case: "!ok"
              do:
                - set: acc.Refused
                  value: coreconsensus.CodeNodeStopped
      - opt:
          do:
            - eval: |-
                n.stop(origin(coreconsensus.VersionUnsupported, errs.Int("snapshot_version", int(o.Meta.Version)),
                			errs.String("snapshot_codec", o.Meta.Codec), errs.Int("cluster_version", int(o.Meta.ClusterVersion))), false)
              to: n.stop
          when: acc.Refused == coreconsensus.CodeVersionUnsupported
      - return: acc
  - of: (*Node).judgeOffer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).judgeOffer
        kind: self
      - id: n.reservePosition
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: n.screenOffer(from, o, acc) || n.answerFromHeld(o, acc) || n.answerRestoring(o, acc)
      - return: n.reservePosition(o.SnapshotID, acc)
        to: n.reservePosition
  - of: (*Node).reservePosition
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reservePosition
        kind: self
      - id: n.wg.Add
        kind: value
    steps:
      - lock:
          mutex: n.snapState.mu
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeOverloaded
            - return: "false"
          when: n.snapState.positioning != ""
      - set: n.snapState.positioning
        value: id
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - return: "true"
  - of: (*Node).positionOffer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).positionOffer
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.keepPositioned
        kind: internal
      - id: n.openSpool
        kind: internal
      - id: abandon
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - opt:
          do:
            - eval: n.keepPositioned(o.SnapshotID, nil)
              to: n.keepPositioned
            - set: acc.Refused
              value: coreconsensus.CodeNodeStopped
            - return: ""
          when: n.stopped.Load()
      - bind: sink, off, err
        eval: n.openSpool(o)
        to: n.openSpool
      - opt:
          do:
            - eval: n.keepPositioned(o.SnapshotID, nil)
              to: n.keepPositioned
            - set: acc.Refused
              value: coreconsensus.CodeStorageFailed
            - return: ""
          when: err != nil
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - set: acc.Refused
              value: coreconsensus.CodeOverloaded
            - return: ""
          when: "!n.keepPositioned(o.SnapshotID, sink)"
      - set: acc.Offset
        value: "off"
  - of: (*Node).keepPositioned
    participants:
      - id: caller
        kind: actor
      - id: (*Node).keepPositioned
        kind: self
      - id: n.keepSpool
        kind: internal
    steps:
      - lock:
          mutex: n.snapState.mu
      - set: n.snapState.positioning
        value: "\"\""
      - opt:
          do:
            - return: "false"
          when: sink == nil || n.snapState.restoring[id] > 0
      - eval: n.keepSpool(id, sink)
        to: n.keepSpool
      - return: "true"
  - of: (*Node).openSpool
    participants:
      - id: caller
        kind: actor
      - id: (*Node).openSpool
        kind: self
      - id: n.dropOtherSpools
        kind: internal
      - id: n.releaseKept
        kind: internal
      - id: n.cfg.Snapshots.Create
        kind: value
      - id: abandon
        kind: internal
    steps:
      - eval: n.dropOtherSpools(o.SnapshotID)
        to: n.dropOtherSpools
      - eval: n.releaseKept(o.SnapshotID)
        to: n.releaseKept
      - bind: sink, off, err
        eval: n.cfg.Snapshots.Create(o.SnapshotID, o.Meta)
        to: n.cfg.Snapshots.Create
      - opt:
          do:
            - return: sink, off, err
          when: err != nil || (off >= 0 && off <= o.Meta.EncodedSize)
      - eval: abandon(sink.Abort())
        to: abandon
      - set: sink, off, err
        to: n.cfg.Snapshots.Create
        value: n.cfg.Snapshots.Create(o.SnapshotID, o.Meta)
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - return: nil, 0, snapshotCorrupt("a new spool resumes past the snapshot's end")
          when: err == nil && (off < 0 || off > o.Meta.EncodedSize)
      - return: sink, off, err
  - of: (*Node).screenOffer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).screenOffer
        kind: self
      - id: n.r.CheckOffer
        kind: value
      - id: n.codecOf
        kind: internal
    steps:
      - bind: code
        eval: n.r.CheckOffer(from, *o, n.r.NoTable())
        to: n.r.CheckOffer
      - opt:
          do:
            - set: acc.Held
              value: "true"
            - return: "true"
          when: code == coreconsensus.CodeAdminPreconditionFailed
      - opt:
          do:
            - set: acc.Refused
              value: code
            - return: "true"
          when: code != 0
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeFrameInvalid
            - return: "true"
          when: o.SnapshotID != o.Meta.ID || termless(&o.Meta) || !idNamesPosition(&o.Meta)
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeVersionUnsupported
            - return: "true"
          init:
            bind: _, err
            eval: n.codecOf(&o.Meta)
            to: n.codecOf
          when: err != nil
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeLineageMismatch
            - return: "true"
          when: "!lineageAccepts(n.lineage(), o.Meta.Log, o.Meta.Position.Index)"
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeSnapshotTooLarge
            - return: "true"
          when: o.Meta.DecodedSize > n.cfg.MaxSnapshotBytes || o.Meta.EncodedSize > n.cfg.MaxSnapshotBytes
      - return: "false"
  - of: (*Node).answerFromHeld
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerFromHeld
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeStorageFailed
            - return: "true"
          when: err != nil
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - loop:
          do:
            - opt:
                do:
                  - set: acc.Held
                    value: "true"
                  - return: "true"
                when: m.ID == o.SnapshotID && !n.r.NoTable() && m.Position.Index <= applied
          key: _
          range: metas
          value: m
      - return: "false"
  - of: (*Node).answerRestoring
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerRestoring
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
    steps:
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: restoring
        eval: n.snapState.restoring[o.SnapshotID] > 0
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - return: "false"
          when: "!restoring"
      - set: acc.Refused
        value: coreconsensus.CodeOverloaded
      - return: "true"
  - of: (*Node).markRestoring
    steps:
      - lock:
          mutex: n.snapState.mu
      - opt:
          do:
            - set: n.snapState.restoring
              value: map[string]int{}
          when: n.snapState.restoring == nil
      - op: +=
        set: n.snapState.restoring[id]
        value: d
      - opt:
          do:
            - eval: delete(n.snapState.restoring, id)
          when: n.snapState.restoring[id] <= 0
  - of: (*Node).keepSpool
    participants:
      - id: caller
        kind: actor
      - id: (*Node).keepSpool
        kind: self
      - id: releaseSink
        kind: internal
    steps:
      - opt:
          do:
            - set: n.snapState.spools
              value: map[string]coreconsensus.SnapshotSink{}
          when: n.snapState.spools == nil
      - opt:
          do:
            - eval: releaseSink(old)
              to: releaseSink
          init:
            bind: old
            eval: n.snapState.spools[id]
          when: old != nil
      - set: n.snapState.spools[id]
        value: sink
  - of: (*Node).releaseKept
    participants:
      - id: caller
        kind: actor
      - id: (*Node).releaseKept
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: releaseSink
        kind: internal
    steps:
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: old
        eval: n.snapState.spools[id]
      - eval: delete(n.snapState.spools, id)
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - eval: releaseSink(old)
              to: releaseSink
          when: old != nil
  - of: releaseSink
    participants:
      - id: caller
        kind: actor
      - id: releaseSink
        kind: self
      - id: r.release
        kind: internal
    steps:
      - opt:
          do:
            - eval: r.release()
              to: r.release
          init:
            bind: r, ok
            eval: sink.(interface{ release() })
          when: ok
  - of: (*Node).dropOtherSpools
    participants:
      - id: caller
        kind: actor
      - id: (*Node).dropOtherSpools
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: abandon
        kind: internal
    steps:
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - var:
          name: stale
          type: "[]coreconsensus.SnapshotSink"
      - loop:
          do:
            - opt:
                do:
                  - set: stale
                    value: append(stale, sink)
                  - eval: delete(n.snapState.spools, other)
                when: other != id
          key: other
          range: n.snapState.spools
          value: sink
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - loop:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
          key: _
          range: stale
          value: sink
  - of: (*Node).install
    participants:
      - id: caller
        kind: actor
      - id: (*Node).install
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: origin
        kind: internal
      - id: io
        kind: stdlib
      - id: releaseSink
        kind: internal
      - id: snapshotCorrupt
        kind: internal
      - id: n.markRestoring
        kind: internal
      - id: n.stillFresh
        kind: internal
      - id: sink.Commit
        kind: value
      - id: n.stop
        kind: internal
      - id: n.HardClose
        kind: internal
      - id: n.stoppedErr
        kind: internal
      - id: n.aq.push
        kind: internal
      - id: n.restoreFailed
        kind: internal
      - id: n.installed
        kind: internal
    steps:
      - bind: snapID
        eval: req.Offer.SnapshotID
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: sink
        eval: n.snapState.spools[snapID]
      - eval: delete(n.snapState.spools, snapID)
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - return: origin(coreconsensus.SnapshotCorrupt, errs.String("why", "no accepted offer"))
              to: origin
          when: sink == nil
      - bind: meta
        eval: req.Offer.Meta
      - bind: want
        eval: meta.EncodedSize - req.Offset
      - bind: k, err
        eval: io.Copy(sink, io.LimitReader(req.Body, want+1))
        to: io
      - opt:
          do:
            - eval: releaseSink(sink)
              to: releaseSink
            - return: snapshotCorrupt("stream ended early")
              to: snapshotCorrupt
          when: err != nil || k != want
      - eval: n.markRestoring(snapID, 1)
        to: n.markRestoring
      - defer: n.markRestoring(snapID, -1)
        to: n.markRestoring
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: n.stillFresh(&req, sink)
            to: n.stillFresh
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(err, true)
                    to: n.stop
                when: errs.HasCode(err, coreconsensus.CodeStorageFailed)
            - return: err
          init:
            bind: err
            eval: sink.Commit(meta)
            to: sink.Commit
          when: err != nil
      - opt:
          do:
            - go: n.HardClose()
              to: n.HardClose
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: n.crashAfterPublish.Load()
      - bind: done
        eval: make(chan error, 1)
      - eval: "n.aq.push(applyItem{restore: &restoreReq{meta: meta, done: done}})"
        to: n.aq.push
      - select:
          cases:
            - comm: err = <-done
            - comm: <-n.stopc
              do:
                - return: n.stoppedErr()
                  to: n.stoppedErr
      - opt:
          do:
            - return: n.restoreFailed(snapID, err)
              to: n.restoreFailed
          when: err != nil
      - eval: n.installed(meta, req.From.ID)
        to: n.installed
      - return: nil
  - of: (*Node).restoreFailed
    participants:
      - id: caller
        kind: actor
      - id: (*Node).restoreFailed
        kind: self
      - id: n.stop
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: alsoFailed
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.stop(err, false)
              to: n.stop
            - return: err
          when: errs.HasCode(err, coreconsensus.CodeVersionUnsupported)
      - bind: noTable
        eval: "false"
      - opt:
          do:
            - return: err
          when: "!n.exec(func() { noTable = n.r.NoTable() })"
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: an installed snapshot did not restore\", lstr(\"id\", snapID), lstr(\"error\", err.Error()))"
              to: n.obs.warn
            - return: err
          when: noTable
      - return: alsoFailed(err, "remove", n.cfg.Snapshots.Remove(snapID))
        to: alsoFailed
  - of: (*Node).stillFresh
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stillFresh
        kind: self
      - id: n.stoppedErr
        kind: internal
      - id: abandon
        kind: internal
      - id: n.stop
        kind: internal
      - id: origin
        kind: internal
    steps:
      - var:
          name: code
          type: errs.Code
      - var:
          name: adoptErr
          type: error
      - opt:
          do:
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: |-
            !n.exec(func() {
            		if code = n.r.CheckOffer(req.From.ID, req.Offer, n.r.NoTable()); code == 0 {
            			adoptErr = n.adoptLineage(req.Offer.Meta.Log)
            		}
            	})
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - eval: n.stop(adoptErr, true)
              to: n.stop
            - return: adoptErr
          when: adoptErr != nil
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - return: origin(coreconsensus.AdminPreconditionFailed, errs.String("why", "the offer is no longer fresh"))
              to: origin
          when: code != 0
      - return: nil
  - of: (*Node).installed
    participants:
      - id: caller
        kind: actor
      - id: (*Node).installed
        kind: self
      - id: n.exec
        kind: internal
      - id: n.retain
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - eval: |-
          n.exec(func() {
          		n.r.InstallSnapshot(meta)
          		n.handleReady()
          	})
        to: n.exec
      - eval: n.retain()
        to: n.retain
      - eval: n.obs.inc(mSnapshotInstalls)
        to: n.obs.inc
      - eval: "n.obs.info(\"consensus: snapshot installed\", lattr(\"index\", meta.Position.Index), lattr(\"from\", uint64(from)))"
        to: n.obs.info
  - of: (*Node).join
    participants:
      - id: caller
        kind: actor
      - id: (*Node).join
        kind: self
      - id: n.joinReason
        kind: internal
    steps:
      - bind: pos, code, _
        eval: n.joinReason(ctx, from, r)
        to: n.joinReason
      - return: pos, code
  - of: (*Node).joinReason
    participants:
      - id: caller
        kind: actor
      - id: (*Node).joinReason
        kind: self
      - id: n.screenJoin
        kind: internal
      - id: n.alreadyJoined
        kind: internal
      - id: n.cfg.JoinAuthorizer.Authorize
        kind: value
      - id: n.obs.warn
        kind: internal
      - id: n.addJoiner
        kind: internal
    steps:
      - bind: refuse
        eval:
          closure:
            params: why string
            results: coreconsensus.PositionValue, errs.Code, string
            steps:
              - return: coreconsensus.PositionValue{}, coreconsensus.CodeJoinRefused, why
      - opt:
          do:
            - return: refuse(why)
          init:
            bind: why
            eval: n.screenJoin(&from, &r)
            to: n.screenJoin
          when: why != ""
      - set: r.SPKI
        value: from.SPKI
      - opt:
          do:
            - return: pos, 0, ""
          init:
            bind: pos, ok
            eval: n.alreadyJoined(&r)
            to: n.alreadyJoined
          when: ok
      - opt:
          do:
            - return: refuse("one JOIN per slot per election timeout")
          when: n.joinRateLimited(r.Slot)
      - opt:
          do:
            - return: refuse("the slot still has a member")
          when: n.slotTaken(r.Slot)
      - opt:
          do:
            - return: "refuse(\"the key of a removed member: join with a new key\")"
          when: n.Membership().IsRetiredKey(r.SPKI)
      - bind: op, err
        eval: n.cfg.JoinAuthorizer.Authorize(ctx, r)
        to: n.cfg.JoinAuthorizer.Authorize
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: JOIN refused by the authorizer\", lstr(\"slot\", r.Slot), lstr(\"error\", err.Error()))"
              to: n.obs.warn
            - return: refuse(joinReasonOf(err))
          when: err != nil
      - opt:
          do:
            - return: refuse("the authorizer returned an invalid operator")
          when: "!op.Valid()"
      - return: n.addJoiner(ctx, op, &r)
        to: n.addJoiner
  - of: (*Node).screenJoin
    steps:
      - var:
          name: noKey
          type: "[32]byte"
      - switch:
          cases:
            - case: n.cfg.JoinAuthorizer == nil
              do:
                - return: "\"this cluster admits no JOIN\""
            - case: r.Cluster != n.lineage().Cluster
              do:
                - return: "\"another cluster\""
            - case: r.Slot != from.Slot
              do:
                - return: "\"the slot differs from the certificate's\""
            - case: from.SPKI == noKey
              do:
                - return: "\"no key\""
      - return: "\"\""
  - of: (*Node).joinRateLimited
    participants:
      - id: caller
        kind: actor
      - id: (*Node).joinRateLimited
        kind: self
      - id: n.joinMu.Lock
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.joinMu.Unlock
        kind: value
      - id: n.joinRefused.Add
        kind: value
      - id: n.obs.inc
        kind: internal
    steps:
      - eval: n.joinMu.Lock()
        to: n.joinMu.Lock
      - opt:
          do:
            - set: n.lastJoin
              value: map[string]time.Time{}
          when: n.lastJoin == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - eval: n.joinMu.Unlock()
              to: n.joinMu.Unlock
            - eval: n.joinRefused.Add(1)
              to: n.joinRefused.Add
            - eval: n.obs.inc(mJoinsRateLimited)
              to: n.obs.inc
            - return: "true"
          init:
            bind: last, ok
            eval: n.lastJoin[slot]
          when: ok && now.Sub(last) < n.Status().Timing.ElectionTimeoutMin
      - set: n.lastJoin[slot]
        value: now
      - eval: n.joinMu.Unlock()
        to: n.joinMu.Unlock
      - return: "false"
  - of: (*Node).alreadyJoined
    participants:
      - id: caller
        kind: actor
      - id: (*Node).alreadyJoined
        kind: self
      - id: n.exec
        kind: internal
    steps:
      - var:
          name: pos
          type: coreconsensus.PositionValue
      - bind: found
        eval: "false"
      - eval: |-
          n.exec(func() {
          		conf := n.r.Status().Conf
          		m, ok := conf.Member(r.ID)
          		if !ok || m.Incarnation != r.Incarnation || m.Slot != r.Slot || m.SPKI != r.SPKI {
          			return
          		}
          		term, _ := n.r.TermAt(conf.Index)
          		pos, found = coreconsensus.PositionValue{Term: term, Index: conf.Index}, true
          	})
        to: n.exec
      - return: pos, found
  - of: (*Node).addJoiner
    participants:
      - id: caller
        kind: actor
      - id: (*Node).addJoiner
        kind: self
      - id: wire
        kind: package
      - id: n.submit
        kind: internal
      - id: errs
        kind: package
      - id: tok.Position
        kind: value
    steps:
      - bind: m
        eval: |-
          coreconsensus.MemberValue{
          		ID: r.ID, Incarnation: r.Incarnation, Slot: r.Slot, SPKI: r.SPKI, Address: r.Address, Joining: true,
          		MaxSnapshotBytes: max(r.MaxSnapshotBytes, 0),
          	}
      - bind: a
        eval: |-
          new(wire.AdminValue{
          		Operator: string(op), Change: wire.ChangeAddLearner, Target: m.ID,
          		Membership: coreconsensus.MembershipValue{Members: []coreconsensus.MemberValue{m}},
          	})
      - bind: data
        eval: wire.AppendAdmin(nil, a)
        to: wire
      - bind: tok, _, err
        eval: "n.submit(ctx, coreconsensus.EntryValue{Kind: coreconsensus.EntryMembership, BodySum: wire.BodySum(data), Data: data}, true)"
        to: n.submit
      - opt:
          do:
            - bind: c, ok
              eval: errs.CodeOf(err)
              to: errs
            - opt:
                do:
                  - set: c
                    value: coreconsensus.CodeJoinRefused
                when: "!ok"
            - bind: reason, _
              eval: errs.ReasonOf(err)
              to: errs
            - return: coreconsensus.PositionValue{}, c, reason
          when: err != nil
      - return: tok.Position(), 0, ""
        to: tok.Position
  - of: (*joinHold).begin
    steps:
      - lock:
          mutex: h.mu
      - set: h.released
        value: "false"
      - op: ++
        set: h.gen
      - return: h.gen
  - of: (*joinHold).keep
    steps:
      - bind: c
        eval: "*cfg"
      - set: c.Addresses, c.Pins
        value: slices.Clone(cfg.Addresses), slices.Clone(cfg.Pins)
      - lock:
          mutex: h.mu
      - opt:
          do:
            - set: h.cfg
              value: "&c"
          when: gen == h.gen
  - of: (*joinHold).again
    steps:
      - lock:
          mutex: h.mu
      - opt:
          do:
            - return: coreconsensus.JoinConfig{}, 0, false
          when: h.cfg == nil || h.released
      - return: "*h.cfg, h.gen, true"
  - of: (*joinHold).install
    steps:
      - lock:
          mutex: h.mu
      - opt:
          do:
            - eval: set()
          when: "!h.released && gen == h.gen"
  - of: (*joinHold).release
    steps:
      - lock:
          mutex: h.mu
      - set: h.released
        value: "true"
      - eval: drop()
  - of: sameAnswer
    participants:
      - id: caller
        kind: actor
      - id: sameAnswer
        kind: self
      - id: cmp
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - bind: byID
        eval:
          closure:
            params: x, y coreconsensus.MemberValue
            results: int
            steps:
              - return: cmp.Compare(x.ID, y.ID)
                to: cmp
      - return: |-
          slices.EqualFunc(slices.SortedFunc(slices.Values(a), byID), slices.SortedFunc(slices.Values(b), byID),
          		func(x, y coreconsensus.MemberValue) bool { return x.ID == y.ID && x.SPKI == y.SPKI })
        to: slices
  - of: (*Node).refreshJoin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).refreshJoin
        kind: self
      - id: n.wg.Add
        kind: value
      - id: n.runJoinRefresh
        kind: internal
    steps:
      - bind: j, ok
        eval: n.cfg.Transport.(refreshJoiner)
      - opt:
          do:
            - return: ""
          when: "!rd.LeaderUnheard || n.canVote || !ok || !n.rejoining.CompareAndSwap(false, true)"
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - go: n.runJoinRefresh(j)
        to: n.runJoinRefresh
  - of: (*Node).runJoinRefresh
    participants:
      - id: caller
        kind: actor
      - id: (*Node).runJoinRefresh
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.rejoining.Store
        kind: value
      - id: context
        kind: stdlib
      - id: j.refreshJoin
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - defer: n.rejoining.Store(false)
        to: n.rejoining.Store
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), joinRefreshTimeout)
        to: context
      - defer: cancel()
      - go: |-
          func() {
          		select {
          		case <-n.stopc:
          			cancel()
          		case <-ctx.Done():
          		}
          	}()
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: no leader heard while joining; the JOIN sent again admits a new answer\")"
              to: n.obs.info
          init:
            bind: changed, err
            eval: j.refreshJoin(ctx)
            to: j.refreshJoin
          when: err == nil && changed
  - of: NewMemoryLog
    steps:
      - return: "&MemoryLog{first: 1}"
  - of: compacted
    participants:
      - id: caller
        kind: actor
      - id: compacted
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreconsensus.Compacted, errs.WrapParams{},
          		errs.String("index", u64s(index)), errs.String("first", u64s(first)))
        to: errs
  - of: (*MemoryLog).Term
    steps:
      - lock:
          mutex: l.mu
          read: true
      - switch:
          cases:
            - case: index == l.first-1
              do:
                - return: l.prevTerm, nil
            - case: index < l.first
              do:
                - return: 0, compacted(index, l.first)
            - case: index >= l.first+uint64(len(l.ents))
              do:
                - return: 0, storageFailed("term", errImpossible)
      - return: l.ents[index-l.first].Position.Term, nil
  - of: (*MemoryLog).Bounds
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.first, l.first + uint64(len(l.ents)) - 1
  - of: (*MemoryLog).Append
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).Append
        kind: self
      - id: storageFailed
        kind: internal
    steps:
      - lock:
          mutex: l.mu
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("append", errImpossible)
                    to: storageFailed
                when: e.Position.Index != l.first+uint64(len(l.ents))
            - set: l.ents
              value: append(l.ents, e)
          key: _
          range: entries
          value: e
      - opt:
          do:
            - set: l.hs
              value: "*hs"
          when: hs != nil
      - return: nil
  - of: (*MemoryLog).Sync
    steps:
      - lock:
          mutex: l.mu
      - op: ++
        set: l.syncCount
      - return: l.failSync
  - of: (*MemoryLog).FailSync
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).FailSync
        kind: self
      - id: l.mu.Lock
        kind: value
      - id: l.mu.Unlock
        kind: value
    steps:
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - set: l.failSync
        value: err
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
  - of: (*MemoryLog).TruncateSuffix
    steps:
      - lock:
          mutex: l.mu
      - opt:
          do:
            - set: from
              value: l.first
          when: from < l.first
      - opt:
          do:
            - set: l.ents
              value: l.ents[:n]
          init:
            bind: "n"
            eval: from - l.first
          when: n < uint64(len(l.ents))
      - return: nil
  - of: (*MemoryLog).CompactPrefix
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).CompactPrefix
        kind: self
      - id: l.compactPrefixAt
        kind: internal
    steps:
      - return: l.compactPrefixAt(through, 0)
        to: l.compactPrefixAt
  - of: (*MemoryLog).compactPrefixAt
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).compactPrefixAt
        kind: self
      - id: storageFailed
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: nil
          when: through < l.first
      - bind: last
        eval: l.first + uint64(len(l.ents)) - 1
      - opt:
          do:
            - return: storageFailed("compact", errImpossible)
              to: storageFailed
          when: through <= last && term != 0 && term != l.ents[through-l.first].Position.Term
      - opt:
          do:
            - alt:
                - do:
                    - set: l.prevTerm
                      value: l.ents[len(l.ents)-1].Position.Term
                  when: through == last && len(l.ents) > 0
                - do:
                    - set: l.prevTerm
                      value: term
                  else: true
            - set: l.ents
              value: nil
            - set: l.first
              value: through + 1
            - return: nil
          when: through >= last
      - set: l.prevTerm
        value: l.ents[through-l.first].Position.Term
      - set: l.ents
        to: slices
        value: slices.Clone(l.ents[through-l.first+1:])
      - set: l.first
        value: through + 1
      - return: nil
  - of: (*MemoryLog).HardState
    steps:
      - lock:
