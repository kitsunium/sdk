        kind: value
      - id: strings
        kind: stdlib
    steps:
      - var:
          name: b
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: r == utf8.RuneError || !unicode.IsPrint(r)
            - opt:
                do:
                  - break: true
                when: b.Len()+utf8.RuneLen(r) > MaxJoinReasonBytes
            - eval: b.WriteRune(r)
              to: b.WriteRune
          key: _
          range: s
          value: r
      - return: strings.TrimSpace(b.String())
        to: strings
