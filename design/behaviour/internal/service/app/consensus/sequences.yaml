    participants:
      - id: caller
        kind: actor
      - id: (*Node).codecOf
        kind: self
      - id: snapshotCodec
        kind: internal
    steps:
      - return: snapshotCodec(m, n.cfg.SnapshotCodec)
        to: snapshotCodec
  - of: snapshotCodec
    participants:
      - id: caller
        kind: actor
      - id: snapshotCodec
        kind: self
      - id: knownClusterVersion
        kind: internal
      - id: linkedCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: knownClusterVersion(m)
            to: knownClusterVersion
          when: err != nil
      - opt:
          do:
            - return: nil, origin(coreconsensus.VersionUnsupported, errs.Int("snapshot_version", int(m.Version)))
          when: m.Version != 1
      - opt:
          do:
            - return: own, nil
          when: own != nil && (m.Codec == "" || coretransform.Algorithm(m.Codec) == own.Algorithm())
      - return: linkedCodec(m.Codec)
        to: linkedCodec
  - of: knownClusterVersion
    participants:
      - id: caller
        kind: actor
      - id: knownClusterVersion
        kind: self
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                origin(coreconsensus.VersionUnsupported, errs.Int("cluster_version", int(m.ClusterVersion)),
                			errs.Int("protocol_max", int(raft.ProtocolMax)))
              to: origin
          when: m.ClusterVersion > raft.ProtocolMax
      - return: nil
  - of: linkedCodec
    participants:
      - id: caller
        kind: actor
      - id: linkedCodec
        kind: self
      - id: coretransform
        kind: package
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: b, nil
                init:
                  bind: b, ok
                  eval: c.(coretransform.BoundedDecompressor)
                when: ok
          init:
            bind: c, ok
            eval: coretransform.Lookup(coretransform.Algorithm(name))
            to: coretransform
          when: ok
      - return: nil, origin(coreconsensus.VersionUnsupported, errs.String("snapshot_codec", name))
  - of: (*Node).maybeSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).maybeSnapshot
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: ss.mu.Lock
        kind: value
      - id: ss.mu.Unlock
        kind: value
      - id: n.cut
        kind: internal
      - id: n.cutFailed
        kind: internal
    steps:
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: idx, term
        eval: n.applied, n.appliedTerm
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: ss
        eval: "&n.snapState"
      - eval: ss.mu.Lock()
        to: ss.mu.Lock
      - op: +=
        set: ss.sinceBytes
        value: applied
      - bind: due
        eval: idx >= ss.last+n.cfg.SnapshotEvery || (n.cfg.SnapshotEveryBytes > 0 && ss.sinceBytes >= n.cfg.SnapshotEveryBytes && idx > ss.last)
      - opt:
          do:
            - eval: ss.mu.Unlock()
              to: ss.mu.Unlock
            - return: ""
          when: "!due || n.clk.Now().Before(ss.retryAt)"
      - opt:
          do:
            - set: ss.pending
              value: "true"
            - eval: ss.mu.Unlock()
              to: ss.mu.Unlock
            - return: ""
          when: ss.inFlight
      - set: ss.inFlight
        value: "true"
      - eval: ss.mu.Unlock()
        to: ss.mu.Unlock
      - opt:
          do:
            - eval: ss.mu.Lock()
              to: ss.mu.Lock
            - set: ss.inFlight, ss.pending
              value: false, false
            - eval: ss.mu.Unlock()
              to: ss.mu.Unlock
            - eval: n.cutFailed(err)
              to: n.cutFailed
          init:
            bind: err
            eval: n.cut(idx, term, false)
            to: n.cut
          when: err != nil
  - of: (*Node).cutFailed
    participants:
      - id: caller
        kind: actor
      - id: (*Node).cutFailed
        kind: self
      - id: n.stop
        kind: internal
      - id: ss.mu.Lock
        kind: value
      - id: n.clk.Now().Add
        kind: value
      - id: ss.mu.Unlock
        kind: value
      - id: n.obs.warn
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.stop(err, true)
              to: n.stop
            - return: ""
          when: errs.HasCode(err, coreconsensus.CodeStorageFailed)
      - bind: ss
        eval: "&n.snapState"
      - eval: ss.mu.Lock()
        to: ss.mu.Lock
      - set: ss.backoff
        value: min(max(2*ss.backoff, cutRetryMin), cutRetryMax)
      - set: ss.retryAt
        to: n.clk.Now().Add
        value: n.clk.Now().Add(ss.backoff)
      - bind: wait
        eval: ss.backoff
      - eval: ss.mu.Unlock()
        to: ss.mu.Unlock
      - eval: "n.obs.warn(\"consensus: snapshot cut failed\", lstr(\"error\", err.Error()), lstr(\"retry_in\", wait.String()))"
        to: n.obs.warn
  - of: (*Node).metaAt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).metaAt
        kind: self
      - id: n.exec
        kind: internal
    steps:
      - var:
          name: meta
          type: coreconsensus.SnapshotMetaValue
      - bind: ok
        eval: |-
          n.exec(func() {
          		eng := n.r.EngineAt(idx)
          		conf := n.r.ConfAt(idx)
          		conf.Index = idx
          		meta = coreconsensus.SnapshotMetaValue{
          			ID: snapshotID(idx, term), Version: 1,
          			Position: coreconsensus.PositionValue{Term: term, Index: idx}, Log: n.lineage(), Membership: conf,
          			ChainTip: n.r.ChainAt(idx), Codec: string(n.cfg.SnapshotCodec.Algorithm()), ChunkSize: defaultChunkSize,
          			Timing: eng.Timing, ClusterVersion: eng.Cluster, ClusterGeneration: eng.ClusterG, NoSpace: eng.NoSpace,
          		}
          	})
        to: n.exec
      - return: meta, ok
  - of: snapshotID
    participants:
      - id: caller
        kind: actor
      - id: snapshotID
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: fmt.Sprintf("%020d-%020d", idx, term)
        to: fmt
  - of: (*Node).cut
    participants:
      - id: caller
        kind: actor
      - id: (*Node).cut
        kind: self
      - id: origin
        kind: internal
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: n.cuttingSince.Store
        kind: value
      - id: n.metaAt
        kind: internal
      - id: n.stoppedErr
        kind: internal
      - id: n.cfg.Machine.Snapshot
        kind: value
      - id: n.writeSnapshot
        kind: internal
      - id: n.wg.Add
        kind: value
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.SnapshotCorrupt, errs.String("why", "a cut at term 0"), errs.String("index", u64s(idx)))
              to: origin
          when: idx > 0 && term == 0
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - set: n.snapState.sinceBytes
        value: "0"
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - eval: n.cuttingSince.Store(n.clk.Now().UnixNano())
        to: n.cuttingSince.Store
      - defer: n.cuttingSince.Store(0)
        to: n.cuttingSince.Store
      - bind: meta, ok
        eval: n.metaAt(idx, term)
        to: n.metaAt
      - opt:
          do:
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: "!ok"
      - bind: snap, err
        eval: n.cfg.Machine.Snapshot()
        to: n.cfg.Machine.Snapshot
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: n.writeSnapshot(snap, meta)
              to: n.writeSnapshot
          when: n.cfg.SnapshotPausesApply || wait
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - go: |-
          func() {
          		defer n.wg.Done()
          		if err := n.writeSnapshot(snap, meta); err != nil {
          			n.cutFailed(err)
          			return
          		}
          		n.cutPending()
          	}()
      - return: nil
  - of: (*Node).cutPending
    participants:
      - id: caller
        kind: actor
      - id: (*Node).cutPending
        kind: self
      - id: ss.mu.Lock
        kind: value
      - id: ss.mu.Unlock
        kind: value
      - id: n.aq.push
        kind: internal
    steps:
      - bind: ss
        eval: "&n.snapState"
      - eval: ss.mu.Lock()
        to: ss.mu.Lock
      - bind: pending
        eval: ss.pending
      - set: ss.pending
        value: "false"
      - eval: ss.mu.Unlock()
        to: ss.mu.Unlock
      - opt:
          do:
            - eval: "n.aq.push(applyItem{cut: true})"
              to: n.aq.push
          when: pending && !n.stopped.Load()
  - of: (*Node).writeSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).writeSnapshot
        kind: self
      - id: snap.Release
        kind: value
      - id: n.publishSnapshot
        kind: internal
      - id: state.mu.Lock
        kind: value
      - id: state.mu.Unlock
        kind: value
    steps:
      - defer: snap.Release()
        to: snap.Release
      - bind: err
        eval: n.publishSnapshot(snap, meta)
        to: n.publishSnapshot
      - bind: state
        eval: "&n.snapState"
      - eval: state.mu.Lock()
        to: state.mu.Lock
      - set: state.inFlight
        value: "false"
      - opt:
          do:
            - set: state.pending
              value: "false"
          when: err != nil
      - eval: state.mu.Unlock()
        to: state.mu.Unlock
      - return: err
  - of: (*Node).publishSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).publishSnapshot
        kind: self
      - id: n.cfg.Snapshots.Create
        kind: value
      - id: sink.Abort
        kind: value
      - id: n.clk.Now
        kind: value
      - id: newChunkWriter
        kind: internal
      - id: cutLimit
        kind: internal
      - id: snap.WriteTo
        kind: value
      - id: alsoFailed
        kind: internal
      - id: cw.Close
        kind: internal
      - id: sink.Commit
        kind: value
      - id: n.obs.record
        kind: internal
      - id: n.obs.info
        kind: internal
      - id: state.mu.Lock
        kind: value
      - id: state.mu.Unlock
        kind: value
      - id: n.afterCut
        kind: internal
    steps:
      - bind: state
        eval: "&n.snapState"
      - bind: sink, spooled, err
        eval: n.cfg.Snapshots.Create(meta.ID, meta)
        to: n.cfg.Snapshots.Create
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: sink.Abort()
                  to: sink.Abort
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: sink, _, err
                  eval: n.cfg.Snapshots.Create(meta.ID, meta)
                  op: =
                  to: n.cfg.Snapshots.Create
                when: err != nil
          when: spooled > 0
      - bind: cutStart
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: cw
        eval: newChunkWriter(sink, n.cfg.SnapshotCodec, defaultChunkSize)
        to: newChunkWriter
      - set: cw.limit
        to: cutLimit
        value: cutLimit(n.cfg.MaxSnapshotBytes, &meta.Membership)
      - opt:
          do:
            - return: alsoFailed(err, "abort", sink.Abort())
              to: alsoFailed
          init:
            bind: _, err
            eval: snap.WriteTo(cw)
            to: snap.WriteTo
          when: err != nil
      - opt:
          do:
            - return: alsoFailed(err, "abort", sink.Abort())
              to: alsoFailed
          init:
            bind: err
            eval: cw.Close()
            to: cw.Close
          when: err != nil
      - set: meta.EncodedSize, meta.DecodedSize
        value: cw.encoded, cw.decoded
      - eval: copy(meta.SHA256[:], cw.sum.Sum(nil))
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: sink.Commit(meta)
            to: sink.Commit
          when: err != nil
      - eval: n.obs.record(mSnapshotDuration, n.clk.Since(cutStart).Seconds())
        to: n.obs.record
      - eval: n.obs.record(mSnapshotBytes, float64(meta.EncodedSize))
        to: n.obs.record
      - eval: "n.obs.info(\"consensus: snapshot cut\", lattr(\"index\", meta.Position.Index), lattr(\"bytes\", uint64(meta.EncodedSize)))"
        to: n.obs.info
      - eval: state.mu.Lock()
        to: state.mu.Lock
      - set: state.last
        value: max(state.last, meta.Position.Index)
      - set: state.backoff, state.retryAt
        value: 0, time.Time{}
      - eval: state.mu.Unlock()
        to: state.mu.Unlock
      - eval: n.afterCut()
        to: n.afterCut
      - return: nil
  - of: payloadBytes
    steps:
      - var:
          name: b
          type: int64
      - loop:
          do:
            - op: +=
              set: b
              value: int64(len(es[i].Data))
          key: i
          range: es
      - return: b
  - of: tooLargeFor
    participants:
      - id: caller
        kind: actor
      - id: tooLargeFor
        kind: self
      - id: conf.Member
        kind: value
    steps:
      - bind: m, ok
        eval: conf.Member(to)
        to: conf.Member
      - opt:
          do:
            - return: 0, false
          when: "!ok || m.MaxSnapshotBytes <= 0"
      - return: m.MaxSnapshotBytes, meta.EncodedSize > m.MaxSnapshotBytes || meta.DecodedSize > m.MaxSnapshotBytes
  - of: (*Node).withheld
    participants:
      - id: caller
        kind: actor
      - id: (*Node).withheld
        kind: self
      - id: tooLargeFor
        kind: internal
      - id: n.obs.warn
        kind: internal
    steps:
      - bind: conf
        eval: n.r.Status().Conf
      - bind: limit, over
        eval: tooLargeFor(&conf, to, meta)
        to: tooLargeFor
      - opt:
          do:
            - eval: delete(n.tooLarge, to)
            - return: "false"
          when: "!over"
      - opt:
          do:
            - set: n.tooLarge[to]
              value: meta.ID
            - eval: |-
                n.obs.warn("consensus: a member announced a snapshot limit the state no longer fits in, and cannot be installed",
                			lattr("peer", uint64(to)), lattr("bytes", uint64(snapshotSize(meta))), lattr("limit", uint64(limit)))
              to: n.obs.warn
          when: n.tooLarge[to] != meta.ID
      - return: "true"
  - of: (*Node).afterCut
    participants:
      - id: caller
        kind: actor
      - id: (*Node).afterCut
        kind: self
      - id: n.retain
        kind: internal
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.exec
        kind: internal
    steps:
      - bind: metas
        eval: n.retain()
        to: n.retain
      - opt:
          do:
            - return: ""
          when: len(metas) == 0
      - bind: older
        eval: metas[min(1, len(metas)-1)].Position.Index
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: through
        eval: min(older, applied)
      - opt:
          do:
            - return: ""
          when: through <= n.cfg.SnapshotTrailing
      - op: "-="
        set: through
        value: n.cfg.SnapshotTrailing
      - eval: |-
          n.exec(func() {
          		now := n.clk.Now()
          		for to, pin := range n.sending {
          			at, held := n.pinAt(to, pin, now)
          			if !held {
          				n.releasePin(to, pin, now)
          				continue
          			}
          			if at <= n.cfg.SnapshotTrailing {
          				return
          			}
          			through = min(through, at-n.cfg.SnapshotTrailing)
          		}
          		n.r.Compact(through)
          		n.handleReady()
          	})
        to: n.exec
  - of: (*Node).retain
    participants:
      - id: caller
        kind: actor
      - id: (*Node).retain
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.noteNewest
        kind: internal
      - id: n.removeOld
        kind: internal
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - return: nil
          when: err != nil
      - opt:
          do:
            - eval: n.noteNewest(&metas[0])
              to: n.noteNewest
          when: len(metas) > 0
      - eval: n.removeOld(metas[min(2, len(metas)):])
        to: n.removeOld
      - return: metas
  - of: snapshotSize
    steps:
      - return: max(m.EncodedSize, m.DecodedSize)
  - of: nearLimit
    steps:
      - return: limit > 0 && size >= limit-limit/5
  - of: (*Node).noteNewest
    participants:
      - id: caller
        kind: actor
      - id: (*Node).noteNewest
        kind: self
      - id: snapshotSize
        kind: internal
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: snapshotLimit
        kind: internal
      - id: n.obs.warn
        kind: internal
    steps:
      - bind: size
        eval: snapshotSize(m)
        to: snapshotSize
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - set: n.snapState.newestBytes
        value: size
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - eval: |-
                n.obs.warn("consensus: the newest snapshot nears the smallest limit a member announces",
                			lattr("bytes", uint64(size)), lattr("limit", uint64(limit)))
              to: n.obs.warn
          init:
            bind: limit
            eval: snapshotLimit(n.cfg.MaxSnapshotBytes, &m.Membership)
            to: snapshotLimit
          when: nearLimit(size, limit)
  - of: (*Node).removeOld
    participants:
      - id: caller
        kind: actor
      - id: (*Node).removeOld
        kind: self
      - id: n.cfg.Snapshots.Remove
        kind: value
      - id: n.cutFailed
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - loop:
          do:
            - bind: err
              eval: n.cfg.Snapshots.Remove(m.ID)
              to: n.cfg.Snapshots.Remove
            - opt:
                do:
                  - continue: true
                when: err == nil
            - opt:
                do:
                  - eval: n.cutFailed(err)
                    to: n.cutFailed
                  - return: ""
                when: errs.HasCode(err, coreconsensus.CodeStorageFailed)
            - eval: "n.obs.info(\"consensus: an old snapshot is kept for now\", lstr(\"id\", m.ID), lstr(\"error\", err.Error()))"
              to: n.obs.info
          key: _
          range: old
          value: m
  - of: (*Node).streamEnded
    participants:
      - id: caller
        kind: actor
      - id: (*Node).streamEnded
        kind: self
      - id: n.requestCut
        kind: internal
      - id: n.sentCorrupt
        kind: internal
      - id: n.obs.warn
        kind: internal
    steps:
      - switch:
          cases:
            - case: errors.Is(err, coreconsensus.Compacted)
              do:
                - eval: n.requestCut()
                  to: n.requestCut
            - case: errs.HasCode(err, coreconsensus.CodeSnapshotCorrupt)
              do:
                - eval: n.sentCorrupt(meta, to)
                  to: n.sentCorrupt
            - case: errs.HasCode(err, coreconsensus.CodeVersionUnsupported)
              do:
                - eval: |-
                    n.obs.warn("consensus: a peer cannot read this snapshot's version or codec, and stops",
                    			lstr("id", meta.ID), lattr("peer", uint64(to)))
                  to: n.obs.warn
  - of: (*Node).sentCorrupt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sentCorrupt
        kind: self
      - id: n.verifyHeld
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: n.cfg.Snapshots.Remove
        kind: value
      - id: n.cutFailed
        kind: internal
      - id: n.cfg.Snapshots.List
        kind: value
      - id: ss.mu.Lock
        kind: value
      - id: ss.mu.Unlock
        kind: value
      - id: n.requestCut
        kind: internal
    steps:
      - bind: verr
        eval: n.verifyHeld(meta)
        to: n.verifyHeld
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: a peer found a sound snapshot corrupt\", lstr(\"id\", meta.ID), lattr(\"peer\", uint64(to)))"
              to: n.obs.warn
            - return: ""
          when: verr == nil
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: a held snapshot could not be verified\", lstr(\"id\", meta.ID), lstr(\"error\", verr.Error()))"
              to: n.obs.warn
            - return: ""
          when: "!errs.HasCode(verr, coreconsensus.CodeSnapshotCorrupt)"
      - eval: "n.obs.warn(\"consensus: a snapshot failed its checksums and is replaced\", lstr(\"id\", meta.ID), lstr(\"error\", verr.Error()))"
        to: n.obs.warn
      - opt:
          do:
            - opt:
                do:
                  - eval: n.cutFailed(err)
                    to: n.cutFailed
                when: errs.HasCode(err, coreconsensus.CodeStorageFailed)
            - return: ""
          init:
            bind: err
            eval: n.cfg.Snapshots.Remove(meta.ID)
            to: n.cfg.Snapshots.Remove
          when: err != nil
      - var:
          name: below
          type: uint64
      - opt:
          do:
            - set: below
              value: metas[0].Position.Index
          init:
            bind: metas, err
            eval: n.cfg.Snapshots.List()
            to: n.cfg.Snapshots.List
          when: err == nil && len(metas) > 0
      - bind: ss
        eval: "&n.snapState"
      - eval: ss.mu.Lock()
        to: ss.mu.Lock
      - set: ss.last
        value: min(ss.last, below)
      - eval: ss.mu.Unlock()
        to: ss.mu.Unlock
      - eval: n.requestCut()
        to: n.requestCut
  - of: (*Node).verifyHeld
    participants:
      - id: caller
        kind: actor
      - id: (*Node).verifyHeld
        kind: self
      - id: n.codecOf
        kind: internal
      - id: n.cfg.Snapshots.Open
        kind: value
      - id: verifySnapshot
        kind: internal
    steps:
      - bind: codec, err
        eval: n.codecOf(&m)
        to: n.codecOf
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: h, err
        eval: n.cfg.Snapshots.Open(m.ID)
        to: n.cfg.Snapshots.Open
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: |-
          func() {
          		if cerr := h.Close(); cerr != nil && err == nil {
          			err = cerr
          		}
          	}()
      - return: verifySnapshot(io.NewSectionReader(h, 0, m.EncodedSize), m, codec, n.cfg.MaxSnapshotBytes)
        to: verifySnapshot
  - of: (*Node).requestCut
    participants:
      - id: caller
        kind: actor
      - id: (*Node).requestCut
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: n.aq.push
        kind: internal
    steps:
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: busy
        eval: n.snapState.inFlight
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - eval: "n.aq.push(applyItem{cut: true})"
              to: n.aq.push
          when: "!busy"
  - of: (*Node).SaveSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).SaveSnapshot
        kind: self
      - id: n.Barrier
        kind: internal
      - id: ss.mu.Lock
        kind: value
      - id: ss.mu.Unlock
        kind: value
      - id: n.aq.push
        kind: internal
      - id: req.leave
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, origin(coreconsensus.MembershipInvalid, errs.String("why", "operator"))
          when: "!op.Valid()"
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: _, err
            eval: n.Barrier(ctx)
            to: n.Barrier
          when: err != nil
      - bind: ss
        eval: "&n.snapState"
      - eval: ss.mu.Lock()
        to: ss.mu.Lock
      - opt:
          do:
            - eval: ss.mu.Unlock()
              to: ss.mu.Unlock
            - return: coreconsensus.SnapshotMetaValue{}, origin(coreconsensus.Overloaded, errs.String("why", "a cut is in flight"))
          when: ss.inFlight
      - set: ss.inFlight
        value: "true"
      - eval: ss.mu.Unlock()
        to: ss.mu.Unlock
      - bind: req
        eval: "&saveReq{op: op, done: make(chan saveRes, 1)}"
      - eval: "n.aq.push(applyItem{save: req})"
        to: n.aq.push
      - select:
          cases:
            - comm: r := <-req.done
              do:
                - opt:
                    do:
                      - return: r.meta, r.err
                    when: r.err != nil
                - return: r.meta, copySaved(ctx, r.h, w)
            - comm: <-ctx.Done()
              do:
                - eval: req.leave()
                  to: req.leave
                - return: coreconsensus.SnapshotMetaValue{}, ctx.Err()
            - comm: <-n.loopDone
              do:
                - eval: req.leave()
                  to: req.leave
                - return: coreconsensus.SnapshotMetaValue{}, n.stoppedErr()
  - of: copySaved
    participants:
      - id: caller
        kind: actor
      - id: copySaved
        kind: self
      - id: ctx.Err
        kind: value
    steps:
      - bind: copied
        eval: make(chan error, 1)
      - go: |-
          func() {
          		_, err := io.Copy(w, ctxReader{ctx: ctx, r: io.NewSectionReader(h, 0, h.Meta().EncodedSize)})
          		if cerr := h.Close(); err == nil {
          			err = cerr
          		} else {
          			err = alsoFailed(err, "close", cerr)
          		}
          		copied <- err
          	}()
      - select:
          cases:
            - comm: err := <-copied
              do:
                - return: err
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
  - of: (*Node).publishedAt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).publishedAt
        kind: self
      - id: n.cfg.Snapshots.Open
        kind: value
    steps:
      - opt:
          do:
            - return: nil, false
          when: idx == 0
      - bind: h, err
        eval: n.cfg.Snapshots.Open(snapshotID(idx, term))
        to: n.cfg.Snapshots.Open
      - opt:
          do:
            - return: nil, false
          when: err != nil
      - return: h, true
  - of: ctxReader.Read
    participants:
      - id: caller
        kind: actor
      - id: ctxReader.Read
        kind: self
      - id: c.ctx.Err
        kind: value
      - id: c.r.Read
        kind: value
    steps:
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: c.ctx.Err()
            to: c.ctx.Err
          when: err != nil
      - return: c.r.Read(p)
        to: c.r.Read
  - of: (*Node).save
    participants:
      - id: caller
        kind: actor
      - id: (*Node).save
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.publishedAt
        kind: internal
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: n.obs.info
        kind: internal
      - id: n.cutPending
        kind: internal
      - id: req.answer
        kind: internal
      - id: n.cut
        kind: internal
      - id: n.cfg.Snapshots.Open
        kind: value
      - id: h.Meta
        kind: value
      - id: n.cutFailed
        kind: internal
    steps:
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: idx, term
        eval: n.applied, n.appliedTerm
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - opt:
          do:
            - eval: n.snapState.mu.Lock()
              to: n.snapState.mu.Lock
            - set: n.snapState.inFlight
              value: "false"
            - eval: n.snapState.mu.Unlock()
              to: n.snapState.mu.Unlock
            - eval: "n.obs.info(\"consensus: snapshot saved\", lstr(\"operator\", string(req.op)), lattr(\"index\", idx))"
              to: n.obs.info
            - eval: n.cutPending()
              to: n.cutPending
            - eval: "req.answer(&saveRes{meta: h.Meta(), h: h})"
              to: req.answer
            - return: ""
          init:
            bind: h, ok
            eval: n.publishedAt(idx, term)
            to: n.publishedAt
          when: ok
      - bind: err
        eval: n.cut(idx, term, true)
        to: n.cut
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - var:
          name: h
          type: coreconsensus.SnapshotHandle
      - alt:
          - do:
              - opt:
                  do:
                    - set: m
                      to: h.Meta
                      value: h.Meta()
                  init:
                    bind: h, err
                    eval: n.cfg.Snapshots.Open(snapshotID(idx, term))
                    op: =
                    to: n.cfg.Snapshots.Open
                  when: err == nil
            when: err == nil
          - do:
              - eval: n.snapState.mu.Lock()
                to: n.snapState.mu.Lock
              - set: n.snapState.inFlight, n.snapState.pending
                value: false, false
              - eval: n.snapState.mu.Unlock()
                to: n.snapState.mu.Unlock
              - eval: n.cutFailed(err)
                to: n.cutFailed
            else: true
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: snapshot saved\", lstr(\"operator\", string(req.op)), lattr(\"index\", idx))"
              to: n.obs.info
            - eval: n.cutPending()
              to: n.cutPending
          when: err == nil
      - eval: "req.answer(&saveRes{meta: m, h: h, err: err})"
        to: req.answer
  - of: (*Node).snapshotToSend
    participants:
      - id: caller
        kind: actor
      - id: (*Node).snapshotToSend
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.lineage
        kind: internal
      - id: metas[0].Membership.Member
        kind: value
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false
          when: err != nil || len(metas) == 0
      - bind: l
        eval: n.lineage()
        to: n.lineage
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false
          when: "!metas[0].Log.Same(l) || metas[0].Position.Index < l.KeptIndex || termless(&metas[0])"
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false
          init:
            bind: _, listed
            eval: metas[0].Membership.Member(n.stamp.ID)
            to: metas[0].Membership.Member
          when: "!listed"
      - return: metas[0], true
  - of: (*Node).sendSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sendSnapshot
        kind: self
      - id: n.snapshotToSend
        kind: internal
      - id: n.requestCut
        kind: internal
      - id: n.r.SnapshotDone
        kind: value
      - id: n.cfg.Snapshots.Open
        kind: value
      - id: moved.Store
        kind: value
      - id: context
        kind: stdlib
      - id: n.wg.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, busy
            eval: n.sendStop[to]
          when: busy
      - bind: meta, ok
        eval: n.snapshotToSend()
        to: n.snapshotToSend
      - opt:
          do:
            - eval: n.requestCut()
              to: n.requestCut
            - eval: n.r.SnapshotDone(to, 0, false)
              to: n.r.SnapshotDone
            - return: ""
          when: "!ok"
      - opt:
          do:
            - eval: n.r.SnapshotDone(to, 0, false)
              to: n.r.SnapshotDone
            - return: ""
          when: n.withheld(to, &meta)
      - bind: h, err
        eval: n.cfg.Snapshots.Open(meta.ID)
        to: n.cfg.Snapshots.Open
      - opt:
          do:
            - eval: n.r.SnapshotDone(to, 0, false)
              to: n.r.SnapshotDone
            - return: ""
          when: err != nil
      - bind: sent, moved
        eval: new(atomic.Int64), new(atomic.Int64)
      - eval: moved.Store(n.clk.Now().UnixNano())
        to: moved.Store
      - set: n.sending[to]
        value: "sendPin{index: meta.Position.Index, sent: sent, moved: moved}"
      - bind: offer
        eval: "coreconsensus.InstallOfferValue{Term: n.r.Status().Term, SnapshotID: meta.ID, Meta: meta}"
      - bind: ctx, cancel
        eval: context.WithCancel(context.Background())
        to: context
      - set: n.sendStop[to]
        value: cancel
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - go: |-
          func() {
          		defer n.wg.Done()
          		go func() {
          			select {
          			case <-n.stopc:
          				cancel()
          			case <-ctx.Done():
          			}
          		}()
          		// The handle pins the snapshot until the transfer completes, so
          		// compaction cannot delete it mid-transfer (R3-16).
          		err := n.cfg.Transport.Stream(ctx, to, offer, func(off int64) (io.ReadCloser, error) {
          			if off < 0 || off > meta.EncodedSize {
          				return nil, origin(coreconsensus.FrameInvalid, errs.Int64("offset", off))
          			}
          			// The offer was accepted: the stream moved.
          			moved.Store(n.clk.Now().UnixNano())
          			return io.NopCloser(&sentReader{r: io.NewSectionReader(h, off, meta.EncodedSize-off), n: n, sent: sent, moved: moved}), nil
          		})
          		cancel()
          		if cerr := h.Close(); cerr != nil {
          			// The transfer is over whatever the read handle says; the pin
          			// it held is released either way.
          			n.obs.warn("consensus: snapshot handle close failed", lstr("id", meta.ID), lstr("error", cerr.Error()))
          		}
          		n.streamEnded(meta, to, err)
          		n.exec(func() {
          			if err == nil {
          				until := n.clk.Now().Add(n.pinBound(to))
          				n.sending[to] = sendPin{index: meta.Position.Index, until: until}
          			} else {
          				delete(n.sending, to)
          				n.aq.push(applyItem{compact: true})
          			}
          			delete(n.sendStop, to)
          			n.r.SnapshotDone(to, meta.Position.Index, err == nil)
          			n.handleReady()
          		})
          	}()
  - of: (*Node).guardSpace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).guardSpace
        kind: self
      - id: n.spaceShort
        kind: internal
      - id: g.short.Store
        kind: value
      - id: n.r.Status
        kind: value
      - id: st.Conf.Member
        kind: value
      - id: n.obs.warn
        kind: internal
      - id: now.Add
        kind: value
      - id: g.raising.Store
        kind: value
      - id: n.wg.Add
        kind: value
      - id: n.raiseNoSpace
        kind: internal
    steps:
      - bind: g
        eval: "&n.space"
      - bind: why, short
        eval: n.spaceShort(now)
        to: n.spaceShort
      - eval: g.short.Store(short)
        to: g.short.Store
      - opt:
          do:
            - set: g.nonVoterShort
              value: "false"
            - return: ""
          when: "!short"
      - opt:
          do:
            - return: ""
          when: g.raising.Load() || now.Before(g.nextRaise)
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - return: ""
          when: st.NoSpace != 0
      - opt:
          do:
            - opt:
                do:
                  - set: g.nonVoterShort
                    value: "true"
                  - bind: role
                    eval: "\"learner\""
                  - opt:
                      do:
                        - set: role
                          value: "\"node the configuration does not name\""
                      when: "!ok"
                  - eval: |-
                      n.obs.warn("consensus: this node's disk is short and it votes in no configuration; it refuses its own proposals and raises no alarm for the cluster",
                      				lstr("why", why), lstr("member", role))
                    to: n.obs.warn
                when: "!g.nonVoterShort"
            - return: ""
          init:
            bind: m, ok
            eval: st.Conf.Member(n.stamp.ID)
            to: st.Conf.Member
          when: "!ok || !m.Voter"
      - set: g.nonVoterShort
        value: "false"
      - set: g.nextRaise
        to: now.Add
        value: now.Add(spaceRaiseEvery)
      - eval: g.raising.Store(true)
        to: g.raising.Store
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - go: n.raiseNoSpace(why)
        to: n.raiseNoSpace
  - of: (*Node).spaceShort
    participants:
      - id: caller
        kind: actor
      - id: (*Node).spaceShort
        kind: self
      - id: sr.freeBytes
        kind: internal
    steps:
      - bind: sr, ok
        eval: n.cfg.Log.(spaceReporter)
      - opt:
          do:
            - return: "\"\", false"
          when: "!ok"
      - opt:
          do:
            - return: "\"the log reached MaxLogBytes less LogReserveBytes\", true"
          when: sr.logBytes()+n.cfg.LogReserveBytes >= n.cfg.MaxLogBytes
      - bind: g
        eval: "&n.space"
      - opt:
          do:
            - set: g.checkedAt
              value: now
            - bind: free
              eval: sr.freeBytes()
              to: sr.freeBytes
            - set: g.fsShort
              value: free >= 0 && free < n.cfg.LogReserveBytes
          when: now.Sub(g.checkedAt) >= spaceCheckEvery
      - opt:
          do:
            - return: "\"the filesystem's free space fell under LogReserveBytes\", true"
          when: g.fsShort
      - return: "\"\", false"
  - of: (*Node).refuseShort
    steps:
      - opt:
          do:
            - return: "false"
          when: p.admin || !n.space.short.Load()
      - send:
          chan: p.done
          value: "propResult{err: origin(coreconsensus.NoSpace, errs.String(\"why\", \"this node's disk is short\"))}"
      - return: "true"
  - of: (*Node).raiseNoSpace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).raiseNoSpace
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.space.raising.Store
        kind: value
      - id: n.obs.warn
        kind: internal
      - id: context
        kind: stdlib
      - id: abandon
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - defer: n.space.raising.Store(false)
        to: n.space.raising.Store
      - eval: "n.obs.warn(\"consensus: raising the no-space alarm\", lstr(\"why\", why))"
        to: n.obs.warn
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), 2*n.Status().Timing.ElectionTimeoutMax+time.Second)
        to: context
      - defer: cancel()
      - eval: "abandon(n.admin(ctx, coreconsensus.EntryNoSpaceRaise, wire.AdminValue{Operator: string(spaceOperator)}))"
        to: abandon
  - of: (*Node).watchUnfed
    participants:
      - id: caller
        kind: actor
      - id: (*Node).watchUnfed
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: st.Conf.Member
        kind: value
      - id: n.feedOrNot
        kind: internal
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - eval: clear(n.unfed)
            - return: ""
          when: st.Role != coreconsensus.RoleLeader
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: newest
        eval: n.snapState.newestBytes
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(n.unfed, id)
                init:
                  bind: m, ok
                  eval: st.Conf.Member(id)
                  to: st.Conf.Member
                when: "!ok || m.Voter"
          key: id
          range: n.unfed
      - loop:
          do:
            - eval: n.feedOrNot(&st.Conf.Members[i], newest)
              to: n.feedOrNot
          key: i
          range: st.Conf.Members
  - of: (*Node).feedOrNot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).feedOrNot
        kind: self
      - id: n.obs.warn
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - bind: over
        eval: "!m.Voter && m.MaxSnapshotBytes > 0 && newest > m.MaxSnapshotBytes"
      - switch:
          cases:
            - case: over && !n.unfed[m.ID]
              do:
                - set: n.unfed[m.ID]
                  value: "true"
                - eval: |-
                    n.obs.warn("consensus: the state outgrew a learner's announced snapshot limit; it is sent no more entries until it fits or is removed",
                    			lattr("peer", uint64(m.ID)), lattr("bytes", uint64(newest)), lattr("limit", uint64(m.MaxSnapshotBytes)))
                  to: n.obs.warn
            - case: "!over && n.unfed[m.ID]"
              do:
                - eval: delete(n.unfed, m.ID)
                - eval: "n.obs.info(\"consensus: a learner's announced snapshot limit fits the state again; it is fed the log\", lattr(\"peer\", uint64(m.ID)))"
                  to: n.obs.info
  - of: noteUnmarked
    participants:
      - id: caller
        kind: actor
      - id: noteUnmarked
        kind: self
      - id: filepath
        kind: stdlib
      - id: unmarked.Store
        kind: value
    steps:
      - opt:
          do:
            - set: dir
              value: abs
          init:
            bind: abs, err
            eval: filepath.Abs(dir)
            to: filepath
          when: err == nil
      - eval: unmarked.Store(dir, struct{}{})
        to: unmarked.Store
  - of: refuseUnmarked
    participants:
      - id: caller
        kind: actor
      - id: refuseUnmarked
        kind: self
      - id: filepath
        kind: stdlib
      - id: unmarked.Load
        kind: value
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - set: dir
              value: abs
          init:
            bind: abs, err
            eval: filepath.Abs(dir)
            to: filepath
          when: err == nil
      - opt:
          do:
            - return: |-
                origin(coreconsensus.StopMarkerPresent, errs.String("dir", dir),
                			errs.String("detail", "a STORAGE_FAILED stop of this process wrote no marker: exit, and start again after a reboot"))
              to: origin
          init:
            bind: _, ok
            eval: unmarked.Load(dir)
            to: unmarked.Load
          when: ok
      - return: nil
  - of: (*fileLog).probeRuntimeDir
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).probeRuntimeDir
        kind: self
      - id: l.runtimeMarker
        kind: internal
      - id: os
        kind: stdlib
      - id: writeFileSync
        kind: internal
      - id: misconfigured
        kind: internal
    steps:
      - bind: probe
        eval: l.runtimeMarker("PROBE")
        to: l.runtimeMarker
      - bind: err
        eval: os.MkdirAll(l.runDir, 0o700)
        to: os
      - opt:
          do:
            - set: err
              to: writeFileSync
              value: writeFileSync(probe, nil)
          when: err == nil
      - opt:
          do:
            - set: err
              to: os
              value: os.Remove(probe)
          when: err == nil
      - opt:
          do:
            - return: "misconfigured(\"RuntimeDir\", fmt.Sprintf(\"the boot-scoped marker directory %s is not writable: %v\", l.runDir, err))"
              to: misconfigured
          when: err != nil
      - return: nil
  - of: (*fileLog).storageFailedThisBoot
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).storageFailedThisBoot
        kind: self
      - id: l.markerApplies
        kind: internal
    steps:
      - return: l.markerApplies(true)
        to: l.markerApplies
  - of: (*fileLog).markerApplies
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).markerApplies
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: stopMarkerPresent
        kind: internal
    steps:
      - bind: ents, err
        eval: os.ReadDir(l.dir)
        to: os
      - opt:
          do:
            - return: storageFailed("markers", err)
              to: storageFailed
          when: err != nil
      - bind: boot
        eval: "[]byte(\"boot=\" + bootID() + \"\\n\")"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: storageOnly && !strings.HasSuffix(p, "STORAGE_FAILED")
            - bind: b, err
              eval: os.ReadFile(p)
              to: os
            - opt:
                do:
                  - continue: true
                when: errors.Is(err, os.ErrNotExist)
            - opt:
                do:
                  - return: storageFailed("read stop marker", err)
                    to: storageFailed
                when: err != nil
            - opt:
                do:
                  - continue: true
                when: strings.HasSuffix(p, "STORAGE_FAILED") && !bytes.HasPrefix(b, boot)
            - return: stopMarkerPresent(p, b)
              to: stopMarkerPresent
          key: _
          range: l.markerPaths(ents)
          value: p
      - return: nil
  - of: datasync
    participants:
      - id: caller
        kind: actor
      - id: datasync
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: err
              eval: syscall.Fdatasync(int(f.Fd()))
              to: syscall
            - opt:
                do:
                  - return: err
                when: err != syscall.EINTR
          forever: true
  - of: bootID
    participants:
      - id: caller
        kind: actor
      - id: bootID
        kind: self
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: b, err
        eval: os.ReadFile("/proc/sys/kernel/random/boot_id")
        to: os
      - opt:
          do:
            - return: "\"\""
          when: err != nil
      - return: strings.TrimSpace(string(b))
        to: strings
  - of: runtimeMarkerDir
    steps:
      - return: "\"/run/kitsunium-consensus\""
  - of: syncDir
    participants:
      - id: caller
        kind: actor
      - id: syncDir
        kind: self
      - id: os
        kind: stdlib
      - id: d.Sync
        kind: value
    steps:
      - bind: d, err
        eval: os.Open(dir)
        to: os
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: |-
          func() {
          		if cerr := d.Close(); cerr != nil && err == nil {
          			err = cerr
          		}
          	}()
      - return: d.Sync()
        to: d.Sync
  - of: transportMisconfigured
    participants:
      - id: caller
        kind: actor
      - id: transportMisconfigured
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.TransportMisconfigured, errs.String("field", field), errs.String("why", why))
        to: origin
  - of: peerRejected
    participants:
      - id: caller
        kind: actor
      - id: peerRejected
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.PeerRejected, errs.String("why", why))
        to: origin
  - of: parseSAN
    participants:
      - id: caller
        kind: actor
      - id: parseSAN
        kind: self
      - id: sanCluster
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - var:
          name: cid
          type: coreconsensus.ClusterID
      - opt:
          do:
            - return: cid, "", peerRejected("not exactly one URI SAN")
          when: len(c.URIs) != 1
      - bind: u
        eval: c.URIs[0]
      - opt:
          do:
            - return: cid, "", peerRejected("URI SAN form")
          when: u.Scheme != sanScheme || u.User != nil || u.Port() != "" || u.RawQuery != "" || u.Fragment != "" || u.Opaque != ""
      - bind: cid, err
        eval: sanCluster(u.Host)
        to: sanCluster
      - opt:
          do:
            - return: cid, "", err
          when: err != nil
      - bind: slot, ok
        eval: strings.CutPrefix(u.Path, "/slot/")
        to: strings
      - opt:
          do:
            - return: cid, "", peerRejected("URI SAN slot")
          when: "!ok || !validSlot(slot) || u.String() != sanScheme+\"://\"+u.Host+\"/slot/\"+slot"
      - return: cid, slot, nil
  - of: sanCluster
    participants:
      - id: caller
        kind: actor
      - id: sanCluster
        kind: self
      - id: hex
        kind: stdlib
    steps:
      - var:
          name: cid
          type: coreconsensus.ClusterID
      - bind: b, err
        eval: hex.DecodeString(host)
        to: hex
      - opt:
          do:
            - return: cid, peerRejected("URI SAN cluster")
          when: err != nil || len(b) != len(cid) || hex.EncodeToString(b) != host
      - eval: copy(cid[:], b)
      - return: cid, nil
  - of: SAN
    steps:
      - return: "&url.URL{Scheme: sanScheme, Host: hex.EncodeToString(cluster[:]), Path: \"/slot/\" + slot}"
  - of: spkiOf
    participants:
      - id: caller
        kind: actor
      - id: spkiOf
        kind: self
      - id: sha256
        kind: stdlib
    steps:
      - return: sha256.Sum256(c.RawSubjectPublicKeyInfo)
        to: sha256
  - of: SPKIOf
    participants:
      - id: caller
        kind: actor
      - id: SPKIOf
        kind: self
      - id: spkiOf
        kind: internal
    steps:
      - return: spkiOf(c)
        to: spkiOf
  - of: (*peerConn).halt
    participants:
      - id: caller
        kind: actor
      - id: (*peerConn).halt
        kind: self
      - id: pc.stopOnce.Do
        kind: value
    steps:
      - eval: |-
          pc.stopOnce.Do(func() {
          		pc.mu.Lock()
          		pc.halted = true
          		c := pc.conn
          		pc.conn = nil
          		pc.mu.Unlock()
          		close(pc.stop)
          		if c != nil {
          			abandon(c.Close())
          		}
          	})
        to: pc.stopOnce.Do
  - of: (*peerConn).track
    steps:
      - lock:
          mutex: pc.mu
      - opt:
          do:
            - return: "false"
          when: pc.halted
      - set: pc.conn
        value: nil
      - opt:
          do:
            - set: pc.conn
              value: link.conn
          when: link.conn != nil
      - return: "true"
  - of: (*TransportConfig).validate
    participants:
      - id: caller
        kind: actor
      - id: (*TransportConfig).validate
        kind: self
      - id: clampInt
        kind: internal
      - id: clampDuration
        kind: internal
      - id: clampInt64
        kind: internal
      - id: transportMisconfigured
        kind: internal
    steps:
      - eval: clampInt(&c.MaxFrameBytes, defaultMaxFrameBytes)
        to: clampInt
      - eval: clampInt(&c.MaxControlFrameBytes, 64<<10)
        to: clampInt
      - eval: clampDuration(&c.HandshakeTimeout, time.Second)
        to: clampDuration
      - eval: clampInt64(&c.PeerQueueBytes, 64<<20)
        to: clampInt64
      - eval: clampDuration(&c.MaxConnectionAge, 24*time.Hour)
        to: clampDuration
      - eval: clampDuration(&c.WriteTimeout, 2*time.Second)
        to: clampDuration
      - eval: clampDuration(&c.JoinTimeout, 10*time.Second)
        to: clampDuration
      - eval: clampInt(&c.MaxUnauthenticatedPerIP, defaultUnauthenticatedPerIP)
        to: clampInt
      - eval: clampInt(&c.ReservedMemberSlots, defaultReservedMemberSlots)
        to: clampInt
      - switch:
          cases:
            - case: c.Roots == nil
              do:
                - return: transportMisconfigured("Roots", "nil")
                  to: transportMisconfigured
            - case: c.Certificate == nil && c.GetCertificate == nil
              do:
                - return: transportMisconfigured("Certificate", "nil")
                  to: transportMisconfigured
            - case: c.HandshakeTimeout > time.Second
              do:
                - return: transportMisconfigured("HandshakeTimeout", "above 1 s")
                  to: transportMisconfigured
            - case: c.MaxControlFrameBytes >= c.MaxFrameBytes
              do:
                - return: transportMisconfigured("MaxControlFrameBytes", "not below MaxFrameBytes")
                  to: transportMisconfigured
            - case: c.ListenAddress == ""
              do:
                - return: transportMisconfigured("ListenAddress", "empty")
                  to: transportMisconfigured
      - return: nil
  - of: clampDuration
    steps:
      - opt:
          do:
            - set: "*v"
              value: d
          when: "*v <= 0"
  - of: NewTCPTransport
    participants:
      - id: caller
        kind: actor
      - id: NewTCPTransport
        kind: self
      - id: c.validate
        kind: internal
      - id: newTCPTransport
        kind: internal
    steps:
      - bind: c
        eval: "*cfg"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: c.validate()
            to: c.validate
          when: err != nil
      - return: newTCPTransport(&c, nil)
        to: newTCPTransport
  - of: newTCPTransport
    participants:
      - id: caller
        kind: actor
      - id: newTCPTransport
        kind: self
      - id: tlsid
        kind: package
      - id: id.Leaf
        kind: value
      - id: parseSAN
        kind: internal
      - id: t.wg.Add
        kind: value
      - id: t.accept
        kind: internal
    steps:
      - opt:
          do:
            - bind: get
              eval: cfg.GetCertificate
            - opt:
                do:
                  - bind: c
                    eval: cfg.Certificate
                  - set: get
                    value:
                      closure:
                        results: "*tls.Certificate, error"
                        steps:
                          - return: c, nil
                when: get == nil
            - var:
                name: err
                type: error
            - opt:
                do:
                  - return: nil, transportMisconfigured("Certificate", err.Error())
                init:
                  bind: id, err
                  eval: tlsid.NewIdentity(get, cfg.Roots)
                  op: =
                  to: tlsid
                when: err != nil
          when: id == nil
      - bind: leaf, err
        eval: id.Leaf()
        to: id.Leaf
      - opt:
          do:
            - return: nil, transportMisconfigured("Certificate", "unparsable")
          when: err != nil
      - bind: cid, slot, err
        eval: parseSAN(leaf)
        to: parseSAN
      - opt:
          do:
            - return: nil, transportMisconfigured("Certificate", "URI SAN")
          when: err != nil
      - bind: t
        eval: |-
          &TCPTransport{
          		cfg: *cfg, id: id, cluster: cid, slot: slot,
          		members: map[coreconsensus.GroupID][]coreconsensus.MemberValue{}, byID: map[coreconsensus.NodeID]coreconsensus.MemberValue{},
          		bySPKI: map[[32]byte]coreconsensus.MemberValue{}, out: map[outKey]*peerConn{}, in: map[net.Conn][32]byte{}, raw: map[net.Conn]struct{}{}, admission: server.NewAdmission(server.AdmissionConfig{PerAddress: cfg.MaxUnauthenticatedPerIP, Reserved: cfg.ReservedMemberSlots}), peerExpiry: map[coreconsensus.NodeID]time.Time{},
          		done: make(chan struct{}),
          	}
      - bind: ln, err
        eval: listenTCP("tcp", cfg.ListenAddress)
      - opt:
          do:
            - return: nil, transportMisconfigured("ListenAddress", err.Error())
          when: err != nil
      - set: t.ln
        value: ln
      - eval: t.wg.Add(1)
        to: t.wg.Add
      - go: t.accept()
        to: t.accept
      - return: t, nil
  - of: (*TCPTransport).Addr
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Addr
        kind: self
      - id: t.ln.Addr().String
        kind: value
    steps:
      - return: t.ln.Addr().String()
        to: t.ln.Addr().String
  - of: (*TCPTransport).Cluster
    steps:
      - return: t.cluster
  - of: (*TCPTransport).Slot
    steps:
      - return: t.slot
  - of: (*TCPTransport).checkPeer
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).checkPeer
        kind: self
      - id: parseSAN
        kind: internal
      - id: peerRejected
        kind: internal
    steps:
      - return:
          closure:
            params: p tlsid.PeerIdentityValue
            results: error
            steps:
              - bind: cid, _, err
                eval: parseSAN(p.Leaf)
                to: parseSAN
              - opt:
                  do:
                    - return: err
                  when: err != nil
              - opt:
                  do:
                    - return: peerRejected("another cluster")
                      to: peerRejected
                  when: cid != t.cluster
              - opt:
                  do:
                    - return: peerRejected("key does not match the member's pin")
                      to: peerRejected
                  when: pin != nil && p.SPKI != *pin
              - return: nil
  - of: (*TCPTransport).accept
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).accept
        kind: self
      - id: t.wg.Done
        kind: value
      - id: time
        kind: stdlib
      - id: wait.Stop
        kind: value
      - id: t.ln.Accept
        kind: value
      - id: t.acceptFailed
        kind: internal
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: abandon
        kind: internal
      - id: t.admission.Admit
        kind: value
      - id: t.wg.Add
        kind: value
      - id: t.serve
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
      - var:
          name: delay
          type: time.Duration
      - bind: wait
        eval: time.NewTimer(acceptBackoffFirst)
        to: time
      - eval: wait.Stop()
        to: wait.Stop
      - defer: wait.Stop()
        to: wait.Stop
      - loop:
          do:
            - bind: c, err
              eval: t.ln.Accept()
              to: t.ln.Accept
            - opt:
                do:
                  - var:
                      name: goOn
                      type: bool
                  - opt:
                      do:
                        - return: ""
                      init:
                        bind: delay, goOn
                        eval: t.acceptFailed(err, delay, wait)
                        op: =
                        to: t.acceptFailed
                      when: "!goOn"
                  - continue: true
                when: err != nil
            - set: delay
              value: "0"
            - eval: t.mu.Lock()
              to: t.mu.Lock
            - opt:
                do:
                  - eval: t.mu.Unlock()
                    to: t.mu.Unlock
                  - eval: abandon(c.Close())
                    to: abandon
                  - return: ""
                when: t.closed
            - bind: release, ok
              eval: t.admission.Admit(c.RemoteAddr())
              to: t.admission.Admit
            - opt:
                do:
                  - eval: t.mu.Unlock()
                    to: t.mu.Unlock
                  - eval: abandon(c.Close())
                    to: abandon
                  - continue: true
                when: "!ok"
            - set: t.raw[c]
              value: struct{}{}
            - eval: t.wg.Add(1)
              to: t.wg.Add
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - go: t.serve(c, release)
              to: t.serve
          forever: true
  - of: (*TCPTransport).acceptFailed
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).acceptFailed
        kind: self
      - id: acceptBackoff
        kind: internal
      - id: wait.Reset
        kind: value
    steps:
      - opt:
          do:
            - return: delay, false
          when: errors.Is(err, net.ErrClosed)
      - set: delay
        to: acceptBackoff
        value: acceptBackoff(delay)
      - eval: wait.Reset(delay)
        to: wait.Reset
      - select:
          cases:
            - comm: <-t.done
              do:
                - return: delay, false
            - comm: <-wait.C
              do:
                - return: delay, true
  - of: acceptBackoff
    steps:
      - opt:
          do:
            - return: acceptBackoffFirst
          when: prev == 0
      - return: min(2*prev, acceptBackoffCeiling)
  - of: (*TCPTransport).serve
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serve
        kind: self
      - id: t.wg.Done
        kind: value
      - id: t.handshake
        kind: internal
      - id: parseSAN
        kind: internal
      - id: t.serveAuthenticated
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
      - defer: |-
          func() {
          		// The connection is over: whatever its Close says, nothing reads it.
          		abandon(raw.Close())
          		t.mu.Lock()
          		delete(t.raw, raw)
          		t.mu.Unlock()
          	}()
      - defer: release()
      - bind: conn, pid, lane, ok
        eval: t.handshake(raw, release)
        to: t.handshake
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: _, slot, err
        eval: parseSAN(pid.Leaf)
        to: parseSAN
      - opt:
          do:
            - return: ""
          when: err != nil
      - eval: t.serveAuthenticated(conn, &pid, lane, slot)
        to: t.serveAuthenticated
  - of: (*TCPTransport).handshake
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).handshake
        kind: self
      - id: tls
        kind: stdlib
      - id: conn.SetDeadline
        kind: value
      - id: conn.Handshake
        kind: value
      - id: tlsid
        kind: package
      - id: io
        kind: stdlib
    steps:
      - set: conn
        to: tls
        value: tls.Server(raw, t.id.ServerConfig(t.checkPeer(nil)))
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: err
            eval: conn.SetDeadline(time.Now().Add(t.cfg.HandshakeTimeout))
            to: conn.SetDeadline
          when: err != nil
      - bind: err
        eval: conn.Handshake()
        to: conn.Handshake
      - eval: release()
      - opt:
          do:
            - return: nil, pid, 0, false
          when: err != nil
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: pid, ok
            eval: tlsid.PeerOf(conn.ConnectionState())
            op: =
            to: tlsid
          when: "!ok"
      - var:
          name: laneByte
          type: "[1]byte"
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: _, err
            eval: io.ReadFull(conn, laneByte[:])
            to: io
          when: err != nil
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: err
            eval: conn.SetDeadline(time.Time{})
            to: conn.SetDeadline
          when: err != nil
      - return: conn, pid, laneByte[0], true
  - of: (*TCPTransport).serveAuthenticated
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveAuthenticated
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.serveJoin
        kind: internal
      - id: t.serveMember
        kind: internal
    steps:
      - bind: spki
        eval: pid.SPKI
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: m, member
        eval: t.bySPKI[spki]
      - opt:
          do:
            - set: t.in[conn]
              value: spki
          when: member
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - defer: |-
          func() {
          		t.mu.Lock()
          		delete(t.in, conn)
          		t.mu.Unlock()
          	}()
      - opt:
          do:
            - eval: "t.serveJoin(conn, coreconsensus.AuthenticatedPeerValue{Slot: slot, SPKI: spki}, lane)"
              to: t.serveJoin
            - return: ""
          when: lane == laneJoin || (lane == laneJoinV2 && !t.predatesJoinV2.Load())
      - opt:
          do:
            - return: ""
          when: "!member || m.Slot != slot"
      - bind: peer
        eval: "coreconsensus.AuthenticatedPeerValue{ID: m.ID, Incarnation: m.Incarnation, Slot: slot, SPKI: spki}"
      - eval: t.serveMember(conn, peer, pid.Leaf, lane)
        to: t.serveMember
  - of: (*TCPTransport).serveMember
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveMember
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: time.Now().Add
        kind: value
      - id: conn.SetReadDeadline
        kind: value
      - id: t.readFrames
        kind: internal
      - id: t.serveSnapshot
        kind: internal
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.peerExpiry[peer.ID]
        value: leaf.NotAfter
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: deadline
        eval: time.Now().Add(t.cfg.MaxConnectionAge)
        to: time.Now().Add
      - opt:
          do:
            - set: deadline
              value: leaf.NotAfter
          when: leaf.NotAfter.Before(deadline)
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: conn.SetReadDeadline(deadline)
            to: conn.SetReadDeadline
          when: err != nil
      - switch:
          cases:
            - case: laneControl, laneData
              do:
                - bind: limit
                  eval: t.cfg.MaxFrameBytes
                - opt:
                    do:
                      - set: limit
                        value: t.cfg.MaxControlFrameBytes
                    when: lane == laneControl
                - eval: t.readFrames(conn, peer, limit)
                  to: t.readFrames
            - case: laneSnapshot
              do:
                - eval: t.serveSnapshot(conn, peer)
                  to: t.serveSnapshot
            - default: true
          "on": lane
  - of: (*TCPTransport).readFrames
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).readFrames
        kind: self
      - id: bufio
        kind: stdlib
      - id: readFrame
        kind: internal
      - id: t.deliverTo
        kind: internal
    steps:
      - bind: r
        eval: bufio.NewReaderSize(c, connBufferBytes)
        to: bufio
      - var:
          name: buf
          type: "[]byte"
      - loop:
          do:
            - bind: frame, ok
              eval: readFrame(r, buf, limit)
              to: readFrame
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - set: buf
              value: frame
            - bind: d, still
              eval: t.deliverTo(peer.SPKI)
              to: t.deliverTo
            - opt:
                do:
                  - return: ""
                when: "!still"
            - opt:
                do:
                  - eval: d(peer, frame)
                when: d != nil
          forever: true
  - of: readFrame
    participants:
      - id: caller
        kind: actor
      - id: readFrame
        kind: self
      - id: io
        kind: stdlib
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - var:
          name: h
          type: "[4]byte"
      - opt:
          do:
            - return: buf, false
          init:
            bind: _, err
            eval: io.ReadFull(r, h[:])
            to: io
          when: err != nil
      - bind: ln
        eval: binary.LittleEndian.Uint32(h[:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: buf, false
          when: limit < 0 || ln < uint32(minFrameBody) || uint64(ln)+4 > uint64(limit)
      - bind: "n"
        eval: int(ln)
      - opt:
          do:
            - set: buf
              value: make([]byte, n+4)
          when: cap(buf) < n+4
      - set: buf
        value: buf[:n+4]
      - eval: copy(buf, h[:])
      - opt:
          do:
            - return: buf, false
          init:
            bind: _, err
            eval: io.ReadFull(r, buf[4:])
            to: io
          when: err != nil
      - return: buf, true
  - of: (*TCPTransport).deliverTo
    steps:
      - lock:
          mutex: t.mu
      - bind: _, still
        eval: t.bySPKI[spki]
      - return: t.deliver, still
  - of: (*TCPTransport).dial
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dial
        kind: self
      - id: t.dialVerified
        kind: internal
    steps:
      - return: t.dialVerified(ctx, addr, lane, t.checkPeer(pin))
        to: t.dialVerified
  - of: (*TCPTransport).dialAny
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dialAny
        kind: self
      - id: t.checkPeer
        kind: internal
      - id: t.dialVerified
        kind: internal
    steps:
      - bind: check
        eval: t.checkPeer(nil)
        to: t.checkPeer
      - return: |-
          t.dialVerified(ctx, addr, lane, func(p tlsid.PeerIdentityValue) error {
          		if err := check(p); err != nil {
          			return err
          		}
          		if !slices.Contains(pins, p.SPKI) {
          			return peerRejected("key is not one the joiner pins")
          		}
          		return nil
          	})
        to: t.dialVerified
  - of: (*TCPTransport).dialVerified
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dialVerified
        kind: self
      - id: d.DialContext
        kind: value
      - id: tls
        kind: stdlib
      - id: c.SetDeadline
        kind: value
      - id: abandon
        kind: internal
      - id: c.HandshakeContext
        kind: value
      - id: c.Write
        kind: value
    steps:
      - bind: d
        eval: "net.Dialer{Timeout: t.cfg.HandshakeTimeout}"
      - bind: raw, err
        eval: d.DialContext(ctx, "tcp", addr)
        to: d.DialContext
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: c
        eval: tls.Client(raw, t.id.ClientConfig(verify))
        to: tls
      - opt:
          do:
            - eval: abandon(raw.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.HandshakeTimeout))
            to: c.SetDeadline
          when: err != nil
      - opt:
          do:
            - eval: abandon(raw.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.HandshakeContext(ctx)
            to: c.HandshakeContext
          when: err != nil
      - opt:
          do:
            - eval: abandon(c.Close())
              to: abandon
            - return: nil, err
          init:
            bind: _, err
            eval: c.Write([]byte{lane})
            to: c.Write
          when: err != nil
      - opt:
          do:
            - eval: abandon(c.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.SetDeadline(time.Time{})
            to: c.SetDeadline
          when: err != nil
      - return: c, nil
  - of: (*TCPTransport).address
    steps:
      - var:
          name: noPin
          type: "[32]byte"
      - lock:
          mutex: t.mu
      - bind: m, ok
        eval: t.byID[to]
      - opt:
          do:
            - return: "\"\", noPin, false"
          when: "!ok || m.SPKI == noPin"
      - bind: addr
        eval: m.Address
      - opt:
          do:
            - set: addr
              value: a
          init:
            bind: a, ok
            eval: t.cfg.Seeds[to]
          when: ok && addr == ""
      - return: addr, m.SPKI, addr != ""
  - of: (*TCPTransport).Send
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Send
        kind: self
      - id: wire
        kind: package
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.wg.Add
        kind: value
      - id: t.sender
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
    steps:
      - bind: lane
        eval: laneData
      - opt:
          do:
            - set: lane
              value: laneControl
          init:
            bind: l, err
            eval: wire.Lane(frame)
            to: wire
          when: err == nil && l == coreconsensus.LaneControl
      - bind: k
        eval: outKey{to, lane}
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - opt:
          do:
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - return: ""
          when: t.closed
      - bind: pc
        eval: t.out[k]
      - opt:
          do:
            - opt:
                do:
                  - eval: t.mu.Unlock()
                    to: t.mu.Unlock
                  - return: ""
                init:
                  bind: _, ok
                  eval: t.byID[to]
                when: "!ok"
            - set: pc
              value: "&peerConn{queue: make(chan []byte, senderQueueFrames), stop: make(chan struct{})}"
            - set: t.out[k]
              value: pc
            - eval: t.wg.Add(1)
              to: t.wg.Add
            - go: t.sender(k, pc)
              to: t.sender
          when: pc == nil
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - opt:
          do:
            - eval: pc.mu.Unlock()
              to: pc.mu.Unlock
            - return: ""
          when: pc.bytes+int64(len(frame)) > t.cfg.PeerQueueBytes
      - op: +=
        set: pc.bytes
        value: int64(len(frame))
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - select:
          cases:
            - comm: pc.queue <- frame
            - default: true
              do:
                - eval: pc.mu.Lock()
                  to: pc.mu.Lock
                - op: "-="
                  set: pc.bytes
                  value: int64(len(frame))
                - eval: pc.mu.Unlock()
                  to: pc.mu.Unlock
  - of: (*TCPTransport).sender
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).sender
        kind: self
      - id: t.wg.Done
        kind: value
      - id: link.close
        kind: internal
      - id: takeBatch
        kind: internal
      - id: t.sendBatch
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
      - var:
          name: link
          type: senderLink
      - defer: link.close()
        to: link.close
      - var:
          name: batch
          type: "[][]byte"
      - loop:
          do:
            - var:
                name: f
                type: "[]byte"
            - select:
                cases:
                  - comm: <-t.done
                    do:
                      - return: ""
                  - comm: <-pc.stop
                    do:
                      - return: ""
                  - comm: f = <-pc.queue
            - set: batch
              to: takeBatch
              value: takeBatch(append(batch[:0], f), pc)
            - eval: t.sendBatch(k, &link, batch)
              to: t.sendBatch
            - eval: clear(batch)
            - opt:
                do:
                  - return: ""
                when: "!pc.track(&link)"
          forever: true
  - of: (*senderLink).close
    participants:
      - id: caller
        kind: actor
      - id: (*senderLink).close
        kind: self
      - id: abandon
        kind: internal
    steps:
      - opt:
          do:
            - eval: abandon(l.conn.Close())
              to: abandon
            - set: l.conn
              value: nil
          when: l.conn != nil
  - of: takeBatch
    participants:
      - id: caller
        kind: actor
      - id: takeBatch
        kind: self
      - id: queuedFrame
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
    steps:
      - loop:
          cond: len(batch) < maxSenderBatch
          do:
            - bind: g, ok
              eval: queuedFrame(pc)
              to: queuedFrame
            - opt:
                do:
                  - break: true
                when: "!ok"
            - set: batch
              value: append(batch, g)
      - bind: size
        eval: "0"
      - loop:
          do:
            - op: +=
              set: size
              value: len(b)
          key: _
          range: batch
          value: b
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - op: "-="
        set: pc.bytes
        value: int64(size)
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - return: batch
  - of: queuedFrame
    steps:
      - select:
          cases:
            - comm: g, ok := <-pc.queue
              do:
                - return: g, ok
            - default: true
              do:
                - return: nil, false
  - of: (*TCPTransport).sendBatch
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).sendBatch
        kind: self
      - id: t.retire
        kind: internal
      - id: t.writeBatch
        kind: internal
      - id: link.close
        kind: internal
      - id: t.reportUnreachable
        kind: internal
    steps:
      - eval: t.retire(k, link)
        to: t.retire
      - bind: reused
        eval: link.conn != nil
      - opt:
          do:
            - return: ""
          when: "!reused && !t.redial(k, link)"
      - bind: err
        eval: t.writeBatch(link, batch)
        to: t.writeBatch
      - opt:
          do:
            - eval: link.close()
              to: link.close
            - opt:
                do:
                  - return: ""
                when: "!t.redial(k, link)"
            - set: err
              to: t.writeBatch
              value: t.writeBatch(link, batch)
          when: err != nil && reused
      - opt:
          do:
            - eval: link.close()
              to: link.close
            - eval: t.reportUnreachable(k.to)
              to: t.reportUnreachable
          when: err != nil
  - of: (*TCPTransport).retire
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).retire
        kind: self
      - id: link.close
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: link.conn == nil
      - opt:
          do:
            - eval: link.close()
              to: link.close
          when: time.Since(link.created) > t.cfg.MaxConnectionAge || !t.stillAdmitted(k.to, link)
  - of: (*TCPTransport).writeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).writeBatch
        kind: self
      - id: link.conn.SetWriteDeadline
        kind: value
      - id: link.w.Write
        kind: value
      - id: link.w.Flush
        kind: value
    steps:
      - bind: err
        eval: link.conn.SetWriteDeadline(time.Now().Add(t.cfg.WriteTimeout))
        to: link.conn.SetWriteDeadline
      - loop:
          do:
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: _, err
              to: link.w.Write
              value: link.w.Write(b)
          key: _
          range: batch
          value: b
      - opt:
          do:
            - return: err
          when: err != nil
      - return: link.w.Flush()
        to: link.w.Flush
  - of: (*TCPTransport).redial
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).redial
        kind: self
      - id: t.address
        kind: internal
      - id: context
        kind: stdlib
      - id: t.dial
        kind: internal
      - id: boundUnacknowledged
        kind: internal
      - id: abandon
        kind: internal
      - id: time.Now().Add
        kind: value
      - id: t.reportUnreachable
        kind: internal
      - id: t.wg.Add
        kind: value
      - id: watchLink
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: time.Now().Before(link.backoff)
      - bind: addr, pin, ok
        eval: t.address(k.to)
        to: t.address
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), t.cfg.HandshakeTimeout)
        to: context
      - defer: cancel()
      - bind: c, err
        eval: t.dial(ctx, addr, k.lane, &pin)
        to: t.dial
      - opt:
          do:
            - opt:
                do:
                  - eval: abandon(c.Close())
                    to: abandon
                init:
                  bind: err
                  eval: boundUnacknowledged(c.NetConn(), t.cfg.WriteTimeout)
                  op: =
                  to: boundUnacknowledged
                when: err != nil
          when: err == nil
      - opt:
          do:
            - set: link.backoff
              to: time.Now().Add
              value: time.Now().Add(redialBackoff)
            - eval: t.reportUnreachable(k.to)
              to: t.reportUnreachable
            - return: "false"
          when: err != nil
      - set: link.conn, link.w, link.created
        value: c, bufio.NewWriterSize(c, connBufferBytes), time.Now()
      - set: link.pin, link.notAfter
        value: pin, time.Time{}
      - opt:
          do:
            - set: link.notAfter
              value: certs[0].NotAfter
          init:
            bind: certs
            eval: c.ConnectionState().PeerCertificates
          when: len(certs) > 0
      - eval: t.wg.Add(1)
        to: t.wg.Add
      - go: watchLink(&t.wg, c)
        to: watchLink
      - return: "true"
  - of: watchLink
    participants:
      - id: caller
        kind: actor
      - id: watchLink
        kind: self
      - id: wg.Done
        kind: value
      - id: io
        kind: stdlib
      - id: abandon
        kind: internal
    steps:
      - defer: wg.Done()
        to: wg.Done
      - bind: _, err
        eval: io.Copy(io.Discard, c)
        to: io
      - eval: abandon(err)
        to: abandon
      - eval: abandon(c.NetConn().Close())
        to: abandon
  - of: (*TCPTransport).stillAdmitted
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).stillAdmitted
        kind: self
      - id: t.address
        kind: internal
    steps:
      - bind: _, pin, ok
        eval: t.address(to)
        to: t.address
      - return: ok && pin == link.pin && time.Now().Before(link.notAfter)
  - of: (*TCPTransport).reportUnreachable
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).reportUnreachable
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: f
        eval: t.unreachable
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - opt:
          do:
            - eval: f(id)
          when: f != nil
  - of: (*TCPTransport).Unreachable
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Unreachable
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.unreachable
        value: f
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
  - of: (*TCPTransport).Bind
    steps:
      - lock:
          mutex: t.mu
      - set: t.deliver, t.offer, t.install, t.join
        value: deliver, offer, install, join
      - return: nil
  - of: (*TCPTransport).SetMembership
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).SetMembership
        kind: self
      - id: slices
        kind: stdlib
      - id: indexMembers
        kind: internal
      - id: t.reserveAddresses
        kind: internal
      - id: abandon
        kind: internal
      - id: pc.halt
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - set: t.members[group]
        to: slices
        value: slices.Clone(admitted)
      - bind: byID, bySPKI
        eval: indexMembers(t.members)
        to: indexMembers
      - set: t.byID, t.bySPKI
        value: byID, bySPKI
      - eval: t.reserveAddresses(byID)
        to: t.reserveAddresses
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(t.peerExpiry, id)
                init:
                  bind: _, ok
                  eval: byID[id]
                when: "!ok"
          key: id
          range: t.peerExpiry
      - loop:
          do:
            - opt:
                do:
                  - eval: abandon(c.Close())
                    to: abandon
                init:
                  bind: _, ok
                  eval: bySPKI[spki]
                when: "!ok"
          key: c
          range: t.in
          value: spki
      - loop:
          do:
            - opt:
                do:
                  - eval: pc.halt()
                    to: pc.halt
                  - eval: delete(t.out, k)
                init:
                  bind: _, ok
                  eval: byID[k.to]
                when: "!ok"
          key: k
          range: t.out
          value: pc
  - of: indexMembers
    steps:
      - var:
          name: noPin
          type: "[32]byte"
      - bind: byID
        eval: map[coreconsensus.NodeID]coreconsensus.MemberValue{}
      - bind: bySPKI
        eval: map[[32]byte]coreconsensus.MemberValue{}
      - bind: shared
        eval: map[[32]byte]bool{}
      - loop:
          do:
            - loop:
                do:
                  - set: byID[m.ID]
                    value: m
                  - opt:
                      do:
                        - continue: true
                      when: m.SPKI == noPin
                  - opt:
                      do:
                        - set: shared[m.SPKI]
                          value: "true"
                      init:
                        bind: o, ok
                        eval: bySPKI[m.SPKI]
                      when: ok && o.ID != m.ID
                  - set: bySPKI[m.SPKI]
                    value: m
                key: _
                range: ms
                value: m
          key: _
          range: groups
          value: ms
      - loop:
          do:
            - eval: delete(bySPKI, k)
          key: k
          range: shared
      - return: byID, bySPKI
  - of: (*TCPTransport).reserveAddresses
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).reserveAddresses
        kind: self
      - id: slices
        kind: stdlib
      - id: t.resvSeq.Add
        kind: value
      - id: t.wg.Add
        kind: value
    steps:
      - bind: addrs
        eval: make([]string, 0, len(byID))
      - loop:
          do:
            - opt:
                do:
                  - set: addrs
                    value: append(addrs, m.Address)
                when: m.Address != ""
          key: _
          range: byID
          value: m
      - eval: slices.Sort(addrs)
        to: slices
      - opt:
          do:
            - return: ""
          when: t.resvAddrs != nil && slices.Equal(addrs, t.resvAddrs)
      - set: t.resvAddrs
        value: addrs
      - bind: seq
        eval: t.resvSeq.Add(1)
        to: t.resvSeq.Add
      - eval: t.wg.Add(1)
        to: t.wg.Add
      - go: |-
          func() {
          		defer t.wg.Done()
          		t.resvMu.Lock()
          		defer t.resvMu.Unlock()
          		if t.resvSeq.Load() == seq {
          			t.admission.SetReserved(addrs)
          		}
          	}()
  - of: (*TCPTransport).Close
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Close
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.doneOnce.Do
        kind: value
      - id: abandon
        kind: internal
      - id: t.ln.Close
        kind: value
      - id: t.wg.Wait
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - opt:
          do:
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - return: nil
          when: t.closed
      - set: t.closed
        value: "true"
      - eval: t.doneOnce.Do(func() { close(t.done) })
        to: t.doneOnce.Do
      - loop:
          do:
            - eval: abandon(c.Close())
              to: abandon
          key: c
          range: t.raw
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: err
        eval: t.ln.Close()
        to: t.ln.Close
      - eval: t.wg.Wait()
        to: t.wg.Wait
      - return: err
  - of: writeChunk
    participants:
      - id: caller
        kind: actor
      - id: writeChunk
        kind: self
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: w.Write
        kind: value
    steps:
      - var:
          name: h
          type: "[4]byte"
      - eval: binary.LittleEndian.PutUint32(h[:], uint32(len(b)))
        to: binary.LittleEndian.PutUint32
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: w.Write(h[:])
            to: w.Write
          when: err != nil
      - bind: _, err
        eval: w.Write(b)
        to: w.Write
      - return: err
  - of: readChunk
    participants:
      - id: caller
        kind: actor
      - id: readChunk
        kind: self
      - id: io
        kind: stdlib
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - var:
          name: h
          type: "[4]byte"
      - opt:
          do:
            - return: nil, err
          init:
            bind: _, err
            eval: io.ReadFull(r, h[:])
            to: io
          when: err != nil
      - bind: ln
        eval: binary.LittleEndian.Uint32(h[:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: nil, origin(coreconsensus.FrameInvalid, errs.Int64("length", int64(ln)))
          when: limit < 0 || uint64(ln) > uint64(limit)
      - bind: b
        eval: make([]byte, int(ln))
      - bind: _, err
        eval: io.ReadFull(r, b)
        to: io
      - return: b, err
  - of: encodeOffer
    participants:
      - id: caller
        kind: actor
      - id: encodeOffer
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: wire
        kind: package
    steps:
      - bind: b
        eval: binary.LittleEndian.AppendUint64(nil, o.Term)
        to: binary.LittleEndian.AppendUint64
      - return: wire.AppendSnapshotMeta(b, &o.Meta)
        to: wire
  - of: decodeOffer
    participants:
      - id: caller
        kind: actor
      - id: decodeOffer
        kind: self
      - id: wire
        kind: package
    steps:
      - opt:
          do:
            - return: coreconsensus.InstallOfferValue{}, origin(coreconsensus.FrameInvalid)
          when: len(b) < 8
      - bind: o
        eval: "coreconsensus.InstallOfferValue{Term: binary.LittleEndian.Uint64(b)}"
      - opt:
          do:
            - return: o, err
          init:
            bind: err
            eval: wire.ParseSnapshotMeta(b[8:], &o.Meta)
            to: wire
          when: err != nil
      - set: o.SnapshotID
        value: o.Meta.ID
      - return: o, nil
  - of: (*TCPTransport).Stream
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Stream
        kind: self
      - id: encodeOffer
        kind: internal
      - id: origin
        kind: internal
      - id: t.address
        kind: internal
      - id: peerRejected
        kind: internal
      - id: t.dial
        kind: internal
      - id: context
        kind: stdlib
      - id: boundUnacknowledged
        kind: internal
      - id: writeChunk
        kind: internal
      - id: readAccept
        kind: internal
      - id: errs
        kind: package
      - id: streamFrom
        kind: internal
      - id: installResult
        kind: internal
    steps:
      - bind: body
        eval: encodeOffer(offer)
        to: encodeOffer
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("what", "snapshot offer"), errs.Int("length", len(body)))
              to: origin
          when: len(body) > t.cfg.MaxFrameBytes
      - bind: addr, pin, ok
        eval: t.address(to)
        to: t.address
      - opt:
          do:
            - return: peerRejected("no address")
              to: peerRejected
          when: "!ok"
      - bind: c, err
        eval: t.dial(ctx, addr, laneSnapshot, &pin)
        to: t.dial
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: func() { abandon(c.Close()) }()
      - bind: stop
        eval: context.AfterFunc(ctx, func() { abandon(c.Close()) })
        to: context
      - defer: stop()
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: boundUnacknowledged(c.NetConn(), t.cfg.WriteTimeout)
            to: boundUnacknowledged
          when: err != nil
      - bind: w
        eval: "boundedWriter{conn: c, half: c, d: t.cfg.WriteTimeout}"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: writeChunk(w, body)
            to: writeChunk
          when: err != nil
      - bind: acc, err
        eval: readAccept(c, t.cfg.JoinTimeout)
        to: readAccept
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: "off"
        eval: int64(binary.LittleEndian.Uint64(acc))
      - bind: code
        eval: errs.Code(binary.LittleEndian.Uint32(acc[8:]))
        to: errs
      - opt:
          do:
            - return: nil
          when: acc[12] != 0
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          when: code != 0
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: streamFrom(w, open, off)
            to: streamFrom
          when: err != nil
      - return: installResult(c)
        to: installResult
  - of: readAccept
    participants:
      - id: caller
        kind: actor
      - id: readAccept
        kind: self
      - id: c.SetReadDeadline
        kind: value
      - id: readChunk
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: c.SetReadDeadline(time.Now().Add(d))
            to: c.SetReadDeadline
          when: err != nil
      - bind: acc, err
        eval: readChunk(c, 64)
        to: readChunk
      - opt:
          do:
            - return: nil, origin(coreconsensus.FrameInvalid, errs.String("what", "install accept"))
          when: err != nil || len(acc) != 13
      - return: acc, c.SetReadDeadline(time.Time{})
  - of: streamFrom
    participants:
      - id: caller
        kind: actor
      - id: streamFrom
        kind: self
      - id: io
        kind: stdlib
      - id: rc.Close
        kind: value
      - id: c.CloseWrite
        kind: internal
    steps:
      - bind: rc, err
        eval: open(off)
      - opt:
          do:
            - return: err
          when: err != nil
      - set: _, err
        to: io
        value: io.Copy(c, rc)
      - opt:
          do:
            - set: err
              value: cerr
          init:
            bind: cerr
            eval: rc.Close()
            to: rc.Close
          when: cerr != nil && err == nil
      - opt:
          do:
            - return: err
          when: err != nil
      - return: c.CloseWrite()
        to: c.CloseWrite
  - of: boundedWriter.Write
    participants:
      - id: caller
        kind: actor
      - id: boundedWriter.Write
        kind: self
      - id: w.conn.SetWriteDeadline
        kind: value
      - id: w.conn.Write
        kind: value
    steps:
      - bind: "n"
        eval: "0"
      - loop:
          cond: n < len(p)
          do:
            - opt:
                do:
                  - return: n, err
                init:
                  bind: err
                  eval: w.conn.SetWriteDeadline(time.Now().Add(w.d))
                  to: w.conn.SetWriteDeadline
                when: err != nil
            - bind: k, err
              eval: w.conn.Write(p[n:min(len(p), n+boundedWriteBytes)])
              to: w.conn.Write
            - op: +=
              set: "n"
              value: k
            - opt:
                do:
                  - return: n, err
                when: err != nil
      - return: n, nil
  - of: boundedWriter.CloseWrite
    participants:
      - id: caller
        kind: actor
      - id: boundedWriter.CloseWrite
        kind: self
      - id: w.conn.SetWriteDeadline
        kind: value
      - id: w.half.CloseWrite
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: w.conn.SetWriteDeadline(time.Now().Add(w.d))
            to: w.conn.SetWriteDeadline
          when: err != nil
      - return: w.half.CloseWrite()
        to: w.half.CloseWrite
  - of: installResult
    participants:
      - id: caller
        kind: actor
      - id: installResult
        kind: self
      - id: readChunk
        kind: internal
      - id: origin
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: res, err
        eval: readChunk(c, 8)
        to: readChunk
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("what", "install result"))
              to: origin
          when: err != nil || len(res) != 4
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          init:
            bind: code
            eval: errs.Code(binary.LittleEndian.Uint32(res))
            to: errs
          when: code != 0
      - return: nil
  - of: (*TCPTransport).serveSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveSnapshot
        kind: self
      - id: readChunk
        kind: internal
      - id: decodeOffer
        kind: internal
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: offerRefused
        kind: internal
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: writeChunk
        kind: internal
      - id: context
        kind: stdlib
      - id: errs
        kind: package
      - id: abandon
        kind: internal
      - id: drainHalfClose
        kind: internal
    steps:
      - bind: b, err
        eval: readChunk(c, t.cfg.MaxFrameBytes)
        to: readChunk
      - var:
          name: o
          type: coreconsensus.InstallOfferValue
      - opt:
          do:
            - set: o, err
              to: decodeOffer
              value: decodeOffer(b)
          when: err == nil
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: of, in, warn
        eval: t.offer, t.install, t.warn
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - opt:
          do:
            - eval: offerRefused(warn, peer.ID, t.cfg.MaxFrameBytes, err)
              to: offerRefused
            - return: ""
          when: err != nil
      - opt:
          do:
            - return: ""
          when: of == nil || in == nil
      - bind: acc
        eval: of(peer, o)
      - bind: reply
        eval: binary.LittleEndian.AppendUint64(nil, uint64(acc.Offset))
        to: binary.LittleEndian.AppendUint64
      - set: reply
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(reply, uint32(acc.Refused))
      - set: reply
        value: append(reply, boolByte(acc.Held))
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: writeChunk(c, reply)
            to: writeChunk
          when: err != nil || acc.Refused != 0 || acc.Held
      - bind: ctx, cancel
        eval: context.WithCancel(context.Background())
        to: context
      - defer: cancel()
      - bind: ierr
        eval: |-
          in(coreconsensus.InstallParams{
          		Ctx: ctx, From: peer, Offer: o, Offset: acc.Offset,
          		Body: io.LimitReader(c, o.Meta.EncodedSize-acc.Offset),
          	})
      - var:
          name: code
          type: errs.Code
      - opt:
          do:
            - set: code, _
              to: errs
              value: errs.CodeOf(ierr)
            - opt:
                do:
                  - set: code
                    value: coreconsensus.CodeSnapshotCorrupt
                when: code == 0
          when: ierr != nil
      - eval: abandon(writeChunk(c, binary.LittleEndian.AppendUint32(nil, uint32(code))))
        to: abandon
      - eval: drainHalfClose(c, t.cfg.WriteTimeout)
        to: drainHalfClose
  - of: drainHalfClose
    participants:
      - id: caller
        kind: actor
      - id: drainHalfClose
        kind: self
      - id: io
        kind: stdlib
      - id: abandon
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: c.SetReadDeadline(time.Now().Add(d)) != nil
      - bind: _, err
        eval: io.Copy(io.Discard, io.LimitReader(c, drainBytes))
        to: io
      - eval: abandon(err)
        to: abandon
  - of: offerRefused
    participants:
      - id: caller
        kind: actor
      - id: offerRefused
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, coded
            eval: errs.CodeOf(err)
            to: errs
          when: "!coded || warn == nil"
      - bind: attrs
        eval: "[]corelogger.AttrValue{lattr(\"from\", uint64(from)), lattr(\"bound\", uint64(bound)), lstr(\"error\", err.Error())}"
      - loop:
          do:
            - opt:
                do:
                  - set: attrs
                    value: append(attrs, lstr("length", f.StringValue()))
                when: f.Key() == "length"
          key: _
          range: errs.FieldsOf(err)
          value: f
      - eval: "warn(\"consensus: snapshot offer refused before it was judged\", attrs...)"
  - of: (*TCPTransport).bindWarn
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).bindWarn
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.warn
        value: warn
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
  - of: encodeJoin
    participants:
      - id: caller
        kind: actor
      - id: encodeJoin
        kind: self
      - id: slices
        kind: stdlib
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: slices.Clone(r.Cluster[:])
        to: slices
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, uint64(r.ID))
      - set: b
        value: append(b, r.Incarnation[:]...)
      - set: b
        value: append(b, byte(len(r.Slot)))
      - set: b
        value: append(b, r.Slot...)
      - return: append(b, r.Address...)
  - of: decodeJoin
    participants:
      - id: caller
        kind: actor
      - id: decodeJoin
        kind: self
      - id: coreconsensus
        kind: package
    steps:
      - var:
          name: r
          type: coreconsensus.JoinRequestValue
      - opt:
          do:
            - return: r, false
          when: len(b) < 16+8+16+1
      - eval: copy(r.Cluster[:], b)
      - set: r.ID
        to: coreconsensus
        value: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[16:]))
      - eval: copy(r.Incarnation[:], b[24:])
      - bind: "n"
        eval: int(b[40])
      - opt:
          do:
            - return: r, false
          when: 41+n > len(b)
      - set: r.Slot
        value: "string(b[41 : 41+n])"
      - set: r.Address
        value: string(b[41+n:])
      - return: r, true
  - of: encodeJoinV2
    participants:
      - id: caller
        kind: actor
      - id: encodeJoinV2
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: binary.LittleEndian.AppendUint64([]byte{joinVersion2}, uint64(r.MaxSnapshotBytes))
        to: binary.LittleEndian.AppendUint64
      - return: append(b, encodeJoin(r)...)
  - of: decodeJoinOn
    participants:
      - id: caller
        kind: actor
      - id: decodeJoinOn
        kind: self
      - id: decodeJoin
        kind: internal
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - opt:
          do:
            - return: decodeJoin(b)
              to: decodeJoin
          when: lane != laneJoinV2
      - opt:
          do:
            - return: coreconsensus.JoinRequestValue{}, false
          when: len(b) < joinV2Prefix || b[0] != joinVersion2
      - bind: limit
        eval: binary.LittleEndian.Uint64(b[1:])
        to: binary.LittleEndian.Uint64
      - bind: r, ok
        eval: decodeJoin(b[joinV2Prefix:])
        to: decodeJoin
      - opt:
          do:
            - return: coreconsensus.JoinRequestValue{}, false
          when: "!ok || limit > math.MaxInt64"
      - set: r.MaxSnapshotBytes
        value: int64(limit)
      - return: r, true
  - of: (*TCPTransport).serveJoin
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveJoin
        kind: self
      - id: c.SetDeadline
        kind: value
      - id: readChunk
        kind: internal
      - id: decodeJoinOn
        kind: internal
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: sanitizeReason
        kind: internal
      - id: binary.LittleEndian.AppendUint16
        kind: value
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: wire
        kind: package
      - id: abandon
        kind: internal
      - id: context
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.JoinTimeout))
            to: c.SetDeadline
          when: err != nil
      - bind: b, err
        eval: readChunk(c, 512+joinV2Prefix)
        to: readChunk
      - opt:
          do:
            - return: ""
          when: err != nil
      - bind: req, ok
        eval: decodeJoinOn(lane, b)
        to: decodeJoinOn
      - bind: reply
        eval:
          closure:
            params: code errs.Code, pos coreconsensus.PositionValue, reason string
            steps:
              - bind: out
                eval: binary.LittleEndian.AppendUint32(nil, uint32(code))
                to: binary.LittleEndian.AppendUint32
              - set: out
                to: binary.LittleEndian.AppendUint64
                value: binary.LittleEndian.AppendUint64(out, pos.Term)
              - set: out
                to: binary.LittleEndian.AppendUint64
                value: binary.LittleEndian.AppendUint64(out, pos.Index)
              - opt:
                  do:
                    - bind: r
                      eval: sanitizeReason(reason)
                      to: sanitizeReason
                    - set: out
                      to: binary.LittleEndian.AppendUint16
                      value: binary.LittleEndian.AppendUint16(out, uint16(len(r)))
                    - set: out
                      value: append(out, r...)
                  when: code != 0
              - opt:
                  do:
                    - eval: t.mu.Lock()
                      to: t.mu.Lock
                    - bind: m
                      eval: "coreconsensus.MembershipValue{Members: slices.Collect(maps.Values(t.byID))}"
                    - eval: t.mu.Unlock()
                      to: t.mu.Unlock
                    - set: out
                      to: wire
                      value: wire.AppendMembership(out, &m)
                  when: code == 0
              - eval: abandon(writeChunk(c, out))
                to: abandon
      - opt:
          do:
            - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "malformed JOIN")
            - return: ""
          when: "!ok"
      - opt:
          do:
            - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "the slot differs from the certificate's")
            - return: ""
          when: req.Slot != peer.Slot
      - set: req.SPKI
        value: peer.SPKI
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: j, jr
        eval: t.join, t.joinR
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), t.cfg.JoinTimeout)
        to: context
      - defer: cancel()
      - switch:
          cases:
            - case: jr != nil
              do:
                - bind: pos, code, reason
                  eval: jr(ctx, peer, req)
                - eval: reply(code, pos, reason)
            - case: j != nil
              do:
                - bind: pos, code
                  eval: j(ctx, peer, req)
                - eval: reply(code, pos, "")
            - default: true
              do:
                - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "")
  - of: (*TCPTransport).Join
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Join
        kind: self
      - id: t.hold.begin
        kind: internal
      - id: t.joinVia
        kind: internal
      - id: t.hold.keep
        kind: internal
    steps:
      - bind: gen
        eval: t.hold.begin()
        to: t.hold.begin
      - bind: pos, err
        eval: t.joinVia(ctx, &cfg, gen)
        to: t.joinVia
      - opt:
          do:
            - eval: t.hold.keep(gen, &cfg)
              to: t.hold.keep
          when: err == nil
      - return: pos, err
  - of: (*TCPTransport).refreshJoin
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).refreshJoin
        kind: self
      - id: t.hold.again
        kind: internal
      - id: t.mu.Lock
        kind: value
      - id: slices
        kind: stdlib
      - id: t.mu.Unlock
        kind: value
      - id: t.joinVia
        kind: internal
      - id: sameAnswer
        kind: internal
    steps:
      - bind: cfg, gen, ok
        eval: t.hold.again()
        to: t.hold.again
      - opt:
          do:
            - return: false, nil
          when: "!ok"
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: before
        eval: slices.Clone(t.members[joinGroup])
        to: slices
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - opt:
          do:
            - return: false, err
          init:
            bind: _, err
            eval: t.joinVia(ctx, &cfg, gen)
            to: t.joinVia
          when: err != nil
      - lock:
          mutex: t.mu
      - return: "!sameAnswer(before, t.members[joinGroup]), nil"
        to: sameAnswer
  - of: (*TCPTransport).joinVia
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).joinVia
        kind: self
      - id: origin
        kind: internal
      - id: t.joinOne
        kind: internal
    steps:
      - bind: req
        eval: |-
          coreconsensus.JoinRequestValue{
          		Cluster: cfg.Stamp.Log.Cluster, ID: cfg.Stamp.ID, Incarnation: cfg.Stamp.Incarnation,
          		Slot: t.slot, Address: cfg.Address, MaxSnapshotBytes: max(cfg.MaxSnapshotBytes, 0),
          	}
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, origin(coreconsensus.ClusterMismatch)
          when: req.Cluster != t.cluster
      - opt:
          do:
            - return: |-
                coreconsensus.PositionValue{}, transportMisconfigured("JoinConfig.Pins",
                			"empty: pass the members' SPKIs, from the founding member list (id:inc:slot:spki:addr) or a running member's Membership()")
          when: len(cfg.Pins) == 0
      - bind: last
        eval: origin(coreconsensus.JoinRefused, errs.String("why", "no address answered"))
        to: origin
      - var:
          name: refused
          type: error
      - loop:
          do:
            - bind: pos, answered, err
              eval: "t.joinOne(ctx, addr, &joinTry{req: req, pins: cfg.Pins, gen: gen})"
              to: t.joinOne
            - switch:
                cases:
                  - case: err == nil
                    do:
                      - return: pos, nil
                  - case: answered
                    do:
                      - set: refused
                        value: err
                  - default: true
                    do:
                      - set: last
                        value: err
          key: _
          range: cfg.Addresses
          value: addr
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, refused
          when: refused != nil
      - return: coreconsensus.PositionValue{}, last
  - of: (*TCPTransport).joinOne
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).joinOne
        kind: self
      - id: t.joinOnLane
        kind: internal
    steps:
      - opt:
          do:
            - bind: pos, refused, silent, err
              eval: t.joinOnLane(ctx, addr, laneJoinV2, try)
              to: t.joinOnLane
            - opt:
                do:
                  - return: pos, refused, err
                when: "!silent"
          when: try.req.MaxSnapshotBytes > 0
      - set: pos, refused, _, err
        to: t.joinOnLane
        value: t.joinOnLane(ctx, addr, laneJoin, try)
      - return: pos, refused, err
  - of: (*TCPTransport).joinOnLane
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).joinOnLane
        kind: self
      - id: t.dialAny
        kind: internal
      - id: tlsid
        kind: package
      - id: c.SetDeadline
        kind: value
      - id: encodeJoin
        kind: internal
      - id: encodeJoinV2
        kind: internal
      - id: writeChunk
        kind: internal
      - id: readChunk
        kind: internal
      - id: t.joinAnswered
        kind: internal
    steps:
      - bind: c, derr
        eval: t.dialAny(ctx, addr, lane, try.pins)
        to: t.dialAny
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, false, derr
          when: derr != nil
      - defer: func() { abandon(c.Close()) }()
      - defer: context.AfterFunc(ctx, func() { abandon(c.Close()) })()
      - bind: peer, verified
        eval: tlsid.PeerOf(c.ConnectionState())
        to: tlsid
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, false, peerRejected("no verified peer")
          when: "!verified"
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, false, err
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.JoinTimeout))
            to: c.SetDeadline
          when: err != nil
      - bind: body
        eval: encodeJoin(try.req)
        to: encodeJoin
      - opt:
          do:
            - set: body
              to: encodeJoinV2
              value: encodeJoinV2(try.req)
          when: lane == laneJoinV2
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, endedUnanswered(err), err
          init:
            bind: err
            eval: writeChunk(c, body)
            to: writeChunk
          when: err != nil
      - bind: b, rerr
        eval: readChunk(c, t.cfg.MaxControlFrameBytes)
        to: readChunk
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, true, origin(coreconsensus.FrameInvalid, errs.String("what", "join answer"))
          when: b == nil && endedUnanswered(rerr)
      - set: pos, refused, err
        to: t.joinAnswered
        value: t.joinAnswered(b, rerr, peer.SPKI, try.gen)
      - return: pos, refused, false, err
  - of: endedUnanswered
    participants:
      - id: caller
        kind: actor
      - id: endedUnanswered
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: "false"
          when: err == nil || errors.Is(err, io.ErrUnexpectedEOF)
      - opt:
          do:
            - return: "false"
          init:
            bind: ne, ok
            eval: errors.AsType[net.Error](err)
          when: ok && ne.Timeout()
      - bind: _, coded
        eval: errs.CodeOf(err)
        to: errs
      - return: "!coded"
  - of: (*TCPTransport).joinAnswered
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).joinAnswered
        kind: self
      - id: errs
        kind: package
      - id: joinAnswerReason
        kind: internal
      - id: wire
        kind: package
      - id: t.hold.install
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, origin(coreconsensus.FrameInvalid, errs.String("what", "join answer"))
          when: rerr != nil || len(b) < 20
      - opt:
          do:
            - bind: reason, _
              eval: joinAnswerReason(b[20:])
              to: joinAnswerReason
            - return: coreconsensus.PositionValue{}, true, joinRefused(code, reason)
          init:
            bind: code
            eval: errs.Code(binary.LittleEndian.Uint32(b))
            to: errs
          when: code != 0
      - bind: m, perr
        eval: wire.ParseMembership(b[20:])
        to: wire
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, perr
          when: perr != nil
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, peerRejected("the answer does not list its own sender")
          when: "!joinAnswerListsPeer(m, spki)"
      - eval: t.hold.install(gen, func() { t.SetMembership(joinGroup, m.Members) })
        to: t.hold.install
      - return: "coreconsensus.PositionValue{Term: binary.LittleEndian.Uint64(b[4:]), Index: binary.LittleEndian.Uint64(b[12:])}, false, nil"
  - of: (*TCPTransport).releaseJoinAnswer
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).releaseJoinAnswer
        kind: self
      - id: t.hold.release
        kind: internal
    steps:
      - eval: |-
          t.hold.release(func() {
          		t.mu.Lock()
          		_, held := t.members[joinGroup]
          		t.mu.Unlock()
          		if held {
          			t.SetMembership(joinGroup, nil)
          			t.mu.Lock()
          			delete(t.members, joinGroup)
          			t.mu.Unlock()
          		}
          	})
        to: t.hold.release
  - of: joinAnswerListsPeer
    participants:
      - id: caller
        kind: actor
      - id: joinAnswerListsPeer
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.ContainsFunc(m.Members, func(x coreconsensus.MemberValue) bool { return x.SPKI == spki })
        to: slices
  - of: joinAnswerReason
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: len(b) < 2
      - bind: "n"
        eval: int(binary.LittleEndian.Uint16(b))
      - opt:
          do:
            - return: "\"\", false"
          when: 2+n > len(b)
      - return: "string(b[2 : 2+n]), true"
  - of: (*TCPTransport).BindJoinReason
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).BindJoinReason
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.joinR
        value: join
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
  - of: (*TCPTransport).RefusedBeforeHandshake
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).RefusedBeforeHandshake
        kind: self
      - id: t.admission.Refused
        kind: value
    steps:
      - return: t.admission.Refused()
        to: t.admission.Refused
  - of: (*TCPTransport).CertExpiry
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).CertExpiry
        kind: self
      - id: t.id.Leaf
        kind: value
    steps:
      - bind: leaf, err
        eval: t.id.Leaf()
        to: t.id.Leaf
      - opt:
          do:
            - return: time.Time{}
          when: err != nil
      - return: leaf.NotAfter
  - of: (*TCPTransport).PeerCertExpiry
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).PeerCertExpiry
        kind: self
      - id: maps
        kind: stdlib
    steps:
      - lock:
          mutex: t.mu
      - return: maps.Clone(t.peerExpiry)
        to: maps
  - of: (*TCPTransport).ReloadFailures
    steps:
      - return: int(t.id.ReloadFailures())
  - of: (*TCPTransport).maxFrameBytes
    steps:
      - return: t.cfg.MaxFrameBytes
  - of: boundUnacknowledged
    participants:
      - id: caller
        kind: actor
      - id: boundUnacknowledged
        kind: self
      - id: tc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: tc, ok
        eval: c.(*net.TCPConn)
      - opt:
          do:
            - return: nil
          when: "!ok"
      - bind: rc, err
        eval: tc.SyscallConn()
        to: tc.SyscallConn
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: ms
        eval: int(d / time.Millisecond)
      - var:
          name: serr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: |-
              rc.Control(func(fd uintptr) {
              		serr = syscall.SetsockoptInt(int(fd), syscall.IPPROTO_TCP, tcpUserTimeout, ms)
              	})
            to: rc.Control
          when: err != nil
      - return: serr
