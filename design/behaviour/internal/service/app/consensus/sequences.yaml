      - eval: copy(s.Founding[:], body[p:])
      - op: +=
        set: p
        value: len(s.Founding)
      - bind: "n"
        eval: int(body[p])
      - op: ++
        set: p
      - opt:
          do:
            - return: s, false
          when: p+n != len(body)
      - set: s.Slot
        value: string(body[p:])
      - return: s, true
