          when: d.d.inUse
      - set: d.d.closed
        value: "true"
      - bind: err
        eval: d.d.log.Close()
        to: d.d.log.Close
      - opt:
          do:
            - set: err
              to: storageFailed
              value: storageFailed("unlock", uerr)
          init:
            bind: uerr
            eval: flock.Unlock(d.d.lockf)
            to: flock
          when: uerr != nil && err == nil
      - opt:
          do:
            - set: err
              to: storageFailed
              value: storageFailed("close lock", cerr)
          init:
            bind: cerr
            eval: d.d.lockf.Close()
            to: d.d.lockf.Close
          when: cerr != nil && err == nil
      - return: err
  - of: (*fileLog).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).acquire
        kind: self
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: l.dd == nil
      - lock:
          mutex: l.dd.mu
      - opt:
          do:
            - return: origin(coreconsensus.DataDirInUse, errs.String("dir", l.dd.dir))
              to: origin
          when: l.dd.inUse || l.dd.closed
      - set: l.dd.inUse
        value: "true"
      - return: nil
  - of: (*fileLog).release
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).release
        kind: self
      - id: l.dd.mu.Lock
        kind: value
      - id: l.dd.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: l.dd == nil
      - eval: l.dd.mu.Lock()
        to: l.dd.mu.Lock
      - set: l.dd.inUse
        value: "false"
      - eval: l.dd.mu.Unlock()
        to: l.dd.mu.Unlock
  - of: (*fileLog).runtimeMarker
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).runtimeMarker
        kind: self
      - id: sha256
        kind: stdlib
      - id: filepath
        kind: stdlib
    steps:
      - bind: sum
        eval: sha256.Sum256([]byte(l.dir))
        to: sha256
      - return: filepath.Join(l.runDir, hex.EncodeToString(sum[:8])+"-"+reason)
        to: filepath
  - of: (*fileLog).markStopEach
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).markStopEach
        kind: self
      - id: reasonOf
        kind: internal
      - id: os
        kind: stdlib
      - id: writeFileSync
        kind: internal
    steps:
      - bind: reason
        eval: reasonOf(code)
        to: reasonOf
      - bind: body
        eval: "[]byte(fmt.Sprintf(\"boot=%s\\n%s\\n\", bootID(), detail))"
      - opt:
          do:
            - opt:
                do:
                  - set: runErr
                    to: writeFileSync
                    value: writeFileSync(l.runtimeMarker(reason), body)
                init:
                  bind: runErr
                  eval: os.MkdirAll(l.runDir, 0o700)
                  op: =
                  to: os
                when: runErr == nil
          when: code == coreconsensus.CodeStorageFailed
      - set: dirErr
        to: writeFileSync
        value: writeFileSync(filepath.Join(l.dir, markerStopPrefix+reason), body)
      - return: dirErr, runErr
  - of: reasonOf
    steps:
      - switch:
          cases:
            - case: coreconsensus.CodeStorageFailed
              do:
                - return: "\"STORAGE_FAILED\""
            - case: coreconsensus.CodeStateMachineFailed
              do:
                - return: "\"STATE_MACHINE_FAILED\""
            - case: coreconsensus.CodeVersionUnsupported
              do:
                - return: "\"VERSION_UNSUPPORTED\""
            - case: coreconsensus.CodeLogQuarantined
              do:
                - return: "\"LOG_QUARANTINED\""
            - default: true
              do:
                - return: "\"STOPPED\""
          "on": code
  - of: (*fileLog).checkMarkers
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).checkMarkers
        kind: self
      - id: l.markerApplies
        kind: internal
    steps:
      - opt:
          do:
            - return: l.refuse
          when: l.refuse != nil
      - return: l.markerApplies(false)
        to: l.markerApplies
  - of: stopMarkerPresent
    participants:
      - id: caller
        kind: actor
      - id: stopMarkerPresent
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: |-
          origin(coreconsensus.StopMarkerPresent, errs.String("marker", filepath.Base(path)),
          		errs.String("detail", strings.TrimSpace(string(content))))
        to: origin
  - of: encodeStamp
    participants:
      - id: caller
        kind: actor
      - id: encodeStamp
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - bind: v2
        eval: s.Log.AdoptedFrom != 0
      - bind: b
        eval: "[]byte{stampVersion}"
      - opt:
          do:
            - set: b[0]
              value: stampVersion2
          when: v2
      - set: b
        value: append(b, s.Log.Cluster[:]...)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, s.Log.Epoch)
      - set: b
        value: append(b, s.Log.Predecessor[:]...)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, s.Log.PredecessorEpoch)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, s.Log.KeptIndex)
      - opt:
          do:
            - set: b
              to: binary.LittleEndian.AppendUint64
              value: binary.LittleEndian.AppendUint64(b, s.Log.AdoptedFrom)
          when: v2
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, uint64(s.ID))
      - set: b
        value: append(b, s.Incarnation[:]...)
      - set: b
        value: append(b, byte(s.State))
      - set: b
        value: append(b, s.Founding[:]...)
      - set: b
        value: append(b, byte(len(s.Slot)))
      - set: b
        value: append(b, s.Slot...)
      - return: binary.LittleEndian.AppendUint32(b, crc32.Checksum(b, castagnoli))
        to: binary.LittleEndian.AppendUint32
  - of: decodeStamp
    participants:
      - id: caller
        kind: actor
      - id: decodeStamp
        kind: self
      - id: stampBody
        kind: internal
      - id: decodeStampLog
        kind: internal
      - id: coreconsensus
        kind: package
    steps:
      - bind: body, v2, ok
        eval: stampBody(b)
        to: stampBody
      - opt:
          do:
            - return: coreconsensus.StampValue{}, false
          when: "!ok"
      - var:
          name: stamp
          type: coreconsensus.StampValue
      - bind: p, ok
        eval: decodeStampLog(body, v2, &stamp.Log)
        to: decodeStampLog
      - opt:
          do:
            - return: coreconsensus.StampValue{}, false
          when: "!ok"
      - set: stamp.ID
        to: coreconsensus
        value: coreconsensus.NodeID(binary.LittleEndian.Uint64(body[p:]))
      - op: +=
        set: p
        value: u64Bytes
      - eval: copy(stamp.Incarnation[:], body[p:])
      - op: +=
        set: p
        value: len(stamp.Incarnation)
      - set: stamp.State
        to: coreconsensus
        value: coreconsensus.StampState(body[p])
      - opt:
          do:
            - return: coreconsensus.StampValue{}, false
          when: stamp.State < coreconsensus.StampJoining || stamp.State > coreconsensus.StampMember
      - op: ++
        set: p
      - eval: copy(stamp.Founding[:], body[p:])
      - op: +=
        set: p
        value: len(stamp.Founding)
      - bind: "n"
        eval: int(body[p])
      - op: ++
        set: p
      - opt:
          do:
            - return: stamp, false
          when: p+n != len(body)
      - set: stamp.Slot
        value: string(body[p:])
      - return: stamp, true
  - of: stampBody
    steps:
      - opt:
          do:
            - return: nil, false, false
          when: len(b) == 0 || (b[0] != stampVersion && b[0] != stampVersion2)
      - set: v2
        value: b[0] == stampVersion2
      - bind: fixed
        eval: stampFixed
      - opt:
          do:
            - op: +=
              set: fixed
              value: u64Bytes
          when: v2
      - opt:
          do:
            - return: nil, false, false
          when: len(b) < fixed+4
      - set: body
        value: b[:len(b)-4]
      - opt:
          do:
            - return: nil, false, false
          when: crc32.Checksum(body, castagnoli) != binary.LittleEndian.Uint32(b[len(b)-4:])
      - return: body, v2, true
  - of: decodeStampLog
    participants:
      - id: caller
        kind: actor
      - id: decodeStampLog
        kind: self
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - bind: p
        eval: "1"
      - eval: copy(l.Cluster[:], body[p:])
      - op: +=
        set: p
        value: len(l.Cluster)
      - set: l.Epoch
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - eval: copy(l.Predecessor[:], body[p:])
      - op: +=
        set: p
        value: len(l.Predecessor)
      - set: l.PredecessorEpoch
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - set: l.KeptIndex
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - op: +=
        set: p
        value: u64Bytes
      - opt:
          do:
            - return: p, true
          when: "!v2"
      - set: l.AdoptedFrom
        to: binary.LittleEndian.Uint64
        value: binary.LittleEndian.Uint64(body[p:])
      - return: p + u64Bytes, l.AdoptedFrom != 0
  - of: readStamp
    participants:
      - id: caller
