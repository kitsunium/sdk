                when: unreadable != nil
          init:
            bind: s, ok
            eval: |-
              log.(interface {
              		silence() (term, index uint64, unreadable, err error)
              	})
          when: ok
      - return: term, index, nil
  - of: (*Node).bindTransport
    participants:
      - id: caller
        kind: actor
      - id: (*Node).bindTransport
        kind: self
      - id: ur.Unreachable
        kind: value
      - id: cfg.Transport.Bind
        kind: value
      - id: jb.BindJoinReason
        kind: value
      - id: wb.bindWarn
        kind: internal
    steps:
      - bind: cfg
        eval: "&n.cfg"
      - opt:
          do:
            - eval: |-
                ur.Unreachable(func(id coreconsensus.NodeID) {
                			select {
                			case n.execc <- func() {
                				n.unreachableAt[id] = n.clk.Now()
                				n.r.ReportUnreachable(id)
                			}:
                			default:
                			}
                		})
              to: ur.Unreachable
          init:
            bind: ur, ok
            eval: cfg.Transport.(coreconsensus.UnreachableReporter)
          when: ok
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: cfg.Transport.Bind(cfg.Group, n.deliver, n.offer, n.install, n.join)
            to: cfg.Transport.Bind
          when: err != nil
      - opt:
          do:
            - eval: jb.BindJoinReason(cfg.Group, n.joinReason)
              to: jb.BindJoinReason
          init:
            bind: jb, ok
            eval: cfg.Transport.(coreconsensus.JoinReasonBinder)
          when: ok
      - opt:
          do:
            - eval: wb.bindWarn(n.obs.warn)
              to: wb.bindWarn
          init:
            bind: wb, ok
            eval: cfg.Transport.(bindWarner)
          when: ok
      - return: nil
  - of: (*Node).load
    participants:
      - id: caller
        kind: actor
      - id: (*Node).load
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.durablePosition
        kind: internal
      - id: n.restoreLatest
        kind: internal
      - id: snapshotSize
        kind: internal
      - id: n.cfg.Log.HardState
        kind: value
      - id: n.cfg.Log.Bounds
        kind: value
      - id: n.baseOrNoTable
        kind: internal
      - id: n.finishInstall
        kind: internal
      - id: n.unpublishNewer
        kind: internal
      - id: n.readTail
        kind: internal
      - id: n.startApplied
        kind: internal
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - return: raft.StartState{}, storageFailed("snapshots", err)
          when: err != nil
      - bind: dur, err
        eval: n.durablePosition()
        to: n.durablePosition
      - opt:
          do:
            - return: raft.StartState{}, err
          when: err != nil
      - bind: durIdx
        eval: dur.Index
      - bind: base, failed, newest, err
        eval: n.restoreLatest(metas, durIdx)
        to: n.restoreLatest
      - opt:
          do:
            - return: raft.StartState{}, err
          when: err != nil
      - set: n.snapState.last
        value: base.Position.Index
      - set: n.snapState.newestBytes
        to: snapshotSize
        value: snapshotSize(&base)
      - bind: hs, err
        eval: n.cfg.Log.HardState()
        to: n.cfg.Log.HardState
      - opt:
          do:
            - return: raft.StartState{}, origin(coreconsensus.HardStateCorrupt, errs.String("cause", err.Error()))
          when: err != nil
      - bind: first, last
        eval: n.cfg.Log.Bounds()
        to: n.cfg.Log.Bounds
      - opt:
          do:
            - return: raft.StartState{}, err
          init:
            bind: base, err
            eval: n.baseOrNoTable(base, metas, first, last, hs.Commit)
            op: =
            to: n.baseOrNoTable
          when: err != nil
      - bind: snapIdx
        eval: base.Position.Index
      - opt:
          do:
            - return: raft.StartState{}, n.fallbackGap(err, newest)
          init:
            bind: first, last, err
            eval: n.finishInstall(&base, first, last)
            op: =
            to: n.finishInstall
          when: err != nil
      - opt:
          do:
            - return: raft.StartState{}, err
          init:
            bind: err
            eval: n.unpublishNewer(failed)
            to: n.unpublishNewer
          when: err != nil
      - bind: ents, evicted, err
        eval: n.readTail(first, last, snapIdx, hs.Commit)
        to: n.readTail
      - opt:
          do:
            - return: raft.StartState{}, err
          when: err != nil
      - opt:
          do:
            - return: |-
                raft.StartState{}, origin(coreconsensus.SnapshotCorrupt,
                			errs.String("why", "no snapshot is left and the log holds no configuration: WipeAndRejoin"))
          when: n.noTable && len(base.Membership.Members) == 0 && !slices.ContainsFunc(ents, isMembershipEntry)
      - bind: applied, err
        eval: n.startApplied(&base, dur)
        to: n.startApplied
      - opt:
          do:
            - return: raft.StartState{}, err
          when: err != nil
      - return: "raft.StartState{HardState: hs, Snapshot: base, Entries: ents, Evicted: evicted, Applied: applied, Now: n.clk.Now()}, nil"
  - of: termless
    steps:
      - return: m.Position.Index > 0 && m.Position.Term == 0
  - of: (*Node).durablePosition
    participants:
      - id: caller
        kind: actor
      - id: (*Node).durablePosition
        kind: self
      - id: d.AppliedPosition
        kind: value
      - id: n.lineage
        kind: internal
    steps:
      - bind: d, ok
        eval: n.cfg.Machine.(coreconsensus.DurableStateMachine)
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, nil
          when: "!ok"
      - bind: li, pos, err
        eval: d.AppliedPosition()
        to: d.AppliedPosition
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, err
          when: err != nil
      - opt:
          do:
            - return: pos, nil
          init:
            bind: l
            eval: n.lineage()
            to: n.lineage
          when: li.Same(l) || (pos.Index <= l.KeptIndex && li.Cluster == l.Predecessor)
      - return: coreconsensus.PositionValue{}, nil
  - of: (*Node).restoreLatest
    participants:
      - id: caller
        kind: actor
      - id: (*Node).restoreLatest
        kind: self
      - id: n.obs.warn
        kind: internal
      - id: origin
        kind: internal
      - id: n.restoreFrom
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: "n.obs.warn(\"consensus: a snapshot was not restored\", lstr(\"id\", m.ID), lstr(\"error\", \"recorded at term 0\"))"
                    to: n.obs.warn
                  - set: failed
                    value: append(failed, m)
                  - opt:
                      do:
                        - set: newest
                          to: origin
                          value: origin(coreconsensus.SnapshotCorrupt, errs.String("why", "recorded at term 0"), errs.String("id", m.ID))
                      when: newest == nil
                  - continue: true
                when: termless(&m)
            - bind: rerr
              eval: n.restoreFrom(m, durIdx)
              to: n.restoreFrom
            - opt:
                do:
                  - return: m, failed, newest, nil
                when: rerr == nil
            - opt:
                do:
                  - return: coreconsensus.SnapshotMetaValue{}, nil, nil, rerr
                when: errs.HasCode(rerr, coreconsensus.CodeVersionUnsupported)
            - eval: "n.obs.warn(\"consensus: a snapshot was not restored\", lstr(\"id\", m.ID), lstr(\"error\", rerr.Error()))"
              to: n.obs.warn
            - opt:
                do:
                  - set: newest
                    value: rerr
                when: newest == nil
            - opt:
                do:
                  - set: failed
                    value: append(failed, m)
                when: ownFailure(rerr)
          key: _
          range: metas
          value: m
      - return: coreconsensus.SnapshotMetaValue{}, nil, newest, nil
  - of: (*Node).fallbackGap
    steps:
      - opt:
          do:
            - return: newest
          when: newest != nil && !n.noTable && errs.HasCode(err, coreconsensus.CodeLogCorrupt)
      - return: err
  - of: ownFailure
    steps:
      - return: "!errs.HasCode(err, coreconsensus.CodeStorageFailed) && !errs.HasCode(err, coreconsensus.CodeSnapshotTooLarge)"
  - of: (*Node).unpublishNewer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).unpublishNewer
        kind: self
      - id: n.cfg.Snapshots.Remove
        kind: value
      - id: storageFailed
        kind: internal
      - id: n.obs.warn
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("unpublish a snapshot that did not restore", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: n.cfg.Snapshots.Remove(m.ID)
                  to: n.cfg.Snapshots.Remove
                when: err != nil
            - eval: "n.obs.warn(\"consensus: a snapshot that did not restore was unpublished\", lstr(\"id\", m.ID))"
              to: n.obs.warn
          key: _
          range: failed
          value: m
      - return: nil
  - of: (*Node).baseOrNoTable
    participants:
      - id: caller
        kind: actor
      - id: (*Node).baseOrNoTable
        kind: self
      - id: noTableBase
        kind: internal
    steps:
      - opt:
          do:
            - return: base, nil
          when: base.Position.Index != 0 || (first <= 1 && (len(metas) == 0 || commit <= last))
      - set: n.noTable
        value: "true"
      - bind: base, err
        eval: noTableBase(n.cfg.Log, metas, first)
        to: noTableBase
      - opt:
          do:
            - return: base, storageFailed("term", err)
          when: err != nil
      - return: base, nil
  - of: (*Node).finishInstall
    participants:
      - id: caller
        kind: actor
      - id: (*Node).finishInstall
        kind: self
      - id: n.cfg.Log.Term
        kind: value
      - id: n.cfg.Log.TruncateSuffix
        kind: value
      - id: compactLog
        kind: internal
      - id: n.cfg.Log.Sync
        kind: value
      - id: n.cfg.Log.Bounds
        kind: value
    steps:
      - bind: snapIdx
        eval: base.Position.Index
      - opt:
          do:
            - return: first, last, origin(coreconsensus.LogCorrupt, errs.String("why", "gap after the snapshot"))
          when: first > snapIdx+1
      - opt:
          do:
            - return: first, last, nil
          when: snapIdx < first
      - bind: match
        eval: "false"
      - opt:
          do:
            - bind: t, terr
              eval: n.cfg.Log.Term(snapIdx)
              to: n.cfg.Log.Term
            - set: match
              value: terr == nil && t == base.Position.Term
          when: snapIdx <= last
      - opt:
          do:
            - opt:
                do:
                  - return: first, last, storageFailed("truncate", err)
                init:
                  bind: err
                  eval: n.cfg.Log.TruncateSuffix(first)
                  to: n.cfg.Log.TruncateSuffix
                when: err != nil
          when: "!match"
      - opt:
          do:
            - return: first, last, nil
          when: match && snapIdx <= last
      - opt:
          do:
            - return: first, last, storageFailed("compact", err)
          init:
            bind: err
            eval: compactLog(n.cfg.Log, snapIdx, base.Position.Term)
            to: compactLog
          when: err != nil
      - opt:
          do:
            - return: first, last, storageFailed("sync", err)
          init:
            bind: err
            eval: n.cfg.Log.Sync()
            to: n.cfg.Log.Sync
          when: err != nil
      - set: newFirst, newLast
        to: n.cfg.Log.Bounds
        value: n.cfg.Log.Bounds()
      - return: newFirst, newLast, nil
  - of: (*Node).readTail
    participants:
      - id: caller
        kind: actor
      - id: (*Node).readTail
        kind: self
      - id: n.cfg.Log.Entries
        kind: value
      - id: t.add
        kind: internal
    steps:
      - bind: lo
        eval: max(first, snapIdx+1)
      - opt:
          do:
            - return: nil, 0, nil
          when: last < lo
      - bind: count
        eval: int(last - lo + 1)
      - bind: t
        eval: |-
          tailLoad{
          		ents: make([]coreconsensus.EntryValue, 0, count+count/4),
          		lo:   lo, commit: min(commit, last), dropped: lo - 1, keep: n.cfg.RecentEntriesBytes,
          	}
      - loop:
          cond: next <= last
          do:
            - bind: batch, err
              eval: n.cfg.Log.Entries(next, last+1, n.cfg.MaxBatchBytes, nil)
              to: n.cfg.Log.Entries
            - opt:
                do:
                  - return: nil, 0, err
                when: err != nil
            - opt:
                do:
                  - return: nil, 0, storageFailed("entries", errImpossible)
                when: "!contiguousFrom(batch, next)"
            - eval: t.add(batch)
              to: t.add
          init: next := lo
          post: next = lo + uint64(len(t.ents))
      - return: t.ents, t.evicted(), nil
  - of: (*tailLoad).add
    participants:
      - id: caller
        kind: actor
      - id: (*tailLoad).add
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - loop:
          do:
            - set: batch[i].Data
              to: bytes
              value: bytes.Clone(batch[i].Data)
            - op: +=
              set: t.held
              value: int64(len(batch[i].Data))
          key: i
          range: batch
      - set: t.ents
        value: append(t.ents, batch...)
      - loop:
          cond: t.held > t.keep && t.dropped < t.commit && t.dropped < t.lo+uint64(len(t.ents))-1
          do:
            - bind: e
              eval: "&t.ents[t.dropped+1-t.lo]"
            - op: "-="
              set: t.held
              value: int64(len(e.Data))
            - opt:
                do:
                  - set: e.Data
                    value: nil
                when: e.Kind == coreconsensus.EntryCommand
            - op: ++
              set: t.dropped
  - of: (*tailLoad).evicted
    steps:
      - opt:
          do:
            - return: "0"
          when: t.dropped < t.lo
      - return: t.dropped
  - of: (*Node).startApplied
    participants:
      - id: caller
        kind: actor
      - id: (*Node).startApplied
        kind: self
      - id: n.durableTerm
        kind: internal
    steps:
      - bind: snapIdx
        eval: base.Position.Index
      - bind: applied
        eval: max(snapIdx, dur.Index)
      - set: n.applied
        value: applied
      - alt:
          - do:
              - set: n.appliedTerm
                value: base.Position.Term
            when: applied == snapIdx
          - do:
              - bind: term, err
                eval: n.durableTerm(dur)
                to: n.durableTerm
              - opt:
                  do:
                    - return: 0, err
                  when: err != nil
              - set: n.appliedTerm
                value: term
            else: true
      - opt:
          do:
            - set: n.applied, n.appliedTerm
              value: 0, 0
          when: n.noTable && dur.Index < snapIdx
      - return: applied, nil
  - of: (*Node).durableTerm
    participants:
      - id: caller
        kind: actor
      - id: (*Node).durableTerm
        kind: self
      - id: n.cfg.Log.Term
        kind: value
    steps:
      - bind: t, err
        eval: n.cfg.Log.Term(dur.Index)
        to: n.cfg.Log.Term
      - opt:
          do:
            - return: dur.Term, nil
          when: err != nil
      - opt:
          do:
            - return: |-
                0, origin(coreconsensus.LogCorrupt, errs.String("why", "the durable machine applied another term than the log holds"),
                			errs.String("index", u64s(dur.Index)), errs.String("machine_term", u64s(dur.Term)), errs.String("log_term", u64s(t)))
          when: dur.Term != 0 && dur.Term != t
      - return: t, nil
  - of: noTableBase
    participants:
      - id: caller
        kind: actor
      - id: noTableBase
        kind: self
      - id: log.Term
        kind: value
      - id: baseTerm
        kind: internal
    steps:
      - var:
          name: b
          type: coreconsensus.SnapshotMetaValue
      - bind: matched
        eval: "false"
      - opt:
          do:
            - set: b
              value: metas[0]
            - loop:
                do:
                  - opt:
                      do:
                        - set: b, matched
                          value: m, true
                      when: m.Position.Index == first-1 && !termless(&m)
                key: _
                range: metas
                value: m
          when: len(metas) > 0
      - set: b.Position.Index
        value: first - 1
      - bind: term, err
        eval: log.Term(first - 1)
        to: log.Term
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: b.Position.Term, err
            eval: baseTerm(term, b.Position.Term, matched, first)
            op: =
            to: baseTerm
          when: err != nil
      - return: b, nil
  - of: isMembershipEntry
    steps:
      - return: e.Kind == coreconsensus.EntryMembership
  - of: baseTerm
    steps:
      - bind: term
        eval: logTerm
      - opt:
          do:
            - opt:
                do:
                  - return: 0, errImpossible
                when: logTerm != 0 && logTerm != metaTerm
            - set: term
              value: metaTerm
          when: matched
      - opt:
          do:
            - return: 0, errUnknownBaseTerm
          when: term == 0 && first > 1
      - return: term, nil
  - of: (*Node).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*Node).deliver
        kind: self
      - id: wire
        kind: package
      - id: n.droppedFrom.Add
        kind: value
      - id: n.obs.inc
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.stopped.Load()
      - var:
          name: m
          type: coreconsensus.MessageValue
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: wire.ParseMessage(bytes.Clone(frame), &m)
            to: wire
          when: err != nil
      - opt:
          do:
            - eval: n.droppedFrom.Add(1)
              to: n.droppedFrom.Add
            - eval: n.obs.inc(mFramesDropped, coreotel.String("reason", "from_mismatch"))
              to: n.obs.inc
            - return: ""
          when: m.From != from.ID
      - bind: q
        eval: n.inData
      - opt:
          do:
            - set: q
              value: n.inCtrl
          when: m.Kind.Lane() == coreconsensus.LaneControl
      - select:
          cases:
            - comm: q <- m
            - default: true
  - of: (*Node).exec
    steps:
      - bind: done
        eval: make(chan struct{})
      - select:
          cases:
            - comm: n.execc <- func() { f(); close(done) }
            - comm: <-n.stopc
              do:
                - return: "false"
      - select:
          cases:
            - comm: <-done
              do:
                - return: "true"
            - comm: <-n.loopDone
              do:
                - return: "false"
  - of: (*Node).loop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).loop
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.loopDoneOnce.Do
        kind: value
      - id: n.tickInterval
        kind: internal
      - id: n.tickEvery.Store
        kind: value
      - id: n.clk.NewTicker
        kind: value
      - id: tick.Stop
        kind: value
      - id: n.turn
        kind: internal
      - id: n.failAllOnStop
        kind: internal
      - id: n.drainControl
        kind: internal
      - id: n.handleReady
        kind: internal
      - id: n.checkTurn
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - defer: n.loopDoneOnce.Do(func() { close(n.loopDone) })
        to: n.loopDoneOnce.Do
      - bind: every
        eval: n.tickInterval()
        to: n.tickInterval
      - eval: n.tickEvery.Store(int64(every))
        to: n.tickEvery.Store
      - bind: tick
        eval: n.clk.NewTicker(every)
        to: n.clk.NewTicker
      - defer: tick.Stop()
        to: tick.Stop
      - var:
          name: props
          type: "[]*proposal"
      - loop:
          do:
            - bind: turn, open
              eval: n.turn(tick, &props)
              to: n.turn
            - opt:
                do:
                  - eval: n.failAllOnStop()
                    to: n.failAllOnStop
                  - return: ""
                when: "!open"
            - eval: n.drainControl()
              to: n.drainControl
            - eval: n.handleReady()
              to: n.handleReady
            - eval: n.checkTurn(turn)
              to: n.checkTurn
          forever: true
  - of: (*Node).turn
    participants:
      - id: caller
        kind: actor
      - id: (*Node).turn
        kind: self
      - id: n.onTick
        kind: internal
      - id: n.onMessage
        kind: internal
      - id: n.onStored
        kind: internal
      - id: n.onProposal
        kind: internal
      - id: n.onExec
        kind: internal
      - id: n.onFetched
        kind: internal
    steps:
      - select:
          cases:
            - comm: <-n.stopc
              do:
                - return: time.Time{}, false
            - comm: _, ok := <-tick.C()
              do:
                - return: n.onTick(tick, ok)
                  to: n.onTick
            - comm: m, ok := <-n.inCtrl
              do:
                - return: n.onMessage(&m, ok)
                  to: n.onMessage
            - comm: m, ok := <-n.inData
              do:
                - return: n.onMessage(&m, ok)
                  to: n.onMessage
            - comm: d, ok := <-n.storec
              do:
                - return: n.onStored(&d, ok)
                  to: n.onStored
            - comm: p, ok := <-n.propc
              do:
                - return: n.onProposal(p, ok, props)
                  to: n.onProposal
            - comm: f, ok := <-n.execc
              do:
                - return: n.onExec(f, ok)
                  to: n.onExec
            - comm: f, ok := <-n.fetchc
              do:
                - return: n.onFetched(&f, ok)
                  to: n.onFetched
  - of: (*Node).onTick
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onTick
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.Tick
        kind: value
      - id: n.probeLeader
        kind: internal
      - id: n.watchProgress
        kind: internal
      - id: n.watchPins
        kind: internal
      - id: n.watchPreferred
        kind: internal
      - id: n.tickInterval
        kind: internal
      - id: n.tickEvery.Store
        kind: value
      - id: tick.Reset
        kind: value
      - id: n.sweep
        kind: internal
      - id: n.observePeers
        kind: internal
      - id: n.observeResources
        kind: internal
      - id: n.guardSpace
        kind: internal
      - id: n.watchUnfed
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.Tick(n.clk.Now())
        to: n.r.Tick
      - eval: n.probeLeader(turn)
        to: n.probeLeader
      - eval: n.watchProgress(turn)
        to: n.watchProgress
      - eval: n.watchPins(turn)
        to: n.watchPins
      - eval: n.watchPreferred(turn)
        to: n.watchPreferred
      - opt:
          do:
            - eval: n.tickEvery.Store(int64(d))
              to: n.tickEvery.Store
            - eval: tick.Reset(d)
              to: tick.Reset
          init:
            bind: d
            eval: n.tickInterval()
            to: n.tickInterval
          when: d != time.Duration(n.tickEvery.Load())
      - eval: n.sweep()
        to: n.sweep
      - eval: n.observePeers()
        to: n.observePeers
      - eval: n.observeResources()
        to: n.observeResources
      - eval: n.guardSpace(turn)
        to: n.guardSpace
      - eval: n.watchUnfed()
        to: n.watchUnfed
      - return: turn, true
  - of: (*Node).onMessage
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onMessage
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.SetOverloaded
        kind: value
      - id: n.r.Step
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.SetOverloaded(n.applyOverloaded())
        to: n.r.SetOverloaded
      - eval: n.r.Step(n.clk.Now(), *m)
        to: n.r.Step
      - return: turn, true
  - of: (*Node).onStored
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onStored
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.storageDone
        kind: internal
      - id: n.guardSpace
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.storageDone(d)
        to: n.storageDone
      - eval: n.guardSpace(turn)
        to: n.guardSpace
      - return: turn, true
  - of: (*Node).onProposal
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onProposal
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.batchProposals
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.batchProposals(p, props)
        to: n.batchProposals
      - return: turn, true
  - of: (*Node).onExec
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onExec
        kind: self
      - id: n.clk.Now
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: f()
      - return: turn, true
  - of: (*Node).onFetched
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onFetched
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.Fetched
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.Fetched(f.req.To, f.req.Lo, f.ents, f.compacted)
        to: n.r.Fetched
      - return: turn, true
  - of: (*Node).storageDone
    participants:
      - id: caller
        kind: actor
      - id: (*Node).storageDone
        kind: self
      - id: n.r.StorageDone
        kind: value
      - id: n.cfg.Transport.Send
        kind: value
    steps:
      - eval: n.r.StorageDone(d.seq, d.index, d.term)
        to: n.r.StorageDone
      - loop:
          do:
            - eval: n.cfg.Transport.Send(d.to[i], f)
              to: n.cfg.Transport.Send
          key: i
          range: d.after
          value: f
  - of: (*Node).batchProposals
    participants:
      - id: caller
        kind: actor
      - id: (*Node).batchProposals
        kind: self
      - id: n.queuedProposal
        kind: internal
      - id: n.handleProposals
        kind: internal
    steps:
      - bind: batch
        eval: append((*props)[:0], first)
      - loop:
          cond: len(batch) < maxBatchedProposals
          do:
            - bind: p, ok
              eval: n.queuedProposal()
              to: n.queuedProposal
            - opt:
                do:
                  - break: true
                when: "!ok"
            - set: batch
              value: append(batch, p)
      - set: "*props"
        value: batch
      - eval: n.handleProposals(batch)
        to: n.handleProposals
  - of: (*Node).queuedProposal
    steps:
      - select:
          cases:
            - comm: p, ok := <-n.propc
              do:
                - return: p, ok
            - default: true
              do:
                - return: nil, false
  - of: (*Node).drainControl
    participants:
      - id: caller
        kind: actor
      - id: (*Node).drainControl
        kind: self
      - id: n.queuedControl
        kind: internal
      - id: n.r.Step
        kind: value
    steps:
      - loop:
          do:
            - bind: m, ok
              eval: n.queuedControl()
              to: n.queuedControl
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: n.r.Step(n.clk.Now(), m)
              to: n.r.Step
          range: maxCtrlPerTurn
  - of: (*Node).queuedControl
    steps:
      - select:
          cases:
            - comm: m, ok := <-n.inCtrl
              do:
                - return: m, ok
            - default: true
              do:
                - return: coreconsensus.MessageValue{}, false
  - of: (*Node).checkTurn
    participants:
      - id: caller
        kind: actor
      - id: (*Node).checkTurn
        kind: self
      - id: n.clk.Since
        kind: value
      - id: n.obs.record
        kind: internal
      - id: time
        kind: stdlib
      - id: n.longTurns.Add
        kind: value
      - id: n.r.DropLease
        kind: value
    steps:
      - bind: d
        eval: n.clk.Since(turn)
        to: n.clk.Since
      - eval: n.obs.record(mLoopTurn, d.Seconds())
        to: n.obs.record
      - opt:
          do:
            - return: ""
          when: n.cfg.Reads != ReadLease
      - bind: t
        eval: n.r.Status().Timing
      - bind: budget
        eval: time.Duration(float64(t.ElectionTimeoutMin) * t.MaxClockDrift)
        to: time
      - opt:
          do:
            - eval: n.longTurns.Add(1)
              to: n.longTurns.Add
            - eval: n.r.DropLease()
              to: n.r.DropLease
          when: budget > 0 && d > budget
  - of: (*Node).sweep
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sweep
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.dropForward
        kind: internal
      - id: n.sweepReads
        kind: internal
      - id: n.sweepWaiters
        kind: internal
    steps:
      - bind: grace
        eval: 2 * n.r.Status().Timing.ElectionTimeoutMax
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - loop:
          do:
            - switch:
                cases:
                  - case: p.gone.Load()
                    do:
                      - eval: n.dropForward(ctx)
                        to: n.dropForward
                  - case: "!p.changedAt.IsZero() && now.Sub(p.changedAt) > grace"
                    do:
                      - eval: n.dropForward(ctx)
                        to: n.dropForward
                      - send:
                          chan: p.done
                          value: "propResult{err: outcomeUnknown(\"leader changed before the answer\")}"
                  - case: "!p.sentAt.IsZero() && now.Sub(p.sentAt) > grace"
                    do:
                      - eval: n.dropForward(ctx)
                        to: n.dropForward
                      - send:
                          chan: p.done
                          value: "propResult{err: outcomeUnknown(\"the leader did not answer the forward in time\")}"
          key: ctx
          range: n.forwards
          value: p
      - eval: n.sweepReads(now)
        to: n.sweepReads
      - eval: n.sweepWaiters(now, grace)
        to: n.sweepWaiters
  - of: (*Node).sweepReads
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sweepReads
        kind: self
      - id: n.r.ReadIndex
        kind: value
    steps:
      - bind: etMax
        eval: n.r.Status().Timing.ElectionTimeoutMax
      - loop:
          do:
            - switch:
                cases:
                  - case: w.gone.Load()
                    do:
                      - eval: delete(n.reads, ctx)
                  - case: n.lastRole == coreconsensus.RoleLeader
                  - case: now.Sub(w.sentAt) > 2*etMax
                    do:
                      - eval: delete(n.reads, ctx)
                      - send:
                          chan: w.done
                          value: "readResult{code: coreconsensus.CodeLeadershipUnconfirmed}"
                  - case: now.Sub(w.askedAt) > etMax
                    do:
                      - set: w.askedAt
                        value: now
                      - eval: n.r.ReadIndex(now, ctx, n.cfg.Reads != ReadLease)
                        to: n.r.ReadIndex
          key: ctx
          range: n.reads
          value: w
  - of: (*Node).sweepWaiters
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sweepWaiters
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.pendingBytes.Add
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: commit
        eval: n.r.Status().Commit
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(n.waiters, idx)
                  - opt:
                      do:
                        - eval: n.pendingBytes.Add(-int64(len(p.entry.Data)))
                          to: n.pendingBytes.Add
                      when: p.local
                  - send:
                      chan: p.done
                      value: "propResult{err: outcomeUnknown(\"leadership changed before commit\")}"
                when: idx > commit && !p.changedAt.IsZero() && now.Sub(p.changedAt) > grace
          key: idx
          range: n.waiters
          value: p
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).dropForward
    participants:
      - id: caller
        kind: actor
      - id: (*Node).dropForward
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - eval: delete(n.forwards, ctx)
      - eval: n.am.Lock()
        to: n.am.Lock
      - op: "--"
        set: n.keepResults
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).tickInterval
    steps:
      - return: max(n.r.Status().Timing.HeartbeatInterval/5, time.Millisecond)
  - of: (*Node).handleReady
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleReady
        kind: self
      - id: n.r.SetApplyLag
        kind: value
      - id: n.handleOne
        kind: internal
      - id: n.awaitApply
        kind: internal
      - id: n.leadershipChanged
        kind: internal
      - id: n.publish
        kind: internal
    steps:
      - bind: lag, reading
        eval: n.applyLag.Load(), n.applyReads.Load() > 0
      - eval: n.r.SetApplyLag(lag, reading)
        to: n.r.SetApplyLag
      - set: n.handedLag, n.handedRead
        value: 0, false
      - loop:
          cond: n.r.HasReady()
          do:
            - bind: rd
              eval: new(n.r.Ready())
            - opt:
                do:
                  - return: ""
                when: n.stopOnUnsupported(rd)
            - eval: n.handleOne(rd)
              to: n.handleOne
      - eval: n.awaitApply(lag+n.handedLag, reading || n.handedRead)
        to: n.awaitApply
      - eval: n.leadershipChanged()
        to: n.leadershipChanged
      - eval: n.publish()
        to: n.publish
  - of: (*Node).applyOverloaded
    steps:
      - return: n.applyLag.Load() >= n.cfg.MaxApplyLagBytes || n.applyReads.Load() > 0 || n.r.ApplyHeld()
  - of: (*Node).awaitApply
    participants:
      - id: caller
        kind: actor
      - id: (*Node).awaitApply
        kind: self
      - id: n.applyWake.Store
        kind: value
      - id: n.applyMoved
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!n.r.ApplyHeld()"
      - eval: n.applyWake.Store(true)
        to: n.applyWake.Store
      - opt:
          do:
            - eval: n.applyMoved()
              to: n.applyMoved
          when: n.applyLag.Load() < lag || (reading && n.applyReads.Load() == 0)
  - of: (*Node).applyMoved
    participants:
      - id: caller
        kind: actor
      - id: (*Node).applyMoved
        kind: self
      - id: n.wakeLoop
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.applyReads.Load() != 0 || n.applyLag.Load() > n.cfg.MaxApplyLagBytes/2
      - opt:
          do:
            - eval: n.wakeLoop()
              to: n.wakeLoop
          when: n.applyWake.CompareAndSwap(true, false)
  - of: (*Node).wakeLoop
    steps:
      - select:
          cases:
            - comm: n.execc <- func() {}
            - default: true
  - of: (*Node).auditAppended
    participants:
      - id: caller
        kind: actor
      - id: (*Node).auditAppended
        kind: self
      - id: wire
        kind: package
      - id: n.obs.warn
        kind: internal
    steps:
      - loop:
          do:
            - bind: e
              eval: "&rd.Entries[i]"
            - opt:
                do:
                  - continue: true
                when: e.Kind == coreconsensus.EntryCommand || e.Kind == coreconsensus.EntryNoOp || !e.Kind.Known()
            - opt:
                do:
                  - return: ""
                when: n.r.Status().Role != coreconsensus.RoleLeader
            - bind: a, err
              eval: wire.ParseAdminAt(e.Version, e.Data)
              to: wire
            - opt:
                do:
                  - continue: true
                when: err != nil
            - eval: |-
                n.obs.warn("consensus: administrative entry appended", lattr("index", e.Position.Index), lattr("kind", uint64(e.Kind)),
                			lstr("operator", a.Operator), lattr("origin", uint64(a.Origin)), lattr("change", uint64(a.Change)), lattr("target", uint64(a.Target)))
              to: n.obs.warn
          key: i
          range: rd.Entries
  - of: (*Node).stopOnUnsupported
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stopOnUnsupported
        kind: self
      - id: n.stop
        kind: internal
    steps:
      - bind: u
        eval: rd.Unsupported
      - opt:
          do:
            - return: "false"
          when: u.Index == 0
      - eval: n.stop(unsupportedKind(u.Kind, u.Index), false)
        to: n.stop
      - return: "true"
  - of: (*Node).sendMessages
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sendMessages
        kind: self
      - id: n.cfg.Transport.Send
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: len(ms[i].Entries) > 0 && n.unfed[ms[i].To]
            - eval: n.cfg.Transport.Send(ms[i].To, wire.AppendMessage(nil, &ms[i]))
              to: n.cfg.Transport.Send
          key: i
          range: ms
  - of: (*Node).handleOne
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleOne
        kind: self
      - id: n.sendMessages
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: n.cfg.Transport.SetMembership
        kind: value
      - id: n.obs.info
        kind: internal
      - id: n.reportNotices
        kind: internal
      - id: n.auditAppended
        kind: internal
      - id: n.r.TermAt
        kind: value
      - id: n.sq.push
        kind: internal
      - id: n.queueApply
        kind: internal
      - id: n.fetchq.push
        kind: internal
      - id: n.sendSnapshot
        kind: internal
      - id: n.answerReady
        kind: internal
      - id: n.checkAdmission
        kind: internal
      - id: n.refreshJoin
        kind: internal
    steps:
      - eval: n.sendMessages(rd.Messages)
        to: n.sendMessages
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: leader admitted on a member's record\", lattr(\"leader\", uint64(h.ID)), lstr(\"slot\", h.Slot))"
              to: n.obs.warn
          init:
            bind: h
            eval: rd.LeaderHint
          when: h.ID != 0
      - opt:
          do:
            - eval: n.cfg.Transport.SetMembership(n.cfg.Group, rd.Membership)
              to: n.cfg.Transport.SetMembership
            - eval: "n.obs.info(\"consensus: admitted members changed\", lattr(\"members\", uint64(len(rd.Membership))))"
              to: n.obs.info
          when: len(rd.Membership) > 0
      - eval: n.reportNotices(rd)
        to: n.reportNotices
      - eval: n.auditAppended(rd)
        to: n.auditAppended
      - opt:
          do:
            - bind: q
              eval: "storeReq{rd: *rd}"
            - opt:
                do:
                  - set: q.compactTerm, _
                    to: n.r.TermAt
                    value: n.r.TermAt(rd.Compact)
                when: rd.Compact != 0
            - eval: n.sq.push(q)
              to: n.sq.push
          when: rd.NeedsWrite()
      - eval: n.queueApply(rd)
        to: n.queueApply
      - loop:
          do:
            - eval: n.fetchq.push(f)
              to: n.fetchq.push
          key: _
          range: rd.Fetch
          value: f
      - loop:
          do:
            - eval: n.sendSnapshot(to)
              to: n.sendSnapshot
          key: _
          range: rd.SendSnapshot
          value: to
      - eval: n.answerReady(rd)
        to: n.answerReady
      - eval: n.checkAdmission()
        to: n.checkAdmission
      - eval: n.refreshJoin(rd)
        to: n.refreshJoin
  - of: (*Node).reportNotices
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reportNotices
        kind: self
      - id: n.endSilence
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.endSilence()
              to: n.endSilence
          when: rd.SilenceEnded
      - loop:
          do:
            - eval: n.obs.inc(mChainRefusals, coreotel.String("leader", lead.String()))
              to: n.obs.inc
          key: _
          range: rd.ChainRefusedBy
          value: lead
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: log truncated\", lattr(\"from\", rd.TruncateFrom))"
              to: n.obs.info
          when: rd.TruncateFrom != 0
  - of: (*Node).endSilence
    participants:
      - id: caller
        kind: actor
      - id: (*Node).endSilence
        kind: self
      - id: s.endSilence
        kind: internal
      - id: n.stop
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("end silence", err), true)
                    to: n.stop
                init:
                  bind: err
                  eval: s.endSilence()
                  to: s.endSilence
                when: err != nil
          init:
            bind: s, ok
            eval: n.cfg.Log.(interface{ endSilence() error })
          when: ok
      - eval: "n.obs.info(\"consensus: silence condition met, the node votes and acknowledges again\")"
        to: n.obs.info
  - of: (*Node).queueApply
    participants:
      - id: caller
        kind: actor
      - id: (*Node).queueApply
        kind: self
      - id: n.applyReads.Add
        kind: value
      - id: n.aq.push
        kind: internal
      - id: n.obs.setGauge
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.applyReads.Add(1)
              to: n.applyReads.Add
            - set: n.handedRead
              value: "true"
            - eval: "n.aq.push(applyItem{read: rd.ApplyRead})"
              to: n.aq.push
          when: rd.ApplyRead.Lo != 0
      - bind: entries
        eval: rd.Apply
      - opt:
          do:
            - return: ""
          when: len(entries) == 0
      - var:
          name: b
          type: int64
      - loop:
          do:
            - op: +=
              set: b
              value: int64(len(entries[i].Data))
          key: i
          range: entries
      - op: +=
        set: n.handedLag
        value: b
      - eval: n.obs.setGauge(mApplyLagBytes, float64(n.applyLag.Add(b)))
        to: n.obs.setGauge
      - eval: "n.aq.push(applyItem{entries: entries})"
        to: n.aq.push
  - of: (*Node).answerReady
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerReady
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.forwardAnswered
        kind: internal
    steps:
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: n.readAnswered(rs.Context, rs.Code, now)
            - opt:
                do:
                  - eval: delete(n.reads, rs.Context)
                  - send:
                      chan: w.done
                      value: "readResult{index: rs.Index, code: rs.Code}"
                init:
                  bind: w, ok
                  eval: n.reads[rs.Context]
                when: ok
          key: _
          range: rd.ReadStates
          value: rs
      - loop:
          do:
            - eval: n.forwardAnswered(m)
              to: n.forwardAnswered
          key: _
          range: rd.Forwarded
          value: m
      - loop:
          do:
            - loop:
                do:
                  - send:
                      chan: w
                      value: t.Code
                key: _
                range: n.transfers
                value: w
            - set: n.transfers
              value: nil
          key: _
          range: rd.Transfers
          value: t
  - of: (*Node).checkAdmission
    participants:
      - id: caller
        kind: actor
      - id: (*Node).checkAdmission
        kind: self
      - id: n.r.Status
        kind: value
      - id: st.Committed.Member
        kind: value
      - id: n.cfg.Log.WriteStamp
        kind: value
      - id: n.stop
        kind: internal
      - id: n.r.SetCanVote
        kind: value
      - id: j.releaseJoinAnswer
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.canVote
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - bind: s
              eval: n.stamp
            - set: s.State
              value: coreconsensus.StampMember
            - opt:
                do:
                  - eval: n.stop(storageFailed("stamp", err), false)
                    to: n.stop
                  - return: ""
                init:
                  bind: err
                  eval: n.cfg.Log.WriteStamp(s)
                  to: n.cfg.Log.WriteStamp
                when: err != nil
            - set: n.stamp
              value: s
            - set: n.canVote
              value: "true"
            - eval: n.r.SetCanVote(true)
              to: n.r.SetCanVote
            - opt:
                do:
                  - eval: j.releaseJoinAnswer()
                    to: j.releaseJoinAnswer
                init:
                  bind: j, ok
                  eval: n.cfg.Transport.(joinReleaser)
                when: ok
          init:
            bind: m, ok
            eval: st.Committed.Member(n.stamp.ID)
            to: st.Committed.Member
          when: ok && m.Incarnation == n.stamp.Incarnation
  - of: (*Node).leadershipChanged
    participants:
      - id: caller
        kind: actor
      - id: (*Node).leadershipChanged
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.startGrace
        kind: internal
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - return: ""
          when: st.Term == n.lastTerm && st.Lead == n.lastLead && st.Role == n.lastRole
      - set: n.lastTerm, n.lastLead, n.lastRole
        value: st.Term, st.Lead, st.Role
      - loop:
          do:
            - eval: stop()
          key: _
          range: n.sendStop
          value: stop
      - set: n.contact.probeCtx, n.contact.probeAt
        value: 0, time.Time{}
      - eval: n.startGrace(st.Commit)
        to: n.startGrace
      - loop:
          do:
            - eval: delete(n.reads, ctx)
            - send:
                chan: w.done
                value: "readResult{code: coreconsensus.CodeNotLeader}"
          key: ctx
          range: n.reads
          value: w
      - set: n.preferAt
        value: time.Time{}
  - of: (*Node).startGrace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).startGrace
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - loop:
          do:
            - opt:
                do:
                  - set: p.changedAt
                    value: now
                when: p.changedAt.IsZero()
          key: _
          range: n.forwards
          value: p
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - opt:
                do:
                  - set: p.changedAt
                    value: now
                when: idx > commit && p.changedAt.IsZero()
          key: idx
          range: n.waiters
          value: p
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).watchPreferred
    participants:
      - id: caller
        kind: actor
      - id: (*Node).watchPreferred
        kind: self
      - id: n.r.Status
        kind: value
      - id: now.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: len(n.cfg.PreferredLeaders) == 0 || now.Before(n.preferAt)
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - return: ""
          when: st.Role != coreconsensus.RoleLeader || st.Transfer != 0
      - opt:
          do:
            - set: n.preferAt
              to: now.Add
              value: now.Add(st.Timing.ElectionTimeoutMax)
          when: n.preferLeader(now, &st)
  - of: (*Node).preferLeader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).preferLeader
        kind: self
      - id: st.Conf.Member
        kind: value
      - id: n.r.Progress
        kind: value
    steps:
      - opt:
          do:
            - return: "false"
          when: slices.Contains(n.cfg.PreferredLeaders, n.stamp.ID)
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: n.r.TransferLeadership(now, id) == 0
                      init:
                        bind: match, _, ok
                        eval: n.r.Progress(id)
                        to: n.r.Progress
                      when: ok && match >= st.Commit
                init:
                  bind: m, ok
                  eval: st.Conf.Member(id)
                  to: st.Conf.Member
                when: ok && m.Voter
          key: _
          range: n.cfg.PreferredLeaders
          value: id
      - return: "false"
  - of: (*Node).publish
    participants:
      - id: caller
        kind: actor
      - id: (*Node).publish
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.progress.noteApplied
        kind: internal
      - id: n.status.Load
        kind: value
      - id: n.status.Store
        kind: value
      - id: n.observeStatus
        kind: internal
      - id: n.watchMu.Lock
        kind: value
      - id: n.watchMu.Unlock
        kind: value
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: s
        eval: |-
          &coreconsensus.StatusValue{
          		ID: n.stamp.ID, Role: st.Role, Term: st.Term, Leader: st.Lead, Commit: st.Commit, Applied: applied,
          		Log: n.lineage(), Timing: st.Timing, NoSpace: st.NoSpace,
          		Versions: coreconsensus.VersionsValue{ProtocolMin: 1, ProtocolMax: raft.ProtocolMax, Cluster: st.Cluster, ClusterGeneration: st.ClusterG},
          	}
      - eval: n.progress.noteApplied(s.Commit, s.Applied, n.clk.Now())
        to: n.progress.noteApplied
      - bind: old
        eval: n.status.Load()
        to: n.status.Load
      - opt:
          do:
            - return: ""
          when: old != nil && *old == *s
      - eval: n.status.Store(s)
        to: n.status.Store
      - eval: n.observeStatus(old, s)
        to: n.observeStatus
      - eval: n.watchMu.Lock()
        to: n.watchMu.Lock
      - loop:
          do:
            - select:
                cases:
                  - comm: <-ch
                  - default: true
            - select:
                cases:
                  - comm: ch <- *s
                  - default: true
          key: ch
          range: n.watchers
      - eval: n.watchMu.Unlock()
        to: n.watchMu.Unlock
  - of: (*Node).reader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reader
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.fetchq.take
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - var:
          name: reqs
          type: "[]raft.FetchSpec"
      - loop:
          do:
            - select:
                cases:
                  - comm: _, ok := <-n.fetchq.signal
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!ok"
                  - comm: <-n.stopc
                    do:
                      - return: ""
            - set: reqs
              to: n.fetchq.take
              value: n.fetchq.take(reqs)
            - loop:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: "!n.fetch(f)"
                key: _
                range: reqs
                value: f
          forever: true
  - of: (*Node).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).fetch
        kind: self
      - id: n.cfg.Log.Entries
        kind: value
      - id: n.stop
        kind: internal
      - id: bytes
        kind: stdlib
    steps:
      - bind: d
        eval: "fetchDone{req: f}"
      - bind: ents, err
        eval: n.cfg.Log.Entries(f.Lo, f.Hi, n.cfg.MaxBatchBytes, nil)
        to: n.cfg.Log.Entries
      - switch:
          cases:
            - case: errs.HasCode(err, coreconsensus.CodeCompacted)
              do:
                - set: d.compacted
                  value: "true"
            - case: err != nil
              do:
                - eval: n.stop(err, true)
                  to: n.stop
                - return: "false"
      - loop:
          do:
            - set: ents[i].Data
              to: bytes
              value: bytes.Clone(ents[i].Data)
          key: i
          range: ents
      - set: d.ents
        value: ents
      - select:
          cases:
            - comm: n.fetchc <- d
              do:
                - return: "true"
            - comm: <-n.stopc
              do:
                - return: "false"
  - of: (*Node).storageActor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).storageActor
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.finalWrites
        kind: internal
      - id: n.sq.take
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - var:
          name: reqs
          type: "[]storeReq"
      - var:
          name: st
          type: storeState
      - loop:
          do:
            - select:
                cases:
                  - comm: _, ok := <-n.sq.signal
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!ok"
                  - comm: <-n.stopc
                    do:
                      - eval: n.finalWrites(reqs, &st)
                        to: n.finalWrites
                      - return: ""
            - set: reqs
              to: n.sq.take
              value: n.sq.take(reqs)
            - opt:
                do:
                  - return: ""
                when: "!n.writeAll(reqs, &st)"
          forever: true
  - of: (*Node).finalWrites
    participants:
      - id: caller
        kind: actor
      - id: (*Node).finalWrites
        kind: self
      - id: n.cfg.Log.Sync
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.hard.Load() || !n.writeAll(n.sq.take(reqs), st) || !st.lazy
      - opt:
          do:
            - eval: n.stop(storageFailed("sync", err), true)
              to: n.stop
          init:
            bind: err
            eval: n.cfg.Log.Sync()
            to: n.cfg.Log.Sync
          when: err != nil
  - of: (*Node).writeAll
    participants:
      - id: caller
        kind: actor
      - id: (*Node).writeAll
        kind: self
      - id: n.stageAll
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: len(reqs) == 0
      - bind: written, durable, ok
        eval: n.stageAll(reqs, st.synced)
        to: n.stageAll
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - switch:
          cases:
            - case: "!durable"
              do:
                - set: st.lazy
                  value: "true"
            - case: st.lazy || writesAny(reqs)
              do:
                - opt:
                    do:
                      - return: "false"
                    when: "!n.syncFor(reqs)"
                - set: st.synced, st.lazy
                  value: written, false
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: "!n.completeWrite(&reqs[i].rd)"
          key: i
          range: reqs
      - return: "true"
  - of: needsSync
    steps:
      - return: rd.HardState != nil || rd.TruncateFrom != 0 || rd.Compact != 0 || len(rd.Entries) != 0 || len(rd.AfterSync) != 0
  - of: (*Node).write
    participants:
      - id: caller
        kind: actor
      - id: (*Node).write
        kind: self
      - id: compactLog
        kind: internal
      - id: n.stop
        kind: internal
    steps:
      - bind: rd
        eval: "&q.rd"
      - opt:
          do:
            - return: "false"
          when: "!n.truncateFor(rd, written)"
      - opt:
          do:
            - set: "*written"
              value: rd.Entries[k-1].Position.Index
          init:
            bind: k
            eval: len(rd.Entries)
          when: k > 0
      - opt:
          do:
            - return: "false"
          when: "!n.appendFor(rd, *written)"
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("compact", err), true)
                    to: n.stop
                  - return: "false"
                init:
                  bind: err
                  eval: compactLog(n.cfg.Log, rd.Compact, q.compactTerm)
                  to: compactLog
                when: err != nil
          when: rd.Compact != 0
      - return: "true"
  - of: (*Node).truncateFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).truncateFor
        kind: self
      - id: n.cfg.Log.TruncateSuffix
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: rd.TruncateFrom == 0
      - opt:
          do:
            - eval: n.stop(storageFailed("truncate", err), true)
              to: n.stop
            - return: "false"
          init:
            bind: err
            eval: n.cfg.Log.TruncateSuffix(rd.TruncateFrom)
            to: n.cfg.Log.TruncateSuffix
          when: err != nil
      - set: "*written"
        value: min(*written, rd.TruncateFrom-1)
      - return: "true"
  - of: (*Node).appendFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appendFor
        kind: self
      - id: n.hardStateFor
        kind: internal
      - id: n.cfg.Log.Append
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - bind: hs, ok
        eval: n.hardStateFor(rd, last)
        to: n.hardStateFor
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("append", err), true)
                    to: n.stop
                  - return: "false"
                init:
                  bind: err
                  eval: n.cfg.Log.Append(rd.Entries, hs)
                  to: n.cfg.Log.Append
                when: err != nil
          when: len(rd.Entries) > 0 || hs != nil
      - return: "true"
  - of: (*Node).hardStateFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).hardStateFor
        kind: self
      - id: n.cfg.Log.HardState
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, true
          when: rd.HardState == nil && rd.Commit == 0
      - bind: h, err
        eval: n.cfg.Log.HardState()
        to: n.cfg.Log.HardState
      - opt:
          do:
            - eval: n.stop(storageFailed("hard state", err), true)
              to: n.stop
            - return: nil, false
          when: err != nil
      - opt:
          do:
            - set: h.Term, h.Vote
              value: rd.HardState.Term, rd.HardState.Vote
          when: rd.HardState != nil
      - opt:
          do:
            - set: h.Commit
              value: max(h.Commit, min(rd.Commit, last))
          when: rd.Commit != 0
      - return: "&h, true"
  - of: (*Node).syncFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).syncFor
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.cfg.Log.Sync
        kind: value
      - id: n.obs.record
        kind: internal
      - id: n.stop
        kind: internal
    steps:
      - bind: syncStart
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: err
        eval: n.cfg.Log.Sync()
        to: n.cfg.Log.Sync
      - eval: n.obs.record(mFsyncLatency, n.clk.Since(syncStart).Seconds())
        to: n.obs.record
      - bind: entries, size
        eval: 0, 0
      - loop:
          do:
            - loop:
                do:
                  - op: +=
                    set: size
                    value: len(reqs[i].rd.Entries[j].Data)
                key: j
                range: reqs[i].rd.Entries
            - op: +=
              set: entries
              value: len(reqs[i].rd.Entries)
          key: i
          range: reqs
      - opt:
          do:
            - eval: n.obs.record(mBatchEntries, float64(entries))
              to: n.obs.record
            - eval: n.obs.record(mBatchBytes, float64(size))
              to: n.obs.record
          when: entries > 0
      - opt:
          do:
            - eval: n.stop(storageFailed("sync", err), true)
              to: n.stop
            - return: "false"
          when: err != nil
      - return: "true"
  - of: (*Node).completeWrite
    steps:
      - bind: d
        eval: "storeDone{seq: rd.Seq}"
      - opt:
          do:
            - set: d.index, d.term
              value: rd.Entries[k-1].Position.Index, rd.Entries[k-1].Position.Term
          init:
            bind: k
            eval: len(rd.Entries)
          when: k > 0
      - loop:
          do:
            - set: d.after
              value: append(d.after, wire.AppendMessage(nil, &m))
            - set: d.to
              value: append(d.to, m.To)
          key: _
          range: rd.AfterSync
          value: m
      - select:
          cases:
            - comm: n.storec <- d
            - comm: <-n.stopc
              do:
                - return: "false"
      - return: "true"
  - of: (*Node).stop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stop
        kind: self
      - id: n.stopMu.Lock
        kind: value
      - id: n.stopMu.Unlock
        kind: value
      - id: errs
        kind: package
      - id: m.markStopEach
        kind: internal
      - id: noteUnmarked
        kind: internal
      - id: n.reportUnwrittenMarkers
        kind: internal
      - id: n.obs.setGauge
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: n.stopped.Store
        kind: value
      - id: n.hard.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
    steps:
      - eval: n.stopMu.Lock()
        to: n.stopMu.Lock
      - opt:
          do:
            - eval: n.stopMu.Unlock()
              to: n.stopMu.Unlock
            - return: ""
          when: n.stopReason != nil
      - bind: reason
        eval: "&coreconsensus.StopReasonValue{Err: err}"
      - opt:
          do:
            - bind: code, _
              eval: errs.CodeOf(err)
              to: errs
            - bind: dirErr, runErr
              eval: m.markStopEach(code, err.Error())
              to: m.markStopEach
            - opt:
                do:
                  - set: reason.Unmarked
                    value: "true"
                  - opt:
                      do:
                        - eval: noteUnmarked(d.dir)
                          to: noteUnmarked
                      init:
                        bind: d, ok
                        eval: n.cfg.Log.(*fileLog)
                      when: ok
                when: dirErr != nil && (runErr != nil || code != coreconsensus.CodeStorageFailed) && storage
            - eval: n.reportUnwrittenMarkers(dirErr, runErr)
              to: n.reportUnwrittenMarkers
          init:
            bind: m, ok
            eval: |-
              n.cfg.Log.(interface {
              		markStopEach(code errs.Code, detail string) (dirErr, runErr error)
              	})
          when: ok
      - set: n.stopReason
        value: reason
      - eval: n.stopMu.Unlock()
        to: n.stopMu.Unlock
      - bind: code, _
        eval: errs.CodeOf(err)
        to: errs
      - eval: n.obs.setGauge(mStopped, 1, coreotel.String("reason", reasonOf(code)))
        to: n.obs.setGauge
      - eval: "n.obs.warn(\"consensus: node stopped\", lstr(\"reason\", reasonOf(code)), lstr(\"error\", err.Error()))"
        to: n.obs.warn
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.hard.Store(true)
        to: n.hard.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
  - of: (*Node).reportUnwrittenMarkers
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reportUnwrittenMarkers
        kind: self
      - id: n.obs.warn
        kind: internal
    steps:
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: stop marker not written in the data directory\", lstr(\"error\", dirErr.Error()))"
              to: n.obs.warn
          when: dirErr != nil
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: boot-scoped stop marker not written\", lstr(\"error\", runErr.Error()))"
              to: n.obs.warn
          when: runErr != nil
  - of: (*Node).StopReason
    steps:
      - lock:
          mutex: n.stopMu
      - opt:
          do:
            - return: coreconsensus.StopReasonValue{}, false
          when: n.stopReason == nil
      - return: "*n.stopReason, true"
  - of: (*Node).failAllOnStop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).failAllOnStop
        kind: self
      - id: n.stoppedErr
        kind: internal
      - id: n.dropForward
        kind: internal
      - id: n.queuedProposal
        kind: internal
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: err
        eval: n.stoppedErr()
        to: n.stoppedErr
      - loop:
          do:
            - eval: n.dropForward(ctx)
              to: n.dropForward
            - alt:
                - do:
                    - send:
                        chan: p.done
                        value: "propResult{err: err}"
                  when: p.stage.Load() == stageUnsent
                - do:
                    - send:
                        chan: p.done
                        value: "propResult{err: outcomeUnknown(\"node stopped\")}"
                  else: true
          key: ctx
          range: n.forwards
          value: p
      - loop:
          do:
            - eval: delete(n.reads, ctx)
            - send:
                chan: w.done
                value: "readResult{code: coreconsensus.CodeNodeStopped}"
          key: ctx
          range: n.reads
          value: w
      - loop:
          do:
            - bind: p, ok
              eval: n.queuedProposal()
              to: n.queuedProposal
            - opt:
                do:
                  - break: true
                when: "!ok"
            - send:
                chan: p.done
                value: "propResult{err: err}"
          forever: true
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - eval: delete(n.waiters, idx)
            - send:
                chan: p.done
                value: "propResult{err: outcomeUnknown(\"node stopped\")}"
          key: idx
          range: n.waiters
          value: p
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).stoppedErr
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stoppedErr
        kind: self
      - id: n.StopReason
        kind: internal
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.NodeStopped, errs.String("cause", r.Err.Error()))
              to: origin
          init:
            bind: r, ok
            eval: n.StopReason()
            to: n.StopReason
          when: ok
      - return: origin(coreconsensus.NodeStopped)
        to: origin
  - of: (*Node).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Close
        kind: self
      - id: n.Status
        kind: internal
      - id: n.handOff
        kind: internal
      - id: n.stopped.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
      - id: n.wg.Wait
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.releaseDir
        kind: internal
    steps:
      - opt:
          do:
            - bind: st
              eval: n.Status()
              to: n.Status
            - opt:
                do:
                  - eval: n.handOff(ctx)
                    to: n.handOff
                when: st.Role == coreconsensus.RoleLeader
          when: "!n.stopped.Load()"
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
      - eval: n.wg.Wait()
        to: n.wg.Wait
      - eval: n.am.Lock()
        to: n.am.Lock
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - eval: n.releaseDir()
        to: n.releaseDir
      - return: nil
  - of: (*Node).releaseDir
    participants:
      - id: caller
        kind: actor
      - id: (*Node).releaseDir
        kind: self
      - id: n.releaseOnce.Do
        kind: value
    steps:
      - eval: |-
          n.releaseOnce.Do(func() {
          		if a, ok := n.cfg.Log.(dirHolder); ok {
          			a.release()
          		}
          	})
        to: n.releaseOnce.Do
  - of: (*Node).handOff
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handOff
        kind: self
      - id: n.exec
        kind: internal
      - id: context
        kind: stdlib
      - id: n.transferLocal
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - var:
          name: to
          type: coreconsensus.NodeID
      - var:
          name: best
          type: uint64
      - eval: |-
          n.exec(func() {
          		st := n.r.Status()
          		for _, m := range st.Conf.Members {
          			if !m.Voter || m.ID == n.stamp.ID {
          				continue
          			}
          			if match, _, ok := n.r.Progress(m.ID); ok && (to == 0 || match > best) {
          				to, best = m.ID, match
          			}
          		}
          	})
        to: n.exec
      - opt:
          do:
            - return: ""
          when: to == 0
      - bind: tctx, cancel
        eval: context.WithTimeout(ctx, n.cfg.InitialTiming.ElectionTimeoutMax)
        to: context
      - defer: cancel()
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: leadership hand-off at close did not complete\", lattr(\"to\", uint64(to)), lstr(\"error\", err.Error()))"
              to: n.obs.info
          init:
            bind: err
            eval: n.transferLocal(tctx, to)
            to: n.transferLocal
          when: err != nil
  - of: (*Node).HardClose
    participants:
      - id: caller
        kind: actor
      - id: (*Node).HardClose
        kind: self
      - id: n.hard.Store
        kind: value
      - id: n.stopped.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
      - id: n.clk.NewTimer
        kind: value
      - id: t.Stop
        kind: value
      - id: n.releaseDir
        kind: internal
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - eval: n.hard.Store(true)
        to: n.hard.Store
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
      - bind: done
        eval: make(chan struct{})
      - go: func() { n.wg.Wait(); close(done) }()
      - bind: t
        eval: n.clk.NewTimer(n.cfg.HardCloseTimeout)
        to: n.clk.NewTimer
      - defer: t.Stop()
        to: t.Stop
      - select:
          cases:
            - comm: <-done
              do:
                - eval: n.releaseDir()
                  to: n.releaseDir
            - comm: <-t.C()
      - eval: n.am.Lock()
        to: n.am.Lock
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - return: nil
  - of: (*Node).Status
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Status
        kind: self
      - id: n.status.Load
        kind: value
    steps:
      - opt:
          do:
            - return: "*s"
          init:
            bind: s
            eval: n.status.Load()
            to: n.status.Load
          when: s != nil
      - return: coreconsensus.StatusValue{}
  - of: (*Node).Watch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Watch
        kind: self
      - id: n.watchMu.Lock
        kind: value
      - id: n.watchMu.Unlock
        kind: value
    steps:
      - bind: ch
        eval: make(chan coreconsensus.StatusValue, 1)
      - send:
          chan: ch
          value: n.Status()
      - eval: n.watchMu.Lock()
        to: n.watchMu.Lock
      - set: n.watchers[ch]
        value: struct{}{}
      - eval: n.watchMu.Unlock()
        to: n.watchMu.Unlock
      - go: |-
          func() {
          		select {
          		case <-ctx.Done():
          		case <-n.loopDone:
          		}
          		n.watchMu.Lock()
          		delete(n.watchers, ch)
          		close(ch)
          		n.watchMu.Unlock()
          	}()
      - return: ch
  - of: (*Node).Membership
    steps:
      - var:
          name: m
          type: coreconsensus.MembershipValue
      - opt:
          do:
            - return: coreconsensus.MembershipValue{}
          when: "!n.exec(func() { m = n.r.Status().Conf })"
      - return: m
  - of: (*Node).probeLeader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).probeLeader
        kind: self
      - id: n.nextID
        kind: internal
      - id: n.r.ReadIndex
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: n.lastRole == coreconsensus.RoleLeader || n.lastLead == 0
      - bind: every
        eval: n.r.Status().Timing.ElectionTimeoutMin / 2
      - opt:
          do:
            - return: ""
          when: "!n.contact.probeAt.IsZero() && now.Sub(n.contact.probeAt) < every"
      - bind: ctx
        eval: n.nextID()
        to: n.nextID
      - set: n.contact.probeCtx, n.contact.probeAt
        value: ctx, now
      - eval: n.r.ReadIndex(now, ctx, false)
        to: n.r.ReadIndex
  - of: (*Node).readAnswered
    steps:
      - opt:
          do:
            - set: n.contact.heard, n.contact.from
              value: now, n.lastLead
          when: code == 0 && n.lastRole != coreconsensus.RoleLeader && n.lastLead != 0
      - opt:
          do:
            - set: n.contact.probeCtx
              value: "0"
            - return: "true"
          when: ctx != 0 && ctx == n.contact.probeCtx
      - return: "false"
  - of: (*Node).leaderConfirmed
    steps:
      - switch:
          cases:
            - case: n.lastLead == 0
              do:
                - return: "false"
            - case: n.lastRole == coreconsensus.RoleLeader
              do:
                - return: "true"
      - return: n.contact.from == n.lastLead && now.Sub(n.contact.heard) <= n.r.Status().Timing.ElectionTimeoutMax
  - of: (*Node).watchProgress
    participants:
      - id: caller
        kind: actor
      - id: (*Node).watchProgress
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.mostCaughtUpVoter
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: n.r.TransferLeadership
        kind: value
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - bind: w
        eval: "&n.watch"
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - opt:
          do:
            - set: "*w"
              value: "progressWatch{stable: st.Stable, applied: applied, stableAt: now, appliedAt: now}"
            - return: ""
          when: st.Role != coreconsensus.RoleLeader
      - opt:
          do:
            - set: w.stable, w.stableAt
              value: st.Stable, now
          when: st.Stable != w.stable || st.Stable >= st.Last
      - opt:
          do:
            - set: w.applied, w.appliedAt
              value: applied, now
          when: applied != w.applied || applied >= st.Commit || n.cutExempt(now, st.Timing.ElectionTimeoutMax)
      - bind: limit
        eval: st.Timing.ElectionTimeoutMax
      - bind: stuckSync, stuckApply
        eval: now.Sub(w.stableAt) > limit, now.Sub(w.appliedAt) > limit
      - opt:
          do:
            - return: ""
          when: (!stuckSync && !stuckApply) || st.Transfer != 0
      - bind: to
        eval: n.mostCaughtUpVoter(&st)
        to: n.mostCaughtUpVoter
      - opt:
          do:
            - return: ""
          when: to == 0
      - eval: |-
          n.obs.warn("consensus: the leader makes no progress, handing leadership over",
          		lattr("to", uint64(to)), lattr("stable", st.Stable), lattr("last", st.Last),
          		lattr("applied", applied), lattr("commit", st.Commit))
        to: n.obs.warn
      - eval: n.r.TransferLeadership(now, to)
        to: n.r.TransferLeadership
      - set: w.stableAt, w.appliedAt
        value: now, now
  - of: (*Node).mostCaughtUpVoter
    participants:
      - id: caller
        kind: actor
      - id: (*Node).mostCaughtUpVoter
        kind: self
      - id: n.r.Progress
        kind: value
    steps:
      - var:
          name: to
          type: coreconsensus.NodeID
      - var:
          name: best
          type: uint64
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!m.Voter || m.ID == n.stamp.ID"
            - opt:
                do:
                  - set: to, best
                    value: m.ID, match
                init:
                  bind: match, _, ok
                  eval: n.r.Progress(m.ID)
                  to: n.r.Progress
                when: ok && (to == 0 || match > best)
          key: _
          range: st.Conf.Members
          value: m
      - return: to
  - of: (*Node).cutExempt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).cutExempt
        kind: self
      - id: n.cuttingSince.Load
        kind: value
    steps:
      - bind: since
        eval: n.cuttingSince.Load()
        to: n.cuttingSince.Load
      - return: since != 0 && now.Sub(time.Unix(0, since)) < cutAllowance*etMax
  - of: (*Node).pinAt
    participants:
      - id: caller
        kind: actor
      - id: (*Node).pinAt
        kind: self
      - id: n.r.Progress
        kind: value
    steps:
      - opt:
          do:
            - return: 0, false
          when: n.logTight()
      - opt:
          do:
            - opt:
                do:
                  - return: 0, false
                when: pin.lifted || n.streamDue(to, pin, now)
            - return: pin.index, true
          when: pin.until.IsZero()
      - bind: match, _, ok
        eval: n.r.Progress(to)
        to: n.r.Progress
      - opt:
          do:
            - return: 0, false
          when: "!ok || now.After(pin.until)"
      - return: max(pin.index, match), true
  - of: (*Node).pinBound
    steps:
      - return: time.Duration(pinAfterStream) * n.r.Status().Timing.ElectionTimeoutMax << n.pinScale[to]
  - of: (*Node).streamDue
    participants:
      - id: caller
        kind: actor
      - id: (*Node).streamDue
        kind: self
      - id: n.r.Progress
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          init:
            bind: _, _, ok
            eval: n.r.Progress(to)
            to: n.r.Progress
          when: "!ok"
      - return: pin.moved != nil && now.Sub(time.Unix(0, pin.moved.Load())) > n.pinBound(to)
  - of: (*Node).logTight
    participants:
      - id: caller
        kind: actor
      - id: (*Node).logTight
        kind: self
      - id: sr.logBytes
        kind: internal
    steps:
      - bind: sr, ok
        eval: n.cfg.Log.(spaceReporter)
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: b
        eval: sr.logBytes()
        to: sr.logBytes
      - return: b+2*n.cfg.LogReserveBytes >= n.cfg.MaxLogBytes && 2*b >= n.cfg.MaxLogBytes-n.cfg.LogReserveBytes
  - of: (*Node).growPin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).growPin
        kind: self
      - id: n.r.Progress
        kind: value
      - id: n.obs.info
        kind: internal
    steps:
      - bind: _, heard, ok
        eval: n.r.Progress(to)
        to: n.r.Progress
      - opt:
          do:
            - return: ""
          when: "!ok || n.logTight() || n.pinScale[to] >= pinScaleMax || now.Sub(heard) >= n.r.Status().Timing.ElectionTimeoutMax"
      - op: ++
        set: n.pinScale[to]
      - eval: |-
          n.obs.info("consensus: a snapshot receiver still installing outlasted its pin; the next pin holds longer",
          		lattr("peer", uint64(to)), lstr("bound", n.pinBound(to).String()))
        to: n.obs.info
  - of: (*Node).watchPins
    participants:
      - id: caller
        kind: actor
      - id: (*Node).watchPins
        kind: self
      - id: n.pinAt
        kind: internal
      - id: n.r.Progress
        kind: value
      - id: n.prunePinScale
        kind: internal
      - id: n.aq.push
        kind: internal
    steps:
      - bind: last
        eval: n.r.Status().Last
      - bind: ended
        eval: "false"
      - loop:
          do:
            - bind: _, held
              eval: n.pinAt(to, pin, now)
              to: n.pinAt
            - opt:
                do:
                  - opt:
                      do:
                        - set: ended
                          value: "true"
                      when: "!held && n.releasePin(to, pin, now)"
                  - continue: true
                when: pin.until.IsZero()
            - opt:
                do:
                  - eval: delete(n.sending, to)
                  - set: ended
                    value: "true"
                init:
                  bind: match, _, _
                  eval: n.r.Progress(to)
                  to: n.r.Progress
                when: "!held || match >= last"
          key: to
          range: n.sending
          value: pin
      - eval: n.prunePinScale()
        to: n.prunePinScale
      - opt:
          do:
            - eval: "n.aq.push(applyItem{compact: true})"
              to: n.aq.push
          when: ended
  - of: (*Node).prunePinScale
    participants:
      - id: caller
        kind: actor
      - id: (*Node).prunePinScale
        kind: self
      - id: n.r.Progress
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(n.pinScale, to)
                init:
                  bind: _, _, ok
                  eval: n.r.Progress(to)
                  to: n.r.Progress
                when: "!ok"
          key: to
          range: n.pinScale
  - of: (*Node).releasePin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).releasePin
        kind: self
      - id: n.dropPin
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: "false"
                when: pin.lifted
            - set: pin.lifted
              value: "true"
            - set: n.sending[to]
              value: pin
            - return: "true"
          when: pin.until.IsZero() && !n.streamDue(to, pin, now)
      - eval: n.dropPin(to)
        to: n.dropPin
      - return: "true"
  - of: (*Node).dropPin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).dropPin
        kind: self
      - id: n.growPin
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: stop()
                init:
                  bind: stop, ok
                  eval: n.sendStop[to]
                when: ok
            - eval: n.growPin(to, n.clk.Now())
              to: n.growPin
          when: n.sending[to].until.IsZero()
      - eval: delete(n.sending, to)
  - of: (*sentReader).Read
    participants:
      - id: caller
        kind: actor
      - id: (*sentReader).Read
        kind: self
      - id: s.r.Read
        kind: value
      - id: s.n.clk.Now().UnixNano
        kind: value
      - id: s.moved.Store
        kind: value
      - id: s.sent.CompareAndSwap
        kind: value
    steps:
      - bind: k, err
        eval: s.r.Read(p)
        to: s.r.Read
      - bind: now
        eval: s.n.clk.Now().UnixNano()
        to: s.n.clk.Now().UnixNano
      - eval: s.moved.Store(now)
        to: s.moved.Store
      - opt:
          do:
            - eval: s.sent.CompareAndSwap(0, now)
              to: s.sent.CompareAndSwap
          when: err == io.EOF
      - return: k, err
  - of: newObs
    steps:
      - return: |-
          &obs{
          		meter: cfg.Meter, tracer: cfg.Tracer, log: cfg.Logger,
          		group: coreotel.Int64("group", int64(cfg.Group)),
          		gauge: map[string]coremetrics.Gauge{}, count: map[string]coremetrics.Counter{}, hist: map[string]coremetrics.Histogram{},
          	}
  - of: key
    participants:
      - id: caller
        kind: actor
      - id: key
        kind: self
      - id: k.WriteString
        kind: value
      - id: k.String
        kind: value
    steps:
      - opt:
          do:
            - return: name
          when: len(attrs) == 0
      - var:
          name: k
          type: strings.Builder
      - eval: k.WriteString(name)
        to: k.WriteString
      - loop:
          do:
            - eval: k.WriteString("|")
              to: k.WriteString
            - eval: k.WriteString(a.Key)
              to: k.WriteString
            - eval: k.WriteString("=")
              to: k.WriteString
            - eval: k.WriteString(a.Str())
              to: k.WriteString
          key: _
          range: attrs
          value: a
      - return: k.String()
        to: k.String
  - of: (*obs).setGauge
    participants:
      - id: caller
        kind: actor
      - id: (*obs).setGauge
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Gauge
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: g.Set
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: g, ok
        eval: o.gauge[k]
      - opt:
          do:
            - set: g
              to: o.meter.Gauge
              value: o.meter.Gauge(name, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.gauge[k]
              value: g
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: g.Set(v)
        to: g.Set
  - of: (*obs).inc
    participants:
      - id: caller
        kind: actor
      - id: (*obs).inc
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Counter
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: c.Inc
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: c, ok
        eval: o.count[k]
      - opt:
          do:
            - set: c
              to: o.meter.Counter
              value: o.meter.Counter(name, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.count[k]
              value: c
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: c.Inc()
        to: c.Inc
  - of: (*obs).addTo
    participants:
      - id: caller
        kind: actor
      - id: (*obs).addTo
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Counter
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: c.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil || total <= *seen
      - bind: k
        eval: key(name, nil)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: c, ok
        eval: o.count[k]
      - opt:
          do:
            - set: c
              to: o.meter.Counter
              value: o.meter.Counter(name, o.group)
            - set: o.count[k]
              value: c
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: c.Add(total - *seen)
        to: c.Add
      - set: "*seen"
        value: total
  - of: (*obs).record
    participants:
      - id: caller
        kind: actor
      - id: (*obs).record
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Histogram
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: h.Record
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: h, ok
        eval: o.hist[k]
      - opt:
          do:
            - bind: buckets
              eval: latencyBuckets
            - opt:
                do:
                  - set: buckets
                    value: "[]float64{1, 4, 16, 64, 256, 1024, 4096, 16384, 65536, 1 << 20, 16 << 20, 256 << 20}"
                when: name == mBatchEntries || name == mBatchBytes || name == mSnapshotBytes
            - set: h
              to: o.meter.Histogram
              value: o.meter.Histogram(name, buckets, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.hist[k]
              value: h
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: h.Record(v)
        to: h.Record
  - of: (*obs).info
    participants:
      - id: caller
        kind: actor
      - id: (*obs).info
        kind: self
      - id: o.log.Log
        kind: value
    steps:
      - opt:
          do:
            - eval: o.log.Log(context.Background(), level.Info, msg, attrs...)
              to: o.log.Log
          when: o.log != nil && o.log.Enabled(context.Background(), level.Info)
  - of: (*obs).warn
    participants:
      - id: caller
        kind: actor
      - id: (*obs).warn
        kind: self
