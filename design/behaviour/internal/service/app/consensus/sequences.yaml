              - return: nil
  - of: (*TCPTransport).accept
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).accept
        kind: self
      - id: t.wg.Done
        kind: value
      - id: time
        kind: stdlib
      - id: wait.Stop
        kind: value
      - id: t.ln.Accept
        kind: value
      - id: t.acceptFailed
        kind: internal
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: abandon
        kind: internal
      - id: t.admission.Admit
        kind: value
      - id: t.wg.Add
        kind: value
      - id: t.serve
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
      - var:
          name: delay
          type: time.Duration
      - bind: wait
        eval: time.NewTimer(acceptBackoffFirst)
        to: time
      - eval: wait.Stop()
        to: wait.Stop
      - defer: wait.Stop()
        to: wait.Stop
      - loop:
          do:
            - bind: c, err
              eval: t.ln.Accept()
              to: t.ln.Accept
