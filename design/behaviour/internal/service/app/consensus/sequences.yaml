          when: "!match"
      - opt:
          do:
            - return: first, last, nil
          when: match && snapIdx <= last
      - opt:
          do:
            - return: first, last, storageFailed("compact", err)
          init:
            bind: err
            eval: compactLog(n.cfg.Log, snapIdx, base.Position.Term)
            to: compactLog
          when: err != nil
      - opt:
          do:
            - return: first, last, storageFailed("sync", err)
          init:
            bind: err
            eval: n.cfg.Log.Sync()
            to: n.cfg.Log.Sync
          when: err != nil
      - set: newFirst, newLast
        to: n.cfg.Log.Bounds
        value: n.cfg.Log.Bounds()
      - return: newFirst, newLast, nil
  - of: (*Node).readTail
    participants:
      - id: caller
        kind: actor
      - id: (*Node).readTail
        kind: self
      - id: n.cfg.Log.Entries
        kind: value
      - id: bytes
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nil
          when: last <= snapIdx || last < first
      - bind: ents, err
        eval: n.cfg.Log.Entries(max(first, snapIdx+1), last+1, int(^uint(0)>>1), nil)
        to: n.cfg.Log.Entries
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - loop:
          do:
            - set: ents[i].Data
              to: bytes
              value: bytes.Clone(ents[i].Data)
          key: i
          range: ents
      - return: ents, nil
  - of: (*Node).startApplied
    steps:
      - bind: snapIdx
        eval: base.Position.Index
      - bind: applied
        eval: max(snapIdx, durIdx)
      - set: n.applied
        value: applied
      - opt:
          do:
            - set: n.appliedTerm
              value: base.Position.Term
          when: applied == snapIdx
      - opt:
          do:
            - set: n.applied, n.appliedTerm
              value: 0, 0
          when: n.noTable && durIdx < snapIdx
      - return: applied
  - of: noTableBase
    participants:
      - id: caller
        kind: actor
      - id: noTableBase
        kind: self
      - id: log.Term
        kind: value
      - id: baseTerm
        kind: internal
    steps:
      - var:
          name: b
          type: coreconsensus.SnapshotMetaValue
      - bind: matched
        eval: "false"
      - opt:
          do:
            - set: b
              value: metas[0]
            - loop:
                do:
                  - opt:
                      do:
                        - set: b, matched
                          value: m, true
                      when: m.Position.Index == first-1
                key: _
                range: metas
                value: m
          when: len(metas) > 0
      - set: b.Position.Index
        value: first - 1
      - bind: term, err
        eval: log.Term(first - 1)
        to: log.Term
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: b.Position.Term, err
            eval: baseTerm(term, b.Position.Term, matched, first)
            op: =
            to: baseTerm
          when: err != nil
      - return: b, nil
  - of: baseTerm
    steps:
      - bind: term
        eval: logTerm
      - opt:
          do:
            - opt:
                do:
                  - return: 0, errImpossible
                when: logTerm != 0 && logTerm != metaTerm
            - set: term
              value: metaTerm
          when: matched
      - opt:
          do:
            - return: 0, errUnknownBaseTerm
          when: term == 0 && first > 1
      - return: term, nil
  - of: (*Node).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*Node).deliver
        kind: self
      - id: wire
        kind: package
      - id: n.droppedFrom.Add
        kind: value
      - id: n.obs.inc
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.stopped.Load()
      - var:
          name: m
          type: coreconsensus.MessageValue
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: wire.ParseMessage(bytes.Clone(frame), &m)
            to: wire
          when: err != nil
      - opt:
          do:
            - eval: n.droppedFrom.Add(1)
              to: n.droppedFrom.Add
            - eval: n.obs.inc(mFramesDropped, coreotel.String("reason", "from_mismatch"))
              to: n.obs.inc
            - return: ""
          when: m.From != from.ID
      - bind: q
        eval: n.inData
      - opt:
          do:
            - set: q
              value: n.inCtrl
          when: m.Kind.Lane() == coreconsensus.LaneControl
      - select:
          cases:
            - comm: q <- m
            - default: true
  - of: (*Node).exec
    steps:
      - bind: done
        eval: make(chan struct{})
      - select:
          cases:
            - comm: n.execc <- func() { f(); close(done) }
            - comm: <-n.stopc
              do:
                - return: "false"
      - select:
          cases:
            - comm: <-done
              do:
                - return: "true"
            - comm: <-n.loopDone
              do:
                - return: "false"
  - of: (*Node).loop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).loop
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.loopDoneOnce.Do
        kind: value
      - id: n.tickInterval
        kind: internal
      - id: n.tickEvery.Store
        kind: value
      - id: n.clk.NewTicker
        kind: value
      - id: tick.Stop
        kind: value
      - id: n.turn
        kind: internal
      - id: n.failAllOnStop
        kind: internal
      - id: n.drainControl
        kind: internal
      - id: n.handleReady
        kind: internal
      - id: n.checkTurn
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - defer: n.loopDoneOnce.Do(func() { close(n.loopDone) })
        to: n.loopDoneOnce.Do
      - bind: every
        eval: n.tickInterval()
        to: n.tickInterval
      - eval: n.tickEvery.Store(int64(every))
        to: n.tickEvery.Store
      - bind: tick
        eval: n.clk.NewTicker(every)
        to: n.clk.NewTicker
      - defer: tick.Stop()
        to: tick.Stop
      - var:
          name: props
          type: "[]*proposal"
      - loop:
          do:
            - bind: turn, open
              eval: n.turn(tick, &props)
              to: n.turn
            - opt:
                do:
                  - eval: n.failAllOnStop()
                    to: n.failAllOnStop
                  - return: ""
                when: "!open"
            - eval: n.drainControl()
              to: n.drainControl
            - eval: n.handleReady()
              to: n.handleReady
            - eval: n.checkTurn(turn)
              to: n.checkTurn
          forever: true
  - of: (*Node).turn
    participants:
      - id: caller
        kind: actor
      - id: (*Node).turn
        kind: self
      - id: n.onTick
        kind: internal
      - id: n.onMessage
        kind: internal
      - id: n.onStored
        kind: internal
      - id: n.onProposal
        kind: internal
      - id: n.onExec
        kind: internal
      - id: n.onFetched
        kind: internal
    steps:
      - select:
          cases:
            - comm: <-n.stopc
              do:
                - return: time.Time{}, false
            - comm: _, ok := <-tick.C()
              do:
                - return: n.onTick(tick, ok)
                  to: n.onTick
            - comm: m, ok := <-n.inCtrl
              do:
                - return: n.onMessage(&m, ok)
                  to: n.onMessage
            - comm: m, ok := <-n.inData
              do:
                - return: n.onMessage(&m, ok)
                  to: n.onMessage
            - comm: d, ok := <-n.storec
              do:
                - return: n.onStored(&d, ok)
                  to: n.onStored
            - comm: p, ok := <-n.propc
              do:
                - return: n.onProposal(p, ok, props)
                  to: n.onProposal
            - comm: f, ok := <-n.execc
              do:
                - return: n.onExec(f, ok)
                  to: n.onExec
            - comm: f, ok := <-n.fetchc
              do:
                - return: n.onFetched(&f, ok)
                  to: n.onFetched
  - of: (*Node).onTick
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onTick
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.Tick
        kind: value
      - id: n.tickInterval
        kind: internal
      - id: n.tickEvery.Store
        kind: value
      - id: tick.Reset
        kind: value
      - id: n.sweep
        kind: internal
      - id: n.observePeers
        kind: internal
      - id: n.observeResources
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.Tick(n.clk.Now())
        to: n.r.Tick
      - opt:
          do:
            - eval: n.tickEvery.Store(int64(d))
              to: n.tickEvery.Store
            - eval: tick.Reset(d)
              to: tick.Reset
          init:
            bind: d
            eval: n.tickInterval()
            to: n.tickInterval
          when: d != time.Duration(n.tickEvery.Load())
      - eval: n.sweep()
        to: n.sweep
      - eval: n.observePeers()
        to: n.observePeers
      - eval: n.observeResources()
        to: n.observeResources
      - return: turn, true
  - of: (*Node).onMessage
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onMessage
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.SetOverloaded
        kind: value
      - id: n.r.Step
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.SetOverloaded(n.applyLag.Load() >= n.cfg.MaxApplyLagBytes)
        to: n.r.SetOverloaded
      - eval: n.r.Step(n.clk.Now(), *m)
        to: n.r.Step
      - return: turn, true
  - of: (*Node).onStored
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onStored
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.storageDone
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.storageDone(d)
        to: n.storageDone
      - return: turn, true
  - of: (*Node).onProposal
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onProposal
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.batchProposals
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.batchProposals(p, props)
        to: n.batchProposals
      - return: turn, true
  - of: (*Node).onExec
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onExec
        kind: self
      - id: n.clk.Now
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: f()
      - return: turn, true
  - of: (*Node).onFetched
    participants:
      - id: caller
        kind: actor
      - id: (*Node).onFetched
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.r.Fetched
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, false
          when: "!ok"
      - bind: turn
        eval: n.clk.Now()
        to: n.clk.Now
      - eval: n.r.Fetched(f.req.To, f.req.Lo, f.ents, f.compacted)
        to: n.r.Fetched
      - return: turn, true
  - of: (*Node).storageDone
    participants:
      - id: caller
        kind: actor
      - id: (*Node).storageDone
        kind: self
      - id: n.r.StorageDone
        kind: value
      - id: n.cfg.Transport.Send
        kind: value
    steps:
      - eval: n.r.StorageDone(d.seq, d.index, d.term)
        to: n.r.StorageDone
      - loop:
          do:
            - eval: n.cfg.Transport.Send(d.to[i], f)
              to: n.cfg.Transport.Send
          key: i
          range: d.after
          value: f
  - of: (*Node).batchProposals
    participants:
      - id: caller
        kind: actor
      - id: (*Node).batchProposals
        kind: self
      - id: n.queuedProposal
        kind: internal
      - id: n.handleProposals
        kind: internal
    steps:
      - bind: batch
        eval: append((*props)[:0], first)
      - loop:
          cond: len(batch) < maxBatchedProposals
          do:
            - bind: p, ok
              eval: n.queuedProposal()
              to: n.queuedProposal
            - opt:
                do:
                  - break: true
                when: "!ok"
            - set: batch
              value: append(batch, p)
      - set: "*props"
        value: batch
      - eval: n.handleProposals(batch)
        to: n.handleProposals
  - of: (*Node).queuedProposal
    steps:
      - select:
          cases:
            - comm: p, ok := <-n.propc
              do:
                - return: p, ok
            - default: true
              do:
                - return: nil, false
  - of: (*Node).drainControl
    participants:
      - id: caller
        kind: actor
      - id: (*Node).drainControl
        kind: self
      - id: n.queuedControl
        kind: internal
      - id: n.r.Step
        kind: value
    steps:
      - loop:
          do:
            - bind: m, ok
              eval: n.queuedControl()
              to: n.queuedControl
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: n.r.Step(n.clk.Now(), m)
              to: n.r.Step
          range: maxCtrlPerTurn
  - of: (*Node).queuedControl
    steps:
      - select:
          cases:
            - comm: m, ok := <-n.inCtrl
              do:
                - return: m, ok
            - default: true
              do:
                - return: coreconsensus.MessageValue{}, false
  - of: (*Node).checkTurn
    participants:
      - id: caller
        kind: actor
      - id: (*Node).checkTurn
        kind: self
      - id: n.clk.Since
        kind: value
      - id: n.obs.record
        kind: internal
      - id: time
        kind: stdlib
      - id: n.longTurns.Add
        kind: value
      - id: n.r.DropLease
        kind: value
    steps:
      - bind: d
        eval: n.clk.Since(turn)
        to: n.clk.Since
      - eval: n.obs.record(mLoopTurn, d.Seconds())
        to: n.obs.record
      - opt:
          do:
            - return: ""
          when: n.cfg.Reads != ReadLease
      - bind: t
        eval: n.r.Status().Timing
      - bind: budget
        eval: time.Duration(float64(t.ElectionTimeoutMin) * t.MaxClockDrift)
        to: time
      - opt:
          do:
            - eval: n.longTurns.Add(1)
              to: n.longTurns.Add
            - eval: n.r.DropLease()
              to: n.r.DropLease
          when: budget > 0 && d > budget
  - of: (*Node).sweep
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sweep
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.dropForward
        kind: internal
      - id: n.sweepWaiters
        kind: internal
    steps:
      - bind: grace
        eval: 2 * n.r.Status().Timing.ElectionTimeoutMax
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - loop:
          do:
            - opt:
                do:
                  - eval: n.dropForward(ctx)
                    to: n.dropForward
                  - send:
                      chan: p.done
                      value: "propResult{err: outcomeUnknown(\"leader changed before the answer\")}"
                when: "!p.changedAt.IsZero() && now.Sub(p.changedAt) > grace"
          key: ctx
          range: n.forwards
          value: p
      - eval: n.sweepWaiters(now, grace)
        to: n.sweepWaiters
  - of: (*Node).sweepWaiters
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sweepWaiters
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.pendingBytes.Add
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: commit
        eval: n.r.Status().Commit
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(n.waiters, idx)
                  - opt:
                      do:
                        - eval: n.pendingBytes.Add(-int64(len(p.entry.Data)))
                          to: n.pendingBytes.Add
                      when: p.local
                  - send:
                      chan: p.done
                      value: "propResult{err: outcomeUnknown(\"leadership changed before commit\")}"
                when: idx > commit && !p.changedAt.IsZero() && now.Sub(p.changedAt) > grace
          key: idx
          range: n.waiters
          value: p
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).dropForward
    participants:
      - id: caller
        kind: actor
      - id: (*Node).dropForward
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - eval: delete(n.forwards, ctx)
      - eval: n.am.Lock()
        to: n.am.Lock
      - op: "--"
        set: n.keepResults
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).tickInterval
    steps:
      - return: max(n.r.Status().Timing.HeartbeatInterval/5, time.Millisecond)
  - of: (*Node).handleReady
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleReady
        kind: self
      - id: n.handleOne
        kind: internal
      - id: n.leadershipChanged
        kind: internal
      - id: n.publish
        kind: internal
    steps:
      - loop:
          cond: n.r.HasReady()
          do:
            - bind: rd
              eval: new(n.r.Ready())
            - opt:
                do:
                  - return: ""
                when: n.stopOnUnsupported(rd)
            - eval: n.handleOne(rd)
              to: n.handleOne
      - eval: n.leadershipChanged()
        to: n.leadershipChanged
      - eval: n.publish()
        to: n.publish
  - of: (*Node).stopOnUnsupported
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stopOnUnsupported
        kind: self
      - id: n.stop
        kind: internal
    steps:
      - bind: u
        eval: rd.Unsupported
      - opt:
          do:
            - return: "false"
          when: u.Index == 0
      - eval: n.stop(unsupportedKind(u.Kind, u.Index), false)
        to: n.stop
      - return: "true"
  - of: (*Node).handleOne
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleOne
        kind: self
      - id: n.cfg.Transport.Send
        kind: value
      - id: n.cfg.Transport.SetMembership
        kind: value
      - id: n.obs.info
        kind: internal
      - id: n.reportNotices
        kind: internal
      - id: n.r.TermAt
        kind: value
      - id: n.sq.push
        kind: internal
      - id: n.queueApply
        kind: internal
      - id: n.fetchq.push
        kind: internal
      - id: n.sendSnapshot
        kind: internal
      - id: n.answerReady
        kind: internal
      - id: n.checkAdmission
        kind: internal
    steps:
      - loop:
          do:
            - eval: n.cfg.Transport.Send(m.To, wire.AppendMessage(nil, &m))
              to: n.cfg.Transport.Send
          key: _
          range: rd.Messages
          value: m
      - opt:
          do:
            - eval: n.cfg.Transport.SetMembership(n.cfg.Group, rd.Membership)
              to: n.cfg.Transport.SetMembership
            - eval: "n.obs.info(\"consensus: admitted members changed\", lattr(\"members\", uint64(len(rd.Membership))))"
              to: n.obs.info
          when: len(rd.Membership) > 0
      - eval: n.reportNotices(rd)
        to: n.reportNotices
      - opt:
          do:
            - bind: q
              eval: "storeReq{rd: *rd}"
            - opt:
                do:
                  - set: q.compactTerm, _
                    to: n.r.TermAt
                    value: n.r.TermAt(rd.Compact)
                when: rd.Compact != 0
            - eval: n.sq.push(q)
              to: n.sq.push
          when: rd.NeedsWrite()
      - eval: n.queueApply(rd.Apply)
        to: n.queueApply
      - loop:
          do:
            - eval: n.fetchq.push(f)
              to: n.fetchq.push
          key: _
          range: rd.Fetch
          value: f
      - loop:
          do:
            - eval: n.sendSnapshot(to)
              to: n.sendSnapshot
          key: _
          range: rd.SendSnapshot
          value: to
      - eval: n.answerReady(rd)
        to: n.answerReady
      - eval: n.checkAdmission()
        to: n.checkAdmission
  - of: (*Node).reportNotices
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reportNotices
        kind: self
      - id: n.endSilence
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - opt:
          do:
            - eval: n.endSilence()
              to: n.endSilence
          when: rd.SilenceEnded
      - loop:
          do:
            - eval: n.obs.inc(mChainRefusals, coreotel.String("leader", lead.String()))
              to: n.obs.inc
          key: _
          range: rd.ChainRefusedBy
          value: lead
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: log truncated\", lattr(\"from\", rd.TruncateFrom))"
              to: n.obs.info
          when: rd.TruncateFrom != 0
  - of: (*Node).endSilence
    participants:
      - id: caller
        kind: actor
      - id: (*Node).endSilence
        kind: self
      - id: s.endSilence
        kind: internal
      - id: n.stop
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("end silence", err), true)
                    to: n.stop
                init:
                  bind: err
                  eval: s.endSilence()
                  to: s.endSilence
                when: err != nil
          init:
            bind: s, ok
            eval: n.cfg.Log.(interface{ endSilence() error })
          when: ok
      - eval: "n.obs.info(\"consensus: silence condition met, the node votes and acknowledges again\")"
        to: n.obs.info
  - of: (*Node).queueApply
    participants:
      - id: caller
        kind: actor
      - id: (*Node).queueApply
        kind: self
      - id: n.obs.setGauge
        kind: internal
      - id: n.aq.push
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(entries) == 0
      - var:
          name: b
          type: int64
      - loop:
          do:
            - op: +=
              set: b
              value: int64(len(entries[i].Data))
          key: i
          range: entries
      - eval: n.obs.setGauge(mApplyLagBytes, float64(n.applyLag.Add(b)))
        to: n.obs.setGauge
      - eval: "n.aq.push(applyItem{entries: entries})"
        to: n.aq.push
  - of: (*Node).answerReady
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerReady
        kind: self
      - id: n.forwardAnswered
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(n.reads, rs.Context)
                  - send:
                      chan: w.done
                      value: "readResult{index: rs.Index, code: rs.Code}"
                init:
                  bind: w, ok
                  eval: n.reads[rs.Context]
                when: ok
          key: _
          range: rd.ReadStates
          value: rs
      - loop:
          do:
            - eval: n.forwardAnswered(m)
              to: n.forwardAnswered
          key: _
          range: rd.Forwarded
          value: m
      - loop:
          do:
            - loop:
                do:
                  - send:
                      chan: w
                      value: t.Code
                key: _
                range: n.transfers
                value: w
            - set: n.transfers
              value: nil
          key: _
          range: rd.Transfers
          value: t
  - of: (*Node).checkAdmission
    participants:
      - id: caller
        kind: actor
      - id: (*Node).checkAdmission
        kind: self
      - id: n.r.Status
        kind: value
      - id: st.Committed.Member
        kind: value
      - id: n.cfg.Log.WriteStamp
        kind: value
      - id: n.stop
        kind: internal
      - id: n.r.SetCanVote
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: n.canVote
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - bind: s
              eval: n.stamp
            - set: s.State
              value: coreconsensus.StampMember
            - opt:
                do:
                  - eval: n.stop(storageFailed("stamp", err), false)
                    to: n.stop
                  - return: ""
                init:
                  bind: err
                  eval: n.cfg.Log.WriteStamp(s)
                  to: n.cfg.Log.WriteStamp
                when: err != nil
            - set: n.stamp
              value: s
            - set: n.canVote
              value: "true"
            - eval: n.r.SetCanVote(true)
              to: n.r.SetCanVote
          init:
            bind: m, ok
            eval: st.Committed.Member(n.stamp.ID)
            to: st.Committed.Member
          when: ok && m.Incarnation == n.stamp.Incarnation
  - of: (*Node).leadershipChanged
    participants:
      - id: caller
        kind: actor
      - id: (*Node).leadershipChanged
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.startGrace
        kind: internal
      - id: n.preferLeader
        kind: internal
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - opt:
          do:
            - return: ""
          when: st.Term == n.lastTerm && st.Lead == n.lastLead && st.Role == n.lastRole
      - set: n.lastTerm, n.lastLead, n.lastRole
        value: st.Term, st.Lead, st.Role
      - eval: n.startGrace(st.Commit)
        to: n.startGrace
      - loop:
          do:
            - eval: delete(n.reads, ctx)
            - send:
                chan: w.done
                value: "readResult{code: coreconsensus.CodeNotLeader}"
          key: ctx
          range: n.reads
          value: w
      - opt:
          do:
            - eval: n.preferLeader(st)
              to: n.preferLeader
          when: st.Role == coreconsensus.RoleLeader && len(n.cfg.PreferredLeaders) > 0
  - of: (*Node).startGrace
    participants:
      - id: caller
        kind: actor
      - id: (*Node).startGrace
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - loop:
          do:
            - opt:
                do:
                  - set: p.changedAt
                    value: now
                when: p.changedAt.IsZero()
          key: _
          range: n.forwards
          value: p
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - opt:
                do:
                  - set: p.changedAt
                    value: now
                when: idx > commit && p.changedAt.IsZero()
          key: idx
          range: n.waiters
          value: p
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).preferLeader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).preferLeader
        kind: self
      - id: st.Conf.Member
        kind: value
      - id: n.r.Progress
        kind: value
      - id: n.r.TransferLeadership
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: slices.Contains(n.cfg.PreferredLeaders, n.stamp.ID)
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - eval: n.r.TransferLeadership(n.clk.Now(), id)
                          to: n.r.TransferLeadership
                        - return: ""
                      init:
                        bind: match, _, ok
                        eval: n.r.Progress(id)
                        to: n.r.Progress
                      when: ok && match >= st.Commit
                init:
                  bind: m, ok
                  eval: st.Conf.Member(id)
                  to: st.Conf.Member
                when: ok && m.Voter
          key: _
          range: n.cfg.PreferredLeaders
          value: id
  - of: (*Node).publish
    participants:
      - id: caller
        kind: actor
      - id: (*Node).publish
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.status.Load
        kind: value
      - id: n.status.Store
        kind: value
      - id: n.observeStatus
        kind: internal
      - id: n.watchMu.Lock
        kind: value
      - id: n.watchMu.Unlock
        kind: value
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: s
        eval: |-
          &coreconsensus.StatusValue{
          		ID: n.stamp.ID, Role: st.Role, Term: st.Term, Leader: st.Lead, Commit: st.Commit, Applied: applied,
          		Log: n.lineage(), Timing: st.Timing, NoSpace: st.NoSpace,
          		Versions: coreconsensus.VersionsValue{ProtocolMin: 1, ProtocolMax: raft.ProtocolMax, Cluster: st.Cluster, ClusterGeneration: st.ClusterG},
          	}
      - bind: old
        eval: n.status.Load()
        to: n.status.Load
      - opt:
          do:
            - return: ""
          when: old != nil && *old == *s
      - eval: n.status.Store(s)
        to: n.status.Store
      - eval: n.observeStatus(old, s)
        to: n.observeStatus
      - eval: n.watchMu.Lock()
        to: n.watchMu.Lock
      - loop:
          do:
            - select:
                cases:
                  - comm: <-ch
                  - default: true
            - select:
                cases:
                  - comm: ch <- *s
                  - default: true
          key: ch
          range: n.watchers
      - eval: n.watchMu.Unlock()
        to: n.watchMu.Unlock
  - of: (*Node).reader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reader
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.fetchq.take
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - var:
          name: reqs
          type: "[]raft.FetchSpec"
      - loop:
          do:
            - select:
                cases:
                  - comm: _, ok := <-n.fetchq.signal
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!ok"
                  - comm: <-n.stopc
                    do:
                      - return: ""
            - set: reqs
              to: n.fetchq.take
              value: n.fetchq.take(reqs)
            - loop:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: "!n.fetch(f)"
                key: _
                range: reqs
                value: f
          forever: true
  - of: (*Node).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).fetch
        kind: self
      - id: n.cfg.Log.Entries
        kind: value
      - id: n.stop
        kind: internal
      - id: bytes
        kind: stdlib
    steps:
      - bind: d
        eval: "fetchDone{req: f}"
      - bind: ents, err
        eval: n.cfg.Log.Entries(f.Lo, f.Hi, n.cfg.MaxBatchBytes, nil)
        to: n.cfg.Log.Entries
      - switch:
          cases:
            - case: errs.HasCode(err, coreconsensus.CodeCompacted)
              do:
                - set: d.compacted
                  value: "true"
            - case: err != nil
              do:
                - eval: n.stop(err, true)
                  to: n.stop
                - return: "false"
      - loop:
          do:
            - set: ents[i].Data
              to: bytes
              value: bytes.Clone(ents[i].Data)
          key: i
          range: ents
      - set: d.ents
        value: ents
      - select:
          cases:
            - comm: n.fetchc <- d
              do:
                - return: "true"
            - comm: <-n.stopc
              do:
                - return: "false"
  - of: (*Node).storageActor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).storageActor
        kind: self
      - id: n.wg.Done
        kind: value
      - id: n.finalWrites
        kind: internal
      - id: n.sq.take
        kind: internal
    steps:
      - defer: n.wg.Done()
        to: n.wg.Done
      - var:
          name: reqs
          type: "[]storeReq"
      - var:
          name: synced
          type: uint64
      - loop:
          do:
            - select:
                cases:
                  - comm: _, ok := <-n.sq.signal
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!ok"
                  - comm: <-n.stopc
                    do:
                      - eval: n.finalWrites(reqs, &synced)
                        to: n.finalWrites
                      - return: ""
            - set: reqs
              to: n.sq.take
              value: n.sq.take(reqs)
            - opt:
                do:
                  - return: ""
                when: "!n.writeAll(reqs, &synced)"
          forever: true
  - of: (*Node).write
    participants:
      - id: caller
        kind: actor
      - id: (*Node).write
        kind: self
      - id: compactLog
        kind: internal
      - id: n.stop
        kind: internal
      - id: n.completeWrite
        kind: internal
    steps:
      - bind: rd
        eval: "&q.rd"
      - opt:
          do:
            - return: "false"
          when: "!n.truncateFor(rd, synced)"
      - bind: last
        eval: "*synced"
      - opt:
          do:
            - set: last
              value: rd.Entries[k-1].Position.Index
          init:
            bind: k
            eval: len(rd.Entries)
          when: k > 0
      - opt:
          do:
            - return: "false"
          when: "!n.appendFor(rd, last)"
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("compact", err), true)
                    to: n.stop
                  - return: "false"
                init:
                  bind: err
                  eval: compactLog(n.cfg.Log, rd.Compact, q.compactTerm)
                  to: compactLog
                when: err != nil
          when: rd.Compact != 0
      - opt:
          do:
            - return: "false"
          when: "!n.syncFor(rd)"
      - set: "*synced"
        value: max(*synced, last)
      - return: n.completeWrite(rd)
        to: n.completeWrite
  - of: (*Node).truncateFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).truncateFor
        kind: self
      - id: n.cfg.Log.TruncateSuffix
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: rd.TruncateFrom == 0
      - opt:
          do:
            - eval: n.stop(storageFailed("truncate", err), true)
              to: n.stop
            - return: "false"
          init:
            bind: err
            eval: n.cfg.Log.TruncateSuffix(rd.TruncateFrom)
            to: n.cfg.Log.TruncateSuffix
          when: err != nil
      - set: "*synced"
        value: min(*synced, rd.TruncateFrom-1)
      - return: "true"
  - of: (*Node).appendFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appendFor
        kind: self
      - id: n.hardStateFor
        kind: internal
      - id: n.cfg.Log.Append
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - bind: hs, ok
        eval: n.hardStateFor(rd, last)
        to: n.hardStateFor
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(storageFailed("append", err), true)
                    to: n.stop
                  - return: "false"
                init:
                  bind: err
                  eval: n.cfg.Log.Append(rd.Entries, hs)
                  to: n.cfg.Log.Append
                when: err != nil
          when: len(rd.Entries) > 0 || hs != nil
      - return: "true"
  - of: (*Node).hardStateFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).hardStateFor
        kind: self
      - id: n.cfg.Log.HardState
        kind: value
      - id: n.stop
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, true
          when: rd.HardState == nil && rd.Commit == 0
      - bind: h, err
        eval: n.cfg.Log.HardState()
        to: n.cfg.Log.HardState
      - opt:
          do:
            - eval: n.stop(storageFailed("hard state", err), true)
              to: n.stop
            - return: nil, false
          when: err != nil
      - opt:
          do:
            - set: h.Term, h.Vote
              value: rd.HardState.Term, rd.HardState.Vote
          when: rd.HardState != nil
      - opt:
          do:
            - set: h.Commit
              value: max(h.Commit, min(rd.Commit, last))
          when: rd.Commit != 0
      - return: "&h, true"
  - of: (*Node).syncFor
    participants:
      - id: caller
        kind: actor
      - id: (*Node).syncFor
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.cfg.Log.Sync
        kind: value
      - id: n.obs.record
        kind: internal
      - id: n.stop
        kind: internal
    steps:
      - bind: syncStart
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: err
        eval: n.cfg.Log.Sync()
        to: n.cfg.Log.Sync
      - eval: n.obs.record(mFsyncLatency, n.clk.Since(syncStart).Seconds())
        to: n.obs.record
      - opt:
          do:
            - bind: size
              eval: "0"
            - loop:
                do:
                  - op: +=
                    set: size
                    value: len(rd.Entries[i].Data)
                key: i
                range: rd.Entries
            - eval: n.obs.record(mBatchEntries, float64(len(rd.Entries)))
              to: n.obs.record
            - eval: n.obs.record(mBatchBytes, float64(size))
              to: n.obs.record
          when: len(rd.Entries) > 0
      - opt:
          do:
            - eval: n.stop(storageFailed("sync", err), true)
              to: n.stop
            - return: "false"
          when: err != nil
      - return: "true"
  - of: (*Node).completeWrite
    steps:
      - bind: d
        eval: "storeDone{seq: rd.Seq}"
      - opt:
          do:
            - set: d.index, d.term
              value: rd.Entries[k-1].Position.Index, rd.Entries[k-1].Position.Term
          init:
            bind: k
            eval: len(rd.Entries)
          when: k > 0
      - loop:
          do:
            - set: d.after
              value: append(d.after, wire.AppendMessage(nil, &m))
            - set: d.to
              value: append(d.to, m.To)
          key: _
          range: rd.AfterSync
          value: m
      - select:
          cases:
            - comm: n.storec <- d
            - comm: <-n.stopc
              do:
                - return: "false"
      - return: "true"
  - of: (*Node).stop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stop
        kind: self
      - id: n.stopMu.Lock
        kind: value
      - id: n.stopMu.Unlock
        kind: value
      - id: errs
        kind: package
      - id: m.markStopEach
        kind: internal
      - id: n.reportUnwrittenMarkers
        kind: internal
      - id: n.obs.setGauge
        kind: internal
      - id: n.obs.warn
        kind: internal
      - id: n.stopped.Store
        kind: value
      - id: n.hard.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
    steps:
      - eval: n.stopMu.Lock()
        to: n.stopMu.Lock
      - opt:
          do:
            - eval: n.stopMu.Unlock()
              to: n.stopMu.Unlock
            - return: ""
          when: n.stopReason != nil
      - bind: reason
        eval: "&coreconsensus.StopReasonValue{Err: err}"
      - opt:
          do:
            - bind: code, _
              eval: errs.CodeOf(err)
              to: errs
            - bind: dirErr, runErr
              eval: m.markStopEach(code, err.Error())
              to: m.markStopEach
            - opt:
                do:
                  - set: reason.Unmarked
                    value: "true"
                when: dirErr != nil && (runErr != nil || code != coreconsensus.CodeStorageFailed) && storage
            - eval: n.reportUnwrittenMarkers(dirErr, runErr)
              to: n.reportUnwrittenMarkers
          init:
            bind: m, ok
            eval: |-
              n.cfg.Log.(interface {
              		markStopEach(code errs.Code, detail string) (dirErr, runErr error)
              	})
          when: ok
      - set: n.stopReason
        value: reason
      - eval: n.stopMu.Unlock()
        to: n.stopMu.Unlock
      - bind: code, _
        eval: errs.CodeOf(err)
        to: errs
      - eval: n.obs.setGauge(mStopped, 1, coreotel.String("reason", reasonOf(code)))
        to: n.obs.setGauge
      - eval: "n.obs.warn(\"consensus: node stopped\", lstr(\"reason\", reasonOf(code)), lstr(\"error\", err.Error()))"
        to: n.obs.warn
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.hard.Store(true)
        to: n.hard.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
  - of: (*Node).reportUnwrittenMarkers
    participants:
      - id: caller
        kind: actor
      - id: (*Node).reportUnwrittenMarkers
        kind: self
      - id: n.obs.warn
        kind: internal
    steps:
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: stop marker not written in the data directory\", lstr(\"error\", dirErr.Error()))"
              to: n.obs.warn
          when: dirErr != nil
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: boot-scoped stop marker not written\", lstr(\"error\", runErr.Error()))"
              to: n.obs.warn
          when: runErr != nil
  - of: (*Node).StopReason
    steps:
      - lock:
          mutex: n.stopMu
      - opt:
          do:
            - return: coreconsensus.StopReasonValue{}, false
          when: n.stopReason == nil
      - return: "*n.stopReason, true"
  - of: (*Node).failAllOnStop
    participants:
      - id: caller
        kind: actor
      - id: (*Node).failAllOnStop
        kind: self
      - id: n.stoppedErr
        kind: internal
      - id: n.dropForward
        kind: internal
      - id: n.queuedProposal
        kind: internal
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - bind: err
        eval: n.stoppedErr()
        to: n.stoppedErr
      - loop:
          do:
            - eval: n.dropForward(ctx)
              to: n.dropForward
            - alt:
                - do:
                    - send:
                        chan: p.done
                        value: "propResult{err: err}"
                  when: p.stage.Load() == stageUnsent
                - do:
                    - send:
                        chan: p.done
                        value: "propResult{err: outcomeUnknown(\"node stopped\")}"
                  else: true
          key: ctx
          range: n.forwards
          value: p
      - loop:
          do:
            - eval: delete(n.reads, ctx)
            - send:
                chan: w.done
                value: "readResult{code: coreconsensus.CodeNodeStopped}"
          key: ctx
          range: n.reads
          value: w
      - loop:
          do:
            - bind: p, ok
              eval: n.queuedProposal()
              to: n.queuedProposal
            - opt:
                do:
                  - break: true
                when: "!ok"
            - send:
                chan: p.done
                value: "propResult{err: err}"
          forever: true
      - eval: n.am.Lock()
        to: n.am.Lock
      - loop:
          do:
            - eval: delete(n.waiters, idx)
            - send:
                chan: p.done
                value: "propResult{err: outcomeUnknown(\"node stopped\")}"
          key: idx
          range: n.waiters
          value: p
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).stoppedErr
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stoppedErr
        kind: self
      - id: n.StopReason
        kind: internal
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.NodeStopped, errs.String("cause", r.Err.Error()))
              to: origin
          init:
            bind: r, ok
            eval: n.StopReason()
            to: n.StopReason
          when: ok
      - return: origin(coreconsensus.NodeStopped)
        to: origin
  - of: (*Node).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Close
        kind: self
      - id: n.Status
        kind: internal
      - id: n.handOff
        kind: internal
      - id: n.stopped.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
      - id: n.wg.Wait
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.releaseDir
        kind: internal
    steps:
      - opt:
          do:
            - bind: st
              eval: n.Status()
              to: n.Status
            - opt:
                do:
                  - eval: n.handOff(ctx)
                    to: n.handOff
                when: st.Role == coreconsensus.RoleLeader
          when: "!n.stopped.Load()"
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
      - eval: n.wg.Wait()
        to: n.wg.Wait
      - eval: n.am.Lock()
        to: n.am.Lock
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - eval: n.releaseDir()
        to: n.releaseDir
      - return: nil
  - of: (*Node).releaseDir
    participants:
      - id: caller
        kind: actor
      - id: (*Node).releaseDir
        kind: self
      - id: n.releaseOnce.Do
        kind: value
    steps:
      - eval: |-
          n.releaseOnce.Do(func() {
          		if a, ok := n.cfg.Log.(dirHolder); ok {
          			a.release()
          		}
          	})
        to: n.releaseOnce.Do
  - of: (*Node).handOff
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handOff
        kind: self
      - id: n.exec
        kind: internal
      - id: context
        kind: stdlib
      - id: n.transferLocal
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - var:
          name: to
          type: coreconsensus.NodeID
      - var:
          name: best
          type: uint64
      - eval: |-
          n.exec(func() {
          		st := n.r.Status()
          		for _, m := range st.Conf.Members {
          			if !m.Voter || m.ID == n.stamp.ID {
          				continue
          			}
          			if match, _, ok := n.r.Progress(m.ID); ok && (to == 0 || match > best) {
          				to, best = m.ID, match
          			}
          		}
          	})
        to: n.exec
      - opt:
          do:
            - return: ""
          when: to == 0
      - bind: tctx, cancel
        eval: context.WithTimeout(ctx, n.cfg.InitialTiming.ElectionTimeoutMax)
        to: context
      - defer: cancel()
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: leadership hand-off at close did not complete\", lattr(\"to\", uint64(to)), lstr(\"error\", err.Error()))"
              to: n.obs.info
          init:
            bind: err
            eval: n.transferLocal(tctx, to)
            to: n.transferLocal
          when: err != nil
  - of: (*Node).HardClose
    participants:
      - id: caller
        kind: actor
      - id: (*Node).HardClose
        kind: self
      - id: n.hard.Store
        kind: value
      - id: n.stopped.Store
        kind: value
      - id: n.closeOnce.Do
        kind: value
      - id: n.clk.NewTimer
        kind: value
      - id: t.Stop
        kind: value
      - id: n.releaseDir
        kind: internal
      - id: n.am.Lock
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - eval: n.hard.Store(true)
        to: n.hard.Store
      - eval: n.stopped.Store(true)
        to: n.stopped.Store
      - eval: n.closeOnce.Do(func() { close(n.stopc) })
        to: n.closeOnce.Do
      - bind: done
        eval: make(chan struct{})
      - go: func() { n.wg.Wait(); close(done) }()
      - bind: t
        eval: n.clk.NewTimer(n.cfg.HardCloseTimeout)
        to: n.clk.NewTimer
      - defer: t.Stop()
        to: t.Stop
      - select:
          cases:
            - comm: <-done
              do:
                - eval: n.releaseDir()
                  to: n.releaseDir
            - comm: <-t.C()
      - eval: n.am.Lock()
        to: n.am.Lock
      - eval: n.acond.Broadcast()
        to: n.acond.Broadcast
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - return: nil
  - of: (*Node).Status
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Status
        kind: self
      - id: n.status.Load
        kind: value
    steps:
      - opt:
          do:
            - return: "*s"
          init:
            bind: s
            eval: n.status.Load()
            to: n.status.Load
          when: s != nil
      - return: coreconsensus.StatusValue{}
  - of: (*Node).Watch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Watch
        kind: self
      - id: n.watchMu.Lock
        kind: value
      - id: n.watchMu.Unlock
        kind: value
    steps:
      - bind: ch
        eval: make(chan coreconsensus.StatusValue, 1)
      - send:
          chan: ch
          value: n.Status()
      - eval: n.watchMu.Lock()
        to: n.watchMu.Lock
      - set: n.watchers[ch]
        value: struct{}{}
      - eval: n.watchMu.Unlock()
        to: n.watchMu.Unlock
      - go: |-
          func() {
          		select {
          		case <-ctx.Done():
          		case <-n.loopDone:
          		}
          		n.watchMu.Lock()
          		delete(n.watchers, ch)
          		close(ch)
          		n.watchMu.Unlock()
          	}()
      - return: ch
  - of: (*Node).Membership
    steps:
      - var:
          name: m
          type: coreconsensus.MembershipValue
      - opt:
          do:
            - return: coreconsensus.MembershipValue{}
          when: "!n.exec(func() { m = n.r.Status().Conf })"
      - return: m
  - of: newObs
    steps:
      - return: |-
          &obs{
          		meter: cfg.Meter, tracer: cfg.Tracer, log: cfg.Logger,
          		group: coreotel.Int64("group", int64(cfg.Group)),
          		gauge: map[string]coremetrics.Gauge{}, count: map[string]coremetrics.Counter{}, hist: map[string]coremetrics.Histogram{},
          	}
  - of: key
    participants:
      - id: caller
        kind: actor
      - id: key
        kind: self
      - id: k.WriteString
        kind: value
      - id: k.String
        kind: value
    steps:
      - opt:
          do:
            - return: name
          when: len(attrs) == 0
      - var:
          name: k
          type: strings.Builder
      - eval: k.WriteString(name)
        to: k.WriteString
      - loop:
          do:
            - eval: k.WriteString("|")
              to: k.WriteString
            - eval: k.WriteString(a.Key)
              to: k.WriteString
            - eval: k.WriteString("=")
              to: k.WriteString
            - eval: k.WriteString(a.Str())
              to: k.WriteString
          key: _
          range: attrs
          value: a
      - return: k.String()
        to: k.String
  - of: (*obs).setGauge
    participants:
      - id: caller
        kind: actor
      - id: (*obs).setGauge
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Gauge
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: g.Set
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: g, ok
        eval: o.gauge[k]
      - opt:
          do:
            - set: g
              to: o.meter.Gauge
              value: o.meter.Gauge(name, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.gauge[k]
              value: g
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: g.Set(v)
        to: g.Set
  - of: (*obs).inc
    participants:
      - id: caller
        kind: actor
      - id: (*obs).inc
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Counter
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: c.Inc
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: c, ok
        eval: o.count[k]
      - opt:
          do:
            - set: c
              to: o.meter.Counter
              value: o.meter.Counter(name, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.count[k]
              value: c
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: c.Inc()
        to: c.Inc
  - of: (*obs).addTo
    participants:
      - id: caller
        kind: actor
      - id: (*obs).addTo
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Counter
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: c.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil || total <= *seen
      - bind: k
        eval: key(name, nil)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: c, ok
        eval: o.count[k]
      - opt:
          do:
            - set: c
              to: o.meter.Counter
              value: o.meter.Counter(name, o.group)
            - set: o.count[k]
              value: c
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: c.Add(total - *seen)
        to: c.Add
      - set: "*seen"
        value: total
  - of: (*obs).record
    participants:
      - id: caller
        kind: actor
      - id: (*obs).record
        kind: self
      - id: key
        kind: internal
      - id: o.mu.Lock
        kind: value
      - id: o.meter.Histogram
        kind: value
      - id: o.mu.Unlock
        kind: value
      - id: h.Record
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: k
        eval: key(name, attrs)
        to: key
      - eval: o.mu.Lock()
        to: o.mu.Lock
      - bind: h, ok
        eval: o.hist[k]
      - opt:
          do:
            - bind: buckets
              eval: latencyBuckets
            - opt:
                do:
                  - set: buckets
                    value: "[]float64{1, 4, 16, 64, 256, 1024, 4096, 16384, 65536, 1 << 20, 16 << 20, 256 << 20}"
                when: name == mBatchEntries || name == mBatchBytes || name == mSnapshotBytes
            - set: h
              to: o.meter.Histogram
              value: o.meter.Histogram(name, buckets, append([]coreotel.AttrValue{o.group}, attrs...)...)
            - set: o.hist[k]
              value: h
          when: "!ok"
      - eval: o.mu.Unlock()
        to: o.mu.Unlock
      - eval: h.Record(v)
        to: h.Record
  - of: (*obs).info
    participants:
      - id: caller
        kind: actor
      - id: (*obs).info
        kind: self
      - id: o.log.Log
        kind: value
    steps:
      - opt:
          do:
            - eval: o.log.Log(context.Background(), level.Info, msg, attrs...)
              to: o.log.Log
          when: o.log != nil && o.log.Enabled(context.Background(), level.Info)
  - of: (*obs).warn
    participants:
      - id: caller
        kind: actor
      - id: (*obs).warn
        kind: self
      - id: o.log.Log
        kind: value
    steps:
      - opt:
          do:
            - eval: o.log.Log(context.Background(), level.Warn, msg, attrs...)
              to: o.log.Log
          when: o.log != nil && o.log.Enabled(context.Background(), level.Warn)
  - of: lattr
    steps:
      - return: "corelogger.AttrValue{Key: k, Value: corelogger.Uint64Value(v)}"
  - of: lstr
    steps:
      - return: "corelogger.AttrValue{Key: k, Value: corelogger.StringValue(v)}"
  - of: (*obs).span
    participants:
      - id: caller
        kind: actor
      - id: (*obs).span
        kind: self
      - id: o.tracer.Start
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: o.tracer == nil
      - bind: _, s
        eval: "o.tracer.Start(ctx, name, coretrace.SpanParams{Attrs: []coreotel.AttrValue{o.group}})"
        to: o.tracer.Start
      - return: s
  - of: spanEvent
    participants:
      - id: caller
        kind: actor
      - id: spanEvent
        kind: self
      - id: s.AddEvent
        kind: value
    steps:
      - opt:
          do:
            - eval: s.AddEvent(name, attrs...)
              to: s.AddEvent
          when: s != nil
  - of: spanEnd
    participants:
      - id: caller
        kind: actor
      - id: spanEnd
        kind: self
      - id: s.SetStatus
        kind: value
      - id: s.End
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: s == nil
      - opt:
          do:
            - eval: s.SetStatus(coretrace.StatusError, err.Error())
              to: s.SetStatus
          when: err != nil
      - eval: s.End()
        to: s.End
  - of: codeAttr
    participants:
      - id: caller
        kind: actor
      - id: codeAttr
        kind: self
      - id: errs
        kind: package
      - id: c.String
        kind: value
      - id: coreotel
        kind: package
    steps:
      - bind: c, _
        eval: errs.CodeOf(err)
        to: errs
      - bind: r, _
        eval: errs.ReasonOf(err)
        to: errs
      - opt:
          do:
            - set: r
              to: c.String
              value: c.String()
          when: r == ""
      - return: coreotel.String("code", r)
        to: coreotel
  - of: (*Node).observeStatus
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observeStatus
        kind: self
      - id: o.setGauge
        kind: internal
      - id: o.observeRoleChange
        kind: internal
    steps:
      - bind: o
        eval: n.obs
      - eval: o.setGauge(mRole, float64(cur.Role))
        to: o.setGauge
      - eval: o.setGauge(mTerm, float64(cur.Term))
        to: o.setGauge
      - bind: hl
        eval: "0.0"
      - opt:
          do:
            - set: hl
              value: "1"
          when: cur.Leader != 0
      - eval: o.setGauge(mHasLeader, hl)
        to: o.setGauge
      - eval: o.setGauge(mApplyLagEntries, float64(cur.Commit-min(cur.Commit, cur.Applied)))
        to: o.setGauge
      - bind: ns
        eval: "0.0"
      - opt:
          do:
            - set: ns
              value: "1"
          when: cur.NoSpace != 0
      - eval: o.setGauge(mNoSpace, ns)
        to: o.setGauge
      - eval: o.setGauge(mClusterVersion, float64(cur.Versions.Cluster))
        to: o.setGauge
      - eval: o.setGauge(mProtocolVersion, float64(cur.Versions.ProtocolMax))
        to: o.setGauge
      - opt:
          do:
            - eval: o.observeRoleChange(old, cur)
              to: o.observeRoleChange
          when: old == nil || old.Leader != cur.Leader || old.Term != cur.Term || old.Role != cur.Role
  - of: (*obs).observeRoleChange
    participants:
      - id: caller
        kind: actor
      - id: (*obs).observeRoleChange
        kind: self
      - id: o.inc
        kind: internal
      - id: o.info
        kind: internal
    steps:
      - opt:
          do:
            - eval: o.inc(mLeaderChanges)
              to: o.inc
          when: old != nil && old.Leader != cur.Leader
      - opt:
          do:
            - eval: o.inc(mElectionsStarted)
              to: o.inc
          when: cur.Role == coreconsensus.RolePreCandidate || cur.Role == coreconsensus.RoleCandidate
      - eval: |-
          o.info("consensus: role or term changed", lstr("role", cur.Role.String()), lattr("term", cur.Term),
          		lattr("leader", uint64(cur.Leader)))
        to: o.info
  - of: (*Node).observePeers
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observePeers
        kind: self
      - id: n.clk.Now
        kind: value
      - id: o.setGauge
        kind: internal
      - id: coreotel
        kind: package
    steps:
      - bind: o
        eval: n.obs
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - return: ""
          when: now.Sub(o.lastPeers) < 100*time.Millisecond
      - set: o.lastPeers
        value: now
      - eval: o.setGauge(mFailureTolerance, float64(n.r.FailureTolerance(now)))
        to: o.setGauge
      - bind: last
        eval: n.r.Status().Last
      - bind: window
        eval: n.r.Status().Timing.ElectionTimeoutMin
      - loop:
          do:
            - bind: peer
              eval: coreotel.String("peer", p.ID.String())
              to: coreotel
            - eval: o.setGauge(mPeerMatchLag, float64(last-min(last, p.Match)), peer)
              to: o.setGauge
            - eval: o.setGauge(mPeerInflight, float64(p.Inflight), peer)
              to: o.setGauge
            - bind: u
              eval: "0.0"
            - opt:
                do:
                  - set: u
                    value: "1"
                when: "!p.Flags.Has(raft.StatHeard) || now.Sub(p.LastHeard) >= window"
            - opt:
                do:
                  - set: u
                    value: "1"
                init:
                  bind: at, ok
                  eval: n.unreachableAt[p.ID]
                when: ok && at.After(p.LastHeard)
            - eval: o.setGauge(mPeerUnreachable, u, peer)
              to: o.setGauge
            - opt:
                do:
                  - eval: o.setGauge(mPeerLastContact, now.Sub(p.LastHeard).Seconds(), peer)
                    to: o.setGauge
                when: p.Flags.Has(raft.StatHeard)
          key: _
          range: n.r.PeerStats()
          value: p
  - of: (*Node).observeResources
    participants:
      - id: caller
        kind: actor
      - id: (*Node).observeResources
        kind: self
      - id: n.clk.Now
        kind: value
      - id: o.setGauge
        kind: internal
      - id: ls.logStats
        kind: internal
      - id: o.addTo
        kind: internal
      - id: ct.CertExpiry
        kind: internal
    steps:
      - bind: o
        eval: n.obs
      - opt:
          do:
            - return: ""
          when: o.meter == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - return: ""
          when: now.Sub(o.lastRes) < time.Second
      - set: o.lastRes
        value: now
      - eval: o.setGauge(mLogQuota, float64(n.cfg.MaxLogBytes))
        to: o.setGauge
      - opt:
          do:
            - bind: b, free, tails
              eval: ls.logStats()
              to: ls.logStats
            - eval: o.setGauge(mLogBytes, float64(b))
              to: o.setGauge
            - opt:
                do:
                  - eval: o.setGauge(mFsFree, float64(free), coreotel.String("fs", "data"))
                    to: o.setGauge
                when: free >= 0
            - eval: o.addTo(mTailTruncated, &o.seenTails, tails)
              to: o.addTo
          init:
            bind: ls, ok
            eval: |-
              n.cfg.Log.(interface {
              		logStats() (bytes, free, tails int64)
              	})
          when: ok
      - opt:
          do:
            - opt:
                do:
                  - eval: o.setGauge(mCertExpiry, e.Sub(now).Seconds())
                    to: o.setGauge
                init:
                  bind: e
                  eval: ct.CertExpiry()
                  to: ct.CertExpiry
                when: "!e.IsZero()"
            - loop:
                do:
                  - eval: o.setGauge(mPeerCertExpiry, e.Sub(now).Seconds(), coreotel.String("peer", id.String()))
                    to: o.setGauge
                key: id
                range: ct.PeerCertExpiry()
                value: e
            - eval: o.addTo(mReloadFailures, &o.seenReloads, int64(ct.ReloadFailures()))
              to: o.addTo
          init:
            bind: ct, ok
            eval: |-
              n.cfg.Transport.(interface {
              		CertExpiry() time.Time
              		PeerCertExpiry() map[coreconsensus.NodeID]time.Time
              		ReloadFailures() int
              	})
          when: ok
  - of: (*Node).ReadCommitted
    participants:
      - id: caller
        kind: actor
      - id: (*Node).ReadCommitted
        kind: self
      - id: ctx.Err
        kind: value
      - id: n.cfg.Log.HardState
        kind: value
      - id: n.cfg.Log.Bounds
        kind: value
      - id: n.cfg.Log.Entries
        kind: value
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: nil, n.stoppedErr()
          when: n.stopped.Load()
      - opt:
          do:
            - set: from
              value: "1"
          when: from == 0
      - bind: hs, err
        eval: n.cfg.Log.HardState()
        to: n.cfg.Log.HardState
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: to
        value: min(to, max(hs.Commit, n.logApplied.Load()))
      - opt:
          do:
            - return: nil, nil
          when: from > to
      - opt:
          do:
            - return: nil, origin(coreconsensus.Compacted, errs.String("from", strconv.FormatUint(from, 10)), errs.String("first", strconv.FormatUint(first, 10)))
          init:
            bind: first, _
            eval: n.cfg.Log.Bounds()
            to: n.cfg.Log.Bounds
          when: from < first
      - return: n.cfg.Log.Entries(from, to+1, maxBytes, nil)
        to: n.cfg.Log.Entries
  - of: OpenSnapshot
    participants:
      - id: caller
        kind: actor
      - id: OpenSnapshot
        kind: self
      - id: restoreCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, restoreRefused("size bounds")
          when: opt == nil || opt.MaxDecoded <= 0
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: meta
        eval: opt.Expected
      - return: "&snapshotReader{cr: newChunkReader(r, codec, max(meta.ChunkSize, 1), opt.MaxDecoded), meta: meta}, nil"
  - of: (*snapshotReader).Read
    participants:
      - id: caller
        kind: actor
      - id: (*snapshotReader).Read
        kind: self
      - id: s.cr.Read
        kind: internal
    steps:
      - bind: n, err
        eval: s.cr.Read(p)
        to: s.cr.Read
      - opt:
          do:
            - return: n, err
          when: "!errors.Is(err, io.EOF)"
      - opt:
          do:
            - return: n, snapshotCorrupt("size")
          when: s.cr.total != s.meta.DecodedSize || s.cr.encoded != s.meta.EncodedSize
      - var:
          name: got
          type: "[32]byte"
      - eval: copy(got[:], s.cr.sum.Sum(nil))
      - opt:
          do:
            - return: n, snapshotCorrupt("sha256")
          when: got != s.meta.SHA256
      - return: n, io.EOF
  - of: ImportObserved
    participants:
      - id: caller
        kind: actor
      - id: ImportObserved
        kind: self
      - id: RestoreSnapshot
        kind: internal
      - id: checkObservedTail
        kind: internal
      - id: restoreCodec
        kind: internal
      - id: replayObserved
        kind: internal
      - id: encodeObserved
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, restoreRefused("no options, no snapshot or no state machine")
          when: opt == nil || p == nil || p.Snapshot == nil || p.Machine == nil
      - opt:
          do:
            - return: RestoreSnapshot(d, p.Snapshot, newCluster, members, opt)
              to: RestoreSnapshot
          when: len(p.Tail) == 0
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: checkObservedTail(&opt.Expected, p.Tail)
            to: checkObservedTail
          when: err != nil
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: replayObserved(p, opt)
            to: replayObserved
          when: err != nil
      - bind: encoded, meta, err
        eval: encodeObserved(p, codec, opt.Expected)
        to: encodeObserved
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - bind: o
        eval: "*opt"
      - set: o.Expected
        value: meta
      - return: RestoreSnapshot(d, bytes.NewReader(encoded), newCluster, members, &o)
        to: RestoreSnapshot
  - of: replayObserved
    participants:
      - id: caller
        kind: actor
      - id: replayObserved
        kind: self
      - id: OpenSnapshot
        kind: internal
      - id: p.Machine.Restore
        kind: value
      - id: io
        kind: stdlib
      - id: p.Machine.Apply
        kind: value
    steps:
      - bind: r, err
        eval: OpenSnapshot(p.Snapshot, opt)
        to: OpenSnapshot
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: exp
        eval: opt.Expected
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.Machine.Restore(r, exp)
            to: p.Machine.Restore
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: io.Copy(io.Discard, r)
            to: io
          when: err != nil
      - loop:
          do:
            - bind: e
              eval: p.Tail[i]
            - opt:
                do:
                  - continue: true
                when: e.Kind != coreconsensus.EntryCommand
            - set: e.Token
              value: "coreconsensus.TokenValue{Cluster: exp.Log.Cluster, Epoch: exp.Log.Epoch, Term: e.Position.Term, Index: e.Position.Index}"
            - eval: p.Machine.Apply(e)
              to: p.Machine.Apply
          key: i
          range: p.Tail
      - return: nil
  - of: encodeObserved
    participants:
      - id: caller
        kind: actor
      - id: encodeObserved
        kind: self
      - id: p.Machine.Snapshot
        kind: value
      - id: s.Release
        kind: value
      - id: newChunkWriter
        kind: internal
      - id: s.WriteTo
        kind: value
      - id: cw.Close
        kind: internal
      - id: fmt
        kind: stdlib
      - id: buf.Bytes
        kind: value
    steps:
      - bind: s, err
        eval: p.Machine.Snapshot()
        to: p.Machine.Snapshot
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - defer: s.Release()
        to: s.Release
      - var:
          name: buf
          type: bytes.Buffer
      - bind: cw
        eval: newChunkWriter(&buf, codec, defaultChunkSize)
        to: newChunkWriter
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: _, err
            eval: s.WriteTo(cw)
            to: s.WriteTo
          when: err != nil
      - opt:
          do:
            - return: nil, coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: cw.Close()
            to: cw.Close
          when: err != nil
      - bind: last
        eval: p.Tail[len(p.Tail)-1]
      - bind: meta
        eval: exp
      - set: meta.ID
        to: fmt
        value: fmt.Sprintf("%020d-%020d", last.Position.Index, last.Position.Term)
      - set: meta.Position, meta.ChainTip
        value: last.Position, last.ChainSum
      - set: meta.Codec, meta.ChunkSize
        value: string(codec.Algorithm()), defaultChunkSize
      - set: meta.EncodedSize, meta.DecodedSize
        value: cw.encoded, cw.decoded
      - eval: copy(meta.SHA256[:], cw.sum.Sum(nil))
      - set: meta.Membership.Index
        value: last.Position.Index
      - return: buf.Bytes(), meta, nil
        to: buf.Bytes
  - of: checkObservedTail
    participants:
      - id: caller
        kind: actor
      - id: checkObservedTail
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - bind: prev, term, chain
        eval: exp.Position.Index, exp.Position.Term, exp.ChainTip
      - loop:
          do:
            - bind: e
              eval: "&tail[i]"
            - switch:
                cases:
                  - case: e.Position.Index != prev+1
                    do:
                      - return: restoreRefused(fmt.Sprintf("the tail holds %d after %d", e.Position.Index, prev))
                        to: restoreRefused
                  - case: e.Position.Term < term
                    do:
                      - return: restoreRefused(fmt.Sprintf("the term goes back at %d", e.Position.Index))
                        to: restoreRefused
                  - case: "!e.Kind.Known()"
                    do:
                      - return: restoreRefused(fmt.Sprintf("unknown entry kind at %d", e.Position.Index))
                        to: restoreRefused
                  - case: e.Kind == coreconsensus.EntryClusterVersion, e.Kind == coreconsensus.EntryTimingContract, e.Kind == coreconsensus.EntryNoSpaceRaise, e.Kind == coreconsensus.EntryNoSpaceClear
                    do:
                      - return: restoreRefused(fmt.Sprintf("the tail changes the engine's state at %d; import from a later snapshot", e.Position.Index))
                        to: restoreRefused
                  - case: e.BodySum != wire.BodySum(e.Data)
                    do:
                      - return: restoreRefused(fmt.Sprintf("the payload of %d does not match its BodySum", e.Position.Index))
                        to: restoreRefused
                  - case: e.ChainSum != wire.ChainSum(chain, e)
                    do:
                      - return: restoreRefused(fmt.Sprintf("the chain breaks at %d", e.Position.Index))
                        to: restoreRefused
            - set: prev, term, chain
              value: e.Position.Index, e.Position.Term, e.ChainSum
          key: i
          range: tail
      - return: nil
  - of: DataDir.offline
    participants:
      - id: caller
        kind: actor
      - id: DataDir.offline
        kind: self
      - id: misconfigured
        kind: internal
      - id: origin
        kind: internal
    steps:
      - opt:
          do:
            - return: misconfigured("DataDir", "zero")
              to: misconfigured
          when: d.d == nil
      - lock:
          mutex: d.d.mu
      - switch:
          cases:
            - case: d.d.closed
              do:
                - return: origin(coreconsensus.NodeStopped, errs.String("why", "data directory closed"))
                  to: origin
            - case: d.d.inUse
              do:
                - return: origin(coreconsensus.DataDirInUse, errs.String("dir", d.d.dir))
                  to: origin
      - return: nil
  - of: DataDir.audit
    participants:
      - id: caller
        kind: actor
      - id: DataDir.audit
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: fmt
        kind: stdlib
      - id: f.Sync
        kind: value
      - id: syncDir
        kind: internal
    steps:
      - bind: f, err
        eval: os.OpenFile(filepath.Join(d.d.dir, fileAudit), os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o600)
        to: os
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = storageFailed("audit", cerr)
          		}
          	}()
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: _, err
            eval: fmt.Fprintf(f, "%s %s\n", op, what)
            to: fmt
          when: err != nil
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: err
            eval: f.Sync()
            to: f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("audit", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: Init
    participants:
      - id: caller
        kind: actor
      - id: Init
        kind: self
      - id: d.offline
        kind: internal
      - id: InitLog
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - return: InitLog(d.Log(), cluster, slot)
        to: InitLog
  - of: Redraw
    participants:
      - id: caller
        kind: actor
      - id: Redraw
        kind: self
      - id: d.offline
        kind: internal
      - id: RedrawLog
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - return: RedrawLog(d.Log())
        to: RedrawLog
  - of: Inspect
    participants:
      - id: caller
        kind: actor
      - id: Inspect
        kind: self
      - id: d.offline
        kind: internal
      - id: readQuarantineMarker
        kind: internal
      - id: l.mu.RLock
        kind: value
      - id: l.mu.RUnlock
        kind: value
      - id: l.Bounds
        kind: internal
      - id: d.d.snaps.List
        kind: internal
      - id: stopMarkers
        kind: internal
    steps:
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: l
        eval: d.d.log
      - bind: r
        eval: "ReportValue{Stamp: l.stamp}"
      - bind: q, err
        eval: readQuarantineMarker(d.d.dir)
        to: readQuarantineMarker
      - opt:
          do:
            - return: ReportValue{}, err
          when: err != nil
      - set: r.Quarantine
        value: q
      - opt:
          do:
            - eval: l.mu.RLock()
              to: l.mu.RLock
            - set: r.HardState
              value: l.hs
            - eval: l.mu.RUnlock()
              to: l.mu.RUnlock
            - set: r.First, r.Last
              to: l.Bounds
              value: l.Bounds()
          when: l.refuse == nil
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: r.Snapshots, err
            eval: d.d.snaps.List()
            op: =
            to: d.d.snaps.List
          when: err != nil
      - opt:
          do:
            - return: ReportValue{}, err
          init:
            bind: r.Markers, err
            eval: stopMarkers(d.d.dir)
            op: =
            to: stopMarkers
          when: err != nil
      - return: r, nil
  - of: readQuarantineMarker
    participants:
      - id: caller
        kind: actor
      - id: readQuarantineMarker
        kind: self
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: q, err
        eval: os.ReadFile(filepath.Join(dir, markerQuarantine))
        to: os
      - switch:
          cases:
            - case: err == nil
              do:
                - return: strings.TrimSpace(string(q)), nil
                  to: strings
            - case: errors.Is(err, os.ErrNotExist)
              do:
                - return: "\"\", nil"
            - default: true
              do:
                - return: "\"\", storageFailed(\"inspect quarantine\", err)"
  - of: stopMarkers
    participants:
      - id: caller
        kind: actor
      - id: stopMarkers
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("inspect markers", err)
          when: err != nil
      - var:
          name: markers
          type: "[]string"
      - loop:
          do:
            - opt:
                do:
                  - set: markers
                    value: append(markers, e.Name())
                when: strings.HasPrefix(e.Name(), markerStopPrefix) && !strings.HasSuffix(e.Name(), ".tmp")
          key: _
          range: ents
          value: e
      - return: markers, nil
  - of: ClearQuarantine
    participants:
      - id: caller
        kind: actor
      - id: ClearQuarantine
        kind: self
      - id: d.offline
        kind: internal
      - id: misconfigured
        kind: internal
      - id: d.wipeAndRejoin
        kind: internal
      - id: d.audit
        kind: internal
      - id: d.truncateAndStaySilent
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - opt:
          do:
            - return: misconfigured("Operator", "invalid")
              to: misconfigured
          when: "!op.Valid()"
      - switch:
          cases:
            - case: WipeAndRejoin
              do:
                - return: d.wipeAndRejoin(op)
                  to: d.wipeAndRejoin
            - case: TruncateAndStaySilent
              do:
                - opt:
                    do:
                      - return: err
                    init:
                      bind: err
                      eval: d.audit(op, "clear-quarantine truncate-and-stay-silent")
                      to: d.audit
                    when: err != nil
                - return: d.truncateAndStaySilent()
                  to: d.truncateAndStaySilent
            - default: true
              do:
                - return: misconfigured("exit", "unknown")
                  to: misconfigured
          "on": exit
  - of: DataDir.wipeAndRejoin
    participants:
      - id: caller
        kind: actor
      - id: DataDir.wipeAndRejoin
        kind: self
      - id: d.audit
        kind: internal
      - id: d.d.log.Close
        kind: internal
      - id: d.removeStores
        kind: internal
      - id: d.removeStampAndMarkers
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
      - id: d.d.open
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.audit(op, "clear-quarantine wipe-and-rejoin")
            to: d.audit
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.Close()
            to: d.d.log.Close
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.removeStores()
            to: d.removeStores
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.removeStampAndMarkers()
            to: d.removeStampAndMarkers
          when: err != nil
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(d.d.log.runtimeMarker("STORAGE_FAILED"))
            to: os
          when: err != nil && !errors.Is(err, os.ErrNotExist)
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: d.d.open()
        to: d.d.open
  - of: DataDir.removeStores
    participants:
      - id: caller
        kind: actor
      - id: DataDir.removeStores
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("wipe", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: os.RemoveAll(filepath.Join(d.d.dir, name))
                  to: os
                when: err != nil
          key: _
          range: "[]string{\"log\", \"snap\"}"
          value: name
      - return: nil
  - of: DataDir.removeStampAndMarkers
    participants:
      - id: caller
        kind: actor
      - id: DataDir.removeStampAndMarkers
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: e.Name
        kind: value
    steps:
      - bind: ents, err
        eval: os.ReadDir(d.d.dir)
        to: os
      - opt:
          do:
            - return: storageFailed("wipe", err)
              to: storageFailed
          when: err != nil
      - loop:
          do:
            - bind: "n"
              eval: e.Name()
              to: e.Name
            - opt:
                do:
                  - opt:
                      do:
                        - return: storageFailed("wipe", err)
                          to: storageFailed
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(d.d.dir, n))
                        to: os
                      when: err != nil
                when: n == fileStamp || n == markerQuarantine || n == fileSilent || strings.HasPrefix(n, markerStopPrefix)
          key: _
          range: ents
          value: e
      - return: nil
  - of: receiptMessage
    participants:
      - id: caller
        kind: actor
      - id: receiptMessage
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: append(append([]byte("kitsunium-consensus/fenced/v1"), old[:]...), next[:]...)
      - return: binary.LittleEndian.AppendUint64(b, uint64(voter))
        to: binary.LittleEndian.AppendUint64
  - of: ReceiptMessage
    participants:
      - id: caller
        kind: actor
      - id: ReceiptMessage
        kind: self
      - id: receiptMessage
        kind: internal
    steps:
      - return: receiptMessage(old, next, voter)
        to: receiptMessage
  - of: Recover
    participants:
      - id: caller
        kind: actor
      - id: Recover
        kind: self
      - id: d.offline
        kind: internal
      - id: recoverRefused
        kind: internal
      - id: d.readRecoverIntent
        kind: internal
      - id: d.finishRecover
        kind: internal
      - id: checkRecover
        kind: internal
      - id: checkRecoverMembers
        kind: internal
      - id: d.planRecover
        kind: internal
      - id: d.writeRecover
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: flog
        eval: d.d.log
      - opt:
          do:
            - return: recoverRefused("quarantined log")
              to: recoverRefused
          when: flog.refuse != nil
      - bind: stamp
        eval: flog.stamp
      - bind: intent, err
        eval: d.readRecoverIntent()
        to: d.readRecoverIntent
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: "recoverRefused(\"an interrupted Recover names cluster \" + intent.cluster.String() + \": run it again to that cluster\")"
                    to: recoverRefused
                when: intent.cluster != newCluster
            - opt:
                do:
                  - return: d.finishRecover(newCluster, opt)
                    to: d.finishRecover
                when: stamp.Log.Cluster == newCluster
          when: intent != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRecover(&stamp, newCluster, opt)
            to: checkRecover
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRecoverMembers(&stamp, members)
            to: checkRecoverMembers
          when: err != nil
      - bind: plan, err
        eval: d.planRecover(&stamp, newCluster, members, opt, intent)
        to: d.planRecover
      - opt:
          do:
            - return: err
          when: err != nil
      - return: d.writeRecover(&stamp, newCluster, members, opt.Operator, &plan)
        to: d.writeRecover
  - of: DataDir.planRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.planRecover
        kind: self
      - id: d.d.log.HardState
        kind: internal
      - id: d.resumedKept
        kind: internal
      - id: d.adoptedEnd
        kind: internal
      - id: lastMembership
        kind: internal
      - id: checkFenced
        kind: internal
    steps:
      - var:
          name: p
          type: recoverPlan
      - bind: hard, err
        eval: d.d.log.HardState()
        to: d.d.log.HardState
      - opt:
          do:
            - return: p, err
          when: err != nil
      - set: p.hard, p.resumed
        value: hard, intent != nil
      - alt:
          - do:
              - set: p.kept, err
                to: d.resumedKept
                value: d.resumedKept(intent)
            when: p.resumed
          - do:
              - set: p.kept, err
                to: d.adoptedEnd
                value: d.adoptedEnd(hard.Commit)
            else: true
      - opt:
          do:
            - return: p, err
          when: err != nil
      - opt:
          do:
            - return: p, err
          init:
            bind: p.old, err
            eval: lastMembership(d.d.log, d.d.snaps, p.kept)
            op: =
            to: lastMembership
          when: err != nil
      - opt:
          do:
            - return: p, err
          init:
            bind: err
            eval: checkFenced(p.old.Voters(), members, opt, stamp.Log.Cluster, newCluster)
            to: checkFenced
          when: err != nil
      - return: p, d.audit(opt.Operator, recoverAuditLine(newCluster, &p))
  - of: recoverAuditLine
    participants:
      - id: caller
        kind: actor
      - id: recoverAuditLine
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - return: fmt.Sprintf("recover %s resumed kept %d", newCluster, p.kept)
              to: fmt
          when: p.resumed
      - return: fmt.Sprintf("recover %s kept %d commit %d adopted %d", newCluster, p.kept, p.hard.Commit, p.kept-p.hard.Commit)
        to: fmt
  - of: DataDir.resumedKept
    participants:
      - id: caller
        kind: actor
      - id: DataDir.resumedKept
        kind: self
      - id: d.d.log.Bounds
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, recoverRefused("the interrupted Recover kept an index past the log")
          init:
            bind: _, last
            eval: d.d.log.Bounds()
            to: d.d.log.Bounds
          when: intent.kept > last
      - return: intent.kept, nil
  - of: DataDir.writeRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.writeRecover
        kind: self
      - id: d.writeRecoverIntent
        kind: internal
      - id: d.appendForced
        kind: internal
      - id: d.d.log.WriteStamp
        kind: internal
      - id: d.endRecoveredSilence
        kind: internal
      - id: d.clearRecoverIntent
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: "d.writeRecoverIntent(&recoverIntent{cluster: newCluster, kept: p.kept})"
                  to: d.writeRecoverIntent
                when: err != nil
          when: "!p.resumed"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "d.appendForced(new(coreconsensus.HardState{Term: p.hard.Term, Commit: p.kept}), members, &p.old, op)"
            to: d.appendForced
          when: err != nil
      - set: stamp.Log
        value: |-
          coreconsensus.LogIdentityValue{
          		Cluster: newCluster, Epoch: 1, Predecessor: stamp.Log.Cluster,
          		PredecessorEpoch: stamp.Log.Epoch, KeptIndex: p.kept,
          	}
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.WriteStamp(*stamp)
            to: d.d.log.WriteStamp
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.endRecoveredSilence()
            to: d.endRecoveredSilence
          when: err != nil
      - return: d.clearRecoverIntent()
        to: d.clearRecoverIntent
  - of: DataDir.endRecoveredSilence
    participants:
      - id: caller
        kind: actor
      - id: DataDir.endRecoveredSilence
        kind: self
      - id: d.d.log.endSilence
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: d.d.log.endSilence()
            to: d.d.log.endSilence
          when: err != nil
      - return: nil
  - of: DataDir.finishRecover
    participants:
      - id: caller
        kind: actor
      - id: DataDir.finishRecover
        kind: self
      - id: recoverRefused
        kind: internal
      - id: d.audit
        kind: internal
      - id: d.endRecoveredSilence
        kind: internal
      - id: d.clearRecoverIntent
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!opt.Operator.Valid()"
              do:
                - return: recoverRefused("operator")
                  to: recoverRefused
            - case: opt.Confirm != newCluster.String()
              do:
                - return: recoverRefused("confirmation does not name the new cluster")
                  to: recoverRefused
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.audit(opt.Operator, fmt.Sprintf("recover %s completed", newCluster))
            to: d.audit
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.endRecoveredSilence()
            to: d.endRecoveredSilence
          when: err != nil
      - return: d.clearRecoverIntent()
        to: d.clearRecoverIntent
  - of: DataDir.writeRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.writeRecoverIntent
        kind: self
      - id: fmt
        kind: stdlib
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - bind: body
        eval: |-
          fmt.Sprintf("cluster=%s\nkept=%d\nRecover to cluster %s was interrupted: run Recover again to cluster %s to complete it\n",
          		in.cluster, in.kept, in.cluster, in.cluster)
        to: fmt
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, markerRecover), []byte(body))
            to: writeFileSync
          when: err != nil
      - return: nil
  - of: DataDir.readRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.readRecoverIntent
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
      - id: hex
        kind: stdlib
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(d.d.dir, markerRecover))
        to: os
      - switch:
          cases:
            - case: errors.Is(err, os.ErrNotExist)
              do:
                - return: nil, nil
            - case: err != nil
              do:
                - return: nil, storageFailed("recover marker", err)
      - var:
          name: cluster
          type: string
      - bind: in
        eval: "&recoverIntent{}"
      - opt:
          do:
            - return: nil, recoverRefused("unreadable " + markerRecover + " marker")
          init:
            bind: _, err
            eval: fmt.Sscanf(string(b), "cluster=%s\nkept=%d\n", &cluster, &in.kept)
            to: fmt
          when: err != nil
      - bind: raw, err
        eval: hex.DecodeString(cluster)
        to: hex
      - opt:
          do:
            - return: nil, recoverRefused("unreadable " + markerRecover + " marker")
          when: err != nil || len(raw) != len(in.cluster)
      - eval: copy(in.cluster[:], raw)
      - return: in, nil
  - of: DataDir.clearRecoverIntent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.clearRecoverIntent
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(d.d.dir, markerRecover))
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("recover marker", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(d.d.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: recoverRefused
    participants:
      - id: caller
        kind: actor
      - id: recoverRefused
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.RecoverRefused, errs.String("why", why))
        to: origin
  - of: isZeroDigest
    steps:
      - var:
          name: zero
          type: "[32]byte"
      - return: d == zero
  - of: checkRecover
    participants:
      - id: caller
        kind: actor
      - id: checkRecover
        kind: self
      - id: recoverRefused
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!opt.Operator.Valid()"
              do:
                - return: recoverRefused("operator")
                  to: recoverRefused
            - case: opt.Confirm != newCluster.String()
              do:
                - return: recoverRefused("confirmation does not name the new cluster")
                  to: recoverRefused
            - case: newCluster.IsZero() || newCluster == stamp.Log.Cluster
              do:
                - return: recoverRefused("the new cluster must be new")
                  to: recoverRefused
            - case: stamp.State != coreconsensus.StampMember
              do:
                - return: recoverRefused("not a member directory")
                  to: recoverRefused
            - case: len(opt.WitnessKeys) == 0
              do:
                - return: recoverRefused("no witness key")
                  to: recoverRefused
      - return: nil
  - of: checkRecoverMembers
    participants:
      - id: caller
        kind: actor
      - id: checkRecoverMembers
        kind: self
      - id: recoverRefused
        kind: internal
    steps:
      - bind: self
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - return: recoverRefused("a member without an SPKI pin")
                    to: recoverRefused
                when: isZeroDigest(m.SPKI) || m.ID == 0
            - opt:
                do:
                  - set: self
                    value: m.Incarnation == stamp.Incarnation
                when: m.ID == stamp.ID && m.Voter
          key: _
          range: members
          value: m
      - opt:
          do:
            - return: recoverRefused("two members under one key")
              to: recoverRefused
          when: sharedKey(members)
      - opt:
          do:
            - return: recoverRefused("this node is not a voter of the new members")
              to: recoverRefused
          when: "!self"
      - return: nil
  - of: checkFenced
    participants:
      - id: caller
        kind: actor
      - id: checkFenced
        kind: self
      - id: slices
        kind: stdlib
      - id: recoverRefused
        kind: internal
      - id: receiptMessage
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: slices.ContainsFunc(members, func(m coreconsensus.MemberValue) bool { return m.ID == v })
            - bind: i
              eval: slices.IndexFunc(opt.Fenced, func(a coreconsensus.FencedAttestationValue) bool { return a.Voter == v })
              to: slices
            - opt:
                do:
                  - return: recoverRefused("an old voter is not attested fenced")
                    to: recoverRefused
                when: i < 0
            - bind: msg
              eval: receiptMessage(oldCluster, newCluster, v)
              to: receiptMessage
            - opt:
                do:
                  - return: recoverRefused("a witness did not sign the fence of an old voter")
                    to: recoverRefused
                when: "!signedByEvery(opt.WitnessKeys, opt.Fenced[i].Receipts, msg)"
          key: _
          range: voters
          value: v
      - return: nil
  - of: DataDir.adoptedEnd
    participants:
      - id: caller
        kind: actor
      - id: DataDir.adoptedEnd
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: d.adoptedPastTheBase
        kind: internal
      - id: d.chainAt
        kind: internal
      - id: d.verifiedEnd
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - opt:
          do:
            - return: d.adoptedPastTheBase(first, last)
              to: d.adoptedPastTheBase
          when: commit+1 < first
      - opt:
          do:
            - return: commit, nil
          when: last <= commit
      - bind: chain, term, err
        eval: d.chainAt(commit, first)
        to: d.chainAt
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - return: d.verifiedEnd(commit, last, term, chain)
        to: d.verifiedEnd
  - of: DataDir.adoptedPastTheBase
    participants:
      - id: caller
        kind: actor
      - id: DataDir.adoptedPastTheBase
        kind: self
      - id: d.d.snaps.List
        kind: internal
      - id: d.verifiedEnd
        kind: internal
      - id: d.d.log.Entries
        kind: internal
    steps:
      - bind: metas, err
        eval: d.d.snaps.List()
        to: d.d.snaps.List
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - opt:
          do:
            - return: d.verifiedEnd(first-1, last, metas[0].Position.Term, metas[0].ChainTip)
              to: d.verifiedEnd
          when: len(metas) > 0 && metas[0].Position.Index == first-1
      - opt:
          do:
            - return: 0, recoverRefused("the log is compacted past its persisted commit, and nothing records the chain at its base")
          when: last < first
      - bind: es, err
        eval: d.d.log.Entries(first, first+1, 1, nil)
        to: d.d.log.Entries
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: e
        eval: "&es[0]"
      - opt:
          do:
            - return: 0, recoverRefused("the log is compacted past its persisted commit, and its first entry does not verify")
          when: wire.BodySum(e.Data) != e.BodySum
      - return: d.verifiedEnd(first, last, e.Position.Term, e.ChainSum)
        to: d.verifiedEnd
  - of: DataDir.verifiedEnd
    participants:
      - id: caller
        kind: actor
      - id: DataDir.verifiedEnd
        kind: self
      - id: flog.Entries
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - var:
          name: buf
          type: "[]coreconsensus.EntryValue"
      - loop:
          cond: end < last
          do:
            - bind: es, err
              eval: flog.Entries(end+1, end+2, 1, buf[:0])
              to: flog.Entries
            - opt:
                do:
                  - return: end, nil
                when: errors.Is(err, coreconsensus.LogCorrupt)
            - opt:
                do:
                  - return: 0, err
                when: err != nil
            - bind: e
              eval: "&es[0]"
            - opt:
                do:
                  - return: end, nil
                when: "!extends(e, end, term, chain)"
            - set: chain, term, end
              value: e.ChainSum, e.Position.Term, e.Position.Index
            - set: buf
              value: es
      - return: end, nil
  - of: extends
    steps:
      - return: |-
          e.Position.Index == end+1 && e.Position.Term >= term &&
          		wire.BodySum(e.Data) == e.BodySum && wire.ChainSum(chain, e) == e.ChainSum
  - of: DataDir.appendForced
    participants:
      - id: caller
        kind: actor
      - id: DataDir.appendForced
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: flog.TruncateSuffix
        kind: internal
      - id: d.chainAt
        kind: internal
      - id: wire
        kind: package
      - id: flog.Append
        kind: internal
      - id: flog.Sync
        kind: internal
    steps:
      - bind: flog
        eval: d.d.log
      - bind: commit
        eval: hard.Commit
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: flog.TruncateSuffix(commit + 1)
                  to: flog.TruncateSuffix
                when: err != nil
          when: last > commit
      - bind: chain, termAt, err
        eval: d.chainAt(commit, first)
        to: d.chainAt
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: term
        eval: max(hard.Term, termAt) + 1
      - bind: conf
        eval: "coreconsensus.MembershipValue{Members: byID(members), Retired: old.Retired}"
      - bind: data
        eval: "wire.AppendAdmin(nil, &wire.AdminValue{Operator: string(operator), Change: wire.ChangeForced, Membership: conf})"
        to: wire
      - bind: e
        eval: |-
          coreconsensus.EntryValue{
          		Position: coreconsensus.PositionValue{Term: term, Index: commit + 1}, Kind: coreconsensus.EntryMembership,
          		BodySum: wire.BodySum(data), Data: data,
          	}
      - set: e.ChainSum
        to: wire
        value: wire.ChainSum(chain, &e)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "flog.Append([]coreconsensus.EntryValue{e}, &coreconsensus.HardState{Term: term, Commit: commit + 1})"
            to: flog.Append
          when: err != nil
      - return: flog.Sync()
        to: flog.Sync
  - of: DataDir.chainAt
    participants:
      - id: caller
        kind: actor
      - id: DataDir.chainAt
        kind: self
      - id: d.d.log.Entries
        kind: internal
      - id: d.d.snaps.List
        kind: internal
    steps:
      - opt:
          do:
            - bind: es, err
              eval: d.d.log.Entries(commit, commit+1, 1, nil)
              to: d.d.log.Entries
            - opt:
                do:
                  - return: 0, 0, err
                when: err != nil
            - return: es[0].ChainSum, es[0].Position.Term, nil
          when: commit >= first
      - bind: metas, err
        eval: d.d.snaps.List()
        to: d.d.snaps.List
      - opt:
          do:
            - return: 0, 0, err
          when: err != nil
      - opt:
          do:
            - return: metas[0].ChainTip, metas[0].Position.Term, nil
          when: len(metas) > 0 && metas[0].Position.Index == commit
      - return: 0, 0, nil
  - of: lastMembership
    participants:
      - id: caller
        kind: actor
      - id: lastMembership
        kind: self
      - id: snaps.List
        kind: internal
      - id: l.Bounds
        kind: internal
      - id: l.Entries
        kind: internal
      - id: wire
        kind: package
    steps:
      - var:
          name: m
          type: coreconsensus.MembershipValue
      - bind: metas, err
        eval: snaps.List()
        to: snaps.List
      - opt:
          do:
            - return: m, err
          when: err != nil
      - opt:
          do:
            - set: m
              value: metas[0].Membership
          when: len(metas) > 0
      - bind: first, last
        eval: l.Bounds()
        to: l.Bounds
      - opt:
          do:
            - bind: es, err
              eval: l.Entries(first, min(last, index)+1, int(^uint(0)>>1), nil)
              to: l.Entries
            - opt:
                do:
                  - return: coreconsensus.MembershipValue{}, err
                when: err != nil
            - loop:
                do:
                  - opt:
                      do:
                        - opt:
                            do:
                              - set: m
                                value: a.Membership
                            init:
                              bind: a, err
                              eval: wire.ParseAdmin(e.Data)
                              to: wire
                            when: err == nil
                      when: e.Kind == coreconsensus.EntryMembership
                key: _
                range: es
                value: e
          when: last >= first
      - return: m, nil
  - of: RestoreSnapshot
    participants:
      - id: caller
        kind: actor
      - id: RestoreSnapshot
        kind: self
      - id: d.offline
        kind: internal
      - id: checkRestore
        kind: internal
      - id: restoreCodec
        kind: internal
      - id: d.audit
        kind: internal
      - id: restoredMeta
        kind: internal
      - id: d.spoolRestored
        kind: internal
      - id: d.verifyRestored
        kind: internal
      - id: flog.restartAt
        kind: internal
      - id: flog.WriteStamp
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.offline()
            to: d.offline
          when: err != nil
      - bind: flog
        eval: d.d.log
      - bind: stamp
        eval: flog.stamp
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: checkRestore(flog, &stamp, newCluster, members, opt)
            to: checkRestore
          when: err != nil
      - bind: codec, err
        eval: restoreCodec(opt)
        to: restoreCodec
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.audit(opt.Operator, "restore-snapshot "+newCluster.String())
            to: d.audit
          when: err != nil
      - bind: meta
        eval: restoredMeta(&opt.Expected, newCluster, members)
        to: restoredMeta
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.spoolRestored(r, &meta)
            to: d.spoolRestored
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: d.verifyRestored(&meta, codec, opt.MaxDecoded)
            to: d.verifyRestored
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: flog.restartAt(&meta)
            to: flog.restartAt
          when: err != nil
      - set: stamp.Log, stamp.State
        value: meta.Log, coreconsensus.StampMember
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, err
          init:
            bind: err
            eval: flog.WriteStamp(stamp)
            to: flog.WriteStamp
          when: err != nil
      - return: meta, nil
  - of: restoreRefused
    participants:
      - id: caller
        kind: actor
      - id: restoreRefused
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.RestoreRefused, errs.String("why", why))
        to: origin
  - of: checkRestore
    participants:
      - id: caller
        kind: actor
      - id: checkRestore
        kind: self
      - id: checkRestoreTarget
        kind: internal
      - id: checkRestoreBounds
        kind: internal
      - id: checkRestoreMembers
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRestoreTarget(flog, newCluster, opt)
            to: checkRestoreTarget
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkRestoreBounds(flog, stamp, opt)
            to: checkRestoreBounds
          when: err != nil
      - return: checkRestoreMembers(stamp, members)
        to: checkRestoreMembers
  - of: restoreCodec
    participants:
      - id: caller
        kind: actor
      - id: restoreCodec
        kind: self
      - id: defaultRestoreCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: opt.Codec, nil
          when: opt.Codec != nil
      - return: defaultRestoreCodec()
        to: defaultRestoreCodec
  - of: defaultRestoreCodec
    participants:
      - id: caller
        kind: actor
      - id: defaultRestoreCodec
        kind: self
      - id: defaultCodec
        kind: internal
    steps:
      - opt:
          do:
            - return: codec, nil
          init:
            bind: codec, ok
            eval: defaultCodec()
            to: defaultCodec
          when: ok
      - return: nil, misconfigured("Codec", "no bounded decompressor")
  - of: checkRestoreTarget
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreTarget
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - bind: exp
        eval: "&opt.Expected"
      - switch:
          cases:
            - case: flog.refuse != nil
              do:
                - return: restoreRefused("quarantined log")
                  to: restoreRefused
            - case: "!opt.Operator.Valid()"
              do:
                - return: restoreRefused("operator")
                  to: restoreRefused
            - case: opt.Confirm != newCluster.String() || newCluster.IsZero()
              do:
                - return: restoreRefused("confirmation does not name the new cluster")
                  to: restoreRefused
            - case: exp.ID == "" || exp.Position.Index == 0 || isZeroDigest(exp.SHA256)
              do:
                - return: restoreRefused("expected metadata is zero")
                  to: restoreRefused
      - return: nil
  - of: checkRestoreBounds
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreBounds
        kind: self
      - id: flog.Bounds
        kind: internal
      - id: restoreRefused
        kind: internal
    steps:
      - bind: exp
        eval: "&opt.Expected"
      - bind: first, last
        eval: flog.Bounds()
        to: flog.Bounds
      - switch:
          cases:
            - case: stamp.State != coreconsensus.StampJoining || last >= first
              do:
                - return: restoreRefused("not an empty joining directory")
                  to: restoreRefused
            - case: opt.MaxEncoded <= 0 || opt.MaxDecoded <= 0 || exp.EncodedSize > opt.MaxEncoded || exp.DecodedSize > opt.MaxDecoded
              do:
                - return: restoreRefused("size bounds")
                  to: restoreRefused
      - return: nil
  - of: checkRestoreMembers
    participants:
      - id: caller
        kind: actor
      - id: checkRestoreMembers
        kind: self
      - id: restoreRefused
        kind: internal
    steps:
      - opt:
          do:
            - return: restoreRefused("this node is not a voter of the new members")
              to: restoreRefused
          when: |-
            !slices.ContainsFunc(members, func(m coreconsensus.MemberValue) bool {
            		return m.ID == stamp.ID && m.Voter && m.Incarnation == stamp.Incarnation
            	})
      - loop:
          do:
            - opt:
                do:
                  - return: restoreRefused("a member without an SPKI pin")
                    to: restoreRefused
                when: isZeroDigest(m.SPKI)
          key: _
          range: members
          value: m
      - opt:
          do:
            - return: restoreRefused("two members under one key")
              to: restoreRefused
          when: sharedKey(members)
      - return: nil
  - of: restoredMeta
    steps:
      - bind: meta
        eval: "*exp"
      - set: meta.Log
        value: |-
          coreconsensus.LogIdentityValue{
          		Cluster: newCluster, Epoch: 1, Predecessor: exp.Log.Cluster,
          		PredecessorEpoch: exp.Log.Epoch, KeptIndex: exp.Position.Index,
          	}
      - set: meta.Membership
        value: "coreconsensus.MembershipValue{Index: exp.Position.Index, Members: slices.Clone(members), Retired: exp.Membership.Retired}"
      - return: meta
  - of: DataDir.spoolRestored
    participants:
      - id: caller
        kind: actor
      - id: DataDir.spoolRestored
        kind: self
      - id: d.d.snaps.Create
        kind: internal
      - id: sink.Abort
        kind: value
      - id: io
        kind: stdlib
      - id: alsoFailed
        kind: internal
      - id: sink.Commit
        kind: value
    steps:
      - bind: sink, off, err
        eval: d.d.snaps.Create(meta.ID, *meta)
        to: d.d.snaps.Create
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: sink.Abort()
                  to: sink.Abort
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: sink, _, err
                  eval: d.d.snaps.Create(meta.ID, *meta)
                  op: =
                  to: d.d.snaps.Create
                when: err != nil
          when: off != 0
      - bind: n, err
        eval: io.Copy(sink, io.LimitReader(r, meta.EncodedSize+1))
        to: io
      - opt:
          do:
            - return: alsoFailed(restoreRefused("stream size"), "abort", sink.Abort())
              to: alsoFailed
          when: err != nil || n != meta.EncodedSize
      - return: sink.Commit(*meta)
        to: sink.Commit
  - of: DataDir.verifyRestored
    participants:
      - id: caller
        kind: actor
      - id: DataDir.verifyRestored
        kind: self
      - id: d.d.snaps.Open
        kind: internal
      - id: verifySnapshot
        kind: internal
      - id: h.Close
        kind: value
      - id: alsoFailed
        kind: internal
    steps:
      - bind: h, err
        eval: d.d.snaps.Open(meta.ID)
        to: d.d.snaps.Open
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: verr
        eval: verifySnapshot(io.NewSectionReader(h, 0, meta.EncodedSize), *meta, codec, maxDecoded)
        to: verifySnapshot
      - bind: cerr
        eval: h.Close()
        to: h.Close
      - opt:
          do:
            - return: alsoFailed(verr, "remove", d.d.snaps.Remove(meta.ID))
              to: alsoFailed
          when: verr != nil
      - return: cerr
  - of: (*fileLog).restartAt
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).restartAt
        kind: self
      - id: l.resetTo
        kind: internal
      - id: l.Append
        kind: internal
      - id: l.Sync
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.resetTo(meta.Position.Index, meta.Position.Term)
            to: l.resetTo
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: "l.Append(nil, &coreconsensus.HardState{Term: meta.Position.Term + 1, Commit: meta.Position.Index})"
            to: l.Append
          when: err != nil
      - return: l.Sync()
        to: l.Sync
  - of: (*fileLog).resetTo
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).resetTo
        kind: self
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - eval: "l.add(&record{kind: recCompact, batch: l.batch, index: index, term: term})"
        to: l.add
      - set: l.slots
        value: nil
      - set: l.first, l.prevTerm
        value: index+1, term
      - set: l.compact, l.compactTerm
        value: index, term
      - return: nil
  - of: DataDir.truncateAndStaySilent
    participants:
      - id: caller
        kind: actor
      - id: DataDir.truncateAndStaySilent
        kind: self
      - id: d.quarantinePoint
        kind: internal
      - id: filepath
        kind: stdlib
      - id: logMaxTerm
        kind: internal
      - id: persistedSilenceTerm
        kind: internal
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
      - id: truncateAtDamage
        kind: internal
      - id: syncDir
        kind: internal
      - id: os
        kind: stdlib
      - id: d.reopenSilenced
        kind: internal
    steps:
      - bind: segN, off, err
        eval: d.quarantinePoint()
        to: d.quarantinePoint
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: logDir
        eval: filepath.Join(d.d.dir, "log")
        to: filepath
      - bind: maxTerm, err
        eval: logMaxTerm(logDir)
        to: logMaxTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: prev, err
        eval: persistedSilenceTerm(d.d.dir)
        to: persistedSilenceTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - set: maxTerm
        value: max(maxTerm, prev)
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, fileSilent), silenceRecord(maxTerm, 0))
            to: writeFileSync
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: truncateAtDamage(logDir, segN, off)
            to: truncateAtDamage
          when: err != nil
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(logDir)
            to: syncDir
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.d.afterTruncate()
                when: err != nil
          when: d.d.afterTruncate != nil
      - opt:
          do:
            - return: storageFailed("clear marker", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(d.d.dir, markerQuarantine))
            to: os
          when: err != nil
      - return: d.reopenSilenced(maxTerm)
        to: d.reopenSilenced
  - of: persistedSilenceTerm
    participants:
      - id: caller
        kind: actor
      - id: persistedSilenceTerm
        kind: self
      - id: os
        kind: stdlib
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(dir, fileSilent))
        to: os
      - switch:
          cases:
            - case: os.IsNotExist(err)
              do:
                - return: 0, nil
            - case: err != nil
              do:
                - return: 0, storageFailed("silence condition", err)
            - case: len(b) != 16
              do:
                - return: 0, storageFailed("silence condition", errSilenceLength)
      - return: binary.LittleEndian.Uint64(b), nil
        to: binary.LittleEndian.Uint64
  - of: DataDir.quarantinePoint
    participants:
      - id: caller
        kind: actor
      - id: DataDir.quarantinePoint
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
    steps:
      - bind: q, err
        eval: os.ReadFile(filepath.Join(d.d.dir, markerQuarantine))
        to: os
      - opt:
          do:
            - return: 0, 0, recoverRefused("no quarantine marker")
          when: err != nil
      - var:
          name: segN
          type: uint64
      - var:
          name: "off"
          type: int64
      - opt:
          do:
            - return: 0, 0, recoverRefused("unreadable quarantine marker")
          init:
            bind: _, err
            eval: fmt.Sscanf(string(q), "seg-%016x %d", &segN, &off)
            to: fmt
          when: err != nil
      - return: segN, off, nil
  - of: logSegments
    participants:
      - id: caller
        kind: actor
      - id: logSegments
        kind: self
      - id: os
        kind: stdlib
      - id: fmt
        kind: stdlib
      - id: filepath
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(logDir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("readdir", err)
          when: err != nil
      - bind: segs
        eval: map[uint64]string{}
      - loop:
          do:
            - var:
                name: "n"
                type: uint64
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, err
                  eval: fmt.Sscanf(e.Name(), "seg-%016x", &n)
                  to: fmt
                when: err != nil || e.Name() != segName(n)
            - set: segs[n]
              to: filepath
              value: filepath.Join(logDir, e.Name())
          key: _
          range: ents
          value: e
      - return: segs, nil
  - of: logMaxTerm
    participants:
      - id: caller
        kind: actor
      - id: logMaxTerm
        kind: self
      - id: logSegments
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - bind: segs, err
        eval: logSegments(logDir)
        to: logSegments
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: maxTerm
          type: uint64
      - loop:
          do:
            - bind: b, err
              eval: os.ReadFile(path)
              to: os
            - opt:
                do:
                  - return: 0, storageFailed("read segment", err)
                when: err != nil
            - set: maxTerm
              value: max(maxTerm, maxRecordTerm(b))
          key: _
          range: segs
          value: path
      - return: maxTerm, nil
  - of: truncateAtDamage
    participants:
      - id: caller
        kind: actor
      - id: truncateAtDamage
        kind: self
      - id: logSegments
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: truncateSegment
        kind: internal
    steps:
      - bind: segs, err
        eval: logSegments(logDir)
        to: logSegments
      - opt:
          do:
            - return: err
          when: err != nil
      - loop:
          do:
            - bind: st, err
              eval: os.Stat(path)
              to: os
            - opt:
                do:
                  - return: storageFailed("read segment", err)
                    to: storageFailed
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: truncateSegment(path, n, segN, off, st.Size())
                  to: truncateSegment
                when: err != nil
          key: "n"
          range: segs
          value: path
      - return: nil
  - of: maxRecordTerm
    participants:
      - id: caller
        kind: actor
      - id: maxRecordTerm
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: maxTerm
          type: uint64
      - loop:
          cond: o+recHeader+recFixed <= len(b)
          do:
            - bind: r, ok
              eval: parseRecord(b[o:])
              to: parseRecord
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - set: maxTerm
              value: max(maxTerm, recordTerm(&r))
            - op: +=
              set: o
              value: r.length - recAlign
          init: o := 0
          post: o += recAlign
      - return: maxTerm
  - of: recordTerm
    participants:
      - id: caller
        kind: actor
      - id: recordTerm
        kind: self
      - id: decodeCheckpoint
        kind: internal
    steps:
      - bind: term
        eval: r.term
      - opt:
          do:
            - set: term
              value: max(term, binary.LittleEndian.Uint64(r.data))
          when: r.kind == recHardState && len(r.data) == hardStateLen
      - opt:
          do:
            - opt:
                do:
                  - set: term
                    value: max(term, cp.hs.Term)
                init:
                  bind: cp, ok
                  eval: decodeCheckpoint(r.data)
                  to: decodeCheckpoint
                when: ok
          when: r.kind == recCheckpt
      - return: term
  - of: truncateSegment
    participants:
      - id: caller
        kind: actor
      - id: truncateSegment
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: zeroSegmentFrom
        kind: internal
    steps:
      - switch:
          cases:
            - case: n > segN || (n == segN && off == 0)
              do:
                - opt:
                    do:
                      - return: storageFailed("truncate", err)
                        to: storageFailed
                    init:
                      bind: err
                      eval: os.Remove(path)
                      to: os
                    when: err != nil
            - case: n == segN
              do:
                - return: zeroSegmentFrom(path, off, size)
                  to: zeroSegmentFrom
      - return: nil
  - of: zeroSegmentFrom
    participants:
      - id: caller
        kind: actor
      - id: zeroSegmentFrom
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: zeroFrom
        kind: internal
    steps:
      - bind: f, err
        eval: os.OpenFile(path, os.O_RDWR, 0)
        to: os
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = storageFailed("truncate", cerr)
          		}
          	}()
      - opt:
          do:
            - return: storageFailed("truncate", err)
              to: storageFailed
          init:
            bind: err
            eval: zeroFrom(f, off, size)
            to: zeroFrom
          when: err != nil
      - return: nil
  - of: silenceRecord
    participants:
      - id: caller
        kind: actor
      - id: silenceRecord
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - return: binary.LittleEndian.AppendUint64(binary.LittleEndian.AppendUint64(nil, term), index)
        to: binary.LittleEndian.AppendUint64
  - of: DataDir.reopenSilenced
    participants:
      - id: caller
        kind: actor
      - id: DataDir.reopenSilenced
        kind: self
      - id: d.d.log.Close
        kind: internal
      - id: d.d.open
        kind: internal
      - id: d.d.log.Bounds
        kind: internal
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.log.Close()
            to: d.d.log.Close
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.d.open()
            to: d.d.open
          when: err != nil
      - bind: _, last
        eval: d.d.log.Bounds()
        to: d.d.log.Bounds
      - opt:
          do:
            - return: storageFailed("silence condition", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(d.d.dir, fileSilent), silenceRecord(maxTerm, last+1))
            to: writeFileSync
          when: err != nil
      - return: syncDir(d.d.dir)
        to: syncDir
  - of: (*fileLog).silence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).silence
        kind: self
      - id: os
        kind: stdlib
      - id: l.Bounds
        kind: internal
      - id: writeFileSync
        kind: internal
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(l.dir, fileSilent))
        to: os
      - opt:
          do:
            - return: 0, 0, nil, nil
          when: os.IsNotExist(err)
      - bind: _, last
        eval: l.Bounds()
        to: l.Bounds
      - opt:
          do:
            - set: err
              value: errSilenceLength
          when: err == nil && len(b) != 16
      - opt:
          do:
            - return: ^uint64(0) >> 1, last + 1, err, nil
          when: err != nil
      - set: term, index
        value: binary.LittleEndian.Uint64(b), binary.LittleEndian.Uint64(b[8:])
      - opt:
          do:
            - set: index
              value: last + 1
            - opt:
                do:
                  - return: 0, 0, nil, err
                init:
                  bind: err
                  eval: writeFileSync(filepath.Join(l.dir, fileSilent), silenceRecord(term, index))
                  to: writeFileSync
                when: err != nil
          when: index == 0
      - return: term, index, nil, nil
  - of: (*fileLog).endSilence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).endSilence
        kind: self
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: os.Remove(filepath.Join(l.dir, fileSilent))
            to: os
          when: err != nil && !os.IsNotExist(err)
      - return: syncDir(l.dir)
        to: syncDir
  - of: (*Node).Propose
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Propose
        kind: self
      - id: n.submit
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, origin(coreconsensus.EntryTooLarge, errs.Int("bytes", len(data)))
          when: len(data) > n.cfg.MaxEntryBytes
      - bind: e
        eval: "coreconsensus.EntryValue{Kind: coreconsensus.EntryCommand, BodySum: wire.BodySum(data), Data: data}"
      - return: n.submit(ctx, e, false)
        to: n.submit
  - of: (*Node).submit
    participants:
      - id: caller
        kind: actor
      - id: (*Node).submit
        kind: self
      - id: ctx.Err
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.obs.span
        kind: internal
      - id: n.pendingProp.Add
        kind: value
      - id: n.obs.setGauge
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.record
        kind: internal
      - id: spanEvent
        kind: internal
      - id: spanEnd
        kind: internal
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, err
          init:
            bind: err
            eval: ctx.Err()
            to: ctx.Err
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, nil, n.stoppedErr()
          when: n.stopped.Load()
      - bind: p
        eval: "&proposal{entry: e, admin: admin, done: make(chan propResult, 1)}"
      - bind: start
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: span
        eval: n.obs.span(ctx, "consensus.Propose")
        to: n.obs.span
      - eval: n.pendingProp.Add(1)
        to: n.pendingProp.Add
      - eval: n.obs.setGauge(mProposalsPending, float64(n.pendingProp.Load()))
        to: n.obs.setGauge
      - defer: |-
          func() {
          		n.pendingProp.Add(-1)
          		n.obs.setGauge(mProposalsPending, float64(n.pendingProp.Load()))
          	}()
      - bind: finish
        eval:
          closure:
            params: r propResult
            results: coreconsensus.TokenValue, any, error
            steps:
              - alt:
                  - do:
                      - eval: n.obs.inc(mProposalsFailed, codeAttr(r.err))
                        to: n.obs.inc
                    when: r.err != nil
                  - do:
                      - eval: n.obs.record(mCommitLatency, n.clk.Since(start).Seconds())
                        to: n.obs.record
                      - eval: spanEvent(span, "applied", coreotel.Int64("index", int64(r.tok.Index)))
                        to: spanEvent
                    else: true
              - eval: spanEnd(span, r.err)
                to: spanEnd
              - return: r.tok, r.val, r.err
      - select:
          cases:
            - comm: n.propc <- p
            - comm: <-ctx.Done()
              do:
                - return: "finish(propResult{err: ctx.Err()})"
            - comm: <-n.stopc
              do:
                - return: "finish(propResult{err: n.stoppedErr()})"
      - return: finish(n.awaitProposal(ctx, p))
  - of: (*Node).awaitProposal
    steps:
      - select:
          cases:
            - comm: r := <-p.done
              do:
                - return: r
            - comm: <-n.loopDone
              do:
                - select:
                    cases:
                      - comm: r := <-p.done
                        do:
                          - return: r
                      - default: true
                - opt:
                    do:
                      - return: "propResult{err: n.stoppedErr()}"
                    when: p.stage.Load() == stageUnsent
                - return: "propResult{err: outcomeUnknown(\"node stopped\")}"
            - comm: <-ctx.Done()
              do:
                - opt:
                    do:
                      - return: "propResult{err: ctx.Err()}"
                    when: p.stage.Load() == stageUnsent
                - return: |-
                    propResult{err: origin(coreconsensus.OutcomeUnknown,
                    			errs.String("why", "context ended after the append"), errs.String("cause", ctx.Err().Error()))}
  - of: (*Node).handleProposals
    participants:
      - id: caller
        kind: actor
      - id: (*Node).handleProposals
        kind: self
      - id: n.r.Status
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.forward
        kind: internal
      - id: n.proposeBatch
        kind: internal
      - id: n.proposeAlone
        kind: internal
    steps:
      - bind: st
        eval: n.r.Status()
        to: n.r.Status
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - loop:
                do:
                  - eval: n.forward(p, st)
                    to: n.forward
                key: _
                range: ps
                value: p
            - return: ""
          when: st.Role != coreconsensus.RoleLeader
      - var:
          name: batch
          type: "[]*proposal"
      - var:
          name: ents
          type: "[]coreconsensus.EntryValue"
      - bind: flush
        eval:
          closure:
            steps:
              - eval: n.proposeBatch(now, st.Lead, batch, ents)
                to: n.proposeBatch
              - set: batch, ents
                value: batch[:0], ents[:0]
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: n.refuseOverload(p)
            - opt:
                do:
                  - eval: flush()
                  - eval: n.proposeAlone(now, p)
                    to: n.proposeAlone
                  - continue: true
                when: p.admin
            - set: batch
              value: append(batch, p)
            - set: ents
              value: append(ents, p.entry)
          key: _
          range: ps
          value: p
      - eval: flush()
  - of: (*Node).proposeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*Node).proposeBatch
        kind: self
      - id: n.r.Propose
        kind: value
      - id: n.appended
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(batch) == 0
      - bind: pos, code
        eval: n.r.Propose(now, ents)
        to: n.r.Propose
      - loop:
          do:
            - opt:
                do:
                  - send:
                      chan: p.done
                      value: "propResult{err: origin(sentinelOf(code), errs.String(\"leader\", lead.String()))}"
                  - continue: true
                when: code != 0
            - eval: n.appended(p, pos[i], true)
              to: n.appended
          key: i
          range: batch
          value: p
  - of: (*Node).refuseOverload
    steps:
      - opt:
          do:
            - return: "false"
          when: p.admin
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(coreconsensus.Overloaded, errs.String(\"why\", \"pending bytes\"))}"
            - return: "true"
          when: n.pendingBytes.Load()+int64(len(p.entry.Data)) > n.cfg.MaxPendingBytes
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(coreconsensus.Overloaded, errs.String(\"why\", \"apply lag\"))}"
            - return: "true"
          when: n.applyLag.Load() >= n.cfg.MaxApplyLagBytes
      - return: "false"
  - of: (*Node).proposeAlone
    participants:
      - id: caller
        kind: actor
      - id: (*Node).proposeAlone
        kind: self
      - id: n.r.Propose
        kind: value
      - id: n.appended
        kind: internal
    steps:
      - bind: pos, code
        eval: n.r.Propose(now, []coreconsensus.EntryValue{p.entry})
        to: n.r.Propose
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(sentinelOf(code))}"
            - return: ""
          when: code != 0
      - eval: n.appended(p, pos[0], true)
        to: n.appended
  - of: (*Node).appended
    participants:
      - id: caller
        kind: actor
      - id: (*Node).appended
        kind: self
      - id: p.stage.Store
        kind: value
      - id: n.pendingBytes.Add
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
    steps:
      - set: p.pos, p.local
        value: pos, local
      - eval: p.stage.Store(stageAppended)
        to: p.stage.Store
      - opt:
          do:
            - eval: n.pendingBytes.Add(int64(len(p.entry.Data)))
              to: n.pendingBytes.Add
          when: local
      - eval: n.am.Lock()
        to: n.am.Lock
      - opt:
          do:
            - bind: r, ok
              eval: n.results[pos.Index]
            - eval: n.am.Unlock()
              to: n.am.Unlock
            - opt:
                do:
                  - eval: n.pendingBytes.Add(-int64(len(p.entry.Data)))
                    to: n.pendingBytes.Add
                when: local
            - switch:
                cases:
                  - case: ok && r.term == pos.Term
                    do:
                      - send:
                          chan: p.done
                          value: "propResult{tok: n.token(pos), val: r.val}"
                  - case: ok
                    do:
                      - send:
                          chan: p.done
                          value: "propResult{err: withToken(coreconsensus.EntrySuperseded, n.token(pos))}"
                  - default: true
                    do:
                      - send:
                          chan: p.done
                          value: "propResult{err: outcomeUnknown(\"applied before its position was known\")}"
            - return: ""
          when: pos.Index <= n.applied
      - set: n.waiters[pos.Index]
        value: p
      - eval: n.am.Unlock()
        to: n.am.Unlock
  - of: (*Node).forward
    participants:
      - id: caller
        kind: actor
      - id: (*Node).forward
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: p.stage.Store
        kind: value
      - id: n.cfg.Transport.Send
        kind: value
    steps:
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: notLeader(0)}"
            - return: ""
          when: st.Lead == 0 || st.Lead == n.stamp.ID
      - opt:
          do:
            - set: n.subEpoch, n.subCount
              value: newSubEpoch(), 0
          when: n.subCount == ^uint32(0)
      - op: ++
        set: n.subCount
      - bind: ctx
        eval: n.subEpoch | uint64(n.subCount)
      - bind: kind
        eval: coreconsensus.MsgForward
      - opt:
          do:
            - set: kind
              value: coreconsensus.MsgForwardAdmin
          when: p.admin
      - bind: m
        eval: |-
          coreconsensus.MessageValue{
          		Version: 1, Group: n.cfg.Group, Kind: kind, From: n.stamp.ID, To: st.Lead,
          		Term: st.Term, Context: ctx, Entries: []coreconsensus.EntryValue{p.entry},
          	}
      - set: n.forwards[ctx]
        value: p
      - eval: n.am.Lock()
        to: n.am.Lock
      - op: ++
        set: n.keepResults
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - eval: p.stage.Store(stagePossible)
        to: p.stage.Store
      - eval: n.cfg.Transport.Send(st.Lead, wire.AppendMessage(nil, &m))
        to: n.cfg.Transport.Send
  - of: (*Node).forwardAnswered
    participants:
      - id: caller
        kind: actor
      - id: (*Node).forwardAnswered
        kind: self
      - id: n.dropForward
        kind: internal
      - id: n.appended
        kind: internal
    steps:
      - bind: p, ok
        eval: n.forwards[m.Context]
      - opt:
          do:
            - return: ""
          when: "!ok"
      - eval: n.dropForward(m.Context)
        to: n.dropForward
      - opt:
          do:
            - send:
                chan: p.done
                value: "propResult{err: origin(sentinelOf(m.Code), errs.String(\"leader\", coreconsensus.NodeID(m.RejectHint).String()))}"
            - return: ""
          when: m.Reject
      - eval: "n.appended(p, coreconsensus.PositionValue{Term: m.LogTerm, Index: m.Index}, false)"
        to: n.appended
  - of: ProposeAs
    participants:
      - id: caller
        kind: actor
      - id: ProposeAs
        kind: self
      - id: r.Propose
        kind: value
    steps:
      - var:
          name: zero
          type: R
      - bind: tok, v, err
        eval: r.Propose(ctx, data)
        to: r.Propose
      - opt:
          do:
            - return: tok, zero, err
          when: err != nil
      - opt:
          do:
            - return: tok, zero, nil
          when: v == nil
      - bind: out, ok
        eval: v.(R)
      - opt:
          do:
            - return: tok, zero, withToken(coreconsensus.ResultTypeMismatch, tok)
          when: "!ok"
      - return: tok, out, nil
  - of: (*Node).Barrier
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Barrier
        kind: self
      - id: n.clk.Now
        kind: value
      - id: n.am.Lock
        kind: value
      - id: n.token
        kind: internal
      - id: n.am.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: n.stopped.Load()
      - bind: w
        eval: "&readWait{done: make(chan readResult, 1)}"
      - bind: noLease
        eval: n.cfg.Reads != ReadLease
      - bind: start
        eval: n.clk.Now()
        to: n.clk.Now
      - bind: mode
        eval: "\"read_index\""
      - opt:
          do:
            - set: mode
              value: "\"lease\""
          when: "!noLease"
      - defer: func() { n.obs.record(mBarrierLatency, n.clk.Since(start).Seconds(), coreotel.String("mode", mode)) }()
      - opt:
          do:
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: |-
            !n.exec(func() {
            		n.readSeq++
            		ctx := n.readSeq
            		n.reads[ctx] = w
            		n.r.ReadIndex(n.clk.Now(), ctx, noLease)
            		n.handleReady()
            	})
      - var:
          name: res
          type: readResult
      - select:
          cases:
            - comm: res = <-w.done
            - comm: <-ctx.Done()
              do:
                - return: coreconsensus.TokenValue{}, origin(coreconsensus.LeadershipUnconfirmed, errs.String("cause", ctx.Err().Error()))
      - switch:
          cases:
            - case: "0"
            - case: coreconsensus.CodeNodeStopped
              do:
                - return: coreconsensus.TokenValue{}, n.stoppedErr()
            - default: true
              do:
                - return: coreconsensus.TokenValue{}, origin(sentinelOf(res.code), errs.String("leader", n.Status().Leader.String()))
          "on": res.code
      - opt:
          do:
            - opt:
                do:
                  - return: coreconsensus.TokenValue{}, ctx.Err()
                when: ctx.Err() != nil
            - return: coreconsensus.TokenValue{}, n.stoppedErr()
          when: "!n.waitApplied(ctx.Done(), res.index)"
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: tok
        eval: "n.token(coreconsensus.PositionValue{Term: n.appliedTerm, Index: n.applied})"
        to: n.token
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - return: tok, nil
  - of: (*Node).WaitApplied
    participants:
      - id: caller
        kind: actor
      - id: (*Node).WaitApplied
        kind: self
      - id: n.token
        kind: internal
      - id: origin
        kind: internal
      - id: ctx.Err
        kind: value
      - id: n.stoppedErr
        kind: internal
    steps:
      - bind: want
        eval: n.token(t.Position())
        to: n.token
      - opt:
          do:
            - return: origin(coreconsensus.LineageMismatch)
              to: origin
          when: t.Cluster != want.Cluster || t.Epoch != want.Epoch
      - opt:
          do:
            - opt:
                do:
                  - return: ctx.Err()
                    to: ctx.Err
                when: ctx.Err() != nil
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: "!n.waitApplied(ctx.Done(), t.Index)"
      - return: nil
  - of: (*Node).admin
    participants:
      - id: caller
        kind: actor
      - id: (*Node).admin
        kind: self
      - id: origin
        kind: internal
      - id: wire
        kind: package
      - id: n.submit
        kind: internal
      - id: err.Error
        kind: value
      - id: n.obs.warn
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.MembershipInvalid, errs.String("why", "operator"))
              to: origin
          when: "!coreconsensus.Operator(a.Operator).Valid()"
      - bind: data
        eval: wire.AppendAdmin(nil, &a)
        to: wire
      - bind: _, _, err
        eval: "n.submit(ctx, coreconsensus.EntryValue{Kind: kind, BodySum: wire.BodySum(data), Data: data}, true)"
        to: n.submit
      - bind: outcome
        eval: "\"ok\""
      - opt:
          do:
            - set: outcome
              to: err.Error
              value: err.Error()
          when: err != nil
      - eval: |-
          n.obs.warn("consensus: administrative operation", lstr("operator", a.Operator), lattr("kind", uint64(kind)),
          		lattr("change", uint64(a.Change)), lattr("target", uint64(a.Target)), lstr("outcome", outcome))
        to: n.obs.warn
      - return: err
  - of: (*Node).AddLearner
    participants:
      - id: caller
        kind: actor
      - id: (*Node).AddLearner
        kind: self
      - id: n.admin
        kind: internal
    steps:
      - return: |-
          n.admin(ctx, coreconsensus.EntryMembership, wire.AdminValue{
          		Operator: string(op), Change: wire.ChangeAddLearner,
          		Target: m.ID, Membership: coreconsensus.MembershipValue{Members: []coreconsensus.MemberValue{m}},
          	})
        to: n.admin
  - of: (*Node).Promote
