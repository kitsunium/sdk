          key: _
          range: errs.FieldsOf(err)
          value: f
      - return: coreconsensus.TokenValue{}, false
  - of: joinReasonOf
    participants:
      - id: caller
        kind: actor
      - id: joinReasonOf
        kind: self
      - id: err.Error
        kind: value
      - id: errs
