            - return: err
          init:
            bind: err
            eval: l.probeRuntimeDir()
            to: l.probeRuntimeDir
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: mkdirDurable(l.logDir())
            to: mkdirDurable
          when: err != nil
      - bind: st, err
        eval: readStamp(l.dir)
        to: readStamp
      - opt:
          do:
            - return: err
          when: err != nil
      - set: l.stamp
        value: st
      - return: nil
  - of: (*scanned).note
    participants:
      - id: caller
        kind: actor
      - id: (*scanned).note
        kind: self
      - id: scanRecOf
        kind: internal
      - id: decodeCheckpoint
        kind: internal
      - id: knownLayout
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: sr
        eval: scanRecOf(r, off)
        to: scanRecOf
      - opt:
          do:
            - set: s.cp, s.cpOK
              to: decodeCheckpoint
              value: decodeCheckpoint(r.data)
          when: len(recs) == 0 && r.kind == recCheckpt
      - opt:
          do:
            - set: s.layout
              to: knownLayout
              value: knownLayout(s.n, &sr, len(r.data))
          when: s.layout == nil
      - opt:
          do:
            - set: recs
              to: slices
              value: slices.Grow(recs, max(len(recs), 64))
          when: len(recs) == cap(recs)
      - return: append(recs, sr)
  - of: keptEarlier
    steps:
      - return: k != recHardState && k != recCommit
  - of: payloadAt
    steps:
      - bind: "n"
        eval: int64(binary.LittleEndian.Uint32(b[r.off:]))
      - return: "b[r.off+int64(recHeader+recFixed) : r.off+int64(recHeader)+n]"
  - of: scanRecOf
    steps:
      - return: "scanRec{off: off, batch: r.batch, term: r.term, index: r.index, length: uint32(r.length), kind: r.kind, end: r.end}"
  - of: (*fileLog).recover
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).recover
        kind: self
      - id: l.segmentNumbers
        kind: internal
      - id: l.createSegment
        kind: internal
      - id: l.scanSegments
        kind: internal
      - id: l.checkBatchSequence
        kind: internal
      - id: checkLayouts
        kind: internal
      - id: l.trimTornTail
        kind: internal
      - id: l.replay
        kind: internal
      - id: l.applyCompaction
        kind: internal
      - id: l.openSegments
        kind: internal
      - id: l.syncAtOpen
        kind: internal
      - id: l.positionTail
        kind: internal
      - id: l.markDurable
        kind: internal
      - id: l.publishNext
        kind: internal
      - id: l.prepare
        kind: internal
    steps:
      - bind: nums, err
        eval: l.segmentNumbers()
        to: l.segmentNumbers
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: "l.createSegment(1, &checkpoint{nextBatchSeq: 1})"
              to: l.createSegment
          when: len(nums) == 0
      - bind: segs, err
        eval: l.scanSegments(nums)
        to: l.scanSegments
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.checkBatchSequence(segs)
            to: l.checkBatchSequence
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: checkLayouts(segs)
            to: checkLayouts
          when: err != nil
      - bind: last
        eval: segs[len(segs)-1]
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.trimTornTail(last)
            to: l.trimTornTail
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.replay(segs)
            to: l.replay
          when: err != nil
      - eval: l.applyCompaction()
        to: l.applyCompaction
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.openSegments(segs)
            to: l.openSegments
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.syncAtOpen()
            to: l.syncAtOpen
          when: err != nil
      - bind: tail
        eval: l.segs[len(l.segs)-1]
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.positionTail(last, tail)
            to: l.positionTail
          when: err != nil
      - op: ++
        set: l.batch
      - eval: l.markDurable()
        to: l.markDurable
      - opt:
          do:
            - return: l.publishNext(0)
              to: l.publishNext
          when: last.sealed
      - eval: l.prepare(tail.n+1, l.segBytes)
        to: l.prepare
      - return: nil
  - of: (*fileLog).segmentNumbers
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).segmentNumbers
        kind: self
      - id: os
        kind: stdlib
      - id: e.Name
        kind: value
      - id: fmt
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - bind: names, err
        eval: os.ReadDir(l.logDir())
        to: os
      - opt:
          do:
            - return: nil, storageFailed("readdir", err)
          when: err != nil
      - var:
          name: nums
          type: "[]uint64"
      - loop:
          do:
            - bind: name
              eval: e.Name()
              to: e.Name
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, storageFailed("remove tmp", err)
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(l.logDir(), name))
                        to: os
                      when: err != nil
                  - continue: true
                when: strings.HasSuffix(name, ".tmp")
            - var:
                name: "n"
                type: uint64
            - opt:
                do:
                  - set: nums
                    value: append(nums, n)
                init:
                  bind: _, err
                  eval: fmt.Sscanf(name, "seg-%016x", &n)
                  to: fmt
                when: err == nil && name == segName(n)
          key: _
          range: names
          value: e
      - eval: slices.Sort(nums)
        to: slices
      - return: nums, nil
  - of: (*fileLog).scanSegments
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).scanSegments
        kind: self
      - id: l.scanSegment
        kind: internal
      - id: seq.follow
        kind: internal
      - id: replayed
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: segs
        eval: make([]*scanned, len(nums))
      - var:
          name: sb
          type: scanBufs
      - var:
          name: seq
          type: batchSeq
      - loop:
          do:
            - bind: s, err
              eval: l.scanSegment(n, &sb)
              to: l.scanSegment
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: s.seqBreak
              to: seq.follow
              value: seq.follow(s.recs)
            - alt:
                - do:
                    - set: s.data
                      value: nil
                    - set: s.recs
                      to: replayed
                      value: replayed(s.recs)
                  when: i < len(nums)-1
                - do:
                    - set: s.recs
                      to: slices
                      value: slices.Clone(s.recs)
                  else: true
            - set: segs[i]
              value: s
            - opt:
                do:
                  - return: nil, l.quarantine(n, 0, "invalid checkpoint")
                when: len(s.recs) == 0 || s.recs[0].kind != recCheckpt
            - opt:
                do:
                  - return: nil, l.quarantine(n, s.hole, "hole in a sealed segment")
                when: i < len(nums)-1 && !s.sealed
          key: i
          range: nums
          value: "n"
      - return: segs, nil
  - of: (*fileLog).scanSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).scanSegment
        kind: self
      - id: os
        kind: stdlib
      - id: sb.reader
        kind: internal
      - id: s.parse
        kind: internal
    steps:
      - bind: f, err
        eval: os.Open(filepath.Join(l.logDir(), segName(n)))
        to: os
      - opt:
          do:
            - return: nil, storageFailed("read segment", err)
          when: err != nil
      - defer: func() { abandon(f.Close()) }()
      - bind: reader, err
        eval: sb.reader(f)
        to: sb.reader
      - opt:
          do:
            - return: nil, storageFailed("read segment", err)
          when: err != nil
      - bind: s
        eval: "&scanned{n: n, size: int64(len(reader.b)), seqBreak: -1, hole: -1, trimmed: -1}"
      - bind: recs, err
        eval: s.parse(reader, sb.recs[:0])
        to: s.parse
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: sb.recs
        value: recs
      - set: s.recs
        value: recs
      - set: s.data
        value: reader.b[:reader.n]
      - return: s, nil
  - of: (*scanned).parse
    participants:
      - id: caller
        kind: actor
      - id: (*scanned).parse
        kind: self
      - id: reader.record
        kind: internal
      - id: parseRecord
        kind: internal
      - id: s.note
        kind: internal
    steps:
      - loop:
          cond: off < s.size
          do:
            - opt:
                do:
                  - return: nil, storageFailed("read segment", err)
                init:
                  bind: err
                  eval: reader.record(off)
                  to: reader.record
                when: err != nil
            - bind: r, ok
              eval: parseRecord(reader.b[off:reader.n])
              to: parseRecord
            - opt:
                do:
                  - return: recs, s.holeAt(reader, off)
                when: "!ok"
            - set: recs
              to: s.note
              value: s.note(recs, &r, off)
            - op: +=
              set: "off"
              value: int64(r.length)
            - opt:
                do:
                  - set: s.sealed
                    value: "true"
                  - break: true
                when: r.kind == recSeal
          init: off := int64(0)
      - return: recs, nil
  - of: (*scanned).holeAt
    participants:
      - id: caller
        kind: actor
      - id: (*scanned).holeAt
        kind: self
      - id: reader.upTo
        kind: internal
      - id: storageFailed
        kind: internal
      - id: unknownVersionAt
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("read segment", err)
              to: storageFailed
          init:
            bind: err
            eval: reader.upTo(s.size)
            to: reader.upTo
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: unknownVersionAt(reader.b, s.n, off)
            to: unknownVersionAt
          when: err != nil
      - set: s.hole
        value: "off"
      - return: nil
  - of: (*scanBufs).reader
    participants:
      - id: caller
        kind: actor
      - id: (*scanBufs).reader
        kind: self
      - id: f.Stat
        kind: value
      - id: st.Size
        kind: value
    steps:
      - bind: st, err
        eval: f.Stat()
        to: f.Stat
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: size
        eval: st.Size()
        to: st.Size
      - opt:
          do:
            - return: nil, errSegmentTooLarge
          when: size > math.MaxInt
      - opt:
          do:
            - set: sb.b
              value: make([]byte, 0, size)
          when: int64(cap(sb.b)) < size
      - bind: chunk
        eval: sb.chunk
      - opt:
          do:
            - set: chunk
              value: scanChunk
          when: chunk <= 0
      - return: "&segRead{f: f, b: sb.b[:size], chunk: chunk}, nil"
  - of: (*segRead).record
    participants:
      - id: caller
        kind: actor
      - id: (*segRead).record
        kind: self
      - id: r.upTo
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: r.upTo(off + int64(recHeader+recFixed))
            to: r.upTo
          when: err != nil
      - opt:
          do:
            - return: nil
          when: off+int64(recHeader) > r.n
      - return: r.upTo(off + int64(recHeader) + int64(binary.LittleEndian.Uint32(r.b[off:])))
        to: r.upTo
  - of: (*segRead).upTo
    participants:
      - id: caller
        kind: actor
      - id: (*segRead).upTo
        kind: self
      - id: io
        kind: stdlib
    steps:
      - bind: size
        eval: int64(len(r.b))
      - set: end
        value: min(end, size)
      - opt:
          do:
            - return: nil
          when: r.n >= end
      - bind: to
        eval: min(size, max(end, r.n+r.chunk))
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: io.ReadFull(r.f, r.b[r.n:to])
            to: io
          when: err != nil
      - set: r.n
        value: to
      - return: nil
  - of: (*fileLog).checkBatchSequence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).checkBatchSequence
        kind: self
      - id: l.quarantine
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: l.quarantine(s.n, s.seqBreak, "batch sequence")
                    to: l.quarantine
                when: s.seqBreak >= 0
          key: _
          range: segs
          value: s
      - return: nil
  - of: continuesBatch
    steps:
      - return: r.batch == prev.batch || (r.batch == prev.batch+1 && prev.end)
  - of: (*fileLog).trimTornTail
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).trimTornTail
        kind: self
      - id: classifyTail
        kind: internal
      - id: l.quarantine
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: last.hole < 0
      - bind: trim, why
        eval: classifyTail(last.data, last.recs, last.hole)
        to: classifyTail
      - opt:
          do:
            - return: l.quarantine(last.n, last.hole, why)
              to: l.quarantine
          when: trim < 0
      - bind: k
        eval: len(last.recs)
      - loop:
          cond: k > 0 && last.recs[k-1].off >= trim
          do:
            - op: "--"
              set: k
      - set: last.recs
        value: last.recs[:k]
      - set: last.trimmed
        value: trim
      - op: ++
        set: l.tailsTruncated
      - return: nil
  - of: (*fileLog).replay
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).replay
        kind: self
      - id: l.quarantine
        kind: internal
      - id: l.applyCheckpoint
        kind: internal
      - id: l.applyRecord
        kind: internal
    steps:
      - set: l.slots
        value: make([]slot, 0, entryRecords(segs))
      - loop:
          do:
            - opt:
                do:
                  - return: l.quarantine(s.n, 0, "checkpoint payload")
                    to: l.quarantine
                when: "!s.cpOK"
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.applyCheckpoint(si == 0, s.n, &s.cp)
                  to: l.applyCheckpoint
                when: err != nil
            - loop:
                cond: i < len(s.recs)
                do:
                  - bind: r
                    eval: "&s.recs[i]"
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: l.applyRecord(s.n, r, s.data)
                        to: l.applyRecord
                      when: err != nil
                  - set: l.batch
                    value: r.batch
                init: i := 1
                post: i++
            - opt:
                do:
                  - set: l.batch
                    value: s.recs[0].batch
                when: s.recs[0].batch > l.batch
          key: si
          range: segs
          value: s
      - return: nil
  - of: entryRecords
    steps:
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - op: ++
                          set: "n"
                      when: s.recs[i].kind == recEntry
                key: i
                range: s.recs
          key: _
          range: segs
          value: s
      - return: "n"
  - of: (*fileLog).applyCheckpoint
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyCheckpoint
        kind: self
      - id: l.quarantine
        kind: internal
    steps:
      - opt:
          do:
            - set: l.hs
              value: cp.hs
            - set: l.compact, l.compactTerm
              value: cp.compact, cp.compactTerm
            - set: l.first
              value: cp.prevIndex + 1
            - set: l.prevTerm
              value: cp.prevTerm
            - return: nil
          when: first
      - opt:
          do:
            - return: l.quarantine(seg, 0, "checkpoint does not continue the log")
              to: l.quarantine
          init:
            bind: want
            eval: l.first + uint64(len(l.slots)) - 1
          when: cp.prevIndex != want
      - set: l.hs
        value: cp.hs
      - opt:
          do:
            - set: l.compact, l.compactTerm
              value: cp.compact, cp.compactTerm
          when: cp.compact > l.compact
      - return: nil
  - of: (*fileLog).applyRecord
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyRecord
        kind: self
      - id: l.applyEntry
        kind: internal
      - id: l.applyTruncate
        kind: internal
      - id: l.applyHardState
        kind: internal
      - id: l.applyCompactRecord
        kind: internal
      - id: unknownLayout
        kind: internal
    steps:
      - switch:
          cases:
            - case: recEntry
              do:
                - return: l.applyEntry(seg, r)
                  to: l.applyEntry
            - case: recTruncate
              do:
                - eval: l.applyTruncate(r.index)
                  to: l.applyTruncate
            - case: recHardState
              do:
                - return: l.applyHardState(seg, r, payloadAt(data, r))
                  to: l.applyHardState
            - case: recCommit
              do:
                - set: l.hs.Commit
                  value: max(l.hs.Commit, r.index)
            - case: recCompact
              do:
                - eval: l.applyCompactRecord(r.index, r.term)
                  to: l.applyCompactRecord
            - case: recSeal
            - default: true
              do:
                - return: unknownLayout(seg, r, "record_kind", int(r.kind))
                  to: unknownLayout
          "on": r.kind
      - return: nil
  - of: (*fileLog).applyEntry
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyEntry
        kind: self
      - id: l.quarantine
        kind: internal
    steps:
      - opt:
          do:
            - return: l.quarantine(seg, r.off, "index out of sequence")
              to: l.quarantine
          when: r.index != l.first+uint64(len(l.slots))
      - set: l.slots
        value: "append(l.slots, slot{seg: seg, off: r.off, term: r.term})"
      - return: nil
  - of: knownLayout
    participants:
      - id: caller
        kind: actor
      - id: knownLayout
        kind: self
      - id: unknownLayout
        kind: internal
    steps:
      - switch:
          cases:
            - case: recEntry, recTruncate, recCheckpt, recSeal, recCompact, recCommit
              do:
                - return: nil
            - case: recHardState
              do:
                - opt:
                    do:
                      - return: unknownLayout(seg, r, "hard_state_bytes", payload)
                        to: unknownLayout
                    when: payload != hardStateLen
                - return: nil
            - default: true
              do:
                - return: unknownLayout(seg, r, "record_kind", int(r.kind))
                  to: unknownLayout
          "on": r.kind
  - of: (*fileLog).applyHardState
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyHardState
        kind: self
      - id: unknownLayout
        kind: internal
      - id: decodeHS
        kind: internal
    steps:
      - opt:
          do:
            - return: unknownLayout(seg, r, "hard_state_bytes", len(pay))
              to: unknownLayout
          when: len(pay) != hardStateLen
      - set: l.hs
        to: decodeHS
        value: decodeHS(pay)
      - return: nil
  - of: unknownLayout
    participants:
      - id: caller
        kind: actor
      - id: unknownLayout
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: |-
          origin(coreconsensus.VersionUnsupported, errs.String("segment", segName(seg)),
          		errs.Int64("offset", r.off), errs.Int(field, v))
        to: origin
  - of: (*fileLog).applyCompactRecord
    steps:
      - opt:
          do:
            - bind: drop
              eval: min(index-l.first+1, uint64(len(l.slots)))
            - set: l.slots
              value: l.slots[drop:]
            - set: l.first, l.prevTerm
              value: index+1, term
          when: index >= l.first
      - opt:
          do:
            - set: l.compact, l.compactTerm
              value: index, term
          when: index >= l.compact
  - of: (*fileLog).applyTruncate
    steps:
      - switch:
          cases:
            - case: index >= l.first && index <= l.first+uint64(len(l.slots))
              do:
                - set: l.slots
                  value: l.slots[:index-l.first]
            - case: index < l.first
              do:
                - set: l.first, l.slots, l.prevTerm
                  value: index, nil, 0
  - of: decodeHS
    steps:
      - return: |-
          coreconsensus.HardState{
          		Term: binary.LittleEndian.Uint64(b),
          		Vote: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[8:])), Commit: binary.LittleEndian.Uint64(b[16:]),
          	}
  - of: (*fileLog).applyCompaction
    steps:
      - opt:
          do:
            - return: ""
          when: l.compact < l.first
      - bind: drop
        eval: min(l.compact-l.first+1, uint64(len(l.slots)))
      - opt:
          do:
            - set: l.prevTerm
              value: l.slots[drop-1].term
          when: drop > 0
      - set: l.slots
        value: l.slots[drop:]
      - set: l.first
        value: l.compact + 1
      - opt:
          do:
            - set: l.prevTerm
              value: l.compactTerm
          when: drop == 0
  - of: (*fileLog).openSegments
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).openSegments
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: l.occupied.Add
        kind: value
    steps:
      - loop:
          do:
            - bind: f, err
              eval: os.OpenFile(filepath.Join(l.logDir(), segName(s.n)), os.O_RDWR, 0)
              to: os
            - opt:
                do:
                  - return: storageFailed("open segment", err)
                    to: storageFailed
                when: err != nil
            - set: l.segs
              value: "append(l.segs, &segment{n: s.n, f: f, size: s.size})"
            - eval: l.occupied.Add(s.size)
              to: l.occupied.Add
          key: _
          range: segs
          value: s
      - return: nil
  - of: (*fileLog).syncAtOpen
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).syncAtOpen
        kind: self
      - id: l.syncFailedAtOpen
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: l.syncFailedAtOpen("sync at open", err)
                    to: l.syncFailedAtOpen
                init:
                  bind: err
                  eval: syncFileAtOpen(s.f)
                when: err != nil
