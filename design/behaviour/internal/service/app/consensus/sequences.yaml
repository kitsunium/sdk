        value: coreconsensus.NodeID(binary.LittleEndian.Uint64(body[p:]))
      - op: +=
        set: p
        value: u64Bytes
      - eval: copy(s.Incarnation[:], body[p:])
      - op: +=
        set: p
        value: len(s.Incarnation)
