      - id: sanitizeReason
        kind: internal
      - id: origin
        kind: internal
    steps:
      - set: reason
        to: sanitizeReason
        value: sanitizeReason(reason)
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          when: reason == ""
      - return: origin(sentinelOf(code), errs.String("reason", reason))
        to: origin
  - of: align8
    steps:
