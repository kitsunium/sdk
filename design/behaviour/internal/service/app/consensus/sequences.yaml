    participants:
      - id: caller
        kind: actor
      - id: advanceFounding
        kind: self
      - id: log.Bounds
        kind: value
      - id: log.WriteStamp
        kind: value
    steps:
      - switch:
          cases:
            - case: coreconsensus.StampMember
              do:
                - opt:
                    do:
                      - return: true, nil
                    when: stamp.Founding == digest
                - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "already founded with another list"))
            - case: coreconsensus.StampBootstrapPending
              do:
                - opt:
                    do:
                      - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "bootstrap pending with another list"))
                    when: stamp.Founding != digest
            - case: coreconsensus.StampJoining
              do:
                - opt:
                    do:
                      - return: false, origin(coreconsensus.BootstrapRefused, errs.String("why", "the log already holds entries"))
                    init:
                      bind: first, last
                      eval: log.Bounds()
                      to: log.Bounds
                    when: last >= first
                - set: stamp.State, stamp.Founding
                  value: coreconsensus.StampBootstrapPending, digest
                - opt:
                    do:
                      - return: false, storageFailed("stamp", err)
                    init:
                      bind: err
                      eval: log.WriteStamp(*stamp)
                      to: log.WriteStamp
                    when: err != nil
            - default: true
              do:
                - return: false, origin(coreconsensus.DataDirMismatch, errs.String("why", "unknown stamp state"))
          "on": stamp.State
      - return: false, nil
  - of: writeFoundingEntry
    participants:
      - id: caller
        kind: actor
      - id: writeFoundingEntry
        kind: self
      - id: cfg.Log.Bounds
        kind: value
      - id: TimingDefaults
        kind: internal
      - id: wire
