      - id: alsoFailed
        kind: self
      - id: errs
        kind: package
      - id: errors
        kind: stdlib
    steps:
      - opt:
          do:
            - return: err
          when: failure == nil || err == nil
      - opt:
          do:
            - return: errs.Wrap(err, errs.WrapParams{}, errs.String(op, failure.Error()))
              to: errs
          init:
            bind: _, ok
            eval: errs.CodeOf(err)
            to: errs
          when: ok
      - return: errors.Join(err, failure)
        to: errors
