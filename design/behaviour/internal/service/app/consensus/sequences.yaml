          do:
            - opt:
                do:
                  - return: io.EOF
                when: err == io.EOF
            - return: snapshotCorrupt("short chunk header")
              to: snapshotCorrupt
          init:
            bind: _, err
            eval: io.ReadFull(c.r, h[:])
            to: io
          when: err != nil
      - bind: encLen
        eval: int64(binary.LittleEndian.Uint32(h[0:]))
      - bind: decLen
        eval: int64(binary.LittleEndian.Uint32(h[4:]))
