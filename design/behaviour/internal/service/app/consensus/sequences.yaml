            to: wire
          when: err == nil && lane == coreconsensus.LaneControl
      - select:
          cases:
            - comm: "q <- memFrame{from: t.id, frame: bytes.Clone(frame)}"
            - default: true
  - of: (*MemoryTransport).Stream
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryTransport).Stream
        kind: self
      - id: t.net.route
        kind: internal
      - id: origin
        kind: internal
      - id: dst.mu.Lock
        kind: value
      - id: dst.mu.Unlock
        kind: value
      - id: rc.Close
        kind: value
    steps:
      - bind: dst
        eval: t.net.route(t.id, to)
        to: t.net.route
      - opt:
          do:
            - return: origin(coreconsensus.PeerRejected, errs.String("why", "unreachable"))
              to: origin
          when: dst == nil
      - eval: dst.mu.Lock()
        to: dst.mu.Lock
      - bind: of, in
        eval: dst.offer, dst.install
      - eval: dst.mu.Unlock()
        to: dst.mu.Unlock
      - opt:
          do:
            - return: origin(coreconsensus.PeerRejected, errs.String("why", "unbound"))
              to: origin
          when: of == nil
      - bind: peer
