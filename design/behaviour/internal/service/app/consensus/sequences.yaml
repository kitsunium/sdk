          do:
            - eval: noteUnmarked(l.dir)
              to: noteUnmarked
          when: dirErr != nil && runErr != nil
      - set: err
        to: alsoFailed
        value: alsoFailed(err, "data_dir_marker", dirErr)
      - return: alsoFailed(err, "boot_marker", runErr)
        to: alsoFailed
