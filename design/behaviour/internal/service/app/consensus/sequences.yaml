            to: cfg.Log.Append
          when: err != nil
      - opt:
          do:
            - return: storageFailed("sync", err)
              to: storageFailed
          init:
            bind: err
            eval: cfg.Log.Sync()
            to: cfg.Log.Sync
          when: err != nil
      - return: nil
  - of: TimingDefaults
