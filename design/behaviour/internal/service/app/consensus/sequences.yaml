        eval: of(peer, offer)
      - opt:
          do:
            - return: nil
          when: acc.Held
      - opt:
          do:
            - return: origin(sentinelOf(acc.Refused))
              to: origin
          when: acc.Refused != 0
      - bind: rc, err
        eval: open(acc.Offset)
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: ierr
        eval: "in(coreconsensus.InstallParams{Ctx: ctx, From: peer, Offer: offer, Offset: acc.Offset, Body: rc})"
      - opt:
          do:
            - return: cerr
          init:
            bind: cerr
            eval: rc.Close()
            to: rc.Close
          when: cerr != nil && ierr == nil
      - return: ierr
  - of: (*MemoryTransport).Bind
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryTransport).Bind
        kind: self
      - id: t.run
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - set: t.deliver, t.offer, t.install, t.join
        value: deliver, offer, install, join
      - opt:
          do:
            - set: t.cur
              value: "&memRun{stop: make(chan struct{}), done: make(chan struct{})}"
            - go: t.run(t.cur)
              to: t.run
          when: t.cur == nil
      - return: nil
  - of: (*MemoryTransport).run
    participants:
      - id: caller
        kind: actor
