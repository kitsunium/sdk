                  when: jr != nil
                - do:
                    - set: pos, code
                      value: j(ctx, peer, req)
                  else: true
            - opt:
                do:
                  - return: pos, nil
                when: code == 0
            - set: last
              to: joinRefused
              value: joinRefused(code, reason)
