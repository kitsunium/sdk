  - of: storageFailed
    participants:
      - id: caller
        kind: actor
      - id: storageFailed
        kind: self
      - id: origin
        kind: internal
    steps:
      - bind: f
        eval: "[]errs.FieldValue{errs.String(\"op\", op)}"
      - opt:
          do:
            - set: f
              value: append(f, errs.String("cause", cause.Error()))
          when: cause != nil
      - return: origin(coreconsensus.StorageFailed, f...)
        to: origin
  - of: pinnedSnapshot
    participants:
      - id: caller
        kind: actor
      - id: pinnedSnapshot
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.AdminPreconditionFailed, errs.String("why", errPinned.Error()))
        to: origin
  - of: notLeader
    participants:
      - id: caller
        kind: actor
      - id: notLeader
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.NotLeader, errs.String("leader", hint.String()))
        to: origin
  - of: outcomeUnknown
    participants:
      - id: caller
        kind: actor
      - id: outcomeUnknown
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(coreconsensus.OutcomeUnknown, errs.String("why", why))
        to: origin
  - of: withToken
    participants:
      - id: caller
        kind: actor
      - id: withToken
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: origin(sentinel, errs.String("token", hex.EncodeToString(wire.AppendToken(nil, t))))
        to: origin
  - of: sentinelOf
    steps:
      - opt:
          do:
            - return: s
          init:
            bind: s, ok
            eval: sentinelByCode[c]
          when: ok
      - return: coreconsensus.OutcomeUnknown
  - of: LeaderHint
    participants:
      - id: caller
        kind: actor
      - id: LeaderHint
        kind: self
      - id: strconv
        kind: stdlib
      - id: coreconsensus
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - bind: v, perr
                    eval: strconv.ParseUint(f.StringValue(), 10, 64)
                    to: strconv
                  - opt:
                      do:
                        - return: coreconsensus.NodeID(v), true
                          to: coreconsensus
                      when: perr == nil && v != 0
                when: f.Key() == "leader"
          key: _
          range: errs.FieldsOf(err)
          value: f
      - return: 0, false
  - of: TokenOf
    participants:
      - id: caller
        kind: actor
      - id: TokenOf
        kind: self
      - id: hex
        kind: stdlib
      - id: wire
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - bind: b, herr
                    eval: hex.DecodeString(f.StringValue())
                    to: hex
                  - opt:
                      do:
                        - return: coreconsensus.TokenValue{}, false
                      when: herr != nil
                  - bind: t, perr
                    eval: wire.ParseToken(b)
                    to: wire
                  - return: t, perr == nil
                when: f.Key() == "token"
          key: _
          range: errs.FieldsOf(err)
          value: f
      - return: coreconsensus.TokenValue{}, false
  - of: joinReasonOf
    participants:
      - id: caller
        kind: actor
      - id: joinReasonOf
        kind: self
      - id: err.Error
        kind: value
      - id: errs
        kind: package
      - id: sanitizeReason
        kind: internal
    steps:
      - bind: msg
        eval: err.Error()
        to: err.Error
      - opt:
          do:
            - set: msg
              to: errs
              value: errs.PublicOf(err)
          init:
            bind: _, ok
            eval: errs.CodeOf(err)
            to: errs
          when: ok
      - return: sanitizeReason(msg)
        to: sanitizeReason
  - of: sanitizeReason
    participants:
      - id: caller
        kind: actor
      - id: sanitizeReason
        kind: self
      - id: b.WriteRune
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - var:
          name: b
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: r == utf8.RuneError || !unicode.IsPrint(r)
            - opt:
                do:
                  - break: true
                when: b.Len()+utf8.RuneLen(r) > MaxJoinReasonBytes
            - eval: b.WriteRune(r)
              to: b.WriteRune
          key: _
          range: s
          value: r
      - return: strings.TrimSpace(b.String())
        to: strings
  - of: JoinRefusalReason
    participants:
      - id: caller
        kind: actor
      - id: JoinRefusalReason
        kind: self
      - id: f.StringValue
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: f.StringValue(), true
                    to: f.StringValue
                when: f.Key() == "reason" && f.StringValue() != ""
          key: _
          range: errs.FieldsOf(err)
          value: f
      - return: "\"\", false"
  - of: joinRefused
    participants:
      - id: caller
        kind: actor
      - id: joinRefused
        kind: self
      - id: sanitizeReason
        kind: internal
      - id: origin
        kind: internal
    steps:
      - set: reason
        to: sanitizeReason
        value: sanitizeReason(reason)
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          when: reason == ""
      - return: origin(sentinelOf(code), errs.String("reason", reason))
        to: origin
  - of: align8
    steps:
      - return: (n + 7) &^ 7
  - of: appendRecord
    participants:
      - id: caller
        kind: actor
      - id: appendRecord
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: sealRecord
        kind: internal
    steps:
      - bind: start
        eval: len(dst)
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(recFixed+len(r.data)))
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, 0)
      - set: dst
        value: append(dst, recVersion, r.kind, boolByte(r.end), 0)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, r.batch)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, r.term)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, r.index)
      - set: dst
        value: append(dst, r.ekind, 0, 0, 0)
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, r.ever)
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, r.body)
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, r.chain)
      - set: dst
        value: append(dst, r.data...)
      - eval: sealRecord(dst[start:])
        to: sealRecord
      - loop:
          cond: (len(dst)-start)%8 != 0
          do:
            - set: dst
              value: append(dst, 0)
      - return: dst
  - of: boolByte
    steps:
      - opt:
          do:
            - return: "1"
          when: v
      - return: "0"
  - of: sealRecord
    participants:
      - id: caller
        kind: actor
      - id: sealRecord
        kind: self
      - id: binary.LittleEndian.Uint32
        kind: value
      - id: binary.LittleEndian.PutUint32
        kind: value
    steps:
      - bind: "n"
        eval: binary.LittleEndian.Uint32(b)
        to: binary.LittleEndian.Uint32
      - eval: binary.LittleEndian.PutUint32(b[4:], crc32.Checksum(b[recHeader:recHeader+int(n)], castagnoli))
        to: binary.LittleEndian.PutUint32
  - of: parseRecord
    steps:
      - opt:
          do:
            - return: rec, false
          when: len(b) < recHeader+recFixed
      - bind: "n"
        eval: int(binary.LittleEndian.Uint32(b))
      - opt:
          do:
            - return: rec, false
          when: n < recFixed || recHeader+n > len(b)
      - bind: body
        eval: "b[recHeader : recHeader+n]"
      - opt:
          do:
            - return: rec, false
          when: crc32.Checksum(body, castagnoli) != binary.LittleEndian.Uint32(b[4:]) || body[0] != recVersion
      - set: rec
        value: |-
          record{
          		kind: body[1], end: body[2] != 0,
          		batch: binary.LittleEndian.Uint64(body[4:]), term: binary.LittleEndian.Uint64(body[12:]),
          		index: binary.LittleEndian.Uint64(body[20:]), ekind: body[28],
          		ever: binary.LittleEndian.Uint32(body[32:]), body: binary.LittleEndian.Uint32(body[36:]),
          		chain: binary.LittleEndian.Uint32(body[40:]), data: body[recFixed:], length: align8(recHeader + n),
          	}
      - return: rec, true
  - of: checkpoint.encode
    participants:
      - id: caller
        kind: actor
      - id: checkpoint.encode
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: make([]byte, 0, checkpointLen)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.hs.Term)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, uint64(c.hs.Vote))
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.hs.Commit)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.prevIndex)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.prevTerm)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.compact)
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, c.compactTerm)
      - return: binary.LittleEndian.AppendUint64(b, c.nextBatchSeq)
        to: binary.LittleEndian.AppendUint64
  - of: decodeCheckpoint
    participants:
      - id: caller
        kind: actor
      - id: decodeCheckpoint
        kind: self
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - opt:
          do:
            - return: checkpoint{}, false
          when: len(b) != checkpointLen
      - bind: u
        eval:
          closure:
            params: i int
            results: uint64
            steps:
              - return: binary.LittleEndian.Uint64(b[8*i:])
                to: binary.LittleEndian.Uint64
      - return: |-
          checkpoint{
          		hs:        coreconsensus.HardState{Term: u(0), Vote: coreconsensus.NodeID(u(1)), Commit: u(2)},
          		prevIndex: u(3), prevTerm: u(4), compact: u(5), compactTerm: u(6), nextBatchSeq: u(7),
          	}, true
  - of: encodeHS
    participants:
      - id: caller
        kind: actor
      - id: encodeHS
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: binary.LittleEndian.AppendUint64(nil, hs.Term)
        to: binary.LittleEndian.AppendUint64
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, uint64(hs.Vote))
      - return: binary.LittleEndian.AppendUint64(b, hs.Commit)
        to: binary.LittleEndian.AppendUint64
  - of: segName
    participants:
      - id: caller
        kind: actor
      - id: segName
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: fmt.Sprintf("seg-%016x", n)
        to: fmt
  - of: (*fileLog).logDir
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).logDir
        kind: self
      - id: filepath
        kind: stdlib
    steps:
      - return: filepath.Join(l.dir, "log")
        to: filepath
  - of: quarantined
    participants:
      - id: caller
        kind: actor
      - id: quarantined
        kind: self
      - id: origin
        kind: internal
    steps:
      - return: |-
          origin(coreconsensus.LogQuarantined, errs.String("segment", segName(seg)),
          		errs.Int64("offset", off), errs.String("why", why))
        to: origin
  - of: openFileLog
    participants:
      - id: caller
        kind: actor
      - id: openFileLog
        kind: self
      - id: mkdirDurable
        kind: internal
      - id: readStamp
        kind: internal
      - id: os
        kind: stdlib
      - id: origin
        kind: internal
      - id: l.recover
        kind: internal
    steps:
      - opt:
          do:
            - set: segBytes
              value: DefaultSegmentBytes
          when: segBytes <= 0
      - bind: l
        eval: "&fileLog{dir: dd.dir, segBytes: segBytes, dd: dd, first: 1, pendingLast: -1, runDir: runtimeMarkerDir()}"
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: mkdirDurable(l.logDir())
            to: mkdirDurable
          when: err != nil
      - bind: st, err
        eval: readStamp(dd.dir)
        to: readStamp
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: l.stamp
        value: st
      - opt:
          do:
            - set: l.refuse
              to: origin
              value: origin(coreconsensus.LogQuarantined, errs.String("marker", strings.TrimSpace(string(q))))
            - return: l, nil
          init:
            bind: q, err
            eval: os.ReadFile(filepath.Join(dd.dir, markerQuarantine))
            to: os
          when: err == nil
      - opt:
          do:
            - opt:
                do:
                  - set: l.refuse
                    value: err
                  - return: l, nil
                when: errs.HasCode(err, coreconsensus.CodeLogQuarantined)
            - return: nil, err
          init:
            bind: err
            eval: l.recover()
            to: l.recover
          when: err != nil
      - return: l, nil
  - of: (*fileLog).recover
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).recover
        kind: self
      - id: l.segmentNumbers
        kind: internal
      - id: l.createSegment
        kind: internal
      - id: l.scanSegments
        kind: internal
      - id: l.checkBatchSequence
        kind: internal
      - id: l.trimTornTail
        kind: internal
      - id: l.replay
        kind: internal
      - id: l.applyCompaction
        kind: internal
      - id: l.openSegments
        kind: internal
      - id: l.syncAtOpen
        kind: internal
      - id: l.positionTail
        kind: internal
      - id: l.markDurable
        kind: internal
      - id: l.publishNext
        kind: internal
      - id: l.prepare
        kind: internal
    steps:
      - bind: nums, err
        eval: l.segmentNumbers()
        to: l.segmentNumbers
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: "l.createSegment(1, &checkpoint{nextBatchSeq: 1})"
              to: l.createSegment
          when: len(nums) == 0
      - bind: segs, err
        eval: l.scanSegments(nums)
        to: l.scanSegments
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.checkBatchSequence(segs)
            to: l.checkBatchSequence
          when: err != nil
      - bind: last
        eval: segs[len(segs)-1]
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.trimTornTail(last)
            to: l.trimTornTail
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.replay(segs)
            to: l.replay
          when: err != nil
      - eval: l.applyCompaction()
        to: l.applyCompaction
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.openSegments(segs)
            to: l.openSegments
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.syncAtOpen()
            to: l.syncAtOpen
          when: err != nil
      - bind: tail
        eval: l.segs[len(l.segs)-1]
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.positionTail(last, tail)
            to: l.positionTail
          when: err != nil
      - op: ++
        set: l.batch
      - eval: l.markDurable()
        to: l.markDurable
      - opt:
          do:
            - return: l.publishNext(0)
              to: l.publishNext
          when: last.sealed
      - eval: l.prepare(tail.n+1, l.segBytes)
        to: l.prepare
      - return: nil
  - of: (*fileLog).segmentNumbers
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).segmentNumbers
        kind: self
      - id: os
        kind: stdlib
      - id: e.Name
        kind: value
      - id: fmt
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - bind: names, err
        eval: os.ReadDir(l.logDir())
        to: os
      - opt:
          do:
            - return: nil, storageFailed("readdir", err)
          when: err != nil
      - var:
          name: nums
          type: "[]uint64"
      - loop:
          do:
            - bind: name
              eval: e.Name()
              to: e.Name
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, storageFailed("remove tmp", err)
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(l.logDir(), name))
                        to: os
                      when: err != nil
                  - continue: true
                when: strings.HasSuffix(name, ".tmp")
            - var:
                name: "n"
                type: uint64
            - opt:
                do:
                  - set: nums
                    value: append(nums, n)
                init:
                  bind: _, err
                  eval: fmt.Sscanf(name, "seg-%016x", &n)
                  to: fmt
                when: err == nil && name == segName(n)
          key: _
          range: names
          value: e
      - eval: slices.Sort(nums)
        to: slices
      - return: nums, nil
  - of: (*fileLog).scanSegments
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).scanSegments
        kind: self
      - id: l.scanSegment
        kind: internal
    steps:
      - bind: segs
        eval: make([]*scanned, len(nums))
      - loop:
          do:
            - bind: s, err
              eval: l.scanSegment(n)
              to: l.scanSegment
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: segs[i]
              value: s
            - opt:
                do:
                  - return: nil, l.quarantine(n, 0, "invalid checkpoint")
                when: len(s.recs) == 0 || s.recs[0].kind != recCheckpt
            - opt:
                do:
                  - return: nil, l.quarantine(n, s.hole, "hole in a sealed segment")
                when: i < len(nums)-1 && !s.sealed
          key: i
          range: nums
          value: "n"
      - return: segs, nil
  - of: (*fileLog).scanSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).scanSegment
        kind: self
      - id: os
        kind: stdlib
      - id: parseRecord
        kind: internal
    steps:
      - bind: b, err
        eval: os.ReadFile(filepath.Join(l.logDir(), segName(n)))
        to: os
      - opt:
          do:
            - return: nil, storageFailed("read segment", err)
          when: err != nil
      - bind: s
        eval: "&scanned{n: n, data: b, hole: -1, trimmed: -1}"
      - bind: limit
        eval: int64(len(b))
      - var:
          name: "off"
          type: int64
      - loop:
          cond: off < limit
          do:
            - bind: r, ok
              eval: parseRecord(b[off:limit])
              to: parseRecord
            - opt:
                do:
                  - set: s.hole
                    value: "off"
                  - break: true
                when: "!ok"
            - set: r.off
              value: "off"
            - set: s.recs
              value: append(s.recs, r)
            - op: +=
              set: "off"
              value: int64(r.length)
            - opt:
                do:
                  - set: s.sealed
                    value: "true"
                  - break: true
                when: r.kind == recSeal
      - return: s, nil
  - of: (*fileLog).checkBatchSequence
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).checkBatchSequence
        kind: self
      - id: l.quarantine
        kind: internal
    steps:
      - var:
          name: prev
          type: "*record"
      - loop:
          do:
            - loop:
                do:
                  - bind: r
                    eval: "&s.recs[i]"
                  - opt:
                      do:
                        - return: l.quarantine(s.n, r.off, "batch sequence")
                          to: l.quarantine
                      when: prev != nil && !continuesBatch(prev, r)
                  - set: prev
                    value: r
                key: i
                range: s.recs
          key: _
          range: segs
          value: s
      - return: nil
  - of: continuesBatch
    steps:
      - return: r.batch == prev.batch || (r.batch == prev.batch+1 && prev.end)
  - of: (*fileLog).trimTornTail
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).trimTornTail
        kind: self
      - id: classifyTail
        kind: internal
      - id: l.quarantine
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: last.hole < 0
      - bind: trim, why
        eval: classifyTail(last.data, last.recs, last.hole)
        to: classifyTail
      - opt:
          do:
            - return: l.quarantine(last.n, last.hole, why)
              to: l.quarantine
          when: trim < 0
      - bind: k
        eval: len(last.recs)
      - loop:
          cond: k > 0 && last.recs[k-1].off >= trim
          do:
            - op: "--"
              set: k
      - set: last.recs
        value: last.recs[:k]
      - set: last.trimmed
        value: trim
      - op: ++
        set: l.tailsTruncated
      - return: nil
  - of: (*fileLog).replay
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).replay
        kind: self
      - id: decodeCheckpoint
        kind: internal
      - id: l.quarantine
        kind: internal
      - id: l.applyCheckpoint
        kind: internal
      - id: l.applyRecord
        kind: internal
    steps:
      - loop:
          do:
            - bind: cp, ok
              eval: decodeCheckpoint(s.recs[0].data)
              to: decodeCheckpoint
            - opt:
                do:
                  - return: l.quarantine(s.n, 0, "checkpoint payload")
                    to: l.quarantine
                when: "!ok"
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.applyCheckpoint(si == 0, s.n, &cp)
                  to: l.applyCheckpoint
                when: err != nil
            - loop:
                do:
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: l.applyRecord(s.n, &r)
                        to: l.applyRecord
                      when: err != nil
                  - set: l.batch
                    value: r.batch
                key: _
                range: s.recs[1:]
                value: r
            - opt:
                do:
                  - set: l.batch
                    value: s.recs[0].batch
                when: s.recs[0].batch > l.batch
          key: si
          range: segs
          value: s
      - return: nil
  - of: (*fileLog).applyCheckpoint
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyCheckpoint
        kind: self
      - id: l.quarantine
        kind: internal
    steps:
      - opt:
          do:
            - set: l.hs
              value: cp.hs
            - set: l.compact, l.compactTerm
              value: cp.compact, cp.compactTerm
            - set: l.first
              value: cp.prevIndex + 1
            - set: l.prevTerm
              value: cp.prevTerm
            - return: nil
          when: first
      - opt:
          do:
            - return: l.quarantine(seg, 0, "checkpoint does not continue the log")
              to: l.quarantine
          init:
            bind: want
            eval: l.first + uint64(len(l.slots)) - 1
          when: cp.prevIndex != want
      - set: l.hs
        value: cp.hs
      - opt:
          do:
            - set: l.compact, l.compactTerm
              value: cp.compact, cp.compactTerm
          when: cp.compact > l.compact
      - return: nil
  - of: (*fileLog).applyRecord
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).applyRecord
        kind: self
      - id: l.quarantine
        kind: internal
      - id: l.applyTruncate
        kind: internal
      - id: decodeHS
        kind: internal
      - id: l.applyCompactRecord
        kind: internal
    steps:
      - switch:
          cases:
            - case: recEntry
              do:
                - opt:
                    do:
                      - return: l.quarantine(seg, r.off, "index out of sequence")
                        to: l.quarantine
                    when: r.index != l.first+uint64(len(l.slots))
                - set: l.slots
                  value: "append(l.slots, slot{seg: seg, off: r.off, term: r.term})"
            - case: recTruncate
              do:
                - eval: l.applyTruncate(r.index)
                  to: l.applyTruncate
            - case: recHardState
              do:
                - opt:
                    do:
                      - set: l.hs
                        to: decodeHS
                        value: decodeHS(r.data)
                    when: len(r.data) == hardStateLen
            - case: recCommit
              do:
                - set: l.hs.Commit
                  value: max(l.hs.Commit, r.index)
            - case: recCompact
              do:
                - eval: l.applyCompactRecord(r.index, r.term)
                  to: l.applyCompactRecord
          "on": r.kind
      - return: nil
  - of: (*fileLog).applyCompactRecord
    steps:
      - opt:
          do:
            - bind: drop
              eval: min(index-l.first+1, uint64(len(l.slots)))
            - set: l.slots
              value: l.slots[drop:]
            - set: l.first, l.prevTerm
              value: index+1, term
          when: index >= l.first
      - opt:
          do:
            - set: l.compact, l.compactTerm
              value: index, term
          when: index >= l.compact
  - of: (*fileLog).applyTruncate
    steps:
      - switch:
          cases:
            - case: index >= l.first && index <= l.first+uint64(len(l.slots))
              do:
                - set: l.slots
                  value: l.slots[:index-l.first]
            - case: index < l.first
              do:
                - set: l.first, l.slots, l.prevTerm
                  value: index, nil, 0
  - of: decodeHS
    steps:
      - return: |-
          coreconsensus.HardState{
          		Term: binary.LittleEndian.Uint64(b),
          		Vote: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[8:])), Commit: binary.LittleEndian.Uint64(b[16:]),
          	}
  - of: (*fileLog).applyCompaction
    steps:
      - opt:
          do:
            - return: ""
          when: l.compact < l.first
      - bind: drop
        eval: min(l.compact-l.first+1, uint64(len(l.slots)))
      - opt:
          do:
            - set: l.prevTerm
              value: l.slots[drop-1].term
          when: drop > 0
      - set: l.slots
        value: l.slots[drop:]
      - set: l.first
        value: l.compact + 1
      - opt:
          do:
            - set: l.prevTerm
              value: l.compactTerm
          when: drop == 0
  - of: (*fileLog).openSegments
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).openSegments
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
    steps:
      - loop:
          do:
            - bind: f, err
              eval: os.OpenFile(filepath.Join(l.logDir(), segName(s.n)), os.O_RDWR, 0)
              to: os
            - opt:
                do:
                  - return: storageFailed("open segment", err)
                    to: storageFailed
                when: err != nil
            - set: l.segs
              value: "append(l.segs, &segment{n: s.n, f: f, size: int64(len(s.data))})"
          key: _
          range: segs
          value: s
      - return: nil
  - of: (*fileLog).syncAtOpen
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).syncAtOpen
        kind: self
      - id: datasync
        kind: internal
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("sync at open", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: datasync(s.f)
                  to: datasync
                when: err != nil
            - op: ++
              set: l.syncedAtOpen
          key: _
          range: l.segs
          value: s
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("sync at open", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: syncDir(dir)
                  to: syncDir
                when: err != nil
          key: _
          range: "[]string{l.logDir(), l.dir}"
          value: dir
      - return: nil
  - of: (*fileLog).positionTail
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).positionTail
        kind: self
      - id: zeroFrom
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - switch:
          cases:
            - case: last.trimmed >= 0
              do:
                - set: l.off
                  value: last.trimmed
                - opt:
                    do:
                      - opt:
                          do:
                            - return: storageFailed("zero tail", err)
                              to: storageFailed
                          init:
                            bind: err
                            eval: zeroFrom(tail.f, l.off, tail.size)
                            to: zeroFrom
                          when: err != nil
                    when: "!allZero(last.data[l.off:])"
            - case: len(last.recs) > 0
              do:
                - bind: lr
                  eval: last.recs[len(last.recs)-1]
                - set: l.off
                  value: lr.off + int64(lr.length)
      - return: nil
  - of: classifyTail
    participants:
      - id: caller
        kind: actor
      - id: classifyTail
        kind: self
      - id: recordsAfter
        kind: internal
      - id: judgeAfterHole
        kind: internal
      - id: tornBatchStart
        kind: internal
    steps:
      - bind: rb
        eval: recs[len(recs)-1]
      - bind: after
        eval: recordsAfter(b, hole)
        to: recordsAfter
      - bind: torn
        eval: rb.batch
      - opt:
          do:
            - set: torn
              value: rb.batch + 1
          when: rb.end
      - opt:
          do:
            - return: "-1, why"
          init:
            bind: why
            eval: judgeAfterHole(after, torn)
            to: judgeAfterHole
          when: why != ""
      - opt:
          do:
            - return: tornBatchStart(recs, rb.off, torn)
              to: tornBatchStart
          when: torn == rb.batch
      - return: hole, ""
  - of: recordsAfter
    participants:
      - id: caller
        kind: actor
      - id: recordsAfter
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: after
          type: "[]record"
      - loop:
          cond: off+recHeader+recFixed <= len(b)
          do:
            - opt:
                do:
                  - set: r.off
                    value: int64(off)
                  - set: after
                    value: append(after, r)
                  - op: +=
                    set: "off"
                    value: r.length - recAlign
                init:
                  bind: r, ok
                  eval: parseRecord(b[off:])
                  to: parseRecord
                when: ok
          init: off := align8(int(hole) + recAlign)
          post: off += recAlign
      - return: after
  - of: tornBatchStart
    steps:
      - bind: start
        eval: lastOff
      - loop:
          cond: i >= 0 && recs[i].batch == torn
          do:
            - set: start
              value: recs[i].off
          init: i := len(recs) - 1
          post: i--
      - opt:
          do:
            - return: "-1, \"torn checkpoint\""
          when: recs[0].batch == torn && start == recs[0].off
      - return: start, ""
  - of: zeroFrom
    participants:
      - id: caller
        kind: actor
      - id: zeroFrom
        kind: self
      - id: datasync
        kind: internal
      - id: f.WriteAt
        kind: value
    steps:
      - opt:
          do:
            - return: datasync(f)
              to: datasync
          when: off >= size
      - bind: zero
        eval: make([]byte, min(size-off, 1<<20))
      - loop:
          cond: p < size
          do:
            - bind: "n"
              eval: min(int64(len(zero)), size-p)
            - opt:
                do:
                  - return: err
                init:
                  bind: _, err
                  eval: f.WriteAt(zero[:n], p)
                  to: f.WriteAt
                when: err != nil
            - op: +=
              set: p
              value: "n"
          init: p := off
      - return: datasync(f)
        to: datasync
  - of: (*fileLog).quarantine
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).quarantine
        kind: self
      - id: quarantined
        kind: internal
      - id: fmt
        kind: stdlib
      - id: writeFileSync
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - bind: qerr
        eval: quarantined(seg, off, why)
        to: quarantined
      - bind: line
        eval: fmt.Sprintf("%s %d %s\n", segName(seg), off, why)
        to: fmt
      - opt:
          do:
            - return: storageFailed("quarantine marker", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(l.dir, markerQuarantine), []byte(line))
            to: writeFileSync
          when: err != nil
      - return: qerr
  - of: (*fileLog).createSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).createSegment
        kind: self
      - id: appendRecord
        kind: internal
      - id: filepath
        kind: stdlib
      - id: l.segmentFile
        kind: internal
      - id: f.WriteAt
        kind: value
      - id: abandonTmp
        kind: internal
      - id: f.Sync
        kind: value
      - id: f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
      - id: l.prepare
        kind: internal
    steps:
      - bind: size
        eval: l.segBytes
      - bind: cpRec
        eval: "appendRecord(nil, &record{kind: recCheckpt, end: true, batch: cp.nextBatchSeq, data: cp.encode()})"
        to: appendRecord
      - bind: tmp
        eval: filepath.Join(l.logDir(), segName(n)+".tmp")
        to: filepath
      - bind: f, err
        eval: l.segmentFile(n, size, tmp)
        to: l.segmentFile
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: abandonTmp(f, storageFailed("checkpoint", err))
              to: abandonTmp
          init:
            bind: _, err
            eval: f.WriteAt(cpRec, 0)
            to: f.WriteAt
          when: err != nil
      - opt:
          do:
            - return: abandonTmp(f, storageFailed("sync segment", err))
              to: abandonTmp
          init:
            bind: err
            eval: f.Sync()
            to: f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("close segment", err)
              to: storageFailed
          init:
            bind: err
            eval: f.Close()
            to: f.Close
          when: err != nil
      - bind: final
        eval: filepath.Join(l.logDir(), segName(n))
        to: filepath
      - opt:
          do:
            - return: storageFailed("rename segment", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Rename(tmp, final)
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("sync dir", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(l.logDir())
            to: syncDir
          when: err != nil
      - set: f, err
        to: os
        value: os.OpenFile(final, os.O_RDWR, 0)
      - opt:
          do:
            - return: storageFailed("open segment", err)
              to: storageFailed
          when: err != nil
      - set: l.segs
        value: "append(l.segs, &segment{n: n, f: f, size: size})"
      - set: l.off
        value: int64(len(cpRec))
      - set: l.batch
        value: cp.nextBatchSeq + 1
      - eval: l.prepare(n+1, l.segBytes)
        to: l.prepare
      - return: nil
  - of: (*fileLog).segmentFile
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).segmentFile
        kind: self
      - id: l.takePrepared
        kind: internal
      - id: os
        kind: stdlib
      - id: zeroFrom
        kind: internal
    steps:
      - opt:
          do:
            - return: f, nil
          init:
            bind: f
            eval: l.takePrepared(n, size)
            to: l.takePrepared
          when: f != nil
      - bind: f, err
        eval: os.OpenFile(tmp, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("create segment", err)
          when: err != nil
      - opt:
          do:
            - return: nil, abandonTmp(f, storageFailed("zero-fill", err))
          init:
            bind: err
            eval: zeroFrom(f, 0, size)
            to: zeroFrom
          when: err != nil
      - return: f, nil
  - of: abandonTmp
    participants:
      - id: caller
        kind: actor
      - id: abandonTmp
        kind: self
      - id: abandon
        kind: internal
    steps:
      - eval: abandon(f.Close())
        to: abandon
      - return: cause
  - of: (*fileLog).prepare
    steps:
      - bind: done
        eval: make(chan struct{})
      - bind: p
        eval: "&prepared{n: n, size: size, done: done}"
      - set: l.prep
        value: p
      - go: |-
          func() {
          		defer close(done)
          		tmp := filepath.Join(l.logDir(), segName(n)+".tmp")
          		f, err := os.OpenFile(tmp, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
          		if err != nil {
          			p.err = err
          			return
          		}
          		if err := zeroFrom(f, 0, size); err != nil {
          			// A half-zeroed .tmp is never published: takePrepared then
          			// builds the segment on the writer's path, where a failure
          			// stops the node, and recovery deletes the .tmp.
          			abandon(f.Close())
          			p.err = err
          			return
          		}
          		p.f = f
          	}()
  - of: (*fileLog).takePrepared
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).takePrepared
        kind: self
      - id: abandon
        kind: internal
    steps:
      - bind: p
        eval: l.prep
      - set: l.prep
        value: nil
      - opt:
          do:
            - return: nil
          when: p == nil
      - eval: <-p.done
      - opt:
          do:
            - opt:
                do:
                  - eval: abandon(p.f.Close())
                    to: abandon
                when: p.f != nil
            - return: nil
          when: p.err != nil || p.n != n || p.size != size
      - return: p.f
  - of: writeFileSync
    participants:
      - id: caller
        kind: actor
      - id: writeFileSync
        kind: self
      - id: writeSynced
        kind: internal
      - id: os
        kind: stdlib
      - id: syncDir
        kind: internal
    steps:
      - bind: tmp
        eval: path + ".tmp"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: writeSynced(tmp, data)
            to: writeSynced
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: os.Rename(tmp, path)
            to: os
          when: err != nil
      - return: syncDir(filepath.Dir(path))
        to: syncDir
  - of: mkdirDurable
    participants:
      - id: caller
        kind: actor
      - id: mkdirDurable
        kind: self
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - bind: _, err
        eval: os.Stat(dir)
        to: os
      - bind: existed
        eval: err == nil
      - opt:
          do:
            - return: storageFailed("mkdir", err)
              to: storageFailed
          init:
            bind: err
            eval: os.MkdirAll(dir, 0o700)
            to: os
          when: err != nil
      - opt:
          do:
            - return: nil
          when: existed
      - opt:
          do:
            - return: storageFailed("mkdir", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(filepath.Dir(dir))
            to: syncDir
          when: err != nil
      - return: nil
  - of: writeSynced
    participants:
      - id: caller
        kind: actor
      - id: writeSynced
        kind: self
      - id: os
        kind: stdlib
      - id: f.Write
        kind: value
      - id: f.Sync
        kind: value
    steps:
      - bind: f, err
        eval: os.OpenFile(path, os.O_RDWR|os.O_CREATE|os.O_TRUNC, 0o600)
        to: os
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: |-
          func() {
          		if cerr := f.Close(); cerr != nil && err == nil {
          			err = cerr
          		}
          	}()
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: f.Write(data)
            to: f.Write
          when: err != nil
      - return: f.Sync()
        to: f.Sync
  - of: (*fileLog).rotate
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).rotate
        kind: self
      - id: appendRecord
        kind: internal
      - id: cur.f.WriteAt
        kind: value
      - id: storageFailed
        kind: internal
      - id: datasync
        kind: internal
      - id: l.publishNext
        kind: internal
    steps:
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - bind: seal
        eval: "appendRecord(nil, &record{kind: recSeal, end: true, batch: l.batch, index: uint64(l.off)})"
        to: appendRecord
      - opt:
          do:
            - opt:
                do:
                  - return: storageFailed("seal", err)
                    to: storageFailed
                init:
                  bind: _, err
                  eval: cur.f.WriteAt(seal, l.off)
                  to: cur.f.WriteAt
                when: err != nil
            - opt:
                do:
                  - return: storageFailed("sync seal", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: datasync(cur.f)
                  to: datasync
                when: err != nil
            - op: ++
              set: l.batch
            - opt:
                do:
                  - eval: l.afterSeal()
                when: l.afterSeal != nil
          when: l.off+int64(len(seal)) <= cur.size
      - return: l.publishNext(need)
        to: l.publishNext
  - of: (*fileLog).publishNext
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).publishNext
        kind: self
      - id: l.createSegment
        kind: internal
    steps:
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - bind: cp
        eval: l.dur
      - set: cp.nextBatchSeq
        value: l.batch
      - bind: saved
        eval: l.segBytes
      - opt:
          do:
            - set: l.segBytes
              value: int64(align8(need)) + 1024 + sealReserve
          when: int64(need)+1024+sealReserve > l.segBytes
      - bind: err
        eval: l.createSegment(cur.n+1, &cp)
        to: l.createSegment
      - set: l.segBytes
        value: saved
      - return: err
  - of: (*fileLog).termLocked
    steps:
      - switch:
          cases:
            - case: i == l.first-1
              do:
                - return: l.prevTerm
            - case: i < l.first || i >= l.first+uint64(len(l.slots))
              do:
                - return: "0"
      - return: l.slots[i-l.first].term
  - of: (*fileLog).usable
    steps:
      - opt:
          do:
            - return: l.refuse
          when: l.refuse != nil
      - return: l.failed
  - of: (*fileLog).Entries
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Entries
        kind: self
      - id: l.usable
        kind: internal
      - id: l.readEntry
        kind: internal
    steps:
      - lock:
          mutex: l.mu
          read: true
      - opt:
          do:
            - return: dst, err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: dst, compacted(lo, l.first)
          when: lo < l.first
      - opt:
          do:
            - return: dst, storageFailed("entries", errImpossible)
          when: hi > l.first+uint64(len(l.slots))
      - bind: size
        eval: "0"
      - loop:
          cond: i < hi
          do:
            - bind: s
              eval: l.slots[i-l.first]
            - var:
                name: e
                type: coreconsensus.EntryValue
            - alt:
                - do:
                    - set: e
                      value: "*s.mem"
                  when: s.mem != nil
                - do:
                    - var:
                        name: err
                        type: error
                    - opt:
                        do:
                          - return: dst, err
                        init:
                          bind: e, err
                          eval: l.readEntry(s)
                          op: =
                          to: l.readEntry
                        when: err != nil
                  else: true
            - op: +=
              set: size
              value: len(e.Data)
            - opt:
                do:
                  - break: true
                when: i > lo && size > maxBytes
            - set: dst
              value: append(dst, e)
          init: i := lo
          post: i++
      - return: dst, nil
  - of: (*fileLog).readEntry
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).readEntry
        kind: self
      - id: seg.f.ReadAt
        kind: value
      - id: binary.LittleEndian.Uint32
        kind: value
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: seg
          type: "*segment"
      - loop:
          do:
            - opt:
                do:
                  - set: seg
                    value: x
                when: x.n == s.seg
          key: _
          range: l.segs
          value: x
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", errImpossible)
          when: seg == nil
      - var:
          name: h
          type: "[recHeader]byte"
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", err)
          init:
            bind: _, err
            eval: seg.f.ReadAt(h[:], s.off)
            to: seg.f.ReadAt
          when: err != nil
      - bind: ln
        eval: binary.LittleEndian.Uint32(h[:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, origin(coreconsensus.LogCorrupt, errs.String("segment", segName(s.seg)), errs.Int64("offset", s.off))
          when: int64(ln) > seg.size-s.off-int64(recHeader)
      - bind: b
        eval: make([]byte, recHeader+int(ln))
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, storageFailed("read", err)
          init:
            bind: _, err
            eval: seg.f.ReadAt(b, s.off)
            to: seg.f.ReadAt
          when: err != nil && !errors.Is(err, io.EOF)
      - bind: r, ok
        eval: parseRecord(b)
        to: parseRecord
      - opt:
          do:
            - return: coreconsensus.EntryValue{}, origin(coreconsensus.LogCorrupt, errs.String("segment", segName(s.seg)), errs.Int64("offset", s.off))
          when: "!ok || r.kind != recEntry"
      - return: |-
          coreconsensus.EntryValue{
          		Position: coreconsensus.PositionValue{Term: r.term, Index: r.index},
          		Kind:     coreconsensus.EntryKind(r.ekind), Version: r.ever, BodySum: r.body, ChainSum: r.chain, Data: r.data,
          	}, nil
  - of: (*fileLog).Term
    steps:
      - lock:
          mutex: l.mu
          read: true
      - switch:
          cases:
            - case: index == l.first-1
              do:
                - return: l.prevTerm, nil
            - case: index < l.first
              do:
                - return: 0, compacted(index, l.first)
            - case: index >= l.first+uint64(len(l.slots))
              do:
                - return: 0, storageFailed("term", errImpossible)
      - return: l.slots[index-l.first].term, nil
  - of: (*fileLog).Bounds
    steps:
      - lock:
          mutex: l.mu
          read: true
      - opt:
          do:
            - return: 1, 0
          when: l.refuse != nil
      - return: l.first, l.first + uint64(len(l.slots)) - 1
  - of: (*fileLog).add
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).add
        kind: self
      - id: appendRecord
        kind: internal
    steps:
      - set: l.pendingLast
        value: len(l.pending)
      - set: l.pending
        to: appendRecord
        value: appendRecord(l.pending, r)
  - of: (*fileLog).Append
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Append
        kind: self
      - id: l.usable
        kind: internal
      - id: storageFailed
        kind: internal
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - loop:
          do:
            - bind: e
              eval: entries[i]
            - opt:
                do:
                  - return: storageFailed("append", errImpossible)
                    to: storageFailed
                when: e.Position.Index != l.first+uint64(len(l.slots))
            - eval: |-
                l.add(&record{
                			kind: recEntry, batch: l.batch, term: e.Position.Term, index: e.Position.Index,
                			ekind: uint8(e.Kind), ever: e.Version, body: e.BodySum, chain: e.ChainSum, data: e.Data,
                		})
              to: l.add
            - set: l.slots
              value: "append(l.slots, slot{term: e.Position.Term, mem: &e})"
          key: i
          range: entries
      - opt:
          do:
            - eval: "l.add(&record{kind: recHardState, batch: l.batch, data: encodeHS(*hs)})"
              to: l.add
            - set: l.hs
              value: "*hs"
          when: hs != nil
      - return: nil
  - of: (*fileLog).Sync
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Sync
        kind: self
      - id: l.usable
        kind: internal
      - id: sealRecord
        kind: internal
      - id: l.rotate
        kind: internal
      - id: l.restamp
        kind: internal
      - id: l.mu.Unlock
        kind: value
      - id: l.writeBatch
        kind: internal
      - id: l.mu.Lock
        kind: value
      - id: l.settleBatch
        kind: internal
      - id: l.dropSegmentsLocked
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: nil
          when: len(l.pending) == 0
      - set: l.pending[l.pendingLast+recHeader+2]
        value: "1"
      - eval: sealRecord(l.pending[l.pendingLast:])
        to: sealRecord
      - bind: cur
        eval: l.segs[len(l.segs)-1]
      - opt:
          do:
            - opt:
                do:
                  - set: l.failed
                    value: err
                  - return: err
                init:
                  bind: err
                  eval: l.rotate(len(l.pending))
                  to: l.rotate
                when: err != nil
            - eval: l.restamp(l.batch)
              to: l.restamp
            - set: cur
              value: l.segs[len(l.segs)-1]
          when: l.off+int64(len(l.pending))+sealReserve > cur.size
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
      - bind: ferr
        eval: l.writeBatch(cur)
        to: l.writeBatch
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - opt:
          do:
            - set: l.failed
              value: ferr
            - return: l.failed
          when: ferr != nil
      - eval: l.settleBatch(cur.n)
        to: l.settleBatch
      - return: l.dropSegmentsLocked()
        to: l.dropSegmentsLocked
  - of: (*fileLog).writeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).writeBatch
        kind: self
      - id: l.writeAndSync
        kind: internal
    steps:
      - bind: body
        eval: l.pending[:l.pendingLast]
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.writeAndSync(cur, body, l.off)
                  to: l.writeAndSync
                when: err != nil
          when: len(body) > 0
      - return: l.writeAndSync(cur, l.pending[l.pendingLast:], l.off+int64(len(body)))
        to: l.writeAndSync
  - of: (*fileLog).writeAndSync
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).writeAndSync
        kind: self
      - id: cur.f.WriteAt
        kind: value
      - id: storageFailed
        kind: internal
      - id: datasync
        kind: internal
    steps:
      - opt:
          do:
            - return: storageFailed("write", err)
              to: storageFailed
          init:
            bind: _, err
            eval: cur.f.WriteAt(b, off)
            to: cur.f.WriteAt
          when: err != nil
      - opt:
          do:
            - eval: l.duringSync()
          when: l.duringSync != nil
      - opt:
          do:
            - return: storageFailed("fdatasync", err)
              to: storageFailed
          init:
            bind: err
            eval: datasync(cur.f)
            to: datasync
          when: err != nil
      - return: nil
  - of: (*fileLog).settleBatch
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).settleBatch
        kind: self
      - id: l.relocate
        kind: internal
      - id: l.markDurable
        kind: internal
    steps:
      - eval: l.relocate(seg)
        to: l.relocate
      - op: +=
        set: l.off
        value: int64(len(l.pending))
      - eval: l.markDurable()
        to: l.markDurable
      - set: l.pending
        value: l.pending[:0]
      - set: l.pendingLast
        value: "-1"
      - op: ++
        set: l.batch
  - of: (*fileLog).relocate
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).relocate
        kind: self
      - id: parseRecord
        kind: internal
    steps:
      - var:
          name: "off"
          type: int64
      - loop:
          cond: off < int64(len(l.pending))
          do:
            - bind: r, _
              eval: parseRecord(l.pending[off:])
              to: parseRecord
            - opt:
                do:
                  - bind: s
                    eval: "&l.slots[r.index-l.first]"
                  - opt:
                      do:
                        - set: s.seg, s.off, s.mem
                          value: seg, l.off+off, nil
                      when: s.mem != nil && s.term == r.term
                when: r.kind == recEntry && r.index >= l.first && r.index < l.first+uint64(len(l.slots))
            - op: +=
              set: "off"
              value: int64(r.length)
  - of: (*fileLog).markDurable
    steps:
      - bind: last
        eval: l.first + uint64(len(l.slots)) - 1
      - set: l.dur
        value: "checkpoint{hs: l.hs, prevIndex: last, prevTerm: l.termLocked(last), compact: l.compact, compactTerm: l.compactTerm}"
  - of: (*fileLog).restamp
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).restamp
        kind: self
      - id: binary.LittleEndian.PutUint64
        kind: value
      - id: sealRecord
        kind: internal
      - id: align8
        kind: internal
    steps:
      - var:
          name: "off"
          type: int
      - loop:
          cond: off < len(l.pending)
          do:
            - eval: binary.LittleEndian.PutUint64(l.pending[off+recHeader+4:], batch)
              to: binary.LittleEndian.PutUint64
            - eval: sealRecord(l.pending[off:])
              to: sealRecord
            - bind: "n"
              eval: int(binary.LittleEndian.Uint32(l.pending[off:]))
            - op: +=
              set: "off"
              to: align8
              value: align8(recHeader + n)
  - of: (*fileLog).TruncateSuffix
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).TruncateSuffix
        kind: self
      - id: l.usable
        kind: internal
      - id: l.add
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - set: from
              value: l.first
          when: from < l.first
      - opt:
          do:
            - return: nil
          when: from >= l.first+uint64(len(l.slots))
      - eval: "l.add(&record{kind: recTruncate, batch: l.batch, index: from})"
        to: l.add
      - set: l.slots
        value: l.slots[:from-l.first]
      - return: nil
  - of: (*fileLog).CompactPrefix
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).CompactPrefix
        kind: self
      - id: l.compactPrefixAt
        kind: internal
    steps:
      - return: l.compactPrefixAt(through, 0)
        to: l.compactPrefixAt
  - of: (*fileLog).compactPrefixAt
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).compactPrefixAt
        kind: self
      - id: l.usable
        kind: internal
      - id: compactionTerm
        kind: internal
      - id: l.add
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: l.usable()
            to: l.usable
          when: err != nil
      - opt:
          do:
            - return: nil
          when: through < l.first
      - bind: last
        eval: l.first + uint64(len(l.slots)) - 1
      - bind: t, err
        eval: compactionTerm(through, last, l.termLocked(through), term)
        to: compactionTerm
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: "l.add(&record{kind: recCompact, batch: l.batch, index: through, term: t})"
        to: l.add
      - alt:
          - do:
              - set: l.slots
                value: nil
            when: through >= last
          - do:
              - set: l.slots
                to: slices
                value: slices.Clone(l.slots[through-l.first+1:])
            else: true
      - set: l.first, l.prevTerm
        value: through+1, t
      - set: l.compact, l.compactTerm
        value: through, t
      - return: nil
  - of: compactionTerm
    steps:
      - switch:
          cases:
            - case: through <= last && given != 0 && given != held
              do:
                - return: 0, storageFailed("compact", errImpossible)
            - case: through <= last
              do:
                - return: held, nil
            - case: given == 0
              do:
                - return: 0, storageFailed("compact", errUnknownCompactTerm)
      - return: given, nil
  - of: (*fileLog).dropSegmentsLocked
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).dropSegmentsLocked
        kind: self
      - id: l.supersedes
        kind: internal
      - id: l.removeFirstSegment
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - bind: removed
        eval: "false"
      - loop:
          cond: len(l.segs) > 1
          do:
            - bind: superseded, err
              eval: l.supersedes(l.segs[1])
              to: l.supersedes
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - break: true
                when: "!superseded"
            - opt:
                do:
                  - break: true
                when: l.retainsEntryIn(l.segs[0].n)
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: l.removeFirstSegment()
                  to: l.removeFirstSegment
                when: err != nil
            - set: removed
              value: "true"
      - opt:
          do:
            - return: syncDir(l.logDir())
              to: syncDir
          when: removed
      - return: nil
  - of: (*fileLog).supersedes
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).supersedes
        kind: self
      - id: next.f.ReadAt
        kind: value
      - id: parseRecord
        kind: internal
      - id: decodeCheckpoint
        kind: internal
    steps:
      - bind: b
        eval: make([]byte, recHeader+recFixed+checkpointLen)
      - opt:
          do:
            - return: false, storageFailed("read checkpoint", err)
          init:
            bind: _, err
            eval: next.f.ReadAt(b, 0)
            to: next.f.ReadAt
          when: err != nil
      - bind: r, ok
        eval: parseRecord(b)
        to: parseRecord
      - opt:
          do:
            - return: false, nil
          when: "!ok"
      - bind: cp, ok
        eval: decodeCheckpoint(r.data)
        to: decodeCheckpoint
      - return: ok && cp.prevIndex <= l.compact, nil
  - of: (*fileLog).removeFirstSegment
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).removeFirstSegment
        kind: self
      - id: l.segs[0].f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: os
        kind: stdlib
    steps:
      - opt:
          do:
            - return: storageFailed("close segment", err)
              to: storageFailed
          init:
            bind: err
            eval: l.segs[0].f.Close()
            to: l.segs[0].f.Close
          when: err != nil
      - opt:
          do:
            - return: storageFailed("remove segment", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(l.logDir(), segName(l.segs[0].n)))
            to: os
          when: err != nil
      - set: l.segs
        value: l.segs[1:]
      - return: nil
  - of: (*fileLog).HardState
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.hs, l.usable()
  - of: (*fileLog).Stamp
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.stamp, nil
  - of: (*fileLog).WriteStamp
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).WriteStamp
        kind: self
      - id: writeStamp
        kind: internal
      - id: storageFailed
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: storageFailed("stamp", err)
              to: storageFailed
          init:
            bind: err
            eval: writeStamp(l.dir, s)
            to: writeStamp
          when: err != nil
      - set: l.stamp
        value: s
      - return: nil
  - of: (*fileLog).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).Close
        kind: self
      - id: s.f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: abandon
        kind: internal
    steps:
      - lock:
          mutex: l.wmu
      - lock:
          mutex: l.mu
      - var:
          name: err
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: err
                    to: storageFailed
                    value: storageFailed("close segment", cerr)
                init:
                  bind: cerr
                  eval: s.f.Close()
                  to: s.f.Close
                when: cerr != nil && err == nil
          key: _
          range: l.segs
          value: s
      - set: l.segs
        value: nil
      - opt:
          do:
            - set: l.prep
              value: nil
            - eval: <-p.done
            - opt:
                do:
                  - eval: abandon(p.f.Close())
                    to: abandon
                when: p.f != nil
          init:
            bind: p
            eval: l.prep
          when: p != nil
      - return: err
  - of: (*fileLog).logStats
    steps:
      - lock:
          mutex: l.mu
          read: true
      - loop:
          do:
            - op: +=
              set: bytes
              value: s.size
          key: _
          range: l.segs
          value: s
      - return: bytes, fsFree(l.dir), l.tailsTruncated
  - of: newFileSnapshots
    participants:
      - id: caller
        kind: actor
      - id: newFileSnapshots
        kind: self
      - id: mkdirDurable
        kind: internal
      - id: os
        kind: stdlib
      - id: strings
        kind: stdlib
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: mkdirDurable(dir)
            to: mkdirDurable
          when: err != nil
      - bind: ents, err
        eval: os.ReadDir(dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("list snapshots", err)
          when: err != nil
      - loop:
          do:
            - bind: id, ok
              eval: strings.CutSuffix(e.Name(), ".snap")
              to: strings
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, storageFailed("remove orphan snapshot", err)
                      init:
                        bind: err
                        eval: os.Remove(filepath.Join(dir, e.Name()))
                        to: os
                      when: err != nil
                init:
                  bind: _, err
                  eval: os.Stat(filepath.Join(dir, id+".meta"))
                  to: os
                when: errors.Is(err, os.ErrNotExist)
          key: _
          range: ents
          value: e
      - opt:
          do:
            - return: nil, storageFailed("sync snapshots at open", err)
          init:
            bind: err
            eval: syncDir(dir)
            to: syncDir
          when: err != nil
      - return: "&fileSnapshots{dir: dir, pins: map[string]int{}}, nil"
  - of: validID
    steps:
      - return: id != "" && len(id) <= 128 && !strings.ContainsAny(id, "/\\.") && filepath.Base(id) == id
  - of: (*fileSnapshots).Create
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Create
        kind: self
      - id: filepath
        kind: stdlib
      - id: os
        kind: stdlib
      - id: io
        kind: stdlib
      - id: alignedOffset
        kind: internal
      - id: f.Truncate
        kind: value
      - id: f.Seek
        kind: value
    steps:
      - opt:
          do:
            - return: nil, 0, origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
          when: "!validID(id)"
      - bind: path
        eval: filepath.Join(s.dir, id+".spool")
        to: filepath
      - bind: sink
        eval: "&fileSink{s: s, id: id, meta: meta}"
      - bind: f, err
        eval: os.OpenFile(path, os.O_RDWR|os.O_CREATE, 0o600)
        to: os
      - opt:
          do:
            - return: nil, 0, storageFailed("spool", err)
          when: err != nil
      - set: sink.f
        value: f
      - bind: prefix, err
        eval: io.ReadAll(f)
        to: io
      - opt:
          do:
            - return: nil, 0, alsoFailed(storageFailed("spool", err), "close", f.Close())
          when: err != nil
      - bind: "off"
        eval: alignedOffset(prefix)
        to: alignedOffset
      - opt:
          do:
            - return: nil, 0, alsoFailed(storageFailed("spool", err), "close", f.Close())
          init:
            bind: err
            eval: f.Truncate(off)
            to: f.Truncate
          when: err != nil
      - opt:
          do:
            - return: nil, 0, alsoFailed(storageFailed("spool", err), "close", f.Close())
          init:
            bind: _, err
            eval: f.Seek(off, io.SeekStart)
            to: f.Seek
          when: err != nil
      - return: sink, off, nil
  - of: (*fileSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Write
        kind: self
      - id: k.f.Write
        kind: value
    steps:
      - return: k.f.Write(p)
        to: k.f.Write
  - of: (*fileSink).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Commit
        kind: self
      - id: k.f.Seek
        kind: value
      - id: alsoFailed
        kind: internal
      - id: k.f.Sync
        kind: value
      - id: k.f.Close
        kind: value
      - id: storageFailed
        kind: internal
      - id: filepath
        kind: stdlib
      - id: os
        kind: stdlib
      - id: writeFileSync
        kind: internal
    steps:
      - set: final.ID
        value: k.id
      - bind: size, err
        eval: k.f.Seek(0, io.SeekCurrent)
        to: k.f.Seek
      - opt:
          do:
            - return: alsoFailed(storageFailed("snapshot size", err), "close", k.f.Close())
              to: alsoFailed
          when: err != nil
      - opt:
          do:
            - return: alsoFailed(snapshotCorrupt("encoded size"), "close", k.f.Close())
              to: alsoFailed
          when: size != final.EncodedSize
      - opt:
          do:
            - return: alsoFailed(storageFailed("sync snapshot", err), "close", k.f.Close())
              to: alsoFailed
          init:
            bind: err
            eval: k.f.Sync()
            to: k.f.Sync
          when: err != nil
      - opt:
          do:
            - return: storageFailed("close snapshot", err)
              to: storageFailed
          init:
            bind: err
            eval: k.f.Close()
            to: k.f.Close
          when: err != nil
      - bind: snap
        eval: filepath.Join(k.s.dir, k.id+".snap")
        to: filepath
      - opt:
          do:
            - return: storageFailed("publish snapshot", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Rename(filepath.Join(k.s.dir, k.id+".spool"), snap)
            to: os
          when: err != nil
      - opt:
          do:
            - return: storageFailed("publish snapshot meta", err)
              to: storageFailed
          init:
            bind: err
            eval: writeFileSync(filepath.Join(k.s.dir, k.id+".meta"), wire.AppendSnapshotMeta(nil, &final))
            to: writeFileSync
          when: err != nil
      - return: nil
  - of: (*fileSnapshots).published
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).published
        kind: self
      - id: strings
        kind: stdlib
      - id: os
        kind: stdlib
    steps:
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - opt:
          do:
            - return: m, false, nil
          when: "!strings.HasSuffix(name, \".meta\")"
      - bind: id
        eval: strings.TrimSuffix(name, ".meta")
        to: strings
      - bind: b, err
        eval: os.ReadFile(filepath.Join(s.dir, name))
        to: os
      - opt:
          do:
            - return: m, false, nil
          when: errors.Is(err, os.ErrNotExist)
      - opt:
          do:
            - return: m, false, storageFailed("read snapshot meta", err)
          when: err != nil
      - opt:
          do:
            - return: m, false, nil
          when: wire.ParseSnapshotMeta(b, &m) != nil || m.ID != id
      - opt:
          do:
            - opt:
                do:
                  - return: m, false, nil
                when: errors.Is(err, os.ErrNotExist)
            - return: m, false, storageFailed("stat snapshot", err)
          init:
            bind: _, err
            eval: os.Stat(filepath.Join(s.dir, id+".snap"))
            to: os
          when: err != nil
      - return: m, true, nil
  - of: (*fileSink).release
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).release
        kind: self
      - id: abandon
        kind: internal
    steps:
      - eval: abandon(k.f.Close())
        to: abandon
  - of: (*fileSink).Abort
    participants:
      - id: caller
        kind: actor
      - id: (*fileSink).Abort
        kind: self
      - id: abandon
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
    steps:
      - eval: abandon(k.f.Close())
        to: abandon
      - opt:
          do:
            - return: storageFailed("abort spool", err)
              to: storageFailed
          init:
            bind: err
            eval: os.Remove(filepath.Join(k.s.dir, k.id+".spool"))
            to: os
          when: err != nil && !errors.Is(err, os.ErrNotExist)
      - return: nil
  - of: (*fileSnapshots).List
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).List
        kind: self
      - id: os
        kind: stdlib
      - id: s.published
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: ents, err
        eval: os.ReadDir(s.dir)
        to: os
      - opt:
          do:
            - return: nil, storageFailed("list snapshots", err)
          when: err != nil
      - var:
          name: out
          type: "[]coreconsensus.SnapshotMetaValue"
      - loop:
          do:
            - bind: m, ok, err
              eval: s.published(e.Name())
              to: s.published
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - opt:
                do:
                  - set: out
                    value: append(out, m)
                when: ok
          key: _
          range: ents
          value: e
      - eval: |-
          slices.SortFunc(out, func(a, b coreconsensus.SnapshotMetaValue) int {
          		switch {
          		case a.Position.Index > b.Position.Index:
          			return -1
          		case a.Position.Index < b.Position.Index:
          			return 1
          		}
          		return strings.Compare(b.ID, a.ID)
          	})
        to: slices
      - return: out, nil
  - of: (*fileHandle).Meta
    steps:
      - return: h.meta
  - of: (*fileHandle).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileHandle).Close
        kind: self
      - id: h.once.Do
        kind: value
    steps:
      - var:
          name: err
          type: error
      - eval: |-
          h.once.Do(func() {
          		h.s.mu.Lock()
          		h.s.pins[h.meta.ID]--
          		h.s.mu.Unlock()
          		if cerr := h.File.Close(); cerr != nil {
          			err = storageFailed("close snapshot", cerr)
          		}
          	})
        to: h.once.Do
      - return: err
  - of: (*fileSnapshots).Open
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Open
        kind: self
      - id: os
        kind: stdlib
      - id: wire
        kind: package
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: nil, origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
          when: "!validID(id)"
      - bind: b, err
        eval: os.ReadFile(filepath.Join(s.dir, id+".meta"))
        to: os
      - opt:
          do:
            - return: nil, origin(coreconsensus.SnapshotCorrupt, errs.String("id", id), errs.String("why", "no meta"))
          when: err != nil
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: wire.ParseSnapshotMeta(b, &m)
            to: wire
          when: err != nil
      - bind: h
        eval: "&fileHandle{s: s, meta: m}"
      - bind: f, err
        eval: os.Open(filepath.Join(s.dir, id+".snap"))
        to: os
      - opt:
          do:
            - return: nil, storageFailed("open snapshot", err)
          when: err != nil
      - set: h.File
        value: f
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - op: ++
        set: s.pins[id]
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: h, nil
  - of: (*fileSnapshots).Remove
    participants:
      - id: caller
        kind: actor
      - id: (*fileSnapshots).Remove
        kind: self
      - id: origin
        kind: internal
      - id: pinnedSnapshot
        kind: internal
      - id: os
        kind: stdlib
      - id: storageFailed
        kind: internal
      - id: syncDir
        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("snapshot_id", id))
              to: origin
          when: "!validID(id)"
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: pinnedSnapshot()
              to: pinnedSnapshot
          when: s.pins[id] > 0
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("remove", err)
                    to: storageFailed
                init:
                  bind: err
                  eval: os.Remove(filepath.Join(s.dir, id+ext))
                  to: os
                when: err != nil && !errors.Is(err, os.ErrNotExist)
          key: _
          range: "[]string{\".meta\", \".snap\"}"
          value: ext
      - opt:
          do:
            - return: storageFailed("remove", err)
              to: storageFailed
          init:
            bind: err
            eval: syncDir(s.dir)
            to: syncDir
          when: err != nil
      - return: nil
  - of: fsFree
    participants:
      - id: caller
        kind: actor
      - id: fsFree
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: s
          type: syscall.Statfs_t
      - opt:
          do:
            - return: "-1"
          init:
            bind: err
            eval: syscall.Statfs(dir, &s)
            to: syscall
          when: err != nil
      - return: int64(s.Bavail) * int64(s.Bsize)
  - of: PeerFlags.Has
    steps:
      - return: f&x == x
  - of: HealthFlags.Has
    steps:
      - return: f&x == x
  - of: HealthFlags.set
    steps:
      - opt:
          do:
            - return: f | x
          when: "on"
      - return: f &^ x
  - of: (*Node).Health
    participants:
      - id: caller
        kind: actor
      - id: (*Node).Health
        kind: self
      - id: n.Status
        kind: internal
      - id: n.StopReason
        kind: internal
      - id: h.Flags.Has
        kind: internal
      - id: h.Flags.set
        kind: internal
      - id: n.exec
        kind: internal
    steps:
      - bind: st
        eval: n.Status()
        to: n.Status
      - bind: h
        eval: |-
          HealthValue{
          		Status: st, Flags: HealthFlags(0).set(HealthStopped, n.stopped.Load()), DroppedFrames: n.droppedFrom.Load(), FailureTolerance: -1,
          		LongTurns: n.longTurns.Load(), JoinsRateLimited: n.joinRefused.Load(),
          	}
      - opt:
          do:
            - set: h.StopReason
              value: r
          init:
            bind: r, ok
            eval: n.StopReason()
            to: n.StopReason
          when: ok
      - opt:
          do:
            - set: h.ApplyLagEntries
              value: st.Commit - st.Applied
          when: st.Commit > st.Applied
      - bind: stopped
        eval: h.Flags.Has(HealthStopped)
        to: h.Flags.Has
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthHasLeader, st.Leader != 0 && !stopped)
      - opt:
          do:
            - eval: n.exec(func() { n.loopHealth(&h) })
              to: n.exec
          when: "!stopped"
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthReady, isReady(&h, &st))
      - return: h
  - of: isReady
    steps:
      - return: |-
          !h.Flags.Has(HealthStopped) && h.Flags.Has(HealthHasLeader) && st.Applied >= st.Commit &&
          		(h.ChainRefusals == 0 || h.ChainRefusalLeader != st.Leader)
  - of: (*Node).loopHealth
    participants:
      - id: caller
        kind: actor
      - id: (*Node).loopHealth
        kind: self
      - id: n.clk.Now
        kind: value
      - id: h.Flags.set
        kind: internal
      - id: n.r.FailureTolerance
        kind: value
      - id: n.r.ChainRefusal
        kind: value
    steps:
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - set: h.Flags
        to: h.Flags.set
        value: h.Flags.set(HealthQuorumReachable, n.r.QuorumActive(now))
      - set: h.FailureTolerance
        to: n.r.FailureTolerance
        value: n.r.FailureTolerance(now)
      - set: h.ChainRefusalLeader, h.ChainRefusalIndex, h.ChainRefusals
        to: n.r.ChainRefusal
        value: n.r.ChainRefusal()
      - bind: last
        eval: n.r.Status().Last
      - bind: window
        eval: n.r.Status().Timing.ElectionTimeoutMin
      - loop:
          do:
            - set: h.Peers
              value: append(h.Peers, n.peerHealth(&p, now, last, window))
          key: _
          range: n.r.PeerStats()
          value: p
  - of: (*Node).peerHealth
    participants:
      - id: caller
        kind: actor
      - id: (*Node).peerHealth
        kind: self
      - id: p.Flags.Has
        kind: value
      - id: now.Sub
        kind: value
    steps:
      - bind: ph
        eval: "PeerHealthValue{ID: p.ID, Match: p.Match, Inflight: p.Inflight, LastContact: -1}"
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerVoter
          when: p.Flags.Has(raft.StatVoter)
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerSnapshot
          when: p.Flags.Has(raft.StatSnapshot)
      - opt:
          do:
            - set: ph.Lag
              value: last - p.Match
          when: last > p.Match
      - bind: heard
        eval: p.Flags.Has(raft.StatHeard)
        to: p.Flags.Has
      - opt:
          do:
            - set: ph.LastContact
              to: now.Sub
              value: now.Sub(p.LastHeard)
          when: heard
      - opt:
          do:
            - op: "|="
              set: ph.Flags
              value: PeerUnreachable
          when: n.peerUnreachable(p, heard, ph.LastContact, window)
      - return: ph
  - of: (*Node).peerUnreachable
    steps:
      - bind: u, reported
        eval: n.unreachableAt[p.ID]
      - return: "!heard || lastContact >= window || (reported && u.After(p.LastHeard))"
  - of: drawID
    participants:
      - id: caller
        kind: actor
      - id: drawID
        kind: self
      - id: rand
        kind: stdlib
      - id: coreconsensus
        kind: package
    steps:
      - loop:
          do:
            - var:
                name: b
                type: "[8]byte"
            - set: _, _
              to: rand
              value: rand.Read(b[:])
            - opt:
                do:
                  - return: id
                init:
                  bind: id
                  eval: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[:]))
                  to: coreconsensus
                when: id != 0
          forever: true
  - of: drawIncarnation
    participants:
      - id: caller
        kind: actor
      - id: drawIncarnation
        kind: self
      - id: rand
        kind: stdlib
    steps:
      - var:
          name: inc
          type: coreconsensus.Incarnation
      - set: _, _
        to: rand
        value: rand.Read(inc[:])
      - return: inc
  - of: InitLog
    participants:
      - id: caller
        kind: actor
      - id: InitLog
        kind: self
      - id: log.Stamp
        kind: value
      - id: log.WriteStamp
        kind: value
    steps:
      - bind: st, err
        eval: log.Stamp()
        to: log.Stamp
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, storageFailed("stamp", err)
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: st.ID, st.Incarnation, nil
                when: st.Log.Cluster == cluster && st.Slot == slot
            - return: 0, coreconsensus.Incarnation{}, origin(coreconsensus.DataDirMismatch, errs.String("why", "stamped for another cluster or slot"))
          when: st.State != 0
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, misconfigured("slot", "not [a-z0-9-]{1,32}")
          when: "!validSlot(slot)"
      - set: st
        value: |-
          coreconsensus.StampValue{
          		Log: coreconsensus.LogIdentityValue{Cluster: cluster, Epoch: 1}, ID: drawID(),
          		Incarnation: drawIncarnation(), Slot: slot, State: coreconsensus.StampJoining,
          	}
      - opt:
          do:
            - return: 0, coreconsensus.Incarnation{}, storageFailed("stamp", err)
          init:
            bind: err
            eval: log.WriteStamp(st)
            to: log.WriteStamp
          when: err != nil
      - return: st.ID, st.Incarnation, nil
  - of: RedrawLog
    participants:
      - id: caller
        kind: actor
      - id: RedrawLog
        kind: self
      - id: log.Stamp
        kind: value
      - id: log.Bounds
        kind: value
      - id: drawID
        kind: internal
      - id: log.WriteStamp
        kind: value
    steps:
      - bind: st, err
        eval: log.Stamp()
        to: log.Stamp
      - opt:
          do:
            - return: 0, storageFailed("stamp", err)
          when: err != nil
      - opt:
          do:
            - return: 0, origin(coreconsensus.DataDirMismatch, errs.String("why", "not an empty joining directory"))
          init:
            bind: first, last
            eval: log.Bounds()
            to: log.Bounds
          when: st.State != coreconsensus.StampJoining || last >= first
      - set: st.ID
        to: drawID
        value: drawID()
      - opt:
          do:
            - return: 0, storageFailed("stamp", err)
          init:
            bind: err
            eval: log.WriteStamp(st)
            to: log.WriteStamp
          when: err != nil
      - return: st.ID, nil
  - of: (*Node).offer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).offer
        kind: self
      - id: n.exec
        kind: internal
    steps:
      - bind: acc
        eval: "coreconsensus.InstallAcceptValue{SnapshotID: o.SnapshotID}"
      - bind: ok
        eval: n.exec(func() { n.judgeOffer(from.ID, &o, &acc) })
        to: n.exec
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeNodeStopped
          when: "!ok"
      - return: acc
  - of: (*Node).judgeOffer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).judgeOffer
        kind: self
      - id: n.cfg.Snapshots.Create
        kind: value
      - id: n.keepSpool
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: n.screenOffer(from, o, acc) || n.answerFromHeld(o, acc)
      - bind: sink, off, err
        eval: n.cfg.Snapshots.Create(o.SnapshotID, o.Meta)
        to: n.cfg.Snapshots.Create
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeStorageFailed
            - return: ""
          when: err != nil
      - eval: n.keepSpool(o.SnapshotID, sink)
        to: n.keepSpool
      - set: acc.Offset
        value: "off"
  - of: (*Node).screenOffer
    participants:
      - id: caller
        kind: actor
      - id: (*Node).screenOffer
        kind: self
      - id: n.r.CheckOffer
        kind: value
    steps:
      - bind: code
        eval: n.r.CheckOffer(from, *o, n.r.NoTable())
        to: n.r.CheckOffer
      - opt:
          do:
            - set: acc.Held
              value: "true"
            - return: "true"
          when: code == coreconsensus.CodeAdminPreconditionFailed
      - opt:
          do:
            - set: acc.Refused
              value: code
            - return: "true"
          when: code != 0
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeVersionUnsupported
            - return: "true"
          when: o.SnapshotID != o.Meta.ID || o.Meta.Version != 1
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeLineageMismatch
            - return: "true"
          when: "!lineageAccepts(n.lineage(), o.Meta.Log, o.Meta.Position.Index)"
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeSnapshotTooLarge
            - return: "true"
          when: o.Meta.DecodedSize > n.cfg.MaxSnapshotBytes || o.Meta.EncodedSize > n.cfg.MaxSnapshotBytes
      - return: "false"
  - of: (*Node).answerFromHeld
    participants:
      - id: caller
        kind: actor
      - id: (*Node).answerFromHeld
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.cfg.Snapshots.Remove
        kind: value
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - set: acc.Refused
              value: coreconsensus.CodeStorageFailed
            - return: "true"
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: m.ID != o.SnapshotID
            - opt:
                do:
                  - set: acc.Held
                    value: "true"
                  - return: "true"
                when: "!n.r.NoTable()"
            - opt:
                do:
                  - set: acc.Refused
                    value: coreconsensus.CodeStorageFailed
                  - return: "true"
                init:
                  bind: err
                  eval: n.cfg.Snapshots.Remove(m.ID)
                  to: n.cfg.Snapshots.Remove
                when: err != nil
          key: _
          range: metas
          value: m
      - return: "false"
  - of: (*Node).keepSpool
    participants:
      - id: caller
        kind: actor
      - id: (*Node).keepSpool
        kind: self
      - id: r.release
        kind: internal
    steps:
      - lock:
          mutex: n.snapState.mu
      - opt:
          do:
            - set: n.snapState.spools
              value: map[string]coreconsensus.SnapshotSink{}
          when: n.snapState.spools == nil
      - opt:
          do:
            - opt:
                do:
                  - eval: r.release()
                    to: r.release
                init:
                  bind: r, ok
                  eval: old.(interface{ release() })
                when: ok
          init:
            bind: old
            eval: n.snapState.spools[id]
          when: old != nil
      - set: n.snapState.spools[id]
        value: sink
  - of: (*Node).install
    participants:
      - id: caller
        kind: actor
      - id: (*Node).install
        kind: self
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: origin
        kind: internal
      - id: io
        kind: stdlib
      - id: snapshotCorrupt
        kind: internal
      - id: n.stillFresh
        kind: internal
      - id: sink.Commit
        kind: value
      - id: n.stop
        kind: internal
      - id: n.HardClose
        kind: internal
      - id: n.stoppedErr
        kind: internal
      - id: n.aq.push
        kind: internal
      - id: alsoFailed
        kind: internal
      - id: n.installed
        kind: internal
    steps:
      - bind: snapID
        eval: req.Offer.SnapshotID
      - eval: n.snapState.mu.Lock()
        to: n.snapState.mu.Lock
      - bind: sink
        eval: n.snapState.spools[snapID]
      - eval: delete(n.snapState.spools, snapID)
      - eval: n.snapState.mu.Unlock()
        to: n.snapState.mu.Unlock
      - opt:
          do:
            - return: origin(coreconsensus.SnapshotCorrupt, errs.String("why", "no accepted offer"))
              to: origin
          when: sink == nil
      - bind: meta
        eval: req.Offer.Meta
      - bind: want
        eval: meta.EncodedSize - req.Offset
      - bind: k, err
        eval: io.Copy(sink, io.LimitReader(req.Body, want+1))
        to: io
      - opt:
          do:
            - return: snapshotCorrupt("stream ended early")
              to: snapshotCorrupt
          when: err != nil || k != want
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: n.stillFresh(&req, sink)
            to: n.stillFresh
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - eval: n.stop(err, true)
                    to: n.stop
                when: errs.HasCode(err, coreconsensus.CodeStorageFailed)
            - return: err
          init:
            bind: err
            eval: sink.Commit(meta)
            to: sink.Commit
          when: err != nil
      - opt:
          do:
            - go: n.HardClose()
              to: n.HardClose
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: n.crashAfterPublish.Load()
      - bind: done
        eval: make(chan error, 1)
      - eval: "n.aq.push(applyItem{restore: &restoreReq{meta: meta, done: done}})"
        to: n.aq.push
      - select:
          cases:
            - comm: err = <-done
            - comm: <-n.stopc
              do:
                - return: n.stoppedErr()
                  to: n.stoppedErr
      - opt:
          do:
            - return: alsoFailed(err, "remove", n.cfg.Snapshots.Remove(snapID))
              to: alsoFailed
          when: err != nil
      - eval: n.installed(meta, req.From.ID)
        to: n.installed
      - return: nil
  - of: (*Node).stillFresh
    participants:
      - id: caller
        kind: actor
      - id: (*Node).stillFresh
        kind: self
      - id: n.stoppedErr
        kind: internal
      - id: abandon
        kind: internal
      - id: n.stop
        kind: internal
      - id: origin
        kind: internal
    steps:
      - var:
          name: code
          type: errs.Code
      - var:
          name: adoptErr
          type: error
      - opt:
          do:
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: |-
            !n.exec(func() {
            		if code = n.r.CheckOffer(req.From.ID, req.Offer, n.r.NoTable()); code == 0 {
            			adoptErr = n.adoptLineage(req.Offer.Meta.Log)
            		}
            	})
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - eval: n.stop(adoptErr, true)
              to: n.stop
            - return: adoptErr
          when: adoptErr != nil
      - opt:
          do:
            - eval: abandon(sink.Abort())
              to: abandon
            - return: origin(coreconsensus.AdminPreconditionFailed, errs.String("why", "the offer is no longer fresh"))
              to: origin
          when: code != 0
      - return: nil
  - of: (*Node).installed
    participants:
      - id: caller
        kind: actor
      - id: (*Node).installed
        kind: self
      - id: n.exec
        kind: internal
      - id: n.retain
        kind: internal
      - id: n.obs.inc
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - eval: |-
          n.exec(func() {
          		n.r.InstallSnapshot(meta)
          		n.handleReady()
          	})
        to: n.exec
      - eval: n.retain()
        to: n.retain
      - eval: n.obs.inc(mSnapshotInstalls)
        to: n.obs.inc
      - eval: "n.obs.info(\"consensus: snapshot installed\", lattr(\"index\", meta.Position.Index), lattr(\"from\", uint64(from)))"
        to: n.obs.info
  - of: (*Node).join
    participants:
      - id: caller
        kind: actor
      - id: (*Node).join
        kind: self
      - id: n.joinReason
        kind: internal
    steps:
      - bind: pos, code, _
        eval: n.joinReason(ctx, from, r)
        to: n.joinReason
      - return: pos, code
  - of: (*Node).joinReason
    participants:
      - id: caller
        kind: actor
      - id: (*Node).joinReason
        kind: self
      - id: n.screenJoin
        kind: internal
      - id: n.cfg.JoinAuthorizer.Authorize
        kind: value
      - id: n.obs.warn
        kind: internal
      - id: n.addJoiner
        kind: internal
    steps:
      - bind: refuse
        eval:
          closure:
            params: why string
            results: coreconsensus.PositionValue, errs.Code, string
            steps:
              - return: coreconsensus.PositionValue{}, coreconsensus.CodeJoinRefused, why
      - opt:
          do:
            - return: refuse(why)
          init:
            bind: why
            eval: n.screenJoin(&from, &r)
            to: n.screenJoin
          when: why != ""
      - set: r.SPKI
        value: from.SPKI
      - opt:
          do:
            - return: refuse("one JOIN per slot per election timeout")
          when: n.joinRateLimited(r.Slot)
      - opt:
          do:
            - return: refuse("the slot still has a member")
          when: n.slotTaken(r.Slot)
      - bind: op, err
        eval: n.cfg.JoinAuthorizer.Authorize(ctx, r)
        to: n.cfg.JoinAuthorizer.Authorize
      - opt:
          do:
            - eval: "n.obs.warn(\"consensus: JOIN refused by the authorizer\", lstr(\"slot\", r.Slot), lstr(\"error\", err.Error()))"
              to: n.obs.warn
            - return: refuse(joinReasonOf(err))
          when: err != nil
      - opt:
          do:
            - return: refuse("the authorizer returned an invalid operator")
          when: "!op.Valid()"
      - return: n.addJoiner(ctx, op, &r)
        to: n.addJoiner
  - of: (*Node).screenJoin
    steps:
      - var:
          name: noKey
          type: "[32]byte"
      - switch:
          cases:
            - case: n.cfg.JoinAuthorizer == nil
              do:
                - return: "\"this cluster admits no JOIN\""
            - case: r.Cluster != n.lineage().Cluster
              do:
                - return: "\"another cluster\""
            - case: r.Slot != from.Slot
              do:
                - return: "\"the slot differs from the certificate's\""
            - case: from.SPKI == noKey
              do:
                - return: "\"no key\""
      - return: "\"\""
  - of: (*Node).joinRateLimited
    participants:
      - id: caller
        kind: actor
      - id: (*Node).joinRateLimited
        kind: self
      - id: n.joinMu.Lock
        kind: value
      - id: n.clk.Now
        kind: value
      - id: n.joinMu.Unlock
        kind: value
      - id: n.joinRefused.Add
        kind: value
      - id: n.obs.inc
        kind: internal
    steps:
      - eval: n.joinMu.Lock()
        to: n.joinMu.Lock
      - opt:
          do:
            - set: n.lastJoin
              value: map[string]time.Time{}
          when: n.lastJoin == nil
      - bind: now
        eval: n.clk.Now()
        to: n.clk.Now
      - opt:
          do:
            - eval: n.joinMu.Unlock()
              to: n.joinMu.Unlock
            - eval: n.joinRefused.Add(1)
              to: n.joinRefused.Add
            - eval: n.obs.inc(mJoinsRateLimited)
              to: n.obs.inc
            - return: "true"
          init:
            bind: last, ok
            eval: n.lastJoin[slot]
          when: ok && now.Sub(last) < n.Status().Timing.ElectionTimeoutMin
      - set: n.lastJoin[slot]
        value: now
      - eval: n.joinMu.Unlock()
        to: n.joinMu.Unlock
      - return: "false"
  - of: (*Node).addJoiner
    participants:
      - id: caller
        kind: actor
      - id: (*Node).addJoiner
        kind: self
      - id: wire
        kind: package
      - id: n.submit
        kind: internal
      - id: errs
        kind: package
      - id: tok.Position
        kind: value
    steps:
      - bind: m
        eval: "coreconsensus.MemberValue{ID: r.ID, Incarnation: r.Incarnation, Slot: r.Slot, SPKI: r.SPKI, Address: r.Address, Joining: true}"
      - bind: a
        eval: |-
          new(wire.AdminValue{
          		Operator: string(op), Change: wire.ChangeAddLearner, Target: m.ID,
          		Membership: coreconsensus.MembershipValue{Members: []coreconsensus.MemberValue{m}},
          	})
      - bind: data
        eval: wire.AppendAdmin(nil, a)
        to: wire
      - bind: tok, _, err
        eval: "n.submit(ctx, coreconsensus.EntryValue{Kind: coreconsensus.EntryMembership, BodySum: wire.BodySum(data), Data: data}, true)"
        to: n.submit
      - opt:
          do:
            - bind: c, ok
              eval: errs.CodeOf(err)
              to: errs
            - opt:
                do:
                  - set: c
                    value: coreconsensus.CodeJoinRefused
                when: "!ok"
            - bind: reason, _
              eval: errs.ReasonOf(err)
              to: errs
            - return: coreconsensus.PositionValue{}, c, reason
          when: err != nil
      - return: tok.Position(), 0, ""
        to: tok.Position
  - of: NewMemoryLog
    steps:
      - return: "&MemoryLog{first: 1}"
  - of: compacted
    participants:
      - id: caller
        kind: actor
      - id: compacted
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreconsensus.Compacted, errs.WrapParams{},
          		errs.String("index", u64s(index)), errs.String("first", u64s(first)))
        to: errs
  - of: (*MemoryLog).Term
    steps:
      - lock:
          mutex: l.mu
          read: true
      - switch:
          cases:
            - case: index == l.first-1
              do:
                - return: l.prevTerm, nil
            - case: index < l.first
              do:
                - return: 0, compacted(index, l.first)
            - case: index >= l.first+uint64(len(l.ents))
              do:
                - return: 0, storageFailed("term", errImpossible)
      - return: l.ents[index-l.first].Position.Term, nil
  - of: (*MemoryLog).Bounds
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.first, l.first + uint64(len(l.ents)) - 1
  - of: (*MemoryLog).Append
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).Append
        kind: self
      - id: storageFailed
        kind: internal
    steps:
      - lock:
          mutex: l.mu
      - loop:
          do:
            - opt:
                do:
                  - return: storageFailed("append", errImpossible)
                    to: storageFailed
                when: e.Position.Index != l.first+uint64(len(l.ents))
            - set: l.ents
              value: append(l.ents, e)
          key: _
          range: entries
          value: e
      - opt:
          do:
            - set: l.hs
              value: "*hs"
          when: hs != nil
      - return: nil
  - of: (*MemoryLog).Sync
    steps:
      - lock:
          mutex: l.mu
      - op: ++
        set: l.syncCount
      - return: l.failSync
  - of: (*MemoryLog).FailSync
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).FailSync
        kind: self
      - id: l.mu.Lock
        kind: value
      - id: l.mu.Unlock
        kind: value
    steps:
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - set: l.failSync
        value: err
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
  - of: (*MemoryLog).TruncateSuffix
    steps:
      - lock:
          mutex: l.mu
      - opt:
          do:
            - set: from
              value: l.first
          when: from < l.first
      - opt:
          do:
            - set: l.ents
              value: l.ents[:n]
          init:
            bind: "n"
            eval: from - l.first
          when: n < uint64(len(l.ents))
      - return: nil
  - of: (*MemoryLog).CompactPrefix
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).CompactPrefix
        kind: self
      - id: l.compactPrefixAt
        kind: internal
    steps:
      - return: l.compactPrefixAt(through, 0)
        to: l.compactPrefixAt
  - of: (*MemoryLog).compactPrefixAt
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).compactPrefixAt
        kind: self
      - id: storageFailed
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: nil
          when: through < l.first
      - bind: last
        eval: l.first + uint64(len(l.ents)) - 1
      - opt:
          do:
            - return: storageFailed("compact", errImpossible)
              to: storageFailed
          when: through <= last && term != 0 && term != l.ents[through-l.first].Position.Term
      - opt:
          do:
            - alt:
                - do:
                    - set: l.prevTerm
                      value: l.ents[len(l.ents)-1].Position.Term
                  when: through == last && len(l.ents) > 0
                - do:
                    - set: l.prevTerm
                      value: term
                  else: true
            - set: l.ents
              value: nil
            - set: l.first
              value: through + 1
            - return: nil
          when: through >= last
      - set: l.prevTerm
        value: l.ents[through-l.first].Position.Term
      - set: l.ents
        to: slices
        value: slices.Clone(l.ents[through-l.first+1:])
      - set: l.first
        value: through + 1
      - return: nil
  - of: (*MemoryLog).HardState
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.hs, nil
  - of: (*MemoryLog).Stamp
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.stamp, nil
  - of: (*MemoryLog).WriteStamp
    steps:
      - lock:
          mutex: l.mu
      - set: l.stamp, l.stamped
        value: s, true
      - return: nil
  - of: (*MemoryLog).Close
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).Close
        kind: self
      - id: l.mu.Lock
        kind: value
      - id: l.mu.Unlock
        kind: value
    steps:
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - set: l.closed
        value: "true"
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
      - return: nil
  - of: NewMemorySnapshots
    steps:
      - return: "&MemorySnapshots{done: map[string]*memSnap{}, spools: map[string]*memSink{}}"
  - of: (*MemorySnapshots).Create
    participants:
      - id: caller
        kind: actor
      - id: (*MemorySnapshots).Create
        kind: self
      - id: alignedOffset
        kind: internal
      - id: sp.buf.Truncate
        kind: value
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - bind: "off"
              eval: alignedOffset(sp.buf.Bytes())
              to: alignedOffset
            - eval: sp.buf.Truncate(int(off))
              to: sp.buf.Truncate
            - return: sp, off, nil
          init:
            bind: sp, ok
            eval: s.spools[id]
          when: ok
      - bind: sp
        eval: "&memSink{s: s, id: id, meta: meta}"
      - set: s.spools[id]
        value: sp
      - return: sp, 0, nil
  - of: (*memSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*memSink).Write
        kind: self
      - id: k.buf.Write
        kind: value
    steps:
      - lock:
          mutex: k.s.mu
      - return: k.buf.Write(p)
        to: k.buf.Write
  - of: (*memSink).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*memSink).Commit
        kind: self
      - id: snapshotCorrupt
        kind: internal
    steps:
      - lock:
          mutex: k.s.mu
      - opt:
          do:
            - return: snapshotCorrupt("encoded size")
              to: snapshotCorrupt
          when: int64(k.buf.Len()) != final.EncodedSize
      - set: final.ID
        value: k.id
      - set: k.s.done[k.id]
        value: "&memSnap{meta: final, data: bytes.Clone(k.buf.Bytes())}"
      - eval: delete(k.s.spools, k.id)
      - return: nil
  - of: (*memSink).Abort
    steps:
      - lock:
          mutex: k.s.mu
      - eval: delete(k.s.spools, k.id)
      - return: nil
  - of: (*MemorySnapshots).List
    participants:
      - id: caller
        kind: actor
      - id: (*MemorySnapshots).List
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: s.mu
      - bind: out
        eval: make([]coreconsensus.SnapshotMetaValue, 0, len(s.done))
      - loop:
          do:
            - set: out
              value: append(out, x.meta)
          key: _
          range: s.done
          value: x
      - eval: |-
          slices.SortFunc(out, func(a, b coreconsensus.SnapshotMetaValue) int {
          		switch {
          		case a.Position.Index > b.Position.Index:
          			return -1
          		case a.Position.Index < b.Position.Index:
          			return 1
          		}
          		return 0
          	})
        to: slices
      - return: out, nil
  - of: (*memHandle).Meta
    steps:
      - return: h.snap.meta
  - of: (*memHandle).Close
    participants:
      - id: caller
        kind: actor
      - id: (*memHandle).Close
        kind: self
      - id: h.once.Do
        kind: value
    steps:
      - eval: |-
          h.once.Do(func() {
          		h.s.mu.Lock()
          		h.snap.pins--
          		h.s.mu.Unlock()
          	})
        to: h.once.Do
      - return: nil
  - of: (*MemorySnapshots).Open
    steps:
      - lock:
          mutex: s.mu
      - bind: x, ok
        eval: s.done[id]
      - opt:
          do:
            - return: nil, origin(coreconsensus.SnapshotCorrupt, errs.String("id", id), errs.String("why", "unknown"))
          when: "!ok"
      - op: ++
        set: x.pins
      - return: "&memHandle{Reader: bytes.NewReader(x.data), s: s, snap: x}, nil"
  - of: (*MemorySnapshots).Remove
    participants:
      - id: caller
        kind: actor
      - id: (*MemorySnapshots).Remove
        kind: self
      - id: pinnedSnapshot
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - opt:
                do:
                  - return: pinnedSnapshot()
                    to: pinnedSnapshot
                when: x.pins > 0
            - eval: delete(s.done, id)
          init:
            bind: x, ok
            eval: s.done[id]
          when: ok
      - return: nil
  - of: NewMemoryNetwork
    steps:
      - return: "&MemoryNetwork{nodes: map[coreconsensus.NodeID]*MemoryTransport{}, cut: map[[2]coreconsensus.NodeID]bool{}}"
  - of: NewMemoryTransport
    steps:
      - lock:
          mutex: n.mu
      - opt:
          do:
            - return: t
          init:
            bind: t, ok
            eval: n.nodes[id]
          when: ok
      - bind: t
        eval: |-
          &MemoryTransport{
          		net: n, id: id,
          		ctrl: make(chan memFrame, memQueueFrames), data: make(chan memFrame, memQueueFrames),
          	}
      - set: n.nodes[id]
        value: t
      - return: t
  - of: (*MemoryNetwork).Cut
    steps:
      - lock:
          mutex: n.mu
      - alt:
          - do:
              - set: n.cut[[2]coreconsensus.NodeID{a, b}]
                value: "true"
            when: cut
          - do:
              - eval: delete(n.cut, [2]coreconsensus.NodeID{a, b})
            else: true
  - of: (*MemoryNetwork).Isolate
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryNetwork).Isolate
        kind: self
      - id: n.mu.Lock
        kind: value
      - id: slices
        kind: stdlib
      - id: n.mu.Unlock
        kind: value
      - id: n.Cut
        kind: internal
    steps:
      - eval: n.mu.Lock()
        to: n.mu.Lock
      - bind: ids
        eval: slices.Collect(maps.Keys(n.nodes))
        to: slices
      - eval: n.mu.Unlock()
        to: n.mu.Unlock
      - loop:
          do:
            - opt:
                do:
                  - eval: n.Cut(id, x, cut)
                    to: n.Cut
                  - eval: n.Cut(x, id, cut)
                    to: n.Cut
                when: x != id
          key: _
          range: ids
          value: x
  - of: (*MemoryNetwork).route
    steps:
      - lock:
          mutex: n.mu
      - opt:
          do:
            - return: nil
          when: n.cut[[2]coreconsensus.NodeID{from, to}]
      - return: n.nodes[to]
  - of: (*memRun).end
    participants:
      - id: caller
        kind: actor
      - id: (*memRun).end
        kind: self
      - id: r.once.Do
        kind: value
    steps:
      - eval: r.once.Do(func() { close(r.stop) })
        to: r.once.Do
  - of: (*MemoryTransport).Send
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryTransport).Send
        kind: self
      - id: t.net.route
        kind: internal
      - id: wire
        kind: package
    steps:
