                do:
                  - var:
                      name: goOn
                      type: bool
                  - opt:
                      do:
                        - return: ""
                      init:
                        bind: delay, goOn
                        eval: t.acceptFailed(err, delay, wait)
                        op: =
                        to: t.acceptFailed
                      when: "!goOn"
                  - continue: true
                when: err != nil
            - set: delay
              value: "0"
            - eval: t.mu.Lock()
              to: t.mu.Lock
            - opt:
                do:
                  - eval: t.mu.Unlock()
                    to: t.mu.Unlock
                  - eval: abandon(c.Close())
                    to: abandon
                  - return: ""
                when: t.closed
            - bind: release, ok
              eval: t.admission.Admit(c.RemoteAddr())
              to: t.admission.Admit
            - opt:
                do:
                  - eval: t.mu.Unlock()
                    to: t.mu.Unlock
                  - eval: abandon(c.Close())
                    to: abandon
                  - continue: true
                when: "!ok"
            - set: t.raw[c]
              value: struct{}{}
            - eval: t.wg.Add(1)
              to: t.wg.Add
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - go: t.serve(c, release)
              to: t.serve
          forever: true
  - of: (*TCPTransport).acceptFailed
