  - of: (*fileLog).syncFailedAtOpen
    participants:
      - id: caller
        kind: actor
      - id: (*fileLog).syncFailedAtOpen
        kind: self
      - id: storageFailed
        kind: internal
      - id: l.markStopEach
        kind: internal
      - id: noteUnmarked
        kind: internal
      - id: alsoFailed
        kind: internal
    steps:
      - bind: err
        eval: storageFailed(op, cause)
        to: storageFailed
      - opt:
          do:
            - return: err
          when: "!syncRan(cause)"
