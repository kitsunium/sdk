          		t.mu.Lock()
          		delete(t.raw, raw)
          		t.mu.Unlock()
          	}()
      - defer: release()
      - bind: conn, pid, lane, ok
        eval: t.handshake(raw, release)
        to: t.handshake
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: _, slot, err
        eval: parseSAN(pid.Leaf)
        to: parseSAN
      - opt:
          do:
            - return: ""
          when: err != nil
      - eval: t.serveAuthenticated(conn, &pid, lane, slot)
        to: t.serveAuthenticated
  - of: (*TCPTransport).handshake
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).handshake
        kind: self
      - id: tls
        kind: stdlib
      - id: conn.SetDeadline
        kind: value
      - id: conn.Handshake
        kind: value
      - id: tlsid
        kind: package
      - id: io
        kind: stdlib
    steps:
      - set: conn
        to: tls
        value: tls.Server(raw, t.id.ServerConfig(t.checkPeer(nil)))
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: err
            eval: conn.SetDeadline(time.Now().Add(t.cfg.HandshakeTimeout))
            to: conn.SetDeadline
          when: err != nil
      - bind: err
        eval: conn.Handshake()
        to: conn.Handshake
      - eval: release()
      - opt:
          do:
            - return: nil, pid, 0, false
          when: err != nil
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: pid, ok
            eval: tlsid.PeerOf(conn.ConnectionState())
            op: =
            to: tlsid
          when: "!ok"
      - var:
          name: laneByte
          type: "[1]byte"
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: _, err
            eval: io.ReadFull(conn, laneByte[:])
            to: io
          when: err != nil
      - opt:
          do:
            - return: nil, pid, 0, false
          init:
            bind: err
            eval: conn.SetDeadline(time.Time{})
            to: conn.SetDeadline
          when: err != nil
      - return: conn, pid, laneByte[0], true
  - of: (*TCPTransport).serveAuthenticated
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveAuthenticated
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.serveJoin
        kind: internal
      - id: t.serveMember
        kind: internal
    steps:
      - bind: spki
        eval: pid.SPKI
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: m, member
        eval: t.bySPKI[spki]
      - opt:
          do:
            - set: t.in[conn]
              value: spki
          when: member
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - defer: |-
          func() {
          		t.mu.Lock()
          		delete(t.in, conn)
          		t.mu.Unlock()
          	}()
      - opt:
          do:
            - eval: "t.serveJoin(conn, coreconsensus.AuthenticatedPeerValue{Slot: slot, SPKI: spki})"
              to: t.serveJoin
            - return: ""
          when: lane == laneJoin
      - opt:
          do:
            - return: ""
          when: "!member || m.Slot != slot"
      - bind: peer
        eval: "coreconsensus.AuthenticatedPeerValue{ID: m.ID, Incarnation: m.Incarnation, Slot: slot, SPKI: spki}"
      - eval: t.serveMember(conn, peer, pid.Leaf, lane)
        to: t.serveMember
  - of: (*TCPTransport).serveMember
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveMember
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: time.Now().Add
        kind: value
      - id: conn.SetReadDeadline
        kind: value
      - id: t.readFrames
        kind: internal
      - id: t.serveSnapshot
        kind: internal
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.peerExpiry[peer.ID]
        value: leaf.NotAfter
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: deadline
        eval: time.Now().Add(t.cfg.MaxConnectionAge)
        to: time.Now().Add
      - opt:
          do:
            - set: deadline
              value: leaf.NotAfter
          when: leaf.NotAfter.Before(deadline)
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: conn.SetReadDeadline(deadline)
            to: conn.SetReadDeadline
          when: err != nil
      - switch:
          cases:
            - case: laneControl, laneData
              do:
                - bind: limit
                  eval: t.cfg.MaxFrameBytes
                - opt:
                    do:
                      - set: limit
                        value: t.cfg.MaxControlFrameBytes
                    when: lane == laneControl
                - eval: t.readFrames(conn, peer, limit)
                  to: t.readFrames
            - case: laneSnapshot
              do:
                - eval: t.serveSnapshot(conn, peer)
                  to: t.serveSnapshot
            - default: true
          "on": lane
  - of: (*TCPTransport).readFrames
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).readFrames
        kind: self
      - id: bufio
        kind: stdlib
      - id: readFrame
        kind: internal
      - id: t.deliverTo
        kind: internal
    steps:
      - bind: r
        eval: bufio.NewReaderSize(c, connBufferBytes)
        to: bufio
      - var:
          name: buf
          type: "[]byte"
      - loop:
          do:
            - bind: frame, ok
              eval: readFrame(r, buf, limit)
              to: readFrame
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - set: buf
              value: frame
            - bind: d, still
              eval: t.deliverTo(peer.SPKI)
              to: t.deliverTo
            - opt:
                do:
                  - return: ""
                when: "!still"
            - opt:
                do:
                  - eval: d(peer, frame)
                when: d != nil
          forever: true
  - of: readFrame
    participants:
      - id: caller
        kind: actor
      - id: readFrame
        kind: self
      - id: io
        kind: stdlib
    steps:
      - var:
          name: h
          type: "[4]byte"
      - opt:
          do:
            - return: buf, false
          init:
            bind: _, err
            eval: io.ReadFull(r, h[:])
            to: io
          when: err != nil
      - bind: "n"
        eval: int(binary.LittleEndian.Uint32(h[:]))
      - opt:
          do:
            - return: buf, false
          when: n < minFrameBody || n+4 > limit
      - opt:
          do:
            - set: buf
              value: make([]byte, n+4)
          when: cap(buf) < n+4
      - set: buf
        value: buf[:n+4]
      - eval: copy(buf, h[:])
      - opt:
          do:
            - return: buf, false
          init:
            bind: _, err
            eval: io.ReadFull(r, buf[4:])
            to: io
          when: err != nil
      - return: buf, true
  - of: (*TCPTransport).deliverTo
    steps:
      - lock:
          mutex: t.mu
      - bind: _, still
        eval: t.bySPKI[spki]
      - return: t.deliver, still
  - of: (*TCPTransport).dial
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dial
        kind: self
      - id: t.dialVerified
        kind: internal
    steps:
      - return: t.dialVerified(ctx, addr, lane, t.checkPeer(pin))
        to: t.dialVerified
  - of: (*TCPTransport).dialAny
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dialAny
        kind: self
      - id: t.checkPeer
        kind: internal
      - id: t.dialVerified
        kind: internal
    steps:
      - bind: check
        eval: t.checkPeer(nil)
        to: t.checkPeer
      - return: |-
          t.dialVerified(ctx, addr, lane, func(p tlsid.PeerIdentityValue) error {
          		if err := check(p); err != nil {
          			return err
          		}
          		if !slices.Contains(pins, p.SPKI) {
          			return peerRejected("key is not one the joiner pins")
          		}
          		return nil
          	})
        to: t.dialVerified
  - of: (*TCPTransport).dialVerified
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).dialVerified
        kind: self
      - id: d.DialContext
        kind: value
      - id: tls
        kind: stdlib
      - id: c.SetDeadline
        kind: value
      - id: abandon
        kind: internal
      - id: c.HandshakeContext
        kind: value
      - id: c.Write
        kind: value
    steps:
      - bind: d
        eval: "net.Dialer{Timeout: t.cfg.HandshakeTimeout}"
      - bind: raw, err
        eval: d.DialContext(ctx, "tcp", addr)
        to: d.DialContext
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: c
        eval: tls.Client(raw, t.id.ClientConfig(verify))
        to: tls
      - opt:
          do:
            - eval: abandon(raw.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.HandshakeTimeout))
            to: c.SetDeadline
          when: err != nil
      - opt:
          do:
            - eval: abandon(raw.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.HandshakeContext(ctx)
            to: c.HandshakeContext
          when: err != nil
      - opt:
          do:
            - eval: abandon(c.Close())
              to: abandon
            - return: nil, err
          init:
            bind: _, err
            eval: c.Write([]byte{lane})
            to: c.Write
          when: err != nil
      - opt:
          do:
            - eval: abandon(c.Close())
              to: abandon
            - return: nil, err
          init:
            bind: err
            eval: c.SetDeadline(time.Time{})
            to: c.SetDeadline
          when: err != nil
      - return: c, nil
  - of: (*TCPTransport).address
    steps:
      - var:
          name: noPin
          type: "[32]byte"
      - lock:
          mutex: t.mu
      - bind: m, ok
        eval: t.byID[to]
      - opt:
          do:
            - return: "\"\", noPin, false"
          when: "!ok || m.SPKI == noPin"
      - bind: addr
        eval: m.Address
      - opt:
          do:
            - set: addr
              value: a
          init:
            bind: a, ok
            eval: t.cfg.Seeds[to]
          when: ok && addr == ""
      - return: addr, m.SPKI, addr != ""
  - of: (*TCPTransport).Send
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Send
        kind: self
      - id: wire
        kind: package
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.wg.Add
        kind: value
      - id: t.sender
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
    steps:
      - bind: lane
        eval: laneData
      - opt:
          do:
            - set: lane
              value: laneControl
          init:
            bind: l, err
            eval: wire.Lane(frame)
            to: wire
          when: err == nil && l == coreconsensus.LaneControl
      - bind: k
        eval: outKey{to, lane}
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - opt:
          do:
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - return: ""
          when: t.closed
      - bind: pc
        eval: t.out[k]
      - opt:
          do:
            - set: pc
              value: "&peerConn{queue: make(chan []byte, senderQueueFrames)}"
            - set: t.out[k]
              value: pc
            - eval: t.wg.Add(1)
              to: t.wg.Add
            - go: t.sender(k, pc)
              to: t.sender
          when: pc == nil
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - opt:
          do:
            - eval: pc.mu.Unlock()
              to: pc.mu.Unlock
            - return: ""
          when: pc.bytes+int64(len(frame)) > t.cfg.PeerQueueBytes
      - op: +=
        set: pc.bytes
        value: int64(len(frame))
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - select:
          cases:
            - comm: pc.queue <- frame
            - default: true
              do:
                - eval: pc.mu.Lock()
                  to: pc.mu.Lock
                - op: "-="
                  set: pc.bytes
                  value: int64(len(frame))
                - eval: pc.mu.Unlock()
                  to: pc.mu.Unlock
  - of: (*TCPTransport).sender
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).sender
        kind: self
      - id: t.wg.Done
        kind: value
      - id: link.close
        kind: internal
      - id: takeBatch
        kind: internal
      - id: t.sendBatch
        kind: internal
    steps:
      - defer: t.wg.Done()
        to: t.wg.Done
      - var:
          name: link
          type: senderLink
      - defer: link.close()
        to: link.close
      - var:
          name: batch
          type: "[][]byte"
      - loop:
          do:
            - var:
                name: f
                type: "[]byte"
            - select:
                cases:
                  - comm: <-t.done
                    do:
                      - return: ""
                  - comm: f = <-pc.queue
            - set: batch
              to: takeBatch
              value: takeBatch(append(batch[:0], f), pc)
            - eval: t.sendBatch(k, &link, batch)
              to: t.sendBatch
            - eval: clear(batch)
          forever: true
  - of: (*senderLink).close
    participants:
      - id: caller
        kind: actor
      - id: (*senderLink).close
        kind: self
      - id: abandon
        kind: internal
    steps:
      - opt:
          do:
            - eval: abandon(l.conn.Close())
              to: abandon
            - set: l.conn
              value: nil
          when: l.conn != nil
  - of: takeBatch
    participants:
      - id: caller
        kind: actor
      - id: takeBatch
        kind: self
      - id: queuedFrame
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
    steps:
      - loop:
          cond: len(batch) < maxSenderBatch
          do:
            - bind: g, ok
              eval: queuedFrame(pc)
              to: queuedFrame
            - opt:
                do:
                  - break: true
                when: "!ok"
            - set: batch
              value: append(batch, g)
      - bind: size
        eval: "0"
      - loop:
          do:
            - op: +=
              set: size
              value: len(b)
          key: _
          range: batch
          value: b
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - op: "-="
        set: pc.bytes
        value: int64(size)
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - return: batch
  - of: queuedFrame
    steps:
      - select:
          cases:
            - comm: g, ok := <-pc.queue
              do:
                - return: g, ok
            - default: true
              do:
                - return: nil, false
  - of: (*TCPTransport).sendBatch
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).sendBatch
        kind: self
      - id: link.close
        kind: internal
      - id: t.writeBatch
        kind: internal
      - id: t.reportUnreachable
        kind: internal
    steps:
      - opt:
          do:
            - eval: link.close()
              to: link.close
          when: link.conn != nil && time.Since(link.created) > t.cfg.MaxConnectionAge
      - bind: reused
        eval: link.conn != nil
      - opt:
          do:
            - return: ""
          when: "!reused && !t.redial(k, link)"
      - bind: err
        eval: t.writeBatch(link, batch)
        to: t.writeBatch
      - opt:
          do:
            - eval: link.close()
              to: link.close
            - opt:
                do:
                  - return: ""
                when: "!t.redial(k, link)"
            - set: err
              to: t.writeBatch
              value: t.writeBatch(link, batch)
          when: err != nil && reused
      - opt:
          do:
            - eval: link.close()
              to: link.close
            - eval: t.reportUnreachable(k.to)
              to: t.reportUnreachable
          when: err != nil
  - of: (*TCPTransport).writeBatch
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).writeBatch
        kind: self
      - id: link.conn.SetWriteDeadline
        kind: value
      - id: link.w.Write
        kind: value
      - id: link.w.Flush
        kind: value
    steps:
      - bind: err
        eval: link.conn.SetWriteDeadline(time.Now().Add(t.cfg.WriteTimeout))
        to: link.conn.SetWriteDeadline
      - loop:
          do:
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: _, err
              to: link.w.Write
              value: link.w.Write(b)
          key: _
          range: batch
          value: b
      - opt:
          do:
            - return: err
          when: err != nil
      - return: link.w.Flush()
        to: link.w.Flush
  - of: (*TCPTransport).redial
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).redial
        kind: self
      - id: t.address
        kind: internal
      - id: context
        kind: stdlib
      - id: t.dial
        kind: internal
      - id: boundUnacknowledged
        kind: internal
      - id: abandon
        kind: internal
      - id: time.Now().Add
        kind: value
      - id: t.reportUnreachable
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: time.Now().Before(link.backoff)
      - bind: addr, pin, ok
        eval: t.address(k.to)
        to: t.address
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), t.cfg.HandshakeTimeout)
        to: context
      - defer: cancel()
      - bind: c, err
        eval: t.dial(ctx, addr, k.lane, &pin)
        to: t.dial
      - opt:
          do:
            - opt:
                do:
                  - eval: abandon(c.Close())
                    to: abandon
                init:
                  bind: err
                  eval: boundUnacknowledged(c.NetConn(), t.cfg.WriteTimeout)
                  op: =
                  to: boundUnacknowledged
                when: err != nil
          when: err == nil
      - opt:
          do:
            - set: link.backoff
              to: time.Now().Add
              value: time.Now().Add(redialBackoff)
            - eval: t.reportUnreachable(k.to)
              to: t.reportUnreachable
            - return: "false"
          when: err != nil
      - set: link.conn, link.w, link.created
        value: c, bufio.NewWriterSize(c, connBufferBytes), time.Now()
      - return: "true"
  - of: (*TCPTransport).reportUnreachable
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).reportUnreachable
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: f
        eval: t.unreachable
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - opt:
          do:
            - eval: f(id)
          when: f != nil
  - of: (*TCPTransport).Unreachable
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Unreachable
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.unreachable
        value: f
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
  - of: (*TCPTransport).Bind
    steps:
      - lock:
          mutex: t.mu
      - set: t.deliver, t.offer, t.install, t.join
        value: deliver, offer, install, join
      - return: nil
  - of: (*TCPTransport).SetMembership
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).SetMembership
        kind: self
      - id: slices
        kind: stdlib
      - id: indexMembers
        kind: internal
      - id: t.reserveAddresses
        kind: internal
      - id: abandon
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - set: t.members[group]
        to: slices
        value: slices.Clone(admitted)
      - bind: byID, bySPKI
        eval: indexMembers(t.members)
        to: indexMembers
      - set: t.byID, t.bySPKI
        value: byID, bySPKI
      - eval: t.reserveAddresses(byID)
        to: t.reserveAddresses
      - loop:
          do:
            - opt:
                do:
                  - eval: abandon(c.Close())
                    to: abandon
                init:
                  bind: _, ok
                  eval: bySPKI[spki]
                when: "!ok"
          key: c
          range: t.in
          value: spki
  - of: indexMembers
    steps:
      - var:
          name: noPin
          type: "[32]byte"
      - bind: byID
        eval: map[coreconsensus.NodeID]coreconsensus.MemberValue{}
      - bind: bySPKI
        eval: map[[32]byte]coreconsensus.MemberValue{}
      - bind: shared
        eval: map[[32]byte]bool{}
      - loop:
          do:
            - loop:
                do:
                  - set: byID[m.ID]
                    value: m
                  - opt:
                      do:
                        - continue: true
                      when: m.SPKI == noPin
                  - opt:
                      do:
                        - set: shared[m.SPKI]
                          value: "true"
                      init:
                        bind: o, ok
                        eval: bySPKI[m.SPKI]
                      when: ok && o.ID != m.ID
                  - set: bySPKI[m.SPKI]
                    value: m
                key: _
                range: ms
                value: m
          key: _
          range: groups
          value: ms
      - loop:
          do:
            - eval: delete(bySPKI, k)
          key: k
          range: shared
      - return: byID, bySPKI
  - of: (*TCPTransport).reserveAddresses
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).reserveAddresses
        kind: self
      - id: t.resvSeq.Add
        kind: value
      - id: t.wg.Add
        kind: value
    steps:
      - bind: addrs
        eval: make([]string, 0, len(byID))
      - loop:
          do:
            - opt:
                do:
                  - set: addrs
                    value: append(addrs, m.Address)
                when: m.Address != ""
          key: _
          range: byID
          value: m
      - bind: seq
        eval: t.resvSeq.Add(1)
        to: t.resvSeq.Add
      - eval: t.wg.Add(1)
        to: t.wg.Add
      - go: |-
          func() {
          		defer t.wg.Done()
          		t.resvMu.Lock()
          		defer t.resvMu.Unlock()
          		if t.resvSeq.Load() == seq {
          			t.admission.SetReserved(addrs)
          		}
          	}()
  - of: (*TCPTransport).Close
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Close
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: t.doneOnce.Do
        kind: value
      - id: abandon
        kind: internal
      - id: t.ln.Close
        kind: value
      - id: t.wg.Wait
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - opt:
          do:
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
            - return: nil
          when: t.closed
      - set: t.closed
        value: "true"
      - eval: t.doneOnce.Do(func() { close(t.done) })
        to: t.doneOnce.Do
      - loop:
          do:
            - eval: abandon(c.Close())
              to: abandon
          key: c
          range: t.raw
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: err
        eval: t.ln.Close()
        to: t.ln.Close
      - eval: t.wg.Wait()
        to: t.wg.Wait
      - return: err
  - of: writeChunk
    participants:
      - id: caller
        kind: actor
      - id: writeChunk
        kind: self
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: w.Write
        kind: value
    steps:
      - var:
          name: h
          type: "[4]byte"
      - eval: binary.LittleEndian.PutUint32(h[:], uint32(len(b)))
        to: binary.LittleEndian.PutUint32
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: w.Write(h[:])
            to: w.Write
          when: err != nil
      - bind: _, err
        eval: w.Write(b)
        to: w.Write
      - return: err
  - of: readChunk
    participants:
      - id: caller
        kind: actor
      - id: readChunk
        kind: self
      - id: io
        kind: stdlib
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - var:
          name: h
          type: "[4]byte"
      - opt:
          do:
            - return: nil, err
          init:
            bind: _, err
            eval: io.ReadFull(r, h[:])
            to: io
          when: err != nil
      - bind: ln
        eval: binary.LittleEndian.Uint32(h[:])
        to: binary.LittleEndian.Uint32
      - opt:
          do:
            - return: nil, origin(coreconsensus.FrameInvalid, errs.Int64("length", int64(ln)))
          when: limit < 0 || uint64(ln) > uint64(limit)
      - bind: b
        eval: make([]byte, int(ln))
      - bind: _, err
        eval: io.ReadFull(r, b)
        to: io
      - return: b, err
  - of: encodeOffer
    participants:
      - id: caller
        kind: actor
      - id: encodeOffer
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: wire
        kind: package
    steps:
      - bind: b
        eval: binary.LittleEndian.AppendUint64(nil, o.Term)
        to: binary.LittleEndian.AppendUint64
      - return: wire.AppendSnapshotMeta(b, &o.Meta)
        to: wire
  - of: decodeOffer
    participants:
      - id: caller
        kind: actor
      - id: decodeOffer
        kind: self
      - id: wire
        kind: package
    steps:
      - opt:
          do:
            - return: coreconsensus.InstallOfferValue{}, origin(coreconsensus.FrameInvalid)
          when: len(b) < 8
      - bind: o
        eval: "coreconsensus.InstallOfferValue{Term: binary.LittleEndian.Uint64(b)}"
      - opt:
          do:
            - return: o, err
          init:
            bind: err
            eval: wire.ParseSnapshotMeta(b[8:], &o.Meta)
            to: wire
          when: err != nil
      - set: o.SnapshotID
        value: o.Meta.ID
      - return: o, nil
  - of: (*TCPTransport).Stream
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Stream
        kind: self
      - id: t.address
        kind: internal
      - id: peerRejected
        kind: internal
      - id: t.dial
        kind: internal
      - id: context
        kind: stdlib
      - id: writeChunk
        kind: internal
      - id: readChunk
        kind: internal
      - id: origin
        kind: internal
      - id: errs
        kind: package
      - id: streamFrom
        kind: internal
      - id: installResult
        kind: internal
    steps:
      - bind: addr, pin, ok
        eval: t.address(to)
        to: t.address
      - opt:
          do:
            - return: peerRejected("no address")
              to: peerRejected
          when: "!ok"
      - bind: c, err
        eval: t.dial(ctx, addr, laneSnapshot, &pin)
        to: t.dial
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: func() { abandon(c.Close()) }()
      - bind: stop
        eval: context.AfterFunc(ctx, func() { abandon(c.Close()) })
        to: context
      - defer: stop()
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: writeChunk(c, encodeOffer(offer))
            to: writeChunk
          when: err != nil
      - bind: acc, err
        eval: readChunk(c, 64)
        to: readChunk
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("what", "install accept"))
              to: origin
          when: err != nil || len(acc) != 13
      - bind: "off"
        eval: int64(binary.LittleEndian.Uint64(acc))
      - bind: code
        eval: errs.Code(binary.LittleEndian.Uint32(acc[8:]))
        to: errs
      - opt:
          do:
            - return: nil
          when: acc[12] != 0
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          when: code != 0
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: streamFrom(c, open, off)
            to: streamFrom
          when: err != nil
      - return: installResult(c)
        to: installResult
  - of: streamFrom
    participants:
      - id: caller
        kind: actor
      - id: streamFrom
        kind: self
      - id: io
        kind: stdlib
      - id: rc.Close
        kind: value
      - id: c.CloseWrite
        kind: internal
    steps:
      - bind: rc, err
        eval: open(off)
      - opt:
          do:
            - return: err
          when: err != nil
      - set: _, err
        to: io
        value: io.Copy(c, rc)
      - opt:
          do:
            - set: err
              value: cerr
          init:
            bind: cerr
            eval: rc.Close()
            to: rc.Close
          when: cerr != nil && err == nil
      - opt:
          do:
            - return: err
          when: err != nil
      - return: c.CloseWrite()
        to: c.CloseWrite
  - of: installResult
    participants:
      - id: caller
        kind: actor
      - id: installResult
        kind: self
      - id: readChunk
        kind: internal
      - id: origin
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: res, err
        eval: readChunk(c, 8)
        to: readChunk
      - opt:
          do:
            - return: origin(coreconsensus.FrameInvalid, errs.String("what", "install result"))
              to: origin
          when: err != nil || len(res) != 4
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          init:
            bind: code
            eval: errs.Code(binary.LittleEndian.Uint32(res))
            to: errs
          when: code != 0
      - return: nil
  - of: (*TCPTransport).serveSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveSnapshot
        kind: self
      - id: readChunk
        kind: internal
      - id: decodeOffer
        kind: internal
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: writeChunk
        kind: internal
      - id: context
        kind: stdlib
      - id: errs
        kind: package
      - id: abandon
        kind: internal
    steps:
      - bind: b, err
        eval: readChunk(c, t.cfg.MaxControlFrameBytes)
        to: readChunk
      - opt:
          do:
            - return: ""
          when: err != nil
      - bind: o, err
        eval: decodeOffer(b)
        to: decodeOffer
      - opt:
          do:
            - return: ""
          when: err != nil
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: of, in
        eval: t.offer, t.install
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - opt:
          do:
            - return: ""
          when: of == nil || in == nil
      - bind: acc
        eval: of(peer, o)
      - bind: reply
        eval: binary.LittleEndian.AppendUint64(nil, uint64(acc.Offset))
        to: binary.LittleEndian.AppendUint64
      - set: reply
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(reply, uint32(acc.Refused))
      - set: reply
        value: append(reply, boolByte(acc.Held))
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: writeChunk(c, reply)
            to: writeChunk
          when: err != nil || acc.Refused != 0 || acc.Held
      - bind: ctx, cancel
        eval: context.WithCancel(context.Background())
        to: context
      - defer: cancel()
      - bind: ierr
        eval: |-
          in(coreconsensus.InstallParams{
          		Ctx: ctx, From: peer, Offer: o, Offset: acc.Offset,
          		Body: io.LimitReader(c, o.Meta.EncodedSize-acc.Offset),
          	})
      - var:
          name: code
          type: errs.Code
      - opt:
          do:
            - set: code, _
              to: errs
              value: errs.CodeOf(ierr)
            - opt:
                do:
                  - set: code
                    value: coreconsensus.CodeSnapshotCorrupt
                when: code == 0
          when: ierr != nil
      - eval: abandon(writeChunk(c, binary.LittleEndian.AppendUint32(nil, uint32(code))))
        to: abandon
  - of: encodeJoin
    participants:
      - id: caller
        kind: actor
      - id: encodeJoin
        kind: self
      - id: slices
        kind: stdlib
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: b
        eval: slices.Clone(r.Cluster[:])
        to: slices
      - set: b
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(b, uint64(r.ID))
      - set: b
        value: append(b, r.Incarnation[:]...)
      - set: b
        value: append(b, byte(len(r.Slot)))
      - set: b
        value: append(b, r.Slot...)
      - return: append(b, r.Address...)
  - of: decodeJoin
    participants:
      - id: caller
        kind: actor
      - id: decodeJoin
        kind: self
      - id: coreconsensus
        kind: package
    steps:
      - var:
          name: r
          type: coreconsensus.JoinRequestValue
      - opt:
          do:
            - return: r, false
          when: len(b) < 16+8+16+1
      - eval: copy(r.Cluster[:], b)
      - set: r.ID
        to: coreconsensus
        value: coreconsensus.NodeID(binary.LittleEndian.Uint64(b[16:]))
      - eval: copy(r.Incarnation[:], b[24:])
      - bind: "n"
        eval: int(b[40])
      - opt:
          do:
            - return: r, false
          when: 41+n > len(b)
      - set: r.Slot
        value: "string(b[41 : 41+n])"
      - set: r.Address
        value: string(b[41+n:])
      - return: r, true
  - of: (*TCPTransport).serveJoin
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).serveJoin
        kind: self
      - id: c.SetDeadline
        kind: value
      - id: readChunk
        kind: internal
      - id: decodeJoin
        kind: internal
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: sanitizeReason
        kind: internal
      - id: binary.LittleEndian.AppendUint16
        kind: value
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
      - id: wire
        kind: package
      - id: abandon
        kind: internal
      - id: context
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.JoinTimeout))
            to: c.SetDeadline
          when: err != nil
      - bind: b, err
        eval: readChunk(c, 512)
        to: readChunk
      - opt:
          do:
            - return: ""
          when: err != nil
      - bind: req, ok
        eval: decodeJoin(b)
        to: decodeJoin
      - bind: reply
        eval:
          closure:
            params: code errs.Code, pos coreconsensus.PositionValue, reason string
            steps:
              - bind: out
                eval: binary.LittleEndian.AppendUint32(nil, uint32(code))
                to: binary.LittleEndian.AppendUint32
              - set: out
                to: binary.LittleEndian.AppendUint64
                value: binary.LittleEndian.AppendUint64(out, pos.Term)
              - set: out
                to: binary.LittleEndian.AppendUint64
                value: binary.LittleEndian.AppendUint64(out, pos.Index)
              - opt:
                  do:
                    - bind: r
                      eval: sanitizeReason(reason)
                      to: sanitizeReason
                    - set: out
                      to: binary.LittleEndian.AppendUint16
                      value: binary.LittleEndian.AppendUint16(out, uint16(len(r)))
                    - set: out
                      value: append(out, r...)
                  when: code != 0
              - opt:
                  do:
                    - eval: t.mu.Lock()
                      to: t.mu.Lock
                    - bind: m
                      eval: "coreconsensus.MembershipValue{Members: slices.Collect(maps.Values(t.byID))}"
                    - eval: t.mu.Unlock()
                      to: t.mu.Unlock
                    - set: out
                      to: wire
                      value: wire.AppendMembership(out, &m)
                  when: code == 0
              - eval: abandon(writeChunk(c, out))
                to: abandon
      - opt:
          do:
            - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "malformed JOIN")
            - return: ""
          when: "!ok"
      - opt:
          do:
            - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "the slot differs from the certificate's")
            - return: ""
          when: req.Slot != peer.Slot
      - set: req.SPKI
        value: peer.SPKI
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - bind: j, jr
        eval: t.join, t.joinR
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), t.cfg.JoinTimeout)
        to: context
      - defer: cancel()
      - switch:
          cases:
            - case: jr != nil
              do:
                - bind: pos, code, reason
                  eval: jr(ctx, peer, req)
                - eval: reply(code, pos, reason)
            - case: j != nil
              do:
                - bind: pos, code
                  eval: j(ctx, peer, req)
                - eval: reply(code, pos, "")
            - default: true
              do:
                - eval: reply(coreconsensus.CodeJoinRefused, coreconsensus.PositionValue{}, "")
  - of: (*TCPTransport).Join
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).Join
        kind: self
      - id: origin
        kind: internal
      - id: t.joinOne
        kind: internal
    steps:
      - bind: req
        eval: |-
          coreconsensus.JoinRequestValue{
          		Cluster: cfg.Stamp.Log.Cluster, ID: cfg.Stamp.ID, Incarnation: cfg.Stamp.Incarnation,
          		Slot: t.slot, Address: cfg.Address,
          	}
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, origin(coreconsensus.ClusterMismatch)
          when: req.Cluster != t.cluster
      - opt:
          do:
            - return: |-
                coreconsensus.PositionValue{}, transportMisconfigured("JoinConfig.Pins",
                			"empty: pass the members' SPKIs, from the founding member list (id:inc:slot:spki:addr) or a running member's Membership()")
          when: len(cfg.Pins) == 0
      - bind: last
        eval: origin(coreconsensus.JoinRefused, errs.String("why", "no address answered"))
        to: origin
      - var:
          name: refused
          type: error
      - loop:
          do:
            - bind: pos, answered, err
              eval: t.joinOne(ctx, addr, req, cfg.Pins)
              to: t.joinOne
            - switch:
                cases:
                  - case: err == nil
                    do:
                      - return: pos, nil
                  - case: answered
                    do:
                      - set: refused
                        value: err
                  - default: true
                    do:
                      - set: last
                        value: err
          key: _
          range: cfg.Addresses
          value: addr
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, refused
          when: refused != nil
      - return: coreconsensus.PositionValue{}, last
  - of: (*TCPTransport).joinOne
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).joinOne
        kind: self
      - id: t.dialAny
        kind: internal
      - id: tlsid
        kind: package
      - id: c.SetDeadline
        kind: value
      - id: writeChunk
        kind: internal
      - id: readChunk
        kind: internal
      - id: errs
        kind: package
      - id: joinAnswerReason
        kind: internal
      - id: wire
        kind: package
      - id: t.SetMembership
        kind: internal
    steps:
      - bind: c, derr
        eval: t.dialAny(ctx, addr, laneJoin, pins)
        to: t.dialAny
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, derr
          when: derr != nil
      - defer: func() { abandon(c.Close()) }()
      - bind: peer, verified
        eval: tlsid.PeerOf(c.ConnectionState())
        to: tlsid
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, peerRejected("no verified peer")
          when: "!verified"
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, err
          init:
            bind: err
            eval: c.SetDeadline(time.Now().Add(t.cfg.JoinTimeout))
            to: c.SetDeadline
          when: err != nil
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, err
          init:
            bind: err
            eval: writeChunk(c, encodeJoin(req))
            to: writeChunk
          when: err != nil
      - bind: b, rerr
        eval: readChunk(c, t.cfg.MaxControlFrameBytes)
        to: readChunk
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, origin(coreconsensus.FrameInvalid, errs.String("what", "join answer"))
          when: rerr != nil || len(b) < 20
      - opt:
          do:
            - bind: reason, _
              eval: joinAnswerReason(b[20:])
              to: joinAnswerReason
            - return: coreconsensus.PositionValue{}, true, joinRefused(code, reason)
          init:
            bind: code
            eval: errs.Code(binary.LittleEndian.Uint32(b))
            to: errs
          when: code != 0
      - bind: m, perr
        eval: wire.ParseMembership(b[20:])
        to: wire
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, perr
          when: perr != nil
      - opt:
          do:
            - return: coreconsensus.PositionValue{}, false, peerRejected("the answer does not list its own sender")
          when: "!joinAnswerListsPeer(m, peer.SPKI)"
      - eval: t.SetMembership(1, m.Members)
        to: t.SetMembership
      - return: "coreconsensus.PositionValue{Term: binary.LittleEndian.Uint64(b[4:]), Index: binary.LittleEndian.Uint64(b[12:])}, false, nil"
  - of: joinAnswerListsPeer
    participants:
      - id: caller
        kind: actor
      - id: joinAnswerListsPeer
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.ContainsFunc(m.Members, func(x coreconsensus.MemberValue) bool { return x.SPKI == spki })
        to: slices
  - of: joinAnswerReason
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: len(b) < 2
      - bind: "n"
        eval: int(binary.LittleEndian.Uint16(b))
      - opt:
          do:
            - return: "\"\", false"
          when: 2+n > len(b)
      - return: "string(b[2 : 2+n]), true"
  - of: (*TCPTransport).BindJoinReason
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).BindJoinReason
        kind: self
      - id: t.mu.Lock
        kind: value
      - id: t.mu.Unlock
        kind: value
    steps:
      - eval: t.mu.Lock()
        to: t.mu.Lock
      - set: t.joinR
        value: join
      - eval: t.mu.Unlock()
        to: t.mu.Unlock
  - of: (*TCPTransport).RefusedBeforeHandshake
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).RefusedBeforeHandshake
        kind: self
      - id: t.admission.Refused
        kind: value
    steps:
      - return: t.admission.Refused()
        to: t.admission.Refused
  - of: (*TCPTransport).CertExpiry
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).CertExpiry
        kind: self
      - id: t.id.Leaf
        kind: value
    steps:
      - bind: leaf, err
        eval: t.id.Leaf()
        to: t.id.Leaf
      - opt:
          do:
            - return: time.Time{}
          when: err != nil
      - return: leaf.NotAfter
  - of: (*TCPTransport).PeerCertExpiry
    participants:
      - id: caller
        kind: actor
      - id: (*TCPTransport).PeerCertExpiry
        kind: self
      - id: maps
        kind: stdlib
    steps:
      - lock:
          mutex: t.mu
      - return: maps.Clone(t.peerExpiry)
        to: maps
  - of: (*TCPTransport).ReloadFailures
    steps:
      - return: int(t.id.ReloadFailures())
  - of: (*TCPTransport).maxFrameBytes
    steps:
      - return: t.cfg.MaxFrameBytes
  - of: boundUnacknowledged
    participants:
      - id: caller
        kind: actor
      - id: boundUnacknowledged
        kind: self
      - id: tc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: tc, ok
        eval: c.(*net.TCPConn)
      - opt:
          do:
            - return: nil
          when: "!ok"
      - bind: rc, err
        eval: tc.SyscallConn()
        to: tc.SyscallConn
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: ms
        eval: int(d / time.Millisecond)
      - var:
          name: serr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: |-
              rc.Control(func(fd uintptr) {
              		serr = syscall.SetsockoptInt(int(fd), syscall.IPPROTO_TCP, tcpUserTimeout, ms)
              	})
            to: rc.Control
          when: err != nil
      - return: serr
