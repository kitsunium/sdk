      - id: caller
        kind: actor
      - id: (*TCPTransport).acceptFailed
        kind: self
      - id: acceptBackoff
        kind: internal
      - id: wait.Reset
        kind: value
    steps:
      - opt:
          do:
            - return: delay, false
          when: errors.Is(err, net.ErrClosed)
      - set: delay
        to: acceptBackoff
        value: acceptBackoff(delay)
      - eval: wait.Reset(delay)
        to: wait.Reset
      - select:
          cases:
            - comm: <-t.done
              do:
                - return: delay, false
            - comm: <-wait.C
              do:
                - return: delay, true
