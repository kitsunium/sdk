          do:
            - return: nil, transportMisconfigured("CertFile", err.Error())
          when: err != nil
      - bind: leaf, err
        eval: id.Leaf()
        to: id.Leaf
      - opt:
          do:
            - return: nil, transportMisconfigured("CertFile", err.Error())
          when: err != nil
      - opt:
          do:
            - return: nil, transportMisconfigured("CertFile", "URI SAN")
          init:
            bind: _, _, err
            eval: parseSAN(leaf)
            to: parseSAN
          when: err != nil
      - return: "&PEMIdentity{CertFile: certFile, KeyFile: keyFile, CAFile: caFile, id: id}, nil"
  - of: (*PEMIdentity).Roots
    participants:
