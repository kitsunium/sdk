          read: true
      - return: l.hs, nil
  - of: (*MemoryLog).Stamp
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.stamp, nil
  - of: (*MemoryLog).WriteStamp
    steps:
      - lock:
          mutex: l.mu
      - set: l.stamp, l.stamped
        value: s, true
      - return: nil
  - of: (*MemoryLog).Close
    participants:
      - id: caller
        kind: actor
      - id: (*MemoryLog).Close
        kind: self
      - id: l.mu.Lock
        kind: value
      - id: l.mu.Unlock
        kind: value
    steps:
      - eval: l.mu.Lock()
        to: l.mu.Lock
      - set: l.closed
        value: "true"
      - eval: l.mu.Unlock()
        to: l.mu.Unlock
      - return: nil
  - of: NewMemorySnapshots
    steps:
      - return: "&MemorySnapshots{done: map[string]*memSnap{}, spools: map[string]*memSink{}}"
  - of: (*MemorySnapshots).Create
    participants:
      - id: caller
        kind: actor
      - id: (*MemorySnapshots).Create
        kind: self
      - id: sp.buf.Bytes
        kind: value
      - id: alignedOffsetAt
        kind: internal
      - id: sp.buf.Truncate
        kind: value
    steps:
      - lock:
          mutex: s.mu
      - loop:
          do:
            - opt:
                do:
                  - eval: delete(s.spools, other)
                when: other != id
          key: other
          range: s.spools
      - opt:
          do:
            - bind: b
              eval: sp.buf.Bytes()
              to: sp.buf.Bytes
            - bind: off, err
              eval: alignedOffsetAt(bytes.NewReader(b), int64(len(b)), maxEncodedChunk(meta.ChunkSize))
              to: alignedOffsetAt
            - opt:
                do:
                  - return: nil, 0, err
                when: err != nil
            - eval: sp.buf.Truncate(int(off))
              to: sp.buf.Truncate
            - return: sp, off, nil
          init:
            bind: sp, ok
            eval: s.spools[id]
          when: ok
      - bind: sp
        eval: "&memSink{s: s, id: id, meta: meta}"
      - set: s.spools[id]
        value: sp
      - return: sp, 0, nil
  - of: (*memSink).Write
    participants:
      - id: caller
        kind: actor
      - id: (*memSink).Write
        kind: self
      - id: k.buf.Write
        kind: value
    steps:
      - lock:
          mutex: k.s.mu
      - return: k.buf.Write(p)
        to: k.buf.Write
  - of: (*memSink).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*memSink).Commit
