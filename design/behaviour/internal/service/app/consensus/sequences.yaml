          range: n.waiters
          value: p
  - of: (*Node).applied1
    participants:
      - id: caller
        kind: actor
      - id: (*Node).applied1
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.logApplied.Store
        kind: value
      - id: n.acond.Broadcast
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.pendingBytes.Add
        kind: value
      - id: n.token
        kind: internal
    steps:
      - eval: n.am.Lock()
        to: n.am.Lock
      - set: n.applied
        value: e.Position.Index
      - set: n.appliedTerm
        value: e.Position.Term
      - eval: n.logApplied.Store(e.Position.Index)
        to: n.logApplied.Store
