                          do:
                            - return: nil
                          when: st.Leader == to
                  - comm: <-t.C()
                    do:
                      - return: origin(coreconsensus.TransferFailed, errs.String("target", to.String()))
                        to: origin
                  - comm: <-ctx.Done()
                    do:
                      - return: origin(coreconsensus.TransferFailed, errs.String("cause", ctx.Err().Error()))
                        to: origin
          forever: true
