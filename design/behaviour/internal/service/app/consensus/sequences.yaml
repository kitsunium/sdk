        to: n.retain
      - opt:
          do:
            - return: ""
          when: len(metas) == 0
      - bind: older
        eval: metas[min(1, len(metas)-1)].Position.Index
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: applied
        eval: n.applied
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: through
        eval: min(older, applied)
