      - id: p.id.Certificate
        kind: value
    steps:
      - return: p.id.Certificate()
        to: p.id.Certificate
  - of: (*PEMIdentity).ReloadFailures
    steps:
      - return: int(p.id.ReloadFailures())
  - of: NewTCPTransportFromPEM
    participants:
      - id: caller
        kind: actor
      - id: NewTCPTransportFromPEM
        kind: self
      - id: NewPEMIdentity
        kind: internal
      - id: cfg.validate
        kind: internal
      - id: newTCPTransport
        kind: internal
    steps:
      - bind: p, err
        eval: NewPEMIdentity(certFile, keyFile, caFile)
        to: NewPEMIdentity
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: cfg
        eval: "*cfgIn"
      - set: cfg.Certificate, cfg.GetCertificate, cfg.Roots
        value: nil, p.GetCertificate, p.Roots()
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: cfg.validate()
            to: cfg.validate
          when: err != nil
      - return: newTCPTransport(&cfg, p.id)
        to: newTCPTransport
  - of: newFifo
    steps:
      - return: "&fifo[T]{signal: make(chan struct{}, 1)}"
  - of: (*fifo).push
    participants:
      - id: caller
        kind: actor
      - id: (*fifo).push
        kind: self
      - id: q.mu.Lock
        kind: value
      - id: q.mu.Unlock
        kind: value
    steps:
      - eval: q.mu.Lock()
        to: q.mu.Lock
      - set: q.items
        value: append(q.items, x)
      - eval: q.mu.Unlock()
        to: q.mu.Unlock
      - select:
          cases:
            - comm: q.signal <- struct{}{}
            - default: true
  - of: (*fifo).take
    participants:
      - id: caller
        kind: actor
      - id: (*fifo).take
        kind: self
      - id: q.mu.Lock
        kind: value
      - id: q.mu.Unlock
        kind: value
    steps:
      - eval: q.mu.Lock()
        to: q.mu.Lock
      - set: dst
        value: append(dst[:0], q.items...)
      - eval: clear(q.items)
      - set: q.items
        value: q.items[:0]
      - eval: q.mu.Unlock()
        to: q.mu.Unlock
      - return: dst
  - of: newChunkWriter
    steps:
      - return: "&chunkWriter{w: w, codec: codec, size: chunk, sum: sha256.New(), buf: make([]byte, 0, chunk)}"
  - of: (*chunkWriter).Write
    participants:
      - id: caller
        kind: actor
      - id: (*chunkWriter).Write
        kind: self
      - id: c.flush
        kind: internal
    steps:
      - bind: "n"
        eval: "0"
      - loop:
          cond: len(p) > 0
          do:
            - bind: k
              eval: min(len(p), c.size-len(c.buf))
            - set: c.buf
              value: append(c.buf, p[:k]...)
            - set: p
              value: p[k:]
            - op: +=
              set: "n"
              value: k
            - opt:
                do:
                  - opt:
                      do:
                        - return: n, err
                      init:
                        bind: err
                        eval: c.flush()
                        to: c.flush
                      when: err != nil
                when: len(c.buf) == c.size
      - return: n, nil
  - of: (*chunkWriter).flush
