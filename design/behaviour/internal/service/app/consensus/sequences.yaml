        kind: internal
    steps:
      - opt:
          do:
            - return: origin(coreconsensus.TransferFailed, errs.String("target", to.String()), errs.String("cause", err.Error()))
              to: origin
          init:
            bind: _, err
            eval: n.Barrier(ctx)
            to: n.Barrier
          when: err != nil
      - opt:
          do:
            - return: nil
          when: n.Status().Leader == to
      - return: refused
  - of: (*Node).transferLocal
    participants:
      - id: caller
        kind: actor
      - id: (*Node).transferLocal
        kind: self
      - id: n.stoppedErr
        kind: internal
      - id: origin
        kind: internal
      - id: n.awaitLeader
        kind: internal
    steps:
      - var:
          name: code
          type: errs.Code
      - opt:
          do:
            - return: n.stoppedErr()
              to: n.stoppedErr
          when: |-
            !n.exec(func() {
            		code = n.r.TransferLeadership(n.clk.Now(), to)
            		n.handleReady()
            	})
      - opt:
          do:
            - return: origin(sentinelOf(code))
              to: origin
          when: code != 0
      - return: n.awaitLeader(ctx, to)
        to: n.awaitLeader
  - of: (*Node).awaitLeader
    participants:
      - id: caller
        kind: actor
      - id: (*Node).awaitLeader
        kind: self
      - id: context
        kind: stdlib
      - id: n.Watch
        kind: internal
      - id: n.clk.NewTimer
        kind: value
      - id: t.Stop
        kind: value
      - id: n.stoppedErr
        kind: internal
      - id: origin
        kind: internal
    steps:
      - bind: wctx, cancel
        eval: context.WithCancel(ctx)
        to: context
      - defer: cancel()
      - bind: ch
        eval: n.Watch(wctx)
        to: n.Watch
      - bind: t
        eval: n.clk.NewTimer(2 * n.Status().Timing.ElectionTimeoutMax)
        to: n.clk.NewTimer
      - defer: t.Stop()
        to: t.Stop
