          cases:
            - comm: r := <-req.done
              do:
                - return: r.meta, r.err
            - comm: <-ctx.Done()
              do:
                - return: coreconsensus.SnapshotMetaValue{}, ctx.Err()
            - comm: <-n.loopDone
              do:
                - return: coreconsensus.SnapshotMetaValue{}, n.stoppedErr()
  - of: (*Node).save
    participants:
      - id: caller
        kind: actor
      - id: (*Node).save
        kind: self
      - id: n.am.Lock
        kind: value
      - id: n.am.Unlock
        kind: value
      - id: n.cut
        kind: internal
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.snapState.mu.Lock
        kind: value
      - id: n.snapState.mu.Unlock
        kind: value
      - id: n.cutFailed
        kind: internal
      - id: n.obs.info
        kind: internal
    steps:
      - eval: n.am.Lock()
        to: n.am.Lock
      - bind: idx, term
        eval: n.applied, n.appliedTerm
      - eval: n.am.Unlock()
        to: n.am.Unlock
      - bind: err
        eval: n.cut(idx, term, req.w)
        to: n.cut
      - var:
          name: m
          type: coreconsensus.SnapshotMetaValue
      - alt:
          - do:
              - var:
                  name: metas
                  type: "[]coreconsensus.SnapshotMetaValue"
              - opt:
                  do:
                    - loop:
                        do:
                          - opt:
                              do:
                                - set: m
                                  value: x
                              when: x.Position.Index == idx
                        key: _
                        range: metas
                        value: x
                  init:
                    bind: metas, err
                    eval: n.cfg.Snapshots.List()
                    op: =
                    to: n.cfg.Snapshots.List
                  when: err == nil
            when: err == nil
          - do:
              - eval: n.snapState.mu.Lock()
                to: n.snapState.mu.Lock
              - set: n.snapState.inFlight
                value: "false"
              - eval: n.snapState.mu.Unlock()
                to: n.snapState.mu.Unlock
              - eval: n.cutFailed(err)
                to: n.cutFailed
            else: true
      - opt:
          do:
            - eval: "n.obs.info(\"consensus: snapshot saved\", lstr(\"operator\", string(req.op)), lattr(\"index\", idx))"
              to: n.obs.info
          when: err == nil
      - send:
          chan: req.done
          value: saveRes{m, err}
  - of: (*Node).snapshotToSend
    participants:
      - id: caller
        kind: actor
      - id: (*Node).snapshotToSend
        kind: self
      - id: n.cfg.Snapshots.List
        kind: value
      - id: n.lineage
        kind: internal
    steps:
      - bind: metas, err
        eval: n.cfg.Snapshots.List()
        to: n.cfg.Snapshots.List
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false
          when: err != nil || len(metas) == 0
      - bind: l
        eval: n.lineage()
        to: n.lineage
      - opt:
          do:
            - return: coreconsensus.SnapshotMetaValue{}, false
          when: "!metas[0].Log.Same(l) || metas[0].Position.Index < l.KeptIndex"
      - return: metas[0], true
  - of: (*Node).sendSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Node).sendSnapshot
        kind: self
      - id: n.snapshotToSend
        kind: internal
      - id: n.requestCut
        kind: internal
      - id: n.r.SnapshotDone
        kind: value
      - id: n.cfg.Snapshots.Open
        kind: value
      - id: n.wg.Add
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: n.sending[to]
      - bind: meta, ok
        eval: n.snapshotToSend()
        to: n.snapshotToSend
      - opt:
          do:
            - eval: n.requestCut()
              to: n.requestCut
            - eval: n.r.SnapshotDone(to, false)
              to: n.r.SnapshotDone
            - return: ""
          when: "!ok"
      - bind: h, err
        eval: n.cfg.Snapshots.Open(meta.ID)
        to: n.cfg.Snapshots.Open
      - opt:
          do:
            - eval: n.r.SnapshotDone(to, false)
              to: n.r.SnapshotDone
            - return: ""
          when: err != nil
      - set: n.sending[to]
        value: "true"
      - bind: offer
        eval: "coreconsensus.InstallOfferValue{Term: n.r.Status().Term, SnapshotID: meta.ID, Meta: meta}"
      - eval: n.wg.Add(1)
        to: n.wg.Add
      - go: |-
          func() {
          		defer n.wg.Done()
          		ctx, cancel := context.WithCancel(context.Background())
          		go func() {
          			select {
          			case <-n.stopc:
          				cancel()
          			case <-ctx.Done():
          			}
          		}()
          		// The handle pins the snapshot until the transfer completes, so
          		// compaction cannot delete it mid-transfer (R3-16).
          		err := n.cfg.Transport.Stream(ctx, to, offer, func(off int64) (io.ReadCloser, error) {
          			if off < 0 || off > meta.EncodedSize {
          				return nil, origin(coreconsensus.FrameInvalid, errs.Int64("offset", off))
          			}
          			return io.NopCloser(io.NewSectionReader(h, off, meta.EncodedSize-off)), nil
          		})
          		cancel()
          		if cerr := h.Close(); cerr != nil {
          			// The transfer is over whatever the read handle says; the pin
          			// it held is released either way.
          			n.obs.warn("consensus: snapshot handle close failed", lstr("id", meta.ID), lstr("error", cerr.Error()))
          		}
          		if errors.Is(err, coreconsensus.Compacted) {
          			// The peer's log starts past this snapshot: cut a newer one,
          			// which the next probe sends.
          			n.requestCut()
          		}
          		n.exec(func() {
          			delete(n.sending, to)
          			n.r.SnapshotDone(to, err == nil)
          			n.handleReady()
          		})
          	}()
  - of: datasync
    participants:
      - id: caller
        kind: actor
