                      - return: ""
                  - comm: f = <-t.ctrl
                  - default: true
                    do:
                      - select:
                          cases:
                            - comm: <-stop
                              do:
                                - return: ""
                            - comm: f = <-t.ctrl
                            - comm: f = <-t.data
            - eval: t.mu.Lock()
              to: t.mu.Lock
            - bind: d
              eval: t.deliver
            - eval: t.mu.Unlock()
              to: t.mu.Unlock
