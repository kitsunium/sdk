    name: memFrame
  - fields:
      - name: net
        type: "*MemoryNetwork"
      - name: id
        type: coreconsensus.NodeID
      - name: mu
        type: sync.Mutex
      - name: deliver
        type: func(coreconsensus.AuthenticatedPeerValue, []byte)
      - name: offer
        type: func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue
      - name: install
        type: func(coreconsensus.InstallParams) error
      - name: join
        type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code)
      - name: joinR
        type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
      - name: ctrl
        type: chan memFrame
      - name: data
        type: chan memFrame
      - name: cur
        type: "*memRun"
      - doc: groups are the admitted members per group, members their union.
        name: groups
        type: map[coreconsensus.GroupID][]coreconsensus.MemberValue
      - name: members
        type: "[]coreconsensus.MemberValue"
    kind: struct
    methods:
      - name: Send
        params: to coreconsensus.NodeID, frame []byte
        recv: t *MemoryTransport
      - name: Stream
        params: ctx context.Context, to coreconsensus.NodeID, offer coreconsensus.InstallOfferValue, open func(int64) (io.ReadCloser, error)
        recv: t *MemoryTransport
        results: error
      - name: Bind
        params: |
          group coreconsensus.GroupID,
          	deliver func(coreconsensus.AuthenticatedPeerValue, []byte),
          	offer func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue,
          	install func(coreconsensus.InstallParams) error,
          	join func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code),
        recv: t *MemoryTransport
        results: error
      - doc: |-
          run is the background delivery goroutine Bind launches: it prefers the
          control lane over the data lane, as the TCP transport does, and ends when
          the stop channel of its run is closed by Close.
        name: run
        params: r *memRun
        recv: t *MemoryTransport
      - doc: |-
          deliverFrame hands one frame to the bound deliver callback, unless the
          admission model is on and this node does not admit its sender: the TCP
          transport closes the connection of a key it does not admit, and the
          frame never reaches the node.
        name: deliverFrame
        params: f memFrame
        recv: t *MemoryTransport
      - name: BindJoinReason
        params: _ coreconsensus.GroupID, join func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
        recv: t *MemoryTransport
      - name: SetMembership
        params: group coreconsensus.GroupID, admitted []coreconsensus.MemberValue
        recv: t *MemoryTransport
      - doc: |-
          releaseJoinAnswer drops the JOIN answer's group once the node is
          admitted, as the TCP transport does (#552).
        name: releaseJoinAnswer
        recv: t *MemoryTransport
      - name: Join
        params: ctx context.Context, cfg coreconsensus.JoinConfig
        recv: t *MemoryTransport
        results: coreconsensus.PositionValue, error
      - name: Close
        recv: t *MemoryTransport
        results: error
    name: MemoryTransport
  - doc: |-
      memRun is one delivery goroutine's life: Close closes stop, once, and
      waits on done, which the goroutine closes as it returns. Each Bind after a
      Close starts a run of its own, so a Close never waits on — or stops — a
      run a later Bind started.
    fields:
      - name: stop
        type: chan struct{}
      - name: done
        type: chan struct{}
      - name: once
        type: sync.Once
      - name: doneOnce
        type: sync.Once
    kind: struct
    methods:
      - doc: end stops the run; a second call is a no-op.
        name: end
        recv: r *memRun
    name: memRun
  - fields:
      - name: cfg
        type: Config
      - name: clk
        type: clock.Timed
      - name: r
        type: "*raft.Raft"
      - doc: |-
          ident is the log identity, the stamp's: the loop adopts the lineage
          an installed snapshot records (#507) while the apply goroutine reads
          it for every token. Read it through lineage.
        name: ident
        type: atomic.Pointer[coreconsensus.LogIdentityValue]
      - name: stamp
        type: coreconsensus.StampValue
      - name: inCtrl
