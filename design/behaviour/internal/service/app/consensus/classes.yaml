      - name: acond
        type: "*sync.Cond"
      - name: applied
        type: uint64
      - name: appliedTerm
        type: uint64
      - name: waiters
        type: map[uint64]*proposal
      - name: results
        type: map[uint64]applyResult
      - name: resultOrder
        type: "[]uint64"
      - name: keepResults
        type: int
      - name: pendingBytes
        type: atomic.Int64
      - doc: tickEvery is the loop's current tick, for the tests.
        name: tickEvery
        type: atomic.Int64
      - doc: |-
          applyLag is the payload bytes handed to the apply goroutine and not
          yet applied: the gap between commit and applied (D6, R1-14).
        name: applyLag
        type: atomic.Int64
      - doc: |-
          logApplied is the last entry applied from the log, never an index a
          restored snapshot set: an entry applied from the log was synced at its
          term before it was handed to the apply goroutine, so the store holds it
          as committed, while an install sets applied before the storage actor
          moved the store onto the snapshot. ReadCommitted reads up to it.
        name: logApplied
        type: atomic.Uint64
      - doc: loop-owned
        name: forwards
        type: map[uint64]*proposal
      - name: reads
        type: map[uint64]*readWait
      - name: transfers
        type: "[]chan errs.Code"
      - name: subEpoch
        type: uint64
      - name: subCount
        type: uint32
      - doc: |-
          sending is the snapshot that pins compaction for each peer: in
          flight, then streamed until the peer catches up (R6-01, #550).
        name: sending
        type: map[coreconsensus.NodeID]sendPin
      - doc: |-
          sendStop cancels the snapshot stream in flight to each peer: a
          leader that lost its leadership or its term stops streaming (#547).
        name: sendStop
        type: map[coreconsensus.NodeID]context.CancelFunc
      - doc: unreachableAt is when the transport last failed to reach a peer.
        name: unreachableAt
        type: map[coreconsensus.NodeID]time.Time
      - name: lastTerm
        type: uint64
      - name: lastLead
        type: coreconsensus.NodeID
      - name: lastRole
        type: coreconsensus.Role
      - name: canVote
        type: bool
      - name: noTable
        type: bool
      - name: snapState
        type: snapState
      - name: contact
        type: leaderContact
      - name: progress
        type: applyProgress
      - name: watch
        type: progressWatch
      - doc: |-
          preferAt is the earliest tick at which this leader tries
          PreferredLeaders again after a transfer it started (#559).
        name: preferAt
        type: time.Time
      - name: watchMu
        type: sync.Mutex
      - name: watchers
        type: map[chan coreconsensus.StatusValue]struct{}
      - name: stopMu
        type: sync.Mutex
      - name: stopReason
        type: "*coreconsensus.StopReasonValue"
      - name: stopped
        type: atomic.Bool
      - name: closeOnce
        type: sync.Once
      - name: releaseOnce
        type: sync.Once
      - name: wg
        type: sync.WaitGroup
      - name: loopDone
        type: chan struct{}
      - doc: loopDoneOnce closes loopDone, which only the loop does, on its way out.
        name: loopDoneOnce
        type: sync.Once
      - name: obs
        type: "*obs"
      - name: pendingProp
        type: atomic.Int64
      - name: droppedFrom
        type: atomic.Int64
      - name: longTurns
        type: atomic.Int64
      - name: joinMu
        type: sync.Mutex
      - name: lastJoin
        type: map[string]time.Time
      - name: joinRefused
        type: atomic.Int64
      - doc: space is the no-space guard's state (#515).
        name: space
        type: spaceGuard
      - doc: crashAfterPublish is set by the package's own tests only.
        name: crashAfterPublish
        type: atomic.Bool
    kind: struct
    methods:
      - doc: |-
          token builds an entry's lineage-scoped command identity: an entry kept by
          Recover keeps its PREDECESSOR identity (D10, R7-09).
        name: token
        params: p coreconsensus.PositionValue
        recv: n *Node
        results: coreconsensus.TokenValue
      - doc: |-
          applyLoop is the apply goroutine: every committed command in log order,
          on one goroutine (D3).
        name: applyLoop
        recv: n *Node
      - doc: |-
          applyItems runs one batch taken from the apply queue in order. It returns
          false when the apply goroutine must end: the node stopped, or applying an
          entry stopped it.
        name: applyItems
        params: items []applyItem
        recv: n *Node
        results: bool
      - doc: |-
          applyEntries applies committed entries in log order, skipping those a
          restored snapshot already covers and handing a run of commands to a
          BatchingStateMachine in one call. It returns false once the state machine
          failed and the node is stopping: nothing after that entry is applied.
        name: applyEntries
        params: es []coreconsensus.EntryValue
        recv: n *Node
        results: bool
      - doc: |-
          applyCommands applies the command at es[i], and with a batching machine
          every command that directly follows it, then answers their proposals. It
          returns the index of the first entry it did not apply, and false when the
          state machine failed and the node was stopped.
        name: applyCommands
        params: batcher coreconsensus.BatchingStateMachine, batching bool, es []coreconsensus.EntryValue, i int
        recv: n *Node
        results: int, bool
      - doc: |-
          forceCut cuts a snapshot at the applied index whatever SnapshotEvery says:
          a cut requested by a peer that needs one (requestCut), or one a trigger
          coalesced (cutPending). Its failure goes through cutFailed like every other
          cut's: written here, on the apply goroutine, when the machine pauses apply
          to cut, a failed sync of the spool used to be dropped, and the node went on
          over a disk that had just failed an fsync (#404, D4).
        name: forceCut
        recv: n *Node
      - doc: |-
          safeApply calls the state machine; a panic stops the node with
          STATE_MACHINE_FAILED, and the entry IS committed (D3).
        name: safeApply
        params: b coreconsensus.BatchingStateMachine, batching bool, es []coreconsensus.EntryValue, results []any
        recv: n *Node
        results: err error
      - doc: |-
          answerCovered answers every proposal waiting at or below index, which a
          restored snapshot now covers: applied1 never runs for those indexes, and
          sweepWaiters answers only above the commit, so they would wait forever
          and their bytes stay counted against MaxPendingBytes (#419). The snapshot
          holds their entry or another one at that index, which only a read
          through Barrier tells apart: OUTCOME_UNKNOWN. The caller holds am.
        name: answerCovered
        params: index uint64
        recv: n *Node
      - doc: |-
          applied1 records one applied entry and answers the Propose that created
          it on this node.
        name: applied1
        params: e *coreconsensus.EntryValue, val any
        recv: n *Node
      - doc: |-
          waitApplied blocks until index is applied, the node stops, or done closes.
          It launches one goroutine that turns done or the loop's end into a
          broadcast on the apply condition, since a sync.Cond cannot select; that
          goroutine ends after that one broadcast or, through stopWake, as soon as
          waitApplied returns, so none accumulates across calls.
        name: waitApplied
        params: done <-chan struct{}, index uint64
        recv: n *Node
        results: bool
      - name: Health
        recv: n *Node
        results: HealthValue
      - doc: |-
          snapshotHealth fills the snapshot's size and the limit a cut is held to,
          and warns from four fifths of it: a state that outgrows the smallest
          limit a member announces is cut no more, and the log grows until it is
          (R2-30, #556). The limit is the configuration's in force, read by
          loopHealth; a stopped node reports its own.
        name: snapshotHealth
        params: h *HealthValue
        recv: n *Node
      - doc: |-
          applyReady is the apply half of the verdict for st: caught up, or
          caught up once and lagging by at most maxReadyLag entries with applied
          moving within the minimum election timeout. Under a steady write load a
          published status pairs a new commit with the applied index of the turn
          before, and a strict comparison reported a healthy node not ready at
          random (#545); the stall bound keeps a stuck apply from looking ready. A
          node that fails it is caught up no longer, until it is again. It runs on
          the loop.
        name: applyReady
        params: st *coreconsensus.StatusValue, now time.Time
        recv: n *Node
        results: bool
      - doc: |-
          loopHealth fills the part of a verdict only the event loop can read: the
          quorum, the failure tolerance, the chain refusal and, on a leader, every
          peer's view. It runs on the loop, through exec.
        name: loopHealth
        params: h *HealthValue
        recv: n *Node
      - doc: |-
          peerHealth is one peer's line of a verdict. A peer is unreachable when it
          never answered this term, when its last answer is older than the minimum
          election timeout, or when the transport reported it unreachable since.
        name: peerHealth
        params: p *raft.PeerStatValue, now time.Time, last uint64, window time.Duration
        recv: n *Node
        results: PeerHealthValue
      - doc: |-
          peerUnreachable reports whether a peer counts as unreachable: it never
          answered this term, its last answer is older than window, or the
          transport reported it unreachable since.
        name: peerUnreachable
        params: p *raft.PeerStatValue, heard bool, lastContact, window time.Duration
        recv: n *Node
        results: bool
      - doc: |-
          offer answers a peer's snapshot offer: held when this node already covers
          it, refused with the code a leader can act on, or accepted at the offset
          a resumed spool already holds. It is judged on the event loop, and a node
          that stopped before the loop answered refuses with NODE_STOPPED.
        name: offer
        params: from coreconsensus.AuthenticatedPeerValue, o coreconsensus.InstallOfferValue
        recv: n *Node
        results: coreconsensus.InstallAcceptValue
      - doc: |-
          judgeOffer is offer's verdict, on the loop: screened first, then answered
          from a copy already held, else a sink is opened and kept for install.
        name: judgeOffer
        params: from coreconsensus.NodeID, o *coreconsensus.InstallOfferValue, acc *coreconsensus.InstallAcceptValue
        recv: n *Node
      - doc: |-
          screenOffer settles an offer raft or the bounds decide on their own, and
          reports whether it did: one this node already covers is held, and one
          from a stale term, of another version or over MaxSnapshotBytes is refused
          before any byte is spooled.
        name: screenOffer
        params: from coreconsensus.NodeID, o *coreconsensus.InstallOfferValue, acc *coreconsensus.InstallAcceptValue
        recv: n *Node
        results: bool
      - doc: |-
          answerFromHeld answers an offer for a snapshot id this node already
          stores, and reports whether it did: held, unless the node has no table,
          in which case its copy failed its checksums and the offer proceeds and
          replaces it, or the copy lies past what the node applied: published and
          never restored, it is not the node's state, and answered held the leader
          probed past it, the append was refused and the offer came again for as
          long as it stayed the leader's newest (#528). The copy is not removed first: the commit of the replacement
          overwrites it, and until then it is what the node's members are read
          from. Removed, a replacement that then failed — a transfer cut short, a
          Restore refused — left the node no snapshot, and at its next start a log
          that begins past a compaction with nothing naming the members: it
          admitted nobody, for good (#526).
        name: answerFromHeld
        params: o *coreconsensus.InstallOfferValue, acc *coreconsensus.InstallAcceptValue
        recv: n *Node
        results: bool
      - doc: |-
          keepSpool holds the sink an accepted offer opened until its body
          arrives. A sink an earlier offer of the same id left open is released,
          never aborted: its spool is what the new offer resumes (review of PR
          #301, L4).
        name: keepSpool
        params: id string, sink coreconsensus.SnapshotSink
        recv: n *Node
      - doc: |-
          releaseKept releases the sink an earlier offer of id opened and whose
          body never came, before the store opens that spool again: still open, it
          would count as an install writing the spool, which the store supersedes
          instead of resuming (#547).
        name: releaseKept
        params: id string
        recv: n *Node
      - doc: |-
          dropOtherSpools aborts the sinks earlier offers of another id opened and
          whose body never came: an offer of id supersedes them, and kept, each
          held its spool on the data disk for good (#527).
        name: dropOtherSpools
        params: id string
        recv: n *Node
      - doc: |-
          install receives the stream of an accepted offer into its spool, commits
          it, and has the apply goroutine restore from it before raft adopts it. A
          short stream keeps the spool for the next offer to resume; a snapshot
          that does not restore is removed, so a restart does not load it. The
          test-only crash hook launches HardClose on its own goroutine, which ends
          when HardClose returns, because install itself runs under the transport.
        name: install
        params: req coreconsensus.InstallParams
        recv: n *Node
        results: error
      - doc: |-
          restoreFailed is what an installed copy that did not restore does to the
          node. It is unpublished, so a restart does not load it again, or the
          failure to do so travels with it — unless the node has no table: its
          configuration is read from its snapshots' metadata, and a node left none
          starts with no member to admit (#526). The copy stays until another is
          published over it, and a restart falls back to no table again.
        name: restoreFailed
        params: snapID string, err error
        recv: n *Node
        results: error
      - doc: |-
          stillFresh judges the offer again, on the event loop, right before the
          install is accepted (D7): the receiver may have committed past the
          snapshot through a new leader's appends while the body streamed (review
          H3). A fresh one has the lineage it records adopted there, durably,
          before the restore and so before any entry it covers is applied (#507).
          A stale one, or a failed adoption, discards the spool; the second stops
          the node, as every failed write of its disk.
        name: stillFresh
        params: req *coreconsensus.InstallParams, sink coreconsensus.SnapshotSink
        recv: n *Node
        results: error
      - doc: |-
          installed moves raft onto a restored install and keeps the two newest
          snapshots: the installed one is the newest, and the oldest of the ones
          this node held goes, as after a cut.
        name: installed
        params: meta coreconsensus.SnapshotMetaValue, from coreconsensus.NodeID
        recv: n *Node
      - doc: |-
          join is the JOIN handler a transport without reasons binds: joinReason's
          verdict without its words.
        name: join
        params: ctx context.Context, from coreconsensus.AuthenticatedPeerValue, r coreconsensus.JoinRequestValue
        recv: n *Node
        results: coreconsensus.PositionValue, errs.Code
      - doc: |-
          joinReason answers a JOIN and, when it refuses, says why: the
          authorizer's own words, sanitized and bounded, or the engine's rule. An
          authorizer that says nothing leaves the reason empty.
        name: joinReason
        params: ctx context.Context, from coreconsensus.AuthenticatedPeerValue, r coreconsensus.JoinRequestValue
        recv: n *Node
        results: coreconsensus.PositionValue, errs.Code, string
      - doc: |-
          screenJoin is the engine's own refusal of a JOIN, before the rate limit
          or the membership is consulted: no authorizer, another cluster, a slot that is not the one the
          certificate names, or a peer that proved no key. It returns the reason,
          or "" when the JOIN goes on.
        name: screenJoin
        params: from *coreconsensus.AuthenticatedPeerValue, r *coreconsensus.JoinRequestValue
        recv: n *Node
        results: string
      - doc: |-
          joinRateLimited admits one JOIN per slot per minimum election timeout
          (R7-42) and reports whether this one is over that rate, counting it.
          An admitted JOIN starts the slot's window even when it is refused later.
        name: joinRateLimited
        params: slot string
        recv: n *Node
        results: bool
      - doc: |-
          alreadyJoined reports whether the membership in force lists the
          requester itself — its id, incarnation, slot and key all equal — and
          answers with the position of that membership. Any other request on a held
          slot is slotTaken's to refuse (R8-11): the guard is against another node
          taking it, never against the member asking again.
        name: alreadyJoined
        params: r *coreconsensus.JoinRequestValue
        recv: n *Node
        results: coreconsensus.PositionValue, bool
      - doc: slotTaken reports whether a current member already holds slot.
        name: slotTaken
        params: slot string
        recv: n *Node
        results: bool
      - doc: |-
          addJoiner proposes the authorized joiner as a learner, under the
          operator the authorizer named, and answers with the entry's position or
          the code and reason of its failure.
        name: addJoiner
        params: ctx context.Context, op coreconsensus.Operator, r *coreconsensus.JoinRequestValue
        recv: n *Node
        results: coreconsensus.PositionValue, errs.Code, string
      - doc: lineage is the node's log identity as it stands.
        name: lineage
        recv: n *Node
        results: coreconsensus.LogIdentityValue
      - doc: |-
          adoptLineage records, durably and before anything it covers is applied,
          the predecessor and kept index an installed snapshot's identity names,
          when this node's identity, of the same cluster and epoch, names none: a
          node made with Init under the cluster a Recover created knows nothing of
          the history kept, and applied the kept entries it received by append
          under its own identity while the survivor applied them under the
          predecessor's — two inputs for one committed entry (#507). It runs on the
          loop, as checkAdmission's stamp write.
        name: adoptLineage
        params: l coreconsensus.LogIdentityValue
        recv: n *Node
        results: error
      - doc: |-
          bindTransport hands the transport the node's callbacks. An unreachable
          report is queued to the loop and dropped when the loop is saturated, as
          it is advisory; the JOIN handler with reasons is bound when supported.
        name: bindTransport
        recv: n *Node
        results: error
      - doc: |-
          load restores the latest snapshot whose checksums pass and reads the log
          after it.
        name: load
        recv: n *Node
        results: raft.StartState, error
      - doc: |-
          durablePosition is the position a DurableStateMachine already holds
          applied, counted only when it was applied in this log's lineage, or in the
          predecessor's below the kept index; any other machine answers the zero
          position. The term is kept with the index: dropped, a node restarted past
          its snapshot resumed with an applied term of 0, and its next cut
          published a snapshot at term 0 that stopped it at every later start and
          every peer that installed it (#544).
        name: durablePosition
        recv: n *Node
        results: coreconsensus.PositionValue, error
      - doc: |-
          restoreLatest restores from the newest snapshot that verifies, falling
          back to the older one when it does not (D7); none restores is the zero
          base. Each one discarded is logged with its reason: a node that starts
          with no table otherwise says nothing of why (#512). One of a version or
          format this build does not know refuses the start instead: unknown means
          stop, never skip (D18, #513). failed is the newer snapshots that did not
          restore for a reason of their own, which load unpublishes once the base
          is known to continue the log.
        name: restoreLatest
        params: metas []coreconsensus.SnapshotMetaValue, durIdx uint64
        recv: n *Node
        results: base coreconsensus.SnapshotMetaValue, failed []coreconsensus.SnapshotMetaValue, err error
      - doc: |-
          unpublishNewer removes the snapshots newer than the one restored that
          failed to restore for a reason of their own. Left published, a node that
          started with a table from its own older cut answered the leader's offer of
          such an id as held, was probed past it, refused the append, and was
          offered it again, for as long as it stayed the leader's newest (#528).
          When none restores they all stay: a node with no table reads its members
          from them (#526). A removal that fails is the disk's, and the start fails
          with it (D4).
        name: unpublishNewer
        params: failed []coreconsensus.SnapshotMetaValue
        recv: n *Node
        results: error
      - doc: |-
          baseOrNoTable keeps a restored base, or starts the node with no table
          when a snapshot was needed and none restored. None is needed while the
          log still holds every entry from index 1 through its commit: the node
          replays it, as a node that never cut one does. It used to start with no
          table as soon as a snapshot existed, and a cluster whose every snapshot
          failed to restore lost every leader at a rolling restart (#512).
        name: baseOrNoTable
        params: base coreconsensus.SnapshotMetaValue, metas []coreconsensus.SnapshotMetaValue, first, last, commit uint64
        recv: n *Node
        results: coreconsensus.SnapshotMetaValue, error
      - doc: |-
          finishInstall refuses a log that starts past the base, then completes an
          install interrupted after its snapshot was published, and returns the
          log's bounds as they now stand.
        name: finishInstall
        params: base *coreconsensus.SnapshotMetaValue, first, last uint64
        recv: n *Node
        results: newFirst, newLast uint64, err error
      - doc: |-
          readTail reads the log after the base into memory, each entry's payload
          copied so the step function never holds a store's buffer.
        name: readTail
        params: first, last, snapIdx uint64
        recv: n *Node
        results: "[]coreconsensus.EntryValue, error"
      - doc: |-
          startApplied sets where apply resumes: past the base, or past what a
          durable machine already holds, with the term of that position. It returns
          the applied index raft starts from; a node with no table records nothing
          applied until an install.
        name: startApplied
        params: base *coreconsensus.SnapshotMetaValue, dur coreconsensus.PositionValue
        recv: n *Node
        results: uint64, error
      - doc: |-
          durableTerm is the term of the position a durable machine holds applied
          past the base: the log's term there, which the machine's must equal when
          it reports one, or the machine's when the log no longer holds the index.
          A machine that applied another entry at that index than the log holds
          diverged from it, and the start is refused (#544).
        name: durableTerm
        params: dur coreconsensus.PositionValue
        recv: n *Node
        results: uint64, error
      - doc: |-
          deliver is the transport's inbound callback: it parses a frame, drops it
          when its From is not the authenticated peer (R7-05), and queues it on its
          lane without ever blocking the transport; a full lane drops the frame,
          which raft's retransmission absorbs.
        name: deliver
        params: from coreconsensus.AuthenticatedPeerValue, frame []byte
        recv: n *Node
      - doc: exec runs f on the event loop and waits for it, or for the node to stop.
        name: exec
        params: f func()
        recv: n *Node
        results: bool
      - doc: |-
          loop is the event loop, the only goroutine that touches raft: one input
          per turn, then the control lane drained first, then the turn's Ready
          handled. It ends when stopc closes, after failing every caller still
          waiting on it, and closes loopDone on the way out.
        name: loop
        recv: n *Node
      - doc: |-
          turn waits for one input of the event loop and steps it, returning when
          the turn started. It reports false on stop. The inputs are never closed;
          were one closed, its handler reports false and the loop ends as it does
          on stop instead of spinning on the closed channel.

          The select stays whole: every case is one call into its handler, and the
          runtime's uniform choice among the ready inputs is the loop's fairness.
          Splitting it to lower its cyclomatic count would let the outer inputs
          starve the inner ones (KTN-FUNC-CYCLO counts the dispatch as eight
          decisions: kodflow/ktn-linter#727).
        name: turn
        params: tick clock.Ticker, props *[]*proposal
        recv: n *Node
        results: time.Time, bool
      - doc: |-
          onTick advances raft's clock, follows a committed contract that changed
          the heartbeat, answers the proposals whose grace ended, and publishes the
          periodic gauges.
        name: onTick
        params: tick clock.Ticker, ok bool
        recv: n *Node
        results: time.Time, bool
      - doc: |-
          onMessage steps one inbound message, of either lane, after telling raft
          whether the apply backlog is over MaxApplyLagBytes.
        name: onMessage
        params: m *coreconsensus.MessageValue, ok bool
        recv: n *Node
        results: time.Time, bool
      - doc: onStored takes a completion of the storage actor.
        name: onStored
        params: d *storeDone, ok bool
        recv: n *Node
        results: time.Time, bool
      - doc: |-
          onProposal batches the proposal that woke the loop with those queued
          behind it.
        name: onProposal
        params: p *proposal, ok bool, props *[]*proposal
        recv: n *Node
        results: time.Time, bool
      - doc: onExec runs a closure exec queued for the loop.
        name: onExec
        params: f func(), ok bool
        recv: n *Node
        results: time.Time, bool
      - doc: onFetched hands raft the entries the reader fetched below its window.
        name: onFetched
        params: f *fetchDone, ok bool
        recv: n *Node
        results: time.Time, bool
      - doc: |-
          storageDone tells raft a write is durable, then sends the replies that
          waited on it: only now may they leave (D5b).
        name: storageDone
        params: d *storeDone
        recv: n *Node
      - doc: |-
          batchProposals hands raft the proposal that woke the loop together with
          those already queued behind it, up to maxBatchedProposals, as one batch.
        name: batchProposals
        params: first *proposal, props *[]*proposal
        recv: n *Node
      - doc: |-
          queuedProposal takes a proposal already queued, without waiting. The
          queue is never closed, so a closed one reads as empty.
        name: queuedProposal
        recv: n *Node
        results: "*proposal, bool"
      - doc: |-
          drainControl steps the control messages queued after a turn, up to
          maxCtrlPerTurn: a flood of entries never starves a vote (D4).
        name: drainControl
        recv: n *Node
      - doc: |-
          queuedControl takes a control message already queued, without waiting.
          The lane is never closed, so a closed one reads as empty.
        name: queuedControl
        recv: n *Node
        results: coreconsensus.MessageValue, bool
      - doc: |-
          checkTurn drops the lease for the rest of the term after a turn longer
          than the drift budget, ElectionTimeoutMin × MaxClockDrift: a pause of
          the process is exactly that (D9, R7-20, R8-37).
        name: checkTurn
        params: turn time.Time
        recv: n *Node
      - doc: |-
          sweep answers OUTCOME_UNKNOWN to proposals whose leader changed more than
          two maximum election timeouts ago and that are still not resolved: the
          answer was lost, the entry may still commit.

          The transport may lose a forward, a read or their answer with no change
          of leader at all: a full queue, a dial backoff, a closed connection. Only
          a change started the grace, so the caller waited for its own deadline,
          forever with none, and the entry stayed until the next change, a forward
          holding its payload and the retained Apply results (#590). A forward
          unanswered two maximum election timeouts after it was sent is answered
          OUTCOME_UNKNOWN: the leader may have appended it, and a resend is only
          deduplicated while the leader still remembers the first. What a caller
          gave up on is dropped. Reads are swept by sweepReads.
        name: sweep
        recv: n *Node
      - doc: |-
          sweepReads resends a follower's read the leader has not answered within
          the maximum election timeout, and answers LEADERSHIP_UNCONFIRMED to one
          still unanswered two maximum election timeouts after it was asked (#590).
          A resend under the same context is idempotent: the leader confirms it
          again at a later commit index, still past every write committed before
          the call, and the node takes the first answer and drops the other. A read
          this node holds as the leader is not sent, so it is not resent; losing
          the quorum deposes the leader and leadershipChanged answers it. A read
          its caller gave up on is dropped.
        name: sweepReads
        params: now time.Time
        recv: n *Node
      - doc: |-
          sweepWaiters is sweep's half for appended proposals: one still above the
          commit index when its grace ends is answered OUTCOME_UNKNOWN and its
          pending bytes are released.
        name: sweepWaiters
        params: now time.Time, grace time.Duration
        recv: n *Node
      - doc: |-
          dropForward forgets a forwarded proposal and the applied result kept for
          its answer.
        name: dropForward
        params: ctx uint64
        recv: n *Node
      - doc: |-
          tickInterval is a fifth of the committed contract's heartbeat, so raft's
          timers fire within a fifth of a heartbeat of their due time, and never
          below a millisecond.
        name: tickInterval
        recv: n *Node
        results: time.Duration
      - doc: |-
          handleReady drains every Ready raft has, in order, then reacts to a
          change of leadership and publishes the status. It runs on the loop, and
          returns at once when a Ready stopped the node.
        name: handleReady
        recv: n *Node
      - doc: |-
          auditAppended logs at Warn every engine entry this node appends as
          leader, with the origin the leader recorded in it: the operation is
          traced on the node that decided it, whichever member submitted it (ADR
          0152 D8). Before the cluster version is 2 the entry carries no origin,
          and the line names 0 (#561).
        name: auditAppended
        params: rd *raft.ReadyValue
        recv: n *Node
      - doc: |-
          stopOnUnsupported stops the node with VERSION_UNSUPPORTED when a Ready
          names an entry whose kind this version does not know, and reports whether
          it did; that Ready is then not carried out at all, and handleReady
          returns without publishing.
        name: stopOnUnsupported
        params: rd *raft.ReadyValue
        recv: n *Node
        results: bool
      - doc: |-
          handleOne carries out one Ready: messages sent, membership and silence
          applied, writes and entries queued to the storage actor and the apply
          goroutine, fetches and snapshot sends started, waiters answered.
        name: handleOne
        params: rd *raft.ReadyValue
        recv: n *Node
      - doc: |-
          reportNotices acts on the Ready's notices that change no state of the
          loop: the end of the silence condition, the chain refusals D13 counts by
          leader, and a truncation worth a line in the log.
        name: reportNotices
        params: rd *raft.ReadyValue
        recv: n *Node
      - doc: |-
          endSilence persists the end of the silence condition; a store that
          cannot record it stops the node, since a restart would be silent again.
        name: endSilence
        recv: n *Node
      - doc: |-
          queueApply hands committed entries to the apply goroutine, counting
          their payload into the apply lag first.
        name: queueApply
        params: entries []coreconsensus.EntryValue
        recv: n *Node
      - doc: answerReady answers the reads, forwards and transfers a Ready resolved.
        name: answerReady
        params: rd *raft.ReadyValue
        recv: n *Node
      - doc: |-
          checkAdmission turns a joining directory into a member once its own
          admission is in the configuration.
        name: checkAdmission
        recv: n *Node
      - doc: leadershipChanged answers what a change of leader or term made unknown.
        name: leadershipChanged
        recv: n *Node
      - doc: |-
          startGrace starts the grace period of every unresolved proposal.
          Forwarded and appended proposals are NOT answered on a leadership change:
          an entry at a known position resolves when that index is applied
          (success or ENTRY_SUPERSEDED), and a forward may still be answered by the
          leader it went to. The change only starts their grace period; the tick
          sweep answers OUTCOME_UNKNOWN once it ends (D6).
        name: startGrace
        params: commit uint64
        recv: n *Node
      - doc: |-
          watchPreferred hands the leadership to a preferred node once one holds
          the commit, while this leader is not preferred (D8). It runs on the loop,
          at every tick: on the Ready where a node becomes leader every match is
          still 0, so a check made only then never transferred (#559). A transfer
          it started, done or not, is not tried again before the maximum election
          timeout, so a lagging preferred node causes no churn.
        name: watchPreferred
        params: now time.Time
        recv: n *Node
      - doc: |-
          preferLeader starts a transfer to the first preferred voter that holds
          the commit, and reports whether it did; a preferred node never hands
          over.
        name: preferLeader
        params: now time.Time, st *raft.StatusValue
        recv: n *Node
        results: bool
      - doc: |-
          publish stores the status a turn produced and wakes every watcher with
          it, replacing a value the watcher has not read yet so a slow reader sees
          the newest status, never a backlog; an unchanged status publishes nothing.
        name: publish
        recv: n *Node
      - doc: |-
          reader serves the step function's reads below its in-memory window, on
          its own goroutine, never the storage actor's, whose queue holds writes
          only (D4, R8-06).
        name: reader
        recv: n *Node
      - doc: |-
          fetch reads one range for raft and hands it to the loop; a compacted
          range is reported as such. It returns false when the reader must end:
          the read failed and stopped the node, or the node stopped meanwhile.
        name: fetch
        params: f raft.FetchSpec
        recv: n *Node
        results: bool
      - doc: |-
          storageActor is the one writer of the log (D5b). Every request taken
          together is appended and synced once, a group commit (D6, G2), before
          their completions go back to the loop, in order, and only then do the
          replies that depend on them leave.
        name: storageActor
        recv: n *Node
      - doc: |-
          finalWrites is the storage actor's exit on stop. The actor owns the
          final sync: on Close it writes and syncs what it holds, a commit-only
          record included, before it exits (D5b); on a hard stop it writes nothing
          more.
        name: finalWrites
        params: reqs []storeReq, st *storeState
        recv: n *Node
      - doc: |-
          writeAll writes a batch of requests as one group: each one's truncation,
          entries with their hard state, and compaction, in order, then ONE sync,
          then each completion in order (#558). Each Ready used to end with its own
          sync, so a follower with a slower disk paid one fdatasync (two on the
          file log) per queued Ready, and the next commit or election waited for
          it to drain its backlog one sync at a time. A group of commit-only
          Readys is not synced: the persisted commit is an optimisation, and its
          record rides the next sync. It returns false when the actor must end: a
          hard stop arrived, or a write stopped the node.
        name: writeAll
        params: reqs []storeReq, st *storeState
        recv: n *Node
        results: bool
      - doc: |-
          stageAll stages every request of a group in order, from synced, the last
          index already durable. It returns the last index the group holds,
          whether one of its requests must be synced, and false when the actor
          must end.
        name: stageAll
        params: reqs []storeReq, synced uint64
        recv: n *Node
        results: written uint64, durable, ok bool
      - doc: |-
          write stages one Ready in the log, truncation, entries with their hard
          state, then compaction, without syncing it; written follows the last
          index the group holds. Any storage failure stops the node and is never
          retried (D4); it returns false then.
        name: write
        params: q *storeReq, written *uint64
        recv: n *Node
        results: bool
      - doc: |-
          truncateFor removes the log suffix a Ready overwrites, and lowers the
          group's last index with it, since what was written there no longer
          exists.
        name: truncateFor
        params: rd *raft.ReadyValue, written *uint64
        recv: n *Node
        results: bool
      - doc: |-
          appendFor appends a Ready's entries together with the hard state they
          change, in one record, so the two are synced together.
        name: appendFor
        params: rd *raft.ReadyValue, last uint64
        recv: n *Node
        results: bool
      - doc: |-
          hardStateFor is the hard state a Ready changes, or nil when it changes
          none: the term and vote raft set, and a commit capped at the last index
          this group makes durable (R7-13).
        name: hardStateFor
        params: rd *raft.ReadyValue, last uint64
        recv: n *Node
        results: "*coreconsensus.HardState, bool"
      - doc: |-
          syncFor syncs the log once for a group and records the latency and the
          group's size. A failed sync stops the node and is never retried (D4).
        name: syncFor
        params: reqs []storeReq
        recv: n *Node
        results: bool
      - doc: |-
          completeWrite hands the loop the completion of a synced Ready with the
          replies that waited on it; false when the node stopped first.
        name: completeWrite
        params: rd *raft.ReadyValue
        recv: n *Node
        results: bool
      - doc: |-
          stop records why the node stopped itself, writes its marker, and stops
          every goroutine without a final sync.
        name: stop
        params: err error, storage bool
        recv: n *Node
      - doc: |-
          reportUnwrittenMarkers logs each place a stop marker could not be written.
          R9-05 accepts a stop that left one marker of the two; the line says which
          one is missing, so an operator knows what protects the next start.
        name: reportUnwrittenMarkers
        params: dirErr, runErr error
        recv: n *Node
      - name: StopReason
        recv: n *Node
        results: coreconsensus.StopReasonValue, bool
      - doc: |-
          failAllOnStop answers every caller the loop still owes on its way out:
          an unsent proposal or read with NODE_STOPPED, and anything that may have
          been appended with OUTCOME_UNKNOWN, since it may yet commit elsewhere.
        name: failAllOnStop
        recv: n *Node
      - doc: |-
          stoppedErr is NODE_STOPPED, carrying the self-stop's cause when there was
          one, so a caller failed by a stop learns why.
        name: stoppedErr
        recv: n *Node
        results: error
      - name: Close
        params: ctx context.Context
        recv: n *Node
        results: error
      - doc: |-
          releaseDir gives the data directory back, once, so offline tools may use
          it again; HardClose skips it when a goroutine may still be writing.
        name: releaseDir
        recv: n *Node
      - doc: handOff transfers leadership to the most caught-up voter, best effort.
        name: handOff
        params: ctx context.Context
        recv: n *Node
      - name: HardClose
        recv: n *Node
        results: error
      - name: Status
        recv: n *Node
        results: coreconsensus.StatusValue
      - name: Watch
        params: ctx context.Context
        recv: n *Node
        results: <-chan coreconsensus.StatusValue
      - name: Membership
        recv: n *Node
        results: coreconsensus.MembershipValue
      - doc: |-
          probeLeader sends a read to the leader at most every half minimum
          election timeout while this node follows one, so that its answer keeps
          the contact fresh in a quiet cluster. A lease lets the leader answer at
          once; without one the answer waits for the leader's next round.
        name: probeLeader
        params: now time.Time
        recv: n *Node
      - doc: |-
          readAnswered notes a read the leader answered: raft takes a read's
          answer only from the leader it asked (#510), so a success proves that
          leader hears this node. It reports whether the answer was a probe's,
          which has no waiter.
        name: readAnswered
        params: ctx uint64, code errs.Code, now time.Time
        recv: n *Node
        results: bool
      - doc: |-
          leaderConfirmed reports whether the leader this node names is one it
          knows hears it: itself, or a leader that answered one of its reads within
          the maximum election timeout. It runs on the loop.
        name: leaderConfirmed
        params: now time.Time
        recv: n *Node
        results: bool
      - doc: |-
          watchProgress hands the leadership to the most up-to-date voter once
          this leader's durable index has trailed its log, or its applied index
          its commit, without moving for the maximum election timeout. A
          legitimately slow fdatasync moves within that bound; a transfer already
          under way is left alone, and the clocks restart after each hand-off.
          It runs on the loop, at every tick.
        name: watchProgress
        params: now time.Time
        recv: n *Node
      - doc: |-
          mostCaughtUpVoter is the voter other than this node with the highest
          acknowledged index, 0 when there is none.
        name: mostCaughtUpVoter
        params: st *raft.StatusValue
        recv: n *Node
        results: coreconsensus.NodeID
      - doc: |-
          pinAt is the index pin holds compaction back to at now, and false once
          it no longer holds: a streamed snapshot's pin ends when this node no
          longer leads the peer, or when until passed. It runs on the loop.
        name: pinAt
        params: to coreconsensus.NodeID, pin sendPin, now time.Time
        recv: n *Node
        results: uint64, bool
      - doc: |-
          watchPins ends, at each tick, the pins of streamed snapshots that no
          longer hold: their peer caught up with the log, left, or until passed.
          Compaction only runs after a cut, so the log is compacted again at once:
          a pin that ended once the writes stopped held it back until the next
          write.
        name: watchPins
        params: now time.Time
        recv: n *Node
      - doc: |-
          observeStatus publishes the gauges a status turn changes, and logs role
          and term changes (D13).
        name: observeStatus
        params: old, cur *coreconsensus.StatusValue
        recv: n *Node
      - doc: |-
          observePeers publishes the leader's per-peer gauges and the failure
          tolerance, at most every 100 ms, on the loop.
        name: observePeers
        recv: n *Node
      - doc: observePeer publishes one peer's gauges.
        name: observePeer
        params: p *raft.PeerStatValue, now time.Time, last uint64, window time.Duration
        recv: n *Node
      - doc: |-
          observeResources publishes the log, filesystem and certificate gauges and
          the counters the stores and the transport keep, at most every second, on
          the loop (D13).
        name: observeResources
        recv: n *Node
      - name: ReadCommitted
        params: ctx context.Context, from, to uint64, maxBytes int
        recv: n *Node
        results: "[]coreconsensus.EntryValue, error"
      - name: Propose
        params: ctx context.Context, data []byte
        recv: n *Node
        results: coreconsensus.TokenValue, any, error
      - doc: |-
          submit hands an entry to the event loop and waits for its outcome. Before
          the loop has it, a cancelled ctx or a stop answers with ctx.Err() or the
          stop's reason; after it is appended, a cancelled ctx is OUTCOME_UNKNOWN,
          because the entry may still commit. An admin entry bypasses the pending
          and apply-lag budgets, so an operator can always reach a saturated node.
        name: submit
        params: ctx context.Context, e coreconsensus.EntryValue, admin bool
        recv: n *Node
        results: coreconsensus.TokenValue, any, error
      - doc: |-
          awaitProposal waits for the loop's answer to a proposal it already holds.
          A ctx that ends first is ctx.Err() only while the proposal is provably
          unsent; once it may have been appended the answer is OUTCOME_UNKNOWN.

          The loop may also end without ever seeing it: a submit that passed the
          stopped check finds both propc and stopc ready, and Go picks one at
          random, after failAllOnStop drained propc for the last time. Once the
          loop is gone an answer it posted wins; otherwise the proposal never left
          and is NODE_STOPPED, or OUTCOME_UNKNOWN if it may have been appended
          (#420).
        name: awaitProposal
        params: ctx context.Context, p *proposal
        recv: n *Node
        results: propResult
      - doc: |-
          handleProposals appends every proposal waiting at this turn as one batch
          at a leader, or forwards each to the leader (D6).
        name: handleProposals
        params: ps []*proposal
        recv: n *Node
      - doc: |-
          proposeBatch appends a batch of ordinary proposals as one Propose and
          registers each at its position, or answers every one with raft's refusal
          when the batch as a whole is refused; an empty batch does nothing.
        name: proposeBatch
        params: now time.Time, lead coreconsensus.NodeID, batch []*proposal, ents []coreconsensus.EntryValue
        recv: n *Node
      - doc: |-
          refuseOverload answers an ordinary proposal with OVERLOADED, before
          anything is appended, when the pending bytes or the apply lag are over
          budget, and reports whether it did. An admin proposal is never refused
          here, so the operator can still act on an overloaded node.
        name: refuseOverload
        params: p *proposal
        recv: n *Node
        results: bool
      - doc: |-
          proposeAlone appends one proposal as its own entry, outside any batch, as
          an administrative entry must be, and answers it at once on a refusal.
        name: proposeAlone
        params: now time.Time, p *proposal
        recv: n *Node
      - doc: appended registers a proposal's waiter at its position.
        name: appended
        params: p *proposal, pos coreconsensus.PositionValue, local bool
        recv: n *Node
      - doc: |-
          answerApplied answers a proposal whose position is already applied,
          from the result kept there when ok: it is never registered, so no applied1
          releases its pending bytes (#419).
        name: answerApplied
        params: p *proposal, pos coreconsensus.PositionValue, r applyResult, ok bool
        recv: n *Node
      - doc: |-
          displace answers a proposal that lost its index's waiter to another one
          appended at the same index under a later term: after a leader change, the
          new leader hands out first the indexes the old one's unreplicated tail
          held. Overwritten, the earlier waiter was answered by nothing — applied1,
          sweepWaiters, answerCovered and failAllOnStop all walk the map — and its
          caller waited for its own deadline, forever with none, its pending bytes
          counted for good (#517). Either entry may still commit, so the answer is
          OUTCOME_UNKNOWN, never ENTRY_SUPERSEDED (D6).
        name: displace
        params: p *proposal
        recv: n *Node
      - doc: |-
          forward sends a proposal to the leader under a submission id that never
          repeats across restarts (nextID).
        name: forward
        params: p *proposal, st raft.StatusValue
        recv: n *Node
      - doc: |-
          nextID is the next submission id of a forward or a read: a random epoch
          drawn at start in the high 32 bits, a counter in the low 32, and a fresh
          epoch before the counter runs out, so an id never repeats across restarts
          (R7-23, R9-17). A leader may still hold a read of this node's previous
          incarnation, unconfirmed, and answer it later: under a counter that
          restarted at 1, the new incarnation's read of the same number took that
          answer, at the old commit index, below a write acknowledged before the
          call (#510).
        name: nextID
        recv: n *Node
        results: uint64
      - doc: forwardAnswered resolves a forwarded proposal from the leader's answer.
        name: forwardAnswered
        params: m coreconsensus.MessageValue
        recv: n *Node
      - name: Barrier
        params: ctx context.Context
        recv: n *Node
        results: coreconsensus.TokenValue, error
      - name: WaitApplied
        params: ctx context.Context, t coreconsensus.TokenValue
        recv: n *Node
        results: error
      - doc: |-
          appliedAs checks that the entry applied at t's index is t's: the index
          alone named the predecessor's identity, and since Recover adopts the
          verified suffix past the commit the survivor persisted (D17), an entry it
          kept there may be of another term than the write the old cluster
          committed and acknowledged at that index. That write is lost, and
          WaitApplied reported it applied (#509). Where the term cannot be read any
          more, a token of the current history is trusted by Log Matching, and so
          is one of the predecessor's at or below the index the predecessor had
          committed there (AdoptedFrom, #509 phase 2); one in the adopted range
          above it is not: that range may hold such a suffix.
        name: appliedAs
        params: t coreconsensus.TokenValue
        recv: n *Node
        results: error
      - doc: |-
          appliedTermAt is the term of the entry applied at index, which the caller
          waited for: from the step function, whose committed log is the truth, then
          from the store while index is one this node applied from its log, which
          the store holds as committed. known is false when neither holds it any
          more; ok is false when the node stopped.
        name: appliedTermAt
        params: index uint64
        recv: n *Node
        results: term uint64, known, ok bool
      - doc: |-
          admin validates the operator, then submits an administrative entry and
          logs it at Warn with its outcome whatever that outcome is, so every
          operator action leaves a trace (D8, D17).
        name: admin
        params: ctx context.Context, kind coreconsensus.EntryKind, a wire.AdminValue
        recv: n *Node
        results: error
      - name: AddLearner
        params: ctx context.Context, op coreconsensus.Operator, m coreconsensus.MemberValue
        recv: n *Node
        results: error
      - name: Promote
        params: ctx context.Context, op coreconsensus.Operator, id coreconsensus.NodeID
        recv: n *Node
        results: error
      - name: Remove
        params: ctx context.Context, op coreconsensus.Operator, id coreconsensus.NodeID
        recv: n *Node
        results: error
      - doc: |-
          successorOf is the voter a removal of leader id hands leadership to: this
          node when it votes, else the first other voter of the configuration.
        name: successorOf
        params: id coreconsensus.NodeID
        recv: n *Node
        results: coreconsensus.NodeID, bool
      - doc: |-
          removeAfterTransfer submits a removal right after leadership moved. The
          new leader accepts no membership change before its term's no-op commits
          (MEMBERSHIP_CHANGE_PENDING), an engine detail of the transfer the call
          itself made, not the caller's: it is submitted again, each heartbeat, for
          at most twice the maximum election timeout.
        name: removeAfterTransfer
        params: ctx context.Context, remove wire.AdminValue
        recv: n *Node
        results: error
      - doc: |-
          pause waits d on the node's clock and reports whether it did, false
          when ctx ended first.
        name: pause
        params: ctx context.Context, d time.Duration
        recv: n *Node
        results: bool
      - name: UpdateAddress
        params: ctx context.Context, op coreconsensus.Operator, id coreconsensus.NodeID, addr string
        recv: n *Node
        results: error
      - name: DenyPin
        params: ctx context.Context, op coreconsensus.Operator, id coreconsensus.NodeID
        recv: n *Node
        results: error
      - name: ProposeTimingContract
        params: ctx context.Context, op coreconsensus.Operator, pre coreconsensus.PreconditionSpec, c coreconsensus.TimingContractSpec
        recv: n *Node
        results: error
      - name: RaiseClusterVersion
        params: ctx context.Context, op coreconsensus.Operator, pre coreconsensus.PreconditionSpec, v uint32
        recv: n *Node
        results: error
      - name: ClearNoSpace
        params: ctx context.Context, op coreconsensus.Operator, pre coreconsensus.PreconditionSpec
        recv: n *Node
        results: error
      - name: TransferLeadership
        params: ctx context.Context, op coreconsensus.Operator, to coreconsensus.NodeID
        recv: n *Node
        results: error
      - doc: |-
          confirmLeader turns the node's own view that to already leads into a
          fact before a refused transfer is reported as done. A view is the node's
          last turn, not the cluster: a leader deposed by a transfer it has not yet
          heard about still names itself, refuses a transfer to itself as
          MEMBERSHIP_INVALID, and would answer success while another node leads a
          newer term. A barrier is a read index the leader confirms with a quorum,
          so the view it leaves behind is current. A barrier that fails is
          TRANSFER_FAILED, the answer a transfer whose target does not lead owes
          (D8); a confirmed view naming another leader keeps the refusal.
        name: confirmLeader
        params: ctx context.Context, to coreconsensus.NodeID, refused error
        recv: n *Node
        results: error
      - doc: |-
          transferLocal starts a leadership transfer on this node's own raft
          instance, without writing an entry, and waits for the target to lead: the
          hand-off Close and a leader's self-Remove use, where no operator entry is
          owed and the node may be about to leave.
        name: transferLocal
        params: ctx context.Context, to coreconsensus.NodeID
        recv: n *Node
        results: error
      - doc: |-
          awaitLeader waits until to is the leader the node observes. It fails with
          TRANSFER_FAILED after twice the maximum election timeout, or when ctx
          ends, and with the stop's reason when the node stops first.
        name: awaitLeader
        params: ctx context.Context, to coreconsensus.NodeID
        recv: n *Node
        results: error
      - doc: |-
          restoreFrom verifies a snapshot's digest, then restores the state machine
          from it, serialised with Apply.
        name: restoreFrom
        params: m coreconsensus.SnapshotMetaValue, durIdx uint64
        recv: n *Node
        results: err error
      - doc: |-
          codecOf is the codec a snapshot of metadata m is decoded with, refused
          VERSION_UNSUPPORTED for a metadata version or a codec this build does
          not know: unknown means stop, never skip (D18). The codec is the one the
          metadata names (D18 "Compression"): the node's own, or another bounded
          codec this build links. Read with the node's own, a snapshot written
          before its codec was changed failed its checksums at the next start, and
          every snapshot of every node at once (#512).
        name: codecOf
        params: m *coreconsensus.SnapshotMetaValue
        recv: n *Node
        results: coretransform.BoundedDecompressor, error
      - doc: |-
          maybeSnapshot cuts a snapshot after SnapshotEvery applied entries or
          SnapshotEveryBytes of applied payload, whichever comes first, on the apply
          goroutine; the write runs off it unless the machine cannot cut cheaply
          (D7). applied is the payload of the batch just applied: the byte trigger
          was validated and read nowhere, and a log of large entries grew to the
          disk's end between two cuts (#515). A trigger during a cut in flight is
          coalesced, not dropped: the cut is made once that one is written
          (cutPending), or a node that applies nothing more would keep the tail
          uncut and its log uncompacted.
        name: maybeSnapshot
        params: applied int64
        recv: n *Node
      - doc: |-
          cutFailed is what a snapshot cut that published nothing does to the node.
          A STORAGE_FAILED stops it: a failed write or sync of a snapshot is a
          failed write or sync of this node's disk, and D4 never retries one, for
          the page cache may now lie about the log on the same disk as well. Any
          other failure — the machine's Snapshot, its encoding, a full disk under
          the spool, a state over MaxSnapshotBytes — is logged, and no automatic
          cut starts again before a wait that doubles at each failure, from one
          second to a minute: every applied batch used to start a full cut again,
          on a disk the last one had just filled (#520).
        name: cutFailed
        params: err error
        recv: n *Node
      - doc: |-
          metaAt builds, on the event loop, the metadata of a snapshot at idx: the
          configuration, chain tip, timing, versions and no-space alarm in force
          there. The engine state is the one the committed entries through idx left
          (raft's EngineAt), never the one standing now: the engine applies its
          entries at commit, ahead of the applied index a cut is made at, and a
          node that installed the snapshot and was then truncated back would carry
          a contract whose entry it never applied (#402). It reports false when the
          node stopped before the loop could answer.
        name: metaAt
        params: idx, term uint64
        recv: n *Node
        results: coreconsensus.SnapshotMetaValue, bool
      - doc: |-
          cut captures the state machine at the applied index and writes it. When w
          is not nil, the encoded stream is copied to it too (SaveSnapshot). Unless
          the machine pauses apply to cut, or w is set, the write runs on a
          background goroutine counted in n.wg, which ends when the write does, so
          Close waits for it; its failure reaches cutFailed instead of the caller.
        name: cut
        params: idx, term uint64, w io.Writer
        recv: n *Node
        results: error
      - doc: |-
          cutPending asks the apply goroutine for the cut a trigger coalesced while
          the one just written was in flight (D7). A failed cut asks for none: the
          next trigger tries again, as cutFailed says.
        name: cutPending
        recv: n *Node
      - doc: |-
          writeSnapshot encodes a captured snapshot into a fresh sink, discarding a
          stale spool of the same id first, and commits it; on any failure the sink
          is aborted and nothing is published. It always releases the capture and
          clears the in-flight flag, so the next cut can run. A failed write clears
          the coalesced trigger with it, under the same lock: the next trigger tries
          again (cutFailed), and only one that falls after the flag is cleared
          survives.
        name: writeSnapshot
        params: snap coreconsensus.Snapshot, meta coreconsensus.SnapshotMetaValue, extra io.Writer
        recv: n *Node
        results: error
      - doc: |-
          publishSnapshot is writeSnapshot's write: the sink, the encoded stream,
          the commit, then retention and compaction (afterCut).
        name: publishSnapshot
        params: snap coreconsensus.Snapshot, meta coreconsensus.SnapshotMetaValue, extra io.Writer
        recv: n *Node
        results: error
      - doc: |-
          afterCut keeps the two newest snapshots and compacts the log back to the
          older one, less SnapshotTrailing, with saturating arithmetic (D7). A
          snapshot in flight to a peer, then streamed until the peer catches up
          (sendPin), pins compaction back to it, less SnapshotTrailing (R6-01): a leader that cut twice during one transfer
          compacted past the snapshot it was sending, the entry after it was gone
          once the peer installed it, and under a sustained write rate the peer
          installed snapshot after snapshot and never caught up (#550).
        name: afterCut
        recv: n *Node
      - doc: |-
          retain keeps the two newest snapshots (D7, R6-02), removing the older ones,
          and returns the store's list, newest first; nil when it cannot be read. A
          cut publishes a snapshot and so does an install: both end here, or an
          install onto a node holding two left three until that node's next cut
          (#304).
        name: retain
        recv: n *Node
        results: "[]coreconsensus.SnapshotMetaValue"
      - doc: |-
          noteNewest records the newest snapshot's size for Health, and says so at
          Warn when it nears the limit the members announce (R2-30, #556).
        name: noteNewest
        params: m *coreconsensus.SnapshotMetaValue
        recv: n *Node
      - doc: |-
          removeOld removes the snapshots retain no longer keeps. One refused while
          a transfer reads it is kept until the next cut or install, which tries
          again: worth a line, never a stop. A failed unlink or directory sync is
          the disk, and stops the node as a cut's does (D4, #422).
        name: removeOld
        params: old []coreconsensus.SnapshotMetaValue
        recv: n *Node
      - doc: |-
          streamEnded acts on a transfer's refusal, off the loop: a peer whose log
          starts past the snapshot gets a newer cut, one that found it corrupt has
          the sender read its own copy back, and one that cannot read its version
          or codec is logged, as it stops.
        name: streamEnded
        params: meta coreconsensus.SnapshotMetaValue, to coreconsensus.NodeID, err error
        recv: n *Node
      - doc: |-
          sentCorrupt is the sender's answer to a peer that refused a snapshot as
          SNAPSHOT_CORRUPT: its own copy is read back. The transport is
          authenticated and checksummed, so a copy that verifies leaves the fault
          with the peer, which is logged. One that does not is removed, the cut
          index lowered past it, and a cut asked for at the applied index: the next
          probe sends that one, or the older copy left. It used to be streamed
          again at every probe, never read back, and the peer stayed out until the
          next cut, SnapshotEvery entries later (#525). It runs off the loop.
        name: sentCorrupt
        params: meta coreconsensus.SnapshotMetaValue, to coreconsensus.NodeID
        recv: n *Node
      - doc: verifyHeld reads a held snapshot back and checks its sizes and digest.
        name: verifyHeld
        params: m coreconsensus.SnapshotMetaValue
        recv: n *Node
        results: err error
      - doc: requestCut asks the apply goroutine for a cut, unless one is in flight.
        name: requestCut
        recv: n *Node
      - name: SaveSnapshot
        params: ctx context.Context, op coreconsensus.Operator, w io.Writer
        recv: n *Node
        results: coreconsensus.SnapshotMetaValue, error
      - doc: save runs a SaveSnapshot on the apply goroutine.
        name: save
        params: req *saveReq
        recv: n *Node
      - doc: |-
          snapshotToSend is the newest snapshot, when a peer may install it: none
          when this leader never cut one, and none when the newest is of the
          history before a Recover, or below the index it kept — the entries kept
          after it would reach the peer by append and be applied there under the
          new identity, not the predecessor's (#507). A cut of this lineage, at or
          past the kept index, names both. One recorded at term 0 is never sent
          either: the peer would stop installing it (#544).
        name: snapshotToSend
        recv: n *Node
        results: coreconsensus.SnapshotMetaValue, bool
      - doc: |-
          sendSnapshot streams the newest snapshot to a peer that needs one, at
          most one transfer per peer, and asks for a cut when there is none to
          send. It runs on the loop and launches the transfer on a background
          goroutine counted in n.wg, which ends when Stream returns, and a watcher
          goroutine that cancels the stream when the node stops and ends with it;
          a change of leadership or term cancels it too (#547). The outcome goes
          back to raft on the loop.
        name: sendSnapshot
        params: to coreconsensus.NodeID
        recv: n *Node
      - doc: |-
          guardSpace proposes the no-space alarm when this node's disk runs short
          and the alarm is not committed, at most every spaceRaiseEvery. It runs on
          the loop, at each tick and each completed write; the proposal runs on a
          goroutine counted in n.wg, which ends once it is answered, or once the
          node stops. A follower's is forwarded to the leader, as any proposal
          (R3-24).
        name: guardSpace
        params: now time.Time
        recv: n *Node
      - doc: |-
          spaceShort reports whether this node's disk is short, and why: the log
          past its quota less the reserve, read at every call, or the filesystem's
          free space under the reserve, read at most every spaceCheckEvery.
        name: spaceShort
        params: now time.Time
        recv: n *Node
        results: why string, short bool
      - doc: |-
          refuseShort answers an ordinary proposal NO_SPACE, before anything is
          appended, while this node's own disk is short and the alarm it proposed
          is not committed yet, and reports whether it did: the reserve is what the
          repair writes, and the commands queued behind the alarm used to fill it
          on a slow disk.
        name: refuseShort
        params: p *proposal
        recv: n *Node
        results: bool
      - doc: raiseNoSpace proposes the alarm and logs why; admin logs its outcome.
        name: raiseNoSpace
        params: why string
        recv: n *Node
    name: Node
  - doc: "snapState tracks the cuts: at most one in flight, coalesced (D7)."
    fields:
      - name: mu
        type: sync.Mutex
      - name: last
        type: uint64
      - name: inFlight
        type: bool
      - doc: |-
          pending is a trigger that fell during a cut in flight, coalesced into
          the cut made once that one is written (D7).
        name: pending
        type: bool
      - name: spools
        type: map[string]coreconsensus.SnapshotSink
      - doc: |-
          backoff is the wait after the last cut that failed without stopping
          the node, doubled at each failure and cleared by a cut that
          publishes; no automatic cut starts before retryAt (#520).
        name: backoff
        type: time.Duration
      - name: retryAt
        type: time.Time
      - doc: |-
          sinceBytes is the payload applied since the last cut started, which
          SnapshotEveryBytes bounds (D7, #515).
        name: sinceBytes
        type: int64
      - doc: |-
          newestBytes is the newest snapshot's size, the larger of its encoded
          and decoded sizes, which Health compares with the limit (R2-30, #556).
        name: newestBytes
        type: int64
    kind: struct
    name: snapState
  - fields:
      - name: term
        type: uint64
      - name: val
        type: any
    kind: struct
    name: applyResult
  - fields:
      - name: entry
        type: coreconsensus.EntryValue
      - name: admin
        type: bool
      - name: stage
        type: atomic.Int32
      - name: pos
        type: coreconsensus.PositionValue
      - name: local
        type: bool
      - name: done
        type: chan propResult
      - doc: |-
          changedAt is when leadership changed while it was unresolved; only
          the loop and, for waiters, holders of am touch it.
        name: changedAt
        type: time.Time
      - doc: sentAt is when the loop forwarded it to the leader; loop-owned.
        name: sentAt
        type: time.Time
      - doc: gone is set by a caller that stopped waiting for a forward's answer.
        name: gone
        type: atomic.Bool
    kind: struct
    name: proposal
  - fields:
      - name: tok
        type: coreconsensus.TokenValue
      - name: val
        type: any
      - name: err
        type: error
    kind: struct
    name: propResult
  - fields:
      - name: done
        type: chan readResult
      - doc: |-
          sentAt is when the read was first asked, and askedAt when it was last
          sent to the leader; both loop-owned.
        name: sentAt
        type: time.Time
      - doc: |-
          sentAt is when the read was first asked, and askedAt when it was last
          sent to the leader; both loop-owned.
        name: askedAt
        type: time.Time
      - doc: gone is set by a caller that stopped waiting for the answer.
        name: gone
        type: atomic.Bool
    kind: struct
    name: readWait
  - fields:
      - name: index
        type: uint64
      - name: code
        type: errs.Code
    kind: struct
    name: readResult
  - fields:
      - name: rd
        type: raft.ReadyValue
      - doc: |-
          compactTerm is the term of rd.Compact as the step function held it
          when the Ready was taken: past the end of the log the store has no
          entry to read it from (#415).
        name: compactTerm
        type: uint64
    kind: struct
    name: storeReq
  - fields:
      - name: seq
        type: uint64
      - name: index
        type: uint64
      - name: term
        type: uint64
      - name: after
        type: "[][]byte"
      - name: to
        type: "[]coreconsensus.NodeID"
    kind: struct
    name: storeDone
  - doc: |-
      dirHolder is the shipped log's hold on its data directory: a DataDir
      refuses offline work and Close while a Node holds it (D11, R3-18).
    kind: named
    name: dirHolder
    underlying: |-
      interface {
      	acquire() error
      	release()
      }
  - doc: |-
      joinReleaser is a transport that keeps a JOIN answer's members admitted
      apart from the engine's configuration until the joiner is admitted
      (#552).
    kind: named
    name: joinReleaser
    underlying: |-
      interface {
      	releaseJoinAnswer()
      }
  - fields:
      - name: req
        type: raft.FetchSpec
      - name: ents
        type: "[]coreconsensus.EntryValue"
      - name: compacted
        type: bool
    kind: struct
    name: fetchDone
  - doc: |-
      storeState is the storage actor's view of the log: the last index a sync
      made durable, and whether a commit-only record waits in the log for the
      next sync.
    fields:
      - name: synced
        type: uint64
      - name: lazy
        type: bool
    kind: struct
    name: storeState
  - doc: |-
      leaderContact is what a node that does not lead knows of whether its
      leader hears it: a heartbeat only says the leader reaches this node, and
      a follower whose answers were lost kept that leader, its commit frozen,
      and reported ready (#541); a learner cut off from every voter never
      campaigns and kept its last leader forever (#540). A read answered by the
      leader — a probe, or any read of the node's own — is the proof, with no
      wire change. It is loop-owned.
    fields:
      - doc: |-
          heard is when the leader named by from last answered a read of this
          node.
        name: heard
        type: time.Time
      - name: from
        type: coreconsensus.NodeID
      - doc: |-
          probeCtx is the context of the probe in flight, 0 for none, and
          probeAt when it was sent.
        name: probeCtx
        type: uint64
      - name: probeAt
        type: time.Time
    kind: struct
    name: leaderContact
  - doc: |-
      progressWatch is the leader's watch over its own storage and machine,
      loop-owned: the durable index and the applied index last seen moving,
      and when. A leader whose fdatasync never returns, or whose Apply blocks,
      kept heartbeating, so CheckQuorum held and the followers never
      campaigned, while every write and read entering at it waited for a local
      sync or apply that never came (#554).
    fields:
      - name: stable
        type: uint64
      - name: applied
        type: uint64
      - name: stableAt
        type: time.Time
      - name: appliedAt
        type: time.Time
    kind: struct
    name: progressWatch
  - doc: |-
      sendPin is a snapshot that pins compaction for a peer. While it streams,
      until is zero. Once streamed, the pin follows the peer's match until the
      peer catches up or until passes: the leader only probes the peer after an
      install, and a cut that landed in that window compacted past the entries
      the peer needed next, so it was offered snapshot after snapshot (#550).
    fields:
      - name: index
        type: uint64
      - name: until
        type: time.Time
    kind: struct
    name: sendPin
  - doc: |-
      obs holds a node's instruments. Every method is safe on a nil Meter,
      Tracer or Logger: observability is optional and never changes a decision.
    fields:
      - name: meter
        type: coremetrics.Meter
      - name: tracer
        type: coretrace.Tracer
      - name: log
        type: corelogger.Logger
      - name: group
        type: coreotel.AttrValue
      - name: mu
        type: sync.Mutex
      - name: gauge
        type: map[string]coremetrics.Gauge
      - name: count
        type: map[string]coremetrics.Counter
      - name: hist
        type: map[string]coremetrics.Histogram
      - name: lastPeers
        type: time.Time
      - name: lastRes
        type: time.Time
      - doc: |-
          peersPub and certsPub are the peers whose series the last pass
          published: a series is never deleted, so a peer that left is reset
          rather than left at its last value (#532).
        name: peersPub
        type: map[coreconsensus.NodeID]bool
      - doc: |-
          peersPub and certsPub are the peers whose series the last pass
          published: a series is never deleted, so a peer that left is reset
          rather than left at its last value (#532).
        name: certsPub
        type: map[coreconsensus.NodeID]bool
      - doc: |-
          seenTails and seenReloads are the running totals already added to
          their counters.
        name: seenTails
        type: int64
      - doc: |-
          seenTails and seenReloads are the running totals already added to
          their counters.
        name: seenReloads
        type: int64
    kind: struct
    methods:
      - doc: |-
          setGauge sets a gauge series, creating it on first use; a nil Meter makes
          it a no-op.
        name: setGauge
        params: name string, v float64, attrs ...coreotel.AttrValue
        recv: o *obs
      - doc: |-
          inc adds one to a counter series, creating it on first use; a nil Meter
          makes it a no-op.
        name: inc
        params: name string, attrs ...coreotel.AttrValue
        recv: o *obs
      - doc: addTo brings a counter up to a running total kept elsewhere.
        name: addTo
        params: name string, seen *int64, total int64
        recv: o *obs
      - doc: |-
          record adds one observation to a histogram series, creating it on first
          use with byte-scale buckets for the size metrics and latency buckets for
          the rest; a nil Meter makes it a no-op.
        name: record
        params: name string, v float64, attrs ...coreotel.AttrValue
        recv: o *obs
      - doc: info logs at Info, without building the record when the level is off.
        name: info
        params: msg string, attrs ...corelogger.AttrValue
        recv: o *obs
      - doc: warn logs at Warn, without building the record when the level is off.
        name: warn
        params: msg string, attrs ...corelogger.AttrValue
        recv: o *obs
      - doc: |-
          span starts a span when a Tracer is configured; the returned span may be
          nil, and every helper below accepts it.
        name: span
        params: ctx context.Context, name string
        recv: o *obs
        results: coretrace.Span
      - doc: |-
          observeRoleChange counts a leader change and an election start, and logs
          the new role and term; it runs only on a turn where one of them moved, so
          a stable leader logs nothing.
        name: observeRoleChange
        params: old, cur *coreconsensus.StatusValue
        recv: o *obs
      - doc: |-
          resetDeparted resets once the gauges of every peer the last pass
          published and this one, whose peers are seen, did not: a peer that left
          the membership, or a node no longer leading, publishes nothing more of
          it, its last value stood for good, and "peer unreachable" alerted for a
          member that no longer existed (#532). Its series reads as a quiet peer.
        name: resetDeparted
        params: seen map[coreconsensus.NodeID]bool
        recv: o *obs
    name: obs
  - doc: |-
      snapshotReader is OpenSnapshot's reader: a chunk reader whose end is
      checked against the metadata.
    fields:
      - name: cr
        type: "*chunkReader"
      - name: meta
        type: coreconsensus.SnapshotMetaValue
    kind: struct
    methods:
      - doc: |-
          Read implements io.Reader: the chunk reader's bytes, and at its end the
          sizes and the SHA-256 compared with the metadata, SNAPSHOT_CORRUPT on a
          difference instead of io.EOF.
        name: Read
        params: p []byte
        recv: s *snapshotReader
        results: int, error
    name: snapshotReader
  - fields:
      - doc: Snapshot is the saved snapshot's encoded stream, as SaveSnapshot wrote it.
        name: Snapshot
        type: io.Reader
      - doc: Tail is the committed entries read after the snapshot, in log order.
        name: Tail
        type: "[]coreconsensus.EntryValue"
      - doc: Machine is a fresh state machine; the snapshot is restored into it and the tail applied.
        name: Machine
        type: coreconsensus.StateMachine
    kind: struct
    name: ImportParams
  - fields:
      - name: Stamp
        type: coreconsensus.StampValue
      - name: HardState
        type: coreconsensus.HardState
      - name: First
        type: uint64
      - doc: |-
          Last is the last index the directory holds: the log's, or the
          newest snapshot's when an install a crash interrupted published it
          past the log's end.
        name: Last
        type: uint64
      - doc: |-
          LastTerm is the term of the entry at Last, or of the snapshot that
          holds Last. With Last it is the key a Recover's survivor is chosen
          by: the highest (LastTerm, Last), compared in that order, never Last
          alone nor HardState.Term, the term of the last vote.
        name: LastTerm
        type: uint64
      - name: Snapshots
        type: "[]coreconsensus.SnapshotMetaValue"
      - name: Quarantine
        type: string
      - name: Markers
        type: "[]string"
    kind: struct
    name: ReportValue
  - kind: named
    name: QuarantineExit
    underlying: uint8
  - fields:
      - doc: "Confirm must equal the new cluster id in hex: a typed confirmation."
        name: Confirm
        type: string
      - doc: Operator is recorded in the audit file.
        name: Operator
        type: coreconsensus.Operator
      - doc: Fenced attests every old voter left out of the new members.
        name: Fenced
        type: "[]coreconsensus.FencedAttestationValue"
      - doc: "WitnessKeys verify the receipts: one per witness, each must sign."
        name: WitnessKeys
        type: "[]ed25519.PublicKey"
    kind: struct
    name: RecoverOptions
  - doc: |-
      recoverIntent is what STOP-RECOVER records of the Recover that wrote it:
      the new cluster, and the last index of the old history it keeps.
    fields:
      - name: cluster
        type: coreconsensus.ClusterID
      - name: kept
        type: uint64
    kind: struct
    name: recoverIntent
  - doc: |-
      recoverPlan is what Recover decided before it writes the new history: the
      hard state to force from, the last index kept, the configuration in force
      there, and whether the marker is already durable.
    fields:
      - name: hard
        type: coreconsensus.HardState
      - name: kept
        type: uint64
      - doc: |-
          adopted is the last kept index the old history had committed, the
          new identity's AdoptedFrom; 0 records none (#509).
        name: adopted
        type: uint64
      - name: old
        type: coreconsensus.MembershipValue
      - name: resumed
        type: bool
      - doc: |-
          install is the snapshot of an install a crash interrupted, which
          Recover finishes before its marker and keeps (#506); nil when none.
        name: install
        type: "*coreconsensus.SnapshotMetaValue"
    kind: struct
    name: recoverPlan
  - fields:
      - doc: "Expected is the snapshot's metadata, from SaveSnapshot: non-zero."
        name: Expected
        type: coreconsensus.SnapshotMetaValue
      - doc: Confirm must equal the new cluster id in hex.
        name: Confirm
        type: string
      - doc: Operator is recorded in the audit file.
        name: Operator
        type: coreconsensus.Operator
      - doc: MaxEncoded and MaxDecoded bound what is read.
        name: MaxEncoded
        type: int64
      - doc: MaxEncoded and MaxDecoded bound what is read.
        name: MaxDecoded
        type: int64
      - doc: |-
          Codec decodes the chunks; nil is the codec Expected names, flate
          when it names none.
        name: Codec
        type: coretransform.BoundedDecompressor
    kind: struct
    name: RestoreOptions
  - fields:
      - name: CertFile
        type: string
      - name: KeyFile
        type: string
      - name: CAFile
        type: string
      - name: id
        type: "*tlsid.Identity"
    kind: struct
    methods:
      - name: Roots
        recv: p *PEMIdentity
        results: "*x509.CertPool"
      - name: GetCertificate
        recv: p *PEMIdentity
        results: "*tls.Certificate, error"
      - name: ReloadFailures
        recv: p *PEMIdentity
        results: int
    name: PEMIdentity
  - doc: |-
      fifo is a queue a producer never blocks on: the event loop pushes to the
      storage actor and the apply goroutine without ever waiting for them (D5b).
      What bounds it is upstream: proposals are refused with OVERLOADED past
      MaxPendingBytes before anything is appended.
    fields:
      - name: mu
        type: sync.Mutex
      - name: items
        type: "[]T"
      - name: signal
        type: chan struct{}
    kind: struct
    methods:
      - doc: |-
          push appends x and never blocks: when a wake-up is already pending the
          signal is left as it is, since the consumer's next take collects x too.
        name: push
        params: x T
        recv: q *fifo[T]
      - doc: take returns every queued item, oldest first.
        name: take
        params: dst []T
        recv: q *fifo[T]
        results: "[]T"
    name: fifo
    typeParams: T any
  - doc: |-
      chunkWriter takes the decoded stream a state machine writes and emits
      encoded chunks to w.
    fields:
      - name: w
        type: io.Writer
      - name: codec
        type: coretransform.BoundedDecompressor
      - name: buf
        type: "[]byte"
      - name: enc
        type: "[]byte"
      - name: size
        type: int
      - name: sum
        type: hash.Hash
      - name: encoded
        type: int64
      - name: decoded
        type: int64
      - doc: |-
          limit, when not 0, bounds both the decoded and the encoded stream, as
          a reader bounds them: a chunk that would pass it is refused
          SNAPSHOT_TOO_LARGE before any of it is written.
        name: limit
        type: int64
    kind: struct
    methods:
      - doc: |-
          Write buffers p and emits each chunk as it fills. On a failed emit the
          count is the bytes accepted so far, and the stream is unusable: a chunk
          was half written.
        name: Write
        params: p []byte
        recv: c *chunkWriter
        results: int, error
      - doc: |-
          flush encodes and emits the buffered chunk, header first, and folds its
          decoded bytes into the SHA-256; an empty buffer emits nothing, so Close
          after a full chunk adds no empty one.
        name: flush
        recv: c *chunkWriter
        results: error
      - doc: Close flushes the last chunk.
        name: Close
        recv: c *chunkWriter
        results: error
    name: chunkWriter
  - doc: |-
      chunkReader decodes a chunk stream, bounding every chunk's output before it
      allocates it and the running total by limit (R2-11).
    fields:
      - name: r
        type: io.Reader
      - name: codec
        type: coretransform.BoundedDecompressor
      - name: chunk
        type: int64
      - name: limit
        type: int64
      - name: total
        type: int64
      - name: enc
        type: "[]byte"
      - name: dec
        type: "[]byte"
      - name: pos
        type: int
      - name: sum
        type: hash.Hash
      - name: encoded
        type: int64
    kind: struct
    methods:
      - doc: |-
          Read returns decoded bytes, decoding the next chunk when the current one
          is spent; io.EOF arrives only on a chunk boundary, a stream cut anywhere
          else is SNAPSHOT_CORRUPT.
        name: Read
        params: p []byte
        recv: c *chunkReader
        results: int, error
      - doc: |-
          next reads, checks and decodes one chunk. The announced lengths are
          bounded BEFORE anything is allocated for them (R2-11), and a chunk whose
          checksum or decoded length disagrees with its header is refused.
        name: next
        recv: c *chunkReader
        results: error
    name: chunkReader
  - doc: |-
      spaceGuard is the guard's state. checkedAt, nextRaise and fsShort belong
      to the event loop; raising is set while a proposal of the alarm is in
      flight, and short while the last check found the disk short.
    fields:
      - name: checkedAt
        type: time.Time
      - name: nextRaise
        type: time.Time
      - name: fsShort
        type: bool
      - name: raising
        type: atomic.Bool
      - name: short
        type: atomic.Bool
    kind: struct
    name: spaceGuard
  - doc: |-
      spaceReporter is what a log store tells the guard: the bytes its segments
      occupy and its filesystem's free bytes, -1 where they are not read.
    kind: named
    name: spaceReporter
    underlying: |-
      interface {
      	logBytes() int64
      	freeBytes() int64
      }
  - fields:
      - doc: |-
          Certificate is the node's certificate and key. It carries exactly one
          URI SAN, kitsunium-consensus://<cluster>/slot/<slot>, and both
          serverAuth and clientAuth; the transport takes its cluster and slot
          from it. GetCertificate, when set, is asked at every handshake instead,
          so a renewed certificate over the same key is picked up in place.
        name: Certificate
        type: "*tls.Certificate"
      - name: GetCertificate
        type: func() (*tls.Certificate, error)
      - doc: Roots is the consensus intermediate, trusted as RootCAs and ClientCAs.
        name: Roots
        type: "*x509.CertPool"
      - doc: ListenAddress is bound as given, e.g. a private interface (R2-37).
        name: ListenAddress
        type: string
      - doc: |-
          Seeds are addresses for the first contact; the committed membership's
          addresses rule afterwards.
        name: Seeds
        type: map[coreconsensus.NodeID]string
      - doc: |-
          MaxUnauthenticatedPerIP caps the connections an IPv4 address, or an
          IPv6 /64, may hold before their handshake completes; the addresses
          the admitted members' addresses resolve to get ReservedMemberSlots
          instead, so a flood never locks a member out (R2-22). It runs before
          any TLS byte is read.
        name: MaxUnauthenticatedPerIP
        type: int
      - name: ReservedMemberSlots
        type: int
      - name: MaxFrameBytes
        type: int
      - name: MaxControlFrameBytes
        type: int
      - name: HandshakeTimeout
        type: time.Duration
      - name: PeerQueueBytes
        type: int64
      - name: MaxConnectionAge
        type: time.Duration
      - name: WriteTimeout
        type: time.Duration
      - name: JoinTimeout
        type: time.Duration
    kind: struct
    methods:
      - doc: validate applies the defaults and the refusals of the configuration.
        name: validate
        recv: c *TransportConfig
        results: error
    name: TransportConfig
  - fields:
      - name: conn
        type: net.Conn
      - name: queue
        type: chan []byte
      - name: bytes
        type: int64
      - name: mu
        type: sync.Mutex
    kind: struct
    name: peerConn
  - fields:
      - name: cfg
        type: TransportConfig
      - name: id
        type: "*tlsid.Identity"
      - name: cluster
        type: coreconsensus.ClusterID
      - name: slot
        type: string
      - name: ln
        type: net.Listener
      - name: mu
        type: sync.Mutex
      - name: members
        type: map[coreconsensus.GroupID][]coreconsensus.MemberValue
      - name: byID
        type: map[coreconsensus.NodeID]coreconsensus.MemberValue
      - name: bySPKI
        type: map[[32]byte]coreconsensus.MemberValue
      - name: out
        type: map[outKey]*peerConn
      - name: in
        type: map[net.Conn][32]byte
      - name: raw
        type: map[net.Conn]struct{}
      - name: admission
        type: "*server.Admission"
      - name: resvMu
        type: sync.Mutex
      - name: resvSeq
        type: atomic.Uint64
      - doc: |-
          resvAddrs is the sorted address list last reserved, under mu: an
          unchanged list is not reserved again (#531).
        name: resvAddrs
        type: "[]string"
      - name: peerExpiry
        type: map[coreconsensus.NodeID]time.Time
      - name: deliver
        type: func(coreconsensus.AuthenticatedPeerValue, []byte)
      - name: offer
        type: func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue
      - name: install
        type: func(coreconsensus.InstallParams) error
      - name: join
        type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code)
      - name: joinR
        type: func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
      - name: unreachable
        type: func(coreconsensus.NodeID)
      - name: closed
        type: bool
      - name: wg
        type: sync.WaitGroup
      - name: done
        type: chan struct{}
      - doc: doneOnce closes done; Close reaches it once, under mu and behind closed.
        name: doneOnce
        type: sync.Once
      - doc: |-
          predatesJoinV2 serves laneJoinV2 as a member built before it does:
          the connection ends unanswered. Set by the package's own tests only.
        name: predatesJoinV2
        type: atomic.Bool
    kind: struct
    methods:
      - name: Addr
        recv: t *TCPTransport
        results: string
      - name: Cluster
        recv: t *TCPTransport
        results: coreconsensus.ClusterID
      - name: Slot
        recv: t *TCPTransport
        results: string
      - doc: |-
          checkPeer is what the transport adds to the identity's verification, on
          every handshake: the one canonical URI SAN, of this cluster, and, when
          dialing a member, its pinned key (R2-21, R7-41, R8-07).
        name: checkPeer
        params: pin *[32]byte
        recv: t *TCPTransport
        results: tlsid.Verify
      - doc: |-
          accept is the listener's background goroutine: it admits or refuses each
          connection before any TLS byte is read, and launches one serve goroutine
          per admitted connection, counted in t.wg, which ends with its connection
          (Close closes every one still raw). accept ends when the listener is
          closed, which is how Close stops it, and only then: any other failure —
          EMFILE or ENFILE when descriptors run out — is waited out on a growing
          backoff, as net/http's Serve does. Ending on it left the listener open,
          the kernel completing handshakes into its backlog, and nothing accepting
          them: the node sent but never received again, until a restart (#518).
        name: accept
        recv: t *TCPTransport
      - doc: |-
          acceptFailed answers a failed Accept that followed a wait of delay: the
          end of the loop when the listener is closed, else the next wait, on the
          loop's one timer, cut short by the transport's close. It returns that
          wait, and whether the loop goes on.
        name: acceptFailed
        params: err error, delay time.Duration, wait *time.Timer
        recv: t *TCPTransport
        results: time.Duration, bool
      - doc: |-
          serve runs one inbound connection: the handshake under its deadline,
          then the lane byte, then the lane itself. Only a member's pinned key on
          its own slot is served, except on the JOIN lane; the connection is
          closed and forgotten when serve returns, whatever ended it.
        name: serve
        params: raw net.Conn, release func()
        recv: t *TCPTransport
      - doc: |-
          handshake runs the TLS handshake of an inbound connection under its
          deadline, gives the admission slot back once it is over, and reads the
          lane byte; ok is false when any step failed and the connection must end.
        name: handshake
        params: raw net.Conn, release func()
        recv: t *TCPTransport
        results: conn *tls.Conn, pid tlsid.PeerIdentityValue, lane byte, ok bool
      - doc: |-
          serveAuthenticated serves a handshaken connection: registered for the
          membership's cuts while a member's, a JOIN for anyone, and a member's own
          lane only when the key and the slot are those the membership pins.
        name: serveAuthenticated
        params: conn *tls.Conn, pid *tlsid.PeerIdentityValue, lane byte, slot string
        recv: t *TCPTransport
      - doc: |-
          serveMember serves a member's lane until its certificate expires, its
          connection reaches MaxConnectionAge, or it leaves the membership.
        name: serveMember
        params: conn *tls.Conn, peer coreconsensus.AuthenticatedPeerValue, leaf *x509.Certificate, lane byte
        recv: t *TCPTransport
      - doc: |-
          readFrames delivers a member's length-prefixed frames, each bound by
          limit before anything is allocated, and stops at the first malformed
          frame, read error, or once the peer is no longer a member. One buffer is
          reused for the connection's life: deliver copies what it keeps.
        name: readFrames
        params: c net.Conn, peer coreconsensus.AuthenticatedPeerValue, limit int
        recv: t *TCPTransport
      - doc: |-
          deliverTo is the bound deliver callback and whether the key is still a
          member's: a reader whose peer left stops at its next frame.
        name: deliverTo
        params: spki [32]byte
        recv: t *TCPTransport
        results: func(coreconsensus.AuthenticatedPeerValue, []byte), bool
      - doc: |-
          dial opens an outbound connection of one lane: the handshake verifies
          the chain and, when pin is set, the member's key, then the lane byte is
          written. A connection that fails any step is closed and not returned.
        name: dial
        params: ctx context.Context, addr string, lane byte, pin *[32]byte
        recv: t *TCPTransport
        results: "*tls.Conn, error"
      - doc: dialAny dials a peer that must present one of pins.
        name: dialAny
        params: ctx context.Context, addr string, lane byte, pins [][32]byte
        recv: t *TCPTransport
        results: "*tls.Conn, error"
      - doc: |-
          dialVerified dials addr, runs the identity's verification then verify,
          and writes the lane byte.
        name: dialVerified
        params: ctx context.Context, addr string, lane byte, verify tlsid.Verify
        recv: t *TCPTransport
        results: "*tls.Conn, error"
      - doc: |-
          address is where to dial a member and the key to pin it to: its
          committed address, else its seed. A member without a pin is never
          dialled, since nothing would tell it from an impostor.
        name: address
        params: to coreconsensus.NodeID
        recv: t *TCPTransport
        results: string, [32]byte, bool
      - name: Send
        params: to coreconsensus.NodeID, frame []byte
        recv: t *TCPTransport
      - doc: |-
          sender writes every frame queued for one peer and lane in one write; a
          write that misses its deadline closes the connection and reports the
          peer unreachable (D4, R2-06). It is the background goroutine Send
          launches per peer and lane, counted in t.wg, and ends when Close closes
          done; its connection is closed on the way out.
        name: sender
        params: k outKey, pc *peerConn
        recv: t *TCPTransport
      - doc: |-
          sendBatch writes one batch on the link, dialling first when there is no
          connection; a batch with no connection to go to is dropped, and Raft
          retransmits what matters. A connection that was already open and fails
          the write is dialled again once and the batch written on the new one: it
          died while the link was quiet — its peer reset it, or the kernel aborted
          it under the user timeout (boundUnacknowledged) — and the batch, an
          election's vote among others, would otherwise wait for Raft's next round.
        name: sendBatch
        params: k outKey, link *senderLink, batch [][]byte
        recv: t *TCPTransport
      - doc: |-
          retire closes the link's connection when it may carry no more frames:
          retired by age, every frame of it flushed, so the next batch dials a
          fresh one; or its key is no longer the member's — denied, replaced or
          gone — or its certificate expired, so nothing more is written on it and
          the redial checks the current pin (#551).
        name: retire
        params: k outKey, link *senderLink
        recv: t *TCPTransport
      - doc: |-
          writeBatch writes the batch on the link's connection and flushes it,
          under one write deadline.
        name: writeBatch
        params: link *senderLink, batch [][]byte
        recv: t *TCPTransport
        results: error
      - doc: |-
          redial connects the link, unless a failed dial is still backing off or
          the peer has no address; a failed dial starts the backoff and reports
          the peer unreachable. It reports whether the link is connected. Bytes
          left unacknowledged on the new connection for WriteTimeout abort it, as
          a write that blocks that long does; a connection that refuses the bound
          fails like a failed dial. A connected link gets watchLink, the background
          goroutine counted in t.wg that reads it and ends when the connection does.
        name: redial
        params: k outKey, link *senderLink
        recv: t *TCPTransport
        results: bool
      - doc: |-
          stillAdmitted reports whether a link may still carry frames: its peer is
          a member pinned to the key the link was dialled to, and the certificate
          the peer presented has not expired. DenyPin and SetMembership closed
          only the inbound connections of a member that lost its key, and the
          leader kept replicating to it on the lanes it had dialled (#551).
        name: stillAdmitted
        params: to coreconsensus.NodeID, link *senderLink
        recv: t *TCPTransport
        results: bool
      - doc: |-
          reportUnreachable tells the engine, when it asked to know, that a peer
          could not be reached.
        name: reportUnreachable
        params: id coreconsensus.NodeID
        recv: t *TCPTransport
      - name: Unreachable
        params: f func(coreconsensus.NodeID)
        recv: t *TCPTransport
      - name: Bind
        params: |
          _ coreconsensus.GroupID,
          	deliver func(coreconsensus.AuthenticatedPeerValue, []byte),
          	offer func(coreconsensus.AuthenticatedPeerValue, coreconsensus.InstallOfferValue) coreconsensus.InstallAcceptValue,
          	install func(coreconsensus.InstallParams) error,
          	join func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code),
        recv: t *TCPTransport
        results: error
      - name: SetMembership
        params: group coreconsensus.GroupID, admitted []coreconsensus.MemberValue
        recv: t *TCPTransport
      - doc: |-
          reserveAddresses gives the members' addresses their reserved admission
          budget; one that does not resolve gets none (ADR 0174 D2). Resolving may
          block, and SetMembership runs on the engine's event loop, so it runs on a
          background goroutine counted in t.wg, which ends once its set is applied
          or found stale: only the newest set lands. The caller holds t.mu.
        name: reserveAddresses
        params: byID map[coreconsensus.NodeID]coreconsensus.MemberValue
        recv: t *TCPTransport
      - name: Close
        recv: t *TCPTransport
        results: error
      - name: Stream
        params: ctx context.Context, to coreconsensus.NodeID, offer coreconsensus.InstallOfferValue, open func(int64) (io.ReadCloser, error)
        recv: t *TCPTransport
        results: error
      - doc: |-
          serveSnapshot is the receiving end of a snapshot stream: it reads the
          offer, answers with the engine's acceptance, and when accepted hands the
          stream to install, then writes back the install's verdict.
        name: serveSnapshot
        params: c *tls.Conn, peer coreconsensus.AuthenticatedPeerValue
        recv: t *TCPTransport
      - doc: |-
          serveJoin answers the one frame a non-member may send. The slot comes
          from the certificate, the SPKI from the handshake; join runs off the event
          loop under a deadline (R9-06). On laneJoinV2 the JOIN also announces the
          joiner's MaxSnapshotBytes (#556).
        name: serveJoin
        params: c net.Conn, peer coreconsensus.AuthenticatedPeerValue, lane byte
        recv: t *TCPTransport
      - name: Join
        params: ctx context.Context, cfg coreconsensus.JoinConfig
        recv: t *TCPTransport
        results: coreconsensus.PositionValue, error
      - doc: |-
          joinOne sends the JOIN to one address, to a peer presenting one of pins,
          and installs the membership it answers once that membership lists the
          peer under its key. refused is set when the peer answered with a refusal.
          A JOIN that announces a limit goes on laneJoinV2 first; a peer that ends
          that connection without a word predates the lane, and the JOIN goes again
          on laneJoin, announcing nothing, as it did before (#556).
        name: joinOne
        params: ctx context.Context, addr string, req coreconsensus.JoinRequestValue, pins [][32]byte
        recv: t *TCPTransport
        results: pos coreconsensus.PositionValue, refused bool, err error
      - doc: |-
          joinOnLane is one JOIN on lane. silent is set when the peer, verified,
          ended the connection before any byte of an answer.
        name: joinOnLane
        params: ctx context.Context, addr string, lane byte, req coreconsensus.JoinRequestValue, pins [][32]byte
        recv: t *TCPTransport
        results: pos coreconsensus.PositionValue, refused, silent bool, err error
      - doc: |-
          joinAnswered reads a JOIN's answer b, or the failure rerr to read it, from
          the peer that presented spki, and installs the membership it carries.
        name: joinAnswered
        params: b []byte, rerr error, spki [32]byte
        recv: t *TCPTransport
        results: pos coreconsensus.PositionValue, refused bool, err error
      - doc: |-
          releaseJoinAnswer drops the JOIN answer's admission group once the node
          is admitted: from then on the engine's configuration alone admits.
        name: releaseJoinAnswer
        recv: t *TCPTransport
      - name: BindJoinReason
        params: _ coreconsensus.GroupID, join func(context.Context, coreconsensus.AuthenticatedPeerValue, coreconsensus.JoinRequestValue) (coreconsensus.PositionValue, errs.Code, string)
        recv: t *TCPTransport
      - name: RefusedBeforeHandshake
        recv: t *TCPTransport
        results: int64
      - name: CertExpiry
        recv: t *TCPTransport
        results: time.Time
      - name: PeerCertExpiry
        recv: t *TCPTransport
        results: map[coreconsensus.NodeID]time.Time
      - name: ReloadFailures
        recv: t *TCPTransport
        results: int
      - doc: |-
          maxFrameBytes is the largest frame this transport reads: the engine
          refuses a batch bound above it.
        name: maxFrameBytes
        recv: t *TCPTransport
        results: int
    name: TCPTransport
  - fields:
      - name: to
        type: coreconsensus.NodeID
      - name: lane
        type: byte
    kind: struct
    name: outKey
  - doc: |-
      senderLink is a sender's connection to its peer and lane, with what it
      needs to retire it by age, by the key it was dialled to and by that
      key's certificate, and to pace redials after a failure.
    fields:
      - name: conn
        type: "*tls.Conn"
      - name: w
        type: "*bufio.Writer"
      - name: created
        type: time.Time
      - name: backoff
        type: time.Time
      - doc: |-
          pin is the key the peer was pinned to when the link was dialled,
          and notAfter the end of the certificate it presented.
        name: pin
        type: "[32]byte"
      - name: notAfter
        type: time.Time
    kind: struct
    methods:
      - doc: |-
          close drops the link's connection: the sender is stopping, or the
          connection is retired or broken, and nothing is left to write on it.
        name: close
        recv: l *senderLink
    name: senderLink
  - doc: |-
      connNetter is what watchLink needs of a link's connection: to read it,
      and its socket to close.
    kind: named
    name: connNetter
    underlying: |-
      interface {
      	io.Reader
      	NetConn() net.Conn
      }
  - doc: |-
      closeWriter is the end of a snapshot stream the sender writes and then
      half-closes, so the receiver sees the stream end and can still answer.
    kind: named
    name: closeWriter
    underlying: |-
      interface {
      	io.Writer
      	CloseWrite() error
      }
vars:
  - doc: |-
      The engine reaches every interface below by TYPE ASSERTION, on the ports it
      was handed: the data directory's hold, the stop markers, the silence
      condition, the log's gauges, the spool's release, the transport's frame
      bound and certificate expiry. An assertion cannot fail a build, so a
      shipped store or transport that stopped satisfying one would quietly lose
      the behaviour — a DataDir closed under a live Node, a start over a stop
      marker, a node voting through its silence. Each line below turns that
      into a compile error, here.
    grouped: true
    items:
      - name: _
        type: coreconsensus.LogStore
        value: (*fileLog)(nil)
      - name: _
        type: coreconsensus.SnapshotStore
        value: (*fileSnapshots)(nil)
      - name: _
        type: coreconsensus.Transport
        value: (*TCPTransport)(nil)
      - name: _
        type: coreconsensus.Transport
        value: (*MemoryTransport)(nil)
      - name: _
        type: |-
          interface {
          		compactPrefixAt(through, term uint64) error
          	}
        value: (*fileLog)(nil)
      - name: _
        type: |-
          interface {
          		compactPrefixAt(through, term uint64) error
          	}
        value: (*MemoryLog)(nil)
      - name: _
        type: dirHolder
        value: (*fileLog)(nil)
      - name: _
        type: interface{ checkMarkers() error }
        value: (*fileLog)(nil)
      - name: _
        type: |-
          interface {
          		silence() (term, index uint64, unreadable, err error)
          	}
        value: (*fileLog)(nil)
      - name: _
        type: interface{ endSilence() error }
        value: (*fileLog)(nil)
      - name: _
        type: |-
          interface {
          		logStats() (bytes, free, tails int64)
          	}
        value: (*fileLog)(nil)
      - name: _
        type: spaceReporter
        value: (*fileLog)(nil)
      - name: _
        type: |-
          interface {
          		markStopEach(errs.Code, string) (dirErr, runErr error)
          	}
        value: (*fileLog)(nil)
      - name: _
        type: interface{ release() }
        value: (*fileSink)(nil)
      - doc: A published snapshot's handle reads as a spool's file does.
        name: _
        type: spoolFile
        value: (*fileHandle)(nil)
      - name: _
        type: |-
          interface {
          		Cluster() coreconsensus.ClusterID
          	}
        value: (*TCPTransport)(nil)
      - name: _
        type: interface{ maxFrameBytes() int }
        value: (*TCPTransport)(nil)
      - name: _
        type: joinReleaser
        value: (*TCPTransport)(nil)
      - name: _
        type: joinReleaser
        value: (*MemoryTransport)(nil)
      - name: _
        type: |-
          interface {
          		CertExpiry() time.Time
          		PeerCertExpiry() map[coreconsensus.NodeID]time.Time
          		ReloadFailures() int
          	}
        value: (*TCPTransport)(nil)
    name: _
  - doc: |-
      sentinelByCode maps every code the step function may answer to the
      sentinel a caller matches on. A code it does not hold is answered by
      sentinelOf as OUTCOME_UNKNOWN: an outcome the engine cannot name is never
      guessed into a more specific one.
    items:
      - name: sentinelByCode
        value: |-
          map[errs.Code]*errs.Error{
          	coreconsensus.CodeNotLeader:               coreconsensus.NotLeader,
          	coreconsensus.CodeMembershipChangePending: coreconsensus.MembershipChangePending,
          	coreconsensus.CodeMembershipInvalid:       coreconsensus.MembershipInvalid,
          	coreconsensus.CodeNodeIDRetired:           coreconsensus.NodeIDRetired,
          	coreconsensus.CodeAdminPreconditionFailed: coreconsensus.AdminPreconditionFailed,
          	coreconsensus.CodeTransferFailed:          coreconsensus.TransferFailed,
          	coreconsensus.CodeVersionUnsupported:      coreconsensus.VersionUnsupported,
          	coreconsensus.CodeConsensusMisconfigured:  coreconsensus.ConsensusMisconfigured,
          	coreconsensus.CodeOverloaded:              coreconsensus.Overloaded,
          	coreconsensus.CodeEntryTooLarge:           coreconsensus.EntryTooLarge,
          	coreconsensus.CodeCompacted:               coreconsensus.Compacted,
          	coreconsensus.CodeFrameInvalid:            coreconsensus.FrameInvalid,
          	coreconsensus.CodeSnapshotTooLarge:        coreconsensus.SnapshotTooLarge,
          	coreconsensus.CodeJoinRefused:             coreconsensus.JoinRefused,
          	coreconsensus.CodeNoSpace:                 coreconsensus.NoSpace,
          	coreconsensus.CodeLeadershipUnconfirmed:   coreconsensus.LeadershipUnconfirmed,
          }
    name: sentinelByCode
  - grouped: true
    items:
      - doc: |-
          peerGauges are the leader's per-peer series, reset once a peer is no
          longer published (#532).
        name: peerGauges
        value: "[]string{mPeerMatchLag, mPeerInflight, mPeerUnreachable, mPeerLastContact}"
      - doc: |-
          latencyBuckets are the histogram bounds, in seconds, of every latency
          D13 records: half a millisecond to five seconds, dense below 100 ms
          where a healthy commit lands, so a regression is visible before it is
          an outage.
        name: latencyBuckets
        value: "[]float64{0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5}"
    name: peerGauges
  - doc: |-
      castagnoli is the CRC-32C table every checksum of the log, the stamp and
      the snapshot stream is computed with: built once, read concurrently.
    items:
      - name: castagnoli
        value: crc32.MakeTable(crc32.Castagnoli)
    name: castagnoli
  - doc: |-
      unmarked holds, by absolute path, every data directory a node of this
      process stopped on with STORAGE_FAILED and no marker written in either
      place. A consumer that does not exit on that stop would otherwise open it
      again in the same boot and trust the page cache the failed fdatasync left
      (R9-05, #562).
    items:
      - name: unmarked
        type: sync.Map
    name: unmarked
  - doc: |-
      listenTCP opens the transport's listener; a test replaces it to make
      Accept fail the way an exhausted descriptor table does (#518).
    items:
      - name: listenTCP
        value: net.Listen
    name: listenTCP
