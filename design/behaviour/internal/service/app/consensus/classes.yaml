# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      batchFrameOverhead bounds what an append frame adds to the batch bytes
      the leader counts: the message header and the first entry's fields.
    items:
      - name: batchFrameOverhead
        type: int
        value: 1 << 10
    name: batchFrameOverhead
  - grouped: true
    items:
      - doc: |-
          ReadIndex confirms every read by a heartbeat round started after it
          arrived. It is the zero value and the default.
        name: ReadIndex
        type: ReadMode
        value: iota
      - doc: |-
          ReadLease serves reads under the leader lease, sound only under the
          four conditions of D9; it requires InitialTiming.MaxClockDrift.
        name: ReadLease
    name: ReadIndex
  - grouped: true
    items:
      - doc: "DurabilityUnset is refused: the caller states it."
        name: DurabilityUnset
        type: Durability
        value: iota
      - doc: |-
          DurabilityVolatile is a state machine held in memory, rebuilt from the
          latest snapshot and the log at every start.
        name: DurabilityVolatile
      - doc: |-
          DurabilityDurable is a DurableStateMachine that persists its applied
          position with its state.
        name: DurabilityDurable
    name: DurabilityUnset
  - grouped: true
    items:
      - doc: fileLock is the file whose flock excludes a second process (D11).
        name: fileLock
        value: "\"LOCK\""
      - doc: fileStamp holds the node's identity and its log's lineage.
        name: fileStamp
        value: "\"STAMP\""
      - doc: |-
          markerQuarantine is written FIRST when recovery finds damage it may not
          repair; while it exists the log refuses every call (D4).
        name: markerQuarantine
        value: "\"QUARANTINE\""
      - doc: |-
          markerStopPrefix starts the name of every stop marker, the reason
          following it: a start is refused while one applies (D4, R9-05).
        name: markerStopPrefix
        value: "\"STOP-\""
    name: fileLock
  - doc: |-
      The stamp's encoding: the node's identity and its log's lineage, in the
      data directory's STAMP file.
    grouped: true
    items:
      - doc: |-
          stampVersion is the first byte of an encoded stamp; a stamp of another
          version is unreadable, never guessed at.
        name: stampVersion
        type: byte
        value: "1"
      - doc: |-
          stampVersion2 is the first byte of a stamp whose log identity records
          AdoptedFrom, which only Recover or RestoreSnapshot sets, in a history
          at protocol version 2: version 1's fields with AdoptedFrom after the
          kept index. A node of protocol 1 refuses to open it (#509).
        name: stampVersion2
        type: byte
        value: "2"
      - doc: |-
          stampFixed is the stamp's length before its slot and its CRC: version
          1, cluster 16, epoch 8, predecessor 16, predecessor epoch 8, kept
          index 8, id 8, incarnation 16, state 1, founding 32, slot length 1.
        name: stampFixed
        type: int
        value: 1 + 16 + 8 + 16 + 8 + 8 + 8 + 16 + 1 + 32 + 1
    name: stampVersion
  - grouped: true
    items:
      - doc: errImpossible is the cause of an answer a store must never give.
        name: errImpossible
        type: cause
        value: "\"impossible answer\""
      - doc: |-
          errUnknownCompactTerm is the cause of a compaction past the log's end
          whose term the caller did not give (#415).
        name: errUnknownCompactTerm
        type: cause
        value: "\"compaction past the end of the log with no term\""
      - doc: |-
          errUnknownBaseTerm is the cause of a start with no table whose base
          term neither the log nor a snapshot's metadata knows (#415).
        name: errUnknownBaseTerm
        type: cause
        value: "\"no term known for the log's base\""
      - doc: errPinned is the cause of a Remove refused while a handle is open.
        name: errPinned
        type: cause
        value: "\"snapshot pinned by an open handle\""
      - doc: |-
          errSilenceLength is the cause of a silence condition of a length this
          version never writes.
        name: errSilenceLength
        type: cause
        value: "\"silence condition of the wrong length\""
      - doc: MaxJoinReasonBytes bounds the reason a JOIN refusal carries to the joiner.
        name: MaxJoinReasonBytes
        type: int
        value: "256"
    name: errImpossible
  - doc: |-
      The shipped log (D4) is a directory of fixed-size, zero-filled segment
      files. Every record is 8-byte aligned:

      	length u32 | crc u32 | version u8 | kind u8 | end u8 | 0 u8 | batch u64 |
      	term u64 | index u64 | entry kind u8 | 0 0 0 | entry version u32 |
      	body sum u32 | chain u32 | payload | zero padding

      little-endian; length counts the bytes after the crc field, padding
      excluded, and the crc is the CRC-32C of those bytes. Records are written
      in batches: every record of a batch carries its sequence number, the last
      one the end-of-batch flag, and batch k+1 is written only after batch k was
      synced, so any valid record of batch k+1 proves batch k durable
      (R7-12, R8-01 to R8-04).
    grouped: true
    items:
      - name: recHeader
        type: int
        value: "8"
      - name: recFixed
        type: int
        value: "44"
      - name: recVersion
        type: uint8
        value: "1"
      - name: recEntry
        type: uint8
        value: "1"
      - name: recHardState
        type: uint8
        value: "2"
      - name: recTruncate
        type: uint8
        value: "3"
      - name: recCheckpt
        type: uint8
        value: "4"
      - name: recSeal
        type: uint8
        value: "5"
      - name: recCompact
        type: uint8
        value: "6"
      - name: recCommit
        type: uint8
        value: "7"
      - doc: |-
          u64Bytes is the width of every little-endian uint64 field written to
          disk, in a record payload or in the stamp.
        name: u64Bytes
        type: int
        value: "8"
      - doc: |-
          recAlign is the boundary every record starts on: recovery looks for a
          valid record after a hole at each multiple of it, and nowhere else.
        name: recAlign
        type: int
        value: "8"
      - doc: "checkpointLen is a checkpoint record's payload: eight uint64s."
        name: checkpointLen
        type: int
        value: "64"
      - doc: "hardStateLen is a hard-state record's payload: term, vote and commit."
        name: hardStateLen
        type: int
        value: "24"
      - doc: sealReserve keeps room for the seal record at a segment's end.
        name: sealReserve
        type: int64
        value: "64"
      - doc: DefaultSegmentBytes is a segment's fixed size (provisional).
        name: DefaultSegmentBytes
        type: int64
        value: 64 << 20
    name: recHeader
  - doc: |-
      supersededWhy is the SNAPSHOT_CORRUPT of a sink another install of the
      same id superseded: the leader answers it with a new offer.
    items:
      - name: supersededWhy
        value: "\"spool superseded by another install of the same id\""
    name: supersededWhy
  - doc: |-
      maxReadyLag is the apply lag, in entries, a caught-up node stays ready
      through while what it applies keeps moving (#545).
    items:
      - name: maxReadyLag
        type: uint64
        value: "64"
    name: maxReadyLag
  - doc: The facts a PeerHealthValue carries.
    grouped: true
    items:
      - doc: PeerVoter is set for a voter, clear for a learner.
        name: PeerVoter
        type: PeerFlags
        value: 1 << iota
      - doc: |-
          PeerUnreachable is set when the transport failed to reach the peer
          since it last answered, or it has not answered within the minimum
          election timeout.
        name: PeerUnreachable
      - doc: PeerSnapshot is set while a snapshot is being sent to the peer.
        name: PeerSnapshot
    name: PeerVoter
  - doc: The answers a HealthValue carries.
    grouped: true
    items:
      - doc: |-
          HealthReady is the readiness answer: running, a leader known,
          everything known committed applied, and not refusing the current
          leader's chain (D4).
        name: HealthReady
        type: HealthFlags
        value: 1 << iota
      - doc: HealthHasLeader is set when a leader is known in the current term.
        name: HealthHasLeader
      - doc: |-
          HealthQuorumReachable is set on a leader a majority answered within
          the minimum election timeout; never elsewhere.
        name: HealthQuorumReachable
      - doc: HealthStopped is set once the node stopped itself or was closed.
        name: HealthStopped
      - doc: |-
          HealthSnapshotNearLimit is set when the newest snapshot has reached
          four fifths of SnapshotLimit: the cuts are about to be refused
          SNAPSHOT_TOO_LARGE (R2-30). Readiness does not depend on it.
        name: HealthSnapshotNearLimit
    name: HealthReady
  - doc: |-
      maxSlotLen bounds a slot name, which the stamp stores behind a one-byte
      length.
    items:
      - name: maxSlotLen
        type: int
        value: "32"
    name: maxSlotLen
  - doc: |-
      memQueueFrames is the depth of each per-lane queue of the memory double:
      deep enough that a test's burst is not dropped by accident, finite so a
      stalled receiver still loses frames the way a real lane does (D2).
    items:
      - name: memQueueFrames
        type: int
        value: "4096"
    name: memQueueFrames
  - doc: |-
      A proposal's stage says what a cancelled caller may be told: only an
      unsent proposal is certainly not in the log.
    grouped: true
    items:
      - doc: |-
          stageUnsent is a proposal the loop has not handed to raft: a
          cancellation is ctx.Err(), nothing was appended.
        name: stageUnsent
        type: int32
        value: iota
      - doc: |-
          stagePossible is a proposal raft may have accepted, or forwarded to
          the leader: its outcome is unknown until answered.
        name: stagePossible
      - doc: |-
          stageAppended is a proposal appended at a known position: it is
          resolved when that index is applied.
        name: stageAppended
      - doc: |-
          stageAbandoned is a proposal its caller gave up on while it was
          unsent: the loop drops it and never hands it to raft (#519).
        name: stageAbandoned
    name: stageUnsent
  - grouped: true
    items:
      - doc: |-
          inboxDepth bounds the inbound message lanes and the proposal queue:
          a burst a few heartbeats long is absorbed, a flood is dropped at the
          lane (and refused at Propose) instead of growing without bound.
        name: inboxDepth
        type: int
        value: "4096"
      - doc: |-
          loopBacklog bounds the closures and storage completions queued for
          the event loop; both are produced at most a few per turn.
        name: loopBacklog
        type: int
        value: "1024"
      - doc: |-
          fetchBacklog bounds the log reads answered back to the loop; reads
          are issued per lagging peer, so a few dozen cover a cluster.
        name: fetchBacklog
        type: int
        value: "64"
      - doc: |-
          maxChainRefusals is the N of D4's "no silent loop": how many
          identical chain refusals of one leader make a follower report itself
          unready (R6-05), enough to ride out a transient, few enough that an
          operator hears of a real divergence.
        name: maxChainRefusals
        type: int
        value: "3"
      - doc: |-
          maxBatchedProposals caps how many queued proposals one turn drains
          into a batch, so one turn never starves the other inputs.
        name: maxBatchedProposals
        type: int
        value: "1024"
      - doc: |-
          maxCtrlPerTurn caps the control messages drained after each turn,
          so control comes first without starving the data lane (D4).
        name: maxCtrlPerTurn
        type: int
        value: "256"
    name: inboxDepth
  - doc: |-
      pinAfterStream bounds the pin of a streamed snapshot, in maximum
      election timeouts: a peer that stopped after its install no longer holds
      the log back once it passes.
    items:
      - name: pinAfterStream
        type: int64
        value: "10"
    name: pinAfterStream
  - doc: |-
      The metric names are part of the contract (D13): spelled as Prometheus
      exposes them, underscores, _total on counters, units in the name.
    grouped: true
    items:
      - name: mRole
        value: "\"consensus_role\""
      - name: mTerm
        value: "\"consensus_term\""
      - name: mLeaderChanges
        value: "\"consensus_leader_changes_total\""
      - name: mHasLeader
        value: "\"consensus_has_leader\""
      - name: mFailureTolerance
        value: "\"consensus_failure_tolerance\""
      - name: mCommitLatency
        value: "\"consensus_commit_latency_seconds\""
      - name: mApplyLatency
        value: "\"consensus_apply_latency_seconds\""
      - name: mFsyncLatency
        value: "\"consensus_fsync_latency_seconds\""
      - name: mBatchEntries
        value: "\"consensus_batch_entries\""
      - name: mBatchBytes
        value: "\"consensus_batch_bytes\""
      - name: mApplyLagEntries
        value: "\"consensus_apply_lag_entries\""
      - name: mApplyLagBytes
        value: "\"consensus_apply_lag_bytes\""
      - name: mPeerMatchLag
        value: "\"consensus_peer_match_lag_entries\""
      - name: mPeerInflight
        value: "\"consensus_peer_inflight\""
      - name: mPeerUnreachable
        value: "\"consensus_peer_unreachable\""
      - name: mPeerLastContact
        value: "\"consensus_peer_last_contact_seconds\""
      - name: mElectionsStarted
        value: "\"consensus_elections_started_total\""
      - name: mSnapshotDuration
        value: "\"consensus_snapshot_duration_seconds\""
      - name: mSnapshotBytes
        value: "\"consensus_snapshot_bytes\""
      - name: mSnapshotInstalls
        value: "\"consensus_snapshot_installs_total\""
      - name: mNoSpace
        value: "\"consensus_nospace\""
      - name: mFramesDropped
        value: "\"consensus_frames_dropped_total\""
      - name: mBarrierLatency
        value: "\"consensus_barrier_latency_seconds\""
      - name: mProposalsFailed
        value: "\"consensus_proposals_failed_total\""
      - name: mProposalsPending
        value: "\"consensus_proposals_pending\""
      - name: mClusterVersion
        value: "\"consensus_cluster_version\""
      - name: mProtocolVersion
        value: "\"consensus_protocol_version\""
      - name: mLoopTurn
        value: "\"consensus_loop_turn_seconds\""
      - name: mChainRefusals
        value: "\"consensus_chain_refusals_total\""
      - name: mStopped
        value: "\"consensus_stopped\""
      - name: mJoinsRateLimited
        value: "\"consensus_joins_rate_limited_total\""
      - name: mLogBytes
        value: "\"consensus_log_bytes\""
      - name: mLogQuota
        value: "\"consensus_log_quota_bytes\""
      - name: mFsFree
        value: "\"consensus_fs_free_bytes\""
      - name: mTailTruncated
        value: "\"consensus_tail_truncated_total\""
      - name: mCertExpiry
        value: "\"consensus_tls_cert_expiry_seconds\""
      - name: mPeerCertExpiry
        value: "\"consensus_tls_peer_cert_expiry_seconds\""
      - name: mReloadFailures
        value: "\"consensus_tls_reload_failures_total\""
    name: mRole
  - doc: |-
      departedCertExpiry is what consensus_tls_peer_cert_expiry_seconds reads
      for a peer that left: a series cannot be deleted, and its last value,
      left to stand, crossed the alert's threshold (#532). It never expires.
    items:
      - name: departedCertExpiry
        type: float64
        value: math.MaxFloat64
    name: departedCertExpiry
  - grouped: true
    items:
      - doc: |-
          WipeAndRejoin wipes the directory; the operator then Removes the old
          NodeID and Inits under a NEW one (R4-03). A voter's incarnation is
          never swapped in place.
        name: WipeAndRejoin
        type: QuarantineExit
        value: iota + 1
      - doc: |-
          TruncateAndStaySilent truncates at the damage and persists a silence
          condition (R4-03).
        name: TruncateAndStaySilent
    name: WipeAndRejoin
  - grouped: true
    items:
      - doc: |-
          fileSilent holds the persisted silence condition: the highest term the
          truncated log ever named and the index the silence lasts until (R4-03).
        name: fileSilent
        value: "\"SILENT\""
      - doc: fileAudit is the append-only record of every offline operation.
        name: fileAudit
        value: "\"AUDIT\""
      - doc: |-
          markerRecover is the stop marker of a Recover in progress: written,
          synced, before the forced entry, and removed only once the new stamp is
          durable. It names the new cluster and the last index kept, so a start
          is refused while it is there and a Recover to that cluster resumes from
          what the first one decided (#405).
        name: markerRecover
        value: markerStopPrefix + "RECOVER"
    name: fileSilent
  - grouped: true
    items:
      - doc: |-
          chunkHeaderLen is the three u32 fields that precede every chunk's
          bytes: encoded length, decoded length and CRC-32C.
        name: chunkHeaderLen
        value: "12"
      - doc: |-
          defaultChunkSize is the decoded size of a chunk: large enough that the
          header and the codec's framing are noise, small enough that a resumed
          transfer loses at most 1 MiB.
        name: defaultChunkSize
        value: 1 << 20
    name: chunkHeaderLen
  - doc: The bounds of the wait after a cut that failed without stopping the node.
    grouped: true
    items:
      - name: cutRetryMin
        type: time.Duration
        value: time.Second
      - name: cutRetryMax
        type: time.Duration
        value: time.Minute
    name: cutRetryMin
  - grouped: true
    items:
      - doc: |-
          spaceCheckEvery bounds how often the loop reads its filesystem's free
          space, as the gauges do.
        name: spaceCheckEvery
        type: time.Duration
        value: time.Second
      - doc: |-
          spaceRaiseEvery bounds how often the node proposes the alarm while it
          is not committed: a node with no leader is refused at once.
        name: spaceRaiseEvery
        type: time.Duration
        value: time.Second
      - doc: |-
          spaceOperator is the operator an alarm the engine raises is recorded
          under (D8).
        name: spaceOperator
        type: coreconsensus.Operator
        value: "\"engine:no-space\""
    name: spaceCheckEvery
  - doc: |-
      The lane is the first byte a dialer writes after the handshake: it says
      what the connection carries, so control traffic never queues behind
      entries or a snapshot (D4).
    grouped: true
    items:
      - doc: |-
          laneControl carries votes and heartbeats, under the smaller frame
          bound.
        name: laneControl
        type: byte
        value: "0"
      - doc: laneData carries entries.
        name: laneData
        type: byte
        value: "1"
      - doc: laneSnapshot carries one snapshot offer and its stream.
        name: laneSnapshot
        type: byte
        value: "2"
      - doc: laneJoin carries one JOIN from a node that is not a member yet.
        name: laneJoin
        type: byte
        value: "3"
      - doc: |-
          laneJoinV2 carries one versioned JOIN: joinVersion2, the joiner's
          MaxSnapshotBytes, then laneJoin's JOIN (R2-30, #556). A member that
          predates it serves no unknown lane and ends the connection without an
          answer, and the joiner sends the same JOIN on laneJoin.
        name: laneJoinV2
        type: byte
        value: "4"
      - doc: joinVersion2 is the first byte of a JOIN on laneJoinV2.
        name: joinVersion2
        type: byte
        value: "2"
      - doc: |-
          joinV2Prefix is a versioned JOIN's bytes before laneJoin's: the
          version and the little-endian u64 limit.
        name: joinV2Prefix
        type: int
        value: 1 + 8
      - doc: sanScheme is the URI scheme of a node certificate's one URI SAN.
        name: sanScheme
        value: "\"kitsunium-consensus\""
    name: laneControl
  - grouped: true
    items:
      - doc: |-
          defaultUnauthenticatedPerIP is the pre-handshake budget of one
          address, the one server.Admission defaults to (ADR 0174 D2).
        name: defaultUnauthenticatedPerIP
        type: int
        value: "4"
      - doc: |-
          defaultReservedMemberSlots is the budget of a member's address, the
          reserved one server.Admission defaults to (ADR 0174 D2).
        name: defaultReservedMemberSlots
        type: int
        value: "8"
      - doc: |-
          minFrameBody is the smallest body a frame can announce: its version,
          kind and group. A shorter one is refused before any allocation.
        name: minFrameBody
        type: int
        value: "10"
      - doc: |-
          senderQueueFrames bounds the frames queued for one peer and lane; the
          byte bound PeerQueueBytes usually binds first.
        name: senderQueueFrames
        type: int
        value: "4096"
      - doc: |-
          maxSenderBatch caps the frames one write carries, so a long queue
          is flushed in bounded writes under one deadline each.
        name: maxSenderBatch
        type: int
        value: "1024"
      - doc: |-
          redialBackoff is how long a sender drops frames after a failed dial
          instead of dialling again for each: Raft retransmits what matters.
        name: redialBackoff
        type: time.Duration
        value: 100 * time.Millisecond
      - doc: connBufferBytes sizes the buffered reader and writer of a connection.
        name: connBufferBytes
        type: int
        value: 64 << 10
      - doc: |-
          acceptBackoffFirst is the wait after the first of consecutive failed
          Accepts; each next one doubles it (#518).
        name: acceptBackoffFirst
        type: time.Duration
        value: 5 * time.Millisecond
      - doc: acceptBackoffCeiling bounds the wait after a failed Accept.
        name: acceptBackoffCeiling
        type: time.Duration
        value: time.Second
      - doc: |-
          joinGroup is the admission group the JOIN answer is installed in, apart
          from the engine's (Config.Group clamps 0 to 1, so it is never 0). In the
          engine's group, the first configuration a joiner replayed — an older
          snapshot, the first batch of a log fed from index 1 — replaced the
          answer, and a leader admitted after that configuration was cut and
          refused for as long as it led (#552). The answer stays until the
          joiner's own committed configuration lists it: every member admitted
          before its AddLearner is in its log by then.
        name: joinGroup
        type: coreconsensus.GroupID
        value: "0"
    name: defaultUnauthenticatedPerIP
  - doc: |-
      tcpUserTimeout is TCP_USER_TIMEOUT of linux/tcp.h, which package syscall
      does not name.
    items:
      - name: tcpUserTimeout
        type: int
        value: "0x12"
    name: tcpUserTimeout
