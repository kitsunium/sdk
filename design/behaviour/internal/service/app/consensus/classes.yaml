      applyProgress is what readiness knows of the apply goroutine's progress,
      loop-owned and updated at every publication: whether the node caught up
      once, the applied index last published and when applied last moved or
      reached the commit.
    fields:
      - name: caughtUp
        type: bool
      - name: applied
        type: uint64
      - name: movedAt
        type: time.Time
    kind: struct
    methods:
      - doc: noteApplied records a publication's commit and applied index.
        name: noteApplied
        params: commit, applied uint64, now time.Time
        recv: p *applyProgress
    name: applyProgress
