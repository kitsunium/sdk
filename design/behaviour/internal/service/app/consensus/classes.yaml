functions:
  - doc: |-
      unsupportedKind stops a node that meets an entry kind it does not know
      (review M3).
    name: unsupportedKind
    params: k coreconsensus.EntryKind, index uint64
    results: error
  - doc: |-
      foundingDigest is the digest of the founding member list, so that a rerun
      with another list is refused.
    name: foundingDigest
    params: members []coreconsensus.MemberValue
    results: "[32]byte"
  - doc: |-
      byID is the founding list in ID order: the digest AND entry 1 are built
      from it, so founders given the same members in any order write the same
      entry (review M1).
    name: byID
    params: members []coreconsensus.MemberValue
    results: "[]coreconsensus.MemberValue"
  - name: Bootstrap
    params: ctx context.Context, cfg *Config, members []coreconsensus.MemberValue
    results: error
  - doc: |-
      checkFounders refuses a founding list no cluster may start from: empty,
      with a zero or repeated id, with a member that carries no SPKI pin, with
      two members pinned to one key, or with fewer voters than MinVoters. It reads nothing from disk, so a bad
      list is refused before the stamp is touched.
    name: checkFounders
    params: members []coreconsensus.MemberValue, minVoters int
    results: error
  - doc: countVoters is how many members of a list vote.
    name: countVoters
    params: members []coreconsensus.MemberValue
    results: int
  - doc: |-
      founderStamp reads the stamp Bootstrap advances, refusing a log that was
      never initialised or that belongs to another cluster or node.
    name: founderStamp
    params: cfg *Config
    results: coreconsensus.StampValue, error
  - doc: |-
      checkSelfListed refuses a founding list that does not name this node with
      the incarnation and slot it was stamped with: every founder must run
      Bootstrap with the same list, and that list must include itself.
    name: checkSelfListed
    params: members []coreconsensus.MemberValue, stamp *coreconsensus.StampValue
    results: error
  - doc: |-
      advanceFounding runs the stamp phase of Bootstrap. It reports done when
      the node is already a member founded with this list, refuses a list that
      differs from the one already recorded, and moves an empty joining log to
      bootstrap-pending with the list's digest. A stamp state it does not
      define is refused, never founded.
    name: advanceFounding
    params: log coreconsensus.LogStore, stamp *coreconsensus.StampValue, digest [32]byte
    results: bool, error
  - doc: |-
      foundingTiming is the generation 1 contract the founding entry carries:
      cfg's InitialTiming completed field by field and refused as NewNode
      completes and refuses it, so the contract that rules once entry 1 commits
      is exactly the one NewNode validated. Written raw, a timing with only its
      drift set became TimingDefaults with no drift, one without its maximum
      refused every promotion, one without its minimum was refused by the
      engine and left each node on its own InitialTiming (#523).
    name: foundingTiming
    params: cfg *Config
    results: coreconsensus.TimingContractSpec, error
  - doc: |-
      writeFoundingEntry writes the founding configuration as entry 1, at term
      1 and committed, with the generation 1 contract timing, then syncs it; a
      log that already holds an entry is left alone, which is what makes a
      rerun idempotent.
    name: writeFoundingEntry
    params: cfg *Config, members []coreconsensus.MemberValue, timing coreconsensus.TimingContractSpec
    results: error
  - doc: |-
      sharedKey reports whether two members are pinned to one key. The
      transport admits a connection by its key: two members under one key
      could speak as each other (review M5).
    name: sharedKey
    params: members []coreconsensus.MemberValue
    results: bool
  - name: TimingDefaults
    results: coreconsensus.TimingContractSpec
  - doc: |-
      misconfigured is the refusal of a Config the node cannot run on: it names
      the field and the reason, never the value the caller supplied.
    name: misconfigured
    params: field, why string
    results: error
  - doc: |-
      clampInt replaces a non-positive bound with its default: a zero bound is
      "unset", never "unlimited" (ADR 0031, clamp half).
    name: clampInt
    params: v *int, d int
  - doc: clampInt64 is clampInt for the byte budgets held as int64.
    name: clampInt64
    params: v *int64, d int64
  - doc: clampU64 is clampInt for the unsigned counts, where only zero is unset.
    name: clampU64
    params: v *uint64, d uint64
  - doc: |-
      withDefaults applies the clamp half of ADR 0031, then the cross-field
      refusals (R2-14), to a copy of cfg: the caller's Config is never changed.
    name: withDefaults
    params: cfg *Config
    results: Config, error
  - doc: |-
      clampDefaults fills every unset field with its default; it refuses
      nothing, so the refusals that follow judge the configuration the node
      would actually run on.
    name: clampDefaults
    params: c *Config
  - doc: |-
      clampTiming fills the unset fields of the proposed timing contract from
      D5's defaults; an unset maximum is at least twice the minimum, so a
      caller who raised only the minimum still gets a valid window.
    name: clampTiming
    params: timing *coreconsensus.TimingContractSpec
  - doc: |-
      refuseIncoherent returns the first cross-field refusal (R2-14), always in
      the same order (the ports, then the timing, then the byte bounds), so a
      caller fixing one at a time sees a stable sequence.
    name: refuseIncoherent
    params: c *Config
    results: error
  - doc: |-
      refuseNilPorts refuses a node missing one of the four ports it cannot
      run without.
    name: refuseNilPorts
    params: c *Config
    results: error
  - doc: |-
      refuseTiming refuses a timing contract under which elections would fire
      between heartbeats, and a lease read without a bounded clock drift (D9).
    name: refuseTiming
    params: c *Config
    results: error
  - doc: |-
      refuseBounds refuses byte bounds that contradict each other and a batch
      the transport cannot carry (D14).
    name: refuseBounds
    params: c *Config
    results: error
  - doc: |-
      refuseCeilings refuses the two ceilings that have no safe default, and
      the bounds that contradict them (D14).
    name: refuseCeilings
    params: c *Config
    results: error
  - doc: |-
      refuseDurability refuses a Durability that disagrees with the machine's
      siblings, and the unset zero (D3): guessing it would either lose state at
      restart or replay entries a durable machine already applied.
    name: refuseDurability
    params: c *Config
    results: error
  - doc: |-
      defaultCodec is flate, whose registered singleton bounds its
      decompression. ok is false only if that singleton stopped implementing
      BoundedDecompressor; the configuration is then refused rather than run
      with a codec that could inflate a hostile snapshot without bound.
    name: defaultCodec
    results: coretransform.BoundedDecompressor, bool
  - doc: |-
      framesBelow reports whether the transport declares a frame limit below n.
      A transport that declares none is not checked.
    name: framesBelow
    params: t coreconsensus.Transport, n int
    results: bool
  - name: NewDataDir
    params: dir string
    results: DataDir, error
  - name: NewDataDirWith
    params: dir string, opts DataDirOptions
    results: DataDir, error
  - doc: reasonOf is the reason a stop marker's name carries for code.
    name: reasonOf
    params: code errs.Code
    results: string
  - doc: |-
      stopMarkerPresent is the STOP_MARKER_PRESENT of the marker at path, its
      trimmed content as the detail an operator reads before clearing it.
    name: stopMarkerPresent
    params: path string, content []byte
    results: error
  - doc: |-
      encodeStamp is the stamp's on-disk form: the fixed fields, the slot
      prefixed by its length, and a CRC-32C of everything before it. A stamp
      whose log identity records AdoptedFrom is written in version 2, any
      other in version 1, so a value has one encoding.
    name: encodeStamp
    params: s coreconsensus.StampValue
    results: "[]byte"
  - doc: |-
      decodeStamp parses encodeStamp's form; ok is false for another version, a
      short stamp, a CRC that fails, a state this version does not define, a
      slot length that disagrees with the bytes left, or a version 2 stamp
      that records no AdoptedFrom.
    name: decodeStamp
    params: b []byte
    results: coreconsensus.StampValue, bool
  - doc: |-
      stampBody checks a stamp's version, length and CRC, and returns the bytes
      the CRC covers and whether it is of version 2.
    name: stampBody
    params: b []byte
    results: body []byte, v2, ok bool
  - doc: |-
      decodeStampLog reads the log identity at the head of a stamp's body into
      l and returns the offset after it; ok is false for a version 2 stamp that
      records no AdoptedFrom, which encodeStamp writes in version 1.
    name: decodeStampLog
    params: body []byte, v2 bool, l *coreconsensus.LogIdentityValue
    results: int, bool
  - doc: |-
      readStamp reads the stamp of dir: none yet is the zero stamp, a read that
      fails is a STORAGE_FAILED, and a stamp that cannot be decoded is
      DATA_DIR_MISMATCH, since nothing in it can be trusted to name this node.
    name: readStamp
    params: dir string
    results: coreconsensus.StampValue, error
  - doc: writeStamp replaces the stamp of dir atomically and durably.
    name: writeStamp
    params: dir string, s coreconsensus.StampValue
    results: error
  - doc: |-
      u64s renders v in decimal: the spelling every index field of an error
      carries, and the one LeaderHint parses back.
    name: u64s
    params: v uint64
    results: string
  - doc: |-
      origin builds a fresh error on its own sentinel: every outcome is an
      ORIGIN, its cause kept as a field, never a wrap of the cause (R7-10).
    name: origin
    params: sentinel *errs.Error, fields ...errs.FieldValue
    results: error
  - doc: |-
      alsoFailed returns err, the failure being reported, with the failure of the
      cleanup that followed it kept beside it. The cause stays the error a caller
      matches on — a cleanup's failure must not replace the cause with a
      consequence — and the cleanup's failure is still there to be read: an SDK
      error gains a field and keeps its single line, any other error is joined,
      so errs.HasCode still finds a STORAGE_FAILED the cleanup raised.
    name: alsoFailed
    params: err error, op string, failure error
    results: error
  - doc: |-
      abandon is where an error with no reader goes, and the only place one may.
      Its callers are cleanups whose outcome is already decided: closing a socket
      the transport is dropping, writing the last reply on a connection whose
      peer reads the failure itself, closing a temporary file no one will read
      and recovery deletes. Each call site says which. It is never handed the
      error of a write, a sync or a read of durable state: those stop the node
      (D4) or reach the caller.
    name: abandon
    params: err error
  - doc: |-
      storageFailed is the STORAGE_FAILED of operation op, its cause kept as a
      field rather than wrapped, so the code a caller matches on is always the
      storage failure and never whatever the cause happened to carry (D4).
    name: storageFailed
    params: op string, cause error
    results: error
  - doc: |-
      pinnedSnapshot is a Remove refused while a handle reads the snapshot: a
      transfer in flight, benign, retried at the next cut. It is never a
      STORAGE_FAILED, which stops the node (#422).
    name: pinnedSnapshot
    results: error
  - doc: |-
      notLeader is the NOT_LEADER a follower answers, the leader it knows in
      the field LeaderHint reads; a zero hint means none is known.
    name: notLeader
    params: hint coreconsensus.NodeID
    results: error
  - doc: |-
      outcomeUnknown is the OUTCOME_UNKNOWN of an operation that may or may not
      have committed: the caller must not retry it as if it had failed.
    name: outcomeUnknown
    params: why string
    results: error
  - doc: |-
      withToken is an error on sentinel carrying the committed token t in the
      hex field TokenOf decodes.
    name: withToken
    params: sentinel *errs.Error, t coreconsensus.TokenValue
    results: error
  - doc: |-
      sentinelOf returns the sentinel of a code the step function answered,
      OUTCOME_UNKNOWN for any code it does not name.
    name: sentinelOf
    params: c errs.Code
    results: "*errs.Error"
  - name: LeaderHint
    params: err error
    results: coreconsensus.NodeID, bool
  - name: TokenOf
    params: err error
    results: coreconsensus.TokenValue, bool
  - doc: |-
      joinReasonOf is what a joiner may read of an authorizer's refusal: an
      SDK error's public message, else the error's text, printable UTF-8 only,
      trimmed, and cut at MaxJoinReasonBytes on a rune boundary. It holds
      nothing the authorizer did not choose to say.
    name: joinReasonOf
    params: err error
    results: string
  - doc: |-
      sanitizeReason keeps the printable runes of s, trimmed, at most
      MaxJoinReasonBytes long.
    name: sanitizeReason
    params: s string
    results: string
  - name: JoinRefusalReason
    params: err error
    results: string, bool
  - doc: joinRefused builds the joiner's JOIN_REFUSED, its reason in a field.
    name: joinRefused
    params: code errs.Code, reason string
    results: error
  - doc: align8 rounds n up to the next record boundary.
    name: align8
    params: n int
    results: int
  - doc: |-
      appendRecord encodes r at the end of dst, crc sealed and zero-padded to
      the record boundary, and returns the extended slice.
    name: appendRecord
    params: dst []byte, r *record
    results: "[]byte"
  - doc: boolByte is v as the record's flag byte.
    name: boolByte
    params: v bool
    results: byte
  - doc: sealRecord recomputes a record's crc over its body.
    name: sealRecord
    params: b []byte
  - doc: |-
      sealedBody is the body of the record at b[0:] when its length is in range
      and its crc holds, whatever version it carries; nil otherwise.
    name: sealedBody
    params: b []byte
    results: "[]byte"
  - doc: |-
      parseRecord decodes the record at b[0:]; ok is false for a hole: a short
      read, a zero header, a length out of range or a crc that fails — and for
      a sealed record of a version this build does not write, which recovery
      tells apart with unknownVersionAt before it calls anything a hole (#511).
    name: parseRecord
    params: b []byte
    results: rec record, ok bool
  - doc: |-
      unknownVersionAt looks, at every record boundary from off to the end of
      b, for a record whose crc holds but whose version this build does not
      write. Such a record is no damage: a newer build wrote it, synced, and
      may have acknowledged it — an entry, a vote. Taken for a hole, recovery
      zeroed it as a torn tail after a rollback, and the node forgot what it
      had acknowledged and the vote it had cast (#511). D18: unknown means
      stop, never skip. It returns VERSION_UNSUPPORTED naming the first one, or
      nil.
    name: unknownVersionAt
    params: b []byte, seg uint64, off int64
    results: error
  - doc: |-
      decodeCheckpoint parses encode's payload; ok is false for any other
      length, which recovery reads as a damaged checkpoint.
    name: decodeCheckpoint
    params: b []byte
    results: checkpoint, bool
  - doc: encodeHS is a hard-state record's payload.
    name: encodeHS
    params: hs coreconsensus.HardState
    results: "[]byte"
  - doc: |-
      segName is segment n's file name; fixed-width hex, so the names sort in
      segment order and recovery accepts no other spelling of n.
    name: segName
    params: n uint64
    results: string
  - doc: quarantined is the LOG_QUARANTINED of damage at off in segment seg.
    name: quarantined
    params: seg uint64, off int64, why string
    results: error
  - doc: |-
      openFileLog opens, and recovers, the log of a data directory. A damaged
      log is quarantined: the marker is written FIRST and nothing is modified
      (D4).
    name: openFileLog
    params: dd *dataDir, segBytes int64
    results: "*fileLog, error"
  - doc: |-
      continuesBatch reports whether r may follow prev: in prev's batch, or
      first of the next one once prev ended its own.
    name: continuesBatch
    params: prev, r *record
    results: bool
  - doc: |-
      checkLayouts refuses, before any tail is classified or trimmed, a record
      of a kind this build does not know or a hard state of another length:
      left to replay, one in an unfinished last batch was trimmed with the tear
      and zeroed, and the open succeeded (D18, #511).
    name: checkLayouts
    params: segs []*scanned
    results: error
  - doc: |-
      knownLayout is nil for a record of a kind this build reads, with the
      payload length that kind has where it has one.
    name: knownLayout
    params: seg uint64, r *record
    results: error
  - doc: |-
      unknownLayout is the VERSION_UNSUPPORTED of record r of segment seg, a
      layout this build does not read: field names what it is, v its value.
    name: unknownLayout
    params: seg uint64, r *record, field string, v int
    results: error
  - doc: decodeHS parses encodeHS's payload; the caller checked its length.
    name: decodeHS
    params: b []byte
    results: coreconsensus.HardState
  - doc: |-
      classifyTail is step 2 to 4 of the decision procedure (R8-02, R9-01,
      R9-03): it returns where to truncate a torn tail, or -1 and why the hole
      is quarantined.
    name: classifyTail
    params: b []byte, recs []record, hole int64
    results: int64, string
  - doc: recordsAfter is every valid record after the hole, at record boundaries.
    name: recordsAfter
    params: b []byte, hole int64
    results: "[]record"
  - doc: |-
      judgeAfterHole returns why a hole is quarantined given the valid records
      after it, or "" when they do not forbid a tear.
    name: judgeAfterHole
    params: after []record, torn uint64
    results: string
  - doc: |-
      tornBatchStart is where the batch torn, which never completed, begins:
      all of it is dropped, as it was never synced and never acknowledged. A
      torn batch that starts with the segment's checkpoint is quarantined.
    name: tornBatchStart
    params: recs []record, lastOff int64, torn uint64
    results: int64, string
  - doc: allZero reports whether b holds only zero bytes.
    name: allZero
    params: b []byte
    results: bool
  - doc: |-
      zeroFrom zeroes f from off to size, 1 MiB at a time, and syncs it; the
      sync runs even when there is nothing to zero, so the caller may rely on
      the range being durable zeros on return.
    name: zeroFrom
    params: f *os.File, off, size int64
    results: error
  - doc: |-
      abandonTmp closes f, the segment .tmp at path a failure leaves
      unpublished, removes it, and returns cause, the failure that stops the
      log. The .tmp is never renamed, so what its Close says changes nothing. It
      is removed now, not at the next start: a zero-fill that failed on a full
      disk wrote until the disk had no byte left, and the disk is shared with
      what the product stores beside the log (#520). A removal that fails
      leaves it to recovery, which deletes every .tmp.
    name: abandonTmp
    params: f io.Closer, path string, cause error
    results: error
  - doc: |-
      writeFileSync publishes data at path atomically and durably: written and
      synced to path.tmp, renamed over path, and the directory synced.
    name: writeFileSync
    params: path string, data []byte
    results: error
  - doc: |-
      mkdirDurable creates dir, private to the owner, and when it did not exist
      syncs its parent: the new entry is otherwise published only by whatever
      syncs that directory next, which ext4 and XFS do through their journal and
      other filesystems may not (#422). A directory already there is left as it
      is, so a parent this process may not open is never asked for.
    name: mkdirDurable
    params: dir string
    results: error
  - doc: |-
      writeSynced writes data to a fresh file at path and syncs it. The file is
      closed before it returns, so before writeFileSync renames it, and a Close
      failure is reported like the sync's: it is part of the write.
    name: writeSynced
    params: path string, data []byte
    results: err error
  - doc: |-
      compactionTerm is the term a compaction through index through records,
      over a log whose last index is last and which answers held for that
      index: the log's own where it holds the entry, the caller's past its end.
      A caller's term that disagrees with the log's, or none past the end, is
      refused: the term recorded there is what a node with no table votes on.
    name: compactionTerm
    params: through, last, held, given uint64
    results: uint64, error
  - doc: |-
      newFileSnapshots opens the snapshot directory dir, creating it private
      to the owner, and removes every .snap that has no .meta: a crash between
      a snapshot's rename and its .meta leaves one, and it is neither a snapshot
      nor resumable. Of the receive spools only the newest stays, the one a
      resume may still continue (#527). A directory that cannot be created, listed or cleaned is a
      STORAGE_FAILED, so a store never opens over a state it could not read.
    name: newFileSnapshots
    params: dir string
    results: "*fileSnapshots, error"
  - doc: |-
      newestSpool is the id of the newest receive spool among ents, "" when
      there is none. Snapshot ids are fixed-width (index, term), so the newest
      sorts last.
    name: newestSpool
    params: ents []os.DirEntry
    results: string
  - doc: |-
      validID reports whether id may name a snapshot's files: non-empty,
      bounded, and with no separator or dot, so an id a peer sent can never
      reach outside the directory or collide with another file's suffix.
    name: validID
    params: id string
    results: bool
  - doc: |-
      resumeOffset cuts the spool f back to its last whole chunk, of decoded
      chunks of chunk bytes, and positions it there.
    name: resumeOffset
    params: f spoolFile, chunk int64
    results: int64, error
  - doc: |-
      fsFree returns the bytes an unprivileged writer may still use on the
      filesystem holding dir, -1 when unknown.
    name: fsFree
    params: dir string
    results: int64
  - doc: |-
      isReady is the verdict's Ready: running, a leader known, everything known
      committed applied — or, once caught up, a lag that keeps moving within
      its bound (applyOK) — and not refusing the current leader's chain (D4).
    name: isReady
    params: h *HealthValue, st *coreconsensus.StatusValue, applyOK bool
    results: bool
  - doc: |-
      applyReady is applyReady's rule over plain values: moved is how long ago
      applied last moved, window the stall bound.
    name: applyReady
    params: caughtUp bool, commit, applied uint64, moved, window time.Duration
    results: bool
  - doc: drawID draws a random NodeID, never 0.
    name: drawID
    results: coreconsensus.NodeID
  - doc: |-
      drawIncarnation draws a random incarnation, which tells two lifetimes of
      one slot apart. crypto/rand.Read never returns an error on this toolchain
      (it aborts the process instead), so the discarded result hides nothing.
    name: drawIncarnation
    results: coreconsensus.Incarnation
  - name: InitLog
    params: log coreconsensus.LogStore, cluster coreconsensus.ClusterID, slot string
    results: coreconsensus.NodeID, coreconsensus.Incarnation, error
  - name: RedrawLog
    params: log coreconsensus.LogStore
    results: coreconsensus.NodeID, error
  - doc: |-
      validSlot admits a slot name of 1 to maxSlotLen bytes of [a-z0-9-]: it
      is written in the stamp and in a certificate's URI SAN, so nothing a
      filesystem, a URL or a log line could misread gets in.
    name: validSlot
    params: s string
    results: bool
  - doc: |-
      releaseSink closes a sink's handle and keeps its spool for a resume,
      when the store's sink can; a sink that cannot keeps nothing open.
    name: releaseSink
    params: sink coreconsensus.SnapshotSink
  - name: NewMemoryLog
    results: "*MemoryLog"
  - doc: |-
      compacted is the COMPACTED a reader gets for an index below the log's
      first: the entry is in a snapshot now, and both bounds travel as fields
      so the caller knows where the log resumes.
    name: compacted
    params: index, first uint64
    results: error
  - name: NewMemorySnapshots
    results: "*MemorySnapshots"
  - name: NewMemoryNetwork
    results: "*MemoryNetwork"
  - name: NewMemoryTransport
    params: n *MemoryNetwork, id coreconsensus.NodeID
    results: "*MemoryTransport"
  - doc: memSPKI is the stand-in key the memory transport reports for a node.
    name: memSPKI
    params: id coreconsensus.NodeID
    results: "[32]byte"
  - name: MemorySPKI
    params: id coreconsensus.NodeID
    results: "[32]byte"
  - doc: |-
      compactLog compacts log through index through, whose term is term (0 when
      unknown), by the store's compactPrefixAt when it has one: a store that
      takes the term of the compaction point from its caller, which an install
      past the end of the log needs. Both shipped stores do; another store
      compacts by CompactPrefix alone.
    name: compactLog
    params: log coreconsensus.LogStore, through, term uint64
    results: error
  - doc: |-
      newSubEpoch draws a random epoch in the high 32 bits of a forward
      submission id, so ids never repeat across restarts (R7-23, R9-17); it
      also seeds the election timeouts when the caller set no Seed.
    name: newSubEpoch
    results: uint64
  - name: NewNode
    params: cfg Config
    results: "*Node, error"
  - doc: |-
      newRaft opens the node once NewNode holds the data directory: it checks
      the stamp, loads the snapshot and the log, binds the transport, then
      launches the node's four background goroutines (reader, storage actor,
      apply, event loop). Each is counted in n.wg and ends once stopc closes,
      through Close, HardClose or a self-stop; nothing is launched on an error.
    name: newRaft
    params: cfg Config
    results: "*Node, error"
  - doc: |-
      startStamp reads the stamp a node may start on, refusing a directory
      with a stop marker, one never stamped, one whose bootstrap is pending,
      one of another cluster or node, and a transport whose certificate names
      another cluster (R3-24).
    name: startStamp
    params: cfg *Config
    results: coreconsensus.StampValue, error
  - doc: |-
      refuseStamp is the stamp half of startStamp: a node starts only on a
      founded or joining directory of its own cluster and, when cfg names one,
      its own id.
    name: refuseStamp
    params: cfg *Config, stamp *coreconsensus.StampValue
    results: error
  - doc: newNode allocates a node's queues and maps; it starts nothing.
    name: newNode
    params: cfg *Config, stamp *coreconsensus.StampValue
    results: "*Node"
  - doc: |-
      lineageAccepts reports whether a snapshot of identity l, at index, belongs
      to this node's history: of its own lineage at or past the index Recover
      kept, which it records, or of the predecessor's at or below that index,
      as durablePosition counts a machine's position. One of its own lineage below
      the kept index is refused: the kept entries after it would reach this
      node by append, which a leader never sends, and a node that adopted the
      lineage from it would hold no entry at or below the index to append to
      another once it leads, which raft's guard on the kept index relies on.
    name: lineageAccepts
    params: cur, l coreconsensus.LogIdentityValue, index uint64
    results: bool
  - doc: |-
      silenceOf reads the silence condition a recovered log persists, the term
      and index raft stays silent until; a store that keeps none answers zeros,
      which is no silence. A condition that cannot be read stops the start.

      A condition that exists but cannot be read keeps the node silent past the
      end of its log, the safe side, and is reported: an operator otherwise
      finds a node that never votes and no line saying why.
    name: silenceOf
    params: log coreconsensus.LogStore, o *obs
    results: term, index uint64, err error
  - doc: |-
      termless reports whether m names an index above 0 at term 0, which no
      committed entry has.
    name: termless
    params: m *coreconsensus.SnapshotMetaValue
    results: bool
  - doc: |-
      ownFailure reports whether a snapshot failed to restore for a reason of
      its own — its checksums, or the machine refusing its state — rather than
      this node's disk or a limit its configuration sets now: those may pass at
      the next start, and the snapshot must still be there then.
    name: ownFailure
    params: err error
    results: bool
  - doc: |-
      noTableBase is the base a node with no usable snapshot starts from: the
      log's compaction point, with the configuration and chain tip the newest
      snapshot's metadata records, which stays readable when its bytes do not.

      The term at first-1 is the log's own compaction term, which every LogStore
      answers; a store that cannot is one whose base this node must not guess,
      since a wrong term there is a log-matching check answered falsely. The
      metadata of a snapshot at first-1 records that term too, and answers when
      the log says 0, which a compaction past the end recorded before #415. A
      base above index 0 whose term is 0 by both is refused: the node would
      grant its vote to any candidate whose last term is 1 or more.
    name: noTableBase
    params: log coreconsensus.LogStore, metas []coreconsensus.SnapshotMetaValue, first uint64
    results: coreconsensus.SnapshotMetaValue, error
  - doc: isMembershipEntry reports whether e is a configuration entry.
    name: isMembershipEntry
    params: e coreconsensus.EntryValue
    results: bool
  - doc: |-
      baseTerm is the term of a no-table base at first-1: the log's, logTerm,
      or the term metaTerm of the snapshot metadata at that index when matched
      and the log says 0. Two that disagree, or none above index 0, are refused.
    name: baseTerm
    params: logTerm, metaTerm uint64, matched bool, first uint64
    results: uint64, error
  - doc: |-
      needsSync reports whether a Ready must be durable before its completion:
      all but one that only carries a commit, which is written lazily (raft's
      ReadyValue.Commit).
    name: needsSync
    params: rd *raft.ReadyValue
    results: bool
  - doc: |-
      newObs binds a node's instruments to its configured Meter, Tracer and
      Logger; every series carries the group, so two groups never share one.
    name: newObs
    params: cfg *Config
    results: "*obs"
  - doc: |-
      key is the cache key of one series: the name and its attributes in call
      order. A bare name is its own key, so the unlabelled series, the common
      case, costs no allocation.
    name: key
    params: name string, attrs []coreotel.AttrValue
    results: string
  - doc: lattr is an unsigned log attribute.
    name: lattr
    params: k string, v uint64
    results: corelogger.AttrValue
  - doc: lstr is a string log attribute.
    name: lstr
    params: k, v string
    results: corelogger.AttrValue
  - doc: spanEvent records an event on a span that may be nil (no Tracer).
    name: spanEvent
    params: s coretrace.Span, name string, attrs ...coreotel.AttrValue
  - doc: spanEnd ends a span that may be nil, marking it failed when err is set.
    name: spanEnd
    params: s coretrace.Span, err error
  - doc: |-
      codeAttr is the attribute a failure is counted under: the error's reason,
      or its dotted-quad code when it has none, so the series stays bounded by
      the code space rather than by the messages.
    name: codeAttr
    params: err error
    results: coreotel.AttrValue
  - name: OpenSnapshot
    params: r io.Reader, opt *RestoreOptions
    results: io.Reader, error
  - name: ImportObserved
    params: d DataDir, p *ImportParams, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, opt *RestoreOptions
    results: coreconsensus.SnapshotMetaValue, error
  - doc: |-
      replayObserved restores p.Snapshot into p.Machine, reads the stream to its
      digest whatever the machine left unread, then applies the tail's commands
      with the tokens the snapshot's lineage gives them.
    name: replayObserved
    params: p *ImportParams, opt *RestoreOptions
    results: error
  - doc: |-
      encodeObserved encodes the state p.Machine reached as a snapshot stream,
      and the metadata that describes it: exp's, moved to the tail's last entry.
    name: encodeObserved
    params: p *ImportParams, codec coretransform.BoundedDecompressor, exp coreconsensus.SnapshotMetaValue
    results: "[]byte, coreconsensus.SnapshotMetaValue, error"
  - doc: checkObservedTail checks that a tail continues a snapshot, entry by entry.
    name: checkObservedTail
    params: exp *coreconsensus.SnapshotMetaValue, tail []coreconsensus.EntryValue
    results: error
  - name: Init
    params: d DataDir, cluster coreconsensus.ClusterID, slot string
    results: coreconsensus.NodeID, coreconsensus.Incarnation, error
  - name: Redraw
    params: d DataDir
    results: coreconsensus.NodeID, error
  - name: Inspect
    params: d DataDir
    results: ReportValue, error
  - doc: |-
      lastTermOf is the term of the entry at r.Last: the newest snapshot's when
      it ends at r.Last, else the log's. It is the half of the survivor's key
      Inspect did not report: two survivors may show the same Last and the same
      HardState.Term, the term of a vote, and only the term of their last
      entries tells which one holds the writes a majority committed (D17,
      #534). A snapshot at r.Last wins over the log's entry there: an install a
      crash interrupted published it past the log, or at the log's last index
      under another term, and the start, or Recover, moves the log onto it
      (#506). A log with no entry and no snapshot reports 0.
    name: lastTermOf
    params: l *fileLog, r *ReportValue
    results: uint64
  - doc: |-
      readQuarantineMarker is the quarantine marker of dir, trimmed, or "" when
      there is none. A marker that could not be read is a STORAGE_FAILED: a
      report must not read as a directory with no quarantine.
    name: readQuarantineMarker
    params: dir string
    results: string, error
  - doc: |-
      stopMarkers names the stop markers of dir, nil when there is none; a .tmp
      is a marker whose write never completed, and is not one.
    name: stopMarkers
    params: dir string
    results: "[]string, error"
  - name: ClearQuarantine
    params: d DataDir, exit QuarantineExit, op coreconsensus.Operator
    results: error
  - doc: |-
      receiptMessage is what a witness signs: the old cluster, the new cluster
      and the fenced voter.
    name: receiptMessage
    params: old, next coreconsensus.ClusterID, voter coreconsensus.NodeID
    results: "[]byte"
  - name: ReceiptMessage
    params: old, next coreconsensus.ClusterID, voter coreconsensus.NodeID
    results: "[]byte"
  - name: Recover
    params: d DataDir, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, opt *RecoverOptions
    results: error
  - doc: |-
      recoverAuditLine is Recover's audit line: the index kept, the persisted
      commit, and how many entries past that commit the new history adopts. A
      resumed Recover reports the index its marker kept, the forced entry it
      writes again replacing any the interrupted one left.
    name: recoverAuditLine
    params: newCluster coreconsensus.ClusterID, p *recoverPlan
    results: string
  - doc: recoverRefused is Recover's refusal, its reason in the why field.
    name: recoverRefused
    params: why string
    results: error
  - doc: |-
      isZeroDigest reports whether d is the all-zero digest, which no real
      SPKI pin or snapshot hash is.
    name: isZeroDigest
    params: d [32]byte
    results: bool
  - doc: |-
      checkRecover refuses a Recover whose preconditions fail, in a fixed order
      so the reason given is always the first that applies.
    name: checkRecover
    params: stamp *coreconsensus.StampValue, newCluster coreconsensus.ClusterID, opt *RecoverOptions
    results: error
  - doc: |-
      checkRecoverMembers refuses new members that are not all pinned, or
      among which this node, at its incarnation, is not a voter.
    name: checkRecoverMembers
    params: stamp *coreconsensus.StampValue, members []coreconsensus.MemberValue
    results: error
  - doc: |-
      checkFenced refuses a Recover that leaves out an old voter without a
      fence receipt from EVERY witness for it.
    name: checkFenced
    params: voters []coreconsensus.NodeID, members []coreconsensus.MemberValue, opt *RecoverOptions, oldCluster, newCluster coreconsensus.ClusterID
    results: error
  - doc: signedByEvery reports whether every key signed msg in one of receipts.
    name: signedByEvery
    params: keys []ed25519.PublicKey, receipts [][]byte, msg []byte
    results: bool
  - doc: |-
      extends reports whether e is the verified link after the entry at end,
      of term term and chain sum chain: the next index, a term that does not go
      back, and a body and chain sum that match what e records.
    name: extends
    params: e *coreconsensus.EntryValue, end, term uint64, chain uint32
    results: bool
  - doc: |-
      snapshotAt is the snapshot of metas that ends at index: the newest is not
      always the one, when it failed its checksums and the base is the older's.
    name: snapshotAt
    params: metas []coreconsensus.SnapshotMetaValue, index uint64
    results: coreconsensus.SnapshotMetaValue, bool
  - doc: |-
      lastMembership is the configuration committed at index, from the log or
      the latest snapshot. A store that cannot answer fails it: a configuration
      read from half the sources is an older one, and Recover would ask for the
      fence of the wrong voters.
    name: lastMembership
    params: l *fileLog, snaps *fileSnapshots, index uint64
    results: coreconsensus.MembershipValue, error
  - doc: |-
      clusterVersionThrough is the cluster version the committed entries
      through index leave, from the latest snapshot and the raises in the log
      after it, applied as the engine applies them at commit. A store that
      cannot answer fails it.
    name: clusterVersionThrough
    params: l *fileLog, snaps *fileSnapshots, index uint64
    results: uint32, error
  - name: RestoreSnapshot
    params: d DataDir, r io.Reader, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, opt *RestoreOptions
    results: coreconsensus.SnapshotMetaValue, error
  - doc: restoreRefused is RestoreSnapshot's refusal, its reason in the why field.
    name: restoreRefused
    params: why string
    results: error
  - doc: |-
      checkRestore refuses a RestoreSnapshot whose preconditions fail, in a
      fixed order so the reason given is always the first that applies: the
      target, then the bounds, then the members.
    name: checkRestore
    params: flog *fileLog, stamp *coreconsensus.StampValue, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, opt *RestoreOptions
    results: error
  - doc: |-
      restoreCodec is the codec the restored chunks are decoded with: the
      caller's, else the one the expected metadata names, else the default,
      flate. Read with flate whatever the metadata said, a snapshot a node cut
      with another codec failed as corrupt instead of being refused cleanly
      when this build does not link its codec (D18, #548).
    name: restoreCodec
    params: opt *RestoreOptions
    results: coretransform.BoundedDecompressor, error
  - doc: |-
      defaultRestoreCodec is the default for a restore, refused when flate no
      longer bounds its decompression rather than decoding without a bound.
    name: defaultRestoreCodec
    results: coretransform.BoundedDecompressor, error
  - doc: |-
      checkRestoreTarget is the first half of RestoreSnapshot's preconditions,
      checked in a fixed order with checkRestoreBounds after it, so the reason
      given is always the first that applies.
    name: checkRestoreTarget
    params: flog *fileLog, newCluster coreconsensus.ClusterID, opt *RestoreOptions
    results: error
  - doc: |-
      checkRestoreBounds is the second half of RestoreSnapshot's preconditions:
      an empty joining directory, and a snapshot within the bounds the caller
      set, both of which must be set.
    name: checkRestoreBounds
    params: flog *fileLog, stamp *coreconsensus.StampValue, opt *RestoreOptions
    results: error
  - doc: |-
      checkRestoreMembers refuses new members among which this node, at its
      incarnation, is not a voter, or of which one is not pinned.
    name: checkRestoreMembers
    params: stamp *coreconsensus.StampValue, members []coreconsensus.MemberValue
    results: error
  - doc: |-
      restoredMeta is the metadata the restored snapshot is published under:
      the expected one, in a new history that records the old cluster as its
      predecessor and the snapshot's index as the last it kept, with the new
      members. Every entry a snapshot covers was committed: at protocol version
      2 the identity records the whole kept range as adopted from a commit, in
      the stamp the restore writes; the meta does not carry it (#509).
    name: restoredMeta
    params: exp *coreconsensus.SnapshotMetaValue, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue
    results: coreconsensus.SnapshotMetaValue
  - doc: |-
      persistedSilenceTerm is the term of the silence condition already in dir,
      0 when there is none. One that cannot be read refuses the exit: it is
      never overwritten with a term that may be lower.
    name: persistedSilenceTerm
    params: dir string
    results: uint64, error
  - doc: |-
      logSegments lists the published segments of logDir by number; a name
      that is not exactly a segment's is ignored.
    name: logSegments
    params: logDir string
    results: map[uint64]string, error
  - doc: |-
      logMaxTerm is the highest term of every readable record of the log,
      before and after any damage. It changes nothing.
    name: logMaxTerm
    params: logDir string
    results: uint64, error
  - doc: |-
      truncateAtDamage deletes every segment after segment segN, and segN too
      when the damage is at its start, and zeroes segN from off otherwise.
    name: truncateAtDamage
    params: logDir string, segN uint64, off int64
    results: error
  - doc: |-
      maxRecordTerm is the highest term any readable record of segment b names,
      before and after any damage, scanning every record boundary.
    name: maxRecordTerm
    params: b []byte
    results: uint64
  - doc: |-
      recordTerm is the highest term r names: its own, and the one of the hard
      state or checkpoint it carries.
    name: recordTerm
    params: r *record
    results: uint64
  - doc: |-
      truncateSegment applies the truncation at (segN, off) to segment n of
      size bytes at path: deleted when it lies wholly past the damage, zeroed
      from off when the damage is inside it, untouched before it.
    name: truncateSegment
    params: path string, n, segN uint64, off, size int64
    results: error
  - doc: |-
      zeroSegmentFrom zeroes and syncs the segment at path from off to size.
      Its Close is part of the write: a failure there is reported like the
      zeroing's.
    name: zeroSegmentFrom
    params: path string, off, size int64
    results: err error
  - doc: |-
      silenceRecord is the silence condition's on-disk form: the term, then
      the index the silence lasts until, 0 for "the end of the log".
    name: silenceRecord
    params: term, index uint64
    results: "[]byte"
  - doc: |-
      claimed keeps, in place, the proposals the loop takes from their callers:
      each moves from unsent to possibly accepted, before raft or the leader
      sees it, unless its caller abandoned it first, and an abandoned proposal
      is dropped unanswered, its caller already told ctx.Err() (#519).
    name: claimed
    params: ps []*proposal
    results: "[]*proposal"
  - name: ProposeAs
    params: ctx context.Context, r coreconsensus.Replicated, data []byte
    results: coreconsensus.TokenValue, R, error
    typeParams: R any
  - name: NewPEMIdentity
    params: certFile, keyFile, caFile string
    results: "*PEMIdentity, error"
  - name: NewTCPTransportFromPEM
    params: certFile, keyFile, caFile string, cfgIn *TransportConfig
    results: "*TCPTransport, error"
  - doc: |-
      newFifo returns an empty queue whose signal holds at most one pending
      wake-up: a consumer that drains with take after each wake-up misses none.
    name: newFifo
    results: "*fifo[T]"
    typeParams: T any
  - doc: |-
      newChunkWriter returns a writer that encodes every chunk bytes of decoded
      stream with codec and emits it to w; the last, partial chunk is emitted
      by Close.
    name: newChunkWriter
    params: w io.Writer, codec coretransform.BoundedDecompressor, chunk int
    results: "*chunkWriter"
  - doc: |-
      newChunkReader returns a reader decoding the chunk stream r, refusing a
      chunk larger than chunk and a stream whose decoded total exceeds limit.
    name: newChunkReader
    params: r io.Reader, codec coretransform.BoundedDecompressor, chunk, limit int64
    results: "*chunkReader"
  - doc: |-
      snapshotCorrupt is the SNAPSHOT_CORRUPT of a stream or a spool that
      failed a check, the check named in its why field.
    name: snapshotCorrupt
    params: why string
    results: error
  - doc: verifySnapshot decodes a whole snapshot and checks its sizes and digest.
    name: verifySnapshot
    params: r io.Reader, meta coreconsensus.SnapshotMetaValue, codec coretransform.BoundedDecompressor, limit int64
    results: error
  - doc: |-
      maxEncodedChunk is the largest encoded chunk a stream of decoded chunks
      of chunk bytes may hold, the bound chunkReader applies. chunk comes from
      a peer's offer: it is clamped to what a chunk header's u32 lengths can
      name, so the sum cannot overflow into a negative buffer size.
    name: maxEncodedChunk
    params: chunk int64
    results: int64
  - doc: |-
      alignedOffsetAt is the largest chunk boundary of the encoded prefix of
      size bytes r holds, each chunk at most maxChunk encoded bytes. The writer
      never emits an empty chunk, so a length of 0 ends the prefix: a region of
      zeros (a spool never synced, an allocation a crash left unwritten) reads
      as a run of empty chunks whose CRC of nothing is 0, and a resume used to
      continue past it, to fail only on the final digest (#422). The prefix is
      read one chunk at a time into a buffer of one chunk at most: read whole,
      the spool of a full snapshot was held in memory at once, on the event
      loop, and the resume allocated more than its size (#527).
    name: alignedOffsetAt
    params: r io.ReaderAt, size, maxChunk int64
    results: int64, error
  - doc: |-
      wholeChunkAt is where the chunk at off of the size bytes r holds ends,
      or -1 when no whole chunk starts there: an empty or oversized length, a
      chunk past the end, or a checksum that fails. buf holds the largest chunk
      accepted.
    name: wholeChunkAt
    params: r io.ReaderAt, off, size int64, buf []byte
    results: int64, error
  - name: Latest
    params: s coreconsensus.SnapshotStore
    results: coreconsensus.SnapshotHandle, error
  - doc: |-
      idNamesPosition reports whether a snapshot id of the form a cut writes,
      index then term on 20 digits each, names m's position. The .meta carries
      no checksum: a bit flipped in Position.Index was read as is, and the node
      erased its log, answered reads it had not applied and acknowledged past
      the leader's log (#546). An id of another form names no position and is
      not checked: a bit flipped in it already fails the file name.
    name: idNamesPosition
    params: m *coreconsensus.SnapshotMetaValue
    results: bool
  - doc: |-
      snapshotCodec is codecOf for a node whose own codec is own; an offline
      operation, which has none, passes nil and reads only the codecs this build
      links.
    name: snapshotCodec
    params: m *coreconsensus.SnapshotMetaValue, own coretransform.BoundedDecompressor
    results: coretransform.BoundedDecompressor, error
  - doc: |-
      linkedCodec is the bounded codec this build links under name, refused
      VERSION_UNSUPPORTED when there is none.
    name: linkedCodec
    params: name string
    results: coretransform.BoundedDecompressor, error
  - doc: payloadBytes is the payload es carries, what SnapshotEveryBytes counts.
    name: payloadBytes
    params: es []coreconsensus.EntryValue
    results: int64
  - doc: |-
      snapshotLimit is the largest snapshot a cut may write: this node's
      MaxSnapshotBytes, or the smallest limit a member announces when lower. A
      cut over it is refused and compacts nothing: published, no follower could
      be installed from it, and every node, this one included, failed to restore
      it at its next start and came up with no table — a rolling restart left
      the cluster with no leader (#512).
    name: snapshotLimit
    params: own int64, conf *coreconsensus.MembershipValue
    results: int64
  - doc: |-
      snapshotSize is the size m's limit bounds: the larger of its encoded and
      decoded sizes, the two the chunk writer holds to it.
    name: snapshotSize
    params: m *coreconsensus.SnapshotMetaValue
    results: int64
  - doc: |-
      nearLimit reports whether size has reached four fifths of limit, where
      Health warns that the cuts are about to be refused SNAPSHOT_TOO_LARGE.
    name: nearLimit
    params: size, limit int64
    results: bool
  - doc: noteUnmarked records dir in unmarked.
    name: noteUnmarked
    params: dir string
  - doc: |-
      refuseUnmarked refuses a data directory a node of this process stopped on
      with no marker: the process must exit, and the directory waits for a
      reboot.
    name: refuseUnmarked
    params: dir string
    results: error
  - doc: |-
      datasync makes a segment's written bytes durable with fdatasync(2): the
      segment is zero-filled at its full size, so there is no size to publish
      (D4, R1-09).
    name: datasync
    params: f *os.File
    results: error
  - doc: |-
      bootID is the kernel's boot identity: a STORAGE_FAILED marker carrying it
      refuses a restart in the same boot (R8-05).
    name: bootID
    results: string
  - doc: runtimeMarkerDir is the boot-scoped tmpfs path of the second marker.
    name: runtimeMarkerDir
    results: string
  - doc: |-
      syncDir makes a directory's entries durable: a rename or an unlink is
      published only once its directory is synced (D4 lifecycle steps 3 and 6).

      The directory is only read, so its Close loses nothing; a failure there is
      still reported when the sync succeeded, since it is the kernel saying the
      descriptor did not end cleanly on the filesystem being made durable.
    name: syncDir
    params: dir string
    results: err error
  - doc: |-
      transportMisconfigured refuses a TransportConfig, naming the field and
      the reason, never the value.
    name: transportMisconfigured
    params: field, why string
    results: error
  - doc: peerRejected refuses a peer, saying why without echoing what it sent.
    name: peerRejected
    params: why string
    results: error
  - doc: |-
      parseSAN reads the one URI SAN in its byte-exact canonical form (R7-25,
      R7-41): lowercase scheme, no user, port, query, fragment or trailing
      slash, the cluster in lowercase hex, the slot in [a-z0-9-]{1,32}.
    name: parseSAN
    params: c *x509.Certificate
    results: coreconsensus.ClusterID, string, error
  - doc: |-
      sanCluster reads the cluster of a URI SAN's host: exactly a ClusterID,
      in lowercase hex, so one cluster has one spelling.
    name: sanCluster
    params: host string
    results: coreconsensus.ClusterID, error
  - name: SAN
    params: cluster coreconsensus.ClusterID, slot string
    results: "*url.URL"
  - doc: |-
      spkiOf is the pin of a certificate: the SHA-256 of its
      SubjectPublicKeyInfo, which survives a renewal over the same key.
    name: spkiOf
    params: c *x509.Certificate
    results: "[32]byte"
  - name: SPKIOf
    params: c *x509.Certificate
    results: "[32]byte"
  - doc: |-
      clampDuration replaces a non-positive duration with its default: a zero
      timeout is "unset", never "no timeout" (ADR 0031, clamp half).
    name: clampDuration
    params: v *time.Duration, d time.Duration
  - name: NewTCPTransport
    params: cfg *TransportConfig
    results: "*TCPTransport, error"
  - doc: |-
      newTCPTransport builds the transport over id, or over the configuration's
      certificate source and roots when id is nil, then listens and launches
      the background accept goroutine, counted in t.wg, which ends when Close
      closes the listener.
    name: newTCPTransport
    params: cfg *TransportConfig, id *tlsid.Identity
    results: "*TCPTransport, error"
  - doc: |-
      acceptBackoff is the wait after a failed Accept that follows a wait of
      prev: acceptBackoffFirst first, doubled each time, at most
      acceptBackoffCeiling.
    name: acceptBackoff
    params: prev time.Duration
    results: time.Duration
  - doc: |-
      readFrame reads one frame into buf, grown only when the announced length
      needs it; ok is false on a read error or a length outside
      [minFrameBody, limit-4].
    name: readFrame
    params: r io.Reader, buf []byte, limit int
    results: "[]byte, bool"
  - doc: |-
      takeBatch adds to batch every frame already queued, up to maxSenderBatch,
      and releases their bytes from the peer's queue budget.
    name: takeBatch
    params: batch [][]byte, pc *peerConn
    results: "[][]byte"
  - doc: |-
      queuedFrame takes a frame already queued, without waiting. The queue is
      never closed, so a closed one reads as empty.
    name: queuedFrame
    params: pc *peerConn
    results: "[]byte, bool"
  - doc: |-
      watchLink reads an outbound connection until it ends, then closes its
      socket. The receiver writes nothing on a member's lane, so a read only
      returns once the peer closed its end or the sender closed the link: a
      write into a link the peer closed cleanly (a FIN) succeeded and its
      batch was lost to the peer's reset, while a closed socket fails the next
      write, which sendBatch dials again and resends (#553). It is the
      background goroutine redial launches per connection, counted in wg, and
      ends when the connection does; TLS's post-handshake messages are read
      and discarded on the way.
    name: watchLink
    params: wg *sync.WaitGroup, c connNetter
  - doc: |-
      indexMembers is the union of every group's admitted members, by id and
      by pinned key; a member without a pin is reachable by id only, so it can
      be dialled for nothing and admitted on nothing, and a key two members
      share admits neither.
    name: indexMembers
    params: groups map[coreconsensus.GroupID][]coreconsensus.MemberValue
    results: map[coreconsensus.NodeID]coreconsensus.MemberValue, map[[32]byte]coreconsensus.MemberValue
  - doc: |-
      writeChunk writes one length-prefixed chunk of the snapshot and JOIN
      lanes.
    name: writeChunk
    params: w io.Writer, b []byte
    results: error
  - doc: |-
      readChunk reads one length-prefixed chunk, refusing a length above limit
      before allocating it.
    name: readChunk
    params: r io.Reader, limit int
    results: "[]byte, error"
  - doc: |-
      encodeOffer is the wire form of a snapshot offer: its term, then the
      metadata.
    name: encodeOffer
    params: o coreconsensus.InstallOfferValue
    results: "[]byte"
  - doc: |-
      decodeOffer parses an offer; its snapshot id is the metadata's, never a
      second field that could disagree with it.
    name: decodeOffer
    params: b []byte
    results: coreconsensus.InstallOfferValue, error
  - doc: |-
      streamFrom copies the snapshot from the accepted offset and closes the
      write half, so the receiver sees the stream end. A Close failure of the
      source is reported only when the copy itself succeeded.
    name: streamFrom
    params: c closeWriter, open func(int64) (io.ReadCloser, error), off int64
    results: error
  - doc: |-
      installResult reads the receiver's verdict on the install, the last
      chunk of the stream.
    name: installResult
    params: c *tls.Conn
    results: error
  - doc: |-
      encodeJoin is the wire form of a JOIN: cluster, id, incarnation, the
      slot with its one-byte length, then the address to the end.
    name: encodeJoin
    params: r coreconsensus.JoinRequestValue
    results: "[]byte"
  - doc: |-
      decodeJoin parses a JOIN, refusing one too short for its fixed part or
      whose slot overruns it.
    name: decodeJoin
    params: b []byte
    results: coreconsensus.JoinRequestValue, bool
  - doc: |-
      encodeJoinV2 is the wire form of a JOIN on laneJoinV2: joinVersion2, the
      joiner's MaxSnapshotBytes as a little-endian u64, then encodeJoin's.
    name: encodeJoinV2
    params: r coreconsensus.JoinRequestValue
    results: "[]byte"
  - doc: |-
      decodeJoinOn parses a JOIN read on lane. One on laneJoinV2 of another
      version, or announcing a limit an int64 cannot hold, is refused: a
      version this build does not know is never read as one it knows (D18).
    name: decodeJoinOn
    params: lane byte, b []byte
    results: coreconsensus.JoinRequestValue, bool
  - doc: |-
      endedUnanswered reports whether err is a connection the peer ended: a
      close, or the reset of one closed over the JOIN it never read, as a member
      that serves no such lane does. A deadline is not: the peer may be
      answering, and a second JOIN would meet the slot's rate limit; nor is an
      answer cut short, nor one this transport refused, which are answers.
    name: endedUnanswered
    params: err error
    results: bool
  - doc: |-
      joinAnswerListsPeer reports whether a JOIN answer's membership lists the
      peer that sent it under the key it presented: an answer that does not is
      not the cluster's (review M4).
    name: joinAnswerListsPeer
    params: m coreconsensus.MembershipValue, spki [32]byte
    results: bool
  - doc: |-
      joinAnswerReason reads the reason after a JOIN_REFUSED's fixed part. ok
      is false when the answer carries none — an older member's, or one cut
      short — which the refusal then reports without a reason.
    name: joinAnswerReason
    params: b []byte
    results: reason string, ok bool
  - doc: |-
      boundUnacknowledged makes the kernel abort c once bytes written on it
      stay unacknowledged for d (TCP_USER_TIMEOUT): the next write then fails,
      and the sender dials again. Without it, a link whose peer vanished and
      came back — a partition healed, an address reconnected — keeps
      accepting small writes into a stream the kernel retransmits under an
      exponential backoff, and they reach the peer only at the next
      retransmission, tens of seconds later.
    name: boundUnacknowledged
    params: c net.Conn, d time.Duration
    results: error
imports:
  atomic: sync/atomic
  binary: encoding/binary
  bufio: bufio
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  coreconsensus: github.com/kitsunium/sdk/internal/core/app/consensus
  corelogger: github.com/kitsunium/sdk/internal/core/observe/logger
  coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
  coreotel: github.com/kitsunium/sdk/internal/core/observe/otel
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
  coretransform: github.com/kitsunium/sdk/internal/core/data/transform
  crc32: hash/crc32
  ed25519: crypto/ed25519
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  flock: github.com/kitsunium/sdk/internal/kernel/fs/flock
  fmt: fmt
  hash: hash
  hex: encoding/hex
  io: io
  level: github.com/kitsunium/sdk/internal/core/observe/logger/level
  maps: maps
  math: math
  net: net
  os: os
  raft: github.com/kitsunium/sdk/internal/service/app/consensus/raft
  rand: crypto/rand
  server: github.com/kitsunium/sdk/internal/service/net/server
  sha256: crypto/sha256
  slices: slices
  strconv: strconv
  strings: strings
  svctransform: github.com/kitsunium/sdk/internal/service/data/transform
  sync: sync
  syscall: syscall
  time: time
  tls: crypto/tls
  tlsid: github.com/kitsunium/sdk/internal/service/net/tlsid
  unicode: unicode
  url: net/url
  utf8: unicode/utf8
  wire: github.com/kitsunium/sdk/internal/service/app/consensus/wire
  x509: crypto/x509
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/consensus
  name: consensus
  purpose: "Package consensus is the Raft engine of ADR 0152 and everything it ships around the step function of package raft: the event loop that drives it, the storage actor that makes a write durable before any reply that depends on it leaves, the apply goroutine, and snapshots cut, sent and installed in checksummed chunks."
types:
  - fields:
      - name: entries
        type: "[]coreconsensus.EntryValue"
      - name: restore
        type: "*restoreReq"
      - name: save
        type: "*saveReq"
      - name: cut
        type: bool
      - doc: compact compacts the log again once a pin on it ended (sendPin).
        name: compact
        type: bool
    kind: struct
    name: applyItem
  - fields:
      - name: meta
        type: coreconsensus.SnapshotMetaValue
      - name: done
        type: chan error
    kind: struct
    name: restoreReq
  - fields:
      - name: w
        type: io.Writer
      - doc: op is the operator the save is recorded under.
        name: op
        type: coreconsensus.Operator
      - name: done
        type: chan saveRes
    kind: struct
    name: saveReq
  - fields:
      - name: meta
        type: coreconsensus.SnapshotMetaValue
      - name: err
        type: error
    kind: struct
    name: saveRes
  - kind: named
    name: ReadMode
    underlying: uint8
  - kind: named
    name: Durability
    underlying: uint8
  - fields:
      - doc: Cluster is the cluster the node belongs to; it must match the stamp.
        name: Cluster
        type: coreconsensus.ClusterID
      - doc: Group is the consensus group, 1 in v1; 0 is clamped to 1.
        name: Group
        type: coreconsensus.GroupID
      - doc: ID is the node; 0 takes the stamp's, any other value must match it.
        name: ID
        type: coreconsensus.NodeID
      - doc: Machine is the replicated program.
        name: Machine
        type: coreconsensus.StateMachine
      - doc: Durability must agree with Machine's siblings.
        name: Durability
        type: Durability
      - doc: |-
          Log, Snapshots and Transport are the node's ports; the caller owns
          them and closes them after the node.
        name: Log
        type: coreconsensus.LogStore
      - name: Snapshots
        type: coreconsensus.SnapshotStore
      - name: Transport
        type: coreconsensus.Transport
      - doc: Clock drives every timer; nil is clock.System.
        name: Clock
        type: clock.Timed
      - doc: |-
          InitialTiming is proposed at Bootstrap only; the committed contract
          rules.
        name: InitialTiming
        type: coreconsensus.TimingContractSpec
      - name: MaxBatchBytes
        type: int
      - name: MaxInflight
        type: int
      - name: MaxInflightBytes
        type: int
      - name: MaxEntryBytes
        type: int
      - name: MaxPendingBytes
        type: int64
      - name: MaxApplyLagBytes
        type: int64
      - name: RecentEntriesBytes
        type: int64
      - name: SnapshotEvery
        type: uint64
      - name: SnapshotTrailing
        type: uint64
      - name: PromoteLag
        type: uint64
      - name: SnapshotEveryBytes
        type: int64
      - name: MaxSnapshotBytes
        type: int64
      - name: MaxLogBytes
        type: int64
      - name: LogReserveBytes
        type: int64
      - doc: SnapshotCodec compresses snapshot chunks; nil is flate.
        name: SnapshotCodec
        type: coretransform.BoundedDecompressor
      - doc: SnapshotPausesApply says the state machine cannot cut cheaply.
        name: SnapshotPausesApply
        type: bool
      - doc: MinVoters is the floor a Remove may not cross.
        name: MinVoters
        type: int
      - doc: JoinAuthorizer decides a JOIN; without it every JOIN is refused.
        name: JoinAuthorizer
        type: coreconsensus.JoinAuthorizer
      - doc: HardCloseTimeout bounds HardClose.
        name: HardCloseTimeout
        type: time.Duration
      - doc: Reads selects the read mode.
        name: Reads
        type: ReadMode
      - doc: |-
          PreferredLeaders are the nodes a leader transfers to after an
          election when it is not one of them.
        name: PreferredLeaders
        type: "[]coreconsensus.NodeID"
      - doc: Seed draws the election timeouts; 0 draws one.
        name: Seed
        type: uint64
      - doc: |-
          Meter, Tracer and Logger receive D13's metrics, one span per Propose
          and the role, membership, snapshot and truncation events; nil turns
          each off. None of them changes a decision.
        name: Meter
        type: coremetrics.Meter
      - name: Tracer
        type: coretrace.Tracer
      - name: Logger
        type: corelogger.Logger
    kind: struct
    methods:
      - name: MemoryBudget
        params: peers int
        recv: c *Config
        results: int64
    name: Config
  - fields:
      - doc: SegmentBytes is the fixed size of a log segment; 0 is 64 MiB.
        name: SegmentBytes
        type: int64
      - doc: |-
          RuntimeDir is the boot-scoped directory of the second STORAGE_FAILED
          marker (R9-05); empty is /run/kitsunium-consensus on Linux, and
          kitsunium-consensus in the temporary directory elsewhere. It must
          outlive the process within the boot and be gone at the next one: a
          host tmpfs, or systemd's RuntimeDirectory= with
          RuntimeDirectoryPreserve=yes. The process must be able to create it
          and write in it: NewDataDirWith refuses CONSENSUS_MISCONFIGURED
          otherwise, naming the path.
        name: RuntimeDir
        type: string
    kind: struct
    name: DataDirOptions
  - fields:
      - name: dir
        type: string
      - name: opts
        type: DataDirOptions
      - name: mu
        type: sync.Mutex
      - name: lockf
        type: "*os.File"
      - name: log
        type: "*fileLog"
      - name: snaps
        type: "*fileSnapshots"
      - name: closed
        type: bool
      - name: inUse
        type: bool
      - doc: |-
          afterTruncate runs once TruncateAndStaySilent's truncation is
          durable, before the quarantine marker goes; an error ends the exit
          there, as a crash would. Only a test sets it.
        name: afterTruncate
        type: func() error
    kind: struct
    methods:
      - doc: |-
          open opens the log, then the snapshots; when the snapshots fail the log
          just opened is closed again, so a failed open holds nothing but the lock
          its caller releases.
        name: open
        recv: d *dataDir
        results: error
    name: dataDir
  - fields:
      - name: d
        type: "*dataDir"
    kind: struct
    methods:
      - name: Dir
        recv: d DataDir
        results: string
      - name: Log
        recv: d DataDir
        results: coreconsensus.LogStore
      - name: Snapshots
        recv: d DataDir
        results: coreconsensus.SnapshotStore
      - name: Close
        recv: d DataDir
        results: error
      - doc: |-
          offline guards an offline operation: refused while a live Node holds the
          directory (D11).
        name: offline
        recv: d DataDir
        results: error
      - doc: |-
          audit appends one line to the operator audit file and syncs it before the
          operation it records runs. Its Close is part of the write: a failure there
          is a storage failure like the sync's, never a detail dropped at return.
        name: audit
        params: op coreconsensus.Operator, what string
        recv: d DataDir
        results: err error
      - doc: |-
          wipeAndRejoin is the WipeAndRejoin exit: audited first, then the log is
          closed, its stores, stamp and markers are deleted, the directory synced,
          and the directory reopened empty.
        name: wipeAndRejoin
        params: op coreconsensus.Operator
        recv: d DataDir
        results: error
      - doc: removeStores deletes the log and the snapshots, whole.
        name: removeStores
        recv: d DataDir
        results: error
      - doc: |-
          removeStampAndMarkers deletes the stamp, the quarantine marker, the
          silence condition and every stop marker. A directory that could not be listed keeps its stamp and its
          markers: the wipe fails here rather than reopen a directory it did not
          clear.
        name: removeStampAndMarkers
        recv: d DataDir
        results: error
      - doc: |-
          interruptedInstall reports the install a crash interrupted after its
          snapshot was published — the install's commit point (D7) — and before the
          log was moved onto it: the newest snapshot that verifies, when it lies past
          the log's end or does not match the log's term at its index. The next
          start finishes it (finishInstall); Recover finishes it first and keeps it,
          or its forced entry followed the short log, the start erased it, and the
          node ran the snapshot's old voters and never led again (#506). It reads
          and writes nothing else.
        name: interruptedInstall
        recv: d DataDir
        results: coreconsensus.SnapshotMetaValue, bool, error
      - doc: |-
          finishInterruptedInstall moves the log onto the snapshot of an
          interrupted install, durably, as finishInstall does at a start: the log is
          replaced by that snapshot's base.
        name: finishInterruptedInstall
        params: m *coreconsensus.SnapshotMetaValue
        recv: d DataDir
        results: error
      - doc: |-
          verifySnapshotFile reads a published snapshot back offline and checks its
          sizes and digest, with the codec its metadata names.
        name: verifySnapshotFile
        params: m coreconsensus.SnapshotMetaValue
        recv: d DataDir
        results: err error
      - doc: |-
          planRecover decides what the new history keeps, checks the fence of every
          old voter left out against the configuration in force there, and audits
          the operation, before anything else is written. A first Recover keeps the
          verified suffix past the persisted commit; a resumed one keeps what the
          first decided, read from its marker. Its forced entry, durable or not, is
          never read as the old configuration, so the fences are asked for again.
        name: planRecover
        params: stamp *coreconsensus.StampValue, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, opt *RecoverOptions, intent *recoverIntent
        recv: d DataDir
        results: recoverPlan, error
      - doc: |-
          planAdopted decides the new identity's AdoptedFrom: the index up to
          which the kept entries were committed in the old history, the persisted
          commit or the base of a compacted log, all of the snapshot an
          interrupted install published. A resumed Recover's marker does not
          record it, and records none. It is recorded only when the history kept
          is at protocol version 2: the stamp that carries it is one a node of
          protocol 1 refuses to open (#509, D18).
        name: planAdopted
        params: p *recoverPlan
        recv: d DataDir
        results: error
      - doc: |-
          planKept decides the last index the new history keeps: the one a resumed
          Recover's marker recorded; the index of the snapshot an interrupted
          install published, which Recover finishes first (#506); else every entry
          this survivor holds whose chain verifies, not only those up to its
          persisted commit (issue #399).
        name: planKept
        params: p *recoverPlan, intent *recoverIntent
        recv: d DataDir
        results: error
      - doc: |-
          resumedKept is the index an interrupted Recover kept, refused when the log
          no longer holds it: the forced entry follows it, and nothing else may.
        name: resumedKept
        params: intent *recoverIntent
        recv: d DataDir
        results: uint64, error
      - doc: |-
          writeRecover writes the plan: the marker, unless it is already durable,
          then the forced entry, the new stamp, and the marker's removal. Between
          the forced entry and the stamp, the directory holds the new members'
          configuration under the OLD cluster's identity: started then, the node
          would run it in the old cluster, beside voters only fenced for the new
          one. The marker refuses that start (#405).
        name: writeRecover
        params: stamp *coreconsensus.StampValue, newCluster coreconsensus.ClusterID, members []coreconsensus.MemberValue, op coreconsensus.Operator, p *recoverPlan
        recv: d DataDir
        results: error
      - doc: |-
          endRecoveredSilence removes, durably and before STOP-RECOVER goes, the
          silence condition a TruncateAndStaySilent left: the new history is closed
          to the old terms it guarded, and a silent node never campaigns, so a
          survivor kept silent would be the one voter of its history and never be
          elected (#524). A crash before it is completed by the rerun, which finds
          the new stamp and goes through finishRecover.
        name: endRecoveredSilence
        recv: d DataDir
        results: error
      - doc: |-
          finishRecover completes a Recover interrupted after its new stamp, of
          which only the marker is left: confirmed and audited like the rest, then
          the marker is removed. Nothing else is decided again.
        name: finishRecover
        params: newCluster coreconsensus.ClusterID, opt *RecoverOptions
        recv: d DataDir
        results: error
      - doc: |-
          writeRecoverIntent publishes STOP-RECOVER, durably. Its first two lines
          are what Recover reads back; the third is what a refused start shows the
          operator, as the detail of STOP_MARKER_PRESENT.
        name: writeRecoverIntent
        params: in *recoverIntent
        recv: d DataDir
        results: error
      - doc: |-
          readRecoverIntent reads STOP-RECOVER: nil when there is none. A marker that
          cannot be read is a STORAGE_FAILED, and one that does not parse refuses
          Recover: neither is read as no Recover in progress.
        name: readRecoverIntent
        recv: d DataDir
        results: "*recoverIntent, error"
      - doc: |-
          clearRecoverIntent removes STOP-RECOVER once the new stamp is durable,
          and syncs the directory, so the removal is as durable as the stamp.
        name: clearRecoverIntent
        recv: d DataDir
        results: error
      - doc: |-
          adoptedEnd is the last index Recover keeps: the persisted commit, then
          every entry past it whose body and chain verify from the chain at that
          commit, up to the first broken link.

          The persisted commit lags the cluster's: a follower records a commit one
          round after its leader acknowledged it, and a batch caps the commit it
          carries. An entry past it may therefore be a write the old cluster
          committed and acknowledged; the old cluster is fenced, so the new history
          may adopt it, and cutting it would lose an acknowledged write. The price
          is that an entry whose client was told ENTRY_SUPERSEDED, or never
          answered, can be applied too: a duplicate an owner refuses by
          precondition, never a loss (ADR 0152 D17).

          An entry whose record no longer parses (LOG_CORRUPT) is a broken link and
          ends the suffix; any other read failure fails Recover closed.
        name: adoptedEnd
        params: commit uint64
        recv: d DataDir
        results: uint64, error
      - doc: |-
          adoptedPastTheBase is adoptedEnd over a log compacted past its persisted
          commit: a snapshot covers only applied, hence committed, entries, so the
          base first-1 is committed. The kept index used to stay at the persisted
          commit, below the log: the forced entry could not be appended there, and
          every rerun failed the same way (#422). The suffix is verified from the
          base when a snapshot ends there, else from the log's first entry, whose
          body is verified and whose link to the compacted entry before it no
          store can check. With neither, nothing the forced entry could chain to is
          known: Recover refuses, and says why.
        name: adoptedPastTheBase
        params: first, last uint64
        recv: d DataDir
        results: uint64, error
      - doc: |-
          verifiedEnd walks the log from end, the entry of term term and chain sum
          chain, and returns the last index whose link verifies.
        name: verifiedEnd
        params: end, last, term uint64, chain uint32
        recv: d DataDir
        results: uint64, error
      - doc: |-
          appendForced cuts the log back to hard.Commit, the last index Recover
          adopts, and appends, synced, the forced configuration entry of the new
          history, chained to the entry it follows and one term past any the log
          knew.
        name: appendForced
        params: hard *coreconsensus.HardState, members []coreconsensus.MemberValue, old *coreconsensus.MembershipValue, operator coreconsensus.Operator
        recv: d DataDir
        results: error
      - doc: |-
          chainAt is the chain sum and term of the committed entry commit: from the
          log when it still holds it, else from the newest snapshot when that one
          ends exactly there, else zero.
        name: chainAt
        params: commit, first uint64
        recv: d DataDir
        results: uint32, uint64, error
      - doc: |-
          spoolRestored copies exactly meta.EncodedSize bytes of r into a fresh
          spool and commits it. A stream of any other length is refused and its
          spool aborted, the abort's failure kept beside the refusal.
        name: spoolRestored
        params: r io.Reader, meta *coreconsensus.SnapshotMetaValue
        recv: d DataDir
        results: error
      - doc: |-
          verifyRestored decodes the published copy and checks it against meta. A
          copy that fails is unpublished, or the failure to do so is reported with
          it; the handle's Close failure is reported only when the copy passed.
        name: verifyRestored
        params: meta *coreconsensus.SnapshotMetaValue, codec coretransform.BoundedDecompressor, maxDecoded int64
        recv: d DataDir
        results: error
      - doc: |-
          truncateAndStaySilent truncates the log at the quarantined damage and
          PERSISTS, before it returns, the silence condition: the highest term any
          readable record of the log names, and the truncation point (R3-09,
          R4-03). Its cost is stated in the ADR: with one of the two other nodes
          down, no leader can exist and the node stays silent until the third
          returns.

          The term is read before anything is changed and persisted before the
          truncation, taken at least as high as a condition a crashed run already
          persisted: a rerun after a crash past the truncation reads a log whose
          dropped records no longer name their term, and a lower term would let the
          node vote again in the term of a vote the truncation dropped (#418).
        name: truncateAndStaySilent
        recv: d DataDir
        results: error
      - doc: |-
          quarantinePoint reads where the quarantine marker places the damage. A
          marker that is missing or unreadable refuses the exit: nothing else
          records where the damage is, and the truncation must start exactly there.
        name: quarantinePoint
        recv: d DataDir
        results: uint64, int64, error
      - doc: |-
          reopenSilenced reopens the truncated log and fills in the silence
          condition's index, its end, durably.
        name: reopenSilenced
        params: maxTerm uint64
        recv: d DataDir
        results: error
    name: DataDir
  - doc: |-
      cause is the text of a storage failure's cause. It never travels as an
      error of its own: storageFailed records it in a field of a
      STORAGE_FAILED, the only error a caller matches on.
    kind: named
    methods:
      - doc: |-
          Error returns the cause's text unchanged, so the field storageFailed
          records reads exactly as the constant was written.
        name: Error
        recv: c cause
        results: string
    name: cause
    underlying: string
  - fields:
      - name: kind
        type: uint8
      - name: end
        type: bool
      - name: batch
        type: uint64
      - name: term
        type: uint64
      - name: index
        type: uint64
      - name: ekind
        type: uint8
      - name: ever
        type: uint32
      - name: body
        type: uint32
      - name: chain
        type: uint32
      - name: data
        type: "[]byte"
      - name: "off"
        type: int64
      - name: length
        type: int
    kind: struct
    name: record
  - doc: |-
      checkpoint is the record that opens every segment: the hard state, the
      effective last entry before it, the compaction point and the next batch.
    fields:
      - name: hs
        type: coreconsensus.HardState
      - name: prevIndex
        type: uint64
      - name: prevTerm
        type: uint64
      - name: compact
        type: uint64
      - name: compactTerm
        type: uint64
      - name: nextBatchSeq
        type: uint64
    kind: struct
    methods:
      - doc: |-
          encode is the checkpoint record's payload: eight little-endian uint64s,
          in the order decodeCheckpoint reads them back.
        name: encode
        recv: c checkpoint
        results: "[]byte"
    name: checkpoint
  - doc: "slot locates one retained entry: on disk once synced, in memory before."
    fields:
      - name: seg
        type: uint64
      - name: "off"
        type: int64
      - name: term
        type: uint64
      - name: mem
        type: "*coreconsensus.EntryValue"
    kind: struct
    name: slot
  - fields:
      - name: "n"
        type: uint64
      - name: f
        type: "*os.File"
      - name: size
        type: int64
    kind: struct
    name: segment
  - doc: |-
      fileLog is the shipped segmented LogStore. One writer, many readers;
      appended entries are readable before they are synced (D4).
    fields:
      - name: dir
        type: string
      - name: segBytes
        type: int64
      - name: mu
        type: sync.RWMutex
      - name: segs
        type: "[]*segment"
      - name: "off"
        type: int64
      - name: batch
        type: uint64
      - name: pending
        type: "[]byte"
      - name: pendingLast
        type: int
      - name: first
        type: uint64
      - name: slots
        type: "[]slot"
      - name: prevTerm
        type: uint64
      - name: hs
        type: coreconsensus.HardState
      - name: compact
        type: uint64
      - name: compactTerm
        type: uint64
      - name: stamp
        type: coreconsensus.StampValue
      - doc: |-
          dur is the state the synced records describe: a rotation's checkpoint
          is written from it, never from the pending batch it precedes.
        name: dur
        type: checkpoint
      - doc: prep is the next segment, being prepared in the background.
        name: prep
        type: "*prepared"
      - doc: tailsTruncated counts the torn tails recovery truncated.
        name: tailsTruncated
        type: int64
      - doc: |-
          syncedAtOpen counts the segments recovery made durable before
          trusting them; a test reads it.
        name: syncedAtOpen
        type: int
      - name: failed
        type: error
      - name: refuse
        type: error
      - name: dd
        type: "*dataDir"
      - doc: |-
          runDir is the boot-scoped directory of the second STORAGE_FAILED
          marker (R9-05): DataDirOptions.RuntimeDir, else runtimeMarkerDir. A
          test may point it elsewhere after the open.
        name: runDir
        type: string
      - doc: |-
          afterSeal runs once a rotation's seal is durable and before the next
          segment is published. Only the dm-crypt lane sets it, to cut power in
          that window; it is nil otherwise.
        name: afterSeal
        type: func()
      - doc: |-
          duringSync runs between each write of a batch and its fdatasync, the
          lock released: twice for a batch of several records. Only a test sets
          it.
        name: duringSync
        type: func()
      - doc: |-
          fill replaces zeroFrom when a test sets it, to fail as a full disk
          does; nil otherwise.
        name: fill
        type: func(f *os.File, off, size int64) error
      - doc: |-
          occupied is the bytes the segments occupy, kept beside segs wherever
          a segment is added or dropped, so the event loop reads it without mu:
          a rotation holds mu across an fsync (D5b).
        name: occupied
        type: atomic.Int64
      - doc: |-
          wmu serialises the writers. A sync holds it, not mu, across its
          write and fdatasync, so readers do not wait for the disk (review of
          PR #301, L6).
        name: wmu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          acquire marks the data directory held by a Node, refusing DATA_DIR_IN_USE
          while another Node holds it or it was closed; a log opened without a
          DataDir holds nothing and always succeeds.
        name: acquire
        recv: l *fileLog
        results: error
      - doc: |-
          release ends the hold acquire took, so the directory may be closed or
          operated on offline again.
        name: release
        recv: l *fileLog
      - doc: |-
          runtimeMarker is the boot-scoped path of the log's marker for reason,
          named by a digest of the data directory so two directories on one host
          never share a marker.
        name: runtimeMarker
        params: reason string
        recv: l *fileLog
        results: string
      - doc: |-
          markStopEach writes the stop's marker: STORAGE_FAILED in TWO places, the
          data directory and a boot-scoped path, each holding the boot id; the final
          stops in the data directory only. It returns the failure of each place:
          the data directory's, and the boot-scoped one's (nil for a stop that writes no
          boot-scoped marker). R9-05 lets a node stop with one marker of the two,
          but not silently: the caller reports the place it could not write.
        name: markStopEach
        params: code errs.Code, detail string
        recv: l *fileLog
        results: dirErr, runErr error
      - doc: |-
          checkMarkers refuses a start while a marker applies (D4): a
          STORAGE_FAILED marker of the CURRENT boot in either place, or any other
          stop marker, which only an operator clears.
        name: checkMarkers
        recv: l *fileLog
        results: error
      - doc: |-
          markerPaths is every place a stop marker of this log may be: the
          boot-scoped STORAGE_FAILED marker first, then each published STOP- file of
          the data directory listing ents, a half-written .tmp excluded.
        name: markerPaths
        params: ents []os.DirEntry
        recv: l *fileLog
        results: "[]string"
      - doc: logDir is the directory holding the segments.
        name: logDir
        recv: l *fileLog
        results: string
      - doc: |-
          prepareOpen is what an open does before it reads the markers: the
          boot-scoped directory resolved and probed (#562), the log directory made
          and the stamp read.
        name: prepareOpen
        recv: l *fileLog
        results: error
      - doc: |-
          recover runs the written recovery procedure (D4, R8-02, R9-01, R9-03):
          scan every segment, classify every hole, and only then change anything.
        name: recover
        recv: l *fileLog
        results: error
      - doc: |-
          segmentNumbers lists the published segments, sorted, deleting on the way
          every .tmp: only an INCOMPLETE .tmp exists, one that never reached its
          rename (R2-05). A name that is not exactly a segment's is ignored.
        name: segmentNumbers
        recv: l *fileLog
        results: "[]uint64, error"
      - doc: |-
          scanSegments reads and parses every segment in order. A segment is judged
          as soon as it is read, so the first damage found is the one quarantined,
          and nothing after it is read.
        name: scanSegments
        params: nums []uint64
        recv: l *fileLog
        results: "[]*scanned, error"
      - doc: |-
          scanSegment reads segment n and parses its records up to the first hole,
          or through its seal: a sealed segment is read up to its sealed length
          (R9-02).
        name: scanSegment
        params: n uint64
        recv: l *fileLog
        results: "*scanned, error"
      - doc: |-
          checkBatchSequence quarantines a log whose batch sequences are not
          contiguous across the whole log (R9-01).
        name: checkBatchSequence
        params: segs []*scanned
        recv: l *fileLog
        results: error
      - doc: |-
          trimTornTail decides the fate of a hole in the last segment: a torn tail
          is dropped from the records, its truncation point kept for positionTail
          to zero and sync before any new record (R8-03); any other hole is
          quarantined.
        name: trimTornTail
        params: last *scanned
        recv: l *fileLog
        results: error
      - doc: |-
          replay builds the effective log: it applies every segment's checkpoint
          and records in order, truncate records included, and judges continuity
          on the result (R8-01).
        name: replay
        params: segs []*scanned
        recv: l *fileLog
        results: error
      - doc: |-
          applyCheckpoint applies the checkpoint opening segment seg. The first
          segment's sets the log's start; every later one must continue the log,
          and as it was written at activation with the CURRENT hard state, it is
          the newest when read in order.
        name: applyCheckpoint
        params: first bool, seg uint64, cp *checkpoint
        recv: l *fileLog
        results: error
      - doc: |-
          applyRecord applies one record of segment seg to the log being rebuilt.
          An entry out of sequence is quarantined; a record kind this build does
          not know, or a hard state of another length, is a newer layout and stops
          the open VERSION_UNSUPPORTED — skipped, it lost what a newer build wrote
          there (D18, #511). A seal changes nothing.
        name: applyRecord
        params: seg uint64, r *record
        recv: l *fileLog
        results: error
      - doc: |-
          applyEntry appends an entry record's slot, quarantining one out of
          sequence.
        name: applyEntry
        params: seg uint64, r *record
        recv: l *fileLog
        results: error
      - doc: |-
          applyHardState applies a hard-state record; one of another length is a
          newer layout (#511).
        name: applyHardState
        params: seg uint64, r *record
        recv: l *fileLog
        results: error
      - doc: |-
          applyCompactRecord applies a compact record where it stands, as
          compactPrefixAt applied it: the entries through index go, the log starts
          past it, and the term before the log is the record's, which is the
          compaction point's term past the log's end too. Only noted, and applied
          once the whole replay was done, a compaction past the end left the log
          starting below it, and the first entry appended after it — the next
          index — read as out of sequence: every node that caught up by a snapshot
          install and appended was quarantined at its next restart (#516).
        name: applyCompactRecord
        params: index, term uint64
        recv: l *fileLog
      - doc: |-
          applyTruncate applies a truncate record at index. One that truncates into
          a dropped segment removes entries that are gone with it, and a later
          compact record covers what follows.
        name: applyTruncate
        params: index uint64
        recv: l *fileLog
      - doc: |-
          applyCompaction drops the retained entries the compaction point covers,
          keeping the term of the last one dropped as the term before the log.
        name: applyCompaction
        recv: l *fileLog
      - doc: |-
          openSegments opens every scanned segment for reading and writing, in
          order. A segment that fails to open is a STORAGE_FAILED; those already
          opened stay in l.segs for Close.
        name: openSegments
        params: segs []*scanned
        recv: l *fileLog
        results: error
      - doc: |-
          syncAtOpen makes durable everything recovery is about to trust, before
          anything is acknowledged from it. A process killed between a batch's write
          and its fdatasync leaves that batch in the page cache, complete with its
          end record: a restart in the same boot reads it as written, and would
          acknowledge entries no device holds, which a power cut within the
          write-back delay then loses. The same holds for a rename or an unlink
          whose directory sync never ran. PostgreSQL syncs its data directory before
          crash recovery for this reason (SyncDataDirectory). A write-back that
          failed after the process died is reported to this fresh descriptor too
          (errseq, Linux 4.13), so a failure here is STORAGE_FAILED, never a log
          trusted from pages the disk refused.
        name: syncAtOpen
        recv: l *fileLog
        results: error
      - doc: |-
          positionTail sets the write offset in the last segment: at the torn
          tail's truncation point, zeroing and syncing what lies past it unless it
          is zero already, else right after the last valid record.
        name: positionTail
        params: last *scanned, tail *segment
        recv: l *fileLog
        results: error
      - doc: quarantine writes and syncs the marker FIRST and modifies nothing else.
        name: quarantine
        params: seg uint64, off int64, why string
        recv: l *fileLog
        results: error
      - doc: |-
          createSegment publishes segment n: zero-filled tmp, checkpoint, fsync,
          rename, fsync of the directory (D4 lifecycle steps 1 to 3).
        name: createSegment
        params: n uint64, cp *checkpoint
        recv: l *fileLog
        results: error
      - doc: |-
          segmentFile is the zero-filled .tmp of segment n at size: the prepared
          one when it is that segment at that size, else one created and zeroed now,
          on the writer's path, where a failure stops the log.
        name: segmentFile
        params: n uint64, size int64, tmp string
        recv: l *fileLog
        results: "*os.File, error"
      - doc: |-
          zeroFill is the function that zero-fills a segment: zeroFrom, unless a
          test set fill to fail as a full disk does. It is read on the writer's
          path, before any goroutine it hands it to starts.
        name: zeroFill
        recv: l *fileLog
        results: func(f *os.File, off, size int64) error
      - doc: |-
          prepare launches the background goroutine that zero-fills segment n off
          the writer's path. The goroutine ends on its own once the .tmp is zeroed
          or has failed, closing done as it returns: done is created here and
          closed by that goroutine alone, exactly once, and takePrepared and Close
          only ever wait on it.
        name: prepare
        params: n uint64, size int64
        recv: l *fileLog
      - doc: |-
          takePrepared waits for the prepared segment n, when it is the one wanted
          at that size; nil means prepare it now.
        name: takePrepared
        params: n uint64, size int64
        recv: l *fileLog
        results: "*os.File"
      - doc: |-
          rotate seals the current segment in its own synced batch, then publishes
          the next one with the CURRENT hard state. It runs between batches only
          (R8-04). need is the size of the batch that did not fit.
        name: rotate
        params: need int
        recv: l *fileLog
        results: error
      - doc: |-
          publishNext publishes the segment after the current one, whose seal is
          durable, with the CURRENT hard state and the next batch number.
        name: publishNext
        params: need int
        recv: l *fileLog
        results: error
      - doc: |-
          termLocked is the term of entry i, the term before the log for first-1,
          and 0 outside the log; the caller holds mu.
        name: termLocked
        params: i uint64
        recv: l *fileLog
        results: uint64
      - doc: |-
          usable is why the log refuses a call: its quarantine first, then the
          failure that stopped it, nil while it is healthy.
        name: usable
        recv: l *fileLog
        results: error
      - doc: Entries implements LogReader.
        name: Entries
        params: lo, hi uint64, maxBytes int, dst []coreconsensus.EntryValue
        recv: l *fileLog
        results: "[]coreconsensus.EntryValue, error"
      - doc: |-
          readEntry reads the synced entry s locates from its segment. A record
          that does not parse as an entry there is LOG_CORRUPT: the log disagrees
          with what it recorded.
        name: readEntry
        params: s slot
        recv: l *fileLog
        results: coreconsensus.EntryValue, error
      - doc: Term implements LogReader.
        name: Term
        params: index uint64
        recv: l *fileLog
        results: uint64, error
      - doc: Bounds implements LogReader; a refused log is empty.
        name: Bounds
        recv: l *fileLog
        results: first, last uint64
      - doc: |-
          add appends r to the pending batch and remembers it as the batch's last
          record, the one Sync flags end-of-batch.
        name: add
        params: r *record
        recv: l *fileLog
      - doc: "Append implements LogStore: entries and the hard state in ONE batch."
        name: Append
        params: entries []coreconsensus.EntryValue, hs *coreconsensus.HardState
        recv: l *fileLog
        results: error
      - doc: |-
          Sync implements LogStore: the pending batch is written, its last record
          flagged end-of-batch, and made durable by two fdatasyncs, the end record
          written only once the rest is durable (writeBatch). A failure is final:
          the log refuses every later call (D4, fsyncgate).
        name: Sync
        recv: l *fileLog
        results: error
      - doc: |-
          writeBatch makes the pending batch durable at l.off in segment cur in two
          steps: every record before the last, synced, then the last one, which
          carries the end-of-batch flag, synced (D16, #417). A power cut during one
          fdatasync may persist any subset of its dirty pages, the end record's
          without an earlier one's; with one sync per batch that left a valid end
          record after a hole in a batch never acknowledged, which recovery must
          quarantine. Written last and on its own, a valid end record proves that
          the rest of its batch was durable before it, so a hole before it is
          damage to synced data, and nothing else.
        name: writeBatch
        params: cur *segment
        recv: l *fileLog
        results: error
      - doc: writeAndSync writes b at off in segment cur and fdatasyncs it.
        name: writeAndSync
        params: cur *segment, b []byte, off int64
        recv: l *fileLog
        results: error
      - doc: |-
          settleBatch records the pending batch, now synced in segment seg, as
          durable: its entries are read from disk from here on, the write offset
          moves past it, and the next batch gets the next sequence number. The
          caller holds mu.
        name: settleBatch
        params: seg uint64
        recv: l *fileLog
      - doc: |-
          relocate points every slot the pending batch carried at its record in
          segment seg, now that the batch is synced there, and releases its
          in-memory copy. A slot replaced since, by another term, is left alone.
        name: relocate
        params: seg uint64
        recv: l *fileLog
      - doc: |-
          markDurable records the state the synced records now describe, which a
          rotation's checkpoint is written from.
        name: markDurable
        recv: l *fileLog
      - doc: restamp rewrites the batch sequence of every pending record.
        name: restamp
        params: batch uint64
        recv: l *fileLog
      - doc: |-
          TruncateSuffix implements LogStore: ONE truncate record, nothing else
          (R7-12, R8-01, R8-03).
        name: TruncateSuffix
        params: from uint64
        recv: l *fileLog
        results: error
      - doc: |-
          CompactPrefix implements LogStore: a compact record, then whole segments
          whose entries the next checkpoint already supersedes are deleted, as a
          prefix, with a directory fsync after the unlinks (D4 step 6). Past the end
          of the log there is no entry to read the compaction point's term from, and
          a guessed one is a log-matching check answered falsely: that compaction is
          refused, and the engine makes it with compactPrefixAt (#415).
        name: CompactPrefix
        params: through uint64
        recv: l *fileLog
        results: error
      - doc: |-
          compactPrefixAt is CompactPrefix with the term of the compaction point as
          the caller knows it, 0 when it does not. The log's own term wins where it
          holds the entry, and must agree with a known one; past its end the
          caller's term is recorded, and an unknown one refuses the compaction.
        name: compactPrefixAt
        params: through, term uint64
        recv: l *fileLog
        results: error
      - doc: |-
          dropSegmentsLocked deletes the prefix of sealed segments whose every
          entry is at or below the compaction point. It runs after a sync, so the
          compact record and the next checkpoint are durable first.
        name: dropSegmentsLocked
        recv: l *fileLog
        results: error
      - doc: |-
          supersedes reports whether next's checkpoint starts at or below the
          compaction point, so the segment before it holds nothing the log still
          needs. A checkpoint that does not parse supersedes nothing.
        name: supersedes
        params: next *segment
        recv: l *fileLog
        results: bool, error
      - doc: |-
          retainsEntryIn reports whether a retained entry still lives in segment
          seg.
        name: retainsEntryIn
        params: seg uint64
        recv: l *fileLog
        results: bool
      - doc: |-
          removeFirstSegment closes and unlinks the oldest segment; the caller
          syncs the directory once every removal is done.
        name: removeFirstSegment
        recv: l *fileLog
        results: error
      - doc: HardState implements LogStore.
        name: HardState
        recv: l *fileLog
        results: coreconsensus.HardState, error
      - doc: Stamp implements LogStore.
        name: Stamp
        recv: l *fileLog
        results: coreconsensus.StampValue, error
      - doc: "WriteStamp implements LogStore: durable on return."
        name: WriteStamp
        params: s coreconsensus.StampValue
        recv: l *fileLog
        results: error
      - doc: |-
          Close implements LogStore; the DataDir closes it. Every segment is closed
          whatever the one before it answered, and the first failure is reported: a
          Close can be where a deferred write-back error surfaces, and a log that
          swallowed it would report a clean shutdown of a disk that failed.
        name: Close
        recv: l *fileLog
        results: error
      - doc: |-
          logStats reports the bytes the segments occupy, the free bytes of their
          filesystem, and the torn tails truncated at open, for D13's gauges.
        name: logStats
        recv: l *fileLog
        results: bytes, free, tails int64
      - doc: |-
          logBytes is the bytes the published segments occupy: what the no-space
          alarm's quota counts (D17). It takes no lock: the event loop reads it at
          every tick.
        name: logBytes
        recv: l *fileLog
        results: int64
      - doc: |-
          freeBytes is the free space of the log's filesystem, -1 where it is not
          read.
        name: freeBytes
        recv: l *fileLog
        results: int64
      - doc: |-
          restartAt makes the empty log start after the restored snapshot, with a
          hard state one term past it, durably.
        name: restartAt
        params: meta *coreconsensus.SnapshotMetaValue
        recv: l *fileLog
        results: error
      - doc: resetTo makes an empty log start after (index, term).
        name: resetTo
        params: index, term uint64
        recv: l *fileLog
        results: error
      - doc: |-
          silence reads the persisted silence condition, if any. An index of 0, a
          crash before it was filled in, is the end of the log, written back now.
          An unreadable condition is the safe side: silent past the end, with the
          reason it could not be read in unreadable, for the node to report.

          The write-back is durable before the node starts, or the node does not
          start (D4: a failed write stops it): a condition left at 0 would be filled
          in again at the next start, from a log that may have grown since, and the
          silence would end at another index than the one this start obeyed.
        name: silence
        recv: l *fileLog
        results: term, index uint64, unreadable, err error
      - doc: endSilence removes the silence condition durably.
        name: endSilence
        recv: l *fileLog
        results: error
      - doc: |-
          probeRuntimeDir creates the boot-scoped directory and writes, then
          removes, a file there. A directory the process cannot write in left every
          STORAGE_FAILED stop with one marker of two, and with none when the data
          directory's failed too: the start is refused while nothing has been
          written (R9-05, #562).
        name: probeRuntimeDir
        recv: l *fileLog
        results: error
      - doc: |-
          storageFailedThisBoot is the STOP_MARKER_PRESENT of a STORAGE_FAILED
          marker of the current boot, in either place, nil when none applies. In
          that boot the page cache may still show bytes whose fdatasync failed:
          nothing writes to the log, the snapshots or the stamp until a reboot, or
          a recovery, a Recover or an Init writes durable data after pages the disk
          does not hold, and the reboot that clears the marker quarantines the log
          (ADR 0152 "fail closed before any mutation", #563).
        name: storageFailedThisBoot
        recv: l *fileLog
        results: error
      - doc: |-
          markerApplies is checkMarkers' reading of the markers, limited to the
          STORAGE_FAILED ones when storageOnly is set.
        name: markerApplies
        params: storageOnly bool
        recv: l *fileLog
        results: error
    name: fileLog
  - doc: scanned is one segment as recovery read it, before anything is changed.
    fields:
      - name: "n"
        type: uint64
      - name: data
        type: "[]byte"
      - name: recs
        type: "[]record"
      - name: hole
        type: int64
      - name: sealed
        type: bool
      - name: trimmed
        type: int64
    kind: struct
    name: scanned
  - doc: |-
      prepared is the next segment, zero-filled in the background as a .tmp
      while the current one fills (R3-24, R4-01). It is never published early:
      recovery deletes any .tmp, and its checkpoint is written at activation.
    fields:
      - name: "n"
        type: uint64
      - name: size
        type: int64
      - name: done
        type: chan struct{}
      - name: f
        type: "*os.File"
      - name: err
        type: error
    kind: struct
    name: prepared
  - doc: |-
      fileSnapshots is the shipped SnapshotStore: ADR 0056's publication rules
      applied to a stream (D4). A snapshot is spooled to <id>.spool, synced,
      renamed to <id>.snap, and published by its <id>.meta, written atomically
      last; a .snap without its .meta is not a snapshot.
    fields:
      - name: dir
        type: string
      - name: mu
        type: sync.Mutex
      - name: pins
        type: map[string]int
      - doc: |-
          writing counts the sinks open on each id's spool: a spool a sink
          still writes to is never swept from under it.
        name: writing
        type: map[string]int
      - doc: owners is the one sink each id's spool belongs to (#547).
        name: owners
        type: map[string]*fileSink
      - doc: |-
          afterPublish, when set by a test, runs in Create once its sink owns
          the id's spool and before the sink it took the spool from is
          superseded (#582).
        name: afterPublish
        type: func(id string)
    kind: struct
    methods:
      - doc: |-
          sweepSpools removes every receive spool but keep's and those a sink still
          writes to. A transfer cut mid-stream keeps its spool so that the same
          offer resumes; once another id is accepted, or the directory reopened, no
          offer of the old id is awaited any more, and its spool — up to one whole
          snapshot — stayed on the data disk for good, one more at every such cut
          (#527).
        name: sweepSpools
        params: keep string
        recv: s *fileSnapshots
        results: error
      - doc: |-
          orphanSpools is the names of the spools among ents that are neither
          keep's nor written to by a sink. The caller holds s.mu.
        name: orphanSpools
        params: ents []os.DirEntry, keep string
        recv: s *fileSnapshots
        results: "[]string"
      - doc: |-
          Create implements SnapshotStore: an existing spool of that id resumes from
          its last whole, checksummed chunk (R8-21), found reading the spool one
          chunk at a time. Every other spool no sink writes to is removed:
          accepting this id abandons them (#527).
        name: Create
        params: id string, meta coreconsensus.SnapshotMetaValue
        recv: s *fileSnapshots
        results: coreconsensus.SnapshotSink, int64, error
      - doc: |-
          claim makes sink the owner of its id's spool and returns the sink it took
          the spool from, if any. A spool another sink still writes to is never
          shared: Create supersedes that sink, its handle closed, before it opens
          the spool, and writes it from offset 0. Shared, a stale install's Abort
          unlinked the spool the current leader's install of the same id wrote,
          whose Commit then failed STORAGE_FAILED and stopped a node with a
          healthy disk (#547). A sink whose open then fails owns nothing once
          closed. The caller holds s.mu, never the old sink's mu: supersede waits
          for that one outside s.mu (#582).
        name: claim
        params: sink *fileSink
        recv: s *fileSnapshots
        results: "*fileSink"
      - doc: |-
          published reads the snapshot a directory entry named name publishes. ok
          is false for anything that is not a complete snapshot: another file, a
          .meta that does not parse, names another id or a position its id does
          not name (#546), or one whose .snap is missing. Such an entry is
          skipped: it is a publication a crash interrupted or a .meta that rotted,
          not a snapshot to restore from. A .meta or a .snap that is there
          but cannot be read is neither: it is an I/O failure, and it is reported,
          so that a listing never reads a failing disk as "no snapshot".
        name: published
        params: name string
        recv: s *fileSnapshots
        results: coreconsensus.SnapshotMetaValue, bool, error
      - doc: "List implements SnapshotStore: complete snapshots, newest first."
        name: List
        recv: s *fileSnapshots
        results: "[]coreconsensus.SnapshotMetaValue, error"
      - doc: "Open implements SnapshotStore: pinned until Close."
        name: Open
        params: id string
        recv: s *fileSnapshots
        results: coreconsensus.SnapshotHandle, error
      - doc: |-
          Remove implements SnapshotStore: refused while a handle is open. The meta
          goes first, so a crash leaves no published snapshot without its bytes.
        name: Remove
        params: id string
        recv: s *fileSnapshots
        results: error
    name: fileSnapshots
  - fields:
      - name: s
        type: "*fileSnapshots"
      - name: id
        type: string
      - name: f
        type: "*os.File"
      - name: meta
        type: coreconsensus.SnapshotMetaValue
      - name: done
        type: sync.Once
      - doc: |-
          mu orders the sink's writes, Commit, Abort and release against a
          Create of the same id that supersedes it.
        name: mu
        type: sync.Mutex
      - doc: |-
          superseded is set once another sink owns the id's spool: this sink's
          handle is closed then, and it never touches the spool again (#547).
        name: superseded
        type: bool
    kind: struct
    methods:
      - doc: |-
          supersede closes the sink's handle and marks it superseded; it waits for
          a write, Commit, Abort or Create in progress. A sink whose Create failed
          before its open has no handle. The caller holds no lock but its own
          sink's mu.
        name: supersede
        recv: k *fileSink
      - doc: |-
          closed counts the sink's spool as no longer written to, and the sink as
          no longer its owner, once.
        name: closed
        recv: k *fileSink
      - doc: |-
          Write appends p to the spool file; nothing is durable until Commit syncs
          it. A superseded sink writes nothing.
        name: Write
        params: p []byte
        recv: k *fileSink
        results: int, error
      - doc: |-
          Commit publishes the spool in ADR 0056's order: the encoded size is
          checked, the spool synced and closed, renamed to <id>.snap, and the
          <id>.meta written atomically LAST, so a crash at any step leaves no
          published snapshot without its bytes. A superseded sink, or a spool gone
          from under its sink, is a SNAPSHOT_CORRUPT the leader answers with a new
          offer, never this node's disk failing (#547). A Create of the same id
          waits for a Commit in progress.
        name: Commit
        params: final coreconsensus.SnapshotMetaValue
        recv: k *fileSink
        results: error
      - doc: |-
          release closes the spool's handle and keeps the spool for a resume. A
          failed Close is abandoned: the resume reads back only the chunks whose
          checksums hold, so nothing it could say changes what is kept.
        name: release
        recv: k *fileSink
      - doc: |-
          Abort closes and deletes the spool; a spool already gone is not a
          failure, any other removal failure is a STORAGE_FAILED. A spool another
          sink superseded is that sink's and stays (#547).
        name: Abort
        recv: k *fileSink
        results: error
    name: fileSink
  - doc: spoolFile is what a resume needs of a spool's file.
    kind: named
    name: spoolFile
    underlying: |-
      interface {
      	io.ReaderAt
      	io.Seeker
      	Stat() (os.FileInfo, error)
      	Truncate(size int64) error
      }
  - fields:
      - name: ""
        role: embedded
        type: "*os.File"
      - name: s
        type: "*fileSnapshots"
      - name: meta
        type: coreconsensus.SnapshotMetaValue
      - name: once
        type: sync.Once
    kind: struct
    methods:
      - doc: Meta returns the metadata read from the snapshot's .meta at Open.
        name: Meta
        recv: h *fileHandle
        results: coreconsensus.SnapshotMetaValue
      - doc: |-
          Close unpins the snapshot and closes its file exactly once; a second
          Close returns nil and releases nothing.
        name: Close
        recv: h *fileHandle
        results: error
    name: fileHandle
  - fields:
      - doc: ID is the peer.
        name: ID
        type: coreconsensus.NodeID
      - doc: |-
          Flags are the peer's yes/no facts: PeerVoter, PeerUnreachable,
          PeerSnapshot.
        name: Flags
        type: PeerFlags
      - doc: Match is the highest index the peer holds durably, as acknowledged.
        name: Match
        type: uint64
      - doc: Lag is how far Match is behind the leader's last index.
        name: Lag
        type: uint64
      - doc: Inflight counts the appends in flight to it.
        name: Inflight
        type: int
      - doc: |-
          LastContact is how long ago it last answered; negative when it never
          answered in this term.
        name: LastContact
        type: time.Duration
    kind: struct
    name: PeerHealthValue
  - kind: named
    methods:
      - name: Has
        params: x PeerFlags
        recv: f PeerFlags
        results: bool
    name: PeerFlags
    underlying: uint8
  - kind: named
    methods:
      - name: Has
        params: x HealthFlags
        recv: f HealthFlags
        results: bool
      - doc: set is f with x on or off.
        name: set
        params: x HealthFlags, on bool
        recv: f HealthFlags
        results: HealthFlags
    name: HealthFlags
    underlying: uint8
  - fields:
      - doc: Status is the node's view after its last turn.
        name: Status
        type: coreconsensus.StatusValue
      - doc: |-
          Flags are the verdict's yes/no answers: HealthReady, HealthHasLeader,
          HealthQuorumReachable, HealthStopped, HealthSnapshotNearLimit.
        name: Flags
        type: HealthFlags
      - doc: |-
          FailureTolerance is how many voters can fail now with a majority
          left. Only the leader knows it: -1 elsewhere.
        name: FailureTolerance
        type: int
      - doc: ApplyLagEntries is commit minus applied.
        name: ApplyLagEntries
        type: uint64
      - doc: Peers is the leader's view of every peer, nil elsewhere.
        name: Peers
        type: "[]PeerHealthValue"
      - doc: |-
          ChainRefusals counts identical chain refusals of this follower at
          ChainRefusalIndex from ChainRefusalLeader; the node reports itself
          unready while it refuses (D4, R6-05).
        name: ChainRefusals
        type: int
      - name: ChainRefusalIndex
        type: uint64
      - name: ChainRefusalLeader
        type: coreconsensus.NodeID
      - doc: StopReason says why the node stopped itself.
        name: StopReason
