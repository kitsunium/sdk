constants:
  - doc: The membership changes an EntryMembership records.
    grouped: true
    items:
      - doc: ChangeFounding is the founding configuration Bootstrap writes.
        name: ChangeFounding
        type: uint8
        value: iota + 1
      - doc: ChangeAddLearner adds a learner.
        name: ChangeAddLearner
