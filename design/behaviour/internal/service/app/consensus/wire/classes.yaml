        name: ChangeDenyPin
      - doc: ChangeForced is the configuration Recover or RestoreSnapshot forces.
        name: ChangeForced
    name: ChangeFounding
  - doc: |-
      The frame header is frozen in every protocol version (ADR 0152 D18):
      length (u32) | version (u8) | type (u8) | group (u64), little-endian. length
      counts the bytes AFTER the length field. The two high bits of type are the
      lane.
    grouped: true
    items:
      - doc: "frameHeaderLen is the frozen header: length, version, type, group."
        name: frameHeaderLen
        type: int
        value: "14"
      - doc: frameVersion1 is the only frame version this node writes and parses.
        name: frameVersion1
        type: byte
        value: "1"
      - doc: tokenVersion1 is the leading byte of every token this node mints.
        name: tokenVersion1
        type: byte
        value: "1"
      - doc: "tokenLen is a token's whole length: version, ClusterID, three uint64."
        name: tokenLen
        type: int
        value: "41"
      - doc: |-
          metaVersion1 is the leading byte of an encoded SnapshotMeta, the only
          version this node writes.
        name: metaVersion1
        type: byte
        value: "1"
      - doc: |-
          metaVersion2 is the leading byte of a SnapshotMeta checksummed: the
          fields of version 1, then the CRC-32C of every byte before it. This
          node reads it and never writes it: the writer comes with the cluster
          version that admits it, one release after every member reads it
          (#546, ADR 0152 amendment of 2026-10-22).
        name: metaVersion2
        type: byte
        value: "2"
      - doc: metaSumLen is the length of version 2's trailing CRC-32C.
        name: metaSumLen
        type: int
        value: "4"
      - doc: |-
          entryFixedLen is an entry's header before its data: term, index,
          kind, version, body sum, chain sum and data length.
        name: entryFixedLen
        value: 8 + 8 + 1 + 4 + 4 + 4 + 4
      - doc: |-
          messageFixedLen is a message body's fixed part after the frame
          header, up to and including its entry count.
        name: messageFixedLen
        type: int
        value: 1 + 8 + 8 + 8 + 8 + 8 + 8 + 1 + 8 + 8 + 8 + 8 + 8 + 4 + 4
    name: frameHeaderLen
