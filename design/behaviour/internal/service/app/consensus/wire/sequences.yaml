            - set: r.err
              to: frameInvalid
              value: frameInvalid("snapshot meta trailing bytes", len(b))
          when: r.err == nil && len(r.b) != 0
      - opt:
          do:
            - return: r.err
          when: r.err != nil
      - set: "*m"
        value: out
      - return: nil
  - of: metaFields
    steps:
      - opt:
          do:
            - return: nil, frameInvalid("short field", 0)
          when: len(b) == 0
      - switch:
          cases:
            - case: metaVersion1
              do:
                - return: b[1:], nil
            - case: metaVersion2, metaVersion3
              do:
                - opt:
                    do:
                      - return: nil, frameInvalid("short field", len(b)-1)
                    when: len(b) < 1+metaSumLen
                - bind: end
                  eval: len(b) - metaSumLen
                - opt:
                    do:
                      - return: nil, frameInvalid("snapshot meta checksum", len(b))
                    when: crc32.Checksum(b[:end], castagnoli) != binary.LittleEndian.Uint32(b[end:])
                - return: b[1:end], nil
            - default: true
              do:
                - return: |-
                    nil, errs.Wrap(coreconsensus.VersionUnsupported, errs.WrapParams{},
                    			errs.Int("snapshot_meta_version", int(b[0])))
          "on": b[0]
  - of: AppendMembership
    participants:
      - id: caller
        kind: actor
      - id: AppendMembership
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
      - id: binary.LittleEndian.AppendUint32
        kind: value
      - id: appendString
        kind: internal
    steps:
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, m.Index)
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(len(m.Members)))
      - loop:
          do:
            - bind: x
              eval: "&m.Members[i]"
            - set: dst
              to: binary.LittleEndian.AppendUint64
              value: binary.LittleEndian.AppendUint64(dst, uint64(x.ID))
            - set: dst
              value: append(dst, x.Incarnation[:]...)
            - set: dst
              to: appendString
              value: appendString(dst, x.Slot)
            - set: dst
              value: append(dst, x.SPKI[:]...)
            - set: dst
              to: appendString
              value: appendString(dst, x.Address)
            - set: dst
              value: append(dst, boolByte(x.Voter), boolByte(x.Joining))
            - set: dst
              to: binary.LittleEndian.AppendUint32
              value: binary.LittleEndian.AppendUint32(dst, x.PayloadMax)
            - set: dst
              to: binary.LittleEndian.AppendUint64
              value: binary.LittleEndian.AppendUint64(dst, uint64(x.MaxSnapshotBytes))
          key: i
          range: m.Members
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(len(m.Retired)))
      - loop:
          do:
            - set: dst
              to: binary.LittleEndian.AppendUint64
              value: binary.LittleEndian.AppendUint64(dst, uint64(id))
          key: _
          range: m.Retired
          value: id
      - return: dst
  - of: ParseMembership
    participants:
      - id: caller
        kind: actor
      - id: ParseMembership
        kind: self
      - id: r.membership
        kind: internal
      - id: frameInvalid
        kind: internal
    steps:
      - bind: r
        eval: "reader{b: b}"
      - bind: m
        eval: r.membership()
        to: r.membership
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("membership trailing bytes", len(b))
          when: r.err == nil && len(r.b) != 0
      - return: m, r.err
  - of: AppendTimingContract
    participants:
      - id: caller
        kind: actor
      - id: AppendTimingContract
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, c.Generation)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, uint64(c.HeartbeatInterval))
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, uint64(c.ElectionTimeoutMin))
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, uint64(c.ElectionTimeoutMax))
      - return: binary.LittleEndian.AppendUint64(dst, math.Float64bits(c.MaxClockDrift))
        to: binary.LittleEndian.AppendUint64
  - of: ParseTimingContract
    participants:
      - id: caller
        kind: actor
      - id: ParseTimingContract
        kind: self
      - id: r.timing
        kind: internal
      - id: frameInvalid
        kind: internal
    steps:
      - bind: r
        eval: "reader{b: b}"
      - bind: c
        eval: r.timing()
        to: r.timing
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("contract trailing bytes", len(b))
          when: r.err == nil && len(r.b) != 0
      - return: c, r.err
  - of: appendLogIdentity
    participants:
      - id: caller
        kind: actor
      - id: appendLogIdentity
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - set: dst
        value: append(dst, l.Cluster[:]...)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, l.Epoch)
      - set: dst
        value: append(dst, l.Predecessor[:]...)
      - set: dst
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(dst, l.PredecessorEpoch)
      - return: binary.LittleEndian.AppendUint64(dst, l.KeptIndex)
        to: binary.LittleEndian.AppendUint64
  - of: appendString
    participants:
      - id: caller
        kind: actor
      - id: appendString
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(len(s)))
      - return: append(dst, s...)
  - of: appendKeys
    participants:
      - id: caller
        kind: actor
      - id: appendKeys
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(len(keys)))
      - loop:
          do:
            - set: dst
              value: append(dst, keys[i][:]...)
          key: i
          range: keys
      - return: dst
  - of: appendBytes
    participants:
      - id: caller
        kind: actor
      - id: appendBytes
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(dst, uint32(len(b)))
      - return: append(dst, b...)
  - of: boolByte
    steps:
      - opt:
          do:
            - return: "1"
          when: v
      - return: "0"
  - of: frameInvalid
    participants:
      - id: caller
        kind: actor
      - id: frameInvalid
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreconsensus.FrameInvalid, errs.WrapParams{},
          		errs.String("what", what), errs.Int("length", n))
        to: errs
  - of: (*reader).n
    participants:
      - id: caller
        kind: actor
      - id: (*reader).n
        kind: self
      - id: frameInvalid
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: r.err != nil
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("short field", len(r.b))
            - return: nil
          when: k < 0 || len(r.b) < k
      - bind: out
        eval: r.b[:k:k]
      - set: r.b
        value: r.b[k:]
      - return: out
  - of: (*reader).u8
    participants:
      - id: caller
        kind: actor
      - id: (*reader).u8
        kind: self
      - id: r.n
        kind: internal
    steps:
      - opt:
          do:
            - return: b[0]
          init:
            bind: b
            eval: r.n(1)
            to: r.n
          when: b != nil
      - return: "0"
  - of: (*reader).flag
    participants:
      - id: caller
        kind: actor
      - id: (*reader).flag
        kind: self
      - id: r.u8
        kind: internal
      - id: frameInvalid
        kind: internal
    steps:
      - bind: v
        eval: r.u8()
        to: r.u8
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("bool", int(v))
          when: v > 1 && r.err == nil
      - return: v == 1
  - of: (*reader).u32
    participants:
      - id: caller
        kind: actor
      - id: (*reader).u32
        kind: self
      - id: r.n
        kind: internal
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - opt:
          do:
            - return: binary.LittleEndian.Uint32(b)
              to: binary.LittleEndian.Uint32
          init:
            bind: b
            eval: r.n(4)
            to: r.n
          when: b != nil
      - return: "0"
  - of: (*reader).u64
    participants:
      - id: caller
        kind: actor
      - id: (*reader).u64
        kind: self
      - id: r.n
        kind: internal
      - id: binary.LittleEndian.Uint64
        kind: value
    steps:
      - opt:
          do:
            - return: binary.LittleEndian.Uint64(b)
              to: binary.LittleEndian.Uint64
          init:
            bind: b
            eval: r.n(8)
            to: r.n
          when: b != nil
      - return: "0"
  - of: (*reader).bytes
    participants:
      - id: caller
        kind: actor
      - id: (*reader).bytes
        kind: self
      - id: r.u32
        kind: internal
      - id: frameInvalid
        kind: internal
      - id: r.n
        kind: internal
    steps:
      - bind: "n"
        eval: r.u32()
        to: r.u32
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("short bytes", len(r.b))
            - return: nil
          when: uint64(n) > uint64(len(r.b))
      - return: r.n(int(n))
        to: r.n
  - of: (*reader).str
    steps:
      - return: string(r.bytes())
  - of: (*reader).logIdentity
    participants:
      - id: caller
        kind: actor
      - id: (*reader).logIdentity
        kind: self
      - id: r.u64
        kind: internal
    steps:
      - var:
          name: l
          type: coreconsensus.LogIdentityValue
      - eval: copy(l.Cluster[:], r.n(16))
      - set: l.Epoch
        to: r.u64
        value: r.u64()
      - eval: copy(l.Predecessor[:], r.n(16))
      - set: l.PredecessorEpoch
        to: r.u64
        value: r.u64()
      - set: l.KeptIndex
        to: r.u64
        value: r.u64()
      - return: l
  - of: (*reader).timing
    participants:
      - id: caller
        kind: actor
      - id: (*reader).timing
        kind: self
      - id: r.u64
        kind: internal
      - id: time
        kind: stdlib
      - id: math
        kind: stdlib
    steps:
      - var:
          name: c
          type: coreconsensus.TimingContractSpec
      - set: c.Generation
        to: r.u64
        value: r.u64()
      - set: c.HeartbeatInterval
        to: time
        value: time.Duration(r.u64())
      - set: c.ElectionTimeoutMin
        to: time
        value: time.Duration(r.u64())
      - set: c.ElectionTimeoutMax
        to: time
        value: time.Duration(r.u64())
      - set: c.MaxClockDrift
        to: math
        value: math.Float64frombits(r.u64())
      - return: c
  - of: (*reader).membership
    participants:
      - id: caller
        kind: actor
      - id: (*reader).membership
        kind: self
      - id: r.u64
        kind: internal
      - id: r.u32
        kind: internal
      - id: frameInvalid
        kind: internal
      - id: coreconsensus
        kind: package
      - id: r.str
        kind: internal
      - id: r.flag
        kind: internal
    steps:
      - var:
          name: m
          type: coreconsensus.MembershipValue
      - set: m.Index
        to: r.u64
        value: r.u64()
      - bind: "n"
        eval: r.u32()
        to: r.u32
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("member count", len(r.b))
            - return: m
          when: uint64(n) > uint64(len(r.b))
      - loop:
          cond: i < n && r.err == nil
          do:
            - var:
                name: x
                type: coreconsensus.MemberValue
            - set: x.ID
              to: coreconsensus
              value: coreconsensus.NodeID(r.u64())
            - eval: copy(x.Incarnation[:], r.n(16))
            - set: x.Slot
              to: r.str
              value: r.str()
            - eval: copy(x.SPKI[:], r.n(32))
            - set: x.Address
              to: r.str
              value: r.str()
            - set: x.Voter
              to: r.flag
              value: r.flag()
            - set: x.Joining
              to: r.flag
              value: r.flag()
            - set: x.PayloadMax
              to: r.u32
              value: r.u32()
            - set: x.MaxSnapshotBytes
              value: int64(r.u64())
            - set: m.Members
              value: append(m.Members, x)
          init: i := uint32(0)
          post: i++
      - bind: k
        eval: r.u32()
        to: r.u32
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("retired count", len(r.b))
            - return: m
          when: uint64(k)*8 > uint64(len(r.b))
      - loop:
          do:
            - set: m.Retired
              value: append(m.Retired, coreconsensus.NodeID(r.u64()))
          range: k
      - return: m
  - of: (*reader).keys
    participants:
      - id: caller
        kind: actor
      - id: (*reader).keys
        kind: self
      - id: r.u32
        kind: internal
      - id: frameInvalid
        kind: internal
    steps:
      - bind: k
        eval: r.u32()
        to: r.u32
      - opt:
          do:
            - return: nil
          when: r.err != nil
      - opt:
          do:
            - set: r.err
              to: frameInvalid
              value: frameInvalid("retired key count", len(r.b))
            - return: nil
          when: uint64(k)*uint64(keyLen) > uint64(len(r.b))
      - var:
          name: out
          type: "[][32]byte"
      - loop:
          do:
            - set: out
              value: append(out, [32]byte(r.n(keyLen)))
          range: k
      - return: out
