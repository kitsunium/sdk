package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/resilience
  name: resilience
  purpose: Package resilience — the exponential backoff every waiting policy computes, re-exported from the kernel package that owns it.
types:
  - alias: true
    doc: |-
      BackoffValue is an exponential backoff: the wait after the n-th consecutive
      failure is BaseDelay × Multiplier^(n−1), held at MaxDelay when one is set and
      widened by Jitter when one is asked for. Delay(attempt) never returns a
      negative duration, however large attempt is (ADR 0103).

      It is the policy NewRetry has always applied between attempts, published so
      a loop that retries on its own terms — a supervised goroutine, an outbox, a
      state machine's failed transition — computes the same curve instead of
      writing a fourth copy of it. RetryConfig keeps its four fields of the same
      names; NewRetry builds its waits from the same two halves.

      It is an alias of kernel/backoff.Value, the layer that OWNS the curve (ADR
      0074): the curve names no policy and no domain, so the domains that only
      need the curve import the kernel directly instead of this package.
    kind: alias
    name: BackoffValue
    underlying: kbackoff.Value
  - doc: |-
      circuitBreaker trips Open after FailureThreshold consecutive failures — or,
      with a window, on a rate of failures or of slow calls —, rejects for its
      cooldown, then half-opens for ONE trial at a time.

      generation counts the trips, the isolations and the resets. A call captures
      it on admission and its outcome is folded in only while it is still
      current: a call admitted before the breaker last opened is a straggler, and
      its result describes a dependency the breaker has already judged — its
      success must not close an Open breaker and its failure must not restart a
      cooldown it did not cause.

      cooldown is the configured OpenDuration; openFor is the cooldown of the
      current opening, which OpenBackoff lengthens with opens, the openings since
      the breaker last closed. queue holds the changes of phase OnStateChange has
      not heard yet, handed out outside mu, one at a time, in order.
    fields:
      - name: mu
        type: sync.Mutex
      - name: clk
        type: clock.Clock
      - name: retryable
        type: func(error) bool
      - name: onChange
        type: func(from coreres.BreakerPhase, to coreres.BreakerPhase)
      - name: window
        type: "*slidingWindow"
      - name: threshold
        type: int
      - name: trials
        type: int
      - name: passed
        type: int
      - name: cooldown
        type: time.Duration
      - name: backoff
        type: "*kbackoff.Value"
      - name: state
        type: breakerState
      - name: isolated
        type: bool
      - name: failures
        type: int
      - name: opens
        type: int
      - name: trips
        type: uint64
      - name: openedAt
        type: time.Time
      - name: openFor
        type: time.Duration
      - name: generation
        type: uint64
      - name: probing
        type: bool
      - name: queue
        type: changeQueue
    kind: struct
    methods:
      - doc: |-
          configure installs the open backoff, the window and the change queue cfg
          asks for, and returns the field it refuses, if any.
        name: configure
        params: cfg *BreakerConfig
        recv: b *circuitBreaker
        results: string
      - doc: |-
          State reports the breaker's phase and the counts it decides on. It moves
          the window to the clock's now, so a count is never older than the window's
          reach, and changes no phase.
        name: State
        recv: b *circuitBreaker
        results: coreres.BreakerStateValue
      - doc: Isolate opens the breaker until Reset. Calls in flight become stragglers.
        name: Isolate
        recv: b *circuitBreaker
      - doc: |-
          isolate opens the breaker by hand and reports whether the caller must
          deliver the change it queued. Holds mu.
        name: isolate
        recv: b *circuitBreaker
        results: bool
      - doc: |-
          Reset closes the breaker and clears its counts and its open backoff. Calls
          in flight become stragglers.
        name: Reset
        recv: b *circuitBreaker
      - doc: |-
          claimDelivery reports whether the caller must deliver the queued changes.
          Holds mu.
        name: claimDelivery
        recv: b *circuitBreaker
        results: bool
      - doc: deliverIf delivers the queued changes when the caller claimed them.
        name: deliverIf
        params: claimed bool
        recv: b *circuitBreaker
      - doc: |-
          deliver hands every queued change to OnStateChange, outside mu, one at a
          time and in the order they were queued, including those queued while it
          runs — by another call or by the listener itself. A listener that panics
          gives the queue back, so the next change claims and delivers what is left.
        name: deliver
        recv: b *circuitBreaker
      - doc: |-
          nextChange takes the oldest undelivered change, or, when there is none,
          empties the queue and releases the claim.
        name: nextChange
        recv: b *circuitBreaker
        results: phaseChange, bool
      - doc: |-
          Run rejects fast when Open — and when HalfOpen while its one trial is still
          running —, else runs op and records the outcome. A deterministic error (one
          the classifier rejects) is passed through without touching the state machine;
          a trial that ends that way, or panics, frees the HalfOpen slot for the next
          call.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: b *circuitBreaker
        results: error
      - doc: |-
          runTimed runs a call admitted while Closed under a window: timed on the
          breaker's clock, its end and whether it was slow handed to record.
        name: runTimed
        params: ctx context.Context, op coreres.Operation, adm admission
        recv: b *circuitBreaker
        results: error
      - doc: |-
          runTrial runs the HalfOpen trial. A trial that panics must still free the
          slot, or the breaker would stay HalfOpen and reject every call forever, so
          its release is deferred; the change to HalfOpen this call made is heard
          before the trial runs.
        name: runTrial
        params: ctx context.Context, op coreres.Operation, adm admission
        recv: b *circuitBreaker
        results: error
      - doc: |-
          classify turns a finished call into a health signal. A deterministic error
          and a caller who left are no signal; a transient error is a failure.
        name: classify
        params: ctx context.Context, err error
        recv: b *circuitBreaker
        results: outcome
      - doc: |-
          allow reports whether a call may proceed, transitioning Open→HalfOpen once the
          cooldown elapses, and admits at most one HalfOpen trial at a time. An
          isolated breaker admits nothing. Holds mu.
        name: allow
        recv: b *circuitBreaker
        results: admission, bool
      - doc: |-
          release settles a trial its operation abandoned by panicking: record never
          ran, so the trial counts as neutral and the HalfOpen slot is freed. A trial
          record already settled is left alone — the slot may belong to the next one.
        name: release
        params: adm admission, settled *bool
        recv: b *circuitBreaker
      - doc: |-
          record folds a call outcome into the state machine and reports whether the
          caller must deliver the changes of phase it queued. An outcome from an
          earlier generation is ignored, and a success closes the breaker only from
          Closed or from its HalfOpen trial. end is when the call returned on the
          breaker's clock and slow whether it lasted the window's SlowAfter; both are
          read only with a window. Holds mu.
        name: record
        params: adm admission, res outcome, end time.Time, slow bool
        recv: b *circuitBreaker
        results: bool
      - doc: succeed folds one success into the state machine. Holds mu (via record).
        name: succeed
        params: adm admission, now time.Time, slow bool
        recv: b *circuitBreaker
      - doc: |-
          settleTrial closes the breaker on a successful trial, or opens it again
          when the trial was slow. Holds mu (via record).
        name: settleTrial
        params: adm admission, slow bool
        recv: b *circuitBreaker
      - doc: fail folds one counted failure into the state machine. Holds mu (via record).
        name: fail
        params: now time.Time, slow bool
        recv: b *circuitBreaker
      - doc: |-
          trip moves the breaker to Open, stamps the cooldown start, sizes the
          cooldown and starts a new generation, so every call still in flight becomes
          a straggler. Holds mu.
        name: trip
        recv: b *circuitBreaker
      - doc: |-
          cooldownFor is how long the n-th opening since the breaker last closed
          lasts: OpenBackoff's curve when one is set, OpenDuration otherwise.
        name: cooldownFor
        params: opens int
        recv: b *circuitBreaker
        results: time.Duration
      - doc: |-
          moveTo enters phase to, empties the window — a rate read across two phases
          would judge the dependency on calls the last decision already judged — and
          queues the change for OnStateChange when there is one. Holds mu.
        name: moveTo
        params: to breakerState
        recv: b *circuitBreaker
    name: circuitBreaker
  - doc: phaseChange is one change of phase OnStateChange is owed.
    fields:
      - name: from
        type: coreres.BreakerPhase
      - name: to
        type: coreres.BreakerPhase
    kind: struct
    name: phaseChange
  - doc: |-
      admission is what allow hands Run: the generation the call was admitted in,
      whether it is the HalfOpen trial, the one call that may close the breaker,
      and whether this goroutine must deliver the changes of phase allow queued.
    fields:
      - name: generation
        type: uint64
      - name: trial
        type: bool
      - name: deliver
        type: bool
    kind: struct
    name: admission
  - doc: outcome is what a finished call tells the state machine.
    kind: named
    name: outcome
    underlying: int
  - fields:
      - doc: |-
          FailureThreshold is how many consecutive failures open a breaker
          without a Window. A non-positive value defaults to 5. It is not read
          when Window is set.
        name: FailureThreshold
        type: int
      - doc: |-
          OpenDuration is how long an Open breaker rejects calls before admitting
          one HalfOpen trial. A non-positive value clamps to 30s: a zero cooldown
          would let the very next call through, which is a breaker that never
          rejects anything and so protects nothing while the caller believes it
          does (ADR 0031).
        name: OpenDuration
        type: time.Duration
      - name: Clock
        type: clock.Clock
      - doc: |-
          Retryable classifies a non-nil operation error as a dependency failure
          worth counting against the breaker's health. false means the error is
          deterministic — the caller's own fault, not the dependency's — so it is
          returned verbatim and folded into neither the failure count nor the
          success path: a stream of HTTP 400s can no longer trip the breaker, and
          one of them cannot close a HalfOpen breaker either. A nil predicate
          counts every error as a failure, which is the pre-classifier behaviour.
          It is not consulted for a context.Canceled returned once the caller's
          context is closed: that call is neutral whatever the predicate says.
          Shares its shape with RetryConfig.Retryable so one classifier serves a
          nested Retry(Breaker(op)) stack.
        name: Retryable
        type: func(error) bool
      - doc: |-
          Window, when set, opens the breaker on a RATE rather than a streak:
          of failures, or of slow calls, among the calls a sliding time window
          holds. Nil — the zero value — is the consecutive-failure breaker,
          exactly as it was before the field existed.

          A streak misses a dependency that fails every other call: S, F, S,
          F never reaches a threshold of five, and neither does a dependency
          that answers every call, eventually, a minute late. A rate over a
          window sees both. The window's fields have defaults of their own,
          taken from Polly and resilience4j — see BreakerWindowValue.
        name: Window
        type: "*BreakerWindowValue"
      - doc: |-
          OnStateChange, when set, is called on every change of phase, with the
          phase left and the phase entered: Closed to Open on a trip, Open to
          HalfOpen when a call is admitted as the trial, HalfOpen to Closed or
          Open on its outcome, and whatever Isolate and Reset change.

          It is called outside the breaker's lock, one call at a time and in
          the order the changes happened, on the goroutine of the call that
          made the change — or of one already delivering an earlier change,
          which then delivers this one too. It may call State, Isolate or
          Reset. It must not block: a call that changed the phase waits for
          it. Nil hears nothing.
        name: OnStateChange
        type: func(from coreres.BreakerPhase, to coreres.BreakerPhase)
      - doc: |-
          OpenBackoff, when set, makes each opening last longer than the one
          before while the dependency keeps failing its trials: the n-th
          opening since the breaker last closed lasts OpenBackoff.Delay(n),
          in place of OpenDuration. The count starts over when a trial closes
          the breaker, and on Reset.

          Its BaseDelay and its MaxDelay are both required — a zero base is
          a cooldown of nothing, and a zero ceiling one that may grow to
          centuries — and are refused when not positive, with
          PolicyMisconfigured naming the field. Its Multiplier, Jitter and
          JitterMode read as BackoffValue reads them. Nil keeps every opening
          at OpenDuration.
        name: OpenBackoff
        type: "*BackoffValue"
      - doc: |-
          HalfOpenTrials is how many trials in a row must succeed before a
          HalfOpen breaker closes. The trials still run one at a time, and
          any one that fails opens the breaker again. Zero, or less, is one:
          the first successful trial closes it, as before the field existed.

          One success is thin evidence that a dependency has recovered — the
          trial may have reached the one healthy replica, or a cache — and a
          breaker that closes on it and trips again at once doubles the load
          it meant to spare. A few trials in a row cost a few more cooldowns'
          worth of latency to the first callers after recovery, which is what
          resilience4j's permittedNumberOfCallsInHalfOpenState buys too.
        name: HalfOpenTrials
        type: int
    kind: struct
    name: BreakerConfig
  - fields:
      - doc: Size is how far back the window reaches. Zero is 30 seconds.
        name: Size
        type: time.Duration
      - doc: |-
          Buckets is how many slots the window is kept in: a slot leaves the
          window whole, so the window reaches back between Size − Size/Buckets
          and Size. Zero is 10; more than 1000 is refused, the memory of a
          breaker being one slot each.
        name: Buckets
        type: int
      - doc: |-
          MinCalls is how many calls the window must hold before a ratio is
          read at all: below it, a single failure would be a rate of 100%.
          Zero is 100.
        name: MinCalls
        type: int
      - doc: |-
          FailureRatio is the share of failed calls, in (0, 1], at or above
          which the breaker opens. Zero is 0.1.
        name: FailureRatio
        type: float64
      - doc: |-
          SlowAfter is the duration, measured on the breaker's clock from
          admission to return, at or above which a call is slow, whether it
          succeeded or failed. Zero is 60 seconds.
        name: SlowAfter
        type: time.Duration
      - doc: |-
          SlowRatio is the share of slow calls, in (0, 1], at or above which
          the breaker opens. Zero is 1: only a window where every call was
          slow opens it.
        name: SlowRatio
        type: float64
    kind: struct
    name: BreakerWindowValue
  - doc: |-
      changeQueue holds the changes of phase OnStateChange has not heard yet:
      changes from next on, in the order they happened. delivering says a
      goroutine is handing them out. It is guarded by the breaker's mu.
    fields:
      - name: changes
        type: "[]phaseChange"
      - name: next
        type: int
      - name: delivering
        type: bool
    kind: struct
    methods:
      - doc: push queues one change.
        name: push
        params: change phaseChange
        recv: q *changeQueue
      - doc: |-
          claim reports whether the caller must deliver the queued changes: there are
          some, and nobody is delivering them yet.
        name: claim
        recv: q *changeQueue
        results: bool
      - doc: |-
          pop takes the oldest undelivered change, or, when there is none, empties
          the queue — keeping its capacity — and releases the claim.
        name: pop
        recv: q *changeQueue
        results: phaseChange, bool
    name: changeQueue
  - alias: true
    doc: |-
      breakerState is the circuit-breaker state machine value: the phase the core
      publishes — coreres.BreakerClosed, BreakerOpen, BreakerHalfOpen —, so State
      reports what the machine holds without a translation.
    kind: alias
    name: breakerState
    underlying: coreres.BreakerPhase
  - doc: "windowBucket is one slot of the window: the calls that ended in it."
    fields:
      - name: calls
        type: int
      - name: failures
        type: int
      - name: slow
        type: int
    kind: struct
    name: windowBucket
  - doc: |-
      slidingWindow holds the calls of the last len(buckets)×width on the
      breaker's clock. Slot e%len(buckets) holds epoch e — the width-long slice of
      time e×width after origin — for every epoch the window still reaches; head
      is the latest epoch seen, headEnd the offset from origin where it ends, and
      the totals are the sum of the live slots, kept as slots are filled and
      emptied so that a record costs O(1). moved says slots left the window since
      the ratios were last read: a ratio can rise without a new failure, when the
      successes that diluted it leave.

      It is guarded by the breaker's mutex and allocates nothing after newWindow.
    fields:
      - name: buckets
        type: "[]windowBucket"
      - name: width
        type: time.Duration
      - name: origin
        type: time.Time
      - name: head
        type: int64
      - name: headEnd
        type: time.Duration
      - name: moved
        type: bool
      - name: calls
        type: int
      - name: failures
        type: int
      - name: slow
        type: int
      - name: minCalls
        type: int
      - name: failureRatio
        type: float64
      - name: slowAfter
        type: time.Duration
      - name: slowRatio
        type: float64
    kind: struct
    methods:
      - doc: |-
          advance moves the window to the epoch of now, emptying every slot time has
          moved past, and returns the slot now falls in. A now before the latest epoch
          seen — a clock set back — is counted in that latest slot.
        name: advance
        params: now time.Time
        recv: w *slidingWindow
        results: "*windowBucket"
      - doc: drop takes one slot out of the totals and empties it.
        name: drop
        params: b *windowBucket
        recv: w *slidingWindow
      - doc: |-
          clear empties every slot and the totals; head is kept, so the epochs only
          move forward.
        name: clear
        recv: w *slidingWindow
      - doc: |-
          add records one call ending at now and reports whether the window now opens
          the breaker.
        name: add
        params: now time.Time, failed, slow bool
        recv: w *slidingWindow
        results: bool
      - doc: |-
          tripped reports whether the window holds enough calls and either ratio is
          reached.
        name: tripped
        recv: w *slidingWindow
        results: bool
    name: slidingWindow
  - doc: |-
      windowSettings is a BreakerWindowValue with every default applied, or the
      name of the field that cannot be honoured.
    fields:
      - name: size
        type: time.Duration
      - name: buckets
        type: int
      - name: minCalls
        type: int
      - name: failureRatio
        type: float64
      - name: slowAfter
        type: time.Duration
      - name: slowRatio
        type: float64
    kind: struct
    name: windowSettings
  - doc: |-
      bulkhead caps the number of in-flight operations via a buffered-channel
      semaphore; calls beyond the limit are rejected fast with BulkheadFull.
    fields:
      - name: slots
        type: chan struct{}
    kind: struct
    methods:
      - doc: Run admits op if a slot is free, else rejects with BulkheadFull.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: b *bulkhead
        results: error
    name: bulkhead
  - doc: |-
      waitingBulkhead is the bulkhead that queues: slots bounds the operations
      running, queue the calls waiting for one, and maxWait how long each waits on
      clk. Both semaphores are buffered channels, so a call that finds a slot free
      pays what the reject-mode bulkhead pays.
    fields:
      - name: slots
        type: chan struct{}
      - name: queue
        type: chan struct{}
      - name: clk
        type: clock.Timed
      - name: maxWait
        type: time.Duration
    kind: struct
    methods:
      - doc: |-
          Run admits op at once if a slot is free, else queues it for at most maxWait,
          else rejects with BulkheadFull.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: b *waitingBulkhead
        results: error
      - doc: |-
          runHeld runs op under a slot already claimed and releases it on return,
          panic included.
        name: runHeld
        params: ctx context.Context, op coreres.Operation
        recv: b *waitingBulkhead
        results: error
      - doc: |-
          await waits at most maxWait on the clock for a slot, the queue place already
          held, and leaves the queue whatever happens. nil means a slot was claimed.
        name: await
        params: ctx context.Context
        recv: b *waitingBulkhead
        results: error
    name: waitingBulkhead
  - fields:
      - doc: |-
          Max is how many operations run at once. A non-positive Max is 1,
          as NewBulkhead's limit is.
        name: Max
        type: int
      - doc: |-
          Queue is how many calls may wait for a slot beyond the Max
          running; a call that finds the queue full is rejected at once with
          BulkheadFull. Zero, or less, is no queue. It bounds the memory
          and the goroutines a saturated dependency can pin, which an
          unbounded queue would not.
        name: Queue
        type: int
      - doc: |-
          MaxWait is how long a queued call waits for a slot before it is
          rejected with BulkheadFull. Zero, or less, is no wait. Size it
          below the caller's own deadline: a wait the caller cannot afford
          only moves the timeout from this policy to the caller.
        name: MaxWait
        type: time.Duration
      - doc: |-
          Clock is what MaxWait is measured on. Nil means clock.System; a
          ManualClock lets a test run the wait out without sleeping.
        name: Clock
        type: clock.Timed
    kind: struct
    name: BulkheadWaitConfig
  - doc: |-
      fallbackRunner runs a secondary Operation when the primary one fails, and
      reports BOTH errors when the secondary fails too.
    fields:
      - name: secondary
        type: coreres.Operation
      - name: retryable
        type: func(error) bool
    kind: struct
    methods:
      - doc: Run executes op and, if it fails, the configured fallback.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: f fallbackRunner
        results: error
    name: fallbackRunner
  - fields:
      - doc: |-
          Fallback is the secondary Operation run when the primary one fails. It
          has no default: a nil Fallback makes NewFallback return a policy that
          refuses every call with PolicyMisconfigured (ADR 0031). The two values
          the SDK could invent are both worse than a refusal — running the primary
          and passing its error through is a policy that silently does nothing
          while the caller believes their plan B is wired up, and a no-op fallback
          that returns nil would report success for work that never happened.

          It is an Operation, not a func(ctx, primaryErr) error, so that the whole
          policy vocabulary composes on the fallback side too: the plan B can
          itself be a Runner stack (NewRetry(...).Run, a second region's client
          behind its own breaker) with no adapter. What the fallback would have
          learned from the primary error is decided ahead of it, by Retryable.

          The port carries no result value, so a "fallback VALUE" is expressed as
          a closure assigning the default into the caller's own variable:

          	var page []byte
          	cfg := FallbackConfig{Fallback: func(context.Context) error {
          		page = cachedPage
          		return nil
          	}}
        name: Fallback
        type: coreres.Operation
      - doc: |-
          Retryable classifies a non-nil PRIMARY error as one worth falling back
          on. false returns that error verbatim without running the fallback: a
          deterministic failure — a malformed request, an authorisation refusal,
          a policy misconfiguration — is the caller's own, and serving a cached
          answer for it hides a bug behind a stale success. A nil predicate falls
          back on every failure. It shares its shape with RetryConfig.Retryable
          and BreakerConfig.Retryable, so one classifier serves a nested
          Fallback(Retry(Breaker(op))) stack.
        name: Retryable
        type: func(error) bool
    kind: struct
    name: FallbackConfig
  - doc: |-
      hedge races duplicate copies of an Operation against the original once it has
      been outstanding for delay, and returns the first success. slots bounds the
      number of duplicates in flight across every concurrent call; clk is what the
      delay is measured on.
    fields:
      - name: delay
        type: time.Duration
      - name: maxHedges
        type: int
      - name: slots
        type: chan struct{}
      - name: clk
        type: clock.Timed
      - name: budget
        type: coreres.RetryBudget
    kind: struct
    methods:
      - doc: |-
          Run races duplicate attempts and returns the first success, or — when every
          attempt it launched has failed — the first error it received, verbatim.

          A copy that PANICS is re-raised here, on the caller's goroutine, with the
          value it panicked with — see NewHedge for what that preserves and what it
          cannot.

          Goroutine lifecycle: one goroutine per attempt (the first, plus up to
          maxHedges duplicates), all started here and all owned by this call. Each
          hands its outcome to this loop over an unbuffered channel or, once the
          attempts' shared context is done, drops it and exits — so a loser that
          outlives Run neither blocks nor leaks, and a loser's late panic ends there
          instead of ending the process. The deferred cancel is what tells every one
          of them to stop the moment a winner is known.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: h *hedge
        results: error
      - doc: |-
          claimHedge claims one in-flight slot for a call that has already launched the
          given number of attempts, reporting whether the duplicate may be issued. It
          is a claim, not a query: a true return has consumed a slot, which duplicate
          releases when the copy ends.
        name: claimHedge
        params: launched int
        recv: h *hedge
        results: bool
      - doc: claimSlot asks the shared retry budget, then claims an in-flight slot.
        name: claimSlot
        recv: h *hedge
        results: bool
      - doc: |-
          recordOutcome folds a decided call into the shared budget, when there is
          one: a success replenishes it, a failure on a live context drains it, and a
          failure the caller's cancellation explains records nothing.
        name: recordOutcome
        params: ctx context.Context, verdict error
        recv: h *hedge
      - doc: |-
          attempt runs one copy of op and hands its outcome to Run.

          The copy runs under attemptOutcome.capture, which recovers a panic on THIS
          goroutine — the only place it can be recovered. Every other policy runs the
          Operation on the caller's goroutine, where net/http or the caller's own
          recover contains a panic; here the same panic, left alone, ended the process.
        name: attempt
        params: ctx context.Context, op coreres.Operation, out chan<- attemptOutcome
        recv: h *hedge
      - doc: |-
          duplicate runs one hedged copy of op, holding its in-flight slot for as long
          as the copy actually runs.
        name: duplicate
        params: ctx context.Context, op coreres.Operation, out chan<- attemptOutcome
        recv: h *hedge
      - doc: acquire claims one in-flight duplicate slot without blocking.
        name: acquire
        recv: h *hedge
        results: bool
      - doc: release returns an in-flight duplicate slot to the pool.
        name: release
        recv: h *hedge
    name: hedge
  - fields:
      - doc: |-
          Idempotent asserts that the guarded Operation is safe to run more than
          once, concurrently, with at most one of the copies being observed. It
          has no default: false — the zero value — makes NewHedge return a policy
          that refuses every call with PolicyMisconfigured.

          This is the one precondition in the package that is a property of the
          CALLER'S CODE rather than of a number, and the SDK has no way to detect
          it: a hedged non-idempotent Operation does not fail, it succeeds twice —
          a double charge, a double insert, a duplicate outbound message — and
          nothing in the policy or its errors will ever mention it. A doc comment
          is the wrong instrument for a hazard whose symptom is silent success, so
          the claim is made in code, at the construction site, where review sees
          it and `grep -r 'Idempotent:'` enumerates every hedged call path in a
          codebase. Requiring it (rather than defaulting it to true) also means a
          caller cannot arrive at hedging by copying a config and deleting the
          field.
        name: Idempotent
        type: bool
      - doc: |-
          Delay is how long the policy waits for an outstanding attempt before
          issuing a duplicate. It has no default: a non-positive Delay makes
          NewHedge return a policy that refuses every call with
          PolicyMisconfigured.

          Zero is the value that matters, because it is what forgetting the field
          yields, and a zero-delay hedge duplicates EVERY call the instant it
          starts — a load amplifier wearing a resilience policy's name, doing the
          exact opposite of its job on the dependency it is supposed to protect.
          It is refused rather than clamped for the same reason as
          RateLimiterConfig.Rate: the useful value is the caller's own latency
          distribution (a p95/p99 they measured), and an SDK-chosen one would
          either hedge constantly or never.
        name: Delay
        type: time.Duration
      - doc: |-
          MaxHedges is how many DUPLICATE attempts a single call may issue beyond
          the first, one per Delay elapsed. It clamps to 1: a hedging policy that
          may issue no duplicate is inert — it would run the primary attempt and
          nothing else while claiming a tail-latency protection it does not
          provide — and "issue at least one duplicate" is exactly the kind of
          obvious floor that ADR 0031 clamps rather than refuses (cf. Burst,
          NewBulkhead's limit).

          There is no ceiling, because none is needed: the budget bounds how many
          duplicates a call may issue and nothing else — no per-call allocation
          grows with it. math.MaxInt therefore means "as many as the Delay and
          MaxInFlight allow".
        name: MaxHedges
        type: int
      - doc: |-
          MaxInFlight bounds how many duplicate attempts this Runner may have
          running at once, across all concurrent calls. It has no default: a
          non-positive MaxInFlight makes NewHedge return a policy that refuses
          every call with PolicyMisconfigured.

          It is the answer to hedging's second hazard: a dependency that has gone
          slow makes every in-flight call hedge at the same moment, so the policy
          adds load precisely when the dependency has least to spare and deepens
          the outage it was meant to hide. The cap counts duplicates only — the
          first attempt of every call always runs, so reaching the cap degrades
          the policy to no-hedging rather than rejecting the call. A caller who
          wants rejection under saturation composes NewBulkhead, whose job that
          is.

          It is refused rather than defaulted because both directions of a guess
          are harmful in this specific knob, which is the rarer case where neither
          clamping nor defaulting has a safe side: a conservative SDK default
          silently stops hedging under exactly the load the caller bought hedging
          for (inert, ADR 0031's own failure mode), and a generous one hands back
          the amplifier. The number is a capacity decision about the caller's
          downstream, and only they hold it.
        name: MaxInFlight
        type: int
      - doc: |-
          Clock is what Delay is measured on. Nil means clock.System.

          It exists so a test drives the race with a ManualClock — advancing past
          Delay to issue the duplicate instead of sleeping through it, and
          asserting that no duplicate is issued a nanosecond earlier. The retry,
          the breaker and the rate limiters already take one; the hedge, the other
          policy that measures a wait, did not.
        name: Clock
        type: clock.Timed
      - doc: |-
          Budget, when set, is asked before each duplicate: a refusal issues
          none, and the call proceeds on the attempts already running, as when
          MaxInFlight is reached. Each call's outcome is recorded in it — a
          success, or a failure on a live context — so a hedge and a retry
          sharing one budget stop amplifying a failing dependency together, as
          gRPC's retry throttling covers hedging. Nil is the hedge without a
          budget.
        name: Budget
        type: coreres.RetryBudget
    kind: struct
    name: HedgeConfig
  - doc: |-
      attemptOutcome is how one copy of a hedged Operation ended: the error it
      returned, or the value it panicked with.

      A panic travels as a value because it cannot travel any other way. An
      attempt runs on a goroutine of its own, recover() only sees a panic from a
      deferred call of the goroutine that raised it, and a panic that reaches the
      top of ANY goroutine ends the whole process — so it is recovered where it
      happens and handed to hedge.Run, which re-raises it on the caller's goroutine.
    fields:
      - doc: err is what the copy returned; meaningful only when panicked is false.
        name: err
        type: error
      - doc: |-
          raised is the value the copy panicked with, verbatim. It is re-raised
          unchanged so the caller's recover compares equal to what the Operation
          panicked with — see NewHedge.
        name: raised
        type: any
      - doc: |-
          panicked records that the copy never returned. It is a separate flag
          rather than a nil test on raised so the question "did it panic" does not
          depend on what the payload happens to be.
        name: panicked
        type: bool
    kind: struct
    methods:
      - doc: |-
          capture runs op once and records how it ended, turning a panic into an
          outcome instead of letting it unwind off the attempt's goroutine.

          It must be called on the goroutine that runs op: recover() reports a panic
          only when called directly by a deferred function of the panicking
          goroutine, which is why this is the one place in the policy that can do it.
        name: capture
        params: ctx context.Context, op coreres.Operation
        recv: o *attemptOutcome
      - doc: |-
          recoverPanic stores the value of a panic unwinding through capture.

          It is capture's deferred call and nothing else: recover() only stops a panic
          when the deferred function itself calls it, so the call cannot be pushed any
          deeper than this body.
        name: recoverPanic
        recv: o *attemptOutcome
    name: attemptOutcome
  - doc: |-
      hedgeRace is the bookkeeping of one hedged call: how many copies are in the
      race, how many have reported, and the earliest failure seen. It is touched
      only by the goroutine running hedge.Run's loop, never by the attempts
      themselves, so it needs no synchronisation of its own.
    fields:
      - name: launched
        type: int
      - name: completed
        type: int
      - name: firstErr
        type: error
    kind: struct
    methods:
      - doc: |-
          record folds one attempt's outcome into the race, reporting whether it
          decides the call and — when it does — with what.
        name: record
        params: err error
        recv: r *hedgeRace
        results: decided bool, verdict error
    name: hedgeRace
  - doc: |-
      keyedLimiter holds one token bucket per key in a recency list, most
      recently used at the head.

      The list is intrusive — each keyedBucket carries its own links, as the
      kernel cache's entries do — so moving a key to the front is two pointer
      swaps and nothing is boxed in an interface.

      The bound and the idleness are enforced on the calling goroutine, when a
      key is looked up: there is no sweeper goroutine and no timer, so an idle
      limiter costs nothing and a stopped one leaks nothing.
    fields:
      - name: clk
        type: clock.Clock
      - name: key
        type: func(ctx context.Context) string
      - name: byKey
        type: map[string]*keyedBucket
      - name: head
        type: "*keyedBucket"
      - name: tail
        type: "*keyedBucket"
      - name: rate
        type: float64
      - name: burst
        type: float64
      - name: idle
        type: time.Duration
      - name: limit
        type: int
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          Run charges op to its key's bucket, rejecting it with RateLimited when the
          bucket is empty.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: l *keyedLimiter
        results: error
      - doc: |-
          bucketOf returns key's bucket, creating it when the key is new or was
          forgotten, and forgetting whatever the bound or the idleness says to.

          The bucket is returned and charged OUTSIDE the lock: each bucket has its
          own, so two keys never contend beyond this lookup.
        name: bucketOf
        params: key string
        recv: l *keyedLimiter
        results: "*tokenBucket"
      - doc: |-
          evict forgets, from the least recently used end, every key that went idle,
          and as many more as it takes to make room for one. Caller holds mu.
        name: evict
        params: now time.Time
        recv: l *keyedLimiter
      - doc: forget drops one key. Caller holds mu.
        name: forget
        params: entry *keyedBucket
        recv: l *keyedLimiter
      - doc: pushFront links a detached entry at the head. Caller holds mu.
        name: pushFront
        params: entry *keyedBucket
        recv: l *keyedLimiter
      - doc: moveFront makes an entry the most recently used. Caller holds mu.
        name: moveFront
        params: entry *keyedBucket
        recv: l *keyedLimiter
      - doc: unlink detaches an entry from the list. Caller holds mu.
        name: unlink
        params: entry *keyedBucket
        recv: l *keyedLimiter
    name: keyedLimiter
  - doc: |-
      keyedBucket is one key's bucket, the instant it was last charged, and its
      place in the recency list.
    fields:
      - name: used
        type: time.Time
      - name: bucket
        type: "*tokenBucket"
      - name: prev
        type: "*keyedBucket"
      - name: next
        type: "*keyedBucket"
      - name: key
        type: string
    kind: struct
    name: keyedBucket
  - fields:
      - doc: |-
          Key names who a call is charged to — the authenticated user, the
          client's address, a tenant. Calls whose keys differ never share a
          bucket, which is the whole point: one client emptying its bucket is
          refused while the others are not, so a single client cannot lock
          everybody out of a sign-in endpoint the way one shared bucket lets it.

          It is called once per Run, with the Run's context. It is required: a
          limiter with nothing to key on is NewRateLimiter.
        name: Key
        type: func(ctx context.Context) string
      - doc: |-
          Clock reads time for every bucket and for idleness. Nil means
          clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          Rate is each key's sustained admission rate, in tokens per second. It
          has no default, exactly as RateLimiterConfig.Rate has none.
        name: Rate
        type: float64
      - doc: Burst is each key's bucket capacity, clamped to at least 1.
        name: Burst
        type: int
      - doc: |-
          MaxKeys bounds how many keys are tracked at once; beyond it the least
          recently used key is forgotten. It is required: its zero reads either
          as "unbounded", which lets a stream of distinct keys grow the process
          without limit, or as "none", which admits nothing. Size it above the
          number of clients active within IdleTimeout — a key pushed out by
          capacity comes back with a FULL bucket, so a flood of new keys buys
          every evicted client a fresh burst.
        name: MaxKeys
        type: int
      - doc: |-
          IdleTimeout is how long a key may go without a call before it is
          forgotten; its next call starts over with a full bucket. It slides: a
          key in use is never forgotten for idleness. It is required: its zero
          reads either as "forget at once", which gives every call a full bucket
          and so limits nothing, or as "never".

          Forgetting a key is observable only when IdleTimeout is shorter than the
          time the bucket takes to refill (Burst / Rate): below that, a key that
          comes back is admitted a burst it would not yet have earned.
        name: IdleTimeout
        type: time.Duration
    kind: struct
    name: KeyedRateLimiterConfig
  - doc: |-
      misconfiguredRunner refuses every call with PolicyMisconfigured instead of
      running the operation. It is what a constructor returns when it was handed a
      value it cannot honour and no default would be anything but a guess (ADR
      0031): the alternative is an inert policy that reports its own failure as if
      it were normal operation, which is the defect the ADR exists to prevent.

      The refusal surfaces at first use rather than at construction because the
      constructors return a bare Runner. Changing them to (Runner, error) would
      break every call site to report a fault none of them has.
    fields:
      - name: policy
        type: string
      - name: knob
        type: string
    kind: struct
    methods:
      - doc: Run refuses the call without invoking op.
        name: Run
        params: _ context.Context, _ coreres.Operation
        recv: m misconfiguredRunner
        results: error
    name: misconfiguredRunner
  - doc: |-
      tokenBucket admits a call when a token is available, refilling continuously at
      Rate tokens/sec up to Burst. With a positive maxWait, a call whose token is
      due within it reserves the token — tokens goes below zero, and the calls
      after it queue behind the debt — and waits for it on waiter; with none it is
      rejected at once.
    fields:
      - name: mu
        type: sync.Mutex
      - name: clk
        type: clock.Clock
      - name: waiter
        type: clock.Timed
      - name: rate
        type: float64
      - name: burst
        type: float64
      - name: tokens
        type: float64
      - name: maxWait
        type: float64
      - name: last
        type: time.Time
    kind: struct
    methods:
      - doc: |-
          Run admits op if a token is available — or due within maxWait, waited for
          on the clock — else rejects with RateLimited.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: t *tokenBucket
        results: error
      - doc: |-
          await waits waitSeconds on the bucket's clock for a reserved token. A
          context that ends first hands the token back and returns its error.
        name: await
        params: ctx context.Context, waitSeconds float64
        recv: t *tokenBucket
        results: error
      - doc: giveBack returns a reserved token a caller did not use. Holds mu.
        name: giveBack
        recv: t *tokenBucket
      - doc: |-
          take refills by elapsed time then consumes one token if available. Holds mu.
          A token that is not available yet is reserved when it is due within
          maxWait: the call is admitted with how many seconds it must wait for it.
          A refusal reports how many seconds the bucket needs, at its rate, to hold a
          whole token again: (1 − tokens) / rate.
        name: take
        recv: t *tokenBucket
        results: admitted bool, waitSeconds float64
      - doc: |-
          refill adds the tokens earned since the last reading, never past the
          bucket's capacity. The caller holds mu.
        name: refill
        recv: t *tokenBucket
    name: tokenBucket
  - fields:
      - doc: |-
          Rate is the sustained admission rate in tokens per second. It has no
          default: a Rate that is not a finite positive number — zero, negative,
          NaN or infinite — makes NewRateLimiter return a policy that refuses
          every call with PolicyMisconfigured. Any rate the SDK picked on
          the caller's behalf would be a guess at their requirement, and a caller
          who silently received one would believe they were limited at the rate
          they intended (ADR 0031). Contrast Burst, which does have an obvious
          floor — admit at least one call — and is therefore clamped.
        name: Rate
        type: float64
      - name: Burst
        type: int
      - name: Clock
        type: clock.Clock
      - doc: |-
          MaxWait is how long a call may wait for its token instead of being
          rejected: a call whose token is due within MaxWait reserves it at
          once — later calls queue behind the reservation — and waits for
          it on Clock. Zero, or less, rejects at once with RateLimited, as
          the limiter always has. A call whose token is due later than
          MaxWait is rejected at once, saying when it would have been due.

          Waiting needs a clock that can wait: with a positive MaxWait, a
          Clock that is not a clock.Timed is refused with
          PolicyMisconfigured, naming Clock. A nil Clock waits on the wall
          clock.
        name: MaxWait
        type: time.Duration
    kind: struct
    name: RateLimiterConfig
  - doc: retryRunner retries op with capped exponential backoff between attempts.
    fields:
      - name: cfg
        type: RetryConfig
    kind: struct
    methods:
      - doc: |-
          Run executes op, retrying on transient errors until the budget is spent. An
          error the classifier rejects is returned as-is on the spot.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: r *retryRunner
        results: error
      - doc: recordSuccess tells the budget, when there is one, that an attempt succeeded.
        name: recordSuccess
        recv: r *retryRunner
      - doc: |-
          mayRetry records the retryable failure of attempt in the budget and reports
          whether the budget allows the next one. With no budget, or after the last
          attempt, it is always true: the loop's own bound decides.
        name: mayRetry
        params: attempt int
        recv: r *retryRunner
        results: bool
      - doc: |-
          wait sleeps the delay before the given attempt on the configured clock,
          returning ctx.Err on cancel. failed is the error of the attempt before it,
          and previous the call's last wait drawn from the curve, which a wait drawn
          from the curve replaces. OnRetry hears the retry first, on this goroutine.
        name: wait
        params: ctx context.Context, attempt int, failed error, previous *time.Duration
        recv: r *retryRunner
        results: error
      - doc: |-
          delay is the wait before attempt: the one cfg.Delay reads from the failure
          when it reads one, held at MaxDelay and never negative, else the backoff
          curve randomised as JitterMode says — and then recorded in previous, the
          wait a decorrelated draw grows from. An imposed wait is not recorded: it is
          the other side's, not the curve's.
        name: delay
        params: attempt int, failed error, previous *time.Duration
        recv: r *retryRunner
        results: time.Duration
      - doc: |-
          curveWait is the backoff curve's wait before attempt, randomised as
          JitterMode says: Jitter added (the zero), a full draw below the curve, or a
          draw decorrelated from previous, the call's last curve wait.
        name: curveWait
        params: attempt int, previous time.Duration
        recv: r *retryRunner
        results: time.Duration
      - doc: |-
          backoff computes the capped exponential delay for attempt (1-based growth).
          It is the deterministic half of the kernel curve (kernel/backoff.Grow — the
          curve BackoffValue publishes), built from this policy's four fields, so the
          two cannot drift apart.
        name: backoff
        params: attempt int
        recv: r *retryRunner
        results: time.Duration
      - doc: |-
          jittered widens delay by a uniform random fraction of itself, or returns it
          unchanged when no jitter is configured.

          It is separate from backoff so backoff stays a PURE function of the attempt
          number: the deterministic growth and the randomisation are two different
          claims, and a suite that cannot assert the first without the second can
          assert neither precisely.
        name: jittered
        params: delay time.Duration
        recv: r *retryRunner
        results: time.Duration
    name: retryRunner
  - doc: |-
      tokenBudget is gRPC's retry-throttling bucket: tokens in thousandths, full
      at max, a failure costing one token, a success returning ratio of one.
    fields:
      - name: tokens
        type: atomic.Int64
      - name: max
        type: int64
      - name: ratio
        type: int64
    kind: struct
    methods:
      - doc: AllowRetry reports whether more than half the tokens remain.
        name: AllowRetry
        recv: b *tokenBudget
        results: bool
      - doc: RecordSuccess puts ratio back, never past the bucket's size.
        name: RecordSuccess
        recv: b *tokenBudget
      - doc: RecordFailure takes one token out, never below zero.
        name: RecordFailure
        recv: b *tokenBudget
    name: tokenBudget
  - doc: |-
      refusedBudget is what NewRetryBudget returns for a configuration it cannot
      honour: it allows no extra attempt, and NewRetry and NewHedge recognise it
      and refuse every call with PolicyMisconfigured naming knob (ADR 0031).
    fields:
      - name: knob
        type: string
    kind: struct
    methods:
      - doc: "AllowRetry refuses every extra attempt: the budget could not be built."
        name: AllowRetry
        recv: refusedBudget
        results: bool
      - doc: RecordSuccess records nothing.
        name: RecordSuccess
        recv: refusedBudget
      - doc: RecordFailure records nothing.
        name: RecordFailure
        recv: refusedBudget
    name: refusedBudget
  - fields:
      - doc: |-
          MaxTokens is the bucket's size and its starting content. Retries are
          allowed while more than MaxTokens/2 remain, so the budget absorbs
          about MaxTokens/2 more failures than its successes repay before it
          starts refusing. A non-positive MaxTokens is refused; values above
          2^40 are held there.
        name: MaxTokens
        type: int
      - doc: |-
          TokenRatio is what a recorded success puts back, in tokens, a
          failure costing one. It is read to a thousandth, as gRPC reads it: a
          value that is not finite, or that rounds below 0.001, is refused —
          its zero would be a budget that, once drained, never refills.
        name: TokenRatio
        type: float64
    kind: struct
    name: RetryBudgetConfig
  - fields:
      - name: MaxAttempts
        type: int
      - name: BaseDelay
        type: time.Duration
      - name: MaxDelay
        type: time.Duration
      - name: Multiplier
        type: float64
      - doc: |-
          Retryable classifies a non-nil operation error as replayable. It is
          consulted once per failed attempt: false returns that error verbatim —
          no backoff, no further attempt, no RetryExhausted relabel — so a
          deterministic failure (policy refusal, HTTP 400, invalid input) surfaces
          as itself at the first attempt instead of costing the whole budget. A
          nil predicate replays every error, which is the pre-classifier
          behaviour. BreakerConfig accepts the same shape, so one classifier
          serves a nested Retry(Breaker(op)) stack.
        name: Retryable
        type: func(error) bool
      - doc: |-
          Jitter widens each backoff by a random fraction of itself, drawn
          uniformly from [0, Jitter) and ADDED to the computed delay. 0 — the zero
          value — is the deterministic backoff this policy has always had, so an
          existing caller's timing is unchanged. 0.5 is the common choice: it
          desynchronises callers that failed together without letting the average
          wait stop growing monotonically. Values outside [0, 1] clamp into it.

          It exists because deterministic backoff SYNCHRONISES the very callers it
          is meant to spread. N clients that fail against one dependency at the
          same instant retry at the same instant, N times over, and every retry
          round lands as one burst on a dependency that is already struggling.
          Jitter is what turns those bursts back into a distribution.

          It applies AFTER the MaxDelay cap, deliberately: the cap bounds the
          growth, and jitter spreads callers around the bound rather than being
          squeezed flat against it. The consequence is worth stating — WHEN a cap is
          configured, the effective ceiling on one wait becomes MaxDelay * (1 +
          Jitter), not MaxDelay. A zero MaxDelay is no cap at all, so there is no
          ceiling to raise: the backoff grows geometrically and the jitter widens
          whatever it reaches, bounded only by what a time.Duration can represent.

          It is read only under the zero JitterMode.
        name: Jitter
        type: float64
      - doc: |-
          JitterMode is how the backoff is randomised. The zero,
          JitterAdditive, adds Jitter as above. JitterFull waits a uniform
          draw from [0, the capped curve]; JitterDecorrelated draws each wait
          from [BaseDelay, 3 × the previous wait of this call], held at
          MaxDelay. Both are the AWS Builders' Library's variants and ignore
          Jitter; a wait the failure imposed through Delay is not randomised
          and is not the previous wait a decorrelated draw starts from.

          Full jitter spreads callers that failed together the most, at the
          cost of sometimes retrying almost at once; decorrelated jitter
          keeps the waits growing while drifting each caller off the others'
          curve. With a zero MaxDelay a decorrelated wait is bounded only by
          what a time.Duration can represent.
        name: JitterMode
        type: kbackoff.JitterMode
      - doc: |-
          Clock is what the backoff waits on. Nil means clock.System.

          It exists so a test drives the whole retry loop with a ManualClock —
          advancing past each backoff instead of sleeping through it, and asserting
          the exact wait rather than a wall-clock tolerance. The breaker and the
          rate limiter have taken a clock since they shipped; the retry, which is
          the one policy here that actually WAITS, did not.
        name: Clock
        type: clock.Timed
      - doc: |-
          Delay decides the wait before a retry when the failure itself says how
          long to wait. It is called once per retry, with the retry's number —
          1 before the second attempt — and the error of the attempt that just
          failed; a true second result makes its duration the wait, in place of
          the backoff curve and without Jitter. A false one, and a nil Delay,
          wait the curve, which is the behaviour before the field existed.

          The wait it returns is held at MaxDelay when one is set, and a
          negative one is no wait. A server's hint longer than the caller is
          prepared to wait is therefore cut to MaxDelay, never followed past
          it; a caller who would rather give up classifies that error as not
          retryable instead.

          RetryAfter has its shape, so honouring a Retry-After, an OTLP
          collector's throttling or a RateLimited rejection is one line:

          	Delay: func(_ int, err error) (time.Duration, bool) { return resilience.RetryAfter(err) }
        name: Delay
        type: func(attempt int, err error) (time.Duration, bool)
      - doc: |-
          Budget, when set, bounds the retries of every policy sharing it: each
          success and each retryable failure is recorded in it, and before
          every retry it is asked whether one may run. A refusal ends the loop
          with RetryBudgetExceeded wrapping the last error, without waiting. A
          deterministic error and a cancelled context record nothing.

          Nil — the zero value — is the policy without a budget, as it was
          before the field existed. Share one budget per dependency, between
          its retry and its hedge: that is what stops a failing dependency from
          receiving every call times MaxAttempts. A Retry(Hedge(op)) whose two
          policies share a budget records a failed call at both levels, which
          drains and refills it twice as fast and leaves its threshold where it
          was.
        name: Budget
        type: coreres.RetryBudget
      - doc: |-
          OnRetry, when set, is called before each retry's wait, on the
          calling goroutine, with the retry's number — 1 before the second
          attempt —, the error that caused it and the wait about to start. It
          is how a caller counts retries in their own metrics without this
          package depending on one. It is not called for the first attempt,
          nor for a retry the budget refused. It must not block: the retry
          waits for it.
        name: OnRetry
        type: func(attempt int, err error, delay time.Duration)
    kind: struct
    name: RetryConfig
  - doc: |-
      adaptiveThrottle refuses calls on the client side with the probability the
      requests and accepts of its window give. Every field but window and random's
      state is set at construction; mu guards the window, and Random is called
      under it, so a caller's own source need not be safe for concurrent use.
    fields:
      - name: mu
        type: sync.Mutex
      - name: clk
        type: clock.Clock
      - name: rejected
        type: func(error) bool
      - name: random
        type: func() float64
      - name: k
        type: float64
      - name: window
        type: throttleWindow
    kind: struct
    methods:
      - doc: |-
          Run refuses op with Throttled when the draw falls below the refusal
          probability, else runs it and counts whether the dependency accepted it.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: t *adaptiveThrottle
        results: error
      - doc: |-
          refuse counts one request and reports whether it is refused. The
          probability is read from the window BEFORE this request is counted, so the
          first request of an empty window is never refused. Holds mu.
        name: refuse
        recv: t *adaptiveThrottle
        results: bool
      - doc: |-
          accepted reports whether a finished call counts as accepted by the
          dependency: a success, an error the classifier does not call a refusal, and
          a caller who left.
        name: accepted
        params: ctx context.Context, err error
        recv: t *adaptiveThrottle
        results: bool
      - doc: accept counts one accept in the slot of now. Holds mu.
        name: accept
        recv: t *adaptiveThrottle
    name: adaptiveThrottle
  - fields:
      - doc: |-
          K is how many requests per accept the throttle lets through before
          it starts refusing: a call is refused with probability
          max(0, (requests − K × accepts) / (requests + 1)). Zero is 2, the
          SRE book's value. A lower K refuses sooner and wastes less of the
          dependency's capacity on calls it will refuse; a higher one refuses
          later and keeps more traffic flowing. A K below 1 would refuse calls
          to a dependency accepting every one of them, and is refused, as is
          one that is not a finite number.
        name: K
        type: float64
      - doc: |-
          Window is how far back the requests and accepts are counted. Zero
          is two minutes, the SRE book's history. A negative Window is
          refused.
        name: Window
        type: time.Duration
      - doc: |-
          Buckets is how many slots the window is kept in: a slot leaves the
          window whole, so it reaches back between Window − Window/Buckets
          and Window. Zero is 10; more than 1000 is refused, as is a Window
          too short to give each slot a nanosecond.
        name: Buckets
        type: int
      - doc: |-
          Rejected classifies a non-nil error of the operation: true is a
          refusal by the dependency — overload, quota, unavailability —,
          false an answer it gave, which counts as an accept however
          unwelcome. Nil counts every error as a refusal. It is not
          consulted for a context.Canceled returned once the caller's
          context is closed: that call counts as an accept.
        name: Rejected
        type: func(error) bool
      - doc: Clock is what the window is kept on. Nil means clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          Random returns a number in [0, 1) each time a call might be
          refused; the call is refused when it is below the probability.
          Nil is math/rand/v2's Float64. A test hands it a sequence to
          decide each refusal.
        name: Random
        type: func() float64
    kind: struct
    name: AdaptiveThrottleConfig
  - doc: |-
      throttleBucket is one slot of the throttle's window: the requests counted
      in it and the accepts.
    fields:
      - name: requests
        type: int64
      - name: accepts
        type: int64
    kind: struct
    name: throttleBucket
  - doc: |-
      throttleWindow holds the requests and accepts of the last
      len(buckets)×width on the throttle's clock, slot e%len(buckets) holding
      epoch e, as the breaker's slidingWindow does — head the latest epoch seen,
      headEnd where it ends, and the totals kept as slots fill and empty. It is
      guarded by the throttle's mutex and allocates nothing after
      newThrottleWindow.
    fields:
      - name: buckets
        type: "[]throttleBucket"
      - name: width
        type: time.Duration
      - name: origin
        type: time.Time
      - name: head
        type: int64
      - name: headEnd
        type: time.Duration
      - name: requests
        type: int64
      - name: accepts
        type: int64
    kind: struct
    methods:
      - doc: |-
          advance moves the window to the epoch of now, emptying every slot time has
          moved past, and returns the slot now falls in. A now before the latest epoch
          seen — a clock set back — is counted in that latest slot.
        name: advance
        params: now time.Time
        recv: w *throttleWindow
        results: "*throttleBucket"
      - doc: drop takes one slot out of the totals and empties it.
        name: drop
        params: b *throttleBucket
        recv: w *throttleWindow
      - doc: |-
          refusal is the probability, in [0, 1), that the next request is refused:
          max(0, (requests − k × accepts) / (requests + 1)).
        name: refusal
        params: k float64
        recv: w *throttleWindow
        results: float64
    name: throttleWindow
  - doc: |-
      throttleSettings is an AdaptiveThrottleConfig's numbers with every default
      applied.
    fields:
      - name: k
        type: float64
      - name: window
        type: time.Duration
      - name: buckets
        type: int
    kind: struct
    name: throttleSettings
  - doc: |-
      timeoutRunner caps an Operation's run time with a deadline. A nil clk is the
      wall clock, through context.WithTimeout; any other clock goes through
      clockDeadline.
    fields:
      - name: timeout
        type: time.Duration
      - name: clk
        type: clock.Timed
    kind: struct
    methods:
      - doc: Run executes op under a derived deadline.
        name: Run
        params: ctx context.Context, op coreres.Operation
        recv: t timeoutRunner
        results: error
      - doc: derive returns the Operation's deadline-bound context on the runner's clock.
        name: derive
        params: ctx context.Context
        recv: t timeoutRunner
        results: context.Context, context.CancelFunc
    name: timeoutRunner
  - doc: |-
      clockDeadline is a context that expires when an injected clock passes its
      deadline, rather than when the wall clock does. It is what NewTimeoutWith
      hands the Operation under any clock but the system one.

      It is a context of its own, not a context.WithCancelCause, on purpose: a
      cancelCtx reports context.Canceled from Err however it was cancelled, and so
      does every context derived from it, so an Operation checking
      errors.Is(ctx.Err(), context.DeadlineExceeded) would never see the deadline.
      With its own Done channel, a context derived from this one is propagated
      through Err and reports DeadlineExceeded too.

      Deadline reports the caller's deadline, never this one: a time on a
      ManualClock is not a time a socket can be given.
    fields:
      - name: parent
        type: context.Context
      - name: done
        type: chan struct{}
      - name: closeDone
        type: sync.Once
      - name: mu
        type: sync.Mutex
      - name: err
        type: error
    kind: struct
    methods:
      - doc: |-
          watch finishes the context at the first of the deadline, the parent's end
          and the release, then stops the timer so a ManualClock holds no waiter.
        name: watch
        params: timer clock.Timer, release <-chan struct{}
        recv: c *clockDeadline
      - doc: |-
          finish records err as the context's error and closes Done, once: the first
          cause to arrive wins and Err never changes afterwards.
        name: finish
        params: err error
        recv: c *clockDeadline
      - doc: |-
          Deadline reports the caller's deadline: this context's own runs on a clock
          that is not the wall clock.
        name: Deadline
        recv: c *clockDeadline
        results: time.Time, bool
      - doc: Done is closed once the context is finished.
        name: Done
        recv: c *clockDeadline
        results: <-chan struct{}
      - doc: |-
          Err reports why the context finished, or nil while it has not. A parent
          that has finished is folded in on the spot rather than when the watcher
          notices it, so Err never reports a live context under a dead caller.
        name: Err
        recv: c *clockDeadline
        results: error
      - doc: "Value is the parent's: this context carries no value of its own."
        name: Value
        params: key any
        recv: c *clockDeadline
        results: any
    name: clockDeadline
  - fields:
      - doc: |-
          Duration is how long the Operation may run. A non-positive Duration
          makes NewTimeoutWith return a policy that refuses every call with
          PolicyMisconfigured, exactly as NewTimeout refuses a non-positive d.
        name: Duration
        type: time.Duration
      - doc: |-
          Clock is what Duration is measured on. Nil means clock.System, under
          which the policy is NewTimeout's: a context.WithTimeout whose
          deadline the Operation can read.
        name: Clock
        type: clock.Timed
    kind: struct
    name: TimeoutConfig
