# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      defaultThreshold is the consecutive-failure count that opens the breaker when
      none is configured.
    items:
      - name: defaultThreshold
        type: int
        value: "5"
    name: defaultThreshold
  - doc: |-
      defaultOpenDuration is the cooldown an Open breaker serves when none is
      configured. A zero cooldown lets the very next call re-probe the downstream,
      which is a breaker that rejects nothing — the caller believes it is protected
      and is not (ADR 0031). Thirty seconds is the same order of arbitrary as the
      five-failure defaultThreshold above and is the industry-conventional range.
    items:
      - name: defaultOpenDuration
        type: time.Duration
        value: 30 * time.Second
    name: defaultOpenDuration
  - doc: breakerPolicy names the breaker in a PolicyMisconfigured refusal.
    items:
      - name: breakerPolicy
        type: string
        value: "\"breaker\""
    name: breakerPolicy
  - doc: |-
      changesCapacity is the room a breaker with an OnStateChange keeps for the
      changes of phase not yet delivered: a trip, a trial and its outcome fit
      without growing it.
    items:
      - name: changesCapacity
        type: int
        value: "4"
    name: changesCapacity
  - grouped: true
    items:
      - doc: |-
          outcomeNeutral is a deterministic error, an abandoned call, or a call the
          caller cancelled: no signal.
        name: outcomeNeutral
        type: outcome
        value: iota
      - doc: outcomeSuccess is a call that returned nil.
        name: outcomeSuccess
      - doc: outcomeFailure is a call whose error the classifier counts.
        name: outcomeFailure
    name: outcomeNeutral
  - doc: |-
      The window's defaults, each a published library's own (BreakerWindowValue's
      doc names them): Polly v8's CircuitBreakerStrategyOptions — SamplingDuration
      30 s, MinimumThroughput 100, FailureRatio 0.1, and the ten windows its
      rolling health metrics split the sampling duration into — and resilience4j's
      CircuitBreakerConfig — slowCallDurationThreshold 60 s, slowCallRateThreshold
      100 %.
    grouped: true
    items:
      - doc: defaultWindowSize is Polly's SamplingDuration.
        name: defaultWindowSize
        type: time.Duration
        value: 30 * time.Second
      - doc: |-
          defaultWindowBuckets is the number of windows Polly's rolling health
          metrics divide the sampling duration into.
        name: defaultWindowBuckets
        type: int
        value: "10"
      - doc: defaultMinCalls is Polly's MinimumThroughput.
        name: defaultMinCalls
        type: int
        value: "100"
      - doc: defaultFailureRatio is Polly's FailureRatio.
        name: defaultFailureRatio
        type: float64
        value: "0.1"
      - doc: defaultSlowAfter is resilience4j's slowCallDurationThreshold.
        name: defaultSlowAfter
        type: time.Duration
        value: 60 * time.Second
      - doc: defaultSlowRatio is resilience4j's slowCallRateThreshold, 100 %.
        name: defaultSlowRatio
        type: float64
        value: "1"
      - doc: |-
          maxWindowBuckets bounds the slots a breaker allocates once, at
          construction: a Buckets of math.MaxInt would otherwise be a make() that
          panics or eats the process.
        name: maxWindowBuckets
        type: int
        value: "1000"
    name: defaultWindowSize
  - doc: |-
      minHedges is the floor on the duplicate budget of a single call: a hedging
      policy that may issue no duplicate is not a hedging policy.
    items:
      - name: minHedges
        type: int
        value: "1"
    name: minHedges
  - doc: |-
      minInFlight is the smallest in-flight duplicate cap that still hedges; below
      it the knob is refused rather than clamped (see HedgeConfig.MaxInFlight).
    items:
      - name: minInFlight
        type: int
        value: "1"
    name: minInFlight
  - doc: keyedPolicy names this policy in a PolicyMisconfigured refusal.
    items:
      - name: keyedPolicy
        type: string
        value: "\"keyed-ratelimit\""
    name: keyedPolicy
  - doc: oneToken is the cost of a single admitted call.
    items:
      - name: oneToken
        type: float64
        value: "1"
    name: oneToken
  - doc: ratelimitPolicy names the limiter in a PolicyMisconfigured refusal.
    items:
      - name: ratelimitPolicy
        type: string
        value: "\"ratelimit\""
    name: ratelimitPolicy
  - doc: nanosPerSecond converts a wait in seconds to a time.Duration.
    items:
      - name: nanosPerSecond
        type: float64
        value: "1e9"
    name: nanosPerSecond
  - doc: minAttempts is the floor on the attempt budget.
    items:
      - name: minAttempts
        type: int
        value: "1"
    name: minAttempts
  - doc: |-
      retryAfterField is the errs field a failure carries to say how many seconds
      to wait before the next attempt. The OTLP sender and the guarded HTTP client
      write the same key, each spelled in its own package; their suites pin that
      RetryAfter reads what they write.
    items:
      - name: retryAfterField
        type: string
        value: "\"retry_after_seconds\""
    name: retryAfterField
  - doc: floatBits is the width strconv parses a field's rendering at.
    items:
      - name: floatBits
        type: int
        value: "64"
    name: floatBits
  - doc: |-
      milliPerToken is the fixed-point scale of the budget's counts: gRPC reads
      TokenRatio to three decimals, so a thousandth of a token is the unit and
      every update is one integer compare-and-swap.
    items:
      - name: milliPerToken
        type: int64
        value: "1000"
    name: milliPerToken
  - doc: |-
      maxBudgetTokens holds MaxTokens where its count in thousandths, doubled by
      AllowRetry's comparison, cannot overflow an int64. It is an int64 because a
      32-bit int cannot hold it — and cannot reach it either.
    items:
      - name: maxBudgetTokens
        type: int64
        value: 1 << 40
    name: maxBudgetTokens
  - doc: budgetPolicy names a refused budget in PolicyMisconfigured's fields.
    items:
      - name: budgetPolicy
        type: string
        value: "\"retrybudget\""
    name: budgetPolicy
  - doc: |-
      The adaptive throttle's defaults, each the SRE book's own ("Handling
      Overload", client-side throttling): K = 2 and a two-minute history. The ten
      slots are the breaker window's, so the two windows reach back alike.
    grouped: true
    items:
      - doc: defaultThrottleK is the SRE book's multiplier.
        name: defaultThrottleK
        type: float64
        value: "2"
      - doc: |-
          minThrottleK is the smallest multiplier that never refuses a call to a
          dependency accepting every one of them.
        name: minThrottleK
        type: float64
        value: "1"
      - doc: defaultThrottleWindow is the SRE book's two minutes of history.
        name: defaultThrottleWindow
        type: time.Duration
        value: 2 * time.Minute
      - doc: throttlePolicy names the throttle in a PolicyMisconfigured refusal.
        name: throttlePolicy
        type: string
        value: "\"throttle\""
    name: defaultThrottleK
