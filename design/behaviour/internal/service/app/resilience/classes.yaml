functions:
  - name: NewCircuitBreaker
    params: cfg BreakerConfig
    results: coreres.Runner
  - doc: |-
      resolveWindow applies the defaults of a BreakerWindowValue and returns the
      field it refuses, if any, spelt as the caller writes it.
    name: resolveWindow
    params: w BreakerWindowValue
    results: windowSettings, string
  - doc: |-
      reachRefusal names the field of the window's reach that cannot be honoured,
      and reports whether there is one.
    name: reachRefusal
    params: settings windowSettings
    results: string, bool
  - doc: |-
      thresholdRefusal names the threshold of the window that cannot be honoured,
      and reports whether there is one.
    name: thresholdRefusal
    params: settings windowSettings
    results: string, bool
  - doc: orDuration is d, or def when d is zero.
    name: orDuration
    params: d, def time.Duration
    results: time.Duration
  - doc: orInt is n, or def when n is zero.
    name: orInt
    params: n, def int
    results: int
  - doc: orRatio is r, or def when r is zero.
    name: orRatio
    params: r, def float64
    results: float64
  - doc: validRatio reports whether r is a share in (0, 1].
    name: validRatio
    params: r float64
    results: bool
  - doc: newWindow allocates the slots of a window starting at origin.
    name: newWindow
    params: s windowSettings, origin time.Time
    results: "*slidingWindow"
  - doc: |-
      epochEnd is the offset from the origin where epoch ends, saturated at the
      longest duration rather than wrapped negative.
    name: epochEnd
    params: epoch int64, width time.Duration
    results: time.Duration
  - name: NewBulkhead
    params: maxConcurrent int
    results: coreres.Runner
  - name: NewBulkheadWait
    params: cfg BulkheadWaitConfig
    results: coreres.Runner
  - doc: |-
      newWaitingBulkhead builds the bulkhead that queues from a cfg whose Queue and
      MaxWait are both positive.
    name: newWaitingBulkhead
    params: cfg BulkheadWaitConfig
    results: "*waitingBulkhead"
  - name: NewFallback
    params: cfg FallbackConfig
    results: coreres.Runner
  - name: NewHedge
    params: cfg HedgeConfig
    results: coreres.Runner
  - name: NewKeyedRateLimiter
    params: cfg KeyedRateLimiterConfig
    results: coreres.Runner
  - doc: |-
      newMisconfigured returns a Runner that refuses every call, naming the policy
      and the offending knob. The value itself is never carried — the field says
      which knob is wrong, not what was passed.
    name: newMisconfigured
    params: policy, knob string
    results: coreres.Runner
  - name: NewRateLimiter
    params: cfg RateLimiterConfig
    results: coreres.Runner
  - doc: |-
      usableRate reports whether rate is a finite positive number of tokens per
      second — the only kind a bucket can refill at without failing open or
      closed. NewRateLimiter's comment says why each of the other shapes is fatal.
    name: usableRate
    params: rate float64
    results: bool
  - doc: |-
      bucketSize resolves a burst to the bucket capacity, clamping a non-positive
      one to a single token — the obvious floor: admit at least one call.
    name: bucketSize
    params: burst int
    results: float64
  - doc: |-
      newTokenBucket returns a full bucket refilling at rate tokens per second up
      to burst, reading time from clk. It is the one constructor both the single
      limiter and every key of the keyed limiter go through.
    name: newTokenBucket
    params: clk clock.Clock, rate, burst float64
    results: "*tokenBucket"
  - doc: |-
      rateLimited is the RateLimited rejection carrying, as retryAfterField, the
      seconds the bucket needs to earn its next token — the delay RetryAfter reads.
    name: rateLimited
    params: waitSeconds float64
    results: error
  - name: NewRetry
    params: cfg RetryConfig
    results: coreres.Runner
  - doc: |-
      newRetryRunner normalises the backoff knobs and the clock, refuses a budget
      NewRetryBudget could not build, and builds the runner.
    name: newRetryRunner
    params: cfg RetryConfig
    results: coreres.Runner
  - doc: capDelay holds d into [0, ceiling], a non-positive ceiling being no cap.
    name: capDelay
    params: d, ceiling time.Duration
    results: time.Duration
  - doc: timedOrSystem resolves a nil clock to the wall clock.
    name: timedOrSystem
    params: clk clock.Timed
    results: clock.Timed
  - name: RetryAfter
    params: err error
    results: time.Duration, bool
  - doc: |-
      secondsToDuration parses a field's rendering as a number of seconds and
      converts it to a Duration, reporting false for anything that is not a
      finite positive number.
    name: secondsToDuration
    params: rendered string
    results: time.Duration, bool
  - name: NewRetryBudget
    params: cfg RetryBudgetConfig
    results: coreres.RetryBudget
  - doc: |-
      refusedBudgetKnob reports whether budget is one NewRetryBudget refused, and
      the field it refused, so a policy given it refuses every call by name.
    name: refusedBudgetKnob
    params: budget coreres.RetryBudget
    results: string, bool
  - doc: |-
      isRetryable reports whether err is a transient failure the policy may act on
      (replay it, or count it against a dependency's health). A nil predicate keeps
      the pre-classifier contract where every error is transient; the predicate is
      never called with a nil error because both call sites gate on err != nil
      first.
    name: isRetryable
    params: pred func(error) bool, err error
    results: bool
  - name: NewAdaptiveThrottle
    params: cfg AdaptiveThrottleConfig
    results: coreres.Runner
  - doc: |-
      resolveThrottle applies the defaults of cfg's numbers and returns the field
      it refuses, if any.
    name: resolveThrottle
    params: cfg AdaptiveThrottleConfig
    results: throttleSettings, string
  - doc: newThrottleWindow allocates the slots of a window starting at origin.
    name: newThrottleWindow
    params: s throttleSettings, origin time.Time
    results: throttleWindow
  - name: NewTimeout
    params: d time.Duration
    results: coreres.Runner
  - name: NewTimeoutWith
    params: cfg TimeoutConfig
    results: coreres.Runner
  - doc: |-
      newClockDeadline returns a context that expires after d on clk, or when
      parent is done, and the function that releases it. The watcher goroutine
      ends at whichever comes first, or at release.
    name: newClockDeadline
    params: parent context.Context, clk clock.Timed, d time.Duration
    results: context.Context, context.CancelFunc
  - doc: |-
      wrapAs returns the given resilience sentinel as the error origin (its
      code/reason/public win), attaching the cause's message as a structured field
      so it stays diagnosable without overriding the policy code (origin-wins would
      otherwise let an *errs.Error cause hijack the code). A nil cause yields the
      bare sentinel.
    name: wrapAs
    params: sentinel *kerrs.Error, cause error
    results: error
  - doc: |-
      wrapAsFields returns the sentinel as the error origin with fields attached.
      It is the one place a resilience outcome is built, for the one-cause shape
      wrapAs gives and for FallbackFailed's two named halves alike, so a change to
      how a policy wraps its sentinel reaches every policy at once.
    name: wrapAsFields
    params: sentinel *kerrs.Error, fields ...kerrs.FieldValue
    results: error
