# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      defaultThreshold is the consecutive-failure count that opens the breaker when
      none is configured.
    items:
      - name: defaultThreshold
        type: int
        value: "5"
    name: defaultThreshold
  - doc: |-
      defaultOpenDuration is the cooldown an Open breaker serves when none is
      configured. A zero cooldown lets the very next call re-probe the downstream,
      which is a breaker that rejects nothing — the caller believes it is protected
      and is not (ADR 0031). Thirty seconds is the same order of arbitrary as the
      five-failure defaultThreshold above and is the industry-conventional range.
    items:
      - name: defaultOpenDuration
        type: time.Duration
        value: 30 * time.Second
    name: defaultOpenDuration
  - grouped: true
    items:
      - doc: "outcomeNeutral is a deterministic error or an abandoned call: no signal."
        name: outcomeNeutral
        type: outcome
        value: iota
      - doc: outcomeSuccess is a call that returned nil.
        name: outcomeSuccess
      - doc: outcomeFailure is a call whose error the classifier counts.
        name: outcomeFailure
    name: outcomeNeutral
  - grouped: true
    items:
      - doc: stateClosed passes calls through and counts failures.
        name: stateClosed
        type: breakerState
        value: iota
      - doc: stateOpen rejects calls fast until the cooldown elapses.
        name: stateOpen
      - doc: stateHalfOpen admits a single trial call to probe recovery.
        name: stateHalfOpen
    name: stateClosed
  - doc: |-
      minHedges is the floor on the duplicate budget of a single call: a hedging
      policy that may issue no duplicate is not a hedging policy.
    items:
      - name: minHedges
        type: int
        value: "1"
    name: minHedges
  - doc: |-
      minInFlight is the smallest in-flight duplicate cap that still hedges; below
      it the knob is refused rather than clamped (see HedgeConfig.MaxInFlight).
    items:
      - name: minInFlight
        type: int
        value: "1"
    name: minInFlight
  - doc: keyedPolicy names this policy in a PolicyMisconfigured refusal.
    items:
      - name: keyedPolicy
        type: string
        value: "\"keyed-ratelimit\""
    name: keyedPolicy
  - doc: oneToken is the cost of a single admitted call.
    items:
      - name: oneToken
        type: float64
        value: "1"
    name: oneToken
  - doc: minAttempts is the floor on the attempt budget.
    items:
      - name: minAttempts
        type: int
        value: "1"
    name: minAttempts
