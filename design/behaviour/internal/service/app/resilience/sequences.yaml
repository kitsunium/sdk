      - opt:
          do:
            - set: v.OpenUntil
              to: b.openedAt.Add
              value: b.openedAt.Add(b.openFor)
          when: b.state == coreres.BreakerOpen && !b.isolated
      - return: v
  - of: (*circuitBreaker).Isolate
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).Isolate
        kind: self
      - id: b.deliverIf
        kind: internal
    steps:
      - eval: b.deliverIf(b.isolate())
        to: b.deliverIf
  - of: (*circuitBreaker).isolate
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).isolate
        kind: self
      - id: b.moveTo
        kind: internal
      - id: b.claimDelivery
        kind: internal
    steps:
      - lock:
          mutex: b.mu
      - set: b.isolated
        value: "true"
      - op: ++
        set: b.generation
      - set: b.probing
        value: "false"
      - eval: b.moveTo(coreres.BreakerOpen)
        to: b.moveTo
      - return: b.claimDelivery()
        to: b.claimDelivery
  - of: (*circuitBreaker).Reset
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).Reset
        kind: self
      - id: b.mu.Lock
        kind: value
      - id: b.moveTo
        kind: internal
      - id: b.window.clear
        kind: internal
      - id: b.claimDelivery
        kind: internal
      - id: b.mu.Unlock
        kind: value
      - id: b.deliverIf
        kind: internal
    steps:
      - eval: b.mu.Lock()
        to: b.mu.Lock
      - set: b.isolated
        value: "false"
      - op: ++
        set: b.generation
      - set: b.probing
        value: "false"
      - set: b.failures, b.opens
        value: 0, 0
      - set: b.openFor
        value: b.cooldown
      - eval: b.moveTo(coreres.BreakerClosed)
        to: b.moveTo
      - opt:
          do:
            - eval: b.window.clear()
              to: b.window.clear
          when: b.window != nil
      - bind: deliver
        eval: b.claimDelivery()
        to: b.claimDelivery
      - eval: b.mu.Unlock()
        to: b.mu.Unlock
      - eval: b.deliverIf(deliver)
        to: b.deliverIf
  - of: (*changeQueue).push
    steps:
      - set: q.changes
        value: append(q.changes, change)
  - of: (*changeQueue).claim
    steps:
      - opt:
          do:
            - return: "false"
          when: q.delivering || q.next == len(q.changes)
      - set: q.delivering
        value: "true"
      - return: "true"
  - of: (*changeQueue).pop
    steps:
      - opt:
          do:
            - set: q.changes
              value: q.changes[:0]
            - set: q.next
              value: "0"
            - set: q.delivering
              value: "false"
            - return: phaseChange{}, false
          when: q.next == len(q.changes)
      - bind: change
        eval: q.changes[q.next]
      - op: ++
        set: q.next
      - return: change, true
  - of: (*circuitBreaker).claimDelivery
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).claimDelivery
        kind: self
      - id: b.queue.claim
        kind: internal
    steps:
      - return: b.queue.claim()
        to: b.queue.claim
  - of: (*circuitBreaker).deliverIf
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).deliverIf
        kind: self
      - id: b.deliver
        kind: internal
    steps:
      - opt:
          do:
            - eval: b.deliver()
              to: b.deliver
          when: claimed
  - of: (*circuitBreaker).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).deliver
        kind: self
      - id: b.nextChange
        kind: internal
    steps:
      - bind: drained
        eval: "false"
      - defer: |-
          func() {
          		//: a normal return already released the claim, under mu.
          		if !drained {
