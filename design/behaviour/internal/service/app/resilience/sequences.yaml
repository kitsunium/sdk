      - id: caller
        kind: actor
      - id: NewCircuitBreaker
        kind: self
      - id: b.configure
        kind: internal
      - id: newMisconfigured
        kind: internal
    steps:
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - bind: threshold
        eval: cfg.FailureThreshold
      - opt:
