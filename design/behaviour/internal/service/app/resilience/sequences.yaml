                when: "!ok"
            - eval: b.onChange(change.from, change.to)
          forever: true
  - of: (*circuitBreaker).nextChange
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).nextChange
        kind: self
      - id: b.queue.pop
        kind: internal
    steps:
      - lock:
          mutex: b.mu
      - return: b.queue.pop()
        to: b.queue.pop
  - of: (*circuitBreaker).Run
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).Run
        kind: self
      - id: b.allow
        kind: internal
      - id: b.deliverIf
        kind: internal
      - id: wrapAs
        kind: internal
      - id: b.runTrial
        kind: internal
      - id: b.runTimed
        kind: internal
    steps:
      - bind: adm, ok
        eval: b.allow()
        to: b.allow
      - opt:
          do:
            - eval: b.deliverIf(adm.deliver)
              to: b.deliverIf
            - return: wrapAs(coreres.CircuitOpen, nil)
              to: wrapAs
          when: "!ok"
      - opt:
          do:
            - return: b.runTrial(ctx, op, adm)
              to: b.runTrial
          when: adm.trial
      - opt:
          do:
            - return: b.runTimed(ctx, op, adm)
              to: b.runTimed
          when: b.window != nil
      - bind: err
        eval: op(ctx)
      - eval: b.deliverIf(b.record(adm, b.classify(ctx, err), time.Time{}, false))
        to: b.deliverIf
      - return: err
  - of: (*circuitBreaker).runTimed
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).runTimed
        kind: self
      - id: b.clk.Now
        kind: value
      - id: b.deliverIf
        kind: internal
    steps:
      - bind: start
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: err
        eval: op(ctx)
      - bind: end
        eval: b.clk.Now()
        to: b.clk.Now
      - eval: b.deliverIf(b.record(adm, b.classify(ctx, err), end, end.Sub(start) >= b.window.slowAfter))
        to: b.deliverIf
      - return: err
  - of: (*circuitBreaker).runTrial
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).runTrial
        kind: self
      - id: b.release
        kind: internal
      - id: b.deliverIf
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.record
        kind: internal
    steps:
      - bind: settled
        eval: "false"
      - defer: b.release(adm, &settled)
        to: b.release
      - eval: b.deliverIf(adm.deliver)
        to: b.deliverIf
      - var:
          name: start
          type: time.Time
      - opt:
          do:
            - set: start
              to: b.clk.Now
              value: b.clk.Now()
          when: b.window != nil
      - bind: err
        eval: op(ctx)
      - bind: end, slow
        eval: start, false
      - opt:
          do:
            - set: end
              to: b.clk.Now
              value: b.clk.Now()
            - set: slow
              value: end.Sub(start) >= b.window.slowAfter
          when: b.window != nil
      - bind: deliver
        eval: b.record(adm, b.classify(ctx, err), end, slow)
        to: b.record
      - set: settled
        value: "true"
      - eval: b.deliverIf(deliver)
        to: b.deliverIf
      - return: err
  - of: (*circuitBreaker).classify
    steps:
      - opt:
          do:
            - return: outcomeSuccess
          when: err == nil
      - opt:
          do:
            - return: outcomeNeutral
          when: ctx.Err() != nil && errors.Is(err, context.Canceled)
      - opt:
          do:
            - return: outcomeFailure
          when: isRetryable(b.retryable, err)
      - return: outcomeNeutral
  - of: (*circuitBreaker).allow
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).allow
        kind: self
      - id: b.moveTo
        kind: internal
    steps:
      - lock:
          mutex: b.mu
      - opt:
          do:
            - return: "admission{generation: b.generation}, true"
          when: b.state == coreres.BreakerClosed
      - opt:
          do:
            - opt:
                do:
                  - return: admission{}, false
                when: b.isolated || b.clk.Since(b.openedAt) < b.openFor
            - eval: b.moveTo(coreres.BreakerHalfOpen)
              to: b.moveTo
            - set: b.probing
              value: "false"
          when: b.state == coreres.BreakerOpen
      - opt:
          do:
            - return: "admission{deliver: b.claimDelivery()}, false"
          when: b.probing
      - set: b.probing
        value: "true"
      - return: "admission{generation: b.generation, trial: true, deliver: b.claimDelivery()}, true"
  - of: (*circuitBreaker).release
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).release
        kind: self
      - id: b.deliverIf
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "*settled"
      - eval: b.deliverIf(b.record(adm, outcomeNeutral, time.Time{}, false))
        to: b.deliverIf
  - of: (*circuitBreaker).record
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).record
        kind: self
      - id: b.succeed
        kind: internal
      - id: b.fail
        kind: internal
      - id: b.claimDelivery
        kind: internal
    steps:
      - lock:
          mutex: b.mu
      - opt:
          do:
            - return: "false"
          when: adm.generation != b.generation
      - opt:
          do:
            - set: b.probing
              value: "false"
          when: adm.trial
      - switch:
          cases:
            - case: outcomeSuccess
              do:
                - eval: b.succeed(adm, end, slow)
                  to: b.succeed
            - case: outcomeFailure
              do:
                - eval: b.fail(end, slow)
                  to: b.fail
            - case: outcomeNeutral
          "on": res
      - return: b.claimDelivery()
        to: b.claimDelivery
  - of: (*circuitBreaker).succeed
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).succeed
        kind: self
      - id: b.settleTrial
        kind: internal
      - id: b.trip
        kind: internal
    steps:
      - switch:
          cases:
            - case: coreres.BreakerHalfOpen
              do:
                - eval: b.settleTrial(adm, slow)
                  to: b.settleTrial
            - case: coreres.BreakerClosed
              do:
                - set: b.failures
                  value: "0"
                - opt:
                    do:
                      - eval: b.trip()
                        to: b.trip
                    when: b.window != nil && b.window.add(now, false, slow)
            - case: coreres.BreakerOpen
          "on": b.state
  - of: (*circuitBreaker).settleTrial
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).settleTrial
        kind: self
      - id: b.trip
        kind: internal
      - id: b.moveTo
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!adm.trial"
      - opt:
          do:
            - eval: b.trip()
              to: b.trip
            - return: ""
          when: slow
      - op: ++
        set: b.passed
      - opt:
          do:
            - return: ""
          when: b.passed < b.trials
      - set: b.failures, b.opens
        value: 0, 0
      - eval: b.moveTo(coreres.BreakerClosed)
        to: b.moveTo
  - of: (*circuitBreaker).fail
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).fail
        kind: self
      - id: b.trip
        kind: internal
    steps:
      - switch:
          cases:
            - case: coreres.BreakerHalfOpen
              do:
                - eval: b.trip()
                  to: b.trip
            - case: coreres.BreakerClosed
              do:
                - opt:
                    do:
                      - opt:
                          do:
                            - eval: b.trip()
                              to: b.trip
                          when: b.window.add(now, true, slow)
                      - return: ""
                    when: b.window != nil
                - op: ++
                  set: b.failures
                - opt:
                    do:
                      - eval: b.trip()
                        to: b.trip
                    when: b.failures >= b.threshold
            - case: coreres.BreakerOpen
          "on": b.state
  - of: (*circuitBreaker).trip
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).trip
        kind: self
      - id: b.clk.Now
        kind: value
      - id: b.cooldownFor
        kind: internal
      - id: b.moveTo
        kind: internal
    steps:
      - set: b.openedAt
        to: b.clk.Now
        value: b.clk.Now()
      - op: ++
        set: b.generation
      - set: b.probing
        value: "false"
      - op: ++
        set: b.trips
      - op: ++
        set: b.opens
      - set: b.openFor
        to: b.cooldownFor
        value: b.cooldownFor(b.opens)
      - eval: b.moveTo(coreres.BreakerOpen)
        to: b.moveTo
  - of: (*circuitBreaker).cooldownFor
    steps:
      - opt:
          do:
            - return: b.cooldown
          when: b.backoff == nil
      - return: max(b.backoff.Delay(opens), time.Nanosecond)
  - of: (*circuitBreaker).moveTo
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).moveTo
        kind: self
      - id: b.window.clear
        kind: internal
      - id: b.queue.push
        kind: internal
    steps:
      - bind: from
        eval: b.state
      - set: b.state
        value: to
      - set: b.passed
        value: "0"
      - opt:
          do:
            - eval: b.window.clear()
              to: b.window.clear
          when: b.window != nil
      - opt:
          do:
            - eval: "b.queue.push(phaseChange{from: from, to: to})"
              to: b.queue.push
          when: b.onChange != nil && from != to
  - of: resolveWindow
    participants:
      - id: caller
        kind: actor
      - id: resolveWindow
        kind: self
      - id: reachRefusal
        kind: internal
      - id: thresholdRefusal
        kind: internal
    steps:
      - bind: settings
        eval: |-
          windowSettings{
          		size:         orDuration(w.Size, defaultWindowSize),
          		buckets:      orInt(w.Buckets, defaultWindowBuckets),
          		minCalls:     orInt(w.MinCalls, defaultMinCalls),
          		failureRatio: orRatio(w.FailureRatio, defaultFailureRatio),
          		slowAfter:    orDuration(w.SlowAfter, defaultSlowAfter),
          		slowRatio:    orRatio(w.SlowRatio, defaultSlowRatio),
          	}
      - opt:
          do:
            - return: settings, knob
          init:
            bind: knob, refused
            eval: reachRefusal(settings)
            to: reachRefusal
          when: refused
      - bind: knob, _
        eval: thresholdRefusal(settings)
        to: thresholdRefusal
      - return: settings, knob
  - of: reachRefusal
    steps:
      - switch:
          cases:
            - case: settings.buckets < 0 || settings.buckets > maxWindowBuckets
              do:
                - return: "\"Window.Buckets\", true"
            - case: settings.size < 0 || settings.size/time.Duration(settings.buckets) <= 0
              do:
                - return: "\"Window.Size\", true"
            - default: true
              do:
                - return: "\"\", false"
  - of: thresholdRefusal
    steps:
      - switch:
          cases:
            - case: settings.minCalls < 0
              do:
                - return: "\"Window.MinCalls\", true"
            - case: "!validRatio(settings.failureRatio)"
              do:
                - return: "\"Window.FailureRatio\", true"
            - case: settings.slowAfter < 0
              do:
                - return: "\"Window.SlowAfter\", true"
            - case: "!validRatio(settings.slowRatio)"
              do:
                - return: "\"Window.SlowRatio\", true"
            - default: true
              do:
                - return: "\"\", false"
  - of: orDuration
    steps:
      - opt:
          do:
            - return: def
          when: d == 0
      - return: d
  - of: orInt
    steps:
      - opt:
          do:
            - return: def
          when: n == 0
      - return: "n"
  - of: orRatio
    steps:
      - opt:
          do:
            - return: def
          when: r == 0
      - return: r
  - of: validRatio
    steps:
      - return: r > 0 && r <= 1 && !math.IsNaN(r)
  - of: newWindow
    steps:
      - bind: width
        eval: s.size / time.Duration(s.buckets)
      - return: |-
          &slidingWindow{
          		buckets:      make([]windowBucket, s.buckets),
          		width:        width,
          		origin:       origin,
          		headEnd:      width,
          		minCalls:     s.minCalls,
          		failureRatio: s.failureRatio,
          		slowAfter:    s.slowAfter,
          		slowRatio:    s.slowRatio,
          	}
  - of: (*slidingWindow).advance
    participants:
      - id: caller
        kind: actor
      - id: (*slidingWindow).advance
        kind: self
      - id: now.Sub
        kind: value
      - id: w.clear
        kind: internal
      - id: w.drop
        kind: internal
      - id: epochEnd
        kind: internal
    steps:
      - bind: "n"
        eval: int64(len(w.buckets))
      - bind: elapsed
        eval: now.Sub(w.origin)
        to: now.Sub
      - opt:
          do:
            - return: "&w.buckets[w.head%n]"
          when: elapsed < w.headEnd
      - bind: epoch
        eval: int64(elapsed / w.width)
      - set: w.moved
        value: "true"
      - alt:
          - do:
              - eval: w.clear()
                to: w.clear
            when: epoch-w.head >= n
          - do:
              - loop:
                  cond: e <= epoch
                  do:
                    - eval: w.drop(&w.buckets[e%n])
                      to: w.drop
                  init: e := w.head + 1
                  post: e++
            else: true
      - set: w.head
        value: epoch
      - set: w.headEnd
        to: epochEnd
        value: epochEnd(epoch, w.width)
      - return: "&w.buckets[epoch%n]"
  - of: epochEnd
    steps:
      - opt:
          do:
            - return: math.MaxInt64
          when: epoch >= int64(math.MaxInt64/width)-1
      - return: time.Duration(epoch+1) * width
  - of: (*slidingWindow).drop
    steps:
      - op: "-="
        set: w.calls
        value: b.calls
      - op: "-="
        set: w.failures
        value: b.failures
      - op: "-="
        set: w.slow
        value: b.slow
      - set: "*b"
        value: windowBucket{}
  - of: (*slidingWindow).clear
    steps:
      - eval: clear(w.buckets)
      - set: w.calls, w.failures, w.slow
        value: 0, 0, 0
  - of: (*slidingWindow).add
    participants:
      - id: caller
        kind: actor
      - id: (*slidingWindow).add
        kind: self
      - id: w.advance
        kind: internal
      - id: w.tripped
        kind: internal
    steps:
      - bind: b
        eval: w.advance(now)
        to: w.advance
      - op: ++
        set: b.calls
      - op: ++
        set: w.calls
      - opt:
          do:
            - op: ++
              set: b.failures
            - op: ++
              set: w.failures
          when: failed
      - opt:
          do:
            - op: ++
              set: b.slow
            - op: ++
              set: w.slow
          when: slow
      - opt:
          do:
            - return: "false"
          when: "!failed && !slow && !w.moved && w.calls != w.minCalls"
      - set: w.moved
        value: "false"
      - return: w.tripped()
        to: w.tripped
  - of: (*slidingWindow).tripped
    steps:
      - opt:
          do:
            - return: "false"
          when: w.calls < w.minCalls
      - bind: total
        eval: float64(w.calls)
      - return: float64(w.failures)/total >= w.failureRatio || float64(w.slow)/total >= w.slowRatio
  - of: NewBulkhead
    steps:
      - opt:
          do:
            - set: maxConcurrent
              value: "1"
          when: maxConcurrent < 1
      - return: "&bulkhead{slots: make(chan struct{}, maxConcurrent)}"
  - of: (*bulkhead).Run
    participants:
      - id: caller
        kind: actor
      - id: (*bulkhead).Run
        kind: self
      - id: wrapAs
        kind: internal
    steps:
      - select:
          cases:
            - comm: b.slots <- struct{}{}
              do:
                - defer: func() { <-b.slots }()
                - return: op(ctx)
            - default: true
              do:
                - return: wrapAs(coreres.BulkheadFull, nil)
                  to: wrapAs
  - of: NewBulkheadWait
    participants:
      - id: caller
        kind: actor
      - id: NewBulkheadWait
        kind: self
      - id: NewBulkhead
        kind: internal
      - id: newWaitingBulkhead
        kind: internal
    steps:
      - opt:
          do:
            - return: NewBulkhead(cfg.Max)
              to: NewBulkhead
          when: cfg.Queue <= 0 || cfg.MaxWait <= 0
      - return: newWaitingBulkhead(cfg)
        to: newWaitingBulkhead
  - of: newWaitingBulkhead
    steps:
      - bind: limit
        eval: max(cfg.Max, 1)
      - return: |-
          &waitingBulkhead{
          		slots:   make(chan struct{}, limit),
          		queue:   make(chan struct{}, cfg.Queue),
          		clk:     timedOrSystem(cfg.Clock),
          		maxWait: cfg.MaxWait,
          	}
  - of: (*waitingBulkhead).Run
    participants:
      - id: caller
        kind: actor
      - id: (*waitingBulkhead).Run
        kind: self
      - id: b.runHeld
        kind: internal
      - id: wrapAs
        kind: internal
      - id: b.await
        kind: internal
    steps:
      - select:
          cases:
            - comm: b.slots <- struct{}{}
              do:
                - return: b.runHeld(ctx, op)
                  to: b.runHeld
            - default: true
      - select:
          cases:
            - comm: b.queue <- struct{}{}
            - default: true
              do:
                - return: wrapAs(coreres.BulkheadFull, nil)
                  to: wrapAs
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: b.await(ctx)
            to: b.await
          when: err != nil
      - return: b.runHeld(ctx, op)
        to: b.runHeld
  - of: (*waitingBulkhead).runHeld
    steps:
      - defer: func() { <-b.slots }()
      - return: op(ctx)
  - of: (*waitingBulkhead).await
    participants:
      - id: caller
        kind: actor
      - id: (*waitingBulkhead).await
        kind: self
      - id: b.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: wrapAs
        kind: internal
      - id: ctx.Err
        kind: value
    steps:
      - defer: func() { <-b.queue }()
      - bind: timer
        eval: b.clk.NewTimer(b.maxWait)
        to: b.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: b.slots <- struct{}{}
              do:
                - return: nil
            - comm: <-timer.C()
              do:
                - return: wrapAs(coreres.BulkheadFull, nil)
                  to: wrapAs
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
  - of: NewFallback
    participants:
      - id: caller
        kind: actor
      - id: NewFallback
        kind: self
      - id: newMisconfigured
        kind: internal
    steps:
      - opt:
          do:
            - return: newMisconfigured("fallback", "Fallback")
              to: newMisconfigured
          when: cfg.Fallback == nil
      - return: "fallbackRunner{secondary: cfg.Fallback, retryable: cfg.Retryable}"
  - of: fallbackRunner.Run
    participants:
      - id: caller
        kind: actor
      - id: fallbackRunner.Run
        kind: self
      - id: ctx.Err
        kind: value
      - id: wrapAsFields
        kind: internal
    steps:
      - bind: primaryErr
        eval: op(ctx)
      - opt:
          do:
            - return: nil
          when: primaryErr == nil
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - opt:
          do:
            - return: primaryErr
          when: "!isRetryable(f.retryable, primaryErr)"
      - bind: fallbackErr
        eval: f.secondary(ctx)
      - opt:
          do:
            - return: nil
          when: fallbackErr == nil
      - opt:
          do:
            - return: ctxErr
          init:
            bind: ctxErr
            eval: ctx.Err()
            to: ctx.Err
          when: ctxErr != nil
      - return: |-
          wrapAsFields(coreres.FallbackFailed,
          		kerrs.String("primary", primaryErr.Error()),
          		kerrs.String("fallback", fallbackErr.Error()))
        to: wrapAsFields
  - of: NewHedge
    participants:
      - id: caller
        kind: actor
      - id: NewHedge
        kind: self
      - id: newMisconfigured
        kind: internal
      - id: refusedBudgetKnob
        kind: internal
    steps:
      - opt:
          do:
            - return: newMisconfigured("hedge", "Idempotent")
              to: newMisconfigured
          when: "!cfg.Idempotent"
      - opt:
          do:
            - return: newMisconfigured("hedge", "Delay")
              to: newMisconfigured
          when: cfg.Delay <= 0
      - opt:
          do:
            - return: newMisconfigured("hedge", "MaxInFlight")
              to: newMisconfigured
          when: cfg.MaxInFlight < minInFlight
      - bind: maxHedges
        eval: max(cfg.MaxHedges, minHedges)
      - opt:
          do:
            - return: newMisconfigured(budgetPolicy, knob)
              to: newMisconfigured
          init:
            bind: knob, refused
            eval: refusedBudgetKnob(cfg.Budget)
            to: refusedBudgetKnob
          when: refused
      - return: |-
          &hedge{
          		delay: cfg.Delay, maxHedges: maxHedges,
          		slots: make(chan struct{}, cfg.MaxInFlight), clk: timedOrSystem(cfg.Clock),
          		budget: cfg.Budget,
          	}
  - of: (*hedge).Run
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).Run
        kind: self
      - id: context
        kind: stdlib
      - id: h.attempt
        kind: internal
      - id: timedOrSystem(h.clk).NewTicker
        kind: value
      - id: ticker.Stop
        kind: value
      - id: ticker.C
        kind: value
      - id: ctx.Err
        kind: value
      - id: race.record
        kind: internal
      - id: h.recordOutcome
        kind: internal
      - id: h.duplicate
        kind: internal
    steps:
      - bind: actx, cancel
        eval: context.WithCancel(ctx)
        to: context
      - defer: cancel()
      - bind: results
        eval: make(chan attemptOutcome)
      - go: h.attempt(actx, op, results)
        to: h.attempt
      - bind: ticker
        eval: timedOrSystem(h.clk).NewTicker(h.delay)
        to: timedOrSystem(h.clk).NewTicker
      - defer: ticker.Stop()
        to: ticker.Stop
      - bind: ticks
        eval: ticker.C()
        to: ticker.C
      - bind: race
        eval: "hedgeRace{launched: 1}"
      - loop:
          do:
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: ctx.Err()
                        to: ctx.Err
                  - comm: outcome := <-results
                    do:
                      - opt:
                          do:
                            - panic: outcome.raised
                          when: outcome.panicked
                      - opt:
                          do:
                            - eval: h.recordOutcome(ctx, verdict)
                              to: h.recordOutcome
                            - return: verdict
                          init:
                            bind: decided, verdict
                            eval: race.record(outcome.err)
                            to: race.record
                          when: decided
                  - comm: <-ticks
                    do:
                      - opt:
                          do:
                            - continue: true
                          when: "!h.claimHedge(race.launched)"
                      - op: ++
                        set: race.launched
                      - go: h.duplicate(actx, op, results)
                        to: h.duplicate
          forever: true
  - of: (*hedge).claimHedge
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).claimHedge
        kind: self
      - id: h.claimSlot
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: launched > h.maxHedges
      - return: h.claimSlot()
        to: h.claimSlot
  - of: (*hedge).claimSlot
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).claimSlot
        kind: self
      - id: h.acquire
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: h.budget != nil && !h.budget.AllowRetry()
      - return: h.acquire()
        to: h.acquire
  - of: (*hedge).recordOutcome
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).recordOutcome
        kind: self
      - id: h.budget.RecordSuccess
        kind: value
      - id: h.budget.RecordFailure
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: h.budget == nil
      - opt:
          do:
            - eval: h.budget.RecordSuccess()
              to: h.budget.RecordSuccess
            - return: ""
          when: verdict == nil
      - opt:
          do:
            - eval: h.budget.RecordFailure()
              to: h.budget.RecordFailure
          when: ctx.Err() == nil
  - of: (*hedge).attempt
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).attempt
        kind: self
      - id: outcome.capture
        kind: internal
    steps:
      - var:
          name: outcome
          type: attemptOutcome
      - eval: outcome.capture(ctx, op)
        to: outcome.capture
      - select:
          cases:
            - comm: out <- outcome
            - comm: <-ctx.Done()
  - of: (*hedge).duplicate
    participants:
      - id: caller
        kind: actor
      - id: (*hedge).duplicate
        kind: self
      - id: h.release
        kind: internal
      - id: h.attempt
        kind: internal
    steps:
      - defer: h.release()
        to: h.release
      - eval: h.attempt(ctx, op, out)
        to: h.attempt
  - of: (*hedge).acquire
    steps:
      - select:
          cases:
            - comm: h.slots <- struct{}{}
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - of: (*hedge).release
    steps:
      - eval: <-h.slots
  - of: (*attemptOutcome).capture
    participants:
      - id: caller
        kind: actor
      - id: (*attemptOutcome).capture
        kind: self
      - id: o.recoverPanic
        kind: internal
    steps:
      - set: o.panicked
        value: "true"
      - defer: o.recoverPanic()
        to: o.recoverPanic
      - set: o.err
        value: op(ctx)
      - set: o.panicked
        value: "false"
  - of: (*attemptOutcome).recoverPanic
    steps:
      - opt:
          do:
            - set: o.raised
              value: recover()
          when: o.panicked
  - of: (*hedgeRace).record
    steps:
      - op: ++
        set: r.completed
      - opt:
          do:
            - return: true, nil
          when: err == nil
      - opt:
          do:
            - set: r.firstErr
              value: err
          when: r.firstErr == nil
      - return: r.completed == r.launched, r.firstErr
  - of: NewKeyedRateLimiter
    participants:
      - id: caller
        kind: actor
      - id: NewKeyedRateLimiter
        kind: self
      - id: newMisconfigured
        kind: internal
    steps:
      - opt:
          do:
            - return: newMisconfigured(keyedPolicy, "Rate")
              to: newMisconfigured
          when: "!usableRate(cfg.Rate)"
      - opt:
          do:
            - return: newMisconfigured(keyedPolicy, "Key")
              to: newMisconfigured
          when: cfg.Key == nil
      - opt:
          do:
            - return: newMisconfigured(keyedPolicy, "MaxKeys")
              to: newMisconfigured
          when: cfg.MaxKeys <= 0
      - opt:
          do:
            - return: newMisconfigured(keyedPolicy, "IdleTimeout")
              to: newMisconfigured
          when: cfg.IdleTimeout <= 0
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - return: |-
          &keyedLimiter{
          		clk: clk, key: cfg.Key, rate: cfg.Rate, burst: bucketSize(cfg.Burst),
          		idle: cfg.IdleTimeout, limit: cfg.MaxKeys, byKey: make(map[string]*keyedBucket),
          	}
  - of: (*keyedLimiter).Run
    participants:
      - id: caller
        kind: actor
      - id: (*keyedLimiter).Run
        kind: self
      - id: l.bucketOf(l.key(ctx)).take
        kind: internal
      - id: rateLimited
        kind: internal
    steps:
      - opt:
          do:
            - return: rateLimited(wait)
              to: rateLimited
          init:
            bind: admitted, wait
            eval: l.bucketOf(l.key(ctx)).take()
            to: l.bucketOf(l.key(ctx)).take
          when: "!admitted"
      - return: op(ctx)
  - of: (*keyedLimiter).bucketOf
    participants:
      - id: caller
        kind: actor
      - id: (*keyedLimiter).bucketOf
        kind: self
      - id: l.clk.Now
        kind: value
      - id: l.moveFront
        kind: internal
      - id: l.forget
        kind: internal
      - id: l.evict
        kind: internal
      - id: l.pushFront
        kind: internal
    steps:
      - bind: now
        eval: l.clk.Now()
        to: l.clk.Now
      - lock:
          mutex: l.mu
      - opt:
          do:
            - opt:
                do:
                  - set: held.used
                    value: now
                  - eval: l.moveFront(held)
                    to: l.moveFront
                  - return: held.bucket
                when: now.Sub(held.used) < l.idle
            - eval: l.forget(held)
              to: l.forget
          init:
            bind: held, found
            eval: l.byKey[key]
          when: found
      - eval: l.evict(now)
        to: l.evict
      - bind: fresh
        eval: "&keyedBucket{key: key, used: now, bucket: newTokenBucket(l.clk, l.rate, l.burst)}"
      - set: l.byKey[key]
        value: fresh
      - eval: l.pushFront(fresh)
        to: l.pushFront
      - return: fresh.bucket
  - of: (*keyedLimiter).evict
    participants:
      - id: caller
        kind: actor
      - id: (*keyedLimiter).evict
        kind: self
      - id: l.forget
        kind: internal
    steps:
      - loop:
          cond: l.tail != nil
          do:
            - opt:
                do:
                  - return: ""
                when: len(l.byKey) < l.limit && now.Sub(l.tail.used) < l.idle
            - eval: l.forget(l.tail)
              to: l.forget
  - of: (*keyedLimiter).forget
    participants:
      - id: caller
        kind: actor
      - id: (*keyedLimiter).forget
        kind: self
      - id: l.unlink
        kind: internal
    steps:
      - eval: l.unlink(entry)
        to: l.unlink
      - eval: delete(l.byKey, entry.key)
  - of: (*keyedLimiter).pushFront
    steps:
      - set: entry.prev
        value: nil
      - set: entry.next
        value: l.head
      - opt:
          do:
            - set: l.head.prev
              value: entry
          when: l.head != nil
      - set: l.head
        value: entry
      - opt:
          do:
            - set: l.tail
              value: entry
          when: l.tail == nil
  - of: (*keyedLimiter).moveFront
    participants:
      - id: caller
        kind: actor
      - id: (*keyedLimiter).moveFront
        kind: self
      - id: l.unlink
        kind: internal
      - id: l.pushFront
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: l.head == entry
      - eval: l.unlink(entry)
        to: l.unlink
      - eval: l.pushFront(entry)
        to: l.pushFront
  - of: (*keyedLimiter).unlink
    steps:
      - alt:
          - do:
              - set: entry.prev.next
                value: entry.next
            when: entry.prev != nil
          - do:
              - set: l.head
                value: entry.next
            else: true
      - alt:
          - do:
              - set: entry.next.prev
                value: entry.prev
            when: entry.next != nil
          - do:
              - set: l.tail
                value: entry.prev
            else: true
      - set: entry.prev, entry.next
        value: nil, nil
  - of: newMisconfigured
    steps:
      - return: "misconfiguredRunner{policy: policy, knob: knob}"
  - of: misconfiguredRunner.Run
    participants:
      - id: caller
        kind: actor
      - id: misconfiguredRunner.Run
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(coreres.PolicyMisconfigured, kerrs.WrapParams{},
          		kerrs.String("policy", m.policy), kerrs.String("knob", m.knob))
        to: kerrs
  - of: NewRateLimiter
    participants:
      - id: caller
        kind: actor
      - id: NewRateLimiter
        kind: self
      - id: newMisconfigured
        kind: internal
      - id: newTokenBucket
        kind: internal
    steps:
      - opt:
          do:
            - return: newMisconfigured(ratelimitPolicy, "Rate")
              to: newMisconfigured
          when: "!usableRate(cfg.Rate)"
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - bind: bucket
        eval: newTokenBucket(clk, cfg.Rate, bucketSize(cfg.Burst))
        to: newTokenBucket
      - opt:
          do:
            - return: bucket
          when: cfg.MaxWait <= 0
      - bind: waiter, timed
        eval: clk.(clock.Timed)
      - opt:
          do:
            - return: newMisconfigured(ratelimitPolicy, "Clock")
              to: newMisconfigured
          when: "!timed"
      - set: bucket.waiter, bucket.maxWait
        value: waiter, cfg.MaxWait.Seconds()
      - return: bucket
  - of: usableRate
    steps:
      - return: "!math.IsNaN(rate) && !math.IsInf(rate, 0) && rate > 0"
  - of: bucketSize
    steps:
      - opt:
          do:
            - return: oneToken
          when: burst < 1
      - return: float64(burst)
  - of: newTokenBucket
    steps:
      - return: "&tokenBucket{clk: clk, rate: rate, burst: burst, tokens: burst, last: clk.Now()}"
  - of: (*tokenBucket).Run
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBucket).Run
        kind: self
      - id: t.take
        kind: internal
      - id: rateLimited
        kind: internal
      - id: t.await
        kind: internal
    steps:
      - bind: admitted, wait
        eval: t.take()
        to: t.take
      - opt:
          do:
            - return: rateLimited(wait)
              to: rateLimited
          when: "!admitted"
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: t.await(ctx, wait)
                  to: t.await
                when: err != nil
          when: wait > 0
      - return: op(ctx)
  - of: (*tokenBucket).await
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBucket).await
        kind: self
      - id: t.waiter.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: t.giveBack
        kind: internal
      - id: ctx.Err
        kind: value
    steps:
      - bind: timer
        eval: t.waiter.NewTimer(time.Duration(math.Ceil(waitSeconds * nanosPerSecond)))
        to: t.waiter.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: nil
            - comm: <-ctx.Done()
              do:
                - eval: t.giveBack()
                  to: t.giveBack
                - return: ctx.Err()
                  to: ctx.Err
  - of: (*tokenBucket).giveBack
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBucket).giveBack
        kind: self
      - id: t.refill
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - eval: t.refill()
        to: t.refill
      - set: t.tokens
        value: min(t.tokens+oneToken, t.burst)
  - of: rateLimited
    participants:
      - id: caller
        kind: actor
      - id: rateLimited
        kind: self
      - id: wrapAsFields
        kind: internal
    steps:
      - return: wrapAsFields(coreres.RateLimited, kerrs.Float(retryAfterField, waitSeconds))
        to: wrapAsFields
  - of: (*tokenBucket).take
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBucket).take
        kind: self
      - id: t.refill
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - eval: t.refill()
        to: t.refill
      - opt:
          do:
            - op: "-="
              set: t.tokens
              value: oneToken
            - return: true, 0
          when: t.tokens >= oneToken
      - set: waitSeconds
        value: (oneToken - t.tokens) / t.rate
      - opt:
          do:
            - op: "-="
              set: t.tokens
              value: oneToken
            - return: true, waitSeconds
          when: waitSeconds <= t.maxWait
      - return: false, waitSeconds
  - of: (*tokenBucket).refill
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBucket).refill
        kind: self
      - id: t.clk.Now
        kind: value
    steps:
      - bind: now
        eval: t.clk.Now()
        to: t.clk.Now
      - op: +=
        set: t.tokens
        value: now.Sub(t.last).Seconds() * t.rate
      - set: t.last
        value: now
      - opt:
          do:
            - set: t.tokens
              value: t.burst
          when: t.tokens > t.burst
  - of: NewRetry
    participants:
      - id: caller
        kind: actor
      - id: NewRetry
        kind: self
      - id: newRetryRunner
        kind: internal
    steps:
      - opt:
          do:
            - set: cfg.MaxAttempts
              value: minAttempts
          when: cfg.MaxAttempts < minAttempts
      - return: newRetryRunner(cfg)
        to: newRetryRunner
  - of: newRetryRunner
    participants:
      - id: caller
        kind: actor
      - id: newRetryRunner
        kind: self
      - id: kbackoff
        kind: package
      - id: timedOrSystem
        kind: internal
      - id: refusedBudgetKnob
        kind: internal
      - id: newMisconfigured
        kind: internal
    steps:
      - set: cfg.Multiplier
        to: kbackoff
        value: kbackoff.NormalMultiplier(cfg.Multiplier)
      - set: cfg.Jitter
        to: kbackoff
        value: kbackoff.NormalJitter(cfg.Jitter)
      - set: cfg.Clock
        to: timedOrSystem
        value: timedOrSystem(cfg.Clock)
      - opt:
          do:
            - return: newMisconfigured(budgetPolicy, knob)
              to: newMisconfigured
          init:
            bind: knob, refused
            eval: refusedBudgetKnob(cfg.Budget)
            to: refusedBudgetKnob
          when: refused
      - return: "&retryRunner{cfg: cfg}"
  - of: (*retryRunner).Run
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).Run
        kind: self
      - id: r.wait
        kind: internal
      - id: r.recordSuccess
        kind: internal
      - id: ctx.Err
        kind: value
      - id: wrapAs
        kind: internal
    steps:
      - var:
          name: lastErr
          type: error
      - var:
          name: previous
          type: time.Duration
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: waitErr
                      init:
                        bind: waitErr
                        eval: r.wait(ctx, attempt, lastErr, &previous)
                        to: r.wait
                      when: waitErr != nil
                when: attempt > 0
            - set: lastErr
              value: op(ctx)
            - opt:
                do:
                  - eval: r.recordSuccess()
                    to: r.recordSuccess
                  - return: nil
                when: lastErr == nil
            - opt:
                do:
                  - return: ctx.Err()
                    to: ctx.Err
                when: ctx.Err() != nil
            - opt:
                do:
                  - return: lastErr
                when: "!isRetryable(r.cfg.Retryable, lastErr)"
            - opt:
                do:
                  - return: wrapAs(coreres.RetryBudgetExceeded, lastErr)
                    to: wrapAs
                when: "!r.mayRetry(attempt)"
          key: attempt
          range: r.cfg.MaxAttempts
      - return: wrapAs(coreres.RetryExhausted, lastErr)
        to: wrapAs
  - of: (*retryRunner).recordSuccess
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).recordSuccess
        kind: self
      - id: r.cfg.Budget.RecordSuccess
        kind: value
    steps:
      - opt:
          do:
            - eval: r.cfg.Budget.RecordSuccess()
              to: r.cfg.Budget.RecordSuccess
          when: r.cfg.Budget != nil
  - of: (*retryRunner).mayRetry
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).mayRetry
        kind: self
      - id: r.cfg.Budget.RecordFailure
        kind: value
      - id: r.cfg.Budget.AllowRetry
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          when: r.cfg.Budget == nil
      - eval: r.cfg.Budget.RecordFailure()
        to: r.cfg.Budget.RecordFailure
      - opt:
          do:
            - return: "true"
          when: attempt+1 >= r.cfg.MaxAttempts
      - return: r.cfg.Budget.AllowRetry()
        to: r.cfg.Budget.AllowRetry
  - of: (*retryRunner).wait
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).wait
        kind: self
      - id: r.delay
        kind: internal
      - id: timedOrSystem(r.cfg.Clock).NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: ctx.Err
        kind: value
    steps:
      - bind: delay
        eval: r.delay(attempt, failed, previous)
        to: r.delay
      - opt:
          do:
            - eval: r.cfg.OnRetry(attempt, failed, delay)
          when: r.cfg.OnRetry != nil
      - bind: timer
        eval: timedOrSystem(r.cfg.Clock).NewTimer(delay)
        to: timedOrSystem(r.cfg.Clock).NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
            - comm: <-timer.C()
              do:
                - return: nil
  - of: (*retryRunner).delay
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).delay
        kind: self
      - id: capDelay
        kind: internal
      - id: r.curveWait
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: capDelay(imposed, r.cfg.MaxDelay)
                    to: capDelay
                init:
                  bind: imposed, ok
                  eval: r.cfg.Delay(attempt, failed)
                when: ok
          when: r.cfg.Delay != nil
      - set: "*previous"
        to: r.curveWait
        value: r.curveWait(attempt, *previous)
      - return: "*previous"
  - of: (*retryRunner).curveWait
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).curveWait
        kind: self
      - id: kbackoff
        kind: package
      - id: r.jittered
        kind: internal
    steps:
      - switch:
          cases:
            - case: kbackoff.JitterFull
              do:
                - return: kbackoff.Full(r.backoff(attempt))
                  to: kbackoff
            - case: kbackoff.JitterDecorrelated
              do:
                - return: kbackoff.Decorrelate(r.cfg.BaseDelay, r.cfg.MaxDelay, previous)
                  to: kbackoff
            - default: true
              do:
                - return: r.jittered(r.backoff(attempt))
                  to: r.jittered
          "on": r.cfg.JitterMode
  - of: capDelay
    steps:
      - opt:
          do:
            - return: "0"
          when: d < 0
      - opt:
          do:
            - return: ceiling
          when: ceiling > 0 && d > ceiling
      - return: d
  - of: (*retryRunner).backoff
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).backoff
        kind: self
      - id: kbackoff
        kind: package
    steps:
      - return: kbackoff.Grow(r.cfg.BaseDelay, r.cfg.MaxDelay, r.cfg.Multiplier, attempt)
        to: kbackoff
  - of: (*retryRunner).jittered
    participants:
      - id: caller
        kind: actor
      - id: (*retryRunner).jittered
        kind: self
      - id: kbackoff
        kind: package
    steps:
      - return: kbackoff.Widen(delay, r.cfg.Jitter)
        to: kbackoff
  - of: timedOrSystem
    steps:
      - opt:
          do:
            - return: clock.System
          when: clk == nil
      - return: clk
  - of: RetryAfter
    participants:
      - id: caller
        kind: actor
      - id: RetryAfter
        kind: self
      - id: secondsToDuration
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: field.Key() != retryAfterField
            - return: secondsToDuration(field.StringValue())
              to: secondsToDuration
          key: _
          range: slices.Backward(kerrs.FieldsOf(err))
          value: field
      - return: 0, false
  - of: secondsToDuration
    participants:
      - id: caller
        kind: actor
      - id: secondsToDuration
        kind: self
      - id: strconv
        kind: stdlib
      - id: time
        kind: stdlib
    steps:
      - bind: seconds, err
        eval: strconv.ParseFloat(rendered, floatBits)
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: err != nil || math.IsNaN(seconds) || math.IsInf(seconds, 0) || seconds <= 0
      - bind: nanos
        eval: seconds * float64(time.Second)
      - opt:
          do:
            - return: time.Duration(math.MaxInt64), true
              to: time
          when: nanos >= math.MaxInt64
      - return: time.Duration(max(math.Round(nanos), 1)), true
        to: time
  - of: NewRetryBudget
    participants:
      - id: caller
        kind: actor
      - id: NewRetryBudget
        kind: self
      - id: math
        kind: stdlib
      - id: b.tokens.Store
        kind: value
    steps:
      - opt:
          do:
            - return: "refusedBudget{knob: \"MaxTokens\"}"
          when: cfg.MaxTokens <= 0
      - opt:
          do:
            - return: "refusedBudget{knob: \"TokenRatio\"}"
          when: math.IsNaN(cfg.TokenRatio) || math.IsInf(cfg.TokenRatio, 0)
      - bind: ratio
        eval: math.Round(cfg.TokenRatio * float64(milliPerToken))
        to: math
      - opt:
          do:
            - return: "refusedBudget{knob: \"TokenRatio\"}"
          when: ratio < 1
      - bind: maxMilli
        eval: min(int64(cfg.MaxTokens), maxBudgetTokens) * milliPerToken
      - bind: b
        eval: "&tokenBudget{max: maxMilli, ratio: int64(min(ratio, float64(maxMilli)))}"
      - eval: b.tokens.Store(maxMilli)
        to: b.tokens.Store
      - return: b
  - of: (*tokenBudget).AllowRetry
    steps:
      - return: b.tokens.Load()*2 > b.max
  - of: (*tokenBudget).RecordSuccess
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBudget).RecordSuccess
        kind: self
      - id: b.tokens.Load
        kind: value
    steps:
      - loop:
          do:
            - bind: current
              eval: b.tokens.Load()
              to: b.tokens.Load
            - bind: next
              eval: min(current+b.ratio, b.max)
            - opt:
                do:
                  - return: ""
                when: next == current || b.tokens.CompareAndSwap(current, next)
          forever: true
  - of: (*tokenBudget).RecordFailure
    participants:
      - id: caller
        kind: actor
      - id: (*tokenBudget).RecordFailure
        kind: self
      - id: b.tokens.Load
        kind: value
    steps:
      - loop:
          do:
            - bind: current
              eval: b.tokens.Load()
              to: b.tokens.Load
            - bind: next
              eval: max(current-milliPerToken, 0)
            - opt:
                do:
                  - return: ""
                when: next == current || b.tokens.CompareAndSwap(current, next)
          forever: true
  - of: refusedBudget.AllowRetry
    steps:
      - return: "false"
  - of: refusedBudget.RecordSuccess
  - of: refusedBudget.RecordFailure
  - of: refusedBudgetKnob
    steps:
      - bind: refused, ok
        eval: budget.(refusedBudget)
      - return: refused.knob, ok
  - of: isRetryable
    steps:
      - opt:
          do:
            - return: "true"
          when: pred == nil
      - return: pred(err)
  - of: NewAdaptiveThrottle
    participants:
      - id: caller
        kind: actor
      - id: NewAdaptiveThrottle
        kind: self
      - id: resolveThrottle
        kind: internal
      - id: newMisconfigured
        kind: internal
    steps:
      - bind: settings, knob
        eval: resolveThrottle(cfg)
        to: resolveThrottle
      - opt:
          do:
            - return: newMisconfigured(throttlePolicy, knob)
              to: newMisconfigured
          when: knob != ""
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - bind: random
        eval: cfg.Random
      - opt:
          do:
            - set: random
              value: rand.Float64
          when: random == nil
      - return: |-
          &adaptiveThrottle{
          		clk: clk, rejected: cfg.Rejected, random: random, k: settings.k,
          		window: newThrottleWindow(settings, clk.Now()),
          	}
  - of: (*adaptiveThrottle).Run
    participants:
      - id: caller
        kind: actor
      - id: (*adaptiveThrottle).Run
        kind: self
      - id: wrapAs
        kind: internal
      - id: t.accept
        kind: internal
    steps:
      - opt:
          do:
            - return: wrapAs(coreres.Throttled, nil)
              to: wrapAs
          when: t.refuse()
      - bind: err
        eval: op(ctx)
      - opt:
          do:
            - eval: t.accept()
              to: t.accept
          when: t.accepted(ctx, err)
      - return: err
  - of: (*adaptiveThrottle).refuse
    participants:
      - id: caller
        kind: actor
      - id: (*adaptiveThrottle).refuse
        kind: self
      - id: t.window.advance
        kind: internal
      - id: t.window.refusal
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - bind: slot
        eval: t.window.advance(t.clk.Now())
        to: t.window.advance
      - bind: p
        eval: t.window.refusal(t.k)
        to: t.window.refusal
      - op: ++
        set: slot.requests
      - op: ++
        set: t.window.requests
      - opt:
          do:
            - return: "false"
          when: p <= 0
      - return: t.random() < p
  - of: (*adaptiveThrottle).accepted
    steps:
      - opt:
          do:
            - return: "true"
          when: err == nil || ctx.Err() != nil && errors.Is(err, context.Canceled)
      - opt:
          do:
            - return: "false"
          when: t.rejected == nil
      - return: "!t.rejected(err)"
  - of: (*adaptiveThrottle).accept
    participants:
      - id: caller
        kind: actor
      - id: (*adaptiveThrottle).accept
        kind: self
      - id: t.window.advance
        kind: internal
    steps:
      - lock:
          mutex: t.mu
      - bind: slot
        eval: t.window.advance(t.clk.Now())
        to: t.window.advance
      - op: ++
        set: slot.accepts
      - op: ++
        set: t.window.accepts
  - of: resolveThrottle
    steps:
      - bind: settings
        eval: |-
          throttleSettings{
          		k:       orRatio(cfg.K, defaultThrottleK),
          		window:  orDuration(cfg.Window, defaultThrottleWindow),
          		buckets: orInt(cfg.Buckets, defaultWindowBuckets),
          	}
      - switch:
          cases:
            - case: math.IsNaN(settings.k) || math.IsInf(settings.k, 0) || settings.k < minThrottleK
              do:
                - return: settings, "K"
            - case: settings.buckets < 0 || settings.buckets > maxWindowBuckets
              do:
                - return: settings, "Buckets"
            - case: settings.window < 0 || settings.window/time.Duration(settings.buckets) <= 0
              do:
                - return: settings, "Window"
            - default: true
              do:
                - return: settings, ""
  - of: newThrottleWindow
    steps:
      - bind: width
        eval: s.window / time.Duration(s.buckets)
      - return: "throttleWindow{buckets: make([]throttleBucket, s.buckets), width: width, origin: origin, headEnd: width}"
  - of: (*throttleWindow).advance
    participants:
      - id: caller
        kind: actor
      - id: (*throttleWindow).advance
        kind: self
      - id: now.Sub
        kind: value
      - id: w.drop
        kind: internal
      - id: epochEnd
        kind: internal
    steps:
      - bind: "n"
        eval: int64(len(w.buckets))
      - bind: elapsed
        eval: now.Sub(w.origin)
        to: now.Sub
      - opt:
          do:
            - return: "&w.buckets[w.head%n]"
          when: elapsed < w.headEnd
      - bind: epoch
        eval: int64(elapsed / w.width)
      - alt:
          - do:
              - eval: clear(w.buckets)
              - set: w.requests, w.accepts
                value: 0, 0
            when: epoch-w.head >= n
          - do:
              - loop:
                  cond: e <= epoch
                  do:
                    - eval: w.drop(&w.buckets[e%n])
                      to: w.drop
                  init: e := w.head + 1
                  post: e++
            else: true
      - set: w.head
        value: epoch
      - set: w.headEnd
        to: epochEnd
        value: epochEnd(epoch, w.width)
      - return: "&w.buckets[epoch%n]"
  - of: (*throttleWindow).drop
    steps:
      - op: "-="
        set: w.requests
        value: b.requests
      - op: "-="
        set: w.accepts
        value: b.accepts
      - set: "*b"
        value: throttleBucket{}
  - of: (*throttleWindow).refusal
    steps:
      - bind: requests
        eval: float64(w.requests)
      - bind: excess
        eval: requests - k*float64(w.accepts)
      - opt:
          do:
            - return: "0"
          when: excess <= 0
      - return: excess / (requests + 1)
  - of: NewTimeout
    participants:
      - id: caller
        kind: actor
      - id: NewTimeout
        kind: self
      - id: NewTimeoutWith
        kind: internal
    steps:
      - return: "NewTimeoutWith(TimeoutConfig{Duration: d})"
        to: NewTimeoutWith
  - of: NewTimeoutWith
    participants:
      - id: caller
        kind: actor
      - id: NewTimeoutWith
        kind: self
      - id: newMisconfigured
        kind: internal
    steps:
      - opt:
          do:
            - return: newMisconfigured("timeout", "duration")
              to: newMisconfigured
          when: cfg.Duration <= 0
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: nil
          when: clk == clock.System
      - return: "timeoutRunner{timeout: cfg.Duration, clk: clk}"
  - of: timeoutRunner.Run
    participants:
      - id: caller
        kind: actor
      - id: timeoutRunner.Run
        kind: self
      - id: t.derive
        kind: internal
      - id: ctx.Err
        kind: value
      - id: wrapAs
        kind: internal
    steps:
      - bind: dctx, cancel
        eval: t.derive(ctx)
        to: t.derive
      - defer: cancel()
      - bind: err
        eval: op(dctx)
      - opt:
          do:
            - opt:
                do:
                  - return: parentErr
                init:
                  bind: parentErr
                  eval: ctx.Err()
                  to: ctx.Err
                when: parentErr != nil
            - return: wrapAs(coreres.TimeoutExceeded, err)
              to: wrapAs
          when: dctx.Err() == context.DeadlineExceeded || errors.Is(err, context.DeadlineExceeded)
      - return: err
  - of: timeoutRunner.derive
    participants:
      - id: caller
        kind: actor
      - id: timeoutRunner.derive
        kind: self
      - id: context
        kind: stdlib
      - id: newClockDeadline
        kind: internal
    steps:
      - opt:
          do:
            - return: context.WithTimeout(ctx, t.timeout)
              to: context
          when: t.clk == nil
      - return: newClockDeadline(ctx, t.clk, t.timeout)
        to: newClockDeadline
  - of: newClockDeadline
    participants:
      - id: caller
        kind: actor
      - id: newClockDeadline
        kind: self
      - id: parent.Err
        kind: value
      - id: c.finish
        kind: internal
      - id: clk.NewTimer
        kind: value
      - id: c.watch
        kind: internal
    steps:
      - bind: c
        eval: "&clockDeadline{parent: parent, done: make(chan struct{})}"
      - opt:
          do:
            - eval: c.finish(parentErr)
              to: c.finish
            - return: c, func() {}
          init:
            bind: parentErr
            eval: parent.Err()
            to: parent.Err
          when: parentErr != nil
      - bind: timer
        eval: clk.NewTimer(d)
        to: clk.NewTimer
      - bind: release
        eval: make(chan struct{})
      - go: c.watch(timer, release)
        to: c.watch
      - var:
          name: once
          type: sync.Once
      - return: c, func() { once.Do(func() { close(release) }) }
  - of: (*clockDeadline).watch
    participants:
      - id: caller
        kind: actor
      - id: (*clockDeadline).watch
        kind: self
      - id: timer.Stop
        kind: value
      - id: c.finish
        kind: internal
    steps:
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - eval: c.finish(context.DeadlineExceeded)
                  to: c.finish
            - comm: <-c.parent.Done()
              do:
                - eval: c.finish(c.parent.Err())
                  to: c.finish
            - comm: <-release
              do:
                - eval: c.finish(context.Canceled)
                  to: c.finish
  - of: (*clockDeadline).finish
    participants:
      - id: caller
        kind: actor
      - id: (*clockDeadline).finish
        kind: self
      - id: c.closeDone.Do
        kind: value
    steps:
      - lock:
          mutex: c.mu
      - opt:
          do:
            - return: ""
          when: c.err != nil
      - set: c.err
        value: err
      - eval: c.closeDone.Do(func() { close(c.done) })
        to: c.closeDone.Do
  - of: (*clockDeadline).Deadline
    participants:
      - id: caller
        kind: actor
      - id: (*clockDeadline).Deadline
        kind: self
      - id: c.parent.Deadline
        kind: value
    steps:
      - return: c.parent.Deadline()
        to: c.parent.Deadline
  - of: (*clockDeadline).Done
    steps:
      - return: c.done
  - of: (*clockDeadline).Err
    participants:
      - id: caller
        kind: actor
      - id: (*clockDeadline).Err
        kind: self
      - id: c.parent.Err
        kind: value
      - id: c.finish
        kind: internal
    steps:
      - opt:
          do:
            - eval: c.finish(parentErr)
              to: c.finish
          init:
            bind: parentErr
            eval: c.parent.Err()
            to: c.parent.Err
          when: parentErr != nil
      - lock:
          mutex: c.mu
      - return: c.err
  - of: (*clockDeadline).Value
    participants:
      - id: caller
        kind: actor
      - id: (*clockDeadline).Value
        kind: self
      - id: c.parent.Value
        kind: value
    steps:
      - return: c.parent.Value(key)
        to: c.parent.Value
  - of: wrapAs
    participants:
      - id: caller
        kind: actor
      - id: wrapAs
        kind: self
      - id: wrapAsFields
        kind: internal
    steps:
      - opt:
          do:
            - return: sentinel
          when: cause == nil
      - return: wrapAsFields(sentinel, kerrs.String("cause", cause.Error()))
        to: wrapAsFields
  - of: wrapAsFields
    participants:
      - id: caller
        kind: actor
      - id: wrapAsFields
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(sentinel, kerrs.WrapParams{}, fields...)
        to: kerrs
