      - bind: openFor
        eval: cfg.OpenDuration
      - opt:
          do:
            - set: openFor
              value: defaultOpenDuration
          when: openFor <= 0
      - bind: b
        eval: |-
          &circuitBreaker{
          		clk: clk, retryable: cfg.Retryable, onChange: cfg.OnStateChange,
          		threshold: threshold, trials: trials, cooldown: openFor, openFor: openFor, state: coreres.BreakerClosed,
          	}
      - opt:
          do:
            - return: newMisconfigured(breakerPolicy, knob)
              to: newMisconfigured
          init:
            bind: knob
            eval: b.configure(&cfg)
            to: b.configure
          when: knob != ""
      - return: b
  - of: (*circuitBreaker).configure
    participants:
      - id: caller
        kind: actor
      - id: (*circuitBreaker).configure
        kind: self
      - id: resolveWindow
        kind: internal
      - id: newWindow
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: "\"OpenBackoff.BaseDelay\""
                when: cfg.OpenBackoff.BaseDelay <= 0
            - opt:
                do:
                  - return: "\"OpenBackoff.MaxDelay\""
                when: cfg.OpenBackoff.MaxDelay <= 0
            - bind: curve
              eval: "*cfg.OpenBackoff"
            - set: b.backoff
              value: "&curve"
          when: cfg.OpenBackoff != nil
      - opt:
          do:
            - bind: settings, knob
              eval: resolveWindow(*cfg.Window)
              to: resolveWindow
            - opt:
                do:
                  - return: knob
                when: knob != ""
            - set: b.window
              to: newWindow
              value: newWindow(settings, b.clk.Now())
          when: cfg.Window != nil
      - opt:
          do:
            - set: b.queue.changes
              value: make([]phaseChange, 0, changesCapacity)
          when: b.onChange != nil
