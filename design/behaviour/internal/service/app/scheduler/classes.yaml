      - monthNames
      - (*fieldSpec).parse
      - (*fieldSpec).bounds
      - (*fieldSpec).span
      - (*fieldSpec).value
      - (*fieldSpec).rejectToken
      - (*fieldSpec).hintSuffix
      - (*fieldSpec).step
    name: field_spec.go
  - decls:
      - maxEchoRunes
      - rejectExpression
      - rejectSyntax
      - rejectUnreachable
      - rejectLocation
      - rejectInterval
      - clip
      - rangeText
    name: reject.go
  - decls:
      - (*scheduler).Run
      - (*scheduler).loop
