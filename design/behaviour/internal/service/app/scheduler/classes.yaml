# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      cronFieldCount is the number of fields in the accepted dialect: minute,
      hour, day-of-month, month, day-of-week. Five, and only five — see
      rejectFieldCount for why six is refused rather than read as "with seconds".
    items:
      - name: cronFieldCount
        type: int
        value: "5"
    name: cronFieldCount
  - doc: |-
      horizonYears bounds the forward search for a matching instant. It is 9
      because the widest gap a REACHABLE expression can have is Feb 29 across a
      non-leap century year (2096 → 2104, just under eight years); anything that
      finds nothing in nine years matches nothing at all.
    items:
      - name: horizonYears
        type: int
        value: "9"
    name: horizonYears
  - doc: |-
      probeYear anchors the reachability probe. It is a FIXED year, not "now", so
      that parsing the same expression twice always gives the same answer — a
      parser whose verdict depends on the day it runs is a parser that passes CI
      and fails in production. 2000 is a leap year, so a Feb 29 schedule proves
      itself on the first pass.
    items:
      - name: probeYear
        type: int
        value: "2000"
    name: probeYear
  - doc: |-
      The two field counts that identify a neighbouring cron dialect rather than a
      typo: six fields is the seconds dialect, seven adds a year.
    grouped: true
    items:
      - name: secondsDialectFields
        type: int
        value: cronFieldCount + 1
      - name: yearDialectFields
        type: int
        value: cronFieldCount + 2
    name: secondsDialectFields
  - doc: |-
      quartzOperators are the Quartz day-of-month / day-of-week operators this
      parser refuses by name. They are checked only against a token that is
      neither a number nor a known name, so JUL (an L) and WED (a W) are never
      mistaken for them.
    items:
      - name: quartzOperators
        type: string
        value: "\"LW#?\""
    name: quartzOperators
  - doc: |-
      The inclusive bounds of each cron field. Month and weekday are derived from
      package time's own constants rather than written out, so the two numberings
      cannot drift from the ones cursor.weekday and cursor.month report.
    grouped: true
    items:
      - name: minMinute
        type: int
        value: "0"
      - name: maxMinute
        type: int
        value: "59"
      - name: minHour
        type: int
        value: "0"
      - name: maxHour
        type: int
        value: "23"
      - name: minDayOfMonth
        type: int
        value: "1"
      - name: maxDayOfMonth
        type: int
        value: "31"
      - name: minMonth
        type: int
        value: int(time.January)
      - name: maxMonth
        type: int
        value: int(time.December)
      - name: minWeekday
        type: int
        value: int(time.Sunday)
      - name: maxWeekday
        type: int
        value: int(time.Saturday)
    name: minMinute
  - doc: The position of each field in a five-field expression.
    grouped: true
    items:
      - name: minuteField
        type: int
        value: iota
      - name: hourField
      - name: domField
      - name: monthField
      - name: dowField
    name: minuteField
  - doc: |-
      maxEchoRunes caps how much of the caller's own text a refusal echoes into a
      field. The expression is the caller's configuration, not untrusted input, so
      echoing it is what makes the error actionable — but an unbounded echo turns
      one bad config line into a log entry nobody can read.
    items:
      - name: maxEchoRunes
        type: int
        value: "64"
    name: maxEchoRunes
files:
  - decls:
      - Config
    name: config.go
  - decls:
      - cronFieldCount
      - horizonYears
