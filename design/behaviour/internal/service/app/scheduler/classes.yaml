    name: cursor.go
  - decls: []
    name: doc.go
  - decls:
      - entry
      - newEntry
      - (*entry).arm
      - (*entry).due
    name: entry.go
  - decls:
      - Every
    name: every.go
  - decls:
      - quartzOperators
      - minMinute
      - minuteField
