                do:
                  - continue: true
                when: "!keep"
            - opt:
                do:
                  - op: ++
                    set: nextCount[embedded]
                  - opt:
                      do:
                        - set: queued
                          value: "append(queued, jsonLevel{typ: embedded, index: candidate.index})"
                      when: nextCount[embedded] == 1
                  - continue: true
                when: embedded != nil
            - set: grown
              value: append(grown, candidate)
            - opt:
                do:
                  - set: grown
                    value: append(grown, candidate)
                when: twice
          key: index
          range: level.typ.NumField()
      - return: grown, queued
  - of: jsonCandidateOf
    participants:
      - id: caller
        kind: actor
      - id: jsonCandidateOf
        kind: self
      - id: jsonKeyOf
        kind: internal
      - id: fieldType.Elem
        kind: value
    steps:
      - bind: name, ignored
        eval: jsonKeyOf(field)
        to: jsonKeyOf
      - opt:
          do:
            - return: jsonCandidate{}, nil, false
          when: ignored
      - bind: path
        eval: append(slices.Clone(parent), index)
      - bind: fieldType
        eval: field.Type
      - opt:
          do:
            - set: fieldType
              to: fieldType.Elem
              value: fieldType.Elem()
          when: fieldType.Name() == "" && fieldType.Kind() == reflect.Pointer
      - opt:
          do:
            - return: "jsonCandidate{index: path}, fieldType, true"
          when: name == "" && field.Anonymous && fieldType.Kind() == reflect.Struct
      - opt:
          do:
            - return: "jsonCandidate{name: field.Name, index: path}, nil, true"
          when: name == ""
      - return: "jsonCandidate{name: name, index: path, tagged: true}, nil, true"
  - of: jsonKeyOf
    participants:
      - id: caller
        kind: actor
      - id: jsonKeyOf
        kind: self
      - id: derefType
        kind: internal
      - id: field.Tag.Get
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: target, _
        eval: derefType(field.Type)
        to: derefType
      - bind: tag
        eval: field.Tag.Get(jsonTagName)
        to: field.Tag.Get
      - opt:
          do:
            - return: "\"\", true"
          when: "!field.IsExported() && (!field.Anonymous || target.Kind() != reflect.Struct) || tag == \"-\""
      - set: name, _, _
        to: strings
        value: strings.Cut(tag, tagSeparator)
      - opt:
          do:
            - return: "\"\", false"
          when: "!validJSONTagName(name)"
      - return: name, false
  - of: jsonDominant
    participants:
      - id: caller
        kind: actor
      - id: jsonDominant
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: sorted
        eval: slices.Clone(candidates)
        to: slices
      - eval: slices.SortFunc(sorted, compareJSONCandidates)
        to: slices
      - bind: dominant
        eval: make(map[string]bool, len(sorted))
      - loop:
          cond: start < len(sorted)
          do:
            - bind: end
              eval: start + 1
            - loop:
                cond: end < len(sorted) && sorted[end].name == sorted[start].name
                do:
                  - op: ++
                    set: end
            - bind: first
              eval: sorted[start]
            - opt:
                do:
                  - set: dominant[indexKey(first.index)]
                    value: "true"
                when: end-start == 1 || len(sorted[start+1].index) != len(first.index) || sorted[start+1].tagged != first.tagged
            - set: start
              value: end
          init: start := 0
      - return: dominant
  - of: compareJSONCandidates
    participants:
      - id: caller
        kind: actor
      - id: compareJSONCandidates
        kind: self
      - id: strings
        kind: stdlib
      - id: cmp
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: byName
          init:
            bind: byName
            eval: strings.Compare(left.name, right.name)
            to: strings
          when: byName != 0
      - opt:
          do:
            - return: byDepth
          init:
            bind: byDepth
            eval: cmp.Compare(len(left.index), len(right.index))
            to: cmp
          when: byDepth != 0
      - opt:
          do:
            - opt:
                do:
                  - return: "-1"
                when: left.tagged
            - return: "1"
          when: left.tagged != right.tagged
      - return: slices.Compare(left.index, right.index)
        to: slices
  - of: indexKey
    participants:
      - id: caller
        kind: actor
      - id: indexKey
        kind: self
      - id: strconv
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: parts
        eval: make([]string, len(index))
      - loop:
          do:
            - set: parts[position]
              to: strconv
              value: strconv.Itoa(value)
          key: position
          range: index
          value: value
      - return: strings.Join(parts, ".")
        to: strings
  - of: Matches
    participants:
      - id: caller
        kind: actor
      - id: Matches
        kind: self
      - id: regexp
        kind: stdlib
    steps:
      - bind: compiled, compileErr
        eval: regexp.Compile(pattern)
        to: regexp
      - opt:
          do:
            - return: nil, rejectConstraint(rulePattern, compileErr.Error())
          when: compileErr != nil
      - bind: message
        eval: "\"must match the pattern \" + clip(pattern)"
      - return: |-
          func(path, value string) corevalidation.ReportValue {
          		//: MatchString is unanchored by design; see the doc comment.
          		if compiled.MatchString(value) {
          			//: accepted.
          			return nil
          		}
          		//: no match.
          		return one(path, rulePattern, message, corevalidation.CodePatternMismatch)
          	}, nil
  - of: planFor
    participants:
      - id: caller
        kind: actor
      - id: planFor
        kind: self
      - id: planCache.Load
        kind: value
      - id: compileStruct
        kind: internal
      - id: planCache.LoadOrStore
        kind: value
    steps:
      - bind: key
        eval: "planKey{typ: typ, stopAtFirst: stopAtFirst}"
      - opt:
          do:
            - opt:
                do:
                  - return: plan, nil
                init:
                  bind: plan, ok
                  eval: cached.(*structPlan)
                when: ok
          init:
            bind: cached, found
            eval: planCache.Load(key)
            to: planCache.Load
          when: found
      - bind: compiled, compileErr
        eval: compileStruct(typ, stopAtFirst, map[reflect.Type]bool{})
        to: compileStruct
      - opt:
          do:
            - return: nil, compileErr
          when: compileErr != nil
      - bind: actual, _
        eval: planCache.LoadOrStore(key, compiled)
        to: planCache.LoadOrStore
      - opt:
          do:
            - return: plan, nil
          init:
            bind: plan, ok
            eval: actual.(*structPlan)
          when: ok
      - return: compiled, nil
  - of: Required
    participants:
      - id: caller
        kind: actor
      - id: Required
        kind: self
      - id: one
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - return:
          closure:
            params: path string, value T
            results: corevalidation.ReportValue
            steps:
              - opt:
                  do:
                    - return: nil
                  when: value != zero
              - return: one(path, ruleRequired, requiredMessage, corevalidation.CodeRequired)
                to: one
  - of: rejectConstraint
    participants:
      - id: caller
        kind: actor
      - id: rejectConstraint
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corevalidation.ConstraintMisconfigured, errs.WrapParams{},
          		errs.String("rule", rule), errs.String("clause", clause))
        to: errs
  - of: rejectRule
    participants:
      - id: caller
        kind: actor
      - id: rejectRule
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corevalidation.InvalidRule, errs.WrapParams{},
          		errs.String("field", clip(field)), errs.String("rule", clip(rule)),
          		errs.String("clause", clause))
        to: errs
  - of: rejectTarget
    participants:
      - id: caller
        kind: actor
      - id: rejectTarget
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corevalidation.UnsupportedTarget, errs.WrapParams{}, errs.String("kind", kind))
        to: errs
  - of: clip
    steps:
      - bind: runes
        eval: "[]rune(text)"
      - opt:
          do:
            - return: text
          when: len(runes) <= maxEchoRunes
      - return: string(runes[:maxEchoRunes]) + ellipsis
  - of: compileRule
    participants:
      - id: caller
        kind: actor
      - id: compileRule
        kind: self
      - id: strings
        kind: stdlib
      - id: requiredCheck
        kind: internal
      - id: buildNumeric
        kind: internal
      - id: buildLength
        kind: internal
      - id: buildCount
        kind: internal
      - id: buildOneOf
        kind: internal
    steps:
      - bind: rule, arg, hasArg
        eval: strings.Cut(item, argSeparator)
        to: strings
      - opt:
          do:
            - return: nil, rejectRule(name, rule, reason)
          init:
            bind: reason, refused
            eval: refusedRules[rule]
          when: refused
      - switch:
          cases:
            - case: tagRequired
              do:
                - opt:
                    do:
                      - return: nil, rejectRule(name, rule, "required takes no argument")
                    when: hasArg
                - return: requiredCheck(), nil
                  to: requiredCheck
            - case: tagMin, tagMax
              do:
                - return: buildNumeric(name, typ, rule, arg, hasArg)
                  to: buildNumeric
            - case: tagMinLen, tagMaxLen
              do:
                - return: buildLength(name, typ, rule, arg, hasArg)
                  to: buildLength
            - case: tagMinCount, tagMaxCount
              do:
                - return: buildCount(name, typ, rule, arg, hasArg)
                  to: buildCount
            - case: tagOneOf
              do:
                - return: buildOneOf(name, typ, arg, hasArg)
                  to: buildOneOf
            - default: true
              do:
                - return: nil, rejectRule(name, rule, "unknown rule; the dialect is required, min, max, minlen, maxlen, mincount, maxcount, oneof, dive")
          "on": rule
  - of: requiredCheck
    participants:
      - id: caller
        kind: actor
      - id: requiredCheck
        kind: self
      - id: one
        kind: internal
    steps:
      - return:
          closure:
            params: path string, fieldValue reflect.Value
            results: corevalidation.ReportValue
            steps:
              - opt:
                  do:
                    - return: nil
                  when: "!fieldValue.IsZero()"
              - return: one(path, ruleRequired, requiredMessage, corevalidation.CodeRequired)
                to: one
  - of: buildNumeric
    participants:
      - id: caller
        kind: actor
      - id: buildNumeric
        kind: self
      - id: boundRule
        kind: internal
      - id: signedBound
        kind: internal
      - id: unsignedBound
        kind: internal
      - id: floatBound
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejectRule(name, rule, "the rule needs a numeric argument, as in "+rule+"=10")
          when: "!hasArg || arg == \"\""
      - bind: upper
        eval: rule == tagMax
      - bind: message
        eval: boundVerb(upper) + " " + arg
      - bind: reported
        eval: boundRule(upper)
        to: boundRule
      - switch:
          cases:
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: "signedBound(name, rule, arg, typ, boundSpec{upper: upper, rule: reported, message: message})"
                  to: signedBound
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64
              do:
                - return: "unsignedBound(name, rule, arg, typ, boundSpec{upper: upper, rule: reported, message: message})"
                  to: unsignedBound
            - case: reflect.Float32, reflect.Float64
              do:
                - return: "floatBound(name, rule, arg, typ, boundSpec{upper: upper, rule: reported, message: message})"
                  to: floatBound
            - case: reflect.String
              do:
                - return: nil, rejectRule(name, rule, "min and max compare numbers; use minlen or maxlen for a string length")
            - case: reflect.Slice, reflect.Array
              do:
                - return: nil, rejectRule(name, rule, "min and max compare numbers; use mincount or maxcount for an element count")
            - default: true
              do:
                - return: nil, rejectRule(name, rule, "min and max require a numeric field; this field is a "+typ.Kind().String())
          "on": typ.Kind()
  - of: signedBound
    participants:
      - id: caller
        kind: actor
      - id: signedBound
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: limit, parseErr
        eval: strconv.ParseInt(arg, decimalBase, typ.Bits())
        to: strconv
      - opt:
          do:
            - return: nil, rejectRule(name, rule, literalClause(parseErr, "the argument", "is not a whole number", typ))
          when: parseErr != nil
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: inclusive on both sides.
          		if withinBound(fieldValue.Int() >= limit, fieldValue.Int() <= limit, spec.upper) {
          			//: accepted.
          			return nil
          		}
          		//: outside the bound.
          		return one(path, spec.rule, spec.message, corevalidation.CodeOutOfRange)
          	}, nil
  - of: unsignedBound
    participants:
      - id: caller
        kind: actor
      - id: unsignedBound
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: limit, parseErr
        eval: strconv.ParseUint(arg, decimalBase, typ.Bits())
        to: strconv
      - opt:
          do:
            - return: nil, rejectRule(name, rule, literalClause(parseErr, "the argument", "is not a non-negative whole number", typ))
          when: parseErr != nil
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: inclusive on both sides.
          		if withinBound(fieldValue.Uint() >= limit, fieldValue.Uint() <= limit, spec.upper) {
          			//: accepted.
          			return nil
          		}
          		//: outside the bound.
          		return one(path, spec.rule, spec.message, corevalidation.CodeOutOfRange)
          	}, nil
  - of: floatBound
    participants:
      - id: caller
        kind: actor
      - id: floatBound
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: limit, parseErr
        eval: strconv.ParseFloat(arg, typ.Bits())
        to: strconv
      - opt:
          do:
            - return: nil, rejectRule(name, rule, literalClause(parseErr, "the argument", "is not a number", typ))
          when: parseErr != nil
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: inclusive on both sides.
          		if withinBound(fieldValue.Float() >= limit, fieldValue.Float() <= limit, spec.upper) {
          			//: accepted.
          			return nil
          		}
          		//: outside the bound.
          		return one(path, spec.rule, spec.message, corevalidation.CodeOutOfRange)
          	}, nil
  - of: literalClause
    steps:
      - opt:
          do:
            - return: subject + " is out of range for this field's kind (" + typ.Kind().String() + ")"
          when: errors.Is(parseErr, strconv.ErrRange)
      - return: subject + " " + malformed
  - of: withinBound
    steps:
      - opt:
          do:
            - return: atMost
          when: upper
      - return: atLeast
  - of: boundVerb
    steps:
      - opt:
          do:
            - return: "\"must be at most\""
          when: upper
      - return: "\"must be at least\""
  - of: countVerb
    steps:
      - opt:
          do:
            - return: "\"must contain at most\""
          when: upper
      - return: "\"must contain at least\""
  - of: boundRule
    steps:
      - opt:
          do:
            - return: ruleMax
          when: upper
      - return: ruleMin
  - of: buildLength
    participants:
      - id: caller
        kind: actor
      - id: buildLength
        kind: self
      - id: parseSize
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejectRule(name, rule, "the rule needs a whole-number argument, as in "+rule+"=3")
          when: "!hasArg || arg == \"\""
      - opt:
          do:
            - return: nil, rejectRule(name, rule, "minlen and maxlen measure a string in runes; use mincount or maxcount for an element count")
          when: typ.Kind() != reflect.String
      - bind: limit, limitErr
        eval: parseSize(name, rule, arg)
        to: parseSize
      - opt:
          do:
            - return: nil, limitErr
          when: limitErr != nil
      - bind: upper
        eval: rule == tagMaxLen
      - bind: message
        eval: boundVerb(upper) + " " + arg + " characters long"
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: RuneCountInString walks the bytes once and allocates nothing.
          		size := utf8.RuneCountInString(fieldValue.String())
          		//: inclusive on both sides.
          		if withinBound(size >= limit, size <= limit, upper) {
          			//: accepted.
          			return nil
          		}
          		//: outside the bound.
          		return one(path, ruleLength, message, corevalidation.CodeLengthOutOfRange)
          	}, nil
  - of: buildCount
    participants:
      - id: caller
        kind: actor
      - id: buildCount
        kind: self
      - id: parseSize
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejectRule(name, rule, "the rule needs a whole-number argument, as in "+rule+"=1")
          when: "!hasArg || arg == \"\""
      - opt:
          do:
            - return: nil, rejectRule(name, rule, "mincount and maxcount count elements; use minlen or maxlen for a string length")
          when: typ.Kind() != reflect.Slice && typ.Kind() != reflect.Array
      - bind: limit, limitErr
        eval: parseSize(name, rule, arg)
        to: parseSize
      - opt:
          do:
            - return: nil, limitErr
          when: limitErr != nil
      - bind: upper
        eval: rule == tagMaxCount
      - bind: message
        eval: countVerb(upper) + " " + arg + " items"
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: a nil slice has length 0 — it holds nothing, which is the honest
          		//: answer to "how many".
          		size := fieldValue.Len()
          		//: inclusive on both sides.
          		if withinBound(size >= limit, size <= limit, upper) {
          			//: accepted.
          			return nil
          		}
          		//: outside the bound.
          		return one(path, ruleCount, message, corevalidation.CodeLengthOutOfRange)
          	}, nil
  - of: parseSize
    participants:
      - id: caller
        kind: actor
      - id: parseSize
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: parsed, parseErr
        eval: strconv.Atoi(arg)
        to: strconv
      - opt:
          do:
            - return: 0, rejectRule(name, rule, "the argument is not a whole number")
          when: parseErr != nil
      - opt:
          do:
            - return: 0, rejectRule(name, rule, "the size is negative")
          when: parsed < 0
      - return: parsed, nil
  - of: buildOneOf
    participants:
      - id: caller
        kind: actor
      - id: buildOneOf
        kind: self
      - id: splitAllowed
        kind: internal
      - id: stringOneOf
        kind: internal
      - id: signedOneOf
        kind: internal
      - id: unsignedOneOf
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejectRule(name, tagOneOf, "the rule needs a '|'-separated list, as in oneof=red|green|blue")
          when: "!hasArg || arg == \"\""
      - bind: values
        eval: splitAllowed(arg)
        to: splitAllowed
      - opt:
          do:
            - return: nil, rejectRule(name, tagOneOf, "the allowed set is empty")
          when: len(values) == 0
      - switch:
          cases:
            - case: reflect.String
              do:
                - return: stringOneOf(values), nil
                  to: stringOneOf
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: signedOneOf(name, values, typ)
                  to: signedOneOf
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64
              do:
                - return: unsignedOneOf(name, values, typ)
                  to: unsignedOneOf
            - default: true
              do:
                - return: |-
                    nil, rejectRule(name, tagOneOf,
                    			"oneof requires a string or integer field; this field is a "+typ.Kind().String())
          "on": typ.Kind()
  - of: splitAllowed
    participants:
      - id: caller
        kind: actor
      - id: splitAllowed
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: parts
        eval: strings.Split(arg, oneOfSeparator)
        to: strings
      - bind: values
        eval: make([]string, 0, len(parts))
      - loop:
          do:
            - bind: trimmed
              eval: strings.TrimSpace(part)
              to: strings
            - opt:
                do:
                  - continue: true
                when: trimmed == ""
            - set: values
              value: append(values, trimmed)
          key: _
          range: parts
          value: part
      - return: values
  - of: stringOneOf
    participants:
      - id: caller
        kind: actor
      - id: stringOneOf
        kind: self
      - id: oneOfMessage
        kind: internal
      - id: one
        kind: internal
    steps:
      - bind: set
        eval: make(map[string]struct{}, len(values))
      - loop:
          do:
            - set: set[value]
              value: struct{}{}
          key: _
          range: values
          value: value
      - bind: message
        eval: oneOfMessage(values)
        to: oneOfMessage
      - return:
          closure:
            params: path string, fieldValue reflect.Value
            results: corevalidation.ReportValue
            steps:
              - opt:
                  do:
                    - return: nil
                  init:
                    bind: _, ok
                    eval: set[fieldValue.String()]
                  when: ok
              - return: one(path, ruleOneOf, message, corevalidation.CodeNotInSet)
                to: one
  - of: signedOneOf
    participants:
      - id: caller
        kind: actor
      - id: signedOneOf
        kind: self
      - id: strconv
        kind: stdlib
      - id: oneOfMessage
        kind: internal
    steps:
      - bind: set
        eval: make(map[int64]struct{}, len(values))
      - bind: parsed
        eval: make([]int64, 0, len(values))
      - loop:
          do:
            - bind: number, parseErr
              eval: strconv.ParseInt(value, decimalBase, typ.Bits())
              to: strconv
            - opt:
                do:
                  - return: nil, rejectRule(name, tagOneOf, literalClause(parseErr, "the entry "+clip(value), "is not a whole number", typ))
                when: parseErr != nil
            - set: set[number]
              value: struct{}{}
            - set: parsed
              value: append(parsed, number)
          key: _
          range: values
          value: value
      - bind: message
        eval: oneOfMessage(parsed)
        to: oneOfMessage
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: membership.
          		if _, ok := set[fieldValue.Int()]; ok {
          			//: accepted.
          			return nil
          		}
          		//: outside the set.
          		return one(path, ruleOneOf, message, corevalidation.CodeNotInSet)
          	}, nil
  - of: unsignedOneOf
    participants:
      - id: caller
        kind: actor
      - id: unsignedOneOf
        kind: self
      - id: strconv
        kind: stdlib
      - id: oneOfMessage
        kind: internal
    steps:
      - bind: set
        eval: make(map[uint64]struct{}, len(values))
      - bind: parsed
        eval: make([]uint64, 0, len(values))
      - loop:
          do:
            - bind: number, parseErr
              eval: strconv.ParseUint(value, decimalBase, typ.Bits())
              to: strconv
            - opt:
                do:
                  - return: nil, rejectRule(name, tagOneOf, literalClause(parseErr, "the entry "+clip(value), "is not a non-negative whole number", typ))
                when: parseErr != nil
            - set: set[number]
              value: struct{}{}
            - set: parsed
              value: append(parsed, number)
          key: _
          range: values
          value: value
      - bind: message
        eval: oneOfMessage(parsed)
        to: oneOfMessage
      - return: |-
          func(path string, fieldValue reflect.Value) corevalidation.ReportValue {
          		//: membership.
          		if _, ok := set[fieldValue.Uint()]; ok {
          			//: accepted.
          			return nil
          		}
          		//: outside the set.
          		return one(path, ruleOneOf, message, corevalidation.CodeNotInSet)
          	}, nil
  - of: OneOf
    participants:
      - id: caller
        kind: actor
      - id: OneOf
        kind: self
      - id: oneOfMessage
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejectConstraint(ruleOneOf, "the allowed set is empty")
          when: len(allowed) == 0
      - bind: set
        eval: make(map[T]struct{}, len(allowed))
      - loop:
          do:
            - set: set[value]
              value: struct{}{}
          key: _
          range: allowed
          value: value
      - bind: message
        eval: oneOfMessage(allowed)
        to: oneOfMessage
      - return: |-
          func(path string, value T) corevalidation.ReportValue {
          		//: membership.
          		if _, ok := set[value]; ok {
          			//: accepted.
          			return nil
          		}
          		//: outside the set.
          		return one(path, ruleOneOf, message, corevalidation.CodeNotInSet)
          	}, nil
  - of: oneOfMessage
    participants:
      - id: caller
        kind: actor
      - id: oneOfMessage
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - bind: shown
        eval: min(len(allowed), maxListedValues)
      - bind: rendered
        eval: make([]string, 0, shown)
      - loop:
          do:
            - set: rendered
              value: append(rendered, fmt.Sprintf("%v", value))
          key: _
          range: allowed[:shown]
          value: value
      - opt:
          do:
            - return: "\"must be one of: \" + strings.Join(rendered, listSeparator)"
          when: shown == len(allowed)
      - return: |-
          fmt.Sprintf("must be one of: %s (and %d more)",
          		strings.Join(rendered, listSeparator), len(allowed)-shown)
        to: fmt
  - of: Length
    participants:
      - id: caller
        kind: actor
      - id: Length
        kind: self
      - id: checkSizeBounds
        kind: internal
      - id: sizeMessage
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: checkSizeBounds(ruleLength, minRunes, maxRunes)
            to: checkSizeBounds
          when: err != nil
      - bind: message
        eval: sizeMessage("must be", "characters long", minRunes, maxRunes)
        to: sizeMessage
      - return: |-
          func(path, value string) corevalidation.ReportValue {
          		//: RuneCountInString walks the bytes once and allocates nothing.
          		if withinSize(utf8.RuneCountInString(value), minRunes, maxRunes) {
          			//: accepted.
          			return nil
          		}
          		//: outside the interval.
          		return one(path, ruleLength, message, corevalidation.CodeLengthOutOfRange)
          	}, nil
  - of: Count
    participants:
      - id: caller
        kind: actor
      - id: Count
        kind: self
      - id: checkSizeBounds
        kind: internal
      - id: sizeMessage
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: checkSizeBounds(ruleCount, minLen, maxLen)
            to: checkSizeBounds
          when: err != nil
      - bind: message
        eval: sizeMessage("must contain", "items", minLen, maxLen)
        to: sizeMessage
      - return: |-
          func(path string, value []E) corevalidation.ReportValue {
          		//: a nil slice has length 0, which is the honest answer: it holds
          		//: nothing. Count(1, …) therefore refuses nil and empty alike.
          		if withinSize(len(value), minLen, maxLen) {
          			//: accepted.
          			return nil
          		}
          		//: outside the interval.
          		return one(path, ruleCount, message, corevalidation.CodeLengthOutOfRange)
          	}, nil
  - of: checkSizeBounds
    participants:
      - id: caller
        kind: actor
      - id: checkSizeBounds
        kind: self
      - id: rejectConstraint
        kind: internal
    steps:
      - opt:
          do:
            - return: rejectConstraint(rule, "the minimum size is negative")
              to: rejectConstraint
          when: low < 0
      - opt:
          do:
            - return: rejectConstraint(rule, "the maximum size is negative and is not Unbounded")
              to: rejectConstraint
          when: high < 0 && high != Unbounded
      - opt:
          do:
            - return: rejectConstraint(rule, "the minimum size is greater than the maximum")
              to: rejectConstraint
          when: high != Unbounded && low > high
      - return: nil
  - of: withinSize
    steps:
      - opt:
          do:
            - return: "false"
          when: size < low
      - opt:
          do:
            - return: "true"
          when: high == Unbounded
      - return: size <= high
  - of: sizeMessage
    participants:
      - id: caller
        kind: actor
      - id: sizeMessage
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - return: fmt.Sprintf("%s %d %s %s", verb, low, unboundedSuffix, noun)
              to: fmt
          when: high == Unbounded
      - return: fmt.Sprintf("%s between %d and %d %s", verb, low, high, noun)
        to: fmt
  - of: Struct
    participants:
      - id: caller
        kind: actor
      - id: Struct
        kind: self
      - id: planFor
        kind: internal
    steps:
      - bind: typ
        eval: reflect.TypeFor[T]()
      - opt:
          do:
            - return: nil, rejectTarget(typ.Kind().String())
          when: typ.Kind() != reflect.Struct
      - bind: plan, planErr
        eval: planFor(typ, cfg.StopAtFirst)
        to: planFor
      - opt:
          do:
            - return: nil, planErr
          when: planErr != nil
      - return: |-
          func(path string, value T) corevalidation.ReportValue {
          		//: run the plan from the caller's path.
          		return plan.run(path, reflect.ValueOf(value))
          	}, nil
  - of: All
    participants:
      - id: caller
        kind: actor
      - id: All
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: fixed
        eval: slices.Clone(constraints)
        to: slices
      - return:
          closure:
            params: path string, value T
            results: corevalidation.ReportValue
            steps:
              - var:
                  name: report
                  type: corevalidation.ReportValue
              - loop:
                  do:
                    - opt:
                        do:
                          - continue: true
                        when: constraint == nil
                    - set: report
                      value: append(report, constraint(path, value)...)
                  key: _
                  range: fixed
                  value: constraint
              - return: report
  - of: First
    participants:
      - id: caller
        kind: actor
      - id: First
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: fixed
        eval: slices.Clone(constraints)
        to: slices
      - return:
          closure:
            params: path string, value T
            results: corevalidation.ReportValue
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - continue: true
                        when: constraint == nil
                    - opt:
                        do:
                          - return: report
                        init:
                          bind: report
                          eval: constraint(path, value)
                        when: "!report.OK()"
                  key: _
                  range: fixed
                  value: constraint
              - return: nil
  - of: Check
    participants:
      - id: caller
        kind: actor
      - id: Check
        kind: self
      - id: All(constraints...)(corevalidation.RootPath, value).Err
        kind: value
    steps:
      - return: All(constraints...)(corevalidation.RootPath, value).Err()
        to: All(constraints...)(corevalidation.RootPath, value).Err
  - of: one
    steps:
      - return: |-
          corevalidation.ReportValue{{
          		Path:    path,
          		Rule:    rule,
          		Message: message,
          		Code:    code,
          	}}
