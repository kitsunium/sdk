            - set: members
              value: "append(members, reachMember{name: pathName(field), index: path})"
          key: index
          range: typ.NumField()
      - return: members
  - of: jsonCandidates
    participants:
      - id: caller
        kind: actor
      - id: jsonCandidates
        kind: self
      - id: scanJSONLevel
        kind: internal
    steps:
      - var:
          name: candidates
          type: "[]jsonCandidate"
      - var:
          name: current
          type: "[]jsonLevel"
      - bind: next
        eval: "[]jsonLevel{{typ: typ}}"
      - bind: count, nextCount
        eval: map[reflect.Type]int{}, map[reflect.Type]int{}
      - bind: visited
        eval: map[reflect.Type]bool{}
      - loop:
          cond: len(next) > 0
          do:
            - set: current, next
              value: next, current[:0]
            - set: count, nextCount
              value: nextCount, count
            - eval: clear(nextCount)
            - loop:
                do:
                  - opt:
                      do:
                        - continue: true
                      when: visited[level.typ]
                  - set: visited[level.typ]
                    value: "true"
                  - set: candidates, next
                    to: scanJSONLevel
                    value: scanJSONLevel(level, count[level.typ] > 1, candidates, next, nextCount)
                key: _
                range: current
                value: level
      - return: candidates
  - of: scanJSONLevel
