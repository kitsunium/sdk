      - bind: message
        eval: fmt.Sprintf("must be at least %v", lo)
        to: fmt
      - return:
          closure:
            params: path string, value T
            results: corevalidation.ReportValue
            steps:
              - opt:
                  do:
                    - return: nil
                  when: value >= lo
              - return: one(path, ruleMin, message, corevalidation.CodeOutOfRange)
                to: one
  - of: AtMost
    participants:
      - id: caller
        kind: actor
      - id: AtMost
        kind: self
      - id: fmt
        kind: stdlib
      - id: one
        kind: internal
    steps:
      - bind: message
        eval: fmt.Sprintf("must be at most %v", hi)
        to: fmt
      - return:
          closure:
            params: path string, value T
            results: corevalidation.ReportValue
            steps:
              - opt:
                  do:
                    - return: nil
                  when: value <= hi
              - return: one(path, ruleMax, message, corevalidation.CodeOutOfRange)
                to: one
  - of: Between
    participants:
      - id: caller
        kind: actor
      - id: Between
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, rejectConstraint(ruleBetween, "the minimum is greater than the maximum")
          when: lo > hi
      - bind: message
        eval: fmt.Sprintf("must be between %v and %v", lo, hi)
        to: fmt
      - return: |-
          func(path string, value T) corevalidation.ReportValue {
          		//: closed interval on both ends.
          		if value >= lo && value <= hi {
          			//: accepted.
          			return nil
          		}
          		//: outside the interval; the message does not say which end, because
          		//: telling the caller "too large" for a value they must not see back
          		//: adds nothing they cannot infer from the bounds.
          		return one(path, ruleBetween, message, corevalidation.CodeOutOfRange)
          	}, nil
