      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: field.Anonymous
            - bind: name, ignored
              eval: jsonKeyOf(field)
              to: jsonKeyOf
            - opt:
                do:
                  - continue: true
                when: ignored
            - opt:
                do:
                  - set: name
                    value: field.Name
                when: name == ""
            - opt:
                do:
                  - return: "false"
                when: slices.Contains(keys, name)
            - set: keys
              value: append(keys, name)
          key: field
          range: typ.Fields()
      - return: "true"
  - of: constrainedMembers
    participants:
      - id: caller
        kind: actor
      - id: constrainedMembers
        kind: self
      - id: typ.Field
        kind: value
      - id: field.Tag.Get
        kind: value
      - id: derefType
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: visiting[typ]
      - var:
          name: members
          type: "[]reachMember"
      - set: visiting[typ]
        value: "true"
      - defer: delete(visiting, typ)
      - loop:
