# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      jsonTagName is the tag the compiler reads to name a field in a PATH.

      It is json rather than the Go field name because of a fact about this SDK,
      not a preference: internal/service/app/config.Load decodes every format — TOML,
      YAML, env, JSON — through a json.Marshal/json.Unmarshal round trip, so the
      json tag is literally the key the operator wrote in their file. A path built
      from Go field names would name something the operator never typed.
    items:
      - name: jsonTagName
        type: string
        value: "\"json\""
    name: jsonTagName
  - doc: tagSeparator splits the rules inside one validate tag.
    items:
      - name: tagSeparator
        type: string
        value: "\",\""
    name: tagSeparator
  - doc: diveRule descends into a nested struct, or into the elements of a slice.
    items:
      - name: diveRule
        type: string
        value: "\"dive\""
    name: diveRule
  - doc: |-
      ruleField and ruleEach name the descent combinators in a construction
      refusal. They never appear on a ViolationValue — a descent does not fail,
      it relocates.
    grouped: true
    items:
      - name: ruleField
        type: string
        value: "\"field\""
      - name: ruleEach
        type: string
        value: "\"each\""
    name: ruleField
  - doc: |-
      jsonTagPunctuation is the punctuation encoding/json accepts in a tag name;
      any other non-letter, non-digit rune makes it ignore the name.
    items:
      - name: jsonTagPunctuation
        type: string
        value: "\"!#$%&()*+-./:;<=>?@[]^_{|}~ \""
    name: jsonTagPunctuation
  - doc: requiredMessage is the fixed, value-free explanation of a presence failure.
    items:
      - name: requiredMessage
        type: string
        value: "\"is required\""
    name: requiredMessage
  - doc: |-
      maxEchoRunes caps how much of the caller's own text a refusal echoes into a
      field. A tag and a field name are the caller's source, not untrusted input,
      so echoing them is what makes the refusal actionable — but an unbounded echo
      turns one bad tag into a log entry nobody can read.
    items:
      - name: maxEchoRunes
        type: int
        value: "64"
    name: maxEchoRunes
  - doc: ellipsis marks a clipped echo.
    items:
      - name: ellipsis
        type: string
        value: "\"…\""
    name: ellipsis
  - grouped: true
    items:
      - doc: ruleRequired names the presence rule.
        name: ruleRequired
        type: string
        value: "\"required\""
      - doc: ruleMin names the lower numeric bound.
        name: ruleMin
        type: string
        value: "\"min\""
      - doc: ruleMax names the upper numeric bound.
        name: ruleMax
        type: string
        value: "\"max\""
      - doc: ruleBetween names the closed numeric interval.
        name: ruleBetween
        type: string
        value: "\"between\""
      - doc: ruleLength names the rune-count rule on a string.
        name: ruleLength
        type: string
        value: "\"length\""
      - doc: ruleCount names the element-count rule on a slice or array.
        name: ruleCount
        type: string
        value: "\"count\""
      - doc: ruleOneOf names set membership.
        name: ruleOneOf
        type: string
        value: "\"one_of\""
      - doc: rulePattern names the regular-expression rule.
        name: rulePattern
        type: string
        value: "\"pattern\""
    name: ruleRequired
  - doc: argSeparator splits a rule from its argument inside one tag item.
    items:
      - name: argSeparator
        type: string
        value: "\"=\""
    name: argSeparator
  - doc: |-
      The accepted rule names. This list is the dialect; it is closed on purpose,
      and every entry is a rule the SDK undertakes to maintain forever.
    grouped: true
    items:
      - name: tagRequired
        type: string
        value: "\"required\""
      - name: tagMin
        type: string
        value: "\"min\""
      - name: tagMax
        type: string
        value: "\"max\""
      - name: tagMinLen
        type: string
        value: "\"minlen\""
      - name: tagMaxLen
        type: string
        value: "\"maxlen\""
      - name: tagMinCount
        type: string
        value: "\"mincount\""
      - name: tagMaxCount
        type: string
        value: "\"maxcount\""
      - name: tagOneOf
        type: string
        value: "\"oneof\""
    name: tagRequired
  - doc: decimalBase is the radix every tag argument is parsed in.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      oneOfSeparator splits the allowed values of a oneof rule. It is '|' rather
      than ',' because ',' already separates the rules of the tag itself, and a
      list that could be cut in half by the outer separator is a list that will be.
    items:
      - name: oneOfSeparator
        type: string
        value: "\"|\""
    name: oneOfSeparator
  - doc: |-
      maxListedValues caps how many allowed values a OneOf message enumerates. The
      allowed set is the caller's own schema, so echoing it is safe and is what
      makes the message actionable — but a 500-entry enum in a message helps
      nobody.
    items:
      - name: maxListedValues
        type: int
        value: "12"
    name: maxListedValues
  - doc: listSeparator joins the enumerated allowed values.
    items:
      - name: listSeparator
        type: string
        value: "\", \""
    name: listSeparator
  - doc: |-
      Unbounded is the upper bound that means "no ceiling". It is spelled rather
      than implied by a negative number so a reader of Length(8, Unbounded) does
      not have to know the convention to understand the line.
    items:
      - name: Unbounded
        type: int
        value: "-1"
    name: Unbounded
  - doc: unboundedSuffix renders the upper half of an open-ended interval.
    items:
      - name: unboundedSuffix
        type: string
        value: "\"or more\""
    name: unboundedSuffix
  - doc: tagName is the struct tag the compiler reads.
    items:
      - name: tagName
        type: string
        value: "\"validate\""
    name: tagName
