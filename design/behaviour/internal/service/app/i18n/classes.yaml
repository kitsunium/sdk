# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The three constants the qvalue grammar is written in.
    grouped: true
    items:
      - doc: |-
          qualityScale is the number of fraction digits RFC 9110 §12.4.2 allows —
          exactly three, which is why an integer in thousandths is exact rather
          than an approximation of the float.
        name: qualityScale
        type: int
        value: "3"
      - doc: digitBase is ten, because that is what a decimal DIGIT is worth.
        name: digitBase
        type: int
        value: "10"
      - doc: qualityParam is the one parameter name this header defines.
        name: qualityParam
        type: string
        value: "\"q\""
      - doc: |-
          integerPartLen is the width of a qvalue with no fraction at all: "0"
          and "1" are complete qvalues.
        name: integerPartLen
        type: int
        value: "1"
      - doc: |-
          decimalPointOffset is where the "." sits in "0.ddd", and
          fractionOffset is where the digits start.
        name: decimalPointOffset
        type: int
        value: "1"
      - name: fractionOffset
        type: int
        value: "2"
    name: qualityScale
  - doc: |-
      exitConfig matches sysexits EX_CONFIG (78), the status
      corei18n.CatalogLoadFailed carries: a catalogue that cannot be read is
      refused forever, and the fix is a deployment or a catalogue edit.
    items:
      - name: exitConfig
        type: int
        value: "78"
    name: exitConfig
  - doc: |-
      expectedCatalogueKeys sizes the decode map. It is a HINT and never a bound:
      a catalogue with more keys grows the map exactly as it would have without
      it, and one with fewer wastes a few buckets at startup. Sixty-four is a
      small application's whole message set and a large one's first page.
    items:
      - name: expectedCatalogueKeys
        type: int
        value: "64"
    name: expectedCatalogueKeys
  - doc: |-
      maxRanges bounds how many Accept-Language elements one header contributes.

      A header is written by a stranger and can be arbitrarily long; parsing all
      of it would let a client spend the server's time on its own behalf. Thirty
      two is far past what any real client sends — browsers send between one and
      six — and the elements beyond it are IGNORED rather than treated as an
      error, because failing a request over a peculiar header is the mistake this
      whole file is written to avoid.
    items:
      - name: maxRanges
        type: int
        value: "32"
    name: maxRanges
  - doc: |-
      defaultQuality is the weight of an element that carries no "q" parameter.
      RFC 9110 §12.4.2 fixes it at 1.
    items:
      - name: defaultQuality
        type: int
        value: "1000"
    name: defaultQuality
  - doc: wildcardRange is the one range RFC 4647 §3.4 says to skip during Lookup.
    items:
      - name: wildcardRange
        type: string
        value: "\"*\""
    name: wildcardRange
  - doc: |-
      braces is the set the compiler scans for. Everything else in a pattern is
      literal, including "%", "$", "#" and every other character another
      templating syntax would have claimed.
    items:
      - name: braces
        type: string
        value: "\"{}\""
    name: braces
  - doc: "escapeLen is the width of a doubled brace: two bytes in, one byte out."
    items:
      - name: escapeLen
        type: int
        value: "2"
    name: escapeLen
  - doc: |-
      The numbers CLDR's clauses are written against. They are named rather than
      inlined because a rule table is exactly the kind of code where a stray digit
      is invisible: "i % 100 != 12..14" and "i % 100 != 11..14" differ by one
      character and by one language.
    grouped: true
    items:
      - doc: |-
          million is the modulus CLDR's Romance `many` clause is written against.
          It is the compact-decimal category — "1 million", "2 milhões" — and it
          is the only place in this table where a clause about e (the compact
          exponent) is implemented at e = 0. See [PluralValue] and ADR 0063 §D1.
        name: million
        type: uint64
        value: "1_000_000"
      - doc: |-
          tenModulus and hundredModulus are the two operands every Slavic and
          Semitic clause is written over.
        name: tenModulus
        type: uint64
        value: "10"
      - name: hundredModulus
        type: uint64
        value: "100"
      - doc: singularValue and dualValue are the exact quantities Arabic names.
        name: singularValue
        type: uint64
        value: "1"
      - name: dualValue
        type: uint64
        value: "2"
      - doc: |-
          slavicFewLow..slavicFewHigh is "i % 10 = 2..4", the Polish and Russian
          `few` clause.
        name: slavicFewLow
        type: uint64
        value: "2"
      - name: slavicFewHigh
        type: uint64
        value: "4"
      - doc: slavicManyLow..slavicManyHigh is "i % 10 = 5..9", shared by both.
        name: slavicManyLow
        type: uint64
        value: "5"
      - name: slavicManyHigh
        type: uint64
        value: "9"
      - doc: |-
          polishTeenLow..teenHigh is "i % 100 = 12..14" — the exception that
          pulls 12, 13 and 14 out of `few` and into `many`.
        name: polishTeenLow
        type: uint64
        value: "12"
      - name: teenHigh
        type: uint64
        value: "14"
      - doc: |-
          russianTeenLow is 11: Russian's `many` clause starts one lower than
          Polish's, which is the whole difference between 11 in the two
          languages.
        name: russianTeenLow
        type: uint64
        value: "11"
      - doc: arabicFewLow..arabicFewHigh is "n % 100 = 3..10".
        name: arabicFewLow
        type: uint64
        value: "3"
      - name: arabicFewHigh
        type: uint64
        value: "10"
      - doc: |-
          arabicManyLow is the start of "n % 100 = 11..99"; its upper bound is
          the modulus itself, so it needs no constant.
        name: arabicManyLow
        type: uint64
        value: "11"
    name: million
  - doc: |-
      chainSeparator joins the languages a failed lookup tried, for the operator's
      field.
    items:
      - name: chainSeparator
        type: string
        value: "\" \""
    name: chainSeparator
  - doc: |-
      The subtag shapes the parser places by length; whether a subtag's
      characters are right for its position is corei18n.NewTag's to judge.
    grouped: true
    items:
      - doc: |-
          maxTagBytes is the length of "fil-Hant-419", the longest canonical form
          the subset can produce. A longer input is an extension or a variant,
          refused whole before it is split.
        name: maxTagBytes
        type: int
        value: len("fil-Hant-419")
      - doc: maxSubtags is language + script + region.
        name: maxSubtags
        type: int
        value: "3"
      - doc: scriptSubtagLen is the ISO 15924 script subtag length, always 4.
        name: scriptSubtagLen
        type: int
        value: "4"
      - doc: alphaRegionLen is the ISO 3166-1 alpha-2 region length.
        name: alphaRegionLen
        type: int
        value: "2"
      - doc: digitRegionLen is the UN M.49 numeric region length.
        name: digitRegionLen
        type: int
        value: "3"
    name: maxTagBytes
