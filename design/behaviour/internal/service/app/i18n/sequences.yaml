      - opt:
          do:
            - return: exact, true
          init:
            bind: exact, found
            eval: rulesByTag[tag.String()]
          when: found
      - bind: base, found
        eval: rulesByTag[tag.Language()]
      - return: base, found
  - of: SupportedTags
    participants:
      - id: caller
        kind: actor
      - id: SupportedTags
        kind: self
      - id: ParseTag
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: tags
        eval: make([]corei18n.TagValue, 0, len(rulesByTag))
      - loop:
          do:
            - bind: tag, err
              eval: ParseTag(key)
              to: ParseTag
            - opt:
                do:
                  - continue: true
                when: err != nil
            - set: tags
              value: append(tags, tag)
          key: key
          range: rulesByTag
      - eval: slices.SortFunc(tags, compareTags)
        to: slices
      - return: tags
  - of: supportedList
    participants:
      - id: caller
        kind: actor
      - id: supportedList
        kind: self
      - id: SupportedTags
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - bind: tags
        eval: SupportedTags()
        to: SupportedTags
      - bind: spellings
        eval: make([]string, 0, len(tags))
      - loop:
          do:
            - set: spellings
              value: append(spellings, tag.String())
          key: _
          range: tags
          value: tag
      - return: strings.Join(spellings, chainSeparator)
        to: strings
  - of: requireRules
    participants:
      - id: caller
        kind: actor
      - id: requireRules
        kind: self
      - id: Rules
        kind: internal
    steps:
      - bind: found, ok
        eval: Rules(tag)
        to: Rules
      - opt:
          do:
            - return: |-
                PluralValue{}, errs.Wrap(corei18n.UnsupportedLanguage, errs.WrapParams{},
                			errs.String("tag", tag.String()), errs.String("supported", supportedList()))
          when: "!ok"
      - return: found, nil
  - of: pluralGermanic
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() == 1 && count.VisibleFractionDigits() == 0
      - return: corei18n.FormOther
  - of: pluralFrench
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() <= 1
      - opt:
          do:
            - return: corei18n.FormMany
          when: isRomanceMany(count)
      - return: corei18n.FormOther
  - of: pluralSpanish
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IsIntegerValued() && count.IntegerPart() == 1
      - opt:
          do:
            - return: corei18n.FormMany
          when: isRomanceMany(count)
      - return: corei18n.FormOther
  - of: pluralItalian
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() == 1 && count.VisibleFractionDigits() == 0
      - opt:
          do:
            - return: corei18n.FormMany
          when: isRomanceMany(count)
      - return: corei18n.FormOther
  - of: pluralPortuguese
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() <= 1
      - opt:
          do:
            - return: corei18n.FormMany
          when: isRomanceMany(count)
      - return: corei18n.FormOther
  - of: pluralEuropeanPortuguese
    steps:
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() == 1 && count.VisibleFractionDigits() == 0
      - opt:
          do:
            - return: corei18n.FormMany
          when: isRomanceMany(count)
      - return: corei18n.FormOther
  - of: isRomanceMany
    steps:
      - return: |-
          count.IntegerPart() != 0 &&
          		count.IntegerPart()%million == 0 &&
          		count.VisibleFractionDigits() == 0
  - of: pluralPolish
    steps:
      - opt:
          do:
            - return: corei18n.FormOther
          when: count.VisibleFractionDigits() != 0
      - opt:
          do:
            - return: corei18n.FormOne
          when: count.IntegerPart() == 1
      - bind: mod10, mod100
        eval: count.IntegerPart()%tenModulus, count.IntegerPart()%hundredModulus
      - opt:
          do:
            - return: corei18n.FormFew
          when: isSlavicFew(mod10, mod100, polishTeenLow)
      - opt:
          do:
            - return: corei18n.FormMany
          when: mod10 < slavicFewLow || isSlavicManyTail(mod10, mod100, polishTeenLow)
      - return: corei18n.FormOther
  - of: isSlavicFew
    steps:
      - bind: inTeens
        eval: mod100 >= teenLow && mod100 <= teenHigh
      - return: mod10 >= slavicFewLow && mod10 <= slavicFewHigh && !inTeens
  - of: isSlavicManyTail
    steps:
      - opt:
          do:
            - return: "true"
          when: mod10 >= slavicManyLow && mod10 <= slavicManyHigh
      - return: mod100 >= teenLow && mod100 <= teenHigh
  - of: pluralRussian
    steps:
      - opt:
          do:
            - return: corei18n.FormOther
          when: count.VisibleFractionDigits() != 0
      - bind: mod10, mod100
        eval: count.IntegerPart()%tenModulus, count.IntegerPart()%hundredModulus
      - opt:
          do:
            - return: corei18n.FormOne
          when: mod10 == singularValue && mod100 != russianTeenLow
      - opt:
          do:
            - return: corei18n.FormFew
          when: isSlavicFew(mod10, mod100, polishTeenLow)
      - opt:
          do:
            - return: corei18n.FormMany
          when: mod10 == 0 || isSlavicManyTail(mod10, mod100, russianTeenLow)
      - return: corei18n.FormOther
  - of: pluralArabic
    participants:
      - id: caller
        kind: actor
      - id: pluralArabic
        kind: self
      - id: count.IntegerPart
        kind: value
    steps:
      - opt:
          do:
            - return: corei18n.FormOther
          when: "!count.IsIntegerValued()"
      - bind: value
        eval: count.IntegerPart()
        to: count.IntegerPart
      - switch:
          cases:
            - case: "0"
              do:
                - return: corei18n.FormZero
            - case: singularValue
              do:
                - return: corei18n.FormOne
            - case: dualValue
              do:
                - return: corei18n.FormTwo
          "on": value
      - bind: mod100
        eval: value % hundredModulus
      - opt:
          do:
            - return: corei18n.FormFew
          when: mod100 >= arabicFewLow && mod100 <= arabicFewHigh
      - opt:
          do:
            - return: corei18n.FormMany
          when: mod100 >= arabicManyLow
      - return: corei18n.FormOther
  - of: PluralValue.Forms
    steps:
      - return: p.forms
  - of: PluralValue.Select
    steps:
      - opt:
          do:
            - return: corei18n.FormOther
          when: p.rule == nil
      - return: p.rule(count)
  - of: PluralValue.Valid
    steps:
      - return: len(p.forms) != 0
  - of: NewPrinter
    participants:
      - id: caller
        kind: actor
      - id: NewPrinter
        kind: self
      - id: buildChain
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, errs.Wrap(corei18n.CatalogInvalid, errs.WrapParams{}, errs.String("detail", "the printer tag is unset"))
          when: tag.IsZero()
      - bind: chain, err
        eval: buildChain(catalog, tag)
        to: buildChain
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&Printer{catalog: catalog, tag: tag, chain: chain}, nil"
  - of: (*Printer).Tag
    steps:
      - return: p.tag
  - of: (*Printer).Render
    participants:
      - id: caller
        kind: actor
      - id: (*Printer).Render
        kind: self
      - id: p.resolve
        kind: internal
      - id: message.Format
        kind: value
    steps:
      - bind: message, _, ok
        eval: p.resolve(key)
        to: p.resolve
      - opt:
          do:
            - return: string(key), p.notFound(key)
          when: "!ok"
      - return: message.Format(corei18n.FormOther, args)
        to: message.Format
  - of: (*Printer).RenderCount
    participants:
      - id: caller
        kind: actor
      - id: (*Printer).RenderCount
        kind: self
      - id: p.resolve
        kind: internal
      - id: rules.Select
        kind: internal
      - id: message.Format
        kind: value
    steps:
      - bind: message, rules, ok
        eval: p.resolve(key)
        to: p.resolve
      - opt:
          do:
            - return: string(key), p.notFound(key)
          when: "!ok"
      - bind: form
        eval: rules.Select(count)
        to: rules.Select
      - return: message.Format(form, args)
        to: message.Format
  - of: (*Printer).resolve
    participants:
      - id: caller
        kind: actor
      - id: (*Printer).resolve
        kind: self
      - id: p.catalog.Lookup
        kind: value
    steps:
      - loop:
          do:
            - bind: found, hit
              eval: p.catalog.Lookup(step.tag, key)
              to: p.catalog.Lookup
            - opt:
                do:
                  - continue: true
                when: "!hit"
            - return: found, step.rules, true
          key: _
          range: p.chain
          value: step
      - return: corei18n.MessageValue{}, PluralValue{}, false
  - of: (*Printer).notFound
    participants:
      - id: caller
        kind: actor
      - id: (*Printer).notFound
        kind: self
      - id: tried.WriteString
        kind: value
      - id: errs
        kind: package
    steps:
      - var:
          name: tried
          type: strings.Builder
      - loop:
          do:
            - opt:
                do:
                  - eval: tried.WriteString(chainSeparator)
                    to: tried.WriteString
                when: i > 0
            - eval: tried.WriteString(step.tag.String())
              to: tried.WriteString
          key: i
          range: p.chain
          value: step
      - return: |-
          errs.Wrap(corei18n.MessageNotFound, errs.WrapParams{},
          		errs.String("key", string(key)), errs.String("tried", tried.String()))
        to: errs
  - of: buildChain
    participants:
      - id: caller
        kind: actor
      - id: buildChain
        kind: self
      - id: appendLineage
        kind: internal
    steps:
      - set: chain, err
        to: appendLineage
        value: appendLineage(nil, tag)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: fallbacker, ok
        eval: catalog.(corei18n.Fallbacker)
      - opt:
          do:
            - return: chain, nil
          when: "!ok"
      - return: appendLineage(chain, fallbacker.Fallback())
        to: appendLineage
  - of: appendLineage
    participants:
      - id: caller
        kind: actor
      - id: appendLineage
        kind: self
      - id: requireRules
        kind: internal
      - id: current.Parent
        kind: value
    steps:
      - loop:
          cond: "!current.IsZero()"
          do:
            - bind: rules, rulesErr
              eval: requireRules(current)
              to: requireRules
            - opt:
                do:
                  - return: nil, rulesErr
                when: rulesErr != nil
            - opt:
                do:
                  - set: chain
                    value: "append(chain, link{tag: current, rules: rules})"
                when: "!hasLink(chain, current)"
            - bind: parent, more
              eval: current.Parent()
              to: current.Parent
            - opt:
                do:
                  - break: true
                when: "!more"
            - set: current
              value: parent
          init: current := tag
      - return: chain, nil
  - of: NewStore
    participants:
      - id: caller
        kind: actor
      - id: NewStore
        kind: self
      - id: compileCatalogues
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, errs.Wrap(corei18n.CatalogInvalid, errs.WrapParams{}, errs.String("detail", "the fallback tag is unset"))
          when: fallback.IsZero()
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corei18n.CatalogInvalid, errs.WrapParams{},
                			errs.String("tag", fallback.String()), errs.String("detail", "the fallback language has no catalogue"))
          init:
            bind: _, ok
            eval: catalogues[fallback]
          when: "!ok"
      - bind: compiled, err
        eval: compileCatalogues(catalogues)
        to: compileCatalogues
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&Store{fallback: fallback, byTag: compiled, tags: sortedTags(compiled)}, nil"
  - of: compileCatalogues
    participants:
      - id: caller
        kind: actor
      - id: compileCatalogues
        kind: self
      - id: compileCatalogue
        kind: internal
    steps:
      - set: compiled
        value: make(map[corei18n.TagValue]map[corei18n.Key]corei18n.MessageValue, len(catalogues))
      - loop:
          do:
            - bind: messages, langErr
              eval: compileCatalogue(tag, catalogues[tag])
              to: compileCatalogue
            - opt:
                do:
                  - return: nil, langErr
                when: langErr != nil
            - set: compiled[tag]
              value: messages
          key: _
          range: sortedTagKeys(catalogues)
          value: tag
      - return: compiled, nil
  - of: compileCatalogue
    participants:
      - id: caller
        kind: actor
      - id: compileCatalogue
        kind: self
      - id: requireRules
        kind: internal
      - id: compileEntry
        kind: internal
    steps:
      - bind: rules, err
        eval: requireRules(tag)
        to: requireRules
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - set: messages
        value: make(map[corei18n.Key]corei18n.MessageValue, len(catalogue))
      - loop:
          do:
            - bind: message, entryErr
              eval: compileEntry(tag, key, catalogue[key], rules)
              to: compileEntry
            - opt:
                do:
                  - return: nil, entryErr
                when: entryErr != nil
            - set: messages[key]
              value: message
          key: _
          range: slices.Sorted(maps.Keys(catalogue))
          value: key
      - return: messages, nil
  - of: compileEntry
    participants:
      - id: caller
        kind: actor
      - id: compileEntry
        kind: self
      - id: corei18n
        kind: package
      - id: compilePlain
        kind: internal
      - id: compileCounted
        kind: internal
    steps:
      - opt:
          do:
            - return: corei18n.MessageValue{}, errs.Wrap(keyErr, errs.WrapParams{}, errs.String("tag", tag.String()))
          init:
            bind: keyErr
            eval: corei18n.ValidateKey(key)
            to: corei18n
          when: keyErr != nil
      - opt:
          do:
            - return: compilePlain(tag, key, entry.Pattern)
              to: compilePlain
          when: entry.Forms == nil
      - return: compileCounted(tag, key, entry.Forms, rules)
        to: compileCounted
  - of: compilePlain
    participants:
      - id: caller
        kind: actor
      - id: compilePlain
        kind: self
      - id: NewMessage
        kind: internal
    steps:
      - set: message, err
        to: NewMessage
        value: NewMessage(text)
      - opt:
          do:
            - return: |-
                corei18n.MessageValue{}, errs.Wrap(err, errs.WrapParams{},
                			errs.String("tag", tag.String()), errs.String("key", string(key)))
          when: err != nil
      - return: message, nil
  - of: compileCounted
    participants:
      - id: caller
        kind: actor
      - id: compileCounted
        kind: self
      - id: parseForms
        kind: internal
      - id: NewPluralMessage
        kind: internal
      - id: requireComplete
        kind: internal
    steps:
      - bind: byForm, err
        eval: parseForms(tag, key, forms)
        to: parseForms
      - opt:
          do:
            - return: corei18n.MessageValue{}, err
          when: err != nil
      - set: message, err
        to: NewPluralMessage
        value: NewPluralMessage(byForm)
      - opt:
          do:
            - return: |-
                corei18n.MessageValue{}, errs.Wrap(err, errs.WrapParams{},
                			errs.String("tag", tag.String()), errs.String("key", string(key)))
          when: err != nil
      - opt:
          do:
            - return: corei18n.MessageValue{}, missingErr
          init:
            bind: missingErr
            eval: requireComplete(tag, key, message, rules)
            to: requireComplete
          when: missingErr != nil
      - return: message, nil
  - of: parseForms
    participants:
      - id: caller
        kind: actor
      - id: parseForms
        kind: self
      - id: corei18n
        kind: package
    steps:
      - set: byForm
        value: make(map[corei18n.Form]string, len(forms))
      - bind: keyText
        eval: string(key)
      - loop:
          do:
            - bind: form, formErr
              eval: corei18n.ParseForm(name)
              to: corei18n
            - opt:
                do:
                  - return: |-
                      nil, errs.Wrap(formErr, errs.WrapParams{},
                      				errs.String("tag", tag.String()), errs.String("key", keyText))
                when: formErr != nil
            - set: byForm[form]
              value: forms[name]
          key: _
          range: slices.Sorted(maps.Keys(forms))
          value: name
      - return: byForm, nil
  - of: requireComplete
    participants:
      - id: caller
        kind: actor
      - id: requireComplete
        kind: self
      - id: errs
        kind: package
    steps:
      - bind: keyText
        eval: string(key)
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corei18n.TranslationIncomplete, errs.WrapParams{},
                      				errs.String("tag", tag.String()), errs.String("key", keyText), errs.String("form", form.String()))
                    to: errs
                when: "!message.HasForm(form)"
          key: _
          range: rules.Forms()
          value: form
      - return: nil
  - of: sortedTagKeys
    participants:
      - id: caller
        kind: actor
      - id: sortedTagKeys
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.SortedFunc(maps.Keys(catalogues), compareTags)
        to: slices
  - of: sortedTags
    participants:
      - id: caller
        kind: actor
      - id: sortedTags
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.SortedFunc(maps.Keys(compiled), compareTags)
        to: slices
  - of: compareTags
    participants:
      - id: caller
        kind: actor
      - id: compareTags
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.Compare(a.String(), b.String())
        to: strings
  - of: (*Store).Lookup
    steps:
      - bind: messages, known
        eval: s.byTag[tag]
      - opt:
          do:
            - return: corei18n.MessageValue{}, false
          when: "!known"
      - set: message, ok
        value: messages[key]
      - return: message, ok
  - of: (*Store).Tags
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Tags
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Clone(s.tags)
        to: slices
  - of: (*Store).Keys
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Keys
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: messages, known
        eval: s.byTag[tag]
      - opt:
          do:
            - return: nil
          when: "!known"
      - return: slices.Sorted(maps.Keys(messages))
        to: slices
  - of: (*Store).Fallback
    steps:
      - return: s.fallback
  - of: (*Store).Missing
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Missing
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: reference
        eval: s.byTag[s.fallback]
      - bind: messages
        eval: s.byTag[tag]
      - var:
          name: gaps
          type: "[]corei18n.Key"
      - loop:
          do:
            - opt:
                do:
                  - set: gaps
                    value: append(gaps, key)
                init:
                  bind: _, ok
                  eval: messages[key]
                when: "!ok"
          key: key
          range: reference
      - eval: slices.Sort(gaps)
        to: slices
      - return: gaps
  - of: ParseTag
    participants:
      - id: caller
        kind: actor
      - id: ParseTag
        kind: self
      - id: strings
        kind: stdlib
      - id: placeSubtags
        kind: internal
      - id: corei18n
        kind: package
    steps:
      - opt:
          do:
            - return: corei18n.TagValue{}, errs.Wrap(corei18n.InvalidTag, errs.WrapParams{}, errs.String("tag", text), errs.String("detail", "empty"))
          when: text == ""
      - opt:
          do:
            - return: corei18n.TagValue{}, errs.Wrap(corei18n.InvalidTag, errs.WrapParams{}, errs.String("tag", text), errs.String("detail", "outside the language[-Script][-REGION] subset"))
          when: len(text) > maxTagBytes
      - bind: parts
        eval: strings.Split(text, "-")
        to: strings
      - opt:
          do:
            - return: corei18n.TagValue{}, errs.Wrap(corei18n.InvalidTag, errs.WrapParams{}, errs.String("tag", text), errs.String("detail", "more than three subtags"))
          when: len(parts) > maxSubtags
      - bind: script, region, placed
        eval: placeSubtags(parts[1:])
        to: placeSubtags
      - opt:
          do:
            - return: corei18n.TagValue{}, errs.Wrap(corei18n.InvalidTag, errs.WrapParams{}, errs.String("tag", text), errs.String("detail", "subtag is not a script or region in the subset"))
          when: "!placed"
      - set: tag, err
        to: corei18n
        value: corei18n.NewTag(parts[0], script, region)
      - opt:
          do:
            - return: corei18n.TagValue{}, errs.Wrap(err, errs.WrapParams{}, errs.String("tag", text))
          when: err != nil
      - return: tag, nil
