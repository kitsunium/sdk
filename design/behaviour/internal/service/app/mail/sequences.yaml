        kind: value
      - id: writer.Close
        kind: value
    steps:
      - opt:
          do:
            - return: wrapAs(coremail.SendRefused, mailErr, errs.String("command", "MAIL"))
              to: wrapAs
          init:
            bind: mailErr
            eval: s.client.Mail(delivery.Envelope.From)
            to: s.client.Mail
          when: mailErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: wrapAs(coremail.SendRefused, rcptErr, errs.String("command", "RCPT"), errs.Int("recipient", index))
                    to: wrapAs
                init:
                  bind: rcptErr
                  eval: s.client.Rcpt(recipient)
                  to: s.client.Rcpt
                when: rcptErr != nil
          key: index
          range: delivery.Envelope.To
          value: recipient
      - bind: writer, dataErr
        eval: s.client.Data()
        to: s.client.Data
      - opt:
          do:
            - return: wrapAs(coremail.SendRefused, dataErr, errs.String("command", "DATA"))
              to: wrapAs
          when: dataErr != nil
      - opt:
          do:
            - return: wrapAs(coremail.SendRefused, writeErr, errs.String("command", "DATA"))
              to: wrapAs
          init:
            bind: _, writeErr
            eval: writer.Write(delivery.Raw)
            to: writer.Write
          when: writeErr != nil
      - opt:
          do:
            - return: wrapAs(coremail.SendRefused, closeErr, errs.String("command", "DATA-END"))
              to: wrapAs
          init:
            bind: closeErr
            eval: writer.Close()
            to: writer.Close
          when: closeErr != nil
      - return: nil
  - of: (*smtpTransport).dial
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).dial
        kind: self
      - id: dialer.DialContext
        kind: value
      - id: tls
        kind: stdlib
      - id: secure.HandshakeContext
        kind: value
    steps:
      - bind: dialer
        eval: "net.Dialer{Timeout: t.cfg.resolvedDialTimeout()}"
      - bind: raw, dialErr
        eval: dialer.DialContext(ctx, "tcp", t.address)
        to: dialer.DialContext
      - opt:
          do:
            - return: nil, wrapAs(coremail.DialFailed, dialErr, errs.String("address", t.address))
          when: dialErr != nil
      - opt:
          do:
            - return: raw, nil
          when: t.cfg.TLS != TLSImplicit
      - bind: secure
        eval: tls.Client(raw, t.tlsConfig())
        to: tls
      - opt:
          do:
            - bind: closed
              eval: cmp.Or[error](wrapAs(coremail.TLSFailed, handshakeErr, errs.String("address", t.address)), raw.Close())
            - return: nil, closed
          init:
            bind: handshakeErr
            eval: secure.HandshakeContext(ctx)
            to: secure.HandshakeContext
          when: handshakeErr != nil
      - return: secure, nil
  - of: (*smtpTransport).tlsConfig
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).tlsConfig
        kind: self
      - id: t.cfg.Identity.ClientConfig
        kind: value
    steps:
      - bind: cfg
        eval: t.cfg.Identity.ClientConfig()
        to: t.cfg.Identity.ClientConfig
      - opt:
          do:
            - set: cfg.ServerName
              value: t.cfg.Host
          when: cfg.ServerName == ""
      - return: cfg
  - of: watchContext
    participants:
      - id: caller
        kind: actor
      - id: watchContext
        kind: self
      - id: ctx.Deadline
        kind: value
      - id: setDeadlineBestEffort
        kind: internal
    steps:
      - opt:
          do:
            - return:
                closure:
                  steps: null
          when: ctx.Done() == nil
      - opt:
          do:
            - eval: setDeadlineBestEffort(conn, deadline)
              to: setDeadlineBestEffort
          init:
            bind: deadline, ok
            eval: ctx.Deadline()
            to: ctx.Deadline
          when: ok
      - bind: done
        eval: make(chan struct{})
      - go: |-
          func() {
          		select {
          		case <-ctx.Done():
          			//: net.Conn is safe to close from another goroutine, and closing is
          			//: what unblocks the read net/smtp is sitting in. The error has no
          			//: caller: the send is already failing with the context's own.
          			closeBestEffort(conn)
          		case <-done:
          			//: the session finished first.
          		}
          	}()
      - return:
          closure:
            steps:
              - eval: close(done)
  - of: setDeadlineBestEffort
    participants:
      - id: caller
        kind: actor
      - id: setDeadlineBestEffort
        kind: self
      - id: conn.SetDeadline
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: deadlineErr
            eval: conn.SetDeadline(deadline)
            to: conn.SetDeadline
          when: deadlineErr != nil
  - of: closeBestEffort
    participants:
      - id: caller
        kind: actor
      - id: closeBestEffort
        kind: self
      - id: conn.Close
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: closeErr
            eval: conn.Close()
            to: conn.Close
          when: closeErr != nil
  - of: TLSMode.String
    steps:
      - switch:
          cases:
            - case: TLSStartTLS
              do:
                - return: "\"starttls\""
            - case: TLSImplicit
              do:
                - return: "\"implicit\""
            - case: TLSDisabled
              do:
                - return: "\"disabled\""
            - case: TLSUnset
              do:
                - return: "\"unset\""
            - default: true
              do:
                - return: "\"invalid\""
          "on": m
  - of: SMTPConfig.validate
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.validate
        kind: self
      - id: c.validateEndpoint
        kind: internal
      - id: c.validateSecurity
        kind: internal
    steps:
      - opt:
          do:
            - return: endpointErr
          init:
            bind: endpointErr
            eval: c.validateEndpoint()
            to: c.validateEndpoint
          when: endpointErr != nil
      - return: c.validateSecurity()
        to: c.validateSecurity
  - of: SMTPConfig.validateEndpoint
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.validateEndpoint
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(coremail.InvalidConfig, errs.WrapParams{}, errs.String("problem", "empty host"))
              to: errs
          when: c.Host == ""
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.InvalidConfig, errs.WrapParams{},
                			errs.String("problem", "port out of range"), errs.Int("port", c.Port))
              to: errs
          when: c.Port <= 0 || c.Port > maxPort
      - return: nil
  - of: SMTPConfig.validateSecurity
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.validateSecurity
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.InvalidConfig, errs.WrapParams{},
                			errs.String("problem", "TLS mode is unset; choose TLSStartTLS, TLSImplicit or TLSDisabled explicitly"))
              to: errs
          when: c.TLS == TLSUnset
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.InvalidConfig, errs.WrapParams{},
                			errs.String("problem", "unknown TLS mode"), errs.Int("tls_mode", int(c.TLS)))
              to: errs
          when: c.TLS > TLSDisabled
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.AuthInsecure, errs.WrapParams{},
                			errs.String("problem", "Username is set and TLS is disabled"))
              to: errs
          when: c.Username != "" && c.TLS == TLSDisabled
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.InvalidConfig, errs.WrapParams{},
                			errs.String("problem", "Password is set without a Username"))
              to: errs
          when: c.Username == "" && c.Password != ""
      - return: nil
  - of: SMTPConfig.resolvedDialTimeout
    steps:
      - opt:
          do:
            - return: defaultDialTimeout
          when: c.DialTimeout <= 0
      - return: c.DialTimeout
  - of: SMTPConfig.resolvedLocalName
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.resolvedLocalName
        kind: self
      - id: cmp
        kind: stdlib
    steps:
      - return: cmp.Or(c.LocalName, defaultLocalName)
        to: cmp
  - of: SMTPConfig.redacted
    steps:
      - bind: view
        eval: smtpConfigView(c)
      - opt:
          do:
            - set: view.Password
              value: coresecret.Redacted
          when: view.Password != ""
      - return: view
  - of: SMTPConfig.String
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.String
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: fmt.Sprintf("%+v", c.redacted())
        to: fmt
  - of: SMTPConfig.GoString
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.GoString
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - bind: rendered
        eval: fmt.Sprintf("%#v", c.redacted())
        to: fmt
      - return: configTypeName + strings.TrimPrefix(rendered, viewTypeName)
  - of: SMTPConfig.Format
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.Format
        kind: self
      - id: writeRendering
        kind: internal
    steps:
      - opt:
          do:
            - eval: writeRendering(state, c.GoString())
              to: writeRendering
            - return: ""
          when: verb == 'v' && state.Flag('#')
      - eval: writeRendering(state, fmt.Sprintf(fmt.FormatString(state, verb), c.redacted()))
        to: writeRendering
  - of: SMTPConfig.MarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: SMTPConfig.MarshalJSON
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.Marshal(c.redacted())
        to: json
  - of: writeRendering
    participants:
      - id: caller
        kind: actor
      - id: writeRendering
        kind: self
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, err
            eval: io.WriteString(state, text)
            to: io
          when: err != nil
  - of: ParseURL
    participants:
      - id: caller
        kind: actor
      - id: ParseURL
        kind: self
      - id: url
        kind: stdlib
      - id: modeOf
        kind: internal
      - id: portOf
        kind: internal
      - id: parsed.User.Username
        kind: value
      - id: parsed.User.Password
        kind: value
      - id: cfg.validate
        kind: internal
    steps:
      - bind: parsed, parseErr
        eval: url.Parse(raw)
        to: url
      - opt:
          do:
            - return: SMTPConfig{}, invalidURL("not a URL of the form smtp://user:password@host:port")
          when: parseErr != nil || parsed.Opaque != ""
      - bind: mode, modeErr
        eval: modeOf(parsed)
        to: modeOf
      - opt:
          do:
            - return: SMTPConfig{}, modeErr
          when: modeErr != nil
      - opt:
          do:
            - return: SMTPConfig{}, invalidURL("has a path or a fragment")
          when: (parsed.Path != "" && parsed.Path != "/") || parsed.Fragment != "" || parsed.RawFragment != ""
      - bind: port, portErr
        eval: portOf(parsed.Hostname(), parsed.Port(), mode)
        to: portOf
      - opt:
          do:
            - return: SMTPConfig{}, portErr
          when: portErr != nil
      - set: cfg
        value: "SMTPConfig{Host: parsed.Hostname(), Port: port, TLS: mode}"
      - opt:
          do:
            - set: cfg.Username
              to: parsed.User.Username
              value: parsed.User.Username()
            - set: cfg.Password, _
              to: parsed.User.Password
              value: parsed.User.Password()
          when: parsed.User != nil
      - opt:
          do:
            - return: SMTPConfig{}, validateErr
          init:
            bind: validateErr
            eval: cfg.validate()
            to: cfg.validate
          when: validateErr != nil
      - return: cfg, nil
  - of: modeOf
    participants:
      - id: caller
        kind: actor
      - id: modeOf
        kind: self
      - id: url
        kind: stdlib
    steps:
      - bind: query, queryErr
        eval: url.ParseQuery(parsed.RawQuery)
        to: url
      - opt:
          do:
            - return: TLSUnset, invalidURL("has a malformed query")
          when: queryErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: TLSUnset, invalidURL("has a query parameter other than tls")
                when: name != tlsParameter
          key: name
          range: query
      - switch:
          cases:
            - case: schemeSMTP
              do:
                - set: mode
                  value: TLSStartTLS
            - case: schemeSMTPS
              do:
                - set: mode
                  value: TLSImplicit
            - default: true
              do:
                - return: TLSUnset, invalidURL("scheme is not smtp or smtps")
          "on": strings.ToLower(parsed.Scheme)
      - bind: values
        eval: query[tlsParameter]
      - opt:
          do:
            - return: mode, nil
          when: len(values) == 0
      - opt:
          do:
            - return: TLSUnset, invalidURL("names the tls parameter more than once")
          when: len(values) > 1
      - bind: named, known
        eval: tlsModesByName[strings.ToLower(values[0])]
      - opt:
          do:
            - return: TLSUnset, invalidURL("has a tls parameter that is not starttls, implicit or none")
          when: "!known"
      - opt:
          do:
            - return: TLSUnset, invalidURL("uses smtps with a tls parameter other than implicit")
          when: mode == TLSImplicit && named != TLSImplicit
      - return: named, nil
  - of: portOf
    participants:
      - id: caller
        kind: actor
      - id: portOf
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, invalidURL("names no host")
          when: host == ""
      - opt:
          do:
            - return: defaultPorts[mode], nil
          when: written == ""
      - bind: port, convErr
        eval: strconv.Atoi(written)
        to: strconv
      - opt:
          do:
            - return: 0, invalidURL("has a port that is not a number from 1 to 65535")
          when: convErr != nil || port < 1 || port > maxPort
      - return: port, nil
  - of: invalidURL
    participants:
      - id: caller
        kind: actor
      - id: invalidURL
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coremail.InvalidURL, errs.WrapParams{}, errs.String("problem", problem))
        to: errs
  - of: Validate
    participants:
      - id: caller
        kind: actor
      - id: Validate
        kind: self
      - id: errs
        kind: package
      - id: validateAllAddresses
        kind: internal
      - id: ValidateHeaderValue
        kind: internal
      - id: ValidateHeader
        kind: internal
      - id: validateContent
        kind: internal
    steps:
      - opt:
          do:
            - return: errs.Wrap(coremail.MissingSender, errs.WrapParams{})
              to: errs
          when: m.From.IsZero()
      - opt:
          do:
            - return: addrErr
          init:
            bind: addrErr
            eval: validateAllAddresses(m)
            to: validateAllAddresses
          when: addrErr != nil
      - opt:
          do:
            - return: subjectErr
          init:
            bind: subjectErr
            eval: ValidateHeaderValue(coremail.HeaderSubject, m.Subject)
            to: ValidateHeaderValue
          when: subjectErr != nil
      - opt:
          do:
            - return: idErr
          init:
            bind: idErr
            eval: ValidateHeaderValue(coremail.HeaderMessageID, m.MessageID)
            to: ValidateHeaderValue
          when: idErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: fieldErr
                init:
                  bind: fieldErr
                  eval: ValidateHeader(field)
                  to: ValidateHeader
                when: fieldErr != nil
          key: _
          range: m.Headers
          value: field
      - return: validateContent(m)
        to: validateContent
  - of: validateAllAddresses
    participants:
      - id: caller
        kind: actor
      - id: validateAllAddresses
        kind: self
      - id: ValidateAddress
        kind: internal
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: fromErr
          init:
            bind: fromErr
            eval: ValidateAddress(coremail.HeaderFrom, m.From)
            to: ValidateAddress
          when: fromErr != nil
      - bind: lists
        eval: |-
          []addressGroup{
          		{coremail.HeaderTo, m.To},
          		{coremail.HeaderCc, m.Cc},
          		{coremail.HeaderBcc, m.Bcc},
          		{coremail.HeaderReplyTo, m.ReplyTo},
          	}
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: addrErr
                      init:
                        bind: addrErr
                        eval: ValidateAddress(list.field+"["+strconv.Itoa(index)+"]", addr)
                        to: ValidateAddress
                      when: addrErr != nil
                key: index
                range: list.addrs
                value: addr
          key: _
          range: lists
          value: list
      - opt:
          do:
            - return: errs.Wrap(coremail.NoRecipients, errs.WrapParams{})
              to: errs
          when: len(m.To)+len(m.Cc)+len(m.Bcc) == 0
      - return: nil
  - of: validateContent
    participants:
      - id: caller
        kind: actor
      - id: validateContent
        kind: self
      - id: errs
        kind: package
      - id: validateOnePart
        kind: internal
    steps:
      - opt:
          do:
            - return: errs.Wrap(coremail.EmptyBody, errs.WrapParams{})
              to: errs
          when: m.Text == "" && m.HTML == "" && len(m.Attachments) == 0
      - bind: hasBody
        eval: m.Text != "" || m.HTML != ""
      - loop:
          do:
            - opt:
                do:
                  - return: partErr
                init:
                  bind: partErr
                  eval: validateOnePart(&m.Attachments[index], index, hasBody)
                  to: validateOnePart
                when: partErr != nil
          key: index
          range: m.Attachments
      - return: nil
  - of: validateOnePart
    participants:
      - id: caller
        kind: actor
      - id: validateOnePart
        kind: self
      - id: ValidateAttachment
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: field
        eval: "\"Attachments[\" + strconv.Itoa(index) + \"]\""
      - opt:
          do:
            - return: attachmentErr
          init:
            bind: attachmentErr
            eval: ValidateAttachment(field, attachment)
            to: ValidateAttachment
          when: attachmentErr != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.InvalidAttachment, errs.WrapParams{},
                			errs.String("field", field),
                			errs.String("problem", "inline part in a message with no body to reference it"))
              to: errs
          when: attachment.Inline() && !hasBody
      - return: nil
