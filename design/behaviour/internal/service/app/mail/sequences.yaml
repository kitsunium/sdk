                			Raw:      slices.Clone(delivery.Raw),
                		})
          key: _
          range: t.sent
          value: delivery
      - return: out
  - of: (*memoryTransport).Reset
    steps:
      - lock:
          mutex: t.mutex
      - set: t.sent
        value: nil
  - of: NewSMTP
    participants:
      - id: caller
        kind: actor
      - id: NewSMTP
        kind: self
      - id: cfg.validate
        kind: internal
      - id: net
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, cfgErr
          init:
            bind: cfgErr
            eval: cfg.validate()
            to: cfg.validate
          when: cfgErr != nil
