                  bind: _, err
                  eval: io.WriteString(dst, crlf)
                  to: io
                when: err != nil
            - opt:
                do:
                  - return: bodyErr
                init:
                  bind: bodyErr
                  eval: child.writeBody(dst)
                  to: child.writeBody
                when: bodyErr != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: _, err
                  eval: io.WriteString(dst, crlf)
                  to: io
                when: err != nil
          key: _
          range: e.children
          value: child
      - bind: _, err
        eval: io.WriteString(dst, "--"+e.boundary+"--"+crlf)
        to: io
      - return: err
  - of: writeBase64
    participants:
      - id: caller
        kind: actor
      - id: writeBase64
        kind: self
      - id: base64
        kind: stdlib
      - id: encoder.Write
        kind: value
      - id: encoder.Close
        kind: value
      - id: wrapper.finish
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: len(content) == 0
      - bind: wrapper
        eval: "&lineWrapper{dst: dst, width: base64LineOctets}"
      - bind: encoder
        eval: base64.NewEncoder(base64.StdEncoding, wrapper)
        to: base64
      - opt:
          do:
            - return: writeErr
          init:
            bind: _, writeErr
            eval: encoder.Write(content)
            to: encoder.Write
          when: writeErr != nil
      - opt:
          do:
            - return: closeErr
          init:
            bind: closeErr
            eval: encoder.Close()
            to: encoder.Close
          when: closeErr != nil
      - return: wrapper.finish()
        to: wrapper.finish
  - of: Envelope
    participants:
      - id: caller
        kind: actor
      - id: Envelope
        kind: self
      - id: Validate
        kind: internal
    steps:
      - opt:
          do:
            - return: coremail.EnvelopeValue{}, validationErr
          init:
            bind: validationErr
            eval: Validate(m)
            to: Validate
          when: validationErr != nil
      - bind: recipients
        eval: make([]string, 0, len(m.To)+len(m.Cc)+len(m.Bcc))
      - loop:
          do:
            - loop:
                do:
                  - set: recipients
                    value: append(recipients, addr.Addr)
                key: _
                range: group
                value: addr
          key: _
          range: "[][]coremail.AddressValue{m.To, m.Cc, m.Bcc}"
          value: group
      - return: "coremail.EnvelopeValue{From: m.From.Addr, To: recipients}, nil"
  - of: wrapAs
    participants:
      - id: caller
        kind: actor
      - id: wrapAs
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(sentinel, errs.WrapParams{}, fields...)
              to: errs
          when: cause == nil
      - return: errs.Wrap(sentinel, errs.WrapParams{}, append(fields, errs.String("cause", cause.Error()))...)
        to: errs
  - of: IsReservedHeader
    steps:
      - bind: _, reserved
        eval: reservedHeaders[strings.ToLower(strings.TrimSpace(name))]
      - return: reserved
  - of: ValidateHeaderName
    participants:
      - id: caller
        kind: actor
      - id: ValidateHeaderName
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(coremail.HeaderInjection, errs.WrapParams{}, errs.String("header", "(empty)"))
              to: errs
          when: name == ""
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(coremail.HeaderInjection, errs.WrapParams{},
                      				errs.String("header", name), errs.Int("offset", index))
                    to: errs
                when: name[index] < minPrintableASCII || name[index] > maxPrintableASCII || name[index] == ':'
          key: index
          range: len(name)
      - return: nil
  - of: ValidateHeaderValue
    participants:
      - id: caller
        kind: actor
      - id: ValidateHeaderValue
        kind: self
      - id: strings
        kind: stdlib
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.HeaderInjection, errs.WrapParams{},
                			errs.String("header", name), errs.Int("offset", index))
              to: errs
          init:
            bind: index
            eval: strings.IndexAny(value, forbiddenHeaderOctets)
            to: strings
          when: index >= 0
      - return: nil
  - of: ValidateHeader
    participants:
      - id: caller
        kind: actor
      - id: ValidateHeader
        kind: self
      - id: ValidateHeaderName
        kind: internal
      - id: errs
        kind: package
      - id: ValidateHeaderValue
        kind: internal
    steps:
      - opt:
          do:
            - return: nameErr
          init:
            bind: nameErr
            eval: ValidateHeaderName(field.Name)
            to: ValidateHeaderName
          when: nameErr != nil
      - opt:
          do:
            - return: errs.Wrap(coremail.ReservedHeader, errs.WrapParams{}, errs.String("header", field.Name))
              to: errs
          when: IsReservedHeader(field.Name)
      - return: ValidateHeaderValue(field.Name, field.Value)
        to: ValidateHeaderValue
  - of: encodeUnstructured
    participants:
      - id: caller
        kind: actor
      - id: encodeUnstructured
        kind: self
      - id: mime.QEncoding.Encode
        kind: value
    steps:
      - return: mime.QEncoding.Encode("utf-8", value)
        to: mime.QEncoding.Encode
  - of: formatAddress
    participants:
      - id: caller
        kind: actor
      - id: formatAddress
        kind: self
      - id: encodeUnstructured
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"<\" + a.Addr + \">\""
          when: a.Name == ""
      - opt:
          do:
            - return: encoded + " <" + a.Addr + ">"
          init:
            bind: encoded
            eval: encodeUnstructured(a.Name)
            to: encodeUnstructured
          when: encoded != a.Name
      - opt:
          do:
            - return: "`\"` + quoteEscaper.Replace(a.Name) + `\" <` + a.Addr + \">\""
          when: NeedsQuotedDisplayName(a.Name)
      - return: a.Name + " <" + a.Addr + ">"
  - of: formatAddressList
    participants:
      - id: caller
        kind: actor
      - id: formatAddressList
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: rendered
        eval: make([]string, 0, len(list))
      - loop:
          do:
            - set: rendered
              value: append(rendered, formatAddress(addr))
          key: _
          range: list
          value: addr
      - return: strings.Join(rendered, ", ")
        to: strings
  - of: writeHeader
    participants:
      - id: caller
        kind: actor
      - id: writeHeader
        kind: self
      - id: ValidateHeaderName
        kind: internal
      - id: ValidateHeaderValue
        kind: internal
      - id: foldHeaderLine
        kind: internal
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nameErr
          init:
            bind: nameErr
            eval: ValidateHeaderName(name)
            to: ValidateHeaderName
          when: nameErr != nil
      - opt:
          do:
            - return: valueErr
          init:
            bind: valueErr
            eval: ValidateHeaderValue(name, value)
            to: ValidateHeaderValue
          when: valueErr != nil
      - bind: folded, foldErr
        eval: foldHeaderLine(name, value)
        to: foldHeaderLine
      - opt:
          do:
            - return: foldErr
          when: foldErr != nil
      - bind: _, writeErr
        eval: io.WriteString(dst, folded+crlf)
        to: io
      - return: writeErr
  - of: foldHeaderLine
    participants:
      - id: caller
        kind: actor
      - id: foldHeaderLine
        kind: self
      - id: foldAtWhitespace
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - bind: line
        eval: "name + \": \" + value"
      - opt:
          do:
            - return: line, nil
          when: len(line) <= softLineOctets
      - bind: lines
        eval: foldAtWhitespace(line)
        to: foldAtWhitespace
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      "", errs.Wrap(coremail.HeaderTooLong, errs.WrapParams{},
                      				errs.String("header", name), errs.Int("octets", len(candidate)))
                when: len(candidate) > hardLineOctets
          key: _
          range: lines
          value: candidate
      - return: strings.Join(lines, crlf), nil
        to: strings
  - of: foldAtWhitespace
    participants:
      - id: caller
        kind: actor
      - id: foldAtWhitespace
        kind: self
      - id: foldPoint
        kind: internal
    steps:
      - var:
          name: lines
          type: "[]string"
      - bind: rest
        eval: line
      - loop:
          cond: len(rest) > softLineOctets
          do:
            - bind: cut
              eval: foldPoint(rest)
              to: foldPoint
            - opt:
                do:
                  - break: true
                when: cut < 0
            - set: lines
              value: append(lines, rest[:cut])
            - set: rest
              value: rest[cut:]
      - return: append(lines, rest)
  - of: (*lineWrapper).Write
    participants:
      - id: caller
        kind: actor
      - id: (*lineWrapper).Write
        kind: self
      - id: io
        kind: stdlib
      - id: w.dst.Write
        kind: value
    steps:
      - loop:
          cond: len(p) > 0
          do:
            - bind: room
              eval: w.width - w.used
            - opt:
                do:
                  - opt:
                      do:
                        - return: n, crErr
                      init:
                        bind: _, crErr
                        eval: io.WriteString(w.dst, crlf)
                        to: io
                      when: crErr != nil
                  - set: w.used
                    value: "0"
                  - continue: true
                when: room == 0
            - bind: chunk
              eval: min(room, len(p))
            - bind: written, writeErr
              eval: w.dst.Write(p[:chunk])
              to: w.dst.Write
            - op: +=
              set: "n"
              value: written
            - op: +=
              set: w.used
              value: written
            - opt:
                do:
                  - return: n, writeErr
                when: writeErr != nil
            - set: p
              value: p[chunk:]
      - return: n, nil
  - of: (*lineWrapper).finish
    participants:
      - id: caller
        kind: actor
      - id: (*lineWrapper).finish
        kind: self
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: w.used == 0
      - bind: _, err
        eval: io.WriteString(w.dst, crlf)
        to: io
      - set: w.used
        value: "0"
      - return: err
  - of: NewMemory
    steps:
      - return: "&memoryTransport{composer: NewComposer(ComposerConfig{})}"
  - of: NewCapture
    steps:
      - opt:
          do:
            - set: keep
