        eval: net.JoinHostPort(cfg.Host, strconv.Itoa(cfg.Port))
        to: net
      - return: "&smtpTransport{cfg: cfg, composer: NewComposer(ComposerConfig{}), address: address}, nil"
  - of: (*smtpTransport).Send
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).Send
        kind: self
      - id: t.prepare
        kind: internal
      - id: t.deliver
        kind: internal
    steps:
      - bind: deliveries, failures
        eval: t.prepare([]coremail.MessageValue{msg})
        to: t.prepare
      - opt:
          do:
            - return: failures[0]
          when: len(failures) > 0
      - return: t.deliver(ctx, deliveries)
        to: t.deliver
  - of: (*smtpTransport).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).prepare
        kind: self
      - id: Envelope
        kind: internal
      - id: t.composer.Compose
        kind: internal
    steps:
      - set: deliveries
        value: make([]coremail.DeliveryValue, 0, len(msgs))
      - set: failures
        value: make([]error, 0, len(msgs))
      - loop:
          do:
            - bind: envelope, envelopeErr
              eval: Envelope(msg)
              to: Envelope
            - opt:
                do:
                  - set: failures
                    value: append(failures, envelopeErr)
                  - continue: true
                when: envelopeErr != nil
            - bind: raw, composeErr
              eval: t.composer.Compose(msg)
              to: t.composer.Compose
            - opt:
                do:
                  - set: failures
                    value: append(failures, composeErr)
                  - continue: true
                when: composeErr != nil
            - set: deliveries
              value: "append(deliveries, coremail.DeliveryValue{Envelope: envelope, Raw: raw})"
          key: _
          range: msgs
          value: msg
      - return: deliveries, failures
  - of: (*smtpTransport).SendBatch
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).SendBatch
        kind: self
      - id: t.prepare
        kind: internal
      - id: t.deliver
        kind: internal
      - id: errors
        kind: stdlib
    steps:
      - bind: deliveries, failures
        eval: t.prepare(msgs)
        to: t.prepare
      - opt:
          do:
            - opt:
                do:
                  - set: failures
                    value: append(failures, deliverErr)
                init:
                  bind: deliverErr
                  eval: t.deliver(ctx, deliveries)
                  to: t.deliver
                when: deliverErr != nil
          when: len(deliveries) > 0
      - return: errors.Join(failures...)
        to: errors
  - of: (*smtpTransport).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*smtpTransport).deliver
        kind: self
      - id: t.dial
        kind: internal
      - id: watchContext
        kind: internal
      - id: smtp
        kind: stdlib
      - id: current.run
        kind: internal
      - id: cmp
        kind: stdlib
    steps:
      - bind: conn, dialErr
        eval: t.dial(ctx)
        to: t.dial
      - opt:
          do:
            - return: dialErr
          when: dialErr != nil
      - bind: release
        eval: watchContext(ctx, conn)
        to: watchContext
      - defer: release()
      - bind: client, clientErr
        eval: smtp.NewClient(conn, t.cfg.Host)
        to: smtp
      - opt:
          do:
            - return: cmp.Or[error](wrapAs(coremail.GreetingFailed, clientErr, errs.String("stage", "greeting")), conn.Close())
          when: clientErr != nil
      - bind: current
        eval: "&session{transport: t, cfg: t.cfg, client: client}"
      - bind: runErr
        eval: current.run(deliveries)
        to: current.run
      - opt:
          do:
            - return: nil
          when: runErr == nil
      - return: cmp.Or(runErr, client.Close())
        to: cmp
  - of: (*session).run
    participants:
      - id: caller
        kind: actor
      - id: (*session).run
        kind: self
      - id: s.negotiate
        kind: internal
      - id: s.sendOne
        kind: internal
      - id: s.client.Quit
        kind: value
      - id: wrapAs
        kind: internal
    steps:
      - opt:
          do:
            - return: sessionErr
          init:
            bind: sessionErr
            eval: s.negotiate()
            to: s.negotiate
          when: sessionErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: sendErr
                init:
                  bind: sendErr
                  eval: s.sendOne(delivery)
                  to: s.sendOne
                when: sendErr != nil
          key: _
          range: deliveries
          value: delivery
      - opt:
          do:
            - return: wrapAs(coremail.GreetingFailed, quitErr, errs.String("stage", "quit"))
              to: wrapAs
          init:
            bind: quitErr
            eval: s.client.Quit()
            to: s.client.Quit
          when: quitErr != nil
      - return: nil
  - of: (*session).negotiate
    participants:
      - id: caller
        kind: actor
      - id: (*session).negotiate
        kind: self
      - id: s.client.Hello
        kind: value
      - id: wrapAs
        kind: internal
      - id: s.startTLS
        kind: internal
      - id: s.authenticate
        kind: internal
    steps:
      - opt:
          do:
            - return: wrapAs(coremail.GreetingFailed, helloErr, errs.String("stage", "ehlo"))
              to: wrapAs
          init:
            bind: helloErr
            eval: s.client.Hello(s.cfg.resolvedLocalName())
            to: s.client.Hello
          when: helloErr != nil
      - opt:
