            to: s.client.StartTLS
          when: tlsErr != nil
      - return: nil
  - of: (*session).authenticate
    participants:
      - id: caller
        kind: actor
      - id: (*session).authenticate
        kind: self
      - id: s.client.TLSConnectionState
        kind: value
      - id: errs
        kind: package
      - id: s.client.Extension
        kind: value
      - id: s.client.Auth
        kind: value
      - id: wrapAs
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.cfg.Username == ""
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.AuthInsecure, errs.WrapParams{},
                			errs.String("host", s.cfg.Host), errs.String("tls_mode", s.cfg.TLS.String()))
              to: errs
          init:
            bind: _, encrypted
            eval: s.client.TLSConnectionState()
            to: s.client.TLSConnectionState
          when: "!encrypted"
      - opt:
          do:
            - return: |-
                errs.Wrap(coremail.AuthFailed, errs.WrapParams{},
                			errs.String("host", s.cfg.Host), errs.String("problem", "server advertised no AUTH extension"))
              to: errs
          init:
            bind: offered, _
            eval: s.client.Extension(extensionAuth)
            to: s.client.Extension
          when: "!offered"
      - opt:
          do:
            - return: wrapAs(coremail.AuthFailed, authErr, errs.String("host", s.cfg.Host))
              to: wrapAs
          init:
            bind: authErr
            eval: s.client.Auth(smtp.PlainAuth("", s.cfg.Username, s.cfg.Password, s.cfg.Host))
            to: s.client.Auth
          when: authErr != nil
      - return: nil
  - of: (*session).sendOne
    participants:
      - id: caller
        kind: actor
      - id: (*session).sendOne
        kind: self
      - id: s.client.Mail
        kind: value
      - id: wrapAs
        kind: internal
      - id: s.client.Rcpt
        kind: value
      - id: s.client.Data
        kind: value
