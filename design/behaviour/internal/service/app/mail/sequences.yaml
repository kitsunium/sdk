          when: keep <= 0
      - return: "&memoryTransport{composer: NewComposer(ComposerConfig{}), keep: keep}"
  - of: (*memoryTransport).Send
    participants:
      - id: caller
        kind: actor
      - id: (*memoryTransport).Send
        kind: self
      - id: ctx.Err
        kind: value
      - id: wrapAs
        kind: internal
      - id: Envelope
        kind: internal
      - id: t.composer.Compose
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: wrapAs(coremail.DialFailed, ctxErr)
              to: wrapAs
          init:
            bind: ctxErr
            eval: ctx.Err()
            to: ctx.Err
          when: ctxErr != nil
      - bind: envelope, envelopeErr
        eval: Envelope(msg)
        to: Envelope
      - opt:
          do:
            - return: envelopeErr
          when: envelopeErr != nil
      - bind: raw, composeErr
        eval: t.composer.Compose(msg)
        to: t.composer.Compose
      - opt:
          do:
            - return: composeErr
          when: composeErr != nil
      - lock:
          mutex: t.mutex
      - set: t.sent
        value: "append(t.sent, coremail.DeliveryValue{Envelope: envelope, Raw: raw})"
      - opt:
          do:
            - set: t.sent
              to: slices
              value: slices.Delete(t.sent, 0, len(t.sent)-t.keep)
          when: t.keep > 0 && len(t.sent) > t.keep
      - return: nil
  - of: (*memoryTransport).SendBatch
    participants:
      - id: caller
        kind: actor
      - id: (*memoryTransport).SendBatch
        kind: self
      - id: t.Send
        kind: internal
      - id: errors
        kind: stdlib
