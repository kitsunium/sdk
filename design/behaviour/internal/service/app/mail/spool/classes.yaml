package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/mail/spool
  name: spool
  purpose: Package spool — the spool's construction parameters, the defaults their zero values clamp to, and the refusals.
types:
  - fields:
      - doc: |-
          Transport delivers each mail: the SMTP transport, the capture transport
          in development and tests, a provider's connector.
        name: Transport
        type: coremail.Transport
      - doc: |-
          Clock stamps every mail and every event, bounds every attempt and paces
          every retry. Nil means clock.System; a clock.ManualClock drives a test's
          retries without a sleep.
        name: Clock
        type: clock.Timed
      - doc: |-
          Observe is told what happens to every mail — queued, sent, retrying,
          dead-lettered, dropped as a duplicate — one call at a time, on the
          caller of Send or the spool's own consumer. A mail's Queued event comes
          before every event of its delivery, even when the consumer delivers it
          before Send returns. It must be short, and must not call Send, which
          would wait for the call it is made from. Nil tells nobody: the spool
          writes nothing anywhere itself.
        name: Observe
        type: func(EventValue)
      - doc: |-
          Annotate returns what Send's context knows that a delivery should know
          too — a trace to continue, the caller's identity — kept with the mail
          and handed back to every attempt through AttemptFrom. Nil keeps nothing.
          It must not return a secret: it is written into the spool as it is.
        name: Annotate
        type: func(ctx context.Context) map[string]string
      - doc: |-
          NewID mints the spool's identifier for a mail Send queues; SendWithID
          takes its caller's instead. Nil mints a ULID. Every identifier must be
          new: the spool drops a mail whose identifier it delivered already, as a
          redelivery. One that is empty, longer than MaxIDBytes or not an RFC 5322
          dot-atom is refused at Send (SpoolMisconfigured), since it would become
          the left half of the mail's Message-ID.
        name: NewID
        type: func() (string, error)
      - doc: |-
          Dir is the spool's directory: a durable queue that outlives the
          process, shared by every process that names it. Empty keeps the spool
          in memory, and a process that ends loses what it had not delivered.
          It must stay empty beside a Broker.
        name: Dir
        type: string
      - doc: |-
          Broker is the queue the spool writes into and delivers from, built by
          its caller instead of from Dir — a queue on SQL, so that a mail Send
          queues inside the caller's transaction exists if and only if that
          transaction commits (ADR 0151, ADR 0178). Nil builds the spool's own,
          from Dir. The spool neither sets its policy nor closes it: build it
          with MaxDeliveries equal to MaxAttempts, a VisibilityTimeout of at
          least twice SendTimeout and a MaxMessageBytes that holds a mail with
          its attachments, as the spool's own queue has, and close it after
          Close. Dir and MaxMessageBytes describe the queue the spool would
          build, and are refused beside it (SpoolMisconfigured).
        name: Broker
        type: corequeue.Broker
      - doc: |-
          Deferrer is the transaction manager of Broker's database when Broker
          joins its caller's transaction — the Transactor queue.NewSQL was given
          — and must also be a core/data/sql Aborter, which the SDK's
          transactor is. One field for both, as queue.NewSQL takes one
          Transactor for its Joiner and Deferrer: the two halves of one
          outcome cannot come from two managers.

          With it, a Send made inside one of its transactions tells Observe
          EventQueued after the commit, and nothing at all when the work is
          undone — the transaction or the savepoint the Send ran in rolled
          back —, and a delivery of the mail still waits for that EventQueued.
          A Send outside a transaction tells it at once. While such a
          transaction is open, a delivery of a mail under the same identifier
          waits for it to end.

          Nil tells EventQueued when Send returns, which suits a Broker that
          keeps no transaction; beside a Broker that joins one, it would
          announce a mail a rollback then takes back. Set without a Broker, or
          to a manager that is not an Aborter, it is refused
          (SpoolMisconfigured).
        name: Deferrer
        type: coresql.Deferrer
      - doc: |-
          From is the sender of every mail that names none. It must be a usable
          address when set.
        name: From
        type: coremail.AddressValue
      - doc: |-
          Backoff is the wait before each retry: Backoff.Delay(attempt). The zero
          value is the DefaultRetryBase–DefaultRetryMax curve, and a curve without
          a positive BaseDelay starts from DefaultRetryBase under its own ceiling:
          a failed mail is never retried at once.
        name: Backoff
        type: kbackoff.Value
      - doc: |-
          MaxAttempts is how many deliveries a mail gets before it is
          dead-lettered with its last failure. It is REQUIRED: zero reads as
          "unlimited" or as "none", two opposites, and neither is a mail spool.
        name: MaxAttempts
        type: int
      - doc: SendTimeout bounds one attempt. Not positive means DefaultSendTimeout.
        name: SendTimeout
        type: time.Duration
      - doc: |-
          MaxMessageBytes bounds one spooled mail in the queue the spool builds.
          Zero means DefaultMaxMessageBytes; negative is refused, and so is any
          other value beside a Broker, whose own policy bounds a mail.
        name: MaxMessageBytes
        type: int
      - doc: |-
          PollInterval is how late a mail another PROCESS spooled into Dir may be
          noticed; a mail spooled by this process is delivered at once. Zero is
          the queue's own default.
        name: PollInterval
        type: time.Duration
      - doc: |-
          MaxAge is how long after QueuedAt a mail may still be retried: an
          attempt that fails once MaxAge has passed on Clock dead-letters the
          mail with that failure, marked MailExpired, whatever attempts it had
          left — RFC 5321 §4.5.4.1 gives up after four to five days. The age is
          read when an attempt fails, so a mail is attempted at least once
          however late it is delivered. Zero sets no age: MaxAttempts alone
          decides. Negative is refused (SpoolMisconfigured).
        name: MaxAge
        type: time.Duration
      - doc: |-
          RetryPermanent retries a permanent refusal like a temporary one. By
          default a failure carrying an SMTP 5xx reply — a *net/textproto.Error
          with a Code from 500 to 599 anywhere in its chain — dead-letters the
          mail at once, marked MailRejected, because RFC 5321 §4.2.1 forbids
          repeating a 5yz command unchanged; a 4xx reply, a 552 to RCPT — read
          as 452, too many recipients, by RFC 5321 §4.5.3.1.10 — and a failure
          without a reply are retried. Set it for a relay known to answer 5xx
          for a condition that passes.
        name: RetryPermanent
        type: bool
    kind: struct
    methods:
      - doc: validate refuses a spool that could never deliver.
        name: validate
        recv: c *Config
        results: error
      - doc: |-
          validateBroker refuses the settings a caller's Broker makes inert, and a
          Deferrer that cannot announce what a Broker joined or take it back.
        name: validateBroker
        recv: c *Config
        results: error
    name: Config
  - kind: named
    methods:
      - name: String
        recv: k EventKind
        results: string
    name: EventKind
    underlying: uint8
  - fields:
      - doc: |-
          Err is the failed attempt's error, for EventRetrying and
          EventDeadLettered. A dead letter's carries CodeMailRejected or
          CodeMailExpired when that is why it was given up — errs.HasCode
          reads either —, and the transport's own error, an SMTP reply
          included, stays reachable through errors.As.
        name: Err
        type: error
      - doc: Meta is what Config.Annotate returned when the mail was sent.
        name: Meta
        type: map[string]string
      - doc: |-
          At is when it happened; QueuedAt when the mail was queued; Next when
          the next attempt is due, for EventRetrying.
        name: At
        type: time.Time
      - doc: |-
          At is when it happened; QueuedAt when the mail was queued; Next when
          the next attempt is due, for EventRetrying.
        name: QueuedAt
        type: time.Time
      - doc: |-
          At is when it happened; QueuedAt when the mail was queued; Next when
          the next attempt is due, for EventRetrying.
        name: Next
        type: time.Time
      - doc: ID is the spool's identifier for the mail.
        name: ID
        type: string
      - doc: |-
          Message is the mail, as it was stamped at Send: sender, date and
          Message-ID filled in.
        name: Message
        type: coremail.MessageValue
      - doc: Attempt numbers the delivery attempt, from 1; zero for EventQueued.
        name: Attempt
        type: int
      - doc: Kind says what happened.
        name: Kind
        type: EventKind
    kind: struct
    name: EventValue
  - fields:
      - doc: QueuedAt is when Send queued the mail.
        name: QueuedAt
        type: time.Time
      - doc: Meta is what Config.Annotate returned at Send.
        name: Meta
        type: map[string]string
      - doc: ID is the spool's identifier for the mail.
        name: ID
        type: string
      - doc: Attempt numbers this attempt, from 1.
        name: Attempt
        type: int
    kind: struct
    name: AttemptValue
  - doc: attemptKey keys the AttemptValue in a delivery's context.
    kind: struct
    name: attemptKey
  - fields:
      - doc: Meta is what Config.Annotate returned at Send.
        name: Meta
        type: map[string]string
      - doc: |-
          FailedAt is when the last attempt failed; QueuedAt when the mail was
          queued.
        name: FailedAt
        type: time.Time
      - doc: |-
          FailedAt is when the last attempt failed; QueuedAt when the mail was
          queued.
        name: QueuedAt
        type: time.Time
      - doc: |-
          ID is the spool's identifier for the mail — empty when the record did
          not decode, and QueueID then names it.
        name: ID
        type: string
      - doc: QueueID is the queue's identifier for the record.
        name: QueueID
        type: string
      - doc: |-
          Reason and Cause are the last failure's SCREAMING_SNAKE reason and its
          wire-safe Public text; the Private half stayed in the failing
          process's log.
        name: Reason
        type: string
      - doc: |-
          Reason and Cause are the last failure's SCREAMING_SNAKE reason and its
          wire-safe Public text; the Private half stayed in the failing
          process's log.
        name: Cause
        type: string
      - doc: Message is the mail, as it was spooled.
        name: Message
        type: coremail.MessageValue
      - doc: Attempts is how many deliveries it got.
        name: Attempts
        type: int
      - doc: Code is the last failure's dotted-quad code, or 0.
        name: Code
        type: uint32
    kind: struct
    name: DeadLetterValue
  - doc: ledger remembers the last size identifiers it was given, in a ring.
    fields:
      - doc: seen indexes the ring.
        name: seen
        type: map[string]struct{}
      - doc: ring holds the identifiers, oldest overwritten first.
        name: ring
        type: "[]string"
      - doc: mu guards everything.
        name: mu
        type: sync.Mutex
      - doc: next is the ring slot the next identifier takes.
        name: next
        type: int
    kind: struct
    methods:
      - doc: add remembers id, forgetting the oldest identifier when the ring is full.
        name: add
        params: id string
        recv: l *ledger
      - doc: has reports whether id is remembered.
        name: has
        params: id string
        recv: l *ledger
        results: bool
    name: ledger
  - doc: spooledValue is one mail as the spool writes it into the queue.
    fields:
      - doc: QueuedAt is when Send queued it.
        name: QueuedAt
        type: time.Time
      - doc: Meta is what Config.Annotate returned at Send.
        name: Meta
        type: map[string]string
      - doc: ID is the spool's identifier.
        name: ID
        type: string
      - doc: Message is the stamped mail.
        name: Message
        type: coremail.MessageValue
    kind: struct
    name: spooledValue
  - doc: |-
      announcement is the Sends of one identifier that published their mail and
      have not yet told the observer. Nothing stops an identifier from repeating,
      so there may be several at once, and a delivery of that identifier waits
      for the last of them.
    fields:
      - doc: told is closed once pending falls to zero.
        name: told
        type: chan struct{}
      - doc: pending counts them; the spool's mu guards it.
        name: pending
        type: int
    kind: struct
    name: announcement
  - fields:
      - doc: transport delivers each mail.
        name: transport
        type: coremail.Transport
      - doc: broker is the queue the spool writes into.
        name: broker
        type: corequeue.Broker
      - doc: |-
          deferrer and aborter are Config.Deferrer's two halves, nil without it:
          what tells the observer after a commit, and what ends a registration
          when the work is undone.
        name: deferrer
        type: coresql.Deferrer
      - name: aborter
        type: coresql.Aborter
      - doc: clock stamps, bounds and paces.
        name: clock
        type: clock.Timed
      - doc: observe, annotate and newID are the configured functions.
        name: observe
        type: func(EventValue)
      - name: annotate
        type: func(ctx context.Context) map[string]string
      - name: newID
        type: func() (string, error)
      - doc: |-
          permanent reports whether a failure is never to be retried:
          permanentReply, or nil with Config.RetryPermanent, which retries all.
        name: permanent
        type: func(error) bool
      - doc: delivered remembers the mails this spool delivered.
        name: delivered
        type: "*ledger"
      - doc: from is the default sender.
        name: from
        type: coremail.AddressValue
      - doc: backoff is the retry curve.
        name: backoff
        type: kbackoff.Value
      - doc: |-
          announcing maps the identifier of a mail a Send published and has not
          yet told the observer about to the Sends of that identifier still in
          that window: a delivery of that identifier waits until none is before
          it reports anything.
        name: announcing
        type: map[string]*announcement
      - doc: |-
          maxAttempts, sendTimeout, poll and maxAge are the resolved limits;
          maxAge is zero for no age.
        name: maxAttempts
        type: int
      - name: sendTimeout
        type: time.Duration
      - name: poll
        type: time.Duration
      - name: maxAge
        type: time.Duration
      - doc: observing serialises the observer's calls.
        name: observing
        type: sync.Mutex
      - doc: |-
          closing guards closed and the queue's lifetime: every publication
          holds it for reading, and Close for writing, so Close waits for a
          publication in flight and none starts after it.
        name: closing
        type: sync.RWMutex
      - doc: mu guards announcing.
        name: mu
        type: sync.RWMutex
      - name: closed
        type: bool
      - doc: |-
          ownsBroker is true for the queue the spool built, which Close closes;
          a Config.Broker stays its caller's.
        name: ownsBroker
        type: bool
    kind: struct
    methods:
      - doc: |-
          deliver is the spool's queue handler. Returning nil acknowledges; returning
          an error nacks, which on the last attempt dead-letters the mail with that
          error. A failure giveUp condemns is returned marked DoNotRetry, which the
          consumer turns into the queue's Reject: dead-lettered on this attempt.

          A failure with attempts left does neither: the lease is extended by the
          backoff and the handler returns nil. The extension replaced the receipt, so
          the consumer's acknowledgement of the old one is refused LeaseExpired —
          which the consumer ignores, as it ignores every lapsed acknowledgement — and
          the mail comes back when the new lease lapses, its delivery counted.
        name: deliver
        params: ctx context.Context, delivery corequeue.DeliveryValue
        recv: s *Spool
        results: error
      - doc: |-
          attempt hands the mail to the transport, with the attempt in the context
          and bounded by SendTimeout on the spool's clock.

          Goroutine lifecycle: one per attempt waits on the timeout timer. It ends
          when the attempt returns (finished closes) or when the timer fires and
          cancels the attempt's context; attempt closes finished on every way out.
        name: attempt
        params: ctx context.Context, record *spooledValue, attempt int
        recv: s *Spool
        results: error
      - doc: |-
          send hands the mail to the transport and turns a panic into
          TransportPanicked, the attempt's failure like any other.
        name: send
        params: ctx context.Context, record *spooledValue
        recv: s *Spool
        results: err error
      - doc: |-
          park extends the delivery's lease by delay and reports whether it could: a
          queue without the LeaseExtender capability cannot, and neither can a lease
          that already lapsed.
        name: park
        params: ctx context.Context, delivery corequeue.DeliveryValue, delay time.Duration
        recv: s *Spool
        results: bool
      - doc: |-
          giveUp returns the failure a mail is dead-lettered with at once, or nil to
          let the backoff and MaxAttempts decide — always nil over a broker that is
          not a core/data/queue.Rejecter. A permanent SMTP reply is
          MailRejected unless RetryPermanent left s.permanent nil; a failure once
          MaxAge has passed since queuedAt is MailExpired. Either is added to
          sendErr, which stays the origin when it is an SDK error and stays reachable
          through errors.As when not.
        name: giveUp
        params: sendErr error, queuedAt, failedAt time.Time
        recv: s *Spool
        results: error
      - name: Send
        params: ctx context.Context, msg coremail.MessageValue
        recv: s *Spool
        results: id string, err error
      - name: SendWithID
        params: ctx context.Context, id string, msg coremail.MessageValue
        recv: s *Spool
        results: error
      - doc: |-
          mint asks Config.NewID for an identifier and holds it to the rule
          SendWithID holds a caller's to: one the generator got wrong is the
          configuration's defect, not the mail's.
        name: mint
        recv: s *Spool
        results: string, error
      - doc: |-
          queue stamps msg under id, writes it into the spool and tells the observer
          it was queued. When it returns an error, nothing was queued.
        name: queue
        params: ctx context.Context, id string, msg coremail.MessageValue
        recv: s *Spool
        results: error
      - doc: |-
          holdAnnouncement holds the mail's EventQueued, and then the end of its
          registration, until the transaction ctx carries for Config.Deferrer
          commits, and ends the registration without a word when that work is undone
          instead (ADR 0178). It reports whether it held them; false — no Deferrer,
          no transaction of its manager on ctx — leaves both to the caller, now.

          The abort half is held first: once it is, a transaction that settles
          before the commit half is held has either run it — a rollback, and end is
          spent — or dropped it with a commit that stood, and the caller announces
          the mail itself, as it does outside a transaction.
        name: holdAnnouncement
        params: ctx context.Context, event *EventValue, end func()
        recv: s *Spool
        results: bool
      - doc: isClosed reports whether Close ran.
        name: isClosed
        recv: s *Spool
        results: bool
      - doc: |-
          publish writes payload into the queue, unless the spool closed meanwhile.
          It holds closing for reading throughout, so Close waits for it and never
          closes the queue under it; the observer is told afterwards, outside it.
        name: publish
        params: ctx context.Context, payload []byte
        recv: s *Spool
        results: error
      - doc: |-
          announce registers a Send of id that is publishing its mail and has not yet
          told the observer, and returns the function that ends the registration —
          once the observer was told, or once the publication failed. The Sends of
          one identifier are counted, not replaced: an identifier can repeat, and the
          Send that tells the observer first must not release a delivery another has
          not told it about yet. A spool nobody observes registers nothing: there is
          no order to keep.
        name: announce
        params: id string
        recv: s *Spool
        results: done func()
      - doc: |-
          awaitAnnouncement waits until the observer has heard that the mail id was
          queued, when a Send that queued it is still running in this process: until
          no Send of id is left between its publication and its Queued event. A mail
          an earlier process queued has nothing to wait for.
        name: awaitAnnouncement
        params: id string
        recv: s *Spool
      - doc: |-
          stamp fills in what a retry must not change under id and validates the
          result.
        name: stamp
        params: ctx context.Context, id string, msg coremail.MessageValue
        recv: s *Spool
        results: spooledValue, error
      - name: Run
        params: ctx context.Context
        recv: s *Spool
        results: error
      - name: DeadLetters
        params: ctx context.Context, maxLetters int
        recv: s *Spool
        results: "[]DeadLetterValue, error"
      - name: Close
        recv: s *Spool
        results: error
      - doc: emit tells the observer, when there is one, one call at a time.
        name: emit
        params: event *EventValue
        recv: s *Spool
      - doc: |-
          report tells the observer about a delivery, after the Queued event of the
          same mail: a mail is never sent, retried or dropped before it was queued,
          as far as the observer can tell.
        name: report
        params: event *EventValue
        recv: s *Spool
    name: Spool
