# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      The defaults a zero field clamps to (ADR 0031: each zero has one reading —
      "not thought about" — and the value below is the one that needs no
      explanation).
    grouped: true
    items:
      - doc: |-
          DefaultSendTimeout bounds one hand-over to the transport. The lease a
          delivery holds is twice it, so a slow relay can never make the queue
          hand the same mail to a second attempt while the first is still talking.
        name: DefaultSendTimeout
        type: time.Duration
        value: time.Minute
      - doc: |-
          DefaultRetryBase and DefaultRetryMax bound the wait between attempts:
          one second after the first failure, doubling, never more than five
          minutes. A zero backoff would retry at once — a relay that is down would
          be dialled as fast as the queue can lease.
        name: DefaultRetryBase
        type: time.Duration
        value: time.Second
      - name: DefaultRetryMax
        type: time.Duration
        value: 5 * time.Minute
      - doc: |-
          DefaultMaxMessageBytes bounds one spooled mail, attachments included,
          as the record the spool writes. It is above the queue's own default
          because a mail with an attachment is routinely a few megabytes.
        name: DefaultMaxMessageBytes
        type: int
        value: 32 << 20
      - doc: |-
          DeliveredMemory is how many delivered mails the spool remembers, by ID,
          to drop a redelivery rather than send it twice.
        name: DeliveredMemory
        type: int
        value: "1024"
    name: DefaultSendTimeout
  - doc: |-
      The SMTP reply codes RFC 5321 §4.2.1 calls permanent negative completion:
      5yz.
    grouped: true
    items:
      - name: permanentReplyMin
        type: int
        value: "500"
      - name: permanentReplyMax
        type: int
        value: "599"
      - doc: |-
          rcptTooManyRecipients is the 552 RFC 5321 §4.5.3.1.10 has a client
          read as 452 when RCPT gets it.
        name: rcptTooManyRecipients
        type: int
        value: "552"
    name: permanentReplyMin
  - doc: What can happen to a spooled mail. The zero value is none of them.
    grouped: true
    items:
      - doc: "EventQueued: Send or SendWithID put the mail in the spool."
        name: EventQueued
        type: EventKind
        value: iota + 1
      - doc: "EventSent: the transport accepted the mail."
        name: EventSent
      - doc: "EventRetrying: an attempt failed and the next is due at Next."
        name: EventRetrying
      - doc: |-
          EventDeadLettered: the mail is kept, with its failure, and never
          delivered again — its last attempt failed, the receiving server
          refused it for good (CodeMailRejected), or an attempt failed after
          Config.MaxAge (CodeMailExpired).
        name: EventDeadLettered
      - doc: |-
          EventDuplicate: the queue handed back a mail under an identifier this
          spool had already delivered — its lease lapsed while the relay was
          accepting it, or a SendWithID repeated the identifier — and it was
          dropped instead of sent twice. A repeat's own EventQueued comes first,
          so an observer keyed by identifier reads this one as "delivered
          already".
        name: EventDuplicate
    name: EventQueued
  - doc: |-
      MaxIDBytes bounds a mail's identifier, whoever minted it. It is well above
      every identifier the SDK mints — a UUID, a ULID, a TypeID under the longest
      prefix TypeID allows — and low enough that "Message-ID: <id@domain>" keeps
      within RFC 5322's line limit beside the longest domain an address may carry.
    items:
      - name: MaxIDBytes
        type: int
        value: "255"
    name: MaxIDBytes
