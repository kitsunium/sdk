functions:
  - doc: misconfigured is SpoolMisconfigured naming a setting and its problem.
    name: misconfigured
    params: setting, problem string
    results: error
  - doc: |-
      permanentReply reports whether err carries an SMTP reply of the 5yz class
      anywhere in its chain: the SDK's SMTP transport keeps it reachable for a
      refused MAIL, RCPT or DATA, and a connector may return one as it is.

      A 552 to RCPT is the one 5yz it reads as temporary: RFC 5321 §4.5.3.1.10
      has clients treat it as 452, too many recipients, because servers long
      answered that condition with 552. The SDK's transport names the command
      in the failure's "command" field.
    name: permanentReply
    params: err error
    results: bool
  - doc: failedAt reports whether err names command in its "command" field.
    name: failedAt
    params: err error, command string
    results: bool
  - doc: |-
      mark adds sentinel to cause as core/data/queue.DoNotRetry adds its own: an
      SDK cause keeps its Reason, Code and Public and gains the sentinel's code in
      its trail, and any other cause takes the sentinel as its origin and stays
      its source.
    name: mark
    params: cause error, sentinel *kerrs.Error, fields ...kerrs.FieldValue
    results: error
  - name: AttemptFrom
    params: ctx context.Context
    results: attempt AttemptValue, ok bool
  - doc: withAttempt returns ctx carrying attempt.
    name: withAttempt
    params: ctx context.Context, attempt AttemptValue
    results: context.Context
  - doc: |-
      checkID reports whether id is an identifier a mail can keep, and names the
      rule it breaks when it is not. An identifier is non-empty, at most
      MaxIDBytes, and an RFC 5322 dot-atom — the grammar of a Message-ID's left
      half — so it is printable ASCII: it can neither end a header nor split one,
      and it comes back from the spool's JSON as the bytes it went in as.
    name: checkID
    params: id string
    results: problem string, ok bool
  - doc: newLedger returns a ledger remembering size identifiers.
    name: newLedger
    params: size int
    results: "*ledger"
  - name: New
    params: cfg Config
    results: "*Spool, error"
  - doc: resolve builds the spool's fields from cfg, applying the documented clamps.
    name: resolve
    params: cfg *Config
    results: "*Spool"
  - doc: maxMessageBytes resolves the bound on one spooled mail.
    name: maxMessageBytes
    params: configured int
    results: int
  - doc: "domainOf returns the domain of an addr-spec: what follows its last '@'."
    name: domainOf
    params: addr string
    results: string
