                do:
                  - set: record
                    value: spooledValue{}
                when: json.Unmarshal(letter.Message.Payload, &record) != nil
            - set: out[i]
              value: |-
                DeadLetterValue{
                			Meta: record.Meta, FailedAt: letter.FailedAt, QueuedAt: record.QueuedAt, ID: record.ID,
                			QueueID: letter.Message.ID, Reason: letter.Reason, Cause: letter.Cause,
                			Message: record.Message, Attempts: letter.Deliveries, Code: letter.Code,
                		}
          key: i
          range: dead
          value: letter
      - return: out, nil
  - of: (*Spool).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Spool).Close
        kind: self
      - id: closer.Close
        kind: value
    steps:
      - lock:
          mutex: s.closing
      - opt:
          do:
            - return: nil
          when: s.closed
      - set: s.closed
        value: "true"
      - bind: closer, closable
        eval: s.broker.(io.Closer)
      - opt:
          do:
            - return: nil
          when: "!closable || !s.ownsBroker"
      - return: closer.Close()
        to: closer.Close
  - of: (*Spool).emit
    steps:
      - opt:
          do:
            - return: ""
          when: s.observe == nil
      - lock:
          mutex: s.observing
      - eval: s.observe(*event)
  - of: (*Spool).report
    participants:
      - id: caller
        kind: actor
      - id: (*Spool).report
        kind: self
      - id: s.awaitAnnouncement
        kind: internal
      - id: s.emit
        kind: internal
    steps:
      - eval: s.awaitAnnouncement(event.ID)
        to: s.awaitAnnouncement
      - eval: s.emit(event)
        to: s.emit
