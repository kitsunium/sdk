# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The octet bounds the address and header grammars are written in.
    grouped: true
    items:
      - doc: |-
          maxLocalPartOctets and maxDomainOctets are the RFC 5321 §4.5.3.1
          ceilings. They are the protocol's, not this domain's: a longer local part
          or domain is not merely unusual, it is undeliverable, and discovering
          that after the DATA command has been accepted is worse than discovering
          it in a constructor.
        name: maxLocalPartOctets
        type: int
        value: "64"
      - name: maxDomainOctets
        type: int
        value: "255"
      - doc: |-
          minPrintableASCII is "!", the first character RFC 5322 §3.6.8 admits in
          a field name. It and the three below are named because a bare 0x21 in a
          comparison is a number a reader has to look up, and because the same
          four bounds are used by three different guards.
        name: minPrintableASCII
        type: byte
        value: "0x21"
      - doc: maxPrintableASCII is "~", the last one.
        name: maxPrintableASCII
        type: byte
        value: "0x7E"
      - doc: spaceOctet is the space, which ends an atom rather than belonging to one.
        name: spaceOctet
        type: byte
        value: "0x20"
      - doc: delOctet is DEL, the first octet above the printable range.
        name: delOctet
        type: byte
        value: "0x7F"
    name: maxLocalPartOctets
  - doc: |-
      specials is RFC 5322 §3.2.3's "specials" production. A display name
      containing one of these MUST be a quoted-string, or the receiver parses the
      name as structure: "Doe, John <j@x>" is two addresses, one of them
      syntactically broken, and every client shows something different.
    items:
      - name: specials
        type: string
        value: "`()<>[]:;@\\,.\"`"
    name: specials
  - doc: |-
      pathSeparators are the two characters a filename may not carry. A path
      separator in a filename is how an unpacking client is talked into writing
      outside the directory it chose.
    items:
      - name: pathSeparators
        type: string
        value: "`/\\`"
    name: pathSeparators
  - doc: Media types this composer emits for the two body forms.
    grouped: true
    items:
      - name: typeTextPlain
        type: string
        value: "\"text/plain\""
      - name: typeTextHTML
        type: string
        value: "\"text/html\""
    name: typeTextPlain
  - doc: mimeVersion is the only value RFC 2045 §4 defines.
    items:
      - name: mimeVersion
        type: string
        value: "\"1.0\""
    name: mimeVersion
  - doc: |-
      boundaryTokenOctets is the number of random bytes behind every boundary in
      one message. 16 is 128 bits, which is not a probability argument here — see
      [composition.newBoundary] for why a collision is impossible rather than
      unlikely.
    items:
      - name: boundaryTokenOctets
        type: int
        value: "16"
    name: boundaryTokenOctets
  - doc: |-
      minBracketedLen is the shortest string that can already carry both angle
      brackets a Message-ID or Content-ID needs.
    items:
      - name: minBracketedLen
        type: int
        value: "2"
    name: minBracketedLen
  - doc: |-
      Per-message allowances for [estimateSize]. They are deliberately generous:
      the cost of over-estimating is one larger allocation that is released
      immediately, and the cost of under-estimating is the doubling growth this
      function exists to avoid.
    grouped: true
    items:
      - name: headerBlockSlack
        type: int
        value: "512"
      - name: perAddressOctets
        type: int
        value: "96"
      - name: perAttachmentSlack
        type: int
        value: "384"
      - name: subjectExpansion
        type: int
        value: "4"
      - doc: |-
          quotedPrintableSlack is the denominator of the fraction added to a text
          body: QP expands ASCII by about 2 % and non-ASCII by three, so a quarter
          is a middle that is wrong cheaply in both directions.
        name: quotedPrintableSlack
        type: int
        value: "4"
      - doc: |-
          crlfOctets is the two-octet line terminator every wrapped base64 line
          costs on top of its content.
        name: crlfOctets
        type: int
        value: "2"
    name: headerBlockSlack
  - doc: |-
      base64LineOctets is the RFC 2045 §6.8 ceiling: "no more than 76 characters"
      per encoded line.
    items:
      - name: base64LineOctets
        type: int
        value: "76"
    name: base64LineOctets
  - doc: Content-Transfer-Encoding values this domain emits (RFC 2045 §6).
    grouped: true
    items:
      - name: encodingQuotedPrintable
        type: string
        value: "\"quoted-printable\""
      - name: encodingBase64
        type: string
        value: "\"base64\""
    name: encodingQuotedPrintable
  - doc: |-
      forbiddenHeaderOctets are the three octets a header value may never carry.
      CR and LF end a field; NUL terminates the value for any consumer that
      reaches C and is never meaningful in a header.
    items:
      - name: forbiddenHeaderOctets
        type: string
        value: "\"\\r\\n\\x00\""
    name: forbiddenHeaderOctets
  - doc: |-
      RFC 5322 §2.1.1's two line limits. They are not the same kind of rule: 998 is
      a MUST NOT (excluding the CRLF) and 78 is a SHOULD. So 78 is where folding
      starts and 998 is where refusal starts.
    grouped: true
    items:
      - name: softLineOctets
        type: int
        value: "78"
      - name: hardLineOctets
        type: int
        value: "998"
    name: softLineOctets
  - doc: |-
      crlf is the only line terminator this domain writes. RFC 5322 §2.1 makes it
      the terminator; a lone LF is what a Unix-shaped writer produces by accident
      and what an MTA silently repairs — differently from the next MTA.
    items:
      - name: crlf
        type: string
        value: "\"\\r\\n\""
    name: crlf
  - doc: |-
      minFoldTail is the smallest continuation a fold may leave behind: the space
      it folds at, plus at least one octet after it. A fold that left only the
      space would emit a line of whitespace, which unfolds to nothing.
    items:
      - name: minFoldTail
        type: int
        value: "2"
    name: minFoldTail
  - doc: |-
      DefaultCaptureKeep is how many deliveries [NewCapture] keeps when it is
      given a non-positive number: enough for a person to scroll a mailbox, and a
      bound on the memory a development server holds for mail nobody will read.
    items:
      - name: DefaultCaptureKeep
        type: int
        value: "200"
    name: DefaultCaptureKeep
  - doc: SMTP extension names, as they appear in an EHLO response.
    grouped: true
    items:
      - name: extensionStartTLS
        type: string
        value: "\"STARTTLS\""
      - name: extensionAuth
        type: string
        value: "\"AUTH\""
    name: extensionStartTLS
  - doc: |-
      defaultDialTimeout bounds the TCP connection when the caller sets none and
      the context carries no deadline. It CLAMPS rather than refuses: unlike a TLS
      mode, "wait forever" is not a policy anybody chooses on purpose, and thirty
      seconds needs no explanation (ADR 0031's clamping half).
    items:
      - name: defaultDialTimeout
        type: time.Duration
        value: 30 * time.Second
    name: defaultDialTimeout
  - doc: maxPort is the highest TCP port number.
    items:
      - name: maxPort
        type: int
        value: "65535"
    name: maxPort
  - doc: |-
      defaultLocalName is the EHLO name net/smtp itself uses when given none. A
      submission server ignores which one it receives.
    items:
      - name: defaultLocalName
        type: string
        value: "\"localhost\""
    name: defaultLocalName
  - grouped: true
    items:
      - doc: TLSUnset is the zero value and is refused at construction.
        name: TLSUnset
        type: TLSMode
        value: iota
      - doc: |-
          TLSStartTLS connects in the clear, sends EHLO, and REQUIRES the server
          to advertise STARTTLS (RFC 3207). A server that does not is refused with
          [coremail.TLSRequired] — the session is never continued unencrypted. This is the
          submission port 587 shape.
        name: TLSStartTLS
      - doc: |-
          TLSImplicit negotiates TLS before the SMTP greeting, which RFC 8314 §3.3
          recommends over STARTTLS because there is no plaintext phase for an
          attacker to interfere with. This is the submissions port 465 shape.
        name: TLSImplicit
      - doc: |-
          TLSDisabled sends everything in the clear, and must be spelled out loud.
          It exists for a relay on a loopback or a private segment where TLS is
          somebody else's layer. Credentials are REFUSED with it at construction:
          there is no combination of settings in this package that sends a
          password over an unencrypted socket.
        name: TLSDisabled
    name: TLSUnset
  - doc: |-
      viewTypeName and configTypeName are the two spellings of the struct's name
      %#v produces: the view's, and the one a reader of the rendering expects.
    grouped: true
    items:
      - doc: viewTypeName is how fmt names smtpConfigView in Go syntax.
        name: viewTypeName
        type: string
        value: "\"mail.smtpConfigView\""
      - doc: configTypeName is how the rendering names the type it describes.
        name: configTypeName
        type: string
        value: "\"mail.SMTPConfig\""
    name: viewTypeName
  - doc: The two schemes ParseURL reads, and the one parameter.
    grouped: true
    items:
      - doc: |-
          schemeSMTP is submission: STARTTLS unless the tls parameter says
          otherwise.
        name: schemeSMTP
        type: string
        value: "\"smtp\""
      - doc: |-
          schemeSMTPS is submissions: implicit TLS, which the tls parameter may
          only repeat.
        name: schemeSMTPS
        type: string
        value: "\"smtps\""
      - doc: tlsParameter is the only query parameter understood.
        name: tlsParameter
        type: string
        value: "\"tls\""
    name: schemeSMTP
  - doc: |-
      The default port of each mode: RFC 8314 §3.3 submission with STARTTLS, §3.1
      submissions with implicit TLS, and the relay port for a plaintext relay.
    grouped: true
    items:
      - doc: portStartTLS is submission (RFC 6409).
        name: portStartTLS
        type: int
        value: "587"
      - doc: portImplicit is submissions (RFC 8314 §3.1).
        name: portImplicit
        type: int
        value: "465"
      - doc: portRelay is SMTP relay (RFC 5321).
        name: portRelay
        type: int
        value: "25"
    name: portStartTLS
