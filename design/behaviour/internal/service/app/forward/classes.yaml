imports:
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  coreforward: github.com/kitsunium/sdk/internal/core/app/forward
  coremetrics: github.com/kitsunium/sdk/internal/core/observe/metrics
  corequeue: github.com/kitsunium/sdk/internal/core/data/queue
  coreres: github.com/kitsunium/sdk/internal/core/app/resilience
  coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
  kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
  kerrs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  svcmetrics: github.com/kitsunium/sdk/internal/service/observe/metrics
  svcqueue: github.com/kitsunium/sdk/internal/service/data/queue
  svcres: github.com/kitsunium/sdk/internal/service/app/resilience
  svctrace: github.com/kitsunium/sdk/internal/service/observe/trace
  sync: sync
