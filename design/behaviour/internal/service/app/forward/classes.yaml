package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/forward
  name: forward
  purpose: "Package forward is the store-and-forward engine (ADR 0185): a batch kept in a durable queue by Enqueue, sent later by Run through the caller's Sender, retried by resilience's retry on the injected clock — the delay a collector imposes honoured in full, the backoff otherwise, the batch's age as the budget —, dead-lettered when the sender refuses it for good, and counted at every step."
types:
  - kind: named
    name: Sender
    underlying: func(ctx context.Context, batch []byte) error
  - kind: named
    methods:
      - name: String
        recv: p FullPolicy
        results: string
    name: FullPolicy
    underlying: uint8
  - fields:
      - doc: |-
          Broker is the queue the forwarder holds its batches in: a directory
          (queue.NewFile) for a backlog that outlives the process, a table
          (queue.NewSQL), or memory. One queue per signal. Build it with a
          VisibilityTimeout above SendTimeout, a MaxDeliveries no outage reaches
          — MaxAge is the forwarder's budget — and a MaxMessageBytes that holds
          a batch. The forwarder neither sets its policy nor closes it.
        name: Broker
        type: corequeue.Broker
      - doc: |-
          Send ships one stored batch: an OTLP/HTTP exporter's ExportDocument,
          or any function of that shape.
        name: Send
        type: Sender
      - doc: |-
          Retryable classifies a failure of Send as one a later attempt may cure
          — trace.OTLPRetryable, metrics.OTLPRetryable. It is REQUIRED: nil reads
          as "retry everything" or as "retry nothing", two opposites. A failure
          it calls permanent is dead-lettered at once.
        name: Retryable
        type: func(error) bool
      - doc: |-
          Clock paces every retry, bounds every attempt and the wait of Block,
          and ages every batch. Nil means clock.System; a clock.ManualClock drives
          a test without a sleep. It must be the broker's: a batch's age is read
          from the instant the broker stamped.
        name: Clock
        type: clock.Timed
      - doc: |-
          MaxBatches bounds the batches the forwarder holds. Zero means
          DefaultMaxBatches; negative is refused.
        name: MaxBatches
        type: int
      - doc: |-
          MaxBytes bounds the bytes the forwarder holds. Zero means
          DefaultMaxBytes; negative is refused. A batch larger on its own is
          refused with BatchTooLarge.
        name: MaxBytes
        type: int64
      - doc: |-
          WhenFull is what Enqueue does when either bound is reached. The zero
          is DropOldest.
        name: WhenFull
        type: FullPolicy
      - doc: |-
          BlockTimeout bounds the wait of Block. Zero means DefaultBlockTimeout;
          negative is refused.
        name: BlockTimeout
        type: time.Duration
      - doc: |-
          SendTimeout bounds one attempt, on Clock. Zero means
          DefaultSendTimeout; negative is refused.
        name: SendTimeout
        type: time.Duration
      - doc: |-
          MaxAge is how long after the queue accepted it a batch may still be
          sent: one delivered older is dropped unsent, one whose retryable
          failure finds it older is not retried; either is acknowledged and
          counted Expired. A Retry-After is honoured in full, but never past it.
          Zero means DefaultMaxAge; negative is refused.
        name: MaxAge
        type: time.Duration
      - doc: |-
          Backoff is the wait before each retry when the failure imposes none:
          Backoff.Delay(attempt). The zero value is the
          DefaultRetryBase–DefaultRetryMax curve, and a curve without a positive
          BaseDelay starts from DefaultRetryBase under its own ceiling: a failed
          batch is never retried at once.
        name: Backoff
        type: kbackoff.Value
      - doc: |-
          Parallelism is how many consumers send at once. Non-positive is one,
          which keeps the queue's order while nothing fails and sends one request
          at a time to a collector that is down; above one there is no order.
        name: Parallelism
        type: int
      - doc: |-
          PollInterval is how late a batch another PROCESS queued may be
          noticed; one Enqueue queued in this process is sent at once. Zero is
          the queue's own default.
        name: PollInterval
        type: time.Duration
      - doc: |-
          DrainTimeout is how long the batch being sent when Run's context ends
          may still run. Zero stops it at once; it is then handed back uncounted
          and sent by the next process.
        name: DrainTimeout
        type: time.Duration
      - doc: |-
          SettleTimeout bounds each acknowledgement and hand-back once Run's
          context has ended. Zero is the queue's own default.
        name: SettleTimeout
        type: time.Duration
      - doc: |-
          RecountInterval is how long the counts go before the queue is counted
          again, over a broker that lists its messages: a read of Stats, or a
          batch leaving the queue, once it has passed has Run list the queue and
          count what another process changed in it — a dead letter replayed into
          it, a batch another consumer took. The delivery of a batch the
          forwarder did not count has it counted at once, once per interval at
          most. A count reads every live batch, its payload included, on Run's
          goroutine and never on
          Enqueue's: it costs what the backlog weighs. Zero means
          DefaultRecountInterval; negative is refused.
        name: RecountInterval
        type: time.Duration
    kind: struct
    methods:
      - doc: validate refuses a configuration no forwarder can run under.
        name: validate
        recv: c *Config
        results: error
      - doc: |-
          validateBounds refuses a negative bound or timeout: a zero is a default,
          a negative has no reading.
        name: validateBounds
        recv: c *Config
        results: error
      - doc: |-
          normalized resolves every clamped field, so the engine reads numbers rather
          than remembering defaults.
        name: normalized
        recv: c *Config
        results: Config
    name: Config
  - fields:
      - doc: |-
          room holds one signal, sent when a batch leaves the queue, which the
          one producer waiting under Block — Enqueue is serialised — wakes on. A
          signal nobody waited for only makes the next wait look again.
        name: room
        type: chan struct{}
      - doc: |-
          recount holds one request for Run to count the queue again; a request
          already pending makes another one nothing.
        name: recount
        type: chan struct{}
      - doc: |-
          reader lists the queue without leasing it; nil when the broker cannot,
          and then the counts are this process's alone.
        name: reader
        type: corequeue.MessageReader
      - doc: |-
          held is every batch counted, by identifier: its size. Pending is its
          length and PendingBytes the sum of its sizes.
        name: held
        type: map[string]int64
      - doc: |-
          leaving is every batch settled — sent, expired, dead-lettered or
          dropped — that a count may still list, because the consumer settles a
          batch before the broker forgets it: the count it was settled before,
          by generation. A count forgets those it no longer lists. Nil when the
          broker cannot list its messages.
        name: leaving
        type: map[string]uint64
      - doc: |-
          recorded is every batch Enqueue kept while a count lists the queue,
          nil outside one: the listing may have missed it.
        name: recorded
        type: map[string]struct{}
      - doc: |-
          counted is when the queue was last counted, prompted when a batch
          another process queued last asked for a count at once, generation how
          many counts Run started.
        name: counted
        type: time.Time
      - doc: |-
          counted is when the queue was last counted, prompted when a batch
          another process queued last asked for a count at once, generation how
          many counts Run started.
        name: prompted
        type: time.Time
      - name: generation
        type: uint64
      - doc: cfg is the normalized configuration.
        name: cfg
        type: Config
      - doc: stats is what the forwarder holds and has done.
        name: stats
        type: StatsValue
      - doc: |-
          admit serialises Enqueue, so two producers never both make room for
          one slot.
        name: admit
        type: sync.Mutex
      - doc: |-
          publish is held from a publication until its batch is counted, so a
          batch that leaves the queue before Enqueue counted it, and a count that
          lists it first, wait for that and never take it for another
          process's. It is taken before mu, never after.
        name: publish
        type: sync.Mutex
      - doc: |-
          mu guards stats, held, leaving, recorded, counted, prompted and
          generation.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          deliver is the queue handler: one batch, retried while its failure is
          retryable and its age allows, then acknowledged — sent or expired — or
          dead-lettered. A stop hands it back as it is.
        name: deliver
        params: ctx context.Context, delivery corequeue.DeliveryValue
        recv: f *Forwarder
        results: error
      - doc: |-
          retry is the policy one batch is retried under: as many attempts as its
          age allows, each failure classified by Config.Retryable, each wait the
          delay the failure imposes or the backoff, on the forwarder's clock.
        name: retry
        params: expiry time.Time
        recv: f *Forwarder
        results: coreres.Runner
      - doc: |-
          delay is the wait before the attempt-th retry: what the failure imposes —
          a collector's Retry-After —, recorded, else the backoff curve; either held
          at what is left of the batch's age.
        name: delay
        params: attempt int, failed error, expiry time.Time
        recv: f *Forwarder
        results: time.Duration
      - doc: |-
          attempt sends payload once, its context cancelled when SendTimeout passes
          on the forwarder's clock.

          Goroutine lifecycle: one per attempt waits on the timeout timer. It ends
          when the attempt returns (done closes) or when the timer fires and cancels
          the attempt's context; attempt closes done on every way out.
        name: attempt
        params: ctx context.Context, payload []byte
        recv: f *Forwarder
        results: error
      - name: Enqueue
        params: ctx context.Context, batch []byte
        recv: f *Forwarder
        results: error
      - doc: |-
          publishCounted publishes batch and counts it, under publish: a batch that
          leaves the queue before it is counted, and a count that lists it first,
          wait for it.
        name: publishCounted
        params: ctx context.Context, batch []byte
        recv: f *Forwarder
        results: error
      - name: Stats
        recv: f *Forwarder
        results: StatsValue
      - name: Run
        params: ctx context.Context
        recv: f *Forwarder
        results: error
      - doc: makeRoom applies the full policy until size fits.
        name: makeRoom
        params: ctx context.Context, size int64
        recv: f *Forwarder
        results: error
      - doc: |-
          dropOldest takes the oldest receivable batches out of the queue until size
          fits, each counted Dropped; when none can be taken the new batch is
          refused instead.
        name: dropOldest
        params: ctx context.Context, size int64
        recv: f *Forwarder
        results: error
      - doc: block waits for room up to BlockTimeout on the clock, then refuses.
        name: block
        params: ctx context.Context, size int64
        recv: f *Forwarder
        results: error
      - doc: fits reports whether a batch of size fits under both bounds.
        name: fits
        params: size int64
        recv: f *Forwarder
        results: bool
      - doc: holds is fits with mu held.
        name: holds
        params: size int64
        recv: f *Forwarder
        results: bool
      - doc: full counts the new batch Dropped and refuses it with ForwardFull.
        name: full
        recv: f *Forwarder
        results: error
      - doc: |-
          hold counts the batch id of size, with mu held or before the forwarder is
          shared.
        name: hold
        params: id string, size int64
        recv: f *Forwarder
      - doc: |-
          release takes the counted batch id out of the counts, with mu held, and
          wakes a producer waiting for room.
        name: release
        params: id string
        recv: f *Forwarder
      - doc: |-
          settle records the batch id leaving the queue under counter — "" for one
          that never entered it. A batch the forwarder does not count may be one
          whose publication it has not counted yet: settle waits for that
          publication. One it still does not count is another process's, which
          takes nothing from the counts, and Run counts the queue again at once —
          once per Config.RecountInterval at most, so a stream of batches another
          instance queued does not list the queue once per batch.
        name: settle
        params: id string, counter *uint64
        recv: f *Forwarder
      - doc: |-
          leave takes the batch id, which left the queue, out of the counts, with mu
          held: nothing for "", which never entered it.
        name: leave
        params: id string
        recv: f *Forwarder
      - doc: |-
          forget records that the batch id was settled, with mu held: the broker
          forgets it once the consumer acknowledges it, after the settle, and a count
          that lists it before must not count it again.
        name: forget
        params: id string
        recv: f *Forwarder
      - doc: |-
          list reads every live message of the queue, queued or leased, by
          identifier.
        name: list
        params: ctx context.Context
        recv: f *Forwarder
        results: map[string]listedBatch, error
      - doc: |-
          recountLoop counts the queue each time it is asked, until ctx ends; a
          forwarder whose broker cannot list its messages is never asked.
        name: recountLoop
        params: ctx context.Context
        recv: f *Forwarder
      - doc: |-
          recountOnce lists the queue and makes the counts what it holds. A listing
          that fails leaves the counts as they were, until the next request.
        name: recountOnce
        params: ctx context.Context
        recv: f *Forwarder
      - doc: |-
          forgetGone forgets, with mu held, the settled batches the broker no longer
          holds as the consumer left them: gone from a listing that began after they
          were settled, or listed unleased — back in the queue.
        name: forgetGone
        params: listed map[string]listedBatch, generation uint64
        recv: f *Forwarder
      - doc: |-
          countListed counts, with mu held, every listed batch the forwarder does not
          count and did not settle.
        name: countListed
        params: listed map[string]listedBatch
        recv: f *Forwarder
      - doc: |-
          uncountGone stops counting, with mu held, every counted batch the listing
          does not hold but one Enqueue kept while the queue was listed.
        name: uncountGone
        params: listed map[string]listedBatch
        recv: f *Forwarder
      - doc: |-
          dueRecount asks Run to count the queue again once Config.RecountInterval
          has passed since the last count, with mu held.
        name: dueRecount
        recv: f *Forwarder
      - doc: |-
          askRecount asks Run to count the queue again, without ever blocking; a
          request already pending is the same request.
        name: askRecount
        recv: f *Forwarder
    name: Forwarder
  - doc: listedBatch is one live message as a count lists it.
    fields:
      - doc: size is its payload's length.
        name: size
        type: int64
      - doc: leased reports that a consumer holds it.
        name: leased
        type: bool
    kind: struct
    name: listedBatch
  - doc: |-
      spanExporter is the producer half for the trace signal: each batch
      encoded once, as the OTLP/HTTP exporter would post it, and kept.
    fields:
      - doc: forwarder keeps the encoded batches.
        name: forwarder
        type: "*Forwarder"
      - doc: name is the exporter's name.
        name: name
        type: coretrace.ExporterName
    kind: struct
    methods:
      - doc: Name implements core/observe/trace.SpanExporter.
        name: Name
        recv: e *spanExporter
        results: coretrace.ExporterName
      - doc: Export is ExportContext under a context that never ends.
        name: Export
        params: spans coretrace.SpansValue
        recv: e *spanExporter
        results: error
      - doc: ExportContext encodes spans and keeps them; an empty batch keeps nothing.
        name: ExportContext
        params: ctx context.Context, spans coretrace.SpansValue
        recv: e *spanExporter
        results: error
    name: spanExporter
  - doc: metricExporter is the producer half for the metrics signal.
    fields:
      - doc: forwarder keeps the encoded snapshots.
        name: forwarder
        type: "*Forwarder"
      - doc: name is the exporter's name.
        name: name
        type: coremetrics.ExporterName
    kind: struct
    methods:
      - doc: Name implements core/observe/metrics.Exporter.
        name: Name
        recv: e *metricExporter
        results: coremetrics.ExporterName
      - doc: Export is ExportContext under a context that never ends.
        name: Export
        params: snap coremetrics.SnapshotValue
        recv: e *metricExporter
        results: error
      - doc: ExportContext encodes snap and keeps it.
        name: ExportContext
        params: ctx context.Context, snap coremetrics.SnapshotValue
        recv: e *metricExporter
        results: error
    name: metricExporter
  - fields:
      - doc: |-
          LastRetryAfterAt is when a collector last imposed a delay; zero when
          none has.
        name: LastRetryAfterAt
        type: time.Time
      - doc: PendingBytes is the bytes of the batches the forwarder holds.
        name: PendingBytes
        type: int64
      - doc: |-
          LastRetryAfter is the last delay a collector imposed — a Retry-After
          — as the failure carried it.
        name: LastRetryAfter
        type: time.Duration
      - doc: |-
          Pending is the batches the forwarder holds: queued, waiting or being
          sent.
        name: Pending
        type: int
      - doc: Enqueued counts the batches Enqueue kept.
        name: Enqueued
        type: uint64
      - doc: Sent counts the batches the sender accepted.
        name: Sent
        type: uint64
      - doc: Retries counts the attempts made after a retryable failure.
        name: Retries
        type: uint64
      - doc: |-
          Dropped counts the batches lost to a bound: refused by a full queue or
          as too large, or taken out of it by DropOldest.
        name: Dropped
        type: uint64
      - doc: Expired counts the batches dropped because they outlived MaxAge.
        name: Expired
        type: uint64
      - doc: |-
          DeadLettered counts the batches the sender refused for good, kept in
          the broker's dead-letter store.
        name: DeadLettered
        type: uint64
    kind: struct
    name: StatsValue
