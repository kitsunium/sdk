apiVersion: design/behaviour/v1
sequences:
  - of: FullPolicy.String
    steps:
      - switch:
          cases:
            - case: DropOldest
              do:
                - return: dropOldestName
            - case: DropNewest
              do:
                - return: dropNewestName
            - case: Block
              do:
                - return: blockName
            - default: true
              do:
                - return: unknownName
          "on": p
  - of: (*Config).validate
    participants:
      - id: caller
        kind: actor
      - id: (*Config).validate
        kind: self
      - id: misconfigured
        kind: internal
      - id: c.validateBounds
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.Broker == nil
              do:
                - return: misconfigured("Broker", "missing")
                  to: misconfigured
            - case: c.Send == nil
              do:
                - return: misconfigured("Send", "missing")
                  to: misconfigured
            - case: c.Retryable == nil
              do:
                - return: misconfigured("Retryable", "missing")
                  to: misconfigured
            - case: c.WhenFull > Block
              do:
                - return: misconfigured("WhenFull", "unknown")
                  to: misconfigured
            - default: true
              do:
                - return: c.validateBounds()
                  to: c.validateBounds
  - of: (*Config).validateBounds
    participants:
      - id: caller
        kind: actor
      - id: (*Config).validateBounds
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - switch:
          cases:
            - case: c.MaxBatches < 0
              do:
                - return: misconfigured("MaxBatches", "negative")
                  to: misconfigured
            - case: c.MaxBytes < 0
              do:
                - return: misconfigured("MaxBytes", "negative")
                  to: misconfigured
            - case: c.BlockTimeout < 0
              do:
                - return: misconfigured("BlockTimeout", "negative")
                  to: misconfigured
            - case: c.SendTimeout < 0
              do:
                - return: misconfigured("SendTimeout", "negative")
                  to: misconfigured
            - case: c.MaxAge < 0
              do:
                - return: misconfigured("MaxAge", "negative")
                  to: misconfigured
            - case: c.RecountInterval < 0
              do:
                - return: misconfigured("RecountInterval", "negative")
                  to: misconfigured
            - default: true
              do:
                - return: nil
  - of: (*Config).normalized
    participants:
      - id: caller
        kind: actor
      - id: (*Config).normalized
        kind: self
      - id: orDefault
        kind: internal
    steps:
      - bind: "n"
        eval: "*c"
      - opt:
          do:
            - set: n.Clock
              value: clock.System
          when: n.Clock == nil
      - set: n.MaxBatches
        to: orDefault
        value: orDefault(n.MaxBatches, DefaultMaxBatches)
      - set: n.MaxBytes
        to: orDefault
        value: orDefault(n.MaxBytes, DefaultMaxBytes)
      - set: n.BlockTimeout
        to: orDefault
        value: orDefault(n.BlockTimeout, DefaultBlockTimeout)
      - set: n.SendTimeout
        to: orDefault
        value: orDefault(n.SendTimeout, DefaultSendTimeout)
      - set: n.MaxAge
        to: orDefault
        value: orDefault(n.MaxAge, DefaultMaxAge)
      - set: n.RecountInterval
        to: orDefault
        value: orDefault(n.RecountInterval, DefaultRecountInterval)
      - set: n.Parallelism
        value: max(n.Parallelism, 1)
      - opt:
          do:
            - set: n.Backoff.BaseDelay
              value: DefaultRetryBase
            - opt:
                do:
                  - set: n.Backoff.MaxDelay
                    value: DefaultRetryMax
                when: n.Backoff.MaxDelay <= 0
          when: n.Backoff.BaseDelay <= 0
      - return: "n"
  - of: orDefault
    steps:
      - opt:
          do:
            - return: fallback
          when: value == 0
      - return: value
  - of: misconfigured
    participants:
      - id: caller
        kind: actor
      - id: misconfigured
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(coreforward.ForwardMisconfigured, kerrs.WrapParams{},
          		kerrs.String("field", field), kerrs.String("problem", problem))
        to: kerrs
  - of: (*Forwarder).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).deliver
        kind: self
      - id: delivery.Message.EnqueuedAt.Add
        kind: value
      - id: f.settle
        kind: internal
      - id: f.retry(expiry).Run
        kind: value
      - id: corequeue
        kind: package
    steps:
      - bind: payload
        eval: delivery.Message.Payload
      - bind: id
        eval: delivery.Message.ID
      - bind: expiry
        eval: delivery.Message.EnqueuedAt.Add(f.cfg.MaxAge)
        to: delivery.Message.EnqueuedAt.Add
      - opt:
          do:
            - eval: f.settle(id, &f.stats.Expired)
              to: f.settle
            - return: nil
          when: "!f.cfg.Clock.Now().Before(expiry)"
      - bind: err
        eval: |-
          f.retry(expiry).Run(ctx, func(attemptCtx context.Context) error {
          		//: one attempt, bounded on the clock.
          		return f.attempt(attemptCtx, payload)
          	})
        to: f.retry(expiry).Run
      - switch:
          cases:
            - case: err == nil
              do:
                - eval: f.settle(id, &f.stats.Sent)
                  to: f.settle
                - return: nil
            - case: ctx.Err() != nil
              do:
                - return: err
            - case: "!f.cfg.Retryable(err)"
              do:
                - eval: f.settle(id, &f.stats.DeadLettered)
                  to: f.settle
                - return: corequeue.DoNotRetry(err)
                  to: corequeue
            - default: true
              do:
                - eval: f.settle(id, &f.stats.Expired)
                  to: f.settle
                - return: nil
  - of: (*Forwarder).retry
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).retry
        kind: self
      - id: svcres
        kind: package
    steps:
      - return: |-
          svcres.NewRetry(svcres.RetryConfig{
          		MaxAttempts: math.MaxInt,
          		Clock:       f.cfg.Clock,
          		Retryable: func(err error) bool {
          			//: retryable, and young enough to try again.
          			return f.cfg.Retryable(err) && f.cfg.Clock.Now().Before(expiry)
          		},
          		Delay: func(attempt int, err error) (time.Duration, bool) {
          			//: the imposed delay or the curve, never past the age.
          			return f.delay(attempt, err, expiry), true
          		},
          		OnRetry: func(int, error, time.Duration) {
          			f.mu.Lock()
          			f.stats.Retries++
          			f.mu.Unlock()
          		},
          	})
        to: svcres
  - of: (*Forwarder).delay
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).delay
        kind: self
      - id: svcres
        kind: package
      - id: f.mu.Lock
        kind: value
      - id: f.cfg.Clock.Now
        kind: value
      - id: f.mu.Unlock
        kind: value
    steps:
      - bind: left
        eval: max(expiry.Sub(f.cfg.Clock.Now()), 0)
      - opt:
          do:
            - eval: f.mu.Lock()
              to: f.mu.Lock
            - set: f.stats.LastRetryAfter
              value: imposed
            - set: f.stats.LastRetryAfterAt
              to: f.cfg.Clock.Now
              value: f.cfg.Clock.Now()
            - eval: f.mu.Unlock()
              to: f.mu.Unlock
            - return: min(imposed, left)
          init:
            bind: imposed, ok
            eval: svcres.RetryAfter(failed)
            to: svcres
          when: ok
      - return: min(f.cfg.Backoff.Delay(attempt), left)
  - of: (*Forwarder).attempt
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).attempt
        kind: self
      - id: context
        kind: stdlib
      - id: f.cfg.Clock.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: sendCtx, cancel
        eval: context.WithCancel(ctx)
        to: context
      - defer: cancel()
      - bind: timer
        eval: f.cfg.Clock.NewTimer(f.cfg.SendTimeout)
        to: f.cfg.Clock.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - bind: done
        eval: make(chan struct{})
      - defer: close(done)
      - go: |-
          func() {
          		//: the bound, or the attempt over first.
          		select {
          		//: the bound passed.
          		case <-timer.C():
          			cancel()
          		//: the attempt returned.
          		case <-done:
          		}
          	}()
      - return: f.cfg.Send(sendCtx, payload)
  - of: New
    participants:
      - id: caller
        kind: actor
      - id: New
        kind: self
      - id: cfg.validate
        kind: internal
      - id: cfg.normalized
        kind: internal
      - id: forwarder.list
        kind: internal
      - id: forwarder.hold
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: cfg.validate()
            to: cfg.validate
          when: err != nil
      - bind: "n"
        eval: cfg.normalized()
        to: cfg.normalized
      - bind: forwarder
        eval: |-
          &Forwarder{
          		cfg: n, room: make(chan struct{}, 1), recount: make(chan struct{}, 1),
          		held: make(map[string]int64), counted: n.Clock.Now(),
          	}
      - opt:
          do:
            - set: forwarder.reader, forwarder.leaving
              value: reader, make(map[string]uint64)
            - bind: listed, err
              eval: forwarder.list(ctx)
              to: forwarder.list
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - loop:
                do:
                  - eval: forwarder.hold(id, batch.size)
                    to: forwarder.hold
                key: id
                range: listed
                value: batch
          init:
            bind: reader, ok
            eval: cfg.Broker.(corequeue.MessageReader)
          when: ok
      - return: forwarder, nil
  - of: (*Forwarder).Enqueue
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).Enqueue
        kind: self
      - id: f.settle
        kind: internal
      - id: kerrs
        kind: package
      - id: f.makeRoom
        kind: internal
      - id: f.publishCounted
        kind: internal
    steps:
      - bind: size
        eval: int64(len(batch))
      - opt:
          do:
            - return: nil
          when: size == 0
      - opt:
          do:
            - eval: f.settle("", &f.stats.Dropped)
              to: f.settle
            - return: |-
                kerrs.Wrap(coreforward.BatchTooLarge, kerrs.WrapParams{},
                			kerrs.Int64("bytes", size), kerrs.Int64("max_bytes", f.cfg.MaxBytes))
              to: kerrs
          when: size > f.cfg.MaxBytes
      - lock:
          mutex: f.admit
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: f.makeRoom(ctx, size)
            to: f.makeRoom
          when: err != nil
      - return: f.publishCounted(ctx, batch)
        to: f.publishCounted
  - of: (*Forwarder).publishCounted
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).publishCounted
        kind: self
      - id: f.cfg.Broker.Publish
        kind: value
      - id: f.hold
        kind: internal
    steps:
      - lock:
          mutex: f.publish
      - bind: message, err
        eval: f.cfg.Broker.Publish(ctx, batch)
        to: f.cfg.Broker.Publish
      - opt:
          do:
            - return: err
          when: err != nil
      - lock:
          mutex: f.mu
      - op: ++
        set: f.stats.Enqueued
      - eval: f.hold(message.ID, int64(len(batch)))
        to: f.hold
      - opt:
          do:
            - set: f.recorded[message.ID]
              value: struct{}{}
          when: f.recorded != nil
      - return: nil
  - of: (*Forwarder).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).Stats
        kind: self
      - id: f.dueRecount
        kind: internal
    steps:
      - lock:
          mutex: f.mu
      - eval: f.dueRecount()
        to: f.dueRecount
      - return: f.stats
  - of: (*Forwarder).Run
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).Run
        kind: self
      - id: context
        kind: stdlib
      - id: svcqueue
        kind: package
    steps:
      - bind: counting, stop
        eval: context.WithCancel(ctx)
        to: context
      - defer: stop()
      - bind: done
        eval: make(chan struct{})
      - go: |-
          func() {
          		defer close(done)
          		f.recountLoop(counting)
          	}()
      - bind: err
        eval: |-
          svcqueue.Consume(ctx, f.cfg.Broker, svcqueue.ConsumerConfig{
          		Handler:       f.deliver,
          		Clock:         f.cfg.Clock,
          		PollInterval:  f.cfg.PollInterval,
          		Parallelism:   f.cfg.Parallelism,
          		BatchSize:     1,
          		SettleTimeout: f.cfg.SettleTimeout,
          		DrainTimeout:  f.cfg.DrainTimeout,
          		AutoExtend:    true,
          		// A batch sent again after a crash between the collector's
          		// acceptance and the acknowledgement is a duplicate span or point,
          		// which no forwarder can prevent — a delta metric point is then
          		// counted twice, as the package documentation says (ADR 0185 D6).
          		HandlerIsIdempotent: true,
          	})
        to: svcqueue
      - eval: stop()
      - eval: <-done
      - return: err
  - of: (*Forwarder).makeRoom
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).makeRoom
        kind: self
      - id: f.block
        kind: internal
      - id: f.full
        kind: internal
      - id: f.dropOldest
        kind: internal
    steps:
      - switch:
          cases:
            - case: Block
              do:
                - return: f.block(ctx, size)
                  to: f.block
            - case: DropNewest
              do:
                - opt:
                    do:
                      - return: nil
                    when: f.fits(size)
                - return: f.full()
                  to: f.full
            - default: true
              do:
                - return: f.dropOldest(ctx, size)
                  to: f.dropOldest
          "on": f.cfg.WhenFull
  - of: (*Forwarder).dropOldest
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).dropOldest
        kind: self
      - id: f.cfg.Broker.Receive
        kind: value
      - id: f.full
        kind: internal
      - id: f.cfg.Broker.Ack
        kind: value
      - id: f.settle
        kind: internal
    steps:
      - loop:
          cond: "!f.fits(size)"
          do:
            - bind: deliveries, err
              eval: f.cfg.Broker.Receive(ctx, 1)
              to: f.cfg.Broker.Receive
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - return: f.full()
                    to: f.full
                when: len(deliveries) == 0
            - bind: oldest
              eval: deliveries[0]
            - opt:
                do:
                  - return: ackErr
                init:
                  bind: ackErr
                  eval: f.cfg.Broker.Ack(ctx, oldest.Lease.Receipt)
                  to: f.cfg.Broker.Ack
                when: ackErr != nil
            - eval: f.settle(oldest.Message.ID, &f.stats.Dropped)
              to: f.settle
      - return: nil
  - of: (*Forwarder).block
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).block
        kind: self
      - id: f.cfg.Clock.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: f.full
        kind: internal
      - id: f.settle
        kind: internal
      - id: ctx.Err
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: f.fits(size)
      - bind: timer
        eval: f.cfg.Clock.NewTimer(f.cfg.BlockTimeout)
        to: f.cfg.Clock.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - loop:
          cond: "!f.fits(size)"
          do:
            - select:
                cases:
                  - comm: <-f.room
                  - comm: <-timer.C()
                    do:
                      - return: f.full()
                        to: f.full
                  - comm: <-ctx.Done()
                    do:
                      - eval: f.settle("", &f.stats.Dropped)
                        to: f.settle
                      - return: ctx.Err()
                        to: ctx.Err
      - return: nil
  - of: (*Forwarder).fits
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).fits
        kind: self
      - id: f.holds
        kind: internal
    steps:
      - lock:
          mutex: f.mu
      - return: f.holds(size)
        to: f.holds
  - of: (*Forwarder).holds
    steps:
      - return: f.stats.Pending < f.cfg.MaxBatches && f.stats.PendingBytes+size <= f.cfg.MaxBytes
  - of: (*Forwarder).full
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).full
        kind: self
      - id: f.settle
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - eval: f.settle("", &f.stats.Dropped)
        to: f.settle
      - return: |-
          kerrs.Wrap(coreforward.ForwardFull, kerrs.WrapParams{},
          		kerrs.String("policy", f.cfg.WhenFull.String()))
        to: kerrs
  - of: (*Forwarder).hold
    steps:
      - set: f.held[id]
        value: size
      - set: f.stats.Pending
        value: len(f.held)
      - op: +=
        set: f.stats.PendingBytes
        value: size
  - of: (*Forwarder).release
    steps:
      - op: "-="
        set: f.stats.PendingBytes
        value: f.held[id]
      - eval: delete(f.held, id)
      - set: f.stats.Pending
        value: len(f.held)
      - select:
          cases:
            - comm: f.room <- struct{}{}
            - default: true
  - of: (*Forwarder).settle
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).settle
        kind: self
      - id: f.mu.Lock
        kind: value
      - id: f.leave
        kind: internal
      - id: f.mu.Unlock
        kind: value
      - id: f.forget
        kind: internal
      - id: f.cfg.Clock.Now
        kind: value
      - id: f.askRecount
        kind: internal
      - id: f.dueRecount
        kind: internal
    steps:
      - eval: f.mu.Lock()
        to: f.mu.Lock
      - op: ++
        set: "*counter"
      - bind: _, held
        eval: f.held[id]
      - opt:
          do:
            - eval: f.leave(id)
              to: f.leave
            - eval: f.mu.Unlock()
              to: f.mu.Unlock
            - return: ""
          when: id == "" || held
      - eval: f.mu.Unlock()
        to: f.mu.Unlock
      - lock:
          mutex: f.publish
      - lock:
          mutex: f.mu
      - opt:
          do:
            - eval: f.leave(id)
              to: f.leave
            - return: ""
          init:
            bind: _, held
            eval: f.held[id]
            op: =
          when: held
      - eval: f.forget(id)
        to: f.forget
      - bind: now
        eval: f.cfg.Clock.Now()
        to: f.cfg.Clock.Now
      - opt:
          do:
            - set: f.prompted
              value: now
            - eval: f.askRecount()
              to: f.askRecount
            - return: ""
          when: now.Sub(f.prompted) >= f.cfg.RecountInterval
      - eval: f.dueRecount()
        to: f.dueRecount
  - of: (*Forwarder).leave
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).leave
        kind: self
      - id: f.release
        kind: internal
      - id: f.forget
        kind: internal
      - id: f.dueRecount
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: id == ""
      - eval: f.release(id)
        to: f.release
      - eval: f.forget(id)
        to: f.forget
      - eval: f.dueRecount()
        to: f.dueRecount
  - of: (*Forwarder).forget
    steps:
      - opt:
          do:
            - set: f.leaving[id]
              value: f.generation
          when: f.leaving != nil
  - of: (*Forwarder).list
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).list
        kind: self
      - id: f.reader.Messages
        kind: value
    steps:
      - bind: listed
        eval: make(map[string]listedBatch, countPage)
      - bind: after
        eval: "\"\""
      - loop:
          do:
            - bind: page, err
              eval: f.reader.Messages(ctx, after, countPage)
              to: f.reader.Messages
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - loop:
                do:
                  - set: listed[live.Message.ID]
                    value: "listedBatch{size: int64(len(live.Message.Payload)), leased: live.Leased}"
                  - set: after
                    value: live.Message.ID
                key: _
                range: page
                value: live
            - opt:
                do:
                  - return: listed, nil
                when: len(page) < countPage
          forever: true
  - of: (*Forwarder).recountLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).recountLoop
        kind: self
      - id: f.recountOnce
        kind: internal
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: ""
                  - comm: _, open := <-f.recount
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!open"
                      - eval: f.recountOnce(ctx)
                        to: f.recountOnce
          forever: true
  - of: (*Forwarder).recountOnce
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).recountOnce
        kind: self
      - id: f.mu.Lock
        kind: value
      - id: f.cfg.Clock.Now
        kind: value
      - id: f.mu.Unlock
        kind: value
      - id: f.list
        kind: internal
      - id: f.forgetGone
        kind: internal
      - id: f.countListed
        kind: internal
      - id: f.uncountGone
        kind: internal
    steps:
      - eval: f.mu.Lock()
        to: f.mu.Lock
      - set: f.counted
        to: f.cfg.Clock.Now
        value: f.cfg.Clock.Now()
      - op: ++
        set: f.generation
      - bind: generation
        eval: f.generation
      - set: f.recorded
        value: make(map[string]struct{})
      - eval: f.mu.Unlock()
        to: f.mu.Unlock
      - bind: listed, err
        eval: f.list(ctx)
        to: f.list
      - lock:
          mutex: f.publish
      - lock:
          mutex: f.mu
      - opt:
          do:
            - eval: f.forgetGone(listed, generation)
              to: f.forgetGone
            - eval: f.countListed(listed)
              to: f.countListed
            - eval: f.uncountGone(listed)
              to: f.uncountGone
          when: err == nil
      - set: f.recorded
        value: nil
  - of: (*Forwarder).countListed
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).countListed
        kind: self
      - id: f.hold
        kind: internal
    steps:
      - loop:
          do:
            - bind: _, held
              eval: f.held[id]
            - bind: _, settled
              eval: f.leaving[id]
            - opt:
                do:
                  - continue: true
                when: held || settled
            - eval: f.hold(id, batch.size)
              to: f.hold
          key: id
          range: listed
          value: batch
  - of: (*Forwarder).uncountGone
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).uncountGone
        kind: self
      - id: f.release
        kind: internal
    steps:
      - loop:
          do:
            - bind: _, present
              eval: listed[id]
            - bind: _, recorded
              eval: f.recorded[id]
            - opt:
                do:
                  - continue: true
                when: present || recorded
            - eval: f.release(id)
              to: f.release
          key: id
          range: f.held
  - of: (*Forwarder).dueRecount
    participants:
      - id: caller
        kind: actor
      - id: (*Forwarder).dueRecount
        kind: self
      - id: f.askRecount
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.askRecount()
              to: f.askRecount
          when: f.reader != nil && f.cfg.Clock.Now().Sub(f.counted) >= f.cfg.RecountInterval
  - of: (*Forwarder).askRecount
    steps:
      - opt:
          do:
            - return: ""
          when: f.reader == nil
      - select:
          cases:
            - comm: f.recount <- struct{}{}
            - default: true
  - of: NewSpanExporter
    steps:
      - opt:
          do:
            - return: nil, misconfigured("forwarder", "missing")
          when: forwarder == nil
      - return: "&spanExporter{forwarder: forwarder, name: name}, nil"
  - of: NewMetricExporter
    steps:
      - opt:
          do:
            - return: nil, misconfigured("forwarder", "missing")
          when: forwarder == nil
      - return: "&metricExporter{forwarder: forwarder, name: name}, nil"
  - of: (*spanExporter).Name
    steps:
      - return: e.name
  - of: (*spanExporter).Export
    participants:
      - id: caller
        kind: actor
      - id: (*spanExporter).Export
        kind: self
      - id: e.ExportContext
        kind: internal
    steps:
      - return: e.ExportContext(context.Background(), spans)
        to: e.ExportContext
  - of: (*spanExporter).ExportContext
    participants:
      - id: caller
        kind: actor
      - id: (*spanExporter).ExportContext
        kind: self
      - id: svctrace
        kind: package
      - id: e.forwarder.Enqueue
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: spans.IsEmpty()
      - bind: doc, err
        eval: svctrace.EncodeOTLPJSON(spans)
        to: svctrace
      - opt:
          do:
            - return: err
          when: err != nil
      - return: e.forwarder.Enqueue(ctx, doc)
        to: e.forwarder.Enqueue
  - of: (*metricExporter).Name
    steps:
      - return: e.name
  - of: (*metricExporter).Export
    participants:
      - id: caller
        kind: actor
      - id: (*metricExporter).Export
        kind: self
      - id: e.ExportContext
        kind: internal
    steps:
      - return: e.ExportContext(context.Background(), snap)
        to: e.ExportContext
  - of: (*metricExporter).ExportContext
    participants:
      - id: caller
        kind: actor
      - id: (*metricExporter).ExportContext
        kind: self
      - id: svcmetrics
        kind: package
      - id: e.forwarder.Enqueue
        kind: internal
    steps:
      - bind: doc, err
        eval: svcmetrics.EncodeOTLPJSON(snap)
        to: svcmetrics
      - opt:
          do:
            - return: err
          when: err != nil
      - return: e.forwarder.Enqueue(ctx, doc)
        to: e.forwarder.Enqueue
