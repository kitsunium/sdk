package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/id
  name: id
  purpose: Package id wraps stdlib crypto/rand + the kernel clock as core/app/id.Generator implementations (UUIDv4, UUIDv7, ULID, snowflake, NanoID, KSUID, TypeID).
types:
  - doc: |-
      ksuidGen prefixes a second-resolution timestamp then fills the remainder
      randomly. Stateless — the singleton is safe to share.
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: ksuidGen
        results: coreid.Scheme
      - doc: New builds the 20-byte time+random form and renders it base62.
        name: New
        recv: ksuidGen
        results: newID string, err error
    name: ksuidGen
  - doc: |-
      nanoIDGen mints size characters drawn uniformly from nanoIDAlphabet. It is
      stateless beyond its length, so the singleton is safe to share.
    fields:
      - name: size
        type: int
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: nanoIDGen
        results: coreid.Scheme
      - doc: New draws g.size characters uniformly from the URL-safe alphabet.
        name: New
        recv: g nanoIDGen
        results: newID string, err error
      - doc: |-
          length resolves the effective identifier length. The zero value of the struct
          means "no length was specified", which resolves to the canonical default —
          never to zero. NewNanoID still REFUSES an explicit 0 for the reason ADR 0031
          separates the two cases: an unset field is an absent opinion, while an
          argument passed to a constructor is an assertion the caller means it.
        name: length
        recv: g nanoIDGen
        results: int
    name: nanoIDGen
  - doc: |-
      snowflakeGen is a stateful Twitter-style snowflake generator: a 41-bit ms
      timestamp, a 10-bit node, and a 12-bit per-ms sequence, packed into a
      positive int64 rendered in decimal.
    fields:
      - name: mu
        type: sync.Mutex
      - name: clk
        type: clock.Clock
      - name: node
        type: int64
      - doc: |-
          derive says node is still to be derived from the hostname and pid, at
          the first id: the registered generator is built at the package's
          initialisation, which every program importing the domain pays at
          start, and reading the hostname is a file read on Linux.
        name: derive
        type: bool
      - name: lastMS
        type: int64
      - name: seq
        type: int64
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: "*snowflakeGen"
        results: coreid.Scheme
      - doc: |-
          New issues the next monotonic snowflake id. Within a millisecond the sequence
          increments; on overflow it spins to the next millisecond. A backwards clock
          jump returns ClockBackwards rather than minting a non-monotonic id.
        name: New
        recv: g *snowflakeGen
        results: newID string, err error
      - doc: |-
          tillNext spins until the clock advances past prev (same-ms sequence
          overflow), returning the new epoch-relative millisecond.

          The caller holds g.mu for the whole spin, so the wait MUST terminate in every
          direction the clock can misbehave:

            - moves FORWARD past prev — the normal exit.
            - regresses BELOW prev — unreachable by waiting (only the operator can fix
              it), so it returns ClockBackwards immediately.
            - STALLS at prev — indistinguishable from the normal sub-millisecond
              remainder for a short while, so it keeps spinning, but only up to
              maxTillNextSpins. Past that budget it returns ClockStalled rather than
              holding the mutex indefinitely.

          The bound is a spin count rather than a duration on purpose: the thing that
          may be broken here IS the clock, so a deadline derived from it could never
          fire.
        name: tillNext
        params: prev int64
        recv: g *snowflakeGen
        results: next int64, err error
    name: snowflakeGen
  - doc: |-
      typeIDGen stamps a fixed type prefix on a UUIDv7 rendered in lowercase
      Crockford base32 — "user_01h2xcejqtf2nbrexx3vqjhp41".

      Deliberately NOT registered under a Scheme. A TypeID without a prefix is not
      a degraded TypeID, it is a UUIDv7 with extra steps, and there is no
      non-arbitrary prefix the SDK could pick on the caller's behalf — so
      registering a "typeid" singleton would mean either inventing the caller's
      domain vocabulary or minting "_01h2…". Both are the silent degradation ADR
      0031 exists to forbid, so the scheme is reachable only through NewTypeID and
      core/app/id.New("typeid") correctly reports UNKNOWN_SCHEME.
    fields:
      - name: prefix
        type: string
    kind: struct
    methods:
      - doc: |-
          Scheme implements core/app/id.Generator. The key is reported for diagnostics and
          symmetry with the other schemes; it is not registered (see typeIDGen).
        name: Scheme
        recv: typeIDGen
        results: coreid.Scheme
      - doc: |-
          New mints a fresh UUIDv7 and renders it as prefix + "_" + 26 lowercase
          Crockford base32 characters.
        name: New
        recv: g typeIDGen
        results: newID string, err error
    name: typeIDGen
  - doc: ulidGen prefixes a millisecond timestamp then fills the remainder randomly.
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: ulidGen
        results: coreid.Scheme
      - doc: New builds the 16-byte time+random form and renders it Crockford base32.
        name: New
        recv: ulidGen
        results: newID string, err error
    name: ulidGen
  - doc: uuidv4Gen produces 122 random bits with the version/variant bits stamped.
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: uuidv4Gen
        results: coreid.Scheme
      - doc: New draws 16 secure random bytes and stamps the v4 version + variant bits.
        name: New
        recv: uuidv4Gen
        results: newID string, err error
    name: uuidv4Gen
  - doc: uuidv7Gen prefixes a millisecond timestamp then fills the remainder randomly.
    kind: struct
    methods:
      - doc: Scheme implements core/app/id.Generator.
        name: Scheme
        recv: uuidv7Gen
        results: coreid.Scheme
      - doc: |-
          New writes the 48-bit ms timestamp, fills the rest with randomness, and
          stamps the v7 version + variant bits.
        name: New
        recv: uuidv7Gen
        results: newID string, err error
    name: uuidv7Gen
vars:
  - doc: |-
      KSUID is the registered KSUID generator: a 32-bit second-resolution timestamp
      followed by 128 random bits, rendered as 27 base62 characters that sort by
      creation time as plain strings.
    grouped: true
    items:
      - doc: KSUID is the registered generator.
        name: KSUID
        value: coreid.Register(ksuidGen{})
      - doc: |-
          base62Reverse is the decode table; see buildBase62Reverse for why it is
          derived rather than written out.
        name: base62Reverse
        value: buildBase62Reverse()
    name: KSUID
  - doc: |-
      NanoID is the registered default-size NanoID generator: nanoIDDefaultSize
      URL-safe characters drawn uniformly from a CSPRNG. Use NewNanoID for an
      explicit length.
    items:
      - name: NanoID
        value: "coreid.Register(nanoIDGen{size: nanoIDDefaultSize})"
    name: NanoID
  - doc: |-
      Snowflake is the default-node snowflake generator, registered for the
      "snowflake" scheme. Its node id is derived from the hostname+pid so distinct
      processes rarely collide; use NewSnowflake for an explicit node assignment.
    items:
      - name: Snowflake
        value: coreid.Register(newDefaultSnowflake(clock.System))
    name: Snowflake
  - doc: |-
      ULID is the registered ULID generator: a 48-bit ms timestamp + 80 random bits
      rendered as 26 Crockford-base32 chars, lexically sortable by time.
    items:
      - name: ULID
        value: coreid.Register(ulidGen{})
    name: ULID
  - doc: UUIDv4 is the registered random UUIDv4 generator (RFC 9562 §5.4).
    items:
      - name: UUIDv4
        value: coreid.Register(uuidv4Gen{})
    name: UUIDv4
  - doc: |-
      UUIDv7 is the registered time-ordered UUIDv7 generator (RFC 9562 §5.7): a
      48-bit Unix-millisecond prefix makes successive ids k-sortable.
    items:
      - name: UUIDv7
        value: coreid.Register(uuidv7Gen{})
    name: UUIDv7
