# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: uuidRawLen is the 128-bit UUID byte length.
        name: uuidRawLen
        type: int
        value: "16"
      - doc: hexSeg1End is the end of the first hex segment (4 bytes → 8 hex chars).
        name: hexSeg1End
        type: int
        value: "8"
      - doc: hexSeg2End is the end of the second hex segment.
        name: hexSeg2End
        type: int
        value: "12"
      - doc: hexSeg3End is the end of the third hex segment.
        name: hexSeg3End
        type: int
        value: "16"
      - doc: hexSeg4End is the end of the fourth hex segment.
        name: hexSeg4End
        type: int
        value: "20"
      - doc: hexFull is the full hex length of a 16-byte UUID (32 chars).
        name: hexFull
        type: int
        value: "32"
      - doc: uuidVersionIdx is the byte carrying the version nibble (RFC 9562).
        name: uuidVersionIdx
        type: int
        value: "6"
      - doc: uuidVariantIdx is the byte carrying the variant bits (RFC 9562).
        name: uuidVariantIdx
        type: int
        value: "8"
      - doc: uuidVersionMask clears the high nibble of the version byte.
        name: uuidVersionMask
        type: byte
        value: "0x0F"
      - doc: uuidVariantMask clears the two high bits of the variant byte.
        name: uuidVariantMask
        type: byte
        value: "0x3F"
      - doc: uuidVariantBits sets the RFC 4122/9562 variant (10xx_xxxx).
        name: uuidVariantBits
        type: byte
        value: "0x80"
      - doc: uuidVersion4 is the version-4 nibble pre-shifted into the high nibble.
        name: uuidVersion4
        type: byte
        value: "0x40"
      - doc: uuidVersion7 is the version-7 nibble pre-shifted into the high nibble.
        name: uuidVersion7
        type: byte
        value: "0x70"
      - doc: tsBytes is the 48-bit millisecond-timestamp width shared by UUIDv7 + ULID.
        name: tsBytes
        type: int
        value: "6"
      - doc: bitsPerByte is the obvious 8, named to satisfy the no-magic-number rule.
        name: bitsPerByte
        type: int
        value: "8"
      - doc: |-
          crockfordChars is the number of base32 characters that cover a 128-bit
          value. Shared by ULID and TypeID: both encode exactly 16 bytes this way,
          they differ only in the case of the symbols.
        name: crockfordChars
        type: int
        value: "26"
      - doc: bitsPerChar is the base32 group width (5 bits per Crockford char).
        name: bitsPerChar
        type: int
        value: "5"
      - doc: "crockfordPadBits is the zero pad at the MSB: 26*5 - 16*8 = 130-128 = 2."
        name: crockfordPadBits
        type: int
        value: crockfordChars*bitsPerChar - uuidRawLen*bitsPerByte
      - doc: |-
          crockfordFirstCharLimit is the EXCLUSIVE upper bound on the first
          character's 5-bit value. crockfordPadBits of that group are pad bits the
          encoder always writes as zero, so only bitsPerChar-crockfordPadBits real
          bits are addressable there. A decoder that skips this check silently
          accepts 130-bit strings and truncates them, which breaks the round trip.
        name: crockfordFirstCharLimit
        type: int
        value: 1 << (bitsPerChar - crockfordPadBits)
      - doc: dashedUUIDLen is the canonical dashed-hex UUID length (8-4-4-4-12).
        name: dashedUUIDLen
        type: int
        value: "36"
      - doc: dashWidth is the width of one separator in the dashed form.
        name: dashWidth
        type: int
        value: "1"
      - doc: |-
          uuidDash1 is the first separator offset (8). Each of the four is a hex
          segment end shifted right by the dashes already emitted before it, so the
          parser's grouping cannot drift from formatUUID's.
        name: uuidDash1
        type: int
        value: hexSeg1End
      - doc: uuidDash2 is the second separator offset (13) — one dash precedes it.
        name: uuidDash2
        type: int
        value: hexSeg2End + dashWidth
      - doc: uuidDash3 is the third separator offset (18) — two dashes precede it.
        name: uuidDash3
        type: int
        value: hexSeg3End + dashWidth + dashWidth
      - doc: uuidDash4 is the fourth separator offset (23) — three dashes precede it.
        name: uuidDash4
        type: int
        value: hexSeg4End + dashWidth + dashWidth + dashWidth
    name: uuidRawLen
  - grouped: true
    items:
      - doc: |-
          ksuidEpoch is the KSUID epoch in Unix seconds (2014-05-13T16:53:20Z). The
          format shifts its origin forward so the 32-bit counter buys ~136 years
          from a useful date instead of burning 44 of them on 1970..2014.
        name: ksuidEpoch
        type: int64
        value: "1_400_000_000"
      - doc: ksuidTimeBytes is the width of the second-resolution timestamp prefix.
        name: ksuidTimeBytes
        type: int
        value: "4"
      - doc: ksuidPayloadBytes is the width of the random payload.
        name: ksuidPayloadBytes
        type: int
        value: "16"
      - doc: "ksuidRawLen is the decoded width: 4 + 16 = 20 bytes (160 bits)."
        name: ksuidRawLen
        type: int
        value: ksuidTimeBytes + ksuidPayloadBytes
      - doc: |-
          ksuidChars is the canonical rendering length: a 160-bit value needs
          ceil(160 / log2(62)) = 27 base62 characters.
        name: ksuidChars
        type: int
        value: "27"
      - doc: |-
          base62Alphabet is the KSUID symbol set. The order is deliberate: it is
          ascending ASCII, so a fixed-width base62 rendering sorts lexicographically
          exactly as the underlying integer does — which is what makes a KSUID
          string sortable by creation time.
        name: base62Alphabet
        type: string
        value: "\"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\""
      - doc: |-
          base62ReverseLen is the width of the decode table: one entry per possible
          byte value, so a lookup is an index and never a bounds decision.
        name: base62ReverseLen
        type: int
        value: "256"
      - doc: base62Radix is the length of base62Alphabet, named for the arithmetic.
        name: base62Radix
        type: int
        value: "62"
      - doc: ksuidWordBytes is the width of one word of base62Encode's division.
        name: ksuidWordBytes
        type: int
        value: "4"
      - doc: "ksuidWords is the raw value's width in 32-bit words: 20 / 4 = 5."
        name: ksuidWords
        type: int
        value: ksuidRawLen / ksuidWordBytes
      - doc: bitsPerWord is the width of one division word, in bits.
        name: bitsPerWord
        type: int
        value: ksuidWordBytes * bitsPerByte
      - doc: base62DigitsPerRound is how many base-62 digits one division yields.
        name: base62DigitsPerRound
        type: int
        value: "5"
      - doc: |-
          base62Pow5 is 62^5 = 916 132 832, the largest power of 62 below 2^32:
          the divisor of one round, whose remainder is five digits.
        name: base62Pow5
        type: uint64
        value: 62 * 62 * 62 * 62 * 62
    name: ksuidEpoch
  - grouped: true
    items:
      - doc: |-
          nanoIDAlphabet is the canonical NanoID symbol set: 64 URL-safe characters
          (A-Z, a-z, 0-9, '_' and '-'). Every symbol survives a URL path, a query
          string, a shell word and a filename unescaped, which is the whole reason
          the format exists.
        name: nanoIDAlphabet
        type: string
        value: "\"_-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\""
      - doc: |-
          nanoIDDefaultSize is the canonical NanoID length. 21 characters over a
          64-symbol alphabet carry 126 bits, slightly MORE than a UUIDv4's 122, in
          21 characters instead of 36. It is the format's published default, not a
          number invented here — which is what makes it a legitimate zero-value
          default rather than a guess at the caller's intent (ADR 0031).
        name: nanoIDDefaultSize
        type: int
        value: "21"
    name: nanoIDAlphabet
  - grouped: true
    items:
      - doc: |-
          snowflakeEpoch is the custom epoch (2024-01-01T00:00:00Z in ms) the 41-bit
          timestamp counts from, extending the usable range past the Unix epoch.
        name: snowflakeEpoch
        type: int64
        value: "1_704_067_200_000"
      - doc: nodeBits is the width of the node field (10 bits → 1024 nodes).
        name: nodeBits
        type: uint
        value: "10"
      - doc: seqBits is the width of the per-millisecond sequence field (12 bits).
        name: seqBits
        type: uint
        value: "12"
      - doc: maxNode is the inclusive maximum node id.
        name: maxNode
        type: int64
        value: (1 << nodeBits) - 1
      - doc: maxSeq is the inclusive maximum per-millisecond sequence.
        name: maxSeq
        type: int64
        value: (1 << seqBits) - 1
      - doc: timeShift positions the timestamp field above node + sequence.
        name: timeShift
        type: uint
        value: nodeBits + seqBits
      - doc: nodeShift positions the node field above the sequence.
        name: nodeShift
        type: uint
        value: seqBits
      - doc: decimalBase renders the 63-bit id as a base-10 string.
        name: decimalBase
        type: int
        value: "10"
      - doc: fnvOffset is the FNV-1a 64-bit offset basis.
        name: fnvOffset
        type: uint64
        value: "14695981039346656037"
      - doc: fnvPrime is the FNV-1a 64-bit prime.
        name: fnvPrime
        type: uint64
        value: "1099511628211"
      - doc: |-
          maxTillNextSpins bounds the same-millisecond overflow wait. The wait runs
          under the generator's mutex, so it MUST terminate: a clock that stops
          advancing (suspended VM, broken clocksource, a fake pinned in a test)
          would otherwise stall every concurrent New forever. A healthy clock
          crosses a millisecond boundary in well under 10^5 reads, so this budget
          is ~an order of magnitude of headroom, not a tuning knob.
        name: maxTillNextSpins
        type: int
        value: 1 << 20
      - doc: |-
          goschedEvery yields the P periodically during the spin so a single-
          threaded runtime is not starved while we wait.
        name: goschedEvery
        type: int
        value: 1 << 10
    name: snowflakeEpoch
  - grouped: true
    items:
      - doc: |-
          typeIDAlphabet is Crockford base32 in LOWER case. TypeID renders lower
          case where ULID renders upper; the 32 symbols and the bit packing are the
          same, which is why both go through crockford32Encode.
        name: typeIDAlphabet
        type: string
        value: "\"0123456789abcdefghjkmnpqrstvwxyz\""
      - doc: typeIDSeparator joins the type prefix to the base32 suffix.
        name: typeIDSeparator
        type: string
        value: "\"_\""
      - doc: |-
          typeIDMaxPrefix is the inclusive maximum prefix length. The bound exists
          so a type name cannot dwarf the identifier it labels — an id whose prefix
          is longer than its 26-character payload has stopped being an identifier.
        name: typeIDMaxPrefix
        type: int
        value: "63"
      - doc: |-
          typeIDMinLen is the shortest input ParseTypeID can even look at: the
          separator plus the fixed-width suffix. It guards the slice arithmetic
          ONLY — the prefix it leaves empty is then judged by validateTypePrefix,
          so "_01h2…" is refused as an invalid PREFIX rather than as a short
          string. Raising this bound to include the prefix would make the length
          check answer a question the prefix rule answers better.
        name: typeIDMinLen
        type: int
        value: len(typeIDSeparator) + crockfordChars
    name: typeIDAlphabet
  - doc: |-
      ulidAlphabet is Crockford base32 (excludes I, L, O, U) in the UPPER case ULID
      renders with — TypeID uses the same 32 symbols in lower case. The rendering
      length is crockfordChars: a ULID is exactly the 128-bit Crockford packing
      TypeID also uses, which is why both go through crockford32Encode.
    items:
      - name: ulidAlphabet
        type: string
        value: "\"0123456789ABCDEFGHJKMNPQRSTVWXYZ\""
    name: ulidAlphabet
