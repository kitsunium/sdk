functions:
  - doc: |-
      formatUUID renders the 16-byte raw form b as the canonical 36-char dashed hex
      (8-4-4-4-12). b MUST be uuidRawLen bytes.
    name: formatUUID
    params: b []byte
    results: string
  - doc: |-
      setUUIDBits stamps the version nibble (high nibble of byte 6) and the RFC
      variant bits (high bits of byte 8) into the raw form. versionHighNibble is
      the 4-bit UUID version pre-shifted into the high nibble by the caller.
    name: setUUIDBits
    params: b []byte, versionHighNibble byte
  - doc: |-
      putUint48BE writes the low 48 bits of v into dst[0:tsBytes] big-endian. dst
      MUST have at least tsBytes bytes. Shared by UUIDv7 and ULID.
    name: putUint48BE
    params: dst []byte, v int64
  - doc: |-
      crockford32Encode renders the uuidRawLen-byte big-endian value b as
      crockfordChars base32 characters, MSB-first, with crockfordPadBits zero pad
      bits at the top. alphabet MUST hold 32 symbols indexed by their 5-bit value.

      ULID passes the uppercase Crockford set and TypeID the lowercase one: the bit
      packing is byte-for-byte identical, only the symbols differ, so keeping a
      single encoder is what stops the two schemes drifting apart.
    name: crockford32Encode
    params: b []byte, alphabet string
    results: string
  - doc: |-
      crockford32Decode reverses crockford32Encode over the same alphabet,
      returning the uuidRawLen raw bytes s encodes. It rejects a wrong length, a
      symbol outside alphabet, and a first character whose pad bits are set —
      without that last check the decoder would silently drop the two high bits and
      stop being the inverse of the encoder.
    name: crockford32Decode
    params: s, alphabet string
    results: raw [uuidRawLen]byte, err error
  - doc: |-
      parseUUID decodes the canonical dashed-hex form (8-4-4-4-12) back to its
      uuidRawLen raw bytes. It is the inverse of formatUUID and the entry point for
      re-labelling an EXISTING identifier, so it validates shape only — the version
      nibble is deliberately not enforced (see FormatTypeID).
    name: parseUUID
    params: s string
    results: raw [uuidRawLen]byte, err error
  - doc: |-
      isUUIDDashIndex reports whether i is one of the four separator offsets in the
      canonical dashed form.
    name: isUUIDDashIndex
    params: i int
    results: bool
  - name: ParseKSUID
    params: s string
    results: issued time.Time, payload [ksuidPayloadBytes]byte, err error
  - doc: |-
      base62Encode renders the ksuidRawLen-byte big-endian value b as exactly
      ksuidChars base62 characters, left-padded with the zero symbol.

      The padding is not cosmetic: a variable-width rendering would sort "9" after
      "10", so every KSUID is rendered to the same width and the string order then
      matches the numeric order.
    name: base62Encode
    params: b []byte
    results: string
  - doc: |-
      base62Decode reverses base62Encode, returning the ksuidRawLen raw bytes s
      encodes. It rejects a wrong length, a symbol outside the alphabet, and a
      value too large for 160 bits.

      That last rejection is load-bearing: 62^27 is about 2^160.7, so roughly a
      third of the well-formed-looking 27-character strings encode a number no
      KSUID can hold. Truncating them would make distinct strings decode to the
      same identifier.
    name: base62Decode
    params: s string
    results: raw [ksuidRawLen]byte, err error
  - doc: buildBase62Reverse derives the decode table from base62Alphabet.
    name: buildBase62Reverse
    results: "[base62ReverseLen]int8"
  - name: NewNanoID
    params: size int
    results: g coreid.Generator, err error
  - doc: |-
      randomFromAlphabet fills dst with characters drawn uniformly at random from
      alphabet, which MUST hold between 1 and 256 symbols.

      The obvious `alphabet[b%len(alphabet)]` is the defect every reimplementation
      ships. Unless the alphabet size divides the byte range exactly, the possible
      byte values do not spread evenly over the symbols: the ones at the start of
      the alphabet are reachable one extra way, so they appear more often in EVERY
      identifier the generator will ever mint. Nothing observable breaks — the ids
      still look random, still never repeat, still pass a uniqueness test — the
      distribution is simply skewed and the effective entropy is below what the
      length claims.

      So instead: mask each random byte down to the smallest 2^k-1 that spans the
      alphabet, and REJECT any masked value landing past the last symbol, redrawing
      for that position. Every accepted value is then equiprobable by construction,
      for any alphabet size.

      With the shipped 64-symbol alphabet the mask is exactly 6 bits, so no draw is
      ever rejected and the loop makes a single pass. The rejection is not dead
      weight for that: it is what keeps the function correct if the alphabet ever
      changes, and Test_randomFromAlphabet drives it with non-power-of-two
      alphabets precisely so the branch is exercised rather than assumed.
    name: randomFromAlphabet
    params: dst []byte, alphabet string
  - doc: |-
      pow2MaskFor returns the smallest 2^k-1 able to address n symbols, i.e. the
      mask keeping just enough low bits of a random byte to index the alphabet.
    name: pow2MaskFor
    params: n int
    results: int
  - name: NewSnowflake
    params: node int64
    results: coreid.Generator
  - doc: |-
      newDefaultSnowflake is the default-node generator, its node derived from
      the hostname and pid at its first id rather than now.
    name: newDefaultSnowflake
    params: clk clock.Clock
    results: "*snowflakeGen"
  - doc: newSnowflake is the shared constructor (clock injectable for tests).
    name: newSnowflake
    params: node int64, clk clock.Clock
    results: "*snowflakeGen"
  - doc: |-
      defaultNode derives a stable 10-bit node id from the hostname and pid via an
      inline FNV-1a (avoids the hash.Hash error channel).
    name: defaultNode
    results: int64
  - name: NewTypeID
    params: prefix string
    results: g coreid.Generator, err error
  - name: FormatTypeID
    params: prefix, uuid string
    results: typeID string, err error
  - name: ParseTypeID
    params: s string
    results: prefix, uuid string, err error
  - doc: |-
      validateTypePrefix enforces the TypeID prefix shape: 1..typeIDMaxPrefix
      characters of lowercase ASCII, with '_' allowed only BETWEEN two letters.

      Strictness is the point. A prefix is compared, logged and routed on; allowing
      case or punctuation variation would let "User", "user " and "user" name the
      same entity in three ways, which is the confusion the scheme exists to
      remove. The returned error names the clause that failed and never echoes the
      prefix, so it is safe to log wherever the other sentinels are.
    name: validateTypePrefix
    params: prefix string
    results: error
  - doc: |-
      legalPrefixByte reports whether c is legal at offset i of a prefix of length
      total: lowercase ASCII anywhere, and '_' anywhere but the first or the last
      byte. That is the specification's ^([a-z]([a-z_]{0,61}[a-z])?)?$ exactly, so
      consecutive interior underscores ("user__account") are legal and a check
      that also required letters on both sides would refuse spec-valid prefixes.
    name: legalPrefixByte
    params: c byte, i, total int
    results: bool
  - doc: |-
      crockford32 renders the 16-byte big-endian value b as crockfordChars uppercase
      Crockford base32 characters. The bit packing lives in crockford32Encode,
      shared with TypeID.
    name: crockford32
    params: b []byte
    results: string
