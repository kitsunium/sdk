      - id: os
        kind: stdlib
    steps:
      - bind: held, heldErr
        eval: file.Stat()
        to: file.Stat
      - opt:
          do:
            - return: true, ""
          when: heldErr != nil
      - bind: named, namedErr
        eval: os.Lstat(path)
        to: os
      - opt:
          do:
            - return: false, observedUnlinked
          when: namedErr != nil && os.IsNotExist(namedErr)
      - opt:
          do:
            - return: true, ""
          when: namedErr != nil
      - opt:
          do:
            - return: false, observedReplaced
          when: "!os.SameFile(held, named)"
      - return: true, ""
  - of: fileReplaced
    participants:
      - id: caller
        kind: actor
      - id: fileReplaced
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corelock.LockFileReplaced, kerrs.WrapParams{},
          		kerrs.String("op", op),
          		kerrs.String("path", path),
          		kerrs.String("lock", name),
          		kerrs.Int64("fence", int64(fence)),
          		kerrs.String("observed", observed))
        to: kerrs
  - of: KeepaliveConfig.validate
    participants:
      - id: caller
        kind: actor
      - id: KeepaliveConfig.validate
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corelock.LockMisconfigured, kerrs.WrapParams{},
                			kerrs.String("option", "Every"),
                			kerrs.String("value", c.Every.String()))
              to: kerrs
          when: c.Every <= 0
      - return: nil
  - of: KeepaliveConfig.clockOrSystem
    steps:
      - opt:
          do:
            - return: clock.System
          when: c.Clock == nil
      - return: c.Clock
  - of: Keepalive
    participants:
      - id: caller
        kind: actor
      - id: Keepalive
        kind: self
      - id: cfg.validate
        kind: internal
      - id: context
        kind: stdlib
      - id: cfg.clockOrSystem().NewTicker
        kind: value
      - id: renewUntilLost
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil, invalid
          init:
            bind: invalid
            eval: cfg.validate()
            to: cfg.validate
          when: invalid != nil
      - opt:
          do:
            - return: |-
                nil, nil, kerrs.Wrap(corelock.LockNotHeld, kerrs.WrapParams{},
                			kerrs.String("operation", "Keepalive"),
                			kerrs.String("lock", ""))
          when: lease == nil
      - bind: derived, cancel
        eval: context.WithCancelCause(ctx)
        to: context
      - bind: ticker
        eval: cfg.clockOrSystem().NewTicker(cfg.Every)
        to: cfg.clockOrSystem().NewTicker
      - go: renewUntilLost(derived, cancel, ticker, lease)
        to: renewUntilLost
      - set: stop
        value:
          closure:
            steps:
              - eval: cancel(context.Canceled)
      - return: derived, stop, nil
  - of: renewUntilLost
    participants:
      - id: caller
        kind: actor
      - id: renewUntilLost
        kind: self
      - id: ticker.Stop
        kind: value
      - id: lease.Extend
        kind: value
    steps:
      - defer: ticker.Stop()
        to: ticker.Stop
      - loop:
          do:
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: ""
                  - comm: _, open := <-ticker.C()
                    do:
                      - opt:
                          do:
                            - return: ""
                          when: "!open"
                      - opt:
                          do:
                            - eval: cancel(keepaliveLost(err, lease.Fence()))
                            - return: ""
                          init:
                            bind: err
                            eval: lease.Extend(ctx)
                            to: lease.Extend
                          when: err != nil
          forever: true
  - of: keepaliveLost
    participants:
      - id: caller
        kind: actor
      - id: keepaliveLost
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:    corelock.CodeLockKeepaliveLost,
          		Reason:  "LOCK_KEEPALIVE_LOST",
          		Public:  "The lease could not be renewed and is no longer held",
          		Private: "service/app/lock: a background Extend failed, so the derived context was cancelled with this cause; the fields name the fencing token that was lost",
          	}, kerrs.Int64("fence", int64(fence)))
        to: kerrs
  - of: NewMemory
    participants:
      - id: caller
        kind: actor
      - id: NewMemory
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: cfg.validate()
            to: cfg.validate
          when: invalid != nil
      - return: |-
          &memoryLocker{
          		ttl:    cfg.TTL,
          		clk:    cfg.clockOrSystem(),
          		held:   make(map[string]*holding, initialNames),
          		fences: make(map[string]uint64, initialNames),
          	}, nil
  - of: (*memoryLocker).Acquire
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).Acquire
        kind: self
      - id: checkName
        kind: internal
      - id: l.attempt
        kind: internal
      - id: l.await
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, rejected
          init:
            bind: rejected
            eval: checkName(name)
            to: checkName
          when: rejected != nil
      - loop:
          do:
            - opt:
                do:
                  - return: nil, ctx.Err()
                when: ctx.Err() != nil
            - bind: taken, free, until
              eval: l.attempt(name)
              to: l.attempt
            - opt:
                do:
                  - return: taken, nil
                when: taken != nil
            - opt:
                do:
                  - return: nil, waitErr
                init:
                  bind: waitErr
                  eval: l.await(ctx, free, until)
                  to: l.await
                when: waitErr != nil
          forever: true
  - of: (*memoryLocker).TryAcquire
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).TryAcquire
        kind: self
      - id: checkName
        kind: internal
      - id: l.attempt
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, false, rejected
          init:
            bind: rejected
            eval: checkName(name)
            to: checkName
          when: rejected != nil
      - opt:
          do:
            - return: nil, false, ctx.Err()
          when: ctx.Err() != nil
      - bind: taken, _, _
        eval: l.attempt(name)
        to: l.attempt
      - return: taken, taken != nil, nil
  - of: (*memoryLocker).attempt
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).attempt
        kind: self
      - id: l.clk.Now
        kind: value
      - id: current.end
        kind: internal
      - id: newMemoryLease
        kind: internal
    steps:
      - lock:
          mutex: l.mu
      - bind: now
        eval: l.clk.Now()
        to: l.clk.Now
      - bind: current, busy
        eval: l.held[name]
      - opt:
          do:
            - return: nil, current.free, current.deadline
          when: busy && now.Before(current.deadline)
      - opt:
          do:
            - eval: current.end()
              to: current.end
          when: busy
      - op: ++
        set: l.fences[name]
      - op: ++
        set: l.nextToken
      - bind: next
        eval: |-
          &holding{
          		token:    l.nextToken,
          		fence:    l.fences[name],
          		deadline: now.Add(l.ttl),
          		free:     make(chan struct{}),
          	}
      - set: l.held[name]
        value: next
      - return: newMemoryLease(l, name, next), nil, time.Time{}
        to: newMemoryLease
  - of: (*memoryLocker).await
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).await
        kind: self
      - id: l.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: ctx.Err
        kind: value
    steps:
      - bind: timer
        eval: l.clk.NewTimer(until.Sub(l.clk.Now()))
        to: l.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
            - comm: <-free
              do:
                - return: nil
            - comm: <-timer.C()
              do:
                - return: nil
  - of: (*memoryLocker).release
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).release
        kind: self
      - id: notHeld
        kind: internal
      - id: current.end
        kind: internal
    steps:
      - lock:
          mutex: l.mu
      - bind: current, busy
        eval: l.held[name]
      - opt:
          do:
            - return: notHeld("Release", name, token)
              to: notHeld
          when: "!busy || current.token != token"
      - eval: delete(l.held, name)
      - eval: current.end()
        to: current.end
      - opt:
          do:
            - return: notHeld("Release", name, token)
              to: notHeld
          when: "!l.clk.Now().Before(current.deadline)"
      - return: nil
  - of: (*memoryLocker).extend
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLocker).extend
        kind: self
      - id: l.clk.Now
        kind: value
      - id: now.Add
        kind: value
    steps:
      - lock:
          mutex: l.mu
      - bind: current, busy
        eval: l.held[name]
      - opt:
          do:
            - return: time.Time{}, notHeld("Extend", name, token)
          when: "!busy || current.token != token"
      - bind: now
        eval: l.clk.Now()
        to: l.clk.Now
      - opt:
          do:
            - return: time.Time{}, notHeld("Extend", name, token)
          when: "!now.Before(current.deadline)"
      - set: current.deadline
        to: now.Add
        value: now.Add(l.ttl)
      - return: current.deadline, nil
  - of: notHeld
    participants:
      - id: caller
        kind: actor
      - id: notHeld
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corelock.LockNotHeld, kerrs.WrapParams{},
          		kerrs.String("operation", op),
          		kerrs.String("lock", name),
          		kerrs.Int64("holder", int64(token)))
        to: kerrs
  - of: checkName
    participants:
      - id: caller
        kind: actor
      - id: checkName
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corelock.LockNameRejected, kerrs.WrapParams{},
                			kerrs.String("reason", "empty"))
              to: kerrs
          when: name == ""
      - return: nil
  - of: newMemoryLease
    steps:
      - return: |-
          &memoryLease{
          		locker:   locker,
          		name:     name,
          		token:    held.token,
          		fence:    held.fence,
          		deadline: held.deadline,
          	}
  - of: (*memoryLease).Fence
    steps:
      - return: l.fence
  - of: (*memoryLease).Deadline
    steps:
      - lock:
          mutex: l.mu
          read: true
      - return: l.deadline
  - of: (*memoryLease).Extend
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLease).Extend
        kind: self
      - id: ctx.Err
        kind: value
      - id: notHeld
        kind: internal
      - id: l.locker.extend
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: notHeld("Extend", l.name, l.token)
              to: notHeld
          when: l.released
      - bind: deadline, err
        eval: l.locker.extend(l.name, l.token)
        to: l.locker.extend
      - opt:
          do:
            - return: err
          when: err != nil
      - set: l.deadline
        value: deadline
      - return: nil
  - of: (*memoryLease).Release
    participants:
      - id: caller
        kind: actor
      - id: (*memoryLease).Release
        kind: self
      - id: l.locker.release
        kind: internal
    steps:
      - lock:
          mutex: l.mu
      - opt:
          do:
            - return: nil
          when: l.released
      - set: l.released
        value: "true"
      - return: l.locker.release(l.name, l.token)
        to: l.locker.release
  - of: pathRedirected
    participants:
      - id: caller
        kind: actor
      - id: pathRedirected
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corelock.LockPathRedirected, kerrs.WrapParams{},
          		kerrs.String("path", path),
          		kerrs.String("kind", kind),
          		kerrs.String("observed", observed))
        to: kerrs
  - of: openLockFile
    participants:
      - id: caller
        kind: actor
      - id: openLockFile
        kind: self
      - id: os
        kind: stdlib
    steps:
      - bind: opened, openErr
        eval: os.OpenFile(path, os.O_CREATE|os.O_RDWR|syscall.O_NOFOLLOW, lockFileMode)
        to: os
      - opt:
          do:
            - return: nil, classifyOpenFailure(path, openErr)
          when: openErr != nil
      - return: opened, nil
  - of: classifyOpenFailure
    participants:
      - id: caller
        kind: actor
      - id: classifyOpenFailure
        kind: self
      - id: os
        kind: stdlib
      - id: pathRedirected
        kind: internal
      - id: backendFailed
        kind: internal
    steps:
      - bind: info, statErr
        eval: os.Lstat(path)
        to: os
      - opt:
          do:
            - return: pathRedirected(path, kindSymlink, openErr.Error())
              to: pathRedirected
          when: statErr == nil && info.Mode()&os.ModeSymlink != 0
      - return: backendFailed("open", path, openErr)
        to: backendFailed
