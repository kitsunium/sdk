# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      platformNative reports that this GOOS has both halves the file locker rests
      on: the kernel's file lock and an open that refuses an indirection planted
      at the lock path. NewFileLocker reads it and refuses at CONSTRUCTION where it
      is false, so the refusal arrives where the program is wired rather than at
      the first contended section — and no locker is ever built that would report
      success while excluding nothing.
    items:
      - name: platformNative
        type: bool
        value: flock.Native && hardenedOpen
    name: platformNative
  - doc: |-
      kindIndirection names what was found at a parent component.

      It is deliberately NOT the platform spelling [openLockFile] uses. A parent
      component is judged through fs.FileMode, which maps a Unix symbolic link, a
      Windows symbolic link and a Windows directory junction onto the same bit —
      so naming one of the three would be a guess, and the `target` field says
      where it actually goes, which is the thing an operator needs.
    items:
      - name: kindIndirection
        type: string
        value: "\"indirection\""
    name: kindIndirection
  - doc: |-
      worldWritable is the permission bit that makes a directory's entries
      replaceable by any account.
    items:
      - name: worldWritable
        type: fs.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      fenceBase is the radix the ledger is written in. Decimal is chosen over a
      fixed-width binary encoding so the file is readable with cat during an
      incident, which is when someone actually looks at it.
    items:
      - name: fenceBase
        type: int
        value: "10"
    name: fenceBase
  - doc: fenceBits is the width strconv parses and formats the counter at.
    items:
      - name: fenceBits
        type: int
        value: "64"
    name: fenceBits
  - doc: |-
      maxFenceBytes caps how much of the lock file is read before deciding it is
      not a counter. A decimal uint64 is at most 20 digits; anything an order of
      magnitude past that is not a ledger and is refused without being read whole.
    items:
      - name: maxFenceBytes
        type: int
        value: "64"
    name: maxFenceBytes
  - doc: |-
      exhaustedFence is the one parseable value the ledger cannot be advanced from.
      The mint is previous+1 on a uint64, so on this value it wraps to zero and the
      counter starts again from the bottom — reissuing, in order, every token the
      protected resource has already accepted. That is the same failure
      [corelock.LockFenceCorrupt] refuses a wrecked file for, reached by arithmetic instead
      of by bad bytes, so it carries the same verdict.
    items:
      - name: exhaustedFence
        type: uint64
        value: math.MaxUint64
    name: exhaustedFence
  - doc: |-
      lockSuffix names a lock file. The stem is the SHA-256 of the lock name, so
      any name a caller can write maps to exactly one usable filename: no path
      separator escapes the directory, no length limit is hit, and no two distinct
      names collide by way of a filesystem's case folding or Unicode
      normalisation — all three of which turn "two locks" into "one lock" or
      "one lock" into "two", silently.
    items:
      - name: lockSuffix
        type: string
        value: "\".lock\""
    name: lockSuffix
  - doc: |-
      defaultPoll is the interval between flock(2) attempts while another PROCESS
      holds the lock.

      It is a clamp, not a refusal, and the difference from MemoryConfig.TTL is
      the point of ADR 0031: a poll interval has one obviously-right order of
      magnitude — short enough that a handover is not noticeable, long enough that
      a contended lock does not spin a core — and no caller's correctness depends
      on the exact value. A lease lifetime has neither property.
    items:
      - name: defaultPoll
        type: time.Duration
        value: 25 * time.Millisecond
    name: defaultPoll
  - doc: |-
      lockDirMode is the mode a lock directory is CREATED with when it does not
      exist. An existing directory is checked, never changed — see [checkDir].
    items:
      - name: lockDirMode
        type: fs.FileMode
        value: "0o700"
    name: lockDirMode
  - doc: lockFileMode is the mode a lock file is created with.
    items:
      - name: lockFileMode
        type: fs.FileMode
        value: "0o600"
    name: lockFileMode
  - doc: |-
      observedUnlinked is the `observed` field's value when the lock file's name
      has no entry at all — the attack's own shape, and the only one that can be
      distinguished from a replacement with certainty.
    items:
      - name: observedUnlinked
        type: string
        value: "\"unlinked\""
    name: observedUnlinked
  - doc: |-
      observedReplaced is the `observed` field's value when the name exists and
      resolves to a different file from the one this descriptor holds.
    items:
      - name: observedReplaced
        type: string
        value: "\"replaced\""
    name: observedReplaced
  - doc: |-
      initialNames is the capacity hint for both per-name maps. A process
      typically guards a handful of named resources, not thousands; the hint costs
      one small allocation and saves the first few rehashes.
    items:
      - name: initialNames
        type: int
        value: "8"
    name: initialNames
  - doc: kindSymlink names this platform's indirection in the refusal's fields.
    items:
      - name: kindSymlink
        type: string
        value: "\"symlink\""
    name: kindSymlink
  - doc: |-
      hardenedOpen reports that this GOOS's [openLockFile] refuses an indirection
      planted at the lock path — O_NOFOLLOW, here. It is true exactly where
      internal/kernel/fs/flock.Native is: a platform gains the lock and its
      hardening together, or neither (backend.go).
    items:
      - name: hardenedOpen
        type: bool
        value: "true"
    name: hardenedOpen
