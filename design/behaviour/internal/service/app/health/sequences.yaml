      - lock:
          mutex: e.mu
      - set: e.active
        value: nil
      - opt:
          do:
            - return: "false"
          when: result.Status != corehealth.StatusHealthy || (!e.latching && e.maxAge <= 0)
      - bind: stored
        eval: result
      - set: e.cached
        value: "&stored"
      - bind: latchedNow
        eval: e.latching && !e.passed
      - set: e.passed
        value: e.latching || e.passed
      - return: latchedNow
