  - of: (*handler).ServeHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*handler).ServeHTTP
        kind: self
      - id: w.Header().Set
        kind: value
      - id: w.WriteHeader
        kind: value
      - id: h.registry.Probe
        kind: value
      - id: h.render
        kind: internal
      - id: w.Header
        kind: value
      - id: header.Set
        kind: value
      - id: w.Write
        kind: value
    steps:
      - opt:
          do:
            - eval: w.Header().Set("Allow", "GET, HEAD")
              to: w.Header().Set
            - eval: w.WriteHeader(http.StatusMethodNotAllowed)
              to: w.WriteHeader
            - return: ""
          when: r.Method != http.MethodGet && r.Method != http.MethodHead
      - bind: report
        eval: h.registry.Probe(r.Context(), h.probe)
        to: h.registry.Probe
      - bind: body
        eval: h.render(report)
        to: h.render
      - bind: header
        eval: w.Header()
        to: w.Header
      - eval: header.Set("Content-Type", "application/json; charset=utf-8")
        to: header.Set
      - eval: header.Set("Cache-Control", "no-store")
        to: header.Set
      - eval: header.Set("Content-Length", strconv.Itoa(len(body)))
        to: header.Set
      - eval: w.WriteHeader(statusCode(report.Status))
        to: w.WriteHeader
      - set: _, _
        to: w.Write
        value: w.Write(body)
  - of: statusCode
    steps:
      - opt:
          do:
            - return: http.StatusOK
          when: status.Serving()
      - return: http.StatusServiceUnavailable
  - of: (*handler).render
    participants:
      - id: caller
        kind: actor
      - id: (*handler).render
        kind: self
      - id: renderChecks
        kind: internal
      - id: json
        kind: stdlib
    steps:
      - bind: body
        eval: "bodyValue{Status: report.Status.String()}"
      - opt:
          do:
            - set: body.Checks
              to: renderChecks
              value: renderChecks(report)
          when: h.cfg.Detail
      - bind: encoded, err
        eval: json.Marshal(body)
        to: json
      - opt:
          do:
            - return: fallbackBody
          when: err != nil
      - return: encoded
  - of: renderChecks
    participants:
      - id: caller
        kind: actor
      - id: renderChecks
        kind: self
      - id: publicReason
        kind: internal
    steps:
      - bind: checks
        eval: make([]checkValue, 0, len(report.Results))
      - loop:
          do:
            - bind: check
              eval: |-
                checkValue{
                			Name:     result.Name,
                			Status:   result.Status.String(),
                			TookMs:   result.Took.Milliseconds(),
                			AgeMs:    result.Age(report.At).Milliseconds(),
                			TimedOut: result.TimedOut,
                			Cached:   result.Cached,
                		}
            - opt:
                do:
                  - set: check.Reason
                    to: publicReason
                    value: publicReason(result.Err)
                when: result.Err != nil
            - set: checks
              value: append(checks, check)
          key: _
          range: report.Results
          value: result
      - return: checks
  - of: publicReason
    participants:
      - id: caller
        kind: actor
      - id: publicReason
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: public
          init:
            bind: public
            eval: kerrs.PublicOf(err)
            to: kerrs
          when: public != ""
      - return: genericReason
  - of: New
    steps:
      - return: |-
          &health{
          		cfg:    cfg,
          		clk:    cfg.resolvedClock(),
          		checks: map[corehealth.Probe][]*entry{},
          		names:  map[corehealth.Probe]map[string]bool{},
          		//: the aggregate nobody has announced yet is the conservative one.
          		lastNotified: corehealth.StatusUnhealthy,
          	}
