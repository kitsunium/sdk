      - id: caller
        kind: actor
      - id: AskConfig.resolve
        kind: self
      - id: dialTarget
        kind: internal
      - id: absoluteURL
        kind: internal
    steps:
      - opt:
          do:
            - return: askRequest{}, askMisconfigured("timeout")
          when: c.Timeout < 0
      - bind: target, err
        eval: dialTarget(c.Addr)
        to: dialTarget
      - opt:
          do:
            - return: askRequest{}, err
          when: err != nil
      - bind: requestURL, err
        eval: absoluteURL(target, c.Path)
        to: absoluteURL
