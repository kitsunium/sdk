  - of: (*entry).fresh
    steps:
      - lock:
          mutex: e.mu
          read: true
      - opt:
          do:
            - return: corehealth.ResultValue{}, false
          when: e.cached == nil
      - bind: replay
        eval: "*e.cached"
      - opt:
          do:
            - set: replay.Cached
              value: "true"
            - return: replay, true
          when: e.latching
      - opt:
          do:
            - return: corehealth.ResultValue{}, false
          when: e.maxAge <= 0 || replay.Age(now) > e.maxAge
      - set: replay.Cached
        value: "true"
      - return: replay, true
  - of: (*entry).claim
    participants:
      - id: caller
        kind: actor
      - id: (*entry).claim
        kind: self
      - id: context
        kind: stdlib
    steps:
      - lock:
          mutex: e.mu
      - opt:
          do:
            - return: e.active, false
          when: e.active != nil
      - bind: ctx, cancel
        eval: context.WithCancel(context.WithoutCancel(parent))
        to: context
      - set: e.active
        value: "&inflight{ctx: ctx, cancel: cancel, done: make(chan struct{})}"
      - return: e.active, true
