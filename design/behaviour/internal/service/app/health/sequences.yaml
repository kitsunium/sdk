    steps:
      - return: "&handler{registry: registry, probe: corehealth.ProbeStartup, cfg: cfg}"
  - of: NewReadinessHandler
    steps:
      - return: "&handler{registry: registry, probe: corehealth.ProbeReadiness, cfg: cfg}"
  - of: NewLivenessHandler
    steps:
