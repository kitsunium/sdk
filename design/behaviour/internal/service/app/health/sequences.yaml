      - id: caller
        kind: actor
      - id: (*health).AddStartup
        kind: self
      - id: h.add
        kind: internal
    steps:
      - return: |-
          h.add(&entry{
          		name: check.Name, probe: corehealth.ProbeStartup, latching: true,
          		budget: h.cfg.checkBudget(check.Timeout), run: check.Check,
          	}, check.Check == nil)
        to: h.add
  - of: (*health).AddReadiness
    participants:
      - id: caller
        kind: actor
      - id: (*health).AddReadiness
        kind: self
      - id: kerrs
        kind: package
      - id: h.add
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corehealth.StaleCacheWindow, kerrs.WrapParams{},
                			kerrs.String("check", check.Name),
                			kerrs.String("max_age", check.MaxAge.String()),
                			kerrs.String("ceiling", MaxCacheAge.String()))
              to: kerrs
          when: check.MaxAge > MaxCacheAge
      - return: |-
          h.add(&entry{
          		name: check.Name, probe: corehealth.ProbeReadiness,
          		budget: h.cfg.checkBudget(check.Timeout), run: check.Check,
          		nonCritical: check.NonCritical, maxAge: check.MaxAge,
          	}, check.Check == nil)
        to: h.add
  - of: (*health).AddLiveness
    participants:
      - id: caller
        kind: actor
      - id: (*health).AddLiveness
        kind: self
      - id: h.add
        kind: internal
    steps:
      - return: |-
          h.add(&entry{
          		name: check.Name, probe: corehealth.ProbeLiveness,
          		budget: h.cfg.checkBudget(check.Timeout), runSelf: check.Check,
          	}, check.Check == nil)
        to: h.add
  - of: (*health).add
    participants:
      - id: caller
        kind: actor
      - id: (*health).add
        kind: self
      - id: kerrs
        kind: package
      - id: h.register
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corehealth.InvalidCheck, kerrs.WrapParams{},
                			kerrs.String("missing", "Name"), kerrs.String("probe", e.probe.String()))
              to: kerrs
          when: e.name == ""
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corehealth.InvalidCheck, kerrs.WrapParams{},
                			kerrs.String("missing", "Check"), kerrs.String("check", e.name),
                			kerrs.String("probe", e.probe.String()))
              to: kerrs
          when: bodyMissing
      - return: h.register(e)
        to: h.register
  - of: (*health).register
    participants:
      - id: caller
        kind: actor
      - id: (*health).register
        kind: self
      - id: kerrs
        kind: package
    steps:
      - lock:
          mutex: h.mu
      - opt:
          do:
            - set: h.names[e.probe]
              value: map[string]bool{}
          when: h.names[e.probe] == nil
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corehealth.DuplicateCheck, kerrs.WrapParams{},
                			kerrs.String("check", e.name), kerrs.String("probe", e.probe.String()))
              to: kerrs
          when: h.names[e.probe][e.name]
      - set: h.names[e.probe][e.name]
        value: "true"
      - set: h.checks[e.probe]
        value: append(h.checks[e.probe], e)
      - opt:
          do:
            - op: ++
              set: h.startupPending
          when: e.latching
      - return: nil
  - of: (*health).Drain
    steps:
      - lock:
          mutex: h.mu
      - set: h.draining
        value: "true"
  - of: (*health).startupPassed
    steps:
      - lock:
          mutex: h.mu
      - opt:
          do:
            - op: "--"
              set: h.startupPending
          when: h.startupPending > 0
  - of: (*health).entriesFor
    participants:
      - id: caller
        kind: actor
      - id: (*health).entriesFor
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: h.mu
          read: true
      - return: slices.Clone(h.checks[probe])
        to: slices
  - of: (*inflight).expire
    participants:
      - id: caller
        kind: actor
      - id: (*inflight).expire
        kind: self
      - id: r.expired.Store
        kind: value
    steps:
      - eval: r.expired.Store(true)
        to: r.expired.Store
      - eval: r.cancel()
  - of: (*health).announce
    participants:
      - id: caller
        kind: actor
      - id: (*health).announce
        kind: self
      - id: h.notify
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!h.cfg.Notify"
      - bind: state, err
        eval: h.notify(ctx, status)
        to: h.notify
      - opt:
          do:
            - return: ""
          when: err == nil || h.cfg.OnNotifyError == nil
      - eval: |-
          h.cfg.OnNotifyError(errors.Join(kerrs.Wrap(corehealth.NotifyFailed, kerrs.WrapParams{},
          		kerrs.String("state", state)), err))
  - of: (*health).notify
    participants:
      - id: caller
        kind: actor
      - id: (*health).notify
        kind: self
      - id: h.owed
        kind: internal
      - id: h.sendBudget
        kind: internal
    steps:
      - lock:
          mutex: h.notifyMu
      - opt:
          do:
            - return: "\"\", nil"
          when: status.Serving() && h.phase() == phaseDraining
      - bind: state, send
        eval: h.owed(status)
        to: h.owed
      - opt:
          do:
            - return: "\"\", nil"
          when: send == nil
      - bind: sendCtx, release
        eval: h.sendBudget(ctx)
        to: h.sendBudget
      - defer: release()
      - opt:
          do:
            - return: state, serr
          init:
            bind: serr
            eval: send(sendCtx)
          when: serr != nil
      - set: h.notified
        value: "true"
      - set: h.lastNotified
        value: status
      - return: state, nil
  - of: (*health).sendBudget
    participants:
      - id: caller
        kind: actor
      - id: (*health).sendBudget
        kind: self
      - id: ctx.Deadline
        kind: value
      - id: context
        kind: stdlib
      - id: h.clk.NewTimer
        kind: value
    steps:
      - opt:
          do:
            - return: ctx, func() {}
          init:
            bind: _, ok
            eval: ctx.Deadline()
            to: ctx.Deadline
          when: ok
      - bind: bounded, cancel
        eval: context.WithCancel(ctx)
        to: context
      - bind: timer
        eval: h.clk.NewTimer(h.cfg.checkBudget(0))
        to: h.clk.NewTimer
      - go: |-
          func() {
          		defer timer.Stop()
          		select {
          		//: the supervisor had its budget and did not read.
          		case <-timer.C():
          			//: unblocks the write, which then reports what went wrong.
          			cancel()
          		//: the send finished, or the caller left first.
          		case <-bounded.Done():
          			//: nothing to do; the deferred Stop releases the timer.
          		}
          	}()
      - return: bounded, cancel
  - of: (*health).owed
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: "\"\", nil"
                when: "!status.Serving()"
            - return: readyState, notify.ReadyContext
          when: "!h.notified"
      - opt:
          do:
            - return: "\"\", nil"
          when: status == h.lastNotified
      - return: |-
          statusState, func(ctx context.Context) error {
          		//: the aggregate's own words, bounded by the probe that measured it.
          		return notify.StatusContext(ctx, "health: "+status.String())
          	}
  - of: (*health).phase
    steps:
      - lock:
          mutex: h.mu
          read: true
      - opt:
          do:
            - return: phaseDraining
          when: h.draining
      - opt:
          do:
            - return: phaseStarting
          when: h.startupPending > 0
      - return: phaseServing
  - of: (*health).Probe
    participants:
      - id: caller
        kind: actor
      - id: (*health).Probe
        kind: self
      - id: h.answer
        kind: internal
      - id: h.publish
        kind: internal
    steps:
      - bind: report
        eval: h.answer(ctx, probe)
        to: h.answer
      - eval: h.publish(report)
        to: h.publish
      - return: report
  - of: (*health).answer
    participants:
      - id: caller
        kind: actor
      - id: (*health).answer
        kind: self
      - id: h.phase
        kind: internal
      - id: h.evaluateAll
        kind: internal
      - id: h.readiness
        kind: internal
      - id: h.liveness
        kind: internal
      - id: h.unknown
        kind: internal
    steps:
      - bind: current
        eval: h.phase()
        to: h.phase
      - switch:
          cases:
            - case: corehealth.ProbeStartup
              do:
                - return: h.evaluateAll(ctx, corehealth.ProbeStartup)
                  to: h.evaluateAll
            - case: corehealth.ProbeReadiness
              do:
                - return: h.readiness(ctx, current)
                  to: h.readiness
            - case: corehealth.ProbeLiveness
              do:
                - return: h.liveness(ctx, current)
                  to: h.liveness
            - default: true
              do:
                - return: h.unknown(probe)
                  to: h.unknown
          "on": probe
  - of: (*health).readiness
    participants:
      - id: caller
        kind: actor
      - id: (*health).readiness
        kind: self
      - id: h.announce
        kind: internal
      - id: h.shortCircuit
        kind: internal
      - id: h.evaluateAll
        kind: internal
    steps:
      - opt:
          do:
            - eval: h.announce(ctx, corehealth.StatusUnhealthy)
              to: h.announce
            - return: |-
                h.shortCircuit(corehealth.ProbeReadiness, "draining",
                			corehealth.StatusUnhealthy, corehealth.Draining)
              to: h.shortCircuit
          when: current == phaseDraining
      - opt:
          do:
            - return: |-
                h.shortCircuit(corehealth.ProbeReadiness, "starting",
                			corehealth.StatusUnhealthy, corehealth.StartupPending)
              to: h.shortCircuit
          when: current == phaseStarting
      - bind: report
        eval: h.evaluateAll(ctx, corehealth.ProbeReadiness)
        to: h.evaluateAll
      - eval: h.announce(ctx, report.Status)
        to: h.announce
      - return: report
  - of: (*health).liveness
    participants:
      - id: caller
        kind: actor
      - id: (*health).liveness
        kind: self
      - id: h.shortCircuit
        kind: internal
      - id: h.evaluateAll
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                h.shortCircuit(corehealth.ProbeLiveness, "starting",
                			corehealth.StatusHealthy, nil)
              to: h.shortCircuit
          when: current == phaseStarting
      - return: h.evaluateAll(ctx, corehealth.ProbeLiveness)
        to: h.evaluateAll
  - of: (*health).shortCircuit
    participants:
      - id: caller
        kind: actor
      - id: (*health).shortCircuit
        kind: self
      - id: kerrs
        kind: package
      - id: h.clk.Now
        kind: value
    steps:
      - var:
          name: err
          type: error
      - opt:
          do:
            - set: err
              to: kerrs
              value: kerrs.Wrap(sentinel, kerrs.WrapParams{}, kerrs.String("probe", probe.String()))
          when: sentinel != nil
      - bind: now
        eval: h.clk.Now()
        to: h.clk.Now
      - return: |-
          corehealth.ReportValue{
          		Probe: probe, Status: status, At: now,
          		Results: []corehealth.ResultValue{{Name: name, Status: status, At: now, Err: err}},
          	}
  - of: (*health).unknown
    participants:
      - id: caller
        kind: actor
      - id: (*health).unknown
        kind: self
      - id: h.clk.Now
        kind: value
      - id: kerrs
        kind: package
    steps:
      - bind: now
        eval: h.clk.Now()
        to: h.clk.Now
      - bind: err
        eval: |-
          kerrs.Wrap(corehealth.UnknownProbe, kerrs.WrapParams{},
          		kerrs.String("probe", probe.String()))
        to: kerrs
      - return: |-
          corehealth.ReportValue{
          		Probe: probe, Status: corehealth.StatusUnhealthy, At: now,
          		Results: []corehealth.ResultValue{{Name: "unknown", At: now, Err: err}},
          	}
  - of: (*health).evaluateAll
    participants:
      - id: caller
        kind: actor
      - id: (*health).evaluateAll
        kind: self
      - id: h.entriesFor
        kind: internal
      - id: h.evaluate
        kind: internal
      - id: group
        kind: package
      - id: h.shortCircuit
        kind: internal
      - id: corehealth
        kind: package
    steps:
      - bind: entries
        eval: h.entriesFor(probe)
        to: h.entriesFor
      - bind: checks
        eval: make([]func(context.Context) (corehealth.ResultValue, error), len(entries))
      - loop:
          do:
            - set: checks[i]
              value:
                closure:
                  params: ctx context.Context
                  results: corehealth.ResultValue, error
                  steps:
                    - return: h.evaluate(ctx, e), nil
                      to: h.evaluate
          key: i
          range: entries
          value: e
      - bind: results, err
        eval: group.Collect(ctx, group.Unlimited, checks)
        to: group
      - opt:
          do:
            - return: |-
                h.shortCircuit(probe, "collect", corehealth.StatusUnhealthy,
                			kerrs.Wrap(corehealth.CheckFailed, kerrs.WrapParams{}, kerrs.String("cause", err.Error())))
              to: h.shortCircuit
          when: err != nil
      - bind: status
        eval: corehealth.StatusHealthy
      - loop:
          do:
            - set: status
              to: corehealth
              value: corehealth.Worst(status, result.Status)
          key: _
          range: results
          value: result
      - return: "corehealth.ReportValue{Probe: probe, Status: status, At: h.clk.Now(), Results: results}"
  - of: (*health).publish
    steps:
      - opt:
          do:
            - return: ""
          when: h.cfg.OnReport == nil
      - lock:
          mutex: h.hookMu
      - eval: h.cfg.OnReport(report)
  - of: (*health).evaluate
    participants:
      - id: caller
        kind: actor
      - id: (*health).evaluate
        kind: self
      - id: e.fresh
        kind: internal
      - id: e.claim
        kind: internal
      - id: h.perform
        kind: internal
      - id: h.clk.Now
        kind: value
      - id: h.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: h.abandoned
        kind: internal
      - id: h.departed
        kind: internal
    steps:
      - opt:
          do:
            - return: replay
          init:
            bind: replay, ok
            eval: e.fresh(h.clk.Now())
            to: e.fresh
          when: ok
      - bind: run, mine
        eval: e.claim(ctx)
        to: e.claim
      - opt:
          do:
            - go: h.perform(e, run)
              to: h.perform
          when: mine
      - bind: armed
        eval: h.clk.Now()
        to: h.clk.Now
      - bind: timer
        eval: h.clk.NewTimer(e.budget)
        to: h.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-run.done
              do:
                - return: run.result
            - comm: <-timer.C()
              do:
                - return: h.abandoned(e, run)
                  to: h.abandoned
            - comm: <-ctx.Done()
              do:
                - return: h.departed(ctx, e, h.clk.Since(armed))
                  to: h.departed
  - of: (*health).perform
    participants:
      - id: caller
        kind: actor
      - id: (*health).perform
        kind: self
      - id: h.clk.Now
        kind: value
      - id: h.boundRun
        kind: internal
      - id: h.invoke
        kind: internal
      - id: h.outcome
        kind: internal
      - id: e.finish
        kind: internal
      - id: h.startupPassed
        kind: internal
    steps:
      - bind: begun
        eval: h.clk.Now()
        to: h.clk.Now
      - bind: release
        eval: h.boundRun(e, run)
        to: h.boundRun
      - bind: err
        eval: h.invoke(e, run)
        to: h.invoke
      - eval: release()
      - bind: result
        eval: h.outcome(e, run, err, begun)
        to: h.outcome
      - set: run.result
        value: result
      - bind: latched
        eval: e.finish(result)
        to: e.finish
      - opt:
          do:
            - eval: h.startupPassed()
              to: h.startupPassed
          when: latched
      - eval: close(run.done)
  - of: (*health).outcome
    participants:
      - id: caller
        kind: actor
      - id: (*health).outcome
        kind: self
      - id: h.abandoned
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                corehealth.ResultValue{
                			Name: e.name, Status: e.verdict(err), At: h.clk.Now(),
                			Took: h.clk.Since(begun), Err: err,
                		}
          when: err == nil || !run.expired.Load()
      - return: h.abandoned(e, run)
        to: h.abandoned
  - of: (*health).boundRun
    participants:
      - id: caller
        kind: actor
      - id: (*health).boundRun
        kind: self
      - id: h.clk.NewTimer
        kind: value
    steps:
      - bind: timer
        eval: h.clk.NewTimer(e.budget)
        to: h.clk.NewTimer
      - bind: released
        eval: make(chan struct{})
      - go: |-
          func() {
          		defer timer.Stop()
          		select {
          		//: the body had its budget and did not answer.
          		case <-timer.C():
          			//: tell it so, and record that a budget is why — a liveness body
          			//: has no context and hears nothing either way.
          			run.expire()
          		//: the body answered first.
          		case <-released:
          			//: nothing to announce.
          		}
          	}()
      - return:
          closure:
            steps:
              - eval: close(released)
  - of: (*health).invoke
    participants:
      - id: caller
        kind: actor
      - id: (*health).invoke
        kind: self
      - id: h.wrapFailure
        kind: internal
    steps:
      - defer: |-
          func() {
          		value := recover()
          		//: the ordinary path.
          		if value == nil {
          			//: leave err as the check returned it.
          			return
          		}
          		//: the recovered value travels as a FIELD, never as the wrap origin.
          		//: A panic string routinely carries an address or a query, and as a
          		//: cause it would become the Public a stranger reads.
          		err = kerrs.Wrap(corehealth.CheckPanicked, kerrs.WrapParams{},
          			kerrs.String("check", e.name), kerrs.String("probe", e.probe.String()),
          			kerrs.String("panic", fmt.Sprint(value)))
          	}()
      - return: h.wrapFailure(e, e.call(run))
        to: h.wrapFailure
  - of: (*entry).call
    steps:
      - opt:
          do:
            - return: e.runSelf()
          when: e.runSelf != nil
      - return: e.run(run.ctx)
  - of: (*entry).verdict
    steps:
      - opt:
          do:
            - return: corehealth.StatusHealthy
          when: err == nil
      - opt:
          do:
            - return: corehealth.StatusDegraded
          when: e.nonCritical
      - return: corehealth.StatusUnhealthy
  - of: (*health).wrapFailure
    participants:
      - id: caller
        kind: actor
      - id: (*health).wrapFailure
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: err == nil
      - return: |-
          kerrs.Wrap(err, kerrs.WrapParams{
          		Code:    corehealth.CheckFailed.Code(),
          		Reason:  corehealth.CheckFailed.Reason(),
          		Public:  corehealth.CheckFailed.Public(),
          		Private: corehealth.CheckFailed.Private(),
          	}, kerrs.String("check", e.name), kerrs.String("probe", e.probe.String()))
        to: kerrs
  - of: (*health).abandoned
    participants:
      - id: caller
        kind: actor
      - id: (*health).abandoned
        kind: self
      - id: run.expire
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - eval: run.expire()
        to: run.expire
      - bind: err
        eval: |-
          kerrs.Wrap(corehealth.CheckTimeout, kerrs.WrapParams{},
          		kerrs.String("check", e.name), kerrs.String("probe", e.probe.String()),
          		kerrs.String("budget", e.budget.String()))
        to: kerrs
      - return: |-
          corehealth.ResultValue{
          		Name: e.name, Status: e.verdict(err), TimedOut: true,
          		At: h.clk.Now(), Took: e.budget, Err: err,
          	}
  - of: (*health).departed
    participants:
      - id: caller
        kind: actor
      - id: (*health).departed
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: err
        eval: |-
          kerrs.Wrap(ctx.Err(), kerrs.WrapParams{
          		Code:     corehealth.CheckTimeout.Code(),
          		Reason:   corehealth.CheckTimeout.Reason(),
          		Public:   corehealth.CheckTimeout.Public(),
          		Private:  "service/app/health: the caller's context ended before the check answered; its run was left running for the next probe",
          		ExitCode: corehealth.CheckTimeout.ExitCode(),
          	}, kerrs.String("check", e.name), kerrs.String("probe", e.probe.String()))
        to: kerrs
      - return: |-
          corehealth.ResultValue{
          		Name: e.name, Status: e.verdict(err), TimedOut: true,
          		At: h.clk.Now(), Took: waited, Err: err,
          	}
