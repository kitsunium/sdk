functions:
  - name: Ask
    params: ctx context.Context, cfg AskConfig
    results: status int, err error
  - doc: |-
      dialTarget turns the address a process listens on into the host:port this
      process dials to reach it.
    name: dialTarget
    params: listen string
    results: string, error
  - doc: |-
      loopbackFor returns the host to dial for a listener's host: this machine's
      loopback of the same family when the listener named no particular address,
      the host itself otherwise.
    name: loopbackFor
    params: host string
    results: string
  - doc: "absoluteURL builds the URL an Ask gets: plain HTTP to target, at path."
    name: absoluteURL
    params: target, path string
    results: string, error
  - doc: |-
      armAsk arms the budget on the injected clock: when it fires first, the Ask's
      context is cancelled with AskTimeout as its cause. It returns the release
      the Ask runs on its way out.

      # Goroutine lifetime

      One goroutine per Ask. It ends at the budget, having cancelled, or at the
      release, whichever comes first.
    name: armAsk
    params: clk clock.Timed, budget time.Duration, cancel context.CancelCauseFunc
    results: release func()
  - doc: |-
      askClient builds the client of one Ask: a fresh transport that never
      proxies, keeps nothing alive and bounds the header, and no redirect
      followed.
    name: askClient
    results: "*http.Client"
  - doc: |-
      keepRedirect answers a redirect with the redirect itself: the probe asked
      this process, and a Location naming another is an answer, not a new address.
      Neither the next request nor the ones before it are consulted: every
      redirect is refused alike.
    name: keepRedirect
    params: next *http.Request, previous []*http.Request
    results: error
  - doc: |-
      discard reads at most MaxAskDrainBytes of body, closes it, and returns what
      stopped the drain early: nil for a body that ended or reached the bound.
      The body is never read into anything; a close failure leaves nothing to
      release, since keep-alive is off.
    name: discard
    params: body io.ReadCloser
    results: error
  - doc: |-
      paramsOf reads a sentinel's identity into WrapParams, with a Private of its
      own, so a plain cause can be wrapped under that sentinel's code.
    name: paramsOf
    params: sentinel sentinelIdentity, private string
    results: kerrs.WrapParams
  - doc: askMisconfigured refuses an Ask before anything is dialled.
    name: askMisconfigured
    params: argument string
    results: error
  - name: Component
    params: registry corehealth.Health, name string
    results: corelc.ComponentValue
  - doc: |-
      startupGate returns a lifecycle Start that refuses to declare the
      application up while a startup check is failing.

      It reports the checks' OWN errors, joined, rather than a sentinel of its
      own: the caller registered those checks and wrote those errors, and
      relabelling them here would cost them their errors.Is. The one exception is
      a refusal with no error to report at all — see startupUnexplained.
    name: startupGate
    params: registry corehealth.Health
    results: corelc.Start
  - doc: |-
      startupUnexplained is the refusal for a startup report that is not serving
      and carries no error saying why.

      This package's own registry never produces one — every result it reports as
      failing carries its error — so the path is reached through a Health written
      elsewhere, or a Status outside the three. It is StartupPending's code,
      reason, public message and exit code, so errors.Is and errs.HasCode both
      match it; the Private is this path's own, because wrapping the sentinel would
      inherit one describing a readiness short-circuit instead.
    name: startupUnexplained
    params: status string
    results: error
  - doc: |-
      drainGate returns a lifecycle Stop that marks the registry draining and
      returns at once.

      It closes nothing and waits for nothing. The withdrawal it triggers is
      observed by an orchestrator polling from outside the process, on ITS
      schedule, which the SDK neither knows nor should guess at: sleeping here for
      a "propagation delay" would spend the shutdown budget of a component that
      has nothing to shut down. A caller who needs that delay expresses it as its
      own component, added after this one.
    name: drainGate
    params: registry corehealth.Health
    results: corelc.Stop
  - doc: failures collects the errors of every result that did not pass.
    name: failures
    params: report corehealth.ReportValue
    results: "[]error"
  - name: NewStartupHandler
    params: registry corehealth.Health, cfg HandlerConfig
    results: http.Handler
  - name: NewReadinessHandler
    params: registry corehealth.Health, cfg HandlerConfig
    results: http.Handler
  - name: NewLivenessHandler
    params: registry corehealth.Health, cfg HandlerConfig
    results: http.Handler
  - doc: statusCode maps an aggregate to the only thing most callers read.
    name: statusCode
    params: status corehealth.Status
    results: int
  - doc: renderChecks projects each result onto the wire shape.
    name: renderChecks
    params: report corehealth.ReportValue
    results: "[]checkValue"
  - doc: |-
      publicReason is the ONLY path by which anything derived from a check's error
      reaches the wire. It always names something: err is a FAILURE, which its one
      caller has already established, so there is no "no reason" answer to give.

      errs.PublicOf walks to the deepest *errs.Error and returns its wire-safe
      half — which the SDK validated at construction: at most 120 runes, no
      newline, and written by whoever declared the sentinel to be read by a
      stranger. A chain with no *errs.Error in it yields "", and that becomes the
      SDK's own generic string rather than err.Error(): a driver message carries
      hosts, ports and occasionally credentials, and trimming one is a guess about
      where the secret is.
    name: publicReason
    params: err error
    results: string
  - name: New
    params: cfg Config
    results: corehealth.Health
