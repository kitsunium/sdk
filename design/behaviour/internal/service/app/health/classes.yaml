# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      DefaultAskTimeout is the budget an Ask gets when [AskConfig.Timeout] is zero.

      Three seconds sits far above what a readiness endpoint answering from
      memory needs, and an order of magnitude under Docker's own HEALTHCHECK
      timeout of thirty seconds: a probe that cannot get an answer reports why,
      with its own code, before the supervisor gives up on the command itself.
    items:
      - name: DefaultAskTimeout
        type: time.Duration
        value: 3 * time.Second
    name: DefaultAskTimeout
  - doc: |-
      MaxAskDrainBytes is how much of a response body Ask reads before closing it.

      Reading a short answer to its end lets the server finish writing instead of
      meeting a reset on every probe; the bound stops an endless or hostile body
      from holding the probe once the status, which is the whole answer, is in.
    items:
      - name: MaxAskDrainBytes
        type: int64
        value: 64 << 10
    name: MaxAskDrainBytes
  - doc: |-
      maxAskHeaderBytes bounds the response header the transport accepts, far
      under net/http's default: a readiness answer's header is a few lines.
    items:
      - name: maxAskHeaderBytes
        type: int64
        value: 64 << 10
    name: maxAskHeaderBytes
  - doc: highestPort is the largest TCP port number.
    items:
      - name: highestPort
        type: int
        value: "65535"
    name: highestPort
  - doc: Field names the Ask refusals carry.
    grouped: true
    items:
      - doc: fieldArgument names the AskConfig field a misconfigured Ask got wrong.
        name: fieldArgument
        type: string
        value: "\"argument\""
      - doc: fieldTarget carries the host:port the Ask dialled.
        name: fieldTarget
        type: string
        value: "\"target\""
      - doc: fieldBudget carries the budget an Ask ran out of.
        name: fieldBudget
        type: string
        value: "\"budget\""
      - doc: fieldStatus carries the status the process answered.
        name: fieldStatus
        type: string
        value: "\"status\""
    name: fieldArgument
  - doc: |-
      DefaultCheckTimeout is the per-check budget a non-positive Timeout clamps
      to.

      One second, and the number is defensible rather than round. A probe is
      polled on a period an orchestrator owns — Kubernetes defaults to
      periodSeconds 10 with timeoutSeconds 1 — and the SDK's own budget has to sit
      UNDER the orchestrator's, or the orchestrator gives up first and the caller
      gets no body, no attribution and no idea which check was slow.

      A check that legitimately needs longer than a second is a check that should
      carry a [corehealth.ReadinessCheckValue.MaxAge] and be measured off the
      probe path, not one that should be given a longer budget on it.
    items:
      - name: DefaultCheckTimeout
        type: time.Duration
        value: time.Second
    name: DefaultCheckTimeout
  - doc: |-
      MaxCacheAge is the ceiling on [corehealth.ReadinessCheckValue.MaxAge]. A
      registration above it is REFUSED ([corehealth.StaleCacheWindow]), never clamped.

      Thirty seconds is three conventional poll periods. Past that, at most three
      consecutive probes could replay one measurement — which is already longer
      than an operator watching a probe recover would wait before concluding it
      had not. A cached answer is a dated statement; beyond this bound it is
      simply a claim the SDK cannot support, and quietly serving 30s to a caller
      who asked for five minutes would be the same lie in a smaller size.
    items:
      - name: MaxCacheAge
        type: time.Duration
        value: 30 * time.Second
    name: MaxCacheAge
  - doc: |-
      genericReason is what a probe body says about a failure carrying no errs
      Public of its own. It names a condition and never a cause: a probe endpoint
      is routinely reachable by more than whoever added it.
    items:
      - name: genericReason
        type: string
        value: "\"A health check reported a failure\""
    name: genericReason
  - doc: |-
      readyState is the sd_notify state name used in a NotifyFailed field. It is
      the protocol's own spelling, so an operator reading the error can grep the
      unit's journal for the same word.
    items:
      - name: readyState
        type: string
        value: "\"READY\""
    name: readyState
  - doc: statusState is its counterpart for the STATUS= line.
    items:
      - name: statusState
        type: string
        value: "\"STATUS\""
    name: statusState
  - grouped: true
    items:
      - doc: |-
          phaseStarting means at least one registered startup check has not
          passed. With no startup checks registered this is never reached, which
          is what makes a registry that only has readiness checks work out of the
          box instead of sitting not-ready forever.
        name: phaseStarting
        type: phase
        value: iota
      - doc: phaseServing means the process is up and has not been drained.
        name: phaseServing
      - doc: phaseDraining means Drain was called. One-way.
        name: phaseDraining
    name: phaseStarting
