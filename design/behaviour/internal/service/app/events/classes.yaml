package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/app/events
  name: events
  purpose: "Package events — hosts the engine: registration, removal, and the copy-on-write membership the dispatch reads."
types:
  - doc: |-
      bus is the concrete core/app/events.Bus. It is unexported: there is one
      canonical in-process dispatch discipline, so a registry would have exactly
      one entry and would add a way to misconfigure it at runtime (the proc,
      resilience, scheduler and lifecycle precedents — ADR 0016 / 0026 / 0041 /
      0050).
    fields:
      - doc: |-
          members is the per-type subscription index, published as one
          copy-on-write snapshot. Publish reads it with a single atomic load and
          no allocation; Subscribe and Unsubscribe rebuild it — the right trade
          for an index written at wiring time and read once per published event.
          The primitive a copy-on-write membership list always takes (ADR 0011).
        name: members
        type: snapshot.Value[state]
    kind: struct
    methods:
      - doc: |-
          Subscribe registers sub against eventType, refusing anything that could
          never fire.
        name: Subscribe
        params: eventType corev.EventType, sub corev.SubscriptionValue
        recv: b *bus
        results: error
      - doc: Unsubscribe removes the listener registered under name for eventType.
        name: Unsubscribe
        params: eventType corev.EventType, name string
        recv: b *bus
        results: error
      - doc: |-
          Publish calls every listener registered for the event's dynamic type, in
          ascending priority and then registration order, ON THIS GOROUTINE, and
          returns when the last one has returned.

          ctx is passed to every listener and is never inspected by the bus. An event
          is a fact that has already happened; abandoning half of its consequences
          because the publisher's deadline expired would produce exactly the partial
          state the synchronous contract exists to prevent. The price is stated
          rather than hidden: a dispatch does not end early, so a listener that must
          honour cancellation has to do it itself — and a caller who wants the bus to
          return before the work finishes wants a queue, not this.

          A bus with no listener for this type is legitimate: the zero DispatchValue
          and a nil error. A publisher must not have to know whether anybody is
          listening.
        name: Publish
        params: ctx context.Context, event any
        recv: b *bus
        results: report corev.DispatchValue, err error
    name: bus
  - fields:
      - doc: |-
          Name identifies the listener in every error field and is the handle
          [Off] removes it by. It must be non-empty and unique among the
          listeners registered for E.
        name: Name
        type: string
      - doc: |-
          Priority orders this listener among the others registered for E. Lower
          runs first; equal priorities run in registration order. Its zero value,
          core/app/events.PriorityNormal, is a working default.
        name: Priority
        type: corev.Priority
      - doc: |-
          MayHalt authorises Handle to stop the dispatch by returning
          core/app/events.Halt. False — the zero value — means it cannot.
        name: MayHalt
        type: bool
      - doc: |-
          Handle is the reaction. It receives the event ALREADY TYPED. It must be
          non-nil.
        name: Handle
        type: func(ctx context.Context, event E) error
    kind: struct
    name: Handler
    typeParams: E any
  - doc: |-
      state is the value a bus publishes through its copy-on-write snapshot: the
      subscriptions held for each event type, each list ALREADY ORDERED.

      It is replaced, never mutated. A publisher may be ranging over one of these
      slices at any moment with no lock held, which is what makes a Subscribe or
      an Unsubscribe during a live dispatch harmless — and what makes the
      dispatch itself a single atomic load.

      The lists are kept sorted at REGISTRATION rather than at publication. A bus
      is written once at wiring time and read once per event for the life of the
      process, so sorting on the read path would pay the cost on exactly the side
      that cannot afford it — and would allocate a scratch slice per published
      event, on the hottest path there is.
    fields:
      - doc: byType maps a concrete event type to its ordered subscriptions.
        name: byType
        type: map[corev.EventType][]corev.SubscriptionValue
    kind: struct
    name: state
