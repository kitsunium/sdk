# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      causeNonPositiveInterval / causeNilOnChange are what Watch's input guards
      say in CONFIG_WATCH_FAILED's cause field. They are sentences, not errors:
      the field holds text, so withCause carries them as text and never mints the
      stdlib error rule 2 bans.
    grouped: true
    items:
      - name: causeNonPositiveInterval
        value: "\"poll interval must be > 0\""
      - name: causeNilOnChange
        value: "\"onChange callback must not be nil\""
    name: causeNonPositiveInterval
  - doc: |-
      keySeparator is the one level-separator of the key grammar. It is the same
      character core/app/validation.JoinField writes, so a default's key and a
      violation's path are literally the same string.
    items:
      - name: keySeparator
        type: string
        value: "\".\""
    name: keySeparator
  - doc: |-
      jsonTagName is the tag that names a field on the operator's surface. Load
      decodes every format — TOML, YAML, env, JSON — through a json round trip, so
      this tag is the key the operator typed, and the Go field name is not.
    items:
      - name: jsonTagName
        type: string
        value: "\"json\""
    name: jsonTagName
  - doc: tagOptionSeparator splits a json tag's name from its options ("port,omitempty").
    items:
      - name: tagOptionSeparator
        type: string
        value: "\",\""
    name: tagOptionSeparator
  - doc: |-
      tagOptOut is the json tag value that removes a field from the wire entirely.
      A field that does not travel cannot carry a default.
    items:
      - name: tagOptOut
        type: string
        value: "\"-\""
    name: tagOptOut
  - doc: |-
      expectedKeys is the capacity hint for a freshly-walked type. A configuration
      struct is a handful of keys, not a thousand; the hint exists to avoid the
      first two growth steps, not to be exact.
    items:
      - name: expectedKeys
        type: int
        value: "16"
    name: expectedKeys
  - doc: |-
      expectedDepth is the capacity hint for the recursion guard — a configuration
      nests a few levels, and the guard holds one entry per level.
    items:
      - name: expectedDepth
        type: int
        value: "8"
    name: expectedDepth
  - doc: |-
      maxContainerDepth bounds how many pointer, slice, array and map layers
      holdsSecret peels. No real field nests eight containers deep, and a type
      that contains itself would otherwise be peeled forever.
    items:
      - name: maxContainerDepth
        type: int
        value: "8"
    name: maxContainerDepth
  - grouped: true
    items:
      - doc: secretNone is a field that holds no secret.
        name: secretNone
        type: secretHold
        value: iota
      - doc: "secretDirect is a secret.Value, or a pointer to one: one string."
        name: secretDirect
      - doc: secretNested is secrets inside a slice, an array or a map.
        name: secretNested
    name: secretNone
  - grouped: true
    items:
      - doc: |-
          keyLeaf is a key the decoder fills directly. Nothing below it is
          addressable, so nothing below it can be unknown.
        name: keyLeaf
        type: keyKind
        value: iota
      - doc: keyTable is a key whose members are themselves addressable keys.
        name: keyTable
    name: keyLeaf
  - doc: |-
      maxKeyEchoRunes caps how much of a key a refusal echoes. A key is the
      SCHEMA AUTHOR's own literal, never operator input, so echoing it is what
      makes the refusal actionable — but an unbounded echo turns one bad
      declaration into a log line nobody reads.
    items:
      - name: maxKeyEchoRunes
        type: int
        value: "96"
    name: maxKeyEchoRunes
  - doc: |-
      maxKeyListRunes caps the joined key list a load failure carries. Keys are
      names, never values, so the echo is safe; a 400-key configuration would still
      produce an unreadable line without the cap.
    items:
      - name: maxKeyListRunes
        type: int
        value: "240"
    name: maxKeyListRunes
  - doc: keyListSeparator joins the keys a failure names.
    items:
      - name: keyListSeparator
        type: string
        value: "\", \""
    name: keyListSeparator
  - doc: echoTruncationMark tells a short list from a shortened one.
    items:
      - name: echoTruncationMark
        type: string
        value: "\"…\""
    name: echoTruncationMark
  - doc: |-
      keyFailureKinds is how many independent answers the key pass can carry: the
      keys that were required and absent, and the keys that were supplied and
      unreadable. It is the capacity of the slice they are joined from.
    items:
      - name: keyFailureKinds
        type: int
        value: "2"
    name: keyFailureKinds
