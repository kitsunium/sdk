                  eval: seen[key]
                when: "!dup"
          key: key
          range: a.dirty
      - eval: clear(a.dirty)
      - eval: slices.Sort(dirty)
        to: slices
      - return: append(keys, dirty...)
  - of: (*agenda).next
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).next
        kind: self
      - id: a.heap.Peek
        kind: value
      - id: a.heap.Pop
        kind: value
    steps:
      - lock:
          mutex: a.mu
      - opt:
          do:
            - return: now
          when: len(a.dirty) > 0
      - loop:
          do:
            - bind: top, ok
              eval: a.heap.Peek()
              to: a.heap.Peek
            - opt:
                do:
                  - return: time.Time{}
                when: "!ok"
            - opt:
                do:
                  - return: top.due
                when: a.isLive(top)
            - eval: a.heap.Pop()
              to: a.heap.Pop
          forever: true
  - of: (*agenda).isLive
    steps:
      - bind: p
        eval: a.plans[s.key]
      - return: p != nil && p.seq == s.seq
  - of: (*agenda).compact
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).compact
        kind: self
      - id: a.heap.Pop
        kind: value
      - id: a.heap.Push
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: a.heap.Len() <= staleFactor*a.live+compactSlack
