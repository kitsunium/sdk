        eval: make([]slot, 0, a.live)
      - loop:
          do:
            - bind: s, ok
              eval: a.heap.Pop()
              to: a.heap.Pop
            - opt:
                do:
                  - break: true
                when: "!ok"
            - opt:
                do:
                  - set: kept
                    value: append(kept, s)
                when: a.isLive(s)
          forever: true
      - loop:
          do:
            - eval: a.heap.Push(s)
              to: a.heap.Push
          key: _
          range: kept
          value: s
  - of: freeze
    participants:
      - id: caller
        kind: actor
      - id: freeze
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: b
        eval: |-
          &blueprint[E, S]{
          		state: d.state, arrows: slices.Clone(d.arrows), order: slices.Clone(d.order), after: slices.Clone(d.after),
          		enter:  make(map[S][]func(context.Context, *E) error, len(d.enter)),
          		events: make(map[eventKey[S]]int), auto: make(map[S][]int), content: make(map[S]bool),
          		creation: arrow[E, S]{event: corestm.CreateEvent, to: d.initial, trigger: corestm.TriggerStart},
          	}
      - loop:
          do:
            - set: b.enter[state]
              to: slices
              value: slices.Clone(hooks)
          key: state
          range: d.enter
          value: hooks
      - loop:
          do:
            - opt:
                do:
                  - set: "b.events[eventKey[S]{event: x.event, from: x.from}]"
                    value: i
                  - continue: true
                when: x.trigger == corestm.TriggerEvent
            - set: b.auto[x.from]
              value: append(b.auto[x.from], i)
            - opt:
                do:
                  - set: b.content[x.from]
                    value: "true"
                when: x.trigger != corestm.TriggerDelay
          key: i
          range: b.arrows
          value: x
      - return: b
  - of: (*blueprint).automatic
    steps:
      - return: len(b.auto[state]) > 0
  - of: (*blueprint).declared
    steps:
      - bind: counts
        eval: make(map[S]int, len(b.order))
      - loop:
          do:
            - set: counts[st]
              value: "0"
          key: _
          range: b.order
          value: st
      - return: counts
  - of: (*blueprint).eventArrow
    steps:
      - bind: i, found
        eval: "b.events[eventKey[S]{event: event, from: from}]"
      - opt:
          do:
            - return: arrow[E, S]{}, false
          when: "!found"
      - return: b.arrows[i], true
  - of: (*arrow).dueAt
    participants:
      - id: caller
        kind: actor
      - id: (*arrow).dueAt
        kind: self
      - id: entered.Add
        kind: value
    steps:
      - switch:
          cases:
            - case: corestm.TriggerGuard
              do:
                - return: time.Time{}, x.guard(e)
            - case: corestm.TriggerDeadline
              do:
                - return: x.instant(e)
            - case: corestm.TriggerDelay
              do:
                - return: entered.Add(x.delay), true
                  to: entered.Add
            - default: true
              do:
                - return: time.Time{}, false
          "on": x.trigger
  - of: (*blueprint).evaluate
    participants:
      - id: caller
        kind: actor
      - id: (*blueprint).evaluate
        kind: self
      - id: x.dueAt
        kind: internal
    steps:
      - bind: asking
        eval: "\"\""
      - defer: |-
          func() {
          		value := recover()
          		//: the ordinary path.
          		if value == nil {
          			//: the verdict stands as computed.
          			return
          		}
          		due = verdict[E, S]{}
          		//: the value travels as a field, never as the wrap origin.
          		err = errs.Wrap(corestm.FunctionPanicked, errs.WrapParams{}, errs.String("event", asking),
          			errs.String("panic", fmt.Sprint(value)), errs.String("stack", string(debug.Stack())))
          	}()
      - loop:
          do:
            - bind: x
              eval: "&b.arrows[i]"
            - set: asking
              value: x.event
            - bind: at, ok
              eval: x.dueAt(e, entered)
              to: x.dueAt
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - opt:
                do:
                  - return: "verdict[E, S]{fire: x}, nil"
                when: "!at.After(now)"
            - opt:
                do:
                  - set: due.next
                    value: at
                when: due.next.IsZero() || at.Before(due.next)
          key: _
          range: b.auto[state]
          value: i
      - return: due, nil
  - of: newBook
    steps:
      - bind: declared
        eval: make(map[S]bool, len(census))
      - loop:
          do:
            - set: declared[state]
              value: "true"
          key: state
          range: census
      - return: |-
          &book[S]{
          		journal: journal, records: make(map[string]*record[S]), census: census, gates: newKeyLocks(),
          		declared: declared, flights: make(map[string]*flight), limit: limit,
          	}
