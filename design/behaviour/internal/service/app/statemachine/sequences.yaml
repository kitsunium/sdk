      - lock:
          mutex: b.mu
      - bind: history
        eval: rec.History
      - opt:
          do:
            - set: history
              value: history[over:]
          init:
            bind: over
            eval: len(history) - b.limit
          when: over > 0
      - set: b.records[rec.Key]
        value: "&record[S]{state: rec.State, entered: rec.Entered, history: slices.Clone(history)}"
      - eval: b.adjust(rec.State, 1)
        to: b.adjust
  - of: (*book).fly
    participants:
      - id: caller
        kind: actor
      - id: (*book).fly
        kind: self
      - id: b.open
        kind: internal
    steps:
      - return: b.open(key, transitionFlight)
        to: b.open
  - of: (*book).read
    participants:
      - id: caller
        kind: actor
      - id: (*book).read
        kind: self
      - id: b.open
        kind: internal
    steps:
      - return: b.open(key, readFlight)
        to: b.open
  - of: (*book).open
    steps:
      - lock:
          mutex: b.mu
      - bind: f
        eval: "&flight{kind: kind}"
      - set: b.flights[key]
        value: f
      - return: f
  - of: (*book).land
    steps:
      - lock:
          mutex: b.mu
      - opt:
          do:
            - return: false, false
          when: b.flights[key] != f
      - eval: delete(b.flights, key)
      - return: f.touched && !f.deleted, f.deleted
  - of: (*book).touch
    steps:
      - lock:
          mutex: b.mu
      - bind: f
        eval: b.flights[key]
      - opt:
          do:
            - return: "false"
          when: f == nil || f.kind != transitionFlight
      - set: f.touched
        value: "true"
      - return: "true"
  - of: (*book).step
    participants:
      - id: caller
        kind: actor
      - id: (*book).step
        kind: self
      - id: b.stepped
        kind: internal
      - id: b.save
        kind: internal
