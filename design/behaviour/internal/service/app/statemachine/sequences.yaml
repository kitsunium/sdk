      - op: +=
        set: b.census[state]
        value: delta
      - opt:
          do:
            - eval: delete(b.census, state)
          when: b.census[state] <= 0 && !b.declared[state]
  - of: (*book).adopt
    participants:
      - id: caller
        kind: actor
      - id: (*book).adopt
        kind: self
      - id: b.adjust
        kind: internal
