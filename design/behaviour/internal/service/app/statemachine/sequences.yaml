    participants:
      - id: caller
        kind: actor
      - id: newAgenda
        kind: self
      - id: cmp
        kind: stdlib
    steps:
      - bind: byDue
        eval:
          closure:
            params: a, b slot
            results: int
            steps:
              - return: cmp.Or(a.due.Compare(b.due), cmp.Compare(a.seq, b.seq))
                to: cmp
      - return: "&agenda{heap: heap.New(byDue), plans: make(map[string]*plan), dirty: make(map[string]struct{}), wake: make(chan struct{}, 1)}"
  - of: (*agenda).signal
    steps:
      - select:
          cases:
            - comm: a.wake <- struct{}{}
            - default: true
  - of: (*agenda).markDirty
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).markDirty
        kind: self
      - id: a.mu.Lock
        kind: value
      - id: a.mu.Unlock
        kind: value
      - id: a.signal
        kind: internal
    steps:
      - eval: a.mu.Lock()
        to: a.mu.Lock
      - set: a.dirty[key]
        value: struct{}{}
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
      - eval: a.signal()
        to: a.signal
  - of: (*agenda).pending
    steps:
      - lock:
          mutex: a.mu
      - return: len(a.dirty) > 0
  - of: (*agenda).requeue
    steps:
      - lock:
          mutex: a.mu
      - loop:
          do:
            - set: a.dirty[key]
              value: struct{}{}
          key: _
          range: keys
          value: key
  - of: (*agenda).schedule
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).schedule
        kind: self
      - id: a.scheduleLocked
        kind: internal
