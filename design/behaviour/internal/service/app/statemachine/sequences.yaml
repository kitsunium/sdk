        eval: a.plans[key]
      - opt:
          do:
            - return: ""
          when: p == nil
      - opt:
          do:
            - set: p.seq
              value: "0"
            - op: "--"
              set: a.live
          when: p.seq != 0
      - opt:
          do:
            - eval: delete(a.plans, key)
          when: p.failures == 0
  - of: (*agenda).forget
    steps:
      - lock:
          mutex: a.mu
      - eval: delete(a.dirty, key)
      - opt:
          do:
            - op: "--"
              set: a.live
          init:
            bind: p
            eval: a.plans[key]
          when: p != nil && p.seq != 0
      - eval: delete(a.plans, key)
  - of: (*agenda).restart
    steps:
      - lock:
          mutex: a.mu
      - opt:
          do:
            - set: p.failures, p.notBefore
              value: 0, time.Time{}
          init:
            bind: p
            eval: a.plans[key]
          when: p != nil
  - of: (*agenda).failed
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).failed
        kind: self
      - id: now.Add
        kind: value
      - id: a.scheduleLocked
        kind: internal
    steps:
      - lock:
          mutex: a.mu
      - bind: p
        eval: a.plans[key]
      - opt:
          do:
            - set: p
              value: "&plan{}"
            - set: a.plans[key]
              value: p
          when: p == nil
      - op: ++
        set: p.failures
      - set: p.notBefore
        to: now.Add
        value: now.Add(delay(p.failures))
      - eval: a.scheduleLocked(key, p.notBefore)
        to: a.scheduleLocked
  - of: (*agenda).heldBack
    steps:
      - lock:
          mutex: a.mu
      - bind: p
        eval: a.plans[key]
      - return: p != nil && p.notBefore.After(now)
  - of: (*agenda).succeeded
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).succeeded
        kind: self
      - id: a.restart
        kind: internal
    steps:
      - eval: a.restart(key)
        to: a.restart
  - of: (*agenda).take
    participants:
      - id: caller
        kind: actor
      - id: (*agenda).take
        kind: self
      - id: a.heap.Peek
        kind: value
      - id: a.heap.Pop
        kind: value
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: a.mu
      - var:
          name: keys
          type: "[]string"
      - bind: seen
        eval: make(map[string]struct{}, len(a.dirty))
      - loop:
          do:
            - bind: top, ok
              eval: a.heap.Peek()
              to: a.heap.Peek
            - opt:
                do:
                  - break: true
                when: "!ok || top.due.After(now) && a.isLive(top)"
            - eval: a.heap.Pop()
              to: a.heap.Pop
            - opt:
                do:
                  - continue: true
                when: "!a.isLive(top)"
            - set: a.plans[top.key].seq
              value: "0"
            - op: "--"
              set: a.live
            - set: keys
              value: append(keys, top.key)
            - set: seen[top.key]
              value: struct{}{}
          forever: true
      - bind: dirty
        eval: make([]string, 0, len(a.dirty))
      - loop:
          do:
            - opt:
