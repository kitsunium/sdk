apiVersion: design/behaviour/v1
constants:
  - doc: |-
      compactSlack is how many stale entries the heap may hold beyond its live
      ones before it is rebuilt: below it, a rebuild costs more than it frees.
    items:
      - name: compactSlack
        type: int
        value: "64"
    name: compactSlack
  - doc: |-
      staleFactor is how many times the live entries the heap may hold before it
      is rebuilt. With it, a rebuild is paid for by at least as many updates as
      it drops, so an update stays O(log N) amortised.
    items:
      - name: staleFactor
        type: int
        value: "2"
    name: staleFactor
  - doc: What holds an entity during a flight.
    grouped: true
    items:
      - doc: |-
          readFlight is a read the machine records: it takes deletions only — a
          writer waits for the lock and reads after it.
        name: readFlight
        type: flightKind
        value: iota + 1
      - doc: |-
          transitionFlight is a transition: it takes writes too, since the write
          is very often the transition's own.
        name: transitionFlight
    name: readFlight
  - doc: |-
      DefaultMinGap is the least time between the end of one run of a machine's
      loop and the start of the next, when Config.MinGap is not positive: a burst
      of writes is one run, and a transition chain advances one step per run.
    items:
      - name: DefaultMinGap
        type: time.Duration
        value: time.Second
    name: DefaultMinGap
  - doc: |-
      DefaultMaxHistory is how many transitions a record keeps when
      Config.MaxHistory is not positive.
    items:
      - name: DefaultMaxHistory
        type: int
        value: "20"
    name: DefaultMaxHistory
  - doc: |-
      defaultBackoffBase and defaultBackoffMax bound the wait before an entity
      whose automatic transition failed is tried again, when Config.Backoff has no
      BaseDelay: 1s, doubling, held at a minute.
    grouped: true
    items:
      - name: defaultBackoffBase
        type: time.Duration
        value: time.Second
      - name: defaultBackoffMax
        type: time.Duration
        value: time.Minute
    name: defaultBackoffBase
  - grouped: true
    items:
      - doc: WakeStart is the first run, when Run starts.
        name: WakeStart
        type: Wake
        value: iota + 1
      - doc: "WakeDue is a run the loop woke for by itself: a transition fell due."
        name: WakeDue
      - doc: WakeChange is a run a write woke the loop for.
        name: WakeChange
    name: WakeStart
  - grouped: true
    items:
      - doc: "LoopRunStarted reports a run starting: Wake and Started are set."
        name: LoopRunStarted
        type: LoopEventKind
        value: iota + 1
      - doc: "LoopRunEnded reports a run ending: every field is set."
        name: LoopRunEnded
      - doc: |-
          LoopWaiting reports the loop re-armed to wake earlier, at Next, because
          a write arrived while it slept.
        name: LoopWaiting
    name: LoopRunStarted
  - doc: What ended a sleep of the loop.
    grouped: true
    items:
      - doc: sleptCanceled is the caller's context ending.
        name: sleptCanceled
        type: slept
        value: iota
      - doc: sleptDue is the target instant coming.
        name: sleptDue
      - doc: sleptWoken is a write's wake.
        name: sleptWoken
    name: sleptCanceled
  - doc: hookOnEnter and hookOnTransition name the two kinds of hook in a field.
    grouped: true
    items:
      - name: hookOnEnter
        type: string
        value: "\"on-enter\""
      - name: hookOnTransition
        type: string
        value: "\"on-transition\""
    name: hookOnEnter
