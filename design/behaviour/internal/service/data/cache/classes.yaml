apiVersion: design/behaviour/v1
constants:
  - doc: |-
      minChainTiers is the smallest tier count that makes a chain mean anything.
      One tier is the tier itself wearing an extra layer of indirection, so
      building it is far more likely to be a mistake than an intention.
    items:
      - name: minChainTiers
        type: int
        value: "2"
    name: minChainTiers
  - doc: |-
      initialIndexCapacity pre-sizes both index maps and each tag bucket. It is a
      hint, not a bound: a store with no tagged entry must not pay for a large
      allocation, and one with many grows past it in a handful of doublings.
    items:
      - name: initialIndexCapacity
        type: int
        value: "16"
    name: initialIndexCapacity
