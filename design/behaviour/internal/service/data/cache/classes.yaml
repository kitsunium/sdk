package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/cache
  name: cache
  purpose: Package cache — hosts the compile-time interface assertions, keeping them out of the production source so the runtime binary carries no diagnostic-only declarations.
types:
  - doc: |-
      chainStore reads near-to-far and writes far-to-near.

      # Nothing here is atomic, and that is stated rather than papered over

      A chain is two independent stores. There is no transaction across them, so
      every multi-tier operation has a window in which they disagree. The design
      choice is not whether that window exists but which side of it is safer:

        - Set writes FAR first. A failure then leaves the near tier without the
          new value, so the next read falls through and finds the old one — stale,
          but consistent with what the far tier holds. Writing near first would
          instead leave the near tier holding a value the far tier never accepted.
        - Delete removes FAR first, and attempts EVERY tier even after a failure.
          Near-first is strictly worse: if the far removal then failed, the next
          read would miss in the near tier, hit in the far one, and PROMOTE the
          value back — undoing the delete completely and permanently. Far-first
          bounds the damage to one near-tier TTL, and the caller has an error.
        - Fetch promotes on a far hit and never fails the read because the
          promotion failed: the caller already has the value.

      # A promotion never writes back what a write has replaced (#460)

      A promotion copies, into the nearer tiers, an entry it read from a farther
      one — read BEFORE it writes. A Set, Delete or InvalidateTag that ran in
      between would see its own effect overwritten by that older copy, served
      from the near tier for its whole TTL, forever under NoExpiry. So every
      write announces itself first: it counts itself in writing, then moves
      generation under the promotion lock — which waits for every promotion
      already past its check to finish writing — and only then touches a tier;
      it moves generation again when it ends. A promotion, under the read side of
      that lock, writes only when no write is running and none began or ended
      since it read generation, before its far read. A skipped promotion costs
      one later fall-through, never a stale hit.
    fields:
      - name: tiers
        type: "[]tier[V]"
      - name: onPromoteError
        type: func(key string, err error)
      - name: group
        type: singleflight.Group[string, V]
      - doc: |-
          promoting is held for reading by a promotion from its check to its last
          write, and taken for writing by a write announcing itself.
        name: promoting
        type: sync.RWMutex
      - doc: |-
          generation moves twice per write: when it announces itself, and when
          it ends.
        name: generation
        type: atomic.Uint64
      - doc: writing counts the writes announced and not finished.
        name: writing
        type: atomic.Int64
      - doc: refreshMu guards refreshing, the keys a background refresh runs for.
        name: refreshMu
        type: sync.Mutex
      - name: refreshing
        type: map[string]struct{}
      - doc: waiter is what LoadLeased waits on between two reads (#830).
        name: waiter
        type: clock.Waiter
      - doc: leasePoll is LoadLeased's step while another process holds the lease.
        name: leasePoll
        type: time.Duration
    kind: struct
    methods:
      - doc: Fetch reads near-to-far and promotes a far hit into every nearer tier.
        name: Fetch
        params: ctx context.Context, key string
        recv: c *chainStore[V]
        results: value V, found bool, err error
      - doc: FetchEntry is Fetch with the entry, and is where promotion happens.
        name: FetchEntry
        params: ctx context.Context, key string
        recv: c *chainStore[V]
        results: entry corecache.EntryValue[V], found bool, err error
      - doc: |-
          promote writes entry into every tier nearer than found.

          A failure here never fails the read: the caller already has the value, and
          turning a degraded cache into a degraded service would be a worse trade. It
          is reported through ChainConfig.OnPromoteError instead — which is nil by
          default, and a nil hook is exactly how a near tier that rejects everything
          stays invisible.

          It writes nothing when a write is running, or began since seen was read:
          see the type comment.
        name: promote
        params: ctx context.Context, key string, entry corecache.EntryValue[V], found int, seen uint64
        recv: c *chainStore[V]
      - doc: reportPromoteError hands a failed promotion to the configured observer.
        name: reportPromoteError
        params: key string, err error
        recv: c *chainStore[V]
      - doc: |-
          announce makes a write visible to every promotion before it touches a tier;
          the write defers finish. See the type comment.
        name: announce
        recv: c *chainStore[V]
      - doc: |-
          finish ends an announced write. It moves generation again, before writing
          drops: a promotion whose walk began while this write ran — its seen read
          after announce, its far read perhaps before the far write landed — then
          fails its check even when it comes after the write ended.
        name: finish
        recv: c *chainStore[V]
      - doc: Set writes far-to-near and stops at the first failure. See the type comment.
        name: Set
        params: ctx context.Context, key string, entry corecache.EntryValue[V]
        recv: c *chainStore[V]
        results: error
      - doc: |-
          Delete removes key from EVERY tier, far-to-near, and does not stop at the
          first failure. See the type comment for why near-first would be worse.
        name: Delete
        params: ctx context.Context, key string
        recv: c *chainStore[V]
        results: error
      - doc: |-
          InvalidateTag invalidates in every tier, far-to-near, and reports the total.

          The total counts REMOVALS, not distinct keys: an entry present in two tiers
          counts twice. Deduplicating would require the chain to know which keys each
          tier dropped, which is a list no tier returns — and a number that is quietly
          approximate is worse than one whose unit is stated.
        name: InvalidateTag
        params: ctx context.Context, tag string
        recv: c *chainStore[V]
        results: removed int, err error
      - doc: |-
          Load fills a chain miss once per key per process, writing through every
          tier. It does NOT coordinate across replicas — see [corecache.Loader].
        name: Load
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: c *chainStore[V]
        results: value V, err error
      - doc: fillOnce is the body of the deduplicated chain fill.
        name: fillOnce
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: c *chainStore[V]
        results: value V, err error
      - doc: |-
          fillAndSet runs fill and writes its entry through every tier. A failed
          fill stores nothing, in any tier.
        name: fillAndSet
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: c *chainStore[V]
        results: value V, err error
      - doc: |-
          Expire sweeps every tier that implements [corecache.Expirer], far to near,
          and reports the total of removals — an entry expired in two tiers counts
          twice, as InvalidateTag counts it (#1059). A tier without the sibling is
          skipped: its expiry stays lazy. Every tier is attempted even after a
          failure.
        name: Expire
        params: ctx context.Context
        recv: c *chainStore[V]
        results: removed int, err error
      - doc: |-
          FetchMany reads near to far with the missing set shrinking (#840): each
          tier gets ONE pass, over the keys no nearer tier held, and the hits of a far
          tier are promoted into every nearer one as a batch, under the same write
          guard a single promotion takes (#460). A broken tier stops the walk, as it
          stops Fetch's.
        name: FetchMany
        params: ctx context.Context, keys []string
        recv: c *chainStore[V]
        results: map[string]V, error
      - doc: |-
          promoteMany writes a far tier's hits into every nearer tier, as promote
          writes one: nothing when a write is running or began since seen was read.
        name: promoteMany
        params: ctx context.Context, hits map[string]corecache.EntryValue[V], found int, seen uint64
        recv: c *chainStore[V]
      - doc: |-
          SetMany writes every entry far to near (#840). Every entry is validated
          first: one any store would refuse fails the call and nothing is written. A
          tier's failure stops the walk, as Set's does, and the nearer tiers keep
          what they had.
        name: SetMany
        params: ctx context.Context, entries map[string]corecache.EntryValue[V]
        recv: c *chainStore[V]
        results: error
      - doc: |-
          LoadRefreshing is Load with refresh-ahead (#838): a hit whose remaining
          lifetime is below before is returned at once and ONE background fill per
          key writes through every tier. A chain keeps no negative entry — a tier has
          no way to store one — so a fill answering corecache.Absent is returned and
          nothing is stored.
        name: LoadRefreshing
        params: ctx context.Context, key string, fill corecache.Fill[V], before time.Duration
        recv: c *chainStore[V]
        results: value V, err error
      - doc: |-
          claimRefresh records that a refresh of key is starting and reports whether
          none was running.
        name: claimRefresh
        params: key string
        recv: c *chainStore[V]
        results: bool
      - doc: |-
          refresh is the chain's background fill: bounded by the entry's remaining
          lifetime, written through every tier as Set writes, nothing stored on a
          failure.
        name: refresh
        params: ctx context.Context, key string, fill corecache.Fill[V], left time.Duration
        recv: c *chainStore[V]
      - doc: releaseRefresh forgets the running refresh of key.
        name: releaseRefresh
        params: key string
        recv: c *chainStore[V]
      - doc: |-
          LoadLeased is Load with a cross-process lease (#830): a process waiting on
          another's lease reads the chain again every step, so a tier both reach
          answers it with the holder's value. See [corecache.Leaser].
        name: LoadLeased
        params: ctx context.Context, key string, fill corecache.Fill[V], locker corelock.Locker
        recv: c *chainStore[V]
        results: value V, err error
    name: chainStore
    typeParams: V any
  - fields:
      - doc: |-
          OnPromoteError, if non-nil, is called when a value served from a FAR
          tier could not be written into a nearer one.

          A failed promotion is not a failed read: the caller already has the
          value, and failing the call would turn a degraded cache into a degraded
          service. But it is also not nothing — a near tier that rejects every
          promotion is a tier that will never be used again, and with this hook nil
          that is completely invisible. Wire it.
        name: OnPromoteError
        type: func(key string, err error)
      - doc: |-
          Clock is what LoadLeased waits on between two reads while another
          process holds a key's lease. nil means clock.System. Nothing else in
          the chain reads time: every tier keeps its own clock.
        name: Clock
        type: clock.Timed
      - doc: |-
          LeasePoll is how often LoadLeased reads the chain again while another
          process holds a key's lease. 0 means 25ms, the file locker's own poll;
          negative is refused.
        name: LeasePoll
        type: time.Duration
    kind: struct
    name: ChainConfig
  - fields:
      - doc: |-
          MaxEntries caps the live entry count; the least-recently-used entry is
          evicted above it. It MUST be positive.
        name: MaxEntries
        type: int
      - doc: |-
          DefaultTTL applies to every entry whose own TTL is zero. Zero means the
          default is "no deadline", so entries leave only by eviction, by Delete,
          or by tag invalidation. Negative is refused.
        name: DefaultTTL
        type: time.Duration
      - doc: |-
          Clock is the time source, injectable so TTL is testable. nil means
          clock.System. Only the reading half of the port is required — a cache
          reads time (ADR 0039); LoadLeased alone waits, on Clock when it can wait
          (clock.System, a clock.ManualClock) and on clock.System otherwise. A
          clock.CoarseClock makes a TTL'd hit's clock read an atomic load, and
          every expiry late by up to its resolution.
        name: Clock
        type: clock.Clock
      - doc: |-
          Stripes splits the store into independent stripes, each with its own
          lock, its own share of MaxEntries and MaxBytes and its own tag index, so
          goroutines working on keys of different stripes never wait for one
          another. 0 means 1, one store as before; above MaxEntries (or a positive
          MaxBytes) it is held there, and above 1024 at 1024. Negative is refused.
        name: Stripes
        type: int
      - doc: |-
          MaxBytes bounds the summed weight of the live values, as measured by the
          weigher handed to [NewWeighedMemory]; entries are evicted above it as
          above MaxEntries, both bounds applying. 0 means no byte bound. An entry
          heavier than one stripe's share of it is refused with
          CACHE_ENTRY_REJECTED at Set. Negative is refused, and so is a positive
          MaxBytes given to [NewMemory], which has no weigher to measure it with.
        name: MaxBytes
        type: int64
      - doc: |-
          Policy is the eviction policy: least recently used (the zero), or
          S3-FIFO, which keeps a hot set through a scan.
        name: Policy
        type: kcache.Policy
      - doc: |-
          LeasePoll is how often LoadLeased reads the store again while another
          process holds a key's lease. 0 means 25ms, the file locker's own poll;
          negative is refused.
        name: LeasePoll
        type: time.Duration
    kind: struct
    methods:
      - doc: |-
          validate applies ADR 0031 to the configuration: refuse what the SDK cannot
          choose on the caller's behalf, and reinterpret nothing.
        name: validate
        recv: c MemoryConfig
        results: error
      - doc: |-
          stripeCount resolves Stripes: 0 is 1, and the count never exceeds the
          entries nor the bytes — every stripe holds at least one of each bound, a
          zero share reading as no bound — nor maxStripes.
        name: stripeCount
        recv: c MemoryConfig
        results: int
      - doc: clockOrSystem resolves the configured time source.
        name: clockOrSystem
        recv: c MemoryConfig
        results: clock.Clock
    name: MemoryConfig
  - doc: |-
      leased is one LoadLeased miss, after the in-process collapse: what to read,
      how to fill, and how to wait between two reads (#830).
    fields:
      - name: locker
        type: corelock.Locker
      - name: waiter
        type: clock.Waiter
      - name: poll
        type: time.Duration
      - doc: |-
          lookup reads the store: found is a hit, err a hit's own answer (a
          negative entry) or a read that failed.
        name: lookup
        type: func(ctx context.Context) (value V, found bool, err error)
      - doc: fill runs the caller's fill and stores what it answered.
        name: fill
        type: func(ctx context.Context) (value V, err error)
    kind: struct
    methods:
      - doc: |-
          run takes the key's lease, or waits for whoever holds it.

          A process that finds the lease held fills nothing: it waits one step, reads
          the store again — the holder's value may have landed in a tier both share —
          and tries the lease once more, which succeeds only once the holder released
          it, died, or let an expiring lease lapse. Whoever takes the lease reads
          again before filling, so a value stored just before the release is never
          filled twice.
        name: run
        params: ctx context.Context, key string
        recv: l leased[V]
        results: value V, err error
      - doc: read is lookup with its results ordered for run's test.
        name: read
        params: ctx context.Context
        recv: l leased[V]
        results: found bool, value V, err error
      - doc: |-
          holding runs under the lease: one more read, then the fill. The lease is
          released whatever happens — a failed fill, a panic, a ctx already ended —
          on a context that cannot be cancelled, since a lease left behind keeps
          every other process waiting until it dies.
        name: holding
        params: ctx context.Context, key string, lease corelock.Lease
        recv: l leased[V]
        results: value V, err error
      - doc: wait blocks one poll step on the waiter, or until ctx ends.
        name: wait
        params: ctx context.Context
        recv: l leased[V]
        results: error
    name: leased
    typeParams: V any
  - doc: |-
      memoryStore is the in-process store: one or more stripes, each the kernel
      primitive and a tag index under a mutex of its own, and a singleflight group
      in front of the fill path.

      # One mutex per stripe, taken for reads too

      A key lives in exactly one stripe, picked by a seeded hash of the key, and
      everything that stripe holds is under its own sync.Mutex, which Fetch takes
      exclusively. That is not an oversight: the primitive's own Fetch already
      takes a WRITE lock, because a hit moves the entry and counters, so there was
      never a shared-read path to lose. Serialising the stripe's tag index on the
      SAME lock is what makes the index and the entries agree at every observable
      moment — with two locks, a key would be briefly live but unindexed, and an
      InvalidateTag crossing that window would report success while leaving the
      entry fetchable. The argument holds per stripe because a key is in one.
      Operations on keys of different stripes never wait for each other (#808).

      # onEvict must never lock

      The primitive calls OnEvict after releasing its own lock, but still on the
      caller's goroutine — the goroutine that is inside one of the methods below,
      holding the stripe's mutex. A callback that took it would deadlock outright,
      sync.Mutex not being reentrant. So onEvict only APPENDS to the stripe's
      evicted, a field that is by construction reachable solely while that mutex
      is held, and the surrounding method drains it. The invariant is short and
      must stay that way: no path into a primitive runs without its stripe's
      mutex, and onEvict takes no lock.
    fields:
      - name: stripes
        type: "[]*memoryStripe[V]"
      - doc: seed keys the hash that picks a key's stripe.
        name: seed
        type: maphash.Seed
      - name: clk
        type: clock.Clock
      - doc: ": defaultTTL is applied to an entry whose own TTL is zero."
        name: defaultTTL
        type: time.Duration
      - doc: |-
          weigh measures a value against MaxBytes; nil when the store bounds no
          bytes.
        name: weigh
        type: func(value V) int64
      - doc: "maxWeight is one stripe's share of MaxBytes: an entry heavier is refused."
        name: maxWeight
        type: int64
      - doc: ": group collapses concurrent Load misses on one key into one fill."
        name: group
        type: singleflight.Group[string, V]
      - doc: |-
          waiter is what LoadLeased waits on between two reads (#830): clk when
          it can wait, the system clock otherwise.
        name: waiter
        type: clock.Waiter
      - doc: leasePoll is LoadLeased's step while another process holds the lease.
        name: leasePoll
        type: time.Duration
    kind: struct
    methods:
      - doc: |-
          LoadLeased is Load with a cross-process lease (#830). See
          [corecache.Leaser]: on a memory store alone, another process never sees
          this one's value, so the lease only takes turns.
        name: LoadLeased
        params: ctx context.Context, key string, fill corecache.Fill[V], locker corelock.Locker
        recv: s *memoryStore[V]
        results: value V, err error
      - doc: newStripe builds one stripe over a primitive bounded by entries and bytes.
        name: newStripe
        params: cfg MemoryConfig, entries int, bytes int64
        recv: s *memoryStore[V]
        results: "*memoryStripe[V]"
      - doc: |-
          absentWeight is what a negative entry counts against MaxBytes: one unit,
          the least that still counts it, when the store bounds bytes.
        name: absentWeight
        recv: s *memoryStore[V]
        results: int64
      - doc: "weightOf is the primitive's WeightOf: the weight Set measured, once."
        name: weightOf
        params: _ string, rec record[V]
        recv: s *memoryStore[V]
        results: int64
      - doc: stripeOf returns the stripe key lives in.
        name: stripeOf
        params: key string
        recv: s *memoryStore[V]
        results: "*memoryStripe[V]"
      - doc: |-
          Fetch returns the value under key. It MUTATES the store — recency, counters,
          lazy expiry — which is why the verb is Fetch.

          ctx is unnamed on purpose: this store never blocks, so there is no point at
          which a cancellation could be honoured, and consulting ctx would be a check
          that can only ever pass. The parameter stays because the PORT needs it for
          tiers that do block.
        name: Fetch
        params: _ context.Context, key string
        recv: s *memoryStore[V]
        results: value V, found bool, err error
      - doc: |-
          FetchEntry returns the whole entry, with the REMAINING lifetime rather than
          the one originally supplied. See [record] for why that distinction matters.
        name: FetchEntry
        params: _ context.Context, key string
        recv: s *memoryStore[V]
        results: entry corecache.EntryValue[V], found bool, err error
      - doc: entryOf turns a record into the entry a caller may hand back to Set.
        name: entryOf
        params: rec record[V]
        recv: s *memoryStore[V]
        results: corecache.EntryValue[V]
      - doc: |-
          remaining converts a stored deadline into a TTL a caller can hand back to
          Set. Caller holds nothing — it only reads the clock.
        name: remaining
        params: rec record[V]
        recv: s *memoryStore[V]
        results: time.Duration
      - doc: |-
          fetchRecord reads one key under its stripe's lock. The lock is released
          by hand rather than deferred: this is every read's path, and nothing
          between the two calls can panic short of a broken primitive.
        name: fetchRecord
        params: key string
        recv: s *memoryStore[V]
        results: rec record[V], found bool
      - doc: |-
          Set stores entry under key. An entry the store cannot represent is REFUSED
          rather than reinterpreted — see [validateEntry] — and so is one heavier than
          a stripe's share of MaxBytes.
        name: Set
        params: _ context.Context, key string, entry corecache.EntryValue[V]
        recv: s *memoryStore[V]
        results: error
      - doc: |-
          validate is validateEntry plus the byte bound, and returns the entry's
          weight: an entry heavier than one stripe's share of MaxBytes would evict
          every other entry of its stripe and still overrun the bound, so it is
          refused. The weigher runs once per write, here.
        name: validate
        params: key string, entry corecache.EntryValue[V]
        recv: s *memoryStore[V]
        results: weight int64, err error
      - doc: |-
          store writes rec under key into stripe, its deadline from ttl. Caller holds
          stripe.mu and has validated the entry; rec.tags is the caller's slice.
        name: store
        params: stripe *memoryStripe[V], key string, rec record[V], ttl time.Duration
        recv: s *memoryStore[V]
      - doc: "Delete removes key. Idempotent: a key that names nothing reports nil."
        name: Delete
        params: _ context.Context, key string
        recv: s *memoryStore[V]
        results: error
      - doc: |-
          InvalidateTag removes every entry carrying tag.

          The cost is O(k) in the entries carrying the tag plus O(T) per entry in that
          entry's own tags — NOT O(N) in the store. See `tagindex.go` for why the
          reverse index exists and `BENCH.md` for the measurement at two store sizes.
          A striped store walks every stripe, one lock at a time.

          removed counts entries dropped from the store. An entry whose TTL had passed
          but which nothing had yet touched is counted: expiry is lazy, so such an
          entry still occupies capacity, and removing it is a removal.
        name: InvalidateTag
        params: _ context.Context, tag string
        recv: s *memoryStore[V]
        results: removed int, err error
      - doc: |-
          Expire removes every entry whose deadline has passed, negative entries
          included, from every stripe, one lock at a time, and reports how many
          (#1059). The store starts no goroutine: a caller schedules it on its own
          ticker or scheduler. The tag index is drained of each removed key as
          eviction drains it.
        name: Expire
        params: _ context.Context
        recv: s *memoryStore[V]
        results: removed int, err error
      - doc: |-
          Load returns the value for key, running fill at most once across all
          concurrent callers of this key IN THIS PROCESS. It does NOT coordinate
          across replicas — see [corecache.Loader]. A negative entry (#838) answers
          with the error its fill marked [corecache.Absent], and no fill runs.
        name: Load
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: s *memoryStore[V]
        results: value V, err error
      - doc: "fillOnce is the body of the deduplicated call: re-check, fill, store."
        name: fillOnce
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: s *memoryStore[V]
        results: value V, err error
      - doc: |-
          fillAndStore runs fill and stores what it answered: a value, or — for a
          failure marked corecache.Absent with a positive lifetime — a negative
          entry. Any other failure stores NOTHING: caching a failure turns one bad
          minute at the origin into a full TTL of confident wrong answers.
        name: fillAndStore
        params: ctx context.Context, key string, fill corecache.Fill[V]
        recv: s *memoryStore[V]
        results: value V, err error
      - doc: |-
          FetchMany returns the values of the keys the store holds (#840): the keys
          are grouped by stripe and each stripe is locked once for all of its keys,
          where N Fetches lock N times. It mutates the store as Fetch does; a
          negative entry is a miss; a duplicate key is read once.
        name: FetchMany
        params: _ context.Context, keys []string
        recv: s *memoryStore[V]
        results: map[string]V, error
      - doc: |-
          groupByStripe splits keys by the stripe each lands in, indexed like
          s.stripes.
        name: groupByStripe
        params: keys []string
        recv: s *memoryStore[V]
        results: "[][]string"
      - doc: |-
          SetMany stores every entry under its key (#840). Every entry is validated
          first: one the store refuses fails the call and stores nothing. Each stripe
          is then locked once for all of its entries.
        name: SetMany
        params: _ context.Context, entries map[string]corecache.EntryValue[V]
        recv: s *memoryStore[V]
        results: error
      - doc: setInto stores keys' entries into stripe under one acquisition of its lock.
        name: setInto
        params: stripe *memoryStripe[V], keys []string, entries map[string]corecache.EntryValue[V], weights map[string]int64
        recv: s *memoryStore[V]
      - doc: stripeIndex returns the index of the stripe key lands in.
        name: stripeIndex
        params: key string
        recv: s *memoryStore[V]
        results: int
      - doc: |-
          LoadRefreshing is Load with refresh-ahead (#838): a hit whose remaining
          lifetime is below before is returned at once, and ONE background fill per
          key replaces it while it is still valid. See [corecache.Refresher].
        name: LoadRefreshing
        params: ctx context.Context, key string, fill corecache.Fill[V], before time.Duration
        recv: s *memoryStore[V]
        results: value V, err error
      - doc: |-
          refresh is the background fill: on the caller's context values without its
          cancellation, bounded by the entry's remaining lifetime, its answer stored
          as Load stores one. A failure that is not an answer stores nothing: the old
          entry is served until it expires.
        name: refresh
        params: ctx context.Context, stripe *memoryStripe[V], key string, fill corecache.Fill[V], left time.Duration
        recv: s *memoryStore[V]
    name: memoryStore
    typeParams: V any
  - doc: "memoryStripe is one stripe: a primitive, its tag index, and their mutex."
    fields:
      - name: mu
        type: sync.Mutex
      - name: lru
        type: "*kcache.Cache[string, record[V]]"
      - name: tags
        type: "*tagIndex"
      - doc: |-
          : evicted collects the keys the primitive dropped during the call in
          : progress. Guarded by mu; see the memoryStore type comment.
        name: evicted
        type: "[]string"
      - doc: |-
          : refreshing holds the keys a background refresh is running for (#838).
          : Guarded by mu.
        name: refreshing
        type: map[string]struct{}
    kind: struct
    methods:
      - doc: |-
          onEvict records a key the primitive dropped by capacity or expiry. It takes
          NO lock — see the memoryStore type comment.
        name: onEvict
        params: key string, _ record[V]
        recv: m *memoryStripe[V]
      - doc: |-
          drainEvicted unlinks every key the primitive just dropped from the tag
          index. Caller holds mu.
        name: drainEvicted
        recv: m *memoryStripe[V]
      - doc: fetch is the one place a stripe's primitive is read. Caller holds mu.
        name: fetch
        params: key string
        recv: m *memoryStripe[V]
        results: rec record[V], found bool
      - doc: invalidate drops the stripe's keys carrying tag and reports how many.
        name: invalidate
        params: tag string
        recv: m *memoryStripe[V]
        results: int
      - doc: expire sweeps one stripe.
        name: expire
        recv: m *memoryStripe[V]
        results: int
      - doc: |-
          fetchInto reads keys under one acquisition of the stripe's lock, adding each
          live value to found.
        name: fetchInto
        params: found map[string]V, keys []string
        recv: m *memoryStripe[V]
      - doc: |-
          claimRefresh records that a refresh of key is starting and reports whether
          none was running. Caller holds mu.
        name: claimRefresh
        params: key string
        recv: m *memoryStripe[V]
        results: bool
      - doc: releaseRefresh forgets the running refresh of key.
        name: releaseRefresh
        params: key string
        recv: m *memoryStripe[V]
    name: memoryStripe
    typeParams: V any
  - doc: |-
      record is the value the kernel primitive holds: the caller's payload plus the
      things the primitive has no concept of.

      expireAt is duplicated here even though the primitive tracks its own TTL,
      because FetchEntry must report the REMAINING lifetime and the primitive does
      not expose it. Promoting an entry between tiers with its ORIGINAL TTL would
      refresh it on every move, so an entry that keeps being promoted would never
      expire — a cache that cannot be emptied by time.

      tags is the SAME slice the tag index owns, not a copy: one slice means the
      entry and its index entry can never disagree, and the caller's own slice
      never reaches in.

      absent is non-nil for a NEGATIVE entry (#838): a fill answered with
      corecache.Absent, and the store keeps that answer instead of a value. Fetch
      reports it as a miss; Load returns it without calling a fill.
    fields:
      - name: value
        type: V
      - name: expireAt
        type: time.Time
      - name: tags
        type: "[]string"
      - name: absent
        type: error
      - doc: |-
          weight is what the record counts against MaxBytes, measured once at
          Set; 0 when the store bounds no bytes.
        name: weight
        type: int64
    kind: struct
    name: record
    typeParams: V any
  - doc: |-
      tagIndex maps tags to the keys carrying them, and back.

      # Why two maps and not one

      The naive tag invalidation walks the whole cache and drops every entry whose
      tag list contains the tag. That is O(N) in the STORE size for an operation
      whose result is usually a handful of entries, and it puts a full scan under
      the store's write lock — so a 100 000-entry cache stalls every reader to
      delete three things.

      byTag answers "which keys carry this tag" in one map lookup, so an
      invalidation costs O(k) in the keys that actually carry the tag.

      byKey exists only to keep byTag honest. Without it, an entry evicted by the
      LRU or expired by TTL would leave its key in every one of its tag buckets
      forever: the buckets would grow without bound, and an invalidation would
      spend its time deleting keys that no longer exist. byKey is what makes
      removal O(T) in that key's own tags instead of O(number of tags in the
      store).

      # What it costs

      Per tagged key: one byKey entry — a string header (16 B) plus a slice header
      (24 B) plus 16 B per tag — and one byTag inner-map entry per (tag, key) pair.
      With Go's map overhead that lands near 100 B per key plus roughly 70 B per
      (tag, key) pair on amd64. The tag TEXT is not duplicated: Go strings are
      immutable, so both maps hold headers pointing at one backing array.
      internal/service/data/cache/BENCH.md measures the difference between a tagged and
      an untagged Set rather than leaving the estimate unchecked.

      Not safe for concurrent use: every method is called with the owning store's
      mutex held.
    fields:
      - name: byKey
        type: map[string][]string
      - name: byTag
        type: map[string]map[string]struct{}
    kind: struct
    methods:
      - doc: |-
          add indexes key under tags, replacing whatever tags key had before, and
          returns the deduplicated copy the index now owns.

          The copy is not politeness: the caller's slice is theirs to reuse or mutate
          after Set returns, and the store keeps this one instead so an entry and its
          index entry are literally the same slice.
        name: add
        params: key string, tags []string
        recv: t *tagIndex
        results: "[]string"
      - doc: |-
          remove unlinks key from every tag it carried. It is the operation that keeps
          the reverse index from growing without bound, so it MUST be called on every
          path that drops an entry: Delete, overwrite, LRU eviction and TTL expiry.
        name: remove
        params: key string
        recv: t *tagIndex
      - doc: |-
          keysFor returns the keys carrying tag, as a fresh slice.

          The copy is not defensive politeness: the caller deletes each key, which
          mutates the very bucket it would otherwise be ranging over.
        name: keysFor
        params: tag string
        recv: t *tagIndex
        results: "[]string"
    name: tagIndex
  - doc: |-
      tier is one level of a chain, resolved to the three interfaces a tier must
      answer. Resolving them ONCE at construction is what keeps promotion faithful
      (see [corecache.CacheChainMisconfigured]) and keeps the read path free of
      repeated type assertions.
    fields:
      - name: store
        type: corecache.Store[V]
      - name: entry
        type: corecache.EntryFetcher[V]
      - name: tags
        type: corecache.Tagger
    kind: struct
    name: tier
    typeParams: V any
vars:
  - doc: |-
      Compile-time assertions that both stores still answer every contract they
      claim. They matter more here than in most packages: NewMemory and NewChain
      return the PORT, and the three capabilities beyond it are reached by type
      assertion — so a sibling silently dropped would not fail to compile anywhere
      and would not fail at run time either. It would take the caller's `ok ==
      false` branch, which is written as the graceful fallback. A cache that
      quietly stops being invalidatable is exactly the defect ADR 0049 spends its
      tag section preventing.

      Collecting them also makes the set greppable: every type that must satisfy a
      port is named here, so a port that quietly lost an implementation is one diff
      away from being visible.
    grouped: true
    items:
      - name: _
        type: corecache.Store[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.EntryFetcher[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Tagger
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Loader[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Store[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.EntryFetcher[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.Tagger
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.Loader[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.Expirer
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.BulkFetcher[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.BulkSetter[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Refresher[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Expirer
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.BulkFetcher[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.BulkSetter[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.Refresher[struct{}]
        value: (*chainStore[struct{}])(nil)
      - name: _
        type: corecache.Leaser[struct{}]
        value: (*memoryStore[struct{}])(nil)
      - name: _
        type: corecache.Leaser[struct{}]
        value: (*chainStore[struct{}])(nil)
    name: _
