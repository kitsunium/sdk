apiVersion: design/behaviour/v1
constants:
  - doc: |-
      minChainTiers is the smallest tier count that makes a chain mean anything.
      One tier is the tier itself wearing an extra layer of indirection, so
      building it is far more likely to be a mistake than an intention.
    items:
      - name: minChainTiers
        type: int
        value: "2"
    name: minChainTiers
  - doc: |-
      maxStripes caps MemoryConfig.Stripes: past it, the stripes cost more memory
      and walk time (InvalidateTag, Expire) than any core count can win back.
    items:
      - name: maxStripes
        type: int
        value: "1024"
    name: maxStripes
  - doc: |-
      defaultLeasePoll is the step a process waiting on another's lease reads the
      store again at when the configuration says nothing: the file locker's own
      poll, so waiting for a lease and waiting for its value keep one cadence.
    items:
      - name: defaultLeasePoll
        type: time.Duration
        value: 25 * time.Millisecond
    name: defaultLeasePoll
  - doc: |-
      leasePrefix opens every lock name a fill is leased under, so a cache's
      leases never share a name with another user of the same locker.
    items:
      - name: leasePrefix
        type: string
        value: "\"cache:\""
    name: leasePrefix
  - doc: |-
      initialIndexCapacity pre-sizes both index maps and each tag bucket. It is a
      hint, not a bound: a store with no tagged entry must not pay for a large
      allocation, and one with many grows past it in a handful of doublings.
    items:
      - name: initialIndexCapacity
        type: int
        value: "16"
    name: initialIndexCapacity
