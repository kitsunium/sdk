functions:
  - name: NewChain
    params: cfg ChainConfig, stores ...corecache.Store[V]
    results: chain corecache.Store[V], err error
    typeParams: V any
  - doc: newTier checks that store answers the whole tier contract.
    name: newTier
    params: position int, store corecache.Store[V]
    results: built tier[V], err error
    typeParams: V any
  - doc: chainRefusal builds the construction-time refusal for one tier.
    name: chainRefusal
    params: position int, problem string
    results: error
  - doc: |-
      tierFailure labels a tier's error with its position and the operation.

      An untyped cause is labelled AND kept, the rule fillFailure follows: it used
      to survive only as a string field, so a tier returning a backend's own
      sentinel came back as an error for which errors.Is on that sentinel was
      false. A typed cause still yields CACHE_TIER_FAILED as the code — the
      position is the information the caller cannot reconstruct — which wrapping
      it would lose to origin-wins, so it keeps travelling as fields. "Typed" is
      decided by errors.AsType, the test Wrap itself makes: a direct assertion
      missed an *errs.Error behind fmt.Errorf's %w, and Wrap then found it and
      handed it the verdict.
    name: tierFailure
    params: position int, operation, key string, cause error
    results: error
  - name: NewMemory
    params: cfg MemoryConfig
    results: store corecache.Store[V], err error
    typeParams: V any
  - doc: |-
      validateEntry rejects an entry no store can represent and returns the TTL to
      hand the underlying primitive (0 = no deadline).

      The three refusals are each the ADR 0031 "refuse" half applied to an
      OPERATION rather than to a constructor: none of them has a sensible reading,
      and every one of them would produce an entry the caller can never
      deliberately reach again.

      A key or a tag reaching an error FIELD reaches the operator's LOG. Fields
      are log-only and never rendered by Error() (ADR 0005 §4), but a caller who
      puts a secret in a cache key has put that secret in their logs, and this is
      the place that says so.
    name: validateEntry
    params: key string, entry corecache.EntryValue[V]
    results: error
    typeParams: V any
  - doc: |-
      primitiveTTL maps the domain's three TTL meanings onto the kernel
      primitive's two ("0 = forever", "positive = this long"). storeDefault is the
      store's own DefaultTTL, itself already validated as non-negative.
    name: primitiveTTL
    params: ttl, storeDefault time.Duration
    results: time.Duration
  - doc: rejected builds the CACHE_ENTRY_REJECTED refusal, naming the offending part.
    name: rejected
    params: part, problem, key string
    results: error
  - doc: |-
      fillFailure labels a caller's failed fill — unless it already carries an SDK
      code, in which case it propagates untouched.

      Relabelling a typed error would discard the origin's own diagnosis and
      replace it with the generic one, which is precisely the trade ADR 0005
      §"origin wins" refuses. It is the same normalisation config.Load performs at
      its Source boundary, and for the same reason: Fill is caller code, so the
      error can be anything.

      An untyped cause is labelled AND kept. It used to survive only as a string
      field, so a fill returning sql.ErrNoRows came back as an error for which
      errors.Is(err, sql.ErrNoRows) was false — the caller's own "not found" was
      indistinguishable from an outage. Wrapping the cause itself keeps both
      answers: errs.HasCode sees CACHE_FILL_FAILED, errors.Is sees the cause.
    name: fillFailure
    params: key string, cause error
    results: error
  - doc: newTagIndex builds an empty index.
    name: newTagIndex
    results: "*tagIndex"
