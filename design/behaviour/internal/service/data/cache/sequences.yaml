      - return: found, value, err
  - of: leased.holding
    participants:
      - id: caller
        kind: actor
      - id: leased.holding
        kind: self
      - id: l.read
        kind: internal
    steps:
      - defer: |-
          func() {
          		releaseErr := lease.Release(context.WithoutCancel(ctx))
          		//: the call's own failure says more than the release's.
          		if releaseErr != nil && err == nil {
          			var zero V
          			value, err = zero, leaseFailure("release", key, releaseErr)
          		}
          	}()
      - opt:
          do:
            - return: hit, lookErr
          init:
            bind: found, hit, lookErr
            eval: l.read(ctx)
            to: l.read
          when: found || lookErr != nil
      - return: l.fill(ctx)
  - of: leased.wait
    participants:
      - id: caller
        kind: actor
      - id: leased.wait
        kind: self
      - id: l.waiter.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: ctx.Err
        kind: value
    steps:
      - bind: timer
        eval: l.waiter.NewTimer(l.poll)
        to: l.waiter.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: ctx.Err()
                  to: ctx.Err
            - comm: <-timer.C()
              do:
                - return: nil
  - of: waiterOf
    steps:
      - opt:
          do:
            - return: waiter
          init:
            bind: waiter, ok
            eval: clk.(clock.Waiter)
          when: ok
      - return: clock.System
  - of: pollOrDefault
    steps:
      - opt:
          do:
            - return: defaultLeasePoll
          when: poll == 0
      - return: poll
  - of: (*memoryStore).LoadLeased
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).LoadLeased
        kind: self
      - id: s.Load
        kind: internal
      - id: s.fetchRecord
        kind: internal
      - id: s.group.Do
        kind: value
    steps:
      - opt:
          do:
            - return: s.Load(ctx, key, fill)
              to: s.Load
          when: locker == nil
      - opt:
          do:
            - return: rec.value, rec.absent
          init:
            bind: rec, ok
            eval: s.fetchRecord(key)
            to: s.fetchRecord
          when: ok
      - bind: filled, _, groupErr
        eval: |-
          s.group.Do(ctx, key, func(callCtx context.Context) (V, error) {
          		//: one goroutine per key in this process; then the lease.
          		return leased[V]{
          			locker: locker,
          			waiter: s.waiter,
          			poll:   s.leasePoll,
          			lookup: func(context.Context) (V, bool, error) {
          				rec, ok := s.fetchRecord(key)
          				//: a negative entry is found, its error the answer.
          				return rec.value, ok, rec.absent
          			},
          			fill: func(fillCtx context.Context) (V, error) {
          				//: stored as Load stores, a negative answer included.
          				return s.fillAndStore(fillCtx, key, fill)
          			},
          		}.run(callCtx, key)
          	})
        to: s.group.Do
      - return: filled, groupErr
  - of: (*chainStore).LoadLeased
    participants:
      - id: caller
        kind: actor
      - id: (*chainStore).LoadLeased
        kind: self
      - id: c.Load
        kind: internal
      - id: c.Fetch
        kind: internal
      - id: c.group.Do
        kind: value
    steps:
      - opt:
          do:
            - return: c.Load(ctx, key, fill)
              to: c.Load
          when: locker == nil
      - opt:
          do:
            - return: hit, nil
          init:
            bind: hit, ok, fetchErr
            eval: c.Fetch(ctx, key)
            to: c.Fetch
          when: fetchErr == nil && ok
      - bind: filled, _, groupErr
        eval: |-
          c.group.Do(ctx, key, func(callCtx context.Context) (V, error) {
          		//: one goroutine per key in this process; then the lease.
          		return leased[V]{
          			locker: locker,
          			waiter: c.waiter,
          			poll:   c.leasePoll,
          			lookup: func(lookCtx context.Context) (V, bool, error) {
          				hit, ok, fetchErr := c.Fetch(lookCtx, key)
          				//: a failing tier reads as a miss, as Load reads it.
          				return hit, ok && fetchErr == nil, nil
          			},
          			fill: func(fillCtx context.Context) (V, error) {
          				//: write-through, as Load's fill.
          				return c.fillAndSet(fillCtx, key, fill)
          			},
          		}.run(callCtx, key)
          	})
        to: c.group.Do
      - return: filled, groupErr
  - of: leaseFailure
    participants:
      - id: caller
        kind: actor
      - id: leaseFailure
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: fields
        eval: |-
          []kerrs.FieldValue{
          		kerrs.String("operation", operation),
          		kerrs.String("key", key),
          		kerrs.String("cause", cause.Error()),
          	}
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corecache.CacheLeaseFailed, kerrs.WrapParams{},
                			append(fields, kerrs.String("cause_code", typedErr.Code().String()))...)
              to: kerrs
          init:
            bind: typedErr, typed
            eval: errors.AsType[*kerrs.Error](cause)
          when: typed
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:    corecache.CacheLeaseFailed.Code(),
          		Reason:  corecache.CacheLeaseFailed.Reason(),
          		Public:  corecache.CacheLeaseFailed.Public(),
          		Private: corecache.CacheLeaseFailed.Private(),
          	}, fields...)
        to: kerrs
  - of: NewMemory
    participants:
      - id: caller
        kind: actor
      - id: NewMemory
        kind: self
      - id: newMemory
        kind: internal
    steps:
      - opt:
          do:
            - return: "nil, misconfigured(\"MaxBytes\", kerrs.Int64(\"value\", cfg.MaxBytes), kerrs.String(\"problem\", \"no weigher: use NewWeighedMemory\"))"
          when: cfg.MaxBytes > 0
      - return: newMemory[V](cfg, nil)
        to: newMemory
  - of: NewWeighedMemory
    participants:
      - id: caller
        kind: actor
      - id: NewWeighedMemory
        kind: self
      - id: newMemory
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, misconfigured("MaxBytes", kerrs.Int64("value", cfg.MaxBytes), kerrs.Bool("weigh", weigh != nil))
          when: weigh == nil || cfg.MaxBytes <= 0
      - return: newMemory(cfg, weigh)
        to: newMemory
  - of: newMemory
    participants:
      - id: caller
        kind: actor
      - id: newMemory
        kind: self
      - id: cfg.validate
        kind: internal
      - id: cfg.stripeCount
        kind: internal
      - id: waiterOf
        kind: internal
      - id: built.newStripe
        kind: internal
      - id: shareOf64
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, cfgErr
          init:
            bind: cfgErr
            eval: cfg.validate()
            to: cfg.validate
          when: cfgErr != nil
      - bind: count
        eval: cfg.stripeCount()
        to: cfg.stripeCount
      - bind: built
        eval: |-
          &memoryStore[V]{
          		stripes:    make([]*memoryStripe[V], count),
          		seed:       maphash.MakeSeed(),
          		clk:        cfg.clockOrSystem(),
          		defaultTTL: cfg.DefaultTTL,
          		weigh:      weigh,
          		leasePoll:  pollOrDefault(cfg.LeasePoll),
          	}
      - set: built.waiter
        to: waiterOf
        value: waiterOf(built.clk)
      - loop:
          do:
            - set: built.stripes[at]
              to: built.newStripe
              value: built.newStripe(cfg, shareOf(cfg.MaxEntries, count, at), shareOf64(cfg.MaxBytes, count, at))
          key: at
          range: built.stripes
      - set: built.maxWeight
        to: shareOf64
        value: shareOf64(cfg.MaxBytes, count, count-1)
      - return: built, nil
  - of: (*memoryStore).newStripe
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).newStripe
        kind: self
      - id: kcache
        kind: package
    steps:
      - bind: stripe
        eval: "&memoryStripe[V]{tags: newTagIndex()}"
      - bind: primitive
        eval: |-
          kcache.Config[string, record[V]]{
          		MaxEntries: entries,
          		Clock:      s.clk,
          		OnEvict:    stripe.onEvict,
          		Policy:     cfg.Policy,
          	}
      - opt:
          do:
            - set: primitive.MaxWeight
              value: bytes
            - set: primitive.WeightOf
              value: s.weightOf
          when: s.weigh != nil
      - set: stripe.lru
        to: kcache
        value: kcache.NewCache(primitive)
      - return: stripe
  - of: (*memoryStore).absentWeight
    steps:
      - opt:
          do:
            - return: "0"
          when: s.weigh == nil
      - return: "1"
  - of: (*memoryStore).weightOf
    steps:
      - return: rec.weight
  - of: (*memoryStore).stripeOf
    steps:
      - opt:
          do:
            - return: s.stripes[0]
          when: len(s.stripes) == 1
      - return: s.stripes[maphashString(s, key)%uint64(len(s.stripes))]
  - of: maphashString
    participants:
      - id: caller
        kind: actor
      - id: maphashString
        kind: self
      - id: maphash
        kind: stdlib
    steps:
      - return: maphash.String(s.seed, key)
        to: maphash
  - of: (*memoryStripe).onEvict
    steps:
      - set: m.evicted
        value: append(m.evicted, key)
  - of: (*memoryStripe).drainEvicted
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStripe).drainEvicted
        kind: self
      - id: m.tags.remove
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: len(m.evicted) == 0
      - loop:
          do:
            - eval: m.tags.remove(key)
              to: m.tags.remove
          key: _
          range: m.evicted
          value: key
      - set: m.evicted
        value: m.evicted[:0]
  - of: (*memoryStripe).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStripe).fetch
        kind: self
      - id: m.lru.Fetch
        kind: value
      - id: m.drainEvicted
        kind: internal
    steps:
      - bind: stored, ok
        eval: m.lru.Fetch(key)
        to: m.lru.Fetch
      - eval: m.drainEvicted()
        to: m.drainEvicted
      - return: stored, ok
  - of: (*memoryStore).Fetch
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Fetch
        kind: self
      - id: s.fetchRecord
        kind: internal
    steps:
      - bind: rec, ok
        eval: s.fetchRecord(key)
        to: s.fetchRecord
      - opt:
          do:
            - var:
                name: zero
                type: V
            - return: zero, false, nil
          when: "!ok || rec.absent != nil"
      - return: rec.value, true, nil
  - of: (*memoryStore).FetchEntry
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).FetchEntry
        kind: self
      - id: s.fetchRecord
        kind: internal
      - id: s.entryOf
        kind: internal
    steps:
      - bind: rec, ok
        eval: s.fetchRecord(key)
        to: s.fetchRecord
      - opt:
          do:
            - return: corecache.EntryValue[V]{}, false, nil
          when: "!ok || rec.absent != nil"
      - return: s.entryOf(rec), true, nil
        to: s.entryOf
  - of: (*memoryStore).entryOf
    steps:
      - return: "corecache.EntryValue[V]{Value: rec.value, TTL: s.remaining(rec), Tags: slices.Clone(rec.tags)}"
  - of: (*memoryStore).remaining
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).remaining
        kind: self
      - id: rec.expireAt.Sub
        kind: value
    steps:
      - opt:
          do:
            - return: corecache.NoExpiry
          when: rec.expireAt.IsZero()
      - bind: left
        eval: rec.expireAt.Sub(s.clk.Now())
        to: rec.expireAt.Sub
      - opt:
          do:
            - return: time.Nanosecond
          when: left <= 0
      - return: left
  - of: (*memoryStore).fetchRecord
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).fetchRecord
        kind: self
      - id: s.stripeOf
        kind: internal
      - id: stripe.mu.Lock
        kind: value
      - id: stripe.fetch
        kind: internal
      - id: stripe.mu.Unlock
        kind: value
    steps:
      - bind: stripe
        eval: s.stripeOf(key)
        to: s.stripeOf
      - eval: stripe.mu.Lock()
        to: stripe.mu.Lock
      - set: rec, found
        to: stripe.fetch
        value: stripe.fetch(key)
      - eval: stripe.mu.Unlock()
        to: stripe.mu.Unlock
      - return: rec, found
  - of: (*memoryStore).Set
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Set
        kind: self
      - id: s.validate
        kind: internal
      - id: s.stripeOf
        kind: internal
      - id: s.store
        kind: internal
    steps:
      - bind: weight, refusal
        eval: s.validate(key, entry)
        to: s.validate
      - opt:
          do:
            - return: refusal
          when: refusal != nil
      - bind: stripe
        eval: s.stripeOf(key)
        to: s.stripeOf
      - lock:
          mutex: stripe.mu
      - eval: "s.store(stripe, key, record[V]{value: entry.Value, tags: entry.Tags, weight: weight}, entry.TTL)"
        to: s.store
      - return: nil
  - of: (*memoryStore).validate
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).validate
        kind: self
      - id: validateEntry
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, refusal
          init:
            bind: refusal
            eval: validateEntry(key, entry)
            to: validateEntry
          when: refusal != nil
      - opt:
          do:
            - return: 0, nil
          when: s.weigh == nil
      - set: weight
        value: max(s.weigh(entry.Value), 0)
      - opt:
          do:
            - return: 0, rejected("value", "weighs "+strconv.FormatInt(weight, 10)+", over the "+strconv.FormatInt(s.maxWeight, 10)+" a stripe holds", key)
          when: weight > s.maxWeight
      - return: weight, nil
  - of: (*memoryStore).store
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).store
        kind: self
      - id: primitiveTTL
        kind: internal
      - id: s.clk.Now().Add
        kind: value
      - id: stripe.tags.add
        kind: internal
      - id: stripe.lru.SetTTL
        kind: value
      - id: stripe.drainEvicted
        kind: internal
    steps:
      - bind: lifetime
        eval: primitiveTTL(ttl, s.defaultTTL)
        to: primitiveTTL
      - set: rec.expireAt
        value: time.Time{}
      - opt:
          do:
            - set: rec.expireAt
              to: s.clk.Now().Add
              value: s.clk.Now().Add(lifetime)
          when: lifetime > 0
      - set: rec.tags
        to: stripe.tags.add
        value: stripe.tags.add(key, rec.tags)
      - eval: stripe.lru.SetTTL(key, rec, lifetime)
        to: stripe.lru.SetTTL
      - eval: stripe.drainEvicted()
        to: stripe.drainEvicted
  - of: (*memoryStore).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Delete
        kind: self
      - id: s.stripeOf
        kind: internal
      - id: stripe.lru.Delete
        kind: value
      - id: stripe.tags.remove
        kind: internal
    steps:
      - bind: stripe
        eval: s.stripeOf(key)
        to: s.stripeOf
      - lock:
          mutex: stripe.mu
      - eval: stripe.lru.Delete(key)
        to: stripe.lru.Delete
      - eval: stripe.tags.remove(key)
        to: stripe.tags.remove
      - return: nil
  - of: (*memoryStore).InvalidateTag
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).InvalidateTag
        kind: self
      - id: stripe.invalidate
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                0, kerrs.Wrap(corecache.CacheEntryRejected, kerrs.WrapParams{},
                			kerrs.String("part", "tag"), kerrs.String("problem", "empty"))
          when: tag == ""
      - loop:
          do:
            - op: +=
              set: removed
              to: stripe.invalidate
              value: stripe.invalidate(tag)
          key: _
          range: s.stripes
          value: stripe
      - return: removed, nil
  - of: (*memoryStripe).invalidate
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStripe).invalidate
        kind: self
      - id: m.tags.keysFor
        kind: internal
      - id: m.lru.Delete
        kind: value
      - id: m.tags.remove
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - bind: keys
        eval: m.tags.keysFor(tag)
        to: m.tags.keysFor
      - loop:
          do:
            - eval: m.lru.Delete(key)
              to: m.lru.Delete
            - eval: m.tags.remove(key)
              to: m.tags.remove
          key: _
          range: keys
          value: key
      - return: len(keys)
  - of: (*memoryStore).Expire
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Expire
        kind: self
      - id: stripe.expire
        kind: internal
    steps:
      - loop:
          do:
            - op: +=
              set: removed
              to: stripe.expire
              value: stripe.expire()
          key: _
          range: s.stripes
          value: stripe
      - return: removed, nil
  - of: (*memoryStripe).expire
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStripe).expire
        kind: self
      - id: m.lru.Expire
        kind: value
      - id: m.drainEvicted
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - bind: reaped
        eval: m.lru.Expire()
        to: m.lru.Expire
      - eval: m.drainEvicted()
        to: m.drainEvicted
      - return: reaped
  - of: (*memoryStore).Load
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Load
        kind: self
      - id: s.fetchRecord
        kind: internal
      - id: s.group.Do
        kind: value
    steps:
      - opt:
          do:
            - return: rec.value, rec.absent
          init:
            bind: rec, ok
            eval: s.fetchRecord(key)
            to: s.fetchRecord
          when: ok
      - bind: filled, _, groupErr
        eval: |-
          s.group.Do(ctx, key, func(callCtx context.Context) (V, error) {
          		//: exactly one goroutine per key reaches here.
          		return s.fillOnce(callCtx, key, fill)
          	})
        to: s.group.Do
      - return: filled, groupErr
  - of: (*memoryStore).fillOnce
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).fillOnce
        kind: self
      - id: s.fetchRecord
        kind: internal
      - id: s.fillAndStore
        kind: internal
    steps:
      - opt:
          do:
            - return: rec.value, rec.absent
          init:
            bind: rec, ok
            eval: s.fetchRecord(key)
            to: s.fetchRecord
          when: ok
      - return: s.fillAndStore(ctx, key, fill)
        to: s.fillAndStore
  - of: (*memoryStore).fillAndStore
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).fillAndStore
        kind: self
      - id: fillFailure
        kind: internal
      - id: corecache
        kind: package
      - id: s.stripeOf
        kind: internal
      - id: stripe.mu.Lock
        kind: value
      - id: s.store
        kind: internal
      - id: stripe.mu.Unlock
        kind: value
      - id: s.Set
        kind: internal
    steps:
      - bind: entry, fillErr
        eval: fill(ctx)
      - opt:
          do:
            - var:
                name: zero
                type: V
            - bind: labelled
              eval: fillFailure(key, fillErr)
              to: fillFailure
            - opt:
                do:
                  - bind: stripe
                    eval: s.stripeOf(key)
                    to: s.stripeOf
                  - eval: stripe.mu.Lock()
                    to: stripe.mu.Lock
                  - eval: "s.store(stripe, key, record[V]{tags: entry.Tags, absent: labelled, weight: s.absentWeight()}, ttl)"
                    to: s.store
                  - eval: stripe.mu.Unlock()
                    to: stripe.mu.Unlock
                init:
                  bind: ttl, absent
                  eval: corecache.AbsentTTLOf(fillErr)
                  to: corecache
                when: absent && ttl > 0 && !slices.Contains(entry.Tags, "")
            - return: zero, labelled
          when: fillErr != nil
      - opt:
          do:
            - var:
                name: zero
                type: V
            - return: zero, setErr
          init:
            bind: setErr
            eval: s.Set(ctx, key, entry)
            to: s.Set
          when: setErr != nil
      - return: entry.Value, nil
  - of: (*memoryStore).FetchMany
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).FetchMany
        kind: self
      - id: s.stripes[0].fetchInto
        kind: internal
      - id: s.stripes[at].fetchInto
        kind: internal
    steps:
      - bind: found
        eval: make(map[string]V, len(keys))
      - opt:
          do:
            - eval: s.stripes[0].fetchInto(found, keys)
              to: s.stripes[0].fetchInto
            - return: found, nil
          when: len(s.stripes) == 1
      - loop:
          do:
            - opt:
                do:
                  - eval: s.stripes[at].fetchInto(found, group)
                    to: s.stripes[at].fetchInto
                when: len(group) > 0
          key: at
          range: s.groupByStripe(keys)
          value: group
      - return: found, nil
  - of: (*memoryStripe).fetchInto
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStripe).fetchInto
        kind: self
      - id: m.fetch
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, seen
                  eval: found[key]
                when: seen
            - opt:
                do:
                  - set: found[key]
                    value: rec.value
                init:
                  bind: rec, ok
                  eval: m.fetch(key)
                  to: m.fetch
                when: ok && rec.absent == nil
          key: _
          range: keys
          value: key
  - of: (*memoryStore).groupByStripe
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).groupByStripe
        kind: self
      - id: s.stripeIndex
        kind: internal
    steps:
      - bind: groups
        eval: make([][]string, len(s.stripes))
      - loop:
          do:
            - bind: at
              eval: s.stripeIndex(key)
              to: s.stripeIndex
            - set: groups[at]
              value: append(groups[at], key)
          key: _
          range: keys
          value: key
      - return: groups
  - of: (*memoryStore).SetMany
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).SetMany
        kind: self
      - id: s.validate
        kind: internal
      - id: s.stripeIndex
        kind: internal
      - id: s.setInto
        kind: internal
    steps:
      - bind: weights
        eval: make(map[string]int64, len(entries))
      - loop:
          do:
            - bind: weight, refusal
              eval: s.validate(key, entry)
              to: s.validate
            - opt:
                do:
                  - return: refusal
                when: refusal != nil
            - set: weights[key]
              value: weight
          key: key
          range: entries
          value: entry
      - bind: groups
        eval: make([][]string, len(s.stripes))
      - loop:
          do:
            - bind: at
              eval: s.stripeIndex(key)
              to: s.stripeIndex
            - set: groups[at]
              value: append(groups[at], key)
          key: key
          range: entries
      - loop:
          do:
            - opt:
                do:
                  - eval: s.setInto(s.stripes[at], group, entries, weights)
                    to: s.setInto
                when: len(group) > 0
          key: at
          range: groups
          value: group
      - return: nil
  - of: (*memoryStore).setInto
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).setInto
        kind: self
      - id: s.store
        kind: internal
    steps:
      - lock:
          mutex: stripe.mu
      - loop:
          do:
            - bind: entry
              eval: entries[key]
            - eval: "s.store(stripe, key, record[V]{value: entry.Value, tags: entry.Tags, weight: weights[key]}, entry.TTL)"
              to: s.store
          key: _
          range: keys
          value: key
  - of: (*memoryStore).stripeIndex
    steps:
      - opt:
          do:
            - return: "0"
          when: len(s.stripes) == 1
      - return: int(maphashString(s, key) % uint64(len(s.stripes)))
  - of: remainingOf
    steps:
      - opt:
          do:
            - return: "0"
          when: expireAt.IsZero()
      - return: max(expireAt.Sub(now), 0)
  - of: (*memoryStore).LoadRefreshing
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).LoadRefreshing
        kind: self
      - id: s.stripeOf
        kind: internal
      - id: stripe.mu.Lock
        kind: value
      - id: stripe.fetch
        kind: internal
      - id: remainingOf
        kind: internal
      - id: stripe.mu.Unlock
        kind: value
      - id: s.Load
        kind: internal
      - id: s.refresh
        kind: internal
    steps:
      - opt:
          do:
            - var:
                name: zero
                type: V
            - return: zero, refusedWindow(before)
          when: before <= 0
      - bind: stripe
        eval: s.stripeOf(key)
        to: s.stripeOf
      - eval: stripe.mu.Lock()
        to: stripe.mu.Lock
      - bind: rec, ok
        eval: stripe.fetch(key)
        to: stripe.fetch
      - bind: left
        eval: remainingOf(rec.expireAt, s.clk.Now())
        to: remainingOf
      - bind: start
        eval: ok && rec.absent == nil && !rec.expireAt.IsZero() && left < before && stripe.claimRefresh(key)
      - eval: stripe.mu.Unlock()
        to: stripe.mu.Unlock
      - opt:
          do:
            - return: s.Load(ctx, key, fill)
              to: s.Load
          when: "!ok"
      - opt:
          do:
            - go: s.refresh(ctx, stripe, key, fill, left)
              to: s.refresh
          when: start
      - return: rec.value, rec.absent
  - of: (*memoryStripe).claimRefresh
    steps:
      - opt:
          do:
            - return: "false"
          init:
            bind: _, running
            eval: m.refreshing[key]
          when: running
      - opt:
          do:
            - set: m.refreshing
              value: make(map[string]struct{})
          when: m.refreshing == nil
      - set: m.refreshing[key]
        value: struct{}{}
      - return: "true"
  - of: (*memoryStore).refresh
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).refresh
        kind: self
      - id: stripe.releaseRefresh
        kind: internal
      - id: context
        kind: stdlib
      - id: s.fillAndStore
        kind: internal
    steps:
      - defer: stripe.releaseRefresh(key)
        to: stripe.releaseRefresh
      - bind: bounded, cancel
        eval: context.WithTimeout(context.WithoutCancel(ctx), left)
        to: context
      - defer: cancel()
      - opt:
          do:
            - return: ""
          init:
            bind: _, fillErr
            eval: s.fillAndStore(bounded, key, fill)
            to: s.fillAndStore
          when: fillErr != nil
  - of: (*memoryStripe).releaseRefresh
    steps:
      - lock:
          mutex: m.mu
      - eval: delete(m.refreshing, key)
  - of: refusedWindow
    participants:
      - id: caller
        kind: actor
      - id: refusedWindow
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corecache.CacheMisconfigured, kerrs.WrapParams{},
          		kerrs.String("option", "before"), kerrs.String("value", before.String()))
        to: kerrs
  - of: validateEntry
    participants:
      - id: caller
        kind: actor
      - id: validateEntry
        kind: self
      - id: rejected
        kind: internal
    steps:
      - opt:
          do:
            - return: rejected("key", "empty", "")
              to: rejected
          when: key == ""
      - opt:
          do:
            - return: rejected("tag", "empty", key)
              to: rejected
          when: slices.Contains(entry.Tags, "")
      - opt:
          do:
            - return: rejected("ttl", entry.TTL.String(), key)
              to: rejected
          when: entry.TTL < 0 && entry.TTL != corecache.NoExpiry
      - return: nil
  - of: primitiveTTL
    steps:
      - switch:
          cases:
            - case: corecache.NoExpiry
              do:
                - return: "0"
            - case: "0"
              do:
                - return: storeDefault
            - default: true
              do:
                - return: ttl
          "on": ttl
  - of: rejected
    participants:
      - id: caller
        kind: actor
      - id: rejected
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: fields
        eval: |-
          []kerrs.FieldValue{
          		kerrs.String("part", part),
          		kerrs.String("problem", problem),
          	}
      - opt:
          do:
            - set: fields
              value: append(fields, kerrs.String("key", key))
          when: key != ""
      - return: kerrs.Wrap(corecache.CacheEntryRejected, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: fillFailure
    participants:
      - id: caller
        kind: actor
      - id: fillFailure
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: cause
          init:
            bind: _, typed
            eval: kerrs.CodeOf(cause)
            to: kerrs
          when: typed
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:    corecache.CacheFillFailed.Code(),
          		Reason:  corecache.CacheFillFailed.Reason(),
          		Public:  corecache.CacheFillFailed.Public(),
          		Private: corecache.CacheFillFailed.Private(),
          	}, kerrs.String("key", key), kerrs.String("cause", cause.Error()))
        to: kerrs
  - of: newTagIndex
    steps:
      - return: |-
          &tagIndex{
          		byKey: make(map[string][]string, initialIndexCapacity),
          		byTag: make(map[string]map[string]struct{}, initialIndexCapacity),
          	}
  - of: (*tagIndex).add
    participants:
      - id: caller
        kind: actor
      - id: (*tagIndex).add
        kind: self
      - id: t.remove
        kind: internal
    steps:
      - eval: t.remove(key)
        to: t.remove
      - opt:
          do:
            - return: nil
          when: len(tags) == 0
      - bind: owned
        eval: make([]string, 0, len(tags))
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, already
                  eval: t.byTag[tag][key]
                when: already
            - opt:
                do:
                  - set: t.byTag[tag]
                    value: make(map[string]struct{}, initialIndexCapacity)
                when: t.byTag[tag] == nil
            - set: t.byTag[tag][key]
              value: struct{}{}
            - set: owned
              value: append(owned, tag)
          key: _
          range: tags
          value: tag
      - set: t.byKey[key]
        value: owned
      - return: owned
  - of: (*tagIndex).keysFor
    participants:
      - id: caller
        kind: actor
      - id: (*tagIndex).keysFor
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: bucket
        eval: t.byTag[tag]
      - opt:
          do:
            - return: nil
          when: len(bucket) == 0
      - return: slices.Collect(maps.Keys(bucket))
        to: slices
