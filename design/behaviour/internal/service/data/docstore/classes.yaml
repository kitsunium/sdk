# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      DefaultFoldAt is the least number of overlay entries that folds the overlay
      into the snapshot, when [Config].FoldAt is zero.

      A fold rewrites the whole snapshot, so how often it runs decides what a
      write costs on average. Folding once the overlay holds as many entries as
      the store holds documents keeps that average a constant — one fold of N
      documents per N writes — and the floor keeps a small store from rewriting
      its snapshot every few writes for nothing: a thousand small files in one
      directory is not a cost worth avoiding.
    items:
      - name: DefaultFoldAt
        type: int
        value: "1024"
    name: DefaultFoldAt
  - doc: overlaySuffix names the overlay directory beside the snapshot.
    items:
      - name: overlaySuffix
        type: string
        value: "\".d\""
    name: overlaySuffix
  - doc: |-
      versionsSuffix names the versions file beside the snapshot: every
      document's former versions, as the last fold left them (ADR 0143).
    items:
      - name: versionsSuffix
        type: string
        value: "\".versions\""
    name: versionsSuffix
  - doc: |-
      filePerm is the mode of every file the store writes: the owner's data, and
      nobody else's to read.
    items:
      - name: filePerm
        type: fs.FileMode
        value: "0o600"
    name: filePerm
  - doc: dirPerm is the mode of every directory the store creates.
    items:
      - name: dirPerm
        type: fs.FileMode
        value: "0o700"
    name: dirPerm
  - doc: entrySuffix ends every overlay entry's name.
    items:
      - name: entrySuffix
        type: string
        value: "\".json\""
    name: entrySuffix
  - doc: |-
      entryNameLen is an overlay entry's name length: 64 hexadecimal digits of a
      SHA-256 and the suffix.
    items:
      - name: entryNameLen
        type: int
        value: sha256.Size*2 + len(entrySuffix)
    name: entryNameLen
  - doc: |-
      leftoverPrefix and leftoverSuffix bracket the name of a temporary a crashed
      vfs publication left behind: never a store's data, always removable.
    grouped: true
    items:
      - name: leftoverPrefix
        type: string
        value: "\".vfs-\""
      - name: leftoverSuffix
        type: string
        value: "\".tmp\""
    name: leftoverPrefix
  - doc: |-
      MaxSQLTableLen is the longest table name a SQL store accepts, in bytes:
      PostgreSQL's identifier limit of 63, less the five bytes of the longest names
      the store derives from it — its index table, the name followed by "___ix",
      and its versions table, followed by "___vs".
      A caller whose names can be longer shortens them, with a digest, before
      they reach the store.
    items:
      - name: MaxSQLTableLen
        type: int
        value: "58"
    name: MaxSQLTableLen
  - doc: |-
      MaxSQLKeyLen is the longest store key, and the longest index key as it
      reaches the table, in bytes. An index row carries an index key and a store
      key in one primary key, and MySQL's InnoDB caps an index entry at 3072
      bytes: two keys of this length and an index name fit in it, with room left.
    items:
      - name: MaxSQLKeyLen
        type: int
        value: "1024"
    name: MaxSQLKeyLen
  - doc: |-
      MaxSQLIndexNameLen is the longest index name a SQL store accepts, in bytes.
      An index's name is stored in every one of its rows, beside its keys.
    items:
      - name: MaxSQLIndexNameLen
        type: int
        value: "64"
    name: MaxSQLIndexNameLen
  - doc: |-
      derivedSeparator joins a store's table name and the tag of a table the
      store derives from it. Three underscores, which a table name may not
      contain, so no derived name is ever another store's table.
    items:
      - name: derivedSeparator
        type: string
        value: "\"___\""
    name: derivedSeparator
  - doc: indexTableTag names the table of index rows beside the documents' table.
    items:
      - name: indexTableTag
        type: string
        value: "\"ix\""
    name: indexTableTag
  - doc: |-
      versionsTableTag names the table of versions beside the documents' table
      (ADR 0143).
    items:
      - name: versionsTableTag
        type: string
        value: "\"vs\""
    name: versionsTableTag
  - doc: |-
      reservedTablePrefix starts every name SQLite keeps for itself: creating a
      table under it is an error there, so it is refused on every engine and a
      store moves between them unchanged.
    items:
      - name: reservedTablePrefix
        type: string
        value: "\"sqlite_\""
    name: reservedTablePrefix
  - doc: |-
      indexRowArgs is how many arguments one index row binds: its index's name,
      its key, its document's key, and whether its index is unique.
    items:
      - name: indexRowArgs
        type: int
        value: "4"
    name: indexRowArgs
  - doc: |-
      versionRowArgs is how many arguments one version row binds: its document's
      key, its number, its instant — seconds and nanoseconds — its metadata and its
      document.
    items:
      - name: versionRowArgs
        type: int
        value: "6"
    name: versionRowArgs
  - doc: |-
      sqlMigrationPrefix starts the name of every migration SQLMigration builds,
      so a version table read during an incident says what created the tables.
    items:
      - name: sqlMigrationPrefix
        type: string
        value: "\"docstore \""
    name: sqlMigrationPrefix
  - doc: |-
      sqlVersionsMigrationPrefix starts the name of every migration
      SQLVersionsMigration builds.
    items:
      - name: sqlVersionsMigrationPrefix
        type: string
        value: "\"docstore versions \""
    name: sqlVersionsMigrationPrefix
  - doc: |-
      reindexPage is how many documents Reindex reads at a time. A page is read
      whole before its rows are filed, because a transaction runs one statement at
      a time on its connection; the page bounds what that holds in memory.
    items:
      - name: reindexPage
        type: int
        value: "256"
    name: reindexPage
  - doc: |-
      rowsHint is the capacity a read starts its answer with: a guess, grown by
      append past it, and small enough that an empty answer costs little.
    items:
      - name: rowsHint
        type: int
        value: "16"
    name: rowsHint
  - doc: |-
      keysPageLen is how many keys one statement of Keys reads: enough that a
      listing of a large table is few round trips, few enough that a page is a
      few kilobytes of keys and never holds the table's rows long.
    items:
      - name: keysPageLen
        type: int
        value: "256"
    name: keysPageLen
  - doc: |-
      tombstoneNum is the number of a trashed document's row in the versions
      table: one no version is given, since versions are numbered from 1.
    items:
      - name: tombstoneNum
        type: int64
        value: "0"
    name: tombstoneNum
  - doc: |-
      versionRowsPerStatement bounds how many version rows one INSERT carries. At
      six arguments a row it stays under the 999 bound parameters of an SQLite
      older than 3.32, as indexRowsPerStatement does.
    items:
      - name: versionRowsPerStatement
        type: int
        value: "150"
    name: versionRowsPerStatement
  - doc: |-
      uniqueKeysPerStatement bounds how many unique keys one unique check asks
      about. At two arguments a key, plus the document's key, it stays under
      SQLite's 999 bound parameters for the same reason indexRowsPerStatement does.
    items:
      - name: uniqueKeysPerStatement
        type: int
        value: "400"
    name: uniqueKeysPerStatement
  - doc: |-
      indexRowsPerStatement bounds how many index rows one INSERT carries. At four
      arguments a row it stays under 999 bound parameters — SQLite's ceiling
      before 3.32 — so a document with many keys is filed in a few statements
      rather than refused by an older engine.
    items:
      - name: indexRowsPerStatement
        type: int
        value: "200"
    name: indexRowsPerStatement
  - doc: The two collisions a write asks the database about after the fact.
    grouped: true
    items:
      - doc: "docConflict: a document already stored under the key."
        name: docConflict
        type: conflictKind
        value: iota
      - doc: "uniqueConflict: a unique index filing one of the keys elsewhere."
        name: uniqueConflict
    name: docConflict
  - doc: The problems VersionsInvalid names, the same on both engines.
    grouped: true
    items:
      - doc: "problemNoVersion: a document is at least its current version."
        name: problemNoVersion
        type: string
        value: "\"no version\""
      - doc: "problemNumberZero: versions are numbered from 1."
        name: problemNumberZero
        type: string
        value: "\"a version numbered 0\""
      - doc: "problemNotDecreasing: newest first, no number twice."
        name: problemNotDecreasing
        type: string
        value: "\"numbers that do not strictly decrease from the newest\""
      - doc: "problemUnknownInstant: only version 1 may predate its store's versions."
        name: problemUnknownInstant
        type: string
        value: "\"an unknown instant on a version other than 1\""
      - doc: "problemNotJSON: a version holds a JSON document."
        name: problemNotJSON
        type: string
        value: "\"a version that is not JSON\""
      - doc: "problemOtherKey: a document sits under the key its own Key gives."
        name: problemOtherKey
        type: string
        value: "\"a current document whose own key is another\""
    name: problemNoVersion
  - doc: The three write modes.
    grouped: true
    items:
      - doc: upsert creates or replaces.
        name: upsert
        type: writeMode
        value: iota
      - doc: insertOnly refuses an existing key.
        name: insertOnly
      - doc: |-
          replaceOnly refuses a missing key, so a document deleted meanwhile is
          never brought back.
        name: replaceOnly
    name: upsert
