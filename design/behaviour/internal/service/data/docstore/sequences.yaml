          do:
            - return: zero, false, fnErr
          init:
            bind: fnErr
            eval: fn(&v)
          when: fnErr != nil
      - bind: p, prepErr
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: zero, false, prepErr
          when: prepErr != nil
      - opt:
          do:
            - return: zero, false, kerrs.Wrap(coredocstore.DocumentKeyChanged, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: p.key != key
      - set: applied, err
        to: s.persistAndApply
        value: s.persistAndApply(p, stamp)
      - opt:
          do:
            - return: zero, false, err
          when: "!applied"
      - return: v, true, err
  - of: (*Store).persistAndApply
    participants:
      - id: caller
        kind: actor
      - id: (*Store).persistAndApply
        kind: self
      - id: s.uniqueTaken
        kind: internal
      - id: s.nextVersions
        kind: internal
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.file
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.UniqueKeyTaken, kerrs.WrapParams{}, kerrs.String("store", s.path), kerrs.String("index", name))
          init:
            bind: name, taken
            eval: s.uniqueTaken(p.key, p.keys)
            to: s.uniqueTaken
          when: taken
      - bind: versions
        eval: s.nextVersions(p.key, p.raw, stamp)
        to: s.nextVersions
      - bind: persistErr
        eval: s.persist(p.key, p.raw, false, versions)
        to: s.persist
      - opt:
          do:
            - return: false, persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.docs[p.key]
        value: p.raw
      - eval: s.setVersions(p.key, versions)
        to: s.setVersions
      - eval: s.file(p.key, p.keys)
        to: s.file
      - eval: s.markPending(p.key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: true, persistErr
  - of: (*Store).remove
    participants:
      - id: caller
        kind: actor
      - id: (*Store).remove
        kind: self
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.unfile
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          init:
            bind: _, found
            eval: s.docs[key]
          when: "!found"
      - bind: persistErr
        eval: s.persist(key, nil, true, nil)
        to: s.persist
      - opt:
          do:
            - return: false, persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - eval: delete(s.docs, key)
      - eval: s.setVersions(key, nil)
        to: s.setVersions
      - eval: s.unfile(key)
        to: s.unfile
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: true, persistErr
  - of: encodeCause
    participants:
      - id: caller
        kind: actor
      - id: encodeCause
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"unsupported type \" + unsupportedType.Type.String()"
          init:
            bind: unsupportedType, unsupported
            eval: errors.AsType[*json.UnsupportedTypeError](err)
          when: unsupported
      - opt:
          do:
            - return: "\"the marshaler of \" + marshalerErr.Type.String() + \" failed\""
          init:
            bind: marshalerErr, failed
            eval: errors.AsType[*json.MarshalerError](err)
          when: failed
      - return: fmt.Sprintf("%T", err)
        to: fmt
