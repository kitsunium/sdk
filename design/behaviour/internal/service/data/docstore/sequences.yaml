        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: s.decodeAll
        kind: internal
    steps:
      - bind: ix, found
        eval: s.byName[index]
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.IndexUnknown, kerrs.WrapParams{}, kerrs.String("index", index))
          when: "!found"
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: owners, closed
        eval: ix.holders(key), s.closed
      - bind: entries
        eval: make([]coredocstore.EntryValue, len(owners))
      - loop:
          do:
            - set: entries[i]
              value: "coredocstore.EntryValue{Key: owner, JSON: s.docs[owner]}"
          key: i
          range: owners
          value: owner
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: closed
      - return: s.decodeAll(entries)
        to: s.decodeAll
  - of: (*Store).Stats
    steps:
      - lock:
          mutex: s.mu
          read: true
      - return: "StatsValue{FoldError: s.foldErr, Documents: len(s.docs), Pending: len(s.pending), Folds: s.folds, Versions: s.weight}"
  - of: (*Store).snapshotEntries
    participants:
      - id: caller
        kind: actor
      - id: (*Store).snapshotEntries
        kind: self
      - id: sortedKeys
        kind: internal
    steps:
      - lock:
          mutex: s.mu
          read: true
      - opt:
          do:
            - return: nil, true
          when: s.closed
      - bind: keys
        eval: sortedKeys(s.docs)
        to: sortedKeys
      - opt:
          do:
            - set: keys
              value: keys[:limit]
          when: limit > 0 && limit < len(keys)
      - set: entries
        value: make([]coredocstore.EntryValue, len(keys))
      - loop:
          do:
            - set: entries[i]
              value: "coredocstore.EntryValue{Key: key, JSON: s.docs[key]}"
          key: i
          range: keys
          value: key
      - return: entries, false
  - of: (*Store).decode
    participants:
      - id: caller
        kind: actor
      - id: (*Store).decode
        kind: self
      - id: decodeAs
        kind: internal
    steps:
      - return: decodeAs[T](s.path, raw)
        to: decodeAs
  - of: decodeAs
    participants:
      - id: caller
        kind: actor
      - id: decodeAs
        kind: self
      - id: decodeInto
        kind: internal
    steps:
      - var:
          name: v
          type: T
      - opt:
          do:
            - return: v, err
          init:
            bind: err
            eval: decodeInto(store, raw, &v)
            to: decodeInto
          when: err != nil
      - return: v, nil
  - of: decodeInto
    participants:
      - id: caller
        kind: actor
      - id: decodeInto
        kind: self
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - var:
                name: zero
                type: T
            - set: "*dst"
              value: zero
            - return: |-
                kerrs.Wrap(coredocstore.DocumentUndecodable, kerrs.WrapParams{},
                			kerrs.String("store", store), kerrs.String("cause", jsonCause(err, reflect.TypeFor[T]())))
              to: kerrs
          init:
            bind: err
            eval: json.Unmarshal(raw, dst)
            to: json
          when: err != nil
      - return: nil
  - of: (*Store).decodeAll
    participants:
      - id: caller
        kind: actor
      - id: (*Store).decodeAll
        kind: self
      - id: s.decode
        kind: internal
    steps:
      - bind: out
        eval: make([]T, len(entries))
      - loop:
          do:
            - bind: v, err
              eval: s.decode(entry.JSON)
              to: s.decode
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: out[i]
              value: v
          key: i
          range: entries
          value: entry
      - return: out, nil
  - of: jsonCause
    participants:
      - id: caller
        kind: actor
      - id: jsonCause
        kind: self
      - id: typeErr.Type.String
        kind: value
      - id: fmt
        kind: stdlib
    steps:
      - opt:
          do:
            - bind: typeName
              eval: "\"an unknown type\""
            - opt:
                do:
                  - set: typeName
                    to: typeErr.Type.String
                    value: typeErr.Type.String()
                when: typeErr.Type != nil
            - opt:
                do:
                  - return: "\"the stored value does not fit \" + typeName"
                when: typeErr.Field == ""
            - return: "\"the stored value of field \" + fieldPath(root, typeErr.Field) + \" does not fit \" + typeName"
          init:
            bind: typeErr, isTypeErr
            eval: errors.AsType[*json.UnmarshalTypeError](err)
          when: isTypeErr
      - opt:
          do:
            - return: "\"malformed JSON at offset \" + strconv.FormatInt(syntaxErr.Offset, 10)"
          init:
            bind: syntaxErr, isSyntaxErr
            eval: errors.AsType[*json.SyntaxError](err)
          when: isSyntaxErr
      - return: fmt.Sprintf("%T", err)
        to: fmt
  - of: fieldPath
    participants:
      - id: caller
        kind: actor
      - id: fieldPath
        kind: self
      - id: resolvePath
        kind: internal
    steps:
      - bind: rendered, resolved
        eval: resolvePath(root, strings.Split(dotted, "."))
        to: resolvePath
      - opt:
          do:
            - return: "\"…\""
          when: "!resolved"
      - return: rendered
  - of: resolvePath
    participants:
      - id: caller
        kind: actor
      - id: resolvePath
        kind: self
      - id: t.Elem
        kind: value
      - id: resolveField
        kind: internal
      - id: resolveMapKey
        kind: internal
    steps:
      - loop:
          cond: t.Kind() == reflect.Pointer || t.Kind() == reflect.Slice || t.Kind() == reflect.Array
          do:
            - set: t
              to: t.Elem
              value: t.Elem()
      - opt:
          do:
            - return: "\"\", true"
          when: len(segments) == 0
      - switch:
          cases:
            - case: reflect.Struct
              do:
                - return: resolveField(t, segments)
                  to: resolveField
            - case: reflect.Map
              do:
                - return: resolveMapKey(t, segments)
                  to: resolveMapKey
            - case: reflect.Interface
              do:
                - return: "\"…\", true"
            - default: true
              do:
                - return: "\"\", false"
          "on": t.Kind()
  - of: resolveField
    participants:
      - id: caller
        kind: actor
      - id: resolveField
        kind: self
      - id: resolvePath
        kind: internal
      - id: joinPath
        kind: internal
    steps:
      - loop:
          do:
            - bind: "n"
              eval: strings.Count(field.name, ".") + 1
            - opt:
                do:
                  - continue: true
                when: n > len(segments) || strings.Join(segments[:n], ".") != field.name
            - opt:
                do:
                  - return: joinPath(field.name, rest), true
                    to: joinPath
                init:
                  bind: rest, ok
                  eval: resolvePath(field.typ, segments[n:])
                  to: resolvePath
                when: ok
          key: _
          range: jsonFields(t)
          value: field
      - return: "\"\", false"
  - of: resolveMapKey
    participants:
      - id: caller
        kind: actor
      - id: resolveMapKey
        kind: self
      - id: resolvePath
        kind: internal
      - id: joinPath
        kind: internal
    steps:
      - loop:
          cond: taken <= len(segments)
          do:
            - opt:
                do:
                  - return: joinPath(redactedKey, rest), true
                    to: joinPath
                init:
                  bind: rest, ok
                  eval: resolvePath(t.Elem(), segments[taken:])
                  to: resolvePath
                when: ok
          init: taken := 1
          post: taken++
      - return: "\"\", false"
  - of: joinPath
    steps:
      - opt:
          do:
            - return: head
          when: rest == ""
      - return: head + "." + rest
  - of: jsonFields
    participants:
      - id: caller
        kind: actor
      - id: jsonFields
        kind: self
      - id: promotedStruct
        kind: internal
      - id: jsonNameOf
        kind: internal
    steps:
      - var:
          name: out
          type: "[]jsonField"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: append(out, jsonFields(promoted)...)
                  - continue: true
                init:
                  bind: promoted, isPromoted
                  eval: promotedStruct(field)
                  to: promotedStruct
                when: isPromoted
            - opt:
                do:
                  - set: out
                    value: "append(out, jsonField{name: name, typ: field.Type})"
                init:
                  bind: name, decoded
                  eval: jsonNameOf(field)
                  to: jsonNameOf
                when: decoded
          key: field
          range: t.Fields()
      - return: out
  - of: promotedStruct
    participants:
      - id: caller
        kind: actor
      - id: promotedStruct
        kind: self
      - id: field.Tag.Get
        kind: value
      - id: strings
        kind: stdlib
      - id: promoted.Elem
        kind: value
    steps:
      - bind: tag
        eval: field.Tag.Get("json")
        to: field.Tag.Get
      - bind: name, _, _
        eval: strings.Cut(tag, ",")
        to: strings
      - set: promoted
        value: field.Type
      - opt:
          do:
            - set: promoted
              to: promoted.Elem
              value: promoted.Elem()
          when: promoted.Kind() == reflect.Pointer
      - return: promoted, field.Anonymous && tag != "-" && name == "" && promoted.Kind() == reflect.Struct
  - of: jsonNameOf
    participants:
      - id: caller
        kind: actor
      - id: jsonNameOf
        kind: self
      - id: field.Tag.Get
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: tag
        eval: field.Tag.Get("json")
        to: field.Tag.Get
      - opt:
          do:
            - return: "\"\", false"
          when: "!field.IsExported() || tag == \"-\""
      - set: name, _, _
        to: strings
        value: strings.Cut(tag, ",")
      - opt:
          do:
            - set: name
              value: field.Name
          when: name == ""
      - return: name, true
  - of: sortedKeys
    participants:
      - id: caller
        kind: actor
      - id: sortedKeys
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Sorted(maps.Keys(m))
        to: slices
  - of: (*hooks).add
    participants:
      - id: caller
        kind: actor
      - id: (*hooks).add
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return:
                closure:
                  steps: null
          when: fn == nil
      - lock:
          mutex: h.mu
      - bind: id
        eval: h.next
      - op: ++
        set: h.next
      - set: h.fns
        value: "append(h.fns, hook{fn: fn, id: id})"
      - return:
          closure:
            steps:
              - lock:
                  mutex: h.mu
              - set: h.fns
                to: slices
                value: slices.DeleteFunc(h.fns, func(registered hook) bool { return registered.id == id })
  - of: (*hooks).call
    participants:
      - id: caller
        kind: actor
      - id: (*hooks).call
        kind: self
      - id: h.mu.Lock
        kind: value
      - id: slices
        kind: stdlib
      - id: h.mu.Unlock
        kind: value
    steps:
      - eval: h.mu.Lock()
        to: h.mu.Lock
      - bind: fns
        eval: slices.Clone(h.fns)
        to: slices
      - eval: h.mu.Unlock()
        to: h.mu.Unlock
      - loop:
          do:
            - eval: registered.fn(key)
          key: _
          range: fns
          value: registered
  - of: (*Store).OnWrite
    participants:
      - id: caller
        kind: actor
      - id: (*Store).OnWrite
        kind: self
      - id: s.onWrite.add
        kind: internal
    steps:
      - return: s.onWrite.add(fn)
        to: s.onWrite.add
  - of: (*Store).OnDelete
    participants:
      - id: caller
        kind: actor
      - id: (*Store).OnDelete
        kind: self
      - id: s.onDelete.add
        kind: internal
    steps:
      - return: s.onDelete.add(fn)
        to: s.onDelete.add
  - of: compareEntries
    participants:
      - id: caller
        kind: actor
      - id: compareEntries
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: c
          init:
            bind: c
            eval: strings.Compare(a.key, b.key)
            to: strings
          when: c != 0
      - return: strings.Compare(a.owner, b.owner)
        to: strings
  - of: newIndex
    steps:
      - return: |-
          &index[T]{
          		keys:    spec.Keys,
          		entries: map[string]map[string]struct{}{},
          		owned:   map[string][]string{},
          		name:    spec.Name,
          		unique:  spec.Unique,
          		order:   orderOf(spec),
          	}
  - of: orderOf
    steps:
      - opt:
          do:
            - return: ordered
          when: spec.Ordered
      - return: unordered
  - of: (*index).keysOf
    participants:
      - id: caller
        kind: actor
      - id: (*index).keysOf
        kind: self
      - id: fileableKeys
        kind: internal
    steps:
      - return: fileableKeys(ix.keys(v))
        to: fileableKeys
  - of: (*index).taken
    steps:
      - opt:
          do:
            - return: "false"
          when: "!ix.unique"
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: "true"
                      when: other != owner
                key: other
                range: ix.entries[k]
          key: _
          range: keys
          value: k
      - return: "false"
  - of: (*index).set
    participants:
      - id: caller
        kind: actor
      - id: (*index).set
        kind: self
      - id: ix.drop
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - eval: ix.drop(owner)
        to: ix.drop
      - loop:
          do:
            - bind: holders
              eval: ix.entries[k]
            - opt:
                do:
                  - set: holders
                    value: map[string]struct{}{}
                  - set: ix.entries[k]
                    value: holders
                when: holders == nil
            - set: holders[owner]
              value: struct{}{}
          key: _
          range: keys
          value: k
      - opt:
          do:
            - set: ix.owned[owner]
              value: keys
          when: len(keys) > 0
      - opt:
          do:
            - loop:
                do:
                  - bind: entry
                    eval: "indexEntry{key: k, owner: owner}"
                  - bind: at, _
                    eval: slices.BinarySearchFunc(ix.sorted, entry, compareEntries)
                    to: slices
                  - set: ix.sorted
                    to: slices
                    value: slices.Insert(ix.sorted, at, entry)
                key: _
                range: keys
                value: k
          when: ix.order == ordered
  - of: (*index).drop
    participants:
      - id: caller
        kind: actor
      - id: (*index).drop
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - set: ix.sorted
                          to: slices
                          value: slices.Delete(ix.sorted, at, at+1)
                      init:
                        bind: at, found
                        eval: "slices.BinarySearchFunc(ix.sorted, indexEntry{key: k, owner: owner}, compareEntries)"
                        to: slices
                      when: found
                when: ix.order == ordered
            - opt:
                do:
                  - eval: delete(holders, owner)
                  - opt:
                      do:
                        - eval: delete(ix.entries, k)
                      when: len(holders) == 0
                init:
                  bind: holders
                  eval: ix.entries[k]
                when: holders != nil
          key: _
          range: ix.owned[owner]
          value: k
      - eval: delete(ix.owned, owner)
  - of: (*index).resort
    participants:
      - id: caller
        kind: actor
      - id: (*index).resort
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: ix.order == unordered
      - set: ix.order
        value: ordered
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - op: +=
              set: "n"
              value: len(keys)
          key: _
          range: ix.owned
          value: keys
      - set: ix.sorted
        value: make([]indexEntry, 0, n)
      - loop:
          do:
            - loop:
                do:
                  - set: ix.sorted
                    value: "append(ix.sorted, indexEntry{key: k, owner: owner})"
                key: _
                range: keys
                value: k
          key: owner
          range: ix.owned
          value: keys
      - eval: slices.SortFunc(ix.sorted, compareEntries)
        to: slices
  - of: (*index).between
    participants:
      - id: caller
        kind: actor
      - id: (*index).between
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at, _
        eval: "slices.BinarySearchFunc(ix.sorted, indexEntry{key: lo}, compareEntries)"
        to: slices
      - bind: end
        eval: len(ix.sorted)
      - opt:
          do:
            - bind: stop, _
              eval: "slices.BinarySearchFunc(ix.sorted[at:], indexEntry{key: hi}, compareEntries)"
              to: slices
            - set: end
              value: at + stop
          when: hi != ""
      - opt:
          do:
            - set: end
              value: at + limit
          when: limit > 0 && end-at > limit
      - return: ix.sorted[at:end]
  - of: (*index).holders
    participants:
      - id: caller
        kind: actor
      - id: (*index).holders
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Sorted(maps.Keys(ix.entries[key]))
        to: slices
  - of: (*Store).indexKeys
    participants:
      - id: caller
        kind: actor
      - id: (*Store).indexKeys
        kind: self
      - id: ix.keysOf
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: len(s.indexes) == 0
      - bind: out
        eval: make([][]string, len(s.indexes))
      - loop:
          do:
            - set: out[i]
              to: ix.keysOf
              value: ix.keysOf(v)
          key: i
          range: s.indexes
          value: ix
      - return: out
  - of: (*Store).file
    participants:
      - id: caller
        kind: actor
      - id: (*Store).file
        kind: self
      - id: ix.set
        kind: internal
    steps:
      - loop:
          do:
            - eval: ix.set(owner, keys[i])
              to: ix.set
          key: i
          range: s.indexes
          value: ix
  - of: (*Store).unfile
    participants:
      - id: caller
        kind: actor
      - id: (*Store).unfile
        kind: self
      - id: ix.drop
        kind: internal
    steps:
      - loop:
          do:
            - eval: ix.drop(owner)
              to: ix.drop
          key: _
          range: s.indexes
          value: ix
  - of: (*Store).rebuild
    participants:
      - id: caller
        kind: actor
      - id: (*Store).rebuild
        kind: self
      - id: s.deferOrders
        kind: internal
      - id: s.decode
        kind: internal
      - id: loadFailed
        kind: internal
      - id: s.indexKeys
        kind: internal
      - id: s.uniqueTaken
        kind: internal
      - id: kerrs
        kind: package
      - id: s.file
        kind: internal
      - id: ix.resort
        kind: internal
    steps:
      - eval: s.deferOrders()
        to: s.deferOrders
      - defer: |-
          func() {
          		recovered := recover()
          		//: the ordinary path.
          		if recovered == nil {
          			return
          		}
          		//: a key function that panics on stored data is data the index cannot
          		//: hold; the value travels as a field, never as the origin.
          		err = kerrs.Wrap(coredocstore.IndexBroken, kerrs.WrapParams{},
          			kerrs.String("problem", "a key function panicked"), kerrs.String("panic", fmt.Sprint(recovered)))
          	}()
      - loop:
          do:
            - bind: v, decodeErr
              eval: s.decode(s.docs[key])
              to: s.decode
            - opt:
                do:
                  - return: decodeErr
                when: decodeErr != nil
            - opt:
                do:
                  - return: loadFailed(s.origin(key), "holds a document under another key than its own", nil)
                    to: loadFailed
                when: s.key(v) != key
            - bind: keys
              eval: s.indexKeys(v)
              to: s.indexKeys
            - opt:
                do:
                  - return: |-
                      kerrs.Wrap(coredocstore.IndexBroken, kerrs.WrapParams{},
                      				kerrs.String("problem", "two documents share a unique key"), kerrs.String("index", name))
                    to: kerrs
                init:
                  bind: name, taken
                  eval: s.uniqueTaken(key, keys)
                  to: s.uniqueTaken
                when: taken
            - eval: s.file(key, keys)
              to: s.file
          key: _
          range: sortedKeys(s.docs)
          value: key
      - loop:
          do:
            - eval: ix.resort()
              to: ix.resort
          key: _
          range: s.indexes
          value: ix
      - return: nil
  - of: (*Store).load
    participants:
      - id: caller
        kind: actor
      - id: (*Store).load
        kind: self
      - id: path
        kind: stdlib
      - id: s.makeDir
        kind: internal
      - id: fs
        kind: stdlib
      - id: s.syncCreated
        kind: internal
      - id: s.readSnapshot
        kind: internal
      - id: s.replayOverSnapshot
        kind: internal
    steps:
      - var:
          name: created
          type: "[]string"
      - opt:
          do:
            - bind: made, mkErr
              eval: s.makeDir(dir)
              to: s.makeDir
            - opt:
                do:
                  - return: false, mkErr
                when: mkErr != nil
            - set: created
              value: append(created, made...)
          init:
            bind: dir
            eval: path.Dir(s.path)
            to: path
          when: dir != "."
      - bind: _, statErr
        eval: fs.Stat(s.fs, s.overlay)
        to: fs
      - bind: overlayExisted
        eval: statErr == nil
      - bind: made, mkErr
        eval: s.makeDir(s.overlay)
        to: s.makeDir
      - opt:
          do:
            - return: false, mkErr
          when: mkErr != nil
      - opt:
          do:
            - return: false, syncErr
          init:
            bind: syncErr
            eval: s.syncCreated(append(created, made...))
            to: s.syncCreated
          when: syncErr != nil
      - bind: snapshotFound, readErr
        eval: s.readSnapshot()
        to: s.readSnapshot
      - opt:
          do:
            - return: false, readErr
          when: readErr != nil
      - opt:
          do:
            - return: false, replayErr
          init:
            bind: replayErr
            eval: s.replayOverSnapshot()
            to: s.replayOverSnapshot
          when: replayErr != nil
      - return: "!snapshotFound || !overlayExisted || len(s.pending) > 0, nil"
  - of: (*Store).makeDir
    participants:
      - id: caller
        kind: actor
      - id: (*Store).makeDir
        kind: self
      - id: strings
        kind: stdlib
      - id: fs
        kind: stdlib
      - id: s.fs.MkdirAll
        kind: value
    steps:
      - bind: parts
        eval: strings.Split(dir, "/")
        to: strings
      - loop:
          do:
            - bind: prefix
              eval: strings.Join(parts[:i+1], "/")
              to: strings
            - opt:
                do:
                  - set: created
                    value: append(created, prefix)
                init:
                  bind: _, statErr
                  eval: fs.Stat(s.fs, prefix)
                  to: fs
                when: statErr != nil
          key: i
          range: parts
      - opt:
          do:
            - return: nil, loadFailed(dir, "cannot be created", mkErr)
          init:
            bind: mkErr
            eval: s.fs.MkdirAll(dir, dirPerm)
            to: s.fs.MkdirAll
          when: mkErr != nil
      - return: created, nil
  - of: (*Store).syncCreated
    participants:
      - id: caller
        kind: actor
      - id: (*Store).syncCreated
        kind: self
      - id: path
        kind: stdlib
      - id: syncer.SyncDir
        kind: value
      - id: loadFailed
        kind: internal
    steps:
      - bind: syncer, ok
        eval: s.fs.(corevfs.DirSyncer)
      - opt:
          do:
            - return: nil
          when: "!ok"
      - loop:
          do:
            - bind: parent
              eval: path.Dir(dir)
              to: path
            - opt:
                do:
                  - return: loadFailed(parent, "cannot be flushed", syncErr)
                    to: loadFailed
                init:
                  bind: syncErr
                  eval: syncer.SyncDir(parent)
                  to: syncer.SyncDir
                when: syncErr != nil
          key: _
          range: slices.Backward(created)
          value: dir
      - return: nil
  - of: (*Store).replayOverSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Store).replayOverSnapshot
        kind: self
      - id: s.readVersions
        kind: internal
      - id: s.readOverlay
        kind: internal
      - id: s.versionsWithoutDocument
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsErr
          init:
            bind: versionsErr
            eval: s.readVersions()
            to: s.readVersions
          when: versionsErr != nil
      - opt:
          do:
            - return: replayErr
          init:
            bind: replayErr
            eval: s.readOverlay()
            to: s.readOverlay
          when: replayErr != nil
      - return: s.versionsWithoutDocument()
        to: s.versionsWithoutDocument
  - of: (*Store).readSnapshot
    participants:
      - id: caller
        kind: actor
      - id: (*Store).readSnapshot
        kind: self
      - id: fs
        kind: stdlib
      - id: json
        kind: stdlib
    steps:
      - bind: raw, readErr
        eval: fs.ReadFile(s.fs, s.path)
        to: fs
      - opt:
          do:
            - return: false, nil
          when: errors.Is(readErr, fs.ErrNotExist)
      - opt:
          do:
            - return: false, loadFailed(s.path, "unreadable", readErr)
          when: readErr != nil
      - var:
          name: object
          type: map[string]json.RawMessage
      - opt:
          do:
            - return: |-
                false, kerrs.Wrap(coredocstore.LoadFailed, kerrs.WrapParams{},
                			kerrs.String("file", s.path), kerrs.String("problem", "not a snapshot"), kerrs.String("cause", jsonCause(decodeErr, reflect.TypeOf(object))))
          init:
            bind: decodeErr
            eval: json.Unmarshal(raw, &object)
            to: json
          when: decodeErr != nil
      - opt:
          do:
            - return: false, loadFailed(s.path, "is null, not a snapshot", nil)
          when: object == nil
      - loop:
          do:
            - opt:
                do:
                  - return: false, loadFailed(s.path, "holds a document under the empty key", nil)
                when: key == ""
            - set: s.docs[key]
              value: document
          key: key
          range: object
          value: document
      - return: true, nil
  - of: (*Store).readOverlay
    participants:
      - id: caller
        kind: actor
      - id: (*Store).readOverlay
        kind: self
      - id: fs
        kind: stdlib
      - id: loadFailed
        kind: internal
      - id: entry.Name
        kind: value
      - id: s.replay
        kind: internal
      - id: swallowLeftover
        kind: internal
      - id: s.replayGroup
        kind: internal
    steps:
      - bind: entries, listErr
        eval: fs.ReadDir(s.fs, s.overlay)
        to: fs
      - opt:
          do:
            - return: loadFailed(s.overlay, "unreadable", listErr)
              to: loadFailed
          when: listErr != nil
      - bind: group
        eval: "false"
      - loop:
          do:
            - bind: name
              eval: entry.Name()
              to: entry.Name
            - switch:
                cases:
                  - case: name == groupEntryName
                    do:
                      - set: group
                        value: "true"
                  - case: isEntryName(name)
                    do:
                      - opt:
                          do:
                            - return: replayErr
                          init:
                            bind: replayErr
                            eval: s.replay(name)
                            to: s.replay
                          when: replayErr != nil
                  - case: strings.HasPrefix(name, leftoverPrefix) && strings.HasSuffix(name, leftoverSuffix)
                    do:
                      - eval: swallowLeftover(s.fs.Remove(path.Join(s.overlay, name)))
                        to: swallowLeftover
                  - default: true
          key: _
          range: entries
          value: entry
      - opt:
          do:
            - return: s.replayGroup()
              to: s.replayGroup
          when: group
      - return: nil
  - of: (*Store).replayGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Store).replayGroup
        kind: self
      - id: path
        kind: stdlib
      - id: fs
        kind: stdlib
      - id: loadFailed
        kind: internal
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
      - id: s.applyRecord
        kind: internal
    steps:
      - bind: file
        eval: path.Join(s.overlay, groupEntryName)
        to: path
      - bind: raw, readErr
        eval: fs.ReadFile(s.fs, file)
        to: fs
      - opt:
          do:
            - return: loadFailed(file, "unreadable", readErr)
              to: loadFailed
          when: readErr != nil
      - var:
          name: records
          type: "[]entryRecord"
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.LoadFailed, kerrs.WrapParams{},
                			kerrs.String("file", file), kerrs.String("problem", "not a group entry"), kerrs.String("cause", jsonCause(decodeErr, reflect.TypeOf(records))))
              to: kerrs
          init:
            bind: decodeErr
            eval: json.Unmarshal(raw, &records)
            to: json
          when: decodeErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: applyErr
                init:
                  bind: applyErr
                  eval: s.applyRecord(file, record)
                  to: s.applyRecord
                when: applyErr != nil
            - set: s.pending[entryName(record.Key)]
              value: struct{}{}
          key: _
          range: records
          value: record
      - set: s.pending[groupEntryName]
        value: struct{}{}
      - return: nil
  - of: (*Store).replay
    participants:
      - id: caller
        kind: actor
      - id: (*Store).replay
        kind: self
      - id: path
        kind: stdlib
      - id: fs
        kind: stdlib
      - id: loadFailed
        kind: internal
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
      - id: s.applyRecord
        kind: internal
    steps:
      - bind: file
        eval: path.Join(s.overlay, name)
        to: path
      - bind: raw, readErr
        eval: fs.ReadFile(s.fs, file)
        to: fs
      - opt:
          do:
            - return: loadFailed(file, "unreadable", readErr)
              to: loadFailed
          when: readErr != nil
      - var:
          name: record
          type: entryRecord
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.LoadFailed, kerrs.WrapParams{},
                			kerrs.String("file", file), kerrs.String("problem", "not an overlay entry"), kerrs.String("cause", jsonCause(decodeErr, reflect.TypeOf(record))))
              to: kerrs
          init:
            bind: decodeErr
            eval: json.Unmarshal(raw, &record)
            to: json
          when: decodeErr != nil
      - opt:
          do:
            - return: loadFailed(file, "names another key than its file", nil)
              to: loadFailed
          when: record.Key == "" || entryName(record.Key) != name
      - opt:
          do:
            - return: applyErr
          init:
            bind: applyErr
            eval: s.applyRecord(file, record)
            to: s.applyRecord
          when: applyErr != nil
      - set: s.pending[name]
        value: struct{}{}
      - return: nil
  - of: (*Store).applyRecord
    participants:
      - id: caller
        kind: actor
      - id: (*Store).applyRecord
        kind: self
      - id: loadFailed
        kind: internal
      - id: s.checkEntryVersions
        kind: internal
      - id: s.setVersions
        kind: internal
    steps:
      - opt:
          do:
            - return: loadFailed(file, "holds a record under the empty key", nil)
              to: loadFailed
          when: record.Key == ""
      - opt:
          do:
            - return: versionsErr
          init:
            bind: versionsErr
            eval: s.checkEntryVersions(file, record)
            to: s.checkEntryVersions
          when: versionsErr != nil
      - switch:
          cases:
            - case: record.Deleted
              do:
                - eval: delete(s.docs, record.Key)
                - eval: s.setVersions(record.Key, compacted(record.Versions))
                  to: s.setVersions
            - case: len(record.Document) == 0
              do:
                - return: loadFailed(file, "holds no document", nil)
                  to: loadFailed
            - default: true
              do:
                - set: s.docs[record.Key]
                  value: record.Document
                - eval: s.setVersions(record.Key, compacted(record.Versions))
                  to: s.setVersions
      - return: nil
  - of: (*Store).checkEntryVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).checkEntryVersions
        kind: self
      - id: loadFailed
        kind: internal
      - id: checkRecord
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: record.Versions == nil
      - opt:
          do:
            - return: "loadFailed(file, \"keeps versions, and the store keeps none: open it with Versions\", nil)"
              to: loadFailed
          when: s.keep == 0
      - opt:
          do:
            - return: loadFailed(file, "records a deletion and keeps versions", nil)
              to: loadFailed
          when: record.Deleted && record.Versions.Trashed == nil
      - opt:
          do:
            - return: loadFailed(file, "holds a document and a trashed one", nil)
              to: loadFailed
          when: "!record.Deleted && record.Versions.Trashed != nil"
      - return: checkRecord(file, record.Versions)
        to: checkRecord
  - of: (*Store).readVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).readVersions
        kind: self
      - id: fs
        kind: stdlib
      - id: loadFailed
        kind: internal
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
      - id: checkRecord
        kind: internal
      - id: s.setVersions
        kind: internal
    steps:
      - opt:
          do:
            - bind: _, statErr
              eval: fs.Stat(s.fs, s.versionsPath)
              to: fs
            - switch:
                cases:
                  - case: errors.Is(statErr, fs.ErrNotExist)
                    do:
                      - return: nil
                  - case: statErr != nil
                    do:
                      - return: loadFailed(s.versionsPath, "unreadable", statErr)
                        to: loadFailed
            - return: "loadFailed(s.versionsPath, \"keeps versions, and the store keeps none: open it with Versions, or remove the file to drop them\", nil)"
              to: loadFailed
          when: s.keep == 0
      - bind: raw, readErr
        eval: fs.ReadFile(s.fs, s.versionsPath)
        to: fs
      - opt:
          do:
            - return: nil
          when: errors.Is(readErr, fs.ErrNotExist)
      - opt:
          do:
            - return: loadFailed(s.versionsPath, "unreadable", readErr)
              to: loadFailed
          when: readErr != nil
      - var:
          name: records
          type: map[string]*versionsRecord
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.LoadFailed, kerrs.WrapParams{},
                			kerrs.String("file", s.versionsPath), kerrs.String("problem", "not a versions file"), kerrs.String("cause", jsonCause(decodeErr, reflect.TypeOf(records))))
              to: kerrs
          init:
            bind: decodeErr
            eval: json.Unmarshal(raw, &records)
            to: json
          when: decodeErr != nil
      - opt:
          do:
            - return: loadFailed(s.versionsPath, "is null, not a versions file", nil)
              to: loadFailed
          when: records == nil
      - loop:
          do:
            - opt:
                do:
                  - return: loadFailed(s.versionsPath, "holds versions under the empty key", nil)
                    to: loadFailed
                when: key == ""
            - opt:
                do:
                  - return: recordErr
                init:
                  bind: recordErr
                  eval: checkRecord(s.versionsPath, record)
                  to: checkRecord
                when: recordErr != nil
            - eval: s.setVersions(key, compacted(record))
              to: s.setVersions
          key: key
          range: records
          value: record
      - return: nil
  - of: (*Store).versionsWithoutDocument
    participants:
      - id: caller
        kind: actor
      - id: (*Store).versionsWithoutDocument
        kind: self
      - id: loadFailed
        kind: internal
    steps:
      - loop:
          do:
            - bind: _, found
              eval: s.docs[key]
            - opt:
                do:
                  - return: loadFailed(s.versionsPath, "holds versions of a document the store does not hold, or trashed a document it holds", nil)
                    to: loadFailed
                when: found == (record.Trashed != nil)
          key: key
          range: s.versions
          value: record
      - return: nil
  - of: checkRecord
    participants:
      - id: caller
        kind: actor
      - id: checkRecord
        kind: self
      - id: loadFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: loadFailed(file, "holds versions that are null", nil)
              to: loadFailed
          when: record == nil
      - bind: newer
        eval: record.Current.Number
      - opt:
          do:
            - return: loadFailed(file, "holds a version numbered 0", nil)
              to: loadFailed
          when: newer == 0
      - opt:
          do:
            - return: loadFailed(file, "holds a trashed document without a document", nil)
              to: loadFailed
          when: record.Trashed != nil && len(record.Trashed.Document) == 0
      - loop:
          do:
            - switch:
                cases:
                  - case: former.Number == 0
                    do:
                      - return: loadFailed(file, "holds a version numbered 0", nil)
                        to: loadFailed
                  - case: former.Number >= newer
                    do:
                      - return: loadFailed(file, "holds versions out of order", nil)
                        to: loadFailed
                  - case: len(former.Document) == 0
                    do:
                      - return: loadFailed(file, "holds a version without a document", nil)
                        to: loadFailed
                  - default: true
            - set: newer
              value: former.Number
          key: _
          range: record.Former
          value: former
      - return: nil
  - of: compacted
    participants:
      - id: caller
        kind: actor
      - id: compacted
        kind: self
      - id: compactJSON
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: record == nil
      - loop:
          do:
            - set: record.Former[i].Document
              to: compactJSON
              value: compactJSON(record.Former[i].Document)
          key: i
          range: record.Former
      - opt:
          do:
            - set: record.Trashed.Document
              to: compactJSON
              value: compactJSON(record.Trashed.Document)
          when: record.Trashed != nil
      - return: record
  - of: (*Store).origin
    participants:
      - id: caller
        kind: actor
      - id: (*Store).origin
        kind: self
      - id: entryName
        kind: internal
      - id: path
        kind: stdlib
    steps:
      - bind: name
        eval: entryName(key)
        to: entryName
      - opt:
          do:
            - return: path.Join(s.overlay, name)
              to: path
          init:
            bind: _, replayed
            eval: s.pending[name]
          when: replayed
      - return: s.path
  - of: loadFailed
    participants:
      - id: caller
        kind: actor
      - id: loadFailed
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: fields
        eval: "[]kerrs.FieldValue{kerrs.String(\"file\", file), kerrs.String(\"problem\", problem)}"
      - opt:
          do:
            - set: fields
              value: append(fields, kerrs.String("cause", cause.Error()))
          when: cause != nil
      - return: kerrs.Wrap(coredocstore.LoadFailed, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: swallowLeftover
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: Open
    participants:
      - id: caller
        kind: actor
      - id: Open
        kind: self
      - id: cfg.validate
        kind: internal
      - id: newStore
        kind: internal
      - id: store.open
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: cfg.validate(indexes)
            to: cfg.validate
          when: invalid != nil
      - bind: store
        eval: newStore(cfg, indexes)
        to: newStore
      - opt:
          do:
            - return: nil, openErr
          init:
            bind: openErr
            eval: store.open()
            to: store.open
          when: openErr != nil
      - return: store, nil
  - of: newStore
    participants:
      - id: caller
        kind: actor
      - id: newStore
        kind: self
      - id: newIndex
        kind: internal
    steps:
      - bind: store
        eval: |-
          &Store[T]{
          		key:          cfg.Key,
          		fs:           cfg.FS,
          		byName:       make(map[string]*index[T], len(indexes)),
          		docs:         map[string]json.RawMessage{},
          		pending:      map[string]struct{}{},
          		clock:        cfg.Clock,
          		held:         cfg.Held,
          		path:         cfg.Path,
          		overlay:      cfg.Path + overlaySuffix,
          		versionsPath: cfg.Path + versionsSuffix,
          		foldAt:       cfg.FoldAt,
          		keep:         cfg.Versions,
          	}
      - opt:
          do:
            - set: store.clock
              value: clock.System
          when: store.clock == nil
      - opt:
          do:
            - set: store.versions
              value: map[string]*versionsRecord{}
          when: cfg.Versions > 0
      - loop:
          do:
            - bind: ix
              eval: newIndex(spec)
              to: newIndex
            - set: store.indexes
              value: append(store.indexes, ix)
            - set: store.byName[spec.Name]
              value: ix
          key: _
          range: indexes
          value: spec
      - return: store
  - of: (*Store).open
    participants:
      - id: caller
        kind: actor
      - id: (*Store).open
        kind: self
      - id: s.load
        kind: internal
      - id: s.rebuild
        kind: internal
      - id: s.fold
        kind: internal
    steps:
      - bind: needsFold
        eval: "false"
      - opt:
          do:
            - var:
                name: loadErr
                type: error
            - set: needsFold, loadErr
              to: s.load
              value: s.load()
            - opt:
                do:
                  - return: loadErr
                when: loadErr != nil
          when: s.fs != nil
      - opt:
          do:
            - return: rebuildErr
          init:
            bind: rebuildErr
            eval: s.rebuild()
            to: s.rebuild
          when: rebuildErr != nil
      - opt:
          do:
            - return: nil
          when: "!needsFold"
      - return: s.fold()
        to: s.fold
  - of: (*Store).Documents
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Documents
        kind: self
      - id: pages.next
        kind: internal
      - id: s.documentsPage
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(coredocstore.EntryValue, error) bool
            steps:
              - bind: pages
                eval: "pager{limit: limit}"
              - loop:
                  do:
                    - bind: want
                      eval: pages.next()
                      to: pages.next
                    - bind: page, err
                      eval: s.documentsPage(after, want)
                      to: s.documentsPage
                    - opt:
                        do:
                          - return: ""
                        when: "!yieldEntries(yield, page, err) || !pages.read(len(page), want)"
                    - set: after
                      value: page[len(page)-1].Key
                  forever: true
  - of: (*pager).next
    steps:
      - opt:
          do:
            - return: documentsPageLen
          when: p.limit <= 0 || p.limit-p.done >= documentsPageLen
      - return: p.limit - p.done
  - of: (*pager).read
    steps:
      - op: +=
        set: p.done
        value: got
      - return: got == want && (p.limit <= 0 || p.done < p.limit)
  - of: (*Store).documentsPage
    participants:
      - id: caller
        kind: actor
      - id: (*Store).documentsPage
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: smallestAfter
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - opt:
          do:
            - eval: s.mu.RUnlock()
              to: s.mu.RUnlock
            - return: nil, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: keys
        eval: smallestAfter(s.docs, after, n)
        to: smallestAfter
      - bind: page
        eval: make([]coredocstore.EntryValue, len(keys))
      - loop:
          do:
            - set: page[i]
              value: "coredocstore.EntryValue{Key: key, JSON: s.docs[key]}"
          key: i
          range: keys
          value: key
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - set: page[i].JSON
              to: slices
              value: slices.Clone(page[i].JSON)
          key: i
          range: page
      - return: page, nil
  - of: smallestAfter
    participants:
      - id: caller
        kind: actor
      - id: smallestAfter
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: out
        eval: make([]string, 0, 2*n)
      - bind: ceiling, bounded
        eval: "\"\", false"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: key <= after || (bounded && key >= ceiling)
            - set: out
              value: append(out, key)
            - opt:
                do:
                  - eval: slices.Sort(out)
                    to: slices
                  - set: out
                    value: out[:n]
                  - set: ceiling, bounded
                    value: out[n-1], true
                when: len(out) == 2*n
          key: key
          range: m
      - eval: slices.Sort(out)
        to: slices
      - opt:
          do:
            - set: out
              value: out[:n]
          when: len(out) > n
      - return: out
  - of: (*Store).FindAfter
    participants:
      - id: caller
        kind: actor
      - id: (*Store).FindAfter
        kind: self
      - id: yieldFailure
        kind: internal
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: s.yieldDecoded
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(T, error) bool
            steps:
              - bind: ix, found
                eval: s.byName[index]
              - opt:
                  do:
                    - eval: yieldFailure(yield, kerrs.Wrap(coredocstore.IndexUnknown, kerrs.WrapParams{}, kerrs.String("index", index)))
                      to: yieldFailure
                    - return: ""
                  when: "!found"
              - eval: s.mu.RLock()
                to: s.mu.RLock
              - bind: owners, closed
                eval: ix.holders(key), s.closed
              - bind: start, _
                eval: slices.BinarySearch(owners, after)
                to: slices
              - opt:
                  do:
                    - op: ++
                      set: start
                  when: start < len(owners) && owners[start] == after
              - set: owners
                value: owners[start:]
              - opt:
                  do:
                    - set: owners
                      value: owners[:limit]
                  when: limit > 0 && len(owners) > limit
              - bind: entries
                eval: make([]coredocstore.EntryValue, len(owners))
              - loop:
                  do:
                    - set: entries[i]
                      value: "coredocstore.EntryValue{Key: owner, JSON: s.docs[owner]}"
                  key: i
                  range: owners
                  value: owner
              - eval: s.mu.RUnlock()
                to: s.mu.RUnlock
              - eval: s.yieldDecoded(yield, entries, closed)
                to: s.yieldDecoded
  - of: (*Store).Range
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Range
        kind: self
      - id: yieldFailure
        kind: internal
      - id: s.mu.RLock
        kind: value
      - id: ix.between
        kind: internal
      - id: s.mu.RUnlock
        kind: value
      - id: s.yieldDecoded
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(T, error) bool
            steps:
              - bind: ix, found
                eval: s.byName[index]
              - opt:
                  do:
                    - eval: yieldFailure(yield, notOrdered(index, found))
                      to: yieldFailure
                    - return: ""
                  when: "!found || ix.order == unordered"
              - eval: s.mu.RLock()
                to: s.mu.RLock
              - bind: closed
                eval: s.closed
              - var:
                  name: entries
                  type: "[]coredocstore.EntryValue"
              - opt:
                  do:
                    - bind: between
                      eval: ix.between(lo, hi, limit)
                      to: ix.between
                    - set: entries
                      value: make([]coredocstore.EntryValue, len(between))
                    - loop:
                        do:
                          - set: entries[i]
                            value: "coredocstore.EntryValue{Key: entry.owner, JSON: s.docs[entry.owner]}"
                        key: i
                        range: between
                        value: entry
                  when: "!closed"
              - eval: s.mu.RUnlock()
                to: s.mu.RUnlock
              - eval: s.yieldDecoded(yield, entries, closed)
                to: s.yieldDecoded
  - of: yieldFailure
    steps:
      - var:
          name: zero
          type: V
      - opt:
          do:
            - return: ""
          when: "!yield(zero, err)"
  - of: notOrdered
    participants:
      - id: caller
        kind: actor
      - id: notOrdered
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.IndexUnknown, kerrs.WrapParams{}, kerrs.String("index", index))
              to: kerrs
          when: "!declared"
      - return: kerrs.Wrap(coredocstore.IndexNotOrdered, kerrs.WrapParams{}, kerrs.String("index", index))
        to: kerrs
  - of: (*Store).yieldDecoded
    participants:
      - id: caller
        kind: actor
      - id: (*Store).yieldDecoded
        kind: self
      - id: s.decode
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - opt:
          do:
            - eval: yield(zero, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{}))
            - return: ""
          when: closed
      - loop:
          do:
            - bind: v, err
              eval: s.decode(entry.JSON)
              to: s.decode
            - opt:
                do:
                  - eval: yield(zero, err)
                  - return: ""
                when: err != nil
            - opt:
                do:
                  - return: ""
                when: "!yield(v, nil)"
          key: _
          range: entries
          value: entry
  - of: entryName
    participants:
      - id: caller
        kind: actor
      - id: entryName
        kind: self
      - id: sha256
        kind: stdlib
    steps:
      - bind: sum
        eval: sha256.Sum256([]byte(key))
        to: sha256
      - return: hex.EncodeToString(sum[:]) + entrySuffix
  - of: (*Store).markPending
    steps:
      - opt:
          do:
            - set: s.pending[entryName(key)]
              value: struct{}{}
          when: s.fs != nil
  - of: (*Store).persist
    participants:
      - id: caller
        kind: actor
      - id: (*Store).persist
        kind: self
      - id: s.settleGroup
        kind: internal
      - id: s.persistEntry
        kind: internal
    steps:
      - opt:
          do:
            - return: settleErr
          init:
            bind: settleErr
            eval: s.settleGroup()
            to: s.settleGroup
          when: settleErr != nil
      - return: s.persistEntry(key, raw, deleted, versions)
        to: s.persistEntry
  - of: (*Store).persistEntry
    participants:
      - id: caller
        kind: actor
      - id: (*Store).persistEntry
        kind: self
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
      - id: s.publish
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.fs == nil
      - bind: record, encodeErr
        eval: "json.Marshal(entryRecord{Versions: versions, Document: raw, Key: key, Deleted: deleted})"
        to: json
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.PersistFailed, kerrs.WrapParams{},
                			kerrs.String("store", s.path), kerrs.String("step", "entry"), kerrs.String("cause", encodeCause(encodeErr)))
              to: kerrs
          when: encodeErr != nil
      - return: s.publish(path.Join(s.overlay, entryName(key)), record, "entry")
        to: s.publish
  - of: (*Store).publish
    participants:
      - id: caller
        kind: actor
      - id: (*Store).publish
        kind: self
      - id: s.fs.WriteAtomic
        kind: value
      - id: kerrs
        kind: package
    steps:
      - bind: publishErr
        eval: s.fs.WriteAtomic(name, data, filePerm)
        to: s.fs.WriteAtomic
      - opt:
          do:
            - return: nil
          when: publishErr == nil
      - bind: fields
        eval: |-
          []kerrs.FieldValue{
          		kerrs.String("store", s.path), kerrs.String("step", step), kerrs.String("cause", publishErr.Error()),
          	}
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.WriteUnconfirmed, kerrs.WrapParams{}, fields...)
              to: kerrs
          when: kerrs.HasCode(publishErr, corevfs.CodeDirectorySyncFailed)
      - return: kerrs.Wrap(coredocstore.PersistFailed, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: (*Store).maybeFold
    participants:
      - id: caller
        kind: actor
      - id: (*Store).maybeFold
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: s.fs == nil || s.foldAt < 0
      - bind: threshold
        eval: s.foldAt
      - opt:
          do:
            - set: threshold
              value: max(DefaultFoldAt, len(s.docs))
          when: threshold == 0
      - opt:
          do:
            - return: ""
          when: len(s.pending) < threshold
      - eval: swallowErr(s.fold())
        to: swallowErr
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: (*Store).Fold
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Fold
        kind: self
      - id: kerrs
        kind: package
      - id: s.fold
        kind: internal
    steps:
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
              to: kerrs
          when: s.closed
      - return: s.fold()
        to: s.fold
  - of: (*Store).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Close
        kind: self
      - id: s.fold
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: nil
          when: s.closed
      - var:
          name: foldErr
          type: error
      - opt:
          do:
            - set: foldErr
              to: s.fold
              value: s.fold()
          when: len(s.pending) > 0
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.closed
        value: "true"
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: foldErr
  - of: (*Store).fold
    participants:
      - id: caller
        kind: actor
      - id: (*Store).fold
        kind: self
      - id: s.foldVersions
        kind: internal
      - id: s.recordFold
        kind: internal
      - id: encodeSnapshot
        kind: internal
      - id: kerrs
        kind: package
      - id: s.publish
        kind: internal
      - id: s.removeFolded
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.fs == nil
      - opt:
          do:
            - eval: s.recordFold(versionsErr, nil)
              to: s.recordFold
            - return: versionsErr
          init:
            bind: versionsErr
            eval: s.foldVersions()
            to: s.foldVersions
          when: versionsErr != nil
      - bind: snapshot, encodeErr
        eval: encodeSnapshot(s.docs)
        to: encodeSnapshot
      - opt:
          do:
            - bind: foldErr
              eval: |-
                kerrs.Wrap(coredocstore.PersistFailed, kerrs.WrapParams{},
                			kerrs.String("store", s.path), kerrs.String("step", "snapshot"), kerrs.String("cause", encodeCause(encodeErr)))
              to: kerrs
            - eval: s.recordFold(foldErr, nil)
              to: s.recordFold
            - return: foldErr
          when: encodeErr != nil
      - opt:
          do:
            - eval: s.recordFold(publishErr, nil)
              to: s.recordFold
            - return: publishErr
          init:
            bind: publishErr
            eval: s.publish(s.path, snapshot, "snapshot")
            to: s.publish
          when: publishErr != nil
      - bind: removed, removeErr
        eval: s.removeFolded()
        to: s.removeFolded
      - eval: s.recordFold(removeErr, removed)
        to: s.recordFold
      - opt:
          do:
            - set: s.lingering
              value: nil
          when: removeErr == nil
      - return: removeErr
  - of: (*Store).removeFolded
    participants:
      - id: caller
        kind: actor
      - id: (*Store).removeFolded
        kind: self
      - id: s.fs.Remove
        kind: value
    steps:
      - set: removed
        value: make([]string, 0, len(s.pending))
      - var:
          name: failures
          type: "[]error"
      - loop:
          do:
            - bind: removeErr
              eval: s.fs.Remove(path.Join(s.overlay, name))
              to: s.fs.Remove
            - opt:
                do:
                  - set: removed
                    value: append(removed, name)
                  - continue: true
                when: removeErr == nil || errors.Is(removeErr, fs.ErrNotExist)
            - set: failures
              value: append(failures, removeErr)
          key: name
          range: s.pending
      - opt:
          do:
            - return: removed, nil
          when: len(failures) == 0
      - return: |-
          removed, kerrs.Wrap(coredocstore.PersistFailed, kerrs.WrapParams{},
          		kerrs.String("store", s.path), kerrs.String("step", "remove folded entries"),
          		kerrs.Int("remaining", len(failures)), kerrs.String("cause", failures[0].Error()))
  - of: (*Store).recordFold
    steps:
      - lock:
          mutex: s.mu
      - loop:
          do:
            - eval: delete(s.pending, name)
          key: _
          range: removed
          value: name
      - opt:
          do:
            - op: ++
              set: s.folds
          when: removed != nil
      - set: s.foldErr
        value: foldErr
  - of: encodeSnapshot
    participants:
      - id: caller
        kind: actor
      - id: encodeSnapshot
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.MarshalIndent(docs, "", "  ")
        to: json
  - of: (*Store).foldVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).foldVersions
        kind: self
      - id: json
        kind: stdlib
      - id: kerrs
        kind: package
      - id: s.publish
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.keep == 0
      - bind: versions, encodeErr
        eval: json.MarshalIndent(s.versions, "", "  ")
        to: json
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.PersistFailed, kerrs.WrapParams{},
                			kerrs.String("store", s.path), kerrs.String("step", "versions"), kerrs.String("cause", encodeCause(encodeErr)))
              to: kerrs
          when: encodeErr != nil
      - return: s.publish(s.versionsPath, versions, "versions")
        to: s.publish
  - of: (*Store).Revision
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Revision
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: s.decode
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: raw, found
        eval: s.docs[key]
      - bind: closed
        eval: s.closed
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - opt:
          do:
            - return: zero, "", kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: closed
      - opt:
          do:
            - return: zero, "", kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: "!found"
      - bind: v, err
        eval: s.decode(raw)
        to: s.decode
      - opt:
          do:
            - return: zero, "", err
          when: err != nil
      - return: v, revisionOf(raw), nil
  - of: (*Store).ReplaceIf
    participants:
      - id: caller
        kind: actor
      - id: (*Store).ReplaceIf
        kind: self
      - id: s.prepare
        kind: internal
      - id: s.commitIf
        kind: internal
      - id: s.onWrite.call
        kind: internal
    steps:
      - bind: p, prepErr
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: prepErr
          when: prepErr != nil
      - bind: applied, err
        eval: s.commitIf(p, rev)
        to: s.commitIf
      - opt:
          do:
            - eval: s.onWrite.call(p.key)
              to: s.onWrite.call
          when: applied
      - return: err
  - of: (*Store).commitIf
    participants:
      - id: caller
        kind: actor
      - id: (*Store).commitIf
        kind: self
      - id: s.persistAndApply
        kind: internal
    steps:
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: stored, found
        eval: s.docs[p.key]
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: "!found"
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.RevisionMismatch, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: revisionOf(stored) != rev
      - return: s.persistAndApply(p, coredocstore.StampValue{})
        to: s.persistAndApply
  - of: revisionOf
    participants:
      - id: caller
        kind: actor
      - id: revisionOf
        kind: self
      - id: compact.Reset
        kind: value
      - id: compact.Write
        kind: value
      - id: json
        kind: stdlib
      - id: sha256
        kind: stdlib
      - id: coredocstore
        kind: package
    steps:
      - var:
          name: compact
          type: bytes.Buffer
      - opt:
          do:
            - eval: compact.Reset()
              to: compact.Reset
            - eval: compact.Write(raw)
              to: compact.Write
          when: json.Compact(&compact, raw) != nil
      - var:
          name: marshalled
          type: bytes.Buffer
      - eval: json.HTMLEscape(&marshalled, compact.Bytes())
        to: json
      - bind: sum
        eval: sha256.Sum256(marshalled.Bytes())
        to: sha256
      - return: coredocstore.RevisionValue(hex.EncodeToString(sum[:]))
        to: coredocstore
  - of: (*sqlBatchWriter).Put
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBatchWriter).Put
        kind: self
      - id: w.record
        kind: internal
    steps:
      - return: w.record(v, upsert)
        to: w.record
  - of: (*sqlBatchWriter).Insert
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBatchWriter).Insert
        kind: self
      - id: w.record
        kind: internal
    steps:
      - return: w.record(v, insertOnly)
        to: w.record
  - of: (*sqlBatchWriter).Replace
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBatchWriter).Replace
        kind: self
      - id: w.record
        kind: internal
    steps:
      - return: w.record(v, replaceOnly)
        to: w.record
  - of: (*sqlBatchWriter).Delete
    steps:
      - set: w.ops
        value: "append(w.ops, sqlBatchOp{key: key})"
      - return: nil
  - of: (*sqlBatchWriter).record
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBatchWriter).record
        kind: self
      - id: w.store.prepare
        kind: internal
    steps:
      - bind: p, err
        eval: w.store.prepare(v)
        to: w.store.prepare
      - opt:
          do:
            - return: err
          when: err != nil
      - set: w.ops
        value: "append(w.ops, sqlBatchOp{p: p, key: p.key, mode: mode})"
      - return: nil
  - of: (*SQLStore).Batch
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Batch
        kind: self
      - id: s.run
        kind: internal
      - id: s.settle
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - bind: w
        eval: "&sqlBatchWriter[T]{store: s}"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: fn(w)
          when: err != nil
      - opt:
          do:
            - return: nil
          when: len(w.ops) == 0
      - bind: err
        eval: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: in order, each write seeing the ones before it in the transaction.
          		for _, op := range w.ops {
          			//: a deletion, or a write.
          			if op.p == nil {
          				//: DocumentNotFound, or a failure: the batch rolls back.
          				if removeErr := s.remove(txCtx, ex, op.key); removeErr != nil {
          					//: the first refusal refuses the batch.
          					return removeErr
          				}
          				continue
          			}
          			//: DocumentExists, DocumentNotFound, a collision, or a failure.
          			if writeErr := s.writeIn(txCtx, ex, op.p, op.mode, coredocstore.StampValue{}); writeErr != nil {
          				//: the first refusal refuses the batch.
          				return writeErr
          			}
          		}
          		//: every write sent.
          		return nil
          	})
        to: s.run
      - opt:
          do:
            - return: s.settle(ctx, err)
              to: s.settle
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - eval: s.announce(ctx, &s.onDelete, op.key)
                    to: s.announce
                  - continue: true
                when: op.p == nil
            - eval: s.announce(ctx, &s.onWrite, op.key)
              to: s.announce
          key: _
          range: w.ops
          value: op
      - return: nil
  - of: (*SQLConfig).validate
    participants:
      - id: caller
        kind: actor
      - id: (*SQLConfig).validate
        kind: self
      - id: validateTransactor
        kind: internal
      - id: validateTable
        kind: internal
      - id: validateVersions
        kind: internal
      - id: validateSQLIndexes
        kind: internal
    steps:
      - opt:
          do:
            - return: txParts{}, misconfigured("Key", "nil")
          when: c.Key == nil
      - bind: parts, err
        eval: validateTransactor(c.Transactor)
        to: validateTransactor
      - opt:
          do:
            - return: txParts{}, err
          when: err != nil
      - opt:
          do:
            - return: "txParts{}, misconfigured(\"Dialect\", \"not one the SDK speaks: \"+c.Dialect.String())"
          when: "!c.Dialect.Valid()"
      - opt:
          do:
            - return: txParts{}, tableErr
          init:
            bind: tableErr
            eval: validateTable(c.Table)
            to: validateTable
          when: tableErr != nil
      - opt:
          do:
            - return: txParts{}, versionsErr
          init:
            bind: versionsErr
            eval: validateVersions(c.Versions, c.Held != nil)
            to: validateVersions
          when: versionsErr != nil
      - opt:
          do:
            - return: txParts{}, ixErr
          init:
            bind: ixErr
            eval: validateSQLIndexes(indexes)
            to: validateSQLIndexes
          when: ixErr != nil
      - return: parts, nil
  - of: validateSQLIndexes
    participants:
      - id: caller
        kind: actor
      - id: validateSQLIndexes
        kind: self
      - id: validateIndexes
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: validateIndexes(indexes)
            to: validateIndexes
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      kerrs.Wrap(coredocstore.StoreMisconfigured, kerrs.WrapParams{},
                      				kerrs.String("setting", "Indexes"), kerrs.String("problem", "a name longer than "+strconv.Itoa(MaxSQLIndexNameLen)+" bytes"),
                      				kerrs.String("index", spec.Name))
                    to: kerrs
                when: len(spec.Name) > MaxSQLIndexNameLen
          key: _
          range: indexes
          value: spec
      - return: nil
  - of: validateTransactor
    steps:
      - opt:
          do:
            - return: txParts{}, misconfigured("Transactor", "nil")
          when: tm == nil
      - bind: joiner, joins
        eval: tm.(coresql.Joiner)
      - bind: deferrer, defers
        eval: tm.(coresql.Deferrer)
      - opt:
          do:
            - return: txParts{}, misconfigured("Transactor", "not a core/data/sql Joiner and Deferrer")
          when: "!joins || !defers"
      - return: "txParts{join: joiner, hold: deferrer}, nil"
  - of: validateTable
    participants:
      - id: caller
        kind: actor
      - id: validateTable
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.StoreMisconfigured, kerrs.WrapParams{},
                			kerrs.String("setting", "Table"), kerrs.String("problem", "not a lower-case SQL identifier"), kerrs.String("table", table))
              to: kerrs
          when: "!isTableName(table)"
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.StoreMisconfigured, kerrs.WrapParams{},
                			kerrs.String("setting", "Table"), kerrs.String("problem", "longer than "+strconv.Itoa(MaxSQLTableLen)+" bytes"),
                			kerrs.String("table", table))
              to: kerrs
          when: len(table) > MaxSQLTableLen
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.StoreMisconfigured, kerrs.WrapParams{},
                			kerrs.String("setting", "Table"), kerrs.String("problem", "holds three underscores in a row"), kerrs.String("table", table))
              to: kerrs
          when: strings.Contains(table, derivedSeparator)
      - opt:
          do:
            - return: |-
                kerrs.Wrap(coredocstore.StoreMisconfigured, kerrs.WrapParams{},
                			kerrs.String("setting", "Table"), kerrs.String("problem", "starts with sqlite_, which SQLite reserves"), kerrs.String("table", table))
              to: kerrs
          when: strings.HasPrefix(table, reservedTablePrefix)
      - return: nil
  - of: indexTable
    steps:
      - return: table + derivedSeparator + indexTableTag
  - of: versionsTable
    steps:
      - return: table + derivedSeparator + versionsTableTag
  - of: trashIndex
    steps:
      - return: table + derivedSeparator + trashIndexTag
  - of: renderStatements
    participants:
      - id: caller
        kind: actor
      - id: renderStatements
        kind: self
      - id: dialect.ForUpdate
        kind: value
      - id: writeModes
        kind: internal
      - id: updateStatements
        kind: internal
      - id: revisionStatements
        kind: internal
      - id: trashStatements
        kind: internal
      - id: pageStatements
        kind: internal
    steps:
      - bind: docs, ixName, vs
        eval: dialect.QuoteIdent(table), dialect.QuoteIdent(indexTable(table)), dialect.QuoteIdent(versionsTable(table))
      - bind: p1, p2, p3
        eval: dialect.Placeholder(1), dialect.Placeholder(2), dialect.Placeholder(3)
      - bind: lock
        eval: dialect.ForUpdate()
        to: dialect.ForUpdate
      - bind: join
        eval: |-
          "SELECT d.doc FROM " + ixName + " i JOIN " + docs + " d ON d.doc_key = i.doc_key" +
          		" WHERE i.index_name = " + p1 + " AND i.index_key = " + p2
      - bind: stmts
        eval: |-
          sqlStatements{
          		getDoc:       "SELECT doc FROM " + docs + " WHERE doc_key = " + p1,
          		listDocs:     "SELECT doc FROM " + docs + " ORDER BY doc_key",
          		entries:      "SELECT doc_key, doc FROM " + docs + " ORDER BY doc_key",
          		entriesLimit: "SELECT doc_key, doc FROM " + docs + " ORDER BY doc_key LIMIT " + p1,
          		count:        "SELECT COUNT(*) FROM " + docs,
          		replace:      "UPDATE " + docs + " SET rev = rev + 1, doc = " + p1 + " WHERE doc_key = " + p2,
          		deleteDoc:    "DELETE FROM " + docs + " WHERE doc_key = " + p1,
          		deleteIndex:  "DELETE FROM " + ixName + " WHERE doc_key = " + p1,
          		clearIndex:   "DELETE FROM " + ixName,
          		pageAfter:    "SELECT doc_key, doc FROM " + docs + " WHERE doc_key > " + p1 + " ORDER BY doc_key LIMIT " + p2,
          		keysAfter:    "SELECT doc_key FROM " + docs + " WHERE doc_key > " + p1 + " ORDER BY doc_key LIMIT " + p2,
          		lookup:       join,
          		find:         join + " ORDER BY i.doc_key",
          		versionHead:  "SELECT num FROM " + vs + " WHERE doc_key = " + p1 + " AND doc IS NULL" + lock,
          		retireHead:   "UPDATE " + vs + " SET doc = " + p1 + " WHERE doc_key = " + p2 + " AND num = " + p3,
          		pruneCut: "SELECT num FROM " + vs + " WHERE doc_key = " + p1 + " AND doc IS NOT NULL" +
          			" ORDER BY num DESC LIMIT 1 OFFSET " + p2 + lock,
          		pruneVersions: "DELETE FROM " + vs + " WHERE doc_key = " + p1 + " AND doc IS NOT NULL AND num <= " + p2,
          		dropVersions:  "DELETE FROM " + vs + " WHERE doc_key = " + p1,
          		dropFormers:   "DELETE FROM " + vs + " WHERE doc_key = " + p1 + " AND doc IS NOT NULL",
          		readVersions: "SELECT v.num, v.made_at, v.made_ns, v.meta, COALESCE(v.doc, d.doc) FROM " + docs + " d LEFT JOIN " + vs +
          			" v ON v.doc_key = d.doc_key WHERE d.doc_key = " + p1 + " ORDER BY v.num DESC",
          		lockFormers: "SELECT num, made_at, made_ns, meta, doc FROM " + vs + " WHERE doc_key = " + p1 + " AND doc IS NOT NULL" +
          			" ORDER BY num DESC" + lock,
          		versionWeight: "SELECT COUNT(CASE WHEN num > 0 AND doc IS NOT NULL THEN 1 END), COUNT(CASE WHEN num = 0 THEN 1 END), " +
          			"COALESCE(SUM(LENGTH(doc)), 0) FROM " + vs,
          		claim:     claimStatement(dialect, docs),
          		docTable:  docs,
          		ixTable:   ixName,
          		vsTable:   vs,
          		shareLock: shareLockClause(dialect),
          		dialect:   dialect,
          	}
      - set: stmts.exists
        value: "\"SELECT 1 FROM \" + docs + \" WHERE doc_key = \" + dialect.Placeholder(1) + stmts.shareLock"
      - set: stmts.upsert, stmts.insert
        to: writeModes
        value: writeModes(dialect, docs)
      - set: stmts.lockDoc, stmts.writeLocked
        to: updateStatements
        value: updateStatements(dialect, docs, stmts.replace)
      - set: stmts.revision, stmts.replaceIf, stmts.lockDocIf
        to: revisionStatements
        value: revisionStatements(dialect, docs)
      - set: stmts.firstVersion, stmts.dropTombstone, stmts.readTrashed, stmts.tombstones
        to: trashStatements
        value: trashStatements(dialect, table)
      - set: stmts.findAfter, stmts.rangeFrom, stmts.rangeBelow
        to: pageStatements
        value: pageStatements(dialect, docs, ixName)
      - return: stmts
  - of: pageStatements
    steps:
      - bind: p
        eval: dialect.Placeholder
      - bind: join
        eval: "\" i JOIN \" + docs + \" d ON d.doc_key = i.doc_key WHERE i.index_name = \" + p(1)"
      - bind: head
        eval: |-
          "SELECT i.index_key, i.doc_key, d.doc FROM " + ix + join + " AND i.index_key >= " + p(2) +
          		" AND (i.index_key > " + p(3) + " OR (i.index_key = " + p(4) + " AND i.doc_key > " + p(5) + "))"
      - bind: order
        eval: "\" ORDER BY i.index_key, i.doc_key LIMIT \""
      - return: |-
          "SELECT i.doc_key, d.doc FROM " + ix + join + " AND i.index_key = " + p(2) + " AND i.doc_key > " + p(3) +
          			" ORDER BY i.doc_key LIMIT " + p(4), head + order + p(6), head + " AND i.index_key < " + p(6) + order + p(7)
  - of: trashStatements
    steps:
      - bind: versions, key
        eval: dialect.QuoteIdent(versionsTable(table)), dialect.Placeholder(1)
      - return: |-
          "SELECT num, doc FROM " + versions + " WHERE doc_key = " + key + " ORDER BY num LIMIT 1" + dialect.ForUpdate(), "DELETE FROM " + versions + " WHERE doc_key = " + key + " AND num = 0", "SELECT v.num, v.made_at, v.made_ns, v.meta, COALESCE(v.doc, t.doc) FROM " + versions + " t LEFT JOIN " + versions +
          			" v ON v.doc_key = t.doc_key AND v.num > 0 WHERE t.doc_key = " + key + " AND t.num = 0 ORDER BY v.num DESC", "SELECT doc_key, made_at, made_ns FROM " + versions + " WHERE num = 0 ORDER BY doc_key"
  - of: writeModes
    steps:
      - bind: p1, p2
        eval: dialect.Placeholder(1), dialect.Placeholder(2)
      - bind: values
        eval: "\"INSERT INTO \" + docs + \" (doc_key, rev, doc) VALUES (\" + p1 + \", 1, \" + p2 + \")\""
      - opt:
          do:
            - return: values + " ON DUPLICATE KEY UPDATE rev = rev + 1, doc = " + dialect.Placeholder(3), values
          when: dialect == coresql.DialectMySQL
      - bind: existing
        eval: "\"rev\""
      - opt:
          do:
            - set: existing
              value: docs + ".rev"
          when: dialect == coresql.DialectPostgres
      - return: values + " ON CONFLICT (doc_key) DO UPDATE SET rev = " + existing + " + 1, doc = excluded.doc RETURNING rev", values + " ON CONFLICT (doc_key) DO NOTHING"
  - of: updateStatements
    steps:
      - opt:
          do:
            - return: "\"UPDATE \" + docs + \" SET rev = rev + 1 WHERE doc_key = \" + dialect.Placeholder(1) + \" RETURNING doc\", \"UPDATE \" + docs + \" SET doc = \" + dialect.Placeholder(1) + \" WHERE doc_key = \" + dialect.Placeholder(2)"
          when: dialect == coresql.DialectSQLite
      - return: "\"SELECT doc FROM \" + docs + \" WHERE doc_key = \" + dialect.Placeholder(1) + dialect.ForUpdate(), replace"
  - of: revisionStatements
    steps:
      - bind: p1, p2, p3
        eval: dialect.Placeholder(1), dialect.Placeholder(2), dialect.Placeholder(3)
      - set: revision
        value: "\"SELECT rev, doc FROM \" + docs + \" WHERE doc_key = \" + p1"
      - set: replaceIf
        value: "\"UPDATE \" + docs + \" SET rev = rev + 1, doc = \" + p1 + \" WHERE doc_key = \" + p2 + \" AND rev = \" + p3"
      - opt:
          do:
            - return: revision, replaceIf, "UPDATE " + docs + " SET rev = rev + 1 WHERE doc_key = " + p1 + " AND rev = " + p2 + " RETURNING doc"
          when: dialect == coresql.DialectSQLite
      - return: revision, replaceIf, "SELECT doc FROM " + docs + " WHERE doc_key = " + p1 + " AND rev = " + p2 + dialect.ForUpdate()
  - of: claimStatement
    steps:
      - bind: p1, p2
        eval: dialect.Placeholder(1), dialect.Placeholder(2)
      - bind: values
        eval: "\"INSERT INTO \" + docs + \" (doc_key, rev, doc) VALUES (\" + p1 + \", 1, \" + p2 + \")\""
      - opt:
          do:
            - return: values + " ON DUPLICATE KEY UPDATE rev = rev + 1"
          when: dialect == coresql.DialectMySQL
      - bind: existing
        eval: "\"rev\""
      - opt:
          do:
            - set: existing
              value: docs + ".rev"
          when: dialect == coresql.DialectPostgres
      - return: values + " ON CONFLICT (doc_key) DO UPDATE SET rev = " + existing + " + 1 RETURNING rev, doc"
  - of: (*sqlStatements).claimReturnsRow
    steps:
      - return: s.dialect != coresql.DialectMySQL
  - of: (*sqlStatements).upsertArgs
    steps:
      - opt:
          do:
            - return: "[]any{key, doc, doc}"
          when: s.dialect == coresql.DialectMySQL
      - return: "[]any{key, doc}"
  - of: (*sqlStatements).upsertReturnsRev
    steps:
      - return: s.dialect != coresql.DialectMySQL
  - of: (*sqlStatements).insertConflictIsZeroRows
    steps:
      - return: s.dialect != coresql.DialectMySQL
  - of: rowsOf
    steps:
      - bind: rows
        eval: make([][]any, 0, len(args)/width)
      - loop:
          cond: start+width <= len(args)
          do:
            - set: rows
              value: append(rows, args[start:start+width:start+width])
          init: start := 0
          post: start += width
      - return: rows
  - of: (*sqlStatements).uniqueTaken
    participants:
      - id: caller
        kind: actor
      - id: (*sqlStatements).uniqueTaken
        kind: self
      - id: b.WriteString
        kind: value
      - id: b.String
        kind: value
    steps:
      - var:
          name: b
          type: strings.Builder
      - eval: b.WriteString("SELECT index_name FROM " + s.ixTable + " WHERE uniq = 1 AND doc_key <> " + s.dialect.Placeholder(1) + " AND (")
        to: b.WriteString
      - loop:
          do:
            - opt:
                do:
                  - eval: b.WriteString(" OR ")
                    to: b.WriteString
                when: pair > 0
            - eval: |-
                b.WriteString("(index_name = " + s.dialect.Placeholder(2+2*pair) +
                			" AND index_key = " + s.dialect.Placeholder(3+2*pair) + ")")
              to: b.WriteString
          key: pair
          range: "n"
      - eval: b.WriteString(")")
        to: b.WriteString
      - opt:
          do:
            - eval: b.WriteString(s.shareLock)
              to: b.WriteString
          when: shared
      - return: b.String()
        to: b.String
  - of: (*sqlStatements).sharedKeys
    steps:
      - return: |-
          "SELECT index_name FROM " + s.ixTable + " WHERE index_name IN (" + s.list(n) + ")" +
          		" GROUP BY index_name, index_key HAVING COUNT(*) > 1"
  - of: (*sqlStatements).markUnique
    steps:
      - return: "\"UPDATE \" + s.ixTable + \" SET uniq = 1 WHERE index_name IN (\" + s.list(n) + \")\""
  - of: (*sqlStatements).indexInsert
    steps:
      - return: "svcsql.InsertSpec{Table: s.ixTable, Columns: indexColumns, PerStatement: indexRowsPerStatement}"
  - of: (*sqlStatements).versionInsert
    steps:
      - return: "svcsql.InsertSpec{Table: s.vsTable, Columns: versionColumns, PerStatement: versionRowsPerStatement}"
  - of: (*sqlStatements).list
    participants:
      - id: caller
        kind: actor
      - id: (*sqlStatements).list
        kind: self
      - id: s.dialect.Placeholder
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: marks
        eval: make([]string, n)
      - loop:
          do:
            - set: marks[i]
              to: s.dialect.Placeholder
              value: s.dialect.Placeholder(i + 1)
          key: i
          range: marks
      - return: strings.Join(marks, ", ")
        to: strings
  - of: shareLockClause
    steps:
      - opt:
          do:
            - return: "\" LOCK IN SHARE MODE\""
          when: dialect == coresql.DialectMySQL
      - return: "\"\""
  - of: createTableStatements
    steps:
      - bind: docs, ix
        eval: dialect.QuoteIdent(table), dialect.QuoteIdent(indexTable(table))
      - switch:
          cases:
            - case: coresql.DialectMySQL
              do:
                - return: |-
                    []string{
                    			"CREATE TABLE IF NOT EXISTS " + docs + " (doc_key VARBINARY(" + strconv.Itoa(MaxSQLKeyLen) + ") NOT NULL," +
                    				" rev BIGINT NOT NULL, doc LONGBLOB NOT NULL, PRIMARY KEY (doc_key)) ENGINE=InnoDB",
                    			"CREATE TABLE IF NOT EXISTS " + ix + " (index_name VARBINARY(" + strconv.Itoa(MaxSQLIndexNameLen) + ") NOT NULL," +
                    				" index_key VARBINARY(" + strconv.Itoa(MaxSQLKeyLen) + ") NOT NULL, doc_key VARBINARY(" + strconv.Itoa(MaxSQLKeyLen) + ") NOT NULL," +
                    				" uniq TINYINT NULL, PRIMARY KEY (index_name, index_key, doc_key), KEY (doc_key)," +
                    				" UNIQUE KEY (index_name, index_key, uniq)) ENGINE=InnoDB",
                    		}
            - case: coresql.DialectPostgres
              do:
                - return: |-
                    []string{
                    			"CREATE TABLE IF NOT EXISTS " + docs + " (doc_key bytea NOT NULL PRIMARY KEY, rev bigint NOT NULL, doc bytea NOT NULL)",
                    			"CREATE TABLE IF NOT EXISTS " + ix + " (index_name bytea NOT NULL, index_key bytea NOT NULL, doc_key bytea NOT NULL," +
                    				" uniq smallint, PRIMARY KEY (index_name, index_key, doc_key), UNIQUE (doc_key, index_name, index_key)," +
                    				" UNIQUE (index_name, index_key, uniq))",
                    		}
            - default: true
              do:
                - return: |-
                    []string{
                    			"CREATE TABLE IF NOT EXISTS " + docs + " (doc_key BLOB NOT NULL PRIMARY KEY, rev INTEGER NOT NULL, doc BLOB NOT NULL)",
                    			"CREATE TABLE IF NOT EXISTS " + ix + " (index_name BLOB NOT NULL, index_key BLOB NOT NULL, doc_key BLOB NOT NULL," +
                    				" uniq INTEGER, PRIMARY KEY (index_name, index_key, doc_key), UNIQUE (doc_key, index_name, index_key)," +
                    				" UNIQUE (index_name, index_key, uniq))",
                    		}
          "on": dialect
  - of: createVersionsTableStatements
    participants:
      - id: caller
        kind: actor
      - id: createVersionsTableStatements
        kind: self
      - id: dialect.QuoteIdent
        kind: value
    steps:
      - bind: vs
        eval: dialect.QuoteIdent(versionsTable(table))
        to: dialect.QuoteIdent
      - switch:
          cases:
            - case: coresql.DialectMySQL
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + vs + " (doc_key VARBINARY(" + strconv.Itoa(MaxSQLKeyLen) + ") NOT NULL," +
                    			" num BIGINT NOT NULL, made_at BIGINT NULL, made_ns INT NULL, meta LONGBLOB NULL, doc LONGBLOB NULL," +
                    			" PRIMARY KEY (doc_key, num)) ENGINE=InnoDB"}
            - case: coresql.DialectPostgres
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + vs + " (doc_key bytea NOT NULL, num bigint NOT NULL, made_at bigint," +
                    			" made_ns integer, meta bytea, doc bytea, PRIMARY KEY (doc_key, num))"}
            - default: true
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + vs + " (doc_key BLOB NOT NULL, num INTEGER NOT NULL, made_at INTEGER," +
                    			" made_ns INTEGER, meta BLOB, doc BLOB, PRIMARY KEY (doc_key, num))"}
          "on": dialect
  - of: trashIndexStatements
    steps:
      - bind: vs, name
        eval: dialect.QuoteIdent(versionsTable(table)), dialect.QuoteIdent(trashIndex(table))
      - opt:
          do:
            - return: "\"ALTER TABLE \" + vs + \" ADD KEY \" + name + \" (num, doc_key)\", \"ALTER TABLE \" + vs + \" DROP KEY \" + name"
          when: dialect == coresql.DialectMySQL
      - return: "\"CREATE INDEX IF NOT EXISTS \" + name + \" ON \" + vs + \" (doc_key) WHERE num = 0\", \"DROP INDEX IF EXISTS \" + name"
  - of: dropVersionsTableStatements
    steps:
      - return: "[]string{\"DROP TABLE IF EXISTS \" + dialect.QuoteIdent(versionsTable(table))}"
  - of: dropTableStatements
    steps:
      - return: |-
          []string{
          		"DROP TABLE IF EXISTS " + dialect.QuoteIdent(indexTable(table)),
          		"DROP TABLE IF EXISTS " + dialect.QuoteIdent(table),
          	}
  - of: SQLMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLMigration
        kind: self
      - id: validateTable
        kind: internal
      - id: createTableStatements
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, misconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateTable(table)
            to: validateTable
          when: err != nil
      - bind: up
        eval: createTableStatements(dialect, table)
        to: createTableStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlMigrationPrefix + table,
          		Up:      svcsql.Statements(up...),
          		Down:    svcsql.Statements(dropTableStatements(dialect, table)...),
          		//: what Up runs, fingerprinted: an install that recorded it refuses a
          		//: build whose statements differ (#1056).
          		Checksum: svcsql.ChecksumOf(up...),
          	}
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: SQLVersionsMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLVersionsMigration
        kind: self
      - id: validateTable
        kind: internal
      - id: createVersionsTableStatements
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, misconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateTable(table)
            to: validateTable
          when: err != nil
      - bind: up
        eval: createVersionsTableStatements(dialect, table)
        to: createVersionsTableStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlVersionsMigrationPrefix + table,
          		Up:      svcsql.Statements(up...),
          		Down:    svcsql.Statements(dropVersionsTableStatements(dialect, table)...),
          		//: what Up runs, fingerprinted, as SQLMigration's (#1056).
          		Checksum: svcsql.ChecksumOf(up...),
          	}
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: SQLVersionsTrashIndexMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLVersionsTrashIndexMigration
        kind: self
      - id: validateTable
        kind: internal
      - id: trashIndexStatements
        kind: internal
      - id: whenTrashIndex
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, misconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateTable(table)
            to: validateTable
          when: err != nil
      - bind: create, drop
        eval: trashIndexStatements(dialect, table)
        to: trashIndexStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlTrashIndexMigrationPrefix + table,
          		Up:      svcsql.Statements(create),
          		Down:    svcsql.Statements(drop),
          	}
      - opt:
          do:
            - set: migration.Up
              to: whenTrashIndex
              value: whenTrashIndex(table, false, create)
            - set: migration.Down
              to: whenTrashIndex
              value: whenTrashIndex(table, true, drop)
          when: dialect == coresql.DialectMySQL
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: whenTrashIndex
    participants:
      - id: caller
        kind: actor
      - id: whenTrashIndex
        kind: self
      - id: ex.QueryRowContext(ctx, trashIndexExistsStatement, versionsTable(table), trashIndex(table)).Scan
        kind: value
      - id: ex.ExecContext
        kind: value
    steps:
      - return:
          closure:
            params: ctx context.Context, ex coresql.Executor
            results: error
            steps:
              - var:
                  name: "n"
                  type: int64
              - opt:
                  do:
                    - return: err
                  init:
                    bind: err
                    eval: ex.QueryRowContext(ctx, trashIndexExistsStatement, versionsTable(table), trashIndex(table)).Scan(&n)
                    to: ex.QueryRowContext(ctx, trashIndexExistsStatement, versionsTable(table), trashIndex(table)).Scan
                  when: err != nil
              - opt:
                  do:
                    - return: nil
                  when: (n > 0) != present
              - bind: _, err
                eval: ex.ExecContext(ctx, stmt)
                to: ex.ExecContext
              - return: err
  - of: (*SQLStore).Documents
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Documents
        kind: self
      - id: pages.next
        kind: internal
      - id: s.entriesPage
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(coredocstore.EntryValue, error) bool
            steps:
              - bind: pages
                eval: "pager{limit: limit}"
              - loop:
                  do:
                    - bind: want
                      eval: pages.next()
                      to: pages.next
                    - bind: page, err
                      eval: s.entriesPage(ctx, "page the documents", s.stmts.pageAfter, []byte(after), int64(want))
                      to: s.entriesPage
                    - opt:
                        do:
                          - return: ""
                        when: "!yieldEntries(yield, page, err) || !pages.read(len(page), want)"
                    - set: after
                      value: page[len(page)-1].Key
                  forever: true
  - of: (*SQLStore).FindAfter
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).FindAfter
        kind: self
      - id: s.declared
        kind: internal
      - id: yieldFailure
        kind: internal
      - id: s.fileKey
        kind: internal
      - id: pages.next
        kind: internal
      - id: s.entriesPage
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(T, error) bool
            steps:
              - opt:
                  do:
                    - eval: yieldFailure(yield, err)
                      to: yieldFailure
                    - return: ""
                  init:
                    bind: _, err
                    eval: s.declared(index)
                    to: s.declared
                  when: err != nil
              - bind: indexed
                eval: s.fileKey(index, key)
                to: s.fileKey
              - opt:
                  do:
                    - return: ""
                  when: len(indexed) == 0
              - bind: pages
                eval: "pager{limit: limit}"
              - loop:
                  do:
                    - bind: want
                      eval: pages.next()
                      to: pages.next
                    - bind: page, err
                      eval: s.entriesPage(ctx, "find a page of documents", s.stmts.findAfter, []byte(index), indexed, []byte(after), int64(want))
                      to: s.entriesPage
                    - opt:
                        do:
                          - return: ""
                        when: "!s.yieldPage(yield, page, err) || !pages.read(len(page), want)"
                    - set: after
                      value: page[len(page)-1].Key
                  forever: true
  - of: (*SQLStore).Range
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Range
        kind: self
      - id: yieldFailure
        kind: internal
      - id: pages.next
        kind: internal
      - id: s.rangePage
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(T, error) bool
            steps:
              - bind: spec, found
                eval: s.byName[index]
              - opt:
                  do:
                    - eval: yieldFailure(yield, notOrdered(index, found))
                      to: yieldFailure
                    - return: ""
                  when: "!found || !spec.Ordered"
              - bind: cur
                eval: "rangeCursor{key: bound(s.fileKey(index, lo))}"
              - bind: query, upper
                eval: s.stmts.rangeFrom, []any(nil)
              - opt:
                  do:
                    - set: query, upper
                      value: s.stmts.rangeBelow, []any{bound(s.fileKey(index, hi))}
                  when: hi != ""
              - bind: pages
                eval: "pager{limit: limit}"
              - loop:
                  do:
                    - bind: want
                      eval: pages.next()
                      to: pages.next
                    - bind: page, next, err
                      eval: s.rangePage(ctx, query, []byte(index), cur, upper, want)
                      to: s.rangePage
                    - opt:
                        do:
                          - return: ""
                        when: "!s.yieldPage(yield, page, err) || !pages.read(len(page), want)"
                    - set: cur
                      value: next
                  forever: true
  - of: bound
    steps:
      - opt:
          do:
            - return: "[]byte{}"
          when: key == nil
      - return: key
  - of: (*SQLStore).rangePage
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).rangePage
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: args
        eval: append([]any{index, cur.key, cur.key, cur.key, []byte(cur.owner)}, upper...)
      - set: args
        value: append(args, int64(n))
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, cur, s.failed("read a range of an index", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "read a range of an index", err) }()
      - set: page, next
        value: make([]coredocstore.EntryValue, 0, min(n, rowsHint)), cur
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: key
                type: "[]byte"
            - var:
                name: entry
                type: coredocstore.EntryValue
            - opt:
                do:
                  - return: nil, cur, s.failed("read a range of an index", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&key, &entry.Key, &entry.JSON)
                  to: rows.Scan
                when: scanErr != nil
            - set: page
              value: append(page, entry)
            - set: next
              value: "rangeCursor{key: key, owner: entry.Key}"
      - return: page, next, nil
  - of: (*SQLStore).entriesPage
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).entriesPage
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed(step, err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, step, err) }()
      - set: page
        value: make([]coredocstore.EntryValue, 0, rowsHint)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: entry
                type: coredocstore.EntryValue
            - opt:
                do:
                  - return: nil, s.failed(step, scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&entry.Key, &entry.JSON)
                  to: rows.Scan
                when: scanErr != nil
            - set: page
              value: append(page, entry)
      - return: page, nil
  - of: (*SQLStore).yieldPage
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).yieldPage
        kind: self
      - id: decodeAs
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - loop:
          do:
            - bind: v, err
              eval: decodeAs[T](s.table, entry.JSON)
              to: decodeAs
            - opt:
                do:
                  - eval: yield(zero, err)
                  - return: "false"
                when: err != nil
            - opt:
                do:
                  - return: "false"
                when: "!yield(v, nil)"
          key: _
          range: page
          value: entry
      - opt:
          do:
            - return: "true"
          when: failure == nil
      - eval: yield(zero, failure)
      - return: "false"
  - of: (*SQLStore).Reindex
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Reindex
        kind: self
      - id: s.run
        kind: internal
    steps:
      - return: s.run(ctx, true, s.reindex)
        to: s.run
  - of: (*SQLStore).reindex
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).reindex
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
      - id: s.readPage
        kind: internal
      - id: s.refile
        kind: internal
      - id: s.constrainUnique
        kind: internal
    steps:
      - opt:
          do:
            - return: s.failed("clear the index rows", err)
              to: s.failed
          init:
            bind: _, err
            eval: ex.ExecContext(ctx, s.stmts.clearIndex)
            to: ex.ExecContext
          when: err != nil
      - var:
          name: after
          type: "[]byte"
      - loop:
          do:
            - bind: page, err
              eval: s.readPage(ctx, ex, after)
              to: s.readPage
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - return: fileErr
                init:
                  bind: fileErr
                  eval: s.refile(ctx, ex, page)
                  to: s.refile
                when: fileErr != nil
            - opt:
                do:
                  - break: true
                when: len(page) < reindexPage
            - set: after
              value: page[len(page)-1].key
          forever: true
      - return: s.constrainUnique(ctx, ex)
        to: s.constrainUnique
  - of: (*SQLStore).readPage
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).readPage
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: query, args
        eval: s.stmts.pageAfter, []any{after, int64(reindexPage)}
      - opt:
          do:
            - set: query, args
              value: s.stmts.entriesLimit, []any{int64(reindexPage)}
          when: after == nil
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("read the documents to reindex", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "read the documents to reindex", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: doc
                type: storedDocument
            - opt:
                do:
                  - return: nil, s.failed("read the documents to reindex", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&doc.key, &doc.raw)
                  to: rows.Scan
                when: scanErr != nil
            - set: page
              value: append(page, doc)
      - return: page, nil
  - of: (*SQLStore).refile
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).refile
        kind: self
      - id: decodeAs
        kind: internal
      - id: s.keysForRebuild
        kind: internal
      - id: svcsql
        kind: package
      - id: s.failed
        kind: internal
    steps:
      - loop:
          do:
            - bind: v, err
              eval: decodeAs[T](s.table, doc.raw)
              to: decodeAs
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: rows, err
              eval: s.keysForRebuild(v)
              to: s.keysForRebuild
            - opt:
                do:
                  - return: err
                when: err != nil
            - loop:
                do:
                  - set: rows[i].unique
                    value: "false"
                key: i
                range: rows
            - opt:
                do:
                  - return: s.failed("file a document's index rows", execErr)
                    to: s.failed
                init:
                  bind: _, execErr
                  eval: |-
                    svcsql.InsertRows(ctx, ex, s.stmts.dialect, s.stmts.indexInsert(),
                    			rowsOf(rowArgs(doc.key, rows), indexRowArgs))
                  to: svcsql
                when: execErr != nil
          key: _
          range: page
          value: doc
      - return: nil
  - of: (*SQLStore).keysForRebuild
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).keysForRebuild
        kind: self
      - id: s.indexRows
        kind: internal
    steps:
      - defer: |-
          func() {
          		recovered := recover()
          		//: the ordinary path.
          		if recovered == nil {
          			return
          		}
          		//: the value travels as a field, never as the origin.
          		rows, err = nil, kerrs.Wrap(coredocstore.IndexBroken, kerrs.WrapParams{},
          			kerrs.String("problem", "a key function panicked"), kerrs.String("panic", fmt.Sprint(recovered)))
          	}()
      - return: s.indexRows(v)
        to: s.indexRows
  - of: (*SQLStore).constrainUnique
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).constrainUnique
        kind: self
      - id: s.queryNames
        kind: internal
      - id: kerrs
        kind: package
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
    steps:
      - var:
          name: names
          type: "[]any"
      - loop:
          do:
            - opt:
                do:
                  - set: names
                    value: append(names, []byte(spec.Name))
                when: spec.Unique
          key: _
          range: s.indexes
          value: spec
      - opt:
          do:
            - return: nil
          when: len(names) == 0
      - bind: shared, err
        eval: s.queryNames(ctx, ex, s.stmts.sharedKeys(len(names)), names)
        to: s.queryNames
      - opt:
          do:
            - return: err
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      kerrs.Wrap(coredocstore.IndexBroken, kerrs.WrapParams{},
                      				kerrs.String("problem", "two documents share a unique key"), kerrs.String("store", s.table), kerrs.String("index", spec.Name))
                    to: kerrs
                when: spec.Unique && slices.Contains(shared, spec.Name)
          key: _
          range: s.indexes
          value: spec
      - opt:
          do:
            - return: s.failed("constrain the unique indexes", err)
              to: s.failed
          init:
            bind: _, err
            eval: ex.ExecContext(ctx, s.stmts.markUnique(len(names)), names...)
            to: ex.ExecContext
          when: err != nil
      - return: nil
  - of: (*SQLStore).Revision
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Revision
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.revision, []byte(key)).Scan
        kind: value
      - id: decodeAs
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - var:
          name: rev
          type: int64
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.revision, []byte(key)).Scan(&rev, &raw)
        to: ex.QueryRowContext(ctx, s.stmts.revision, []byte(key)).Scan
      - opt:
          do:
            - return: zero, "", kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: zero, "", s.failed("read a revision", err)
          when: err != nil
      - bind: v, decodeErr
        eval: decodeAs[T](s.table, raw)
        to: decodeAs
      - opt:
          do:
            - return: zero, "", decodeErr
          when: decodeErr != nil
      - return: v, coredocstore.RevisionValue(strconv.FormatInt(rev, 10)), nil
  - of: (*SQLStore).ReplaceIf
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).ReplaceIf
        kind: self
      - id: s.prepare
        kind: internal
      - id: strconv
        kind: stdlib
      - id: s.write
        kind: internal
    steps:
      - bind: p, err
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: expected, parseErr
        eval: strconv.ParseInt(string(rev), 10, 64)
        to: strconv
      - opt:
          do:
            - set: expected
              value: noRevision
          when: parseErr != nil || expected < 1
      - set: p.ifRev
        value: expected
      - return: s.write(ctx, p, replaceOnRevision, coredocstore.StampValue{})
        to: s.write
  - of: (*SQLStore).replaceOnRevision
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).replaceOnRevision
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: rowsAffected
        kind: internal
      - id: s.failed
        kind: internal
      - id: s.revisionRefused
        kind: internal
    steps:
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.replaceIf, []byte(p.raw), []byte(p.key), p.ifRev)
        to: ex.ExecContext
      - bind: n, err
        eval: rowsAffected(result, execErr)
        to: rowsAffected
      - opt:
          do:
            - return: s.failed("replace a document on its revision", err)
              to: s.failed
          when: err != nil
      - opt:
          do:
            - return: s.revisionRefused(ctx, ex, p.key)
              to: s.revisionRefused
          when: n == 0
      - return: nil
  - of: (*SQLStore).lockedReplaceIf
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).lockedReplaceIf
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.lockDocIf, []byte(p.key), p.ifRev).Scan
        kind: value
    steps:
      - set: err
        to: ex.QueryRowContext(ctx, s.stmts.lockDocIf, []byte(p.key), p.ifRev).Scan
        value: ex.QueryRowContext(ctx, s.stmts.lockDocIf, []byte(p.key), p.ifRev).Scan(&old)
      - opt:
          do:
            - return: nil, s.revisionRefused(ctx, ex, p.key)
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: nil, s.failed("lock a document on its revision", err)
          when: err != nil
      - return: old, s.writeLockedRow(ctx, ex, p)
  - of: (*SQLStore).revisionRefused
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).revisionRefused
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.exists, []byte(key)).Scan
        kind: value
      - id: kerrs
        kind: package
      - id: s.failed
        kind: internal
    steps:
      - var:
          name: one
          type: int64
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.exists, []byte(key)).Scan(&one)
        to: ex.QueryRowContext(ctx, s.stmts.exists, []byte(key)).Scan
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: s.failed("read a revision", err)
              to: s.failed
          when: err != nil
      - return: kerrs.Wrap(coredocstore.RevisionMismatch, kerrs.WrapParams{}, kerrs.String("store", s.table))
        to: kerrs
  - of: OpenSQL
    participants:
      - id: caller
        kind: actor
      - id: OpenSQL
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - bind: parts, err
        eval: cfg.validate(indexes)
        to: cfg.validate
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: store
        eval: |-
          &SQLStore[T]{
          		key:      cfg.Key,
          		tm:       cfg.Transactor,
          		tx:       parts,
          		indexKey: cfg.IndexKey,
          		clock:    cfg.Clock,
          		held:     cfg.Held,
          		byName:   make(map[string]coredocstore.IndexSpec[T], len(indexes)),
          		table:    cfg.Table,
          		stmts:    renderStatements(cfg.Dialect, cfg.Table),
          		indexes:  indexes,
          		own:      ownTxOptions(cfg.Dialect),
          		keep:     cfg.Versions,
          	}
      - opt:
          do:
            - set: store.clock
              value: clock.System
          when: store.clock == nil
      - loop:
          do:
            - set: store.byName[spec.Name]
              value: spec
          key: _
          range: indexes
          value: spec
      - return: store, nil
  - of: ownTxOptions
    steps:
      - opt:
          do:
            - return: "coresql.TxOptionsValue{Isolation: stdsql.LevelReadCommitted}"
          when: dialect == coresql.DialectMySQL
      - return: coresql.TxOptionsValue{}
  - of: (*SQLStore).Get
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Get
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan
        kind: value
      - id: decodeAs
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan
      - opt:
          do:
            - return: zero, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: zero, s.failed("read a document", err)
          when: err != nil
      - return: decodeAs[T](s.table, raw)
        to: decodeAs
  - of: (*SQLStore).GetInto
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).GetInto
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan
        kind: value
      - id: kerrs
        kind: package
      - id: s.failed
        kind: internal
      - id: decodeInto
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - set: "*dst"
        value: zero
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.getDoc, []byte(key)).Scan
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: s.failed("read a document", err)
              to: s.failed
          when: err != nil
      - return: decodeInto(s.table, raw, dst)
        to: decodeInto
  - of: (*SQLStore).List
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).List
        kind: self
      - id: s.queryDocuments
        kind: internal
    steps:
      - return: s.queryDocuments(ctx, "list the documents", s.stmts.listDocs)
        to: s.queryDocuments
  - of: (*SQLStore).Filter
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Filter
        kind: self
      - id: s.List
        kind: internal
    steps:
      - bind: all, err
        eval: s.List(ctx)
        to: s.List
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: kept
        eval: all[:0]
      - loop:
          do:
            - opt:
                do:
                  - set: kept
                    value: append(kept, v)
                when: keep(v)
          key: _
          range: all
          value: v
      - return: kept, nil
  - of: (*SQLStore).Entries
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Entries
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: query, args
        eval: s.stmts.entries, []any(nil)
      - opt:
          do:
            - set: query, args
              value: s.stmts.entriesLimit, []any{int64(limit)}
          when: limit > 0
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("list the entries", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "list the entries", err) }()
      - set: entries
        value: make([]coredocstore.EntryValue, 0, rowsHint)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: entry
                type: coredocstore.EntryValue
            - opt:
                do:
                  - return: nil, s.failed("list the entries", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&entry.Key, &entry.JSON)
                  to: rows.Scan
                when: scanErr != nil
            - set: entries
              value: append(entries, entry)
      - return: entries, nil
  - of: (*SQLStore).Keys
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Keys
        kind: self
      - id: s.keysPage
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(string, error) bool
            steps:
              - loop:
                  do:
                    - bind: page, err
                      eval: s.keysPage(ctx, after)
                      to: s.keysPage
                    - opt:
                        do:
                          - return: ""
                        when: "!yieldKeys(yield, page, err) || len(page) < keysPageLen"
                    - set: after
                      value: page[len(page)-1]
                  forever: true
  - of: (*SQLStore).keysPage
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).keysPage
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, s.stmts.keysAfter, []byte(after), int64(keysPageLen))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("list the keys", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "list the keys", err) }()
      - set: keys
        value: make([]string, 0, keysPageLen)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: key
                type: string
            - opt:
                do:
                  - return: nil, s.failed("list the keys", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&key)
                  to: rows.Scan
                when: scanErr != nil
            - set: keys
              value: append(keys, key)
      - return: keys, nil
  - of: (*SQLStore).Count
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Count
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.count).Scan
        kind: value
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - var:
          name: "n"
          type: int64
      - opt:
          do:
            - return: 0, s.failed("count the documents", err)
          init:
            bind: err
            eval: ex.QueryRowContext(ctx, s.stmts.count).Scan(&n)
            to: ex.QueryRowContext(ctx, s.stmts.count).Scan
          when: err != nil
      - return: int(n), nil
  - of: (*SQLStore).Lookup
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Lookup
        kind: self
      - id: s.declared
        kind: internal
      - id: s.fileKey
        kind: internal
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.lookup, []byte(index), indexed).Scan
        kind: value
      - id: decodeAs
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - bind: spec, err
        eval: s.declared(index)
        to: s.declared
      - opt:
          do:
            - return: zero, err
          when: err != nil
      - opt:
          do:
            - return: zero, kerrs.Wrap(coredocstore.IndexNotUnique, kerrs.WrapParams{}, kerrs.String("index", index))
          when: "!spec.Unique"
      - bind: indexed
        eval: s.fileKey(index, key)
        to: s.fileKey
      - opt:
          do:
            - return: zero, s.notFoundIn(index)
          when: len(indexed) == 0
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - var:
          name: raw
          type: "[]byte"
      - set: err
        to: ex.QueryRowContext(ctx, s.stmts.lookup, []byte(index), indexed).Scan
        value: ex.QueryRowContext(ctx, s.stmts.lookup, []byte(index), indexed).Scan(&raw)
      - opt:
          do:
            - return: zero, s.notFoundIn(index)
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: zero, s.failed("look a document up", err)
          when: err != nil
      - return: decodeAs[T](s.table, raw)
        to: decodeAs
  - of: (*SQLStore).Find
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Find
        kind: self
      - id: s.declared
        kind: internal
      - id: s.queryDocuments
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: _, err
            eval: s.declared(index)
            to: s.declared
          when: err != nil
      - return: s.queryDocuments(ctx, "find documents", s.stmts.find, []byte(index), s.fileKey(index, key))
        to: s.queryDocuments
  - of: (*SQLStore).OnWrite
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).OnWrite
        kind: self
      - id: s.onWrite.add
        kind: internal
    steps:
      - return: s.onWrite.add(fn)
        to: s.onWrite.add
  - of: (*SQLStore).OnDelete
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).OnDelete
        kind: self
      - id: s.onDelete.add
        kind: internal
    steps:
      - return: s.onDelete.add(fn)
        to: s.onDelete.add
  - of: (*SQLStore).queryDocuments
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).queryDocuments
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: decodeAs
        kind: internal
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed(step, err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, step, err) }()
      - set: docs
        value: make([]T, 0, rowsHint)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: raw
                type: "[]byte"
            - opt:
                do:
                  - return: nil, s.failed(step, scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&raw)
                  to: rows.Scan
                when: scanErr != nil
            - bind: v, decodeErr
              eval: decodeAs[T](s.table, raw)
              to: decodeAs
            - opt:
                do:
                  - return: nil, decodeErr
                when: decodeErr != nil
            - set: docs
              value: append(docs, v)
      - return: docs, nil
  - of: (*SQLStore).finishRows
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).finishRows
        kind: self
      - id: errors
        kind: stdlib
      - id: s.failed
        kind: internal
    steps:
      - bind: iterErr, closeErr
        eval: rows.Err(), rows.Close()
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: s.failed(step, cause)
              to: s.failed
          init:
            bind: cause
            eval: errors.Join(iterErr, closeErr)
            to: errors
          when: cause != nil
      - return: nil
  - of: (*SQLStore).declared
    steps:
      - bind: spec, found
        eval: s.byName[index]
      - opt:
          do:
            - return: spec, kerrs.Wrap(coredocstore.IndexUnknown, kerrs.WrapParams{}, kerrs.String("index", index))
          when: "!found"
      - return: spec, nil
  - of: (*SQLStore).fileKey
    steps:
      - opt:
          do:
            - return: nil
          when: key == ""
      - opt:
          do:
            - return: "[]byte(key)"
          when: s.indexKey == nil
      - return: s.indexKey(index, key)
  - of: (*SQLStore).notFoundIn
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).notFoundIn
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table), kerrs.String("index", index))
        to: kerrs
  - of: (*SQLStore).failed
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).failed
        kind: self
      - id: errors
        kind: stdlib
    steps:
      - return: |-
          errors.Join(
          		kerrs.Wrap(coredocstore.StatementFailed, kerrs.WrapParams{}, kerrs.String("store", s.table), kerrs.String("step", step)),
          		svcsql.NewWithheld(cause))
        to: errors
  - of: (*SQLStore).Trash
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Trash
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: s.run
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.table)
              to: versionsNotKept
          when: s.keep == 0
      - bind: err
        eval: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: the document read and locked, removed, and kept in the trash.
          		return s.trash(txCtx, ex, key)
          	})
        to: s.run
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: s.announce(ctx, &s.onDelete, key)
        to: s.announce
      - return: nil
  - of: (*SQLStore).Restore
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Restore
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: s.run
        kind: internal
      - id: s.settle
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.table)
              to: versionsNotKept
          when: s.keep == 0
      - bind: err
        eval: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: the trashed document written and filed again, its row gone.
          		return s.restore(txCtx, ex, key)
          	})
        to: s.run
      - opt:
          do:
            - return: s.settle(ctx, err)
              to: s.settle
          when: err != nil
      - eval: s.announce(ctx, &s.onWrite, key)
        to: s.announce
      - return: nil
  - of: (*SQLStore).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Purge
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: s.run
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.table)
              to: versionsNotKept
          when: s.keep == 0
      - return: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: nil, DocumentNotTrashed, or a failure.
          		return s.purge(txCtx, ex, key)
          	})
        to: s.run
  - of: (*SQLStore).Tombstones
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Tombstones
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: time.Unix(at.Int64, ns.Int64).UTC
        kind: value
    steps:
      - opt:
          do:
            - return: nil, versionsNotKept(s.table)
          when: s.keep == 0
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, s.stmts.tombstones)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("read the trash", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "read the trash", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: tomb
                type: coredocstore.TombstoneValue
            - leaf: a var of several names, or of no type
              stmt: var at, ns stdsql.NullInt64
            - opt:
                do:
                  - return: nil, s.failed("read the trash", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&tomb.Key, &at, &ns)
                  to: rows.Scan
                when: scanErr != nil
            - opt:
                do:
                  - set: tomb.At
                    to: time.Unix(at.Int64, ns.Int64).UTC
                    value: time.Unix(at.Int64, ns.Int64).UTC()
                when: at.Valid
            - set: tombstones
              value: append(tombstones, tomb)
      - return: tombstones, nil
  - of: (*SQLStore).trash
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).trash
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
        kind: value
      - id: kerrs
        kind: package
      - id: s.failed
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.affected
        kind: internal
      - id: s.insertVersionRows
        kind: internal
    steps:
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: s.failed("lock a document", err)
              to: s.failed
          when: err != nil
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.deleteDoc, []byte(key))
        to: ex.ExecContext
      - opt:
          do:
            - return: affErr
          init:
            bind: affErr
            eval: s.affected(result, execErr, "trash a document")
            to: s.affected
          when: affErr != nil
      - opt:
          do:
            - opt:
                do:
                  - return: s.failed("delete a document's index rows", err)
                    to: s.failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, s.stmts.deleteIndex, []byte(key))
                  to: ex.ExecContext
                when: err != nil
          when: len(s.indexes) > 0
      - return: "s.insertVersionRows(ctx, ex, key, []versionRow{{at: new(s.clock.Now().UTC()), doc: raw, num: uint64(tombstoneNum)}})"
        to: s.insertVersionRows
  - of: (*SQLStore).restore
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).restore
        kind: self
      - id: s.firstVersion
        kind: internal
      - id: notTrashed
        kind: internal
      - id: decodeAs
        kind: internal
      - id: s.prepare
        kind: internal
      - id: kerrs
        kind: package
      - id: s.insertRow
        kind: internal
      - id: s.fileIndexes
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
    steps:
      - bind: num, raw, found, err
        eval: s.firstVersion(ctx, ex, key)
        to: s.firstVersion
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: notTrashed(s.table)
              to: notTrashed
          when: "!found || num != tombstoneNum"
      - bind: v, err
        eval: decodeAs[T](s.table, raw)
        to: decodeAs
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: p, err
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentKeyChanged, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: p.key != key
      - set: p.raw
        value: raw
      - opt:
          do:
            - return: insertErr
          init:
            bind: insertErr
            eval: s.insertRow(ctx, ex, p)
            to: s.insertRow
          when: insertErr != nil
      - opt:
          do:
            - return: fileErr
          init:
            bind: fileErr
            eval: s.fileIndexes(ctx, ex, p, false)
            to: s.fileIndexes
          when: fileErr != nil
      - opt:
          do:
            - return: s.failed("empty the trash", execErr)
              to: s.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, s.stmts.dropTombstone, []byte(key))
            to: ex.ExecContext
          when: execErr != nil
      - return: nil
  - of: (*SQLStore).purge
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).purge
        kind: self
      - id: s.firstVersion
        kind: internal
      - id: notTrashed
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
    steps:
      - bind: num, _, found, err
        eval: s.firstVersion(ctx, ex, key)
        to: s.firstVersion
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: notTrashed(s.table)
              to: notTrashed
          when: "!found || num != tombstoneNum"
      - opt:
          do:
            - return: s.failed("purge the trash", execErr)
              to: s.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, s.stmts.dropVersions, []byte(key))
            to: ex.ExecContext
          when: execErr != nil
      - return: nil
  - of: (*SQLStore).firstVersion
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).firstVersion
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.firstVersion, []byte(key)).Scan
        kind: value
    steps:
      - set: err
        to: ex.QueryRowContext(ctx, s.stmts.firstVersion, []byte(key)).Scan
        value: ex.QueryRowContext(ctx, s.stmts.firstVersion, []byte(key)).Scan(&num, &doc)
      - opt:
          do:
            - return: 0, nil, false, nil
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: 0, nil, false, s.failed("read the versions", err)
          when: err != nil
      - return: num, doc, true, nil
  - of: (*SQLStore).PutStamped
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).PutStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, upsert, stamp)
        to: s.store
  - of: (*SQLStore).InsertStamped
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).InsertStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, insertOnly, stamp)
        to: s.store
  - of: (*SQLStore).ReplaceStamped
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).ReplaceStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, replaceOnly, stamp)
        to: s.store
  - of: (*SQLStore).Versions
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Versions
        kind: self
      - id: s.readVersionRows
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, versionsNotKept(s.table)
          when: s.keep == 0
      - set: versions, err
        to: s.readVersionRows
        value: s.readVersionRows(ctx, s.stmts.readVersions, key)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: versions, nil
          when: len(versions) > 0
      - set: versions, err
        to: s.readVersionRows
        value: s.readVersionRows(ctx, s.stmts.readTrashed, key)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: len(versions) == 0
      - return: versions, nil
  - of: (*SQLStore).readVersionRows
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).readVersionRows
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: s.versionOf
        kind: internal
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, []byte(key))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("read the versions", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "read the versions", err) }()
      - set: versions
        value: make([]coredocstore.VersionValue, 0, s.keep+1)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: row
                type: scannedVersion
            - opt:
                do:
                  - return: nil, s.failed("read the versions", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&row.num, &row.at, &row.ns, &row.meta, &row.doc)
                  to: rows.Scan
                when: scanErr != nil
            - bind: v, decodeErr
              eval: s.versionOf(&row)
              to: s.versionOf
            - opt:
                do:
                  - return: nil, decodeErr
                when: decodeErr != nil
            - set: versions
              value: append(versions, v)
      - return: versions, nil
  - of: (*SQLStore).Version
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Version
        kind: self
      - id: s.Versions
        kind: internal
      - id: pickVersion
        kind: internal
    steps:
      - bind: all, err
        eval: s.Versions(ctx, key)
        to: s.Versions
      - opt:
          do:
            - return: coredocstore.VersionValue{}, err
          when: err != nil
      - return: pickVersion(s.table, all, number)
        to: pickVersion
  - of: (*SQLStore).RewriteVersions
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).RewriteVersions
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: s.run
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.table)
              to: versionsNotKept
          when: s.keep == 0
      - return: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: nil, DocumentNotFound, fn's own error, a refusal or a failure.
          		return s.rewrite(txCtx, ex, key, fn)
          	})
        to: s.run
  - of: (*SQLStore).rewrite
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).rewrite
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
        kind: value
      - id: kerrs
        kind: package
      - id: s.failed
        kind: internal
      - id: s.lockedFormers
        kind: internal
      - id: checkRewrite
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.insertVersionRows
        kind: internal
    steps:
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: s.failed("lock a document", err)
              to: s.failed
          when: err != nil
      - bind: given, err
        eval: s.lockedFormers(ctx, ex, key)
        to: s.lockedFormers
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: copies
        eval: make([]coredocstore.VersionValue, len(given))
      - loop:
          do:
            - set: copies[i]
              value: "coredocstore.VersionValue{At: f.At, Meta: maps.Clone(f.Meta), JSON: slices.Clone(f.Document), Number: f.Number}"
          key: i
          range: given
          value: f
      - bind: kept, err
        eval: fn(copies)
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: former, err
        eval: checkRewrite(s.table, given, kept)
        to: checkRewrite
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: s.failed("rewrite the versions", execErr)
              to: s.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, s.stmts.dropFormers, []byte(key))
            to: ex.ExecContext
          when: execErr != nil
      - bind: rows
        eval: make([]versionRow, len(former))
      - loop:
          do:
            - set: rows[i]
              value: "versionRow{at: knownInstant(f.At), meta: f.Meta, doc: f.Document, num: f.Number}"
          key: i
          range: former
          value: f
      - return: s.insertVersionRows(ctx, ex, key, rows)
        to: s.insertVersionRows
  - of: (*SQLStore).lockedFormers
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).lockedFormers
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: s.versionOf
        kind: internal
    steps:
      - bind: rows, err
        eval: ex.QueryContext(ctx, s.stmts.lockFormers, []byte(key))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("read the versions", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "read the versions", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: row
                type: scannedVersion
            - opt:
                do:
                  - return: nil, s.failed("read the versions", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&row.num, &row.at, &row.ns, &row.meta, &row.doc)
                  to: rows.Scan
                when: scanErr != nil
            - bind: v, decodeErr
              eval: s.versionOf(&row)
              to: s.versionOf
            - opt:
                do:
                  - return: nil, decodeErr
                when: decodeErr != nil
            - set: former
              value: "append(former, formerVersion{At: v.At, Meta: v.Meta, Document: v.JSON, Number: v.Number})"
      - return: former, nil
  - of: (*SQLStore).keepVersions
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).keepVersions
        kind: self
      - id: s.clock.Now().UTC
        kind: value
      - id: s.keepCreation
        kind: internal
      - id: s.prune
        kind: internal
      - id: s.readHead
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
      - id: s.insertVersionRows
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: s.keep == 0
      - bind: now
        eval: s.clock.Now().UTC()
        to: s.clock.Now().UTC
      - opt:
          do:
            - bind: created, err
              eval: s.keepCreation(ctx, ex, w, now)
              to: s.keepCreation
            - opt:
                do:
                  - return: err
                when: created || err != nil
          when: "!w.existed"
      - opt:
          do:
            - return: s.prune(ctx, ex, w.key)
              to: s.prune
          when: w.inPlace || bytes.Equal(w.old, w.raw)
      - bind: head, found, err
        eval: s.readHead(ctx, ex, w.key)
        to: s.readHead
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: rows
        eval: "[]versionRow{{at: &now, meta: w.meta, num: head + 1}}"
      - switch:
          cases:
            - case: found
              do:
                - opt:
                    do:
                      - return: s.failed("keep a former version", execErr)
                        to: s.failed
                    init:
                      bind: _, execErr
                      eval: ex.ExecContext(ctx, s.stmts.retireHead, w.old, []byte(w.key), int64(head))
                      to: ex.ExecContext
                    when: execErr != nil
            - default: true
              do:
                - set: rows
                  value: "[]versionRow{{doc: w.old, num: 1}, {at: &now, meta: w.meta, num: 2}}"
      - opt:
          do:
            - return: insertErr
          init:
            bind: insertErr
            eval: s.insertVersionRows(ctx, ex, w.key, rows)
            to: s.insertVersionRows
          when: insertErr != nil
      - return: s.prune(ctx, ex, w.key)
        to: s.prune
  - of: (*SQLStore).keepCreation
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).keepCreation
        kind: self
      - id: s.firstVersion
        kind: internal
      - id: ex.ExecContext
        kind: value
    steps:
      - bind: num, doc, found, err
        eval: s.firstVersion(ctx, ex, w.key)
        to: s.firstVersion
      - opt:
          do:
            - return: false, err
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: false, s.failed("empty the trash", execErr)
                init:
                  bind: _, execErr
                  eval: ex.ExecContext(ctx, s.stmts.dropTombstone, []byte(w.key))
                  to: ex.ExecContext
                when: execErr != nil
            - set: w.old, w.existed
              value: doc, true
            - return: false, nil
          when: found && num == tombstoneNum
      - opt:
          do:
            - opt:
                do:
                  - return: false, s.failed("keep a version", execErr)
                init:
                  bind: _, execErr
                  eval: ex.ExecContext(ctx, s.stmts.dropVersions, []byte(w.key))
                  to: ex.ExecContext
                when: execErr != nil
          when: found
      - return: "true, s.insertVersionRows(ctx, ex, w.key, []versionRow{{at: &now, meta: w.meta, num: 1}})"
  - of: (*SQLStore).readHead
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).readHead
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.versionHead, []byte(key)).Scan
        kind: value
    steps:
      - var:
          name: num
          type: int64
      - set: err
        to: ex.QueryRowContext(ctx, s.stmts.versionHead, []byte(key)).Scan
        value: ex.QueryRowContext(ctx, s.stmts.versionHead, []byte(key)).Scan(&num)
      - opt:
          do:
            - return: 1, false, nil
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: 0, false, s.failed("read the current version", err)
          when: err != nil
      - return: uint64(num), true, nil
  - of: (*SQLStore).prune
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).prune
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.pruneCut, []byte(key), int64(s.keep)).Scan
        kind: value
      - id: s.failed
        kind: internal
      - id: ex.ExecContext
        kind: value
    steps:
      - var:
          name: cut
          type: int64
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.pruneCut, []byte(key), int64(s.keep)).Scan(&cut)
        to: ex.QueryRowContext(ctx, s.stmts.pruneCut, []byte(key), int64(s.keep)).Scan
      - opt:
          do:
            - return: nil
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: s.failed("prune the versions", err)
              to: s.failed
          when: err != nil
      - opt:
          do:
            - return: nil
          when: s.held != nil && s.held(ctx, key)
      - opt:
          do:
            - return: s.failed("prune the versions", execErr)
              to: s.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, s.stmts.pruneVersions, []byte(key), cut)
            to: ex.ExecContext
          when: execErr != nil
      - return: nil
  - of: (*SQLStore).insertVersionRows
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).insertVersionRows
        kind: self
      - id: s.versionArgs
        kind: internal
      - id: svcsql
        kind: package
      - id: s.failed
        kind: internal
    steps:
      - bind: args, err
        eval: s.versionArgs(key, rows)
        to: s.versionArgs
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: s.failed("keep a version", execErr)
              to: s.failed
          init:
            bind: _, execErr
            eval: |-
              svcsql.InsertRows(ctx, ex, s.stmts.dialect, s.stmts.versionInsert(),
              		rowsOf(args, versionRowArgs))
            to: svcsql
          when: execErr != nil
      - return: nil
  - of: (*SQLStore).versionArgs
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).versionArgs
        kind: self
      - id: json
        kind: stdlib
    steps:
      - bind: args
        eval: make([]any, 0, versionRowArgs*len(batch))
      - loop:
          do:
            - leaf: a var of several names, or of no type
              stmt: var at, ns, meta, doc any
            - opt:
                do:
                  - set: at, ns
                    value: row.at.Unix(), int64(row.at.Nanosecond())
                when: row.at != nil
            - opt:
                do:
                  - bind: encoded, err
                    eval: json.Marshal(row.meta)
                    to: json
                  - opt:
                      do:
                        - return: |-
                            nil, kerrs.Wrap(coredocstore.DocumentUnencodable, kerrs.WrapParams{},
                            					kerrs.String("store", s.table), kerrs.String("cause", encodeCause(err)))
                      when: err != nil
                  - set: meta
                    value: encoded
                when: len(row.meta) > 0
            - opt:
                do:
                  - set: doc
                    value: row.doc
                when: row.doc != nil
            - set: args
              value: append(args, []byte(key), int64(row.num), at, ns, meta, doc)
          key: _
          range: batch
          value: row
      - return: args, nil
  - of: (*SQLStore).versionOf
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).versionOf
        kind: self
      - id: time.Unix(row.at.Int64, row.ns.Int64).UTC
        kind: value
      - id: json
        kind: stdlib
    steps:
      - bind: v
        eval: "coredocstore.VersionValue{JSON: row.doc, Number: 1}"
      - opt:
          do:
            - set: v.Number
              value: uint64(row.num.Int64)
          when: row.num.Valid
      - opt:
          do:
            - set: v.At
              to: time.Unix(row.at.Int64, row.ns.Int64).UTC
              value: time.Unix(row.at.Int64, row.ns.Int64).UTC()
          when: row.at.Valid
      - opt:
          do:
            - opt:
                do:
                  - return: |-
                      coredocstore.VersionValue{}, kerrs.Wrap(coredocstore.DocumentUndecodable, kerrs.WrapParams{},
                      				kerrs.String("store", s.table), kerrs.String("cause", "the metadata of a version: "+jsonCause(err, reflect.TypeOf(v.Meta))))
                init:
                  bind: err
                  eval: json.Unmarshal(row.meta, &v.Meta)
                  to: json
                when: err != nil
          when: len(row.meta) > 0
      - return: v, nil
  - of: knownInstant
    steps:
      - opt:
          do:
            - return: nil
          when: at.IsZero()
      - return: "&at"
  - of: (*SQLStore).PutDocument
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).PutDocument
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: s.preparedDocument
        kind: internal
      - id: s.run
        kind: internal
      - id: s.settle
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.table)
              to: versionsNotKept
          when: s.keep == 0
      - bind: p, given, err
        eval: s.preparedDocument(key, versions)
        to: s.preparedDocument
      - opt:
          do:
            - return: err
          when: err != nil
      - set: err
        to: s.run
        value: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: the document, its index rows and its version rows, or nothing.
          		return s.putDocument(txCtx, ex, p, given, trashedAt)
          	})
      - opt:
          do:
            - return: s.settle(ctx, err)
              to: s.settle
          when: err != nil
      - opt:
          do:
            - eval: s.announce(ctx, &s.onWrite, key)
              to: s.announce
          when: trashedAt.IsZero()
      - return: nil
  - of: (*SQLStore).preparedDocument
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).preparedDocument
        kind: self
      - id: checkDocument
        kind: internal
      - id: decodeAs
        kind: internal
      - id: s.prepare
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil, kerrs.Wrap(coredocstore.DocumentKeyEmpty, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: key == ""
      - bind: given, err
        eval: checkDocument(s.table, versions)
        to: checkDocument
      - opt:
          do:
            - return: nil, nil, err
          when: err != nil
      - bind: v, err
        eval: decodeAs[T](s.table, given[0].JSON)
        to: decodeAs
      - opt:
          do:
            - return: nil, nil, err
          when: err != nil
      - bind: p, err
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: nil, nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, nil, versionsInvalid(s.table, problemOtherKey)
          when: p.key != key
      - set: p.raw
        value: given[0].JSON
      - return: p, given, nil
  - of: (*SQLStore).putDocument
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).putDocument
        kind: self
      - id: s.keyTaken
        kind: internal
      - id: s.insertVersionRows
        kind: internal
      - id: s.insertRow
        kind: internal
      - id: s.fileIndexes
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.keyTaken(ctx, ex, p.key)
            to: s.keyTaken
          when: err != nil
      - bind: rows
        eval: make([]versionRow, 0, len(given)+1)
      - loop:
          do:
            - bind: row
              eval: "versionRow{at: knownInstant(v.At), meta: v.Meta, num: v.Number}"
            - opt:
                do:
                  - set: row.doc
                    value: v.JSON
                when: i > 0
            - set: rows
              value: append(rows, row)
          key: i
          range: given
          value: v
      - opt:
          do:
            - set: rows
              value: "append(rows, versionRow{at: new(trashedAt.UTC()), doc: p.raw, num: uint64(tombstoneNum)})"
            - return: s.insertVersionRows(ctx, ex, p.key, rows)
              to: s.insertVersionRows
          when: "!trashedAt.IsZero()"
      - opt:
          do:
            - return: insertErr
          init:
            bind: insertErr
            eval: s.insertRow(ctx, ex, p)
            to: s.insertRow
          when: insertErr != nil
      - opt:
          do:
            - return: fileErr
          init:
            bind: fileErr
            eval: s.fileIndexes(ctx, ex, p, false)
            to: s.fileIndexes
          when: fileErr != nil
      - return: s.insertVersionRows(ctx, ex, p.key, rows)
        to: s.insertVersionRows
  - of: (*SQLStore).keyTaken
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).keyTaken
        kind: self
      - id: s.firstVersion
        kind: internal
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
        kind: value
      - id: s.failed
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: _, _, found, err
        eval: s.firstVersion(ctx, ex, key)
        to: s.firstVersion
      - opt:
          do:
            - return: err
          when: err != nil
      - var:
          name: raw
          type: "[]byte"
      - bind: lockErr
        eval: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
      - opt:
          do:
            - return: s.failed("lock a document", lockErr)
              to: s.failed
          when: lockErr != nil && !errors.Is(lockErr, stdsql.ErrNoRows)
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentExists, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: found || lockErr == nil
      - return: nil
  - of: (*SQLStore).VersionWeight
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).VersionWeight
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.versionWeight).Scan
        kind: value
    steps:
      - opt:
          do:
            - return: coredocstore.VersionWeightValue{}, versionsNotKept(s.table)
          when: s.keep == 0
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - leaf: a var of several names, or of no type
        stmt: var former, trashed, size int64
      - opt:
          do:
            - return: coredocstore.VersionWeightValue{}, s.failed("weigh the versions", err)
          init:
            bind: err
            eval: ex.QueryRowContext(ctx, s.stmts.versionWeight).Scan(&former, &trashed, &size)
            to: ex.QueryRowContext(ctx, s.stmts.versionWeight).Scan
          when: err != nil
      - return: "coredocstore.VersionWeightValue{Former: int(former), Trashed: int(trashed), Bytes: size}, nil"
  - of: (*mayConflict).Error
    steps:
      - return: "\"docstore: \" + c.step + \" failed, and may have collided\""
  - of: (*SQLStore).Put
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Put
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, upsert, coredocstore.StampValue{})
        to: s.store
  - of: (*SQLStore).Insert
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Insert
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, insertOnly, coredocstore.StampValue{})
        to: s.store
  - of: (*SQLStore).Replace
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Replace
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(ctx, v, replaceOnly, coredocstore.StampValue{})
        to: s.store
  - of: (*SQLStore).Update
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Update
        kind: self
      - id: s.UpdateStamped
        kind: internal
    steps:
      - return: s.UpdateStamped(ctx, key, coredocstore.StampValue{}, fn)
        to: s.UpdateStamped
  - of: (*SQLStore).UpdateStamped
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).UpdateStamped
        kind: self
      - id: s.run
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - leaf: a var of several names, or of no type
        stmt: var zero, result T
      - bind: err
        eval: |-
          s.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		var err error
          		result, err = s.modify(txCtx, ex, key, stamp, fn)
          		//: nil, a refusal, fn's own error, or a failure.
          		return err
          	})
        to: s.run
      - opt:
          do:
            - return: zero, s.settle(ctx, err)
          when: err != nil
      - eval: s.announce(ctx, &s.onWrite, key)
        to: s.announce
      - return: result, nil
  - of: (*SQLStore).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).Delete
        kind: self
      - id: s.run
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - bind: err
        eval: |-
          s.run(ctx, s.several(), func(txCtx context.Context, ex coresql.Executor) error {
          		//: the document, then its index rows and its versions.
          		return s.remove(txCtx, ex, key)
          	})
        to: s.run
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: s.announce(ctx, &s.onDelete, key)
        to: s.announce
      - return: nil
  - of: (*SQLStore).store
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).store
        kind: self
      - id: s.prepare
        kind: internal
      - id: s.write
        kind: internal
    steps:
      - bind: p, err
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: err
          when: err != nil
      - return: s.write(ctx, p, mode, stamp)
        to: s.write
  - of: (*SQLStore).write
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).write
        kind: self
      - id: s.run
        kind: internal
      - id: s.settle
        kind: internal
      - id: s.announce
        kind: internal
    steps:
      - bind: err
        eval: |-
          s.run(ctx, s.several(), func(txCtx context.Context, ex coresql.Executor) error {
          		//: nil, DocumentExists, DocumentNotFound, a failure, or a collision.
          		return s.writeIn(txCtx, ex, p, mode, stamp)
          	})
        to: s.run
      - opt:
          do:
            - return: s.settle(ctx, err)
              to: s.settle
          when: err != nil
      - eval: s.announce(ctx, &s.onWrite, p.key)
        to: s.announce
      - return: nil
  - of: (*SQLStore).writeIn
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).writeIn
        kind: self
      - id: s.writeDocument
        kind: internal
      - id: s.fileIndexes
        kind: internal
      - id: s.keepVersions
        kind: internal
    steps:
      - bind: existed, old, writeErr
        eval: s.writeDocument(ctx, ex, p, mode)
        to: s.writeDocument
      - opt:
          do:
            - set: writeErr
              to: s.fileIndexes
              value: s.fileIndexes(ctx, ex, p, existed)
          when: writeErr == nil
      - opt:
          do:
            - set: writeErr
              to: s.keepVersions
              value: "s.keepVersions(ctx, ex, &storedWrite{meta: stamp.Meta, old: old, raw: p.raw, key: p.key, existed: existed, inPlace: stamp.InPlace})"
          when: writeErr == nil
      - return: writeErr
  - of: (*SQLStore).run
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).run
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: s.tm.Transact
        kind: value
    steps:
      - bind: ex, inTx
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - opt:
          do:
            - return: s.tm.Transact(ctx, coresql.TxOptionsValue{}, work)
              to: s.tm.Transact
          when: inTx
      - opt:
          do:
            - return: work(ctx, ex)
          when: "!several"
      - return: s.tm.Transact(ctx, s.own, work)
        to: s.tm.Transact
  - of: (*SQLStore).settle
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).settle
        kind: self
      - id: s.classify
        kind: internal
    steps:
      - bind: conflict, collided
        eval: errors.AsType[*mayConflict](err)
      - opt:
          do:
            - return: err
          when: "!collided"
      - return: s.classify(ctx, conflict)
        to: s.classify
  - of: (*SQLStore).announce
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).announce
        kind: self
      - id: hooks.call
        kind: internal
    steps:
      - bind: call
        eval:
          closure:
            steps:
              - eval: hooks.call(key)
                to: hooks.call
      - opt:
          do:
            - return: ""
          when: s.tx.hold.Defer(ctx, call)
      - eval: call()
  - of: (*SQLStore).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).prepare
        kind: self
      - id: encodeAs
        kind: internal
      - id: s.indexRows
        kind: internal
    steps:
      - bind: key, raw, err
        eval: encodeAs(s.table, s.key, v)
        to: encodeAs
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, s.tooLong("")
          when: len(key) > MaxSQLKeyLen
      - bind: rows, err
        eval: s.indexRows(v)
        to: s.indexRows
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&sqlPrepared{key: key, raw: raw, rows: rows}, nil"
  - of: (*SQLStore).indexRows
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).indexRows
        kind: self
      - id: fileableKeys
        kind: internal
      - id: s.fileKey
        kind: internal
    steps:
      - var:
          name: rows
          type: "[]indexRow"
      - loop:
          do:
            - bind: keys
              eval: fileableKeys(spec.Keys(v))
              to: fileableKeys
            - opt:
                do:
                  - return: nil, invalidKey(s.table, spec.Name)
                when: "!validKeys(keys)"
            - loop:
                do:
                  - bind: filed
                    eval: s.fileKey(spec.Name, k)
                    to: s.fileKey
                  - opt:
                      do:
                        - continue: true
                      when: |-
                        len(filed) == 0 || slices.ContainsFunc(rows, func(r indexRow) bool {
                        				return r.name == spec.Name && bytes.Equal(r.key, filed)
                        			})
                  - opt:
                      do:
                        - return: nil, s.tooLong(spec.Name)
                      when: len(filed) > MaxSQLKeyLen
                  - set: rows
                    value: "append(rows, indexRow{name: spec.Name, key: filed, unique: spec.Unique})"
                key: _
                range: keys
                value: k
          key: _
          range: s.indexes
          value: spec
      - return: rows, nil
  - of: (*SQLStore).several
    steps:
      - return: len(s.indexes) > 0 || s.keep > 0
  - of: (*SQLStore).writeDocument
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).writeDocument
        kind: self
      - id: s.claimRow
        kind: internal
      - id: s.upsertRow
        kind: internal
      - id: s.lockedReplaceIf
        kind: internal
      - id: s.lockedReplace
        kind: internal
      - id: ex.ExecContext
        kind: value
    steps:
      - bind: key
        eval: "[]byte(p.key)"
      - switch:
          cases:
            - case: upsert
              do:
                - opt:
                    do:
                      - return: s.claimRow(ctx, ex, p)
                        to: s.claimRow
                    when: s.keep > 0
                - set: existed, err
                  to: s.upsertRow
                  value: s.upsertRow(ctx, ex, key, p.raw)
                - return: existed, nil, err
            - case: insertOnly
              do:
                - return: false, nil, s.insertRow(ctx, ex, p)
            - case: replaceOnRevision
              do:
                - opt:
                    do:
                      - set: old, err
                        to: s.lockedReplaceIf
                        value: s.lockedReplaceIf(ctx, ex, p)
                      - return: true, old, err
                    when: s.keep > 0
                - return: true, nil, s.replaceOnRevision(ctx, ex, p)
            - default: true
              do:
                - opt:
                    do:
                      - set: old, err
                        to: s.lockedReplace
                        value: s.lockedReplace(ctx, ex, p)
                      - return: true, old, err
                    when: s.keep > 0
                - bind: result, execErr
                  eval: ex.ExecContext(ctx, s.stmts.replace, []byte(p.raw), key)
                  to: ex.ExecContext
                - return: true, nil, s.affected(result, execErr, "replace a document")
          "on": mode
  - of: (*SQLStore).claimRow
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).claimRow
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.claim, key, []byte(p.raw)).Scan
        kind: value
      - id: ex.ExecContext
        kind: value
      - id: rowsAffected
        kind: internal
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, key).Scan
        kind: value
    steps:
      - bind: key
        eval: "[]byte(p.key)"
      - alt:
          - do:
              - var:
                  name: rev
                  type: int64
              - opt:
                  do:
                    - return: false, nil, s.failed("write a document", scanErr)
                  init:
                    bind: scanErr
                    eval: ex.QueryRowContext(ctx, s.stmts.claim, key, []byte(p.raw)).Scan(&rev, &old)
                    to: ex.QueryRowContext(ctx, s.stmts.claim, key, []byte(p.raw)).Scan
                  when: scanErr != nil
              - opt:
                  do:
                    - return: false, nil, nil
                  when: rev == 1
            when: s.stmts.claimReturnsRow()
          - do:
              - bind: result, execErr
                eval: ex.ExecContext(ctx, s.stmts.claim, key, []byte(p.raw))
                to: ex.ExecContext
              - bind: n, countErr
                eval: rowsAffected(result, execErr)
                to: rowsAffected
              - opt:
                  do:
                    - return: false, nil, s.failed("write a document", countErr)
                  when: countErr != nil
              - opt:
                  do:
                    - return: false, nil, nil
                  when: n == 1
              - opt:
                  do:
                    - return: false, nil, s.failed("lock a document", scanErr)
                  init:
                    bind: scanErr
                    eval: ex.QueryRowContext(ctx, s.stmts.lockDoc, key).Scan(&old)
                    to: ex.QueryRowContext(ctx, s.stmts.lockDoc, key).Scan
                  when: scanErr != nil
            else: true
      - return: true, old, s.writeLockedRow(ctx, ex, p)
  - of: (*SQLStore).lockedReplace
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).lockedReplace
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(p.key)).Scan
        kind: value
    steps:
      - set: err
        to: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(p.key)).Scan
        value: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(p.key)).Scan(&old)
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: nil, s.failed("lock a document", err)
          when: err != nil
      - return: old, s.writeLockedRow(ctx, ex, p)
  - of: (*SQLStore).writeLockedRow
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).writeLockedRow
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: s.affected
        kind: internal
    steps:
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.writeLocked, []byte(p.raw), []byte(p.key))
        to: ex.ExecContext
      - return: s.affected(result, execErr, "update a document")
        to: s.affected
  - of: (*SQLStore).upsertRow
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).upsertRow
        kind: self
      - id: s.stmts.upsertArgs
        kind: internal
      - id: ex.QueryRowContext(ctx, s.stmts.upsert, args...).Scan
        kind: value
      - id: ex.ExecContext
        kind: value
      - id: result.RowsAffected
        kind: value
    steps:
      - bind: args
        eval: s.stmts.upsertArgs(key, raw)
        to: s.stmts.upsertArgs
      - opt:
          do:
            - var:
                name: rev
                type: int64
            - opt:
                do:
                  - return: false, s.failed("write a document", scanErr)
                init:
                  bind: scanErr
                  eval: ex.QueryRowContext(ctx, s.stmts.upsert, args...).Scan(&rev)
                  to: ex.QueryRowContext(ctx, s.stmts.upsert, args...).Scan
                when: scanErr != nil
            - return: rev > 1, nil
          when: s.stmts.upsertReturnsRev()
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.upsert, args...)
        to: ex.ExecContext
      - opt:
          do:
            - return: false, s.failed("write a document", execErr)
          when: execErr != nil
      - bind: n, countErr
        eval: result.RowsAffected()
        to: result.RowsAffected
      - opt:
          do:
            - return: false, s.failed("write a document", countErr)
          when: countErr != nil
      - return: n != 1, nil
  - of: (*SQLStore).insertRow
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).insertRow
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: rowsAffected
        kind: internal
      - id: s.failed
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.insert, []byte(p.key), []byte(p.raw))
        to: ex.ExecContext
      - opt:
          do:
            - bind: n, err
              eval: rowsAffected(result, execErr)
              to: rowsAffected
            - opt:
                do:
                  - return: s.failed("insert a document", err)
                    to: s.failed
                when: err != nil
            - opt:
                do:
                  - return: kerrs.Wrap(coredocstore.DocumentExists, kerrs.WrapParams{}, kerrs.String("store", s.table))
                    to: kerrs
                when: n == 0
            - return: nil
          when: s.stmts.insertConflictIsZeroRows()
      - opt:
          do:
            - return: "&mayConflict{cause: execErr, step: \"insert a document\", written: p, kind: docConflict}"
          when: execErr != nil
      - return: nil
  - of: (*SQLStore).modify
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).modify
        kind: self
      - id: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
        kind: value
      - id: decodeAs
        kind: internal
      - id: s.prepare
        kind: internal
      - id: s.writeLockedRow
        kind: internal
      - id: s.fileIndexes
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - var:
          name: raw
          type: "[]byte"
      - bind: err
        eval: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan(&raw)
        to: ex.QueryRowContext(ctx, s.stmts.lockDoc, []byte(key)).Scan
      - opt:
          do:
            - return: zero, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: errors.Is(err, stdsql.ErrNoRows)
      - opt:
          do:
            - return: zero, s.failed("lock a document", err)
          when: err != nil
      - bind: v, err
        eval: decodeAs[T](s.table, raw)
        to: decodeAs
      - opt:
          do:
            - return: zero, err
          when: err != nil
      - opt:
          do:
            - return: zero, fnErr
          init:
            bind: fnErr
            eval: fn(&v)
          when: fnErr != nil
      - bind: p, err
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: zero, err
          when: err != nil
      - opt:
          do:
            - return: zero, kerrs.Wrap(coredocstore.DocumentKeyChanged, kerrs.WrapParams{}, kerrs.String("store", s.table))
          when: p.key != key
      - opt:
          do:
            - return: zero, affErr
          init:
            bind: affErr
            eval: s.writeLockedRow(ctx, ex, p)
            to: s.writeLockedRow
          when: affErr != nil
      - opt:
          do:
            - return: zero, fileErr
          init:
            bind: fileErr
            eval: s.fileIndexes(ctx, ex, p, true)
            to: s.fileIndexes
          when: fileErr != nil
      - return: "v, s.keepVersions(ctx, ex, &storedWrite{meta: stamp.Meta, old: raw, raw: p.raw, key: key, existed: true, inPlace: stamp.InPlace})"
  - of: (*SQLStore).remove
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).remove
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: s.affected
        kind: internal
      - id: s.failed
        kind: internal
    steps:
      - bind: result, execErr
        eval: ex.ExecContext(ctx, s.stmts.deleteDoc, []byte(key))
        to: ex.ExecContext
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.affected(result, execErr, "delete a document")
            to: s.affected
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - return: s.failed("delete a document's index rows", err)
                    to: s.failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, s.stmts.deleteIndex, []byte(key))
                  to: ex.ExecContext
                when: err != nil
          when: len(s.indexes) > 0
      - opt:
          do:
            - opt:
                do:
                  - return: s.failed("delete a document's versions", err)
                    to: s.failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, s.stmts.dropVersions, []byte(key))
                  to: ex.ExecContext
                when: err != nil
          when: s.keep > 0
      - return: nil
  - of: (*SQLStore).fileIndexes
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).fileIndexes
        kind: self
      - id: s.checkUnique
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: s.failed
        kind: internal
      - id: svcsql
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: len(s.indexes) == 0
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.checkUnique(ctx, ex, p, false)
            to: s.checkUnique
          when: err != nil
      - bind: key
        eval: "[]byte(p.key)"
      - opt:
          do:
            - opt:
                do:
                  - return: s.failed("delete a document's index rows", err)
                    to: s.failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, s.stmts.deleteIndex, key)
                  to: ex.ExecContext
                when: err != nil
          when: existed
      - opt:
          do:
            - return: "&mayConflict{cause: err, step: \"file a document's index rows\", written: p, kind: uniqueConflict}"
          init:
            bind: _, err
            eval: |-
              svcsql.InsertRows(ctx, ex, s.stmts.dialect, s.stmts.indexInsert(),
              		rowsOf(rowArgs(key, p.rows), indexRowArgs))
            to: svcsql
          when: err != nil
      - return: nil
  - of: (*SQLStore).checkUnique
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).checkUnique
        kind: self
      - id: slices
        kind: stdlib
      - id: s.queryNames
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: unique
        eval: slices.DeleteFunc(slices.Clone(p.rows), func(r indexRow) bool { return !r.unique })
        to: slices
      - var:
          name: taken
          type: "[]string"
      - bind: args
        eval: make([]any, 0, 1+2*min(len(unique), uniqueKeysPerStatement))
      - loop:
          do:
            - set: args
              value: append(args[:0], []byte(p.key))
            - loop:
                do:
                  - set: args
                    value: append(args, []byte(row.name), row.key)
                key: _
                range: batch
                value: row
            - bind: names, err
              eval: s.queryNames(ctx, ex, s.stmts.uniqueTaken(len(batch), shared), args)
              to: s.queryNames
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: taken
              value: append(taken, names...)
          key: batch
          range: slices.Chunk(unique, uniqueKeysPerStatement)
      - loop:
          do:
            - opt:
                do:
                  - return: kerrs.Wrap(coredocstore.UniqueKeyTaken, kerrs.WrapParams{}, kerrs.String("store", s.table), kerrs.String("index", spec.Name))
                    to: kerrs
                when: slices.Contains(taken, spec.Name)
          key: _
          range: s.indexes
          value: spec
      - return: nil
  - of: (*SQLStore).classify
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).classify
        kind: self
      - id: s.tx.join.Join
        kind: value
      - id: ex.QueryRowContext(ctx, s.stmts.exists, []byte(conflict.written.key)).Scan
        kind: value
      - id: kerrs
        kind: package
      - id: s.failed
        kind: internal
      - id: s.checkUnique
        kind: internal
    steps:
      - bind: ex, _
        eval: s.tx.join.Join(ctx)
        to: s.tx.join.Join
      - opt:
          do:
            - var:
                name: one
                type: int64
            - bind: err
              eval: ex.QueryRowContext(ctx, s.stmts.exists, []byte(conflict.written.key)).Scan(&one)
              to: ex.QueryRowContext(ctx, s.stmts.exists, []byte(conflict.written.key)).Scan
            - opt:
                do:
                  - return: kerrs.Wrap(coredocstore.DocumentExists, kerrs.WrapParams{}, kerrs.String("store", s.table))
                    to: kerrs
                when: err == nil
            - return: s.failed(conflict.step, conflict.cause)
              to: s.failed
          when: conflict.kind == docConflict
      - opt:
          do:
            - return: refusal
          init:
            bind: refusal
            eval: s.checkUnique(ctx, ex, conflict.written, true)
            to: s.checkUnique
          when: |-
            refusal != nil &&
            		kerrs.HasCode(refusal, coredocstore.CodeUniqueKeyTaken)
      - return: s.failed(conflict.step, conflict.cause)
        to: s.failed
  - of: (*SQLStore).queryNames
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).queryNames
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, s.failed("check the unique indexes", err)
          when: err != nil
      - defer: func() { err = s.finishRows(rows, "check the unique indexes", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: name
                type: string
            - opt:
                do:
                  - return: nil, s.failed("check the unique indexes", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&name)
                  to: rows.Scan
                when: scanErr != nil
            - set: names
              value: append(names, name)
      - return: names, nil
  - of: (*SQLStore).affected
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).affected
        kind: self
      - id: rowsAffected
        kind: internal
      - id: s.failed
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: n, err
        eval: rowsAffected(result, execErr)
        to: rowsAffected
      - opt:
          do:
            - return: s.failed(step, err)
              to: s.failed
          when: err != nil
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.table))
              to: kerrs
          when: n == 0
      - return: nil
  - of: (*SQLStore).tooLong
    participants:
      - id: caller
        kind: actor
      - id: (*SQLStore).tooLong
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: fields
        eval: "[]kerrs.FieldValue{kerrs.String(\"store\", s.table), kerrs.String(\"limit\", strconv.Itoa(MaxSQLKeyLen))}"
      - opt:
          do:
            - set: fields
              value: append(fields, kerrs.String("index", index))
          when: index != ""
      - return: kerrs.Wrap(coredocstore.KeyTooLong, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: rowsAffected
    participants:
      - id: caller
        kind: actor
      - id: rowsAffected
        kind: self
      - id: result.RowsAffected
        kind: value
    steps:
      - opt:
          do:
            - return: 0, execErr
          when: execErr != nil
      - return: result.RowsAffected()
        to: result.RowsAffected
  - of: (*Store).Trash
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Trash
        kind: self
      - id: s.trash
        kind: internal
      - id: s.onDelete.call
        kind: internal
    steps:
      - bind: applied, err
        eval: s.trash(key)
        to: s.trash
      - opt:
          do:
            - eval: s.onDelete.call(key)
              to: s.onDelete.call
          when: applied
      - return: err
  - of: (*Store).Restore
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Restore
        kind: self
      - id: s.restore
        kind: internal
      - id: s.onWrite.call
        kind: internal
    steps:
      - bind: applied, err
        eval: s.restore(key)
        to: s.restore
      - opt:
          do:
            - eval: s.onWrite.call(key)
              to: s.onWrite.call
          when: applied
      - return: err
  - of: (*Store).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Purge
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: kerrs
        kind: package
      - id: s.trashedRecord
        kind: internal
      - id: notTrashed
        kind: internal
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.path)
              to: versionsNotKept
          when: s.keep == 0
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
              to: kerrs
          when: s.closed
      - opt:
          do:
            - return: notTrashed(s.path)
              to: notTrashed
          init:
            bind: _, trashed
            eval: s.trashedRecord(key)
            to: s.trashedRecord
          when: "!trashed"
      - bind: persistErr
        eval: s.persist(key, nil, true, nil)
        to: s.persist
      - opt:
          do:
            - return: persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - eval: s.setVersions(key, nil)
        to: s.setVersions
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: persistErr
  - of: (*Store).Tombstones
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Tombstones
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, versionsNotKept(s.path)
          when: s.keep == 0
      - lock:
          mutex: s.mu
          read: true
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: trashed
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: trashed
                when: record.Trashed != nil
          key: _
          range: s.versions
          value: record
      - bind: out
        eval: make([]coredocstore.TombstoneValue, 0, trashed)
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: "append(out, coredocstore.TombstoneValue{Key: key, At: record.Trashed.At})"
                when: record.Trashed != nil
          key: key
          range: s.versions
          value: record
      - eval: |-
          slices.SortFunc(out, func(a, b coredocstore.TombstoneValue) int {
          		//: by key, as List orders documents: by their bytes.
          		return cmp.Compare(a.Key, b.Key)
          	})
        to: slices
      - return: out, nil
  - of: (*Store).trash
    participants:
      - id: caller
        kind: actor
      - id: (*Store).trash
        kind: self
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.unfile
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: false, versionsNotKept(s.path)
          when: s.keep == 0
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: raw, found
        eval: s.docs[key]
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: "!found"
      - bind: head, former
        eval: firstHead, []formerVersion(nil)
      - opt:
          do:
            - set: head, former
              value: record.Current, record.Former
          init:
            bind: record
            eval: s.versions[key]
          when: record != nil
      - bind: next
        eval: |-
          &versionsRecord{
          		Trashed: &trashedDocument{At: s.now(), Document: compactJSON(raw)},
          		Former:  former,
          		Current: head,
          	}
      - bind: persistErr
        eval: s.persist(key, nil, true, next)
        to: s.persist
      - opt:
          do:
            - return: false, persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - eval: delete(s.docs, key)
      - eval: s.setVersions(key, next)
        to: s.setVersions
      - eval: s.unfile(key)
        to: s.unfile
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: true, persistErr
  - of: (*Store).restore
    participants:
      - id: caller
        kind: actor
      - id: (*Store).restore
        kind: self
      - id: s.trashedRecord
        kind: internal
      - id: s.decode
        kind: internal
      - id: s.indexKeys
        kind: internal
      - id: s.uniqueTaken
        kind: internal
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.file
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: false, versionsNotKept(s.path)
          when: s.keep == 0
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: record, trashed
        eval: s.trashedRecord(key)
        to: s.trashedRecord
      - opt:
          do:
            - return: false, notTrashed(s.path)
          when: "!trashed"
      - bind: raw
        eval: record.Trashed.Document
      - bind: v, decodeErr
        eval: s.decode(raw)
        to: s.decode
      - opt:
          do:
            - return: false, decodeErr
          when: decodeErr != nil
      - bind: keys
        eval: s.indexKeys(v)
        to: s.indexKeys
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.UniqueKeyTaken, kerrs.WrapParams{}, kerrs.String("store", s.path), kerrs.String("index", name))
          init:
            bind: name, taken
            eval: s.uniqueTaken(key, keys)
            to: s.uniqueTaken
          when: taken
      - bind: next
        eval: "&versionsRecord{Current: record.Current, Former: record.Former}"
      - bind: persistErr
        eval: s.persist(key, raw, false, next)
        to: s.persist
      - opt:
          do:
            - return: false, persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.docs[key]
        value: raw
      - eval: s.setVersions(key, next)
        to: s.setVersions
      - eval: s.file(key, keys)
        to: s.file
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: true, persistErr
  - of: (*Store).trashedRecord
    steps:
      - bind: record
        eval: s.versions[key]
      - return: record, record != nil && record.Trashed != nil
  - of: notTrashed
    participants:
      - id: caller
        kind: actor
      - id: notTrashed
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(coredocstore.DocumentNotTrashed, kerrs.WrapParams{}, kerrs.String("store", store))
        to: kerrs
  - of: (*Store).PutStamped
    participants:
      - id: caller
        kind: actor
      - id: (*Store).PutStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, upsert, stamp)
        to: s.store
  - of: (*Store).InsertStamped
    participants:
      - id: caller
        kind: actor
      - id: (*Store).InsertStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, insertOnly, stamp)
        to: s.store
  - of: (*Store).ReplaceStamped
    participants:
      - id: caller
        kind: actor
      - id: (*Store).ReplaceStamped
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, replaceOnly, stamp)
        to: s.store
  - of: (*Store).UpdateStamped
    participants:
      - id: caller
        kind: actor
      - id: (*Store).UpdateStamped
        kind: self
      - id: s.modify
        kind: internal
      - id: s.onWrite.call
        kind: internal
    steps:
      - bind: v, applied, err
        eval: s.modify(key, stamp, fn)
        to: s.modify
      - opt:
          do:
            - eval: s.onWrite.call(key)
              to: s.onWrite.call
          when: applied
      - return: v, err
  - of: (*Store).Versions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Versions
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: record.list
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, versionsNotKept(s.path)
          when: s.keep == 0
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: raw, found
        eval: s.docs[key]
      - bind: record, closed
        eval: s.versions[key], s.closed
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: closed
      - opt:
          do:
            - set: raw, found
              value: record.Trashed.Document, true
          when: "!found && record != nil && record.Trashed != nil"
      - opt:
          do:
            - return: nil, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: "!found"
      - return: record.list(raw), nil
        to: record.list
  - of: (*Store).Version
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Version
        kind: self
      - id: s.Versions
        kind: internal
      - id: pickVersion
        kind: internal
    steps:
      - bind: all, err
        eval: s.Versions(key)
        to: s.Versions
      - opt:
          do:
            - return: coredocstore.VersionValue{}, err
          when: err != nil
      - return: pickVersion(s.path, all, number)
        to: pickVersion
  - of: (*Store).RewriteVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).RewriteVersions
        kind: self
      - id: versionsNotKept
        kind: internal
      - id: kerrs
        kind: package
      - id: rewriteRecord
        kind: internal
      - id: s.persist
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.setVersions
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: versionsNotKept(s.path)
              to: versionsNotKept
          when: s.keep == 0
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
              to: kerrs
          when: s.closed
      - bind: raw, found
        eval: s.docs[key]
      - opt:
          do:
            - return: kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
              to: kerrs
          when: "!found"
      - bind: record
        eval: s.versions[key]
      - bind: next, err
        eval: rewriteRecord(s.path, record, fn)
        to: rewriteRecord
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: persistErr
        eval: s.persist(key, raw, false, next)
        to: s.persist
      - opt:
          do:
            - return: persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - eval: s.setVersions(key, next)
        to: s.setVersions
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: persistErr
  - of: (*Store).nextVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).nextVersions
        kind: self
      - id: s.nextVersionsFrom
        kind: internal
    steps:
      - bind: old, existed
        eval: s.docs[key]
      - return: "s.nextVersionsFrom(key, priorState{raw: old, existed: existed, record: s.versions[key]}, raw, stamp)"
        to: s.nextVersionsFrom
  - of: (*Store).nextVersionsFrom
    participants:
      - id: caller
        kind: actor
      - id: (*Store).nextVersionsFrom
        kind: self
      - id: s.pruned
        kind: internal
      - id: compactJSON
        kind: internal
    steps:
      - bind: old, existed, record
        eval: prior.raw, prior.existed, prior.record
      - opt:
          do:
            - return: nil
          when: s.keep == 0
      - opt:
          do:
            - set: old, existed
              value: record.Trashed.Document, true
            - set: record
              value: "&versionsRecord{Current: record.Current, Former: record.Former}"
          when: "!existed && record != nil && record.Trashed != nil"
      - opt:
          do:
            - return: "&versionsRecord{Current: versionHead{At: s.now(), Meta: maps.Clone(stamp.Meta), Number: 1}}"
          when: "!existed"
      - opt:
          do:
            - return: s.pruned(key, record)
              to: s.pruned
          when: stamp.InPlace
      - bind: former
        eval: compactJSON(old)
        to: compactJSON
      - opt:
          do:
            - return: s.pruned(key, record)
              to: s.pruned
          when: bytes.Equal(former, raw)
      - bind: head, kept
        eval: firstHead, []formerVersion(nil)
      - opt:
          do:
            - set: head, kept
              value: record.Current, record.Former
          when: record != nil
      - bind: next
        eval: |-
          &versionsRecord{
          		Current: versionHead{At: s.now(), Meta: maps.Clone(stamp.Meta), Number: head.Number + 1},
          		Former: append([]formerVersion{{At: head.At, Meta: head.Meta, Document: former, Number: head.Number}},
          			kept...),
          	}
      - return: s.pruned(key, next)
        to: s.pruned
  - of: (*Store).pruned
    steps:
      - opt:
          do:
            - return: record
          when: record == nil || len(record.Former) <= s.keep || (s.held != nil && s.held(key))
      - return: "&versionsRecord{Current: record.Current, Former: slices.Clone(record.Former[:s.keep])}"
  - of: (*Store).setVersions
    participants:
      - id: caller
        kind: actor
      - id: (*Store).setVersions
        kind: self
      - id: record.weighed
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: s.keep == 0
      - set: s.weight
        to: record.weighed
        value: record.weighed(s.versions[key].weighed(s.weight, -1), 1)
      - opt:
          do:
            - eval: delete(s.versions, key)
            - return: ""
          when: record == nil
      - set: s.versions[key]
        value: record
  - of: (*versionsRecord).weighed
    steps:
      - opt:
          do:
            - return: w
          when: r == nil
      - var:
          name: size
          type: int64
      - loop:
          do:
            - op: +=
              set: size
              value: int64(len(r.Former[i].Document))
          key: i
          range: r.Former
      - op: +=
        set: w.Former
        value: sign * len(r.Former)
      - opt:
          do:
            - op: +=
              set: w.Trashed
              value: sign
            - op: +=
              set: size
              value: int64(len(r.Trashed.Document))
          when: r.Trashed != nil
      - op: +=
        set: w.Bytes
        value: int64(sign) * size
      - return: w
  - of: (*Store).VersionWeight
    participants:
      - id: caller
        kind: actor
      - id: (*Store).VersionWeight
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
    steps:
      - opt:
          do:
            - return: coredocstore.VersionWeightValue{}, versionsNotKept(s.path)
          when: s.keep == 0
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: w, closed
        eval: s.weight, s.closed
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - opt:
          do:
            - return: coredocstore.VersionWeightValue{}, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: closed
      - return: w, nil
  - of: (*Store).now
    participants:
      - id: caller
        kind: actor
      - id: (*Store).now
        kind: self
      - id: s.clock.Now().UTC
        kind: value
    steps:
      - return: s.clock.Now().UTC()
        to: s.clock.Now().UTC
  - of: (*versionsRecord).list
    steps:
      - bind: head, former
        eval: firstHead, []formerVersion(nil)
      - opt:
          do:
            - set: head, former
              value: r.Current, r.Former
          when: r != nil
      - bind: out
        eval: make([]coredocstore.VersionValue, 0, 1+len(former))
      - set: out
        value: "append(out, coredocstore.VersionValue{At: head.At, Meta: maps.Clone(head.Meta), JSON: compactJSON(current), Number: head.Number})"
      - loop:
          do:
            - set: out
              value: "append(out, coredocstore.VersionValue{At: f.At, Meta: maps.Clone(f.Meta), JSON: slices.Clone(f.Document), Number: f.Number})"
          key: _
          range: former
          value: f
      - return: out
  - of: rewriteRecord
    participants:
      - id: caller
        kind: actor
      - id: rewriteRecord
        kind: self
      - id: checkRewrite
        kind: internal
    steps:
      - var:
          name: given
          type: "[]formerVersion"
      - opt:
          do:
            - set: given
              value: record.Former
          when: record != nil
      - bind: copies
        eval: make([]coredocstore.VersionValue, len(given))
      - loop:
          do:
            - set: copies[i]
              value: "coredocstore.VersionValue{At: f.At, Meta: maps.Clone(f.Meta), JSON: slices.Clone(f.Document), Number: f.Number}"
          key: i
          range: given
          value: f
      - bind: kept, err
        eval: fn(copies)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: former, err
        eval: checkRewrite(store, given, kept)
        to: checkRewrite
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - return: nil, nil
          when: record == nil
      - return: "&versionsRecord{Current: record.Current, Former: former}, nil"
  - of: checkRewrite
    participants:
      - id: caller
        kind: actor
      - id: checkRewrite
        kind: self
      - id: slices
        kind: stdlib
      - id: json
        kind: stdlib
    steps:
      - bind: out
        eval: make([]formerVersion, 0, len(kept))
      - bind: next
        eval: "0"
      - loop:
          do:
            - bind: at
              eval: slices.IndexFunc(given[next:], func(f formerVersion) bool { return f.Number == v.Number })
              to: slices
            - opt:
                do:
                  - return: nil, rewriteRefused(store, "a version it was not given, or out of order")
                when: at < 0
            - bind: original
              eval: given[next+at]
            - op: +=
              set: next
              value: at + 1
            - opt:
                do:
                  - return: nil, rewriteRefused(store, "a version made at another instant")
                when: "!v.At.Equal(original.At)"
            - leaf: a var of several names, or of no type
              stmt: var compact, escaped bytes.Buffer
            - opt:
                do:
                  - return: nil, rewriteRefused(store, "a version that is not JSON")
                when: len(v.JSON) == 0 || json.Compact(&compact, v.JSON) != nil
            - eval: json.HTMLEscape(&escaped, compact.Bytes())
              to: json
            - set: out
              value: "append(out, formerVersion{At: original.At, Meta: maps.Clone(v.Meta), Document: escaped.Bytes(), Number: original.Number})"
          key: _
          range: kept
          value: v
      - return: out, nil
  - of: compactJSON
    participants:
      - id: caller
        kind: actor
      - id: compactJSON
        kind: self
      - id: json
        kind: stdlib
      - id: slices
        kind: stdlib
      - id: out.Bytes
        kind: value
    steps:
      - var:
          name: out
          type: bytes.Buffer
      - opt:
          do:
            - return: slices.Clone(raw)
              to: slices
          init:
            bind: err
            eval: json.Compact(&out, raw)
            to: json
          when: err != nil
      - return: out.Bytes()
        to: out.Bytes
  - of: versionsNotKept
    participants:
      - id: caller
        kind: actor
      - id: versionsNotKept
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(coredocstore.VersionsNotKept, kerrs.WrapParams{}, kerrs.String("store", store))
        to: kerrs
  - of: rewriteRefused
    participants:
      - id: caller
        kind: actor
      - id: rewriteRefused
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(coredocstore.VersionsRewriteRefused, kerrs.WrapParams{}, kerrs.String("store", store), kerrs.String("problem", problem))
        to: kerrs
  - of: (*Store).PutDocument
    participants:
      - id: caller
        kind: actor
      - id: (*Store).PutDocument
        kind: self
      - id: s.putDocument
        kind: internal
      - id: s.onWrite.call
        kind: internal
    steps:
      - bind: applied, err
        eval: s.putDocument(key, versions, trashedAt)
        to: s.putDocument
      - opt:
          do:
            - eval: s.onWrite.call(key)
              to: s.onWrite.call
          when: applied && trashedAt.IsZero()
      - return: err
  - of: (*Store).putDocument
    participants:
      - id: caller
        kind: actor
      - id: (*Store).putDocument
        kind: self
      - id: s.preparedDocument
        kind: internal
      - id: recordOf
        kind: internal
      - id: trashedAt.IsZero
        kind: value
      - id: s.uniqueTaken
        kind: internal
      - id: s.persistDocument
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.file
        kind: internal
      - id: s.setVersions
        kind: internal
      - id: s.markPending
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.maybeFold
        kind: internal
    steps:
      - opt:
          do:
            - return: false, versionsNotKept(s.path)
          when: s.keep == 0
      - bind: doc, err
        eval: s.preparedDocument(key, versions)
        to: s.preparedDocument
      - opt:
          do:
            - return: false, err
          when: err != nil
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: _, stored
        eval: s.docs[key]
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentExists, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: stored || s.versions[key] != nil
      - bind: record
        eval: recordOf(doc.given)
        to: recordOf
      - bind: trashed
        eval: "!trashedAt.IsZero()"
        to: trashedAt.IsZero
      - opt:
          do:
            - set: record.Trashed
              value: "&trashedDocument{At: trashedAt.UTC(), Document: doc.raw}"
          when: trashed
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.UniqueKeyTaken, kerrs.WrapParams{}, kerrs.String("store", s.path), kerrs.String("index", name))
          init:
            bind: name, taken
            eval: s.uniqueTaken(key, doc.keys)
            to: s.uniqueTaken
          when: "!trashed && taken"
      - bind: persistErr
        eval: s.persistDocument(key, doc.raw, trashed, record)
        to: s.persistDocument
      - opt:
          do:
            - return: false, persistErr
          when: persistErr != nil && !kerrs.HasCode(persistErr, coredocstore.CodeWriteUnconfirmed)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - opt:
          do:
            - set: s.docs[key]
              value: doc.raw
            - eval: s.file(key, doc.keys)
              to: s.file
          when: "!trashed"
      - eval: s.setVersions(key, record)
        to: s.setVersions
      - eval: s.markPending(key)
        to: s.markPending
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - eval: s.maybeFold()
        to: s.maybeFold
      - return: true, persistErr
  - of: (*Store).preparedDocument
    participants:
      - id: caller
        kind: actor
      - id: (*Store).preparedDocument
        kind: self
      - id: checkDocument
        kind: internal
      - id: s.decode
        kind: internal
      - id: s.indexKeys
        kind: internal
    steps:
      - opt:
          do:
            - return: givenDocument{}, kerrs.Wrap(coredocstore.DocumentKeyEmpty, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: key == ""
      - bind: given, err
        eval: checkDocument(s.path, versions)
        to: checkDocument
      - opt:
          do:
            - return: givenDocument{}, err
          when: err != nil
      - bind: raw
        eval: given[0].JSON
      - bind: v, err
        eval: s.decode(raw)
        to: s.decode
      - opt:
          do:
            - return: givenDocument{}, err
          when: err != nil
      - opt:
          do:
            - return: givenDocument{}, versionsInvalid(s.path, problemOtherKey)
          when: s.key(v) != key
      - opt:
          do:
            - return: givenDocument{}, invalidKey(s.path, "")
          when: "!validKeys([]string{key})"
      - bind: keys
        eval: s.indexKeys(v)
        to: s.indexKeys
      - loop:
          do:
            - opt:
                do:
                  - return: givenDocument{}, invalidKey(s.path, s.indexes[i].name)
                when: "!validKeys(indexKeys)"
          key: i
          range: keys
          value: indexKeys
      - return: "givenDocument{raw: raw, given: given, keys: keys}, nil"
  - of: (*Store).persistDocument
    participants:
      - id: caller
        kind: actor
      - id: (*Store).persistDocument
        kind: self
      - id: s.persist
        kind: internal
    steps:
      - opt:
          do:
            - return: s.persist(key, nil, true, record)
              to: s.persist
          when: trashed
      - return: s.persist(key, raw, false, record)
        to: s.persist
  - of: recordOf
    steps:
      - bind: head
        eval: given[0]
      - var:
          name: former
          type: "[]formerVersion"
      - loop:
          do:
            - set: former
              value: "append(former, formerVersion{At: v.At, Meta: v.Meta, Document: v.JSON, Number: v.Number})"
          key: _
          range: given[1:]
          value: v
      - return: "&versionsRecord{Current: versionHead{At: head.At, Meta: head.Meta, Number: head.Number}, Former: former}"
  - of: checkDocument
    participants:
      - id: caller
        kind: actor
      - id: checkDocument
        kind: self
      - id: versionProblem
        kind: internal
      - id: documentJSON
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, versionsInvalid(store, problemNoVersion)
          when: len(versions) == 0
      - bind: out
        eval: make([]coredocstore.VersionValue, len(versions))
      - loop:
          do:
            - opt:
                do:
                  - return: nil, versionsInvalid(store, problem)
                init:
                  bind: problem, wrong
                  eval: versionProblem(versions, i)
                  to: versionProblem
                when: wrong
            - bind: doc, ok
              eval: documentJSON(v.JSON)
              to: documentJSON
            - opt:
                do:
                  - return: nil, versionsInvalid(store, problemNotJSON)
                when: "!ok"
            - set: out[i]
              value: "coredocstore.VersionValue{At: v.At.UTC(), Meta: metaOrNil(v.Meta), JSON: doc, Number: v.Number}"
          key: i
          range: versions
          value: v
      - return: out, nil
  - of: versionProblem
    steps:
      - bind: v
        eval: versions[i]
      - switch:
          cases:
            - case: v.Number == 0
              do:
                - return: problemNumberZero, true
            - case: i > 0 && v.Number >= versions[i-1].Number
              do:
                - return: problemNotDecreasing, true
            - case: v.At.IsZero() && v.Number != 1
              do:
                - return: problemUnknownInstant, true
            - default: true
              do:
                - return: "\"\", false"
  - of: documentJSON
    participants:
      - id: caller
        kind: actor
      - id: documentJSON
        kind: self
      - id: json
        kind: stdlib
      - id: escaped.Bytes
        kind: value
    steps:
      - leaf: a var of several names, or of no type
        stmt: var compact, escaped bytes.Buffer
      - opt:
          do:
            - return: nil, false
          when: len(raw) == 0 || json.Compact(&compact, raw) != nil
      - eval: json.HTMLEscape(&escaped, compact.Bytes())
        to: json
      - return: escaped.Bytes(), true
        to: escaped.Bytes
  - of: metaOrNil
    participants:
      - id: caller
        kind: actor
      - id: metaOrNil
        kind: self
      - id: maps
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(meta) == 0
      - return: maps.Clone(meta)
        to: maps
  - of: versionsInvalid
    participants:
      - id: caller
        kind: actor
      - id: versionsInvalid
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(coredocstore.VersionsInvalid, kerrs.WrapParams{}, kerrs.String("store", store), kerrs.String("problem", problem))
        to: kerrs
  - of: (*Store).Put
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Put
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, upsert, coredocstore.StampValue{})
        to: s.store
  - of: (*Store).Insert
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Insert
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, insertOnly, coredocstore.StampValue{})
        to: s.store
  - of: (*Store).Replace
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Replace
        kind: self
      - id: s.store
        kind: internal
    steps:
      - return: s.store(v, replaceOnly, coredocstore.StampValue{})
        to: s.store
  - of: (*Store).Update
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Update
        kind: self
      - id: s.UpdateStamped
        kind: internal
    steps:
      - return: s.UpdateStamped(key, coredocstore.StampValue{}, fn)
        to: s.UpdateStamped
  - of: (*Store).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*Store).Delete
        kind: self
      - id: s.remove
        kind: internal
      - id: s.onDelete.call
        kind: internal
    steps:
      - bind: applied, err
        eval: s.remove(key)
        to: s.remove
      - opt:
          do:
            - eval: s.onDelete.call(key)
              to: s.onDelete.call
          when: applied
      - return: err
  - of: (*Store).store
    participants:
      - id: caller
        kind: actor
      - id: (*Store).store
        kind: self
      - id: s.prepare
        kind: internal
      - id: s.commit
        kind: internal
      - id: s.onWrite.call
        kind: internal
    steps:
      - bind: p, prepErr
        eval: s.prepare(v)
        to: s.prepare
      - opt:
          do:
            - return: prepErr
          when: prepErr != nil
      - bind: applied, err
        eval: s.commit(p, mode, stamp)
        to: s.commit
      - opt:
          do:
            - eval: s.onWrite.call(p.key)
              to: s.onWrite.call
          when: applied
      - return: err
  - of: (*Store).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*Store).prepare
        kind: self
      - id: encodeAs
        kind: internal
      - id: s.indexKeys
        kind: internal
    steps:
      - bind: key, raw, err
        eval: encodeAs(s.path, s.key, v)
        to: encodeAs
      - opt:
          do:
            - return: prepared{}, err
          when: err != nil
      - bind: keys
        eval: s.indexKeys(v)
        to: s.indexKeys
      - loop:
          do:
            - opt:
                do:
                  - return: prepared{}, invalidKey(s.path, s.indexes[i].name)
                when: "!validKeys(indexKeys)"
          key: i
          range: keys
          value: indexKeys
      - return: "prepared{raw: raw, keys: keys, key: key}, nil"
  - of: encodeAs
    participants:
      - id: caller
        kind: actor
      - id: encodeAs
        kind: self
      - id: json
        kind: stdlib
    steps:
      - set: key
        value: keyOf(v)
      - opt:
          do:
            - return: "\"\", nil, kerrs.Wrap(coredocstore.DocumentKeyEmpty, kerrs.WrapParams{}, kerrs.String(\"store\", store))"
          when: key == ""
      - opt:
          do:
            - return: "\"\", nil, invalidKey(store, \"\")"
          when: "!utf8.ValidString(key)"
      - set: raw, err
        to: json
        value: json.Marshal(v)
      - opt:
          do:
            - return: |-
                "", nil, kerrs.Wrap(coredocstore.DocumentUnencodable, kerrs.WrapParams{},
                			kerrs.String("store", store), kerrs.String("cause", encodeCause(err)))
          when: err != nil
      - return: key, raw, nil
  - of: invalidKey
    participants:
      - id: caller
        kind: actor
      - id: invalidKey
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: fields
        eval: "[]kerrs.FieldValue{kerrs.String(\"store\", store), kerrs.String(\"cause\", \"a key is not valid UTF-8\")}"
      - opt:
          do:
            - set: fields
              value: append(fields, kerrs.String("index", index))
          when: index != ""
      - return: kerrs.Wrap(coredocstore.DocumentUnencodable, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: (*Store).commit
    participants:
      - id: caller
        kind: actor
      - id: (*Store).commit
        kind: self
      - id: s.persistAndApply
        kind: internal
    steps:
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: _, existed
        eval: s.docs[p.key]
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentExists, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: mode == insertOnly && existed
      - opt:
          do:
            - return: false, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: mode == replaceOnly && !existed
      - return: s.persistAndApply(p, stamp)
        to: s.persistAndApply
  - of: (*Store).modify
    participants:
      - id: caller
        kind: actor
      - id: (*Store).modify
        kind: self
      - id: s.decode
        kind: internal
      - id: s.prepare
        kind: internal
      - id: s.persistAndApply
        kind: internal
    steps:
      - var:
          name: zero
          type: T
      - lock:
          mutex: s.writing
      - opt:
          do:
            - return: zero, false, kerrs.Wrap(coredocstore.StoreClosed, kerrs.WrapParams{})
          when: s.closed
      - bind: raw, found
        eval: s.docs[key]
      - opt:
          do:
            - return: zero, false, kerrs.Wrap(coredocstore.DocumentNotFound, kerrs.WrapParams{}, kerrs.String("store", s.path))
          when: "!found"
      - bind: v, decodeErr
        eval: s.decode(raw)
        to: s.decode
