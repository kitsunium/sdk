# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The properties a decode plan can have.
    grouped: true
    items:
      - doc: |-
          planBinary is set when *T implements encoding.BinaryUnmarshaler: a
          byte string is handed to UnmarshalBinary.
        name: planBinary
        type: planFlag
        value: 1 << iota
      - doc: |-
          planNullable is set for slices, maps, pointers and interfaces, which
          null sets to nil; null leaves any other value as it is.
        name: planNullable
      - doc: |-
          planKeyCheck is set when a map's key type can hold a value Go cannot
          hash — an interface inside it — so each key is checked first.
        name: planKeyCheck
    name: planBinary
  - doc: The range a float of seconds must fall in to be an epoch time.
    grouped: true
    items:
      - doc: "maxEpochSeconds is 2^63: from there up, the seconds overflow an int64."
        name: maxEpochSeconds
        type: float64
        value: 0x1p63
      - doc: nanosPerSecond scales a fraction of a second to nanoseconds.
        name: nanosPerSecond
        type: float64
        value: "1e9"
    name: maxEpochSeconds
  - doc: The thresholds of a struct's field lookup.
    grouped: true
    items:
      - doc: |-
          linearLookupMax is the field count up to which a key is looked up by
          scanning the fields, which beats hashing it.
        name: linearLookupMax
        type: int
        value: "8"
      - doc: smallFieldSet is how many fields a bit set on the stack can track.
        name: smallFieldSet
        type: int
        value: "64"
    name: linearLookupMax
  - doc: The reading policy of the stream decoder.
    grouped: true
    items:
      - doc: minReadSize is the least free space handed to a Read.
        name: minReadSize
        type: int
        value: "512"
      - doc: |-
          maxEmptyReads is how many Reads may return no byte and no error before
          the reader is treated as stuck, as bufio treats one.
        name: maxEmptyReads
        type: int
        value: "100"
    name: minReadSize
  - doc: |-
      maxIndirections bounds the pointers and interfaces followed between two
      containers. A chain that long is a cycle — an interface holding a pointer
      to itself — and not data.
    items:
      - name: maxIndirections
        type: int
        value: "32"
    name: maxIndirections
  - doc: The bookkeeping of a map's order.
    grouped: true
    items:
      - doc: |-
          smallMapPairs is how many pairs a map can have before the bookkeeping
          of its order leaves the stack, and before an insertion sort stops
          beating the general one.
        name: smallMapPairs
        type: int
        value: "16"
      - doc: |-
          keyPrefixBytes is how many leading bytes of an encoded key are compared
          as one integer before the whole keys are.
        name: keyPrefixBytes
        type: int
        value: "8"
    name: smallMapPairs
  - doc: "maxHeadBytes is the longest head: an initial byte and eight argument bytes."
    items:
      - name: maxHeadBytes
        type: int
        value: "9"
    name: maxHeadBytes
  - doc: privatePrefix opens every Private line this package writes.
    items:
      - name: privatePrefix
        type: string
        value: "\"service/data/codec/cbor: \""
    name: privatePrefix
  - doc: The struct tags a field's key and options are read from, and the options.
    grouped: true
    items:
      - doc: cborTagKey is the struct tag read first.
        name: cborTagKey
        type: string
        value: "\"cbor\""
      - doc: jsonTagKey is the struct tag read when a field has no cbor tag.
        name: jsonTagKey
        type: string
        value: "\"json\""
      - doc: skipTagName excludes a field from the wire.
        name: skipTagName
        type: string
        value: "\"-\""
      - doc: optionOmitEmpty omits a field whose value encodes as an empty CBOR item.
        name: optionOmitEmpty
        type: string
        value: "\"omitempty\""
      - doc: optionOmitZero omits a field holding its type's zero value.
        name: optionOmitZero
        type: string
        value: "\"omitzero\""
      - doc: optionKeyAsInt keys a field by the integer its name spells.
        name: optionKeyAsInt
        type: string
        value: "\"keyasint\""
      - doc: optionToArray, on the blank field `_`, encodes the struct as an array.
        name: optionToArray
        type: string
        value: "\"toarray\""
      - doc: |-
          structOptionsField is the blank field whose cbor tag carries the
          struct-level options.
        name: structOptionsField
        type: string
        value: "\"_\""
    name: cborTagKey
  - doc: The properties a struct field can have.
    grouped: true
    items:
      - doc: flagKeyAsInt keys the field by its integer name.
        name: flagKeyAsInt
        type: fieldFlag
        value: 1 << iota
      - doc: |-
          flagTagged is set when a tag named or configured the field, which makes
          it dominate an untagged field of the same name at the same depth.
        name: flagTagged
      - doc: flagOmitEmpty is the omitempty option.
        name: flagOmitEmpty
      - doc: flagOmitZero is the omitzero option.
        name: flagOmitZero
    name: flagKeyAsInt
  - doc: |-
      The bounds every decode enforces before it allocates anything. They are
      the values the codec has always enforced: an array or a map may hold a
      million entries and nest thirty-two deep.
    grouped: true
    items:
      - doc: maxCBORArrayElements caps the element count of any single array.
        name: maxCBORArrayElements
        type: int
        value: 1 << 20
      - doc: maxCBORMapPairs caps the pair count of any single map.
        name: maxCBORMapPairs
        type: int
        value: 1 << 20
      - doc: |-
          maxCBORNestedLevels caps how deeply arrays, maps and tags may nest, each
          counting one level. The encoder refuses to write deeper than it.
        name: maxCBORNestedLevels
        type: int
        value: "32"
      - doc: |-
          maxCBORStringChunks caps the chunks of one indefinite-length string, the
          same bound as an array's elements.
        name: maxCBORStringChunks
        type: int
        value: 1 << 20
    name: maxCBORArrayElements
  - doc: What a frame of the validator's stack holds open.
    grouped: true
    items:
      - doc: frameArray is an array, definite or indefinite.
        name: frameArray
        type: frameKind
        value: iota
      - doc: frameMap is a map, its items counted one per key and one per value.
        name: frameMap
      - doc: frameChunks is an indefinite-length string awaiting its chunks.
        name: frameChunks
      - doc: frameTag is a tag awaiting the one data item it encloses.
        name: frameTag
    name: frameArray
  - doc: |-
      The eight major types, already shifted into the high three bits of an
      initial byte (RFC 8949 §3.1), so a head is `byte(major) | info`.
    grouped: true
    items:
      - doc: "majorUnsigned is major type 0: an unsigned integer."
        name: majorUnsigned
        type: majorType
        value: iota << majorShift
      - doc: "majorNegative is major type 1: the negative integer −1−n."
        name: majorNegative
      - doc: "majorBytes is major type 2: a byte string."
        name: majorBytes
      - doc: "majorText is major type 3: a UTF-8 text string."
        name: majorText
      - doc: "majorArray is major type 4: an array of data items."
        name: majorArray
      - doc: "majorMap is major type 5: a map of pairs of data items."
        name: majorMap
      - doc: "majorTag is major type 6: a tag number and the data item it encloses."
        name: majorTag
      - doc: "majorSimple is major type 7: simple values and floating-point numbers."
        name: majorSimple
    name: majorUnsigned
  - doc: The layout of an initial byte and the meaning of its low five bits.
    grouped: true
    items:
      - doc: majorShift is where the major type sits in an initial byte.
        name: majorShift
        type: uint
        value: "5"
      - doc: majorMask selects the major type of an initial byte.
        name: majorMask
        type: byte
        value: "0xe0"
      - doc: infoMask selects the additional information of an initial byte.
        name: infoMask
        type: byte
        value: "0x1f"
      - doc: infoDirectMax is the largest argument the initial byte carries itself.
        name: infoDirectMax
        type: byte
        value: "23"
      - doc: |-
          info1Byte announces a one-byte argument (and, in major type 7, a
          simple value in the extension byte).
        name: info1Byte
        type: byte
        value: "24"
      - doc: info2Bytes announces a two-byte argument, or a half-precision float.
        name: info2Bytes
        type: byte
        value: "25"
      - doc: info4Bytes announces a four-byte argument, or a single-precision float.
        name: info4Bytes
        type: byte
        value: "26"
      - doc: info8Bytes announces an eight-byte argument, or a double-precision float.
        name: info8Bytes
        type: byte
        value: "27"
      - doc: |-
          infoReservedMin is the first of the three values RFC 8949 §3 reserves:
          an item using 28, 29 or 30 is not well-formed.
        name: infoReservedMin
        type: byte
        value: "28"
      - doc: infoReservedMax is the last reserved additional information value.
        name: infoReservedMax
        type: byte
        value: "30"
      - doc: |-
          infoIndefinite is an indefinite length in major types 2 to 5, and the
          "break" stop code in major type 7.
        name: infoIndefinite
        type: byte
        value: "31"
    name: majorShift
  - doc: The four simple values RFC 8949 §3.3 assigns, consecutive from 20.
    grouped: true
    items:
      - doc: simpleFalse is the simple value false.
        name: simpleFalse
        type: byte
        value: iota + firstAssignedSimple
      - doc: simpleTrue is the simple value true.
        name: simpleTrue
      - doc: simpleNull is the simple value null.
        name: simpleNull
      - doc: simpleUndefined is the simple value undefined, which decodes as null.
        name: simpleUndefined
    name: simpleFalse
  - doc: The bounds around the assigned simple values.
    grouped: true
    items:
      - doc: firstAssignedSimple is the first simple value RFC 8949 assigns, false.
        name: firstAssignedSimple
        type: byte
        value: "20"
      - doc: |-
          minExtendedSimple is the smallest simple value the one-byte extension
          may carry: below it the two-byte form is not well-formed.
        name: minExtendedSimple
        type: uint64
        value: "32"
    name: firstAssignedSimple
  - doc: Single bytes and three-byte floats the encoder writes verbatim.
    grouped: true
    items:
      - doc: nullByte is the encoded null.
        name: nullByte
        value: byte(majorSimple) | simpleNull
      - doc: falseByte is the encoded false.
        name: falseByte
        value: byte(majorSimple) | simpleFalse
      - doc: trueByte is the encoded true.
        name: trueByte
        value: byte(majorSimple) | simpleTrue
      - doc: breakByte is the stop code closing an indefinite-length item.
        name: breakByte
        value: byte(majorSimple) | infoIndefinite
      - doc: float16Head opens a half-precision float.
        name: float16Head
        value: byte(majorSimple) | info2Bytes
      - doc: float32Head opens a single-precision float.
        name: float32Head
        value: byte(majorSimple) | info4Bytes
      - doc: float64Head opens a double-precision float.
        name: float64Head
        value: byte(majorSimple) | info8Bytes
      - doc: halfNaN is the one NaN the encoder writes, 0xf97e00 (RFC 8949 §4.2.2).
        name: halfNaN
        type: uint16
        value: "0x7e00"
      - doc: halfPosInf is +Infinity as a half-precision float.
        name: halfPosInf
        type: uint16
        value: "0x7c00"
      - doc: halfNegInf is −Infinity as a half-precision float.
        name: halfNegInf
        type: uint16
        value: "0xfc00"
    name: nullByte
  - doc: The tag numbers this codec interprets; every other tag is transparent.
    grouped: true
    items:
      - doc: tagDateTime encloses an RFC 3339 date/time text string (RFC 8949 §3.4.1).
        name: tagDateTime
        type: uint64
        value: iota
      - doc: tagEpoch encloses an epoch-based date/time number (RFC 8949 §3.4.2).
        name: tagEpoch
      - doc: tagPositiveBignum encloses the magnitude n of a bignum (RFC 8949 §3.4.3).
        name: tagPositiveBignum
      - doc: tagNegativeBignum encloses the n of the negative bignum −1−n.
        name: tagNegativeBignum
    name: tagDateTime
  - doc: |-
      The IEEE 754 binary16 and binary64 layouts the half-precision decoder maps
      between (RFC 8949 Appendix D).
    grouped: true
    items:
      - doc: halfSignBit selects the sign of a binary16.
        name: halfSignBit
        type: uint16
        value: "0x8000"
      - doc: halfMantissaBits is the width of a binary16 significand.
        name: halfMantissaBits
        type: uint
        value: "10"
      - doc: halfExponentMask selects the five exponent bits once shifted down.
        name: halfExponentMask
        type: uint16
        value: "0x1f"
      - doc: halfMantissaMask selects the ten significand bits of a binary16.
        name: halfMantissaMask
        type: uint16
        value: "0x3ff"
      - doc: halfExponentBias is the binary16 exponent bias.
        name: halfExponentBias
        type: uint64
        value: "15"
      - doc: "halfSubnormalExponent scales a subnormal binary16 significand: 2^−24."
        name: halfSubnormalExponent
        type: int
        value: "-24"
      - doc: doubleExponentBias is the binary64 exponent bias.
        name: doubleExponentBias
        type: uint64
        value: "1023"
      - doc: doubleMantissaBits is the width of a binary64 significand.
        name: doubleMantissaBits
        type: uint
        value: "52"
      - doc: doubleExponentAllOnes is the binary64 exponent of infinities and NaNs.
        name: doubleExponentAllOnes
        type: uint64
        value: "0x7ff"
      - doc: signShiftHalfToDouble moves the binary16 sign bit to the binary64 one.
        name: signShiftHalfToDouble
        type: uint
        value: "48"
      - doc: |-
          mantissaShiftHalfToDouble left-aligns a binary16 significand in a
          binary64 one, which keeps a NaN payload and its quiet bit.
        name: mantissaShiftHalfToDouble
        value: doubleMantissaBits - halfMantissaBits
    name: halfSignBit
