    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).structEntry
        kind: self
      - id: d.fieldIndex
        kind: internal
      - id: d.skip
        kind: internal
      - id: seen.add
        kind: internal
      - id: d.decodeField
        kind: internal
