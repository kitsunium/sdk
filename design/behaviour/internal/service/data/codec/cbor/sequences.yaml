      - id: binary.BigEndian.AppendUint32
        kind: value
      - id: binary.BigEndian.AppendUint64
        kind: value
    steps:
      - bind: initial
        eval: byte(major)
      - switch:
          cases:
            - case: n <= uint64(infoDirectMax)
              do:
                - return: append(b, initial|byte(n))
            - case: n <= math.MaxUint8
              do:
                - return: append(b, initial|info1Byte, byte(n))
            - case: n <= math.MaxUint16
              do:
                - return: binary.BigEndian.AppendUint16(append(b, initial|info2Bytes), uint16(n))
                  to: binary.BigEndian.AppendUint16
            - case: n <= math.MaxUint32
              do:
                - return: binary.BigEndian.AppendUint32(append(b, initial|info4Bytes), uint32(n))
                  to: binary.BigEndian.AppendUint32
            - default: true
              do:
                - return: binary.BigEndian.AppendUint64(append(b, initial|info8Bytes), n)
                  to: binary.BigEndian.AppendUint64
  - of: readHead
    participants:
      - id: caller
        kind: actor
      - id: readHead
        kind: self
      - id: argumentWidth
        kind: internal
      - id: readUint
        kind: internal
    steps:
      - opt:
          do:
            - return: itemHead{}, false
          when: off >= len(data)
      - bind: initial
        eval: data[off]
      - set: h
        value: "itemHead{major: majorType(initial & majorMask), info: initial & infoMask, size: 1}"
      - opt:
          do:
            - set: h.arg
              value: uint64(h.info)
            - return: h, true
          when: h.info <= infoDirectMax
      - bind: width
        eval: argumentWidth(h.info)
        to: argumentWidth
      - opt:
          do:
            - return: h, true
          when: width == 0
      - opt:
          do:
            - return: itemHead{}, false
          when: len(data)-off-1 < width
      - set: h.arg
        to: readUint
        value: readUint(data[off+1:], h.info)
      - op: +=
        set: h.size
        value: width
      - return: h, true
  - of: argumentWidth
    steps:
      - opt:
          do:
            - return: "0"
          when: info < info1Byte || info > info8Bytes
      - return: 1 << (info - info1Byte)
  - of: readUint
    participants:
      - id: caller
        kind: actor
      - id: readUint
        kind: self
      - id: binary.BigEndian.Uint64
        kind: value
    steps:
      - switch:
          cases:
            - case: info1Byte
              do:
                - return: uint64(b[0])
            - case: info2Bytes
              do:
                - return: uint64(binary.BigEndian.Uint16(b))
            - case: info4Bytes
              do:
                - return: uint64(binary.BigEndian.Uint32(b))
            - default: true
              do:
                - return: binary.BigEndian.Uint64(b)
                  to: binary.BigEndian.Uint64
          "on": info
  - of: halfToFloat64
    participants:
      - id: caller
        kind: actor
      - id: halfToFloat64
        kind: self
      - id: math
        kind: stdlib
    steps:
      - bind: sign
        eval: uint64(half&halfSignBit) << signShiftHalfToDouble
      - bind: exponent
        eval: (half >> halfMantissaBits) & halfExponentMask
      - bind: mantissa
        eval: uint64(half & halfMantissaMask)
      - switch:
          cases:
            - case: "0"
              do:
                - bind: magnitude
                  eval: math.Ldexp(float64(mantissa), halfSubnormalExponent)
                  to: math
                - return: math.Float64frombits(math.Float64bits(magnitude) | sign)
                  to: math
            - case: halfExponentMask
              do:
                - return: math.Float64frombits(sign | doubleExponentAllOnes<<doubleMantissaBits | mantissa<<mantissaShiftHalfToDouble)
                  to: math
            - default: true
              do:
                - bind: rebiased
                  eval: uint64(exponent) - halfExponentBias + doubleExponentBias
                - return: math.Float64frombits(sign | rebiased<<doubleMantissaBits | mantissa<<mantissaShiftHalfToDouble)
                  to: math
          "on": exponent
