        to: time
  - of: (*decodeState).skipAllTags
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).skipAllTags
        kind: self
      - id: d.peek
        kind: internal
    steps:
      - loop:
          do:
            - bind: h, err
              eval: d.peek()
              to: d.peek
            - opt:
                do:
                  - return: h, err
                when: err != nil || h.major != majorTag
            - op: +=
              set: d.off
              value: h.size
          forever: true
  - of: bigIntDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: bigIntDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.bigValue
        kind: internal
      - id: setValue
        kind: internal
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - bind: n, err
        eval: d.bigValue(h)
        to: d.bigValue
      - opt:
          do:
            - return: err
          when: err != nil || n == nil
      - eval: setValue(v, *n)
        to: setValue
      - return: nil
  - of: (*decodeState).bigValue
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).bigValue
        kind: self
      - id: new(big.Int).SetUint64
        kind: value
      - id: new(big.Int).Not
        kind: value
      - id: d.readBignum
        kind: internal
      - id: d.noteMismatch
        kind: internal
    steps:
      - switch:
          cases:
            - case: majorUnsigned
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: new(big.Int).SetUint64(h.arg), nil
                  to: new(big.Int).SetUint64
            - case: majorNegative
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: new(big.Int).Not(new(big.Int).SetUint64(h.arg)), nil
                  to: new(big.Int).Not
            - case: majorTag
              do:
                - bind: n, err
                  eval: d.readBignum(h)
                  to: d.readBignum
                - opt:
                    do:
                      - eval: d.noteMismatch(h, bigIntType)
                        to: d.noteMismatch
                    when: err == nil && n == nil
                - return: n, err
            - default: true
              do:
                - return: nil, d.mismatch(h, bigIntType)
          "on": h.major
  - of: setValue
    participants:
      - id: caller
        kind: actor
      - id: setValue
        kind: self
      - id: v.Set
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - set: "*ptr"
                    value: x
                  - return: ""
                init:
                  bind: ptr, ok
                  eval: reflect.TypeAssert[*T](v.Addr())
                when: ok
          when: v.CanAddr()
      - eval: v.Set(reflect.ValueOf(x))
        to: v.Set
  - of: (*decodePlanner).fillStruct
    participants:
      - id: caller
        kind: actor
      - id: (*decodePlanner).fillStruct
        kind: self
      - id: layoutOf
        kind: internal
      - id: fields.indexNames
        kind: internal
