      - id: loadEncodePlan
        kind: self
      - id: encodePlans.Load
        kind: value
    steps:
      - bind: cached, ok
        eval: encodePlans.Load(t)
        to: encodePlans.Load
      - opt:
          do:
            - return: nil, false
          when: "!ok"
      - bind: plan, isPlan
        eval: cached.(*encodePlan)
      - return: plan, isPlan
  - of: (*encodePlanner).plan
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).plan
        kind: self
      - id: loadEncodePlan
        kind: internal
      - id: pl.fill
        kind: internal
    steps:
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: loadEncodePlan(t)
            to: loadEncodePlan
          when: ok
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: pl.local[t]
          when: ok
      - bind: p
        eval: "&encodePlan{typ: t, zero: zeroFuncFor(t)}"
      - set: pl.local[t]
        value: p
      - eval: pl.fill(p)
        to: pl.fill
      - return: p
  - of: (*encodePlanner).fill
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fill
        kind: self
      - id: pl.fillPointer
        kind: internal
      - id: pl.fillKind
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - switch:
          cases:
            - case: t.Kind() == reflect.Pointer
              do:
                - eval: pl.fillPointer(p)
                  to: pl.fillPointer
            - case: t == timeType
              do:
                - set: p.kind
                  value: timeEncoder{}
            - case: t == bigIntType
              do:
                - set: p.kind
                  value: bigIntEncoder{}
            - case: reflect.PointerTo(t).Implements(cborMarshalerType)
              do:
                - set: p.kind
                  value: cborMarshalerEncoder{}
            - case: reflect.PointerTo(t).Implements(binaryMarshalerType)
              do:
                - set: p.kind
                  value: binaryMarshalerEncoder{}
            - default: true
              do:
                - eval: pl.fillKind(p)
                  to: pl.fillKind
  - of: (*encodePlanner).fillKind
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fillKind
        kind: self
      - id: pl.fillSequence
        kind: internal
      - id: pl.fillMap
        kind: internal
      - id: pl.fillStruct
        kind: internal
      - id: refuse
        kind: internal
    steps:
      - opt:
          do:
            - set: p.kind
              value: scalar
            - return: ""
          init:
            bind: scalar, ok
            eval: scalarEncoders[p.typ.Kind()]
          when: ok
      - switch:
          cases:
            - case: reflect.Slice, reflect.Array
              do:
                - eval: pl.fillSequence(p)
                  to: pl.fillSequence
            - case: reflect.Map
              do:
                - eval: pl.fillMap(p)
                  to: pl.fillMap
            - case: reflect.Struct
              do:
                - eval: pl.fillStruct(p)
                  to: pl.fillStruct
            - case: reflect.Interface
              do:
                - set: p.kind
                  value: interfaceEncoder{}
            - default: true
              do:
                - eval: "refuse(p, \"a value of a type CBOR cannot carry: \"+p.typ.String())"
                  to: refuse
          "on": p.typ.Kind()
  - of: (*encodePlanner).fillPointer
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fillPointer
        kind: self
      - id: refuse
        kind: internal
      - id: pl.plan
        kind: internal
    steps:
      - opt:
          do:
            - eval: "refuse(p, \"a value of a self-referential pointer type: \"+p.typ.String())"
              to: refuse
            - return: ""
          when: pointerCycle(p.typ)
      - set: p.elem
        to: pl.plan
        value: pl.plan(p.typ.Elem())
      - opt:
          do:
            - eval: refuse(p, p.elem.refusal)
              to: refuse
            - return: ""
          when: p.elem.refusal != ""
      - set: p.kind
        value: pointerEncoder{}
  - of: (*encodePlanner).fillSequence
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fillSequence
        kind: self
      - id: pl.plan
        kind: internal
      - id: refuse
        kind: internal
    steps:
      - opt:
          do:
            - set: p.kind
              value: byteSequenceEncoder{}
            - return: ""
          when: p.typ.Elem().Kind() == reflect.Uint8
      - set: p.elem
        to: pl.plan
        value: pl.plan(p.typ.Elem())
      - opt:
          do:
            - eval: refuse(p, p.elem.refusal)
              to: refuse
            - return: ""
          when: p.elem.refusal != ""
      - set: p.kind
        value: sequenceEncoder{}
  - of: (*encodePlanner).fillMap
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fillMap
        kind: self
      - id: refuse
        kind: internal
      - id: newHolders
        kind: internal
    steps:
      - set: p.key, p.elem
        value: pl.plan(p.typ.Key()), pl.plan(p.typ.Elem())
      - opt:
          do:
            - eval: refuse(p, p.key.refusal)
              to: refuse
            - return: ""
          when: p.key.refusal != ""
      - opt:
          do:
            - eval: refuse(p, p.elem.refusal)
              to: refuse
            - return: ""
          when: p.elem.refusal != ""
      - set: p.holders
        to: newHolders
        value: newHolders(p.typ)
      - set: p.kind
        value: mapEncoder{}
  - of: newHolders
    participants:
      - id: caller
        kind: actor
      - id: newHolders
        kind: self
      - id: recycler
        kind: package
    steps:
      - bind: keyType, valueType
        eval: t.Key(), t.Elem()
      - return: |-
          recycler.NewPool(func() *mapHolders {
          		//: one of each.
          		return &mapHolders{key: reflect.New(keyType).Elem(), value: reflect.New(valueType).Elem()}
          	})
        to: recycler
  - of: releaseHolders
    participants:
      - id: caller
        kind: actor
      - id: releaseHolders
        kind: self
      - id: holders.key.SetZero
        kind: value
      - id: holders.value.SetZero
        kind: value
      - id: pool.Put
        kind: value
    steps:
      - eval: holders.key.SetZero()
        to: holders.key.SetZero
      - eval: holders.value.SetZero()
        to: holders.value.SetZero
      - eval: pool.Put(holders)
        to: pool.Put
  - of: refuse
    steps:
      - set: p.refusal
        value: refusal
      - set: p.kind
        value: refusedEncoder{}
  - of: pointerCycle
    participants:
      - id: caller
        kind: actor
      - id: pointerCycle
        kind: self
      - id: t.Elem
        kind: value
      - id: elem.Elem
        kind: value
    steps:
      - bind: elem
        eval: t.Elem()
        to: t.Elem
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: elem.Kind() != reflect.Pointer
            - opt:
                do:
                  - return: "true"
                when: elem == t
            - set: elem
              to: elem.Elem
              value: elem.Elem()
          range: maxIndirections
      - return: "true"
  - of: asMethods
    participants:
      - id: caller
        kind: actor
      - id: asMethods
        kind: self
      - id: reflect
        kind: stdlib
      - id: copied.Elem().Set
        kind: value
    steps:
      - opt:
          do:
            - return: reflect.TypeAssert[I](v.Addr())
          when: v.CanAddr()
      - opt:
          do:
            - return: m, true
          init:
            bind: m, ok
            eval: reflect.TypeAssert[I](v)
          when: ok
      - bind: copied
        eval: reflect.New(v.Type())
        to: reflect
      - eval: copied.Elem().Set(v)
        to: copied.Elem().Set
      - return: reflect.TypeAssert[I](copied)
  - of: boolEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: boolEncoder.encode
        kind: self
      - id: appendBool
        kind: internal
    steps:
      - return: appendBool(b, v.Bool()), nil
        to: appendBool
  - of: boolEncoder.empty
    participants:
      - id: caller
        kind: actor
      - id: boolEncoder.empty
        kind: self
      - id: v.Bool
        kind: value
    steps:
      - return: "!v.Bool(), nil"
        to: v.Bool
  - of: intEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: intEncoder.encode
        kind: self
      - id: appendInt
        kind: internal
    steps:
      - return: appendInt(b, v.Int()), nil
        to: appendInt
  - of: intEncoder.empty
    steps:
      - return: v.Int() == 0, nil
  - of: uintEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: uintEncoder.encode
        kind: self
      - id: appendHead
        kind: internal
    steps:
      - return: appendHead(b, majorUnsigned, v.Uint()), nil
        to: appendHead
  - of: uintEncoder.empty
    steps:
      - return: v.Uint() == 0, nil
  - of: floatEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: floatEncoder.encode
        kind: self
      - id: appendFloat32
        kind: internal
      - id: appendFloat64
        kind: internal
    steps:
      - opt:
          do:
            - return: appendFloat32(b, float32(v.Float())), nil
              to: appendFloat32
          when: v.Kind() == reflect.Float32
      - return: appendFloat64(b, v.Float()), nil
        to: appendFloat64
  - of: floatEncoder.empty
    steps:
      - return: v.Float() == 0, nil
  - of: stringEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: stringEncoder.encode
        kind: self
      - id: appendText
        kind: internal
    steps:
      - return: appendText(b, v.String())
        to: appendText
  - of: stringEncoder.empty
    steps:
      - return: v.Len() == 0, nil
  - of: timeEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: timeEncoder.encode
        kind: self
      - id: appendTime
        kind: internal
    steps:
      - bind: instant, _
        eval: reflect.TypeAssert[time.Time](v)
      - return: appendTime(b, instant), nil
        to: appendTime
  - of: timeEncoder.empty
    steps:
      - return: false, nil
  - of: cborMarshalerEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: cborMarshalerEncoder.encode
        kind: self
      - id: asMethods
        kind: internal
      - id: m.MarshalCBOR
        kind: internal
      - id: validateItem
        kind: internal
    steps:
      - bind: m, _
        eval: asMethods[interface{ MarshalCBOR() ([]byte, error) }](v)
        to: asMethods
      - bind: data, err
        eval: m.MarshalCBOR()
        to: m.MarshalCBOR
      - opt:
          do:
            - return: b, encodeCause(err, "MarshalCBOR failed for "+p.typ.String())
          when: err != nil
      - bind: n, err
        eval: validateItem(data, maxCBORNestedLevels-at.nest)
        to: validateItem
      - opt:
          do:
            - return: b, encodeFailure("MarshalCBOR of " + p.typ.String() + " returned something other than one valid CBOR data item")
          when: err != nil || n != len(data)
      - return: append(b, data...), nil
  - of: cborMarshalerEncoder.empty
    steps:
      - return: false, nil
  - of: binaryMarshalerEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: binaryMarshalerEncoder.encode
        kind: self
      - id: marshalBinary
        kind: internal
      - id: appendHead
        kind: internal
    steps:
      - bind: data, err
        eval: marshalBinary(v, p)
        to: marshalBinary
      - opt:
          do:
            - return: b, err
          when: err != nil
      - set: b
        to: appendHead
        value: appendHead(b, majorBytes, uint64(len(data)))
      - return: append(b, data...), nil
  - of: binaryMarshalerEncoder.empty
    participants:
      - id: caller
        kind: actor
      - id: binaryMarshalerEncoder.empty
        kind: self
      - id: marshalBinary
        kind: internal
    steps:
      - bind: data, err
        eval: marshalBinary(v, p)
        to: marshalBinary
      - return: len(data) == 0 && err == nil, err
  - of: marshalBinary
    participants:
      - id: caller
        kind: actor
      - id: marshalBinary
        kind: self
      - id: asMethods
        kind: internal
      - id: m.MarshalBinary
        kind: value
    steps:
      - bind: m, _
        eval: asMethods[encoding.BinaryMarshaler](v)
        to: asMethods
      - bind: data, err
        eval: m.MarshalBinary()
        to: m.MarshalBinary
      - opt:
          do:
            - return: nil, encodeCause(err, "MarshalBinary failed for "+p.typ.String())
          when: err != nil
      - return: data, nil
  - of: (*encodePlanner).fillStruct
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).fillStruct
        kind: self
      - id: layoutOf
        kind: internal
      - id: refuse
        kind: internal
      - id: pl.encodeFieldOf
        kind: internal
    steps:
      - bind: layout
        eval: layoutOf(p.typ)
        to: layoutOf
      - opt:
          do:
            - eval: refuse(p, layout.refusal+" in "+p.typ.String())
              to: refuse
            - return: ""
          when: layout.refusal != ""
      - set: p.fields
        value: make([]encodeField, 0, len(layout.fields))
      - loop:
          do:
            - bind: field, refusal
              eval: pl.encodeFieldOf(f)
              to: pl.encodeFieldOf
            - opt:
                do:
                  - eval: refuse(p, refusal)
                    to: refuse
                  - return: ""
                when: refusal != ""
            - set: p.fields
              value: append(p.fields, field)
            - opt:
                do:
                  - op: ++
                    set: p.omittable
                when: field.flags&flagOmitEmpty != 0
          key: _
          range: layout.fields
          value: f
      - opt:
          do:
            - set: p.kind, p.zero
              value: structArrayEncoder{}, zeroNoFields
            - return: ""
          when: layout.toArray
      - set: p.kind
        value: structEncoder{}
  - of: (*encodePlanner).encodeFieldOf
    participants:
      - id: caller
        kind: actor
      - id: (*encodePlanner).encodeFieldOf
        kind: self
      - id: pl.plan
        kind: internal
      - id: fieldKey
        kind: internal
    steps:
      - bind: plan
        eval: pl.plan(f.typ)
        to: pl.plan
      - opt:
          do:
            - return: encodeField{}, plan.refusal
          when: plan.refusal != ""
      - bind: key, err
        eval: fieldKey(f)
        to: fieldKey
      - opt:
          do:
            - return: encodeField{}, "a field name that is not valid UTF-8"
          when: err != nil
      - return: "encodeField{key: key, index: f.index, plan: plan, flags: f.flags}, \"\""
  - of: fieldKey
    participants:
      - id: caller
        kind: actor
      - id: fieldKey
        kind: self
      - id: appendInt
        kind: internal
      - id: appendText
        kind: internal
    steps:
      - opt:
          do:
            - return: appendInt(nil, f.nameInt), nil
              to: appendInt
          when: f.has(flagKeyAsInt)
      - return: appendText(nil, f.name)
        to: appendText
  - of: structEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: structEncoder.encode
        kind: self
      - id: at.enter
        kind: internal
      - id: appendHead
        kind: internal
      - id: appendField
        kind: internal
      - id: rewriteMapHead
        kind: internal
    steps:
      - bind: inner, err
        eval: at.enter()
        to: at.enter
      - opt:
          do:
            - return: b, err
          when: err != nil
      - bind: start
        eval: len(b)
      - set: b
        to: appendHead
        value: appendHead(b, majorMap, uint64(len(p.fields)))
      - bind: headLen
        eval: len(b) - start
      - bind: written
        eval: "0"
      - loop:
          do:
            - var:
                name: wrote
                type: bool
            - set: b, wrote, err
              to: appendField
              value: appendField(b, v, &p.fields[i], inner)
            - opt:
                do:
                  - return: b, err
                when: err != nil
            - opt:
                do:
                  - op: ++
                    set: written
                when: wrote
          key: i
          range: p.fields
      - return: rewriteMapHead(b, start, headLen, written, len(p.fields)), nil
        to: rewriteMapHead
  - of: structEncoder.empty
    participants:
      - id: caller
        kind: actor
      - id: structEncoder.empty
        kind: self
      - id: fieldValue
        kind: internal
      - id: f.plan.kind.empty
        kind: internal
    steps:
      - opt:
          do:
            - return: false, nil
          when: p.omittable < len(p.fields)
      - loop:
          do:
            - bind: f
              eval: "&p.fields[i]"
            - bind: fv, ok
              eval: fieldValue(v, f.index)
              to: fieldValue
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - bind: empty, err
              eval: f.plan.kind.empty(fv, f.plan)
              to: f.plan.kind.empty
            - opt:
                do:
                  - return: false, err
                when: err != nil || !empty
          key: i
          range: p.fields
      - return: true, nil
  - of: appendField
    participants:
      - id: caller
        kind: actor
      - id: appendField
        kind: self
      - id: fieldValue
        kind: internal
      - id: f.omitted
        kind: internal
      - id: f.plan.kind.encode
        kind: internal
    steps:
      - bind: fv, ok
        eval: fieldValue(v, f.index)
        to: fieldValue
      - opt:
          do:
            - return: b, false, nil
          when: "!ok"
      - bind: omit, err
        eval: f.omitted(fv)
        to: f.omitted
      - opt:
          do:
            - return: b, false, err
          when: err != nil || omit
      - set: b
        value: append(b, f.key...)
      - set: b, err
        to: f.plan.kind.encode
        value: f.plan.kind.encode(b, fv, f.plan, at)
      - return: b, err == nil, err
  - of: rewriteMapHead
    participants:
      - id: caller
        kind: actor
      - id: rewriteMapHead
        kind: self
      - id: appendHead
        kind: internal
    steps:
      - opt:
          do:
            - return: b
          when: written == declared
      - var:
          name: scratch
          type: "[maxHeadBytes]byte"
      - bind: head
        eval: appendHead(scratch[:0], majorMap, uint64(written))
        to: appendHead
      - opt:
          do:
            - eval: copy(b[start+len(head):], b[start+headLen:])
            - set: b
              value: b[:len(b)-shrink]
          init:
            bind: shrink
            eval: headLen - len(head)
          when: shrink > 0
      - eval: copy(b[start:], head)
      - return: b
  - of: structArrayEncoder.encode
    participants:
      - id: caller
        kind: actor
      - id: structArrayEncoder.encode
        kind: self
      - id: at.enter
        kind: internal
      - id: appendHead
        kind: internal
      - id: fieldValue
        kind: internal
      - id: f.plan.kind.encode
        kind: internal
    steps:
      - bind: inner, err
        eval: at.enter()
        to: at.enter
      - opt:
          do:
            - return: b, err
          when: err != nil
      - set: b
        to: appendHead
        value: appendHead(b, majorArray, uint64(len(p.fields)))
      - loop:
          do:
            - bind: f
              eval: "&p.fields[i]"
            - bind: fv, ok
              eval: fieldValue(v, f.index)
              to: fieldValue
            - opt:
                do:
                  - set: b
                    value: append(b, nullByte)
                  - continue: true
                when: "!ok"
            - set: b, err
              to: f.plan.kind.encode
              value: f.plan.kind.encode(b, fv, f.plan, inner)
            - opt:
                do:
                  - return: b, err
                when: err != nil
          key: i
          range: p.fields
      - return: b, nil
  - of: structArrayEncoder.empty
    steps:
      - return: len(p.fields) == 0, nil
  - of: fieldValue
    participants:
      - id: caller
        kind: actor
      - id: fieldValue
        kind: self
      - id: v.Field
        kind: value
      - id: field.Elem
        kind: value
      - id: field.Field
        kind: value
    steps:
      - set: field
        to: v.Field
        value: v.Field(index[0])
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: field, false
                      when: field.IsNil()
                  - set: field
                    to: field.Elem
                    value: field.Elem()
                when: field.Kind() == reflect.Pointer
            - set: field
              to: field.Field
              value: field.Field(step)
          key: _
          range: index[1:]
          value: step
      - return: field, true
  - of: (*encodeField).omitted
    participants:
      - id: caller
        kind: actor
      - id: (*encodeField).omitted
        kind: self
      - id: f.plan.kind.empty
        kind: internal
    steps:
      - opt:
          do:
            - bind: empty, err
              eval: f.plan.kind.empty(v, f.plan)
              to: f.plan.kind.empty
            - opt:
                do:
                  - return: empty, err
                when: err != nil || empty
          when: f.flags&flagOmitEmpty != 0
      - opt:
          do:
            - return: f.plan.zero(v)
          when: f.flags&flagOmitZero != 0
      - return: false, nil
  - of: zeroNoFields
    steps:
      - return: len(encodePlanFor(v.Type()).fields) == 0, nil
  - of: zeroFuncFor
    steps:
      - switch:
          cases:
            - case: t.Kind() == reflect.Interface && t.Implements(isZeroerType)
              do:
                - return: zeroThroughInterface
            - case: t.Kind() == reflect.Pointer && t.Implements(isZeroerType)
              do:
                - return: zeroThroughPointer
            - case: t.Implements(isZeroerType)
              do:
                - return: zeroByMethod
            - case: reflect.PointerTo(t).Implements(isZeroerType)
              do:
                - return: zeroByAddress
            - default: true
              do:
                - return: zeroByValue
  - of: zeroThroughInterface
    participants:
      - id: caller
        kind: actor
      - id: zeroThroughInterface
        kind: self
      - id: v.Elem
        kind: value
      - id: zeroByMethod
        kind: internal
    steps:
      - opt:
          do:
            - return: true, nil
          when: v.IsNil()
      - opt:
          do:
            - return: true, nil
          init:
            bind: elem
            eval: v.Elem()
            to: v.Elem
          when: elem.Kind() == reflect.Pointer && elem.IsNil()
      - return: zeroByMethod(v)
        to: zeroByMethod
  - of: zeroThroughPointer
    participants:
      - id: caller
        kind: actor
      - id: zeroThroughPointer
        kind: self
      - id: zeroByMethod
        kind: internal
    steps:
      - opt:
          do:
            - return: true, nil
          when: v.IsNil()
      - return: zeroByMethod(v)
        to: zeroByMethod
  - of: zeroByMethod
    participants:
      - id: caller
        kind: actor
      - id: zeroByMethod
        kind: self
      - id: z.IsZero
        kind: internal
    steps:
      - bind: z, _
        eval: reflect.TypeAssert[interface{ IsZero() bool }](v)
      - return: z.IsZero(), nil
        to: z.IsZero
  - of: zeroByAddress
    participants:
      - id: caller
        kind: actor
      - id: zeroByAddress
        kind: self
      - id: asMethods
