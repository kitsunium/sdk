              to: d.r.Read
            - set: d.buf
              value: d.buf[:len(d.buf)+n]
            - opt:
                do:
                  - return: n, err
                when: n > 0 || err != nil
          range: maxEmptyReads
      - return: 0, io.ErrNoProgress
  - of: walkDepth.enter
    steps:
      - opt:
          do:
            - return: w, encodeFailure("a value nested more than 32 arrays, maps and tags deep")
          when: w.nest >= maxCBORNestedLevels
      - return: "walkDepth{nest: w.nest + 1}, nil"
  - of: walkDepth.follow
    steps:
      - opt:
          do:
            - return: w, encodeFailure("more than 32 pointers and interfaces between two containers")
          when: w.hops >= maxIndirections
      - return: "walkDepth{nest: w.nest, hops: w.hops + 1}, nil"
  - of: appendValue
    participants:
      - id: caller
        kind: actor
      - id: appendValue
        kind: self
      - id: appendScalar
        kind: internal
      - id: appendStringAnyMap
        kind: internal
      - id: appendAnySlice
        kind: internal
      - id: reflect
        kind: stdlib
      - id: encodePlanFor
        kind: internal
      - id: plan.kind.encode
        kind: internal
    steps:
      - opt:
          do:
            - return: encoded, err
          init:
            bind: encoded, handled, err
            eval: appendScalar(b, x)
            to: appendScalar
          when: handled
      - typeswitch:
          bind: typed
          cases:
            - do:
                - return: appendStringAnyMap(b, typed, at)
                  to: appendStringAnyMap
              types: map[string]any
            - do:
                - return: appendAnySlice(b, typed, at)
                  to: appendAnySlice
              types: "[]any"
            - default: true
              do:
                - bind: rv
                  eval: reflect.ValueOf(x)
                  to: reflect
                - bind: plan
                  eval: encodePlanFor(rv.Type())
                  to: encodePlanFor
                - return: plan.kind.encode(b, rv, plan, at)
                  to: plan.kind.encode
          "on": x
  - of: appendScalar
