            - set: d.off
              value: start
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: count != len(p.fields.list)
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.decodeField(v, &p.fields.list[i])
                  to: d.decodeField
                when: err != nil
          key: i
          range: p.fields.list
      - return: d.closeIndefinite(h)
        to: d.closeIndefinite
  - of: (*cborDecoder).Decode
    participants:
      - id: caller
        kind: actor
      - id: (*cborDecoder).Decode
        kind: self
      - id: d.nextItem
        kind: internal
      - id: unmarshalItem
        kind: internal
    steps:
      - opt:
          do:
            - return: d.err
          when: d.err != nil
      - bind: n, err
        eval: d.nextItem()
        to: d.nextItem
      - opt:
          do:
            - set: d.done
              value: "true"
            - opt:
                do:
                  - set: d.err
                    value: err
                when: "!errors.Is(err, io.EOF)"
