              do:
                - return: time.Time{}, false, d.mismatch(h, timeType)
  - of: (*decodeState).epochTime
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).epochTime
        kind: self
      - id: d.noteMismatch
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: d.noteMismatch(h, timeType)
                    to: d.noteMismatch
                when: err == nil
            - return: time.Time{}, false, err
          when: err != nil || !fits
      - return: t, true, nil
  - of: (*decodeState).textTime
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).textTime
        kind: self
      - id: d.stringBytes
        kind: internal
      - id: time
        kind: stdlib
      - id: d.note
        kind: internal
    steps:
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: time.Time{}, false, err
          when: err != nil
      - bind: t, parseErr
        eval: time.Parse(time.RFC3339, string(content))
