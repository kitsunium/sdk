      - eval: maps.Insert(m, untypedPairs(texts))
        to: maps
      - bind: stored
        eval: "true"
      - loop:
          do:
            - opt:
                do:
                  - return: m, err
                init:
                  bind: err
                  eval: d.entryAny(m, key, stored)
                  to: d.entryAny
                when: err != nil
            - bind: more, err
              eval: d.next(seq)
              to: d.next
            - opt:
                do:
                  - return: m, err
                when: err != nil || !more
            - set: key, stored, err
              to: d.keyAny
              value: d.keyAny()
            - opt:
                do:
                  - return: m, err
                when: err != nil
          forever: true
