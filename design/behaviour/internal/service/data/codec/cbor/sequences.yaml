          do:
            - return: "\"\", false, err"
          when: err != nil
      - opt:
          do:
            - op: +=
              set: d.off
              value: h.size
            - return: "\"\", true, nil"
          when: isNull(h)
      - opt:
          do:
            - return: "\"\", false, d.mismatch(h, t)"
          when: h.major != majorText
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - return: string(content), err == nil, err
  - of: (*decodeState).mapEntries
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).mapEntries
        kind: self
      - id: p.holders.Get
        kind: value
      - id: releaseHolders
        kind: internal
      - id: d.next
        kind: internal
      - id: d.mapEntry
        kind: internal
    steps:
      - bind: holders
        eval: p.holders.Get()
        to: p.holders.Get
      - defer: releaseHolders(p.holders, holders)
        to: releaseHolders
      - loop:
          do:
            - bind: more, err
              eval: d.next(seq)
              to: d.next
            - opt:
                do:
                  - return: err
                when: err != nil || !more
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.mapEntry(v, p, holders.key, holders.value)
                  to: d.mapEntry
                when: err != nil
          forever: true
  - of: (*decodeState).mapEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).mapEntry
        kind: self
      - id: key.SetZero
        kind: value
      - id: p.key.kind.decode
        kind: internal
      - id: d.skip
        kind: internal
      - id: value.SetZero
        kind: value
      - id: p.elem.kind.decode
        kind: internal
      - id: v.SetMapIndex
        kind: value
    steps:
      - eval: key.SetZero()
        to: key.SetZero
      - bind: before
        eval: d.failures
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.key.kind.decode(d, key, p.key)
            to: p.key.kind.decode
          when: err != nil
      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: d.failures != before || !d.keyUsable(p, key)
      - eval: value.SetZero()
        to: value.SetZero
      - set: before
        value: d.failures
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.elem.kind.decode(d, value, p.elem)
            to: p.elem.kind.decode
          when: err != nil
      - opt:
          do:
            - eval: v.SetMapIndex(key, value)
              to: v.SetMapIndex
          when: d.failures == before
      - return: nil
  - of: (*decodeState).keyUsable
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).keyUsable
        kind: self
      - id: d.note
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: "!p.has(planKeyCheck) || hashable(key)"
      - eval: |-
          d.note(func() string {
          		//: the type, never the value.
          		return "a map key that cannot be a Go map key of type " + p.key.typ.String()
          	})
        to: d.note
      - return: "false"
  - of: decodePlanFor
    participants:
      - id: caller
        kind: actor
      - id: decodePlanFor
        kind: self
      - id: loadDecodePlan
        kind: internal
      - id: planner.plan
        kind: internal
      - id: decodePlans.LoadOrStore
        kind: value
    steps:
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: loadDecodePlan(t)
            to: loadDecodePlan
          when: ok
      - bind: planner
        eval: "decodePlanner{local: map[reflect.Type]*decodePlan{}}"
      - bind: root
        eval: planner.plan(t)
        to: planner.plan
      - loop:
          do:
            - eval: decodePlans.LoadOrStore(typ, p)
              to: decodePlans.LoadOrStore
          key: typ
          range: planner.local
          value: p
      - return: root
  - of: loadDecodePlan
    participants:
      - id: caller
        kind: actor
      - id: loadDecodePlan
        kind: self
      - id: decodePlans.Load
        kind: value
    steps:
      - bind: cached, ok
        eval: decodePlans.Load(t)
        to: decodePlans.Load
      - opt:
          do:
            - return: nil, false
          when: "!ok"
      - bind: plan, isPlan
        eval: cached.(*decodePlan)
      - return: plan, isPlan
  - of: (*decodePlan).has
    steps:
      - return: p.flags&flag != 0
  - of: (*decodePlanner).plan
    participants:
      - id: caller
        kind: actor
      - id: (*decodePlanner).plan
        kind: self
      - id: loadDecodePlan
        kind: internal
      - id: pl.fill
        kind: internal
    steps:
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: loadDecodePlan(t)
            to: loadDecodePlan
          when: ok
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: pl.local[t]
          when: ok
      - bind: p
        eval: "&decodePlan{typ: t}"
      - set: pl.local[t]
        value: p
      - eval: pl.fill(p)
        to: pl.fill
      - return: p
  - of: (*decodePlanner).fill
    participants:
      - id: caller
        kind: actor
      - id: (*decodePlanner).fill
        kind: self
      - id: pl.fillPointer
        kind: internal
      - id: pl.fillKind
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - switch:
          cases:
            - case: t.Kind() == reflect.Pointer
              do:
                - eval: pl.fillPointer(p)
                  to: pl.fillPointer
            - case: t.Kind() == reflect.Interface
              do:
                - set: p.kind, p.flags
                  value: interfaceKind(t), planNullable
            - case: t == timeType
              do:
                - set: p.kind
                  value: timeDecoder{}
            - case: t == bigIntType
              do:
                - set: p.kind
                  value: bigIntDecoder{}
            - case: reflect.PointerTo(t).Implements(cborUnmarshalerType)
              do:
                - set: p.kind
                  value: rawDecoder{}
            - default: true
              do:
                - opt:
                    do:
                      - op: "|="
                        set: p.flags
                        value: planBinary
                    when: reflect.PointerTo(t).Implements(binaryUnmarshalerType)
                - eval: pl.fillKind(p)
                  to: pl.fillKind
  - of: interfaceKind
    steps:
      - opt:
          do:
            - return: emptyInterfaceDecoder{}
          when: t.NumMethod() == 0
      - return: interfaceDecoder{}
  - of: (*decodePlanner).fillKind
    participants:
      - id: caller
        kind: actor
      - id: (*decodePlanner).fillKind
        kind: self
      - id: pl.plan
        kind: internal
      - id: sliceKind
        kind: internal
      - id: arrayKind
        kind: internal
      - id: pl.fillMap
        kind: internal
      - id: pl.fillStruct
        kind: internal
    steps:
      - opt:
          do:
            - set: p.kind
              value: decode
            - return: ""
          init:
            bind: decode, ok
            eval: scalarDecoders[p.typ.Kind()]
          when: ok
      - switch:
          cases:
            - case: reflect.Slice
              do:
                - set: p.elem
                  to: pl.plan
                  value: pl.plan(p.typ.Elem())
                - op: "|="
                  set: p.flags
                  value: planNullable
                - set: p.kind
                  to: sliceKind
                  value: sliceKind(p.typ)
            - case: reflect.Array
              do:
                - set: p.elem
                  to: pl.plan
                  value: pl.plan(p.typ.Elem())
                - set: p.kind
                  to: arrayKind
                  value: arrayKind(p.typ)
            - case: reflect.Map
              do:
                - eval: pl.fillMap(p)
                  to: pl.fillMap
            - case: reflect.Struct
              do:
                - eval: pl.fillStruct(p)
                  to: pl.fillStruct
            - default: true
              do:
                - set: p.refusal, p.kind
                  value: "\"a value of a type CBOR cannot fill: \"+p.typ.String(), refusedDecoder{}"
          "on": p.typ.Kind()
  - of: sliceKind
    steps:
      - opt:
          do:
            - return: byteSliceDecoder{}
          when: t.Elem().Kind() == reflect.Uint8
      - return: sliceDecoder{}
  - of: arrayKind
    steps:
      - opt:
          do:
            - return: byteArrayDecoder{}
          when: t.Elem().Kind() == reflect.Uint8
      - return: arrayDecoder{}
  - of: (*decodePlanner).fillPointer
    steps:
      - op: "|="
        set: p.flags
        value: planNullable
      - opt:
          do:
            - set: p.refusal, p.kind
              value: "\"a value of a self-referential pointer type: \"+p.typ.String(), refusedDecoder{}"
            - return: ""
          when: pointerCycle(p.typ)
      - set: p.elem, p.kind
        value: pl.plan(p.typ.Elem()), pointerDecoder{}
  - of: (*decodePlanner).fillMap
    participants:
      - id: caller
        kind: actor
      - id: (*decodePlanner).fillMap
        kind: self
      - id: newHolders
        kind: internal
    steps:
      - set: p.key, p.elem
        value: pl.plan(p.typ.Key()), pl.plan(p.typ.Elem())
      - op: "|="
        set: p.flags
        value: planNullable
      - opt:
          do:
            - op: "|="
              set: p.flags
              value: planKeyCheck
          when: mayHoldUnhashable(p.typ.Key())
      - set: p.holders
        to: newHolders
        value: newHolders(p.typ)
      - set: p.kind
        value: mapDecoder{}
  - of: mayHoldUnhashable
    participants:
      - id: caller
        kind: actor
      - id: mayHoldUnhashable
        kind: self
      - id: structMayHoldUnhashable
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Interface
              do:
                - return: "true"
            - case: reflect.Array
              do:
                - return: mayHoldUnhashable(t.Elem())
                  to: mayHoldUnhashable
            - case: reflect.Struct
              do:
                - return: structMayHoldUnhashable(t)
                  to: structMayHoldUnhashable
            - default: true
              do:
                - return: "false"
          "on": t.Kind()
  - of: hashable
    participants:
      - id: caller
        kind: actor
      - id: hashable
        kind: self
      - id: allHashable
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Interface
              do:
                - return: v.IsNil() || hashable(v.Elem())
            - case: reflect.Slice, reflect.Map, reflect.Func
              do:
                - return: "false"
            - case: reflect.Array
              do:
                - return: allHashable(v.Len(), v.Index)
                  to: allHashable
            - case: reflect.Struct
              do:
                - return: allHashable(v.NumField(), v.Field)
                  to: allHashable
            - default: true
              do:
                - return: "true"
          "on": v.Kind()
  - of: (*decodeState).begin
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).begin
        kind: self
      - id: d.skipTags
        kind: internal
      - id: v.SetZero
        kind: value
    steps:
      - set: h, err
        to: d.skipTags
        value: d.skipTags()
      - opt:
          do:
            - return: h, true, err
          when: err != nil
      - opt:
          do:
            - op: +=
              set: d.off
              value: h.size
            - opt:
                do:
                  - eval: v.SetZero()
                    to: v.SetZero
                when: p.has(planNullable)
            - return: h, true, nil
          when: isNull(h)
      - opt:
          do:
            - return: h, true, d.unmarshalBinary(v, p, h)
          when: h.major == majorBytes && p.has(planBinary)
      - return: h, false, nil
  - of: (*decodeState).skipTags
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).skipTags
        kind: self
      - id: d.peek
        kind: internal
    steps:
      - loop:
          do:
            - bind: h, err
              eval: d.peek()
              to: d.peek
            - opt:
                do:
                  - return: h, err
                when: err != nil || h.major != majorTag || h.arg == tagPositiveBignum || h.arg == tagNegativeBignum
            - op: +=
              set: d.off
              value: h.size
          forever: true
  - of: (*decodeState).unmarshalBinary
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).unmarshalBinary
        kind: self
      - id: d.stringBytes
        kind: internal
      - id: addressedMethods
        kind: internal
      - id: d.noteMismatch
        kind: internal
      - id: u.UnmarshalBinary
        kind: value
      - id: d.noteCause
        kind: internal
    steps:
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: u, ok
        eval: addressedMethods[encoding.BinaryUnmarshaler](v)
        to: addressedMethods
      - opt:
          do:
            - eval: d.noteMismatch(h, p.typ)
              to: d.noteMismatch
            - return: nil
          when: "!ok"
      - opt:
          do:
            - eval: d.noteCause(unmarshalErr, "UnmarshalBinary failed for "+p.typ.String())
              to: d.noteCause
          init:
            bind: unmarshalErr
            eval: u.UnmarshalBinary(content)
            to: u.UnmarshalBinary
          when: unmarshalErr != nil
      - return: nil
  - of: (*decodeState).noteCause
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).noteCause
        kind: self
      - id: decodeCause
        kind: internal
    steps:
      - op: ++
        set: d.failures
      - opt:
          do:
            - set: d.first
              to: decodeCause
              value: decodeCause(cause, detail)
          when: d.first == nil
  - of: addressedMethods
    steps:
      - opt:
          do:
            - var:
                name: none
                type: I
            - return: none, false
          when: "!v.CanAddr()"
      - return: reflect.TypeAssert[I](v.Addr())
  - of: rawDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: rawDecoder.decode
        kind: self
      - id: d.skip
        kind: internal
      - id: addressedMethods
        kind: internal
      - id: d.note
        kind: internal
      - id: u.UnmarshalCBOR
        kind: internal
      - id: d.noteCause
        kind: internal
    steps:
      - bind: start
        eval: d.off
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.skip()
            to: d.skip
          when: err != nil
      - bind: u, ok
        eval: addressedMethods[interface{ UnmarshalCBOR(data []byte) error }](v)
        to: addressedMethods
      - opt:
          do:
            - eval: |-
                d.note(func() string {
                			//: the type.
                			return "cannot call UnmarshalCBOR on an unaddressable " + p.typ.String()
                		})
              to: d.note
            - return: nil
          when: "!ok"
      - opt:
          do:
            - eval: d.noteCause(err, "UnmarshalCBOR failed for "+p.typ.String())
              to: d.noteCause
          init:
            bind: err
            eval: u.UnmarshalCBOR(d.data[start:d.off])
            to: u.UnmarshalCBOR
          when: err != nil
      - return: nil
  - of: refusedDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: refusedDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.note
        kind: internal
      - id: d.skip
        kind: internal
    steps:
      - bind: _, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - eval: |-
          d.note(func() string {
          		//: the reason the plan was refused.
          		return p.refusal
          	})
        to: d.note
      - return: d.skip()
        to: d.skip
  - of: pointerDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: pointerDecoder.decode
        kind: self
      - id: d.peekPastTags
        kind: internal
      - id: v.SetZero
        kind: value
      - id: d.skip
        kind: internal
      - id: v.Set
        kind: value
      - id: p.elem.kind.decode
        kind: internal
    steps:
      - bind: h, err
        eval: d.peekPastTags()
        to: d.peekPastTags
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
            - return: d.skip()
              to: d.skip
          when: isNull(h)
      - opt:
          do:
            - eval: v.Set(reflect.New(p.typ.Elem()))
              to: v.Set
          when: v.IsNil()
      - return: p.elem.kind.decode(d, v.Elem(), p.elem)
        to: p.elem.kind.decode
  - of: (*decodeState).peekPastTags
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).peekPastTags
        kind: self
      - id: readHead
        kind: internal
    steps:
      - bind: "off"
        eval: d.off
      - loop:
          do:
            - bind: h, ok
              eval: readHead(d.data, off)
              to: readHead
            - opt:
                do:
                  - return: h, d.corrupt()
                when: "!ok"
            - opt:
                do:
                  - return: h, nil
                when: h.major != majorTag
            - op: +=
              set: "off"
              value: h.size
          forever: true
  - of: emptyInterfaceDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: emptyInterfaceDecoder.decode
        kind: self
      - id: d.decodeAny
        kind: internal
      - id: v.SetZero
        kind: value
      - id: v.Set
        kind: value
    steps:
      - bind: x, err
        eval: d.decodeAny()
        to: d.decodeAny
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
            - return: err
          when: x == nil
      - eval: v.Set(reflect.ValueOf(x))
        to: v.Set
      - return: err
  - of: interfaceDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: interfaceDecoder.decode
        kind: self
      - id: d.peekPastTags
        kind: internal
      - id: v.SetZero
        kind: value
      - id: d.skip
        kind: internal
      - id: v.Elem
        kind: value
      - id: d.mismatch
        kind: internal
      - id: decodePlanFor
        kind: internal
      - id: plan.kind.decode
        kind: internal
    steps:
      - bind: h, err
        eval: d.peekPastTags()
        to: d.peekPastTags
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
            - return: d.skip()
              to: d.skip
          when: isNull(h)
      - bind: held
        eval: v.Elem()
        to: v.Elem
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: v.IsNil() || held.Kind() != reflect.Pointer || held.IsNil()
      - bind: plan
        eval: decodePlanFor(held.Type().Elem())
        to: decodePlanFor
      - return: plan.kind.decode(d, held.Elem(), plan)
        to: plan.kind.decode
  - of: boolDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: boolDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.SetBool
        kind: value
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: h.major != majorSimple || (h.info != simpleTrue && h.info != simpleFalse)
      - op: +=
        set: d.off
        value: h.size
      - eval: v.SetBool(h.info == simpleTrue)
        to: v.SetBool
      - return: nil
  - of: intDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: intDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.signedValue
        kind: internal
      - id: d.noteMismatch
        kind: internal
      - id: v.SetInt
        kind: value
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - bind: n, fits, err
        eval: d.signedValue(h)
        to: d.signedValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: d.noteMismatch(h, p.typ)
              to: d.noteMismatch
            - return: nil
          when: "!fits || v.OverflowInt(n)"
      - eval: v.SetInt(n)
        to: v.SetInt
      - return: nil
  - of: uintDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: uintDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.unsignedValue
        kind: internal
      - id: d.noteMismatch
        kind: internal
      - id: v.SetUint
        kind: value
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - bind: n, fits, err
        eval: d.unsignedValue(h)
        to: d.unsignedValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: d.noteMismatch(h, p.typ)
              to: d.noteMismatch
            - return: nil
          when: "!fits || v.OverflowUint(n)"
      - eval: v.SetUint(n)
        to: v.SetUint
      - return: nil
  - of: floatDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: floatDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.floatValue
        kind: internal
      - id: d.noteMismatch
        kind: internal
      - id: v.SetFloat
        kind: value
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - bind: f, fits, err
        eval: d.floatValue(h)
        to: d.floatValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: d.noteMismatch(h, p.typ)
              to: d.noteMismatch
            - return: nil
          when: "!fits || v.OverflowFloat(f)"
      - eval: v.SetFloat(f)
        to: v.SetFloat
      - return: nil
  - of: stringDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: stringDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: d.stringBytes
        kind: internal
      - id: v.SetString
        kind: value
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: h.major != majorText
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: v.SetString(string(content))
        to: v.SetString
      - return: nil
  - of: (*decodeState).signedValue
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).signedValue
        kind: self
      - id: d.readBignum
        kind: internal
      - id: bigInt64
        kind: internal
    steps:
      - switch:
          cases:
            - case: majorUnsigned
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: int64(h.arg), h.arg <= math.MaxInt64, nil
            - case: majorNegative
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: ^int64(h.arg), h.arg <= math.MaxInt64, nil
            - case: majorTag
              do:
                - bind: wide, err
                  eval: d.readBignum(h)
                  to: d.readBignum
                - return: bigInt64(wide), wide != nil && wide.IsInt64(), err
                  to: bigInt64
            - default: true
              do:
                - return: 0, false, d.skip()
          "on": h.major
  - of: (*decodeState).unsignedValue
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).unsignedValue
        kind: self
      - id: d.readBignum
        kind: internal
      - id: bigUint64
        kind: internal
    steps:
      - switch:
          cases:
            - case: majorUnsigned
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: h.arg, true, nil
            - case: majorTag
              do:
                - bind: wide, err
                  eval: d.readBignum(h)
                  to: d.readBignum
                - return: bigUint64(wide), wide != nil && wide.IsUint64(), err
                  to: bigUint64
            - default: true
              do:
                - return: 0, false, d.skip()
          "on": h.major
  - of: (*decodeState).floatValue
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).floatValue
        kind: self
      - id: floatOf
        kind: internal
      - id: d.bignumFloat
        kind: internal
    steps:
      - switch:
          cases:
            - case: isFloatHead(h)
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: floatOf(h), true, nil
                  to: floatOf
            - case: h.major == majorUnsigned
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: float64(h.arg), true, nil
            - case: h.major == majorNegative
              do:
                - op: +=
                  set: d.off
                  value: h.size
                - return: float64(^int64(h.arg)), h.arg <= math.MaxInt64, nil
            - case: h.major == majorTag
              do:
                - return: d.bignumFloat(h)
                  to: d.bignumFloat
            - default: true
              do:
                - return: 0, false, d.skip()
  - of: (*decodeState).bignumFloat
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).bignumFloat
        kind: self
      - id: d.readBignum
        kind: internal
    steps:
      - bind: wide, err
        eval: d.readBignum(h)
        to: d.readBignum
      - opt:
          do:
            - return: 0, false, err
          when: err != nil || wide == nil
      - opt:
          do:
            - return: float64(wide.Uint64()), wide.IsUint64(), nil
          when: h.arg == tagPositiveBignum
      - return: float64(wide.Int64()), wide.IsInt64(), nil
  - of: (*decodeState).readBignum
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).readBignum
        kind: self
      - id: d.bignumContent
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, d.skip()
          when: h.major != majorTag || (h.arg != tagPositiveBignum && h.arg != tagNegativeBignum)
      - op: +=
        set: d.off
        value: h.size
      - return: d.bignumContent(h.arg)
        to: d.bignumContent
  - of: bigInt64
    participants:
      - id: caller
        kind: actor
      - id: bigInt64
        kind: self
      - id: n.Int64
        kind: value
    steps:
      - opt:
          do:
            - return: "0"
          when: n == nil
      - return: n.Int64()
        to: n.Int64
  - of: bigUint64
    participants:
      - id: caller
        kind: actor
      - id: bigUint64
        kind: self
      - id: n.Uint64
        kind: value
