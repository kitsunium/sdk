            bind: m, ok
            eval: reflect.TypeAssert[map[string]any](v)
          when: ok
      - opt:
          do:
            - return: true, stringKeyedEntries(d, m, seq, d.textEntry)
          init:
            bind: m, ok
            eval: reflect.TypeAssert[map[string]string](v)
          when: ok
      - return: false, nil
  - of: stringKeyedEntries
    participants:
      - id: caller
        kind: actor
      - id: stringKeyedEntries
        kind: self
      - id: d.next
        kind: internal
      - id: stringKeyedEntry
        kind: internal
    steps:
      - loop:
          do:
            - bind: more, err
              eval: d.next(seq)
              to: d.next
            - opt:
                do:
                  - return: err
                when: err != nil || !more
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: stringKeyedEntry(d, m, value)
                  to: stringKeyedEntry
                when: err != nil
          forever: true
  - of: stringKeyedEntry
    participants:
      - id: caller
        kind: actor
      - id: stringKeyedEntry
        kind: self
      - id: d.readText
        kind: internal
      - id: d.skip
        kind: internal
    steps:
      - bind: key, stored, err
        eval: d.readText(stringType)
        to: d.readText
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: "!stored"
      - bind: elem, stored, err
        eval: value()
      - opt:
          do:
            - set: m[key]
              value: elem
          when: err == nil && stored
      - return: err
  - of: (*decodeState).anyEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).anyEntry
        kind: self
      - id: d.decodeAny
        kind: internal
