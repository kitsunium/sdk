                decodeField{
                			name: f.name, nameBytes: []byte(f.name), path: p.typ.String() + "." + f.name, index: f.index,
                			plan: pl.plan(f.typ), nameInt: f.nameInt, keyAsInt: f.has(flagKeyAsInt),
                		}
          key: i
          range: layout.fields
          value: f
      - eval: fields.indexNames()
        to: fields.indexNames
      - set: p.fields, p.kind
