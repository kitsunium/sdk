      - bind: before
        eval: d.failures
      - set: value, err
        to: d.decodeAny
        value: d.decodeAny()
      - return: value, d.failures == before, err
  - of: (*decodeState).textEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).textEntry
        kind: self
      - id: d.readText
        kind: internal
    steps:
      - return: d.readText(stringType)
        to: d.readText
  - of: (*decodeState).readText
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).readText
        kind: self
      - id: d.skipTags
        kind: internal
      - id: d.stringBytes
        kind: internal
    steps:
      - bind: h, err
        eval: d.skipTags()
        to: d.skipTags
