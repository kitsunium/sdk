            - opt:
                do:
                  - eval: zeroFrom(v, filled)
                    to: zeroFrom
                  - return: err
                when: err != nil || !more
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.arrayElement(v, p, filled)
                  to: d.arrayElement
                when: err != nil
            - op: ++
              set: filled
          forever: true
  - of: (*decodeState).arrayElement
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).arrayElement
        kind: self
      - id: d.skip
        kind: internal
      - id: p.elem.kind.decode
        kind: internal
