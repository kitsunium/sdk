      - set: err
        to: unmarshalItem
        value: unmarshalItem(item, v)
      - opt:
          do:
            - set: d.done
              value: "true"
          when: err != nil
      - return: err
  - of: (*cborDecoder).More
    steps:
      - return: "!d.done"
  - of: (*cborDecoder).nextItem
    participants:
      - id: caller
        kind: actor
      - id: (*cborDecoder).nextItem
        kind: self
      - id: d.walk.resume
        kind: internal
      - id: d.fill
        kind: internal
    steps:
      - loop:
          do:
            - bind: complete, err
              eval: d.walk.resume(d.buf[d.off:])
              to: d.walk.resume
            - opt:
                do:
                  - return: 0, err
                when: err != nil
            - opt:
                do:
                  - return: d.walk.off, nil
                when: complete
            - opt:
                do:
                  - return: 0, err
                init:
                  bind: err
                  eval: d.fill()
                  to: d.fill
                when: err != nil
          forever: true
  - of: (*cborDecoder).fill
    participants:
      - id: caller
        kind: actor
      - id: (*cborDecoder).fill
        kind: self
      - id: d.compact
        kind: internal
      - id: d.read
        kind: internal
      - id: malformed
        kind: internal
      - id: decodeCause
        kind: internal
    steps:
      - eval: d.compact()
        to: d.compact
      - bind: n, err
        eval: d.read()
        to: d.read
      - opt:
          do:
            - return: nil
          when: n > 0
      - opt:
          do:
            - opt:
                do:
                  - return: io.EOF
                when: len(d.buf) == d.off
            - return: malformed(len(d.buf)-d.off, "the stream ends inside a data item")
              to: malformed
          when: errors.Is(err, io.EOF)
      - return: decodeCause(err, "reading the stream failed")
        to: decodeCause
  - of: (*cborDecoder).compact
    steps:
      - opt:
          do:
            - return: ""
          when: d.off == 0
      - bind: "n"
        eval: copy(d.buf, d.buf[d.off:])
      - set: d.buf
        value: d.buf[:n]
      - set: d.off
        value: "0"
  - of: (*cborDecoder).read
    participants:
      - id: caller
        kind: actor
      - id: (*cborDecoder).read
        kind: self
      - id: slices
        kind: stdlib
      - id: d.r.Read
        kind: value
