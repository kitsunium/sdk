          do:
            - return: i, true
          init:
            bind: i, ok
            eval: fs.exact(key)
            to: fs.exact
          when: ok
      - return: fs.folded(key)
        to: fs.folded
  - of: newFieldSet
    steps:
      - opt:
          do:
            - return: fieldSet{}
          when: n <= smallFieldSet
      - return: "fieldSet{large: make([]bool, n)}"
  - of: (*fieldSet).has
    steps:
      - opt:
          do:
            - return: s.large[i]
          when: s.large != nil
      - return: s.small&(1<<uint(i)) != 0
  - of: (*fieldSet).add
    steps:
      - opt:
          do:
            - set: s.large[i]
              value: "true"
            - return: ""
          when: s.large != nil
      - op: "|="
        set: s.small
        value: 1 << uint(i)
  - of: structDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: structDecoder.decode
