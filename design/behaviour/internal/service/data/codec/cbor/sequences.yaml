          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: p.elem.kind.decode(d, v.Index(i), p.elem)
                  to: p.elem.kind.decode
                when: err != nil
          key: i
          range: count
      - return: d.closeIndefinite(h)
        to: d.closeIndefinite
  - of: prepareSlice
    participants:
      - id: caller
        kind: actor
      - id: prepareSlice
        kind: self
      - id: v.Set
        kind: value
      - id: v.SetLen
        kind: value
      - id: v.Index(i).SetZero
        kind: value
