    steps:
      - return:
          closure:
            params: yield func(any, any) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(text, value)"
                  key: text
                  range: texts
                  value: value
  - of: (*decodeState).entryAny
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).entryAny
        kind: self
      - id: d.skip
        kind: internal
      - id: d.note
        kind: internal
      - id: d.decodeAny
        kind: internal
    steps:
      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: "!stored"
      - opt:
          do:
            - eval: |-
                d.note(func() string {
                			//: the type, never the value.
                			return "a map key that cannot be a Go map key (a byte string, an array, a map or a bignum)"
                		})
              to: d.note
            - return: d.skip()
              to: d.skip
          when: "!hashableAny(key)"
      - bind: value, err
        eval: d.decodeAny()
        to: d.decodeAny
      - set: m[key]
        value: value
      - return: err
  - of: hashableAny
    steps:
      - typeswitch:
          cases:
            - do:
                - return: "false"
              types: "[]byte, []any, map[string]any, map[any]any, big.Int"
            - default: true
              do:
                - return: "true"
          "on": key
  - of: mapHint
    steps:
      - opt:
          do:
            - return: "0"
          when: h.info == infoIndefinite
      - return: int(h.arg)
  - of: (*decodeState).tagAny
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).tagAny
        kind: self
      - id: d.timeAny
        kind: internal
      - id: d.bignumContent
        kind: internal
      - id: d.decodeAny
        kind: internal
    steps:
      - op: +=
        set: d.off
        value: h.size
      - switch:
          cases:
            - case: tagDateTime, tagEpoch
              do:
                - return: d.timeAny()
                  to: d.timeAny
            - case: tagPositiveBignum, tagNegativeBignum
              do:
                - bind: n, err
                  eval: d.bignumContent(h.arg)
                  to: d.bignumContent
                - opt:
                    do:
                      - return: nil, err
                    when: err != nil
                - return: "*n, nil"
            - default: true
              do:
                - return: d.decodeAny()
                  to: d.decodeAny
          "on": h.arg
  - of: (*decodeState).timeAny
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).timeAny
        kind: self
      - id: d.peek
        kind: internal
      - id: d.timeValue
        kind: internal
    steps:
      - bind: h, err
        eval: d.peek()
        to: d.peek
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: t, stored, err
        eval: d.timeValue(h)
        to: d.timeValue
      - opt:
          do:
            - return: nil, err
          when: err != nil || !stored
      - return: t, nil
  - of: (*decodeState).simpleAny
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).simpleAny
        kind: self
      - id: floatOf
        kind: internal
      - id: d.note
        kind: internal
    steps:
      - switch:
          cases:
            - case: h.info == simpleFalse || h.info == simpleTrue
              do:
                - return: h.info == simpleTrue
            - case: h.info == simpleNull || h.info == simpleUndefined
              do:
                - return: nil
            - case: isFloatHead(h)
              do:
                - return: floatOf(h)
                  to: floatOf
            - default: true
              do:
                - eval: |-
                    d.note(func() string {
                    			//: RFC 8949 §5.4 lets a decoder refuse what it does not know.
                    			return "an unassigned simple value, which has no Go value"
                    		})
                  to: d.note
                - return: nil
  - of: (*decodeState).bignumContent
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).bignumContent
        kind: self
      - id: d.peek
        kind: internal
      - id: d.stringBytes
        kind: internal
      - id: new(big.Int).SetBytes
        kind: value
      - id: n.Not
        kind: value
    steps:
      - bind: h, err
        eval: d.peek()
        to: d.peek
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: "n"
        eval: new(big.Int).SetBytes(content)
        to: new(big.Int).SetBytes
      - opt:
          do:
            - eval: n.Not(n)
              to: n.Not
          when: tag == tagNegativeBignum
      - return: n, nil
  - of: byteSliceDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: byteSliceDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.storeBytes
        kind: internal
      - id: d.fillSlice
        kind: internal
      - id: d.storeBignumBytes
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - switch:
          cases:
            - case: majorBytes
              do:
                - return: d.storeBytes(v, h)
                  to: d.storeBytes
            - case: majorArray
              do:
                - return: d.fillSlice(v, p, h)
                  to: d.fillSlice
            - case: majorTag
              do:
                - return: d.storeBignumBytes(v, h, d.storeBytes)
                  to: d.storeBignumBytes
            - default: true
              do:
                - return: d.mismatch(h, p.typ)
                  to: d.mismatch
          "on": h.major
  - of: (*decodeState).storeBytes
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).storeBytes
        kind: self
      - id: d.stringBytes
        kind: internal
      - id: bytes
        kind: stdlib
      - id: v.SetBytes
        kind: value
    steps:
      - bind: content, fresh, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - set: content
              to: bytes
              value: bytes.Clone(content)
          when: "!fresh"
      - eval: v.SetBytes(content)
        to: v.SetBytes
      - return: nil
  - of: (*decodeState).storeBignumBytes
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).storeBignumBytes
        kind: self
      - id: d.peek
        kind: internal
    steps:
      - op: +=
        set: d.off
        value: h.size
      - bind: content, err
        eval: d.peek()
        to: d.peek
      - opt:
          do:
            - return: err
          when: err != nil
      - return: store(v, content)
  - of: byteArrayDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: byteArrayDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.copyBytes
        kind: internal
      - id: d.fillArray
        kind: internal
      - id: d.storeBignumBytes
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - switch:
          cases:
            - case: majorBytes
              do:
                - return: d.copyBytes(v, h)
                  to: d.copyBytes
            - case: majorArray
              do:
                - return: d.fillArray(v, p, h)
                  to: d.fillArray
            - case: majorTag
              do:
                - return: d.storeBignumBytes(v, h, d.copyBytes)
                  to: d.storeBignumBytes
            - default: true
              do:
                - return: d.mismatch(h, p.typ)
                  to: d.mismatch
          "on": h.major
  - of: (*decodeState).copyBytes
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).copyBytes
        kind: self
      - id: d.stringBytes
        kind: internal
      - id: v.Index(i).SetUint
        kind: value
    steps:
      - bind: content, _, err
        eval: d.stringBytes(h)
        to: d.stringBytes
      - opt:
          do:
            - return: err
          when: err != nil
