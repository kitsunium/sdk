      - opt:
          do:
            - return: "0"
          when: n == nil
      - return: n.Uint64()
        to: n.Uint64
  - of: timeDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: timeDecoder.decode
        kind: self
      - id: d.skipAllTags
        kind: internal
      - id: d.timeValue
        kind: internal
      - id: setValue
        kind: internal
    steps:
      - bind: h, err
        eval: d.skipAllTags()
        to: d.skipAllTags
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - op: +=
              set: d.off
              value: h.size
            - return: nil
          when: isNull(h)
      - bind: t, stored, err
        eval: d.timeValue(h)
        to: d.timeValue
      - opt:
          do:
            - return: err
          when: err != nil || !stored
      - eval: setValue(v, t)
        to: setValue
      - return: nil
  - of: (*decodeState).timeValue
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).timeValue
        kind: self
      - id: d.textTime
        kind: internal
      - id: d.signedValue
        kind: internal
      - id: d.epochTime
        kind: internal
      - id: d.floatTime
        kind: internal
    steps:
      - switch:
          cases:
            - case: h.major == majorText
              do:
                - return: d.textTime(h)
                  to: d.textTime
            - case: h.major == majorUnsigned || h.major == majorNegative
              do:
                - bind: n, fits, signedErr
                  eval: d.signedValue(h)
                  to: d.signedValue
                - return: d.epochTime(h, time.Unix(n, 0), fits, signedErr)
                  to: d.epochTime
