  - of: lookupText
    participants:
      - id: caller
        kind: actor
      - id: lookupText
        kind: self
      - id: fs.byText
        kind: internal
    steps:
      - opt:
          do:
            - return: "-1, false, err"
          when: err != nil
      - bind: i, found
        eval: fs.byText(content)
        to: fs.byText
      - return: i, found, nil
  - of: (*decodeState).intField
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).intField
        kind: self
      - id: d.noteMismatch
        kind: internal
      - id: p.fields.byInt
        kind: internal
    steps:
      - opt:
