          do:
            - return: d.skip()
              to: d.skip
          when: "!found || seen.has(idx)"
      - eval: seen.add(idx)
        to: seen.add
      - return: d.decodeField(v, &p.fields.list[idx])
        to: d.decodeField
  - of: (*decodeState).fieldIndex
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).fieldIndex
