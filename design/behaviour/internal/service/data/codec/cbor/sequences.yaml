        to: v.SetLen
      - loop:
          do:
            - eval: v.Index(i).SetZero()
              to: v.Index(i).SetZero
          key: i
          range: count
  - of: arrayDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: arrayDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: d.fillArray
        kind: internal
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: h.major != majorArray
      - return: d.fillArray(v, p, h)
        to: d.fillArray
  - of: (*decodeState).fillArray
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).fillArray
