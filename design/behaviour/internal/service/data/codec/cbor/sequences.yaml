      - opt:
          do:
            - eval: |-
                d.note(func() string {
                			//: never the text itself.
                			return "a text string that is not an RFC 3339 date/time"
                		})
              to: d.note
            - return: time.Time{}, false, nil
          when: parseErr != nil
      - return: t, true, nil
  - of: (*decodeState).floatTime
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).floatTime
        kind: self
      - id: math
        kind: stdlib
      - id: d.noteMismatch
        kind: internal
      - id: time
        kind: stdlib
    steps:
      - opt:
          do:
            - return: time.Time{}, true, nil
          when: math.IsNaN(seconds) || math.IsInf(seconds, 0)
      - bind: whole, fraction
        eval: math.Modf(seconds)
        to: math
      - opt:
          do:
            - eval: d.noteMismatch(h, timeType)
              to: d.noteMismatch
            - return: time.Time{}, false, nil
          when: whole >= maxEpochSeconds || whole < -maxEpochSeconds
