        eval: p.fields.byInt(n)
        to: p.fields.byInt
      - return: i, found, nil
  - of: (*decodeState).decodeField
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).decodeField
        kind: self
      - id: fieldTarget
        kind: internal
      - id: d.note
        kind: internal
      - id: d.skip
        kind: internal
      - id: f.plan.kind.decode
        kind: internal
    steps:
      - bind: target, ok
        eval: fieldTarget(v, f.index)
        to: fieldTarget
      - opt:
          do:
            - eval: |-
                d.note(func() string {
                			//: fxamacker/cbor refused it too.
                			return "the field " + f.path + " is promoted through a nil, unexported embedded pointer"
                		})
              to: d.note
            - return: d.skip()
              to: d.skip
          when: "!ok"
      - bind: outer
        eval: d.field
      - set: d.field
        value: f.path
      - bind: err
        eval: f.plan.kind.decode(d, target, f.plan)
        to: f.plan.kind.decode
      - set: d.field
        value: outer
      - return: err
  - of: fieldTarget
    participants:
      - id: caller
        kind: actor
      - id: fieldTarget
        kind: self
      - id: v.Field
        kind: value
      - id: field.Set
        kind: value
      - id: field.Elem
        kind: value
      - id: field.Field
        kind: value
    steps:
      - set: field
        to: v.Field
        value: v.Field(index[0])
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: field, false
                      when: field.IsNil() && !field.CanSet()
                  - opt:
                      do:
                        - eval: field.Set(reflect.New(field.Type().Elem()))
                          to: field.Set
                      when: field.IsNil()
                  - set: field
                    to: field.Elem
                    value: field.Elem()
                when: field.Kind() == reflect.Pointer
            - set: field
              to: field.Field
              value: field.Field(step)
          key: _
          range: index[1:]
          value: step
      - return: field, true
  - of: (*decodeState).structFromArray
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).structFromArray
        kind: self
      - id: d.mismatch
        kind: internal
      - id: d.entryCount
        kind: internal
      - id: d.decodeField
        kind: internal
      - id: d.closeIndefinite
        kind: internal
    steps:
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: h.major != majorArray
      - bind: start
        eval: d.off
      - op: +=
        set: d.off
        value: h.size
      - bind: count, err
        eval: d.entryCount(h)
        to: d.entryCount
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
