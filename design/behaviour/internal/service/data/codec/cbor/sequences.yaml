          do:
            - var:
                name: b
                type: byte
            - opt:
                do:
                  - set: b
                    value: content[i]
                when: i < len(content)
            - eval: v.Index(i).SetUint(uint64(b))
              to: v.Index(i).SetUint
          key: i
          range: v.Len()
      - return: nil
  - of: sliceDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: sliceDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: d.fillSlice
        kind: internal
    steps:
      - bind: h, done, err
        eval: d.begin(v, p)
        to: d.begin
      - opt:
          do:
            - return: err
          when: done || err != nil
      - opt:
          do:
            - return: d.mismatch(h, p.typ)
              to: d.mismatch
          when: h.major != majorArray
      - return: d.fillSlice(v, p, h)
        to: d.fillSlice
  - of: (*decodeState).fillSlice
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).fillSlice
