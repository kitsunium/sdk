      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: i >= v.Len()
      - return: p.elem.kind.decode(d, v.Index(i), p.elem)
        to: p.elem.kind.decode
  - of: zeroFrom
    participants:
      - id: caller
        kind: actor
      - id: zeroFrom
        kind: self
      - id: v.Index(i).SetZero
        kind: value
    steps:
      - loop:
          cond: i < v.Len()
          do:
            - eval: v.Index(i).SetZero()
              to: v.Index(i).SetZero
          init: i := from
          post: i++
  - of: mapDecoder.decode
    participants:
      - id: caller
        kind: actor
      - id: mapDecoder.decode
        kind: self
      - id: d.begin
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.Set
        kind: value
      - id: newSequence
        kind: internal
      - id: d.knownMapEntries
        kind: internal
      - id: d.mapEntries
        kind: internal
