            - opt:
                do:
                  - continue: true
                when: sf.PkgPath != ""
            - set: fields
              value: |-
                append(fields, structFieldInfo{
                			name:       sf.Name,
                			nameBytes:  []byte(sf.Name),
                			index:      i,
                			typ:        sf.Type,
                			kind:       sf.Type.Kind(),
                			namePrefix: buildNamePrefix(sf.Name),
                		})
          key: i
          range: "n"
      - return: "&structTypeInfo{fields: fields}"
