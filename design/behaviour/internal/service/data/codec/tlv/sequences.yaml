      - return: int(length)
  - of: assignDecoded
    participants:
      - id: caller
        kind: actor
      - id: assignDecoded
        kind: self
      - id: reflect
        kind: stdlib
      - id: cannotSetError
        kind: internal
      - id: rv.Set
        kind: value
      - id: convertValue
        kind: internal
    steps:
      - bind: rv
        eval: reflect.Value(target)
        to: reflect
