    participants:
      - id: caller
        kind: actor
      - id: projectComposite
        kind: self
      - id: projectCompositeStruct
        kind: internal
      - id: projectCompositeSlice
        kind: internal
      - id: projectCompositeMap
        kind: internal
      - id: projectCompositePointer
        kind: internal
