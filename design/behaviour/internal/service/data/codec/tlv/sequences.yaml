      - switch:
          cases:
            - case: reflect.Struct
              do:
                - return: projectCompositeStruct(value, target)
                  to: projectCompositeStruct
            - case: reflect.Slice
              do:
                - return: projectCompositeSlice(value, target)
                  to: projectCompositeSlice
            - case: reflect.Map
              do:
                - return: projectCompositeMap(value, target)
                  to: projectCompositeMap
            - case: reflect.Pointer
              do:
                - return: projectCompositePointer(value, target)
                  to: projectCompositePointer
            - default: true
              do:
                - return: reflect.Value{}, false, nil
          "on": target.Kind()
