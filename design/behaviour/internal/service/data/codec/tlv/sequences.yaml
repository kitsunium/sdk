              to: convertValue
            - opt:
                do:
                  - return: reflect.Value{}, cerr
                when: cerr != nil
            - eval: dst.Index(i).Set(conv)
              to: dst.Index(i).Set
          key: i
          range: src
          value: e
      - return: dst, nil
  - of: projectMapToTyped
    participants:
      - id: caller
        kind: actor
      - id: projectMapToTyped
        kind: self
      - id: reflect
        kind: stdlib
      - id: target.Key
        kind: value
      - id: target.Elem
        kind: value
      - id: convertValue
        kind: internal
