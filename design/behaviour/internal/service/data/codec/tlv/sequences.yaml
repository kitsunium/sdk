              to: convertValue
            - opt:
                do:
                  - return: reflect.Value{}, vErr
                when: vErr != nil
            - eval: dst.SetMapIndex(kConv, vConv)
              to: dst.SetMapIndex
          key: _
          range: rv.MapKeys()
          value: k
      - return: dst, nil
  - of: narrowNumeric
    participants:
      - id: caller
