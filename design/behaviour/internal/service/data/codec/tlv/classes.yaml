apiVersion: design/behaviour/v1
constants:
  - doc: |-
      linearScanFieldLimit is the field-count threshold above which a
      name→index map beats a linear scan. Determined empirically: at
      16 fields the map's overhead amortises across enough lookups; below
      that, the linear scan's branch predictor wins.
    items:
      - name: linearScanFieldLimit
        type: int
        value: "16"
    name: linearScanFieldLimit
  - doc: |-
      notFoundFieldIdx is the sentinel resolveFieldIndex returns when a
      wire field name does not match any struct field. Decoders treat this
      as "skip the value" rather than an error (mirrors json's lenient
      unknown-field handling). Keeping it as a named const keeps the
      sentinel intent visible at every call site instead of relying on the
      bare -1 literal.
    items:
      - name: notFoundFieldIdx
        type: int
        value: "-1"
    name: notFoundFieldIdx
  - doc: |-
      scratchInitialCap is the starting capacity for fresh pooled scratch
      buffers. 256 bytes fits a typical small TLV record without forcing
      an immediate grow.
    items:
      - name: scratchInitialCap
        type: int
        value: "256"
    name: scratchInitialCap
  - doc: |-
      uvarintSingleByteCap is the exclusive upper bound for a single-byte
      LEB128-encoded value. Lengths < 0x80 carry no continuation bit and
      fit verbatim in one byte — the overwhelming common case for TLV
      record lengths (struct field names, small scalars, sub-record sizes).
    items:
      - name: uvarintSingleByteCap
        type: uint64
        value: "0x80"
    name: uvarintSingleByteCap
  - doc: |-
      Numeric limits — grouped at the top so const → type → var → func
      ordering rules are satisfied across the file.
    grouped: true
    items:
      - doc: |-
          maxTLVBytes caps the Unmarshal input size for untrusted payloads.
          10 MiB matches the msgpack/ndjson scanner caps and shields the
          decoder from CWE-400 memory-exhaustion pre-allocation attacks.
        name: maxTLVBytes
        type: int
        value: 10 << 20
      - doc: maxTLVDepth caps the nesting depth at 32 levels (CWE-674 defence).
        name: maxTLVDepth
        type: int
        value: "32"
      - doc: |-
          maxFieldNameBytes caps the byte length of a struct field name on
          the wire. Mirrors the LDAP/X.509-style 255-byte attribute cap.
        name: maxFieldNameBytes
        type: int
        value: "255"
      - doc: maxVarintBytes is the worst-case LEB128 length for a uint64.
        name: maxVarintBytes
        type: int
        value: "10"
      - doc: |-
          sliceHintCap clamps an attacker-declared length to a sane initial
          capacity hint so a malformed buffer cannot trigger a multi-million
          entry pre-allocation. The decode loop still grows on demand.
        name: sliceHintCap
        type: int
        value: "4096"
      - doc: width8 — 1-byte payload (int8 / uint8).
        name: width8
        type: int
        value: "1"
      - doc: width16 — 2-byte payload (int16 / uint16).
        name: width16
        type: int
        value: "2"
      - doc: width32 — 4-byte payload (int32 / uint32 / float32).
        name: width32
        type: int
        value: "4"
      - doc: width64 — 8-byte payload (int64 / uint64 / float64).
        name: width64
        type: int
        value: "8"
      - doc: minRecordBytes is the smallest legal record (tag + 1-byte length).
        name: minRecordBytes
        type: int
        value: "2"
      - doc: varintContinuationBit identifies the high bit in a LEB128 byte.
        name: varintContinuationBit
        type: byte
        value: "0x80"
      - doc: varintPayloadMask isolates the 7-bit payload of an LEB128 byte.
        name: varintPayloadMask
        type: byte
        value: "0x7f"
      - doc: varintShiftStep is the bit-shift per LEB128 byte (7 bits each).
        name: varintShiftStep
        type: uint
        value: "7"
      - doc: |-
          varintMaxLastByte is the largest legal final byte in a 10-byte
          uint64 varint (the MSB pair-of-bits cannot exceed 1).
        name: varintMaxLastByte
        type: byte
        value: "1"
      - doc: decimalBase is the base used to format diagnostic numbers.
        name: decimalBase
        type: int
        value: "10"
      - doc: |-
          recordsPerPair is the number of child TLV records a map pair or a
          struct field frames on the wire (key+value, or name+value).
        name: recordsPerPair
        type: uint64
        value: "2"
    name: maxTLVBytes
  - doc: |-
      Wire-format tag constants — assigned in stable byte ranges grouped by
      family so adding new types (e.g. 0x14 Int128) does not perturb the
      existing allocation table.
    grouped: true
    items:
      - doc: tagNil represents a typed nil; length is always zero.
        name: tagNil
        type: Tag
        value: "0x01"
      - doc: tagBoolFalse represents the boolean value false; length zero.
        name: tagBoolFalse
        type: Tag
        value: "0x02"
      - doc: tagBoolTrue represents the boolean value true; length zero.
        name: tagBoolTrue
        type: Tag
        value: "0x03"
      - doc: tagInt8 — signed 8-bit integer (1 byte big-endian).
        name: tagInt8
        type: Tag
        value: "0x10"
      - doc: tagInt16 — signed 16-bit integer (2 bytes big-endian).
        name: tagInt16
        type: Tag
        value: "0x11"
      - doc: tagInt32 — signed 32-bit integer (4 bytes big-endian).
        name: tagInt32
        type: Tag
        value: "0x12"
      - doc: tagInt64 — signed 64-bit integer (8 bytes big-endian).
        name: tagInt64
        type: Tag
        value: "0x13"
      - doc: tagUint8 — unsigned 8-bit integer (1 byte).
        name: tagUint8
        type: Tag
        value: "0x20"
      - doc: tagUint16 — unsigned 16-bit integer (2 bytes big-endian).
        name: tagUint16
        type: Tag
        value: "0x21"
      - doc: tagUint32 — unsigned 32-bit integer (4 bytes big-endian).
        name: tagUint32
        type: Tag
        value: "0x22"
      - doc: tagUint64 — unsigned 64-bit integer (8 bytes big-endian).
        name: tagUint64
        type: Tag
        value: "0x23"
      - doc: tagFloat32 — IEEE 754 single precision (4 bytes big-endian).
        name: tagFloat32
        type: Tag
        value: "0x30"
      - doc: tagFloat64 — IEEE 754 double precision (8 bytes big-endian).
        name: tagFloat64
        type: Tag
        value: "0x31"
      - doc: tagString — UTF-8 string; length = byte count of the payload.
        name: tagString
        type: Tag
        value: "0x40"
      - doc: tagBytes — opaque byte sequence; length = byte count.
        name: tagBytes
        type: Tag
        value: "0x41"
      - doc: |-
          tagSlice — heterogeneous sequence; length = element count, each
          element is itself a full TLV record.
        name: tagSlice
        type: Tag
        value: "0x50"
      - doc: |-
          tagMap — key-value pairs; length = pair count, each pair = two
          adjacent TLV records (key then value).
        name: tagMap
        type: Tag
        value: "0x60"
      - doc: |-
          tagStruct — named fields; length = field count, each field = a
          string-tag TLV holding the field name followed by a value TLV.
        name: tagStruct
        type: Tag
        value: "0x70"
    name: tagNil
