      - position
      - offsetField
    name: position.go
  - decls:
      - jsonOutsideString
      - (*jsonCodec).Sniff
      - skipJSONSpace
      - scanJSONValue
      - opensJSONValue
      - skipJSONString
      - bracketDelta
    name: sniff.go
  - decls:
      - v2Options
      - v2Codec
      - NewV2
      - (*v2Codec).Name
      - (*v2Codec).MIMETypes
      - (*v2Codec).Extensions
      - (*v2Codec).Marshal
      - (*v2Codec).Unmarshal
      - (*v2Codec).Append
      - (*v2Codec).NewEncoder
      - (*v2Codec).NewDecoder
