# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: fieldLimit names the byte ceiling a refused value exceeded.
    items:
      - name: fieldLimit
        type: string
        value: "\"limit\""
    name: fieldLimit
  - doc: The bytes the sniffer accepts at the places it checks.
    grouped: true
    items:
      - doc: |-
          jsonOutsideString is every byte JSON writes outside a string:
          whitespace, punctuation, a number's bytes, and the letters of true,
          false and null.
        name: jsonOutsideString
        type: string
        value: "\" \\t\\n\\r,:{}[]-+.eE0123456789truefalsn\""
      - doc: jsonValueStart is every byte a value, or an array's end, opens with.
        name: jsonValueStart
        type: string
        value: "`]\"{[-0123456789tfn`"
    name: jsonOutsideString
