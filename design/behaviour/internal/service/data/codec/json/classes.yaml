      - New
      - (*jsonCodec).Name
      - (*jsonCodec).MIMETypes
      - (*jsonCodec).Extensions
      - (*jsonCodec).Marshal
      - marshalRawMessage
      - (*jsonCodec).Unmarshal
      - (*jsonCodec).Append
      - appendRawMessage
      - appendRaw
