      - (*window).open
      - (*window).exceeded
      - (*jsonDecoder).Decode
      - (*jsonDecoder).decodeBounded
      - wrapDecodeErr
      - (*jsonDecoder).More
    name: decoder.go
  - decls: []
    name: doc.go
  - decls:
      - jsonEncoder
