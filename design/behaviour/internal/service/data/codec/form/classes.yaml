package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/form
  name: form
  purpose: Package form implements application/x-www-form-urlencoded as a codec.Codec — the encoding every HTML form POSTs and every query string carries.
types:
  - doc: formCodec is the concrete Codec implementation for urlencoded forms.
    kind: struct
    methods:
      - doc: Name implements codec.Codec.
        name: Name
        recv: "*formCodec"
        results: string
      - doc: MIMETypes lists every MIME alias.
        name: MIMETypes
        recv: "*formCodec"
        results: "[]string"
      - doc: Extensions lists every file extension.
        name: Extensions
        recv: "*formCodec"
        results: "[]string"
      - doc: |-
          Marshal encodes v as an application/x-www-form-urlencoded body. Keys are
          emitted in ascending lexicographic order — Go map iteration is randomised,
          so sorting is the only way the same value yields the same bytes twice.
          Values under one key keep their slice order, which is the wire order.
        name: Marshal
        params: v any
        recv: "*formCodec"
        results: encoded []byte, err error
      - doc: |-
          Append encodes v and appends the bytes onto dst. Implements the optional
          codec.Appender interface so hot-path callers (request builders, replay
          harnesses) can reuse one buffer across bodies. On failure dst is returned
          untouched, per the Appender contract.
        name: Append
        params: dst []byte, v any
        recv: "*formCodec"
        results: appended []byte, err error
      - doc: |-
          Unmarshal parses an urlencoded body into v, which must be a non-nil pointer
          to url.Values, map[string][]string, or map[string]string.
        name: Unmarshal
        params: data []byte, v any
        recv: "*formCodec"
        results: error
    name: formCodec
vars:
  - doc: |-
      The registered singleton. Its aliases are literals in MIMETypes and
      Extensions, not package tables: Register reads them through the Codec
      interface, which orders no table before this initialiser (see
      core/data/codec.Register).
    grouped: true
    items:
      - doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
        value: codec.Register(&formCodec{})
    name: Codec
