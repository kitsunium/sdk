apiVersion: design/behaviour/v1
constants:
  - doc: |-
      Package-level constants: promotion-shape parameters + the cap-discard
      threshold for the Marshal-buffer pool. Grouped per KTN-CONST-ORDER.
    grouped: true
    items:
      - doc: |-
          promotionBlockType is the Type label the facade promotion path stamps
          when wrapping a non-PEM value (matches pkg/v1/data/codec/promote.go
          pemPromotionBlockType).
        name: promotionBlockType
        value: "\"JSON\""
      - doc: |-
          promotionLineLength is the base64 line width pem.Encode uses (each
          line of base64 content within a PEM block is wrapped at this width).
        name: promotionLineLength
        type: int
        value: "64"
    name: promotionBlockType
files:
  - decls:
      - promotionBlockType
      - Codec
      - pemCodec
      - Block
      - New
      - (*pemCodec).Name
      - (*pemCodec).MIMETypes
      - (*pemCodec).Extensions
      - (*pemCodec).Marshal
      - marshalPromotionBlock
      - insertNewlinesEvery64
      - (*pemCodec).Append
      - (*pemCodec).Unmarshal
    name: codec.go
  - decls: []
    name: doc.go
functions:
  - name: New
    results: codec.Codec
  - doc: |-
      marshalPromotionBlock emits the wire bytes for a "JSON"-typed PEM
      block with no headers — the exact shape pkg/v1/data/codec/promote.go
      stamps. The output is byte-identical to pem.Encode for this shape
      (BEGIN marker, base64-encoded payload split into 64-char lines,
      END marker, trailing newline). Saves pem.Encode's intermediate
      bytes.Buffer + lineBreaker + base64.NewEncoder allocations.

      Implementation: one-shot base64.Encode into the output buffer's
      tail, then a forward walk that inserts '\n' every 64 bytes. The
      earlier per-chunk loop called base64.StdEncoding.Encode N times
      (one per 48-byte input chunk) — each call paid function-call
      overhead + reset internal state. The single-encode + insert
      approach makes one call total then memmove's lines into their
      final slots.
    name: marshalPromotionBlock
    params: payload []byte
    results: "[]byte"
  - doc: |-
      insertNewlinesEvery64 walks the base64 body region in `body` (which
      already has lineCount extra bytes reserved at the tail) and inserts
      '\n' after every promotionLineLength (= 64) base64 characters. The
      walk is backwards so earlier byte positions stay valid until they
      are moved — same shift-right idiom encoding/pem's lineBreaker uses
      internally, except in one pass without per-byte function calls.
    name: insertNewlinesEvery64
    params: body []byte, bodyLen, lineCount int
imports:
  base64: encoding/base64
  codec: github.com/kitsunium/sdk/internal/core/data/codec
  corepem: github.com/kitsunium/sdk/internal/core/data/codec/pem
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  scratch: github.com/kitsunium/sdk/internal/core/data/codec/scratch
  slices: slices
  stdpem: encoding/pem
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/pem
  name: pem
  purpose: Package pem wraps encoding/pem as a codec.Codec implementation.
types:
  - doc: pemCodec is the concrete Codec implementation for PEM.
    fields:
      - doc: |-
          extensions is the extension table this instance reports — the package
          table for the registered singleton, which is built with it.
        name: extensions
        type: "[]string"
    kind: struct
    methods:
      - doc: Name implements codec.Codec.
        name: Name
        recv: "*pemCodec"
        results: string
      - doc: MIMETypes lists every MIME alias.
        name: MIMETypes
        recv: "*pemCodec"
        results: "[]string"
      - doc: Extensions lists every file extension.
        name: Extensions
        recv: c *pemCodec
        results: "[]string"
      - doc: Marshal encodes a *pem.Block into PEM bytes.
        name: Marshal
        params: v any
        recv: "*pemCodec"
        results: encoded []byte, err error
      - doc: |-
          Append encodes a *pem.Block as PEM bytes and appends them to dst.
          Implements the optional codec.Appender interface so hot-path callers
          can stitch PEM blocks into a larger framed buffer (multi-block cert
          chain construction) without an intermediate allocation per block.
        name: Append
        params: dst []byte, v any
        recv: c *pemCodec
        results: appended []byte, err error
      - doc: Unmarshal parses the first PEM block from data into v.
        name: Unmarshal
        params: data []byte, v any
        recv: "*pemCodec"
