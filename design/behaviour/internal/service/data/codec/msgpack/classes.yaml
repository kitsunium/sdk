      - doc: codeFalse is false.
        name: codeFalse
        type: byte
        value: "0xc2"
      - doc: codeTrue is true.
        name: codeTrue
        type: byte
        value: "0xc3"
      - doc: codeBin8 is bin 8.
        name: codeBin8
        type: byte
        value: "0xc4"
      - doc: codeBin16 is bin 16.
        name: codeBin16
        type: byte
        value: "0xc5"
      - doc: codeBin32 is bin 32.
        name: codeBin32
        type: byte
        value: "0xc6"
      - doc: codeExt8 is ext 8.
        name: codeExt8
        type: byte
        value: "0xc7"
      - doc: codeFloat32 is float 32.
        name: codeFloat32
        type: byte
        value: "0xca"
      - doc: codeFloat64 is float 64.
        name: codeFloat64
        type: byte
        value: "0xcb"
      - doc: codeUint8 is uint 8.
        name: codeUint8
        type: byte
        value: "0xcc"
      - doc: codeUint16 is uint 16.
        name: codeUint16
        type: byte
        value: "0xcd"
      - doc: codeUint32 is uint 32.
        name: codeUint32
        type: byte
        value: "0xce"
      - doc: codeUint64 is uint 64.
        name: codeUint64
        type: byte
        value: "0xcf"
      - doc: codeInt8 is int 8.
        name: codeInt8
        type: byte
        value: "0xd0"
      - doc: codeInt16 is int 16.
        name: codeInt16
        type: byte
        value: "0xd1"
      - doc: codeInt32 is int 32.
