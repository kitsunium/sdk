        type: int
        value: "1000"
      - doc: |-
          preallocBytes is the most memory a DECLARED length may reserve before
          the elements behind it have been read; past it, a slice or map grows as
          elements actually arrive (CWE-1284).
        name: preallocBytes
        type: int
        value: 64 << 10
      - doc: |-
          frameChunk is the largest read the stream framer issues for one string,
          binary or extension payload, so a declared length is paid for only as
          its bytes arrive.
        name: frameChunk
        type: uint64
        value: 64 << 10
      - doc: formatBlockLen is the number of format bytes in 0xc0–0xdf.
        name: formatBlockLen
        type: int
        value: "32"
      - doc: headerTableLen is the number of possible header bytes.
        name: headerTableLen
        type: int
        value: "256"
    name: maxMsgPackBytes
  - doc: |-
      The families of the MessagePack type system, plus famInvalid for the byte
      the specification never uses.
    grouped: true
    items:
      - doc: famInvalid is 0xc1, never used.
        name: famInvalid
        type: family
        value: iota
      - doc: famNil is nil.
        name: famNil
      - doc: famBool is true or false.
        name: famBool
      - doc: "famInt is a signed integer: negative fixint, positive fixint or int 8–64."
        name: famInt
      - doc: "famUint is an unsigned integer: uint 8–64."
        name: famUint
      - doc: famFloat32 is float 32.
        name: famFloat32
      - doc: famFloat64 is float 64.
        name: famFloat64
      - doc: famStr is a UTF-8 string.
        name: famStr
      - doc: famBin is a byte array.
        name: famBin
      - doc: famArray is an array.
        name: famArray
      - doc: famMap is a map.
        name: famMap
      - doc: "famExt is an extension: a type byte and an opaque payload."
        name: famExt
    name: famInvalid
