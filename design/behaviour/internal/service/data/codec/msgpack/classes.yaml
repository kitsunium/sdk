      selfTarget returns the address of v as T, the interface a self-decoding
      type implements through its pointer.
    name: selfTarget
    params: v reflect.Value
    results: T, error
    typeParams: T any
  - doc: |-
      decodeSelfMsgpack hands UnmarshalMsgpack a copy of the next value's bytes;
      nil zeroes the target without calling it.
    name: decodeSelfMsgpack
    params: d *decodeState, v reflect.Value
    results: error
  - doc: callUnmarshalMsgpack hands raw to the method, wrapping its failure.
    name: callUnmarshalMsgpack
