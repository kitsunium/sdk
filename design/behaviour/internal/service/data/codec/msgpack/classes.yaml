        results: "[]string"
      - doc: |-
          Marshal serialises v as MessagePack bytes. The value is encoded into a
          pooled scratch buffer and the result is one exact-size copy, so a call
          costs one allocation plus whatever v's own marshal methods allocate.
        name: Marshal
        params: v any
        recv: "*msgpackCodec"
        results: encoded []byte, err error
      - doc: |-
          Unmarshal parses data — exactly one MessagePack value, at most
          maxMsgPackBytes long — into the value v points at.
        name: Unmarshal
        params: data []byte, v any
        recv: "*msgpackCodec"
        results: error
      - doc: |-
          Append encodes v as MessagePack and appends the bytes to dst, encoding
          straight onto it: no intermediate buffer and no copy. On failure dst is
          returned with its original length.
        name: Append
        params: dst []byte, v any
        recv: "*msgpackCodec"
        results: appended []byte, err error
      - doc: |-
          NewEncoder wraps w in a streaming codec.Encoder: each Encode writes one
          complete value with a single Write, and a value that fails to encode writes
          nothing.
        name: NewEncoder
        params: w io.Writer
        recv: "*msgpackCodec"
        results: codec.Encoder
      - doc: |-
          NewDecoder wraps r in a streaming codec.Decoder. The whole stream is held to
          one byte past maxMsgPackBytes — the bound Unmarshal enforces on one input —
          and a declared length beyond what the stream can still deliver is refused
          before anything is read or reserved for it (CWE-400 / CWE-1284).
        name: NewDecoder
        params: r io.Reader
        recv: "*msgpackCodec"
        results: codec.Decoder
    name: msgpackCodec
  - doc: decodeState is the cursor over one input.
    fields:
      - doc: data is the whole input.
        name: data
        type: "[]byte"
      - doc: off is the next unread byte.
        name: "off"
        type: int
      - doc: depth counts the containers currently open.
        name: depth
        type: int
    kind: struct
    methods:
      - doc: truncated is the failure for an input that ends inside a value.
        name: truncated
        recv: d *decodeState
        results: error
      - doc: remaining is how many bytes are left to read.
        name: remaining
        recv: d *decodeState
        results: uint64
      - doc: |-
          readHeader reads one header: the format byte and, when the family has one,
          its length or value field (and an extension's type byte).
        name: readHeader
        recv: d *decodeState
        results: header, error
      - doc: readField reads a big-endian field of width bytes.
        name: readField
        params: width uint8
        recv: d *decodeState
        results: uint64, error
      - doc: readExtType completes an extension header with its type byte.
        name: readExtType
        params: h header
        recv: d *decodeState
        results: header, error
      - doc: |-
          take returns the next n bytes, refusing a length the input cannot satisfy.
          The slice aliases the input; a caller that keeps it copies it.
        name: take
        params: n uint64
        recv: d *decodeState
        results: "[]byte, error"
      - doc: |-
          checkCount refuses an array or map count the remaining input cannot hold,
          before anything is allocated for it: an element needs at least one byte, a
          map pair at least two.
        name: checkCount
        params: h header
        recv: d *decodeState
        results: error
      - doc: enter opens one container level, refusing input nested past maxDepth.
        name: enter
        recv: d *decodeState
        results: error
      - doc: leave closes one container level.
        name: leave
        recv: d *decodeState
      - doc: peekNil reports whether the next value is nil, without consuming it.
        name: peekNil
        recv: d *decodeState
        results: bool
      - doc: |-
          skip consumes one complete value without materialising it. It is
          iterative — a count of values still owed, not recursion — so even the
          deepest input costs no stack, and every count is checked against what
          remains so the tally stays bounded by the input's length.
        name: skip
        recv: d *decodeState
        results: error
      - doc: |-
          skipBody steps over what follows a header and returns the updated count of
          values still owed.
        name: skipBody
        params: h header, owed uint64
        recv: d *decodeState
        results: uint64, error
      - doc: decodeAny reads one value into the Go type an empty interface receives.
        name: decodeAny
        recv: d *decodeState
        results: any, error
      - doc: decodePayloadAny reads a str, bin or ext payload into its untyped Go value.
        name: decodePayloadAny
        params: h header
        recv: d *decodeState
        results: any, error
      - doc: decodeArrayAny reads an array into a []any.
        name: decodeArrayAny
        params: h header
        recv: d *decodeState
        results: any, error
      - doc: decodeMapAny reads a map into a map[string]any.
        name: decodeMapAny
        params: h header
        recv: d *decodeState
        results: any, error
      - doc: fillMapAny reads n string-keyed pairs into m.
        name: fillMapAny
        params: m map[string]any, n uint64
        recv: d *decodeState
        results: error
      - doc: readKeyString reads a map key that must be a string, as a Go string.
        name: readKeyString
        recv: d *decodeState
        results: string, error
      - doc: |-
          readKey reads a map key that must be a string: a str or a bin, or nil for
          the empty string, as the vendor-backed codec accepted. The slice aliases
          the input.
        name: readKey
        recv: d *decodeState
        results: "[]byte, error"
      - doc: decodeTarget decodes the next value into what the pointer v points at.
        name: decodeTarget
        params: v any
        recv: d *decodeState
        results: error
      - doc: |-
          selfPayload reads the payload a Binary/TextUnmarshaler receives: a copy of
          a bin or str. For nil it zeroes v and reports isNil.
        name: selfPayload
        params: v reflect.Value
        recv: d *decodeState
        results: payload []byte, isNil bool, err error
      - doc: mismatch is the failure for a value of the wrong family for the target.
        name: mismatch
        params: h header, t reflect.Type
        recv: d *decodeState
        results: error
      - doc: |-
          rangeOrMismatch is the failure for a number that does not fit (numeric is
          set) or a value that is not a number of an acceptable family.
        name: rangeOrMismatch
        params: h header, t reflect.Type, numeric bool
        recv: d *decodeState
        results: error
      - doc: |-
          readBytesOrNil reads a str or bin payload, or nil as no bytes; any other
          family is a mismatch for target type t. The slice aliases the input.
        name: readBytesOrNil
        params: t reflect.Type
        recv: d *decodeState
        results: "[]byte, error"
      - doc: timeOf reads the time a header announces.
        name: timeOf
        params: h header, t reflect.Type
        recv: d *decodeState
        results: time.Time, error
      - doc: |-
          timestampPayload reads the payload of an extension that must be the
          timestamp.
        name: timestampPayload
        params: h header
        recv: d *decodeState
        results: time.Time, error
      - doc: timeFromText parses an RFC 3339 string as a UTC time.
        name: timeFromText
        params: h header
        recv: d *decodeState
        results: time.Time, error
    name: decodeState
  - doc: mapDecoder decodes a map pair by pair, through reflection.
    fields:
      - doc: typ is the map type.
        name: typ
        type: reflect.Type
      - doc: keyType is the key type.
        name: keyType
        type: reflect.Type
      - doc: elemType is the element type.
        name: elemType
        type: reflect.Type
      - doc: key decodes one key.
        name: key
        type: decodeFunc
      - doc: elem decodes one element.
        name: elem
        type: decodeFunc
      - doc: checkHashable is set when a decoded key may be unhashable.
        name: checkHashable
        type: bool
    kind: struct
    methods:
      - doc: decode decodes a map into a map, or nil into a nil map.
        name: decode
        params: d *decodeState, v reflect.Value
        recv: m *mapDecoder
        results: error
      - doc: fill adds h's pairs to the map v, creating it when nil.
        name: fill
        params: d *decodeState, v reflect.Value, h header
        recv: m *mapDecoder
        results: error
      - doc: pair decodes one key and value into the scratch values and stores them.
        name: pair
        params: d *decodeState, v, key, val reflect.Value
        recv: m *mapDecoder
        results: error
    name: mapDecoder
  - doc: decodeFunc decodes the next value of d into v, which is settable.
    kind: named
    name: decodeFunc
    underlying: func(d *decodeState, v reflect.Value) error
  - doc: |-
      unmarshalMsgpacker is the method a type implements to read its own
      MessagePack. It receives a copy of exactly one value's bytes.
    kind: named
    name: unmarshalMsgpacker
    underlying: |-
      interface {
      	// UnmarshalMsgpack decodes the value's MessagePack encoding.
      	UnmarshalMsgpack(data []byte) error
      }
  - doc: listDecoder decodes a slice or an array element by element.
    fields:
      - doc: elem decodes one element.
        name: elem
        type: decodeFunc
      - doc: firstCap is how many elements a declared count may reserve up front.
        name: firstCap
        type: uint64
    kind: struct
    methods:
      - doc: decodeSlice decodes an array into a slice, or nil into a nil slice.
        name: decodeSlice
        params: d *decodeState, v reflect.Value
        recv: l *listDecoder
        results: error
      - doc: fillSlice replaces v's elements with the array's.
        name: fillSlice
        params: d *decodeState, v reflect.Value, h header
        recv: l *listDecoder
        results: error
      - doc: |-
          decodeArray decodes an array into a Go array of at least as many elements,
          zeroing the ones the input does not reach; nil zeroes the whole array.
        name: decodeArray
        params: d *decodeState, v reflect.Value
        recv: l *listDecoder
        results: error
      - doc: fillArray decodes h's elements into the Go array v.
        name: fillArray
        params: d *decodeState, v reflect.Value, h header
        recv: l *listDecoder
        results: error
    name: listDecoder
  - doc: |-
      decodedError is what a string decodes to when the target is the error
      interface: the message, and nothing else.
    fields:
      - doc: msg is the decoded text.
        name: msg
        type: string
    kind: struct
    methods:
      - doc: Error implements error.
        name: Error
        recv: e *decodedError
        results: string
    name: decodedError
  - doc: fieldDecoder is one struct key with its decoder.
    fields:
      - doc: field is the layout entry.
        name: field
        type: "*structField"
      - doc: dec decodes the field's value.
        name: dec
        type: decodeFunc
    kind: struct
    methods:
      - doc: decodeInto decodes the next value into this field of struct v.
        name: decodeInto
        params: d *decodeState, v reflect.Value
        recv: f *fieldDecoder
        results: error
    name: fieldDecoder
  - doc: structDecoder decodes a struct from a map or an array.
    fields:
      - doc: byName finds the field a key addresses, aliases included.
        name: byName
        type: map[string]*fieldDecoder
      - doc: fields are the struct's keys in encode order, for the array form.
        name: fields
        type: "[]*fieldDecoder"
    kind: struct
    methods:
      - doc: decode decodes a map, an array or nil into the struct v.
        name: decode
        params: d *decodeState, v reflect.Value
        recv: s *structDecoder
        results: error
      - doc: |-
          decodeMap decodes the map form: each key finds its field, unknown keys are
          stepped over.
        name: decodeMap
        params: d *decodeState, v reflect.Value, h header
        recv: s *structDecoder
        results: error
      - doc: decodePair decodes one key and the value of the field it names.
        name: decodePair
        params: d *decodeState, v reflect.Value
        recv: s *structDecoder
        results: error
      - doc: |-
          decodeArray decodes the array form: one element per field, in order. An
          empty array is the zero struct; any other count must match the fields.
        name: decodeArray
        params: d *decodeState, v reflect.Value, h header
        recv: s *structDecoder
        results: error
      - doc: |-
          zero sets the struct v to its zero value — field by field when v itself
          may not be set, which only a struct reached through an unexported
          embedding is.
        name: zero
        params: v reflect.Value
        recv: s *structDecoder
        results: error
    name: structDecoder
  - doc: msgpackDecoder reads one MessagePack value per Decode from a stream.
    fields:
      - doc: |-
          src is the stream, limited to one byte past maxMsgPackBytes in all;
          nil when the decoder was built over a nil reader.
        name: src
        type: "*io.LimitedReader"
      - doc: r buffers src.
        name: r
        type: "*bufio.Reader"
      - doc: err is the failure that ended the stream; nil once it ended cleanly.
        name: err
        type: error
      - doc: done latches once the stream has ended, cleanly or not.
        name: done
        type: bool
    kind: struct
    methods:
      - doc: |-
          Decode reads the next value into the value v points at. It returns io.EOF,
          untouched, once the stream ends cleanly between two values.
        name: Decode
        params: v any
        recv: d *msgpackDecoder
        results: error
      - doc: |-
          decodeNext decodes the next value in place when the read-ahead already
          holds all of it — the common case for a stream of documents smaller than
          the read-ahead — and frames it into a scratch buffer otherwise. Both paths
          decode exactly as Unmarshal does, and a value the fast path cannot vouch
          for (incomplete, or malformed) takes the framed path, which says why.
        name: decodeNext
        params: v any
        recv: d *msgpackDecoder
        results: error
      - doc: |-
          bufferedValue returns the next value when the read-ahead holds all of it.
          The slice aliases the read-ahead and is valid until the next read.
        name: bufferedValue
        recv: d *msgpackDecoder
        results: "[]byte, bool"
      - doc: |-
          decodeBuffered decodes a value lying in the read-ahead, then consumes it.
          The decode copies everything it keeps, so the read-ahead may be reused.
        name: decodeBuffered
        params: frame []byte, v any
        recv: d *msgpackDecoder
        results: error
      - doc: decodeFramed reads one value into a pooled scratch buffer and decodes it.
        name: decodeFramed
        params: v any
        recv: d *msgpackDecoder
        results: error
      - doc: More reports whether the stream has not ended yet.
        name: More
        recv: d *msgpackDecoder
        results: bool
      - doc: finish latches the end of the stream; io.EOF is a clean end.
        name: finish
        params: err error
        recv: d *msgpackDecoder
      - doc: ending is what Decode returns once the stream has ended.
        name: ending
        recv: d *msgpackDecoder
        results: error
    name: msgpackDecoder
  - doc: framer reads the bytes of exactly one value.
    fields:
      - doc: src reports how much of the stream's bound is left.
        name: src
        type: "*io.LimitedReader"
      - doc: r is the buffered stream.
        name: r
        type: "*bufio.Reader"
      - doc: out accumulates the value's bytes.
        name: out
        type: "[]byte"
    kind: struct
    methods:
      - doc: |-
          run frames one value: it owes one value, and each header read either
          settles what it owes (a scalar, a payload copied whole) or adds the
          elements of an array or map to the count.
        name: run
        recv: f *framer
        results: error
      - doc: |-
          body copies what follows a header and returns the updated count of values
          still owed.
        name: body
        params: info *headerInfo, owed uint64
        recv: f *framer
        results: uint64, error
      - doc: |-
          owe adds n values to the count, refusing more than the stream could still
          deliver one byte each. owed still counts the container being read, whose
          header is already consumed, hence the −1.
        name: owe
        params: owed, n uint64
        recv: f *framer
        results: uint64, error
      - doc: budget is how many bytes the stream can still deliver under its bound.
        name: budget
        recv: f *framer
        results: uint64
      - doc: copyField copies a big-endian field of width bytes and returns its value.
        name: copyField
        params: width uint8
        recv: f *framer
        results: uint64, error
      - doc: |-
          copyPayload copies n payload bytes, refusing a length the stream cannot
          deliver before reading or reserving anything for it.
        name: copyPayload
        params: n uint64
        recv: f *framer
        results: error
      - doc: read appends exactly n bytes from the stream to out.
        name: read
        params: n uint64
        recv: f *framer
        results: error
      - doc: |-
          readBuffered appends n bytes the read-ahead is known to hold — the common
          case for the headers and short payloads of a document — without the read
          loop io.ReadFull runs.
        name: readBuffered
        params: n int
        recv: f *framer
        results: error
      - doc: |-
          readFailure classifies a read error: io.EOF before a value's first byte is
          the clean end of the stream; an end anywhere else is a truncated value; any
          other error is the reader's, wrapped.
        name: readFailure
        params: err error, atStart bool
        recv: f *framer
        results: error
    name: framer
  - doc: |-
      lengthForms lists, for one length-prefixed family, the header byte of each
      width and the largest length its fix form holds.
    fields:
      - doc: fixMax is the largest length the fix form holds, or noFixForm.
        name: fixMax
        type: int
      - doc: fixPrefix is the fix form's prefix, ORed with the length.
        name: fixPrefix
        type: byte
      - doc: code8 is the 8-bit-length form, or 0 when the family has none.
        name: code8
        type: byte
      - doc: code16 is the 16-bit-length form.
        name: code16
        type: byte
      - doc: code32 is the 32-bit-length form.
        name: code32
        type: byte
    kind: struct
    name: lengthForms
  - doc: |-
      encodeFunc appends the encoding of v to b. depth counts the levels already
      entered; a container, a pointer or an interface checks it before going one
      deeper.
    kind: named
    name: encodeFunc
    underlying: func(b []byte, v reflect.Value, depth int) ([]byte, error)
  - doc: emptyFunc reports whether a field value counts as empty for omitempty.
    kind: named
    name: emptyFunc
    underlying: func(v reflect.Value) bool
  - doc: |-
      marshalMsgpacker is the method a type implements to write its own
      MessagePack. The returned bytes must be exactly one well-formed value; they
      are checked before they are written.
    kind: named
    name: marshalMsgpacker
    underlying: |-
      interface {
      	// MarshalMsgpack returns the value's MessagePack encoding.
      	MarshalMsgpack() ([]byte, error)
      }
  - doc: isZeroer is the method omitempty consults first, as time.Time implements.
    kind: named
    name: isZeroer
    underlying: |-
      interface {
      	// IsZero reports whether the value is its type's zero.
      	IsZero() bool
      }
  - doc: listEncoder encodes a slice or an array element by element.
    fields:
      - doc: elem encodes one element.
        name: elem
        type: encodeFunc
    kind: struct
    methods:
      - doc: encodeSlice writes a slice as an array, a nil one as nil.
        name: encodeSlice
        params: b []byte, v reflect.Value, depth int
        recv: l *listEncoder
        results: "[]byte, error"
      - doc: encodeList writes the elements of a slice or array as an array.
        name: encodeList
        params: b []byte, v reflect.Value, depth int
        recv: l *listEncoder
        results: "[]byte, error"
    name: listEncoder
  - doc: mapEncoder encodes a map pair by pair, through reflection.
    fields:
      - doc: keyType is the map's key type.
        name: keyType
        type: reflect.Type
      - doc: elemType is the map's element type.
        name: elemType
        type: reflect.Type
      - doc: key encodes one key.
        name: key
        type: encodeFunc
      - doc: elem encodes one element.
        name: elem
        type: encodeFunc
    kind: struct
    methods:
      - doc: encode writes any map through reflection.
        name: encode
        params: b []byte, v reflect.Value, depth int
        recv: m *mapEncoder
        results: "[]byte, error"
      - doc: |-
          encodePairsInPlace writes every pair through two values reused for the whole
          map, so a pair costs no allocation.
        name: encodePairsInPlace
        params: b []byte, iter *reflect.MapIter, depth int
        recv: m *mapEncoder
        results: "[]byte, error"
      - doc: encodePairsCopied writes every pair from the iterator's own copies.
        name: encodePairsCopied
        params: b []byte, iter *reflect.MapIter, depth int
        recv: m *mapEncoder
        results: "[]byte, error"
      - doc: encodePair writes one key and its value.
        name: encodePair
        params: b []byte, key, val reflect.Value, depth int
        recv: m *mapEncoder
        results: "[]byte, error"
    name: mapEncoder
  - doc: fieldEncoder is one struct field with its encoder.
    fields:
      - doc: field is the layout entry.
        name: field
        type: "*structField"
      - doc: enc encodes the field's value.
        name: enc
        type: encodeFunc
      - doc: empty decides omitempty.
        name: empty
        type: emptyFunc
    kind: struct
    methods:
      - doc: |-
          omitted reports whether the field is left out of struct value v: when it is
          empty under omitempty, or when it sits behind a nil embedded pointer.
        name: omitted
        params: v reflect.Value
        recv: f *fieldEncoder
        results: bool
      - doc: encodeValue writes the field's value from struct value v.
        name: encodeValue
        params: b []byte, v reflect.Value, depth int
        recv: f *fieldEncoder
        results: "[]byte, error"
    name: fieldEncoder
  - doc: structEncoder encodes a struct as a map, or as an array with as_array.
    fields:
      - doc: fields are the struct's keys in encode order.
        name: fields
        type: "[]fieldEncoder"
      - doc: asArray writes an array of every field instead of a map.
        name: asArray
        type: bool
      - doc: hasOmitEmpty takes the counting path that leaves empty fields out.
        name: hasOmitEmpty
        type: bool
    kind: struct
    methods:
      - doc: encode writes the struct as a map, or as an array with as_array.
        name: encode
        params: b []byte, v reflect.Value, depth int
        recv: s *structEncoder
        results: "[]byte, error"
      - doc: encodeArray writes every field, in order, as an array.
        name: encodeArray
        params: b []byte, v reflect.Value, depth int
        recv: s *structEncoder
        results: "[]byte, error"
      - doc: encodeMap writes the fields that are not left out, as a map.
        name: encodeMap
        params: b []byte, v reflect.Value, depth int
        recv: s *structEncoder
        results: "[]byte, error"
      - doc: keptCount counts the fields omitempty does not leave out.
        name: keptCount
        params: v reflect.Value
        recv: s *structEncoder
        results: int
    name: structEncoder
  - doc: msgpackEncoder writes one MessagePack value per Encode to w.
    fields:
      - doc: w receives each encoded value in one Write.
        name: w
        type: io.Writer
    kind: struct
    methods:
      - doc: Encode serialises v and writes it to the wrapped writer.
        name: Encode
        params: v any
        recv: e *msgpackEncoder
        results: error
      - doc: write hands one complete value to the writer.
        name: write
        params: b []byte
        recv: e *msgpackEncoder
        results: error
      - doc: |-
          Close is a no-op: the encoder owns neither the writer nor a buffer between
          calls.
        name: Close
        recv: "*msgpackEncoder"
        results: error
    name: msgpackEncoder
  - doc: structField is one key of a struct's map form.
    fields:
      - doc: typ is the field's Go type.
        name: typ
        type: reflect.Type
      - doc: name is the key.
        name: name
        type: string
      - doc: wireName is the key already encoded as a str, appended as-is.
        name: wireName
        type: "[]byte"
      - doc: index is the path from the outer struct through any inlined embeddings.
        name: index
        type: "[]int"
      - doc: omitEmpty leaves the field out when it is empty.
        name: omitEmpty
        type: bool
    kind: struct
    name: structField
  - doc: structLayout is the cached map form of one struct type.
    fields:
      - doc: |-
          dupName is a key two fields claim — a defect of the type itself,
          reported by every encode and decode of it — or "".
        name: dupName
        type: string
      - doc: byName finds the field a decoded key addresses, aliases included.
        name: byName
        type: map[string]*structField
      - doc: fields are the keys in encode order.
        name: fields
        type: "[]*structField"
      - doc: asArray encodes the struct as an array.
        name: asArray
        type: bool
      - doc: hasOmitEmpty is set when any field may be left out.
        name: hasOmitEmpty
        type: bool
    kind: struct
    methods:
      - doc: |-
          defect returns the type's defect as an encode or a decode failure, or nil
          when the type has none.
        name: defect
        params: t reflect.Type, encode bool
        recv: l *structLayout
        results: error
    name: structLayout
  - doc: tagSpec is a parsed struct tag.
    fields:
      - doc: opts are the options after the name; a bare option maps to "".
        name: opts
        type: map[string]string
      - doc: name is the key, or "" for the Go field name.
        name: name
        type: string
    kind: struct
    methods:
      - doc: setOption records one option, bare or key:value.
        name: setOption
        params: opt string
        recv: s *tagSpec
      - doc: has reports whether the option is present.
        name: has
        params: opt string
        recv: s *tagSpec
        results: bool
    name: tagSpec
  - doc: layoutBuilder accumulates one struct's layout.
    fields:
      - doc: layout is the result being built.
        name: layout
        type: "*structLayout"
      - doc: |-
          visiting holds the struct types on the current embedding path, so a
          type that embeds itself through a pointer is not inlined forever.
        name: visiting
        type: map[reflect.Type]bool
      - doc: omitAll is set once a _msgpack marker carried omitempty.
        name: omitAll
        type: bool
    kind: struct
    methods:
      - doc: addField places one declared field into the layout.
        name: addField
        params: f reflect.StructField
        recv: b *layoutBuilder
      - doc: applyMarker reads the struct-wide options of a _msgpack field.
        name: applyMarker
        params: tag tagSpec
        recv: b *layoutBuilder
      - doc: |-
          inline places an embedded struct's fields in the layout when the rules
          allow it, and reports whether it did. forced is the inline option: it
          inlines whatever collides and drops the colliding names; otherwise one
          collision keeps the embedded struct as a single field.
        name: inline
        params: field *structField, forced bool
        recv: b *layoutBuilder
        results: bool
      - doc: collides reports whether any of sub's keys is already taken.
        name: collides
        params: sub *structLayout
        recv: b *layoutBuilder
        results: bool
      - doc: add appends a field to the encode order and the decode index.
        name: add
        params: field *structField
        recv: b *layoutBuilder
      - doc: alias makes name decode into field, unless a real field already owns it.
        name: alias
        params: name string, field *structField
        recv: b *layoutBuilder
      - doc: fail records the type's first defect.
        name: fail
        params: name string
        recv: b *layoutBuilder
    name: layoutBuilder
  - doc: family is what a header byte announces.
    kind: named
    methods:
      - doc: String names the family for a failure's fields.
        name: String
        recv: f family
        results: string
    name: family
    underlying: uint8
  - doc: headerInfo describes one header byte.
    fields:
      - doc: |-
          inline is what the byte itself carries: a fixint's value (two's
          complement), a fix form's count or length, or a fixext's payload size.
        name: inline
        type: uint64
      - doc: fam is the family the byte announces.
        name: fam
        type: family
      - doc: |-
          width is the size of the length or value field after the byte; zero
          when the byte carries everything itself.
        name: width
        type: uint8
    kind: struct
    name: headerInfo
  - doc: |-
      header is one decoded header: the family, and the value or length it
      carries.
    fields:
      - doc: |-
          arg is a number's raw value (an int's two's complement, a float's
          bits), or the length of a str, bin or ext payload, or the element count
          of an array or map.
        name: arg
        type: uint64
      - doc: fam is the family the header announced.
        name: fam
        type: family
      - doc: |-
          width is the size of the field the value was read from — zero for a
          fix form — which tells an untyped decode which Go width to produce.
        name: width
        type: uint8
      - doc: ext is an extension's type; meaningful only when fam is famExt.
        name: ext
        type: int8
    kind: struct
    name: header
vars:
  - doc: |-
      Package-level state: the codec singleton plus the hoisted MIME / extension
      tables.
    grouped: true
    items:
      - doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
        value: codec.Register(&msgpackCodec{})
    name: Codec
  - doc: Compile-time conformance.
    grouped: true
    items:
      - doc: the codec is a StreamingCodec and an Appender.
        name: _
        type: codec.StreamingCodec
        value: (*msgpackCodec)(nil)
      - doc: the codec appends onto a caller's buffer.
        name: _
        type: codec.Appender
        value: (*msgpackCodec)(nil)
      - doc: the streaming encoder.
        name: _
        type: codec.Encoder
        value: (*msgpackEncoder)(nil)
      - doc: the streaming decoder.
        name: _
        type: codec.Decoder
        value: (*msgpackDecoder)(nil)
      - doc: what a string decodes to in an error-typed target.
        name: _
        type: error
        value: (*decodedError)(nil)
      - doc: "time.Time is the IsZero type omitempty meets most: a zero time is left out."
        name: _
        type: isZeroer
        value: time.Time{}
    name: _
  - doc: pointerToAnyType is *any, the target of an untyped Unmarshal.
    items:
      - name: pointerToAnyType
        value: reflect.TypeFor[*any]()
    name: pointerToAnyType
  - doc: Plan cache and the interfaces the builders look for.
    grouped: true
    items:
      - doc: decoders caches decodeFunc per reflect.Type.
        name: decoders
        type: sync.Map
      - doc: unmarshalMsgpackerType is the UnmarshalMsgpack method.
        name: unmarshalMsgpackerType
        value: reflect.TypeFor[unmarshalMsgpacker]()
      - doc: binaryUnmarshalerType is encoding.BinaryUnmarshaler.
        name: binaryUnmarshalerType
        value: reflect.TypeFor[encoding.BinaryUnmarshaler]()
      - doc: textUnmarshalerType is encoding.TextUnmarshaler.
        name: textUnmarshalerType
        value: reflect.TypeFor[encoding.TextUnmarshaler]()
      - doc: |-
          stringType, float64Type and boolType name the targets of the direct
          map decoders in their failures.
        name: stringType
        value: reflect.TypeFor[string]()
      - doc: float64Type is float64.
        name: float64Type
        value: reflect.TypeFor[float64]()
      - doc: boolType is bool.
        name: boolType
        value: reflect.TypeFor[bool]()
    name: decoders
  - doc: The four length-prefixed families.
    grouped: true
    items:
      - doc: "strForms are the forms of str: fixstr, str 8, str 16, str 32."
        name: strForms
        value: "lengthForms{fixMax: fixstrMax, fixPrefix: fixstrPrefix, code8: codeStr8, code16: codeStr16, code32: codeStr32}"
      - doc: "binForms are the forms of bin: bin 8, bin 16, bin 32."
        name: binForms
        value: "lengthForms{fixMax: noFixForm, code8: codeBin8, code16: codeBin16, code32: codeBin32}"
      - doc: "arrayForms are the forms of array: fixarray, array 16, array 32."
        name: arrayForms
        value: "lengthForms{fixMax: fixCountMax, fixPrefix: fixarrayPrefix, code16: codeArray16, code32: codeArray32}"
      - doc: "mapForms are the forms of map: fixmap, map 16, map 32."
        name: mapForms
        value: "lengthForms{fixMax: fixCountMax, fixPrefix: fixmapPrefix, code16: codeMap16, code32: codeMap32}"
    name: strForms
  - doc: Plan cache and the types the builders compare against.
    grouped: true
    items:
      - doc: encoders caches encodeFunc per reflect.Type.
        name: encoders
        type: sync.Map
      - doc: timeType is time.Time, encoded as the timestamp extension.
        name: timeType
        value: reflect.TypeFor[time.Time]()
      - doc: errorType is the error interface, encoded as its message.
        name: errorType
        value: reflect.TypeFor[error]()
      - doc: isZeroerType is the IsZero method omitempty consults.
        name: isZeroerType
        value: reflect.TypeFor[isZeroer]()
      - doc: marshalMsgpackerType is the MarshalMsgpack method.
        name: marshalMsgpackerType
        value: reflect.TypeFor[marshalMsgpacker]()
      - doc: binaryMarshalerType is encoding.BinaryMarshaler.
        name: binaryMarshalerType
        value: reflect.TypeFor[encoding.BinaryMarshaler]()
      - doc: textMarshalerType is encoding.TextMarshaler.
        name: textMarshalerType
        value: reflect.TypeFor[encoding.TextMarshaler]()
    name: encoders
  - doc: familyNames is what a failure calls each family.
    items:
      - name: familyNames
        value: |-
          [...]string{
          	famInvalid: "never-used byte 0xc1",
          	famNil:     "nil",
          	famBool:    "boolean",
          	famInt:     "integer",
          	famUint:    "unsigned integer",
          	famFloat32: "float 32",
          	famFloat64: "float 64",
          	famStr:     "string",
          	famBin:     "binary",
          	famArray:   "array",
          	famMap:     "map",
          	famExt:     "extension",
          }
    name: familyNames
  - doc: Interfaces whose presence makes a type encode or decode itself.
    grouped: true
    items:
      - doc: layouts caches *structLayout per struct type.
        name: layouts
        type: sync.Map
      - doc: |-
          customCodecTypes are the interfaces that make a struct its own codec,
          and so not a candidate for inlining.
        name: customCodecTypes
        value: |-
          []reflect.Type{
          		reflect.TypeFor[marshalMsgpacker](),
          		reflect.TypeFor[unmarshalMsgpacker](),
          		reflect.TypeFor[encoding.BinaryMarshaler](),
          		reflect.TypeFor[encoding.BinaryUnmarshaler](),
          		reflect.TypeFor[encoding.TextMarshaler](),
          		reflect.TypeFor[encoding.TextUnmarshaler](),
          	}
    name: layouts
  - doc: Package-level lookup tables, built once at initialisation.
    grouped: true
    items:
      - doc: formatBlock describes 0xc0–0xdf, indexed by byte − codeNil.
        name: formatBlock
        value: |-
          [formatBlockLen]headerInfo{
          		{fam: famNil},
          		{fam: famInvalid},
          		{fam: famBool},
          		{fam: famBool, inline: 1},
          		{fam: famBin, width: width8},
          		{fam: famBin, width: width16},
          		{fam: famBin, width: width32},
          		{fam: famExt, width: width8},
          		{fam: famExt, width: width16},
          		{fam: famExt, width: width32},
          		{fam: famFloat32, width: width32},
          		{fam: famFloat64, width: width64},
          		{fam: famUint, width: width8},
          		{fam: famUint, width: width16},
          		{fam: famUint, width: width32},
          		{fam: famUint, width: width64},
          		{fam: famInt, width: width8},
          		{fam: famInt, width: width16},
          		{fam: famInt, width: width32},
          		{fam: famInt, width: width64},
          		{fam: famExt, inline: uint64(width8)},
          		{fam: famExt, inline: uint64(width16)},
          		{fam: famExt, inline: uint64(width32)},
          		{fam: famExt, inline: uint64(width64)},
          		{fam: famExt, inline: fixext16Size},
          		{fam: famStr, width: width8},
          		{fam: famStr, width: width16},
          		{fam: famStr, width: width32},
          		{fam: famArray, width: width16},
          		{fam: famArray, width: width32},
          		{fam: famMap, width: width16},
          		{fam: famMap, width: width32},
          	}
      - doc: headerTable describes every possible header byte.
        name: headerTable
        value: buildHeaderTable()
    name: formatBlock
