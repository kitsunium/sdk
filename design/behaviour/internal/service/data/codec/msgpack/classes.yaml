      - doc: negFixintMin is the first negative fixint, 111xxxxx.
        name: negFixintMin
        type: byte
        value: "0xe0"
      - doc: fixCountMask extracts a fixmap's or fixarray's element count.
        name: fixCountMask
        type: byte
        value: "0x0f"
      - doc: fixstrLenMask extracts a fixstr's byte length.
        name: fixstrLenMask
        type: byte
        value: "0x1f"
      - doc: fixCountMax is the largest count a fixmap or fixarray can carry.
        name: fixCountMax
        type: int
        value: "15"
      - doc: fixstrMax is the largest byte length a fixstr can carry.
        name: fixstrMax
        type: int
        value: "31"
      - doc: noFixForm marks a family (bin) that has no fix form at all.
        name: noFixForm
        type: int
        value: "-1"
      - doc: negFixintFloor is the smallest value a negative fixint can carry.
        name: negFixintFloor
        type: int64
        value: "-32"
