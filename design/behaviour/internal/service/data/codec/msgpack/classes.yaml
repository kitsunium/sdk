functions:
  - name: New
    results: codec.Codec
  - doc: |-
      retain hands b's backing array to buf, so a buffer that grew while encoding
      returns to the pool at its new size — scratch discards it past
      MaxRetainedBufBytes.
    name: retain
    params: buf *bytes.Buffer, b []byte
  - doc: beUint reads a big-endian unsigned field of 1, 2, 4 or 8 bytes.
    name: beUint
    params: p []byte
    results: uint64
  - doc: |-
      widen turns a field's raw bits into the header's argument: a signed field is
      sign-extended to 64 bits, every other field is already its value.
    name: widen
    params: raw uint64, info *headerInfo
    results: uint64
  - doc: |-
      valueExtent reports the length of the first value in p when p holds all of
      it, and false when p ends inside it or the value is malformed. It allocates
      nothing and decides nothing about a failure — a caller that needs the
      reason decodes or frames the bytes, which give it.
    name: valueExtent
    params: p []byte
    results: int, bool
  - doc: |-
      extentStep steps over the header at off and its payload, adding a
      container's elements to what is owed.
    name: extentStep
    params: p []byte, off int, owed uint64
    results: next int, stillOwed uint64, ok bool
  - doc: |-
      extentBody steps over a payload, or owes a container's elements; every
      length and count is checked against the bytes that remain.
    name: extentBody
    params: p []byte, off int, owed uint64, fam family, arg uint64
    results: next int, stillOwed uint64, ok bool
  - doc: scalarAny converts a scalar header into the Go value an interface receives.
    name: scalarAny
    params: h header
    results: any
  - doc: |-
      signedAny returns n as the signed Go type of the field it was read from; a
      fixint (width 0) and int 8 are both int8.
    name: signedAny
    params: n int64, width uint8
    results: any
  - doc: unsignedAny returns n as the unsigned Go type of the field it was read from.
    name: unsignedAny
    params: n uint64, width uint8
    results: any
  - doc: |-
      extAny decodes an extension payload: the timestamp becomes a time.Time,
      every other type is refused by name.
    name: extAny
    params: ext int8, p []byte
    results: any, error
  - doc: |-
      cloneBytes copies p into a fresh slice the caller owns. p is a payload of
      the input and never nil, so an empty bin decodes to an empty slice rather
      than to nil.
    name: cloneBytes
    params: p []byte
    results: "[]byte"
  - doc: |-
      unmarshalInto decodes data — exactly one value — into the value v points
      at.
    name: unmarshalInto
    params: data []byte, v any
    results: error
  - doc: |-
      pointerDecoder builds the decoder of pointer type t: nil sets the pointer
      to nil, anything else is decoded into what it points at, allocated when
      nil.
