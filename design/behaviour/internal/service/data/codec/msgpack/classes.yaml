apiVersion: design/behaviour/v1
constants:
  - doc: Pair arithmetic of the map family.
    grouped: true
    items:
      - doc: |-
          mapEntryMinBytes is the fewest bytes one map pair can occupy: a
          one-byte key and a one-byte value.
        name: mapEntryMinBytes
        type: uint64
        value: "2"
      - doc: "valuesPerPair is how many values one map pair holds: a key and a value."
        name: valuesPerPair
        type: uint64
        value: "2"
    name: mapEntryMinBytes
  - doc: |-
      anyPreallocElems is how many []any slots a declared count may reserve
      before its elements are read (preallocBytes / 16-byte interface).
    items:
      - name: anyPreallocElems
        type: uint64
        value: uint64(preallocBytes) / anySlotBytes
    name: anyPreallocElems
  - doc: anySlotBytes is the size of one interface value.
    items:
      - name: anySlotBytes
        type: uint64
        value: "16"
    name: anySlotBytes
  - doc: Map preallocation bounds.
    grouped: true
    items:
      - doc: |-
          mapPairEstimate is the bytes assumed per reserved pair when sizing a
          map.
        name: mapPairEstimate
        type: uint64
        value: "64"
      - doc: mapPreallocPairs bounds the pairs a declared count may reserve.
        name: mapPreallocPairs
        type: uint64
        value: uint64(preallocBytes) / mapPairEstimate
    name: mapPairEstimate
  - doc: streamBufSize is the read-ahead the decoder keeps over its reader.
    items:
      - name: streamBufSize
        type: int
        value: 4 << 10
    name: streamBufSize
  - doc: Reasons and public messages, shared by every failure of one direction.
    grouped: true
    items:
      - doc: reasonMarshal is the reason every encode failure carries.
        name: reasonMarshal
        type: string
        value: "\"MARSHAL_FAILED\""
      - doc: reasonUnmarshal is the reason every decode failure carries.
        name: reasonUnmarshal
        type: string
        value: "\"UNMARSHAL_FAILED\""
      - doc: publicMarshal is the wire-safe message of an encode failure.
        name: publicMarshal
        type: string
        value: "\"MessagePack encoding failed\""
      - doc: publicUnmarshal is the wire-safe message of a decode failure.
        name: publicUnmarshal
        type: string
        value: "\"MessagePack decoding failed\""
      - doc: privatePrefix opens every log-only message.
        name: privatePrefix
        type: string
        value: "\"service/data/codec/msgpack: \""
    name: reasonMarshal
  - doc: Field keys attached to failures.
    grouped: true
    items:
      - doc: fieldOffset is the byte offset in the input where a decode failed.
        name: fieldOffset
        type: string
        value: "\"offset\""
      - doc: fieldType is the Go type the codec was encoding or decoding into.
        name: fieldType
        type: string
        value: "\"type\""
      - doc: fieldWire is the MessagePack family the input carried.
        name: fieldWire
        type: string
        value: "\"wire\""
      - doc: fieldLimit is the bound a value exceeded.
        name: fieldLimit
        type: string
        value: "\"limit\""
      - doc: fieldLen is a length the input declared or the value had.
        name: fieldLen
        type: string
        value: "\"len\""
      - doc: fieldName is a struct field name.
        name: fieldName
        type: string
        value: "\"field\""
    name: fieldOffset
  - doc: Struct-tag vocabulary.
    grouped: true
    items:
      - doc: tagKey is the struct tag this codec reads.
        name: tagKey
        type: string
        value: "\"msgpack\""
      - doc: markerField is the field whose tag carries struct-wide options.
        name: markerField
        type: string
        value: "\"_msgpack\""
      - doc: optOmitEmpty leaves an empty field out.
        name: optOmitEmpty
        type: string
        value: "\"omitempty\""
      - doc: optAsArray encodes the struct as an array.
        name: optAsArray
        type: string
        value: "\"as_array\""
      - doc: optAsArrayCamel is the camel-case spelling of optAsArray.
        name: optAsArrayCamel
        type: string
        value: "\"asArray\""
      - doc: optInline forces an embedded struct's fields inline.
        name: optInline
        type: string
        value: "\"inline\""
      - doc: optNoInline keeps an embedded struct as one field.
        name: optNoInline
        type: string
        value: "\"noinline\""
      - doc: optAlias names an extra key the field decodes from.
        name: optAlias
        type: string
        value: "\"alias\""
      - doc: tagSkip is the tag name that leaves a field out.
        name: tagSkip
        type: string
        value: "\"-\""
      - doc: detailDuplicateKey is the failure of a type two fields share a key in.
        name: detailDuplicateKey
        type: string
        value: "\"two struct fields claim the same MessagePack key\""
    name: tagKey
  - doc: Timestamp layout constants.
    grouped: true
    items:
      - doc: ts32Len is the payload length of timestamp 32.
        name: ts32Len
        type: uint64
        value: "4"
      - doc: ts64Len is the payload length of timestamp 64.
        name: ts64Len
        type: uint64
        value: "8"
      - doc: ts96Len is the payload length of timestamp 96.
        name: ts96Len
