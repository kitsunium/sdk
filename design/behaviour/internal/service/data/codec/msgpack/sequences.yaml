        to: f.r.Peek
      - opt:
          do:
            - return: f.readFailure(err, false)
              to: f.readFailure
          when: err != nil
      - set: f.out
        value: append(f.out, p...)
      - opt:
          do:
            - return: f.readFailure(derr, false)
              to: f.readFailure
          init:
            bind: _, derr
            eval: f.r.Discard(n)
            to: f.r.Discard
          when: derr != nil
      - return: nil
  - of: (*framer).readFailure
    participants:
      - id: caller
        kind: actor
      - id: (*framer).readFailure
        kind: self
      - id: unmarshalFault
        kind: internal
      - id: wrapUnmarshal
        kind: internal
    steps:
      - opt:
          do:
            - return: io.EOF
          when: atStart && errors.Is(err, io.EOF)
      - opt:
          do:
            - return: unmarshalFault("stream ends inside a value", errs.Int(fieldOffset, len(f.out)))
              to: unmarshalFault
