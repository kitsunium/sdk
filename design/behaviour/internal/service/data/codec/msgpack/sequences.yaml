      - opt:
          do:
            - return: d.ending()
              to: d.ending
          when: d.done
      - opt:
          do:
            - eval: d.finish(unmarshalFault("streaming decoder has no reader"))
              to: d.finish
            - return: d.err
          when: d.r == nil
      - opt:
          do:
            - eval: d.finish(err)
              to: d.finish
            - return: err
          init:
            bind: err
            eval: d.decodeNext(v)
            to: d.decodeNext
          when: err != nil
      - return: nil
  - of: (*msgpackDecoder).decodeNext
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackDecoder).decodeNext
        kind: self
      - id: d.bufferedValue
        kind: internal
      - id: d.decodeBuffered
        kind: internal
      - id: d.decodeFramed
        kind: internal
    steps:
      - opt:
          do:
            - return: d.decodeBuffered(frame, v)
              to: d.decodeBuffered
          init:
            bind: frame, ok
            eval: d.bufferedValue()
            to: d.bufferedValue
          when: ok
      - return: d.decodeFramed(v)
        to: d.decodeFramed
  - of: (*msgpackDecoder).bufferedValue
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackDecoder).bufferedValue
        kind: self
      - id: d.r.Peek
        kind: value
      - id: valueExtent
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: nil, false
                init:
                  bind: _, err
                  eval: d.r.Peek(1)
                  to: d.r.Peek
                when: err != nil
          when: d.r.Buffered() == 0
      - bind: buf, err
        eval: d.r.Peek(d.r.Buffered())
        to: d.r.Peek
      - opt:
          do:
            - return: nil, false
          when: err != nil
      - bind: size, complete
        eval: valueExtent(buf)
        to: valueExtent
      - opt:
          do:
            - return: nil, false
          when: "!complete"
      - return: buf[:size], true
  - of: (*msgpackDecoder).decodeBuffered
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackDecoder).decodeBuffered
        kind: self
      - id: unmarshalInto
        kind: internal
      - id: d.r.Discard
        kind: value
      - id: wrapUnmarshal
        kind: internal
    steps:
      - bind: err
        eval: unmarshalInto(frame, v)
        to: unmarshalInto
      - opt:
          do:
            - return: wrapUnmarshal(derr, "reading the stream failed")
              to: wrapUnmarshal
          init:
            bind: _, derr
            eval: d.r.Discard(len(frame))
            to: d.r.Discard
          when: derr != nil
      - return: err
  - of: (*msgpackDecoder).decodeFramed
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackDecoder).decodeFramed
        kind: self
      - id: scratch
        kind: package
      - id: f.run
        kind: internal
      - id: unmarshalInto
        kind: internal
      - id: retain
        kind: internal
    steps:
      - bind: buf
        eval: scratch.AcquireBuffer()
        to: scratch
      - bind: f
        eval: "framer{src: d.src, r: d.r, out: buf.AvailableBuffer()}"
      - bind: err
        eval: f.run()
        to: f.run
      - opt:
          do:
            - set: err
              to: unmarshalInto
              value: unmarshalInto(f.out, v)
          when: err == nil
