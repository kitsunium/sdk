      - opt:
          do:
            - bind: raw, err
              eval: f.copyField(info.width)
              to: f.copyField
            - opt:
                do:
                  - return: owed, err
                when: err != nil
            - set: arg
              value: raw
          when: info.width != 0
      - switch:
          cases:
            - case: famStr, famBin
              do:
                - return: owed, f.copyPayload(arg)
            - case: famExt
              do:
                - return: owed, f.copyPayload(arg + 1)
            - case: famArray
              do:
                - return: f.owe(owed, arg)
                  to: f.owe
            - case: famMap
              do:
                - return: f.owe(owed, arg*valuesPerPair)
