      - return: uint64(f.src.N) + uint64(f.r.Buffered())
  - of: (*framer).copyField
    participants:
      - id: caller
        kind: actor
      - id: (*framer).copyField
        kind: self
      - id: f.read
        kind: internal
      - id: beUint
        kind: internal
    steps:
      - bind: start
        eval: len(f.out)
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: f.read(uint64(width))
            to: f.read
          when: err != nil
      - return: beUint(f.out[start:]), nil
        to: beUint
  - of: (*framer).copyPayload
