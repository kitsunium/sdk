          do:
            - return: |-
                owed, unmarshalFault("declared element count exceeds what the stream can still deliver",
                			errs.Int(fieldOffset, len(f.out)), errs.Int64(fieldLen, int64(n)))
          when: owed-1+n > f.budget()
      - return: owed + n, nil
  - of: (*framer).budget
