              - opt:
                  do:
                    - return: appendNil(b), nil
                      to: appendNil
                  when: v.IsNil()
              - opt:
                  do:
                    - return: b, depthExceeded(true)
                  when: depth >= maxDepth
              - return: elem(b, v.Elem(), depth+1)
  - of: interfaceEncoder
    steps:
      - opt:
          do:
            - return: encodeError
          when: t == errorType
      - return: encodeInterface
  - of: encodeInterface
    participants:
      - id: caller
        kind: actor
      - id: encodeInterface
        kind: self
      - id: appendNil
        kind: internal
      - id: appendAny
        kind: internal
      - id: v.Elem
        kind: value
    steps:
      - opt:
          do:
            - return: appendNil(b), nil
              to: appendNil
          when: v.IsNil()
      - opt:
          do:
            - return: b, depthExceeded(true)
          when: depth >= maxDepth
      - opt:
          do:
            - return: appendAny(b, v.Interface(), depth+1)
              to: appendAny
          when: v.CanInterface()
      - bind: e
        eval: v.Elem()
        to: v.Elem
      - return: encoderFor(e.Type())(b, e, depth+1)
  - of: encodeError
    participants:
      - id: caller
        kind: actor
      - id: encodeError
        kind: self
      - id: appendNil
        kind: internal
      - id: interfaceOf
        kind: internal
      - id: appendString
        kind: internal
    steps:
      - opt:
          do:
            - return: appendNil(b), nil
              to: appendNil
          when: v.IsNil()
      - bind: err, ok
        eval: interfaceOf[error](v)
        to: interfaceOf
      - opt:
          do:
            - return: b, readOnly(v.Type())
          when: "!ok"
      - return: appendString(b, err.Error())
        to: appendString
  - of: interfaceOf
    steps:
      - var:
          name: zero
          type: T
      - opt:
          do:
            - return: zero, false
          when: "!v.CanInterface()"
      - return: reflect.TypeAssert[T](v)
  - of: readOnly
    participants:
      - id: caller
        kind: actor
      - id: readOnly
        kind: self
      - id: marshalFault
        kind: internal
    steps:
      - return: marshalFault("cannot call the encoding method of a value reached through an unexported field", typeField(t))
        to: marshalFault
  - of: newStructEncoder
    participants:
      - id: caller
        kind: actor
      - id: newStructEncoder
        kind: self
      - id: layoutOf
        kind: internal
      - id: layout.defect
        kind: internal
      - id: failingEncoder
        kind: internal
    steps:
      - bind: layout
        eval: layoutOf(t)
        to: layoutOf
      - opt:
          do:
            - return: failingEncoder(err)
              to: failingEncoder
          init:
            bind: err
            eval: layout.defect(t, true)
            to: layout.defect
          when: err != nil
      - bind: s
        eval: |-
          &structEncoder{
          		fields:       make([]fieldEncoder, len(layout.fields)),
          		asArray:      layout.asArray,
          		hasOmitEmpty: layout.hasOmitEmpty,
          	}
      - loop:
          do:
            - set: s.fields[i]
              value: "fieldEncoder{field: f, enc: encoderFor(f.typ), empty: emptyFor(f.typ)}"
          key: i
          range: layout.fields
          value: f
      - return: s.encode
  - of: (*structEncoder).encode
    participants:
      - id: caller
        kind: actor
      - id: (*structEncoder).encode
        kind: self
      - id: s.encodeArray
        kind: internal
      - id: s.encodeMap
        kind: internal
    steps:
      - opt:
          do:
            - return: b, depthExceeded(true)
          when: depth >= maxDepth
      - opt:
          do:
            - return: s.encodeArray(b, v, depth)
              to: s.encodeArray
          when: s.asArray
      - return: s.encodeMap(b, v, depth)
        to: s.encodeMap
  - of: (*structEncoder).encodeArray
    participants:
      - id: caller
        kind: actor
      - id: (*structEncoder).encodeArray
        kind: self
      - id: appendLength
        kind: internal
      - id: s.fields[i].encodeValue
        kind: internal
    steps:
      - set: b
        to: appendLength
        value: appendLength(b, len(s.fields), &arrayForms)
      - loop:
          do:
            - var:
                name: err
                type: error
            - set: b, err
              to: s.fields[i].encodeValue
              value: s.fields[i].encodeValue(b, v, depth)
            - opt:
                do:
                  - return: b, err
                when: err != nil
          key: i
          range: s.fields
      - return: b, nil
  - of: (*structEncoder).encodeMap
    participants:
      - id: caller
        kind: actor
      - id: (*structEncoder).encodeMap
        kind: self
      - id: s.keptCount
        kind: internal
      - id: appendLength
        kind: internal
      - id: f.encodeValue
        kind: internal
    steps:
      - bind: "n"
        eval: len(s.fields)
      - opt:
          do:
            - set: "n"
              to: s.keptCount
              value: s.keptCount(v)
          when: s.hasOmitEmpty
      - set: b
        to: appendLength
        value: appendLength(b, n, &mapForms)
      - loop:
          do:
            - bind: f
              eval: "&s.fields[i]"
            - opt:
                do:
                  - continue: true
                when: s.hasOmitEmpty && f.omitted(v)
            - set: b
              value: append(b, f.field.wireName...)
            - var:
                name: err
                type: error
            - set: b, err
              to: f.encodeValue
              value: f.encodeValue(b, v, depth)
            - opt:
                do:
                  - return: b, err
                when: err != nil
          key: i
          range: s.fields
      - return: b, nil
  - of: (*fieldEncoder).omitted
    participants:
      - id: caller
        kind: actor
      - id: (*fieldEncoder).omitted
        kind: self
      - id: fieldValue
        kind: internal
    steps:
      - bind: fv, ok
        eval: fieldValue(v, f.field.index)
        to: fieldValue
      - opt:
          do:
            - return: "true"
          when: "!ok"
      - return: f.field.omitEmpty && f.empty(fv)
  - of: (*fieldEncoder).encodeValue
    participants:
      - id: caller
        kind: actor
      - id: (*fieldEncoder).encodeValue
        kind: self
      - id: fieldValue
        kind: internal
      - id: appendNil
        kind: internal
    steps:
      - bind: fv, ok
        eval: fieldValue(v, f.field.index)
        to: fieldValue
      - opt:
          do:
            - return: appendNil(b), nil
              to: appendNil
          when: "!ok"
      - return: f.enc(b, fv, depth+1)
  - of: fieldValue
    participants:
      - id: caller
        kind: actor
      - id: fieldValue
        kind: self
      - id: v.Field
        kind: value
      - id: v.Elem
        kind: value
    steps:
      - opt:
          do:
            - return: v.Field(index[0]), true
              to: v.Field
          when: len(index) == 1
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: reflect.Value{}, false
                      when: v.IsNil()
                  - set: v
                    to: v.Elem
                    value: v.Elem()
                when: i > 0 && v.Kind() == reflect.Pointer
            - set: v
              to: v.Field
              value: v.Field(x)
          key: i
          range: index
          value: x
      - return: v, true
  - of: emptyFor
    participants:
      - id: caller
        kind: actor
      - id: emptyFor
        kind: self
      - id: kindEmpty
        kind: internal
    steps:
      - opt:
          do:
            - return: zeroerEmpty
          when: t.Kind() != reflect.Interface && t.Implements(isZeroerType)
      - return: kindEmpty(t.Kind())
        to: kindEmpty
  - of: kindEmpty
    steps:
      - switch:
          cases:
            - case: reflect.Array, reflect.Map, reflect.Slice, reflect.String
              do:
                - return: lenEmpty
            - case: reflect.Bool, reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64, reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr, reflect.Float32, reflect.Float64
              do:
                - return: scalarEmpty
            - case: reflect.Pointer
              do:
                - return: reflect.Value.IsNil
            - case: reflect.Interface
              do:
                - return: isEmptyValue
            - case: reflect.Struct
              do:
                - return: structEmpty
            - default: true
              do:
                - return: neverEmpty
          "on": k
  - of: scalarEmpty
    participants:
      - id: caller
        kind: actor
      - id: scalarEmpty
        kind: self
      - id: v.Bool
        kind: value
    steps:
      - switch:
          cases:
            - case: reflect.Bool
              do:
                - return: "!v.Bool()"
                  to: v.Bool
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: v.Int() == 0
            - case: reflect.Float32, reflect.Float64
              do:
                - return: v.Float() == 0
            - default: true
              do:
                - return: v.Uint() == 0
          "on": v.Kind()
  - of: isEmptyValue
    participants:
      - id: caller
        kind: actor
      - id: isEmptyValue
        kind: self
      - id: v.Elem
        kind: value
    steps:
      - loop:
          cond: v.Kind() == reflect.Interface
          do:
            - opt:
                do:
                  - return: "true"
                when: v.IsNil()
            - set: v
              to: v.Elem
              value: v.Elem()
      - return: emptyFor(v.Type())(v)
  - of: zeroerEmpty
    participants:
      - id: caller
        kind: actor
      - id: zeroerEmpty
        kind: self
      - id: interfaceOf
        kind: internal
      - id: z.IsZero
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: isNilable(v.Kind()) && v.IsNil()
      - bind: z, ok
        eval: interfaceOf[isZeroer](v)
        to: interfaceOf
      - opt:
          do:
            - return: kindEmpty(v.Kind())(v)
          when: "!ok"
      - return: z.IsZero()
        to: z.IsZero
  - of: lenEmpty
    steps:
      - return: v.Len() == 0
  - of: neverEmpty
    steps:
      - return: "false"
  - of: structEmpty
    participants:
      - id: caller
        kind: actor
      - id: structEmpty
        kind: self
      - id: layoutOf
        kind: internal
      - id: fieldValue
        kind: internal
    steps:
      - bind: layout
        eval: layoutOf(v.Type())
        to: layoutOf
      - opt:
          do:
            - return: len(layout.fields) == 0
          when: "!layout.hasOmitEmpty"
      - loop:
          do:
            - bind: fv, ok
              eval: fieldValue(v, f.index)
              to: fieldValue
            - opt:
                do:
                  - return: "false"
                when: ok && (!f.omitEmpty || !isEmptyValue(fv))
          key: _
          range: layout.fields
          value: f
      - return: "true"
  - of: isNilable
    steps:
      - switch:
          cases:
            - case: reflect.Chan, reflect.Func, reflect.Interface, reflect.Map, reflect.Pointer, reflect.Slice
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: newEncoder
    steps:
      - return: "&msgpackEncoder{w: w}"
  - of: (*msgpackEncoder).Encode
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackEncoder).Encode
        kind: self
      - id: marshalFault
        kind: internal
      - id: scratch
        kind: package
      - id: appendAny
        kind: internal
      - id: e.write
        kind: internal
      - id: retain
        kind: internal
    steps:
      - opt:
          do:
            - return: marshalFault("streaming encoder has no writer")
              to: marshalFault
          when: e.w == nil
      - bind: buf
        eval: scratch.AcquireBuffer()
        to: scratch
      - bind: b, err
        eval: appendAny(buf.AvailableBuffer(), v, 0)
        to: appendAny
      - opt:
          do:
            - set: err
              to: e.write
              value: e.write(b)
          when: err == nil
      - eval: retain(buf, b)
        to: retain
      - eval: scratch.ReleaseBuffer(buf)
        to: scratch
      - return: err
  - of: (*msgpackEncoder).write
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackEncoder).write
        kind: self
      - id: e.w.Write
        kind: value
      - id: wrapMarshal
        kind: internal
    steps:
      - opt:
          do:
            - return: wrapMarshal(err, "writing the encoded value failed")
              to: wrapMarshal
          init:
            bind: _, err
            eval: e.w.Write(b)
            to: e.w.Write
          when: err != nil
      - return: nil
  - of: (*msgpackEncoder).Close
    steps:
      - return: nil
  - of: family.String
    steps:
      - return: familyNames[f]
  - of: marshalFault
    participants:
      - id: caller
        kind: actor
      - id: marshalFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    coremsgpack.CodeMsgPackMarshalFailed,
          		Reason:  reasonMarshal,
          		Public:  publicMarshal,
          		Private: privatePrefix + detail,
          	}, fields...)
        to: errs
  - of: unmarshalFault
    participants:
      - id: caller
        kind: actor
      - id: unmarshalFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    coremsgpack.CodeMsgPackUnmarshalFailed,
          		Reason:  reasonUnmarshal,
          		Public:  publicUnmarshal,
          		Private: privatePrefix + detail,
          	}, fields...)
        to: errs
  - of: wrapMarshal
    participants:
      - id: caller
        kind: actor
      - id: wrapMarshal
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coremsgpack.CodeMsgPackMarshalFailed,
          		Reason:  reasonMarshal,
          		Public:  publicMarshal,
          		Private: privatePrefix + detail,
          	}, fields...)
        to: errs
  - of: wrapUnmarshal
    participants:
      - id: caller
        kind: actor
      - id: wrapUnmarshal
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coremsgpack.CodeMsgPackUnmarshalFailed,
          		Reason:  reasonUnmarshal,
          		Public:  publicUnmarshal,
          		Private: privatePrefix + detail,
          	}, fields...)
        to: errs
  - of: typeField
    participants:
      - id: caller
        kind: actor
      - id: typeField
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.String(fieldType, t.String())
        to: errs
  - of: unsupportedType
    participants:
      - id: caller
        kind: actor
      - id: unsupportedType
        kind: self
      - id: marshalFault
        kind: internal
    steps:
      - return: marshalFault("cannot encode a value of this Go type", typeField(t))
        to: marshalFault
  - of: depthExceeded
    participants:
      - id: caller
        kind: actor
      - id: depthExceeded
        kind: self
      - id: marshalFault
        kind: internal
      - id: unmarshalFault
        kind: internal
    steps:
      - opt:
          do:
            - return: marshalFault("value nests deeper than the depth limit (a cyclic value?)", errs.Int(fieldLimit, maxDepth))
              to: marshalFault
          when: encode
      - return: unmarshalFault("input nests deeper than the depth limit", errs.Int(fieldLimit, maxDepth))
        to: unmarshalFault
  - of: layoutOf
    participants:
      - id: caller
        kind: actor
      - id: layoutOf
        kind: self
      - id: layouts.Load
        kind: value
      - id: buildLayout
        kind: internal
      - id: layouts.LoadOrStore
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: l
                init:
                  bind: l, isLayout
                  eval: cached.(*structLayout)
                when: isLayout
          init:
            bind: cached, ok
            eval: layouts.Load(t)
            to: layouts.Load
          when: ok
      - bind: l
        eval: buildLayout(t, map[reflect.Type]bool{})
        to: buildLayout
      - bind: actual, _
        eval: layouts.LoadOrStore(t, l)
        to: layouts.LoadOrStore
      - opt:
          do:
            - return: stored
          init:
            bind: stored, isLayout
            eval: actual.(*structLayout)
          when: isLayout
      - return: l
  - of: buildLayout
    participants:
      - id: caller
        kind: actor
      - id: buildLayout
        kind: self
      - id: b.addField
        kind: internal
    steps:
      - set: visiting[t]
        value: "true"
      - bind: b
        eval: |-
          &layoutBuilder{
          		layout:   &structLayout{byName: make(map[string]*structField, t.NumField())},
          		visiting: visiting,
          	}
      - loop:
          do:
            - eval: b.addField(f)
              to: b.addField
          key: f
          range: t.Fields()
      - eval: delete(visiting, t)
      - return: b.layout
  - of: (*layoutBuilder).addField
    participants:
      - id: caller
        kind: actor
      - id: (*layoutBuilder).addField
        kind: self
      - id: parseTag
        kind: internal
      - id: b.applyMarker
        kind: internal
      - id: b.alias
        kind: internal
      - id: b.add
        kind: internal
    steps:
      - bind: tag
        eval: parseTag(f.Tag.Get(tagKey))
        to: parseTag
      - opt:
          do:
            - return: ""
          when: tag.name == tagSkip
      - opt:
          do:
            - eval: b.applyMarker(tag)
              to: b.applyMarker
            - return: ""
          when: f.Name == markerField
      - opt:
          do:
            - return: ""
          when: "!f.IsExported() && !f.Anonymous"
      - bind: field
        eval: |-
          &structField{
          		typ:       f.Type,
          		name:      cmpOrName(tag.name, f.Name),
          		index:     []int{f.Index[0]},
          		omitEmpty: b.omitAll || tag.has(optOmitEmpty),
          	}
      - opt:
          do:
            - eval: b.alias(field.name, field)
              to: b.alias
            - return: ""
          when: f.Anonymous && !tag.has(optNoInline) && b.inline(field, tag.has(optInline))
      - eval: b.add(field)
        to: b.add
      - opt:
          do:
            - eval: b.alias(alias, field)
              to: b.alias
          init:
            bind: alias, ok
            eval: tag.opts[optAlias]
          when: ok && alias != ""
  - of: (*layoutBuilder).applyMarker
    steps:
      - set: b.layout.asArray
        value: tag.has(optAsArray) || tag.has(optAsArrayCamel)
      - opt:
          do:
            - set: b.omitAll
              value: "true"
          when: tag.has(optOmitEmpty)
  - of: (*layoutBuilder).inline
    participants:
      - id: caller
        kind: actor
      - id: (*layoutBuilder).inline
        kind: self
      - id: et.Elem
        kind: value
      - id: buildLayout
        kind: internal
      - id: b.fail
        kind: internal
      - id: b.add
        kind: internal
    steps:
      - bind: et
        eval: field.typ
      - loop:
          cond: et.Kind() == reflect.Pointer
          do:
            - set: et
              to: et.Elem
              value: et.Elem()
      - opt:
          do:
            - return: "false"
          when: et.Kind() != reflect.Struct || hasCustomCodec(et) || b.visiting[et]
      - bind: sub
        eval: buildLayout(et, b.visiting)
        to: buildLayout
      - opt:
          do:
            - return: "false"
          when: "!forced && b.collides(sub)"
      - opt:
          do:
            - eval: b.fail(sub.dupName)
              to: b.fail
          when: sub.dupName != ""
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, taken
                  eval: b.layout.byName[sf.name]
                when: taken
            - eval: |-
                b.add(&structField{
                			typ: sf.typ, name: sf.name, omitEmpty: sf.omitEmpty,
                			index: append(append(make([]int, 0, len(field.index)+len(sf.index)), field.index...), sf.index...),
                		})
              to: b.add
          key: _
          range: sub.fields
          value: sf
      - return: "true"
  - of: (*layoutBuilder).add
    participants:
      - id: caller
        kind: actor
      - id: (*layoutBuilder).add
        kind: self
      - id: b.fail
        kind: internal
      - id: appendLength
        kind: internal
    steps:
      - opt:
          do:
            - eval: b.fail(field.name)
              to: b.fail
            - return: ""
          init:
            bind: _, taken
            eval: b.layout.byName[field.name]
          when: taken
      - set: field.wireName
        to: appendLength
        value: appendLength(nil, len(field.name), &strForms)
      - set: field.wireName
        value: append(field.wireName, field.name...)
      - set: b.layout.fields
        value: append(b.layout.fields, field)
      - set: b.layout.byName[field.name]
        value: field
      - opt:
          do:
            - set: b.layout.hasOmitEmpty
              value: "true"
          when: field.omitEmpty
  - of: (*layoutBuilder).alias
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: _, taken
            eval: b.layout.byName[name]
          when: taken
      - set: b.layout.byName[name]
        value: field
  - of: (*layoutBuilder).fail
    steps:
      - opt:
          do:
            - set: b.layout.dupName
              value: name
          when: b.layout.dupName == ""
  - of: (*structLayout).defect
    participants:
      - id: caller
        kind: actor
      - id: (*structLayout).defect
        kind: self
      - id: marshalFault
        kind: internal
      - id: unmarshalFault
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: l.dupName == ""
      - opt:
          do:
            - return: marshalFault(detailDuplicateKey, typeField(t), errs.String(fieldName, l.dupName))
              to: marshalFault
          when: encode
      - return: unmarshalFault(detailDuplicateKey, typeField(t), errs.String(fieldName, l.dupName))
        to: unmarshalFault
  - of: hasCustomCodec
    participants:
      - id: caller
        kind: actor
      - id: hasCustomCodec
        kind: self
      - id: reflect
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "true"
          when: t == timeType
      - bind: pt
        eval: reflect.PointerTo(t)
        to: reflect
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: t.Implements(iface) || pt.Implements(iface)
          key: _
          range: customCodecTypes
          value: iface
      - return: "false"
  - of: parseTag
    participants:
      - id: caller
        kind: actor
      - id: parseTag
        kind: self
      - id: strings
        kind: stdlib
      - id: spec.setOption
        kind: internal
    steps:
      - var:
          name: spec
          type: tagSpec
      - opt:
          do:
            - return: spec
          when: s == ""
      - bind: head, rest, _
        eval: strings.Cut(s, ",")
        to: strings
      - bind: first
        eval: strings.TrimSpace(head)
        to: strings
      - alt:
          - do:
              - eval: spec.setOption(first)
                to: spec.setOption
            when: strings.Contains(first, ":")
          - do:
              - set: spec.name
                value: first
            else: true
      - loop:
          do:
            - eval: spec.setOption(strings.TrimSpace(opt))
              to: spec.setOption
          key: opt
          range: strings.SplitSeq(rest, ",")
      - return: spec
  - of: (*tagSpec).setOption
    participants:
      - id: caller
        kind: actor
      - id: (*tagSpec).setOption
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: opt == ""
      - opt:
          do:
            - set: s.opts
              value: map[string]string{}
          when: s.opts == nil
      - bind: key, value, _
        eval: strings.Cut(opt, ":")
        to: strings
      - set: s.opts[strings.TrimSpace(key)]
        to: strings
        value: strings.TrimSpace(value)
  - of: (*tagSpec).has
    steps:
      - bind: _, ok
        eval: s.opts[opt]
      - return: ok
  - of: cmpOrName
    steps:
      - opt:
          do:
            - return: fieldName
          when: tagName == ""
      - return: tagName
  - of: appendTimestamp
    participants:
      - id: caller
        kind: actor
      - id: appendTimestamp
        kind: self
      - id: binary.BigEndian.AppendUint32
        kind: value
      - id: binary.BigEndian.AppendUint64
        kind: value
    steps:
      - bind: secs
        eval: uint64(t.Unix())
      - bind: nsec
        eval: uint64(t.Nanosecond())
      - opt:
          do:
            - bind: word
              eval: nsec<<ts64SecBits | secs
            - opt:
                do:
                  - return: binary.BigEndian.AppendUint32(append(b, codeFixext4, extTimestampByte), uint32(word))
                    to: binary.BigEndian.AppendUint32
                when: word&ts32Mask == 0
            - return: binary.BigEndian.AppendUint64(append(b, codeFixext8, extTimestampByte), word)
              to: binary.BigEndian.AppendUint64
          when: secs>>ts64SecBits == 0
      - set: b
        value: append(b, codeExt8, byte(ts96Len), extTimestampByte)
      - set: b
        to: binary.BigEndian.AppendUint32
        value: binary.BigEndian.AppendUint32(b, uint32(nsec))
      - return: binary.BigEndian.AppendUint64(b, secs)
        to: binary.BigEndian.AppendUint64
  - of: decodeTimestamp
    participants:
      - id: caller
        kind: actor
      - id: decodeTimestamp
        kind: self
      - id: time.Unix(int64(binary.BigEndian.Uint32(p)), 0).UTC
        kind: value
      - id: binary.BigEndian.Uint64
        kind: value
      - id: timeFromParts
        kind: internal
    steps:
      - switch:
          cases:
            - case: ts32Len
              do:
                - return: time.Unix(int64(binary.BigEndian.Uint32(p)), 0).UTC(), nil
                  to: time.Unix(int64(binary.BigEndian.Uint32(p)), 0).UTC
            - case: ts64Len
              do:
                - bind: word
                  eval: binary.BigEndian.Uint64(p)
                  to: binary.BigEndian.Uint64
                - return: timeFromParts(int64(word&ts64SecMask), word>>ts64SecBits)
                  to: timeFromParts
            - case: ts96Len
              do:
                - bind: nsec
                  eval: uint64(binary.BigEndian.Uint32(p))
                - return: timeFromParts(int64(binary.BigEndian.Uint64(p[ts96NsecLen:])), nsec)
                  to: timeFromParts
            - default: true
              do:
                - return: time.Time{}, unmarshalFault("timestamp extension has an invalid length", errs.Int(fieldLen, len(p)))
          "on": uint64(len(p))
  - of: timeFromParts
    participants:
      - id: caller
        kind: actor
      - id: timeFromParts
        kind: self
      - id: time.Unix(sec, int64(nsec)).UTC
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, unmarshalFault("timestamp nanoseconds exceed 999999999")
          when: nsec > maxNanos
      - return: time.Unix(sec, int64(nsec)).UTC(), nil
        to: time.Unix(sec, int64(nsec)).UTC
  - of: buildHeaderTable
    participants:
      - id: caller
        kind: actor
      - id: buildHeaderTable
        kind: self
      - id: classifyHeader
        kind: internal
    steps:
      - var:
          name: table
          type: "[headerTableLen]headerInfo"
      - loop:
          do:
            - set: table[i]
              to: classifyHeader
              value: classifyHeader(byte(i))
          key: i
          range: headerTableLen
      - return: table
  - of: classifyHeader
    steps:
      - switch:
          cases:
            - case: c <= posFixintMax
              do:
                - return: "headerInfo{fam: famInt, inline: uint64(c)}"
            - case: c < fixarrayPrefix
              do:
                - return: "headerInfo{fam: famMap, inline: uint64(c & fixCountMask)}"
            - case: c < fixstrPrefix
              do:
                - return: "headerInfo{fam: famArray, inline: uint64(c & fixCountMask)}"
            - case: c < codeNil
              do:
                - return: "headerInfo{fam: famStr, inline: uint64(c & fixstrLenMask)}"
            - case: c >= negFixintMin
              do:
                - return: "headerInfo{fam: famInt, inline: uint64(int64(int8(c)))}"
            - default: true
              do:
                - return: formatBlock[c-codeNil]
