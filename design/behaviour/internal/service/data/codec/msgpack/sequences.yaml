        to: retain
      - eval: scratch.ReleaseBuffer(buf)
        to: scratch
      - return: err
  - of: (*msgpackDecoder).More
    steps:
      - return: "!d.done"
  - of: (*msgpackDecoder).finish
    steps:
      - set: d.done
        value: "true"
      - opt:
          do:
            - set: d.err
              value: err
          when: "!errors.Is(err, io.EOF)"
  - of: (*msgpackDecoder).ending
    steps:
      - opt:
          do:
            - return: d.err
          when: d.err != nil
      - return: io.EOF
  - of: (*framer).run
    participants:
      - id: caller
        kind: actor
      - id: (*framer).run
        kind: self
      - id: f.r.ReadByte
        kind: value
      - id: f.readFailure
        kind: internal
      - id: unmarshalFault
        kind: internal
      - id: f.body
        kind: internal
    steps:
      - loop:
          cond: owed > 0
          do:
            - bind: c, err
              eval: f.r.ReadByte()
              to: f.r.ReadByte
            - opt:
                do:
                  - return: f.readFailure(err, len(f.out) == 0)
                    to: f.readFailure
                when: err != nil
            - set: f.out
              value: append(f.out, c)
            - bind: info
