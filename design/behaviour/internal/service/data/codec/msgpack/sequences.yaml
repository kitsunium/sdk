      - opt:
          do:
            - return: 0, d.rangeOrMismatch(h, reflect.TypeFor[T](), isInteger(h.fam))
          when: "!ok || int64(T(n)) != n"
      - return: T(n), nil
  - of: decodeFloat64Elem
    participants:
      - id: caller
        kind: actor
      - id: decodeFloat64Elem
        kind: self
      - id: d.readHeader
        kind: internal
      - id: floatArg
        kind: internal
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - bind: f, ok
        eval: floatArg(h)
        to: floatArg
      - opt:
          do:
            - return: 0, d.mismatch(h, float64Type)
          when: "!ok"
      - return: f, nil
  - of: decodeBoolElem
    participants:
      - id: caller
        kind: actor
      - id: decodeBoolElem
        kind: self
      - id: d.readHeader
        kind: internal
      - id: boolArg
        kind: internal
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: false, err
          when: err != nil
      - bind: b, ok
        eval: boolArg(h)
        to: boolArg
      - opt:
          do:
            - return: false, d.mismatch(h, boolType)
          when: "!ok"
      - return: b, nil
  - of: mayBeUnhashable
    participants:
      - id: caller
        kind: actor
      - id: mayBeUnhashable
        kind: self
      - id: structMayBeUnhashable
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Interface
              do:
                - return: "true"
            - case: reflect.Array
              do:
                - return: mayBeUnhashable(t.Elem())
                  to: mayBeUnhashable
            - case: reflect.Struct
              do:
                - return: structMayBeUnhashable(t)
                  to: structMayBeUnhashable
            - default: true
              do:
                - return: "false"
          "on": t.Kind()
  - of: (*decodedError).Error
    steps:
      - return: e.msg
  - of: decoderFor
    participants:
      - id: caller
        kind: actor
      - id: decoderFor
        kind: self
      - id: decoders.Load
        kind: value
      - id: wg.Add
        kind: value
      - id: decoders.LoadOrStore
        kind: value
      - id: buildDecoder
        kind: internal
      - id: wg.Done
        kind: value
      - id: decoders.Store
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: f
                init:
                  bind: f, isFunc
                  eval: cached.(decodeFunc)
                when: isFunc
          init:
            bind: cached, ok
            eval: decoders.Load(t)
            to: decoders.Load
          when: ok
      - leaf: a const or type declaration in a body
        stmt: |-
          var (
          		wg    sync.WaitGroup
          		built decodeFunc
          	)
      - eval: wg.Add(1)
        to: wg.Add
      - bind: placeholder
        eval: |-
          decodeFunc(func(d *decodeState, v reflect.Value) error {
          		wg.Wait()
          		//: forward to the finished decoder.
          		return built(d, v)
          	})
      - opt:
          do:
            - opt:
                do:
                  - return: f
                init:
                  bind: f, isFunc
                  eval: actual.(decodeFunc)
                when: isFunc
          init:
            bind: actual, loaded
            eval: decoders.LoadOrStore(t, placeholder)
            to: decoders.LoadOrStore
          when: loaded
      - set: built
        to: buildDecoder
        value: buildDecoder(t)
      - eval: wg.Done()
        to: wg.Done
      - eval: decoders.Store(t, built)
        to: decoders.Store
      - return: built
  - of: buildDecoder
    participants:
      - id: caller
        kind: actor
      - id: buildDecoder
        kind: self
      - id: hookDecoder
        kind: internal
      - id: scalarDecoder
        kind: internal
      - id: compositeDecoder
        kind: internal
    steps:
      - opt:
          do:
            - return: f
          init:
            bind: f
            eval: hookDecoder(t)
            to: hookDecoder
          when: f != nil
      - opt:
          do:
            - return: f
          init:
            bind: f
            eval: scalarDecoder(t.Kind())
            to: scalarDecoder
          when: f != nil
      - return: compositeDecoder(t)
        to: compositeDecoder
  - of: hookDecoder
    participants:
      - id: caller
        kind: actor
      - id: hookDecoder
        kind: self
      - id: reflect
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: t.Kind() == reflect.Pointer || t.Kind() == reflect.Interface
      - bind: pt
        eval: reflect.PointerTo(t)
        to: reflect
      - switch:
          cases:
            - case: t == timeType
              do:
                - return: decodeTimeValue
            - case: pt.Implements(unmarshalMsgpackerType)
              do:
                - return: decodeSelfMsgpack
            - case: pt.Implements(binaryUnmarshalerType)
              do:
                - return: decodeSelfBinary
            - case: pt.Implements(textUnmarshalerType)
              do:
                - return: decodeSelfText
            - default: true
              do:
                - return: nil
  - of: scalarDecoder
    steps:
      - switch:
          cases:
            - case: reflect.Bool
              do:
                - return: decodeBoolValue
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: decodeIntValue
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr
              do:
                - return: decodeUintValue
            - case: reflect.Float32, reflect.Float64
              do:
                - return: decodeFloatValue
            - case: reflect.String
              do:
                - return: decodeStringValue
            - default: true
              do:
                - return: nil
          "on": k
  - of: compositeDecoder
    participants:
      - id: caller
        kind: actor
      - id: compositeDecoder
        kind: self
      - id: sliceDecoder
        kind: internal
      - id: arrayDecoder
        kind: internal
      - id: newMapDecoder
        kind: internal
      - id: newStructDecoder
        kind: internal
      - id: pointerDecoder
        kind: internal
      - id: interfaceDecoder
        kind: internal
      - id: failingDecoder
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Slice
              do:
                - return: sliceDecoder(t)
                  to: sliceDecoder
            - case: reflect.Array
              do:
                - return: arrayDecoder(t)
                  to: arrayDecoder
            - case: reflect.Map
              do:
                - return: newMapDecoder(t)
                  to: newMapDecoder
            - case: reflect.Struct
              do:
                - return: newStructDecoder(t)
                  to: newStructDecoder
            - case: reflect.Pointer
              do:
                - return: pointerDecoder(t)
                  to: pointerDecoder
            - case: reflect.Interface
              do:
                - return: interfaceDecoder(t)
                  to: interfaceDecoder
            - default: true
              do:
                - return: failingDecoder(unmarshalFault("cannot decode into a value of this Go type", typeField(t)))
                  to: failingDecoder
          "on": t.Kind()
  - of: failingDecoder
    steps:
      - return:
          closure:
            params: "*decodeState, reflect.Value"
            results: error
            steps:
              - return: err
  - of: (*decodeState).mismatch
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).mismatch
        kind: self
      - id: unmarshalFault
        kind: internal
    steps:
      - return: |-
          unmarshalFault("cannot decode the MessagePack value into this Go type",
          		errs.String(fieldWire, h.fam.String()), typeField(t), errs.Int(fieldOffset, d.off))
        to: unmarshalFault
  - of: zeroValue
    participants:
      - id: caller
        kind: actor
      - id: zeroValue
        kind: self
      - id: unmarshalFault
        kind: internal
      - id: v.SetZero
        kind: value
    steps:
      - opt:
          do:
            - return: unmarshalFault("cannot set a value reached through an unexported field", typeField(v.Type()))
              to: unmarshalFault
          when: "!v.CanSet()"
      - eval: v.SetZero()
        to: v.SetZero
      - return: nil
  - of: decodeBoolValue
    participants:
      - id: caller
        kind: actor
      - id: decodeBoolValue
        kind: self
      - id: d.readHeader
        kind: internal
      - id: boolArg
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.SetBool
        kind: value
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: b, ok
        eval: boolArg(h)
        to: boolArg
      - opt:
          do:
            - return: d.mismatch(h, v.Type())
              to: d.mismatch
          when: "!ok"
      - eval: v.SetBool(b)
        to: v.SetBool
      - return: nil
  - of: boolArg
    steps:
      - switch:
          cases:
            - case: famBool
              do:
                - return: h.arg == 1, true
            - case: famNil
              do:
                - return: false, true
            - default: true
              do:
                - return: false, false
          "on": h.fam
  - of: decodeIntValue
    participants:
      - id: caller
        kind: actor
      - id: decodeIntValue
        kind: self
      - id: d.readHeader
        kind: internal
      - id: signedArg
        kind: internal
      - id: d.rangeOrMismatch
        kind: internal
      - id: v.SetInt
        kind: value
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: n, ok
        eval: signedArg(h)
        to: signedArg
      - opt:
          do:
            - return: d.rangeOrMismatch(h, v.Type(), isInteger(h.fam))
              to: d.rangeOrMismatch
          when: "!ok || v.OverflowInt(n)"
      - eval: v.SetInt(n)
        to: v.SetInt
      - return: nil
  - of: decodeUintValue
    participants:
      - id: caller
        kind: actor
      - id: decodeUintValue
        kind: self
      - id: d.readHeader
        kind: internal
      - id: unsignedArg
        kind: internal
      - id: d.rangeOrMismatch
        kind: internal
      - id: v.SetUint
        kind: value
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: n, ok
        eval: unsignedArg(h)
        to: unsignedArg
      - opt:
          do:
            - return: d.rangeOrMismatch(h, v.Type(), isInteger(h.fam))
              to: d.rangeOrMismatch
          when: "!ok || v.OverflowUint(n)"
      - eval: v.SetUint(n)
        to: v.SetUint
      - return: nil
  - of: decodeFloatValue
    participants:
      - id: caller
        kind: actor
      - id: decodeFloatValue
        kind: self
      - id: d.readHeader
        kind: internal
      - id: floatArg
        kind: internal
      - id: d.rangeOrMismatch
        kind: internal
      - id: v.SetFloat
        kind: value
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: f, ok
        eval: floatArg(h)
        to: floatArg
      - opt:
          do:
            - return: d.rangeOrMismatch(h, v.Type(), ok)
              to: d.rangeOrMismatch
          when: "!ok || v.OverflowFloat(f)"
      - eval: v.SetFloat(f)
        to: v.SetFloat
      - return: nil
  - of: (*decodeState).rangeOrMismatch
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).rangeOrMismatch
        kind: self
      - id: unmarshalFault
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - opt:
          do:
            - return: unmarshalFault("number does not fit the Go type", typeField(t), errs.Int(fieldOffset, d.off))
              to: unmarshalFault
          when: numeric
      - return: d.mismatch(h, t)
        to: d.mismatch
  - of: isInteger
    steps:
      - return: f == famInt || f == famUint
  - of: signedArg
    steps:
      - switch:
          cases:
            - case: famInt
              do:
                - return: int64(h.arg), true
            - case: famUint
              do:
                - return: int64(h.arg), h.arg <= math.MaxInt64
            - case: famNil
              do:
                - return: 0, true
            - default: true
              do:
                - return: 0, false
          "on": h.fam
  - of: unsignedArg
    steps:
      - switch:
          cases:
            - case: famUint
              do:
                - return: h.arg, true
            - case: famInt
              do:
                - return: h.arg, int64(h.arg) >= 0
            - case: famNil
              do:
                - return: 0, true
            - default: true
              do:
                - return: 0, false
          "on": h.fam
  - of: floatArg
    participants:
      - id: caller
        kind: actor
      - id: floatArg
        kind: self
      - id: math
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: famFloat32
              do:
                - return: float64(math.Float32frombits(uint32(h.arg))), true
            - case: famFloat64
              do:
                - return: math.Float64frombits(h.arg), true
                  to: math
            - case: famInt
              do:
                - return: float64(int64(h.arg)), true
            - case: famUint
              do:
                - return: float64(h.arg), true
            - case: famNil
              do:
                - return: 0, true
            - default: true
              do:
                - return: 0, false
          "on": h.fam
  - of: decodeStringValue
    participants:
      - id: caller
        kind: actor
      - id: decodeStringValue
        kind: self
      - id: d.readBytesOrNil
        kind: internal
      - id: v.SetString
        kind: value
    steps:
      - bind: p, err
        eval: d.readBytesOrNil(v.Type())
        to: d.readBytesOrNil
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: v.SetString(string(p))
        to: v.SetString
      - return: nil
  - of: (*decodeState).readBytesOrNil
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).readBytesOrNil
        kind: self
      - id: d.readHeader
        kind: internal
      - id: d.take
        kind: internal
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - switch:
          cases:
            - case: famStr, famBin
              do:
                - return: d.take(h.arg)
                  to: d.take
            - case: famNil
              do:
                - return: nil, nil
            - default: true
              do:
                - return: nil, d.mismatch(h, t)
          "on": h.fam
  - of: decodeTimeValue
    participants:
      - id: caller
        kind: actor
      - id: decodeTimeValue
        kind: self
      - id: d.readHeader
        kind: internal
      - id: d.timeOf
        kind: internal
      - id: interfaceOf
        kind: internal
      - id: unmarshalFault
        kind: internal
    steps:
      - bind: at
        eval: d.off
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: t, err
        eval: d.timeOf(h, v.Type())
        to: d.timeOf
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: dst, ok
        eval: interfaceOf[*time.Time](v.Addr())
        to: interfaceOf
      - opt:
          do:
            - return: unmarshalFault("cannot set a value reached through an unexported field", errs.Int(fieldOffset, at))
              to: unmarshalFault
          when: "!ok"
      - set: "*dst"
        value: t
      - return: nil
  - of: (*decodeState).timeOf
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).timeOf
        kind: self
      - id: d.timestampPayload
        kind: internal
      - id: d.timeFromText
        kind: internal
    steps:
      - switch:
          cases:
            - case: famExt
              do:
                - return: d.timestampPayload(h)
                  to: d.timestampPayload
            - case: famStr
              do:
                - return: d.timeFromText(h)
                  to: d.timeFromText
            - case: famNil
              do:
                - return: time.Time{}, nil
            - default: true
              do:
                - return: time.Time{}, d.mismatch(h, t)
          "on": h.fam
  - of: (*decodeState).timestampPayload
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).timestampPayload
        kind: self
      - id: d.take
        kind: internal
      - id: decodeTimestamp
        kind: internal
    steps:
      - opt:
          do:
            - return: time.Time{}, unmarshalFault("extension is not a timestamp", errs.Int(fieldWire, int(h.ext)))
          when: h.ext != extTimestamp
      - bind: p, err
        eval: d.take(h.arg)
        to: d.take
      - opt:
          do:
            - return: time.Time{}, err
          when: err != nil
      - return: decodeTimestamp(p)
        to: decodeTimestamp
  - of: (*decodeState).timeFromText
    participants:
      - id: caller
        kind: actor
      - id: (*decodeState).timeFromText
        kind: self
      - id: d.take
        kind: internal
      - id: time
        kind: stdlib
      - id: t.UTC
        kind: value
    steps:
      - bind: p, err
        eval: d.take(h.arg)
        to: d.take
      - opt:
          do:
            - return: time.Time{}, err
          when: err != nil
      - bind: t, perr
        eval: time.Parse(time.RFC3339Nano, string(p))
        to: time
      - opt:
          do:
            - return: time.Time{}, unmarshalFault("string is not an RFC 3339 time", errs.Int(fieldOffset, d.off))
          when: perr != nil
      - return: t.UTC(), nil
        to: t.UTC
  - of: newStructDecoder
    participants:
      - id: caller
        kind: actor
      - id: newStructDecoder
        kind: self
      - id: layoutOf
        kind: internal
      - id: layout.defect
        kind: internal
      - id: failingDecoder
        kind: internal
      - id: fieldDecoderOf
        kind: internal
    steps:
      - bind: layout
        eval: layoutOf(t)
        to: layoutOf
      - opt:
          do:
            - return: failingDecoder(err)
              to: failingDecoder
          init:
            bind: err
            eval: layout.defect(t, false)
            to: layout.defect
          when: err != nil
      - bind: s
        eval: |-
          &structDecoder{
          		byName: make(map[string]*fieldDecoder, len(layout.byName)),
          		fields: make([]*fieldDecoder, 0, len(layout.fields)),
          	}
      - bind: built
        eval: make(map[*structField]*fieldDecoder, len(layout.byName))
      - loop:
          do:
            - set: s.fields
              value: append(s.fields, fieldDecoderOf(f, built))
          key: _
          range: layout.fields
          value: f
      - loop:
          do:
            - set: s.byName[name]
              to: fieldDecoderOf
              value: fieldDecoderOf(f, built)
          key: name
          range: layout.byName
          value: f
      - return: s.decode
  - of: fieldDecoderOf
    steps:
      - opt:
          do:
            - return: fd
          init:
            bind: fd, ok
            eval: built[f]
          when: ok
      - bind: fd
        eval: "&fieldDecoder{field: f, dec: decoderFor(f.typ)}"
      - set: built[f]
        value: fd
      - return: fd
  - of: (*structDecoder).decode
    participants:
      - id: caller
        kind: actor
      - id: (*structDecoder).decode
        kind: self
      - id: d.readHeader
        kind: internal
      - id: s.decodeMap
        kind: internal
      - id: s.decodeArray
        kind: internal
      - id: s.zero
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - bind: h, err
        eval: d.readHeader()
        to: d.readHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - switch:
          cases:
            - case: famMap
              do:
                - return: s.decodeMap(d, v, h)
                  to: s.decodeMap
            - case: famArray
              do:
                - return: s.decodeArray(d, v, h)
                  to: s.decodeArray
            - case: famNil
              do:
                - return: s.zero(v)
                  to: s.zero
            - default: true
              do:
                - return: d.mismatch(h, v.Type())
                  to: d.mismatch
          "on": h.fam
  - of: (*structDecoder).decodeMap
    participants:
      - id: caller
        kind: actor
      - id: (*structDecoder).decodeMap
        kind: self
      - id: d.checkCount
        kind: internal
      - id: d.enter
        kind: internal
      - id: s.decodePair
        kind: internal
      - id: d.leave
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.checkCount(h)
            to: d.checkCount
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.enter()
            to: d.enter
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.decodePair(d, v)
                  to: s.decodePair
                when: err != nil
          range: h.arg
      - eval: d.leave()
        to: d.leave
      - return: nil
  - of: (*structDecoder).decodePair
    participants:
      - id: caller
        kind: actor
      - id: (*structDecoder).decodePair
        kind: self
      - id: d.readKey
        kind: internal
      - id: d.skip
        kind: internal
      - id: f.decodeInto
        kind: internal
    steps:
      - bind: key, err
        eval: d.readKey()
        to: d.readKey
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: f
        eval: s.byName[string(key)]
      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: f == nil
      - return: f.decodeInto(d, v)
        to: f.decodeInto
  - of: (*structDecoder).decodeArray
    participants:
      - id: caller
        kind: actor
      - id: (*structDecoder).decodeArray
        kind: self
      - id: s.zero
        kind: internal
      - id: unmarshalFault
        kind: internal
      - id: d.enter
        kind: internal
      - id: f.decodeInto
        kind: internal
      - id: d.leave
        kind: internal
    steps:
      - opt:
          do:
            - return: s.zero(v)
              to: s.zero
          when: h.arg == 0
      - opt:
          do:
            - return: |-
                unmarshalFault("array-encoded struct has a different number of fields",
                			typeField(v.Type()), errs.Int64(fieldLen, int64(h.arg)), errs.Int(fieldLimit, len(s.fields)))
              to: unmarshalFault
          when: h.arg != uint64(len(s.fields))
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.enter()
            to: d.enter
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: f.decodeInto(d, v)
                  to: f.decodeInto
                when: err != nil
          key: _
          range: s.fields
          value: f
      - eval: d.leave()
        to: d.leave
      - return: nil
  - of: (*fieldDecoder).decodeInto
    participants:
      - id: caller
        kind: actor
      - id: (*fieldDecoder).decodeInto
        kind: self
      - id: fieldForDecode
        kind: internal
      - id: d.skip
        kind: internal
    steps:
      - bind: fv, err
        eval: fieldForDecode(v, f.field.index)
        to: fieldForDecode
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: d.skip()
              to: d.skip
          when: "!fv.CanSet() && fv.Kind() != reflect.Struct"
      - return: f.dec(d, fv)
  - of: (*structDecoder).zero
    participants:
      - id: caller
        kind: actor
      - id: (*structDecoder).zero
        kind: self
      - id: v.SetZero
        kind: value
      - id: fieldValue
        kind: internal
      - id: fv.SetZero
        kind: value
    steps:
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
            - return: nil
          when: v.CanSet()
      - loop:
          do:
            - bind: fv, ok
              eval: fieldValue(v, f.field.index)
              to: fieldValue
            - opt:
                do:
                  - eval: fv.SetZero()
                    to: fv.SetZero
                when: ok && fv.CanSet()
          key: _
          range: s.fields
          value: f
      - return: nil
  - of: fieldForDecode
    participants:
      - id: caller
        kind: actor
      - id: fieldForDecode
        kind: self
      - id: v.Field
        kind: value
      - id: allocEmbedded
        kind: internal
      - id: v.Elem
        kind: value
    steps:
      - opt:
          do:
            - return: v.Field(index[0]), nil
              to: v.Field
          when: len(index) == 1
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: reflect.Value{}, err
                      init:
                        bind: err
                        eval: allocEmbedded(v)
                        to: allocEmbedded
                      when: err != nil
                  - set: v
                    to: v.Elem
                    value: v.Elem()
                when: i > 0 && v.Kind() == reflect.Pointer
            - set: v
              to: v.Field
              value: v.Field(x)
          key: i
          range: index
          value: x
      - return: v, nil
  - of: allocEmbedded
    participants:
      - id: caller
        kind: actor
      - id: allocEmbedded
        kind: self
      - id: unmarshalFault
        kind: internal
      - id: v.Set
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: "!v.IsNil()"
      - opt:
          do:
            - return: unmarshalFault("cannot allocate an embedded pointer to an unexported struct", typeField(v.Type()))
              to: unmarshalFault
          when: "!v.CanSet()"
      - eval: v.Set(reflect.New(v.Type().Elem()))
        to: v.Set
      - return: nil
  - of: newDecoder
    steps:
      - opt:
          do:
            - return: "&msgpackDecoder{}"
          when: r == nil
      - bind: src
        eval: "&io.LimitedReader{R: r, N: int64(maxMsgPackBytes) + 1}"
      - return: "&msgpackDecoder{src: src, r: bufio.NewReaderSize(src, streamBufSize)}"
  - of: (*msgpackDecoder).Decode
    participants:
      - id: caller
        kind: actor
      - id: (*msgpackDecoder).Decode
        kind: self
      - id: d.ending
        kind: internal
      - id: d.finish
        kind: internal
      - id: d.decodeNext
        kind: internal
