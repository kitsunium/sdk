          cond: n > 0
          do:
            - bind: chunk
              eval: min(n, frameChunk)
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: f.read(chunk)
                  to: f.read
                when: err != nil
            - op: "-="
              set: "n"
              value: chunk
      - return: nil
  - of: (*framer).read
    participants:
      - id: caller
        kind: actor
      - id: (*framer).read
        kind: self
      - id: f.readBuffered
        kind: internal
      - id: io
        kind: stdlib
      - id: f.readFailure
