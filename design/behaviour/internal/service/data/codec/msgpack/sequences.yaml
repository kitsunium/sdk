      - return: wrapUnmarshal(err, "reading the stream failed")
        to: wrapUnmarshal
  - of: appendNil
    steps:
      - return: append(b, codeNil)
  - of: appendBool
    steps:
      - opt:
          do:
            - return: append(b, codeTrue)
          when: v
      - return: append(b, codeFalse)
  - of: appendUint
    participants:
      - id: caller
        kind: actor
      - id: appendUint
        kind: self
      - id: binary.BigEndian.AppendUint16
        kind: value
      - id: binary.BigEndian.AppendUint32
        kind: value
      - id: binary.BigEndian.AppendUint64
        kind: value
    steps:
      - switch:
          cases:
            - case: n <= uint64(posFixintMax)
              do:
                - return: append(b, byte(n))
            - case: n <= math.MaxUint8
              do:
                - return: append(b, codeUint8, byte(n))
            - case: n <= math.MaxUint16
              do:
                - return: binary.BigEndian.AppendUint16(append(b, codeUint16), uint16(n))
                  to: binary.BigEndian.AppendUint16
            - case: n <= math.MaxUint32
              do:
                - return: binary.BigEndian.AppendUint32(append(b, codeUint32), uint32(n))
                  to: binary.BigEndian.AppendUint32
            - default: true
              do:
                - return: binary.BigEndian.AppendUint64(append(b, codeUint64), n)
                  to: binary.BigEndian.AppendUint64
  - of: appendInt
    participants:
      - id: caller
        kind: actor
      - id: appendInt
        kind: self
      - id: appendUint
        kind: internal
      - id: binary.BigEndian.AppendUint16
        kind: value
      - id: binary.BigEndian.AppendUint32
        kind: value
      - id: binary.BigEndian.AppendUint64
        kind: value
    steps:
      - switch:
          cases:
            - case: n >= 0
              do:
                - return: appendUint(b, uint64(n))
                  to: appendUint
            - case: n >= negFixintFloor
              do:
                - return: append(b, byte(n))
            - case: n >= math.MinInt8
              do:
                - return: append(b, codeInt8, byte(n))
            - case: n >= math.MinInt16
              do:
                - return: binary.BigEndian.AppendUint16(append(b, codeInt16), uint16(n))
                  to: binary.BigEndian.AppendUint16
            - case: n >= math.MinInt32
              do:
                - return: binary.BigEndian.AppendUint32(append(b, codeInt32), uint32(n))
                  to: binary.BigEndian.AppendUint32
            - default: true
              do:
                - return: binary.BigEndian.AppendUint64(append(b, codeInt64), uint64(n))
                  to: binary.BigEndian.AppendUint64
  - of: appendFloat32
    participants:
      - id: caller
        kind: actor
      - id: appendFloat32
        kind: self
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - return: binary.BigEndian.AppendUint32(append(b, codeFloat32), math.Float32bits(f))
        to: binary.BigEndian.AppendUint32
  - of: appendFloat64
    participants:
      - id: caller
        kind: actor
      - id: appendFloat64
        kind: self
      - id: binary.BigEndian.AppendUint64
        kind: value
    steps:
      - return: binary.BigEndian.AppendUint64(append(b, codeFloat64), math.Float64bits(f))
        to: binary.BigEndian.AppendUint64
  - of: appendLength
    participants:
      - id: caller
        kind: actor
      - id: appendLength
        kind: self
      - id: binary.BigEndian.AppendUint16
        kind: value
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - switch:
          cases:
            - case: n <= forms.fixMax
              do:
                - return: append(b, forms.fixPrefix|byte(n))
            - case: n <= math.MaxUint8 && forms.code8 != 0
              do:
                - return: append(b, forms.code8, byte(n))
            - case: n <= math.MaxUint16
              do:
                - return: binary.BigEndian.AppendUint16(append(b, forms.code16), uint16(n))
                  to: binary.BigEndian.AppendUint16
            - default: true
              do:
                - return: binary.BigEndian.AppendUint32(append(b, forms.code32), uint32(n))
                  to: binary.BigEndian.AppendUint32
  - of: checkLength
    participants:
      - id: caller
        kind: actor
      - id: checkLength
        kind: self
      - id: marshalFault
        kind: internal
    steps:
      - opt:
          do:
            - return: marshalFault("length exceeds what a MessagePack length field holds", errs.Int(fieldLen, n))
              to: marshalFault
          when: uint64(n) > math.MaxUint32
      - return: nil
  - of: appendString
    participants:
      - id: caller
        kind: actor
      - id: appendString
        kind: self
      - id: checkLength
        kind: internal
    steps:
      - opt:
          do:
            - return: b, err
          init:
            bind: err
            eval: checkLength(len(s))
            to: checkLength
          when: err != nil
      - return: append(appendLength(b, len(s), &strForms), s...), nil
  - of: appendBinary
    participants:
      - id: caller
        kind: actor
      - id: appendBinary
        kind: self
      - id: checkLength
        kind: internal
    steps:
      - opt:
          do:
            - return: b, err
          init:
            bind: err
            eval: checkLength(len(p))
            to: checkLength
          when: err != nil
      - return: append(appendLength(b, len(p), &binForms), p...), nil
  - of: appendBytes
    participants:
      - id: caller
        kind: actor
      - id: appendBytes
        kind: self
      - id: appendNil
        kind: internal
      - id: appendBinary
        kind: internal
    steps:
      - opt:
          do:
            - return: appendNil(b), nil
              to: appendNil
          when: p == nil
      - return: appendBinary(b, p)
        to: appendBinary
  - of: appendArrayHeader
    participants:
      - id: caller
        kind: actor
      - id: appendArrayHeader
        kind: self
      - id: checkLength
        kind: internal
      - id: appendLength
        kind: internal
    steps:
      - opt:
          do:
            - return: b, err
          init:
            bind: err
            eval: checkLength(n)
            to: checkLength
          when: err != nil
      - return: appendLength(b, n, &arrayForms), nil
        to: appendLength
  - of: appendMapHeader
    participants:
      - id: caller
        kind: actor
      - id: appendMapHeader
        kind: self
      - id: checkLength
        kind: internal
      - id: appendLength
        kind: internal
    steps:
      - opt:
          do:
            - return: b, err
          init:
            bind: err
            eval: checkLength(n)
            to: checkLength
          when: err != nil
      - return: appendLength(b, n, &mapForms), nil
        to: appendLength
  - of: appendAny
    participants:
      - id: caller
        kind: actor
      - id: appendAny
        kind: self
      - id: appendScalarAny
        kind: internal
      - id: appendStringMap
        kind: internal
      - id: appendAnySlice
        kind: internal
      - id: reflect
        kind: stdlib
    steps:
      - opt:
          do:
            - return: encoded, err
          init:
            bind: encoded, handled, err
            eval: appendScalarAny(b, x)
            to: appendScalarAny
          when: handled
      - typeswitch:
          bind: v
          cases:
            - do:
                - return: appendStringMap(b, v, appendAnyElem, depth)
                  to: appendStringMap
              types: map[string]any
            - do:
                - return: appendAnySlice(b, v, depth)
                  to: appendAnySlice
              types: "[]any"
            - default: true
              do:
                - bind: rv
                  eval: reflect.ValueOf(x)
                  to: reflect
                - return: encoderFor(rv.Type())(b, rv, depth)
          "on": x
  - of: appendScalarAny
    participants:
      - id: caller
        kind: actor
      - id: appendScalarAny
        kind: self
      - id: appendNumberAny
        kind: internal
      - id: appendNil
        kind: internal
      - id: appendString
        kind: internal
      - id: appendBool
        kind: internal
      - id: appendBytes
        kind: internal
    steps:
      - opt:
          do:
            - return: encoded, true, nil
          init:
            bind: encoded, handled
            eval: appendNumberAny(b, x)
            op: =
            to: appendNumberAny
          when: handled
      - typeswitch:
          bind: v
          cases:
            - do:
                - return: appendNil(b), true, nil
                  to: appendNil
              types: nil
            - do:
                - set: encoded, err
                  to: appendString
                  value: appendString(b, v)
                - return: encoded, true, err
              types: string
            - do:
                - return: appendBool(b, v), true, nil
                  to: appendBool
              types: bool
            - do:
                - set: encoded, err
                  to: appendBytes
                  value: appendBytes(b, v)
                - return: encoded, true, err
              types: "[]byte"
            - default: true
              do:
                - return: b, false, nil
          "on": x
  - of: appendNumberAny
    participants:
      - id: caller
        kind: actor
      - id: appendNumberAny
        kind: self
      - id: appendInt
        kind: internal
      - id: appendUint
        kind: internal
      - id: appendFloat64
        kind: internal
      - id: appendFloat32
        kind: internal
    steps:
      - typeswitch:
          bind: v
          cases:
            - do:
                - return: appendInt(b, int64(v)), true
                  to: appendInt
              types: int
            - do:
                - return: appendInt(b, v), true
                  to: appendInt
              types: int64
            - do:
                - return: appendUint(b, v), true
                  to: appendUint
              types: uint64
            - do:
                - return: appendFloat64(b, v), true
                  to: appendFloat64
              types: float64
            - do:
                - return: appendFloat32(b, v), true
                  to: appendFloat32
