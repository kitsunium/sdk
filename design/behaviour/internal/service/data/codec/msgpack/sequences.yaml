              value: f.body(info, owed)
            - opt:
                do:
                  - return: err
                when: err != nil
          init: owed := uint64(1)
          post: owed--
      - return: nil
  - of: (*framer).body
    participants:
      - id: caller
        kind: actor
      - id: (*framer).body
