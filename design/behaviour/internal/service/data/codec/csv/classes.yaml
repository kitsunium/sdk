apiVersion: design/behaviour/v1
constants:
  - doc: |-
      Package-level constants and vars are grouped per KTN-VAR-GROUP /
      KTN-CONST-ORDER: all consts first (cap-discard threshold + promotion
      shape constants), then the package-level vars (pool + Codec singleton).
    grouped: true
    items:
      - doc: |-
          promotionHeaderCell is the single-column header label the facade
          promotion path stamps when wrapping a non-CSV value (matches
          pkg/v1/data/codec/promote.go csvPromotionHeader).
        name: promotionHeaderCell
        value: "\"_json\""
      - doc: |-
          promotionRowCount is the expected row count of a promotion-wrapped
          CSV: one header row plus one body row carrying the JSON.
        name: promotionRowCount
        type: int
        value: "2"
      - doc: promotionColumnCount is the expected column count per promotion row.
        name: promotionColumnCount
        type: int
        value: "1"
      - doc: |-
          promotionBufWorstCaseFactor accounts for the worst-case `"` → `""`
          expansion in the body cell of the promotion fast-path. Body length
          is multiplied by this factor when pre-sizing the output buffer.
        name: promotionBufWorstCaseFactor
        type: int
        value: "2"
      - doc: |-
          maxReservedRecords caps the records Unmarshal reserves room for before
          it has read one (#1098): past it the table grows by records read.
        name: maxReservedRecords
        type: int
        value: "4096"
      - doc: |-
          defaultComma is the delimiter the registered codec writes and reads,
          encoding/csv's own default.
        name: defaultComma
        type: rune
        value: "','"
    name: promotionHeaderCell
  - doc: The decoder's state bits.
    grouped: true
    items:
      - doc: flagReady reports that record holds a record no Decode has taken yet.
        name: flagReady
        type: decoderFlags
        value: 1 << iota
      - doc: |-
          flagHeaderDone is set once the stream's header question is settled:
          read as a header by a Decode into a struct, or handed out as data.
        name: flagHeaderDone
      - doc: flagReported is set once Decode has returned err, so More reports false.
        name: flagReported
    name: flagReady
  - doc: |-
      quoteSpecials are the bytes encoding/csv's Writer escapes inside a quoted
      field: the quote itself is doubled, CR and LF are written as they are.
    items:
      - name: quoteSpecials
        type: string
        value: "\"\\\"\\r\\n\""
    name: quoteSpecials
  - doc: |-
      formulaPrefix is the byte the OWASP mitigation writes before a cell a
      spreadsheet would evaluate (escapeIfFormulaCell).
    items:
      - name: formulaPrefix
        type: byte
        value: "'\\''"
    name: formulaPrefix
  - doc: The cell conversions a column can take.
    grouped: true
    items:
      - doc: "kindString is a string field: the cell as it is."
        name: kindString
        type: cellKind
        value: iota
      - doc: "kindInt is a signed integer field: strconv.ParseInt / AppendInt, base 10."
        name: kindInt
      - doc: "kindUint is an unsigned integer field: strconv.ParseUint / AppendUint."
        name: kindUint
      - doc: "kindFloat is a float field: strconv.ParseFloat / AppendFloat 'g', -1."
        name: kindFloat
      - doc: "kindBool is a bool field: strconv.ParseBool / AppendBool."
        name: kindBool
      - doc: |-
          kindText is a field whose type reads or writes itself as text:
          encoding.TextUnmarshaler / TextMarshaler — time.Time among them.
        name: kindText
    name: kindString
  - doc: The tag the typed mapping reads, and its one option.
    grouped: true
    items:
      - doc: tagKey is the struct tag naming a field's column.
        name: tagKey
        value: "\"csv\""
      - doc: optionalOption marks a column a file may lack.
        name: optionalOption
        value: "\"optional\""
    name: tagKey
  - doc: The typed mapping's fixed strings.
    grouped: true
    items:
      - doc: |-
          utf8BOM is the byte-order mark a spreadsheet may put before the header;
          it is not part of the first column's name.
        name: utf8BOM
        value: "\"\\uFEFF\""
      - doc: |-
          rowEstimate is the bytes Marshal reserves per row of a typed table before
          it knows the cells.
        name: rowEstimate
        type: int
        value: "64"
      - doc: maxCellScratch is the room reserved for one cell's formatting.
        name: maxCellScratch
        type: int
        value: "64"
    name: utf8BOM
