package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/jsonpatch
  name: jsonpatch
  purpose: Package jsonpatch computes the structural difference between two JSON documents as RFC 6902 operations — add, remove and replace, each at an RFC 6901 JSON Pointer — with the value each operation writes AND the value it replaces or removes (ADR 0143).
types:
  - kind: named
    name: Op
    underlying: string
  - fields:
      - doc: Op is add, remove or replace.
        name: Op
        type: Op
      - doc: Path is the RFC 6901 JSON Pointer of the value the operation changes.
        name: Path
        type: string
      - doc: |-
          Value is the value the operation writes: add and replace; absent for
          remove.
        name: Value
        type: json.RawMessage
      - doc: |-
          Old is the value the operation replaces or removes: replace and
          remove; absent for add.
        name: Old
        type: json.RawMessage
    kind: struct
    name: EditValue
  - doc: differ collects the operations of one diff.
    fields:
      - doc: edits are the operations so far, in order.
        name: edits
        type: "[]EditValue"
    kind: struct
    methods:
      - doc: diff appends the operations that turn a, at path, into b.
        name: diff
        params: path string, a, b *node
        recv: d *differ
      - doc: |-
          diffObjects appends the operations that turn object a, at path, into object
          b: members in byte order of their names, removed, compared or added.
        name: diffObjects
        params: path string, a, b *node
        recv: d *differ
      - doc: |-
          diffArrays appends the operations that turn array a, at path, into array b.
          The equal elements at both ends are kept; the elements of the middles both
          keep are found by alignment; between two kept elements, the removed and the
          added are paired in order and compared, the rest removed or added. i is the
          index in the array as the operations so far have left it.
        name: diffArrays
        params: path string, a, b []*node
        recv: d *differ
      - doc: |-
          changeRun appends the operations that turn the removed elements into the
          added ones, starting at index i, and returns the index after them: pairs
          compared in turn, then the extra ones removed or added.
        name: changeRun
        params: path string, i int, removed, added []*node
        recv: d *differ
        results: int
    name: differ
  - doc: node is one JSON value.
    fields:
      - doc: fields holds an object's members by name.
        name: fields
        type: map[string]*node
      - doc: text is a string's value, unescaped, or a number as written.
        name: text
        type: string
      - doc: names are an object's member names, in the document's order.
        name: names
        type: "[]string"
      - doc: items are an array's elements.
        name: items
        type: "[]*node"
      - doc: |-
          sum is a digest of the value that two equal values share: equal
          compares it first, so two values that differ are told apart in one
          comparison however large they are, and aligning two arrays costs one
          comparison a pair of elements rather than a walk of both.
        name: sum
        type: uint64
      - doc: |-
          kind is the value's kind, as jsontext names it: 'n', 'f', 't', '"',
          '0', '{' or '['.
        name: kind
        type: jsontext.Kind
    kind: struct
    name: node
  - doc: writeTokenner is what writing a container needs of an encoder.
    kind: named
    name: writeTokenner
    underlying: |-
      interface {
      	// WriteToken writes one token.
      	WriteToken(jsontext.Token) error
      }
