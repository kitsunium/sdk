apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxAlignCells bounds the table the alignment of two arrays' differing
      middles builds: past it, their elements are paired by position instead,
      which is still a correct patch — only a longer one.
    items:
      - name: maxAlignCells
        type: int
        value: 1 << 18
    name: maxAlignCells
  - doc: The three operations a diff emits.
    grouped: true
    items:
      - doc: |-
          Add adds a member to an object, or inserts an element into an array
          before the one at the index — after every element when the index is
          the array's length.
        name: Add
        type: Op
        value: "\"add\""
      - doc: Remove removes a member of an object, or the element at the index.
        name: Remove
        type: Op
        value: "\"remove\""
      - doc: Replace replaces the value at the path, the whole document at "".
        name: Replace
        type: Op
        value: "\"replace\""
    name: Add
  - doc: |-
      The FNV-1a 64-bit parameters the digests are built with, and the width of
      the integers they take in.
    grouped: true
    items:
      - doc: fnvOffset is FNV-1a's offset basis.
        name: fnvOffset
        type: uint64
        value: "14695981039346656037"
      - doc: fnvPrime is FNV-1a's prime.
        name: fnvPrime
        type: uint64
        value: "1099511628211"
      - doc: uint64Bytes is how many bytes an integer adds to a digest.
        name: uint64Bytes
        type: int
        value: "8"
      - doc: byteBits is how far the next byte of an integer is shifted.
        name: byteBits
        type: uint
        value: "8"
    name: fnvOffset
