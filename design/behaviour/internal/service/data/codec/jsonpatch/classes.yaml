functions:
  - name: Diff
    params: from, to []byte
    results: "[]EditValue, error"
  - doc: |-
      align returns the pairs of indices, into a and into b, of the elements both
      keep in order — a longest common subsequence under equal — ascending. Past
      maxAlignCells it keeps none, and the elements are paired by position.
    name: align
    params: a, b []*node
    results: "[][2]int"
  - doc: |-
      lcsLengths returns the table of the longest common subsequences of the
      suffixes of a and b: the entry at i*(len(b)+1)+j is the length for a[i:]
      and b[j:].
    name: lcsLengths
    params: a, b []*node
    results: "[]uint32"
  - doc: commonPrefix returns how many elements a and b share at their start.
    name: commonPrefix
    params: a, b []*node
    results: int
  - doc: reversed returns s's elements in reverse order, in a new slice.
    name: reversed
    params: s []*node
    results: "[]*node"
  - doc: |-
      escapeToken escapes a member name as an RFC 6901 reference token: "~" as
      "~0" first, then "/" as "~1", so "~1" in a name stays itself.
    name: escapeToken
    params: name string
    results: string
  - doc: |-
      parse reads raw as exactly one JSON value, strictly — jsontext's defaults:
      no duplicate member name, valid UTF-8, nesting within its bound — and no
      trailing data. which names the document in a refusal.
    name: parse
    params: which string, raw []byte
    results: "*node, error"
  - doc: readValue reads the next value from dec into a node.
    name: readValue
    params: dec *jsontext.Decoder
    results: "*node, error"
  - doc: |-
      digest returns the digest of n, whose children already have theirs: the
      kind, then what equal compares — a string's text, a number's sign, digits
      and power of ten (every zero alike), an array's elements in order, an
      object's members as a sum, so that their order changes nothing.
    name: digest
    params: n *node
    results: uint64
  - doc: |-
      numberDigest adds a number's sign, digits and power of ten to h, every zero
      alike, so that two numbers sameNumber calls one share it.
    name: numberDigest
    params: h uint64, text string
    results: uint64
  - doc: fnvByte adds one byte to an FNV-1a digest.
    name: fnvByte
    params: h uint64, b byte
    results: uint64
  - doc: |-
      fnvString adds s's bytes to an FNV-1a digest, after its length, so that
      two strings side by side never read as one.
    name: fnvString
    params: h uint64, s string
    results: uint64
  - doc: fnvUint adds v's eight bytes to an FNV-1a digest.
    name: fnvUint
    params: h, v uint64
    results: uint64
  - doc: |-
      mix scrambles v — splitmix64's finalizer — so that summing the members of
      an object does not let two members cancel out.
    name: mix
    params: v uint64
    results: uint64
  - doc: |-
      readObject reads an object's members into obj, up to and including the
      closing brace.
    name: readObject
    params: dec *jsontext.Decoder, obj *node
    results: error
  - doc: |-
      readArray reads an array's elements into arr, up to and including the
      closing bracket.
    name: readArray
    params: dec *jsontext.Decoder, arr *node
    results: error
  - doc: |-
      readMember reads one object member: its name, then its value. The name is
      taken out of its token at once: a token read from a decoder is void after
      the decoder's next call.
    name: readMember
    params: dec *jsontext.Decoder
    results: name string, value *node, err error
  - doc: |-
      equal reports whether a and b are the same JSON value in RFC 6902's sense
      (§4.6): the same kind, strings equal once unescaped, numbers numerically
      equal, arrays equal element by element, objects with the same members,
      whatever their order.
    name: equal
    params: a, b *node
    results: bool
  - doc: everyMember reports whether every member of a has an equal namesake in b.
    name: everyMember
    params: a, b *node
    results: bool
  - doc: |-
      sameNumber reports whether two JSON numbers, as written, are the same
      number. JSON numbers are exact decimals, so they are compared exactly:
      reduced to a sign, significant digits and a power of ten, in time linear in
      their text — never by computing ten to an exponent a document chose.
    name: sameNumber
    params: a, b string
    results: bool
  - doc: |-
      canonical reduces a JSON number to a sign, its significant digits without
      leading or trailing zeros — empty for zero — and the power of ten they are
      multiplied by; ok is false for an exponent that is not an integer, which a
      number jsontext accepted never has.
    name: canonical
    params: number string
    results: negative bool, digits string, exponent *big.Int, ok bool
  - doc: |-
      encode writes n compact: members in the document's order, a number as
      written, a string escaped as jsontext escapes it.
    name: encode
    params: n *node
    results: "[]byte"
  - doc: write writes n to enc.
    name: write
    params: enc *jsontext.Encoder, n *node
    results: error
  - doc: writeObject writes an object's members to enc, in the document's order.
    name: writeObject
    params: enc *jsontext.Encoder, obj *node
    results: error
  - doc: scalarToken is the token of a string, true, false or null.
    name: scalarToken
    params: n *node
    results: jsontext.Token
  - doc: "writeContainer writes an object or an array: begin, what body writes, end."
    name: writeContainer
    params: enc writeTokenner, begin, end jsontext.Token, body func() error
    results: error
  - doc: |-
      notJSON is NotJSON naming which document and the offset reading stopped
      at. The decoder's error travels as a field only when it is a syntax error,
      whose message this package rebuilds from its offset alone: jsontext quotes
      the character it stopped at, and that character is the document's.
    name: notJSON
    params: which string, offset int64, cause error
    results: error
