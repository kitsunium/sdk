    steps:
      - op: ^=
        set: v
        value: v >> 30
      - op: "*="
        set: v
        value: "0xbf58476d1ce4e5b9"
      - op: ^=
        set: v
        value: v >> 27
      - op: "*="
        set: v
        value: "0x94d049bb133111eb"
      - return: v ^ (v >> 31)
  - of: readObject
    participants:
      - id: caller
        kind: actor
      - id: readObject
        kind: self
      - id: readMember
        kind: internal
      - id: dec.ReadToken
        kind: value
    steps:
      - set: obj.fields
