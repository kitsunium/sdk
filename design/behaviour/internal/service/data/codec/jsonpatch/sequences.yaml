            - bind: name, member, err
              eval: readMember(dec)
              to: readMember
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: obj.names
              value: append(obj.names, name)
            - set: obj.fields[name]
              value: member
      - bind: _, err
        eval: dec.ReadToken()
        to: dec.ReadToken
      - return: err
  - of: readArray
    participants:
      - id: caller
        kind: actor
      - id: readArray
        kind: self
      - id: readValue
        kind: internal
      - id: dec.ReadToken
        kind: value
    steps:
      - loop:
          cond: dec.PeekKind() != ']'
          do:
            - bind: item, err
              eval: readValue(dec)
              to: readValue
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: arr.items
              value: append(arr.items, item)
      - bind: _, err
        eval: dec.ReadToken()
        to: dec.ReadToken
      - return: err
  - of: readMember
    participants:
      - id: caller
        kind: actor
      - id: readMember
        kind: self
      - id: dec.ReadToken
        kind: value
      - id: tok.String
        kind: value
      - id: readValue
        kind: internal
    steps:
      - bind: tok, err
        eval: dec.ReadToken()
        to: dec.ReadToken
      - opt:
          do:
            - return: "\"\", nil, err"
          when: err != nil
      - set: name
        to: tok.String
        value: tok.String()
      - set: value, err
        to: readValue
        value: readValue(dec)
      - return: name, value, err
  - of: equal
    participants:
      - id: caller
        kind: actor
      - id: equal
        kind: self
      - id: sameNumber
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: a.sum != b.sum || a.kind != b.kind
      - switch:
          cases:
            - case: "'\"'"
              do:
                - return: a.text == b.text
            - case: "'0'"
              do:
                - return: sameNumber(a.text, b.text)
                  to: sameNumber
            - case: "'['"
              do:
                - return: slices.EqualFunc(a.items, b.items, equal)
                  to: slices
            - case: "'{'"
              do:
                - return: len(a.fields) == len(b.fields) && everyMember(a, b)
            - default: true
              do:
                - return: "true"
          "on": a.kind
  - of: sameNumber
    participants:
      - id: caller
        kind: actor
      - id: sameNumber
        kind: self
      - id: canonical
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: a == b
      - bind: negA, digitsA, expA, okA
        eval: canonical(a)
        to: canonical
      - bind: negB, digitsB, expB, okB
        eval: canonical(b)
        to: canonical
      - opt:
          do:
            - return: "false"
          when: "!okA || !okB"
      - opt:
          do:
            - return: digitsA == digitsB
          when: digitsA == "" || digitsB == ""
      - return: negA == negB && digitsA == digitsB && expA.Cmp(expB) == 0
  - of: canonical
    participants:
      - id: caller
        kind: actor
      - id: canonical
        kind: self
      - id: strings
        kind: stdlib
      - id: exponent.SetString
        kind: value
      - id: exponent.Sub
        kind: value
      - id: exponent.Add
        kind: value
    steps:
      - set: negative
        to: strings
        value: strings.HasPrefix(number, "-")
      - bind: mantissa, power, _
        eval: strings.Cut(strings.TrimPrefix(number, "-"), "e")
        to: strings
      - opt:
          do:
            - set: mantissa, power, _
              to: strings
              value: strings.Cut(mantissa, "E")
          when: power == "" && strings.Contains(mantissa, "E")
      - bind: integer, fraction, _
        eval: strings.Cut(mantissa, ".")
        to: strings
      - set: exponent
        value: new(big.Int)
      - opt:
          do:
            - opt:
                do:
                  - return: false, "", nil, false
                init:
                  bind: _, parsed
                  eval: exponent.SetString(strings.TrimPrefix(power, "+"), 10)
                  to: exponent.SetString
                when: "!parsed"
          when: power != ""
      - set: digits
        to: strings
        value: strings.TrimLeft(integer+fraction, "0")
      - eval: exponent.Sub(exponent, big.NewInt(int64(len(fraction))))
        to: exponent.Sub
      - bind: trimmed
        eval: strings.TrimRight(digits, "0")
        to: strings
      - eval: exponent.Add(exponent, big.NewInt(int64(len(digits)-len(trimmed))))
        to: exponent.Add
      - return: negative, trimmed, exponent, true
  - of: encode
    participants:
      - id: caller
        kind: actor
      - id: encode
        kind: self
      - id: jsontext
        kind: stdlib
      - id: write
        kind: internal
      - id: bytes
        kind: stdlib
    steps:
      - var:
          name: buf
          type: bytes.Buffer
      - bind: enc
        eval: jsontext.NewEncoder(&buf)
        to: jsontext
      - opt:
          do:
            - return: "[]byte(strconv.Quote(n.kind.String()))"
          init:
            bind: err
            eval: write(enc, n)
            to: write
          when: err != nil
      - return: bytes.TrimSuffix(buf.Bytes(), []byte("\n"))
        to: bytes
  - of: write
    participants:
      - id: caller
        kind: actor
      - id: write
        kind: self
      - id: writeObject
        kind: internal
      - id: writeContainer
        kind: internal
      - id: enc.WriteValue
        kind: value
      - id: enc.WriteToken
        kind: value
    steps:
      - switch:
          cases:
            - case: "'{'"
              do:
                - return: writeObject(enc, n)
                  to: writeObject
            - case: "'['"
              do:
                - return: |-
                    writeContainer(enc, jsontext.BeginArray, jsontext.EndArray, func() error {
                    			//: each element.
                    			for _, item := range n.items {
                    				//: the element.
                    				if err := write(enc, item); err != nil {
                    					//: the encoder's refusal.
                    					return err
                    				}
                    			}
                    			//: every element.
                    			return nil
                    		})
                  to: writeContainer
            - case: "'0'"
              do:
                - return: enc.WriteValue(jsontext.Value(n.text))
                  to: enc.WriteValue
            - default: true
              do:
                - return: enc.WriteToken(scalarToken(n))
                  to: enc.WriteToken
          "on": n.kind
  - of: writeObject
    participants:
      - id: caller
        kind: actor
      - id: writeObject
        kind: self
      - id: writeContainer
        kind: internal
    steps:
      - return: |-
          writeContainer(enc, jsontext.BeginObject, jsontext.EndObject, func() error {
          		//: each member: its name, then its value.
          		for _, name := range obj.names {
          			//: the name.
          			if err := enc.WriteToken(jsontext.String(name)); err != nil {
          				//: the encoder's refusal.
          				return err
          			}
          			//: the value.
          			if err := write(enc, obj.fields[name]); err != nil {
          				//: the encoder's refusal.
          				return err
          			}
          		}
          		//: every member.
          		return nil
          	})
        to: writeContainer
  - of: scalarToken
    participants:
      - id: caller
        kind: actor
      - id: scalarToken
        kind: self
      - id: jsontext
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: "'\"'"
              do:
                - return: jsontext.String(n.text)
                  to: jsontext
            - case: "'t'"
              do:
                - return: jsontext.True
            - case: "'f'"
              do:
                - return: jsontext.False
            - default: true
              do:
                - return: jsontext.Null
          "on": n.kind
  - of: writeContainer
    participants:
      - id: caller
        kind: actor
      - id: writeContainer
        kind: self
      - id: enc.WriteToken
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: enc.WriteToken(begin)
            to: enc.WriteToken
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: body()
          when: err != nil
      - return: enc.WriteToken(end)
        to: enc.WriteToken
  - of: notJSON
    participants:
      - id: caller
        kind: actor
      - id: notJSON
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: problem
        eval: "\"not one well-formed JSON value\""
      - opt:
          do:
            - set: problem
              value: "\"the document ends before its value does\""
          when: errors.Is(cause, io.ErrUnexpectedEOF) || errors.Is(cause, io.EOF)
      - return: |-
          kerrs.Wrap(corejsonpatch.NotJSON, kerrs.WrapParams{},
          		kerrs.String("document", which), kerrs.Int64("offset", offset), kerrs.String("problem", problem))
        to: kerrs
