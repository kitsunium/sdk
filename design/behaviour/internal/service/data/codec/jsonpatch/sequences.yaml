      - return: (h ^ uint64(b)) * fnvPrime
  - of: fnvString
    participants:
      - id: caller
        kind: actor
      - id: fnvString
        kind: self
      - id: fnvUint
        kind: internal
      - id: fnvByte
        kind: internal
    steps:
      - set: h
        to: fnvUint
        value: fnvUint(h, uint64(len(s)))
      - loop:
          do:
            - set: h
              to: fnvByte
              value: fnvByte(h, s[i])
