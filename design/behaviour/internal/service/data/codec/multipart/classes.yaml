# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      boundarySniffWindow caps how many leading bytes are scanned for the first
      delimiter line. RFC 2046 allows an arbitrary preamble before it; a bounded
      window keeps the scan O(1) against a hostile body that never emits one.
    items:
      - name: boundarySniffWindow
        type: int
        value: "4096"
    name: boundarySniffWindow
  - doc: maxBoundaryLen is the RFC 2046 ceiling on a boundary (70 characters).
    items:
      - name: maxBoundaryLen
        type: int
        value: "70"
    name: maxBoundaryLen
  - doc: |-
      boundaryChars is the RFC 2046 bchars set, matching what
      mime/multipart.Writer.SetBoundary accepts. SPACE is legal except as the last
      character, which validateBoundary checks separately.
    items:
      - name: boundaryChars
        type: string
        value: |-
          "" +
          	"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
          	"abcdefghijklmnopqrstuvwxyz" +
          	"0123456789'()+_,-./:=? "
    name: boundaryChars
  - doc: delimiterPrefix is the two hyphens every delimiter line starts with.
    items:
      - name: delimiterPrefix
        type: string
        value: "\"--\""
    name: delimiterPrefix
  - doc: |-
      JSONPartName is the field name of the part the JSON-mediated shape writes
      and reads. It matches pkg/v1/data/codec's csv promotion header for the same
      reason: one recognisable label for "the SDK put a JSON document here".
    items:
      - name: JSONPartName
        type: string
        value: "\"_json\""
    name: JSONPartName
  - doc: mimeFormData is the canonical media type of the format.
    items:
      - name: mimeFormData
        type: string
        value: "\"multipart/form-data\""
    name: mimeFormData
  - doc: mimeJSON is the Content-Type stamped on the JSON-mediated part.
    items:
      - name: mimeJSON
        type: string
        value: "\"application/json\""
    name: mimeJSON
  - doc: |-
      formDataDisposition is the disposition type RFC 7578 §4.2 requires of every
      part; a part carrying any other has no form-data name.
    items:
      - name: formDataDisposition
        type: string
        value: "\"form-data\""
    name: formDataDisposition
  - doc: |-
      pathSeparators are the two octets a filename= parameter can separate path
      elements with. Both are read as separators on every OS, because the sender
      wrote the path with ITS separator, not with the receiver's.
    items:
      - name: pathSeparators
        type: string
        value: "`/\\`"
    name: pathSeparators
  - doc: |-
      partHeaderFields is the number of headers a part carries at most —
      Content-Disposition plus an optional Content-Type. Used to size the map in
      one shot rather than letting it grow.
    items:
      - name: partHeaderFields
        type: int
        value: "2"
    name: partHeaderFields
  - doc: |-
      forbiddenHeaderOctets are the three octets no part header value may carry.
      mime/multipart.Writer.CreatePart writes every header value verbatim, so a CR
      or an LF inside one does not corrupt the field — it ENDS the line, and the
      rest of the value is read back as a header line of its own or, after an
      empty line, as the start of the body. NUL ends the value for any consumer
      written in C. The same three octets ADR 0064's mail header gate refuses.
    items:
      - name: forbiddenHeaderOctets
        type: string
        value: "\"\\r\\n\\x00\""
    name: forbiddenHeaderOctets
  - doc: |-
      DefaultMaxPartBytes caps one part body at 32 MiB. Generous for a form field
      or a document upload, and small enough that a single part cannot exhaust a
      container's memory budget. Callers moving larger objects raise the bound
      explicitly through NewWithLimits.
    items:
      - comment: 32 MiB
        name: DefaultMaxPartBytes
        type: int64
        value: 32 << 20
    name: DefaultMaxPartBytes
  - doc: |-
      DefaultMaxParts caps a body at 1024 parts. A boundary flood costs the
      attacker one header line per part while costing the decoder a header parse
      and a slice entry each, so the part COUNT needs its own ceiling — the byte
      bounds alone do not constrain it on a streaming reader.
    items:
      - name: DefaultMaxParts
        type: int
        value: "1024"
    name: DefaultMaxParts
  - doc: |-
      DefaultMaxTotalBytes caps the sum of every part body at 64 MiB. Without it
      the real ceiling would be DefaultMaxPartBytes × DefaultMaxParts, which is
      not a bound anybody chose.
    items:
      - comment: 64 MiB
        name: DefaultMaxTotalBytes
        type: int64
        value: 64 << 20
    name: DefaultMaxTotalBytes
