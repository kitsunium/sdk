      - opt:
          do:
            - return: nil, false, rerr
          when: rerr != nil
      - opt:
          do:
            - return: nil, true, nil
          when: int64(len(buf)) > max
      - return: buf, false, nil
  - of: probeSize
    steps:
      - opt:
          do:
            - return: bound + 1
          when: bound < math.MaxInt64
      - return: bound
  - of: publishPart
    participants:
      - id: caller
        kind: actor
      - id: publishPart
        kind: self
      - id: valueInvalid
        kind: internal
    steps:
      - opt:
