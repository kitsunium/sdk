          do:
            - return: nil, limitExceeded(knob, ceiling, probeSize(ceiling))
          when: overflow
      - opt:
          do:
            - return: nil, lerr
          init:
            bind: lerr
            eval: d.count.admitPart(int64(len(read)))
            to: d.count.admitPart
          when: lerr != nil
