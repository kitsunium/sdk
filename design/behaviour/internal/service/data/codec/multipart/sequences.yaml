        kind: internal
      - id: Boundary
        kind: internal
    steps:
      - bind: br
        eval: bufio.NewReaderSize(r, boundarySniffWindow)
        to: bufio
      - bind: head, perr
        eval: peekHead(br)
        to: peekHead
      - opt:
          do:
            - return: "nil, \"\", unmarshalFailed(perr, \"Decoder: reading the boundary failed\")"
          when: perr != nil && !errIsEOF(perr) && !errors.Is(perr, bufio.ErrBufferFull)
      - bind: found, berr
        eval: Boundary(head)
        to: Boundary
      - opt:
          do:
            - return: nil, "", berr
          when: berr != nil
      - return: br, found, nil
  - of: peekHead
    participants:
      - id: caller
        kind: actor
      - id: peekHead
        kind: self
      - id: br.Peek
        kind: internal
    steps:
      - bind: want
        eval: "1"
      - loop:
          do:
            - set: head, err
              to: br.Peek
              value: br.Peek(want)
            - opt:
                do:
                  - return: head, err
                when: err != nil || len(head) >= boundarySniffWindow
            - set: head, err
              to: br.Peek
              value: br.Peek(br.Buffered())
            - opt:
                do:
                  - return: head, err
                when: err != nil
            - opt:
                do:
                  - return: head, nil
                when: delimiterLineComplete(head)
            - set: want
              value: len(head) + 1
          forever: true
  - of: delimiterLineComplete
    participants:
      - id: caller
        kind: actor
      - id: delimiterLineComplete
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - loop:
          do:
            - bind: offset
              eval: bytes.IndexByte(head[cursor:], '\n')
              to: bytes
            - opt:
                do:
                  - return: "false"
                when: offset < 0
            - bind: line
              eval: bytes.TrimSuffix(head[cursor:cursor+offset], []byte{'\r'})
              to: bytes
            - opt:
                do:
                  - return: "!bytes.HasSuffix(candidate, []byte(delimiterPrefix))"
                    to: bytes
                init:
                  bind: candidate, ok
                  eval: bytes.CutPrefix(line, []byte(delimiterPrefix))
                  to: bytes
                when: ok
            - op: +=
              set: cursor
              value: offset + 1
          init: cursor := 0
  - of: unmarshalFailed
    participants:
      - id: caller
        kind: actor
      - id: unmarshalFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coremultipart.CodeMultipartUnmarshalFailed,
          		Reason:  "UNMARSHAL_FAILED",
          		Public:  "multipart decoding failed",
          		Private: "service/data/codec/multipart." + detail,
          	})
        to: errs
  - of: dispositionOf
    participants:
      - id: caller
        kind: actor
      - id: dispositionOf
        kind: self
      - id: mime
        kind: stdlib
    steps:
      - bind: disposition, params, err
        eval: mime.ParseMediaType(src.Header.Get("Content-Disposition"))
        to: mime
      - opt:
          do:
            - return: "\"\", \"\""
          when: err != nil
      - opt:
          do:
            - set: name
              value: params["name"]
          when: disposition == formDataDisposition
      - return: name, lastElement(params["filename"])
  - of: lastElement
    participants:
      - id: caller
        kind: actor
      - id: lastElement
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: trimmed
        eval: strings.TrimRight(fileName, pathSeparators)
        to: strings
      - return: trimmed[strings.LastIndexAny(trimmed, pathSeparators)+1:]
  - of: (*multipartEncoder).Encode
    participants:
      - id: caller
        kind: actor
      - id: (*multipartEncoder).Encode
        kind: self
      - id: asPart
        kind: internal
      - id: e.count.admitPart
        kind: internal
      - id: e.writePart
        kind: internal
    steps:
      - bind: part, perr
        eval: asPart(v)
        to: asPart
      - opt:
          do:
            - return: perr
          when: perr != nil
      - opt:
          do:
            - return: lerr
          init:
            bind: lerr
            eval: e.count.admitPart(int64(len(part.Data)))
            to: e.count.admitPart
          when: lerr != nil
      - return: e.writePart(part)
        to: e.writePart
  - of: (*multipartEncoder).Close
    participants:
      - id: caller
        kind: actor
      - id: (*multipartEncoder).Close
        kind: self
      - id: e.inner.Close
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: cerr
        eval: e.inner.Close()
        to: e.inner.Close
      - opt:
          do:
            - return: nil
          when: cerr == nil
      - return: |-
          errs.Wrap(cerr, errs.WrapParams{
          		Code:    coremultipart.CodeMultipartMarshalFailed,
          		Reason:  "MARSHAL_FAILED",
          		Public:  "multipart encoding failed",
          		Private: "service/data/codec/multipart.Encoder.Close: mime/multipart returned an error",
          	})
        to: errs
  - of: (*multipartEncoder).Boundary
    participants:
      - id: caller
        kind: actor
      - id: (*multipartEncoder).Boundary
        kind: self
      - id: e.inner.Boundary
        kind: value
    steps:
      - return: e.inner.Boundary()
        to: e.inner.Boundary
  - of: (*multipartEncoder).writePart
    participants:
      - id: caller
        kind: actor
      - id: (*multipartEncoder).writePart
        kind: self
      - id: valueInvalid
        kind: internal
      - id: injectedHeaderField
        kind: internal
      - id: e.inner.CreatePart
        kind: value
      - id: marshalFailed
        kind: internal
      - id: body.Write
        kind: value
    steps:
      - opt:
          do:
            - return: valueInvalid("part carries no field name")
              to: valueInvalid
          when: part.Name == ""
      - opt:
          do:
            - return: |-
                valueInvalid("a part header value carries a CR, LF or NUL",
                			errs.String("field", field))
              to: valueInvalid
          init:
            bind: field, found
            eval: injectedHeaderField(part)
            to: injectedHeaderField
          when: found
      - bind: body, cerr
        eval: e.inner.CreatePart(partHeader(part))
        to: e.inner.CreatePart
      - opt:
          do:
            - return: "marshalFailed(cerr, \"Encoder.Encode: CreatePart returned an error\")"
              to: marshalFailed
          when: cerr != nil
      - opt:
          do:
            - return: "marshalFailed(werr, \"Encoder.Encode: writing the part body failed\")"
              to: marshalFailed
          init:
            bind: _, werr
            eval: body.Write(part.Data)
            to: body.Write
          when: werr != nil
      - return: nil
  - of: injectedHeaderField
    steps:
      - opt:
          do:
            - return: "\"Name\", true"
          when: strings.ContainsAny(part.Name, forbiddenHeaderOctets)
      - opt:
          do:
            - return: "\"FileName\", true"
          when: strings.ContainsAny(part.FileName, forbiddenHeaderOctets)
      - opt:
          do:
            - return: "\"ContentType\", true"
          when: strings.ContainsAny(part.ContentType, forbiddenHeaderOctets)
      - return: "\"\", false"
  - of: partHeader
    participants:
      - id: caller
        kind: actor
      - id: partHeader
        kind: self
      - id: header.Set
        kind: value
    steps:
      - bind: disposition
        eval: "`form-data; name=\"` + quoteEscaper.Replace(part.Name) + `\"`"
      - opt:
          do:
            - op: +=
              set: disposition
              value: "`; filename=\"` + quoteEscaper.Replace(part.FileName) + `\"`"
          when: part.FileName != ""
      - bind: header
        eval: make(textproto.MIMEHeader, partHeaderFields)
      - eval: header.Set("Content-Disposition", disposition)
        to: header.Set
      - opt:
          do:
            - eval: header.Set("Content-Type", part.ContentType)
              to: header.Set
          when: part.ContentType != ""
      - return: header
  - of: asPart
    participants:
      - id: caller
        kind: actor
      - id: asPart
        kind: self
      - id: stdjson
        kind: stdlib
    steps:
      - typeswitch:
          bind: typed
          cases:
            - do:
                - return: "&typed, nil"
              types: PartValue
            - do:
                - opt:
                    do:
                      - return: nil, valueInvalid("Encode called with a nil *PartValue")
                    when: typed == nil
                - return: typed, nil
              types: "*PartValue"
          "on": v
      - bind: inner, jerr
        eval: stdjson.Marshal(v)
        to: stdjson
      - opt:
          do:
            - return: nil, marshalFailed(jerr, "encoding/json rejected the value")
          when: jerr != nil
      - return: "&PartValue{Name: JSONPartName, ContentType: mimeJSON, Data: inner}, nil"
  - of: marshalFailed
    participants:
      - id: caller
        kind: actor
      - id: marshalFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coremultipart.CodeMultipartMarshalFailed,
          		Reason:  "MARSHAL_FAILED",
          		Public:  "multipart encoding failed",
          		Private: "service/data/codec/multipart." + detail,
          	})
        to: errs
  - of: valueInvalid
    participants:
      - id: caller
        kind: actor
      - id: valueInvalid
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    coremultipart.CodeMultipartValueInvalid,
          		Reason:  "VALUE_INVALID",
          		Public:  "multipart codec rejected the value shape",
          		Private: "service/data/codec/multipart: " + detail,
          	}, fields...)
        to: errs
  - of: LimitsConfig.resolve
    participants:
      - id: caller
        kind: actor
      - id: LimitsConfig.resolve
        kind: self
      - id: l.negativeKnob
        kind: internal
    steps:
      - bind: knob, bad
        eval: l.negativeKnob()
        to: l.negativeKnob
      - opt:
          do:
            - return: |-
                LimitsConfig{}, errs.Wrap(nil, errs.WrapParams{
                			Code:    coremultipart.CodeMultipartLimitsInvalid,
                			Reason:  "LIMITS_INVALID",
                			Public:  "multipart limits are not usable",
                			Private: "service/data/codec/multipart.NewWithLimits: a negative bound is not a limit",
                		}, errs.String("knob", knob))
          when: bad
      - return: |-
          LimitsConfig{
          		MaxPartBytes:  clampInt64(l.MaxPartBytes, DefaultMaxPartBytes),
          		MaxParts:      clampInt(l.MaxParts, DefaultMaxParts),
          		MaxTotalBytes: clampInt64(l.MaxTotalBytes, DefaultMaxTotalBytes),
          	}, nil
  - of: LimitsConfig.negativeKnob
    steps:
      - opt:
          do:
            - return: "\"MaxPartBytes\", true"
          when: l.MaxPartBytes < 0
      - opt:
          do:
            - return: "\"MaxParts\", true"
          when: l.MaxParts < 0
      - opt:
          do:
            - return: "\"MaxTotalBytes\", true"
          when: l.MaxTotalBytes < 0
      - return: "\"\", false"
  - of: clampInt64
    steps:
      - opt:
          do:
            - return: fallback
          when: v == 0
      - return: v
  - of: clampInt
    steps:
      - opt:
          do:
            - return: fallback
          when: v == 0
      - return: v
  - of: limitExceeded
    participants:
      - id: caller
        kind: actor
      - id: limitExceeded
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    coremultipart.CodeMultipartLimitExceeded,
          		Reason:  "LIMIT_EXCEEDED",
          		Public:  "multipart payload exceeds a configured limit",
          		Private: "service/data/codec/multipart: bound crossed while walking the parts",
          	}, errs.String("knob", knob), errs.Int64("bound", bound), errs.Int64("got", got))
        to: errs
