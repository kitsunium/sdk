    participants:
      - id: caller
        kind: actor
      - id: (*encoder).reserve
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: cap(e.buf)-len(e.buf) >= elementHeadroom
      - set: e.buf
        to: slices
        value: slices.Grow(e.buf, max(cap(e.buf), elementHeadroom))
  - of: (*encoder).beginElement
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).beginElement
        kind: self
      - id: e.reserve
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, marshalError(nil, "an element name holds a NUL byte or invalid UTF-8")
          when: strings.IndexByte(name, 0) >= 0 || !utf8.ValidString(name)
      - eval: e.reserve()
        to: e.reserve
      - set: e.buf
        value: append(e.buf, 0)
      - set: e.buf
        value: append(e.buf, name...)
      - bind: keyEnd
        eval: len(e.buf)
      - set: e.buf
        value: append(e.buf, 0)
      - return: keyEnd, nil
  - of: (*encoder).beginIndex
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).beginIndex
        kind: self
      - id: e.reserve
        kind: internal
      - id: strconv
        kind: stdlib
    steps:
      - eval: e.reserve()
        to: e.reserve
      - bind: begin
        eval: len(e.buf)
      - set: e.buf
        value: append(e.buf, 0)
      - set: e.buf
        to: strconv
        value: strconv.AppendInt(e.buf, int64(i), 10)
      - set: e.buf
        value: append(e.buf, 0)
      - return: begin
  - of: (*encoder).reserveLength
    steps:
      - bind: start
        eval: len(e.buf)
      - set: e.buf
        value: append(e.buf, 0, 0, 0, 0)
      - return: start
  - of: (*encoder).endDocument
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).endDocument
        kind: self
      - id: marshalError
        kind: internal
      - id: binary.LittleEndian.PutUint32
        kind: value
    steps:
      - set: e.buf
        value: append(e.buf, 0)
      - bind: size
        eval: len(e.buf) - start
      - opt:
          do:
            - return: marshalError(nil, "a document exceeds the 2 GiB an int32 length can describe")
              to: marshalError
          when: int64(size) > math.MaxInt32
      - eval: binary.LittleEndian.PutUint32(e.buf[start:], uint32(size))
        to: binary.LittleEndian.PutUint32
      - return: nil
  - of: (*encoder).appendBool
    steps:
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, 1)
            - return: ""
          when: b
      - set: e.buf
        value: append(e.buf, 0)
  - of: (*encoder).appendInt32
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendInt32
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: e.buf
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(e.buf, uint32(i))
  - of: (*encoder).appendInt64
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendInt64
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - set: e.buf
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(e.buf, uint64(i))
  - of: (*encoder).appendInt
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendInt
        kind: self
      - id: e.appendInt32
        kind: internal
      - id: e.appendInt64
        kind: internal
    steps:
      - opt:
          do:
            - eval: e.appendInt32(int32(i))
              to: e.appendInt32
            - return: typeInt32
          when: narrow && i >= math.MinInt32 && i <= math.MaxInt32
      - eval: e.appendInt64(i)
        to: e.appendInt64
      - return: typeInt64
  - of: (*encoder).appendUint
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendUint
        kind: self
      - id: e.appendInt32
        kind: internal
      - id: e.appendInt64
        kind: internal
    steps:
      - opt:
          do:
            - eval: e.appendInt32(int32(u))
              to: e.appendInt32
            - return: typeInt32, nil
          when: minSize && u <= math.MaxInt32
      - opt:
          do:
            - return: 0, marshalError(nil, "a "+p.typ.String()+" value overflows int64, BSON's widest integer")
          when: u > math.MaxInt64
      - eval: e.appendInt64(int64(u))
        to: e.appendInt64
      - return: typeInt64, nil
  - of: (*encoder).appendDouble
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendDouble
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - set: e.buf
        to: binary.LittleEndian.AppendUint64
        value: binary.LittleEndian.AppendUint64(e.buf, math.Float64bits(f))
  - of: (*encoder).appendString
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendString
        kind: self
      - id: marshalError
        kind: internal
      - id: e.appendStringBytes
        kind: internal
    steps:
      - opt:
          do:
            - return: marshalError(nil, "a string is not valid UTF-8")
              to: marshalError
          when: "!utf8.ValidString(s)"
      - eval: e.appendStringBytes(s)
        to: e.appendStringBytes
      - return: nil
  - of: (*encoder).appendStringBytes
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendStringBytes
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - set: e.buf
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(e.buf, uint32(len(s)+1))
      - set: e.buf
        value: append(e.buf, s...)
      - set: e.buf
        value: append(e.buf, 0)
  - of: (*encoder).appendBinary
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendBinary
        kind: self
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - opt:
          do:
            - set: e.buf
              to: binary.LittleEndian.AppendUint32
              value: binary.LittleEndian.AppendUint32(e.buf, uint32(len(data)+lengthSize))
            - set: e.buf
              value: append(e.buf, subtype)
            - set: e.buf
              to: binary.LittleEndian.AppendUint32
              value: binary.LittleEndian.AppendUint32(e.buf, uint32(len(data)))
            - set: e.buf
              value: append(e.buf, data...)
            - return: ""
          when: subtype == BinaryOld
      - set: e.buf
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(e.buf, uint32(len(data)))
      - set: e.buf
        value: append(e.buf, subtype)
      - set: e.buf
        value: append(e.buf, data...)
  - of: (*encoder).appendByteArray
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendByteArray
        kind: self
      - id: rv.Len
        kind: value
      - id: binary.LittleEndian.AppendUint32
        kind: value
    steps:
      - bind: "n"
        eval: rv.Len()
        to: rv.Len
      - set: e.buf
        to: binary.LittleEndian.AppendUint32
        value: binary.LittleEndian.AppendUint32(e.buf, uint32(n))
      - set: e.buf
        value: append(e.buf, BinaryGeneric)
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, rv.Bytes()...)
            - return: ""
          when: rv.CanAddr()
      - loop:
          do:
            - set: e.buf
              value: append(e.buf, byte(rv.Index(i).Uint()))
          key: i
          range: "n"
  - of: timeOf
    steps:
      - bind: tm, _
        eval: reflect.TypeAssert[time.Time](rv)
      - return: tm
  - of: bsonTypeName
    steps:
      - opt:
          do:
            - return: name
          init:
            bind: name
            eval: bsonTypeNames[t]
          when: name != ""
      - return: "\"type 0x\" + strconv.FormatUint(uint64(t), 16)"
  - of: (*encoder).encodeSpecial
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).encodeSpecial
        kind: self
      - id: e.encodeStdlib
        kind: internal
      - id: e.encodeValueType
        kind: internal
      - id: e.encodeTextType
        kind: internal
      - id: encodeMarker
        kind: internal
    steps:
      - opt:
          do:
            - return: t, err
          init:
            bind: t, handled, err
            eval: e.encodeStdlib(rv, p, st)
            to: e.encodeStdlib
          when: handled
      - opt:
          do:
            - return: t, err
          init:
            bind: t, handled, err
            eval: e.encodeValueType(rv, p)
            to: e.encodeValueType
          when: handled
      - opt:
          do:
            - return: t, err
          init:
            bind: t, handled, err
            eval: e.encodeTextType(rv, p, st)
            to: e.encodeTextType
          when: handled
      - return: encodeMarker(p)
        to: encodeMarker
  - of: (*encoder).encodeStdlib
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).encodeStdlib
        kind: self
      - id: e.appendInt64
        kind: internal
      - id: e.appendJSONNumber
        kind: internal
    steps:
      - switch:
          cases:
            - case: kindTime
              do:
                - eval: e.appendInt64(int64(NewDateTimeFromTime(timeOf(rv))))
                  to: e.appendInt64
                - return: typeDateTime, true, nil
            - case: kindDateTime
              do:
                - eval: e.appendInt64(rv.Int())
                  to: e.appendInt64
                - return: typeDateTime, true, nil
            - case: kindURL
              do:
                - bind: u, _
                  eval: reflect.TypeAssert[url.URL](rv)
                - return: typeString, true, e.appendString(u.String())
            - case: kindJSONNumber
              do:
                - bind: t, err
                  eval: e.appendJSONNumber(json.Number(rv.String()), st)
                  to: e.appendJSONNumber
                - return: t, true, err
            - default: true
              do:
                - return: 0, false, nil
          "on": p.kind
  - of: (*encoder).encodeValueType
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).encodeValueType
        kind: self
      - id: e.appendObjectID
        kind: internal
      - id: e.appendBinary
        kind: internal
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - switch:
          cases:
            - case: kindObjectID
              do:
                - eval: e.appendObjectID(rv)
                  to: e.appendObjectID
                - return: typeObjectID, true, nil
            - case: kindBinary
              do:
                - eval: e.appendBinary(byte(rv.Field(0).Uint()), rv.Field(1).Bytes())
                  to: e.appendBinary
                - return: typeBinary, true, nil
            - case: kindTimestamp
              do:
                - set: e.buf
                  to: binary.LittleEndian.AppendUint64
                  value: binary.LittleEndian.AppendUint64(e.buf, rv.Field(0).Uint()<<32|rv.Field(1).Uint())
                - return: typeTimestamp, true, nil
            - case: kindDecimal128
              do:
                - set: e.buf
                  to: binary.LittleEndian.AppendUint64
                  value: binary.LittleEndian.AppendUint64(e.buf, rv.Field(1).Uint())
                - set: e.buf
                  to: binary.LittleEndian.AppendUint64
                  value: binary.LittleEndian.AppendUint64(e.buf, rv.Field(0).Uint())
                - return: typeDecimal128, true, nil
            - case: kindDBPointer
              do:
                - return: typeDBPointer, true, e.appendDBPointer(rv)
            - default: true
              do:
                - return: 0, false, nil
          "on": p.kind
  - of: (*encoder).encodeTextType
    steps:
      - switch:
          cases:
            - case: kindRegex
              do:
                - return: typeRegex, true, e.appendRegex(rv.Field(0).String(), rv.Field(1).String())
            - case: kindJavaScript
              do:
                - return: typeJavaScript, true, e.appendString(rv.String())
            - case: kindSymbol
              do:
                - return: typeSymbol, true, e.appendString(rv.String())
            - case: kindCodeWithScope
              do:
                - return: typeCodeWithScope, true, e.appendCodeWithScope(rv, st)
            - default: true
              do:
                - return: 0, false, nil
          "on": p.kind
  - of: encodeMarker
    steps:
      - opt:
          do:
            - return: t, nil
          init:
            bind: t, ok
            eval: markerTypes[p.kind]
          when: ok
      - return: 0, marshalError(nil, "type "+p.typ.String()+" has no BSON form")
  - of: (*encoder).appendJSONNumber
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendJSONNumber
        kind: self
      - id: strconv
        kind: stdlib
      - id: e.appendInt
        kind: internal
      - id: e.appendDouble
        kind: internal
    steps:
      - opt:
          do:
            - return: e.appendInt(i, st.minSize), nil
              to: e.appendInt
          init:
            bind: i, err
            eval: strconv.ParseInt(string(n), 10, 64)
            to: strconv
          when: err == nil
      - bind: f, err
        eval: strconv.ParseFloat(string(n), 64)
        to: strconv
      - opt:
          do:
            - return: 0, marshalError(err, "a json.Number is neither an int64 nor a float64")
          when: err != nil
      - eval: e.appendDouble(f)
        to: e.appendDouble
      - return: typeDouble, nil
  - of: (*encoder).appendObjectID
    steps:
      - bind: id, _
        eval: reflect.TypeAssert[ObjectID](rv)
      - set: e.buf
        value: append(e.buf, id[:]...)
  - of: (*encoder).appendRegex
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendRegex
        kind: self
      - id: marshalError
        kind: internal
    steps:
      - opt:
          do:
            - return: marshalError(nil, "a regex holds a NUL byte or invalid UTF-8")
              to: marshalError
          when: "!validCString(pattern) || !validCString(options)"
      - set: e.buf
        value: append(e.buf, pattern...)
      - set: e.buf
        value: append(e.buf, 0)
      - set: e.buf
        value: append(e.buf, sortedOptions(options)...)
      - set: e.buf
        value: append(e.buf, 0)
      - return: nil
  - of: validCString
    steps:
      - return: strings.IndexByte(s, 0) < 0 && utf8.ValidString(s)
  - of: sortedOptions
    participants:
      - id: caller
        kind: actor
      - id: sortedOptions
        kind: self
      - id: slices
        kind: stdlib
