        eval: rv.Field(0).String()
        to: rv.Field(0).String
      - opt:
          do:
            - return: marshalError(nil, "a CodeWithScope's code is not valid UTF-8")
              to: marshalError
          when: "!utf8.ValidString(code)"
      - bind: scope
        eval: rv.Field(1)
        to: rv.Field
      - opt:
          do:
            - return: marshalError(nil, "a CodeWithScope has a nil scope")
              to: marshalError
          when: scope.IsNil()
      - bind: start
        eval: e.reserveLength()
        to: e.reserveLength
      - eval: e.appendStringBytes(code)
        to: e.appendStringBytes
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.appendScope(scope, st)
            to: e.appendScope
          when: err != nil
      - eval: binary.LittleEndian.PutUint32(e.buf[start:], uint32(len(e.buf)-start))
        to: binary.LittleEndian.PutUint32
      - return: nil
  - of: (*encoder).appendScope
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendScope
        kind: self
      - id: e.encodeAnyValue
        kind: internal
      - id: marshalError
        kind: internal
    steps:
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, emptyDocument[:]...)
            - return: nil
          when: nilTopLevelMap(scope.Elem())
      - bind: t, err
        eval: e.encodeAnyValue(scope.Interface(), scope.Elem(), st)
        to: e.encodeAnyValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: marshalError(nil, "a CodeWithScope's scope encodes as "+bsonTypeName(t)+", not a document")
              to: marshalError
          when: t != typeDocument
      - return: nil
  - of: marshalError
    participants:
      - id: caller
        kind: actor
      - id: marshalError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    corebson.CodeBSONMarshalFailed,
          		Reason:  "BSON_MARSHAL_FAILED",
          		Public:  "BSON encoding failed",
          		Private: "service/data/codec/bson.Marshal: " + detail,
          	})
        to: errs
  - of: unmarshalError
    participants:
      - id: caller
        kind: actor
      - id: unmarshalError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    corebson.CodeBSONUnmarshalFailed,
          		Reason:  "BSON_UNMARSHAL_FAILED",
          		Public:  "BSON decoding failed",
          		Private: "service/data/codec/bson.Unmarshal: " + detail,
          	})
        to: errs
  - of: depthError
    participants:
      - id: caller
        kind: actor
      - id: depthError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    corebson.CodeBSONDepthExceeded,
          		Reason:  "BSON_DEPTH_EXCEEDED",
          		Public:  "BSON nesting depth exceeds limit",
          		Private: "service/data/codec/bson." + op + ": nesting exceeds " + strconv.Itoa(maxBSONNestedLevels) + " levels",
          	})
        to: errs
  - of: valueError
    participants:
      - id: caller
        kind: actor
      - id: valueError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    corebson.CodeBSONValueInvalid,
          		Reason:  "BSON_VALUE_INVALID",
          		Public:  "BSON value is invalid",
          		Private: "service/data/codec/bson: " + detail,
          	})
        to: errs
  - of: ObjectIDFromHex
    participants:
      - id: caller
        kind: actor
      - id: ObjectIDFromHex
        kind: self
      - id: hex
        kind: stdlib
    steps:
      - var:
          name: id
          type: ObjectID
      - opt:
          do:
            - return: "NilObjectID, valueError(nil, \"ObjectIDFromHex: the input is not 24 hexadecimal digits\")"
          when: len(s) != objectIDHexLen
      - opt:
          do:
            - return: "NilObjectID, valueError(err, \"ObjectIDFromHex: the input is not 24 hexadecimal digits\")"
          init:
            bind: _, err
            eval: hex.Decode(id[:], []byte(s))
            to: hex
          when: err != nil
      - return: id, nil
  - of: ObjectID.Hex
    participants:
      - id: caller
        kind: actor
      - id: ObjectID.Hex
        kind: self
      - id: hex
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[objectIDHexLen]byte"
      - eval: hex.Encode(buf[:], id[:])
        to: hex
      - return: string(buf[:])
  - of: ObjectID.String
    steps:
      - return: "`ObjectID(\"` + id.Hex() + `\")`"
  - of: ObjectID.IsZero
    steps:
      - return: id == NilObjectID
  - of: ObjectID.Timestamp
    participants:
      - id: caller
        kind: actor
      - id: ObjectID.Timestamp
        kind: self
      - id: time.Unix(int64(binary.BigEndian.Uint32(id[0:4])), 0).UTC
        kind: value
    steps:
      - return: time.Unix(int64(binary.BigEndian.Uint32(id[0:4])), 0).UTC()
        to: time.Unix(int64(binary.BigEndian.Uint32(id[0:4])), 0).UTC
  - of: ObjectID.MarshalText
    participants:
      - id: caller
        kind: actor
      - id: ObjectID.MarshalText
        kind: self
      - id: hex
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[objectIDHexLen]byte"
      - eval: hex.Encode(buf[:], id[:])
        to: hex
      - return: slices.Clone(buf[:]), nil
        to: slices
  - of: (*ObjectID).UnmarshalText
    participants:
      - id: caller
        kind: actor
      - id: (*ObjectID).UnmarshalText
        kind: self
      - id: ObjectIDFromHex
        kind: internal
    steps:
      - bind: parsed, err
        eval: ObjectIDFromHex(string(text))
        to: ObjectIDFromHex
      - opt:
          do:
            - return: err
          when: err != nil
      - set: "*id"
        value: parsed
      - return: nil
  - of: ObjectID.MarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: ObjectID.MarshalJSON
        kind: self
      - id: hex
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[objectIDHexLen + 2]byte"
      - set: buf[0]
        value: "'\"'"
      - eval: hex.Encode(buf[1:objectIDHexLen+1], id[:])
        to: hex
      - set: buf[objectIDHexLen+1]
        value: "'\"'"
      - return: slices.Clone(buf[:]), nil
        to: slices
  - of: (*ObjectID).UnmarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: (*ObjectID).UnmarshalJSON
        kind: self
      - id: objectIDJSONText
        kind: internal
      - id: id.UnmarshalText
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: string(data) == "null"
      - bind: text, err
        eval: objectIDJSONText(data)
        to: objectIDJSONText
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - set: "*id"
              value: NilObjectID
            - return: nil
          when: text == ""
      - return: id.UnmarshalText([]byte(text))
        to: id.UnmarshalText
  - of: objectIDJSONText
    participants:
      - id: caller
        kind: actor
      - id: objectIDJSONText
        kind: self
      - id: json
        kind: stdlib
    steps:
      - var:
          name: text
          type: string
      - opt:
          do:
            - return: text, nil
          init:
            bind: err
            eval: json.Unmarshal(data, &text)
            to: json
          when: err == nil
      - var:
          name: wrapped
          type: |-
            struct {
            		// OID is the extended-JSON member.
            		OID *string `json:"$oid"`
            	}
      - opt:
          do:
            - return: "\"\", valueError(err, `ObjectID.UnmarshalJSON: the input is neither a JSON string nor {\"$oid\": string}`)"
          init:
            bind: err
            eval: json.Unmarshal(data, &wrapped)
            to: json
          when: err != nil || wrapped.OID == nil
      - return: "*wrapped.OID, nil"
  - of: fieldFlags.has
    steps:
      - return: f&flag == flag
  - of: planFor
    participants:
      - id: caller
        kind: actor
      - id: planFor
        kind: self
      - id: publishedPlan
        kind: internal
      - id: builder.plan
        kind: internal
      - id: plans.Store
        kind: value
    steps:
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: publishedPlan(t)
            to: publishedPlan
          when: ok
      - lock:
          mutex: planMu
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: publishedPlan(t)
            to: publishedPlan
          when: ok
      - bind: builder
        eval: "planBuilder{pending: map[reflect.Type]*typePlan{}}"
      - bind: built
        eval: builder.plan(t)
        to: builder.plan
      - loop:
          do:
            - eval: plans.Store(typ, p)
              to: plans.Store
          key: typ
          range: builder.pending
          value: p
      - return: built
  - of: publishedPlan
    participants:
      - id: caller
        kind: actor
      - id: publishedPlan
        kind: self
      - id: plans.Load
        kind: value
    steps:
      - bind: cached, ok
        eval: plans.Load(t)
        to: plans.Load
      - opt:
          do:
            - return: nil, false
          when: "!ok"
      - bind: p, ok
        eval: cached.(*typePlan)
      - return: p, ok
  - of: (*planBuilder).plan
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).plan
        kind: self
      - id: publishedPlan
        kind: internal
      - id: b.fill
        kind: internal
    steps:
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: publishedPlan(t)
            to: publishedPlan
          when: ok
      - opt:
          do:
            - return: p
          init:
            bind: p, ok
            eval: b.pending[t]
          when: ok
      - bind: p
        eval: "&typePlan{typ: t}"
      - set: b.pending[t]
        value: p
      - eval: b.fill(p)
        to: b.fill
      - return: p
  - of: (*planBuilder).fill
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fill
        kind: self
      - id: t.Implements
        kind: value
      - id: hookFor
        kind: internal
      - id: b.fillKind
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - set: p.zeroer
        to: t.Implements
        value: t.Implements(typeOfZeroer)
      - opt:
          do:
            - set: p.kind
              value: kind
            - return: ""
          init:
            bind: kind, ok
            eval: exactKinds[t]
          when: ok
      - set: p.marshaler
        to: hookFor
        value: hookFor(t, typeOfMarshaler)
      - set: p.unmarshaler
        to: hookFor
        value: hookFor(t, typeOfUnmarshaler)
      - eval: b.fillKind(p)
        to: b.fillKind
  - of: hookFor
    steps:
      - opt:
          do:
            - return: hookValue
          when: t.Implements(iface)
      - opt:
          do:
            - return: hookPointer
          when: t.Kind() != reflect.Pointer && reflect.PointerTo(t).Implements(iface)
      - return: hookNone
  - of: (*planBuilder).fillKind
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fillKind
        kind: self
      - id: b.fillSlice
        kind: internal
      - id: b.fillArray
        kind: internal
      - id: b.fillMap
        kind: internal
      - id: b.fillStruct
        kind: internal
      - id: b.plan
        kind: internal
      - id: interfaceKind
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - opt:
          do:
            - set: p.kind
              value: kind
            - return: ""
          init:
            bind: kind, ok
            eval: scalarKinds[t.Kind()]
          when: ok
      - switch:
          cases:
            - case: reflect.Slice
              do:
                - eval: b.fillSlice(p)
                  to: b.fillSlice
            - case: reflect.Array
              do:
                - eval: b.fillArray(p)
                  to: b.fillArray
            - case: reflect.Map
              do:
                - eval: b.fillMap(p)
                  to: b.fillMap
            - case: reflect.Struct
              do:
                - set: p.kind
                  value: kindStruct
                - eval: b.fillStruct(p)
                  to: b.fillStruct
            - case: reflect.Pointer
              do:
                - set: p.kind
                  value: kindPointer
                - set: p.elem
                  to: b.plan
                  value: b.plan(t.Elem())
            - case: reflect.Interface
              do:
                - set: p.kind
                  to: interfaceKind
                  value: interfaceKind(t)
            - default: true
              do:
                - set: p.kind
                  value: kindUnsupported
          "on": t.Kind()
  - of: interfaceKind
    steps:
      - opt:
          do:
            - return: kindAny
          when: t.NumMethod() == 0
      - return: kindInterface
  - of: (*planBuilder).fillSlice
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fillSlice
        kind: self
      - id: b.plan
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - set: p.elem
        to: b.plan
        value: b.plan(t.Elem())
      - opt:
          do:
            - set: p.kind
              value: kindByteSlice
            - return: ""
          when: t.Elem() == typeOfByte
      - opt:
          do:
            - set: p.kind
              value: kindDocSlice
            - return: ""
          when: t.ConvertibleTo(typeOfD)
      - set: p.kind
        value: kindSlice
  - of: (*planBuilder).fillArray
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fillArray
        kind: self
      - id: b.plan
        kind: internal
    steps:
      - bind: t
        eval: p.typ
      - set: p.elem
        to: b.plan
        value: b.plan(t.Elem())
      - switch:
          cases:
            - case: typeOfByte
              do:
                - set: p.kind
                  value: kindByteArray
            - case: typeOfE
              do:
                - set: p.kind
                  value: kindDocArray
            - default: true
              do:
                - set: p.kind
                  value: kindArray
          "on": t.Elem()
  - of: (*planBuilder).fillMap
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fillMap
        kind: self
      - id: b.plan
        kind: internal
      - id: keyModes
        kind: internal
      - id: recycler
        kind: package
    steps:
      - bind: t
        eval: p.typ
      - set: p.kind
        value: kindMap
      - set: p.elem
        to: b.plan
        value: b.plan(t.Elem())
      - set: p.stringAnyMap
        value: t.Key() == typeOfString && t.Elem() == typeOfAny
      - set: p.keyEncode, p.keyDecode
        to: keyModes
        value: keyModes(t.Key())
      - set: p.slots
        to: recycler
        value: |-
          recycler.NewPool(func() *mapSlots {
          		//: one settable key and one settable value of the map's types.
          		return &mapSlots{key: reflect.New(t.Key()).Elem(), value: reflect.New(t.Elem()).Elem()}
          	})
  - of: (*typePlan).acquireSlots
    participants:
      - id: caller
        kind: actor
      - id: (*typePlan).acquireSlots
        kind: self
      - id: p.slots.Get
        kind: value
    steps:
      - return: p.slots.Get()
        to: p.slots.Get
  - of: (*typePlan).releaseSlots
    participants:
      - id: caller
        kind: actor
      - id: (*typePlan).releaseSlots
        kind: self
      - id: s.key.SetZero
        kind: value
      - id: s.value.SetZero
        kind: value
      - id: p.slots.Put
        kind: value
    steps:
      - eval: s.key.SetZero()
        to: s.key.SetZero
      - eval: s.value.SetZero()
        to: s.value.SetZero
      - eval: p.slots.Put(s)
        to: p.slots.Put
  - of: keyModes
    participants:
      - id: caller
        kind: actor
      - id: keyModes
        kind: self
      - id: integerKeyMode
        kind: internal
    steps:
      - set: encode, decode
        value: keyUnsupported, keyUnsupported
      - switch:
          cases:
            - case: k.Kind() == reflect.String
              do:
                - set: encode
                  value: keyString
            - case: k.Implements(typeOfTextMarshaler)
              do:
                - set: encode
                  value: keyText
            - default: true
              do:
                - set: encode
                  to: integerKeyMode
                  value: integerKeyMode(k.Kind())
      - alt:
          - do:
              - set: decode
                value: keyText
            when: reflect.PointerTo(k).Implements(typeOfTextUnmarshaler)
          - do:
              - set: decode
                value: keyString
            when: k.Kind() == reflect.String
          - do:
              - set: decode
                to: integerKeyMode
                value: integerKeyMode(k.Kind())
            else: true
      - return: encode, decode
  - of: integerKeyMode
    steps:
      - return: integerKeyModes[k]
  - of: (*planBuilder).fillStruct
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).fillStruct
        kind: self
      - id: b.describeStruct
        kind: internal
    steps:
      - bind: fields, inlineMap, invalid
        eval: b.describeStruct(p.typ, map[reflect.Type]bool{})
        to: b.describeStruct
      - opt:
          do:
            - set: p.invalid
              value: invalid
            - return: ""
          when: invalid != ""
      - set: p.fields, p.inlineMap
        value: make([]*fieldPlan, 0, len(fields)), inlineMap
      - set: p.byName
        value: make(map[string]*fieldPlan, len(fields))
      - loop:
          do:
            - bind: copied
              eval: "*f"
            - set: copied.position
              value: i
            - set: p.fields
              value: append(p.fields, &copied)
            - set: p.byName[copied.name]
              value: "&copied"
          key: i
          range: fields
          value: f
  - of: (*planBuilder).describeStruct
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).describeStruct
        kind: self
      - id: t.Field
        kind: value
      - id: parseFieldTags
        kind: internal
      - id: inlineMapProblem
        kind: internal
      - id: b.newField
        kind: internal
      - id: b.inlineStruct
        kind: internal
      - id: dominantFields
        kind: internal
    steps:
      - set: chain[t]
        value: "true"
      - defer: delete(chain, t)
      - bind: candidates
        eval: make([]*fieldPlan, 0, t.NumField())
      - var:
          name: inlineMap
          type: "*fieldPlan"
      - loop:
          do:
            - bind: sf
              eval: t.Field(i)
              to: t.Field
            - bind: tags, skip
              eval: parseFieldTags(sf)
              to: parseFieldTags
            - opt:
                do:
                  - continue: true
                when: "!sf.IsExported() || skip"
            - opt:
                do:
                  - set: candidates
                    value: append(candidates, b.newField(sf, tags, []int{i}))
                  - continue: true
                when: "!tags.flags.has(flagInline)"
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, nil, invalid
                      init:
                        bind: invalid
                        eval: inlineMapProblem(t, sf.Type, inlineMap)
                        to: inlineMapProblem
                      when: invalid != ""
                  - set: inlineMap
                    to: b.newField
                    value: b.newField(sf, tags, []int{i})
                  - continue: true
                when: sf.Type.Kind() == reflect.Map
            - bind: inlined, invalid
              eval: b.inlineStruct(t, sf.Type, i, chain)
              to: b.inlineStruct
            - opt:
                do:
                  - return: nil, nil, invalid
                when: invalid != ""
            - set: candidates
              value: append(candidates, inlined...)
          key: i
          range: t.NumField()
      - bind: kept, invalid
        eval: dominantFields(t, candidates)
        to: dominantFields
      - return: kept, inlineMap, invalid
  - of: (*planBuilder).newField
    steps:
      - bind: flags
        eval: tags.flags
      - opt:
          do:
            - op: "|="
              set: flags
              value: flagBadName
          when: strings.IndexByte(tags.name, 0) >= 0 || !utf8.ValidString(tags.name)
      - return: |-
          &fieldPlan{
          		name:      tags.name,
          		nameBytes: []byte(tags.name),
          		goName:    sf.Name,
          		index:     index,
          		plan:      b.plan(sf.Type),
          		flags:     flags,
          	}
  - of: inlineMapProblem
    steps:
      - opt:
          do:
            - return: "\"struct \" + owner.String() + \" has more than one inline map\""
          when: existing != nil
      - opt:
          do:
            - return: "\"struct \" + owner.String() + \" has an inline map whose key type is not string\""
          when: mapType.Key() != typeOfString
      - return: "\"\""
  - of: (*planBuilder).inlineStruct
    participants:
      - id: caller
        kind: actor
      - id: (*planBuilder).inlineStruct
        kind: self
      - id: ft.Elem
        kind: value
      - id: b.describeStruct
        kind: internal
    steps:
      - opt:
          do:
            - set: ft
              to: ft.Elem
              value: ft.Elem()
          when: ft.Kind() == reflect.Pointer
      - opt:
          do:
            - return: nil, "struct " + owner.String() + " has an inline field that is not a struct, a struct pointer or a map"
          when: ft.Kind() != reflect.Struct
      - opt:
          do:
            - return: nil, "struct " + owner.String() + " inlines " + ft.String() + " recursively"
          when: chain[ft]
      - bind: inner, _, invalid
        eval: b.describeStruct(ft, chain)
        to: b.describeStruct
      - opt:
          do:
            - return: nil, invalid
          when: invalid != ""
      - bind: out
        eval: make([]*fieldPlan, 0, len(inner))
      - loop:
          do:
            - bind: copied
              eval: "*f"
            - set: copied.index
              value: append([]int{i}, f.index...)
            - set: out
              value: append(out, &copied)
          key: _
          range: inner
          value: f
      - return: out, ""
  - of: dominantFields
    participants:
      - id: caller
        kind: actor
      - id: dominantFields
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - eval: |-
          slices.SortStableFunc(candidates, func(x, y *fieldPlan) int {
          		//: name first.
          		if c := strings.Compare(x.name, y.name); c != 0 {
          			return c
          		}
          		//: then depth: the shallower occurrence first.
          		if len(x.index) != len(y.index) {
          			return len(x.index) - len(y.index)
          		}
          		//: then position.
          		return slices.Compare(x.index, y.index)
          	})
        to: slices
      - bind: kept
        eval: make([]*fieldPlan, 0, len(candidates))
      - loop:
          cond: i < len(candidates)
          do:
            - bind: j
              eval: i + 1
            - loop:
                cond: j < len(candidates) && candidates[j].name == candidates[i].name
                do:
                  - op: ++
                    set: j
            - opt:
                do:
                  - return: nil, "struct " + t.String() + " has two fields named " + candidates[i].name + " at the same depth"
                when: j-i > 1 && len(candidates[i].index) == len(candidates[i+1].index)
            - set: kept
              value: append(kept, candidates[i])
            - set: i
              value: j
          init: i := 0
      - eval: |-
          slices.SortFunc(kept, func(x, y *fieldPlan) int {
          		//: lexicographic on the index path.
          		return slices.Compare(x.index, y.index)
          	})
        to: slices
      - return: kept, ""
  - of: parseFieldTags
    participants:
      - id: caller
        kind: actor
      - id: parseFieldTags
        kind: self
      - id: sf.Tag.Lookup
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: tags
        eval: "fieldTags{name: strings.ToLower(sf.Name)}"
      - bind: tag, ok
        eval: sf.Tag.Lookup("bson")
        to: sf.Tag.Lookup
      - opt:
          do:
            - set: tag
              value: string(sf.Tag)
          when: "!ok && len(sf.Tag) > 0 && !strings.Contains(string(sf.Tag), \":\")"
      - opt:
          do:
            - return: tags, true
          when: tag == "-"
      - bind: first, rest, more
        eval: strings.Cut(tag, ",")
        to: strings
      - opt:
          do:
            - set: tags.name
              value: first
          when: first != ""
      - op: "|="
        set: tags.flags
        value: tagOptions[first]
      - loop:
          cond: more
          do:
            - var:
                name: option
                type: string
            - set: option, rest, more
              to: strings
              value: strings.Cut(rest, ",")
            - op: "|="
              set: tags.flags
              value: tagOptions[option]
      - return: tags, false
  - of: (*typePlan).lookupField
    participants:
      - id: caller
        kind: actor
      - id: (*typePlan).lookupField
        kind: self
      - id: p.foldedField
        kind: internal
    steps:
      - opt:
          do:
            - return: f
          init:
            bind: f, ok
            eval: p.byName[string(key)]
          when: ok
      - opt:
          do:
            - return: nil
          when: "!needsFolding(key)"
      - return: p.foldedField(key)
        to: p.foldedField
  - of: (*typePlan).foldedField
    steps:
      - return: p.byName[strings.ToLower(string(key))]
  - of: Binary.Equal
    steps:
      - return: b.Subtype == other.Subtype && bytes.Equal(b.Data, other.Data)
  - of: Binary.IsZero
    steps:
      - return: b.Subtype == BinaryGeneric && len(b.Data) == 0
  - of: NewDateTimeFromTime
    steps:
      - return: DateTime(t.Unix()*1e3 + int64(t.Nanosecond())/1e6)
  - of: DateTime.Time
    participants:
      - id: caller
        kind: actor
      - id: DateTime.Time
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Unix(int64(dt)/1e3, int64(dt)%1e3*1e6)
        to: time
  - of: DateTime.MarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: DateTime.MarshalJSON
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.Marshal(dt.Time().UTC())
        to: json
  - of: (*DateTime).UnmarshalJSON
    participants:
      - id: caller
        kind: actor
      - id: (*DateTime).UnmarshalJSON
        kind: self
      - id: json
        kind: stdlib
      - id: valueError
        kind: internal
      - id: NewDateTimeFromTime
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: string(data) == "null"
      - var:
          name: parsed
          type: time.Time
      - opt:
          do:
            - return: "valueError(err, \"DateTime.UnmarshalJSON: the input is not an RFC 3339 JSON string\")"
              to: valueError
          init:
            bind: err
            eval: json.Unmarshal(data, &parsed)
            to: json
          when: err != nil
      - set: "*dt"
        to: NewDateTimeFromTime
        value: NewDateTimeFromTime(parsed)
      - return: nil
  - of: Regex.String
    participants:
      - id: caller
        kind: actor
      - id: Regex.String
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: "fmt.Sprintf(`{\"pattern\": \"%s\", \"options\": \"%s\"}`, r.Pattern, r.Options)"
        to: fmt
  - of: Regex.Equal
    steps:
      - return: r.Pattern == other.Pattern && r.Options == other.Options
  - of: Regex.IsZero
    steps:
      - return: r.Pattern == "" && r.Options == ""
  - of: DBPointer.String
    participants:
      - id: caller
        kind: actor
      - id: DBPointer.String
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: "fmt.Sprintf(`{\"db\": \"%s\", \"pointer\": \"%s\"}`, p.DB, p.Pointer)"
        to: fmt
  - of: DBPointer.Equal
    steps:
      - return: p == other
  - of: DBPointer.IsZero
    steps:
      - return: p.DB == "" && p.Pointer.IsZero()
  - of: CodeWithScope.String
    participants:
      - id: caller
        kind: actor
      - id: CodeWithScope.String
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - return: "fmt.Sprintf(`{\"code\": \"%s\", \"scope\": %v}`, c.Code, c.Scope)"
        to: fmt
  - of: Timestamp.After
    steps:
      - return: t.T > other.T || (t.T == other.T && t.I > other.I)
  - of: Timestamp.Before
    steps:
      - return: t.T < other.T || (t.T == other.T && t.I < other.I)
  - of: Timestamp.Equal
    steps:
      - return: t == other
  - of: Timestamp.IsZero
    steps:
      - return: t.T == 0 && t.I == 0
  - of: Timestamp.Compare
    steps:
      - switch:
          cases:
            - case: t.Before(other)
              do:
                - return: "-1"
            - case: t.After(other)
              do:
                - return: "1"
      - return: "0"
  - of: validateRoot
    participants:
      - id: caller
        kind: actor
      - id: validateRoot
        kind: self
      - id: v.root
        kind: internal
      - id: depthError
        kind: internal
      - id: unmarshalError
        kind: internal
    steps:
      - bind: v
        eval: validator{}
      - opt:
          do:
            - opt:
                do:
                  - return: depthError("Unmarshal")
                    to: depthError
                when: problem.depth
            - return: "unmarshalError(nil, \"malformed document at byte \"+strconv.Itoa(problem.offset)+\": \"+problem.rule)"
              to: unmarshalError
          init:
            bind: problem
            eval: v.root(data)
            to: v.root
          when: problem != nil
      - return: nil
  - of: validator.root
    participants:
      - id: caller
        kind: actor
      - id: validator.root
        kind: self
      - id: v.document
        kind: internal
    steps:
      - opt:
          do:
            - return: "&validationError{offset: 0, rule: \"shorter than the smallest document (5 bytes)\"}"
          when: len(data) < minDocumentSize
      - opt:
          do:
            - return: "&validationError{offset: 0, rule: \"the declared length is not the input length\"}"
          when: int64(readInt32(data)) != int64(len(data))
      - return: v.document(data, 0, 1)
        to: v.document
  - of: validator.document
    participants:
      - id: caller
        kind: actor
      - id: validator.document
        kind: self
      - id: v.element
        kind: internal
    steps:
      - opt:
          do:
            - return: "&validationError{offset: base, depth: true}"
          when: depth > maxBSONNestedLevels
      - bind: end
        eval: len(doc) - 1
      - opt:
          do:
            - return: "&validationError{offset: base + end, rule: \"a document does not end with its terminator\"}"
          when: doc[end] != 0
      - bind: pos
        eval: lengthSize
      - loop:
          cond: pos < end
          do:
            - bind: next, problem
              eval: v.element(doc[:end], pos, base, depth)
              to: v.element
            - opt:
                do:
                  - return: problem
                when: problem != nil
            - set: pos
              value: next
      - return: nil
  - of: validator.element
    participants:
      - id: caller
        kind: actor
      - id: validator.element
        kind: self
      - id: cstringEnd
        kind: internal
      - id: v.value
        kind: internal
    steps:
      - bind: t
        eval: body[pos]
      - op: ++
        set: pos
      - bind: keyEnd
        eval: cstringEnd(body[pos:])
        to: cstringEnd
      - opt:
          do:
            - return: "0, &validationError{offset: base + pos, rule: \"an element name is not terminated\"}"
          when: keyEnd < 0
      - opt:
          do:
            - return: "0, &validationError{offset: base + pos, rule: \"an element name is not UTF-8\"}"
          when: "!utf8.Valid(body[pos : pos+keyEnd])"
      - op: +=
        set: pos
        value: keyEnd + 1
      - bind: size, problem
        eval: v.value(t, body[pos:], base+pos, depth)
        to: v.value
      - opt:
          do:
            - return: 0, problem
          when: problem != nil
      - return: pos + size, nil
  - of: validator.value
    participants:
      - id: caller
        kind: actor
      - id: validator.value
        kind: self
      - id: v.str
        kind: internal
      - id: v.nested
        kind: internal
      - id: v.binary
        kind: internal
      - id: v.regex
        kind: internal
      - id: v.dbPointer
        kind: internal
      - id: v.codeWithScope
        kind: internal
      - id: v.boolean
        kind: internal
      - id: fixedValueSize
        kind: internal
    steps:
      - switch:
          cases:
            - case: typeString, typeJavaScript, typeSymbol
              do:
                - return: v.str(b, base)
                  to: v.str
            - case: typeDocument, typeArray
              do:
                - return: v.nested(b, base, depth)
                  to: v.nested
            - case: typeBinary
              do:
                - return: v.binary(b, base)
                  to: v.binary
            - case: typeRegex
              do:
                - return: v.regex(b, base)
                  to: v.regex
            - case: typeDBPointer
              do:
                - return: v.dbPointer(b, base)
                  to: v.dbPointer
            - case: typeCodeWithScope
              do:
                - return: v.codeWithScope(b, base, depth)
                  to: v.codeWithScope
            - case: typeBoolean
              do:
                - return: v.boolean(b, base)
                  to: v.boolean
          "on": t
      - bind: size, fixed
        eval: fixedValueSize(t)
        to: fixedValueSize
      - opt:
          do:
            - return: "0, &validationError{offset: base - 1, rule: \"an element has an unknown type byte\"}"
          when: "!fixed"
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a fixed-width value is truncated\"}"
          when: size > len(b)
      - return: size, nil
  - of: validator.str
    participants:
      - id: caller
        kind: actor
      - id: validator.str
        kind: self
      - id: readInt32
        kind: internal
    steps:
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a string length is truncated\"}"
          when: len(b) < lengthSize
      - bind: declared
        eval: readInt32(b)
        to: readInt32
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a string length is out of range\"}"
          when: declared < 1 || int64(declared) > int64(len(b)-lengthSize)
      - bind: end
        eval: lengthSize + int(declared) - 1
      - opt:
          do:
            - return: "0, &validationError{offset: base + end, rule: \"a string is not terminated where its length ends\"}"
          when: b[end] != 0
      - opt:
          do:
            - return: "0, &validationError{offset: base + lengthSize, rule: \"a string is not UTF-8\"}"
          when: "!utf8.Valid(b[lengthSize:end])"
      - return: end + 1, nil
  - of: validator.nested
    participants:
      - id: caller
        kind: actor
      - id: validator.nested
        kind: self
      - id: readInt32
        kind: internal
      - id: v.document
        kind: internal
    steps:
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a document length is truncated\"}"
          when: len(b) < lengthSize
      - bind: declared
        eval: readInt32(b)
        to: readInt32
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a document length is out of range\"}"
          when: declared < int32(minDocumentSize) || int64(declared) > int64(len(b))
      - opt:
          do:
            - return: 0, problem
          init:
            bind: problem
            eval: v.document(b[:declared], base, depth+1)
            to: v.document
          when: problem != nil
      - return: int(declared), nil
  - of: validator.binary
    participants:
      - id: caller
        kind: actor
      - id: validator.binary
        kind: self
      - id: readInt32
        kind: internal
    steps:
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a binary header is truncated\"}"
          when: len(b) < binaryHeaderSize
      - bind: declared
        eval: readInt32(b)
        to: readInt32
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a binary length is out of range\"}"
          when: declared < 0 || int64(declared) > int64(len(b)-binaryHeaderSize)
      - opt:
          do:
            - opt:
                do:
                  - return: "0, &validationError{offset: base + binaryHeaderSize, rule: \"a subtype 0x02 binary's inner length disagrees with its length\"}"
                when: declared < int32(lengthSize) || readInt32(b[binaryHeaderSize:]) != declared-int32(lengthSize)
          when: b[lengthSize] == BinaryOld
      - return: binaryHeaderSize + int(declared), nil
  - of: validator.regex
    participants:
      - id: caller
        kind: actor
      - id: validator.regex
        kind: self
      - id: cstringEnd
        kind: internal
    steps:
      - bind: size
        eval: "0"
      - loop:
          do:
            - bind: "n"
              eval: cstringEnd(b[size:])
              to: cstringEnd
            - opt:
                do:
                  - return: "0, &validationError{offset: base + size, rule: \"a regex is not terminated\"}"
                when: n < 0
            - opt:
                do:
                  - return: "0, &validationError{offset: base + size, rule: \"a regex is not UTF-8\"}"
                when: "!utf8.Valid(b[size : size+n])"
            - op: +=
              set: size
              value: n + 1
          range: "2"
      - return: size, nil
  - of: validator.dbPointer
    participants:
      - id: caller
        kind: actor
      - id: validator.dbPointer
        kind: self
      - id: v.str
        kind: internal
    steps:
      - bind: size, problem
        eval: v.str(b, base)
        to: v.str
      - opt:
          do:
            - return: 0, problem
          when: problem != nil
      - opt:
          do:
            - return: "0, &validationError{offset: base + size, rule: \"a DBPointer's ObjectID is truncated\"}"
          when: len(b)-size < objectIDSize
      - return: size + objectIDSize, nil
  - of: validator.codeWithScope
    participants:
      - id: caller
        kind: actor
      - id: validator.codeWithScope
        kind: self
      - id: readInt32
        kind: internal
      - id: v.str
        kind: internal
      - id: v.nested
        kind: internal
    steps:
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a code-with-scope length is truncated\"}"
          when: len(b) < lengthSize
      - bind: declared
        eval: readInt32(b)
        to: readInt32
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a code-with-scope length is out of range\"}"
          when: declared < int32(minCodeWithScopeSize) || int64(declared) > int64(len(b))
      - bind: value
        eval: b[:declared]
      - bind: code, problem
        eval: v.str(value[lengthSize:], base+lengthSize)
        to: v.str
      - opt:
          do:
            - return: 0, problem
          when: problem != nil
      - bind: scopeAt
        eval: lengthSize + code
      - bind: scope, problem
        eval: v.nested(value[scopeAt:], base+scopeAt, depth)
        to: v.nested
      - opt:
          do:
            - return: 0, problem
          when: problem != nil
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a code-with-scope length disagrees with its parts\"}"
          when: scopeAt+scope != int(declared)
      - return: int(declared), nil
  - of: validator.boolean
    steps:
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a boolean is truncated\"}"
          when: len(b) < 1
      - opt:
          do:
            - return: "0, &validationError{offset: base, rule: \"a boolean is neither 0x00 nor 0x01\"}"
          when: b[0] > 1
      - return: 1, nil
  - of: readInt32
    steps:
      - return: int32(binary.LittleEndian.Uint32(b))
  - of: readInt64
    steps:
      - return: int64(binary.LittleEndian.Uint64(b))
  - of: readDouble
    participants:
      - id: caller
        kind: actor
      - id: readDouble
        kind: self
      - id: math
        kind: stdlib
    steps:
      - return: math.Float64frombits(binary.LittleEndian.Uint64(b))
        to: math
  - of: cstringEnd
    participants:
      - id: caller
        kind: actor
      - id: cstringEnd
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - return: bytes.IndexByte(b, 0)
        to: bytes
  - of: valueSize
    participants:
      - id: caller
        kind: actor
      - id: valueSize
        kind: self
      - id: fixedValueSize
        kind: internal
      - id: variableValueSize
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: "-1"
                when: size > len(b)
            - return: size
          init:
            bind: size, fixed
            eval: fixedValueSize(t)
            to: fixedValueSize
          when: fixed
      - return: variableValueSize(t, b)
        to: variableValueSize
  - of: fixedValueSize
    steps:
      - bind: width
        eval: fixedWidths[t]
      - opt:
          do:
            - return: 0, false
          when: width == 0
      - return: int(width) - 1, true
  - of: variableValueSize
    participants:
      - id: caller
        kind: actor
      - id: variableValueSize
        kind: self
      - id: prefixedSize
        kind: internal
      - id: dbPointerSize
        kind: internal
      - id: regexSize
        kind: internal
    steps:
      - switch:
          cases:
            - case: typeString, typeJavaScript, typeSymbol
              do:
                - return: prefixedSize(b, lengthSize)
                  to: prefixedSize
            - case: typeDocument, typeArray, typeCodeWithScope
              do:
                - return: prefixedSize(b, 0)
                  to: prefixedSize
            - case: typeBinary
              do:
                - return: prefixedSize(b, binaryHeaderSize)
                  to: prefixedSize
            - case: typeDBPointer
              do:
                - return: dbPointerSize(b)
                  to: dbPointerSize
            - case: typeRegex
              do:
                - return: regexSize(b)
                  to: regexSize
          "on": t
      - return: "-1"
  - of: prefixedSize
    participants:
      - id: caller
        kind: actor
      - id: prefixedSize
        kind: self
      - id: readInt32
        kind: internal
    steps:
      - opt:
          do:
            - return: "-1"
          when: len(b) < lengthSize
      - bind: declared
        eval: readInt32(b)
        to: readInt32
      - opt:
          do:
            - return: "-1"
          when: declared < 0 || int(declared) > len(b)-extra
      - return: int(declared) + extra
  - of: dbPointerSize
    participants:
      - id: caller
        kind: actor
      - id: dbPointerSize
        kind: self
      - id: prefixedSize
        kind: internal
    steps:
      - bind: str
        eval: prefixedSize(b, lengthSize)
        to: prefixedSize
      - opt:
          do:
            - return: "-1"
          when: str < 0 || len(b)-str < objectIDSize
      - return: str + objectIDSize
  - of: regexSize
    participants:
      - id: caller
        kind: actor
      - id: regexSize
        kind: self
      - id: cstringEnd
        kind: internal
    steps:
      - bind: pattern
        eval: cstringEnd(b)
        to: cstringEnd
      - opt:
          do:
            - return: "-1"
          when: pattern < 0
      - bind: options
        eval: cstringEnd(b[pattern+1:])
        to: cstringEnd
      - opt:
          do:
            - return: "-1"
          when: options < 0
      - return: pattern + 1 + options + 1
