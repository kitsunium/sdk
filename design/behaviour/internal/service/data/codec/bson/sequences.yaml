          do:
            - return: options
          when: len(options) < 2
      - bind: runes
        eval: "[]rune(options)"
      - eval: slices.Sort(runes)
        to: slices
      - return: string(runes)
  - of: (*encoder).appendDBPointer
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendDBPointer
        kind: self
      - id: e.appendString
        kind: internal
      - id: e.appendObjectID
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.appendString(rv.Field(0).String())
            to: e.appendString
          when: err != nil
      - eval: e.appendObjectID(rv.Field(1))
        to: e.appendObjectID
      - return: nil
  - of: (*encoder).appendCodeWithScope
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendCodeWithScope
        kind: self
      - id: rv.Field(0).String
        kind: value
      - id: marshalError
        kind: internal
      - id: rv.Field
        kind: value
      - id: e.reserveLength
        kind: internal
      - id: e.appendStringBytes
        kind: internal
      - id: e.appendScope
        kind: internal
      - id: binary.LittleEndian.PutUint32
        kind: value
    steps:
