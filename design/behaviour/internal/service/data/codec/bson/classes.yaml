apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxBSONBytes caps the Unmarshal input for untrusted payloads (CWE-400). The
      validator never allocates from a declared length it has not checked, so
      the cap bounds what one call can make the decoder allocate; 10 MiB covers
      realistic documents and matches the other codecs.
    items:
      - name: maxBSONBytes
        type: int
        value: 10 << 20
    name: maxBSONBytes
  - doc: Decimal128 layout and range.
    grouped: true
    items:
      - doc: decimalExponentBias is added to the exponent to store it unsigned.
        name: decimalExponentBias
        type: int
        value: "6176"
      - doc: decimalMaxExponent is the largest exponent a coefficient can carry.
        name: decimalMaxExponent
        type: int
        value: "6111"
      - doc: decimalMinExponent is the smallest exponent a coefficient can carry.
        name: decimalMinExponent
        type: int
        value: "-6176"
      - doc: decimalMaxDigits is the most significant digits a coefficient holds.
        name: decimalMaxDigits
        type: int
        value: "34"
      - doc: decimalExponentMask keeps the 14 exponent bits once shifted down.
        name: decimalExponentMask
        type: uint64
        value: 1<<14 - 1
      - doc: decimalCoefficientHighMask keeps the coefficient's 49 high bits.
        name: decimalCoefficientHighMask
        type: uint64
        value: 1<<49 - 1
      - doc: |-
          decimalMaxCoefficientHigh and decimalMaxCoefficientLow are 10^34-1, the
          largest coefficient. A larger one is non-canonical and reads as zero.
        name: decimalMaxCoefficientHigh
        type: uint64
        value: "0x0001_ED09_BEAD_87C0"
      - doc: decimalMaxCoefficientLow is the low half of 10^34-1.
        name: decimalMaxCoefficientLow
        type: uint64
        value: "0x378D_8E63_FFFF_FFFF"
      - doc: decimalSignBit is the sign, the top bit of the high half.
        name: decimalSignBit
        type: uint64
        value: 1 << 63
      - doc: |-
          decimalNaNBits and decimalInfBits are the combination-field patterns
          that mark the two specials, in the high half's top bits after the sign.
        name: decimalNaNBits
        type: uint64
        value: 0x1F << 58
      - doc: decimalInfBits marks an infinity.
        name: decimalInfBits
        type: uint64
        value: 0x1E << 58
      - doc: |-
          decimalChunk is the power of ten the coefficient is printed nine digits
          at a time by.
        name: decimalChunk
        type: uint64
        value: "1_000_000_000"
      - doc: decimalChunkDigits is how many digits decimalChunk carries.
        name: decimalChunkDigits
        type: int
        value: "9"
      - doc: |-
          decimalScientificFloor is the smallest adjusted exponent printed without
          an exponent, as the specification fixes it.
        name: decimalScientificFloor
        type: int
        value: "-6"
      - doc: |-
          decimalLargeForm is the value of the two bits after the sign that mark
          the large-coefficient form.
        name: decimalLargeForm
        type: uint64
        value: "3"
      - doc: decimalRadix is the base the coefficient is written in.
        name: decimalRadix
        type: uint64
        value: "10"
      - doc: |-
          decimalExponentSaturation bounds a scanned exponent's magnitude: past it
          the value is out of range whatever the coefficient, and saturating keeps
          the arithmetic inside an int on every platform.
        name: decimalExponentSaturation
        type: int
        value: "100_000_000"
    name: decimalExponentBias
  - doc: twoTo63 is 2^63, the first double past the int64 range.
    items:
      - name: twoTo63
        type: float64
        value: 1 << 63
    name: twoTo63
  - doc: |-
      timeStringLayout is the layout a BSON string decodes into a time.Time by,
      the one the previous library accepted.
    items:
      - name: timeStringLayout
        type: string
        value: "\"2006-01-02T15:04:05.999Z07:00\""
    name: timeStringLayout
  - doc: Encoder sizing.
    grouped: true
    items:
      - doc: |-
          maxRetainedSegments bounds the segment lists the map encoder pools: a
          list grown past it by a very wide map is dropped instead of pinned.
        name: maxRetainedSegments
        type: int
        value: "4096"
      - doc: elementHeadroom is the free space reserve keeps before each element.
        name: elementHeadroom
        type: int
        value: "64"
    name: maxRetainedSegments
  - doc: objectIDHexLen is the length of an ObjectID's hexadecimal form.
    items:
      - name: objectIDHexLen
        type: int
        value: 2 * objectIDSize
    name: objectIDHexLen
  - doc: |-
      The mappings. Exact types are matched before kinds, so a time.Time is a
      datetime and not a struct, and a []byte is a binary and not an array.
    grouped: true
    items:
      - doc: |-
          kindUnsupported has no BSON form: channels, functions, complex numbers,
          uintptr, unsafe.Pointer.
        name: kindUnsupported
        type: planKind
        value: iota
      - doc: kindBool is a bool.
        name: kindBool
      - doc: "kindInt32 is int8, int16 or int32: always an int32."
        name: kindInt32
      - doc: "kindInt is int: an int32 when the value fits, an int64 otherwise."
        name: kindInt
      - doc: "kindInt64 is int64: an int64, or an int32 under minsize when it fits."
        name: kindInt64
      - doc: "kindUint16 is uint8 or uint16: always an int32."
        name: kindUint16
      - doc: |-
          kindUint64 is uint, uint32 or uint64: an int64, an int32 under minsize
          when it fits; past the int64 range it is refused.
        name: kindUint64
      - doc: kindFloat32 is float32, written as a double.
        name: kindFloat32
      - doc: kindFloat64 is float64.
        name: kindFloat64
      - doc: kindString is a string kind.
        name: kindString
      - doc: "kindBytes is exactly []byte: a generic binary, null when nil."
        name: kindBytes
      - doc: kindByteSlice is another slice type whose element type is byte.
        name: kindByteSlice
      - doc: kindByteArray is an array whose element type is byte.
        name: kindByteArray
      - doc: "kindSlice is any other slice: an array, null when nil."
        name: kindSlice
      - doc: "kindArray is any other array: an array."
        name: kindArray
      - doc: kindD is exactly D.
        name: kindD
      - doc: "kindDocSlice is another slice type convertible to D: a document."
        name: kindDocSlice
      - doc: "kindDocArray is an array of E: a document."
        name: kindDocArray
      - doc: "kindMap is a map: a document, null when nil."
        name: kindMap
      - doc: "kindStruct is a struct: a document of its fields."
        name: kindStruct
      - doc: "kindPointer is a pointer: its target, null when nil."
        name: kindPointer
      - doc: "kindAny is the empty interface: its dynamic value, null when nil."
        name: kindAny
      - doc: |-
          kindInterface is a non-empty interface: its dynamic value on encode;
          there is nothing to decode into.
        name: kindInterface
      - doc: "kindTime is time.Time: a UTC datetime, truncated to the millisecond."
        name: kindTime
      - doc: "kindURL is url.URL: its String form."
        name: kindURL
      - doc: |-
          kindJSONNumber is json.Number: an int64 when it parses as one, a double
          otherwise.
        name: kindJSONNumber
      - doc: kindObjectID is ObjectID.
        name: kindObjectID
      - doc: kindDateTime is DateTime.
        name: kindDateTime
      - doc: kindBinary is Binary.
        name: kindBinary
      - doc: kindRegex is Regex.
        name: kindRegex
      - doc: kindDBPointer is DBPointer.
        name: kindDBPointer
      - doc: kindJavaScript is JavaScript.
        name: kindJavaScript
      - doc: kindSymbol is Symbol.
        name: kindSymbol
      - doc: kindCodeWithScope is CodeWithScope.
        name: kindCodeWithScope
      - doc: kindTimestamp is Timestamp.
        name: kindTimestamp
      - doc: kindDecimal128 is Decimal128.
        name: kindDecimal128
      - doc: kindMinKey is MinKey.
        name: kindMinKey
      - doc: kindMaxKey is MaxKey.
        name: kindMaxKey
      - doc: kindUndefined is Undefined.
        name: kindUndefined
      - doc: kindNull is Null.
        name: kindNull
    name: kindUnsupported
  - doc: The ways a method is reached.
    grouped: true
    items:
      - doc: "hookNone: the type does not have the method."
        name: hookNone
        type: hookMode
        value: iota
      - doc: "hookValue: the type itself has it."
        name: hookValue
      - doc: |-
          hookPointer: only its pointer has it, so it is called on an addressable
          value and the kind mapping is used on any other.
        name: hookPointer
    name: hookNone
  - doc: The key mappings.
    grouped: true
    items:
      - doc: "keyUnsupported: the key type has no element-name form."
        name: keyUnsupported
        type: keyMode
        value: iota
      - doc: "keyString: a string kind, used as is."
        name: keyString
      - doc: "keyText: encoding.TextMarshaler or TextUnmarshaler."
        name: keyText
      - doc: "keyInt: a signed integer kind, in decimal."
        name: keyInt
      - doc: "keyUint: an unsigned integer kind, in decimal."
        name: keyUint
    name: keyUnsupported
  - doc: The options a bson tag sets, and the one property of a name the plan checks.
    grouped: true
    items:
      - doc: flagOmitEmpty leaves the field out when it is empty.
        name: flagOmitEmpty
        type: fieldFlags
        value: 1 << iota
      - doc: flagMinSize writes an integer that fits as an int32.
        name: flagMinSize
      - doc: flagTruncate lets a decode drop a double's fraction into an integer.
        name: flagTruncate
      - doc: |-
          flagInline flattens a struct's fields, or collects unclaimed elements
          into a map.
        name: flagInline
      - doc: |-
          flagBadName marks a name holding a NUL or invalid UTF-8, which an
          element name cannot be; encoding the field fails.
        name: flagBadName
    name: flagOmitEmpty
  - doc: |-
      Element type bytes, BSON 1.1. The deprecated types (undefined, DBPointer,
      symbol, code with scope) are still read and written: a document an older
      tool produced decodes, and re-encodes to the same bytes.
    grouped: true
    items:
      - doc: typeDouble is a 64-bit IEEE 754 binary floating point.
        name: typeDouble
        type: byte
        value: "0x01"
      - doc: typeString is an int32-length-prefixed, NUL-terminated UTF-8 string.
        name: typeString
        type: byte
        value: "0x02"
      - doc: typeDocument is an embedded document.
        name: typeDocument
        type: byte
        value: "0x03"
      - doc: typeArray is a document whose keys are "0", "1", ….
        name: typeArray
        type: byte
        value: "0x04"
      - doc: typeBinary is an int32 length, a subtype byte and the bytes.
        name: typeBinary
        type: byte
        value: "0x05"
      - doc: "typeUndefined is the deprecated undefined value: no payload."
        name: typeUndefined
        type: byte
        value: "0x06"
      - doc: typeObjectID is twelve bytes.
        name: typeObjectID
        type: byte
        value: "0x07"
      - doc: typeBoolean is one byte, 0x00 or 0x01 and nothing else.
        name: typeBoolean
        type: byte
        value: "0x08"
      - doc: typeDateTime is milliseconds since the Unix epoch, UTC, as an int64.
        name: typeDateTime
        type: byte
        value: "0x09"
      - doc: "typeNull is null: no payload."
        name: typeNull
        type: byte
        value: "0x0A"
      - doc: "typeRegex is two cstrings: the pattern, then the options."
        name: typeRegex
        type: byte
        value: "0x0B"
      - doc: "typeDBPointer is the deprecated DBPointer: a string and twelve bytes."
        name: typeDBPointer
        type: byte
        value: "0x0C"
      - doc: typeJavaScript is JavaScript code, laid out as a string.
        name: typeJavaScript
        type: byte
        value: "0x0D"
      - doc: typeSymbol is the deprecated symbol, laid out as a string.
        name: typeSymbol
        type: byte
        value: "0x0E"
      - doc: typeCodeWithScope is an int32 total length, a string and a document.
        name: typeCodeWithScope
        type: byte
        value: "0x0F"
      - doc: typeInt32 is a 32-bit signed integer.
        name: typeInt32
        type: byte
        value: "0x10"
      - doc: "typeTimestamp is the replication timestamp: increment, then seconds."
        name: typeTimestamp
        type: byte
        value: "0x11"
      - doc: typeInt64 is a 64-bit signed integer.
        name: typeInt64
        type: byte
        value: "0x12"
      - doc: typeDecimal128 is an IEEE 754-2008 decimal128 in BID encoding.
        name: typeDecimal128
        type: byte
        value: "0x13"
      - doc: "typeMinKey compares lower than every other value: no payload."
        name: typeMinKey
        type: byte
        value: "0xFF"
      - doc: "typeMaxKey compares higher than every other value: no payload."
        name: typeMaxKey
        type: byte
        value: "0x7F"
    name: typeDouble
  - doc: |-
      Binary subtypes, BSON 1.1. A subtype is a single byte the codec carries
      through unchanged; only BinaryGeneric and BinaryOld decode into []byte.
    grouped: true
    items:
      - doc: BinaryGeneric is the default subtype, and the one a []byte is written as.
        name: BinaryGeneric
        type: byte
        value: "0x00"
      - doc: BinaryFunction marks a function.
        name: BinaryFunction
        type: byte
        value: "0x01"
      - doc: |-
          BinaryOld is the deprecated generic subtype: its bytes are themselves an
          int32 length followed by that many bytes, and the codec writes and checks
          that inner length.
        name: BinaryOld
        type: byte
        value: "0x02"
      - doc: BinaryUUIDOld is the deprecated, byte-order-ambiguous UUID subtype.
        name: BinaryUUIDOld
        type: byte
        value: "0x03"
      - doc: BinaryUUID is an RFC 9562 UUID.
        name: BinaryUUID
        type: byte
        value: "0x04"
      - doc: BinaryMD5 is an MD5 digest.
        name: BinaryMD5
        type: byte
        value: "0x05"
      - doc: BinaryEncrypted is a client-side encrypted value.
        name: BinaryEncrypted
        type: byte
        value: "0x06"
      - doc: BinaryColumn is a compressed time-series column.
        name: BinaryColumn
        type: byte
        value: "0x07"
      - doc: BinarySensitive marks data a server must not log.
        name: BinarySensitive
        type: byte
        value: "0x08"
      - doc: BinaryVector is a packed numeric vector.
        name: BinaryVector
        type: byte
        value: "0x09"
      - doc: BinaryUserDefined is the first of the subtypes reserved for applications.
        name: BinaryUserDefined
        type: byte
        value: "0x80"
    name: BinaryGeneric
  - doc: Structural bounds.
    grouped: true
    items:
      - doc: |-
          maxBSONNestedLevels bounds how deeply documents and arrays nest, the
          top-level document counting as the first level: the depth MongoDB
          accepts for a stored document. Both directions enforce it — a decode
          before it recurses (CWE-674), an encode so that a cyclic value is refused
          instead of overflowing the stack.
        name: maxBSONNestedLevels
        type: int
        value: "100"
      - doc: |-
          maxIndirections bounds how many pointers and interfaces an encode follows
          in a row without reaching a value: a pointer that points at itself adds no
          nesting level, so the depth bound alone would never stop it.
        name: maxIndirections
        type: int
        value: "64"
      - doc: |-
          minDocumentSize is the smallest document: the int32 length and the
          terminating NUL.
        name: minDocumentSize
        type: int
        value: "5"
      - doc: lengthSize is the width of every int32 length prefix.
        name: lengthSize
        type: int
        value: "4"
      - doc: objectIDSize is the width of an ObjectID.
        name: objectIDSize
        type: int
        value: "12"
      - doc: decimal128Size is the width of a decimal128.
        name: decimal128Size
        type: int
        value: "16"
      - doc: binaryHeaderSize is a binary's int32 length plus its subtype byte.
        name: binaryHeaderSize
        type: int
        value: "5"
      - doc: |-
          minCodeWithScopeSize is a code-with-scope's total length, its code
          string's length and NUL, and the smallest scope document.
        name: minCodeWithScopeSize
        type: int
        value: "14"
      - doc: wordSize is the width of a double, a datetime, a timestamp and an int64.
        name: wordSize
        type: int
        value: "8"
      - doc: typeByteValues is how many values a type byte can take.
        name: typeByteValues
        type: int
        value: "256"
    name: maxBSONNestedLevels
