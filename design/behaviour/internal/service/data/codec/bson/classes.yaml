  - doc: |-
      needsFolding reports whether lower-casing key could change it: an ASCII
      upper-case letter, or any non-ASCII byte.
    name: needsFolding
    params: key []byte
    results: bool
  - name: NewDateTimeFromTime
    params: t time.Time
    results: DateTime
  - doc: validateRoot checks that data is exactly one well-formed document.
    name: validateRoot
    params: data []byte
    results: error
  - doc: |-
      readInt32 reads the little-endian int32 at the start of b, which the caller
      has checked holds at least lengthSize bytes.
    name: readInt32
    params: b []byte
    results: int32
  - doc: |-
      readInt64 reads the little-endian int64 at the start of b, which the caller
      has checked holds at least eight bytes.
    name: readInt64
    params: b []byte
    results: int64
  - doc: readDouble reads the little-endian IEEE 754 double at the start of b.
    name: readDouble
    params: b []byte
    results: float64
  - doc: |-
      cstringEnd returns the index of the NUL that ends the cstring at the start
      of b, or -1 when b holds no NUL.
    name: cstringEnd
    params: b []byte
    results: int
  - doc: |-
      valueSize returns how many bytes the value of an element of type t occupies
      at the start of b, or -1 when b cannot hold it or t is not a BSON type. It
      checks bounds only: the validator has already checked the content, and this
      is how the decoder steps over a value without reading it.
    name: valueSize
    params: t byte, b []byte
    results: int
  - doc: |-
      fixedValueSize returns the width of a fixed-width type, and false for a
      variable-width or unknown one.
    name: fixedValueSize
    params: t byte
    results: size int, fixed bool
  - doc: |-
      variableValueSize returns the width of a length-prefixed or cstring value,
      or -1 when b cannot hold it or t is not a BSON type.
    name: variableValueSize
    params: t byte, b []byte
    results: int
  - doc: |-
      prefixedSize returns extra plus the int32 length at the start of b, or -1
      when b is too short for the prefix or for the value it announces.
    name: prefixedSize
    params: b []byte, extra int
    results: int
  - doc: "dbPointerSize returns the width of a DBPointer: a string, then an ObjectID."
    name: dbPointerSize
    params: b []byte
    results: int
  - doc: "regexSize returns the width of a regex: two NUL-terminated cstrings."
    name: regexSize
    params: b []byte
    results: int
imports:
  binary: encoding/binary
  bits: math/bits
  bytes: bytes
  codec: github.com/kitsunium/sdk/internal/core/data/codec
  corebson: github.com/kitsunium/sdk/internal/core/data/codec/bson
  encoding: encoding
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
  hex: encoding/hex
  json: encoding/json
  math: math
  recycler: github.com/kitsunium/sdk/internal/kernel/concur/recycler
  reflect: reflect
  scratch: github.com/kitsunium/sdk/internal/core/data/codec/scratch
  slices: slices
  strconv: strconv
  strings: strings
  sync: sync
  time: time
  url: net/url
  utf8: unicode/utf8
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/bson
  name: bson
  purpose: "Package bson is the BSON codec: a native implementation of the BSON 1.1 specification (bsonspec.org) behind the universal core/data/codec.Codec dispatch, written with the standard library alone."
types:
  - doc: bsonCodec is the concrete Codec implementation for BSON. Stateless.
    kind: struct
    methods:
      - doc: Name returns the canonical Format identifier.
        name: Name
        recv: "*bsonCodec"
        results: string
      - doc: MIMETypes returns a defensive copy of the MIME alias list.
        name: MIMETypes
        recv: "*bsonCodec"
        results: "[]string"
      - doc: Extensions returns a defensive copy of the file-extension list.
        name: Extensions
        recv: "*bsonCodec"
        results: "[]string"
      - doc: |-
          Marshal encodes v as a BSON document into a slice the caller owns. v must
          encode as a document at the top level; anything else surfaces
          BSON_MARSHAL_FAILED, and nesting past 100 levels — a cyclic value included —
          BSON_DEPTH_EXCEEDED.
        name: Marshal
        params: v any
        recv: "*bsonCodec"
        results: encoded []byte, err error
      - doc: |-
          Unmarshal decodes the BSON document data into v, which must be a non-nil
          pointer or a non-nil map. The input is checked whole before v is touched.
        name: Unmarshal
        params: data []byte, v any
        recv: "*bsonCodec"
        results: error
      - doc: |-
          Append encodes v as BSON and appends the document onto dst. Implements the
          optional codec.Appender: the encoder writes straight into dst, so a
          destination with room allocates nothing for the document itself. A failure
          returns dst with its original length.
        name: Append
        params: dst []byte, v any
        recv: "*bsonCodec"
        results: appended []byte, err error
    name: bsonCodec
  - fields:
      - name: h
        type: uint64
      - name: l
        type: uint64
    kind: struct
    methods:
      - name: GetBytes
        recv: d Decimal128
        results: high, low uint64
      - name: IsNaN
        recv: d Decimal128
        results: bool
      - name: IsInf
        recv: d Decimal128
        results: int
      - name: IsZero
        recv: d Decimal128
        results: bool
      - name: String
        recv: d Decimal128
        results: string
      - doc: |-
          finite splits a finite d into its coefficient and unbiased exponent. A
          coefficient over 10^34-1, and every coefficient of the form whose two bits
          after the sign are both set, is non-canonical and reads as zero.
        name: finite
        recv: d Decimal128
        results: high, low uint64, exponent int
      - name: MarshalJSON
        recv: d Decimal128
        results: "[]byte, error"
      - name: UnmarshalJSON
        params: data []byte
        recv: d *Decimal128
        results: error
    name: Decimal128
  - doc: |-
      decimalNumber is a scanned decimal: its significant digits, without leading
      zeros, and the power of ten they are scaled by.
    fields:
      - doc: digits are the significant digits, "0" for zero.
        name: digits
        type: "[]byte"
      - doc: |-
          exponent scales them, already corrected for the fraction digits; it is
          saturated far outside the range a decimal128 can reach.
        name: exponent
        type: int
    kind: struct
    methods:
      - doc: |-
          encode packs the number into a decimal128, trading trailing zeros for
          exponent while that stays exact. It reports false when no exact encoding
          exists.
        name: encode
        params: negative bool
        recv: n decimalNumber
        results: Decimal128, bool
    name: decimalNumber
  - doc: scannedCoefficient is the coefficient part of a decimal string.
    fields:
      - doc: digits are the significant digits, leading zeros dropped.
        name: digits
        type: "[]byte"
      - doc: fraction counts the digits after the point.
        name: fraction
        type: int
      - doc: end is where the coefficient stops.
        name: end
        type: int
      - doc: sawDigit reports at least one digit.
        name: sawDigit
        type: bool
    kind: struct
    methods:
      - doc: add records one digit of the coefficient.
        name: add
        params: c byte, afterPoint bool
        recv: s *scannedCoefficient
    name: scannedCoefficient
  - doc: |-
      decodeState is what a value's decoding depends on besides its bytes and its
      target.
    fields:
      - doc: |-
          ancestor is the type a document decodes as inside an interface: the
          nearest enclosing map whose values are interface{} or slice of E, as the
          previous library tracked it; nil means D.
        name: ancestor
        type: reflect.Type
      - doc: truncate lets a double with a fraction decode into an integer.
        name: truncate
        type: bool
      - doc: field is the Go name of the innermost struct field, for messages.
        name: field
        type: string
    kind: struct
    name: decodeState
  - doc: |-
      element is one element of a document: its type byte, its name and the bytes
      of its value.
    fields:
      - doc: typ is the BSON type byte.
        name: typ
        type: byte
      - doc: key is the element name, aliasing the input.
        name: key
        type: "[]byte"
      - doc: value is the value's bytes, aliasing the input.
        name: value
        type: "[]byte"
    kind: struct
    name: element
  - doc: docIter walks the elements of a validated document.
    fields:
      - doc: body is the element list, without the length prefix and terminator.
        name: body
        type: "[]byte"
      - doc: pos is where the next element starts.
        name: pos
        type: int
    kind: struct
    methods:
      - doc: |-
          next returns the next element. more is false at the end; err reports bytes
          that are not the validated document any more.
        name: next
        recv: it *docIter
        results: el element, more bool, err error
    name: docIter
  - doc: encoder appends BSON to buf.
    fields:
      - doc: buf is the output so far.
        name: buf
        type: "[]byte"
    kind: struct
    methods:
      - doc: encodeRoot writes the top-level value, which must encode as a document.
        name: encodeRoot
        params: v any
        recv: e *encoder
        results: error
      - doc: |-
          encodeValue appends the encoding of rv, planned by p, and returns its BSON
          type for the caller to put in the element's type byte.
        name: encodeValue
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: |-
          marshalHook calls MarshalBSON when p's method is reachable from rv: always
          for a value receiver, on an addressable value for a pointer receiver. A nil
          pointer or interface writes null without calling it.
        name: marshalHook
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeInteger writes the integer kinds.
        name: encodeInteger
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeScalar writes booleans, floats and strings.
        name: encodeScalar
        params: rv reflect.Value, p *typePlan
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeComposite writes the containers and follows the indirections.
        name: encodeComposite
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeBytes writes a byte slice as a generic binary, a nil one as null.
        name: encodeBytes
        params: rv reflect.Value
        recv: e *encoder
        results: byte
      - doc: encodeNilable writes a slice or map, or null when it is nil.
        name: encodeNilable
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: encodeIndirect follows a pointer or an interface to the value it holds.
        name: encodeIndirect
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: |-
          encodeAnyValue writes a dynamic value: the common types through a type
          switch, every other one through its plan. reflected is the value as a
          reflect.Value when the caller already has one, the zero Value otherwise.
        name: encodeAnyValue
        params: v any, reflected reflect.Value, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: |-
          encodeCommonScalar writes, without reflection, the scalar dynamic types;
          each rule is the plan's rule for the same type.
        name: encodeCommonScalar
        params: v any, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: |-
          encodeCommonContainer writes, without reflection, the container dynamic
          types a decode into an interface produces.
        name: encodeCommonContainer
        params: v any, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: |-
          openContainer checks the depth bound for a container st opens and reserves
          its length; it returns the child state and where the length goes.
        name: openContainer
        params: st encodeState
        recv: e *encoder
        results: encodeState, int, error
      - doc: encodeCommonMap writes a map[string]any, or nil as null, its keys sorted.
        name: encodeCommonMap
        params: m map[string]any, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeCommonD writes a D in order, or nil as null.
        name: encodeCommonD
        params: d D, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeCommonArray writes a []any, or nil as null.
        name: encodeCommonArray
        params: a []any, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: |-
          finishElement writes a dynamic value after an element header begun at
          begin, and sets the header's type byte.
        name: finishElement
        params: begin int, value any, st encodeState
        recv: e *encoder
        results: error
      - doc: encodeContainer opens a document or array, refusing past the depth bound.
        name: encodeContainer
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: encodeElements writes the elements of a container and returns its type.
        name: encodeElements
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: |-
          encodeArrayElements writes a slice's or array's elements under the keys
          "0", "1", ….
        name: encodeArrayElements
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: error
      - doc: |-
          encodeDocElements writes the E elements of a D, a slice convertible to one,
          or an array of E, in order.
        name: encodeDocElements
        params: rv reflect.Value, st encodeState
        recv: e *encoder
        results: error
      - doc: encodeStructElements writes a struct's fields, then its ",inline" map.
        name: encodeStructElements
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: error
      - doc: |-
          encodeField writes one struct field, honouring omitempty and minsize. A
          field behind a nil ",inline" pointer is not written.
        name: encodeField
        params: rv reflect.Value, f *fieldPlan, st encodeState
        recv: e *encoder
        results: error
      - doc: |-
          encodeMapElements writes a map's entries in ascending key order. collisions,
          when not nil, are the field names an ",inline" map must not repeat.
        name: encodeMapElements
        params: rv reflect.Value, p *typePlan, st encodeState, collisions map[string]*fieldPlan
        recv: e *encoder
        results: error
      - doc: encodeMapEntry writes one map entry and returns where it lies.
        name: encodeMapEntry
        params: key, value reflect.Value, p *typePlan, st encodeState, collisions map[string]*fieldPlan
        recv: e *encoder
        results: segment, error
      - doc: |-
          beginMapKey writes an element's type placeholder and the map key as its
          name, and returns the index of the name's NUL.
        name: beginMapKey
        params: key reflect.Value, mode keyMode, collisions map[string]*fieldPlan
        recv: e *encoder
        results: int, error
      - doc: |-
          sortSegments rewrites the map elements just written, between the first
          segment's start and the buffer's end, in ascending key order.
        name: sortSegments
        params: segs []segment
        recv: e *encoder
      - doc: |-
          reserve keeps elementHeadroom bytes free, doubling the buffer when it must
          grow: past 256 bytes append grows a slice by about a quarter, so a large
          document would allocate four to five times its size on the way; doubling
          bounds that at about twice.
        name: reserve
        recv: e *encoder
      - doc: |-
          beginElement writes a type placeholder and the element name, refusing a
          name BSON cannot carry, and returns the index of the name's NUL.
        name: beginElement
        params: name string
        recv: e *encoder
        results: int, error
      - doc: |-
          beginIndex writes a type placeholder and the decimal index as the name, and
          returns where the type byte is.
        name: beginIndex
        params: i int
        recv: e *encoder
        results: int
      - doc: |-
          reserveLength appends a placeholder for a document's length and returns
          where it is.
        name: reserveLength
        recv: e *encoder
        results: int
      - doc: |-
          endDocument writes the terminator and the length of the document started at
          start, refusing a document whose length an int32 cannot hold.
        name: endDocument
        params: start int
        recv: e *encoder
        results: error
      - doc: appendBool writes a boolean.
        name: appendBool
        params: b bool
        recv: e *encoder
      - doc: appendInt32 writes an int32.
        name: appendInt32
        params: i int32
        recv: e *encoder
      - doc: appendInt64 writes an int64.
        name: appendInt64
        params: i int64
        recv: e *encoder
      - doc: |-
          appendInt writes i as an int32 when narrow allows it and it fits, as an
          int64 otherwise, and returns which.
        name: appendInt
        params: i int64, narrow bool
        recv: e *encoder
        results: byte
      - doc: |-
          appendUint writes an unsigned integer: an int32 under minsize when it fits,
          an int64 when it fits there, refused past the int64 range.
        name: appendUint
        params: u uint64, minSize bool, p *typePlan
        recv: e *encoder
        results: byte, error
      - doc: appendDouble writes an IEEE 754 double.
        name: appendDouble
        params: f float64
        recv: e *encoder
      - doc: appendString writes a string value, refusing one that is not UTF-8.
        name: appendString
        params: s string
        recv: e *encoder
        results: error
      - doc: |-
          appendStringBytes writes the length, the bytes and the NUL of a string the
          caller has validated.
        name: appendStringBytes
        params: s string
        recv: e *encoder
      - doc: appendBinary writes a binary; the old generic subtype nests its length.
        name: appendBinary
        params: subtype byte, data []byte
        recv: e *encoder
      - doc: appendByteArray writes a byte array as a generic binary.
        name: appendByteArray
        params: rv reflect.Value
        recv: e *encoder
      - doc: |-
          encodeSpecial writes the exact types the plan matched, and refuses the
          kinds BSON has no form for.
        name: encodeSpecial
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: encodeStdlib writes time.Time, DateTime, url.URL and json.Number.
        name: encodeStdlib
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: |-
          encodeValueType writes the codec's value types that carry bytes of their
          own.
        name: encodeValueType
        params: rv reflect.Value, p *typePlan
        recv: e *encoder
        results: byte, bool, error
      - doc: encodeTextType writes the codec's text-shaped value types.
        name: encodeTextType
        params: rv reflect.Value, p *typePlan, st encodeState
        recv: e *encoder
        results: byte, bool, error
      - doc: |-
          appendJSONNumber writes a json.Number as an integer when it parses as an
          int64, as a double when it parses as a float64, and refuses it otherwise.
        name: appendJSONNumber
        params: n json.Number, st encodeState
        recv: e *encoder
        results: byte, error
      - doc: appendObjectID writes the twelve bytes of an ObjectID value.
        name: appendObjectID
        params: rv reflect.Value
        recv: e *encoder
      - doc: |-
          appendRegex writes a regex: two cstrings, the options sorted, as the
          specification stores them.
        name: appendRegex
        params: pattern, options string
        recv: e *encoder
        results: error
      - doc: |-
          appendDBPointer writes a DBPointer: its namespace as a string, then its
          ObjectID.
        name: appendDBPointer
        params: rv reflect.Value
        recv: e *encoder
        results: error
      - doc: |-
          appendCodeWithScope writes a code-with-scope: a total length, the code as a
          string, and the scope, which must encode as a document.
        name: appendCodeWithScope
        params: rv reflect.Value, st encodeState
        recv: e *encoder
        results: error
      - doc: |-
          appendScope writes a code-with-scope's scope, which must encode as a
          document; a nil map is the empty one, as at the top level.
        name: appendScope
        params: scope reflect.Value, st encodeState
        recv: e *encoder
        results: error
    name: encoder
  - doc: encodeState is what a value's encoding depends on besides the value.
    fields:
      - doc: |-
          depth is the nesting level of the document the value is written in; a
          container the value opens is one deeper.
        name: depth
        type: int
      - doc: |-
          hops counts the pointers and interfaces followed since the last
          container, so a pointer cycle that opens none is still refused.
        name: hops
        type: int
      - doc: minSize writes integers that fit as int32.
        name: minSize
        type: bool
      - doc: |-
          addressable mirrors reflect's addressability along the path the
          previous library walked, which decides whether a MarshalBSON method
          with a pointer receiver is called: a map value, an interface's dynamic
          value and a value passed to Marshal by value are not addressable.
        name: addressable
        type: bool
    kind: struct
    methods:
      - doc: child returns the state of a value inside a container this state opens.
        name: child
        recv: st encodeState
        results: encodeState
    name: encodeState
  - doc: |-
      segment is one encoded element of a map, located in the output so the
      elements can be put in key order once they are all written.
    fields:
      - doc: start is the element's type byte.
        name: start
        type: int
      - doc: keyEnd is the NUL ending its name; the name is buf[start+1:keyEnd].
        name: keyEnd
        type: int
      - doc: end is one past its last byte.
        name: end
        type: int
    kind: struct
    name: segment
  - kind: named
    methods:
      - name: Hex
        recv: id ObjectID
        results: string
      - name: String
        recv: id ObjectID
        results: string
      - name: IsZero
        recv: id ObjectID
        results: bool
      - name: Timestamp
        recv: id ObjectID
        results: time.Time
      - name: MarshalText
        recv: id ObjectID
        results: "[]byte, error"
      - name: UnmarshalText
        params: text []byte
        recv: id *ObjectID
        results: error
      - name: MarshalJSON
        recv: id ObjectID
        results: "[]byte, error"
      - name: UnmarshalJSON
        params: data []byte
        recv: id *ObjectID
        results: error
    name: ObjectID
    underlying: "[objectIDSize]byte"
  - doc: planKind is the mapping a plan applies.
    kind: named
    name: planKind
    underlying: uint8
  - doc: hookMode says whether, and how, a type's own method replaces the mapping.
    kind: named
    name: hookMode
    underlying: uint8
  - doc: keyMode is how a map key becomes an element name, and back.
    kind: named
    name: keyMode
    underlying: uint8
  - doc: typePlan is everything the codec decided about one Go type.
    fields:
      - doc: typ is the type planned.
        name: typ
        type: reflect.Type
      - doc: kind is the mapping.
        name: kind
        type: planKind
      - doc: |-
          elem plans a pointer's target, a slice's or array's element, a map's
          value.
        name: elem
        type: "*typePlan"
      - doc: marshaler says how MarshalBSON is reached, if it is.
        name: marshaler
        type: hookMode
      - doc: unmarshaler says how UnmarshalBSON is reached, if it is.
        name: unmarshaler
        type: hookMode
      - doc: zeroer reports that the type has IsZero, which omitempty then calls.
        name: zeroer
        type: bool
      - doc: |-
          stringAnyMap reports a map whose underlying type is map[string]any,
          decoded without reflection.
        name: stringAnyMap
        type: bool
      - doc: |-
          keyEncode and keyDecode map a map's keys; they differ when only one
          direction has a text method.
        name: keyEncode
        type: keyMode
      - doc: |-
          keyEncode and keyDecode map a map's keys; they differ when only one
          direction has a text method.
        name: keyDecode
        type: keyMode
      - doc: |-
          slots recycles a map's key and value slots: iterating or filling a map
          through reflection needs two settable values, and allocating them per
          call would cost two allocations per map, nested maps included.
        name: slots
        type: "*recycler.Pool[*mapSlots]"
      - doc: fields are a struct's fields in encoding order.
        name: fields
        type: "[]*fieldPlan"
      - doc: byName indexes fields by element name.
        name: byName
        type: map[string]*fieldPlan
      - doc: inlineMap is the field holding a struct's ",inline" map, or nil.
        name: inlineMap
        type: "*fieldPlan"
      - doc: |-
          invalid says why the type cannot be encoded or decoded at all (a
          duplicated element name, a malformed ",inline"); each direction raises it
          under its own code when the type is used.
        name: invalid
        type: string
    kind: struct
    methods:
      - doc: |-
          fieldFor finds the field an element names, trying first the field that
          follows the last one matched: a document written from this struct lists
          its fields in order, and the guess then saves the map lookup.
        name: fieldFor
        params: key []byte, next int
        recv: p *typePlan
        results: "*fieldPlan"
      - doc: acquireSlots borrows p's slots; release them with releaseSlots.
        name: acquireSlots
        recv: p *typePlan
        results: "*mapSlots"
      - doc: |-
          releaseSlots zeroes the slots, so a pooled slot pins nothing the caller's
          map held, and returns them.
        name: releaseSlots
        params: s *mapSlots
        recv: p *typePlan
      - doc: |-
          lookupField finds the field an element names: exactly, then by the name
          lower-cased, as the previous library matched.
        name: lookupField
        params: key []byte
        recv: p *typePlan
        results: "*fieldPlan"
      - doc: foldedField looks up key lower-cased, Unicode folding included.
        name: foldedField
        params: key []byte
        recv: p *typePlan
        results: "*fieldPlan"
    name: typePlan
  - doc: fieldPlan is one struct field, as an element.
    fields:
      - doc: name is the element name.
        name: name
        type: string
      - doc: goName is the Go field name, for error messages.
        name: goName
        type: string
      - doc: |-
          index is the path to the field, longer than one when it comes from an
          ",inline" struct.
        name: index
        type: "[]int"
      - doc: |-
          position is the field's place in its struct plan's fields, so a decode
          can guess that the next element names the next field.
        name: position
        type: int
      - doc: plan is the field type's plan.
        name: plan
        type: "*typePlan"
      - doc: |-
          nameBytes is name as bytes, for comparing with an element name read
          from the input without converting either.
        name: nameBytes
        type: "[]byte"
      - doc: flags are the tag's options, and whether the name is writable.
        name: flags
        type: fieldFlags
    kind: struct
    name: fieldPlan
  - doc: fieldFlags are a field's options, one bit each.
    kind: named
    methods:
      - doc: has reports whether every bit of flag is set.
        name: has
        params: flag fieldFlags
        recv: f fieldFlags
        results: bool
    name: fieldFlags
    underlying: uint8
  - doc: planBuilder builds plans for one planFor call, under planMu.
    fields:
      - doc: |-
          pending holds the plans built so far, so a recursive type reaches its
          own plan instead of recursing forever.
        name: pending
        type: map[reflect.Type]*typePlan
    kind: struct
    methods:
      - doc: |-
          plan returns the plan of t: a published one, one built earlier in this
          call (perhaps still being filled), or a new one.
        name: plan
        params: t reflect.Type
        recv: b *planBuilder
        results: "*typePlan"
      - doc: fill decides the mapping of p.typ.
        name: fill
        params: p *typePlan
        recv: b *planBuilder
      - doc: fillKind decides the mapping of a type that is not matched exactly.
        name: fillKind
        params: p *typePlan
        recv: b *planBuilder
      - doc: "fillSlice decides a slice's mapping: bytes, a document of E, or an array."
        name: fillSlice
        params: p *typePlan
        recv: b *planBuilder
      - doc: fillArray decides an array's mapping, as fillSlice does.
        name: fillArray
        params: p *typePlan
        recv: b *planBuilder
      - doc: fillMap decides a map's mapping and how its keys become element names.
        name: fillMap
        params: p *typePlan
        recv: b *planBuilder
      - doc: |-
          fillStruct describes a struct's fields: names, options, ",inline" fields
          flattened, a duplicated name refused unless one occurrence is shallower.
        name: fillStruct
        params: p *typePlan
        recv: b *planBuilder
      - doc: |-
          describeStruct lists t's encoded fields, ",inline" structs expanded in
          place, duplicated names resolved, and t's own ",inline" map. chain holds the
          structs whose ",inline" expansion encloses this one, so a cycle through
          ",inline" is refused; a field that merely refers back to a type being
          planned is an ordinary recursive type and is not one. It reports why t is
          unusable, or "".
        name: describeStruct
        params: t reflect.Type, chain map[reflect.Type]bool
        recv: b *planBuilder
        results: "[]*fieldPlan, *fieldPlan, string"
      - doc: newField builds the plan of one field.
        name: newField
        params: sf reflect.StructField, tags fieldTags, index []int
        recv: b *planBuilder
        results: "*fieldPlan"
      - doc: |-
          inlineStruct expands an ",inline" struct, or pointer to one, into its
          fields, each path prefixed with the inlining field's index. The inlined
          struct's own ",inline" map is not carried up, as the previous library did
          not carry it.
        name: inlineStruct
        params: owner, ft reflect.Type, i int, chain map[reflect.Type]bool
        recv: b *planBuilder
        results: "[]*fieldPlan, string"
    name: planBuilder
  - doc: mapSlots are the settable key and value a reflective map walk reuses.
    fields:
      - doc: key holds the current entry's key.
        name: key
        type: reflect.Value
      - doc: value holds the current entry's value.
        name: value
        type: reflect.Value
    kind: struct
    name: mapSlots
  - doc: fieldTags are the options of a bson struct tag.
    fields:
      - doc: name is the element name.
        name: name
        type: string
      - doc: flags are the options set.
        name: flags
        type: fieldFlags
    kind: struct
    name: fieldTags
  - kind: named
    name: D
    underlying: "[]E"
  - fields:
      - doc: Key is the element name. It must not contain a NUL byte.
        name: Key
        type: string
      - doc: Value is any value the codec encodes.
        name: Value
        type: any
    kind: struct
    name: E
  - kind: named
    name: M
    underlying: map[string]any
  - kind: named
    name: A
    underlying: "[]any"
  - fields:
      - doc: Subtype is the BSON binary subtype, BinaryGeneric for opaque bytes.
        name: Subtype
        type: byte
      - doc: Data is the payload.
        name: Data
        type: "[]byte"
    kind: struct
    methods:
      - name: Equal
        params: other Binary
        recv: b Binary
        results: bool
      - name: IsZero
        recv: b Binary
        results: bool
    name: Binary
  - kind: struct
    name: Undefined
  - kind: struct
    name: "Null"
  - kind: struct
    name: MinKey
  - kind: struct
    name: MaxKey
  - kind: named
    methods:
      - name: Time
        recv: dt DateTime
        results: time.Time
      - name: MarshalJSON
        recv: dt DateTime
        results: "[]byte, error"
      - name: UnmarshalJSON
        params: data []byte
        recv: dt *DateTime
        results: error
    name: DateTime
    underlying: int64
  - fields:
      - doc: Pattern is the expression.
        name: Pattern
        type: string
      - doc: Options are the single-letter flags, such as "i" or "imx".
        name: Options
        type: string
    kind: struct
    methods:
      - name: String
        recv: r Regex
        results: string
      - name: Equal
        params: other Regex
        recv: r Regex
        results: bool
      - name: IsZero
        recv: r Regex
        results: bool
    name: Regex
  - fields:
      - doc: DB is the namespace the pointer names.
        name: DB
        type: string
      - doc: Pointer is the identifier within it.
        name: Pointer
        type: ObjectID
    kind: struct
    methods:
      - name: String
        recv: p DBPointer
        results: string
      - name: Equal
        params: other DBPointer
        recv: p DBPointer
        results: bool
      - name: IsZero
        recv: p DBPointer
        results: bool
    name: DBPointer
  - kind: named
    name: JavaScript
    underlying: string
  - kind: named
    name: Symbol
    underlying: string
  - fields:
      - doc: Code is the JavaScript.
        name: Code
        type: JavaScript
      - doc: Scope is the document.
        name: Scope
        type: any
    kind: struct
    methods:
      - name: String
        recv: c CodeWithScope
        results: string
    name: CodeWithScope
  - fields:
      - doc: T is the seconds since the Unix epoch.
        name: T
        type: uint32
      - doc: I is the increment, ordering operations within the same second.
        name: I
        type: uint32
    kind: struct
    methods:
      - name: After
        params: other Timestamp
        recv: t Timestamp
        results: bool
      - name: Before
        params: other Timestamp
        recv: t Timestamp
        results: bool
      - name: Equal
        params: other Timestamp
        recv: t Timestamp
        results: bool
      - name: IsZero
        recv: t Timestamp
        results: bool
      - name: Compare
        params: other Timestamp
        recv: t Timestamp
        results: int
    name: Timestamp
  - doc: |-
      validationError says where, and why, a document is malformed. It is turned
      into BSON_UNMARSHAL_FAILED or BSON_DEPTH_EXCEEDED by validateRoot; its text
      names an offset and a rule, never the bytes found there.
    fields:
      - doc: offset is where in the input the problem was found.
        name: offset
        type: int
      - doc: rule is what the bytes there break.
        name: rule
        type: string
      - doc: depth reports the nesting bound rather than a malformation.
        name: depth
        type: bool
    kind: struct
    name: validationError
  - doc: validator walks one input, tracking the absolute offset for messages.
    kind: struct
    methods:
      - doc: |-
          root checks the top-level document, whose declared length must be exactly
          the length of the input: trailing bytes are refused.
        name: root
        params: data []byte
        recv: v validator
        results: "*validationError"
      - doc: |-
          document checks a document or array occupying exactly doc, found at base in
          the input and nested at depth.
        name: document
        params: doc []byte, base, depth int
        recv: v validator
        results: "*validationError"
      - doc: |-
          element checks the element at body[pos:], body being a document's element
          list without its terminator, and returns where the next element starts.
        name: element
        params: body []byte, pos, base, depth int
        recv: v validator
        results: int, *validationError
      - doc: |-
          value checks the value of an element of type t at the start of b, found at
          base in the input, and returns its size.
        name: value
        params: t byte, b []byte, base, depth int
        recv: v validator
        results: int, *validationError
      - doc: str checks an int32-length-prefixed, NUL-terminated UTF-8 string.
        name: str
        params: b []byte, base int
        recv: v validator
        results: int, *validationError
      - doc: |-
          nested checks an embedded document or array, which the element types
          distinguish but whose layout is the same: an array's keys are not checked
          to be "0", "1", …, as the specification asks readers to accept either.
        name: nested
        params: b []byte, base, depth int
        recv: v validator
        results: int, *validationError
      - doc: |-
          binary checks a binary: a non-negative int32 length, a subtype byte, and the
          bytes; the deprecated subtype 0x02 must carry its own inner length, equal
          to the outer one minus four.
        name: binary
        params: b []byte, base int
        recv: v validator
        results: int, *validationError
      - doc: "regex checks two NUL-terminated UTF-8 cstrings: pattern, then options."
        name: regex
        params: b []byte, base int
        recv: v validator
        results: int, *validationError
      - doc: "dbPointer checks a DBPointer: a string, then twelve bytes."
        name: dbPointer
        params: b []byte, base int
        recv: v validator
        results: int, *validationError
      - doc: |-
          codeWithScope checks a code-with-scope: an int32 total length that the code
          string and the scope document fill exactly.
        name: codeWithScope
        params: b []byte, base, depth int
        recv: v validator
        results: int, *validationError
      - doc: "boolean checks a boolean: one byte, 0x00 or 0x01."
        name: boolean
        params: b []byte, base int
        recv: v validator
        results: int, *validationError
    name: validator
vars:
  - grouped: true
    items:
      - doc: Codec is the registered BSON singleton.
        name: Codec
        type: codec.Codec
        value: codec.Register(&bsonCodec{})
      - doc: mimeTypes hoisted so MIMETypes does not allocate the literal per call.
        name: mimeTypes
        value: "[]string{\"application/bson\"}"
      - doc: extensions hoisted for the same reason.
        name: extensions
        value: "[]string{\".bson\"}"
    name: Codec
  - doc: valueTypeBytes maps each value type to the BSON type it is read from.
    items:
      - name: valueTypeBytes
        value: |-
          map[planKind]byte{
          	kindObjectID:      typeObjectID,
          	kindDateTime:      typeDateTime,
          	kindBinary:        typeBinary,
          	kindRegex:         typeRegex,
          	kindDBPointer:     typeDBPointer,
          	kindJavaScript:    typeJavaScript,
          	kindSymbol:        typeSymbol,
          	kindCodeWithScope: typeCodeWithScope,
          	kindTimestamp:     typeTimestamp,
          	kindDecimal128:    typeDecimal128,
          	kindMinKey:        typeMinKey,
          	kindMaxKey:        typeMaxKey,
          	kindUndefined:     typeUndefined,
          	kindNull:          typeNull,
          }
    name: valueTypeBytes
  - doc: segmentPool recycles the per-map segment lists.
    items:
      - name: segmentPool
        value: |-
          recycler.NewCappedPool[*[]segment](
          	func() *[]segment {
          		//: room for an ordinary document.
          		return new(make([]segment, 0, 32))
          	},
          	func(s *[]segment) { *s = (*s)[:0] },
          	func(s *[]segment) int { return cap(*s) },
          	maxRetainedSegments,
          )
    name: segmentPool
  - doc: The encoder's tables.
    grouped: true
    items:
      - doc: markerTypes maps the payload-free value types to their type byte.
        name: markerTypes
        value: |-
          map[planKind]byte{
          		kindMinKey:    typeMinKey,
          		kindMaxKey:    typeMaxKey,
          		kindUndefined: typeUndefined,
          		kindNull:      typeNull,
          	}
      - doc: bsonTypeNames names each BSON type for an error message.
        name: bsonTypeNames
        value: |-
          [typeByteValues]string{
          		typeDouble:        "double",
          		typeString:        "string",
          		typeDocument:      "embedded document",
          		typeArray:         "array",
          		typeBinary:        "binary",
          		typeUndefined:     "undefined",
          		typeObjectID:      "ObjectID",
          		typeBoolean:       "boolean",
          		typeDateTime:      "datetime",
          		typeNull:          "null",
          		typeRegex:         "regex",
          		typeDBPointer:     "DBPointer",
          		typeJavaScript:    "JavaScript",
          		typeSymbol:        "symbol",
          		typeCodeWithScope: "code with scope",
          		typeInt32:         "int32",
          		typeTimestamp:     "timestamp",
          		typeInt64:         "int64",
          		typeDecimal128:    "decimal128",
          		typeMinKey:        "min key",
          		typeMaxKey:        "max key",
          	}
    name: markerTypes
  - doc: NilObjectID is the zero ObjectID.
    items:
      - name: NilObjectID
        type: ObjectID
    name: NilObjectID
  - doc: The types matched exactly, before their kind is looked at.
    grouped: true
    items:
      - doc: typeOfTime is time.Time.
        name: typeOfTime
        value: reflect.TypeFor[time.Time]()
      - doc: typeOfBytes is []byte.
        name: typeOfBytes
        value: reflect.TypeFor[[]byte]()
      - doc: typeOfByte is byte.
        name: typeOfByte
        value: reflect.TypeFor[byte]()
      - doc: typeOfURL is url.URL.
        name: typeOfURL
        value: reflect.TypeFor[url.URL]()
      - doc: typeOfJSONNumber is json.Number.
        name: typeOfJSONNumber
        value: reflect.TypeFor[json.Number]()
      - doc: typeOfD is D.
        name: typeOfD
        value: reflect.TypeFor[D]()
      - doc: typeOfE is E.
        name: typeOfE
        value: reflect.TypeFor[E]()
      - doc: typeOfM is M.
        name: typeOfM
        value: reflect.TypeFor[M]()
      - doc: typeOfString is string.
        name: typeOfString
        value: reflect.TypeFor[string]()
      - doc: typeOfStringAnyMap is map[string]any.
        name: typeOfStringAnyMap
        value: reflect.TypeFor[map[string]any]()
      - doc: typeOfAny is the empty interface.
        name: typeOfAny
        value: reflect.TypeFor[any]()
      - doc: |-
          exactKinds maps the codec's own value types, and the stdlib types it
          knows, to their mapping.
        name: exactKinds
        value: |-
          map[reflect.Type]planKind{
          		typeOfTime:                       kindTime,
          		typeOfBytes:                      kindBytes,
          		typeOfURL:                        kindURL,
          		typeOfJSONNumber:                 kindJSONNumber,
          		typeOfD:                          kindD,
          		reflect.TypeFor[ObjectID]():      kindObjectID,
          		reflect.TypeFor[DateTime]():      kindDateTime,
          		reflect.TypeFor[Binary]():        kindBinary,
          		reflect.TypeFor[Regex]():         kindRegex,
          		reflect.TypeFor[DBPointer]():     kindDBPointer,
          		reflect.TypeFor[JavaScript]():    kindJavaScript,
          		reflect.TypeFor[Symbol]():        kindSymbol,
          		reflect.TypeFor[CodeWithScope](): kindCodeWithScope,
          		reflect.TypeFor[Timestamp]():     kindTimestamp,
          		reflect.TypeFor[Decimal128]():    kindDecimal128,
          		reflect.TypeFor[MinKey]():        kindMinKey,
          		reflect.TypeFor[MaxKey]():        kindMaxKey,
          		reflect.TypeFor[Undefined]():     kindUndefined,
          		reflect.TypeFor[Null]():          kindNull,
          	}
      - doc: |-
          typeOfMarshaler is the method set a type implements to write its own
          document.
        name: typeOfMarshaler
        value: reflect.TypeFor[interface{ MarshalBSON() ([]byte, error) }]()
      - doc: |-
          typeOfUnmarshaler is the method set a type implements to read its own
          value.
        name: typeOfUnmarshaler
        value: reflect.TypeFor[interface{ UnmarshalBSON(data []byte) error }]()
      - doc: typeOfZeroer is the method set omitempty asks.
        name: typeOfZeroer
        value: reflect.TypeFor[interface{ IsZero() bool }]()
      - doc: typeOfTextMarshaler is encoding.TextMarshaler, for map keys.
        name: typeOfTextMarshaler
        value: reflect.TypeFor[encoding.TextMarshaler]()
      - doc: typeOfTextUnmarshaler is encoding.TextUnmarshaler, for map keys.
        name: typeOfTextUnmarshaler
        value: reflect.TypeFor[encoding.TextUnmarshaler]()
      - doc: scalarKinds maps the scalar reflect.Kinds to their mapping.
        name: scalarKinds
        value: |-
          map[reflect.Kind]planKind{
          		reflect.Bool:    kindBool,
          		reflect.Int8:    kindInt32,
          		reflect.Int16:   kindInt32,
          		reflect.Int32:   kindInt32,
          		reflect.Int:     kindInt,
          		reflect.Int64:   kindInt64,
          		reflect.Uint8:   kindUint16,
          		reflect.Uint16:  kindUint16,
          		reflect.Uint:    kindUint64,
          		reflect.Uint32:  kindUint64,
          		reflect.Uint64:  kindUint64,
          		reflect.Float32: kindFloat32,
          		reflect.Float64: kindFloat64,
          		reflect.String:  kindString,
          	}
      - doc: |-
          integerKeyModes maps the integer reflect.Kinds to their key mode;
          uintptr is included, as the previous library included it.
        name: integerKeyModes
        value: |-
          map[reflect.Kind]keyMode{
          		reflect.Int:     keyInt,
          		reflect.Int8:    keyInt,
          		reflect.Int16:   keyInt,
          		reflect.Int32:   keyInt,
          		reflect.Int64:   keyInt,
          		reflect.Uint:    keyUint,
          		reflect.Uint8:   keyUint,
          		reflect.Uint16:  keyUint,
          		reflect.Uint32:  keyUint,
          		reflect.Uint64:  keyUint,
          		reflect.Uintptr: keyUint,
          	}
      - doc: tagOptions maps each option word to its flag.
        name: tagOptions
        value: |-
          map[string]fieldFlags{
          		"omitempty": flagOmitEmpty,
          		"minsize":   flagMinSize,
          		"truncate":  flagTruncate,
          		"inline":    flagInline,
          	}
      - doc: plans maps reflect.Type to its complete *typePlan.
        name: plans
        type: sync.Map
      - doc: planMu serialises construction; reading plans takes no lock.
        name: planMu
        type: sync.Mutex
    name: typeOfTime
  - doc: Tables shared by the readers and the writer.
    grouped: true
    items:
      - doc: |-
          emptyDocument is the five bytes of the empty document: its length, then
          its terminator.
        name: emptyDocument
        value: "[minDocumentSize]byte{byte(minDocumentSize), 0, 0, 0, 0}"
      - doc: |-
          fixedWidths holds, per type byte, one more than the width of its value
          when that width is fixed, and zero for a variable-width or unknown type.
        name: fixedWidths
        value: |-
          [typeByteValues]uint8{
          		typeUndefined:  1,
          		typeNull:       1,
          		typeMinKey:     1,
          		typeMaxKey:     1,
          		typeBoolean:    2,
          		typeInt32:      uint8(lengthSize + 1),
          		typeDouble:     uint8(wordSize + 1),
          		typeDateTime:   uint8(wordSize + 1),
          		typeTimestamp:  uint8(wordSize + 1),
          		typeInt64:      uint8(wordSize + 1),
          		typeObjectID:   uint8(objectIDSize + 1),
          		typeDecimal128: uint8(decimal128Size + 1),
          	}
    name: emptyDocument
