apiVersion: design/behaviour/v1
constants:
  - doc: Field names the refusals carry.
    grouped: true
    items:
      - doc: fieldPointer carries where the document failed, as a JSON Pointer.
        name: fieldPointer
        type: string
        value: "\"pointer\""
      - doc: fieldOffset carries the byte offset at which the decoder stopped.
        name: fieldOffset
        type: string
        value: "\"offset\""
      - doc: fieldLimit carries the bound a too-large document exceeded.
        name: fieldLimit
        type: string
        value: "\"limit\""
      - doc: fieldArgument names the argument a misconfigured call got wrong.
        name: fieldArgument
        type: string
        value: "\"argument\""
      - doc: fieldCause carries the message of a reader that failed.
        name: fieldCause
        type: string
        value: "\"cause\""
    name: fieldPointer
  - doc: |-
      MaxPointerBytes bounds the JSON Pointer a refusal carries. A pointer is
      built from the document's member names, so its length is the document's
      to choose; past the bound it is cut back to the deepest ancestor that fits,
      which still points at the right place, just less precisely.
    items:
      - name: MaxPointerBytes
        type: int
        value: "256"
    name: MaxPointerBytes
