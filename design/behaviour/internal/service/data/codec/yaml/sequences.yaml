      - set: d.doc
        value: append(d.doc[:0], d.next...)
      - bind: state
        eval: "documentState{explicit: len(d.next) > 0}"
      - opt:
          do:
            - op: ++
              set: d.line
          when: state.explicit
      - set: d.next
        value: d.next[:0]
      - loop:
          do:
            - bind: start, last, err
              eval: d.appendLine()
              to: d.appendLine
            - opt:
                do:
                  - return: false, err
                when: err != nil
            - opt:
                do:
                  - break: true
                when: len(d.doc) == start
            - bind: ended, terr
              eval: d.takeLine(&state, start)
              to: d.takeLine
            - opt:
                do:
                  - return: terr == nil, terr
                when: ended || terr != nil
            - opt:
                do:
                  - break: true
                when: last
          forever: true
      - return: state.found(), nil
        to: state.found
  - of: (*yamlDecoder).appendLine
    participants:
      - id: caller
        kind: actor
      - id: (*yamlDecoder).appendLine
        kind: self
      - id: d.readLine
        kind: internal
    steps:
      - set: start
