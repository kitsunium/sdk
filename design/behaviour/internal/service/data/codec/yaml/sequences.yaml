  - of: isMarkerLine
    steps:
      - opt:
          do:
            - return: "false"
          when: "!bytes.HasPrefix(line, []byte(marker))"
      - bind: rest
        eval: line[len(marker):]
      - return: len(rest) == 0 || rest[0] == ' ' || rest[0] == '\t' || rest[0] == '\n' || rest[0] == '\r'
  - of: hasContent
    participants:
      - id: caller
        kind: actor
      - id: hasContent
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - bind: trimmed
        eval: bytes.TrimLeft(line, " \t")
        to: bytes
      - opt:
          do:
            - return: "false"
          when: len(trimmed) == 0 || trimmed[0] == '\n' || trimmed[0] == '\r'
      - return: trimmed[0] != '#' && line[0] != '%'
  - of: (*yamlEncoder).Encode
    participants:
      - id: caller
        kind: actor
      - id: (*yamlEncoder).Encode
        kind: self
      - id: marshalError
        kind: internal
      - id: scratch
        kind: package
      - id: buf.WriteString
        kind: value
      - id: enc.encodeDocument
        kind: internal
      - id: e.w.Write
        kind: value
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: e.err
          when: e.err != nil
      - opt:
          do:
            - return: marshalError("the encoder is closed", "")
              to: marshalError
          when: e.closed
      - bind: buf
        eval: scratch.AcquireBuffer()
        to: scratch
      - defer: scratch.ReleaseBuffer(buf)
        to: scratch
      - opt:
          do:
            - eval: buf.WriteString(documentSeparator)
              to: buf.WriteString
          when: e.written > 0
      - bind: enc
        eval: "encoder{buf: buf}"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: enc.encodeDocument(v)
            to: enc.encodeDocument
          when: err != nil
      - opt:
          do:
            - set: e.err
              to: errs
              value: |-
                errs.Wrap(err, errs.WrapParams{
                			Code:    coreyaml.CodeYAMLMarshalFailed,
                			Reason:  "MARSHAL_FAILED",
                			Public:  "YAML encoding failed",
                			Private: "service/data/codec/yaml.Encoder: the writer failed",
                		})
            - return: e.err
          init:
            bind: _, err
            eval: e.w.Write(buf.Bytes())
            to: e.w.Write
          when: err != nil
      - op: ++
        set: e.written
      - return: nil
  - of: (*yamlEncoder).Close
    steps:
      - set: e.closed
        value: "true"
      - return: e.err
  - of: at
    steps:
      - return: "[]errs.FieldValue{errs.Int(\"line\", line), errs.Int(\"column\", column)}"
  - of: syntaxError
    participants:
      - id: caller
        kind: actor
      - id: syntaxError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coreyaml.UnmarshalFailed, errs.WrapParams{}, append(at(line, column), errs.String("detail", detail))...)
        to: errs
  - of: refused
