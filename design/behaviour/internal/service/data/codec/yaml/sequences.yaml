              to: p.plainContinuationSegment
            - opt:
                do:
                  - return: "\"\", serr"
                when: serr != nil
            - opt:
                do:
                  - break: true
                when: stop != stopEnd
            - set: next, breaks, ok, err
              to: p.plainContinuation
              value: p.plainContinuation(parent, flow)
            - opt:
                do:
                  - return: "\"\", err"
                when: err != nil
