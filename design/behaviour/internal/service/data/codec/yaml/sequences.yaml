  - of: (*parser).plainContinuationSegment
    participants:
      - id: caller
        kind: actor
      - id: (*parser).plainContinuationSegment
        kind: self
      - id: p.skipBlanks
        kind: internal
      - id: p.plainSegment
        kind: internal
      - id: p.plainStopError
        kind: internal
