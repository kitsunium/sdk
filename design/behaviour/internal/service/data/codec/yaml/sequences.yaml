      - bind: i
        eval: p.pos
      - loop:
          cond: isBlank(p.at(i))
          do:
            - op: ++
              set: i
      - opt:
          do:
            - return: 0, 0, false, nil
          when: p.at(i) != '\n'
      - set: next
        value: i + 1
      - loop:
          do:
            - bind: j, terr
              eval: p.lineBlanks(next, parent, p.line+breaks+1)
              to: p.lineBlanks
            - opt:
                do:
                  - return: 0, 0, false, terr
                when: terr != nil
            - opt:
                do:
                  - return: next, breaks, j < len(p.src) && p.continues(next, j, parent, flow), nil
