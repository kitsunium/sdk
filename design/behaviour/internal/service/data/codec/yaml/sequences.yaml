                - set: d.next
                  value: append(d.next, line...)
                - set: d.doc
                  value: d.doc[:start]
                - return: true, nil
            - case: isMarkerLine(line, "---")
              do:
                - set: state.explicit
                  value: "true"
            - case: isMarkerLine(line, "...")
              do:
                - op: ++
                  set: d.line
                - opt:
                    do:
                      - return: true, syntaxError(d.line, 1, "a document end marker closes no document")
                    when: "!state.found()"
                - return: true, nil
            - case: hasContent(line)
              do:
                - set: state.content
                  value: "true"
      - op: ++
        set: d.line
      - return: false, nil
  - of: (*yamlDecoder).readLine
    participants:
      - id: caller
        kind: actor
      - id: (*yamlDecoder).readLine
        kind: self
      - id: d.r.ReadSlice
        kind: value
    steps:
      - loop:
          do:
            - bind: piece, err
              eval: d.r.ReadSlice('\n')
              to: d.r.ReadSlice
            - set: dst
              value: append(dst, piece...)
            - opt:
                do:
                  - return: |-
                      dst, errs.Wrap(coreyaml.UnmarshalFailed, errs.WrapParams{},
                      				errs.Int("cap", maxYAMLBytes), errs.String("detail", "a document of the stream is larger than the decoder accepts"))
                when: len(dst) > maxYAMLBytes
            - opt:
                do:
                  - continue: true
                when: errors.Is(err, bufio.ErrBufferFull)
            - opt:
                do:
                  - return: |-
                      dst, errs.Wrap(err, errs.WrapParams{
                      				Code:    coreyaml.CodeYAMLUnmarshalFailed,
                      				Reason:  "UNMARSHAL_FAILED",
                      				Public:  "YAML decoding failed",
                      				Private: "service/data/codec/yaml.Decoder: the reader failed",
