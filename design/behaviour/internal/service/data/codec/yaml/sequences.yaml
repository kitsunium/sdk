      - opt:
          do:
            - return: p.errHere("a plain scalar cannot start with an indicator character")
              to: p.errHere
          when: p.startsIndicator(flow)
      - return: nil
  - of: (*parser).startsIndicator
    participants:
      - id: caller
        kind: actor
      - id: (*parser).startsIndicator
        kind: self
      - id: p.peek
        kind: internal
    steps:
      - bind: c
        eval: p.peek()
        to: p.peek
      - switch:
          cases:
            - case: "'-'"
              do:
                - return: p.blankOrEnd(p.pos+1) || (flow && isFlowIndicator(p.at(p.pos+1)))
            - case: "'?', ':'"
              do:
                - return: flow || p.blankOrEnd(p.pos+1)
