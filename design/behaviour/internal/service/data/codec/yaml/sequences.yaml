          do:
            - return: errs.Wrap(coreyaml.MarshalFailed, errs.WrapParams{}, errs.String("detail", detail))
              to: errs
          when: goType == ""
      - return: errs.Wrap(coreyaml.MarshalFailed, errs.WrapParams{}, errs.String("detail", detail), errs.String("type", goType))
        to: errs
