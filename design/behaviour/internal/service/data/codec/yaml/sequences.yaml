        eval: d.line + 1
      - bind: found, err
        eval: d.readDocument()
        to: d.readDocument
      - opt:
          do:
            - set: d.done
              value: "true"
            - return: err
          when: err != nil
      - opt:
          do:
            - set: d.done
              value: "true"
            - return: io.EOF
          when: "!found"
      - opt:
          do:
            - set: d.done
              value: "true"
            - return: err
