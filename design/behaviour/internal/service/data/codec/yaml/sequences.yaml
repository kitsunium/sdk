        eval: p.pos
      - bind: segEnd, stop
        eval: p.plainSegment(flow)
        to: p.plainSegment
      - opt:
          do:
            - return: stop, err
          init:
            bind: err
            eval: p.plainStopError(segEnd, stop, flow)
            to: p.plainStopError
          when: err != nil
      - set: p.text
        value: append(p.text, p.src[segStart:segEnd]...)
      - set: p.pos
        value: segEnd
      - return: stop, nil
  - of: (*parser).plainContinuation
