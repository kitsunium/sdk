        set: p.pos
      - return: "true"
  - of: (*parser).quotedEscape
    participants:
      - id: caller
        kind: actor
      - id: (*parser).quotedEscape
        kind: self
      - id: p.escape
        kind: internal
      - id: p.errAt
        kind: internal
      - id: p.joinEscapedBreak
        kind: internal
    steps:
      - set: q.blanks
        value: "0"
      - opt:
          do:
            - return: p.escape()
              to: p.escape
          when: p.at(p.pos+1) != '\n'
      - opt:
          do:
            - return: p.errAt(q.line, q.off, "a mapping key must be written on one line")
              to: p.errAt
          when: q.singleLine
      - op: ++
        set: p.pos
      - return: p.joinEscapedBreak(q.line, q.off)
        to: p.joinEscapedBreak
  - of: (*parser).quotedBreak
    participants:
      - id: caller
        kind: actor
      - id: (*parser).quotedBreak
        kind: self
      - id: p.errAt
        kind: internal
      - id: p.foldQuoted
        kind: internal
    steps:
      - opt:
          do:
            - return: p.errAt(q.line, q.off, "a mapping key must be written on one line")
              to: p.errAt
          when: q.singleLine
      - set: p.text
        value: p.text[:len(p.text)-q.blanks]
      - set: q.blanks
        value: "0"
      - return: p.foldQuoted(q.line, q.off)
        to: p.foldQuoted
  - of: (*parser).foldQuoted
    participants:
      - id: caller
        kind: actor
      - id: (*parser).foldQuoted
        kind: self
      - id: p.newline
        kind: internal
      - id: p.skipBlanks
        kind: internal
      - id: p.insideQuoted
        kind: internal
      - id: appendFold
        kind: internal
    steps:
      - bind: breaks
        eval: "0"
      - eval: p.newline()
        to: p.newline
      - eval: p.skipBlanks()
        to: p.skipBlanks
      - loop:
          cond: p.peek() == '\n'
          do:
            - op: ++
              set: breaks
            - eval: p.newline()
              to: p.newline
            - eval: p.skipBlanks()
              to: p.skipBlanks
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.insideQuoted(line, off)
            to: p.insideQuoted
          when: err != nil
      - set: p.text
        to: appendFold
        value: appendFold(p.text, breaks)
      - return: nil
  - of: (*parser).joinEscapedBreak
    participants:
      - id: caller
        kind: actor
      - id: (*parser).joinEscapedBreak
        kind: self
      - id: p.newline
        kind: internal
      - id: p.skipBlanks
        kind: internal
      - id: p.insideQuoted
        kind: internal
    steps:
      - eval: p.newline()
        to: p.newline
      - eval: p.skipBlanks()
        to: p.skipBlanks
      - loop:
          cond: p.peek() == '\n'
          do:
            - set: p.text
              value: append(p.text, '\n')
            - eval: p.newline()
              to: p.newline
            - eval: p.skipBlanks()
              to: p.skipBlanks
      - return: p.insideQuoted(line, off)
        to: p.insideQuoted
  - of: (*parser).insideQuoted
    participants:
      - id: caller
        kind: actor
      - id: (*parser).insideQuoted
        kind: self
      - id: p.errAt
        kind: internal
      - id: p.errHere
        kind: internal
    steps:
      - opt:
          do:
            - return: p.errAt(line, off, "a quoted scalar is not closed")
              to: p.errAt
          when: p.pos >= len(p.src)
      - opt:
          do:
            - return: p.errHere("a document marker inside a quoted scalar")
              to: p.errHere
          when: p.atDocumentMarker()
      - return: nil
  - of: (*parser).escape
    participants:
      - id: caller
        kind: actor
      - id: (*parser).escape
        kind: self
      - id: p.at
        kind: internal
      - id: utf8
        kind: stdlib
      - id: p.hexEscape
        kind: internal
      - id: p.errHere
        kind: internal
    steps:
      - bind: c
        eval: p.at(p.pos + 1)
        to: p.at
      - opt:
          do:
            - set: p.text
              to: utf8
              value: utf8.AppendRune(p.text, r)
            - op: +=
              set: p.pos
              value: "2"
