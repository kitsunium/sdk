        to: p.open
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - bind: key, err
        eval: p.scalar(value, style, line, off)
        to: p.scalar
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - opt:
          do:
            - return: noNode, err
          init:
            bind: err
            eval: p.keyIndicator(line, off, style, value, true)
            to: p.keyIndicator
          when: err != nil
      - bind: val, err
        eval: p.flowValue(parent)
        to: p.flowValue
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - set: p.stack
        value: append(p.stack, key, val)
      - eval: p.close(pair, base)
        to: p.close
      - set: p.nodes[pair].off, p.nodes[pair].line
        value: int32(off), int32(line)
      - return: pair, nil
  - of: (*parser).flowPair
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowPair
        kind: self
      - id: p.peek
        kind: internal
      - id: p.flowKey
        kind: internal
      - id: p.scalar
        kind: internal
      - id: p.skipBlanks
        kind: internal
      - id: p.checkKey
        kind: internal
      - id: p.empty
        kind: internal
      - id: p.keyIndicator
        kind: internal
      - id: p.flowValue
        kind: internal
    steps:
      - bind: line, off
        eval: p.line, p.pos
      - opt:
          do:
            - return: noNode, noNode, p.refuseAt(coreyaml.ComplexKeyRefused, line, off)
          init:
            bind: c
            eval: p.peek()
            to: p.peek
          when: c == '[' || c == '{'
      - bind: text, style, err
        eval: p.flowKey()
        to: p.flowKey
      - opt:
          do:
            - return: noNode, noNode, err
          when: err != nil
      - set: key, err
        to: p.scalar
        value: p.scalar(text, style, line, off)
      - opt:
          do:
            - return: noNode, noNode, err
          when: err != nil
      - bind: end
        eval: p.pos
      - eval: p.skipBlanks()
        to: p.skipBlanks
      - opt:
          do:
            - opt:
                do:
                  - return: noNode, noNode, err
                init:
                  bind: err
                  eval: p.checkKey(line, off, end, style, text)
                  to: p.checkKey
                when: err != nil
            - set: value, err
              to: p.empty
              value: p.empty(p.line, p.pos)
            - return: key, value, err
          when: "!p.atFlowValueIndicator(style)"
      - opt:
          do:
            - return: noNode, noNode, err
          init:
            bind: err
            eval: p.keyIndicator(line, off, style, text, true)
            to: p.keyIndicator
          when: err != nil
      - set: value, err
        to: p.flowValue
        value: p.flowValue(parent)
      - return: key, value, err
  - of: (*parser).atFlowValueIndicator
    participants:
      - id: caller
        kind: actor
      - id: (*parser).atFlowValueIndicator
        kind: self
      - id: p.blankOrEnd
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: p.peek() != ':'
      - opt:
          do:
            - return: "true"
          when: style != stylePlain
      - return: p.blankOrEnd(p.pos + 1)
        to: p.blankOrEnd
  - of: (*parser).flowKey
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowKey
        kind: self
      - id: p.refuseNodeIndicator
        kind: internal
      - id: p.scanDoubleQuoted
        kind: internal
      - id: p.scanSingleQuoted
        kind: internal
      - id: p.scanPlainKey
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", stylePlain, err"
          init:
            bind: err
            eval: p.refuseNodeIndicator(true)
            to: p.refuseNodeIndicator
          when: err != nil
      - switch:
          cases:
            - case: "'\"'"
              do:
                - bind: value, err
                  eval: p.scanDoubleQuoted(true)
                  to: p.scanDoubleQuoted
                - return: value, styleDouble, err
            - case: "'\\''"
              do:
                - bind: value, err
                  eval: p.scanSingleQuoted(true)
                  to: p.scanSingleQuoted
                - return: value, styleSingle, err
            - default: true
              do:
                - opt:
                    do:
                      - return: "\"\", stylePlain, p.errHere(\"a mapping key cannot be empty\")"
                    when: p.peek() == ':'
                - bind: value, err
                  eval: p.scanPlainKey(true)
                  to: p.scanPlainKey
                - return: value, stylePlain, err
          "on": p.peek()
  - of: (*parser).flowValue
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowValue
        kind: self
      - id: p.skipFlowSpace
        kind: internal
      - id: p.peek
        kind: internal
      - id: p.empty
        kind: internal
      - id: p.parseFlowCollection
        kind: internal
      - id: p.flowScalar
        kind: internal
      - id: p.scalar
        kind: internal
    steps:
      - bind: line, off
        eval: p.line, p.pos
      - opt:
          do:
            - return: noNode, err
          init:
            bind: err
            eval: p.skipFlowSpace(line, off)
            to: p.skipFlowSpace
          when: err != nil
      - opt:
          do:
            - return: p.empty(line, off)
              to: p.empty
          init:
            bind: c
            eval: p.peek()
            to: p.peek
          when: c == ',' || c == ']' || c == '}'
      - opt:
          do:
            - return: p.parseFlowCollection(parent)
              to: p.parseFlowCollection
          init:
            bind: c
            eval: p.peek()
            to: p.peek
          when: c == '[' || c == '{'
      - bind: valueLine, valueOff
        eval: p.line, p.pos
      - bind: value, style, err
        eval: p.flowScalar(parent)
        to: p.flowScalar
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - return: p.scalar(value, style, valueLine, valueOff)
        to: p.scalar
  - of: (*parser).flowScalar
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowScalar
        kind: self
      - id: p.refuseNodeIndicator
        kind: internal
      - id: p.scanDoubleQuoted
        kind: internal
      - id: p.scanSingleQuoted
        kind: internal
      - id: p.scanPlain
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", stylePlain, err"
          init:
            bind: err
            eval: p.refuseNodeIndicator(true)
            to: p.refuseNodeIndicator
          when: err != nil
      - switch:
          cases:
            - case: "'\"'"
              do:
                - bind: value, err
                  eval: p.scanDoubleQuoted(false)
                  to: p.scanDoubleQuoted
                - return: value, styleDouble, err
            - case: "'\\''"
              do:
                - bind: value, err
                  eval: p.scanSingleQuoted(false)
                  to: p.scanSingleQuoted
                - return: value, styleSingle, err
            - default: true
              do:
                - bind: value, err
                  eval: p.scanPlain(parent, true)
                  to: p.scanPlain
                - return: value, stylePlain, err
          "on": p.peek()
  - of: (*parser).skipFlowSpace
    participants:
      - id: caller
        kind: actor
      - id: (*parser).skipFlowSpace
        kind: self
      - id: p.flowSpaceStep
        kind: internal
      - id: p.errAt
        kind: internal
      - id: p.flowSpaceError
        kind: internal
    steps:
      - loop:
          do:
            - bind: moved, err
              eval: p.flowSpaceStep()
              to: p.flowSpaceStep
            - opt:
                do:
                  - break: true
                when: "!moved || err != nil"
          forever: true
      - opt:
          do:
            - return: p.errAt(line, off, "a flow collection is not closed")
              to: p.errAt
          when: p.pos >= len(p.src)
      - return: p.flowSpaceError()
        to: p.flowSpaceError
  - of: (*parser).flowSpaceStep
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowSpaceStep
        kind: self
      - id: p.peek
        kind: internal
      - id: p.newline
        kind: internal
      - id: p.skipToEOL
        kind: internal
      - id: p.atDocumentMarker
        kind: internal
    steps:
      - switch:
          cases:
            - case: isBlank(c)
              do:
                - op: ++
                  set: p.pos
            - case: c == '\n'
              do:
                - eval: p.newline()
                  to: p.newline
            - case: c == '#' && (p.pos == p.lineStart || isBlank(p.src[p.pos-1]))
              do:
                - eval: p.skipToEOL()
                  to: p.skipToEOL
            - default: true
              do:
                - return: false, nil
          init:
            bind: c
            eval: p.peek()
            to: p.peek
      - return: "!p.atDocumentMarker(), nil"
        to: p.atDocumentMarker
  - of: (*parser).flowSpaceError
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowSpaceError
        kind: self
      - id: p.errHere
        kind: internal
    steps:
      - opt:
          do:
            - return: p.errHere("a document marker inside a flow collection")
              to: p.errHere
          when: p.atDocumentMarker()
      - return: nil
  - of: typeHooks.has
    steps:
      - return: h&hook != 0
  - of: hooksOf
    participants:
      - id: caller
        kind: actor
      - id: hooksOf
        kind: self
      - id: hooksCache.Load
        kind: value
      - id: computeHooks
        kind: internal
      - id: hooksCache.Store
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: hooks
                init:
                  bind: hooks, isHooks
                  eval: cached.(typeHooks)
                when: isHooks
          init:
            bind: cached, ok
            eval: hooksCache.Load(t)
            to: hooksCache.Load
          when: ok
      - bind: hooks
        eval: computeHooks(t)
        to: computeHooks
      - eval: hooksCache.Store(t, hooks)
        to: hooksCache.Store
      - return: hooks
  - of: computeHooks
    participants:
      - id: caller
        kind: actor
      - id: computeHooks
        kind: self
      - id: reflect
        kind: stdlib
    steps:
      - bind: ptr
        eval: reflect.PointerTo(t)
        to: reflect
      - var:
          name: h
          type: typeHooks
      - loop:
          do:
            - opt:
                do:
                  - op: "|="
                    set: h
                    value: check.bit
                when: check.target.Implements(check.iface)
          key: _
          range: |-
            []struct {
            		target reflect.Type
            		iface  reflect.Type
            		bit    typeHooks
            	}{
            		{t, marshalerType, hookMarshaler},
            		{t, textMarshalerType, hookTextMarshaler},
            		{ptr, unmarshalerType, hookUnmarshaler},
            		{ptr, textUnmarshalerType, hookTextUnmarshaler},
            		{t, isZeroerType, hookIsZeroer},
            	}
          value: check
      - return: h | pointerOnlyHooks(ptr, h)
  - of: pointerOnlyHooks
    participants:
      - id: caller
        kind: actor
      - id: pointerOnlyHooks
        kind: self
      - id: ptr.MethodByName
        kind: value
    steps:
      - var:
          name: extra
          type: typeHooks
      - opt:
          do:
            - op: "|="
              set: extra
              value: hookPtrMarshaler
          when: "!h.has(hookMarshaler) && ptr.Implements(marshalerType)"
      - opt:
          do:
            - op: "|="
              set: extra
              value: hookPtrTextMarshaler
          when: "!h.has(hookTextMarshaler) && ptr.Implements(textMarshalerType)"
      - opt:
          do:
            - op: "|="
              set: extra
              value: hookForeignUnmarshaler
          init:
            bind: _, has
            eval: ptr.MethodByName("UnmarshalYAML")
            to: ptr.MethodByName
          when: has && !h.has(hookUnmarshaler)
      - return: extra
  - of: marshalYAMLHook
    steps:
      - return: reflect.TypeAssert[marshalYAMLer](v)
  - of: unmarshalYAMLHook
    steps:
      - return: reflect.TypeAssert[unmarshalYAMLer](v)
  - of: isZeroHook
    steps:
      - return: reflect.TypeAssert[isZeroer](v)
  - of: (*encoder).encodeDocument
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).encodeDocument
        kind: self
      - id: e.writeAny
        kind: internal
    steps:
      - return: e.writeAny(v, rootColumn, atRoot, false)
        to: e.writeAny
  - of: (*encoder).enter
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).enter
        kind: self
      - id: marshalError
        kind: internal
    steps:
      - op: ++
        set: e.depth
      - opt:
          do:
            - return: marshalError("the value nests deeper than the encoder accepts", "")
              to: marshalError
          when: e.depth > maxDepth
      - return: nil
  - of: (*encoder).leave
    steps:
      - op: "--"
        set: e.depth
  - of: (*encoder).writeAny
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeAny
        kind: self
      - id: e.writeStringMap
        kind: internal
      - id: e.writeList
        kind: internal
      - id: e.writeString
        kind: internal
      - id: e.writeValue
        kind: internal
    steps:
      - typeswitch:
          bind: x
          cases:
            - do:
                - return: e.writeStringMap(x, col, at, flow)
                  to: e.writeStringMap
              types: map[string]any
            - do:
                - return: e.writeList(x, col, at, flow)
                  to: e.writeList
              types: "[]any"
            - do:
                - return: e.writeString(x, col, at)
                  to: e.writeString
              types: string
          "on": x
      - opt:
          do:
            - return: nil
          when: e.writeUntypedScalar(x, at)
      - return: e.writeValue(reflect.ValueOf(x), col, at, flow)
        to: e.writeValue
  - of: (*encoder).writeUntypedScalar
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeUntypedScalar
        kind: self
      - id: e.writeScalarText
        kind: internal
      - id: e.writeInt
        kind: internal
      - id: e.writeFloat
        kind: internal
    steps:
      - typeswitch:
          bind: x
          cases:
            - do:
                - eval: e.writeScalarText("null", at)
                  to: e.writeScalarText
              types: nil
            - do:
                - eval: e.writeScalarText(strconv.FormatBool(x), at)
                  to: e.writeScalarText
              types: bool
            - do:
                - eval: e.writeInt(int64(x), at)
                  to: e.writeInt
              types: int
            - do:
                - eval: e.writeFloat(x, float64Bits, at)
                  to: e.writeFloat
              types: float64
            - default: true
              do:
                - return: "false"
          "on": x
      - return: "true"
  - of: (*encoder).writeValue
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeValue
        kind: self
      - id: e.enter
        kind: internal
      - id: e.leave
        kind: internal
      - id: e.resolve
        kind: internal
      - id: e.writeScalarText
        kind: internal
      - id: e.writeString
        kind: internal
      - id: e.writeAny
        kind: internal
      - id: e.writeKind
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.enter()
            to: e.enter
          when: err != nil
      - defer: e.leave()
        to: e.leave
      - bind: r, err
        eval: e.resolve(v)
        to: e.resolve
      - opt:
          do:
            - return: err
          when: err != nil
      - switch:
          cases:
            - case: shapeNull
              do:
                - eval: e.writeScalarText("null", at)
                  to: e.writeScalarText
                - return: nil
            - case: shapeText
              do:
                - return: e.writeString(r.text, col, at)
                  to: e.writeString
            - case: shapeAny
              do:
                - return: e.writeAny(r.replacement, col, at, flow)
                  to: e.writeAny
            - default: true
              do:
                - return: e.writeKind(r.value, col, at, flow)
                  to: e.writeKind
          "on": r.shape
  - of: (*encoder).resolve
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).resolve
        kind: self
      - id: applyHooks
        kind: internal
      - id: v.Elem
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: resolved{}, marshalError("the value nests deeper than the encoder accepts", "")
                when: e.depth+steps > maxDepth
            - opt:
                do:
                  - return: "resolved{shape: shapeNull}, nil"
                when: isNilValue(v)
            - opt:
                do:
                  - return: r, err
                init:
                  bind: r, hooked, err
                  eval: applyHooks(v)
                  to: applyHooks
                when: hooked || err != nil
            - opt:
                do:
                  - return: "resolved{shape: shapeValue, value: v}, nil"
                when: v.Kind() != reflect.Pointer && v.Kind() != reflect.Interface
            - set: v
              to: v.Elem
              value: v.Elem()
          init: steps := 0
          post: steps++
  - of: isNilValue
    participants:
      - id: caller
        kind: actor
      - id: isNilValue
        kind: self
      - id: v.Kind
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          when: "!v.IsValid()"
      - bind: k
        eval: v.Kind()
        to: v.Kind
      - return: (k == reflect.Pointer || k == reflect.Interface) && v.IsNil()
  - of: applyHooks
    participants:
      - id: caller
        kind: actor
      - id: applyHooks
        kind: self
      - id: v.Type
        kind: value
      - id: hooksOf
        kind: internal
      - id: callMarshalYAML
        kind: internal
      - id: callMarshalText
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - return: resolved{}, false, nil
          when: "!mayHaveHooks(t)"
      - bind: h
        eval: hooksOf(t)
        to: hooksOf
      - switch:
          cases:
            - case: usesHook(h, hookMarshaler, hookPtrMarshaler, v)
              do:
                - return: callMarshalYAML(receiver(v, h.has(hookPtrMarshaler)), t)
                  to: callMarshalYAML
            - case: usesHook(h, hookTextMarshaler, hookPtrTextMarshaler, v)
              do:
                - return: callMarshalText(receiver(v, h.has(hookPtrTextMarshaler)), t)
                  to: callMarshalText
            - case: t == durationType
              do:
                - return: "resolved{shape: shapeText, text: time.Duration(v.Int()).String()}, true, nil"
      - return: resolved{}, false, nil
  - of: usesHook
    steps:
      - return: h.has(own) || (h.has(viaPointer) && v.CanAddr())
  - of: receiver
    participants:
      - id: caller
        kind: actor
      - id: receiver
        kind: self
      - id: v.Addr
        kind: value
    steps:
      - opt:
          do:
            - return: v.Addr()
              to: v.Addr
          when: viaPointer
      - return: v
  - of: callMarshalYAML
    participants:
      - id: caller
        kind: actor
      - id: callMarshalYAML
        kind: self
      - id: marshalYAMLHook
        kind: internal
      - id: m.MarshalYAML
        kind: internal
    steps:
      - bind: m, ok
        eval: marshalYAMLHook(target)
        to: marshalYAMLHook
      - opt:
          do:
            - return: resolved{}, false, nil
          when: "!ok"
      - bind: replacement, err
        eval: m.MarshalYAML()
        to: m.MarshalYAML
      - opt:
          do:
            - return: resolved{}, true, hookMarshalFailed(err, t)
          when: err != nil
      - return: "resolved{shape: shapeAny, replacement: replacement}, true, nil"
  - of: callMarshalText
    participants:
      - id: caller
        kind: actor
      - id: callMarshalText
        kind: self
      - id: m.MarshalText
        kind: value
    steps:
      - bind: m, ok
        eval: reflect.TypeAssert[encoding.TextMarshaler](target)
      - opt:
          do:
            - return: resolved{}, false, nil
          when: "!ok"
      - bind: text, err
        eval: m.MarshalText()
        to: m.MarshalText
      - opt:
          do:
            - return: resolved{}, true, hookMarshalFailed(err, t)
          when: err != nil
      - return: "resolved{shape: shapeText, text: string(text)}, true, nil"
  - of: hookMarshalFailed
    participants:
      - id: caller
        kind: actor
      - id: hookMarshalFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coreyaml.CodeYAMLMarshalFailed,
          		Reason:  "MARSHAL_FAILED",
          		Public:  "YAML encoding failed",
          		Private: "service/data/codec/yaml: a type's own encoding hook returned an error",
          	}, errs.String("type", t.String()))
        to: errs
  - of: (*encoder).writeKind
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeKind
        kind: self
      - id: e.writeMap
        kind: internal
      - id: e.writeStruct
        kind: internal
      - id: e.writeSequence
        kind: internal
      - id: e.writeString
        kind: internal
      - id: e.separate
        kind: internal
      - id: marshalError
        kind: internal
      - id: e.buf.WriteByte
        kind: value
    steps:
      - switch:
          cases:
            - case: reflect.Map
              do:
                - return: e.writeMap(v, col, at, flow)
                  to: e.writeMap
            - case: reflect.Struct
              do:
                - return: e.writeStruct(v, col, at, flow)
                  to: e.writeStruct
            - case: reflect.Slice, reflect.Array
              do:
                - return: e.writeSequence(v, col, at, flow || v.Type().Elem().Kind() == reflect.Uint8)
                  to: e.writeSequence
            - case: reflect.String
              do:
                - return: e.writeString(v.String(), col, at)
                  to: e.writeString
            - default: true
              do:
                - eval: e.separate(at)
                  to: e.separate
                - opt:
                    do:
                      - return: marshalError("the value's kind has no YAML representation", v.Type().String())
                        to: marshalError
                    when: "!e.appendScalarKind(v)"
                - eval: e.buf.WriteByte('\n')
                  to: e.buf.WriteByte
                - return: nil
          "on": v.Kind()
  - of: (*encoder).appendScalarKind
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).appendScalarKind
        kind: self
      - id: e.buf.WriteString
        kind: value
      - id: e.buf.Write
        kind: value
    steps:
      - switch:
          cases:
            - case: reflect.Bool
              do:
                - eval: e.buf.WriteString(strconv.FormatBool(v.Bool()))
                  to: e.buf.WriteString
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - eval: e.buf.Write(strconv.AppendInt(e.buf.AvailableBuffer(), v.Int(), decimalBase))
                  to: e.buf.Write
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr
              do:
                - eval: e.buf.Write(strconv.AppendUint(e.buf.AvailableBuffer(), v.Uint(), decimalBase))
                  to: e.buf.Write
            - case: reflect.Float32, reflect.Float64
              do:
                - eval: e.buf.Write(appendFloat(e.buf.AvailableBuffer(), v.Float(), v.Type().Bits()))
                  to: e.buf.Write
            - default: true
              do:
                - return: "false"
          "on": v.Kind()
      - return: "true"
  - of: (*encoder).separate
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).separate
        kind: self
      - id: e.buf.WriteByte
        kind: value
    steps:
      - opt:
          do:
            - eval: e.buf.WriteByte(' ')
              to: e.buf.WriteByte
          when: at != atRoot
  - of: (*encoder).writeScalarText
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeScalarText
        kind: self
      - id: e.separate
        kind: internal
      - id: e.buf.WriteString
        kind: value
      - id: e.buf.WriteByte
        kind: value
    steps:
      - eval: e.separate(at)
        to: e.separate
      - eval: e.buf.WriteString(text)
        to: e.buf.WriteString
      - eval: e.buf.WriteByte('\n')
        to: e.buf.WriteByte
  - of: (*encoder).writeInt
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeInt
        kind: self
      - id: e.separate
        kind: internal
      - id: e.buf.Write
        kind: value
      - id: e.buf.WriteByte
        kind: value
    steps:
      - eval: e.separate(at)
        to: e.separate
      - eval: e.buf.Write(strconv.AppendInt(e.buf.AvailableBuffer(), i, decimalBase))
        to: e.buf.Write
      - eval: e.buf.WriteByte('\n')
        to: e.buf.WriteByte
  - of: (*encoder).writeFloat
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeFloat
        kind: self
      - id: e.separate
        kind: internal
      - id: e.buf.Write
        kind: value
      - id: e.buf.WriteByte
        kind: value
    steps:
      - eval: e.separate(at)
        to: e.separate
      - eval: e.buf.Write(appendFloat(e.buf.AvailableBuffer(), f, bits))
        to: e.buf.Write
      - eval: e.buf.WriteByte('\n')
        to: e.buf.WriteByte
  - of: (*encoder).openBlock
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).openBlock
        kind: self
      - id: e.buf.WriteByte
        kind: value
    steps:
      - switch:
          cases:
            - case: atRoot
              do:
                - return: col + indentStep, false
            - case: afterKey
              do:
                - eval: e.buf.WriteByte('\n')
                  to: e.buf.WriteByte
                - return: col + indentStep, false
            - default: true
              do:
                - eval: e.buf.WriteByte(' ')
                  to: e.buf.WriteByte
                - return: col + indentStep, true
          "on": at
  - of: (*encoder).writeIndent
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeIndent
        kind: self
      - id: e.buf.WriteByte
        kind: value
    steps:
      - loop:
          do:
            - eval: e.buf.WriteByte(' ')
              to: e.buf.WriteByte
          range: "n"
  - of: (*encoder).writeEntryStart
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeEntryStart
        kind: self
      - id: e.writeIndent
        kind: internal
    steps:
      - opt:
          do:
            - eval: e.writeIndent(inner)
              to: e.writeIndent
          when: "!first || !firstInline"
  - of: (*encoder).writeStringMap
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeStringMap
        kind: self
      - id: e.enter
        kind: internal
      - id: e.leave
        kind: internal
      - id: e.writeScalarText
        kind: internal
      - id: slices
        kind: stdlib
      - id: e.openFlow
        kind: internal
      - id: e.finishFlow
        kind: internal
      - id: e.openBlock
        kind: internal
      - id: e.writeEntryStart
        kind: internal
      - id: e.writeKeyThen
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.enter()
            to: e.enter
          when: err != nil
      - defer: e.leave()
        to: e.leave
      - opt:
          do:
            - eval: e.writeScalarText("{}", at)
              to: e.writeScalarText
            - return: nil
          when: len(m) == 0
      - bind: keys
        eval: slices.Sorted(maps.Keys(m))
        to: slices
      - opt:
          do:
            - eval: e.openFlow(at)
              to: e.openFlow
            - return: e.finishFlow(e.writeFlowStringMap(m, keys))
              to: e.finishFlow
          when: flow
      - bind: inner, firstInline
        eval: e.openBlock(col, at)
        to: e.openBlock
      - loop:
          do:
            - eval: e.writeEntryStart(inner, i == 0, firstInline)
              to: e.writeEntryStart
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: e.writeKeyThen(k, func() error { return e.writeAny(m[k], inner, afterKey, false) })
                  to: e.writeKeyThen
                when: err != nil
          key: i
          range: keys
          value: k
      - return: nil
  - of: (*encoder).writeKeyThen
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeKeyThen
        kind: self
      - id: e.writeKey
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.writeKey(key)
            to: e.writeKey
          when: err != nil
      - return: value()
  - of: (*encoder).writeList
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeList
        kind: self
      - id: e.enter
        kind: internal
      - id: e.leave
        kind: internal
      - id: e.writeScalarText
        kind: internal
      - id: e.openFlow
        kind: internal
      - id: e.finishFlow
        kind: internal
      - id: e.openBlock
        kind: internal
      - id: e.writeEntryStart
        kind: internal
      - id: e.buf.WriteByte
        kind: value
      - id: e.writeAny
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.enter()
            to: e.enter
          when: err != nil
      - defer: e.leave()
        to: e.leave
      - opt:
          do:
            - eval: e.writeScalarText("[]", at)
              to: e.writeScalarText
            - return: nil
          when: len(list) == 0
      - opt:
          do:
            - eval: e.openFlow(at)
              to: e.openFlow
            - return: e.finishFlow(e.writeFlowList(list))
              to: e.finishFlow
          when: flow
      - bind: inner, firstInline
        eval: e.openBlock(col, at)
        to: e.openBlock
      - loop:
          do:
            - eval: e.writeEntryStart(inner, i == 0, firstInline)
              to: e.writeEntryStart
            - eval: e.buf.WriteByte('-')
              to: e.buf.WriteByte
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: e.writeAny(item, inner, afterDash, false)
                  to: e.writeAny
                when: err != nil
          key: i
          range: list
          value: item
      - return: nil
  - of: (*encoder).writeMap
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).writeMap
        kind: self
      - id: e.writeScalarText
        kind: internal
      - id: e.writeTextKeyedMap
        kind: internal
      - id: v.MapKeys
        kind: value
      - id: slices
        kind: stdlib
      - id: e.openFlow
        kind: internal
      - id: e.finishFlow
        kind: internal
      - id: e.openBlock
        kind: internal
      - id: e.writeEntryStart
        kind: internal
      - id: e.writeKeyValueThen
        kind: internal
    steps:
      - opt:
          do:
            - eval: e.writeScalarText("{}", at)
              to: e.writeScalarText
            - return: nil
          when: v.Len() == 0
      - opt:
          do:
            - return: e.writeTextKeyedMap(v, col, at)
              to: e.writeTextKeyedMap
          when: "!flow && textKeyed(v.Type().Key())"
      - bind: keys
        eval: v.MapKeys()
        to: v.MapKeys
      - eval: slices.SortFunc(keys, compareKeys)
        to: slices
      - opt:
          do:
            - eval: e.openFlow(at)
              to: e.openFlow
            - return: e.finishFlow(e.writeFlowMap(v, keys))
