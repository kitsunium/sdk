          do:
            - return: p.errHere("a hexadecimal escape does not name a Unicode character")
              to: p.errHere
          when: err != nil || !isScalarValue(value)
      - set: p.text
        to: utf8
        value: utf8.AppendRune(p.text, rune(value))
      - set: p.pos
        value: start + width
      - return: nil
  - of: isScalarValue
    steps:
      - return: value <= utf8.MaxRune && (value < uint64(surrogateFirst) || value > uint64(surrogateLast))
  - of: (*parser).parseBlockScalar
    participants:
      - id: caller
        kind: actor
      - id: (*parser).parseBlockScalar
        kind: self
      - id: b.set
        kind: internal
      - id: p.readBlockHeader
        kind: internal
      - id: p.blockBreaks
        kind: internal
      - id: p.blockContent
        kind: internal
      - id: p.chompBlock
        kind: internal
      - id: p.scalar
        kind: internal
    steps:
      - bind: line, off
        eval: p.line, p.pos
      - bind: b
        eval: blockScalar{}
      - eval: b.set(blockLiteral, p.peek() == '|')
        to: b.set
      - op: ++
        set: p.pos
      - bind: header, err
        eval: p.readBlockHeader()
        to: p.readBlockHeader
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - set: p.text
        value: p.text[:0]
      - set: b.trailing, b.indent, err
        to: p.blockBreaks
        value: p.blockBreaks(blockIndent(parent, header.indicator), parent, header.indicator == 0)
      - opt:
          do:
            - return: noNode, err
          when: err != nil
      - opt:
          do:
            - return: noNode, err
          init:
            bind: err
            eval: p.blockContent(&b)
            to: p.blockContent
          when: err != nil
      - eval: p.chompBlock(&b, header.chomp)
        to: p.chompBlock
      - opt:
          do:
            - set: p.pos
              value: p.lineStart
          when: p.pos < len(p.src)
      - return: p.scalar(string(p.text), styleBlock, line, off)
        to: p.scalar
  - of: blockIndent
    steps:
      - opt:
          do:
            - return: "0"
          when: indicator == 0
      - opt:
          do:
            - return: indicator
          when: parent < 0
      - return: parent + indicator
  - of: (*parser).blockContent
    participants:
      - id: caller
        kind: actor
      - id: (*parser).blockContent
        kind: self
      - id: p.blockLineStart
        kind: internal
      - id: p.skipToEOL
        kind: internal
      - id: p.newline
        kind: internal
      - id: b.set
        kind: internal
      - id: p.blockBreaks
        kind: internal
    steps:
      - loop:
          cond: p.col() == b.indent && p.pos < len(p.src)
          do:
            - eval: p.blockLineStart(b)
              to: p.blockLineStart
            - bind: lineStart
              eval: p.pos
            - eval: p.skipToEOL()
              to: p.skipToEOL
            - set: p.text
              value: append(p.text, p.src[lineStart:p.pos]...)
            - opt:
                do:
                  - set: b.trailing
                    value: "0"
                  - return: nil
                when: p.pos >= len(p.src)
            - eval: p.newline()
              to: p.newline
            - eval: b.set(blockLeadingBreak, true)
              to: b.set
            - var:
                name: err
                type: error
            - set: b.trailing, _, err
              to: p.blockBreaks
              value: p.blockBreaks(b.indent, 0, false)
            - opt:
                do:
                  - return: err
                when: err != nil
      - return: nil
  - of: (*parser).blockLineStart
    participants:
      - id: caller
        kind: actor
      - id: (*parser).blockLineStart
        kind: self
      - id: isBlank
        kind: internal
      - id: b.set
        kind: internal
    steps:
      - bind: trailingBlank
        eval: isBlank(p.peek())
        to: isBlank
      - opt:
          do:
            - opt:
                do:
                  - set: p.text
                    value: append(p.text, ' ')
                when: b.trailing == 0
            - eval: b.set(blockLeadingBreak, false)
              to: b.set
          when: b.folds(trailingBlank)
      - opt:
          do:
            - set: p.text
              value: append(p.text, '\n')
            - eval: b.set(blockLeadingBreak, false)
              to: b.set
          when: b.has(blockLeadingBreak)
      - loop:
          do:
            - set: p.text
              value: append(p.text, '\n')
          range: b.trailing
      - eval: b.set(blockLeadingBlank, trailingBlank)
        to: b.set
  - of: (*blockScalar).has
    steps:
      - return: b.flags&flag != 0
  - of: (*blockScalar).set
    steps:
      - opt:
          do:
            - op: "|="
              set: b.flags
              value: flag
            - return: ""
          when: "on"
      - op: "&^="
        set: b.flags
        value: flag
  - of: (*blockScalar).folds
    steps:
      - return: "!b.has(blockLiteral) && b.has(blockLeadingBreak) && !b.has(blockLeadingBlank) && !trailingBlank"
  - of: (*parser).chompBlock
    steps:
      - opt:
          do:
            - set: p.text
              value: append(p.text, '\n')
          when: chomp != chompStrip && b.has(blockLeadingBreak)
      - opt:
          do:
            - loop:
                do:
                  - set: p.text
                    value: append(p.text, '\n')
                range: b.trailing
          when: chomp == chompKeep
  - of: (*parser).readBlockHeader
    participants:
      - id: caller
        kind: actor
      - id: (*parser).readBlockHeader
        kind: self
      - id: p.headerIndicator
        kind: internal
    steps:
      - bind: h
        eval: "blockHeader{chomp: chompClip}"
      - loop:
          do:
            - opt:
                do:
                  - return: h, err
                init:
                  bind: err
                  eval: p.headerIndicator(&h)
                  to: p.headerIndicator
                when: err != nil
          range: "2"
      - opt:
          do:
            - return: h, p.errHere("a block scalar header holds an unknown indicator")
          when: "!p.blankOrEnd(p.pos)"
      - return: h, p.finishLine()
  - of: (*parser).headerIndicator
    participants:
      - id: caller
        kind: actor
      - id: (*parser).headerIndicator
        kind: self
      - id: p.peek
        kind: internal
      - id: chompOf
        kind: internal
      - id: p.errHere
        kind: internal
    steps:
      - bind: c
        eval: p.peek()
        to: p.peek
      - switch:
          cases:
            - case: (c == '+' || c == '-') && !h.seenChomp
              do:
                - set: h.seenChomp
                  value: "true"
                - set: h.chomp
                  to: chompOf
                  value: chompOf(c)
                - op: ++
                  set: p.pos
            - case: c >= '1' && c <= '9' && h.indicator == 0
              do:
                - set: h.indicator
                  value: int(c - '0')
                - op: ++
                  set: p.pos
            - case: c == '0'
              do:
                - return: p.errHere("a block scalar's indentation indicator cannot be 0")
                  to: p.errHere
      - return: nil
  - of: chompOf
    steps:
      - opt:
          do:
            - return: chompKeep
          when: indicator == '+'
      - return: chompStrip
  - of: (*parser).blockBreaks
    participants:
      - id: caller
        kind: actor
      - id: (*parser).blockBreaks
        kind: self
      - id: p.blockIndentation
        kind: internal
      - id: p.newline
        kind: internal
      - id: p.detectIndent
        kind: internal
    steps:
      - bind: maxEmpty
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - return: 0, 0, err
                init:
                  bind: err
                  eval: p.blockIndentation(indent)
                  to: p.blockIndentation
                when: err != nil
            - opt:
                do:
                  - break: true
                when: p.peek() != '\n'
            - set: maxEmpty
              value: max(maxEmpty, p.col())
            - op: ++
              set: breaks
            - eval: p.newline()
              to: p.newline
          forever: true
      - opt:
          do:
            - return: breaks, indent, nil
          when: "!detect"
      - set: detected, err
        to: p.detectIndent
        value: p.detectIndent(parent, maxEmpty)
      - return: breaks, detected, err
  - of: (*parser).blockIndentation
    participants:
      - id: caller
        kind: actor
      - id: (*parser).blockIndentation
        kind: self
      - id: p.errHere
        kind: internal
    steps:
      - loop:
          cond: p.inBlockIndentation(indent) && p.peek() == ' '
          do:
            - op: ++
              set: p.pos
      - opt:
          do:
            - return: p.errHere("a tab character cannot indent a block scalar")
              to: p.errHere
          when: p.inBlockIndentation(indent) && p.peek() == '\t'
      - return: nil
  - of: (*parser).inBlockIndentation
    steps:
      - return: indent == 0 || p.col() < indent
  - of: (*parser).detectIndent
    steps:
      - bind: floor
        eval: max(parent+1, 1)
      - opt:
          do:
            - return: 0, p.errHere("a block scalar's leading empty line is indented deeper than its first line")
          when: p.pos < len(p.src) && p.col() >= floor && maxEmpty > p.col()
      - return: max(p.col(), floor), nil
  - of: structInfoOf
    participants:
      - id: caller
        kind: actor
      - id: structInfoOf
        kind: self
      - id: structCache.Load
        kind: value
      - id: buildStructInfo
        kind: internal
      - id: structCache.Store
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: info
                init:
                  bind: info, isInfo
                  eval: cached.(*structInfo)
                when: isInfo
          init:
            bind: cached, ok
            eval: structCache.Load(t)
            to: structCache.Load
          when: ok
      - bind: info
        eval: "&structInfo{byKey: map[string]int{}}"
      - eval: "buildStructInfo(info, t, nil, map[reflect.Type]bool{t: true})"
        to: buildStructInfo
      - eval: structCache.Store(t, info)
        to: structCache.Store
      - return: info
  - of: buildStructInfo
    participants:
      - id: caller
        kind: actor
      - id: buildStructInfo
        kind: self
      - id: t.Field
        kind: value
      - id: yamlTag
        kind: internal
      - id: strings
        kind: stdlib
      - id: parseTagFlags
        kind: internal
      - id: inlineField
        kind: internal
      - id: addField
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: ""
                when: info.tagError != ""
            - bind: field
              eval: t.Field(i)
              to: t.Field
            - bind: tag, ok
              eval: yamlTag(field)
              to: yamlTag
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - bind: name, flags, _
              eval: strings.Cut(tag, ",")
              to: strings
            - bind: opts, err
              eval: parseTagFlags(flags)
              to: parseTagFlags
            - opt:
                do:
                  - set: info.tagError
                    value: err
                  - return: ""
                when: err != ""
            - bind: index
              eval: append(slices.Clone(prefix), i)
            - opt:
                do:
                  - eval: inlineField(info, field, index, visiting)
                    to: inlineField
                  - continue: true
                when: opts.inline
            - opt:
                do:
                  - continue: true
                when: "!field.IsExported()"
            - opt:
                do:
                  - set: name
                    to: strings
                    value: strings.ToLower(field.Name)
                when: name == ""
            - eval: "addField(info, fieldInfo{key: name, index: index, omitEmpty: opts.omitEmpty, flow: opts.flow})"
              to: addField
          key: i
          range: t.NumField()
  - of: yamlTag
    participants:
      - id: caller
        kind: actor
      - id: yamlTag
        kind: self
      - id: field.Tag.Get
        kind: value
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: "!field.IsExported() && !field.Anonymous"
      - bind: tag
        eval: field.Tag.Get("yaml")
        to: field.Tag.Get
      - opt:
          do:
            - set: tag
              value: string(field.Tag)
          when: tag == "" && !strings.Contains(string(field.Tag), ":")
      - opt:
          do:
            - return: "\"\", false"
          when: tag == "-"
      - return: tag, true
  - of: inlineField
    participants:
      - id: caller
        kind: actor
      - id: inlineField
        kind: self
      - id: t.Elem
        kind: value
      - id: buildStructInfo
        kind: internal
    steps:
      - bind: t
        eval: field.Type
      - opt:
          do:
            - opt:
                do:
                  - set: info.tagError
                    value: "\"an inline map must be the only one and have string keys\""
                  - return: ""
                when: info.inlineMap != nil || t.Key().Kind() != reflect.String
            - set: info.inlineMap
              value: index
            - return: ""
          when: t.Kind() == reflect.Map
      - opt:
          do:
            - opt:
                do:
                  - set: info.tagError
                    value: "\"an inlined pointer to a struct must be an exported field\""
                  - return: ""
                when: "!field.IsExported()"
            - set: t
              to: t.Elem
              value: t.Elem()
          when: t.Kind() == reflect.Pointer
      - opt:
          do:
            - set: info.tagError
              value: "\"inline applies to a struct, a pointer to a struct, or a map\""
            - return: ""
          when: t.Kind() != reflect.Struct
      - opt:
          do:
            - set: info.tagError
              value: "\"inlined structs form a cycle\""
            - return: ""
          when: visiting[t]
      - set: visiting[t]
        value: "true"
      - eval: buildStructInfo(info, t, index, visiting)
        to: buildStructInfo
      - eval: delete(visiting, t)
  - of: addField
    steps:
      - opt:
          do:
            - set: info.tagError
              value: "\"two fields of a struct declare the same yaml key\""
            - return: ""
          init:
            bind: _, dup
            eval: info.byKey[f.key]
          when: dup
      - set: info.byKey[f.key]
        value: len(info.fields)
      - set: info.fields
        value: append(info.fields, f)
  - of: decodeDocument
    participants:
      - id: caller
        kind: actor
      - id: decodeDocument
        kind: self
      - id: reflect
        kind: stdlib
      - id: errs
        kind: package
      - id: prepareSource
        kind: internal
      - id: acquireParser
        kind: internal
      - id: releaseParser
        kind: internal
      - id: p.parseDocument
        kind: internal
      - id: d.decodeUntyped
        kind: internal
      - id: d.decode
        kind: internal
    steps:
      - bind: target
        eval: reflect.ValueOf(v)
        to: reflect
      - opt:
          do:
            - return: errs.Wrap(coreyaml.UnmarshalFailed, errs.WrapParams{}, errs.String("detail", "the target must be a non-nil pointer"))
              to: errs
          when: target.Kind() != reflect.Pointer || target.IsNil()
      - bind: src, err
        eval: prepareSource(data, firstLine)
        to: prepareSource
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: p
        eval: acquireParser(src)
        to: acquireParser
      - defer: releaseParser(p)
        to: releaseParser
      - set: p.line
        value: firstLine
      - bind: root, err
        eval: p.parseDocument()
        to: p.parseDocument
      - opt:
          do:
            - return: err
          when: err != nil || root == noNode
      - bind: d
        eval: "decoder{p: p}"
      - opt:
          do:
            - return: uerr
          init:
            bind: handled, uerr
            eval: d.decodeUntyped(root, v)
            to: d.decodeUntyped
          when: handled
      - return: d.decode(root, target.Elem())
        to: d.decode
  - of: (*decoder).decodeUntyped
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeUntyped
        kind: self
      - id: d.toAny
        kind: internal
    steps:
      - typeswitch:
          bind: target
          cases:
            - do:
                - return: true, d.intoStringMap(root, target)
              types: "*map[string]any"
            - do:
                - bind: value, err
                  eval: d.toAny(root)
                  to: d.toAny
                - opt:
                    do:
                      - set: "*target"
                        value: value
                    when: err == nil
                - return: true, err
              types: "*any"
            - default: true
              do:
                - return: false, nil
          "on": v
  - of: prepareSource
    participants:
      - id: caller
        kind: actor
      - id: prepareSource
        kind: self
      - id: forbiddenCharacter
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", syntaxError(firstLine, 1, \"the document is not UTF-8\")"
          when: |-
            bytes.HasPrefix(data, bomUTF16BigEndian) || bytes.HasPrefix(data, bomUTF16LittleEndian) ||
            		bytes.HasPrefix(data, bomUTF32BigEndian)
      - opt:
          do:
            - return: "\"\", sourceError(data, off, firstLine, detail)"
          init:
            bind: off, detail, found
            eval: forbiddenCharacter(data)
            to: forbiddenCharacter
          when: found
      - opt:
          do:
            - return: string(data), nil
          when: bytes.IndexByte(data, '\r') < 0
      - return: string(bytes.ReplaceAll(bytes.ReplaceAll(data, carriageReturnLineFeed, lineFeed), carriageReturn, lineFeed)), nil
  - of: forbiddenCharacter
    participants:
      - id: caller
        kind: actor
      - id: forbiddenCharacter
        kind: self
      - id: utf8
        kind: stdlib
      - id: forbiddenRune
        kind: internal
    steps:
      - loop:
          cond: i < len(data)
          do:
            - bind: r, size
              eval: rune(data[i]), 1
            - opt:
                do:
                  - set: r, size
                    to: utf8
                    value: utf8.DecodeRune(data[i:])
                when: r >= utf8.RuneSelf
            - opt:
                do:
                  - return: i, detail, true
                init:
                  bind: detail, forbidden
                  eval: forbiddenRune(r, size, i)
                  to: forbiddenRune
                when: forbidden
            - op: +=
              set: i
              value: size
          init: i := 0
      - return: 0, "", false
  - of: forbiddenRune
    steps:
      - switch:
          cases:
            - case: r == utf8.RuneError && size == 1
              do:
                - return: "\"the document is not valid UTF-8\", true"
            - case: r == runeByteOrderMark && off > 0
              do:
                - return: "\"a byte order mark may only open the document; write \\\\uFEFF in a double-quoted scalar\", true"
            - case: isAmbiguousBreak(r)
              do:
                - return: "\"U+0085, U+2028 and U+2029 must be escaped (\\\\N, \\\\L, \\\\P) in a double-quoted scalar\", true"
            - case: isForbiddenControl(r)
              do:
                - return: "\"a control character must be escaped in a double-quoted scalar\", true"
            - default: true
              do:
                - return: "\"\", false"
  - of: isAmbiguousBreak
    steps:
      - return: r == runeNextLine || r == runeLineSeparator || r == runeParagraphSeparator
  - of: isForbiddenControl
    steps:
      - opt:
          do:
            - return: "false"
          when: r == '\t' || r == '\n' || r == '\r'
      - return: isControl(r) || r == runeNonCharacterFFFE || r == runeNonCharacterFFFF
  - of: sourceError
    participants:
      - id: caller
        kind: actor
      - id: sourceError
        kind: self
      - id: syntaxError
        kind: internal
    steps:
      - bind: before
        eval: data[:i]
      - bind: line
        eval: firstLine + bytes.Count(before, lineFeed)
      - bind: lineStart
        eval: bytes.LastIndexByte(before, '\n') + 1
      - return: syntaxError(line, utf8.RuneCount(before[lineStart:])+1, detail)
        to: syntaxError
  - of: (*decoder).node
    steps:
      - return: "&d.p.nodes[i]"
  - of: (*decoder).mismatch
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).mismatch
        kind: self
      - id: errs
        kind: package
    steps:
      - bind: fields
        eval: append(at(int(n.line), d.p.columnOf(int(n.off))), errs.String("detail", detail))
      - opt:
          do:
            - set: fields
              value: append(fields, errs.String("type", t.String()))
          when: t != nil
      - return: errs.Wrap(coreyaml.UnmarshalFailed, errs.WrapParams{}, fields...)
        to: errs
  - of: (*decoder).refuse
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).refuse
        kind: self
      - id: refused
        kind: internal
    steps:
      - return: refused(sentinel, int(n.line), d.p.columnOf(int(n.off)))
        to: refused
  - of: describe
    participants:
      - id: caller
        kind: actor
      - id: describe
        kind: self
      - id: describeResolved
        kind: internal
    steps:
      - switch:
          cases:
            - case: n.kind == kindMapping
              do:
                - return: "\"a mapping\""
            - case: n.kind == kindSequence
              do:
                - return: "\"a sequence\""
            - case: n.style != stylePlain
              do:
                - return: "\"a string\""
            - default: true
              do:
                - return: describeResolved(resolvePlain(n.value).kind)
                  to: describeResolved
  - of: describeResolved
    steps:
      - switch:
          cases:
            - case: resolvedNull
              do:
                - return: "\"null\""
            - case: resolvedBool
              do:
                - return: "\"a boolean\""
            - case: resolvedInt, resolvedUint, resolvedLeadingZero
              do:
                - return: "\"an integer\""
            - case: resolvedFloat
              do:
                - return: "\"a float\""
            - case: resolvedOutOfRange
              do:
                - return: "\"a number out of range\""
            - default: true
              do:
                - return: "\"a string\""
          "on": kind
  - of: (*decoder).toAny
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).toAny
        kind: self
      - id: d.node
        kind: internal
      - id: d.sequenceAny
        kind: internal
      - id: d.plainAny
        kind: internal
    steps:
      - bind: "n"
        eval: d.node(i)
        to: d.node
      - switch:
          cases:
            - case: kindSequence
              do:
                - return: d.sequenceAny(n)
                  to: d.sequenceAny
            - case: kindMapping
              do:
                - bind: out
                  eval: make(map[string]any, n.count/2)
                - return: out, d.fillStringMap(n, out)
            - case: kindScalar
              do:
                - opt:
                    do:
                      - return: n.value, nil
                    when: n.style != stylePlain
                - return: d.plainAny(n)
                  to: d.plainAny
            - default: true
              do:
                - return: nil, d.mismatch(n, "an unknown node kind", nil)
          "on": n.kind
  - of: (*decoder).sequenceAny
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).sequenceAny
        kind: self
      - id: d.toAny
        kind: internal
    steps:
      - bind: out
        eval: make([]any, n.count)
      - loop:
          do:
            - bind: value, err
              eval: d.toAny(d.p.child(n, j))
              to: d.toAny
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - set: out[j]
              value: value
          key: j
          range: n.count
      - return: out, nil
  - of: (*decoder).fillStringMap
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).fillStringMap
        kind: self
      - id: d.toAny
        kind: internal
    steps:
      - loop:
          cond: j < n.count
          do:
            - bind: value, err
              eval: d.toAny(d.p.child(n, j+1))
              to: d.toAny
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: out[d.node(d.p.child(n, j)).value]
              value: value
          init: j := int32(0)
          post: j += 2
      - return: nil
  - of: (*decoder).plainAny
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).plainAny
        kind: self
      - id: resolvePlain
        kind: internal
      - id: intAny
        kind: internal
    steps:
      - bind: r
        eval: resolvePlain(n.value)
        to: resolvePlain
      - switch:
          cases:
            - case: resolvedNull
              do:
                - return: nil, nil
            - case: resolvedBool
              do:
                - return: r.b, nil
            - case: resolvedInt
              do:
                - return: intAny(r.i), nil
                  to: intAny
            - case: resolvedUint
              do:
                - return: r.u, nil
            - case: resolvedFloat
              do:
                - return: r.f, nil
            - case: resolvedString
              do:
                - return: n.value, nil
            - default: true
              do:
                - return: nil, d.refuseResolved(n, r.kind, nil)
          "on": r.kind
  - of: intAny
    steps:
      - opt:
          do:
            - return: int(i)
          when: i >= math.MinInt && i <= math.MaxInt
      - return: i
  - of: (*decoder).refuseResolved
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).refuseResolved
        kind: self
      - id: d.refuse
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - opt:
          do:
            - return: d.refuse(coreyaml.LeadingZeroRefused, n)
              to: d.refuse
          when: kind == resolvedLeadingZero
      - return: d.mismatch(n, "a number no 64-bit Go value holds", t)
        to: d.mismatch
  - of: (*decoder).intoStringMap
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).intoStringMap
        kind: self
      - id: d.node
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: d.fillStringMap
        kind: internal
    steps:
      - bind: "n"
        eval: d.node(i)
        to: d.node
      - opt:
          do:
            - set: "*target"
              value: nil
            - return: nil
          when: n.isNull()
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot be decoded into a map", stringMapType)
              to: d.mismatch
          when: n.kind != kindMapping
      - opt:
          do:
            - set: "*target"
              value: make(map[string]any, n.count/2)
          when: "*target == nil"
      - return: d.fillStringMap(n, *target)
        to: d.fillStringMap
  - of: mayHaveHooks
    steps:
      - return: t.PkgPath() != "" || t.Kind() == reflect.Struct
  - of: (*decoder).decode
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decode
        kind: self
      - id: d.node
        kind: internal
      - id: decodeNull
        kind: internal
      - id: allocateThrough
        kind: internal
      - id: d.decodeHooked
        kind: internal
      - id: d.decodeKind
        kind: internal
    steps:
      - bind: current
        eval: d.node(i)
        to: d.node
      - opt:
          do:
            - eval: decodeNull(v)
              to: decodeNull
            - return: nil
          when: current.isNull()
      - set: v
        to: allocateThrough
        value: allocateThrough(v)
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: handled, err
                  eval: d.decodeHooked(i, current, v)
                  to: d.decodeHooked
                when: handled
          when: mayHaveHooks(v.Type()) && v.CanAddr()
      - return: d.decodeKind(i, current, v)
        to: d.decodeKind
  - of: allocateThrough
    participants:
      - id: caller
        kind: actor
      - id: allocateThrough
        kind: self
      - id: v.Set
        kind: value
      - id: v.Elem
        kind: value
    steps:
      - loop:
          cond: v.Kind() == reflect.Pointer
          do:
            - opt:
                do:
                  - eval: v.Set(reflect.New(v.Type().Elem()))
                    to: v.Set
                when: v.IsNil()
            - set: v
              to: v.Elem
              value: v.Elem()
      - return: v
  - of: (*decoder).decodeKind
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeKind
        kind: self
      - id: d.decodeInterface
        kind: internal
      - id: d.decodeMap
        kind: internal
      - id: d.decodeStruct
        kind: internal
      - id: d.decodeSlice
        kind: internal
      - id: d.decodeArray
        kind: internal
      - id: d.decodeScalar
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Interface
              do:
                - return: d.decodeInterface(i, n, v)
                  to: d.decodeInterface
            - case: reflect.Map
              do:
                - return: d.decodeMap(n, v)
                  to: d.decodeMap
            - case: reflect.Struct
              do:
                - return: d.decodeStruct(n, v)
                  to: d.decodeStruct
            - case: reflect.Slice
              do:
                - return: d.decodeSlice(n, v)
                  to: d.decodeSlice
            - case: reflect.Array
              do:
                - return: d.decodeArray(n, v)
                  to: d.decodeArray
            - default: true
              do:
                - return: d.decodeScalar(n, v)
                  to: d.decodeScalar
          "on": v.Kind()
  - of: decodeNull
    participants:
      - id: caller
        kind: actor
      - id: decodeNull
        kind: self
      - id: v.SetZero
        kind: value
    steps:
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
          when: nullable(v.Kind())
  - of: nullable
    steps:
      - switch:
          cases:
            - case: reflect.Pointer, reflect.Map, reflect.Slice, reflect.Interface
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*decoder).decodeHooked
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeHooked
        kind: self
      - id: v.Type
        kind: value
      - id: hooksOf
        kind: internal
      - id: d.decodeScalarHooked
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - bind: h
        eval: hooksOf(t)
        to: hooksOf
      - switch:
          cases:
            - case: h.has(hookUnmarshaler)
              do:
                - return: true, d.callUnmarshaler(i, n, v)
            - case: h.has(hookForeignUnmarshaler)
              do:
                - return: true, d.mismatch(n, "the type's UnmarshalYAML is not UnmarshalYAML(func(any) error)", t)
            - case: n.kind != kindScalar
              do:
                - return: false, nil
      - return: d.decodeScalarHooked(n, v, h)
        to: d.decodeScalarHooked
  - of: (*decoder).decodeScalarHooked
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeScalarHooked
        kind: self
      - id: v.Type
        kind: value
    steps:
      - switch:
          cases:
            - case: t == timeType
              do:
                - return: true, d.decodeTime(n, v)
            - case: h.has(hookTextUnmarshaler)
              do:
                - return: true, d.callUnmarshalText(n, v)
            - case: t == durationType
              do:
                - return: true, d.decodeDuration(n, v)
            - default: true
              do:
                - return: false, nil
          init:
            bind: t
            eval: v.Type()
            to: v.Type
  - of: (*decoder).callUnmarshaler
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).callUnmarshaler
        kind: self
      - id: d.mismatch
        kind: internal
      - id: unmarshalYAMLHook
        kind: internal
      - id: d.decodeKind
        kind: internal
      - id: u.UnmarshalYAML
        kind: internal
      - id: d.hookFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: d.mismatch(n, "UnmarshalYAML hooks nest deeper than the decoder accepts", v.Type())
              to: d.mismatch
          when: d.hooks >= maxDepth
      - bind: u, ok
        eval: unmarshalYAMLHook(v.Addr())
        to: unmarshalYAMLHook
      - opt:
          do:
            - return: d.decodeKind(i, n, v)
              to: d.decodeKind
          when: "!ok"
      - op: ++
        set: d.hooks
      - defer: func() { d.hooks-- }()
      - opt:
          do:
            - return: d.hookFailed(n, err, v.Type())
              to: d.hookFailed
          init:
            bind: err
            eval: u.UnmarshalYAML(func(target any) error { return d.decodeHookTarget(i, n, target) })
            to: u.UnmarshalYAML
          when: err != nil
      - return: nil
  - of: (*decoder).decodeHookTarget
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeHookTarget
        kind: self
      - id: reflect
        kind: stdlib
      - id: d.mismatch
        kind: internal
      - id: d.decode
        kind: internal
    steps:
      - bind: value
        eval: reflect.ValueOf(target)
        to: reflect
      - opt:
          do:
            - return: d.mismatch(n, "UnmarshalYAML's function needs a non-nil pointer", nil)
              to: d.mismatch
          when: value.Kind() != reflect.Pointer || value.IsNil()
      - return: d.decode(i, value.Elem())
        to: d.decode
  - of: (*decoder).callUnmarshalText
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).callUnmarshalText
        kind: self
      - id: d.decodeScalar
        kind: internal
      - id: u.UnmarshalText
        kind: value
      - id: d.hookFailed
        kind: internal
    steps:
      - bind: u, ok
        eval: reflect.TypeAssert[encoding.TextUnmarshaler](v.Addr())
      - opt:
          do:
            - return: d.decodeScalar(n, v)
              to: d.decodeScalar
          when: "!ok"
      - opt:
          do:
            - return: d.hookFailed(n, err, v.Type())
              to: d.hookFailed
          init:
            bind: err
            eval: u.UnmarshalText([]byte(n.value))
            to: u.UnmarshalText
          when: err != nil
      - return: nil
  - of: (*decoder).hookFailed
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).hookFailed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:    coreyaml.CodeYAMLUnmarshalFailed,
          		Reason:  "UNMARSHAL_FAILED",
          		Public:  "YAML decoding failed",
          		Private: "service/data/codec/yaml: a type's own decoding hook returned an error",
          	}, append(at(int(n.line), d.p.columnOf(int(n.off))), errs.String("type", t.String()))...)
        to: errs
  - of: (*decoder).decodeTime
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeTime
        kind: self
      - id: time
        kind: stdlib
      - id: v.Set
        kind: value
      - id: d.mismatch
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: v.Set(reflect.ValueOf(parsed))
                    to: v.Set
                  - return: nil
                init:
                  bind: parsed, err
                  eval: time.Parse(layout, n.value)
                  to: time
                when: err == nil
          key: _
          range: timeLayouts
          value: layout
      - return: d.mismatch(n, "a time is written in RFC 3339, as in 2006-01-02T15:04:05Z", v.Type())
        to: d.mismatch
  - of: (*decoder).decodeDuration
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeDuration
        kind: self
      - id: time
        kind: stdlib
      - id: d.mismatch
        kind: internal
      - id: v.SetInt
        kind: value
    steps:
      - bind: parsed, err
        eval: time.ParseDuration(n.value)
        to: time
      - opt:
          do:
            - return: d.mismatch(n, "a duration is written with its unit, as in 30s, 15m or 24h", v.Type())
              to: d.mismatch
          when: err != nil
      - eval: v.SetInt(int64(parsed))
        to: v.SetInt
      - return: nil
  - of: (*decoder).decodeInterface
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeInterface
        kind: self
      - id: d.decodeIntoHeld
        kind: internal
      - id: d.toAny
        kind: internal
      - id: v.SetZero
        kind: value
      - id: v.Set
        kind: value
    steps:
      - opt:
          do:
            - return: d.decodeIntoHeld(i, n, v)
              to: d.decodeIntoHeld
          when: v.NumMethod() != 0
      - bind: value, err
        eval: d.toAny(i)
        to: d.toAny
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: v.SetZero()
              to: v.SetZero
            - return: nil
          when: value == nil
      - eval: v.Set(reflect.ValueOf(value))
        to: v.Set
      - return: nil
  - of: (*decoder).decodeIntoHeld
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeIntoHeld
        kind: self
      - id: d.decode
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - opt:
          do:
            - return: d.decode(i, v.Elem())
              to: d.decode
          when: "!v.IsNil() && v.Elem().Kind() == reflect.Pointer && !v.Elem().IsNil()"
      - return: d.mismatch(n, describe(n)+" cannot be decoded into a non-empty interface", v.Type())
        to: d.mismatch
  - of: (*decoder).decodeMap
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeMap
        kind: self
      - id: v.Type
        kind: value
      - id: d.mismatch
        kind: internal
      - id: v.Set
        kind: value
      - id: d.decodeMapEntry
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot be decoded into a map", t)
              to: d.mismatch
          when: n.kind != kindMapping
      - opt:
          do:
            - eval: v.Set(reflect.MakeMapWithSize(t, int(n.count/2)))
              to: v.Set
          when: v.IsNil()
      - bind: m
        eval: |-
          mapDecoding{
          		key:      reflect.New(t.Key()).Elem(),
          		elem:     reflect.New(t.Elem()).Elem(),
          		textKeys: t.Key().Kind() == reflect.String && !hooksOf(t.Key()).has(hookTextUnmarshaler),
          	}
      - loop:
          cond: j < n.count
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.decodeMapEntry(n, j, v, &m)
                  to: d.decodeMapEntry
                when: err != nil
          init: j := int32(0)
          post: j += 2
      - return: nil
  - of: (*decoder).decodeMapEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeMapEntry
        kind: self
      - id: d.decodeMapKey
        kind: internal
      - id: m.elem.SetZero
        kind: value
      - id: d.decode
        kind: internal
      - id: v.SetMapIndex
        kind: value
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.decodeMapKey(d.p.child(n, j), v.Type(), m)
            to: d.decodeMapKey
          when: err != nil
      - eval: m.elem.SetZero()
        to: m.elem.SetZero
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.decode(d.p.child(n, j+1), m.elem)
            to: d.decode
          when: err != nil
      - eval: v.SetMapIndex(m.key, m.elem)
        to: v.SetMapIndex
      - return: nil
  - of: (*decoder).decodeMapKey
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeMapKey
        kind: self
      - id: d.node
        kind: internal
      - id: m.key.SetZero
        kind: value
      - id: m.key.SetString
        kind: value
      - id: d.mismatch
        kind: internal
      - id: d.decode
        kind: internal
      - id: d.checkKeyCollision
        kind: internal
    steps:
      - bind: keyNode
        eval: d.node(keyIndex)
        to: d.node
      - eval: m.key.SetZero()
        to: m.key.SetZero
      - opt:
          do:
            - eval: m.key.SetString(keyNode.value)
              to: m.key.SetString
            - return: nil
          when: m.textKeys
      - opt:
          do:
            - return: d.mismatch(keyNode, "a null key cannot be decoded into "+t.Key().String(), t)
              to: d.mismatch
          when: keyNode.isNull() && !nullable(t.Key().Kind())
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.decode(keyIndex, m.key)
            to: d.decode
          when: err != nil
      - return: d.checkKeyCollision(keyNode, m)
        to: d.checkKeyCollision
  - of: (*decoder).checkKeyCollision
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).checkKeyCollision
        kind: self
      - id: m.key.Interface
        kind: value
      - id: d.refuse
        kind: internal
    steps:
      - opt:
          do:
            - set: m.seen
              value: map[any]bool{}
          when: m.seen == nil
      - bind: key
        eval: m.key.Interface()
        to: m.key.Interface
      - opt:
          do:
            - return: d.refuse(coreyaml.DuplicateKey, keyNode)
              to: d.refuse
          when: m.seen[key]
      - set: m.seen[key]
        value: "true"
      - return: nil
  - of: (*decoder).decodeStruct
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeStruct
        kind: self
      - id: v.Type
        kind: value
      - id: d.mismatch
        kind: internal
      - id: structInfoOf
        kind: internal
      - id: d.decodeStructEntry
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot be decoded into a struct", t)
              to: d.mismatch
          when: n.kind != kindMapping
      - bind: info
        eval: structInfoOf(t)
        to: structInfoOf
      - opt:
          do:
            - return: d.mismatch(n, info.tagError, t)
              to: d.mismatch
          when: info.tagError != ""
      - loop:
          cond: j < n.count
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.decodeStructEntry(n, j, v, info)
                  to: d.decodeStructEntry
                when: err != nil
          init: j := int32(0)
          post: j += 2
      - return: nil
  - of: (*decoder).decodeStructEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeStructEntry
        kind: self
      - id: d.p.child
        kind: internal
      - id: d.decode
        kind: internal
      - id: d.decodeInlineEntry
        kind: internal
    steps:
      - bind: keyText
        eval: d.node(d.p.child(n, j)).value
      - bind: valueIndex
        eval: d.p.child(n, j+1)
        to: d.p.child
      - opt:
          do:
            - return: d.decode(valueIndex, fieldForWrite(v, info.fields[f].index))
              to: d.decode
          init:
            bind: f, ok
            eval: info.byKey[keyText]
          when: ok
      - opt:
          do:
            - return: nil
          when: info.inlineMap == nil
      - return: d.decodeInlineEntry(keyText, valueIndex, fieldForWrite(v, info.inlineMap))
        to: d.decodeInlineEntry
  - of: (*decoder).decodeInlineEntry
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeInlineEntry
        kind: self
      - id: m.Set
        kind: value
      - id: reflect.New(m.Type().Elem()).Elem
        kind: value
      - id: d.decode
        kind: internal
      - id: m.SetMapIndex
        kind: value
    steps:
      - opt:
          do:
            - eval: m.Set(reflect.MakeMap(m.Type()))
              to: m.Set
          when: m.IsNil()
      - bind: elem
        eval: reflect.New(m.Type().Elem()).Elem()
        to: reflect.New(m.Type().Elem()).Elem
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: d.decode(valueIndex, elem)
            to: d.decode
          when: err != nil
      - eval: m.SetMapIndex(reflect.ValueOf(key).Convert(m.Type().Key()), elem)
        to: m.SetMapIndex
      - return: nil
  - of: fieldForWrite
    participants:
      - id: caller
        kind: actor
      - id: fieldForWrite
        kind: self
      - id: allocateThrough
        kind: internal
      - id: v.Field
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: v
                    to: allocateThrough
                    value: allocateThrough(v)
                when: k > 0 && v.Kind() == reflect.Pointer
            - set: v
              to: v.Field
              value: v.Field(i)
          key: k
          range: index
          value: i
      - return: v
  - of: (*decoder).decodeSlice
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeSlice
        kind: self
      - id: v.Type
        kind: value
      - id: d.mismatch
        kind: internal
      - id: v.Set
        kind: value
      - id: v.SetZero
        kind: value
      - id: v.Grow
        kind: value
      - id: v.SetLen
        kind: value
      - id: d.decodeEntries
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot be decoded into a slice", t)
              to: d.mismatch
          when: n.kind != kindSequence
      - opt:
          do:
            - eval: v.Set(reflect.MakeSlice(t, 0, 0))
              to: v.Set
            - return: nil
          when: n.count == 0
      - eval: v.SetZero()
        to: v.SetZero
      - eval: v.Grow(int(n.count))
        to: v.Grow
      - eval: v.SetLen(int(n.count))
        to: v.SetLen
      - return: d.decodeEntries(n, v)
        to: d.decodeEntries
  - of: (*decoder).decodeArray
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeArray
        kind: self
      - id: d.mismatch
        kind: internal
      - id: v.SetZero
        kind: value
      - id: d.decodeEntries
        kind: internal
    steps:
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot fill an array of "+strconv.Itoa(v.Len())+" elements", v.Type())
              to: d.mismatch
          when: n.kind != kindSequence || int(n.count) != v.Len()
      - eval: v.SetZero()
        to: v.SetZero
      - return: d.decodeEntries(n, v)
        to: d.decodeEntries
  - of: (*decoder).decodeEntries
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeEntries
        kind: self
      - id: d.decode
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.decode(d.p.child(n, j), v.Index(int(j)))
                  to: d.decode
                when: err != nil
          key: j
          range: n.count
      - return: nil
  - of: (*decoder).decodeScalar
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeScalar
        kind: self
      - id: v.Type
        kind: value
      - id: d.mismatch
        kind: internal
      - id: v.SetString
        kind: value
      - id: d.decodeResolved
        kind: internal
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - return: d.mismatch(n, describe(n)+" cannot be decoded into "+t.Kind().String(), t)
              to: d.mismatch
          when: n.kind != kindScalar
      - opt:
          do:
            - eval: v.SetString(n.value)
              to: v.SetString
            - return: nil
          when: v.Kind() == reflect.String
      - opt:
          do:
            - return: d.mismatch(n, "a quoted string cannot be decoded into "+t.Kind().String(), t)
              to: d.mismatch
          when: n.style != stylePlain
      - return: d.decodeResolved(n, resolvePlain(n.value), v)
        to: d.decodeResolved
  - of: (*decoder).decodeResolved
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeResolved
        kind: self
      - id: d.decodeBool
        kind: internal
      - id: d.decodeInt
        kind: internal
      - id: d.decodeUint
        kind: internal
      - id: d.decodeFloat
        kind: internal
      - id: d.mismatch
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Bool
              do:
                - return: d.decodeBool(n, r, v)
                  to: d.decodeBool
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: d.decodeInt(n, r, v)
                  to: d.decodeInt
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr
              do:
                - return: d.decodeUint(n, r, v)
                  to: d.decodeUint
            - case: reflect.Float32, reflect.Float64
              do:
                - return: d.decodeFloat(n, r, v)
                  to: d.decodeFloat
            - default: true
              do:
                - return: d.mismatch(n, "the target's kind cannot hold a YAML value", v.Type())
                  to: d.mismatch
          "on": v.Kind()
  - of: (*decoder).decodeBool
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeBool
        kind: self
      - id: v.SetBool
        kind: value
      - id: d.mismatch
        kind: internal
    steps:
      - opt:
          do:
            - eval: v.SetBool(r.b)
              to: v.SetBool
            - return: nil
          when: r.kind == resolvedBool
      - opt:
          do:
            - return: "d.mismatch(n, \"yes, no, on and off are strings in YAML 1.2: write true or false\", v.Type())"
              to: d.mismatch
          when: isYAML11Bool(n.value)
      - return: d.mismatch(n, describe(n)+" cannot be decoded into bool", v.Type())
        to: d.mismatch
  - of: (*decoder).decodeInt
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeInt
        kind: self
      - id: d.intValue
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.SetInt
        kind: value
    steps:
      - bind: i, err
        eval: d.intValue(n, r, v.Type())
        to: d.intValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: d.mismatch(n, "the integer is out of the target's range", v.Type())
              to: d.mismatch
          when: v.OverflowInt(i)
      - eval: v.SetInt(i)
        to: v.SetInt
      - return: nil
  - of: (*decoder).intValue
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).intValue
        kind: self
      - id: wholeInt
        kind: internal
    steps:
      - switch:
          cases:
            - case: resolvedInt
              do:
                - return: r.i, nil
            - case: resolvedFloat
              do:
                - bind: i, ok
                  eval: wholeInt(r.f)
                  to: wholeInt
                - opt:
                    do:
                      - return: 0, d.mismatch(n, "a float that is not a whole number cannot be decoded into an integer", t)
                    when: "!ok"
                - return: i, nil
            - case: resolvedUint
              do:
                - return: 0, d.mismatch(n, "the integer is out of the target's range", t)
            - case: resolvedLeadingZero, resolvedOutOfRange
              do:
                - return: 0, d.refuseResolved(n, r.kind, t)
            - default: true
              do:
                - return: 0, d.mismatch(n, describe(n)+" cannot be decoded into an integer", t)
          "on": r.kind
  - of: wholeInt
    steps:
      - opt:
          do:
            - return: int64(f), true
          when: f == math.Trunc(f) && f >= math.MinInt64 && f < math.MaxInt64
      - return: 0, false
  - of: (*decoder).decodeUint
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeUint
        kind: self
      - id: d.uintValue
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.SetUint
        kind: value
    steps:
      - bind: u, err
        eval: d.uintValue(n, r, v.Type())
        to: d.uintValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: d.mismatch(n, "the integer is out of the target's range", v.Type())
              to: d.mismatch
          when: v.OverflowUint(u)
      - eval: v.SetUint(u)
        to: v.SetUint
      - return: nil
  - of: (*decoder).uintValue
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).uintValue
        kind: self
      - id: wholeUint
        kind: internal
    steps:
      - switch:
          cases:
            - case: resolvedInt
              do:
                - opt:
                    do:
                      - return: 0, d.mismatch(n, "a negative integer cannot be decoded into an unsigned integer", t)
                    when: r.i < 0
                - return: uint64(r.i), nil
            - case: resolvedUint
              do:
                - return: r.u, nil
            - case: resolvedFloat
              do:
                - bind: u, ok
                  eval: wholeUint(r.f)
                  to: wholeUint
                - opt:
                    do:
                      - return: 0, d.mismatch(n, "a float that is not a whole number cannot be decoded into an integer", t)
                    when: "!ok"
                - return: u, nil
            - case: resolvedLeadingZero, resolvedOutOfRange
              do:
                - return: 0, d.refuseResolved(n, r.kind, t)
            - default: true
              do:
                - return: 0, d.mismatch(n, describe(n)+" cannot be decoded into an unsigned integer", t)
          "on": r.kind
  - of: wholeUint
    steps:
      - opt:
          do:
            - return: uint64(f), true
          when: f == math.Trunc(f) && f >= 0 && f < math.MaxUint64
      - return: 0, false
  - of: (*decoder).decodeFloat
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).decodeFloat
        kind: self
      - id: d.floatValue
        kind: internal
      - id: d.mismatch
        kind: internal
      - id: v.SetFloat
        kind: value
    steps:
      - bind: f, err
        eval: d.floatValue(n, r, v)
        to: d.floatValue
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: d.mismatch(n, "the float is out of the target's range", v.Type())
              to: d.mismatch
          when: v.OverflowFloat(f)
      - eval: v.SetFloat(f)
        to: v.SetFloat
      - return: nil
  - of: (*decoder).floatValue
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).floatValue
        kind: self
      - id: d.floatAt
        kind: internal
    steps:
      - switch:
          cases:
            - case: resolvedFloat
              do:
                - return: d.floatAt(n, r.f, v)
                  to: d.floatAt
            - case: resolvedInt
              do:
                - return: float64(r.i), nil
            - case: resolvedUint
              do:
                - return: float64(r.u), nil
            - case: resolvedLeadingZero, resolvedOutOfRange
              do:
                - return: 0, d.refuseResolved(n, r.kind, v.Type())
            - default: true
              do:
                - return: 0, d.mismatch(n, describe(n)+" cannot be decoded into a float", v.Type())
          "on": r.kind
  - of: (*decoder).floatAt
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).floatAt
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: f, nil
          when: v.Kind() != reflect.Float32 || math.IsInf(f, 0) || math.IsNaN(f)
      - bind: f32, err
        eval: strconv.ParseFloat(n.value, float32Bits)
        to: strconv
      - opt:
          do:
            - return: 0, d.mismatch(n, "the float is out of the target's range", v.Type())
          when: err != nil
      - return: f32, nil
