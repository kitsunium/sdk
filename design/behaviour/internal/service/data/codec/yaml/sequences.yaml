        set: p.pos
      - loop:
          cond: "!closed"
          do:
            - set: closed, err
              to: p.flowStep
              value: p.flowStep(&f, parent)
            - opt:
                do:
                  - return: noNode, err
                when: err != nil
          init: closed := false
      - eval: p.close(f.index, f.base)
        to: p.close
      - opt:
          do:
            - return: f.index, p.checkDuplicates(f.index)
          when: f.kind == kindMapping
      - return: f.index, nil
  - of: (*parser).flowStep
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowStep
        kind: self
      - id: p.skipFlowSpace
        kind: internal
      - id: p.flowEntry
        kind: internal
    steps:
      - opt:
          do:
            - return: false, err
          init:
            bind: err
            eval: p.skipFlowSpace(f.line, f.off)
            to: p.skipFlowSpace
          when: err != nil
