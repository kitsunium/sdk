    participants:
      - id: caller
        kind: actor
      - id: (*parser).scanSingleQuoted
        kind: self
      - id: p.scanQuoted
        kind: internal
    steps:
      - return: p.scanQuoted('\'', singleLine)
        to: p.scanQuoted
  - of: (*parser).scanDoubleQuoted
    participants:
      - id: caller
        kind: actor
      - id: (*parser).scanDoubleQuoted
        kind: self
      - id: p.scanQuoted
        kind: internal
    steps:
      - return: p.scanQuoted('"', singleLine)
        to: p.scanQuoted
  - of: (*parser).scanQuoted
    participants:
      - id: caller
        kind: actor
      - id: (*parser).scanQuoted
        kind: self
      - id: p.quotedFast
        kind: internal
      - id: p.quotedStep
        kind: internal
    steps:
      - bind: q
        eval: "quotedScan{line: p.line, off: p.pos, quote: quote, singleLine: singleLine}"
