              do:
                - return: c != 0 && strings.IndexByte(neverStartsPlain, c) >= 0
          "on": c
  - of: (*parser).plainSegment
    participants:
      - id: caller
        kind: actor
      - id: (*parser).plainSegment
        kind: self
      - id: p.plainStopAt
        kind: internal
    steps:
      - bind: end
        eval: p.pos
      - loop:
          cond: i < len(p.src)
          do:
            - bind: c
              eval: p.src[i]
            - opt:
                do:
                  - return: end, stop
                init:
                  bind: stop, ok
                  eval: p.plainStopAt(i, c, flow)
                  to: p.plainStopAt
                when: ok
            - opt:
                do:
                  - set: end
                    value: i + 1
                when: "!isBlank(c)"
          init: i := p.pos
          post: i++
      - return: end, stopEnd
  - of: (*parser).plainStopAt
    steps:
      - switch:
          cases:
            - case: c == '\n'
              do:
                - return: stopEnd, true
            - case: c == ':'
              do:
                - return: stopValue, p.blankOrEnd(i + 1)
            - case: c == '#'
              do:
                - return: stopComment, i > p.pos && isBlank(p.src[i-1])
            - case: "!flow"
              do:
                - return: stopEnd, false
            - case: c == '?'
              do:
                - return: stopQuestion, true
            - default: true
              do:
                - return: stopFlow, isFlowIndicator(c)
  - of: (*parser).plainStopError
    participants:
      - id: caller
        kind: actor
      - id: (*parser).plainStopError
        kind: self
      - id: p.refuseQuestion
        kind: internal
      - id: p.errHere
        kind: internal
    steps:
      - switch:
          cases:
            - case: stop == stopQuestion
              do:
                - return: p.refuseQuestion(end)
                  to: p.refuseQuestion
            - case: stop == stopValue && !flow
              do:
                - set: p.pos
                  value: end
                - return: p.errHere("a mapping value is not allowed in this context")
                  to: p.errHere
      - return: nil
  - of: (*parser).refuseQuestion
    participants:
      - id: caller
        kind: actor
      - id: (*parser).refuseQuestion
        kind: self
      - id: p.errHere
        kind: internal
    steps:
      - set: p.pos
        value: end
      - loop:
          cond: p.peek() != '?'
          do:
            - op: ++
              set: p.pos
      - return: "p.errHere(\"a plain scalar in a flow collection cannot hold '?': quote it\")"
        to: p.errHere
  - of: (*parser).scanPlainKey
    participants:
      - id: caller
        kind: actor
      - id: (*parser).scanPlainKey
        kind: self
      - id: p.plainStart
        kind: internal
      - id: p.plainSegment
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", err"
          init:
            bind: err
            eval: p.plainStart(flow)
            to: p.plainStart
          when: err != nil
      - bind: start
        eval: p.pos
      - bind: end, stop
        eval: p.plainSegment(flow)
        to: p.plainSegment
      - opt:
          do:
            - return: "\"\", p.refuseQuestion(end)"
          when: stop == stopQuestion
      - opt:
          do:
            - return: "\"\", p.errHere(\"a mapping key must be followed by ':'\")"
          when: "!flow && stop != stopValue"
      - set: p.pos
        value: end
      - return: p.src[start:end], nil
  - of: (*parser).scanPlain
    participants:
      - id: caller
        kind: actor
      - id: (*parser).scanPlain
        kind: self
      - id: p.plainStart
        kind: internal
      - id: p.plainSegment
        kind: internal
      - id: p.plainStopError
        kind: internal
      - id: p.foldPlain
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", err"
          init:
            bind: err
            eval: p.plainStart(flow)
            to: p.plainStart
          when: err != nil
      - bind: start
        eval: p.pos
      - bind: end, stop
        eval: p.plainSegment(flow)
        to: p.plainSegment
      - opt:
          do:
            - return: "\"\", err"
          init:
            bind: err
            eval: p.plainStopError(end, stop, flow)
            to: p.plainStopError
          when: err != nil
      - set: p.pos
        value: end
      - opt:
          do:
            - return: p.src[start:end], nil
          when: stop != stopEnd
      - return: p.foldPlain(start, end, parent, flow)
        to: p.foldPlain
  - of: (*parser).foldPlain
    participants:
      - id: caller
        kind: actor
      - id: (*parser).foldPlain
        kind: self
      - id: p.plainContinuation
        kind: internal
      - id: appendFold
        kind: internal
      - id: p.plainContinuationSegment
        kind: internal
    steps:
      - bind: next, breaks, ok, err
        eval: p.plainContinuation(parent, flow)
        to: p.plainContinuation
      - opt:
          do:
            - return: p.src[start:end], err
          when: err != nil || !ok
      - set: p.text
        value: append(p.text[:0], p.src[start:end]...)
      - loop:
          cond: ok
          do:
            - set: p.text
              to: appendFold
              value: appendFold(p.text, breaks)
            - bind: stop, serr
