            - case: "\"\", \"~\", \"null\", \"Null\", \"NULL\""
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": text
  - of: acquireParser
    participants:
      - id: caller
        kind: actor
      - id: acquireParser
        kind: self
      - id: parserPool.Get
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: p
        eval: parserPool.Get()
        to: parserPool.Get
      - set: p.src
        to: strings
        value: strings.TrimPrefix(src, byteOrderMark)
      - set: p.line
        value: "1"
      - return: p
