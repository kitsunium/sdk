            bind: r, ok
            eval: simpleEscapes[c]
          when: ok
      - opt:
          do:
            - return: p.hexEscape(width)
              to: p.hexEscape
          init:
            bind: width, ok
            eval: hexEscapeWidths[c]
          when: ok
      - return: p.errHere("an unknown escape sequence in a double-quoted scalar")
        to: p.errHere
  - of: (*parser).hexEscape
    participants:
      - id: caller
        kind: actor
      - id: (*parser).hexEscape
        kind: self
      - id: p.errHere
        kind: internal
      - id: strconv
        kind: stdlib
      - id: utf8
        kind: stdlib
    steps:
      - bind: start
        eval: p.pos + len(`\x`)
      - opt:
          do:
            - return: p.errHere("a hexadecimal escape is cut short")
              to: p.errHere
          when: start+width > len(p.src)
      - bind: value, err
