  - of: (*parser).flowSequenceEntry
    participants:
      - id: caller
        kind: actor
      - id: (*parser).flowSequenceEntry
        kind: self
      - id: p.peek
        kind: internal
      - id: p.parseFlowCollection
        kind: internal
      - id: p.skipBlanks
        kind: internal
      - id: p.flowScalar
        kind: internal
      - id: p.scalar
        kind: internal
      - id: p.open
        kind: internal
      - id: p.keyIndicator
        kind: internal
      - id: p.flowValue
        kind: internal
      - id: p.close
        kind: internal
    steps:
      - bind: line, off
        eval: p.line, p.pos
      - opt:
          do:
            - bind: idx, err
              eval: p.parseFlowCollection(parent)
              to: p.parseFlowCollection
            - opt:
                do:
                  - return: noNode, err
