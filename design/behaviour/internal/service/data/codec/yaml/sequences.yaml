      - id: caller
        kind: actor
      - id: refused
        kind: self
      - id: errs
        kind: package
    steps:
      - return: "errs.Wrap(sentinel, errs.WrapParams{Code: coreyaml.CodeYAMLUnmarshalFailed}, at(line, column)...)"
        to: errs
  - of: marshalError
    participants:
      - id: caller
        kind: actor
      - id: marshalError
        kind: self
