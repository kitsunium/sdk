# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      noKeyStart lists the indicators no implicit key starts with: the node
      parser refuses each by name or as a syntax error.
    items:
      - name: noKeyStart
        type: string
        value: "\"&*!%@`[{]},#|>\""
    name: noKeyStart
  - doc: documentSeparator opens every document after the first.
    items:
      - name: documentSeparator
        type: string
        value: "\"---\\n\""
    name: documentSeparator
  - doc: The hooks a type may implement, one bit of typeHooks each.
    grouped: true
    items:
      - doc: "hookMarshaler: T implements marshalYAMLer."
        name: hookMarshaler
        type: typeHooks
        value: 1 << iota
      - doc: "hookPtrMarshaler: *T implements marshalYAMLer and T does not."
        name: hookPtrMarshaler
      - doc: "hookTextMarshaler: T implements encoding.TextMarshaler."
        name: hookTextMarshaler
      - doc: "hookPtrTextMarshaler: *T implements encoding.TextMarshaler and T does not."
        name: hookPtrTextMarshaler
      - doc: "hookUnmarshaler: *T implements unmarshalYAMLer."
        name: hookUnmarshaler
      - doc: |-
          hookForeignUnmarshaler: *T has an UnmarshalYAML method of another
          signature — yaml.v3's UnmarshalYAML(*yaml.Node) — which the decoder
          cannot call.
        name: hookForeignUnmarshaler
      - doc: "hookTextUnmarshaler: *T implements encoding.TextUnmarshaler."
        name: hookTextUnmarshaler
      - doc: "hookIsZeroer: T implements IsZero() bool."
        name: hookIsZeroer
    name: hookMarshaler
  - doc: indentStep is how many spaces each nesting level indents by.
    items:
      - name: indentStep
        type: int
        value: "2"
    name: indentStep
  - doc: |-
      rootColumn is the column of the collection "holding" the root, so that
      the root's own entries sit at column 0.
    items:
      - name: rootColumn
        type: int
        value: "-indentStep"
    name: rootColumn
  - doc: The three places a value starts at.
    grouped: true
    items:
      - doc: atRoot is the start of the document.
        name: atRoot
        type: place
        value: iota
      - doc: afterKey is just after a mapping key's ":".
        name: afterKey
      - doc: afterDash is just after a sequence entry's "-".
        name: afterDash
    name: atRoot
  - doc: |-
      The shapes a value takes once its pointers, interfaces and hooks are
      resolved.
    grouped: true
    items:
      - doc: shapeNull writes null.
        name: shapeNull
        type: shape
        value: iota
      - doc: "shapeText writes a string: a MarshalText result or a duration's text."
        name: shapeText
      - doc: shapeAny writes the value a MarshalYAML hook returned.
        name: shapeAny
      - doc: shapeValue writes a reflected value by its kind.
        name: shapeValue
    name: shapeNull
  - doc: The order map keys of different kinds are written in.
    grouped: true
    items:
      - doc: rankNull is a nil key.
        name: rankNull
        type: keyRank
        value: iota
      - doc: rankBool is a boolean key.
        name: rankBool
      - doc: rankInt is a signed integer key.
        name: rankInt
      - doc: rankUint is an unsigned integer key.
        name: rankUint
      - doc: rankFloat is a float key.
        name: rankFloat
      - doc: rankString is a string key.
        name: rankString
      - doc: rankOther is any other key, which keyText refuses.
        name: rankOther
    name: rankNull
  - doc: The numbers the encoder formats with.
    grouped: true
    items:
      - doc: decimalBase is the base integers are written in.
        name: decimalBase
        type: int
        value: "10"
      - doc: float64Bits is the precision a float64 is written at.
        name: float64Bits
        type: int
        value: "64"
      - doc: float32Bits is the precision a float32 is read at.
        name: float32Bits
        type: int
        value: "32"
    name: decimalBase
  - doc: |-
      literalIndicator is the indentation indicator a literal block carries when
      its first line starts with a blank or a line break: the content always sits
      one step deeper than its parent, so the indicator is always the step.
    items:
      - name: literalIndicator
        type: byte
        value: "'0' + byte(indentStep)"
    name: literalIndicator
  - doc: The characters that never appear verbatim in a scalar the encoder writes.
    grouped: true
    items:
      - doc: runeDelete is DEL, U+007F.
        name: runeDelete
        type: rune
        value: "0x7F"
      - doc: c1First is the first C1 control character, U+0080.
        name: c1First
        type: rune
        value: "0x80"
      - doc: c1Last is the last C1 control character, U+009F.
        name: c1Last
        type: rune
        value: "0x9F"
      - doc: runeByteOrderMark is U+FEFF.
        name: runeByteOrderMark
        type: rune
        value: "0xFEFF"
      - doc: runeNonCharacterFFFE is U+FFFE, a non-character.
        name: runeNonCharacterFFFE
        type: rune
        value: "0xFFFE"
      - doc: runeNonCharacterFFFF is U+FFFF, a non-character.
        name: runeNonCharacterFFFF
        type: rune
        value: "0xFFFF"
    name: runeDelete
  - doc: The hexadecimal escapes the encoder writes.
    grouped: true
    items:
      - doc: hexDigitsUpper are the digits an escape is written with.
        name: hexDigitsUpper
        type: string
        value: "\"0123456789ABCDEF\""
      - doc: maxByteEscape is the largest code point written as \xXX.
        name: maxByteEscape
        type: rune
        value: "0xFF"
      - doc: nibbleBits is the width of one hexadecimal digit.
        name: nibbleBits
        type: int
        value: "4"
      - doc: nibbleMask keeps one hexadecimal digit.
        name: nibbleMask
        type: rune
        value: "0xF"
    name: hexDigitsUpper
  - doc: |-
      plainUnsafeFirst lists the characters a plain scalar the encoder writes
      never starts with: every indicator, and the blanks a reader would strip.
    items:
      - name: plainUnsafeFirst
        type: string
        value: "\"-?:,[]{}#&*!|>'\\\"%@` \\t\""
    name: plainUnsafeFirst
  - doc: |-
      flowUnsafe lists the characters the encoder never writes in a plain scalar
      inside a flow collection.
    items:
      - name: flowUnsafe
        type: string
        value: "\",[]{}:#\""
    name: flowUnsafe
  - doc: |-
      maxYAMLBytes caps the bytes one document may hold: Unmarshal refuses a
      longer input before reading it, and the streaming decoder refuses a
      document that grows past it. 10 MiB covers every realistic configuration
      document while keeping an attacker-controlled payload from exhausting memory
      (CWE-400).
    items:
      - name: maxYAMLBytes
        type: int
        value: 10 << 20
    name: maxYAMLBytes
  - doc: |-
      maxDepth bounds how deeply collections nest, when reading and when writing:
      a configuration nested a hundred levels deep is not a configuration, and a
      cyclic Go value would otherwise recurse until the stack ran out.
    items:
      - name: maxDepth
        type: int
        value: "100"
    name: maxDepth
  - doc: |-
      maxNodes bounds how many nodes one document may hold. The byte cap alone
      lets ten megabytes of "[0,0,0,…]" become five million nodes; this keeps the
      tree a document builds within a fixed multiple of a configuration's size.
    items:
      - name: maxNodes
        type: int
        value: 1 << 20
    name: maxNodes
  - doc: |-
      maxKeyRunes is YAML's own bound on an implicit key (YAML 1.2.2 §7.4.2): a key
      written without the ? indicator spans at most 1024 characters.
    items:
      - name: maxKeyRunes
        type: int
        value: "1024"
    name: maxKeyRunes
  - doc: |-
      mergeKey is YAML 1.1's merge key, refused as a plain key and never written
      plain.
    items:
      - name: mergeKey
        type: string
        value: "\"<<\""
    name: mergeKey
  - doc: |-
      maxPooledNodes bounds the arena a recycled parser keeps: a parser that read
      a huge document is dropped instead of pinning its arena in the pool.
    items:
      - name: maxPooledNodes
        type: int
        value: 1 << 14
    name: maxPooledNodes
  - doc: The three kinds of node the subset has.
    grouped: true
    items:
      - doc: "kindScalar is a scalar: plain, quoted or block."
        name: kindScalar
        type: nodeKind
        value: iota + 1
      - doc: kindMapping is a block or flow mapping; its children alternate key, value.
        name: kindMapping
      - doc: kindSequence is a block or flow sequence.
        name: kindSequence
    name: kindScalar
  - doc: The scalar styles.
    grouped: true
    items:
      - doc: stylePlain is an unquoted scalar.
        name: stylePlain
        type: scalarStyle
        value: iota
      - doc: styleSingle is a 'single-quoted' scalar.
        name: styleSingle
      - doc: styleDouble is a "double-quoted" scalar.
        name: styleDouble
      - doc: styleBlock is a literal (|) or folded (>) block scalar.
        name: styleBlock
    name: stylePlain
  - doc: byteOrderMark is the UTF-8 encoding of U+FEFF, which may open a stream.
    items:
      - name: byteOrderMark
        type: string
        value: "\"\\ufeff\""
    name: byteOrderMark
  - doc: |-
      noNode is the index parseDocument returns for a document that holds no
      node at all: an empty input, or one of comments only.
    items:
      - name: noNode
        type: int32
        value: "-1"
    name: noNode
  - doc: |-
      smallMapping is the number of entries up to which duplicate keys are found
      by comparing every pair: below it, the comparisons cost less than a set.
    items:
      - name: smallMapping
        type: int32
        value: "16"
    name: smallMapping
  - doc: |-
      The bases of the core schema's prefixed integers, and the value digitValue
      gives a character that is a digit of none.
    grouped: true
    items:
      - doc: octalBase is the base of a 0o integer.
        name: octalBase
        type: int
        value: "8"
      - doc: hexBase is the base of a 0x integer.
        name: hexBase
        type: int
        value: "16"
      - doc: |-
          notADigit is digitValue's answer for a character that is no digit: it
          is past every base used here.
        name: notADigit
        type: int
        value: "16"
    name: octalBase
  - doc: The core schema's types, and the two readings the subset refuses.
    grouped: true
    items:
      - doc: resolvedString is everything the other kinds do not match.
        name: resolvedString
        type: resolvedKind
        value: iota
      - doc: resolvedNull is ~, null, Null, NULL, or nothing.
        name: resolvedNull
      - doc: resolvedBool is true or false, in three cases each — never yes/no/on/off.
        name: resolvedBool
      - doc: |-
          resolvedInt is a decimal, 0o octal or 0x hexadecimal integer that fits
          an int64.
        name: resolvedInt
      - doc: resolvedUint is an integer past math.MaxInt64 that fits a uint64.
        name: resolvedUint
      - doc: resolvedFloat is a decimal float, .inf or .nan.
        name: resolvedFloat
      - doc: |-
          resolvedLeadingZero is a decimal integer with a leading zero, which
          YAML 1.1 reads as octal and YAML 1.2 as decimal.
        name: resolvedLeadingZero
      - doc: resolvedOutOfRange is an integer or a float no 64-bit Go value holds.
        name: resolvedOutOfRange
    name: resolvedString
  - doc: The reasons a plain scalar's segment on one line ends.
    grouped: true
    items:
      - doc: stopEnd is the line break or the end of the document.
        name: stopEnd
        type: plainStop
        value: iota
      - doc: |-
          stopValue is ":" followed by a blank or the end of the line — in flow
          context too: libyaml, and so yaml.v3, keeps a ":" followed by a flow
          indicator inside the scalar, and the subset reads it as they do.
        name: stopValue
      - doc: stopComment is a "#" after a blank.
        name: stopComment
      - doc: stopFlow is a flow indicator, in flow context.
        name: stopFlow
      - doc: |-
          stopQuestion is a "?" in flow context, where libyaml ends the scalar and
          starts an explicit key; the subset refuses it rather than read it
          another way.
        name: stopQuestion
    name: stopEnd
  - doc: Block-scalar chomping, as its header's indicator says.
    grouped: true
    items:
      - doc: chompStrip ("-") drops every trailing line break.
        name: chompStrip
        type: chomping
        value: iota - 1
      - doc: chompClip (no indicator) keeps exactly the last line break.
        name: chompClip
      - doc: chompKeep ("+") keeps every trailing line break.
        name: chompKeep
    name: chompStrip
  - doc: |-
      The characters YAML gives a double-quoted escape beyond C's, and the bounds
      of what a hexadecimal escape may name.
    grouped: true
    items:
      - doc: runeNextLine is \N, U+0085.
        name: runeNextLine
        type: rune
        value: "0x85"
      - doc: runeNoBreakSpace is \_, U+00A0.
        name: runeNoBreakSpace
        type: rune
        value: "0xA0"
      - doc: runeLineSeparator is \L, U+2028.
        name: runeLineSeparator
        type: rune
        value: "0x2028"
      - doc: runeParagraphSeparator is \P, U+2029.
        name: runeParagraphSeparator
        type: rune
        value: "0x2029"
      - doc: runeEscape is \e, U+001B.
        name: runeEscape
        type: rune
        value: "0x1B"
      - doc: surrogateFirst is the first UTF-16 surrogate, which no escape may name.
        name: surrogateFirst
        type: rune
        value: "0xD800"
      - doc: surrogateLast is the last UTF-16 surrogate.
        name: surrogateLast
        type: rune
        value: "0xDFFF"
    name: runeNextLine
  - doc: The states of a block scalar being read.
    grouped: true
    items:
      - doc: blockLiteral marks a literal (|) scalar rather than a folded one.
        name: blockLiteral
        type: blockFlags
        value: 1 << iota
      - doc: blockLeadingBreak says the last content line ended with a line break.
        name: blockLeadingBreak
      - doc: blockLeadingBlank says the last content line started with a blank.
        name: blockLeadingBlank
    name: blockLiteral
  - doc: The widths of the hexadecimal escapes.
    grouped: true
    items:
      - doc: hexByteDigits is the width of \xXX.
        name: hexByteDigits
        type: int
        value: "2"
      - doc: hexBMPDigits is the width of \uXXXX.
        name: hexBMPDigits
        type: int
        value: "4"
      - doc: hexRuneDigits is the width of \UXXXXXXXX.
        name: hexRuneDigits
        type: int
        value: "8"
    name: hexByteDigits
  - doc: |-
      neverStartsPlain lists the indicators no plain scalar starts with, in any
      context.
    items:
      - name: neverStartsPlain
        type: string
        value: "\",[]{}#&*!|>'\\\"%@`\""
    name: neverStartsPlain
