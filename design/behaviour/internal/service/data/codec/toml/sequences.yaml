                  eval: embeddedStruct(f)
                  to: embeddedStruct
                when: embedded != nil && name == ""
            - opt:
                do:
                  - continue: true
                when: "!f.IsExported()"
            - opt:
                do:
                  - set: name
                    value: f.Name
                when: "!tagged || name == \"\""
            - set: opts
              to: standaloneTags
              value: standaloneTags(f.Tag, opts)
            - set: "*fields"
              value: "append(*fields, fieldPlan{name: name, index: path, opts: opts, depth: depth})"
          key: i
          range: t.NumField()
  - of: embeddedStruct
    participants:
      - id: caller
        kind: actor
      - id: embeddedStruct
        kind: self
