      - eval: markRange(&table, 'a', 'z', classBareKey)
        to: markRange
      - eval: markRange(&table, 'A', 'Z', classBareKey)
        to: markRange
      - eval: markRange(&table, 'a', 'f', classHex)
        to: markRange
      - eval: markRange(&table, 'A', 'F', classHex)
        to: markRange
      - eval: markRange(&table, '0', '7', classOctal)
        to: markRange
      - eval: markRange(&table, '0', '1', classBinary)
        to: markRange
      - op: "|="
        set: table['-']
        value: classBareKey | classNumberStart
      - op: "|="
        set: table['_']
        value: classBareKey
      - op: "|="
        set: table['+']
        value: classNumberStart
      - op: "|="
        set: table['i']
        value: classNumberStart
      - op: "|="
        set: table['n']
        value: classNumberStart
      - return: table
  - of: markRange
    steps:
      - loop:
          cond: c <= last
          do:
            - op: "|="
              set: table[c]
              value: cls
          init: c := first
          post: c++
