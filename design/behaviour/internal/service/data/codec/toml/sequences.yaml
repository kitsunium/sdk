                when: c == charBackslash
            - opt:
                do:
                  - op: ++
                    set: p.pos
                  - continue: true
                when: byteClass[c]&classPrintable != 0
            - opt:
                do:
                  - return: span{}, false, err
                init:
                  bind: err
                  eval: p.skipRune(problemControlInString)
                  to: p.skipRune
                when: err != nil
      - return: span{}, false, p.fail(p.pos, problemUnterminatedString)
  - of: (*parser).basicEscaped
    participants:
      - id: caller
        kind: actor
      - id: (*parser).basicEscaped
        kind: self
      - id: p.basicStep
        kind: internal
    steps:
      - bind: out
        eval: int32(len(p.unescaped))
      - set: p.unescaped
        value: append(p.unescaped, p.data[start:p.pos]...)
      - loop:
          cond: p.pos < len(p.data)
          do:
            - bind: c
              eval: p.data[p.pos]
            - opt:
                do:
                  - op: ++
                    set: p.pos
                  - return: "span{start: out, end: int32(len(p.unescaped))}, nil"
                when: c == charQuote
            - opt:
                do:
                  - return: span{}, err
                init:
                  bind: err
                  eval: p.basicStep(c)
                  to: p.basicStep
                when: err != nil
      - return: span{}, p.fail(p.pos, problemUnterminatedString)
  - of: (*parser).basicStep
    participants:
      - id: caller
        kind: actor
      - id: (*parser).basicStep
        kind: self
      - id: p.escape
        kind: internal
      - id: p.skipRune
        kind: internal
    steps:
      - opt:
          do:
            - return: p.escape()
              to: p.escape
          when: c == charBackslash
      - opt:
          do:
            - set: p.unescaped
              value: append(p.unescaped, c)
            - op: ++
              set: p.pos
            - return: nil
          when: byteClass[c]&classPrintable != 0
      - bind: start
        eval: p.pos
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.skipRune(problemControlInString)
            to: p.skipRune
          when: err != nil
      - set: p.unescaped
        value: append(p.unescaped, p.data[start:p.pos]...)
      - return: nil
  - of: (*parser).escape
    participants:
