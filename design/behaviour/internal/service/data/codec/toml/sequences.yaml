                - return: p.hexEscape(at, unicodeEscapeDigits)
                  to: p.hexEscape
            - case: "'U'"
              do:
                - return: p.hexEscape(at, longEscapeDigits)
                  to: p.hexEscape
            - case: "'x'"
              do:
                - return: p.hexEscape(at, shortEscapeDigits)
                  to: p.hexEscape
            - default: true
              do:
                - return: p.fail(at, problemBadEscape)
                  to: p.fail
          "on": c
  - of: (*parser).hexEscape
    participants:
      - id: caller
        kind: actor
      - id: (*parser).hexEscape
        kind: self
      - id: p.fail
        kind: internal
