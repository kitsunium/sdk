        set: p.pos
        value: digits
      - set: p.unescaped
        to: utf8
        value: utf8.AppendRune(p.unescaped, rune(code))
      - return: nil
  - of: (*parser).multilineString
    participants:
      - id: caller
        kind: actor
      - id: (*parser).multilineString
        kind: self
      - id: p.newline
        kind: internal
      - id: p.multilineStep
        kind: internal
