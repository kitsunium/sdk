      - id: caller
        kind: actor
      - id: parseTag
        kind: self
      - id: strings
        kind: stdlib
      - id: applyOption
        kind: internal
    steps:
      - bind: name, rest, _
        eval: strings.Cut(tag, ",")
        to: strings
      - loop:
          cond: rest != ""
          do:
            - var:
                name: opt
                type: string
            - set: opt, rest, _
              to: strings
              value: strings.Cut(rest, ",")
            - eval: applyOption(&opts, opt)
              to: applyOption
      - return: name, opts
  - of: applyOption
    steps:
      - switch:
          cases:
            - case: optOmitEmpty
              do:
                - set: opts.omitEmpty
                  value: "true"
            - case: optOmitZero
              do:
                - set: opts.omitZero
                  value: "true"
            - case: optInline
              do:
                - set: opts.inline
                  value: "true"
            - case: optMultiline
              do:
                - set: opts.multiline
                  value: "true"
            - case: optCommented
              do:
                - set: opts.commented
                  value: "true"
            - default: true
          "on": opt
  - of: standaloneTags
    participants:
      - id: caller
        kind: actor
      - id: standaloneTags
        kind: self
      - id: tag.Get
        kind: value
    steps:
      - set: opts.multiline
        value: opts.multiline || tag.Get(optMultiline) == tagTrue
      - set: opts.inline
        value: opts.inline || tag.Get(optInline) == tagTrue
      - set: opts.commented
        value: opts.commented || tag.Get(optCommented) == tagTrue
      - set: opts.comment
        to: tag.Get
        value: tag.Get(tagComment)
