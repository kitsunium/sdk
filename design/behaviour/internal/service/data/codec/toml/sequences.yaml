      - op: +=
        set: p.pos
        value: "2"
      - bind: digitsStart
        eval: p.pos
      - opt:
          do:
            - return: 0, 0, err
          init:
            bind: err
            eval: p.digits(radixClass(bits))
            to: p.digits
          when: err != nil
      - var:
          name: value
          type: uint64
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: c == '_'
            - opt:
                do:
                  - return: 0, 0, p.fail(at, problemIntegerRange)
                when: value > math.MaxInt64>>bits
            - set: value
              value: value<<bits | uint64(hexValue(c))
          key: _
          range: p.data[digitsStart:p.pos]
          value: c
      - return: kindInteger, value, nil
  - of: (*parser).digits
    participants:
      - id: caller
        kind: actor
      - id: (*parser).digits
        kind: self
      - id: p.fail
        kind: internal
    steps:
      - opt:
          do:
            - return: p.fail(p.pos, problemBadNumber)
              to: p.fail
          when: p.pos >= len(p.data) || byteClass[p.data[p.pos]]&cls == 0
      - op: ++
        set: p.pos
      - loop:
          cond: p.pos < len(p.data)
          do:
            - bind: c
              eval: p.data[p.pos]
            - opt:
                do:
                  - op: ++
                    set: p.pos
                  - continue: true
                when: byteClass[c]&cls != 0
            - opt:
                do:
                  - return: nil
                when: c != '_'
            - opt:
                do:
                  - return: p.fail(p.pos, problemBadUnderscore)
                    to: p.fail
                when: p.pos+1 >= len(p.data) || byteClass[p.data[p.pos+1]]&cls == 0
            - op: +=
              set: p.pos
              value: "2"
      - return: nil
  - of: (*parser).decimal
    participants:
      - id: caller
        kind: actor
      - id: (*parser).decimal
        kind: self
      - id: p.digits
        kind: internal
      - id: p.fraction
        kind: internal
      - id: p.floatOf
        kind: internal
      - id: p.integerOf
        kind: internal
    steps:
      - bind: intStart
        eval: p.pos
      - opt:
          do:
            - return: 0, 0, err
          init:
            bind: err
            eval: p.digits(classDigit)
            to: p.digits
          when: err != nil
      - opt:
          do:
            - return: 0, 0, p.fail(intStart, problemLeadingZero)
          when: p.data[intStart] == '0' && p.pos-intStart > 1
      - bind: isFloat, err
        eval: p.fraction()
        to: p.fraction
      - opt:
          do:
            - return: 0, 0, err
          when: err != nil
      - bind: token
        eval: p.data[start:p.pos]
      - opt:
          do:
            - return: p.floatOf(start, token)
              to: p.floatOf
          when: isFloat
      - return: p.integerOf(start, token)
        to: p.integerOf
  - of: (*parser).fraction
    participants:
      - id: caller
        kind: actor
      - id: (*parser).fraction
        kind: self
      - id: p.digits
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: false, err
                init:
                  bind: err
                  eval: p.digits(classDigit)
                  to: p.digits
                when: err != nil
            - set: isFloat
              value: "true"
          when: p.consume(charDot)
      - opt:
          do:
            - return: isFloat, nil
          when: p.pos >= len(p.data) || (p.data[p.pos] != 'e' && p.data[p.pos] != 'E')
      - op: ++
        set: p.pos
      - opt:
          do:
            - op: ++
              set: p.pos
          when: p.pos < len(p.data) && (p.data[p.pos] == '+' || p.data[p.pos] == '-')
      - return: true, p.digits(classDigit)
  - of: (*parser).floatOf
    participants:
      - id: caller
        kind: actor
      - id: (*parser).floatOf
        kind: self
      - id: fastFloat
        kind: internal
      - id: strconv
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[floatBufferBytes]byte"
      - bind: clean
        eval: buf[:0]
      - loop:
          do:
            - opt:
                do:
                  - set: clean
                    value: append(clean, c)
                when: c != '_'
          key: _
          range: token
          value: c
      - opt:
          do:
            - return: kindFloat, math.Float64bits(f), nil
          init:
            bind: f, ok
            eval: fastFloat(clean)
            to: fastFloat
          when: ok
      - bind: f, err
        eval: strconv.ParseFloat(string(clean), 64)
        to: strconv
      - opt:
          do:
            - return: 0, 0, p.fail(at, problemFloatRange)
          when: err != nil
      - return: kindFloat, math.Float64bits(f), nil
  - of: fastFloat
    participants:
      - id: caller
        kind: actor
      - id: fastFloat
        kind: self
      - id: significandOf
        kind: internal
      - id: exponentOf
        kind: internal
    steps:
      - bind: negative
        eval: b[0] == '-'
      - opt:
          do:
            - set: b
              value: b[1:]
          when: b[0] == '-' || b[0] == '+'
      - bind: significand, exponent, rest, ok
        eval: significandOf(b)
        to: significandOf
      - opt:
          do:
            - return: 0, false
          when: "!ok"
      - bind: exp, ok
        eval: exponentOf(rest)
        to: exponentOf
      - op: +=
        set: exponent
        value: exp
      - opt:
          do:
            - return: 0, false
          when: "!ok || significand > maxExactSignificand || exponent < -maxExactPow10 || exponent > maxExactPow10"
      - bind: f
        eval: float64(significand)
      - alt:
          - do:
              - op: /=
                set: f
                value: exactPow10[-exponent]
            when: exponent < 0
          - do:
              - op: "*="
                set: f
                value: exactPow10[exponent]
            else: true
      - opt:
          do:
            - set: f
              value: "-f"
          when: negative
      - return: f, true
  - of: exponentOf
    steps:
      - opt:
          do:
            - return: 0, true
          when: len(b) == 0
      - set: b
        value: b[1:]
      - bind: sign
        eval: "1"
      - opt:
          do:
            - opt:
                do:
                  - set: sign
                    value: "-1"
                when: b[0] == '-'
            - set: b
              value: b[1:]
          when: b[0] == '+' || b[0] == '-'
      - opt:
          do:
            - return: 0, false
          when: len(b) > maxExponentDigits
      - bind: value
        eval: "0"
      - loop:
          do:
            - set: value
              value: value*int(decimalBase) + int(c-'0')
          key: _
          range: b
          value: c
      - return: sign * value, true
  - of: (*parser).stringValue
    participants:
      - id: caller
        kind: actor
      - id: (*parser).stringValue
        kind: self
      - id: leaf
        kind: internal
      - id: p.multilineString
        kind: internal
      - id: p.singleLineString
        kind: internal
      - id: p.add
        kind: internal
    steps:
      - bind: at
        eval: p.pos
      - bind: "n"
        eval: leaf(kindString, part, at)
        to: leaf
      - bind: quote
        eval: p.data[p.pos]
      - var:
          name: err
          type: error
      - alt:
          - do:
              - set: n.text, err
                to: p.multilineString
                value: p.multilineString(quote)
              - op: "|="
                set: n.flags
                value: flagTextEscaped
            when: p.hasTriple(quote)
          - do:
              - var:
                  name: escaped
                  type: bool
              - set: n.text, escaped, err
                to: p.singleLineString
                value: p.singleLineString()
              - opt:
                  do:
                    - op: "|="
                      set: n.flags
                      value: flagTextEscaped
                  when: escaped
            else: true
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: p.add(parent, n)
        to: p.add
      - return: nil
  - of: (*parser).hasTriple
    steps:
      - return: p.pos+2 < len(p.data) && p.data[p.pos+1] == quote && p.data[p.pos+2] == quote
  - of: (*parser).singleLineString
    participants:
      - id: caller
        kind: actor
      - id: (*parser).singleLineString
        kind: self
      - id: p.literalString
        kind: internal
      - id: p.basicString
        kind: internal
    steps:
      - opt:
          do:
            - set: value, err
              to: p.literalString
              value: p.literalString()
            - return: value, false, err
          when: p.data[p.pos] == charApostrophe
      - return: p.basicString()
        to: p.basicString
  - of: (*parser).literalString
    participants:
      - id: caller
        kind: actor
      - id: (*parser).literalString
        kind: self
      - id: p.skipRune
        kind: internal
    steps:
      - op: ++
        set: p.pos
      - bind: start
        eval: p.pos
      - loop:
          cond: p.pos < len(p.data)
          do:
            - bind: c
              eval: p.data[p.pos]
            - opt:
                do:
                  - bind: value
                    eval: "span{start: int32(start), end: int32(p.pos)}"
                  - op: ++
                    set: p.pos
                  - return: value, nil
                when: c == charApostrophe
            - opt:
                do:
                  - op: ++
                    set: p.pos
                  - continue: true
                when: byteClass[c]&classPrintable != 0
            - opt:
                do:
                  - return: span{}, err
                init:
                  bind: err
                  eval: p.skipRune(problemControlInString)
                  to: p.skipRune
                when: err != nil
      - return: span{}, p.fail(p.pos, problemUnterminatedString)
  - of: (*parser).basicString
    participants:
      - id: caller
        kind: actor
      - id: (*parser).basicString
        kind: self
      - id: p.basicEscaped
        kind: internal
      - id: p.skipRune
        kind: internal
    steps:
      - op: ++
        set: p.pos
      - bind: start
        eval: p.pos
      - loop:
          cond: p.pos < len(p.data)
          do:
            - bind: c
              eval: p.data[p.pos]
            - opt:
                do:
                  - set: value
                    value: "span{start: int32(start), end: int32(p.pos)}"
