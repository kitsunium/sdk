        kind: actor
      - id: (*encoder).mapEntries
        kind: self
      - id: v.Type
        kind: value
      - id: reflect.New(t.Key()).Elem
        kind: value
      - id: reflect
        kind: stdlib
      - id: iter.Reset
        kind: value
      - id: key.SetIterKey
        kind: value
      - id: values.Index
        kind: value
      - id: value.SetIterValue
        kind: value
      - id: mapKeyString
        kind: internal
      - id: slices
