            - bind: f
              eval: "&info.fields[i]"
            - bind: fv, ok
              eval: fieldOf(v, f.index)
              to: fieldOf
            - opt:
                do:
                  - continue: true
                when: "!ok || omitted(fv, f.opts)"
            - set: entries
              value: "append(entries, entry{key: f.name, value: fv, opts: f.opts})"
          key: i
          range: info.fields
      - return: entries
  - of: fieldOf
    participants:
      - id: caller
        kind: actor
      - id: fieldOf
        kind: self
      - id: v.Elem
        kind: value
      - id: v.Field
        kind: value
