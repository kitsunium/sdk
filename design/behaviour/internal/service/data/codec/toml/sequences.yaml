  - of: (*parser).add
    participants:
      - id: caller
        kind: actor
      - id: (*parser).add
        kind: self
      - id: p.indexInsert
        kind: internal
      - id: p.indexTable
        kind: internal
    steps:
      - bind: idx
        eval: int32(len(p.nodes))
      - set: n.parent, n.first, n.last, n.next, n.hnext
        value: parent, noNode, noNode, noNode, noNode
      - set: n.depth
        value: p.nodes[parent].depth + 1
      - set: p.nodes
        value: append(p.nodes, n)
      - bind: holder
        eval: "&p.nodes[parent]"
      - alt:
          - do:
              - set: holder.first
                value: idx
            when: holder.last == noNode
          - do:
              - set: p.nodes[holder.last].next
                value: idx
            else: true
      - set: holder.last
        value: idx
      - op: ++
        set: holder.count
      - alt:
          - do:
              - eval: p.indexInsert(idx)
                to: p.indexInsert
            when: holder.flags&flagIndexed != 0
          - do:
              - eval: p.indexTable(parent)
                to: p.indexTable
            when: holder.kind == kindTable && holder.count > linearLimit
      - return: idx
  - of: keyHash
    steps:
      - return: maphash.Bytes(hashSeed, key) ^ (uint64(t) * hashMixer)
  - of: (*parser).indexTable
    participants:
      - id: caller
        kind: actor
      - id: (*parser).indexTable
        kind: self
      - id: p.indexInsert
        kind: internal
    steps:
      - opt:
          do:
            - set: p.index
              value: make(map[uint64]int32)
          when: p.index == nil
      - op: "|="
        set: p.nodes[t].flags
        value: flagIndexed
      - loop:
          cond: c != noNode
          do:
            - eval: p.indexInsert(c)
              to: p.indexInsert
          init: c := p.nodes[t].first
          post: c = p.nodes[c].next
  - of: (*parser).indexInsert
    participants:
      - id: caller
        kind: actor
      - id: (*parser).indexInsert
        kind: self
      - id: keyHash
        kind: internal
    steps:
      - bind: "n"
        eval: "&p.nodes[c]"
      - bind: h
        eval: keyHash(n.parent, p.keyBytes(n))
        to: keyHash
      - bind: head, ok
        eval: p.index[h]
      - opt:
          do:
            - set: head
              value: noNode
          when: "!ok"
      - set: n.hnext
        value: head
      - set: p.index[h]
        value: c
  - of: infoOf
    participants:
      - id: caller
        kind: actor
      - id: infoOf
        kind: self
      - id: typeInfos.Load
        kind: value
      - id: describe
        kind: internal
      - id: typeInfos.LoadOrStore
        kind: value
    steps:
      - opt:
          do:
            - return: predeclaredInfo
          when: t.PkgPath() == "" && t.Kind() >= reflect.Bool && t.Kind() <= reflect.Float64 || t.PkgPath() == "" && t.Kind() == reflect.String
      - opt:
          do:
            - opt:
                do:
                  - return: info
                init:
                  bind: info, isInfo
                  eval: cached.(*typeInfo)
                when: isInfo
          init:
            bind: cached, ok
            eval: typeInfos.Load(t)
            to: typeInfos.Load
          when: ok
      - bind: info
        eval: describe(t)
        to: describe
      - bind: actual, _
        eval: typeInfos.LoadOrStore(t, info)
        to: typeInfos.LoadOrStore
      - opt:
          do:
            - return: stored
          init:
            bind: stored, isInfo
            eval: actual.(*typeInfo)
          when: isInfo
      - return: info
  - of: describe
    participants:
      - id: caller
        kind: actor
      - id: describe
        kind: self
      - id: t.Kind
        kind: value
      - id: structFields
        kind: internal
      - id: fieldIndexes
        kind: internal
    steps:
      - bind: info
        eval: "&typeInfo{flags: methodFlags(t)}"
      - bind: kindOfT
        eval: t.Kind()
        to: t.Kind
      - opt:
          do:
            - op: "|="
              set: info.flags
              value: typeValue
          when: info.flags&(typeSpecial|typeTextMarshaler|typeTextMarshalerPtr) != 0 || (kindOfT != reflect.Map && kindOfT != reflect.Struct)
      - opt:
          do:
            - set: info.fields
              to: structFields
              value: structFields(t)
            - set: info.exact, info.folded
              to: fieldIndexes
              value: fieldIndexes(info.fields)
            - opt:
                do:
                  - op: "|="
                    set: info.flags
                    value: typeBadNames
                when: slices.ContainsFunc(info.fields, func(f fieldPlan) bool { return !utf8.ValidString(f.name) })
          when: kindOfT == reflect.Struct
      - return: info
  - of: methodFlags
    participants:
      - id: caller
        kind: actor
      - id: methodFlags
        kind: self
      - id: reflect
        kind: stdlib
      - id: t.Implements
        kind: value
    steps:
      - bind: ptr
        eval: reflect.PointerTo(t)
        to: reflect
      - bind: textMarshaler
        eval: t.Implements(textMarshalerType)
        to: t.Implements
      - bind: flags
        eval: |-
          flagIf(textMarshaler, typeTextMarshaler) |
          		flagIf(!textMarshaler && ptr.Implements(textMarshalerType), typeTextMarshalerPtr) |
          		flagIf(ptr.Implements(textUnmarshalerType), typeTextUnmarshaler) |
          		flagIf(ptr.Implements(isZeroerType), typeZeroer)
      - opt:
          do:
            - op: "|="
              set: flags
              value: typeSpecial
          when: t == timeType || t == localDateType || t == localTimeType || t == localDateTimeType
      - return: flags
  - of: flagIf
    steps:
      - opt:
          do:
            - return: flag
          when: cond
      - return: "0"
  - of: (*typeInfo).is
    steps:
      - return: ti.flags&flags == flags
  - of: structFields
    participants:
      - id: caller
        kind: actor
      - id: structFields
        kind: self
      - id: collectFields
        kind: internal
    steps:
      - var:
          name: fields
          type: "[]fieldPlan"
      - eval: collectFields(&fields, t, nil, 0, map[reflect.Type]bool{})
        to: collectFields
      - bind: byName
        eval: make(map[string]int, len(fields))
      - bind: kept
        eval: fields[:0]
      - loop:
          do:
            - bind: at, seen
              eval: byName[f.name]
            - opt:
                do:
                  - set: byName[f.name]
                    value: len(kept)
                  - set: kept
                    value: append(kept, f)
                  - continue: true
                when: "!seen"
            - opt:
                do:
                  - set: kept[at]
                    value: f
                when: f.depth < kept[at].depth
          key: _
          range: fields
          value: f
      - return: kept
  - of: collectFields
    participants:
      - id: caller
        kind: actor
      - id: collectFields
        kind: self
      - id: t.Field
        kind: value
      - id: f.Tag.Lookup
        kind: value
      - id: parseTag
        kind: internal
      - id: embeddedStruct
        kind: internal
      - id: standaloneTags
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: visited[t]
      - set: visited[t]
        value: "true"
      - defer: delete(visited, t)
      - loop:
          do:
            - bind: f
              eval: t.Field(i)
              to: t.Field
            - bind: tag, tagged
              eval: f.Tag.Lookup(tagName)
              to: f.Tag.Lookup
            - opt:
                do:
                  - continue: true
                when: tag == tagSkip
            - bind: path
              eval: append(append(make([]int, 0, len(index)+1), index...), i)
            - bind: name, opts
              eval: parseTag(tag)
              to: parseTag
            - opt:
                do:
                  - eval: collectFields(fields, embedded, path, depth+1, visited)
                    to: collectFields
                  - continue: true
                init:
