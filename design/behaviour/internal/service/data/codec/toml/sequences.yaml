      - bind: at
        eval: p.pos
      - op: +=
        set: p.pos
        value: delimiterLength
      - eval: p.newline()
        to: p.newline
      - bind: out
        eval: int32(len(p.unescaped))
      - loop:
          cond: p.pos < len(p.data)
          do:
            - bind: closed, err
              eval: p.multilineStep(quote)
              to: p.multilineStep
            - opt:
                do:
                  - return: span{}, err
                when: err != nil
            - opt:
                do:
                  - return: "span{start: out, end: int32(len(p.unescaped))}, nil"
                when: closed
      - return: span{}, p.fail(at, problemUnterminatedString)
  - of: (*parser).multilineStep
    participants:
      - id: caller
        kind: actor
      - id: (*parser).multilineStep
        kind: self
      - id: p.quoteRun
        kind: internal
    steps:
      - bind: c
        eval: p.data[p.pos]
      - opt:
          do:
            - return: p.quoteRun(quote)
              to: p.quoteRun
          when: c == quote
      - opt:
          do:
            - return: false, p.multilineEscape()
          when: c == charBackslash && quote == charQuote
      - opt:
          do:
            - set: p.unescaped
              value: append(p.unescaped, c)
            - op: ++
              set: p.pos
            - return: false, nil
          when: byteClass[c]&classPrintable != 0
      - return: false, p.multilineOther()
  - of: (*parser).multilineOther
    participants:
      - id: caller
        kind: actor
      - id: (*parser).multilineOther
        kind: self
      - id: p.skipRune
        kind: internal
    steps:
      - bind: start
        eval: p.pos
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: p.skipRune(problemControlInString)
                  to: p.skipRune
                when: err != nil
          when: "!p.newline()"
      - set: p.unescaped
        value: append(p.unescaped, p.data[start:p.pos]...)
      - return: nil
  - of: (*parser).quoteRun
    steps:
      - bind: start
        eval: p.pos
      - loop:
          cond: p.pos < len(p.data) && p.data[p.pos] == quote
          do:
            - op: ++
              set: p.pos
      - bind: run
        eval: p.pos - start
      - opt:
          do:
            - return: false, p.fail(start, problemTooManyQuotes)
          when: run > maxClosingQuotes
      - opt:
          do:
            - set: p.unescaped
              value: append(p.unescaped, p.data[start:p.pos]...)
            - return: false, nil
          when: run < delimiterLength
      - set: p.unescaped
        value: append(p.unescaped, p.data[start:p.pos-delimiterLength]...)
      - return: true, nil
  - of: (*parser).multilineEscape
    participants:
      - id: caller
        kind: actor
      - id: (*parser).multilineEscape
        kind: self
      - id: p.escape
        kind: internal
      - id: p.skipSpace
        kind: internal
