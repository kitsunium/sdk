      - bind: ahead
        eval: p.pos + 1
      - loop:
          cond: ahead < len(p.data) && (p.data[ahead] == charSpace || p.data[ahead] == charTab)
          do:
            - op: ++
              set: ahead
      - bind: saved
        eval: p.pos
      - set: p.pos
        value: ahead
      - opt:
          do:
            - set: p.pos
              value: saved
            - return: p.escape()
              to: p.escape
          when: "!p.newline()"
      - loop:
          do:
            - eval: p.skipSpace()
              to: p.skipSpace
            - opt:
                do:
                  - return: nil
                when: "!p.newline()"
          forever: true
  - of: hexValue
    steps:
      - switch:
          cases:
            - case: c <= '9'
              do:
                - return: c - '0'
            - case: c >= 'a'
              do:
                - return: c - 'a' + hexLetterValue
            - default: true
              do:
                - return: c - 'A' + hexLetterValue
  - of: (*parser).header
    participants:
      - id: caller
        kind: actor
      - id: (*parser).header
        kind: self
      - id: p.skipSpace
        kind: internal
      - id: p.key
        kind: internal
      - id: p.fail
        kind: internal
      - id: p.walkHeader
        kind: internal
      - id: p.openArrayTable
        kind: internal
      - id: p.openTable
        kind: internal
    steps:
      - bind: at
        eval: p.pos
      - bind: array
        eval: p.pos+1 < len(p.data) && p.data[p.pos+1] == charOpenBracket
      - op: ++
        set: p.pos
      - opt:
          do:
            - op: ++
              set: p.pos
          when: array
      - eval: p.skipSpace()
        to: p.skipSpace
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.key()
            to: p.key
          when: err != nil
      - opt:
          do:
            - return: p.fail(p.pos, problemUnclosedHeader)
              to: p.fail
          when: "!p.consume(charCloseBracket) || (array && !p.consume(charCloseBracket))"
      - bind: parent, err
        eval: p.walkHeader(p.parts[:len(p.parts)-1])
        to: p.walkHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: last
        eval: p.parts[len(p.parts)-1]
      - opt:
          do:
            - return: p.openArrayTable(parent, last, at)
              to: p.openArrayTable
          when: array
      - return: p.openTable(parent, last, at)
        to: p.openTable
  - of: (*parser).walkHeader
    participants:
      - id: caller
        kind: actor
      - id: (*parser).walkHeader
        kind: self
      - id: p.headerStep
        kind: internal
    steps:
      - bind: t
        eval: rootNode
      - loop:
          do:
            - bind: next, err
              eval: p.headerStep(t, part)
              to: p.headerStep
            - opt:
                do:
                  - return: noNode, err
                when: err != nil
            - set: t
              value: next
          key: _
          range: parts
          value: part
      - return: t, nil
  - of: (*parser).headerStep
    participants:
      - id: caller
        kind: actor
      - id: (*parser).headerStep
        kind: self
      - id: p.child
        kind: internal
      - id: p.newTable
        kind: internal
    steps:
      - bind: c
        eval: p.child(t, p.partBytes(part))
        to: p.child
      - opt:
          do:
            - return: p.newTable(t, part, originImplicit)
              to: p.newTable
          when: c == noNode
      - bind: "n"
        eval: "&p.nodes[c]"
      - opt:
          do:
            - return: c, nil
          when: n.kind == kindTable && n.origin != originInline
      - opt:
          do:
            - return: n.last, nil
          when: n.kind == kindArrayOfTables
      - return: noNode, p.fail(int(part.at), problemExtendValue)
  - of: (*parser).openTable
    participants:
      - id: caller
        kind: actor
      - id: (*parser).openTable
        kind: self
      - id: p.child
        kind: internal
      - id: p.newTable
        kind: internal
      - id: p.fail
        kind: internal
    steps:
      - bind: c
        eval: p.child(parent, p.partBytes(part))
        to: p.child
      - opt:
          do:
            - bind: t, err
              eval: p.newTable(parent, part, originHeader)
              to: p.newTable
            - set: p.current
              value: t
            - return: err
          when: c == noNode
      - bind: "n"
        eval: "&p.nodes[c]"
      - opt:
          do:
            - set: n.origin
              value: originHeader
            - set: p.current
              value: c
            - return: nil
