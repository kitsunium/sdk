        kind: actor
      - id: (*decoder).table
        kind: self
      - id: d.structFields
        kind: internal
      - id: d.mapEntries
        kind: internal
      - id: d.tableIntoSlice
        kind: internal
      - id: d.tableIntoArray
        kind: internal
      - id: d.fail
        kind: internal
    steps:
      - switch:
          cases:
            - case: reflect.Struct
              do:
                - return: d.structFields(n, v)
                  to: d.structFields
            - case: reflect.Map
              do:
                - return: d.mapEntries(n, v)
                  to: d.mapEntries
            - case: reflect.Slice
              do:
                - return: d.tableIntoSlice(n, v)
                  to: d.tableIntoSlice
            - case: reflect.Array
              do:
                - return: d.tableIntoArray(n, v)
                  to: d.tableIntoArray
            - default: true
              do:
                - return: d.fail(n, problemMismatch, v.Type())
                  to: d.fail
          "on": v.Kind()
  - of: (*decoder).tableIntoSlice
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).tableIntoSlice
        kind: self
      - id: d.fail
        kind: internal
      - id: v.Set
        kind: value
      - id: d.value
        kind: internal
    steps:
      - opt:
          do:
            - return: d.fail(n, problemMismatch, v.Type())
              to: d.fail
          when: d.p.nodes[n].origin == originInline
      - opt:
          do:
            - eval: v.Set(reflect.Append(v, reflect.New(v.Type().Elem()).Elem()))
              to: v.Set
          when: v.Len() == 0
      - return: d.value(n, v.Index(v.Len()-1))
        to: d.value
  - of: (*decoder).tableIntoArray
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).tableIntoArray
        kind: self
      - id: d.fail
        kind: internal
      - id: d.value
        kind: internal
    steps:
      - opt:
          do:
            - return: d.fail(n, problemMismatch, v.Type())
              to: d.fail
          init:
            bind: from
            eval: d.p.nodes[n].origin
          when: from != originImplicit && from != originDotted
      - opt:
          do:
            - return: d.fail(n, problemArrayTooShort, v.Type())
              to: d.fail
          when: v.Len() == 0
      - return: d.value(n, v.Index(0))
        to: d.value
  - of: (*decoder).structFields
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).structFields
        kind: self
      - id: infoOf
        kind: internal
      - id: info.lookup
        kind: internal
      - id: d.field
        kind: internal
      - id: d.value
        kind: internal
    steps:
      - bind: info
        eval: infoOf(v.Type())
        to: infoOf
      - bind: nodes
        eval: d.p.nodes
      - loop:
          cond: c != noNode
          do:
            - bind: f, ok
              eval: info.lookup(d.p.keyBytes(&nodes[c]))
              to: info.lookup
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - bind: fv, err
              eval: d.field(c, v, f.index)
              to: d.field
            - opt:
                do:
                  - return: err
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.value(c, fv)
                  to: d.value
                when: err != nil
          init: c := nodes[n].first
          post: c = nodes[c].next
      - return: nil
  - of: (*decoder).field
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).field
        kind: self
      - id: v.Set
        kind: value
      - id: v.Elem
        kind: value
      - id: v.Field
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - opt:
                            do:
                              - return: reflect.Value{}, d.fail(c, problemEmbedded, v.Type())
                            when: "!v.CanSet()"
                        - eval: v.Set(reflect.New(v.Type().Elem()))
                          to: v.Set
                      when: v.IsNil()
                  - set: v
                    to: v.Elem
                    value: v.Elem()
                when: i > 0 && v.Kind() == reflect.Pointer
            - set: v
              to: v.Field
              value: v.Field(step)
          key: i
          range: index
          value: step
      - return: v, nil
  - of: (*decoder).mapEntries
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).mapEntries
        kind: self
      - id: v.Type
        kind: value
      - id: v.Set
        kind: value
      - id: reflect.New(t.Key()).Elem
        kind: value
      - id: reflect.New(t.Elem()).Elem
        kind: value
      - id: d.mapKey
        kind: internal
      - id: elem.SetZero
        kind: value
      - id: v.MapIndex
        kind: value
      - id: elem.Set
        kind: value
      - id: d.value
        kind: internal
      - id: v.SetMapIndex
        kind: value
    steps:
      - bind: t
        eval: v.Type()
        to: v.Type
      - opt:
          do:
            - eval: v.Set(reflect.MakeMapWithSize(t, int(d.p.nodes[n].count)))
              to: v.Set
          when: v.IsNil() || !d.merges(n)
      - bind: key
        eval: reflect.New(t.Key()).Elem()
        to: reflect.New(t.Key()).Elem
      - bind: elem
        eval: reflect.New(t.Elem()).Elem()
        to: reflect.New(t.Elem()).Elem
      - bind: nodes
        eval: d.p.nodes
      - loop:
          cond: c != noNode
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.mapKey(c, key)
                  to: d.mapKey
                when: err != nil
            - eval: elem.SetZero()
              to: elem.SetZero
            - opt:
                do:
                  - eval: elem.Set(existing)
                    to: elem.Set
                init:
                  bind: existing
                  eval: v.MapIndex(key)
                  to: v.MapIndex
                when: existing.IsValid()
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.value(c, elem)
                  to: d.value
                when: err != nil
            - eval: v.SetMapIndex(key, elem)
              to: v.SetMapIndex
          init: c := nodes[n].first
          post: c = nodes[c].next
      - return: nil
  - of: (*decoder).mapKey
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).mapKey
        kind: self
      - id: d.p.keyBytes
        kind: internal
      - id: key.SetString
        kind: value
      - id: setIntKey
        kind: internal
      - id: setUintKey
        kind: internal
      - id: setFloatKey
        kind: internal
      - id: d.textKey
        kind: internal
      - id: d.fail
        kind: internal
    steps:
      - bind: raw
        eval: d.p.keyBytes(&d.p.nodes[c])
        to: d.p.keyBytes
      - var:
          name: ok
          type: bool
      - switch:
          cases:
            - case: reflect.String
              do:
                - eval: key.SetString(d.p.internKey(raw))
                  to: key.SetString
                - set: ok
                  value: "true"
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - set: ok
                  to: setIntKey
                  value: setIntKey(key, raw)
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr
              do:
                - set: ok
                  to: setUintKey
                  value: setUintKey(key, raw)
            - case: reflect.Float32, reflect.Float64
              do:
                - set: ok
                  to: setFloatKey
                  value: setFloatKey(key, raw)
            - default: true
              do:
                - return: d.textKey(c, key, raw)
                  to: d.textKey
          "on": key.Kind()
      - opt:
          do:
            - return: d.fail(c, problemMapKey, key.Type())
              to: d.fail
          when: "!ok"
      - return: nil
  - of: (*decoder).textKey
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).textKey
        kind: self
      - id: d.unmarshalText
        kind: internal
      - id: d.fail
        kind: internal
    steps:
      - opt:
          do:
            - return: d.unmarshalText(c, key, raw)
              to: d.unmarshalText
          when: infoOf(key.Type()).is(typeTextUnmarshaler)
      - return: d.fail(c, problemMapKey, key.Type())
        to: d.fail
  - of: setIntKey
    participants:
      - id: caller
        kind: actor
      - id: setIntKey
        kind: self
      - id: strconv
        kind: stdlib
      - id: key.SetInt
        kind: value
    steps:
      - bind: i, err
        eval: strconv.ParseInt(string(raw), int(decimalBase), 64)
        to: strconv
      - opt:
          do:
            - return: "false"
          when: err != nil || key.OverflowInt(i)
      - eval: key.SetInt(i)
        to: key.SetInt
      - return: "true"
  - of: setUintKey
    participants:
      - id: caller
        kind: actor
      - id: setUintKey
        kind: self
      - id: strconv
        kind: stdlib
      - id: key.SetUint
        kind: value
    steps:
      - bind: u, err
        eval: strconv.ParseUint(string(raw), int(decimalBase), 64)
        to: strconv
      - opt:
          do:
            - return: "false"
          when: err != nil || key.OverflowUint(u)
      - eval: key.SetUint(u)
        to: key.SetUint
      - return: "true"
  - of: setFloatKey
    participants:
      - id: caller
        kind: actor
      - id: setFloatKey
        kind: self
      - id: strconv
        kind: stdlib
      - id: key.SetFloat
        kind: value
    steps:
      - bind: f, err
        eval: strconv.ParseFloat(string(raw), key.Type().Bits())
        to: strconv
      - opt:
          do:
            - return: "false"
          when: err != nil
      - eval: key.SetFloat(f)
        to: key.SetFloat
      - return: "true"
  - of: (*decoder).unmarshalText
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).unmarshalText
        kind: self
      - id: d.fail
        kind: internal
      - id: u.UnmarshalText
        kind: value
      - id: d.wrapFail
        kind: internal
    steps:
      - bind: u, ok
        eval: reflect.TypeAssert[encoding.TextUnmarshaler](v.Addr())
      - opt:
          do:
            - return: d.fail(c, problemMismatch, v.Type())
              to: d.fail
          when: "!ok"
      - opt:
          do:
            - return: d.wrapFail(c, err, v.Type())
              to: d.wrapFail
          init:
            bind: err
            eval: u.UnmarshalText(raw)
            to: u.UnmarshalText
          when: err != nil
      - return: nil
  - of: (*decoder).array
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).array
        kind: self
      - id: reflect
        kind: stdlib
      - id: d.elements
        kind: internal
      - id: v.Set
        kind: value
      - id: d.fail
        kind: internal
    steps:
      - bind: count
        eval: int(d.p.nodes[n].count)
      - switch:
          cases:
            - case: reflect.Slice
              do:
                - bind: slice
                  eval: reflect.MakeSlice(v.Type(), count, count)
                  to: reflect
                - opt:
                    do:
                      - return: err
                    init:
                      bind: err
                      eval: d.elements(n, slice)
                      to: d.elements
                    when: err != nil
                - eval: v.Set(slice)
                  to: v.Set
                - return: nil
            - case: reflect.Array
              do:
                - opt:
                    do:
                      - return: d.fail(n, problemArrayTooShort, v.Type())
                        to: d.fail
                    when: d.p.nodes[n].kind == kindArrayOfTables && count > v.Len()
                - return: d.elements(n, v)
                  to: d.elements
            - default: true
              do:
                - return: d.fail(n, problemMismatch, v.Type())
                  to: d.fail
          "on": v.Kind()
  - of: (*decoder).elements
    participants:
      - id: caller
        kind: actor
      - id: (*decoder).elements
        kind: self
      - id: v.Len
        kind: value
      - id: d.value
        kind: internal
    steps:
      - bind: limit
        eval: v.Len()
        to: v.Len
      - bind: i
        eval: "0"
      - bind: nodes
        eval: d.p.nodes
      - loop:
          cond: c != noNode && i < limit
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: d.value(c, v.Index(i))
                  to: d.value
                when: err != nil
            - op: ++
              set: i
          init: c := nodes[n].first
          post: c = nodes[c].next
      - return: nil
  - of: (*tomlDecoder).Decode
    participants:
      - id: caller
        kind: actor
      - id: (*tomlDecoder).Decode
        kind: self
      - id: io
        kind: stdlib
      - id: errs
        kind: package
      - id: unmarshal
        kind: internal
    steps:
      - opt:
          do:
            - return: io.EOF
          when: d.done
      - set: d.done
        value: "true"
      - bind: data, err
        eval: io.ReadAll(io.LimitReader(d.r, int64(maxDocumentBytes)+1))
        to: io
      - opt:
          do:
            - return: io.EOF
          when: errors.Is(err, io.EOF)
      - opt:
          do:
            - return: |-
                errs.Wrap(err, errs.WrapParams{
                			Code:    coretoml.CodeTOMLUnmarshalFailed,
                			Reason:  coretoml.UnmarshalFailed.Reason(),
                			Public:  coretoml.UnmarshalFailed.Public(),
                			Private: privateReadFailed,
                		})
              to: errs
          when: err != nil
      - return: unmarshal(data, v)
        to: unmarshal
  - of: (*tomlDecoder).More
    steps:
      - return: "!d.done"
  - of: (*encoder).reset
    steps:
      - set: e.buf
        value: nil
      - set: e.keys
        value: e.keys[:0]
      - set: e.depth
        value: "0"
      - set: e.hops
        value: "0"
      - set: e.lastWasHeader
        value: "false"
      - loop:
          do:
            - eval: clear(e.free[i][:cap(e.free[i])])
          key: i
          range: e.free
  - of: (*encoder).retained
    steps:
      - bind: total
        eval: "0"
      - loop:
          do:
            - op: +=
              set: total
              value: cap(s)
          key: _
          range: e.free
          value: s
      - return: total
  - of: encodeDocument
    participants:
      - id: caller
        kind: actor
      - id: encodeDocument
        kind: self
      - id: encoderPool.Get
        kind: value
      - id: encoderPool.Put
        kind: value
      - id: resolve
        kind: internal
      - id: e.table
        kind: internal
    steps:
      - bind: e
        eval: encoderPool.Get()
        to: encoderPool.Get
      - defer: encoderPool.Put(e)
        to: encoderPool.Put
      - set: e.buf
        value: dst
      - bind: root, ok
        eval: resolve(reflect.ValueOf(v))
        to: resolve
      - opt:
          do:
            - return: dst, encodeFail(nilOrLoop(root), reflect.TypeOf(v))
          when: "!ok"
      - opt:
          do:
            - return: dst, encodeFail(problemRoot, root.Type())
          when: infoOf(root.Type()).is(typeValue)
      - opt:
          do:
            - return: dst, err
          init:
            bind: err
            eval: e.table(root, false)
            to: e.table
          when: err != nil
      - return: e.buf, nil
  - of: resolve
    participants:
      - id: caller
        kind: actor
      - id: resolve
        kind: self
      - id: v.Elem
        kind: value
    steps:
      - loop:
          cond: v.IsValid() && (v.Kind() == reflect.Pointer || v.Kind() == reflect.Interface)
          do:
            - opt:
                do:
                  - return: v, false
                when: v.IsNil() || hops == maxDepth
            - set: v
              to: v.Elem
              value: v.Elem()
          init: hops := int32(0)
          post: hops++
      - return: v, v.IsValid()
  - of: nilOrLoop
    steps:
      - opt:
          do:
            - return: problemPointerLoop
          when: v.IsValid() && (v.Kind() == reflect.Pointer || v.Kind() == reflect.Interface) && !v.IsNil()
      - return: problemNil
  - of: encodeFail
    participants:
      - id: caller
        kind: actor
      - id: encodeFail
        kind: self
      - id: t.String
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: name
        eval: "\"nil\""
      - opt:
          do:
            - set: name
              to: t.String
              value: t.String()
          when: t != nil
      - return: errs.Wrap(coretoml.MarshalFailed, errs.WrapParams{}, errs.String(fieldProblem, problem), errs.String(fieldType, name))
        to: errs
  - of: (*encoder).table
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).table
        kind: self
      - id: encodeFail
        kind: internal
      - id: e.collect
        kind: internal
      - id: e.release
        kind: internal
      - id: e.keyValues
        kind: internal
      - id: e.subTables
        kind: internal
    steps:
      - opt:
          do:
            - return: encodeFail(problemTooDeepEncode, v.Type())
              to: encodeFail
          when: e.depth >= maxDepth
      - op: ++
        set: e.depth
      - defer: func() { e.depth-- }()
      - bind: entries, err
        eval: e.collect(v)
        to: e.collect
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: e.release(entries)
        to: e.release
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: e.keyValues(entries, commented)
            to: e.keyValues
          when: err != nil
      - return: e.subTables(entries, commented)
        to: e.subTables
  - of: (*encoder).keyValues
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).keyValues
        kind: self
      - id: e.keyValue
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: e.isTable(&entries[i])
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: e.keyValue(&entries[i], commented)
                  to: e.keyValue
                when: err != nil
          key: i
          range: entries
      - return: nil
  - of: (*encoder).subTables
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).subTables
        kind: self
      - id: e.subTable
        kind: internal
    steps:
      - loop:
          do:
            - bind: ent
              eval: "&entries[i]"
            - opt:
                do:
                  - continue: true
                when: "!e.isTable(ent)"
            - set: e.keys
              value: append(e.keys, ent.key)
            - bind: err
              eval: e.subTable(ent, commented || ent.opts.commented)
              to: e.subTable
            - set: e.keys
              value: e.keys[:len(e.keys)-1]
            - opt:
                do:
                  - return: err
                when: err != nil
          key: i
          range: entries
      - return: nil
  - of: (*encoder).subTable
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).subTable
        kind: self
      - id: resolve
        kind: internal
      - id: e.arrayOfTables
        kind: internal
      - id: e.header
        kind: internal
      - id: e.table
        kind: internal
    steps:
      - bind: v, _
        eval: resolve(ent.value)
        to: resolve
      - opt:
          do:
            - return: e.arrayOfTables(v, ent.opts.comment, commented)
              to: e.arrayOfTables
          when: v.Kind() == reflect.Slice || v.Kind() == reflect.Array
      - eval: e.header(ent.opts.comment, commented, false)
        to: e.header
      - return: e.table(v, commented)
        to: e.table
  - of: (*encoder).arrayOfTables
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).arrayOfTables
        kind: self
      - id: resolve
        kind: internal
      - id: e.header
        kind: internal
      - id: e.table
        kind: internal
    steps:
      - loop:
          do:
            - bind: element, _
              eval: resolve(v.Index(i))
              to: resolve
            - eval: e.header(comment, commented, true)
              to: e.header
            - set: comment
              value: "\"\""
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: e.table(element, commented)
                  to: e.table
                when: err != nil
          key: i
          range: v.Len()
      - return: nil
  - of: (*encoder).header
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).header
        kind: self
      - id: appendComment
        kind: internal
      - id: appendKey
        kind: internal
    steps:
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, charNewline)
          when: len(e.buf) > 0 && !e.lastWasHeader
      - set: e.buf
        to: appendComment
        value: appendComment(e.buf, comment)
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, commentPrefix...)
          when: commented
      - set: e.buf
        value: append(e.buf, charOpenBracket)
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, charOpenBracket)
          when: array
      - loop:
          do:
            - opt:
                do:
                  - set: e.buf
                    value: append(e.buf, charDot)
                when: i > 0
            - set: e.buf
              to: appendKey
              value: appendKey(e.buf, part)
          key: i
          range: e.keys
          value: part
      - set: e.buf
        value: append(e.buf, charCloseBracket)
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, charCloseBracket)
          when: array
      - set: e.buf
        value: append(e.buf, charNewline)
      - set: e.lastWasHeader
        value: "true"
  - of: appendComment
    participants:
      - id: caller
        kind: actor
      - id: appendComment
        kind: self
      - id: cutLine
        kind: internal
    steps:
      - loop:
          cond: comment != ""
          do:
            - bind: line, rest, _
              eval: cutLine(comment)
              to: cutLine
            - set: b
              value: append(b, commentPrefix...)
            - set: b
              value: append(b, line...)
            - set: b
              value: append(b, charNewline)
            - set: comment
              value: rest
      - return: b
  - of: (*encoder).keyValue
    participants:
      - id: caller
        kind: actor
      - id: (*encoder).keyValue
        kind: self
      - id: appendComment
        kind: internal
      - id: appendKey
        kind: internal
      - id: e.appendValue
        kind: internal
      - id: commentLines
        kind: internal
    steps:
      - set: commented
        value: commented || ent.opts.commented
      - set: e.buf
        to: appendComment
        value: appendComment(e.buf, ent.opts.comment)
      - bind: start
        eval: len(e.buf)
      - opt:
          do:
            - set: e.buf
              value: append(e.buf, commentPrefix...)
          when: commented
      - set: e.buf
        to: appendKey
        value: appendKey(e.buf, ent.key)
      - set: e.buf
        value: append(e.buf, " = "...)
      - var:
          name: err
          type: error
      - set: e.buf, err
