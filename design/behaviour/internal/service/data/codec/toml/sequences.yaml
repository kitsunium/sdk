          do:
            - return: p.indexLookup(t, key)
              to: p.indexLookup
          when: p.nodes[t].flags&flagIndexed != 0
      - loop:
          cond: c != noNode
          do:
            - opt:
                do:
                  - return: c
                when: bytes.Equal(p.keyBytes(&p.nodes[c]), key)
          init: c := p.nodes[t].first
          post: c = p.nodes[c].next
