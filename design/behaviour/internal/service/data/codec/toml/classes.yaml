functions:
  - name: New
    results: codec.Codec
  - doc: unmarshal parses data and decodes it into v.
    name: unmarshal
    params: data []byte, v any
    results: error
  - doc: typeName names the type of v for a refusal.
    name: typeName
    params: v reflect.Value
    results: string
  - doc: |-
      quoteKey returns key as it would be written: bare when it can be, quoted
      otherwise.
    name: quoteKey
    params: key string
    results: string
  - doc: |-
      instantOf returns the time.Time of an offset date-time: in UTC for a zero
      offset, in a fixed zone otherwise.
    name: instantOf
    params: dt *datetime
    results: time.Time
  - doc: localTypeOf returns the local type a kind decodes to.
    name: localTypeOf
    params: k kind
    results: reflect.Type
  - doc: |-
      allocPointers follows the pointers of v, allocating the nil ones, and
      reports false past maxDepth of them: only a type that points to itself —
      type P *P — has a chain that long, and it never ends.
    name: allocPointers
    params: v reflect.Value
    results: reflect.Value, bool
  - doc: setIntKey parses raw as a decimal integer into the signed key.
    name: setIntKey
    params: key reflect.Value, raw []byte
    results: bool
  - doc: setUintKey parses raw as a decimal integer into the unsigned key.
    name: setUintKey
    params: key reflect.Value, raw []byte
    results: bool
  - doc: setFloatKey parses raw as a float into the float key.
    name: setFloatKey
    params: key reflect.Value, raw []byte
    results: bool
  - doc: encodeDocument appends the document v encodes to dst.
    name: encodeDocument
    params: dst []byte, v any
    results: "[]byte, error"
  - doc: |-
      resolve follows pointers and interfaces to a concrete value, and reports
      false when one of them is nil.
    name: resolve
    params: v reflect.Value
    results: reflect.Value, bool
  - doc: |-
      nilOrLoop names why a value resolve gave up on has no representation: the
      chain ended in nil, or it was still a non-nil pointer when resolve stopped
      following it.
    name: nilOrLoop
    params: v reflect.Value
    results: string
  - doc: encodeFail returns MARSHAL_FAILED naming problem and the Go type concerned.
    name: encodeFail
    params: problem string, t reflect.Type
    results: error
  - doc: appendComment writes each line of comment as a TOML comment.
    name: appendComment
    params: b []byte, comment string
    results: "[]byte"
  - doc: cutLine splits s at its first newline.
    name: cutLine
    params: s string
    results: line, rest string, found bool
  - doc: |-
      commentLines prefixes every line after the first of b[start:] with the
      comment prefix.
    name: commentLines
    params: b []byte, start int
    results: "[]byte"
  - doc: |-
      isArrayOfTables reports whether v is a non-empty slice or array whose every
      element is a map or a struct.
    name: isArrayOfTables
    params: v reflect.Value
    results: bool
  - doc: structEntries appends the fields of struct v that are written.
    name: structEntries
    params: entries []entry, v reflect.Value, info *typeInfo
    results: "[]entry"
  - doc: |-
      fieldOf returns the field of v at index, reporting false when a nil
      embedded pointer is on the way.
    name: fieldOf
    params: v reflect.Value, index []int
    results: reflect.Value, bool
  - doc: |-
      omitted reports whether a struct field is left out: a nil pointer, map or
      interface always, an empty or zero value when the tag says so.
    name: omitted
    params: v reflect.Value, opts fieldOptions
    results: bool
  - doc: |-
      nilToZero returns the zero value of a nil pointer's element, and any other
      value unchanged.
    name: nilToZero
    params: v reflect.Value
    results: reflect.Value
  - doc: |-
      keyClash refuses sorted entries with two equal keys, which a map whose keys
      are written alike — two TextMarshalers, say — produces.
    name: keyClash
    params: entries []entry, t reflect.Type
    results: error
  - doc: mapKeyString returns the TOML key a map key is written as.
    name: mapKeyString
    params: k reflect.Value
    results: string, error
  - doc: |-
      isEmpty implements omitempty: false, 0, "", a nil pointer or interface, an
      empty array, slice or map, a zero time or local value, and a struct whose
      every written field is empty.
    name: isEmpty
    params: v reflect.Value
    results: bool
  - doc: |-
      isEmptyStruct reports whether struct v is empty: a value-like struct when it
      is its zero, a table when every field it would write is empty.
    name: isEmptyStruct
    params: v reflect.Value
    results: bool
  - doc: |-
      isZero implements omitzero: the type's own IsZero when it has one, the
      reflect zero otherwise.
    name: isZero
    params: v reflect.Value
    results: bool
  - doc: |-
      appendFloat writes a float as the previous library wrote it: inf, -inf,
      nan, or the shortest decimal that round-trips, with ".0" when it has
      neither a fraction nor an exponent.
    name: appendFloat
    params: b []byte, f float64, bits int
    results: "[]byte"
  - doc: appendScalar writes a boolean, an integer or a float.
    name: appendScalar
    params: b []byte, v reflect.Value
    results: "[]byte, error"
  - doc: |-
      appendUint writes an unsigned integer, refusing one TOML's signed 64-bit
      integers cannot hold.
    name: appendUint
    params: b []byte, v reflect.Value
    results: "[]byte, error"
  - doc: |-
      appendSpecial writes time.Time as an offset date-time and the local types
      as their own text.
    name: appendSpecial
    params: b []byte, v reflect.Value
    results: "[]byte"
  - doc: valueOf returns the T that v holds, without boxing a copy of it.
    name: valueOf
    params: v reflect.Value
    results: T
    typeParams: T any
  - doc: appendMarshaledText writes the text a TextMarshaler returns, as a string.
    name: appendMarshaledText
    params: b []byte, v reflect.Value, info *typeInfo
    results: "[]byte, error"
  - doc: |-
      marshalText calls the MarshalText method of v, through a copy's address when
      only *T has it and v has none.
    name: marshalText
    params: v reflect.Value, info *typeInfo
    results: "[]byte, error"
  - doc: |-
      appendStringValue writes a string: multi-line when multiline asks for it
      and the string has a newline, literal when it can be, basic otherwise. A
      string that is not UTF-8 is refused: TOML cannot carry it, and replacing
      its bytes would write a value the caller did not hold.
    name: appendStringValue
    params: b []byte, s string, multiline bool
    results: "[]byte, error"
  - doc: "appendKey writes a key: bare when every byte allows it, quoted otherwise."
    name: appendKey
    params: b []byte, key string
    results: "[]byte"
  - doc: isBareKey reports whether key can be written without quotes.
    name: isBareKey
    params: key string
    results: bool
  - doc: |-
      appendString writes s as a literal string when it can be one — no
      apostrophe, no control character, valid UTF-8 — and as a basic string
      otherwise.
    name: appendString
    params: b []byte, s string
    results: "[]byte"
  - doc: |-
      canBeLiteral reports whether s, which is valid UTF-8, can be written as a
      literal string.
    name: canBeLiteral
    params: s string
    results: bool
  - doc: |-
      appendBasicString writes s, which is valid UTF-8, as a basic string. Every
      string and key is checked before it gets here, so a byte past ASCII is part
      of a character and is copied as it is.
    name: appendBasicString
    params: b []byte, s string
    results: "[]byte"
  - doc: |-
      appendEscapedByte writes one ASCII byte of a basic string, escaped when it
      must be.
    name: appendEscapedByte
    params: b []byte, c byte
    results: "[]byte"
  - doc: appendUnicodeEscape writes \u00XX for byte c.
    name: appendUnicodeEscape
    params: b []byte, c byte
    results: "[]byte"
  - doc: |-
      appendMultilineString writes s as a multi-line basic string: newlines and
      tabs as they are, a run of three or more quotes escaped quote by quote.
    name: appendMultilineString
    params: b []byte, s string
    results: "[]byte"
  - doc: quoteRunLength returns how many quotes start at s[i].
    name: quoteRunLength
    params: s string, i int
    results: int
  - doc: |-
      appendQuoteRun writes a run of quotes inside a multi-line string: as they
      are when there are fewer than three, escaped otherwise.
    name: appendQuoteRun
    params: b []byte, run int
    results: "[]byte"
  - doc: |-
      appendMultilineByte writes one byte of a multi-line basic string: newlines
      and tabs as they are, other control characters and the backslash escaped.
    name: appendMultilineByte
    params: b []byte, c byte
    results: "[]byte"
  - doc: containsByte reports whether s contains c.
    name: containsByte
    params: s string, c byte
    results: bool
  - doc: appendSeparator writes what precedes element i of an array.
    name: appendSeparator
    params: b []byte, i int, multiline bool
    results: "[]byte"
  - doc: appendPadded appends v in decimal, zero-padded to width.
    name: appendPadded
    params: b []byte, v, width int
    results: "[]byte"
  - doc: |-
      appendFraction appends the fraction of a second: precision digits, or the
      fewest that keep nanosecond when precision is 0.
    name: appendFraction
    params: b []byte, nanosecond, precision int
    results: "[]byte"
  - doc: parseExactly parses text as exactly one value of kind want into dt.
    name: parseExactly
    params: text []byte, dt *datetime, want kind
    results: error
  - doc: localDateOf returns the date part of dt.
    name: localDateOf
    params: dt *datetime
    results: LocalDate
  - doc: localTimeOf returns the time part of dt.
    name: localTimeOf
    params: dt *datetime
    results: LocalTime
  - doc: daysIn returns the number of days of month in year.
    name: daysIn
    params: month, year int
    results: int
  - doc: isLeap reports whether year is a Gregorian leap year.
    name: isLeap
    params: year int
    results: bool
  - doc: signOf returns -1 for a negative sign and 1 otherwise.
    name: signOf
    params: negative bool
    results: int
  - doc: |-
      radixBits returns the bits per digit the radix mark c announces, or 0 when c
      is no radix mark. The marks are lowercase only (§Integer).
    name: radixBits
    params: c byte
    results: uint
  - doc: |-
      radixClass returns the byte class of the digits of the radix whose digits
      carry bits bits.
    name: radixClass
    params: bits uint
    results: uint16
  - doc: |-
      fastFloat converts a decimal float with Clinger's exact method when it
      applies: a significand of at most 53 bits and a power of ten float64 holds
      exactly. It reports false otherwise, and the caller defers to strconv.
    name: fastFloat
    params: b []byte
    results: float64, bool
  - doc: |-
      significandOf reads the digits and the fractional digits of a float into a
      significand, and returns the power of ten the fraction implies and what
      follows.
    name: significandOf
    params: b []byte
    results: significand uint64, exponent int, rest []byte, ok bool
  - doc: exponentOf reads an exponent, "e" or "E" then a signed integer, or nothing.
    name: exponentOf
    params: b []byte
    results: int, bool
  - doc: hexValue returns the value of the hexadecimal digit c.
    name: hexValue
    params: c byte
    results: byte
  - doc: redefinitionProblem names why a [header] cannot define the existing node n.
    name: redefinitionProblem
    params: n *node
    results: string
  - doc: isBareKeyByte reports whether c may appear in a bare key.
    name: isBareKeyByte
    params: c byte
    results: bool
  - doc: leaf returns a node of kind k keyed part, ready for the scalar it holds.
    name: leaf
    params: k kind, part keyPart, at int
    results: node
  - doc: |-
      estimateNodes estimates the nodes data will need: each key-value has its
      '=', each array element its '[' or ',', each header its '['. Separators
      inside strings overcount; dotted keys undercount; both are bounded by the
      caller.
    name: estimateNodes
    params: data []byte
    results: int
  - doc: |-
      position returns the 1-based line and column of offset at in data, the
      column counted in characters.
    name: position
    params: data []byte, at int
    results: line, column int
  - doc: keyHash hashes key in table t.
    name: keyHash
    params: t int32, key []byte
    results: uint64
  - doc: infoOf returns the cached typeInfo of t, computing it on first use.
    name: infoOf
    params: t reflect.Type
    results: "*typeInfo"
  - doc: describe computes the typeInfo of t.
    name: describe
    params: t reflect.Type
    results: "*typeInfo"
  - doc: |-
      methodFlags returns the roles t plays through the methods it, or its
      pointer, has, and whether it is one of the types written specially.
    name: methodFlags
    params: t reflect.Type
    results: typeFlags
  - doc: flagIf returns flag when cond holds, and no flag otherwise.
    name: flagIf
    params: cond bool, flag typeFlags
    results: typeFlags
  - doc: |-
      structFields returns the fields of struct t in declaration order,
      flattening embedded structs as encoding/json does. Of two fields with one
      key, the shallower wins, and at equal depth the first declared.
    name: structFields
    params: t reflect.Type
    results: "[]fieldPlan"
  - doc: |-
      collectFields appends the fields of t, reached through index, to fields.
      visited stops a struct that embeds itself through a pointer.
    name: collectFields
    params: fields *[]fieldPlan, t reflect.Type, index []int, depth int, visited map[reflect.Type]bool
  - doc: |-
      embeddedStruct returns the struct type an anonymous field embeds, directly
      or through a pointer, or nil.
    name: embeddedStruct
    params: f reflect.StructField
    results: reflect.Type
  - doc: parseTag splits a toml tag into its name and options.
    name: parseTag
    params: tag string
    results: name string, opts fieldOptions
  - doc: |-
      applyOption records one tag option; an unknown one is ignored, as the
      previous library ignored it.
    name: applyOption
    params: opts *fieldOptions, opt string
  - doc: |-
      standaloneTags applies the standalone multiline:"true", inline:"true" and
      commented:"true" tags and the comment tag.
    name: standaloneTags
    params: tag reflect.StructTag, opts fieldOptions
    results: fieldOptions
  - doc: |-
      fieldIndexes builds the exact and the case-folded key indexes of fields.
      The first field to claim a folded key keeps it.
    name: fieldIndexes
    params: fields []fieldPlan
    results: exact, folded map[string]int
  - doc: isASCII reports whether b is ASCII.
    name: isASCII
    params: b []byte
    results: bool
  - doc: buildByteClass computes byteClass.
    name: buildByteClass
    results: "[byteValues]uint16"
  - doc: markRange adds cls to every byte from first to last.
    name: markRange
    params: table *[byteValues]uint16, first, last byte, cls uint16
imports:
  bytes: bytes
  cmp: cmp
  codec: github.com/kitsunium/sdk/internal/core/data/codec
  coretoml: github.com/kitsunium/sdk/internal/core/data/codec/toml
  encoding: encoding
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  io: io
  maphash: hash/maphash
  math: math
  recycler: github.com/kitsunium/sdk/internal/kernel/concur/recycler
  reflect: reflect
  scratch: github.com/kitsunium/sdk/internal/core/data/codec/scratch
  slices: slices
  strconv: strconv
  strings: strings
  sync: sync
  time: time
  utf8: unicode/utf8
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/toml
  name: toml
  purpose: Package toml is the TOML codec, written against TOML v1.0.0 (https://toml.io/en/v1.0.0) with the standard library alone.
types:
  - doc: tomlCodec is the concrete Codec implementation for TOML.
    kind: struct
    methods:
      - doc: Name implements codec.Codec.
        name: Name
        recv: "*tomlCodec"
        results: string
      - doc: MIMETypes lists every MIME alias.
        name: MIMETypes
        recv: "*tomlCodec"
        results: "[]string"
      - doc: Extensions lists every file extension.
        name: Extensions
        recv: "*tomlCodec"
        results: "[]string"
      - doc: |-
          Marshal serialises v, a map or a struct, as a TOML document. The document is
          written into a buffer from the shared codec pool and returned as a copy of
          exactly its length.
        name: Marshal
        params: v any
        recv: "*tomlCodec"
        results: encoded []byte, err error
      - doc: Unmarshal parses data as a TOML document into v, a non-nil pointer.
        name: Unmarshal
        params: data []byte, v any
        recv: "*tomlCodec"
        results: error
      - doc: |-
          Append encodes v as a TOML document directly onto dst. Implements the
          optional codec.Appender interface; on failure dst is returned with its
          length unchanged.
        name: Append
        params: dst []byte, v any
        recv: "*tomlCodec"
        results: appended []byte, err error
      - doc: |-
          NewEncoder returns a streaming codec.Encoder writing one document to w per
          Encode call.
        name: NewEncoder
        params: w io.Writer
        recv: "*tomlCodec"
        results: codec.Encoder
      - doc: NewDecoder returns a streaming codec.Decoder reading r as one document.
        name: NewDecoder
        params: r io.Reader
        recv: "*tomlCodec"
        results: codec.Decoder
    name: tomlCodec
  - doc: decoder writes one parsed tree into Go values.
    fields:
      - doc: p holds the tree.
        name: p
        type: "*parser"
    kind: struct
    methods:
      - doc: |-
          root decodes the root table into the target, natively for the two untyped
          targets every config source and catalogue loader passes.
        name: root
        params: v any, target reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          anyInto returns the table n as an untyped value, merged into existing when
          existing is already a map[string]any.
        name: anyInto
        params: n int32, existing any
        recv: d *decoder
        results: any
      - doc: |-
          mergeTable writes the children of table t into m: a table a header or a
          dotted key defined is merged into a map already there; an inline table,
          like any other value, replaces what was there — the replaced library's rule.
        name: mergeTable
        params: t int32, m map[string]any
        recv: d *decoder
      - doc: |-
          merges reports whether node c merges into a map its target already holds:
          a table a header or a dotted key defined does; an inline table is
          self-contained and replaces it, as every other value does.
        name: merges
        params: c int32
        recv: d *decoder
        results: bool
      - doc: |-
          keyString returns the key of node c as a string, never one aliasing the
          parser's buffers, which the next document reuses.
        name: keyString
        params: c int32
        recv: d *decoder
        results: string
      - doc: anyTable returns table t as a map[string]any.
        name: anyTable
        params: t int32
        recv: d *decoder
        results: map[string]any
      - doc: anyArray returns array n, static or of tables, as a []any.
        name: anyArray
        params: n int32
        recv: d *decoder
        results: "[]any"
      - doc: |-
          anyValue returns node n as the untyped Go value a TOML value decodes to:
          map[string]any, []any, string, int64, float64, bool, time.Time,
          LocalDateTime, LocalDate or LocalTime.
        name: anyValue
        params: n int32
        recv: d *decoder
        results: any
      - doc: |-
          fail returns UNMARSHAL_FAILED for node n, naming problem, the node's dotted
          key and line, and the kind of value and the Go type when they are known.
        name: fail
        params: n int32, problem string, target reflect.Type
        recv: d *decoder
        results: error
      - doc: keyPath returns the dotted key of node n, its array elements left out.
        name: keyPath
        params: n int32
        recv: d *decoder
        results: string
      - doc: quotedKey returns the key of node c as it would be written.
        name: quotedKey
        params: c int32
        recv: d *decoder
        results: string
      - doc: scalarAny returns the untyped Go value of a scalar node.
        name: scalarAny
        params: node *node
        recv: d *decoder
        results: any
      - doc: localAny returns the untyped Go value of a local date, time or date-time.
        name: localAny
        params: node *node
        recv: d *decoder
        results: any
      - doc: |-
          scalar decodes the scalar node n into v: into a kind that holds it, else
          through the type's UnmarshalText, else refused — the precedence the replaced
          library had, so a string-kinded type with an UnmarshalText is still set
          directly from a TOML string.
        name: scalar
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          native assigns a string, an integer, a float or a boolean to v when v's
          kind holds it, and reports whether it did: a value out of the kind's range
          is refused there; any other kind is left to the caller.
        name: native
        params: n int32, v reflect.Value
        recv: d *decoder
        results: held bool, err error
      - doc: setString assigns a string to a string kind, and reports whether v was one.
        name: setString
        params: n int32, v reflect.Value
        recv: d *decoder
        results: bool
      - doc: |-
          setInteger assigns an integer to a signed, unsigned or float kind, and
          reports whether v was one; a value out of the kind's range is refused.
        name: setInteger
        params: n int32, v reflect.Value
        recv: d *decoder
        results: held bool, err error
      - doc: |-
          setFloat assigns f to a float kind, and reports whether v was one; a finite
          value float32 cannot hold is refused.
        name: setFloat
        params: n int32, v reflect.Value, f float64
        recv: d *decoder
        results: held bool, err error
      - doc: setBool assigns a boolean to a bool kind, and reports whether v was one.
        name: setBool
        params: n int32, v reflect.Value
        recv: d *decoder
        results: bool
      - doc: |-
          temporal decodes a date or time node into time.Time or one of the local
          types. A local value goes into a time.Time in time.Local; an offset
          date-time goes into time.Time only, since a local type would drop its
          offset.
        name: temporal
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          asTime returns a date or time of kind k as a time.Time: an offset date-time
          at its offset, a local one in time.Local, a local time on January 1st of
          year 0.
        name: asTime
        params: k kind, dt *datetime
        recv: d *decoder
        results: time.Time
      - doc: |-
          wrapFail returns UNMARSHAL_FAILED for node n with the error a target's own
          UnmarshalText returned underneath.
        name: wrapFail
        params: n int32, cause error, target reflect.Type
        recv: d *decoder
        results: error
      - doc: value decodes node n into v.
        name: value
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          intoInterface stores node n into the interface v: the untyped value, merged
          into a map v already holds when n is a table.
        name: intoInterface
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          table decodes table n into v: a struct, a map, or — as the replaced
          library allowed — a slice, whose last element the table goes into (one is
          appended to an empty slice), or an array, whose first element it goes into
          when the table is only passed through on the way to a deeper one.
        name: table
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          tableIntoSlice decodes table n into the last element of slice v, appending
          a zero one to an empty slice. An inline table is a value, which a slice
          cannot hold.
        name: tableIntoSlice
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          tableIntoArray decodes table n into the first element of array v, when n
          is a table a longer header or a dotted key passed through. A table defined
          by its own header, or inline, cannot be stored in an array: the replaced
          library refused both.
        name: tableIntoArray
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          structFields decodes each key of table n into the field of struct v it
          names. A key no field names is ignored.
        name: structFields
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          field returns the field of v at index, allocating the embedded pointers on
          the way.
        name: field
        params: c int32, v reflect.Value, index []int
        recv: d *decoder
        results: reflect.Value, error
      - doc: |-
          mapEntries decodes each key of table n into an entry of map v. An entry
          already there is decoded into, so a standard table merges into the map it
          meets; an inline table is self-contained and starts from an empty map.
        name: mapEntries
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          mapKey converts the key of node c into key, a value of the map's key type:
          a string kind, an integer or a float spelled in decimal, or — for any other
          kind — a type whose pointer implements encoding.TextUnmarshaler. The kinds
          come first, as they did in the replaced library.
        name: mapKey
        params: c int32, key reflect.Value
        recv: d *decoder
        results: error
      - doc: |-
          textKey converts a key through the key type's UnmarshalText, refusing a
          type that has none.
        name: textKey
        params: c int32, key reflect.Value, raw []byte
        recv: d *decoder
        results: error
      - doc: unmarshalText hands raw to the UnmarshalText of v, which is addressable.
        name: unmarshalText
        params: c int32, v reflect.Value, raw []byte
        recv: d *decoder
        results: error
      - doc: |-
          array decodes array n, static or of tables, into v: a slice, which is
          replaced, or an array, filled from the start — as the replaced library
          filled one: elements past a static array's length are dropped, an array of
          tables longer than it is refused, and elements the document does not reach
          are left as they were.
        name: array
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
      - doc: elements decodes the elements of array n into the first elements of v.
        name: elements
        params: n int32, v reflect.Value
        recv: d *decoder
        results: error
    name: decoder
  - doc: |-
      tomlDecoder reads its reader as one document. TOML has no separator between
      documents, so the first Decode consumes the stream and every later one
      returns io.EOF; the sticky done latch makes More report false from then on.
    fields:
      - doc: r is the document.
        name: r
        type: io.Reader
      - doc: done is set by the first Decode, whatever it returned.
        name: done
        type: bool
    kind: struct
    methods:
      - doc: Decode reads the whole document into v.
        name: Decode
        params: v any
        recv: d *tomlDecoder
        results: error
      - doc: More reports whether a Decode call would produce another document.
        name: More
        recv: d *tomlDecoder
        results: bool
    name: tomlDecoder
  - doc: entry is one key of a table being encoded.
    fields:
      - doc: key is the TOML key.
        name: key
        type: string
      - doc: value is the Go value.
        name: value
        type: reflect.Value
      - doc: opts are the struct tag's options, zero for a map entry.
        name: opts
        type: fieldOptions
    kind: struct
    name: entry
  - doc: encoder writes one document. It is pooled with its scratch slices.
    fields:
      - doc: buf is the document being written.
        name: buf
        type: "[]byte"
      - doc: keys is the dotted key of the table being written.
        name: keys
        type: "[]string"
      - doc: free holds entry slices for reuse, one per table level in flight.
        name: free
        type: "[][]entry"
      - doc: depth is how many tables and arrays enclose the value being written.
        name: depth
        type: int32
      - doc: |-
          hops is how many pointers and interfaces enclose the value being
          written.
        name: hops
        type: int32
      - doc: lastWasHeader says the last line written was a table header.
        name: lastWasHeader
        type: bool
    kind: struct
    methods:
      - doc: reset empties the encoder for the next document.
        name: reset
        recv: e *encoder
      - doc: retained is the entry capacity the encoder would keep in the pool.
        name: retained
        recv: e *encoder
        results: int
      - doc: |-
          table writes the key-values of table v, a map or a struct, then its
          sub-tables and arrays of tables under their headers.
        name: table
        params: v reflect.Value, commented bool
        recv: e *encoder
        results: error
      - doc: keyValues writes every entry that is not a table.
        name: keyValues
        params: entries []entry, commented bool
        recv: e *encoder
        results: error
      - doc: |-
          subTables writes every entry that is a table or an array of tables, each
          under its header.
        name: subTables
        params: entries []entry, commented bool
        recv: e *encoder
        results: error
      - doc: |-
          subTable writes one table entry: a [header] and its table, or one
          [[header]] and table per element of an array of tables.
        name: subTable
        params: ent *entry, commented bool
        recv: e *encoder
        results: error
      - doc: |-
          arrayOfTables writes each element of v under its own [[header]]. The comment
          is written above the first only.
        name: arrayOfTables
        params: v reflect.Value, comment string, commented bool
        recv: e *encoder
        results: error
      - doc: |-
          header writes a [table] or [[array of tables]] header for the current key,
          after an empty line unless it follows another header or opens the document.
        name: header
        params: comment string, commented, array bool
        recv: e *encoder
      - doc: keyValue writes one key = value line.
        name: keyValue
        params: ent *entry, commented bool
        recv: e *encoder
        results: error
      - doc: |-
          isTable reports whether an entry is written under a header: a map or a
          struct, or a non-empty array whose every element is one, unless the field
          asked to be inline.
        name: isTable
        params: ent *entry
        recv: e *encoder
        results: bool
      - doc: |-
          collect returns the entries of table v: a struct's fields, nil ones and the
          ones the tag omits left out, or a map's entries sorted by key.
        name: collect
        params: v reflect.Value
        recv: e *encoder
        results: "[]entry, error"
      - doc: acquire returns an empty entry slice, reused when one is free.
        name: acquire
        recv: e *encoder
        results: "[]entry"
      - doc: release returns an entry slice for reuse.
        name: release
        params: s []entry
        recv: e *encoder
      - doc: |-
          mapEntries appends the entries of map v, sorted by key, leaving out nil
          interface values; a nil pointer is written as its type's zero value.
        name: mapEntries
        params: entries []entry, v reflect.Value
        recv: e *encoder
        results: "[]entry, error"
      - doc: appendValue writes v as a TOML value.
        name: appendValue
        params: b []byte, v reflect.Value, opts fieldOptions
        recv: e *encoder
        results: "[]byte, error"
      - doc: |-
          appendIndirect writes what a pointer or an interface holds: a nil pointer
          as its type's zero value, as the previous library wrote it; a nil interface
          is refused, having no type to take a zero value from. Each level goes back
          through appendValue, which may find a TextMarshaler there, and the levels
          are counted, so a pointer that refers to itself is refused rather than
          followed until the stack runs out.
        name: appendIndirect
        params: b []byte, v reflect.Value, opts fieldOptions
        recv: e *encoder
        results: "[]byte, error"
      - doc: |-
          appendArray writes a slice or an array: on one line, or one element per
          line when multiline asks for it. Elements are written with no options: a
          table among them is an inline table.
        name: appendArray
        params: b []byte, v reflect.Value, multiline bool
        recv: e *encoder
        results: "[]byte, error"
      - doc: |-
          appendInlineTable writes a map or a struct as an inline table, on one line:
          its strings single-line whatever the field's tag, its tables inline too.
        name: appendInlineTable
        params: b []byte, v reflect.Value
        recv: e *encoder
        results: "[]byte, error"
    name: encoder
  - doc: |-
      tomlEncoder writes each value Encode is given as a document of its own.
      Consecutive documents are written one after the other: TOML has no
      separator between documents, so a reader reads the stream as one, which
      fails if two of them define the same key.
    fields:
      - doc: w receives each document.
        name: w
        type: io.Writer
    kind: struct
    methods:
      - doc: Encode writes v as one TOML document to the writer.
        name: Encode
        params: v any
        recv: e *tomlEncoder
        results: error
      - doc: |-
          Close is a no-op: the encoder buffers nothing between documents and does
          not own the writer.
        name: Close
        recv: "*tomlEncoder"
        results: error
    name: tomlEncoder
  - fields:
      - doc: Year is the calendar year.
        name: Year
        type: int
      - doc: Month is 1 to 12.
        name: Month
        type: int
      - doc: Day is 1 to 31.
        name: Day
        type: int
    kind: struct
    methods:
      - name: AsTime
        params: zone *time.Location
        recv: d LocalDate
        results: time.Time
      - name: String
        recv: d LocalDate
        results: string
      - name: MarshalText
        recv: d LocalDate
        results: "[]byte, error"
      - name: UnmarshalText
        params: text []byte
        recv: d *LocalDate
        results: error
      - doc: appendText appends the day to b.
        name: appendText
        params: b []byte
        recv: d LocalDate
        results: "[]byte"
    name: LocalDate
  - fields:
      - doc: Hour is 0 to 23.
        name: Hour
        type: int
      - doc: Minute is 0 to 59.
        name: Minute
        type: int
      - doc: Second is 0 to 59.
        name: Second
        type: int
      - doc: Nanosecond is 0 to 999 999 999.
        name: Nanosecond
        type: int
      - doc: |-
          Precision is how many fractional digits String writes: as many as the
          document had, up to nine. Zero writes the fewest that keep
          Nanosecond.
        name: Precision
        type: int
    kind: struct
    methods:
      - name: String
        recv: t LocalTime
        results: string
      - name: MarshalText
        recv: t LocalTime
        results: "[]byte, error"
      - name: UnmarshalText
        params: text []byte
        recv: t *LocalTime
        results: error
      - doc: appendText appends the time to b.
        name: appendText
        params: b []byte
        recv: t LocalTime
        results: "[]byte"
    name: LocalTime
  - fields:
      - name: ""
        role: embedded
        type: LocalDate
      - name: ""
        role: embedded
        type: LocalTime
    kind: struct
    methods:
      - name: AsTime
        params: zone *time.Location
        recv: dt LocalDateTime
        results: time.Time
      - name: String
        recv: dt LocalDateTime
        results: string
      - name: MarshalText
        recv: dt LocalDateTime
        results: "[]byte, error"
      - name: UnmarshalText
        params: text []byte
        recv: dt *LocalDateTime
        results: error
      - doc: appendText appends the date-time to b.
        name: appendText
        params: b []byte
        recv: dt LocalDateTime
        results: "[]byte"
    name: LocalDateTime
  - doc: datetime is the parsed value of any of the four date and time kinds.
    fields:
      - doc: year is the calendar year.
        name: year
        type: int
      - doc: month is 1 to 12.
        name: month
        type: int
      - doc: day is 1 to 31.
        name: day
        type: int
      - doc: hour is 0 to 23.
        name: hour
        type: int
      - doc: minute is 0 to 59.
        name: minute
        type: int
      - doc: second is 0 to 59.
        name: second
        type: int
      - doc: nanosecond is the fraction, truncated to nine digits.
        name: nanosecond
        type: int
      - doc: precision is how many fractional digits were written, up to nine.
        name: precision
        type: int
      - doc: offset is the offset date-time's zone, in seconds east of UTC.
        name: offset
        type: int
    kind: struct
    name: datetime
  - doc: |-
      parser reads one document into its tree. It is pooled: every slice keeps
      its capacity from one document to the next.
    fields:
      - doc: data is the document.
        name: data
        type: "[]byte"
      - doc: nodes is the arena; nodes[0] is the root table.
        name: nodes
        type: "[]node"
      - doc: unescaped holds the strings and keys that had escape sequences.
        name: unescaped
        type: "[]byte"
      - doc: times holds the date-times nodes point to.
        name: times
        type: "[]datetime"
      - doc: parts is the key being read.
        name: parts
        type: "[]keyPart"
      - doc: |-
          index finds a key in a wide table: a hash of the table and the key to
          the first node of its bucket.
        name: index
        type: map[uint64]int32
      - doc: keys interns the keys decoded as Go strings, across documents.
        name: keys
        type: map[string]string
      - doc: internedBytes counts the bytes keys holds, for the retain decision.
        name: internedBytes
        type: int
      - doc: pos is the offset of the next byte to read.
        name: pos
        type: int
      - doc: current is the table key-value lines are added to.
        name: current
        type: int32
    kind: struct
    methods:
      - doc: |-
          numberOrDate reads a value that starts like a number: an integer, a float,
          or a date or a time, which start with four digits and a dash or two digits
          and a colon.
        name: numberOrDate
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: digitsThen reports whether count digits then the byte mark start at p.pos.
        name: digitsThen
        params: count int, mark byte
        recv: p *parser
        results: bool
      - doc: dateTimeValue reads one of the four date and time kinds.
        name: dateTimeValue
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: |-
          dateTime reads a date and time into dt and returns which of the four kinds
          it is.
        name: dateTime
        params: dt *datetime
        recv: p *parser
        results: kind, error
      - doc: date reads YYYY-MM-DD and checks that the day exists.
        name: date
        params: dt *datetime
        recv: p *parser
        results: error
      - doc: |-
          timeDelimiter consumes the T, t or space between a date and a time, and
          reports whether a time follows. A space is a delimiter only before a digit:
          otherwise it is the whitespace after a local date.
        name: timeDelimiter
        recv: p *parser
        results: bool
      - doc: |-
          timeOfDay reads HH:MM:SS with an optional fraction. Seconds may be left out
          — TOML v1.1.0, which the previous library accepted — and a fraction then
          cannot follow.
        name: timeOfDay
        params: dt *datetime
        recv: p *parser
        results: error
      - doc: |-
          secondFraction reads the optional fraction of a second, truncated to the
          nanosecond, and reports whether it was well formed.
        name: secondFraction
        params: dt *datetime
        recv: p *parser
        results: bool
      - doc: |-
          offset reads Z, z, or ±HH:MM into dt and reports whether there was one.
          offsetError then says whether it was well formed.
        name: offset
        params: dt *datetime
        recv: p *parser
        results: bool
      - doc: offsetError refuses the offset offset marked as malformed.
        name: offsetError
        params: dt *datetime
        recv: p *parser
        results: error
      - doc: |-
          fixed reads exactly width digits, then the separator sep unless sep is 0,
          and returns their value.
        name: fixed
        params: width int, sep byte
        recv: p *parser
        results: int, bool
      - doc: numberValue reads an integer or a float.
        name: numberValue
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: number reads a number from p.pos and returns its kind and its value's bits.
        name: number
        recv: p *parser
        results: k kind, bits uint64, err error
      - doc: hasRadixPrefix reports whether 0x, 0o or 0b starts at p.pos.
        name: hasRadixPrefix
        recv: p *parser
        results: bool
      - doc: specialFloat reads inf or nan, after an optional sign starting at start.
        name: specialFloat
        params: start int
        recv: p *parser
        results: kind, uint64, error
      - doc: |-
          radixInteger reads a hexadecimal, octal or binary integer. Its value must
          fit a signed 64-bit integer: TOML's integers are signed, and the spelling
          carries no sign (§Integer).
        name: radixInteger
        recv: p *parser
        results: kind, uint64, error
      - doc: |-
          digits advances over a non-empty run of digits of class cls in which every
          underscore stands between two digits.
        name: digits
        params: cls uint16
        recv: p *parser
        results: error
      - doc: |-
          decimal reads a decimal integer or a float whose sign, if any, started at
          start.
        name: decimal
        params: start int
        recv: p *parser
        results: kind, uint64, error
      - doc: |-
          fraction reads the optional fractional part and exponent of a float, and
          reports whether there was either.
        name: fraction
        recv: p *parser
        results: isFloat bool, err error
      - doc: |-
          integerOf converts a decimal integer token, refusing one past the range of
          a signed 64-bit integer (§Integer: "an error must be thrown").
        name: integerOf
        params: at int, token []byte
        recv: p *parser
        results: kind, uint64, error
      - doc: |-
          floatOf converts a float token whose grammar has been checked. A value too
          large for float64 is refused; one too small rounds to zero, as IEEE 754
          does.
        name: floatOf
        params: at int, token []byte
        recv: p *parser
        results: kind, uint64, error
      - doc: stringValue reads a string value of any of the four spellings.
        name: stringValue
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: hasTriple reports whether three quote characters start at p.pos.
        name: hasTriple
        params: quote byte
        recv: p *parser
        results: bool
      - doc: |-
          singleLineString reads a basic or literal string on one line, from its
          opening quote, and reports whether its value lives in the unescape buffer.
        name: singleLineString
        recv: p *parser
        results: value span, escaped bool, err error
      - doc: |-
          literalString reads a literal string on one line: everything up to the next
          apostrophe, verbatim, except a newline or a control character other than
          the tab.
        name: literalString
        recv: p *parser
        results: span, error
      - doc: |-
          basicString reads a basic string on one line. A string with no escape
          sequence is returned in place; the first backslash moves the value to the
          unescape buffer.
        name: basicString
        recv: p *parser
        results: value span, escaped bool, err error
      - doc: |-
          basicEscaped continues a basic string at its first backslash, rebuilding the
          value in the unescape buffer from start.
        name: basicEscaped
        params: start int
        recv: p *parser
        results: span, error
      - doc: |-
          basicStep copies the byte c at p.pos, or the escape sequence or character
          it starts, to the unescape buffer.
        name: basicStep
        params: c byte
        recv: p *parser
        results: error
      - doc: |-
          escape unescapes the sequence at p.pos, which is a backslash, into the
          unescape buffer.
        name: escape
        recv: p *parser
        results: error
      - doc: |-
          hexEscape reads the digits hexadecimal digits of an escape that started at
          offset at, and appends the character they name.
        name: hexEscape
        params: at, digits int
        recv: p *parser
        results: error
      - doc: |-
          multilineString reads a multi-line string from its opening delimiter into
          the unescape buffer. quote is the delimiter's character: a quote for a
          basic string, whose escapes are interpreted, an apostrophe for a literal
          one, kept verbatim.
        name: multilineString
        params: quote byte
        recv: p *parser
        results: span, error
      - doc: |-
          multilineStep copies one piece of a multi-line string to the unescape
          buffer, and reports whether it was the closing delimiter.
        name: multilineStep
        params: quote byte
        recv: p *parser
        results: closed bool, err error
      - doc: |-
          multilineOther copies a newline, LF or CRLF, or a well-formed non-ASCII
          character, refusing a control character and a carriage return that does not
          end a line.
        name: multilineOther
        recv: p *parser
        results: error
      - doc: |-
          quoteRun reads a run of the delimiter's character inside a multi-line
          string. Fewer than three are content; three to five close the string, the
          ones before the last three being content; more is refused (§String: "up to
          two quotes may appear next to the closing delimiter").
        name: quoteRun
        params: quote byte
        recv: p *parser
        results: closed bool, err error
      - doc: |-
          multilineEscape handles a backslash in a multi-line basic string: a
          backslash that ends a line removes it and every whitespace and newline
          after it; any other is an escape sequence.
        name: multilineEscape
        recv: p *parser
        results: error
      - doc: |-
          header reads a [table] or [[array of tables]] header and makes its table
          the current one.
        name: header
        recv: p *parser
        results: error
      - doc: |-
          walkHeader follows the intermediate parts of a header from the root,
          creating the tables they imply, and returns the table the last part belongs
          to.
        name: walkHeader
        params: parts []keyPart
        recv: p *parser
        results: int32, error
      - doc: |-
          headerStep returns the table part names in t, creating it if it does not
          exist. A header may pass through any table but an inline one, and through
          an array of tables into its last element.
        name: headerStep
        params: t int32, part keyPart
        recv: p *parser
        results: int32, error
      - doc: openTable defines the table a [header] names.
        name: openTable
        params: parent int32, part keyPart, at int
        recv: p *parser
        results: error
      - doc: |-
          openArrayTable appends a new element to the array of tables a [[header]]
          names.
        name: openArrayTable
        params: parent int32, part keyPart, at int
        recv: p *parser
        results: error
      - doc: keyValue reads `key = value` and adds the value to table t.
        name: keyValue
        params: t int32
        recv: p *parser
        results: error
      - doc: |-
          walkDotted follows the intermediate parts of a dotted key from table t,
          creating the tables they define, and returns the table the last part
          belongs to.
        name: walkDotted
        params: t int32, parts []keyPart
        recv: p *parser
        results: int32, error
      - doc: consume advances over c if it is the next byte, and reports whether it was.
        name: consume
        params: c byte
        recv: p *parser
        results: bool
      - doc: key reads a simple or dotted key into p.parts, and the whitespace after it.
        name: key
        recv: p *parser
        results: error
      - doc: |-
          simpleKey reads one part of a key: bare, or a quoted basic or literal
          string on one line.
        name: simpleKey
        recv: p *parser
        results: keyPart, error
      - doc: |-
          value reads one value and adds it to parent under key part. parent is a
          table, with part its key, or an array, with noPart.
        name: value
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: boolValue reads true or false.
        name: boolValue
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: literal consumes word if the document continues with it.
        name: literal
        params: word string
        recv: p *parser
        results: bool
      - doc: |-
          array reads an array value: values separated by commas, with whitespace,
          newlines and comments allowed around each, and an optional trailing comma
          (§Array).
        name: array
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: |-
          afterElement consumes what follows an array element: a comma, after which
          another element or the closing bracket comes, or the closing bracket. It
          reports whether the array closed.
        name: afterElement
        recv: p *parser
        results: closed bool, err error
      - doc: |-
          skipBlank advances over whitespace, newlines and comments, where an array or
          an inline table allows them.
        name: skipBlank
        recv: p *parser
        results: error
      - doc: |-
          inlineTable reads an inline table: key-values between braces, separated by
          commas (§Inline Table). The table is closed once read: nothing later in the
          document may add to it.
        name: inlineTable
        params: parent int32, part keyPart
        recv: p *parser
        results: error
      - doc: |-
          afterPair consumes what follows a key-value of an inline table: the closing
          brace, or a comma and what follows it. It reports whether the table closed.
        name: afterPair
        recv: p *parser
        results: closed bool, err error
      - doc: |-
          inlineClose skips what may precede a closing brace and consumes the brace
          if it comes. Newlines and comments are allowed inside an inline table by
          TOML v1.1.0, not v1.0.0; they are accepted because the library this codec
          replaced accepted them, so no document that decoded before stops decoding.
        name: inlineClose
        recv: p *parser
        results: closed bool, err error
      - doc: reset empties the parser for the next document, keeping its capacity.
        name: reset
        recv: p *parser
      - doc: |-
          internKey returns key as a string, the same string every time while the
          parser's table holds it.
        name: internKey
        params: key []byte
        recv: p *parser
        results: string
      - doc: |-
          newKey turns key into a string and keeps it in the intern table when there
          is room for it.
        name: newKey
        params: key []byte
        recv: p *parser
        results: string
      - doc: retainedBytes is the memory the parser would keep in the pool.
        name: retainedBytes
        recv: p *parser
        results: int
      - doc: parse reads data into the parser's tree.
        name: parse
        params: data []byte
        recv: p *parser
        results: error
      - doc: |-
          expression reads one line: a table header, a key-value, a comment or
          nothing, then the end of the line.
        name: expression
        recv: p *parser
        results: error
      - doc: |-
          endOfLine consumes whitespace, an optional comment and the newline that end
          an expression, or the end of the document.
        name: endOfLine
        recv: p *parser
        results: error
      - doc: skipSpace advances over spaces and tabs.
        name: skipSpace
        recv: p *parser
      - doc: newline consumes one newline, LF or CRLF, and reports whether there was one.
        name: newline
        recv: p *parser
        results: bool
      - doc: |-
          comment consumes a comment up to, not including, its newline, refusing the
          control characters TOML forbids in one (§Comment).
        name: comment
        recv: p *parser
        results: error
      - doc: atNewline reports whether a newline, LF or CRLF, starts at p.pos.
        name: atNewline
        recv: p *parser
        results: bool
      - doc: |-
          skipRune advances over one well-formed UTF-8 character of two or more
          bytes, and refuses anything else with problem.
        name: skipRune
        params: problem string
        recv: p *parser
        results: error
      - doc: |-
          fail returns UNMARSHAL_FAILED locating problem at offset at. The problem is
          a fixed sentence: no byte of the document is ever copied into an error.
        name: fail
        params: at int, problem string
        recv: p *parser
        results: error
      - doc: |-
          newTable appends a table to parent and returns it, refusing a depth beyond
          maxDepth.
        name: newTable
        params: parent int32, part keyPart, from origin
        recv: p *parser
        results: int32, error
      - doc: keyBytes returns the key of node n.
        name: keyBytes
        params: n *node
        recv: p *parser
        results: "[]byte"
      - doc: textBytes returns the text of node n.
        name: textBytes
        params: n *node
        recv: p *parser
        results: "[]byte"
      - doc: partBytes returns the bytes of one key part.
        name: partBytes
        params: part keyPart
        recv: p *parser
        results: "[]byte"
      - doc: child returns the child of table t named key, or noNode.
        name: child
        params: t int32, key []byte
        recv: p *parser
        results: int32
      - doc: |-
          add appends n to the arena as the last child of parent and returns its
          index. The caller has checked the depth and the key.
        name: add
        params: parent int32, n node
        recv: p *parser
        results: int32
      - doc: indexTable moves every child of table t into the hash index.
        name: indexTable
        params: t int32
        recv: p *parser
      - doc: indexInsert puts node c in the bucket of its key.
        name: indexInsert
        params: c int32
        recv: p *parser
      - doc: indexLookup finds the child of table t named key through the hash index.
        name: indexLookup
        params: t int32, key []byte
        recv: p *parser
        results: int32
    name: parser
  - doc: kind is what a node holds.
    kind: named
    name: kind
    underlying: uint8
  - doc: |-
      origin is how a table came to exist, which decides what a later line of the
      document may still add to it (TOML v1.0.0 §Table, §Inline Table, §Array of
      Tables).
    kind: named
    name: origin
    underlying: uint8
  - doc: |-
      span is a run of bytes, located by offsets so that it stays valid while the
      buffer it points into grows. Whether it points into the document or into
      the unescape buffer is recorded by the node that owns it.
    fields:
      - doc: start is the offset of the first byte.
        name: start
        type: int32
      - doc: end is the offset after the last byte.
        name: end
        type: int32
    kind: struct
    name: span
  - doc: |-
      node is one table, array or value of a document. A node's children are a
      linked list, so that appending to a table or an array never moves another
      node.
    fields:
      - doc: |-
          num is the value of an integer (as int64 bits), a float (as float64
          bits) or a boolean (0 or 1), or the index of a date-time in the
          parser's date-time list.
        name: num
        type: uint64
      - doc: |-
          key is the name the node has in its parent table; empty for an array
          element and for the root.
        name: key
        type: span
      - doc: text is a string's value, or the token a scalar was written as.
        name: text
        type: span
      - doc: parent is the table or array that holds the node.
        name: parent
        type: int32
      - doc: first is the first child of a table or an array.
        name: first
        type: int32
      - doc: last is the last child of a table or an array.
        name: last
        type: int32
      - doc: next is the next child of the same parent.
        name: next
        type: int32
      - doc: hnext is the next node in the same bucket of the hash index.
        name: hnext
        type: int32
      - doc: count is how many children a table or an array has.
        name: count
        type: int32
      - doc: |-
          at is the offset in the document where the node was written, for a
          diagnostic.
        name: at
        type: int32
      - doc: depth is how many tables and arrays enclose the node.
        name: depth
        type: int32
      - doc: kind is what the node holds.
        name: kind
        type: kind
      - doc: origin is how a table came to exist.
        name: origin
        type: origin
      - doc: flags are flagKeyEscaped, flagTextEscaped and flagIndexed.
        name: flags
        type: uint8
    kind: struct
    name: node
  - doc: keyPart is one dotted part of a key, as the key parser read it.
    fields:
      - doc: name is the unescaped part.
        name: name
        type: span
      - doc: at is where the part starts in the document.
        name: at
        type: int32
      - doc: escaped says name lives in the unescape buffer.
        name: escaped
        type: bool
    kind: struct
    name: keyPart
  - doc: fieldOptions are the options of one struct field.
    fields:
      - doc: comment is written above the field.
        name: comment
        type: string
      - doc: omitEmpty drops an empty value.
        name: omitEmpty
        type: bool
      - doc: omitZero drops a zero value.
        name: omitZero
        type: bool
      - doc: inline writes a table inline.
        name: inline
        type: bool
      - doc: multiline writes strings and arrays across lines.
        name: multiline
        type: bool
      - doc: commented writes the value commented out.
        name: commented
        type: bool
    kind: struct
    name: fieldOptions
  - doc: fieldPlan is how one struct field maps to a key.
    fields:
      - doc: name is the key.
        name: name
        type: string
      - doc: index is the field's path through embedded structs.
        name: index
        type: "[]int"
      - doc: opts are the tag's options.
        name: opts
        type: fieldOptions
      - doc: depth is how many embedded structs the field is reached through.
        name: depth
        type: int
    kind: struct
    name: fieldPlan
  - doc: typeInfo is what the codec knows about one Go type.
    fields:
      - doc: fields are a struct's keys, in declaration order, shadowed ones removed.
        name: fields
        type: "[]fieldPlan"
      - doc: exact finds a field by its exact key.
        name: exact
        type: map[string]int
      - doc: |-
          folded finds a field by its key in lower case, for a key whose case
          matches no field exactly.
        name: folded
        type: map[string]int
      - doc: flags are the roles the type plays.
        name: flags
        type: typeFlags
    kind: struct
    methods:
      - doc: is reports whether the type plays every role in flags.
        name: is
        params: flags typeFlags
        recv: ti *typeInfo
        results: bool
      - doc: |-
          lookup returns the field a key names: by exact match first, then
          case-insensitively, as encoding/json and the previous library match.
        name: lookup
        params: key []byte
        recv: ti *typeInfo
        results: "*fieldPlan, bool"
      - doc: |-
          lookupFolded finds a field by its key in lower case. An ASCII key short
          enough is folded on the stack, so the lookup allocates nothing.
        name: lookupFolded
        params: key []byte
        recv: ti *typeInfo
        results: int, bool
    name: typeInfo
  - doc: typeFlags are the roles a type plays, one bit each.
    kind: named
    name: typeFlags
    underlying: uint8
vars:
  - doc: |-
      Package-level state: the codec singleton plus the hoisted MIME /
      extension tables.
    grouped: true
    items:
      - doc: ": register the singleton and expose it as a typed package var."
        name: Codec
        type: codec.Codec
        value: codec.Register(&tomlCodec{})
    name: Codec
  - doc: The names a refusal gives the kinds of TOML value.
    items:
      - name: kindNames
        value: |-
          [...]string{
          	kindTable:         "table",
          	kindArrayOfTables: "array of tables",
          	kindArray:         "array",
          	kindString:        "string",
          	kindInteger:       "integer",
          	kindFloat:         "float",
          	kindBool:          "boolean",
          	kindDateTime:      "offset date-time",
          	kindLocalDateTime: "local date-time",
          	kindLocalDate:     "local date",
          	kindLocalTime:     "local time",
          }
    name: kindNames
  - doc: The zone a local value takes when the target is a time.Time.
    items:
      - name: localZone
        value: time.Local
    name: localZone
  - doc: encoderPool recycles encoders.
    items:
      - name: encoderPool
        value: |-
          recycler.NewCappedPool[*encoder](
          	func() *encoder { return new(encoder) },
          	(*encoder).reset,
          	(*encoder).retained,
          	maxRetainedEncoderEntries,
          )
    name: encoderPool
  - doc: |-
      basicEscapes maps a byte to the letter of its one-character escape in a
      basic string, or to 0.
    items:
      - name: basicEscapes
        value: |-
          [byteValues]byte{
          	'"':  '"',
          	'\\': '\\',
          	'\b': 'b',
          	'\f': 'f',
          	'\n': 'n',
          	'\r': 'r',
          	'\t': 't',
          }
    name: basicEscapes
  - doc: nanoScale multiplies a fraction of n digits up to nanoseconds.
    items:
      - name: nanoScale
        value: "[...]int{0, 1e8, 1e7, 1e6, 1e5, 1e4, 1e3, 1e2, 1e1, 1e0}"
    name: nanoScale
  - doc: exactPow10 holds the powers of ten float64 represents exactly.
    items:
      - name: exactPow10
        value: |-
          [...]float64{
          	1e0, 1e1, 1e2, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9, 1e10, 1e11,
          	1e12, 1e13, 1e14, 1e15, 1e16, 1e17, 1e18, 1e19, 1e20, 1e21, 1e22,
          }
    name: exactPow10
  - doc: "noPart is the key of a node that has none: an array element."
    items:
      - name: noPart
        value: keyPart{}
    name: noPart
  - doc: |-
      parserPool recycles parsers with their arenas, dropping one that grew past
      maxRetainedParserBytes.
    items:
      - name: parserPool
        value: |-
          recycler.NewCappedPool[*parser](
          	func() *parser { return new(parser) },
          	(*parser).reset,
          	(*parser).retainedBytes,
          	maxRetainedParserBytes,
          )
    name: parserPool
  - doc: |-
      hashSeed seeds the hash index. One seed per process is enough: the index
      only has to spread keys, and a collision costs a comparison, not a wrong
      answer.
    items:
      - name: hashSeed
        value: maphash.MakeSeed()
    name: hashSeed
  - doc: The reflect types the codec treats specially.
    grouped: true
    items:
      - doc: timeType is time.Time.
        name: timeType
        value: reflect.TypeFor[time.Time]()
      - doc: localDateType is LocalDate.
        name: localDateType
        value: reflect.TypeFor[LocalDate]()
      - doc: localTimeType is LocalTime.
        name: localTimeType
        value: reflect.TypeFor[LocalTime]()
      - doc: localDateTimeType is LocalDateTime.
        name: localDateTimeType
        value: reflect.TypeFor[LocalDateTime]()
      - doc: textMarshalerType is encoding.TextMarshaler.
        name: textMarshalerType
        value: reflect.TypeFor[encoding.TextMarshaler]()
      - doc: textUnmarshalerType is encoding.TextUnmarshaler.
        name: textUnmarshalerType
        value: reflect.TypeFor[encoding.TextUnmarshaler]()
      - doc: |-
          isZeroerType is the method omitzero consults when a type has it:
          IsZero reports whether the value is its type's zero.
        name: isZeroerType
        value: reflect.TypeFor[interface{ IsZero() bool }]()
      - doc: typeInfos caches a *typeInfo per reflect.Type.
        name: typeInfos
        type: sync.Map
      - doc: |-
          predeclaredInfo describes every predeclared scalar type — bool, the
          integers, the floats, string — which can have no method, and so plays
          no role but being a value.
        name: predeclaredInfo
        value: "&typeInfo{flags: typeValue}"
    name: timeType
  - doc: The lexical tables.
    grouped: true
    items:
      - doc: byteClass maps every byte to its classes.
        name: byteClass
        value: buildByteClass()
      - doc: |-
          simpleEscapes maps the character after a backslash to the byte it
          stands for, or to 0 when it starts no one-character escape (§String).
          \e is TOML v1.1.0's, accepted because the previous library accepted it.
        name: simpleEscapes
        value: |-
          [byteValues]byte{
          		'b':  '\b',
          		't':  '\t',
          		'n':  '\n',
          		'f':  '\f',
          		'r':  '\r',
          		'"':  '"',
          		'\\': '\\',
          		'e':  escapeCharacter,
          	}
    name: byteClass
