# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The problems a decode refuses a target for.
    grouped: true
    items:
      - doc: "problemTarget: Unmarshal was not handed a non-nil pointer."
        name: problemTarget
        type: string
        value: "\"the target is not a non-nil pointer\""
      - doc: "problemMismatch: a value the target's type cannot hold."
        name: problemMismatch
        type: string
        value: "\"the value does not fit the target's type\""
      - doc: "problemOverflow: a number outside the target's range."
        name: problemOverflow
        type: string
        value: "\"the number does not fit the target's type\""
      - doc: "problemMapKey: a key the map's key type cannot hold."
        name: problemMapKey
        type: string
        value: "\"the key does not fit the map's key type\""
      - doc: "problemText: a value the target's UnmarshalText refused."
        name: problemText
        type: string
        value: "\"the target's UnmarshalText refused the value\""
      - doc: "problemEmbedded: a nil pointer to an unexported embedded struct."
        name: problemEmbedded
        type: string
        value: "\"a nil pointer to an unexported embedded struct cannot be allocated\""
      - doc: |-
          problemArrayTooShort: an array of tables longer than the Go array it
          decodes into.
        name: problemArrayTooShort
        type: string
        value: "\"the array of tables has more elements than the Go array holds\""
      - doc: |-
          problemNotThisKind: text that is not the date or time a local type
          reads.
        name: problemNotThisKind
        type: string
        value: "\"the text is not the date or time this type reads\""
    name: problemTarget
  - doc: The problems an encode refuses a value for.
    grouped: true
    items:
      - doc: "problemRoot: the value is not a map or a struct."
        name: problemRoot
        type: string
        value: "\"a TOML document is a table: the value must be a map or a struct\""
      - doc: "problemNil: a nil interface, or a nil pointer at the root."
        name: problemNil
        type: string
        value: "\"a nil value has no TOML representation\""
      - doc: |-
          problemUnsupported: a channel, a function, a complex number or an
          unsafe pointer.
        name: problemUnsupported
        type: string
        value: "\"the type has no TOML representation\""
      - doc: "problemUintRange: an unsigned integer above the largest int64."
        name: problemUintRange
        type: string
        value: "\"the unsigned integer is larger than a TOML integer can hold\""
      - doc: |-
          problemKeyType: a map key that is not a string, a number or a
          TextMarshaler.
        name: problemKeyType
        type: string
        value: "\"the map's key type cannot be written as a TOML key\""
      - doc: "problemKeyClash: two map keys written as the same TOML key."
        name: problemKeyClash
        type: string
        value: "\"two map keys are written as the same TOML key\""
      - doc: "problemTooDeepEncode: a value nested past maxDepth, or a cycle."
        name: problemTooDeepEncode
        type: string
        value: "\"the value is nested too deep, or refers to itself\""
      - doc: "problemNotUTF8: a string TOML cannot carry."
        name: problemNotUTF8
        type: string
        value: "\"a string is not valid UTF-8\""
      - doc: "problemMarshalText: a TextMarshaler that failed."
        name: problemMarshalText
        type: string
        value: "\"a MarshalText method returned an error\""
      - doc: |-
          problemPointerLoop: a pointer type that points to itself, type P *P,
          or a value that does.
        name: problemPointerLoop
        type: string
        value: "\"a pointer refers to itself\""
    name: problemRoot
  - doc: |-
      maxRetainedEncoderEntries is the entry capacity above which an encoder is
      dropped rather than pooled.
    items:
      - name: maxRetainedEncoderEntries
        type: int
        value: "4096"
    name: maxRetainedEncoderEntries
  - doc: commentPrefix starts a commented-out line.
    items:
      - name: commentPrefix
        type: string
        value: "\"# \""
    name: commentPrefix
  - doc: |-
      rfc3339Nano is the layout of an offset date-time: RFC 3339 with as many
      fractional digits as the value needs.
    items:
      - name: rfc3339Nano
        type: string
        value: "\"2006-01-02T15:04:05.999999999Z07:00\""
    name: rfc3339Nano
  - doc: indentSymbol indents the elements of a multi-line array.
    items:
      - name: indentSymbol
        type: string
        value: "\"  \""
    name: indentSymbol
  - doc: tripleQuote delimits a multi-line basic string.
    items:
      - name: tripleQuote
        type: string
        value: "`\"\"\"`"
    name: tripleQuote
  - doc: hexDigits spells the hexadecimal digits of a \u escape.
    items:
      - name: hexDigits
        type: string
        value: "\"0123456789ABCDEF\""
    name: hexDigits
  - doc: The shifts of the four hexadecimal digits of a \u escape of one byte.
    grouped: true
    items:
      - doc: highNibbleShift reaches the high nibble of a byte.
        name: highNibbleShift
        type: uint
        value: "4"
      - doc: lowNibbleMask keeps the low nibble.
        name: lowNibbleMask
        type: byte
        value: "0x0f"
    name: highNibbleShift
  - doc: |-
      The private messages of a refusal that wraps a cause — a writer, a reader,
      a MarshalText or UnmarshalText method — under one of the two codes. Its
      reason and public message are the sentinel's own.
    grouped: true
    items:
      - doc: |-
          privateTextMarshalFailed is the private message of a TextMarshaler's
          refusal.
        name: privateTextMarshalFailed
        type: string
        value: "\"service/data/codec/toml: a MarshalText method returned an error; it is the cause\""
      - doc: |-
          privateTextRefused is the private message of a TextUnmarshaler's
          refusal.
        name: privateTextRefused
        type: string
        value: "\"service/data/codec/toml: an UnmarshalText method refused a value; its error is the cause\""
      - doc: privateWriteFailed is the private message of a writer's refusal.
        name: privateWriteFailed
        type: string
        value: "\"service/data/codec/toml: the writer refused the encoded document; its error is the cause\""
      - doc: privateReadFailed is the private message of a reader's failure.
        name: privateReadFailed
        type: string
        value: "\"service/data/codec/toml: the reader failed before the document ended; its error is the cause\""
    name: privateTextMarshalFailed
  - doc: Text widths of the three types.
    grouped: true
    items:
      - doc: localDateWidth is the length of YYYY-MM-DD.
        name: localDateWidth
        type: int
        value: "10"
      - doc: localTimeWidth is the length of HH:MM:SS without a fraction.
        name: localTimeWidth
        type: int
        value: "8"
      - doc: zeroPadWidth is the width every field but the year is padded to.
        name: zeroPadWidth
        type: int
        value: "2"
    name: localDateWidth
  - doc: Field widths and bounds of RFC 3339.
    grouped: true
    items:
      - doc: yearDigits is the width of a year.
        name: yearDigits
        type: int
        value: "4"
      - doc: pairDigits is the width of every other field.
        name: pairDigits
        type: int
        value: "2"
      - doc: monthsPerYear bounds a month.
        name: monthsPerYear
        type: int
        value: "12"
      - doc: maxHour bounds an hour, and an offset's hours.
        name: maxHour
        type: int
        value: "23"
      - doc: maxMinute bounds a minute, and an offset's minutes.
        name: maxMinute
        type: int
        value: "59"
      - doc: |-
          maxSecond bounds a second: a leap second is refused, as the previous
          library refused it, rather than silently moved to the next minute.
        name: maxSecond
        type: int
        value: "59"
      - doc: |-
          nanoDigits is how many fractional digits a nanosecond holds; more are
          truncated (§Offset Date-Time: "must be truncated, not rounded").
        name: nanoDigits
        type: int
        value: "9"
      - doc: secondsPerMinute converts an offset's minutes.
        name: secondsPerMinute
        type: int
        value: "60"
      - doc: secondsPerHour converts an offset's hours.
        name: secondsPerHour
        type: int
        value: "3600"
      - doc: datetimeBytes is the size of one datetime, for the retain decision.
        name: datetimeBytes
        type: int
        value: "72"
    name: yearDigits
  - doc: Days in the months whose length does not depend on the year.
    grouped: true
    items:
      - doc: longMonth has 31 days.
        name: longMonth
        type: int
        value: "31"
      - doc: shortMonth has 30 days.
        name: shortMonth
        type: int
        value: "30"
      - doc: februaryDays is February outside a leap year.
        name: februaryDays
        type: int
        value: "28"
      - doc: leapFebruaryDays is February in a leap year.
        name: leapFebruaryDays
        type: int
        value: "29"
      - doc: february is the month whose length depends on the year.
        name: february
        type: int
        value: "2"
      - doc: april has 30 days.
        name: april
        type: int
        value: "4"
      - doc: june has 30 days.
        name: june
        type: int
        value: "6"
      - doc: september has 30 days.
        name: september
        type: int
        value: "9"
      - doc: november has 30 days.
        name: november
        type: int
        value: "11"
    name: longMonth
  - doc: |-
      offsetInvalid marks an offset that offset could not read: no real offset
      comes near it, since an offset's hours are at most 23.
    items:
      - name: offsetInvalid
        type: int
        value: 1 << 30
    name: offsetInvalid
  - doc: The Gregorian leap-year rule.
    grouped: true
    items:
      - doc: leapCycle is every fourth year.
        name: leapCycle
        type: int
        value: "4"
      - doc: centuryCycle is every hundredth, which is not.
        name: centuryCycle
        type: int
        value: "100"
      - doc: quadCenturyCycle is every four hundredth, which is again.
        name: quadCenturyCycle
        type: int
        value: "400"
    name: leapCycle
  - doc: Bits per digit of the integers with a radix prefix.
    grouped: true
    items:
      - doc: hexBits is one hexadecimal digit.
        name: hexBits
        type: uint
        value: "4"
      - doc: octalBits is one octal digit.
        name: octalBits
        type: uint
        value: "3"
      - doc: binaryBits is one binary digit.
        name: binaryBits
        type: uint
        value: "1"
    name: hexBits
  - doc: decimalBase is the base of a decimal integer.
    items:
      - name: decimalBase
        type: byte
        value: "10"
    name: decimalBase
  - doc: |-
      floatBufferBytes sizes the stack buffer a float's digits are copied into
      without their underscores; a longer float takes the heap.
    items:
      - name: floatBufferBytes
        type: int
        value: "64"
    name: floatBufferBytes
  - doc: |-
      The bounds of Clinger's fast path: a significand of at most 53 bits scaled
      by a power of ten that float64 holds exactly gives the correctly rounded
      result in one multiplication or division.
    grouped: true
    items:
      - doc: maxExactSignificand is 2^53.
        name: maxExactSignificand
        type: uint64
        value: 1 << 53
      - doc: maxExactPow10 is the largest power of ten float64 holds exactly.
        name: maxExactPow10
        type: int
        value: "22"
      - doc: maxSignificandDigits keeps the significand from overflowing uint64.
        name: maxSignificandDigits
        type: int
        value: "19"
      - doc: maxExponentDigits bounds an exponent before it is handed to strconv.
        name: maxExponentDigits
        type: int
        value: "4"
    name: maxExactSignificand
  - doc: Digits an escape sequence carries.
    grouped: true
    items:
      - doc: shortEscapeDigits is the length of \xHH (TOML v1.1.0).
        name: shortEscapeDigits
        type: int
        value: "2"
      - doc: unicodeEscapeDigits is the length of \uXXXX.
        name: unicodeEscapeDigits
        type: int
        value: "4"
      - doc: longEscapeDigits is the length of \UXXXXXXXX.
        name: longEscapeDigits
        type: int
        value: "8"
      - doc: hexDigitBits is how many bits one hexadecimal digit carries.
        name: hexDigitBits
        type: uint
        value: "4"
      - doc: hexLetterValue is the value of the hexadecimal digits a and A.
        name: hexLetterValue
        type: byte
        value: "10"
    name: shortEscapeDigits
  - doc: Surrogates are not Unicode scalar values, so no escape may name one.
    grouped: true
    items:
      - doc: surrogateFirst is the first UTF-16 surrogate.
        name: surrogateFirst
        type: uint32
        value: "0xD800"
      - doc: surrogateLast is the last UTF-16 surrogate.
        name: surrogateLast
        type: uint32
        value: "0xDFFF"
    name: surrogateFirst
  - doc: delimiterLength is the length of a multi-line string's delimiters.
    items:
      - name: delimiterLength
        type: int
        value: "3"
    name: delimiterLength
  - doc: |-
      maxClosingQuotes is the longest run of quotes that can end a multi-line
      string: the three of the delimiter and two of the content.
    items:
      - name: maxClosingQuotes
        type: int
        value: "5"
    name: maxClosingQuotes
  - doc: |-
      maxDocumentBytes caps the size of a document Unmarshal and the streaming
      decoder accept (CWE-400). Ten MiB covers every configuration file there is,
      and matches the cap the YAML and MessagePack codecs apply.
    items:
      - name: maxDocumentBytes
        type: int
        value: 10 << 20
    name: maxDocumentBytes
  - doc: |-
      maxDepth caps how deep below the root a table, an array or a value may sit
      (CWE-674): a key at the root is at depth 1, a value inside 128 nested arrays
      at depth 129, and refused. The parse and the decode both recurse once per
      level, so the cap is what keeps a document of ten million opening brackets
      from reaching the stack's limit. A configuration nests a handful of levels;
      generated documents a few more.
    items:
      - name: maxDepth
        type: int32
        value: "128"
    name: maxDepth
  - doc: |-
      maxRetainedParserBytes is the arena size above which a parser is dropped
      rather than pooled, so that one large document does not pin its arena for
      the life of the pool.
    items:
      - name: maxRetainedParserBytes
        type: int
        value: 256 << 10
    name: maxRetainedParserBytes
  - doc: nodeBytes is the size of one node, for the retain decision.
    items:
      - name: nodeBytes
        type: int
        value: "64"
    name: nodeBytes
  - doc: |-
      Interning: a key is turned into a Go string once per pooled parser, as the
      replaced library did, so a document decoded again — a configuration
      reloaded, a thousand tables with the same five keys — allocates no key twice.
      Only keys are interned: a value may be a secret, and a pooled table outlives
      the call.
    grouped: true
    items:
      - doc: maxInternedKeys bounds the table; past it, keys are no longer added.
        name: maxInternedKeys
        type: int
        value: "4096"
      - doc: maxInternedKeyBytes is the longest key interned.
        name: maxInternedKeyBytes
        type: int
        value: "64"
      - doc: |-
          internEntryBytes is the table's own cost per key, for the retain
          decision.
        name: internEntryBytes
        type: int
        value: "32"
    name: maxInternedKeys
  - doc: |-
      Presizing: a large document allocates its arena once, sized from the
      separators every node is introduced by, instead of doubling it log2(n)
      times — a 9 000-node document otherwise allocates twice its arena per call,
      since an arena past maxRetainedParserBytes is not pooled.
    grouped: true
    items:
      - doc: |-
          bytesPerNodeGuess is the document size per node below which the arena
          is assumed big enough and no estimate is made.
        name: bytesPerNodeGuess
        type: int
        value: "16"
      - doc: |-
          maxPresizedNodes bounds the up-front allocation to 2 MiB of nodes; a
          document of more nodes grows past it as usual.
        name: maxPresizedNodes
        type: int
        value: 1 << 15
    name: bytesPerNodeGuess
  - doc: Characters with a role in the grammar.
    grouped: true
    items:
      - doc: charNewline ends a line.
        name: charNewline
        type: byte
        value: "'\\n'"
      - doc: charReturn may only appear before charNewline.
        name: charReturn
        type: byte
        value: "'\\r'"
      - doc: charHash starts a comment.
        name: charHash
        type: byte
        value: "'#'"
      - doc: charOpenBracket opens a table header or an array.
        name: charOpenBracket
        type: byte
        value: "'['"
      - doc: charCloseBracket closes a table header or an array.
        name: charCloseBracket
        type: byte
        value: "']'"
      - doc: charOpenBrace opens an inline table.
        name: charOpenBrace
        type: byte
        value: "'{'"
      - doc: charCloseBrace closes an inline table.
        name: charCloseBrace
        type: byte
        value: "'}'"
      - doc: charComma separates array elements and inline-table pairs.
        name: charComma
        type: byte
        value: "','"
      - doc: charDot separates the parts of a dotted key.
        name: charDot
        type: byte
        value: "'.'"
      - doc: charEquals separates a key from its value.
        name: charEquals
        type: byte
        value: "'='"
      - doc: charQuote opens a basic string.
        name: charQuote
        type: byte
        value: "'\"'"
      - doc: charApostrophe opens a literal string.
        name: charApostrophe
        type: byte
        value: "'\\''"
      - doc: charBackslash starts an escape sequence.
        name: charBackslash
        type: byte
        value: "'\\\\'"
      - doc: charSpace is whitespace.
        name: charSpace
        type: byte
        value: "' '"
      - doc: charTab is whitespace.
        name: charTab
        type: byte
        value: "'\\t'"
      - doc: charDelete is the one control character above the space.
        name: charDelete
        type: byte
        value: "0x7f"
      - doc: charFirstPrintable is the first character that is not a control.
        name: charFirstPrintable
        type: byte
        value: "0x20"
      - doc: charFirstNonASCII is the first byte of a multi-byte UTF-8 sequence.
        name: charFirstNonASCII
        type: byte
        value: "0x80"
    name: charNewline
  - doc: The kinds of node a document is made of.
    grouped: true
    items:
      - doc: |-
          kindTable is a table: the root, a [header], an intermediate a header or
          a dotted key implied, an inline table, or one element of an array of
          tables.
        name: kindTable
        type: kind
        value: iota + 1
      - doc: kindArrayOfTables is the array a [[header]] appends to.
        name: kindArrayOfTables
      - doc: kindArray is an array value, written with brackets.
        name: kindArray
      - doc: kindString is a string of any of the four spellings.
        name: kindString
      - doc: kindInteger is a 64-bit signed integer.
        name: kindInteger
      - doc: kindFloat is an IEEE 754 binary64 value.
        name: kindFloat
      - doc: kindBool is true or false.
        name: kindBool
      - doc: "kindDateTime is an offset date-time: an instant."
        name: kindDateTime
      - doc: kindLocalDateTime is a date-time with no offset.
        name: kindLocalDateTime
      - doc: kindLocalDate is a calendar day.
        name: kindLocalDate
      - doc: kindLocalTime is a time of day.
        name: kindLocalTime
    name: kindTable
  - doc: The ways a table comes to exist.
    grouped: true
    items:
      - doc: |-
          originImplicit is a table a longer [header] or [[header]] implied: its
          own [header] may still define it, once.
        name: originImplicit
        type: origin
        value: iota + 1
      - doc: originHeader is a table its own [header] defined, or the root.
        name: originHeader
      - doc: |-
          originDotted is a table a dotted key created: more dotted keys of the
          same section may extend it, and a [header] may add a sub-table to it,
          but nothing may define it again.
        name: originDotted
      - doc: |-
          originInline is an inline table: complete when its closing brace is
          read, and never extended afterwards.
        name: originInline
      - doc: originElement is one element of an array of tables.
        name: originElement
    name: originImplicit
  - doc: Flags a node carries.
    grouped: true
    items:
      - doc: flagKeyEscaped says the node's key lives in the unescape buffer.
        name: flagKeyEscaped
        type: uint8
        value: 1 << iota
      - doc: flagTextEscaped says the node's text lives in the unescape buffer.
        name: flagTextEscaped
      - doc: flagIndexed says the table's children are in the hash index.
        name: flagIndexed
    name: flagKeyEscaped
  - doc: noNode marks the absence of a node in a link.
    items:
      - name: noNode
        type: int32
        value: "-1"
    name: noNode
  - doc: rootNode is the index of the root table in every arena.
    items:
      - name: rootNode
        type: int32
        value: "0"
    name: rootNode
  - doc: |-
      linearLimit is the child count up to which a table is searched by a scan of
      its children. A wider table moves to the hash index, so that a document
      with a hundred thousand keys in one table costs a hundred thousand lookups
      and not five billion comparisons.
    items:
      - name: linearLimit
        type: int32
        value: "16"
    name: linearLimit
  - doc: |-
      hashMixer spreads a table's index over the bits of a key's hash, so the same
      key in two tables lands in two buckets.
    items:
      - name: hashMixer
        type: uint64
        value: "0x9E3779B97F4A7C15"
    name: hashMixer
  - doc: |-
      The options a toml struct tag may carry after the name, and the standalone
      boolean tags the previous library also read.
    grouped: true
    items:
      - doc: tagName is the struct tag the codec reads.
        name: tagName
        type: string
        value: "\"toml\""
      - doc: |-
          tagComment is the struct tag whose value is written as a comment above
          the field.
        name: tagComment
        type: string
        value: "\"comment\""
      - doc: tagSkip is the tag that drops a field.
        name: tagSkip
        type: string
        value: "\"-\""
      - doc: tagTrue is the value of a standalone boolean tag.
        name: tagTrue
        type: string
        value: "\"true\""
      - doc: optOmitEmpty drops an empty value.
        name: optOmitEmpty
        type: string
        value: "\"omitempty\""
      - doc: optOmitZero drops a zero value.
        name: optOmitZero
        type: string
        value: "\"omitzero\""
      - doc: optInline writes a table as an inline table.
        name: optInline
        type: string
        value: "\"inline\""
      - doc: |-
          optMultiline writes a string with a newline as a multi-line string, and
          an array one element per line.
        name: optMultiline
        type: string
        value: "\"multiline\""
      - doc: optCommented writes the value, and everything under it, commented out.
        name: optCommented
        type: string
        value: "\"commented\""
    name: tagName
  - doc: The roles a type plays.
    grouped: true
    items:
      - doc: "typeTextMarshaler: the type implements encoding.TextMarshaler."
        name: typeTextMarshaler
        type: typeFlags
        value: 1 << iota
      - doc: "typeTextMarshalerPtr: only *T implements encoding.TextMarshaler."
        name: typeTextMarshalerPtr
      - doc: "typeTextUnmarshaler: *T implements encoding.TextUnmarshaler."
        name: typeTextUnmarshaler
      - doc: "typeZeroer: T or *T has an IsZero method, which omitzero then uses."
        name: typeZeroer
      - doc: "typeSpecial: the type is time.Time or one of the local types."
        name: typeSpecial
      - doc: "typeValue: the type encodes as a value rather than as a table."
        name: typeValue
      - doc: "typeBadNames: a tag names a key that is not valid UTF-8."
        name: typeBadNames
    name: typeTextMarshaler
  - doc: foldBufferBytes is the longest key folded to lower case on the stack.
    items:
      - name: foldBufferBytes
        type: int
        value: "64"
    name: foldBufferBytes
  - doc: "Byte classes, one bit each: a byte may belong to several."
    grouped: true
    items:
      - doc: |-
          classPrintable is the tab and printable ASCII, 0x20 to 0x7E: what a
          string keeps verbatim, once its delimiter and escape are handled.
        name: classPrintable
        type: uint16
        value: 1 << iota
      - doc: classBareKey is A-Z a-z 0-9 - _ (§Keys).
        name: classBareKey
      - doc: classDigit is 0-9.
        name: classDigit
      - doc: classHex is 0-9 a-f A-F.
        name: classHex
      - doc: classOctal is 0-7.
        name: classOctal
      - doc: classBinary is 0 and 1.
        name: classBinary
      - doc: |-
          classNumberStart is what a number, a date or a time starts with:
          a digit, a sign, or the i and n of inf and nan.
        name: classNumberStart
    name: classPrintable
  - doc: The words a value may be.
    grouped: true
    items:
      - doc: wordTrue is the true boolean.
        name: wordTrue
        type: string
        value: "\"true\""
      - doc: wordFalse is the false boolean.
        name: wordFalse
        type: string
        value: "\"false\""
      - doc: wordInf is an infinite float.
        name: wordInf
        type: string
        value: "\"inf\""
      - doc: wordNaN is a float that is not a number.
        name: wordNaN
        type: string
        value: "\"nan\""
    name: wordTrue
  - doc: escapeCharacter is the value of TOML v1.1.0's \e.
    items:
      - name: escapeCharacter
        type: byte
        value: "0x1b"
    name: escapeCharacter
  - doc: |-
      byteValues is how many values a byte has: the size of every table indexed
      by one.
    items:
      - name: byteValues
        type: int
        value: "256"
    name: byteValues
  - doc: The fields a refusal carries.
    grouped: true
    items:
      - doc: fieldProblem names what is wrong, in a fixed sentence.
        name: fieldProblem
        type: string
        value: "\"problem\""
      - doc: fieldLine is the 1-based line of the problem.
        name: fieldLine
        type: string
        value: "\"line\""
      - doc: fieldColumn is the 1-based column of the problem, in characters.
        name: fieldColumn
        type: string
        value: "\"column\""
      - doc: fieldKey is the dotted key of the value a target could not hold.
        name: fieldKey
        type: string
        value: "\"key\""
      - doc: |-
          fieldType is the Go type that could not hold a value, or that has no
          TOML representation.
        name: fieldType
        type: string
        value: "\"type\""
      - doc: fieldTOML is the kind of TOML value a target could not hold.
        name: fieldTOML
        type: string
        value: "\"toml\""
      - doc: fieldLimit is the bound a document or a value went past.
        name: fieldLimit
        type: string
        value: "\"limit\""
    name: fieldProblem
  - doc: |-
      The problems a parse refuses a document for. Each is a fixed sentence: a
      refusal never carries a byte of the document, whose values may be secrets.
    grouped: true
    items:
      - doc: "problemExpectedNewline: something follows a complete expression."
        name: problemExpectedNewline
        type: string
        value: "\"expected a newline or a comment after the expression\""
      - doc: "problemExpectedKey: a key is required here."
        name: problemExpectedKey
        type: string
        value: "\"expected a key\""
      - doc: "problemExpectedEquals: a key with no equals sign after it."
        name: problemExpectedEquals
        type: string
        value: "\"expected '=' after the key\""
      - doc: "problemExpectedValue: nothing that starts a value."
        name: problemExpectedValue
        type: string
        value: "\"expected a value\""
      - doc: "problemExpectedComma: an array element followed by neither ',' nor ']'."
        name: problemExpectedComma
        type: string
        value: "\"expected ',' or ']' after an array element\""
      - doc: |-
          problemExpectedPairComma: an inline-table pair followed by neither ','
          nor '}'.
        name: problemExpectedPairComma
        type: string
        value: "\"expected ',' or '}' after an inline table key-value\""
      - doc: "problemUnclosedHeader: a table header that does not close."
        name: problemUnclosedHeader
        type: string
        value: "\"expected ']' to close the table header\""
      - doc: "problemKeyTwice: a key defined a second time."
        name: problemKeyTwice
        type: string
        value: "\"the key is already defined\""
      - doc: "problemTableTwice: a [header] repeated."
        name: problemTableTwice
        type: string
        value: "\"the table is already defined\""
      - doc: "problemTableDotted: a [header] for a table dotted keys defined."
        name: problemTableDotted
        type: string
        value: "\"the table was defined by dotted keys and cannot be defined again\""
      - doc: "problemTableIsArray: a [header] for an array of tables."
        name: problemTableIsArray
        type: string
        value: "\"the table is already an array of tables\""
      - doc: "problemNotArrayOfTables: a [[header]] for something else."
        name: problemNotArrayOfTables
        type: string
        value: "\"the key is already defined and is not an array of tables\""
      - doc: "problemExtendValue: a header passing through a value."
        name: problemExtendValue
        type: string
        value: "\"the key is a value, a static array or an inline table, and cannot be extended\""
      - doc: |-
          problemDottedExtends: a dotted key reaching into a table defined
          elsewhere.
        name: problemDottedExtends
        type: string
        value: "\"a dotted key cannot extend a table defined by a header, a value or an inline table\""
      - doc: "problemControlInComment: a control character in a comment."
        name: problemControlInComment
        type: string
        value: "\"a comment contains a control character\""
      - doc: |-
          problemControlInString: a newline or a control character in a string
          that may not hold it.
        name: problemControlInString
        type: string
        value: "\"a string contains a control character or a newline it may not hold\""
      - doc: "problemInvalidUTF8: bytes that are not UTF-8."
        name: problemInvalidUTF8
        type: string
        value: "\"the document is not valid UTF-8\""
      - doc: "problemUnterminatedString: the document ends inside a string."
        name: problemUnterminatedString
        type: string
        value: "\"the string is not terminated\""
      - doc: |-
          problemBadEscape: an unknown escape, or one naming no Unicode scalar
          value.
        name: problemBadEscape
        type: string
        value: "\"invalid escape sequence\""
      - doc: "problemTooManyQuotes: more than five quotes closing a multi-line string."
        name: problemTooManyQuotes
        type: string
        value: "\"too many quotes at the end of a multi-line string\""
      - doc: "problemBadNumber: a malformed integer or float."
        name: problemBadNumber
        type: string
        value: "\"malformed number\""
      - doc: "problemBadUnderscore: an underscore not between two digits."
        name: problemBadUnderscore
        type: string
        value: "\"an underscore in a number must stand between two digits\""
      - doc: "problemLeadingZero: a decimal number with a leading zero."
        name: problemLeadingZero
        type: string
        value: "\"a decimal number cannot have a leading zero\""
      - doc: "problemIntegerRange: an integer outside int64."
        name: problemIntegerRange
        type: string
        value: "\"the integer does not fit a signed 64-bit integer\""
      - doc: "problemFloatRange: a float too large for float64."
        name: problemFloatRange
        type: string
        value: "\"the float is too large for a 64-bit float\""
      - doc: "problemBadDate: a malformed date or a day that does not exist."
        name: problemBadDate
        type: string
        value: "\"malformed or impossible date\""
      - doc: |-
          problemBadTime: a malformed time or an impossible hour, minute or
          second.
        name: problemBadTime
        type: string
        value: "\"malformed or impossible time\""
      - doc: "problemBadOffset: a malformed time-zone offset."
        name: problemBadOffset
        type: string
        value: "\"malformed time-zone offset\""
      - doc: "problemTooDeep: tables and arrays nested past maxDepth."
        name: problemTooDeep
        type: string
        value: "\"tables and arrays are nested too deep\""
      - doc: "problemTooLarge: a document past maxDocumentBytes."
        name: problemTooLarge
        type: string
        value: "\"the document is larger than the limit\""
    name: problemExpectedNewline
