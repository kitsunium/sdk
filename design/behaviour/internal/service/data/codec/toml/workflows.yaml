workflows:
  - of: cutLine
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: s[:i], s[i+1:], true
                when: s[i] == charNewline
          key: i
          range: len(s)
      - return: s, "", false
  - of: isBareKey
    steps:
      - opt:
          do:
            - return: "false"
          when: key == ""
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: "!isBareKeyByte(key[i])"
          key: i
          range: len(key)
      - return: "true"
  - of: canBeLiteral
    steps:
      - loop:
          do:
            - bind: c
              eval: s[i]
            - opt:
                do:
                  - return: "false"
                when: c == charApostrophe || c == charDelete || c < charFirstPrintable
          key: i
          range: len(s)
      - return: "true"
  - of: containsByte
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: s[i] == c
          key: i
          range: len(s)
      - return: "false"
  - of: (*parser).digitsThen
