          key: _
          range: "p.data[p.pos : p.pos+width]"
          value: c
      - op: +=
        set: p.pos
        value: width
      - opt:
          do:
            - return: 0, false
          when: sep != 0 && !p.consume(sep)
      - return: value, true
  - of: (*parser).integerOf
    steps:
      - bind: negative
        eval: token[0] == '-'
      - var:
          name: limit
          type: uint64
          value: math.MaxInt64
      - opt:
          do:
            - op: ++
