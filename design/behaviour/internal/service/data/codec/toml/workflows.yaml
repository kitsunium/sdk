          key: _
          range: token
          value: c
      - opt:
          do:
            - set: value
              value: "-value"
          when: negative
      - return: kindInteger, value, nil
  - of: significandOf
    steps:
      - bind: digits
        eval: "0"
      - bind: afterDot
        eval: "false"
      - bind: i
        eval: "0"
      - loop:
          cond: i < len(b)
          do:
            - bind: c
              eval: b[i]
            - opt:
                do:
                  - set: afterDot
                    value: "true"
                  - continue: true
                when: c == '.'
            - opt:
                do:
                  - break: true
                when: c == 'e' || c == 'E'
            - opt:
                do:
                  - return: 0, 0, nil, false
                when: digits == maxSignificandDigits
            - set: significand
              value: significand*uint64(decimalBase) + uint64(c-'0')
            - op: ++
              set: digits
            - opt:
                do:
                  - op: "--"
                    set: exponent
                when: afterDot
          post: i++
      - return: significand, exponent, b[i:], true
  - of: position
    steps:
      - set: at
        value: min(max(at, 0), len(data))
      - bind: line, lineStart
        eval: 1, 0
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: line
                  - set: lineStart
                    value: i + 1
