                when: byteClass[c]&classDigit == 0
          key: _
          range: "p.data[p.pos : p.pos+count]"
          value: c
      - return: "true"
  - of: (*parser).secondFraction
    steps:
      - opt:
          do:
            - return: "true"
          when: "!p.consume(charDot)"
      - bind: start
        eval: p.pos
      - loop:
          cond: p.pos < len(p.data) && byteClass[p.data[p.pos]]&classDigit != 0
          do:
            - opt:
                do:
                  - set: dt.nanosecond
                    value: dt.nanosecond*int(decimalBase) + int(p.data[p.pos]-'0')
                when: p.pos-start < nanoDigits
            - op: ++
              set: p.pos
      - set: dt.precision
        value: min(p.pos-start, nanoDigits)
      - op: "*="
        set: dt.nanosecond
        value: nanoScale[dt.precision]
      - return: p.pos > start
  - of: (*parser).fixed
    steps:
      - opt:
          do:
            - return: 0, false
          when: len(p.data)-p.pos < width
      - bind: value
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - return: 0, false
                when: byteClass[c]&classDigit == 0
