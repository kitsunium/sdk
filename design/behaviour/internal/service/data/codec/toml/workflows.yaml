          key: i
          range: at
      - return: line, utf8.RuneCount(data[lineStart:at]) + 1
  - of: (*parser).indexLookup
    steps:
      - bind: c, ok
        eval: p.index[keyHash(t, key)]
      - opt:
          do:
            - return: noNode
          when: "!ok"
      - loop:
          cond: c != noNode
          do:
            - bind: "n"
              eval: "&p.nodes[c]"
            - opt:
                do:
                  - return: c
                when: n.parent == t && bytes.Equal(p.keyBytes(n), key)
          post: c = p.nodes[c].hnext
      - return: noNode
  - of: (*typeInfo).lookupFolded
    steps:
      - var:
          name: buf
          type: "[foldBufferBytes]byte"
      - opt:
          do:
            - bind: i, ok
              eval: ti.folded[strings.ToLower(string(key))]
            - return: i, ok
