functions:
  - name: Canonicalize
    params: doc []byte
    results: "[]byte, error"
  - doc: |-
      canonicalize reads exactly one value from dec, the reader over doc, and
      returns its canonical form.
    name: canonicalize
    params: doc []byte, dec tokenReader
    results: "[]byte, error"
  - name: Marshal
    params: v any
    results: "[]byte, error"
  - doc: appendValue appends the canonical form of the next value of dec.
    name: appendValue
    params: dst []byte, dec tokenReader
    results: "[]byte, error"
  - doc: appendScalar appends a string or a literal.
    name: appendScalar
    params: dst []byte, dec tokenReader
    results: "[]byte, error"
  - doc: appendNumber appends a number as ECMAScript writes its IEEE 754 double.
    name: appendNumber
    params: dst []byte, dec tokenReader
    results: "[]byte, error"
  - doc: |-
      appendFloat appends f as ECMAScript's Number::toString writes it (RFC 8785
      §3.2.2.3): the shortest digits that read back as f, in decimal notation for
      a magnitude from 1e-6 up to 1e21 and in exponent notation outside it, with
      the exponent's sign and no leading zero; -0 is 0. f must be finite.

      That is encoding/json's spelling of a float64, ES6's by design, which
      jsonenc.AppendFloat writes for every emitter of the SDK (#1039) — but for
      the negative zero, which encoding/json writes -0 and ECMAScript 0.
    name: appendFloat
    params: dst []byte, f float64
    results: "[]byte"
  - doc: |-
      appendString appends s as RFC 8785 §3.2.2.2 writes a string: '"' and '\'
      escaped, the control characters as \b \t \n \f \r or \u00xx, everything
      else as itself.
    name: appendString
    params: dst []byte, s string
    results: "[]byte"
  - doc: |-
      appendEscape appends the escape of c, a quote, a backslash or a control
      character.
    name: appendEscape
    params: dst []byte, c byte
    results: "[]byte"
  - doc: appendArray appends an array, its elements canonicalized in order.
    name: appendArray
    params: dst []byte, dec tokenReader
    results: "[]byte, error"
  - doc: |-
      appendObject appends an object: each member's value canonicalized into a
      buffer of the object's own, then the members written in the order of their
      names' UTF-16 code units (§3.2.3).
    name: appendObject
    params: dst []byte, dec tokenReader
    results: "[]byte, error"
  - doc: |-
      readMembers reads an object's members up to and including its closing
      brace: each name, and its value canonicalized into values.
    name: readMembers
    params: dec tokenReader
    results: members []member, values []byte, err error
  - doc: appendMembers writes sorted members as an object, with no whitespace.
    name: appendMembers
    params: dst []byte, members []member, values []byte
    results: "[]byte"
  - doc: |-
      compareUTF16 orders two valid UTF-8 strings by their UTF-16 code units:
      byte order but where a character past U+FFFF — a surrogate pair, 0xD800 up
      — sorts before one from U+E000 to U+FFFF.
    name: compareUTF16
    params: a, b string
    results: int
  - doc: firstUnit is r's first UTF-16 code unit.
    name: firstUnit
    params: r rune
    results: rune
  - doc: notJSON is NotJSON at the reader's offset.
    name: notJSON
    params: dec inputOffsetter
    results: error
