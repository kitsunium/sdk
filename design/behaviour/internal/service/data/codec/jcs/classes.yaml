package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/codec/jcs
  name: jcs
  purpose: "Package jcs writes the JSON Canonicalization Scheme of RFC 8785: one byte form for a JSON document, whatever the order of its members or the spelling of its numbers and strings, so it can be signed or hashed and checked by anyone who canonicalizes the same document."
types:
  - doc: reader is a pooled decoder and the bytes.Reader it reads.
    fields:
      - doc: src is the document being read.
        name: src
        type: bytes.Reader
      - doc: dec reads src with jsontext's defaults, I-JSON's.
        name: dec
        type: "*jsontext.Decoder"
    kind: struct
    name: reader
  - doc: |-
      member is one object member, canonicalized: its name, and where its value's
      canonical bytes sit in the object's buffer.
    fields:
      - doc: name is the member name, unescaped.
        name: name
        type: string
      - doc: start and end delimit the value in the buffer.
        name: start
        type: int
      - doc: start and end delimit the value in the buffer.
        name: end
        type: int
    kind: struct
    name: member
  - doc: "inputOffsetter is what notJSON reads the offset from: the jsontext.Decoder."
    kind: named
    name: inputOffsetter
    underlying: |-
      interface {
      	// InputOffset is the offset of the reader in the document.
      	InputOffset() int64
      }
  - doc: |-
      tokenReader is the part of jsontext.Decoder the canonical writer reads
      with.
    kind: named
    name: tokenReader
    underlying: |-
      interface {
      	inputOffsetter
      	// PeekKind is the kind of the next token, without reading it.
      	PeekKind() jsontext.Kind
      	// ReadToken reads the next token.
      	ReadToken() (jsontext.Token, error)
      	// ReadValue reads the next value whole.
      	ReadValue() (jsontext.Value, error)
      }
vars:
  - doc: |-
      readerPool recycles the reader Canonicalize parses with: a jsontext.Decoder
      carries several kilobytes of state, which a document of a few members —
      a JWK's required members — would otherwise allocate on every call.
    items:
      - name: readerPool
        value: |-
          recycler.NewPool[*reader](func() *reader {
          	//: a decoder over an empty reader, repointed on each use.
          	r := &reader{}
          	r.dec = jsontext.NewDecoder(&r.src)
          	return r
          })
    name: readerPool
