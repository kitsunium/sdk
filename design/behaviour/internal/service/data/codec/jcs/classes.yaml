apiVersion: design/behaviour/v1
constants:
  - doc: The escapes of RFC 8785 §3.2.2.2.
    grouped: true
    items:
      - doc: hexDigits are the lower-case digits of a \u00XX escape.
        name: hexDigits
        value: "\"0123456789abcdef\""
      - doc: |-
          firstPrintable is the first byte RFC 8785 writes as itself: below it
          are the C0 controls, all escaped.
        name: firstPrintable
        type: byte
        value: "0x20"
      - doc: firstSupplementary is the first character UTF-16 writes as a pair.
        name: firstSupplementary
        type: rune
        value: "0x10000"
    name: hexDigits
