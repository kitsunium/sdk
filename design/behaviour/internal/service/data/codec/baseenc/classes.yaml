# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      base45Alphabet is the RFC 9285 §3 table: indices 0..44 map to these
      runes. All printable ASCII, QR-code "alphanumeric mode" safe.
    items:
      - name: base45Alphabet
        type: string
        value: "\"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:\""
    name: base45Alphabet
  - grouped: true
    items:
      - doc: base45Radix is the alphabet size; a byte pair encodes into base 45³.
        name: base45Radix
        type: int
        value: "45"
      - doc: base45RadixSq is base45Radix² — the place value of the third digit.
        name: base45RadixSq
        type: int
        value: base45Radix * base45Radix
      - doc: base45GroupChars is the encoded char count for one input byte-pair.
        name: base45GroupChars
        type: int
        value: "3"
      - doc: base45TailChars is the encoded char count for a trailing single byte.
        name: base45TailChars
        type: int
        value: "2"
      - doc: base45PairBytes is the input byte count per encoded 3-char group.
        name: base45PairBytes
        type: int
        value: "2"
      - doc: base45HighShift is the bit shift isolating the high byte of a pair.
        name: base45HighShift
        type: int
        value: "8"
      - doc: base45TableSize is the reverse-lookup table span — every byte value.
        name: base45TableSize
        type: int
        value: "256"
      - doc: base45NotMember marks a byte absent from the alphabet in the table.
        name: base45NotMember
        type: int
        value: "-1"
      - doc: |-
          base45MaxPair is the largest value a 3-char group may decode to: a
          byte pair is 0..0xFFFF, so any triple above this is malformed input.
        name: base45MaxPair
        type: int
        value: "0xFFFF"
      - doc: |-
          base45MaxSingle is the largest value a trailing 2-char group may
          decode to: a single byte is 0..0xFF.
        name: base45MaxSingle
        type: int
        value: "0xFF"
    name: base45Radix
  - doc: |-
      base58Alphabet is the Bitcoin Base58 alphabet (the ASCII alphanumerics
      minus the visually ambiguous 0, O, I and l).
    items:
      - name: base58Alphabet
        type: string
        value: "\"123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz\""
    name: base58Alphabet
  - grouped: true
    items:
      - doc: base58Radix is the Base58 alphabet size.
        name: base58Radix
        type: int
        value: "58"
      - doc: |-
          maxConvBytes caps the RAW (pre-encode) input of the O(n²) base-conversion
          variants (Base58/Base62) at 4 KiB. base-conversion is quadratic, so even a
          few KiB bounds the work to the low-millisecond range; bulk data belongs in
          a block codec (base64). Enforced on the raw bytes at Marshal/Append.
        name: maxConvBytes
        type: int
        value: 4 * 1024
      - doc: |-
          maxConvEncodedBytes caps the ENCODED text at Unmarshal. Base58/Base62
          EXPAND raw→encoded by ~1.37× (log(256)/log(58|62)), so a maxConvBytes raw
          input encodes to ~5.5 KiB; capping the encoded side at the raw cap would
          make a freshly-Marshalled value un-Unmarshalable. 2× covers the expansion
          with margin while still bounding the quadratic decode work.
        name: maxConvEncodedBytes
        type: int
        value: 2 * maxConvBytes
    name: base58Radix
  - doc: |-
      base62Alphabet is the conventional Base62 alphabet: digits, then uppercase,
      then lowercase ASCII letters.
    items:
      - name: base62Alphabet
        type: string
        value: "\"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\""
    name: base62Alphabet
  - doc: base62Radix is the Base62 alphabet size.
    items:
      - name: base62Radix
        type: int
        value: "62"
    name: base62Radix
  - doc: byteBase is the radix of the input/output byte stream (one byte = base 256).
    items:
      - name: byteBase
        type: int
        value: "256"
    name: byteBase
  - doc: |-
      maxBaseEncBytes caps Unmarshal input at 10 MiB; bigger inputs surface
      CodeBaseEncSizeExceeded so memory-exhaustion attacks via huge base-N
      payloads (CWE-400) cannot reach the stdlib decoder.
    items:
      - name: maxBaseEncBytes
        type: int
        value: 10 * 1024 * 1024
    name: maxBaseEncBytes
  - doc: |-
      hexUpperAlphabet is the uppercase hex alphabet. The stdlib keeps its
      lowercase twin unexported, and base16 is defined on this one (RFC 4648
      §8), so the four lines that use it are the whole reason base16 does not
      post-process hex.Encode's output.
    items:
      - name: hexUpperAlphabet
        type: string
        value: "\"0123456789ABCDEF\""
    name: hexUpperAlphabet
  - grouped: true
    items:
      - doc: hexDigitsPerByte is how many output characters one input byte produces.
        name: hexDigitsPerByte
        type: int
        value: "2"
      - doc: hexNibbleBits is the shift that isolates a byte's high nibble.
        name: hexNibbleBits
        type: int
        value: "4"
      - doc: hexNibbleMask isolates a byte's low nibble.
        name: hexNibbleMask
        value: byte(0x0F)
    name: hexDigitsPerByte
  - grouped: true
    items:
      - doc: variantBase64 is the RFC 4648 standard base64 alphabet with padding.
        name: variantBase64
        type: variant
        value: iota
      - doc: variantBase64URL is the RFC 4648 URL-safe base64 alphabet with padding.
        name: variantBase64URL
      - doc: variantBase32 is the RFC 4648 standard base32 alphabet with padding.
        name: variantBase32
      - doc: variantBase16 is uppercase hexadecimal (RFC 4648).
        name: variantBase16
      - doc: |-
          variantHex is lowercase hexadecimal — distinct codec from base16 to let
          callers pick the alphabet via Format.
        name: variantHex
      - doc: variantASCII85 is Adobe's Ascii85 encoding.
        name: variantASCII85
      - doc: |-
          variantBase45 is RFC 9285 Base45 (QR-code alphanumeric safe). No stdlib
          backing — see base45.go for the transform.
        name: variantBase45
      - doc: |-
          variantBase58 is Bitcoin Base58 — a base-conversion (O(n²)) encoding for
          short identifiers; see base58.go / base_convert.go.
        name: variantBase58
      - doc: variantBase62 is Base62 (0-9A-Za-z) — base-conversion (O(n²)), like base58.
        name: variantBase62
    name: variantBase64
