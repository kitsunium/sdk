            - case: variantBase64
              do:
                - return: base64.NewEncoder(base64.StdEncoding, w)
                  to: base64
            - case: variantBase64URL
              do:
                - return: base64.NewEncoder(base64.URLEncoding, w)
                  to: base64
            - case: variantBase32
              do:
                - return: base32.NewEncoder(base32.StdEncoding, w)
                  to: base32
            - case: variantBase16, variantBase45, variantBase58, variantBase62
              do:
                - return: "&bufferingWriter{dst: w, codec: c}"
            - case: variantHex
              do:
                - return: "nopWriteCloser{Writer: hex.NewEncoder(w)}"
            - case: variantASCII85
              do:
                - return: ascii85.NewEncoder(w)
                  to: ascii85
          "on": c.variant
      - return: "nopWriteCloser{Writer: w}"
  - of: (*baseencCodec).streamReader
    participants:
      - id: caller
        kind: actor
      - id: (*baseencCodec).streamReader
        kind: self
      - id: base64
        kind: stdlib
      - id: base32
        kind: stdlib
      - id: hex
        kind: stdlib
      - id: ascii85
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: variantBase64
              do:
                - return: base64.NewDecoder(base64.StdEncoding, r)
                  to: base64
            - case: variantBase64URL
              do:
                - return: base64.NewDecoder(base64.URLEncoding, r)
                  to: base64
            - case: variantBase32
              do:
                - return: base32.NewDecoder(base32.StdEncoding, r)
                  to: base32
            - case: variantBase16, variantHex
              do:
                - return: hex.NewDecoder(r)
                  to: hex
            - case: variantASCII85
              do:
                - return: ascii85.NewDecoder(r)
                  to: ascii85
            - case: variantBase45, variantBase58, variantBase62
              do:
                - return: "&decodeAllReader{src: r, v: c.variant}"
          "on": c.variant
      - return: r
  - of: convSizeExceeded
    participants:
      - id: caller
        kind: actor
      - id: convSizeExceeded
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncSizeExceeded,
          		Reason:  "BASE_ENC_SIZE_EXCEEDED",
          		Public:  "base-N input exceeds size limit",
          		Private: where,
          	})
        to: errs
  - of: wrapDecode
    steps:
      - opt:
          do:
            - return: out, nil
          when: derr == nil
      - return: |-
          nil, errs.Wrap(derr, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncDecodeFailed,
          		Reason:  "BASE_ENC_DECODE_FAILED",
          		Public:  "base-N decoding failed",
          		Private: "service/data/codec/baseenc: stdlib base-N decoder returned an error",
          	})
  - of: decodeASCII85
    participants:
      - id: caller
        kind: actor
      - id: decodeASCII85
        kind: self
      - id: ascii85
        kind: stdlib
      - id: io
        kind: stdlib
    steps:
      - bind: r
        eval: ascii85.NewDecoder(bytes.NewReader(data))
        to: ascii85
      - bind: decoded, rerr
        eval: io.ReadAll(r)
        to: io
      - opt:
          do:
            - return: decoded, nil
          when: rerr == nil
      - return: |-
          nil, errs.Wrap(rerr, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncDecodeFailed,
          		Reason:  "BASE_ENC_DECODE_FAILED",
          		Public:  "base-N decoding failed",
          		Private: "service/data/codec/baseenc: ascii85 decoder returned an error",
          	})
  - of: streamDecodeLimit
    steps:
      - opt:
          do:
            - return: maxConvEncodedBytes
          when: isBaseConversion(v)
      - return: maxBaseEncBytes
  - of: (*decodeAllReader).Read
    participants:
      - id: caller
        kind: actor
      - id: (*decodeAllReader).Read
        kind: self
      - id: streamDecodeLimit
        kind: internal
      - id: io
        kind: stdlib
      - id: "(&baseencCodec{variant: r.v}).decodeBytes"
        kind: internal
      - id: bytes
        kind: stdlib
      - id: r.dec.Read
        kind: value
    steps:
      - opt:
          do:
            - bind: limit
              eval: streamDecodeLimit(r.v)
              to: streamDecodeLimit
            - bind: raw, rerr
              eval: io.ReadAll(io.LimitReader(r.src, int64(limit)+1))
              to: io
            - opt:
                do:
                  - return: 0, rerr
                when: rerr != nil
            - opt:
                do:
                  - return: "0, convSizeExceeded(\"service/data/codec/baseenc: streaming decode input exceeds the size cap\")"
                when: len(raw) > limit
            - bind: decoded, derr
              eval: "(&baseencCodec{variant: r.v}).decodeBytes(raw)"
              to: "(&baseencCodec{variant: r.v}).decodeBytes"
            - opt:
                do:
                  - return: 0, derr
                when: derr != nil
            - set: r.dec
              to: bytes
              value: bytes.NewReader(decoded)
            - set: r.done
              value: "true"
          when: "!r.done"
      - return: r.dec.Read(p)
        to: r.dec.Read
  - of: (*baseencDecoder).Decode
    participants:
      - id: caller
        kind: actor
      - id: (*baseencDecoder).Decode
        kind: self
      - id: stdjson
        kind: stdlib
      - id: d.jsonDec.Decode
        kind: value
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - set: d.jsonDec
              to: stdjson
              value: stdjson.NewDecoder(d.codec().streamReader(d.src))
          when: d.jsonDec == nil
      - bind: jerr
        eval: d.jsonDec.Decode(v)
        to: d.jsonDec.Decode
      - opt:
          do:
            - return: nil
          when: jerr == nil
      - return: |-
          errs.Wrap(jerr, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncUnmarshalFailed,
          		Reason:  "BASE_ENC_UNMARSHAL_FAILED",
          		Public:  "base-N decoding failed",
          		Private: "service/data/codec/baseenc.Decoder.Decode: encoding/json returned an error",
          	})
        to: errs
  - of: (*baseencDecoder).More
    participants:
      - id: caller
        kind: actor
      - id: (*baseencDecoder).More
        kind: self
      - id: d.jsonDec.More
        kind: value
    steps:
      - opt:
          do:
            - return: d.src != nil
          when: d.jsonDec == nil
      - return: d.jsonDec.More()
        to: d.jsonDec.More
  - of: (*baseencDecoder).codec
    steps:
      - return: "&baseencCodec{variant: d.v}"
  - of: (*baseencEncoder).Encode
    participants:
      - id: caller
        kind: actor
      - id: (*baseencEncoder).Encode
        kind: self
      - id: stdjson
        kind: stdlib
      - id: e.jsonEnc.Encode
        kind: value
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - set: e.jsonEnc
              to: stdjson
              value: stdjson.NewEncoder(e.base)
          when: e.jsonEnc == nil
      - bind: jerr
        eval: e.jsonEnc.Encode(v)
        to: e.jsonEnc.Encode
      - opt:
          do:
            - return: nil
          when: jerr == nil
      - return: |-
          errs.Wrap(jerr, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncMarshalFailed,
          		Reason:  "BASE_ENC_MARSHAL_FAILED",
          		Public:  "base-N encoding failed",
          		Private: "service/data/codec/baseenc.Encoder.Encode: encoding/json returned an error",
          	})
        to: errs
  - of: (*baseencEncoder).Close
    participants:
      - id: caller
        kind: actor
      - id: (*baseencEncoder).Close
        kind: self
      - id: e.base.Close
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: cerr
        eval: e.base.Close()
        to: e.base.Close
      - opt:
          do:
            - return: nil
          when: cerr == nil
      - return: |-
          errs.Wrap(cerr, errs.WrapParams{
          		Code:    corebaseenc.CodeBaseEncMarshalFailed,
          		Reason:  "BASE_ENC_MARSHAL_FAILED",
          		Public:  "base-N encoding failed",
          		Private: "service/data/codec/baseenc.Encoder.Close: base-N writer returned an error",
          	})
        to: errs
  - of: nopWriteCloser.Close
    steps:
      - return: nil
  - of: newVariant
    steps:
      - set: _
        value: variantSpecs[v]
      - return: "&baseencCodec{variant: v}"
  - of: (*baseencCodec).spec
    steps:
      - return: "&variantSpecs[c.variant]"
