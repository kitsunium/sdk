# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxDecompressedBytes caps how many plaintext bytes a single Decompress call
      at this layer will materialise. 256 MiB is generous for log/record payloads
      yet bounds a decompression bomb to a known ceiling; callers needing more route
      through the frame layer's ratio-aware guard. A stream exceeding the cap yields
      the scheme's failure sentinel rather than an OOM.
    items:
      - comment: 256 MiB
        name: maxDecompressedBytes
        type: int64
        value: 256 << 20
    name: maxDecompressedBytes
  - grouped: true
    items:
      - doc: |-
          schemeNone tags a box holding no decoder: the state a fresh box leaves
          the factory in, and the state a take restores when a constructor refuses
          the caller's stream and the box goes back empty.
        name: schemeNone
        type: readerScheme
        value: iota
      - doc: schemeGzip tags a box filled by takeGzipReader.
        name: schemeGzip
      - doc: schemeFlate tags a box filled by takeFlateReader.
        name: schemeFlate
      - doc: schemeZlib tags a box filled by takeZlibReader.
        name: schemeZlib
    name: schemeNone
files:
  - decls:
      - maxDecompressedBytes
      - readAllBounded
    name: bounded.go
  - decls: []
    name: doc.go
  - decls:
      - FlateCompressor
      - flateCompressor
      - flateCompressor.Algorithm
      - flateCompressor.Compress
      - flateCompressor.DecompressBounded
      - flateCompressor.Decompress
